      - id: ref7
        bwb_id: BWBR0002399
  - number: '269.4'
    text: |-
      Het bepaalde in de voorgaande leden laat onverlet de aanspraak op bezoldiging volgens het
      uitzicht dat voor de betrokkene kan zijn vastgesteld in zijn kwaliteit als onderwijzer op 31
      juli 1985, als aangegeven in [artikel C1][ref1] dan wel als uitkeringsgenietende bedoeld in
      [artikel C5 van het in het eerste lid genoemde besluit][ref2]. Ten aanzien van dit uitzicht is [artikel 276][ref3]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003808#ArtikelC5
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel276
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0003808
        artikel: C1
      - id: ref2
        bwb_id: BWBR0003808
        artikel: C5
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '276'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '269.5'
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste en derde lid, wordt een periode van langer dan twee
      maanden bedoeld. De tijd waarin een ontslaguitkering als bedoeld in [hoofdstuk I-H van het Rechtspositiebesluit
      onderwijspersoneel](onbekend) zoals [dat hoofdstuk](onbekend) op 28 februari 1994 luidde, dan wel een uitkering
      als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: '270.1'
    text: |-
      In het schooljaar 1998–1999 wordt de maximumschaal die geldt voor de normfuncties directeur en adjunct-directeur
      aan een speciale school voor basisonderwijs, onderscheidenlijk de normfunctie adjunct-directeur aan een afdeling
      van een speciale school voor basisonderwijs, vastgesteld met toepassing van [hoofdstuk I-Q, paragraaf 3, van het
      Rechtspositiebesluit onderwijspersoneel](onbekend) zoals dat op 31 juli 1998 luidde.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel270
  - number: '270.2'
    text: |-
      Indien de speciale school voor basisonderwijs is ontstaan uit een scholengemeenschap voor speciaal of voortgezet
      speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden en moeilijk lerende kinderen, wordt het eerste
      lid ten aanzien van de adjunct-directeur of adjunct-directeuren van de school afzonderlijk toegepast voor de beide
      delen van de voormalige scholengemeenschap, met inachtneming van de gescheiden formatieberekening zoals geldend op
      31 juli 1998.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel270
  - number: '270.3'
    text: |-
      Met ingang van het schooljaar 1999–2000 is de maximumschaal die geldt voor de normfunctie adjunct-directeur aan een
      afdeling van een speciale school voor basisonderwijs gelijk aan schaal 10. Indien genoemde afdeling op grond van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________ (Stb. 1998, 413) aanspraak heeft op 65 formatierekeneenheden voor de schoolleiding, is de maximumschaal
      die geldt voor de normfunctie adjunct-directeur gelijk aan schaal 11.


      [ref1]: https://wetten.overheid.nl/BWBR0009790#ArtikelXLIV
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel270
    references:
      - id: ref1
        bwb_id: BWBR0009790
        artikel: XLIV
  - number: '270.4'
    text: |-
      Bij de vaststelling van de factor y, bedoeld in [artikel 130, onder e][ref1], voor een speciale school voor
      basisonderwijs, blijven de leerlingen van een afdeling van die school buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel130
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel270
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '130'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '271.1'
    text: |-
      De betrokkene die bij het bevoegd gezag van een speciale school voor basisonderwijs gedurende de schooljaren 1997–
      1998 en 1998–1999 was benoemd in dezelfde functie als bedoeld in [hoofdstuk I-Q van het Rechtspositiebesl uit
      onderwijspersoneel](onbekend) zoals [dat hoofdstuk](onbekend) luidde direct voor het tijdstip van inwerkingtreding
      van dit besluit, waarbij dezelfde maximumschaal hoorde, behoudt met ingang van het schooljaar 1999–2000 aanspraak
      op bezoldiging volgens het carrièrepatroon dat hoort bij de functie met die maximumschaal zolang hij in de
      desbetreffende functie, dan wel in een functie als bedoeld in [titel 13 van hoofdstuk 1][ref1], aan dezelfde
      instelling of instellingen benoemd blijft. Onder maximumschaal in dit lid wordt de maximumschaal verstaan die
      volgens het [Formatiebesluit ISOVSO 1992][ref2] beschikbaar was voor de desbetreffende functie.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0005442
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005442
  - number: '271.2'
    text: |-
      De betrokkene die werkzaam is aan een speciale school voor basisonderwijs met een afdeling
      voor voortgezet speciaal onderwijs en voor wie een salarisuitzicht geldt als bedoeld in
      [artikel C1, vijfde lid, van het Besluit overgangsmaatregelen s.o. 1985][ref1], behoudt aanspraak op vaststelling
      van zijn salaris overeenkomstig dat uitzicht indien hij werkzaam blijft aan genoemde school nadat de afdeling ervan
      is omgevormd tot of samengevoegd met een school voor voortgezet onderwijs. De aanspraak blijft voorts behouden
      indien de betrokkene uit hoofde van zijn bestuursaanstelling werkzaamheden gaat verrichten ten behoeve van andere
      scholen van hetzelfde bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0003808
        artikel: C1
  - number: '271.3'
    text: |-
      De betrokkene die bij het bevoegd gezag van een speciale school voor basisonderwijs is benoemd in een functie als
      bedoeld in [titel 12 van hoofdstuk 1][ref1], en voor wie een salarisuitzicht geldt als bedoeld in het eerste lid,
      [artikel 127, tweede of derde lid][ref2], of [artikel C1 van het Besluit overgangsmaatregelen s.o. 1985][ref3],
      behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht bij een herplaatsing overeenkomstig
      __REF003___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ___________________________. Deze aanspraak geldt zolang de betrokkene bij het bevoegd gezag waarbij hij is
      herplaatst in dezelfde functie benoemd blijft. Indien aan de betrokkene uit deze functie ontslag wordt verleend,
      wordt hij voor de toepassing van [artikel 268][ref5] of [269][ref6] in deze functie geacht benoemd te zijn gebleven
      in de functie die hij vervulde voordat hij in eerstgenoemde functie werd benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel127
      [ref3]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref4]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLII
      [ref5]: https://wetten.overheid.nl/BWBR0015136#Artikel268
      [ref6]: https://wetten.overheid.nl/BWBR0015136#Artikel269
