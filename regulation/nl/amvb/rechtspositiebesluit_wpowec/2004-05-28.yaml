  - number: 1.k
    text: 'pensioenreglement: het pensioenreglement van de Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.l
    text: |-
      pensioen: een pensioen als bedoeld in en vastgesteld bij of krachtens de [Wet privatisering ABP][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: 1.m
    text: 'schooljaar: het administratieve schooljaar, zijnde het tijdvak van 1 augustus tot en met 31 juli;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.n
    text: |-
      benoeming of aanstelling: de benoeming in algemene dienst van een bevoegd gezag,
      bedoeld in [artikel 34, eerste lid, van de Wet op het primair onderwijs][ref1] dan wel
      [artikel 34, eerste lid, van de Wet op de expertisecentra][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel34
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
