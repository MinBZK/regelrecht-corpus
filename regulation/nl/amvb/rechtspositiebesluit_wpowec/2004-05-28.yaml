  - number: '277.4'
    text: |-
      De betrokkene die is benoemd in een functie als bedoeld in [titel 13 van hoofdstuk 1][ref1] ten behoeve van het
      verrichten van werkzaamheden aan een school voor voortgezet speciaal onderwijs aan moeilijk lerende kinderen
      of een afdeling voor voortgezet speciaal onderwijs aan moeilijk lerende kinderen van een speciale school voor
      basisonderwijs en voor wie een aanspraak of garantie geldt als bedoeld in het tweede of derde lid, behoudt die
      aanspraak of garantie indien genoemde afdeling wordt omgevormd tot een school voor praktijkonderwijs als bedoeld
      in de [Wet op het voortgezet onderwijs][ref2] en zijn benoeming wordt voortgezet ten behoeve van het verrichten van
      werkzaamheden aan die school. Het tweede lid, tweede en derde volzin, en het derde lid, tweede tot en met vijfde
      volzin, zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel277
