        artikel: '262'
        hoofdstuk: '5'
  - number: '273.3'
    text: |-
      De betrokkene die op grond van het eerste lid aanspraak maakte op een salarisverhoging, en in die functie,
      bedoeld in het eerste lid, blijft benoemd, heeft met ingang van 1 augustus van het jaar, bedoeld in
      [bijlage 2, onderdeel 7][ref1], aanspraak op een toelage als bedoeld in [bijlage 2, onder deel 6][ref2],
      overeenkomstig de bij de functie behorende maximumschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0015136
      - id: ref2
        bwb_id: BWBR0015136
  - number: '273.4'
    text: |-
      De betrokkene die geen aanspraak maakte op een salarisverhoging op grond van het eerste lid, uitsluitend om de
      reden dat hij op 1 januari 2000 niet voldeed aan de promotiecriteria, bedoeld in [artikel 152 , eerste lid][ref1],
      en in de functie, bedoeld in het eerste lid, blijft benoemd, heeft met ingang van 1 augustus volgend op het jaar
      waarin hij is bezoldigd naar het maximumsalaris van de bij zijn functie behorende maximumschaal aanspraak op de
      op hem van toepassing zijnde toelage, bedoeld in [bijlage 2, onderdeel 6][ref2], indien hij voor 1 augustus 2001
      alsnog aan die promotiecriteria voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '152'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
  - number: '273.5'
    text: |-
      De betrokkene die op grond van het tweede, het derde of het vierde lid aanspraak heeft op een maandelijkse toelage
      en die op enig moment na 1 januari 2000 wordt benoemd in een functie als bedoeld in [titel 13 van hoofdstuk 1][ref1]
      met dezelfde maximumschaal als die direct voorafgaand aan die benoeming voor hem gold, behoudt die aanspraak. De
      tijd waarin een uitkering ingevolge het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref2] werd genoten,
      wordt niet als onderbreking van het dienstverband aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006445
  - number: '273.6'
    text: |-
      De toelage, bedoeld in het tweede, het derde, het vierde en het vijfde lid, bedraagt een evenredig deel van het
      in [bijlage 2, onderdeel 6][ref1], bedoelde maandbedrag rekenkundig afgerond op centen, indien de betrokkene een
      betrekkingsomvang anders dan een normbetrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '274.1'
    text: |-
      Van de betrokkene die op 31 december 1999 was benoemd in een functie als bedoeld in
      [titel 13 van hoofdstuk 1][ref1] en die op 31 januari 2000 wordt benoemd in een functie als bedoeld in
      [titel 12][ref2] of [14 van hoofdstuk 1][ref3], wordt ten behoeve van de vaststelling van het salaris in de nieuwe
      functie, het in die vorige onderwijsfunctie genoten salaris onverminderd [artikel 152, eerste lid][ref4], en
      met inachtneming van het toen voor hem geldende carrièrepatroon, vastgesteld op een salarisbedrag dat is gelegen
      onmiddellijk boven het bedrag dat hij op 31 december 1999 genoot indien is voldaan aan een van de voorwaarden,
      bedoeld in [artikel 151, eerste lid, onder a, b en c ][ref5]. De eerste volzin is niet van toepassing op de
      betrokkene die wordt benoemd in een functie als benoemd in [artikel 91, tweede lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Artikel152
      [ref5]: https://wetten.overheid.nl/BWBR0015136#Artikel151
      [ref6]: https://wetten.overheid.nl/BWBR0015136#Artikel91
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel274
    references:
      - id: ref1
