        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '273'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '274.3'
    text: |-
      Op de betrokkene die op 1 januari 2000 wordt benoemd in een functie als bedoeld in [titel 13 van hoofdstuk 1][ref1]
      met dezelfde maximumschaal als welke direct voorafgaand aan die benoeming voor hem gold, en wiens salaris
      op grond van het eerste lid hoger werd vastgesteld en die voorts in diezelfde functie benoemd blijft, is
      [artikel 273, derde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel273
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel274
