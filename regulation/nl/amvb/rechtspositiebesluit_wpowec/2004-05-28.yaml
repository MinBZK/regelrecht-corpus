  - number: 295a.5
    text: |-
      Ten aanzien van het kalenderjaar 2002 worden de verwijzingen naar de [Wet op de loonbelasting 1964][ref1] in
      [artikel 107, eerste lid, van dit besluit][ref2] aangevuld met [artikel 11, eerste lid, onder r][ref3], en
      [artikel 31, tweede lid, onder g][ref4], zoals die wetsartikelen luidden in het kalenderjaar 2002.


