  - number: '276.2'
    text: |-
      Zonodig in afwijking van het eerste lid vervalt voor de betrokkene de aanspraak op vaststelling van zijn salaris
      overeenkomstig het uitzicht, bedoeld in [artikel C1, vijfde lid, van het in het eerste lid genoemde besluit][ref1],
      met ingang van de datum waarop hij niet langer werkzaam is aan een school voor voortgezet speciaal
      onderwijs of een school of instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref2], een speciale school voor basisonderwijs met een afdeling voor voortgezet
      speciaal onderwijs als bedoeld in de [Wet op het primair onderwijs][ref3] of een school voor praktijkonderwijs als
      bedoeld in de [Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420
      [ref4]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel276
    references:
      - id: ref1
        bwb_id: BWBR0003808
        artikel: C1
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0003420
      - id: ref4
        bwb_id: BWBR0002399
  - number: '276.3'
    text: |-
      De betrokkene voor wie als leraar een uitzicht is vastgesteld als bedoeld in [artikel C1, vijfde lid][ref1], van
      het in het eerste lid genoemde besluit en die op grond van het tweede lid zijn aanspraak op vaststelling van zijn
      salaris overeenkomstig dit uitzicht verliest, verkrijgt daarna slechts aanspraak op vaststelling van zijn salaris
      overeenkomstig het uitzicht, bedoeld in [artikel C1, vijfde lid , van het in het eerste lid genoemde besluit][ref2],
      indien hij vóór 1 augustus 2000 een functie bedoeld in [titel 13 van hoofdstuk 1][ref3] met maximumschaal 10
      aanvaardt aan een school voor voortgezet speciaal onderwijs of een school of instelling voor speciaal en voortgezet
      speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref4], een afdeling voor voortgezet speciaal
      onderwijs van een speciale school voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref5]
      of een school voor praktijkonderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref6], mits
      hij vanaf 1 augustus 1985 zonder wezenlijke onderbreking werkzaam is geweest in een functie in het
      speciaal onderwijs, het voortgezet speciaal onderwijs of het voortgezet onderwijs, als bedoeld in de
      [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref7], onderscheidenlijk het onderwijs
      als bedoeld in de eerste volzin van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0003549
      [ref5]: https://wetten.overheid.nl/BWBR0003420
      [ref6]: https://wetten.overheid.nl/BWBR0002399
      [ref7]: https://wetten.overheid.nl/BWBR0003549
