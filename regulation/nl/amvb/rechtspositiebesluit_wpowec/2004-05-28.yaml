    text: |-
      Indien de betrekkingsomvang van een betrokkene die uitsluitend is benoemd voor het verrichten van
      vervangingswerkzaamheden, tijdelijk is uitgebreid op grond van het eerste lid, wordt die tijdelijke uitbreiding bij
      beëindiging van eerstbedoelde vervangingswerkzaamheden omgezet in een benoeming.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel167
  - number: '168.1'
    text: |-
      Voor de betrokkene die is benoemd in verband met de vervanging van een leraar wordt voor de vaststelling van
      de factor r in [artikel 97, tweede lid][ref1], de werktijdfactor per dag gelijkgesteld met 0,2306, per ochtend
      met 0,1356 en per middag met 0,095. De werktijdfactor voor een dag waarop aan de school structureel uitsluitend
      gedurende de ochtend onderwijs wordt gegeven, is bepaald op 0,1628.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel97
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '97'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '168.2'
    text: |-
      Indien de in het eerste lid bedoelde vervanging geschiedt voor korter dan een ochtend dan wel een middag, wordt
      voor de vaststelling van de factor r in [artikel 97, tweede lid][ref1], het feitelijk aantal uren bepaald op de
      uitkomst van de formule I x 1,5385, waarbij I gelijk is aan het aantal uren waarop de betrokkene op die dag wordt
      belast met het geven van onderwijs, bedoeld in de taakkarakteristiek.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel97
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '97'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '169.1'
    text: |-
      Voor de betrokkene, bedoeld in [artikel 142, onder a][ref1], wiens benoeming als directeur anders dan wegens ziekte
      en arbeidsongeschiktheid wordt beëindigd en die werd bezoldigd volgens de bij deze functie behorende maximumschaal
      op een bedrag dat hoger is dan het hoogste bedrag in de aanloopschaal van een leraar wordt, in afwijking van
      [artikel 112, eerste lid][ref2], voor zijn functie waarop titel 13 van hoofdstuk 1 van toepassing is, bij hetzelfde
      bevoegd gezag aan dezelfde instelling of instellingen een aantal rekeneenheden verbruikt dat overeenkomt met het
      aantal rekeneenheden dat behoorde bij zijn functie als directeur. De eerste volzin is niet van toepassing indien
      op grond van [artikel 155, eerste lid][ref3], het salaris van de betrokkene reeds kon worden vastgesteld volgens de
      bij zijn functie behorende maximumschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel112
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel155
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '142'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '112'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '155'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '169.2'
    text: |-
      Het eerste lid is niet van toepassing op een directeur van wie de betrekking is opgeheven wegens samenvoeging
      van de desbetreffende instelling of instellingen waaraan de directeur is verbonden, met een of meer andere
      instellingen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel169
  - number: '169.3'
    text: |-
      Het verbruik van rekeneenheden wordt in gevallen, bedoeld in het tweede lid, berekend met inachtneming van de in
      [artikel 7, tweede lid][ref1], bedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel7
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '7'
        hoofdstuk: '1'
  - number: '170.1'
    text: |-
      Voor de betrokkene bedoeld in [artikel 142, onder b][ref1], wiens benoeming als leraar tevens adjunct-
      directeur anders dan wegens ziekte en arbeidsongeschiktheid wordt beëindigd, wordt in afwijking van
      [artikel 112, eerste lid][ref2], voor zijn functie als leraar bij hetzelfde bevoegd gezag aan dezelfde instelling
      of instellingen een aantal rekeneenheden verbruikt dat overeenkomt met het aantal rekeneenheden dat behoorde bij
      zijn functie als leraar tevens adjunct-directeur, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel112
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '142'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '112'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 170.1.a
    text: |-
      de betrokkene als leraar tevens adjunct-directeur werd bezoldigd volgens de bij die functie behorende maximumschaal
      op een bedrag dat hoger is dan het hoogste bedrag in de aanloopschaal behorende bij de functie van leraar, of
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel170
  - number: 170.1.b
    text: |-
      op de betrokkene [artikel 148][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel148
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '148'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '170.2'
    text: |-
      Het eerste lid is niet van toepassing voor de betrokkene, bedoeld in [artikel 142, onder b][ref1], voor wie de
      beëindiging van de benoeming als leraar tevens adjunct-directeur het gevolg is van een gelijktijdige daling van
      het aantal formatierekeneenheden, bedoeld in [artikel 16, derde en vierde lid, van het Formatiebesluit WEC][ref2]
      van 236 naar 171, 98 of 65, van 171 naar 65, van 131 naar 98 of 65, van 98 naar 65 formatierekeneenheden en in
      redelijkheid niet van het bevoegd gezag kon worden gevergd dat deze functie van leraar tevens adjunct-directeur in
      de formatie zou worden gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0005442#Artikel16
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '142'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005442
        artikel: '16'
  - number: '171.1'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel171
  - number: 171.1.a
    text: |-
      betrokkene: de betrokkene, bedoeld in [artikel 1, onderdeel e][ref1], voor zover het betreft een lid van het
      onderwijsondersteunend personeel;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 171.1.b
    text: 'salaris per uur: 1/166 deel van het salaris bij een normbetrekking.'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel171
  - number: '171.2'
    text: |-
      Voor zover uit het eerste lid niet anders blijkt, zijn in deze titel de begripsbepalingen van de
      [artikelen 83][ref1] en [109][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel109
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '83'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '109'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '172.1'
    text: |-
      Aan iedere instelling kan onderwijsondersteunend personeel verbonden zijn voor zover dit binnen de door het bevoegd
      gezag vastgestelde formatie mogelijk is.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel172
  - number: '172.2'
    text: In de paragrafen 3 en 4 wordt voor elke normfunctie de bijbehorende maximumschaal aangegeven.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel172
  - number: '172.3'
    text: |-
      Bij elke maximumschaal behoort een aanloopschaal als aangegeven in onderstaand schema.








                    Aanloopschaal


                    Maximumschaal


                    Aanloopschaal


                    Maximumschaal






                    –


                    1


                    8


                    9




                    –


                    2


                    8


                    10




                    2


                    3


                    10


                    11




                    3


                    4


                    11


                    12




                    4


                    5


                    12


                    13




                    5


                    6






                    6


                    7






                    7


                    8
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel172
  - number: '173.1'
    text: |-
      Bij de functie van de betrokkene die is benoemd op grond van artikel 9 van de Regeling extra werkgelegenheid voor
      langdurig werklozen 1995, behoort maximumschaal 1.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel173
  - number: '173.2'
    text: |-
      In afwijking van [artikel 172][ref1] behoort bij de maximumschaal die geldt voor de betrokkene, bedoeld in het
      eerste lid, een aanlooptraject.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel172
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '172'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '173.3'
    text: De functie van de betrokkene, bedoeld in het eerste lid, komt uitsluitend ten laste van eigen middelen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel173
  - number: '174.1'
    text: |-
      Bij de benoeming van de betrokkene wordt het salaris na toepassing van de [artikelen 89 tot en met 93][ref1]
      vastgesteld in de hoogst mogelijke schaal van het carrièrepatroon dat behoort bij zijn functie.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel89
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '89'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '174.2'
    text: |-
      Indien de betrokkene direct voorafgaand aan zijn benoeming een onderwijsfunctie heeft vervuld waarin hij
      laatstelijk reeds voor de duur van een jaar werd bezoldigd naar een bedrag vermeld achter het voorlaatste
      salarisnummer beginnend met de letter U van een van dezelfde schalen 1 tot en met 4 als die waarin het salaris,
      bedoeld in het eerste lid, wordt vastgesteld, wordt die periode van tenminste een jaar in mindering gebracht op de
      periode van twee jaar, bedoeld in [artikel 95, tweede lid][ref1], in die nieuwe functie.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel95
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '95'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '174.3'
    text: |-
      Indien aan de functie waarin betrokkene werkzaam is als gevolg van herwaardering een hogere maximumschaal wordt
      verbonden, wordt het salaris vastgesteld op de in het eerste lid aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel174
  - number: '175.1'
    text: |-
      Bij de benoeming van de betrokkene, bedoeld in [artikel 173, eerste lid][ref1], zijn de
      [artikelen 89 tot en met 93][ref2] en [artikel 174][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel174
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '173'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '89'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '174'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '175.2'
    text: |-
      Behoudens het derde lid wordt het salaris van de in het eerste lid bedoelde betrokkene bij zijn benoeming
      vastgesteld op het laagste bedrag van het aanlooptraject.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel175
  - number: '175.3'
    text: |-
      In afwijking van het tweede lid wordt het salaris van de in het eerste lid bedoelde betrokkene die de leeftijd van
      23 jaar nog niet heeft bereikt, bij zijn benoeming vastgesteld overeenkomstig het wettelijk minimumjeugdloon dat
      bij zijn leeftijd behoort.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel175
  - number: '176'
    text: |-
      Zodra aan de betrokkene, wiens salaris wordt vastgesteld volgens de aanloopschaal, op grond van [artikel 95][ref1]
      een periodieke verhoging wordt toegekend en deze daarmee een salaris krijgt dat gelijk is aan of hoger is dan het
      laagste bedrag in de maximumschaal, wordt zijn salaris bepaald op het naasthogere bedrag in de bij zijn functie
      behorende maximumschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel95
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '95'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '177'
    text: |-
      Indien aan de betrokkene, bedoeld in [artikel 173, eerste lid][ref1], wiens salaris wordt vastgesteld volgens
      nummer 2 van het aanlooptraject, op grond van [artikel 95][ref2] een periodieke verhoging wordt toegekend, wordt
      zijn salaris bepaald op het bedrag dat in schaal 1 is vermeld bij salarisnummer 0.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel95
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '173'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '95'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '178.1'
    text: |-
      De functie van de betrokkene wordt vervuld binnen de gebouwen of ruimten waarin de instelling of instellingen zijn
      gehuisvest en op de daarbij behorende terreinen, tenzij de aard van de te verrichten werkzaamheden zich daartegen
      verzet.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel178
  - number: '178.2'
    text: |-
      Het bevoegd gezag stelt na overleg met de betrokkene zo mogelijk aan het begin van het school-, cursus- dan wel
      kalenderjaar een werktijdenregeling vast. De werktijdenregeling wordt met instemming van de betrokkene vastgesteld
      indien in deze regeling is bepaald dat arbeidsduurverkorting niet in regelmatige terugkerende perioden van een week
      wordt genoten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel178
  - number: '178.3'
    text: |-
      Het bevoegd gezag stelt na overleg met de betrokkene de dagelijkse werktijden vast, waarbij doorgaans per dag niet
      meer dan 8 uur wordt gewerkt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel178
  - number: '178.4'
    text: |-
      Van de op grond van het tweede en derde lid vastgestelde tijden wordt in opdracht van het bevoegd gezag na overleg
      met de betrokkene incidenteel afgeweken, indien om school-organisatorische redenen de werkzaamheden noodzakelijk op
      andere tijden dan bedoeld in het tweede lid moeten worden verricht.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel178
  - number: '179.1'
    text: |-
      Aan de betrokkene voor wie het salaris wordt vastgesteld volgens één der schalen 1 tot en met 10 en die in opdracht
      van het bevoegd gezag overwerk verricht, wordt, behoudens het derde lid, een vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: '179.2'
    text: |-
      Onder overwerk wordt verstaan arbeid verricht buiten de voor de betrokkene vastgestelde dagelijkse werktijd, voor
      zover daardoor deze werktijd wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: '179.3'
    text: |-
      Voor overwerk dat gedurende korter dan een half uur aansluitend aan de vastgestelde dagelijkse werktijd wordt
      verricht, wordt geen vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: '179.4'
    text: 'De vergoeding voor overwerk bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: 179.4.a
    text: |-
      voor betrokkene verbonden aan een instelling als bedoeld in [artikel 1, onderdeel d, onder 2° en 3°][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 179.4.a.1
    text: verlof, gelijk aan het aantal uren overschrijding van de voor de betrokkene vastgestelde dagelijkse werktijd, en
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: 179.4.a.2
    text: extra verlof, dat voor elk uur een percentage van die overschrijding is.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: 179.4.b
    text: |-
      voor betrokkenen verbonden aan een instelling als bedoeld in [artikel 1, onderdeel d, onder 1°][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 179.4.b.1
    text: verlof, gelijk aan het aantal uren overschrijding van de voor de betrokkene vastgestelde dagelijkse werktijd, en
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: 179.4.b.2
    text: |-
      een bedrag in geld, dat voor elk uur van die overschrijding een percentage van het voor betrokkene geldende salaris
      per uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: '179.5'
    text: |-
      De vergoeding in verlof wordt zo spoedig mogelijk toegekend, doch in de regel niet later dan in de kalendermaand
      volgende op die waarin de overschrijding plaats had, waarbij zoveel mogelijk rekening wordt gehouden met de wensen
      van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: '179.6'
    text: |-
      Indien naar het oordeel van het bevoegd gezag het dienstbelang zich verzet tegen het toekennen van verlof, bedoeld
      in het vierde lid, onder b1 wordt in plaats van dit verlof voor ieder uur een bedrag in geld toegekend gelijk aan
      het voor de betrokkene geldende salaris per uur.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: '179.7'
    text: 'Het in het vierde lid bedoelde percentage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: 179.7.a
    text: |-
      behoudens het gestelde onder b en c, het getal, vermeld in de onderstaande tabel:









                        Overwerk verricht


                        Op zondag


                        Op maandag


                        Op dinsdag, woensdag, donderdag of vrijdag


                        Op zaterdag






                        tussen 0 en 6 uur


                        100


                        100


                        50


                        50




                        tussen 6 en 18 uur


                        100


                        25


                        25


                        50




                        tussen 18 en 20 uur


                        100


                        25


                        25


                        75




                        tussen 20 en 24 uur


                        100


                        50


                        50


                        75
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: 179.7.b
    text: |-
      50, indien gedurende langer dan twee uur overwerk is verricht, voor zover het overwerk betreft, dat na de eerste
      twee uur is verricht op maandag, dinsdag, woensdag, donderdag of vrijdag tussen 6 en 20 uur, behoudens het gestelde
      onder c;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: 179.7.c
    text: |-
      100, indien het overwerk is verricht op een met de zondag gelijkgestelde dag, dan wel op de daarop volgende dag
      tussen 0 en 6 uur.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: '179.8'
    text: |-
      Voor het vaststellen van de duur van de overschrijding gelden de uren waarop krachtens het vierde lid of krachtens
      titel 3 van dit hoofdstuk vakantie of verlof is genoten, als uren waarop is gewerkt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel179
  - number: '180.1'
    text: |-
      Aan de betrokkene voor wie het salaris wordt vastgesteld volgens een der schalen 1 tot en met 10 en die anders
      dan bedoeld in [artikel 179][ref1] regelmatig of vrij regelmatig arbeid verricht op andere tijden dan op de dagen
      maandag tot en met vrijdag tussen 8 en 18 uur, wordt een toelage toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel179
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '179'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '180.2'
    text: 'De toelage bedraagt per gewerkt uur een percentage van het voor betrokkene geldende salaris per uur en wel:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel180
  - number: 180.2.a
    text: 20% voor de uren op maandag tot en met vrijdag tussen 6 en 8 uur en tussen 18 en 22 uur;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel180
  - number: 180.2.b
    text: 40% voor de uren op maandag tot en met vrijdag tussen 0 en 6 uur en tussen 22 en 24 uur;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel180
  - number: 180.2.c
    text: 45% voor de uren op zaterdag;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel180
  - number: 180.2.d
    text: 70% voor de uren op zondag;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel180
  - number: 180.2.e
    text: |-
      100% voor de uren op feestdagen, met dien verstande dat genoemde percentages worden berekend over ten hoogste het
      salaris behorende bij salarisnummer 10 van schaal 7.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel180
  - number: '180.3'
    text: |-
      Voor de in het tweede lid, onder a, genoemde uren wordt de toelage slechts toegekend, indien de arbeid is
      aangevangen vóór 7 uur, respectievelijk is beëindigd na 19 uur.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel180
  - number: '180.4'
    text: |-
      In afwijking van het eerste en tweede lid ontvangt de betrokkene met ingang van de maand waarin hij de leeftijd van
      55 jaar bereikt een vaste toelage, mits hij op dat moment gedurende tenminste 5 jaar zonder wezenlijke onderbreking
      een toelage als bedoeld in het eerste lid heeft genoten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel180
  - number: '180.5'
    text: |-
      De toelage, bedoeld in het vierde lid, wordt vastgesteld op het bedrag dat de betrokkene over de twaalf
      kalendermaanden direct voorafgaande aan de maand waarin hij de leeftijd van 55 jaar bereikt gemiddeld per maand aan
      toelage als bedoeld in het eerste lid heeft genoten en wordt aangepast aan algemene salariswijzigingen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel180
  - number: '180.6'
    text: |-
      Voor de toepassing van het vierde lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      twee maanden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel180
  - number: '181.1'
    text: |-
      Aan de betrokkene van wie de bezoldiging, als gevolg van het buiten zijn toedoen, beëindigen of verminderen van
      een toelage als bedoeld in [artikel 180][ref1], een blijvende verlaging ondergaat die ten minste 3% bedraagt van
      de bezoldiging, wordt een aflopende toelage toegekend, mits hij eerstgenoemde toelage, direct voorafgaande aan het
      tijdstip van vorenbedoelde beëindiging of vermindering ervan, gedurende ten minste twee jaren zonder wezenlijke
      onderbreking heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel180
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '180'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '181.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      twee maanden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel181
  - number: '181.3'
    text: Onze Minister geeft nadere voorschriften voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel181
  - number: '182.1'
    text: |-
      Aan de betrokkene, die in een kalenderjaar is benoemd of benoemd is geweest in één of meer functies met één der
      maximumschalen 1 tot en met 8 wordt met inachtneming van het derde lid, een eindejaarsuitkering toegekend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel182
  - number: '182.2'
    text: |-
      Het bedrag per maand van de in het eerste lid bedoelde eindejaarsuitkering bij een normbetrekking wordt,
      onderscheiden naar de maximumschalen 1 tot en met 5 respectievelijk 6 tot en met 8, door Onze Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel182
  - number: '182.3'
    text: |-
      Voor elke kalendermaand van het desbetreffende kalenderjaar waarin de betrokkene in de desbetreffende functies
      werkzaam is geweest en salaris heeft genoten, wordt per functie het bedrag berekend door de toe te passen bedragen
      bij normbetrekking te vermenigvuldigen met het bedrag van het door de betrokkene in die maand genoten salaris en te
      delen door het salaris bij normbetrekking behorende bij de desbetreffende functie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel182
  - number: '182.4'
    text: |-
      De uitkering wordt vastgesteld op de som van de volgens het derde lid berekende bedragen en wordt rekenkundig
      afgerond op centen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel182
  - number: '182.5'
    text: |-
      De uitkering wordt eenmaal per jaar uitbetaald in de maand december over de periode van twaalf maanden die eindigt
      met de maand december.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel182
  - number: '182.6'
    text: |-
      In afwijking van het vijfde lid vindt bij ontslag van de betrokkene de uitbetaling plaats over het tijdvak januari
      tot en met de datum van ontslag van het desbetreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel182
  - number: '182.7'
    text: |-
      De in het eerste lid bedoelde uitkering wordt niet aangemerkt als bezoldiging en maakt geen deel uit van het
      inkomen, bedoeld in het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel182
  - number: '183.1'
    text: |-
      Voor de betrokkene die aan de instelling waaraan hij is verbonden of aan een andere instelling waaraan hij
      uit hoofde van zijn benoeming verbonden kan worden, die bij wijze van waarneming wordt belast met de volledige
      vervanging van een tijdelijk afwezige functionaris voor wie een hogere maximumschaal geldt en die gedurende meer
      dan 30 aaneengesloten kalenderdagen anders dan wegens vakantieverlof verhinderd is de werkzaamheden voortvloeiende
      uit zijn functie te verrichten, wordt met ingang van de 31e dag van de vervanging en zolang hij met de volledige
      vervanging is belast, een salaris vastgesteld alsof hij in die functie was benoemd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel183
  - number: '183.2'
    text: |-
      Na de beëindiging van de volledige vervanging, bedoeld in het eerste lid, wordt het salaris van de betrokkene die
      met de vervanging was belast, vastgesteld op het bedrag dat behoort bij het salarisnummer en de schaal die voor hem
      zouden hebben gegolden indien de vervanging niet zou hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel183
  - number: '183.3'
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing ten aanzien van de betrokkene voor wie de vervanging van de
      afwezige functionaris tot de functie behoort.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel183
  - number: '184.1'
    text: |-
      Voor de betrokkene, benoemd in een volledige weektaak, die de leeftijd van 60 jaar heeft bereikt, wordt op zijn
      schriftelijk verzoek de dagelijkse werktijd met een half uur verkort, mits hij geen bezoldigde nevenwerkzaamheden
      verricht of gaat verrichten. In dat geval vervalt tevens het recht op een eventuele ontslaguitkering als bedoeld in
      het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] ter zake van beëindigde nevenwerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: '184.2'
    text: |-
      De betrokkene op wie het eerste lid van toepassing is verklaard, alsmede de betrokkene die gebruik maakt van
      [titel 16 van dit hoofdstuk][ref1] kunnen niet met overwerk als bedoeld in [artikel 179][ref2] worden belast.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel179
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '179'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '184.3'
    text: |-
      Indien de betrokkene, bedoeld in het eerste lid, tevens gebruik maakt van het verlof, bedoeld in
      [titel 16 van dit hoofdstuk][ref1] wordt het verlof, bedoeld in het eerste lid, samengevoegd en in gehele of halve
      werkdagen verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '185'
    text: |-
      In het navolgende schema is een aantal normfuncties vermeld die aan de instelling, bedoeld in
      [artikel 1, onderdeel d, onder 1° of 2°][ref1], kunnen voorkomen met de daarbij behorende maximumschaal.







                  Functie


