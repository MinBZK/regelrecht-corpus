  - number: '190'
    text: |-
      Niet van toepassing op de leraar in opleiding zijn de [artikelen 75, derde lid][ref1], [88 tot en met 94][ref2],
      [98][ref3] en [160][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel98
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Artikel160
