        artikel: '263'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0015136
  - number: '264.1'
    text: |-
      Voor de toepassing van [artikel 90][ref1] wordt het salaris dat de betrokkene, bedoeld in het tweede lid onder
      a dan wel b, genoot in de vorige onderwijsfunctie vastgesteld overeenkomstig een van de tabellen, opgenomen in
      [ bijlage 1H][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel264
