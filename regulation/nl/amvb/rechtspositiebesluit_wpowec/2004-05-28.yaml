      - id: ref3
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '112.2'
    text: |-
      Voor de toepassing van het eerste lid wordt voor de functie van de betrokkene, bedoeld in
      [artikel 122, eerste lid onder b][ref1], uitgegaan van de maximumschaal die op grond van [paragraaf 2][ref2] of
      [paragraaf 3 van titel 12 van dit hoofdstuk][ref3] bij de desbetreffende functie behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '122'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '112.3'
    text: |-
      Indien voor een betrokkene als bedoeld in [artikel 280][ref1] dan wel [281][ref2] een hogere salarisschaal geldt of
      zal gelden dan de maximumschaal die behoort bij de functie waarin hij is benoemd, wordt in afwijking van het eerste
      lid voor zijn functie een aantal rekeneenheden verbruikt dat overeenkomt met de hogere salarisschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel280
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel281
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '280'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '281'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '112.4'
    text: |-
      Voor de betrokkene wiens salaris wordt berekend op grond van [artikel 86][ref1] of [artikel 97][ref2] en voor de
      leraar in opleiding, bedoeld in [titel 15 van dit hoofdstuk][ref3], wordt in afwijking van de voorgaande leden,
      een aantal rekeneenheden verbruikt dat wordt berekend aan de hand van de formule w x (d : e) x f, waarin: w = de
      omvang van de werktijdfactor waarvoor betrokkene is benoemd voor zover die voor rijksbekostiging in aanmerking
      wordt gebracht; d = het aantal kalenderdagen gedurende welke de betrokkene in die functie in de desbetreffende
      kalendermaand is benoemd; e = het aantal kalenderdagen dat in de desbetreffende maand geldt; f = het aantal
      rekeneenheden dat op grond van het eerste tot en met derde lid bij de desbetreffende functie hoort. De uitkomst van
      de formule wordt rekenkundig afgerond op 2 decimalen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '86'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '97'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '112.5'
    text: |-
      Indien een betrokkene verlof geniet als bedoeld in [artikel 24][ref1], [25][ref2], [26][ref3] of [27][ref4], is het
      eerste tot en met vierde lid van toepassing indien de functie van de betrokkene gedurende ten minste een gedeelte
      van het voorafgaande schooljaar voor rijksbekostiging in aanmerking werd gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Artikel27
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '24'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '25'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '26'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0015136
        artikel: '27'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '113.1'
    text: |-
      Indien en voorzover die werkzaamheden niet langer aan de betrokkene worden opgedragen, vervalt van rechtswege het
      gedeelte van de betrekkingsomvang van een betrokkene dat bestaat uit:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel113
  - number: 113.1.a
    text: uren boven de normbetrekking; of
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel113
  - number: 113.1.b
    text: tijdelijke uitbreiding van de betrekkingsomvang of benoeming
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel113
  - number: 113.1.b.1
    text: in verband met vervanging of
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel113
  - number: 113.1.b.2
    text: in verband met een tijdelijke voorziening in een vacature voor ten hoogste één jaar;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel113
  - number: 113.1.c
    text: |-
      tijdelijke uitbreiding van de betrekkingsomvang of benoeming in verband met een project waarvoor door het bevoegd
      gezag dan wel Onze Minister gedurende 3 of minder schooljaren uit additionele middelen formatie beschikbaar is
      gesteld en die door het bevoegd gezag niet in de in [artikel 110, tweede lid, onder a][ref1], bedoelde formatie
      is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel110
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '113.2'
    text: |-
      Het gedeelte van de betrekkingsomvang, bedoeld in het eerste lid, wordt voor de duur waarvoor het wordt toegekend
      afzonderlijk in de akte van benoeming vermeld.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel113
  - number: '114.1'
    text: |-
      Het bevoegd gezag kan, uitsluitend ten laste van eigen middelen en volgens door het bevoegd gezag vast te stellen
      beleidsregels, aan een betrokkene een gratificatie toekennen of een maandelijkse toelage.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel114
  - number: '114.2'
    text: Het bevoegd gezag kan aan de toekenning van een maandelijkse toelage voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel114
  - number: '114.3'
    text: |-
      Het bevoegd gezag trekt een maandelijkse toelage in, indien de gronden voor toekenning van de toelage niet meer
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel114
  - number: '114.4'
    text: |-
      De in het eerste lid bedoelde toelage behoort tot de bezoldiging, bedoeld in het Besluit ziekte en
      arbeidsongeschiktheid voor onderwijspersoneel primair en voortgezet onderwijs en educatie en beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel114
  - number: '115.1'
    text: |-
      Onze Minister verstrekt aan een instelling als bedoeld in [artikel 1, onderdeel d, onder 1°][ref1], voor zover
      het speciale scholen voor basisonderwijs betreft, en als bedoeld in [artikel 1, onderdeel d, onder 2°][ref2],
      een toelage als vermeld in [bijlage 2, onder 3][ref3], indien het bevoegd gezag deze toekent aan één of meer
      personeelsleden die in het bezit zijn van een geldig EHBO-diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
  - number: '115.2'
    text: |-
      Indien de in het eerste lid bedoelde instelling is gehuisvest in verschillende gebouwen wordt per gebouw dat niet
      in de onmiddellijke nabijheid van de hoofdvestiging staat, door Onze Minister een toelage overeenkomstig het eerste
      lid verstrekt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel115
  - number: '115.3'
    text: |-
      Onverminderd het eerste en tweede lid kan het bevoegd gezag uitsluitend ten laste van eigen middelen één of meer
      personeelsleden die in het bezit zijn van een geldig EHBO-diploma maandelijks een toelage toekennen als vermeld
      in [bijlage 2, onder 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '116.1'
    text: |-
      De betrokkene voor wie de functie is opgenomen in de formatie, bedoeld in [artikel 110, tweede lid, onder b][ref1],
      is verplicht andere hem door het bevoegd gezag opgedragen werkzaamheden die in het kader van de door hem vervulde
      functie passend zijn te achten, te verrichten, dan wel bij een ander bevoegd gezag dan wel buiten het onderwijs een
      passende betrekking te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel110
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '116.2'
    text: |-
      Onverminderd het eerste lid, kan het bevoegd gezag een betrokkene, bedoeld in het eerste lid, een
      sollicitatieplicht of, met inachtneming van [artikel 118][ref1], een scholingsplicht opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel118
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '118'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '116.3'
    text: |-
      De betrokkene voor wie op grond van het tweede lid een sollicitatieverplichting geldt, is verplicht zich als
      werkzoekende te laten registreren bij de Centrale organisatie werk en inkomen en een andere passende betrekking
      binnen dan wel buiten het onderwijs te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel116
  - number: '117.1'
    text: |-
      Ontslag in verband met opheffing van de betrekking kan niet eerder worden verleend dan nadat de functie, bedoeld
      in [artikel 110, tweede lid, onder a][ref1], gedurende een geheel schooljaar is geplaatst in de formatie, bedoeld
      in [artikel 110, tweede lid, onder b][ref2]. Ontslag wegens opheffing van de betrekking kan niet plaatsvinden om
      herbenoeming in een functie voor een kleinere betrekkingsomvang mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel110
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '117.2'
    text: |-
      Indien het bevoegd gezag besluit over te gaan tot opheffing van een betrekking dient het eerst zorgvuldig te
      onderzoeken of het in redelijkheid mogelijk is de betrokkene een mede in verband met zijn persoonlijkheid en
      omstandigheden voor hem passende functie bij het bevoegd gezag aan te bieden. Indien een in de eerste volzin
      bedoelde functie beschikbaar is, vindt ontslag wegens opheffing van de betrekking plaats onder gelijktijdige
      benoeming in de nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel117
  - number: '117.3'
    text: |-
      Indien geen passende functie als bedoeld in het eerste lid beschikbaar is, dan wel de betrokkene een passende
      functie weigert te aanvaarden, wordt de betrekking opgeheven indien de functie van de betrokkene niet langer in de
      formatie, bedoeld in [artikel 110, tweede lid, onder a of b][ref1], is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel110
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '118'
    text: |-
      Indien het bevoegd gezag met toepassing van [artikel 116, tweede lid][ref1], aan de betrokkene een scholingsplicht
      oplegt, gelden de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel116
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '116'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 118.a
    text: |-
      het bevoegd gezag stelt de betrokkene vrij van het verrichten van passende werkzaamheden, bedoeld in
      [artikel 116, eerste lid][ref1], voor zover dit noodzakelijk is voor het volgen van de scholing;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel116
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '116'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 118.b
    text: |-
      het bevoegd gezag belast de betrokkene niet met het geven van onderwijs, bedoeld in de taakkarakteristiek, voor
      zover deze lesgebonden taken zouden samenvallen met het volgen van de scholing;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel118
  - number: 118.c
    text: |-
      tussen het bevoegd gezag en de betrokkene wordt een redelijke termijn afgesproken waarbinnen de betrokkene de
      scholing met succes kan afronden;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel118
  - number: 118.d
    text: |-
      het bevoegd gezag is verplicht de betrokkene te benoemen in een, gelet op de scholing die is of wordt gevolgd,
      passende vacante functie bij het bevoegd gezag. Indien voor de in de eerste volzin bedoelde benoeming ontheffing
      van de bevoegdheidseisen noodzakelijk is omdat de betrokkene de scholing nog niet heeft afgerond, is het bevoegd
      gezag verplicht die ontheffing aan te vragen. Indien de ontheffing wordt verleend, geldt de in de eerste volzin
      bedoelde verplichting.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel118
  - number: '119.1'
    text: |-
      De bezoldiging van de betrokkene voor wie de betrekkingsomvang is opgenomen in de formatie, bedoeld in
      [artikel 110, tweede lid, onder b][ref1], wordt verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel110
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 119.1.a
    text: |-
      neveninkomsten uit de betrekkingen bij het onderwijs die hij reeds genoot op de dag waarop zijn betrekkingsomvang
      niet langer in de formatie, bedoeld in [artikel 110, tweede lid, onder a][ref1], is opgenomen voor zover de totale
      omvang van de betrekking de omvang van de normbetrekking overschrijdt;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel110
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 119.1.b
    text: |-
      neveninkomsten die hij gaat genieten uit of in verband met arbeid of bedrijf ter hand genomen in verband met de
      verplichting, bedoeld in [artikel 116, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel116
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '116'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '119.2'
    text: |-
      Over het bedrag dat op grond van het eerste lid in mindering wordt gebracht kan door het bevoegd gezag worden
      beschikt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel119
  - number: '120.1'
    text: |-
      Onze Minister kan bepalen dat aan een betrokkene die wordt belast met externe taken ten behoeve van het onderwijs,
      voor zover hij daarvoor geen vergoeding of verlof op de voet van [artikel 30][ref1] verkrijgt, tijdelijk een
      gedeelte van een normbetrekking wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel30
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '30'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '120.2'
    text: |-
      Het in het eerste lid bedoelde gedeelte van een normbetrekking wordt voor de duur waarvoor het wordt toegekend
      afzonderlijk in de akte van benoeming vermeld. De bezoldiging voor dit gedeelte bedraagt een evenredig gedeelte van
      het voor de betrokkene geldende salarisbedrag behorende bij een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel120
  - number: '120.3'
    text: |-
      Zodra voor de betrokkene het gedeelte van de normbetrekking, bedoeld in het eerste lid, wordt verminderd, wordt de
      omvang van de betrekking dienovereenkomstig verkleind.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel120
  - number: '121.1'
    text: 'Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel121
  - number: 121.1.a
    text: |-
      wijst jaarlijks de categorieën van instellingen aan, die bindingspremies om redenen van werving of behoud kunnen
      toekennen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel121
  - number: 121.1.b
    text: bepaalt daarbij tevens tot welk totaalbedrag deze instellingen bindingspremies kunnen toekennen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel121
  - number: 121.1.c
    text: wijst jaarlijks de categorie betrokkenen aan, aan wie de premie kan worden toegekend;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel121
  - number: 121.1.d
    text: |-
      stelt jaarlijks de hoogte van het bedrag vast dat maximaal aan de door het bevoegd gezag aangewezen betrokkene
      wordt uitgekeerd en bepaalt daarbij tevens de periode die maximaal met de betrokkene kan worden overeengekomen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel121
  - number: '121.2'
    text: |-
      Het bevoegd gezag kan aan een betrokkene die in dienst is of treedt en die behoort tot de categorie betrokkenen,
      bedoeld in het eerste lid, om redenen van werving of behoud een bindingspremie toekennen. De bindingspremie maakt
      geen deel uit van het inkomen, bedoeld in het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel121
  - number: '121.3'
    text: |-
      Het bevoegd gezag verbindt aan de toekenning, bedoeld in het tweede lid, de voorwaarde dat de betrokkene, bedoeld
      in het tweede lid, gedurende een bepaalde, tevoren overeengekomen periode, aan de instelling verbonden zal blijven.
      Bij voortijdig vertrek dient de toegekende uitkering geheel of gedeeltelijk te worden terugbetaald. Het bevoegd
      gezag kan aan de toekenning nadere voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel121
  - number: '121.4'
    text: |-
      Indien de betrokkene, bedoeld in het tweede lid, voor het einde van de in het tweede lid bedoelde periode de dienst
      verlaat of indien hij niet voldoet aan de in het derde lid bedoelde nadere voorwaarden door een naar het oordeel
      van het bevoegd gezag niet aan hemzelf te wijten oorzaak, ontheft het bevoegd gezag hem van de verplichtingen tot
      terugbetaling.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel121
  - number: '121.5'
    text: |-
      De voorwaarden, bedoeld in het derde lid, worden aan de betrokkene, bedoeld in het tweede lid, zo spoedig mogelijk
      schriftelijk meegedeeld. Deze mededeling bevat tevens de grootte van de uitkering alsmede de maand en jaar van
      toekenning, voor zover deze niet reeds in de akte van benoeming zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel121
  - number: '122.1'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel122
  - number: 122.1.a
    text: |-
      instelling: de instelling, bedoeld in [artikel 1, onderdeel d, onder 1° en 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 122.1.b
    text: |-
      betrokkene: de aan een instelling als bedoeld onder a verbonden directeur of leraar tevens adjunct-directeur,
      alsmede de betrokkene die aan een dergelijke instelling is benoemd in een functie die door het bevoegd gezag is
      aangemerkt als een functie als bedoeld in titel 12 van dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel122
  - number: '122.2'
    text: |-
      Voor zover uit het eerste lid niet anders blijkt, zijn in deze titel de begripsbepalingen van [artikel 83][ref1] en
      [109][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel109
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '83'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '109'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '123.1'
    text: Aan het hoofd van een instelling staat een directeur of directeuren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel123
  - number: '123.2'
    text: |-
      De directie wordt gevormd door de directeur of directeuren en voor zover de door het bevoegd gezag vastgestelde
      formatie dit mogelijk maakt door een of meer adjunct-directeuren en een of meer andere betrokkenen die zijn benoemd
      in een functie die door het bevoegd gezag is aangemerkt als een functie in titel 12 van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel123
  - number: '124.1'
    text: In de paragrafen 2 en 3 wordt voor elke normfunctie de bijbehorende maximumschaal aangegeven.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel124
  - number: '124.2'
    text: |-
      Bij elke maximumschaal behoort een aanloopschaal als aangegeven in onderstaand schema.






                    Aanloopschaal


                    maximumschaal






                    8


                    9




                    8


                    10




                    10


                    11




                    11


                    12




                    12


                    13
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel124
  - number: '125.1'
    text: |-
      Bij benoeming van een betrokkene in een functie als bedoeld in deze titel wordt, in afwijking van de
      [artikelen 89 tot en met 93][ref1] het voor hem geldende salarisbedrag vastgesteld als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel89
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '89'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 125.1.a
    text: |-
      eerst wordt bepaald welk salarisbedrag voor hem in de functie, bedoeld in deze titel zou gelden op de voet van
      de [artikelen 89 tot en met 93][ref1], waarbij voor de toepassing van die artikelen elke schaal voorkomende in
      [bijlage 1A][ref2] bij dit besluit geacht wordt te behoren bij die functies;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '89'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
  - number: 125.1.b
    text: |-
      vervolgens wordt bezien van welke salarisschalen die behoren bij de desbetreffende functie het minimumsalaris
      lager is dan het onder a bepaalde bedrag, de betrokkene wordt vervolgens ingeschaald in de hoogste van deze
      salarisschalen en wel op het onder a bepaalde salarisbedrag of indien dat bedrag in die salarisschaal niet voorkomt
      op het naasthogere bedrag;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel125
  - number: 125.1.c
    text: |-
      indien het onder a bepaalde salarisbedrag lager is dan het laagste salarisbedrag in de aanloopschaal behorende bij
      de desbetreffende functie wordt het salaris vastgesteld op het onder a gevonden bedrag in de hoogst mogelijke in
      de bijlagen bij dit besluit voorkomende salarisschaal die gelegen is onder evenbedoelde aanloopschaal; indien het
      onder a bedoelde bedrag in die schaal niet voorkomt, vindt de inschaling plaats op het naasthogere in die schaal
      voorkomende bedrag.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel125
  - number: '125.2'
    text: |-
      Indien het eerste lid leidt tot een salarisbedrag dat lager is dan het laagste bedrag van het begintraject dan wel
      de laagste aanloopschaal behorende bij de hoogste maximumschaal die ingevolge [titel 13 van dit hoofdstuk][ref1]
      aan de instelling geldt voor de betrokkene, bedoeld in [artikel 150, eerste lid, onder b][ref2], wordt het salaris
      van de betrokkene die in een functie als bedoeld in deze titel wordt benoemd, vastgesteld op dat laagste bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel150
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '150'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '126.1'
    text: |-
      Zodra aan de betrokkene op grond van [artikel 95][ref1] een periodieke verhoging wordt toegekend en zijn salaris
      dan ten minste gelijk is aan het aanvangsbedrag van een naasthogere schaal, wordt zijn salaris bepaald volgens die
      hogere schaal, evenwel niet volgens een hogere schaal dan de maximumschaal die bij zijn functie behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel95
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '95'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '126.2'
    text: |-
      Zolang voor de betrokkene het salaris wordt bepaald volgens een lagere schaal dan de bij zijn functie behorende
      aanloopschaal en toekenning van een periodieke verhoging als bedoeld in [artikel 95][ref1] en toepassing van
      het eerste lid nog niet leiden tot een salarisbedrag dat ten minste gelijk is aan het laagste bedrag in de
      aanloopschaal, wordt hem telkens bij de toepassing van artikel 95 op de in dat artikel vermelde datum één
      extra periodieke verhoging toegekend. Het eerste lid is van overeenkomstige toepassing ten aanzien van de
      salarisvaststelling volgens de naasthogere schaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel95
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '95'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '127.1'
    text: |-
      Indien toepassing van één der paragrafen 2 en 3 gedurende drie achtereenvolgende schooljaren tot een hogere
      maximumschaal leidt voor de desbetreffende functie bij de instelling, geldt met ingang van het derde schooljaar het
      carrièrepatroon dat behoort bij de functie met die hogere maximumschaal voor de betrokkene.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel127
  - number: '127.2'
    text: |-
      De betrokkene die gedurende een periode van drie aaneengesloten schooljaren benoemd is in dezelfde functie waarbij
      op grond van één der paragrafen 2 en 3 dezelfde maximumschaal behoort, behoudt aanspraak op bezoldiging volgens
      het carrièrepatroon dat behoort bij de functie met die maximumschaal zolang hij in de desbetreffende functie aan
      dezelfde instelling of instellingen benoemd blijft.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel127
  - number: '127.3'
    text: |-
      De betrokkene wiens bezoldiging wordt vastgesteld volgens de voor hem geldende maximumschaal, behoudt aanspraak op
      bezoldiging volgens die schaal zolang hij in de desbetreffende functie benoemd blijft.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel127
  - number: '128.1'
    text: |-
      Indien de directeur van een instelling waarbij geen andere functie als bedoeld in deze titel in de formatie is
      opgenomen gedurende meer dan 30 aaneengesloten kalenderdagen anders dan wegens vakantieverlof verhinderd is zijn
      werkzaamheden te verrichten, wordt voor de aan de instelling werkzame betrokkene, bedoeld in [titel 13][ref1], die
      de directeurstaken volledig waarneemt met ingang van de 31e dag van de vervanging en zolang hij met de volledige
      vervanging is belast, een salaris en een toelage als bedoeld in [artikel 140][ref2] vastgesteld alsof hij in die
      functie was benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel140
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '140'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '128.2'
    text: |-
      Indien de directeur van een instelling gedurende meer dan één jaar verhinderd is zijn werkzaamheden te verrichten,
      wordt indien vervanging is toegestaan voor de aan de instelling benoemde adjunct-directeur die de directeurstaken
      volledig waarneemt na één jaar volledige vervanging en zolang hij met de volledige vervanging is belast, een
      salaris en een toelage als bedoeld in [artikel 140][ref1] vastgesteld alsof hij in die functie was benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel140
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '140'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '128.3'
    text: |-
      Het tweede lid is, indien vervanging is toegestaan, voor zover het de vaststelling van het salaris betreft, van
      overeenkomstige toepassing ten aanzien van de betrokkene, bedoeld in [titel 13][ref1], voor zover hij de adjunct-
      directeurstaken langer dan één jaar volledig waarneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '128.4'
    text: |-
      Na de beëindiging van de volledige vervanging, bedoeld in het eerste tot en met derde lid, wordt het salaris van
      de betrokkene die de functie van directeur dan wel adjunct-directeur heeft waargenomen, vastgesteld op het bedrag
      dat behoort bij het salarisnummer en de schaal die voor hem zouden hebben gegolden indien de waarneming niet zou
      hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel128
  - number: '129'
    text: |-
      Nadat toepassing is gegeven aan [artikel 151, tweede lid][ref1], verdeelt het bevoegd gezag de werkzaamheden onder
      de leden van de directie na overleg met de betrokkenen zodanig dat een zo veel mogelijk evenwichtige taakbelasting
      plaatsvindt in verhouding tot de functie en de omvang van ieders betrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel151
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '151'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '130'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel130
  - number: 130.a
    text: |-
      directeur: de directeur van een basisschool of een speciale school voor basisonderwijs, bedoeld in
      [artikel 1, onderdeel d, onder 1°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 130.b
    text: |-
      adjunct-directeur: degene die is benoemd in een functie als bedoeld in
      [paragraaf 2 van titel 13 van dit hoofdstuk][ref1] die tevens is benoemd tot adjunct-directeur;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 130.c
    text: |-
      directie: de directeur of directeuren, de eventuele adjunct-directeuren en de eventuele andere betrokkenen die zijn
      benoemd in een functie die is ingedeeld in deze titel, gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel130
  - number: 130.d
    text: 'betrokkene: degene die deel uitmaakt van de directie;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel130
  - number: 130.e
    text: |-
      y: het aantal leerlingen op 1 oktober van het voorafgaande schooljaar, welk aantal voor basisscholen wordt verhoogd
      met 3% van dat aantal leerlingen en naar beneden afgerond op een geheel getal;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel130
  - number: 130.f
    text: |-
      instelling: een basisschool of een speciale school voor basisonderwijs als bedoeld in
      [artikel 1, onderdeel d, onder 1°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '131'
    text: |-
      De normfuncties voor de directie die in de formatie van een instelling kunnen voorkomen zijn de normfunctie
      van directeur en van adjunct-directeur. In [bijlage 12-1][ref1] bij dit besluit is voor deze functies een
      taakkarakteristiek gegeven voor onderscheidenlijk basisscholen en speciale scholen voor basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '132.1'
    text: |-
      De betrokkene die is benoemd in een normbetrekking en die het verlof, bedoeld in [artikel 32][ref1], per jaar
      geniet, wordt gemiddeld voor ten hoogste 930 uren per jaar belast met het geven van onderwijs, bedoeld in de
      taakkarakteristiek van de normfunctie leraar, zoals opgenomen in [bijlage 13-1][ref2] van dit besluit. Voor
      de betrokkene die gebruik maakt van het verlof, bedoeld in [artikel 32, zevende lid][ref3], en voor wie een
      arbeidsduur op jaarbasis geldt van 1710 uren respectievelijk 1790 uren wordt in de eerste volzin voor «930 uren»
      gelezen «961 uren» respectievelijk «1010 uren».


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel32
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015136
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '132.2'
    text: |-
      Binnen een normbetrekking is 10% van de normbetrekking, en indien gebruik wordt gemaakt
      van [artikel 32, zevende lid][ref1], 10% van de arbeidsduur op jaarbasis, bedoeld in
      [artikel 85, tweede of derde lid][ref2], bestemd voor activiteiten in het kader van de deskundigheidsbevordering.
      De besteding van het in de eerste volzin bedoelde deel van de normbetrekking respectievelijk de arbeidsduur op
      jaarbasis wordt door betrokkene bepaald, met dien verstande dat het bevoegd gezag in individuele gevallen en
      schriftelijk gemotiveerd daarvan kan afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel85
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '85'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '132.3'
    text: |-
      Na verkregen instemming van het decentraal georganiseerd overleg kan aan instellingen waarvoor op jaarbasis een
      onderwijstijd geldt van meer dan 1010 doch ten hoogste 1040 uur betrokkene voor maximaal die aan de instelling
      geldende onderwijstijd worden belast met het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel132
  - number: '132.4'
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang van minder dan een normbetrekking wordt het
      maximum aantal uren, bedoeld in het eerste lid, en de deskundigheidsbevordering, bedoeld in het tweede lid, naar
      evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel132
  - number: '132.5'
    text: |-
      In individuele gevallen kunnen door het bevoegd gezag en betrokkene afspraken worden gemaakt die afwijken van het
      percentage, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel132
  - number: '133.1'
    text: |-
      De maximumschaal die voor de normfunctie van directeur geldt, wordt afhankelijk van y vastgesteld volgens
      onderstaand schema:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: 133.1.a
    text: |-
      voor wat betreft basisscholen;






                        y


                        maximumschaal






                        tot en met 199


                        10




                        200 tot en met 899


                        11




                        900 en hoger


                        12
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: 133.1.b
    text: |-
      voor wat betreft speciale scholen voor basisonderwijs;






                        y


                        maximumschaal






                        tot en met 199


                        11




                        200 en hoger


                        12
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: '133.2'
    text: |-
      Met inachtneming van het vierde lid en de voorschriften, bedoeld in het zesde lid, kan het bevoegd gezag besluiten
      aan een instelling twee normfuncties directeur te vervullen. In dat geval wordt de maximumschaal voor ieder van
      deze functies, in afwijking van het eerste lid en met inachtneming van het derde lid, vastgesteld volgens het
      onderstaande schema:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: 133.2.a
    text: |-
      voor wat betreft basisscholen;






                        y


                        maximumschaal






                        tot en met 899


                        10




                        900 en hoger


                        11
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: 133.2.b
    text: |-
      voor wat betreft speciale scholen voor basisonderwijs;






                        y


                        maximumschaal






                        tot en met 199


                        11




                        200 en hoger


                        12
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: '133.3'
    text: |-
      Bij de toepassing van het tweede lid wordt, in afwijking van [artikel 83 onder f][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel83
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '83'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 133.3.a
    text: |-
      voor de normfunctie van directeur van een basisschool waarvan y kleiner is dan 200, het maximumsalaris van schaal
      10 vastgesteld op het bedrag dat is vermeld bij salarisnummer 10 in die schaal;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: 133.3.b
    text: 'voor de normfunctie van directeur van een speciale school voor basisonderwijs waarvan y:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: 133.3.b.1°
    text: kleiner is dan 100, het maximumsalaris vastgesteld op het bedrag dat is vermeld bij salarisnummer 6 in schaal 11;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: 133.3.b.2°
    text: |-
      gelijk is aan of groter dan 100 en kleiner dan 200, het maximumsalaris vastgesteld op het bedrag dat is vermeld bij
      salarisnummer 7 in schaal 11;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: 133.3.b.3°
    text: |-
      gelijk is aan of groter dan 200, het maximumsalaris vastgesteld op het bedrag dat is vermeld bij salarisnummer 7 in
      schaal 12.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: '133.4'
    text: |-
      Het bevoegd gezag kan een besluit tot het doen vervullen van twee normfuncties directeur niet nemen zolang aan de
      instelling een directeur is benoemd voor wie het salaris vastgesteld wordt op een bedrag dat hoger is dan het voor
      hem in het tweede en derde lid bij de aldaar vermelde leerlingenaantallen aangegeven maximumsalaris.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: '133.5'
    text: |-
      Indien aan een instelling met toepassing van het tweede lid twee normfuncties directeur worden vervuld, is
      [artikel 128][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel128
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '128'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '133.6'
    text: Onze Minister geeft voorschriften ter uitvoering van het tweede, derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel133
  - number: '134.1'
    text: |-
      In afwijking van [artikel 112, eerste lid][ref1], wordt aan een instelling waarvan y kleiner is dan 200 en waaraan
      met toepassing van [artikel 133, tweede lid][ref2], twee normfuncties directeur worden vervuld, voor elk van
      deze functies bij een normbetrekking, afhankelijk van y, een aantal rekeneenheden verbruikt als is aangegeven in
      onderstaand schema:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel133
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel134
    references:
      - id: ref1
