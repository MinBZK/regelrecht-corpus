  - number: '191'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel191
  - number: 191.a
    text: |-
      leraar in opleiding: de laatstejaars student van een lerarenopleiding basisonderwijs of
      speciaal onderwijs die wordt benoemd op een leer-arbeidsplaats bij een instelling als bedoeld in
      [artikel 1, onderdeel d, onder 1° of 2°][ref1], welke persoon wordt aangemerkt als een lid van het
      onderwijsgevend personeel;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 191.b
    text: 'leer-arbeidsplaats: een functie waarin uitsluitend een leraar in opleiding kan worden benoemd;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel191
  - number: 191.c
    text: |-
      leer-arbeidsovereenkomst: een overeenkomst die bestaat uit de benoeming, bedoeld in [artikel 1, onderdeel n][ref1],
      alsmede een leerovereenkomst die wordt gesloten tussen de leraar in opleiding, de instelling waar de leraar in
      opleiding is benoemd en de lerarenopleiding waar de leraar in opleiding is ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 191.d
    text: |-
      lioschap: de periode waarin de leraar in opleiding bij een instelling als bedoeld in
      [artikel 1, onderdeel d, onder 1° of 2°][ref1], is benoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 191.e
    text: |-
      leer-werkplan: een door de leraar in opleiding opgesteld plan, waarin, in overleg met de lerarenopleiding waar de
      leraar in opleiding is ingeschreven en het bevoegd gezag van de instelling waar de leraar in opleiding is benoemd,
      de leer- en werkactiviteiten zijn vastgelegd die de leraar in opleiding tijdens zijn lioschap zal verrichten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel191
  - number: '192.1'
    text: |-
      De leraar in opleiding wordt benoemd in tijdelijke dienst voor een termijn van vijf maanden bij een normbetrekking
      of een termijn van tien maanden bij een werktijdfactor van 0,5.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel192
  - number: '192.2'
    text: |-
      De in het eerste lid bedoelde perioden eindigen voor de datum van aanvang van de zomervakantie van de instelling
      waaraan de leraar in opleiding is benoemd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel192
  - number: '192.3'
    text: |-
      Het eerste lid geldt voor de leraar in opleiding in het openbaar onderwijs in afwijking van
      [titel 1 van hoofdstuk 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '2'
  - number: '193.1'
    text: |-
      De functie leraar in opleiding is een normfunctie die is afgeleid van de normfuncties leraar zoals deze zijn
      vastgelegd in de taakkarakteristieken opgenomen in de [bijlagen 13-1][ref1] en [13-2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0015136
      - id: ref2
        bwb_id: BWBR0015136
  - number: '193.2'
    text: |-
      De functie leraar in opleiding omvat de in het derde lid aangegeven onderdelen van de taakkarakteristiek waarbij de
      zelfstandige uitoefening van die taken geleidelijk toeneemt tijdens het lioschap.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel193
  - number: '193.3'
    text: 'De taakkarakteristiek van de functie leraar in opleiding is het leren van het beroep leraar door middel van:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel193
  - number: 193.3.a
    text: het geven van onderwijs, alsmede de daaruit rechtstreeks voortvloeiende werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel193
  - number: 193.3.b
    text: 'algemene werkzaamheden, die redelijkerwijs voortvloeien uit het onderwijs aan de instelling, zoals:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel193
  - number: 193.3.b.1
    text: het deelnemen aan teamvergaderingen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel193
  - number: 193.3.b.2
    text: het onderhouden van contacten met collega's van de instelling, ouders, begeleidingsdiensten e.d.;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel193
  - number: 193.3.b.3
    text: het verrichten van overige werkzaamheden ten behoeve van de goede gang van zaken aan de instelling.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel193
  - number: '194.1'
    text: |-
      Tussen de leraar in opleiding, de instelling waar de leraar in opleiding is benoemd en de lerarenopleiding waar de
      leraar in opleiding is ingeschreven wordt een leer-arbeidsovereenkomst gesloten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel194
  - number: '194.2'
    text: De omvang van het leeraandeel en het arbeidsaandeel worden aan elkaar gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel194
  - number: '194.3'
    text: 'De leer-arbeidsovereenkomst bevat tenminste bepalingen over:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel194
  - number: 194.3.a
    text: de begeleiding van de leraar in opleiding;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel194
  - number: 194.3.b
    text: |-
      dat deel van de eindtermen dat de leraar in opleiding tijdens het lioschap dient te realiseren en de beoordeling
      daarvan, alsmede de onderdelen genoemd in [artikel 8, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel8
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '8'
        hoofdstuk: '1'
  - number: '195.1'
    text: |-
      De leraar in opleiding stelt voor aanvang van de leer-arbeidsovereenkomst een leer-werkplan op. Het leer-werkplan
      wordt getoetst door:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel195
  - number: 195.1.a
    text: de lerarenopleiding waar de leraar in opleiding is ingeschreven en
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel195
  - number: 195.1.b
    text: het bevoegd gezag van de instelling waar de leraar in opleiding is benoemd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel195
  - number: '195.2'
    text: |-
      De lerarenopleiding waar de leraar in opleiding is ingeschreven toetst het leer-werkplan aan de eindtermen van
      de opleiding.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel195
  - number: '195.3'
    text: |-
      Het bevoegd gezag van de instelling waaraan de leraar in opleiding is benoemd, toetst het leer-werkplan voor zover
      het gaat om de werkzaamheden die verricht moeten worden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel195
  - number: '196'
    text: |-
      [Artikel 59][ref1] is niet van toepassing indien de leraar in opleiding gebruik kan maken van een reisvoorziening
      als bedoeld in [artikel 3.7 van de Wet studiefinanciering 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '59'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
  - number: '197'
    text: |-
      Het salaris van de leraar in opleiding wordt met inachtneming van de bepalingen van dit besluit vastgesteld aan de
      hand van [bijlage IG][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel197
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '198.1'
    text: |-
      De betrokkene heeft op grond van deze titel op zijn verzoek aanspraak op verlof als bedoeld in [artikel 199][ref1]
      met gedeeltelijk behoud van bezoldiging als aangegeven in [artikel 201][ref2] indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel199
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel201
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '199'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '201'
        hoofdstuk: '1'
  - number: 198.1.a
    text: |-
      direct voorafgaande aan de ingangsdatum van het verlof gedurende ten minste vijf jaren aaneengesloten in dienst
      is geweest van een door Onze Minister bekostigde onderwijs- of onderzoekinstelling, dan wel een door Onze
      Minister van Landbouw, Natuurbeheer en Visserij bekostigde onderwijsinstelling, waarbij de periode waarin de
      betrokkene een werkloosheidsuitkering genoot in verband met het beëindigd zijn van een bij bedoelde onderwijs- of
      onderzoekinstelling betrekking als diensttijd wordt aangemerkt, en
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel198
  - number: 198.1.b
    text: de leeftijd van 52 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel198
  - number: '198.2'
    text: |-
      Het verlof gaat niet eerder in dan op de eerste dag van de maand volgend op die waarin de leeftijd genoemd in
      [artikel 199, tweede en derde lid][ref1], is bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel199
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '199'
        hoofdstuk: '1'
  - number: '198.3'
    text: |-
      Om redenen van dienstbelang kan de ingangsdatum van het verlof worden opgeschort tot uiterlijk de eerste dag van
      het daaropvolgend schooljaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel198
  - number: '199.1'
    text: |-
      De omvang van het verlof bedraagt voor alle betrokkenen zowel bij een normbetrekking als bij een deel van de
      normbetrekking op jaarbasis ten minste 45 uren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel199
  - number: '199.2'
    text: |-
      De omvang van het verlof bedraagt voor de betrokkene die is benoemd in een functie als bedoeld in [titel 12][ref1]
      of [13 van dit hoofdstuk][ref2] en die de leeftijd van 52 jaar heeft bereikt maar jonger is dan 56 jaar bij een
      normbetrekking op jaarbasis ten hoogste 170 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '199.3'
    text: |-
      De omvang van het verlof bedraagt voor de betrokkene die is benoemd in een functie als bedoeld in [titel 12][ref1]
      of [13 van dit hoofdstuk][ref2] en die de leeftijd van 56 jaar heeft bereikt bij een normbetrekking op jaarbasis
      ten hoogste 340 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '199.4'
    text: |-
      De omvang van het verlof bedraagt voor de betrokkene die is benoemd in een functie als bedoeld in
      [titel 14 van dit hoofdstuk][ref1], op jaarbasis het aantal uren dat de uitkomst is van de formule ((1659 – (a
      + b)) x L) / (1659), waarbij: a = het bij de leeftijd van betrokkene behorende aantal verlofuren op grond van
      [artikel 17, derde lid][ref2], b = 112,5 uren voor de betrokkene, bedoeld in [artikel 184, eerste lid][ref3], en
      L = voor de betrokkene die de leeftijd van 52 jaar heeft bereikt maar jonger is dan 56 jaar 170 uren en voor de
      betrokkene van 56 jaar of ouder 340 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel184
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '17'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '184'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '199.5'
    text: |-
      Voor de betrokkene met een betrekkingsomvang van minder dan een normbetrekking, wordt het aantal uren verlof,
      bedoeld in het tweede, derde en vierde lid, vastgesteld naar evenredigheid van die betrekkingsomvang en rekenkundig
      afgerond op hele of halve uren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel199
  - number: '200.1'
    text: |-
      Het verlof, bedoeld in [artikel 199][ref1], kan voor zover het dienstbelang zich daartegen niet verzet op verzoek
      van betrokkene geheel of gedeeltelijk in een later schooljaar worden opgenomen bij hetzelfde of een ander bevoegd
      gezag dan het bevoegd gezag waarbij het verlof is gespaard.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel199
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '199'
        hoofdstuk: '1'
  - number: '200.2'
    text: |-
      Het aantal uren op te nemen verlof op grond van deze titel tezamen met het verlof op grond van [artikel 32][ref1]
      mag jaarlijks ten hoogste 50% van de betrekkingsomvang bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '200.3'
    text: |-
      De betrokkene die is benoemd in een normbetrekking en die op grond van artikel 5, eerste of vierde lid, van het
      FPU-reglement basis- en aanvullende uitkering, op de leeftijd van 61 jaar doch uiterlijk op de laatste dag van
      het schooljaar waarin hij die leeftijd heeft bereikt, zal uittreden voor het gedeelte van de werktijdfactor dat
      overeenkomt met het aantal uren waarop in de maand voorafgaand aan de datum van uittreden [artikel 201][ref1] van
      toepassing is, wordt de omvang van het verlof, bedoeld in [artikel 199][ref2], verhoogd met 170 uren extra verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel201
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel199
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '201'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '199'
        hoofdstuk: '1'
  - number: '200.4'
    text: |-
      De omvang van het verlof, bedoeld in [artikel 199][ref1], wordt eveneens verhoogd met 170 uren extra verlof indien
      de in het derde lid bedoelde betrokkene uittreedt voor een kleiner gedeelte van de werktijdfactor dan het gedeelte
      dat overeenkomt met het aantal uren waarop in de maand voorafgaand aan de datum van uittreden [artikel 201][ref2]
      van toepassing is, doch voor ten minste het gedeelte van de werktijdfactor dat overeenkomt met het aantal uren
      verlof dat voor hem geldt op grond van [artikel 199][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel199
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel201
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel199
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '199'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '201'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '199'
        hoofdstuk: '1'
  - number: '200.5'
    text: |-
      Het derde en het vierde lid zijn van overeenkomstige toepassing op de betrokkene die is benoemd in een
      normbetrekking en die een aanvullende uitkering ontvangt op grond van artikel 4.3. onder a, van het FPU-reglement
      basis- en aanvullende uitkering, en die zal uittreden op de leeftijd van 62 jaar en op de betrokkene die zal
      uittreden op grond van artikel 5.7.1. van dat reglement.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel200
  - number: '200.6'
    text: |-
      Voor de betrokkene op wie de in het derde, vierde of vijfde lid genoemde bepalingen van het FPU-reglement basis-
      en aanvullende uitkering van toepassing zijn en die is benoemd in een betrekking met een omvang van minder dan
      een normbetrekking, wordt het extra verlof, genoemd in het derde lid, naar evenredigheid van de betrekkingsomvang
      berekend en afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel200
  - number: '201.1'
    text: |-
      De bezoldiging voor het gedeelte van de betrekkingsomvang waarvoor betrokkene verlof op grond van deze
      titel geniet, bedraagt voor personeel dat is benoemd in een functie met maximumschaal 8 of lager 75% en
      voor het overige personeel 65% van de bezoldiging die voor hem bij die betrekkingsomvang op grond van de
      [titels 12][ref1], [13][ref2] en [14 van dit hoofdstuk][ref3] of op grond van de [titels 2][ref4], [3][ref5] en
      [4 van hoofdstuk 5][ref6] zou gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk5
      [ref6]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref4
