      - id: ref6
        bwb_id: BWBR0015136
        artikel: '91'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '274.2'
    text: |-
      Op de betrokkene, bedoeld in het eerste lid, aanhef, die op 1 januari 2000 wordt benoemd in een functie als bedoeld
      in [titel 13 van hoofdstuk 1][ref1] met dezelfde maximumschaal als welke direct voorafgaand aan die benoeming voor
      hem gold, is [artikel 273, tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel273
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel274
