                  Psychologisch assistent


                  4




                  3.


                  Conciërge


                  3




                  4.


                  Technisch assistent


                  5




                  5a.


                  Klassenassistent


                  3




                  5b.


                  Klassenassistent


                  4




                  5c.


                  Onderwijsassistent


                  4




                  6.


                  Instructeur mobiliteit


                  7




                  7.


                  Speltherapeut/creatieve therapeut


                  8




