        hoofdstuk: '1'
  - number: 263.1.b
    text: |-
      wiens vorige onderwijsfunctie, bedoeld in [artikel 90][ref1], een functie is als bedoeld in
      [ titel 12 van hoofdstuk 1][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel263
