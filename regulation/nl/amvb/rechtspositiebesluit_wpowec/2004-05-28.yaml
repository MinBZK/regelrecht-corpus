      [ artikel 1 onderdeel d, onder 1° of 2°][ref1], in een functie als bedoeld in [ titel 13 van hoofdstuk 1][ref2],
      die functie eindigde voor 1 augustus 1997, en van wie benoeming plaatsvindt op of na 1 augustus 1997 aan
      een instelling als bedoeld in [artikel 1 onderdeel d, onder 1° of 2°][ref3] in een functie als bedoeld in
      [titel 12][ref4] of [13 van hoofdstuk 1][ref5], dan wel,


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref5]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
