  - number: 263.1.c
    text: |-
      die in de vorige onderwijsfunctie, bedoeld in [artikel 90][ref1] een toeslag begininkomens genoot ingevolge de
      [artikelen I-P23 tot en met I-P26 van het Rechtspositiebesluit onderwijspersoneel](onbekend) zoals die artikelen op
      31 juli 1997 luidden,


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel90
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel263
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '90'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '263.2'
    text: |-
      Voor de toepassing van het eerste lid wordt uitgegaan van het salaris en de toeslag begininkomens behorende bij
      een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel263
  - number: '263.3'
    text: |-
      Indien het in het eerste lid bepaalde bedrag niet voorkomt in het vanaf 1 augustus 1997 geldende carrièrepatroon
      behorende bij de op 31 juli 1997 vervulde onderwijsfunctie respectievelijk de vorige onderwijsfunctie, bedoeld in
      [artikel 90][ref1], wordt de uitkomst van het eerste lid bepaald op het naasthogere bedrag in dat carrièrepatroon.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel90
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel263
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '90'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '263.4'
    text: |-
      Van 1 augustus 1997 tot 1 augustus 1998 is [artikel V-P12 van het Rechtspositiebesluit onderwijspersoneel]
      (onbekend) zoals dat artikel op 1 augustus 1997 luidde, niet van toepassing op de betrokkene voor wie ingevolge
      [artikel 263][ref1] het salaris in de vorige onderwijsfunctie wordt vastgesteld overeenkomstig een van de tabellen,
      opgenomen in [bijlage 1H][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel263
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel263
    references:
