        artikel: 11a
      - id: ref5
        bwb_id: BWBR0002471
        artikel: '13'
  - number: 295a.3
    text: |-
      Ten aanzien van het kalenderjaar 2000 wordt [artikel 107, tweede lid, van dit besluit][ref1] gelezen als:
      Het bevoegd gezag kan met inachtneming van de in of krachtens de [Wet op de loonbelasting 1964][ref2]
      gegeven normering en beperkingen aan de betrokkene toekennen vergoedingen als bedoeld in
      [artikel 11, eerste lid, onder u, van de Wet op de loonbelasting 1964][ref3] zoals dat artikelonderdeel luidde in
      het kalenderjaar 2000, voor het totaal aantal uren dat de betrokkene meer gewerkt heeft of voor het deel waarvoor
      de betrokkene afziet van een of meer aanspraken als bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel295a
    references:
