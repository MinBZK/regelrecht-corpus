  - number: '202.4'
    text: |-
      Het derde lid is niet van toepassing op het aantal uren verlof waarover betrokkene op grond van
      [artikel 201, tweede lid][ref1], geen bezoldiging ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel201
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '201'
        hoofdstuk: '1'
  - number: '203.1'
    text: |-
      Het verlof op grond van deze titel wordt in gehele of in halve werkdagen opgenomen, tenzij bevoegd gezag en
      betrokkene hierover afwijkende afspraken maken. Het tijdstip waarop het verlof op grond van deze titel wordt
      genoten, wordt in overleg met betrokkene vastgesteld en vastgelegd in het voor de school geldende overzicht van
      onderwijstijd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel203
  - number: '203.2'
    text: |-
      Teneinde voor een betrokkene als bedoeld in [titel 12][ref1] of [13][ref2], het verbruik van het verlof,
      bedoeld in deze titel, te berekenen, wordt de verlofaanspraak uitgedrukt in lesgevende taken en wel door de
      in [artikel 199, tweede lid][ref3], bedoelde verlofaanspraak vast te stellen op ten hoogste 104 uren en de
      verlofaanspraak, bedoeld in [artikel 199, derde lid][ref4], op ten hoogste 208 uren. Vervolgens wordt voor elk
      dagdeel dat een in de eerste volzin bedoelde betrokkene verlof geniet op grond van deze titel, de verlofaanspraak
      van betrokkene verminderd met het aantal uren dat op de betreffende dagdelen in de vier hoogste groepen wordt
      lesgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel199
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Artikel199
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '199'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0015136
        artikel: '199'
        hoofdstuk: '1'
  - number: '203.3'
    text: |-
      Teneinde voor een betrokkene als bedoeld in [artikel 132][ref1] of [artikel 186][ref2], het verbruik van het
      verlof, bedoeld in deze titel, te berekenen, wordt de verlofaanspraak uitgedrukt in lesgebonden of behandeltaken
      en wel door de uitkomst van de formule van [artikel 199, vierde lid][ref3], te vermenigvuldigen met 104 indien
      de betrokkene 52 jaar of ouder doch jonger is dan 56 jaar en met 208 indien de betrokkene 56 jaar of ouder is
      en vervolgens de uitkomst van deze vermenigvuldiging te delen door het bij de leeftijd van betrokkene behorende
      aantal uren op grond van de factor L in [artikel 199, vierde lid][ref4]. Vervolgens wordt voor elk dagdeel dat een
      in de eerste volzin bedoelde betrokkene verlof geniet op grond van deze titel, de verlofaanspraak van betrokkene
      verminderd met het aantal uren dat op de betreffende dagdelen in de vier hoogste groepen wordt lesgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel186
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel199
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Artikel199
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '132'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '186'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '199'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0015136
        artikel: '199'
        hoofdstuk: '1'
  - number: '203.4'
    text: |-
      Voor een betrokkene als bedoeld in het tweede of derde lid die is benoemd in een betrekking met een omvang van
      minder dan een normbetrekking wordt het aantal lesgebonden of behandeltaken vastgesteld naar evenredigheid van de
      betrekkingsomvang en rekenkundig afgerond op hele of halve uren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel203
  - number: '204'
    text: |-
      Over de verrekening van extra inkomsten uit arbeid of bedrijf met de bezoldiging van de betrokkene is artikel 9
      van het FPU-reglement basis- en aanvullende uitkering van overeenkomstige toepassing, met dien verstande dat de
      verrekening van de extra inkomsten niet kan leiden tot een lager bedrag dan de bezoldiging van de betrokkene met
      een gelijke onvolledige werktijd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel204
  - number: '205.1'
    text: |-
      De betrokkene kan het bevoegd gezag jaarlijks verzoeken met ingang van de eerste dag van het schooljaar de omvang
      van het verlof te wijzigen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel205
  - number: '205.2'
    text: |-
      Het bevoegd gezag verleent geen toestemming voor wijziging van de omvang van het verlof, indien dit op
      enigerlei wijze direct of op termijn leidt tot uitkeringen krachtens het Besluit Werkloosheid onderwijs- en
      onderzoekpersoneel.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel205
  - number: '206'
    text: |-
      De betrokkene die krachtens artikel 3 van de Wetten doorstroming onderwijspersoneel gedeeltelijk is uitgetreden,
      kan geen aanspraak op verlof op grond van deze titel maken.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel206
  - number: '207.1'
    text: |-
      De betrokkene die van titel 16 van dit hoofdstuk gebruik wenst te maken, dient hiertoe ten minste tien weken voor
      de gewenste ingangsdatum een schriftelijk verzoek in bij het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel207
  - number: '207.2'
    text: |-
      Indien de betrokkene kiest voor een ingangsdatum in de periode 1 mei tot en met 1 augustus, dient hij zijn verzoek
      uiterlijk op 1 maart daaraan voorafgaand in.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel207
  - number: '207.3'
    text: |-
      De betrokkene die gebruik wenst te maken van de mogelijkheid, genoemd in [artikel 200, eerste lid][ref1], geeft
      bij zijn verzoek tevens aan in welke schooljaren hij het verlof wil opnemen alsmede het aantal uren verlof in het
      eerste schooljaar waarin het verlof zal worden genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel200
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '200'
        hoofdstuk: '1'
  - number: '208'
    text: |-
      In deze titel wordt verstaan onder: betrokkene: de betrokkene, bedoeld in
      [artikel 1, onderdeel e, onder 1° en 2°][ref1], voor zover deze werkzaam is aan een instelling als bedoeld in
      [artikel 1, onderdeel d, onder 1° en 2°][ref2], voor zover het een publiekrechtelijke instelling betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '209'
    text: Aanstelling geschiedt in vaste of in tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel209
  - number: '210'
    text: |-
      Behoudens [artikel 211][ref1] geschiedt aanstelling in vaste dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel211
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '211'
        hoofdstuk: '2'
  - number: '211.1'
    text: 'Aanstelling in tijdelijke dienst vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel211
  - number: 211.1.a
    text: van een betrokkene die tijdelijk afwezig personeel vervangt;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel211
  - number: 211.1.b
    text: |-
      van een betrokkene die wordt aangesteld in verband met een tijdelijke voorziening in een vacature voor een termijn
      van maximaal 6 maanden, met dien verstande dat deze termijn in bijzondere gevallen eenmaal kan worden verlengd met
      ten hoogste 6 maanden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel211
  - number: '211.2'
    text: |-
      Aanstelling in tijdelijke dienst kan plaatsvinden indien het bevoegd gezag een proeftijd als bedoeld in
      [artikel 212][ref1] wenselijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel212
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '212'
        hoofdstuk: '2'
  - number: '211.3'
    text: |-
      Aanstelling in tijdelijke dienst op grond van het tweede lid geschiedt ten aanzien van de betrokkene, bedoeld
      in [artikel 1, onderdeel e, onder 1° en 2°][ref1], voor ten hoogste één jaar. In bijzondere gevallen
      kan met toestemming van Onze Minister van de vorige volzin worden afgeweken. Aanstelling in tijdelijke
      dienst op grond van het eerste lid, onderdeel a, geschiedt ten aanzien van de betrokkene, bedoeld in
      [artikel 1, onderdeel e, onder 1° en 2°][ref2], telkens voor ten hoogste één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '211.4'
    text: |-
      Aan de betrokkene wordt ten minste drie maanden vóór het verstrijken van de termijn waarvoor het tijdelijk
      dienstverband werd aangegaan, schriftelijk meegedeeld of het bevoegd gezag het dienstverband al dan niet wenst
      voort te zetten, voor zover dit redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel211
  - number: '212.1'
    text: |-
      De duur van de proeftijd bedraagt ten aanzien van de betrokkene, bedoeld in
      [artikel 1, onderdeel e, onder 1° en 2°][ref1], ten hoogste één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '212.2'
    text: Het bevoegd gezag deelt de betrokkene tijdig voor het einde van de proeftijd het oordeel hierover mee.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel212
  - number: '212.3'
    text: 'Een proeftijd kan achterwege blijven:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel212
  - number: 212.3.a
    text: indien de betrokkene reeds in vaste dienst bij het onderwijs werkzaam is in een overeenkomstige functie;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel212
  - number: 212.3.b
    text: |-
      indien het dienstverband van de betrokkene wordt voortgezet, nadat zijn tijdelijk dienstverband op grond van
      [ artikel 211, eerste lid][ref1], is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel211
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '211'
        hoofdstuk: '2'
  - number: 212.3.c
    text: in andere daarvoor naar het oordeel van het bevoegd gezag in aanmerking komende gevallen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel212
  - number: '213'
    text: (Vervallen)
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel213
  - number: '214.1'
    text: |-
      Het bevoegd gezag verstrekt aan de betrokkene zo mogelijk voor de indiensttreding, doch in elk geval uiterlijk
      vier weken na indiensttreding, kosteloos een gedagtekende akte van aanstelling, hieronder begrepen het besluit tot
      verlenging van een aanstelling dan wel heraanstelling in tijdelijke dienst. In het geval uitreiking van de akte
      van aanstelling voor de indiensttreding niet heeft plaatsgevonden, ontvangt de betrokkene voor de indiensttreding
      kosteloos een schriftelijke mededeling van het voornemen om tot aanstelling over te gaan.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel214
  - number: '214.2'
    text: |-
      De akte van aanstelling van de betrokkene die bij een bevoegd gezag is aangesteld aan een instelling als bedoeld in
      [artikel 1, onderdeel d, onder 1° en 2°][ref1], vermeldt ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 214.2.a
    text: het feit dat dit besluit van toepassing is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel214
  - number: 214.2.b
    text: |-
      in voorkomende gevallen, overeenkomstig de terzake van verplaatsingskosten geldende bepalingen, de verplichting te
      wonen in een bepaalde gemeente, in een bepaald deel daarvan, in een bepaalde bij de instelling behorende woning of
      in het internaat van de instelling;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel214
  - number: 214.2.c
    text: in voorkomende gevallen, bijzondere bepalingen die van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel214
  - number: '214.3'
    text: Het bevoegd gezag deelt wijzigingen van de inhoud van de akte van aanstelling schriftelijk aan de betrokkene mee.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel214
  - number: '214.4'
    text: Onze Minister kan omtrent de inhoud van de akte van aanstelling nadere voorschriften vaststellen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel214
  - number: '214.5'
    text: De betrokkene voor wie een instructie is vastgesteld, ontvangt tevens een afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel214
  - number: '214.6'
    text: |-
      Aan de betrokkene wordt bij het overleg inzake zijn eventuele aanstelling tijdig een model van de akte van
      aanstelling ter beschikking gesteld alsmede een model van de instructie voor zover deze voor hem zal gaan gelden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel214
  - number: '214.7'
    text: |-
      Indien het bevoegd gezag zulks wenst, geeft de betrokkene een ondertekende verklaring af, dat hij de in het eerste,
      vijfde en zesde lid bedoelde bescheiden heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel214
  - number: '214.8'
    text: |-
      Wanneer de werkzaamheden feitelijk zijn aangevangen, worden de volledige en juiste gegevens met betrekking tot het
      niveau en omvang van de betrekking in de akte van aanstelling aangetekend, indien deze ingevolge het eerste lid
      is uitgereikt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel214
  - number: '215.1'
    text: |-
      Schorsing is iedere tijdelijke ontheffing van de gehele of gedeeltelijke uitoefening van de
      functie van een betrokkene onder welke benaming dan ook op andere gronden dan wegens verlof,
      bedoeld in de [titels 3][ref1] en [4 van hoofdstuk 1 van dit besluit][ref2] of op grond van het
      __REF002___________________________________________________________________________________________________________
      ____________________.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0007800
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007800
  - number: '215.2'
    text: Schorsing geschiedt van rechtswege dan wel door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel215
  - number: '215.3'
    text: |-
      Tijdens de schorsing heeft de betrokkene slechts toegang tot de instelling na verkregen toestemming van het bevoegd
      gezag. Deze toestemming is niet vereist in het geval dat de betrokkene dit besluit wenst in te zien, tenzij dit
      besluit door het bevoegd gezag elders op een voor de betrokkene redelijkerwijs bereikbare plaats ter inzage is
      gelegd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel215
  - number: '216'
    text: 'Van rechtswege is geschorst de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel216
  - number: 216.a
    text: |-
      die krachtens een wettelijke maatregel van zijn vrijheid is beroofd, tenzij de vrijheidsbeneming het gevolg is van
      een maatregel, anders dan op grond van de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], genomen
      in het belang van de volksgezondheid;


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: 216.b
    text: |-
      die krachtens een rechterlijke uitspraak die nog niet onherroepelijk is geworden van het geven van onderwijs is
      uitgesloten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel216
  - number: '217.1'
    text: 'Het bevoegd gezag kan de betrokkene schorsen:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel217
  - number: 217.1.a
    text: |-
      in gevallen waarin het belang van de instelling dit vereist, voor ten hoogste drie maanden met dien verstande dat
      deze termijn in bijzondere gevallen eenmaal kan worden verlengd met ten hoogste drie maanden;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel217
  - number: 217.1.b
    text: |-
      in dringende bijzondere gevallen indien dit in het belang van de instelling noodzakelijk voorkomt, als voorlopige
      maatregel voor ten hoogste één week, met dien verstande dat deze termijn uitsluitend in het geval dat het bevoegd
      gezag tegelijk met de ingang van deze schorsing de betrokkene in kennis heeft gesteld van het voornemen hem te
      schorsen op grond van het bepaalde onder a, kan worden verlengd met ten hoogste drie weken.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel217
  - number: '217.2'
    text: |-
      In het geval dat de in het eerste lid, onder b, bedoelde schorsing wordt verlengd, wordt de duur van deze verlengde
      schorsing in mindering gebracht op de termijn van de daarop op grond van het eerste lid, onder a, volgende
      schorsing.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel217
  - number: '218.1'
    text: |-
      Betrokkene brengt, indien gewenst, binnen drie weken, nadat hij door het bevoegd gezag schriftelijk van
      het voornemen tot schorsing, bedoeld in [artikel 217, onder a][ref1], in kennis is gesteld, zijn zienswijze
      schriftelijk of mondeling naar voren.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel217
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '217'
        hoofdstuk: '2'
  - number: '218.2'
    text: |-
      Betrokkene brengt, indien gewenst, onmiddellijk nadat hij door het bevoegd gezag schriftelijk van de maatregel tot
      schorsing, bedoeld in [artikel 217, onder b][ref1], in kennis is gesteld, zijn zienswijze schriftelijk of mondeling
      naar voren.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel217
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '217'
        hoofdstuk: '2'
  - number: '218.3'
    text: |-
      Indien betrokkene mondeling zijn zienswijze kenbaar maakt wordt hiervan door het bevoegd gezag een verslag gemaakt.
      Dit verslag wordt getekend door het bevoegd gezag en door betrokkene. Weigert de betrokkene de ondertekening, dan
      wordt daarvan, zo mogelijk met vermelding van de redenen, melding gemaakt. Een afschrift van het verslag wordt aan
      betrokkene uitgereikt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel218
  - number: '218.4'
    text: |-
      Het besluit tot schorsing, bedoeld in [artikel 217, onder a][ref1], wordt genomen uiterlijk binnen een week nadat
      betrokkene zijn zienswijze heeft kenbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel217
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '217'
        hoofdstuk: '2'
  - number: '218.5'
    text: |-
      Het besluit tot schorsing, bedoeld in [ artikel 217, onder b][ref1], wordt onverwijld genomen doch uiterlijk de
      tweede dag nadat betrokkene zijn zienswijze heeft kenbaar gemaakt. Het bevoegd gezag kan betrokkene de toegang tot
      de school ontzeggen voor zolang het besluit nog niet te zijner kennis is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel217
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '217'
        hoofdstuk: '2'
  - number: '218.6'
    text: |-
      Van het intreden van een schorsing van rechtswege stelt het bevoegd gezag de betrokkene onverwijld doch uiterlijk
      binnen twee dagen in kennis.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel218
  - number: '219'
    text: |-
      De schorsing, bedoeld in [artikel 217][ref1], kan door het bevoegd gezag te allen tijde worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel217
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '217'
        hoofdstuk: '2'
  - number: '220'
    text: |-
      De betrokkene die de hem opgelegde verplichtingen niet nakomt of enig voorschrift overtreedt, dan wel datgene doet
      of nalaat dat hij bij een goede uitoefening van zijn functie in gelijke omstandigheden behoort na te laten of te
      doen, maakt zich schuldig aan plichtsverzuim en kan om die reden door het bevoegd gezag met inachtneming van de
      [artikelen 221 tot en met 225][ref1] disciplinair worden gestraft.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel221
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '221'
        hoofdstuk: '2'
  - number: '221.1'
    text: 'De disciplinaire straffen of maatregelen zijn:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel221
  - number: 221.1.a
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel221
  - number: 221.1.b
    text: verplaatsing naar een andere instelling onder hetzelfde bevoegd gezag met al dan niet gevolgen voor de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel221
  - number: 221.1.c
    text: |-
      inhouding van bezoldiging met toepassing van [artikel 222, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel222
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '222'
        hoofdstuk: '2'
  - number: 221.1.d
    text: schorsing voor maximaal 6 maanden;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel221
  - number: 221.1.e
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel221
  - number: '221.2'
    text: |-
      Met uitzondering van de in het eerste lid, onder c en d, bedoelde straffen, die naast elkaar kunnen worden
      opgelegd, kan het bevoegd gezag ter zake van één en hetzelfde feit slechts één disciplinaire straf of maatregel
      opleggen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel221
  - number: '221.3'
    text: |-
      Bij het opleggen van een straf of maatregel kan worden bepaald dat zij eerst ten uitvoer zal worden gelegd indien
      de betrokkene zich gedurende een vast te stellen termijn schuldig maakt aan soortgelijk plichtsverzuim als waarvoor
      de bestraffing plaatsvindt, dan wel zich niet houdt aan bij het opleggen van de straf eventueel gestelde bijzondere
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel221
  - number: '222.1'
    text: |-
      Inhouding van bezoldiging als zelfstandige disciplinaire straf of maatregel op grond van
      [artikel 221, eerste lid, onder c][ref1], kan geschieden tot een bedrag van ten hoogste de bezoldiging over een
      halve maand.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel221
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '221'
        hoofdstuk: '2'
  - number: '222.2'
    text: |-
      Inhouding van bezoldiging als disciplinaire straf of maatregel, opgelegd naast de in
      [artikel 221, eerste lid, onder d][ref1], genoemde schorsing, kan geheel of gedeeltelijk geschieden voor ten
      hoogste de duur van de schorsing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel221
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '221'
        hoofdstuk: '2'
  - number: '222.3'
    text: |-
      De ingehouden bezoldiging wordt alsnog uitbetaald, indien door de rechter geen straf wordt opgelegd of het besluit
      wordt vernietigd, alsmede voor zover op andere gronden alsnog tot uitbetaling wordt besloten. Op de aldus uit te
      keren bezoldiging worden in mindering gebracht de inkomsten, die de betrokkene sedert de schorsing, bedoeld in het
      tweede lid, heeft genoten uit arbeid die hij als gevolg van de schorsing heeft kunnen verrichten, tenzij zulks naar
      het oordeel van het bevoegd gezag onredelijk of onbillijk is.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel222
  - number: '222.4'
    text: |-
      Van de inhouding en de uitbetaling van de bezoldiging, bedoeld in dit artikel, doet het bevoegd gezag terstond
      mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel222
  - number: '223.1'
    text: |-
      De betrokkene brengt, indien gewenst, binnen drie weken, nadat hij door het bevoegd gezag schriftelijk van
      het voornemen tot het opleggen van een disciplinaire straf of maatregel in kennis is gesteld, zijn zienswijze
      schriftelijk of mondeling naar voren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel223
  - number: '223.2'
    text: |-
      Indien de betrokkene mondeling zijn zienswijze kenbaar maakt wordt hiervan door het bevoegd gezag een verslag
      gemaakt. Dit verslag wordt getekend door het bevoegd gezag en door de betrokkene. Weigert de betrokkene de
      ondertekening, dan wordt daarvan, zo mogelijk met vermelding van de redenen, melding gemaakt. Een afschrift van het
      verslag wordt aan de betrokkene uitgereikt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel223
  - number: '223.3'
    text: |-
      Het besluit tot het opleggen van een disciplinaire straf of maatregel wordt genomen, uiterlijk een week nadat de
      betrokkene zijn zienswijze kenbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel223
  - number: '224'
    text: |-
      Het recht tot het opleggen van een disciplinaire straf of maatregel vervalt, indien meer dan 9 maanden zijn
      verlopen na het tijdstip waarop het plichtsverzuim aan het bevoegd gezag bekend is geworden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel224
  - number: '225'
    text: |-
      De straf of maatregel, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd zolang zij niet
      onherroepelijk is geworden, tenzij bij de strafoplegging onmiddellijke tenuitvoerlegging is bevolen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel225
  - number: '226'
    text: |-
      Beëindiging van het dienstverband geschiedt door het bevoegd gezag al dan niet op verzoek van de betrokkene dan wel
      van rechtswege.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel226
  - number: '227.1'
    text: Het bevoegd gezag beëindigt het dienstverband van de betrokkene op diens schriftelijk verzoek.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel227
  - number: '227.2'
    text: |-
      Het bevoegd gezag behoeft dit verzoek niet in te willigen, indien een strafrechtelijke vervolging ter zake van
      misdrijf tegen de betrokkene is ingesteld of indien het overweegt de disciplinaire straf van ontslag op te leggen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel227
  - number: '227.3'
    text: |-
      Het bevoegd gezag beëindigt het dienstverband van de betrokkene die zulks heeft verzocht met het oog op een
      uitkering op grond van de Regeling flexibel pensioen en uittreden, bedoeld in artikel 3 van de Centrale vut-
      overeenkomst overheids- en onderwijspersoneel en artikel 1.5 van het pensioenreglement, indien het bestuur
      van de Stichting fonds vrijwillig vervroegd uittreden overheidspersoneel alsmede het bestuur van de Stichting
      Pensioenfonds ABP op grond van een desbetreffende aanvraag hebben vastgesteld dat na beëindiging van het
      dienstverband recht bestaat op een uitkering. Het dienstverband wordt niet eerder beëindigd dan met ingang van de
      dag waarop het recht op genoemde uitkering ontstaat.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel227
  - number: '227.4'
    text: |-
      Op verzoek van de betrokkene kan de in het derde lid genoemde beëindiging van het dienstverband ook voor een
      gedeelte van de voor hem geldende betrekkingsomvang worden verleend, tenzij de belangen van de dienst zich
      hiertegen verzetten. Het gedeelte van de betrekkingsomvang waarvoor beëindiging van het dienstverband wordt
      gevraagd, bedraagt ten minste 10% van de betrekkingsomvang. Beëindiging van het dienstverband voor een gedeelte
      van een betrekkingsomvang uit een betrekking waaruit reeds eerder gedeeltelijke beëindiging met het oog op
      de in het derde lid bedoelde uitkering heeft plaatsgevonden, bedraagt ten minste 10% van de oorspronkelijke
      betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel227
  - number: '228.1'
    text: 'Het bevoegd gezag beëindigt het dienstverband van de betrokkene op grond van:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel228
  - number: 228.1.a
    text: |-
      opheffing van de instelling of de betrekking of zodanige verandering in de inrichting van het onderwijs of de
      dienst van de instelling dat zijn werkzaamheden overbodig zullen worden;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel228
  - number: 228.1.b
    text: |-
      het bereiken van de pensioengerechtigde leeftijd, onverminderd [ artikel 230, vijfde lid][ref1], en
      [ artikel 231, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel230
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel231
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '230'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '231'
        hoofdstuk: '2'
  - number: 228.1.c
    text: |-
      het geraken in een toestand van ongeschiktheid ten gevolge van lichamelijke
      of psychische oorzaken, zulks met inachtneming van de bepalingen in
      __REF000___________________________________________________________________________________________________________
      ________________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel20
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '20'
  - number: '228.2'
    text: 'Het bevoegd gezag kan het dienstverband van de betrokkene beëindigen:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel228
  - number: 228.2.a
    text: |-
      wanneer hij in ernstige mate onbekwaam of ongeschikt blijkt te zijn voor de beklede betrekking anders dan in de
      gevallen, bedoeld in het eerste lid, onder c;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel228
  - number: 228.2.b
    text: |-
      bij wijze van disciplinaire straf of maatregel in de gevallen en op de wijze als omschreven in
      [titel 3 van hoofdstuk 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '2'
  - number: 228.2.c
    text: indien de betrokkene bij onherroepelijk geworden vonnis is veroordeeld tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel228
  - number: 228.2.d
    text: |-
      indien hij in verband met aanstelling of keuring opzettelijk onjuiste of onvolledige inlichtingen heeft verstrekt,
      zonder welke handelwijze niet tot benoeming of geschiktverklaring zou zijn overgegaan, tenzij meer dan 6 maanden
      zijn verstreken sinds de vaststelling van dit feit;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel228
  - number: 228.2.e
    text: op grond van andere met name genoemde en aan de betrokkene schriftelijk meegedeelde redenen van gewichtige aard.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel228
  - number: '228.3'
    text: |-
      Indien het dienstverband van de betrokkene, bedoeld in [ artikel 1, onderdeel e, onder 1° en 2°][ref1], wordt
      beëindigd op grond van de gevallen genoemd in het tweede lid, onder a en e, wordt de inspectie gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '229'
    text: 'Het dienstverband van de betrokkene eindigt van rechtswege:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel229
  - number: 229.a
    text: door het verstrijken van de tijd waarvoor het blijkens de akte van aanstelling is aangegaan;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel229
  - number: 229.b
    text: indien de betrokkene krachtens onherroepelijke rechterlijke uitspraak van het geven van onderwijs is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel229
  - number: '230.1'
    text: 'Bij tussentijdse beëindiging van een tijdelijk dienstverband bedraagt de termijn van opzegging:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel230
  - number: 230.1.a
    text: één maand indien het dienstverband ten tijde van de opzegging korter dan 6 maanden onafgebroken heeft bestaan;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel230
  - number: 230.1.b
    text: |-
      twee maanden indien het dienstverband ten tijde van de opzegging ten minste 6 maanden doch korter dan 12 maanden
      onafgebroken heeft bestaan;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel230
  - number: 230.1.c
    text: |-
      drie maanden indien het dienstverband ten tijde van de opzegging ten minste twaalf maanden onafgebroken heeft
      bestaan.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel230
  - number: '230.2'
    text: |-
      In het geval, bedoeld in [artikel 227, eerste lid][ref1], zijn de opzeggingstermijnen, bedoeld in het eerste lid,
      van overeenkomstige toepassing, onverminderd [ artikel 232][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel232
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '27'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '232'
        hoofdstuk: '2'
  - number: '230.3'
    text: |-
      Opzegging als bedoeld in het eerste lid kan niet geschieden gedurende de zwangerschap van
      de vrouwelijke betrokkene, noch gedurende het zwangerschaps- en bevallingsverlof, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________________________________________________, noch, indien zij haar dienst heeft hervat, gedurende een
      periode van zes weken volgend op dat verlof. Het bevoegd gezag kan ter staving van de zwangerschap een verklaring
      van een arts of van een verloskundige verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel9
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '9'
  - number: '230.4'
    text: |-
      Opzegging als bedoeld in het eerste lid, kan niet plaats vinden wegens het feit dat de betrokkene door een centrale
      als bedoeld in [ artikel 1, onderdeel i, van het Overlegbesluit onderwijs- en onderzoekpersoneel][ref1] of door
      een daarbij aangesloten vereniging is aangewezen om bestuurlijke of vertegenwoordigende activiteiten te ontplooien
      binnen zijn centrale of een daarbij aangesloten vereniging dan wel binnen de organisatie van de werkgever, die
      er toe strekken de doelstellingen van zijn centrale van overheidspersoneel en de daarbij aangesloten verenigingen
      te ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '230.5'
    text: |-
      In het geval, bedoeld in [ artikel 228, eerste lid onder b][ref1], eindigt het dienstverband op de laatste dag
      van de maand waarin de pensioengerechtigde leeftijd werd bereikt, tenzij in overeenstemming met de betrokkene de
      ontslagdatum naar een later tijdstip wordt verschoven.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel228
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '228'
        hoofdstuk: '2'
  - number: '230.6'
    text: |-
      In de gevallen, bedoeld in [ artikel 228, tweede lid][ref1], kan het dienstverband eerst worden beëindigd met
      ingang van de dag, volgende op die, waarop de reden van het ontslag voor het eerst aanwezig was.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel228
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '228'
        hoofdstuk: '2'
  - number: '230.7'
    text: |-
      In het geval de betrokkene blijkens het doorlopen van de procedure, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________________________, blijvend ongeschikt is verklaard voor de vervulling van zijn functie,
      eindigt het dienstverband niet eerder dan op de dag waarop het ontslagbesluit hem ter kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel20
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '20'
  - number: '231.1'
    text: |-
      In het geval, bedoeld in [ artikel 227, eerste en derde lid][ref1], bedraagt de opzeggingstermijn drie maanden,
      onverminderd [ artikel 232][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel227
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel232
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '227'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '232'
        hoofdstuk: '2'
  - number: '231.2'
    text: |-
      Bij beëindiging van het dienstverband op grond van [ artikel 228, eerste lid, onder a][ref1], bedraagt de
      opzeggingstermijn 3 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel228
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '228'
        hoofdstuk: '2'
  - number: '231.3'
    text: |-
      In het geval, bedoeld in [ artikel 228, eerste lid, onder b][ref1], eindigt het dienstverband op de laatste dag
      van de maand waarin de pensioengerechtigde leeftijd werd bereikt, tenzij in overeenstemming met de betrokkene de
      ontslagdatum naar een later tijdstip wordt verschoven.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel228
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '228'
        hoofdstuk: '2'
  - number: '231.4'
    text: |-
      In de gevallen, bedoeld in [ artikel 228, tweede lid][ref1], kan het dienstverband eerst worden beëindigd met
      ingang van de dag, volgende op die, waarop de reden van het ontslag voor het eerst aanwezig was.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel228
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '228'
        hoofdstuk: '2'
  - number: '231.5'
    text: |-
      In het geval de betrokkene blijkens het doorlopen van de procedure, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________________________, blijvend ongeschikt is verklaard voor de vervulling van zijn functie,
      eindigt het dienstverband niet eerder dan op de dag waarop het ontslagbesluit hem ter kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel20
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '20'
  - number: '232'
    text: |-
      In het geval, bedoeld in [ artikel 227, eerste lid][ref1], kan van de voor de beëindiging van het dienstverband in
      de [ artikelen 230, eerste lid][ref2], en [ 231, eerste lid][ref3], geldende opzeggingstermijnen worden afgeweken:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel227
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel230
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel231
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '227'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '230'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '231'
        hoofdstuk: '2'
  - number: 232.a
    text: indien wordt overwogen de betrokkene een disciplinaire straf op te leggen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel232
  - number: 232.b
    text: |-
      indien het belang van het onderwijs zulks vordert, met dien verstande, dat de termijn van 3 maanden tot ten
      hoogste 6 maanden kan worden verlengd en met niet meer dan 2 maanden kan worden bekort en dat bij een afwijking in
      redelijkheid met het belang van de betrokkene rekening wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel232
  - number: 232.c
    text: op verzoek van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel232
  - number: '233.1'
    text: |-
      Over de tijd die aan de in [ artikel 230][ref1] en [ artikel 231][ref2] bedoelde opzeggingstermijnen bij
      beëindiging van het dienstverband niet op verzoek mocht ontbreken, heeft de betrokkene recht op doorbetaling van
      de bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel230
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel231
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '230'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '231'
        hoofdstuk: '2'
  - number: '233.2'
    text: 'De aanspraak op bezoldiging vervalt geheel of gedeeltelijk met ingang van de dag waarop de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel233
  - number: 233.2.a
    text: gedurende de opzeggingstermijn uit eigen beweging de dienst verlaat;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel233
  - number: 233.2.b
    text: |-
      gedurende de opzeggingstermijn een andere betrekking gaat bekleden, tenzij en voor zover deze betrekking samenvalt
      met een hem nog toekomend vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel233
  - number: '234.1'
    text: Het dienstverband kan worden beëindigd onder de kwalificatie eervol dan wel zonder nadere kwalificatie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel234
  - number: '234.2'
    text: |-
      In de gevallen, bedoeld in de [ artikelen 227, eerste lid][ref1], [ 228, eerste lid en tweede lid, onder a][ref2],
      en [ 229, onder a][ref3], wordt het dienstverband steeds onder de kwalificatie eervol beëindigd, tenzij de
      beëindiging van het dienstverband aan eigen schuld of toedoen is te wijten.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel227
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel228
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel229
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '227'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '228'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '229'
        hoofdstuk: '2'
  - number: '235.1'
    text: |-
      Betrokkene brengt, indien gewenst, binnen 3 weken, nadat hij door het bevoegd gezag schriftelijk van het
      voornemen tot beëindiging van het dienstverband, anders dan op grond van de omstandigheid, bedoeld in
      [ artikel 228, eerste lid, onder b][ref1], in kennis is gesteld, zijn zienswijze schriftelijk of mondeling naar
      voren.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel228
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '228'
        hoofdstuk: '2'
  - number: '235.2'
    text: |-
      Indien betrokkene mondeling zijn zienswijze kenbaar maakt wordt hiervan door het bevoegd gezag een verslag gemaakt.
      Dit verslag wordt getekend door het bevoegd gezag en door betrokkene. Weigert de betrokkene de ondertekening, dan
      wordt daarvan, zo mogelijk met vermelding van de redenen, melding gemaakt. Een afschrift van het verslag wordt aan
      betrokkene uitgereikt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel235
  - number: '235.3'
    text: |-
      Het besluit tot beëindiging van het dienstverband wordt genomen, uiterlijk een week nadat betrokkene zijn
      zienswijze kenbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel235
  - number: '235.4'
    text: |-
      Van een beëindiging van het dienstverband van rechtswege stelt het bevoegd gezag de betrokkene zo spoedig mogelijk
      in kennis.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel235
  - number: '236'
    text: |-
      In deze titel wordt onder commissie verstaan: de commissie van beroep, bedoeld in
      [ artikel 62, vijfde lid, van de Wet op het primair onderwijs][ref1], dan wel de commissie van beroep, bedoeld in
      [ artikel 65, vijfde lid, van de Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel65
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '65'
  - number: '237'
    text: |-
      Een commissie wordt ingesteld door de besturen van de bijzondere instellingen waarover zij haar werkkring zal
      uitstrekken. De commissie deelt Onze Minister mee, welke instellingen bij haar zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel237
  - number: '238.1'
    text: |-
      Met inachtneming van de in het tweede tot en met het zesde lid van dit artikel neergelegde voorschriften
      geschiedt de verkiezing van de commissie aan de hand van een door de besturen van de instellingen op te stellen
      verkiezingsregeling.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel238
  - number: '238.2'
    text: |-
      De commissie bestaat uit 5 leden en 5 plaatsvervangende leden, waarvan 2 leden en 2 plaatsvervangende leden worden
      gekozen door de instellingsbesturen, en 2 leden en 2 plaatsvervangende leden door het personeel van de bij de
      commissie aangesloten instellingen. De 2 leden gekozen door de instellingsbesturen en de 2 leden gekozen door
      het personeel van de instelling kiezen gezamenlijk het vijfde lid, tevens voorzitter, en zijn plaatsvervanger.
      Bij staking van stemmen beslist het lot, desgewenst na herstemming, tenzij partijen een arbitraire oplossing
      aanvaarden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel238
  - number: '238.3'
    text: |-
      Om de 3 jaar treedt één van de door de instellingsbesturen en één van de door het personeel gekozen leden en
      plaatsvervangende leden af volgens een door de commissie op te stellen rooster.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel238
  - number: '238.4'
    text: De voorzitter en de plaatsvervangend voorzitter worden gekozen voor de tijd van 3 jaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel238
  - number: '238.5'
    text: |-
      De voorzitter en de plaatsvervangend voorzitter en de overige leden en plaatsvervangende leden zijn bij aftreden
      onmiddellijk herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel238
  - number: '238.6'
    text: In een opengevallen plaats wordt binnen 6 weken voorzien.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel238
  - number: '239.1'
    text: 'Voorzitter, plaatsvervangend voorzitter, lid en plaatsvervangend lid van een commissie kan niet zijn hij die:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel239
  - number: 239.1.a
    text: |-
      zitting heeft in of in dienst is van het instellingsbestuur of het bestuur van een vereniging van
      instellingsbesturen, of deel uitmaakt van het personeel van een instelling waarover de commissie waarvan hij deel
      uitmaakt, haar werkkring uitstrekt;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel239
  - number: 239.1.b
    text: |-
      in dienst is van een vereniging van onderwijzend personeel dan wel zitting heeft in een bestuur
      van een vereniging als bedoeld in [ artikel 64 van de Wet op het primair onderwijs][ref1] of
      [artikel 66 van de Wet op de expertisecentra][ref2], waarvan het lidmaatschap open staat voor personeel van
      instellingen waarvoor de commissie waarvan hij deel uitmaakt, is ingesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel66
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '66'
  - number: 239.1.c
    text: deel uitmaakt van de rijksinspectie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel239
  - number: '239.2'
    text: |-
      Voorzitter en plaatsvervangend voorzitter kan slechts zijn hij die de hoedanigheid van meester in de rechten heeft
      verkregen op grond van een met goed gevolg afgelegd doctoraal examen in het Nederlands recht aan een Nederlandse
      universiteit of hogeschool.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel239
  - number: '240.1'
    text: |-
      Zodra hij verkozen is, geeft de voorzitter aan Onze Minister en aan de bij de commissie aangesloten
      instellingsbesturen onverwijld kennis van de samenstelling van de commissie, onder vermelding van zijn adres en
      eventuele andere gegevens die hij van belang acht.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel240
  - number: '240.2'
    text: Wijziging van deze gegevens deelt de voorzitter onverwijld eveneens mee.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel240
  - number: '241.1'
    text: |-
      De commissie legt binnen 6 maanden na haar verkiezing de regeling van haar werkzaamheden vast in een huishoudelijk
      reglement en voorziet daarin in haar secretariaat.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel241
  - number: '241.2'
    text: |-
      De voorzitter brengt dit reglement, alsmede wijzigingen daarvan, ter kennis van Onze Minister en van de bij de
      commissie aangesloten instellingsbesturen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel241
  - number: '242.1'
    text: |-
      Het instellingsbestuur draagt er zorg voor, dat een kennisgeving van de samenstelling van de commissie waarbij de
      instelling is aangesloten en van het adres van de voorzitter, alsmede een exemplaar van het huishoudelijk reglement
      van de commissie steeds op een voor de betrokkene toegankelijke plaats in de instelling ter inzage beschikbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel242
  - number: '242.2'
    text: |-
      Deze kennisgeving en dit huishoudelijk reglement worden steeds onverwijld aangepast aan de wijzigingen, bedoeld in
      [artikel 240, tweede lid][ref1], en [artikel 241, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel241
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '240'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '241'
        hoofdstuk: '3'
  - number: '242.3'
    text: |-
      Stukken die moeten worden ingediend bij de voorzitter of de commissie, kunnen worden toegezonden aan het bekend
      gemaakte kantooradres van de secretaris.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel242
  - number: '243.1'
    text: 'De betrokkene kan in beroep komen tegen een door het instellingsbestuur genomen besluit inhoudende:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.1.a
    text: ontzegging van de toegang tot de instelling;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.1.b
    text: oplegging van een straf;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.1.c
    text: |-
      ontslag anders dan op eigen verzoek, voordat hij de pensioengerechtigde leeftijd heeft bereikt, of het tijdvak
      waarvoor hij is benoemd, is verstreken;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.1.d
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.1.e
    text: het direct of indirect onthouden van promotie;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.1.f
    text: |-
      de beslissing van het instellingsbestuur ten aanzien van een personeelslid op basis waarvan op termijn opheffing
      van zijn betrekking kan plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.1.g
    text: de beëindiging van een verlengd tijdelijk dienstverband;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.1.h
    text: |-
      de aanwijzing als personeelslid boven de reguliere formatie voortvloeiend uit een algemeen verbindend voorschrift,
      die op termijn kan leiden tot ontslag of beëindiging van een verlengd tijdelijk dienstverband;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.1.i
    text: de aanwijzing van een andere school of andere scholen waaraan een betrokkene werkzaamheden zal verrichten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: '243.2'
    text: |-
      Indien in de gevallen, bedoeld in het eerste lid, de betrokkene voor het verstrijken van de beroepstermijn is
      overleden, kunnen in beroep komen zijn nagelaten betrekkingen die recht hebben op een uitkering bij overlijden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: '243.3'
    text: |-
      De appellant dient bij de voorzitter van de commissie een door hem of door zijn raadsman ondertekend beroepschrift
      in, waarbij wordt gevoegd:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.3.a
    text: een afschrift van het bestuursbesluit waartegen het beroep wordt ingesteld;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.3.b
    text: een afschrift van de akte van benoeming;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.3.c
    text: afschriften van de voornaamste op de zaak betrekking hebbende stukken.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: '243.4'
    text: 'Het beroepschrift bevat:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.4.a
    text: |-
      een opgave van de naam, de voornamen en het adres van de appellant en zo nodig de gekozen woonplaats ten aanzien
      van de procedure;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.4.b
    text: een zo volledig mogelijke aanduiding van de naam en het adres van de tegenpartij;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: 243.4.c
    text: een mededeling van de vordering en de gronden waarop deze berust.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: '243.5'
    text: |-
      Het beroepschrift moet worden ingediend bij de voorzitter van de commissie binnen 6 weken, gerekend vanaf de dag na
      die waarop het bestuursbesluit waartegen het beroep wordt ingesteld, aan appellant is verzonden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: '243.6'
    text: |-
      Indien het beroepschrift niet voldoet aan de eisen gesteld in het tweede en derde lid van dit artikel, wijst de
      voorzitter de appellant op het gepleegde verzuim en nodigt hem uit binnen 2 weken een hersteld beroepschrift in
      te zenden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel243
  - number: '244.1'
    text: |-
      Indien het geschil kennelijk bij een andere commissie moet worden aangebracht, deelt de voorzitter dit onverwijld
      bij aangetekende brief aan de appellant mee. Over andere gevallen van onbevoegdheid beslist de commissie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel244
  - number: '244.2'
    text: |-
      Indien het beroepschrift na de daarvoor gestelde termijn is ingediend, laat de commissie niet-ontvankelijk
      verklaring op die grond achterwege, indien de appellant aantoont dat hij de voorziening in beroep heeft gevraagd zo
      spoedig als dit redelijkerwijs verlangd kon worden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel244
  - number: '244.3'
    text: |-
      Tenzij de behandeling in het eerste en tweede lid er toe leidt het beroepschrift niet in behandeling te
      nemen, zendt de voorzitter onmiddellijk na ontvangst van het beroepschrift of hersteld beroepschrift een
      exemplaar daarvan, vergezeld van de in [ artikel 243, derde lid][ref1], genoemde afschriften, aan het betrokken
      instellingsbestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel243
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '243'
        hoofdstuk: '3'
  - number: '245.1'
    text: |-
      Binnen twee weken na ontvangst van het door de voorzitter van de commissie toegezonden beroepschrift en de daarbij
      behorende afschriften doet het instellingsbestuur de voorzitter een verweerschrift in drievoud toekomen. Bij elk
      exemplaar voegt het instellingsbestuur afschriften van de voornaamste op de zaak betrekking hebbende stukken. De
      voorzitter kan op tijdig verzoek van het instellingsbestuur de termijn voor verweer in uitzonderlijke gevallen
      verlengen tot een door hem te bepalen datum.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel245
  - number: '245.2'
    text: |-
      Na ontvangst van het verweerschrift zendt de voorzitter onverwijld een exemplaar daarvan, vergezeld van de daarbij
      behorende afschriften, aan de appellant.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel245
  - number: '246.1'
    text: De voorzitter bepaalt de dag en het uur waarop de zaak zal worden behandeld.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel246
  - number: '246.2'
    text: |-
      Die dag zal niet later mogen worden gesteld dan zes weken na ontvangst van het beroepschrift of het hersteld
      beroepschrift, tenzij de betrokkene zulks verzoekt wegens niet tijdige ontvangst. Overschrijding van deze termijn
      wordt alleen in uitzonderlijke gevallen toegestaan en dient te worden gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel246
  - number: '246.3'
    text: |-
      De voorzitter geeft binnen twee weken na ontvangst van het beroepschrift of van het hersteld beroepschrift aan
      beide partijen per aangetekende brief kennis van de plaats, de dag en het uur, waarop de zaak zal worden behandeld.
      Overschrijding van deze termijn is slechts in uitzonderlijke gevallen toegestaan en dient te worden gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel246
  - number: '247'
    text: |-
      Met eenstemmig goedvinden van de commissie en partijen kan de behandeling van het geschil ook schriftelijk
      geschieden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel247
  - number: '248.1'
    text: |-
      Voor de aanvang van de behandeling van de zaak op de zitting kan op verzoek van een partij een lid van de commissie
      worden gewraakt:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel248
  - number: 248.1.a
    text: indien hij persoonlijk belang bij het geschil heeft;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel248
  - number: 248.1.b
    text: |-
      indien hij aan de appellant, dan wel aan een van de leden van het bij de zaak betrokken instellingsbestuur in
      bloed- of aanverwantschap bestaat tot in de vierde graad ingesloten;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel248
  - number: 248.1.c
    text: indien hij een advies in de zaak heeft gegeven of met een van de partijen een bespreking erover heeft gevoerd;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel248
  - number: 248.1.d
    text: indien er een hoge graad van vijandschap of vriendschap bestaat tussen hem en een van de partijen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel248
  - number: 248.1.e
    text: |-
      indien hij binnen een tijdvak van vijf jaren, voorafgaande aan de datum van ontvangst van het beroepschrift door de
      voorzitter, lid is geweest van het instellingsbestuur of in dienst van het bestuur is geweest;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel248
  - number: 248.1.f
    text: in andere gevallen waarin daartoe een ernstige reden aanwezig is.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel248
  - number: '248.2'
    text: In dezelfde gevallen kan een lid van de commissie zich verschonen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel248
  - number: '248.3'
    text: Over de wraking of de verschoning wordt zo spoedig mogelijk beslist door de overige leden der commissie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel248
  - number: '248.4'
    text: Bij staking van stemmen wordt de wraking geacht te zijn toegewezen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel248
  - number: '249'
    text: |-
      Indien de commissie zulks ter beslissing van de zaak nodig acht, kan zij al dan niet op grond van een daartoe
      strekkend verzoek van een partij getuigen en deskundigen ter zitting horen. Indien zij van deze bevoegdheid gebruik
      maakt, doet de voorzitter hiervan vooraf mededeling aan partijen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel249
  - number: '250.1'
    text: De zittingen van de commissie zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel250
  - number: '250.2'
    text: Indien een partij daarom verzoekt, vindt de zitting geheel of gedeeltelijk achter gesloten deuren plaats.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel250
  - number: '250.3'
    text: |-
      In het belang van de openbare orde of zedelijkheid of om gewichtige in het proces-verbaal van de zitting te
      vermelden redenen, kan de commissie bepalen, dat de zitting geheel of gedeeltelijk achter gesloten deuren zal
      plaatshebben.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel250
  - number: '250.4'
    text: 'Tijdens de zitting wordt aan partijen de gelegenheid gegeven:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel250
  - number: 250.4.a
    text: haar belangen voor te dragen of te doen voordragen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel250
  - number: 250.4.b
    text: getuigen en deskundigen te doen horen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel250
  - number: 250.4.c
    text: |-
      kennis te nemen van alle op het geschil betrekking hebbende stukken, waarvan, voor zover mogelijk, ten minste 1
      week voor de zitting aan partijen inzage wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel250
  - number: '251.1'
    text: Binnen 2 weken na de laatste zitting waarop de zaak is behandeld, beslist de commissie op het beroepschrift.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel251
  - number: '251.2'
    text: |-
      Deze dag zal niet later mogen worden gesteld dan 16 weken na de indiening van het beroepschrift of het hersteld
      beroepschrift. Overschrijding van deze termijn is slechts in uitzonderlijke gevallen toegestaan en wordt in de
      beslissing gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel251
  - number: '251.3'
    text: |-
      De beslissing, bedoeld in het eerste lid, wordt zoveel mogelijk genomen in een voltallige vergadering. Het is de
      leden van de commissie niet toegestaan de gevoelens die tijdens deze vergadering over het geschil zijn geuit, te
      openbaren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel251
  - number: '251.4'
    text: |-
      Een beslissing is slechts van kracht, indien genomen door ten minste 3 leden die de zaak hebben behandeld,
      waaronder de voorzitter of plaatsvervangend voorzitter, met dien verstande dat van de leden of plaatsvervangende
      leden, gekozen door de besturen en door het personeel, een gelijk getal van beide zijden aan de beslissing zal
      deelnemen en dat bij ongelijk getal het jongste lid in leeftijd van de zijde die het sterkst is vertegenwoordigd,
      zich van de stemming zal onthouden. De overige leden onthouden zich niet van stemmen, noch stemmen zij blanco.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel251
  - number: '251.5'
    text: |-
      De beslissing wordt met redenen omkleed en door de voorzitter binnen 2 weken, nadat zij is genomen, bij aangetekend
      schrijven aan de partij toegezonden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel251
  - number: '251.6'
    text: De voorzitter zendt een afschrift van de beslissing naar Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel251
  - number: '251.7'
    text: Het instellingsbestuur onderwerpt zich aan de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel251
  - number: '252'
    text: De kosten van de commissie komen ten laste van de bij haar aangesloten instellingsbesturen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel252
  - number: '253'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel253
  - number: 253.a
    text: |-
      overlegorgaan: een overlegorgaan als bedoeld in [artikel 254][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel254
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel253
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '254'
        hoofdstuk: '4'
  - number: 253.b
    text: |-
      Sectorcommissie Onderwijspersoneel: de commissie, bedoeld in
      [artikel 2, eerste lid, van het Overlegbesluit onderwijspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006446#Artikel2
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel253
    references:
      - id: ref1
        bwb_id: BWBR0006446
        artikel: '2'
  - number: '254.1'
    text: |-
      Ten behoeve van de van één bevoegd gezag uitgaande gezamenlijke instellingen die behoren tot eenzelfde categorie
      als bedoeld in [artikel 1, onderdeel d][ref1], is er een orgaan van georganiseerd overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '254.2'
    text: |-
      Bevoegde gezagsorganen kunnen besluiten dat over bepaalde zaken die meer dan één orgaan van georganiseerd overleg
      aan eenzelfde categorie van instellingen aangaan, overleg wordt gevoerd in een overkoepelend overlegorgaan.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel254
  - number: '254.3'
    text: |-
      Indien over een bepaalde zaak overleg is gevoerd in een overkoepelend overlegorgaan kan hierover geen overleg meer
      worden gevoerd in de desbetreffende afzonderlijke organen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel254
  - number: '254.4'
    text: |-
      Een bevoegd gezag kan in overleg met het orgaan, bedoeld in het eerste lid, in afwijking van het eerste lid
      besluiten dat het overleg over alle zaken die een of een aantal instellingen als bedoeld in het eerste lid aangaan,
      wordt gevoerd in deelorganen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel254
  - number: '254.5'
    text: |-
      Bevoegde gezagsorganen kunnen in afwijking van het eerste lid besluiten dat in plaats van een overlegorgaan bij
      elk bevoegd gezag het overleg over alle zaken wordt gevoerd in een overkoepelend overlegorgaan. Dit overkoepelend
      overleg kan verschillende categorieën van instellingen, bedoeld in [artikel 1, onderdeel d][ref1], betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '254.6'
    text: |-
      Bevoegde gezagsorganen kunnen in afwijking van het tweede lid besluiten dat over de zaken, genoemd in
      [artikel 257, eerste lid][ref1], in een overkoepelend overlegorgaan overleg wordt gevoerd dat verschillende
      categorieën van instellingen als bedoeld in [artikel 1, onderdeel d][ref2], kan betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel257
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '257'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '255.1'
    text: |-
      In een overlegorgaan als bedoeld in [ artikel 254, eerste lid][ref1], wordt het personeel vertegenwoordigd door
      vertegenwoordigers van de tot de Raad voor het Overheidspersoneelsbeleid toegelaten centrales.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel254
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '254'
        hoofdstuk: '4'
  - number: '255.2'
    text: |-
      Overlegorganen als bedoeld in [ artikel 254, tweede, vierde, vijfde en zesde lid][ref1], bestaan uit
      vertegenwoordigers van de tot de Raad voor het Overheidspersoneelsbeleid toegelaten centrales en uit
      vertegenwoordigers aangewezen door de desbetreffende bevoegde gezagsorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel254
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '254'
        hoofdstuk: '4'
  - number: '256.1'
    text: |-
      In een overlegorgaan wordt overleg gevoerd over aangelegenheden van algemeen belang voor de bijzondere
      rechtstoestand van het personeel van de instelling of de instellingen met inbegrip van de bijzondere regels volgens
      welke het personeelsbeleid bij de instelling of de instellingen zal worden gevoerd alsmede over een reglement voor
      het overleg.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel256
  - number: '256.2'
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van aangelegenheden waarover overleg is gevoerd met de
      Sectorcommissie Onderwijspersoneel of de Raad voor het Overheidspersoneelsbeleid alsmede ten aanzien van
      aangelegenheden waarin het bevoegd gezag toepassing geeft aan een ter zake van die aangelegenheid overeengekomen
      regeling tussen de tot de Raad voor het Overheidspersoneelsbeleid toegelaten centrales en de vereniging van
      instellingsbesturen waarbij het bevoegd gezag is aangesloten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel256
  - number: '256.3'
    text: |-
      Het bevoegd gezag dan wel de bevoegde gezagsorganen en de vertegenwoordigers van het personeel in het overlegorgaan
      kunnen gezamenlijk besluiten dat het overleg over de in het eerste lid bedoelde aangelegenheden, voor zover
      dit betrekking heeft op een of meer door het bevoegd gezag in stand gehouden instellingen, wordt gevoerd met de
      personeelsgeleding van de medezeggenschapsraad, bedoeld in de [Wet medezeggenschap onderwijs 1992][ref1] van de
      desbetreffende instelling of instellingen. [ Artikel 258, derde en vierde volzin][ref2], is van overeenkomstige
      toepassing. Het bevoegd gezag en de vertegenwoordigers van het personeel bepalen daarbij onder welke voorwaarden
      dat overleg wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005746
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel258
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel256
    references:
      - id: ref1
        bwb_id: BWBR0005746
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '258'
        hoofdstuk: '4'
  - number: '257.1'
    text: |-
      Onverminderd [artikel 256, eerste lid][ref1], wordt in een overlegorgaan overleg gevoerd over de
      arbeidsvoorwaardelijke gevolgen van:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel256
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '256'
        hoofdstuk: '4'
  - number: 257.1.a
    text: |-
      een door de gemeenteraad voorgenomen vaststelling of wijziging van een onderwijsachterstandenplan
      of een door de gemeenteraad voorgenomen besluit omtrent de verdeling van de middelen,
      bedoeld in [artikel 166, eerste lid, van de Wet op het primair onderwijs][ref1] of
      [artikel 153, eerste lid, van de Wet op de expertisecentra][ref2] en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel166
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel153
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '166'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '153'
  - number: 257.1.b
    text: |-
      een door de gemeenteraad voorgenomen vaststelling of wijziging van een plan inzake onderwijs in
      allochtone levende talen of een door de gemeenteraad voorgenomen besluit omtrent de verdeling van
      de middelen, bedoeld in [ artikel 171, eerste lid, van de Wet op het primair onderwijs][ref1] of
      [artikel 157, eerste lid, van de Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel157
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '157'
  - number: '257.2'
    text: |-
      Het overleg, bedoeld in het eerste lid, vindt plaats op een zodanig tijdstip dat een in een overlegorgaan
      vertegenwoordigd bevoegd gezag in staat is de uitkomsten daarvan onderdeel te maken van het op overeenstemming
      gericht overleg dat het voert met de betrokken gemeenteraad voorafgaand aan de vaststelling of wijziging van een
      plan of het nemen van een besluit als bedoeld in het eerste lid, onder a of b.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel257
  - number: '258'
    text: |-
      Over zaken die behoren tot de competentie van het overlegorgaan, wordt overleg gevoerd dat is gericht op
      het bereiken van overeenstemming. Indien zulks bij wet of bij algemene maatregel van bestuur ten aanzien van
      een onderwerp is bepaald, neemt het bevoegd gezag uitsluitend een besluit indien daarover overeenstemming is
      bereikt. Het bevoegd gezag dan wel de door de bevoegde gezagsorganen aangewezen vertegenwoordigers enerzijds en
      de vertegenwoordigers van de tot de Raad voor het Overheidspersoneelsbeleid toegelaten centrales als bedoeld in
      [artikel 255][ref1] anderzijds bepalen voor alle overlegorganen in onderling overleg wat wordt verstaan onder
      overeenstemming. Zolang zulks niet is bepaald, wordt in het desbetreffende overlegorgaan onder overeenstemming
      verstaan het geval waarin het bevoegd gezag dan wel de door de bevoegde gezagsorganen aangewezen vertegenwoordigers
      enerzijds en de vertegenwoordigers in dat overlegorgaan van alle tot de Raad voor het Overheidspersoneelsbeleid
      toegelaten centrales anderzijds instemmen met de uitkomst van het overleg, over een bepaald onderwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel255
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel258
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '255'
        hoofdstuk: '4'
  - number: '259.1'
    text: |-
      Indien één of meer personeelsvertegenwoordigers over een zaak, die behoort tot de competentie van het
      overlegorgaan, tot het oordeel komen dat het overleg daarover niet tot een uitkomst zal leiden die de instemming
      van alle deelnemers aan dat overleg zal hebben, kunnen zij dat oordeel binnen drie dagen nadat zij daarvan in het
      overleg blijk hebben gegeven schriftelijk ter kennis brengen van de overige deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel259
  - number: '259.2'
    text: |-
      Binnen vijf dagen na de kennisgeving, bedoeld in het eerste lid, schrijft de voorzitter van het orgaan een
      overlegvergadering uit. De vergadering wordt gehouden binnen zeven dagen nadat deze is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel259
  - number: '259.3'
    text: |-
      In het overlegorgaan wordt dan alsnog bezien of een uitkomst van het overleg mogelijk is, die de instemming van
      alle deelnemers aan het overleg heeft.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel259
  - number: '260.1'
    text: |-
      Elk der personeelsvertegenwoordigers is bevoegd binnen vijf dagen nadat in de overlegvergadering, bedoeld in
      [artikel 259, tweede lid][ref1], is geconstateerd dat geen overeenstemming als bedoeld in [artikel 258][ref2] kan
      worden bereikt over een door of namens het bevoegd gezag aan het overleg voorgelegd beleidsvoornemen, het geschil
      voor te leggen aan de geschillencommissie, bedoeld in [artikel 38 van de Wet op het primair onderwijs][ref3],
      respectievelijk [artikel 38 van de Wet op de expertisecentra][ref4], waarbij de instelling is aangesloten. De
      desbetreffende personeelsvertegenwoordiger stelt het bevoegd gezag onverwijld in kennis van het voorleggen van een
      geschil als bedoeld in de vorige volzin. Indien alle personeelsvertegenwoordigers tijdens het overleg, bedoeld in
      [artikel 258][ref5], hebben verklaard af te zien van hernieuwd overleg als aangegeven in [artikel 259][ref6], kan
      de in de eerste volzin aangegeven bevoegdheid door elk der personeelsvertegenwoordigers worden uitgeoefend binnen
      vijf dagen nadat in het in [artikel 258][ref7] bedoelde overleg is geconstateerd dat een overeenstemming kan worden
      bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel259
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel258
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0015136#Artikel258
      [ref6]: https://wetten.overheid.nl/BWBR0015136#Artikel259
      [ref7]: https://wetten.overheid.nl/BWBR0015136#Artikel258
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '259'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '258'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '38'
      - id: ref5
        bwb_id: BWBR0015136
        artikel: '258'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0015136
        artikel: '259'
        hoofdstuk: '4'
      - id: ref7
        bwb_id: BWBR0015136
        artikel: '258'
        hoofdstuk: '4'
  - number: '260.2'
    text: De commissie doet uitspraak binnen 30 dagen nadat het geschil aan haar is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel260
  - number: '261.1'
    text: |-
      Op gronden die verband houden met de godsdienstige of levensbeschouwelijke overtuiging, die aan de bijzondere
      instelling ten grondslag ligt, kan Onze Minister op verzoek van het bevoegd gezag toestaan dat een overlegorgaan
      bestaat uit vertegenwoordigers van het bevoegd gezag of de bevoegde gezagsorganen en de vertegenwoordigers van
      de naar het oordeel van het bevoegd gezag in aanmerking komende personeelsorganisaties. Onze Minister kan bij het
      verlenen van toestemming nadere voorzieningen treffen voor de toepassing van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel261
  - number: '261.2'
    text: |-
      Het bevoegd gezag toont bij zijn verzoek aan dat dit wordt ondersteund door een meerderheid van twee derden van het
      personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel261
  - number: '261.3'
    text: |-
      Onze Minister trekt de toestemming in indien het verzoek niet langer wordt ondersteund door twee derden van het
      personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel261
  - number: '262.1'
    text: |-
      De betrokkene voor wie op grond van het [Besluit overgangsmaatregelen b.o. 1985][ref1] dan wel het
      [Besluit overgangsmaatregelen s.o. 1985][ref2], een uitzicht is vastgesteld op een salaris dat hoger is dan het
      maximumsalaris behorende bij de functie waarin hij is benoemd, heeft tot ten hoogste het voor hem vastgestelde
      uitzicht aanspraak op bezoldiging volgens een hogere schaal dan de maximumschaal die behoort bij de functie waarin
      hij is benoemd, voor zover deze titel en de [ titels 2][ref3] en [3 van dit hoofdstuk][ref4] zulks bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0003807
      [ref2]: https://wetten.overheid.nl/BWBR0003808
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel262
    references:
      - id: ref1
        bwb_id: BWBR0003807
      - id: ref2
        bwb_id: BWBR0003808
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0015136
        hoofdstuk: '5'
  - number: '262.2'
    text: |-
      Zolang het salaris van de in het eerste lid bedoelde betrokkene nog niet wordt vastgesteld op het hoogste bedrag
      in de bij zijn functie behorende maximumschaal, wordt hem jaarlijks met toepassing van [ artikel 95][ref1] een
      periodieke verhoging toegekend indien en voor zover het bij zijn functie behorende carrièrepatroon dat mogelijk
      maakt. Hem wordt vervolgens jaarlijks op de voet van [artikel 95][ref2] een periodieke verhoging toegekend,
      voor het eerst op 1 augustus van het schooljaar volgende op het schooljaar waarin hij, behoudens het vijfde lid,
      volgens het maximumsalaris dat bij zijn functie behoort, wordt bezoldigd. Deze jaarlijkse periodieke verhoging
      wordt toegekend volgens de reeks bedragen, genoemd in [ bijlage 1C, onder A, kolom 2][ref3], tot het voor hem
      vastgestelde uitzicht genoemd in kolom 1 is bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel262
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '95'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '95'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015136
  - number: '262.3'
    text: 'Bij de toepassing van het eerste en tweede lid wordt voor de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel262
  - number: 262.3.a
    text: |-
      voor wie een uitzicht is vastgesteld dat hoger is dan het bedrag dat in [bijlage 1C, onder B ][ref1], bij de voor
      hem geldende maximumschaal is vermeld en


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel262
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: 262.3.b
    text: |-
      wiens salaris op 31 juli van enig schooljaar werd vastgesteld op het een na hoogste bedrag van zijn maximumschaal
      indien dat schaal 12 of schaal 13 is, bij de toekenning van een periodieke verhoging het salaris vastgesteld op het
      naasthogere bedrag dat is vermeld in [bijlage 1C, onder A, kolom 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel262
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: 262a
    text: |-
      Voor de betrokkene die op of na 1 augustus 2000 wordt benoemd en voor wie vóór die datum een salaris is vastgesteld
      op grond van [artikel 100](onbekend), zoals dat luidde op 31 juli 2000, wordt laatstbedoeld salaris voor de
      toepassing van de [ artikelen 89 tot en met 93][ref1] buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel89
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel262a
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '89'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '263.1'
    text: |-
      Voor de toepassing van [artikel 90][ref1] wordt ten aanzien van de betrokkene:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel90
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel263
    references:
      - id: ref1
