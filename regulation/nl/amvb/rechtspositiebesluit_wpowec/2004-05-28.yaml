  - number: '269.3'
    text: |-
      De adjunct-directeur voor wie een uitzicht is vastgesteld als bedoeld in
      [artikel C1, vijfde lid, van het in het eerste lid genoemde besluit][ref1] en die op grond van het
      tweede lid zijn aanspraak op vaststelling van zijn salaris overeenkomstig dit uitzicht verliest,
      verkrijgt daarna slechts aanspraak op vaststelling van zijn salaris overeenkomstig het uitzicht,
      bedoeld in [artikel C1, vijfde lid, van het in het eerste lid genoemde besluit][ref2] indien hij vóór
      1 augustus 2000 een functie als adjunct-directeur aanvaardt aan een school voor voortgezet speciaal
      onderwijs of een school of instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      de [Wet op de expertisecentra][ref3], een afdeling voor voortgezet speciaal onderwijs van een speciale
      school voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref4] of een school voor
      praktijkonderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref5], met een maximumschaal die ten
      minste gelijk is aan die welke voor hem geldt in de functie waarin hij op 1 augustus 1985 is benoemd mits
      hij vanaf 1 augustus 1985 zonder wezenlijke onderbreking werkzaam is geweest in een functie als adjunct-
      directeur of directeur in het speciaal onderwijs of het voortgezet speciaal onderwijs als bedoeld in de
      [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref6], onderscheidenlijk het onderwijs
      als bedoeld in de eerste volzin van het eerste lid, dan wel werkzaam is geweest in een functie in het voortgezet
      onderwijs, bedoeld in de [Wet op het voortgezet onderwijs][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0003420
      [ref5]: https://wetten.overheid.nl/BWBR0002399
      [ref6]: https://wetten.overheid.nl/BWBR0003549
      [ref7]: https://wetten.overheid.nl/BWBR0002399
