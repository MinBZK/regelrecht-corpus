    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel112
  - number: 112.1a
    text: |-
      Voor de functie van leraar in opleiding, bedoeld in [titel 15 van dit hoofdstuk][ref1], die voor
      rijksbekostiging in aanmerking wordt gebracht, worden bij een normbetrekking aan een instelling als bedoeld in
      [artikel 1, onderdeel d, onder 1°][ref2], voor zover het betreft een basisschool 76 rekeneenheden verbruikt
      en voor zover het een speciale school voor basisonderwijs betreft 81 eenheden verbruikt, en worden bij een
      normbetrekking aan een instelling als bedoeld in [artikel 1, onderdeel d, onder 2°][ref3], 81 rekeneenheden
      verbruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
