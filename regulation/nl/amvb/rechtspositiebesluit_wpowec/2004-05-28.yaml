  - number: '264.3'
    text: Voor de toepassing van het eerste lid wordt uitgegaan van het salaris behorende bij een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel264
  - number: '264.4'
    text: |-
      Dit artikel is niet van toepassing op de salarisvaststelling in het schooljaar 1997–1998 van een betrokkene die in
      het schooljaar 1996–1997 als leraar gedurende alle schoolweken benoemd dan wel gedurende ten minste 60 werkdagen
      werkzaam en bezoldigd is geweest in het primair onderwijs.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel264
  - number: '265.1'
    text: |-
      De betrokkene aan wie op grond van [ artikel B3 van het Besluit overgangsmaatregelen b.o. 1985][ref1] of in
      [artikel B4 van het Besluit overgangsmaatregelen s.o. 1985][ref2] extra taakomvang is toegekend, behoudt aanspraak
      op toekenning daarvan zolang hij in dezelfde functie bij dezelfde instelling verbonden blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003807
      [ref2]: https://wetten.overheid.nl/BWBR0003808
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel265
    references:
      - id: ref1
        bwb_id: BWBR0003807
      - id: ref2
        bwb_id: BWBR0003808
  - number: '265.2'
    text: |-
      Indien de betrekkingsomvang van een betrokkene bij het bevoegd gezag waar hem extra taakomvang is toegekend,
      toeneemt dan wel indien de totale betrekkingsomvang in al zijn betrekkingen tezamen toeneemt, wordt de hem
      ingevolge het eerste lid toegekende extra taakomvang verminderd met eenzelfde hoeveelheid als waarmee zijn
      betrekkingsomvang is toegenomen, echter tot ten hoogste de omvang van die extra taakomvang. De eerste volzin geldt
      niet ten aanzien van een toename in verband met vervangingswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel265
  - number: '265.3'
    text: |-
      Indien formatieruimte in de functie adjunct-directeur ontstaat, wordt die ruimte toegedeeld aan de adjunct-
      directeur aan wie extra taakomvang is toegekend in deze functie voor de omvang van die taakomvang, met dien
      verstande dat de totale omvang van de betrekking niet mag uitgaan boven de omvang van een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel265
  - number: '265.4'
    text: |-
      De bezoldiging voor de extra taakomvang, bedoeld in het eerste lid, van de betrokkene wiens betrekkingsomvang
      wegens vervangingswerkzaamheden is toegenomen, wordt verminderd met de bezoldiging die voortvloeit uit
      de vervangingswerkzaamheden voor zolang hij die bezoldiging geniet en voor zover die werkzaamheden de
      betrekkingsomvang zoals daags voor de aanvang van de vervangingswerkzaamheden vermeld in zijn akte van benoeming –
      indien hij aan instellingen van verschillende bevoegde gezagsorganen is benoemd: akten van benoeming – bedoeld in
      [artikel 8][ref1], te boven gaan, onverminderd [artikel 119][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel119
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel265
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '8'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '119'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '265.5'
    text: |-
      De aan een betrokkene toegekende fictieve extra taakomvang blijft buiten beschouwing bij de toepassing van
      [artikel 112][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel112
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel265
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '112'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '266.1'
    text: |-
      De directeur voor wie met toepassing van [ artikel C1 van het Besluit overgangsmaatregelen b.o. 1985][ref1] een
      uitzicht is vastgesteld, behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht zolang hij
      in de desbetreffende directeursfunctie benoemd blijft dan wel zonder wezenlijke onderbreking in het basisonderwijs
      werkzaam blijft in een functie als directeur met een maximumschaal die ten minste gelijk is aan die welke voor hem
      geldt in de functie waarin hij op 1 augustus 1985 is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel266
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C1
  - number: '266.2'
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste lid, wordt een periode van langer dan twee
      maanden bedoeld. De tijd waarin een ontslaguitkering als bedoeld in [hoofdstuk I-H van het Rechtspositiebesluit
      onderwijspersoneel](onbekend) zoals [dat hoofdstuk](onbekend) op 28 februari 1994 luidde, dan wel een uitkering
      als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel266
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: '267.1'
    text: |-
      De adjunct-directeur voor wie met toepassing van [artikel C1 van het Besluit overgangsmaatregelen b.o. 1985][ref1]
      een uitzicht is vastgesteld, behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang
      hij in de desbetreffende adjunct-directeursfunctie benoemd blijft dan wel zonder wezenlijke onderbreking in het
      basisonderwijs werkzaam blijft in een functie als adjunct-directeur met een maximumschaal die ten minste gelijk is
      aan die welke voor hem geldt in de functie waarin hij op 1 augustus 1985 is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel267
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C1
  - number: '267.2'
    text: |-
      In afwijking van het eerste lid blijft de adjunct-directeur die op 31
      juli 1985 in dienst was als hoofd van een lagere school als bedoeld in
      [artikel A1, tweede lid, onder d, van het Besluit overgangsmaatregelen b.o. 1985][ref1], aanspraak behouden op
      vaststelling van zijn salaris overeenkomstig het uitzicht bedoeld in [artikel C1 van laatstgenoemd besluit][ref2],
      zolang hij zonder wezenlijke onderbreking werkzaam blijft bij het basisonderwijs in een functie met een
      maximumschaal die ten minste gelijk is aan die welke voor hem geldt in de functie waarin hij op 1 augustus 1985
      is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003807
      [ref2]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel267
    references:
      - id: ref1
        bwb_id: BWBR0003807
      - id: ref2
        bwb_id: BWBR0003807
        artikel: C1
  - number: '267.3'
    text: |-
      Het eerste en tweede lid laat onverlet de aanspraak op bezoldiging volgens het uitzicht dat voor de betrokkene kan
      zijn vastgesteld in zijn kwaliteit als onderwijzer op 31 juli 1985, als aangegeven in [artikel C1 ][ref1] dan wel
      als uitkeringsgenietende, bedoeld in [artikel C5 van het in het eerste lid genoemde besluit][ref2]. Ten aanzien van
      dit uitzicht is [artikel 275][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003807#ArtikelC5
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel275
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel267
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C1
      - id: ref2
        bwb_id: BWBR0003807
        artikel: C5
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '275'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '267.4'
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste en tweede lid, wordt een periode van langer dan twee
      maanden bedoeld. De tijd waarin een ontslaguitkering als bedoeld in [hoofdstuk I-H van het Rechtspositiebesluit
      onderwijspersoneel](onbekend) zoals [dat hoofdstuk](onbekend) op 28 februari 1994 luidde, dan wel een uitkering
      als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel267
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: '268.1'
    text: |-
      De directeur voor wie met toepassing van [artikel C1 van het Besluit overgangsmaatregelen s.o. 1985][ref1] een
      uitzicht is vastgesteld, behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang
      hij in de desbetreffende directeursfunctie benoemd blijft dan wel zonder wezenlijke onderbreking in het onderwijs,
      genoemd in de tweede volzin, werkzaam blijft in een functie als directeur met een maximumschaal die ten minste
      gelijk is aan die welke voor hem geldt in de functie waarin hij op 1 augustus 1985 is benoemd. Onder onderwijs
      als bedoeld in de eerste volzin wordt verstaan: het speciaal onderwijs of het voortgezet speciaal onderwijs als
      bedoeld in de [Wet op de expertisecentra][ref2], het onderwijs aan speciale scholen voor basisonderwijs, al dan
      niet met een afdeling, als bedoeld in de [Wet op het primair onderwijs][ref3] en het onderwijs aan scholen voor
      praktijkonderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref4]. Ten aanzien van de directeur van een
      speciale school voor basisonderwijs, al dan niet met een afdeling, wordt onder onderwijs als bedoeld in de eerste
      volzin mede verstaan het onderwijs aan basisscholen als bedoeld in de [Wet op het primair onderwijs][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420
      [ref4]: https://wetten.overheid.nl/BWBR0002399
      [ref5]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel268
    references:
      - id: ref1
