  - number: '278.1'
    text: |-
      De betrokkene die op 30 april 1987 en op 1 mei 1987 aan een instelling is verbonden en die op grond van
      overgangsrecht, zoals dat op grond van [hoofdstuk V-T van het Rechtspositiebesluit onderwijspersoneel](onbekend) op
      30 april 1987 luidde, uitzicht had op een salarisbedrag dat hoger is dan het hoogste bedrag in de bij zijn functie
      behorende maximumschaal, behoudt dat uitzicht zolang hij in dezelfde functie aan dezelfde instelling verbonden
      blijft.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel278
  - number: '278.2'
    text: |-
      Zolang het salaris van de betrokkene, bedoeld in het eerste lid, nog niet is vastgesteld op het hoogste bedrag
      in de bij zijn functie behorende maximumschaal wordt hem jaarlijks met toepassing van [artikel 95][ref1] een
      periodieke verhoging toegekend. Indien hij het bij zijn functie behorende maximumsalaris gedurende twaalf maanden
      heeft genoten, wordt hem vervolgens jaarlijks op de voet van [artikel 95][ref2] een periodieke verhoging toegekend.
      Deze jaarlijkse periodieke verhoging wordt hem toegekend in de laagste schaal waarin het naasthogere bedrag
      voorkomt, tot het moment waarop het salarisniveau is bereikt dat gelijk is aan het voor hem vastgestelde uitzicht,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel95
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel278
