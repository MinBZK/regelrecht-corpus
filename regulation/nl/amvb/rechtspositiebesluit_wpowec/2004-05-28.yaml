  - number: '279.1'
    text: |-
      De betrokkene die op 31 december 1999 was benoemd in een functie als bedoeld in [titel 14 van hoofdstuk 1][ref1]
      en die op 1 januari 2000 in diezelfde functie blijft benoemd, heeft met ingang van 1 januari 2000 aanspraak op een
      salaris bij het op hem van toepassing zijnde salarisnummer als bedoeld in [bijlage S13][ref2] zoals deze gold op
      die datum indien hij op 31 december 1999 voldeed aan een van de volgende voorwaarden:


