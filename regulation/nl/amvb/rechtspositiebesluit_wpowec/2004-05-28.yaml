  - number: '136'
    text: |-
      Indien ingevolge de door het bevoegd gezag vastgestelde formatie, bedoeld in
      [artikel 110, tweede lid, onder a][ref1], niet langer een adjunct-directeur als bedoeld in [artikel 135][ref2]
      kan zijn benoemd, blijft de betrokkene, bedoeld in [artikel 157][ref3], die als adjunct-directeur was benoemd,
      aanspraak houden op het carrièrepatroon dat voor hem op de laatste dag van het voorafgaande schooljaar gold,
      indien dit carrièrepatroon gedurende ten minste drie onmiddellijk voorafgaande schooljaren aan die instelling of,
      in voorkomende gevallen, instellingen voor hem als leraar tevens adjunct-directeur heeft gegolden. De betrokkene
      behoudt deze aanspraak zolang hij aan dezelfde instelling of instellingen verbonden blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel157
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '135'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '157'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '137.1'
    text: Zonder voorafgaand ontslag kan een benoeming als leraar tevens adjunct-directeur niet worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel137
  - number: '137.2'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van de leraar die als adjunct-directeur is benoemd en op wie
      [artikel 136][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '136'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '137.3'
    text: |-
      Zolang aan de instelling of, in voorkomende gevallen, instellingen een leraar is verbonden voor wie
      [artikel 136][ref1] geldt, kan geen andere leraar tevens tot adjunct-directeur worden benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '136'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '138.1'
    text: |-
      Indien de toepassing van [artikel 133, tweede lid, onder a][ref1], aan een basisschool met twee normfuncties
      directeur gedurende drie achtereenvolgende schooljaren tot een hoger maximumsalaris voor de directeursfunctie leidt
      als gevolg van het feit dat y groter dan of gelijk aan 200 wordt, geldt met ingang van het derde schooljaar het
      carrièrepatroon dat behoort bij de functie met dat hogere maximumsalaris voor de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel133
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '133'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '138.2'
    text: |-
      De directeur van een basisschool met twee normfuncties directeur die gedurende een periode van
      drie aaneengesloten schooljaren in de normfunctie van directeur benoemd is waarbij op grond van
      [artikel 133, tweede lid, onder a][ref1], hetzelfde maximumsalaris behoort, behoudt in geval y kleiner wordt dan
      200 aanspraak op bezoldiging volgens het carrièrepatroon dat behoort bij die functie met dat maximumsalaris zolang
      hij in de normfunctie van directeur aan dezelfde basisschool benoemd blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel133
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '133'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '138.3'
    text: |-
      Indien y kleiner wordt dan 200 blijft voor de directeur van een basisschool met twee normfuncties directeur wiens
      bezoldiging wordt vastgesteld volgens schaal 10, het maximumsalaris bepaald op het hoogste bedrag in die schaal
      zolang hij in de desbetreffende functie aan dezelfde basisschool verbonden blijft.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel138
  - number: '138.4'
    text: |-
      Indien op een andere grond dan een wijziging van y [artikel 133][ref1] tot een hogere dan wel een lagere
      maximumschaal voor de normfunctie van directeur van de basisschool leidt, is [artikel 127][ref2] niet van
      toepassing ten aanzien van deze wijzigingen van de maximumschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel127
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '133'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '127'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '139.1'
    text: |-
      Indien toepassing van [artikel 133, derde lid, onder b][ref1], aan een speciale school voor basisonderwijs
      met twee normfuncties directeur gedurende drie achtereenvolgende schooljaren tot een hoger maximumsalaris voor
      de directeursfunctie leidt als gevolg van het feit dat y groter dan of gelijk aan 100, onderscheidenlijk 200
      wordt, geldt met ingang van het derde schooljaar het carrièrepatroon dat behoort bij de functie met dat hogere
      maximumsalaris voor de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel133
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '133'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '139.2'
    text: |-
      De directeur van een speciale school voor basisonderwijs met twee normfuncties directeur die gedurende een
      periode van drie aaneengesloten schooljaren in de normfunctie van directeur benoemd is waarbij op grond van
      [artikel 133, derde lid, onder b][ref1], hetzelfde maximumsalaris behoort, behoudt in geval y kleiner wordt dan
      100, onderscheidenlijk 200, aanspraak op bezoldiging volgens het carrièrepatroon dat behoort bij die functie met
      dat maximumsalaris zolang hij in de normfunctie van directeur aan dezelfde school benoemd blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel133
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '133'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '139.3'
    text: |-
      Indien y kleiner wordt dan 100, onderscheidenlijk 200, blijft voor de directeur van een speciale
      school voor basisonderwijs met twee normfuncties directeur wiens bezoldiging wordt vastgesteld
      volgens schaal 11, onderscheidenlijk schaal 12, het maximumsalaris bepaald op het bedrag genoemd in
      [artikel 133, derde lid, onder b, sub 2°, onderscheidenlijk sub 3°][ref1] zolang hij in de desbetreffende functie
      aan dezelfde school verbonden blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel133
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '133'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '139.4'
    text: |-
      Indien op een andere grond dan een wijziging van y toepassing van [artikel 133][ref1] tot een hogere dan wel
      een lagere maximumschaal voor de normfunctie van directeur van de school leidt, is [artikel 127][ref2] niet van
      toepassing ten aanzien van deze wijziging van de maximumschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel127
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '133'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '127'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '140.1'
    text: |-
      Een betrokkene die is benoemd in de normfunctie van directeur of adjunct-directeur van een basisschool ontvangt een
      toelage als vermeld in [bijlage 2, onder 4][ref1], bij de voor die betrokkene geldende maximumschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '140.2'
    text: |-
      In afwijking van het eerste lid ontvangt een betrokkene met ingang van het derde schooljaar de toelage, vermeld in
      [bijlage 2, onder 5][ref1], indien deze is benoemd:


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: 140.2.a
    text: |-
      in een normfunctie directeur aan een basisschool waarvan de factor y gedurende drie achtereenvolgende schooljaren
      gelijk is aan of groter is dan 400 en het carrièrepatroon geldt dat behoort bij maximumschaal 11;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel140
  - number: 140.2.b
    text: |-
      in een normfunctie adjunct-directeur aan een basisschool waarvan de factor y gedurende drie achtereenvolgende
      schooljaren gelijk is aan of groter is dan 200 en het carrièrepatroon geldt dat behoort bij maximumschaal 9.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel140
  - number: '140.3'
    text: |-
      Indien de factor y kleiner is dan 900 en geen personeelslid is benoemd in de normfunctie directeur en maximaal één
      personeelslid in de normfunctie adjunct-directeur, geldt de toelage die in [bijlage 2, onder 5][ref1], is vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: 140.3.a
    text: |-
      voor het personeelslid dat is benoemd in een door het bevoegd gezag op grond van artikel 84, vierde lid,
      vastgestelde functie waarin hij onder leiding van een aan die school verbonden directeur is belast met
      directiewerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel140
  - number: 140.3.b
    text: |-
      voor het personeelslid dat is benoemd als directeur van die school indien geen personeelslid een toelage op grond
      van a, ontvangt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel140
  - number: '140.4'
    text: |-
      Een betrokkene die is benoemd in een normfunctie directeur van een basisschool voor wie het carrièrepatroon geldt
      dat behoort bij maximumschaal 11 en een betrokkene die is benoemd in een normfunctie adjunct-directeur van een
      basisschool voor wie het carrièrepatroon geldt dat behoort bij maximumschaal 9, voor wie de toelage, bedoeld in
      het tweede lid, geldt, behoudt aanspraak op die toelage zolang hij benoemd blijft in de desbetreffende functie aan
      dezelfde instelling of instellingen en voor hem dezelfde maximumschaal blijft gelden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel140
  - number: '140.5'
    text: |-
      De toelage, bedoeld in het eerste tot en met vierde lid, van de betrokkene die is benoemd in een betrekking met een
      omvang anders dan die van een normbetrekking wordt berekend naar evenredigheid van die betrekkingsomvang. De aldus
      berekende uitkomst wordt op rekenkundige wijze afgerond op centen. Een toelage die op grond van dit artikel wordt
      berekend, kan nooit hoger zijn dan de toelage die volgens [bijlage 2, onder 4 en 5][ref1], voor betrokkene zou
      gelden indien die betrokkene in een normbetrekking zou zijn benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '140.6'
    text: |-
      Een toelage als bedoeld in dit artikel, telt niet mee voor de toepassing of overeenkomstige toepassing van
      [artikel 90][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel90
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '90'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '141.1'
    text: |-
      Indien op grond van [artikel 29, eerste lid, derde volzin, van de Wet op primair onderwijs][ref1] een directeur
      van een basisschool tevens is belast met de leiding van een andere instelling waar de functie van directeur vacant
      is, kan het bevoegd gezag, zolang deze situatie zich voordoet en uitsluitend ten laste van eigen middelen aan die
      directeur boven zijn salaris een maandelijkse toelage toekennen ten bedrage van het verschil tussen het bedrag bij
      salarisnummer 12 in schaal 10 en het bedrag bij salarisnummer 11 in die schaal. Indien het een directeur van een
      speciale school voor basisonderwijs betreft, bedraagt de in de vorige volzin bedoelde toelage het verschil tussen
      het bedrag bij salarisnummer 9 in schaal 11 en het bedrag bij salarisnummer 8 in die schaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
  - number: '141.2'
    text: |-
      De in het eerste lid bedoelde toelage behoort niet tot het inkomen, bedoeld in het pensioenreglement, en telt
      niet mee voor de berekening en vaststelling van uitkeringen ingevolge het Besluit werkloosheid onderwijs- en
      onderzoekpersoneel, het Besluit ziekte en arbeidsongeschiktheid voor onderwijspersoneel primair en voortgezet
      onderwijs en educatie en beroepsonderwijs, alsmede de regeling voor vervroegde uittreding.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel141
  - number: '141.3'
    text: |-
      Indien de betrokkene niet in een normbetrekking is benoemd, wordt de toelage berekend naar evenredigheid van zijn
      betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel141
  - number: '142'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel142
  - number: 142.a
    text: |-
      directeur: de directeur van een instelling als bedoeld in [artikel 1, onderdeel d, onder 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 142.b
    text: |-
      adjunct-directeur: degene die is benoemd in een functie als bedoeld in
      [paragraaf 3 van titel 13 van dit hoofdstuk][ref1] die tevens is benoemd tot adjunct-directeur;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 142.c
    text: |-
      directie: de directeur of directeuren, de eventuele adjunct-directeuren en de eventuele andere betrokkenen die zijn
      benoemd in een functie die is ingedeeld in deze titel, gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel142
  - number: 142.d
    text: 'betrokkene: degene die deel uitmaakt van de directie;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel142
  - number: 142.e
    text: |-
      instelling: een instelling als bedoeld in [artikel 1, onderdeel d, onder 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 142.f
    text: |-
      Q: de totale normatieve formatie naar boven afgerond op hele formatieplaatsen, berekend volgens
      [artikel 16, vijfde lid, van het Formatiebesluit WEC][ref1], dan wel, indien het een instelling voor onderwijs aan
      visueel gehandicapte kinderen betreft, berekend volgens [artikel 26a van het Formatiebesluit WEC][ref2] vermeerderd
      met de formatie toegekend op grond van [artikel 117, vijfde lid, van de Wet op de expertisecentra][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005442#Artikel26a
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0005442
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0005442
        artikel: 26a
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '117'
  - number: '143'
    text: |-
      De normfuncties voor de directie die in de formatie van een instelling kunnen voorkomen zijn de normfunctie
      van directeur en van adjunct-directeur. In [bijlage 12-2 bij dit besluit][ref1] is voor deze functies een
      taakkarakteristiek gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '144.1'
    text: |-
      De betrokkene die is benoemd in een normbetrekking en die het verlof, bedoeld in [artikel 32][ref1], per jaar
      geniet, wordt gemiddeld voor ten hoogste 930 uren per jaar belast met het geven van onderwijs, bedoeld in
      de taakkarakteristiek van de normfunctie leraar als opgenomen in [bijlage 13-2 van dit besluit][ref2]. Voor
      de betrokkene die gebruik maakt van het verlof, bedoeld in [artikel 32, zevende lid][ref3], en voor wie een
      arbeidsduur op jaarbasis geldt van 1710 uren respectievelijk 1790 uren wordt in de eerste volzin voor «930 uren»
      gelezen «961 uren» respectievelijk «1010 uren».


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel32
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015136
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '144.2'
    text: |-
      Binnen een normbetrekking is 10% van de normbetrekking en, indien gebruik wordt gemaakt
      van [artikel 32, zevende lid][ref1], 10% van de arbeidsduur op jaarbasis, bedoeld in
      [artikel 85, tweede en derde lid][ref2], bestemd voor activiteiten in het kader van de deskundigheidsbevordering.
      De besteding van het in de eerste volzin bedoelde deel van de normbetrekking respectievelijk de arbeidsduur op
      jaarbasis wordt door betrokkene bepaald, met dien verstande dat het bevoegd gezag in individuele gevallen en
      schriftelijk gemotiveerd daarvan kan afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel85
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '85'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '144.3'
    text: |-
      Na verkregen instemming van het decentraal georganiseerd overleg kan aan instellingen waarvoor op jaarbasis een
      onderwijstijd geldt van meer dan 1010 doch ten hoogste 1040 uur, een betrokkene voor maximaal die aan de instelling
      geldende onderwijstijd worden belast met het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel144
  - number: '144.4'
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang van minder dan een normbetrekking wordt het
      maximum aantal uren, bedoeld in het eerste lid, en de deskundigheidsbevordering, bedoeld in het tweede lid, naar
      evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel144
  - number: '144.5'
    text: |-
      In individuele gevallen kunnen door het bevoegd gezag en betrokkene afspraken worden gemaakt die afwijken van het
      percentage, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel144
  - number: '145'
    text: |-
      De maximumschaal die voor de normfunctie van directeur geldt, wordt afhankelijk van Q vastgesteld volgens het
      onderstaande schema.






                  Q


                  maximumschaal






                  kleiner dan 24


                  11




                  gelijk aan of groter dan 24


                  12
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel145
  - number: '146'
    text: |-
      De maximumschaal die voor de normfunctie adjunct-directeur geldt, wordt afhankelijk van Q vastgesteld volgens het
      onderstaande schema.






                  Q


                  maximumschaal






                  kleiner dan 24


                  10




                  gelijk aan of groter dan 24


                  11
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel146
  - number: '147'
    text: |-
      Indien ingevolge de door het bevoegd gezag vastgestelde formatie, bedoeld in
      [artikel 110, tweede lid, onder a][ref1], niet langer een adjunct-directeur als bedoeld in [artikel 146][ref2]
      kan zijn benoemd, blijft de betrokkene, bedoeld in [artikel 164][ref3], die als adjunct-directeur was benoemd,
      aanspraak houden op het carrièrepatroon dat voor hem op de laatste dag van het voorafgaande schooljaar gold,
      indien dit carrièrepatroon gedurende ten minste drie onmiddellijk voorafgaande schooljaren aan die instelling of,
      in voorkomende gevallen, instellingen voor hem als leraar tevens adjunct-directeur heeft gegolden. De betrokkene
      behoudt deze aanspraak zolang hij aan dezelfde instelling of instellingen verbonden blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel146
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel164
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '146'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '164'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '148.1'
    text: Zonder voorafgaand ontslag kan een benoeming als leraar tevens adjunct-directeur niet worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel148
  - number: '148.2'
    text: |-
      Het eerste lid is niet van toepassing op de leraar die als adjunct-directeur is benoemd en op wie
      [artikel 170][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel170
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '170'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '148.3'
    text: |-
      Zolang aan de instelling of, in voorkomende gevallen, instellingen een leraar is verbonden voor wie
      [artikel 147][ref1] geldt, kan geen andere leraar tevens tot adjunct-directeur worden benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel147
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '147'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '149.1'
    text: |-
      Indien op grond van [artikel 29, eerste lid, derde volzin, van de Wet op de expertisecentra][ref1] een directeur
      van een instelling tevens is belast met de leiding van een andere instelling waar de functie van directeur vacant
      is, kan het bevoegd gezag, zolang deze situatie zich voordoet en uitsluitend ten laste van eigen middelen aan die
      directeur boven zijn salaris een maandelijkse toelage toekennen ten bedrage van het verschil tussen het bedrag bij
      salarisnummer 9 in schaal 11 en het bedrag bij salarisnummer 8 in die schaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel29
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '29'
  - number: '149.2'
    text: |-
      De in het eerste lid bedoelde toelage behoort niet tot het inkomen, bedoeld in het
      pensioenreglement, en telt niet mee voor de berekening en vaststelling van uitkeringen
      ingevolge het [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref1], het
      __REF001___________________________________________________________________________________________________________
      ____________________, alsmede de regeling voor vervroegde uittreding.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
      [ref2]: https://wetten.overheid.nl/BWBR0007800
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0006445
      - id: ref2
        bwb_id: BWBR0007800
  - number: '149.3'
    text: |-
      Indien de betrokkene niet in een normbetrekking is benoemd, wordt de toelage berekend naar evenredigheid van zijn
      betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel149
  - number: '150.1'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel150
  - number: 150.1.a
    text: |-
      instelling: elke instelling voor zover deze over formatierekeneenheden beschikt als bedoeld in
      [artikel 68, eerste lid, onder d, van de Wet op het primair onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '68'
  - number: 150.1.b
    text: 'betrokkene: de betrokkene voor zover het betreft een lid van het onderwijsgevend personeel;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel150
  - number: 150.1.c
    text: |-
      Formatiebesluit: het [Formatiebesluit WPO][ref1], het [Formatiebesluit WEC][ref2] en het
      [Besluit trekkende bevolking WPO][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005441
      [ref2]: https://wetten.overheid.nl/BWBR0005442
      [ref3]: https://wetten.overheid.nl/BWBR0003833
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0005441
      - id: ref2
        bwb_id: BWBR0005442
      - id: ref3
        bwb_id: BWBR0003833
  - number: '150.2'
    text: |-
      Voor zover uit het eerste lid niet anders blijkt, zijn in deze titel de begripsbepalingen van de
      [artikelen 83][ref1] en [109][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel109
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '83'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '109'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '151.1'
    text: |-
      Aan iedere instelling kan onderwijsgevend personeel verbonden zijn voor zover dit binnen de door het bevoegd
      gezag vastgestelde formatie mogelijk is. Deze functies worden onderscheiden in onderwijsgevende functies voor het
      basisonderwijs en centrale diensten (paragraaf 2) en voor het speciaal onderwijs (paragraaf 3).
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel151
  - number: '151.2'
    text: |-
      De werkzaamheden die aan de instelling moeten worden verricht, worden in onderling overleg verdeeld tussen de
      directie en de betrokkenen zodanig dat een zoveel mogelijk evenwichtige taakbelasting plaatsvindt in verhouding tot
      de aard en de omvang van de functies. Indien dit overleg niet tot overeenstemming leidt, beslist het bevoegd gezag,
      de betrokkenen gehoord.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel151
  - number: '152.1'
    text: |-
      Indien een betrokkene met inachtneming van het voor hem geldende carrièrepatroon, het begintraject en de
      aanloopschaal of aanloopschalen behorend bij de functie waarin hij is benoemd, heeft doorlopen en hij heeft voldaan
      aan de in voorkomend geval door Onze Minister dan wel het bevoegd gezag vastgestelde promotiecriteria wordt hij
      met inachtneming van [artikel 155][ref1] en de [paragrafen 2][ref2] en [3 van deze titel][ref3] bezoldigd volgens
      de bij zijn functie behorende maximumschaal. Het bevoegd gezag kan promotiecriteria vaststellen uitsluitend indien
      over die criteria overeenstemming is bereikt in het overleg, bedoeld in titel 2 van hoofdstuk 4.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '155'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '152.2'
    text: |-
      Het bevoegd gezag is onverminderd [artikel 155, vierde lid][ref1], gehouden de betrokkene in staat te stellen aan
      de voor hem geldende promotiecriteria te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel155
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '155'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '153.1'
    text: |-
      Voor elke functie met maximumschaal 9 of 11 geldt dat bij elke maximumschaal een aanloopschaal behoort die één
      nummer lager is dan de maximumschaal. Voor elke functie met maximumschaal 10 geldt aanloopschaal 8. Bij de functies
      met maximumschaal 9, 10 of 11 behoort een begintraject dat voorafgaat aan de aanloopschaal. Voor elke functie met
      maximumschaal 12 of hoger geldt dat bij elke maximumschaal twee aanloopschalen behoren die één respectievelijk twee
      nummers lager zijn dan de maximumschaal.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel153
  - number: '153.2'
    text: |-
      De betrokkene doorloopt het begintraject en de aanloopschalen bij zijn functie volgens het voor hem geldende
      carrièrepatroon.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel153
  - number: '154'
    text: |-
      De bezoldiging van de betrokkene die op 31 juli van enig schooljaar werd bezoldigd volgens het hoogste bedrag van
      het voor hem op die datum van toepassing zijnde begintraject, wordt per 1 augustus vastgesteld volgens het laagste
      bedrag dat hoger is in de bij zijn functie behorende aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel154
  - number: '155.1'
    text: |-
      Behoudens het vierde lid heeft de betrokkene die is benoemd in een functie met maximumschaal 11 of lager en wiens
      salaris op 31 juli van enig schooljaar is vastgesteld op het hoogste bedrag in de bij zijn functie behorende
      aanloopschaal met ingang van 1 augustus van het daarop volgende schooljaar recht op vaststelling van zijn salaris
      volgens de bij zijn functie behorende maximumschaal op het bedrag dat is gelegen onmiddellijk boven het salaris dat
      op 31 juli daaraan voorafgaand voor hem gold. De eerste volzin is van overeenkomstige toepassing op de betrokkene
      die is benoemd in een functie met maximumschaal 12 en wiens salaris op 31 juli van enig schooljaar is vastgesteld
      op het hoogste bedrag in de hoogste bij zijn functie behorende aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel155
  - number: '155.2'
    text: |-
      In afwijking van het eerste lid en behoudens het vierde lid wordt het salaris van de betrokkene zoveel eerder
      vastgesteld volgens de bij zijn functie behorende maximumschaal als zijn salaris in een vorige functie reeds langer
      dan één schooljaar is vastgesteld geweest volgens het maximum van de bij die vorige functie behorende hoogste
      aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel155
  - number: '155.3'
    text: |-
      Voor de toepassing van tweede lid wordt mede in aanmerking genomen het schooljaar waarin de betrokkene gedurende
      ten minste 60 werkdagen in een vorige functie werkzaam is geweest en is bezoldigd volgens het hoogste bedrag in de
      hoogste bij die functie behorende aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel155
  - number: '155.4'
    text: |-
      De betrokkene, bedoeld in het eerste en tweede lid, heeft geen recht op vaststelling van zijn salaris volgens
      de bij zijn functie behorende maximumschaal indien de betrokkene niet aan de in [artikel 152, eerste lid,][ref1]
      bedoelde promotiecriteria heeft voldaan als gevolg van feitelijkheden die voor zijn rekening komen. In dat geval
      rust op het bevoegd gezag niet de verplichting bedoeld in [artikel 152, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel152
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '152'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '152'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '156.1'
    text: |-
      De benoeming van een lid van het onderwijsgevend personeel in een functie die vanaf de aanvang van het schooljaar
      beschikbaar is, gaat in op de eerste dag na de zomervakantie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel156
  - number: '156.2'
    text: |-
      Indien het lid van het onderwijsgevend personeel in het voorafgaande schooljaar als lid van het onderwijzend
      personeel bij een instelling in de zin van dit besluit dan wel bij een andere door Onze Minister bekostigde
      onderwijsinstelling benoemd en bezoldigd is geweest gedurende een aaneengesloten periode van langer dan 2 maanden,
      welke periode is geëindigd op of na 1 juni van het voorafgaande schooljaar, gaat de benoeming in op 1 augustus mits
      het lid van het onderwijsgevend personeel voor langer dan 2 maanden wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel156
  - number: '156.3'
    text: |-
      Het lid van het onderwijsgevend personeel dat in tijdelijke dienst is benoemd, heeft aanspraak op bezoldiging tot
      en met de dag waarop zijn benoeming in tijdelijke dienst afloopt, met dien verstande dat hij, in geval de benoeming
      is ingegaan op of na 1 maart van een schooljaar, in elk geval geen aanspraak op bezoldiging heeft over de dagen
      na de laatste dag voor de zomervakantie, ook al strekt de duur van zijn dienstverband zich wel over die dagen uit.
      Indien de duur van zijn dienstverband zich tot in het volgende schooljaar uitstrekt, ontstaat weer aanspraak op
      bezoldiging met ingang van de eerste dag na de zomervakantie, behoudens indien zich de in het tweede lid bedoelde
      omstandigheid voordoet, in welk geval weer aanspraak op bezoldiging ontstaat met ingang van 1 augustus van het
      nieuwe schooljaar. Voor de toepassing van dit lid worden aansluitende benoemingen binnen hetzelfde schooljaar als
      één benoeming beschouwd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel156
  - number: '156.4'
    text: |-
      De duur van het dienstverband van het in het eerste lid bedoelde lid van het onderwijsgevend personeel dat in vaste
      dienst is benoemd en dat in verband met ontslag zijn werkzaamheden na de zomervakantie niet voortzet, kan zich
      uitstrekken uiterlijk tot en met de laatste dag van het schooljaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel156
  - number: '156.5'
    text: |-
      Het lid van het onderwijsgevend personeel aan wie ontslag is verleend en die in een nieuwe betrekking is benoemd
      met ingang van een dag waarop het ontslag uit de oude betrekking nog niet is ingegaan, heeft in de oude betrekking
      aanspraak op bezoldiging tot de dag waarop de nieuwe betrekking aanvangt indien de nieuwe betrekking een
      voortzetting van de oude betrekking geacht kan worden te zijn. Indien de nieuwe betrekking niet bij het onderwijs
      wordt bekleed, behoudt hij, voor zover hem nog vakantieverlof toekomt, aanspraak op bezoldiging tot en met de dag
      waarop dat vakantieverlof afloopt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel156
  - number: '156.6'
    text: |-
      Indien het lid van het onderwijsgevend personeel als gevolg van toepassing van het derde lid of van
      [artikel 104, tweede lid][ref1], gedurende een gedeelte van de zomervakantie benoemd is geweest en aanspraak had
      op bezoldiging heeft hij niettemin aanspraak op bezoldiging gedurende de zomervakantie, indien hij een periode
      van 12 achtereenvolgende maanden gedurende alle schoolweken aan een of meer scholen was verbonden en indien de
      zomervakantie in die periode valt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel104
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '104'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '157'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel157
  - number: 157.a
    text: |-
      instelling: een instelling als bedoeld in [artikel 1, onderdeel d, onder 1° en 3°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 157.b
    text: |-
      betrokkene: de betrokkene bedoeld in [artikel 1, onderdeel e, onder 1° en 3°][ref1], voor zover het betreft een
      lid van het onderwijsgevend personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '158'
    text: 'De normfuncties voor het onderwijsgevend personeel die in de formatie van een instelling kunnen voorkomen zijn:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel158
  - number: 158.a
    text: 'voor wat betreft basisscholen: de functie van leraar waarvoor als maximumschaal geldt schaal 9;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel158
  - number: 158.b
    text: |-
      voor wat betreft speciale scholen voor basisonderwijs: de functie van leraar waarvoor als maximumschaal geldt
      schaal 10;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel158
  - number: 158.c
    text: |-
      voor wat betreft centrale diensten: de functie van leraar waarvoor als maximumschaal geldt schaal 9,
      onderscheidenlijk de functie van leraar waarvoor als maximumschaal geldt schaal 10.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel158
  - number: '159.1'
    text: |-
      De betrokkene die is benoemd in een normbetrekking en die het verlof, bedoeld in [artikel 32][ref1],
      per jaar geniet, wordt gemiddeld voor ten hoogste 930 uren per jaar belast met het geven van onderwijs,
      bedoeld in de taakkarakteristiek. Voor de betrokkene, die gebruik maakt van het verlof, bedoeld in
      [artikel 32, zevende lid][ref2], en voor wie een arbeidsduur op jaarbasis geldt van 1710 uren respectievelijk 1790
      uren wordt in de eerste volzin voor «930 uren» gelezen «961 uren» respectievelijk «1010 uren».


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel32
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '159.2'
    text: |-
      Van het eerste lid kan met het oog op de invulling van de algemene arbeidsduur per jaar, bedoeld in
      [artikel 85, tweede en derde lid][ref1], in het bijzonder onderwijs worden afgeweken op grond van een overeenkomst
      als bedoeld in de [Wet op de collectieve arbeidsovereenkomst][ref2] en in het openbaar onderwijs op grond van een
      overeenkomst die voldoet aan de voorwaarden zoals die zijn gesteld in genoemde [wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0001937
      [ref3]: https://wetten.overheid.nl/BWBR0001937
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '85'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001937
      - id: ref3
        bwb_id: BWBR0001937
  - number: '159.3'
    text: |-
      Binnen een normbetrekking is 10% van de normbetrekking en indien gebruik wordt gemaakt
      van [artikel 32, zevende lid][ref1], 10% van de arbeidsduur op jaarbasis, bedoeld in
      [artikel 85, tweede en derde lid][ref2], bestemd voor activiteiten in het kader van de deskundigheidsbevordering.
      De besteding van het in de eerste volzin bedoelde deel van de normbetrekking respectievelijk de arbeidsduur op
      jaarbasis wordt door betrokkene bepaald, met dien verstande dat het bevoegd gezag in individuele gevallen en
      schriftelijk gemotiveerd daarvan kan afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel85
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '85'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '159.4'
    text: |-
      Na verkregen instemming van het decentraal georganiseerd overleg kan aan instellingen waarvoor op jaarbasis een
      onderwijstijd geldt van meer dan 1010 doch ten hoogste 1040 uur een betrokkene voor maximaal die aan de instelling
      geldende onderwijstijd worden belast met het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel159
  - number: '159.5'
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang van minder dan een normbetrekking wordt het
      maximum aantal uren, bedoeld in het eerste lid, en de deskundigheidsbevordering, bedoeld in het tweede lid, naar
      evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel159
  - number: '159.6'
    text: |-
      In individuele gevallen kunnen door het bevoegd gezag en betrokkene van het percentage genoemd in het derde lid
      afwijkende afspraken worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel159
  - number: '160.1'
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan
      hij uit hoofde van zijn benoeming verbonden kan worden, dan wel die daarnaast werkzaamheden verricht dan
      wel gaat verrichten waarvoor hem een gedeelte van een normbetrekking is of wordt toebedeeld die op grond van
      [artikel 113][ref1] van rechtswege vervalt, wordt voor de duur en de omvang van die werkzaamheden tijdelijk
      uitgebreid met overeenkomstige toepassing van de [artikelen 104][ref2] en [156][ref3], waarbij voor benoeming wordt
      gelezen tijdelijke uitbreiding van de betrekkingsomvang en voor benoemd wordt gelezen een tijdelijke uitbreiding
      van de betrekkingsomvang had.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel104
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel156
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '113'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '104'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '156'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '160.2'
    text: |-
      De omvang van de tijdelijke uitbreiding van de betrekking, bedoeld in het eerste lid, wordt voor de duur waarvoor
      dit geschiedt afzonderlijk in de akte van benoeming vermeld.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel160
  - number: '160.3'
    text: |-
      Indien de betrekkingsomvang van een betrokkene die uitsluitend is benoemd voor het verrichten van
      vervangingswerkzaamheden, tijdelijk is uitgebreid op grond van het eerste lid, wordt die tijdelijke uitbreiding bij
      beëindiging van eerstbedoelde vervangingswerkzaamheden omgezet in een benoeming.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel160
  - number: '161.1'
    text: |-
      Voor de betrokkene die is benoemd in verband met de vervanging van een leraar wordt voor de vaststelling van
      de factor r in [artikel 97, tweede lid][ref1], de werktijdfactor per dag gelijkgesteld met 0,2306, per ochtend
      met 0,1356 en per middag met 0,095. De werktijdfactor voor een dag waarop aan de school structureel uitsluitend
      gedurende de ochtend onderwijs wordt gegeven, is bepaald op 0,1628.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel97
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '97'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '161.2'
    text: |-
      Indien de in het eerste lid bedoelde vervanging geschiedt voor korter dan een ochtend dan wel een middag, wordt
      voor de vaststelling van de factor r in [artikel 97, tweede lid][ref1], het feitelijk aantal uren bepaald op de
      uitkomst van de formule I x 1,5385, waarbij I gelijk is aan het aantal uren waarop de betrokkene op die dag wordt
      belast met het geven van onderwijs, bedoeld in de taakkarakteristiek.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel97
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '97'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '162.1'
    text: |-
      Voor de betrokkene, bedoeld in [artikel 130, onder a][ref1], wiens benoeming als directeur anders dan wegens ziekte
      en arbeidsongeschiktheid wordt beëindigd en die werd bezoldigd volgens de bij deze functie behorende maximumschaal
      op een bedrag dat hoger is dan het hoogste bedrag in de aanloopschaal van een leraar wordt, in afwijking van
      [artikel 112, eerste lid][ref2], voor zijn functie waarop deze titel van toepassing is, bij hetzelfde bevoegd
      gezag aan dezelfde instelling of instellingen een aantal rekeneenheden verbruikt dat overeenkomt met het aantal
      rekeneenheden dat behoorde bij zijn functie als directeur. De eerste volzin is niet van toepassing indien op grond
      van [artikel 155, eerste lid][ref3], het salaris van de betrokkene reeds kon worden vastgesteld volgens de bij zijn
      functie behorende maximumschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel112
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel155
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '130'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '112'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '155'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '162.2'
    text: |-
      Het eerste lid is niet van toepassing op een directeur van wie de betrekking is opgeheven wegens samenvoeging
      van de desbetreffende instelling of instellingen waaraan de directeur is verbonden, met een of meer andere
      instellingen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel162
  - number: '162.3'
    text: |-
      Het verbruik van rekeneenheden wordt in gevallen, bedoeld in het tweede lid, berekend met inachtneming van de in
      [artikel 7, tweede lid][ref1], bedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel7
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '7'
        hoofdstuk: '1'
  - number: '163.1'
    text: |-
      Voor de betrokkene, bedoeld in [artikel 130, onder b][ref1], wiens benoeming als leraar tevens adjunct-
      directeur anders dan wegens ziekte en arbeidsongeschiktheid wordt beëindigd, wordt in afwijking van
      [artikel 112, eerste lid][ref2], voor zijn functie als leraar bij hetzelfde bevoegd gezag aan dezelfde instelling
      of instellingen een aantal rekeneenheden verbruikt dat overeenkomt met het aantal rekeneenheden dat behoorde bij
      zijn functie als leraar tevens adjunct-directeur, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel112
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '130'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '112'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 163.1.a
    text: |-
      de betrokkene als leraar tevens adjunct-directeur werd bezoldigd volgens de bij die functie behorende maximumschaal
      op een bedrag dat hoger is dan het hoogste bedrag in de aanloopschaal behorende bij de functie van leraar; of
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel163
  - number: 163.1.b
    text: |-
      op de betrokkene [artikel 136][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel163
    references:
      - id: ref1
