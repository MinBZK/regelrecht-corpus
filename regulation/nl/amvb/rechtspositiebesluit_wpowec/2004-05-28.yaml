        artikel: '273'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '274.4'
    text: |-
      Op de betrokkene die op 1 januari 2000 wordt benoemd in een functie als bedoeld in [titel 13 van hoofdstuk 1][ref1]
      met dezelfde maximumschaal als welke direct voorafgaand aan die benoeming voor hem gold, en wiens salaris niet
      hoger werd vastgesteld op grond van het eerste lid, uitsluitend om de reden dat hij op 1 januari 2000 niet voldeed
      aan de promotiecriteria, bedoeld in [artikel 152, eerste lid][ref2], en die voorts in diezelfde functie benoemd
      blijft, is [artikel 273, vierde lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel152
