    text: |-
      hij werd voor het tweede, derde of vierde achtereenvolgende jaar bezoldigd naar het bij zijn functie behorende
      maximumsalaris in schaal 1, 2, 3, 4 of 5, of
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel279
  - number: 279.1.b
    text: hij werd bezoldigd naar een bedrag vermeld achter een salarisnummer beginnend met de letter U.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel279
  - number: '279.2'
    text: |-
      Van de betrokkene die op 31 december 1999 was benoemd in een functie als bedoeld in
      [titel 14 van hoofdstuk 1][ref1] en die op 1 januari 2000 wordt benoemd in een functie als bedoeld in hoofdstuk 14
      van titel 1 of in een functie als bedoeld in [titel 12][ref2] of [13 van hoofdstuk 1][ref3], wordt ten behoeve van
      de vaststelling van het salaris in de nieuwe functie het in die vorige onderwijsfunctie genoten salaris vastgesteld
      zoals het zou zijn vastgesteld op grond van het eerste lid, indien op 31 december 1999 is voldaan aan een van de
      voorwaarden, bedoeld in het eerste lid, onder a en b. De eerste volzin is niet van toepassing op de betrokkene die
      wordt benoemd in een functie als bedoeld in [artikel 91, tweede lid][ref4].


