        artikel: '136'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '163.2'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel163
  - number: 163.2.a
    text: |-
      voor de betrokkene, bedoeld in [artikel 157, onder b][ref1], de beëindiging van de benoeming als leraar tevens
      adjunct-directeur het gevolg is van een gelijktijdige daling van:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel157
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '157'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 163.2.a.1°
    text: |-
      voor wat betreft een leraar tevens adjunct-directeur aan een basisschool: het aantal formatierekeneenheden, bedoeld
      in [artikel 13a, derde lid, van het Formatiebesluit WPO][ref1] tot 54 formatierekeneenheden,


      [ref1]: https://wetten.overheid.nl/BWBR0005441#Artikel13a
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0005441
        artikel: 13a
  - number: 163.2.a.2°
    text: |-
      voor wat betreft een leraar tevens adjunct-directeur aan een speciale school voor basisonderwijs: het
      aantal formatierekeneenheden, bedoeld in [artikel 16b, vierde lid, van het Formatiebesluit WPO][ref1] tot 65
      formatierekeneenheden, en


      [ref1]: https://wetten.overheid.nl/BWBR0005441#Artikel16b
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0005441
        artikel: 16b
  - number: 163.2.b
    text: |-
      in redelijkheid niet van het bevoegd gezag kon worden gevergd dat deze functie van leraar tevens adjunct-directeur
      in de formatie zou worden gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel163
  - number: '164'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel164
  - number: 164.a
    text: |-
      instelling: een instelling als bedoeld in [artikel 1, onderdeel d, onder 2°][ref1];


