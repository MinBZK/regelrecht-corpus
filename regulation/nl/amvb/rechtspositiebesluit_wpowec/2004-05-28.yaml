    text: |-
      die op of na 1 augustus 1997 wordt benoemd aan een instelling als bedoeld in
      [artikel 1 onderdeel d, onder 1° of 2°][ref1], in een functie als bedoeld in [titel 12][ref2]
      of [13 van hoofdstuk 1][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel263
    references:
