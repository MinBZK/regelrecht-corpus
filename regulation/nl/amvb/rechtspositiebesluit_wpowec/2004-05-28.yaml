  - number: '269.2'
    text: |-
      In afwijking van het eerste lid vervalt voor de adjunct-directeur de aanspraak op vaststelling van zijn salaris
      overeenkomstig het uitzicht, bedoeld in [artikel C1, vijfde lid, van het in het eerste lid genoemde besluit][ref1],
      met ingang van de datum waarop de adjunct-directeur niet langer werkzaam is aan een school voor voortgezet
      speciaal onderwijs of een school of instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      de [Wet op de expertisecentra][ref2], een speciale school voor basisonderwijs met een afdeling voor voortgezet
