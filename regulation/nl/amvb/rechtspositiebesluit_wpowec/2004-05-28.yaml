        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0015136
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0015136
        hoofdstuk: '5'
  - number: '201.2'
    text: |-
      Voor de betrokkene op wie artikel 5, eerste of vierde lid, van het FPU-reglement basis- en aanvullende uitkering
      van toepassing is, maar die geen gebruik maakt van de in die regeling geboden mogelijkheid om uit te treden,
      geldt, dat hij voor het aantal uren verlof dat ligt boven het aantal uren dat voor hem geldt op grond van
      [artikel 199][ref1], geen bezoldiging ontvangt vanaf de datum waarop hij gebruik zou kunnen maken van die
      uittredingsmogelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel199
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '199'
        hoofdstuk: '1'
  - number: '202.1'
    text: |-
      Voor de toepassing van de [artikelen 4, eerste lid][ref1], en
      __REF001___________________________________________________________________________________________________________
      ______________________________ wordt, gedurende een termijn van de eerste 18 maanden van verhindering volgend op de
      kalendermaand waarin de verhindering is ontstaan, ten aanzien van de betrokkene die verlof op grond van deze titel
      geniet, onder «betrekking» verstaan: het deel van zijn betrekkingsomvang waaruit geen verlof is verleend en wordt
      voor wat betreft het deel van zijn betrekkingsomvang waarvoor dat verlof is verleend onder« volle bezoldiging» en
      «bezoldiging» verstaan: de bezoldiging vastgesteld met toepassing van [artikel 201][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel201
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel202
