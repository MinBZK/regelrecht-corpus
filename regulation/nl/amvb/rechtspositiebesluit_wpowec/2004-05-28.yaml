      - id: ref2
        bwb_id: BWBR0015136
        artikel: '152'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '277.1'
    text: |-
      De betrokkene die werkzaam is in een functie als bedoeld in [titel 13 van hoofdstuk 1][ref1] aan een speciale
      school voor basisonderwijs met een afdeling voor voortgezet speciaal onderwijs en voor wie een salarisuitzicht
      geldt als bedoeld in [artikel C1, vijfde lid, van het Besluit overgangsmaatregelen s.o. 1985][ref2], behoudt
      aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht indien hij werkzaam blijft aan genoemde
      school nadat de afdeling ervan is omgevormd tot of samengevoegd met een school voor voortgezet onderwijs. De
      aanspraak blijft voorts behouden indien de betrokkene uit hoofde van zijn benoeming werkzaamheden gaat verrichten
      ten behoeve van andere scholen van hetzelfde bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
