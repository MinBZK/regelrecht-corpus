  - number: '296.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel296
  - number: '296.2'
    text: |-
      Vanaf de inwerkingtreding van dit besluit berusten ministeriële regelingen die betrekking hebben op de
      [Wet op het primair onderwijs][ref1] en de [Wet op de expertisecentra][ref2] en die zijn gebaseerd op artikelen van
      het [Rechtspositiebesluit onderwijspersoneel][ref3] zoals dat luidde op de dag voor de datum van inwerkingtreding
      van dit besluit, op de desbetreffende vernummerde artikelen van dit besluit.


