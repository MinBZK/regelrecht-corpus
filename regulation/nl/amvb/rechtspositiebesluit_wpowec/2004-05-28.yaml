  - number: '277.3'
    text: |-
      De betrokkene die is benoemd in een functie als bedoeld in [titel 13 van hoofdstuk 1][ref1] ten behoeve van
      het verrichten van werkzaamheden aan een speciale school voor basisonderwijs en voor wie een salarisgarantie
      geldt uit hoofde van een samenvoeging van scholen, behoudt die garantie bij een herplaatsing als bedoeld in het
      tweede lid. Deze garantie geldt zolang de betrokkene bij het bevoegd gezag waarbij hij is herplaatst in dezelfde
      functie benoemd blijft. De garantie blijft behouden indien de betrokkene in aansluiting op deze functie een
      andere functie in het onderwijs aanvaardt, waarvan het salarisniveau hoger is dan dat behorende bij de functie
      die hij vervulde voorafgaand aan zijn herplaatsing als bedoeld in het tweede lid, en wel voor de duur van de
      benoeming in die andere functie. Indien de benoeming in deze andere functie in tijdelijke dienst geschiedt,
      blijft de garantie behouden als in aansluiting op deze benoeming een benoeming plaatsvindt in een functie in
      het onderwijs, waarvan het salarisniveau tenminste gelijk is aan dat behorende bij de functie die hij vervulde
      voorafgaand aan zijn herplaatsing als bedoeld in het tweede lid. Onder onderwijs als bedoeld in dit lid wordt
      verstaan: het onderwijs aan een school of instelling als bedoeld in de [Wet op het primair onderwijs][ref2], de
      [Wet op de expertisecentra][ref3], onderscheidenlijk het onderwijs aan scholen voor praktijkonderwijs als bedoeld
      in de [Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel277
    references:
