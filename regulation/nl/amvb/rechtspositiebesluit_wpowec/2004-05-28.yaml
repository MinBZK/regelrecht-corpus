  - number: '277.2'
    text: |-
      De betrokkene die is benoemd in een functie als bedoeld in [titel 13 van hoofdstuk 1][ref1]
      ten behoeve van het verrichten van werkzaamheden aan een speciale school voor basisonderwijs
      en voor wie een aanspraak op bezoldiging geldt als bedoeld in [artikel 147][ref2] of een
      salarisuitzicht als bedoeld in [artikel C1 van het Besluit overgangsmaatregelen s.o. 1985][ref3],
      behoudt die aanspraak, onderscheidenlijk dat uitzicht bij een herplaatsing overeenkomstig
      __REF003___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________ (Stb. 228). De aanspraak geldt zolang de betrokkene bij het bevoegd gezag waarbij hij is
      herplaatst in dezelfde functie benoemd blijft. Indien de betrokkene uit deze functie ontslag wordt verleend, wordt
      hij voor de toepassing van [artikel 276][ref5] in deze functie geacht benoemd te zijn gebleven in de functie die
      hij vervulde voordat hij in eerstgenoemde functie werd benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel147
