  - number: '269.1'
    text: |-
      De adjunct-directeur voor wie met toepassing van [artikel C1 van het Besluit overgangsmaatregelen s.o. 1985][ref1]
      een uitzicht is vastgesteld, behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht,
      zolang hij in de desbetreffende adjunct-directeursfunctie benoemd blijft dan wel zonder wezenlijke onderbreking
      in het onderwijs, genoemd in de tweede volzin, werkzaam blijft in een functie als adjunct-directeur met een
      maximumschaal die ten minste gelijk is aan die welke voor hem geldt in de functie waarin hij op 1 augustus 1985 is
      benoemd. Onder onderwijs als bedoeld in de eerste volzin wordt verstaan: het speciaal onderwijs of het voortgezet
      speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref2], het onderwijs aan speciale scholen
      voor basisonderwijs, al dan niet met een afdeling als bedoeld in de [Wet op het primair onderwijs][ref3] en het
      onderwijs aan scholen voor praktijkonderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref4]. Ten aanzien
      van de adjunct-directeur van een speciale school voor basisonderwijs wordt onder onderwijs als bedoeld in de eerste
      volzin mede verstaan het onderwijs aan basisscholen als bedoeld in de [Wet op het primair onderwijs][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003549
