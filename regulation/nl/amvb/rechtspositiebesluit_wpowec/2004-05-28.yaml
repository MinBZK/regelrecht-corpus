        hoofdstuk: '1'
  - number: 264.2.b
    text: |-
      de vorige onderwijsfunctie vervulde aan een school als bedoeld in
      [artikel 1 van de Wet op het voortgezet onderwijs][ref1], aan een instelling als bedoeld in [artikel I-A1
      onderdeel d, subonderdelen d4, d5 onder a, d6, d10, d13, d14, d15, d17 of d18, van het Rechtspositiebesluit
      onderwijspersoneel](onbekend) zoals [dat artikel](onbekend) luidde direct voor het tijdstip van inwerkingtreding van
      dit besluit, aan een instelling als bedoeld in [artikel 1.3 .1][ref2], [1.3.3][ref3], [1.3.4 ][ref4], [1.5.1][ref5]
      dan wel aan een instelling als bedoeld in [artikel 12.3.2 van de Wet educatie en beroepsonderwijs][ref6], in
      een functie als bedoeld in [hoofdstuk I-R van het Rechtspositiebesluit onderwijspersoneel](onbekend) zoals
      [dat hoofdstuk](onbekend) luidde direct voor het tijdstip van inwerkingtreding van dit besluit, die functie
      eindigde voor 1 augustus 1996, en van wie benoeming plaatsvindt op of na 1 augustus 1997 aan een instelling
      als bedoeld in [artikel 1 onderdeel d, onder 1° of 2°][ref7] in een functie als bedoeld in [titel 12][ref8]
      of [13 van hoofdstuk 1][ref9].


