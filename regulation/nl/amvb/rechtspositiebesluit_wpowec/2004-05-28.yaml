  - number: '271.4'
    text: |-
      De betrokkene die bij het bevoegd gezag van een speciale school voor basisonderwijs is benoemd in een functie als
      bedoeld in [titel 12 van hoofdstuk 1][ref1], en voor wie een salarisgarantie geldt uit hoofde van een samenvoeging
      van scholen, behoudt die garantie bij een herplaatsing als bedoeld in het derde lid. Deze garantie geldt zolang de
      betrokkene bij het bevoegd gezag waarbij hij is herplaatst in dezelfde functie benoemd blijft. De garantie blijft
      behouden indien de betrokkene in aansluiting op deze functie een andere functie in het onderwijs aanvaardt, waarvan
      het salarisniveau hoger is dan dat behorende bij de functie die hij vervulde voorafgaand aan zijn herplaatsing als
      bedoeld in het derde lid, en wel voor de duur van de benoeming in die andere functie. Indien de benoeming in deze
      andere functie in tijdelijke dienst geschiedt, blijft de garantie behouden als in aansluiting op deze benoeming
      een benoeming plaatsvindt in een functie in het onderwijs, waarvan het salarisniveau tenminste gelijk is aan dat
      behorende bij de functie die hij vervulde voorafgaand aan zijn herplaatsing als bedoeld in het derde lid. Onder
      onderwijs als bedoeld in dit lid wordt verstaan: het onderwijs, bedoeld in de [Wet op het primair onderwijs][ref2],
      de [Wet op de expertisecentra][ref3], onderscheidenlijk het onderwijs aan scholen voor praktijkonderwijs als
      bedoeld in de [Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0003549
      - id: ref4
        bwb_id: BWBR0002399
  - number: '271.5'
    text: |-
      De betrokkene die is benoemd in een functie als bedoeld in [titel 12 van hoofdstuk 1][ref1] bij het bevoegd
      gezag van een school voor voortgezet speciaal onderwijs aan moeilijk lerende kinderen of een speciale school voor
      basisonderwijs met een afdeling voor voortgezet speciaal onderwijs aan moeilijk lerende kinderen en voor wie een
      aanspraak of garantie geldt als bedoeld in het derde of vierde lid, behoudt die aanspraak, onderscheidenlijk die
      garantie indien genoemde school of afdeling wordt omgevormd tot een school voor praktijkonderwijs als bedoeld in
      de [Wet op het voortgezet onderwijs][ref2] en zijn benoeming wordt voortgezet ten behoeve van het verrichten van
      werkzaamheden aan die school. Het derde lid, tweede en derde volzin, en het vierde lid, tweede tot en met vijfde
      volzin, zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002399
  - number: '272.1'
    text: |-
      De betrokkene aan wie op grond van [artikel B3 van het Besluit overgangsmaatregelen b.o. 1985][ref1] of in
      [artikel B4 van het Besluit overgangsmaatregelen s.o. 1985][ref2] extra taakomvang is toegekend, behoudt
      aanspraak op toekenning daarvan zolang hij verbonden blijft aan dezelfde instelling in een functie als bedoeld
      in [titel 13 van hoofdstuk 1][ref3] en waarvoor eenzelfde maximumschaal geldt als voor de functie waarin hem op
      31 december 1991 extra taakomvang was toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003807
      [ref2]: https://wetten.overheid.nl/BWBR0003808
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel272
    references:
      - id: ref1
        bwb_id: BWBR0003807
      - id: ref2
        bwb_id: BWBR0003808
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '272.2'
    text: |-
      Indien de betrekkingsomvang van een betrokkene bij het bevoegd gezag waarbij hem extra taakomvang is toegekend,
      toeneemt dan wel indien de totale betrekkingsomvang in al zijn betrekkingen tezamen toeneemt, wordt de hem
      ingevolge het eerste lid toegekende extra taakomvang verminderd met eenzelfde hoeveelheid als waarmee zijn
      betrekkingsomvang is toegenomen, echter tot ten hoogste de omvang van die extra taakomvang. De eerste volzin geldt
      niet ten aanzien van een toename in verband met vervangingswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel272
  - number: '272.3'
    text: |-
      Indien formatieruimte in de functie van leraar ontstaat, wordt die ruimte toegedeeld aan de leraar aan wie extra
      taakomvang is toegekend in deze functie voor de omvang van die taakomvang, met dien verstande dat de totale omvang
      van de betrekking niet mag uitgaan boven de omvang van een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel272
  - number: '272.4'
    text: |-
      De bezoldiging voor de extra taakomvang, bedoeld in het eerste lid, van de betrokkene wiens betrekkingsomvang
      wegens vervangingswerkzaamheden is toegenomen, wordt verminderd met de bezoldiging die voortvloeit uit
      de vervangingswerkzaamheden voor zolang hij die bezoldiging geniet en voor zover die werkzaamheden de
      betrekkingsomvang zoals daags voor de aanvang van de vervangingswerkzaamheden vermeld in zijn akte van benoeming –
      indien hij aan instellingen van verschillende bevoegde gezagsorganen is benoemd: akten van benoeming – bedoeld in
      [artikel 8][ref1], te boven gaan, onverminderd [artikel 119][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel119
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel272
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '8'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '119'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '272.5'
    text: |-
      De aan een betrokkene toegekende fictieve extra taakomvang blijft buiten beschouwing bij de toepassing van
      [artikel 112][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel112
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel272
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '112'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '273.1'
    text: |-
      De betrokkene die op 31 december 1999 was benoemd in een functie als bedoeld in [titel 13 van hoofdstuk 1][ref1]
      en die op 1 januari 2000 in diezelfde functie blijft benoemd, heeft onverminderd [artikel 152 , eerste lid][ref2],
      en met inachtneming van het voor hem geldende carrièrepatroon met ingang van 1 januari 2000 aanspraak op een
      salarisbedrag dat is gelegen onmiddellijk boven het bedrag dat hij op 31 december 1999 genoot indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel152
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '152'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 273.1.a
    text: |-
      hij op 31 december 1999 op grond van artikel 155, eerste lid, voor het tweede of derde achtereenvolgende schooljaar
      werd bezoldigd naar het hoogste bedrag in de bij zijn functie behorende aanloopschaal;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel273
  - number: 273.1.b
    text: |-
      hij op 31 december 1999 op grond van [artikel 155, tweede lid][ref1], voor het tweede achtereenvolgende schooljaar
      werd bezoldigd naar het hoogste bedrag in de hoogste bij zijn functie behorende aanloopschaal of


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel155
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '155'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 273.1.c
    text: |-
      hij op 31 december 1999 werd bezoldigd naar een bedrag van de bij zijn functie behorende maximumschaal anders dan
      het maximumsalaris.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel273
  - number: '273.2'
    text: |-
      De betrokkene, bedoeld in het eerste lid, aanhef, heeft met ingang van 1 januari 2000 aanspraak op een toelage als
      bedoeld in [bijlage 2, onderdeel 6][ref1], overeenkomstig de bij de functie behorende maximumschaal, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: 273.2.a
    text: |-
      hij op 31 december 1999 werd bezoldigd naar het maximumsalaris van de bij zijn functie behorende maximumschaal,
      bedoeld in titel 13 van hoofdstuk 1 of
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel273
  - number: 273.2.b
    text: |-
      hij op 31 december 1999 werd bezoldigd naar een salaris overeenkomstig het voor hem op grond van
      [artikel 275][ref1], [276][ref2] of [277][ref3] vastgestelde uitzicht dan wel op die datum werd bezoldigd op grond
      van [artikel 262, tweede lid, tweede volzin en derde volzin][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel275
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel276
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel277
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Artikel262
