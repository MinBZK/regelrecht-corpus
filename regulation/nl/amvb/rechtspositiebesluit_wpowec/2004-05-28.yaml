  - number: '135'
    text: |-
      De maximumschaal die voor de normfunctie adjunct-directeur geldt, wordt afhankelijk van y vastgesteld volgens het
      onderstaande schema.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel135
