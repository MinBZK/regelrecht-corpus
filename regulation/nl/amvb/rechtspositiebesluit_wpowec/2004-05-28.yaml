  - number: '295'
    text: |-
      Het [Rechtspositiebesluit onderwijspersoneel][ref1] wordt ingetrokken, met dien verstande dat het met de regelingen
      die op dat besluit berustten, van toepassing blijft voor het tijdvak waarvoor het gelding had, voor zover daarin
      geen wijziging zal worden aangebracht via het Rechtspositiebesluit WPO/WEC.


      [ref1]: https://wetten.overheid.nl/BWBR0003771
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel295
    references:
      - id: ref1
        bwb_id: BWBR0003771
  - number: 295a.1
    text: |-
      De [artikelen 101][ref1] en [107][ref2] zijn van toepassing op het tijdvak vanaf 1 januari 2000 en
      [artikel 106][ref3] is van toepassing op het tijdvak vanaf 1 augustus 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel107
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel106
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel295a
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '101'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '107'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '106'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 295a.2
    text: |-
      Ten aanzien van het kalenderjaar 2000 wordt [artikel 107, eerste lid, van dit besluit][ref1] gelezen
      als: Het bevoegd gezag kan uitsluitend ten laste van eigen middelen met inachtneming van de in of
      krachtens de [Wet op de loonbelasting 1964][ref2] gegeven normering en beperkingen aan de betrokkenen
      uitkeringen verstrekken, verstrekkingen doen, vergoedingen toekennen, geschenken geven en zaken ter
      beschikking stellen als bedoeld in [artikel 11, eerste lid, onder h, j, l, n, q tot en met w][ref3], en
      [artikel 11a van de Wet op de loonbelasting 1964][ref4] zoals die artikelen luidden in het kalenderjaar
      2000. Onverminderd de eerste volzin, kan het bevoegd gezag aan de betrokkene zaken verstrekken of
      ter beschikking stellen voor zover de waarde ervan is bepaald in de ministeriële regeling, bedoeld in
      [artikel 13, tweede lid, eerste volzin, van de Wet op de loonbelasting 1964][ref5] zoals dat artikel luidde in het
      kalenderjaar 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel11a
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel13
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel295a
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '107'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002471
      - id: ref3
