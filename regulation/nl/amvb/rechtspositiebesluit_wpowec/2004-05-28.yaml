  - number: '274.5'
    text: |-
      De betrokkene die op grond van het tweede, het derde of het vierde lid aanspraak heeft op een
      maandelijkse toelage en die op enig moment na 1 januari 2000 wordt benoemd in een functie als bedoeld
      in [titel 13 van hoofdstuk 1][ref1] met dezelfde maximumschaal als welke direct voorafgaand aan die
      benoeming voor hem gold, behoudt die aanspraak. De tijd gedurende welke een uitkering ingevolge het
      [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref2] werd genoten, wordt niet als onderbreking van het
      dienstverband aangemerkt.


