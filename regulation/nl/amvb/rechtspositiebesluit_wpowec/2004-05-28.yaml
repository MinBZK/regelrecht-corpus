         In [bijlage 14-1 bij dit besluit][ref2] zijn voor de normfuncties taakkarakteristieken en zonodig
      benoemingsvereisten gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
  - number: '186.1'
    text: |-
      De betrokkene die in een normbetrekking is benoemd in de functie van klassenassistent, onderwijsassistent of
      technisch assistent en die het verlof, bedoeld in [artikel 32][ref1], per jaar geniet, wordt gemiddeld voor ten
      hoogste 930 uren per jaar belast met lesgebonden taken. Voor de betrokkene, bedoeld in de eerste volzin, die
      gebruik maakt van het verlof, bedoeld in [artikel 32, zevende lid][ref2], en voor wie een arbeidsduur op jaarbasis
      geldt van 1710 uren respectievelijk 1790 uren wordt in de eerste volzin voor «930 uren» gelezen «961 uren»
      respectievelijk «1010 uren».


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel32
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '186.2'
    text: |-
      De betrokkene die in een normbetrekking is benoemd in de functie van logopedist en die het verlof, bedoeld
      in [artikel 32][ref1], per jaar geniet, wordt voor gemiddeld ten hoogste 930 uren per jaar belast met
      behandeltaken. Voor de betrokkene, bedoeld in de eerste volzin, die gebruikt maakt van het verlof, bedoeld in
      [artikel 32, zevende lid][ref2], en voor wie een arbeidsduur op jaarbasis geldt van 1710 uren respectievelijk 1790
      uren wordt in de eerste volzin voor «930 uren» gelezen «961 uren» respectievelijk «1010 uren».


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel32
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '186.3'
    text: |-
      De betrokkene die in een normbetrekking is benoemd in een andere functie dan die genoemd in het eerste en
      tweede lid en voor wie ook sprake is van lesgebonden taken of behandeltaken en die het verlof, bedoeld in
      [artikel 32][ref1], per jaar geniet, wordt gemiddeld voor ten hoogste 930 uren per jaar belast met lesgebonden
      of behandeltaken. Voor de betrokkene, bedoeld in de eerste volzin, die gebruik maakt van het verlof, bedoeld in
      [artikel 32, zevende lid][ref2], en voor wie een arbeidsduur op jaarbasis geldt van 1710 uren respectievelijk 1790
      uren wordt in de eerste volzin voor «930 uren» gelezen «961 uren» respectievelijk «1010 uren».


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel32
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '186.4'
    text: |-
      Van het eerste lid kan met het oog op de invulling van de algemene arbeidsduur per jaar, bedoeld in
      [artikel 85, tweede en derde lid][ref1], in het bijzonder onderwijs worden afgeweken op grond van een overeenkomst
      als bedoeld in de [Wet op de collectieve arbeidsovereenkomst][ref2] en in het openbaar onderwijs op grond van een
      overeenkomst die voldoet aan de voorwaarden zoals die zijn gesteld in genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0001937
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '85'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001937
  - number: '186.5'
    text: |-
      Binnen een normbetrekking is 10% van de normbetrekking en indien gebruik wordt gemaakt
      van [artikel 32, zevende lid][ref1], 10% van de arbeidsduur op jaarbasis, bedoeld in
      [artikel 85, tweede of derde lid][ref2], bestemd voor activiteiten in het kader van de deskundigheidsbevordering.
      De besteding van het in de eerste volzin bedoelde deel van de normbetrekking respectievelijk de arbeidsduur op
      jaarbasis wordt door betrokkene bepaald, met dien verstande dat het bevoegd gezag in individuele gevallen en
      schriftelijk gemotiveerd daarvan kan afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel85
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '85'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '186.6'
    text: |-
      Na verkregen instemming van het decentraal georganiseerd overleg kan aan instellingen waarvoor op jaarbasis een
      onderwijstijd geldt van meer dan 1010 doch ten hoogste 1040 uur betrokkene voor maximaal die aan de instelling
      geldende onderwijstijd worden belast met het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel186
  - number: '186.7'
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang van minder dan een normbetrekking wordt het
      maximum aantal uren, bedoeld in het eerste lid, en de deskundigheidsbevordering, bedoeld in het tweede lid, naar
      evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel186
  - number: '186.8'
    text: |-
      In individuele gevallen kunnen door het bevoegd gezag en betrokkene van het percentage genoemd in het vijfde lid
      afwijkende afspraken worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel186
  - number: '187.1'
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan
      hij uit hoofde van zijn benoeming verbonden kan worden, dan wel die daarnaast werkzaamheden verricht dan
      wel gaat verrichten waarvoor hem een gedeelte van een normbetrekking is of wordt toebedeeld die op grond van
      [artikel 113][ref1] van rechtswege vervalt, wordt voor de duur en de omvang van die werkzaamheden tijdelijk
      uitgebreid met overeenkomstige toepassing van [artikel 104][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel104
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '113'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '104'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '187.2'
    text: |-
      De omvang van de tijdelijke uitbreiding van de betrekking, bedoeld in het eerste lid, wordt voor de duur waarvoor
      dit geschiedt afzonderlijk in de akte van benoeming vermeld.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel187
  - number: '187.3'
    text: |-
      Indien de betrekkingsomvang van een betrokkene die uitsluitend is benoemd voor het verrichten van
      vervangingswerkzaamheden, tijdelijk is uitgebreid op grond van het eerste lid, wordt die tijdelijke uitbreiding bij
      beëindiging van eerstbedoelde vervangingswerkzaamheden omgezet in een benoeming.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel187
  - number: '188.1'
    text: |-
      [Artikel 185][ref1] is van overeenkomstige toepassing op een instelling als bedoeld in
      [artikel 1, onderdeel d, onder 3°][ref2], voor zover die instelling over formatierekeneenheden beschikt als
      bedoeld in [artikel 68, eerste lid, onder d, van de Wet op het primair onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel185
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '185'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '68'
  - number: '188.2'
    text: |-
      Onverminderd het eerste lid, stelt het bevoegd gezag voor de betrokkene bedoeld in
      [artikel 1, onderdeel e, onder 3°][ref1], de functie en de daarbij behorende maximumschaal vast.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '188.3'
    text: |-
      Het bevoegd gezag stelt daartoe een functiebeschrijving op en stelt voor deze functie een maximumschaal vast op
      basis van de aard en de inhoud van de werkzaamheden die in de functie zijn samengebracht, met inachtneming van de
      voor de rijksoverheid geldende normen ten aanzien van functiewaardering.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel188
  - number: '189.1'
    text: Deze titel heeft uitsluitend betrekking op de leraar in opleiding.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel189
  - number: '189.2'
    text: |-
      Tenzij uitdrukkelijk anders bepaald zijn de [1][ref1], [2][ref2], [3][ref3], [4][ref4], [5][ref5], [6][ref6],
      [7][ref7], [8][ref8], [9][ref9], [11][ref10], [13 dit hoofdstuk][ref11], de [titels 1][ref12], [2][ref13],
      [3][ref14], [4 van hoofdstuk 2][ref15], titel 1 van hoofdstuk 3 en de titels 1 en 2 van hoofdstuk 4 van toepassing
      op de leraar in opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
