preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 12 februari 2002, nr. WJZ 2002/5881
    (2908), directie Wetgeving en Juridische Zaken, gedaan na overleg met Onze Minister van Volksgezondheid, Welzijn en
    Sport en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 33, tweede lid,64, 120, 123 en 185 van de Wet op het primair onderwijs, de artikelen 33,
    tweede lid, 66, 117 en 120 van de Wet op de expertisecentra, de artikelen 38a, tweede lid, 153, tweede lid, 184,
    233 en 235 van de Wet op het voortgezet onderwijs, de artikelen 3, eerste en negende lid, 5, derde lid, en 18 van
    de Ziekenfondswet en de artikelen 125, eerste lid, en 134 van de Ambtenarenwet;

    De Raad van State gehoord (advies van 29 maart 2002, nr. WO5.02.0075/III);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 21 mei 2003, nr.
    WJZ/2003/10861 (2908);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.b
    text: 'tijdelijke dienst: het dienstverband van bepaalde duur;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.c
    text: 'vaste dienst: het dienstverband van onbepaalde duur;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.d
    text: 'instelling:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.d.1°
    text: |-
      een openbare of uit de openbare kas bekostigde bijzondere basisschool of speciale school voor basisonderwijs in de
      zin van de [Wet op het primair onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 1.d.2°
    text: |-
      een openbare of uit de openbare kas bekostigde bijzondere instelling voor speciaal onderwijs, zijnde een school
      voor speciaal onderwijs, voortgezet speciaal onderwijs dan wel speciaal en voortgezet speciaal onderwijs in de zin
      van de [Wet op de expertisecentra][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 1.d.3°
    text: |-
      een centrale dienst als bedoeld in [artikel 68 van de Wet op het primair onderwijs][ref1] of
      [artikel 187 van de Wet op het voortgezet onderwijs][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel187
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
