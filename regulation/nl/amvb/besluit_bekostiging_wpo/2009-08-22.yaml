  - number: 34c.1.b
    text: de reserveringen voor zover afkomstig uit ’s Rijks kas, met inbegrip van de ontvangen rentebaten, en
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34c
  - number: 34c.1.c
    text: |-
      voor zover het een niet door een gemeente in stand gehouden school betreft, de niet bestede gedeelten van de
      uitkeringen op grond van de voorschriften inzake de gemeentelijke overschrijding.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34c
  - number: 34c.2
    text: |-
      Het bevoegd gezag meldt het overeenkomstig het eerste lid berekende saldo, verdeeld naar de onderdelen a en b,
      respectievelijk c, van het eerste lid, tezamen met het jaarverslag over het laatste jaar waarin de school nog
      geheel of gedeeltelijk voor bekostiging in aanmerking kwam. De opgave gaat vergezeld van een verklaring van een
      accountant omtrent de juistheid van de opgave.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34c
  - number: 34c.3
    text: |-
      Indien het exploitatieoverschot van een niet door een gemeente in stand gehouden school mede is opgebouwd uit
      uitkeringen als bedoeld in het eerste lid, onderdeel c, en geen onderscheid kan worden gemaakt met de baten
      respectievelijk de lasten, bedoeld in het eerste lid, onderdelen a en b, geldt als maatstaf voor de verdeling van
      eerstbedoeld deel van het exploitatieoverschot tussen Rijk en de desbetreffende gemeente de verhouding tussen het
      ontvangen bedrag aan bekostiging van het Rijk en het ontvangen bedrag aan uitkeringen, bedoeld in het eerste lid,
      onderdeel c, van de gemeente in een periode van vijf jaren voorafgaand aan het jaar van de beëindiging van de
      bekostiging. De verdeling behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34c
  - number: '35.1'
    text: |-
      Basisscholen ontvangen voor de periode van 1 augustus 2000 tot en met 31 december 2000 eenmalig een aanvullende
      vergoeding voor de uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding, welke vergoeding
