                    0,1061


                    0,0821
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34
  - number: 34a.1
    text: |-
      Indien uit een op grond van [artikel 175, eerste of tweede lid, van de wet][ref1], ingesteld onderzoek blijkt
      dat de omvang van de bekostiging voor de uitgaven ten behoeve van de materiële instandhouding, de omvang van
      de bekostiging voor de personeelskosten, de omvang van enige bijzondere of aanvullende bekostiging onjuist is
      vastgesteld, kan Onze Minister tot uiterlijk één jaar na ontvangst van de bevindingen uit dat onderzoek correcties
      aanbrengen op de desbetreffende bekostiging. Onze Minister deelt het bevoegd gezag uiterlijk één jaar na ontvangst
      van deze bevindingen schriftelijk mede of en zo ja welke correcties hij aanbrengt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel175
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '175'
  - number: 34a.2
    text: |-
      Indien uit het jaarverslag, bedoeld in [artikel 171 van de wet][ref1], uit de verklaring van de accountant, bedoeld
      in [artikel 171, vierde lid, van de wet][ref2] of uit een op grond van [artikel 175 van de wet][ref3] ingesteld
      onderzoek blijkt dat de bekostiging voor een school onrechtmatig is besteed, kan Onze Minister bepalen dat het
      desbetreffende gedeelte van de bekostiging niet ten laste komt van het Rijk of dat de daarmee gemoeide bedragen
      in mindering worden gebracht op de bekostiging. Onze Minister doet hiervan binnen een jaar na ontvangst van
      het jaarverslag, respectievelijk binnen een jaar na ontvangst van de bevindingen uit dat onderzoek schriftelijk
      mededeling aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel175
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '171'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '175'
  - number: 34a.3
    text: |-
      Indien daarvoor naar zijn oordeel aanleiding is, kan Onze Minister de in het eerste lid bedoelde termijnen
      waarbinnen correcties kunnen worden aangebracht alsmede de in het tweede lid bedoelde termijn met ten hoogste een
      jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34a
  - number: 34b
    text: |-
      Een in [artikel 34a, eerste lid][ref1], bedoelde correctie wordt, indien de correctie strekt tot verhoging van de
      bekostiging, binnen acht weken na de mededeling, bedoeld in [artikel 34a, eerste lid][ref2], door Onze Minister
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel34a
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel34a
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34b
    references:
