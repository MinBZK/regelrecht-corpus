        artikel: '88'
  - number: '3.1'
    text: |-
      Teneinde overeenkomstig de bepalingen van dit besluit enige bekostiging van het Rijk te verkrijgen, moet het
      bevoegd gezag van een bijzondere school zijn aangesloten bij een organisatie van bevoegde gezagsorganen die
      rechtspersoon met volledige rechtsbevoegdheid is en die als zodanig door Onze Minister is erkend en zich te zijnen
      genoegen heeft borg gesteld voor terugbetaling van teveel ontvangen bedragen.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3
  - number: '3.2'
    text: |-
      De erkenning, bedoeld in het eerste lid, geschiedt op een daartoe door het bestuur der organisatie tot Onze
      Minister gericht verzoek waarbij moet worden overgelegd een opgave van elk bevoegd gezag waarvoor zekerheid
      wordt gesteld, vermeldende ten aanzien van elke school de gemeente waar de school is of, indien de school bestaat
      uit een hoofdvestiging en een of meer nevenvestigingen, de gemeente of gemeenten waar de hoofdvestiging en de
      nevenvestiging of nevenvestigingen zijn gelegen en de nadere plaatsaanduiding onderscheidenlijk plaatsaanduidingen
      binnen die gemeente of gemeenten, alsmede de naam van de rechtspersoon onder wiens bestuur de school staat.
      Wijzigingen die daarin worden aangebracht, deelt het bestuur der organisatie binnen twee weken mede aan Onze
      Minister. Deze wijzigingen ontheffen de organisaties niet van de voor het lopende jaar aangegane borgstelling ten
      behoeve van een aangesloten bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3
  - number: 3a.1
    text: |-
      De aanspraak op de verstrekking van bekostiging voor de personeelskosten, bedoeld in de [artikelen 129][ref1] en
      [137, eerste lid, van de wet][ref2], ontstaat met ingang van 1 augustus van het schooljaar waarin de bekostiging
      van een nieuw geopende school begint.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '137'
  - number: 3a.2
    text: |-
      De aanspraak op de bekostiging voor de uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding,
      bedoeld in [artikel 134, van de wet][ref1], ontstaat met ingang van 1 augustus van het schooljaar waarin de
      bekostiging van een nieuw geopende school begint.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: 3a.3
    text: |-
      In afwijking van het eerste lid, ontstaat aanspraak op bekostiging voor de uitgaven voor 1 lid van het personeel op
      1 juni voorafgaand aan het schooljaar waarin de bekostiging van een nieuw geopende school begint.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3a
  - number: 3a.4
    text: 'De in het derde lid bedoelde bekostiging bestaat uit de som van:'
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3a
  - number: 3a.4.a
    text: |-
      een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de geraamde
      landelijk gewogen gemiddelde leeftijd van de leraren van basisscholen respectievelijk van de leraren van speciale
      scholen voor basisonderwijs op 1 oktober voorafgaand aan het schooljaar waarin de bekostiging van de nieuw geopende
      school begint; en
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3a
  - number: 3a.4.b
    text: |-
      2/12 van de aanvullende bekostiging voor schoolleiding, bedoeld in [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel26
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '26'
        hoofdstuk: III
  - number: 3a.5
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het vierde lid, onderdeel a, en het leeftijdsbedrag, bedoeld in
      het vierde lid, onderdeel a, bedraagt de formatie 2/12 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3a
  - number: 3a.6
    text: |-
      Onverminderd het derde lid, heeft een school die op de teldatum geen leerlingen heeft geen aanspraak op
      bekostiging.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3a
  - number: 3a.7
    text: |-
      Indien een school op 1 oktober van het schooljaar waarin de bekostiging van een nieuw geopende school begint geen
      leerlingen heeft, ontstaat in afwijking van het zesde lid, aanspraak op bekostiging voor de personeelskosten,
      bedoeld in de [artikelen 129][ref1] en [137, eerste lid, van de wet][ref2], met ingang van de eerste dag van de
      maand waarin de school een leerling heeft. Indien de eerste volzin van toepassing is, wordt de bekostiging voor het
      lopende schooljaar en het daaropvolgende schooljaar gebaseerd op het aantal leerlingen dat de school heeft op de
      eerste dag van de tweede maand volgend op de dag waarop de school de eerste leerling heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '137'
  - number: 3b.1
    text: |-
      Aan het bevoegd gezag van een nieuw geopende school wordt, in afwachting van de vaststelling van de bekostiging
      voor personeelskosten en de bekostiging voor de uitgaven voor de materiële voorzieningen ten behoeve van de
      instandhouding op basis van de gegevens op de teldatum, een voorschot op de bedoelde bekostiging verstrekt indien
      het bevoegd gezag uiterlijk op 1 juli voorafgaande aan het schooljaar waarin de bekostiging van een nieuw geopende
      school begint, het vermoedelijk aantal leerlingen op 1 oktober volgend op de datum van ingang van de bekostiging
      aan Onze Minister meldt.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3b
  - number: 3b.2
    text: 'Het voorschot, bedoeld in het eerste lid, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3b
  - number: 3b.2.a
    text: |-
      de bekostiging, bedoeld in [artikel 137, eerste lid, van de wet][ref1], berekend overeenkomstig dit besluit, met
      dien verstande dat wordt gerekend met het aantal leerlingen, bedoeld in het eerste lid; en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
  - number: 3b.2.b
    text: |-
      de bekostiging, bedoeld in [artikel 134 van de wet][ref1], berekend overeenkomstig dit besluit, met dien verstande
      dat wordt gerekend met het aantal leerlingen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: 3b.3
    text: |-
      Op de betaling van het voorschot zijn [artikel 13][ref1] en [artikel 19][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel19
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '19'
        hoofdstuk: III
  - number: 3b.4
    text: |-
      Onze Minister is bevoegd tot verrekening van verstrekte voorschotten met de betalingen die voortvloeien uit de
      vaststelling van de onderscheiden onderdelen van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3b
  - number: 3b.5
    text: |-
      Indien Onze Minister een voorschot verleent in gevallen waarin de bekostiging wegens niet aan het bevoegd gezag van
      een school toe te rekenen omstandigheden niet tijdig kan worden vastgesteld, zijn het derde en het vierde lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel3b
  - number: '4'
    text: |-
      Het bevoegd gezag geeft binnen twee weken na een besluit tot opheffing van de school of een nevenvestiging
      kennis daarvan aan Onze Minister, gedeputeerde staten, de inspecteur en, indien het een bijzondere school of
      een nevenvestiging daarvan betreft, eveneens aan burgemeester en wethouders van de gemeente waarin de school
      onderscheidenlijk de nevenvestiging is gelegen.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel4
  - number: '5.1'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 153, vierde lid, van de wet][ref1] worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
  - number: 5.1.a
    text: naam, adres en het door het ministerie toegekende administratienummer van de desbetreffende school,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.1.b
    text: het telefoonnummer van het bevoegd gezag,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.1.c
    text: |-
      het feitelijk aantal leerlingen, niet zijnde leerlingen van een nevenvestiging, van de desbetreffende school op 1
      oktober van het schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.1.d
    text: |-
      het door het ministerie toegekende administratienummer van de school van dezelfde richting, dan wel indien
      het openbaar onderwijs betreft de school met openbaar onderwijs, met het dichtst bij het hoofdgebouw van de
      desbetreffende school, daaronder niet begrepen een nevenvestiging, gelegen hoofdgebouw,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.1.e
    text: |-
      een plattegrond met een schaalverdeling waarop het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en het dichtstbijzijnde hoofdgebouw van de onder *d* bedoelde school zijn aangegeven
      en
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.1.f
    text: |-
      de afstand, hemelsbreed gemeten, tussen enerzijds het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en anderzijds het dichtstbijzijnde hoofdgebouw van de onder *d* bedoelde school.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: '5.2'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 153, vijfde lid, van de wet][ref1] worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
  - number: 5.2.a
    text: de in het eerste lid, onder a en b, genoemde gegevens,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.2.b
    text: |-
      het door het ministerie toegekende administratienummer van de school met openbaar onderwijs, met het dichtst bij
      het hoofdgebouw van de desbetreffende school, daaronder niet begrepen een nevenvestiging, gelegen hoofdgebouw,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.2.c
    text: 'een plattegrond met een schaalverdeling waarop zijn aangegeven:'
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.2.c.1°
    text: |-
      het hoofdgebouw van de desbetreffende school, daaronder niet begrepen een nevenvestiging, en het dichtstbijzijnde
      hoofdgebouw van de onder b bedoelde school, en
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.2.c.2°
    text: |-
      de kortste route over de weg tussen enerzijds het hoofdgebouw van de desbetreffende school, daaronder niet begrepen
      een nevenvestiging, en anderzijds het dichtstbijzijnde hoofdgebouw van de onder *b* bedoelde school,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.2.d
    text: de afstand in tienden van kilometers van de in onderdeel c2° bedoelde route en
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.2.e
    text: informatie waaruit blijkt dat aan het volgen van openbaar onderwijs behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: '5.3'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, eerste lid, van de wet][ref1] worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5.3.a
    text: de in het eerste lid, onder a en b, genoemde gegevens,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.3.b
    text: |-
      het feitelijk aantal leerlingen van de desbetreffende school, daaronder begrepen leerlingen van een nevenvestiging,
      op 1 oktober van het schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.3.c
    text: naam, adres en het door het ministerie toegekende administratienummer van de overige scholen van het bevoegd gezag,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.3.d
    text: |-
      het feitelijk aantal leerlingen, daaronder begrepen leerlingen van een nevenvestiging, van de overige scholen van
      het bevoegd gezag op 1 oktober van het schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.3.e
    text: de voor de scholen van het bevoegd gezag geldende opheffingsnorm.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: '5.4'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, tweede lid, van de wet][ref1] worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5.4.a
    text: de in het eerste lid, onder a en b, en derde lid, onder b tot en met d, genoemde gegevens, en
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.4.b
    text: de per school van het bevoegd gezag geldende opheffingsnorm.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: '5.5'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, derde juncto het eerste lid][ref1], worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5.5.a
    text: de in het eerste lid, onder a en b, en derde lid, onder b tot en met e, genoemde gegevens,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.5.b
    text: |-
      een afschrift van de samenwerkingsovereenkomst, bedoeld in [artikel 157, derde lid, van de wet][ref1] die het
      bevoegd gezag het eerst heeft gesloten, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5.5.c
    text: |-
      informatie waaruit blijkt dat aan de in [artikel 157, derde lid, onder a en b, van de wet][ref1] genoemde
      voorwaarden is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: '5.6'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, derde juncto het tweede lid][ref1], worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5.6.a
    text: |-
      de in het eerste lid, onder a en b, derde lid, onder b tot en met d, vierde lid, onder b, en vijfde lid, onder b
      tot en met d, genoemde gegevens,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.6.b
    text: |-
      het door het ministerie toegekende administratienummer van de school van dezelfde richting, dan wel indien
      het openbaar onderwijs betreft, de school met openbaar onderwijs, met het dichtst bij het hoofdgebouw van de
      desbetreffende school, daaronder niet begrepen een nevenvestiging, gelegen hoofdgebouw,
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.6.c
    text: |-
      een plattegrond met een schaalverdeling waarop het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en het dichtstbijzijnde hoofdgebouw van de onder *b* bedoelde school zijn aangegeven,
      en
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5.6.d
    text: |-
      de afstand, hemelsbreed gemeten, tussen enerzijds het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en anderzijds het dichtstbijzijnde hoofdgebouw van de onder *b* bedoelde school.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5
  - number: 5a.1
    text: |-
      In geval van voortijdige beëindiging van een samenwerkingsovereenkomst wordt voor elk schooljaar dat
      een bijzondere school dan wel een openbare school op grond van de samenwerkingsovereenkomst, bedoeld in
      [artikel 157, derde lid, van de wet][ref1], in stand werd gehouden, door het Rijk een bedrag ingehouden op de
      bekostiging van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5a.2
    text: |-
      Het bedrag, bedoeld in het eerste lid, is de som van de bekostiging, bedoeld in [artikel 23][ref1],
      [artikel 24][ref2] en [artikel 26][ref3], in elk van die schooljaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0003862#Artikel26
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '23'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '24'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003862
        artikel: '26'
        hoofdstuk: III
  - number: 5a.3
    text: |-
      Voor elk schooljaar dat een bijzondere dan wel een openbare nevenvestiging op grond van de
      samenwerkingsovereenkomst, bedoeld in [artikel 157, derde lid, van de wet][ref1], in stand werd gehouden, wordt
      door het Rijk een bedrag ingehouden op de bekostiging van de nevenvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5a.4
    text: |-
      Het bedrag, bedoeld in het derde lid, is de bekostiging, bedoeld in [artikel 25][ref1], in elk van die schooljaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel25
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '25'
        hoofdstuk: III
  - number: '6.1'
    text: |-
      De directeur van een school draagt er zorg voor dat een overzichtelijke administratie van de inschrijving,
      de uitschrijving en het verzuim van de leerlingen op de school beschikbaar is alsmede van de gegevens van de
      leerlingen en hun ouders die noodzakelijk zijn voor de berekening van de bekostiging voor personeelskosten.
      Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen wordt in deze administratie een
      onderverdeling gemaakt naar leerlingen van de hoofdvestiging en leerlingen van elk van de nevenvestigingen en
      draagt de directeur er zorg voor dat de volledige administratie op de hoofdvestiging aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel6
  - number: '6.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de wijze waarop de leerlingenadministratie
      wordt ingericht.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel6
  - number: '7.1'
    text: De directeur van een school schrijft een leerling slechts in na overlegging van
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel7
  - number: 7.1.a
    text: |-
      een bewijs van uitschrijving van de leerling van een andere school of een school of instelling voor ander
      onderwijs, welk bewijs op het moment van inschrijving niet ouder is dan 6 maanden, of
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel7
  - number: 7.1.b
    text: |-
      een schriftelijke verklaring van de ouders dat de leerling binnen een periode van 6 maanden voorafgaand aan de
      inschrijving niet eerder op een andere school of een school of instelling voor ander onderwijs was ingeschreven.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel7
  - number: '7.2'
    text: |-
      Het bewijs van uitschrijving dan wel de verklaring, bedoeld in het eerste lid, onderdeel *b*, wordt bewaard in de
      administratie van de school.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel7
  - number: '7.3'
    text: |-
      De directeur doet in het geval, bedoeld in het eerste lid, onderdeel *a*, dan wel in het geval, bedoeld in het
      eerste lid, onderdeel *b*, indien hem bekend is op welke andere school of school of instelling voor ander onderwijs
      de leerling was ingeschreven buiten de in het eerste lid, onderdeel *b*, bedoelde periode, onder vermelding van de
      datum van inschrijving op zijn school, binnen 1 week schriftelijk mededeling van de inschrijving aan de directeur
      van de school of de school of instelling voor ander onderwijs waarop de leerling voordien was ingeschreven.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel7
  - number: '8.1'
    text: |-
      De directeur van een school op wiens school de leerling staat ingeschreven, schrijft de leerling, indien deze de
      school verlaat, uit met ingang van de dag volgende op de dag waarop de leerling de school voor het laatst heeft
      bezocht en verstrekt de leerling een bewijs van uitschrijving.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel8
  - number: '8.2'
    text: |-
      Indien de directeur van een school op wiens school de leerling stond ingeschreven binnen 4 weken na de dag waarop
      de leerling de school voor het laatst heeft bezocht een mededeling ontvangt van de directeur, rector of centrale
      directie van een school of een school of instelling voor ander onderwijs, van de inschrijving van de leerling op
      diens school, wijzigt de directeur de datum van uitschrijving, bedoeld in het eerste lid, alsnog in de datum van de
      dag voorafgaande aan de inschrijving op de andere school of de school of instelling voor ander onderwijs.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel8
  - number: '9.1'
    text: |-
      De gegevens die in de leerlingenadministratie zijn opgenomen, blijven daarvan in ieder geval deel uitmaken
      gedurende 5 jaar nadat de desbetreffende leerling van de school is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel9
  - number: '9.2'
    text: |-
      De gegevens die noodzakelijk zijn voor de berekening van de bekostiging voor personeelskosten, worden binnen acht
      weken na het verstrijken van de termijn, genoemd in het eerste lid, vernietigd.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel9
  - number: '10.1'
    text: |-
      Voor de toepassing van de wet worden, onverminderd [artikel 8][ref1] en [artikel 11, vijfde lid][ref2], de
      leerlingen op een school meegeteld die op de teldatum op die school staan ingeschreven tenzij zij vanaf het
      begin van het schooljaar tot de teldatum meer dan de helft van het aantal schooldagen zonder geldige reden hebben
      verzuimd.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel11
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '8'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '11'
        hoofdstuk: I
        afdeling: '2'
  - number: '10.2'
    text: |-
      Voor de toepassing van het eerste lid wordt ten aanzien van de leerplichtige leerling als geldige reden aangemerkt
      een vrijstelling van geregeld schoolbezoek als bedoeld in de [Leerplichtwet 1969][ref1] (*Stb.* 1971, 406). Ten
      aanzien van de niet-leerplichtige leerling worden als geldige reden aangemerkt dezelfde gronden als die welke
      leiden tot een vrijstelling als bedoeld in de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: '10.3'
    text: |-
      Indien de teldatum valt op een dag waarop geen onderwijs wordt gegeven, worden op de eerstvolgende schooldag de
      leerlingen geteld, die op de teldatum stonden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel10
  - number: '10.4'
    text: Een leerling kan slechts op 1 school voor de bekostiging meetellen.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel10
  - number: '11.1'
    text: |-
      Voor 15 oktober indien de teldatum 1 oktober is dan wel binnen 2 weken na een andere teldatum zendt het bevoegd
      gezag aan Onze Minister, de inspecteur en, indien het een bijzondere school betreft, eveneens aan burgemeester en
      wethouders, een opgave van het aantal leerlingen overeenkomstig [artikel 10][ref1]. Deze opgave is onderverdeeld in
      het aantal leerlingen in de leeftijd van 4 tot en met 7 jaar enerzijds en het aantal leerlingen in de leeftijd van
      8 jaar en ouder anderzijds. Indien in de opgave een nadere onderverdeling wordt gemaakt op grond van de volgende
      leden, wordt in die onderverdeling tevens melding gemaakt van de verdeling over de in de vorige volzin genoemde
      leeftijdscategorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel10
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '10'
        hoofdstuk: I
        afdeling: '2'
  - number: '11.2'
    text: |-
      De opgave, bedoeld in het eerste lid, voor basisscholen is onderverdeeld in de categorieën leerlingen, bedoeld in
      [artikel 27][ref1], en in de categorieën leerlingen met een niet-Nederlandse culturele achtergrond met uitzondering
      van leerlingen van wie ten minste een van de ouders of voogden afkomstig is uit Suriname, de Nederlandse Antillen
      of Aruba.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel27
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '27'
        hoofdstuk: III
  - number: '11.3'
    text: |-
      De opgave, bedoeld in het eerste lid, voor speciale scholen voor basisonderwijs is onderverdeeld in leerlingen met
      een niet-Nederlandse culturele achtergrond en overige leerlingen.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel11
  - number: '11.4'
    text: |-
      Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt de opgave, bedoeld in
      het eerste lid, tevens onderverdeeld in de leerlingen van de hoofdvestiging en de leerlingen van elk van de
      nevenvestigingen.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel11
  - number: '11.5'
    text: |-
      Indien als gevolg van de wijzigingen op grond van [artikel 8][ref1] een wijziging optreedt in de in het eerste
      lid bedoelde opgave, doet het bevoegd gezag van de school waarvan de leerling is respectievelijk leerlingen zijn
      uitgeschreven, binnen 6 weken na de teldatum daarvan mededeling aan Onze Minister, de inspecteur en, indien het een
      bijzondere school betreft, eveneens aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel8
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '8'
        hoofdstuk: I
        afdeling: '1'
  - number: '11.6'
    text: |-
      Bij ministeriële regeling wordt vastgesteld op welke wijze de opgave, bedoeld in het eerste lid, en de melding,
      bedoeld in [artikel 70a, eerste lid, van de wet][ref1] wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel70a
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 70a
  - number: 11a.1
    text: |-
      Het bevoegd gezag van een school doet jaarlijks voor 1 december aan Onze Minister mededeling van de gewogen
      gemiddelde leeftijd van de leraren van die school op 1 oktober daaraan voorafgaand.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel11a
  - number: 11a.2
    text: Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel11a
  - number: 11b
    text: |-
      Het bevoegd gezag verstrekt gelijktijdig met de verklaring, bedoeld in [artikel 171, vierde lid, van de wet][ref1],
      een verklaring omtrent de juistheid en tijdige aanmelding van de gegevens waarop de bekostigingsbedragen zijn of
      worden gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
  - number: 12a.1
    text: |-
      Onze Minister stelt jaarlijks voor 1 februari de bekostiging voor dat jaar voor basisscholen en speciale
      scholen voor basisonderwijs vast, gebaseerd op de grondslag bedoeld in de [artikelen 134, vierde lid][ref1],
      onderscheidenlijk [115 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel115
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '115'
  - number: 12a.2
    text: |-
      Indien [artikel 134, zesde lid, van de wet][ref1] van toepassing is en indien het bevoegd gezag het aantal
      leerlingen op 1 maart van het bekostigingsjaar voor 15 maart van dat jaar heeft gemeld, stelt Onze Minister voor 1
      mei de bekostiging, bedoeld in het eerste lid, voor dat jaar nader vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: 12a.3
    text: |-
      Indien de verklaring van de accountant, bedoeld in [artikel 171, vierde lid, van de wet][ref1], aanleiding geeft
      tot wijziging van de bekostiging, bedoeld in het eerste of tweede lid, stelt Onze Minister voor 1 oktober de
      bekostiging voor dat jaar nader vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
  - number: '13.1'
    text: |-
      Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de materiële voorzieningen ten behoeve
      van de instandhouding aan het bevoegd gezag van een school een twaalfde gedeelte van de vergoeding, bedoeld in
      [artikel 134, eerste lid, van de wet][ref1], waarop het over dat jaar recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: '13.2'
    text: |-
      Indien [artikel 12a, tweede lid][ref1], van toepassing is, wordt het verschil tussen de vergoeding, bedoeld in
      het eerste lid, berekend op grond van [artikel 134, zesde lid, van de wet][ref2] en de vergoeding berekend op
      grond van [artikel 134, vierde lid, van de wet][ref3], verstrekt in de maanden mei tot en met december van het
      uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel134
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: 12a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '134'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '134'
  - number: '13.3'
    text: |-
      Indien [artikel 12a, derde lid][ref1], van toepassing is, vindt verrekening plaats van de vergoeding, bedoeld
      in het eerste lid, met de vergoeding die wordt verstrekt in de maanden oktober tot en met december van het
      uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel12a
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: 12a
        hoofdstuk: II
  - number: '14.1'
    text: |-
      Het normatief bepaalde aantal te huisvesten groepen leerlingen van basisscholen, bedoeld in
      [artikel 134, vierde lid, onderdeel a, vijfde lid, onderdeel a, en zesde lid, onderdeel a, van de wet][ref1], wordt
      voor het jaar waarvoor de vergoeding voor de materiële voorzieningen ten behoeve van de instandhouding strekt,
      berekend volgens de volgende formule: het normatief bepaalde aantal te huisvesten groepen leerlingen = (A + B + C
      + D)/179.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: '14.2'
    text: |-
      De factoren A, B, C en D van de formule, bedoeld in het eerste lid, worden als volgt berekend: A = 9 x het
      aantal leerlingen in de leeftijd van 4 tot en met 7 jaar op de datum, bedoeld in het derde lid; B = 6,17 x het
      aantal leerlingen in de leeftijd van 8 jaar en ouder op de datum, bedoeld in het derde lid; C = 280 – (het aantal
      leerlingen op de datum, bedoeld in het derde lid, x 2,06), met dien verstande dat C niet kleiner is dan nul; D =
      3,2 x het schoolgewicht, bedoeld in [artikel 27][ref1], waarbij als teldatum wordt aangemerkt de datum, bedoeld in
      het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel27
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '27'
        hoofdstuk: III
  - number: '14.3'
    text: |-
      De datum die dient als grondslag voor de vaststelling van het aantal leerlingen bij de berekening van de factoren
      A, B en C en als grondslag voor de vaststelling van het schoolgewicht bij de berekening van factor D, is:
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel14
  - number: 14.3.a
    text: |-
      indien [artikel 134, vierde lid, van de wet][ref1] van toepassing is: 1 oktober van het jaar voorafgaande aan het
      jaar waarover de vergoeding plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: 14.3.b
    text: |-
      indien [artikel 134, vijfde lid, van de wet][ref1] van toepassing is: 1 oktober in de periode waarover de
      vergoeding plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: 14.3.c
    text: |-
      indien [artikel 134, zesde lid, van de wet][ref1] van toepassing is: 1 maart van het jaar waarover de vergoeding
      plaatsvindt, met dien verstande dat bij de berekening van de factoren A en B wordt uitgegaan van de leeftijd van
      de desbetreffende leerlingen op 1 oktober van het daaraan voorafgaande jaar, waarbij de leerlingen die op 1 oktober
      van dat jaar 3 jaar waren, worden meegeteld bij de berekening van factor A.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: '14.4'
    text: |-
      Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt het eerste lid voor de
      hoofdvestiging en elke nevenvestiging afzonderlijk toegepast.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel14
  - number: '14.5'
    text: Het normatief bepaalde aantal te huisvesten groepen leerlingen wordt rekenkundig afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel14
  - number: '14.6'
    text: |-
      Het bij algemene maatregel van bestuur vast te stellen aantal leerlingen, bedoeld in
      [artikel 134, zesde lid, van de wet][ref1], is 13.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: '16'
    text: |-
      De uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding voor schoolgebouwen hebben betrekking
      op de programma’s van eisen, bedoeld in [artikel 114, eerste lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
  - number: '17.1'
    text: |-
      De vergoeding voor de materiële voorzieningen ten behoeve van de instandhouding wordt bepaald volgens de
      programma’s van eisen, bedoeld in [artikel 113, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel17
