  - number: '17.3'
    text: |-
      De bedragen, bedoeld in het tweede lid, worden jaarlijks per 1 augustus, telkens te rekenen met het laatstelijk
      aangepaste bedrag, bij ministeriële regeling aangepast aan de prijsontwikkeling, overeenkomstig de prijsmutatie
      van de netto materiële consumptie, zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal
      optreden tussen het prijsniveau in het jaar voorafgaande aan het jaar waarin het bedrag wordt aangepast, en het
      jaar waarin het bedrag wordt aangepast.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister stelt jaarlijks uiterlijk op 15 april, de bekostigingsbedragen, bedoeld in
      [artikel 137, eerste en derde lid, van de wet][ref1] vast voor zover deze bedragen mede gebaseerd zijn op het
      aantal leerlingen op de teldatum. De bedragen hebben betrekking op een schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
  - number: '18.2'
    text: |-
      Onze Minister stelt de bekostigingsbedragen, bedoeld in [artikel 137, eerste lid, van de wet][ref1] voorzover
      het betreft de bekostiging, bedoeld in de [artikelen 29][ref2], [30][ref3] en [34][ref4], vast binnen 8 weken na
      ontvangst van de gegevens ten behoeve van de berekening van deze bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0003862#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0003862#Artikel34
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '29'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003862
        artikel: '30'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003862
        artikel: '34'
        hoofdstuk: III
  - number: '18.3'
    text: |-
      Indien de verklaring van de accountant, bedoeld in [artikel 171, vierde lid, van de wet][ref1] aanleiding geeft
      tot wijziging van de bekostiging, bedoeld in het eerste of tweede lid, stelt Onze Minister voor 1 oktober de
      bekostiging voor dat jaar nader vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
  - number: '18.4'
    text: |-
      De in het eerste en tweede lid bedoelde bekostigingsbedragen kunnen door Onze Minister worden gewijzigd wegens
      algemene salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel18
  - number: '19.1'
    text: |-
      De betaling van de bekostigingsbedragen voor personeelskosten, bedoeld in de [artikelen 129][ref1] en
      [137 eerste lid, van de wet][ref2] vindt maandelijks plaats in een bij ministeriële regeling vast te stellen
      betaalritme dat voor basisscholen en speciale scholen voor basisonderwijs alsmede voor de verschillende onderdelen
      van de bekostiging verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '137'
  - number: '19.2'
    text: |-
      De betaling van de bekostiging voor personeelskosten, bedoeld in [artikel 137, tweede lid, van de wet][ref1] vindt,
      tenzij bij beschikking anders wordt bepaald, plaats in een aantal gelijke maandelijkse termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
  - number: '19.3'
    text: |-
      De betaling van de bekostiging voor personeelskosten, bedoeld in [artikel 137, derde lid, van de wet][ref1] vindt
      plaats in twaalf gelijke maandelijkse termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
  - number: '20.1'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 120, tweede lid, onderdeel a, van de wet][ref1]
      bedraagt de formatie per leerling 0,0596 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '20.2'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 120, tweede lid, onderdeel b, van de wet][ref1]
      bedraagt de formatie per leerling 0,0415 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '20.3'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 120, tweede lid, onderdeel c, van de wet][ref1]
      bedraagt de formatie per leerling 0,0452 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '21'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 120, vierde lid, van de wet][ref1] bedraagt de
      formatie per leerling 0,0646 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '22'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel22
  - number: 22.a
    text: |-
      formatiebasisbedrag: een bij ministeriële regeling vast te stellen bedrag, dat niet afhankelijk is van de leeftijd
      van personeel van de school;
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel22
  - number: 22.b
    text: |-
      formatieleeftijdsbedrag: een bij ministeriële regeling vast te stellen bedrag, dat vervolgens afhankelijk wordt
      gesteld van de leeftijd van personeel van de school;
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel22
  - number: 22.c
    text: |-
      basisbedrag: een bij ministeriële regeling vast te stellen bedrag, dat wordt bepaald door de in het desbetreffende
      artikel genoemde formatie te vermenigvuldigen met het formatiebasisbedrag;
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel22
  - number: 22.d
    text: |-
      leeftijdsbedrag: een bij ministeriële regeling vast te stellen bedrag, dat wordt bepaald door de in het
      desbetreffende artikel genoemde formatie te vermenigvuldigen met het formatieleeftijdsbedrag.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel22
  - number: '23.1'
    text: |-
      Indien de totale bekostiging voor personeelskosten berekend op grond van
      [artikel 120, eerste lid, van de wet][ref1] vermeerderd met de bekostiging, bedoeld in [artikel 26][ref2], en in
      voorkomende gevallen vermeerderd met de bekostiging, bedoeld in de [artikelen 24][ref3], [25][ref4], [28][ref5],
      [29][ref6] en [30][ref7], voor een basisschool minder bedraagt dan een basisbedrag, welk bedrag wordt verhoogd met
      een leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de basisschool
      op 1 oktober van het voorafgaande schooljaar, wordt de bekostiging voor personeelskosten verhoogd tot het bedrag
      van laatstbedoelde uitkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0003862#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0003862#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0003862#Artikel28
      [ref6]: https://wetten.overheid.nl/BWBR0003862#Artikel29
      [ref7]: https://wetten.overheid.nl/BWBR0003862#Artikel30
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '26'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003862
        artikel: '24'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003862
        artikel: '25'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0003862
        artikel: '28'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0003862
        artikel: '29'
        hoofdstuk: III
      - id: ref7
        bwb_id: BWBR0003862
        artikel: '30'
        hoofdstuk: III
  - number: '23.2'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het eerste lid, en het leeftijdsbedrag, bedoeld in het eerste
      lid, bedraagt de formatie 2,6927 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel23
  - number: '23.3'
    text: |-
      Voor de toepassing van het eerste lid wordt voor het schooljaar waarin een nieuwe basisschool wordt geopend,
      het leeftijdsbedrag vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van de leraren van
      basisscholen op 1 oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel23
  - number: '24.1'
    text: Een basisschool die op de teldatum minder dan 145 leerlingen had, ontvangt een toeslag voor kleine scholen.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel24
  - number: '24.2'
    text: 'De in het eerste lid bedoelde toeslag bestaat uit het verschil tussen:'
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel24
  - number: 24.2.a
    text: |-
      een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen
      gemiddelde leeftijd van de leraren van de school op 1 oktober van het voorafgaande schooljaar; en
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel24
  - number: 24.2.b
    text: |-
      een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen
      gemiddelde leeftijd van de leraren van de school op 1 oktober van het voorafgaande schooljaar en vervolgens
      vermenigvuldigd met het aantal leerlingen van de school op de teldatum.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel24
  - number: '24.3'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het tweede lid, onderdeel a, en het leeftijdsbedrag, bedoeld in
      het tweede lid, onderdeel a, bedraagt de formatie 2,1508 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel24
  - number: '24.4'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het tweede lid, onderdeel b, en het leeftijdsbedrag, bedoeld in
      het tweede lid, onderdeel b, bedraagt de formatie per leerling 0,0149 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel24
  - number: '24.5'
    text: |-
      Voor de toepassing van het tweede lid wordt voor het schooljaar waarin een nieuwe basisschool is geopend,
      het leeftijdsbedrag vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van de leraren van
      basisscholen op 1 oktober van het voorafgaande schooljaar
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel24
  - number: '25'
    text: |-
      Indien een basisschool bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt de bekostiging voor
      personeelskosten vermeerderd met drievierde van het verschil tussen:
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel25
  - number: 25.a
    text: |-
      de som van de aanvullende bekostiging voor kleine scholen die de hoofdvestiging en de nevenvestigingen als
      zelfstandige scholen tezamen zouden ontvangen, berekend aan de hand van de gewogen gemiddelde leeftijd van de
      leraren van de gehele school op 1 oktober van het voorafgaande schooljaar, en
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel25
  - number: 25.b
    text: de aanvullende bekostiging voor kleine scholen die de basisschool als school zonder nevenvestigingen zou ontvangen.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel25
  - number: '26.1'
    text: |-
      De aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 120, derde lid, van de wet][ref1] bedraagt
      voor basisscholen met een aantal leerlingen op de teldatum dat niet hoger is dan 97 een bij ministeriële regeling
      vast te stellen bedrag. Voor basisscholen met een aantal leerlingen op de teldatum dat hoger is dan 97 wordt het in
      de eerste volzin bedoelde bedrag met 2 vermenigvuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '26.2'
    text: |-
      De aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 120, derde lid, van de wet][ref1] bedraagt
      voor speciale scholen voor basisonderwijs met een aantal leerlingen op de teldatum dat niet hoger is dan 99 een bij
      ministeriële regeling vast te stellen bedrag. Voor speciale scholen voor basisonderwijs met een aantal leerlingen
      op de teldatum dat hoger is dan 99 wordt het in de eerste volzin bedoelde bedrag met 2 vermenigvuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '27.1'
    text: |-
      Voor elke leerling die volgens onderstaande tabel in een categorie kan worden ingedeeld, wordt bij de toelating tot
      een basisschool het bij die categorie behorende gewicht vastgesteld, met dien verstande dat een leerling slechts
      bij één categorie wordt ingedeeld.








                    Leerling categorie







                    a.


                    Leerling van wie beide ouders of verzorgers een schoolopleiding hebben gevolgd op maximaal het niveau
      praktijkonderwijs of voorbereidend beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg of de
      kaderberoepsgerichte leerweg. Indien het betreft een leerling uit een eenoudergezin, geldt deze opleidingseis ten
      aanzien van de desbetreffende ouder of verzorger.


                    0,3




                    b.


                    Leerling van wie een ouder of verzorger een schoolopleiding heeft gevolgd op maximaal het niveau
      basisonderwijs, en van wie de andere ouder of verzorger een schoolopleiding heeft gevolgd op maximaal het niveau
      praktijkonderwijs of voorbereidend beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg of
      de kaderberoepsgerichte leerweg. Indien het betreft een leerling uit een eenoudergezin, geldt dat de ouder of
      verzorger een schoolopleiding heeft gevolgd op maximaal het niveau basisonderwijs.


                    1,2




           Met het hebben gevolgd van een schoolopleiding op maximaal het niveau praktijkonderwijs of voorbereidend
      beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg of de kaderberoepsgerichte leerweg wordt
      gelijkgesteld het hebben doorlopen van ten hoogste de eerste twee leerjaren van een andere vorm van voortgezet
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel27
  - number: '27.2'
    text: |-
      Het schoolgewicht wordt berekend door de som van de volgens het eerste lid vastgestelde gewichten van de op de
      teldatum ingeschreven leerlingen te verminderen met een getal, gelijk aan 6% van het aantal leerlingen op de
      teldatum. De uitkomst wordt rekenkundig afgerond op een geheel getal. Indien de uitkomst negatief is, bedraagt het
      schoolgewicht nul.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel27
  - number: '27.3'
    text: |-
      Indien het schoolgewicht hoger is dan 80% van het aantal op de teldatum ingeschreven leerlingen van de basisschool,
      wordt het schoolgewicht vastgesteld op 80% van het aantal op de teldatum op de basisschool ingeschreven leerlingen.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel27
  - number: '27.4'
    text: |-
      Indien een basisschool bestaat uit een hoofdvestiging en een of meer nevenvestigingen, bestaat het schoolgewicht
      van de basisschool uit de som van de schoolgewichten die de afzonderlijke vestigingen zouden hebben, indien zij
      zelfstandige scholen zouden zijn.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel27
  - number: '28.1'
    text: |-
      Voor de aanvullende bekostiging voor personeelskosten voor de bestrijding van onderwijsachterstanden voor
      een basisschool wordt een basisbedrag per eenheid schoolgewicht toegekend, welk bedrag wordt verhoogd met een
      leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de school op 1
      oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel28
  - number: '28.2'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het eerste lid, en het leeftijdsbedrag, bedoeld in het eerste
      lid, bedraagt de formatie per eenheid schoolgewicht 0,0503 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel28
  - number: '28.3'
    text: |-
      Voor een speciale school voor basisonderwijs met een aantal leerlingen met een niet-Nederlandse culturele
      achtergrond op de teldatum boven het aantal van 4, wordt voor de bestrijding van onderwijsachterstanden per
      leerling boven het aantal van 4 een basisbedrag toegekend, welk bedrag wordt verhoogd met een leeftijdsbedrag
      dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de school op 1 oktober van het
      voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel28
  - number: '28.4'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het derde lid, en het leeftijdsbedrag, bedoeld in het derde lid,
      bedraagt de formatie per leerling 0,0401 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel28
  - number: '28.5'
    text: |-
      Voor de toepassing van het eerste en derde lid wordt voor het schooljaar waarin een nieuwe basisschool
      respectievelijk nieuwe speciale school voor basisonderwijs wordt geopend, het leeftijdsbedrag vermenigvuldigd met
      de geraamde landelijk gewogen gemiddelde leeftijd van de leraren van basisscholen respectievelijk van de leraren
      van speciale scholen voor basisonderwijs op 1 oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel28
  - number: 28a.1
    text: |-
      Bij ministeriële regeling kunnen voor een periode van telkens 4 schooljaren impulsgebieden worden aangewezen op
      basis van viercijferige postcodegebieden.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel28a
  - number: 28a.2
    text: |-
      De hoofdvestigingen en nevenvestigingen van basisscholen gelegen in de impulsgebieden, bedoeld in het eerste lid,
      komen voor de bestrijding van onderwijsachterstanden in aanmerking voor een bij ministeriële regeling vast te
      stellen bedrag per leerling voor wie op grond van [artikel 27, eerste lid][ref1], een gewicht is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel27
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '27'
        hoofdstuk: III
  - number: '29.1'
    text: |-
      Aan het bevoegd gezag van een basisschool wordt aanvullende bekostiging voor personeelskosten voor groei van het
      aantal leerlingen toegekend indien:
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
  - number: 29.1.a
    text: |-
      het aantal leerlingen op de eerste dag van een maand in een van de maanden augustus tot en met april van een
      schooljaar met ten minste 13 is toegenomen ten opzichte van 103% van het aantal leerlingen op de teldatum en
      vervolgens telkens indien het aantal leerlingen van die school op de eerste dag van enige maand in de periode
      van september tot en met april van een schooljaar met ten minste 13 is toegenomen ten opzichte van het aantal
      leerlingen op grond waarvan de laatste maal in dat schooljaar aanvullende bekostiging voor personeelskosten in
      verband met groei van het aantal leerlingen is toegekend; en
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
  - number: 29.1.b
    text: |-
      het bevoegd gezag van die school het aantal leerlingen binnen 4 weken op een daartoe bij ministeriële regeling
      vastgesteld formulier aan Onze Minister heeft gemeld.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
  - number: '29.2'
    text: |-
      Bij de berekening van 103% van het aantal leerlingen op de teldatum, bedoeld in het eerste lid, onderdeel a, wordt
      de uitkomst naar beneden afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
  - number: '29.3'
    text: |-
      De aanspraak op de aanvullende bekostiging, bedoeld in het eerste lid, ontstaat met ingang van de maand waarin de
      telling, bedoeld in het eerste lid, onderdeel a, heeft plaatsgevonden en wordt berekend voor het aantal leerlingen
      dat het verschil is tussen enerzijds het toegenomen totale aantal leerlingen en anderzijds 103% van het aantal
      leerlingen op de teldatum, onderscheidenlijk het aantal leerlingen op grond waarvan de laatste maal aanvullende
      bekostiging in verband met groei is toegekend.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
  - number: '29.4'
    text: |-
      De aanvullende bekostiging, bedoeld in het eerste lid, bedraagt een basisbedrag, welk bedrag wordt verhoogd met een
      leeftijdsbedrag dat wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van de leraren van
      basisscholen op 1 oktober van het voorafgaande schooljaar en vervolgens vermenigvuldigd met het aantal leerlingen,
      dat de uitkomst is van de berekening in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
  - number: '29.5'
    text: |-
      Het bedrag dat de uitkomst is van het vierde lid wordt vermenigvuldigd met het aantal maanden vanaf de maand van
      toekenning tot het einde van het schooljaar en vervolgens gedeeld door twaalf.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
  - number: '29.6'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het vierde lid, en het leeftijdsbedrag, bedoeld in het vierde
      lid, bedraagt de formatie per leerling 0,0487 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
  - number: '29.7'
    text: |-
      Indien op de dag voorafgaand aan de datum waarop de in het vierde lid bedoelde aanspraak ontstaat, de bekostiging
      voor personeelskosten, bedoeld in [artikel 120, eerste lid, van de wet][ref1], van de in het eerste lid bedoelde
      school is gebaseerd op een aantal leerlingen dat minder bedraagt dan 145 of minder bedraagt dan 148 indien reeds
      aanvullende bekostiging als bedoeld in het eerste lid is toegekend, wordt het in het derde lid bedoelde bedrag voor
      aanvullende bekostiging:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: 29.7.a
    text: |-
      indien het aantal leerlingen, bedoeld in het eerste lid, onderdeel a, minder bedraagt dan 148, verminderd met de
      uitkomst van de formule: [((LL – VL) * (Bv)) * Mt] / 12
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
  - number: 29.7.b
    text: |-
      indien het aantal leerlingen, bedoeld in het eerste lid, onder a, gelijk is aan of meer bedraagt dan 148,
      verminderd met de uitkomst van de formule: [((148 – VL) * (Bv)) * Mt] / 12
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
  - number: '29.8'
    text: |-
      Indien gedurende het schooljaar waarin de in het derde lid bedoelde aanspraak ontstaat, voor de school aanspraak
      bestaat op aanvullende bekostiging voor personeelskosten, bedoeld in [artikel 23][ref1], en de aanvullende
      bekostiging berekend overeenkomstig het derde, vierde, vijfde en zevende lid, groter is dan of gelijk is aan de
      toegekende aanvullende bekostiging voor personeelskosten, bedoeld in [artikel 23][ref2], wordt de aanvullende
      bekostiging berekend overeenkomstig het derde, vierde, vijfde en zevende lid, verminderd met de aanvullende
      bekostiging voor personeelskosten, bedoeld in [artikel 23][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0003862#Artikel23
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '23'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '23'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003862
        artikel: '23'
        hoofdstuk: III
  - number: '29.9'
    text: |-
      Indien gedurende het schooljaar waarin de in het derde lid bedoelde aanspraak ontstaat, voor de school aanspraak
      bestaat op aanvullende bekostiging voor personeelskosten, bedoeld in [artikel 23][ref1], en de aanvullende
      bekostiging berekend overeenkomstig het derde, vierde, vijfde en zevende lid, kleiner is dan de toegekende
      aanvullende bekostiging voor personeelskosten, bedoeld in [artikel 23][ref2], wordt de aanvullende bekostiging,
      berekend overeenkomstig het derde, vierde, vijfde en zevende lid, op nul gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel23
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '23'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '23'
        hoofdstuk: III
  - number: '29.10'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het zevende lid, en het leeftijdsbedrag, bedoeld in het zevende
      lid, bedraagt de formatie per leerling 0,0145 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel29
  - number: '30.1'
    text: |-
      Aan het bevoegd gezag van een basisschool wordt aanvullende bekostiging voor personeelskosten voor bijzondere groei
      toegekend, indien:
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel30
  - number: 30.1.a
    text: |-
      het aantal leerlingen van die school op 1 mei van een schooljaar met ten minste 26 is toegenomen ten opzichte van
      het aantal leerlingen op 1 april van dat schooljaar; of
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel30
  - number: 30.1.b
    text: |-
      het aantal leerlingen van die school op 1 juni van een schooljaar met ten minste 26 is toegenomen ten opzichte van
      het aantal leerlingen op 1 april van dat schooljaar en geen aanvullende bekostiging op grond van onderdeel a is
      toegekend; of
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel30
  - number: 30.1.c
    text: |-
      het aantal leerlingen van die school op 1 juni van een schooljaar met ten minste 26 is toegenomen ten opzichte van
      het aantal leerlingen op 1 mei van dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel30
  - number: '30.2'
    text: |-
      De aanvullende bekostiging, bedoeld in het eerste lid, wordt slechts toegekend indien het bevoegd gezag van die
      school het aantal leerlingen op grond waarvan het bevoegd gezag aanspraak maakt op de aanvullende bekostiging,
      bedoeld in het eerste lid, binnen 4 weken na de van toepassing zijnde peildatum, bedoeld in het eerste lid, op een
      daartoe bij ministeriële regeling vastgesteld formulier aan Onze Minister heeft gemeld.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel30
  - number: '30.3'
    text: |-
      De aanspraak op de aanvullende bekostiging, bedoeld in het eerste en tweede lid, ontstaat met ingang van de
      maand waarin de telling, bedoeld in het eerste lid, heeft plaatsgevonden en wordt berekend overeenkomstig
      [artikel 29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel29
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '29'
        hoofdstuk: III
  - number: '31.1'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 132, derde lid, van de wet][ref1], bedraagt de
      formatie per leerling 0,00237 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '132'
  - number: '31.2'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 132, vierde lid, van de wet][ref1], bedraagt de
      formatie per leerling 0,0654 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '132'
  - number: '32.1'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 124, eerste lid, van de wet][ref1], bedraagt de
      formatie per leerling 0,0452 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel124
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '124'
  - number: '32.2'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 124, tweede lid, van de wet][ref1], bedraagt de
      formatie per leerling 0,0646 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel124
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '124'
  - number: '33'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 125, tweede lid, van de wet][ref1], bedraagt
      de formatie per leerling voor elk schooljaar volgend op het schooljaar van de toelating van de leerling tot de
      speciale school voor basisonderwijs 0,0646 formatieplaats. Indien de toelating heeft plaatsgevonden in de periode
      van 2 oktober tot 1 augustus daaropvolgend bedraagt de formatie per leerling in het eerste schooljaar volgend op de
      toelating in afwijking van de eerste volzin 0,1098 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel125
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '125'
  - number: '34.1'
    text: |-
      Voor een op de basisschool of de speciale school voor basisonderwijs ingeschreven
      leerling die toelaatbaar is verklaard tot een van de onderwijssoorten, bedoeld in
      [artikel 2, vierde lid, onderdeel b of c, van de Wet op de expertisecentra][ref1] dan wel tot het cluster, bedoeld
      in [artikel 2, vierde lid, onderdeel d, van genoemde wet][ref2] wordt een budget toegekend dat bestaat uit de som
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 34.1.a
    text: |-
      een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de geraamde
      landelijk gewogen gemiddelde leeftijd van de leraren van basisscholen op 1 oktober van het voorafgaande schooljaar,
      en
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34
  - number: 34.1.b
    text: |-
      een her te besteden basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met
      de geraamde landelijk gewogen gemiddelde leeftijd van leraren in het speciaal onderwijs en het voortgezet speciaal
      onderwijs op 1 oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel34
  - number: '34.2'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het eerste lid, en het leeftijdsbedrag, bedoeld in het
      eerste lid, bedraagt de formatie de hoeveelheid die in onderstaande tabel is aangegeven bij de betreffende
      toelaatbaarheidsverklaring.







