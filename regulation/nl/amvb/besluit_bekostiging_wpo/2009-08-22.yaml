  - number: '2'
    text: |-
      Het bevoegd gezag van een school ten aanzien waarvan Onze Minister heeft meegedeeld dat de bekostiging een aanvang
      kan nemen of die ingevolge een beschikking van Onze Minister op grond van [artikel 84][ref1], [87][ref2] of
      [88 van de wet][ref3] zal worden bekostigd, zendt Onze Minister uiterlijk 3 maanden voor de datum van ingang van de
      bekostiging de benodigde administratieve gegevens en bescheiden voor de vaststelling van de bekostigingsbedragen.
      Bij ministeriële regeling worden voorschriften gegeven omtrent de gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel87
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel88
    url: https://wetten.overheid.nl/BWBR0003862/2009-08-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '84'
