  - number: '34.10'
    text: |-
      1 Indien het samenwerkingsverband, bedoeld in [artikel 1 van de wet][ref1], een of meer n orthopedagogisch-
      didactisch centra omvat, wordt dat vermeld in het ondersteuningsplan.

      2 Een leerling, die is of wordt ingeschreven bij een school, kan gedurende ten hoogste een half jaar het
      onderwijsprogramma of een gedeelte daarvan volgen bij een orthopedagogisch-didactisch centrum. De termijn, genoemd
      in de eerste volzin, kan in bijzondere gevallen eenmalig worden verlengd met ten hoogste een half jaar.

      3 Het onderwijs aan leerlingen die een programma volgen bij het orthopedagogisch-didactisch centrum wordt
      gegeven door leraren die voldoen aan de bevoegdheids- en bekwaamheidseisen zoals die zijn vastgesteld in de
      [artikelen 3][ref2] en [32a van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
