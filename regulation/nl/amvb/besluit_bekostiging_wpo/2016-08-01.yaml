        artikel: 10a
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '27'
        hoofdstuk: III
  - number: '34.4'
    text: |-
      Bij ministeriële regeling worden geregeld:

      a. de uitwerking van de wijze waarop de beoordeling van de leerresultaten, bedoeld in
      [artikel 10a, derde lid, van de wet][ref1] tot stand komt;

      b. voor zover van toepassing, de wijze waarop en omstandigheden waarin bij kleine scholen de leerresultaten worden
      gewogen;

      c. de wijze van correctie van de meting voor schoolkenmerken en individuele kenmerken van leerlingen;

      d. de normering waarop de inspectie het oordeel voldoende dan wel onvoldoende leerresultaat baseert.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003862/2016-08-01#Artikel34.4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
  - number: '34.5'
    text: |-
      1 De systematiek van de beoordeling van leerresultaten als bedoeld in [artikel 10a van de wet][ref1] wordt
      vastgesteld dan wel gewijzigd met inachtneming van de volgende procedure:

      a. gelet op recente ontwikkelingen, een eigen analyse en signalen van organisaties uit het onderwijsveld, beslist
      de inspecteur-generaal van het onderwijs of hij Onze Minister een voorstel doet voor wijziging in de systematiek
      van de beoordeling van leerresultaten als bedoeld in [artikel 10a van de wet][ref2];

      b. over het concept-voorstel overlegt de inspecteur-generaal van het onderwijs met de daarvoor in aanmerking
      komende organisaties uit het onderwijsveld;

      c. de inspecteur-generaal van het onderwijs legt het voorstel voor aan Onze Minister, onder vermelding van de
      wijze waarop in het voorstel rekening is gehouden met de reacties van de geraadpleegde organisaties uit het
      onderwijsveld;

      d. Onze Minister besluit naar aanleiding van het voorstel over wijziging van de systematiek van de beoordeling
      van leerresultaten of een daarvoor noodzakelijk voorstel van wet of ontwerp-algemene maatregel van bestuur wordt
      voorbereid.

      2 Wijzigingen in de vaststelling en correctie van meting alsmede in de normering als gevolg van actualisatie van
      toetsgegevens, worden vastgesteld op voorstel van de inspecteur-generaal van het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003862/2016-08-01#Artikel34.5
    references:
