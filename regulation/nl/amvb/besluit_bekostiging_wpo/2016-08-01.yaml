  - number: '34.8'
    text: |-
      De deskundigen, bedoeld in [artikel 18a, elfde lid, van de wet][ref1] zijn een orthopedagoog of een psycholoog en
      afhankelijk van de leerling over wiens toelaatbaarheid wordt geadviseerd ten minste een tweede deskundige, te weten
      een kinder- of jeugdpsycholoog, een pedagoog, een kinderpsychiater, een maatschappelijk werker of een arts.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003862/2016-08-01#Artikel34.8
