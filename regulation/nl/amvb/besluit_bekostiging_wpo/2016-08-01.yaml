  - number: '34.1'
    text: |-
      Bij de beoordeling van de leerresultaten, bedoeld in artikel [10a, derde lid, van de wet][ref1], hanteert
      de inspectie objectieve, relatieve normen. De grenzen die de inspectie als norm voor het oordeel voldoende
      dan wel onvoldoende resultaat hanteert, zijn gecorrigeerd voor schoolkenmerken en individuele kenmerken van
      leerlingen, met dien verstande dat deze correctie in elk geval betrekking heeft op leerlingen als bedoeld in
      [artikel 27, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel27
    url: https://wetten.overheid.nl/BWBR0003862/2016-08-01#Artikel34.1
    references:
