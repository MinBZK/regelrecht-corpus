    text: |-
      1 Onze Minister stelt jaarlijks uiterlijk op 15 april, de bekostigingsbedragen, bedoeld in
      [artikel 137, eerste en derde lid, van de wet][ref1] vast voor zover deze bedragen mede gebaseerd zijn op
      het aantal leerlingen op de teldatum, met dien verstande dat Onze Minister voor het bepalen van het aantal
      leerlingen op de teldatum, de leerlingen in aanmerking neemt van wie het persoonsgebonden nummer tezamen
      met de in [artikel 178a, tweede lid, van de wet][ref2] bedoelde gegevens uiterlijk op 1 december van het
      jaar voorafgaande aan het bekostigingsjaar zijn opgenomen in het basisregister onderwijs overeenkomstig
      [artikel 178b van de wet][ref3], dan wel de leerlingen van wie opgave is gedaan aan Onze Minister overeenkomstig
      artikel 36a, vierde lid. De bedragen hebben betrekking op een schooljaar.

      2 Onze Minister stelt de bekostigingsbedragen, bedoeld in [artikel 137, eerste lid, van de wet][ref4] voorzover
      het betreft de bekostiging, bedoeld in de [artikelen 29][ref5] en [30][ref6], vast binnen 14 weken na de voor de
      desbetreffende bekostiging relevante datum.

      3 Indien de verklaring van de accountant, bedoeld in [artikel 171, vierde lid, van de wet][ref7] aanleiding geeft
      tot wijziging van de bekostiging, bedoeld in het eerste of tweede lid, stelt Onze Minister voor 1 oktober de
      bekostiging voor dat jaar nader vast.

      4 De in het eerste en tweede lid bedoelde bekostigingsbedragen kunnen door Onze Minister worden gewijzigd wegens
      algemene salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende maatregelen.


