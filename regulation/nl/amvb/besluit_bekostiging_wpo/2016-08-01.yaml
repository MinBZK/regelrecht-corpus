  - number: 5a
    text: |-
      1 In geval van voortijdige beëindiging van een samenwerkingsovereenkomst wordt voor elk schooljaar dat
      een bijzondere school dan wel een openbare school op grond van de samenwerkingsovereenkomst, bedoeld in
      [artikel 157, derde lid, van de wet][ref1], in stand werd gehouden, door het Rijk een bedrag ingehouden op de
      bekostiging van de school.

      2 Het bedrag, bedoeld in het eerste lid, is de som van de bekostiging, bedoeld in [artikel 23][ref2],
      [artikel 24][ref3] en [artikel 26][ref4], in elk van die schooljaren.

      3 Voor elk schooljaar dat een bijzondere dan wel een openbare nevenvestiging op grond van de
      samenwerkingsovereenkomst, bedoeld in [artikel 157, derde lid, van de wet][ref5], in stand werd gehouden, wordt
      door het Rijk een bedrag ingehouden op de bekostiging van de nevenvestiging.

      4 Het bedrag, bedoeld in het derde lid, is de bekostiging, bedoeld in [artikel 25][ref6], in elk van die
      schooljaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
