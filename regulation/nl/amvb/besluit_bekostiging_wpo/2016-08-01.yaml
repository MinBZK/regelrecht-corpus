  - number: '22'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder:

      a. formatiebasisbedrag: een bij ministeriële regeling vast te stellen bedrag, dat niet afhankelijk is van de
      leeftijd van personeel van de school;

      b. formatieleeftijdsbedrag: een bij ministeriële regeling vast te stellen bedrag, dat vervolgens afhankelijk wordt
      gesteld van de leeftijd van personeel van de school;

      c. basisbedrag: een bij ministeriële regeling vast te stellen bedrag, dat wordt bepaald door de in het
      desbetreffende artikel genoemde formatie te vermenigvuldigen met het formatiebasisbedrag;

      d. leeftijdsbedrag: een bij ministeriële regeling vast te stellen bedrag, dat wordt bepaald door de in het
      desbetreffende artikel genoemde formatie te vermenigvuldigen met het formatieleeftijdsbedrag.
    url: https://wetten.overheid.nl/BWBR0003862/2016-08-01#Artikel22
  - number: '23'
    text: |-
      1 Indien de totale bekostiging voor personeelskosten berekend op grond van
      [artikel 120, eerste lid, van de wet][ref1] vermeerderd met de bekostiging, bedoeld in [artikel 26][ref2], en in
      voorkomende gevallen vermeerderd met de bekostiging, bedoeld in de [artikelen 24][ref3], [25][ref4] en [28][ref5],
      voor een basisschool minder bedraagt dan een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat
      wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de basisschool op 1 oktober van het
      voorafgaande schooljaar, wordt de bekostiging voor personeelskosten verhoogd tot het bedrag van laatstbedoelde
      uitkomst.

      2 Voor de berekening van het basisbedrag, bedoeld in het eerste lid, en het leeftijdsbedrag, bedoeld in het eerste
      lid, bedraagt de formatie 2,6927 formatieplaats.

      3 Voor de toepassing van het eerste lid wordt voor het schooljaar waarin een nieuwe basisschool wordt geopend,
      het leeftijdsbedrag vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van de leraren van
      basisscholen op 1 oktober van het voorafgaande schooljaar.


