        artikel: 10a
  - number: '34.6'
    text: |-
      Indien er geen of onvoldoende gegevens zijn voor een betrouwbaar oordeel over de meting van de leerresultaten,
      verricht de inspectie een aanvullend onderzoek, volgens bij ministeriële regeling te geven voorschriften. Het
      aanvullend onderzoek kan onder meer omvatten:

      a. het verkrijgen van nadere gegevens van de school over de resultaten en de doorstroom van leerlingen;

      b. onderzoek en verificatie ter plekke.
    url: https://wetten.overheid.nl/BWBR0003862/2016-08-01#Artikel34.6
  - number: '34.7'
    text: |-
      1 Het ontwikkelingsperspectief, bedoeld in [artikel 40a van de wet][ref1], bevat ten minste informatie over
      naar welke onderwijssoort in het voortgezet onderwijs dan wel welk uitstroomprofiel van het voortgezet speciaal
      onderwijs, bedoeld in [artikel 14, eerste lid, van de Wet op de expertisecentra][ref2], uitstroom van de leerling
      wordt verwacht, en de onderbouwing daarvan.

      2 De onderbouwing bevat ten minste een weergave van de belemmerende en bevorderende factoren die van invloed zijn
      op het onderwijs aan de leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40a
