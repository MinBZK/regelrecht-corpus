    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, drs. G. van Leijenhorst, van 11 juli 1985,
    nr. 6238/2313, centrale directie Wetgeving en Juridische Zaken;

    Gelet op artikel 51, tweede en derde lid, van de Wet op het basisonderwijs (Stb. 1984, 2) en op de artikelen E 29
    en E 32 van de Overgangswet WBO (Stb. 1984, 3);

    Gehoord de Onderwijsraad (advies van 5 december 1984, nr. O.R. III/100101 LO);

    Gehoord de Raad van State (advies van 20 september 1985, nr. W05.85.0373/11.5.39);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, drs. G. van Leijenhorst, van 14
    oktober 1985, nr. 6790/2313, centrale directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
