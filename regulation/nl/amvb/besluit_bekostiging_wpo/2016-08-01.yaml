articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      wet: [Wet op het primair onderwijs][ref1];

      basisschool: een school waar basisonderwijs wordt gegeven, niet zijnde een speciale school voor basisonderwijs;

      speciale school voor basisonderwijs: een school waar basisonderwijs wordt gegeven aan kinderen voor wie vaststaat
      dat overwegend een zodanige orthopedagogische en orthodidactische benadering aangewezen is, dat zij althans
      gedurende enige tijd op een speciale school voor basisonderwijs moeten worden opgevangen;

      samenwerkingsverband: een samenwerkingsverband als bedoeld in [artikel 1 van de wet][ref2];

      school: een basisschool of een speciale school voor basisonderwijs, tenzij het tegendeel blijkt;

      openbare school: door een of meer gemeenten, al dan niet te zamen met een of meer privaatrechtelijke rechtspersonen
      met volledige rechtsbevoegdheid in stand gehouden school;

      bijzondere school: door een privaatrechtelijke rechtspersoon in stand gehouden school;

      nevenvestiging: deel van een school, dat op de plaats waar het onderwijs wordt gegeven voordat het een deel van de
      school werd als zelfstandige school functioneerde;

      centrale dienst: centrale dienst als bedoeld in de [wet][ref3];

      bevoegd gezag van volgens de wet bekostigde scholen: voor wat betreft

      a. een openbare school: het college van burgemeester en wethouders, voor zover de raad niet anders bepaalt, en,
      indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen dan wel het krachtens een
      gemeenschappelijke regeling bevoegde orgaan;

      b. een bijzondere school: de rechtspersoon, bedoeld in [artikel 55 van de wet][ref4];

      ouders: ouders of voogden;

      teldatum: een van de data, bedoeld in [artikel 121, eerste en tweede lid, van de wet][ref5];

      leerling: een leerling die op grond van het [artikel 39 van de wet][ref6] tot een school is toegelaten;

      leerling met een niet-Nederlandse culturele achtergrond: leerling:

      a. die behoort tot de Molukse bevolkingsgroep,

      b. van wie ten minste een van de ouders of voogden afkomstig is uit Griekenland, Italië, het voormalige
      Joegoslavië, Kaapverdië, Marokko, Portugal, Spanje, Tunesië of Turkije,

      c. van wie ten minste een van de ouders of voogden afkomstig is uit Suriname, de voormalige Nederlandse Antillen
      of Aruba,

      d. van wie ten minste een van de ouders of voogden als vreemdeling rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder c of d, van de Vreemdelingenwet 2000][ref7],

      e. van wie ten minste een van de ouders of voogden afkomstig is uit een ander niet-Engelstalig land buiten Europa,
      echter met uitzondering van Indonesië;

      schooljaar: het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend;

      hoofdgebouw: het gebouw dat als zodanig is aangewezen ingevolge

      a. de Regeling huisvestingsnormen Overgangswet WBO,

      b. een besluit van Onze Minister ingevolge het overzicht, bedoeld in
      [artikel 69 van de Wet op het basisonderwijs][ref8],

      c. een besluit van Onze minister ingevolge de [artikelen 70][ref9] of [73 van de Wet op het basisonderwijs][ref10],
      of

      d. een besluit van Onze Minister naar aanleiding van een besluit van burgemeester en wethouders ingevolge
      [artikel 67, vierde lid][ref11], of [artikel 72, derde lid, van de Wet op het basisonderwijs][ref12],

      zoals deze regeling onderscheidenlijk deze wet luidden op 31 december 1996;

      accountant: een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref13];

      formatiebasisbedrag: het formatiebasisbedrag, bedoeld in [artikel 22, eerste lid, onderdeel a][ref14];

      formatieleeftijdsbedrag: het formatieleeftijdsbedrag, bedoeld in [artikel 22, eerste lid, onderdeel b][ref15];

      basisbedrag: het basisbedrag, bedoeld in [artikel 22, eerste lid, onderdeel c][ref16];

      leeftijdsbedrag: het leeftijdsbedrag, bedoeld in [artikel 22, eerste lid, onderdeel d][ref17].


