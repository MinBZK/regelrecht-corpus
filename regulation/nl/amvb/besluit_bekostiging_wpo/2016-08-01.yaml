  - number: '30'
    text: |-
      1 Aan het bevoegd gezag van één of meer basisscholen wordt aanvullende bekostiging voor personeelskosten voor
      bijzondere groei toegekend, indien:

      a. de som van de aantallen leerlingen op alle op 1 augustus van een schooljaar onder dat bevoegd gezag
      ressorterende basisscholen op 1 mei van dat schooljaar met ten minste 26 is toegenomen ten opzichte van de som van
      de bedoelde aantallen leerlingen op 1 april van dat schooljaar; of

      b. de som van de aantallen leerlingen op alle op 1 augustus van een schooljaar onder dat bevoegd gezag
      ressorterende basisscholen op 1 juni van dat schooljaar met ten minste 26 is toegenomen ten opzichte van de som
      van de bedoelde aantallen leerlingen op 1 april van dat schooljaar en geen aanvullende bekostiging op grond van
      onderdeel a is toegekend; of

      c. de som van de aantallen leerlingen op alle op 1 augustus van een schooljaar onder dat bevoegd gezag
      ressorterende basisscholen op 1 juni van dat schooljaar met ten minste 26 is toegenomen ten opzichte van de som van
      de bedoelde aantallen leerlingen op 1 mei van dat schooljaar.

      2 De aanvullende bekostiging, bedoeld in het eerste lid, wordt slechts toegekend indien van de leerlingen die
      op de van toepassing zijnde peildatum, bedoeld in het eerste lid, op de school of scholen staan ingeschreven,
      het persoonsgebonden nummer tezamen met de in [artikel 178a, tweede lid, van de wet][ref1] bedoelde
      gegevens uiterlijk vier weken na die peildatum zijn opgenomen in het basisregister onderwijs overeenkomstig
      [artikel 178b van de wet][ref2], dan wel van deze leerlingen opgave is gedaan aan Onze Minister overeenkomstig
      artikel 36a, vierde lid.

      3 De aanspraak op de aanvullende bekostiging, bedoeld in het eerste en tweede lid, ontstaat met ingang van de maand
      waarin de telling, bedoeld in het eerste lid, heeft plaatsgevonden en wordt berekend en toegekend overeenkomstig
      [artikel 29][ref3].


