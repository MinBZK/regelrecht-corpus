  - number: '4'
    text: |-
      Het bevoegd gezag geeft binnen twee weken na een besluit tot opheffing van de school of een nevenvestiging
      kennis daarvan aan Onze Minister, gedeputeerde staten, de inspecteur en, indien het een bijzondere school of
      een nevenvestiging daarvan betreft, eveneens aan burgemeester en wethouders van de gemeente waarin de school
      onderscheidenlijk de nevenvestiging is gelegen.
    url: https://wetten.overheid.nl/BWBR0003862/2016-08-01#Artikel4
  - number: '5'
    text: |-
      1 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 153, vierde lid, van de wet][ref1] worden de volgende gegevens overgelegd:

      a. naam, adres en het door het ministerie toegekende administratienummer van de desbetreffende school,

      b. het telefoonnummer van het bevoegd gezag,

      c. het feitelijk aantal leerlingen, niet zijnde leerlingen van een nevenvestiging, van de desbetreffende school op
      1 oktober van het schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%,

      d. het door het ministerie toegekende administratienummer van de school van dezelfde richting, dan wel indien
      het openbaar onderwijs betreft de school met openbaar onderwijs, met het dichtst bij het hoofdgebouw van de
      desbetreffende school, daaronder niet begrepen een nevenvestiging, gelegen hoofdgebouw,

      e. een plattegrond met een schaalverdeling waarop het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en het dichtstbijzijnde hoofdgebouw van de onder *d* bedoelde school zijn aangegeven
      en

      f. de afstand, hemelsbreed gemeten, tussen enerzijds het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en anderzijds het dichtstbijzijnde hoofdgebouw van de onder *d* bedoelde school.

      2 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 153, vijfde lid, van de wet][ref2] worden de volgende gegevens overgelegd:

      a. de in het eerste lid, onder a en b, genoemde gegevens,

      b. het door het ministerie toegekende administratienummer van de school met openbaar onderwijs, met het dichtst bij
      het hoofdgebouw van de desbetreffende school, daaronder niet begrepen een nevenvestiging, gelegen hoofdgebouw,

      c. een plattegrond met een schaalverdeling waarop zijn aangegeven:

      1°. het hoofdgebouw van de desbetreffende school, daaronder niet begrepen een nevenvestiging, en het
      dichtstbijzijnde hoofdgebouw van de onder b bedoelde school, en

      2°. de kortste route over de weg tussen enerzijds het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en anderzijds het dichtstbijzijnde hoofdgebouw van de onder *b* bedoelde school,

      d. de afstand in tienden van kilometers van de in onderdeel c2° bedoelde route en

      e. informatie waaruit blijkt dat aan het volgen van openbaar onderwijs behoefte bestaat.

      3 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, eerste lid, van de wet][ref3] worden de volgende gegevens overgelegd:

      a. de in het eerste lid, onder a en b, genoemde gegevens,

      b. het feitelijk aantal leerlingen van de desbetreffende school, daaronder begrepen leerlingen van een
      nevenvestiging, op 1 oktober van het schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%,

      c. naam, adres en het door het ministerie toegekende administratienummer van de overige scholen van het bevoegd
      gezag,

      d. het feitelijk aantal leerlingen, daaronder begrepen leerlingen van een nevenvestiging, van de overige scholen
      van het bevoegd gezag op 1 oktober van het schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%,

      e. de voor de scholen van het bevoegd gezag geldende opheffingsnorm.

      4 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, tweede lid, van de wet][ref4] worden de volgende gegevens overgelegd:

      a. de in het eerste lid, onder a en b, en derde lid, onder b tot en met d, genoemde gegevens, en

      b. de per school van het bevoegd gezag geldende opheffingsnorm.

      5 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, derde juncto het eerste lid][ref5], worden de volgende gegevens overgelegd:

      a. de in het eerste lid, onder a en b, en derde lid, onder b tot en met e, genoemde gegevens,

      b. een afschrift van de samenwerkingsovereenkomst, bedoeld in [artikel 157, derde lid, van de wet][ref6] die het
      bevoegd gezag het eerst heeft gesloten, en

      c. informatie waaruit blijkt dat aan de in [artikel 157, derde lid, onder a en b, van de wet][ref7] genoemde
      voorwaarden is voldaan.

      6 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, derde juncto het tweede lid][ref8], worden de volgende gegevens overgelegd:

      a. de in het eerste lid, onder a en b, derde lid, onder b tot en met d, vierde lid, onder b, en vijfde lid, onder b
      tot en met d, genoemde gegevens,

      b. het door het ministerie toegekende administratienummer van de school van dezelfde richting, dan wel indien
      het openbaar onderwijs betreft, de school met openbaar onderwijs, met het dichtst bij het hoofdgebouw van de
      desbetreffende school, daaronder niet begrepen een nevenvestiging, gelegen hoofdgebouw,

      c. een plattegrond met een schaalverdeling waarop het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en het dichtstbijzijnde hoofdgebouw van de onder *b* bedoelde school zijn aangegeven,
      en

      d. de afstand, hemelsbreed gemeten, tussen enerzijds het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en anderzijds het dichtstbijzijnde hoofdgebouw van de onder *b* bedoelde school.


