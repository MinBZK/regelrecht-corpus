  - number: 29a
    text: |-
      1 Indien aan een basisschool een afdeling internationaal georiënteerd basisonderwijs is verbonden, wordt
      op basis van een aanvraag van het bevoegd gezag aanvullende bekostiging voor personeelskosten, bedoeld in
      [artikel 120, derde lid, van de wet][ref1], toegekend, indien bij deze afdeling op 1 oktober van het voorafgaand
      schooljaar ten minste elf leerlingen staan ingeschreven.

      2 De aanvraag, bedoeld in het eerste lid, wordt voor 1 juli van het voorafgaand schooljaar door middel van een bij
      ministeriële regeling vastgesteld formulier ingediend.

      3 De aanvullende bekostiging, bedoeld in het eerste lid, bedraagt een basisbedrag, welk bedrag wordt verhoogd
      met een leeftijdsbedrag dat wordt vermenigvuldigd met de geraamde landelijke gewogen gemiddelde leeftijd van de
