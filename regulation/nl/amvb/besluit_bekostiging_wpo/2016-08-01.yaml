      1 Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de materiële voorzieningen ten behoeve
      van de instandhouding aan het bevoegd gezag van een school een twaalfde gedeelte van de vergoeding, bedoeld in
      [artikel 134, eerste lid, van de wet][ref1], waarop het over dat jaar recht heeft.

      2 Indien [artikel 12a, tweede lid][ref2], van toepassing is, wordt het verschil tussen de vergoeding, bedoeld
      in het eerste lid, berekend op grond van [artikel 134, zesde lid, van de wet][ref3] en de vergoeding berekend op
      grond van [artikel 134, vierde lid, van de wet][ref4], verstrekt in de maanden mei tot en met december van het
      uitkeringsjaar.

      3 Indien [artikel 12a, derde lid][ref5], van toepassing is, vindt verrekening plaats van de vergoeding, bedoeld
      in het eerste lid, met de vergoeding die wordt verstrekt in de maanden oktober tot en met december van het
      uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
