  - number: '34.11'
    text: |-
      1 Voor de toepassing van [artikel 15, eerste lid, van de wet][ref1] is vereist dat tussen het bevoegd gezag van een
      school en het bevoegd gezag van een andere school, een school voor speciaal onderwijs, een school voor speciaal en
      voortgezet speciaal onderwijs, dan wel een instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      de [Wet op de expertisecentra][ref2] een schriftelijke overeenkomst over de uitvoering daarvan wordt gesloten.

      2 De overeenkomst, bedoeld in het eerste lid, bevat in elk geval afspraken over:

      a. de termijn waarvoor de overeenkomst is aangegaan;

      b. de onderwijsactiviteiten die de leerling ontvangt op de school of instelling;

      c. het aantal lesuren per week per onderwijsactiviteit dat ten minste wordt aangeboden; en

      d. de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling.

      3 Een leerling kan gedurende een termijn van ten hoogste drie maanden aaneengesloten het volledige
      onderwijsprogramma volgen op een school of instelling als bedoeld in het eerste lid. De overeenkomst, bedoeld in
      het eerste lid, bevat dan in elk geval afspraken over:

      a. de termijn waarvoor de overeenkomst is aangegaan;

      b. de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling; en

      c. het bedrag voor de personele en materiële kosten dat het bevoegd gezag van de school waar de leerling is
      ingeschreven betaalt aan het bevoegd gezag van de school of instelling waarmee de overeenkomst wordt gesloten.

      4 Onderdeel c is niet van toepassing op een overeenkomst met een school waaraan onderwijs
      wordt gegeven aan leerlingen die zijn opgenomen in een inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref3] of een gesloten accommodatie als
      bedoeld in [artikel 1.1 van de Jeugdwet][ref4].

      5 Indien voor de toepassing van [artikel 15, eerste lid, van de wet][ref5], scholen of instellingen binnen
      hetzelfde bevoegd gezag zijn betrokken, maakt dit bevoegd gezag afspraken met deze betrokken scholen of
      instellingen over de onderdelen, genoemd in het tweede of derde lid.


