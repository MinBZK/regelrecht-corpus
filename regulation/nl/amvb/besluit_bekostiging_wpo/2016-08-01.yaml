  - number: '11'
    text: |-
      1 Met het oog op de vaststelling van de bekostiging, bedoeld in de [artikelen 12a, eerste lid][ref1], en
      [18, eerste lid][ref2], doet Onze Minister aan het bevoegd gezag jaarlijks een overzicht toekomen van de hem ter
      beschikking staande gegevens over het aantal leerlingen op de teldatum dat bij de vaststelling van de bekostiging
      in aanmerking wordt genomen. Het overzicht wordt gelijktijdig met het besluit tot vaststelling van de bekostiging,
      bedoeld in artikel 12a, eerste lid, toegezonden. Het overzicht is onderverdeeld in het aantal leerlingen in de
      leeftijd van 4 tot en met 7 jaar enerzijds en het aantal leerlingen in de leeftijd van 8 jaar en ouder anderzijds.
      Indien in het overzicht een nadere onderverdeling wordt gemaakt op grond van de volgende leden, wordt in die
      onderverdeling tevens melding gemaakt van de verdeling over de in de vorige volzin genoemde leeftijdscategorieën.

      2 Het overzicht, bedoeld in het eerste lid, voor basisscholen is onderverdeeld in de categorieën leerlingen,
      bedoeld in [artikel 27][ref3], en in de categorieën leerlingen met een niet-Nederlandse culturele achtergrond
      met uitzondering van leerlingen van wie ten minste een van de ouders of voogden afkomstig is uit Suriname, de
      voormalige Nederlandse Antillen of Aruba.

      3 Het overzicht, bedoeld in het eerste lid, voor speciale scholen voor basisonderwijs is onderverdeeld in
      leerlingen met een niet-Nederlandse culturele achtergrond en overige leerlingen.

      4 Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt het overzicht, bedoeld
      in het eerste lid, tevens onderverdeeld in de leerlingen van de hoofdvestiging en de leerlingen van elk van de
      nevenvestigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003862#Artikel27
