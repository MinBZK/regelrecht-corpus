  - number: '24'
    text: |-
      1 Een basisschool die op de teldatum minder dan 145 leerlingen had, ontvangt een toeslag voor kleine scholen.

      2 De in het eerste lid bedoelde toeslag bestaat uit het verschil tussen:

      a. een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen
      gemiddelde leeftijd van de leraren van de school op 1 oktober van het voorafgaande schooljaar; en

      b. een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen
      gemiddelde leeftijd van de leraren van de school op 1 oktober van het voorafgaande schooljaar en vervolgens
      vermenigvuldigd met het aantal leerlingen van de school op de teldatum.

      3 Voor de berekening van het basisbedrag, bedoeld in het tweede lid, onderdeel a, en het leeftijdsbedrag, bedoeld
      in het tweede lid, onderdeel a, bedraagt de formatie 2,1508 formatieplaats.

      4 Voor de berekening van het basisbedrag, bedoeld in het tweede lid, onderdeel b, en het leeftijdsbedrag, bedoeld
      in het tweede lid, onderdeel b, bedraagt de formatie per leerling 0,0149 formatieplaats.

      5 Voor de toepassing van het tweede lid wordt voor het schooljaar waarin een nieuwe basisschool is geopend,
      het leeftijdsbedrag vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van de leraren van
      basisscholen op 1 oktober van het voorafgaande schooljaar
    url: https://wetten.overheid.nl/BWBR0003862/2016-08-01#Artikel24
  - number: '25'
    text: |-
      Indien een basisschool bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt de bekostiging voor
      personeelskosten vermeerderd met drievierde van het verschil tussen:

      a. de som van de aanvullende bekostiging voor kleine scholen die de hoofdvestiging en de nevenvestigingen als
      zelfstandige scholen tezamen zouden ontvangen, berekend aan de hand van de gewogen gemiddelde leeftijd van de
      leraren van de gehele school op 1 oktober van het voorafgaande schooljaar, en

      b. de aanvullende bekostiging voor kleine scholen die de basisschool als school zonder nevenvestigingen zou
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0003862/2016-08-01#Artikel25
  - number: '26'
    text: |-
      1 De aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 120, derde lid, van de wet][ref1] bedraagt
      voor basisscholen met een aantal leerlingen op de teldatum dat niet hoger is dan 97 respectievelijk hoger is dan 97
      een bij ministeriële regeling vast te stellen bedrag.

      2 De aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 120, derde lid, van de wet][ref2] bedraagt
      voor speciale scholen voor basisonderwijs met een aantal leerlingen op de teldatum dat niet hoger is dan 99
      respectievelijk hoger is dan 99 een bij ministeriële regeling vast te stellen bedrag.


