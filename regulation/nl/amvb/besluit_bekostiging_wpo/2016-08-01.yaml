        artikel: 34a
        hoofdstuk: IV
  - number: 34c
    text: |-
      1 Voor de toepassing van [artikel 163a van de wet][ref1] wordt onder exploitatieoverschot verstaan:

      a. het bedrag van de bekostiging, bedoeld in de [artikelen 129][ref2], [134][ref3] en [137 van de wet][ref4]
      verminderd met de lasten over dat jaar voor zover deze als rechtmatig kunnen worden aangemerkt,

      b. de reserveringen voor zover afkomstig uit ’s Rijks kas, met inbegrip van de ontvangen rentebaten, en

      c. voor zover het een niet door een gemeente in stand gehouden school betreft, de niet bestede gedeelten van de
      uitkeringen op grond van de voorschriften inzake de gemeentelijke overschrijding.

      2 Het bevoegd gezag meldt het overeenkomstig het eerste lid berekende saldo, verdeeld naar de onderdelen a en
      b, respectievelijk c, van het eerste lid, tezamen met het jaarverslag over het laatste jaar waarin de school nog
      geheel of gedeeltelijk voor bekostiging in aanmerking kwam. De opgave gaat vergezeld van een verklaring van een
      accountant omtrent de juistheid van de opgave.

      3 Indien het exploitatieoverschot van een niet door een gemeente in stand gehouden school mede is opgebouwd
      uit uitkeringen als bedoeld in het eerste lid, onderdeel c, en geen onderscheid kan worden gemaakt met de baten
      respectievelijk de lasten, bedoeld in het eerste lid, onderdelen a en b, geldt als maatstaf voor de verdeling van
      eerstbedoeld deel van het exploitatieoverschot tussen Rijk en de desbetreffende gemeente de verhouding tussen het
      ontvangen bedrag aan bekostiging van het Rijk en het ontvangen bedrag aan uitkeringen, bedoeld in het eerste lid,
      onderdeel c, van de gemeente in een periode van vijf jaren voorafgaand aan het jaar van de beëindiging van de
      bekostiging. De verdeling behoeft de goedkeuring van Onze Minister.


