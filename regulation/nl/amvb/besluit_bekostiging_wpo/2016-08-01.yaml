  - number: '14'
    text: |-
      1 Het normatief bepaalde aantal te huisvesten groepen leerlingen van basisscholen, bedoeld in
      [artikel 134, vierde lid, onderdeel a, vijfde lid, onderdeel a, en zesde lid, onderdeel a, van de wet][ref1], wordt
      voor het jaar waarvoor de vergoeding voor de materiële voorzieningen ten behoeve van de instandhouding strekt,
      berekend volgens de volgende formule: het normatief bepaalde aantal te huisvesten groepen leerlingen = (A + B + C
      + D).

      2 De factoren A, B, C en D van de formule, bedoeld in het eerste lid, worden als volgt berekend:

      A = 0,05 x het aantal leerlingen in de leeftijd van 4 tot en met 7 jaar op de datum, bedoeld in het derde lid;

      B = 0,0343 x het aantal leerlingen in de leeftijd van 8 jaar en ouder op de datum, bedoeld in het derde lid;

      C = 1,5642 – (het aantal leerlingen op de datum, bedoeld in het derde lid, x 0,0115), met dien verstande dat C niet
      kleiner is dan nul;

      D = 0,0179 x het schoolgewicht, bedoeld in [artikel 27][ref2], waarbij als teldatum wordt aangemerkt de datum,
      bedoeld in het derde lid.

      3 De datum die dient als grondslag voor de vaststelling van het aantal leerlingen bij de berekening van de factoren
      A, B en C en als grondslag voor de vaststelling van het schoolgewicht bij de berekening van factor D, is:

      a. indien [artikel 134, vierde lid, van de wet][ref3] van toepassing is: 1 oktober van het jaar voorafgaande aan
      het jaar waarover de vergoeding plaatsvindt;

      b. indien [artikel 134, vijfde lid, van de wet][ref4] van toepassing is: 1 oktober in de periode waarover de
      vergoeding plaatsvindt;

      c. indien [artikel 134, zesde lid, van de wet][ref5] van toepassing is: 1 maart van het jaar waarover de vergoeding
      plaatsvindt, met dien verstande dat bij de berekening van de factoren A en B wordt uitgegaan van de leeftijd van
      de desbetreffende leerlingen op 1 oktober van het daaraan voorafgaande jaar, waarbij de leerlingen die op 1 oktober
      van dat jaar 3 jaar waren, worden meegeteld bij de berekening van factor A.

      4 Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt het eerste lid voor de
      hoofdvestiging en elke nevenvestiging afzonderlijk toegepast.

      5 Het normatief bepaalde aantal te huisvesten groepen leerlingen wordt rekenkundig afgerond op een geheel getal.

      6 Het bij algemene maatregel van bestuur vast te stellen aantal leerlingen, bedoeld in
      [artikel 134, zesde lid, van de wet][ref6], is 13.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
