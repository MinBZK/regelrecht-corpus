  - number: '2'
    text: |-
      Het bevoegd gezag van een school ten aanzien waarvan Onze Minister heeft meegedeeld dat de bekostiging een aanvang
      kan nemen of die ingevolge een beschikking van Onze Minister op grond van [artikel 84][ref1], [87][ref2] of
      [88 van de wet][ref3] zal worden bekostigd, zendt Onze Minister uiterlijk 3 maanden voor de datum van ingang van de
      bekostiging de benodigde administratieve gegevens en bescheiden voor de vaststelling van de bekostigingsbedragen.
      Bij ministeriële regeling worden voorschriften gegeven omtrent de gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel87
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel88
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '84'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '87'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '88'
  - number: '3.1'
    text: |-
      Teneinde overeenkomstig de bepalingen van dit besluit enige bekostiging van het Rijk te verkrijgen, moet het
      bevoegd gezag van een bijzondere school zijn aangesloten bij een organisatie van bevoegde gezagsorganen die
      rechtspersoon met volledige rechtsbevoegdheid is en die als zodanig door Onze Minister is erkend en zich te zijnen
      genoegen heeft borg gesteld voor terugbetaling van teveel ontvangen bedragen.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3
  - number: '3.2'
    text: |-
      De erkenning, bedoeld in het eerste lid, geschiedt op een daartoe door het bestuur der organisatie tot Onze
      Minister gericht verzoek waarbij moet worden overgelegd een opgave van elk bevoegd gezag waarvoor zekerheid
      wordt gesteld, vermeldende ten aanzien van elke school de gemeente waar de school is of, indien de school bestaat
      uit een hoofdvestiging en een of meer nevenvestigingen, de gemeente of gemeenten waar de hoofdvestiging en de
      nevenvestiging of nevenvestigingen zijn gelegen en de nadere plaatsaanduiding onderscheidenlijk plaatsaanduidingen
      binnen die gemeente of gemeenten, alsmede de naam van de rechtspersoon onder wiens bestuur de school staat.
      Wijzigingen die daarin worden aangebracht, deelt het bestuur der organisatie binnen twee weken mede aan Onze
      Minister. Deze wijzigingen ontheffen de organisaties niet van de voor het lopende jaar aangegane borgstelling ten
      behoeve van een aangesloten bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3
  - number: 3a.1
    text: |-
      De aanspraak op de verstrekking van bekostiging voor de personeelskosten, bedoeld in de [artikelen 129][ref1] en
      [137, eerste lid, van de wet][ref2], ontstaat met ingang van 1 augustus van het schooljaar waarin de bekostiging
      van een nieuw geopende school begint.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '137'
  - number: 3a.2
    text: |-
      De aanspraak op de bekostiging voor de uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding,
      bedoeld in [artikel 134, van de wet][ref1], ontstaat met ingang van 1 augustus van het schooljaar waarin de
      bekostiging van een nieuw geopende school begint.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: 3a.3
    text: |-
      In afwijking van het eerste lid, ontstaat aanspraak op bekostiging voor de uitgaven van 1 lid van het personeel
      op 1 juni voorafgaand aan het schooljaar waarin de bekostiging van een nieuw geopende school, bedoeld in
      [artikel 121, tweede lid, eerste volzin, van de wet][ref1] begint.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel121
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '121'
  - number: 3a.4
    text: 'De in het derde lid bedoelde bekostiging bestaat uit de som van:'
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3a
  - number: 3a.4.a
    text: |-
      een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de geraamde
      landelijk gewogen gemiddelde leeftijd van de leraren van basisscholen respectievelijk van de leraren van speciale
      scholen voor basisonderwijs op 1 oktober voorafgaand aan het schooljaar waarin de bekostiging van de nieuw geopende
      school begint; en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3a
  - number: 3a.4.b
    text: |-
      2/12 van de aanvullende bekostiging voor schoolleiding, bedoeld in [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel26
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '26'
        hoofdstuk: III
  - number: 3a.5
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het vierde lid, onderdeel a, en het leeftijdsbedrag, bedoeld in
      het vierde lid, onderdeel a, bedraagt de formatie 2/12 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3a
  - number: 3a.6
    text: |-
      Onverminderd het derde lid, heeft een school die op de teldatum geen leerlingen heeft geen aanspraak op
      bekostiging.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3a
  - number: 3a.7
    text: |-
      Indien een school op 1 oktober van het schooljaar waarin de bekostiging van een nieuw geopende school begint geen
      leerlingen heeft, ontstaat in afwijking van het zesde lid, aanspraak op bekostiging voor de personeelskosten,
      bedoeld in de [artikelen 129][ref1] en [137, eerste lid, van de wet][ref2], met ingang van de eerste dag van de
      maand waarin de school een leerling heeft. Indien de eerste volzin van toepassing is, wordt de bekostiging voor het
      lopende schooljaar en het daaropvolgende schooljaar gebaseerd op het aantal leerlingen dat de school heeft op de
      eerste dag van de tweede maand volgend op de dag waarop de school de eerste leerling heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '137'
  - number: 3b.1
    text: |-
      Aan het bevoegd gezag van een nieuw geopende school wordt, in afwachting van de vaststelling van de bekostiging
      voor personeelskosten en de bekostiging voor de uitgaven voor de materiële voorzieningen ten behoeve van de
      instandhouding op basis van de gegevens op de teldatum, een voorschot op de bedoelde bekostiging verstrekt indien
      het bevoegd gezag uiterlijk op 1 juli voorafgaande aan het schooljaar waarin de bekostiging van een nieuw geopende
      school begint, het vermoedelijk aantal leerlingen op 1 oktober volgend op de datum van ingang van de bekostiging
      aan Onze Minister meldt.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3b
  - number: 3b.2
    text: 'Het voorschot, bedoeld in het eerste lid, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3b
  - number: 3b.2.a
    text: |-
      de bekostiging, bedoeld in [artikel 137, eerste lid, van de wet][ref1], berekend overeenkomstig dit besluit, met
      dien verstande dat wordt gerekend met het aantal leerlingen, bedoeld in het eerste lid; en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
  - number: 3b.2.b
    text: |-
      de bekostiging, bedoeld in [artikel 134 van de wet][ref1], berekend overeenkomstig dit besluit, met dien verstande
      dat wordt gerekend met het aantal leerlingen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: 3b.3
    text: |-
      Op de betaling van het voorschot zijn [artikel 13][ref1] en [artikel 19][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel19
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '19'
        hoofdstuk: III
  - number: 3b.4
    text: |-
      Onze Minister is bevoegd tot verrekening van verstrekte voorschotten met de betalingen die voortvloeien uit de
      vaststelling van de onderscheiden onderdelen van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3b
  - number: 3b.5
    text: |-
      Indien Onze Minister een voorschot verleent in gevallen waarin de bekostiging wegens niet aan het bevoegd gezag van
      een school toe te rekenen omstandigheden niet tijdig kan worden vastgesteld, zijn het derde en het vierde lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel3b
  - number: '4'
    text: |-
      Het bevoegd gezag geeft binnen twee weken na een besluit tot opheffing van de school of een nevenvestiging
      kennis daarvan aan Onze Minister, gedeputeerde staten, de inspecteur en, indien het een bijzondere school of
      een nevenvestiging daarvan betreft, eveneens aan burgemeester en wethouders van de gemeente waarin de school
      onderscheidenlijk de nevenvestiging is gelegen.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel4
  - number: '5.1'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 153, vierde lid, van de wet][ref1] worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
  - number: 5.1.a
    text: naam, adres en het door het ministerie toegekende administratienummer van de desbetreffende school,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.1.b
    text: het telefoonnummer van het bevoegd gezag,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.1.c
    text: |-
      het feitelijk aantal leerlingen, niet zijnde leerlingen van een nevenvestiging, van de desbetreffende school op 1
      oktober van het schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.1.d
    text: |-
      het door het ministerie toegekende administratienummer van de school van dezelfde richting, dan wel indien
      het openbaar onderwijs betreft de school met openbaar onderwijs, met het dichtst bij het hoofdgebouw van de
      desbetreffende school, daaronder niet begrepen een nevenvestiging, gelegen hoofdgebouw,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.1.e
    text: |-
      een plattegrond met een schaalverdeling waarop het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en het dichtstbijzijnde hoofdgebouw van de onder *d* bedoelde school zijn aangegeven
      en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.1.f
    text: |-
      de afstand, hemelsbreed gemeten, tussen enerzijds het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en anderzijds het dichtstbijzijnde hoofdgebouw van de onder *d* bedoelde school.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: '5.2'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 153, vijfde lid, van de wet][ref1] worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
  - number: 5.2.a
    text: de in het eerste lid, onder a en b, genoemde gegevens,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.2.b
    text: |-
      het door het ministerie toegekende administratienummer van de school met openbaar onderwijs, met het dichtst bij
      het hoofdgebouw van de desbetreffende school, daaronder niet begrepen een nevenvestiging, gelegen hoofdgebouw,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.2.c
    text: 'een plattegrond met een schaalverdeling waarop zijn aangegeven:'
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.2.c.1°
    text: |-
      het hoofdgebouw van de desbetreffende school, daaronder niet begrepen een nevenvestiging, en het dichtstbijzijnde
      hoofdgebouw van de onder b bedoelde school, en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.2.c.2°
    text: |-
      de kortste route over de weg tussen enerzijds het hoofdgebouw van de desbetreffende school, daaronder niet begrepen
      een nevenvestiging, en anderzijds het dichtstbijzijnde hoofdgebouw van de onder *b* bedoelde school,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.2.d
    text: de afstand in tienden van kilometers van de in onderdeel c2° bedoelde route en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.2.e
    text: informatie waaruit blijkt dat aan het volgen van openbaar onderwijs behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: '5.3'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, eerste lid, van de wet][ref1] worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5.3.a
    text: de in het eerste lid, onder a en b, genoemde gegevens,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.3.b
    text: |-
      het feitelijk aantal leerlingen van de desbetreffende school, daaronder begrepen leerlingen van een nevenvestiging,
      op 1 oktober van het schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.3.c
    text: naam, adres en het door het ministerie toegekende administratienummer van de overige scholen van het bevoegd gezag,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.3.d
    text: |-
      het feitelijk aantal leerlingen, daaronder begrepen leerlingen van een nevenvestiging, van de overige scholen van
      het bevoegd gezag op 1 oktober van het schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.3.e
    text: de voor de scholen van het bevoegd gezag geldende opheffingsnorm.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: '5.4'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, tweede lid, van de wet][ref1] worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5.4.a
    text: de in het eerste lid, onder a en b, en derde lid, onder b tot en met d, genoemde gegevens, en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.4.b
    text: de per school van het bevoegd gezag geldende opheffingsnorm.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: '5.5'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, derde juncto het eerste lid][ref1], worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5.5.a
    text: de in het eerste lid, onder a en b, en derde lid, onder b tot en met e, genoemde gegevens,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.5.b
    text: |-
      een afschrift van de samenwerkingsovereenkomst, bedoeld in [artikel 157, derde lid, van de wet][ref1] die het
      bevoegd gezag het eerst heeft gesloten, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5.5.c
    text: |-
      informatie waaruit blijkt dat aan de in [artikel 157, derde lid, onder a en b, van de wet][ref1] genoemde
      voorwaarden is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: '5.6'
    text: |-
      Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 157, derde juncto het tweede lid][ref1], worden de volgende gegevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5.6.a
    text: |-
      de in het eerste lid, onder a en b, derde lid, onder b tot en met d, vierde lid, onder b, en vijfde lid, onder b
      tot en met d, genoemde gegevens,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.6.b
    text: |-
      het door het ministerie toegekende administratienummer van de school van dezelfde richting, dan wel indien
      het openbaar onderwijs betreft, de school met openbaar onderwijs, met het dichtst bij het hoofdgebouw van de
      desbetreffende school, daaronder niet begrepen een nevenvestiging, gelegen hoofdgebouw,
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.6.c
    text: |-
      een plattegrond met een schaalverdeling waarop het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en het dichtstbijzijnde hoofdgebouw van de onder *b* bedoelde school zijn aangegeven,
      en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5.6.d
    text: |-
      de afstand, hemelsbreed gemeten, tussen enerzijds het hoofdgebouw van de desbetreffende school, daaronder niet
      begrepen een nevenvestiging, en anderzijds het dichtstbijzijnde hoofdgebouw van de onder *b* bedoelde school.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5
  - number: 5a.1
    text: |-
      In geval van voortijdige beëindiging van een samenwerkingsovereenkomst wordt voor elk schooljaar dat
      een bijzondere school dan wel een openbare school op grond van de samenwerkingsovereenkomst, bedoeld in
      [artikel 157, derde lid, van de wet][ref1], in stand werd gehouden, door het Rijk een bedrag ingehouden op de
      bekostiging van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5a.2
    text: |-
      Het bedrag, bedoeld in het eerste lid, is de som van de bekostiging, bedoeld in [artikel 23][ref1],
      [artikel 24][ref2] en [artikel 26][ref3], in elk van die schooljaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0003862#Artikel26
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '23'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '24'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003862
        artikel: '26'
        hoofdstuk: III
  - number: 5a.3
    text: |-
      Voor elk schooljaar dat een bijzondere dan wel een openbare nevenvestiging op grond van de
      samenwerkingsovereenkomst, bedoeld in [artikel 157, derde lid, van de wet][ref1], in stand werd gehouden, wordt
      door het Rijk een bedrag ingehouden op de bekostiging van de nevenvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
  - number: 5a.4
    text: |-
      Het bedrag, bedoeld in het derde lid, is de bekostiging, bedoeld in [artikel 25][ref1], in elk van die schooljaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel25
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '25'
        hoofdstuk: III
  - number: '6.1'
    text: |-
      De directeur van een school draagt er zorg voor dat een overzichtelijke administratie van de inschrijving,
      de uitschrijving en het verzuim van de leerlingen op de school beschikbaar is alsmede van de gegevens van de
      leerlingen en hun ouders die noodzakelijk zijn voor de berekening van de bekostiging voor personeelskosten.
      Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen wordt in deze administratie een
      onderverdeling gemaakt naar leerlingen van de hoofdvestiging en leerlingen van elk van de nevenvestigingen en
      draagt de directeur er zorg voor dat de volledige administratie op de hoofdvestiging aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel6
  - number: '6.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de wijze waarop de leerlingenadministratie
      wordt ingericht.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel6
  - number: '7.1'
    text: |-
      De directeur van een school schrijft een leerling slechts in na een beslissing van het bevoegd gezag
      tot toelating van de leerling, of indien de leerling tijdelijk op de school wordt geplaatst op grond van
      [artikel 40, zevende lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '40'
  - number: '7.2'
    text: De directeur schrijft de leerling in met ingang van de dag waarop de leerling de school voor het eerst bezoekt.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van het tweede lid, schrijft de directeur de leerling die de school voor het eerst bezoekt op de
      eerste schooldag van het schooljaar, in met ingang van 1 augustus van dat schooljaar, behoudens wanneer de leerling
      op 1 augustus de leeftijd van 4 jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel7
  - number: '8.1'
    text: |-
      De directeur van een school op wiens school de leerling staat ingeschreven, schrijft de leerling, indien deze de
      school verlaat, uit met ingang van de dag waarop de leerling de school voor het laatst heeft bezocht. De directeur
      schrijft de leerling die wordt uitgeschreven na de school op de laatste schooldag van het schooljaar te hebben
      bezocht, uit met ingang van 31 juli van dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel8
  - number: '8.2'
    text: |-
      Indien de directeur van een school op wiens school de leerling stond ingeschreven binnen 4 weken na de dag
      waarop de leerling de school voor het laatst heeft bezocht uit het register onderwijsdeelnemers, bedoeld in de
      [Wet register onderwijsdeelnemers][ref1], een melding ontvangt van de inschrijving van de leerling op een andere
      school of een school of instelling voor ander onderwijs, wijzigt de directeur de datum van uitschrijving, bedoeld
      in het eerste lid, alsnog in de datum van de dag voorafgaande aan de inschrijving op die andere school of die
      school of instelling voor ander onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0042012
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0042012
  - number: '9.1'
    text: |-
      De gegevens die in de leerlingenadministratie zijn opgenomen, blijven daarvan in ieder geval deel uitmaken
      gedurende 5 jaar nadat de desbetreffende leerling van de school is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel9
  - number: '9.2'
    text: |-
      De gegevens die noodzakelijk zijn voor de berekening van de bekostiging voor personeelskosten, worden binnen acht
      weken na het verstrijken van de termijn, genoemd in het eerste lid, vernietigd.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel9
  - number: '10.1'
    text: |-
      Voor de toepassing van de wet worden, onverminderd [artikel 8][ref1], de leerlingen op een school meegeteld die op
      de teldatum op die school staan ingeschreven tenzij zij vanaf het begin van het schooljaar tot de teldatum meer dan
      de helft van het aantal schooldagen zonder geldige reden hebben verzuimd.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel8
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '8'
        hoofdstuk: I
        afdeling: '1'
  - number: '10.2'
    text: |-
      Voor de toepassing van het eerste lid wordt ten aanzien van de leerplichtige leerling als geldige reden aangemerkt
      een vrijstelling van geregeld schoolbezoek als bedoeld in de [Leerplichtwet 1969][ref1] (*Stb.* 1971, 406). Ten
      aanzien van de niet-leerplichtige leerling worden als geldige reden aangemerkt dezelfde gronden als die welke
      leiden tot een vrijstelling als bedoeld in de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: '10.3'
    text: |-
      Indien de teldatum valt op een dag waarop geen onderwijs wordt gegeven, worden op de eerstvolgende schooldag de
      leerlingen geteld, die op de teldatum stonden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel10
  - number: '10.4'
    text: Een leerling kan slechts op 1 school voor de bekostiging meetellen.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel10
  - number: '11.1'
    text: |-
      Met het oog op de vaststelling van de bekostiging, bedoeld in de [artikelen 12a, eerste lid][ref1], en
      [18, eerste lid][ref2], doet Onze Minister aan het bevoegd gezag jaarlijks een overzicht toekomen van de hem ter
      beschikking staande gegevens over het aantal leerlingen op de teldatum dat bij de vaststelling van de bekostiging
      in aanmerking wordt genomen. Het overzicht wordt gelijktijdig met het besluit tot vaststelling van de bekostiging,
      bedoeld in artikel 12a, eerste lid, toegezonden. Het overzicht is onderverdeeld in het aantal leerlingen in de
      leeftijd van 4 tot en met 7 jaar enerzijds en het aantal leerlingen in de leeftijd van 8 jaar en ouder anderzijds.
      Indien in het overzicht een nadere onderverdeling wordt gemaakt op grond van de volgende leden, wordt in die
      onderverdeling tevens melding gemaakt van de verdeling over de in de vorige volzin genoemde leeftijdscategorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel18
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: 12a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '18'
        hoofdstuk: III
  - number: '11.2'
    text: |-
      Het overzicht, bedoeld in het eerste lid, voor basisscholen is onderverdeeld in leerlingen met een niet-Nederlandse
      culturele achtergrond met uitzondering van leerlingen van wie ten minste een van de ouders of voogden afkomstig is
      uit Suriname, de voormalige Nederlandse Antillen of Aruba en overige leerlingen.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel11
  - number: '11.3'
    text: |-
      Het overzicht, bedoeld in het eerste lid, voor speciale scholen voor basisonderwijs is onderverdeeld in leerlingen
      met een niet-Nederlandse culturele achtergrond en overige leerlingen.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel11
  - number: '11.4'
    text: |-
      Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt het overzicht, bedoeld
      in het eerste lid, tevens onderverdeeld in de leerlingen van de hoofdvestiging en de leerlingen van elk van de
      nevenvestigingen.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel11
  - number: 11a.1
    text: |-
      Het bevoegd gezag van een school doet jaarlijks voor 1 december aan Onze Minister mededeling van de gewogen
      gemiddelde leeftijd van de leraren van die school op 1 oktober daaraan voorafgaand.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel11a
  - number: 11a.2
    text: Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel11a
  - number: 11b
    text: |-
      Het bevoegd gezag verstrekt gelijktijdig met de verklaring, bedoeld in [artikel 171, vierde lid, van de wet][ref1],
      een verklaring omtrent de juistheid en tijdige aanmelding van de gegevens waarop de bekostigingsbedragen zijn of
      worden gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
  - number: 12a.1
    text: |-
      Onze Minister stelt jaarlijks voor 1 februari de bekostiging voor dat jaar voor basisscholen en speciale
      scholen voor basisonderwijs vast, gebaseerd op de grondslag bedoeld in de [artikelen 134, vierde lid][ref1],
      onderscheidenlijk [115 van de wet][ref2], met dien verstande dat Onze Minister voor het bepalen van
      het aantal leerlingen op 1 oktober van het jaar voorafgaande aan het bekostigingsjaar, de leerlingen
      in aanmerking neemt van wie het persoonsgebonden nummer tezamen met de basisgegevens, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet register onderwijsdeelnemers][ref3] uiterlijk op
      de daarop volgende 1 december zijn opgenomen in het register onderwijsdeelnemers overeenkomstig
      [artikel 14 van de Wet register onderwijsdeelnemers][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0042012#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0042012#Artikel14
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '115'
      - id: ref3
        bwb_id: BWBR0042012
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0042012
        artikel: '14'
  - number: 12a.2
    text: |-
      Indien [artikel 134, achtste lid, van de wet][ref1] van toepassing is en indien van de leerlingen die op 1
      maart van het bekostigingsjaar op de school staan ingeschreven het persoonsgebonden nummer tezamen met de
      basisgegevens, bedoeld in [artikel 8, eerste lid, onderdeel b, van de Wet register onderwijsdeelnemers][ref2]
      uiterlijk op 1 april van dat jaar zijn opgenomen in het register onderwijsdeelnemers overeenkomstig
      [artikel 14 van de Wet register onderwijsdeelnemers][ref3], stelt Onze Minister voor 1 mei de bekostiging, bedoeld
      in het eerste lid, voor dat jaar nader vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0042012#Artikel14
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
      - id: ref2
        bwb_id: BWBR0042012
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0042012
        artikel: '14'
  - number: 12a.3
    text: |-
      Indien de verklaring van de accountant, bedoeld in [artikel 171, vierde lid, van de wet][ref1], aanleiding geeft
      tot wijziging van de bekostiging, bedoeld in het eerste of tweede lid, stelt Onze Minister voor 1 oktober de
      bekostiging voor dat jaar nader vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
  - number: '13.1'
    text: |-
      Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de materiële voorzieningen ten behoeve
      van de instandhouding aan het bevoegd gezag van een school een twaalfde gedeelte van de vergoeding, bedoeld in
      [artikel 134, eerste lid, van de wet][ref1], waarop het over dat jaar recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: '13.2'
    text: |-
      Indien [artikel 12a, tweede lid][ref1], van toepassing is, wordt het verschil tussen de vergoeding, bedoeld in
      het eerste lid, berekend op grond van [artikel 134, achtste lid, van de wet][ref2] en de vergoeding berekend op
      grond van [artikel 134, vierde lid, van de wet][ref3], verstrekt in de maanden mei tot en met december van het
      uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel134
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: 12a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '134'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '134'
  - number: '13.3'
    text: |-
      Indien [artikel 12a, derde lid][ref1], van toepassing is, vindt verrekening plaats van de vergoeding, bedoeld
      in het eerste lid, met de vergoeding die wordt verstrekt in de maanden oktober tot en met december van het
      uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel12a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: 12a
        hoofdstuk: II
  - number: '14.1'
    text: |-
      Het normatief bepaalde aantal te huisvesten groepen leerlingen van basisscholen, bedoeld in
      [artikel 134, vierde lid, onderdeel a, vijfde lid, onderdeel a, en achtste lid, onderdeel a, van de wet][ref1],
      wordt voor het jaar waarvoor de vergoeding voor de materiële voorzieningen ten behoeve van de instandhouding
      strekt, berekend volgens de volgende formule: het normatief bepaalde aantal te huisvesten groepen leerlingen = (A +
      B + C).


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: '14.2'
    text: |-
      De factoren A, B en C van de formule, bedoeld in het eerste lid, worden als volgt berekend: A = 0,05 x het aantal
      leerlingen in de leeftijd van 4 tot en met 7 jaar op de datum, bedoeld in het derde lid; B = 0,0343 x het aantal
      leerlingen in de leeftijd van 8 jaar en ouder op de datum, bedoeld in het derde lid; C = 1,5642 – (het aantal
      leerlingen op de datum, bedoeld in het derde lid, x 0,0115), met dien verstande dat C niet kleiner is dan nul.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel14
  - number: '14.3'
    text: |-
      De datum die dient als grondslag voor de vaststelling van het aantal leerlingen bij de berekening van de factoren
      A, B en C is:
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel14
  - number: 14.3.a
    text: |-
      indien [artikel 134, vierde lid, van de wet][ref1] van toepassing is: 1 oktober van het jaar voorafgaande aan het
      jaar waarover de vergoeding plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: 14.3.b
    text: |-
      indien [artikel 134, vijfde lid, van de wet][ref1] van toepassing is: 1 oktober in de periode waarover de
      vergoeding plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: 14.3.c
    text: |-
      indien [artikel 134, achtste lid, van de wet][ref1] van toepassing is: 1 maart van het jaar waarover de vergoeding
      plaatsvindt, met dien verstande dat bij de berekening van de factoren A en B wordt uitgegaan van de leeftijd van
      de desbetreffende leerlingen op 1 oktober van het daaraan voorafgaande jaar, waarbij de leerlingen die op 1 oktober
      van dat jaar 3 jaar waren, worden meegeteld bij de berekening van factor A.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: '14.4'
    text: |-
      Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt het eerste lid voor de
      hoofdvestiging en elke nevenvestiging afzonderlijk toegepast.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel14
  - number: '14.5'
    text: Het normatief bepaalde aantal te huisvesten groepen leerlingen wordt rekenkundig afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel14
  - number: '14.6'
    text: |-
      Het bij algemene maatregel van bestuur vast te stellen aantal leerlingen, bedoeld in
      [artikel 134, achtste lid, van de wet][ref1], is 13.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: '16'
    text: |-
      De uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding voor schoolgebouwen hebben betrekking
      op de programma’s van eisen, bedoeld in [artikel 114, eerste lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
  - number: 16a
    text: |-
      Het aantal leerlingen, bedoeld in [artikel 134, zevende lid, van de wet][ref1] is tien.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
  - number: '17'
    text: |-
      De vergoeding voor de materiële voorzieningen ten behoeve van de instandhouding wordt bepaald volgens de
      programma’s van eisen, bedoeld in [artikel 113, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
  - number: '18.1'
    text: |-
      Onze Minister stelt jaarlijks uiterlijk op 15 april, de bekostigingsbedragen, bedoeld in
      [artikel 137, eerste en derde lid, van de wet][ref1] vast voor zover deze bedragen mede gebaseerd zijn op het
      aantal leerlingen op de teldatum, met dien verstande dat Onze Minister voor het bepalen van het aantal leerlingen
      op de teldatum, de leerlingen in aanmerking neemt van wie het persoonsgebonden nummer tezamen met de basisgegevens,
      bedoeld in [artikel 8, eerste lid, onderdeel b, van de Wet register onderwijsdeelnemers][ref2] uiterlijk op
      1 december van het jaar voorafgaande aan het bekostigingsjaar zijn opgenomen in het register onderwijsdeelnemers
      overeenkomstig [artikel 14 van de Wet register onderwijsdeelnemers][ref3]. De bedragen hebben betrekking op een
      schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0042012#Artikel14
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
      - id: ref2
        bwb_id: BWBR0042012
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0042012
        artikel: '14'
  - number: '18.2'
    text: |-
      Onze Minister stelt de bekostigingsbedragen, bedoeld in [artikel 137, eerste lid, van de wet][ref1] voorzover
      het betreft de bekostiging, bedoeld in de [artikelen 29][ref2] en [30][ref3], vast binnen 14 weken na de voor de
      desbetreffende bekostiging relevante datum.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0003862#Artikel30
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '29'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003862
        artikel: '30'
        hoofdstuk: III
  - number: '18.3'
    text: |-
      Indien de verklaring van de accountant, bedoeld in [artikel 171, vierde lid, van de wet][ref1] aanleiding geeft
      tot wijziging van de bekostiging, bedoeld in het eerste of tweede lid, stelt Onze Minister voor 1 oktober de
      bekostiging voor dat jaar nader vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
  - number: '18.4'
    text: |-
      De in het eerste en tweede lid bedoelde bekostigingsbedragen kunnen door Onze Minister worden gewijzigd wegens
      algemene salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel18
  - number: '19.1'
    text: |-
      De betaling van de bekostigingsbedragen voor personeelskosten, bedoeld in de [artikelen 129][ref1] en
      [137 eerste lid, van de wet][ref2] vindt maandelijks plaats in een bij ministeriële regeling vast te stellen
      betaalritme dat voor basisscholen en speciale scholen voor basisonderwijs alsmede voor de verschillende onderdelen
      van de bekostiging verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '137'
  - number: '19.2'
    text: |-
      De betaling van de bekostiging voor personeelskosten, bedoeld in [artikel 137, tweede lid, van de wet][ref1] vindt,
      tenzij bij beschikking anders wordt bepaald, plaats in een aantal gelijke maandelijkse termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
  - number: '19.3'
    text: |-
      De betaling van de bekostiging voor personeelskosten, bedoeld in [artikel 137, derde lid, van de wet][ref1] vindt
      plaats in twaalf gelijke maandelijkse termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
  - number: 19a
    text: |-
      Het aantal leerlingen, bedoeld in [artikel 121, vijfde lid, van de wet][ref1] is tien.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel121
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '121'
  - number: '20.1'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 120, tweede lid, onderdeel a, van de wet][ref1]
      bedraagt de formatie per leerling 0,0595 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '20.2'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 120, tweede lid, onderdeel b, van de wet][ref1]
      bedraagt de formatie per leerling 0,0414 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '20.3'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 120, tweede lid, onderdeel c, van de wet][ref1]
      bedraagt de formatie per leerling 0,0452 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '21'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 120, vierde lid, van de wet][ref1] bedraagt de
      formatie per leerling 0,0646 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '22'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel22
  - number: 22.a
    text: |-
      formatiebasisbedrag: een bij ministeriële regeling vast te stellen bedrag, dat niet afhankelijk is van de leeftijd
      van personeel van de school;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel22
  - number: 22.b
    text: |-
      formatieleeftijdsbedrag: een bij ministeriële regeling vast te stellen bedrag, dat vervolgens afhankelijk wordt
      gesteld van de leeftijd van personeel van de school;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel22
  - number: 22.c
    text: |-
      basisbedrag: een bij ministeriële regeling vast te stellen bedrag, dat wordt bepaald door de in het desbetreffende
      artikel genoemde formatie te vermenigvuldigen met het formatiebasisbedrag;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel22
  - number: 22.d
    text: |-
      leeftijdsbedrag: een bij ministeriële regeling vast te stellen bedrag, dat wordt bepaald door de in het
      desbetreffende artikel genoemde formatie te vermenigvuldigen met het formatieleeftijdsbedrag.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel22
  - number: '23.1'
    text: |-
      Indien de totale bekostiging voor personeelskosten berekend op grond van [artikel 120, eerste lid, van de wet][ref1]
      vermeerderd met de bekostiging, bedoeld in [artikel 26][ref2], en in voorkomende gevallen vermeerderd met de
      bekostiging, bedoeld in de [artikelen 24][ref3], [25][ref4] en [28][ref5], voor een basisschool minder bedraagt
      dan een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen
      gemiddelde leeftijd van de leraren van de basisschool op 1 oktober van het voorafgaande schooljaar, wordt de
      bekostiging voor personeelskosten verhoogd tot het bedrag van laatstbedoelde uitkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0003862#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0003862#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0003862#Artikel28
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0003862
        artikel: '26'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003862
        artikel: '24'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003862
        artikel: '25'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0003862
        artikel: '28'
        hoofdstuk: III
  - number: '23.2'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het eerste lid, en het leeftijdsbedrag, bedoeld in het eerste
      lid, bedraagt de formatie 2,6927 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel23
  - number: '23.3'
    text: |-
      Voor de toepassing van het eerste lid wordt voor het schooljaar waarin een nieuwe basisschool wordt geopend,
      het leeftijdsbedrag vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van de leraren van
      basisscholen op 1 oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel23
  - number: '24.1'
    text: Een basisschool die op de teldatum minder dan 145 leerlingen had, ontvangt een toeslag voor kleine scholen.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel24
  - number: '24.2'
    text: 'De in het eerste lid bedoelde toeslag bestaat uit het verschil tussen:'
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel24
  - number: 24.2.a
    text: |-
      een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen
      gemiddelde leeftijd van de leraren van de school op 1 oktober van het voorafgaande schooljaar; en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel24
  - number: 24.2.b
    text: |-
      een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen
      gemiddelde leeftijd van de leraren van de school op 1 oktober van het voorafgaande schooljaar en vervolgens
      vermenigvuldigd met het aantal leerlingen van de school op de teldatum.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel24
  - number: '24.3'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het tweede lid, onderdeel a, en het leeftijdsbedrag, bedoeld in
      het tweede lid, onderdeel a, bedraagt de formatie 2,1508 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel24
  - number: '24.4'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het tweede lid, onderdeel b, en het leeftijdsbedrag, bedoeld in
      het tweede lid, onderdeel b, bedraagt de formatie per leerling 0,0149 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel24
  - number: '24.5'
    text: |-
      Voor de toepassing van het tweede lid wordt voor het schooljaar waarin een nieuwe basisschool is geopend,
      het leeftijdsbedrag vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van de leraren van
      basisscholen op 1 oktober van het voorafgaande schooljaar
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel24
  - number: '25'
    text: |-
      Indien een basisschool bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt de bekostiging voor
      personeelskosten vermeerderd met drievierde van het verschil tussen:
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel25
  - number: 25.a
    text: |-
      de som van de aanvullende bekostiging voor kleine scholen die de hoofdvestiging en de nevenvestigingen als
      zelfstandige scholen tezamen zouden ontvangen, berekend aan de hand van de gewogen gemiddelde leeftijd van de
      leraren van de gehele school op 1 oktober van het voorafgaande schooljaar, en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel25
  - number: 25.b
    text: de aanvullende bekostiging voor kleine scholen die de basisschool als school zonder nevenvestigingen zou ontvangen.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel25
  - number: '26.1'
    text: |-
      De aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 120, derde lid, van de wet][ref1] bedraagt
      voor basisscholen met een aantal leerlingen op de teldatum dat niet hoger is dan 97 respectievelijk hoger is dan 97
      een bij ministeriële regeling vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '26.2'
    text: |-
      De aanvullende bekostiging voor de schoolleiding, bedoeld in [artikel 120, derde lid, van de wet][ref1] bedraagt
      voor speciale scholen voor basisonderwijs met een aantal leerlingen op de teldatum dat niet hoger is dan 99
      respectievelijk hoger is dan 99 een bij ministeriële regeling vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '27.1'
    text: |-
      Het Centraal bureau voor de statistiek berekent jaarlijks de achterstandsscore van elke basisschool
      op basis van de onderwijsscores van de leerlingen die op de teldatum zijn ingeschreven op een
      basisschool en van wie het persoonsgebonden nummer tezamen met de basisgegevens, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet register onderwijsdeelnemers][ref1] uiterlijk op 1 december van
      het jaar voorafgaande aan het bekostigingsjaar zijn opgenomen in het register onderwijsdeelnemers overeenkomstig
      [artikel 14 van de Wet register onderwijsdeelnemers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel14
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0042012
        artikel: '14'
  - number: '27.2'
    text: |-
      De achterstandsscore van een basisschool is de uitkomst van de formule A−B en wordt als volgt berekend:







                    A =


                    som van de uitkomsten van de formule C – D voor alle leerlingen van de basisschool die behoren tot de
      15% van alle leerlingen van alle basisscholen met de laagste onderwijsscore, waarbij





                    C =


                    landelijk gemiddelde onderwijsscore van alle leerlingen van alle basisscholen;





                    D =


                    onderwijsscore van de leerling;









                    B =


                    E x F x (C – G) waarbij





                    E =


                    aantal leerlingen van de basisschool;





                    F =


                    12%;





                    C =


                    landelijk gemiddelde onderwijsscore van alle leerlingen van alle basisscholen;





                    G =


                    landelijk gemiddelde onderwijsscore van alle leerlingen van alle basisscholen die behoren tot de 15%
      van alle leerlingen van alle basisscholen met de laagste onderwijsscore.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel27
  - number: '27.3'
    text: |-
      De achterstandsscore, bedoeld in het tweede lid, wordt rekenkundig afgerond op twee decimalen. Indien de
      achterstandsscore negatief is, wordt deze gelijkgesteld aan nul.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel27
  - number: '27.4'
    text: |-
      Het Centraal bureau voor de statistiek verstrekt jaarlijks aan Onze Minister de achterstandsscores van de
      basisscholen, berekend op grond van het tweede lid, in voorkomend geval uitgesplitst naar hoofdvestiging en
      nevenvestiging, en maakt deze zo spoedig mogelijk daarna openbaar.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel27
  - number: '27.5'
    text: |-
      Indien een basisschool bestaat uit een hoofdvestiging en een of meer nevenvestigingen, bestaat de achterstandsscore
      van de basisschool uit de som van de rekenkundig afgeronde achterstandsscores die de afzonderlijke vestigingen
      zouden hebben, indien zij zelfstandige basisscholen zouden zijn.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel27
  - number: '27.6'
    text: |-
      In geval van samenvoeging van scholen is [artikel 121, derde lid, van de wet][ref1] van overeenkomstige toepassing
      bij de bepaling van de leerlingen die op de teldatum zijn ingeschreven op de basisschool.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel121
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '121'
  - number: '27.7'
    text: |-
      In geval van verzelfstandiging van een vestiging wordt de achterstandsscore van het overblijvende deel van
      de basisschool, bedoeld in [artikel 84a van de wet][ref1] verminderd met de achterstandsscore van de nieuwe
      basisschool die op grond van artikel 84a van de wet voor bekostiging in aanmerking is gebracht. Indien de uitkomst
      negatief is, wordt deze gelijkgesteld aan nul.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel84a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 84a
  - number: '27.8'
    text: |-
      Bij de toepassing van dit artikel blijven scholen als bedoeld in [artikel 185 van de wet][ref1] en de leerlingen
      van die scholen buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel185
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '185'
  - number: '28.1'
    text: |-
      Aan een basisschool wordt aanvullende bekostiging voor personeelskosten toegekend voor de bestrijding van
      onderwijsachterstanden die bestaat uit een bij ministeriële regeling vast te stellen bedrag per eenheid
      achterstandsscore.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel28
  - number: '28.2'
    text: |-
      Voor een speciale school voor basisonderwijs met een aantal leerlingen met een niet-Nederlandse culturele
      achtergrond op de teldatum boven het aantal van 4, wordt voor de bestrijding van onderwijsachterstanden per
      leerling boven het aantal van 4 een basisbedrag toegekend, welk bedrag wordt verhoogd met een leeftijdsbedrag
      dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de school op 1 oktober van het
      voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel28
  - number: '28.3'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het tweede lid, en het leeftijdsbedrag, bedoeld in het tweede
      lid, bedraagt de formatie per leerling 0,0401 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel28
  - number: '28.4'
    text: |-
      Voor de toepassing van het tweede lid wordt voor het schooljaar waarin een nieuwe speciale school voor
      basisonderwijs wordt geopend, het leeftijdsbedrag vermenigvuldigd met de geraamde landelijk gewogen gemiddelde
      leeftijd van de leraren van speciale scholen voor basisonderwijs op 1 oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel28
  - number: '29.1'
    text: |-
      Aan het bevoegd gezag van één of meer basisscholen wordt aanvullende bekostiging voor personeelskosten voor groei
      van de aantallen leerlingen toegekend indien:
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29
  - number: 29.1.a
    text: |-
      de uitkomst van de formule X – Y dan wel, indien in dat schooljaar reeds aanvullende bekostiging voor
      personeelskosten voor groei van de aantallen leerlingen is toegekend, de uitkomst van de formule X – Z, groter is
      dan of gelijk is aan 13, waarbij de factoren X, Y en Z worden berekend overeenkomstig het tweede lid; en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29
  - number: 29.1.b
    text: |-
      het persoonsgebonden nummer tezamen met de basisgegevens, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet register onderwijsdeelnemers][ref1] van de leerlingen die
      op de eerste schooldag dan wel de eerste dag van de maand, bedoeld in de in het tweede lid genoemde factor
      X, op de school of scholen staan ingeschreven, uiterlijk 4 weken na die dag zijn opgenomen in het register
      onderwijsdeelnemers overeenkomstig [artikel 14 van de Wet register onderwijsdeelnemers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel14
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0042012
        artikel: '14'
  - number: '29.2'
    text: |-
      De factoren X, Y en Z, bedoeld in het eerste lid, worden als volgt berekend: X = de som van de aantallen
      leerlingen van alle op 1 augustus van dat schooljaar onder dat bevoegd gezag ressorterende basisscholen, op
      de eerste schooldag van een schooljaar dan wel op de eerste dag van een maand in de periode van september tot
      en met april van dat schooljaar; Y= de som van 103% van de aantallen leerlingen van alle op 1 augustus van dat
      schooljaar onder dat bevoegd gezag ressorterende basisscholen, op 1 oktober van het schooljaar voorafgaande aan
      het schooljaar waarin de telling van X heeft plaatsgevonden, vermeerderd met de som van 103% van de aantallen
      leerlingen van alle op 1 augustus van dat schooljaar onder dat bevoegd gezag ressorterende basisscholen, bedoeld
      in [artikel 121, tweede lid, van de wet][ref1], op 1 oktober van het schooljaar waarin de telling van X heeft
      plaatsgevonden; Z = de som van de aantallen leerlingen op grond waarvan de laatste maal in het schooljaar waarin
      de telling van X heeft plaatsgevonden aanvullende bekostiging voor personeelskosten in verband met groei van de
      aantallen leerlingen is toegekend


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel121
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '121'
  - number: '29.3'
    text: |-
      Indien sprake is van een school die per 1 augustus van het schooljaar waarin de telling van X heeft plaatsgevonden,
      is ontstaan uit een samenvoeging, wordt bij de berekening van de in het tweede lid, genoemde factor Y 103%
      genomen van het aantal leerlingen van alle bij die samenvoeging betrokken scholen op 1 oktober van het schooljaar
      voorafgaande aan het schooljaar waarin de telling van X heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29
  - number: '29.4'
    text: |-
      Bij de berekening van de in het tweede lid genoemde factor Y, wordt het aantal leerlingen op 1 oktober van het
      schooljaar voorafgaande aan het schooljaar waarin de telling van X heeft plaatsgevonden, berekend overeenkomstig
      [artikel 121, vierde en vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel121
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '121'
  - number: '29.5'
    text: |-
      Bij de berekening van 103% van de aantallen leerlingen, bedoeld in het tweede en derde lid, wordt de uitkomst per
      school naar beneden afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29
  - number: '29.6'
    text: |-
      De aanspraak op de aanvullende bekostiging, bedoeld in het eerste lid, ontstaat met ingang van de maand waarin de
      telling van X, bedoeld in het tweede lid, heeft plaatsgevonden. Indien de telling van X heeft plaatsgevonden op
      de eerste schooldag, en deze in de maand september valt, ontstaat de aanspraak op deze aanvullende bekostiging, in
      afwijking van de eerste volzin, met ingang van 1 augustus. De aanvullende bekostiging wordt per bevoegd gezag per
      groeidatum éénmalig toegekend.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29
  - number: '29.7'
    text: |-
      De in het eerste lid bedoelde aanvullende bekostiging wordt toegekend voor het aantal leerlingen dat X meer
      bedraagt dan Y, respectievelijk indien in dat schooljaar reeds aanvullende bekostiging voor personeelskosten voor
      groei van de aantallen leerlingen is toegekend, voor het aantal leerlingen dat X meer bedraagt dan Z, en bedraagt
      per leerling een basisbedrag, welk bedrag wordt verhoogd met een leeftijdsbedrag dat wordt vermenigvuldigd met de
      geraamde landelijk gewogen gemiddelde leeftijd van de leraren van basisscholen op 1 oktober van het voorafgaande
      schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29
  - number: '29.8'
    text: |-
      Het bedrag dat de uitkomst is van de toepassing van het zevende lid wordt vermenigvuldigd met het aantal maanden
      vanaf de maand van toekenning tot het einde van het schooljaar en vervolgens gedeeld door twaalf.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29
  - number: '29.9'
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het zevende lid, en het leeftijdsbedrag, bedoeld in het zevende
      lid, bedraagt de formatie per leerling 0,0487 formatieplaats.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29
  - number: 29a.1
    text: |-
      Indien aan een basisschool een afdeling internationaal georiënteerd basisonderwijs is verbonden, wordt
      op basis van een aanvraag van het bevoegd gezag aanvullende bekostiging voor personeelskosten, bedoeld in
      [artikel 120, derde lid, van de wet][ref1], toegekend, indien bij deze afdeling op 1 oktober van het voorafgaand
      schooljaar ten minste elf leerlingen staan ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: 29a.2
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt voor 1 juli van het voorafgaand schooljaar door middel van een bij
      ministeriële regeling vastgesteld formulier ingediend.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29a
  - number: 29a.3
    text: |-
      De aanvullende bekostiging, bedoeld in het eerste lid, bedraagt een basisbedrag, welk bedrag wordt verhoogd
      met een leeftijdsbedrag dat wordt vermenigvuldigd met de geraamde landelijke gewogen gemiddelde leeftijd van de
      leraren van basisscholen op 1 oktober van het voorafgaande schooljaar en vervolgens vermenigvuldigd met het aantal
      formatieplaatsen.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29a
  - number: 29a.4
    text: |-
      Voor de berekening van het basisbedrag, bedoeld in het derde lid, en het leeftijdsbedrag, bedoeld in het derde lid,
      bedraagt het aantal formatieplaatsen de formatie uit onderstaande tabel vermenigvuldigd met de factor 1,0811 en
      afgerond op 4 decimalen:






                    aantal leerlingen


                    formatie






                    11 t/m 20


                    0,2




                    21 t/m 30


                    0,3




                    31 t/m 40


                    0,4




                    41 t/m 50


                    0,5




                    51 t/m 60


                    0,6




                    61 t/m 70


                    0,7




                    71 t/m 80


                    0,8




                    81 t/m 90


                    0,9




                    91 t/m 100


                    1




                    101 t/m 110


                    1,1




                    111 t/m 120


                    1,2




                    121 t/m 130


                    1,3




                    131 t/m 140


                    1,4




                    141 t/m 150


                    1,5




                    151 t/m 165


                    1,6




                    166 t/m 180


                    1,7




                    181 t/m 195


                    1,8




                    196 t/m 210


                    1,9




                    en vervolgens per 15 leerlingen 0,1 formatie
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel29a
  - number: '30.1'
    text: |-
      Aan het bevoegd gezag van één of meer basisscholen wordt aanvullende bekostiging voor personeelskosten voor
      bijzondere groei toegekend, indien:
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel30
  - number: 30.1.a
    text: |-
      de som van de aantallen leerlingen op alle op 1 augustus van een schooljaar onder dat bevoegd gezag ressorterende
      basisscholen op 1 mei van dat schooljaar met ten minste 26 is toegenomen ten opzichte van de som van de bedoelde
      aantallen leerlingen op 1 april van dat schooljaar; of
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel30
  - number: 30.1.b
    text: |-
      de som van de aantallen leerlingen op alle op 1 augustus van een schooljaar onder dat bevoegd gezag ressorterende
      basisscholen op 1 juni van dat schooljaar met ten minste 26 is toegenomen ten opzichte van de som van de bedoelde
      aantallen leerlingen op 1 april van dat schooljaar en geen aanvullende bekostiging op grond van onderdeel a is
      toegekend; of
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel30
  - number: 30.1.c
    text: |-
      de som van de aantallen leerlingen op alle op 1 augustus van een schooljaar onder dat bevoegd gezag ressorterende
      basisscholen op 1 juni van dat schooljaar met ten minste 26 is toegenomen ten opzichte van de som van de bedoelde
      aantallen leerlingen op 1 mei van dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel30
  - number: '30.2'
    text: |-
      De aanvullende bekostiging, bedoeld in het eerste lid, wordt slechts toegekend indien van de
      leerlingen die op de van toepassing zijnde peildatum, bedoeld in het eerste lid, op de school
      of scholen staan ingeschreven, het persoonsgebonden nummer tezamen met de basisgegevens, bedoeld
      in [artikel 8, eerste lid, onderdeel b, van de Wet register onderwijsdeelnemers][ref1] uiterlijk
      vier weken na die peildatum zijn opgenomen in het register onderwijsdeelnemers overeenkomstig
      [artikel 14 van de Wet register onderwijsdeelnemers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel14
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0042012
        artikel: '14'
  - number: '30.3'
    text: |-
      De aanspraak op de aanvullende bekostiging, bedoeld in het eerste en tweede lid, ontstaat met ingang van de maand
      waarin de telling, bedoeld in het eerste lid, heeft plaatsgevonden en wordt berekend en toegekend overeenkomstig
      [artikel 29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel29
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '29'
        hoofdstuk: III
  - number: '31.1'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 132, eerste lid, van de wet][ref1] bedraagt de
      hoeveelheid formatie 0,00237 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '132'
  - number: '31.2'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 132, derde lid, van de wet][ref1] bedraagt de
      hoeveelheid formatie 0,004894 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '132'
  - number: '32.1'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 124, eerste lid, van de wet][ref1], bedraagt de
      formatie per leerling 0,0452 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel124
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '124'
  - number: '32.2'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 124, tweede lid, van de wet][ref1], bedraagt de
      formatie per leerling 0,0646 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel124
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '124'
  - number: '33'
    text: |-
      Voor de berekening van het bedrag per leerling, bedoeld in [artikel 125, tweede lid, van de wet][ref1], bedraagt
      de formatie per leerling voor elk schooljaar volgend op het schooljaar van de toelating van de leerling tot de
      speciale school voor basisonderwijs 0,0646 formatieplaats. Indien de toelating heeft plaatsgevonden in de periode
      van 2 oktober tot 1 augustus daaropvolgend bedraagt de formatie per leerling in het eerste schooljaar volgend op de
      toelating in afwijking van de eerste volzin 0,1098 formatieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel125
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '125'
  - number: 33a
    text: |-
      Onze Minister verstrekt volgens bij ministeriële regeling te stellen regels per boekjaar subsidie aan de
      rechtspersoon, bedoeld in [artikel 184b, eerste lid, van de wet][ref1], voor het geven van godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184b
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 184b
  - number: 33b.1
    text: |-
      Het subsidiebedrag dat wordt verstrekt aan de rechtspersoon, bedoeld in
      [artikel 184b, eerste lid, van de wet][ref1], bestaat uit een bedrag dat is bestemd voor personeelskosten voor
      de leraren die het godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs verzorgen, en een bedrag dat is
      bestemd voor overige kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184b
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 184b
  - number: 33b.2
    text: |-
      Het bedrag dat is bestemd voor personeelskosten kan met maximaal twee procent per jaar stijgen ten opzichte van het
      meest recent vastgestelde subsidiebedrag dat is bestemd voor personeelskosten.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33b
  - number: 33b.3
    text: Het tweede lid vervalt met ingang van 31 december 2025.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33b
  - number: 33b.4
    text: |-
      Voor het berekenen van de hoogte van het subsidiebedrag wordt uitgegaan van ten hoogste veertig uren per schooljaar
      door leerlingen te ontvangen godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33b
  - number: 33b.5
    text: |-
      Bij het besluit tot verlening van de subsidie verleent Onze Minister voorschotten. Onze Minister stelt bij
      beschikking het betaalritme vast.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33b
  - number: 33b.6
    text: |-
      Het bedrag dat ten hoogste wordt verstrekt aan de rechtspersoon, bedoeld in
      [artikel 184b, eerste lid, van de wet][ref1], is het bedrag dat op de begroting van het Ministerie van
      Onderwijs, Cultuur en Wetenschap beschikbaar is voor het geven van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184b
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 184b
  - number: 33c
    text: 'Voor het bepalen van de hoogte van het subsidiebedrag kunnen bij ministeriële regeling regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33c
  - number: 33c.a
    text: |-
      de minimale omvang van de groepsgrootte per stroming binnen het godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs; en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33c
  - number: 33c.b
    text: |-
      het maximale aantal schooljaren per school waarin godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs
      wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33c
  - number: 33d
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1], kan de subsidie in ieder geval worden
      geweigerd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 33d.a
    text: |-
      het godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs niet wordt gegeven door leraren als bedoeld in
      [artikel 51 van de wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel51
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '51'
  - number: 33d.b
    text: |-
      het godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs wordt gegeven in strijd met
      [artikel 8, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
  - number: '34.1'
    text: |-
      Bij de beoordeling van de leerresultaten, bedoeld in artikel [10a, derde lid, van de wet][ref1], hanteert de
      inspectie objectieve, relatieve normen. De grenzen die de inspectie als norm voor het oordeel voldoende dan wel
      onvoldoende resultaat hanteert, zijn gecorrigeerd voor schoolkenmerken en individuele kenmerken van leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.1
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
  - number: '34.4'
    text: 'Bij ministeriële regeling worden geregeld:'
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.4
  - number: 34.4.a
    text: |-
      de uitwerking van de wijze waarop de beoordeling van de leerresultaten, bedoeld in
      [artikel 10a, derde lid, van de wet][ref1] tot stand komt;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
  - number: 34.4.b
    text: |-
      voor zover van toepassing, de wijze waarop en omstandigheden waarin bij kleine scholen de leerresultaten worden
      gewogen;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.4
  - number: 34.4.c
    text: de wijze van correctie van de meting voor schoolkenmerken en individuele kenmerken van leerlingen;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.4
  - number: 34.4.d
    text: de normering waarop de inspectie het oordeel voldoende dan wel onvoldoende leerresultaat baseert.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.4
  - number: 34.5.1
    text: |-
      De systematiek van de beoordeling van leerresultaten als bedoeld in [artikel 10a van de wet][ref1] wordt
      vastgesteld dan wel gewijzigd met inachtneming van de volgende procedure:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
  - number: 34.5.1.a
    text: |-
      gelet op recente ontwikkelingen, een eigen analyse en signalen van organisaties uit het onderwijsveld, beslist de
      inspecteur-generaal van het onderwijs of hij Onze Minister een voorstel doet voor wijziging in de systematiek van
      de beoordeling van leerresultaten als bedoeld in [artikel 10a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
  - number: 34.5.1.b
    text: |-
      over het concept-voorstel overlegt de inspecteur-generaal van het onderwijs met de daarvoor in aanmerking komende
      organisaties uit het onderwijsveld;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.5
  - number: 34.5.1.c
    text: |-
      de inspecteur-generaal van het onderwijs legt het voorstel voor aan Onze Minister, onder vermelding van de
      wijze waarop in het voorstel rekening is gehouden met de reacties van de geraadpleegde organisaties uit het
      onderwijsveld;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.5
  - number: 34.5.1.d
    text: |-
      Onze Minister besluit naar aanleiding van het voorstel over wijziging van de systematiek van de beoordeling van
      leerresultaten of een daarvoor noodzakelijk voorstel van wet of ontwerp-algemene maatregel van bestuur wordt
      voorbereid.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.5
  - number: 34.5.2
    text: |-
      Wijzigingen in de vaststelling en correctie van meting alsmede in de normering als gevolg van actualisatie van
      toetsgegevens, worden vastgesteld op voorstel van de inspecteur-generaal van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.5
  - number: 34.6.1
    text: |-
      Indien er geen of onvoldoende gegevens zijn voor een betrouwbaar oordeel over de meting van de leerresultaten,
      verricht de inspectie een aanvullend onderzoek, volgens bij ministeriële regeling te geven voorschriften. Het
      aanvullend onderzoek kan onder meer omvatten:
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.6
  - number: 34.6.1.a
    text: het verkrijgen van nadere gegevens van de school over de resultaten en de doorstroom van leerlingen;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.6
  - number: 34.6.1.b
    text: onderzoek en verificatie ter plekke.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.6
  - number: 34.6.2
    text: |-
      De inspectie laat in het schooljaar 2021–2022, in afwijking van het eerste lid, het aanvullend onderzoek
      achterwege.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.6
  - number: 34.6a
    text: |-
      Het instrument ter monitoring van de veiligheid van leerlingen, bedoeld in
      [artikel 4c, eerste lid, onderdeel b, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel4c
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.6a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 4c
  - number: 34.6a.a
    text: |-
      geeft inzicht in de ervaren en feitelijke veiligheid en het welbevinden van de leerlingen, voor zover dat verband
      houdt met de veiligheid, op school;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.6a
  - number: 34.6a.b
    text: wordt ten minste eens per schooljaar afgenomen onder een representatief deel van de leerlingen; en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.6a
  - number: 34.6a.c
    text: is gestandaardiseerd, valide en betrouwbaar.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.6a
  - number: 34.7.1
    text: |-
      Het ontwikkelingsperspectief, bedoeld in [artikel 40a van de wet][ref1], bevat ten minste informatie over naar
      welke onderwijssoort in het voortgezet onderwijs dan wel welk uitstroomprofiel van het voortgezet speciaal
      onderwijs, bedoeld in [artikel 14, eerste lid, van de Wet op de expertisecentra][ref2], uitstroom van de leerling
      wordt verwacht, en de onderbouwing daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.7
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 40a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '14'
  - number: 34.7.2
    text: |-
      De onderbouwing bevat ten minste een weergave van de belemmerende en bevorderende factoren die van invloed zijn op
      het onderwijs aan de leerling.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.7
  - number: '34.8'
    text: |-
      De deskundigen, bedoeld in [artikel 18a, elfde lid, van de wet][ref1] zijn een orthopedagoog of een psycholoog en
      afhankelijk van de leerling over wiens toelaatbaarheid wordt geadviseerd ten minste een tweede deskundige, te weten
      een kinder- of jeugdpsycholoog, een pedagoog, een kinderpsychiater, een maatschappelijk werker of een arts.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.8
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
  - number: 34.9.1
    text: |-
      De geschillencommissie, bedoeld in [artikel 43 van de wet][ref1], bestaat uit ten minste 7 leden met verschillende
      deskundigheden. De leden worden benoemd op gezamenlijke bindende voordracht van de landelijke ouderorganisaties, de
      landelijke patiënten- en gehandicaptenorganisaties en de sectororganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel43
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.9
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '43'
  - number: 34.9.2
    text: De leden worden benoemd en ontslagen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.9
  - number: 34.9.3
    text: De leden worden benoemd voor een periode van 4 jaar en kunnen ten hoogste 2 maal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.9
  - number: 34.9.4
    text: |-
      De commissie is zodanig samengesteld dat zij beschikt over (ortho)pedagogische, psychologische, onderwijskundige,
      maatschappelijke, bestuurlijke, juridische en medische deskundigheid. Voor de behandeling van ieder ingediend
      geschil kiest de commissie uit haar leden één voorzitter en twee leden. De commissie bepaalt welke samenstelling
      bij de behandeling van het geschil het meest geschikt is.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.9
  - number: 34.9.5
    text: De leden worden ontslagen indien zij daarom verzoeken.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.9
  - number: 34.9.6
    text: |-
      De leden mogen niet deel uitmaken van het bevoegd gezag van een van de scholen die deelnemen aan het
      samenwerkingsverband of het bevoegd gezag van dat samenwerkingsverband dat betrokken is in het geschil en zij
      functioneren zonder last of ruggenspraak.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.9
  - number: 34.9.7
    text: De commissie zendt haar oordeel aan het bevoegd gezag en een afschrift van haar oordeel aan de ouders.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.9
  - number: 34.9.8
    text: |-
      Het bevoegd gezag van de school die het oordeel van de commissie heeft ontvangen, deelt schriftelijk aan de ouders
      en aan de commissie mee wat er met het oordeel wordt gedaan. Indien de beslissing van het bevoegd gezag van de
      school afwijkt van het oordeel van de commissie, wordt in de beslissing de reden voor die afwijking vermeld.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.9
  - number: 34.10.1
    text: |-
      Indien het samenwerkingsverband, bedoeld in [artikel 1 van de wet][ref1], een of meer n orthopedagogisch-didactisch
      centra omvat, wordt dat vermeld in het ondersteuningsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.10
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
  - number: 34.10.2
    text: |-
      Een leerling, die is of wordt ingeschreven bij een school, kan gedurende ten hoogste een half jaar het
      onderwijsprogramma of een gedeelte daarvan volgen bij een orthopedagogisch-didactisch centrum. De termijn, genoemd
      in de eerste volzin, kan in bijzondere gevallen eenmalig worden verlengd met ten hoogste een half jaar.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.10
  - number: 34.10.3
    text: |-
      Het onderwijs aan leerlingen die een programma volgen bij het orthopedagogisch-didactisch centrum wordt
      gegeven door leraren die voldoen aan de bevoegdheids- en bekwaamheidseisen zoals die zijn vastgesteld in de
      [artikelen 3][ref1] en [32a van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.10
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 32a
  - number: 34.11.1
    text: |-
      Voor de toepassing van [artikel 15, eerste lid, van de wet][ref1] is vereist dat tussen het bevoegd gezag van een
      school en het bevoegd gezag van een andere school, een school voor speciaal onderwijs, een school voor speciaal en
      voortgezet speciaal onderwijs, dan wel een instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      de [Wet op de expertisecentra][ref2] een schriftelijke overeenkomst over de uitvoering daarvan wordt gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0003549
  - number: 34.11.2
    text: 'De overeenkomst, bedoeld in het eerste lid, bevat in elk geval afspraken over:'
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
  - number: 34.11.2.a
    text: de termijn waarvoor de overeenkomst is aangegaan;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
  - number: 34.11.2.b
    text: de onderwijsactiviteiten die de leerling ontvangt op de school of instelling;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
  - number: 34.11.2.c
    text: het aantal lesuren per week per onderwijsactiviteit dat ten minste wordt aangeboden; en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
  - number: 34.11.2.d
    text: de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
  - number: 34.11.3
    text: |-
      Een leerling kan gedurende een termijn van ten hoogste drie maanden aaneengesloten het volledige onderwijsprogramma
      volgen op een school of instelling als bedoeld in het eerste lid. De overeenkomst, bedoeld in het eerste lid, bevat
      dan in elk geval afspraken over:
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
  - number: 34.11.3.a
    text: de termijn waarvoor de overeenkomst is aangegaan;
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
  - number: 34.11.3.b
    text: de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling; en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
  - number: 34.11.3.c
    text: |-
      het bedrag voor de personele en materiële kosten dat het bevoegd gezag van de school waar de leerling is
      ingeschreven betaalt aan het bevoegd gezag van de school of instelling waarmee de overeenkomst wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
  - number: 34.11.4
    text: |-
      Onderdeel c is niet van toepassing op een overeenkomst met een school waaraan onderwijs
      wordt gegeven aan leerlingen die zijn opgenomen in een inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1] of een gesloten accommodatie als
      bedoeld in [artikel 1.1 van de Jeugdwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 34.11.5
    text: |-
      Indien voor de toepassing van [artikel 15, eerste lid, van de wet][ref1], scholen of instellingen binnen hetzelfde
      bevoegd gezag zijn betrokken, maakt dit bevoegd gezag afspraken met deze betrokken scholen of instellingen over de
      onderdelen, genoemd in het tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel15
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.11
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '15'
  - number: '34.12'
    text: |-
      Het percentage, bedoeld in [artikel 9, lid 13a, van de wet][ref1], waarin een deel van het onderwijs kan worden
      gegeven in de Engelse, Duitse of Franse taal is ten hoogste 15% per schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34.12
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
  - number: 34a.1
    text: |-
      Onverminderd de bevoegdheid van de Inspectie van het onderwijs op grond van de [Wet op het onderwijstoezicht][ref1]
      kan Onze Minister een onderzoek instellen of doen instellen naar de jaarverslaggeving, naar de gegevens die
      noodzakelijk zijn voor de vaststelling van de bekostiging, naar de rechtmatigheid van de bestedingen en naar de
      doelmatigheid van het beheer van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: 34a.2
    text: |-
      Indien uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging voor een school onjuist
      is vastgesteld, kan Onze Minister correcties aanbrengen op de bekostiging. Onze Minister doet het bevoegd gezag
      schriftelijk mededeling van een besluit tot het aanbrengen van een correctie op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34a
  - number: 34a.3
    text: |-
      Indien uit de jaarverslaggeving, bedoeld in [artikel 171, eerste lid, van de wet][ref1], uit de verklaring
      van de accountant, bedoeld in artikel 171, vierde lid, van de wet of uit een op grond van het eerste lid
      ingesteld onderzoek blijkt dat de bekostiging voor een school onrechtmatig is besteed of ondoelmatig is
      aangewend, kan Onze Minister bepalen dat het desbetreffende gedeelte van de bekostiging niet ten laste komt
      van het Rijk of dat de daarmee gemoeide bedragen in mindering worden gebracht op de bekostiging, onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 34b
    text: |-
      Een in [artikel 34a, tweede lid][ref1], bedoelde correctie wordt indien de correctie strekt tot verhoging van de
      bekostiging, binnen acht weken na de mededeling, bedoeld in artikel 34a, tweede lid, door Onze Minister betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel34a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: 34a
        hoofdstuk: IV
  - number: 34c.1
    text: |-
      Voor de toepassing van [artikel 163a van de wet][ref1] wordt onder exploitatieoverschot verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel163a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 163a
  - number: 34c.1.a
    text: |-
      het bedrag van de bekostiging, bedoeld in de [artikelen 129][ref1], [134][ref2] en [137 van de wet][ref3]
      verminderd met de lasten over dat jaar voor zover deze als rechtmatig kunnen worden aangemerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel134
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '134'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '137'
  - number: 34c.1.b
    text: de reserveringen voor zover afkomstig uit ’s Rijks kas, met inbegrip van de ontvangen rentebaten, en
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34c
  - number: 34c.1.c
    text: |-
      voor zover het een niet door een gemeente in stand gehouden school betreft, de niet bestede gedeelten van de
      uitkeringen op grond van de voorschriften inzake de gemeentelijke overschrijding.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34c
  - number: 34c.2
    text: |-
      Het bevoegd gezag meldt het overeenkomstig het eerste lid berekende saldo, verdeeld naar de onderdelen a en b,
      respectievelijk c, van het eerste lid, tezamen met het jaarverslag over het laatste jaar waarin de school nog
      geheel of gedeeltelijk voor bekostiging in aanmerking kwam. De opgave gaat vergezeld van een verklaring van een
      accountant omtrent de juistheid van de opgave.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34c
  - number: 34c.3
    text: |-
      Indien het exploitatieoverschot van een niet door een gemeente in stand gehouden school mede is opgebouwd uit
      uitkeringen als bedoeld in het eerste lid, onderdeel c, en geen onderscheid kan worden gemaakt met de baten
      respectievelijk de lasten, bedoeld in het eerste lid, onderdelen a en b, geldt als maatstaf voor de verdeling van
      eerstbedoeld deel van het exploitatieoverschot tussen Rijk en de desbetreffende gemeente de verhouding tussen het
      ontvangen bedrag aan bekostiging van het Rijk en het ontvangen bedrag aan uitkeringen, bedoeld in het eerste lid,
      onderdeel c, van de gemeente in een periode van vijf jaren voorafgaand aan het jaar van de beëindiging van de
      bekostiging. De verdeling behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel34c
  - number: '35.1'
