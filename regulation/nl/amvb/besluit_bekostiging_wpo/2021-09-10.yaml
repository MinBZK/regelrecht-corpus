      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _______________________________________________________________________________________ (Stb. 2012, 533) zijn
      voor samenwerkingsverbanden voor wie de uitkomst van de berekening, bedoeld in het eerste lid, van genoemd artikel
      negatief is, voor het derde, vierde, vijfde en zesde schooljaar, bedoeld in genoemd artikel, respectievelijk
      90%, 75%, 60% en 30%. Indien de uitkomst van de in de eerste volzin bedoelde berekening positief is, zijn de
      percentages, bedoeld in de vorige volzin in de daar bedoelde jaren respectievelijk 95%, 80%, 60% en 30%.


