  - number: '36.1'
    text: |-
      Het samenwerkingsverband is gehouden om, wanneer een bevoegd gezag of een personeelsorganisatie daarom verzoekt,
      met dat bevoegd gezag en de personeelsorganisaties een op overeenstemming gericht overleg te voeren over het
      personeel dat in het derde schooljaar waarin [artikel 70a van de wet][ref1] is vervallen, nog niet zal zijn
      herplaatst en dat niet als gevolg van natuurlijk verloop zal zijn uitgestroomd op of voor 1 augustus 2016.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel70a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 70a
  - number: '36.2'
    text: |-
      Een bevoegd gezag als bedoeld in het eerste lid is het bevoegd van een school als bedoeld in de
      [Wet op de expertisecentra][ref1] of een centrale dienst, waar het personeel in het schooljaar 2014–2015 in dienst
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '36.3'
    text: |-
      Het personeel, bedoeld in het eerste lid, is het personeel dat op 1 mei 2012 als ambulant begeleider in dienst was
      bij een school als bedoeld in de [Wet op de expertisecentra][ref1], een regionaal expertisecentrum als bedoeld in
      de Wet op de expertisecentra of een centrale dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '36.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van personeel, niet zijnde ambulant
      begeleiders, dat op 1 mei 2012 is dienst was bij een samenwerkingsverband als bedoeld in de [wet][ref1], een
      centrale dienst of een regionaal expertisecentrum als bedoeld in de [Wet op de expertisecentra][ref2] en dat in het
      eerste schooljaar waarin [artikel 70a van de wet][ref3] is vervallen, niet zal zijn herplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel70a
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 70a
  - number: '36.5'
    text: |-
      Dit artikel is van overeenkomstige toepassing op de rechtspersoon, bedoeld in [artikel 184 van de wet][ref1] voor
      zover het personeel, bedoeld in het derde en vierde lid, betreft dat in verband met de opheffing van regionale
      expertisecentra en de beëindiging van de ondersteuningswerkzaamheden bij de samenwerkingsverbanden zoals die
      bestonden voor 1 augustus 2013, een werkloosheidsuitkering ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
  - number: 36a.1
    text: |-
      De aanvullende bekostiging voor een basisschool, berekend op grond van [artikel 28][ref1], wordt voor de
      schooljaren 2019–2020, 2020–2021 en 2021–2022 per schooljaar vermeerderd met een bedrag berekend volgens de
      formule, genoemd in het tweede lid, als de uitkomst van die berekening positief is, en verminderd met een bedrag
      berekend volgens die formule als de uitkomst daarvan negatief is.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel28
    url: https://wetten.overheid.nl/BWBR0003862/2021-09-10#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0003862
        artikel: '28'
        hoofdstuk: III
  - number: 36a.2
    text: |-
      Het bedrag van de vermeerdering of vermindering, bedoeld in het eerste lid, is de uitkomst van de formule (A – B) x
      C en wordt als volgt berekend:







                    A =


                    de uitkomst van de formule D + E + F – G + H waarbij





                    D =


                    de aanvullende bekostiging, bedoeld in [artikel 28][ref1], zoals dat artikel luidde op 31 december
      2018, gebaseerd op de teldatum 1 oktober 2018;





                    E =


                    de aanvullende bekostiging, bedoeld in [artikel 28a][ref2], zoals dat artikel luidde op 31 december
      2018, gebaseerd op de teldatum 1 oktober 2018;





                    F =


                    de bekostiging, bedoeld in [artikel 134 van de wet][ref3] op basis van [artikel 14][ref4], zoals dat
      artikel luidde op 31 december 2018, gebaseerd op de teldatum 1 oktober 2018;





                    G =


                    de bekostiging, bedoeld in artikel 134 van de wet op basis van artikel 14, gebaseerd op de teldatum
      1 oktober 2018;





