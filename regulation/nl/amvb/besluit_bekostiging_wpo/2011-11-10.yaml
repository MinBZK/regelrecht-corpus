  - number: 12a
    text: |-
      1 Onze Minister stelt jaarlijks voor 1 februari de bekostiging voor dat jaar voor basisscholen en speciale
      scholen voor basisonderwijs vast, gebaseerd op de grondslag bedoeld in de [artikelen 134, vierde lid][ref1],
      onderscheidenlijk [115 van de wet][ref2], met dien verstande dat Onze Minister voor het bepalen van het aantal
      leerlingen op 1 oktober van het jaar voorafgaande aan het bekostigingsjaar, de leerlingen in aanmerking neemt
      van wie het persoonsgebonden nummer tezamen met de in [artikel 178a, tweede lid, van de wet][ref3] bedoelde
      gegevens uiterlijk op de daarop volgende 1 december zijn opgenomen in het basisregister onderwijs overeenkomstig
      [artikel 178b van de wet][ref4], dan wel de leerlingen van wie opgave is gedaan aan Onze Minister overeenkomstig
      [artikel 36a, vierde lid][ref5].

      2 Indien [artikel 134, zesde lid, van de wet][ref6] van toepassing is en indien van de leerlingen die op 1
      maart van het bekostigingsjaar op de school staan ingeschreven het persoonsgebonden nummer tezamen met de in
      [artikel 178a, tweede lid, van de wet][ref7] bedoelde gegevens uiterlijk op 1 april van dat jaar zijn opgenomen
      in het basisregister onderwijs overeenkomstig [artikel 178b van de wet][ref8], dan wel van deze leerlingen opgave
      is gedaan aan Onze Minister overeenkomstig [artikel 36a, vierde lid][ref9], stelt Onze Minister voor 1 mei de
      bekostiging, bedoeld in het eerste lid, voor dat jaar nader vast.

      3 Indien de verklaring van de accountant, bedoeld in [artikel 171, vierde lid, van de wet][ref10], aanleiding
      geeft tot wijziging van de bekostiging, bedoeld in het eerste of tweede lid, stelt Onze Minister voor 1 oktober de
      bekostiging voor dat jaar nader vast.


