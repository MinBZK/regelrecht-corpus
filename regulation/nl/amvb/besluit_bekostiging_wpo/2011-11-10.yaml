  - number: '27'
    text: |-
      1 Voor elke leerling die volgens onderstaande tabel in een categorie kan worden ingedeeld, wordt bij de toelating
      tot een basisschool het bij die categorie behorende gewicht vastgesteld, met dien verstande dat een leerling
      slechts bij één categorie wordt ingedeeld.










                    Leerling categorie







                    a.


                    Leerling van wie beide ouders of verzorgers een schoolopleiding hebben gevolgd op maximaal het niveau
      praktijkonderwijs of voorbereidend beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg of de
      kaderberoepsgerichte leerweg. Indien het betreft een leerling uit een eenoudergezin, geldt deze opleidingseis ten
      aanzien van de desbetreffende ouder of verzorger.


                    0,3




                    b.


                    Leerling van wie een ouder of verzorger een schoolopleiding heeft gevolgd op maximaal het niveau
      basisonderwijs, en van wie de andere ouder of verzorger een schoolopleiding heeft gevolgd op maximaal het niveau
      praktijkonderwijs of voorbereidend beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg of
      de kaderberoepsgerichte leerweg. Indien het betreft een leerling uit een eenoudergezin, geldt dat de ouder of
      verzorger een schoolopleiding heeft gevolgd op maximaal het niveau basisonderwijs.


                    1,2






      Met het hebben gevolgd van een schoolopleiding op maximaal het niveau praktijkonderwijs of voorbereidend
      beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg of de kaderberoepsgerichte leerweg wordt
      gelijkgesteld het hebben doorlopen van ten hoogste de eerste twee leerjaren van een andere vorm van voortgezet
      onderwijs.

      2 Het schoolgewicht wordt berekend door de som van de volgens het eerste lid vastgestelde gewichten van de op
      de teldatum ingeschreven leerlingen te verminderen met een getal, gelijk aan 6% van het aantal leerlingen op de
      teldatum. De uitkomst wordt rekenkundig afgerond op een geheel getal. Indien de uitkomst negatief is, bedraagt het
      schoolgewicht nul.

      3 Indien het schoolgewicht hoger is dan 80% van het aantal op de teldatum ingeschreven leerlingen van de
      basisschool, wordt het schoolgewicht vastgesteld op 80% van het aantal op de teldatum op de basisschool
      ingeschreven leerlingen.

      4 Indien een basisschool bestaat uit een hoofdvestiging en een of meer nevenvestigingen, bestaat het schoolgewicht
      van de basisschool uit de som van de schoolgewichten die de afzonderlijke vestigingen zouden hebben, indien zij
      zelfstandige scholen zouden zijn.
    url: https://wetten.overheid.nl/BWBR0003862/2011-11-10#Artikel27
  - number: '28'
    text: |-
      1 Voor de aanvullende bekostiging voor personeelskosten voor de bestrijding van onderwijsachterstanden voor
      een basisschool wordt een basisbedrag per eenheid schoolgewicht toegekend, welk bedrag wordt verhoogd met een
      leeftijdsbedrag dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de school op 1
      oktober van het voorafgaande schooljaar.

      2 Voor de berekening van het basisbedrag, bedoeld in het eerste lid, en het leeftijdsbedrag, bedoeld in het eerste
      lid, bedraagt de formatie per eenheid schoolgewicht 0,0503 formatieplaats.

      3 Voor een speciale school voor basisonderwijs met een aantal leerlingen met een niet-Nederlandse culturele
      achtergrond op de teldatum boven het aantal van 4, wordt voor de bestrijding van onderwijsachterstanden per
      leerling boven het aantal van 4 een basisbedrag toegekend, welk bedrag wordt verhoogd met een leeftijdsbedrag
      dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de school op 1 oktober van het
      voorafgaande schooljaar.

      4 Voor de berekening van het basisbedrag, bedoeld in het derde lid, en het leeftijdsbedrag, bedoeld in het derde
      lid, bedraagt de formatie per leerling 0,0401 formatieplaats.

      5 Voor de toepassing van het eerste en derde lid wordt voor het schooljaar waarin een nieuwe basisschool
      respectievelijk nieuwe speciale school voor basisonderwijs wordt geopend, het leeftijdsbedrag vermenigvuldigd met
      de geraamde landelijk gewogen gemiddelde leeftijd van de leraren van basisscholen respectievelijk van de leraren
      van speciale scholen voor basisonderwijs op 1 oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003862/2011-11-10#Artikel28
  - number: 28a
    text: |-
      1 Bij ministeriële regeling kunnen voor een periode van telkens 4 schooljaren impulsgebieden worden aangewezen op
      basis van viercijferige postcodegebieden.

      2 De hoofdvestigingen en nevenvestigingen van basisscholen gelegen in de impulsgebieden, bedoeld in het eerste
      lid, komen voor de bestrijding van onderwijsachterstanden in aanmerking voor een bij ministeriële regeling vast te
      stellen bedrag per leerling voor wie op grond van [artikel 27, eerste lid][ref1], een gewicht is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel27
