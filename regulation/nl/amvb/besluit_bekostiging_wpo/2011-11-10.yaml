  - number: 36a
    text: |-
      1 Indien Onze Minister van oordeel is dat een bevoegd gezag voor een of meer van zijn scholen als gevolg
      van factoren buiten de invloedssfeer van de school niet in staat is om de leerlinggegevens te leveren op
      de in [artikel 178a van de wet][ref1] bedoelde wijze, kan hij bepalen dat in de periode tot 1 augustus
      volgend op de datum van inwerkingtreding van dit artikel de levering van gegevens over het aantal leerlingen
      van de desbetreffende school of scholen ten behoeve van de vaststelling van de bekostiging, bedoeld
      in de [artikelen 12a, eerste en tweede lid][ref2], [18, eerste lid][ref3], [29, eerste lid][ref4], en
      [30, eerste lid][ref5], plaatsvindt op de in het vierde tot en met negende lid bedoelde wijze.

      2 De verplichting van het bevoegd gezag tot levering van de gegevens over het aantal leerlingen op de in het
      vierde tot en met negende lid bedoelde wijze vervalt zodra Onze Minister heeft bepaald dat het bevoegd gezag heeft
      aangetoond in staat te zijn de leerlinggegevens te leveren op de in [artikel 178a van de wet][ref6] bedoelde wijze.

      3 Bij ministeriële regeling kan worden bepaald dat het eerste en tweede lid van overeenkomstige toepassing zijn op
      de levering van gegevens over het aantal leerlingen in een of meer schooljaren vanaf 1 augustus volgend op de datum
      van inwerkingtreding van dit artikel.

      4 Indien het eerste lid van toepassing is, doet het bevoegd gezag ten behoeve van de bekostiging, bedoeld
      in de [artikelen 12a, eerste en tweede lid][ref7], [18, eerste lid][ref8], [29, eerste lid][ref9], en
      [30, eerste lid][ref10], voor de vijftiende dag van elke maand aan Onze Minister een opgave van het aantal
      leerlingen van de school op de eerste dag van die maand toekomen overeenkomstig het vijfde tot en met negende lid.

      5 De opgave, bedoeld in het vierde lid, is onderverdeeld in het aantal leerlingen in de leeftijd van 4 tot en met
      7 jaar enerzijds en het aantal leerlingen in de leeftijd van 8 jaar en ouder anderzijds. Indien in de opgave een
      nadere onderverdeling wordt gemaakt op grond van de volgende leden, wordt in die onderverdeling tevens melding
      gemaakt van de verdeling over de in de vorige volzin genoemde leeftijdscategorieën.

      6 De opgave, bedoeld in het vierde lid, voor basisscholen is onderverdeeld in de categorieën leerlingen,
      bedoeld in [artikel 27][ref11], en in de categorieën leerlingen met een niet-Nederlandse culturele achtergrond
      met uitzondering van leerlingen van wie ten minste een van de ouders of voogden afkomstig is uit Suriname, de
      Nederlandse Antillen of Aruba.

      7 De opgave, bedoeld in het vierde lid, voor speciale scholen voor basisonderwijs is onderverdeeld in leerlingen
      met een niet-Nederlandse culturele achtergrond en overige leerlingen.

      8 Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt de opgave, bedoeld
      in het vierde lid, tevens onderverdeeld in de leerlingen van de hoofdvestiging en de leerlingen van elk van de
      nevenvestigingen.

      9 Bij ministeriële regeling wordt vastgesteld op welke wijze de opgave, bedoeld in het vierde lid, wordt gedaan.


