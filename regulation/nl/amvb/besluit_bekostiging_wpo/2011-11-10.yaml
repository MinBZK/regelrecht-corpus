  - number: '29'
    text: |-
      1 Aan het bevoegd gezag van één of meer basisscholen wordt aanvullende bekostiging voor personeelskosten voor groei
      van de aantallen leerlingen toegekend indien:

      a. de som van de aantallen leerlingen op alle op 1 augustus van een schooljaar onder dat bevoegd gezag
      ressorterende basisscholen op de eerste schooldag dan wel op de eerste dag van een maand in de periode van
      september tot en met april van dat schooljaar met ten minste 13 is toegenomen ten opzichte van de som van 103% van
      de bedoelde aantallen leerlingen op 1 oktober van het voorafgaande schooljaar en vervolgens telkens indien de som
      van de bedoelde aantallen leerlingen op de eerste dag van enige maand in de periode september tot en met april van
      een schooljaar met ten minste 13 is toegenomen ten opzichte van de som van de aantallen leerlingen op grond waarvan
      de laatste maal in dat schooljaar aanvullende bekostiging voor personeelskosten in verband met groei is toegekend;
      en

      b. het persoonsgebonden nummer tezamen met de in artikel [178a, tweede lid, van de wet][ref1] bedoelde gegevens
      van de leerlingen die op de eerste schooldag dan wel de eerste dag van de maand, bedoeld in onderdeel a, op de
      school of scholen staan ingeschreven, uiterlijk vier weken na die dag zijn opgenomen in het basisregister onderwijs
      overeenkomstig [artikel 178b van de wet][ref2], dan wel van deze leerlingen opgave is gedaan aan Onze Minister
      overeenkomstig [artikel 36a, vierde lid][ref3].

      2 Bij de berekening van 103% van de bedoelde aantallen leerlingen, bedoeld in het eerste lid, onderdeel a, wordt de
      uitkomst per school naar beneden afgerond op een geheel getal.

      3 De aanspraak op de aanvullende bekostiging, bedoeld in het eerste lid, ontstaat met ingang van de maand waarin
      de telling, bedoeld in het eerste lid, onderdeel a, heeft plaatsgevonden, en wordt berekend voor het aantal
      leerlingen dat het verschil is tussen enerzijds de som van de aantallen leerlingen op alle op 1 augustus van het
      schooljaar onder dat bevoegd gezag ressorterende basisscholen en anderzijds de som van 103% van bedoelde aantallen
      leerlingen op 1 oktober van het voorafgaande schooljaar, onderscheidenlijk de som van bedoelde aantallen leerlingen
      op grond waarvan voor de laatste maal aanvullende bekostiging in verband met groei is toegekend. Indien de telling
      heeft plaatsgevonden op de eerste schooldag en deze in de maand september valt, ontstaat de aanspraak op de
      aanvullende bekostiging, bedoeld in het eerste lid, in afwijking van de eerste volzin, met ingang van 1 augustus.
      De aanvullende bekostiging wordt per bevoegd gezag per groeidatum éénmalig toegekend.

      4 De aanvullende bekostiging, bedoeld in het eerste lid, bedraagt een basisbedrag, welk bedrag wordt verhoogd
      met een leeftijdsbedrag dat wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van de
      leraren van basisscholen op 1 oktober van het voorafgaande schooljaar en vervolgens vermenigvuldigd met het aantal
      leerlingen, dat de uitkomst is van de berekening in het derde lid.

      5 Het bedrag dat de uitkomst is van het vierde lid wordt vermenigvuldigd met het aantal maanden vanaf de maand van
      toekenning tot het einde van het schooljaar en vervolgens gedeeld door twaalf.

      6 Voor de berekening van het basisbedrag, bedoeld in het vierde lid, en het leeftijdsbedrag, bedoeld in het vierde
      lid, bedraagt de formatie per leerling 0,0487 formatieplaats.


