  - number: '6'
    text: |-
      1 De directeur van een school draagt er zorg voor dat een overzichtelijke administratie van de inschrijving,
      de uitschrijving en het verzuim van de leerlingen op de school beschikbaar is alsmede van de gegevens van de
      leerlingen en hun ouders die noodzakelijk zijn voor de berekening van de bekostiging voor personeelskosten.
      Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen wordt in deze administratie een
      onderverdeling gemaakt naar leerlingen van de hoofdvestiging en leerlingen van elk van de nevenvestigingen en
      draagt de directeur er zorg voor dat de volledige administratie op de hoofdvestiging aanwezig is.

      2 Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de wijze waarop de leerlingenadministratie
      wordt ingericht.
    url: https://wetten.overheid.nl/BWBR0003862/2011-11-10#Artikel6
  - number: '7'
    text: |-
      1 De directeur van een school schrijft een leerling slechts in na overlegging van

      a. een bewijs van uitschrijving van de leerling van een andere school of een school of instelling voor ander
      onderwijs, welk bewijs op het moment van inschrijving niet ouder is dan 6 maanden, of

      b. een schriftelijke verklaring van de ouders dat de leerling binnen een periode van 6 maanden voorafgaand aan de
      inschrijving niet eerder op een andere school of een school of instelling voor ander onderwijs was ingeschreven.

      2 Het bewijs van uitschrijving dan wel de verklaring, bedoeld in het eerste lid, onderdeel *b*, wordt bewaard in de
      administratie van de school.

      3 De directeur doet in het geval, bedoeld in het eerste lid, onderdeel *a*, dan wel in het geval, bedoeld in het
      eerste lid, onderdeel *b*, indien hem bekend is op welke andere school of school of instelling voor ander onderwijs
      de leerling was ingeschreven buiten de in het eerste lid, onderdeel *b*, bedoelde periode, onder vermelding van de
      datum van inschrijving op zijn school, binnen 1 week schriftelijk mededeling van de inschrijving aan de directeur
      van de school of de school of instelling voor ander onderwijs waarop de leerling voordien was ingeschreven.

      4 De directeur schrijft de leerling in met ingang van de dag waarop de leerling de school voor het eerst bezoekt.

      5 In afwijking van het vierde lid, schrijft de directeur de leerling die de school voor het eerst bezoekt op de
      eerste schooldag van het schooljaar, in met ingang van 1 augustus van dat schooljaar, behoudens wanneer de leerling
      op 1 augustus de leeftijd van 4 jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0003862/2011-11-10#Artikel7
  - number: '8'
    text: |-
      1 De directeur van een school op wiens school de leerling staat ingeschreven, schrijft de leerling, indien deze de
      school verlaat, uit met ingang van de dag waarop de leerling de school voor het laatst heeft bezocht en verstrekt
      de leerling een bewijs van uitschrijving. De directeur schrijft de leerling die wordt uitgeschreven na de school op
      de laatste schooldag van het schooljaar te hebben bezocht, uit met ingang van 31 juli van dat schooljaar.

      2 Indien de directeur van een school op wiens school de leerling stond ingeschreven binnen 4 weken na de dag waarop
      de leerling de school voor het laatst heeft bezocht een mededeling ontvangt van de directeur, rector of centrale
      directie van een school of een school of instelling voor ander onderwijs, van de inschrijving van de leerling op
      diens school, wijzigt de directeur de datum van uitschrijving, bedoeld in het eerste lid, alsnog in de datum van de
      dag voorafgaande aan de inschrijving op de andere school of de school of instelling voor ander onderwijs.
    url: https://wetten.overheid.nl/BWBR0003862/2011-11-10#Artikel8
  - number: '9'
    text: |-
      1 De gegevens die in de leerlingenadministratie zijn opgenomen, blijven daarvan in ieder geval deel uitmaken
      gedurende 5 jaar nadat de desbetreffende leerling van de school is uitgeschreven.

      2 De gegevens die noodzakelijk zijn voor de berekening van de bekostiging voor personeelskosten, worden binnen acht
      weken na het verstrijken van de termijn, genoemd in het eerste lid, vernietigd.
    url: https://wetten.overheid.nl/BWBR0003862/2011-11-10#Artikel9
  - number: '10'
    text: |-
      1 Voor de toepassing van de wet worden, onverminderd [artikel 8][ref1], de leerlingen op een school meegeteld die
      op de teldatum op die school staan ingeschreven tenzij zij vanaf het begin van het schooljaar tot de teldatum meer
      dan de helft van het aantal schooldagen zonder geldige reden hebben verzuimd.

      2 Voor de toepassing van het eerste lid wordt ten aanzien van de leerplichtige leerling als geldige reden
      aangemerkt een vrijstelling van geregeld schoolbezoek als bedoeld in de [Leerplichtwet 1969][ref2] (*Stb.* 1971,
      406). Ten aanzien van de niet-leerplichtige leerling worden als geldige reden aangemerkt dezelfde gronden als die
      welke leiden tot een vrijstelling als bedoeld in de vorige volzin.

      3 Indien de teldatum valt op een dag waarop geen onderwijs wordt gegeven, worden op de eerstvolgende schooldag de
      leerlingen geteld, die op de teldatum stonden ingeschreven.

      4 Een leerling kan slechts op 1 school voor de bekostiging meetellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel8
