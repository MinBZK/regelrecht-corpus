  - number: '34.3'
    text: |-
      Indien het aantal leerlingen op basis waarvan de leerresultaten worden gemeten in een of meer schooljaren binnen
      een periode van 3 schooljaren minder is dan 10 wordt gebruik gemaakt van de toetsgegevens over 5 schooljaren.
    url: https://wetten.overheid.nl/BWBR0003862/2011-11-10#Artikel34.3
  - number: '34.4'
    text: |-
      1 Toetsen die voldoen aan de criteria, bedoeld in [artikel 34.1, eerste lid][ref1], worden opgenomen in een
      ministeriële regeling.

      2 Bij ministeriële regeling worden geregeld:

      a. voor elke toets als bedoeld in [artikel 34.1, eerste lid][ref2], de uitwerking van de wijze waarop de
      beoordeling tot stand komt;

      b. voor zover van toepassing, de wijze van correctie van de meting vanwege het feit dat de leerling is geïndiceerd
      voor leerwegondersteunend onderwijs;

      c. de wijze van correctie van de meting voor groepskenmerken en individuele kenmerken van leerlingen;

      d. voor zover van toepassing, de wijze van correctie van de meting voor leerlingen die een andere toets hebben
      afgelegd dan de andere leerlingen dan wel geen toets hebben afgelegd;

      e. wijze van beoordeling van de leerresultaten van kleine scholen;

      f. de normering waarop de inspectie het oordeel voldoende dan wel onvoldoende leerresultaat baseert.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel34.1
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel34.1
