      1 Basisscholen ontvangen voor de periode van 1 augustus 2000 tot en met 31 december 2000 eenmalig een aanvullende
      vergoeding voor de uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding, welke vergoeding
      wordt vastgesteld op 5/12 van het verschil tussen:

      a. de vergoeding op basis van het normatief bepaalde aantal te huisvesten groepen berekend volgens
      [artikel 14][ref1] zoals dat artikel luidde op de dag voorafgaand aan de inwerkingtreding van het
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________; en

      b. de vergoeding op basis van het normatief bepaalde aantal te huisvesten groepen leerlingen berekend
      volgens [artikel 14][ref3] zoals dat artikel luidt met ingang van de datum van inwerkingtreding van het
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________, met dien verstande dat:

      1°. de factor A, bedoeld in [artikel 14, tweede lid][ref5], als volgt wordt berekend:

      A = 7,76 x het aantal leerlingen in de leeftijd van 4 tot en met 7 jaar;

      2°. indien [artikel 134, zesde lid][ref6], van de wet van toepassing is: de toename van het aantal leerlingen op 1
      maart van het jaar waarover de vergoeding plaatsvindt, wordt meegeteld bij de berekening van factor A.

      2 Indien het verschil tussen de vergoeding, berekend op grond van het eerste lid, onder a, en de vergoeding,
      berekend op grond van het eerste lid, onder b, negatief is, wordt de aanvullende vergoeding op nul gesteld.

      3 [Artikel 134, zevende en achtste lid][ref7], van de wet is van overeenkomstige toepassing.


