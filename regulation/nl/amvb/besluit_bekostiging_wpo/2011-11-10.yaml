  - number: 34b
    text: |-
      Een in [artikel 34a, eerste lid][ref1], bedoelde correctie wordt, indien de correctie strekt tot verhoging van de
      bekostiging, binnen acht weken na de mededeling, bedoeld in [artikel 34a, eerste lid][ref2], door Onze Minister
      betaald.


