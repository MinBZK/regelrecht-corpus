  - number: '34.2'
    text: |-
      1 Bij de meting van leerresultaten als bedoeld in [artikel 10a van de wet][ref1], kan een correctie plaatsvinden
      met betrekking tot:

      a. leerlingen die zijn geïndiceerd voor leerwegondersteunend onderwijs als bedoeld in
      [artikel 10e van de Wet op het voortgezet onderwijs][ref2];

      b. leerlingen voor wie op grond van psychosociale of cognitieve gronden specifieke voorzieningen noodzakelijk
      zijn en zijn getroffen en voor wie een ontwikkelingsperspectief aan de hand van de voor hen geldende tussendoelen
      is opgesteld;

      c. leerlingen die in het zevende of achtste jaar zijn ingestroomd;

      d. leerlingen die een andere toets hebben afgelegd dan de andere leerlingen in dat schooljaar dan wel geen toets
      hebben afgelegd en op wie de onderdelen a, b en c niet van toepassing zijn;

      e. kleine scholen.

      2 In uitzonderlijke situaties kan een correctie plaatsvinden bij de meting van leerresultaten als bedoeld in
      [artikel 10a van de wet][ref3] voor leerlingen die niet vallen onder het eerste lid onder a tot en met d.


