      1 Het bevoegd gezag van een school doet jaarlijks voor 1 december aan Onze Minister mededeling van de gewogen
      gemiddelde leeftijd van de leraren van die school op 1 oktober daaraan voorafgaand.

      2 Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003862/2011-11-10#Artikel11a
  - number: 11b
    text: |-
      Het bevoegd gezag verstrekt gelijktijdig met de verklaring, bedoeld in [artikel 171, vierde lid, van de wet][ref1],
      een verklaring omtrent de juistheid en tijdige aanmelding van de gegevens waarop de bekostigingsbedragen zijn of
      worden gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
