      vindt, tenzij bij beschikking anders wordt bepaald, plaats in een aantal gelijke maandelijkse termijnen.

      3 De betaling van de bekostiging voor personeelskosten, bedoeld in [artikel 137, derde lid, van de wet][ref4] vindt
      plaats in twaalf gelijke maandelijkse termijnen.


