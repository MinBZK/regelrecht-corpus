        artikel: 10a
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 10a
  - number: '34.6'
    text: |-
      Indien er geen of onvoldoende gegevens zijn voor een betrouwbaar oordeel over de meting van de leerresultaten,
      verricht de inspectie een aanvullend onderzoek, volgens bij ministeriële regeling te geven voorschriften. Het
      aanvullend onderzoek kan onder meer omvatten:

      a. het verkrijgen van nadere gegevens van de school over de resultaten en de doorstroom van leerlingen;

      b. onderzoek en verificatie ter plekke.
    url: https://wetten.overheid.nl/BWBR0003862/2011-11-10#Artikel34.6
  - number: 34a
    text: |-
      1 Indien uit een op grond van [artikel 175, eerste of tweede lid, van de wet][ref1], ingesteld onderzoek blijkt
      dat de omvang van de bekostiging voor de uitgaven ten behoeve van de materiële instandhouding, de omvang van
      de bekostiging voor de personeelskosten, de omvang van enige bijzondere of aanvullende bekostiging onjuist is
      vastgesteld, kan Onze Minister tot uiterlijk één jaar na ontvangst van de bevindingen uit dat onderzoek correcties
      aanbrengen op de desbetreffende bekostiging. Onze Minister deelt het bevoegd gezag uiterlijk één jaar na ontvangst
      van deze bevindingen schriftelijk mede of en zo ja welke correcties hij aanbrengt.

      2 Indien uit het jaarverslag, bedoeld in [artikel 171 van de wet][ref2], uit de verklaring van de accountant,
      bedoeld in [artikel 171, vierde lid, van de wet][ref3] of uit een op grond van [artikel 175 van de wet][ref4]
      ingesteld onderzoek blijkt dat de bekostiging voor een school onrechtmatig is besteed, kan Onze Minister bepalen
      dat het desbetreffende gedeelte van de bekostiging niet ten laste komt van het Rijk of dat de daarmee gemoeide
      bedragen in mindering worden gebracht op de bekostiging. Onze Minister doet hiervan binnen een jaar na ontvangst
      van het jaarverslag, respectievelijk binnen een jaar na ontvangst van de bevindingen uit dat onderzoek schriftelijk
      mededeling aan het bevoegd gezag.

      3 Indien daarvoor naar zijn oordeel aanleiding is, kan Onze Minister de in het eerste lid bedoelde termijnen
      waarbinnen correcties kunnen worden aangebracht alsmede de in het tweede lid bedoelde termijn met ten hoogste een
      jaar verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel175
    url: https://wetten.overheid.nl/BWBR0003862/2011-11-10#Artikel34a
