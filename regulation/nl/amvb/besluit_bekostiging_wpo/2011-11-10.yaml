  - number: 3b
    text: |-
      1 Aan het bevoegd gezag van een nieuw geopende school wordt, in afwachting van de vaststelling van de bekostiging
      voor personeelskosten en de bekostiging voor de uitgaven voor de materiële voorzieningen ten behoeve van de
      instandhouding op basis van de gegevens op de teldatum, een voorschot op de bedoelde bekostiging verstrekt indien
      het bevoegd gezag uiterlijk op 1 juli voorafgaande aan het schooljaar waarin de bekostiging van een nieuw geopende
      school begint, het vermoedelijk aantal leerlingen op 1 oktober volgend op de datum van ingang van de bekostiging
      aan Onze Minister meldt.

      2 Het voorschot, bedoeld in het eerste lid, bestaat uit:

      a. de bekostiging, bedoeld in [artikel 137, eerste lid, van de wet][ref1], berekend overeenkomstig dit besluit, met
      dien verstande dat wordt gerekend met het aantal leerlingen, bedoeld in het eerste lid; en

      b. de bekostiging, bedoeld in [artikel 134 van de wet][ref2], berekend overeenkomstig dit besluit, met dien
      verstande dat wordt gerekend met het aantal leerlingen, bedoeld in het eerste lid.

      3 Op de betaling van het voorschot zijn [artikel 13][ref3] en [artikel 19][ref4] van overeenkomstige toepassing.

      4 Onze Minister is bevoegd tot verrekening van verstrekte voorschotten met de betalingen die voortvloeien uit de
      vaststelling van de onderscheiden onderdelen van de bekostiging.

      5 Indien Onze Minister een voorschot verleent in gevallen waarin de bekostiging wegens niet aan het bevoegd gezag
      van een school toe te rekenen omstandigheden niet tijdig kan worden vastgesteld, zijn het derde en het vierde lid
      van overeenkomstige toepassing.


