  - number: '34.1'
    text: |-
      1 De leerresultaten, bedoeld in [artikel 10a, van de wet][ref1] worden gemeten aan de hand van de door het bevoegd
      gezag gekozen toetsen, indien die toetsen:

      a. kennis en vaardigheden van ten minste rekenen en wiskunde en Nederlandse taal meten;

      b. voldoen aan het kwaliteitsoordeel betreffende validiteit en betrouwbaarheid van een onafhankelijke commissie;

      c. gegevens bevatten om schoolvorderingen te meten;

      d. landelijk genormeerd kunnen worden; en

      e. zijn afgenomen in overeenstemming met de afnameaanwijzingen, die zijn opgenomen in de toetshandleiding bij de
      desbetreffende toets.

      2 Bij de beoordeling van de toetsresultaten hanteert de inspectie objectieve, relatieve normen. De grenzen die
      de inspectie als norm voor het oordeel voldoende dan wel onvoldoende resultaat hanteert, zijn gecorrigeerd voor
      groepskenmerken en individuele kenmerken van leerlingen, met dien verstande dat deze correctie in elk geval
      betrekking heeft op leerlingen als bedoeld in [artikel 27, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003862#Artikel27
