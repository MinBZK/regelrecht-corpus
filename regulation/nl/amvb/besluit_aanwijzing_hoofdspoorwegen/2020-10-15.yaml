preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 14 december 2004, nr. HDJZ/S&W/2004-3064,
    Hoofddirectie Juridische Zaken;

    Gelet op de artikelen 2, eerste lid, en 124 van de Spoorwegwet en de artikelen 1, eerste lid, en 2, eerste lid, van
    de wet van 9 juli 1900, houdende nadere regeling van den dienst en het gebruik van spoorwegen, waarop uitsluitend
    met beperkte snelheid wordt vervoerd (Stb. 118);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017794/2020-10-15#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Als hoofdspoorweg worden aangewezen de spoorwegen, genoemd in de bij dit besluit behorende [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017794
    url: https://wetten.overheid.nl/BWBR0017794/2020-10-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017794
  - number: '1.2'
    text: |-
      Als hoofdspoorwegen worden tevens aangewezen de in onderdeel a van [bijlage 2][ref1] bij dit
      besluit genoemde spoorwegen en de berijdbare delen van de spoorwegen gelegen op de in onderdeel b
      van [die bijlage][ref2] genoemde locaties. Deze spoorwegen vallen onder het toepassingsbereik van
      [artikel 20, vierde lid, van de Spoorwegwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017794
      [ref2]: https://wetten.overheid.nl/BWBR0017794
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel20
