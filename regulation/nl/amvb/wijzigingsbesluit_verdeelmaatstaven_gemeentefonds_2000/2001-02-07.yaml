preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 5 juli 2000, FO2000/U75924,
    gedaan mede namens de Staatssecretaris van Financiën;

    Gelet op artikel 8, derde lid, van de Financiële-verhoudingswet;

    De Raad van State gehoord (advies van 11 augustus 2000, nr. W04.00.0282/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 25 september 2000, nr.
    FO2000/U83349, mede namens de Staatssecretaris van Financiën;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011693/2001-02-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In plaats van de verdeelmaatstaven die zijn vermeld in de tabelregels 8, 14 en 26 van
      [bijlage 2 van de Invoeringswet Financiële-verhoudingswet][ref1] worden de desbetreffende maatstaven gehanteerd
      die in de bijlage bij dit besluit zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008291
    url: https://wetten.overheid.nl/BWBR0011693/2001-02-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008291
  - number: '2'
    text: |-
      Voor gemeenten waar een wijziging van de gemeentelijke indeling heeft plaatsgevonden, als bedoeld in de
      [Wet algemene regels herindeling][ref1], en waar ten gevolge van deze wijziging twee of meer gemeenten zijn
      samengevoegd tot één gemeente, en de datum van samenvoeging 1 januari 2000 is, geldt in afwijking van de maatstaf
      die is vermeld in tabelregel 34 van [bijlage 2 van de Invoeringswet Financiële-verhoudingswet][ref2], de maatstaf
      die wordt toegevoegd in tabelregel 35 van de bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003718
      [ref2]: https://wetten.overheid.nl/BWBR0008291
    url: https://wetten.overheid.nl/BWBR0011693/2001-02-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003718
      - id: ref2
        bwb_id: BWBR0008291
  - number: '3'
    text: |-
      Gemeenten waar een wijziging van de gemeentelijke indeling heeft plaatsgevonden, als bedoeld in de
      [Wet algemene regels herindeling][ref1], en waar ten gevolge van deze wijziging twee of meer gemeenten zijn
      samengevoegd tot één gemeente, en de datum van deze samenvoeging 1 januari 1998 of 1999 is, ontvangen een
      aanvulling op de gewenningsbijdrage die hen toekomt op grond van de verdeelmaatstaf, opgenomen in tabelregel 34 van
      [bijlage 2 van de Invoeringswet Financiële-verhoudingswet][ref2]. Deze aanvulling wordt berekend als volgt:

      (a+(bx2)-c):3

      waarbij:

      a = het bedrag dat de gemeente zou toekomen op grond van de berekening van de verdeelmaatstaf opgenomen in
      tabelregel 35 eerste lid van de bijlage bij dit besluit, indien deze van overeenkomstige toepassing zou zijn
      geweest in het jaar van samenvoeging;

      b = de som van de bedragen die in het jaar van de samenvoeging zouden zijn ontvangen op grond van de
      verdeelmaatstaven die zijn opgenomen in de tabelregels 17, 18 en 19, indien de samenvoeging niet had
      plaatsgevonden;

      c = het bedrag dat de gemeente die door de samenvoeging is ontstaan toekomt op grond van de verdeelmaatstaf
      opgenomen in tabelregel 34 zoals deze luidde op de datum van de samenvoeging, gesommeerd over de jaren waarin deze
      maatstaf voor de betrokken gemeente geldt.

      Een negatieve uitkomst wordt op nul gesteld.

      Het berekende bedrag wordt in de jaren 2000, 2001 en 2002, voorafgaand aan de vaststelling van de algemene
      uitkering, toegevoegd aan het berekende uitkeringsbedrag voor de desbetreffende gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003718
      [ref2]: https://wetten.overheid.nl/BWBR0008291
    url: https://wetten.overheid.nl/BWBR0011693/2001-02-07#Artikel3
