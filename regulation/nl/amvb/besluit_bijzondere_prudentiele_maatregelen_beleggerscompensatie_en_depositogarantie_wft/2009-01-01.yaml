  - number: '27'
    text: |-
      1 De Nederlandsche Bank betaalt zo spoedig mogelijk, doch in elk geval binnen drie maanden na het tijdstip
      waarop de aanvrager de aanvraag heeft ingediend, het op grond van [artikel 25][ref1] vastgestelde bedrag aan die
      aanvrager.

      2 De betaling vindt plaats op een door de aanvrager aangewezen rekening bij een bank met zetel in een lidstaat of
      bij een in een lidstaat gelegen bijkantoor van een bank met zetel in een staat die geen lidstaat is.

      3 De betaling vindt slechts plaats indien de aanvrager eventuele rechten tot teruggave of terugbetaling van
      financiële instrumenten jegens derden tot de hoogte van het uitbetaalde bedrag overdraagt aan de Nederlandsche
      Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel25
