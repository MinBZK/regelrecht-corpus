        artikel: 3:132
  - number: '4'
    text: |-
      1 Een saneringsplan als bedoeld in [artikel 3:136, eerste lid, van de wet][ref1] vermeldt op welke wijze en
      binnen welke termijn de solvabiliteitsmarge weer op de vereiste omvang zal worden gebracht. Indien ingevolge
      [artikel 3:132, eerste lid, van de wet][ref2] een herstelplan is vastgesteld waaraan instemming is verleend,
      vermeldt het saneringsplan tevens hoe het herstelplan daarin wordt verwerkt.

      2 Een financieringsplan als bedoeld in [artikel 3:136, tweede lid, van de wet][ref3] vermeldt op welke wijze
      en binnen welke termijn de solvabiliteitsmarge weer op de vereiste omvang zal worden gebracht. Indien ingevolge
      [artikel 3:136, eerste lid, van de wet][ref4] een saneringsplan is vastgesteld waaraan instemming is verleend,
      vermeldt het financieringsplan tevens hoe het saneringsplan daarin wordt verwerkt.


