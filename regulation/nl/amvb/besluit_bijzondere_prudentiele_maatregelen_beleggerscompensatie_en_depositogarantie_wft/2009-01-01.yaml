  - number: '19'
    text: |-
      Indien de Nederlandsche Bank op grond van [artikel 3:260, eerste lid, van de wet][ref1] heeft besloten tot het in
      werking stellen van het depositogarantiestelsel, komen vorderingen van de hierna te noemen categorieën van personen
      voor voldoening overeenkomstig deze paragraaf in aanmerking:

      a. personen die deposito’s op eigen naam en voor eigen rekening bij de betalingsonmachtige bank aanhouden;

      b. personen die tezamen met een persoon als bedoeld in onderdeel a op eigen naam al dan niet voor eigen rekening
      deposito’s bij de betalingsonmachtige bank aanhouden;

      c. derden ten behoeve van wie een persoon als bedoeld in onderdeel a of b krachtens overeenkomst of wet op eigen
      naam deposito’s bij de betalingsonmachtige bank aanhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3260
    url: https://wetten.overheid.nl/BWBR0020414/2009-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:260
  - number: '20'
    text: |-
      1 Voor voldoening ingevolge het depositogarantiestelsel komen in aanmerking vorderingen uit deposito’s, met
      uitzondering van vorderingen uit deposito’s als bedoeld in [bijlage B][ref1], die de betalingsonmachtige bank aan
      de personen, bedoeld in [artikel 19][ref2], verschuldigd is of die hen toebehoren en die de betalingsonmachtige
      bank voor hen overeenkomstig de wettelijke en contractuele voorwaarden houdt.

      2 Vorderingen van een derde als bedoeld in [artikel 19, onderdeel c][ref3], komen slechts voor voldoening in
      aanmerking indien de identiteit van de derde is of kan worden vastgesteld voordat de Nederlandsche Bank heeft
      geconstateerd dat de bank betalingsonmachtig is als bedoeld in [artikel 3:260, tweede lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020414
