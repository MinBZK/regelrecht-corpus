  - number: '22'
    text: |-
      1 De Nederlandsche Bank stelt, ambtshalve of op verzoek van representatieve vertegenwoordigingen, na overleg met
      deze vertegenwoordigingen het voor elke bank geldende omslagpercentage vast aan de hand van de door elke bank
      aangehouden deposito’s voor zover zij voor voldoening ingevolge het depositogarantiestelsel in aanmerking zouden
      komen. In aanmerking worden genomen de deposito’s die worden aangehouden op de datum van de laatste door die
      bank aan de Nederlandsche Bank overgelegde balans voorafgaand aan het tijdstip waarop de Nederlandsche Bank tot
      de toepassing van het depositogarantiestelsel met betrekking tot de betalingsonmachtige bank heeft besloten. Na
      overleg met representatieve vertegenwoordigingen bepaalt de Nederlandsche Bank welke posten op deze overgelegde
      balans voor deze berekening in aanmerking worden genomen. Daarbij wordt het totaalbedrag van deze posten van
      elke bank gedeeld door het totaalbedrag van deze posten van alle banken gezamenlijk en het verkregen getal
      vermenigvuldigd met 100 procent. Hierbij worden de gegevens van de betalingsonmachtige bank niet meegeteld.

      2 Indien de Nederlandsche Bank ingevolge [artikel 21, zevende lid][ref1], heeft bepaald dat bijdragen beneden een
      door haar vast te stellen bedrag niet behoeven te worden voldaan, stelt de Nederlandsche Bank bepaalt op basis
      van het omslagpercentage, bedoeld in het eerste lid, welke banken op grond van [artikel 21, zevende lid][ref2],
      geen bijdrage behoeven te voldoen. Indien de Nederlandsche Bank vaststelt dat een of meer banken geen bijdrage
      behoeven te voldoen, stelt de Nederlandsche Bank een nieuw omslagpercentage vast, dat het omslagpercentage,
      bedoeld in het eerste lid, vervangt. Hiervoor herhaalt de Nederlandsche Bank de berekening, bedoeld in het
      eerste lid, met dien verstande dat de gegevens van de betalingsonmachtige bank en van de banken die op grond van
      [artikel 21, zevende lid][ref3], geen bijdrage behoeven te voldoen, niet worden meegeteld.

      3 De Nederlandsche Bank kan een voorlopige bijdrage vaststellen. Daarvan dient 70 procent bij wijze van voorschot
      aan de Nederlandsche Bank te worden betaald. Betaalde voorschotten worden met de definitieve bijdragen verrekend.
      [Artikel 3:262, tweede volzin, van de wet][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0020414#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3262
