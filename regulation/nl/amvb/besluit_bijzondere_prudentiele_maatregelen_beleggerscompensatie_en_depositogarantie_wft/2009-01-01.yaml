    text: |-
      1 Onverminderd [artikel 16][ref1] voorziet de Nederlandsche Bank gedurende de periode dat het doelvermogen
      van het compensatiefonds niet bereikt is, doch uiterlijk tot en met 31 december 2008, in een renteloos
      voorschot ten behoeve van uitkeringen die ten laste van het compensatiefonds komen op grond van
      [artikel 13, eerste lid, onder a][ref2].

      2 Het in het eerste lid bedoelde voorschot betreft een bedrag dat door de Nederlandsche Bank wordt
      vastgesteld en maximaal € 1 miljoen bedraagt. Dit voorschot wordt, voorafgaand aan een omslag als bedoeld in
      [artikel 13, eerste lid, onderdeel b][ref3], beschikbaar gesteld indien het compensatiefonds door een uitkering in
      de zin van [artikel 13, eerste lid, onderdeel a][ref4], uitgeput is geraakt.

      3 Een uitgekeerd renteloos voorschot als bedoeld in het eerste lid wordt aan de Nederlandsche Bank terugbetaald
      door de financiële ondernemingen, bedoeld in [artikel 16, vierde lid][ref5], na 1 januari 2009. De Nederlandsche
      Bank stelt, na overleg met representatieve vertegenwoordigingen, de modaliteiten omtrent de terugbetaling van dit
      renteloos voorschot vast, waarbij zij er voor zorgt dat de in [artikel 17][ref6] beschreven maximumbijdrage per
      kalenderjaar voor een financiële onderneming als bedoeld in [artikel 8][ref7] niet wordt overschreden.


