  - number: '29'
    text: |-
      1 De Nederlandsche Bank verhaalt, voorzover mogelijk, de aan haar ingevolge
      [artikel 27, vierde lid, onderdeel b,][ref1] overgedragen vorderingen of de rechten waarin zij overeenkomstig
      [artikel 3:261, derde lid, van de wet][ref2] is getreden, op de betalingsonmachtige financiële onderneming.

      2 De baten die door de Nederlandsche Bank worden ontvangen ingevolge het in het eerste lid bedoelde verhaal,
      worden door haar uitgekeerd aan de financiële ondernemingen die op grond van de [artikelen 11][ref3], [13][ref4] of
      [21][ref5] een bijdrage hebben gedaan. Bij de uitkering zal het vastgestelde omslagpercentage worden gebruikt.


