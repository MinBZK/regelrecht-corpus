  - number: '7'
    text: |-
      1 De Nederlandsche Bank stelt, gehoord de vertrouwenscommissie, een vergoedingsplan voor de opvang vast.

      2 Onverminderd de bevoegdheden die in [Boek 2 van het Burgerlijk Wetboek][ref1] worden toegekend aan de organen
      van de opvanginstelling, vindt de uitkering van dividend en de teruggave van kapitaal aan de aandeelhouders van
      de opvanginstelling, alsmede de rentevergoeding voor en de terugbetaling van de aan de opvanginstelling verstrekte
      achtergestelde lening plaats volgens het vergoedingsplan.

      3 De Nederlandsche Bank kan, indien dringende omstandigheden dit vergen en gehoord de vertrouwenscommissie, het
      vergoedingsplan wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020414/2009-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '8'
    text: |-
      1 Het beleggerscompensatiestelsel is van toepassing op:

      a. financiële ondernemingen die een vergunning als bedoeld in [artikel 2:11 van de wet][ref1] hebben voor het
      uitoefenen van het bedrijf van bank en waaraan het is toegestaan beleggingsdiensten te verlenen op grond van
      [artikel 2:97, eerste lid, onderdeel c, van de wet][ref2];

      b. financiële ondernemingen die een vergunning hebben als bedoeld in
      [artikel 2:65, eerste lid, aanhef en onderdeel a, van de wet][ref3], voor zover het betreft het beheren van
      individuele vermogens, of als bedoeld in [artikel 2:96 van de wet][ref4] voor zover het betreft het verlenen van
      beleggingsdiensten;

      c. financiële ondernemingen die een verklaring van ondertoezichtstelling als bedoeld in
      [artikel 3:110 van de wet][ref5] hebben en waaraan het is toegestaan beleggingsdiensten te verlenen op grond van
      [artikel 2:97, eerste lid, onderdeel b, van de wet][ref6];

      d. financiële ondernemingen als bedoeld in [artikel 3:266, eerste lid, onderdelen a en c, van de wet][ref7],
      voorzover het betreft hun vanuit een in Nederland gelegen bijkantoor uitgeoefende bedrijf; en

      e. financiële ondernemingen ten aanzien waarvan een besluit is genomen als bedoeld in
      [artikel 3:267, eerste lid, van de wet][ref8], voorzover het hun vanuit een in Nederland gelegen bijkantoor
      uitgeoefende bedrijf betreft.

      2 Het beleggerscompensatiestelsel is niet van toepassing op financiële ondernemingen die uitsluitend
      beleggingsactiviteiten verrichten als bedoeld in [artikel 1:1 van de wet][ref9] en financiële ondernemingen die
      uitsluitend beleggingsdiensten verlenen als bedoeld in onderdeel d van de definitie van het verlenen van een
      beleggingsdienst in [artikel 1:1 van de wet][ref10].


