      van toepassing, het derde lid te vermenigvuldigen met het bedrag, bedoeld in [artikel 13, tweede lid][ref2].

      2 De Nederlandsche Bank stelt, ambtshalve of op verzoek van representatieve vertegenwoordigingen, na overleg
      met deze vertegenwoordigingen, het voor iedere financiële onderneming, bedoeld in [artikel 8, eerste lid][ref3],
      geldende omslagpercentage vast aan de hand van de door deze financiële onderneming aan de Nederlandsche
      Bank overgelegde geconsolideerde balans voorafgaand aan het tijdstip waarop betalingsonmacht als bedoeld
      in [artikel 3:260, tweede lid, van de wet][ref4] door de Nederlandsche Bank is geconstateerd. Na overleg
      met representatieve vertegenwoordigingen bepaalt de Nederlandsche Bank nader welke bedrijfseconomische
      balansen gebruikt worden en welke posten uit deze balansen voor deze berekening in aanmerking worden genomen.
      Daarbij wordt het totaalbedrag van deze posten van elke financiële onderneming gedeeld door het totaalbedrag
      van deze posten van alle financiële ondernemingen gezamenlijk en het verkregen getal vermenigvuldigd met
      100 procent. Hierbij worden de gegevens van de betalingsonmachtige financiële onderneming, bedoeld in
      [artikel 3:260, tweede lid, van de wet][ref5], niet meegeteld.

      3 Indien de Nederlandsche Bank ingevolge [artikel 13, zevende lid][ref6], heeft bepaald dat bijdragen beneden
      een door haar vast te stellen bedrag niet behoeven te worden voldaan, stelt de Nederlandsche Bank vast,
      op basis van het omslagpercentage, bedoeld in het tweede lid, welke financiële ondernemingen op grond van
      [artikel 13, zevende lid][ref7], geen bijdrage behoeven te voldoen. Indien de Nederlandsche Bank vaststelt
      dat een of meer financiële ondernemingen geen bijdrage behoeven te voldoen, stelt de Nederlandsche Bank
      een nieuw omslagpercentage vast, dat het omslagpercentage, bedoeld in het tweede lid, vervangt. Hiervoor
      herhaalt de Nederlandsche Bank de berekening, bedoeld in het tweede lid, met dien verstande dat de gegevens
      van de betalingsonmachtige financiële onderneming en van de financiële ondernemingen die op grond van
      [artikel 13, zevende lid][ref8], geen bijdrage behoeven te voldoen, niet worden meegeteld.

      4 De Nederlandsche Bank kan een voorlopige bijdrage vaststellen. Van de voorlopig vastgestelde bijdrage betalen
      financiële ondernemingen als bedoeld in het eerste lid 70 procent bij wijze van voorschot aan de Nederlandsche
      Bank. Betaalde voorschotten worden met de definitieve bijdragen verrekend. Financiële ondernemingen als bedoeld in
      het eerste lid voldoen de voorschotten binnen een door de Nederlandsche Bank vastgestelde termijn.


