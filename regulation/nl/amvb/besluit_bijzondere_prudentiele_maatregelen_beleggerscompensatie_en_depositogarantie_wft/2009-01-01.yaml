  - number: '28'
    text: |-
      Indien een aanvrager strafrechtelijk wordt vervolgd ter zake van een misdrijf dat voortvloeit uit of verband
      houdt met het witwassen van geld kan de Nederlandsche Bank de termijnen, bedoeld in het eerste lid en in
      [artikel 27, tweede lid][ref1], opschorten. Deze opschorting eindigt zodra de vervolging is beëindigd of de
      beslissing van de bevoegde rechterlijke instantie onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel27
