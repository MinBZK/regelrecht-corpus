  - number: '16'
    text: |-
      1 De Stichting Beleggers Compensatiefonds draagt zorg voor het beheer en de instandhouding van een compensatiefonds
      dat is bestemd voor het aan de Nederlandsche Bank vergoeden van bedragen die deze heeft uitgekeerd ingevolge het
      beleggerscompensatiestelsel.

      2 De Nederlandsche Bank is bevoegd om, na overleg met representatieve vertegenwoordigingen, de statuten van de
      Stichting Beleggers Compensatiefonds te wijzigen.

      3 Wijziging van de statuten behoeft de goedkeuring van Onze Minister. Onze Minister kan goedkeuring weigeren in het
      belang van een goede uitvoering van het beleggerscompensatiestelsel of wegens onverenigbaarheid van de gewijzigde
      statuten met de [wet][ref1] of dit besluit.

      4 Het compensatiefonds wordt gevormd door bijdragen van de financiële ondernemingen, bedoeld in
      [artikel 8, eerste lid][ref2], die geen bank zijn en heeft een doelvermogen van € 11,3 miljoen.

      5 De Nederlandsche Bank stelt periodiek, na overleg met representatieve vertegenwoordigingen, de omvang
      van de noodzakelijk geachte totale bijdrage aan het compensatiefonds vast. Indien het doelvermogen van het
      compensatiefonds niet is bereikt, bedraagt de omvang van de totale bijdrage aan het compensatiefonds jaarlijks
      ten minste € 750.000. Wanneer de Nederlandsche Bank, na overleg met representatieve vertegenwoordigingen, besluit
      tot een verhoging van de bijdrage, wordt deze verhoging ineens opgelegd of over een door haar te bepalen periode
      gespreid. De door de Nederlandsche Bank vastgestelde totale bijdrage wordt over de in het vierde lid bedoelde
      financiële ondernemingen omgeslagen.

      6 Onverminderd het hiervoor bepaalde, wordt bij het bepalen van de omvang van de totale bijdrage een voor alle
      in het vierde lid bedoelde financiële ondernemingen gelijke heffing vastgesteld, vermeerderd met een variabel
      bedrag dat voor de afzonderlijke financiële ondernemingen wordt berekend naar rato van het aantal personen
      wier vorderingen ingevolge [artikel 9][ref3] voor voldoening in aanmerking komen per financiële onderneming.
      [Artikel 14, tweede lid][ref4], is van overeenkomstige toepassing.

      7 De Nederlandsche Bank kan ten aanzien van een instelling die na de inwerkingtreding van dit besluit financiële
      onderneming wordt als bedoeld in [artikel 8][ref5] bepalen dat deze financiële onderneming, gedurende een alsdan
      vast te stellen termijn en frequentie, een bijdrage doet, waarvan de omvang door de Nederlandsche Bank wordt
      vastgesteld.

      8 Indien het vermogen van het compensatiefonds het doelvermogen overschrijdt, kan de Nederlandsche Bank, na overleg
      met representatieve vertegenwoordigingen, het meerdere overeenkomstig een door haar vast te stellen verdeelsleutel
      laten uitkeren aan de financiële ondernemingen, bedoeld in het vierde lid.


