  - number: '17'
    text: |-
      1 Het in enig kalenderjaar door een bank ingevolge [artikel 11, eerste lid][ref1] en [13, tweede lid][ref2], te
      betalen bedrag, vermeerderd met het op grond van [paragraaf 6.2][ref3] te betalen bedrag, is niet groter dan vijf
      procent van haar eigen vermogen. Een eventueel excedent wordt door de Nederlandsche Bank renteloos voorgeschoten.

      2 Het in enig kalenderjaar door een financiële onderneming die geen bank is, ingevolge
      [artikel 13, eerste en tweede lid][ref4] en [artikel 16, vijfde lid][ref5], te betalen bedrag is niet groter
      dan drie procent van haar eigen vermogen. Een eventueel excedent wordt door de Nederlandsche Bank renteloos
      voorgeschoten.

      3 Indien de solvabiliteits- of liquiditeitspositie van een bank, of de solvabiliteitspositie van een
      beleggingsonderneming daartoe aanleiding geeft, kan de Nederlandsche Bank voor die bank, onderscheidenlijk
      beleggingsonderneming, een lager percentage vaststellen.


