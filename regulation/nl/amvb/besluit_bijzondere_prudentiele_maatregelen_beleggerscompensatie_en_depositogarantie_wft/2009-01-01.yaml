  - number: '25'
    text: |-
      1 De Nederlandsche Bank stelt het bestaan en de waarde van de ingediende vorderingen vast aan de hand van
      de op de vorderingen toepasselijke wettelijke bepalingen en contractuele voorwaarden, de boekhouding van de
      betalingsonmachtige financiële onderneming en eventuele andere relevante documenten.

      2 De Nederlandsche Bank baseert zich bij de waardevaststelling van vorderingen die in vreemde valuta luiden op
      de referentiekoersen van de Europese Centrale Bank zoals deze golden op de dag waarop de Nederlandsche Bank de
      betalingsonmacht constateerde.
    url: https://wetten.overheid.nl/BWBR0020414/2009-01-01#Artikel25
  - number: '26'
    text: |-
      1 Vorderingen als bedoeld in [artikel 10, eerste lid, aanhef en onderdeel a][ref1], of
      [artikel 20, eerste lid][ref2], die door de Nederlandsche Bank zijn vastgesteld, worden voldaan in de vorm van
      terugbetaling tot het in het vierde lid genoemde maximum.

      2 Vorderingen als bedoeld in [artikel 10, eerste lid, onderdeel b][ref3], die door de Nederlandsche
      Bank zijn vastgesteld, worden voorzover mogelijk voldaan door het teruggeven van de in
      [artikel 10, eerste lid, onderdeel b][ref4], genoemde financiële instrumenten. Indien dit niet mogelijk is, wordt
      de vordering in geld voldaan tot het in het vierde lid genoemde maximum. In het laatste geval wordt de waarde van
      de vordering, tenzij wettelijk of contractueel anders is bepaald, vastgesteld op de marktwaarde van de financiële
      instrumenten op het tijdstip waarop de Nederlandsche Bank de betalingsonmacht bij de financiële onderneming
      constateerde.

      3 Bij het vaststellen van de waarde van een vastgestelde vordering houdt de Nederlandsche Bank rekening met
      mogelijke bevoegdheden om die vordering en andere vorderingen onderling op grond van de [wet][ref5] of overeenkomst
      te verrekenen.

      4 Voor voldoening komen in aanmerking vorderingen tot maximaal € 20.000 per persoon als bedoeld in
      [artikel 9][ref6] per betalingsonmachtige financiële onderneming en vorderingen tot maximaal € 40.000 per persoon
      als bedoeld in [artikel 19][ref7] per betalingsonmachtige financiële onderneming, met dien verstande dat de
      vorderingen van personen als bedoeld in [artikel 19][ref8] voor het gedeelte boven € 20.000 tot 90 procent worden
      voldaan.

      5 Tenzij contractueel is bepaald dat de personen, bedoeld in [artikel 9, onderdeel b][ref9], of
      [19, onderdeel b][ref10], in een andere verhouding gerechtigd zijn tot de vorderingen, ontvangen zij ieder een
      vergoeding ter grootte van een evenredig deel van het totaal van de vastgestelde vorderingen met inachtneming van
      hetgeen in het tweede lid is bepaald.

      6 Is er meer dan een derde als bedoeld in [artikel 9, onderdeel c][ref11], of [19, onderdeel c][ref12], dan wordt
      het aandeel van elk van hen en de vergoeding als bedoeld in het tweede lid aan elk van hen berekend op de voet van
      het vijfde lid van dit artikel.

      7 Onze Minister kan besluiten dat, in afwijking van het vierde lid, andere maxima gelden voor de voor voldoening in
      aanmerking komende vorderingen. Onze Minister maakt het besluit daartoe bekend in de Staatscourant.


