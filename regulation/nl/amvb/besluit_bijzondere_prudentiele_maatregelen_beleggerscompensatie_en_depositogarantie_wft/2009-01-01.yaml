  - number: '9'
    text: |-
      Indien de Nederlandsche Bank op grond van [artikel 3:260, eerste lid, van de wet][ref1] heeft besloten tot het
      in werking stellen van het beleggerscompensatiestelsel, komen vorderingen van de hierna te noemen categorieën
      van personen voor zover deze personen niet behoren tot een van de in [bijlage A][ref2] bij dit besluit genoemde
      categorieën, voor voldoening overeenkomstig dit hoofdstuk in aanmerking:

      a. personen die in verband met beleggingsdiensten op eigen naam en voor eigen rekening geld of financiële
      instrumenten aan de betalingsonmachtige financiële onderneming hebben toevertrouwd;

      b. personen die tezamen met een persoon als bedoeld in onderdeel a op eigen naam al dan niet voor eigen rekening
      geld of financiële instrumenten in verband met beleggingsdiensten aan de betalingsonmachtige financiële onderneming
      hebben toevertrouwd; en

      c. derden ten behoeve van wie een persoon als bedoeld in onderdeel a of b, niet zijnde een beleggingsinstelling,
      krachtens overeenkomst of wet op eigen naam geld of financiële instrumenten in verband met beleggingsdiensten aan
      de betalingsonmachtige financiële onderneming heeft toevertrouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3260
      [ref2]: https://wetten.overheid.nl/BWBR0020414
    url: https://wetten.overheid.nl/BWBR0020414/2009-01-01#Artikel9
