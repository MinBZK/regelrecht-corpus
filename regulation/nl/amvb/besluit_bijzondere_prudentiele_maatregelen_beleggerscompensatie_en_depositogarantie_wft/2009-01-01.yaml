        bwb_id: BWBR0010134
  - number: '33'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020414/2009-01-01#Artikel33
  - number: '34'
    text: |-
      Dit besluit wordt aangehaald als: Besluit bijzondere prudentiële maatregelen, beleggerscompensatie en
      depositogarantie Wft.
    url: https://wetten.overheid.nl/BWBR0020414/2009-01-01#Artikel34
