  - number: '13'
    text: |-
      1 Het bedrag dat ingevolge het beleggerscompensatiestelsel wordt uitgekeerd als gevolg van betalingsonmacht van een
      financiële onderneming die geen bank is, wordt als volgt aan de Nederlandsche Bank vergoed:

      a. ten laste van het compensatiefonds, bedoeld in [artikel 16, eerste lid][ref1], tot een bedrag dat gelijk is aan
      de in het fonds aanwezige middelen;

      b. door de financiële ondernemingen, bedoeld in [artikel 8][ref2], die geen bank zijn: het meerdere, met
      inachtneming van [artikel 14][ref3], tot een maximum van € 11,3 miljoen.

      2 Het na de toepassing van het eerste lid, eventueel resterende bedrag wordt met inachtneming van
      [artikel 15][ref4] vergoed door de financiële ondernemingen, bedoeld in [artikel 8, eerste lid][ref5].

      3 De bijdrageverplichtingen, bedoeld in het eerste lid, aanhef en onderdeel b, en het tweede lid, ontstaan op het
      tijdstip waarop de Nederlandsche Bank de betalingsonmacht van de financiële onderneming constateert als bedoeld in
      [artikel 3:260, tweede lid, van de wet][ref6]. Financiële ondernemingen die na dat tijdstip niet langer voldoen aan
      de in [artikel 8][ref7] genoemde criteria, blijven de bijdrage verschuldigd.

      4 De Nederlandsche Bank kan op verzoek van een groep financiële ondernemingen die geen bank zijn, na overleg
      met representatieve vertegenwoordigingen, bepalen dat een tot deze groep behorende financiële onderneming die in
      het verzoek dient te worden aangewezen, alle door de tot deze groep behorende financiële ondernemingen in totaal
      verschuldigde bijdragen betaalt. De Nederlandsche Bank voldoet in elk geval aan het verzoek indien de tot de groep
      behorende financiële ondernemingen zijn geconsolideerd in de balans van de aangewezen financiële onderneming.

      5 De bijdrage van banken die zijn aangesloten bij een centrale kredietinstelling wordt in een bedrag betaald door
      de centrale kredietinstelling.

      6 De Nederlandsche Bank kan maandelijks de verschuldigde bijdragen met betrekking tot de op dat moment ingevolge
      [artikel 27, tweede lid][ref8], betaalde vergoeding in rekening brengen.

      7 De Nederlandsche Bank kan bepalen dat bijdragen beneden een door haar, in overleg met representatieve
      vertegenwoordigingen, vast te stellen bedrag, niet behoeven te worden voldaan.


