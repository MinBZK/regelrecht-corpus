  - number: '23'
    text: |-
      1 Het in enig kalenderjaar door een bank ingevolge [artikel 21][ref1] te betalen bedrag, vermeerderd met het door
      deze bank te betalen bedragen uit hoofde van [paragraaf 6.1][ref2] te betalen bedrag, is niet groter dan vijf
      procent van haar eigen vermogen. Een eventueel excedent wordt door de Nederlandsche Bank renteloos voorgeschoten.

      2 Indien de solvabiliteits- of liquiditeitspositie van een bank daartoe aanleiding geeft, kan de Nederlandsche Bank
      voor die bank een lager percentage vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel21
