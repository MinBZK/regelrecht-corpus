        bwb_id: BWBR0020368
  - number: '2'
    text: |-
      Een aanvraag ter verkrijging van instemming met een overdracht als bedoeld in
      [artikel 3:112, eerste lid][ref1], [3:113, eerste lid][ref2], [3:114, eerste lid][ref3],
      [3:114a, eerste lid][ref4] of [3:115, eerste lid, van de wet][ref5] geschiedt, onverminderd
      [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref6], onder opgave van een ontwerpovereenkomst met de
      volgende ter toelichting dienende stukken:

      a. een omschrijving van de rechten en verplichtingen, bedoeld in [artikel 3:112, eerste lid 1][ref7],
      [3:113, eerste lid][ref8], [3:114, eerste lid][ref9], [3:114a, eerste lid][ref10] of
      [3:115, eerste lid, van de wet][ref11], die door de verzekeraar worden overgedragen;

      b. ontwerpteksten van de mededelingen die de overdragende verzekeraar zal doen op grond van
      [artikel 3:119, eerste lid, van de wet][ref12];

      c. een opgave van de verkrijgingsprijs van de rechten en verplichtingen, bedoeld in onderdeel a, door de
      verkrijgende verzekeraar;

      d. een opgave van de veranderingen in de aanwezige solvabiliteitsmarge als gevolg van de overdracht;

      e. een opgave van de omvang van de aan te houden technische voorzieningen in verband met de rechten en
      verplichtingen, bedoeld in onderdeel a;

      f. een opgave van de aard en omvang van de over te dragen beleggingen ter dekking van de technische voorzieningen;
      en

      g. ingeval van winstdeling, een beschrijving van de winstdefinitie.


