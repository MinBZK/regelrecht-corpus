articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. groep banken of groep financiële ondernemingen: twee of meer banken onderscheidenlijk financiële ondernemingen
      die met elkaar zijn verbonden in een formele of feitelijke zeggenschapsstructuur;

      b. wet: [Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020414/2009-01-01#Artikel1
