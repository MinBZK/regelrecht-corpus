  - number: '10'
    text: |-
      1 Voor voldoening ingevolge het beleggerscompensatiestelsel komen in aanmerking vorderingen die voortvloeien uit
      het onvermogen van de betalingsonmachtige financiële onderneming om overeenkomstig de wettelijke en contractuele
      voorwaarden:

      a. geld terug te betalen dat zij aan personen als bedoeld in [artikel 9][ref1] verschuldigd is en voor hen wordt
      gehouden in verband met het verlenen van beleggingsdiensten; of

      b. financiële instrumenten terug te geven die door haar voor personen als bedoeld in [artikel 9][ref2] worden
      gehouden, geadministreerd of beheerd in verband met het verlenen van beleggingsdiensten.

      2 Vorderingen van derden als bedoeld in [artikel 9, onderdeel c][ref3], komen slechts voor voldoening in aanmerking
      indien de identiteit van de derde is of kan worden vastgesteld voordat de Nederlandsche Bank heeft geconstateerd
      dat de financiële onderneming als bedoeld in [artikel 8, eerste lid][ref4], betalingsonmachtig is als bedoeld in
      [artikel 3:260, tweede lid, van de wet][ref5].


