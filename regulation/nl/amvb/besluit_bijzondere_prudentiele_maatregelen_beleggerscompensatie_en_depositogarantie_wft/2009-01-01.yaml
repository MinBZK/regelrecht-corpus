  - number: '5'
    text: |-
      1 Indien overeenkomstig [paragraaf 3.5.4.1 van de wet][ref1] portefeuilleoverdracht aan een opvanginstelling heeft
      plaatsgevonden, doet de opvanginstelling daarvan onverwijld mededeling in de Staatscourant. De Nederlandsche Bank
      kan besluiten dat de opvanginstelling van de portefeuilleoverdracht tevens mededeling doet op een andere, door
      de Nederlandsche Bank te bepalen wijze. De inhoud van deze mededelingen behoeft de voorafgaande instemming van de
      Nederlandsche Bank.

      2 De portefeuilleoverdracht wordt ten aanzien van alle andere belanghebbenden dan de betrokken levensverzekeraars
      van kracht met ingang van de tweede dag, volgende op die van de dagtekening van de Staatscourant waarin de
      overdracht is meegedeeld.

      3 De Nederlandsche Bank geeft van de portefeuilleoverdracht kennis:

      a. indien het een levensverzekeraar met zetel in Nederland betreft: aan de toezichthoudende instanties in de andere
      lidstaten waar de levensverzekeraar een bijkantoor heeft of waarheen hij diensten verricht vanuit zijn vestigingen
      in een lidstaat;

      b. indien het een levensverzekeraar betreft met zetel in een staat die geen lidstaat is: aan de toezichthoudende
      instanties van de andere lidstaten waarheen hij diensten verricht vanuit een in Nederland gelegen bijkantoor.

      4 Voordat de portefeuilleoverdracht plaatsvindt en na hiertoe machtiging te hebben verkregen als bedoeld in
      [artikel 3:154 van de wet][ref2], stelt de Nederlandsche Bank de toezichthoudende instanties, bedoeld in het derde
      lid, in kennis van de voorgenomen portefeuilleoverdracht, tenzij het met de opvang te bereiken doel daardoor in
      gevaar komt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Paragraaf3.5.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3154
    url: https://wetten.overheid.nl/BWBR0020414/2009-01-01#Artikel5
