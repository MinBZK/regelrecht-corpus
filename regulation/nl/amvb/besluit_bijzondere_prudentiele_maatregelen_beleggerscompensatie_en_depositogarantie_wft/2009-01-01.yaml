  - number: '24'
    text: |-
      1 De Nederlandsche Bank doet de mededeling in de Staatscourant, bedoeld in
      [artikel 3:260, derde lid, van de wet][ref1], zo spoedig mogelijk na het nemen van het in het eerste lid van
      [dat artikel][ref2] bedoelde besluit tot toepassing van een vangnetregeling. Tevens doet de Nederlandsche Bank zo
      spoedig mogelijk nadat zij betalingsonmacht heeft vastgesteld mededeling door middel van advertenties in door haar
      te bepalen landelijke nieuwsbladen dat:

      a. zij het beleggerscompensatiestelsel, bedoeld in [artikel 3:259, eerste lid, van de wet][ref3] of het
      depositogarantiestelsel, bedoeld in [artikel 3:259, tweede lid van de wet][ref4] in werking heeft gesteld; en

      b. de personen, bedoeld in [artikel 9][ref5] onderscheidenlijk [artikel 19][ref6], binnen vijf maanden na de
      datum van de bekendmaking in de Staatscourant met gebruikmaking van een daartoe door de Nederlandsche Bank vast
      te stellen formulier een aanvraag tot vergoeding van de in [artikel 10][ref7] onderscheidenlijk [artikel 20][ref8]
      bedoelde vorderingen bij haar kunnen indienen.

      2 De Nederlandsche Bank verzoekt de bewindvoerders of curatoren van de betalingsonmachtige financiële onderneming
      om in hun correspondentie met de personen, bedoeld in het eerste lid te wijzen op het in werking stellen van
      het beleggerscompensatiestelsel en op de termijn voor indiening van een aanvraag als bedoeld in het eerste lid,
      onderdeel b.

      3 De Nederlandsche Bank neemt aanvragen die na het verstrijken van de termijn, bedoeld in het eerste lid, onderdeel
      b, zijn ingediend niet in behandeling, tenzij redelijkerwijs niet kan worden geoordeeld dat de aanvrager in verzuim
      is.


