  - number: '21'
    text: |-
      1 Het bedrag dat ingevolge het depositogarantiestelsel wordt uitgekeerd, wordt door de banken, bedoeld in
      [artikel 18][ref1], vergoed aan de Nederlandsche Bank volgens het door haar op grond van [artikel 22][ref2] vast te
      stellen omslagpercentage.

      2 De verplichting, bedoeld in het eerste lid, ontstaat op het tijdstip waarop de Nederlandsche Bank de
      betalingsonmacht van een bank constateert als bedoeld in [artikel 3:260, tweede lid, van de wet][ref3]. Banken
      die na dat tijdstip niet langer voldoen aan de in [artikel 18][ref4] genoemde criteria, blijven de bijdrage
      verschuldigd.

      3 De Nederlandsche Bank kan, op verzoek van een groep banken, na overleg met representatieve vertegenwoordigingen,
      bepalen dat een tot deze groep behorende bank, die in het verzoek dient te worden aangewezen, alle door de tot deze
      groep behorende banken in totaal verschuldigde bijdragen betaalt. De Nederlandsche Bank voldoet in elk geval aan
      het verzoek indien de tot die groep behorende banken zijn geconsolideerd in de balans van de aangewezen bank.

      4 De bijdrage van banken die zijn aangesloten bij een centrale kredietinstelling wordt in een bedrag betaald door
      de centrale kredietinstelling.

      5 De verschuldigde bijdrage van iedere bank afzonderlijk wordt bepaald door het omslagpercentage voor die bank te
      vermenigvuldigen met het totaalbedrag dat ingevolge het depositogarantiestelsel wordt uitgekeerd.

      6 De Nederlandsche Bank kan maandelijks de verschuldigde bijdragen van de banken met betrekking tot de op dat
      moment ingevolge [artikel 27, tweede lid][ref5], betaalde vergoeding, bij de banken in rekening brengen.

      7 De Nederlandsche Bank kan bepalen dat bijdragen beneden een door haar, na overleg met representatieve
      vertegenwoordigingen, vast te stellen bedrag, niet behoeven te worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel18
