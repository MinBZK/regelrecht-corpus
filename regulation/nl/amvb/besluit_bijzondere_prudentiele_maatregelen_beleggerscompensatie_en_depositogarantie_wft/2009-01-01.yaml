      1 De Nederlandsche Bank stelt, ambtshalve of op verzoek van representatieve vertegenwoordigingen, en na overleg
      met deze vertegenwoordigingen, het bedrag vast van de bijdrage van iedere financiële onderneming als bedoeld in
      [artikel 13, eerste lid, onderdeel b][ref1]. Dat bedrag is gelijk aan de som van:

      a. een vast bedrag dat gelijk is voor alle financiële ondernemingen; en

      b. een variabel bedrag dat wordt verkregen door het omslagpercentage, bedoeld in het tweede
      lid of, indien van toepassing, het derde lid, te vermenigvuldigen met het bedrag bedoeld in
      [artikel 13, eerste lid, onderdeel b][ref2], en verminderd met de som van de onder a bedoelde vaste bedragen.

      2 De Nederlandsche Bank stelt, ambtshalve of op verzoek van de representatieve vertegenwoordigingen, na overleg
      met deze vertegenwoordigingen, ten behoeve van de berekening van het in het eerste lid bedoelde bedrag een
      omslagpercentage vast aan de hand van de door de in dat lid bedoelde financiële ondernemingen aan de Nederlandsche
      Bank overgelegde gegevens over een door de Nederlandsche Bank nader vast te stellen periode betreffende het aantal
      personen wier vorderingen ingevolge [artikel 9][ref3] voor voldoening in aanmerking komen. Daarbij wordt het aantal
      van deze personen per financiële onderneming gedeeld door het totale aantal van deze personen bij alle financiële
      ondernemingen als bedoeld in het eerste lid gezamenlijk en het verkregen getal vermenigvuldigd met 100 procent.
      Hierbij worden de gegevens van de betalingsonmachtige financiële ondernemingniet meegeteld.

      3 Indien de Nederlandsche Bank ingevolge [artikel 13, zevende lid][ref4], heeft bepaald dat bijdragen beneden
      een door haar vast te stellen bedrag niet behoeven te worden voldaan, stelt de Nederlandsche Bank vast,
      op basis van het omslagpercentage, bedoeld in het tweede lid, welke financiële ondernemingen op grond van
      [artikel 13, zevende lid][ref5], geen bijdrage behoeven te voldoen. Indien de Nederlandsche Bank vaststelt
      dat een of meer financiële ondernemingen geen bijdrage behoeven te voldoen, stelt de Nederlandsche Bank
      een nieuw omslagpercentage vast, dat het omslagpercentage, bedoeld in het tweede lid, vervangt. Hiervoor
      herhaalt de Nederlandsche Bank de berekening, bedoeld in het tweede lid, met dien verstande dat de gegevens
      van de betalingsonmachtige financiële onderneming en van de financiële ondernemingen die op grond van
      [artikel 13, zevende lid][ref6], geen bijdrage behoeven te voldoen, niet worden meegeteld.

      4 De Nederlandsche Bank kan een voorlopige bijdrage vaststellen. Van de voorlopig vastgestelde bijdrage betalen
      financiële ondernemingen als bedoeld in het eerste lid 70 procent bij wijze van voorschot aan de Nederlandsche
      Bank. Betaalde voorschotten worden met de definitieve bijdragen verrekend. Financiële ondernemingen als bedoeld in
      het eerste lid voldoen de voorschotten binnen een door de Nederlandsche Bank vastgestelde termijn.


