  - number: '6'
    text: |-
      1 Een levensverzekeraar aan wie een aanslag wordt opgelegd ingevolge [artikel 3:156, zesde lid, van de wet][ref1],
      voldoet de aanslag aan de opvanginstelling binnen een door de Nederlandsche Bank te bepalen termijn.

      2 De Nederlandsche Bank kan bepalen dat een levensverzekeraar het bedrag van de aanslag geheel of gedeeltelijk
      aan een ander voldoet, om deze in staat te stellen zijn aandelen in de opvanginstelling aan deze verzekeraar over
      te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3156
