      Het depositogarantiestelsel is van toepassing op:

      a. banken die een vergunning als bedoeld in [artikel 2:11 van de wet][ref1] hebben;

      b. banken als bedoeld in [artikel 3:266, eerste lid, onderdeel b, van de wet][ref2], voorzover het hun vanuit een
      in Nederland gelegen bijkantoor uitgeoefende bedrijf betreft; en

      c. banken als bedoeld in [artikel 3:267, tweede lid, van de wet][ref3], voorzover het een vanuit hun in Nederland
      gelegen bijkantoor uitgeoefende bedrijf betreft.


