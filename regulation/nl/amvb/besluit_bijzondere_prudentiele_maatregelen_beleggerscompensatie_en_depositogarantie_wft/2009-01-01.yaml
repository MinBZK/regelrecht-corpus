  - number: '31'
    text: |-
      De Nederlandsche Bank stelt de toezichthoudende instanties die in andere lidstaten zijn belast met taken met
      betrekking tot een beleggerscompensatiestelsel in kennis van een wijziging in het beleggerscompensatiestelsel.
    url: https://wetten.overheid.nl/BWBR0020414/2009-01-01#Artikel31
  - number: '32'
    text: |-
      Het [koninklijk besluit van 17 december 1998 ter uitvoering van artikel 9, onder c, van de Bankwet 1998][ref1]
      (Stbl. 719) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010134
    url: https://wetten.overheid.nl/BWBR0020414/2009-01-01#Artikel32
    references:
