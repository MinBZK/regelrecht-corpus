  - number: '13.2'
    text: |-
      Het na de toepassing van het eerste lid, eventueel resterende bedrag wordt met inachtneming van [artikel 15][ref1]
      vergoed door de financiële ondernemingen, bedoeld in [artikel 8, eerste lid][ref2].


