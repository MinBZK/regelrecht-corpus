  - number: '13.3'
    text: |-
      De bijdrageverplichtingen, bedoeld in het eerste lid, aanhef en onderdeel b, en het tweede lid, ontstaan op het
      tijdstip waarop de Nederlandsche Bank de betalingsonmacht van de financiële onderneming constateert als bedoeld in
      [artikel 3:260, tweede lid, van de wet][ref1]. Financiële ondernemingen die na dat tijdstip niet langer voldoen aan
      de in [artikel 8][ref2] genoemde criteria, blijven de bijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel8
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel13
