  - number: '12.3'
    text: |-
      De Nederlandsche Bank kan een voorlopige bijdrage vaststellen. Daarvan wordt 70 procent bij wijze van voorschot
      aan de Nederlandsche Bank betaald. Betaalde voorschotten worden met de definitieve bijdragen verrekend.
      [Artikel 3:262, tweede volzin, van de wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel12
