  - number: 1.a
    text: |-
      *gedelegeerde verordening bijdragen afwikkelingsfonds:* gedelegeerde verordening (EU) 2015/63 van de Commissie van
      21 oktober 2014 tot aanvulling van [Richtlijn 2014/59](32014L0059)/EU van het Europees Parlement en de Raad van wat
      de vooraf te betalen bijdragen aan afwikkelingsfinancieringsregelingen betreft (PbEU 2015, L 11);
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel1
  - number: 1.b
    text: |-
      groep banken of groep financiële ondernemingen: twee of meer banken onderscheidenlijk financiële ondernemingen die
      met elkaar zijn verbonden in een formele of feitelijke zeggenschapsstructuur;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel1
  - number: 1.c
    text: |-
