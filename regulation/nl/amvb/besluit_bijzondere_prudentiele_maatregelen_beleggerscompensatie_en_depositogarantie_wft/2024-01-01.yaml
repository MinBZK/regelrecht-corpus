        paragraaf: '6.2'
  - number: '11.3'
    text: |-
      De Nederlandsche Bank kan, op verzoek van een groep banken, na overleg met representatieve vertegenwoordigingen,
      bepalen dat een tot deze groep behorende bank, die in het verzoek dient te worden aangewezen, alle door de tot deze
      groep behorende banken in totaal verschuldigde bijdragen betaalt. De Nederlandsche Bank voldoet in elk geval aan
      het verzoek indien de tot de groep behorende banken zijn geconsolideerd in de balans van de aangewezen bank.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel11
  - number: '11.4'
    text: |-
      De bijdrage van banken die zijn aangesloten bij een centrale kredietinstelling wordt in een bedrag betaald door de
      centrale kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel11
  - number: '11.5'
    text: |-
      De verschuldigde bijdrage van iedere bank afzonderlijk wordt bepaald door het omslagpercentage voor die bank te
      vermenigvuldigen met het totaalbedrag dat ingevolge het beleggerscompensatiestelsel wordt uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel11
  - number: '11.6'
    text: |-
      De Nederlandsche Bank kan maandelijks de verschuldigde bijdragen van de banken met betrekking tot de op dat moment
      ingevolge [artikel 27, tweede lid][ref1], betaalde vergoeding, bij de banken in rekening brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel27
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '27'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '11.7'
    text: |-
      De Nederlandsche Bank kan bepalen dat bijdragen beneden een door haar, na overleg met representatieve
      vertegenwoordigingen vast te stellen bedrag, niet behoeven te worden voldaan.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel11
  - number: '12.1'
    text: |-
      De Nederlandsche Bank stelt, ambtshalve of op verzoek van representatieve vertegenwoordigingen en na overleg met
      deze vertegenwoordigingen, het voor elke bank geldende omslagpercentage vast aan de hand van de door deze bank
      aan de Nederlandsche Bank overgelegde geconsolideerde balans voorafgaand aan het tijdstip waarop betalingsonmacht
      als bedoeld in artikel 2:295, tweede lid, van de [wet][ref1] door de Nederlandsche Bank is geconstateerd. Na
      overleg met representatieve vertegenwoordigingen bepaalt de Nederlandsche Bank nader welke bedrijfseconomische
      balansen gebruikt worden en welke posten uit deze balansen voor deze berekening in aanmerking worden genomen.
      Daarbij wordt het totaalbedrag van deze posten van elke bank gedeeld door het totaalbedrag van deze posten van
      alle banken gezamenlijk en het verkregen getal vermenigvuldigd met 100 procent. Hierbij worden de posten van de
      betalingsonmachtige bank niet meegeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '12.2'
    text: |-
      Indien de Nederlandsche Bank ingevolge [artikel 11, zevende lid][ref1], heeft bepaald dat bijdragen beneden
      een door haar vast te stellen bedrag niet behoeven te worden voldaan, stelt zij vast, op basis van het
      omslagpercentage, bedoeld in het eerste lid, welke banken op grond van [artikel 11, zevende lid][ref2], geen
      bijdrage behoeven te voldoen. Indien de Nederlandsche Bank vaststelt dat een of meer banken geen bijdrage behoeven
      te voldoen, en stelt zij een nieuw omslagpercentage vast, dat het omslagpercentage, bedoeld in het eerste lid,
      vervangt. Hiervoor herhaalt de Nederlandsche Bank de berekening, bedoeld in het eerste lid, met dien verstande dat
      de gegevens van de betalingsonmachtige bank en van de banken die op grond van [artikel 11, zevende lid][ref3], geen
      bijdrage behoeven te voldoen, niet worden meegeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020414#Artikel11
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel12
