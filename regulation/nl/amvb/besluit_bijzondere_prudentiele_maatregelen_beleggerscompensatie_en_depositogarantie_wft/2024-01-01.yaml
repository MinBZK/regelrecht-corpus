  - number: '13.7'
    text: |-
      De Nederlandsche Bank kan bepalen dat bijdragen beneden een door haar, in overleg met representatieve
      vertegenwoordigingen, vast te stellen bedrag, niet behoeven te worden voldaan.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel13
  - number: '14.1'
    text: |-
      De Nederlandsche Bank stelt, ambtshalve of op verzoek van representatieve vertegenwoordigingen, en na overleg
      met deze vertegenwoordigingen, het bedrag vast van de bijdrage van iedere financiële onderneming als bedoeld in
      [artikel 13, eerste lid, onderdeel b][ref1]. Dat bedrag is gelijk aan de som van:


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel13
