  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 27 juni 2006, nr. FM 2006-01568;

    Gelet op de richtlijn nr. 94/19/EG van het Europees Parlement en de Raad van de Europese Unie van 30 mei 1994
    inzake de depositogarantiestelsels (PbEG L135), de richtlijn nr. 97/9/EG van het Europees Parlement en de Raad van
    de Europese Unie van 3 maart 1997 inzake de beleggerscompensatiestelsels (PbEG L84) en de artikelen 3:116, 3:132,
    tweede lid, 3:136, derde lid, 3:156, tiende lid, 3:259, derde en vierde lid, en 3:266, vijfde lid, van de Wet op
    het financieel toezicht;

    De Raad van State gehoord, advies van 17 augustus 2006, nr. W06.06.0258/IV;

    Gezien het nader rapport van Onze Minister van Financiën van 9 oktober 2006 nr. FM 2006-01983;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#ArtikelAanhef
