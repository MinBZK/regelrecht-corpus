        artikel: '3'
  - number: '13.1'
    text: |-
      Het bedrag dat ingevolge het beleggerscompensatiestelsel wordt uitgekeerd als gevolg van betalingsonmacht van een
      financiële onderneming die geen bank is, wordt als volgt aan de Nederlandsche Bank vergoed:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel13
  - number: 13.1.a
    text: |-
      ten laste van het compensatiefonds, bedoeld in [artikel 16, eerste lid][ref1], tot een bedrag dat gelijk is aan de
      in het fonds aanwezige middelen;


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel16
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel13
