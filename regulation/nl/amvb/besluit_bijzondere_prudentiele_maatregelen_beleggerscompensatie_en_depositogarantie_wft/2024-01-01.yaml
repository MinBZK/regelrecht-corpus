        artikel: '3'
  - number: 2.c
    text: |-
      een opgave van de verkrijgingsprijs van de rechten en verplichtingen, bedoeld in onderdeel a, door de verkrijgende
      verzekeraar;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel2
  - number: 2.d
    text: |-
      een opgave van de veranderingen in het eigen vermogen als gevolg van de overdracht en, voor zover de overdracht van
      materiële betekenis is, van de verwachte ontwikkeling van dat eigen vermogen in de twaalf maanden volgend op die
      overdracht van betrokken verzekeraars met dien verstande dat indien sprake is van een gehele overdracht dit laatste
      alleen geldt voor de overnemende verzekeraar;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel2
  - number: 2.e
    text: |-
      een opgave van de omvang van de aan te houden technische voorzieningen in verband met de rechten en verplichtingen,
      bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel2
  - number: 2.f
    text: een opgave van de aard en omvang van de over te dragen beleggingen ter dekking van de technische voorzieningen; en
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel2
  - number: 2.g
    text: ingeval van winstdeling, een beschrijving van de winstdefinitie.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel2
  - number: 2a.1
    text: |-
      De Nederlandsche Bank beoordeelt of sprake is van uitzonderlijke omstandigheden als bedoeld in
      [artikel 3:132, eerste lid, van de wet][ref1] aan de hand van artikel 37, eerste lid, van de richtlijn
      solvabiliteit II, met inachtneming van titel I, hoofdstuk X, afdeling 1, van de verordening solvabiliteit II,
      bedoeld in [artikel 1 van het Besluit prudentiële regels Wft][ref2], en bepaalt de hoogte van de op te leggen
      kapitaalopslag aan de hand van artikel 37, tweede lid, van de richtlijn solvabiliteit II, met inachtneming van
      titel I, hoofdstuk X, afdeling 2, van de verordening solvabiliteit II.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel1
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '1'
  - number: 2a.2
    text: |-
      Een verzekeraar waaraan de Nederlandsche Bank een kapitaalopslag heeft opgelegd op een van de gronden, bedoeld in
      artikel 37, eerste lid, onderdelen b en c, van de richtlijn solvabiliteit II, stelt al het nodige in het werk om de
      tekortkomingen die geleid hebben tot het opleggen van een kapitaalopslag te verhelpen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel2a
  - number: '3'
    text: |-
      Het door een verzekeraar met zetel in Nederland bij de Nederlandsche Bank in te dienen herstelplan, bedoeld in
      [artikel 3:135, eerste lid, van de wet][ref1], voldoet aan de eisen die ingevolge artikel 142, eerste lid, van
      de richtlijn solvabiliteit II worden gesteld aan het in artikel 138, tweede lid, van die richtlijn bedoelde
      saneringsplan, met inachtneming van de door de Europese Commissie op grond van artikel 143, tweede lid, tweede
      alinea, van de richtlijn solvabiliteit II vastgestelde uitvoeringsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 3a
    text: |-
      Artikel 142, eerste lid, van de richtlijn solvabiliteit II en de door de Europese Commissie op grond van artikel
      143, tweede lid, tweede alinea, van de richtlijn solvabiliteit II vastgestelde uitvoeringsmaatregelen met
      betrekking tot het herstelplan zijn van overeenkomstige toepassing op de volgende verzekeraars, voor zover zij hun
      bedrijf uitoefenen vanuit een in Nederland gelegen bijkantoor:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel3a
  - number: 3a.a
    text: levensverzekeraars en schadeverzekeraars met zetel in een staat die geen lidstaat is;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel3a
  - number: 3a.b
    text: herverzekeraars en verzekeraars met beperkte risico-omvang met zetel in een niet-aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel3a
  - number: '4'
    text: |-
      Het door een verzekeraar met zetel in Nederland bij de Nederlandsche Bank in te dienen financieel kortetermijnplan,
      bedoeld in [artikel 3:136, eerste lid, van de wet][ref1], voldoet aan de eisen die ingevolge artikel 142, eerste
      lid, van de richtlijn solvabiliteit II worden gesteld aan het in artikel 139, tweede lid, van die richtlijn
      bedoelde financieel kortetermijnplan, met inachtneming van de door de Europese Commissie op grond van artikel 143,
      tweede lid, tweede alinea, van de richtlijn solvabiliteit II vastgestelde uitvoeringsmaatregelen. Indien ingevolge
      [artikel 3:135, eerste lid, van de wet][ref2] een herstelplan is vastgesteld waaraan instemming is verleend,
      vermeldt het financieel kortetermijnplan tevens hoe het herstelplan daarin wordt verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 4a
    text: |-
      Artikel 142, eerste lid, van de richtlijn solvabiliteit II en de door de Europese Commissie op grond van artikel
      143, tweede lid, tweede alinea, van die richtlijn vastgestelde uitvoeringsmaatregelen met betrekking tot het
      financieel kortetermijnplan zijn van overeenkomstige toepassing op de volgende verzekeraars, voor zover zij hun
      bedrijf uitoefenen vanuit een in Nederland gelegen bijkantoor:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel4a
  - number: 4a.a
    text: levensverzekeraars en schadeverzekeraars met zetel in een staat die geen lidstaat is;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel4a
  - number: 4a.b
    text: herverzekeraars en verzekeraars met beperkte risico-omvang met zetel in een niet-aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel4a
  - number: '5.1'
    text: |-
      Het afwikkelingsplan, bedoeld in [artikel 3A:81 van de wet][ref1], bevat ten minste, indien passend en mogelijk
      gekwantificeerd, voor elke entiteit die zou kunnen worden afgewikkeld of onderdeel daarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 5.1.a
    text: |-
      een beschrijving van de toepassing van de afwikkelingsinstrumenten in verschillende crisisscenario’s, de verwachte
      effectiviteit ervan en de voor de uitvoering benodigde tijd;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.1.b
    text: |-
      een beschrijving van de behandeling van de verzekeringsportefeuille of verzekeringsportefeuilles in verschillende
      scenario’s;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.1.c
    text: |-
      een beschrijving van systemen die noodzakelijk zijn voor het beheer van de verzekeringsportefeuille of
      portefeuilles;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.1.d
    text: |-
      een beschrijving van voor het beheer van de verzekeringsportefeuilles essentiële, al dan niet uitbestede,
      werkzaamheden en de mogelijke gevolgen van een afwikkeling voor de uitvoering van die werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.1.e
    text: |-
      een beschrijving van de vereiste maatregelen voor het wegnemen van belemmeringen voor de afwikkelbaarheid die
      ingevolge [artikel 3A:82, eerste lid, van de wet][ref1] zijn vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 5.1.f
    text: een inventarisatie van de belangrijkste onderdelen van een communicatieplan voor media en het publiek;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.1.g
    text: |-
      een samenvatting van wezenlijke veranderingen in de juridische structuur of de feitelijke bedrijfsuitoefening die
      zich sinds de vaststelling van het laatste afwikkelingsplan hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.1.h
    text: een standpunt van de entiteit over de voornaamste onderdelen van het afwikkelingsplan; en
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.1.i
    text: |-
      een beschrijving van de procedure die ervoor moet zorgen dat de voor de afwikkeling vereiste informatie correct en
      actueel is.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het groepsafwikkelingsplan bevat de voorgenomen maatregelen voor de afwikkeling van een groep waarvan de
      uiteindelijke moederonderneming haar zetel in Nederland heeft van de groep als geheel of van een of meer onderdelen
      van die groep met zetel in Nederland.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: '5.3'
    text: 'Het groepsafwikkelingsplan bevat:'
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.3.a
    text: |-
      ten aanzien van alle voor afwikkeling in aanmerking komende entiteiten in de groep een beschrijving van de
      toepassing van de afwikkelingsinstrumenten in verschillende scenario’s, de verwachte effectiviteit ervan en de voor
      de uitvoering benodigde tijd. Op verzekeraars met zetel in Nederland is het eerste lid, onderdelen b tot en met e
      en gvan overeenkomstige toepassing;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.3.b
    text: |-
      voor zover van toepassing, maatregelen die de verkoop van de groep als geheel, onderdelen van de groep of van
      afzonderlijke bedrijfsonderdelen of -activiteiten van bepaalde groepsentiteiten faciliteren;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.3.c
    text: |-
      een beschrijving van de vereiste maatregelen voor het wegnemen van belemmeringen voor de afwikkelbaarheid die
      ingevolge [artikel 3A:82, eerste lid, van de wet][ref1] zijn vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 5.3.d
    text: |-
      voor zover van toepassing, een beschrijving van de significante vervlechtingen van elke verzekeraar in de groep met
      andere groepsleden;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.3.e
    text: |-
      indien een groep ook bestaat uit onderdelen met zetel buiten Nederland, passende regelingen voor de samenwerking
      met de aldaar betrokken autoriteiten;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.3.f
    text: |-
      een samenvatting van wezenlijke veranderingen in de juridische structuur of de feitelijke bedrijfsuitoefening van
      de groep die zich sinds de opstelling van het laatste afwikkelingsplan hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.3.g
    text: een inventarisatie van de belangrijkste onderdelen van een communicatieplan voor media en het publiek
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.3.h
    text: een standpunt van de groep over de voornaamste onderdelen van het afwikkelingsplan; en
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: 5.3.i
    text: |-
      een beschrijving van de procedure die ervoor moet zorgen dat de voor de afwikkeling vereiste informatie correct en
      actueel is.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: '5.4'
    text: |-
      De afwikkelings- en groepsafwikkelingsplannen worden ten minste elke drie jaar geëvalueerd en zo nodig bijgewerkt,
      alsook na elke significante verandering in de juridische structuur, de feitelijke bedrijfsuitoefening of de
      financiële positie van de verzekeraar of, in het geval van groepsafwikkelingsplannen, van de groep.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel5
  - number: '6'
    text: |-
      De Nederlandsche Bank beoordeelt de afwikkelbaarheid van een entiteit of groep ten minste op de volgende
      onderdelen:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel6
  - number: 6.a
    text: de verhouding van de feitelijke bedrijfsuitoefening tot de juridische structuur;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel6
  - number: 6.b
    text: |-
      de mate waarin de juridische structuur of de feitelijke bedrijfsuitoefening de toepassing van de
      afwikkelingsinstrumenten bemoeilijkt;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel6
  - number: 6.c
    text: |-
      de mate waarin de continuïteit van door de entiteit of groep uitbestede werkzaamheden bij afwikkeling van de
      entiteit of groep in voldoende mate is gegarandeerd;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel6
  - number: 6.d
    text: |-
      de mate waarin de continuïteit van door de entiteit of groep uitbestede werkzaamheden bij afsplitsing van
      bedrijfsonderdelen in voldoende mate is gegarandeerd;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel6
  - number: 6.e
    text: |-
      de mate waarin de bestuurs- en bedrijfsvoeringsstructuur van de entiteit of groep de continuïteit van uitbestede
      werkzaamheden garandeert;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel6
  - number: 6.f
    text: |-
      de mate waarin een adequaat beheer van de verzekeringsportefeuille in een situatie waarin geen
      verzekeringsovereenkomsten worden gesloten in voldoende mate is gegarandeerd;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel6
  - number: 6.g
    text: |-
      de mate waarin de entiteit of groep in staat is ten behoeve van besluitvorming door de Nederlandsche Bank tijdig
      correcte en volledige informatie over te leggen; en
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel6
  - number: 6.h
    text: |-
      de mate waarin de in [artikel 5, eerste lid, onderdeel a en derde lid, onderdeel a][ref1], voorgestelde toepassing
      van de afwikkelingsinstrumenten en artikel 5, eerste lid, onderdeel b, en derde lid, onderdeel a, voorgestelde
      behandeling van de verzekeringsportefeuilles kan worden gerealiseerd, gegeven de beoordeling van de in onderdelen a
      tot en met g genoemde punten.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel5
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '5'
        hoofdstuk: '5'
  - number: 7a
    text: |-
      Voor de toepassing van deze paragraaf wordt een overbruggingsstichting of overbruggingsonderneming aangemerkt als
      een overbruggingsinstelling in de zin van de [paragrafen 3A.1.5.2][ref1] en [3A.2.4.3 van de wet][ref2], voor zover
      belast met de taken, bedoeld in [artikel 7b, tweede lid, onderdeel b][ref3], en [artikel 7c, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Paragraaf3a.1.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Paragraaf3a.2.4.3
      [ref3]: https://wetten.overheid.nl/BWBR0020414#Artikel7b
      [ref4]: https://wetten.overheid.nl/BWBR0020414#Artikel7c
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        paragraaf: 3a.1.5.2
      - id: ref2
        bwb_id: BWBR0020368
        paragraaf: 3a.2.4.3
      - id: ref3
        bwb_id: BWBR0020414
        artikel: 7b
        hoofdstuk: 5a
        paragraaf: 5a.1
      - id: ref4
        bwb_id: BWBR0020414
        artikel: 7c
        hoofdstuk: 5a
        paragraaf: 5a.1
  - number: 7b.1
    text: De Nederlandsche Bank is belast met het oprichten van overbruggingsstichtingen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7b
  - number: 7b.2
    text: 'Een overbruggingsstichting heeft tot taak om:'
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7b
  - number: 7b.2.a
    text: aandelen in een of meer overbruggingsondernemingen of entiteiten voor activa- en passivabeheer te houden; of
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7b
  - number: 7b.2.b
    text: |-
      tijdelijk eigendomsinstrumenten te houden die zijn uitgegeven door of met medewerking van een
      entiteit in afwikkeling en die ingevolge een besluit op grond van [artikel 3A:37, eerste lid][ref1] of
      [artikel 3A:112 van de wet][ref2] op haar zijn overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 7b.3
    text: |-
      De statuten van een overbruggingsstichting zijn in overeenstemming met de artikelen 40 en 41 van de richtlijn
      herstel en afwikkeling van banken en beleggingsondernemingen, voor zover de taak, bedoeld in het tweede lid,
      onderdeel a, en de taak, bedoeld in het tweede lid, onderdeel b, indien het eigendomsinstrumenten betreft die
      tijdelijk worden gehouden door toepassing van [paragraaf 3A.2.4.3 van de wet][ref1] zich niet daartegen verzetten,
      indien de overbruggingsstichting met deze taken is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Paragraaf3a.2.4.3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        paragraaf: 3a.2.4.3
  - number: 7b.4
    text: Wijziging van de statuten van een overbruggingsstichting behoeft de goedkeuring van de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7b
  - number: 7c.1
    text: |-
      De Nederlandsche Bank is belast met het oprichten, of het door een overbruggingsstichting doen oprichten, van
      overbruggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7c
  - number: 7c.2
    text: |-
      Een overbruggingsonderneming heeft tot taak om tijdelijk activa of passiva te houden die ingevolge een besluit op
      grond van [artikel 3A:37][ref1] of [3A:112 van de wet][ref2] van een entiteit in afwikkeling op haar overgaan, en
      het daaraan verbonden bedrijf uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 7c.3
    text: |-
      De statuten van een overbruggingsonderneming zijn in overeenstemming met de artikelen 40 en 41 van de
      richtlijn herstel en afwikkeling van banken en beleggingsondernemingen, voor zover de taak, bedoeld in
      het tweede lid, indien het activa of passiva betreft die tijdelijk worden gehouden bij toepassing van
      [paragraaf 3A.2.4.3 van de wet][ref1] zich niet daartegen verzet, indien de overbruggingsstichting met deze taak
      is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Paragraaf3a.2.4.3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        paragraaf: 3a.2.4.3
  - number: 7c.4
    text: |-
      Indien een overbruggingsstichting een overbruggingsonderneming opricht, behoeft de vaststelling en wijziging van de
      statuten van de overbruggingsonderneming de goedkeuring van de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7c
  - number: 7c.5
    text: |-
      Indien de Nederlandsche Bank een overbruggingsonderneming opricht, draagt zij de aandelen in de
      overbruggingsonderneming onverwijld over aan een overbruggingsstichting.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7c
  - number: 7d.1
    text: |-
      De Nederlandsche Bank is belast met het oprichten, of het door een overbruggingsstichting doen oprichten, van een
      of meer entiteiten voor activa- en passivabeheer.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7d
  - number: 7d.2
    text: |-
      Een entiteit voor activa- en passivabeheer heeft tot taak om de activa en passiva te beheren die ingevolge
      een besluit op grond van [artikel 3A:41][ref1] of [3A:117][ref2] van de wet van een entiteit in afwikkeling of
      overbruggingsinstelling op haar overgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 7d.3
    text: |-
      De statuten van een entiteit voor activa- en passivabeheer zijn in overeenstemming met artikel 42 van de richtlijn
      herstel en afwikkeling van banken en beleggingsondernemingen, voor zover de taak, bedoeld in het tweede lid, indien
      het activa of passiva betreft die worden beheerd bij toepassing van [paragraaf 3A.2.4.4 van de wet ][ref1]zich niet
      daartegen verzet, indien zij met deze taak is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Paragraaf3a.2.4.4
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        paragraaf: 3a.2.4.4
  - number: 7d.4
    text: |-
      [Artikel 7c, vierde en vijfde lid][ref1], is van overeenkomstige toepassing op een entiteit voor activa- en
      passivabeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel7c
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: 7c
        hoofdstuk: 5a
        paragraaf: 5a.1
  - number: 7e.1
    text: |-
      Verkoop door een overbruggingsstichting, overbruggingsonderneming of entiteit voor activa- en passivabeheer
      van door deze gehouden eigendomsinstrumenten, of activa of passiva, vindt niet plaats dan op aanwijzing of met
      goedkeuring van de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7e
  - number: 7e.2
    text: |-
      Bij een verkoop door een overbruggingsstichting of overbruggingsonderneming worden de vereisten, bedoeld in artikel
      41, vierde lid, van de richtlijn herstel en afwikkeling van banken en beleggingsondernemingen in acht genomen,
      voor zover dat zich niet verzet tegen het doel waarmee de overbruggingsinstelling of overbruggingsonderneming
      eigendomsinstrumenten, activa of passiva door toepassing van [paragraaf 3A.2.4.3][ref1], onderscheidenlijk
      [paragraaf 3A.2.4.4, van de wet][ref2] houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Paragraaf3a.2.4.3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Paragraaf3a.2.4.4
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0020368
        paragraaf: 3a.2.4.3
      - id: ref2
        bwb_id: BWBR0020368
        paragraaf: 3a.2.4.4
  - number: 7f.1
    text: |-
      De Nederlandsche Bank beëindigt het functioneren van een overbruggingonderneming waarop activa of passiva zijn
      overgegaan, of doet een dergelijke overbruggingsonderneming door een overbruggingsstichting beëindigen indien:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7f
  - number: 7f.1.a
    text: alle of vrijwel alle activa en passiva zijn verkocht aan derden; of
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7f
  - number: 7f.1.b
    text: de activa volledig zijn vereffend en de passiva volledig zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7f
  - number: 7f.2
    text: |-
      Een overbruggingsonderneming verkoopt haar activa en passiva uiterlijk twee jaar nadat voor het laatst activa of
      passiva ingevolge de toepassing van het instrument van de overbruggingsinstelling op haar zijn overgegaan, indien
      binnen die termijn geen van de situaties, bedoeld in het eerste lid, zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7f
  - number: 7f.3
    text: |-
      De Nederlandsche Bank kan de termijn, bedoeld in het tweede lid, telkens met ten hoogste een jaar verlengen, indien
      dit:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7f
  - number: 7f.3.a
    text: |-
      bevorderlijk is voor het bereiken van de situatie waarin alle of vrijwel alle activa en passiva zijn verkocht aan
      derden of de activa volledig zijn vereffend en de passiva volledig zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7f
  - number: 7f.3.b
    text: nodig is om de continuïteit van essentiële bankdiensten of financiële diensten te verzekeren; of
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7f
  - number: 7f.3.c
    text: |-
      nodig is om het doel te verwezenlijken waartoe de overbruggingsonderneming bij toepassing van
      [paragraaf 3A.2.4.3 van de wet][ref1] overgegane activa of passiva houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Paragraaf3a.2.4.3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        paragraaf: 3a.2.4.3
  - number: 7g.1
    text: |-
      De leden van het bestuur van het Afwikkelingsfonds, bedoeld in [artikel 3A:68, eerste lid, van de wet][ref1],
      worden benoemd voor een periode van vier jaar, met de mogelijkheid van herbenoeming. Op de leden van het bestuur is
      [artikel 14, vierde lid, van de Kaderwet zelfstandige bestuursorganen][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel14
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7g
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '14'
  - number: 7g.2
    text: |-
      Op de taakuitoefening van het Afwikkelingsfonds zijn de [artikelen 20][ref1], [23, eerste en tweede lid][ref2],
      en [41, eerste lid, van de Kaderwet zelfstandige bestuurorganen][ref3] van overeenkomstige toepassing, met dien
      verstande dat voor «Onze Minister» wordt gelezen: de Nederlandsche Bank. De Nederlandsche Bank stelt Onze Minister
      onverwijld in kennis van door haar getroffen voorzieningen als bedoeld in artikel 23, eerste lid, van de Kaderwet
      zelfstandige bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel41
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7g
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '41'
  - number: 7g.3
    text: |-
      Het Afwikkelingsfonds legt verantwoording af over haar taakuitoefening overeenkomstig de
      [artikelen 18, eerste lid][ref1], met uitzondering van de laatste volzin, [26][ref2], [34, eerste lid][ref3], en
      [35, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref4], met dien verstande dat voor «Onze Minister»
      wordt gelezen: de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel35
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7g
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0020495
        artikel: '35'
  - number: 7h.1
    text: |-
      De Nederlandsche Bank heft de periodieke bijdragen, bedoeld in [artikel 3A:71, eerste lid, van de wet][ref1], tot
      1 januari 2025, onverminderd het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7h
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 7h.2
    text: |-
      Op het vaststellen van de hoogten van de periodieke bijdragen van beleggingsondernemingen als bedoeld in
      [artikel 3A:71, eerste lid, onderdeel a, van de wet][ref1], is artikel 20, vijfde lid, eerste zin, van de
      gedelegeerde verordening bijdragen Afwikkelingsfonds van toepassing. Voor zover de totale waarde aan passiva minus
      eigen vermogen groter is dan 300.000.000 euro, wordt de hoogte van de bijdrage vermeerderd overeenkomstig het derde
      lid, onderdeel b, onder 1° en 2°.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7h
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 7h.3
    text: |-
      Op het vaststellen van de hoogten van de periodieke bijdragen van banken en beleggingsondernemingen als bedoeld
      in [artikel 3A:71, eerste lid, onderdeel b, onderscheidenlijk onderdeel c, van de wet][ref1], zijn de artikelen 10
      tot en met 14 en 17 van de gedelegeerde verordening bijdragen Afwikkelingsfonds van overeenkomstige toepassing, met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7h
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 7h.3.a
    text: |-
      uitsluitend de vermogenspositie en activiteiten van het in Nederland gelegen bijkantoor in aanmerking worden
      genomen;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7h
  - number: 7h.3.b
    text: |-
      indien de totale waarde aan passiva, minus eigen vermogen en gegarandeerde deposito’s, bedoeld in artikel 10 van de
      verordening, groter is dan 300.000.000 euro, de periodieke bijdrage 75.000 euro per jaar bedraagt, vermeerderd met:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7h
  - number: 7h.3.b.1°
    text: 25.000 euro voor elke 100.000.000 euro waarmee het bedrag van 300.000.000 euro wordt overschreden; en
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7h
  - number: 7h.3.b.2°
    text: 35.000 euro voor elke 100.000.000 euro waarmee het bedrag van 1.000.000.000 euro wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7h
  - number: 7h.4
    text: |-
      Indien financiële middelen van het Afwikkelingsfonds zijn aangewend, heft de Nederlandsche Bank, onverminderd
      de heffingen ingevolge het eerste lid, periodieke bijdragen totdat een bedrag ter grootte van het bedrag aan
      aangewende middelen is geheven.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7h
  - number: 7h.5
    text: |-
      Het bedrag waarvoor een overeenkomst, bedoeld in [artikel 3A:74, tweede lid, van de wet][ref1] is aangegaan, telt
      voor de toepassing van het eerste en derde lid mee voor de berekening van de hoogte van de in het Afwikkelingsfonds
      aanwezige middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7h
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 7i.1
    text: |-
      De hoogte van een buitengewone bijdrage als bedoeld in [artikel 3A:72, eerste lid, van de wet](onbekend) bedraagt
      per jaar ten hoogste drie maal de voorafgaande periodieke bijdrage van de bank of beleggingsonderneming, geheven op
      grond van [artikel 3A:71 van de wet](onbekend).
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7i
  - number: 7i.2
    text: |-
      De Nederlandsche Bank kan de betaling van de buitengewone bijdrage voor ten hoogste zes maanden geheel of
      gedeeltelijk opschorten indien de betaling daarvan de liquiditeit of de solvabiliteit van de betrokken bank of
      beleggingsonderneming zou bedreigen. Op verzoek van de onderneming kan de termijn worden verlengd.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7i
  - number: 7j.1
    text: |-
      Een entiteit in afwikkeling als bedoeld in [artikel 3A:2 van de wet][ref1] of de Nederlandsche Bank kan, indien
      noodzakelijk voor een effectieve afwikkeling, voor de identificatie van houders van kernkapitaalinstrumenten of
      eigendomsinstrumenten of van schuldeisers persoonsgegevens verwerken en maakt gebruik van het burgerservicenummer,
      bedoeld in [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref2], indien zij daarover
      beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0001833#Artikel1
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7j
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0001833
        artikel: '1'
  - number: 7j.2
    text: |-
      Een verzekeraar op wie het instrument van overgang van de onderneming, van de overbruggingsinstelling of van
      afsplitsing van activa of passiva is toegepast of ten aanzien van wie het faillissement is uitgesproken kan, indien
      noodzakelijk om een overdracht van rechten en verplichtingen krachtens verzekering mogelijk te maken, voor de
      identificatie van polishouders persoonsgegevens verwerken en maakt gebruik van het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1], indien zij daarover beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001833#Artikel1
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7j
    references:
      - id: ref1
        bwb_id: BWBR0001833
        artikel: '1'
  - number: 7ja
    text: |-
      Op een waardering als bedoeld in [artikel 3A:89 van de wet][ref1], die tot doel heeft als grondslag
      te dienen voor de vaststelling of is voldaan aan de voorwaarden voor afwikkeling, bedoeld in de
      [artikelen 3A:85, eerste lid en tweede lid, onderdeel a][ref2], en [3A:86 van de wet][ref3], zijn de regels
      gesteld bij of krachtens de [artikelen 3:53][ref4], [3:57][ref5], [3:67][ref6] en [3:69a van de wet][ref7] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7ja
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref3
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 7jb.1
    text: |-
      Op een waardering als bedoeld in [artikel 3A:89 van de wet][ref1] die tot doel heeft er zorg voor te dragen dat
      elk verlies met betrekking tot de activa of passiva van een entiteit volledig is erkend op het moment waarop de
      afwikkelingsinstrumenten worden toegepast, zijn de regels gesteld bij of krachtens de [artikelen 3:67][ref2] en
      [3:69a, eerste lid, van de wet][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jb
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 7jb.2
    text: |-
      Op een waardering als bedoeld in artikel 3A:89 van de wet die tot doel heeft als grondslag te dienen voor het
      besluit tot toepassing van een of meer afwikkelingsinstrumenten en voor de vaststelling door de Nederlandsche Bank
      van de na toepassing van de afwikkelingsinstrumenten vereiste solvabiliteit zijn de regels gesteld bij of krachtens
      de [artikelen 3:53][ref1], [3:57][ref2], [3:67][ref3] en [3:69a van de wet][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jb
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 7jb.3
    text: |-
      Bij de vaststelling van de vereiste solvabiliteit, bedoeld in het tweede lid, neemt de Nederlandsche Bank tevens
      de uitkomsten in acht van een actualisering van de kwantitatieve onderdelen van de beoordeling van het risico
      en de solvabiliteit, bedoeld in artikel 306, onderdeel d, van de verordening (EU) nr. 2015/35 van de Commissie
      van 10 oktober 2014 tot aanvulling van [Richtlijn 2009/138/EG](32009L0138) van het Europees Parlement en de Raad
      betreffende de toegang tot en uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II)
      (PbEU 2015, L12).
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jb
  - number: 7jc.1
    text: |-
      Bij een waardering als bedoeld in [artikel 3A:89, vijfde lid][ref1], van een vordering uit verzekering en ingeval
      de wederpartij van de verzekeraar zich heeft verbonden tot het betalen van premie in termijnen en hij onmiddellijk
      voorafgaand aan het besluit tot afwikkeling de laatste termijn nog niet heeft voldaan, wordt uitgegaan van de
      veronderstelling dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jc
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 7jc.1.a
    text: |-
      de curator met toepassing van [artikel 213ka van de Faillissementswet][ref1] zou hebben verklaard dat met ingang
      van het tijdstip van faillietverklaring de overeenkomst niet wordt nagekomen; en


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel213ka
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jc
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 213ka
  - number: 7jc.1.b
    text: de wederpartij met ingang van dat tijdstip niet zou zijn doorgegaan met het betalen van premie.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jc
  - number: 7jc.2
    text: |-
      Bij een waardering als bedoeld in [artikel 3A:89, vijfde lid][ref1], van een vordering uit verzekering wordt
      uitgegaan van de veronderstelling dat de curator met toepassing van [artikel 213kaa van de Faillissementswet][ref2]
      na drie maanden de verzekeringsovereenkomst zou hebben beëindigd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel213kaa
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jc
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0001860
        artikel: 213kaa
  - number: 7jc.2.a
    text: |-
      de wederpartij van de verzekeraar op het tijdstip van het besluit tot afwikkeling aan zijn verplichting tot het
      betalen van premie volledig heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jc
  - number: 7jc.2.b
    text: |-
      het een verzekering betreft op grond waarvan alleen dan een uitkering wordt gedaan indien zich een onzeker voorval
      voordoet voorafgaand aan een in de overeenkomst bepaald tijdstip; en
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jc
  - number: 7jc.2.c
    text: een onzeker voorval waarop de overeenkomst van verzekering betrekking heeft zich nog kan voordoen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jc
  - number: 7jd.1
    text: |-
      Bij de vaststelling van de hoogte van de bijdragen, bedoeld in artikel 3A:138, tweede lid, van de wet wordt
      dezelfde procentuele verdeling gebruikt als in bijlage V van de [Wet bekostiging financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jd
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: 7jd.2
    text: |-
      Voor de vaststelling van de omvang van de technische voorzieningen is de peildatum 31 december van het voorafgaande
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jd
  - number: 7jd.3
    text: |-
      De Nederlandsche Bank kan de betaling van bijdragen door een verzekeraar voor ten hoogste twaalf maanden geheel
      of gedeeltelijk opschorten indien de Nederlandsche Bank van oordeel is dat betaling daarvan de liquiditeit of
      de solvabiliteit van de betrokken verzekeraar zou bedreigen. Deze termijn kan met telkens met 12 maanden worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7jd
  - number: 7k.1
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *depositobasis:*
      het totaal van de bij een bank aangehouden gegarandeerde deposito’s;
        - *Depositogarantiefonds:* het Depositogarantiefonds, bedoeld in [artikel 3:259a, eerste lid, van de wet][ref1];
        - *depositogarantiestelsel:* het depositogarantiestelsel, bedoeld in [artikel 3:259, tweede lid, van de wet][ref2];
        - *gegarandeerd deposito:* een deposito voor zover dat gegarandeerd wordt uit hoofde van het
      depositogarantiestelsel;
        - *uitvoeringsverordening rapportage kapitaalvereisten:* Uitvoeringsverordening (EU) nr. 680/2014 van de
      Commissie van 16 april 2014 tot vaststelling van technische uitvoeringsnormen voor wat betreft de rapportage aan
      de toezichthoudende autoriteit door instellingen overeenkomstig verordening (EU) nr. 575/2013 van het Europees
      Parlement en de Raad (PbEU 2014, L 191).


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7k
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 7k.2
    text: |-
      Een wijziging van de richtlijn depositogarantiestelsels gaat voor de toepassing van dit hoofdstuk en de daarop
      berustende bepalingen gelden met ingang van de datum waarop aan de betrokken wijziging uitvoering moet zijn
      gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel7k
  - number: '8.1'
    text: 'Het beleggerscompensatiestelsel is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel8
  - number: 8.1.a
    text: |-
      financiële ondernemingen die een vergunning als bedoeld in [artikel 2:11 van de wet][ref1] hebben voor het
      uitoefenen van het bedrijf van bank en waaraan het is toegestaan beleggingsdiensten te verlenen op grond van
      [artikel 2:97, eerste lid, onderdeel c, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 8.1.b
    text: |-
      financiële ondernemingen die een vergunning hebben als bedoeld in
      [artikel 2:69b, eerste lid, aanhef en onderdeel a, van de wet][ref1], voor zover het betreft het
      beheren van individuele vermogens, financiële ondernemingen die een vergunning hebben als bedoeld in
      [artikel 2:65, aanhef en onderdeel a, van de wet][ref2], voor zover het betreft het verrichten van de activiteiten
      of het verlenen van de diensten, bedoeld in [artikel 2:67a, tweede lid][ref3], of financiële ondernemingen die
      een vergunning hebben als bedoeld in [artikel 2:96 van de wet][ref4] voor zover het betreft het verlenen van
      beleggingsdiensten;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 8.1.c
    text: |-
      financiële ondernemingen die een verklaring van ondertoezichtstelling als bedoeld in
      [artikel 3:110 van de wet][ref1] hebben en waaraan het is toegestaan beleggingsdiensten te verlenen op grond van
      [artikel 2:97, eerste lid, onderdeel b, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 8.1.d
    text: |-
      financiële ondernemingen als bedoeld in [artikel 3:266, eerste lid, onderdelen a en c, van de wet][ref1], voorzover
      het betreft hun vanuit een in Nederland gelegen bijkantoor uitgeoefende bedrijf; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 8.1.e
    text: |-
      financiële ondernemingen ten aanzien waarvan een besluit is genomen als bedoeld in
      [artikel 3:267, eerste lid, van de wet][ref1], voorzover het hun vanuit een in Nederland gelegen bijkantoor
      uitgeoefende bedrijf betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '8.2'
    text: |-
      Het beleggerscompensatiestelsel is niet van toepassing op financiële ondernemingen die uitsluitend
      beleggingsactiviteiten verrichten als bedoeld in [artikel 1:1 van de wet][ref1] en financiële ondernemingen die
      uitsluitend beleggingsdiensten verlenen als bedoeld in onderdeel d van de definitie van het verlenen van een
      beleggingsdienst in artikel 1:1 van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '9'
    text: |-
      Indien de Nederlandsche Bank op grond van [artikel 3:260, eerste lid, van de wet][ref1] heeft besloten tot het
      in werking stellen van het beleggerscompensatiestelsel, komen vorderingen van de hierna te noemen categorieën
      van personen voor zover deze personen niet behoren tot een van de in [bijlage A][ref2] bij dit besluit genoemde
      categorieën, voor voldoening overeenkomstig dit hoofdstuk in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020414
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020414
  - number: 9.a
    text: |-
      personen die in verband met beleggingsdiensten op eigen naam en voor eigen rekening geld of financiële instrumenten
      aan de betalingsonmachtige financiële onderneming hebben toevertrouwd;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel9
  - number: 9.b
    text: |-
      personen die tezamen met een persoon als bedoeld in onderdeel a op eigen naam al dan niet voor eigen rekening geld
      of financiële instrumenten in verband met beleggingsdiensten aan de betalingsonmachtige financiële onderneming
      hebben toevertrouwd; en
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel9
  - number: 9.c
    text: |-
      derden ten behoeve van wie een persoon als bedoeld in onderdeel a of b, niet zijnde een beleggingsinstelling of een
      icbe, krachtens overeenkomst of wet op eigen naam geld of financiële instrumenten in verband met beleggingsdiensten
      aan de betalingsonmachtige financiële onderneming heeft toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel9
  - number: '10.1'
    text: |-
      Voor voldoening ingevolge het beleggerscompensatiestelsel komen in aanmerking vorderingen die voortvloeien uit
      het onvermogen van de betalingsonmachtige financiële onderneming om overeenkomstig de wettelijke en contractuele
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel10
  - number: 10.1.a
    text: |-
      geld terug te betalen dat zij aan personen als bedoeld in [artikel 9][ref1] verschuldigd is en voor hen wordt
      gehouden in verband met het verlenen van beleggingsdiensten; of


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel9
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '9'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 10.1.b
    text: |-
      financiële instrumenten terug te geven die door haar voor personen als bedoeld in [artikel 9][ref1] worden
      gehouden, geadministreerd of beheerd in verband met het verlenen van beleggingsdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel9
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '9'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '10.2'
    text: |-
      Vorderingen van derden als bedoeld in [artikel 9, onderdeel c][ref1], komen slechts voor voldoening in aanmerking
      indien de identiteit van de derde is of kan worden vastgesteld voordat de Nederlandsche Bank heeft geconstateerd
      dat de financiële onderneming als bedoeld in [artikel 8, eerste lid][ref2], betalingsonmachtig is als bedoeld in
      [artikel 3:260, tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '9'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '8'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '11.1'
    text: |-
      Het bedrag dat ingevolge het beleggerscompensatiestelsel wordt uitgekeerd als gevolg van betalingsonmacht van een
      bank, wordt door de banken, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], vergoed aan de Nederlandsche
      Bank volgens het door de Nederlandsche Bank op grond van [artikel 12][ref2] vast te stellen omslagpercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel12
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '8'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '12'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '11.2'
    text: |-
      De bijdrageverplichting, bedoeld in het eerste lid, ontstaat op het tijdstip waarop de Nederlandsche Bank de
      betalingsonmacht van een bank constateert als bedoeld in [artikel 3:260, tweede lid, van de wet][ref1]. Banken die
      na dat tijdstip niet langer voldoen aan de in [artikel 8, eerste lid, onderdeel a][ref2], genoemde criteria blijven
      de bijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel8
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel11
    references:
