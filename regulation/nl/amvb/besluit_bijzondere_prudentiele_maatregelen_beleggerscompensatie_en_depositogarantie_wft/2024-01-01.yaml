        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 14.1.a
    text: een vast bedrag dat gelijk is voor alle financiële ondernemingen; en
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel14
  - number: 14.1.b
    text: |-
      een variabel bedrag dat wordt verkregen door het omslagpercentage, bedoeld in het tweede
      lid of, indien van toepassing, het derde lid, te vermenigvuldigen met het bedrag bedoeld in
      [artikel 13, eerste lid, onderdeel b][ref1], en verminderd met de som van de onder a bedoelde vaste bedragen.


