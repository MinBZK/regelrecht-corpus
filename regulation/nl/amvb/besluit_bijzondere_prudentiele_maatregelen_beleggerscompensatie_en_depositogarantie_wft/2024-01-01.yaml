  - number: '14.4'
    text: |-
      De Nederlandsche Bank kan een voorlopige bijdrage vaststellen. Van de voorlopig vastgestelde bijdrage betalen
      financiële ondernemingen als bedoeld in het eerste lid 70 procent bij wijze van voorschot aan de Nederlandsche
      Bank. Betaalde voorschotten worden met de definitieve bijdragen verrekend. Financiële ondernemingen als bedoeld in
      het eerste lid voldoen de voorschotten binnen een door de Nederlandsche Bank vastgestelde termijn.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel14
  - number: '15.1'
    text: |-
      De Nederlandsche Bank stelt, ambtshalve of op verzoek van representatieve vertegenwoordigingen, na overleg met
      deze vertegenwoordigingen, het bedrag vast van de bijdrage van iedere in [artikel 13, tweede lid][ref1], bedoelde
      financiële onderneming. Dat bedrag wordt verkregen door het omslagpercentage, bedoeld in het tweede lid of, indien
      van toepassing, het derde lid te vermenigvuldigen met het bedrag, bedoeld in [artikel 13, tweede lid][ref2].


