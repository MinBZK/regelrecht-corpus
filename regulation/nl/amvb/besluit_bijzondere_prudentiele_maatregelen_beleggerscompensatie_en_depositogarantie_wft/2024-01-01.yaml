        paragraaf: '6.2'
  - number: 13.1.b
    text: |-
      door de financiële ondernemingen, bedoeld in [artikel 8][ref1], die geen bank zijn: het meerdere, met inachtneming
      van [artikel 14][ref2], tot een maximum van € 11,3 miljoen.


