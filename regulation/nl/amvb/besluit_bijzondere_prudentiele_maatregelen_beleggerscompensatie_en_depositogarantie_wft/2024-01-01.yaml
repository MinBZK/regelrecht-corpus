  - number: 2.b
    text: |-
      ontwerpteksten van de mededelingen die de overdragende verzekeraar zal doen op grond van
      [artikel 3:119, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel2
