        paragraaf: '6.2'
  - number: '14.2'
    text: |-
      De Nederlandsche Bank stelt, ambtshalve of op verzoek van de representatieve vertegenwoordigingen, na overleg
      met deze vertegenwoordigingen, ten behoeve van de berekening van het in het eerste lid bedoelde bedrag een
      omslagpercentage vast aan de hand van de door de in dat lid bedoelde financiële ondernemingen aan de Nederlandsche
      Bank overgelegde gegevens over een door de Nederlandsche Bank nader vast te stellen periode betreffende het aantal
      personen wier vorderingen ingevolge [artikel 9][ref1] voor voldoening in aanmerking komen. Daarbij wordt het aantal
      van deze personen per financiële onderneming gedeeld door het totale aantal van deze personen bij alle financiële
      ondernemingen als bedoeld in het eerste lid gezamenlijk en het verkregen getal vermenigvuldigd met 100 procent.
      Hierbij worden de gegevens van de betalingsonmachtige financiële ondernemingniet meegeteld.


