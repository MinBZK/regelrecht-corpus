  - number: '16.1'
    text: |-
      De Stichting Beleggers Compensatiefonds draagt zorg voor het beheer en de instandhouding van een compensatiefonds
      dat is bestemd voor het aan de Nederlandsche Bank vergoeden van bedragen die deze heeft uitgekeerd ingevolge het
      beleggerscompensatiestelsel.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel16
  - number: '16.2'
    text: |-
      De Nederlandsche Bank is bevoegd om, na overleg met representatieve vertegenwoordigingen, de statuten van de
      Stichting Beleggers Compensatiefonds te wijzigen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel16
  - number: '16.3'
    text: |-
      Wijziging van de statuten behoeft de goedkeuring van Onze Minister. Onze Minister kan goedkeuring weigeren in het
      belang van een goede uitvoering van het beleggerscompensatiestelsel of wegens onverenigbaarheid van de gewijzigde
      statuten met de [wet][ref1] of dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '16.4'
    text: |-
      Het compensatiefonds wordt gevormd door bijdragen van de financiële ondernemingen, bedoeld in
      [artikel 8, eerste lid][ref1], die geen bank zijn en heeft een doelvermogen van € 11,3 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel8
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '8'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '16.5'
    text: |-
      De Nederlandsche Bank stelt periodiek, na overleg met representatieve vertegenwoordigingen, de omvang van
      de noodzakelijk geachte totale bijdrage aan het compensatiefonds vast. Indien het doelvermogen van het
      compensatiefonds niet is bereikt, bedraagt de omvang van de totale bijdrage aan het compensatiefonds jaarlijks
      ten minste € 750.000. Wanneer de Nederlandsche Bank, na overleg met representatieve vertegenwoordigingen, besluit
      tot een verhoging van de bijdrage, wordt deze verhoging ineens opgelegd of over een door haar te bepalen periode
      gespreid. De door de Nederlandsche Bank vastgestelde totale bijdrage wordt over de in het vierde lid bedoelde
      financiële ondernemingen omgeslagen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel16
  - number: '16.6'
    text: |-
      Onverminderd het hiervoor bepaalde, wordt bij het bepalen van de omvang van de totale bijdrage een voor alle
      in het vierde lid bedoelde financiële ondernemingen gelijke heffing vastgesteld, vermeerderd met een variabel
      bedrag dat voor de afzonderlijke financiële ondernemingen wordt berekend naar rato van het aantal personen
      wier vorderingen ingevolge [artikel 9][ref1] voor voldoening in aanmerking komen per financiële onderneming.
      [Artikel 14, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel14
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '9'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '14'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '16.7'
    text: |-
      De Nederlandsche Bank kan ten aanzien van een instelling die na de inwerkingtreding van dit besluit financiële
      onderneming wordt als bedoeld in [artikel 8][ref1] bepalen dat deze financiële onderneming, gedurende een alsdan
      vast te stellen termijn en frequentie, een bijdrage doet, waarvan de omvang door de Nederlandsche Bank wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel8
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '8'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '16.8'
    text: |-
      Indien het vermogen van het compensatiefonds het doelvermogen overschrijdt, kan de Nederlandsche Bank, na overleg
      met representatieve vertegenwoordigingen, het meerdere overeenkomstig een door haar vast te stellen verdeelsleutel
      laten uitkeren aan de financiële ondernemingen, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel16
  - number: '17.1'
    text: |-
      Het in enig kalenderjaar door een bank ingevolge [artikel 11, eerste lid][ref1] en [13, tweede lid][ref2], te
      betalen bedrag, vermeerderd met het op grond van [paragraaf 6.2][ref3] te betalen bedrag, is niet groter dan vijf
      procent van haar eigen vermogen. Een eventueel excedent wordt door de Nederlandsche Bank renteloos voorgeschoten.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0020414#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '11'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '13'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0020414
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '17.2'
    text: |-
      Het in enig kalenderjaar door een financiële onderneming die geen bank is, ingevolge
      [artikel 13, eerste en tweede lid][ref1] en [artikel 16, vijfde lid][ref2], te betalen bedrag is niet groter
      dan drie procent van haar eigen vermogen. Een eventueel excedent wordt door de Nederlandsche Bank renteloos
      voorgeschoten.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel16
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '13'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '16'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '17.3'
    text: |-
      Indien de solvabiliteits- of liquiditeitspositie van een bank, of de solvabiliteitspositie van een
      beleggingsonderneming daartoe aanleiding geeft, kan de Nederlandsche Bank voor die bank, onderscheidenlijk
      beleggingsonderneming, een lager percentage vaststellen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel17
  - number: '24.1'
    text: |-
      De Nederlandsche Bank doet de mededeling, bedoeld in [artikel 3:260, derde lid, van de wet][ref1], in de
      Staatscourant zo spoedig mogelijk na het nemen van het in het eerste lid van dat artikel bedoelde besluit tot het
      in werking stellen van het beleggerscompensatiestelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '24.2'
    text: |-
      Tevens doet de Nederlandsche Bank zo spoedig mogelijk nadat zij betalingsonmacht heeft vastgesteld mededeling door
      middel van advertenties in door haar te bepalen landelijke nieuwsbladen dat:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel24
  - number: 24.2.a
    text: |-
      zij het beleggerscompensatiestelsel, bedoeld in [artikel 3:259, eerste lid, van de wet][ref1], in werking geeft
      gesteld; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 24.2.b
    text: |-
      de personen, bedoeld in [artikel 9][ref1], binnen vijf maanden na de datum van de bekendmaking in de Staatscourant
      met gebruikmaking van een daartoe door de Nederlandsche Bank vast te stellen formulier een aanvraag tot vergoeding
      van de in [artikel 10][ref2] bedoelde vorderingen bij haar kunnen indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel10
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '9'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '10'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '24.3'
    text: |-
      De Nederlandsche Bank verzoekt de bewindvoerders of curatoren van de betalingsonmachtige financiële onderneming
      om in hun correspondentie met de personen, bedoeld in [artikel 9][ref1], te wijzen op het in werking stellen van
      het beleggerscompensatiestelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel9
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '9'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '24.4'
    text: |-
      De Nederlandsche Bank neemt aanvragen die na het verstrijken van de termijn, bedoeld in het tweede lid, onderdeel
      b, zijn ingediend niet in behandeling, tenzij redelijkerwijs niet kan worden geoordeeld dat de aanvrager in verzuim
      is.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel24
  - number: '25.1'
    text: |-
      De Nederlandsche Bank stelt het bestaan en de waarde van de ingediende en ingevolge [artikel 10][ref1] voor
      vergoeding in aanmerking komende vorderingen vast aan de hand van de op de vorderingen toepasselijke wettelijke
      bepalingen en contractuele voorwaarden, de administratie van de betalingsonmachtige financiële onderneming en
      eventuele andere relevante documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel10
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '10'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '25.2'
    text: |-
      De Nederlandsche Bank baseert zich bij de waardevaststelling van vorderingen die in vreemde valuta luiden op
      de referentiekoersen van de Europese Centrale Bank zoals deze golden op de dag waarop de Nederlandsche Bank de
      betalingsonmacht constateerde.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel25
  - number: '26.1'
    text: |-
      Vorderingen als bedoeld in [artikel 10, eerste lid, aanhef en onderdeel a][ref1], die door de Nederlandsche Bank
      zijn vastgesteld, worden voldaan in de vorm van terugbetaling tot het in het vierde lid genoemde maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel10
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '10'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '26.2'
    text: |-
      Vorderingen als bedoeld in [artikel 10, eerste lid, onderdeel b][ref1], die door de Nederlandsche Bank zijn
      vastgesteld, worden voorzover mogelijk voldaan door het teruggeven van de in artikel 10, eerste lid, onderdeel
      b, genoemde financiële instrumenten. Indien dit niet mogelijk is, wordt de vordering in geld voldaan tot het
      in het vierde lid genoemde maximum. In het laatste geval wordt de waarde van de vordering, tenzij wettelijk of
      contractueel anders is bepaald, vastgesteld op de marktwaarde van de financiële instrumenten op het tijdstip waarop
      de Nederlandsche Bank de betalingsonmacht bij de financiële onderneming constateerde.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel10
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '10'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '26.3'
    text: |-
      Bij het vaststellen van de waarde van een vastgestelde vordering houdt de Nederlandsche Bank rekening met mogelijke
      bevoegdheden om die vordering en andere vorderingen onderling op grond van de [wet][ref1] of overeenkomst te
      verrekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '26.4'
    text: |-
      Voor voldoening komen in aanmerking vorderingen tot maximaal € 20.000 per persoon als bedoeld in [artikel 9][ref1]
      per betalingsonmachtige financiële onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel9
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '9'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '26.5'
    text: |-
      Tenzij contractueel is bepaald dat de personen, bedoeld in [artikel 9, onderdeel b][ref1], in een andere verhouding
      gerechtigd zijn tot de vorderingen, ontvangen zij ieder een vergoeding ter grootte van een evenredig deel van het
      totaal van de vastgestelde vorderingen met inachtneming van hetgeen in het tweede lid is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel9
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '9'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '26.6'
    text: |-
      Is er meer dan een derde als bedoeld in [artikel 9, onderdeel c][ref1], dan wordt het aandeel van elk van hen en de
      vergoeding als bedoeld in het tweede lid aan elk van hen berekend op de voet van het vijfde lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel9
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '9'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '26.7'
    text: |-
      Onze Minister kan besluiten dat, in afwijking van het vierde lid, andere maxima gelden voor de voor voldoening in
      aanmerking komende vorderingen. Onze Minister maakt het besluit daartoe bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel26
  - number: '27.1'
    text: |-
      In geval van een vergoeding op grond van het beleggerscompensatiestelsel betaalt de Nederlandsche Bank zo spoedig
      mogelijk, doch in elk geval binnen drie maanden nadat een van de volgende tijdstippen zich als eerste heeft
      voorgedaan:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel27
  - number: 27.1.a
    text: |-
      het tijdstip waarop de Nederlandsche Bank de beleggerscompensatieregeling in werking heeft gesteld ingevolge
      [artikel 3:260, eerste lid, aanhef en onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 27.1.b
    text: het tijdstip waarop de rechtbank de noodregeling heeft uitgesproken;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel27
  - number: 27.1.c
    text: het tijdstip waarop de rechtbank het faillissement heeft uitgesproken.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel27
  - number: '27.2'
    text: |-
      De betaling vindt plaats op een door de aanvrager aangewezen rekening bij een bank met zetel in een lidstaat of bij
      een in een lidstaat gelegen bijkantoor van een bank met zetel in een staat die geen lidstaat is.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel27
  - number: '27.3'
    text: |-
      De betaling vindt slechts plaats indien de aanvrager eventuele rechten tot teruggave of terugbetaling van
      financiële instrumenten jegens derden tot de hoogte van het uitbetaalde bedrag overdraagt aan de Nederlandsche
      Bank.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel27
  - number: '28'
    text: |-
      Indien een aanvrager strafrechtelijk wordt vervolgd ter zake van een misdrijf dat voortvloeit uit of verband houdt
      met het witwassen van geld kan de Nederlandsche Bank de termijnen, bedoeld in [artikel 27, eerste lid][ref1],
      opschorten. Deze opschorting eindigt zodra de vervolging is beëindigd of de beslissing van de bevoegde rechterlijke
      instantie onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel27
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '27'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '29.1'
    text: |-
      De Nederlandsche Bank verhaalt, voorzover mogelijk, de aan haar ingevolge [artikel 27,derde lid][ref1],
      overgedragen vorderingen of de rechten waarin zij overeenkomstig [artikel 3:261, derde lid, van de wet][ref2] is
      getreden, op de betalingsonmachtige financiële onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '27'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '29.2'
    text: |-
      De baten die door de Nederlandsche Bank worden ontvangen ingevolge het in het eerste lid bedoelde verhaal, worden
      door haar uitgekeerd aan de financiële ondernemingen die op grond van de [artikelen 11][ref1] en [13][ref2] een
      bijdrage hebben gedaan. Bij de uitkering zal het vastgestelde omslagpercentage worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel13
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '11'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '13'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 29.01.1
    text: 'Het depositogarantiestelsel garandeert deposito’s aangehouden bij:'
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.1.a
    text: |-
      banken met een vergunning als bedoeld in [artikel 2:11 van de wet][ref1], met uitzondering van deposito’s die
      worden aangehouden bij een bijkantoor in een staat die geen lidstaat is;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 29.01.1.b
    text: |-
      banken als bedoeld in [artikel 3:266, eerste lid, onderdeel b, van de wet][ref1], voor zover het deposito’s betreft
      die worden aangehouden bij een in Nederland gelegen bijkantoor;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.01.1.c
    text: |-
      banken als bedoeld in [artikel 3:267, tweede lid, van de wet][ref1], voor zover het deposito’s betreft die worden
      aangehouden bij een in Nederland gelegen bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.01.2
    text: 'Het depositogarantiestelsel is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.a
    text: 'deposito’s van:'
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.a.1°
    text: |-
      banken, voor zover het deposito’s betreft die door een bank in eigen naam en voor eigen rekening worden
      aangehouden;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.a.2°
    text: financiële instellingen;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.a.3°
    text: beleggingsondernemingen;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.a.4°
    text: |-
      depositohouders die zich niet hebben geïdentificeerd overeenkomstig
      [artikel 4, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel4
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '4'
  - number: 29.01.2.a.5°
    text: |-
      verzekeringsondernemingen en herverzekeringsondernemingen als bedoeld in artikel 13, onderdelen 1 tot en met 6, van
      de richtlijn solvabiliteit II;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.a.6°
    text: beleggingsinstellingen, beheerders van beleggingsinstellingen, icbe’s en beheerders van icbe’s;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.a.7°
    text: pensioenfondsen;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.a.8°
    text: overheden;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.b
    text: instrumenten die vallen onder de definitie van eigen vermogen in de zin van de verordening kapitaalvereisten;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.c
    text: door een bank uitgegeven schuldbewijzen en schulden die voortvloeien uit eigen accepten en promessen;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.d
    text: |-
      deposito’s uit hoofde van transacties in verband waarmee een strafrechtelijke veroordeling is uitgesproken vanwege
      het witwassen van geld;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
  - number: 29.01.2.e
    text: |-
      bankspaardeposito’s eigen woning, voor zover deze ingevolge [artikel 3:265d van de wet][ref1] worden verrekend met
      een verbonden eigenwoningschuld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.01
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.02.1
    text: |-
      Ingevolge het depositogarantiestelsel zijn deposito’s als bedoeld in [artikel 29.01][ref1] gegarandeerd tot een
      bedrag van € 100.000 per depositohouder per bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 29.02.2
    text: |-
      Ingeval van een gezamenlijke rekening geldt de garantie voor elk van de depositohouders afzonderlijk voor een
      evenredig aandeel in het deposito, tenzij contractueel anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.02
  - number: 29.02.3
    text: |-
      Indien een depositohouder een deposito aanhoudt op eigen naam doch ten behoeve van een derde krachtens
      overeenkomst of wettelijk voorschrift, geldt de garantie voor deze derde en wordt deze voor de toepassing
      van deze paragraaf als depositohouder aangemerkt, mits diens identiteit kan worden vastgesteld voorafgaand
      aan de datum van de beslissing van de Nederlandsche Bank of van de gerechtelijke uitspraak, bedoeld in
      [artikel 3:260, eerste lid, onderdeel a, onderscheidenlijk onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.02.4
    text: |-
      Onverminderd het eerste lid, is een deposito voor zover dat direct verband houdt met de
      nakoming van een koopovereenkomst die betrekking heeft op een eigen woning in de zin van
      [artikel 3.111 van de Wet inkomstenbelasting 2001][ref1] gegarandeerd tot een bedrag van € 500.000 per
      depositohouder per bank. Deze garantie geldt gedurende drie maanden na storting van het deposito.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 29.03.1
    text: |-
      Een bank verstrekt met betrekking tot het toepasselijke depositogarantiestelsel aan depositohouders de informatie,
      bedoeld in artikel 16 van de richtlijn depositogarantiestelsels, met inachtneming van hetgeen in artikel 16 van die
      richtlijn ten aanzien van de verstrekking van die informatie is bepaald.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.03
  - number: 29.03.2
    text: |-
      Een bank stelt houders van bankspaardeposito’s eigen woning voor het aangaan van de deposito-overeenkomst in
      kennis van de verrekening van die deposito’s ingevolge [artikel 3:265d van de wet][ref1] bij de toepassing van
      het depositogarantiestelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.03
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.04.1
    text: |-
      Indien de Nederlandsche Bank besluit tot toepassing van het depositogarantiestelsel op grond van
      [artikel 3:260, eerste lid, van de wet][ref1], doet zij daarvan onverwijld mededeling in de Staatscourant alsmede
      in door haar te bepalen landelijke nieuwsbladen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.04
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.04.2
    text: |-
      In de mededeling wordt vermeld op welke wijze en gedurende welke termijn depositohouders die menen voor vergoeding
      uit hoofde van het depositogarantiestelsel in aanmerking te komen hun aanspraken kenbaar kunnen maken.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.04
  - number: 29.04.3
    text: |-
      De Nederlandsche Bank verzoekt bewindvoerders of curatoren van de betalingsonmachtige bank in hun correspondentie
      met depositohouders te wijzen op de toepasselijkheid van het depositogarantiestelsel.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.04
  - number: 29.05.1
    text: |-
      De vergoedingen uit hoofde van het depositogarantiestelsel die de Nederlandsche Bank op grond van
      [artikel 3:261, eerste lid, van de wet][ref1] toekent, worden toegekend ten laste van het Depositogarantiefonds.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.05
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.05.2
    text: |-
      Het Depositogarantiefonds maakt de ingevolge het eerste lid toegekende vergoedingen onverwijld beschikbaar voor
      uitkering.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.05
  - number: 29.05.3
    text: |-
      Behoudens de in het vierde en vijfde lid genoemde gevallen, wordt een vergoeding toegekend
      en beschikbaar gemaakt voor uitkering binnen de volgende termijn te rekenen vanaf de datum
      van de beslissing van de Nederlandsche Bank of van de gerechtelijke uitspraak, bedoeld in
      [artikel 3:260, eerste lid, onderdeel a, onderscheidenlijk onderdeel b, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.05
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.05.3.a
    text: 'tot en met 31 december 2018: binnen twintig werkdagen;'
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.05
  - number: 29.05.3.b
    text: 'vanaf 1 januari 2019 tot en met 31 december 2020: binnen vijftien werkdagen;'
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.05
  - number: 29.05.3.c
    text: 'vanaf 1 januari 2021 tot en met 31 december 2023: binnen tien werkdagen;'
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.05
  - number: 29.05.3.d
    text: 'vanaf 1 januari 2024: binnen zeven werkdagen.'
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.05
  - number: 29.05.4
    text: |-
      In afwijking van het derde lid geldt voor het toekennen en beschikbaar maken voor uitkering van een
      vergoeding aan een derde als bedoeld in [artikel 29.02, derde lid][ref1], een termijn van drie maanden
      na de datum van de beslissing van de Nederlandsche Bank of van de gerechtelijke uitspraak, bedoeld in
      [artikel 3:260, eerste lid, onderdeel a, onderscheidenlijk onderdeel b, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.05
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.05.5
    text: |-
      Het toekennen van een vergoeding kan worden uitgesteld in de gevallen, bedoeld in artikel 8, vijfde lid, van de
      richtlijn depositogarantiestelsels.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.05
  - number: 29.06.1
    text: |-
      De Nederlandsche Bank kent de vergoedingen uit hoofde van het depositogarantiestelsel toe aan de hand van de op de
      gegarandeerde deposito’s toepasselijke wettelijke bepalingen of contractuele voorwaarden, de administratie van de
      betalingsonmachtige bank en eventuele andere relevante documenten.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.06
  - number: 29.06.2
    text: |-
      Indien op gegarandeerde deposito’s rente is aangegroeid die nog niet is gecrediteerd op de
      datum van de beslissing van de Nederlandsche Bank of van de gerechtelijke uitspraak, bedoeld in
      [artikel 3:260, eerste lid, onderdeel a, onderscheidenlijk onderdeel b, van de wet][ref1], wordt het aangegroeide
      rentebedrag gerekend tot de deposito’s.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.06
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.06.3
    text: |-
      De vaststelling van de waarde van deposito’s die worden aangehouden in vreemde valuta wordt gebaseerd op de
      referentiekoersen van de Europese Centrale Bank, zoals deze golden op de datum, bedoeld in het tweede lid. Voor
      vreemde valuta waarvoor de Europese Centrale Bank geen referentiekoers bepaalt, bepaalt de Nederlandsche Bank de
      referentiekoers.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.06
  - number: 29.06.4
    text: |-
      De vergoeding wordt bepaald op nihil indien er met betrekking tot de betrokken deposito’s gedurende vierentwintig
      maanden voorafgaand aan het tijdstip, bedoeld in het tweede lid, geen transactie door of namens de depositohouder
      heeft plaatsgevonden en de hoogte van een vergoeding voor een depositohouder lager zou zijn dan de kosten van het
      uitkeren van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.06
  - number: 29.07.1
    text: |-
      Gedurende drie maanden na de mededeling tot toepassing van het depositogarantiestelsel kunnen depositohouders
      schriftelijk of door in te loggen op een daartoe ingerichte website bewerkstelligen dat toegekende en beschikbaar
      gemaakte vergoedingen worden uitgekeerd door het nummer en de tenaamstelling van de rekening waarnaar de
      overboeking kan worden uitgevoerd, mede te delen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.07
  - number: 29.07.2
    text: |-
      Toegekende vergoedingen kunnen worden uitgekeerd in de munteenheden, bedoeld in artikel 6, vierde lid, van
      de richtlijn depositogarantiestelsels. De Nederlandsche Bank bepaalt in welke munteenheid vergoedingen worden
      uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.07
  - number: 29.07.3
    text: |-
      Toegekende vergoedingen worden uitgekeerd mits depositohouders geen gebruik hebben gemaakt en verklaren af te
      zien van het gebruik van hun bevoegdheden om hun vorderingen, voor zover deze voor vergoeding uit hoofde van het
      depositogarantiestelsel in aanmerking komen, te verrekenen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.07
  - number: 29.07.4
    text: |-
      De Nederlandsche Bank kan besluiten dat de uitkering van een toegekende vergoeding wordt opgeschort indien een
      depositohouder wordt vervolgd ter zake van een misdrijf dat voortvloeit uit of verband houdt met het witwassen
      van geld. De opschorting eindigt zodra de vervolging is beëindigd of de beslissing van de bevoegde rechterlijke
      instantie onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.07
  - number: '29.09'
    text: |-
      Onder toepassing van [artikel 3:41, tweede lid, van de Algemene wet bestuursrecht][ref1], geschiedt de bekendmaking
      van een besluit op grond van [artikel 29.05, eerste lid][ref2], tot toekenning van een vergoeding aan een
      depositohouder die heeft ingelogd op de website, bedoeld in [artikel 29.07, eerste lid][ref3], door publicatie van
      dat besluit door de Nederlandsche Bank op die website.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0020414#Artikel29
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.09
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 29.10.1
    text: |-
      De leden van het bestuur van het Depositogarantiefonds, bedoeld in [artikel 3:259a van de wet][ref1], worden
      benoemd voor een periode van vier jaar, met de mogelijkheid van herbenoeming. Op de leden van het bestuur, is
      [artikel 14, vierde lid, van de Kaderwet zelfstandige bestuursorganen][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel14
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.10
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '14'
  - number: 29.10.2
    text: |-
      Op de taakuitoefening van het Depositogarantiefonds zijn de [artikelen 20][ref1], [23, eerste en tweede lid][ref2],
      en [41, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref3] van overeenkomstige toepassing,
      met dien verstande dat voor «Onze Minister» wordt gelezen: de Nederlandsche Bank. De Nederlandsche
      Bank stelt Onze Minister onverwijld in kennis van door haar getroffen voorzieningen als bedoeld in
      [artikel 23, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.10
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '41'
      - id: ref4
        bwb_id: BWBR0020495
        artikel: '23'
  - number: 29.10.3
    text: |-
      Het Depositogarantiefonds legt verantwoording af over haar taakuitoefening met overeenkomstige toepassing van de
      [artikelen 18, eerste lid, met uitzondering van de laatste volzin][ref1], [26][ref2], [34, eerste lid][ref3], en
      [35, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref4], met dien verstande dat voor «Onze Minister»
      wordt gelezen: de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel35
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.10
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0020495
        artikel: '35'
  - number: 29.11.1
    text: |-
      Het Depositogarantiefonds bestaat uit een individueel gedeelte, bestaande uit het totaal van de individuele saldi
      van de banken, bedoeld in [artikel 29.01, eerste lid][ref1], en een algemeen gedeelte.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.11
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 29.11.2
    text: |-
      De doelomvang van het individueel saldo van een bank is 0,4% van diens depositobasis. De doelomvang van het
      algemeen gedeelte is 0,4% van de depositobases van de banken gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.11
  - number: 29.11.3
    text: |-
      De hoogte van de ingevolge deze paragraaf verschuldigde bijdragen wordt zodanig vastgesteld dat het
      Depositogarantiefonds de doelomvang, bedoeld in het tweede lid, bereikt binnen de termijn die volgt uit artikel 10,
      tweede lid, van de richtlijn depositogarantiestelsels.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.11
  - number: 29.12.1
    text: |-
      Een bank als bedoeld in [artikel 29.01, eerste lid][ref1], is aan het Depositogarantiefonds elk kwartaal een
      bijdrage verschuldigd indien het individueel saldo van de bank of de omvang van het algemeen gedeelte van het
      Depositogarantiefonds lager is dan de doelomvang van het individueel saldo onderscheidenlijk van het algemeen
      gedeelte, bedoeld in [artikel 29.11, tweede lid][ref2]. De bijdrage is gebaseerd op de depositobasis van een bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel29
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.12
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 29.12.2
    text: De Nederlandsche Bank stelt de hoogte van de bijdrage vast.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.12
  - number: 29.12.3
    text: |-
      De hoogte van de bijdrage wordt vastgesteld overeenkomstig [bijlage B][ref1] bij dit besluit en bestaat uit de
      volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0020414
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.12
    references:
      - id: ref1
        bwb_id: BWBR0020414
  - number: 29.12.3.a
    text: een basisbijdrage;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.12
  - number: 29.12.3.b
    text: een suppletie;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.12
  - number: 29.12.3.c
    text: een risicobijdrage;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.12
  - number: 29.12.3.d
    text: een risicosuppletie.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.12
  - number: 29.12.4
    text: |-
      De hoogte van de risicobijdrage en risicosuppletie is tevens afhankelijk van een benadering van de soliditeit van
      een bank, uitgedrukt in een risicowegingspercentage. Het risicowegingspercentage van een bank wordt vastgesteld
      met behulp van risicoindicatoren overeenkomstig [bijlage C][ref1] bij dit besluit. Bij ministeriële regeling worden
      nadere regels gesteld over het gebruik en de weging van de risicoindicatoren.


      [ref1]: https://wetten.overheid.nl/BWBR0020414
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.12
    references:
      - id: ref1
        bwb_id: BWBR0020414
  - number: 29.12.5
    text: |-
      De Nederlandsche Bank kan in verband met de economische vooruitzichten en het verwachte macroprudentiële effect
      van de ingevolge deze paragraaf verschuldigde bijdragen op de banken overeenkomstig [bijlage B][ref1] een
      correctiefactor toepassen bij de berekening van de bijdrage. De correctiefactor overschrijdt niet de bandbreedte
      als bepaald in [bijlage B][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020414
      [ref2]: https://wetten.overheid.nl/BWBR0020414
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.12
    references:
      - id: ref1
        bwb_id: BWBR0020414
      - id: ref2
        bwb_id: BWBR0020414
  - number: 29.13.1
    text: |-
      De door de banken verschuldigde basisbijdragen en suppleties komen ten goede aan de individuele saldi van de banken
      in het individuele gedeelte van het Depositogarantiefonds. De door de banken verschuldigde risicobijdragen en
      risicosuppleties komen ten goede aan het algemene gedeelte van het Depositogarantiefonds.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.13
  - number: 29.13.2
    text: 'Indien het Depositogarantiefonds vergoedingen uitkeert, keert zij deze uit ten laste van achtereenvolgens:'
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.13
  - number: 29.13.2.a
    text: het individuele saldo van de betalingsonmachtige bank of bank die in afwikkeling is in het individuele gedeelte;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.13
  - number: 29.13.2.b
    text: het algemene gedeelte;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.13
  - number: 29.13.2.c
    text: de individuele saldi van de overige banken in het individuele gedeelte naar rato van de depositobases.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.13
  - number: 29.14.1
    text: |-
      Indien binnen het Depositogarantiefonds de financiële middelen ontoereikend zijn, worden ter verkrijging van de
      benodigde financiële middelen buitengewone bijdragen geheven. De buitengewone bijdragen worden geheven van banken
      die op het moment waarop de financiële middelen in het fonds ontoereikend worden, een bank zijn als bedoeld in
      [artikel 29.01, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.14
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 29.14.2
    text: |-
      De financiële middelen binnen het Depositogarantiefonds zijn ontoereikend indien onvoldoende financiële middelen
      beschikbaar zijn voor:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.14
  - number: 29.14.2.a
    text: |-
      het uitkeren van vergoedingen uit hoofde van het depositogarantiestelsel indien op grond van
      [artikel 3:260, eerste lid van de wet][ref1] is besloten tot toepassing van het depositogarantiestelsel; of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.14
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.14.2.b
    text: |-
      het uitkeren van het bedrag dat ingevolge [artikel 3:265e van de wet][ref1] ten laste van het
      depositogarantiestelsel beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.14
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.14.3
    text: |-
      De Nederlandsche Bank stelt de hoogte van de aan het Depositogarantiefonds verschuldigde buitengewone bijdragen
      vast overeenkomstig [bijlage D][ref1] bij dit besluit. Bij de vaststelling wordt de begrenzing van de hoogte van
      de buitengewone bijdragen die volgt uit artikel 10, achtste lid, van de richtlijn depositogarantiestelsels in acht
      genomen. De Nederlandsche Bank kan overeenkomstig artikel 10, achtste lid, van de richtlijn de betaling van een
      buitengewone bijdrage opschorten indien de solvabiliteits- of liquiditeitspositie van een bank daartoe aanleiding
      geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020414
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.14
    references:
      - id: ref1
        bwb_id: BWBR0020414
  - number: 29.14.4
    text: |-
      Het Depositogarantiefonds kan, voor het geval dat de buitengewone bijdragen niet onmiddellijk beschikbaar of
      ontoereikend zijn, overeenkomsten aangaan tot het verkrijgen van financiering van derden. De overeenkomsten
      behoeven de voorafgaande instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.14
  - number: 29.14.5
    text: |-
      Het bestuur van het Depositogarantiefonds stelt een financieringsplan vast voor het verkrijgen van
      kortetermijnfinanciering voor het geval dat de buitengewone bijdragen niet onmiddellijk beschikbaar of toereikend
      zijn.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.14
  - number: 29.14a.1
    text: |-
      Indien ingevolge [artikel 29.14][ref1] van een bank een buitengewone bijdrage zal worden geheven, kan de
      Nederlandsche Bank bepalen dat de bank hierop een voorschot voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.14a
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 29.14a.2
    text: |-
      Het betaalde voorschot wordt verrekend met de ingevolge [artikel 29.14][ref1] verschuldigde buitengewone bijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.14a
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 29.15.1
    text: |-
      De Nederlandsche Bank besluit tot restitutie ten laste van het Depositogarantiefonds van baten
      die worden verkregen door de uitoefening van de rechten waarin het Depositogarantiefonds ingevolge
      [artikel 3:261, vijfde lid, van de wet][ref1] is getreden, aan banken uitsluitend voor zover die banken
      buitengewone bijdragen hebben betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.15
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.15.2
    text: |-
      Voor zover na restitutie baten resteren, komen deze ten goede aan het Depositogarantiefonds, eerst aan de
      individuele saldi in het individuele gedeelte voor zover aangesproken, naar rato van de depositobases van de
      banken, vervolgens aan het algemene gedeelte.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.15
  - number: 29.16.1
    text: |-
      Voor het vaststellen van de ingevolge deze paragraaf door een bank verschuldigde bijdragen
      wordt in aanmerking genomen de depositobasis van de bank zoals vermeld in de staten, bedoeld in
      [artikel 130, eerste lid, onderdeel b, van het Besluit prudentiële regels Wft][ref1], die de bank in het
      voorafgaande kwartaal heeft overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.16
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '130'
  - number: 29.16.2
    text: |-
      Indien een bank niet tijdig de staten heeft overgelegd, schat de Nederlandsche Bank de omvang van de depositobasis
      en stelt zij op basis van die schatting de bijdragen vast.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.16
  - number: 29.17.1
    text: |-
      De Nederlandsche Bank kan banken toestaan een deel van de ingevolge deze paragraaf verschuldigde bijdragen te
      voldoen in de vorm van betalingsverplichtingen als bedoeld in artikel 2, tweede lid, punt dertien, van de richtlijn
      depositogarantiestelsels.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.17
  - number: 29.17.2
    text: |-
      De in artikel 10, derde lid, van de richtlijn depositogarantiestelsels gestelde limiet aan het toestaan van
      betalingsverplichtingen is van toepassing.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.17
  - number: 29.18.1
    text: |-
      Een groep banken met een vrijstelling als bedoeld in [artikel 3:111, eerste lid, van de wet][ref1] wordt
      gezamenlijk als een bank aangemerkt voor de toepassing van deze paragraaf. Van die groep is uitsluitend de centrale
      kredietinstelling de ingevolge deze paragraaf te betalen bijdragen verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.18.2
    text: |-
      De Nederlandsche Bank kan op verzoek van een groep banken voor de toepassing van deze paragraaf die banken als
      één bank aanmerken. De Nederlandsche Bank bepaalt daarbij welke rechtspersoon binnen de groep de ingevolge deze
      paragraaf te betalen bijdragen bij uitsluiting verschuldigd is. Bij uittreding van een bank uit de groep wordt
      het opgebouwde individuele saldo, bedoeld in [artikel 29.11][ref1], van de groep naar rato van de depositobases op
      het laatste voorafgaande toetsmoment verdeeld tussen de uittredende bank en de rest van de groep. Bij toetreding
      van een bank tot een groep worden de opgebouwde individuele saldi van de toetredende bank en de groep bij elkaar
      opgeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.18
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 29.19.1
    text: |-
      De financiële middelen van het Depositogarantiefonds worden aangehouden in contant geld, deposito’s,
      betalingsverplichtingen als bedoeld in [artikel 29.17][ref1], en activa met een laag risico en kunnen worden
      geliquideerd binnen de termijn, bedoeld in [artikel 29.05, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel29
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.19
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 29.19.2
    text: |-
      Activa met een laag risico zijn activa die vallen in de eerste of tweede categorie van tabel 1 van artikel 336 van
      de verordening kapitaalvereisten of activa die door de Nederlandsche Bank in vergelijkbare mate veilig en liquide
      worden geacht.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.19
  - number: 29.19.3
    text: De financiële middelen van het Depositogarantiefonds worden op voldoende gediversifieerde wijze belegd.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.19
  - number: 29.19.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het beleggingsbeleid.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.19
  - number: 29.20.1
    text: |-
      Indien gegarandeerde deposito’s als gevolg van een bedrijfsverplaatsing niet langer worden aangehouden bij een bank
      als bedoeld in [artikel 29.01, eerste lid][ref1], maar bij een bank met zetel in een andere lidstaat, wordt ten
      laste van het Depositogarantiefonds een door de Nederlandsche Bank overeenkomstig artikel 14, derde lid, van de
      richtlijn depositogarantiestelsels te bepalen bedrag voldaan aan het depositogarantiestelsel in de andere lidstaat
      dat van toepassing wordt op de verplaatste gegarandeerde deposito’s.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.20
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 29.20.2
    text: |-
      De bank, bedoeld in het eerste lid, geeft ten minste zes maanden voorafgaand aan de voorgenomen verplaatsing
      schriftelijk kennis van dat voornemen aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29.20
  - number: 29a
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder: - *het Nederlandse beleggerscompensatiesatiestelsel:*
      het beleggerscompensatiestelsel, bedoeld in [artikel 3:259, eerste lid, van de wet][ref1];
        - *het Nederlandse depositogarantiestelsel:* het depositogarantiestelsel, bedoeld in
      [artikel 3:259, tweede lid, van de wet][ref2];
        - *de Nederlandse vangnetregeling:* het Nederlandse beleggerscompensatiesatiestelsel of het Nederlandse
      depositogarantiestelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29b.1
    text: |-
      Een bank, beleggingsonderneming of financiële instelling als bedoeld in
      [artikel 3:258, eerste lid, onderdeel c, van de wet][ref1], met zetel in een andere lidstaat die haar bedrijf
      uitoefent onderscheidenlijk beleggingsdiensten verleent vanuit een in Nederland gelegen bijkantoor en die op grond
      van [artikel 3:266, tweede, derde of vierde lid, van de wet][ref2] voornemens is aanvullend deel te nemen aan de
      Nederlandse vangnetregeling, geeft de Nederlandsche Bank schriftelijk kennis van dat voornemen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29b.2
    text: |-
      Met betrekking tot het voornemen legt de financiële onderneming een beschrijving over van de omvang en reikwijdte
      van de dekking van de desbetreffende toepasselijke vangnetregeling in de andere lidstaat en in hoeverre deze
      afwijkt van de Nederlandse vangnetregeling waaraan de financiële onderneming voornemens is aanvullend deel te
      nemen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29b
  - number: 29b.3
    text: |-
      De financiële onderneming neemt slechts aanvullend deel aan de Nederlandse vangnetregeling indien aan de volgende
      voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29b
  - number: 29b.3.a
    text: |-
      er zijn geen operationele of juridische risico’s die een goede uitvoering van de Nederlandse vangnetregeling in
      de weg staan als gevolg van de wederzijdse verplichtingen van de betrokken vangnetregelingen of als gevolg van de
      aanvullende deelname van de financiële onderneming;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29b
  - number: 29b.3.b
    text: |-
      de financiële onderneming en de uitvoerder van de vangnetregeling in de lidstaat waar de financiële onderneming
      haar zetel heeft, hebben aangetoond dat er voldoende waarborgen zijn dat zij de verplichtingen die voortvloeien uit
      deelname door de financiële onderneming aan de Nederlandse vangnetregeling zullen naleven;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29b
  - number: 29b.3.c
    text: |-
      de financiële onderneming en de uitvoerder van de vangnetregeling in de lidstaat waar de financiële onderneming
      haar zetel heeft, hebben in voldoende mate aan de Nederlandsche Bank aannemelijk gemaakt dat de aanvullende
      deelname de Nederlandse vangnetregeling niet zodanig beïnvloedt dat een eventueel beroep door de beleggers of
      depositohouders van de aanvullend deelnemende financiële onderneming de stabiliteit van de Nederlandse financiële
      sector of de bescherming door de Nederlandse vangnetregeling van beleggers of depositohouders in gevaar brengt;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29b
  - number: 29b.3.d
    text: |-
      tussen de Nederlandsche Bank en de uitvoerder van de vangnetregeling in de lidstaat waar de financiële onderneming
      haar zetel heeft, is een samenwerkingsovereenkomst gesloten waarin ten minste de wederzijdse verplichtingen op
      grond van de betrokken vangnetregelingen en de juridische en operationele aspecten van de uitvoering ervan zijn
      vastgelegd; en
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29b
  - number: 29b.3.e
    text: |-
      tussen de Nederlandsche Bank en de financiële onderneming is een toetredingsovereenkomst gesloten, waarin in elk
      geval de juridische en operationele aspecten van de uitvoering van de Nederlandse vangnetregeling zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29b
  - number: 29b.4
    text: De financiële onderneming voldoet aan de toetredingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29b
  - number: 29b.5
    text: |-
      Aan de aanvullende deelname aan de Nederlandse vangnetregeling kunnen door de Nederlandsche Bank voorschriften
      worden verbonden en beperkingen gesteld met het oog op de stabiliteit van de Nederlandse financiële sector of de
      bescherming door de Nederlandse vangnetregeling van beleggers of depositohouders.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29b
  - number: 29c.1
    text: |-
      Indien de financiële onderneming, bedoeld in [artikel 29b][ref1], niet voldoet aan het
      [vierde lid van dat artikel][ref2] of aan hetgeen overigens bij of krachtens de [wet][ref3] is bepaald, stelt de
      Nederlandsche Bank de toezichthoudende instantie van de andere lidstaat hiervan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel29b
      [ref3]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: 29b
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: 29b
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref3
        bwb_id: BWBR0020368
  - number: 29c.2
    text: |-
      De Nederlandsche Bank kan, na de toezichthoudende instantie van de lidstaat waar de financiële onderneming haar
      zetel heeft daarvan in kennis te hebben gesteld, het besluit nemen dat de betrokken financiële onderneming geen
      nieuwe overeenkomsten in Nederland mag afsluiten, indien deze niet voldoet aan [artikel 29b, vierde lid][ref1], of
      aan hetgeen overigens bij of krachtens de [wet][ref2] is bepaald:


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: 29b
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref2
        bwb_id: BWBR0020368
  - number: 29c.2.a
    text: in weerwil van de maatregelen, getroffen door die toezichthoudende instantie;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29c
  - number: 29c.2.b
    text: in het geval deze maatregelen ontoereikend zijn; of
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29c
  - number: 29c.2.c
    text: in het geval die toezichthoudende instantie geen maatregelen heeft getroffen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29c
  - number: 29c.3
    text: |-
      De Nederlandsche Bank kan tevens, na de toezichthoudende instantie van de lidstaat waar de financiële onderneming
      haar zetel heeft daarvan in kennis te hebben gesteld met de toestemming van de toezichthouder van de andere
      lidstaat de overeenkomst, bedoeld in [artikel 29b, derde lid, onderdeel e][ref1], opzeggen met een termijn van ten
      minste twaalf maanden indien de financiële onderneming niet voldoet aan verplichtingen uit die overeenkomst of aan
      hetgeen bij of krachtens deze wet is bepaald:


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29b
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: 29b
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: 29c.3.a
    text: in weerwil van de maatregelen, getroffen door die toezichthoudende instantie;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29c
  - number: 29c.3.b
    text: in het geval deze maatregelen ontoereikend zijn; of
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29c
  - number: 29c.3.c
    text: in het geval die toezichthoudende instantie geen maatregelen heeft getroffen.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29c
  - number: 29c.4
    text: Indien het derde lid is toegepast, eindigt de aanvullende deelname op de dag waartegen de overeenkomst is opgezegd.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29c
  - number: 29d.1
    text: |-
      In de samenwerkingsovereenkomst en toetredingsovereenkomst, bedoeld in
      [artikel 29b, derde lid, onderdeel d onderscheidenlijk e][ref1], wordt in ieder geval vastgelegd dat de
      Nederlandsche Bank de samenwerkingsovereenkomst onderscheidenlijk de toetredingsovereenkomst met onmiddellijke
      ingang kan wijzigen of met onmiddellijke ingang beëindigen en de aanvullende deelname met onmiddellijke ingang kan
      beëindigen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29b
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: 29b
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: 29d.1.a
    text: |-
      de financiële onderneming of de uitvoerder van de vangnetregeling in de lidstaat waar de financiële onderneming
      haar zetel heeft, onjuiste of onvolledige gegevens heeft verstrekt, en kennis omtrent de juiste en volledige
      gegevens tot een andere overeenkomst zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29d
  - number: 29d.1.b
    text: |-
      de financiële onderneming of de uitvoerder van de vangnetregeling in de lidstaat waar de financiële onderneming
      haar zetel heeft omstandigheden of feiten heeft verzwegen op grond waarvan, zo zij voor het tijdstip waarop
      de overeenkomsten werden aangegaan zich hadden voorgedaan of bekend waren geweest, de Nederlandsche Bank de
      overeenkomsten, of een van beide overeenkomsten, niet zou zijn aangegaan;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29d
  - number: 29d.1.c
    text: |-
      de financiële onderneming of de uitvoerder van de vangnetregeling in de lidstaat waar de financiële onderneming
      haar zetel heeft niet meer voldoet aan de ingevolge de wet gestelde regels dan wel niet meer voldoet aan de
      voorwaarden die aan de aanvullende deelname zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29d
  - number: 29d.1.d
    text: de financiële onderneming of het bijkantoor haar of zijn activiteit heeft beëindigd;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29d
  - number: 29d.1.e
    text: |-
      de financiële onderneming of de uitvoerder van de vangnetregeling in de lidstaat waar de financiële onderneming
      haar zetel heeft in gebreke blijft bij de naleving van haar of zijn verplichtingen;
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29d
  - number: 29d.1.f
    text: |-
      zich onvoorziene omstandigheden voordoen welke van dien aard zijn dat naar maatstaven van redelijkheid en
      billijkheid ongewijzigde instandhouding van de samenwerkingsovereenkomst of toetredingsovereenkomst niet mag worden
      verwacht door de financiële onderneming of de uitvoerder van de vangnetregeling van de lidstaat waar de financiële
      onderneming haar zetel heeft; of
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29d
  - number: 29d.1.g
    text: |-
      de financiële onderneming niet of niet volledig binnen de gestelde termijn aan een aanwijzing als bedoeld in
      [artikel 1:75 van de wet][ref1] of [artikel 29f, eerste lid][ref2], gevolg heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel29f
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: 29f
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: 29d.2
    text: |-
      Voorts wordt in de samenwerkingsovereenkomst onderscheidenlijk de toetredingsovereenkomst vastgelegd
      dat, onverminderd [artikel 29c][ref1], indien de uitvoerder van de vangnetregeling in de lidstaat waar de
      financiële onderneming haar zetel heeft of de financiële onderneming niet binnen een door de Nederlandsche
      Bank gestelde redelijke termijn instemt met de wijziging van de samenwerkingsovereenkomst onderscheidenlijk de
      toetredingsovereenkomst, deze overeenkomst van rechtswege is ontbonden na het verstrijken van die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29c
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: 29c
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: 29e.1
    text: |-
      Ingeval de aanvullende deelname eindigt ingevolge [artikel 29c, vierde lid][ref1], of op de wijze, voorzien in
      [artikel 29d, eerste lid][ref2], vallen de vorderingen van de beleggers en de deposito’s onder de dekking van het
      Nederlandse depositogarantiestelsel tot de datum waarop zij verschuldigd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29c
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel29d
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: 29c
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: 29d
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: 29e.2
    text: |-
      De financiële onderneming stelt de beleggers en de depositohouders in kennis van de beëindiging van de aanvullende
      dekking.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29e
  - number: 29f.1
    text: |-
      In de toetredingsovereenkomst, bedoeld in [artikel 29b, derde lid, onderdeel e][ref1], wordt in ieder
      geval vastgelegd dat de Nederlandsche Bank, indien een financiële onderneming die aanvullend deelneemt
      aan de Nederlandse vangnetregeling niet voldoet aan verplichtingen uit de overeenkomst, bedoeld in
      [artikel 29b, derde lid, onderdeel e][ref2], of de stabiliteit van de financiële sector of de bescherming
      van beleggers of depositohouders in gevaar komt door de aanvullende deelname van de financiële onderneming
      aan de Nederlandse vangnetregeling, de financiële onderneming door middel van een aanwijzing als bedoeld in
      [artikel 1:75 van de wet][ref3] kan verplichten om binnen een door haar gestelde redelijke termijn ten aanzien van
      in de aanwijzingbeschikking aan te geven punten een bepaalde gedragslijn te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel29b
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: 29b
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: 29b
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 29f.2
    text: |-
      De aanwijzing, bedoeld in het eerste lid, dient erop gericht te zijn dat de financiële onderneming aan de
      verplichtingen die voortvloeien uit deelname aan de Nederlandse vangnetregeling, voldoet of dat de stabiliteit
      van de Nederlandse financiële sector of de bescherming door de Nederlandse vangnetregeling van beleggers of
      depositohouders niet langer in gevaar komen door de aanvullende deelname van de financiële onderneming aan de
      Nederlandse vangnetregeling.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29f
  - number: 29g
    text: |-
      Op het bedrag van de vergoeding dat overeenkomstig [artikel 26, vierde lid][ref1], is berekend, wordt in mindering
      gebracht het bedrag dat, ingevolge de vangnetregeling in de lidstaat waar de financiële onderneming haar zetel
      heeft, is vastgesteld voor de betreffende depositohouder of belegger door de uitvoerder van de vangnetregeling in
      de lidstaat waar de financiële onderneming haar zetel heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel26
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '26'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 29h.1
    text: |-
      De Nederlandsche Bank besluit tot toepassing van een Nederlandse vangnetregeling waaraan een bank,
      beleggingsmaatschappij, maatschappij voor collectieve belegging in effecten of financiële instelling met zetel in
      een andere lidstaat aanvullend deelneemt, indien de vangnetregeling in de lidstaat waar de financiële ondernemer
      haar zetel heeft, op die financiële onderneming wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29h
  - number: 29h.2
    text: |-
      De Nederlandsche Bank doet mededeling van de toepassing van de Nederlandse vangnetregeling in de Staatscourant.
      Tevens doet de Nederlandsche Bank zo spoedig mogelijk nadat zij het besluit, bedoeld in het eerste lid, heeft
      genomen, mededeling door middel van advertenties in door haar te bepalen landelijke nieuwsbladen dat:
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29h
  - number: 29h.2.a
    text: |-
      zij het beleggerscompensatiestelsel, bedoeld in [artikel 3:259, eerste lid, van de wet][ref1] of het
      depositogarantiestelsel, bedoeld in [artikel 3:259, tweede lid, van de wet][ref2] in werking heeft gesteld; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29h
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29h.2.b
    text: |-
      de personen, bedoeld in [artikel 9][ref1] of [artikel 19][ref2], met gebruikmaking van een door de Nederlandsche
      Bank vast te stellen formulier een aanvraag tot vergoeding van de in [artikel 10][ref3] onderscheidenlijk
      [artikel 20][ref4] bedoelde vorderingen bij haar kunnen indienen, binnen een termijn die aanvangt op het moment
      van de plaatsing van de advertenties en die verstrijkt vijf maanden na de datum waarop zij een vergoeding hebben
      ontvangen van de uitvoerder van de vangnetregeling in de andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0020414#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0020414#Artikel20
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29h
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '9'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '19'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref3
        bwb_id: BWBR0020414
        artikel: '10'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0020414
        artikel: '20'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 29i
    text: |-
      De Nederlandsche Bank neemt een aanvraag voor vergoeding uit hoofde van een vangnetregeling waaraan een bank,
      beleggingsonderneming of financiële instelling met zetel in een andere lidstaat deelneemt in behandeling indien de
      uitvoerder van de vangnetregeling in de lidstaat waar de financiële onderneming haar zetel heeft, heeft vastgesteld
      wat de hoogte van de vergoeding voor de desbetreffende depositohouder of belegger is.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29i
  - number: 29j.1
    text: |-
      Indien een aanvullende deelname aan de Nederlandse vangnetregeling door een bank, beleggingsonderneming of
      financiële instelling met een zetel in een andere lidstaat wordt beëindigd, blijven deposito’s, aangehouden op de
      dag waarop de aanvullende deelname eindigt, aanvullend gedekt.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29j
  - number: 29j.2
    text: |-
      De dekking, bedoeld in het eerste lid, geldt voor het bedrag van het deposito op de datum waarop de
      aanvullende deelname is beëindigd, tot het maximum, bedoeld in [artikel 26, vierde lid][ref1] of het ingevolge
      [artikel 26, zevende lid][ref2] vastgestelde maximum, dan wel, indien het bedrag na die datum kleiner is geworden,
      tot het lagere bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel26
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '26'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '26'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 29j.3
    text: Deposito’s die worden geopend na de datum waarop de aanvullende deelname eindigt, worden niet aanvullend gedekt.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel29j
  - number: '30.1'
    text: |-
      Onverminderd [artikel 16][ref1] voorziet de Nederlandsche Bank gedurende de periode dat het doelvermogen
      van het compensatiefonds niet bereikt is, doch uiterlijk tot en met 31 december 2008, in een renteloos
      voorschot ten behoeve van uitkeringen die ten laste van het compensatiefonds komen op grond van
      [artikel 13, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel13
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '16'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '13'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '30.2'
    text: |-
      Het in het eerste lid bedoelde voorschot betreft een bedrag dat door de Nederlandsche Bank wordt
      vastgesteld en maximaal € 1 miljoen bedraagt. Dit voorschot wordt, voorafgaand aan een omslag als bedoeld in
      [artikel 13, eerste lid, onderdeel b][ref1], beschikbaar gesteld indien het compensatiefonds door een uitkering in
      de zin van [artikel 13, eerste lid, onderdeel a][ref2], uitgeput is geraakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel13
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '13'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '13'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '30.3'
    text: |-
      Een uitgekeerd renteloos voorschot als bedoeld in het eerste lid wordt aan de Nederlandsche Bank terugbetaald
      door de financiële ondernemingen, bedoeld in [artikel 16, vierde lid][ref1], na 1 januari 2009. De Nederlandsche
      Bank stelt, na overleg met representatieve vertegenwoordigingen, de modaliteiten omtrent de terugbetaling van dit
      renteloos voorschot vast, waarbij zij er voor zorgt dat de in [artikel 17][ref2] beschreven maximumbijdrage per
      kalenderjaar voor een financiële onderneming als bedoeld in [artikel 8][ref3] niet wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0020414#Artikel8
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: '16'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020414
        artikel: '17'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0020414
        artikel: '8'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '31'
    text: |-
      De Nederlandsche Bank stelt de toezichthoudende instanties die in andere lidstaten zijn belast met taken met
      betrekking tot een beleggerscompensatiestelsel in kennis van een wijziging in het beleggerscompensatiestelsel.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel31
  - number: '32'
    text: |-
      Het [koninklijk besluit van 17 december 1998 ter uitvoering van artikel 9, onder c, van de Bankwet 1998][ref1]
      (Stbl. 719) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010134
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0010134
  - number: '33'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel33
  - number: '34'
    text: |-
      Dit besluit wordt aangehaald als: Besluit bijzondere prudentiële maatregelen, beleggerscompensatie en
      depositogarantie Wft.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel34
