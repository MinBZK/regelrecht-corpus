  - number: '13.4'
    text: |-
      De Nederlandsche Bank kan op verzoek van een groep financiële ondernemingen die geen bank zijn, na overleg met
      representatieve vertegenwoordigingen, bepalen dat een tot deze groep behorende financiële onderneming die in
      het verzoek dient te worden aangewezen, alle door de tot deze groep behorende financiële ondernemingen in totaal
      verschuldigde bijdragen betaalt. De Nederlandsche Bank voldoet in elk geval aan het verzoek indien de tot de groep
      behorende financiële ondernemingen zijn geconsolideerd in de balans van de aangewezen financiële onderneming.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel13
  - number: '13.5'
    text: |-
      De bijdrage van banken die zijn aangesloten bij een centrale kredietinstelling wordt in een bedrag betaald door de
      centrale kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0020414/2024-01-01#Artikel13
  - number: '13.6'
    text: |-
      De Nederlandsche Bank kan maandelijks de verschuldigde bijdragen met betrekking tot de op dat moment ingevolge
      [artikel 27, tweede lid][ref1], betaalde vergoeding in rekening brengen.


