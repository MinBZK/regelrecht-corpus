        artikel: '65'
        hoofdstuk: '8'
        paragraaf: 8.1.5
        afdeling: '8.1'
  - number: 173.b
    text: |-
      in de informatie die zij aan de consument of, indien het een recht van deelneming in een beleggingsinstelling
      betreft, cliënt verstrekken over het complexe product geen financiële bijsluiter opnemen die is opgesteld op grond
      van het [Besluit financiële bijsluiter][ref1], zoals dat gold voor het tijdstip van inwerkingtreding van het
      [Besluit financiële dienstverlening][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0013263
      [ref2]: https://wetten.overheid.nl/BWBR0019283
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0013263
      - id: ref2
        bwb_id: BWBR0019283
  - number: 173.c
    text: |-
      de consument adequaat schriftelijk informeren over de verschillen tussen de berekening van
      de rendementen, kosten en risico’s ten behoeve van de financiële bijsluiter, bedoeld in
      [artikel 66, eerste lid, onderdelen c en g, onderscheidenlijk tweede lid, onderdelen d en f][ref1], en de
      berekeningen die ten grondslag liggen aan de overige informatie die zij aan de consument of, indien het een recht
      van deelneming in een beleggingsinstelling betreft, cliënt verstrekken.


