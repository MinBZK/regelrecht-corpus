        artikel: '52'
        hoofdstuk: '8'
        paragraaf: 8.1.3
        afdeling: '8.1'
  - number: 173.a
    text: |-
      onverminderd [artikel 65, eerste lid][ref1], aan de consument of, indien het een recht van deelneming in een
      beleggingsinstelling betreft, cliënt een financiële bijsluiter verstrekken voorafgaande aan de totstandkoming van
      de overeenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel65
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel173
    references:
      - id: ref1
