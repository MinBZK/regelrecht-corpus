    De Raad van State gehoord (advies van 20 september 2006, nr. W06.06.0334/IV);

    Gezien het nader rapport van Onze Minister van Financiën van 9 oktober 2006 (nr. FM 2006-02268 M);

    Hebben goedgevonden en verstaan:
