        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '173'
    text: |-
      Tot 1 april 2007 is [artikel 52, vijfde lid][ref1], niet van toepassing op financiële ondernemingen voorzover zij:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel52
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel173
    references:
