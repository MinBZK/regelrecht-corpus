        afdeling: '11.1'
  - number: '174.2'
    text: |-
      In afwijking van [artikel 150, eerste lid][ref1], betaalt een aanbieder aan een bemiddelaar ter zake van
      overeenkomsten die voor 1 januari 2008 zijn aangegaan geen afsluitprovisie die meer bedraagt dan tachtig procent
      van de som van die afsluitprovisie en de doorlopende provisie ter zake van de desbetreffende overeenkomst. Voor
      overeenkomsten die vanaf 1 januari 2008 tot en met 31 december 2009 en vanaf 1 januari 2010 tot 31 december 2010
      worden aangegaan bedraagt het in de vorige volzin benoemde percentage zeventig onderscheidenlijk zestig.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel150
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel174
    references:
