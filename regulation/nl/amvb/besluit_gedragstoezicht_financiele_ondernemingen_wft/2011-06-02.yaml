  - number: '2.1'
    text: |-
      Het beleid van een houder van een ontheffing als bedoeld in [artikel 4:3, vierde lid, van de wet][ref1] wordt
      bepaald of mede bepaald door personen wier betrouwbaarheid buiten twijfel staat. Indien binnen de houder van een
      ontheffing een orgaan is belast met het toezicht op het beleid en de algemene gang van zaken van de houder van een
      ontheffing wordt dit toezicht gehouden door personen wier betrouwbaarheid buiten twijfel staat.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '2.2'
    text: |-
      De aanvrager van een ontheffing als bedoeld in [artikel 4:3, vierde lid, van de wet][ref1] toont aan dat zal worden
      voldaan aan het eerste lid en legt ten aanzien van de betrokken personen de volgende gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 2.2.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel2
  - number: 2.2.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel2
  - number: 2.2.c
    text: |-
      gegevens met betrekking tot de antecedenten, bedoeld in [artikel 13][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel13
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '13'
        hoofdstuk: '3'
  - number: 2.2.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel2
  - number: '2.3'
    text: |-
      De betrouwbaarheid van een persoon als bedoeld in het eerste lid staat buiten twijfel wanneer dat eenmaal door
      een toezichthouder voor de toepassing van de [wet][ref1] is vastgesteld, zolang niet een wijziging in de relevante
      feiten of omstandigheden een redelijke aanleiding geeft tot een nieuwe beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '2.4'
    text: |-
      Op de vaststelling van de betrouwbaarheid van de personen, bedoeld in het eerste lid, zijn de
      [artikelen 12 tot en met 16][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
  - number: '3.1'
    text: |-
      De houder van een ontheffing als bedoeld in [artikel 4:3, vierde lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 3.1.a
    text: |-
      informeert, alvorens een overeenkomst aan te gaan terzake van het als tussenpersoon verrichten van werkzaamheden
      ten behoeve van het buiten besloten kring aantrekken of ter beschikking verkrijgen van opvorderbare gelden van
      anderen dan professionele marktpartijen zijn wederpartij duidelijk en volledig over diens rechten en plichten met
      betrekking tot de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
  - number: 3.1.b
    text: |-
      meldt aan de Autoriteit Financiële Markten iedere wijzing in de gegevens die eerder door hemzelf of door
      een financiële onderneming aan een toezichthouder zijn verstrekt ten behoeve van de beoordeling van de
      ingevolge de [wet][ref1] gestelde eisen met betrekking tot de betrouwbaarheid van de personen, bedoeld in
      [artikel 2, eerste lid][ref2]. De houder meldt de wijziging schriftelijk en onverwijld nadat hij daarvan in het
      kader van de normale bedrijfsvoering kennis heeft genomen; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 3.1.c
    text: |-
      meldt aan de Autoriteit Financiële Markten schriftelijk het voornemen tot wijziging van de personen, bedoeld in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '3.2'
    text: |-
      De houder van een ontheffing geeft geen uitvoering aan het voornemen, bedoeld in het eerste lid, onderdeel c,
      voordat de Autoriteit Financiële Markten heeft vastgesteld dat de betrouwbaarheid van de betrokken persoon buiten
      twijfel staat. De Autoriteit Financiële Markten neemt een besluit omtrent de betrouwbaarheid:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
  - number: 3.2.a
    text: binnen zes weken na ontvangst van de melding; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
  - number: 3.2.b
    text: |-
      indien de Autoriteit Financiële Markten binnen twee weken na ontvangst van de melding om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de melding.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
  - number: '3.3'
    text: |-
      Indien de Autoriteit Financiële Markten een derde verzoekt om nadere gegevens als bedoeld in het tweede lid,
      onderdeel b, doet zij daarvan mededeling aan de houder.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
  - number: '3.4'
    text: |-
      Bij de melding, bedoeld in het eerste lid, onderdeel c, legt de houder ten aanzien van de betrokken persoon de
      volgende gegevens over:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
  - number: 3.4.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
  - number: 3.4.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
  - number: 3.4.c
    text: |-
      gegevens met betrekking tot de antecedenten, bedoeld in [artikel 13][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel13
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '13'
        hoofdstuk: '3'
  - number: 3.4.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
  - number: '3.5'
    text: |-
      Het tweede en vierde lid, onderdelen b, c en d, zijn niet van toepassing indien de wijziging een persoon betreft
      wiens betrouwbaarheid voor de toepassing van de [wet][ref1] door een toezichthouder reeds is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '4'
    text: |-
      De rechtspersoon, bedoeld in [artikel 4:5, tweede lid, van de wet][ref1] verstrekt bij de in dat lid bedoelde
      melding aan de Autoriteit Financiële Markten de volgende gegevens over de betrokken onderneming:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 4.a
    text: een opgave van de naam en het adres;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel4
  - number: 4.b
    text: een opgave van de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel4
  - number: 4.c
    text: |-
      indien de onderneming een rechtspersoon is: een opgave van de statutaire zetel, de statutaire naam en de
      handelsnaam of handelsnamen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel4
  - number: 4.d
    text: 'indien de onderneming is ingeschreven in het handelsregister: een opgave van het nummer van inschrijving.'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel4
  - number: '5.1'
    text: |-
      De personen, bedoeld in [artikel 4:9, tweede lid, van de wet][ref1], zijn vakbekwaam, indien zij voldoen aan de in
      [onderdeel 1 van bijlage B][ref2] genoemde eindtermen alsmede, voorzover zij zich rechtstreeks bezighouden met het
      verlenen van financiële diensten met betrekking tot de hierna in de onderdelen a tot en met d genoemde onderwerpen,
      aan de eindtermen genoemd in het daarop betrekking hebbende onderdeel van [bijlage B][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421
      [ref3]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
      - id: ref3
        bwb_id: BWBR0020421
  - number: 5.1.a
    text: |-
      hypothecair krediet, al dan niet gecombineerd met opstal-, inboedel-, arbeidsongeschiktheids-, kapitaal- of
      overlijdensrisicoverzekeringen, waarbij de verplichting van de aanbieder tot het doen van een uitkering of
      een reeks van uitkeringen alleen dan ontstaat, indien het overlijden van degene op wiens leven de verzekering
      betrekking heeft plaatsvindt voor de in de polis genoemde datum: [onderdeel 2 van bijlage B][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 5.1.b
    text: |-
      consumptief krediet, al dan niet gecombineerd met arbeidsongeschiktheidsverzekeringen:
      [onderdeel 3 van bijlage B][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 5.1.c
    text: |-
      schadeverzekeringen: [onderdeel 4 van bijlage B][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 5.1.d
    text: |-
      levensverzekeringen, al dan niet gecombineerd met arbeidsongeschiktheidsverzekeringen:
      [onderdeel 5 van bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '5.2'
    text: |-
      Indien de financiëledienstverlener, bedoeld in [artikel 4:9, tweede lid, van de wet][ref1], optreedt als
      gevolmachtigde agent of als ondergevolmachtigde agent, zijn de in dat lid bedoelde personen vakbekwaam, indien zij
      voldoen aan de in [onderdeel 6 van bijlage B][ref2] genoemde eindtermen en de in het eerste lid bedoelde onderdelen
      van [die bijlage][ref3], met betrekking tot het financiële product waarmee zij zich rechtstreeks bezighouden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421
      [ref3]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
      - id: ref3
        bwb_id: BWBR0020421
  - number: '5.3'
    text: |-
      Het eerste lid is niet van toepassing op het verlenen van financiële diensten met betrekking tot een
      arbeidsongeschiktheidsverzekeringverzekering als bedoeld in het eerste lid, onderdeel a, b of d, of een opstal-,
      inboedel-, of overlijdensrisicoverzekering als bedoeld in het eerste lid, onderdeel a, die wordt gecombineerd met
      het in het desbetreffende onderdeel genoemde onderwerp.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel5
  - number: '6.1'
    text: |-
      Een financiëledienstverlener voldoet aan [artikel 4:9, tweede lid, eerste volzin, van de wet][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 6.1.a
    text: |-
      zijn werknemers en andere personen die zich onder zijn verantwoordelijkheid rechtstreeks bezighouden met financiële
      dienstverlening, met uitzondering van feitelijk leidinggevenden, allen beschikken over een geldig diploma voor
      de in hun geval relevante eindtermen, bedoeld in [artikel 5][ref1], afgegeven door een door Onze Minister erkend
      exameninstituut als bedoeld in [artikel 9, eerste lid][ref2] of over een geldige erkenning van beroepskwalificaties
      als bedoeld in [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006781#Artikel5
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0006781
        artikel: '5'
  - number: 6.1.b
    text: |-
      hij zijn bedrijfsvoering zodanig heeft ingericht dat deze een vakbekwame financiële dienstverlening aan consumenten
      of, indien het verzekeringen betreft, cliënten voldoende waarborgt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel6
  - number: '6.2'
    text: |-
      Een financiëledienstverlener voldoet aan [artikel 4:9, tweede lid, tweede volzin, van de wet][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 6.2.a
    text: |-
      de in die volzin bedoelde feitelijk leidinggevenden beschikken over een geldig diploma voor de in
      hun geval relevante eindtermen, bedoeld in [artikel 5][ref1], afgegeven door een door Onze Minister
      erkend exameninstituut of over een geldige erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel5
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0006781
        artikel: '5'
  - number: 6.2.b
    text: |-
      hij een financiëledienstverlener is met een op jaarbasis gemiddeld aantal voltijdse werknemers van meer dan 50 en
      hij zijn bedrijfsvoering zodanig heeft ingericht dat deze een vakbekwame financiële dienstverlening aan consumenten
      of, indien het verzekeringen betreft, cliënten, voldoende waarborgt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel6
  - number: '6.4'
    text: |-
      Onverminderd het eerste en tweede lid voldoet een bemiddelaar als bedoeld in
      [artikel 2:81, tweede lid, van de wet][ref1] aan het bepaalde in [artikel 4:9, tweede lid, van de wet][ref2],
      indien zijn bedrijfsvoering onder de verantwoordelijkheid van de aanbieder voor welke hij bemiddelt zodanig is
      ingericht dat een vakbekwame financiële dienstverlening aan consumenten of, indien het verzekeringen betreft,
      cliënten voldoende is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '6.5'
    text: |-
      Onverminderd het eerste en tweede lid voldoet een aangesloten onderneming als bedoeld in
      [artikel 2:105, eerste lid, van de wet][ref1] aan het bepaalde in [artikel 4:9, tweede lid, van de wet][ref2],
      indien haar bedrijfsvoering onder de verantwoordelijkheid van de rechtspersoon waarbij zij is aangesloten zodanig
      is ingericht dat een vakbekwame financiële dienstverlening aan consumenten of, indien het verzekeringen betreft,
      cliënten voldoende is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '7.1'
    text: 'Een diploma of een erkenning van beroepskwalificaties is geldig, tenzij de houder ervan:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel7
  - number: 7.1.a
    text: |-
      niet binnen achttien maanden na de inwerkingtreding, bedoeld in [artikel 8, derde lid][ref1], op de door Onze
      Minister vastgestelde wijze heeft voldaan aan de in zijn geval relevante toetstermen voor permanente educatie,
      bedoeld in [artikel 8, tweede lid][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel8
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 7.1.b
    text: |-
      niet binnen achttien maanden na de inwerkingtreding, bedoeld in [artikel 8, derde lid][ref1], van toetstermen voor
      permanente educatie met goed gevolg een examen heeft afgelegd van een door Onze Minister erkend exameninstituut
      dat voldoet aan de in zijn geval relevante toetstermen die tegelijkertijd met toetstermen voor permanente educatie
      openbaar zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel8
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '7.2'
    text: |-
      Indien een houder van een diploma of een erkenning van beroepskwalificaties niet binnen de in het eerste lid
      bedoelde termijn heeft voldaan aan de in zijn geval relevante toetstermen voor permanente educatie, is het diploma
      of de erkenning van beroepskwalificaties ongeldig vanaf het einde van die termijn tot hij alsnog daaraan voldoet.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel7
  - number: '8.1'
    text: |-
      Bij ministeriële regeling worden toetstermen vastgesteld voor de examens die leiden tot afgifte van een diploma als
      bedoeld in [artikel 10, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel10
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '8.2'
    text: |-
      Indien ontwikkelingen op de financiële markten of relevante wettelijke voorschriften daartoe aanleiding geven
      worden bij ministeriële regeling toetstermen vastgesteld met betrekking tot permanente educatie, alsmede de wijze
      waarop aan deze toetstermen kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel8
  - number: '8.3'
    text: |-
      Onze Minister draagt er zorg voor dat de inwerkingtreding van de toetstermen voor examens en de inwerkingtreding
      van de daarbij aansluitende toetstermen voor permanente educatie gelijktijdig plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister erkent een exameninstituut op aanvraag, indien de aanvrager heeft aangetoond te kunnen voldoen
      aan [artikel 10, tweede, derde, vijfde, zesde en zevende lid][ref1], voorzover het in die leden bepaalde op de
      aanvrager van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel10
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '9.2'
    text: |-
      Onze Minister beslist op een aanvraag om erkenning binnen vier maanden nadat de aanvraag is ingediend. De
      beslissingstermijn kan ten hoogste tweemaal met twee maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel9
  - number: '9.3'
    text: Onze Minister kan aan een erkenning voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel9
  - number: '9.4'
    text: 'Onze Minister kan een erkenning intrekken:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel9
  - number: 9.4.a
    text: op verzoek van het erkende exameninstituut;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel9
  - number: 9.4.b
    text: |-
      indien de gegevens en bescheiden die zijn verstrekt ter verkrijging van de erkenning na de erkenning zodanig
      onjuist of onvolledig blijken, dat de erkenning zou zijn geweigerd, dan wel niet zonder het verbinden van
      voorschriften zou zijn verleend, indien bij de behandeling van de aanvraag de juiste gegevens volledig bekend waren
      geweest; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel9
  - number: 9.4.c
    text: |-
      indien het exameninstituut niet langer voldoet aan [artikel 10][ref1] of [11][ref2] of aan een voorschrift,
      verbonden aan de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel11
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '9.5'
    text: |-
      Van een besluit tot erkenning of tot intrekking van de erkenning van een exameninstituut doet Onze Minister
      mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel9
  - number: '10.1'
    text: |-
      Een erkend exameninstituut geeft een diploma af aan een kandidaat die een door het erkende exameninstituut
      afgenomen examen met goed gevolg heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: '10.2'
    text: |-
      Een erkend exameninstituut dat tevens opleidingen aanbiedt, brengt een zodanige scheiding aan in de bedrijfsvoering
      tussen het ontwikkelen en verzorgen van opleidingen en het afnemen van examens dat belangenverstrengeling tussen
      deze activiteiten wordt voorkomen. Daartoe treft een erkend exameninstituut in ieder geval adequate maatregelen,
      gericht op:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.2.a
    text: |-
      het voeren van gescheiden administraties voor het ontwikkelen en verzorgen van opleidingen en voor het afnemen van
      examens; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.2.b
    text: |-
      het voorkomen van toegang tot examenmateriaal van werknemers die op enige wijze betrokken zijn bij de ontwikkeling
      of de verzorging van een opleiding, gericht op het desbetreffende examen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: '10.3'
    text: Een erkend exameninstituut stelt de door hem aangeboden examens open voor een ieder.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: '10.4'
    text: |-
      Een door een erkend exameninstituut af te nemen examen voldoet binnen zes maanden na de openbaarmaking ervan aan de
      door Onze Minister vastgestelde toetstermen, bedoeld in [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel8
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '10.5'
    text: |-
      Een erkend exameninstituut neemt ten aanzien van de wijze van examinering de maatregelen die redelijkerwijs nodig
      zijn om te bevorderen dat examens op een correcte en eerlijke wijze worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: '10.6'
    text: |-
      Een erkend exameninstituut draagt zorg voor een vakinhoudelijk juiste en objectieve beoordeling van afgenomen
      examens.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: '10.7'
    text: |-
      Een erkend exameninstituut beschikt over en handelt in overeenstemming met een examenreglement waarin ten minste de
      volgende onderwerpen adequaat zijn geregeld:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.a
    text: de wijze van aanmelding van kandidaten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.b
    text: het aantal malen per jaar dat gelegenheid wordt gegeven tot het afleggen van de afzonderlijke examens;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.c
    text: de wijze van kennisgeving van plaats, datum en tijdstip van aanvang der examens;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.d
    text: de vaststelling van de identiteit van kandidaten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.e
    text: de duur en wijze van examineren;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.f
    text: de maatregelen indien onregelmatigheden worden geconstateerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.g
    text: de aanwijzing van de examinatoren bij de mondelinge examens;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.h
    text: de beoordeling van de examens;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.i
    text: |-
      de termijn waarbinnen de examenuitslagen worden bekendgemaakt, alsmede de termijn waarbinnen de diploma’s worden
      uitgereikt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.j
    text: |-
      de aanwijzing van degene of degenen die de uitslag van het schriftelijk examen vaststelt onderscheidenlijk
      vaststellen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.k
    text: de wijze van vaststelling van de beoordelingsnormen en normen voor slagen en afwijzen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.l
    text: de wijze van verkrijgbaarstelling van de richtlijnantwoorden na afloop van een examen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.m
    text: de inzage in afgelegde examens;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.n
    text: de bewaartermijnen voor de afgelegde examens; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: 10.7.o
    text: de interne klachtenprocedure.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: '10.8'
    text: |-
      Een erkend exameninstituut verstrekt jaarlijks voor 1 juli aan Onze Minister een opgave van het aantal in het
      vorige kalenderjaar afgenomen en beoordeelde examens, alsmede een analyse van de resultaten van deze examens, de
      klachten die over de examinering en de resultaten zijn ingediend en de beslissingen hierop van het exameninstituut.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
  - number: '10.9'
    text: |-
      Het tweede en derde lid zijn niet van toepassing op uit ’s rijks kas
      bekostigde opleidingen van instellingen voor hoger onderwijs als bedoeld in
      [artikel 1.8, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '11.1'
    text: |-
      Een erkend exameninstituut verstrekt aan Onze Minister op diens verzoek de gegevens die Onze Minister nodig heeft
      voor de uitoefening van zijn in dit hoofdstukomschreven taken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11
  - number: '11.2'
    text: |-
      Met het toezicht op de naleving van de [artikelen 9][ref1] en [10][ref2] zijn belast de bij besluit van Onze
      Minister aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel10
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '11.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11
  - number: 11a
    text: |-
      Aan [artikel 7, eerste lid][ref1], voldoet degene die binnen achttien maanden na inwerkingtreding van PE-
      toetstermen:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel7
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 11a.1
    text: |-
      beschikt over een certificaat dat is afgegeven door een door Onze Minister erkend instituut voor permanente
      educatie waaruit blijkt dat hij met goed gevolg een PE-onderwijsprogramma heeft gevolgd met betrekking tot de in
      zijn geval relevante toetstermen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11a
  - number: 11a.2
    text: |-
      beschikt over een certificaat dat is afgegeven door een door Onze Minister erkend exameninstituut waaruit blijkt
      dat hij met goed gevolg een PE-toets heeft afgelegd met betrekking tot de in zijn geval relevante toetstermen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11a
  - number: 11a.3
    text: |-
      beschikt over een certificaat dat is afgegeven door een door Onze Minister erkend exameninstituut waaruit blijkt
      dat hij vakinhoudelijk betrokken is geweest bij het afnemen van examens of bij de ontwikkeling van examenmateriaal
      met betrekking tot de in zijn geval relevante toetstermen bij dat exameninstituut; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11a
  - number: 11a.4
    text: |-
      beschikt over een certificaat dat is afgegeven door een door Onze Minister erkend instituut voor permanente
      educatie waaruit blijkt dat hij als geregistreerd docent betrokken is geweest bij de uitvoering van een PE-
      onderwijsprogramma met betrekking tot de in zijn geval relevante toetstermen bij dat instituut voor permanente
      educatie.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11a
  - number: 11b.1
    text: |-
      Onze Minister erkent een instituut voor permanente educatie op aanvraag, indien de aanvrager heeft aangetoond te
      zullen voldoen aan [artikel 11c][ref1], voor zover het in dat artikel bepaalde op de aanvrager van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11c
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 11b.2
    text: |-
      Onze Minister beslist op een aanvraag om erkenning binnen vier maanden nadat de aanvraag is ingediend. De
      beslissingstermijn kan ten hoogste tweemaal met twee maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11b
  - number: 11b.3
    text: Onze Minister kan aan een erkenning voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11b
  - number: 11b.4
    text: 'Onze Minister kan een erkenning intrekken:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11b
  - number: 11b.4.a
    text: op verzoek van het erkende instituut voor permanente educatie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11b
  - number: 11b.4.b
    text: |-
      indien de gegevens en bescheiden die zijn verstrekt ter verkrijging van de erkenning, na de erkenning zodanig
      onjuist of onvolledig blijken, dat de erkenning zou zijn geweigerd of zonder voorschriften zou zijn verleend,
      indien bij de behandeling van de aanvraag de juiste gegevens volledig bekend waren geweest; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11b
  - number: 11b.4.c
    text: |-
      indien het instituut voor permanente educatie niet langer voldoet aan [artikel 11c][ref1] of [artikel 11d][ref2] of
      aan een voorschrift of voorwaarde, verbonden aan de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11c
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel11d
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11c
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 11d
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 11c.1
    text: 'Een erkend instituut voor permanente educatie beschikt over:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.1.a
    text: |-
      aantoonbare en actuele ervaring met het op zorgvuldige en betrouwbare wijze vervaardigen en verzorgen van cursussen
      en het beoordelen van individuele kandidaten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.1.b
    text: |-
      gekwalificeerde docenten in inhoudelijk, onderwijskundig en toetstechnisch opzicht en maakt daar bij de uitvoering
      van PE-onderwijsprogramma’s ook uitsluitend gebruik van;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.1.c
    text: een registratie waaruit de vakbekwaamheid van de docenten voor een PE-onderwijsprogramma blijkt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.1.d
    text: een evaluatiesysteem voor het afgenomen PE-onderwijsprogramma;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.1.e
    text: een adequaat kwaliteitsborgingssysteem.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.2
    text: |-
      Een erkend instituut voor permanente educatie biedt een PE-onderwijsprogramma meerdere malen in Nederland aan
      waarbij kandidaten die beschikken over het relevante diploma, bedoeld in [artikel 6][ref1], worden toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 11c.3
    text: Een erkend instituut voor permanente educatie stemt in met een door Onze Minister te organiseren controle.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.4
    text: |-
      Een erkend instituut voor permanente educatie verzorgt het PE-onderwijsprogramma met een toetsend element dat alle
      PE-toetstermen voor de desbetreffende module omvat en levert daarbij tevens cursusmateriaal dat als naslagwerk kan
      dienen voor kandidaten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.5
    text: |-
      Een erkend instituut voor permanente educatie stelt Onze Minister in kennis van een nieuw ontwikkeld PE-
      onderwijsprogramma.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.6
    text: |-
      Een erkend instituut voor permanente educatie legt een nieuw ontwikkeld PE-onderwijsprogramma ter beoordeling voor
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.7
    text: |-
      Een erkend instituut voor permanente educatie draagt zorg voor een vakinhoudelijk juiste en objectieve beoordeling
      van de aangeboden PE-onderwijsprogramma’s.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.8
    text: |-
      Een erkend instituut voor permanente educatie neemt de maatregelen die redelijkerwijs nodig zijn om te bevorderen
      dat PE-onderwijsprogramma’s op een correcte en eerlijke wijze worden aangeboden en draagt zorg voor een
      vakinhoudelijke juiste en objectieve beoordeling van kandidaten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.9
    text: |-
      Het aantal kandidaten per PE-onderwijsprogramma dat een erkend instituut voor permanente educatie aanbiedt,
      bedraagt ten hoogste 25 personen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.10
    text: |-
      Een erkend instituut voor permanente educatie beschikt over en handelt in overeenstemming met een PE-reglement
      waarin ten minste de volgende onderwerpen met betrekking tot het PE-onderwijsprogramma adequaat zijn geregeld:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.10.a
    text: wijze van aanmelding van de kandidaten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.10.b
    text: aantal malen per jaar dat gelegenheid wordt gegeven tot het volgen van een PE-onderwijsprogramma;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.10.c
    text: wijze van kennisgeving van plaats, datum en tijdstip van de start- en eindtijden van het PE-onderwijsprogramma;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.10.d
    text: |-
      opbouw, verschillende interactieve onderwijsvormen en uitvoering van PE-onderwijsprogramma’s gericht op actieve
      participatie van de kandidaten en de wijze van beoordelen van kandidaten ten aanzien van hun inhoudelijke
      vakbekwaamheid betreffende de PE-toetstermen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.10.e
    text: vaststelling van de identiteit van kandidaten en docenten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.10.f
    text: vaststelling van de presentie van de kandidaten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.10.g
    text: vaststelling van de rechten en plichten van de kandidaten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.10.h
    text: maatregelen om fraude te voorkomen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.10.i
    text: |-
      bewaartermijnen voor de gegevens van afgelegde PE-onderwijsprogramma’s wat betreft inhoud en evaluatie, gegevens
      van docenten en gegevens van kandidaten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11c.10.j
    text: interne klachtenprocedure.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11c
  - number: 11d.1
    text: |-
      Een erkend instituut voor permanente educatie verstrekt aan Onze Minister twee maanden na de periode, bedoeld in
      [artikel 7][ref1], een opgave van het aantal afgenomen PE-onderwijsprogramma’s, de geanonimiseerde klachten over de
      PE-onderwijsprogramma’s, de slagingspercentages die zijn geregistreerd door het instituut voor permanente educatie
      en een analyse daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel7
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 11d.2
    text: |-
      Een erkend instituut voor permanente educatie verstrekt aan Onze Minister op diens verzoek de gegevens die Onze
      Minister nodig heeft voor de uitoefening van zijn in dit hoofdstuk omschreven taken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11d
  - number: 11d.3
    text: |-
      Met het toezicht op de naleving van de [artikelen 11b][ref1] en [11c][ref2] zijn belast de bij besluit van Onze
      Minister aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11b
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel11c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11b
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 11c
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 11d.4
    text: Van een besluit als bedoeld in het derde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11d
  - number: 11e
    text: |-
      Een erkenning die is verleend op grond van [artikel 3 van de Erkenningsregeling permanente educatie Wft][ref1]
      berust na de inwerkingtreding van het [Wijzigingsbesluit financiële markten 2010][ref2] op
      [artikel 11b, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023907#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0026789
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel11b
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0023907
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0026789
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 11b
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '12'
    text: |-
      De Autoriteit Financiële Markten stelt vast of de betrouwbaarheid van een persoon als bedoeld in
      [artikel 4:10, eerste lid, van de wet][ref1] buiten twijfel staat op basis van diens voornemens, handelingen en
      antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '13'
    text: |-
      De Autoriteit Financiële Markten neemt bij de vaststelling, bedoeld in [artikel 12][ref1], in ieder geval de
      volgende antecedenten in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
  - number: 13.a
    text: |-
      de in de [onderdelen 1 en 2 van bijlage C][ref1] genoemde strafrechtelijke antecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 13.b
    text: |-
      de in [onderdeel 3 van bijlage C][ref1] genoemde financiële antecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 13.c
    text: |-
      de in [onderdeel 4 van bijlage C][ref1] genoemde toezichtantecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 13.d
    text: |-
      de in [onderdeel 5 van bijlage C][ref1] genoemde fiscaal bestuursrechtelijke antecedenten; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 13.e
    text: |-
      de in [onderdeel 6 van bijlage C][ref1] genoemde overige antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '14.1'
    text: |-
      De Autoriteit Financiële Markten verkrijgt inzicht in de in [artikel 12][ref1] bedoelde voornemens, handelingen en
      antecedenten op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
  - number: 14.1.a
    text: door betrokkene verstrekte gegevens en inlichtingen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: 14.1.b
    text: door de Landelijke Officier van Justitie verstrekte politiegegevens;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: 14.1.c
    text: |-
      gegevens uit de registratie, bedoeld in [artikel 1, onderdeel b, van de Wet documentatie vennootschappen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015049
        artikel: '1'
  - number: 14.1.d
    text: gegevens en inlichtingen, verkregen van de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: 14.1.e
    text: |-
      gegevens en inlichtingen, verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van Nederlandse of
      buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of op
      personen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: 14.1.f
    text: ambtsberichten van het Openbaar Ministerie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: 14.1.g
    text: inlichtingen, verkregen van door betrokkenen opgegeven referenties;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: 14.1.h
    text: gegevens uit openbare bronnen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: 14.1.i
    text: |-
      inlichtingen, verkregen van curatoren of bewindvoerders met betrekking tot faillissementen, surseances,
      schuldsaneringen, bewindvoeringen of noodregelingen waarbij de in [artikel 12][ref1] bedoelde persoon betrokken
      is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
  - number: 14.1.j
    text: inlichtingen, verkregen van organisaties van huidige of voormalige beroepsgenoten van betrokkene; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: 14.1.k
    text: gegevens en inlichtingen, verkregen uit andere bij ministeriële regeling aan te wijzen bronnen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: '14.2'
    text: |-
      Indien de gegevens en inlichtingen, verkregen overeenkomstig het eerste lid, de Autoriteit Financiële Markten
      aanleiding geven tot nader onderzoek, kan de Autoriteit Financiële Markten ook inlichtingen inwinnen en gegevens
      opvragen bij andere personen of instanties dan genoemd in dat lid. De Autoriteit Financiële Markten stelt de
      betrokkene in dat geval schriftelijk vooraf in kennis van:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: 14.2.a
    text: de reden van het nadere onderzoek;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: 14.2.b
    text: de personen of instanties bij wie nadere gegevens of inlichtingen zullen worden ingewonnen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: 14.2.c
    text: de aard van de nadere gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel14
  - number: '15.1'
    text: |-
      De betrouwbaarheid van een persoon als bedoeld in [artikel 12][ref1] staat niet buiten twijfel indien deze
      veroordeeld is terzake van een misdrijf, genoemd in [onderdeel 1 van bijlage C][ref2], tenzij er sinds het
      onherroepelijk worden van de uitspraak acht jaren of meer zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020421
  - number: '15.2'
    text: |-
      De Autoriteit Financiële Markten kan op grond van de omstandigheden of belangen, genoemd in [artikel 16][ref1],
      afwijken van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel16
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '16'
        hoofdstuk: '3'
  - number: '16'
    text: |-
      De Autoriteit Financiële Markten neemt bij de vaststelling, bedoeld in [artikel 12][ref1], in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
  - number: 16.a
    text: |-
      het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de overige
      omstandigheden van het geval;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel16
  - number: 16.b
    text: de belangen die de wet beoogt te beschermen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel16
  - number: 16.c
    text: |-
      de overige belangen van de beheerder, beleggingsmaatschappij, beleggingsonderneming, bewaarder of
      financiëledienstverlener en de betrokkene.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel16
  - number: '17.1'
    text: |-
      Een beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder als bedoeld in
      [artikel 4:11, eerste lid, van de wet][ref1] draagt zorg voor een systematische analyse van integriteitrisico´s.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '17.2'
    text: |-
      De beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder draagt er zorg voor dat het beleid, bedoeld in
      [artikel 4:11, eerste lid, van de wet][ref1], zijn neerslag vindt in procedures en maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '17.3'
    text: |-
      De beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder stelt alle relevante bedrijfsonderdelen in
      kennis van het beleid en de procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel17
  - number: '17.4'
    text: |-
      De beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder draagt zorg voor de uitvoering en de
      systematische toetsing van het beleid en de procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel17
  - number: '17.5'
    text: |-
      De beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder draagt zorg voor onafhankelijk toezicht op de
      uitvoering van het beleid en de procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel17
  - number: '17.6'
    text: |-
      De beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder beschikt over procedures die erin voorzien dat
      gesignaleerde tekortkomingen of gebreken met betrekking tot de integere uitoefening van het bedrijf tot een gepaste
      bijstelling leiden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel17
  - number: '18'
    text: |-
      Een beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder als bedoeld in
      [artikel 4:14, eerste lid, van de wet][ref1] beschikt over procedures en maatregelen met betrekking tot het
      tegengaan van verstrengeling van de privé-belangen van personen die het beleid van de financiële onderneming
      bepalen, personen die onderdeel zijn van een orgaan dat is belast met toezicht op het beleid en de algemene gang
      van zaken van de financiële onderneming, andere werknemers, of andere personen die in opdracht van de betrokken
      onderneming op structurele basis werkzaamheden voor haar verrichten met haar belangen of die van haar deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '19.1'
    text: |-
      Een beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder als bedoeld in
      [artikel 4:14, eerste lid, van de wet][ref1] beschikt over procedures en maatregelen met betrekking tot de omgang
      met en vastlegging van incidenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '19.2'
    text: |-
      De beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder neemt naar aanleiding van een incident
      maatregelen die zijn gericht op het beheersen van de opgetreden risico’s en het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel19
  - number: '19.3'
    text: |-
      De beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder informeert de Autoriteit Financiële Markten
      onverwijld omtrent incidenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel19
  - number: '20.1'
    text: |-
      Een beheerder, beleggingsmaatschappij, bewaarder of pensioenbewaarder als bedoeld in
      [artikel 4:14, eerste lid, van de wet][ref1] maakt een onderbouwde beoordeling van de betrouwbaarheid van personen
      die hij onderscheidenlijk zij wil benoemen in een integriteitgevoelige functie.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '20.2'
    text: |-
      De beheerder, beleggingsmaatschappij, bewaarder of pensioenbewaarder draagt zorg voor de beoordeling van
      de betrouwbaarheid van degenen die, anders dan op grond van een arbeidsovereenkomst, werkzaamheden in een
      integriteitgevoelige functie verrichten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel20
  - number: '21.1'
    text: |-
      Een beleggingsinstelling als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] beschikt ter bescherming van
      de integriteit van het bedrijf over procedures en maatregelen met betrekking tot de acceptatie van deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '21.2'
    text: |-
      Onverminderd het bepaalde ingevolge de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1]
      beschikt de beleggingsinstelling over procedures en maatregelen met betrekking tot de identificatie van deelnemers
      en de verificatie daarvan. De beleggingsinstelling accepteert een deelnemer niet indien zij de identiteit niet
      heeft vastgesteld overeenkomstig het daarvoor opgestelde beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: '21.3'
    text: |-
      De beleggingsinstelling beschikt ter bescherming van de integriteit van het bedrijf over organisatorische en
      administratieve procedures en maatregelen die betrekking hebben op risicoclassificaties ten aanzien van cliënten,
      producten of diensten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel21
  - number: '21.4'
    text: |-
      De beleggingsinstelling beschikt over procedures en maatregelen met betrekking tot de analyse van gegevens
      van deelnemers, mede in relatie tot de door de deelnemer afgenomen producten, en de detectie van afwijkende
      transactiepatronen. Aan de hand van deze procedures en maatregelen bepaalt de beleggingsinstelling tevens de
      risico’s van bepaalde cliënten, producten of diensten voor de integere uitoefening van haar bedrijf.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel21
  - number: '21.5'
    text: |-
      De beleggingsinstelling draagt zorg voor de documentatie en vastlegging met betrekking tot de acceptatie en
      indeling naar risico van cliënten, de identificatie en verificatie van de gegevens van cliënten en de bewaking van
      transacties van cliënten. Dergelijke gegevens worden tot vijf jaar na de dienstverlening of het beëindigen van de
      relatie bewaard.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel21
  - number: '21.6'
    text: |-
      Het eerste tot en met vijfde lid zijn niet van toepassing voorzover de beleggingsinstelling niet voorafgaand aan
      het intreden of uittreden van deelnemers in de beleggingsinstelling beslist omtrent acceptatie van deelnemers.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel21
  - number: '22.1'
    text: |-
      Een beleggingsinstelling als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] onderzoekt, op verzoek van
      de Autoriteit Financiële Markten, of in haar administratie bepaalde personen of instellingen voorkomen die naar
      het oordeel van Onze Minister, in verband met vermoede terroristische activiteiten of daarmee verband houdende
      activiteiten, de integriteit van de financiële sector kunnen schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '22.2'
    text: |-
      De beleggingsinstelling verstrekt de uitkomst van het in het eerste lid bedoelde onderzoek, binnen een door de
      Autoriteit Financiële Markten vast te stellen termijn, aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel22
  - number: '23.1'
    text: |-
      Een beleggingsonderneming draagt er, met het oog op de integere uitoefening van haar bedrijf, zorg voor dat het
      beleid, bedoeld in [artikel 4:11, eerste lid, van de wet][ref1], zijn neerslag vindt in procedures en maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '23.2'
    text: |-
      De beleggingsonderneming draagt zorg voor onafhankelijk toezicht op de uitvoering van het beleid en de procedures
      en maatregelen, bedoeld in het eerste lid, en beschikt over procedures die erin voorzien dat gesignaleerde
      tekortkomingen of gebreken worden gerapporteerd aan de personen die belast zijn met de taak, bedoeld in
      [artikel 31c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel31c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 31c
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '23.3'
    text: |-
      De beleggingsonderneming beschikt over procedures die erin voorzien dat gesignaleerde tekortkomingen of gebreken
      met betrekking tot de integere uitoefening van het bedrijf onder toezicht van de personen die zijn belast met de
      taak, bedoeld in [artikel 31c][ref1], tot een gepaste bijstelling leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel31c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 31c
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '24.1'
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] beschikt over procedures en
      maatregelen met betrekking tot de behandeling en administratieve vastlegging van incidenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '24.2'
    text: |-
      De beleggingsonderneming neemt naar aanleiding van een incident maatregelen die zijn gericht op het beheersen van
      de opgetreden risico’s en het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel24
  - number: '24.3'
    text: De beleggingsonderneming informeert de Autoriteit Financiële Markten onverwijld omtrent incidenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel24
  - number: '25.1'
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] maakt een onderbouwde
      beoordeling van de betrouwbaarheid van een personeelslid dat zij wil benoemen in een integriteitgevoelige functie.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '25.2'
    text: |-
      De beleggingsonderneming draagt zorg voor de beoordeling van de betrouwbaarheid van degenen die, anders dan op
      grond van een arbeidsovereenkomst, werkzaamheden in een integriteitgevoelige functie verrichten
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel25
  - number: '26.1'
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] beschikt over procedures
      en maatregelen met betrekking tot de acceptatie van cliënten. Deze procedures en maatregelen hebben betrekking op
      risicoclassificaties ten aanzien van cliënten, producten of diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '26.2'
    text: |-
      Onverminderd het bepaalde ingevolge de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1]
      beschikt de beleggingsonderneming over procedures en maatregelen met betrekking tot de identificatie van cliënten
      en de verificatie daarvan. De beleggingsonderneming accepteert een cliënt niet indien zij de identiteit niet heeft
      vastgesteld overeenkomstig het daarvoor opgestelde beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: '26.3'
    text: |-
      De beleggingsonderneming beschikt over procedures met betrekking tot de analyse van gegevens van cliënten, mede in
      relatie tot de door de cliënt afgenomen producten en diensten, en de detectie van afwijkende transactiepatronen.
      Aan de hand van deze procedures en maatregelen worden tevens de risico’s ten aanzien van bepaalde cliënten of
      producten bepaald.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel26
  - number: '26.4'
    text: |-
      De beleggingsonderneming draagt zorg voor de documentatie en vastlegging met betrekking tot de acceptatie en
      indeling van cliënten naar risico en de bewaking van het handelen van cliënten. Dergelijke gegevens worden tot vijf
      jaar na de dienstverlening of het beëindigen van de relatie bewaard.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel26
  - number: '27.1'
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] onderzoekt, op verzoek van
      de Autoriteit Financiële Markten, of in haar administratie bepaalde personen of instellingen voorkomen die naar
      het oordeel van Onze Minister, in verband met vermoede terroristische activiteiten of daarmee verband houdende
      activiteiten, de integriteit van de financiële sector kunnen schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '27.2'
    text: |-
      De beleggingsonderneming verstrekt de uitkomst van het in het eerste lid bedoelde onderzoek aan de Autoriteit
      Financiële Markten, binnen een door deze vast te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel27
  - number: '28.1'
    text: |-
      Een financiëledienstverlener als bedoeld in [artikel 4:11, tweede lid, van de wet][ref1] draagt er zorg voor
      dat de betrouwbaarheid van de werknemers en andere natuurlijke personen die zich onder zijn verantwoordelijkheid
      rechtstreeks bezighouden met het verlenen van financiële diensten, buiten twijfel staat.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '28.2'
    text: |-
      Een persoon als bedoeld in het eerste lid is betrouwbaar, indien hij een verklaring omtrent het gedrag als bedoeld
      in de [Wet justitiële en strafvorderlijke gegevens][ref1] over kan leggen, en hij niet failliet is verklaard,
      tenzij rehabilitatie als bedoeld in [artikel 212 van de Faillissementswet][ref2] heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel212
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '212'
  - number: '29.1'
    text: |-
      Een financiëledienstverlener als bedoeld in [artikel 4:15, eerste lid, van de wet][ref1] stelt procedures en
      maatregelen vast met betrekking tot de omgang met en vastlegging van incidenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '29.2'
    text: |-
      De financiëledienstverlener neemt naar aanleiding van een incident passende maatregelen. Deze maatregelen zijn
      gericht op het beheersen van de opgetreden risico’s en het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel29
  - number: '29.3'
    text: De financiëledienstverlener informeert de Autoriteit Financiële Markten onverwijld omtrent incidenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel29
  - number: '30.1'
    text: |-
      De bedrijfsvoering van een beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder als bedoeld in
      [artikel 4:14, eerste lid, van de wet][ref1] omvat ten minste procedures en maatregelen die waarborgen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 30.1.a
    text: |-
      het besluitvormingsproces en de gemaakte afspraken binnen de bedrijfsvoering van de beheerder,
      beleggingsinstelling, bewaarder en pensioenbewaarder inzichtelijk zijn;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel30
  - number: 30.1.b
    text: |-
      de bestuurders regelmatig, alsmede tussentijds in het geval zich bijzondere omstandigheden voordoen, worden
      geïnformeerd over de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel30
  - number: 30.1.c
    text: de integriteit, voortdurende beschikbaarheid en beveiliging van de geautomatiseerde gegevens zijn gegarandeerd; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel30
  - number: 30.1.d
    text: |-
      nagegaan wordt in hoeverre overeenkomstig de beschreven procedures voor de bedrijfsvoering wordt gehandeld,
      gesignaleerd wordt wanneer en in hoeverre daarvan wordt afgeweken en aanpassing van het feitelijk handelen mogelijk
      is.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel30
  - number: '30.2'
    text: |-
      Een beheerder richt voor iedere beleggingsinstelling die hij beheert afzonderlijk een bedrijfsvoering als bedoeld
      in het eerste lid in.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel30
  - number: '30.3'
    text: |-
      De beheerder, beleggingsinstelling, bewaarder of pensioenbewaarder legt zijn onderscheidenlijk haar bedrijfsvoering
      op een inzichtelijke wijze vast.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel30
  - number: '31.1'
    text: |-
      De bedrijfsvoering van een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1]
      voorziet in:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 31.1.a
    text: duidelijke besluitvormingsprocedures en een duidelijke en adequate organisatiestructuur;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31
  - number: 31.1.b
    text: een duidelijke en adequate verdeling van taken, bevoegdheden en verantwoordelijkheden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31
  - number: 31.1.c
    text: eenduidige rapportagelijnen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31
  - number: 31.1.d
    text: een adequaat systeem van informatievoorziening en communicatie; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31
  - number: 31.1.e
    text: |-
      adequate interne controleprocedures om te waarborgen dat beslissingen en procedures op alle niveaus in acht worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31
  - number: '31.2'
    text: |-
      De bedrijfsvoering is afgestemd op de aard, omvang, risico’s en complexiteit van het bedrijf en de werkzaamheden
      van de beleggingsonderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31
  - number: '31.3'
    text: De bedrijfsvoering wordt op een inzichtelijke wijze vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31
  - number: '31.4'
    text: |-
      Een beleggingsonderneming zorgt ervoor dat werknemers die verscheidene functies uitoefenen, daardoor niet worden of
      kunnen worden belet een van deze functies op degelijke, eerlijke en professionele wijze uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31
  - number: '31.5'
    text: |-
      Werknemers van een beleggingsonderneming en andere personen die zich onder haar verantwoordelijkheid rechtstreeks
      bezig houden met het verlenen van beleggingsdiensten of het verrichten van beleggingsactiviteiten beschikken over
      de nodige vakbekwaamheid en kennis om de hun toevertrouwde verantwoordelijkheden uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31
  - number: '31.6'
    text: |-
      De effectiviteit van de organisatie-inrichting en van de procedures en maatregelen wordt ten minste jaarlijks op
      onafhankelijke wijze getoetst. Daartoe beschikt de beleggingsonderneming over een organisatieonderdeel dat een
      interne controlefunctie uitoefent. De beleggingsonderneming voorziet erin dat gesignaleerde tekortkomingen worden
      opgeheven.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31
  - number: 31a
    text: |-
      Het organisatieonderdeel, bedoeld in [artikel 31, zesde lid][ref1], heeft als taak:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel31
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '31'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 31a.a
    text: |-
      het vaststellen en uitvoeren van een controleplan om de deugdelijkheid en effectiviteit van de systemen, interne
      controleprocedures en regels van de beleggingsonderneming te onderzoeken en te beoordelen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31a
  - number: 31a.b
    text: het doen van aanbevelingen op basis van de resultaten van de werkzaamheden, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31a
  - number: 31a.c
    text: het controleren of aan deze aanbevelingen gevolg wordt gegeven; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31a
  - number: 31a.d
    text: |-
      het ten minste jaarlijks rapporteren aan de personen die het dagelijks beleid van de beleggingsonderneming bepalen
      en aan het orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de algemene gang van zaken van de
      beleggingsonderneming inzake aangelegenheden met betrekking tot de interne controle en de genomen maatregelen in
      geval van gesignaleerde tekortkomingen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31a
  - number: 31b
    text: |-
      Een beleggingsonderneming beschikt over procedures en maatregelen om de integriteit, voortdurende beschikbaarheid
      en beveiliging van geautomatiseerde gegevensverwerking te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31b
  - number: 31c.1
    text: |-
      Een beleggingsonderneming beschikt over een organisatieonderdeel dat op onafhankelijke en effectieve wijze een
      compliancefunctie uitoefent.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31c
  - number: 31c.2
    text: 'Het organisatieonderdeel, bedoeld in het eerste lid, heeft als taak:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31c
  - number: 31c.2.a
    text: |-
      het controleren van de naleving van wettelijke regels en van interne regels die de beleggingsonderneming zelf heeft
      opgesteld;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31c
  - number: 31c.2.b
    text: |-
      het adviseren van de personen die verantwoordelijk zijn voor het verlenen van beleggingsdiensten of het verrichten
      van beleggingsactiviteiten bij de naleving van wettelijke regels en interne regels;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31c
  - number: 31c.2.c
    text: het toezien op de deugdelijkheid en effectiviteit van de interne regels en procedures;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31c
  - number: 31c.2.d
    text: |-
      het beoordelen van de effectiviteit van de procedures die zijn opgesteld en maatregelen die zijn genomen om
      gesignaleerde onvolkomenheden bij de naleving van wettelijke regels en interne regels op te heffen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31c
  - number: 31c.2.e
    text: |-
      het tenminste jaarlijks rapporteren aan de personen die het dagelijks beleid van de beleggingsonderneming bepalen
      en aan het orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de algemene gang van zaken
      van de beleggingsonderneming inzake aangelegenheden met betrekking tot de naleving van wettelijke regels en
      interne regels. In de jaarlijkse rapportage wordt met name vermeld of maatregelen zijn genomen in het geval van
      gesignaleerde tekortkomingen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31c
  - number: 31c.3
    text: |-
      Het organisatieonderdeel dat de compliancefunctie uitoefent beschikt over de nodige autoriteit, middelen,
      deskundigheid en toegang tot alle noodzakelijke informatie om haar taken onafhankelijk en effectief te kunnen
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel31c
  - number: '32.1'
    text: |-
      Een aanbieder als bedoeld in [artikel 4:15, eerste of derde lid, van de wet][ref1] die een consument of, indien het
      een verzekering betreft, cliënt adviseert, bewaart, indien de advisering leidt tot het aangaan van een overeenkomst
      inzake het aanbevolen product met de consument onderscheidenlijk de cliënt, de informatie die hij overeenkomstig
      [artikel 4:23, eerste lid, onderdeel a, van de wet][ref2] heeft ingewonnen, alsmede de gegevens betreffende het
      verkochte financiële product, gedurende ten minste één jaar vanaf het moment van advisering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '32.2'
    text: |-
      Een adviseur als bedoeld in [artikel 4:15, eerste of derde lid, van de wet][ref1] die een consument of, indien
      het een verzekering betreft, cliënt adviseert, en het aanbevolen financiële product niet tevens aanbiedt
      aan de consument of cliënt of met betrekking tot het aanbevolen financiële product niet tevens bemiddelt of
      optreedt als gevolmachtigde agent of ondergevolmachtigde agent, bewaart de informatie die hij overeenkomstig
      [artikel 4:23, eerste lid, onderdeel a, van de wet][ref2] heeft ingewonnen, alsmede de gegevens betreffende het
      aanbevolen financiële product, gedurende ten minste één jaar vanaf het moment van advisering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '32.3'
    text: |-
      Een bemiddelaar, gevolmachtigde agent of ondergevolmachtigde agent als bedoeld in
      [artikel 4:15, eerste of derde lid, van de wet][ref1] die een consument of, indien het een verzekering
      betreft, cliënt adviseert bewaart, indien de advisering leidt tot het aangaan van een overeenkomst met de
      consument onderscheidenlijk de cliënt inzake het aanbevolen product, de informatie die hij overeenkomstig
      [artikel 4:23, eerste lid, onderdeel a, van de wet][ref2] heeft ingewonnen, alsmede de gegevens betreffende het
      aanbevolen financiële product, gedurende ten minste één jaar vanaf het moment van advisering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '32.4'
    text: |-
      Het eerste, tweede en derde lid zijn niet van toepassing op financiële ondernemingen die bij de advisering
      uitsluitend te werk gaan volgens een gestandaardiseerde en gesystematiseerde procedure die voor de Autoriteit
      Financiële Markten verifieerbaar is, en die aan de hand van deze procedure aan de Autoriteit Financiële Markten
      kunnen aantonen welke informatie zij overeenkomstig [artikel 4:23, eerste lid, onderdeel a, van de wet][ref1] over
      consumenten onderscheidenlijk cliënten inwinnen en welke adviezen consumenten onderscheidenlijk cliënten op basis
      van de aldus ingewonnen informatie worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '32.5'
    text: |-
      Een aanbieder, bemiddelaar, gevolmachtigde agent of ondergevolmachtigde agent als bedoeld in
      [artikel 4:15, eerste of derde lid, van de wet][ref1] die in het kader van een door hem verstrekt advies met een
      consument of, indien het een verzekering betreft, cliënt een overeenkomst aangaat onderscheidenlijk bemiddelt
      bij de totstandkoming van een overeenkomst inzake een ander financieel product dan waarover hij de consument
      onderscheidenlijk de cliënt heeft geadviseerd, is gedurende ten minste één jaar na de totstandkoming van de
      overeenkomst in staat om aan de Autoriteit Financiële Markten aan te tonen dat de consument onderscheidenlijk de
      cliënt in weerwil van het advies de keuze heeft gemaakt voor het aangaan van die overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '33'
    text: |-
      Een aanbieder van krediet als bedoeld in [artikel 4:15, eerste of derde lid, van de wet][ref1] bewaart de
      informatie die hij ingevolge de [artikelen 4:34, eerste lid, van de wet][ref2] en [113][ref3] en [114][ref4]
      heeft ingewonnen, alsmede de door hem aangeboden overeenkomst inzake krediet, indien die overeenkomst tot stand is
      gekomen, ten minste gedurende vijf jaren na de dag waarop die overeenkomst is afgewikkeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel113
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel114
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '113'
        hoofdstuk: '10'
        paragraaf: 10.2.2
        afdeling: '10.2'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '114'
        hoofdstuk: '10'
        paragraaf: 10.2.2
        afdeling: '10.2'
  - number: '34.1'
    text: |-
      De bedrijfsvoering van een beheerder, beleggingsinstelling of bewaarder als bedoeld in
      [artikel 4:14, eerste lid, van de wet][ref1] omvat ten minste procedures en maatregelen die waarborgen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 34.1.a
    text: elke transactie waarbij de beleggingsinstelling is betrokken, kan worden gereconstrueerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
  - number: 34.1.b
    text: |-
      het beheerde vermogen van de beleggingsinstelling overeenkomstig het beleggingsbeleid en de bij of krachtens de wet
      gestelde regels wordt belegd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
  - number: 34.1.c
    text: |-
      een functiescheiding bestaat tussen het verrichten van rechtshandelingen met betrekking tot het vermogen van de
      beleggingsinstelling en het controleren en administreren van deze handelingen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
  - number: 34.1.d
    text: een betrouwbare, juiste en consistente intrinsieke waarde van de beleggingsinstelling wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
  - number: 34.1.e
    text: |-
      het proces van intrinsieke waardebepaling binnen de beheerder of de beleggingsmaatschappij wordt gescheiden van de
      overige activiteiten van de beheerder of de beleggingsmaatschappij;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
  - number: 34.1.f
    text: de berekening van de intrinsieke waarde van de beleggingsinstelling aansluit bij de financiële administratie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
  - number: 34.1.g
    text: de risico’s die samenhangen met het beleggingsproces op een systematische wijze worden beheerst en geanalyseerd; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
  - number: 34.1.h
    text: |-
      er, voorzover mogelijk, een systematische, toegankelijke en actuele administratie van deelnemers in de
      beleggingsinstelling is waarin, voorzover van toepassing, de met de deelnemers gemaakte afspraken inzichtelijk
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
  - number: '34.2'
    text: |-
      De maatregelen en procedures, bedoeld in het eerste lid, aanhef en onderdeel f, voorzien er in ieder geval in dat
      de voor de intrinsieke waardebepaling gebruikte subadministraties ten minste een keer per maand worden aangesloten
      met de saldibalans en dat de daaruit voortvloeiende verschillen worden geanalyseerd en gecorrigeerd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
  - number: '34.3'
    text: |-
      De procedures en maatregelen, bedoeld in het eerste lid, onderdeel g, van een instelling voor collectieve belegging
      in effecten omvatten in ieder geval een procedure voor de waardevaststelling van financiële derivaten die niet op
      een gereglementeerde markt of een andere markt in financiële instrumenten worden verhandeld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
  - number: '34.4'
    text: |-
      Een beheerder richt voor iedere beleggingsinstelling die hij beheert afzonderlijk een bedrijfsvoering als bedoeld
      in het eerste lid in.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34
  - number: 34a
    text: |-
      De bedrijfsvoering van een pensioenbewaarder als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] omvat ten
      minste procedures en maatregelen die waarborgen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 34a.a
    text: elke transactie in verband met het overgedragen pensioenvermogen, kan worden gereconstrueerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34a
  - number: 34a.b
    text: |-
      het overgedragen pensioenvermogen overeenkomstig het door de premiepensioeninstelling bepaalde beleggingsbeleid en
      de bij of krachtens de wet gestelde regels wordt belegd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34a
  - number: 34a.c
    text: de risico’s die samenhangen met het beleggingsproces op een systematische wijze worden beheerst en geanalyseerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34a
  - number: 34a.d
    text: |-
      een functiescheiding bestaat tussen het verrichten van rechtshandelingen met betrekking tot het overgedragen
      pensioenvermogen en het controleren en administreren van deze handelingen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34a
  - number: 34a.e
    text: |-
      alle rechten en verplichtingen van de pensioenbewaarder juist, tijdig en volledig worden vastgelegd in een daartoe
      bestemde administratie; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34a
  - number: 34a.f
    text: |-
      de administratie van het overgedragen pensioenvermogen ten minste een keer per maand wordt aangesloten met de
      saldibalans en dat de daaruit voortvloeiende verschillen worden geanalyseerd en gecorrigeerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel34a
  - number: '35.1'
    text: |-
      Een beleggingsonderneming houdt gegevens bij over alle door haar verleende beleggingsdiensten, nevendiensten
      en verrichte beleggingsactiviteiten ten einde het toezicht op de naleving van hetgeen ter implementatie van de
      richtlijn markten voor financiële instrumenten ingevolge de [wet][ref1] is bepaald mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '35.2'
    text: De beleggingsonderneming bewaart de gegevens, bedoeld in het eerste lid, gedurende ten minste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35
  - number: '35.3'
    text: |-
      Een beleggingsonderneming bewaart de gegevens met betrekking tot de overeenkomst, bedoeld in
      [artikel 4:89, tweede lid, van de wet][ref1], ten minste voor de duur van de relatie met de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '35.4'
    text: |-
      Een beleggingsonderneming bewaart de gegevens, bedoeld in het eerste en derde lid, op een duurzame drager in een
      zodanige vorm en op zodanige wijze dat:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35
  - number: 35.4.a
    text: |-
      de Autoriteit Financiële Markten vlot toegang kan hebben tot de gegevens en elk stadium van de verwerking van een
      transactie kan reconstrueren;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35
  - number: 35.4.b
    text: |-
      alle wijzigingen, alsmede de inhoud van de gegevens voordat wijzigingen zijn aangebracht, gemakkelijk kunnen worden
      achterhaald;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35
  - number: 35.4.c
    text: de gegevens niet anderszins gemanipuleerd of gewijzigd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35
  - number: '35.5'
    text: |-
      De Autoriteit Financiële Markten stelt een lijst op van gegevens die een beleggingsonderneming op grond van hetgeen
      ter implementatie van de richtlijn markten voor financiële instrumenten ingevolge de [wet][ref1] is bepaald, ten
      minste moet bewaren.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 35a.1
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] beschikt over procedures
      en maatregelen voor het voorkomen van en omgaan met belangenconflicten tussen de beleggingsonderneming en haar
      cliënten of tussen haar cliënten onderling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 35a.2
    text: |-
      De procedures en maatregelen, bedoeld in het eerste lid, zijn erop gericht dat relevante personen die betrokken
      zijn bij verschillende bedrijfsactiviteiten waarbij het risico bestaat op een belangenconflict als bedoeld in
      het eerste lid, deze activiteiten verrichten in een mate van onafhankelijkheid die evenredig is aan de omvang en
      activiteiten van de beleggingsonderneming en de groep waarvan zij deel uitmaakt, en aan de grootte van het risico
      dat de belangen van een cliënt worden geschaad.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35a
  - number: 35a.3
    text: |-
      De procedures en maatregelen, bedoeld in het eerste lid, omvatten, voor zover nodig en passend om de mate van
      onafhankelijkheid, bedoeld in het tweede lid, te waarborgen:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35a
  - number: 35a.3.a
    text: |-
      procedures ter voorkoming of controle van de uitwisseling van informatie tussen relevante personen die
      verschillende activiteiten verrichten waarbij het risico bestaat op een belangenconflict wanneer de uitwisseling
      van deze informatie de belangen van een cliënt kan schaden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35a
  - number: 35a.3.b
    text: |-
      controle op de activiteiten van relevante personen wier hoofdtaken bestaan in het uitoefenen van activiteiten in
      naam van, of het verlenen van diensten aan cliënten wier belangen met elkaar in strijd kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35a
  - number: 35a.3.c
    text: |-
      de uitsluiting van elk direct verband tussen de beloning van relevante personen die hoofdzakelijk betrokken
      zijn bij de ene activiteit en de beloning van of de inkomsten gegenereerd door andere relevante personen die
      hoofdzakelijk betrokken zijn bij een andere activiteit, wanneer door deze activiteiten een belangenconflict kan
      ontstaan;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35a
  - number: 35a.3.d
    text: |-
      maatregelen om te voorkomen of het risico te beperken dat een persoon zodanige invloed uitoefent op de wijze
      waarop een relevante persoon beleggingsdiensten, beleggingsactiviteiten of nevendiensten verricht, dat daardoor een
      belangenconflict ontstaat of kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35a
  - number: 35a.3.e
    text: |-
      maatregelen ter voorkoming of controle van de gelijktijdige of achtereenvolgende betrokkenheid van een relevante
      persoon bij verschillende beleggingsdiensten, beleggingsactiviteiten of nevendiensten wanneer een dergelijke
      betrokkenheid kan leiden tot het ontstaan van belangenconflicten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35a
  - number: 35a.4
    text: |-
      Indien bij vaststelling of toepassing van procedures of maatregelen als bedoeld in het eerste lid niet de in het
      tweede lid bedoelde mate van onafhankelijkheid kan worden gewaarborgd, draagt de beleggingsonderneming zorg voor
      alternatieve of aanvullende procedures of maatregelen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35a
  - number: 35b
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] legt de gegevens
      vast die betrekking hebben op de soorten door of in naam van de onderneming verrichte beleggingsdiensten,
      beleggingsactiviteiten of nevendiensten waarbij een belangenconflict is ontstaan of kan ontstaan dat een wezenlijk
      risico met zich brengt dat de belangen van een of meer cliënten worden geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 35c.1
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] beschikt over procedures en
      maatregelen met betrekking tot persoonlijke transacties.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 35c.2
    text: |-
      De procedures en maatregelen, bedoeld in het eerste lid, zijn er op gericht dat indien een relevante persoon
      betrokken is bij het verrichten van activiteiten die een belangenconflict kunnen doen ontstaan, of indien een
      relevante persoon als gevolg van een activiteit die hij in naam van de beleggingsonderneming verricht toegang heeft
      tot informatie als bedoeld in [artikel 5:53, eerste lid, van de wet][ref1] of tot andere vertrouwelijke informatie
      over cliënten of transacties met of voor cliënten:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 35c.2.a
    text: |-
      geen persoonlijke transactie door of in naam van die relevante persoon wordt verricht die in strijd is met
      [artikel 5:56][ref1] of [5:58 Wft][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 35c.2.b
    text: |-
      geen persoonlijke transactie door of in naam van die relevante persoon wordt verricht die gepaard gaat met misbruik
      of ongeoorloofde bekendmaking van de in de aanhef bedoelde vertrouwelijke informatie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35c
  - number: 35c.2.c
    text: |-
      geen persoonlijke transactie door of in naam van die relevante persoon wordt verricht die anderszins in strijd is
      of in strijd kan zijn met hetgeen ter uitvoering van de richtlijn markten voor financiële instrumenten ingevolge de
      [wet][ref1] is bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 35c.2.d
    text: |-
      de relevante persoon niet, anders dan in de normale uitoefening van zijn beroep of bedrijf, een andere
      persoon adviseert om een transactie in een financieel instrument aan te gaan die, wanneer dit een persoonlijke
      transactie van de relevante persoon zou zijn, niet zou zijn toegestaan op grond van onderdeel a, b of c, of onder
      [artikel 35h, onderdeel a of b][ref1] of [artikel 164, derde lid][ref2] zou vallen; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel35h
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel164
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 35h
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '164'
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 35c.2.e
    text: |-
      de relevante persoon geen informatie of advies aan een andere persoon bekendmaakt anders dan in de normale
      uitoefening van zijn beroep of bedrijf, indien de relevante persoon weet of redelijkerwijs behoort te weten dat
      de andere persoon een transactie in een financieel instrument zal of zou kunnen aangaan die, wanneer dit een
      persoonlijke transactie van de relevante persoon zou zijn, niet zou zijn toegestaan op grond van onderdeel a, b of
      c, of onder [artikel 35h, onderdeel a of b][ref1] of [artikel 164, derde lid][ref2] zou vallen;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel35h
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel164
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 35h
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '164'
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 35c.2.f
    text: |-
      de relevante persoon geen informatie of advies aan een andere persoon bekendmaakt anders dan in de normale
      uitoefening van zijn beroep of bedrijf indien de relevante persoon weet of redelijkerwijs behoort te weten dat de
      andere persoon een derde zal of zou kunnen adviseren een transactie in een financieel instrument aan te gaan die,
      wanneer het een persoonlijke transactie van de relevante persoon zou zijn, niet zou zijn toegestaan.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35c
  - number: 35d
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] draagt er zorg voor
      dat relevante personen op de hoogte zijn van de door haar vastgestelde maatregelen en procedures, bedoeld in
      [artikel 35c, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel35c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 35c
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 35e.1
    text: |-
      De procedures en maatregelen bedoeld in [artikel 35c, eerste lid][ref1], houden in dat een beleggingsonderneming
      onverwijld in kennis wordt gesteld van elke persoonlijke transactie.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel35c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 35c
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 35e.2
    text: |-
      Een beleggingsonderneming houdt gegevens bij van aan haar gemelde of door haar onderkende persoonlijke transacties
      en vermeldt daarbij in voorkomend geval tevens of de desbetreffende transactie is toegestaan.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35e
  - number: 35e.3
    text: |-
      Ingeval van uitbesteding draagt de beleggingsonderneming zorg voor registratie door de onderneming waaraan
      de activiteit wordt uitbesteed van gegevens met betrekking tot persoonlijke transacties. Deze gegevens worden
      desgevraagd onverwijld aan de beleggingsonderneming verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35e
  - number: 35e.4
    text: |-
      Het eerste tot en met het derde lid zijn niet van toepassing op achtereenvolgende persoonlijke transacties,
      met uitzondering van de eerste persoonlijke transactie, die worden uitgevoerd namens een relevante persoon
      overeenkomstig vooraf door de relevante persoon gegeven instructies, wanneer de instructies ongewijzigd van kracht
      blijven.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35e
  - number: 35f
    text: |-
      De [artikelen 35c][ref1], [35d][ref2] en [35e, eerste tot en met het derde lid][ref3], zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel35c
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel35d
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel35e
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 35c
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 35d
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 35e
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 35f.a
    text: |-
      persoonlijke transacties verricht in het kader van het beheer van een individueel vermogen waarbij het vermogen
      op discretionaire basis wordt beheerd en waarbij over de transactie geen voorafgaande communicatie heeft
      plaatsgevonden tussen de vermogensbeheerder en de relevante persoon of een andere persoon als bedoeld in de
      definitie van *persoonlijke transactie*, [onder 3° of 4°, in artikel 1][ref1], voor wiens rekening de transactie
      wordt uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 35f.b
    text: |-
      persoonlijke transacties in rechten van deelneming in instellingen voor collectieve belegging in effecten,
      indien noch de relevante persoon, noch een persoon als bedoeld in de definitie van *persoonlijke transactie*,
      [onder 3° of 4°, in artikel 1][ref1], voor wiens rekening de transacties worden uitgevoerd, bij de leiding van de
      betreffende instelling betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 35g.1
    text: |-
      Indien een beleggingsonderneming onderzoek op beleggingsgebied verricht of laat verrichten waarvan het de bedoeling
      is of aangenomen mag worden dat het daarna onder eigen verantwoordelijkheid of onder de verantwoordelijkheid van
      een rechtspersoon die deel uitmaakt van dezelfde groep als de beleggingsonderneming onder cliënten of onder het
      publiek wordt verspreid, is [artikel 35a, tweede tot en met vierde lid][ref1], van overeenkomstige toepassing ten
      aanzien van de financieel analisten die betrokken zijn bij het verrichten van onderzoek op beleggingsgebied, en
      andere relevante personen wier verantwoordelijkheden of zakelijke belangen in strijd kunnen zijn met de belangen
      van degenen onder wie het onderzoek op beleggingsgebied wordt verspreid.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel35a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 35a
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 35g.2
    text: |-
      De Autoriteit Financiële Markten kan op aanvraag ontheffing verlenen van de ingevolge het eerste lid toepasselijke
      bepalingen indien de beleggingsonderneming voornemens is door een derde, die geen deel uitmaakt van de
      groep waartoe de beleggingsonderneming behoort, verricht onderzoek op beleggingsgebied te verspreiden en de
      beleggingsonderneming:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35g
  - number: 35g.2.a
    text: geen ingrijpende wijzigingen aanbrengt in de aanbevelingen in het onderzoek;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35g
  - number: 35g.2.b
    text: het onderzoekniet presenteert als onderzoek dat zij zelf heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35g
  - number: 35g.2.c
    text: |-
      zich ervan vergewist dat degene die het onderzoek heeft verricht aan verplichtingen voldoet met betrekking tot het
      verrichten van het onderzoek die gelijkwaardig zijn aan hetgeen ingevolge dit besluit is bepaald met betrekking tot
      het verrichten van onderzoek op beleggingsgebied.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35g
  - number: 35h
    text: |-
      Een beleggingsonderneming die onderzoek op beleggingsgebied verricht of laat verrichten en voornemens is dat
      onderzoek onder cliënten of het publiek te verspreiden, draagt er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35h
  - number: 35h.a
    text: |-
      de bij het onderzoek betrokken financieel analisten of andere relevante personen geen transacties verrichten namens
      de beleggingsonderneming of andere personen, in financiële instrumenten waarop het onderzoek op beleggingsgebied
      betrekking heeft, dan wel in daarmee gelieerde financiële instrumenten, behalve als marketmaker, indien zij op de
      hoogte zijn van het tijdstip van verspreiding of de inhoud van het onderzoek op beleggingsgebied en deze kennis
      niet openbaar is, totdat de ontvangers van het onderzoek een redelijke kans hebben gehad ernaar te handelen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35h
  - number: 35h.b
    text: |-
      de bij het onderzoek betrokken financieel analisten of andere relevante personen die bij het verrichten van
      onderzoek op beleggingsgebied zijn betrokken, geen met de gangbare aanbevelingen strijdige persoonlijke transacties
      verrichten in financiële instrumenten waarop het onderzoek op beleggingsgebied betrekking heeft, dan wel in daarmee
      gelieerde financiële instrumenten, behalve in uitzonderingsgevallen en in die gevallen met voorafgaande instemming
      van het organisatieonderdeel dat de compliancefunctie, bedoeld in [artikel 31c][ref1], uitoefent;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel31c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35h
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 31c
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 35h.c
    text: |-
      zijzelf, financieel analisten en andere relevante personen die bij het verrichten van het onderzoek zijn betrokken,
      geen vergoeding aanvaarden van degenen die een wezenlijk belang hebben bij het onderwerp van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35h
  - number: 35h.d
    text: |-
      zijzelf, de financieel analisten en andere relevante personen die bij het verrichten van
      onderzoek op beleggingsgebied zijn betrokken, aan uitgevende instellingen als bedoeld in
      [artikel 5:53, vierde lid, van de wet][ref1], niet een gunstige behandeling beloven in hun onderzoek; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35h
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 35h.e
    text: |-
      uitgevende instellingen als bedoeld in [artikel 5:53, vierde lid, van de wet][ref1], relevante personen die geen
      financieel analist zijn, en andere personen vóór de verspreiding van het onderzoek geen inzage krijgen in het
      concept-onderzoek ter controle van de juistheid van de feitelijke beweringen in dit onderzoek of voor andere
      doeleinden, met uitzondering van een controle op de naleving van de juridische verplichtingen van de uitgevende
      instelling, indien het concept-onderzoek een aanbeveling of richtprijs bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35h
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 35i.1
    text: |-
      Een financiële onderneming legt het beleid inzake beloningen als bedoeld in [artikel 86a][ref1] schriftelijk vast
      en draagt er zorg voor dit beleid te implementeren en in stand te houden. Het beleid is afgestemd op de omvang en
      organisatie van de financiële onderneming en aan de aard, omvang en complexiteit van haar bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel86a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35i
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 86a
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 35i.2
    text: |-
      Het beleid inzake beloningen omschrijft, onder verwijzing naar de specifieke financiële diensten of andere
      activiteiten die door of in naam van de financiële onderneming worden verleend respectievelijk verricht, de
      beloningscomponenten en beloningsstructuren die kunnen leiden tot het risico van onzorgvuldige behandeling van
      consumenten, cliënten of deelnemers, alsmede de te volgen procedures en maatregelen die dat risico voorkomen en
      beheersen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35i
  - number: 35i.3
    text: |-
      Een financiële onderneming beschikt over procedures en maatregelen ter uitvoering van het beleid, als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35i
  - number: 35i.4
    text: 'De Autoriteit Financiële Markten kan regels stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35i
  - number: 35i.4.a
    text: |-
      de wijzen waarop het beleid inzake beloningen wordt opgesteld en vastgesteld of goedgekeurd, uitgevoerd,
      geëvalueerd en aangepast; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35i
  - number: 35i.4.b
    text: |-
      de wijze waarop vorm wordt gegeven aan beloningscomponenten en beloningsstructuren en de wijze waarop de risico’s
      die uit het beleid en de uitvoering daarvan voortvloeien, worden beheerst.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel35i
  - number: '36'
    text: 'Dit hoofdstuk is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel36
  - number: 36.a
    text: |-
      beheerders van instellingen voor collectieve belegging in effecten met zetel in een andere lidstaat, instellingen
      voor collectieve belegging in effecten met zetel in een andere lidstaat en de eventueel aan die instellingen
      verbonden bewaarders; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel36
  - number: 36.b
    text: |-
      beheerders van beleggingsinstellingen met zetel in een aangewezen staat, beleggingsinstellingen met zetel in een
      aangewezen staat en de eventueel aan die beleggingsinstellingen verbonden bewaarders.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel36
  - number: '37'
    text: |-
      Een financiële onderneming gaat niet over tot het uitbesteden van werkzaamheden indien dat een belemmering vormt
      voor een adequaat toezicht op de naleving van het [Deel Gedragstoezicht financiële ondernemingen van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '38.1'
    text: |-
      Indien een beheerder of bewaarder in het kader van het beheer van een beleggingsinstelling onderscheidenlijk in het
      kader van de bewaring van de activa van een beleggingsinstelling een of meer werkzaamheden uitbesteedt:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38
  - number: 38.1.a
    text: |-
      is de derde op ieder door de beheerder, de door de beheerder beheerde beleggingmaatschappij of de bewaarder gewenst
      moment in staat verantwoording af te leggen over de door hem uitgevoerde werkzaamheden en de beheerder, de door de
      beheerder beheerde beleggingsmaatschappij of de bewaarder daar inzicht in te bieden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38
  - number: 38.1.b
    text: |-
      kan de beheerder of de bewaarder te allen tijde instructies omtrent de uitvoering van de werkzaamheden geven aan de
      derde en kan hij de uitbesteding met onmiddellijke ingang beëindigen indien dit in het belang van de beleggers is;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38
  - number: 38.1.c
    text: |-
      is de derde, gelet op de aard van de opdracht, aantoonbaar in staat om de opdracht in overeenstemming met de
      [wet][ref1] te vervullen; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 38.1.d
    text: |-
      indien het werkzaamheden in het kader van het beheer van een instelling voor collectieve belegging in effecten
      betreft:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38
  - number: 38.1.d.1°
    text: |-
      geschiedt uitbesteding van het uitvoeren van het beleggingsbeleid uitsluitend aan een derde waaraan voor het beheer
      van beleggingsinstellingen of het beheren van individuele vermogens een vergunning of erkenning is verleend en die
      aan prudentieel toezicht is onderworpen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38
  - number: 38.1.d.2°
    text: |-
      is bij uitbesteding aan een derde uit een staat die geen lidstaat of aangewezen staat is, de samenwerking tussen
      de toezichthouders en het bevoegde gezag in de staat van de zetel van de derde op grond van een overeenkomst
      gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38
  - number: 38.1.d.3°
    text: |-
      zijn de belangen van de derde niet strijdig met die van de beheerder, de bewaarder of de deelnemers in de
      beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38
  - number: '38.2'
    text: Een beheerder besteedt het bepalen van het beleggingsbeleid van een beleggingsinstelling niet uit.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38
  - number: '38.3'
    text: |-
      Iedere overeenkomst die een beheerder of een bewaarder aangaat in het kader van het uitbesteden van het beheer van
      de beleggingsinstelling onderscheidenlijk in het kader van de bewaring van de activa van de beleggingsinstelling,
      wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38
  - number: 38a.1
    text: |-
      Een beleggingsonderneming gaat niet over tot het uitbesteden van werkzaamheden indien dat afbreuk doet aan de
      kwaliteit van haar onafhankelijke interne toetsing als bedoeld in [artikel 31, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel31
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '31'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 38a.2
    text: |-
      Het eerste lid is niet van toepassing op banken die een vergunning hebben als bedoeld in
      [artikel 2:11 van de wet][ref1] en in Nederland beleggingsdiensten mogen verlenen of beleggingsactiviteiten mogen
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 38b.1
    text: |-
      Een beleggingsonderneming die werkzaamheden uitbesteedt aan een derde, draagt er zorg voor dat zij daartoe over de
      nodige deskundigheid beschikt en daarbij de nodige zorgvuldigheid en waakzaamheid in acht neemt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38b
  - number: 38b.2
    text: |-
      Het eerste lid is niet van toepassing op banken die een vergunning hebben als bedoeld in
      [artikel 2:11 van de wet][ref1] en in Nederland beleggingsdiensten mogen verlenen of beleggingsactiviteiten mogen
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 38c.1
    text: 'Een beleggingsonderneming die werkzaamheden uitbesteedt aan een derde draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38c
  - number: 38c.1.a
    text: de uitbesteding geen afbreuk doet aan de verantwoordelijkheid van de personen die het dagelijks beleid bepalen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38c
  - number: 38c.1.b
    text: |-
      door de uitbesteding de relatie en verplichtingen van de beleggingsonderneming jegens haar cliënten uit hoofde van
      hetgeen ter implementatie van de richtlijn markten voor financiële instrumenten ingevolge de [wet][ref1] is bepaald
      niet worden gewijzigd;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38c
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 38c.1.c
    text: |-
      de voorwaarden waaraan de beleggingsonderneming moet voldoen om een vergunning als bedoeld in
      [artikel 2:96 van de wet][ref1] te verkrijgen en om deze te behouden niet worden ondermijnd; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 38c.1.d
    text: |-
      door de uitbesteding geen afbreuk wordt gedaan aan de naleving van voorschriften verbonden aan de vergunning als
      bedoeld in [artikel 2:96 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 38c.2
    text: |-
      Het eerste lid, aanhef en onderdeel a, is niet van toepassing op banken die een vergunning hebben als bedoeld in
      [artikel 2:11 van de wet][ref1] en in Nederland beleggingsdiensten mogen verlenen of beleggingsactiviteiten mogen
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 38d.1
    text: |-
      Een beleggingsonderneming die werkzaamheden uitbesteedt aan een derde legt de wederzijdse rechten en verplichtingen
      vast in een schriftelijke overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2
    text: 'De beleggingsonderneming draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2.a
    text: |-
      de derde over de deskundigheid, de capaciteit en elke bij wet vereiste vergunning beschikt om de uitbestede
      werkzaamheden op betrouwbare en professionele wijze uit te voeren;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2.b
    text: |-
      de derde de uitbestede werkzaamheden efficiënt verricht en dat zij methoden vaststelt om het prestatieniveau van de
      derde te beoordelen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2.c
    text: |-
      de derde de uitvoering van de uitbestede werkzaamheden afdoende controleert en de daaraan verbonden risico´s op
      adequate wijze beheerst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2.d
    text: |-
      zij passende actie onderneemt indien blijkt dat de derde de werkzaamheden niet efficiënt en met inachtneming van de
      wettelijke voorschriften uitvoert;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2.e
    text: zij de nodige deskundigheid behoudt om een doeltreffend controle op de uitbestede werkzaamheden uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2.f
    text: |-
      de derde haar in kennis stelt van elke ontwikkeling die van wezenlijke invloed kan zijn op zijn vermogen om de
      uitbestede werkzaamheden efficiënt en met inachtneming van de wettelijke voorschriften uit te voeren;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2.g
    text: |-
      zij de uitbestedingsovereenkomst indien nodig kan beëindigen zonder dat dit nadelige gevolgen heeft voor de
      continuïteit of de kwaliteit van haar dienstverlening aan cliënten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2.h
    text: de derde met betrekking tot de uitbestede werkzaamheden medewerking verleent aan de toezichthouders;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2.i
    text: |-
      zij, haar accountants en de toezichthouders toegang hebben tot de gegevens over de uitbestede werkzaamheden en dat
      de toezichthouders bij de derde een onderzoek ter plaatse kunnen doen of laten doen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2.j
    text: de derde alle vertrouwelijke informatie over haar en haar cliënten beschermt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.2.k
    text: |-
      zij en de derde over een noodplan beschikken dat voorziet in calamiteitenbeheersing en in een periodieke controle
      van de noodvoorzieningen wanneer dit noodzakelijk is gelet op de uitbestede werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.3
    text: |-
      De toezichthouders maken slechts gebruik van de mogelijkheid, bedoeld in het tweede lid, onderdeel i, om bij de
      derde een onderzoek ter plaatse te doen of te laten doen, indien niet op andere wijze kan worden vastgesteld dat
      ten aanzien van de uitbestede werkzaamheden wordt voldaan aan het bij of krachtens de wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
  - number: 38d.4
    text: |-
      Het eerste, tweede en derde lid, onderdelen a, b, d, e en g zijn niet van toepassing op banken die een vergunning
      hebben als bedoeld in [artikel 2:11 van de wet][ref1] en in Nederland beleggingsdiensten mogen verlenen of
      beleggingsactiviteiten mogen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 38e.1
    text: |-
      Een beleggingsonderneming die het beheren van een individueel vermogen van een niet-professionele belegger
      uitbesteedt aan een derde in een staat die geen lidstaat is, draagt er, onverminderd de [artikelen 38b][ref1] en
      [38c][ref2], zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel38c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 38b
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 38c
        hoofdstuk: '6'
  - number: 38e.1.a
    text: |-
      de derde in de staat van herkomst voor het beheren van individueel vermogen een vergunning heeft of in een register
      is ingeschreven en onder prudentieel toezicht staat; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38e
  - number: 38e.1.b
    text: |-
      er een samenwerkingsovereenkomst is gesloten tussen de toezichthouders en de toezichthoudende instantie van de
      staat die geen lidstaat is.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38e
  - number: 38e.2
    text: |-
      Indien niet wordt voldaan aan het eerste lid, kan de beleggingsonderneming de betreffende werkzaamheden uitbesteden
      indien zij de Autoriteit Financiële Markten vooraf in kennis stelt van de uitbestedingsovereenkomst en deze binnen
      een redelijke termijn geen bezwaar maakt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38e
  - number: 38e.3
    text: |-
      De Autoriteit Financiële Markten stelt beleidsregels vast met betrekking tot de gevallen waarin zij geen bezwaar
      zal aantekenen in de zin van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38e
  - number: 38e.4
    text: |-
      De Autoriteit Financiële Markten maakt een lijst bekend van toezichthoudende instanties in staten die geen lidstaat
      zijn met wie zij een samenwerkingsovereenkomst als bedoeld in het eerste lid, onderdeel b, heeft gesloten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38e
  - number: 38f
    text: |-
      Een betaalinstelling besteedt de taken en werkzaamheden van personen die het dagelijks beleid bepalen, daaronder
      mede verstaan het vaststellen van het beleid en het afleggen van verantwoording over het gevoerde beleid, niet uit.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38f
  - number: 38g
    text: |-
      Een betaalinstelling als bedoeld in [artikel 38f][ref1] gaat niet over tot het uitbesteden van werkzaamheden indien
      dat afbreuk doet aan de kwaliteit van de interne controle van de betaalinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel38f
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 38f
        hoofdstuk: '6'
  - number: 38h
    text: |-
      Indien een betaalinstelling voornemens is werkzaamheden in verband met het verlenen van betaaldiensten uit te
      besteden, stelt zij de toezichthouder daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38h
  - number: 38i
    text: |-
      Bij de uitbesteding van werkzaamheden in verband met het verlenen van betaaldiensten draagt de betaalinstelling er
      zorg voor dat uitbesteding de verplichtingen van de betaalinstelling jegens haar cliënten en de rechten van haar
      cliënten uit hoofde van de [wet][ref1] of [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref2] niet wijzigt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38i
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0005290
  - number: 38j.1
    text: |-
      De [artikelen 37][ref1], [38f][ref2], [38g][ref3] en [38i][ref4] zijn slechts van toepassing op het uitbesteden van
      werkzaamheden door betaalinstellingen voor zover het belangrijke werkzaamheden betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel38f
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel38g
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel38i
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '37'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 38f
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 38g
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: 38i
        hoofdstuk: '6'
  - number: 38j.2
    text: |-
      Een werkzaamheid wordt als belangrijk aangemerkt indien een gebrekkige of tekortschietende uitvoering
      ervan wezenlijk afbreuk zou doen aan de naleving door de betaalinstelling van de vergunningsvereisten,
      als bedoeld in [artikel 2:3b van de wet][ref1], of van andere verplichtingen ingevolge de [wet][ref2] of
      [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref3], dan wel aan haar financiële resultaten of de soliditeit of
      continuïteit van haar betaaldiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368
      [ref3]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
      - id: ref3
        bwb_id: BWBR0005290
  - number: 38k
    text: |-
      Indien een premiepensioeninstelling of pensioenbewaarder in het kader van het beheer van een pensioenvermogen
      onderscheidenlijk in het kader van de bewaring van een pensioenvermogen een of meer werkzaamheden uitbesteedt:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38k
  - number: 38k.a
    text: |-
      is de derde op ieder door de premiepensioeninstelling of de pensioenbewaarder gewenst moment in staat
      verantwoording af te leggen over de door hem uitgevoerde werkzaamheden en de premiepensioeninstelling of de
      pensioenbewaarder daar inzicht in te bieden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38k
  - number: 38k.b
    text: |-
      kan de premiepensioeninstelling of de pensioenbewaarder te allen tijde instructies omtrent de uitvoering van de
      werkzaamheden geven aan de derde en kan hij de uitbesteding met onmiddellijke ingang beëindigen indien dit in het
      belang van de pensioendeelnemers is; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38k
  - number: 38k.c
    text: |-
      is de derde, gelet op de aard van de opdracht, aantoonbaar in staat om de opdracht in overeenstemming met de wet
      te vervullen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel38k
  - number: '39'
    text: |-
      Een beleggingsonderneming of financiëledienstverlener als bedoeld in [artikel 4:17, eerste lid, van de wet][ref1]
      stelt aan alle personen die binnen haar onderscheidenlijk zijn onderneming betrokken zijn bij de afhandeling
      van klachten van cliënten of consumenten over financiële diensten of financiële producten van de financiële
      onderneming, een beschrijving beschikbaar van de te volgen procedure voor de afhandeling van die klachten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '40'
    text: |-
      Met het oog op een adequate behandeling van klachten van cliënten of consumenten over financiële
      diensten of financiële producten van een beleggingsonderneming of financiëledienstverlener als bedoeld in
      [artikel 4:17, eerste lid, van de wet][ref1], beschikt de beleggingsonderneming of de financiëledienstverlener over
      een behoorlijke administratie van die klachten, waarin ten minste worden vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 40.a
    text: de naam en het adres van de cliënt of consument die een klacht heeft ingediend;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel40
  - number: 40.b
    text: de klacht, met de daarbij behorende dagtekening van ontvangst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel40
  - number: 40.c
    text: een omschrijving van de klacht; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel40
  - number: 40.d
    text: een beschrijving van de wijze waarop de financiële onderneming de klacht heeft behandeld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel40
  - number: '41'
    text: |-
      Een beleggingsonderneming of financiëledienstverlener als bedoeld in [artikel 4:17, eerste lid, van de wet][ref1]
      bewaart de gegevens, bedoeld in [artikel 40][ref2], gedurende een periode van ten minste een jaar nadat de klacht
      door haar onderscheidenlijk hem is afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel40
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '40'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '42.1'
    text: |-
      Een beheerder als bedoeld in [artikel 4:17, eerste lid, van de wet][ref1] voorziet in procedures en maatregelen
      die waarborgen dat klachten van deelnemers in door hem beheerde beleggingsinstellingen zorgvuldig, verifieerbaar,
      consistent en binnen een redelijke termijn worden afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '42.2'
    text: |-
      Een betaaldienstverlener voorziet in procedures en maatregelen die waarborgen dat klachten van cliënten over het
      verlenen van betaaldiensten door deze betaaldienstverlener, zorgvuldig, verifieerbaar, consistent en binnen een
      redelijke termijn worden afgehandeld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel42
  - number: '43.1'
    text: |-
      Onze Minister erkent een geschilleninstantie als bedoeld in
      [artikel 4:17, eerste lid, onderdeel b, van de wet][ref1] op aanvraag, indien de aanvrager heeft aangetoond te
      kunnen voldoen aan de [artikelen 44 tot en met 48][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel44
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '44'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '43.2'
    text: |-
      Onze Minister beslist op een aanvraag om erkenning binnen vier maanden nadat de aanvraag is ingediend. De
      beslissingstermijn kan ten hoogste tweemaal met twee maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
  - number: '43.3'
    text: Onze Minister kan aan een erkenning voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
  - number: '43.4'
    text: |-
      Een erkende geschilleninstantie verstrekt aan Onze Minister binnen een half jaar na afloop van elk kalenderjaar een
      opgave van:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
  - number: 43.4.a
    text: |-
      de in het afgelopen kalenderjaar bij de geschilleninstantie aangesloten betaaldienstverleners en
      financiëledienstverleners; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
  - number: 43.4.b
    text: |-
      een opgave van het aantal in het afgelopen kalenderjaar ingediende en behandelde geschillen, alsmede een algemene
      weergave van de aard van de geschillen en de uitkomst van de geschilbeslechting.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
  - number: '43.5'
    text: |-
      Een erkende geschilleninstantie informeert Onze Minister onverwijld over wijzigingen in het reglement, bedoeld
      in [artikel 45, eerste lid][ref1], en van de samenstelling van het orgaan, bedoeld in [artikel 44][ref2]. Bij
      wijzigingen van de samenstelling van dit orgaan vermeldt de geschilleninstantie de leeftijd, genoten opleiding en
      professionele achtergrond van het betrokken lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel44
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '45'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '44'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '43.6'
    text: |-
      Een erkende geschilleninstantie verstrekt aan Onze Minister op diens verzoek de gegevens die Onze Minister nodig
      heeft voor de uitoefening van diens in deze paragraaf omschreven taken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
  - number: '43.7'
    text: 'Onze Minister kan een erkenning intrekken:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
  - number: 43.7.a
    text: op verzoek van de geschilleninstantie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
  - number: 43.7.b
    text: |-
      indien de gegevens en bescheiden die zijn verstrekt ter verkrijging van de erkenning zodanig onjuist of onvolledig
      blijken, dat de erkenning zou zijn geweigerd, dan wel niet zonder het verbinden van voorschriften zou zijn
      verleend, indien bij de behandeling van de aanvraag de juiste gegevens volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
  - number: 43.7.c
    text: |-
      indien de geschilleninstantie niet voldoet aan het vierde of zesde lid, [artikel 44][ref1], [45][ref2], [46][ref3],
      [47][ref4] of [48][ref5] of een voorschrift, verbonden aan de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0020421#Artikel48
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '44'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '45'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '47'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref5
        bwb_id: BWBR0020421
        artikel: '48'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '43.8'
    text: |-
      Van een beslissing tot erkenning of tot intrekking van de erkenning van een geschilleninstantie wordt door Onze
      Minister mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel43
  - number: '44.1'
    text: |-
      Een erkende geschilleninstantie draagt zorg voor de onafhankelijkheid en deskundigheid van het orgaan dat binnen
      haar organisatie verantwoordelijk is voor de behandeling van het geschil.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel44
  - number: '44.2'
    text: 'De onafhankelijkheid van het orgaan wordt voldoende gewaarborgd indien de leden:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel44
  - number: 44.2.a
    text: |-
      gedurende een jaar voorafgaande aan de aanvaarding van hun functie niet gewerkt hebben voor of enige functie
      bekleed hebben bij een beroepsorganisatie voor betaaldienstverleners of financiëledienstverleners of voor,
      onderscheidenlijk bij een betaaldienstverlener of financiëledienstverlener, ten aanzien van wiens betaaldiensten,
      financiële producten en financiële diensten geschillen ter behandeling aan de geschilleninstantie kunnen worden
      voorgelegd; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel44
  - number: 44.2.b
    text: |-
      vanaf de aanvaarding van hun functie niet werkzaam zijn voor of enige functie bekleden bij een beroepsorganisatie
      voor betaaldienstverleners of financiëledienstverleners, of voor, onderscheidenlijk bij een betaaldienstverlener
      of financiëledienstverlener, ten aanzien van wiens betaaldiensten, financiële producten en financiële diensten
      geschillen ter behandeling aan de geschilleninstantie kunnen worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel44
  - number: '44.3'
    text: |-
      Ter waarborging van de deskundigheid van het orgaan bezit in ieder geval de voorzitter van het orgaan de
      hoedanigheid van meester in de rechten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel44
  - number: '44.4'
    text: De bij de benoeming van een lid van het orgaan te volgen procedure is schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel44
  - number: '45.1'
    text: |-
      Een erkende geschilleninstantie beschikt over en handelt in overeenstemming met een reglement voor de behandeling
      van geschillen dat ten minste omvat:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.a
    text: |-
      een duidelijke omschrijving van de geschillen die ter behandeling aan de geschilleninstantie kunnen worden
      voorgelegd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.b
    text: |-
      regels met betrekking tot het aanhangig maken van een geschil en een duidelijke omschrijving van de partijen die
      een geschil aanhangig kunnen maken;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.c
    text: |-
      indien de mogelijkheid daartoe wordt geboden: de regels met betrekking tot wraking van een lid van het orgaan,
      bedoeld in [artikel 44, eerste lid][ref1], door partijen, op grond van feiten of omstandigheden die een onpartijdig
      of onafhankelijk oordeel van dat lid zouden bemoeilijken;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel44
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '44'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 45.1.d
    text: regels met betrekking tot de behandeling van een geschil door de geschilleninstantie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.e
    text: |-
      regels met betrekking tot het op voet van gelijkheid bieden van gelegenheid aan partijen om mondeling en
      schriftelijk, desgewenst met bijstand van derden, hun mening aan de geschilleninstantie kenbaar te maken;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.f
    text: regels met betrekking tot de voorwaarden waaronder een deskundige kan worden verzocht een advies uit te brengen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.g
    text: |-
      regels met betrekking tot de voorwaarden waaronder getuigen en deskundigen kunnen worden gehoord, dan wel
      inlichtingen van hen kunnen worden ingewonnen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.h
    text: |-
      regels met betrekking tot de mogelijkheid voor partijen om van alle door hen naar voren gebrachte feiten en
      stellingen, alsmede van verklaringen van getuigen en deskundigen, over en weer kennis te nemen en daarop te
      reageren;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.i
    text: |-
      regels met betrekking tot de voorwaarden waaronder een geschil door middel van een verkorte schriftelijke procedure
      of een voorlopig oordeel kan worden afgedaan;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.j
    text: regels met betrekking tot het soort regels waarop de geschilleninstantie haar beslissingen baseert;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.k
    text: regels met betrekking tot de mogelijkheid dat de beslechting van een geschil resulteert in een niet-bindend advies;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.l
    text: |-
      de bepaling dat de beslechting van een geschil slechts resulteert in een bindend advies indien de
      betaaldienstverlener of financiële dienstverlener daarmee uitdrukkelijk vooraf heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.m
    text: |-
      regels met betrekking tot de vaststelling van de hoogte van het bedrag dat, zo dit verschuldigd is, bij het
      aanhangig maken van het geschil dient te worden voldaan;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.n
    text: |-
      regels met betrekking tot de mogelijkheid om partijen in de kosten van de behandeling van een geschil te
      veroordelen en vaststelling van een hierbij geldend maximumbedrag;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.o
    text: |-
      regels met betrekking tot de vorm, inhoud en bekendmaking van de uitkomst van het advies, bedoeld in de onderdelen
      k en l, waarbij in ieder geval is bepaald dat deze uitkomst, met redenen omkleed, ondertekend en schriftelijk aan
      partijen wordt medegedeeld; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: 45.1.p
    text: |-
      indien beroep tegen een uitspraak mogelijk is, de regels met betrekking tot het mededelen van de mogelijkheid van
      beroep, de wijze en termijn van het instellen, alsmede de behandeling van dit beroep.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: '45.2'
    text: |-
      Een erkende geschilleninstantie houdt het reglement, bedoeld in het eerste lid, beschikbaar en verstrekt het
      kosteloos op verzoek aan iedere belanghebbende.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel45
  - number: '46'
    text: |-
      Een erkende geschilleninstantie draagt er zorg voor dat de kosten voor het aanhangig maken van een geschil zodanig
      beperkt blijven dat de toegang tot de geschilleninstantie niet onredelijk wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel46
  - number: '47'
    text: |-
      Een erkende geschilleninstantie draagt er zorg voor dat de behandeling van een geschil binnen een redelijke termijn
      wordt voltooid.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel47
  - number: '48'
    text: |-
      Een erkende geschilleninstantie stelt aan een betaaldienstverlener of financiëledienstverlener die zich bij haar
      wil aansluiten niet als voorwaarde voor aansluiting dat de betaaldienstverlener of financiëledienstverlener andere
      regels naleeft dan die welke betrekking hebben op het aanhangig maken van een geschil bij de geschilleninstantie of
      de verdere behandeling van een geschil door de geschilleninstantie.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel48
  - number: '49.1'
    text: |-
      Een financiële onderneming verstrekt de ingevolge deze afdeling en de [artikelen 4:72, eerste lid][ref1], en
      [4:73, eerste lid, van de wet][ref2] aan de consument of cliënt te verstrekken informatie schriftelijk, tenzij
      in deze afdeling anders wordt bepaald. De financiële onderneming kan de informatie via een andere duurzame drager
      verstrekken, indien zij zich ervan heeft vergewist dat de consument onderscheidenlijk cliënt over de benodigde
      middelen beschikt om kennis te nemen van de aldus te verstrekken informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '49.2'
    text: |-
      De financiële onderneming verstrekt de informatie, bedoeld in het eerste lid, in de Nederlandse taal. De informatie
      kan in een andere taal worden verstrekt:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49
  - number: 49.2.a
    text: indien de consument of cliënt daarom verzoekt en de financiële onderneming hiermee heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49
  - number: 49.2.b
    text: |-
      indien partijen een keuze hebben gemaakt voor de toepasselijkheid van het recht van een andere staat op de
      overeenkomst inzake een financieel product; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49
  - number: 49.2.c
    text: |-
      indien het een financiële bijsluiter met betrekking tot rechten van deelneming in een beleggingsinstelling betreft
      en de Autoriteit Financiële Markten op verzoek van de beheerder daarmee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49
  - number: '49.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op het verstrekken van informatie met betrekking tot het verlenen
      van beleggingsdiensten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49
  - number: 49a.1
    text: |-
      Een beleggingsonderneming verstrekt de ingevolge deze afdeling en de [artikelen 4:20, derde lid][ref1],
      [4:90b, derde en achtste lid][ref2], en [artikel 4:90c, derde lid, van de wet][ref3] aan de cliënt te verstrekken
      informatie schriftelijk, tenzij in deze afdeling of die artikelen anders wordt bepaald. De beleggingsonderneming
      kan na toestemming van de cliënt, de informatie op een andere duurzame drager verstrekken, indien dat past in de
      context waarin zij met de cliënt zaken doet.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 49a.2
    text: |-
      Een beleggingsonderneming kan, na toestemming van de cliënt, de op grond van de
      [artikelen 58a tot en met 58e][ref1] en 59a te verschaffen informatie die niet persoonlijk tot de cliënt is gericht
      via haar website verstrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel58a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 58a
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 49a.2.a
    text: het gebruik van de website past in de context waarin zij met de cliënt zaken doet;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49a
  - number: 49a.2.b
    text: |-
      de cliënt elektronisch op de hoogte wordt gesteld van het adres van de website en de plaats op de website waar de
      informatie kan worden verkregen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49a
  - number: 49a.2.c
    text: de informatie actueel is en, zolang dat voor de cliënt van belang is, op de website toegankelijk blijft.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49a
  - number: 49a.3
    text: |-
      De verstrekking van informatie door de beleggingsonderneming aan de cliënt via elektronische mededelingen past in
      de context waarin de beleggingsonderneming met de cliënt zaken doet, indien is bewezen dat de cliënt regelmatig
      toegang heeft tot internet. Het gegeven dat de cliënt een e-mailadres opgeeft om zaken te kunnen doen geldt in
      ieder geval als bewijs hiervan.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49a
  - number: 49b
    text: |-
      Een cliënt die als niet-professionele belegger is gekwalificeerd, kan door een beleggingsonderneming
      op schriftelijk verzoek als professionele belegger worden behandeld indien is voldaan aan het in
      [artikel 4:18c van de wet][ref1] bepaalde, en:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 49b.a
    text: |-
      de beleggingsonderneming de cliënt schriftelijk waarschuwt voor het lagere beschermingsniveau en het niet van
      toepassing zijn van het beleggerscompensatiestelsel; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49b
  - number: 49b.b
    text: |-
      de cliënt in een afzonderlijk document bevestigt dat hij zich bewust is van de gevolgen die aan het lagere
      beschermingsniveau verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel49b
  - number: '50.1'
    text: 'Een beheerder houdt de volgende gegevens beschikbaar op zijn website:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
  - number: 50.1.a
    text: |-
      de gegevens omtrent hemzelf, de door hem beheerde beleggingsinstellingen en de bewaarders die aan de
      beleggingsinstellingen zijn verbonden welke ingevolge enig wettelijk voorschrift in het handelsregister moeten
      worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
  - number: 50.1.b
    text: |-
      de overeenkomst, bedoeld in [artikel 4:43, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 50.1.c
    text: zijn vergunning; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
  - number: 50.1.d
    text: |-
      elk door de Autoriteit Financiële Markten genomen geldend besluit tot ontheffing van het ingevolge deze wet
      bepaalde met betrekking tot hemzelf, de door hem beheerde beleggingsinstellingen en de eventueel daaraan verbonden
      bewaarder.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
  - number: '50.2'
    text: |-
      Een beheerder publiceert ten behoeve van de deelnemers in een door hem beheerde beleggingsinstelling maandelijks
      een opgave met toelichting van de hierna te noemen gegevens op zijn website, waarbij tussen de tijdstippen van
      opstelling een periode van ten minste een week ligt. De opgave is, indien van toepassing, mede door de bewaarder
      ondertekend en bevat ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
  - number: 50.2.a
    text: de totale waarde van de beleggingen van de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
  - number: 50.2.b
    text: een overzicht van de samenstelling van de beleggingen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
  - number: 50.2.c
    text: het aantal uitstaande rechten van deelneming; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
  - number: 50.2.d
    text: |-
      voorzover het betreft een beleggingsinstelling waarvan de rechten van deelneming op verzoek van de deelnemers ten
      laste van de activa direct of indirect worden ingekocht of terugbetaald: de meest recente bepaalde intrinsieke
      waarde van de rechten van deelneming, onder vermelding van het moment waarop de bepaling van de intrinsieke waarde
      plaatsvond.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
  - number: '50.3'
    text: |-
      Een beleggingsinstelling met zetel in een aangewezen staat waarvan de rechten van deelneming op verzoek van de
      deelnemers ten laste van de activa direct of indirect worden ingekocht of terugbetaald, deelt desgevraagd aan ieder
      de intrinsieke waarde van de rechten van deelneming mee. De intrinsieke waarde wordt bepaald op het meest recente
      moment van in- en uittreden van deelnemers in de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
  - number: '50.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op beheerders van instellingen voor collectieve belegging
      in effecten met zetel in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50
  - number: 50a
    text: |-
      Een financiële onderneming maakt een beschrijving van haar beleid inzake beloningen openbaar. De Autoriteit
      Financiële Markten kan regels stellen met betrekking tot de inhoud en de wijze van openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel50a
  - number: '51.1'
    text: |-
      Een beleggingsonderneming of kredietinstelling deelt aan een ieder die een gerechtvaardigd belang heeft op verzoek
      mede aan welke systemen als bedoeld in [artikel 212a van de Faillissementswet][ref1] de beleggingsonderneming
      onderscheidenlijk de kredietinstelling deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
  - number: '51.2'
    text: |-
      Een beleggingsonderneming of kredietinstelling verstrekt aan een ieder die een gerechtvaardigd belang
      heeft op verzoek informatie over de belangrijkste regels die gelden voor de werking van de systemen bedoeld
      in [artikel 212a van de Faillissementswet][ref1], waaraan de beleggingsonderneming onderscheidenlijk de
      kredietinstelling deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
  - number: '51.3'
    text: Het eerste en tweede lid zijn niet van toepassing op beleggingsondernemingen met zetel in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51
  - number: 51a.1
    text: 'De door een beleggingsonderneming aan een niet-professionele belegger verstrekte informatie:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.1.a
    text: bevat de naam van de beleggingsonderneming;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.1.b
    text: |-
      is accuraat en wijst niet op de mogelijke voordelen van een beleggingsdienst of financieel instrument zonder dat
      ook een correcte en duidelijke indicatie van de mogelijke risico´s wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.1.c
    text: |-
      is toereikend en door de presentatie ervan te begrijpen voor het gemiddelde lid van de groep tot wie zij is
      gericht; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.1.d
    text: geeft belangrijke zaken, vermeldingen of waarschuwingen niet verhuld of afgezwakt weer.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.2
    text: |-
      Indien in de informatie beleggingsdiensten, nevendiensten, personen die deze diensten verrichten of financiële
      instrumenten onderling worden vergeleken:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.2.a
    text: is de vergelijking zinvol en op correcte en evenwichtige wijze voorgesteld;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.2.b
    text: worden de voor de vergelijking gebruikte informatiebronnen vermeld; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.2.c
    text: worden de voornaamste voor de vergelijking gebruikte feiten en aannames vermeld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.3
    text: |-
      Indien de informatie een indicatie bevat van de resultaten die in het verleden met een financieel instrument, een
      financiële index of een beleggingsdienst zijn behaald:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.3.a
    text: vormt deze indicatie niet het meest opvallende kenmerk van de mededeling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.3.b
    text: |-
      bevat de informatie passende gegevens over de resultaten over de onmiddellijk voorafgaande vijf jaar of over
      de gehele periode waarin het financiële instrument is aangeboden, de financiële index is vastgesteld of de
      beleggingsdienst is verleend, indien deze periode korter is dan vijf jaar, dan wel over een door de onderneming
      gekozen langere periode waarbij altijd wordt uitgegaan van volledige perioden van twaalf maanden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.3.c
    text: worden de referentieperiode en de informatiebron duidelijk aangegeven;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.3.d
    text: |-
      wordt in de informatie duidelijk gewaarschuwd dat het om resultaten uit het verleden gaat en dat deze geen
      betrouwbare indicator vormen voor toekomstige resultaten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.3.e
    text: |-
      wordt, indien de indicatie berust op gegevens die in een andere valuta luiden dan die van de lidstaat waarin
      de niet-professionele belegger woonachtig is, de desbetreffende valuta duidelijk vermeld en wordt tegelijk
      gewaarschuwd dat het rendement door valutaschommelingen hoger of lager kan uitvallen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.3.f
    text: |-
      wordt indien de indicatie op brutoresultaten berust, het effect van provisies, vergoedingen en andere lasten
      vermeld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.4
    text: |-
      Indien de informatie fictieve, in het verleden behaalde resultaten bevat of daarnaar verwijst, heeft deze
      betrekking op een financieel instrument of een financiële index, en:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.4.a
    text: |-
      berusten de fictieve, in het verleden behaalde resultaten op de feitelijke resultaten die in het verleden zijn
      behaald met een of meer financiële instrumenten of financiële indices die identiek zijn aan of de onderliggende
      waarde vormen van het betrokken financiële instrument;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.4.b
    text: |-
      is op de onder a bedoelde feitelijke resultaten die in het verleden zijn behaald, het derde lid, onderdelen a, b,
      c, e en f van overeenkomstige toepassing; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.4.c
    text: |-
      wordt in de informatie duidelijk gewaarschuwd dat het om fictieve, in het verleden behaalde resultaten gaat en dat
      in het verleden behaalde resultaten geen betrouwbare indicator vormen voor toekomstige resultaten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.5
    text: 'Indien de informatie gegevens over toekomstige resultaten bevat:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.5.a
    text: wordt niet uitgegaan van of verwezen naar fictieve in het verleden behaalde resultaten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.5.b
    text: wordt uitgegaan van redelijke aannames die worden ondersteund door objectieve gegevens;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.5.c
    text: |-
      wordt het effect van provisies, vergoedingen en andere lasten vermeld indien de informatie op brutoresultaten
      berust; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.5.d
    text: |-
      wordt duidelijk gewaarschuwd dat dergelijke prognoses geen betrouwbare indicator vormen voor toekomstige
      resultaten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.6
    text: |-
      Indien de informatie verwijst naar een bepaalde fiscale behandeling, wordt duidelijk vermeld dat deze behandeling
      afhangt van de individuele omstandigheden van de cliënt en in de toekomst aan wijzigingen onderhevig kan zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: 51a.7
    text: |-
      In de informatie wordt de naam van de toezichthouder niet zodanig gebruikt dat daarmee wordt beweerd of
      gesuggereerd dat deze de producten of diensten van de beleggingsonderneming steunt of aanbeveelt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel51a
  - number: '52.1'
    text: |-
      Indien een financiële onderneming in een reclame-uiting, anders dan via de televisie of de radio, informatie
      verstrekt over een complex product, verstrekt zij daarbij informatie over de belangrijkste financiële risico’s
      van dat product, die onder meer inzichtelijk worden gemaakt door een risico-indicator en, indien het een
      beleggingsobject betreft, de belangrijkste overige risico’s die samenhangen met dat product.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel52
  - number: '52.2'
    text: |-
      Indien een financiële onderneming in een reclame-uiting via de televisie informatie verstrekt over een complex
      product, verstrekt zij daarbij informatie over de belangrijkste financiële risico’s van dat product door het
      weergeven van een risico-indicator en, indien het een beleggingsobject betreft, de belangrijkste overige risico’s
      die samenhangen met dat product.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel52
  - number: '52.3'
    text: |-
      Indien een financiële onderneming in een reclame-uiting via de radio informatie verstrekt over een complex product,
      verstrekt zij daarbij informatie over de belangrijkste financiële risico’s van dat product en, indien het een
      beleggingsobject betreft, de belangrijkste overige risico’s die samenhangen met dat product.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel52
  - number: '52.4'
    text: |-
      Indien een financiële onderneming voorafgaand aan de totstandkoming van een overeenkomst inzake een complex product
      informatie verstrekt over dat product, verwijst zij daarbij naar de financiële bijsluiter of, indien het rechten
      van deelneming in een instelling voor collectieve belegging in effecten met zetel in een andere lidstaat betreft,
      naar het vereenvoudigd prospectus, bedoeld in artikel 27, eerste lid, van de richtlijn beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel52
  - number: '52.5'
    text: |-
      Indien een financiële onderneming voorafgaand aan de totstandkoming van een overeenkomst inzake een complex
      product, anders dan in een reclame-uiting via de televisie of de radio, informatie verstrekt over een historisch of
      toekomstig rendement, verstrekt zij daarbij informatie over de belangrijkste kosten en de belangrijkste financiële
      risico’s van dat product en, indien het een beleggingsobject betreft, over de belangrijkste overige risico’s die
      samenhangen met dat product.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel52
  - number: '52.6'
    text: |-
      Indien een financiële onderneming in een reclame-uiting via de televisie of de radio informatie verstrekt over
      een historisch of toekomstig rendement van een complex product, verstrekt zij daarbij of op enig ander moment
      voorafgaande aan de totstandkoming van een overeenkomst inzake dat product informatie over de belangrijkste kosten
      van dat product.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel52
  - number: '52.7'
    text: |-
      Indien een financiële onderneming voorafgaande aan de totstandkoming van een overeenkomst inzake een complex
      product informatie verstrekt over een gegarandeerd rendement, verstrekt zij daarbij of, indien de informatie wordt
      verstrekt in een reclame-uiting, op enig ander moment voorafgaande aan de totstandkoming van de overeenkomst inzake
      dat product, informatie over de belangrijkste voorwaarden van die garantie.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel52
  - number: '52.8'
    text: |-
      [Artikel 49, eerste lid, eerste volzin][ref1], is niet van toepassing op het verstrekken van informatie in een
      reclame-uiting als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel49
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
  - number: '52.9'
    text: |-
      Het eerste tot en met achtste lid zijn niet van toepassing indien het een complex product betreft, niet zijnde
      een recht van deelneming in een beleggingsinstelling, ten aanzien waarvan uitsluitend financiële diensten worden
      verleend aan personen die handelen in de uitoefening van hun bedrijf of beroep.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel52
  - number: '52.10'
    text: |-
      Het eerste lid, met uitzondering van de verplichting om een risico-indicator te verstrekken, en het derde tot
      en met zevende lid, zijn niet van toepassing op beleggingsondernemingen voor zover zij beleggingsdiensten of
      nevendiensten verlenen met betrekking tot deelnemingsrechten in beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel52
  - number: '53.1'
    text: |-
      Indien een financiële onderneming in een reclame-uiting over krediet melding maakt van een debetrentevoet of andere
      gegevens betreffende de kosten van een krediet, verstrekt zij daarbij tevens informatie over:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.1.a
    text: de vaste of variabele debetrentevoet en de andere kosten die deel uitmaken van de totale kosten van het krediet;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.1.b
    text: het totale kredietbedrag;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.1.c
    text: het jaarlijks kostenpercentage; en, indien van toepassing,
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.1.d
    text: de duur van de kredietovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.1.e
    text: |-
      in geval van goederenkrediet, de contante waarde en contante betalingen, genoemd in de definitie van kredietsom
      in [artikel 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 53.1.f
    text: het totale door de consument te betalen bedrag; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.1.g
    text: het termijnbedrag.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: '53.2'
    text: |-
      Indien het sluiten van een overeenkomst voor een nevendienst verplicht is om het krediet op de in de reclame-uiting
      genoemde voorwaarden te verkrijgen, en de kosten voor die nevendienst vooraf niet kunnen worden bepaald, wordt de
      verplichting tot het sluiten van die overeenkomst op een duidelijke, beknopte en opvallende wijze, tezamen met het
      jaarlijks kostenpercentage vermeld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: '53.3'
    text: |-
      De informatie, bedoeld in het eerste lid, heeft alleen betrekking op kredieten die representatief zijn voor de
      kredieten die feitelijk door de financiële onderneming worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: '53.4'
    text: |-
      Een financiële onderneming geeft de informatie, bedoeld in het eerste lid, en de vermelding, bedoeld in het
      tweede lid, indien deze wordt verstrekt in een reclame-uiting over krediet, anders dan via de televisie of radio,
      gecombineerd weer in een tabel waarin geen andere informatie wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: '53.5'
    text: |-
      Indien een financiële onderneming in een reclame-uiting over krediet reclame maakt voor met krediet aan te schaffen
      goederen of diensten, verstrekt zij daarbij de informatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: '53.6'
    text: |-
      Indien een reclame-uiting betrekking heeft op een krediet met een debetrentevoet die voor een beperkte duur of
      een beperkt deel van het krediet geldt, wordt bij het verstrekken van de informatie, bedoeld in het eerste lid,
      onderdeel a, de hoogste debetrentevoet in aanmerking genomen. Bij een krediet met een variabele debetrentevoet die
      voor beperkte duur of een beperkt deel van het krediet afwijkt van de variabele debetrentevoet die op het moment
      van het doen van de reclame-uiting geldt voor overeenkomsten over krediet van gelijke soort, omvang en duur, wordt
      bij het verstrekken van de informatie, bedoeld in het eerste lid, onderdeel a, de hoogste van genoemde variabele
      debetrentevoeten genoemd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: '53.7'
    text: |-
      Een financiële onderneming neemt in een reclame-uiting over krediet een waarschuwing op met betrekking tot de
      gevolgen die aan het krediet zijn verbonden, tenzij het een reclame-uiting voor hypothecair krediet betreft waarbij
      geen relatie met een ander bestedingsdoel wordt gelegd dan de verwerving van de eigen woning.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: '53.8'
    text: 'Een financiële onderneming:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.8.a
    text: |-
      neemt in een reclame-uiting over krediet geen mededelingen op die gericht zijn op het gemak of de snelheid waarmee
      het krediet wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.8.b
    text: |-
      brengt in een reclame-uiting over krediet niet tot uiting dat lopende overeenkomsten inzake krediet bij de
      beoordeling van een kredietaanvraag geen of een ondergeschikte rol spelen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.8.c
    text: |-
      brengt in een reclame-uiting over krediet niet tot uiting dat met een negatieve uitkomst van de raadpleging van het
      stelsel van kredietregistratie of anderszins in afwijking van de geldende gedragscode toch een krediet kan worden
      verkregen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.8.d
    text: |-
      geeft in een reclame-uiting over krediet geen kenmerken van het krediet weer waarin fiscale voordelen zijn
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: '53.9'
    text: |-
      Indien een financiële onderneming in een reclame-uiting informatie als bedoeld in het eerste of tweede lid
      of informatie over een specifiek product verstrekt over een krediet, verstrekt zij daarbij informatie over de
      verkrijgbaarheid van de informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1]. De eerste volzin is
      niet van toepassing op reclame-uitingen over krediet, voorzover het krediet onderdeel uitmaakt van een complex
      product.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '53.10'
    text: |-
      Indien een financiële onderneming informatie verstrekt over de kenmerken van het krediet, bedoeld in het eerste lid
      en tweede lid, is het vierde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: '53.11'
    text: |-
      [Artikel 49, eerste lid, eerste volzin][ref1], is niet van toepassing op het verstrekken van informatie in een
      reclame-uiting als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel49
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
  - number: '53.12'
    text: |-
      Indien een financiële onderneming in een reclame-uiting over effectenkrediet melding maakt van een debetrentevoet
      of andere gegevens betreffende de kosten van een effectenkrediet, meldt zij tevens:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.12.a
    text: |-
      dat een doorlopend krediet wordt verleend of toegezegd tegen onderpand van financiële instrumenten, en de
      kredietlimiet afhankelijk is van de waarde daarvan;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.12.b
    text: |-
      de vaste of variabele debetrentevoet en de andere kosten die deel uitmaken van de totale kosten van het
      effectenkrediet; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.12.c
    text: |-
      indien een contract voor een nevendienst verplicht is om het effectenkrediet, in voorkomend geval op de
      geadverteerde voorwaarden te verkrijgen, en de kosten van die dienst niet vooraf bepaald kunnen worden, de
      verplichting tot het sluiten van die overeenkomst op een duidelijke, beknopte en opvallende wijze,
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: '53.13'
    text: |-
      Onverminderd het eerste tot en met twaalfde lid meldt een bemiddelaar in krediet in een reclame-uiting over krediet
      tevens dat hij:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.13.a
    text: adviseert op grond van een objectieve analyse;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.13.b
    text: een contractuele verplichting heeft uitsluitend voor een of meer aanbieders te bemiddelen; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: 53.13.c
    text: |-
      geen contractuele verplichting heeft uitsluitend voor een of meer aanbieders te bemiddelen en hij niet adviseert op
      grond van een objectieve analyse.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel53
  - number: '54'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de wijze waarop
      de informatie, bedoeld in de [artikelen 52][ref1] en [53][ref2], wordt gepresenteerd of
      geformuleerd, de wijze van berekening van historische of toekomstige rendementen, kosten en
      risico’s als bedoeld in [artikel 52, eerste, tweede, derde, vijfde en zesde lid][ref3], en
      de wijze van berekening van de kosten van verzekeringen en zekerheidsrechten als bedoeld in
      [53, eerste lid, onderdeel e, en tweede lid, onderdeel b, onder 3°][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel52
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel53
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '52'
        hoofdstuk: '8'
        paragraaf: 8.1.3
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '53'
        hoofdstuk: '8'
        paragraaf: 8.1.3
        afdeling: '8.1'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '52'
        hoofdstuk: '8'
        paragraaf: 8.1.3
        afdeling: '8.1'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '53'
        hoofdstuk: '8'
        paragraaf: 8.1.3
        afdeling: '8.1'
  - number: '55.1'
    text: 'In een reclame-uiting over een beheerder of beleggingsinstelling worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel55
  - number: 55.1.a
    text: de naam van de beheerder of beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel55
  - number: 55.1.b
    text: het feit dat het een beheerder of beleggingsinstelling betreft;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel55
  - number: 55.1.c
    text: |-
      dat de beheerder of de beleggingsinstelling is opgenomen in het register dat wordt gehouden door de Autoriteit
      Financiële Markten; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel55
  - number: 55.1.d
    text: |-
      indien het een instelling voor collectieve belegging in effecten betreft: waar het prospectus, bedoeld in
      [artikel 4:49, eerste lid, van de wet][ref1], verkrijgbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '55.2'
    text: Het eerste lid, onderdelen c en d, is niet van toepassing op reclame-uitingen op radio en televisie.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel55
  - number: '55.3'
    text: |-
      Onverminderd [artikel 52][ref1] wordt in een reclame-uiting anders dan via de televisie of radio over een
      instelling voor collectieve belegging in effecten, indien van toepassing, duidelijk de aandacht gevestigd op het
      feit dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel52
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '52'
        hoofdstuk: '8'
        paragraaf: 8.1.3
        afdeling: '8.1'
  - number: 55.3.a
    text: de instelling voor collectieve belegging in effecten voornamelijk belegt in financiële derivaten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel55
  - number: 55.3.b
    text: de instelling voor collectieve belegging in effecten een aandelen- of obligatie-index volgt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel55
  - number: 55.3.c
    text: |-
      de waarde van de activa van de instelling voor collectieve belegging in effecten als gevolg van het
      beleggingsbeleid sterk kan fluctueren; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel55
  - number: 55.3.d
    text: |-
      aan de instelling voor collectieve belegging in effecten een ontheffing als bedoeld in
      [artikel 136, tweede lid][ref1], is verleend onder vermelding van de staat, het openbaar lichaam of de
      internationale organisatie die de financiële instrumenten, bedoeld in het [artikel 136, tweede lid][ref2], uitgeeft
      of garandeert waarin de instelling voor collectieve belegging in effecten beleggingsinstelling voor meer dan
      vijfendertig procent van het beheerde vermogen belegt.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel136
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '56'
    text: |-
      De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot de vorm van waarschuwingszinnen in
      reclame-uitingen van beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel56
  - number: '57.1'
    text: |-
      Een financiëledienstverlener verstrekt een consument of, indien het een verzekering betreft, cliënt, voorafgaand
      aan de totstandkoming van een overeenkomst inzake een financieel product of financiële dienst ten minste de
      volgende informatie:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel57
  - number: 57.1.a
    text: |-
      zijn naam en adres en, indien de financiëledienstverlener een rechtspersoon is, de statutaire naam en handelsnaam
      of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel57
  - number: 57.1.b
    text: de aard van zijn financiële dienstverlening;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel57
  - number: 57.1.c
    text: |-
      voorzover [artikel 4:17 van de wet][ref1] van toepassing is: zijn interne klachtenprocedure, bedoeld in
      [artikel 4:17, eerste lid, onderdeel a, van de wet][ref2], en de erkende geschilleninstantie waarbij hij is
      aangesloten; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 57.1.d
    text: zijn inschrijving in het door de toezichthouder gehouden register.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel57
  - number: '57.2'
    text: |-
      In afwijking van [artikel 49, eerste lid][ref1], kan de informatie, bedoeld in het eerste lid, en in
      [artikel 4:73, eerste lid, van de wet][ref2], op verzoek van de cliënt mondeling worden verstrekt, indien
      het financiële product een verzekering is en onmiddellijke dekking noodzakelijk is. In dat geval verstrekt de
      financiëledienstverlener de informatie tevens onmiddellijk na de totstandkoming van de overeenkomst overeenkomstig
      [artikel 49, eerste lid][ref3], aan de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel49
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
  - number: '58.1'
    text: |-
      Voorafgaand aan de totstandkoming van een overeenkomst inzake een betalingsbeschermer, complex product, hypothecair
      krediet of uitvaartverzekering verstrekt een bemiddelaar een consument informatie over de hoogte van de provisie,
      de afsluitprovisie, het jaarlijkse bedrag aan doorlopende provisie en het aantal termijnen daarvan die de
      desbetreffende aanbieder rechtstreeks of middellijk zal betalen in verband met de betalingsbeschermer, het complexe
      product, het hypothecair krediet, onderscheidenlijk de uitvaartverzekering.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58
  - number: '58.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op bemiddelaars die complexe producten als bedoeld in
      [artikel 1, onderdeel d, onder 4°][ref1], samenstellen of in de markt verkrijgbaar stellen, voor zover het betreft
      de financiële producten die onderdeel zijn van die complexe producten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '58.3'
    text: |-
      Voorafgaand aan het zonder tussenkomst van een bemiddelaar doen van een voorstel tot het aangaan van een
      overeenkomst inzake een betalingsbeschermer, complex product, hypothecair krediet of uitvaartverzekering, verstrekt
      een aanbieder een consument informatie over het feit dat hij kosten maakt ten behoeve van de distributie met
      inbegrip van het adviseren en dat deze kosten onderdeel uitmaken van de prijs van het product of verwerkt kunnen
      zijn in het rentepercentage, alsmede informatie over de aard en reikwijdte van zijn dienstverlening.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58
  - number: '58.4'
    text: |-
      Het in het eerste tot en met derde lid bepaalde is van overeenkomstige toepassing op bemiddelaars die complexe
      producten als bedoeld in [artikel 1, onderdeel d, onder 4°][ref1], samenstellen of in de markt verkrijgbaar
      stellen en bemiddelen in de financiële producten die onderdeel zijn van die complexe producten. Indien een
      bemiddelaar als bedoeld in de vorige volzin niet kan voldoen aan het tweede lid, verstrekt hij aan de consument de
      in het derde lid bedoelde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '58.5'
    text: |-
      Het eerste tot en met het derde lid zijn niet van toepassing op beleggingsondernemingen voor zover zij
      beleggingsdiensten of nevendiensten verlenen met betrekking tot deelnemingsrechten in beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58
  - number: '58.5'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de wijze waarop de informatie, bedoeld in
      het eerste en derde lid, wordt geformuleerd of gepresenteerd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58
  - number: 58a.1
    text: |-
      Een beleggingsonderneming verstrekt voorafgaand aan het verlenen van een beleggingsdienst of nevendienst aan een
      niet-professionele belegger:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58a
  - number: 58a.1.a
    text: |-
      informatie over de wederzijdse rechten en verplichtingen die voortvloeien uit de overeenkomst met betrekking tot de
      beleggings- of nevendienst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58a
  - number: 58a.1.b
    text: |-
      de in [artikel 58b][ref1] bedoelde informatie over de overeenkomst of de beleggingsdiensten of nevendiensten;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel58b
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 58b
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 58a.1.c
    text: |-
      de overige op grond van de [artikelen 58b tot en met 58e][ref1] vereiste informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel58b
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 58b
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 58a.2
    text: |-
      In afwijking van het eerste lid mag een beleggingsonderneming de informatie bedoeld in het eerste lid verstrekken
      onmiddellijk na aanvang van het verlenen van een beleggingsdienst of nevendienst, indien:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58a
  - number: 58a.2.a
    text: |-
      zij de in het eerste lid genoemde termijnen niet in acht heeft kunnen nemen omdat de overeenkomst op verzoek van de
      niet-professionele belegger is gesloten door middel van een techniek voor communicatie op afstand die haar belet de
      informatie overeenkomstig het eerste lid te leveren; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58a
  - number: 58a.2.b
    text: |-
      de beleggingsonderneming ten aanzien van de niet-professionele belegger voldoet aan [artikel 79, eerste lid][ref1],
      als ware deze belegger een consument en de beleggingsonderneming een financiële dienstverlener.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel79
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '79'
        hoofdstuk: '8'
        paragraaf: 8.1.7
        afdeling: '8.1'
  - number: 58a.3
    text: |-
      Indien een reclame-uiting van een beleggingsonderneming een aanbod bevat om een overeenkomst met betrekking tot
      een financieel instrument of een beleggings- of nevendienst aan te gaan, of de uitnodiging bevat om een dergelijk
      aanbod te doen en vermeldt hoe hierop kan worden gereageerd, wordt daarin tevens de voor het aanbod of de
      uitnodiging van belang zijnde informatie als bedoeld in de [artikelen 58b tot en met 58e][ref1] opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel58b
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 58b
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 58a.4
    text: |-
      Het derde lid is niet van toepassing indien het aanbod of de uitnodiging is gericht tot een niet-professionele
      belegger en deze voor een reactie wordt verwezen naar een ander document of andere documenten die afzonderlijk of
      tezamen deze informatie bevatten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58a
  - number: 58b.1
    text: |-
      De informatie, bedoeld in [artikel 58a, eerste lid, onderdelen b en c][ref1], omvat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel58a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 58a
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 58b.1.a
    text: de naam, het adres en de contactgegevens van de beleggingsonderneming;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.1.b
    text: |-
      de talen waarin de cliënt met de beleggingsonderneming kan communiceren en stukken en andere informatie van haar
      kan ontvangen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.1.c
    text: |-
      methoden van communicatie tussen de beleggingsonderneming en de cliënt, waaronder die betreffende het versturen en
      ontvangen van orders;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.1.d
    text: |-
      een verklaring waarin staat dat de beleggingsonderneming over een vergunning beschikt, alsmede de naam en het
      contactadres van de toezichthouder die de vergunning heeft verleend;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.1.e
    text: |-
      een verklaring dat de beleggingsonderneming door tussenkomst van een verbonden agent beleggingsdiensten verleent en
      in welke lidstaat deze agent in een register staat ingeschreven;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.1.f
    text: |-
      aard, frequentie en tijdschema van de rapporten over de verrichting van de dienst die overeenkomstig de
      [artikelen 69][ref1], [70][ref2], [71][ref3] en [71a][ref4] door de beleggingsonderneming aan de cliënt worden
      toegezonden;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel71a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '69'
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '70'
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '71'
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: 71a
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 58b.1.g
    text: |-
      indien de beleggingsonderneming financiële instrumenten of gelden van cliënten aanhoudt, een korte beschrijving
      van de maatregelen die zij heeft genomen om deze financiële instrumenten of gelden te beschermen, alsmede beknopte
      gegevens over de vangnetregeling die op de onderneming van toepassing is;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.1.h
    text: |-
      een beschrijving, die in beknopte vorm mag worden verstrekt, van het beleid inzake belangenconflicten dat de
      onderneming overeenkomstig [artikel 35a][ref1] voert;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel35a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 35a
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 58b.1.i
    text: indien de cliënt daarom verzoekt, nadere bijzonderheden over het beleid inzake belangenconflicten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.2
    text: |-
      Een beleggingsonderneming stelt bij het beheren van een individueel vermogen op basis van de
      beleggingsdoelstellingen van de cliënt en de soorten financiële instrumenten in de portefeuille van de cliënt, een
      geschikte evaluatie- en vergelijkingsmethode vast, zodat de cliënt de prestaties van de onderneming kan beoordelen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.3
    text: |-
      Een beleggingsonderneming verstrekt bij het beheren van een individueel vermogen van een niet- professionele
      belegger, naast de informatie op grond van het eerste lid, voor zover van toepassing, aan de cliënt informatie
      over:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.3.a
    text: de waarderingsmethode en -frequentie voor de financiële instrumenten in diens portefeuille;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.3.b
    text: |-
      de bijzonderheden van een eventuele overdracht van het beheer op discretionaire basis van alle of een deel van de
      financiële instrumenten of gelden in de portefeuille van de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.3.c
    text: |-
      elke evaluatie- of vergelijkingsmaatstaf, bedoeld in het tweede lid, waartegen de resultaten van de portefeuille
      worden afgezet;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.3.d
    text: |-
      de soorten financiële instrumenten die mogen worden opgenomen in de portefeuille en de soorten transacties die in
      deze instrumenten mogen worden verricht, alsmede de begrenzingen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58b.3.e
    text: |-
      de beheersdoelstellingen, de omvang van het risico dat voortvloeit uit de beoordelingsruimte die de
      beleggingsonderneming heeft, alsmede eventuele specifieke beperkingen in deze beoordelingsruimte.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58b
  - number: 58c.1
    text: |-
      De informatie, bedoeld in [artikel 58a, eerste lid, onderdeel c][ref1], omvat een algemene beschrijving van de aard
      en risico’s van financiële instrumenten die gedetailleerd genoeg is om de niet-professionele belegger in staat te
      stellen een beleggingsbeslissing te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel58a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 58a
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 58c.2
    text: 'De beschrijving van de risico’s, bedoeld in het eerste lid, omvat, indien van toepassing, mede:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58c
  - number: 58c.2.a
    text: |-
      de risico´s die verbonden zijn aan het desbetreffende soort financiële instrument, waaronder een uitleg over de
      hefboomwerking en de gevolgen daarvan en het risico dat de gehele belegging verloren gaat;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58c
  - number: 58c.2.b
    text: |-
      de volatiliteit van de prijs van het desbetreffende soort financiële instrument en eventuele beperkingen in de
      bestaande markt daarvoor;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58c
  - number: 58c.2.c
    text: |-
      het feit dat de cliënt met transacties in dergelijke instrumenten naast de aanschaffingskosten extra financiële- en
      andere verplichtingen, waaronder voorwaardelijke verplichtingen, zou kunnen aangaan;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58c
  - number: 58c.2.d
    text: |-
      eventuele marge- of soortgelijke verplichtingen die van toepassing zijn op het desbetreffende soort financiële
      instrumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58c
  - number: 58c.3
    text: |-
      Een beleggingsonderneming die aan een niet-professionele belegger informatie verstrekt over een financieel
      instrument waarvoor overeenkomstig de richtlijn prospectus een prospectus is gepubliceerd, deelt de cliënt mede
      waar dit prospectus verkrijgbaar is.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58c
  - number: 58c.4
    text: |-
      Indien aangenomen mag worden dat de risico´s die verbonden zijn aan een financieel instrument dat uit twee of
      meer verschillende financiële instrumenten bestaat, groter zijn dan de risico´s die verbonden zijn aan elk van
      de financiële instrumenten afzonderlijk, verstrekt de beleggingsonderneming een adequate beschrijving van de
      verschillende financiële instrumenten waaruit het instrument bestaat en van de risicoverhogende wisselwerking
      daartussen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58c
  - number: 58c.5
    text: |-
      Een beleggingsonderneming verstrekt over een financieel instrument dat een garantie van een derde omvat, aan een
      niet-professionele belegger voldoende bijzonderheden over de garantie en de garantiegever.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58c
  - number: 58c.6
    text: |-
      Een financiële bijsluiter die voldoet aan het ingevolge [artikel 66, tweede en derde lid][ref1], van dit besluit
      bepaalde of een vereenvoudigd prospectus dat voldoet aan artikel 28 van de richtlijn beleggingsinstellingen wordt
      voor de toepassing van [artikel 4:20, eerste lid, van de wet][ref2] met betrekking tot een recht van deelneming in
      een beleggingsinstelling als passende informatie aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '66'
        hoofdstuk: '8'
        paragraaf: 8.1.5
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 58d.1
    text: |-
      De informatie, bedoeld in [artikel 58a, eerste lid, onderdeel c][ref1], omvat, indien van toepassing, gegevens over
      de omstandigheid dat een derde namens de beleggingsonderneming financiële instrumenten of gelden die toebehoren aan
      de niet-professionele belegger kan aanhouden, alsmede gegevens over haar wettelijke verantwoordelijkheid voor het
      handelen of nalaten van de derde en voor de gevolgen die insolventie van de derde voor de cliënt heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel58a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 58a
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 58d.2
    text: |-
      Indien een derde namens een beleggingsonderneming, voor zover het toepasselijke recht dit toelaat, financiële
      instrumenten die toebehoren aan een niet-professionele belegger op een omnibusrekening mag aanhouden, brengt de
      beleggingsonderneming de cliënt daarvan op de hoogte en waarschuwt zij op duidelijke wijze voor de risico’s die
      daaruit voortvloeien.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58d
  - number: 58d.3
    text: |-
      Indien het op grond van het toepasselijke recht niet mogelijk is om door een derde namens een beleggingsonderneming
      aangehouden financiële instrumenten die toebehoren aan een niet-professionele belegger te onderscheiden
      van de financiële instrumenten die toebehoren aan deze derde of de beleggingsonderneming zelf, brengt de
      beleggingsonderneming de cliënt daarvan op de hoogte en waarschuwt zij op duidelijke wijze voor de risico’s die
      daaruit voortvloeien.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58d
  - number: 58d.4
    text: |-
      Indien op een rekening waarop financiële instrumenten of gelden worden aangehouden die aan een niet-
      professionele belegger toebehoren, het recht van toepassing is van een staat die geen lidstaat is, brengt de
      beleggingsonderneming de cliënt daarvan op de hoogte en wijst zij erop dat dit van invloed kan zijn op de rechten
      die aan deze financiële instrumenten of gelden verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58d
  - number: 58d.5
    text: |-
      Een beleggingsonderneming die financiële instrumenten of gelden aanhoudt die toebehoren aan een niet-professionele
      belegger brengt hem op de hoogte van het bestaan en de voorwaarden van zakelijke zekerheidsrechten of voorrechten
      die zij heeft of kan hebben op die financiële instrumenten of gelden, en van haar eventuele recht van verrekening
      op deze financiële instrumenten of gelden. Voor zover van toepassing brengt zij de cliënt er ook van op de hoogte
      dat een bewaarder een zakelijk zekerheidsrecht, een voorrecht of een recht van verrekening op deze instrumenten of
      gelden heeft of kan hebben.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58d
  - number: 58d.6
    text: |-
      Een beleggingsonderneming die financiële instrumenten aanhoudt die toebehoren aan een niet-professionele belegger
      verstrekt, geruime tijd voordat zij effectenfinancieringstransacties aangaat met betrekking tot die financiële
      instrumenten, of van dergelijke financiële instrumenten anderszins voor eigen rekening of voor rekening van een
      andere cliënt gebruikmaakt, de cliënt voorafgaand aan het gebruik van deze instrumenten duidelijke, volledige
      en accurate informatie over haar verplichtingen en verantwoordelijkheden met betrekking tot het gebruik van deze
      financiële instrumenten, met inbegrip van de voorwaarden voor restitutie ervan, alsmede over de risico´s die uit
      dat gebruik voortvloeien.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58d
  - number: 58e.1
    text: |-
      De informatie, bedoeld in [artikel 58a, eerste lid, onderdeel c][ref1], omvat gegevens over de kosten en
      bijbehorende lasten, die voor zover van toepassing bestaat uit de volgende elementen:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel58a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58e
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 58a
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 58e.1.a
    text: |-
      de totale prijs van het financiële instrument, de beleggingsdienst of nevendienst, met inbegrip van alle
      bijbehorende kosten en als geen exacte prijs kan worden gegeven de grondslag voor de berekening van de totale
      prijs.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58e
  - number: 58e.1.b
    text: de door de beleggingsonderneming in rekening gebrachte provisies;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58e
  - number: 58e.1.c
    text: |-
      een vermelding van de desbetreffende buitenlandse valuta en de toepasselijke omrekeningskoers en wisselkosten,
      wanneer een deel van de totale prijs moet worden betaald in of luidt in een buitenlandse valuta;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58e
  - number: 58e.1.d
    text: |-
      vermelding van de mogelijkheid dat transacties die verband houden met het financiële instrument of de
      beleggingsdienst, nog andere kosten, voor de niet-professionele belegger kunnen meebrengen die niet via de
      beleggingsonderneming worden betaald of door haar worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58e
  - number: 58e.1.e
    text: |-
      de regelingen voor betaling of andere prestaties met betrekking tot de uitvoering van de beleggings- of
      nevendienst.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58e
  - number: 58e.2
    text: |-
      Een financiële bijsluiter die voldoet aan het ingevolge [artikel 66, tweede en derde lid][ref1], van dit besluit
      bepaalde of een vereenvoudigd prospectus dat voldoet aan artikel 28 van de richtlijn beleggingsinstellingen wordt
      voor de toepassing van [artikel 4:20, eerste lid, van de wet][ref2] met betrekking tot een recht van deelneming
      in een beleggingsinstelling als passende informatie aangemerkt wat de aan de beleggingsinstelling zelf verbonden
      kosten en bijbehorende lasten, met inbegrip van de instap- en uitstapprovisies, betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58e
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '66'
        hoofdstuk: '8'
        paragraaf: 8.1.5
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 58f.1
    text: |-
      De beleggingsonderneming verstrekt aan een professionele belegger een algemene beschrijving van de aard en risico’s
      van financiële instrumenten die gedetailleerd genoeg is om hem in staat te stellen een beleggingsbeslissing te
      nemen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58f
  - number: 58f.2
    text: |-
      [Artikel 58c, tweede en vierde lid][ref1], zijn van overeenkomstige toepassing op de beschrijving van de aard en
      risico’s bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel58c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 58c
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 58f.3
    text: |-
      Indien op een rekening waarop financiële instrumenten of gelden worden aangehouden die aan een
      professionele belegger toebehoren, het recht van toepassing is van een staat die geen lidstaat is, brengt de
      beleggingsonderneming de cliënt daarvan op de hoogte en wijst zij erop dat dit van invloed kan zijn op de rechten
      die aan deze financiële instrumenten of gelden verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58f
  - number: 58f.4
    text: |-
      Een beleggingsonderneming die financiële instrumenten of gelden aanhoudt die toebehoren aan een professionele
      belegger brengt hem op de hoogte van het bestaan en de voorwaarden van zakelijke zekerheidsrechten of voorrechten
      die zij heeft of kan hebben op die financiële instrumenten of gelden, en van haar eventuele recht van verrekening
      op deze financiële instrumenten of gelden. Voor zover van toepassing brengt zij de cliënt er ook van op de hoogte
      dat een bewaarder een zakelijk zekerheidsrecht, een voorrecht of een recht van verrekening op deze instrumenten of
      gelden heeft of kan hebben.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58f
  - number: 58f.5
    text: |-
      Een beleggingsonderneming verstrekt de in dit artikel bedoelde informatie aan een professionele belegger
      voorafgaand aan het verlenen van een beleggingsdienst of nevendienst.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58f
  - number: 58f.6
    text: |-
      [Artikel 58c, zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel58c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel58f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 58c
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: '59'
    text: |-
      Een beleggingsonderneming verstrekt een niet-professionele belegger voorafgaand aan het uitvoeren van een
      order met betrekking tot een financieel instrument voor diens rekening de volgende informatie over haar
      orderuitvoeringsbeleid:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59
  - number: 59.a
    text: |-
      een uitleg over het relatieve gewicht dat de beleggingsonderneming overeenkomstig
      [artikel 4:90a, tweede lid, van de wet][ref1] toekent aan de in [artikel 4:90a, eerste lid, van de wet][ref2]
      genoemde factoren, of over de wijze waarop zij het relatieve gewicht van deze factoren bepaalt;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 59.b
    text: |-
      een overzicht van de plaatsen van uitvoering waarop de beleggingsonderneming een aanzienlijk beroep doet om haar
      verplichting na te komen om alle redelijke maatregelen te nemen teneinde bij de uitvoering van orders van cliënten
      steeds het best mogelijke resultaat te behalen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59
  - number: 59.c
    text: |-
      een duidelijke waarschuwing dat een specifieke instructie van de cliënt de beleggingsonderneming kan beletten de
      door haar vastgestelde en in haar orderuitvoeringsbeleid opgenomen maatregelen te nemen om bij de uitvoering van de
      desbetreffende order het best mogelijke resultaat te behalen voor de elementen waarvoor deze instructie geldt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59
  - number: 59a.1
    text: |-
      Een aanbieder verstrekt voorafgaand aan de totstandkoming van een overeenkomst met een consument inzake een complex
      product of hypothecair krediet, aan de consument informatie over de totale prijs van het complexe product of
      hypothecaire krediet, met inbegrip van alle bijbehorende kosten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.2
    text: |-
      Onverminderd het eerste lid verstrekt een aanbieder voorafgaand aan de totstandkoming van een overeenkomst met een
      consument inzake een complex product dat strekt tot vermogensopbouw, aan de consument, voor zover van toepassing,
      ten minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.2.a
    text: het bedrag van de totale kosten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.2.b
    text: |-
      de kosten die worden ingehouden op de inleg of de premie, onderverdeeld naar soorten kosten, zoals in elk geval
      eerste kosten, doorlopende kosten en aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.2.c
    text: |-
      de kosten die worden ingehouden op de vermogensopbouw of uitkering, onderverdeeld naar soorten kosten zoals in elk
      geval eerste kosten, doorlopende kosten en aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.2.d
    text: |-
      de kosten die de beheerder van de beleggingsinstelling jaarlijks in rekening brengt voor het beheer van rechten van
      deelneming in die beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.2.e
    text: |-
      de invloed van het gemiddelde jaarlijkse percentage van de kosten, bedoeld onder b, c en d, op het rendement en de
      vermogensopbouw of uitkering, verbonden aan de overeenkomst; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.2.f
    text: de wijze waarop de kosten, bedoeld onder b, c en d, worden verdeeld over de looptijd van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.3
    text: 'Het eerste en tweede lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.3.a
    text: overeenkomsten met betrekking tot beleggingsobjecten; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.3.b
    text: overeenkomsten met betrekking tot het verlenen van een beleggingsdienst of nevendienst.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.4
    text: |-
      Het tweede lid, aanhef en de onderdelen b tot en met f, zijn niet van toepassing op een levensverzekeraar
      die een levensverzekering aanbiedt waarbij de uitkering wordt uitgedrukt in rechten van deelneming in een
      beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
  - number: 59a.5
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op financiële ondernemingen die een complex product
      als bedoeld in [artikel 1, onderdeel d, onder 1°, 4° of 11°][ref1] samenstellen en dat product in de markt
      verkrijgbaar stellen voor consumenten of, indien het een recht van deelneming in een beleggingsinstelling betreft,
      cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 59b.1
    text: |-
      Een betaaldienstverlener stelt een betaaldienstgebruiker voordat deze is gebonden door een overeenkomst betreffende
      een eenmalige betalingstransactie op gemakkelijk toegankelijke wijze de in [artikel 59c][ref1] bedoelde informatie
      en voorwaarden ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59c
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 59b.2
    text: |-
      Op verzoek van de betaaldienstgebruiker verstrekt de betaaldienstaanbieder hem de informatie en voorwaarden op
      papier of op een andere duurzame drager.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59b
  - number: 59b.3
    text: |-
      De betaaldienstverlener verstrekt de informatie en voorwaarden aan de betaaldienstgebruiker in gemakkelijk te
      begrijpen bewoordingen en in duidelijke en bevattelijke vorm. Indien de betaaldienstverlener de betaaldienst
      verleent aan een betaaldienstgebruiker in een lidstaat, verstrekt hij de in de vorige volzin bedoelde informatie en
      voorwaarden in een officiële taal van die lidstaat of in een andere taal die tussen de partijen is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59b
  - number: 59b.4
    text: |-
      Indien de overeenkomst betreffende een eenmalige betalingstransactie op verzoek van de betaaldienstgebruiker
      is gesloten met gebruikmaking van een techniek voor communicatie op afstand welke het de betaaldienstverlener
      onmogelijk maakt aan het eerste lid te voldoen, voldoet deze onmiddellijk na de uitvoering van de
      betalingstransactie aan zijn verplichtingen ingevolge het genoemde lid.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59b
  - number: 59b.5
    text: |-
      Aan het eerste tot en met het derde lid kan ook worden voldaan door het verstrekken van een exemplaar van
      het ontwerpcontract betreffende een eenmalige betalingstransactie of de ontwerpbetaalopdracht waarin de in
      [artikel 59c][ref1] bedoelde informatie en voorwaarden zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59c
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 59c.1
    text: |-
      Een betaaldienstverlener verstrekt aan een betaaldienstgebruiker in het geval van een eenmalige betalingstransactie
      de volgende informatie en voorwaarden of stelt deze aan hem ter beschikking:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59c
  - number: 59c.1.a
    text: |-
      gedetailleerde informatie of een unieke identificator die door de betaaldienstgebruiker moet worden verstrekt opdat
      een betaalopdracht correct kan worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59c
  - number: 59c.1.b
    text: de maximale uitvoeringstermijn voor de aangeboden betaaldienst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59c
  - number: 59c.1.c
    text: |-
      alle kosten die de betaaldienstgebruiker aan de betaaldienstverlener verschuldigd is en, voor zover van toepassing,
      de splitsing van de bedragen van eventuele kosten; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59c
  - number: 59c.1.d
    text: voor zover van toepassing, de bij de betalingstransactie toe te passen feitelijke of referentiewisselkoers.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59c
  - number: 59c.2
    text: |-
      Voor zover van toepassing stelt de betaaldienstverlener de overige in [artikel 59d][ref1] bedoelde informatie en
      voorwaarden op gemakkelijk toegankelijke wijze aan de betaaldienstgebruiker ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59d
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59d
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 59d.1
    text: |-
      Een betaaldienstverlener verstrekt een betaaldienstgebruiker ruimschoots voordat deze is gebonden aan een
      raamovereenkomst voor betaaldiensten op papier of op een andere duurzame drager de in [artikel 59d][ref1] bedoelde
      informatie en voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59d
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59d
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 59d.2
    text: |-
      De betaaldienstverlener verstrekt de informatie en voorwaarden in gemakkelijk te begrijpen bewoordingen
      en in duidelijke en bevattelijke vorm. Indien de betaaldienstverlener de betaaldienst verleent aan een
      betaaldienstgebruiker in een lidstaat, verstrekt hij de in de vorige volzin bedoelde informatie en voorwaarden in
      een officiële taal van die lidstaat of in een andere taal die door de partijen is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59d
  - number: 59d.3
    text: |-
      Indien de raamovereenkomst voor betaaldiensten op verzoek van de betaaldienstgebruiker is gesloten met
      gebruikmaking van een techniek voor communicatie op afstand welke het de betaaldienstverlener onmogelijk
      maakt te voldoen aan het eerste lid, voldoet deze onmiddellijk na de sluiting van de raamovereenkomst aan zijn
      verplichtingen ingevolge het genoemde lid.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59d
  - number: 59d.4
    text: |-
      Aan het eerste lid kan ook worden voldaan door het verstrekken van een exemplaar van de ontwerpraamovereenkomst
      waarin de in [artikel 59d][ref1] bedoelde informatie en voorwaarden zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59d
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59d
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 59e.1
    text: 'De betaaldienstverlener verstrekt aan de betaaldienstgebruiker de volgende informatie en voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
  - number: 59e.1.a
    text: |-
      de naam van de betaaldienstverlener, het adres van het hoofdkantoor en, in voorkomend geval, het adres van
      zijn betaaldienstagent of bijkantoor in de lidstaat waar de betaaldienst wordt aangeboden, en enig ander adres,
      inclusief emailadres, dat relevant is voor de communicatie met de betaaldienstverlener;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
  - number: 59e.1.b
    text: |-
      de gegevens betreffende de relevante toezichthouders of toezichthoudende autoriteiten en betreffende het in
      [artikel 1:107 van de wet][ref1] bedoelde register en gegevens aan de hand waarvan de registerinschrijving kan
      worden gecontroleerd;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 59e.1.c
    text: een beschrijving van de voornaamste kenmerken van de aan te bieden betaaldienst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
  - number: 59e.1.d
    text: |-
      de gedetailleerde informatie of de unieke identificator die door de betaaldienstverlener wordt verstrekt opdat een
      betaalopdracht correct kan worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
  - number: 59e.1.e
    text: |-
      de vorm waarin en de procedure volgens welke de instemming met het uitvoeren van een betalingstransactie
      wordt verstrekt, respectievelijk wordt ingetrokken, overeenkomstig de [artikelen 522][ref1] en
      [534 van Boek 7 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel522
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel534
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '522'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '534'
  - number: 59e.1.f
    text: |-
      een referentie aan het in [artikel 532 van Boek 7 van het Burgerlijk Wetboek][ref1] omschreven tijdstip van
      ontvangst van een betaalopdracht en aan het eventueel door de betaaldienstverlener bepaalde uiterste tijdstip;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel532
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '532'
  - number: 59e.1.g
    text: de maximum uitvoeringstermijn voor de aangeboden betaaldiensten; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
  - number: 59e.1.h
    text: |-
      de vermelding of de mogelijkheid bestaat uitgavenlimieten voor het gebruik van het betaalinstrument overeenkomstig
      [artikel 523, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] overeen te komen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel523
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '523'
  - number: 59e.1.i
    text: |-
      alle kosten die door de betaaldienstgebruiker aan de betaaldienstverlener verschuldigd zijn en, voor zover van
      toepassing, de splitsing van de bedragen en eventuele kosten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
  - number: 59e.1.j
    text: |-
      voor zover van toepassing, de toe te passen rentevoet en wisselkoers, of, indien de referentierentevoet en
      -wisselkoers te hanteren zijn, de wijze van berekening van de feitelijke interesten en de relevante datum en de
      index of basis voor de vaststelling van die referentierentevoet of -wisselkoers;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
  - number: 59e.1.k
    text: |-
      indien overeengekomen, de onmiddellijke toepassing van wijzigingen in de referentierentevoet
      of -wisselkoers en de informatievereisten met betrekking tot de wijzigingen overeenkomstig
      [artikel 517, derde en vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel517
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '517'
  - number: 59e.1.l
    text: |-
      voor zover van toepassing, de technieken voor communicatie, met inbegrip van de technische vereisten van
      de apparatuur van de betaaldienstgebruiker, zoals tussen de partijen voor de mededeling van informatie en
      kennisgevingen krachtens de [wet][ref1] en [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref2] overeengekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0005290
  - number: 59e.1.m
    text: |-
      de wijze waarop en de frequentie waarmee informatie betreffende betaaldiensten krachtens de [wet][ref1] en
      [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref2] ter beschikking moet worden gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0005290
  - number: 59e.1.n
    text: |-
      de taal of talen waarin de raamovereenkomst voor betaaldiensten wordt gesloten en waarin de communicatie gedurende
      de looptijd van de contractuele betrekking plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
  - number: 59e.1.o
    text: |-
      een vermelding dat de betaaldienstgebruiker het recht heeft de contractuele voorwaarden
      van de raamovereenkomst voor betaaldiensten en informatie en voorwaarden overeenkomstig
      [artikel 516 van Boek 7 van het Burgerlijk Wetboek][ref1] te ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel516
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '516'
  - number: 59e.1.p
    text: |-
      voor zover van toepassing, een beschrijving van de maatregelen die de betaaldienstgebruiker
      moet nemen om de veilige bewaring van een betaalinstrument te waarborgen evenals de
      wijze waarop de betaaldienstverlener in kennis moet worden gesteld voor de toepassing van
      [artikel 524, eerste lid, onderdeel b, van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel524
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '524'
  - number: 59e.1.q
    text: |-
      indien overeengekomen, de voorwaarden waaronder de betaaldienstverlener zich het recht voorbehoudt het gebruik van
      een betaalinstrument te blokkeren overeenkomstig [artikel 523 van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel523
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '523'
  - number: 59e.1.r
    text: |-
      informatie over de aansprakelijkheid van de betaler overeenkomstig
      [artikel 529 van Boek 7 van het Burgerlijk Wetboek][ref1], onder vermelding van het relevante bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel529
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '529'
  - number: 59e.1.s
    text: |-
      op welke wijze en binnen welke termijn de betaaldienstgebruiker de betaaldienstverlener in kennis
      moet stellen van een niet-toegestane of foutief uitgevoerde betalingstransactie overeenkomstig
      [artikel 526 van Boek 7 van het Burgerlijk Wetboek][ref1], onder vermelding van de aansprakelijkheid
      van de betaaldienstverlener voor niet-toegestane betalingstransacties overeenkomstig
      [artikel 528 van Boek 7 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel526
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel528
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '526'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '528'
  - number: 59e.1.t
    text: |-
      informatie over de aansprakelijkheid van de betaaldienstverlener voor de uitvoering van betalingstransacties
      overeenkomstig de [artikelen 543 tot en met 545 van Boek 7 van het Burgerlijk Wetboek][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel543
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '543'
  - number: 59e.1.u
    text: |-
      de voorwaarden voor terugbetaling overeenkomstig de [artikelen 530][ref1] en
      [531 van Boek 7 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel530
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel531
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '530'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '531'
  - number: 59e.1.v
    text: |-
      indien overeengekomen, de informatie dat de betaaldienstgebruiker geacht wordt overeenkomstig
      [artikel 517 van Boek 7 van het Burgerlijk Wetboek][ref1] wijzigingen in de voorwaarden te hebben aanvaard tenzij
      hij de betaaldienstverlener voor de voorgestelde datum van inwerkingtreding van die wijzigingen ervan in kennis
      heeft gesteld dat hij de wijzigingen niet aanvaardt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel517
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '517'
  - number: 59e.1.w
    text: de looptijd van de raamovereenkomst voor betaaldiensten; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
  - number: 59e.1.x
    text: |-
      een vermelding dat de betaaldienstgebruiker een raamovereenkomst voor betaaldiensten kan beëindigen en alle
      afspraken met betrekking tot beëindiging van de overeenkomst overeenkomstig de [artikelen 517, eerste lid][ref1],
      en [518 van Boek 7 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel517
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel518
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '517'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '518'
  - number: 59e.1.y
    text: |-
      de contractuele bepalingen inzake het op de raamovereenkomst voor betaaldiensten toepasselijke recht of de ter zake
      bevoegde rechter; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
  - number: 59e.1.z
    text: |-
      de klachtenprocedure en buitengerechtelijke geschillenbeslechting die ingevolge [artikel 4:17 van de wet][ref1]
      voor de betaaldienstgebruiker openstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 59f.1
    text: |-
      Een betaaldienstverlener verstrekt, in afwijking van de [artikelen 59c][ref1] en [59d][ref2], met betrekking tot
      betaalinstrumenten die overeenkomstig een raamovereenkomst voor betaaldiensten uitsluitend worden gebruikt voor
      afzonderlijke betalingstransacties van maximaal € 30, met een uitgavenlimiet van € 150 of waarop maximaal een
      bedrag van € 150 tegelijk kan worden opgeslagen, de betaler uitsluitend informatie over de voornaamste kenmerken
      van de betaaldienst, met inbegrip van de wijze waarop van het betaalinstrument gebruik kan worden gemaakt,
      de aansprakelijkheid, alle in rekening gebrachte kosten en andere belangrijke informatie die nodig is om een
      weloverwogen besluit te nemen, en geeft tevens aan waar andere in [artikel 59d][ref3] bedoelde informatie en
      voorwaarden op gemakkelijk toegankelijke wijze beschikbaar zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59c
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel59d
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel59d
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59c
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 59d
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 59d
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 59f.2
    text: Voor nationale betalingstransacties worden de in het eerste lid genoemde bedragen verdubbeld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59f
  - number: 59f.3
    text: |-
      Voor vooraf betaalde betaalinstrumenten, bedoeld voor nationale betalingstransacties, worden de in het eerste lid
      genoemde bedragen verhoogd tot € 500.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59f
  - number: 59g.1
    text: |-
      Een betaaldienstverlener brengt een betaaldienstgebruiker geen kosten in rekening voor de ingevolge de
      [artikelen 59a tot en met 59e][ref1] te verstrekken informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59g
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59a
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 59g.2
    text: |-
      Een betaaldienstverlener en een betaaldienstgebruiker kunnen overeenkomen dat kosten in rekening worden gebracht
      voor door de betaaldienstgebruiker gevraagde aanvullende informatie of voor informatie die frequenter of met andere
      communicatiemiddelen wordt verstrekt dan in de raamovereenkomst voor betaaldiensten is bepaald.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59g
  - number: 59g.3
    text: |-
      Kosten die de betaaldienstverlener ingevolge het tweede lid in rekening mag brengen zijn passend en in
      overeenstemming met de kosten die de betaaldienstverlener feitelijk heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel59g
  - number: '60.1'
    text: |-
      Onverminderd de [artikelen 57][ref1] en [58][ref2] verstrekt een levensverzekeraar een cliënt voorafgaande aan de
      totstandkoming van een overeenkomst inzake een levensverzekering, voorzover van toepassing, ten minste de volgende
      informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel58
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '58'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 60.1.a
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.b
    text: |-
      het bedrag van de uitkering of uitkeringen waartoe hij zich verplicht of, voorzover dit bedrag niet op voorhand
      nauwkeurig kan worden bepaald, een nauwkeurige omschrijving van die uitkering of uitkeringen, alsmede van de
      factoren waarvan de hoogte van de uitkering of uitkeringen afhankelijk is;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.c
    text: |-
      een omschrijving van de keuzemogelijkheden die de cliënt of de gerechtigde op een uitkering heeft ingevolge de
      overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.d
    text: |-
      een nauwkeurige omschrijving van de valuta waarin de premie of de uitkering is uitgedrukt, indien dit een andere
      valuta is dan de euro, of van de units, eenheden of datgene waar de premie of de uitkering anderszins in is
      uitgedrukt, of, indien de uitkering strekt tot het verrichten van andere dan geldelijke prestaties, van die
      prestatie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.e
    text: |-
      een nauwkeurige omschrijving van de omzettingsmethode indien bij een uitkering omzetting plaatsvindt in euro’s of
      een andere valuta;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.f
    text: |-
      de aard van de waarden, waaronder aandelen of andersoortige rechten van deelneming in een beleggingsinstelling,
      indien de uitkering daarin wordt uitgedrukt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.g
    text: de wijze van berekening en toewijzing van de winstdeling, indien de overeenkomst een recht op winstdeling omvat;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.h
    text: de looptijd van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.i
    text: |-
      de premie, verschuldigd voor de hoofddekking en, indien de overeenkomst voorziet in een of meer nevenuitkeringen,
      de premies die voor elk van de nevenuitkeringen zijn verschuldigd en, indien deze premies gedurende de looptijd
      fluctueren, een zo nauwkeurig mogelijke beschrijving van de wijze waarop ze worden berekend en van de factoren
      waardoor het beloop ervan wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.j
    text: een opgave of de premie eenmalig is verschuldigd dan wel periodiek;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.k
    text: de periode gedurende welke premie verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.l
    text: 'indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.l.1°
    text: |-
      de kosten die worden ingehouden op de premie, bedoeld in onderdeel i, onderverdeeld naar eerste kosten, doorlopende
      kosten en aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.l.2°
    text: |-
      de kosten die worden ingehouden op de waarde van de rechten van deelneming, onderverdeeld naar eerste kosten,
      doorlopende kosten en aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.l.3°
    text: |-
      de kosten die de beheerder van de beleggingsinstelling jaarlijks in rekening brengt voor het beheer van de rechten
      van deelneming in die beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.l.4°
    text: |-
      de invloed van het gemiddelde jaarlijkse percentage van de kosten, bedoeld onder 1°, 2° en 3°, op het rendement en
      de uitkering, verbonden aan de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.l.5°
    text: |-
      de wijze waarop de kosten, bedoeld onder 1°, 2° en 3°, worden verdeeld over de looptijd van de overeenkomst met
      de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.m
    text: |-
      een omschrijving van de gevolgen van een verhoging of verlaging van de premie, met inbegrip van premievrijmaken,
      en, indien de overeenkomst in die mogelijkheid voorziet, van afkoop, en een opgave van de afkoopwaarde gedurende
      ten minste de eerste tien jaren van de looptijd, onder vermelding van het voor de berekening gehanteerde
      rendementspercentage;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.n
    text: |-
      de wijze waarop de cliënt gebruik kan maken van zijn recht, bedoeld in [artikel 4:63 van de wet][ref1], om de
      overeenkomst op te zeggen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 60.1.o
    text: de wijze waarop de overeenkomst kan worden beëindigd en de termijn die daarbij in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.p
    text: |-
      een globale indicatie van de fiscale behandeling van overeenkomsten van het desbetreffende type, waaronder begrepen
      de fiscale behandeling van premies, uitkeringen en de fiscale consequenties van afkoop;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.q
    text: het op de overeenkomst toe te passen recht, of de door de aanbieder voorgestelde rechtskeuze;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.r
    text: de kosten die naast de brutopremie in rekening worden gebracht;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.s
    text: het aan de overeenkomst verbonden financiële risico en de mate waarin dit risico voor rekening is van de cliënt; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.1.t
    text: de overige polisvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: '60.2'
    text: |-
      In afwijking van het eerste lid kan de in dat lid bedoelde informatie onmiddellijk na de totstandkoming van de
      overeenkomst worden verstrekt of uiterlijk tegelijk met het afgeven van de polis, indien de cliënt het recht heeft
      zonder een boete verschuldigd te zijn en zonder opgave van redenen de overeenkomst binnen dertig kalenderdagen
      na de dag waarop hij de informatie heeft ontvangen, terugwerkend tot de datum van de totstandkoming van de
      overeenkomst, te ontbinden en de cliënt is geïnformeerd over de wijze waarop hij gebruik kan maken van dat recht.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: '60.3'
    text: |-
      Voorzover het financiële risico ingevolge een overeenkomst inzake een levensverzekering voor rekening van de cliënt
      is, kan de levensverzekeraar met de cliënt overeenkomen dat de eventueel na de totstandkoming van de overeenkomst
      opgetreden waardevermeerdering of -vermindering van de beleggingen voor rekening van de cliënt blijft indien deze
      overeenkomstig het tweede lid de overeenkomst, terugwerkend tot de datum van de totstandkoming van de overeenkomst,
      ontbindt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: '60.4'
    text: |-
      Indien een uitkering op grond van een overeenkomst inzake een levensverzekering wordt uitgedrukt in rechten van
      deelneming in een beleggingsinstelling stelt de levensverzekeraar aan de cliënt op diens verzoek informatie ter
      hand over het beleggingsbeleid van de beleggingsinstelling, waarin aandacht wordt besteed aan de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.4.a
    text: de doelstelling van het beleggingsbeleid, alsmede de voor het beheer gehanteerde referentieportefeuille;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.4.b
    text: aan het beleggingsbeleid gestelde restricties; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: 60.4.c
    text: de beleggingstitels die zijn toegestaan alsmede de afgeleide instrumenten die kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: '60.5'
    text: |-
      Het eerste lid, aanhef en onderdeel m, is niet van toepassing indien de cliënt een werkgever is die een
      overeenkomst afsluit ten behoeve van zijn werknemers in verband met een door hem toegezegd pensioen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel60
  - number: '61.1'
    text: |-
      Onverminderd [artikel 57][ref1] verstrekt een schadeverzekeraar een cliënt voorafgaande aan de totstandkoming van
      een overeenkomst inzake een schadeverzekering, voorzover van toepassing, ten minste de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 61.1.a
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel61
  - number: 61.1.b
    text: het recht dat op de overeenkomst van toepassing is, of de door de schadeverzekeraar voorgestelde rechtskeuze; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel61
  - number: 61.1.c
    text: |-
      de naam en het adres van de schade-afhandelaar, bedoeld in
      [artikel 4:71, eerste lid, onderdeel e, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '61.2'
    text: |-
      In afwijking van het eerste lid kan de in dat lid bedoelde informatie onmiddellijk na de totstandkoming van de
      overeenkomst worden verstrekt, of uiterlijk tegelijk met het afgeven van de polis, indien de cliënt het recht heeft
      zonder een boete verschuldigd te zijn en zonder opgave van redenen de overeenkomst binnen veertien kalenderdagen na
      de dag waarop hij de informatie heeft ontvangen te ontbinden en de cliënt is geïnformeerd over de wijze waarop hij
      gebruik kan maken van dat recht.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel61
  - number: '62'
    text: |-
      Indien in geval van een overeenkomst inzake een schadeverzekering een risico is gelegen in een andere lidstaat
      wordt de aan de cliënt te verstrekken informatie gegeven volgens de in die andere lidstaat vastgestelde regels
      ter uitvoering van de artikelen 31 en 43 van [richtlijn nr. 92/49/EEG](31992L0049) van de Raad van de Europese
      Gemeenschappen van 18 juni 1992 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende
      het directe verzekeringsbedrijf, met uitzondering van de levensverzekeringsbranche, en houdende wijziging van de
      [richtlijnen 73/239/EEG](31973L0239) en [88/357/EEG](31988L0357) (PbEG L 228).
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel62
  - number: '63.1'
    text: |-
      Onverminderd [artikel 57][ref1] verstrekt een natura-uitvaartverzekeraar voorafgaande aan de totstandkoming
      van een overeenkomst inzake een natura-uitvaartverzekering of een overeenkomst die strekt tot fondsvorming ter
      voldoening van de verzorging van de uitvaart van een natuurlijke persoon, voorzover van toepassing, ten minste
      de volgendeinformatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 63.1.a
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.b
    text: een omschrijving van de prestatie waartoe de natura-uitvaartverzekeraar zich verplicht;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.c
    text: een omschrijving van de keuzemogelijkheden die de cliënt of de verzekerde ingevolge de overeenkomst heeft;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.d
    text: een opgave of de premie eenmalig is verschuldigd dan wel periodiek;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.e
    text: de periode gedurende welke premie verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.f
    text: een opgave van de indexering die wordt toegepast op de verzekerde prestatie of op de premie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.g
    text: de overige mogelijkheden die de aanbieder heeft om de verzekerde prestatie of de premie aan te passen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.h
    text: |-
      een opgave of indicatie van de afkoop- of premievrije waarde of een opgave van de wijze waarop deze waarden worden
      berekend;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.i
    text: |-
      de wijze waarop de cliënt gebruik kan maken van zijn recht, bedoeld in [artikel 4:63 van de wet][ref1], om de
      overeenkomst op te zeggen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 63.1.j
    text: de wijze waarop de overeenkomst kan worden beëindigd en de termijn die daarbij in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.k
    text: het op de overeenkomst toe te passen recht, of de door de natura-uitvaartverzekeraar voorgestelde rechtskeuze;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.l
    text: |-
      een opgave van de uitvaartonderneming die de uitvaart zal verzorgen, dan wel van de wijze waarop wordt bepaald
      welke uitvaartonderneming de uitvaart zal verzorgen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.m
    text: de overige polisvoorwaarden, en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: 63.1.n
    text: |-
      indien het een overeenkomst betreft die strekt fondsvorming als bedoeld in
      [artikel 4:18, tweede lid, van de wet][ref1]: informatie over de wijze waarop de ingelegde gelden worden belegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '63.2'
    text: |-
      Indien de termijn van beëindiging, bedoeld in het eerste lid, onderdeel j, langer is dan een jaar, maakt de natura-
      uitvaartverzekeraar dit op een opvallende wijze uitdrukkelijk kenbaar aan de cliënt, bij gebreke waarvan een
      opzegtermijn van een jaar geldt ongeacht het in de overeenkomst bepaalde.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: '63.3'
    text: |-
      In afwijking van het eerste lid kan de in dat lid bedoelde informatie onmiddellijk na de totstandkoming van de
      overeenkomst worden verstrekt, of uiterlijk tegelijk met het afgeven van de polis, indien de cliënt het recht heeft
      zonder een boete verschuldigd te zijn en zonder opgave van redenen de overeenkomst binnen dertig kalenderdagen
      na de dag waarop hij de informatie heeft ontvangen, terugwerkend tot de datum van de totstandkoming van de
      overeenkomst, te ontbinden en de cliënt is geïnformeerd over de wijze waarop hij gebruik kan maken van dat recht.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
  - number: '63.4'
    text: |-
      Indien een natura-uitvaartverzekeraar bij de totstandkoming van een overeenkomst die strekt tot fondsvorming als
      bedoeld in [4:18, tweede lid, van de wet][ref1] in afwijking van het eerste lid, de in dat lid bedoelde informatie
      onmiddellijk na de totstandkoming van een overeenkomst of uiterlijk tegelijk met het afgeven van de polis verstrekt
      in overeenstemming met het derde lid, komt de natura-uitvaartverzekeraar met de cliënt overeen dat de eventueel
      na de totstandkoming van de overeenkomst opgetreden waardevermeerdering of -vermindering van de beleggingen voor
      rekening van de cliënt blijft, indien deze overeenkomstig het derde lid de overeenkomst, terugwerkend tot de datum
      van de totstandkoming van de overeenkomst, ontbindt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '64.1'
    text: |-
      Deze paragraaf is niet van toepassing op beheerders van instellingen voor collectieve belegging in effecten met
      zetel in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel64
  - number: '64.2'
    text: |-
      Deze paragraaf is niet van toepassing op financiële ondernemingen voorzover zij overeenkomsten inzake complexe
      producten beheren of uitvoeren dan wel daarbij assisteren.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel64
  - number: '65.1'
    text: |-
      Een aanbieder van een complex product houdt een financiële bijsluiter beschikbaar op zijn website en verstrekt de
      financiële bijsluiter onverwijld kosteloos op verzoek van een consument of, indien het een recht van deelneming in
      een beleggingsinstelling betreft, cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel65
  - number: '65.2'
    text: |-
      Indien een complex product wordt aangeboden door tussenkomst van een bemiddelaar, gevolmachtigde agent
      of ondergevolmachtigde agent, wordt een financiële bijsluiter door deze bemiddelaar, gevolmachtigde agent
      onderscheidenlijk ondergevolmachtigde agent onverwijld kosteloos op verzoek van de consument onderscheidenlijk
      cliënt verstrekt, tenzij de aanbieder en de bemiddelaar, gevolmachtigde agent onderscheidenlijk ondergevolmachtigde
      agent zijn overeengekomen dat de aanbieder zelf aan deze verplichting voldoet.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel65
  - number: '65.3'
    text: |-
      Het eerste lid is niet van toepassing op complexe producten, met uitzondering van rechten van deelneming in
      een beleggingsinstelling, ten aanzien waarvan uitsluitend financiële diensten worden verleend aan anderen dan
      consumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel65
  - number: '65.4'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op financiële ondernemingen die een complex product als bedoeld
      in de onderdelen 1°, 4° of 7°, van de definitie van complex product in [artikel 1][ref1], samenstellen en dat
      product algemeen in de markt verkrijgbaar stellen voor consumenten of, indien een recht van deelneming in een
      beleggingsinstelling betreft, cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '66.1'
    text: 'In een financiële bijsluiter wordt informatie over de volgende onderwerpen opgenomen:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.1.a
    text: het doel van de financiële bijsluiter;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.1.b
    text: de aard en het doel van het complexe product;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.1.c
    text: |-
      de financiële risico’s van het complexe product die onder meer inzichtelijk worden gemaakt door een risico-
      indicator en, indien het een beleggingsobject betreft, de overige risico’s die samenhangen met dat product;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.1.d
    text: de verplichtingen voor de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.1.e
    text: |-
      het al dan niet bestaan van een contractueel recht om de overeenkomst inzake het complexe product tussentijds op te
      zeggen, de daaraan verbonden kosten en de overige gevolgen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.1.f
    text: de gevolgen bij overlijden van de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.1.g
    text: voorbeeldrendementen en de kosten van het complexe product; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.1.h
    text: bij ministeriële regeling aan te wijzen andere onderwerpen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: '66.2'
    text: |-
      In afwijking van het eerste lid wordt in een financiële bijsluiter die betrekking heeft op een recht van deelneming
      in een beleggingsinstelling, informatie over de volgende onderwerpen opgenomen:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.a
    text: |-
      de vermelding dat het een financiële bijsluiter betreft, welke beleggingsinstelling het betreft en een korte
      omschrijving van de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.b
    text: |-
      het doel van de financiële bijsluiter en de inschrijving van de beleggingsinstelling in het register dat wordt
      gehouden door de Autoriteit Financiële Markten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.c
    text: de aard en het doel van de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.d
    text: |-
      de financiële risico’s van het recht van deelneming in een beleggingsinstelling die onder meer inzichtelijk worden
      gemaakt door een risico-indicator;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.e
    text: de verplichtingen voor de deelnemer;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.f
    text: de kosten en, indien beschikbaar, het historisch rendement van het recht van deelneming;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.g
    text: |-
      het al dan niet bestaan van een contractueel recht om de overeenkomst inzake het complexe product tussentijds op te
      zeggen, de daaraan verbonden kosten en de overige gevolgen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.h
    text: fiscale aspecten van de rechten van deelneming in de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.i
    text: |-
      het adres waar het prospectus, bedoeld in [artikel 4:49, eerste lid, van de wet][ref1] en de jaarrekening van de
      beleggingsinstelling kosteloos op aanvraag verkrijgbaar zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 66.2.j
    text: een contactpersoon tot wie een deelnemer zich met eventuele vragen kan richten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.k
    text: het feit dat de Autoriteit Financiële Markten de toezichthouder op de financiële bijsluiter is;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.l
    text: de datum waarop de financiële bijsluiter is geactualiseerd; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: 66.2.m
    text: bij ministeriële regeling aan te wijzen andere onderwerpen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: '66.3'
    text: Een financiële bijsluiter bevat geen informatie over andere onderwerpen dan bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: '66.4'
    text: |-
      De Autoriteit Financiële Markten stelt regels met betrekking tot de wijze waarop de informatie over de onderwerpen,
      bedoeld in het eerste en tweede lid, in de financiële bijsluiter wordt opgenomen, alsmede met betrekking tot de
      wijze van berekening van de rendementen, kosten en risico’s als bedoeld in het eerste lid, onderdelen c en g, en
      het tweede lid, onderdelen d en f.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: '66.5'
    text: |-
      De Autoriteit Financiële Markten stelt met betrekking tot een financiële bijsluiter die betrekking heeft op
      rechten van deelneming in een instelling voor collectieve belegging in effecten nadere regels ter uitvoering van de
      richtlijn beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel66
  - number: '67.1'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een beleggingsobject verstrekt de aanbieder de consument ten
      minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel67
  - number: 67.1.a
    text: |-
      een door een accountant dan wel een deskundige die ingevolge het recht van de staat waar de aanbieder zijn zetel
      heeft, bevoegd is de jaarrekening te onderzoeken, gecontroleerde jaarrekening, waarvan de toelichting ten minste
      een opsplitsing bevat van de totale verkoopkosten, de productiekosten, de beheerkosten en de administratieve kosten
      van de aanbieder, een opsplitsing van deze kosten per serie van beleggingsobjecten waartoe het beleggingsobject
      behoort, alsmede het totaal van de door consumenten ingelegde gelden in de serie van beleggingsobjecten.
      De opstelling van de jaarrekening geschiedt door een aanbieder met een zetel in Nederland zoveel mogelijk
      overeenkomstig [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] of de internationale jaarrekeningstandaarden.
      De opstelling van de jaarrekening van een aanbieder met een zetel in een andere lidstaat geschiedt overeenkomstig
      de voorschriften van de richtlijn jaarrekening en van de richtlijn geconsolideerde jaarrekening of overeenkomstig
      de internationale jaarrekeningstandaarden. Voor de overige aanbieders geschiedt de opstelling op gelijkwaardige
      wijze. In de jaarrekening wordt meegedeeld overeenkomstig welke voorschriften de opstelling geschiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 67.1.b
    text: |-
      ten minste een maal per jaar een door een onafhankelijke deskundige in dat jaar opgestelde waardering van de serie
      van beleggingsobjecten waartoe het beleggingsobject behoort; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel67
  - number: 67.1.c
    text: bij ministeriële regeling aan te wijzen andere onderwerpen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel67
  - number: '67.2'
    text: |-
      De aanbieder houdt de informatie, bedoeld in het eerste lid, aanhef en onderdelen a en b, gedurende ten minste drie
      jaar beschikbaar op zijn website.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel67
  - number: '67.3'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de wijze waarop de informatie, bedoeld
      in het eerste lid, wordt gepresenteerd of geformuleerd alsmede met betrekking tot de wijze van berekening van de
      kosten, bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel67
  - number: '68.1'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake krediet verstrekt de aanbieder de consument op diens verzoek
      een gespecificeerd overzicht van het uitstaand saldo. Hij kan daarbij een vergoeding in rekening brengen van ten
      hoogste het bedrag van de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel68
  - number: '68.2'
    text: |-
      Tot een jaar na de afwikkeling van een overeenkomst inzake krediet verstrekt de aanbieder van krediet aan de
      consument op diens verzoek kosteloos een gespecificeerde afrekening.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel68
  - number: 68a
    text: |-
      Gedurende de looptijd van een overeenkomst inzake hypothecair krediet met een variabele kredietvergoeding
      informeert de aanbieder de consument over elke wijziging van de kredietvergoeding, waarbij hij de consument tevens
      informeert over het gewijzigde jaarlijks kostenpercentage.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel68a
  - number: '69.1'
    text: |-
      Een beleggingsonderneming die voor rekening van een cliënt een order met betrekking tot een financieel instrument
      heeft uitgevoerd die niet strekt ter uitvoering van een beslissing in verband met het beheren van een individueel
      vermogen, verstrekt aan de cliënt onmiddellijk de belangrijkste informatie over de uitvoering van deze order.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: '69.2'
    text: |-
      Een beleggingsonderneming die een order als bedoeld in het eerste lid heeft uitgevoerd voor een niet-professionele
      belegger geeft de cliënt, onverminderd het eerste lid, onverwijld en uiterlijk op de eerste werkdag na de
      uitvoering van de order kennis van de uitvoering van de order. Indien de beleggingsonderneming een bevestiging
      van de uitvoering ontvangt van een derde, geeft de beleggingsonderneming de cliënt daarvan kennis uiterlijk op de
      eerste werkdag na ontvangst van de bevestiging van deze derde, tenzij deze derde de cliënt reeds onmiddellijk in
      kennis heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: '69.3'
    text: |-
      In afwijking van het eerste en tweede lid informeert een beleggingsonderneming die een order als bedoeld in het
      eerste lid met betrekking tot obligaties ter financiering van een hypothecair krediet heeft uitgevoerd, de cliënt
      die dit krediet is aangegaan over de uitvoering van de order bij de mededeling van de kredietsom, doch uiterlijk
      een maand na uitvoering van de order.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: '69.4'
    text: |-
      Indien een beleggingsonderneming periodiek orders met betrekking tot rechten van deelneming in een
      beleggingsinstelling uitvoert voor een niet-professionele belegger, kan een beleggingsonderneming de kennisgeving,
      bedoeld in het tweede lid, éénmaal per zes maanden verstrekken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: '69.5'
    text: Een beleggingsonderneming verstrekt de cliënt desgevraagd informatie over de status van diens order.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: '69.6'
    text: |-
      De kennisgeving, bedoeld in tweede lid, bevat, voorzover van toepassing en voorzover relevant in overeenstemming
      met tabel 1 van bijlage 1 bij de uitvoeringsverordening markten voor financiële instrumenten, de volgende
      informatie:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.a
    text: de identificatiegegevens van de melder;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.b
    text: de naam of een andere omschrijving van de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.c
    text: de handelsdag;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.d
    text: de handelstijd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.e
    text: het soort order;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.f
    text: de identificatiegegevens van de plaats van uitvoering;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.g
    text: de identificatiegegevens van het financieel instrument;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.h
    text: de aankoop of verkoop;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.i
    text: de aard van de order indien het geen koop- of verkooporder betreft;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.j
    text: de hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.k
    text: de prijs per eenheid;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.l
    text: de totale vergoeding;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.m
    text: |-
      de totale kosten die in rekening zijn gebracht, en een specificatie daarvan indien de niet-professionele belegger
      daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.n
    text: |-
      de verantwoordelijkheden van de cliënt met betrekking tot de afwikkeling van de transactie, waaronder de betalings-
      of levertermijn en de beleggingsrekeninggegevens voorzover deze gegevens en verantwoordelijkheden nog niet eerder
      aan de cliënt zijn medegedeeld;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: 69.6.o
    text: |-
      het feit dat de tegenpartij van de cliënt de beleggingsonderneming zelf, een persoon die deel uitmaakt van de groep
      waartoe de beleggingsonderneming behoort dan wel een andere cliënt van de beleggingsonderneming was, tenzij de
      order is uitgevoerd via een handelssysteem dat anonieme handel mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: '69.7'
    text: |-
      Indien een beleggingsonderneming een order met betrekking tot financiële instrumenten in tranches uitvoert, kan zij
      voor de toepassing van het zesde lid, onderdeel k, de cliënt informatie over de prijs van elke tranche afzonderlijk
      dan wel over de gemiddelde prijs verstrekken. Indien de beleggingsonderneming informatie over de gemiddelde
      prijs geeft, verstrekt zij de niet-professionele cliënt op verzoek informatie over de prijs van elke tranche
      afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: '69.8'
    text: |-
      Een beleggingsonderneming kan de informatie, bedoeld in het zesde lid, door middel van standaardcodes verstrekken
      indien zij een toelichting op de gebruikte codes geeft.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel69
  - number: '70.1'
    text: |-
      Een beleggingsonderneming die een individueel vermogen beheert, verstrekt de cliënt een periodiek overzicht van de
      vermogensbeheeractiviteiten die namens hem zijn uitgevoerd, tenzij dit overzicht reeds door een derde is verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: '70.2'
    text: |-
      Voorzover het periodieke overzicht, bedoeld in het eerste lid, betrekking heeft op het vermogen van een niet-
      professionele belegger, bevat het, voorzover van toepassing, de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: 70.2.a
    text: de naam van de beleggingsonderneming;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: 70.2.b
    text: |-
      de naam of een andere omschrijving van de ten behoeve van het beheer gehanteerde beleggingsrekening van de niet-
      professionele belegger;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: 70.2.c
    text: |-
      een vermelding van de inhoud en de waardering van de portefeuille, waaronder gegevens over elk financieel
      instrument dat aangehouden wordt, de marktwaarde of, als deze niet beschikbaar is, de reële waarde ervan en
      het kassaldo aan het begin en het einde van de rapportageperiode, alsmede de portefeuilleresultaten over de
      rapportageperiode;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: 70.2.d
    text: |-
      het totale bedrag aan kosten over de rapportageperiode met een afzonderlijke specificatie van in elk geval de
      totale beheersvergoedingen en de totale uitvoeringskosten en, voor zover van toepassing, met de vermelding dat
      desgewenst een gedetailleerdere specificatie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: 70.2.e
    text: |-
      een vergelijking van de resultaten van de portefeuille over de overzichtsperiode met elke tussen de
      beleggingsonderneming en de cliënt overeengekomen evaluatie- of vergelijkingsmaatstaf;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: 70.2.f
    text: |-
      het totale bedrag aan dividenden, rente en andere betalingen die over de rapportageperiode zijn ontvangen in
      verband met de portefeuille van de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: 70.2.g
    text: |-
      informatie over corporate actions waardoor rechten worden verkregen die verband houden met financiële instrumenten
      in de portefeuille;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: 70.2.h
    text: |-
      voor elke in de rapportageperiode uitgevoerde transactie, voor zover van toepassing, de informatie, bedoeld in
      [artikel 69, zesde lid, onderdelen c tot en met l][ref1], tenzij de cliënt per transactie informatie wenst te
      ontvangen overeenkomstig het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel69
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '69'
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: '70.3'
    text: |-
      De beleggingsonderneming verstrekt het periodieke overzicht, bedoeld in het eerste lid, voor zover het betrekking
      heeft op het vermogen van een niet-professionele belegger eenmaal per zes maanden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: '70.4'
    text: |-
      In afwijking van het derde lid verstrekt een beleggingsonderneming het periodieke overzicht, bedoeld in het eerste
      lid, dat betrekking heeft op het vermogen van een niet-professionele belegger:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: 70.4.a
    text: eenmaal per kwartaal, indien de niet-professionele belegger een verzoek daartoe heeft ingediend;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: 70.4.b
    text: |-
      ten minste eenmaal per jaar, indien het vijfde lid van toepassing is, tenzij het periodieke overzicht
      betrekking heeft op transacties in effecten als bedoeld in onderdeel c van de definitie van effect in
      [artikel 1:1 van de wet][ref1] of in financiële instrumenten als bedoeld in de onderdelen d tot en met j van de
      definitie van financieel instrument in [dat artikel][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 70.4.c
    text: maandelijks, indien het een overeenkomst betreft die een portefeuille met hefboomwerking toestaat.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: '70.5'
    text: |-
      De beleggingsonderneming wijst haar cliënten die niet-professionele belegger zijn erop dat zij het recht hebben om
      een verzoek als bedoeld in het vierde lid, onderdeel a, in te dienen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: '70.6'
    text: |-
      Indien de cliënt per uitgevoerde transactie informatie wenst te ontvangen, verstrekt de beleggingsonderneming
      onmiddellijk na uitvoering van de transactie de belangrijkste informatie over deze transactie.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
  - number: '70.7'
    text: |-
      Indien de cliënt een niet-professionele belegger is en per uitgevoerde transactie informatie wenst te ontvangen,
      zendt de beleggingsonderneming de cliënt een bevestiging van de transactie waarin de informatie, bedoeld in
      [artikel 69, zesde lid][ref1], is opgenomen, uiterlijk op de eerste werkdag na de uitvoering van die transactie of,
      indien de beleggingsonderneming een bevestiging van de uitvoering ontvangt van een derde, uiterlijk op de eerste
      werkdag na ontvangst van de bevestiging van deze derde. De eerste volzin is niet van toepassing wanneer de derde
      onmiddellijk na het uitvoeren van de transactie een bevestiging die dezelfde informatie bevat aan de cliënt zendt.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel69
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '69'
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: '71.1'
    text: |-
      Indien een beleggingsonderneming in het kader van het beheer van een individueel vermogen voor een niet-
      professionele belegger transacties verricht of een beleggingsrekening beheert waarbij sprake is van een ongedekte
      open positie als gevolg van een transactie waarbij een voorwaardelijke verplichting is aangegaan, stelt de
      beleggingsonderneming deze cliënt tevens in kennis van verliezen die uitstijgen boven een van tevoren tussen de
      beleggingsonderneming en de cliënt overeengekomen drempel.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71
  - number: '71.2'
    text: |-
      De kennisgeving, bedoeld in het eerste lid, geschiedt uiterlijk aan het einde van de werkdag waarop de drempel
      wordt overschreden of wanneer de drempel op een dag die geen werkdag is wordt overschreden, aan het einde van de
      eerstvolgende werkdag.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71
  - number: 71a.1
    text: |-
      Een beleggingsonderneming zendt een cliënt voor wie zij financiële instrumenten of gelden aanhoudt ten minste
      eenmaal per jaar een overzicht van de financiële instrumenten of gelden. Indien de informatie onderdeel uitmaakt
      van een ander periodiek overzicht dat aan een cliënt wordt verstrekt, heeft de beleggingsonderneming voldaan aan de
      eerste volzin.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71a
  - number: 71a.2
    text: Het eerste lid is niet van toepassing op banken, voor zover het betreft deposito’s die zij voor cliënten aanhouden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71a
  - number: 71a.3
    text: 'Het overzicht, bedoeld in het eerste lid, bevat de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71a
  - number: 71a.3.a
    text: |-
      gegevens over alle financiële instrumenten of gelden die de beleggingsonderneming voor de cliënt aan het eind van
      de rapportageperiode aanhoudt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71a
  - number: 71a.3.b
    text: in hoeverre financiële instrumenten of gelden van de cliënt zijn gebruikt voor effectenfinancieringstransacties; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71a
  - number: 71a.3.c
    text: |-
      het voordeel dat de cliënt uit hoofde van diens deelneming in effectenfinancieringstransacties heeft behaald en de
      basis waarop dit voordeel is behaald.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71a
  - number: 71a.4
    text: |-
      Indien de portefeuille van een cliënt de opbrengsten uit niet-afgewikkelde transacties bevat, wordt in de in het
      derde lid, onderdeel a, bedoelde informatie uitgegaan van hetzij de handelsdatum hetzij de afwikkelingsdatum,
      indien voor al deze gegevens in het overzicht steeds dezelfde grondslag wordt gehanteerd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71a
  - number: 71a.5
    text: |-
      Een beleggingsonderneming die voor een cliënt financiële instrumenten of gelden aanhoudt en voor die cliënt tevens
      een individueel vermogen beheert, kan het overzicht, bedoeld in het eerste lid, opnemen in het periodiek overzicht
      van de vermogensbeheeractiviteiten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71a
  - number: 71b.1
    text: |-
      In het tweede lid en de [artikelen 71c][ref1] en [71d][ref2] wordt onder eenmalige betalingstransacties verstaan
      een betalingstransactie waarop niet een raamovereenkomst voor betaaldiensten van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel71c
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel71d
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 71c
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 71d
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 71b.2
    text: |-
      Indien een betaalopdracht voor een eenmalige betalingstransactie wordt doorgegeven via een onder een
      raamovereenkomst voor betaaldiensten vallend betaalinstrument, is de betaaldienstverlener niet verplicht informatie
      te verstrekken of beschikbaar te stellen die reeds uit hoofde van een raamovereenkomst voor betaaldiensten met een
      andere betaaldienstverlener aan de betaaldienstgebruiker is verstrekt of volgens de raamovereenkomst aan hem zal
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71b
  - number: 71c
    text: |-
      Onmiddellijk na de ontvangst van een betaalopdracht voor een eenmalige betalingstransactie verstrekt de
      betaaldienstverlener van de betaler op dezelfde wijze als in [artikel 59a, eerste tot en met derde lid][ref1], is
      bepaald, aan de betaler de volgende informatie of stelt hij deze aan hem ter beschikking:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59a
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 71c.a
    text: |-
      een referentie aan de hand waarvan de betaler kan bepalen om welke betalingstransactie het gaat, en, in voorkomend
      geval, de informatie betreffende de betalingsbegunstigde;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71c
  - number: 71c.b
    text: het bedrag van de betalingstransactie in de in de betalingstransactie gebruikte valuta;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71c
  - number: 71c.c
    text: |-
      het bedrag van de voor de betalingstransactie door de betaler verschuldigde kosten en, voor zover van toepassing,
      de splitsing van de bedragen van dergelijke kosten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71c
  - number: 71c.d
    text: |-
      voor zover van toepassing, de bij de betalingstransactie gehanteerde wisselkoers, of een desbetreffende referentie,
      indien deze verschilt van de overeenkomstig [artikel 59b, eerste lid, onderdeel d][ref1], aangeboden wisselkoers,
      en het bedrag van de betalingstransactie na die valutawissel; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59b
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59b
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 71c.e
    text: de datum van ontvangst van de betaalopdracht.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71c
  - number: 71d
    text: |-
      Een betaaldienstverlener verstrekt onmiddellijk na de uitvoering van een eenmalige betalingstransactie de volgende
      informatie aan de betalingsbegunstigde op dezelfde wijze als in [artikel 59a, eerste tot en met derde lid][ref1],
      is bepaald, of stelt deze aan hem ter beschikking:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59a
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 71d.a
    text: |-
      de referentie aan de hand waarvan de betalingsbegunstigde kan bepalen welke betalingstransactie en, in voorkomend
      geval, welke betaler het betreft, en alle bij de betalingstransactie gevoegde informatie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71d
  - number: 71d.b
    text: |-
      het bedrag van de betalingstransactie, in de valuta waarin de geldmiddelen ter beschikking van de
      betalingsbegunstigde worden gesteld;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71d
  - number: 71d.c
    text: |-
      het bedrag van de voor de betalingstransactie door de betalingsbegunstigde verschuldigde kosten en, voor zover van
      toepassing, de splitsing van de bedragen van dergelijke kosten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71d
  - number: 71d.d
    text: |-
      voor zover van toepassing, de door de betaaldienstverlener van de betalingsbegunstigde bij de betalingstransactie
      gehanteerde wisselkoers, en het bedrag van de betalingstransactie voor die valutawissel; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71d
  - number: 71d.e
    text: de valutadatum van de creditering.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71d
  - number: 71e
    text: |-
      In geval van een door de betaler geïnitieerde afzonderlijke betalingstransactie uit hoofde van een raamovereenkomst
      voor betaaldiensten, verstrekt een betaaldienstverlener op verzoek van de betaler voor deze betalingstransactie
      informatie over de maximum uitvoeringstermijn en de door de betaler verschuldigde kosten en, voor zover van
      toepassing, de splitsing van de bedragen van eventuele kosten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71e
  - number: 71f.1
    text: |-
      Nadat het bedrag van een afzonderlijke betalingstransactie uit hoofde van een raamovereenkomst voor betaaldiensten
      van de betaalrekening van de betaler is gedebiteerd of, indien de betaler geen betaalrekening gebruikt, na
      ontvangst van de betaalopdracht, verstrekt de betaaldienstverlener van de betaler op de wijze bepaald in
      [artikel 59c, eerste en tweede lid][ref1], de betaler onverwijld de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59c
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 71f.1.a
    text: |-
      een referentie aan de hand waarvan de betaler kan bepalen welke betalingstransactie het betreft en, in voorkomend
      geval, informatie betreffende de betalingsbegunstigde;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71f
  - number: 71f.1.b
    text: |-
      het bedrag van de betalingstransactie in de valuta waarin de betaalrekening van de betaler wordt gedebiteerd of in
      de voor de betaalopdracht gebruikte valuta;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71f
  - number: 71f.1.c
    text: |-
      het bedrag van de voor de betalingstransactie door de betaler verschuldigde kosten en, voor zover van toepassing,
      de splitsing daarvan, ofwel de aan de betaler in rekening te brengen interesten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71f
  - number: 71f.1.d
    text: |-
      voor zover van toepassing, de door de betaaldienstverlener van de betaler bij de betalingstransactie gehanteerde
      wisselkoers, en het bedrag van de betalingstransactie na die valutawissel; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71f
  - number: 71f.1.e
    text: de valutadatum van de debitering of de datum van ontvangst van de betaalopdracht.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71f
  - number: 71f.2
    text: |-
      In een raamovereenkomst voor betaaldiensten kan, in afwijking van het eerste lid, worden bepaald dat de in het
      eerste lid bedoelde informatie op gezette tijden en ten minste eenmaal per maand wordt verstrekt of ter beschikking
      gesteld op de overeengekomen wijze die de betaler de mogelijkheid biedt informatie ongewijzigd op te slaan en te
      reproduceren.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71f
  - number: 71g.1
    text: |-
      Na de uitvoering van een afzonderlijke betalingstransactie verstrekt de betaaldienstverlener van de
      betalingsbegunstigde op de wijze als bepaald in [artikel 59c, eerste en tweede lid][ref1], de betalingsbegunstigde
      onverwijld de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59c
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71g
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59c
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 71g.1.a
    text: |-
      de referentie aan de hand waarvan de betalingsbegunstigde kan bepalen welke betalingstransactie het betreft en, in
      voorkomend geval, welke betaler het betreft, en alle bij de betalingstransactie gevoegde informatie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71g
  - number: 71g.1.b
    text: |-
      het bedrag van de betalingstransactie, in de valuta waarin de rekening van de betalingsbegunstigde wordt
      gecrediteerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71g
  - number: 71g.1.c
    text: |-
      het bedrag van de voor de betalingstransactie door de betaler verschuldigde kosten en, voor zover van toepassing,
      de splitsing daarvan, ofwel de aan de betalingsbegunstigde in rekening te brengen interesten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71g
  - number: 71g.1.d
    text: |-
      voor zover van toepassing, de door de betaaldienstverlener van de betalingsbegunstigde bij de betalingstransactie
      gehanteerde wisselkoers, en het bedrag van de betalingstransactie voor die valutawissel; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71g
  - number: 71g.1.e
    text: de valutadatum van de creditering.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71g
  - number: 71g.2
    text: |-
      In een raamovereenkomst voor betaaldiensten kan de voorwaarde worden opgenomen dat de in het eerste lid bedoelde
      informatie op gezette tijden en ten minste eenmaal per maand wordt verstrekt of ter beschikking wordt gesteld op
      een overeengekomen wijze die de betalingsbegunstigde de mogelijkheid biedt informatie ongewijzigd op te slaan en
      te reproduceren.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71g
  - number: 71h.1
    text: |-
      Een betaaldienstverlener verstrekt de betaaldienstgebruiker op diens verzoek de in de
      [artikelen 71f, eerste lid][ref1], en [71g, eerste lid][ref2], bedoelde informatie eenmaal per maand schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel71f
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel71g
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71h
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 71f
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 71g
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 71h.2
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van betaaldienstgebruikers aan wie via de website van de
      betaaldienstverlener de in het eerste lid bedoelde informatie wordt verstrekt, mits de betaaldienstgebruiker
      geheel of nagenoeg geheel via de website van deze betaaldienstverlener gebruik maakt van de door de desbetreffende
      betaaldienstverlener verleende betaaldiensten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71h
  - number: 71i.1
    text: |-
      Met betrekking tot betaalinstrumenten die overeenkomstig een raamovereenkomst voor betaaldiensten uitsluitend
      worden gebruikt voor afzonderlijke betalingstransacties van maximaal € 30, met een uitgavenlimiet van € 150 of
      waarop maximaal een bedrag van € 150 tegelijk kan worden opgeslagen verstrekt de betaaldienstverlener, in afwijking
      van [artikel 71e][ref1], de betaler uitsluitend informatie over de voornaamste kenmerken van de betaaldienst, met
      inbegrip van de wijze waarop van het betaalinstrument gebruik kan worden gemaakt, de aansprakelijkheid, alle in
      rekening gebrachte kosten en andere belangrijke informatie die nodig is om een weloverwogen besluit te nemen;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel71e
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71i
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 71e
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 71i.2
    text: |-
      Een betaaldienstverlener kan, in afwijking van de [artikelen 71f tot en met 71h][ref1], met de
      betaaldienstgebruiker overeenkomen dat de betaaldienstverlener na uitvoering van een betalingstransactie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel71f
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71i
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 71f
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 71i.2.1°
    text: |-
      uitsluitend een referentie verstrekt of beschikbaar stelt waarmee de betaaldienstgebruiker van de betaaldienst
      de betalingstransactie, het daarmee gemoeide bedrag en de kosten ervan kan identificeren, of in het geval van
      verschillende gelijkaardige betalingstransacties aan dezelfde betalingsbegunstigde, uitsluitend informatie over het
      totale bedrag en de kosten van deze betalingstransacties;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71i
  - number: 71i.2.2°
    text: |-
      niet verplicht is de onder 1° bedoelde informatie te verstrekken of beschikbaar te stellen als het betaalinstrument
      anoniem wordt gebruikt of als verstrekking hiervan voor de betaaldienstverlener uit technisch oogpunt onmogelijk
      is, waarbij de betaaldienstverlener de betaler echter een mogelijkheid biedt de opgeslagen bedragen te verifiëren.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71i
  - number: 71i.2
    text: Voor nationale betalingstransacties worden de in het eerste lid genoemde bedragen verdubbeld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71i
  - number: 71i.3
    text: |-
      Voor vooraf betaalde betaalinstrumenten, bedoeld voor nationale betalingstransacties, worden de in het eerste lid
      genoemde bedragen verhoogd tot € 500.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71i
  - number: 71j.1
    text: |-
      Indien een betalingsbegunstigde een vergoeding verlangt of een korting aanbiedt voor het gebruik van een bepaald
      betaalinstrument, informeert hij de betaler daarover voordat de betalingstransactie wordt geïnitieerd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71j
  - number: 71j.2
    text: |-
      Indien een betaaldienstverlener of een derde een vergoeding verlangt voor het gebruik van een bepaald
      betaalinstrument, informeert hij de betaaldienstgebruiker daarover voordat de betalingstransactie wordt
      geïnitieerd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71j
  - number: 71k
    text: |-
      [Artikel 59f][ref1] is van overeenkomstige toepassing op de ingevolge de [artikelen 71b tot en met 71j][ref2] te
      verstrekken of ter beschikking te stellen informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59f
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel71b
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71k
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59f
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 71b
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 71l
    text: |-
      Betaalinstellingen dragen er zorg voor dat betaaldienstagenten die voor hun rekening handelen, de
      betaaldienstgebruiker daarvan in kennis stellen. Zij dragen er tevens zorg voor dat hun bijkantoren de
      betaaldienstgebruikers in kennis stellen van het feit bijkantoor te zijn van de betaalinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel71l
  - number: '72.1'
    text: |-
      Een gevolmachtigde agent of ondergevolmachtigde agent die voor rekening van een verzekeraar een verzekering heeft
      gesloten, vermeldt in de polis dan wel in een daaraan toegevoegd aanhangsel de naam van de verzekeraar en, in geval
      van co-assurantie, het aandeel dat hij namens de verzekeraar heeft geaccepteerd. In geval van een schadeverzekering
      vermeldt hij tevens elke wijziging in het door hem namens de verzekeraar geaccepteerde aandeel in een aanhangsel.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel72
  - number: '72.2'
    text: |-
      Wordt, nadat de gevolmachtigde agent of ondergevolmachtigde agent de verzekering heeft gesloten of, in geval van
      een schadeverzekering, het door de gevolmachtigde agent onderscheidenlijk ondergevolmachtigde agent geaccepteerde
      aandeel in de verzekering is gewijzigd, niet of niet onverwijld aan de cliënt een polis of aanhangsel gegeven,
      dan verstrekt de gevolmachtigde agent onderscheidenlijk de ondergevolmachtigde agent de in het eerste lid bedoelde
      gegevens aan de cliënt binnen vier weken na het sluiten van de verzekering of na het aanbrengen van de wijziging.
      Behoort de verzekering evenwel tot de portefeuille van een bemiddelaar, dan verstrekt de gevolmachtigde agent
      onderscheidenlijk de ondergevolmachtigde agent deze gegevens binnen twee weken aan deze bemiddelaar.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel72
  - number: '72.3'
    text: |-
      Wordt, nadat een verzekering is gesloten of, in geval van een schadeverzekering, het door de verzekeraar
      geaccepteerde aandeel in de overeenkomst is gewijzigd, niet of niet onverwijld aan de cliënt een polis of
      aanhangsel afgegeven waarin de naam van de verzekeraar en, in geval van co-assurantie, diens aandeel of daarin
      aangebrachte wijziging is vermeld, dan verstrekt de bemiddelaar tot wiens portefeuille de verzekering behoort deze
      gegevens binnen vier weken na het sluiten van de overeenkomst of na het aanbrengen van de wijziging aan de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel72
  - number: '72.4'
    text: |-
      Het tweede en derde lid zijn niet van toepassing indien binnen de desbetreffende termijn de verzekering is
      tenietgegaan en daaraan door de cliënt of andere belanghebbenden geen rechten meer kunnen worden ontleend.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel72
  - number: '72.5'
    text: |-
      De gevolmachtigde agent onderscheidenlijk ondergevolmachtigde agent of de betrokken bemiddelaar stelt de cliënt
      desgevraagd onverwijld in kennis van de naam van de verzekeraar en, in geval van co-assurantie, van de aandelen die
      de verzekeraars hebben geaccepteerd of van wijzigingen die daarin zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel72
  - number: '73.1'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een levensverzekering verstrekt een levensverzekeraar de cliënt,
      voorzover van toepassing, ten minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
  - number: 73.1.a
    text: iedere wijziging van zijn handelsnaam of handelsnamen, statutaire naam, rechtsvorm of adres;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
  - number: 73.1.b
    text: iedere wijziging van de polisvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
  - number: 73.1.c
    text: |-
      voorzover zulks niet blijkt uit een wijziging van de polisvoorwaarden: iedere wijziging van
      de overeenkomst met betrekking tot de in de [artikelen 57, eerste lid, onderdeel c][ref1], en
      [artikel 60, eerste lid, onderdelen b tot en met m, en o tot en met s][ref2], bedoelde onderwerpen of van de op die
      onderdelen van toepassing zijnde regelgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 73.1.d
    text: de jaarlijkse winstdeling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
  - number: 73.1.e
    text: |-
      indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling: een jaarlijkse opgave
      over het voorafgaande jaar van:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
  - number: 73.1.e.1°
    text: de waarde-ontwikkeling van het opgebouwde kapitaal;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
  - number: 73.1.e.2°
    text: |-
      de door de cliënt betaalde premies, bedoeld in [artikel 60, eerste lid, onderdeel i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 73.1.e.3°
    text: |-
      de met de cliënt verrekende kosten, bedoeld in [artikel 60, eerste lid, onderdeel l, onder 1°, 2° en 3°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 73.1.e.4°
    text: het op het opgebouwde kapitaal behaalde rendement;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
  - number: 73.1.f
    text: |-
      indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling: een jaarlijkse prognose
      van de hoogte van het eindkapitaal op basis van een pessimistische voorspelling of het historisch rendement;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
  - number: 73.1.g
    text: |-
      indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling: het gevoerde beheer van
      de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
  - number: 73.1.h
    text: |-
      indien de cliënt daarom verzoekt: een opgave van de premievrije waarde op de einddatum van de verzekering,
      onder vermelding van het voor de berekening gehanteerde rendementspercentage, of een opgave van de wegens afkoop
      verschuldigde kosten en de actuele afkoopwaarde.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
  - number: '73.2'
    text: |-
      Indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling verstrekt de
      levensverzekeraar, onverminderd het eerste lid, aanhef en onderdeel h, aan de cliënt die verzoekt zijn premie
      te verhogen of te verlagen of zijn polis premievrij te maken: een aan de nieuwe premie aangepaste opgave
      overeenkomstig [artikel 60, eerste lid, onderdeel l, onder 1°, 2° en 3°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: '73.3'
    text: |-
      Het eerste lid, aanhef en onderdelen e, f en h, en het tweede lid zijn niet van toepassing indien de cliënt een
      werkgever is die de overeenkomst heeft afgesloten ten behoeve van zijn werknemers in verband met een door hem
      toegezegd pensioen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel73
  - number: '74'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een natura-uitvaartverzekering of een overeenkomst die strekt
      tot fondsvorming ter voldoening van de verzorging van de uitvaart van een natuurlijke persoon verstrekt een natura-
      uitvaartverzekeraar de cliënt, voorzover van toepassing, ten minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel74
  - number: 74.a
    text: iedere wijziging van zijn handelsnaam of handelsnamen, statutaire naam, rechtsvorm of adres;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel74
  - number: 74.b
    text: iedere wijziging van de polisvoorwaarden; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel74
  - number: 74.c
    text: |-
      voorzover zulks niet blijkt uit een wijziging van de polisvoorwaarden: iedere wijziging van
      de overeenkomst ten aanzien van de in de [artikelen 57, eerste lid, onderdeel c][ref1], en
      [63, eerste lid, onderdelen b tot en met h, j en l][ref2] bedoelde onderwerpen of van de op die onderdelen van
      toepassing zijnde regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel63
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '63'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: '75'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een schadeverzekering stelt een schadeverzekeraar met zetel
      buiten Nederland die de branche Aansprakelijkheid Motorrijtuigen uitoefent door middel van het verrichten van
      diensten naar Nederland de cliënt binnen twee weken in kennis van een wijziging in de naam of het adres van de
      schade-afhandelaar, bedoeld in [artikel 4:71, eerste lid, onderdeel e, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '77.1'
    text: |-
      In afwijking van [artikel 57][ref1] en onverminderd de [artikelen 60 tot en met 63][ref2] verstrekt een
      financiëledienstverlener een consument voorafgaand aan de totstandkoming van een overeenkomst op afstand, voorzover
      van toepassing, ten minste de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 77.1.a
    text: |-
      zijn naam en adres, de hoedanigheid waarin hij optreedt tegenover de consument en, indien de
      financiëledienstverlener een rechtspersoon is, de statutaire naam en handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.b
    text: de aard van zijn financiële dienstverlening;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.c
    text: |-
      voorzover [artikel 4:17 van de wet][ref1] van toepassing is: zijn interne klachtenprocedure, bedoeld in
      [artikel 4:17, eerste lid, onderdeel a, van de wet][ref2] en de erkende geschilleninstantie waarbij hij is
      aangesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 77.1.d
    text: zijn inschrijving in het door de toezichthouder gehouden register;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.e
    text: |-
      de naam van de Kamer van Koophandel en Fabrieken in het handelsregister waarvan hij is ingeschreven en het nummer
      van de inschrijving;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.f
    text: de belangrijkste kenmerken van het financiële product;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.g
    text: de risico’s die met het financiële product samenhangen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.h
    text: |-
      de totale kosten of, wanneer de exacte kosten niet kunnen worden genoemd, de grondslag voor de berekening van de
      kosten, zodat de consument de kosten kan verifiëren;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.i
    text: |-
      de omstandigheid dat de consument andere bedragen verschuldigd kan zijn die niet via de financiëledienstverlener
      worden betaald of door hem worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.j
    text: de extra kosten voor het gebruik van een techniek voor communicatie op afstand;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.k
    text: de wijze van betaling door de consument en de wijze van uitvoering van de overeenkomst op afstand;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.l
    text: beperkingen in de geldigheidsduur van de verstrekte informatie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.m
    text: de minimale looptijd van de overeenkomst op afstand;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.n
    text: |-
      het contractuele recht op tussentijdse beëindiging van de overeenkomst op afstand en de eventuele boete verbonden
      aan de uitoefening van dat recht;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.o
    text: |-
      het feit dat het in [artikel 4:28, eerste en tweede lid, van de wet][ref1] bedoelde recht wel of niet van
      toepassing is, de duur van en de voorwaarden voor de uitoefening van dat recht, met inbegrip van informatie over
      het bedrag dat de consument gehouden kan zijn te betalen, de gevolgen van niet-uitoefening van dat recht en de
      wijze waarop dat recht kan worden uitgeoefend;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 77.1.p
    text: |-
      het bestaan van op de overeenkomst op afstand toepasselijke garantiefondsen of andere compensatieregelingen die
      niet vallen onder [richtlijn nr. 1994/19/EG](31994L0019) van het Europees Parlement en de Raad van de Europese Unie
      van 30 mei 1994 inzake de depositogarantiestelsels (PbEG L 135) en [richtlijn nr. 1997/9/EG](31997L0009) van het
      Europees Parlement en de Raad van de Europese Unie van 3 maart 1997 inzake de beleggerscompensatiestelsels (PbEG
      L 084);
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.q
    text: |-
      de taal of de talen waarin de voorwaarden van de overeenkomst op afstand en de in dit artikel bedoelde informatie
      worden verstrekt, alsmede de taal of talen waarin de financiëledienstverlener zal communiceren gedurende de
      looptijd van de overeenkomst op afstand;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.r
    text: |-
      het op de totstandbrenging van betrekkingen met de consument voorafgaand aan de totstandkoming van de overeenkomst
      op afstand toe te passen recht, het op die overeenkomst toe te passen recht en de bevoegde rechter;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.s
    text: de overige voorwaarden van de overeenkomst op afstand; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: 77.1.t
    text: |-
      indien hij gebruik maakt van een andere beroepsbeoefenaar, de naam en adres van deze beroepsbeoefenaar en, indien
      deze een rechtspersoon is, diens statutaire naam en handelsnaam of handelsnamen, en de hoedanigheid waarin deze
      tegenover de consument optreedt
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
  - number: '77.2'
    text: |-
      Een financiëledienstverlener die financiële diensten verleent met betrekking tot levensverzekeringen voldoet
      aan het eerste lid, aanhef en onderdelen f, g, h, m, n en s, door het verstrekken van de informatie, bedoeld in
      [artikel 60, eerste lid, onderdelen h, i, l, m, n, o, p, r, s en t][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: '77.3'
    text: |-
      Een financiëledienstverlener die financiële diensten verleent met betrekking tot natura-uitvaartverzekeringen
      voldoet aan het eerste lid, aanhef en onderdeel n, door het verstrekken van de informatie, bedoeld in
      [artikel 63, eerste lid, onderdelen h, i, en j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel63
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '63'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: '77.4'
    text: |-
      Een financiëledienstverlener die financiële diensten verleent met betrekking tot consumptief krediet voldoet aan
      het eerste lid door het verstrekken van de informatie, bedoeld in [artikel 112, eerste en tweede lid][ref1], of,
      indien het krediet in de vorm van een geoorloofde debetstand wordt verleend waarbij is overeengekomen dat de ter
      zake verschuldigde betaling van de consument op verzoek of binnen een termijn van één tot drie maanden plaatsvindt,
      door het verstrekken van de informatie, bedoeld in [artikel 112a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel112a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '112'
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 112a
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
  - number: '77.5'
    text: |-
      Een financiëledienstverlener die financiële diensten verleent met betrekking tot effectenkrediet voldoet aan het
      eerste lid door het verstrekken van de informatie zoals opgenomen in [bijlage F][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '78.1'
    text: |-
      Indien een overeenkomst op afstand op verzoek van de consument tot stand is gekomen met gebruikmaking van een
      techniek voor communicatie op afstand waarmee de in [artikel 77][ref1] bedoelde informatie niet schriftelijk of via
      een andere duurzame drager als bedoeld in [artikel 49, eerste lid][ref2], voorafgaand aan de totstandkoming van de
      overeenkomst kan worden verstrekt, kan de financiëledienstverlener de informatie onmiddellijk na de totstandkoming
      van de overeenkomst op afstand aan de consument verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel49
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: 8.1.7
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
  - number: '78.2'
    text: |-
      In afwijking van [artikel 77, eerste lid, aanhef][ref1], verstrekt de financiëledienstverlener een consument de in
      dat artikel bedoelde informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel77
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: 8.1.7
        afdeling: '8.1'
  - number: 78.2.a
    text: |-
      indien het een overeenkomst op afstand inzake een schadeverzekering betreft, uiterlijk tegelijk met het afgeven van
      de polis;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel78
  - number: 78.2.b
    text: |-
      indien het een overeenkomst op afstand inzake een levensverzekering, inzake een natura-uitvaartverzekering of
      een overeenkomst op afstand die strekt tot fondsvorming ter voldoening van de verzorging van de uitvaart van
      een natuurlijke persoon betreft, uiterlijk tegelijk met het afgeven van de polis. Indien het een overeenkomst op
      afstand inzake een levensverzekering of een overeenkomst op afstand die strekt tot fondsvorming ter voldoening van
      de verzorging van de uitvaart van een natuurlijke persoon waarvan de waarde afhankelijk is van de ontwikkeling op
      financiële markten betreft, heeft de consument het recht zonder een boete verschuldigd te zijn en zonder opgave
      van redenen de overeenkomst binnen dertig kalenderdagen na de dag waarop hij de informatie heeft ontvangen,
      terugwerkend tot de datum van het tot stand komen van de overeenkomst, te ontbinden en wordt de consument door de
      financiëledienstverlener geïnformeerd over de wijze waarop hij gebruik kan maken van dat recht.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel78
  - number: '78.3'
    text: |-
      Voorzover het financiële risico ingevolge een overeenkomst op afstand inzake een levensverzekering voor rekening
      van de consument is, kan de financiëledienstverlener met de consument overeenkomen dat de eventueel na de
      totstandkoming van de overeenkomst opgetreden waardevermeerdering of -vermindering van de beleggingen voor
      rekening van de consument blijft indien deze de overeenkomst terugwerkend tot de datum van de totstandkoming van de
      overeenkomst ontbindt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel78
  - number: '78.4'
    text: |-
      Natura-uitvaartverzekeraars die overeenkomsten op afstand aangaan die strekken tot fondsvorming ter voldoening
      van de verzorging van de uitvaart van de mens en die overeenkomstig het tweede lid, onderdeel b, de in dat lid
      bedoelde informatie uiterlijk tegelijk met het afgeven van de polis verstrekken, komen met de consument overeen
      dat de eventueel na de totstandkoming van de overeenkomst opgetreden waardevermeerdering of -vermindering van
      de beleggingen voor rekening van de consument blijft, indien deze ingevolge het tweede lid, onderdeel b, de
      overeenkomst terugwerkend tot de datum van de totstandkoming van de overeenkomst ontbindt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel78
  - number: '79.1'
    text: |-
      Een financiëledienstverlener deelt aan een consument bij het gebruik van de telefoon voor het doen van ongevraagde
      oproepen ter bevordering van de totstandkoming van een overeenkomst op afstand, aan het begin van elk gesprek
      duidelijk de identiteit van de financiëledienstverlener, alsmede het commerciële oogmerk van de oproep mee. In
      afwijking van [artikel 77][ref1], kan de financiëledienstverlener in dergelijke oproepen, indien de consument
      daarmee uitdrukkelijk instemt, volstaan met het informeren van de consument over:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel77
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: 8.1.7
        afdeling: '8.1'
  - number: 79.1.a
    text: |-
      de identiteit van de persoon die in contact staat met de consument en de relatie van deze persoon met de
      financiëledienstverlener;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.1.b
    text: de belangrijkste kenmerken van het financiële product of de financiële dienst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.1.c
    text: |-
      de totale kosten, of, wanneer de exacte kosten niet kunnen worden genoemd, de grondslag voor de berekening van de
      kosten, zodat de consument de kosten kan verifiëren;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.1.d
    text: |-
      de omstandigheid dat de consument andere bedragen verschuldigd kan zijn die niet via de financiëledienstverlener
      worden betaald of door hem worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.1.e
    text: |-
      de toepasselijkheid van het in [artikel 4:28, eerste en tweede lid, van de wet][ref1] bedoelde recht, de duur van
      en de voorwaarden voor de uitoefening van dat recht, met inbegrip van informatie over het bedrag dat de consument
      gehouden kan zijn te betalen, de gevolgen van niet-uitoefening van dat recht; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 79.1.f
    text: |-
      de omstandigheid dat op verzoek van de consument andere informatie beschikbaar is, waarbij de aard van die
      informatie aan de consument wordt medegedeeld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: '79.2'
    text: |-
      Ten aanzien van consumptief krediet dat op verzoek van de consument met onmiddellijke ingang beschikbaar
      wordt gesteld, anders dan in de vorm van een geoorloofde debetstand waarbij is overeengekomen dat de ter zake
      verschuldigde betaling van de consument op verzoek of binnen een termijn van één tot drie maanden plaatsvindt, zijn
      de belangrijkste kenmerken, bedoeld in het eerste lid, onderdeel b, de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.2.a
    text: het jaarlijks kostenpercentage berekend voor een representatief voorbeeld;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.2.b
    text: het totale door de consument te betalen bedrag;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.2.c
    text: het totale kredietbedrag en de voorwaarden voor kredietopneming;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.2.d
    text: de duur van de kredietovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.2.e
    text: in geval van goederenkrediet, de roerende zaak of de dienst en de contante prijs daarvan;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.2.f
    text: |-
      de debetrentevoet, de voorwaarden die de toepassing van deze rentevoet regelen, en, voor zover beschikbaar, indices
      of referentierentevoeten die betrekking hebben op de aanvankelijke debetrentevoet, en de termijnen, de voorwaarden
      en de procedure voor wijziging daarvan; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.2.g
    text: |-
      het bedrag, het aantal en de frequentie van de door de consument te verrichten betalingen, en, indien van
      toepassing, de volgorde waarin de betalingen aan de verschillende openstaande saldi tegen verschillende
      debetrentevoeten worden toegerekend met het oog op de aflossing.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: '79.3'
    text: |-
      Ten aanzien van consumptief krediet in de vorm van een geoorloofde debetstand waarbij is overeengekomen
      dat de ter zake verschuldigde betaling van de consument op verzoek of binnen een termijn van één tot
      drie maanden plaatsvindt, zijn de belangrijkste kenmerken, bedoeld in het eerste lid, onderdeel b, de in
      [artikel 112a, tweede lid, onderdelen c, e, f en g][ref1], bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel112a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 112a
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
  - number: '79.4'
    text: |-
      Ten aanzien van effectenkrediet zijn de belangrijkste kenmerken, bedoeld in het eerste lid, onderdeel b, de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.4.a
    text: |-
      de debetrentevoet, de voorwaarden die de toepassing van deze rentevoet regelen, en, voor zover beschikbaar, indices
      of referentierentevoeten die betrekking hebben op de aanvankelijke debetrentevoet, en de termijnen, de voorwaarden
      en de procedure voor wijziging daarvan; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.4.b
    text: |-
      dat het krediet wordt verleend of toegezegd tegen onderpand van financiële instrumenten en dat de kredietlimiet
      afhankelijk is van een bepaald dekkingspercentage en indien van toepassing, bepaalde spreidingseisen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: 79.4.c
    text: |-
      welk dekkingspercentage en welke spreidingseisen worden gehanteerd ten aanzien van de in onderpand gegeven
      financiële instrumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
  - number: '79.4'
    text: |-
      Indien een overeenkomst op afstand tot stand komt via spraaktelefonie, verstrekt een financiëledienstverlener de
      in [artikel 77, eerste lid][ref1], bedoelde informatie onmiddellijk na de totstandkoming van de overeenkomst op
      afstand aan de consument. Voorzover het een overeenkomst inzake een levensverzekering, natura-uitvaartverzekering
      of schadeverzekering betreft, is [artikel 78, tweede lid, aanhef en onderdeel a][ref2], onderscheidenlijk het
      tweede lid, aanhef en onderdeel b, of het derde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel78
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: 8.1.7
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '78'
        hoofdstuk: '8'
        paragraaf: 8.1.7
        afdeling: '8.1'
  - number: '79.5'
    text: |-
      [Artikel 49, eerste lid, eerste volzin][ref1], is niet van toepassing op het verstrekken van informatie als bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel49
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
  - number: '80'
    text: |-
      Gedurende de looptijd van een overeenkomst op afstand verstrekt een financiëledienstverlener aan de consument op
      diens verzoek de voorwaarden van de overeenkomst. Voorts kan de consument het gebruik van een ander middel van
      communicatie op afstand verlangen, tenzij dat niet met de tot stand gekomen overeenkomst op afstand te verenigen
      is.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80
  - number: 80a.1
    text: |-
      De informatie, bedoeld in [artikel 4:23, eerste lid, aanhef en onderdeel a, van de wet][ref1], stelt de
      beleggingsonderneming in staat om vast te kunnen stellen dat een transactie waarop haar advies of beheer van een
      individueel vermogen betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 80a.1.a
    text: voldoet aan de beleggingsdoelstellingen van de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80a
  - number: 80a.1.b
    text: |-
      van dien aard is dat de cliënt de met zijn beleggingsdoelstellingen samenhangende beleggingsrisico’s financieel kan
      dragen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80a
  - number: 80a.1.c
    text: |-
      van dien aard is dat de cliënt, gelet op diens ervaring en kennis, kan begrijpen welke beleggingsrisico’s aan de
      transactie of aan het beheer van zijn portefeuille verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80a
  - number: 80a.2
    text: |-
      De informatie, bedoeld in het eerste lid, aanhef en onderdeel a, bevat gegevens over de duur van de periode waarin
      de cliënt de belegging wenst aan te houden, diens risicobereidheid en beleggingsdoelstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80a
  - number: 80a.3
    text: |-
      De informatie, bedoeld in het eerste lid, aanhef en onderdeel b, bevat gegevens over de bron en omvang van de
      periodieke inkomsten, het vermogen en de financiële verplichtingen van de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80a
  - number: 80a.4
    text: |-
      Een beleggingsonderneming die een professionele belegger adviseert over een financieel instrument handelt
      in overeenstemming met het eerste lid, onderdeel b, indien zij ervan uitgaat dat deze cliënt de met zijn
      beleggingsdoelstellingen samenhangende beleggingsrisico’s financieel kan dragen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80a
  - number: 80a.5
    text: |-
      Een beleggingsonderneming die een advies over financiële instrumenten verleent of een individueel vermogen beheert
      voor een professionele belegger handelt in overeenstemming met het eerste lid, onderdeel c, indien zij ervan
      uitgaat dat deze cliënt over de nodige ervaring en kennis beschikt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80a
  - number: 80b.1
    text: |-
      Een beleggingsonderneming die zonder daarbij te adviseren een andere beleggingsdienst verleent dan
      het beheren van een individueel vermogen, stelt bij de beoordeling van de passendheid, bedoeld in
      [artikel 4:24, eerste lid, van de wet][ref1], vast of de cliënt over de nodige ervaring en kennis beschikt om te
      begrijpen welke risico’s aan het betrokken financiële instrument en de betrokken beleggingsdienst verbonden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 80b.2
    text: |-
      Een beleggingsonderneming, als bedoeld in het eerste lid, die een beleggingsdienst verleent voor een professionele
      belegger, handelt in overeenstemming met het eerste lid, onderdeel c, indien zij ervan uitgaat dat deze cliënt over
      de nodige ervaring en kennis beschikt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80b
  - number: 80b.3
    text: |-
      Indien de cliënt vóór 1 november 2007 een reeks transacties met betrekking tot financiële instrumenten heeft
      verricht of vóór dat tijdstip een beleggingsdienst verscheidene malen heeft afgenomen, mag de beleggingsonderneming
      ervan uitgaan dat de cliënt met betrekking tot dat financiële instrument of die beleggingsdienst over de ervaring
      en kennis, bedoeld in het eerste lid, beschikt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80b
  - number: 80c.1
    text: |-
      De informatie over de kennis en ervaring van de cliënt, bedoeld in
      [artikel 4:23, eerste lid, onderdeel a, van de wet][ref1], voorzover deze redelijkerwijs relevant is voor
      een advies over financiële instrumenten of beheer van een individueel vermogen, en de informatie, bedoeld in
      [artikel 4:24, eerste lid, van de wet][ref2], is wat de hoeveelheid betreft evenredig aan het soort cliënt, de aard
      en omvang van de beleggingsdienst en het beoogde soort financiële instrument, de complexiteit ervan en de daarmee
      samenhangende risico’s, en bevat gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 80c.1.a
    text: het soort beleggingsdiensten en financiële instrumenten waarmee de cliënt vertrouwd is;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80c
  - number: 80c.1.b
    text: |-
      de aard, het volume en de frequentie van de transacties in financiële instrumenten van de cliënt en de periode
      waarin deze zijn verricht; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80c
  - number: 80c.1.c
    text: de opleiding en het beroep of, voor zover relevant, het vroegere beroep of de vroegere beroepen van de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80c
  - number: 80c.2
    text: |-
      Een beleggingsonderneming moedigt een cliënt niet aan om de informatie, bedoeld in
      [artikel 4:23, eerste lid, onderdeel a][ref1], en [artikel 4:24, eerste lid, van de wet][ref2] niet te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 80c.3
    text: |-
      Een beleggingsonderneming mag vertrouwen op de door de cliënt verstrekte informatie over de in
      [artikel 4:23, eerste lid, onderdeel a][ref1], en [artikel 4:24, eerste lid, van de wet][ref2] genoemde
      onderwerpen, tenzij zij weet of zou moeten weten dat deze informatie gedateerd, onnauwkeurig of onvolledig is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 80d
    text: |-
      Als financieel instrument in de zin van [artikel 4:24, vierde lid, onderdeel e, van de wet][ref1] worden aangewezen
      financiële instrumenten, niet zijnde financiële instrumenten als bedoeld in onderdeel c van de definitie van
      effecten in [artikel 1:1 van de wet][ref2] of financiële instrumenten als bedoeld in de onderdelen d tot en met j
      van de definitie van financieel instrument in [artikel 1:1 van de wet][ref3], voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 80d.a
    text: |-
      er zich regelmatig een gelegenheid voordoet om deze te verkopen, te gelde te maken of anderszins te realiseren
      tegen voor de marktdeelnemers publiekelijk beschikbare prijzen die hetzij marktprijzen zijn, hetzij prijzen die
      afkomstig zijn van of gevalideerd door waarderingssystemen die onafhankelijk zijn van de uitgevende instelling
      of beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80d
  - number: 80d.b
    text: |-
      deze voor de cliënt geen andere verplichtingen met zich brengen dan de betaling van de aanschaffingskosten ervan;
      en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80d
  - number: 80d.c
    text: |-
      voor het publiek informatie beschikbaar is over de kenmerken ervan die goed te begrijpen is, zodat cliënten,
      die geen professionele belegger zijn, met kennis van zaken een beslissing over een eventuele transactie in deze
      financiële instrumenten kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel80d
  - number: '81.1'
    text: |-
      Het gebruik van automatische oproepsystemen zonder menselijke tussenkomst, faxen of elektronische berichten
      voor het overbrengen van ongevraagde informatie aan een consument, ter bevordering van de totstandkoming van een
      overeenkomst op afstand, is uitsluitend toegestaan indien de consument daarvoor voorafgaand toestemming heeft
      verleend. Er zijn voor de consument geen kosten verbonden aan het verlenen van deze toestemming.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel81
  - number: '81.2'
    text: |-
      Het gebruik van andere dan de in het eerste lid genoemde technieken voor communicatie op afstand voor het
      overbrengen van ongevraagde informatie of het doen van ongevraagde mededelingen aan een consument, ter bevordering
      van de totstandkoming van een overeenkomst op afstand, is toegestaan, tenzij de desbetreffende consument te kennen
      heeft gegeven dat hij informatie of mededelingen waarbij van deze technieken gebruik wordt gemaakt, niet wenst te
      ontvangen. Er zijn voor de consument geen kosten verbonden aan voorzieningen waarmee wordt voorkomen dat aan een
      consument ongevraagde informatie wordt overgebracht.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel81
  - number: '81.3'
    text: |-
      Een financiële onderneming die elektronische contactgegevens voor elektronische berichten heeft verkregen in
      het kader van de verkoop van een financieel product of het verlenen van een financiële dienst mag deze gegevens
      gebruiken voor het overbrengen van informatie ter bevordering van de totstandkoming van een overeenkomst op afstand
      met betrekking tot eigen gelijksoortige financiële producten of financiële diensten, indien bij de verkrijging
      van de contactgegevens aan de consument duidelijk en uitdrukkelijk de gelegenheid is geboden om kosteloos en op
      gemakkelijke wijze verzet aan te tekenen tegen het gebruik van die elektronische contactgegevens, en, indien de
      consument hiervan geen gebruik heeft gemaakt, hem bij elke tot stand gebrachte communicatie de mogelijkheid wordt
      geboden om onder dezelfde voorwaarden verzet aan te tekenen tegen het verdere gebruik van zijn elektronische
      contactgegevens. [Artikel 41, tweede lid, van de Wet bescherming persoonsgegevens][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel41
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '41'
  - number: '81.4'
    text: |-
      Bij het gebruik van elektronische berichten ter bevordering van de totstandkoming van een overeenkomst op afstand
      dienen telkens de volgende gegevens te worden vermeld:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel81
  - number: 81.4.a
    text: de werkelijke identiteit van degene namens wie de communicatie wordt overgebracht, en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel81
  - number: 81.4.b
    text: |-
      een geldig postadres of nummer waaraan de ontvanger een verzoek tot beëindiging van dergelijke communicatie kan
      richten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel81
  - number: '82.1'
    text: |-
      Een beheerder, beleggingsmaatschappij of beleggingsonderneming benadert personen die geen professionele
      belegger zijn, die geen deelnemer zijn in de beleggingsinstelling of aan wie de beleggingsonderneming nog geen
      beleggingsdienst heeft verleend, direct noch indirect in persoon, anders dan door middel van een techniek voor
      communicatie op afstand als bedoeld in [artikel 81][ref1], tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel81
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '81'
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 82.1.a
    text: de betrokkene daarmee vooraf uitdrukkelijk schriftelijk dan wel elektronisch mee heeft ingestemd; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel82
  - number: 82.1.b
    text: de betrokkene in het contact slechts informatiemateriaal wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel82
  - number: '82.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel82
  - number: 82.2.a
    text: |-
      beheerders van instellingen voor collectieve beleggingen in effecten met zetel in een andere lidstaat, instellingen
      voor collectieve beleggingen in effecten met zetel in effecten met zetel in een ander lidstaat en de eventueel aan
      die instellingen verbonden bewaarders; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel82
  - number: 82.2.b
    text: |-
      beheerders van beleggingsinstellingen met zetel in een aangewezen staat, beleggingsinstellingen met zetel in
      effecten met zetel in een aangewezen staat en de eventueel aan die beleggingsinstellingen verbonden bewaarders.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel82
  - number: '83.1'
    text: |-
      Een beheerder, beleggingsmaatschappij of bewaarder handelt in het belang van de deelnemers in de
      beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel83
  - number: '83.2'
    text: Een beheerder of beleggingsmaatschappij behandelt deelnemers onder vergelijkbare omstandigheden op gelijke wijze.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel83
  - number: '83.3'
    text: |-
      Door of namens een beleggingsinstelling worden geen transacties uitgevoerd voor haar rekening met een zodanige
      frequentie of van een zodanige omvang dat dit gezien de omstandigheden kennelijk slechts strekt tot bevoordeling
      van de beheerder, de beleggingsinstelling of met de beheerder, beleggingsmaatschappij of bewaarder gelieerde
      partijen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel83
  - number: '83.4'
    text: 'Het eerste tot en met derde lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel83
  - number: 83.4.a
    text: |-
      beheerders van instellingen voor collectieve beleggingen in effecten met zetel in een andere lidstaat, instellingen
      voor collectieve beleggingen in effecten met zetel in effecten met zetel in een ander lidstaat en de eventueel aan
      die instellingen verbonden bewaarders; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel83
  - number: 83.4.b
    text: |-
      beheerders van beleggingsinstellingen met zetel in een aangewezen staat, beleggingsinstellingen met zetel in
      effecten met zetel in een aangewezen staat en de eventueel aan die beleggingsinstellingen verbonden bewaarders.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel83
  - number: '84'
    text: |-
      Een beleggingsonderneming onthoudt zich van het uitvoeren van transacties voor rekening van cliënten met een
      zodanige frequentie of van een zodanige omvang dat dit gezien de omstandigheden kennelijk slechts strekt tot
      bevoordeling van de beleggingsonderneming, tenzij sprake is van transacties waarvoor de cliënt op eigen initiatief
      uitdrukkelijk opdracht heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel84
  - number: '85'
    text: |-
      Een beleggingsonderneming verricht geen transactie voor rekening van een cliënt, indien de op naam van de cliënt
      aanwezige saldi ontoereikend zijn om aan de verplichtingen te voldoen die voortvloeien uit die transactie.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel85
  - number: '86.1'
    text: |-
      Een beleggingsonderneming ziet er op toe dat cliënten die posities hebben in financiële instrumenten waaruit
      verplichtingen kunnen voortvloeien voortdurend over voldoende saldi beschikken om aan de actuele verplichtingen die
      uit die posities voortvloeien te voldoen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel86
  - number: '86.2'
    text: |-
      Indien een cliënt als bedoeld in het eerste lid over onvoldoende saldi beschikt om te voldoen aan de actuele
      verplichtingen die voortvloeien uit posities in financiële instrumenten, ziet de beleggingsonderneming er op toe
      dat deze cliënt zekerheden stelt waaruit die verplichtingen kunnen worden voldaan. Indien de cliënt geen zekerheden
      kan stellen, sluit de beleggingsonderneming de posities zo spoedig mogelijk doch uiterlijk binnen vijf werkdagen
      tenzij er zich bijzondere omstandigheden voordoen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel86
  - number: 86a
    text: |-
      Een financiële onderneming voert een beleid inzake beloningen dat erop is gericht te voorkomen dat de beloning
      van degenen die het beleid van de onderneming bepalen of mede bepalen, haar werknemers en andere natuurlijke
      personen die zich onder haar verantwoordelijkheid bezighouden met het verlenen van financiële diensten of andere
      activiteiten leidt tot onzorgvuldige behandeling van consumenten, cliënten of deelnemers.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel86a
  - number: '87'
    text: |-
      Deze paragraaf is niet van toepassing op beheerders van instellingen voor collectieve belegging in effecten met
      zetel in een andere lidstaat en op beheerders van beleggingsinstellingen met zetel in een aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel87
  - number: '88.1'
    text: |-
      Een beheerder meldt aan de Autoriteit Financiële Markten een wijziging in de gegevens die eerder door hemzelf of
      door een andere financiële onderneming aan een toezichthouder zijn verstrekt ten behoeve van de beoordeling van de
      ingevolge de [wet][ref1] gestelde eisen met betrekking tot de betrouwbaarheid van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 88.1.a
    text: |-
      de personen die het beleid van de beheerder, van een door hem beheerde beleggingsmaatschappij of van een bewaarder
      die is verbonden aan een door hem beheerde beleggingsinstelling bepalen of mede bepalen; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel88
  - number: 88.1.b
    text: |-
      de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en de algemene gang van
      zaken van de beheerder, van een door hem beheerde beleggingsmaatschappij of van een bewaarder die is verbonden aan
      een door hem beheerde beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel88
  - number: '88.2'
    text: |-
      De beheerder meldt de wijziging schriftelijk en onverwijld nadat hij daarvan in het kader van de normale
      bedrijfsvoering kennis heeft genomen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel88
  - number: '89.1'
    text: |-
      Een beheerder meldt aan de Autoriteit Financiële Markten schriftelijk het voornemen tot wijziging van het
      registratiedocument, bedoeld in [artikel 4:48, eerste lid, van de wet][ref1], voorzover het betreft gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 89.1.a
    text: |-
      de activiteiten van de beheerder en de soorten beleggingsinstellingen die hij beheert of voornemens is te beheren,
      bedoeld in [onderdeel 1.b. van bijlage D][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 89.1.b
    text: |-
      de personen die het dagelijks beleid van de beheerder of van een bewaarder die is verbonden aan een door hem
      beheerde beleggingsinstelling bepalen, bedoeld in [onderdeel 2.1.a van bijlage D][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 89.1.c
    text: |-
      de personen die het beleid van de beheerder of van een bewaarder die is verbonden aan een door hem beheerde
      beleggingsinstelling bepalen of mede bepalen, bedoeld in [onderdeel 2.1.b. van bijlage D][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 89.1.d
    text: |-
      de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en de algemene gang
      van zaken van de beheerder of van een bewaarder die is verbonden aan een door hem beheerde beleggingsinstelling,
      bedoeld in [onderdeel 2.1.c van bijlage D][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 89.1.e
    text: |-
      de algemene gegevens betreffende de beheerder en de bewaarders, bedoeld in [onderdeel 3 van bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '89.2'
    text: |-
      De beheerder geeft geen uitvoering aan het voornemen, bedoeld in het eerste lid, aanhef en onderdeel a, voordat de
      Autoriteit Financiële Markten heeft ingestemd met de wijziging. De Autoriteit Financiële Markten neemt een besluit
      omtrent de instemming binnen vier weken na ontvangst van de melding.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: '89.3'
    text: |-
      De beheerder geeft geen uitvoering aan het voornemen, bedoeld in het eerste lid, aanhef en onderdeel b, c of d,
      voordat de Autoriteit Financiële Markten heeft ingestemd met de wijziging. De Autoriteit Financiële Markten neemt
      een besluit omtrent de instemming:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: 89.3.a
    text: binnen zes weken na ontvangst van de melding; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: 89.3.b
    text: |-
      indien de Autoriteit Financiële Markten binnen twee weken na ontvangst van de melding de beheerder of een derde
      om nadere gegevens heeft verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien
      weken na ontvangst van de melding.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: '89.4'
    text: |-
      Indien de Autoriteit Financiële Markten een derde verzoekt om nadere gegevens als bedoeld in het derde lid,
      onderdeel b, doet zij daarvan mededeling aan de beheerder.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: '89.5'
    text: |-
      Bij de melding, bedoeld in het eerste lid, aanhef en onderdeel b, legt de beheerder ten aanzien van te benoemen
      personen die het dagelijks beleid zullen bepalen de volgende gegevens over:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: 89.5.a
    text: een opgave van de naam, het privé-adres en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: 89.5.b
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: 89.5.c
    text: een opgave van de geldige relevante diploma’s;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: 89.5.d
    text: een kopie van een geldig identiteitsbewijs; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: 89.5.e
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: '89.6'
    text: |-
      Bij de melding, bedoeld in het eerste lid, aanhef en onderdelen c en d, legt de beheerder ten aanzien van te
      benoemen personen die het beleid zullen bepalen of mede bepalen of die onderdeel zullen zijn van een orgaan dat
      belast is met het toezicht op het beleid en de algemene gang van zaken de volgende gegevens over:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: 89.6.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: 89.6.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: 89.6.c
    text: |-
      gegevens met betrekking tot de antecedenten, bedoeld in [artikel 13][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel13
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '13'
        hoofdstuk: '3'
  - number: 89.6.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: '89.7'
    text: |-
      Het zesde lid, onderdelen b, c en d, is niet van toepassing indien de voorgenomen wijziging een persoon betreft
      wiens betrouwbaarheid voor de toepassing van de wet door een toezichthouder reeds is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel89
  - number: '90'
    text: |-
      Een beheerder zendt een afschrift van elke met een bewaarder gesloten overeenkomst alsmede van wijzigingen van een
      met een bewaarder gesloten overeenkomst binnen twee weken na ondertekening of wijziging van de overeenkomst aan de
      Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel90
  - number: '91.1'
    text: |-
      Een beheerder meldt een wijziging van de gegevens, bedoeld in
      [artikel 4:50, eerste lid, met uitzondering van onderdeel g, van de wet][ref1], van een door hem beheerde
      beleggingsinstelling ten minste twee weken voorafgaand aan de wijziging schriftelijk aan de Autoriteit Financiële
      Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '91.2'
    text: |-
      Een beheerder meldt een wijziging in de statuten van een door hem beheerde instelling voor collectieve belegging in
      effecten die een beleggingsmaatschappij is ten minste twee weken voorafgaand aan de wijziging schriftelijk aan de
      Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel91
  - number: '92.1'
    text: |-
      Een beheerder die vanuit een in een andere lidstaat gelegen bijkantoor rechten van deelneming in door hem beheerde
      instellingen voor collectieve belegging in effecten met zetel in Nederland aanbiedt, meldt aan de Autoriteit
      Financiële Markten en de toezichthoudende instantie van de andere lidstaat schriftelijk ten minste een maand
      tevoren:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel92
  - number: 92.1.a
    text: een wijziging in het adres in de lidstaat waar documenten kunnen worden opgevraagd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel92
  - number: 92.1.b
    text: een wijziging in de identiteit van de personen die het dagelijks beleid van het bijkantoor bepalen; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel92
  - number: 92.1.c
    text: |-
      het voornemen om het aanbieden van rechten van deelneming in door hem beheerde instellingen voor collectieve
      belegging in effecten vanuit het in de andere lidstaat gelegen bijkantoor te staken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel92
  - number: '92.2'
    text: |-
      Een beheerder die vanuit een in een andere lidstaat gelegen bijkantoor rechten van deelneming in door hem
      beheerde instellingen voor collectieve belegging in effecten met zetel in Nederland aanbiedt, meldt aan de
      Autoriteit Financiële Markten schriftelijk het voornemen tot wijziging van de financiële diensten die hij
      vanuit het bijkantoor verleent. De beheerder meldt de wijziging ten minste een maand tevoren schriftelijk aan de
      toezichthoudende instantie van de andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel92
  - number: '92.3'
    text: |-
      De beheerder geeft geen uitvoering aan het voornemen, bedoeld in het tweede lid, voordat de Autoriteit Financiële
      Markten heeft ingestemd met de wijziging. De Autoriteit Financiële Markten neemt een besluit omtrent instemming
      binnen twee maanden na ontvangst van de melding en stemt in met de wijziging, tenzij de bedrijfsvoering of de
      financiële positie van de beheerder gelet op de voorgenomen wijziging niet toereikend is.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel92
  - number: '93'
    text: Deze paragraaf is niet van toepassing op beleggingsondernemingen met zetel in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel93
  - number: '94.1'
    text: |-
      Een beleggingsonderneming meldt aan de Autoriteit Financiële Markten een wijziging in de gegevens die eerder
      door haarzelf of door een andere financiële onderneming aan een toezichthouder zijn verstrekt ten behoeve van de
      beoordeling van de ingevolge de [wet][ref1] gestelde eisen met betrekking tot de betrouwbaarheid van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 94.1.a
    text: de personen die het beleid van de beleggingsonderneming bepalen of mede bepalen; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel94
  - number: 94.1.b
    text: |-
      de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en de algemene gang van
      zaken van de beleggingsonderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel94
  - number: '94.2'
    text: |-
      De beleggingsonderneming meldt de wijziging schriftelijk en onverwijld nadat zij daarvan in het kader van de
      normale bedrijfsvoering kennis heeft genomen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel94
  - number: '94.3'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel94
  - number: 94.3.a
    text: |-
      beleggingsondernemingen die voor de uitoefening van het bedrijf van bank een door de Nederlandsche Bank verleende
      vergunning hebben of voor de uitoefening van het bedrijf van financiële instelling een door de Nederlandsche Bank
      verleende verklaring van ondertoezichtstelling hebben; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel94
  - number: 94.3.b
    text: |-
      beleggingsondernemingen die voor het beheren van een instelling voor collectieve belegging in effecten een door de
      Autoriteit Financiële Markten verleende vergunning hebben.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel94
  - number: '95.1'
    text: 'Een beleggingsonderneming meldt aan de Autoriteit Financiële Markten schriftelijk het voornemen tot wijziging van:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.1.a
    text: de personen die het dagelijks beleid van de beleggingsonderneming bepalen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.1.b
    text: de personen die het beleid van de beleggingsonderneming bepalen of mede bepalen; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.1.c
    text: |-
      de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en de algemene gang van
      zaken van de beleggingsonderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: '95.2'
    text: |-
      Een beleggingsonderneming geeft geen uitvoering aan het voornemen, bedoeld in het eerste lid, voordat de Autoriteit
      Financiële Markten heeft ingestemd met de wijziging. De Autoriteit Financiële Markten neemt een besluit omtrent
      de instemming:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.2.a
    text: binnen zes weken na ontvangst van de melding; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.2.b
    text: |-
      indien de Autoriteit Financiële Markten binnen twee weken na ontvangst van de melding de beleggingsonderneming of
      een derde om nadere gegevens heeft verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen
      dertien weken na ontvangst van de melding.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: '95.3'
    text: |-
      Indien de Autoriteit Financiële Markten een derde verzoekt om nadere gegevens als bedoeld in het tweede lid,
      onderdeel b, doet zij daarvan mededeling aan de beleggingsonderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: '95.4'
    text: |-
      Bij de melding, bedoeld in het eerste lid, onderdeel a, legt de beleggingsonderneming ten aanzien van te benoemen
      personen die het dagelijks beleid zullen bepalen de volgende gegevens over:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.4.a
    text: een opgave van de naam, het privé-adres en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.4.b
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.4.c
    text: een opgave van de relevante geldige diploma’s;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.4.d
    text: een kopie van een geldig identiteitsbewijs; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.4.e
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: '95.5'
    text: |-
      Bij de melding, bedoeld in het eerste lid, onderdelen b en c, legt de beleggingsonderneming ten aanzien van te
      benoemen personen die het beleid zullen bepalen of mede bepalen of die onderdeel zullen zijn van een orgaan dat
      belast is met het toezicht op het beleid en de algemene gang van zaken de volgende gegevens over:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.5.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.5.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.5.c
    text: |-
      gegevens met betrekking tot de antecedenten, bedoeld in [artikel 13][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel13
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '13'
        hoofdstuk: '3'
  - number: 95.5.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: '95.6'
    text: |-
      Het vijfde lid, onderdelen b, c en d, is niet van toepassing indien de wijziging een persoon betreft wiens
      betrouwbaarheid voor de toepassing van de wet door een toezichthouder reeds is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: '95.7'
    text: 'Het eerste tot en met vijfde lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.7.a
    text: |-
      beleggingsondernemingen die voor de uitoefening van het bedrijf van bank een door de Nederlandsche Bank verleende
      vergunning hebben of voor de uitoefening van het bedrijf van financiële instelling een door de Nederlandsche Bank
      verleende verklaring van ondertoezichtstelling hebben; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: 95.7.b
    text: |-
      beleggingsondernemingen die voor het beheren van een instelling voor collectieve belegging in effecten een door de
      Autoriteit Financiële Markten verleende vergunning hebben.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel95
  - number: '96.1'
    text: |-
      Een beleggingsonderneming meldt aan de Autoriteit Financiële Markten ten minste twee weken tevoren schriftelijk een
      wijziging in:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel96
  - number: 96.1.a
    text: |-
      de maatregelen, bedoeld in [artikel 4:83, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 96.1.b
    text: |-
      de maatregelen, bedoeld in [artikel 4:87, eerste en tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 96.1.c
    text: |-
      de onderdelen van de bedrijfsvoering met betrekking waartoe ingevolge
      [artikel 4:14, tweede lid, aanhef en onderdelen a en b][ref1], regels zijn gesteld, voorzover het een significante
      wijziging betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 96.1.d
    text: |-
      de onderdelen van de bedrijfsvoering waarover ingevolge [artikel 4:14, tweede lid, aanhef en onderdeel c][ref1],
      regels zijn gesteld, voorzover het een significante wijziging betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 96.1.e
    text: |-
      de naam en het adres van het hoofdkantoor van de beleggingsonderneming, en, indien zij haar zetel niet in Nederland
      heeft, het adres van het bijkantoor, alsmede, in voorkomend geval, de plaats van haar zetel;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel96
  - number: 96.1.f
    text: |-
      indien zij met personen in een formele of feitelijke zeggenschapsstructuur is verbonden: de samenstelling daarvan;
      of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel96
  - number: 96.1.g
    text: |-
      de financiële diensten die de beleggingsonderneming verleent of de financiële producten waarop deze diensten
      betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel96
  - number: '96.2'
    text: 'Het eerste lid, met uitzondering van de onderdelen b en d, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel96
  - number: 96.2.a
    text: |-
      beleggingsondernemingen die voor de uitoefening van het bedrijf van bank een door de Nederlandsche Bank verleende
      vergunning hebben of voor de uitoefening van het bedrijf van financiële instelling een door de Nederlandsche Bank
      verleende verklaring van ondertoezichtstelling hebben; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel96
  - number: 96.2.b
    text: |-
      beleggingsondernemingen die voor het beheren van een instelling voor collectieve belegging in effecten een door de
      Autoriteit Financiële Markten verleende vergunning hebben.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel96
  - number: '97.1'
    text: |-
      Een beleggingsonderneming met zetel in Nederland die vanuit een in een andere lidstaat gelegen bijkantoor
      beleggingsdiensten verleent, meldt aan de Autoriteit Financiële Markten en de toezichthoudende instantie van de
      andere lidstaat schriftelijk ten minste een maand tevoren:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel97
  - number: 97.1.a
    text: een wijziging van de financiële diensten die zij vanuit het bijkantoor verleent;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel97
  - number: 97.1.b
    text: een wijziging in het adres in de lidstaat waar documenten kunnen worden opgevraagd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel97
  - number: 97.1.c
    text: een wijziging in de identiteit van de personen die het dagelijks beleid bepalen van het bijkantoor; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel97
  - number: 97.1.d
    text: het voornemen om het verlenen van beleggingsdiensten vanuit het bijkantoor te staken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel97
  - number: '97.2'
    text: |-
      Het eerste lid, aanhef en onderdelen b en c, is niet van toepassing op beleggingsondernemingen die hebben voldaan
      aan [artikel 92][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel92
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '92'
        hoofdstuk: '9'
        paragraaf: 9.1.1
        afdeling: '9.1'
  - number: '98'
    text: |-
      Een beleggingsonderneming met zetel in Nederland die door middel van het verrichten van diensten naar een andere
      lidstaat beleggingsdiensten verleent, meldt aan de Autoriteit Financiële Markten en de toezichthoudende instantie
      van de andere lidstaat schriftelijk ten minste een maand tevoren:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel98
  - number: 98.a
    text: een wijziging van de financiële diensten die de beleggingsonderneming in de andere lidstaat verleent; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel98
  - number: 98.b
    text: |-
      het voornemen om het verlenen van beleggingsdiensten door middel van het verrichten van diensten naar de andere
      lidstaat te staken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel98
  - number: '99.1'
    text: |-
      Een beleggingsonderneming met zetel in Nederland die vanuit een in een staat die geen lidstaat is gelegen
      bijkantoor beleggingsdiensten verleent, meldt aan de Autoriteit Financiële Markten schriftelijk ten minste een
      maand tevoren:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel99
  - number: 99.1.a
    text: een wijziging in het adres van het bijkantoor;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel99
  - number: 99.1.b
    text: een wijziging in de identiteit van de personen die het dagelijks beleid bepalen van het bijkantoor; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel99
  - number: 99.1.c
    text: het voornemen om het verlenen van beleggingsdiensten vanuit het bijkantoor te staken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel99
  - number: '99.2'
    text: |-
      Een beleggingsonderneming met zetel in Nederland die vanuit een in een staat die geen lidstaat is gelegen
      bijkantoor beleggingsdiensten verleent, meldt aan de Autoriteit Financiële Markten schriftelijk het voornemen tot
      wijziging van:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel99
  - number: 99.2.a
    text: de financiële diensten die zij vanuit het bijkantoor verleent; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel99
  - number: 99.2.b
    text: de maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel99
  - number: '99.3'
    text: |-
      De beleggingsonderneming geeft geen uitvoering aan het voornemen, bedoeld in het tweede lid, voordat de Autoriteit
      Financiële Markten heeft ingestemd met de wijziging. De Autoriteit Financiële Markten neemt een besluit omtrent
      instemming binnen twee maanden na ontvangst van de melding en stemt in met de wijziging, tenzij de bedrijfsvoering
      of de financiële positie van de beleggingsonderneming gelet op de voorgenomen wijziging niet toereikend is.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel99
  - number: '99.4'
    text: |-
      Zodra de beleggingsonderneming het voornemen, bedoeld in het eerste lid, onderdeel c, uitvoert, meldt zij dit
      onverwijld aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel99
  - number: '99.5'
    text: |-
      De melding, bedoeld in het eerste en tweede lid, gaat vergezeld van een vertaling van de desbetreffende gegevens,
      voorzover de Autoriteit Financiële Markten dat verlangt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel99
  - number: '100'
    text: |-
      Een rechtspersoon als bedoeld in [artikel 2:105, eerste lid, van de wet][ref1] meldt aan de Autoriteit Financiële
      Markten binnen twee weken schriftelijk een wijziging in:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 100.a
    text: de naam en het adres van een aangesloten onderneming;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel100
  - number: 100.b
    text: de rechtsvorm van een aangesloten onderneming;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel100
  - number: 100.c
    text: |-
      indien een aangesloten onderneming een rechtspersoon is: de statutaire zetel, de statutaire naam en de handelsnaam
      of handelsnamen; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel100
  - number: 100.d
    text: 'indien een aangesloten onderneming is ingeschreven in het handelsregister: het nummer van de inschrijving.'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel100
  - number: '101'
    text: 'Deze paragraaf is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel101
  - number: 101.a
    text: bemiddelaars in verzekeringen met zetel in een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel101
  - number: 101.b
    text: |-
      financiëledienstverleners die voor de uitoefening van het bedrijf van kredietinstelling of verzekeraar een door de
      Nederlandsche Bank verleende vergunning hebben of voor de uitoefening van het bedrijf van financiële instelling een
      door de Nederlandsche Bank verleende verklaring van ondertoezichtstelling hebben;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel101
  - number: 101.c
    text: |-
      financiëledienstverleners met zetel in een andere lidstaat of een aangewezen staat die het bedrijf van financiële
      instelling, kredietinstelling of verzekeraar uitoefenen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel101
  - number: 101.d
    text: herverzekeringsbemiddelaars met zetel in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel101
  - number: '102.1'
    text: |-
      Een financiëledienstverlener meldt aan de Autoriteit Financiële Markten een wijziging in de gegevens die eerder
      door hemzelf of een andere financiële onderneming aan een toezichthouder zijn verstrekt ten behoeve van de
      beoordeling van de ingevolge de [wet][ref1] gestelde eisen met betrekking tot de betrouwbaarheid van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 102.1.a
    text: de personen die het beleid van de financiëledienstverlener bepalen of mede bepalen; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel102
  - number: 102.1.b
    text: |-
      de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en de algemene gang van
      zaken van de financiëledienstverlener.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel102
  - number: '102.2'
    text: |-
      De financiëledienstverlener meldt de wijziging schriftelijk en onverwijld nadat hij daarvan in het kader van de
      normale bedrijfsvoering kennis heeft genomen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel102
  - number: '102.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op financiëledienstverleners die tevens beheerder of
      beleggingsonderneming zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel102
  - number: '103.1'
    text: |-
      Een financiëledienstverlener meldt aan de Autoriteit Financiële Markten schriftelijk het voornemen tot benoeming
      van:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: 103.1.a
    text: een persoon die het beleid van de financiëledienstverlener bepaalt of mede bepaalt; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: 103.1.b
    text: |-
      een persoon die onderdeel is van een orgaan dat belast is met het toezicht op het beleid en de algemene gang van
      zaken van de financiëledienstverlener.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: '103.2'
    text: |-
      Een financiëledienstverlener geeft geen uitvoering aan het voornemen, bedoeld in het eerste lid, voordat de
      Autoriteit Financiële Markten heeft vastgesteld dat de betrouwbaarheid van de betrokken persoon buiten twijfel
      staat. De Autoriteit Financiële Markten neemt een besluit omtrent de betrouwbaarheid:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: 103.2.a
    text: binnen zes weken na ontvangst van de melding; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: 103.2.b
    text: |-
      indien de Autoriteit Financiële Markten binnen twee weken na ontvangst van de melding de financiëledienstverlener
      of een derde om nadere gegevens heeft verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk
      binnen dertien weken na ontvangst van de melding.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: '103.3'
    text: |-
      Indien de Autoriteit Financiële Markten een derde verzoekt om nadere gegevens als bedoeld in het tweede lid,
      onderdeel b, doet zij daarvan mededeling aan de financiëledienstverlener.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: '103.4'
    text: 'Bij de melding legt de financiëledienstverlener ten aanzien van de betrokken persoon de volgende gegevens over:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: 103.4.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: 103.4.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: 103.4.c
    text: |-
      gegevens met betrekking tot de antecedenten, bedoeld in [artikel 13][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel13
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '13'
        hoofdstuk: '3'
  - number: 103.4.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: '103.5'
    text: |-
      Het tweede en vierde lid, onderdelen b, c en d, zijn niet van toepassing indien de voorgenomen benoeming een
      persoon betreft wiens betrouwbaarheid voor de toepassing van de wet reeds is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel103
  - number: '104'
    text: |-
      Een financiëledienstverlener meldt aan de Autoriteit Financiële Markten binnen twee weken schriftelijk een
      wijziging in:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel104
  - number: 104.a
    text: zijn naam en adres;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel104
  - number: 104.b
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel104
  - number: 104.c
    text: 'indien hij een rechtspersoon is: zijn statutaire zetel, statutaire naam en handelsnaam of handelsnamen;'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel104
  - number: 104.d
    text: 'indien hij is ingeschreven in het handelsregister: het nummer van de inschrijving;'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel104
  - number: 104.e
    text: de financiële diensten die hij verleent of de financiële producten waarop deze diensten betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel104
  - number: 104.f
    text: 'indien hij een bemiddelaar in verzekeringen is: de natuurlijke personen die zijn beleid bepalen; of'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel104
  - number: 104.g
    text: |-
      indien hij een gevolmachtigde agent of ondergevolmachtigde agent is: de verzekeraar voor wie zijn volmacht geldt of
      de natuurlijke personen die zijn beleid bepalen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel104
  - number: '105'
    text: |-
      Een schadeverzekeraar met zetel in Nederland die de branche Aansprakelijkheid motorrijtuigen uitoefent of een
      schadeverzekeraar met zetel in een staat die geen lidstaat is die de branche Aansprakelijkheid motorrijtuigen
      uitoefent vanuit een in Nederland gelegen bijkantoor, meldt een wijziging in de naam of het adres van een door
      hem in een andere lidstaat aangestelde schaderegelaar als bedoeld in [artikel 4:70, tweede lid, van de wet][ref1]
      binnen twee weken schriftelijk aan de Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '106'
    text: |-
      Een schadeverzekeraar met zetel buiten Nederland die de branche Aansprakelijkheid motorrijtuigen uitoefent door
      middel van het verrichten van diensten naar Nederland meldt een wijziging in de akte van aanstelling van de
      schade-afhandelaar, bedoeld in [artikel 4:71, derde lid, van de wet][ref1] binnen twee weken schriftelijk aan de
      Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '107.1'
    text: |-
      De door een accountant als bedoeld in [artikel 4:27, tweede lid, van de wet][ref1] op grond van
      [artikel 4:27, vierde lid, van de wet][ref2] te verstrekken gegevens zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 107.1.a
    text: het accountantsverslag aan de bestuurders en de raad van commissarissen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel107
  - number: 107.1.b
    text: de directiebrieven; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel107
  - number: 107.1.c
    text: |-
      correspondentie tussen de accountant en de financiële onderneming die rechtstreeks betrekking heeft op de
      verklaring omtrent de getrouwheid van de jaarrekening van de financiële onderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel107
  - number: '107.2'
    text: |-
      De directiebrieven, bedoeld in het eerste lid, onderdeel b, met betrekking tot een beheerder en een
      beleggingsinstelling bevatten in ieder geval een verklaring van de accountant of en zo ja, in hoeverre hij de
      inrichting van de bedrijfsvoering heeft beoordeeld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel107
  - number: '108.1'
    text: |-
      Een accountant die voornemens is gegevens als bedoeld in [artikel 107][ref1] te verstrekken, stelt de financiële
      onderneming daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel107
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '107'
        hoofdstuk: '9'
        afdeling: '9.2'
  - number: '108.2'
    text: |-
      Indien de financiële onderneming dat wenst, kan zij zelf de gegevens aan de Autoriteit Financiële Markten
      verstrekken. In dat geval stelt zij de accountant daarvan in kennis. De accountant vergewist zich ervan dat de
      Autoriteit Financiële Markten de gegevens heeft ontvangen en dat de inhoud van de gegevens hem geen aanleiding
      geeft alsnog gegevens aan de Autoriteit Financiële Markten te verstrekken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel108
  - number: '108.3'
    text: |-
      Indien de accountant schriftelijk gegevens verstrekt aan de Autoriteit Financiële Markten, zendt hij onverwijld aan
      de financiële onderneming een afschrift van de gegevens en, indien van toepassing, van de begeleidende brief.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel108
  - number: '109'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt in afwijking van [artikel 1][ref1], verstaan onder
      gelieerde partij:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 109.a
    text: |-
      persoon die met een aanbieder van beleggingsobjecten in een formele of feitelijke zeggenschapsstructuur is
      verbonden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel109
  - number: 109.b
    text: |-
      persoon die direct of indirect stemrecht kan uitoefenen of anderszins bepaalde rechten kan uitoefenen in een
      aanbieder van beleggingsobjecten waardoor invloed van betekenis kan worden uitgeoefend op diens zakelijk of
      financieel beleid;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel109
  - number: 109.c
    text: |-
      natuurlijke persoon die in een familierechtelijke betrekking staat of een persoonlijke relatie heeft met een
      bestuurder van een aanbieder van beleggingsobjecten of met een natuurlijke persoon als bedoeld in onderdeel a of
      b, op grond van welke relatie hij het handelen van de bestuurder of de natuurlijke persoon met betrekking tot de
      aanbieder van beleggingsobjecten kan beïnvloeden; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel109
  - number: 109.d
    text: |-
      rechtspersoon waarin een bestuurder van een aanbieder van beleggingsobjecten of een natuurlijke persoon als bedoeld
      in onderdeel c direct of indirect stemrecht kan uitoefenen of anderszins bepaalde rechten kan uitoefenen waardoor
      sprake is van invloed van betekenis op het zakelijk of financieel beleid van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel109
  - number: '110.1'
    text: |-
      In het beleggingsobjectprospectus, bedoeld in [artikel 4:30a, eerste lid, van de wet][ref1] worden, voorzover van
      toepassing, de volgende gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 110.1.a
    text: de naam, rechtsvorm, datum van oprichting, zetel en de plaats van het hoofdkantoor van de aanbieder;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.b
    text: |-
      een beschrijving van de formele of feitelijke zeggenschapsstructuur waarin de aanbieder met andere personen is
      verbonden en de met hem gelieerde partijen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.c
    text: |-
      de voorwaarden, alsmede de wijze waarop deze voorwaarden kunnen worden gewijzigd en de wijze van bekendmaking van
      een wijziging aan de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.d
    text: |-
      een beschrijving van de belangrijkste kenmerken van de serie van beleggingsobjecten waarvan het beleggingsobject
      deel uitmaakt, waaronder in ieder geval de aard, de bestaansduur en de risico’s, die onder meer inzichtelijk worden
      gemaakt door een risico-indicator, alsmede de effecten van die risico’s op het door de consument te realiseren
      rendement;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.e
    text: |-
      een beschrijving van de activiteiten van de aanbieder met betrekking tot de serie van beleggingsobjecten waarvan
      het beleggingsobject deel uitmaakt, voorzover mogelijk te onderscheiden in:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.e.1°
    text: operationele activiteiten, onder vermelding van de plaats waar deze plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.e.2°
    text: |-
      financieringsactiviteiten, voorzover mogelijk te onderscheiden in het als kredietnemer aangaan van overeenkomsten
      inzake krediet en het als crediteur uitzetten van gelden; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.e.3°
    text: |-
      uitbestedingsactiviteiten onder vermelding van het beleid inzake het uitbesteden van werkzaamheden, waaronder ten
      minste een beschrijving van de werkzaamheden die zijn uitbesteed, de naam en de plaats van de zetel van de derde
      waaraan werkzaamheden zijn uitbesteed, alsmede de vermelding, indien van toepassing, dat de derde een gelieerde
      partij is;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.f
    text: |-
      een beschrijving van de wijze waarop wordt bepaald of de opbrengsten door de aanbieder aan de consument worden
      uitgekeerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.g
    text: |-
      een beschrijving van de door de aanbieder te verstrekken garanties die aan de consument in het vooruitzicht worden
      gesteld;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.h
    text: 'een beschrijving van de transacties die worden verricht met gelieerde partijen, waaronder:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.h.1°
    text: |-
      de vermelding of een transactie onder marktconforme voorwaarden plaatsvindt, dan wel, indien dat niet het geval is,
      wat de reden daarvoor is; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.h.2°
    text: |-
      indien een transactie niet plaatsvindt op een gereglementeerde markt of een andere markt in financiële
      instrumenten: de vermelding of aan de transactie een onafhankelijke waardebepaling ten grondslag ligt of dat de
      waarde kan worden bepaald door een of meer bij de transactie betrokken partijen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.i
    text: |-
      de kosten op jaarbasis per serie van beleggingsobjecten waarvan het beleggingsobject deel uitmaakt, en de relevante
      aannames die daaraan ten grondslag liggen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: 110.1.j
    text: |-
      de gegevens op jaarbasis per serie van beleggingsobjecten waarvan het beleggingsobject deel uitmaakt, betreffende
      de brutowaarde, de financieringen, de prestatievergoedingen, en de rentebaten, met inbegrip van de daarbij
      gehanteerde waarderingsgrondslagen, waarbij als uitgangspunt geldt dat de brutowaarde wordt gebaseerd op de vrije
      verkoopwaarde per serie van beleggingsobjecten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: '110.2'
    text: |-
      [Artikel 49][ref1] is van overeenkomstige toepassing op het verstrekken van het beleggingsobjectprospectus door de
      aanbieder van het beleggingsobject onderscheidenlijk de bemiddelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel49
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
  - number: '110.3'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de wijze waarop de gegevens, bedoeld in het
      eerste lid, in het beleggingsobjectprospectus worden opgenomen alsmede met betrekking tot de wijze van berekening
      van de kosten, risico’s en opbrengsten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel110
  - number: '111'
    text: |-
      [Artikel 4:33, eerste lid, van de wet][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 111.a
    text: aanbieders van hypothecair krediet;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel111
  - number: 111.b
    text: aanbieders van krediet, voorzover het krediet onderdeel uitmaakt van een complex product; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel111
  - number: 111.c
    text: aanbieders van krediet voorzover zij overeenkomsten inzake krediet beheren of uitvoeren.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel111
  - number: '112.1'
    text: |-
      De informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1], met betrekking tot andere vormen van
      krediet dan bedoeld in de [artikelen 112a][ref2] en [112b][ref3], wordt schriftelijk of op een andere duurzame
      drager verstrekt in de vorm van het in [bijlage D][ref4] bij dit besluit opgenomen formulier en bevat de in die
      bijlage bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel112a
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel112b
      [ref4]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 112a
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 112b
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
      - id: ref4
        bwb_id: BWBR0020421
  - number: '112.2'
    text: |-
      De informatie, bedoeld in het eerste lid, wordt gebaseerd op de door de consument kenbaar gemaakte voorkeur en
      verstrekte informatie.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
  - number: '112.3'
    text: Informatie in aanvulling op de informatie, bedoeld in het eerste lid, wordt verstrekt in een afzonderlijk document.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
  - number: '112.4'
    text: |-
      Indien de overeenkomst op verzoek van de consument tot stand is gekomen met gebruikmaking van een techniek voor
      communicatie op afstand waardoor de in het eerste lid bedoelde informatie niet op de in dat lid voorgeschreven
      wijze voorafgaand aan de totstandkoming van de overeenkomst kan worden verstrekt, verstrekt de aanbieder de
      informatie onmiddellijk na de totstandkoming van de overeenkomst aan de consument.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
  - number: '112.5'
    text: |-
      De aanbieder verstrekt aan de consument op zijn verzoek een kosteloos exemplaar van de ontwerpovereenkomst inzake
      krediet, tenzij de aanbieder op het tijdstip van het verzoek niet voornemens is de overeenkomst met de consument
      aan te gaan.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
  - number: '112.6'
    text: |-
      Ten aanzien van een overeenkomst inzake krediet waarbij de betalingen door de consument niet tot een directe
      overeenkomstige aflossing van het totale kredietbedrag leiden, maar dienen om, gedurende de periodes en onder
      de voorwaarden die in de overeenkomst inzake krediet of in een nevenovereenkomst zijn vastgesteld, kapitaal op
      te bouwen, bevat de op grond van het eerste lid te verstrekken informatie een duidelijke en beknopte vermelding
      dat de overeenkomst inzake krediet niet voorziet in een garantie tot aflossing van het totale uit hoofde van de
      overeenkomst opgenomen kredietbedrag, tenzij die garantie wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
  - number: '112.7'
    text: |-
      De aanbieder verstrekt de consument, teneinde deze in staat te stellen te beoordelen of de voorgestelde
      overeenkomst inzake krediet aan zijn behoeften en financiële situatie beantwoordt:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
  - number: 112.7.a
    text: een passende toelichting op de informatie, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
  - number: 112.7.b
    text: de voornaamste kenmerken van het voorgestelde krediet,
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
  - number: 112.7.c
    text: |-
      indien van toepassing, informatie inzake het goed of de dienst, bedoeld in [bijlage D, onderdeel 2][ref1], van dit
      besluit en van de verzekering of de rekening, bedoeld in onderdeel 3 van die bijlage;


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 112.7.d
    text: |-
      de specifieke gevolgen van het krediet voor de consument, met inbegrip van de gevolgen indien de consument niet
      betaalt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
  - number: '112.8'
    text: |-
      Indien informatie als bedoeld in het eerste lid niet voorafgaand aan de totstandkoming van de overeenkomst op de
      in dat lid bedoelde wijze kan worden bepaald, wordt zij bepaald met toepassing van de desbetreffende hypothese,
      bedoeld in [bijlage A, deel II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 112a.1
    text: |-
      De informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1] met betrekking tot krediet in de vorm van
      een geoorloofde debetstand waarbij is overeengekomen dat de ter zake verschuldigde betaling van de consument op
      verzoek of binnen een termijn van één tot drie maanden plaatsvindt, wordt schriftelijk of op een andere duurzame
      drager verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 112a.2
    text: 'De informatie bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.2.a
    text: het soort krediet;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.2.b
    text: |-
      de naam en adres en, indien de aanbieder van het krediet of de bemiddelaar in krediet een rechtspersoon is, de
      statutaire naam en handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.2.c
    text: het totale kredietbedrag;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.2.d
    text: de duur van de kredietovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.2.e
    text: |-
      de debetrentevoet, de voorwaarden die de toepassing van deze rentevoet regelen, en indices of referentievoeten die
      betrekking hebben op de aanvankelijke debetrentevoet;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.2.f
    text: |-
      de vanaf het sluiten van de overeenkomst inzake krediet in rekening te brengen kosten, alsmede in voorkomend geval
      de voorwaarden waaronder deze gewijzigd kunnen worden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.2.g
    text: |-
      het jaarlijks kostenpercentage, aan de hand van representatieve voorbeelden en met vermelding van alle voor de
      berekening van dat percentage gebruikte hypothesen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.2.h
    text: de voorwaarden en de procedure voor beëindiging van de overeenkomst inzake krediet;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.2.i
    text: |-
      de geldende rentevoet in geval de consument niet tijdig betaalt alsmede de wijzigingsmodaliteiten ervan en, in
      voorkomend geval, de kosten van niet-nakoming;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.2.j
    text: |-
      het recht van de consument op grond van [artikel 4:32 van de wet][ref1]onverwijld en kosteloos geïnformeerd te
      worden over het resultaat van de raadpleging van een gegevensbestand ter beoordeling van zijn kredietwaardigheid;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 112a.2.k
    text: |-
      informatie omtrent de, vanaf het moment waarop de overeenkomst tot stand is gekomen, in rekening te brengen kosten,
      alsmede, voor zover van toepassing, de voorwaarden waaronder deze kosten gewijzigd kunnen worden; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.2.l
    text: |-
      voor zover van toepassing, de periode gedurende welke de aanbieder van het krediet door de precontractuele
      informatie is gebonden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.3
    text: |-
      De informatie kan worden verstrekt door gebruikmaking van het formulier, opgenomen in [bijlage E][ref1] van dit
      besluit. Alle informatie wordt even opvallend weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 112a.4
    text: |-
      De aanbieder verstrekt aan de consument op zijn verzoek een kosteloos exemplaar van de ontwerpovereenkomst inzake
      krediet, tenzij de aanbieder op het tijdstip van het verzoek niet voornemens is de overeenkomst met de consument
      aan te gaan.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
  - number: 112a.5
    text: |-
      Indien de overeenkomst op verzoek van de consument tot stand is gekomen met gebruikmaking van een techniek voor
      communicatie op afstand waardoor de in het eerste lid bedoelde informatie niet op de in dat lid voorgeschreven
      wijze voorafgaand aan de totstandkoming van de overeenkomst kan worden verstrekt, verstrekt de aanbieder,
      in afwijking van het eerste lid, de informatie, bedoeld in [artikel 7:61 van het Burgerlijk Wetboek][ref1],
      onmiddellijk na de totstandkoming van de overeenkomst aan de consument.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel61
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '61'
  - number: 112a.6
    text: |-
      Indien informatie als bedoeld in het eerste lid niet voorafgaand aan de totstandkoming van de overeenkomst op de
      in dat lid bedoelde wijze kan worden bepaald, wordt zij bepaald met toepassing van de desbetreffende hypothese,
      bedoeld in [bijlage A, deel II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 112b
    text: |-
      De informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1], met betrekking tot effectenkrediet
      kan worden verstrekt door gebruikmaking van het formulier, opgenomen in [bijlage F][ref2] van dit besluit. De
      informatie bevat de in die bijlage bedoelde gegevens. Alle informatie wordt even opvallend weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
  - number: 112c
    text: |-
      De informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1], met betrekking tot krediet in de vorm van
      een geoorloofde debetstand waarbij is overeengekomen dat de ter zake verschuldigde betaling van de consument binnen
      een termijn van een maand plaatsvindt, bevat de in [artikel 112a, tweede lid, onderdelen c, e, f en g][ref2],
      bedoelde gegevens met betrekking tot de kenmerken van het krediet.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel112a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel112c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 112a
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
  - number: '113.1'
    text: |-
      Een aanbieder van krediet gaat met een consument geen overeenkomst inzake krediet aan waarvan het totale
      kredietbedrag meer dan € 1000 bedraagt, indien hij niet beschikt over voldoende schriftelijke of op een andere
      duurzame drager vastgelegde informatie aangaande de financiële positie van de consument om, ter voorkoming van
      overkreditering, te kunnen beoordelen of het aangaan van de overeenkomst verantwoord is.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel113
  - number: '113.2'
    text: |-
      Het eerste lid is niet van toepassing op aanbieders van krediet voorzover zij krediet aanbieden tegen
      onderpand van effecten als bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref1], die tot zekerheid dienen voor de terugbetaling van het krediet aan een consument
      die reeds op het moment van aangaan van de overeenkomst inzake krediet bezitter is van de te verpanden effecten als
      bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in [artikel 1:1 van de wet][ref2], van welk
      krediet het totale kredietbedrag gedurende de looptijd van de overeenkomst inzake het krediet niet hoger is dan
      zeventig procent van de waarde van de te verpanden effecten, indien het effecten betreffen als bedoeld in onderdeel
      a van de definitie van effect in [artikel 1:1 van de wet][ref3], dan wel niet hoger is dan tachtig procent van de
      waarde van de te verpanden effecten, indien het effecten betreffen als bedoeld in onderdeel b van de definitie van
      effect in [artikel 1:1 van de wet][ref4], en:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 113.2.1°
    text: |-
      die effecten als bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref1], zijn toegelaten tot de handel op een gereglementeerde markt; of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 113.2.2°
    text: |-
      de waarde van die effecten als bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref1], door middel van een openbare prijsaanduiding voor een ieder kenbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '113.3'
    text: |-
      Het eerste lid is niet van toepassing op aanbieders van krediet voor zover zij krediet aanbieden in de vorm van
      een geoorloofde debetstand die binnen drie maanden dient te worden afgelost en die niet hoger is dan het bedrag dat
      maandelijks op de rekening wordt gestort.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel113
  - number: '114'
    text: |-
      Alvorens met een consument een overeenkomst inzake krediet aan te gaan waarvan het totale kredietbedrag meer
      dan € 250 bedraagt, raadpleegt een aanbieder van krediet de bij het stelsel van kredietregistratie waaraan hij
      deelneemt geregistreerde gegevens over reeds aan de consument verleende kredieten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel114
  - number: '115.1'
    text: |-
      Ter voorkoming van overkreditering legt een aanbieder van krediet de criteria vast die hij ten grondslag legt aan
      de beoordeling van een kredietaanvraag van een consument en past hij deze criteria toe bij de beoordeling van een
      kredietaanvraag.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel115
  - number: '115.2'
    text: |-
      Het eerste lid is niet van toepassing op aanbieders van krediet voor zover zij krediet aanbieden in de vorm van
      een geoorloofde debetstand die binnen drie maanden dient te worden afgelost en die niet hoger is dan het bedrag dat
      maandelijks op de rekening wordt gestort.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel115
  - number: 115a
    text: |-
      Een aanbieder van krediet rekent geen hogere kredietvergoeding dan op grond van het
      [Besluit kredietvergoeding][ref1] ten hoogste toegelaten kredietvergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005233
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel115a
    references:
      - id: ref1
        bwb_id: BWBR0005233
  - number: '116'
    text: |-
      De tussen een beheerder en een bewaarder te sluiten overeenkomst, bedoeld in
      [artikel 4:43, eerste lid, van de wet][ref1], bepaalt in ieder geval dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 116.a
    text: de bewaarder bij het bewaren in het belang van de deelnemers in de beleggingsinstelling optreedt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
  - number: 116.b
    text: |-
      de bewaring ten name van de beleggingsinstelling op een zodanige wijze geschiedt dat over de in bewaring gegeven
      activa slechts kan worden beschikt door de beheerder en de bewaarder tezamen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
  - number: 116.c
    text: |-
      de bewaarder de in bewaring gegeven activa slechts afgeeft tegen ontvangst van een verklaring van de beheerder
      waaruit blijkt dat afgifte wordt verlangd in verband met de regelmatige uitoefening van de beheerfunctie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
  - number: 116.d
    text: |-
      de bewaarder volgens het recht van de staat waar de beheerder zijn zetel heeft jegens de beleggingsinstelling en
      de deelnemers aansprakelijk is voor door hen geleden schade voorzover de schade het gevolg is van verwijtbare niet-
      nakoming of gebrekkige nakoming van zijn verplichtingen, ook indien de bewaarder de bij hem in bewaring gegeven
      activa geheel of gedeeltelijk aan een derde heeft toevertrouwd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
  - number: 116.e
    text: indien bewijzen van rechten van deelneming worden afgegeven, deze bewijzen door de bewaarder worden ondertekend;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
  - number: 116.f
    text: |-
      een voorstel door de beheerder tot wijziging van de tussen de beleggingsinstelling en de deelnemers geldende
      voorwaarden tezamen met de bewaarder wordt gedaan; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
  - number: 116.g
    text: |-
      indien de overeenkomst de activa van een instelling voor collectieve belegging in effecten betreft, dat de
      bewaarder:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
  - number: 116.g.1°
    text: |-
      zich ervan vergewist dat het aanbieden, verkoop, inkoop en intrekking van alsmede terugbetaling op rechten
      van deelneming voor rekening van de beleggingsinstelling, overeenkomstig de [wet][ref1] of de statuten
      onderscheidenlijk het fondsreglement van de beleggingsinstelling geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 116.g.2°
    text: |-
      zich ervan vergewist dat bij transacties met betrekking tot de activa van de beleggingsinstelling de tegenprestatie
      binnen de gebruikelijke termijnen wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
  - number: 116.g.3°
    text: |-
      zich ervan vergewist dat de opbrengsten van de beleggingsinstelling een bestemming krijgen in overeenstemming met
      de [wet][ref1] of de statuten onderscheidenlijk het fondsreglement van de beleggingsinstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 116.g.4°
    text: |-
      zich ervan vergewist dat de waarde van de rechten van deelneming wordt berekend overeenkomstig de statuten
      onderscheidenlijk het fondsreglement van de beleggingsinstelling; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
  - number: 116.g.5°
    text: |-
      de aanwijzingen van de beheerder dient uit te voeren, tenzij deze in strijd zijn met de [wet][ref1] of de statuten
      onderscheidenlijk het fondsreglement van de beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '117'
    text: |-
      Het registratiedocument, bedoeld in [artikel 4:48, eerste lid, van de wet][ref1], bevat ten minste de gegevens,
      genoemd in [bijlage G][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
  - number: '118.1'
    text: |-
      Onverminderd [artikel 4:49, tweede lid, aanhef en onderdelen a tot en met d, van de wet][ref1] bevat het
      prospectus, bedoeld in [artikel 4:49, eerste lid, van de wet][ref2], de gegevens, genoemd in [bijlage H][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020421
  - number: '118.2'
    text: 'In het prospectus worden in afzonderlijke paragrafen de gegevens opgenomen over:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel118
  - number: 118.2.a
    text: |-
      de kosten van de beleggingsinstelling en de wijze waarop zij ten laste komen van het resultaat van de
      beleggingsinstelling, in mindering worden gebracht op het beheerde vermogen of anderszins direct of indirect ten
      laste komen van de deelnemers in de beleggingsinstelling; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel118
  - number: 118.2.b
    text: de aan de beleggingsinstelling verbonden risico’s.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel118
  - number: '118.3'
    text: |-
      De Autoriteit Financiële Markten stelt regels met betrekking tot de wijze waarop in het prospectus inzicht wordt
      verschaft in het niveau van de kosten van de beleggingsinstelling en de daaraan ten grondslag liggende berekening.
      Voorts kan de Autoriteit Financiële Markten nadere regels stellen met betrekking tot de wijze waarop de gegevens,
      bedoeld in [bijlage H][ref1], worden opgenomen in het prospectus.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '119'
    text: |-
      Een beheerder, beleggingsinstelling of bewaarder verstrekt de jaarrekening, het jaarverslag en de overige
      gegevens, bedoeld in [artikel 4:51, eerste lid, van de wet][ref1], wat de indeling en inhoud betreft, onverminderd
      de [artikelen 121 tot en met 124][ref2] en [146][ref3], in de vorm waarin deze zijn opgemaakt krachtens
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref4] of de internationale jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel146
      [ref4]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '121'
        hoofdstuk: '10'
        paragraaf: 10.3.1
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref4
        bwb_id: BWBR0003045
  - number: '120.1'
    text: |-
      Een beheerder stelt de jaarrekening, het jaarverslag en de overige gegevens, bedoeld in
      [artikel 4:52, eerste lid, van de wet][ref1] en de halfjaarcijfers, bedoeld in [artikel 4:52, tweede lid][ref2],
      kosteloos verkrijgbaar voor deelnemers in de beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '120.2'
    text: |-
      De openbaarmaking van de jaarrekening, het jaarverslag en de overige gegevens, bedoeld in
      [artikel 4:52, eerste lid, van de wet][ref1], geschiedt door publicatie op de website van de beheerder.
      Gelijktijdig met de publicatie op de website deelt de beheerder in een landelijk verspreid Nederlands dagblad dan
      wel aan het adres van iedere deelnemer, mee dat voor deelnemers op verzoek bij de beheerder een afschrift van de
      jaarrekening, het jaarverslag en de overige gegevens van de beheerder, de beleggingsinstelling of de bewaarder voor
      de deelnemers in de beleggingsinstelling kosteloos verkrijgbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '120.3'
    text: |-
      De openbaarmaking van de halfjaarcijfers, bedoeld in [artikel 4:52, tweede lid, van de wet][ref1] geschiedt
      overeenkomstig het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '120.4'
    text: |-
      De beheerder houdt de informatie, bedoeld in het tweede en derde lid, gedurende ten minste drie jaar beschikbaar op
      zijn website.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel120
  - number: '121.1'
    text: |-
      Het jaarverslag van een beleggingsinstelling, bedoeld in [artikel 4:51, eerste lid, van de wet][ref1], bevat een
      verklaring van de beheerder dat hij voor de beleggingsinstelling beschikt over een beschrijving van de inrichting
      van de bedrijfsvoering die voldoet aan het bepaalde ingevolge de [artikelen 3:17, tweede lid, onderdeel c][ref2],
      en [4:14, eerste lid, van de wet][ref3], en dat de bedrijfsvoering van de beleggingsinstelling effectief en
      overeenkomstig de beschrijving functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '121.2'
    text: |-
      Het eerste lid is niet van toepassing op het jaarverslag van beleggingsinstellingen met zetel in een aangewezen
      staat.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel121
  - number: '122.1'
    text: |-
      De toelichting op de balans en de winst- en verliesrekening van een beleggingsinstelling bevat ten minste de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel122
  - number: 122.1.a
    text: |-
      een sluitend overzicht van het verloop gedurende het boekjaar van de beleggingen waarbij de beleggingen worden
      onderscheiden naar soort;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel122
  - number: 122.1.b
    text: een overzicht van de samenstelling van de activa aan het einde van het boekjaar;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel122
  - number: 122.1.c
    text: |-
      een vergelijkend overzicht over de laatste drie jaren van de intrinsieke waarde van de beleggingsinstelling, het
      aantal uitstaande rechten van deelneming en de intrinsieke waarde per recht van deelneming, een en ander per het
      einde van het boekjaar;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel122
  - number: 122.1.d
    text: |-
      een mededeling in hoeverre activa die geen financiële instrumenten zijn die zijn toegelaten tot de handel op een
      gereglementeerde markt of een andere markt in financiële instrumenten door een onafhankelijke deskundige zijn
      gewaardeerd, volgens welke methode de waardering heeft plaatsgevonden, alsmede de regelmaat waarmee deze waardering
      plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel122
  - number: 122.1.e
    text: |-
      het bedrag der verplichtingen, onderscheiden naar soort aan het einde van het boekjaar, die voortvloeien uit
      dekkingstransacties met betrekking tot koers- en wisselkoersrisico in verband met de beleggingen, voorzover een en
      ander niet reeds in de balans en winst- en verliesrekening is begrepen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel122
  - number: 122.1.f
    text: |-
      een gespecificeerde opgave van de activa van de beleggingsinstelling die deelnemingen zijn in de zin van
      [artikel 389, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel389
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '389'
  - number: 122.1.g
    text: |-
      indien de beleggingsinstelling 95 procent of meer van het beheerde vermogen direct of indirect belegt in een
      andere beleggingsinstelling: de gegevens, bedoeld in de onderdelen a, b, c, d en e, met betrekking tot de andere
      beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel122
  - number: '122.2'
    text: |-
      Onverminderd [artikel 379, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] vermeldt de beleggingsinstelling
      onder de overige gegevens, bedoeld in [artikel 4:51, eerste lid, van de wet][ref2], het totale persoonlijke belang
      dat de bestuurders van de beheerder of de beleggingsmaatschappij bij iedere belegging van de beleggingsinstelling
      aan het begin en het einde van het boekjaar hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel379
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '379'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '123.1'
    text: |-
      De toelichting op de balans en de winst- en verliesrekening van een beleggingsinstelling bevat de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.a
    text: |-
      voorzover van toepassing: de kosten van oprichting van de beleggingsinstelling, de wijze waarop deze kosten ten
      laste zijn gekomen van het resultaat, in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste
      zijn gekomen van de deelnemers in de beleggingsinstelling en welk gedeelte ten goede is gekomen aan de beheerder,
      de bewaarder, de bestuurders van de beheerder, beleggingsmaatschappij of bewaarder, of aan met de beheerder,
      beleggingsmaatschappij of bewaarder gelieerde partijen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.b
    text: |-
      de naar soort onderscheiden kosten, gemoeid met het beheer van de beleggingsinstelling, de bewaring van activa
      van de beleggingsinstelling, de accountant, het toezicht op de beleggingsinstelling en de marketing, met
      inbegrip van de berekeningsgrondslag en de wijze waarop deze kosten ten laste zijn gekomen van het resultaat,
      in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn gekomen van de deelnemers in de
      beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.c
    text: |-
      de transactiekosten die geïdentificeerd en gekwantificeerd kunnen worden en de wijze waarop deze kosten ten laste
      zijn gekomen van het resultaat, in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn
      gekomen van de deelnemers in de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.d
    text: |-
      indien van toepassing: de kosten die zijn gemaakt of vergoedingen die zijn gevraagd in verband met het in- en
      uitlenen van financiële instrumenten en de wijze waarop deze kosten ten laste zijn gekomen van het resultaat,
      in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn gekomen van de deelnemers in de
      beleggingsinstelling onderscheidenlijk aan wie deze vergoedingen ten goede zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.e
    text: |-
      indien van toepassing: de kosten voor het uitbesteden van werkzaamheden in het kader van het beheer van de
      beleggingsinstelling of de bewaring van de activa van de beleggingsinstelling en de wijze waarop deze kosten ten
      laste zijn gekomen van het resultaat, in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste
      zijn gekomen van de deelnemers in de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.f
    text: |-
      het totaal betaalde bedrag aan vergoedingen voor het aanbrengen van deelnemers indien dit bedrag hoger is dan één
      tiende procent van het gemiddelde beheerde vermogen van de beleggingsinstelling, de wijze waarop dit bedrag ten
      laste is gekomen van het resultaat, in mindering is gebracht op het beheerde vermogen of anderszins ten laste is
      gekomen van de deelnemers in de beleggingsinstelling en, indien van toepassing, de namen van met de beheerder,
      beleggingsmaatschappij of bewaarder gelieerde partijen aan wie deze aanbrengprovisies ten goede zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.g
    text: |-
      alle andere dan in onderdeel a tot en met f bedoelde naar soort onderscheiden kosten die hoger zijn dan tien
      procent van de totale kosten, inclusief de berekeningsgrondslag, en de wijze waarop deze kosten ten laste zijn
      gekomen van het resultaat, in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn gekomen
      van de deelnemers in de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.h
    text: |-
      de wijze waarop de op- en afslagen zijn berekend, aan wie de op- en afslagen ten goede zijn gekomen en, voor zover
      van toepassing, de wijze waarop zij zijn verwerkt in de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.i
    text: |-
      de overige eenmalige kosten die deelnemers in de beleggingsinstelling betalen bij in- en uittreding, inclusief
      de berekeningsgrondslag;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.j
    text: |-
      een vergelijkend overzicht van de naar soort onderscheiden volgens het prospectus, bedoeld in
      [artikel 4:49, eerste lid, van de wet][ref1], te maken kosten en de daadwerkelijk gemaakte kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 123.1.k
    text: |-
      de naar soort onderscheiden kosten die voortvloeien uit directe of indirecte beleggingen in andere
      beleggingsinstellingen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.l
    text: |-
      het niveau van de kosten van de beleggingsinstelling gerelateerd aan haar gemiddelde intrinsieke waarde,
      onder vermelding van de kosten die daarbij buiten beschouwing zijn gelaten; indien de beleggingsinstelling
      gemiddeld tien procent of meer van haar vermogen direct of indirect in andere beleggingsinstellingen belegt,
      worden de kosten van de andere beleggingsinstellingen meegenomen bij het bepalen van het niveau van de kosten
      van de beleggingsinstelling of wordt vermeld dat en waarom het niet mogelijk is de kosten van een andere
      beleggingsinstelling mee te nemen, alsmede dat de kosten van de betreffende andere beleggingsinstelling van invloed
      zijn op het resultaat van de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.m
    text: |-
      indien de beleggingsinstelling 95 procent of meer van het beheerde vermogen direct of indirect belegt in een andere
      beleggingsinstelling: het niveau van de kosten van de andere beleggingsinstelling gerelateerd aan de gemiddelde
      intrinsieke waarde van de andere beleggingstelling, onder vermelding van de kosten die daarbij buiten beschouwing
      zijn gelaten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.n
    text: |-
      indien van toepassing: de retourprovisies die niet ten goede zijn gekomen aan de beleggingsinstelling en aan wie
      deze retourprovisies ten goede zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.o
    text: |-
      indien van toepassing: de door de beheerder, de bestuurders van de beheerder, beleggingsmaatschappij of bewaarder,
      de bewaarder, de met de beheerder, beleggingsmaatschappij of bewaarder gelieerde partijen of derden voor het
      uitvoeren van opdrachten ten behoeve van de beleggingsinstelling ontvangen of in het vooruitzicht gestelde
      goederen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.1.p
    text: |-
      de omloopsnelheid van de beleggingen en een vergelijking met de in het voorgaande boekjaar gerealiseerde
      omloopsnelheid van de beleggingen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: '123.2'
    text: |-
      Het eerste lid, onderdeel p, is niet van toepassing op beleggingsinstellingen die uitsluitend of vrijwel
      uitsluitend beleggen in onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: '123.3'
    text: |-
      De Autoriteit Financiële Markten stelt regels met betrekking tot de wijze waarop inzicht wordt verschaft in het
      niveau van de kosten van de beleggingsinstelling, bedoeld in het eerste lid, onderdelen l en m, en de daaraan ten
      grondslag liggende berekening en de wijze van berekening van de omloopsnelheid van de activa, bedoeld in het eerste
      lid, onderdeel p.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: '123.4'
    text: 'De toelichting op de balans en de winst en verliesrekening van een beheerder bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.4.a
    text: 'indien van toepassing: de door de beheerder of diens bestuurders ontvangen retourprovisies;'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.4.b
    text: |-
      indien van toepassing: de door de beheerder of diens bestuurders voor het uitvoeren van opdrachten ten behoeve
      van de beheerder of de door de beheerder beheerde beleggingsinstellingen ontvangen of in het vooruitzicht gestelde
      goederen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: 123.4.c
    text: |-
      de vergoedingen die zijn ontvangen in verband met het in- en uitlenen van financiële instrumenten van de door de
      beheerder beheerde beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: '123.5'
    text: De in het eerste en vierde lid bedoelde gegevens worden cijfermatig en tekstueel toegelicht.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: '123.6'
    text: |-
      In de toelichting op de balans en de winst- en verliesrekening van de beheerder en de beleggingsinstelling worden
      de in het vierde onderscheidenlijk het eerste lid bedoelde gegevens in één paragraaf opgenomen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel123
  - number: '124.1'
    text: 'Een beleggingsinstelling vermeldt in de toelichting op de balans en de winst en verliesrekening:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.a
    text: |-
      indien van toepassing: de met de met de beheerder, beleggingsmaatschappij of bewaarder gelieerde partijen aangegane
      overeenkomsten en een beschrijving van de hoofdlijnen van die overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.b
    text: |-
      welk percentage van het totale transactievolume van de beleggingsinstelling is uitgevoerd via de met de beheerder,
      beleggingsmaatschappij of bewaarder gelieerde partijen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.c
    text: |-
      indien van toepassing: een opsomming van de soorten transacties die via de met de beheerder, beleggingsmaatschappij
      of bewaarder gelieerde partijen zijn uitgevoerd en de voorwaarden waaronder die transacties plaatsvinden. Indien
      een transactie met een gelieerde partij niet tegen marktconforme voorwaarden heeft plaatsgevonden wordt tevens
      de naam van de gelieerde partij, de prijs, de relevante voorwaarden, de getaxeerde waarde en de reden voor niet
      marktconform handelen vermeld;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.d
    text: |-
      indien van toepassing: het totaalbedrag gemoeid met transacties met de met de beheerder, beleggingsmaatschappij of
      bewaarder gelieerde partijen die niet op een gereglementeerde markt of een andere markt in financiële instrumenten
      worden verricht;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.e
    text: |-
      indien van toepassing: dat de beleggingsinstelling direct of indirect belegt in een andere beleggingsmaatschappij
      die een met de beheerder, beleggingsmaatschappij of bewaarder gelieerde partij is of in een andere
      beleggingsinstelling die beheerd wordt door een met de beheerder, beleggingsmaatschappij of bewaarder gelieerde
      partij en onder welke voorwaarden verkoop of inkoop van, alsmede terugbetaling op de rechten van deelneming in de
      andere beleggingsinstelling plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.f
    text: |-
      indien van toepassing: beleggingen in met de beheerder, beleggingsmaatschappij of bewaarder gelieerde partijen,
      niet zijnde beleggingsinstellingen, die meer dan tien procent van het vermogen van de gelieerde partij of van
      het beheerde vermogen van de beleggingsinstelling uitmaken, met een uiteenzetting van de relatie met de gelieerde
      partijen en het land van vestiging van de betreffende gelieerde partijen indien dit niet Nederland is;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.g
    text: |-
      indien de beheerder of bewaarder in het kader van het beheer van de beleggingsinstelling onderscheidenlijk de
      bewaring van de activa van de beleggingsinstelling werkzaamheden heeft uitbesteed: de naam van degene aan wie
      werkzaamheden zijn uitbesteed en een beschrijving van de werkzaamheden die zijn uitbesteed;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.h
    text: 'indien financiële instrumenten worden in- of uitgeleend:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.h.1°
    text: |-
      de waarde van de in- en uitgeleende financiële instrumenten; deze informatie dient in de toelichting op de balans
      onder de balanspost financiële instrumenten te worden vermeld; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.h.2°
    text: de zekerheden die de beleggingsinstelling heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.i
    text: |-
      indien de beleggingsinstelling gemiddeld twintig procent of meer van het beheerde vermogen direct of indirect
      belegt in een andere beleggingsinstelling:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.i.1°
    text: |-
      waar de meest recente jaarrekening en het meest recente jaarverslag van de andere beleggingsinstelling verkrijgbaar
      zijn;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.i.2°
    text: of en, zo ja, waar de andere beleggingsinstelling onder toezicht staat;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.i.3°
    text: |-
      het relatieve belang van de beleggingsinstelling in de andere beleggingsinstelling aan het begin en het einde van
      het boekjaar van de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.i.4°
    text: |-
      de intrinsieke waarde van de rechten van deelneming in de andere beleggingsinstelling aan het einde van het meest
      recente boekjaar van die andere beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.i.5°
    text: |-
      de samenstelling van de beleggingsportefeuille van de andere beleggingsinstelling aan het begin en het einde van
      het meest recente boekjaar van die andere beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.i.6°
    text: |-
      een beschrijving van het beleggingsresultaat van de andere beleggingsinstelling aan de hand van de meest recente
      jaarrekening van die andere beleggingsinstelling; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.i.7°
    text: |-
      indien van toepassing: de afspraken tussen de beleggingsinstelling en de andere beleggingsinstelling over de
      verdeling van kosten en aan wie het voordeel ten goede komt; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: 124.1.j
    text: |-
      indien de beleggingsinstelling 95 procent of meer van het beheerde vermogen direct of indirect belegt in een andere
      beleggingsinstelling: het beleggingsbeleid van de andere beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: '124.2'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de wijze waarop de informatie, bedoeld in
      het eerste lid, wordt opgenomen in de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel124
  - number: '125.1'
    text: 'De halfjaarcijfers van een beleggingsinstelling bevatten ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel125
  - number: 125.1.a
    text: |-
      de balans en winst- en verliesrekening, alsmede een mutatieoverzicht van het eigen vermogen van de
      beleggingsmaatschappij of van het beheerde vermogen van het beleggingsfonds met inachtneming, voorzover de aard
      van deze stukken dat toelaat, van de bepalingen van [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] of de
      internationale jaarrekeningstandaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 125.1.b
    text: een overzicht van de samenstelling van de activa van de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel125
  - number: 125.1.c
    text: |-
      een opgave van de intrinsieke waarde van de beleggingsinstelling en het aantal uitstaande rechten van deelneming en
      de intrinsieke waarde per recht van deelneming;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel125
  - number: 125.1.d
    text: |-
      indien van toepassing: de vermelding, bedoeld in [artikel 122, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel122
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '122'
        hoofdstuk: '10'
        paragraaf: 10.3.1
        afdeling: '10.3'
  - number: 125.1.e
    text: |-
      indien van toepassing: een mededeling dat de beleggingsinstelling interimdividend heeft uitgekeerd of voornemens is
      dat te doen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel125
  - number: '125.2'
    text: |-
      De halfjaarcijfers van een beheerder bevatten ten minste de balans en winst- en verliesrekening, alsmede een
      mutatieoverzicht van het eigen vermogen met inachtneming, voorzover de aard van deze stukken dat toelaat, van de
      bepalingen van [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1], met uitzondering van [artikel 403][ref2], of
      de internationale jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel403
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '403'
  - number: '125.3'
    text: |-
      Indien de halfjaarcijfers van de beheerder of de beleggingsinstelling door een accountant zijn onderzocht,
      wordt diens verklaring gevoegd bij de stukken die ingevolge [artikel 4:51, tweede lid, van de wet][ref1] aan de
      Autoriteit Financiële Markten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '126.1'
    text: |-
      [Artikel 4:56, eerste lid, eerste volzin, van de wet][ref1] is niet van toepassing op instellingen voor collectieve
      belegging in effecten die beleggingsmaatschappij zijn waarvan de rechten van deelneming zijn toegelaten tot de
      notering op een gereglementeerde markt, een multilaterale handelsfaciliteit of een met een gereglementeerde markt
      of een multilaterale handelsfaciliteit vergelijkbaar systeem uit een staat die geen lidstaat is en die uitsluitend
      op dat handelsplatform worden verhandeld. De statuten van de beleggingsmaatschappij vermelden in dat geval de
      methoden voor de berekening van de intrinsieke waarde van die rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '126.2'
    text: |-
      [Artikel 4:56, eerste lid, eerste volzin, van de wet][ref1] is tevens niet van toepassing op instellingen voor
      collectieve beleggingen in effecten die beleggingsmaatschappij zijn waarvan de rechten van deelneming voor ten
      minste tachtig procent op een in de statuten vermeld handelsplatform worden verhandeld, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 126.2.a
    text: |-
      de belangen van de deelnemers in de beleggingsmaatschappij worden beschermd op een wijze die gelijkwaardig is aan
      de bescherming uit hoofde van de [wet][ref1] en dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 126.2.b
    text: |-
      de rechten van deelneming zijn toegelaten tot de notering op een handelsplatform van de lidstaat waar zij
      verhandeld worden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel126
  - number: 126.2.c
    text: |-
      de door de beleggingsmaatschappij niet op het handelsplatform verrichte transacties in haar rechten van deelneming
      slechts tegen beurskoers plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel126
  - number: 126.2.d
    text: |-
      de statuten het handelsplatform vermelden waarvan de notering de prijs bepaalt voor de transacties die door de
      beleggingsmaatschappij in de staat waar dat handelsplatform is gelegen, buiten het handelsplatform worden verricht;
      en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel126
  - number: 126.2.e
    text: de statuten de methoden voor de berekening van de intrinsieke waarde van de rechten van deelneming vermelden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel126
  - number: '127.1'
    text: |-
      Een instelling voor collectieve belegging in effecten als bedoeld in [artikel 126][ref1] draagt een accountant
      op om zich ten minste eenmaal per kwartaal ervan te vergewissen dat de berekening van de waarde van rechten van
      deelneming plaatsvindt overeenkomstig haar statuten en dit besluit en dat de activa van de beleggingsmaatschappij
      zijn belegd in overeenstemming met haar statuten en met de [artikelen 130 tot en met 143][ref2], waarbij tussen elk
      van de tijdstippen van vergewissing een periode van ten minste een week ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '126'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '127.2'
    text: |-
      Een instelling voor collectieve beleggingen in effecten als bedoeld in [artikel 126][ref1] koopt of verkoopt al
      dan niet door tussenkomst van een derde haar rechten van deelneming dan wel geeft deze uit, om te voorkomen dat
      de waarde van haar rechten van deelneming op het handelsplatform meer dan vijf procent afwijkt van de intrinsieke
      waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel126
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '126'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '128'
    text: |-
      De statuten of het fondsreglement van een instelling voor collectieve belegging in effecten als bedoeld in
      [artikel 4:61, eerste lid, van de wet][ref1] vermelden:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 128.a
    text: |-
      de wijze waarop de bepaling plaatsvindt van de prijs bij het aanbieden, de verkoop- of inkoopprijs, en het bedrag
      bij terugbetaling van de waarde van de rechten van deelneming; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel128
  - number: 128.b
    text: |-
      de aard van de kosten die ten laste komen van het resultaat, in mindering worden gebracht op het beheerde vermogen
      of anderszins ten laste komen van de deelnemers in de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel128
  - number: '129'
    text: |-
      Een instelling voor collectieve belegging in effecten als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1]
      die belegt in rechten van deelneming in andere beleggingsinstellingen die door haar beheerder worden beheerd of
      die worden beheerd door een beheerder waarmee haar beheerder in een formele of feitelijke zeggenschapsstructuur is
      verbonden, brengt geen kosten in rekening voor inschrijving of aflossing ten aanzien van de rechten van deelneming
      in die andere beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '130'
    text: |-
      Het beheerde vermogen van een instelling voor collectieve belegging in effecten als bedoeld in
      [artikel 4:61, eerste lid, van de wet][ref1] wordt uitsluitend belegd in:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 130.a
    text: |-
      effecten en geldmarktinstrumenten die zijn toegelaten tot de notering of worden verhandeld op een gereglementeerde
      markt of een multilaterale handelsfaciliteit;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.b
    text: |-
      effecten en geldmarktinstrumenten die zijn toegelaten tot de notering of worden verhandeld op een met een
      gereglementeerde markt of een multilaterale handelsfaciliteit vergelijkbaar systeem uit een staat die geen lidstaat
      is, voorzover de statuten of het fondsreglement van de instelling voor collectieve belegging in effecten voorzien
      in belegging in deze financiële instrumenten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.c
    text: |-
      effecten waarvan het aannemelijk is dat zij binnen een jaar na emissie zullen worden toegelaten tot de notering of
      ter verhandeling zullen worden aangeboden op een gereglementeerde markt, een multilaterale handelsfaciliteit of een
      met een gereglementeerde markt of een multilaterale handelsfaciliteit vergelijkbaar systeem uit een staat die geen
      lidstaat is voorzover de statuten of het fondsreglement van de instelling voor collectieve belegging in effecten
      voorzien in belegging in deze financiële instrumenten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.d
    text: |-
      rechten van deelneming in instellingen voor collectieve belegging in effecten voor het aanbieden waarvan op grond
      van [artikel 2:65 van de wet][ref1] een vergunning is verleend of in instellingen voor collectieve belegging in
      effecten die overeenkomstig de richtlijn beleggingsinstellingen in een andere lidstaat zijn toegelaten, indien de
      betreffende instellingen voor collectieve belegging in effecten volgens hun statuten of fondsreglementen niet meer
      dan tien procent van hun beheerde vermogen beleggen in rechten van deelneming in andere beleggingsinstellingen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 130.e
    text: |-
      rechten van deelneming in beleggingsinstellingen met zetel in een aangewezen staat of in beleggingsinstellingen
      waarop het toezicht naar het oordeel van de toezichthoudende instanties in andere lidstaten gelijkwaardig is
      aan de richtlijn beleggingsinstellingen en ten aanzien waarvan de samenwerking tussen de toezichthouders en de
      toezichthoudende instanties genoegzaam is gewaarborgd, indien:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.e.1°
    text: |-
      de rechten van deelneming in de beleggingsinstellingen op verzoek van de deelnemers ten laste van de activa direct
      of indirect worden ingekocht of terugbetaald;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.e.2°
    text: |-
      het reglementaire of statutaire doel van de beleggingsinstellingen uitsluitend is het beleggen in effecten,
      geldmarktinstrumenten, deposito’s of financiële derivaten met toepassing van het beginsel van risicospreiding;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.e.3°
    text: |-
      de op de beleggingsinstellingen toepasselijke regels inzake scheiding van het vermogen, opnemen en verstrekken van
      leningen en verkopen van effecten en geldmarktinstrumenten vanuit een ongedekte positie gelijkwaardig zijn aan de
      voorschriften van de richtlijn beleggingsinstellingen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.e.4°
    text: |-
      de beleggingsinstellingen volgens hun statuten of fondsreglementen niet meer dan tien procent van hun beheerde
      vermogen beleggen in rechten van deelneming in andere beleggingsinstellingen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.f
    text: deposito’s;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.g
    text: |-
      financiële derivaten die zijn toegelaten tot de notering of worden verhandeld op een gereglementeerde markt,
      een multilaterale handelsfaciliteit of een met een gereglementeerde markt of een multilaterale handelsfaciliteit
      vergelijkbaar systeem uit een staat die geen lidstaat is, voorzover de waarde afhankelijk is van de in dit artikel
      genoemde financiële instrumenten en deposito’s, financiële indices, rentetarieven, wisselkoersen of valuta’s waarin
      de instelling voor collectieve belegging in effecten krachtens haar statuten of reglementen mag beleggen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.h
    text: |-
      financiële derivaten die niet op een gereglementeerde markt, een multilaterale handelsfaciliteit of een met een
      gereglementeerde markt of een multilaterale handelsfaciliteit vergelijkbaar systeem uit een staat die geen lidstaat
      is worden verhandeld, indien:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.h.1°
    text: |-
      de waarde afhankelijk is van de in dit artikel genoemde financiële instrumenten en deposito’s, financiële indices,
      rentetarieven, wisselkoersen of valuta’s waarin instellingen voor collectieve belegging in effecten krachtens haar
      statuten of reglementen mag beleggen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.h.2°
    text: |-
      de tegenpartij een aan prudentieel toezicht onderworpen instelling is en behoort tot de categorieën die erkend zijn
      door de Autoriteit Financiële Markten of een toezichthoudende instantie in een andere lidstaat; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.h.3°
    text: |-
      zij aan betrouwbare en verifieerbare dagelijkse waardering onderworpen zijn en te allen tijde tegen hun waarde
      in het economisch verkeer op initiatief van de instelling voor collectieve belegging in effecten kunnen worden
      verkocht, te gelde gemaakt of afgesloten door een compenserende transactie; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.i
    text: |-
      geldmarktinstrumenten die niet op een gereglementeerde markt, een multilaterale handelsfaciliteit of een met een
      gereglementeerde markt of een multilaterale handelsfaciliteit vergelijkbaar systeem uit een staat die geen lidstaat
      is worden verhandeld, indien de emissie of de emittent van deze instrumenten zelf aan regelgeving is onderworpen
      met het oog op de bescherming van beleggers en spaargelden, en deze instrumenten:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.i.1°
    text: |-
      worden uitgegeven of gegarandeerd door een centrale, regionale of plaatselijke overheid, de centrale bank van een
      lidstaat, de Europese Centrale Bank, de Europese Unie of de Europese Investeringsbank, een staat die geen lidstaat
      is, een deelstaat van een federale staat of een internationale publiekrechtelijke instelling waarin een of meer
      lidstaten deelnemen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.i.2°
    text: |-
      worden uitgegeven door een onderneming waarvan effecten worden verhandeld op een gereglementeerde markt, een
      multilaterale handelsfaciliteit of een met een gereglementeerde markt of een multilaterale handelsfaciliteit
      vergelijkbaar systeem uit een staat die geen lidstaat is;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.i.3°
    text: |-
      worden uitgegeven of gegarandeerd door een instelling die in een lidstaat aan prudentieel toezicht is onderworpen
      of door een instelling die onderworpen is aan prudentieel toezicht dat in ieder geval gelijkwaardig is aan het
      ingevolge het gemeenschapsrecht geldende prudentieel toezicht; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: 130.i.4°
    text: |-
      worden uitgegeven door andere instellingen waarvoor een gelijkwaardige bescherming van de belegger geldt als
      is vastgelegd in dit onderdeel, aanhef en onder 1°, 2° en 3°, indien de uitgevende instelling een onderneming
      is waarvan het kapitaal en de reserves in totaal ten minste € 10.000.000 bedragen en die haar jaarrekeningen
      presenteert en publiceert overeenkomstig de richtlijn jaarrekening, of een rechtspersoon is die binnen een groep
      waartoe een of meer ondernemingen waarvan de aandelen zijn toegelaten tot notering aan een gereglementeerde markt,
      een multilaterale handelsfaciliteit of een met een gereglementeerde markt of een multilaterale handelsfaciliteit
      vergelijkbaar systeem uit een staat die geen lidstaat is behoren, specifiek gericht is op de financiering van de
      groep, of een rechtspersoon is specifiek gericht op de financiering van effectiseringsinstrumenten waarvoor een
      bankliquiditeitenlijn bestaat.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel130
  - number: '131'
    text: |-
      In afwijking van [artikel 130][ref1] kan het beheerde vermogen van een instelling voor collectieve belegging in
      effecten:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 131.a
    text: |-
      voor ten hoogste tien procent worden belegd in effecten en geldmarktinstrumenten die niet zijn toegelaten tot of
      worden verhandeld op een gereglementeerde markt of een andere markt in financiële instrumenten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel131
  - number: 131.b
    text: |-
      indien het een beleggingsmaatschappij betreft: worden belegd in zaken die rechtstreeks noodzakelijk zijn voor de
      uitoefening van haar werkzaamheid; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel131
  - number: 131.c
    text: worden aangehouden in accessoir liquide middelen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel131
  - number: '132'
    text: |-
      Het beheerde vermogen van een instelling voor collectieve belegging in effecten als bedoeld in
      [artikel 4:61, eerste lid, van de wet][ref1] wordt niet belegd in edele metalen of in certificaten die deze metalen
      vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '133.1'
    text: |-
      De instelling voor collectieve belegging in effecten als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1]
      doet de Autoriteit Financiële Markten regelmatig mededeling van de tot haar activa behorende soorten financiële
      derivaten, de onderliggende risico’s, de kwantitatieve begrenzingen en de methodes die zijn gekozen om de aan
      transacties in deze financiële instrumenten verbonden risico’s te ramen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '133.2'
    text: |-
      Het totale risico van de instelling voor collectieve belegging in effecten bedraagt niet meer dan tweemaal de
      totale nettowaarde van de activa. Het totale risico van een beleggingsinstelling wordt met niet meer dan tien
      procent van de totale nettowaarde van haar portefeuille vergroot door het aangaan van kortlopende leningen, in welk
      geval het totale risico van de instelling voor collectieve belegging in effecten niet meer dan 210 procent bedraagt
      van de totale nettowaarde van haar portefeuille.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel133
  - number: '133.3'
    text: |-
      Het totale risico van de instelling voor collectieve belegging in effecten in financiële derivaten overschrijdt
      niet de totale nettowaarde van de activa. Voor de berekening van het risico worden de dagwaarde van de
      onderliggende activa, het tegenpartijrisico, toekomstige marktbewegingen en de voor de liquidatie van de posities
      beschikbare tijd in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel133
  - number: '133.4'
    text: |-
      Het beheerde vermogen van de instelling voor collectieve belegging in effecten kan in het kader van het
      beleggingsbeleid en binnen de in [artikel 137][ref1] gestelde begrenzingen worden belegd in financiële derivaten
      voorzover het risico met betrekking tot de onderliggende activa in totaal niet de in de [artikelen 134][ref2],
      [135][ref3], [136, eerste lid][ref4], en [137][ref5] gestelde begrenzingen overschrijdt. Indien het beheerde
      vermogen van de instelling voor collectieve belegging in effecten in op een index gebaseerde financiële derivaten
      wordt belegd, worden die beleggingen voor de toepassing van de in de [artikelen 134][ref6], [135][ref7],
      [136, eerste lid][ref8], en [137][ref9] gestelde begrenzingen bepaalde bovengrens niet samengeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref5]: https://wetten.overheid.nl/BWBR0020421#Artikel137
      [ref6]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref7]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref8]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref9]: https://wetten.overheid.nl/BWBR0020421#Artikel137
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '137'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref5
        bwb_id: BWBR0020421
        artikel: '137'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref6
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref7
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref8
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref9
        bwb_id: BWBR0020421
        artikel: '137'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '133.5'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de berekening van het risico, de wijze
      van vaststelling van de dagwaarde van de onderliggende activa, de soorten verplichtingen die leiden tot een
      tegenpartijrisico, het meewegen van toekomstige marktbewegingen bij de vaststelling en de methodes die mede
      afhankelijk van de aard van het financiële instrument waarin wordt belegd, voor berekening van de risico’s kunnen
      worden gehanteerd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel133
  - number: '134.1'
    text: |-
      Het beheerde vermogen van een instelling voor collectieve belegging in effecten als bedoeld in
      [artikel 4:61, eerste lid, van de wet][ref1] wordt tot ten hoogste tien procent belegd in effecten en
      geldmarktinstrumenten die zijn uitgegeven door dezelfde instelling. Een instelling voor collectieve belegging in
      effecten belegt niet meer dan twintig procent van het beheerde vermogen in deposito’s bij één bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '134.2'
    text: |-
      Het tegenpartijrisico van de instelling voor collectieve belegging in effecten bij een transactie in financiële
      derivaten die niet op een gereglementeerde markt of een andere markt in financiële instrumenten worden verhandeld,
      bedraagt niet meer dan:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel134
  - number: 134.2.a
    text: tien procent van haar vermogen wanneer de tegenpartij een kredietinstelling is; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel134
  - number: 134.2.b
    text: vijf procent van haar vermogen, in andere gevallen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel134
  - number: '134.3'
    text: |-
      De totale waarde van de effecten en de geldmarktinstrumenten die de instelling voor collectieve belegging in
      effecten houdt in uitgevende instellingen waarin zij per instelling voor meer dan vijf procent belegt, bedraagt
      niet meer dan veertig procent van het beheerde vermogen van de instelling voor collectieve belegging in effecten.
      Deze begrenzing is niet van toepassing op deposito’s en transacties in financiële derivaten die niet op een
      gereglementeerde markt of een andere markt in financiële instrumenten worden verhandeld, bij onderscheidenlijk met
      instellingen die aan prudentieel toezicht onderworpen zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel134
  - number: '134.4'
    text: |-
      Onverminderd de in het eerste en tweede lid bepaalde individuele begrenzingen wordt het beheerde vermogen van de
      instelling voor collectieve belegging in effecten tot ten hoogste twintig procent belegd in één instelling in een
      combinatie van:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel134
  - number: 134.4.a
    text: effecten en geldmarktinstrumenten die door die instelling zijn uitgegeven;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel134
  - number: 134.4.b
    text: deposito’s bij die instelling; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel134
  - number: 134.4.c
    text: |-
      risico’s ten gevolge van transacties in financiële derivaten die niet op een gereglementeerde markt of een andere
      markt in financiële instrumenten worden verhandeld, met betrekking tot die instelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel134
  - number: '134.5'
    text: |-
      Bij de berekening van de door de instelling voor collectieve belegging in effecten gelopen risico’s bij beleggingen
      als bedoeld in het eerste tot en met vierde lid, wordt het risico bepaald aan de hand van het maximale verlies
      voor de instelling voor collectieve belegging in effecten wanneer een tegenpartij in gebreke blijft. De Autoriteit
      Financiële Markten kan nadere regels stellen met betrekking tot de berekening van het tegenpartijrisico en de
      daarbij in aanmerking te nemen zekerheden als beperking van het door de instelling voor collectieve belegging in
      effecten gelopen tegenpartijrisico.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel134
  - number: '135.1'
    text: |-
      In afwijking van [artikel 134][ref1] kan het beheerde vermogen van een instelling voor collectieve belegging in
      effecten tot ten hoogste vijfentwintig procent worden belegd in geregistreerde gedekte obligaties als bedoeld in
      het [Besluit prudentiële regels Wft][ref2] van een bepaalde uitgevende bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020420
  - number: '135.2'
    text: |-
      Indien het beheerde vermogen van een instelling voor collectieve belegging in effecten voor meer dan vijf procent
      wordt belegd in obligaties als bedoeld in het eerste lid die door één instelling zijn uitgegeven, bedraagt de
      totale waarde van deze beleggingen niet meer dan tachtig procent van de activa van die uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel135
  - number: '136.1'
    text: |-
      In afwijking van [artikel 134, eerste lid][ref1], kan het beheerde vermogen van een instelling voor collectieve
      belegging in effecten tot ten hoogste vijfendertig procent worden belegd in effecten en geldmarktinstrumenten
      die zijn uitgegeven of gegarandeerd door een lidstaat, een openbaar lichaam met verordenende bevoegdheid in een
      lidstaat, een staat die geen lidstaat is, of een internationale organisatie waarin een of meer lidstaten deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '136.2'
    text: |-
      De Autoriteit Financiële Markten kan een instelling voor collectieve belegging in effecten op aanvraag ontheffing
      verlenen van het eerste lid indien:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel136
  - number: 136.2.a
    text: |-
      zij effecten en geldmarktinstrumenten van ten minste zes verschillende emissies van een in het eerste lid bedoelde
      uitgevende staat, openbaar lichaam of internationale organisatie in portefeuille heeft;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel136
  - number: 136.2.b
    text: |-
      de financiële instrumenten van een zelfde emissie niet meer bedragen dan dertig procent van het beheerde vermogen
      van de instelling voor collectieve belegging in effecten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel136
  - number: 136.2.c
    text: |-
      de uitgevende staat, het openbaar lichaam of de internationale organisatie in de statuten of het fondsreglement van
      de instelling voor collectieve belegging in effecten wordt genoemd; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel136
  - number: 136.2.d
    text: |-
      de deelnemers in de instelling voor collectieve belegging in effecten bescherming genieten die gelijkwaardig is aan
      de bescherming die voortvloeit uit het eerste lid en de [artikelen 134][ref1], [135][ref2] en [137][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel137
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '137'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '137.1'
    text: |-
      De in de [artikelen 135][ref1] en [136, eerste lid][ref2], bedoelde financiële instrumenten worden niet in
      aanmerking genomen voor de toepassing van de in [artikel 134, derde lid][ref3], bedoelde begrenzing van veertig
      procent.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '137.2'
    text: |-
      De overeenkomstig de [artikelen 134][ref1], [135][ref2], en [136, eerste lid][ref3], verrichte beleggingen in
      door één instelling uitgegeven effecten en geldmarktinstrumenten dan wel in deposito’s bij of financiële derivaten
      van die instelling, bedragen samen in geen geval meer dan vijfendertig procent van het beheerde vermogen van de
      instelling voor collectieve belegging in effecten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel136
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '137.3'
    text: |-
      Voor de berekening van de in de [artikelen 134][ref1], [135][ref2], en [136, eerste lid][ref3], gestelde
      begrenzingen worden ondernemingen die tot een groep worden gerekend voor de opstelling van geconsolideerde
      jaarrekeningen, overeenkomstig de richtlijn geconsolideerde jaarrekening of andere erkende internationale
      financiële verslagleggingsregels, tezamen als een instelling beschouwd, met dien verstande dat de beleggingen,
      bedoeld in [artikel 134, eerste lid, eerste volzin][ref4], in de afzonderlijke ondernemingen die tot die groep
      behoren ten hoogste twintig procent van het beheerde vermogen van de instelling voor collectieve belegging in
      effecten kunnen bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '137.4'
    text: |-
      De activa van beleggingsinstellingen in wier rechten van deelneming de instelling voor collectieve belegging in
      effecten belegt worden voor het vaststellen van de in [artikelen 134][ref1], [135][ref2], [136, eerste lid][ref3],
      en [137][ref4] bedoelde begrenzingen niet opgeteld bij de beleggingen van de instelling voor collectieve belegging
      in effecten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel137
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '137'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '138.1'
    text: |-
      In afwijking van [artikel 134, eerste lid][ref1], kan het beheerde vermogen van een instelling voor collectieve
      belegging in effecten tot ten hoogste twintig procent worden belegd in aandelen en obligaties van dezelfde
      uitgevende instelling indien in het fondsreglement of de statuten van de instelling voor collectieve belegging
      in effecten is bepaald dat het beleggingsbeleid van de instelling voor collectieve belegging in effecten erop is
      gericht de samenstelling van een bepaalde aandelen- of obligatie-index te volgen, en deze index voldoet aan de
      volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 138.1.a
    text: de samenstelling van de index is gediversifieerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel138
  - number: 138.1.b
    text: de index is representatief voor de markt waarop hij betrekking heeft; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel138
  - number: 138.1.c
    text: de index wordt op passende wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel138
  - number: '138.2'
    text: |-
      De Autoriteit Financiële Markten kan op aanvraag ontheffing verlenen van het eerste lid indien uitzonderlijke
      marktomstandigheden daartoe aanleiding geven. In dat geval kan het beheerde vermogen van de instelling voor
      collectieve belegging in effecten tot ten hoogste vijfendertig procent worden belegd in aandelen en obligaties van
      dezelfde uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel138
  - number: '139.1'
    text: |-
      Het beheerde vermogen van een instelling voor collectieve belegging in effecten als bedoeld in
      [artikel 4:61, eerste lid, van de wet][ref1] wordt tot ten hoogste twintig procent belegd in rechten van deelneming
      in beleggingsinstellingen als bedoeld in [artikel 130, onderdeel d of e][ref2], die zijn uitgegeven door dezelfde
      beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '139.2'
    text: |-
      De beleggingen in rechten van deelneming in beleggingsinstellingen als bedoeld in [artikel 130, onderdeel e][ref1],
      bedragen in totaal niet meer dan dertig procent van het beheerde vermogen van de instelling voor collectieve
      belegging in effecten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '140.1'
    text: |-
      Een beheerder verwerft, voor de door hem beheerde instellingen voor collectieve belegging in effecten als bedoeld
      in [artikel 4:61, eerste lid, van de wet][ref1] gezamenlijk, niet meer dan twintig procent van de aandelen met
      stemrecht in dezelfde uitgevende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '140.2'
    text: |-
      Het beheerde vermogen van een instelling voor collectieve belegging in effecten als bedoeld in
      [artikel 4:61, eerste lid, van de wet][ref1] wordt niet belegd in meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 140.2.a
    text: tien procent van de aandelen zonder stemrecht van dezelfde uitgevende instelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel140
  - number: 140.2.b
    text: tien procent van de obligaties van dezelfde uitgevende instelling;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel140
  - number: 140.2.c
    text: |-
      vijfentwintig procent van de rechten van deelneming in een beleggingsinstelling waarvan de rechten van deelneming
      op verzoek van de deelnemers ten laste van de activa direct of indirect worden ingekocht of terugbetaald van
      dezelfde beleggingsinstelling; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel140
  - number: 140.2.d
    text: tien procent van de geldmarktinstrumenten van dezelfde uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel140
  - number: '140.3'
    text: |-
      De begrenzingen, bedoeld in het tweede lid, aanhef en onderdelen b, c en d, hoeven niet in acht te worden genomen
      indien de bruto waarde van de obligaties of geldmarktinstrumenten of de nettowaarde van de rechten van deelneming
      in een beleggingsinstelling op het tijdstip van verwerving niet kan worden berekend.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel140
  - number: '141'
    text: |-
      [Artikel 140, eerste en tweede lid][ref1], is niet van toepassing op het verwerven van onderscheidenlijk het
      beleggen in:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel140
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '140'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 141.a
    text: |-
      effecten en geldmarktinstrumenten die zijn uitgegeven of worden gegarandeerd door een lidstaat, een openbaar
      lichaam met verordenende bevoegdheid in een lidstaat, een staat die geen lidstaat is of een internationale
      organisatie waarin een of meer lidstaten deelnemen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel141
  - number: 141.b
    text: |-
      aandelen in het kapitaal van een rechtspersoon, gevestigd in een staat die geen lidstaat is, die met inachtneming
      van de begrenzingen, bedoeld in de [artikelen 134][ref1], [135][ref2], [136, eerste lid][ref3], [137][ref4],
      [139][ref5] en [140][ref6] zijn vermogen in hoofdzaak belegt in effecten van uitgevende instellingen, gevestigd
      in die staat, wanneer krachtens de wet van die staat een dergelijke deelneming voor de instelling voor collectieve
      belegging in effecten de enige mogelijkheid is om in effecten van uitgevende instellingen in die staat te beleggen;
      of


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel137
      [ref5]: https://wetten.overheid.nl/BWBR0020421#Artikel139
      [ref6]: https://wetten.overheid.nl/BWBR0020421#Artikel140
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '137'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref5
        bwb_id: BWBR0020421
        artikel: '139'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref6
        bwb_id: BWBR0020421
        artikel: '140'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 141.c
    text: |-
      aandelen in het kapitaal van een dochteronderneming van de beleggingsmaatschappij die uitsluitend ten behoeve van
      de beleggingsmaatschappij bepaalde beheers-, advies- of verhandelingswerkzaamheden verricht in de staat waar de
      dochteronderneming is gevestigd, met het oog op de inkoop van rechten van deelneming op verzoek van deelnemers.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel141
  - number: '142'
    text: |-
      De [artikelen 134 tot en met 139][ref1] zijn gedurende zes maanden na het eerste aanbod van de rechten van
      deelneming in een instelling voor collectieve belegging in effecten niet van toepassing. De instelling voor
      collectieve belegging in effecten neemt gedurende die periode de beginselen van risicospreiding in haar beleggingen
      in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '143.1'
    text: |-
      De in deze paragraaf gestelde begrenzingen gelden niet bij de uitoefening van voorkeurrechten die zijn verbonden
      aan effecten en geldmarktinstrumenten die deel uitmaken van de activa van de instelling voor collectieve belegging
      in effecten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel143
  - number: '143.2'
    text: |-
      Wanneer de in deze paragraaf gestelde begrenzingen buiten de wil van de instelling voor collectieve belegging
      in effecten of ten gevolge van de uitoefening van voorkeurrechten worden overschreden, treft de instelling voor
      collectieve belegging in effecten, met inachtneming van de belangen van de deelnemers, de nodige maatregelen opdat
      deze overschrijding zo snel mogelijk ongedaan wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel143
  - number: '144'
    text: |-
      Een instelling voor collectieve belegging in effecten als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1]
      legt binnen vier weken na een verzoek daartoe van de Autoriteit Financiële Markten, dan wel binnen vier weken
      na afloop van het boekjaar, een mededeling van een accountant over aan de Autoriteit Financiële Markten waaruit
      blijkt dat de instelling voor collectieve belegging in effecten in overeenstemming heeft gehandeld met de
      [artikelen 130 tot en met 143][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '145'
    text: |-
      Gelijktijdig met de verkrijgbaarstelling van het prospectus, bedoeld in
      [artikel 4:50, tweede lid, van de wet][ref1], zendt de beheerder een afschrift van het prospectus en
      van de financiële bijsluiter van de instelling voor collectieve belegging in effecten als bedoeld in
      [artikel 4:61, eerste lid, van de wet][ref2] aan de Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '146.1'
    text: |-
      De balans en winst- en verliesrekening van een instelling voor collectieve belegging in effecten of de
      toelichtingen daarop bevatten de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.a
    text: tegoeden bij banken;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.b
    text: |-
      een onderscheid in de overzichten van de beleggingen, bedoeld in [artikel 122, eerste lid, onderdelen a en b][ref1],
      naar:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel122
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '122'
        hoofdstuk: '10'
        paragraaf: 10.3.1
        afdeling: '10.3'
  - number: 146.1.b.1°
    text: financiële instrumenten die zijn toegelaten tot de notering op een gereglementeerde markt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.b.2°
    text: |-
      financiële instrumenten die op een gereglementeerde markt of een andere markt in financiële instrumenten worden
      verhandeld;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.b.3°
    text: |-
      effecten als bedoeld in [artikel 130, onderdeel c][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 146.1.b.4°
    text: |-
      financiële instrumenten als bedoeld in [artikel 131, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel131
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '131'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 146.1.c
    text: |-
      een sluitend overzicht van de gesaldeerde mutaties in de verslagperiode in het eigen vermogen van de
      beleggingsmaatschappij of het beheerde vermogen van het beleggingsfonds ten gevolge van en uitgesplitst naar:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.c.1°
    text: inkomsten uit beleggingen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.c.2°
    text: overige inkomsten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.c.3°
    text: belastingen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.c.4°
    text: de bestemming, of voorgestelde bestemming, van het nettoresultaat;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.c.5°
    text: |-
      de vermeerdering of vermindering van het eigen vermogen van de beleggingsmaatschappij of van het beheerde vermogen
      van het beleggingsfonds;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.c.6°
    text: meer- en minderwaarde op beleggingen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.c.7°
    text: overige mutaties van de activa en passiva; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: 146.1.d
    text: |-
      het bedrag van de verplichtingen onderscheiden naar soort aan het einde van het boekjaar die voortvloeien uit
      verrichtingen met betrekking tot financiële derivaten en voorzover deze niet reeds in de balans en de winst- en
      verliesrekening zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
  - number: '146.2'
    text: |-
      Onverminderd [artikel 125, eerste lid][ref1], neemt een instelling voor collectieve belegging in effecten in de
      halfjaarcijfers de gegevens op, bedoeld in het eerste lid, onderdelen a en b, zoals deze luidden aan het einde van
      de eerste helft van het boekjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel125
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '125'
        hoofdstuk: '10'
        paragraaf: 10.3.1
        afdeling: '10.3'
  - number: '147.1'
    text: |-
      Een instelling voor collectieve belegging in effecten als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1]
      publiceert telkens wanneer zij of haar beheerder rechten van deelneming aanbiedt, verkoopt, inkoopt, of daarop
      terugbetaalt de koers, de verkoop- onderscheidenlijk inkoopprijs en het bedrag van de terugbetaling op de website
      van haar beheerder. De Autoriteit Financiële Markten kan op verzoek besluiten dat de instelling voor collectieve
      belegging in effecten deze bekendmaking eenmaal per maand doet, indien de belangen van de deelnemers daardoor niet
      worden geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '147.2'
    text: |-
      Het eerste lid is niet van toepassing op instellingen voor collectieve beleggingen in effecten als bedoeld in
      [artikel 126, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel126
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '126'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '147.3'
    text: |-
      Onverminderd [artikel 4:46a van de wet][ref1] brengt een instelling voor collectieve beleggingen in effecten als
      bedoeld in [artikel 126][ref2] de intrinsieke waarde van de rechten van deelneming ten minste tweemaal per week ter
      kennis van de Autoriteit Financiële Markten en publiceert zij de intrinsieke waarde van de rechten van deelneming
      tweemaal per maand op de website van haar beheerder waarbij tussen elk van de tijdstippen van publicatie een
      periode van ten minste een week ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel126
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '126'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '147.4'
    text: |-
      Een instelling voor collectieve belegging in effecten als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1]
      verschaft desgevraagd aan een deelnemer gegevens betreffende kwantitatieve begrenzingen die van toepassing zijn
      op het risicobeheer, de daartoe gekozen methodes en de recente ontwikkeling van de risico’s en rendementen van de
      voornaamste categorie financiële instrumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '148.1'
    text: |-
      De aanstelling van een schade-afhandelaar als bedoeld in [artikel 4:71, eerste lid, onderdeel e, van de wet][ref1]
      wordt niet beëindigd, tenzij de beëindiging gepaard gaat met de aanstelling van een opvolger.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '148.2'
    text: |-
      De schadeverzekeraar meldt de beëindiging van de aanstelling van de schade-afhandelaar binnen twee weken aan
      de Autoriteit Financiële Markten, onder overlegging van de akte van aanstelling van de opvolger van de schade-
      afhandelaar, waaruit diens naam, adres en bevoegdheden blijken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel148
  - number: '149.1'
    text: |-
      De schade-afhandelaar houdt van rechtswege op schade-afhandelaar te zijn vanaf de dag van het van toepassing
      verklaren van de schuldsaneringsregeling natuurlijke personen, de verlening van surséance van betaling, de
      faillietverklaring, de ontbinding, bedoeld in [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref1], de
      onderbewindstelling van één of meer goederen, bedoeld in [Titel 19 van Boek 1 van het Burgerlijk Wetboek][ref2], of
      de ondercuratelestelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002656
  - number: '149.2'
    text: |-
      De schadeverzekeraar meldt het overlijden, het van toepassing verklaren van de schuldsaneringsregeling
      natuurlijke personen, de surséance van betaling, de faillietverklaring, de ontbinding, bedoeld in
      [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref1], de onderbewindstelling van één of meer van de goederen,
      bedoeld in [Titel 19 van Boek 1 van het Burgerlijk Wetboek][ref2], of de ondercuratelestelling van de schade-
      afhandelaar binnen twee weken aan de Autoriteit Financiële Markten, onder overlegging van de akte van aanstelling
      van de opvolger van de schade-afhandelaar met ingang van de dag van het overlijden, het van toepassing verklaren
      van de schuldsaneringsregeling natuurlijke personen, de surséance van betaling, de faillietverklaring, de
      ontbinding, bedoeld in [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref3], de onderbewindstelling
      van één of meer van de goederen, bedoeld in [Titel 19 van Boek 1 van het Burgerlijk Wetboek][ref4], of de
      ondercuratelestelling. Uit de akte van aanstelling blijken de naam, het adres en de bevoegdheden van de opvolger
      van de schade-afhandelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0002656
  - number: 149a.1
    text: |-
      Een aanbieder, bemiddelaar of adviseur verschaft of ontvangt, voor het bemiddelen of adviseren inzake een
      betalingsbeschermer, complex product, hypothecair krediet of uitvaartverzekering, rechtstreeks of middellijk geen
      provisie die niet noodzakelijk is voor het verlenen van de betreffende dienst of deze mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149a
  - number: 149a.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149a
  - number: 149a.2.a
    text: provisies die worden verschaft door of aan de cliënt of degene die namens hem optreedt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149a
  - number: 149a.2.b
    text: |-
      afsluitprovisies of doorlopende provisies die worden verschaft door of aan een derde of degene die namens hem
      optreedt, indien:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149a
  - number: 149a.2.b.1°
    text: |-
      de bemiddelaar of adviseur de cliënt op uitvoerige, accurate en begrijpelijke wijze mededeling doet van het
      bestaan, de aard en het bedrag of, indien het bedrag niet kan worden achterhaald, de wijze van berekening van de
      provisie of in geval van provisie in natura de waarde in het economisch verkeer voordat de betreffende dienst wordt
      verleend; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149a
  - number: 149a.2.b.2°
    text: |-
      de verschaffing van de provisie de kwaliteit van de betreffende dienst ten goede komt en geen afbreuk doet aan de
      verplichting van de aanbieder, bemiddelaar of adviseur om zich in te zetten voor de belangen van de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149a
  - number: 149a.2.c
    text: relatiegeschenken, voor zover deze gezamenlijk op jaarbasis de waarde van € 100 niet overstijgen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149a
  - number: 149a.3
    text: |-
      Voor de toepassing van het tweede lid, onderdeel b, wordt onder «consument» in de definities van afsluitprovisie en
      doorlopende provisie, bedoeld in [artikel 1][ref1], mede verstaan een cliënt, niet zijnde een consument.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 149b.1
    text: |-
      Een adviseur die niet tevens aanbieder is of een bemiddelaar verstrekt in het kader van het tot stand brengen van
      een overeenkomst met een consument inzake een complex product of hypothecair krediet een dienstverleningsdocument
      aan de consument.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149b
  - number: 149b.2
    text: 'Het dienstverleningsdocument bevat de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149b
  - number: 149b.2.a
    text: de aard en reikwijdte van zijn dienstverlening;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149b
  - number: 149b.2.b
    text: |-
      de verschillende wijzen van zijn beloning, onderscheiden naar soort financieel product, alsmede een specificatie
      van de hoogte van de beloning.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149b
  - number: 149b.3
    text: |-
      Het dienstverleningsdocument wordt voorafgaand aan het adviseren of, indien het een bemiddelaar betreft die niet
      adviseert voorafgaand aan het bemiddelen verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149b
  - number: 149b.4
    text: |-
      De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot de wijze waarop de informatie,
      bedoeld in het tweede lid, in het dienstverleningsdocument wordt geformuleerd, gepresenteerd of verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel149b
  - number: '150.1'
    text: |-
      Een aanbieder betaalt geen afsluitprovisie die meer bedraagt dan de helft van de som van die afsluitprovisie en de
      totale doorlopende provisie terzake van de desbetreffende overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel150
  - number: '150.2'
    text: |-
      Een aanbieder betaalt de doorlopende provisie evenredig uit gedurende ten minste tien jaar na totstandkoming van de
      desbetreffende overeenkomst. Indien de looptijd van de overeenkomst korter is dan tien jaar, betaalt de aanbieder
      de doorlopende provisie evenredig uit gedurende die looptijd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel150
  - number: '150.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op overeenkomsten inzake complexe producten voor zover tussen
      de desbetreffende aanbieder en de consument door tussenkomst van dezelfde bemiddelaar ten minste drie maanden
      voorafgaand aan het sluiten daarvan een overeenkomst is gesloten inzake een financieel product dat onderdeel is van
      het desbetreffende complexe product.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel150
  - number: '150.4'
    text: |-
      Dit artikel is niet van toepassing op overeenkomsten inzake een betalingsbeschermer, een hypothecair krediet of
      een uitvaartverzekering.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel150
  - number: '151.1'
    text: |-
      Indien een overeenkomst met een consument inzake een complex product of hypothecair krediet tijdens de eerste vijf
      jaar na de totstandkoming vroegtijdig wordt beëindigd, anders dan door overlijden van de verzekerde of anders dan
      door verkoop van de onroerende zaak waarop het complex product of hypothecair krediet betrekking heeft, wordt de
      afsluitprovisie of provisie evenredig verminderd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel151
  - number: '151.2'
    text: |-
      Het eerste lid is niet van toepassing op overeenkomsten inzake complexe producten voor zover tussen de
      desbetreffende aanbieder en de consument door tussenkomst van dezelfde bemiddelaar ten minste drie maanden
      voorafgaand aan het sluiten daarvan een overeenkomst is gesloten inzake een financieel product dat onderdeel is van
      het desbetreffende complexe product.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel151
  - number: '152'
    text: |-
      [Artikel 4:74, eerste lid, van de wet][ref1], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 152.a
    text: |-
      overeenkomsten inzake krediet waarvoor bij het aangaan hypothecaire zekerheid wordt verleend of inzake krediet
      waarvoor reeds hypothecaire zekerheid bestaat, indien het krediet wordt verleend tegen een voor hypothecaire
      kredieten van de betrokken aanbieder gebruikelijk jaarlijks kostenpercentage;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel152
  - number: 152.b
    text: |-
      overeenkomsten inzake krediet, voorzover het krediet wordt aangeboden tegen onderpand van effecten als bedoeld
      in onderdeel a, dan wel onderdeel b van de definitie van effect in [artikel 1:1 van de wet][ref1], die tot
      zekerheid dienen voor de terugbetaling van het krediet aan een consument die reeds op het moment van aangaan
      van de overeenkomst inzake krediet bezitter is van de te verpanden effecten als bedoeld in onderdeel a, dan
      wel onderdeel b van de definitie van effect in [artikel 1:1 van de wet][ref2], van welk krediet het totale
      kredietbedrag gedurende de looptijd van de overeenkomst inzake het krediet niet hoger is dan zeventig procent van
      de waarde van de te verpanden effecten, indien het effecten betreffen als bedoeld in onderdeel a van de definitie
      van effect in [artikel 1:1 van de wet][ref3], dan wel niet hoger is dan tachtig procent van de waarde van de
      te verpanden effecten, indien het effecten betreffen als bedoeld in onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref4], en:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 152.b.1°
    text: |-
      die effecten als bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref1], zijn toegelaten tot de handel op een gereglementeerde markt; of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 152.b.2°
    text: |-
      de waarde van die effecten als bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref1], door middel van een openbare prijsaanduiding voor een ieder kenbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '153.1'
    text: |-
      De [artikelen 154 tot en met 158][ref1] zijn uitsluitend van toepassing op het verlenen van financiële diensten met
      betrekking tot consumptief krediet.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel154
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '154'
        hoofdstuk: '11'
        afdeling: '11.2'
  - number: '153.2'
    text: |-
      Het in deze afdeling bepaalde met betrekking tot de verhouding tussen een aanbieder en een bemiddelaar is van
      overeenkomstige toepassing op de verhouding tussen een bemiddelaar en een onderbemiddelaar.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel153
  - number: '154'
    text: Een bemiddelaar heeft slechts aanspraak op provisie ter zake van tot stand gekomen overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel154
  - number: '155.1'
    text: |-
      Een bemiddelaar heeft alleen per maand gedurende de looptijd van een overeenkomst inzake krediet welke door zijn
      bemiddeling tot stand is gekomen aanspraak op provisie ten bedrage van een percentage van het uitstaand saldo ter
      zake van die overeenkomst, zoals dat saldo luidt op de laatste dag van de desbetreffende maand.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel155
  - number: '155.2'
    text: |-
      De aanbieder en bemiddelaar kunnen het ter zake van de bemiddeling overeengekomen provisiepercentage, met
      uitzondering van het provisiepercentage voor reeds tot stand gekomen overeenkomsten inzake krediet, niet zijnde
      doorlopend krediet, wijzigen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel155
  - number: 155.2.a
    text: een percentage telkens voor een aaneengesloten tijdvak van ten minste een maand wordt overeengekomen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel155
  - number: 155.2.b
    text: |-
      ten aanzien van reeds tot stand gekomen overeenkomsten het percentage telkens eerst na 24 maanden kan worden
      gewijzigd uitsluitend in het percentage dat tussen de aanbieder en de bemiddelaar voor nieuw af te sluiten
      overeenkomsten geldt op het tijdstip waarop de wijziging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel155
  - number: '156'
    text: |-
      Een bemiddelaar heeft over de periode waarin een consument ten minste twee maanden achterstallig is in de betaling
      van een vervallen termijnbedrag, geen aanspraak op provisie ter zake van de desbetreffende overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel156
  - number: '157.1'
    text: |-
      Met ingang van het tijdstip waarop een aanbieder het door een consument verschuldigde vervroegd opeist in een
      geval als bedoeld in [artikel 33, aanhef en onderdeel c, van de Wet op het consumentenkrediet][ref1], heeft de
      bemiddelaar geen aanspraak meer op provisie ter zake van de desbetreffende overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel33
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '33'
  - number: '157.2'
    text: |-
      Met ingang van het tijdstip waarop een overeenkomst van rechtswege wordt ontbonden op grond van
      [artikel 41, derde lid, van de Wet op het consumentenkrediet][ref1], heeft de bemiddelaar geen aanspraak meer op
      provisie ter zake van de desbetreffende overeenkomst, met dien verstande dat indien de ontbinding ongedaan wordt
      gemaakt op grond van [artikel 42, tweede lid, van de Wet op het consumentenkrediet][ref2], hij weer aanspraak heeft
      opprovisie over de periode gerekend vanaf het tijdstip waarop de ontbinding ongedaan is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel42
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '42'
  - number: '158.1'
    text: |-
      Een bemiddelaar krijgt geen provisie uitbetaald indien hij uit hoofde van dit besluit geen aanspraak heeft op
      provisie.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel158
  - number: '158.2'
    text: Provisie wordt uitsluitend betaald in giraal geld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel158
  - number: '159.1'
    text: |-
      De beroepsaansprakelijkheidsverzekering, bedoeld in [artikel 4:75, eerste lid, van de wet][ref1], dekt de
      aansprakelijkheid van de bemiddelaar wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van diens
      beroep en voorgevallen op het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '159.2'
    text: 'De beroepsaansprakelijkheidsverzekering wordt gesloten bij:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel159
  - number: 159.2.a
    text: |-
      een financiële onderneming die voor het uitoefenen van het bedrijf van schadeverzekeraar een door de Nederlandsche
      Bank verleende vergunning heeft voor de branche Algemene aansprakelijkheid; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel159
  - number: 159.2.b
    text: |-
      een financiële onderneming met zetel in een andere lidstaat die als schadeverzekeraar haar bedrijf mag uitoefenen
      vanuit een in Nederland gelegen bijkantoor of door middel van het verrichten van diensten naar Nederland.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel159
  - number: '160.1'
    text: |-
      Onder een vergelijkbare voorziening als bedoeld in [artikel 4:75, eerste lid, van de wet][ref1] wordt verstaan een
      onvoorwaardelijke garantstelling voor alle verplichtingen voortvloeiend uit aansprakelijkheid van de bemiddelaar
      wegens fouten, verzuimen of nalatigheden, begaan in de uitoefening van diens beroep en voorgevallen op het
      grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '160.2'
    text: 'De onvoorwaardelijke garantstelling wordt verstrekt door:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel160
  - number: 160.2.a
    text: |-
      een financiële onderneming die voor het uitoefenen van het bedrijf van bank een door de Nederlandsche Bank
      verleende vergunning heeft;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel160
  - number: 160.2.b
    text: |-
      een financiële onderneming met zetel in een andere lidstaat die als bank haar bedrijf mag uitoefenen vanuit een in
      Nederland gelegen bijkantoor of door middel van het verrichten van diensten naar Nederland; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel160
  - number: 160.2.c
    text: |-
      een bank met zetel in de Verenigde Staten van Amerika, Japan, Australië, Canada of Zwitserland die in de staat van
      haar zetel onder toezicht staat.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel160
  - number: '161'
    text: |-
      De [artikelen 159][ref1] en [160][ref2] zijn van overeenkomstige toepassing op de
      beroepsaansprakelijkheidsverzekering en de vergelijkbare voorziening, bedoeld in
      [artikel 4:76, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel160
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '159'
        hoofdstuk: '11'
        afdeling: '11.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '160'
        hoofdstuk: '11'
        afdeling: '11.3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '162.1'
    text: |-
      Een clearinginstelling stelt een cliënt na afloop van elke handelsdag schriftelijk of langs elektronische weg in
      kennis van de aantallen en waarden van de financiële instrumenten die op zijn naam staan.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel162
  - number: '162.2'
    text: |-
      Indien de waarde van de verplichtingen worden berekend overeenkomstig tussen de clearinginstelling en een cliënt
      overeengekomen parameters en de waarde van de financiële instrumenten van de cliënt onvoldoende dekking bieden ten
      opzichte van de door de cliënt aangegane verplichtingen, stelt de clearinginstelling de cliënt daar onverwijld van
      in kennis.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel162
  - number: '163.1'
    text: |-
      Een beleggingsonderneming met zetel in Nederland verstrekt de jaarrekening, het jaarverslag en de overige
      gegevens, bedoeld in [artikel 4:85, eerste lid, van de wet][ref1], wat de indeling en inhoud betreft in de vorm
      waarin deze zijn opgemaakt krachtens [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2] of de internationale
      jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003045
  - number: '163.2'
    text: |-
      Een beleggingsonderneming met zetel in een staat die geen lidstaat is verstrekt de jaarrekening en het jaarverslag,
      bedoeld in [artikel 4:85, vierde lid][ref1], wat de indeling en inhoud betreft in de vorm waarin deze zijn
      opgemaakt ingevolge het recht van de staat waar de beleggingsonderneming haar zetel heeft of de internationale
      jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '164.1'
    text: 'Een beleggingsonderneming die orders van cliënten uitvoert:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164
  - number: 164.1.a
    text: |-
      registreert orders die in naam van cliënten worden uitgevoerd onmiddellijk en correct en wijst deze onmiddellijk en
      correct toe;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164
  - number: 164.1.b
    text: |-
      voert vergelijkbare orders van cliënten in volgorde van ontvangst en onmiddellijk uit, tenzij de aard van de
      order of de heersende marktomstandigheden dit onmogelijk maken of in het belang van de cliënt anders moet worden
      gehandeld; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164
  - number: 164.1.c
    text: |-
      brengt een een cliënt die niet-professionele belegger is onverwijld op de hoogte van een probleem dat een correcte
      uitvoering van diens order ernstig belemmert, zodra zij kennis neemt van dat probleem.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164
  - number: '164.2'
    text: |-
      Een beleggingsonderneming die verantwoordelijk is voor de controle op of de regeling van de afwikkeling van een
      uitgevoerde order neemt alle redelijke maatregelen om ervoor te zorgen dat alle financiële instrumenten of gelden
      van de cliënt die bij de afwikkeling van deze uitgevoerde order worden ontvangen, onmiddellijk op correcte wijze op
      de rekening van de cliënt worden bijgeschreven.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164
  - number: '164.3'
    text: |-
      Een beleggingsonderneming maakt geen misbruik van informatie over lopende orders van cliënten en neemt alle
      redelijke maatregelen om misbruik van dergelijke informatie door haar relevante personen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164
  - number: 164a.1
    text: |-
      Een beleggingsonderneming voert een order van een cliënt of een transactie voor eigen rekening niet samen met een
      andere order van een cliënt uit, tenzij:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164a
  - number: 164a.1.a
    text: het onwaarschijnlijk is dat de samenvoeging van de orders en transacties nadelig is voor de betrokken cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164a
  - number: 164a.1.b
    text: zij de betrokken cliënt ervan op de hoogte heeft gesteld dat de samenvoeging voor hem nadelig kan zijn;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164a
  - number: 164a.1.c
    text: |-
      zij een ordertoewijzingsbeleid heeft vastgesteld en geïmplementeerd dat voldoende nauwkeurig voorziet in een
      billijke toewijzing van samengevoegde orders en transacties en dat onder meer voorschrijft hoe het volume en de
      prijs van orders bepalend zijn voor de toewijzingen en de behandeling van gedeeltelijke uitvoeringen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164a
  - number: 164a.2
    text: |-
      Indien een beleggingsonderneming een order samenvoegt met andere orders van cliënten en de samengevoegde
      order slechts ten dele wordt uitgevoerd, wijst zij de desbetreffende transacties toe overeenkomstig haar
      ordertoewijzingsbeleid.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164a
  - number: 164b.1
    text: |-
      Een beleggingsonderneming die een transactie voor eigen rekening samenvoegt met een order van een cliënt, wijst de
      desbetreffende transactie niet toe op een voor de cliënt nadelige wijze.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164b
  - number: 164b.2
    text: |-
      Indien een beleggingsonderneming een order van een cliënt samenvoegt met een transactie voor eigen rekening en
      de samengevoegde order slechts ten dele wordt uitgevoerd, geeft zij de order van de cliënt bij de toewijzing
      van de desbetreffende transactie voorrang op haar eigen transactie. Het is de beleggingsonderneming slechts
      toegestaan een transactie als bedoeld in de vorige volzin naar evenredigheid toe te wijzen overeenkomstig haar
      orderuitvoeringsbeleid, bedoeld in [artikel 59][ref1], indien zij kan aantonen dat de order van de cliënt niet of
      niet op dezelfde gunstige voorwaarden had kunnen uitvoeren als deze niet was samengevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '59'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 164b.3
    text: |-
      Een beleggingsonderneming beschikt in het kader van het ordertoewijzingsbeleid, bedoeld in [artikel 59][ref1], over
      procedures die voorkomen dat transacties voor eigen rekening die samen met orders van cliënten worden uitgevoerd,
      op een voor de cliënt nadelige wijze opnieuw worden toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel164b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '59'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: '165.1'
    text: 'Een beleggingsonderneming:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165
  - number: 165.1.a
    text: |-
      houdt alle gegevens en rekeningen bij die noodzakelijk zijn om haar op elk moment onmiddellijk in staat te stellen
      de financiële instrumenten en gelden die voor een cliënt worden aangehouden, te onderscheiden van voor andere
      cliënten aangehouden financiële instrumenten en gelden en hun eigen financiële instrumenten en gelden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165
  - number: 165.1.b
    text: |-
      houdt de onder a bedoelde gegevens en rekeningen op zodanige wijze bij dat deze altijd accuraat zijn en in elk
      geval de voor cliënten aangehouden financiële instrumenten en gelden weerspiegelen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165
  - number: 165.1.c
    text: |-
      gaat regelmatig na of de onder a bedoelde gegevens en rekeningen overeenstemmen met die van eventuele derden door
      wie deze financiële instrumenten en gelden worden aangehouden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165
  - number: 165.1.d
    text: |-
      draagt er zorg voor dat financiële instrumenten van cliënten die overeenkomstig [artikel 165a][ref1] bij een derde
      worden aangehouden, door middel van verschillend getitelde rekeningen in de boeken van de derde of door middel van
      andere vergelijkbare maatregelen waarmee hetzelfde beschermingsniveau wordt bereikt, kunnen worden onderscheiden
      van de financiële instrumenten die aan de beleggingsonderneming zelf toebehoren, en van de financiële instrumenten
      die aan de derde toebehoren;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel165a
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 165a
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 165.1.e
    text: |-
      draagt er zorg voor dat de gelden van cliënten die overeenkomstig [artikel 165b][ref1] worden aangehouden op een
      rekening of rekeningen die kan of kunnen worden onderscheiden van alle rekeningen die worden gebruikt voor het
      aanhouden van gelden die aan de beleggingsonderneming zelf toebehoren;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel165b
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 165b
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 165.1.f
    text: |-
      treft passende organisatorische maatregelen om het risico van verlies of vermindering van de financiële
      instrumenten en gelden van cliënten, dan wel van hun rechten daarop, als gevolg van misbruik van financiële
      instrumenten en gelden, fraude, wanbeheer, het bijhouden van ontoereikende gegevens of nalatigheid tot een minimum
      te beperken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165
  - number: '165.2'
    text: 'De Autoriteit Financiële Markten stelt regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165
  - number: 165.2.a
    text: |-
      de maatregelen ter bescherming van de rechten van de cliënt en ter voorkoming van het gebruik van financiële
      instrumenten of gelden van de cliënt, bedoeld in [artikel 4:87, eerste en tweede lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 165.2.b
    text: |-
      de wijze waarop de instemming, bedoeld in [artikel 4:87, eerste lid, onderdeel b][ref1], van de cliënt kan worden
      verkregen voor gebruik van diens financiële instrumenten voor eigen rekening door de beleggingsonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 165a.1
    text: |-
      Een beleggingsonderneming die financiële instrumenten voor een cliënt aanhoudt op een rekening bij een derde, past
      de nodige bekwaamheid, zorgvuldigheid en waakzaamheid toe bij de selectie, aanwijzing en periodieke beoordeling
      van de derde en van de regelingen voor het aanhouden en bewaren van de betrokken financiële instrumenten. De
      beleggingsonderneming houdt daarbij rekening met de deskundigheid en marktreputatie van de betrokken derde,
      evenals met alle op het aanhouden van deze financiële instrumenten betrekking hebbende wettelijke verplichtingen of
      marktpraktijken die de rechten van de cliënt nadelig kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165a
  - number: 165a.2
    text: |-
      Indien het bewaren van financiële instrumenten voor rekening van een andere persoon onderworpen is aan specifieke
      regelgeving in een rechtsgebied waar een beleggingsonderneming deze financiële instrumenten van cliënten bij een
      derde wil aanhouden, houdt de beleggingsonderneming deze financiële instrumenten niet aan in dat rechtsgebied bij
      een derde die niet aan het toezicht op de naleving van deze regels onderworpen is.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165a
  - number: 165a.3
    text: |-
      Een beleggingsonderneming houdt financiële instrumenten niet voor een cliënt aan bij een derde in een staat die
      geen lidstaat is waar het aanhouden en bewaren van financiële instrumenten voor rekening van een andere persoon
      niet aan regels is gebonden, tenzij:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165a
  - number: 165a.3.a
    text: |-
      de aard van de financiële instrumenten of van de met deze instrumenten verband houdende beleggingsdiensten vereist
      dat ze worden aangehouden bij een derde in die staat; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165a
  - number: 165a.3.b
    text: |-
      indien het financiële instrumenten betreft die voor een professionele belegger worden aangehouden, deze aan de
      beleggingsonderneming schriftelijk heeft verzocht om ze in die staat bij een derde aan te houden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165a
  - number: 165b.1
    text: |-
      Een beleggingsonderneming die gelden van een cliënt ontvangt stort deze gelden onmiddellijk op een of meer
      rekeningen bij:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165b
  - number: 165b.1.a
    text: een centrale bank;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165b
  - number: 165b.1.b
    text: een bank waaraan een vergunning als bedoeld in de herziene richtlijn banken is verleend;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165b
  - number: 165b.1.c
    text: |-
      een bank waaraan in een staat die geen lidstaat is vergunning is verleend voor het uitoefenen van het bedrijf van
      bank;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165b
  - number: 165b.1.d
    text: een erkend geldmarktfonds.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165b
  - number: 165b.2
    text: |-
      Het eerste lid is niet van toepassing op beleggingsondernemingen waaraan een vergunning is verleend voor het
      uitoefenen van het bedrijf van bank.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165b
  - number: 165b.3
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onderdeel d, wordt onder een erkend geldmarktfonds verstaan een
      erkend geldmarktfonds in de zin van artikel 18, tweede lid, van de uitvoeringsrichtlijn markten voor financiële
      instrumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165b
  - number: 165b.4
    text: |-
      Indien de beleggingsonderneming gelden niet bij een centrale bank aanhoudt, past zij de nodige bekwaamheid,
      zorgvuldigheid en waakzaamheid toe bij de selectie, aanwijzing en periodieke beoordeling van de bank of het
      geldmarktfonds waar de gelden worden gestort, en van de regelingen voor het aanhouden van de gelden in kwestie.
      De beleggingsonderneming houdt in elk geval rekening met de deskundigheid en de marktreputatie van de bank of het
      geldmarktfonds om de rechten van cliënten te beschermen, evenals met alle op het aanhouden van gelden van cliënten
      betrekking hebbende wettelijke verplichtingen of marktpraktijken die de rechten van de cliënt nadelig kunnen
      beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165b
  - number: 165b.5
    text: |-
      Een beleggingsonderneming die gelden wil aanhouden bij een erkend geldmarktfonds heeft een interne
      klachtenprocedure die er in voorziet dat cliënten daartegen bezwaar kunnen maken.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165b
  - number: 165c.1
    text: |-
      Een beleggingsonderneming gaat geen overeenkomsten inzake effectenfinancieringstransacties aan met betrekking
      tot financiële instrumenten die zij voor een cliënt aanhoudt, en maakt ook niet anderszins gebruik van dergelijke
      financiële instrumenten voor eigen rekening of voor rekening van een andere cliënt van de onderneming, tenzij:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165c
  - number: 165c.1.a
    text: |-
      de cliënt vooraf uitdrukkelijk heeft ingestemd met het gebruik van de financiële instrumenten onder daarbij
      gespecificeerde voorwaarden, hetgeen bij een niet-professionele belegger wordt aangetoond door zijn handtekening;
      en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165c
  - number: 165c.1.b
    text: |-
      de financiële instrumenten van deze cliënt uitsluitend worden gebruikt onder de gespecificeerde voorwaarden waarmee
      de cliënt heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165c
  - number: 165c.2
    text: |-
      Een beleggingsonderneming gaat geen overeenkomsten inzake effectenfinancieringstransacties aan met betrekking tot
      financiële instrumenten die zij voor een cliënt op een omnibusrekening bij een derde aanhoudt, en maakt ook niet
      anderszins gebruik van dergelijke financiële instrumenten voor eigen rekening of voor rekening van een andere
      cliënt, tenzij, onverminderd het eerste lid:
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165c
  - number: 165c.2.a
    text: de cliënt vooraf uitdrukkelijk zijn instemming heeft verleend; of
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165c
  - number: 165c.2.b
    text: |-
      de beleggingsonderneming beschikt over systemen en controlemiddelen die waarborgen dat de betrokken financiële
      instrumenten toebehoren aan cliënten die vooraf uitdrukkelijk hun instemming hebben verleend. Op het verlenen van
      instemming is het eerste lid, onderdeel a, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165c
  - number: 165c.3
    text: |-
      De gegevens van de beleggingsonderneming omvatten bijzonderheden over de cliënt met wiens toestemming de financiële
      instrumenten zijn gebruikt, alsook het aantal gebruikte financiële instrumenten dat toebehoort aan elke cliënt die
      zijn instemming heeft verleend, teneinde eventuele verliezen op correcte wijze te kunnen toewijzen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165c
  - number: 165d
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:87, eerste en tweede lid, van de wet][ref1] legt eenmaal per
      jaar aan de Autoriteit Financiële Markten een verslag over van een externe accountant over de deugdelijkheid van de
      in haar bedrijfsvoering getroffen maatregelen om te voldoen aan de [artikelen 165 tot en met 165c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel165
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel165d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '165'
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: '166'
    text: |-
      Een vermogensbeheerder die tevens beheerder van een instelling voor collectieve belegging in effecten met zetel in
      Nederland is, belegt in het kader van het beheer van een individueel vermogen de gelden van de cliënt niet geheel
      of gedeeltelijk in door hem beheerde beleggingsinstellingen zonder de voorafgaande schriftelijke toestemming van
      de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel166
  - number: '167'
    text: |-
      Het beleid, bedoeld in [artikel 4:88, eerste lid, van de wet][ref1], is gericht op het herkennen van in elk geval
      de volgende situaties:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 167.a
    text: |-
      de beleggingsonderneming, een relevante persoon of een persoon die met de beleggingsonderneming is verbonden door
      een zeggenschapsband kan financieel gewin behalen of een financieel verlies vermijden ten koste van de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel167
  - number: 167.b
    text: |-
      de onderneming, een relevante persoon of een persoon die met de beleggingsonderneming is verbonden door een
      zeggenschapsband heeft een belang bij het resultaat van een ten behoeve van de cliënt verrichte dienst of een
      namens de cliënt uitgevoerde transactie, dat verschilt van het belang van de cliënt bij dit resultaat;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel167
  - number: 167.c
    text: |-
      de onderneming, een relevante persoon of een persoon die met de beleggingsonderneming is verbonden door een
      zeggenschapsband heeft een financiële of andere drijfveer om het belang van een andere cliënt of groep cliënten te
      laten voorgaan boven het belang van de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel167
  - number: 167.d
    text: |-
      de onderneming, een relevante persoon of een persoon die met de beleggingsonderneming is verbonden door een
      zeggenschapsband oefent hetzelfde bedrijf uit als de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel167
  - number: 167.e
    text: |-
      de onderneming, een relevante persoon of een persoon die met de beleggingsonderneming is verbonden door een
      zeggenschapsband ontvangt van een andere persoon dan de cliënt voor een ten behoeve van de cliënt verrichte
      beleggingsactiviteit, verleende beleggingsdienst of verleende nevendienst een provisie in de vorm van gelden,
      goederen of diensten die verschilt van de gebruikelijke provisie of vergoeding voor deze activiteit of dienst, of
      zal een dergelijke provisie ontvangen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel167
  - number: 167a.1
    text: |-
      Een beleggingsonderneming legt het beleid, bedoeld in [artikel 4:88, eerste lid, van de wet][ref1], schriftelijk
      vast en draagt er zorg voor dit beleid te implementeren en in stand te houden. Het beleid is evenredig aan de
      omvang en organisatie van de beleggingsonderneming en aan de aard, schaal en complexiteit van haar bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 167a.2
    text: |-
      Indien de beleggingsonderneming deel uitmaakt van een groep, heeft het beleid ook betrekking op belangenconflicten
      die kunnen ontstaan als gevolg van de structuur en bedrijfsactiviteiten van andere ondernemingen die deel uitmaken
      van de groep.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel167a
  - number: 167a.3
    text: |-
      Het beleid omschrijft, onder verwijzing naar de specifieke beleggingsdiensten, beleggingsactiviteiten en
      nevendiensten die door of in naam van de beleggingsonderneming worden verleend, onderscheidenlijk verricht, de
      omstandigheden die een belangenconflict vormen of kunnen doen ontstaan dat een wezenlijk risico met zich brengt dat
      de belangen van een cliënt worden geschaad, alsmede de te volgen procedures en te nemen maatregelen voor het omgaan
      met een dergelijk conflict.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel167a
  - number: 167a.4
    text: |-
      Het overeenkomstig het eerste lid vastgestelde beleid vermeldt de te volgen procedures en te nemen maatregelen voor
      het beheersen van een belangenconflict als bedoeld in [artikel 4:88, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 167b
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:88, tweede lid, van de wet][ref1], brengt de cliënt, indien
      een belangenconflict onvermijdelijk blijkt te zijn, hiervan door middel van een duurzame drager op de hoogte. De
      beleggingsonderneming vermeldt daarbij, met inachtneming van de kenmerken van de cliënt, voldoende bijzonderheden
      om deze in staat te stellen met kennis van zaken een beslissing te nemen ten aanzien van de beleggingsdienst,
      beleggingsactiviteit of nevendienst in verband waarmee het belangenconflict zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel167b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '168.1'
    text: |-
      In een overeenkomst als bedoeld in [artikel 4:89, eerste lid, van de wet][ref1] zijn ten minste bepaald:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 168.1.a
    text: |-
      de naar soort onderscheiden diensten die de beleggingsonderneming in het kader van de overeenkomst voor de cliënt
      zal verrichten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.1.b
    text: |-
      een specificatie van de eventuele beperkingen met betrekking tot de markten waarop transacties in financiële
      instrumenten ten behoeve van de cliënt zullen worden afgewikkeld;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.1.c
    text: |-
      de naar soort onderscheiden kosten, anders dan de kosten ter zake van een aanbieding van effecten als bedoeld
      in [hoofdstuk 5.1 van de wet][ref1], die aan de cliënt in rekening worden gebracht alsmede de aan die kosten ten
      grondslag liggende berekening;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk5.1
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0020368
        hoofdstuk: '5.1'
  - number: 168.1.d
    text: |-
      de wijze waarop instructies van de cliënt en berichten van de beleggingsonderneming worden verstrekt en
      geadministreerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.1.e
    text: de wijze waarop gelden of financiële instrumenten van de cliënt worden verrekend, gedeponeerd en geadministreerd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.1.f
    text: de wijze waarop over de rekeningen van de cliënt kan worden beschikt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.1.g
    text: |-
      de regeling van de aansprakelijkheid van de beleggingsonderneming onderscheidenlijk de cliënt uit hoofde van de
      overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.1.h
    text: |-
      een verklaring van de cliënt dat hij heeft kennis genomen van de informatie die de beleggingsonderneming krachtens
      dit besluit aan hem dient te verstrekken en dat hij zich bewust is van de risico’s die aan de belegging zijn
      verbonden;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.1.i
    text: het toepasselijke recht en de wijze van beslechting van geschillen; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.1.j
    text: |-
      de omstandigheden waaronder de overeenkomst tussen de beleggingsonderneming en de cliënt een einde neemt, de
      omstandigheden waaronder de overeenkomst kan worden ontbonden en de wijze waarop op of na de datum van beëindiging
      nog lopende transacties worden afgewikkeld.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: '168.2'
    text: 'Indien de overeenkomst betrekking heeft op individueel vermogensbeheer is daarin tevens bepaald:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.2.a
    text: |-
      de samenstelling van het beheerde vermogen naar soort financieel instrument en de waarde van het te beheren
      vermogen ten tijde van het sluiten van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.2.b
    text: de doelstellingen van de cliënt ter zake van het vermogensbeheer;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.2.c
    text: |-
      een specificatie van de eventuele kwalitatieve en kwantitatieve beperkingen ten aanzien van de financiële
      instrumenten of categorieën van financiële instrumenten waarin mag worden belegd;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.2.d
    text: |-
      de wijze waarop het beheer wordt gevoerd alsmede de betrokkenheid van de cliënt daarbij, daaronder een regeling van
      de machtiging aan de beleggingsonderneming; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168.2.e
    text: de frequentie van rapportage aan de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168
  - number: 168a.1
    text: |-
      Een beleggingsonderneming verschaft of ontvangt voor het verlenen van een beleggingsdienst of nevendienst geen
      provisie die niet noodzakelijk is voor het verlenen van de betreffende dienst of deze mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168a
  - number: 168a.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168a
  - number: 168a.2.a
    text: provisies die worden verschaft door of aan de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168a
  - number: 168a.2.b
    text: 'provisies die worden verschaft door of aan een derde, indien:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168a
  - number: 168a.2.b.1°
    text: |-
      de cliënt op uitvoerige, accurate en begrijpelijke wijze mededeling wordt gedaan van het bestaan, de aard en het
      bedrag of, indien het bedrag niet kan worden achterhaald, de wijze van berekening daarvan, van de provisie voordat
      de desbetreffende dienst wordt verleend; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168a
  - number: 168a.2.b.2°
    text: |-
      de verschaffing van de provisie de kwaliteit van de desbetreffende dienst ten goede komt en geen afbreuk doet aan
      de verplichting van de beleggingsonderneming om zich in te zetten voor de belangen van de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168a
  - number: 168a.3
    text: |-
      De beleggingsonderneming voldoet aan de voorwaarde, bedoeld in het tweede lid, onderdeel b, aanhef en onder 1°,
      indien zij in samengevatte vorm mededeling doet van de essentiële voorwaarden van de regelingen voor provisies
      en zij de cliënt informeert over de mogelijkheid om nadere bijzonderheden te verkrijgen en deze op verzoek van de
      cliënt verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168a
  - number: 168a.4
    text: |-
      Onder cliënt of derde in de zin van het tweede lid worden mede verstaan personen die handelen namens de cliënt
      onderscheidenlijk de derde.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168a
  - number: 168b
    text: |-
      Een overeenkomst als bedoeld in [artikel 4:71c, eerste lid, van de wet][ref1], bepaalt, voor zover van toepassing,
      in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 168b.a
    text: 'ten aanzien van de verschuldigde premie:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.a.1°
    text: het bedrag van de verschuldigde premie;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.a.2°
    text: de wijze waarop en de termijnen waarin de verschuldigde premie wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.a.3°
    text: de procedures die gelden bij het niet nakomen van premiebetalingsverplichtingen door de bijdragende onderneming;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.b
    text: 'ten aanzien van de kosten:'
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.b.1°
    text: het bedrag van de totale kosten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.b.2°
    text: |-
      de kosten die worden ingehouden op de premie, onderverdeeld naar soorten kosten, zoals in elk geval de eerste
      kosten, de doorlopende kosten en de aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.b.3°
    text: |-
      de kosten die worden ingehouden op de vermogensopbouw of uitkering, onderverdeeld naar soorten kosten, zoals in elk
      geval de eerste kosten, de doorlopende kosten en de aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.b.4°
    text: |-
      de invloed van het gemiddelde jaarlijkse percentage van de kosten, bedoeld onder 2° en 3°, op het rendement, de
      vermogensopbouw of uitkering, verbonden aan de overeenkomst; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.b.5°
    text: de wijze waarop de kosten, bedoeld onder 2° en 3°, worden verdeeld over de looptijd van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.c
    text: |-
      de informatie die de bijdragende onderneming verstrekt aan de premiepensioeninstelling en de wijze waarop deze
      informatie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.d
    text: |-
      de informatie die de premiepensioeninstelling verstrekt aan de bijdragende onderneming, pensioendeelnemers en
      pensioengerechtigden en de wijze waarop deze informatie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.e
    text: de door de premiepensioeninstelling in acht te nemen beleggingsbeginselen en beleggingsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.f
    text: |-
      of, en onder welke voorwaarden pensioendeelnemers wordt toegestaan de verantwoordelijkheid voor beleggingen over
      te nemen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.g
    text: de voorwaarden die gelden voor inbreng en overdracht van waarden van opgebouwde pensioenaanspraken;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.h
    text: de wijze waarop sterftewinsten worden toebedeeld;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.i
    text: |-
      de criteria die de premiepensioeninstelling hanteert bij de keuze van een derde voor de inkoop van een
      pensioenuitkering;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.j
    text: |-
      of de premiepensioeninstelling een dekking tegen biometrische risico’s of garanties zal betrekken van een derde en,
      indien relevant, de criteria die zij zal hanteren bij de keuze van een derde;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.k
    text: de voorwaarden die gelden bij beëindiging van de overeenkomst; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168b.l
    text: het toepasselijke recht en de wijze van beslechting van geschillen.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168b
  - number: 168c
    text: |-
      Een overeenkomst als bedoeld in [artikel 4:71c, tweede lid, van de wet][ref1], bepaalt in ieder geval dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 168c.a
    text: de pensioenbewaarder in het belang van de pensioendeelnemers en pensioengerechtigden optreedt;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168c
  - number: 168c.b
    text: |-
      over het in bewaring gegeven pensioenvermogen slechts kan worden beschikt door de premiepensioeninstelling en de
      pensioenbewaarder tezamen;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168c
  - number: 168c.c
    text: |-
      de pensioenbewaarder het in bewaring gegeven pensioenvermogen slechts afgeeft tegen ontvangst van een verklaring
      van de premiepensioeninstelling waaruit blijkt dat afgifte wordt verlangd in verband met de regelmatige uitoefening
      van het bedrijf van premiepensioeninstelling; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168c
  - number: 168c.d
    text: |-
      de pensioenbewaarder volgens het recht van de staat waar de premiepensioeninstelling haar zetel heeft jegens
      de premiepensioeninstelling, de pensioendeelnemers en de pensioengerechtigden aansprakelijk is voor door hen
      geleden schade voorzover de schade het gevolg is van verwijtbare niet-nakoming of gebrekkige nakoming van zijn
      verplichtingen, ook indien de pensioenbewaarder het bij hem in bewaring gegeven pensioenvermogen geheel of
      gedeeltelijk aan een derde heeft toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel168c
  - number: '169'
    text: |-
      [Artikel 3, eerste lid, aanhef en onderdeel a][ref1], is niet van toepassing op houders van een ontheffing als
      bedoeld in [artikel 4:3, vierde lid, van de wet][ref2] die is verleend voor 15 september 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '170'
    text: |-
      Tot 1 oktober 2007 is [artikel 6][ref1] niet van toepassing op financiëledienstverleners die niet bemiddelen
      in verzekeringen, optreden als gevolmachtigde agent of optreden als ondergevolmachtigde agent, voorzover zij op
      1 januari 2006 niet voldeden aan [artikel 17 van het Besluit financiële dienstverlening][ref2] en aannemelijk
      kunnen maken dat zij vanaf 1 oktober 2007 wel zullen voldoen aan [artikel 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '171.1'
    text: |-
      Een diploma is voor de toepassing van [artikel 6, eerste lid, onderdeel a, en tweede lid, onderdeel a][ref1],
      geldig, indien het diploma:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 171.1.a
    text: tussen 1 januari 2000 en 1 oktober 2007 is behaald; en
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel171
  - number: 171.1.b
    text: |-
      wordt genoemd in de eerste kolom van [bijlage I][ref1], en is afgegeven door een in de tweede kolom genoemde
      instelling, voor de eindtermen, bedoeld in de derde kolom van de tabel.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '171.2'
    text: |-
      Een diploma is voor de toepassing van [artikel 6, eerste lid, onderdeel a, en tweede lid, onderdeel a][ref1],
      geldig, indien het diploma:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 171.2.a
    text: vóór 1 januari 2000 is behaald;
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel171
  - number: 171.2.b
    text: |-
      wordt genoemd in de eerste kolom van [bijlage I][ref1], en is afgegeven door een in de tweede kolom genoemde
      instelling, voor de eindtermen, bedoeld in de derde kolom van de tabel; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 171.2.c
    text: |-
      wordt gehouden door een persoon die in de periode van 1 januari 2000 tot 1 januari 2006 ten minste drie jaar
      relevante werkervaring heeft opgedaan.
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel171
  - number: '171.3'
    text: |-
      Indien het diploma, bedoeld in het eerste of tweede lid, een diploma betreft voor hypothecair krediet
      of levensverzekering, voldoet de houder van het diploma vanaf 1 oktober 2007 tevens op de door
      Onze Minister bij ministeriële regeling vast te stellen wijze aan de eindtermen, opgenomen in de
      [onderdelen 2.5 tot en met 2.7 onderscheidenlijk 5.6 tot en met 5.8 van bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '171.4'
    text: |-
      Onze Minister kan in aanvulling op het eerste en tweede lid bij ministeriële regeling een ander diploma aanwijzen
      als geldig diploma, bedoeld in [artikel 6, eerste lid, onderdeel a, en tweede lid, onderdeel a][ref1]. Indien
      een op grond van de vorige volzin aangewezen diploma is behaald voor 1 januari 2000 is het slechts geldig indien
      de houder van het diploma in de periode van 1 januari 2000 tot 1 januari 2006 ten minste drie jaar relevante
      werkervaring heeft opgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '171.5'
    text: |-
      De instellingen, genoemd in de tweede kolom van [bijlage I][ref1] beschikken van rechtswege over een erkenning als
      bedoeld in [artikel 9][ref2] voor het afgeven van diploma’s genoemd in de eerste kolom. Onverminderd het eerste
      en tweede lid, is een diploma als genoemd in de eerste kolom van bijlage I dat wordt afgegeven na 1 januari 2006,
      slechts geldig voor de toepassing van 6, eerste lid, onderdeel a, en tweede lid, onderdeel a, indien de in de
      tweede kolom genoemde instelling op het moment van het afgeven van het diploma over een erkenning beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel9
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0020421
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '172'
    text: |-
      [Artikel 28, tweede lid][ref1], is niet van toepassing ten aanzien van personen die zich op 1 januari 2006 reeds
      onder de verantwoordelijkheid van de financiëledienstverlener, bedoeld in het [eerste lid van dat artikel][ref2],
      rechtstreeks bezighielden met het verlenen van financiële diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel28
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel172
    references:
