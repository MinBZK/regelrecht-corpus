  - number: '174.1'
    text: |-
      De [artikelen 150][ref1] en [151][ref2] zijn uitsluitend van toepassing op overeenkomsten aangegaan na
      inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel150
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel151
    url: https://wetten.overheid.nl/BWBR0020421/2011-06-02#Artikel174
