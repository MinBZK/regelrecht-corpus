    text: |-
      De [artikelen 122, eerste lid, aanhef en onderdeel g][ref1], [123, eerste lid, aanhef en onderdeel m][ref2], en
      [124, eerste lid, aanhef en onderdeel j][ref3], zijn van toepassing met ingang van het boekjaar dat aanvangt op of
      na het tijdstip van inwerkingtreding van dit besluit.


