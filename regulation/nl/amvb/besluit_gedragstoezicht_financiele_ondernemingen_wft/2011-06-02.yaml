articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: *afsluitprovisie*: 1°. beloning of
      vergoeding, in welke vorm dan ook, die een aanbieder ter gelegenheid van de totstandkoming van een overeenkomst
      inzake een betalingsbeschermer, een complex product, een hypothecair krediet, een hypothecair krediet gecombineerd
      met een beleggingsrekening of een uitvaartverzekering, tussen hem en een consument rechtstreeks of middellijk
      voor het bemiddelen of adviseren inzake die overeenkomst betaalt; of 2°. beloning of vergoeding, in welke vorm
      dan ook, die een aanbieder van een financieel product dat onderdeel uitmaakt van een complex product als bedoeld
      in onderdeel d, onder 4°, dat is samengesteld of in de markt verkrijgbaar gesteld door een bemiddelaar, ter
      gelegenheid van de totstandkoming van een overeenkomst tussen hem en een consument inzake dat financieel product
      voor het bemiddelen of adviseren inzake die overeenkomst rechtstreeks of middellijk betaalt; *bestuurder*:
      indien het een beheerder, beleggingsmaatschappij of bewaarder betreft, een ieder die krachtens wet een beheerder,
      beleggingsmaatschappij of bewaarder vertegenwoordigt of het beleid van een beheerder, beleggingsmaatschappij
      of bewaarder bepaalt; *betalingsbeschermer:* verzekering ter dekking van het risico dat de verzekeringnemer
      betalingsverplichtingen uit hoofde van een overeenkomst inzake krediet niet kan nakomen; *betalingstermijn*:
      tijdvak dat ligt tussen: 1°. het tijdstip waarop een aanbieder ter uitvoering van een overeenkomst inzake
      krediet een geldsom ter beschikking stelt, of aanvangt met het verschaffen van het genot van een roerende
      zaak, financieel instrument of beleggingsobject of met het verlenen van een dienst en het tijdstip waarop de
      consument gehouden is de eerste betaling ter zake daarvan te hebben gedaan: of 2°. twee opeenvolgende tijdstippen
      waarop een consument gehouden is ter zake van een overeenkomst inzake krediet een betaling te hebben gedaan;
      *complex product*: 1°. combinatie van twee of meer financiële producten die ten minste een financieel product
      omvat waarvan de waarde afhankelijk is van de ontwikkelingen op financiële markten of andere markten; 2°. recht
      van deelneming in een beleggingsinstelling dat niet verhandelbaar is of dat op verzoek van de deelnemers ten
      laste van de activa direct of indirect wordt ingekocht of terugbetaald; 3°. levensverzekering, niet zijnde
      een natura-uitvaartverzekering of een andere verzekering die uitsluitend strekt tot het doen van geldelijke
      uitkeringen in verband met de verzorging van de uitvaart van een natuurlijke persoon of een verzekering
      waarbij de verplichting van de verzekeraar tot het doen van een uitkering of een reeks van uitkeringen alleen
      dan ontstaat, indien het overlijden van degene op wiens leven de verzekering betrekking heeft plaatsvindt
      voor de in de polis genoemde datum; 4°. combinatie van een hypothecair krediet met een levensverzekering als
      bedoeld onder 3°, of met een spaarrekening; 5°. beleggingsobject; 6°. spaarrekening eigen woning als bedoeld
      in [artikel 3.116a, tweede lid, van de Wet inkomstenbelasting 2001][ref1]; 7°. beleggingsrecht eigen woning als
      bedoeld in [artikel 3.116a, derde lid, van de Wet inkomstenbelasting 2001][ref2]; 8°. lijfrentespaarrekening als
      bedoeld in [artikel 3.126a, eerste lid, van de Wet inkomstenbelasting 2001][ref3]; 9°. lijfrentebeleggingsrecht
      als bedoeld in [artikel 3.126a, eerste lid, van de Wet inkomstenbelasting 2001][ref4]; 10°. ander financieel
      product dat bij ministeriële regeling kan worden aangewezen indien dit ten behoeve van de vergelijkbaarheid
      van de onder 2° tot en met 9° bedoelde complexe producten met dit financiële product in verband met de belangen
      die het [Deel Gedragstoezicht financiële ondernemingen van de wet][ref5] beoogt te beschermen wenselijk is; of
      11°. combinatie van een of meer onder 2° tot en met 10° bedoelde complexe producten met een of meer financiële
      producten; *consumptief krediet*: krediet, niet zijnde hypothecair krediet; *debetrentevoet:* verschuldigde rente
      voor een krediet, uitgedrukt op jaarbasis en toegepast in een vast of variabel percentage; *dekkingspercentage:*
      een door de aanbieder van krediet vastgesteld percentage van de waarde van de in onderpand gegeven financiële
      instrumenten, bedoeld in [artikel 1:1 van de wet][ref6], of van de daartoe behorende afzonderlijke financiële
      instrumenten aan de hand waarvan de aanbieder van krediet de kredietlimiet bepaalt; *deposito*: tegoed bij een
      bank dat onmiddellijk kan worden opgevraagd en waarvan de rentetermijn ten hoogste twaalf maanden bedraagt;
      *doorlopende provisie*: 1°. beloning of vergoeding, in welke vorm dan ook, niet zijnde afsluitprovisie, die een
      aanbieder van een betalingsbeschermer, een complex product, een hypothecair krediet, een hypothecair krediet
      gecombineerd met een beleggingsrekening of een uitvaartverzekering, na de totstandkoming van een overeenkomst
      tussen hem en een consument voor het bemiddelen of adviseren inzake die overeenkomst rechtstreeks of middellijk
      betaalt; of 2°. beloning of vergoeding, in welke vorm dan ook, niet zijnde afsluitprovisie, die door een
      aanbieder van een financieel product dat onderdeel uitmaakt van een complex product als bedoeld in onderdeel
      d, onder 4°, dat is samengesteld of in de markt verkrijgbaar gesteld door een bemiddelaar, na de totstandkoming
      van een overeenkomst inzake dat financieel product tussen hem en een consument voor het bemiddelen of adviseren
      inzake die overeenkomst rechtstreeks of middellijk betaalt; *doorlopend krediet*: overeenkomst inzake: 1°.
      geldkrediet waarbij de consument op verschillende tijdstippen geldsommen kan opnemen, voorzover het uitstaande
      saldo de kredietlimiet niet overschrijdt; of 2°. goederenkrediet waarbij de aanbieder of een derde gehouden
      is aan een consument op verschillende tijdstippen het genot van een roerende zaak, financieel instrument of
      beleggingsobject te verschaffen of een dienst te verlenen, voorzover het uitstaande saldo de kredietlimiet
      niet overschrijdt; *effectenkrediet:* het aan een consument ter beschikking stellen van een doorlopend
      krediet tegen onderpand van financiële instrumenten als bedoeld in [artikel 1:1 van de wet][ref7], waarmee de
      consument transacties kan verrichten in financiële instrumenten en de aanbieder van krediet betrokken is bij
      die transacties; *eindtermen*: normen met betrekking tot de vakbekwaamheid voor het verlenen van een bepaalde
      financiële dienst met betrekking tot een bepaald financieel product; *financieel analist*: een relevante
      persoon die tastbaar onderzoek op beleggingsgebied verricht; *financieel derivaat*: financieel instrument
      als bedoeld in [artikel 4:60, eerste lid, onderdeel d, e, f of g, van de wet][ref8]; *financiële bijsluiter*:
      document waarin informatie over de in [artikel 66, eerste of tweede lid][ref9], genoemde onderwerpen met
      betrekking tot een complex product is weergegeven op de ingevolge [dat artikel][ref10] voorgeschreven wijze;
      *geldmarktinstrument*: financieel instrument als bedoeld in onderdeel c van de definitie van financieel instrument
      in [artikel 1:1 van de wet][ref11]; *gelieerde partij*: 1°. persoon die met een beheerder, beleggingsmaatschappij
      of bewaarder of met een bestuurder van een beheerder, beleggingsmaatschappij of bewaarder in een formele of
      feitelijke zeggenschapsstructuur is verbonden; 2°. persoon die direct of indirect stemrecht kan uitoefenen of
      anderszins bepaalde rechten kan uitoefenen waardoor invloed van betekenis kan worden uitgeoefend op het zakelijk
      of financieel beleid van een beheerder, beleggingsmaatschappij of bewaarder; 3°. natuurlijke persoon die in een
      familierechtelijke betrekking staat tot een bestuurder van een beheerder, beleggingsmaatschappij of bewaarder
      of tot een natuurlijke persoon als bedoeld onder 1° of 2°; 4°. natuurlijke persoon die een persoonlijke relatie
      heeft met een bestuurder van een beheerder, beleggingsmaatschappij of bewaarder of met een natuurlijke persoon
      als bedoeld onder 1° of 2°, in welke relatie hij het handelen van de bestuurder of de natuurlijke persoon met
      betrekking tot de beheerder, beleggingsmaatschappij of bewaarder kan beïnvloeden; 5°. rechtspersoon waarin een
      bestuurder van een beheerder, beleggingsmaatschappij of bewaarder of een natuurlijke persoon als bedoeld onder
      3° of 4°, direct of indirect stemrecht kan uitoefenen of anderszins bepaalde rechten kan uitoefenen waardoor
      sprake is van invloed van betekenis op het zakelijk of financieel beleid van die rechtspersoon; of 6°. natuurlijke
      persoon die onderdeel is van een orgaan dat belast is met toezicht op het beleid en de algemene gang van zaken van
      een beheerder, beleggingsmaatschappij of bewaarder; *gelieerd financieel instrument:* een financieel instrument
      waarvan de prijs sterk wordt beïnvloed door prijsschommelingen van een ander financieel instrument dat het
      onderwerp van onderzoek op beleggingsgebied is of van een van dit andere financiële instrument afgeleid financieel
      instrument; *hypothecair krediet*: overeenkomst inzake krediet met een consument, bij het aangaan waarvan een
      recht van hypotheek wordt gevestigd, strekkende tot verhaal bij voorrang van de vordering tot voldoening van de
      door de consument verschuldigde betaling, dan wel met betrekking waartoe reeds een zodanig recht is gevestigd
      en waarbij het krediet wordt verleend tegen een voor hypothecaire financieringen van de aanbieder gebruikelijk
      jaarlijks kostenpercentage; *incident*: gedraging of gebeurtenis die een ernstig gevaar vormt voor de integere
      uitoefening van het bedrijf van een financiële onderneming; *integriteitgevoelige functie*: 1°. leidinggevende
      functie direct onder de personen die het beleid van de financiële onderneming bepalen of mede bepalen; of 2°.
      functie waaraan een bevoegdheid is verbonden die een wezenlijk risico bevat voor de integere uitoefening van
      het bedrijf van een financiële onderneming; *integriteitrisico*: gevaar voor de aantasting van de reputatie of
      bestaande of toekomstige bedreiging van vermogen of resultaat van een financiële onderneming als gevolg van een
      ontoereikende naleving van hetgeen bij of krachtens enig wettelijk voorschrift is voorgeschreven; *internationale
      jaarrekeningstandaarden*: internationale standaarden voor jaarrekeningen die door de Commissie van de Europese
      Gemeenschappen van toepassing zijn verklaard overeenkomstig artikel 3 van [Verordening (EG) nr. 1606/2002]
      (32002R1606) van het Europees Parlement en de Raad van de Europese Unie van 19 juli 2002 (PbEG L 243); *jaarlijks
      kostenpercentage:* totale kosten van een consumptief krediet voor de consument, uitgedrukt in een percentage op
      jaarbasis van het totale kredietbedrag, berekend volgens de basisvergelijking en aanvullende hypothesen, opgenomen
      in [bijlage A][ref12], of de bij de uitvoering van een overeenkomst inzake hypothecair krediet overeenkomstig
      de betalingsregeling aan de consument in rekening te brengen effectieve kredietvergoeding, uitgedrukt in een
      percentage op jaarbasis van het uitstaand saldo, berekend op bij ministeriële regeling vast te stellen wijze;
      *kosten*: bedragen die een financiële onderneming in rekening brengt of ten laste laat komen van een cliënt,
      consument of deelnemer; *kredietlimiet*: 1°. maximum bedrag van door een consument bij de aanbieder van krediet
      op te nemen geldsommen ter uitvoering van een overeenkomst inzake doorlopend geldkrediet; of 2°. maximumwaarde
      van door een aanbieder van krediet aan de consument te verschaffen genot van een zaak, financieel instrument of
      beleggingsobject, of te verlenen dienst ter uitvoering van een overeenkomst inzake doorlopend goederenkrediet;
      *kredietsom*: 1°. geldsom die de consument in het kader van een overeenkomst inzake geldkrediet ter beschikking
      wordt gesteld, met dien verstande dat indien het doorlopend krediet betreft de kredietlimiet als die geldsom
      wordt aangemerkt; of 2°. verschil tussen het totaal van de contante waarde van de roerende zaken, financiële
      instrumenten, beleggingsobjecten of diensten, waarvan de consument het genot wordt verschaft, onderscheidenlijk
      welke aan de consument worden verleend, in het kader van een overeenkomst inzake goederenkrediet, en de door
      deze in dat kader gedane contante betalingen, met dien verstande dat indien het doorlopend krediet betreft de
      kredietlimiet als dat verschil wordt aangemerkt; *kredietvergoeding*: kosten ter zake van een overeenkomst inzake
      krediet; *maandlast*: bedrag dat een consument verschuldigd is aan betalingen ter zake van krediet, berekend voor
      één kalendermaand, waaronder in ieder geval betalingen aan rente en aflossing in verband met het krediet; *nauwe
      banden*: situatie waarin twee of meer natuurlijke of rechtspersonen verbonden zijn door: 1°. een deelneming, dat
      wil zeggen het rechtstreeks of door middel van een zeggenschapsband houden van ten minste 20% van de stemrechten
      of het kapitaal van een rechtspersoon; 2°. een zeggenschapsband, dat wil zeggen de band die bestaat tussen
      een moederonderneming en een dochteronderneming, in alle gevallen zoals bedoeld in artikel 1, eerste en tweede
      lid, van de richtlijn geconsolideerde jaarrekening, of een band van dezelfde aard tussen een natuurlijke of
      rechtspersoon en een andere rechtspersoon; een dochteronderneming van een dochteronderneming wordt ook beschouwd
      als een dochteronderneming van de moederonderneming die aan het hoofd van deze ondernemingen staat; *onderzoek
      op beleggingsgebied:* onderzoek of andere voor het publiek bestemde informatie waarbij expliciet of impliciet
      een beleggingsstrategie wordt aanbevolen of voorgesteld ten aanzien van één of meerdere financiële instrumenten
      of uitgevende instellingen van financiële instrumenten, daaronder begrepen aanbevelingen betreffende de huidige
      of toekomstige waarde of koers van dergelijke instrumenten, welk onderzoek: a. als onderzoek op beleggingsgebied
      wordt gepresenteerd of op enigerlei andere wijze wordt voorgesteld als een objectieve of onafhankelijke verklaring
      van de aangelegenheden die in de aanbeveling aan de orde komen; en b. indien het tot een cliënt zou zijn gericht,
      geen adviseren is; *op- en afslagen*: bedragen waarmee de door de deelnemers voor rechten van deelneming in een
      beleggingsinstelling betaalde of ontvangen prijs of terugbetaling worden verhoogd onderscheidenlijk verlaagd ten
      opzichte van de intrinsieke waarde van de rechten van deelneming; *PE-onderwijsprogramma:* onderwijsprogramma
      voor permanente educatie; *PE-toets:* toets voor permanente educatie; *PE-toetstermen:* criteria waaraan de
      vakbekwaamheid van een persoon wordt getoetst om te kunnen vaststellen of deze voldoet aan de eisen voor permanente
      educatie; *persoonlijke transactie*: een transactie in een financieel instrument door of in naam van een relevante
      persoon, waarbij: 1°. de betrokken relevante persoon handelt anders dan in de normale uitoefening van zijn beroep
      of bedrijf; 2°. de transactie wordt verricht voor rekening van de relevante persoon; 3°. de transactie wordt
      verricht voor rekening van een persoon met wie de relevante persoon familiebanden of nauwe banden heeft; of 4°. de
      transactie wordt verricht voor rekening van een persoon wiens relatie met de relevante persoon van dien aard is dat
      de relevante persoon een direct of indirect wezenlijk belang heeft bij het resultaat van de transactie afgezien van
      een provisie voor de uitvoering van de transactie; *relevante persoon:* 1°. een persoon die het dagelijks beleid
      bepaalt of een verbonden agent is van een beleggingsonderneming; 2°. een ieder die het dagelijks beleid bepaalt
      van een verbonden agent van een beleggingsonderneming; 3°. een werknemer van de beleggingsonderneming of van een
      verbonden agent van de beleggingsonderneming of een andere natuurlijke persoon wiens diensten ter beschikking en
      onder zeggenschap staan van een beleggingsonderneming onderscheidenlijk de verbonden agent en die betrokken is bij
      het verrichten van beleggingsactiviteiten of het verlenen van beleggingsdiensten door de beleggingsonderneming;
      of 4°. een natuurlijke persoon die uit hoofde van een overeenkomst tot uitbesteding met het oog op het verlenen
      of verrichten door de beleggingsonderneming van beleggingsdiensten of beleggingsactiviteiten rechtstreeks
      betrokken is bij het verrichten van diensten ten behoeve van de beleggingsonderneming of haar verbonden agent;
      *retourprovisie*: gedeelte van een door of ten laste van een beleggingsinstelling voor een dienst van een derde
      te betalen of betaalde vergoeding dat direct of indirect door de ontvanger wordt terugbetaald of doorbetaald;
      *richtlijn consumentenkrediet:* richtlijn nr. 2008/48/EG van het Europese Parlement en de Raad van de Europese
      Unie van 23 april 2008 inzake kredietovereenkomsten voor consumenten en tot intrekking van Richtlijn 87/102/EEG
      van de Raad (PbEU L133); *risico-indicator*: weergave van het risiconiveau van een complex product; *serie van
      beleggingsobjecten*: verzameling van beleggingsobjecten waarvoor hetzelfde beleggingsobjectprospectus, bedoeld
      in [artikel 4:30a, van de wet][ref13] wordt opgesteld; *termijnbedrag*: bedrag van de betaling die een consument
      aan het einde van een betalingstermijn moet hebben gedaan; *toetstermen*: criteria waaraan de vakbekwaamheid van
      een persoon wordt getoetst om te kunnen vaststellen of deze voldoet aan de eindtermen; *totale door de consument
      te betalen bedrag:* som van het totale kredietbedrag en de totale kosten van het krediet voor de consument;
      *totale kosten van het krediet voor de consument:* alle kosten inzake een consumptief krediet, met uitzondering
      van notariskosten, die de consument in verband met een krediet moet betalen en die de aanbieder bekend zijn, met
      inbegrip van rente, provisie, belastingen, vergoedingen van welke aard ook en kosten in verband met nevendiensten
      met betrekking tot het krediet, indien het sluiten van een overeenkomst met betrekking tot die diensten verplicht
      is om het krediet op de geadverteerde voorwaarden te verkrijgen, of de som van de door een consument te betalen
      termijnbedragen gedurende de looptijd van een overeenkomst inzake hypothecair krediet; *totale kredietbedrag:* de
      kredietlimiet of de kredietsom; *uitstaand saldo*: 1°. indien het geldkrediet betreft: op enig tijdstip bestaand
      totaal van de tot en met dat tijdstip door de consument opgenomen geldsommen, vermeerderd met de tot en met dat
      tijdstip aan de consument in rekening gebrachte kredietvergoeding en verminderd met de tot en met dat tijdstip
      door de consument gedane betalingen; 2°. indien het goederenkrediet betreft: op enig tijdstip bestaand totaal
      van de contante waarde van de roerende zaken, financiële instrumenten, beleggingsobjecten of diensten waarvan tot
      en met dat tijdstip aan de consument het genot is verschaft, of welke tot en met dat tijdstip aan de consument
      zijn verleend, vermeerderd met het totaalbedrag van de tot en met dat tijdstip aan de consument in rekening
      gebrachte kredietvergoeding en verminderd met de tot en met dat tijdstip door de consument gedane betalingen;
      *uitvaartverzekering:* levensverzekering die uitsluitend strekt tot het doen van geldelijke uitkeringen in
      verband met de verzorging van de uitvaart van een natuurlijke persoon of een natura-uitvaartverzekering; *wet*:
      [Wet op het financieel toezicht][ref14].


