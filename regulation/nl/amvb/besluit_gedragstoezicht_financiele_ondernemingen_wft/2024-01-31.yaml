  - number: '120.1'
    text: |-
      Een beheerder van een icbe stelt de jaarrekening, het bestuursverslag en de overige gegevens, bedoeld in
      [artikel 4:52, eerste lid, van de wet][ref1] en de halfjaarcijfers, bedoeld in artikel 4:52, tweede lid, kosteloos
      verkrijgbaar voor deelnemers in de icbe.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '120.2'
    text: |-
      De openbaarmaking van de jaarrekening, het bestuursverslag en de overige gegevens, bedoeld in
      [artikel 4:52, eerste lid, van de wet][ref1], geschiedt door publicatie op de website van de beheerder van de icbe.
      Gelijktijdig met de publicatie op de website deelt de beheerder in een landelijk verspreid Nederlands dagblad dan
      wel aan het adres van iedere deelnemer, mee dat voor deelnemers op verzoek bij de beheerder een afschrift van de
      jaarrekening, het bestuursverslag en de overige gegevens van de beheerder, de icbe of de bewaarder van een icbe
      voor de deelnemers in de icbe kosteloos verkrijgbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '120.3'
    text: |-
      De openbaarmaking van de halfjaarcijfers, bedoeld in [artikel 4:52, tweede lid, van de wet][ref1] geschiedt
      overeenkomstig het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '120.4'
    text: |-
      De beheerder van een icbe houdt de informatie, bedoeld in het tweede en derde lid, gedurende ten minste drie jaar
      beschikbaar op zijn website.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel120
  - number: '121.1'
    text: |-
      Het bestuursverslag van een icbe, bedoeld in [artikel 4:51, eerste lid, van de wet][ref1], bevat een verklaring
      van de beheerder van een icbe dat hij voor de icbe beschikt over een beschrijving van de inrichting van de
      bedrijfsvoering die voldoet aan het bepaalde ingevolge de [artikelen 3:17, tweede lid, onderdeel c][ref2],
      en [4:14, eerste lid, van de wet][ref3], en dat de bedrijfsvoering van de icbe effectief en overeenkomstig de
      beschrijving functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '121.2'
    text: |-
      Het bestuursverslag van een icbe bevat ten minste de gegevens omtrent beloningen, bedoeld in artikel 69, derde lid,
      van de richtlijn instellingen voor collectieve belegging in effecten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel121
  - number: '122.1'
    text: 'De toelichting op de balans en de winst- en verliesrekening van een icbe bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel122
  - number: 122.1.a
    text: |-
      een sluitend overzicht van het verloop gedurende het boekjaar van de beleggingen waarbij de beleggingen worden
      onderscheiden naar soort;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel122
  - number: 122.1.b
    text: een overzicht van de samenstelling van de activa aan het einde van het boekjaar;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel122
  - number: 122.1.c
    text: |-
      een vergelijkend overzicht over de laatste drie jaren van de intrinsieke waarde van de icbe, het aantal uitstaande
      rechten van deelneming en de intrinsieke waarde per recht van deelneming, een en ander per het einde van het
      boekjaar;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel122
  - number: 122.1.d
    text: |-
      een mededeling in hoeverre activa die geen financiële instrumenten zijn die zijn toegelaten tot de handel op een
      gereglementeerde markt of een andere markt in financiële instrumenten door een onafhankelijke deskundige zijn
      gewaardeerd, volgens welke methode de waardering heeft plaatsgevonden, alsmede de regelmaat waarmee deze waardering
      plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel122
  - number: 122.1.e
    text: |-
      het bedrag der verplichtingen, onderscheiden naar soort aan het einde van het boekjaar, die voortvloeien uit
      dekkingstransacties met betrekking tot koers- en wisselkoersrisico in verband met de beleggingen, voorzover een en
      ander niet reeds in de balans en winst- en verliesrekening is begrepen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel122
  - number: 122.1.f
    text: |-
      een gespecificeerde opgave van de activa van de icbe die deelnemingen zijn in de zin van
      [artikel 389, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel389
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '389'
  - number: 122.1.g
    text: |-
      indien de icbe 85 procent of meer van het beheerde vermogen direct of indirect belegt in een andere
      beleggingsinstelling of icbe: de gegevens, bedoeld in de onderdelen a, b, c, d en e, met betrekking tot de andere
      beleggingsinstelling of icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel122
  - number: '122.2'
    text: |-
      Onverminderd [artikel 379, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] vermeldt de beheerder van een
      icbe onder de overige gegevens, bedoeld in [artikel 4:51, eerste lid, van de wet][ref2], het totale persoonlijke
      belang dat de bestuurders van de beheerder van een icbe of de maatschappij voor collectieve belegging in effecten
      bij iedere belegging van de icbe aan het begin en het einde van het boekjaar hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel379
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '379'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '123.1'
    text: 'De toelichting op de balans en de winst- en verliesrekening van een icbe bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.a
    text: |-
      voorzover van toepassing: de kosten van oprichting van de icbe, de wijze waarop deze kosten ten laste zijn gekomen
      van het resultaat, in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn gekomen van
      de deelnemers in de icbe en welk gedeelte ten goede is gekomen aan de beheerder van een icbe, de bewaarder van
      een icbe, de bestuurders van de beheerder van een icbe, maatschappij voor collectieve belegging in effecten of
      bewaarder van een icbe, of aan met de beheerder van een icbe, maatschappij voor collectieve belegging in effecten
      of bewaarder van een icbe gelieerde partijen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.b
    text: |-
      de naar soort onderscheiden kosten, gemoeid met het beheer van de icbe, de bewaring van activa van de icbe, de
      accountant, het toezicht op de icbe en de marketing, met inbegrip van de berekeningsgrondslag en de wijze waarop
      deze kosten ten laste zijn gekomen van het resultaat, in mindering zijn gebracht op het beheerde vermogen of
      anderszins ten laste zijn gekomen van de deelnemers in de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.c
    text: |-
      de transactiekosten die geïdentificeerd en gekwantificeerd kunnen worden en de wijze waarop deze kosten ten laste
      zijn gekomen van het resultaat, in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn
      gekomen van de deelnemers in de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.d
    text: |-
      indien van toepassing: de kosten die zijn gemaakt of vergoedingen die zijn gevraagd in verband met het in- en
      uitlenen van financiële instrumenten en de wijze waarop deze kosten ten laste zijn gekomen van het resultaat, in
      mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn gekomen van de deelnemers in de icbe
      onderscheidenlijk aan wie deze vergoedingen ten goede zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.e
    text: |-
      indien van toepassing: de kosten voor het uitbesteden van werkzaamheden in het kader van het beheer van de icbe of
      de bewaring van de activa van de icbe en de wijze waarop deze kosten ten laste zijn gekomen van het resultaat, in
      mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn gekomen van de deelnemers in de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.f
    text: |-
      het totaal betaalde bedrag aan vergoedingen voor het aanbrengen van deelnemers indien dit bedrag hoger is dan één
      tiende procent van het gemiddelde beheerde vermogen van de icbe, de wijze waarop dit bedrag ten laste is gekomen
      van het resultaat, in mindering is gebracht op het beheerde vermogen of anderszins ten laste is gekomen van de
      deelnemers in de icbe en, indien van toepassing, de namen van met de maatschappij voor collectieve belegging in
      effecten, de beheerder van een icbe of de bewaarder van een icbe gelieerde partijen aan wie deze aanbrengprovisies
      ten goede zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.g
    text: |-
      alle andere dan in onderdeel a tot en met f bedoelde naar soort onderscheiden kosten die hoger zijn dan tien
      procent van de totale kosten, inclusief de berekeningsgrondslag, en de wijze waarop deze kosten ten laste zijn
      gekomen van het resultaat, in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn gekomen
      van de deelnemers in de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.h
    text: |-
      de wijze waarop de op- en afslagen zijn berekend, aan wie de op- en afslagen ten goede zijn gekomen en, voor zover
      van toepassing, de wijze waarop zij zijn verwerkt in de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.i
    text: |-
      de overige eenmalige kosten die deelnemers in de icbe betalen bij in- en uittreding, inclusief de
      berekeningsgrondslag;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.j
    text: |-
      een vergelijkend overzicht van de naar soort onderscheiden volgens het prospectus, bedoeld in
      [artikel 4:49, eerste lid, van de wet][ref1], te maken kosten en de daadwerkelijk gemaakte kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 123.1.k
    text: |-
      de naar soort onderscheiden kosten die voortvloeien uit directe of indirecte beleggingen in andere
      beleggingsinstellingen of icbe’s of icbe’s;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.l
    text: |-
      het niveau van de kosten van de icbe gerelateerd aan haar gemiddelde intrinsieke waarde, onder vermelding van
      de kosten die daarbij buiten beschouwing zijn gelaten; indien de icbe gemiddeld tien procent of meer van haar
      vermogen direct of indirect in andere belegginginstellingen of icbe’s of icbe’s belegt, worden de kosten van de
      andere beleggingsinstellingen of icbe’s of icbe’s meegenomen bij het bepalen van het niveau van de kosten van de
      icbe of wordt vermeld dat en waarom het niet mogelijk is de kosten van een andere beleggingsinstelling of icbe
      mee te nemen, alsmede dat de kosten van de betreffende andere beleggingsinstelling of icbe van invloed zijn op het
      resultaat van de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.m
    text: |-
      indien de icbe 85 procent of meer van het beheerde vermogen direct of indirect belegt in een andere
      beleggingsinstelling of icbe: het niveau van de kosten van de andere beleggingsinstelling of icbe gerelateerd
      aan de gemiddelde intrinsieke waarde van de andere beleggingstelling of icbe, onder vermelding van de kosten die
      daarbij buiten beschouwing zijn gelaten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.n
    text: |-
      indien van toepassing: de retourprovisies die niet ten goede zijn gekomen aan de icbe en aan wie deze
      retourprovisies ten goede zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.o
    text: |-
      indien van toepassing: de door de beheerder van een icbe, de bestuurders van de beleggingsmaatschappij, de
      beheerder van een icbe of de bewaarden van de icbe, de bewaarder van de icbe, de met de beheerder van de icbe,
      maatschappij voor collectieve belegging in effecten of bewaarder van de icbe gelieerde partijen of derden voor het
      uitvoeren van opdrachten ten behoeve van icbe ontvangen of in het vooruitzicht gestelde goederen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.1.p
    text: |-
      de omloopsnelheid van de beleggingen en een vergelijking met de in het voorgaande boekjaar gerealiseerde
      omloopsnelheid van de beleggingen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: '123.2'
    text: |-
      Het eerste lid, onderdeel p, is niet van toepassing op icbe’s die uitsluitend of vrijwel uitsluitend beleggen in
      onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: '123.3'
    text: |-
      De Autoriteit Financiële Markten stelt regels met betrekking tot de wijze waarop inzicht wordt verschaft in
      het niveau van de kosten van de icbe, bedoeld in het eerste lid, onderdelen l en m, en de daaraan ten grondslag
      liggende berekening en de wijze van berekening van de omloopsnelheid van de activa, bedoeld in het eerste lid,
      onderdeel p.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: '123.4'
    text: 'De toelichting op de balans en de winst en verliesrekening van een beheerder bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.4.a
    text: 'indien van toepassing: de door de beheerder van een icbe of diens bestuurders ontvangen retourprovisies;'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.4.b
    text: |-
      indien van toepassing: de door de beheerder van een icbe of diens bestuurders voor het uitvoeren van opdrachten
      ten behoeve van de beheerder van een icbe of de door de beheerder van een icbe beheerde beleggingsinstellingen of
      icbe’s ontvangen of in het vooruitzicht gestelde goederen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: 123.4.c
    text: |-
      de vergoedingen die zijn ontvangen in verband met het in- en uitlenen van financiële instrumenten van de door de
      beheerder van een icbe beheerde beleggingsinstellingen of icbe’s.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: '123.5'
    text: De in het eerste en vierde lid bedoelde gegevens worden cijfermatig en tekstueel toegelicht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: '123.6'
    text: |-
      In de toelichting op de balans en de winst- en verliesrekening van de beheerder van een icbe en de icbe worden de
      in het vierde onderscheidenlijk het eerste lid bedoelde gegevens in één paragraaf opgenomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel123
  - number: '124.1'
    text: 'Een icbe vermeldt in de toelichting op de balans en de winst en verliesrekening:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.a
    text: |-
      indien van toepassing: de met de met de maatschappij voor collectieve belegging in effecten, de beheerder van
      een icbe of de bewaarder van een icbe gelieerde partijen aangegane overeenkomsten en een beschrijving van de
      hoofdlijnen van die overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.b
    text: |-
      welk percentage van het totale transactievolume van de beleggingsinstelling is uitgevoerd via de met de
      maatschappij voor collectieve belegging in effecten, de beheerder van een icbe of de bewaarder van een icbe
      gelieerde partijen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.c
    text: |-
      indien van toepassing: een opsomming van de soorten transacties die via de met de maatschappij voor collectieve
      belegging in effecten, de beheerder van een icbe of de bewaarder van een icbe gelieerde partijen zijn uitgevoerd
      en de voorwaarden waaronder die transacties plaatsvinden. Indien een transactie met een gelieerde partij niet tegen
      marktconforme voorwaarden heeft plaatsgevonden wordt tevens de naam van de gelieerde partij, de prijs, de relevante
      voorwaarden, de getaxeerde waarde en de reden voor niet marktconform handelen vermeld;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.d
    text: |-
      indien van toepassing: het totaalbedrag gemoeid met transacties met de met de maatschappij voor collectieve
      belegging in effecten, de beheerder van een icbe of de bewaarder van een icbe gelieerde partijen die niet op een
      gereglementeerde markt of een andere markt in financiële instrumenten worden verricht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.e
    text: |-
      indien van toepassing: dat de icbe direct of indirect belegt in een andere maatschappij voor collectieve belegging
      in effecten of beleggingsmaatschappij die een met de beheerder van de icbe, maatschappij voor collectieve belegging
      in effecten, of bewaarder van de icbe gelieerde partij is of in een andere icbe of beleggingsinstelling die beheerd
      wordt door een met de beheerder van de icbe, maatschappij voor collectieve belegging in effecten, of bewaarder van
      de icbe gelieerde partij en onder welke voorwaarden verkoop of inkoop van, alsmede terugbetaling op de rechten van
      deelneming in de andere icbe of beleggingsinstelling plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.f
    text: |-
      indien van toepassing: beleggingen in met de maatschappij voor collectieve belegging in effecten, beheerder van
      een icbe of bewaarder van een icbe gelieerde partijen, niet zijnde beleggingsinstellingen of icbe’s, die meer
      dan tien procent van het vermogen van de gelieerde partij of van het beheerde vermogen van de icbe uitmaken, met
      een uiteenzetting van de relatie met de gelieerde partijen en het land van vestiging van de betreffende gelieerde
      partijen indien dit niet Nederland is;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.g
    text: |-
      indien de beheerder van een icbe of bewaarder van een icbe in het kader van het beheer van de icbe
      onderscheidenlijk de bewaring van de activa van de icbe werkzaamheden heeft uitbesteed: de naam van degene aan wie
      werkzaamheden zijn uitbesteed en een beschrijving van de werkzaamheden die zijn uitbesteed;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.h
    text: 'indien financiële instrumenten worden in- of uitgeleend:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.h.1°
    text: |-
      de waarde van de in- en uitgeleende financiële instrumenten; deze informatie dient in de toelichting op de balans
      onder de balanspost financiële instrumenten te worden vermeld; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.h.2°
    text: de zekerheden die de icbe heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.i
    text: |-
      indien de icbe gemiddeld twintig procent of meer van het beheerde vermogen direct of indirect belegt in een andere
      beleggingsinstelling of icbe:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.i.1°
    text: |-
      waar de meest recente jaarrekening en het meest recente bestuursverslag van de andere beleggingsinstelling of icbe
      verkrijgbaar zijn;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.i.2°
    text: of en, zo ja, waar de andere beleggingsinstelling of icbe onder toezicht staat;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.i.3°
    text: |-
      het relatieve belang van de icbe in de andere beleggingsinstelling of icbe aan het begin en het einde van het
      boekjaar van de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.i.4°
    text: |-
      de intrinsieke waarde van de rechten van deelneming in de andere beleggingsinstelling of icbe aan het einde van het
      meest recente boekjaar van die andere beleggingsinstelling of icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.i.5°
    text: |-
      de samenstelling van de beleggingsportefeuille van de andere beleggingsinstelling of icbe aan het begin en het
      einde van het meest recente boekjaar van die andere beleggingsinstelling of icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.i.6°
    text: |-
      een beschrijving van het beleggingsresultaat van de andere beleggingsinstelling of icbe aan de hand van de meest
      recente jaarrekening van die andere beleggingsinstelling of icbe; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.i.7°
    text: |-
      indien van toepassing: de afspraken tussen de icbe en de andere beleggingsinstelling of icbe over de verdeling van
      kosten en aan wie het voordeel ten goede komt; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: 124.1.j
    text: |-
      indien de icbe 85 procent of meer van het beheerde vermogen direct of indirect belegt in een andere
      beleggingsinstelling of icbe: het beleggingsbeleid van de andere beleggingsinstelling of icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: '124.2'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de wijze waarop de informatie, bedoeld in
      het eerste lid, wordt opgenomen in de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel124
  - number: '125.1'
    text: 'De halfjaarcijfers van een icbe bevatten ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel125
  - number: 125.1.a
    text: |-
      de balans en winst- en verliesrekening, alsmede een mutatieoverzicht van het eigen vermogen van de maatschappij
      voor collectieve belegging in effecten of van het beheerde vermogen van het fonds voor collectieve belegging
      in effecten met inachtneming, voorzover de aard van deze stukken dat toelaat, van de bepalingen van
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] of de internationale jaarrekeningstandaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 125.1.b
    text: een overzicht van de samenstelling van de activa van de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel125
  - number: 125.1.c
    text: |-
      een opgave van de intrinsieke waarde van de icbe en het aantal uitstaande rechten van deelneming en de intrinsieke
      waarde per recht van deelneming;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel125
  - number: 125.1.d
    text: |-
      indien van toepassing: de vermelding, bedoeld in [artikel 122, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel122
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '122'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 125.1.e
    text: 'indien van toepassing: een mededeling dat de icbe interimdividend heeft uitgekeerd of voornemens is dat te doen.'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel125
  - number: '125.2'
    text: |-
      De halfjaarcijfers van een beheerder van een icbe bevatten ten minste de balans en winst- en verliesrekening,
      alsmede een mutatieoverzicht van het eigen vermogen met inachtneming, voorzover de aard van deze stukken dat
      toelaat, van de bepalingen van [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1], met uitzondering van
      [artikel 403][ref2], of de internationale jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel403
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '403'
  - number: '125.3'
    text: |-
      Indien de halfjaarcijfers van de beheerder van een icbe of de icbe door een accountant zijn onderzocht, wordt diens
      verklaring gevoegd bij de stukken die ingevolge [artikel 4:51, tweede lid, van de wet][ref1] aan de Autoriteit
      Financiële Markten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 126a.1
    text: |-
      Het beleid ter zake van het voorkomen van belangenconflicten, bedoeld in
      [artikel 4:59a, eerste lid, van de wet][ref1], is gericht op het herkennen van in ieder geval de volgende situaties
      waarbij een beheerder van een icbe, een relevante persoon of een persoon die met de beheerder is verbonden door
      een zeggenschapsband:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 126a.1.a
    text: financieel gewin kan behalen of een financieel verlies kan vermijden ten koste van de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126a
  - number: 126a.1.b
    text: |-
      een belang heeft bij het resultaat van een ten behoeve van de icbe of een cliënt verrichte dienst of activiteit of
      een namens de icbe of cliënt uitgevoerde transactie, dat verschilt van het belang van de icbe bij dit resultaat;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126a
  - number: 126a.1.c
    text: |-
      een financiële of andere drijfveer heeft om het belang van een andere cliënt of groep cliënten te laten voorgaan
      boven het belang van de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126a
  - number: 126a.1.d
    text: dezelfde werkzaamheden uitoefent voor de icbe en voor een cliënt die geen icbe is; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126a
  - number: 126a.1.e
    text: |-
      van een andere persoon dan de cliënt ten behoeve van de cliënt verrichte werkzaamheden in verband met het beheer
      van icbe's een provisie ontvangt die verschilt van de gebruikelijke provisie voor deze dienst, of een dergelijke
      provisie zal ontvangen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126a
  - number: 126a.2
    text: 'De beheerder houdt bij het bepalen van de soorten van belangenconflicten rekening met:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126a
  - number: 126a.2.a
    text: |-
      zijn eigen belang, inclusief de belangen die voortvloeien uit het feit dat hij deel uitmaakt van een groep of uit
      het verrichten van diensten en activiteiten, de belangen van cliënten en de verplichtingen van de beheerder ten
      opzichte van de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126a
  - number: 126a.2.b
    text: de belangen van door hem beheerde icbe's.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126a
  - number: 126a.3
    text: |-
      Bij het bepalen van de soorten belangenconflicten die de belangen van de door hem beheerde icbe’s kunnen schaden,
      neemt de beheerder ook de belangenconflicten in acht die kunnen ontstaan als gevolg van de integratie van
      duurzaamheidsrisico’s in zijn processen, systemen en interne controle.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126a
  - number: 126b.1
    text: |-
      Een beheerder van een icbe legt het beleid, bedoeld in [artikel 4:59a, eerste lid, van de wet][ref1] vast en draagt
      er zorg voor dit beleid te implementeren en in stand te houden. Het beleid is afgestemd op de aard, omvang en
      complexiteit van zijn bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 126b.2
    text: |-
      Indien de beheerder deel uitmaakt van een groep, heeft het beleid ook betrekking op belangenconflicten die kunnen
      ontstaan als gevolg van de structuur en bedrijfsactiviteiten van andere ondernemingen die deel uitmaken van de
      groep.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126b
  - number: 126b.3
    text: |-
      Het beleid omschrijft, onder verwijzing naar de werkzaamheden in verband met het beheer van icbe’s die door of in
      naam van de beheerder worden verricht, de omstandigheden die een belangenconflict vormen of kunnen doen ontstaan
      dat een wezenlijk risico met zich brengt dat de belangen van de icbe of van een of meer cliënten worden geschaad,
      alsmede de te volgen procedures en te nemen maatregelen voor het omgaan met een dergelijk conflict.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126b
  - number: 126b.4
    text: |-
      Het beleid vermeldt de te volgen procedures en te nemen maatregelen voor het beheersen van een belangenconflict als
      bedoeld in [artikel 4:59a, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 126c.1
    text: |-
      Een beheerder van een icbe beschikt over een adequate en effectieve strategie en daarbij behorend beleid waaruit
      blijkt wanneer en op welke wijze de stemrechten die zijn verbonden aan financiële instrumenten waarin de icbe
      belegt, zullen worden uitgeoefend in het uitsluitende voordeel van de betrokken icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126c
  - number: 126c.2
    text: 'De strategie omvat maatregelen en procedures voor:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126c
  - number: 126c.2.a
    text: het monitoren van relevante gebeurtenissen binnen de onderneming;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126c
  - number: 126c.2.b
    text: |-
      het garanderen dat de uitoefening van stemrechten in overeenstemming met de beleggingsdoelstellingen en het
      beleggingsbeleid van de betrokken icbe plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126c
  - number: 126c.2.c
    text: het voorkomen of beheersen van eventuele belangenconflicten die uit de uitoefening van stemrechten voortvloeien.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126c
  - number: 126c.3
    text: De beheerder stelt een samenvatting van de strategie beschikbaar aan de deelnemers van de door hem beheerde icbe's.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126c
  - number: 126c.4
    text: |-
      De beheerder verstrekt kosteloos op verzoek informatie met betrekking tot bijzonderheden over de genomen
      maatregelen op grond van de strategie aan de deelnemers van de door hem beheerde icbe's.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126c
  - number: 126d.1
    text: |-
      Een beheerder van een icbe die een opdracht van een deelnemer tot inschrijving of terugbetaling van rechten van
      deelneming uitvoert, geeft de deelnemer onverwijld en uiterlijk op de eerste werkdag na uitvoering van de opdracht
      kennis van de uitvoering op een duurzame drager.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.2
    text: |-
      Indien de beheerder een bevestiging van de uitvoering van de opdracht ontvangt van een derde, stelt de beheerder de
      deelnemer daarvan in kennis uiterlijk op de eerste werkdag na ontvangst van de bevestiging van de derde, tenzij de
      derde de deelnemer reeds onmiddellijk in kennis heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.3
    text: |-
      Indien een beheerder periodiek voor een deelnemer opdrachten tot inschrijving of terugbetaling van rechten van
      deelneming in een icbe uitvoert, kan een beheerder de kennisgeving, bedoeld in het eerste en tweede lid, eenmaal
      per zes maanden verstrekken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.4
    text: |-
      Een beheerder verstrekt de deelnemer desgevraagd informatie over de status van zijn opdracht tot inschrijving of
      terugbetaling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5
    text: 'De kennisgeving, bedoeld in het eerste en tweede lid, bevat, voor zover van toepassing, de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5.a
    text: 'de identificatiegegevens van de beheerder:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5.b
    text: de naam of een andere omschrijving van de deelnemer;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5.c
    text: de datum en het tijdstip van de opdracht tot inschrijving of terugbetaling en de wijze van betaling;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5.d
    text: de datum van uitvoering;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5.e
    text: de identificatiegegevens van de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5.f
    text: de aard van de opdracht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5.g
    text: het aantal rechten van deelneming waarop de opdracht betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5.h
    text: |-
      de prijs per eenheid waartegen op de rechten van deelneming werd ingeschreven of waartegen deze werden
      terugbetaald;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5.i
    text: de referentievalutadatum;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5.j
    text: |-
      de brutowaarde van de opdracht inclusief inschrijvingskosten of het nettobedrag na aftrek van de
      terugbetalingskosten; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126d.5.k
    text: de totale kosten die in rekening zijn gebracht en, indien de deelnemer daarom verzoekt, een specificatie daarvan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126d
  - number: 126e.1
    text: 'Een beheerder van een icbe die orders van icbe''s uitvoert:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126e
  - number: 126e.1.a
    text: |-
      registreert orders die in naam van icbe's worden uitgevoerd onmiddellijk en correct en wijst deze orders
      onmiddellijk en correct toe; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126e
  - number: 126e.1.b
    text: |-
      voert vergelijkbare orders van icbe's in volgorde van ontvangst en onmiddellijk uit, tenzij de aard van de order of
      de heersende marktomstandigheden dit onmogelijk maken of in het belang van de icbe anders moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126e
  - number: 126e.2
    text: |-
      Een beheerder van een icbe die verantwoordelijk is voor de controle op of de afwikkeling van een uitgevoerde
      order neemt alle redelijke maatregelen om ervoor te zorgen dat alle financiële instrumenten of gelden die bij de
      afwikkeling van de uitgevoerde order worden ontvangen, onmiddellijk op correcte wijze op de rekening van de icbe
      worden bijgeschreven.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126e
  - number: 126e.3
    text: |-
      Een beheerder van een icbe maakt geen misbruik van informatie over lopende orders van icbe's en neemt alle
      redelijke maatregelen om misbruik van dergelijke informatie door zijn medewerkers te voorkomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126e
  - number: 126f.1
    text: |-
      Een beheerder van een icbe voert een order in naam van een icbe of een transactie voor eigen rekening niet samen
      met een andere order van een icbe of cliënt, tenzij:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126f
  - number: 126f.1.a
    text: |-
      het onwaarschijnlijk is dat de samenvoeging van de orders en transacties nadelig is voor de betrokken icbe of
      cliënt; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126f
  - number: 126f.1.b
    text: |-
      hij een ordertoewijzingsbeleid heeft vastgesteld en geïmplementeerd dat voldoende nauwkeurig voorziet in een
      billijke toewijzing van samengevoegde orders en transacties en dat onder meer voorschrijft hoe het volume en de
      prijs van orders bepalend zijn voor de toewijzingen en de behandeling van gedeeltelijke uitvoeringen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126f
  - number: 126f.2
    text: |-
      Indien een beheerder van een icbe een order samenvoegt met andere orders van icbe's of cliënten en de samengevoegde
      order slechts ten dele wordt uitgevoerd, wijst hij de desbetreffende transacties toe overeenkomstig zijn
      ordertoewijzingsbeleid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126f
  - number: 126g.1
    text: |-
      Een beheerder van een icbe die een transactie voor eigen rekening samenvoegt met een order van een icbe of cliënt,
      wijst de desbetreffende transactie niet toe op een voor de icbe respectievelijk cliënt nadelige wijze.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126g
  - number: 126g.2
    text: |-
      Indien een beheerder van een icbe een order van een icbe of cliënt samenvoegt met een transactie voor eigen
      rekening en de samengevoegde order slechts ten dele wordt uitgevoerd, geeft hij de order van de icbe of cliënt bij
      de toewijzing van de desbetreffende transactie voorrang op zijn eigen transactie. Het is de beheerder van een icbe
      slechts toegestaan een transactie als bedoeld in de vorige volzin naar evenredigheid toe te wijzen overeenkomstig
      zijn orderuitvoeringsbeleid, bedoeld in [artikel 126f, eerste lid, onderdeel b][ref1], indien hij kan aantonen dat
      de order van de icbe of cliënt niet of niet op dezelfde gunstige voorwaarden had kunnen uitvoeren als deze niet
      was samengevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel126f
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126g
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 126f
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 126h.1
    text: |-
      Een beheerder van een icbe verschaft of ontvangt voor het beheer van de beleggingen of administratie ten behoeve
      van een icbe geen beloning of vergoeding, in welke vorm dan ook, die niet noodzakelijk is voor het beheer van de
      beleggingen of administratie of dit mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126h
  - number: 126h.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126h
  - number: 126h.2.a
    text: beloningen of vergoedingen die worden verschaft door of aan de icbe of degene die namens de icbe optreedt; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126h
  - number: 126h.2.b
    text: |-
      beloningen of vergoedingen die worden verschaft door of aan een derde of degene die namens de derde optreedt,
      indien:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126h
  - number: 126h.2.b.1°
    text: |-
      de icbe op uitvoerige, accurate en begrijpelijke wijze mededeling wordt gedaan van het bestaan, de aard en het
      bedrag of, indien het bedrag niet kan worden achterhaald, de wijze van berekening daarvan, van de beloning of
      vergoeding voordat tot het beheren van beleggingen of administratie ten behoeve van de icbe wordt overgegaan; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126h
  - number: 126h.2.b.2°
    text: |-
      de verschaffing van de beloning of vergoeding de kwaliteit van het beheren van beleggingen of administratie ten
      behoeve van de icbe ten goede komt en geen afbreuk doet aan de verplichting van de beheerder om zich in te zetten
      voor de belangen van de icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126h
  - number: 126h.3
    text: |-
      De beheerder voldoet aan de voorwaarde, bedoeld in het tweede lid, aanhef en onderdeel b, onder 1°, indien hij in
      samengevatte vorm mededeling doet van de essentiële voorwaarden van de regelingen voor beloningen of vergoedingen
      en hij de deelnemers informeert over de mogelijkheid om nadere informatie te verkrijgen en deze op verzoek van de
      deelnemer verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126h
  - number: 126i.1
    text: |-
      Een beheerder van een icbe neemt bij het selecteren en continu monitoren van beleggingen de nodige zorgvuldigheid
      in acht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126i
  - number: 126i.2
    text: |-
      Een beheerder van een icbe heeft voldoende kennis en begrip van de activa waarin de door hem beheerde icbe's
      beleggen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126i
  - number: 126i.3
    text: |-
      Een beheerder van een icbe houdt rekening met duurzaamheidsrisico’s bij het voldoen aan het eerste en tweede lid,
      [artikel 23, eerste lid, Besluit prudentiële regels Wft][ref1] en de [artikelen 34, eerste lid][ref2], 38a, tweede
      lid, onderdelen e en f, en derde lid, van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel34
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126i
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '34'
  - number: 126i.4
    text: |-
      Indien artikel 4, eerste lid, onderdeel a, derde of vierde lid, van [Verordening (EU) 2019/2088](32088R2019) van
      het Europees Parlement en de Raad van 27 november 2019 betreffende informatieverschaffing over duurzaamheid in
      de financiëledienstensector (PbEU 2019, L 317) van toepassing is op de beheerder van een icbe houdt hij bij het
      voldoen aan de in het derde lid genoemde artikelen tevens rekening met de belangrijkste ongunstige effecten van
      beleggingsbeslissingen op duurzaamheidsfactoren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126i
  - number: 126j.1
    text: |-
      Een beheerder van een icbe zorgt ervoor dat billijke, correcte en transparante prijsbepalingsmodellen en
      waarderingssystemen worden aangewend.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126j
  - number: 126j.2
    text: |-
      Een beheerder van een icbe moet kunnen aantonen dat de deelnemingen in door hem beheerde icbe's correct worden
      gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel126j
  - number: '128'
    text: |-
      De statuten of het fondsreglement van een icbe als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1]
      vermelden:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 128.a
    text: |-
      de wijze waarop de bepaling plaatsvindt van de prijs bij het aanbieden, de verkoop- of inkoopprijs, en het bedrag
      bij terugbetaling van de waarde van de rechten van deelneming; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel128
  - number: 128.b
    text: |-
      de aard van de kosten die ten laste komen van het resultaat, in mindering worden gebracht op het beheerde vermogen
      of anderszins ten laste komen van de deelnemers in de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel128
  - number: '129'
    text: |-
      Een icbe als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1] die belegt in rechten van deelneming in andere
      beleggingsinstellingen die door haar beheerder worden beheerd of die worden beheerd door een beheerder waarmee
      haar beheerder in een formele of feitelijke zeggenschapsstructuur is verbonden, brengt geen kosten in rekening voor
      inschrijving of aflossing ten aanzien van de rechten van deelneming in die andere beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '130'
    text: |-
      Het beheerde vermogen van een icbe als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1] wordt uitsluitend
      belegd in:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 130.a
    text: |-
      effecten en geldmarktinstrumenten die zijn toegelaten tot de notering of worden verhandeld op een gereglementeerde
      markt of een multilaterale handelsfaciliteit;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.b
    text: |-
      effecten en geldmarktinstrumenten die zijn toegelaten tot de notering of worden verhandeld op een met een
      gereglementeerde markt of een multilaterale handelsfaciliteit vergelijkbaar systeem uit een staat die geen lidstaat
      is, voorzover de statuten of het fondsreglement van de icbe voorzien in belegging in deze financiële instrumenten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.c
    text: |-
      effecten waarvan het aannemelijk is dat zij binnen een jaar na emissie zullen worden toegelaten tot de notering
      of ter verhandeling zullen worden aangeboden op een gereglementeerde markt, een multilaterale handelsfaciliteit of
      een met een gereglementeerde markt of een multilaterale handelsfaciliteit vergelijkbaar systeem uit een staat die
      geen lidstaat is voorzover de statuten of het fondsreglement van de icbe voorzien in belegging in deze financiële
      instrumenten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.d
    text: |-
      rechten van deelneming in icbe’s voor het aanbieden waarvan op grond van [artikel 2:65 van de wet][ref1] een
      vergunning is verleend of in icbe’s die overeenkomstig de richtlijn instellingen voor collectieve belegging
      in effecten in een andere lidstaat zijn toegelaten, indien de betreffende icbe’s volgens hun statuten of
      fondsreglementen niet meer dan tien procent van hun beheerde vermogen beleggen in rechten van deelneming in andere
      beleggingsinstellingen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 130.e
    text: |-
      rechten van deelneming in beleggingsinstellingen met zetel in een aangewezen staat of in icbe’s waarop het
      toezicht naar het oordeel van de toezichthoudende instanties in andere lidstaten gelijkwaardig is aan de
      richtlijn instellingen voor collectieve belegging in effecten en ten aanzien waarvan de samenwerking tussen de
      toezichthouders en de toezichthoudende instanties genoegzaam is gewaarborgd, indien:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.e.1°
    text: |-
      de rechten van deelneming in de beleggingsinstellingen of icbe’s op verzoek van de deelnemers ten laste van de
      activa direct of indirect worden ingekocht of terugbetaald;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.e.2°
    text: |-
      het reglementaire of statutaire doel van de beleggingsinstellingen of icbe’s uitsluitend is het beleggen
      in effecten, geldmarktinstrumenten, deposito’s of financiële derivaten met toepassing van het beginsel van
      risicospreiding;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.e.3°
    text: |-
      de op de beleggingsinstellingen of icbe’s toepasselijke regels inzake scheiding van het vermogen, opnemen
      en verstrekken van leningen en verkopen van effecten en geldmarktinstrumenten vanuit een ongedekte positie
      gelijkwaardig zijn aan de voorschriften van de richtlijn instellingen voor collectieve belegging in effecten; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.e.4°
    text: |-
      de beleggingsinstellingen of icbe’s volgens hun statuten of fondsreglementen niet meer dan tien procent van hun
      beheerde vermogen beleggen in rechten van deelneming in andere beleggingsinstellingen of icbe’s;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.f
    text: |-
      deposito’s bij een bank met zetel in een lidstaat of in een staat die geen lidstaat is, mits de Nederlandsche Bank
      heeft vastgesteld dat het prudentieel toezicht in die staat die geen lidstaat is in voldoende mate waarborgen biedt
      ten aanzien van de belangen die de wet beoogt te beschermen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.g
    text: |-
      financiële derivaten die zijn toegelaten tot de notering of worden verhandeld op een gereglementeerde markt,
      een multilaterale handelsfaciliteit of een met een gereglementeerde markt of een multilaterale handelsfaciliteit
      vergelijkbaar systeem uit een staat die geen lidstaat is, voorzover de waarde afhankelijk is van de in dit artikel
      genoemde financiële instrumenten en deposito’s, financiële indices, rentetarieven, wisselkoersen of valuta’s waarin
      de icbe krachtens haar statuten of reglementen mag beleggen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.h
    text: |-
      financiële derivaten die niet op een gereglementeerde markt, een multilaterale handelsfaciliteit of een met een
      gereglementeerde markt of een multilaterale handelsfaciliteit vergelijkbaar systeem uit een staat die geen lidstaat
      is worden verhandeld, indien:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.h.1°
    text: |-
      de waarde afhankelijk is van de in dit artikel genoemde financiële instrumenten en deposito’s, financiële indices,
      rentetarieven, wisselkoersen of valuta’s waarin icbe’s krachtens haar statuten of reglementen mag beleggen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.h.2°
    text: |-
      de tegenpartij een aan prudentieel toezicht onderworpen instelling is en behoort tot de categorieën die erkend zijn
      door de Autoriteit Financiële Markten of een toezichthoudende instantie in een andere lidstaat; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.h.3°
    text: |-
      zij aan betrouwbare en verifieerbare dagelijkse waardering onderworpen zijn en te allen tijde tegen hun waarde in
      het economisch verkeer op initiatief van de icbe kunnen worden verkocht, te gelde gemaakt of afgesloten door een
      compenserende transactie; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.i
    text: |-
      geldmarktinstrumenten die niet op een gereglementeerde markt, een multilaterale handelsfaciliteit of een met een
      gereglementeerde markt of een multilaterale handelsfaciliteit vergelijkbaar systeem uit een staat die geen lidstaat
      is worden verhandeld, indien de emissie of de emittent van deze instrumenten zelf aan regelgeving is onderworpen
      met het oog op de bescherming van beleggers en spaargelden, en deze instrumenten:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.i.1°
    text: |-
      worden uitgegeven of gegarandeerd door een centrale, regionale of plaatselijke overheid, de centrale bank van een
      lidstaat, de Europese Centrale Bank, de Europese Unie of de Europese Investeringsbank, een staat die geen lidstaat
      is, een deelstaat van een federale staat of een internationale publiekrechtelijke instelling waarin een of meer
      lidstaten deelnemen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.i.2°
    text: |-
      worden uitgegeven door een onderneming waarvan effecten worden verhandeld op een gereglementeerde markt, een
      multilaterale handelsfaciliteit of een met een gereglementeerde markt of een multilaterale handelsfaciliteit
      vergelijkbaar systeem uit een staat die geen lidstaat is;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.i.3°
    text: |-
      worden uitgegeven of gegarandeerd door een instelling die in een lidstaat aan prudentieel toezicht is onderworpen
      of door een instelling die onderworpen is aan prudentieel toezicht dat in ieder geval gelijkwaardig is aan het
      ingevolge het gemeenschapsrecht geldende prudentieel toezicht; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: 130.i.4°
    text: |-
      worden uitgegeven door andere instellingen waarvoor een gelijkwaardige bescherming van de belegger geldt als
      is vastgelegd in dit onderdeel, aanhef en onder 1°, 2° en 3°, indien de uitgevende instelling een onderneming
      is waarvan het kapitaal en de reserves in totaal ten minste € 10.000.000 bedragen en die haar jaarrekeningen
      presenteert en publiceert overeenkomstig de richtlijn jaarrekening, of een rechtspersoon is die binnen een groep
      waartoe een of meer ondernemingen waarvan de aandelen zijn toegelaten tot notering aan een gereglementeerde markt,
      een multilaterale handelsfaciliteit of een met een gereglementeerde markt of een multilaterale handelsfaciliteit
      vergelijkbaar systeem uit een staat die geen lidstaat is behoren, specifiek gericht is op de financiering van de
      groep, of een rechtspersoon is specifiek gericht op de financiering van effectiseringsinstrumenten waarvoor een
      bankliquiditeitenlijn bestaat.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel130
  - number: '131.1'
    text: |-
      In afwijking van [artikel 130][ref1] kan het beheerde vermogen van een icbe:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 131.1.a
    text: |-
      voor ten hoogste tien procent worden belegd in effecten en geldmarktinstrumenten die niet zijn toegelaten tot of
      worden verhandeld op een gereglementeerde markt of een andere markt in financiële instrumenten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel131
  - number: 131.1.b
    text: |-
      indien het een maatschappij voor collectieve belegging in effecten betreft: worden belegd in zaken die rechtstreeks
      noodzakelijk zijn voor de uitoefening van haar werkzaamheid; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel131
  - number: 131.1.c
    text: worden aangehouden in accessoir liquide middelen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel131
  - number: '131.2'
    text: |-
      In afwijking van [artikel 130][ref1] kan het beheerd vermogen van een feeder-icbe voor maximaal vijftien procent:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 131.2.a
    text: |-
      worden belegd in financiële derivaten, bedoeld in [artikel 130, onderdelen g en h][ref1], die alleen met het doel
      om risico af te dekken mogen worden gebruikt;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 131.2.b
    text: |-
      indien het een maatschappij voor collectieve belegging in effecten betreft: worden belegd in zaken die rechtstreeks
      noodzakelijk zijn voor de uitoefening van haar werkzaamheid; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel131
  - number: 131.2.c
    text: worden aangehouden in accessoir liquide middelen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel131
  - number: '132'
    text: |-
      Het beheerde vermogen van een icbe als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1] wordt niet belegd in
      edele metalen of in certificaten die deze metalen vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '133.1'
    text: |-
      De icbe als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1] doet de Autoriteit Financiële Markten ten
      minste jaarlijks mededeling van de tot haar activa behorende soorten financiële derivaten, de onderliggende
      risico’s, de kwantitatieve begrenzingen en de methodes die zijn gekozen om de aan transacties in deze financiële
      instrumenten verbonden risico’s te ramen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '133.2'
    text: |-
      De Autoriteit Financiële Markten evalueert de regelmatigheid en de volledigheid van de informatie, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel133
  - number: '133.3'
    text: Het totale risico van een icbe wordt dagelijks berekend.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel133
  - number: '133.4'
    text: |-
      Voor de berekening van het totale risico in financiële derivaten van een feeder-icbe wordt het eigen directe risico
      in financiële derivaten, bedoeld in [artikel 131, tweede lid, onderdeel a][ref1], van de feeder-icbe gecombineerd
      met:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel131
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '131'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 133.4.a
    text: |-
      het reële risico in financiële derivaten van de master-icbe naar evenredigheid van de belegging van de feeder-icbe
      in rechten van deelneming in de master-icbe; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel133
  - number: 133.4.b
    text: |-
      het potentiële totale maximumrisico in financiële derivaten dat de master-icbe volgens haar fondsreglement of
      statuten, naar evenredigheid van de belegging van de feeder-icbe in rechten van deelneming in de master-icbe, mag
      aangaan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel133
  - number: '133.5'
    text: |-
      Het totale risico van de icbe bedraagt niet meer dan tweemaal de totale nettowaarde van de activa. Het totale
      risico van een beleggingsinstelling wordt met niet meer dan tien procent van de totale nettowaarde van haar
      portefeuille vergroot door het aangaan van kortlopende leningen, in welk geval het totale risico van de icbe niet
      meer dan 210 procent bedraagt van de totale nettowaarde van haar portefeuille.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel133
  - number: '133.6'
    text: |-
      Het totale risico van de icbe in financiële derivaten overschrijdt niet de totale nettowaarde van de activa. Voor
      de berekening van het risico worden de dagwaarde van de onderliggende activa, het tegenpartijrisico, toekomstige
      marktbewegingen en de voor de liquidatie van de posities beschikbare tijd in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel133
  - number: '133.7'
    text: |-
      Het beheerde vermogen van de icbe kan in het kader van het beleggingsbeleid en binnen de in [artikel 137][ref1]
      gestelde begrenzingen worden belegd in financiële derivaten voorzover het risico met betrekking tot de
      onderliggende activa in totaal niet de in de [artikelen 134][ref2], [135][ref3], [136, eerste lid][ref4], en 137
      gestelde begrenzingen overschrijdt. Indien het beheerde vermogen van de icbe in op een index gebaseerde financiële
      derivaten wordt belegd, worden die beleggingen voor de toepassing van de in de artikelen 134, 135, 136, eerste lid,
      en 137 gestelde begrenzingen bepaalde bovengrens niet samengeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel136
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '137'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '133.8'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de berekening van het risico, de wijze
      van vaststelling van de dagwaarde van de onderliggende activa, de soorten verplichtingen die leiden tot een
      tegenpartijrisico, het meewegen van toekomstige marktbewegingen bij de vaststelling en de methodes die mede
      afhankelijk van de aard van het financiële instrument waarin wordt belegd, voor berekening van de risico’s kunnen
      worden gehanteerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel133
  - number: '134.1'
    text: |-
      Het beheerde vermogen van een icbe als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1] wordt tot ten
      hoogste tien procent belegd in effecten en geldmarktinstrumenten die zijn uitgegeven door dezelfde instelling. Een
      icbe belegt niet meer dan twintig procent van het beheerde vermogen in deposito’s bij één bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '134.2'
    text: |-
      Het tegenpartijrisico van de icbe bij een transactie in financiële derivaten die niet op een gereglementeerde markt
      of een andere markt in financiële instrumenten worden verhandeld, bedraagt niet meer dan:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel134
  - number: 134.2.a
    text: |-
      tien procent van haar vermogen wanneer de tegenpartij een bank met zetel in een lidstaat is of een bank met zetel
      in een staat die geen lidstaat is, mits de Nederlandsche Bank heeft vastgesteld dat het prudentieel toezicht in
      die staat die geen lidstaat is in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te
      beschermen; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel134
  - number: 134.2.b
    text: vijf procent van haar vermogen, in andere gevallen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel134
  - number: '134.3'
    text: |-
      De totale waarde van de effecten en de geldmarktinstrumenten die de icbe houdt in uitgevende instellingen waarin
      zij per instelling voor meer dan vijf procent belegt, bedraagt niet meer dan veertig procent van het beheerde
      vermogen van de icbe. Deze begrenzing is niet van toepassing op deposito’s en transacties in financiële derivaten
      die niet op een gereglementeerde markt of een andere markt in financiële instrumenten worden verhandeld, bij
      onderscheidenlijk met instellingen die aan prudentieel toezicht onderworpen zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel134
  - number: '134.4'
    text: |-
      Onverminderd de in het eerste en tweede lid bepaalde individuele begrenzingen wordt het beheerde vermogen van de
      icbe tot ten hoogste twintig procent belegd in één instelling in een combinatie van:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel134
  - number: 134.4.a
    text: effecten en geldmarktinstrumenten die door die instelling zijn uitgegeven;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel134
  - number: 134.4.b
    text: deposito’s bij die instelling; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel134
  - number: 134.4.c
    text: |-
      risico’s ten gevolge van transacties in financiële derivaten die niet op een gereglementeerde markt of een andere
      markt in financiële instrumenten worden verhandeld, met betrekking tot die instelling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel134
  - number: '134.5'
    text: |-
      Bij de berekening van de door de icbe gelopen risico’s bij beleggingen als bedoeld in het eerste tot en met
      vierde lid, wordt het risico bepaald aan de hand van het maximale verlies voor de icbe wanneer een tegenpartij in
      gebreke blijft. De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot de berekening van
      het tegenpartijrisico en de daarbij in aanmerking te nemen zekerheden als beperking van het door de icbe gelopen
      tegenpartijrisico.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel134
  - number: '135.1'
    text: |-
      In afwijking van [artikel 134][ref1] kan het beheerde vermogen van een icbe tot ten hoogste vijfentwintig procent
      worden belegd in geregistreerde gedekte obligaties van een bepaalde uitgevende bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '135.2'
    text: |-
      Indien het beheerde vermogen van een icbe voor meer dan vijf procent wordt belegd in obligaties als bedoeld in het
      eerste lid die door één instelling zijn uitgegeven, bedraagt de totale waarde van deze beleggingen niet meer dan
      tachtig procent van de activa van die uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel135
  - number: '136.1'
    text: |-
      In afwijking van [artikel 134, eerste lid][ref1], kan het beheerde vermogen van een icbe tot ten hoogste
      vijfendertig procent worden belegd in effecten en geldmarktinstrumenten die zijn uitgegeven of gegarandeerd door
      een lidstaat, een openbaar lichaam met verordenende bevoegdheid in een lidstaat, een staat die geen lidstaat is, of
      een internationale organisatie waarin een of meer lidstaten deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '136.2'
    text: 'De Autoriteit Financiële Markten kan een icbe op aanvraag ontheffing verlenen van het eerste lid indien:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel136
  - number: 136.2.a
    text: |-
      zij effecten en geldmarktinstrumenten van ten minste zes verschillende emissies van een in het eerste lid bedoelde
      uitgevende staat, openbaar lichaam of internationale organisatie in portefeuille heeft;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel136
  - number: 136.2.b
    text: |-
      de financiële instrumenten van een zelfde emissie niet meer bedragen dan dertig procent van het beheerde vermogen
      van de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel136
  - number: 136.2.c
    text: |-
      de uitgevende staat, het openbaar lichaam of de internationale organisatie in de statuten of het fondsreglement van
      de icbe wordt genoemd; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel136
  - number: 136.2.d
    text: |-
      de deelnemers in de icbe bescherming genieten die gelijkwaardig is aan de bescherming die voortvloeit uit het
      eerste lid en de [artikelen 134][ref1], [135][ref2] en [137][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel137
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '137'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '137.1'
    text: |-
      De in de [artikelen 135][ref1] en [136, eerste lid][ref2], bedoelde financiële instrumenten worden niet in
      aanmerking genomen voor de toepassing van de in [artikel 134, derde lid][ref3], bedoelde begrenzing van veertig
      procent.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '137.2'
    text: |-
      De overeenkomstig de [artikelen 134][ref1], [135][ref2], en [136, eerste lid][ref3], verrichte beleggingen in door
      één instelling uitgegeven effecten en geldmarktinstrumenten dan wel in deposito’s bij of financiële derivaten van
      die instelling, bedragen samen in geen geval meer dan vijfendertig procent van het beheerde vermogen van de icbe.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel136
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '137.3'
    text: |-
      Voor de berekening van de in de [artikelen 134][ref1], [135][ref2], en [136, eerste lid][ref3], gestelde
      begrenzingen worden ondernemingen die tot een groep worden gerekend voor de opstelling van geconsolideerde
      jaarrekeningen, overeenkomstig de richtlijn geconsolideerde jaarrekening of andere erkende internationale
      financiële verslagleggingsregels, tezamen als een instelling beschouwd, met dien verstande dat de beleggingen,
      bedoeld in [artikel 134, eerste lid, eerste volzin][ref4], in de afzonderlijke ondernemingen die tot die groep
      behoren ten hoogste twintig procent van het beheerde vermogen van de icbe kunnen bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '137.4'
    text: |-
      De activa van beleggingsinstellingen in wier rechten van deelneming de icbe belegt worden voor het vaststellen
      van de in [artikelen 134][ref1], [135][ref2], [136, eerste lid][ref3], en [137][ref4] bedoelde begrenzingen niet
      opgeteld bij de beleggingen van de icbe.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel137
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '137'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '138.1'
    text: |-
      In afwijking van [artikel 134, eerste lid][ref1], kan het beheerde vermogen van een icbe tot ten hoogste twintig
      procent worden belegd in aandelen en obligaties van dezelfde uitgevende instelling indien in het fondsreglement of
      de statuten van de icbe is bepaald dat het beleggingsbeleid van de icbe erop is gericht de samenstelling van een
      bepaalde aandelen- of obligatie-index te volgen, en deze index voldoet aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 138.1.a
    text: de samenstelling van de index is gediversifieerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel138
  - number: 138.1.b
    text: de index is representatief voor de markt waarop hij betrekking heeft; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel138
  - number: 138.1.c
    text: de index wordt op passende wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel138
  - number: '138.2'
    text: |-
      [Artikel 134, derde lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '138.3'
    text: |-
      De Autoriteit Financiële Markten kan op aanvraag ontheffing verlenen van het eerste lid indien uitzonderlijke
      marktomstandigheden daartoe aanleiding geven. In dat geval kan het beheerde vermogen van de icbe tot ten hoogste
      vijfendertig procent worden belegd in aandelen en obligaties van dezelfde uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel138
  - number: '139.1'
    text: |-
      Het beheerde vermogen van een icbe als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1] wordt tot ten
      hoogste twintig procent belegd in rechten van deelneming in beleggingsinstellingen of icbe’s als bedoeld in
      [artikel 130, onderdeel d of e][ref2], die zijn uitgegeven door dezelfde beleggingsinstelling of icbe.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '139.2'
    text: |-
      De beleggingen in rechten van deelneming in beleggingsinstellingen of icbe’s als bedoeld in
      [artikel 130, onderdeel e][ref1], bedragen in totaal niet meer dan dertig procent van het beheerde vermogen van
      de icbe.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '140.1'
    text: |-
      Een beheerder van een icbe verwerft, voor de door hem beheerde icbe’s als bedoeld in
      [artikel 4:61, eerste lid, van de wet][ref1] gezamenlijk, niet meer dan twintig procent van de aandelen met
      stemrecht in dezelfde uitgevende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '140.2'
    text: |-
      Het beheerde vermogen van een icbe als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1] wordt niet belegd in
      meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 140.2.a
    text: tien procent van de aandelen zonder stemrecht van dezelfde uitgevende instelling;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel140
  - number: 140.2.b
    text: tien procent van de obligaties van dezelfde uitgevende instelling;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel140
  - number: 140.2.c
    text: |-
      vijfentwintig procent van de rechten van deelneming in een beleggingsinstelling of icbe’s waarvan de rechten van
      deelneming op verzoek van de deelnemers ten laste van de activa direct of indirect worden ingekocht of terugbetaald
      van dezelfde beleggingsinstelling of icbe’s; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel140
  - number: 140.2.d
    text: tien procent van de geldmarktinstrumenten van dezelfde uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel140
  - number: '140.3'
    text: |-
      De begrenzingen, bedoeld in het tweede lid, aanhef en onderdelen b, c en d, hoeven niet in acht te worden genomen
      indien de bruto waarde van de obligaties of geldmarktinstrumenten of de nettowaarde van de rechten van deelneming
      in een beleggingsinstelling of icbe’s op het tijdstip van verwerving niet kan worden berekend.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel140
  - number: '141'
    text: |-
      [Artikel 140, eerste en tweede lid][ref1], is niet van toepassing op het verwerven van onderscheidenlijk het
      beleggen in:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel140
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '140'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 141.a
    text: |-
      effecten en geldmarktinstrumenten die zijn uitgegeven of worden gegarandeerd door een lidstaat, een openbaar
      lichaam met verordenende bevoegdheid in een lidstaat, een staat die geen lidstaat is of een internationale
      organisatie waarin een of meer lidstaten deelnemen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel141
  - number: 141.b
    text: |-
      aandelen in het kapitaal van een rechtspersoon, gevestigd in een staat die geen lidstaat is, die met inachtneming
      van de begrenzingen, bedoeld in de [artikelen 134][ref1], [135][ref2], [136, eerste lid][ref3], [137][ref4],
      [139][ref5] en [140][ref6] zijn vermogen in hoofdzaak belegt in effecten van uitgevende instellingen, gevestigd in
      die staat, wanneer krachtens de wet van die staat een dergelijke deelneming voor de icbe de enige mogelijkheid is
      om in effecten van uitgevende instellingen in die staat te beleggen; of


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel137
      [ref5]: https://wetten.overheid.nl/BWBR0020421#Artikel139
      [ref6]: https://wetten.overheid.nl/BWBR0020421#Artikel140
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '135'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '137'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref5
        bwb_id: BWBR0020421
        artikel: '139'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref6
        bwb_id: BWBR0020421
        artikel: '140'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 141.c
    text: |-
      aandelen in het kapitaal van een dochteronderneming van de maatschappij voor collectieve belegging in effecten die
      uitsluitend ten behoeve van de maatschappij voor collectieve belegging in effecten bepaalde beheers-, advies- of
      verhandelingswerkzaamheden verricht in de staat waar de dochteronderneming is gevestigd, met het oog op de inkoop
      van rechten van deelneming op verzoek van deelnemers.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel141
  - number: '142.1'
    text: |-
      De [artikelen 134 tot en met 139][ref1] zijn gedurende zes maanden na het eerste aanbod van de rechten van
      deelneming in een icbe niet van toepassing. De icbe neemt gedurende die periode de beginselen van risicospreiding
      in haar beleggingen in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '142.2'
    text: |-
      De [artikelen 134 tot en met 139][ref1] zijn gedurende zes maanden na een fusie niet van toepassing op een
      verkrijgende icbe. De verkrijgende icbe neemt gedurende die periode de beginselen van risicospreiding in haar
      beleggingen in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '134'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '143.1'
    text: |-
      De in deze paragraaf gestelde begrenzingen gelden niet bij de uitoefening van voorkeurrechten die zijn verbonden
      aan effecten en geldmarktinstrumenten die deel uitmaken van de activa van de icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel143
  - number: '143.2'
    text: |-
      Wanneer de in deze paragraaf gestelde begrenzingen buiten de wil van de icbe of ten gevolge van de uitoefening van
      voorkeurrechten worden overschreden, treft de icbe, met inachtneming van de belangen van de deelnemers, de nodige
      maatregelen opdat deze overschrijding zo snel mogelijk ongedaan wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel143
  - number: '144'
    text: |-
      Een icbe als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1] legt binnen vier weken na een verzoek daartoe
      van de Autoriteit Financiële Markten, dan wel binnen vier weken na afloop van het boekjaar, een mededeling van een
      accountant over aan de Autoriteit Financiële Markten waaruit blijkt dat de icbe in overeenstemming heeft gehandeld
      met de [artikelen 130 tot en met 143][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '145.1'
    text: |-
      Gelijktijdig met de verkrijgbaarstelling van het prospectus, bedoeld in
      [artikel 4:50, tweede lid, van de wet][ref1], zendt de beheerder een afschrift van het prospectus en van het
      essentiële-informatiedocument respectievelijk de essentiële beleggersinformatie van de icbe als bedoeld in
      [artikel 4:61, eerste lid, van de wet][ref2] aan de Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '145.2'
    text: |-
      De beheerder van een icbe zendt wijzigingen in het essentiële-informatiedocument respectievelijk de essentiële
      beleggersinformatie aan de Autoriteit Financiële markten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel145
  - number: '146.1'
    text: 'De balans en winst- en verliesrekening van een icbe of de toelichtingen daarop bevatten de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.a
    text: tegoeden bij banken;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.b
    text: |-
      een onderscheid in de overzichten van de beleggingen, bedoeld in [artikel 122, eerste lid, onderdelen a en b][ref1],
      naar:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel122
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '122'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 146.1.b.1°
    text: financiële instrumenten die zijn toegelaten tot de notering op een gereglementeerde markt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.b.2°
    text: |-
      financiële instrumenten die op een gereglementeerde markt of een andere markt in financiële instrumenten worden
      verhandeld;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.b.3°
    text: |-
      effecten als bedoeld in [artikel 130, onderdeel c][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel130
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '130'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 146.1.b.4°
    text: |-
      financiële instrumenten als bedoeld in [artikel 131, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel131
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '131'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 146.1.c
    text: |-
      een sluitend overzicht van de gesaldeerde mutaties in de verslagperiode in het eigen vermogen van de maatschappij
      voor collectieve belegging in effecten of het beheerde vermogen van het fonds voor collectieve belegging in
      effecten ten gevolge van en uitgesplitst naar:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.c.1°
    text: inkomsten uit beleggingen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.c.2°
    text: overige inkomsten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.c.3°
    text: belastingen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.c.4°
    text: de bestemming, of voorgestelde bestemming, van het nettoresultaat;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.c.5°
    text: |-
      de vermeerdering of vermindering van het eigen vermogen van de maatschappij voor collectieve belegging in effecten
      of van het beheerde vermogen van het fonds voor collectieve belegging in effecten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.c.6°
    text: meer- en minderwaarde op beleggingen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.c.7°
    text: overige mutaties van de activa en passiva; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: 146.1.d
    text: |-
      het bedrag van de verplichtingen onderscheiden naar soort aan het einde van het boekjaar die voortvloeien uit
      verrichtingen met betrekking tot financiële derivaten en voorzover deze niet reeds in de balans en de winst- en
      verliesrekening zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
  - number: '146.2'
    text: |-
      Onverminderd [artikel 125, eerste lid][ref1], neemt een icbe in de halfjaarcijfers de gegevens op, bedoeld in het
      eerste lid, onderdelen a en b, zoals deze luidden aan het einde van de eerste helft van het boekjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel125
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '125'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '147.1'
    text: |-
      Een icbe als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1] publiceert telkens wanneer zij of haar
      beheerder rechten van deelneming aanbiedt, verkoopt, inkoopt, of daarop terugbetaalt de koers, de verkoop-
      onderscheidenlijk inkoopprijs en het bedrag van de terugbetaling op de website van haar beheerder. De Autoriteit
      Financiële Markten kan op verzoek besluiten dat de icbe deze bekendmaking eenmaal per maand doet, indien de
      belangen van de deelnemers daardoor niet worden geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '147.2'
    text: |-
      Het eerste lid is niet van toepassing op icbe’s als bedoeld in [artikel 126, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel126
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '126'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '147.3'
    text: |-
      Onverminderd [artikel 4:46a van de wet][ref1] brengt een icbe als bedoeld in [artikel 126][ref2] de intrinsieke
      waarde van de rechten van deelneming ten minste tweemaal per week ter kennis van de Autoriteit Financiële Markten
      en publiceert zij de intrinsieke waarde van de rechten van deelneming tweemaal per maand op de website van haar
      beheerder waarbij tussen elk van de tijdstippen van publicatie een periode van ten minste een week ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel126
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '126'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '147.4'
    text: |-
      Een icbe als bedoeld in [artikel 4:61, eerste lid, van de wet][ref1] verschaft desgevraagd aan een deelnemer
      gegevens betreffende kwantitatieve begrenzingen die van toepassing zijn op het risicobeheer, de daartoe gekozen
      methodes en de recente ontwikkeling van de risico’s en rendementen van de voornaamste categorie financiële
      instrumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147a.1
    text: |-
      In afwijking van [artikel 139, eerste lid][ref1], kan het beheerde vermogen van een icbe voor meer dan twintig
      procent worden belegd in een bepaalde master-icbe indien de Autoriteit Financiële Markten daarmee heeft ingestemd.
      De Autoriteit Financiële Markten neemt een besluit omtrent instemming binnen vijftien werkdagen na ontvangst van de
      aanvraag van instemming.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel139
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '139'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147a.2
    text: |-
      De Autoriteit Financiële Markten stemt met de aanvraag in, indien de beheerder aantoont dat de feeder-
      icbe, haar bewaarder, haar accountant en de master-icbe zullen voldoen aan het bepaalde ingevolge de
      [artikelen 4:57a tot en met 4:57c][ref1], [4:61a][ref2] en [4:61b van de wet][ref3] en het bepaalde in deze
      paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147a.3
    text: 'De aanvraag van instemming geschiedt onder opgave van de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147a
  - number: 147a.3.a
    text: het fondsreglement of de statuten van de feeder-icbe en de master-icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147a
  - number: 147a.3.b
    text: |-
      het prospectus en het essentiële-informatiedocument respectievelijk de essentiële beleggersinformatie van de
      feeder-icbe en de master-icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147a
  - number: 147a.3.c
    text: |-
      de overeenkomst tot uitwisseling van informatie tussen de feeder-icbe en de master-icbe, bedoeld in
      [artikel 147b, eerste lid][ref1], of de interne regels met betrekking tot de bedrijfsvoering, bedoeld in artikel
      147b, vierde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147b
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147a.3.d
    text: |-
      indien van toepassing, de aan de deelnemers te verstrekken informatie, bedoeld in [artikel 147f, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147f
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147f
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147a.3.e
    text: |-
      indien van toepassing, de overeenkomst tot uitwisseling van informatie, bedoeld in [artikel 4:57b van de wet][ref1]
      tussen de bewaarder van de feeder-icbe en de bewaarder van de master-icbe;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147a.3.f
    text: |-
      indien van toepassing, de overeenkomst tot uitwisseling van informatie, bedoeld in [artikel 4:57c van de wet][ref1]
      tussen de accountant van de feeder-icbe en de accountant van de master-icbe; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147a.3.g
    text: |-
      indien het een master-icbe met zetel in een andere lidstaat betreft: een verklaring van de toezichthoudende
      instantie van de lidstaat van de zetel van de master-icbe dat deze een icbe is en voldoet aan de onderdelen b en c,
      in de definitie van master-icbe in artikel 1 van de wet.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147a
  - number: 147a.4
    text: |-
      De gegevens, bedoeld in het derde lid, worden verstrekt in het Nederlands of in een taal die door de Autoriteit
      Financiële Markten is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147a
  - number: 147b.1
    text: Een feeder-icbe sluit een overeenkomst tot uitwisseling van informatie met de master-icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147b
  - number: 147b.2
    text: |-
      De overeenkomst voorziet er in dat de master-icbe alle informatie aan de feeder-icbe verstrekt die de feeder-icbe
      nodig heeft om te voldoen aan de regels die ingevolge de wet aan haar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147b
  - number: 147b.3
    text: De overeenkomst is op verzoek kosteloos beschikbaar voor de deelnemers van de feeder-icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147b
  - number: 147b.4
    text: |-
      Indien de feeder-icbe en de master-icbe worden beheerd door dezelfde beheerder, kan in afwijking van het eerste
      lid, worden volstaan met bedrijfsvoeringsregels van de beheerder die waarborgen dat uitwisseling van informatie
      plaatsvindt tussen de feeder-icbe en de master-icbe. Het tweede lid is van overeenkomstige toepassing op de interne
      bedrijfsvoeringsregels.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147b
  - number: 147b.5
    text: |-
      Onverminderd het tweede lid voorziet de overeenkomst, bedoeld in het eerste lid, respectievelijk voorzien de
      bedrijfsvoeringsregels, bedoeld in het vierde lid, in het bepaalde in [bijlage J][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147b
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 147c
    text: |-
      De overeenkomst tot uitwisseling van informatie tussen accountants, bedoeld in
      [artikel 4:57c, eerste lid, van de wet][ref1], bevat de gegevens, genoemd in [bijlage J][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
  - number: 147d.1
    text: |-
      Indien een feeder-icbe en haar master-icbe beide hun zetel in Nederland hebben is uitsluitend het Nederlands recht
      van toepassing op de overeenkomst tot uitwisseling van informatie, bedoeld in [artikel 147b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147b
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147d.2
    text: |-
      Indien de feeder-icbe of de master-icbe haar zetel in een andere lidstaat heeft, dan bepaalt de overeenkomst tot
      uitwisseling van informatie, bedoeld in [artikel 147b, eerste lid][ref1], dat uitsluitend het Nederlands recht of
      het recht van die andere lidstaat van toepassing is op die overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147b
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147d.3
    text: |-
      Het recht van de lidstaat dat op grond van het eerste of tweede lid van toepassing is op een overeenkomst tot
      uitwisseling van informatie is eveneens van toepassing op een overeenkomst tussen de bewaarders van de feeder-
      icbe en de master-icbe als bedoeld in [artikel 4:57b, eerste lid, van de wet][ref1] en een overeenkomst tussen de
      accountants van de feeder-icbe en master-icbe als bedoeld in [artikel 4:57c, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147d.4
    text: |-
      Indien de overeenkomst is vervangen door bedrijfsvoeringsregels als, bedoeld in [artikel 147b, vierde lid][ref1],
      voorziet een overeenkomst tussen bewaarders als bedoeld [artikel 4:57b, eerste lid][ref2], respectievelijk tussen
      accountants als bedoeld in [artikel 4:57c, eerste lid, van de wet][ref3] erin dat het recht van de lidstaat van
      de zetel van de feeder-icbe of het recht van de lidstaat van de zetel van de master-icbe bij uitsluiting van
      toepassing is op de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147b
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147b
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147d.5
    text: |-
      De overeenkomsten, bedoeld in de [artikelen 4:57b, eerste lid][ref1], en [4:57c, eerste lid, van de wet][ref2] en
      [artikel 147b, eerste lid][ref3], bepalen dat de rechter van de lidstaat waarvan het recht van toepassing is op
      de overeenkomst, wordt aangewezen voor de kennisneming van geschillen welke naar aanleiding van de overeenkomst
      ontstaan of zullen ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel147b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 147b
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147f.1
    text: |-
      Indien een icbe voornemens is ten minste 85 procent van haar vermogen in rechten van deelneming in een master-
      icbe te beleggen of een feeder-icbe voornemens is haar rechten van deelneming te beleggen in een andere master-icbe
      verstrekt zij de volgende informatie aan haar deelnemers:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147f
  - number: 147f.1.a
    text: een verklaring dat de Autoriteit Financiële Markten met de voorgenomen belegging in de master-icbe heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147f
  - number: 147f.1.b
    text: |-
      het essentiële-informatiedocument respectievelijk de essentiële beleggersinformatie van de feeder-icbe en de
      master-icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147f
  - number: 147f.1.c
    text: de datum waarop de icbe uitvoering zal geven aan haar voornemen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147f
  - number: 147f.1.d
    text: |-
      een verklaring dat deelnemers binnen dertig dagen na de informatieverstrekking kunnen eisen dat hun rechten van
      deelneming worden ingekocht of terugbetaald.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147f
  - number: 147f.2
    text: |-
      Indien de beheerder van een icbe een kennisgeving heeft gedaan als bedoeld in
      [artikel 2:123, eerste lid, van de wet][ref1] verstrekt de icbe de informatie, bedoeld in het eerste lid, in de
      officiële taal of een van de officiële talen van de lidstaat waar zij rechten van deelneming aanbiedt, of in een
      taal die door de toezichthoudende instantie van de desbetreffende lidstaat is goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 147f.3
    text: |-
      De informatie, bedoeld in het eerste lid, wordt ten minste dertig dagen voor de datum, bedoeld in het eerste lid,
      onderdeel c, verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147f
  - number: 147f.4
    text: |-
      De icbe gaat niet over tot een belegging van meer dan twintig procent van haar beheerd vermogen in rechten van
      deelneming in de master-icbe voordat de termijn, bedoeld in het derde lid, is verstreken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147f
  - number: 147f.5
    text: |-
      De icbe brengt bij inkoop of terugbetaling van rechten van deelneming als bedoeld in het eerste lid, onderdeel d,
      geen andere kosten in rekening dan desinvesteringskosten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147f
  - number: 147f.6
    text: |-
      De icbe kan de informatie, bedoeld in het eerste lid, in plaats van schriftelijk op een andere duurzame drager
      verstrekken na toestemming van de deelnemer en indien dat past in de context waarin zij, of in voorkomend geval de
      beheerder, met de deelnemer zaken doet.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147f
  - number: 147f.7
    text: |-
      De verstrekking van informatie door de icbe aan de deelnemer via elektronische mededelingen past in de context
      waarin de icbe respectievelijk haar beheerder met de deelnemer zaken doet of gaat doen, indien is bewezen dat de
      deelnemer regelmatig toegang heeft tot internet. Het gegeven dat de deelnemer een e-mailadres opgeeft om zaken te
      kunnen doen geldt in ieder geval als bewijs hiervan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147f
  - number: 147g
    text: |-
      Een feeder-icbe vermeldt in alle door of namens haar verstrekt of beschikbaar gestelde relevante informatie dat zij
      ten minste 85 procent van haar beheerd vermogen belegt in rechten van deelneming in een master-icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147g
  - number: 147h.1
    text: |-
      Een feeder-icbe zendt een afschrift van het prospectus, het essentiële-informatiedocument respectievelijk de
      essentiële beleggersinformatie en alle wijzigingen daarin, het bestuursverslag en de halfjaarcijfers van de master-
      icbe waarin zij belegt aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147h
  - number: 147h.2
    text: |-
      Een feeder-icbe verstrekt haar deelnemers, op verzoek, kosteloos een afschrift van het prospectus, het
      bestuursverslag en halfjaarcijfers van de master-icbe waarin zij belegt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147h
  - number: 147i.1
    text: |-
      Het bestuursverslag van een feeder-icbe bevat een verklaring met betrekking tot de totale kosten van de feeder-icbe
      en de master-icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147i
  - number: 147i.2
    text: |-
      Het bestuursverslag en de halfjaarcijfers van een feeder-icbe vermelden de plaats waar het bestuursverslag en de
      halfjaarcijfers van de master-icbe waarin de feeder-icbe belegt, verkregen kunnen worden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147i
  - number: 147j
    text: |-
      Een feeder-icbe en de master-icbe waarin zij belegt, voorkomen dat hun deelnemers op verschillende tijdstippen
      worden geïnformeerd over de intrinsieke waarde van de deelnemingen door het treffen van maatregelen om het tijdstip
      van de berekening en de publicatie van de intrinsieke waarde te coördineren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147j
  - number: 147k
    text: |-
      Een feeder-icbe controleert de werkzaamheden van de master-icbe. Zij baseert zich hierbij op de informatie die is
      verstrekt door de master-icbe of diens beheerder, bewaarder of accountant tenzij de feeder-icbe reden heeft om te
      twijfelen aan de juistheid van deze informatie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147k
  - number: 147l
    text: |-
      Een beloning of vergoeding die een feeder-icbe, haar beheerder dan wel een derde die namens de feeder-icbe of haar
      beheerder optreedt, ontvangt in verband met de belegging in rechten van deelneming van een master-icbe, komt ten
      gunste van de activa van de feeder-icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147l
  - number: 147m.1
    text: |-
      Een master-icbe verstrekt de Autoriteit Financiële Markten onverwijld de naam van elke feeder-icbe die in haar
      rechten van deelneming belegt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147m
  - number: 147m.2
    text: |-
      Indien de feeder-icbe een zetel heeft in een andere lidstaat, stelt de Autoriteit Financiële Markten de
      toezichthoudende instantie van de lidstaat van de zetel van de feeder-icbe in kennis van de belegging, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147m
  - number: 147n
    text: |-
      Een master-icbe houdt alle informatie die zij ingevolge het recht, het fondsreglement of statuten beschikbaar moet
      houden, beschikbaar voor de feeder-icbe of, indien van toepassing, haar beheerder, en voor de Autoriteit Financiële
      Markten, de bewaarder en de accountant van de feeder-icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147n
  - number: 147o
    text: |-
      Een master-icbe brengt geen inschrijvingskosten of inkoopkosten in rekening voor het deelnemen van een feeder-icbe
      in haar rechten van deelneming of voor de vervreemding daarvan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147o
  - number: 147p.1
    text: |-
      Uiterlijk twee maanden na de datum van de bekendmaking van een voornemen tot liquidatie van de master-icbe
      als bedoeld in [artikel 4:61a, eerste lid, van de wet][ref1], zendt de feeder-icbe de volgende gegevens aan de
      Autoriteit Financiële Markten:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147p.1.a
    text: |-
      indien de feeder-icbe voornemens is ten minste 85 procent van haar beheerd vermogen te beleggen in rechten van
      deelneming in een andere master-icbe:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
  - number: 147p.1.a.1°
    text: een aanvraag van instemming voor het beleggen in rechten van deelneming in een andere master-icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
  - number: 147p.1.a.2°
    text: een aanvraag van instemming met de voorgestelde wijzigingen van het fondsreglement of statuten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
  - number: 147p.1.a.3°
    text: de wijzigingen van het prospectus en de essentiële beleggersinformatie; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
  - number: 147p.1.a.4°
    text: |-
      de documenten, bedoeld in [artikel 147a, derde lid, onderdelen c tot en met g][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147a
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147p.1.b
    text: 'indien de feeder-icbe voornemens is zich om te zetten in een icbe, niet zijnde een feeder-icbe:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
  - number: 147p.1.b.1°
    text: een aanvraag van instemming met de voorgestelde wijzigingen van het fondsreglement of de statuten; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
  - number: 147p.1.b.2°
    text: |-
      de wijzigingen van het prospectus en het essentiële-informatiedocument respectievelijk de essentiële
      beleggersinformatie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
  - number: 147p.1.c
    text: indien de feeder-icbe voornemens is om tot liquidatie over te gaan, een kennisgeving van dat voornemen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
  - number: 147p.2
    text: |-
      In afwijking van het eerste lid, zendt de feeder-icbe de gegevens, bedoeld in het eerste lid, uiterlijk binnen drie
      maanden voorafgaand aan de aanvang van de voorgenomen liquidatie van de master-icbe aan de Autoriteit Financiële
      Markten, indien de master-icbe de bekendmaking van het voornemen tot liquidatie meer dan vijf maanden voor de datum
      van de aanvang van de liquidatie aan de feeder-icbe heeft bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
  - number: 147p.3
    text: De feeder-icbe informeert haar deelnemers onverwijld over een voornemen tot liquidatie van de feeder-icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147p
  - number: 147q.1
    text: |-
      De Autoriteit Financiële Markten neemt binnen vijftien werkdagen na ontvangst van alle gegevens een besluit op een
      aanvraag van instemming als bedoeld in [artikel 147p, eerste lid, onderdeel a of b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147p
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147q
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147p
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147q.2
    text: |-
      De feeder-icbe informeert de master-icbe over een besluit van de Autoriteit Financiële Markten als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147q
  - number: 147q.3
    text: |-
      De feeder-icbe neemt na ontvangst van de instemming, bedoeld in
      [artikel 147p, eerste lid, onderdeel a, onder 1° en 2°][ref1], zo spoedig mogelijk maatregelen om aan het
      bepaalde in [artikel 147f][ref2] te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147p
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel147f
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147q
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147p
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 147f
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147q.4
    text: |-
      Uitbetaling van liquidatieopbrengsten van de master-icbe aan de feeder-icbe die plaatsvindt
      voorafgaand aan de datum waarop de feeder-icbe haar beleggingsbeleid overeenkomstig
      [artikel 147p, eerste lid, onderdeel a of b][ref1], wijzigt, behoeft instemming van de Autoriteit Financiële
      Markten. De Autoriteit Financiële Markten stemt in met de uitbetaling indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147p
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147q
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147p
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147q.4.a
    text: 'de feeder-icbe de uitbetaling van de liquidatieopbrengsten ontvangt:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147q
  - number: 147q.4.a.1°
    text: in contanten; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147q
  - number: 147q.4.a.2°
    text: |-
      in de vorm van een gehele of gedeeltelijke overdracht van activa in natura, indien de feeder-icbe dit wenst
      en voor zover de overeenkomst tot uitwisseling van informatie, bedoeld in [artikel 147b, eerste lid][ref1],
      onderscheidenlijk de bedrijfsvoeringsregels, bedoeld in artikel 147b, vierde lid, en het besluit tot liquidatie
      daarin voorzien; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147q
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147b
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147q.4.b
    text: de feeder-icbe de contanten uitsluitend herbelegd met het oog op een efficiënt contantenbeheer.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147q
  - number: 147q.5
    text: De feeder-icbe heeft het recht de overgedragen activa in natura geheel of gedeeltelijk te verzilveren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147q
  - number: 147r.1
    text: |-
      Binnen een maand nadat een feeder-icbe informatie met betrekking tot een voorgenomen fusie of splitsing van de
      master-icbe als bedoeld in [artikel 4:61b, derde lid, van de wet][ref1] heeft ontvangen, zendt de feeder-icbe de
      volgende gegevens aan de Autoriteit Financiële Markten:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147r.1.a
    text: |-
      indien de feeder-icbe voornemens is ten minste 85 procent van haar activa te beleggen in rechten van deelneming van
      dezelfde master-icbe:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.1.a.1°
    text: een aanvraag van instemming met het beleggen in rechten van deelneming in dezelfde master-icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.1.a.2°
    text: |-
      indien van toepassing, een aanvraag van instemming met de voorgestelde wijzigingen van het fondsreglement of
      statuten; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.1.a.3°
    text: |-
      indien van toepassing, de wijzigingen van het prospectus en het essentiële-informatiedocument respectievelijk de
      essentiële beleggersinformatie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.1.b
    text: |-
      indien de feeder-icbe voornemens is ten minste 85 procent van haar activa te beleggen in rechten van deelneming van
      een andere master-icbe:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.1.b.1°
    text: een aanvraag van instemming met het beleggen in rechten van deelneming in de desbetreffende master-icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.1.b.2°
    text: een aanvraag van instemming met de voorgestelde wijzigingen van het fondsreglement of statuten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.1.b.3°
    text: |-
      de wijzigingen van het prospectus en het essentiële-informatiedocument respectievelijk de essentiële
      beleggersinformatie; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.1.b.4°
    text: |-
      de documenten, bedoeld in [artikel 147a, derde lid, onderdelen c tot en met g][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147a
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147r.1.c
    text: 'indien de feeder-icbe voornemens is zich om te zetten in een icbe, niet zijnde een feeder-icbe:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.1.c.1°
    text: een aanvraag van instemming met de voorgestelde wijzigingen van het fondsreglement of de statuten; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.1.c.2°
    text: |-
      de wijzigingen van het prospectus en het essentiële-informatiedocument respectievelijk de essentiële
      beleggersinformatie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.1.d
    text: indien de feeder-icbe voornemens is om tot liquidatie over te gaan een kennisgeving van dat voornemen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.2
    text: 'Het eerste lid, aanhef en onderdeel a, is van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.2.a
    text: de master-icbe de verkrijgende master-icbe is bij een voorgenomen fusie; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.2.b
    text: |-
      de feeder-icbe een deelnemer wordt van een uit een splitsing voortkomende icbe die materieel niet afwijkt van de
      master-icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.3
    text: 'Het onder het eerste lid, aanhef en onderdeel b, is van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.3.a
    text: |-
      de master-icbe de verdwijnende icbe is en de feeder-icbe door de voorgenomen fusie een deelnemer wordt van de
      verkrijgende icbe; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.3.b
    text: |-
      de feeder-icbe een deelnemer wordt van een uit een splitsing voortkomende icbe die materieel afwijkt van de master-
      icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147r.4
    text: |-
      In afwijking van het eerste lid zendt de feeder-icbe de gegevens, bedoeld in het eerste lid, uiterlijk drie maanden
      voor de beoogde ingangsdatum van de fusie of splitsing van de master-icbe aan de Autoriteit Financiële Markten,
      indien de master-icbe de informatie, bedoeld in [artikel 4:61b, derde lid, van de wet][ref1], meer dan vier maanden
      voor de beoogde ingangsdatum van de fusie of splitsing aan de feeder-icbe heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147r.5
    text: De feeder-icbe informeert haar deelnemers en de master-icbe onverwijld over haar voornemen tot liquidatie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147r
  - number: 147s.1
    text: |-
      De Autoriteit Financiële Markten neemt binnen vijftien werkdagen na ontvangst van alle gegevens, een besluit op een
      aanvraag van instemming als bedoeld in [artikel 147r, eerste lid, onderdeel a, b of c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147r
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147s
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147r
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147s.2
    text: |-
      De feeder-icbe informeert de master-icbe over een besluit van de Autoriteit Financiële Markten als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147s
  - number: 147s.3
    text: |-
      De feeder-icbe neemt na ontvangst van de instemming op een aanvraag, als bedoeld in
      [artikel 147r, eerste lid, onderdeel b, onder 1° en 2°][ref1], zo spoedig mogelijk de maatregelen om aan het
      bepaalde in [artikel 147f][ref2] te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147r
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel147f
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147s
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147r
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 147f
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147s.4
    text: |-
      Indien de Autoriteit Financiële Markten nog geen besluit heeft genomen op een aanvraag van instemming als
      bedoeld in [artikel 147r, eerste lid, onderdeel b of c][ref1], biedt de feeder-icbe haar rechten van deelneming
      in de master-icbe ter inkoop of terugbetaling aan op grond van de [artikelen 4:61b, tweede lid][ref2], en
      [4:62h van de wet][ref3], op de werkdag voorafgaand aan de laatste dag waarop de feeder-icbe haar rechten van
      deelneming in de master-icbe ter inkoop of terugbetaling kan aanbieden.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147r
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147s
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147r
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147s.5
    text: |-
      De feeder-icbe biedt haar rechten van deelneming in de master-icbe op grond van het vierde lid
      tevens aan om te zorgen dat geen afbreuk wordt gedaan aan het recht van haar deelnemers, bedoeld in
      [artikel 147f, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147f
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147s
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147f
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147s.6
    text: |-
      Alvorens de feeder-icbe haar rechten van deelneming in een master-icbe op grond van het vierde lid ter inkoop of
      terugbetaling aanbiedt, onderzoekt zij alternatieve oplossingen die kunnen bijdragen de transactiekosten of andere
      negatieve effecten voor haar eigen deelnemers te vermijden of te verminderen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147s
  - number: 147s.7
    text: |-
      De feeder-icbe ontvangt opbrengsten van de inkoop of terugbetaling van haar rechten van deelneming in de master-
      icbe:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147s
  - number: 147s.7.a
    text: in contanten; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147s
  - number: 147s.7.b
    text: |-
      in de vorm van een gehele of gedeeltelijk overdracht van activa in natura, indien de feeder-icbe dit wenst en de
      overeenkomst tot uitwisseling van informatie, bedoeld in [artikel 147b, eerste lid][ref1], onderscheidenlijk de
      bedrijfsvoeringsregels, bedoeld in artikel 147b, vierde lid, daarin voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147s
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147b
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147s.8
    text: De feeder-icbe heeft het recht de overgedragen activa in natura geheel of gedeeltelijk te verzilveren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147s
  - number: 147s.9
    text: |-
      De Autoriteit Financiële Markten stemt in met het herbeleggen van contanten als bedoeld in het zevende lid
      voorafgaand aan de datum waarop de feeder-icbe in de nieuwe master-icbe of in overeenstemming met haar nieuwe
      beleggingsdoelstellingen en beleggingsbeleid zal gaan beleggen, indien de feeder-icbe uitsluitend herbelegd met het
      oog op een efficiënt contantenbeheer.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147s
  - number: 147t.1
    text: |-
      De bij de kennisgeving van de voorgenomen fusie te verstrekken gegevens, bedoeld in
      [artikel 4:62b, derde lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147t
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147t.1.a
    text: het door de betrokken icbe's goedgekeurde gemeenschappelijk fusievoorstel;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147t
  - number: 147t.1.b
    text: |-
      een actuele versie van het prospectus en het essentiële-informatiedocument respectievelijk de essentiële
      beleggersinformatie van de verkrijgende icbe indien deze haar zetel heeft in een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147t
  - number: 147t.1.c
    text: |-
      een verklaring van elk van de betrokken bewaarders van de icbe's waarin wordt bevestigd dat de in
      [artikel 147u, onderdelen a, f en g][ref1], bedoelde gegevens in overeenstemming zijn met het fondsreglement of de
      statuten van de desbetreffende icbe; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147u
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147t
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147u
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147t.1.d
    text: de informatie over de voorgenomen fusie die de betrokken icbe's aan hun deelnemers voornemens zijn te verstrekken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147t
  - number: 147t.2
    text: |-
      De gegevens, bedoeld in het eerste lid, worden verstrekt in de Nederlandse taal en, indien van toepassing, de
      officiële taal van de lidstaat van de zetel van de verkrijgende icbe of in een andere taal die door de Autoriteit
      Financiële Markten en de toezichthoudende instantie van de betrokken lidstaat is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147t
  - number: 147u
    text: |-
      Het gemeenschappelijk fusievoorstel, bedoeld in [artikel 4:62e, eerste lid, van de wet][ref1], bevat in ieder geval
      de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147u
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147u.a
    text: het soort fusie en de betrokken icbe's;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147u
  - number: 147u.b
    text: de achtergrond en redenen van de voorgenomen fusie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147u
  - number: 147u.c
    text: |-
      de verwachte gevolgen van de voorgenomen fusie voor de deelnemers van zowel de verdwijnende icbe als de
      verkrijgende icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147u
  - number: 147u.d
    text: de criteria die zijn vastgesteld voor de waardering van de activa, en indien van toepassing, de passiva;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147u
  - number: 147u.e
    text: de berekeningsmethode voor de ruilverhouding;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147u
  - number: 147u.f
    text: de beoogde ingangsdatum van de fusie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147u
  - number: 147u.g
    text: |-
      de regels die van toepassing zijn op de overdracht van activa, respectievelijk het omruilen van de rechten van
      deelneming in de verdwijnende icbe tegen rechten van deelneming in de verkrijgende icbe; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147u
  - number: 147u.h
    text: in geval van een nieuw op te richten icbe het fondsreglement of de statuten van die icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147u
  - number: 147v
    text: |-
      Een bewaarder van een verdwijnende icbe en de bewaarder van een verkrijgende icbe gaat na of de in het
      gemeenschappelijk fusievoorstel opgenomen gegevens, bedoeld in [artikel 147u, onderdelen a, f en g][ref1], in
      overeenstemming zijn met hetgeen ingevolge de wet is bepaald en met het fondsreglement of de statuten van de
      desbetreffende icbe.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147u
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147v
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147u
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147w.1
    text: |-
      De te verstrekken informatie over de voorgenomen fusie aan de deelnemers van de betrokken icbe's, bedoeld in
      [artikel 4:62g, vierde lid, van de wet][ref1]is beknopt en in niet-technische bewoordingen opgesteld en omvat in
      ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147w
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147w.1.a
    text: de achtergrond en redenen van de voorgenomen fusie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147w
  - number: 147w.1.b
    text: |-
      de verwachte gevolgen van de voorgenomen fusie voor de deelnemers, waaronder in elk geval de wezenlijke verschillen
      in beleggingsbeleid en beleggingsstrategie, de kosten, de verwachte resultaten, periodieke rapportage en mogelijke
      verwatering van de resultaten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147w
  - number: 147w.1.c
    text: de eventuele fiscale consequenties van de fusie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147w
  - number: 147w.1.d
    text: |-
      de bijzondere rechten van de deelnemers, waaronder in elk geval het recht op aanvullende informatie, het recht op
      een afschrift van het verslag van de accountant indien daarom wordt verzocht, het recht op het laten inkopen of
      laten terugbetalen van rechten van deelneming of zo mogelijk laten omzetten van hun rechten van deelneming in een
      andere icbe en tot welke datum de bijzondere rechten kunnen worden uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147w
  - number: 147w.1.e
    text: de relevante procedurele aspecten en de beoogde ingangsdatum van de fusie; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147w
  - number: 147w.1.f
    text: |-
      een afschrift van het actuele essentiële-informatiedocument of de actuele essentiële beleggersinformatie van de
      verkrijgende icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147w
  - number: 147w.2
    text: |-
      Het essentiële-informatiedocument respectievelijk de essentiële beleggersinformatie, bedoeld in het eerste
      lid, onderdeel f, wordt aan de deelnemers van de verdwijnende icbe verstrekt en wordt tevens aan de deelnemers
      van de verkrijgende icbe verstrekt indien het essentiële-informatiedocument respectievelijk de essentiële
      beleggersinformatie is gewijzigd met het oog op de voorgenomen fusie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147w
  - number: 147w.3
    text: |-
      Indien aan het begin van het document met informatie over de voorgenomen fusie een samenvatting van de hoofdpunten
      van het fusievoorstel wordt verstrekt, wordt verwezen naar de delen van het document waar nadere informatie over
      die hoofdpunten is opgenomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147w
  - number: 147w.4
    text: |-
      [Artikel 147f, zesde en zevende lid][ref1], is van overeenkomstige toepassing op het verstrekken van informatie
      over de voorgenomen fusie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147f
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147w
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147f
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147x.1
    text: |-
      De te verstrekken informatie, bedoeldin [artikel 147w, eerste lid, onderdeel b][ref1], aan de deelnemers van de
      verdwijnende icbe omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147w
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147x
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147w
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147x.1.a
    text: |-
      alle verschillen in de rechten van de deelnemers van de verdwijnende icbe voordat en nadat de voorgenomen fusie van
      kracht wordt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147x
  - number: 147x.1.b
    text: |-
      een vergelijking van de verschillen in risico-indicatoren indien in de essentiële beleggersinformatie van de
      verdwijnende icbe en de verkrijgende icbe risico-indicatoren in verschillende categorieën worden beschreven of in
      de begeleidende beschrijving op verschillende materiële risico’s wordt gewezen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147x
  - number: 147x.1.c
    text: |-
      een vergelijking van de kosten voor beide icbe’s op basis van de in de essentiële beleggersinformatie
      bekendgemaakte bedragen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147x
  - number: 147x.1.d
    text: |-
      indien de verdwijnende icbe een prestatievergoeding toepast, een toelichting op welke wijze deze zal worden
      toegepast totdat de fusie ingaat;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147x
  - number: 147x.1.e
    text: |-
      indien de verkrijgende icbe een prestatievergoeding toepast, een beschrijving op welke wijze deze verder zal worden
      toegepast om de eerlijke behandeling te waarborgen van de deelnemers die voorheen rechten van deelneming in de
      verdwijnende icbe bezaten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147x
  - number: 147x.1.f
    text: |-
      indien kosten in verband met de voorbereiding en afronding van de fusie bij de verdwijnende of verkrijgende icbe
      of bij een van de deelnemers ervan in rekening kunnen worden gebracht, een beschrijving hoe deze kosten worden
      toegewezen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147x
  - number: 147x.1.g
    text: |-
      een toelichting of de beheerder van de verdwijnende icbe voornemens is een herschikking van de portefeuille door te
      voeren voordat de fusie van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147x
  - number: 147x.2
    text: |-
      De aan de deelnemers van de verkrijgende icbe te verstrekken informatie, bedoeld in
      [artikel 147w, eerste lid, onderdeel b][ref1], omvat tevens een toelichting of de beheerder van de verkrijgende
      icbe verwacht dat de fusie enig materieel effect op de portefeuille van de verkrijgende icbe zal hebben en of het
      voornemen bestaat een herschikking van de portefeuille door te voeren voordat of nadat de fusie ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147w
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147x
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147w
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147y.1
    text: |-
      De te verstrekken informatie aan de deelnemers, bedoeldin [artikel 147w, eerste lid, onderdeel d][ref1],omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147w
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147y
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147w
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147y.1.a
    text: informatie over hoe zal worden omgegaan met alle nog te ontvangen inkomsten in de icbe's; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147y
  - number: 147y.1.b
    text: |-
      informatie op welke wijze het verslag van de accountant, bedoeld in [artikel 4:62f, tweede lid, van de wet][ref1],
      kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147y
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147y.2
    text: |-
      Indien het gemeenschappelijk fusievoorstel een bepaling omvat betreffende een bijbetaling als bedoeld in
      [artikel 4:62a, onderdeel a of b][ref1], wordt informatie verstrekt over de bijbetaling en onder meer over wanneer
      en op welke wijze deelnemers van de verdwijnende icbe de bijbetaling zullen ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147y
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147z.1
    text: |-
      De te verstrekken informatie aan de deelnemers, bedoeld in [artikel 147w, eerste lid, onderdeel e][ref1], omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147w
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147z
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147w
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147z.1.a
    text: |-
      indien van toepassing de procedure op grond waarvan de algemene vergadering zal worden gevraagd een besluit tot
      fusie te nemen en op welke wijze de deelnemers over het resultaat zullen worden geïnformeerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147z
  - number: 147z.1.b
    text: nadere informatie over een voorgenomen opschorting van de verhandeling van rechten van deelneming; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147z
  - number: 147z.1.c
    text: informatie over wanneer de fusie van kracht zal worden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147z
  - number: 147z.2
    text: |-
      Indien op grond van [artikel 317][ref1] of [330 van Boek 2 van het Burgerlijk Wetboek][ref2] een besluit tot fusie
      wordt genomen door de algemene vergadering, bevat de informatie aan de deelnemers een aanbeveling van de beheerder
      of van degenen die het dagelijks beleid bepalen van de maatschappij voor collectieve belegging in effecten zonder
      aparte beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel317
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel330
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147z
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '317'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '330'
  - number: 147aa
    text: |-
      Onverminderd de [artikelen 147w][ref1], [147x, eerste lid][ref2], [147y][ref3] en [147z][ref4] omvat de te
      verstrekken informatie over de voorgenomen fusie aan de deelnemers van de verdwijnende icbe tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147w
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel147x
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel147y
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel147z
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147aa
    references:
