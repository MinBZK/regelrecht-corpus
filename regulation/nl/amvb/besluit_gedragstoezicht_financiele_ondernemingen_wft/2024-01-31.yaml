  - number: 1a
    text: |-
      [Artikel 1:20, eerste lid, onderdeel f, van de wet][ref1] is van toepassing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1a.a
    text: |-
      een financiëledienstverlener die adviseert een krediet verleent voor de betaling van de advieskosten en
      distributiekosten gericht op het tot stand brengen van een overeenkomst inzake een financieel product als bedoeld
      in [artikel 86c][ref1] waarbij de consument of, indien het een verzekering betreft, de cliënt is gehouden binnen
      twee jaar af te lossen;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel86c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 86c
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 1a.b
    text: |-
      een financiëledienstverlener, voor zover hij niet adviseert, een krediet verleent aan een consument of, indien het
      een verzekering betreft, de cliënt ten behoeve van de betaling van de distributiekosten gericht op het tot stand
      brengen van een overeenkomst inzake een financieel product als bedoeld in [artikel 86c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel86c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 86c
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: '2.1'
    text: |-
      Het beleid van een houder van een ontheffing als bedoeld in [artikel 4:3, vierde lid, van de wet][ref1] wordt
      bepaald of mede bepaald door personen wier betrouwbaarheid buiten twijfel staat. Indien binnen de houder van een
      ontheffing een orgaan is belast met het toezicht op het beleid en de algemene gang van zaken van de houder van een
      ontheffing wordt dit toezicht gehouden door personen wier betrouwbaarheid buiten twijfel staat.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '2.2'
    text: |-
      De aanvrager van een ontheffing als bedoeld in [artikel 4:3, vierde lid, van de wet][ref1] toont aan dat zal worden
      voldaan aan het eerste lid en legt ten aanzien van de betrokken personen de volgende gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 2.2.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel2
  - number: 2.2.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel2
  - number: 2.2.c
    text: |-
      gegevens met betrekking tot de antecedenten, bedoeld in [artikel 13][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel13
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '13'
        hoofdstuk: '3'
  - number: 2.2.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel2
  - number: '2.3'
    text: |-
      De betrouwbaarheid van een persoon als bedoeld in het eerste lid staat buiten twijfel wanneer dat eenmaal door
      een toezichthouder voor de toepassing van de [wet][ref1] is vastgesteld, zolang niet een wijziging in de relevante
      feiten of omstandigheden een redelijke aanleiding geeft tot een nieuwe beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '2.4'
    text: |-
      Op de vaststelling van de betrouwbaarheid van de personen, bedoeld in het eerste lid, zijn de
      [artikelen 12 tot en met 16][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
  - number: '3.1'
    text: |-
      De houder van een ontheffing als bedoeld in [artikel 4:3, vierde lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 3.1.a
    text: |-
      informeert, alvorens een overeenkomst aan te gaan terzake van het als tussenpersoon verrichten van werkzaamheden
      ten behoeve van het van het publiek aantrekken of ter beschikking verkrijgen van opvorderbare gelden zijn
      wederpartij duidelijk en volledig over diens rechten en plichten met betrekking tot de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
  - number: 3.1.b
    text: |-
      meldt aan de Autoriteit Financiële Markten iedere wijzing in de gegevens die eerder door hemzelf of door
      een financiële onderneming aan een toezichthouder zijn verstrekt ten behoeve van de beoordeling van de
      ingevolge [artikel 2][ref1] gestelde eisen met betrekking tot de betrouwbaarheid van de personen, bedoeld in
      [artikel 2, eerste lid][ref2]. De houder meldt de wijziging schriftelijk en onverwijld nadat hij daarvan in het
      kader van de normale bedrijfsvoering kennis heeft genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 3.1.c
    text: |-
      meldt aan de Autoriteit Financiële Markten schriftelijk het voornemen tot wijziging van de personen, bedoeld in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '3.2'
    text: |-
      De houder van een ontheffing geeft geen uitvoering aan het voornemen, bedoeld in het eerste lid, onderdeel c,
      voordat de Autoriteit Financiële Markten heeft vastgesteld dat de betrouwbaarheid van de betrokken persoon buiten
      twijfel staat. De Autoriteit Financiële Markten neemt een besluit omtrent de betrouwbaarheid:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
  - number: 3.2.a
    text: binnen zes weken na ontvangst van de melding; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
  - number: 3.2.b
    text: |-
      indien de Autoriteit Financiële Markten binnen twee weken na ontvangst van de melding om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de melding.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
  - number: '3.3'
    text: |-
      Indien de Autoriteit Financiële Markten een derde verzoekt om nadere gegevens als bedoeld in het tweede lid,
      onderdeel b, doet zij daarvan mededeling aan de houder.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
  - number: '3.4'
    text: |-
      Bij de melding, bedoeld in het eerste lid, onderdeel c, legt de houder ten aanzien van de betrokken persoon de
      volgende gegevens over:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
  - number: 3.4.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, curriculum vitae, een opgave van de relevante geldige diploma's en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
  - number: 3.4.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
  - number: 3.4.c
    text: |-
      gegevens met betrekking tot de antecedenten, bedoeld in [artikel 13][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel13
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '13'
        hoofdstuk: '3'
  - number: 3.4.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
  - number: '3.5'
    text: |-
      Het vierde lid, onderdelen b, c en d, is niet van toepassing indien de wijziging een persoon betreft wiens
      betrouwbaarheid voor de toepassing van [artikel 2][ref1] door een toezichthouder reeds is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '4'
    text: |-
      De rechtspersoon, bedoeld in [artikel 4:5, tweede lid, van de wet][ref1] verstrekt bij de in dat lid bedoelde
      melding aan de Autoriteit Financiële Markten de volgende gegevens over de betrokken onderneming:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 4.a
    text: een opgave van de naam en het adres;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel4
  - number: 4.b
    text: een opgave van de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel4
  - number: 4.c
    text: |-
      indien de onderneming een rechtspersoon is: een opgave van de statutaire zetel, de statutaire naam en de
      handelsnaam of handelsnamen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel4
  - number: 4.d
    text: 'indien de onderneming is ingeschreven in het handelsregister: een opgave van het nummer van inschrijving.'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel4
  - number: '5'
    text: |-
      In deze paragraaf wordt verstaan onder: - *inkomensverzekering:* schadeverzekering ter dekking van het risico van
      financiële schade ten gevolge van arbeidsongeschiktheid of werkloosheid;
        - *pensioen:* 1°. pensioenverzekering; 2°. premiepensioenvordering; 3°. uitvoeringsovereenkomst als bedoeld in
      [artikel 1 van de Pensioenwet][ref1] tussen een werkgever en een uitvoerder van een algemeen pensioenfonds; 4°.
      vrijwillige aansluiting bij bedrijfstakpensioenfonds; of 5°. aankoop van een variabele of vaste uitkering uit
      een kapitaalovereenkomst als bedoeld in [artikel 1 van de Pensioenwet][ref2] of premieovereenkomst als bedoeld in
      artikel 1 van de Pensioenwet;
        - *schadeverzekering particulier:* schadeverzekering, niet zijnde een inkomensverzekering of een schadeverzekering
      zakelijk;
        - *schadeverzekering zakelijk:* schadeverzekering ten behoeve van een cliënt handelend in de uitoefening van zijn
      beroep of bedrijf, met uitzondering van een inkomensverzekering;
        - *vermogen:* levensverzekeringen, niet zijnde pensioenverzekeringen of producten als
      bedoeld in onderdeel 5° van de definitie van pensioen, en lijfrenterekeningen als bedoeld in
      [artikel 3.126a, eerste lid, van de Wet inkomstenbelasting 2001][ref3], spaarrekeningen eigen woning als
      bedoeld in [artikel 10bis.5, tweede lid, van de Wet inkomstenbelasting 2001][ref4], rechten van deelneming in
      beleggingsinstellingen voor zover vrijgesteld op grond van [artikel 2:104, eerste lid, van de wet][ref5] en
      beleggingsobjecten;
        - *zorgverzekering:* een schadeverzekering ten behoeve van een verzekeringsplichtige als bedoeld in
      [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref6] en een aanvullende ziektekostenverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel10bis
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
