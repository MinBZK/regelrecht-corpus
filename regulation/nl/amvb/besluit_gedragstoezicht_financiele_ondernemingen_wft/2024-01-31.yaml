        artikel: 147z
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147aa.a
    text: |-
      de termijn waarbinnen het inschrijven op of vragen om terugbetaling van rechten van deelneming in de verdwijnende
      icbe mogelijk blijft;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147aa
  - number: 147aa.b
    text: |-
      de termijn waarbinnen de deelnemers, die niet binnen de termijn gebruik hebben gemaakt van hun rechten op grond van
      [artikel 4:62h, van de wet][ref1], hun rechten als deelnemer van de verkrijgende icbe kunnen uitoefenen; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147aa
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147aa.c
    text: |-
      een toelichting dat indien een besluit tot fusie dient te worden genomen door de algemene vergadering van
      de verdwijnende icbe op grond van [artikel 317][ref1] of [330van Boek 2 van het Burgerlijk Wetboek][ref2]en
      het fusiebesluit met de vereiste meerderheid is genomen, de deelnemers die niet hebben gestemd, tegen het
      fusievoorstel hebben gestemd, of niet binnen de termijn gebruik hebben gemaakt van hun rechten op grond van
      [artikel 4:62h, van de wet][ref3], deelnemers worden van de verkrijgende icbe.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel317
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel330
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147aa
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '317'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '330'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147bb.1
    text: |-
      De aan de deelnemers van de verdwijnende icbe te verstrekken informatie over de voorgenomen fusie voldoet
      aan de behoeften van de deelnemers die geen voorafgaande kennis over de kenmerken en de bedrijfsvoering van
      de verkrijgende icbe hebben. De verdwijnende icbe wijst haar deelnemers op het essentiële-informatiedocument
      respectievelijk de essentiële beleggersinformatie van de verkrijgende icbe en benadrukt de wenselijkheid om die
      te lezen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147bb
  - number: 147bb.2
    text: |-
      De aan de deelnemers van de verkrijgende icbe te verstrekken informatie spitst zich toe op de voorgenomen fusie en
      de potentiële gevolgen daarvan voor de verkrijgende icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147bb
  - number: 147bb.3
    text: |-
      Bij een voorgenomen grensoverschrijdende fusie licht de icbe met zetel in Nederland in begrijpelijke taal alle
      termen en procedures betreffende de andere icbe toe die verschillen van die welke in Nederland worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147bb
  - number: 147cc
    text: |-
      Indien de informatie over de voorgenomen fusie, bedoeld in [artikel 147w][ref1], aan de deelnemers van de betrokken
      icbe's is verstrekt, wordt dezelfde informatie verstrekt tot de dag waarop de fusie van kracht wordt aan een ieder
      die rechten van deelneming in de verdwijnende of verkrijgende icbe aankoopt of daarop inschrijft of verzoekt om
      het fondsreglement of de statuten, het prospectus of essentiële-informatiedocument respectievelijk essentiële
      beleggersinformatie van een van de betrokken icbe's.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel147w
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147cc
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 147w
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147dd
    text: |-
      Indien de beheerder van een verdwijnende icbe of een verkrijgende icbe op grond van de [artikelen 2:123][ref1]
      en [2:124a van de wet][ref2] rechten van deelneming in een door hem beheerde icbe aanbiedt in een andere lidstaat
      verstrekt de desbetreffende icbe de informatie, bedoeld in [artikel 147w][ref3], aan haar deelnemers in de
      officiële taal van die andere lidstaat of in een door de toezichthoudende instantie van die andere lidstaat
      goedgekeurde taal.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel147w
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147dd
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 147w
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 147ee
    text: |-
      Een prime broker die optreedt als tegenpartij voor een beleggingsinstelling, mag niet optreden als bewaarder van
      die desbetreffende beleggingsinstelling tenzij hij zijn bewaartaken functioneel en hiërarchisch heeft gescheiden
      van zijn taken als prime broker en de mogelijke belangenconflicten afdoende worden geïdentificeerd, beheerd,
      gecontroleerd of medegedeeld aan de deelnemers in de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147ee
  - number: 147ff.1
    text: |-
      De taken van de bewaarder van een beleggingsinstelling als bedoeld in [artikel 4:62m, vierde lid, van de wet][ref1],
      omvatten in ieder geval de uitvoering van de ingevolge artikel 21, zevende, achtste, negende en zeventiende lid,
      onderdeel c, van de richtlijn beheerders van alternatieve beleggingsinstellingen bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147ff
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147ff.2
    text: |-
      De taken van de bewaarder van een icbe als bedoeld in [artikel 4:62m, vierde lid, van de wet][ref1] omvatten in
      ieder geval de uitvoering van de ingevolge artikel 22, derde tot en met vijfde lid, van de richtlijn instellingen
      voor collectieve belegging in effecten bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147ff
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147gg.1
    text: |-
      Een overeenkomst inzake bewaring als bedoeld in [artikel 4:62m, tweede lid, van de wet][ref1] tussen een
      Nederlandse beheerder van een beleggingsinstelling en een bewaarder voldoet aan de ingevolge artikel 21, tweede,
      twaalfde, dertiende, veertiende, vijftiende en zeventiende lid, van de richtlijn beheerders van alternatieve
      beleggingsinstellingen gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147gg
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147gg.2
    text: |-
      Een overeenkomst inzake bewaring als bedoeld in [artikel 4:62m, tweede lid, van de wet][ref1] tussen een beheerder
      van een icbe en een bewaarder voldoet aan de ingevolge de artikelen 22, tweede lid, en 26ter, onderdeel a, van de
      richtlijn instellingen voor collectieve belegging in effecten gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147gg
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147gg.3
    text: |-
      Verplichtingen tot vertrouwelijkheid die op de beheerder en de bewaarder bij de overeenkomst inzake bewaring van
      toepassing zijn, beperken niet de toegang van de toezichthouders of de toezichthoudende instantie van de lidstaat
      van de zetel van de beleggingsinstelling of icbe tot relevante informatie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147gg
  - number: 147hh
    text: |-
      Een entiteit die niet voldoet aan het bepaalde in [artikel 4:62n, eerste lid, van de wet][ref1] kan slechts als
      bewaarder van de beleggingsinstellingen, bedoeld in artikel 4:62n, tweede lid, van de wet optreden indien die
      entiteit:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147hh
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147hh.a
    text: de taken als bewaarder verricht in het kader van haar beroeps- of bedrijfsuitoefening; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147hh
  - number: 147hh.b
    text: |-
      in het kader van de in onderdeel a bedoelde beroeps- of bedrijfsuitoefening verplicht is zich in te schrijven in
      een wettelijk erkend beroepsregister of moet voldoen aan regelgeving inzake de beroepsmoraal.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147hh
  - number: 147ii.1
    text: |-
      Indien de bewaarder van een Nederlandse beleggingsinstelling aansprakelijkheid geheel of gedeeltelijk uitsluit als
      bedoeld in [artikel 4:62q, eerste lid, van de wet][ref1], wordt door de bewaarder voldaan aan artikel 21, dertiende
      lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147ii
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147ii.2
    text: |-
      Indien financiële instrumenten als bedoeld in [artikel 1:1 van de wet][ref1] in bewaring worden genomen in een
      staat die geen lidstaat is als bedoeld in [artikel 4:62q, tweede lid, van de wet][ref2], is de bewaarder niet
      aansprakelijk voor verlies van de financiële instrumenten, indien wordt voldaan aan de in artikel 21, veertiende
      lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen, gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147ii
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147jj
    text: |-
      Een bewaarder verstrekt de jaarrekening, het bestuursverslag en de overige gegevens, bedoeld in
      [artikel 4:62r, eerste lid, van de wet][ref1], wat de indeling en inhoud betreft, in de vorm waarin deze zijn
      opgemaakt krachtens [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2] of internationale jaarrekeningstandaarden
      aan de Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147jj
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003045
  - number: 147kk
    text: |-
      Een bewaarder van een master-icbe meldt aan de Autoriteit Financiële Markten in ieder geval de volgende
      onregelmatigheden op grond van [artikel 4:62v, eerste lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147kk
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 147kk.a
    text: fouten in de berekening van de intrinsieke waarde van de master-icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147kk
  - number: 147kk.b
    text: |-
      fouten in transacties voor afwikkeling van de aankoop van, inschrijving op, het verzoek om inkoop of terugbetaling
      van rechten van deelneming in de master-icbe door de feeder-icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147kk
  - number: 147kk.c
    text: |-
      door de master-icbe veroorzaakte fouten bij de betaling of kapitalisatie van inkomsten, of fouten in de berekening
      van de bronbelasting;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147kk
  - number: 147kk.d
    text: |-
      inbreuken op de beleggingsdoelstellingen, het beleggingsbeleid of de beleggingsstrategie van de master-icbe,
      zoals beschreven in haar fondsreglement of statuten, prospectus of essentiële-informatiedocument respectievelijk
      essentiële beleggersinformatie; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147kk
  - number: 147kk.e
    text: |-
      inbreuken op ingevolge de wet, het fondsreglement, de statuten, prospectus of essentiële-informatiedocument
      respectievelijk essentiële beleggersinformatie vastgestelde limieten bij beleggingen of het aangaan van leningen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147kk
  - number: 147ll
    text: |-
      De overeenkomst tot uitwisseling van informatie tussen de bewaarders, bedoeld in
      [artikel 4:62w, eerste lid, van de wet][ref1], bevat de gegevens, genoemd in [bijlage J][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel147ll
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
  - number: '148.1'
    text: |-
      De aanstelling van een schade-afhandelaar als bedoeld in [artikel 4:71, eerste lid, onderdeel e, van de wet][ref1]
      wordt niet beëindigd, tenzij de beëindiging gepaard gaat met de aanstelling van een opvolger.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '148.2'
    text: |-
      De schadeverzekeraar meldt de beëindiging van de aanstelling van de schade-afhandelaar binnen twee weken aan
      de Autoriteit Financiële Markten, onder overlegging van de akte van aanstelling van de opvolger van de schade-
      afhandelaar, waaruit diens naam, adres en bevoegdheden blijken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel148
  - number: '149.1'
    text: |-
      De schade-afhandelaar houdt van rechtswege op schade-afhandelaar te zijn vanaf de dag van het van toepassing
      verklaren van de schuldsaneringsregeling natuurlijke personen, de verlening van surséance van betaling, de
      faillietverklaring, de ontbinding, bedoeld in [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref1], de
      onderbewindstelling van één of meer goederen, bedoeld in [Titel 19 van Boek 1 van het Burgerlijk Wetboek][ref2], of
      de ondercuratelestelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002656
  - number: '149.2'
    text: |-
      De schadeverzekeraar meldt het overlijden, het van toepassing verklaren van de schuldsaneringsregeling
      natuurlijke personen, de surséance van betaling, de faillietverklaring, de ontbinding, bedoeld in
      [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref1], de onderbewindstelling van één of meer van de goederen,
      bedoeld in [Titel 19 van Boek 1 van het Burgerlijk Wetboek][ref2], of de ondercuratelestelling van de schade-
      afhandelaar binnen twee weken aan de Autoriteit Financiële Markten, onder overlegging van de akte van aanstelling
      van de opvolger van de schade-afhandelaar met ingang van de dag van het overlijden, het van toepassing verklaren
      van de schuldsaneringsregeling natuurlijke personen, de surséance van betaling, de faillietverklaring, de
      ontbinding, bedoeld in [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref3], de onderbewindstelling
      van één of meer van de goederen, bedoeld in [Titel 19 van Boek 1 van het Burgerlijk Wetboek][ref4], of de
      ondercuratelestelling. Uit de akte van aanstelling blijken de naam, het adres en de bevoegdheden van de opvolger
      van de schade-afhandelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0002656
  - number: '152'
    text: |-
      [Artikel 4:74, eerste lid, van de wet][ref1], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 152.a
    text: |-
      overeenkomsten inzake krediet waarvoor bij het aangaan hypothecaire zekerheid wordt verleend of inzake krediet
      waarvoor reeds hypothecaire zekerheid bestaat, indien het krediet wordt verleend tegen een voor hypothecaire
      kredieten van de betrokken aanbieder gebruikelijk jaarlijks kostenpercentage;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel152
  - number: 152.b
    text: |-
      overeenkomsten inzake krediet, voorzover het krediet wordt aangeboden tegen onderpand van effecten als bedoeld
      in onderdeel a, dan wel onderdeel b van de definitie van effect in [artikel 1:1 van de wet][ref1], die tot
      zekerheid dienen voor de terugbetaling van het krediet aan een consument die reeds op het moment van aangaan
      van de overeenkomst inzake krediet bezitter is van de te verpanden effecten als bedoeld in onderdeel a, dan
      wel onderdeel b van de definitie van effect in [artikel 1:1 van de wet][ref2], van welk krediet het totale
      kredietbedrag gedurende de looptijd van de overeenkomst inzake het krediet niet hoger is dan zeventig procent van
      de waarde van de te verpanden effecten, indien het effecten betreffen als bedoeld in onderdeel a van de definitie
      van effect in [artikel 1:1 van de wet][ref3], dan wel niet hoger is dan tachtig procent van de waarde van de
      te verpanden effecten, indien het effecten betreffen als bedoeld in onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref4], en:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 152.b.1°
    text: |-
      die effecten als bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref1], zijn toegelaten tot de handel op een gereglementeerde markt; of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 152.b.2°
    text: |-
      de waarde van die effecten als bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref1], door middel van een openbare prijsaanduiding voor een ieder kenbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '153.1'
    text: |-
      De [artikelen 154 tot en met 158][ref1] zijn uitsluitend van toepassing op het verlenen van financiële diensten met
      betrekking tot consumptief krediet.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel154
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '154'
        hoofdstuk: '11'
        afdeling: '11.1'
  - number: '153.2'
    text: |-
      Het in deze afdeling bepaalde met betrekking tot de verhouding tussen een aanbieder en een bemiddelaar is van
      overeenkomstige toepassing op de verhouding tussen een bemiddelaar en een onderbemiddelaar.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel153
  - number: '154'
    text: Een bemiddelaar heeft slechts aanspraak op provisie ter zake van tot stand gekomen overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel154
  - number: '155.1'
    text: |-
      Een bemiddelaar heeft alleen per maand gedurende de looptijd van een overeenkomst inzake krediet welke door zijn
      bemiddeling tot stand is gekomen aanspraak op provisie ten bedrage van een percentage van het uitstaand saldo ter
      zake van die overeenkomst, zoals dat saldo luidt op de laatste dag van de desbetreffende maand.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel155
  - number: '155.2'
    text: |-
      De aanbieder en bemiddelaar kunnen het ter zake van de bemiddeling overeengekomen provisiepercentage, met
      uitzondering van het provisiepercentage voor reeds tot stand gekomen overeenkomsten inzake krediet, niet zijnde
      doorlopend krediet, wijzigen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel155
  - number: 155.2.a
    text: een percentage telkens voor een aaneengesloten tijdvak van ten minste een maand wordt overeengekomen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel155
  - number: 155.2.b
    text: |-
      ten aanzien van reeds tot stand gekomen overeenkomsten het percentage telkens eerst na 24 maanden kan worden
      gewijzigd uitsluitend in het percentage dat tussen de aanbieder en de bemiddelaar voor nieuw af te sluiten
      overeenkomsten geldt op het tijdstip waarop de wijziging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel155
  - number: '156'
    text: |-
      Een bemiddelaar heeft over de periode waarin een consument ten minste twee maanden achterstallig is in de betaling
      van een vervallen termijnbedrag, geen aanspraak op provisie ter zake van de desbetreffende overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel156
  - number: '157.1'
    text: |-
      Met ingang van het tijdstip waarop een aanbieder het door een consument verschuldigde vervroegd opeist in een geval
      als bedoeld in [artikel 77, eerste lid, onder c, van Boek 7 van het Burgerlijk Wetboek][ref1], heeft de bemiddelaar
      geen aanspraak meer op provisie ter zake van de desbetreffende overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel77
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '77'
  - number: '157.2'
    text: |-
      Met ingang van het tijdstip waarop een overeenkomst van rechtswege wordt ontbonden op grond van
      [artikel 90, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1], heeft de bemiddelaar geen aanspraak meer op
      provisie ter zake van de desbetreffende overeenkomst, met dien verstande dat indien de ontbinding ongedaan wordt
      gemaakt op grond van [artikel 95, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref2], hij weer aanspraak
      heeft opprovisie over de periode gerekend vanaf het tijdstip waarop de ontbinding ongedaan is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel95
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '90'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '95'
  - number: '158.1'
    text: |-
      Een bemiddelaar krijgt geen provisie uitbetaald indien hij uit hoofde van dit besluit geen aanspraak heeft op
      provisie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel158
  - number: '158.2'
    text: Provisie wordt uitsluitend betaald in giraal geld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel158
  - number: '159.1'
    text: |-
      De beroepsaansprakelijkheidsverzekering, bedoeld in de [artikelen 4:75, eerste lid][ref1], en
      [4:74b, eerste lid, van de wet][ref2], dekt de aansprakelijkheid van de bemiddelaar wegens fouten, verzuimen of
      nalatigheden begaan in de uitoefening van diens beroep en voorgevallen op het grondgebied waarop de Overeenkomst
      betreffende de Europese Economische Ruimte van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '159.2'
    text: 'De beroepsaansprakelijkheidsverzekering wordt gesloten bij:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel159
  - number: 159.2.a
    text: |-
      een financiële onderneming die voor het uitoefenen van het bedrijf van schadeverzekeraar een door de Nederlandsche
      Bank verleende vergunning heeft voor de branche Algemene aansprakelijkheid; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel159
  - number: 159.2.b
    text: |-
      een financiële onderneming met zetel in een andere lidstaat die als schadeverzekeraar haar bedrijf mag uitoefenen
      vanuit een in Nederland gelegen bijkantoor of door middel van het verrichten van diensten naar Nederland.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel159
  - number: '160.1'
    text: |-
      Onder een vergelijkbare voorziening als bedoeld in de [artikelen 4:75, eerste lid][ref1], en
      [4:74b, eerste lid, van de wet][ref2] wordt verstaan een onvoorwaardelijke garantstelling voor alle verplichtingen
      voortvloeiend uit aansprakelijkheid van de bemiddelaar wegens fouten, verzuimen of nalatigheden, begaan in de
      uitoefening van diens beroep en voorgevallen op het grondgebied waarop de Overeenkomst betreffende de Europese
      Economische Ruimte van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '160.2'
    text: 'De onvoorwaardelijke garantstelling wordt verstrekt door:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel160
  - number: 160.2.a
    text: |-
      een financiële onderneming die voor het uitoefenen van het bedrijf van bank een door de Nederlandsche Bank
      verleende vergunning heeft;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel160
  - number: 160.2.b
    text: |-
      een financiële onderneming met zetel in een andere lidstaat die als bank haar bedrijf mag uitoefenen vanuit een in
      Nederland gelegen bijkantoor of door middel van het verrichten van diensten naar Nederland; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel160
  - number: 160.2.c
    text: |-
      een bank met zetel in de Verenigde Staten van Amerika, Japan, Australië, Canada of Zwitserland die in de staat van
      haar zetel onder toezicht staat.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel160
  - number: '161'
    text: |-
      De [artikelen 159][ref1] en [160][ref2] zijn van overeenkomstige toepassing op de
      beroepsaansprakelijkheidsverzekering en de vergelijkbare voorziening, bedoeld in
      [artikel 4:76, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel160
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '159'
        hoofdstuk: '11'
        afdeling: '11.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '160'
        hoofdstuk: '11'
        afdeling: '11.2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 161a.1
    text: |-
      De deelnemingscriteria van een afwikkelonderneming zijn erop gericht de veiligheid en efficiëntie voor de
      afwikkelonderneming en haar deelnemers te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel161a
  - number: 161a.2
    text: Een afwikkelonderneming ziet op permanente basis toe op de naleving van haar criteria voor deelneming.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel161a
  - number: 161a.3
    text: |-
      Een afwikkelonderneming heeft openbare procedures op grond waarvan de deelneming kan worden geschorst of beëindigd
      indien niet meer aan de deelnemingscriteria wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel161a
  - number: 161b
    text: |-
      Ten behoeve van het tijdig en efficiënt verlenen van diensten, bedoeld in [artikel 4:76b van de wet][ref1], heeft
      een afwikkelonderneming duidelijk omschreven doelen die meetbaar en haalbaar zijn met betrekking tot een minimaal
      dienstenniveau, risicobeheersingsverwachtingen en zakelijke prioriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel161b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 161c
    text: |-
      De afwikkelonderneming maakt gebruik van communicatieprocedures die een effectieve communicatie van informatie van
      de afwikkelonderneming en haar deelnemers mogelijk maken met behulp van gestandaardiseerde berichtverzending.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel161c
  - number: 161d
    text: |-
      Het inzicht, bedoeld in [artikel 4:76d, eerste lid, van de we][ref1]t dat een afwikkelonderneming biedt in
      de financiële risico’s en de kosten die zijn verbonden aan afwikkeldiensten, heeft betrekking op tarieven en
      basisgegevens over transactievolumes- en waarden en omvat een beschrijving van het gebruikte systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel161d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 161e
    text: |-
      De Autoriteit Financiële Markten kan ter uitvoering van internationaal aanvaarde standaarden nadere regels
      stellen met betrekking tot de toegang en de criteria voor deelneming op basis van risicogerelateerde eisen,
      de communicatieprocedures, de doelen die een afwikkelonderneming heeft ten behoeve van het tijdig en efficiënt
      verlenen van diensten, de communicatieprocedures en het inzicht dat een afwikkelonderneming biedt in de financiële
      risico’s en de kosten die zijn verbonden aan afwikkeldiensten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel161e
  - number: '162.1'
    text: |-
      Een clearinginstelling stelt een cliënt na afloop van elke handelsdag schriftelijk of langs elektronische weg in
      kennis van de aantallen en waarden van de financiële instrumenten die op zijn naam staan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel162
  - number: '162.2'
    text: |-
      Indien de waarde van de verplichtingen worden berekend overeenkomstig tussen de clearinginstelling en een cliënt
      overeengekomen parameters en de waarde van de financiële instrumenten van de cliënt onvoldoende dekking bieden ten
      opzichte van de door de cliënt aangegane verplichtingen, stelt de clearinginstelling de cliënt daar onverwijld van
      in kennis.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel162
  - number: '163.1'
    text: |-
      Een beleggingsonderneming met zetel in Nederland verstrekt de jaarrekening, het bestuursverslag en de overige
      gegevens, bedoeld in [artikel 4:85, eerste lid, van de wet][ref1], wat de indeling en inhoud betreft in de vorm
      waarin deze zijn opgemaakt krachtens [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2] of de internationale
      jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003045
  - number: '163.2'
    text: |-
      Een beleggingsonderneming met zetel in een staat die geen lidstaat is verstrekt de jaarrekening en het
      bestuursverslag, bedoeld in [artikel 4:85, vierde lid][ref1], wat de indeling en inhoud betreft in de vorm
      waarin deze zijn opgemaakt ingevolge het recht van de staat waar de beleggingsonderneming haar zetel heeft of de
      internationale jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '164'
    text: |-
      Een bijkantoor van een beleggingsonderneming met zetel in een staat die geen lidstaat is, waarvoor een vergunning
      is verleend op grond van [artikel 2:99a van de wet][ref1] verstrekt de Autoriteit Financiële Markten jaarlijks
      de gegevens bedoeld in artikel 41, derde lid, van de richtlijn markten voor financiële instrumenten 2014, met
      inachtneming van het zesde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: '165.1'
    text: 'Een beleggingsonderneming:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165
  - number: 165.1.a
    text: |-
      houdt alle gegevens en rekeningen bij die noodzakelijk zijn om haar op elk moment onmiddellijk in staat te stellen
      de financiële instrumenten en gelden die voor een cliënt worden aangehouden, te onderscheiden van voor andere
      cliënten aangehouden financiële instrumenten en gelden en hun eigen financiële instrumenten en gelden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165
  - number: 165.1.b
    text: |-
      houdt de onder a bedoelde gegevens en rekeningen op zodanige wijze bij dat deze altijd accuraat zijn en in elk
      geval de voor cliënten aangehouden financiële instrumenten en gelden weerspiegelen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165
  - number: 165.1.c
    text: |-
      gaat regelmatig na of de onder a bedoelde gegevens en rekeningen overeenstemmen met die van eventuele derden door
      wie deze financiële instrumenten en gelden worden aangehouden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165
  - number: 165.1.d
    text: |-
      draagt er zorg voor dat financiële instrumenten van cliënten die overeenkomstig [artikel 165a][ref1] bij een derde
      worden aangehouden, door middel van verschillend getitelde rekeningen in de boeken van de derde of door middel van
      andere vergelijkbare maatregelen waarmee hetzelfde beschermingsniveau wordt bereikt, kunnen worden onderscheiden
      van de financiële instrumenten die aan de beleggingsonderneming zelf toebehoren, en van de financiële instrumenten
      die aan de derde toebehoren;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel165a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 165a
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 165.1.e
    text: |-
      draagt er zorg voor dat de gelden van cliënten die overeenkomstig [artikel 165b][ref1] worden aangehouden op een
      rekening of rekeningen die kan of kunnen worden onderscheiden van alle rekeningen die worden gebruikt voor het
      aanhouden van gelden die aan de beleggingsonderneming zelf toebehoren;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel165b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 165b
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 165.1.f
    text: |-
      treft passende organisatorische maatregelen om het risico van verlies of vermindering van de financiële
      instrumenten en gelden van cliënten, dan wel van hun rechten daarop, als gevolg van misbruik van financiële
      instrumenten en gelden, fraude, wanbeheer, het bijhouden van ontoereikende gegevens of nalatigheid tot een minimum
      te beperken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165
  - number: '165.2'
    text: |-
      De Autoriteit Financiële Markten stelt regels met betrekking tot de maatregelen ter bescherming van de rechten
      van de cliënt en ter voorkoming van het gebruik van financiële instrumenten of gelden van de cliënt, bedoeld in
      [artikel 4:87, eerste en tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 165a.1
    text: |-
      Een beleggingsonderneming die financiële instrumenten voor een cliënt aanhoudt op een rekening bij een derde, past
      de nodige bekwaamheid, zorgvuldigheid en waakzaamheid toe bij de selectie, aanwijzing en periodieke beoordeling
      van de derde en van de regelingen voor het aanhouden en bewaren van de betrokken financiële instrumenten. De
      beleggingsonderneming houdt daarbij rekening met de deskundigheid en marktreputatie van de betrokken derde,
      evenals met alle op het aanhouden van deze financiële instrumenten betrekking hebbende wettelijke verplichtingen of
      marktpraktijken die de rechten van de cliënt nadelig kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165a
  - number: 165a.2
    text: |-
      Indien het bewaren van financiële instrumenten voor rekening van een andere persoon onderworpen is aan specifieke
      regelgeving in een rechtsgebied waar een beleggingsonderneming deze financiële instrumenten van cliënten bij een
      derde wil aanhouden, houdt de beleggingsonderneming deze financiële instrumenten niet aan in dat rechtsgebied bij
      een derde die niet aan het toezicht op de naleving van deze regels onderworpen is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165a
  - number: 165a.3
    text: |-
      Een beleggingsonderneming houdt financiële instrumenten niet voor een cliënt aan bij een derde in een staat die
      geen lidstaat is waar het aanhouden en bewaren van financiële instrumenten voor rekening van een andere persoon
      niet aan regels is gebonden, tenzij:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165a
  - number: 165a.3.a
    text: |-
      de aard van de financiële instrumenten of van de met deze instrumenten verband houdende beleggingsdiensten vereist
      dat ze worden aangehouden bij een derde in die staat; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165a
  - number: 165a.3.b
    text: |-
      indien het financiële instrumenten betreft die voor een professionele belegger worden aangehouden, deze aan de
      beleggingsonderneming schriftelijk heeft verzocht om ze in die staat bij een derde aan te houden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165a
  - number: 165b.1
    text: |-
      Een beleggingsonderneming die gelden van een cliënt ontvangt stort deze gelden onmiddellijk op een of meer
      rekeningen bij:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165b
  - number: 165b.1.a
    text: een centrale bank;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165b
  - number: 165b.1.b
    text: een bank waaraan een vergunning als bedoeld in de richtlijn kapitaalvereisten is verleend;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165b
  - number: 165b.1.c
    text: |-
      een bank waaraan in een staat die geen lidstaat is vergunning is verleend voor het uitoefenen van het bedrijf van
      bank;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165b
  - number: 165b.1.d
    text: een erkend geldmarktfonds indien de cliënt daarmee uitdrukkelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165b
  - number: 165b.2
    text: |-
      Het eerste lid is niet van toepassing op beleggingsondernemingen waaraan een vergunning is verleend voor het
      uitoefenen van het bedrijf van bank.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165b
  - number: 165b.3
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onderdeel d, wordt onder een erkend geldmarktfonds verstaan een
      erkend geldmarktfonds in de zin van artikel 1, vierde lid, van de gedelegeerde uitvoeringsrichtlijn markten voor
      financiële instrumenten 2014.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165b
  - number: 165b.4
    text: |-
      Indien de beleggingsonderneming gelden niet bij een centrale bank aanhoudt, past zij de nodige bekwaamheid,
      zorgvuldigheid en waakzaamheid toe bij de selectie, aanwijzing en periodieke beoordeling van de bank of het
      geldmarktfonds waar de gelden worden gestort, en van de regelingen voor het aanhouden van de desbetreffende gelden
      en de beoordeling van de behoefte aan diversificatie van deze gelden. De beleggingsonderneming houdt in elk geval
      rekening met de deskundigheid en de marktreputatie van de bank of het geldmarktfonds om de rechten van cliënten te
      beschermen, evenals met alle op het aanhouden van gelden van cliënten betrekking hebbende wettelijke verplichtingen
      of marktpraktijken die de rechten van de cliënt nadelig kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165b
  - number: 165b.5
    text: |-
      De beleggingsonderneming stort niet meer dan 20 procent van alle gelden bij een bank die of erkend geldmarktfonds
      dat deel uitmaakt van dezelfde groep als de beleggingsonderneming tenzij de beleggingsonderneming beoordeelt en
      kan aantonen dat gelet op de aard, omvang en complexiteit van de beleggingsonderneming, het geringe bedrag aan
      gelden die de beleggingsonderneming aanhoudt en de bescherming die de bank of het erkend geldmarktfonds biedt,
      dit voorschrift onevenredig is. De beleggingsonderneming stelt de Autoriteit Financiële Markten in kennis van deze
      beoordeling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165b
  - number: 165b.6
    text: |-
      De beleggingsonderneming evalueert periodiek de uitkomst van de beoordeling, bedoeld in het vijfde lid, en meldt
      wijzigingen aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165b
  - number: 165c.1
    text: |-
      Een beleggingsonderneming gaat geen overeenkomsten inzake effectenfinancieringstransacties aan met betrekking
      tot financiële instrumenten die zij voor een cliënt aanhoudt, en maakt ook niet anderszins gebruik van dergelijke
      financiële instrumenten voor eigen rekening of voor rekening van een andere cliënt van de onderneming, tenzij:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.1.a
    text: |-
      de cliënt vooraf uitdrukkelijk heeft ingestemd met het gebruik van de financiële instrumenten onder daarbij
      gespecificeerde voorwaarden, hetgeen wordt aangetoond door zijn handtekening; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.1.b
    text: |-
      de financiële instrumenten van deze cliënt uitsluitend worden gebruikt onder de gespecificeerde voorwaarden waarmee
      de cliënt heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.2
    text: |-
      Een beleggingsonderneming gaat geen overeenkomsten inzake effectenfinancieringstransacties aan met betrekking tot
      financiële instrumenten die zij voor een cliënt op een omnibusrekening bij een derde aanhoudt, en maakt ook niet
      anderszins gebruik van dergelijke financiële instrumenten voor eigen rekening of voor rekening van een andere
      cliënt, tenzij, onverminderd het eerste lid:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.2.a
    text: de cliënt vooraf uitdrukkelijk zijn instemming heeft verleend; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.2.b
    text: |-
      de beleggingsonderneming beschikt over systemen en controlemiddelen die waarborgen dat de betrokken financiële
      instrumenten toebehoren aan cliënten die vooraf uitdrukkelijk hun instemming hebben verleend. Op het verlenen van
      instemming is het eerste lid, onderdeel a, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.3
    text: |-
      De gegevens van de beleggingsonderneming omvatten bijzonderheden over de cliënt met wiens toestemming de financiële
      instrumenten zijn gebruikt, alsook het aantal gebruikte financiële instrumenten dat toebehoort aan elke cliënt die
      zijn instemming heeft verleend, teneinde eventuele verliezen op correcte wijze te kunnen toewijzen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.4
    text: |-
      De beleggingsonderneming neemt de volgende maatregelen om ongeoorloofd gebruik van financiële instrumenten voor
      eigen rekening of voor rekening van een andere cliënt van de onderneming te voorkomen:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.4.a
    text: |-
      het sluiten van een overeenkomst met de cliënt waarin is opgenomen welke maatregelen de beleggingsonderneming kan
      nemen indien de cliënt op de datum van afwikkeling onvoldoende voorzieningen op zijn rekening heeft;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.4.b
    text: |-
      het nauwlettend monitoren dat op de datum van afwikkeling daadwerkelijk kan worden geleverd en indien dit niet
      mogelijk is compenserende maatregelen te treffen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.4.c
    text: het nauwlettend monitoren en onverwijld opvragen van uitstaande effecten op de datum van afwikkeling en daarna.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.5
    text: |-
      De beleggingsonderneming treft maatregelen zodat de zekerheden die worden verschaft door degene aan wie financiële
      instrumenten van de cliënt worden uitgeleend passend zijn en ziet toe op de voortdurende passendheid van deze
      zekerheden en neemt indien nodig maatregelen om de zekerheden in evenwicht te houden met de waarde van de
      financiële instrumenten van de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165c.6
    text: |-
      Voor de toepassing van dit artikel wordt onder een effectenfinancieringstransactie verstaan een
      effectenfinancieringstransactie als bedoeld in artikel 3, onder 11, van de Verordening (EU) nr.
      2015/2365 van het Europees Parlement en de Raad van 25 november 2015 betreffende de transparantie van
      effectenfinancieringstransacties en van hergebruik en tot wijziging van Verordening (EU) nr. 648/2012 (PbEU 2015,
      L 337).
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165c
  - number: 165d
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:87, eerste en tweede lid, van de wet][ref1] die financiële
      instrumenten en gelden voor een cliënt onder zich houdt legt eenmaal per jaar aan de Autoriteit Financiële Markten
      een verslag over van een externe accountant over de deugdelijkheid van de in haar bedrijfsvoering getroffen
      maatregelen om te voldoen aan de [artikelen 165 tot en met 165f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel165
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '165'
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 165e.1
    text: |-
      Een zakelijk zekerheidsrecht, een voorrecht of een recht van verrekening op financiële instrumenten of gelden van
      cliënten die een derde in staat stelt financiële instrumenten of gelden van cliënten te vervreemden ter voldoening
      van vorderingen die geen betrekking hebben op de cliënt of op de dienstverlening aan de cliënt is niet toegestaan
      tenzij de financiële instrumenten of gelden worden aangehouden in een staat die geen lidstaat is waar dit wettelijk
      is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165e
  - number: 165e.2
    text: |-
      Een beleggingsonderneming informeert de cliënt over het bestaan en de voorwaarden van een zakelijk zekerheidsrecht,
      een voorrecht of een recht van verrekening als bedoeld in het eerste lid die een derde heeft gevestigd op
      financiële instrumenten of gelden van de cliënt alsmede over de risico’s die hieraan zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165e
  - number: 165e.3
    text: |-
      De beleggingsonderneming vermeldt in de overeenkomst met de cliënt, bedoeld in artikel 4:89, tweede lid, en in haar
      eigen administratie de vestiging van een zakelijk zekerheidsrecht, een voorrecht of recht van verrekening op de
      financiële instrumenten of gelden van een cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165e
  - number: 165f.1
    text: |-
      Een beleggingsonderneming onderzoekt en onderbouwt of een financiëlezekerheidsovereenkomst tot overdracht
      als bedoeld in [artikel 51, onderdeel b, van Boek 7 van het Burgerlijk Wetboek][ref1] passend is, gelet op
      de verplichtingen van de professionele belegger en de in aanmerking komende tegenpartij ten opzichte van de
      beleggingsonderneming in verhouding tot de activa die onder de financiële zekerheidsovereenkomst tot overdracht
      vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel51
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '51'
  - number: 165f.2
    text: 'Bij het onderzoek, bedoeld in het eerste lid, betrekt de beleggingsonderneming de volgende factoren:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165f
  - number: 165f.2.a
    text: |-
      of er een gering verband bestaat tussen de verplichtingen van de professionele belegger of de in aanmerking komende
      tegenpartij ten opzichte van de beleggingsonderneming en het gebruik van een financiële zekerheidsovereenkomst tot
      overdracht, waaronder de vraag of de aansprakelijkheid van de belegger ten aanzien van de beleggingsonderneming
      klein of verwaarloosbaar is;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165f
  - number: 165f.2.b
    text: |-
      of de waarde van de financiële instrumenten of gelden van de professionele belegger of in aanmerking
      komende tegenpartij die vallen onder de financiëlezekerheidsovereenkomst tot overdracht de verplichtingen
      van de professionele belegger respectievelijk de in aanmerking komende tegenpartij ten opzichte van de
      beleggingsonderneming ruim overschrijden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165f
  - number: 165f.2.c
    text: |-
      of financiële instrumenten of gelden van alle professionele beleggers of in aanmerking komende tegenpartijen
      onder een financiële zekerheidsovereenkomst tot overdracht vallen zonder rekening te houden met de aard van de
      verplichtingen van de individuele belegger ten opzichte van de beleggingsonderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165f
  - number: 165f.3
    text: |-
      De beleggingsonderneming informeert de professionele belegger of de in aanmerking komende tegenpartij over de
      risico’s en de gevolgen die het gebruik van een financiëlezekerheidsovereenkomst tot overdracht kunnen hebben voor
      zijn financiële instrumenten en gelden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165f
  - number: 165g
    text: |-
      In geval van het verlenen van surseance van betaling of in geval van faillissement van een beleggingsonderneming
      verstrekt de beleggingsonderneming de volgende informatie met betrekking tot financiële instrumenten en gelden
      van cliënten aan de toezichthouder en aan de rechter-commissaris, de bewindvoerder of de curator die ingevolge de
      [Faillissementswet][ref1] is benoemd:


      [ref1]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165g
    references:
      - id: ref1
        bwb_id: BWBR0001860
  - number: 165g.a
    text: |-
      rekeningen en relevante gegevens om het bedrag van financiële instrumenten en gelden die voor elke cliënt worden
      aangehouden te kunnen vaststellen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165g
  - number: 165g.b
    text: |-
      de rekeningen waarop de gelden van cliënten worden aangehouden op grond van [artikel 165b, eerste lid][ref1], en de
      overeenkomsten die zijn gesloten met de desbetreffende entiteiten;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel165b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165g
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 165b
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 165g.c
    text: |-
      gegevens over waar financiële instrumenten van cliënten worden aangehouden op grond van [artikel 165a][ref1], de
      rekeningen die door de beleggingsonderneming bij derden zijn geopend en de overeenkomsten die door haar met die
      derden zijn gesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel165a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165g
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 165a
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 165g.d
    text: |-
      een omschrijving van de werkzaamheden en de namen van de derden aan wie de beleggingsonderneming werkzaamheden
      heeft uitbesteed;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165g
  - number: 165g.e
    text: |-
      namen van personen binnen de beleggingsonderneming die betrokken zijn bij de procedures rondom het verlenen van
      de surseance van betaling of het faillissement en de personen die toezicht houden op het beschermen van de activa
      van cliënten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165g
  - number: 165g.f
    text: overeenkomsten die van belang zijn om de eigendom van de activa van cliënten vast te stellen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel165g
  - number: '166'
    text: |-
      Een vermogensbeheerder die tevens beheerder van een icbe met zetel in Nederland is, belegt in het kader van het
      beheer van een individueel vermogen de gelden van de cliënt niet geheel of gedeeltelijk in door hem beheerde
      beleggingsinstellingen of icbe’s zonder de voorafgaande schriftelijke toestemming van de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel166
  - number: '167'
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:88, tweede lid, van de wet][ref1], brengt de cliënt, indien
      een belangenconflict onvermijdelijk blijkt te zijn, hiervan door middel van een duurzame drager op de hoogte. De
      beleggingsonderneming vermeldt daarbij, met inachtneming van de kenmerken van de cliënt, voldoende bijzonderheden
      om deze in staat te stellen met kennis van zaken een beslissing te nemen ten aanzien van de beleggingsdienst,
      beleggingsactiviteit of nevendienst in verband waarmee het belangenconflict zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 167a
    text: |-
      Een financiëledienstverlener die verzekeringen met een beleggingscomponent aanbiedt of adviseert
      over of bemiddelt in verzekeringen met een beleggingscomponent voldoet ter voldoening aan de
      [artikelen 4:88, eerste en tweede lid][ref1], en [4:91q van de wet][ref2] aan de artikelen 3 tot en met 8 van de
      gedelegeerde verordening (EU) nr. 2017/2359 van de Commissie van 21 september 2017 tot aanvulling van [Richtlijn
      2016/97](32016L0097)/EU van het Europees Parlement en de Raad ten aanzien van informatievereisten en gedragsregels
      die van toepassing zijn op de distributie van verzekeringsgebaseerde beleggingsproducten (PbEU 2017, L 341).


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '168.1'
    text: |-
      In een overeenkomst als bedoeld in [artikel 4:89, tweede lid, van de wet][ref1] zijn ten minste bepaald:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 168.1.a
    text: |-
      de naar soort onderscheiden diensten die de beleggingsonderneming in het kader van de overeenkomst voor de cliënt
      zal verrichten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.1.b
    text: |-
      een specificatie van de eventuele beperkingen met betrekking tot de markten waarop transacties in financiële
      instrumenten ten behoeve van de cliënt zullen worden afgewikkeld;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.1.c
    text: |-
      de naar soort onderscheiden kosten, anders dan de kosten ter zake van een aanbieding van effecten als bedoeld in
      de prospectusverordening, die aan de cliënt in rekening worden gebracht alsmede de aan die kosten ten grondslag
      liggende berekening;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.1.d
    text: |-
      de wijze waarop instructies van de cliënt en berichten van de beleggingsonderneming worden verstrekt en
      geadministreerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.1.e
    text: de wijze waarop gelden of financiële instrumenten van de cliënt worden verrekend, gedeponeerd en geadministreerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.1.f
    text: de wijze waarop over de rekeningen van de cliënt kan worden beschikt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.1.g
    text: |-
      de regeling van de aansprakelijkheid van de beleggingsonderneming onderscheidenlijk de cliënt uit hoofde van de
      overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.1.h
    text: |-
      een verklaring van de cliënt dat hij heeft kennis genomen van de informatie die de beleggingsonderneming krachtens
      dit besluit aan hem dient te verstrekken en dat hij zich bewust is van de risico’s die aan de belegging zijn
      verbonden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.1.i
    text: het toepasselijke recht en de wijze van beslechting van geschillen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.1.j
    text: |-
      de omstandigheden waaronder de overeenkomst tussen de beleggingsonderneming en de cliënt een einde neemt, de
      omstandigheden waaronder de overeenkomst kan worden ontbonden en de wijze waarop op of na de datum van beëindiging
      nog lopende transacties worden afgewikkeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: '168.2'
    text: 'Indien de overeenkomst betrekking heeft op individueel vermogensbeheer is daarin tevens bepaald:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.2.a
    text: |-
      de samenstelling van het beheerde vermogen naar soort financieel instrument en de waarde van het te beheren
      vermogen ten tijde van het sluiten van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.2.b
    text: de doelstellingen van de cliënt ter zake van het vermogensbeheer;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.2.c
    text: |-
      een specificatie van de eventuele kwalitatieve en kwantitatieve beperkingen ten aanzien van de financiële
      instrumenten of categorieën van financiële instrumenten waarin mag worden belegd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.2.d
    text: |-
      de wijze waarop het beheer wordt gevoerd alsmede de betrokkenheid van de cliënt daarbij, daaronder een regeling van
      de machtiging aan de beleggingsonderneming; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168.2.e
    text: de frequentie van rapportage aan de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168
  - number: 168a.1
    text: |-
      Een beleggingsonderneming verschaft of ontvangt, rechtstreeks of middellijk, geen provisie met betrekking tot het
      verlenen van een beleggingsdienst of nevendienst aan een niet-professionele belegger.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.2.a
    text: provisies die rechtstreeks worden verschaft door de cliënt of degene die namens hem optreedt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.2.b
    text: |-
      provisies die noodzakelijk zijn voor het verlenen van de betreffende dienst of de betreffende dienst mogelijk
      maken;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.2.c
    text: |-
      provisies voor het verlenen van een beleggingsdienst als bedoeld in de onderdelen e en f van de definitie van
      verlenen van een beleggingsdienst in [artikel 1:1 van de wet][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 168a.2.c.1°
    text: |-
      de cliënt op uitvoerige, accurate en begrijpelijke wijze mededeling wordt gedaan van het bestaan, de aard en het
      bedrag, of indien het bedrag niet kan worden achterhaald, de wijze van berekening daarvan, van de provisie voordat
      de desbetreffende dienst wordt verleend;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.2.c.2°
    text: |-
      de provisie de kwaliteit van de desbetreffende dienst ten goede komt als bedoeld in artikel 11, tweede lid, van de
      gedelegeerde uitvoeringsrichtlijn markten voor financiële instrumenten 2014 en wordt voldaan aan artikel 11, vierde
      lid, van die gedelegeerde uitvoeringsrichtlijn; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.2.c.3°
    text: |-
      de provisie niet leidt tot belangenconflicten en geen afbreuk doet aan de verplichting van de beleggingsonderneming
      om zich in te zetten voor de belangen van de niet-professionele belegger;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.2.d
    text: |-
      provisies die worden verschaft door een beleggingsonderneming aan een door die beleggingsonderneming met
      inachtneming van [artikel 2:97, vijfde lid, van de wet][ref1] aangemelde verbonden agent dan wel provisies die door
      die verbonden agent aan de betrokken beleggingsonderneming worden verschaft;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 168a.2.e
    text: |-
      kleine niet-geldelijke provisies mits de belegger hierover duidelijk is geïnformeerd voordat de desbetreffende
      dienst wordt verleend.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.3
    text: 'Voor de toepassing van het tweede lid, onderdeel e, wordt onder kleine niet-geldelijke provisie verstaan:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.3.a
    text: |-
      een kleine niet-geldelijke provisie als bedoeld in artikel 12, derde lid, onderdelen a tot en met d, van de
      gedelegeerde uitvoeringsrichtlijn markten voor financiële instrumenten 2014;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.3.b
    text: 'een proefperiode met betrekking tot onderzoek op beleggingsgebied indien:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.3.b.1°
    text: |-
      de proefperiode is overeengekomen voordat de beleggingsonderneming heeft aangegeven een overeenkomst met betrekking
      tot onderzoek op beleggingsgebied te willen aangaan waarvoor een vergoeding in rekening wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.3.b.2°
    text: |-
      voor aanvang van de proefperiode de reikwijdte en omvang van de onderzoeken op beleggingsgebied tijdens de
      proefperiode worden overeengekomen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.3.b.3°
    text: de duur van de proefperiode vooraf is vastgesteld en maximaal drie maanden bedraagt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.3.b.4°
    text: |-
      de proefperiode niet binnen twaalf maanden aanvangt na afloop van een eerder afgesloten contract of een eerder
      overeengekomen proefperiode bij dezelfde aanbieder van onderzoeken op beleggingsgebied; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.3.b.5°
    text: geen geldelijke of niet-geldelijke verplichtingen verbonden zijn aan de proefperiode.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.4
    text: |-
      Indien onderzoek op beleggingsgebied voldoet aan artikel 13 van de gedelegeerde uitvoeringsrichtlijn markten voor
      financiële instrumenten 2014 kwalificeert het onderzoek niet als provisie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168a.5
    text: |-
      Indien de beleggingsonderneming de niet-professionele belegger mededeling heeft gedaan van de wijze van berekening
      van de provisie als bedoeld in het tweede lid, onderdeel c, onder 1°, deelt de beleggingsonderneming het bedrag van
      de provisie mede aan de niet-professionele belegger op het moment dat het bedrag van de ontvangen provisie bekend
      is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168a
  - number: 168aa.1
    text: |-
      Een beleggingsonderneming die van een derde rechtstreeks of middellijk provisies ontvangt met betrekking tot het
      verlenen van een beleggingsdienst of nevendienst aan een professionele belegger geeft de ontvangen geldelijke
      provisie in zijn geheel door aan de desbetreffende professionele belegger.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
  - number: 168aa.2
    text: |-
      De beleggingsonderneming verschaft aan of ontvangt van een derde geen niet-geldelijke provisies met betrekking
      tot het verlenen van een beleggingsdienst of nevendienst aan een professionele belegger, tenzij sprake is van een
      kleine niet-geldelijke provisie als bedoeld in [artikel 168a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel168a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 168a
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 168aa.3
    text: |-
      De beleggingsonderneming ontwikkelt een beleid dat erop is gericht provisies die zijn ontvangen van een derde aan
      elke individuele professionele belegger toe te wijzen en door te geven en informeert de professionele belegger
      op uitvoerige, accurate en begrijpelijke wijze over het bestaan, de aard en het bedrag, of indien het bedrag niet
      kan worden achterhaald, de wijze van berekening daarvan, van de provisie voordat de desbetreffende dienst wordt
      verleend en de mechanismen voor het doorgeven van de provisie aan de professionele belegger.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
  - number: 168aa.4
    text: |-
      De beleggingsonderneming informeert de professionele belegger ten minste jaarlijks op individuele basis over de
      aard en het bedrag van de doorgegeven provisies.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
  - number: 168aa.5
    text: 'Het eerste tot en met vierde lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
  - number: 168aa.5.a
    text: |-
      ontvangen provisies voor afhankelijk advies, het verlenen van een andere beleggingsdienst dan het beheren van een
      individueel vermogen zonder daarbij tevens te adviseren en het in dit verband verlenen van een nevendienst, indien:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
  - number: 168aa.5.a.1°
    text: |-
      de professionele belegger op uitvoerige, accurate en begrijpelijke wijze mededeling wordt gedaan van het bestaan,
      de aard en het bedrag, of indien het bedrag niet kan worden achterhaald, de wijze van berekening daarvan, van de
      provisie voordat de desbetreffende dienst wordt verleend en jaarlijks indien voortdurend provisies worden ontvangen
      met betrekking tot de desbetreffende dienst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
  - number: 168aa.5.a.2°
    text: |-
      de provisie de kwaliteit van de desbetreffende dienst ten goede komt als bedoeld in artikel 11, tweede lid, van de
      gedelegeerde uitvoeringsrichtlijn markten voor financiële instrumenten 2014 en wordt voldaan aan artikel 11, vierde
      lid, van die gedelegeerde uitvoeringsrichtlijn;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
  - number: 168aa.5.a.3°
    text: |-
      de provisie niet leidt tot belangenconflicten en geen afbreuk doet aan de verplichting van de beleggingsonderneming
      om zich in te zetten voor de belangen van de professionele belegger; b. ontvangen provisies als bedoeld in
      [artikel 168a, tweede lid, onderdelen a, b, d en f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel168a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 168a
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 168aa.6
    text: |-
      Het vijfde lid is van overeenkomstige toepassing op het verschaffen van provisies door een beleggingsonderneming
      aan een derde in het kader van het verlenen van een beleggingsdienst of daarmee verband houdende nevendienst aan
      een professionele belegger.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
  - number: 168aa.7
    text: |-
      Indien onderzoek op beleggingsgebied voldoet aan artikel 24, lid 9a, van de richtlijn markten voor financiële
      instrumenten 2014 of artikel 13 van de gedelegeerde uitvoeringsrichtlijn markten voor financiële instrumenten 2014
      kwalificeert het onderzoek niet als provisie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
  - number: 168aa.8
    text: |-
      Indien de beleggingsonderneming de professionele belegger heeft geïnformeerd over de wijze van berekening van de
      provisie, bedoeld in het tweede en vierde lid, onderdeel a, onder 1°, deelt de beleggingsonderneming het bedrag van
      de provisie mede aan de professionele belegger op het moment dat het bedrag van de ontvangen provisie bekend is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168aa
  - number: 168ab.1
    text: |-
      [Artikel 168a][ref1] is niet van toepassing op het verlenen van beleggingsdiensten of nevendiensten met betrekking
      tot transacties in financiële instrumenten, niet zijnde rechten van deelneming in een beleggingsinstelling of icbe
      die op verzoek van de deelnemers ten laste van de activa direct of indirect worden ingekocht of terugbetaald, die
      voor 1 januari 2014 zijn verricht. Op de bedoelde diensten blijft artikel 168a zoals dat luidde op 31 december 2013
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel168a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168ab
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 168a
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 168ac
    text: |-
      Beleggingsondernemingen die op of na 3 januari 2018 provisies ontvangen of verschaffen met betrekking tot
      beleggingsdiensten of nevendiensten aan professionele beleggers die voor 3 januari 2018 zijn verleend, hoeven die
      provisies niet op grond van [artikel 168aa][ref1] door te geven aan professionele beleggers.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel168aa
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168ac
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 168aa
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 168b
    text: |-
      Een overeenkomst als bedoeld in [artikel 4:71c, eerste lid, van de wet][ref1], bepaalt, voor zover van toepassing,
      in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 168b.a
    text: 'ten aanzien van de verschuldigde premie:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.a.1°
    text: het bedrag van de verschuldigde premie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.a.2°
    text: de wijze waarop en de termijnen waarin de verschuldigde premie wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.a.3°
    text: de procedures die gelden bij het niet nakomen van premiebetalingsverplichtingen door de bijdragende onderneming;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.b
    text: 'ten aanzien van de kosten:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.b.1°
    text: het bedrag van de totale kosten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.b.2°
    text: |-
      de kosten die worden ingehouden op de premie, onderverdeeld naar soorten kosten, zoals in elk geval de eerste
      kosten, de doorlopende kosten en de aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.b.3°
    text: |-
      de kosten die worden ingehouden op de vermogensopbouw of uitkering, onderverdeeld naar soorten kosten, zoals in elk
      geval de eerste kosten, de doorlopende kosten en de aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.b.4°
    text: |-
      de invloed van het gemiddelde jaarlijkse percentage van de kosten, bedoeld onder 2° en 3°, op het rendement, de
      vermogensopbouw of uitkering, verbonden aan de overeenkomst; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.b.5°
    text: de wijze waarop de kosten, bedoeld onder 2° en 3°, worden verdeeld over de looptijd van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.c
    text: |-
      de informatie die de bijdragende onderneming verstrekt aan de premiepensioeninstelling en de wijze waarop deze
      informatie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.d
    text: |-
      de informatie die de premiepensioeninstelling verstrekt aan de bijdragende onderneming, pensioendeelnemers en
      pensioengerechtigden en de wijze waarop deze informatie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.e
    text: de door de premiepensioeninstelling in acht te nemen beleggingsbeginselen en beleggingsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.f
    text: |-
      of, en onder welke voorwaarden pensioendeelnemers wordt toegestaan de verantwoordelijkheid voor beleggingen over
      te nemen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.g
    text: de voorwaarden die gelden voor inbreng en overdracht van waarden van opgebouwde pensioenaanspraken;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.h
    text: de wijze waarop sterftewinsten worden toebedeeld;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.i
    text: |-
      de criteria die de premiepensioeninstelling hanteert bij de keuze van een derde voor de inkoop van een
      pensioenuitkering;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.j
    text: |-
      of de premiepensioeninstelling een dekking tegen biometrische risico’s of garanties zal betrekken van een derde en,
      indien relevant, de criteria die zij zal hanteren bij de keuze van een derde;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.k
    text: de voorwaarden die gelden bij beëindiging van de overeenkomst; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168b.l
    text: het toepasselijke recht en de wijze van beslechting van geschillen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168b
  - number: 168c
    text: |-
      Een overeenkomst als bedoeld in [artikel 4:71c, tweede lid, van de wet][ref1], bepaalt in ieder geval dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 168c.a
    text: |-
      de premiepensioeninstelling en de pensioenbewaarder in het belang van de pensioendeelnemers en pensioengerechtigden
      optreden en hun taken betrouwbaar, eerlijk, professioneel en, onverminderd het bepaalde in onderdeel b,
      onafhankelijk uitvoeren;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168c
  - number: 168c.b
    text: |-
      over het in bewaring gegeven pensioenvermogen slechts kan worden beschikt door de premiepensioeninstelling en de
      pensioenbewaarder tezamen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168c
  - number: 168c.c
    text: |-
      de pensioenbewaarder het in bewaring gegeven pensioenvermogen slechts afgeeft tegen ontvangst van een verklaring
      van de premiepensioeninstelling waaruit blijkt dat afgifte wordt verlangd in verband met de regelmatige uitoefening
      van het bedrijf van premiepensioeninstelling;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168c
  - number: 168c.d
    text: |-
      de pensioenbewaarder volgens het recht van de staat waar de premiepensioeninstelling haar zetel heeft jegens
      de premiepensioeninstelling, de pensioendeelnemers en de pensioengerechtigden aansprakelijk is voor door hen
      geleden schade voorzover de schade het gevolg is van verwijtbare niet-nakoming of gebrekkige nakoming van zijn
      verplichtingen, ook indien de pensioenbewaarder het bij hem in bewaring gegeven pensioenvermogen geheel of
      gedeeltelijk aan een derde heeft toevertrouwd; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168c
  - number: 168c.e
    text: |-
      de premiepensioeninstelling aan de pensioenbewaarder de informatie verstrekt die hij nodig heeft ter uitvoering van
      zijn wettelijke taken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168c
  - number: 168d.1
    text: |-
      Op houders van een ontheffing als bedoeld in [artikel 4:3, vierde lid, van de wet][ref1] voor het als tussenpersoon
      verrichten van werkzaamheden ten behoeve van een publiekslening blijven gedurende de termijn, bedoeld in artikel 1
      van Gedelegeerde [Verordening (EU) 2022/1988](31988R2022) van de Commissie van 12 juli 2022 tot verlenging van de
      overgangsperiode voor het blijven verlenen van crowdfundingdiensten overeenkomstig nationaal recht als bedoeld in
      artikel 48, lid 1, van [Verordening (EU) 2020/1503](33403R2020) van het Europees Parlement en de Raad (PbEU 2022,
      L 273) de artikelen 2a tot en met 2c, 3 en 168a, zoals die luidden onmiddellijk voorafgaand aan het tijdstip waarop
      het Uitvoeringsbesluit verordening Europese crowdfundingdienstverleners voor bedrijven in werking is getreden,
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 168d.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder publiekslening verstaan: het anders dan in de uitoefening
      van het bedrijf van bank en anders dan door het aanbieden van effecten aantrekken of ter beschikking krijgen
      van opvorderbare gelden van het publiek voor een specifiek bestedingsdoel dat voorafgaand aan het publiek is
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel168d
  - number: '169'
    text: |-
      [Artikel 3, eerste lid, aanhef en onderdeel a][ref1], is niet van toepassing op houders van een ontheffing als
      bedoeld in [artikel 4:3, vierde lid, van de wet][ref2] die is verleend voor 15 september 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '170'
    text: |-
      Tot 1 oktober 2007 is [artikel 6][ref1] niet van toepassing op financiëledienstverleners die niet bemiddelen
      in verzekeringen, optreden als gevolmachtigde agent of optreden als ondergevolmachtigde agent, voorzover zij op
      1 januari 2006 niet voldeden aan [artikel 17 van het Besluit financiële dienstverlening][ref2] en aannemelijk
      kunnen maken dat zij vanaf 1 oktober 2007 wel zullen voldoen aan [artikel 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019283#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0019283
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '171.1'
    text: |-
      Een financiëledienstverlener die onmiddellijk voorafgaand aan de inwerkingtreding van
      [artikel I, onderdeel E, van het Wijzigingsbesluit financiële markten 2013][ref1], over een vergunning beschikte
      en op dat moment voldeed aan [artikel 4:9, tweede lid, van de wet][ref2], behoeft gedurende een termijn van 36
      maanden, gerekend vanaf de dag waarop genoemd artikel I, onderdeel E, in werking treedt, niet te voldoen aan
      [artikel 6, eerste lid, onderdeel b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032731#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0032731
        artikel: I
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '171.2'
    text: |-
      Een financiëledienstverlener die binnen zes maanden, gerekend vanaf de dag waarop
      [artikel I, onderdeel E, van het Wijzigingsbesluit][ref1], in werking treedt, een vergunning heeft aangevraagd,
      behoeft gedurende die zes maanden niet te voldoen aan [artikel 6, eerste lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032731#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0032731
        artikel: I
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '171.3'
    text: |-
      Een financiëledienstverlener als bedoeld in het tweede lid die werknemers en andere natuurlijke personen als bedoeld
      in [artikel 6, eerste lid, onderdeel b][ref1], in dienst heeft, behoeft gedurende een termijn van 36 maanden,
      gerekend vanaf de dag waarop [artikel I, onderdeel E, van het Wijzigingsbesluit financiële markten 2013][ref2],
      in werking treedt, niet te voldoen aan artikel 6, eerste lid, onderdeel b, voor zover die personen op de dag
      voorafgaand aan de inwerkingtreding van genoemd artikel I, onderdeel E, over een geldig diploma of geldige
      erkenning van beroepskwalificaties beschikten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0032731#ArtikelI
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0032731
        artikel: I
  - number: '171.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de gelijkstelling van reeds bestaande
      diploma’s met diploma’s als bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel7
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '172'
    text: |-
      [Artikel 28, tweede lid][ref1], is niet van toepassing ten aanzien van personen die zich op 1 januari 2006 reeds
      onder de verantwoordelijkheid van de financiëledienstverlener, bedoeld in het [eerste lid van dat artikel][ref2],
      rechtstreeks bezighielden met het verlenen van financiële diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel28
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 173a
    text: |-
      [Artikel 32][ref1] is niet van toepassing op financiële producten ter zake waarvan na 31 december 2012 geen nieuwe
      overeenkomsten worden aangegaan met een consument of, indien het een verzekering betreft, een cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel32
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel173a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '175'
    text: |-
      De [artikelen 153 tot en met 157][ref1] zijn niet van toepassing op overeenkomsten inzake krediet, niet zijnde
      doorlopend krediet, die zijn afgesloten voor 1 januari 1992.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel153
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '153'
        hoofdstuk: '11'
        afdeling: '11.1'
  - number: '176'
    text: |-
      De [artikelen 122, eerste lid, aanhef en onderdeel g][ref1], [123, eerste lid, aanhef en onderdeel m][ref2], en
      [124, eerste lid, aanhef en onderdeel j][ref3], zijn van toepassing met ingang van het boekjaar dat aanvangt op of
      na het tijdstip van inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel123
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel124
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '122'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '123'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '124'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 176a
    text: |-
      Een wijziging van de richtlijn betaalrekeningen gaat voor de toepassing van de
      [artikelen 59e, onderdelen aa en ab][ref1], [71h, tweede lid][ref2], en [86ia][ref3] gelden met ingang van de dag
      waarop aan de betrokken wijziging uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59e
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel71h
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel86ia
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel176a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59e
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 71h
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 86ia
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: '177'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel177
  - number: 177a
    text: |-
      Een wijziging van de richtlijn markten voor financiële instrumenten 2014 of de gedelegeerde uitvoeringsrichtlijn
      markten voor financiële instrumenten 2014 gaat voor de toepassing van dit besluit gelden met ingang van de dag
      waarop aan de betrokken wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel177a
  - number: '178'
    text: 'Dit besluit wordt aangehaald als: Besluit Gedragstoezicht financiële ondernemingen Wft.'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel178
