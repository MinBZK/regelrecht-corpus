      tevens bij Onze Minister worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel9
  - number: '9.4'
    text: |-
      Bij ministeriële regeling worden de eindtermen en toetstermen vastgesteld voor de in het eerste lid bedoelde
      modules.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel9
  - number: '10'
    text: |-
      Personen die over een in tabel 2 genoemd diploma beschikken, zijn tevens vakbekwaam te adviseren over het daarbij
      in de tabel vermelde onderwerp, indien de advisering over dat onderwerp gecombineerd wordt met advisering over het
      onderwerp waarop het diploma betrekking heeft.
          Tabel 2. Toegestane bijkomende onderwerpen






