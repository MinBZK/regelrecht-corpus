    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 12 juli 2006, nr. FM 2006-01681 M;

    Gelet op richtlijn nr. 85/611/EEG van de Raad van de Europese Gemeenschappen van 20 december 1985 tot coördinatie
    van de wettelijke en bestuursrechtelijke bepalingen betreffende bepaalde instellingen voor collectieve belegging
    in effecten (icbe’s) (PbEG L 375), richtlijn nr. 87/102/EEG van de Raad van de Europese Gemeenschappen van
    22 december 1986 betreffende de harmonisatie van de wettelijke en bestuursrechtelijke bepalingen der lidstaten
    inzake het consumentenkrediet (PbEG 1987 L 42), richtlijn nr. 92/49/EEG van de Raad van de Europese Gemeenschappen
    van 18 juni 1992 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende de toegang
    tot het directe verzekeringsbedrijf, met uitzondering van de levensverzekeringsbranche, en houdende wijziging
    van de richtlijnen 73/239/EEG en 88/357/EEG (PbEG L 228), richtlijn nr. 93/22/EEG van de Raad van de Europese
    Gemeenschappen van 10 mei 1993 betreffende het verrichten van diensten op het gebied van beleggingen in effecten
    (PbEG L 141), richtlijn nr. 2002/65/EG van het Europees Parlement en de Raad van de Europese Unie van 23 september
    2002 betreffende de verkoop op afstand van financiële diensten aan consumenten en tot wijziging van de richtlijnen
