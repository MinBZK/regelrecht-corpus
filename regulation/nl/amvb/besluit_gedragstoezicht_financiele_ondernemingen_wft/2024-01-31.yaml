        artikel: 10bis
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref6
        bwb_id: BWBR0018450
        artikel: '1'
  - number: 5a
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de vakbekwaamheid van werknemers en andere
      natuurlijke personen die onder verantwoordelijkheid van een beleggingsonderneming cliënten informeren over
      financiële instrumenten, beleggingsdiensten of nevendiensten en werknemers en natuurlijke personen die zich
      rechtstreeks bezighouden met het adviseren van cliënten over financiële instrumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel5a
  - number: '6.1'
    text: |-
      Een financiëledienstverlener voldoet aan [artikel 4:9, tweede lid, van de wet][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel6
    references:
      - id: ref1
