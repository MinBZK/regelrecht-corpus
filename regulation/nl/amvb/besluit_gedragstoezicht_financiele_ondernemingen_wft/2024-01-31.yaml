  - number: '9.1'
    text: |-
      Een diploma als bedoeld in [artikel 7][ref1] wordt afgegeven, indien de ingevolge tabel 1 aan dat diploma ten
      grondslag liggende modules alle met goed gevolg zijn afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel7
