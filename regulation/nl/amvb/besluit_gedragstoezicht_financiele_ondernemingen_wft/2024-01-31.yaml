  - number: 59f.2
    text: Voor nationale betalingstransacties worden de in het eerste lid genoemde bedragen verdubbeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59f
  - number: 59f.3
    text: |-
      Voor vooraf betaalde betaalinstrumenten, bedoeld voor nationale betalingstransacties, worden de in het eerste lid
      genoemde bedragen verhoogd tot € 500.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59f
  - number: 59g.1
    text: |-
      Een betaaldienstverlener brengt een betaaldienstgebruiker geen kosten in rekening voor de ingevolge de
      [artikelen 59b tot en met 59f][ref1] te verstrekken informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59g
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59b
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 59g.2
    text: |-
      Een betaaldienstverlener en een betaaldienstgebruiker kunnen overeenkomen dat kosten in rekening worden gebracht
      voor door de betaaldienstgebruiker gevraagde aanvullende informatie of voor informatie die frequenter of met andere
      communicatiemiddelen wordt verstrekt dan in de raamovereenkomst voor betaaldiensten is bepaald.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59g
  - number: 59g.3
    text: |-
      Kosten die de betaaldienstverlener ingevolge het tweede lid in rekening mag brengen zijn passend en in
      overeenstemming met de kosten die de betaaldienstverlener feitelijk heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59g
  - number: 59h.1
    text: |-
      Een financiëledienstverlener informeert een cliënt voorafgaand aan het advies over een verzekering met een
      beleggingscomponent of de cliënt een periodieke beoordeling ontvangt van de geschiktheid van de verzekering met een
      beleggingscomponent die de financiëledienstverlener aan de cliënt heeft geadviseerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59h
  - number: 59h.2
    text: |-
      Een financiëledienstverlener informeert de cliënt over alle kosten en bijbehorende lasten in verband met de dienst
      en de verzekering met een beleggingscomponent en voegt de kosten die niet het gevolg zijn van de ontwikkeling van
      onderliggende marktrisico’s, samen zodat de cliënt inzicht krijgt in de totale kosten, en mede in het cumulatieve
      effect op het rendement.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59h
  - number: 59h.3
    text: |-
      Op verzoek van de cliënt verstrekt de financiëledienstverlener een puntgewijze uitsplitsing van de kosten en
      bijbehorende lasten, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59h
  - number: '60.1'
    text: |-
      Onverminderd de [artikel 57][ref1] verstrekt een levensverzekeraar een cliënt voorafgaande aan de totstandkoming
      van een overeenkomst inzake een levensverzekering, voorzover van toepassing, ten minste de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 60.1.a
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.b
    text: |-
      het bedrag van de uitkering of uitkeringen waartoe hij zich verplicht of, voorzover dit bedrag niet op voorhand
      nauwkeurig kan worden bepaald, een nauwkeurige omschrijving van die uitkering of uitkeringen, alsmede van de
      factoren waarvan de hoogte van de uitkering of uitkeringen afhankelijk is;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.c
    text: |-
      een omschrijving van de keuzemogelijkheden die de cliënt of de gerechtigde op een uitkering heeft ingevolge de
      overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.d
    text: |-
      een nauwkeurige omschrijving van de valuta waarin de premie of de uitkering is uitgedrukt, indien dit een andere
      valuta is dan de euro, of van de units, eenheden of datgene waar de premie of de uitkering anderszins in is
      uitgedrukt, of, indien de uitkering strekt tot het verrichten van andere dan geldelijke prestaties, van die
      prestatie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.e
    text: |-
      een nauwkeurige omschrijving van de omzettingsmethode indien bij een uitkering omzetting plaatsvindt in euro’s of
      een andere valuta;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.f
    text: |-
      de aard van de waarden, waaronder aandelen of andersoortige rechten van deelneming in een beleggingsinstelling of
      icbe, indien de uitkering daarin wordt uitgedrukt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.g
    text: de wijze van berekening en toewijzing van de winstdeling, indien de overeenkomst een recht op winstdeling omvat;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.h
    text: de looptijd van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.i
    text: |-
      de premie, verschuldigd voor de hoofddekking en, indien de overeenkomst voorziet in een of meer nevenuitkeringen,
      de premies die voor elk van de nevenuitkeringen zijn verschuldigd en, indien deze premies gedurende de looptijd
      fluctueren, een zo nauwkeurig mogelijke beschrijving van de wijze waarop ze worden berekend en van de factoren
      waardoor het beloop ervan wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.j
    text: een opgave of de premie eenmalig is verschuldigd dan wel periodiek;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.k
    text: de periode gedurende welke premie verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.l
    text: 'indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling of icbe:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.l.1°
    text: |-
      de kosten die worden ingehouden op de premie, bedoeld in onderdeel i, onderverdeeld naar eerste kosten, doorlopende
      kosten en aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.l.2°
    text: |-
      de kosten die worden ingehouden op de waarde van de rechten van deelneming, onderverdeeld naar eerste kosten,
      doorlopende kosten en aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.l.3°
    text: |-
      de kosten die de beheerder van een beleggingsinstelling of icbe of beheerder van een icbe jaarlijks in rekening
      brengt voor het beheer van de rechten van deelneming in die beleggingsinstelling of icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.l.4°
    text: |-
      de invloed van het gemiddelde jaarlijkse percentage van de kosten, bedoeld onder 1°, 2° en 3°, op het rendement en
      de uitkering, verbonden aan de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.l.5°
    text: |-
      de wijze waarop de kosten, bedoeld onder 1°, 2° en 3°, worden verdeeld over de looptijd van de overeenkomst met
      de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.m
    text: |-
      een omschrijving van de gevolgen van een verhoging of verlaging van de premie, met inbegrip van premievrijmaken,
      en, indien de overeenkomst in die mogelijkheid voorziet, van afkoop, en een opgave van de afkoopwaarde gedurende
      ten minste de eerste tien jaren van de looptijd, onder vermelding van het voor de berekening gehanteerde
      rendementspercentage;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.n
    text: |-
      de wijze waarop de cliënt gebruik kan maken van zijn recht, bedoeld in [artikel 4:63 van de wet][ref1], om de
      overeenkomst op te zeggen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 60.1.o
    text: de wijze waarop de overeenkomst kan worden beëindigd en de termijn die daarbij in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.p
    text: |-
      een globale indicatie van de fiscale behandeling van overeenkomsten van het desbetreffende type, waaronder begrepen
      de fiscale behandeling van premies, uitkeringen en de fiscale consequenties van afkoop;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.q
    text: het op de overeenkomst toe te passen recht, of de door de aanbieder voorgestelde rechtskeuze;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.r
    text: de kosten die naast de brutopremie in rekening worden gebracht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.s
    text: het aan de overeenkomst verbonden financiële risico en de mate waarin dit risico voor rekening is van de cliënt; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.1.t
    text: de overige polisvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: '60.2'
    text: |-
      In afwijking van het eerste lid kan de in dat lid bedoelde informatie onmiddellijk na de totstandkoming van de
      overeenkomst worden verstrekt of uiterlijk tegelijk met het afgeven van de polis, indien de cliënt het recht heeft
      zonder een boete verschuldigd te zijn en zonder opgave van redenen de overeenkomst binnen dertig kalenderdagen
      na de dag waarop hij de informatie heeft ontvangen, terugwerkend tot de datum van de totstandkoming van de
      overeenkomst, te ontbinden en de cliënt is geïnformeerd over de wijze waarop hij gebruik kan maken van dat recht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: '60.3'
    text: |-
      Voorzover het financiële risico ingevolge een overeenkomst inzake een levensverzekering voor rekening van de cliënt
      is, kan de levensverzekeraar met de cliënt overeenkomen dat de eventueel na de totstandkoming van de overeenkomst
      opgetreden waardevermeerdering of -vermindering van de beleggingen voor rekening van de cliënt blijft indien deze
      overeenkomstig het tweede lid de overeenkomst, terugwerkend tot de datum van de totstandkoming van de overeenkomst,
      ontbindt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: '60.4'
    text: |-
      Indien een uitkering op grond van een overeenkomst inzake een levensverzekering wordt uitgedrukt in rechten van
      deelneming in een beleggingsinstelling stelt de levensverzekeraar aan de cliënt op diens verzoek informatie ter
      hand over het beleggingsbeleid van de beleggingsinstelling, waarin aandacht wordt besteed aan de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.4.a
    text: de doelstelling van het beleggingsbeleid, alsmede de voor het beheer gehanteerde referentieportefeuille;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.4.b
    text: aan het beleggingsbeleid gestelde restricties; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: 60.4.c
    text: de beleggingstitels die zijn toegestaan alsmede de afgeleide instrumenten die kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: '60.5'
    text: |-
      Een levensverzekeraar, niet zijnde een verzekeraar met beperkte risico-omvang, informeert de cliënt
      waar deze kennis kan nemen van het rapport over zijn solvabiliteit en financiële positie, bedoeld in
      [artikel 3:73c, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '60.6'
    text: |-
      Het eerste lid, aanhef en onderdeel m, is niet van toepassing indien de cliënt een werkgever is die een
      overeenkomst afsluit ten behoeve van zijn werknemers in verband met een door hem toegezegd pensioen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel60
  - number: '61.1'
    text: |-
      Onverminderd [artikel 57][ref1] verstrekt een schadeverzekeraar een cliënt voorafgaande aan de totstandkoming van
      een overeenkomst inzake een schadeverzekering, voorzover van toepassing, ten minste de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 61.1.a
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel61
  - number: 61.1.b
    text: het recht dat op de overeenkomst van toepassing is, of de door de schadeverzekeraar voorgestelde rechtskeuze;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel61
  - number: 61.1.c
    text: |-
      de naam en het adres van de schade-afhandelaar, bedoeld in
      [artikel 4:71, eerste lid, onderdeel e, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 61.1.d
    text: |-
      de aard van de vergoeding die zijn werknemers ontvangen die financiële diensten verlenen met betrekking tot
      schadeverzekeringen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel61
  - number: '61.2'
    text: |-
      In afwijking van het eerste lid kan de in dat lid bedoelde informatie onmiddellijk na de totstandkoming van de
      overeenkomst worden verstrekt, of uiterlijk tegelijk met het afgeven van de polis, indien de cliënt het recht heeft
      zonder een boete verschuldigd te zijn en zonder opgave van redenen de overeenkomst binnen veertien kalenderdagen na
      de dag waarop hij de informatie heeft ontvangen te ontbinden en de cliënt is geïnformeerd over de wijze waarop hij
      gebruik kan maken van dat recht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel61
  - number: '62'
    text: |-
      Indien in geval van een overeenkomst inzake een schadeverzekering een risico is gelegen in een andere lidstaat
      wordt de aan de cliënt te verstrekken informatie gegeven volgens de in die andere lidstaat vastgestelde regels ter
      uitvoering van de artikelen 183 en 184 van de richtlijn solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel62
  - number: '63.1'
    text: |-
      Onverminderd [artikel 57][ref1] verstrekt een natura-uitvaartverzekeraar voorafgaande aan de totstandkoming
      van een overeenkomst inzake een natura-uitvaartverzekering of een overeenkomst die strekt tot fondsvorming ter
      voldoening van de verzorging van de uitvaart van een natuurlijke persoon, voorzover van toepassing, ten minste
      de volgendeinformatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 63.1.a
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.b
    text: een omschrijving van de prestatie waartoe de natura-uitvaartverzekeraar zich verplicht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.c
    text: een omschrijving van de keuzemogelijkheden die de cliënt of de verzekerde ingevolge de overeenkomst heeft;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.d
    text: een opgave of de premie eenmalig is verschuldigd dan wel periodiek;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.e
    text: de periode gedurende welke premie verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.f
    text: een opgave van de indexering die wordt toegepast op de verzekerde prestatie of op de premie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.g
    text: de overige mogelijkheden die de aanbieder heeft om de verzekerde prestatie of de premie aan te passen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.h
    text: |-
      een opgave of indicatie van de afkoop- of premievrije waarde of een opgave van de wijze waarop deze waarden worden
      berekend;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.i
    text: |-
      de wijze waarop de cliënt gebruik kan maken van zijn recht, bedoeld in [artikel 4:63 van de wet][ref1], om de
      overeenkomst op te zeggen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 63.1.j
    text: de wijze waarop de overeenkomst kan worden beëindigd en de termijn die daarbij in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.k
    text: het op de overeenkomst toe te passen recht, of de door de natura-uitvaartverzekeraar voorgestelde rechtskeuze;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.l
    text: |-
      een opgave van de uitvaartonderneming die de uitvaart zal verzorgen, dan wel van de wijze waarop wordt bepaald
      welke uitvaartonderneming de uitvaart zal verzorgen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.m
    text: de overige polisvoorwaarden, en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: 63.1.n
    text: |-
      indien het een overeenkomst betreft die strekt fondsvorming als bedoeld in
      [artikel 4:18, tweede lid, van de wet][ref1]: informatie over de wijze waarop de ingelegde gelden worden belegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '63.2'
    text: |-
      Indien de termijn van beëindiging, bedoeld in het eerste lid, onderdeel j, langer is dan een jaar, maakt de natura-
      uitvaartverzekeraar dit op een opvallende wijze uitdrukkelijk kenbaar aan de cliënt, bij gebreke waarvan een
      opzegtermijn van een jaar geldt ongeacht het in de overeenkomst bepaalde.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: '63.3'
    text: |-
      In afwijking van het eerste lid kan de in dat lid bedoelde informatie onmiddellijk na de totstandkoming van de
      overeenkomst worden verstrekt, of uiterlijk tegelijk met het afgeven van de polis, indien de cliënt het recht heeft
      zonder een boete verschuldigd te zijn en zonder opgave van redenen de overeenkomst binnen dertig kalenderdagen
      na de dag waarop hij de informatie heeft ontvangen, terugwerkend tot de datum van de totstandkoming van de
      overeenkomst, te ontbinden en de cliënt is geïnformeerd over de wijze waarop hij gebruik kan maken van dat recht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
  - number: '63.4'
    text: |-
      Indien een natura-uitvaartverzekeraar bij de totstandkoming van een overeenkomst die strekt tot fondsvorming als
      bedoeld in [4:18, tweede lid, van de wet][ref1] in afwijking van het eerste lid, de in dat lid bedoelde informatie
      onmiddellijk na de totstandkoming van een overeenkomst of uiterlijk tegelijk met het afgeven van de polis verstrekt
      in overeenstemming met het derde lid, komt de natura-uitvaartverzekeraar met de cliënt overeen dat de eventueel
      na de totstandkoming van de overeenkomst opgetreden waardevermeerdering of -vermindering van de beleggingen voor
      rekening van de cliënt blijft, indien deze overeenkomstig het derde lid de overeenkomst, terugwerkend tot de datum
      van de totstandkoming van de overeenkomst, ontbindt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 63a.1
    text: |-
      Indien een financiëledienstverlener een verzekering aanbiedt of bemiddelt in een verzekering samen met een
      aanvullend product niet zijnde een verzekering of aanvullende dienst, als onderdeel van een pakket of van dezelfde
      overeenkomst, deelt de financiëledienstverlener de cliënt mede of de verschillende financiële producten of diensten
      afzonderlijk kunnen worden aangeschaft en zo ja, verstrekt de financiëledienstverlener een beschrijving van de
      verschillende financiële producten of diensten die deel uitmaken van het pakket of de overeenkomst en informatie
      over de kosten en bijbehorende lasten van elk financieel product respectievelijk elke dienst.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63a
  - number: 63a.2
    text: |-
      Indien de risico’s of de verzekeringsdekking van de verzekering samen met een aanvullend product of aanvullende
      dienst verschilt van de risico’s of de verzekeringsdekking die verbonden is aan elk van de producten of diensten
      afzonderlijk, verstrekt de financiëledienstverlener aan de cliënt een adequate beschrijving van de verschillende
      producten of diensten die deel uitmaken van het pakket of de overeenkomst, de risicoverhogende wisselwerking
      daartussen en, indien van toepassing, de invloed op de verzekeringsdekking.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63a
  - number: 63b
    text: |-
      Een financiëledienstverlener die een cliënt adviseert inzake een schadeverzekering, niet zijnde een verzekering in
      verband met het geheel of gedeeltelijk wegvallen van het inkomen van een cliënt, verstrekt aan de cliënt een advies
      waarin wordt uitgelegd waarom een bepaalde schadeverzekering het beste aansluit bij de wensen en behoeften van
      de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63b
  - number: 63c
    text: |-
      Een financiëledienstverlener die een consument adviseert inzake hypothecair krediet, verstrekt het advies op papier
      of op een andere duurzame drager aan die consument.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel63c
  - number: '64.1'
    text: Deze paragraaf is niet van toepassing op beheerders van een icbe met zetel in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel64
  - number: '64.2'
    text: |-
      Deze paragraaf is niet van toepassing op financiële ondernemingen voorzover zij overeenkomsten inzake
      derdepijlerpensioenproducten en rechten van deelneming in een icbe beheren of uitvoeren dan wel daarbij assisteren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel64
  - number: '65.1'
    text: |-
      Een aanbieder van een derdepijlerpensioenproduct stelt voor dat product een essentiële-informatiedocument voor
      pensioenproducten op.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65
  - number: '65.2'
    text: |-
      De aanbieder van een derdepijlerpensioenproduct houdt een bijgewerkte versie van het essentiële-informatiedocument
      voor pensioenproducten beschikbaar op zijn website.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65
  - number: '65.3'
    text: |-
      De aanbieder van een derdepijlerpensioenproduct verstrekt tijdig voorafgaand aan de totstandkoming van een
      overeenkomst inzake het derdepijlerpensioenproduct met een consument kosteloos het essentiële-informatiedocument
      voor pensioenproducten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65
  - number: '65.4'
    text: |-
      Indien een derdepijlerpensioenproduct wordt aangeboden door tussenkomst van een bemiddelaar, gevolmachtigde agent
      of ondergevolmachtigde agent, wordt het essentiële-informatiedocument voor pensioenproducten door deze bemiddelaar,
      gevolmachtigde agent onderscheidenlijk ondergevolmachtigde agent kosteloos verstrekt, tenzij de aanbieder en de
      bemiddelaar, gevolmachtigde agent of ondergevolmachtigde agent zijn overeengekomen dat de aanbieder zelf aan deze
      verplichting voldoet.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65
  - number: '65.5'
    text: |-
      Het eerste tot en met derde lid is van overeenkomstige toepassing op een financiële onderneming die een
      derdepijlerpensioenproduct samenstelt en dat product algemeen in de markt verkrijgbaar stelt voor consumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65
  - number: 65a.1
    text: |-
      Een aanbieder van rechten van deelneming in een icbe stelt voor elke icbe waarin door hem rechten van deelneming
      aan niet-professionele beleggers worden aangeboden, een essentiële-informatiedocument op als bedoeld in artikel 5
      van de verordening essentiële-informatiedocumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65a
  - number: 65a.2
    text: |-
      Een aanbieder van rechten van deelneming in een icbe stelt voor elke icbe waarin door hem rechten van deelneming
      aan professionele beleggers worden aangeboden, essentiële beleggersinformatie op. Hij mag in plaats daarvan een
      essentiële-informatiedocument als bedoeld in het eerste lid opstellen, dat voldoet aan de vereisten van de in dat
      lid genoemde verordening.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65a
  - number: 65a.3
    text: |-
      Een aanbieder van rechten van deelneming in een icbe houdt een bijgewerkte versie van het essentiële-
      informatiedocument, onderscheidenlijk de essentiële beleggersinformatie, beschikbaar op zijn website.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65a
  - number: 65a.4
    text: |-
      Een aanbieder van rechten van deelneming in een icbe of degene die beleggingsdiensten als bedoeld in
      [artikel 1, onderdelen a, b, of d, van de wet][ref1] verleent met betrekking tot rechten van deelneming in een
      icbe, verstrekt kosteloos en geruime tijd voorafgaand aan een inschrijving op de rechten van deelneming in een icbe
      de in het tweede lid bedoelde informatie aan de cliënt. De informatie wordt schriftelijk, op een duurzame drager of
      via een website verstrekt. Op verzoek wordt de informatie kosteloos schriftelijk aan de cliënt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 65b.1
    text: |-
      Een financiëledienstverlener die een schadeverzekering aanbiedt of samenstelt en algemeen in de markt verkrijgbaar
      stelt, stelt voor dat product een informatiedocument op waarbij wordt voldaan aan het bepaalde in artikel 20,
      zevende lid, van de richtlijn verzekeringsdistributie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65b
  - number: 65b.2
    text: |-
      De financiëledienstverlener verstrekt een cliënt voorafgaande aan de totstandkoming van een overeenkomst inzake een
      schadeverzekering een informatiedocument over de desbetreffende schadeverzekering.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65b
  - number: 65b.3
    text: |-
      Een financiëledienstverlener die een schadeverzekering aanbiedt of samenstelt en algemeen in de markt verkrijgbaar
      stelt, houdt een bijgewerkte versie van het informatiedocument beschikbaar op zijn website.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65b
  - number: 65b.4
    text: |-
      Indien een schadeverzekering wordt aangeboden door tussenkomst van een bemiddelaar in verzekeringen, gevolmachtigde
      agent of ondergevolmachtigde agent, wordt het informatiedocument door deze bemiddelaar, gevolmachtigde agent
      onderscheidenlijk ondergevolmachtigde agent aan de cliënt verstrekt voorafgaand aan de totstandkoming van
      een overeenkomst inzake een schadeverzekering, tenzij de aanbieder en de bemiddelaar, gevolmachtigde agent
      onderscheidenlijk ondergevolmachtigde agent zijn overeengekomen dat de aanbieder zelf aan de verplichting voldoet.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel65b
  - number: '66.1'
    text: |-
      In een essentiële-informatiedocument voor pensioenproducten wordt informatie over de volgende onderwerpen
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.a
    text: de naam die de aanbieder aan het derdepijlerpensioenproduct heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.b
    text: de identiteit en contactgegevens van de aanbieder van het derdepijlerpensioenproduct;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.c
    text: de naam van de toezichthouder belast met het toezicht op het essentiële-informatiedocument voor pensioenproducten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.d
    text: |-
      de opsteldatum of de datum van de meest recente herziening van het essentiële-informatiedocument voor
      pensioenproducten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.e
    text: een waarschuwing met betrekking tot de begrijpelijkheid van het derdepijlerpensioenproduct;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.f
    text: de omschrijving van het derdepijlerpensioenproduct;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.g
    text: de risico’s en mogelijke opbrengstscenario’s van het derdepijlerpensioenproduct;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.h
    text: de gevolgen als de aanbieder van het derdepijlerpensioenproduct niet kan uitbetalen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.i
    text: de kosten van het derdepijlerpensioenproduct;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.j
    text: de fiscale behandeling van het derdepijlerpensioenproduct;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.k
    text: |-
      de aanbevolen of vereiste periode van bezit van het derdepijlerpensioenproduct en de gevolgen van het beëindigen
      van het derdepijlerpensioenproduct voorafgaand aan de aanbevolen einddatum;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.l
    text: |-
      de wijze waarop een consument een klacht kan indienen over het product of over de aanbieder of adviseur van het
      derdepijlerpensioenproduct;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66.1.m
    text: een korte omschrijving van andere informatiedocumenten die verstrekt moeten worden aan de consument.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: '66.2'
    text: |-
      Een essentiële-informatiedocument voor pensioenproducten bevat geen informatie over andere onderwerpen dan die
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: '66.3'
    text: |-
      De Autoriteit Financiële Markten stelt regels met betrekking tot de wijze waarop de informatie over de onderwerpen,
      bedoeld in het eerste lid, in het essentiële-informatiedocument voor pensioenproducten wordt opgenomen of wordt
      berekend.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66
  - number: 66a.1
    text: 'In de essentiële beleggersinformatie wordt de volgende informatie over de icbe opgenomen:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.1.a
    text: de identificatie van de icbe en de relevante toezichthoudende instantie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.1.b
    text: een korte beschrijving van de beleggingsdoelstellingen en beleggingsbeleid;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.1.c
    text: het historisch rendement of, indien relevant, toekomstscenario’s;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.1.d
    text: de kosten; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.1.e
    text: |-
      het risico-opbrengstprofiel van het recht van deelneming, waaronder voldoende toelichting en waarschuwingen met
      betrekking tot de risico’s die aan het recht van deelneming in de desbetreffende icbe zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.1.f
    text: |-
      een mededeling dat nadere gegevens van het actuele beloningsbeleid, met een beschrijving van de wijze van
      berekening van de beloning, de identiteit van de personen die verantwoordelijk zijn voor het toekennen van de
      beloning, met inbegrip van de samenstelling van de beloningscommissie, indien een zodanige beloningscommissie is
      ingesteld, beschikbaar zijn via de website en dat daarvan op verzoek kosteloos een afschrift kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.2
    text: 'De essentiële beleggingsinformatie vermeldt duidelijk:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.2.a
    text: |-
      waar en hoe aanvullende informatie over de aangeboden rechten van deelneming en het prospectus kan worden
      verkregen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.2.b
    text: |-
      dat de jaarrekening en halfjaarcijfers op de website van de beheerder beschikbaar zijn en dat deze stukken te allen
      tijde op verzoek kosteloos kunnen worden verkregen bij de beheerder; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.2.c
    text: in welke taal de informatie, bedoeld in de onderdelen a en b, voor de deelnemers beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.3
    text: |-
      De essentiële beleggersinformatie wordt zodanig opgesteld dat cliënten de aard en de risico’s verbonden aan de
      rechten van deelneming in een icbe kunnen begrijpen, zonder dat naar andere documenten wordt verwezen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.4
    text: |-
      Een vertaling van de essentiële beleggersinformatie bevat geen andere wijzigingen of aanvullingen ten opzichte van
      het vertaalde document, dan noodzakelijk vanwege de vertaling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66a.5
    text: |-
      Met betrekking tot de essentiële beleggersinformatie zijn nadere regels gesteld in verordening nr. 583/2010 van de
      Europese Commissie van 1 juli 2010 tot uitvoering van Richtlijn 2009/65/EG van het Europees Parlement en de Raad
      van de Europese Unie wat betreft essentiële beleggersinformatie en de voorwaarden waaraan moet worden voldaan als
      de essentiële beleggersinformatie of het prospectus op een andere duurzame drager dan papier of via een website
      wordt verstrekt (PbEU L 176).
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66a
  - number: 66b.1
    text: |-
      In het informatiedocument, bedoeld in [artikel 65b][ref1], wordt de volgende informatie over de schadeverzekering
      opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel65b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 65b
        hoofdstuk: '8'
        paragraaf: 8.1.5
        afdeling: '8.1'
  - number: 66b.1.a
    text: informatie over het soort verzekering;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66b
  - number: 66b.1.b
    text: |-
      een samenvatting van de verzekeringsdekking, waaronder de belangrijkste verzekerde risico’s, de verzekerde som en,
      indien van toepassing, de geografische dekking en een samenvatting van de uitgesloten risico’s;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66b
  - number: 66b.1.c
    text: wijze en duur van betaling van de premies;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66b
  - number: 66b.1.d
    text: belangrijkste uitsluitingen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66b
  - number: 66b.1.e
    text: verplichtingen bij aanvang van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66b
  - number: 66b.1.f
    text: verplichtingen gedurende de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66b
  - number: 66b.1.g
    text: verplichtingen bij aangifte van een schade;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66b
  - number: 66b.1.h
    text: de looptijd van de overeenkomst met vermelding van begindatum en einddatum;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66b
  - number: 66b.1.i
    text: wijze van beëindiging van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66b
  - number: 66b.2
    text: |-
      In aanvulling op het eerste lid voldoet het informatiedocument aan de ingevolge artikel 20, negende lid, van de
      richtlijn verzekeringsdistributie gestelde regels.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel66b
  - number: '67.1'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een beleggingsobject verstrekt de aanbieder de consument ten
      minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel67
  - number: 67.1.a
    text: |-
      een door een accountant dan wel een deskundige die ingevolge het recht van de staat waar de aanbieder zijn zetel
      heeft, bevoegd is de jaarrekening te onderzoeken, gecontroleerde jaarrekening, waarvan de toelichting ten minste
      een opsplitsing bevat van de totale verkoopkosten, de productiekosten, de beheerkosten en de administratieve kosten
      van de aanbieder, een opsplitsing van deze kosten per serie van beleggingsobjecten waartoe het beleggingsobject
      behoort, alsmede het totaal van de door consumenten ingelegde gelden in de serie van beleggingsobjecten.
      De opstelling van de jaarrekening geschiedt door een aanbieder met een zetel in Nederland zoveel mogelijk
      overeenkomstig [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] of de internationale jaarrekeningstandaarden.
      De opstelling van de jaarrekening van een aanbieder met een zetel in een andere lidstaat geschiedt overeenkomstig
      de voorschriften van de richtlijn jaarrekening en van de richtlijn geconsolideerde jaarrekening of overeenkomstig
      de internationale jaarrekeningstandaarden. Voor de overige aanbieders geschiedt de opstelling op gelijkwaardige
      wijze. In de jaarrekening wordt meegedeeld overeenkomstig welke voorschriften de opstelling geschiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 67.1.b
    text: |-
      ten minste een maal per jaar een door een onafhankelijke deskundige in dat jaar opgestelde waardering van de serie
      van beleggingsobjecten waartoe het beleggingsobject behoort; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel67
  - number: 67.1.c
    text: bij ministeriële regeling aan te wijzen andere onderwerpen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel67
  - number: '67.2'
    text: |-
      De aanbieder houdt de informatie, bedoeld in het eerste lid, aanhef en onderdelen a en b, gedurende ten minste drie
      jaar beschikbaar op zijn website.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel67
  - number: '67.3'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de wijze waarop de informatie, bedoeld
      in het eerste lid, wordt gepresenteerd of geformuleerd alsmede met betrekking tot de wijze van berekening van de
      kosten, bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel67
  - number: '68.1'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake krediet verstrekt de aanbieder de consument op diens verzoek
      een gespecificeerd overzicht van het uitstaand saldo. Hij kan daarbij een vergoeding in rekening brengen van ten
      hoogste het bedrag van de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68
  - number: '68.2'
    text: |-
      Tot een jaar na de afwikkeling van een overeenkomst inzake krediet verstrekt de aanbieder van krediet aan de
      consument op diens verzoek kosteloos een gespecificeerde afrekening.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68
  - number: 68a.1
    text: |-
      Gedurende de looptijd van een overeenkomst inzake hypothecair krediet met een variabele debetrentevoet informeert
      de aanbieder de consument op papier of op een andere duurzame drager voorafgaand aan elke wijziging van de
      debetrentevoet over deze wijziging, waarbij hij de consument tevens informeert over:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68a
  - number: 68a.1.a
    text: het gewijzigde jaarlijks kostenpercentage;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68a
  - number: 68a.1.b
    text: de component of componenten waardoor de debetrentevoet is gewijzigd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68a
  - number: 68a.1.c
    text: het termijnbedrag dat moet worden betaald nadat de nieuwe debetrentevoet in werking is getreden; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68a
  - number: 68a.1.d
    text: indien van toepassing, wijzigingen in het aantal of de frequentie van de termijnbedragen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68a
  - number: 68a.2
    text: |-
      De partijen kunnen in de kredietovereenkomst overeenkomen dat de informatie, bedoeld in het eerste lid,
      periodiek aan de consument wordt verstrekt indien de wijziging in de debetrentevoet rechtstreeks met de wijziging
      van een referentierentevoet samenhangt, het publiek via passende middelen kennis kan nemen van de nieuwe
      referentierentevoet en de informatie over de nieuwe referentierentevoet beschikbaar is in de gebouwen van de
      aanbieder en samen met het nieuwe termijnbedrag persoonlijk aan de consument wordt meegedeeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68a
  - number: 68a.3
    text: |-
      Gedurende de looptijd van een overeenkomst inzake hypothecair krediet die is aangegaan in vreemde valuta als
      bedoeld in artikel 4, onderdeel 28, van de richtlijn hypothecair krediet, waarschuwt de aanbieder de consument op
      papier of een andere duurzame drager in ieder geval wanneer de waarde van het totaal uitstaande bedrag of de waarde
      van de afbetalingstermijnen meer dan twintig procent afwijkt van de waarde die zou gelden, indien de wisselkoers
      van de valuta van de kredietovereenkomst en de euro zou worden toegepast, die gold op het tijdstip waarop de
      overeenkomst werd gesloten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68a
  - number: 68a.4
    text: |-
      Bij de waarschuwing, bedoeld in het derde lid verstrekt de aanbieder de consument uitleg over
      de mogelijkheid om de valuta van de kredietovereenkomst om te zetten in een andere valuta en
      de ter zake geldende voorwaarden of een beroep te doen op andere maatregelen als bedoeld in
      [artikel 126, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1]. De Autoriteit Financiële Markten kan regels
      stellen met betrekking tot de inhoud van de waarschuwing en de uitleg die daarbij wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel126
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '126'
  - number: 68b.1
    text: |-
      Indien de rentevastperiode van een overeenkomst inzake hypothecair krediet met een vaste debetrentevoet afloopt na
      1 april 2013 informeert de aanbieder de consument ten minste drie maanden voor het aflopen van de rentevastperiode
      over het aflopen van die periode en verstrekt informatie over de maximale debetrentevoet die zal gelden voor de
      komende rentevastperiode waarbij de maximale debetrentevoet bij minimaal drie rentevastperiodes, indien aangeboden,
      wordt aangegeven.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68b
  - number: 68b.2
    text: |-
      Gelijktijdig met het aanbod, bedoeld in het eerste lid, verstrekt de aanbieder tevens informatie over de
      mogelijkheid:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68b
  - number: 68b.2.a
    text: om boetevrij over te sluiten bij het aflopen van de rentevastperiode; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68b
  - number: 68b.2.b
    text: om advies over oversluitmogelijkheden in te winnen bij de aanbieder of een andere financiëledienstverlener.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68b
  - number: 68b.3
    text: |-
      Voorafgaand aan de inwerkingtreding van een nieuwe debetrentevoet informeert de aanbieder de consument op papier of
      op een andere duurzame drager over:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68b
  - number: 68b.3.a
    text: het termijnbedrag dat moet worden betaald nadat de nieuwe debetrentevoet in werking is getreden; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68b
  - number: 68b.3.b
    text: indien van toepassing, wijzigingen in het aantal of de frequentie van de termijnbedragen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68b
  - number: 68c.1
    text: |-
      Een beleggingsonderneming verstrekt de niet-professionele belegger periodiek rapporten over de door haar verleende
      dienstverlening op een duurzame drager.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68c
  - number: 68c.2
    text: |-
      De rapporten, bedoeld in het eerste lid, bevatten mededelingen aan niet-professionele beleggers rekening houdend
      met het type en de complexiteit van de desbetreffende financiële instrumenten en de aard van de aan de niet-
      professionele belegger verleende dienst, inclusief de kosten van de transacties en de diensten die voor rekening
      van de niet-professionele belegger zijn verricht of verleend.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68c
  - number: 68c.3
    text: |-
      Een beleggingsonderneming verstrekt de niet-professionele belegger jaarlijks informatie over alle gemaakte kosten
      en lasten die verbonden zijn aan de financiële instrumenten, de verleende beleggingsdiensten en nevendiensten,
      indien de beleggingsonderneming gedurende het jaar diensten heeft verleend aan de desbetreffende niet-professionele
      belegger.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68c
  - number: 68c.4
    text: |-
      Het eerste tot en met derde lid is van overeenkomstige toepassing op een professionele belegger, indien de
      professionele belegger richting de beleggingsonderneming heeft aangegeven de rapporten en informatie, bedoeld in
      het eerste en derde lid, te willen ontvangen. De beleggingsonderneming legt dit vast in een register.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel68c
  - number: '69'
    text: |-
      Onverminderd [artikel 1:5a van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 69.a
    text: |-
      is [artikel 71e, onderdeel a][ref1], van toepassing op betalingstransacties in de valuta van een lidstaat, waarbij
      de bij de betalingstransactie betrokken betaaldienstverleners hun zetel in een lidstaat hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel71e
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 71e
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 69.b
    text: |-
      zijn de [artikelen 71b tot en met 71k][ref1], met uitzondering van [artikel 71e, onderdeel a][ref2], van toepassing
      op betalingstransacties in alle valuta, waarbij de enige of één van beide bij de betalingstransactie betrokken
      betaaldienstverleners zijn zetel in een lidstaat heeft, met betrekking tot de delen van de betalingstransactie die
      binnen een lidstaat worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel71b
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel71e
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 71b
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 71e
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: '70'
    text: |-
      De [artikelen 71b tot en met 71j][ref1] zijn niet van toepassing op de betaaldienstverlener die uitsluitend
      betaaldiensten verleent als bedoeld onder 8 van de bijlage bij de richtlijn betaaldiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel71b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 71b
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 71b.1
    text: |-
      In het tweede lid en de [artikelen 71c][ref1] en [71d][ref2] wordt onder eenmalige betalingstransacties verstaan
      een betalingstransactie waarop niet een raamovereenkomst voor betaaldiensten van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel71c
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel71d
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 71c
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 71d
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 71b.2
    text: |-
      Indien een betaalopdracht voor een eenmalige betalingstransactie wordt doorgegeven via een onder een
      raamovereenkomst voor betaaldiensten vallend betaalinstrument, is de betaaldienstverlener niet verplicht informatie
      te verstrekken of beschikbaar te stellen die reeds uit hoofde van een raamovereenkomst voor betaaldiensten met een
      andere betaaldienstverlener aan de betaaldienstgebruiker is verstrekt of volgens de raamovereenkomst aan hem zal
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71b
  - number: 71ba.1
    text: |-
      Indien een betaalopdracht voor een eenmalige betalingstransactie via een betaalinitiatiedienstverlener wordt
      geïnitieerd, verstrekt de betaalinitiatiedienstverlener onmiddellijk na de initiëring van de betaalopdracht, aan de
      betaler en de betalingsbegunstigde, naast de in [artikel 59c][ref1] vermelde informatie en voorwaarden, de volgende
      gegevens, of stelt deze ter beschikking:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71ba
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59c
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 71ba.1.a
    text: |-
      de bevestiging dat de betaalopdracht met succes bij de rekeninghoudende betaaldienstverlener van de betaler is
      geïnitieerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71ba
  - number: 71ba.1.b
    text: |-
      een referentie aan de hand waarvan de betaler en de betalingsbegunstigde kunnen uitmaken om welke
      betalingstransactie het gaat en, in voorkomend geval, de betalingsbegunstigde kan uitmaken om welke betaler het
      gaat, alsmede alle bij de betalingstransactie gevoegde informatie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71ba
  - number: 71ba.1.c
    text: het bedrag van de betalingstransactie; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71ba
  - number: 71ba.1.d
    text: |-
      voor zover van toepassing, het bedrag van de voor de transactie aan de betaalinitiatiedienstverlener verschuldigde
      kosten en de uitsplitsing van die kosten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71ba
  - number: 71ba.2
    text: |-
      Een betaalinitiatiedienstverlener stelt de indicatie van de betalingstransactie ter beschikking van de
      rekeninghoudende betaaldienstverlener van de betaler.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71ba
  - number: 71c
    text: |-
      Onmiddellijk na de ontvangst van een betaalopdracht voor een eenmalige betalingstransactie verstrekt de
      betaaldienstverlener van de betaler op dezelfde wijze als in [artikel 59b, eerste tot en met derde lid][ref1], is
      bepaald, aan de betaler de volgende informatie of stelt hij deze aan hem ter beschikking:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59b
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 71c.a
    text: |-
      een referentie aan de hand waarvan de betaler kan bepalen om welke betalingstransactie het gaat, en, in voorkomend
      geval, de informatie betreffende de betalingsbegunstigde;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71c
  - number: 71c.b
    text: het bedrag van de betalingstransactie in de in de betalingstransactie gebruikte valuta;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71c
  - number: 71c.c
    text: |-
      het bedrag van de voor de betalingstransactie door de betaler verschuldigde kosten en, voor zover van toepassing,
      de splitsing van de bedragen van dergelijke kosten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71c
  - number: 71c.d
    text: |-
      voor zover van toepassing, de bij de betalingstransactie gehanteerde wisselkoers, of een desbetreffende referentie,
      indien deze verschilt van de overeenkomstig [artikel 59c, eerste lid, onderdeel d][ref1], aangeboden wisselkoers,
      en het bedrag van de betalingstransactie na die valutawissel; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59c
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 71c.e
    text: de datum van ontvangst van de betaalopdracht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71c
  - number: 71d
    text: |-
      Een betaaldienstverlener verstrekt onmiddellijk na de uitvoering van een eenmalige betalingstransactie de volgende
      informatie aan de betalingsbegunstigde op dezelfde wijze als in [artikel 59b, eerste tot en met derde lid][ref1],
      is bepaald, of stelt deze aan hem ter beschikking:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59b
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 71d.a
    text: |-
      de referentie aan de hand waarvan de betalingsbegunstigde kan bepalen welke betalingstransactie en, in voorkomend
      geval, welke betaler het betreft, en alle bij de betalingstransactie gevoegde informatie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71d
  - number: 71d.b
    text: |-
      het bedrag van de betalingstransactie, in de valuta waarin de geldmiddelen ter beschikking van de
      betalingsbegunstigde worden gesteld;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71d
  - number: 71d.c
    text: |-
      het bedrag van de voor de betalingstransactie door de betalingsbegunstigde verschuldigde kosten en, voor zover van
      toepassing, de splitsing van de bedragen van dergelijke kosten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71d
  - number: 71d.d
    text: |-
      voor zover van toepassing, de door de betaaldienstverlener van de betalingsbegunstigde bij de betalingstransactie
      gehanteerde wisselkoers, en het bedrag van de betalingstransactie voor die valutawissel; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71d
  - number: 71d.e
    text: de valutadatum van de creditering.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71d
  - number: 71e
    text: |-
      In geval van een door de betaler geïnitieerde afzonderlijke betalingstransactie uit hoofde van een raamovereenkomst
      voor betaaldiensten, verstrekt een betaaldienstverlener op verzoek van de betaler voor deze specifieke
      betalingstransactie inzichtelijke informatie over de volgende elementen:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71e
  - number: 71e.a
    text: de maximale uitvoeringstermijn;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71e
  - number: 71e.b
    text: de door de betaler verschuldigde kosten; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71e
  - number: 71e.c
    text: voor zover van toepassing, de verschuldigde kosten en de uitsplitsing van die kosten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71e
  - number: 71f.1
    text: |-
      Nadat het bedrag van een afzonderlijke betalingstransactie uit hoofde van een raamovereenkomst voor betaaldiensten
      van de betaalrekening van de betaler is gedebiteerd of, indien de betaler geen betaalrekening gebruikt, na
      ontvangst van de betaalopdracht, verstrekt de betaaldienstverlener van de betaler op de wijze bepaald in
      [artikel 59d, eerste en tweede lid][ref1], de betaler onverwijld de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59d
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59d
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 71f.1.a
    text: |-
      een referentie aan de hand waarvan de betaler kan bepalen welke betalingstransactie het betreft en, in voorkomend
      geval, informatie betreffende de betalingsbegunstigde;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71f
  - number: 71f.1.b
    text: |-
      het bedrag van de betalingstransactie in de valuta waarin de betaalrekening van de betaler wordt gedebiteerd of in
      de voor de betaalopdracht gebruikte valuta;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71f
  - number: 71f.1.c
    text: |-
      het bedrag van de voor de betalingstransactie door de betaler verschuldigde kosten en, voor zover van toepassing,
      de splitsing daarvan, ofwel de aan de betaler in rekening te brengen interesten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71f
  - number: 71f.1.d
    text: |-
      voor zover van toepassing, de door de betaaldienstverlener van de betaler bij de betalingstransactie gehanteerde
      wisselkoers, en het bedrag van de betalingstransactie na die valutawissel; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71f
  - number: 71f.1.e
    text: de valutadatum van de debitering of de datum van ontvangst van de betaalopdracht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71f
  - number: 71f.2
    text: |-
      Een raamovereenkomst voor betaaldiensten bevat de voorwaarde dat de betaler kan verlangen dat de in het eerste lid
      bedoelde informatie periodiek en ten minste eenmaal per maand kosteloos moet worden verstrekt of ter beschikking
      moet worden gesteld op de overeengekomen wijze en die de betaler de mogelijkheid biedt informatie ongewijzigd op te
      slaan en te reproduceren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71f
  - number: 71g.1
    text: |-
      Na de uitvoering van een afzonderlijke betalingstransactie verstrekt de betaaldienstverlener van de
      betalingsbegunstigde op de wijze als bepaald in [artikel 59d, eerste en tweede lid][ref1], de betalingsbegunstigde
      onverwijld de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59d
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71g
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59d
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 71g.1.a
    text: |-
      de referentie aan de hand waarvan de betalingsbegunstigde kan bepalen welke betalingstransactie het betreft en, in
      voorkomend geval, welke betaler het betreft, en alle bij de betalingstransactie gevoegde informatie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71g
  - number: 71g.1.b
    text: |-
      het bedrag van de betalingstransactie, in de valuta waarin de rekening van de betalingsbegunstigde wordt
      gecrediteerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71g
  - number: 71g.1.c
    text: |-
      het bedrag van de voor de betalingstransactie door de betaler verschuldigde kosten en, voor zover van toepassing,
      de splitsing daarvan, ofwel de aan de betalingsbegunstigde in rekening te brengen interesten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71g
  - number: 71g.1.d
    text: |-
      voor zover van toepassing, de door de betaaldienstverlener van de betalingsbegunstigde bij de betalingstransactie
      gehanteerde wisselkoers, en het bedrag van de betalingstransactie voor die valutawissel; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71g
  - number: 71g.1.e
    text: de valutadatum van de creditering.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71g
  - number: 71g.2
    text: |-
      In een raamovereenkomst voor betaaldiensten kan de voorwaarde worden opgenomen dat de in het eerste lid bedoelde
      informatie op gezette tijden en ten minste eenmaal per maand wordt verstrekt of ter beschikking wordt gesteld op
      een overeengekomen wijze die de betalingsbegunstigde de mogelijkheid biedt informatie ongewijzigd op te slaan en
      te reproduceren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71g
  - number: 71h.1
    text: |-
      Een betaaldienstverlener verstrekt de betaaldienstgebruiker op diens verzoek de in de
      [artikelen 71f, eerste lid][ref1], en [71g, eerste lid][ref2], bedoelde informatie eenmaal per maand schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel71f
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel71g
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71h
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 71f
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 71g
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 71h.2
    text: |-
      Een betaaldienstverlener verstrekt de consument ten minste jaarlijks een vergoedingenstaat als bedoeld in artikel
      5 van de richtlijn betaalrekeningen, op de in dat artikel omschreven wijze en met inachtneming van artikel 6 van
      die richtlijn.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71h
  - number: 71h.3
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van betaaldienstgebruikers aan wie via de website van de
      betaaldienstverlener de in het eerste lid bedoelde informatie wordt verstrekt, mits de betaaldienstgebruiker
      geheel of nagenoeg geheel via de website van deze betaaldienstverlener gebruik maakt van de door de desbetreffende
      betaaldienstverlener verleende betaaldiensten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71h
  - number: 71i.1
    text: |-
      Met betrekking tot betaalinstrumenten die overeenkomstig een raamovereenkomst voor betaaldiensten uitsluitend
      worden gebruikt voor afzonderlijke betalingstransacties van maximaal € 30, met een uitgavenlimiet van € 150 of
      waarop maximaal een bedrag van € 150 tegelijk kan worden opgeslagen verstrekt de betaaldienstverlener, in afwijking
      van [artikel 71e][ref1], de betaler uitsluitend informatie over de voornaamste kenmerken van de betaaldienst, met
      inbegrip van de wijze waarop van het betaalinstrument gebruik kan worden gemaakt, de aansprakelijkheid, alle in
      rekening gebrachte kosten en andere belangrijke informatie die nodig is om een weloverwogen besluit te nemen;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel71e
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71i
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 71e
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 71i.2
    text: |-
      Een betaaldienstverlener kan, in afwijking van de [artikelen 71f tot en met 71h][ref1], met de
      betaaldienstgebruiker overeenkomen dat de betaaldienstverlener na uitvoering van een betalingstransactie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel71f
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71i
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 71f
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 71i.2.1°
    text: |-
      uitsluitend een referentie verstrekt of beschikbaar stelt waarmee de betaaldienstgebruiker van de betaaldienst
      de betalingstransactie, het daarmee gemoeide bedrag en de kosten ervan kan identificeren, of in het geval van
      verschillende gelijkaardige betalingstransacties aan dezelfde betalingsbegunstigde, uitsluitend informatie over het
      totale bedrag en de kosten van deze betalingstransacties;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71i
  - number: 71i.2.2°
    text: |-
      niet verplicht is de onder 1° bedoelde informatie te verstrekken of beschikbaar te stellen als het betaalinstrument
      anoniem wordt gebruikt of als verstrekking hiervan voor de betaaldienstverlener uit technisch oogpunt onmogelijk
      is, waarbij de betaaldienstverlener de betaler echter een mogelijkheid biedt de opgeslagen bedragen te verifiëren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71i
  - number: 71i.2
    text: Voor nationale betalingstransacties worden de in het eerste lid genoemde bedragen verdubbeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71i
  - number: 71i.3
    text: |-
      Voor vooraf betaalde betaalinstrumenten, bedoeld voor nationale betalingstransacties, worden de in het eerste lid
      genoemde bedragen verhoogd tot € 500.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71i
  - number: 71j.1
    text: |-
      Indien een betalingsbegunstigde een vergoeding verlangt of een korting aanbiedt voor het gebruik van een bepaald
      betaalinstrument, informeert hij de betaler daarover voordat de betalingstransactie wordt geïnitieerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71j
  - number: 71j.2
    text: |-
      Indien een betaaldienstverlener of een derde een vergoeding verlangt voor het gebruik van een bepaald
      betaalinstrument, informeert hij de betaaldienstgebruiker daarover voordat de betalingstransactie wordt
      geïnitieerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71j
  - number: 71j.3
    text: |-
      De betaler is alleen verplicht om de in het eerste en tweede lid bedoelde vergoedingen te betalen indien het
      volledige bedrag ervan bekend is gemaakt voordat de betalingstransactie is geïnitieerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71j
  - number: 71k
    text: |-
      [Artikel 59g][ref1] is van overeenkomstige toepassing op de ingevolge de [artikelen 71b tot en met 71j][ref2] te
      verstrekken of ter beschikking te stellen informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel59g
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel71b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71k
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 59g
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 71b
        hoofdstuk: '8'
        paragraaf: 8.1.6
        afdeling: '8.1'
  - number: 71l
    text: |-
      Een betaalinstelling of een elektronischgeldinstelling draagt er zorg voor dat betaaldienstagenten die voor haar
      rekening handelen, de betaaldienstgebruiker daarvan in kennis stellen. Zij draagt er tevens zorg voor dat haar
      bijkantoren de betaaldienstgebruiker in kennis stellen van het feit bijkantoor te zijn van de betaalinstelling,
      onderscheidenlijk de elektronischgeldinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel71l
  - number: '72.1'
    text: |-
      Een gevolmachtigde agent of ondergevolmachtigde agent die voor rekening van een verzekeraar een verzekering heeft
      gesloten, vermeldt in de polis dan wel in een daaraan toegevoegd aanhangsel de naam van de verzekeraar en, in geval
      van co-assurantie, het aandeel dat hij namens de verzekeraar heeft geaccepteerd. In geval van een schadeverzekering
      vermeldt hij tevens elke wijziging in het door hem namens de verzekeraar geaccepteerde aandeel in een aanhangsel.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel72
  - number: '72.2'
    text: |-
      Wordt, nadat de gevolmachtigde agent of ondergevolmachtigde agent de verzekering heeft gesloten of, in geval van
      een schadeverzekering, het door de gevolmachtigde agent onderscheidenlijk ondergevolmachtigde agent geaccepteerde
      aandeel in de verzekering is gewijzigd, niet of niet onverwijld aan de cliënt een polis of aanhangsel gegeven,
      dan verstrekt de gevolmachtigde agent onderscheidenlijk de ondergevolmachtigde agent de in het eerste lid bedoelde
      gegevens aan de cliënt binnen vier weken na het sluiten van de verzekering of na het aanbrengen van de wijziging.
      Behoort de verzekering evenwel tot de portefeuille van een bemiddelaar, dan verstrekt de gevolmachtigde agent
      onderscheidenlijk de ondergevolmachtigde agent deze gegevens binnen twee weken aan deze bemiddelaar.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel72
  - number: '72.3'
    text: |-
      Wordt, nadat een verzekering is gesloten of, in geval van een schadeverzekering, het door de verzekeraar
      geaccepteerde aandeel in de overeenkomst is gewijzigd, niet of niet onverwijld aan de cliënt een polis of
      aanhangsel afgegeven waarin de naam van de verzekeraar en, in geval van co-assurantie, diens aandeel of daarin
      aangebrachte wijziging is vermeld, dan verstrekt de bemiddelaar tot wiens portefeuille de verzekering behoort deze
      gegevens binnen vier weken na het sluiten van de overeenkomst of na het aanbrengen van de wijziging aan de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel72
  - number: '72.4'
    text: |-
      Het tweede en derde lid zijn niet van toepassing indien binnen de desbetreffende termijn de verzekering is
      tenietgegaan en daaraan door de cliënt of andere belanghebbenden geen rechten meer kunnen worden ontleend.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel72
  - number: '72.5'
    text: |-
      De gevolmachtigde agent onderscheidenlijk ondergevolmachtigde agent of de betrokken bemiddelaar stelt de cliënt
      desgevraagd onverwijld in kennis van de naam van de verzekeraar en, in geval van co-assurantie, van de aandelen die
      de verzekeraars hebben geaccepteerd of van wijzigingen die daarin zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel72
  - number: 72a
    text: |-
      Indien een financiëledienstverlener een cliënt voorafgaand aan het advies heeft medegedeeld dat hij een
      periodieke beoordeling ontvangt van de geschiktheid van de verzekering met een beleggingscomponent die
      de financiëledienstverlener heeft geadviseerd, wordt door de financiëledienstverlener een bijgewerkte
      geschiktheidsverklaring verstrekt als bedoeld in [artikel 4:23, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '73.1'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een levensverzekering verstrekt een levensverzekeraar de cliënt,
      voorzover van toepassing, ten minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: 73.1.a
    text: iedere wijziging van zijn handelsnaam of handelsnamen, statutaire naam, rechtsvorm of adres;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: 73.1.b
    text: iedere wijziging van de polisvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: 73.1.c
    text: |-
      voorzover zulks niet blijkt uit een wijziging van de polisvoorwaarden: iedere wijziging van
      de overeenkomst met betrekking tot de in de [artikelen 57, eerste lid, onderdeel c][ref1], en
      [artikel 60, eerste lid, onderdelen b tot en met m, en o tot en met s][ref2], bedoelde onderwerpen of van de op die
      onderdelen van toepassing zijnde regelgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 73.1.d
    text: |-
      de jaarlijkse winstdeling alsmede, indien de verzekeraar cijfers over de mogelijke toekomstige ontwikkeling van
      de winstdeling heeft verstrekt, de eventuele afwijking tussen de feitelijke ontwikkeling van de winstdeling en de
      eerder verstrekte informatie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: 73.1.e
    text: |-
      indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling of icbe: een jaarlijkse
      opgave over het voorafgaande jaar van:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: 73.1.e.1°
    text: de waarde-ontwikkeling van het opgebouwde kapitaal;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: 73.1.e.2°
    text: |-
      de door de cliënt betaalde premies, bedoeld in [artikel 60, eerste lid, onderdeel i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 73.1.e.3°
    text: |-
      de met de cliënt verrekende kosten, bedoeld in [artikel 60, eerste lid, onderdeel l, onder 1°, 2° en 3°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 73.1.e.4°
    text: het op het opgebouwde kapitaal behaalde rendement;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: 73.1.f
    text: |-
      indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling of icbe: een jaarlijkse
      prognose van de hoogte van het eindkapitaal op basis van:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: 73.1.f.1°
    text: |-
      een pessimistische voorspelling of het historisch rendement indien de levensverzekering is afgesloten voor
      1 januari 2018; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: 73.1.f.2°
    text: een ongunstig of een gematigd scenario indien de levensverzekering is afgesloten op of na 1 januari 2018;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: 73.1.g
    text: |-
      indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling of icbe: het gevoerde
      beheer van de beleggingsinstelling of icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: 73.1.h
    text: |-
      indien de cliënt daarom verzoekt: een opgave van de premievrije waarde op de einddatum van de verzekering,
      onder vermelding van het voor de berekening gehanteerde rendementspercentage, of een opgave van de wegens afkoop
      verschuldigde kosten en de actuele afkoopwaarde.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: '73.2'
    text: |-
      Indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling of icbe verstrekt
      de levensverzekeraar, onverminderd het eerste lid, aanhef en onderdeel h, aan de cliënt die verzoekt zijn
      premie te verhogen of te verlagen of zijn polis premievrij te maken: een aan de nieuwe premie aangepaste opgave
      overeenkomstig [artikel 60, eerste lid, onderdeel l, onder 1°, 2° en 3°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: '73.3'
    text: |-
      Het eerste lid, aanhef en onderdelen e, f en h, en het tweede lid zijn niet van toepassing indien de cliënt een
      werkgever is die de overeenkomst heeft afgesloten ten behoeve van zijn werknemers in verband met een door hem
      toegezegd pensioen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: '73.4'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de wijze van berekening van de jaarlijkse
      prognose, bedoeld in het eerste lid, onderdeel f.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel73
  - number: '74'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een natura-uitvaartverzekering of een overeenkomst die strekt
      tot fondsvorming ter voldoening van de verzorging van de uitvaart van een natuurlijke persoon verstrekt een natura-
      uitvaartverzekeraar de cliënt, voorzover van toepassing, ten minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel74
  - number: 74.a
    text: iedere wijziging van zijn handelsnaam of handelsnamen, statutaire naam, rechtsvorm of adres;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel74
  - number: 74.b
    text: iedere wijziging van de polisvoorwaarden; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel74
  - number: 74.c
    text: |-
      voorzover zulks niet blijkt uit een wijziging van de polisvoorwaarden: iedere wijziging van
      de overeenkomst ten aanzien van de in de [artikelen 57, eerste lid, onderdeel c][ref1], en
      [63, eerste lid, onderdelen b tot en met h, j en l][ref2] bedoelde onderwerpen of van de op die onderdelen van
      toepassing zijnde regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel63
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '63'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: '75'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een schadeverzekering stelt een schadeverzekeraar met zetel
      buiten Nederland die de branche Aansprakelijkheid Motorrijtuigen uitoefent door middel van het verrichten van
      diensten naar Nederland de cliënt binnen twee weken in kennis van een wijziging in de naam of het adres van de
      schade-afhandelaar, bedoeld in [artikel 4:71, eerste lid, onderdeel e, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '76.1'
    text: |-
      Een financiëledienstverlener die financiële diensten verleent met betrekking tot een verzekering met een
      beleggingscomponent verstrekt de cliënt periodiek rapporten over de door hem verleende dienstverlening op een
      duurzame drager.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel76
  - number: '76.2'
    text: |-
      De rapporten, bedoeld in het eerste lid, bevatten mededelingen aan cliënten rekening houdend met het type en
      de complexiteit van de desbetreffende verzekering met een beleggingscomponent en de aard van de aan de cliënt
      verleende dienst en, in voorkomend geval, de kosten van transacties en de diensten die voor rekening van de cliënt
      zijn verricht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel76
  - number: '76.3'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een verzekering met een beleggingscomponent verstrekt de
      financiëledienstverlener de cliënt jaarlijks informatie over alle gemaakte kosten en lasten die verbonden zijn aan
      de verzekering met een beleggingscomponent en de verleende financiële diensten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel76
  - number: '77.1'
    text: |-
      In afwijking van [artikel 57][ref1] en onverminderd de [artikelen 60 tot en met 63][ref2] verstrekt een
      financiëledienstverlener een consument voorafgaand aan de totstandkoming van een overeenkomst op afstand, voorzover
      van toepassing, ten minste de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 77.1.a
    text: |-
      zijn naam en adres, de hoedanigheid waarin hij optreedt tegenover de consument en, indien de
      financiëledienstverlener een rechtspersoon is, de statutaire naam en handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.b
    text: de aard van zijn financiële dienstverlening;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.c
    text: |-
      voorzover [artikel 4:17 van de wet][ref1] van toepassing is: zijn interne klachtenprocedure, bedoeld in
      [artikel 4:17, eerste lid, onderdeel a, van de wet][ref2] en de erkende geschilleninstantie waarbij hij is
      aangesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 77.1.d
    text: zijn inschrijving in het door de toezichthouder gehouden register;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.e
    text: het nummer van de inschrijving in het handelsregister;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.f
    text: de belangrijkste kenmerken van het financiële product;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.g
    text: de risico’s die met het financiële product samenhangen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.h
    text: |-
      de totale kosten of, wanneer de exacte kosten niet kunnen worden genoemd, de grondslag voor de berekening van de
      kosten, zodat de consument de kosten kan verifiëren;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.i
    text: |-
      de omstandigheid dat de consument andere bedragen verschuldigd kan zijn die niet via de financiëledienstverlener
      worden betaald of door hem worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.j
    text: de extra kosten voor het gebruik van een techniek voor communicatie op afstand;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.k
    text: de wijze van betaling door de consument en de wijze van uitvoering van de overeenkomst op afstand;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.l
    text: beperkingen in de geldigheidsduur van de verstrekte informatie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.m
    text: de minimale looptijd van de overeenkomst op afstand;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.n
    text: |-
      het contractuele recht op tussentijdse beëindiging van de overeenkomst op afstand en de eventuele boete verbonden
      aan de uitoefening van dat recht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.o
    text: |-
      het feit dat het in [artikel 4:28, eerste en tweede lid, van de wet][ref1] bedoelde recht wel of niet van
      toepassing is, de duur van en de voorwaarden voor de uitoefening van dat recht, met inbegrip van informatie over
      het bedrag dat de consument gehouden kan zijn te betalen, de gevolgen van niet-uitoefening van dat recht en de
      wijze waarop dat recht kan worden uitgeoefend;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 77.1.p
    text: |-
      het bestaan van op de overeenkomst op afstand toepasselijke garantiefondsen of andere compensatieregelingen die
      niet vallen onder [richtlijn nr. 1994/19/EG](31994L0019) van het Europees Parlement en de Raad van de Europese Unie
      van 30 mei 1994 inzake de depositogarantiestelsels (PbEG L 135) en [richtlijn nr. 1997/9/EG](31997L0009) van het
      Europees Parlement en de Raad van de Europese Unie van 3 maart 1997 inzake de beleggerscompensatiestelsels (PbEG
      L 084);
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.q
    text: |-
      de taal of de talen waarin de voorwaarden van de overeenkomst op afstand en de in dit artikel bedoelde informatie
      worden verstrekt, alsmede de taal of talen waarin de financiëledienstverlener zal communiceren gedurende de
      looptijd van de overeenkomst op afstand;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.r
    text: |-
      het op de totstandbrenging van betrekkingen met de consument voorafgaand aan de totstandkoming van de overeenkomst
      op afstand toe te passen recht, het op die overeenkomst toe te passen recht en de bevoegde rechter;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.s
    text: de overige voorwaarden van de overeenkomst op afstand; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: 77.1.t
    text: |-
      indien hij gebruik maakt van een andere beroepsbeoefenaar, de naam en adres van deze beroepsbeoefenaar en, indien
      deze een rechtspersoon is, diens statutaire naam en handelsnaam of handelsnamen, en de hoedanigheid waarin deze
      tegenover de consument optreedt
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
  - number: '77.2'
    text: |-
      Een financiëledienstverlener die financiële diensten verleent met betrekking tot levensverzekeringen voldoet
      aan het eerste lid, aanhef en onderdelen f, g, h, m, n en s, door het verstrekken van de informatie, bedoeld in
      [artikel 60, eerste lid, onderdelen h, i, l, m, n, o, p, r, s en t][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel60
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '60'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: '77.3'
    text: |-
      Een financiëledienstverlener die financiële diensten verleent met betrekking tot natura-uitvaartverzekeringen
      voldoet aan het eerste lid, aanhef en onderdeel n, door het verstrekken van de informatie, bedoeld in
      [artikel 63, eerste lid, onderdelen h, i, en j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel63
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '63'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: '77.4'
    text: |-
      Een financiëledienstverlener die financiële diensten verleent met betrekking tot consumptief krediet voldoet aan
      het eerste lid door het verstrekken van de informatie, bedoeld in [artikel 112, eerste en tweede lid][ref1], of,
      indien het krediet in de vorm van een geoorloofde debetstand wordt verleend waarbij is overeengekomen dat de ter
      zake verschuldigde betaling van de consument op verzoek of binnen een termijn van één tot drie maanden plaatsvindt,
      door het verstrekken van de informatie, bedoeld in [artikel 112a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel112a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '112'
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 112a
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
  - number: '77.5'
    text: |-
      Een financiëledienstverlener die financiële diensten verleent met betrekking tot effectenkrediet voldoet aan het
      eerste lid door het verstrekken van de informatie zoals opgenomen in [bijlage F][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '77.6'
    text: |-
      Een financiëledienstverlener die financiële diensten verleent met betrekking tot hypothecair krediet voldoet aan
      het bepaalde ingevolge het eerste lid door het verstrekken van de informatie, bedoeld in [artikel 112d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel112d
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 112d
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
  - number: '78.1'
    text: |-
      Indien een overeenkomst op afstand op verzoek van de consument tot stand is gekomen met gebruikmaking van een
      techniek voor communicatie op afstand waarmee de in [artikel 77][ref1] bedoelde informatie niet schriftelijk of
      via een andere duurzame drager als bedoeld in [artikel 49, eerste lid][ref2], of [artikel 49a, tweede lid][ref3],
      voorafgaand aan de totstandkoming van de overeenkomst kan worden verstrekt, kan de financiëledienstverlener de
      informatie onmiddellijk na de totstandkoming van de overeenkomst op afstand aan de consument verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel49a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: 8.1.7
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 49a
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
  - number: '78.2'
    text: |-
      In afwijking van [artikel 77, eerste lid, aanhef][ref1], verstrekt de financiëledienstverlener een consument de in
      dat artikel bedoelde informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel77
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: 8.1.7
        afdeling: '8.1'
  - number: 78.2.a
    text: |-
      indien het een overeenkomst op afstand inzake een schadeverzekering betreft, uiterlijk tegelijk met het afgeven van
      de polis;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel78
  - number: 78.2.b
    text: |-
      indien het een overeenkomst op afstand inzake een levensverzekering, inzake een natura-uitvaartverzekering of
      een overeenkomst op afstand die strekt tot fondsvorming ter voldoening van de verzorging van de uitvaart van
      een natuurlijke persoon betreft, uiterlijk tegelijk met het afgeven van de polis. Indien het een overeenkomst op
      afstand inzake een levensverzekering of een overeenkomst op afstand die strekt tot fondsvorming ter voldoening van
      de verzorging van de uitvaart van een natuurlijke persoon waarvan de waarde afhankelijk is van de ontwikkeling op
      financiële markten betreft, heeft de consument het recht zonder een boete verschuldigd te zijn en zonder opgave
      van redenen de overeenkomst binnen dertig kalenderdagen na de dag waarop hij de informatie heeft ontvangen,
      terugwerkend tot de datum van het tot stand komen van de overeenkomst, te ontbinden en wordt de consument door de
      financiëledienstverlener geïnformeerd over de wijze waarop hij gebruik kan maken van dat recht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel78
  - number: '78.3'
    text: |-
      Voorzover het financiële risico ingevolge een overeenkomst op afstand inzake een levensverzekering voor rekening
      van de consument is, kan de financiëledienstverlener met de consument overeenkomen dat de eventueel na de
      totstandkoming van de overeenkomst opgetreden waardevermeerdering of -vermindering van de beleggingen voor
      rekening van de consument blijft indien deze de overeenkomst terugwerkend tot de datum van de totstandkoming van de
      overeenkomst ontbindt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel78
  - number: '78.4'
    text: |-
      Natura-uitvaartverzekeraars die overeenkomsten op afstand aangaan die strekken tot fondsvorming ter voldoening
      van de verzorging van de uitvaart van de mens en die overeenkomstig het tweede lid, onderdeel b, de in dat lid
      bedoelde informatie uiterlijk tegelijk met het afgeven van de polis verstrekken, komen met de consument overeen
      dat de eventueel na de totstandkoming van de overeenkomst opgetreden waardevermeerdering of -vermindering van
      de beleggingen voor rekening van de consument blijft, indien deze ingevolge het tweede lid, onderdeel b, de
      overeenkomst terugwerkend tot de datum van de totstandkoming van de overeenkomst ontbindt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel78
  - number: '79.1'
    text: |-
      Een financiëledienstverlener deelt aan een consument bij het gebruik van de telefoon voor het doen van ongevraagde
      oproepen ter bevordering van de totstandkoming van een overeenkomst op afstand, aan het begin van elk gesprek
      duidelijk de identiteit van de financiëledienstverlener, alsmede het commerciële oogmerk van de oproep mee. In
      afwijking van [artikel 77][ref1], kan de financiëledienstverlener in dergelijke oproepen, indien de consument
      daarmee uitdrukkelijk instemt, volstaan met het informeren van de consument over:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel77
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: 8.1.7
        afdeling: '8.1'
  - number: 79.1.a
    text: |-
      de identiteit van de persoon die in contact staat met de consument en de relatie van deze persoon met de
      financiëledienstverlener;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.1.b
    text: de belangrijkste kenmerken van het financiële product of de financiële dienst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.1.c
    text: |-
      de totale kosten, of, wanneer de exacte kosten niet kunnen worden genoemd, de grondslag voor de berekening van de
      kosten, zodat de consument de kosten kan verifiëren;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.1.d
    text: |-
      de omstandigheid dat de consument andere bedragen verschuldigd kan zijn die niet via de financiëledienstverlener
      worden betaald of door hem worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.1.e
    text: |-
      de toepasselijkheid van het in [artikel 4:28, eerste en tweede lid, van de wet][ref1] bedoelde recht, de duur van
      en de voorwaarden voor de uitoefening van dat recht, met inbegrip van informatie over het bedrag dat de consument
      gehouden kan zijn te betalen, de gevolgen van niet-uitoefening van dat recht; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 79.1.f
    text: |-
      de omstandigheid dat op verzoek van de consument andere informatie beschikbaar is, waarbij de aard van die
      informatie aan de consument wordt medegedeeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: '79.2'
    text: |-
      Ten aanzien van consumptief krediet dat op verzoek van de consument met onmiddellijke ingang beschikbaar
      wordt gesteld, anders dan in de vorm van een geoorloofde debetstand waarbij is overeengekomen dat de ter zake
      verschuldigde betaling van de consument op verzoek of binnen een termijn van één tot drie maanden plaatsvindt, zijn
      de belangrijkste kenmerken, bedoeld in het eerste lid, onderdeel b, de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.2.a
    text: het jaarlijks kostenpercentage berekend voor een representatief voorbeeld;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.2.b
    text: het totale door de consument te betalen bedrag;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.2.c
    text: het totale kredietbedrag en de voorwaarden voor kredietopneming;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.2.d
    text: de duur van de kredietovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.2.e
    text: in geval van goederenkrediet, de roerende zaak of de dienst en de contante prijs daarvan;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.2.f
    text: |-
      de debetrentevoet, de voorwaarden die de toepassing van deze rentevoet regelen, en, voor zover beschikbaar, indices
      of referentierentevoeten die betrekking hebben op de aanvankelijke debetrentevoet, en de termijnen, de voorwaarden
      en de procedure voor wijziging daarvan; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.2.g
    text: |-
      het bedrag, het aantal en de frequentie van de door de consument te verrichten betalingen, en, indien van
      toepassing, de volgorde waarin de betalingen aan de verschillende openstaande saldi tegen verschillende
      debetrentevoeten worden toegerekend met het oog op de aflossing.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: '79.3'
    text: |-
      Ten aanzien van consumptief krediet in de vorm van een geoorloofde debetstand waarbij is overeengekomen
      dat de ter zake verschuldigde betaling van de consument op verzoek of binnen een termijn van één tot
      drie maanden plaatsvindt, zijn de belangrijkste kenmerken, bedoeld in het eerste lid, onderdeel b, de in
      [artikel 112a, tweede lid, onderdelen c, e, f en g][ref1], bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel112a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 112a
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
  - number: '79.4'
    text: |-
      Ten aanzien van effectenkrediet zijn de belangrijkste kenmerken, bedoeld in het eerste lid, onderdeel b, de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.4.a
    text: |-
      de debetrentevoet, de voorwaarden die de toepassing van deze rentevoet regelen, en, voor zover beschikbaar, indices
      of referentierentevoeten die betrekking hebben op de aanvankelijke debetrentevoet, en de termijnen, de voorwaarden
      en de procedure voor wijziging daarvan; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.4.b
    text: |-
      dat het krediet wordt verleend of toegezegd tegen onderpand van financiële instrumenten en dat de kredietlimiet
      afhankelijk is van een bepaald dekkingspercentage en indien van toepassing, bepaalde spreidingseisen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: 79.4.c
    text: |-
      welk dekkingspercentage en welke spreidingseisen worden gehanteerd ten aanzien van de in onderpand gegeven
      financiële instrumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
  - number: '79.5'
    text: |-
      Ten aanzien van hypothecair krediet zijn de belangrijkste kenmerken, bedoeld in het eerste lid, onderdeel b, de in
      [bijlage K][ref1], deel A, onderdelen 3 tot en met 6, genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '79.6'
    text: |-
      Indien een overeenkomst op afstand tot stand komt via spraaktelefonie, verstrekt een financiëledienstverlener de
      in [artikel 77, eerste lid][ref1], bedoelde informatie onmiddellijk na de totstandkoming van de overeenkomst op
      afstand aan de consument. Voorzover het een overeenkomst inzake een levensverzekering, natura-uitvaartverzekering
      of schadeverzekering betreft, is [artikel 78, tweede lid, aanhef en onderdeel a][ref2], onderscheidenlijk het
      tweede lid, aanhef en onderdeel b, of het derde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel78
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: 8.1.7
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '78'
        hoofdstuk: '8'
        paragraaf: 8.1.7
        afdeling: '8.1'
  - number: '79.7'
    text: |-
      [Artikel 49, eerste lid, eerste volzin][ref1], is niet van toepassing op het verstrekken van informatie als bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel49
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
  - number: '80'
    text: |-
      Gedurende de looptijd van een overeenkomst op afstand verstrekt een financiëledienstverlener aan de consument op
      diens verzoek de voorwaarden van de overeenkomst. Voorts kan de consument het gebruik van een ander middel van
      communicatie op afstand verlangen, tenzij dat niet met de tot stand gekomen overeenkomst op afstand te verenigen
      is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80
  - number: 80.0a.1
    text: |-
      Indien de overeenkomst tot aankoop of verkoop van een financieel instrument wordt gesloten door
      middel van een techniek voor communicatie op afstand die belet dat de informatie, bedoeld in
      [artikel 4:23, derde lid, van de wet][ref1], of informatie over de kosten en lasten als bedoeld in
      [artikel 58, eerste en derde lid][ref2], van dit besluit gelijktijdig met het advies of voorafgaand aan het
      verrichten van de transactie op een duurzame drager kan worden verstrekt, kan de beleggingsonderneming de
      informatie op een duurzame drager verstrekken onmiddellijk na het verrichten van de transactie aan de consument,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel58
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80.0a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '58'
        hoofdstuk: '8'
        paragraaf: 8.1.4
        afdeling: '8.1'
  - number: 80.0a.1.a
    text: |-
      de consument heeft ingestemd met de ontvangst van de informatie zonder onnodige vertraging na het verrichten van
      de transactie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80.0a
  - number: 80.0a.1.b
    text: |-
      de beleggingsonderneming de consument de mogelijkheid heeft geboden de transactie uit te stellen teneinde de
      informatie vooraf te ontvangen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80.0a
  - number: 80.0a.2
    text: |-
      In aanvulling op het eerste lid biedt de beleggingsonderneming de niet-professionele belegger de mogelijkheid
      informatie over de kosten en lasten voorafgaand aan het verrichten van de transactie telefonisch te ontvangen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80.0a
  - number: 80.0a.3
    text: |-
      Indien een overeenkomst met betrekking tot een verzekering met een beleggingscomponent wordt gesloten door
      middel van een techniek voor communicatie op afstand die belet dat de geschiktheidsverklaring, bedoeld in
      [artikel 4:23, derde lid, van de wet][ref1] voorafgaand aan het sluiten van de overeenkomst op een duurzame drager
      kan worden verstrekt, kan de geschiktheidsverklaring op een duurzame drager worden verstrekt onmiddellijk na de
      totstandkoming van de overeenkomst op afstand indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80.0a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 80.0a.3.a
    text: |-
      de cliënt heeft ingestemd met de ontvangst van de geschiktheidsverklaring onmiddellijk na het sluiten van de
      overeenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80.0a
  - number: 80.0a.3.b
    text: |-
      de financiëledienstverlener de cliënt de mogelijkheid heeft geboden de sluiting van de overeenkomst uit te stellen
      teneinde de geschiktheidsverklaring vooraf te ontvangen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80.0a
  - number: 80d
    text: |-
      Als financieel instrument in de zin van [artikel 4:24, vijfde lid, aanhef en onderdeel f, van de wet][ref1] worden
      aangewezen financiële instrumenten die voldoen aan de voorwaarden, bedoeld in artikel 57 van de gedelegeerde
      verordening markten voor financiële instrumenten 2014 inzake organisatorische eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 80e.1
    text: |-
      Een financiëledienstverlener die, zonder daarbij te adviseren, een betalingsbeschermer, complex product,
      hypothecair krediet, individuele arbeidsongeschiktheidsverzekering of een bij ministeriële regeling aan te wijzen
      ander financieel product aanbiedt, bemiddelt of ten aanzien van dit financieel product optreedt als gevolmachtigde
      agent, stelt bij de beoordeling van de passendheid, bedoeld in [artikel 4:24, eerste lid, van de wet][ref1],
      voorafgaand aan de dienstverlening vast of de consument of cliënt over voldoende kennis en ervaring beschikt om te
      begrijpen welke risico’s zijn verbonden aan het desbetreffende financieel product en het verlenen van de betrokken
      financiële dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80e
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 80e.2
    text: |-
      Het eerste lid is niet van toepassing op aanbieders van hypothecair krediet die, zonder daarbij te adviseren,
      een aanvullend hypothecair krediet van ten hoogste € 25.000 aanbieden indien het aanvullend hypothecair krediet
      aantoonbaar wordt aangewend voor de financiering van energiebesparende voorzieningen in een woning en de consument
      het aanvullend hypothecair krediet aanvraagt binnen vijf jaar na afsluiten van het hypothecair krediet dat reeds op
      de woning is gevestigd en dit hypothecair krediet is aangegaan bij dezelfde aanbieder.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80e
  - number: 80e.3
    text: |-
      Onder energiebesparende voorzieningen als bedoeld in het tweede lid wordt verstaan: gevelisolatie, dakisolatie,
      vloerisolatie, leidingisolatie, hoogrendementbeglazing (ten minste HR ++), energiezuinige deuren, kozijnen en
      daarmee gelijk te stellen constructieonderdelen indien deze voorzieningen worden getroffen in combinatie met
      hoogrendementbeglazing (ten minste HR ++), douche-warmteterugwinningsysteem, energiezuinig ventilatiesysteem
      indien deze voorziening wordt getroffen in combinatie met andere energiebesparende voorzieningen, warmtepompen,
      zonnecellen of een combinatie van de genoemde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80e
  - number: 80f.1
    text: |-
      Het inwinnen van informatie over de kennis en ervaring van de consument of cliënt, bedoeld in
      [artikel 4:24, eerste lid, van de wet][ref1], is wat de hoeveelheid betreft evenredig aan de aard en complexiteit
      van het financieel product en de daarmee samenhangende risico’s. In ieder geval wordt informatie ingewonnen over:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 80f.1.a
    text: de financiële producten waarmee de consument of cliënt bekend is;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80f
  - number: 80f.1.b
    text: |-
      het inzicht van de consument of cliënt in de eigenschappen en risico’s van het desbetreffende financieel product en
      de financiële dienst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80f
  - number: 80f.1.c
    text: de mate waarin de consument of cliënt inzicht heeft in zijn eigen financiële situatie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80f
  - number: 80f.1.d
    text: de behoefte van de consument of cliënt aan advies over het desbetreffende financieel product.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80f
  - number: 80f.2
    text: |-
      In de waarschuwing, bedoeld in [artikel 4:24, derde lid, van de wet][ref1] wijst de financiëledienstverlener de
      consument of cliënt erop dat het inwinnen van advies raadzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 80f.3
    text: |-
      Een financiëledienstverlener mag vertrouwen op de door de consument of de cliënt verstrekte informatie over de in
      het eerste lid genoemde onderwerpen, tenzij hij weet of redelijkerwijs kan vermoeden dat deze informatie gedateerd,
      onnauwkeurig of onvolledig is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80f
  - number: 80f.4
    text: |-
      Indien meerdere financiëledienstverleners betrokken zijn bij het verlenen van de financiële dienst aan de
      consument of cliënt wordt de informatie, bedoeld in het eerste lid, ingewonnen door de financiëledienstverlener die
      rechtstreeks door de consument of cliënt is benaderd voor het verlenen van de financiële dienst.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80f
  - number: 80f.5
    text: |-
      Indien sprake is van het verlenen van een financiële dienst in combinatie met een andere financiële dienst of
      financieel product dient bij de beoordeling van de passendheid te worden nagegaan of de gehele dienstverlening of
      de combinatie van de financiële dienst en het financieel product passend is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80f
  - number: 80f.6
    text: |-
      De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot de wijze waarop de informatie over de
      kennis en ervaring, bedoeld in het eerste lid, wordt ingewonnen bij de consument of cliënt alsmede de formulering
      van de waarschuwing, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel80f
  - number: '81.1'
    text: |-
      Het gebruik van automatische oproepsystemen zonder menselijke tussenkomst, faxen of elektronische berichten
      voor het overbrengen van ongevraagde informatie aan een consument, ter bevordering van de totstandkoming van een
      overeenkomst op afstand, is uitsluitend toegestaan indien de consument daarvoor voorafgaand toestemming heeft
      verleend. Er zijn voor de consument geen kosten verbonden aan het verlenen van deze toestemming.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81
  - number: '81.2'
    text: |-
      Het gebruik van andere dan de in het eerste lid genoemde technieken voor communicatie op afstand voor het
      overbrengen van ongevraagde informatie of het doen van ongevraagde mededelingen aan een consument, ter bevordering
      van de totstandkoming van een overeenkomst op afstand, is toegestaan, tenzij de desbetreffende consument te kennen
      heeft gegeven dat hij informatie of mededelingen waarbij van deze technieken gebruik wordt gemaakt, niet wenst te
      ontvangen. Er zijn voor de consument geen kosten verbonden aan voorzieningen waarmee wordt voorkomen dat aan een
      consument ongevraagde informatie wordt overgebracht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81
  - number: '81.3'
    text: |-
      Een financiële onderneming die elektronische contactgegevens voor elektronische berichten heeft verkregen in
      het kader van de verkoop van een financieel product of het verlenen van een financiële dienst mag deze gegevens
      gebruiken voor het overbrengen van informatie ter bevordering van de totstandkoming van een overeenkomst op afstand
      met betrekking tot eigen gelijksoortige financiële producten of financiële diensten, indien bij de verkrijging
      van de contactgegevens aan de consument duidelijk en uitdrukkelijk de gelegenheid is geboden om kosteloos en op
      gemakkelijke wijze bezwaar in de zin van artikel 21 van de Algemene verordening gegevensbescherming aan te tekenen
      tegen het gebruik van die elektronische contactgegevens, en, indien de consument hiervan geen gebruik heeft
      gemaakt, hem bij elke tot stand gebrachte communicatie de mogelijkheid wordt geboden om onder dezelfde voorwaarden
      bezwaar in de zin van artikel 21 van de Algemene verordening gegevensbescherming aan te tekenen tegen het verdere
      gebruik van zijn elektronische contactgegevens.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81
  - number: '81.4'
    text: |-
      Bij het gebruik van elektronische berichten ter bevordering van de totstandkoming van een overeenkomst op afstand
      dienen telkens de volgende gegevens te worden vermeld:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81
  - number: 81.4.a
    text: de werkelijke identiteit van degene namens wie de communicatie wordt overgebracht, en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81
  - number: 81.4.b
    text: |-
      een geldig postadres of nummer waaraan de ontvanger een verzoek tot beëindiging van dergelijke communicatie kan
      richten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81
  - number: 81a
    text: |-
      Een aanbieder van een hypothecair krediet offreert voor een consument die voornemens is een overeenkomst inzake een
      hypothecair krediet aan te gaan dezelfde debetrentevoet bij dezelfde rentevastperiode als voor een consument aan
      wie op dat moment een aanbod wordt gedaan voor de komende rentevastperiode bij een vergelijkbaar risicoprofiel.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81a
  - number: 81b.1
    text: |-
      Een levensverzekeraar spant zich jegens cliënten met een levensverzekering die een beleggingscomponent bevat en
      voor 1 januari 2013 is afgesloten, aantoonbaar in om hen een weloverwogen keuze te laten maken tot voortzetting,
      wijziging of stopzetting van die verzekering. Daartoe draagt hij er zorg voor dat bedoelde cliënten:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81b
  - number: 81b.1.a
    text: 'over adequate informatie beschikken met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81b
  - number: 81b.1.a.1°
    text: |-
      de kenmerken alsmede de huidige en verwachte toekomstige financiële gevolgen van de verzekering in relatie tot het
      doel van de cliënt bij het afsluiten van de verzekering;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81b
  - number: 81b.1.a.2°
    text: |-
      de mogelijkheden om de verzekering te wijzigen, zodat deze meer aansluit bij het in onderdeel a bedoelde doel van
      de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81b
  - number: 81b.1.b
    text: |-
      uitdrukkelijk de keuze, en consequenties van die keuze, tot voortzetting, wijziging of stopzetting van de in het
      eerste lid bedoelde verzekering wordt voorgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81b
  - number: 81b.2
    text: |-
      Tevens legt de levensverzekeraar de aan de cliënt verstrekte, alsmede de van de cliënt ontvangen, informatie en de
      door de cliënt gemaakte keuze vast.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81b
  - number: 81b.3
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot het bepaalde in het eerste en tweede
      lid, waarbij de met betrekking tot de in het eerste lid bedoelde inspanningsverplichting te stellen regels zowel
      betrekking kunnen hebben op de inspanningen die in de relatie met individuele cliënten van een levensverzekeraar
      worden gevergd, als op minimale omvang van de inspanningen ten aanzien van de totale groep cliënten met een
      verzekering als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81b
  - number: 81b.4
    text: |-
      De levensverzekeraar maakt, per groep cliënten binnen een bepaalde categorie levensverzekering met een
      beleggingscomponent, de resultaten van de in het eerste lid bedoelde inspanningen openbaar. De Autoriteit
      Financiële Markten kan dienaangaande nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81b
  - number: 81c.1
    text: |-
      Een hypothecair krediet kan vervroegd worden afgelost. Onder vervroegde aflossing wordt verstaan de gehele
      of gedeeltelijke aflossing van een hypothecair krediet voorafgaand aan het verstrijken van de looptijd van de
      kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81c
  - number: 81c.2
    text: |-
      De aanbieder van hypothecair krediet rekent geen vergoeding voor vervroegde aflossing van het hypothecair krediet
      die hoger is dan het financiële nadeel dat de aanbieder heeft bij vervroegde aflossing.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81c
  - number: 81c.3
    text: |-
      Een aanbieder van hypothecair krediet hanteert bij het berekenen van de vergoeding voor vervroegde aflossing van
      een kredietovereenkomst waarvan de debetrentevoet overeenkomstig [artikel 81ca, eerste lid][ref1], is gewijzigd
      dezelfde voorwaarden als bij het berekenen van de vergoeding voor vervroegde aflossing van een kredietovereenkomst
      waarvan de debetrentevoet niet overeenkomstig artikel 81ca, eerste lid, is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel81ca
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 81ca
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 81c.4
    text: |-
      De aanbieder van hypothecair krediet verstrekt aan de consument die voornemens is vervroegd af te lossen een
      berekening van de aan de aanbieder te betalen vergoeding voor het vervroegd aflossen en de bij de berekening
      gehanteerde hypothesen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81c
  - number: 81c.5
    text: |-
      De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot de berekening van de vergoeding,
      bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81c
  - number: 81ca.1
    text: |-
      Een aanbieder van hypothecair krediet die voorafgaande aan het aflopen van de rentevastperiode de debetrentevoet
      van een overeenkomst inzake hypothecair krediet wijzigt, rekent hiervoor geen vergoeding die hoger is dan het
      financiële nadeel dat de aanbieder heeft door het wijzigen van deze debetrentevoet.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81ca
  - number: 81ca.2
    text: |-
      De aanbieder van hypothecair krediet verstrekt aan de consument die voornemens is de debetrentevoet van een
      overeenkomst inzake hypothecair krediet voorafgaande aan het aflopen van de rentevasteperiode te wijzigen een
      berekening van de aan de aanbieder te betalen vergoeding voor het wijzigen van die debetrentevoet en de bij de
      berekening gehanteerde hypothesen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81ca
  - number: 81ca.3
    text: |-
      De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot de berekening van de vergoeding,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81ca
  - number: 81d.1
    text: |-
      Een aanbieder van hypothecair krediet waarborgt dat een consument zorgvuldig wordt behandeld indien de consument
      de uit een overeenkomst inzake hypothecair krediet voortvloeiende verplichtingen niet nakomt of indien de aanbieder
      van hypothecair krediet zich verhaalt op de onroerende zaak waarop het hypothecair krediet is gevestigd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81d
  - number: 81d.2
    text: |-
      Een aanbieder van hypothecair krediet rekent de consument geen hogere vergoeding van kosten bij het niet nakomen
      door die consument dan nodig is ter vergoeding van de schade die de aanbieder als gevolg van de niet-nakoming heeft
      geleden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81d
  - number: 81d.3
    text: |-
      Indien het verhaal op de onroerende zaak onvoldoende oplevert om de uit een overeenkomst inzake hypothecaire
      krediet voortvloeiende verplichtingen na te komen, komt de aanbieder met de consument een regeling overeen ten
      behoeve van de afbetaling van het resterende krediet, tenzij dit in redelijkheid niet van de aanbieder kan worden
      verlangd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81d
  - number: 81e
    text: |-
      Het is een aanbieder van hypothecair krediet niet toegestaan om, met als reden een onjuiste beoordeling van de
      kredietwaardigheid van de consument, de overeenkomst inzake hypothecair krediet te beëindigen of ten nadele van
      de consument te wijzigen, tenzij de consument voor de beoordeling van de kredietwaardigheid relevante informatie
      bewust heeft achtergehouden of bewust onjuist heeft weergegeven.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel81e
  - number: '82.1'
    text: |-
      Een maatschappij voor collectieve belegging in effecten, beleggingsonderneming of beheerder van een icbe
      benadert personen die geen professionele belegger zijn, die geen deelnemer zijn in de icbe of aan wie de
      beleggingsonderneming nog geen beleggingsdienst heeft verleend, direct noch indirect in persoon, anders dan door
      middel van een techniek voor communicatie op afstand als bedoeld in [artikel 81][ref1], tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel81
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '81'
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 82.1.a
    text: de betrokkene daarmee vooraf uitdrukkelijk schriftelijk dan wel elektronisch mee heeft ingestemd; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel82
  - number: 82.1.b
    text: de betrokkene in het contact slechts informatiemateriaal wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel82
  - number: '82.2'
    text: |-
      Het eerste lid is niet van toepassing op beheerders van icbe’s met zetel in een andere lidstaat, icbe’s met zetel
      in een andere lidstaat en de eventueel aan die instellingen verbonden bewaarders.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel82
  - number: '83.1'
    text: |-
      Een beheerder van een icbe, maatschappij voor collectieve belegging in effecten of bewaarder van een icbe handelt
      in het belang van de deelnemers in de icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel83
  - number: '83.2'
    text: |-
      Een beheerder van een icbe of een maatschappij voor collectieve belegging in effecten die een securitisatiepositie
      heeft die niet langer voldoet aan de voorschriften van verordening (EU) nr. 2017/2402 van het Europees Parlement
      en de Raad van 12 december 2017 tot vaststelling van een algemeen kader voor securitisatie en tot vaststelling
      van een specifiek kader voor eenvoudige, transparante en gestandaardiseerde securitisatie, en tot wijziging van
      de [richtlijnen 2009/65/EG](32009L0065), [2009/138/EG](32009L0138) en [2011/61](32011L0061)/EU en de verordeningen
      (EG) nr. [1060/2009](32960L2009) en (EU) nr. [648/2012](32548L2012) (PbEU 2017, L 347) handelt in het belang van de
      deelnemers in de icbe en neemt zo nodig corrigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel83
  - number: '83.3'
    text: |-
      Een beheerder van een icbe of maatschappij voor collectieve belegging in effecten behandelt deelnemers onder
      vergelijkbare omstandigheden op gelijke wijze.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel83
  - number: '83.4'
    text: |-
      Door of namens een icbe worden geen transacties uitgevoerd voor haar rekening met een zodanige frequentie of van
      een zodanige omvang dat dit gezien de omstandigheden kennelijk slechts strekt tot bevoordeling van de beheerder van
      de icbe, de icbe of met de beheerder van de icbe, maatschappij voor collectieve belegging in effecten of bewaarder
      van de icbe gelieerde partijen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel83
  - number: '83.5'
    text: |-
      Het eerste tot en met vierde lid is niet van toepassing op beheerders van icbe’s met zetel in een andere lidstaat
      die geen icbe’s met zetel in Nederland beheren, icbe’s met zetel in een andere lidstaat en de eventueel aan die
      instellingen verbonden bewaarders.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel83
  - number: 83a.1
    text: |-
      Een Nederlandse beheerder van een beleggingsinstelling neemt jegens de deelnemers in de beleggingsinstelling de in
      artikel 12, eerste lid, onderdelen b, d, e, f, alsmede de laatste volzin van het eerste lid, en tweede lid, aanhef
      en onderdeel a, van de richtlijn beheerders van alternatieve beleggingsinstellingen gestelde regels in acht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel83a
  - number: 83a.2
    text: |-
      De Autoriteit Financiële Markten neemt bij het toezicht op de naleving van regels, bedoeld in het eerste lid,
      de ingevolge artikel 12, derde lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen gestelde
      criteria in acht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel83a
  - number: 83a.3
    text: |-
      Een Nederlandse beheerder van een beleggingsinstelling die een securitisatiepositie heeft die niet langer voldoet
      aan de voorschriften van verordening (EU) nr. 2017/2402 van het Europees Parlement en de Raad van 12 december
      2017 tot vaststelling van een algemeen kader voor securitisatie en tot vaststelling van een specifiek kader voor
      eenvoudige, transparante en gestandaardiseerde securitisatie, en tot wijziging van de [richtlijnen 2009/65/EG]
      (32009L0065), [2009/138/EG](32009L0138) en [2011/61](32011L0061)/EU en de verordeningen (EG) nr. [1060/2009]
      (32960L2009) en (EU) nr. [648/2012](32548L2012) (PbEU 2017, L 347) handelt in het belang van de deelnemers in de
      beleggingsinstelling en neemt zo nodig corrigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel83a
  - number: '84'
    text: |-
      Een beleggingsonderneming onthoudt zich van het uitvoeren van transacties voor rekening van cliënten met een
      zodanige frequentie of van een zodanige omvang dat dit gezien de omstandigheden kennelijk slechts strekt tot
      bevoordeling van de beleggingsonderneming, tenzij sprake is van transacties waarvoor de cliënt op eigen initiatief
      uitdrukkelijk opdracht heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel84
  - number: '85'
    text: |-
      Een beleggingsonderneming verricht geen transactie voor rekening van een cliënt, indien de op naam van de cliënt
      aanwezige saldi ontoereikend zijn om aan de verplichtingen te voldoen die voortvloeien uit die transactie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel85
  - number: '86.1'
    text: |-
      Een beleggingsonderneming ziet er op toe dat cliënten die posities hebben in financiële instrumenten waaruit
      verplichtingen kunnen voortvloeien voortdurend over voldoende saldi beschikken om aan de actuele verplichtingen die
      uit die posities voortvloeien te voldoen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86
  - number: '86.2'
    text: |-
      Indien een cliënt als bedoeld in het eerste lid over onvoldoende saldi beschikt om te voldoen aan de actuele
      verplichtingen die voortvloeien uit posities in financiële instrumenten, ziet de beleggingsonderneming er op toe
      dat deze cliënt zekerheden stelt waaruit die verplichtingen kunnen worden voldaan. Indien de cliënt geen zekerheden
      kan stellen, sluit de beleggingsonderneming de posities zo spoedig mogelijk doch uiterlijk binnen vijf werkdagen
      tenzij er zich bijzondere omstandigheden voordoen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86
  - number: 86b
    text: |-
      [Artikel 86c][ref1] is uitsluitend van toepassing op overeenkomsten die zijn aangegaan op of na inwerkingtreding
      van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel86c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 86c
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 86c.1
    text: |-
      Een financiëledienstverlener verschaft of ontvangt, rechtstreeks of middellijk, geen provisie voor het
      bemiddelen of adviseren van een betalingsbeschermer, complex product, hypothecair krediet, individuele
      arbeidsongeschiktheidsverzekering, overlijdensrisicoverzekering, premiepensioenvordering, uitvaartverzekering of
      bij ministeriële regeling aan te wijzen ander financieel product.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
  - number: 86c.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
  - number: 86c.2.a
    text: |-
      provisies die rechtstreeks worden verschaft door de consument of, voor zover het een verzekering betreft, de cliënt
      of degene die namens hem optreedt, tenzij de hoogte van deze provisies kennelijk onredelijk is gelet op de aard en
      reikwijdte van de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
  - number: 86c.2.b
    text: |-
      provisies die rechtstreeks worden verschaft door de bijdragende onderneming voor zover het een
      premiepensioenvordering betreft, tenzij de hoogte van deze provisies kennelijk onredelijk is gelet op de aard en
      reikwijdte van de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
  - number: 86c.2.c
    text: |-
      provisies die worden verschaft door de aanbieder of ontvangen door de bemiddelaar of adviseur voor het bemiddelen
      of adviseren van een consument die inzake een hypothecair krediet betalingsachterstanden of voorzienbare
      betalingsachterstanden heeft, mits de provisie geen afbreuk doet aan de kwaliteit van de dienstverlening en de
      verplichting van de bemiddelaar of adviseur om zich in te zetten voor de belangen van de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
  - number: 86c.2.d
    text: |-
      provisies die noodzakelijk zijn voor het verlenen van de desbetreffende financiële dienst of de desbetreffende
      financiële dienst mogelijk maken;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
  - number: 86c.2.e
    text: |-
      provisies die worden verschaft door een bemiddelaar of adviseur, niet zijnde een aanbieder of gevolmachtigde agent,
      aan een andere bemiddelaar of adviseur;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
  - number: 86c.2.f
    text: relatiegeschenken, voor zover de gezamenlijke waarde daarvan op jaarbasis niet meer bedraagt dan € 100.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
  - number: 86c.3
    text: |-
      De bemiddelaar of adviseur doet op begrijpelijke wijze mededeling van het bestaan en het bedrag van de provisie
      als bedoeld in het tweede lid, onderdeel b, voordat de desbetreffende financiële dienst wordt verleend, tenzij het
      bedrag van de provisie op dat moment niet bekend is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
  - number: 86c.4
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op personen die ingevolge
      [artikel 2:104, eerste lid, van de wet][ref1] zijn vrijgesteld van [artikel 2:96, eerste lid, van de wet][ref2]
      voor zover die personen in Nederland beleggingsdiensten mogen verlenen:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 86c.4.a
    text: |-
      als bedoeld in onderdeel a van de definitie van verlenen van een beleggingsdienst in
      [artikel 1:1 van de wet][ref1], met betrekking tot rechten van deelneming in een beleggingsinstelling of icbe
      voor zover die personen in Nederland orders mogen doorgeven aan beleggingsinstellingen of icbe’s die in Nederland
      rechten van deelneming mogen aanbieden en aan banken en beleggingsondernemingen die in Nederland beleggingsdiensten
      mogen verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 86c.4.b
    text: |-
      als bedoeld in onderdeel d van de definitie van verlenen van een beleggingsdienst in
      [artikel 1:1 van de wet][ref1], met betrekking tot rechten van deelneming in een beleggingsinstelling of icbe.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 86c.5
    text: |-
      Dit artikel is niet van toepassing op overeenkomsten inzake premiepensioenvorderingen die zijn afgesloten vóór
      1 januari 2016, met dien verstande dat de niet-toepasselijkheid voor die overeenkomsten op 31 december 2020
      eindigt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86c
  - number: 86d.1
    text: |-
      Een aanbieder, bemiddelaar of adviseur verschaft of ontvangt voor het bemiddelen of adviseren inzake een
      schadeverzekering, niet zijnde een betalingsbeschermer, individuele arbeidsongeschiktheidsverzekering of een
      overlijdensrisicoverzekering, geen andere provisies dan:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86d
  - number: 86d.1.a
    text: |-
      provisies die worden verschaft door of aan de cliënt of degene die namens hem optreedt, tenzij de hoogte van deze
      provisies kennelijk onredelijk is gelet op de aard en reikwijdte van de financiële dienstverlening;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86d
  - number: 86d.1.b
    text: |-
      afsluitprovisies of doorlopende provisies, mits de bemiddelaar of adviseur kosteloos op verzoek van de cliënt op
      begrijpelijke wijze mededeling doet van het bestaan, de aard en het bedrag of, indien het bedrag niet kan worden
      achterhaald, de wijze van berekening van de provisie of in geval van provisie in natura de waarde in het economisch
      verkeer voordat de desbetreffende financiële dienst wordt verleend;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86d
  - number: 86d.1.c
    text: |-
      provisies die noodzakelijk zijn voor het verlenen van de financiële dienst of de desbetreffende dienst mogelijk
      maken; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86d
  - number: 86d.1.d
    text: relatiegeschenken, voor zover de gezamenlijke waarde daarvan op jaarbasis niet meer bedraagt dan € 100.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86d
  - number: 86d.2
    text: |-
      Voor de toepassing van het eerste lid, wordt onder «consument» in de definities van afsluitprovisie en doorlopende
      provisie in [artikel 1][ref1], mede verstaan een cliënt, niet zijnde een consument.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 86d.3
    text: |-
      Dit artikel is van toepassing op overeenkomsten inzake schadeverzekeringen die zijn aangegaan op of na 1 januari
      2012.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86d
  - number: 86e.1
    text: |-
      Een aanbieder, gevolmachtigde agent of ondergevolmachtigde agent verschaft of ontvangt voor het optreden als
      gevolmachtigde agent of ondergevolmachtigde agent rechtstreeks of middellijk geen commissie die niet noodzakelijk
      is voor het verlenen van de dienst of deze mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86e
  - number: 86e.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86e
  - number: 86e.2.a
    text: |-
      commissies die worden verschaft door of aan een derde of degene die namens hem optreedt, indien de verschaffing van
      de commissie geen afbreuk doet aan de verplichting van de aanbieder, gevolmachtigde agent of ondergevolmachtigde
      agent om zich in te zetten voor de belangen van de cliënt; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86e
  - number: 86e.2.b
    text: relatiegeschenken, voor zover deze gezamenlijk op jaarbasis de waarde van € 100 niet overstijgen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86e
  - number: 86e.3
    text: Dit artikel is van toepassing op overeenkomsten die aangegaan zijn op of na 1 januari 2012.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86e
  - number: 86ea.1
    text: |-
      Een verzekeraar ontvangt, rechtstreeks of middellijk, geen beloning of vergoeding, in welke vorm dan ook, van een
      beheerder van een beleggingsinstelling of een beheerder van een icbe voor het aanbieden van een levensverzekering
      waarvan de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling of icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86ea
  - number: 86ea.2
    text: |-
      Het eerste lid is niet van toepassing op relatiegeschenken, voor zover de gezamenlijke waarde daarvan op jaarbasis
      niet meer bedraagt dan € 100.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86ea
  - number: 86ea.3
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86ea
  - number: 86ea.3.a
    text: |-
      overeenkomsten inzake een levensverzekering, niet zijnde een pensioenverzekering, die voor 1 juli 2016 zijn
      afgesloten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86ea
  - number: 86ea.3.b
    text: |-
      overeenkomsten inzake een pensioenverzekering die voor 1 juli 2016 zijn afgesloten, met dien verstande dat de niet-
      toepasselijkheid voor die overeenkomsten op 31 december 2020 eindigt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86ea
  - number: 86f.1
    text: |-
      Een financiëledienstverlener verstrekt voorafgaand aan het verlenen van een financiële dienst inzake een financieel
      product als bedoeld in [artikel 86c, eerste lid][ref1], een vergelijkingskaart aan de consument of, indien het een
      verzekering betreft, de cliënt, die betrekking heeft op de gevraagde dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel86c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 86c
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 86f.2
    text: 'De vergelijkingskaart bevat de volgende informatie over de financiëledienstverlener en zijn dienstverlening:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.a
    text: of hij adviseert, en zo ja, of dit geschiedt op onafhankelijke basis;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.b
    text: |-
      of hij een contractuele verplichting heeft om uitsluitend voor een of meer bepaalde aanbieders te bemiddelen, in
      welk geval hij desgevraagd aan de consument of de cliënt de namen van deze aanbieders meedeelt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.c
    text: |-
      of hij geen contractuele verplichting heeft uitsluitend voor een of meer aanbieders te bemiddelen, en niet
      adviseert op onafhankelijke basis, in welk geval hij de consument of cliënt desgevraagd tevens de namen meedeelt
      van de aanbieders waarvoor hij bemiddelt of kan bemiddelen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.d
    text: |-
      of hij naast het geven van advies ook bemiddelt, in welk geval hij de hoogte van de kosten die hiervoor in rekening
      worden gebracht, weergeeft in de totale kosten van de dienstverlening, bedoeld in de onderdelen i en j;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.e
    text: |-
      of hij na de totstandkoming van de overeenkomst andere diensten voor de consument of cliënt kan verrichten, in welk
      geval hij de wijze waarop hij de kosten die voor deze diensten in rekening worden gebracht, meedeelt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.f
    text: of hij uitsluitend adviseert over eigen producten, dan wel tevens over producten van andere aanbieders;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.g
    text: |-
      of hij een gekwalificeerde deelneming in een bepaalde aanbieder of een moedermaatschappij van een bepaalde
      aanbieder houdt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.h
    text: |-
      of een bepaalde aanbieder of een moedermaatschappij van een bepaalde aanbieder een gekwalificeerde deelneming in
      hem houdt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.i
    text: |-
      indien hij een bemiddelaar of adviseur is die niet tevens aanbiedt: het nominale bedrag van de beloning die door
      hem gemiddeld voor de financiële dienst in rekening wordt gebracht, alsmede de manier waarop deze beloning bij de
      consument of cliënt in rekening wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.j
    text: |-
      indien hij een aanbieder is: de nominale kosten die door hem gemiddeld bij de consument of cliënt in rekening
      worden gebracht voor advies en distributie van een financieel product dat beantwoordt aan de dienstverleningsvraag,
      alsmede de wijze waarop deze kosten in rekening worden gebracht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.k
    text: |-
      indien hij een verzekeraar is: informatie over de aard van de vergoeding die zijn werknemers ontvangen die
      financiële diensten verlenen met betrekking tot verzekeringen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.2.l
    text: andere bij ministeriële regeling bepaalde informatie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.3
    text: |-
      Indien de financiëledienstverlener op grond van het tweede lid, onderdelen f, g, en h, tevens andere belangen bij
      het verlenen van een financiële dienst heeft dan het belang van de consument of cliënt, wijst hij de consument of
      cliënt erop dat deze belangen ertoe kunnen leiden dat bepaalde financiële producten worden geadviseerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.4
    text: 'Van advies op onafhankelijke basis is sprake indien:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.4.a
    text: |-
      de financiëledienstverlener een toereikend aantal op de markt verkrijgbare financiële producten beoordeelt die
      voldoende divers zijn wat type en aanbieder betreft, zodat een voor de consument of, indien het een verzekering
      betreft, de cliënt, geschikt product kan worden geadviseerd; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.4.b
    text: 'de financiële producten niet uitsluitend worden aangeboden door:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.4.b.1°
    text: de financiëledienstverlener zelf;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.4.b.2°
    text: een aanbieder of de moedermaatschappij daarvan als bedoeld in het tweede lid, onderdeel g;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.4.b.3°
    text: een aanbieder of de moedermaatschappij daarvan als bedoeld in het tweede lid, onderdeel h; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.4.b.4°
    text: |-
      entiteiten waarmee de financiëledienstverlener in een zodanig nauw juridisch of economisch verband staat dat het
      risico bestaat dat dit afbreuk doet aan de onafhankelijkheid van het verstrekte advies.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.5
    text: |-
      De financiëledienstverlener publiceert, indien hij beschikt over een website, de vergelijkingskaart op zijn
      website.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.6
    text: |-
      De vergelijkingskaart wordt verstrekt door de financiëledienstverlener die rechtstreeks door de consument of cliënt
      is benaderd voor het verlenen van de financiële dienst.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86f.7
    text: |-
      De Autoriteit Financiële Markten stelt regels ten aanzien van de vormgeving en wijze van verstrekking van de
      vergelijkingskaart en kan nadere regels stellen met betrekking tot de gevraagde dienstverlening, bedoeld in het
      eerste lid, en de informatie, bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86f
  - number: 86g.1
    text: |-
      Een aanbieder die een vergelijkingskaart dient te verstrekken, stelt een kostprijsmodel op. Dit kostprijsmodel
      wordt gebruikt voor de berekening van de advieskosten en distributiekosten die zijn gericht op het tot stand
      brengen van een overeenkomst ten aanzien van producten als bedoeld in [artikel 86c][ref1] met een consument of,
      indien het een verzekering betreft, cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel86c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86g
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 86c
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 86g.2
    text: |-
      De aanbieder laat de juistheid van het kostprijsmodel controleren door een accountant. Tevens controleert een
      accountant jaarlijks of de begrote advieskosten en distributiekosten juist en volledig zijn toegerekend aan de
      financiële producten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86g
  - number: 86h.1
    text: |-
      Een directe aanbieder brengt de advieskosten en distributiekosten gericht op het tot stand brengen van een
      overeenkomst met betrekking tot een betalingsbeschermer, complex product, hypothecair krediet, individuele
      arbeidsongeschiktheidsverzekering, overlijdensrisicoverzekering, uitvaartverzekering, of bij ministeriële regeling
      aan te wijzen ander financieel product rechtstreeks in rekening bij de consument of, indien het een verzekering
      betreft, de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86h
  - number: 86h.2
    text: |-
      De aanbieder brengt geen andere kosten dan de advieskosten en distributiekosten in rekening bij de consument
      onderscheidenlijk cliënt voor de werkzaamheden gericht op het tot stand brengen van een overeenkomst met betrekking
      tot de financiële producten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86h
  - number: 86h.3
    text: |-
      Het eerste lid is niet van toepassing op het adviseren van een consument die inzake een hypothecair krediet
      betalingsachterstanden of voorzienbare betalingsachterstanden heeft.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86h
  - number: 86i.1
    text: |-
      Een adviseur die de aanbevolen schadeverzekering niet tevens aanbiedt, informeert de cliënt uiterlijk
      tegelijk met zijn advies inzake een schadeverzekering, niet zijnde een betalingsbeschermer, individuele
      arbeidsongeschiktheidsverzekering of overlijdensrisicoverzekering, over de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86i
  - number: 86i.1.a
    text: of hij adviseert op grond van een objectieve analyse;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86i
  - number: 86i.1.b
    text: |-
      of hij een contractuele verplichting heeft uitsluitend voor een of meer aanbieders te adviseren, in welk geval hij
      de cliënt desgevraagd tevens de namen van deze aanbieders meedeelt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86i
  - number: 86i.1.c
    text: |-
      of hij geen contractuele verplichting heeft uitsluitend voor een of meer aanbieders te adviseren en hij niet
      adviseert op grond van een objectieve analyse, in welk geval hij de cliënt desgevraagd tevens de namen meedeelt van
      de aanbieders waarvoor hij adviseert of kan adviseren;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86i
  - number: 86i.1.d
    text: op welke wijze hij wordt beloond;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86i
  - number: 86i.1.e
    text: |-
      de hoogte van de provisie, of, indien het bedrag van de provisie op dat moment niet bekend is, de wijze van
      berekening van de provisie indien de provisie rechtstreeks wordt verschaft door de cliënt of degene die namens
      hem optreedt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86i
  - number: 86i.1.f
    text: of hij een gekwalificeerde deelneming in een bepaalde aanbieder houdt; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86i
  - number: 86i.1.g
    text: |-
      of een bepaalde aanbieder of een bepaalde moedermaatschappij van een aanbieder een gekwalificeerde deelneming in
      hem houdt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86i
  - number: 86i.2
    text: |-
      Een bemiddelaar informeert de cliënt voorafgaande aan de totstandkoming van een overeenkomst inzake een
      schadeverzekering, met uitzondering van een betalingsbeschermer, individuele arbeidsongeschiktheidsverzekering of
      een overlijdensrisicoverzekering, over de onderwerpen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86i
  - number: 86i.3
    text: |-
      Indien uit hoofde van de overeenkomst inzake een verzekering na de totstandkoming van de overeenkomst
      andere kosten bij de cliënt in rekening worden gebracht dan de premies en voorzienbare kosten, voldoet de
      financiëledienstverlener voor die bijkomende kosten aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86i
  - number: 86i.4
    text: |-
      Een objectieve analyse als bedoeld in het eerste lid is een analyse van een toereikend aantal op de markt
      verkrijgbare vergelijkbare schadeverzekeringen die de adviseur of bemiddelaar in staat stelt een schadeverzekering
      aan te bevelen dat aan de behoeften van de cliënt voldoet.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86i
  - number: 86ia.1
    text: |-
      Een betaaldienstverlener met vestiging in Nederland biedt aan consumenten die een betaalrekening aanhouden bij
      een betaaldienstverlener met vestiging in Nederland en die een overstap maken naar een andere betaalrekening
      in dezelfde munteenheid bij een betaaldienstverlener met vestiging in Nederland, een overstapdienst aan als
      bedoeld in artikel 2, achttiende lid, van de richtlijn betaalrekeningen. Daarbij worden de artikelen 10, tweede
      tot en met vierde lid, vijfde lid, onderdelen b tot en met e, en zesde lid, 12, 13, eerste en tweede lid, en 14
      van die richtlijn in acht genomen. Op verzoek van de consument initieert de ontvangende betaaldienstverlener de
      overstapdienst en verleent hij de consument bijstand bij het instellen van doorlopende overboekingen vanaf de in de
      door de consument aan de ontvangende betaaldienstverlener verleende toestemming bepaalde datum.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86ia
  - number: 86ia.2
    text: |-
      Een betaaldienstverlener met vestiging in Nederland faciliteert op verzoek van een consument met inachtneming van
      artikel 11 van de richtlijn betaalrekeningen een overstap van een betaalrekening die door de betreffende consument
      wordt aangehouden bij die betaaldienstverlener naar een betaalrekening bij een in een andere lidstaat van de
      Europese Unie gevestigde betaaldienstverlener.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86ia
  - number: 86j.1
    text: |-
      [Artikel 86k][ref1] is van toepassing op overeenkomsten inzake betalingsbeschermers en uitvaartverzekeringen die
      zijn aangegaan vanaf 1 januari 2010 tot de inwerkingtreding van [artikel 86c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel86k
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel86c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86j
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 86k
        hoofdstuk: '8'
        paragraaf: 8.2.3
        afdeling: '8.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 86c
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 86j.2
    text: |-
      [Artikel 86k][ref1] is van toepassing op overeenkomsten inzake complexe producten en hypothecair kredieten die zijn
      aangegaan vanaf 1 januari 2007 tot de inwerkingtreding van [artikel 86c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel86k
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel86c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86j
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 86k
        hoofdstuk: '8'
        paragraaf: 8.2.3
        afdeling: '8.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 86c
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 86j.3
    text: |-
      De [artikelen 86l][ref1] en [86m][ref2] zijn van toepassing op overeenkomsten die zijn aangegaan vanaf 1 januari
      2007 tot de inwerkingtreding van [artikel 86c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel86l
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel86m
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel86c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86j
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 86l
        hoofdstuk: '8'
        paragraaf: 8.2.3
        afdeling: '8.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 86m
        hoofdstuk: '8'
        paragraaf: 8.2.3
        afdeling: '8.2'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 86c
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 86k.1
    text: |-
      Een aanbieder, bemiddelaar of adviseur verschaft of ontvangt voor het bemiddelen of adviseren inzake een
      betalingsbeschermer, complex product, hypothecair krediet of uitvaartverzekering, rechtstreeks of middellijk geen
      provisie die niet noodzakelijk is voor het verlenen van de desbetreffende dienst of deze mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86k
  - number: 86k.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86k
  - number: 86k.2.a
    text: provisies die worden verschaft door of aan de cliënt of degene die namens hem optreedt; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86k
  - number: 86k.2.b
    text: |-
      provisies die worden verschaft door de aanbieder of ontvangen door de bemiddelaar of adviseur voor het bemiddelen
      of adviseren van een consument die inzake een hypothecair krediet betalingsachterstanden of voorzienbare
      betalingsachterstanden heeft, mits de provisie geen afbreuk doet aan de kwaliteit van de dienstverlening en de
      verplichting van de bemiddelaar of adviseur om zich in te zetten voor de belangen van de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86k
  - number: 86k.2.c
    text: |-
      afsluitprovisies of doorlopende provisies die worden verschaft door of aan een derde of degene die namens hem
      optreedt, indien:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86k
  - number: 86k.2.c.1°
    text: |-
      de bemiddelaar of adviseur de cliënt op uitvoerige, accurate en begrijpelijke wijze mededeling doet van het
      bestaan, de aard en het bedrag of, indien het bedrag niet kan worden achterhaald, de wijze van berekening van de
      provisie of in geval van provisie in natura de waarde in het economisch verkeer voordat de betreffende dienst wordt
      verleend; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86k
  - number: 86k.2.c.2°
    text: |-
      het verschaffen van de provisie de kwaliteit van de betreffende dienst ten goede komt en geen afbreuk doet aan de
      verplichting van de aanbieder, bemiddelaar of adviseur om zich in te zetten voor de belangen van de cliënt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86k
  - number: 86k.2.d
    text: relatiegeschenken, voor zover de gezamenlijke waarde daarvan op jaarbasis niet meer bedraagt dan € 100.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86k
  - number: 86k.3
    text: |-
      Voor de toepassing van het tweede lid, onderdeel c, wordt onder «consument» in de definities van afsluitprovisie en
      doorlopende provisie, bedoeld in [artikel 1][ref1], mede verstaan een cliënt, niet zijnde een consument.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86k
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 86k.4
    text: |-
      De bemiddelaar of adviseur doet op begrijpelijke wijze mededeling van het bestaan en het bedrag van de provisie
      als bedoeld in het tweede lid, onderdeel b, voordat de desbetreffende financiële dienst wordt verleend, tenzij het
      bedrag van de provisie op dat moment niet bekend is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86k
  - number: 86l.1
    text: |-
      Een aanbieder betaalt geen afsluitprovisie die meer bedraagt dan de helft van de som van die afsluitprovisie en de
      totale doorlopende provisie terzake van de desbetreffende overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86l
  - number: 86l.2
    text: |-
      Een aanbieder betaalt de doorlopende provisie evenredig uit gedurende ten minste tien jaar na totstandkoming van de
      desbetreffende overeenkomst. Indien de looptijd van de overeenkomst korter is dan tien jaar, betaalt de aanbieder
      de doorlopende provisie evenredig uit gedurende die looptijd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86l
  - number: 86l.3
    text: |-
      Het tweede lid is niet van toepassing op overeenkomsten inzake complexe producten voor zover tussen de
      desbetreffende aanbieder en de consument door tussenkomst van dezelfde bemiddelaar ten minste drie maanden
      voorafgaand aan het sluiten daarvan een overeenkomst is gesloten inzake een financieel product dat onderdeel is van
      het desbetreffende complexe product.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86l
  - number: 86l.4
    text: |-
      Dit artikel is niet van toepassing op overeenkomsten inzake een betalingsbeschermer, een hypothecair krediet, een
      schadeverzekering of een uitvaartverzekering.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86l
  - number: 86m.1
    text: |-
      Indien een overeenkomst met een consument inzake een complex product of hypothecair krediet tijdens de eerste vijf
      jaar na de totstandkoming vroegtijdig wordt beëindigd, anders dan door overlijden van de verzekerde of anders dan
      door verkoop van de onroerende zaak waarop het complexe product of hypothecair krediet betrekking heeft, wordt de
      afsluitprovisie of provisie evenredig verminderd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86m
  - number: 86m.2
    text: |-
      Het eerste lid is niet van toepassing op overeenkomsten inzake complexe producten, voor zover tussen de
      desbetreffende aanbieder en de consument door tussenkomst van dezelfde bemiddelaar ten minste drie maanden
      voorafgaand aan het sluiten daarvan een overeenkomst is gesloten inzake een financieel product dat onderdeel is van
      het desbetreffende complexe product.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel86m
  - number: 87a.1
    text: |-
      Een afwikkelonderneming waaraan de Nederlandsche Bank een vergunning heeft verleend voor het uitoefenen van het
      bedrijf van afwikkelonderneming geeft aan de Autoriteit Financiële Markten schriftelijk kennis van het voornemen
      tot een substantiële wijziging van:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
  - number: 87a.1.a
    text: |-
      de wijze waarop zij eerlijke en vrije toegang biedt tot haar diensten en systemen op basis van objectieve,
      risicogebaseerde en openbaar gemaakte deelnemingscriteria;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
  - number: 87a.1.b
    text: de wijze waarop zij zorg draagt voor het tijdig en efficiënt verlenen van haar diensten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
  - number: 87a.1.c
    text: |-
      de mechanismen waarmee periodiek het kostenniveau, prijsniveau en serviceniveau en de efficiëntie van de door haar
      verleende diensten worden beoordeeld;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
  - number: 87a.1.d
    text: |-
      de internationaal aanvaarde communicatieprocedures en -standaarden waarvan zij gebruik maakt ter ondersteuning van
      een efficiënte dienstverlening of de wijze waarop zij het gebruik daarvan bevordert; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
  - number: 87a.1.e
    text: |-
      de wijze waarop zij betaaldienstverleners waarmee zij een overeenkomst heeft gesloten, inzicht biedt in de
      financiële risico’s en de kosten die zijn verbonden aan de afwikkeldiensten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
  - number: 87a.2
    text: 'Met betrekking tot het voornemen legt de afwikkelonderneming over:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
  - number: 87a.2.a
    text: een beschrijving van de voorgenomen wijziging, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
  - number: 87a.2.b
    text: |-
      gegevens op basis waarvan de Autoriteit Financiële Markten redelijkerwijs kan beoordelen of wordt voldaan aan de
      [artikelen 4:76a tot en met 4:76d van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 87a.3
    text: |-
      De afwikkelonderneming geeft geen uitvoering aan het voornemen voordat de Autoriteit Financiële Markten heeft
      ingestemd met de wijziging. De Autoriteit Financiële Markten neemt een besluit omtrent instemming:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
  - number: 87a.3.a
    text: binnen zes weken na ontvangst van de kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
  - number: 87a.3.b
    text: |-
      indien de Autoriteit Financiële Markten binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87a
  - number: '87'
    text: |-
      Deze paragraaf is niet van toepassing op beheerders van icbe’s met zetel in een andere lidstaat en op beheerders
      van beleggingsinstellingen of icbe's met zetel in een aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel87
  - number: '88.1'
    text: |-
      Een beheerder van een icbe meldt aan de Autoriteit Financiële Markten een wijziging in de gegevens die eerder
      door hemzelf of door een andere financiële onderneming aan een toezichthouder zijn verstrekt ten behoeve van de
      beoordeling van de ingevolge de [wet][ref1] gestelde eisen met betrekking tot de betrouwbaarheid van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 88.1.a
    text: |-
      de personen die het beleid van de beheerder van een icbe, van een door hem beheerde maatschappij voor collectieve
      belegging in effecten of van een bewaarder die is verbonden aan een door hem beheerde icbe bepalen of mede bepalen;
      of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel88
  - number: 88.1.b
    text: |-
      de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en de algemene gang van
      zaken van de beheerder van een icbe, van een door hem beheerde maatschappij voor collectieve belegging in effecten
      of van een bewaarder die is verbonden aan een door hem beheerde icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel88
  - number: '88.2'
    text: |-
      De beheerder van een icbe meldt de wijziging schriftelijk en onverwijld nadat hij daarvan in het kader van de
      normale bedrijfsvoering kennis heeft genomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel88
  - number: 88a.1
    text: |-
      Een Nederlandse beheerder van een beleggingsinstelling meldt de Autoriteit Financiële Markten het voornemen tot een
      belangrijke wijziging van de in het kader van de aanvraag verstrekte informatie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel88a
  - number: 88a.2
    text: |-
      De procedure inzake de in het eerste lid bedoelde wijzigingen voldoet aan de in artikel 10, tweede lid, van de
      richtlijn beheerders van alternatieve beleggingsinstellingen gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel88a
  - number: 88b.1
    text: |-
      Een Nederlandse beheerder van een beleggingsinstelling meldt voorgenomen wijzigingen van de gegevens, bedoeld in
      [artikel 4:37c, zesde lid, van de wet][ref1] ten minste een maand voorafgaand aan de wijziging schriftelijk aan de
      Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel88b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 88b.2
    text: |-
      In afwijking van het eerste lid meldt de beheerder wijzigingen die hij niet heeft kunnen voorzien onverwijld nadat
      de wijziging is doorgevoerd aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel88b
  - number: 88b.3
    text: |-
      Indien de beheerder als gevolg van de voorgenomen wijziging niet meer aan de ingevolge de wet gestelde regels zou
      voldoen, deelt de Autoriteit Financiële Markten hem mede dat de voorgenomen wijziging niet doorgevoerd kan worden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel88b
  - number: 88b.4
    text: |-
      De melding, bedoeld in het eerste lid, voldoet aan de ingevolge artikel 31, vijfde lid, onderdeel b, van de
      richtlijn beheerders van alternatieve beleggingsinstellingen gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel88b
  - number: '89.1'
    text: |-
      Een beheerder van een icbe meldt aan de Autoriteit Financiële Markten schriftelijk het voornemen tot wijziging van
      het registratiedocument, bedoeld in [artikel 4:48, eerste lid, van de wet][ref1], voorzover het betreft gegevens
      over:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 89.1.a
    text: |-
      de activiteiten van de beheerder en de soorten icbe's die hij beheert of voornemens is te beheren, bedoeld in
      onderdeel 1.b. van [bijlage H][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 89.1.b
    text: |-
      de personen die het dagelijks beleid van de beheerder of van een bewaarder die is verbonden aan een door hem
      beheerde icbe bepalen, bedoeld in onderdeel 2.1.a van [bijlage H][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 89.1.c
    text: |-
      de personen die het beleid van de beheerder of van een bewaarder die is verbonden aan een door hem beheerde icbe
      bepalen of mede bepalen, bedoeld in onderdeel 2.1.b. van [bijlage H][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 89.1.d
    text: |-
      de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en de algemene gang van
      zaken van de beheerder of van een bewaarder die is verbonden aan een door hem beheerde icbe, bedoeld in onderdeel
      2.1.c van [bijlage H][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 89.1.e
    text: |-
      de algemene gegevens betreffende de beheerder en de bewaarders, bedoeld in onderdeel 3 van [bijlage H][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '89.2'
    text: |-
      De beheerder geeft geen uitvoering aan het voornemen, bedoeld in het eerste lid, aanhef en onderdeel a, voordat de
      Autoriteit Financiële Markten heeft ingestemd met de wijziging. De Autoriteit Financiële Markten neemt een besluit
      omtrent de instemming binnen vier weken na ontvangst van de melding.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: '89.3'
    text: |-
      De beheerder geeft geen uitvoering aan het voornemen, bedoeld in het eerste lid, aanhef en onderdeel b, c of d,
      voordat de Autoriteit Financiële Markten heeft ingestemd met de wijziging. De Autoriteit Financiële Markten neemt
      een besluit omtrent de instemming:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: 89.3.a
    text: binnen zes weken na ontvangst van de melding; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: 89.3.b
    text: |-
      indien de Autoriteit Financiële Markten binnen twee weken na ontvangst van de melding de beheerder of een derde
      om nadere gegevens heeft verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien
      weken na ontvangst van de melding.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: '89.4'
    text: |-
      Indien de Autoriteit Financiële Markten een derde verzoekt om nadere gegevens als bedoeld in het derde lid,
      onderdeel b, doet zij daarvan mededeling aan de beheerder.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: '89.5'
    text: |-
      Bij de melding, bedoeld in het eerste lid, aanhef en onderdeel b, legt de beheerder ten aanzien van te benoemen
      personen die het dagelijks beleid zullen bepalen de volgende gegevens over:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: 89.5.a
    text: een opgave van de naam, het privé-adres en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: 89.5.b
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: 89.5.c
    text: een opgave van de geldige relevante diploma’s;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: 89.5.d
    text: een kopie van een geldig identiteitsbewijs; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: 89.5.e
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: '89.6'
    text: |-
      Bij de melding, bedoeld in het eerste lid, aanhef en onderdelen c en d, legt de beheerder ten aanzien van te
      benoemen personen die het beleid zullen bepalen of mede bepalen of die onderdeel zullen zijn van een orgaan dat
      belast is met het toezicht op het beleid en de algemene gang van zaken de volgende gegevens over:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: 89.6.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: 89.6.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: 89.6.c
    text: |-
      gegevens met betrekking tot de antecedenten, bedoeld in [artikel 13][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel13
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '13'
        hoofdstuk: '3'
  - number: 89.6.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: '89.7'
    text: |-
      Het zesde lid, onderdelen b, c en d, is niet van toepassing indien de voorgenomen wijziging een persoon betreft
      wiens betrouwbaarheid voor de toepassing van de wet door een toezichthouder reeds is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel89
  - number: '90'
    text: |-
      Een beheerder van een icbe zendt een afschrift van elke met een bewaarder van een icbe gesloten overeenkomst
      alsmede van wijzigingen van een met een bewaarder van een icbe gesloten overeenkomst binnen twee weken na
      ondertekening of wijziging van de overeenkomst aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel90
  - number: '91.1'
    text: |-
      Een beheerder van een icbe meldt een wijziging van de gegevens, bedoeld in
      [artikel 4:50, eerste lid, met uitzondering van de onderdelen a, d, g en i van de wet][ref1], van een door hem
      beheerde icbe ten minste twee weken voorafgaand aan de wijziging schriftelijk aan de Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '91.2'
    text: |-
      Een beheerder van een icbe meldt een wijziging in het fondsreglement of de statuten van een door hem beheerde icbe
      ten minste een maand voorafgaand aan de wijziging schriftelijk aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel91
  - number: '91.3'
    text: |-
      Een beheerder van een icbe meldt het voornemen tot vervanging van de beheerder of de bewaarder die aan de icbe is
      verbonden ten minste een maand tevoren schriftelijk aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel91
  - number: '91.4'
    text: |-
      De beheerder geeft geen uitvoering aan het voornemen, bedoeld in het tweede en derde lid, voordat de Autoriteit
      Financiële Markten daarmee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel91
  - number: '92.1'
    text: |-
      Een beheerder van een icbe die vanuit een in een andere lidstaat gelegen bijkantoor een icbe beheert of rechten van
      deelneming in door hem beheerde icbe’s in die lidstaat aanbiedt, meldt aan de Autoriteit Financiële Markten en de
      toezichthoudende instantie van de andere lidstaat schriftelijk ten minste een maand tevoren:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel92
  - number: 92.1.a
    text: een wijziging in het adres in de lidstaat waar documenten kunnen worden opgevraagd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel92
  - number: 92.1.b
    text: een wijziging in de identiteit van de personen die het dagelijks beleid van het bijkantoor bepalen; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel92
  - number: 92.1.c
    text: |-
      het voornemen om het aanbieden van rechten van deelneming in door hem beheerde icbe’s vanuit het in de andere
      lidstaat gelegen bijkantoor te staken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel92
  - number: '92.2'
    text: |-
      Een beheerder van een icbe die vanuit een in een andere lidstaat gelegen bijkantoor een icbe beheert of rechten
      van deelneming in door hem beheerde icbe’s in die lidstaat aanbiedt, meldt aan de Autoriteit Financiële Markten
      en de toezichthoudende instantie van de andere lidstaat schriftelijk ten minste een maand tevoren het voornemen
      tot wijziging van de financiële diensten die hij vanuit het bijkantoor verleent, de organisatiestructuur van het
      bijkantoor, de procedure voor risicobeheer en de afhandeling van klachten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel92
  - number: '92.3'
    text: |-
      De beheerder van een icbe geeft geen uitvoering aan het voornemen, bedoeld in het tweede lid, voordat de Autoriteit
      Financiële Markten heeft ingestemd met de wijziging. De Autoriteit Financiële Markten neemt een besluit omtrent
      instemming binnen twee maanden na ontvangst van de melding en stemt in met de wijziging, tenzij de bedrijfsvoering
      of de financiële positie van de beheerder van een icbe gelet op de voorgenomen wijziging niet toereikend is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel92
  - number: 92a
    text: |-
      Een beheerder van een icbe die door middel van het verrichten van diensten een icbe met zetel in een andere
      lidstaat beheert of rechten van deelneming in door hem beheerde icbe’s in een andere lidstaat aanbiedt, meldt
      een wijziging van de financiële diensten die hij in de andere lidstaat verleent, de procedure voor risicobeheer
      en de afhandeling van klachten ten minste twee weken voorafgaand aan de wijziging schriftelijk aan de Autoriteit
      Financiële Markten en de toezichthoudende instantie van de andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel92a
  - number: '93'
    text: Deze paragraaf is niet van toepassing op beleggingsondernemingen met zetel in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel93
  - number: '94.1'
    text: |-
      Een beleggingsonderneming meldt aan de Autoriteit Financiële Markten een wijziging in de gegevens die eerder
      door haarzelf of door een andere financiële onderneming aan een toezichthouder zijn verstrekt ten behoeve van de
      beoordeling van de ingevolge de [wet][ref1] gestelde eisen met betrekking tot de betrouwbaarheid van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 94.1.a
    text: de personen die het beleid van de beleggingsonderneming bepalen of mede bepalen; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel94
  - number: 94.1.b
    text: |-
      de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en de algemene gang van
      zaken van de beleggingsonderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel94
  - number: '94.2'
    text: |-
      De beleggingsonderneming meldt de wijziging schriftelijk en onverwijld nadat zij daarvan in het kader van de
      normale bedrijfsvoering kennis heeft genomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel94
  - number: '94.3'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel94
  - number: 94.3.a
    text: |-
      beleggingsondernemingen die voor de uitoefening van het bedrijf van bank een door de Nederlandsche Bank verleende
      vergunning hebben of voor de uitoefening van het bedrijf van financiële instelling een door de Nederlandsche Bank
      verleende verklaring van ondertoezichtstelling hebben; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel94
  - number: 94.3.b
    text: |-
      beleggingsondernemingen die voor het beheren van een instelling voor collectieve belegging in effecten een door de
      Autoriteit Financiële Markten verleende vergunning hebben.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel94
  - number: '95.1'
    text: 'Een beleggingsonderneming meldt aan de Autoriteit Financiële Markten schriftelijk het voornemen tot wijziging van:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.1.a
    text: de personen die het dagelijks beleid van de beleggingsonderneming bepalen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.1.b
    text: de personen die het beleid van de beleggingsonderneming bepalen of mede bepalen; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.1.c
    text: |-
      de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en de algemene gang van
      zaken van de beleggingsonderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: '95.2'
    text: |-
      Een beleggingsonderneming geeft geen uitvoering aan het voornemen, bedoeld in het eerste lid, voordat de Autoriteit
      Financiële Markten heeft ingestemd met de wijziging. De Autoriteit Financiële Markten neemt een besluit omtrent
      de instemming:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.2.a
    text: binnen zes weken na ontvangst van de melding; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.2.b
    text: |-
      indien de Autoriteit Financiële Markten binnen twee weken na ontvangst van de melding de beleggingsonderneming of
      een derde om nadere gegevens heeft verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen
      dertien weken na ontvangst van de melding.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: '95.3'
    text: |-
      Indien de Autoriteit Financiële Markten een derde verzoekt om nadere gegevens als bedoeld in het tweede lid,
      onderdeel b, doet zij daarvan mededeling aan de beleggingsonderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: '95.4'
    text: |-
      Bij de melding, bedoeld in het eerste lid, onderdeel a, legt de beleggingsonderneming ten aanzien van te benoemen
      personen die het dagelijks beleid zullen bepalen de volgende gegevens over:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.4.a
    text: een opgave van de naam, het privé-adres en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.4.b
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.4.c
    text: een opgave van de relevante geldige diploma’s;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.4.d
    text: een kopie van een geldig identiteitsbewijs; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.4.e
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: '95.5'
    text: |-
      Bij de melding, bedoeld in het eerste lid, onderdelen b en c, legt de beleggingsonderneming ten aanzien van te
      benoemen personen die het beleid zullen bepalen of mede bepalen of die onderdeel zullen zijn van een orgaan dat
      belast is met het toezicht op het beleid en de algemene gang van zaken de volgende gegevens over:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.5.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.5.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.5.c
    text: |-
      gegevens met betrekking tot de antecedenten, bedoeld in [artikel 13][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel13
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '13'
        hoofdstuk: '3'
  - number: 95.5.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: '95.6'
    text: |-
      Het vijfde lid, onderdelen b, c en d, is niet van toepassing indien de wijziging een persoon betreft wiens
      betrouwbaarheid voor de toepassing van de wet door een toezichthouder reeds is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: '95.7'
    text: 'Het eerste tot en met vijfde lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.7.a
    text: |-
      beleggingsondernemingen die voor de uitoefening van het bedrijf van bank een door de Nederlandsche Bank verleende
      vergunning hebben of voor de uitoefening van het bedrijf van financiële instelling een door de Nederlandsche Bank
      verleende verklaring van ondertoezichtstelling hebben; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: 95.7.b
    text: |-
      beleggingsondernemingen die voor het beheren van een instelling voor collectieve belegging in effecten een door de
      Autoriteit Financiële Markten verleende vergunning hebben.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel95
  - number: '96.1'
    text: |-
      Een beleggingsonderneming meldt aan de Autoriteit Financiële Markten ten minste twee weken tevoren schriftelijk een
      wijziging in:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel96
  - number: 96.1.a
    text: |-
      de maatregelen, bedoeld in [artikel 4:83, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 96.1.b
    text: |-
      de maatregelen, bedoeld in [artikel 4:87, eerste en tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 96.1.c
    text: |-
      de onderdelen van de bedrijfsvoering met betrekking waartoe ingevolge
      [artikel 4:14, tweede lid, aanhef en onderdelen a en b][ref1], regels zijn gesteld, voorzover het een significante
      wijziging betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 96.1.d
    text: |-
      de onderdelen van de bedrijfsvoering waarover ingevolge [artikel 4:14, tweede lid, aanhef en onderdeel c][ref1],
      regels zijn gesteld, voorzover het een significante wijziging betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 96.1.e
    text: |-
      de naam en het adres van het hoofdkantoor van de beleggingsonderneming, en, indien zij haar zetel niet in Nederland
      heeft, het adres van het bijkantoor, alsmede, in voorkomend geval, de plaats van haar zetel;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel96
  - number: 96.1.f
    text: |-
      indien zij met personen in een formele of feitelijke zeggenschapsstructuur is verbonden: de samenstelling daarvan;
      of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel96
  - number: 96.1.g
    text: |-
      de financiële diensten die de beleggingsonderneming verleent of de financiële producten waarop deze diensten
      betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel96
  - number: '96.2'
    text: 'Het eerste lid, met uitzondering van de onderdelen b en d, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel96
  - number: 96.2.a
    text: |-
      beleggingsondernemingen die voor de uitoefening van het bedrijf van bank een door de Nederlandsche Bank verleende
      vergunning hebben of voor de uitoefening van het bedrijf van financiële instelling een door de Nederlandsche Bank
      verleende verklaring van ondertoezichtstelling hebben; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel96
  - number: 96.2.b
    text: |-
      beleggingsondernemingen die voor het beheren van een instelling voor collectieve belegging in effecten een door de
      Autoriteit Financiële Markten verleende vergunning hebben.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel96
  - number: '97.1'
    text: |-
      Een beleggingsonderneming met zetel in Nederland die vanuit een in een andere lidstaat gelegen bijkantoor
      beleggingsdiensten verleent, meldt aan de Autoriteit Financiële Markten en de toezichthoudende instantie van de
      andere lidstaat schriftelijk ten minste een maand tevoren:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel97
  - number: 97.1.a
    text: een wijziging van de financiële diensten die zij vanuit het bijkantoor verleent;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel97
  - number: 97.1.b
    text: een wijziging in het adres in de lidstaat waar documenten kunnen worden opgevraagd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel97
  - number: 97.1.c
    text: een wijziging in de identiteit van de personen die het dagelijks beleid bepalen van het bijkantoor; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel97
  - number: 97.1.d
    text: het voornemen om het verlenen van beleggingsdiensten vanuit het bijkantoor te staken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel97
  - number: '97.2'
    text: |-
      Het eerste lid, aanhef en onderdelen b en c, is niet van toepassing op beleggingsondernemingen die hebben voldaan
      aan [artikel 92][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel92
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '92'
        hoofdstuk: '9'
        paragraaf: 9.1.1
        afdeling: '9.1'
  - number: '98'
    text: |-
      Een beleggingsonderneming met zetel in Nederland die door middel van het verrichten van diensten naar een andere
      lidstaat beleggingsdiensten verleent, meldt aan de Autoriteit Financiële Markten en de toezichthoudende instantie
      van de andere lidstaat schriftelijk ten minste een maand tevoren:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel98
  - number: 98.a
    text: een wijziging van de financiële diensten die de beleggingsonderneming in de andere lidstaat verleent; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel98
  - number: 98.b
    text: |-
      het voornemen om het verlenen van beleggingsdiensten door middel van het verrichten van diensten naar de andere
      lidstaat te staken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel98
  - number: '99.1'
    text: |-
      Een beleggingsonderneming met zetel in Nederland die vanuit een in een staat die geen lidstaat is gelegen
      bijkantoor beleggingsdiensten verleent, meldt aan de Autoriteit Financiële Markten schriftelijk ten minste een
      maand tevoren:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel99
  - number: 99.1.a
    text: een wijziging in het adres van het bijkantoor;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel99
  - number: 99.1.b
    text: een wijziging in de identiteit van de personen die het dagelijks beleid bepalen van het bijkantoor; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel99
  - number: 99.1.c
    text: het voornemen om het verlenen van beleggingsdiensten vanuit het bijkantoor te staken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel99
  - number: '99.2'
    text: |-
      Een beleggingsonderneming met zetel in Nederland die vanuit een in een staat die geen lidstaat is gelegen
      bijkantoor beleggingsdiensten verleent, meldt aan de Autoriteit Financiële Markten schriftelijk het voornemen tot
      wijziging van:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel99
  - number: 99.2.a
    text: de financiële diensten die zij vanuit het bijkantoor verleent; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel99
  - number: 99.2.b
    text: de maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel99
  - number: '99.3'
    text: |-
      De beleggingsonderneming geeft geen uitvoering aan het voornemen, bedoeld in het tweede lid, voordat de Autoriteit
      Financiële Markten heeft ingestemd met de wijziging. De Autoriteit Financiële Markten neemt een besluit omtrent
      instemming binnen twee maanden na ontvangst van de melding en stemt in met de wijziging, tenzij de bedrijfsvoering
      of de financiële positie van de beleggingsonderneming gelet op de voorgenomen wijziging niet toereikend is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel99
  - number: '99.4'
    text: |-
      Zodra de beleggingsonderneming het voornemen, bedoeld in het eerste lid, onderdeel c, uitvoert, meldt zij dit
      onverwijld aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel99
  - number: '99.5'
    text: |-
      De melding, bedoeld in het eerste en tweede lid, gaat vergezeld van een vertaling van de desbetreffende gegevens,
      voorzover de Autoriteit Financiële Markten dat verlangt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel99
  - number: '100'
    text: |-
      Een rechtspersoon als bedoeld in [artikel 2:105, eerste lid, van de wet][ref1] meldt aan de Autoriteit Financiële
      Markten binnen twee weken schriftelijk een wijziging in:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 100.a
    text: de naam en het adres van een aangesloten onderneming;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel100
  - number: 100.b
    text: de rechtsvorm van een aangesloten onderneming;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel100
  - number: 100.c
    text: |-
      indien een aangesloten onderneming een rechtspersoon is: de statutaire zetel, de statutaire naam en de handelsnaam
      of handelsnamen; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel100
  - number: 100.d
    text: 'indien een aangesloten onderneming is ingeschreven in het handelsregister: het nummer van de inschrijving.'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel100
  - number: '101'
    text: 'Deze paragraaf is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel101
  - number: 101.a
    text: bemiddelaars in verzekeringen met zetel in een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel101
  - number: 101.b
    text: |-
      financiëledienstverleners die voor de uitoefening van het bedrijf van bank of verzekeraar een door de Nederlandsche
      Bank verleende vergunning hebben of voor de uitoefening van het bedrijf van financiële instelling een door de
      Nederlandsche Bank verleende verklaring van ondertoezichtstelling hebben;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel101
  - number: 101.c
    text: |-
      financiëledienstverleners met zetel in een andere lidstaat of een aangewezen staat die het bedrijf van financiële
      instelling, bank of verzekeraar uitoefenen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel101
  - number: 101.d
    text: herverzekeringsbemiddelaars met zetel in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel101
  - number: '102.1'
    text: |-
      Een financiëledienstverlener meldt aan de Autoriteit Financiële Markten een wijziging in de gegevens die eerder
      door hemzelf of een andere financiële onderneming aan een toezichthouder zijn verstrekt ten behoeve van de
      beoordeling van de ingevolge de [wet][ref1] gestelde eisen met betrekking tot de betrouwbaarheid van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 102.1.a
    text: de personen die het beleid van de financiëledienstverlener bepalen of mede bepalen; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel102
  - number: 102.1.b
    text: |-
      de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en de algemene gang van
      zaken van de financiëledienstverlener.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel102
  - number: '102.2'
    text: |-
      De financiëledienstverlener meldt de wijziging schriftelijk en onverwijld nadat hij daarvan in het kader van de
      normale bedrijfsvoering kennis heeft genomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel102
  - number: '102.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op financiëledienstverleners die tevens beleggingsonderneming,
      beheerder van een beleggingsinstelling of beheerder van een icbe zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel102
  - number: '103.1'
    text: |-
      Een financiëledienstverlener meldt aan de Autoriteit Financiële Markten schriftelijk het voornemen tot benoeming
      van:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: 103.1.a
    text: een persoon die het beleid van de financiëledienstverlener bepaalt of mede bepaalt; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: 103.1.b
    text: |-
      een persoon die onderdeel is van een orgaan dat belast is met het toezicht op het beleid en de algemene gang van
      zaken van de financiëledienstverlener.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: '103.2'
    text: |-
      Een financiëledienstverlener geeft geen uitvoering aan het voornemen, bedoeld in het eerste lid, voordat de
      Autoriteit Financiële Markten heeft vastgesteld dat de betrouwbaarheid van de betrokken persoon buiten twijfel
      staat en deze persoon geschikt is. De Autoriteit Financiële Markten neemt een besluit omtrent de betrouwbaarheid
      en geschiktheid:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: 103.2.a
    text: binnen zes weken na ontvangst van de melding; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: 103.2.b
    text: |-
      indien de Autoriteit Financiële Markten binnen twee weken na ontvangst van de melding de financiëledienstverlener
      of een derde om nadere gegevens heeft verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk
      binnen dertien weken na ontvangst van de melding.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: '103.3'
    text: |-
      Indien de Autoriteit Financiële Markten een derde verzoekt om nadere gegevens als bedoeld in het tweede lid,
      onderdeel b, doet zij daarvan mededeling aan de financiëledienstverlener.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: '103.4'
    text: 'Bij de melding legt de financiëledienstverlener ten aanzien van de betrokken persoon de volgende gegevens over:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: 103.4.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, curriculum vitae, een opgave van de relevante geldige diploma's en de functie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: 103.4.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: 103.4.c
    text: |-
      gegevens met betrekking tot de antecedenten, bedoeld in [artikel 13][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel13
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '13'
        hoofdstuk: '3'
  - number: 103.4.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: '103.5'
    text: |-
      Het vierde lid, onderdelen b, c en d, is niet van toepassing indien de voorgenomen benoeming een persoon betreft
      wiens betrouwbaarheid voor de toepassing van de wet reeds is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel103
  - number: '104'
    text: |-
      Een financiëledienstverlener meldt aan de Autoriteit Financiële Markten binnen twee weken schriftelijk een
      wijziging in:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel104
  - number: 104.a
    text: zijn naam en adres;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel104
  - number: 104.b
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel104
  - number: 104.c
    text: 'indien hij een rechtspersoon is: zijn statutaire zetel, statutaire naam en handelsnaam of handelsnamen;'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel104
  - number: 104.d
    text: 'indien hij is ingeschreven in het handelsregister: het nummer van de inschrijving;'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel104
  - number: 104.e
    text: de financiële diensten die hij verleent of de financiële producten waarop deze diensten betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel104
  - number: 104.f
    text: 'indien hij een bemiddelaar in verzekeringen is: de natuurlijke personen die zijn beleid bepalen; of'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel104
  - number: 104.g
    text: |-
      indien hij een gevolmachtigde agent of ondergevolmachtigde agent is: de verzekeraar voor wie zijn volmacht geldt of
      de natuurlijke personen die zijn beleid bepalen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel104
  - number: '105'
    text: |-
      Een schadeverzekeraar met zetel in Nederland die de branche Aansprakelijkheid motorrijtuigen uitoefent of een
      schadeverzekeraar met zetel in een staat die geen lidstaat is die de branche Aansprakelijkheid motorrijtuigen
      uitoefent vanuit een in Nederland gelegen bijkantoor, meldt een wijziging in de naam of het adres van een door
      hem in een andere lidstaat aangestelde schaderegelaar als bedoeld in [artikel 4:70, tweede lid, van de wet][ref1]
      binnen twee weken schriftelijk aan de Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '106'
    text: |-
      Een schadeverzekeraar met zetel buiten Nederland die de branche Aansprakelijkheid motorrijtuigen uitoefent door
      middel van het verrichten van diensten naar Nederland meldt een wijziging in de akte van aanstelling van de
      schade-afhandelaar, bedoeld in [artikel 4:71, derde lid, van de wet][ref1] binnen twee weken schriftelijk aan de
      Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '107.1'
    text: |-
      De door een accountant als bedoeld in [artikel 4:27, tweede lid, van de wet][ref1] op grond van artikel 4:27,
      vierde lid, van de wet te verstrekken gegevens zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 107.1.a
    text: het accountantsverslag aan de bestuurders en de raad van commissarissen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel107
  - number: 107.1.b
    text: de directiebrieven; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel107
  - number: 107.1.c
    text: |-
      correspondentie tussen de accountant en de financiële onderneming die rechtstreeks betrekking heeft op de
      verklaring omtrent de getrouwheid van de jaarrekening van de financiële onderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel107
  - number: '107.2'
    text: |-
      De directiebrieven, bedoeld in het eerste lid, onderdeel b, met betrekking tot een icbe en een beheerder van een
      icbe bevatten in ieder geval een verklaring van de accountant of en zo ja, in hoeverre hij de inrichting van de
      bedrijfsvoering heeft beoordeeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel107
  - number: '108.1'
    text: |-
      Een accountant die voornemens is gegevens als bedoeld in [artikel 107][ref1] te verstrekken, stelt de financiële
      onderneming daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel107
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '107'
        hoofdstuk: '9'
        afdeling: '9.2'
  - number: '108.2'
    text: |-
      Indien de financiële onderneming dat wenst, kan zij zelf de gegevens aan de Autoriteit Financiële Markten
      verstrekken. In dat geval stelt zij de accountant daarvan in kennis. De accountant vergewist zich ervan dat de
      Autoriteit Financiële Markten de gegevens heeft ontvangen en dat de inhoud van de gegevens hem geen aanleiding
      geeft alsnog gegevens aan de Autoriteit Financiële Markten te verstrekken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108
  - number: '108.3'
    text: |-
      Indien de accountant schriftelijk gegevens verstrekt aan de Autoriteit Financiële Markten, zendt hij onverwijld aan
      de financiële onderneming een afschrift van de gegevens en, indien van toepassing, van de begeleidende brief.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108
  - number: 108a.1
    text: |-
      Met betrekking tot het voornemen, bedoeld in [artikel 4:27a, eerste lid, van de wet][ref1] legt de centrale
      tegenpartij over:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 108a.1.a
    text: een beschrijving van de voorgenomen wijziging, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108a
  - number: 108a.1.b
    text: |-
      gegevens op basis waarvan de Autoriteit Financiële Markten redelijkerwijs kan beoordelen of wordt voldaan aan
      hetgeen in de artikelen 36 tot en met 39 van de verordening, bedoeld in het eerste lid, is bepaald.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108a
  - number: 108a.2
    text: |-
      De centrale tegenpartij geeft geen uitvoering aan het voornemen voordat de Autoriteit Financiële Markten heeft
      ingestemd met de wijziging. De Autoriteit Financiële Markten neemt een besluit omtrent instemming:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108a
  - number: 108a.2.a
    text: binnen zes weken na ontvangst van de kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108a
  - number: 108a.2.b
    text: |-
      indien de Autoriteit Financiële Markten binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108a
  - number: 108b.1
    text: |-
      Met betrekking tot een voornemen tot wijziging als bedoeld in [artikel 4:27a, tweede lid, van de wet][ref1] legt de
      centrale effectenbewaarinstelling over aan de Autoriteit Financiële Markten:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 108b.1.a
    text: een beschrijving van de voorgenomen wijziging;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108b
  - number: 108b.1.b
    text: |-
      gegevens op basis waarvan de Autoriteit Financiële Markten redelijkerwijs kan beoordelen of wordt voldaan aan
      hetgeen in de artikelen 26 tot en met 38 en 48 tot en met 53 van de verordening centrale effectenbewaarinstellingen
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108b
  - number: 108b.2
    text: |-
      De centrale effectenbewaarinstelling geeft geen uitvoering aan het voornemen voordat de Autoriteit Financiële
      Markten heeft ingestemd met de wijziging.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108b
  - number: 108b.3
    text: |-
      Voordat de Autoriteit Financiële Markten besluit omtrent instemming,
      stelt zij de Nederlandsche Bank in kennis van het voorgenomen besluit.
      [Artikel 2b, tweede tot en met vierde lid, van het Besluit uitvoering EU-verordeningen financiële markten][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032230#Artikel2b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108b
    references:
      - id: ref1
        bwb_id: BWBR0032230
        artikel: 2b
  - number: 108b.4
    text: 'De Autoriteit Financiële Markten neemt een besluit omtrent instemming:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108b
  - number: 108b.4.a
    text: binnen zes weken na ontvangst van de kennisgeving;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108b
  - number: 108b.4.b
    text: |-
      indien de Autoriteit Financiële Markten binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van de
      kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108b
  - number: 108b.4.c
    text: |-
      indien de Autoriteit Financiële Markten de Nederlandsche Bank in kennis heeft gesteld van het voorgenomen besluit
      ingevolge het derde lid, binnen tien weken na de inkennisstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel108b
  - number: '109'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt in afwijking van [artikel 1][ref1], verstaan onder
      gelieerde partij:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 109.a
    text: |-
      persoon die met een aanbieder van beleggingsobjecten in een formele of feitelijke zeggenschapsstructuur is
      verbonden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel109
  - number: 109.b
    text: |-
      persoon die direct of indirect stemrecht kan uitoefenen of anderszins bepaalde rechten kan uitoefenen in een
      aanbieder van beleggingsobjecten waardoor invloed van betekenis kan worden uitgeoefend op diens zakelijk of
      financieel beleid;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel109
  - number: 109.c
    text: |-
      natuurlijke persoon die in een familierechtelijke betrekking staat of een persoonlijke relatie heeft met een
      bestuurder van een aanbieder van beleggingsobjecten of met een natuurlijke persoon als bedoeld in onderdeel a of
      b, op grond van welke relatie hij het handelen van de bestuurder of de natuurlijke persoon met betrekking tot de
      aanbieder van beleggingsobjecten kan beïnvloeden; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel109
  - number: 109.d
    text: |-
      rechtspersoon waarin een bestuurder van een aanbieder van beleggingsobjecten of een natuurlijke persoon als bedoeld
      in onderdeel c direct of indirect stemrecht kan uitoefenen of anderszins bepaalde rechten kan uitoefenen waardoor
      sprake is van invloed van betekenis op het zakelijk of financieel beleid van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel109
  - number: '110.1'
    text: |-
      In het beleggingsobjectprospectus, bedoeld in [artikel 4:30a, eerste lid, van de wet][ref1] worden, voorzover van
      toepassing, de volgende gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 110.1.a
    text: de naam, rechtsvorm, datum van oprichting, zetel en de plaats van het hoofdkantoor van de aanbieder;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.b
    text: |-
      een beschrijving van de formele of feitelijke zeggenschapsstructuur waarin de aanbieder met andere personen is
      verbonden en de met hem gelieerde partijen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.c
    text: |-
      de voorwaarden, alsmede de wijze waarop deze voorwaarden kunnen worden gewijzigd en de wijze van bekendmaking van
      een wijziging aan de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.d
    text: |-
      een beschrijving van de belangrijkste kenmerken van de serie van beleggingsobjecten waarvan het beleggingsobject
      deel uitmaakt, waaronder in ieder geval de aard, de bestaansduur en de risico’s, die onder meer inzichtelijk worden
      gemaakt door een risico-indicator, alsmede de effecten van die risico’s op het door de consument te realiseren
      rendement;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.e
    text: |-
      een beschrijving van de activiteiten van de aanbieder met betrekking tot de serie van beleggingsobjecten waarvan
      het beleggingsobject deel uitmaakt, voorzover mogelijk te onderscheiden in:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.e.1°
    text: operationele activiteiten, onder vermelding van de plaats waar deze plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.e.2°
    text: |-
      financieringsactiviteiten, voorzover mogelijk te onderscheiden in het als kredietnemer aangaan van overeenkomsten
      inzake krediet en het als crediteur uitzetten van gelden; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.e.3°
    text: |-
      uitbestedingsactiviteiten onder vermelding van het beleid inzake het uitbesteden van werkzaamheden, waaronder ten
      minste een beschrijving van de werkzaamheden die zijn uitbesteed, de naam en de plaats van de zetel van de derde
      waaraan werkzaamheden zijn uitbesteed, alsmede de vermelding, indien van toepassing, dat de derde een gelieerde
      partij is;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.f
    text: |-
      een beschrijving van de wijze waarop wordt bepaald of de opbrengsten door de aanbieder aan de consument worden
      uitgekeerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.g
    text: |-
      een beschrijving van de door de aanbieder te verstrekken garanties die aan de consument in het vooruitzicht worden
      gesteld;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.h
    text: 'een beschrijving van de transacties die worden verricht met gelieerde partijen, waaronder:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.h.1°
    text: |-
      de vermelding of een transactie onder marktconforme voorwaarden plaatsvindt, dan wel, indien dat niet het geval is,
      wat de reden daarvoor is; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.h.2°
    text: |-
      indien een transactie niet plaatsvindt op een gereglementeerde markt of een andere markt in financiële
      instrumenten: de vermelding of aan de transactie een onafhankelijke waardebepaling ten grondslag ligt of dat de
      waarde kan worden bepaald door een of meer bij de transactie betrokken partijen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.i
    text: |-
      de kosten op jaarbasis per serie van beleggingsobjecten waarvan het beleggingsobject deel uitmaakt, en de relevante
      aannames die daaraan ten grondslag liggen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: 110.1.j
    text: |-
      de gegevens op jaarbasis per serie van beleggingsobjecten waarvan het beleggingsobject deel uitmaakt, betreffende
      de brutowaarde, de financieringen, de prestatievergoedingen, en de rentebaten, met inbegrip van de daarbij
      gehanteerde waarderingsgrondslagen, waarbij als uitgangspunt geldt dat de brutowaarde wordt gebaseerd op de vrije
      verkoopwaarde per serie van beleggingsobjecten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: '110.2'
    text: |-
      [Artikel 49][ref1] is van overeenkomstige toepassing op het verstrekken van het beleggingsobjectprospectus door de
      aanbieder van het beleggingsobject onderscheidenlijk de bemiddelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel49
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
  - number: '110.3'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de wijze waarop de gegevens, bedoeld in het
      eerste lid, in het beleggingsobjectprospectus worden opgenomen alsmede met betrekking tot de wijze van berekening
      van de kosten, risico’s en opbrengsten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel110
  - number: '111'
    text: |-
      [Artikel 4:33, eerste lid, van de wet][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 111.a
    text: |-
      aanbieders van consumptief krediet, voorzover het consumptief krediet onderdeel uitmaakt van een complex
      product; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel111
  - number: 111.b
    text: aanbieders van consumptief krediet voorzover zij overeenkomsten inzake consumptief krediet beheren of uitvoeren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel111
  - number: '112.1'
    text: |-
      De informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1], met betrekking tot andere vormen van
      krediet dan bedoeld in de [artikelen 112a][ref2], [112b][ref3], [112d][ref4] en [112e][ref5], wordt schriftelijk of
      op een andere duurzame drager verstrekt in de vorm van het in [bijlage D][ref6] bij dit besluit opgenomen formulier
      en bevat de in die bijlage bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel112a
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel112b
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel112d
      [ref5]: https://wetten.overheid.nl/BWBR0020421#Artikel112e
      [ref6]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 112a
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 112b
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: 112d
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
      - id: ref5
        bwb_id: BWBR0020421
        artikel: 112e
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
      - id: ref6
        bwb_id: BWBR0020421
  - number: '112.2'
    text: |-
      De informatie, bedoeld in het eerste lid, wordt gebaseerd op de door de consument kenbaar gemaakte voorkeur en
      verstrekte informatie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
  - number: '112.3'
    text: |-
      De aanbieder of de bemiddelaar, indien de kredietovereenkomst tot stand is gekomen door tussenkomst van een
      bemiddelaar, anders dan als nevenactiviteit, verstrekt in aanvulling op de informatie, bedoeld in het eerste
      lid, de naam van de benchmark en de beheerder daarvan, alsmede de mogelijke gevolgen voor de consument, indien de
      kredietovereenkomst is afgesloten na 30 juni 2018 en een debetrentevoet gebruikt die is gebaseerd op een benchmark
      als bedoeld in artikel 3, eerste lid, onderdeel 3, van de verordening financiële benchmarks.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
  - number: '112.4'
    text: Informatie in aanvulling op de informatie, bedoeld in het eerste lid, wordt verstrekt in een afzonderlijk document.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
  - number: '112.5'
    text: |-
      Indien de overeenkomst op verzoek van de consument tot stand is gekomen met gebruikmaking van een techniek voor
      communicatie op afstand waardoor de in het eerste lid bedoelde informatie niet op de in dat lid voorgeschreven
      wijze voorafgaand aan de totstandkoming van de overeenkomst kan worden verstrekt, verstrekt de aanbieder de
      informatie onmiddellijk na de totstandkoming van de overeenkomst aan de consument.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
  - number: '112.6'
    text: |-
      De aanbieder verstrekt aan de consument op zijn verzoek een kosteloos exemplaar van de ontwerpovereenkomst inzake
      krediet, tenzij de aanbieder op het tijdstip van het verzoek niet voornemens is de overeenkomst met de consument
      aan te gaan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
  - number: '112.7'
    text: |-
      Ten aanzien van een overeenkomst inzake krediet waarbij de betalingen door de consument niet tot een directe
      overeenkomstige aflossing van het totale kredietbedrag leiden, maar dienen om, gedurende de periodes en onder
      de voorwaarden die in de overeenkomst inzake krediet of in een nevenovereenkomst zijn vastgesteld, kapitaal op
      te bouwen, bevat de op grond van het eerste lid te verstrekken informatie een duidelijke en beknopte vermelding
      dat de overeenkomst inzake krediet niet voorziet in een garantie tot aflossing van het totale uit hoofde van de
      overeenkomst opgenomen kredietbedrag, tenzij die garantie wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
  - number: '112.8'
    text: |-
      De aanbieder verstrekt de consument, teneinde deze in staat te stellen te beoordelen of de voorgestelde
      overeenkomst inzake krediet aan zijn behoeften en financiële situatie beantwoordt:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
  - number: 112.8.a
    text: een passende toelichting op de informatie, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
  - number: 112.8.b
    text: de voornaamste kenmerken van het voorgestelde krediet,
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
  - number: 112.8.c
    text: |-
      indien van toepassing, informatie inzake het goed of de dienst, bedoeld in [bijlage D, onderdeel 2][ref1], van dit
      besluit en van de verzekering of de rekening, bedoeld in onderdeel 3 van die bijlage;


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 112.8.d
    text: |-
      de specifieke gevolgen van het krediet voor de consument, met inbegrip van de gevolgen indien de consument niet
      betaalt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
  - number: '112.9'
    text: |-
      Indien informatie als bedoeld in het eerste lid niet voorafgaand aan de totstandkoming van de overeenkomst op de
      in dat lid bedoelde wijze kan worden bepaald, wordt zij bepaald met toepassing van de desbetreffende hypothese,
      bedoeld in [bijlage A, deel II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 112a.1
    text: |-
      De informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1] met betrekking tot krediet in de vorm van
      een geoorloofde debetstand waarbij is overeengekomen dat de ter zake verschuldigde betaling van de consument op
      verzoek of binnen een termijn van één tot drie maanden plaatsvindt, wordt schriftelijk of op een andere duurzame
      drager verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 112a.2
    text: 'De informatie bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.2.a
    text: het soort krediet;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.2.b
    text: |-
      de naam en adres en, indien de aanbieder van het krediet of de bemiddelaar in krediet een rechtspersoon is, de
      statutaire naam en handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.2.c
    text: het totale kredietbedrag;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.2.d
    text: de duur van de kredietovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.2.e
    text: |-
      de debetrentevoet, de voorwaarden die de toepassing van deze rentevoet regelen, en indices of referentievoeten die
      betrekking hebben op de aanvankelijke debetrentevoet;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.2.f
    text: |-
      de vanaf het sluiten van de overeenkomst inzake krediet in rekening te brengen kosten, alsmede in voorkomend geval
      de voorwaarden waaronder deze gewijzigd kunnen worden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.2.g
    text: |-
      het jaarlijks kostenpercentage, aan de hand van representatieve voorbeelden en met vermelding van alle voor de
      berekening van dat percentage gebruikte hypothesen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.2.h
    text: de voorwaarden en de procedure voor beëindiging van de overeenkomst inzake krediet;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.2.i
    text: |-
      de geldende rentevoet in geval de consument niet tijdig betaalt alsmede de wijzigingsmodaliteiten ervan en, in
      voorkomend geval, de kosten van niet-nakoming;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.2.j
    text: |-
      het recht van de consument op grond van [artikel 4:32 van de wet][ref1]onverwijld en kosteloos geïnformeerd te
      worden over het resultaat van de raadpleging van een gegevensbestand ter beoordeling van zijn kredietwaardigheid;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 112a.2.k
    text: |-
      informatie omtrent de, vanaf het moment waarop de overeenkomst tot stand is gekomen, in rekening te brengen kosten,
      alsmede, voor zover van toepassing, de voorwaarden waaronder deze kosten gewijzigd kunnen worden; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.2.l
    text: |-
      voor zover van toepassing, de periode gedurende welke de aanbieder van het krediet door de precontractuele
      informatie is gebonden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.3
    text: |-
      De informatie kan worden verstrekt door gebruikmaking van het formulier, opgenomen in [bijlage E][ref1] van dit
      besluit. Alle informatie wordt even opvallend weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 112a.4
    text: |-
      De aanbieder verstrekt aan de consument op zijn verzoek een kosteloos exemplaar van de ontwerpovereenkomst inzake
      krediet, tenzij de aanbieder op het tijdstip van het verzoek niet voornemens is de overeenkomst met de consument
      aan te gaan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
  - number: 112a.5
    text: |-
      Indien de overeenkomst op verzoek van de consument tot stand is gekomen met gebruikmaking van een techniek voor
      communicatie op afstand waardoor de in het eerste lid bedoelde informatie niet op de in dat lid voorgeschreven
      wijze voorafgaand aan de totstandkoming van de overeenkomst kan worden verstrekt, verstrekt de aanbieder,
      in afwijking van het eerste lid, de informatie, bedoeld in [artikel 7:61 van het Burgerlijk Wetboek][ref1],
      onmiddellijk na de totstandkoming van de overeenkomst aan de consument.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel61
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '61'
  - number: 112a.6
    text: |-
      Indien informatie als bedoeld in het eerste lid niet voorafgaand aan de totstandkoming van de overeenkomst op de
      in dat lid bedoelde wijze kan worden bepaald, wordt zij bepaald met toepassing van de desbetreffende hypothese,
      bedoeld in [bijlage A, deel II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 112b
    text: |-
      De informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1], met betrekking tot effectenkrediet
      kan worden verstrekt door gebruikmaking van het formulier, opgenomen in [bijlage F][ref2] van dit besluit. De
      informatie bevat de in die bijlage bedoelde gegevens. Alle informatie wordt even opvallend weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
  - number: 112c
    text: |-
      De informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1], met betrekking tot krediet in de vorm van
      een geoorloofde debetstand waarbij is overeengekomen dat de ter zake verschuldigde betaling van de consument binnen
      een termijn van een maand plaatsvindt, bevat de in [artikel 112a, tweede lid, onderdelen c, e, f en g][ref2],
      bedoelde gegevens met betrekking tot de kenmerken van het krediet.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel112a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 112a
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
  - number: 112d.1
    text: |-
      De informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1], met betrekking tot hypothecair krediet,
      anders dan krediet als bedoeld in [artikel 112e][ref2], wordt op papier of op een andere duurzame drager verstrekt
      in de vorm van het in [bijlage K][ref3] bij dit besluit opgenomen formulier en bevat de in die bijlage bedoelde
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel112e
      [ref3]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 112e
        hoofdstuk: '10'
        paragraaf: 10.2.1
        afdeling: '10.2'
      - id: ref3
        bwb_id: BWBR0020421
  - number: 112d.2
    text: |-
      De informatie, bedoeld in het eerste lid, wordt gebaseerd op de door de consument kenbaar gemaakte voorkeur en
      verstrekte informatie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112d
  - number: 112d.3
    text: Informatie in aanvulling op de informatie, bedoeld in het eerste lid, wordt verstrekt in een afzonderlijk document.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112d
  - number: 112d.4
    text: |-
      De aanbieder verstrekt aan de consument op zijn verzoek een kosteloos exemplaar van de ontwerpovereenkomst inzake
      hypothecair krediet, tenzij de aanbieder op het tijdstip van het verzoek niet voornemens is de overeenkomst met de
      consument aan te gaan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112d
  - number: 112d.5
    text: |-
      Indien naast een hypothecair krediet een nevendienst als bedoeld in
      [artikel 4:18, derde lid, van de wet ][ref1]wordt aangeboden, verstrekt de aanbieder de consument informatie over
      de mogelijkheden om die nevendiensten te beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 112e.1
    text: |-
      De informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1], met betrekking tot krediet als bedoeld in
      artikel 3, tweede lid, onderdeel a, van de richtlijn hypothecair krediet wordt op papier of op een andere duurzame
      drager verstrekt en bevat in ieder geval een beschrijving van de aard, risico’s en kosten van het krediet die
      gedetailleerd genoeg is om de consument in staat te stellen een weloverwogen beslissing te nemen. Alle informatie
      wordt even opvallend weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 112e.2
    text: 'De informatie bedoeld in het eerste lid, bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.2.a
    text: |-
      de naam en adres en, indien de aanbieder van het krediet of de bemiddelaar in krediet een rechtspersoon is, de
      statutaire naam en handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.2.b
    text: het totale kredietbedrag en de overeengekomen afzonderlijke opnames;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.2.c
    text: de duur van de kredietovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.2.d
    text: de rentevoet en de voorwaarden die de toepassing van deze rentevoet regelen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.2.e
    text: |-
      de vanaf het sluiten van de overeenkomst inzake krediet in rekening te brengen kosten, alsmede in voorkomend geval
      de voorwaarden waaronder deze gewijzigd kunnen worden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.2.f
    text: voor zover van toepassing, de kosten van niet-nakoming door de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.2.g
    text: de voorwaarden en procedure voor beëindiging van de overeenkomst inzake krediet;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.2.h
    text: |-
      het recht van de consument op grond van [artikel 4:32 van de wet][ref1] onverwijld en kosteloos geïnformeerd te
      worden over het resultaat van de raadpleging van een gegevensbestand ter beoordeling van zijn kredietwaardigheid;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 112e.2.i
    text: een weergave van de rechten en verplichtingen die voortvloeien uit de overeenkomst met betrekking tot het krediet;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.2.j
    text: |-
      voor zover van toepassing, de periode gedurende welke de aanbieder van krediet door de precontractuele informatie
      is gebonden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.3
    text: |-
      De aanbieder informeert de consument, teneinde deze in staat te stellen te beoordelen of de voorgestelde
      overeenkomst inzake krediet aan zijn behoeften en financiële situatie beantwoordt, over de risico’s en effecten van
      het krediet in geval van:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.3.a
    text: |-
      de ontwikkeling van de rentevoet, daarbij wordt een voorbeeld opgenomen uitgaande van een stijging van de rentevoet
      met 2%-punt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.3.b
    text: |-
      de ontwikkeling van de waarde van het onroerend goed waarop zekerheid is gevestigd, daarbij wordt een voorbeeld
      opgenomen uitgaande van een waardedaling van 20 procent;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.3.c
    text: wijzigingen in de overeengekomen opnames gedurende de duur van het krediet;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.3.d
    text: |-
      voor zover van toepassing, de consequenties van het opeisen van de lening en de effecten van een verkoopopbrengst
      lager dan het opgenomen krediet.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: 112e.4
    text: |-
      De aanbieder verstrekt aan de consument op zijn verzoek een kosteloos exemplaar van het ontwerp van de overeenkomst
      inzake hypothecair krediet als bedoeld in het eerste lid, tenzij de aanbieder op het tijdstip van het verzoek niet
      voornemens is de overeenkomst met de consument aan te gaan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel112e
  - number: '113.1'
    text: |-
      Een aanbieder van krediet gaat met een consument geen overeenkomst inzake krediet aan waarvan het totale
      kredietbedrag meer dan € 1000 bedraagt, indien hij niet beschikt over voldoende schriftelijke of op een andere
      duurzame drager vastgelegde informatie aangaande de financiële positie van de consument om, ter voorkoming van
      overkreditering, te kunnen beoordelen of het aangaan van de overeenkomst verantwoord is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel113
  - number: '113.2'
    text: |-
      Het eerste lid is niet van toepassing op aanbieders van krediet voorzover zij krediet aanbieden tegen
      onderpand van effecten als bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref1], die tot zekerheid dienen voor de terugbetaling van het krediet aan een consument
      die reeds op het moment van aangaan van de overeenkomst inzake krediet bezitter is van de te verpanden effecten als
      bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in [artikel 1:1 van de wet][ref2], van welk
      krediet het totale kredietbedrag gedurende de looptijd van de overeenkomst inzake het krediet niet hoger is dan
      zeventig procent van de waarde van de te verpanden effecten, indien het effecten betreffen als bedoeld in onderdeel
      a van de definitie van effect in [artikel 1:1 van de wet][ref3], dan wel niet hoger is dan tachtig procent van de
      waarde van de te verpanden effecten, indien het effecten betreffen als bedoeld in onderdeel b van de definitie van
      effect in [artikel 1:1 van de wet][ref4], en:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 113.2.1°
    text: |-
      die effecten als bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref1], zijn toegelaten tot de handel op een gereglementeerde markt; of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 113.2.2°
    text: |-
      de waarde van die effecten als bedoeld in onderdeel a, dan wel onderdeel b van de definitie van effect in
      [artikel 1:1 van de wet][ref1], door middel van een openbare prijsaanduiding voor een ieder kenbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '113.3'
    text: |-
      Het eerste lid is niet van toepassing op aanbieders van krediet voor zover zij krediet aanbieden in de vorm van
      een geoorloofde debetstand die binnen drie maanden dient te worden afgelost en die niet hoger is dan het bedrag dat
      maandelijks op de rekening wordt gestort.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel113
  - number: '114'
    text: |-
      Alvorens met een consument een overeenkomst inzake krediet aan te gaan waarvan het totale kredietbedrag meer
      dan € 250 bedraagt, raadpleegt een aanbieder van krediet de bij het stelsel van kredietregistratie waaraan hij
      deelneemt geregistreerde gegevens over reeds aan de consument verleende kredieten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel114
  - number: '115.1'
    text: |-
      Ter voorkoming van overkreditering legt een aanbieder van krediet de criteria vast die hij ten grondslag legt aan
      de beoordeling van een kredietaanvraag van een consument en past hij deze criteria toe bij de beoordeling van een
      kredietaanvraag.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115
  - number: '115.2'
    text: |-
      Het eerste lid is niet van toepassing op aanbieders van krediet voor zover zij krediet aanbieden in de vorm van
      een geoorloofde debetstand die binnen drie maanden dient te worden afgelost en die niet hoger is dan het bedrag dat
      maandelijks op de rekening wordt gestort.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115
  - number: '115.3'
    text: |-
      Bij ministeriële regeling worden de inkomenscriteria vastgesteld en de maximale hoogte van het hypothecair krediet
      in verhouding tot de waarde van de woning.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115
  - number: '115.4'
    text: |-
      In aanvulling op het eerste lid past een aanbieder van hypothecair krediet de bij ministeriële regeling
      vastgestelde inkomenscriteria toe bij de beoordeling van een aanvraag voor een hypothecair krediet.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115
  - number: '115.5'
    text: |-
      Een aanbieder van hypothecair krediet houdt bij de beoordeling van de kredietaanvraag rekening met het bij
      ministeriële regeling bepaalde maximale hypothecair krediet in verhouding tot de waarde van de woning.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115
  - number: '115.6'
    text: 'De waarde van de woning is:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115
  - number: 115.6.1°
    text: |-
      de koopsom of aannemingsom dan wel de kosten volgens de begroting van een bouwkundig bedrijf, eventueel vermeerderd
      met de kosten van de grond, kosten van de bouw, inclusief de kosten voor meerwerk, bouwrente en renteverlies
      tijdens de bouwperiode, en de aansluiting op nutsvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115
  - number: 115.6.2°
    text: |-
      de marktwaarde van de woning blijkens een door een deskundig taxateur opgemaakt taxatierapport dat op het moment
      van aangaan van het hypothecair krediet niet ouder is dan een jaar, eventueel na verbouwing; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115
  - number: 115.6.3°
    text: |-
      de waarde van de woning zoals laatstelijk bepaald op grond van de [Wet waardering onroerende zaken][ref1] of
      de waarde op grond van een modelmatige waardering, met dien verstande dat in beide gevallen de hoogte van het
      hypothecair krediet niet meer mag bedragen dan 90% van de aldus vastgestelde waarde van de woning.


      [ref1]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0007119
  - number: '115.7'
    text: |-
      In afwijking van het zesde lid, onder 2°, mag tevens worden uitgegaan van de waarde van de woning zoals laatstelijk
      bepaald op grond van de [Wet waardering onroerende zaken][ref1], indien sprake is van een aanvraag van een
      hypothecair krediet met betrekking tot een woning die reeds geheel of gedeeltelijk in eigendom is van de consument
      of met betrekking tot een woning die door erfopvolging geheel of gedeeltelijk door de consument wordt verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0007119
  - number: 115a
    text: |-
      Een aanbieder van krediet rekent geen hogere kredietvergoeding dan op grond van het
      [Besluit kredietvergoeding][ref1] ten hoogste toegelaten kredietvergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005233
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115a
    references:
      - id: ref1
        bwb_id: BWBR0005233
  - number: 115ab.1
    text: |-
      Een aanbieder van hypothecair krediet stelt een consument onverwijld in kennis van een afwijzing van een verzoek
      van de consument om een overeenkomst inzake hypothecair krediet te sluiten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115ab
  - number: 115ab.2
    text: |-
      Indien de afwijzing, bedoeld in het eerste lid, het gevolg is van een raadpleging van een stelsel van
      kredietregistratie stelt de aanbieder de consument in kennis van het resultaat van de raadpleging en van informatie
      met betrekking tot dat stelsel.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115ab
  - number: 115b
    text: |-
      De informatie, bedoeld in [artikel 4:37c, zesde lid, van de wet][ref1], die voorafgaand aan het aanbieden van
      rechten van deelneming aan de Autoriteit Financiële Markten dient te worden verstrekt, voldoet aan de ingevolge
      artikel 31 van de richtlijn beheerders van alternatieve beleggingsinstellingen vastgestelde normen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 115c.1
    text: |-
      Een Nederlandse beheerder van een beleggingsinstelling beschikt over procedures en maatregelen die waarborgen
      dat wordt voldaan aan de ingevolge artikel 14 van de richtlijn beheerders van alternatieve beleggingsinstellingen
      gestelde regels aangaande het voorkomen van en omgaan met belangenconflicten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115c
  - number: 115c.2
    text: |-
      Indien aan een beheerder van een beleggingsinstelling diensten worden verleend door een prime broker neemt de
      beheerder de in artikel 14, derde lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen gestelde
      regels in acht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115c
  - number: 115i
    text: |-
      De waardering van de activa en de berekening van de intrinsieke waarde per recht van deelneming van een Nederlandse
      beheerder van een beleggingsinstelling voldoet aan de ingevolge artikel 19 van de richtlijn beheerders van
      alternatieve beleggingsinstellingen gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115i
  - number: 115j
    text: |-
      Het prospectus, bedoeld in [artikel 4:37l, eerste lid, van de wet][ref1], bevat ten minste de gegevens,
      bedoeld in artikel 23, eerste en tweede lid, eerste volzin, van de richtlijn beheerders van alternatieve
      beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115j
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 115k.1
    text: |-
      De informatie, bedoeld in [artikel 4:37m, eerste lid, van de wet][ref1] omvat ten minste de gegevens, bedoeld
      in artikel 23, tweede lid, tweede volzin, vierde en vijfde lid, van de richtlijn beheerders van alternatieve
      beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115k
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 115k.2
    text: |-
      De beheerder van een beleggingsinstelling neemt bij het verstrekken van de gegevens, bedoeld in het eerste lid
      de ingevolge artikel 23, zesde lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen door de
      Europese Commissie gestelde regels in acht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115k
  - number: 115l.1
    text: |-
      De beheerder van een beleggingsinstelling verstrekt de gegevens genoemd in artikel 24, eerste, tweede en vierde
      lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen, voor zover op hem van toepassing. De
      beheerder van een beleggingsinstelling verstrekt daarnaast, voor zover de Autoriteit Financiële Markten hierom
      verzoekt, alle gegevens genoemd in artikel 24, derde en vijfde lid, van de richtlijn beheerders van alternatieve
      beleggingsinstellingen. Deze gegevens voldoen aan de ingevolge artikel 24, zesde lid, van deze richtlijn door de
      Europese Commissie gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115l
  - number: 115m.1
    text: |-
      Het bestuursverslag en de jaarrekening, bedoeld in [artikel 4:37o, eerste en tweede lid, van de wet][ref1],
      bevatten ten minste de gegevens, bedoeld in artikel 22, tweede lid, van de richtlijn beheerders van alternatieve
      beleggingsinstellingen en de in artikel 29, tweede lid, van deze richtlijn genoemde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115m
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 115m.2
    text: |-
      Het bestuursverslag en de jaarrekening voldoen aan de ingevolge artikel 22, vierde lid, van de richtlijn beheerders
      van alternatieve beleggingsinstellingen gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115m
  - number: 115n
    text: |-
      De kennisgeving, bedoeld in [artikel 4:37t, eerste lid, van de wet][ref1], bevat ten minste de gegevens, bedoeld in
      artikel 27, derde lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115n
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 115o
    text: |-
      Het bestuursverslag, bedoeld in [artikel 4:37u, eerste lid, onderdeel a, van de wet][ref1], bevat de gegevens,
      bedoeld in artikel 29, tweede lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115o
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 115p
    text: |-
      Deze paragraaf is van toepassing voor zover een beheerder van een beleggingsinstelling rechten van deelneming
      aanbiedt aan niet-professionele beleggers in Nederland.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115p
  - number: 115q.1
    text: |-
      Een beheerder voert een adequaat beleid dat een integere uitoefening van zijn bedrijf waarborgt. Hieronder wordt
      verstaan dat:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115q
  - number: 115q.1.a
    text: belangenverstrengeling wordt tegengegaan;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115q
  - number: 115q.1.b
    text: |-
      wordt tegengegaan dat de beheerder of haar werknemers strafbare feiten of andere wetsovertredingen begaan die het
      vertrouwen in de beheerder of in de financiële markten kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115q
  - number: 115q.1.c
    text: |-
      wordt tegengegaan dat wegens haar cliënten het vertrouwen in de beheerder of in de financiële markten kan worden
      geschaad; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115q
  - number: 115q.1.d
    text: |-
      wordt tegengegaan dat andere handelingen door de beheerder of haar werknemers worden verricht die op een dusdanige
      wijze ingaan tegen hetgeen volgens het ongeschreven recht in het maatschappelijk verkeer betaamt, dat hierdoor het
      vertrouwen in de beheerder of in de financiële markten ernstig kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115q
  - number: 115q.2
    text: |-
      [Artikel 4:11, vierde lid, van de wet][ref1] en de [artikelen 17][ref2], [19][ref3] en [20][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel20
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115q
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 115r.1
    text: |-
      Werknemers van een beheerder en andere personen die door de desbetreffende beheerder zijn belast met het beheren
      van beleggingsinstellingen, beschikken over de nodige vakbekwaamheid en deskundigheid om de hun toevertrouwde
      verantwoordelijkheid uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115r
  - number: 115r.2
    text: |-
      Voor de toepassing van het eerste lid wordt rekening gehouden met de aard, omvang en risico’s van de beheerder en
      zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115r
  - number: 115s.1
    text: 'De bedrijfsvoering van een beheerder omvat ten minste procedures en maatregelen die waarborgen dat:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115s
  - number: 115s.1.a
    text: |-
      een functiescheiding bestaat tussen het verrichten van rechtshandelingen met betrekking tot het vermogen van de
      beleggingsinstelling en het controleren en administreren van deze handelingen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115s
  - number: 115s.1.b
    text: de berekening van de intrinsieke waarde van de beleggingsinstelling aansluit bij de financiële administratie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115s
  - number: 115s.1.c
    text: |-
      er, voor zover mogelijk, een systematische, toegankelijke en actuele administratie van deelnemers in de
      beleggingsinstelling is waarin, voor zover van toepassing, de met de deelnemers gemaakte afspraken inzichtelijk
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115s
  - number: 115s.2
    text: |-
      De maatregelen en procedures, bedoeld in het eerste lid, aanhef en onderdeel b, voorzien er in ieder geval in dat
      de voor de intrinsieke waardebepaling gebruikte subadministraties ten minste een keer per maand worden aangesloten
      met de saldibalans en dat de daaruit voortvloeiende verschillen worden geanalyseerd en gecorrigeerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115s
  - number: 115s.3
    text: |-
      Een beheerder richt voor iedere beleggingsinstelling die hij beheert afzonderlijk een bedrijfsvoering als bedoeld
      in het eerste lid in.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115s
  - number: 115t.1
    text: |-
      Een beheerder draagt zorg voor een adequate behandeling van klachten van niet-professionele beleggers over zijn
      financiële diensten of financiële producten. Hiertoe:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115t
  - number: 115t.1.a
    text: |-
      beschikt de beheerder over een interne klachtenprocedure, gericht op een spoedige en zorgvuldige behandeling van
      klachten; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115t
  - number: 115t.1.b
    text: |-
      is de beheerder aangesloten bij een door Onze Minister erkende geschilleninstantie die geschillen behandelt met
      betrekking tot zijn financiële diensten of financiële producten, tenzij er geen zodanige geschilleninstantie is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115t
  - number: 115t.2
    text: |-
      De [artikelen 40 tot en met 44][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel40
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115t
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '40'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 115u
    text: Een beheerder behandelt deelnemers onder vergelijkbare omstandigheden op gelijke wijze.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115u
  - number: 115v.1
    text: Een beheerder beschikt over een website.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115v
  - number: 115v.2
    text: |-
      De beheerder vermeldt het adres van de website in het prospectus, bedoeld in [artikel 4:37l van de wet][ref1], in
      de halfjaarcijfers, bedoeld in [artikel 115y][ref2], in zijn bestuursverslag en in de bestuursverslagen van de door
      hem beheerde beleggingsinstellingen, bedoeld in [artikel 4:37o, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel115y
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115v
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 115y
        hoofdstuk: '10'
        paragraaf: 10.3.1
        afdeling: '10.3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 115v.3
    text: |-
      Telkens wanneer een beleggingsinstelling rechten van deelneming aanbiedt, verkoopt, inkoopt of daarop terugbetaalt,
      publiceert de beheerder de intrinsieke waarde van de rechten van deelneming onverwijld op zijn website, onder
      vermelding van het moment waarop de bepaling van de intrinsieke waarde plaatsvond.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115v
  - number: 115v.4
    text: |-
      De [artikelen 4:46, tweede en vierde lid][ref1], [4:46a, tweede lid][ref2], en [4:49, eerste lid, van de wet][ref3]
      en [artikel 50, eerste lid, met uitzondering van onderdeel b, en tweede lid][ref4], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel50
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115v
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '50'
        hoofdstuk: '8'
        paragraaf: 8.1.2
        afdeling: '8.1'
  - number: 115w.1
    text: |-
      Een beheerder heeft op zijn website de voorwaarden die gelden tussen een door hem beheerde beleggingsinstelling en
      de deelnemers beschikbaar.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115w
  - number: 115w.2
    text: |-
      [Artikel 4:47, tweede, derde en zesde lid, van de wet][ref1] en [artikel 116b][ref2] zijn van toepassing, met dien
      verstande dat de informatie alleen op de website van de beheerder gepubliceerd dient te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel116b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115w
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 116b
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 115w.3
    text: |-
      [Artikel 4:47, vierde en vijfde lid, van de wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115w
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 115x.1
    text: |-
      Onverminderd [artikel 115j][ref1] bevat het prospectus tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel115j
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115x
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 115j
        hoofdstuk: '10'
        paragraaf: 10.3.1
        afdeling: '10.3'
  - number: 115x.1.a
    text: |-
      de gegevens, genoemd in [bijlage I][ref1], met uitzondering van de onderdelen 1.3, 1.5, 1.6, 1.7, 1.8, 1.10, 3.2,
      3.3, 4.7, 5.1, 5.3, 5.12, 5.15–5.18, 5.20, 7.1, 7.4, 10.2 en 11.1.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115x
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 115x.1.b
    text: |-
      de gegevens, genoemd in [bijlage I][ref1], onderdelen 3.2, 3.3, 4.7 en 10.2, met dien verstande dat publicatie
      alleen geschiedt op de website van de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115x
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 115x.1.c
    text: |-
      de gegevens die voor beleggers noodzakelijk zijn om zich een oordeel te vormen over de beleggingsinstelling en de
      daaraan verbonden kosten en risico’s;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115x
  - number: 115x.1.d
    text: |-
      een verklaring van de beheerder dat hijzelf, de beleggingsinstelling en de eventueel daaraan verbonden bewaarder
      voldoen aan de bij of krachtens de [wet][ref1] gestelde regels en dat het prospectus voldoet aan de bij of
      krachtens de wet gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115x
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 115x.1.e
    text: |-
      een mededeling van een accountant, onder vermelding van zijn naam en kantooradres, dat het prospectus de ingevolge
      de [wet][ref1] voorgeschreven gegevens bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115x
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 115x.2
    text: |-
      De Autoriteit Financiële Markten kan verlangen dat het prospectus, bedoeld in [artikel 4:37l van de wet][ref1],
      van een beheerder, in een of meer door haar te bepalen talen beschikbaar wordt gesteld indien dit, gelet op de
      voorgenomen verspreiding van het prospectus, noodzakelijk is voor een adequate informatieverschaffing aan het
      publiek.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115x
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 115x.3
    text: |-
      [Artikel 118, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel118
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115x
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '118'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 115x.4
    text: |-
      Dit artikel is niet van toepassing ten aanzien van beleggingsinstellingen waarvan de rechten van deelneming
      verhandelbaar zijn en niet op verzoek van de deelnemers ten laste van de activa direct of indirect worden ingekocht
      of terugbetaald.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115x
  - number: 115y.1
    text: |-
      Een beheerder verstrekt binnen zes maanden na afloop van het boekjaar aan de Autoriteit
      Financiële Markten de jaarrekening, het bestuursverslag en de overige gegevens, bedoeld
      in de [artikelen 361, eerste lid][ref1], [391, eerste lid][ref2], onderscheidenlijk
      [392, eerste lid, onderdelen a tot en met h, van Boek 2 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel391
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115y
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '391'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '392'
  - number: 115y.2
    text: |-
      De beheerder verstrekt de jaarrekening, het bestuursverslag en de overige gegevens, bedoeld in het
      eerste lid, wat de indeling en inhoud betreft onverminderd de [artikelen 122 tot en met 124][ref1],
      in de vorm waarin deze zijn opgemaakt krachtens of de internationale jaarrekeningstandaarden
      of [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2], met uitzondering van
      [artikel 396, zevende lid, van Boek 2 van het Burgerlijk Wetboek][ref3], voor zover het de vrijstelling van
      de verplichting, bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4], betreft en
      [artikel 403 van Boek 2 van het Burgerlijk Wetboek][ref5] voor zover het een beheerder betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel396
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel403
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115y
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '122'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0003045
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '396'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '403'
  - number: 115y.3
    text: |-
      De beheerder maakt binnen zes maanden na afloop van het boekjaar de jaarrekening, het bestuursverslag en de overige
      gegevens, bedoeld in het eerste lid, openbaar door publicatie op de website van de beheerder.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115y
  - number: 115y.4
    text: |-
      De beheerder maakt binnen zes maanden na afloop van het boekjaar een jaarrekening en een bestuursverslag van de
      door hem beheerde beleggingsinstellingen, bedoeld in [artikel 4:37o, eerste lid, van de wet][ref1], openbaar door
      publicatie op zijn website.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115y
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 115y.5
    text: |-
      Het bestuursverslag van een beleggingsinstelling, bedoeld in [artikel 4:37o, van de wet][ref1], bevat een
      verklaring van de beheerder dat hij voor de beleggingsinstelling beschikt over een beschrijving van de inrichting
      van de bedrijfsvoering die voldoet aan het bepaalde ingevolge de [artikelen 3:17, tweede lid, onderdeel c][ref2],
      en [4:14, eerste lid, van de wet][ref3], en dat de bedrijfsvoering van de beleggingsinstelling effectief en
      overeenkomstig de beschrijving functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115y
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 115y.6
    text: |-
      De beheerder verstrekt binnen negen weken na afloop van de eerste helft van het boekjaar zijn halfjaarcijfers en de
      halfjaarcijfers van de door hem beheerde beleggingsinstellingen aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115y
  - number: 115y.7
    text: |-
      De beheerder maakt binnen negen weken na afloop van de eerste helft van het boekjaar de halfjaarcijfers, bedoeld in
      het vijfde lid, openbaar door publicatie op de website van de beheerder.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115y
  - number: 115y.8
    text: |-
      De beheerder houdt de informatie, bedoeld in het derde, vierde en zevende lid, gedurende ten minste drie jaar
      beschikbaar op zijn website.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115y
  - number: 115y.9
    text: |-
      De [artikelen 122 tot en met 125][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel122
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115y
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '122'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: 115y.10
    text: |-
      Het eerste tot en met het negende lid is niet van toepassing op beheerders die beleggingsinstellingen beheren
      waarvan de rechten van deelneming zijn toegelaten tot de handel op een in Nederland gelegen of functionerende
      gereglementeerde markt en niet op verzoek van de deelnemers ten laste van de activa direct of indirect worden
      ingekocht of terugbetaald.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115y
  - number: 115y.11
    text: |-
      Onverminderd het bepaalde in [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] kan de Autoriteit Financiële
      Markten op aanvraag geheel of gedeeltelijk, al dan niet voor bepaalde tijd, ontheffing verlenen van het eerste tot
      en met het negende lid, indien de aanvrager aantoont dat daaraan redelijkerwijs niet kan worden voldaan en dat de
      doeleinden die dit artikel beoogt te bereiken anderszins worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115y
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 115z
    text: |-
      Indien van de in Nederland gevoerde of te voeren naam van een beheerder of een door hem beheerde
      beleggingsinstelling gevaar voor verwarring of misleiding is te duchten, kan de Autoriteit Financiële Markten
      verlangen dat de beheerder onderscheidenlijk de beleggingsinstelling:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115z
  - number: 115z.a
    text: de naam wijzigt; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115z
  - number: 115z.b
    text: een verklarende vermelding aan de naam toevoegt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115z
  - number: 115aa
    text: |-
      Indien een beheerder de inkoop of terugbetaling van rechten van deelneming in een door hem beheerde
      beleggingsinstelling opschort, stelt hij de Autoriteit Financiële Markten, onverwijld daarvan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115aa
  - number: 115bb.1
    text: |-
      Een beheerder stelt voor elke beleggingsinstelling, met rechten van deelneming die niet verhandelbaar zijn of
      die op verzoek van de deelnemers ten laste van de activa direct of indirect worden ingekocht of terugbetaald,
      waarvan door hem rechten van deelneming worden aangeboden aan niet-professionele beleggers een essentiële-
      informatiedocument op als bedoeld in artikel 5 van de verordening essentiële-informatiedocumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115bb
  - number: 115bb.2
    text: De beheerder houdt een bijgewerkte versie van de essentiële beleggingsinformatie beschikbaar op zijn website.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115bb
  - number: 115bb.3
    text: |-
      De verordening essentiële-informatiedocumenten is van overeenkomstige toepassing voor zover de aard van de
      beleggingsinstelling zich hiertegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115bb
  - number: 115cc
    text: |-
      Een beheerder benadert personen die geen professionele belegger zijn, of die geen deelnemer zijn in de
      beleggingsinstelling, direct noch indirect in persoon, anders dan door middel van een techniek voor communicatie op
      afstand als bedoeld in [artikel 81][ref1], tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel81
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115cc
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '81'
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
  - number: 115cc.a
    text: de betrokkene daarmee vooraf uitdrukkelijk schriftelijk dan wel elektronisch mee heeft ingestemd; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115cc
  - number: 115cc.b
    text: de betrokkene in het contact slechts informatiemateriaal wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115cc
  - number: 115dd
    text: |-
      Door of namens een beleggingsinstelling worden geen transacties uitgevoerd voor haar rekening met een zodanige
      frequentie of van een zodanige omvang dat dit gezien de omstandigheden kennelijk slechts strekt tot bevoordeling
      van de beheerder, de beleggingsinstelling of met de beheerder, of bewaarder gelieerde partijen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115dd
  - number: 115ee.1
    text: |-
      Een beheerder van een beleggingsinstelling met zetel in een andere lidstaat die in Nederland rechten van deelneming
      aanbiedt aan niet-professionele beleggers treft voorzieningen om de taken te vervullen, bedoeld in artikel 43bis,
      eerste lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115ee
  - number: 115ee.2
    text: |-
      De beheerder van een beleggingsinstelling of een derde aan wie de taken, bedoeld in artikel 43bis, eerste lid, van
      de richtlijn beheerders van alternatieve beleggingsinstellingen zijn uitbesteed, zorgt ervoor dat de informatie
      die op grond van artikel 43bis, eerste lid, aan de deelnemers wordt verstrekt, elektronisch beschikbaar is en is
      opgesteld in de Nederlandse of een andere door de Autoriteit Financiële Markten goedgekeurde taal.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115ee
  - number: 115ee.3
    text: |-
      Indien de beheerder van een beleggingsinstelling de taken, bedoeld in artikel 43bis, eerste lid, van de
      richtlijn beheerders van alternatieve beleggingsinstellingen, uitbesteedt aan een derde wordt de benoeming van
      de derde schriftelijk vastgelegd in een overeenkomst waarin is bepaald welke taken niet door de beheerder van de
      beleggingsinstelling worden vervuld en dat de beheerder alle relevante informatie en documenten aan de derde zal
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel115ee
  - number: 116b
    text: |-
      De advertentie en mededeling op de website van de beheerder van een icbe, bedoeld in
      [artikel 4:47, eerste lid, van de wet][ref1], bevatten tenminste:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel116b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 116b.a
    text: een beschrijving van de voorgestelde voorwaardenwijziging;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel116b
  - number: 116b.b
    text: |-
      een beschrijving van de gevolgen voor de rechten en verplichtingen van de deelnemers van de voorgestelde
      voorwaardenwijziging;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel116b
  - number: 116b.c
    text: |-
      indien van toepassing: de wijze en datum waarop deelnemers inspraak kunnen uitoefenen ten aanzien van de
      voorgestelde voorwaardenwijziging;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel116b
  - number: 116b.d
    text: de datum waarop de voorgestelde voorwaardenwijziging van kracht zal worden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel116b
  - number: 116b.e
    text: |-
      een vermelding van het feit dat een ten opzichte van het voorstel ongewijzigde voorwaardenwijziging niet separaat
      zal worden bekendgemaakt, maar als onderdeel van de gewijzigde voorwaarden op de website beschikbaar zal zijn
      alsmede de datum waarop deze gewijzigde voorwaarden op de website beschikbaar zullen zijn;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel116b
  - number: 116b.f
    text: |-
      indien van toepassing: de toepasselijkheid van [artikel 4:47, vierde lid, van de wet][ref1] alsmede de datum waarop
      de in dat lid genoemde termijn aanvangt en eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel116b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '117'
    text: |-
      Het registratiedocument, bedoeld in [artikel 4:48, eerste lid, van de wet][ref1], bevat ten minste de gegevens,
      genoemd in [bijlage H][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
  - number: '118.1'
    text: |-
      Onverminderd [artikel 4:49, tweede lid, aanhef en onderdelen a tot en met d, van de wet][ref1] bevat het
      prospectus, bedoeld in [artikel 4:49, eerste lid, van de wet][ref2], de gegevens, genoemd in [bijlage I][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020421
  - number: '118.2'
    text: 'In het prospectus worden in afzonderlijke paragrafen de gegevens opgenomen over:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel118
  - number: 118.2.a
    text: |-
      de kosten van de icbe en de wijze waarop zij ten laste komen van het resultaat van de icbe, in mindering worden
      gebracht op het beheerde vermogen of anderszins direct of indirect ten laste komen van de deelnemers in de icbe; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel118
  - number: 118.2.b
    text: de aan de icbe verbonden risico’s.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel118
  - number: '118.3'
    text: |-
      De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot de wijze waarop de gegevens, bedoeld
      in [bijlage I][ref1], worden opgenomen in het prospectus.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '119'
    text: |-
      Een beheerder van een icbe of een icbe verstrekt de jaarrekening, het bestuursverslag en de overige gegevens,
      bedoeld in [artikel 4:51, eerste lid, van de wet][ref1], wat de indeling en inhoud betreft, onverminderd
      de [artikelen 121 tot en met 124][ref2] en [146][ref3], in de vorm waarin deze zijn opgemaakt krachtens
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref4] of de internationale jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel121
