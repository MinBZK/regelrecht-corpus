        paragraaf: '2.1'
  - number: '9.2'
    text: |-
      De examens van de modules, bedoeld in het eerste lid, worden afgelegd bij een op grond van [artikel 11a][ref1]
      erkend exameninstituut.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11a
