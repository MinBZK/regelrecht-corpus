                  Adviseur pensioen


                  Arbeidsongeschiktheidsverzekeringen, werkloosheidsverzekeringen of overlijdensrisicoverzekeringen
      indien gecombineerd met pensioen
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel10
  - number: '11.1'
    text: |-
      De houder van een diploma of erkenning als bedoeld in [artikel 6, eerste lid, onderdeel b][ref1], is uitsluitend
      bevoegd werkzaamheden als bedoeld in [artikel 7][ref2] te verrichten, indien hij in elke PE-periode, niet zijnde
      de PE-periode waarin het diploma of de erkenning is behaald, met goed gevolg een examen aflegt in het kader van
      permanente educatie. De eerste PE-periode loopt van 1 april 2017 tot en met 31 maart 2019. De daaropvolgende PE-
      perioden bedragen telkens drie jaar, waarvan de eerstvolgende PE-periode aanvangt op 1 april 2019.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel7
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid behoeft de houder van een diploma of erkenning die beschikt over een door Onze
      Minister afgegeven certificaat waaruit blijkt dat hij gedurende een bepaalde PE-periode vakinhoudelijk betrokken
      is geweest bij de ontwikkeling van examenvragen met betrekking tot de voor zijn beroepskwalificatie relevante
      eindtermen en toetstermen ten behoeve van permanente educatie, in die PE-periode geen examen in het kader van
      permanente educatie af te leggen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11
  - number: '11.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11
  - number: '11.4'
    text: |-
      Indien de houder van een diploma of erkenning op grond van het eerste lid niet langer bevoegd is de in
      [artikel 7][ref1] bedoelde werkzaamheden te verrichten, kan hij een bijzonder examen afleggen. Indien dit examen
      met goed gevolg wordt afgelegd, herleeft de bevoegdheid om de in artikel 7 bedoelde werkzaamheden te verrichten.
      Het eerstvolgende periodieke examen in het kader van permanente educatie wordt vervolgens afgelegd in de PE-periode
      volgend op die waarin het bijzondere examen is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel7
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '11.5'
    text: |-
      De examens, bedoeld in het eerste en vierde lid, voldoen aan bij ministeriële regeling vast te stellen eindtermen
      en toetstermen en worden afgelegd bij een op grond van [artikel 11a][ref1] erkend exameninstituut. Indien Onze
      Minister daar gelegenheid toe biedt, kunnen deze examens tevens bij Onze Minister worden afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11a
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 11a.1
    text: |-
      Onze Minister erkent een exameninstituut op aanvraag, indien de aanvrager aantoont dat zal worden voldaan aan
      [artikel 11b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11b
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 11a.2
    text: |-
      Onze Minister beslist op een aanvraag om erkenning binnen vier maanden nadat de aanvraag is ingediend. De
      beslissingstermijn kan ten hoogste tweemaal met twee maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11a
  - number: 11a.3
    text: Onze Minister kan aan een erkenning voorschriften of een bepaalde termijn verbinden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11a
  - number: 11a.4
    text: 'Onze Minister kan een erkenning intrekken:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11a
  - number: 11a.4.a
    text: op verzoek van het erkende exameninstituut;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11a
  - number: 11a.4.b
    text: |-
      indien de gegevens en bescheiden die zijn verstrekt ter verkrijging van de erkenning, na de erkenning zodanig
      onjuist of onvolledig blijken dat de erkenning zou zijn geweigerd, dan wel niet zonder daaraan voorschriften te
      verbinden zou zijn verleend, indien bij de behandeling van de aanvraag de juiste gegevens volledig bekend waren
      geweest;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11a
  - number: 11a.4.c
    text: |-
      indien het exameninstituut niet langer voldoet aan [artikel 11b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11b
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 11a.4.d
    text: |-
      indien het exameninstituut [artikel 11d][ref1] of de aan de erkenning verbonden voorschriften niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11d
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11d
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 11a.5
    text: |-
      Na intrekking van een erkenning draagt het exameninstituut de administratie inzake certificaten en diploma’s over
      aan Onze Minister. De vorige volzin is van overeenkomstige toepassing, indien de aan de erkenning verbonden termijn
      eindigt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11a
  - number: 11b.1
    text: |-
      Een erkend exameninstituut neemt ten aanzien van de wijze van examinering de maatregelen die redelijkerwijs nodig
      zijn om te bevorderen dat examens op een correcte en eerlijke wijze worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11b
  - number: 11b.2
    text: |-
      Een erkend exameninstituut beschikt over en handelt in overeenstemming met een examenreglement waarin ten minste de
      volgende onderwerpen adequaat zijn geregeld:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11b
  - number: 11b.2.a
    text: de wijze van aanmelding van kandidaten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11b
  - number: 11b.2.b
    text: het aantal malen per jaar dat gelegenheid wordt gegeven tot het afleggen van de afzonderlijke examens;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11b
  - number: 11b.2.c
    text: de wijze van kennisgeving van plaats, datum en tijdstip van aanvang der examens;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11b
  - number: 11b.2.d
    text: de vaststelling van de identiteit van de kandidaten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11b
  - number: 11b.2.e
    text: de duur en wijze van examineren;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11b
  - number: 11b.2.f
    text: de maatregelen indien onregelmatigheden worden geconstateerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11b
  - number: 11b.2.g
    text: |-
      de termijn waarbinnen de examenuitslagen worden bekendgemaakt, alsmede de termijn waarbinnen de certificaten en
      diploma’s worden uitgereikt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11b
  - number: 11b.2.h
    text: de interne klachtenprocedure.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11b
  - number: 11b.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot examenreglementen als bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11b
  - number: 11c.1
    text: |-
      Een kandidaat die met goed gevolg het examen voor een module als bedoeld in [artikel 9, eerste lid][ref1], heeft
      afgelegd, ontvangt ten bewijze daarvan een certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel9
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11c.2
    text: |-
      Een kandidaat die alle voor een diploma benodigde certificaten heeft behaald, ontvangt ten bewijze daarvan een
      diploma.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11c
  - number: 11c.3
    text: |-
      Een kandidaat die met goed gevolg het examen, bedoeld in [artikel 11, eerste of vierde lid][ref1], heeft afgelegd,
      ontvangt ten bewijze daarvan een certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11ca.1
    text: |-
      Het certificaat wordt afgegeven vanwege Onze Minister en uitgereikt of toegezonden door het exameninstituut dat het
      examen, bedoeld in [artikel 11c, eerste lid][ref1], heeft afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11ca
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11c
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 11ca.2
    text: |-
      Het diploma wordt afgegeven vanwege Onze Minister en uitgereikt of toegezonden door het exameninstituut dat het
      laatste examen heeft afgenomen dat benodigd is voor het behalen van het diploma.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11ca
  - number: 11ca.3
    text: |-
      Duplicaten van certificaten en diploma’s worden uitsluitend door Onze Minister verstrekt. Verstrekking geschiedt
      tegen betaling van de kostprijs.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11ca
  - number: 11ca.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de afgifte van certificaten en
      diploma’s of de verstrekking van duplicaten daarvan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11ca
  - number: 11d.1
    text: |-
      Een erkend exameninstituut verstrekt desgevraagd aan Onze Minister alle voor de uitoefening van diens taak
      benodigde inlichtingen. Onze Minister kan inzage vorderen van alle zakelijke gegevens en bescheiden, indien dat
      voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11d
  - number: 11d.2
    text: Een erkend exameninstituut stemt in met een door Onze Minister aangewezen controle.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11d
  - number: 11e.1
    text: |-
      Er is een centrale examenbank ten behoeve van de examinering van de examens van de modules, bedoeld in
      [artikel 9, eerste lid][ref1], en de examens, bedoeld in [artikel 11, eerste en vierde lid][ref2]. De centrale
      examenbank wordt beheerd door Onze minster.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel11
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11e.2
    text: |-
      Een exameninstituut maakt ten behoeve van de examens van de modules, bedoeld in [artikel 9, eerste lid][ref1], en
      de examens, bedoeld in [artikel 11, eerste en vierde lid][ref2], uitsluitend gebruik van de centrale examenbank.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel11
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11e.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inrichting en beheer van de
      centrale examenbank.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11e
  - number: 11f.1
    text: |-
      Het informatiesysteem inzake beroepskwalificaties, bedoeld in [artikel 4:9a, eerste lid, van de wet][ref1] bevat
      persoonsgegevens van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 11f.1.a
    text: |-
      kandidaten die beschikken over een diploma als bedoeld in [artikel 6, eerste lid, onderdeel b, onder 1°][ref1], of
      een erkenning als bedoeld in artikel 6, eerste lid, onderdeel b, onder 2°;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11f.1.b
    text: |-
      kandidaten die deelnemen aan een examen als bedoeld in [artikel 9, tweede lid][ref1], of
      [11, eerste of vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel11
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11f.2
    text: |-
      Ten aanzien van de in het eerste lid, onderdelen a en b, bedoelde personen worden, naast het in
      [artikel 4:9a, derde lid, van de wet][ref1], genoemde burgerservicenummer, of bij het ontbreken daarvan aan de
      kandidaat toegekend nummer, de volgende gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 11f.2.a
    text: geslachtsnaam, voornamen en voorletters;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
  - number: 11f.2.b
    text: geboortedatum;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
  - number: 11f.2.c
    text: geboorteplaats;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
  - number: 11f.2.d
    text: geslacht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
  - number: 11f.2.e
    text: de afgelegde examens;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
  - number: 11f.2.f
    text: de resultaten van afgelegde examens;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
  - number: 11f.2.g
    text: |-
      de datum waarop betrokkene een diploma als bedoeld in [artikel 6, eerste lid, onderdeel b, onder 1°][ref1], heeft
      behaald;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11f.2.h
    text: |-
      de datum waarop betrokkene een erkenning van beroepskwalificaties als bedoeld in
      [artikel 6, eerste lid, onderdeel b, onder 2°][ref1], verkrijgt;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11f.2.i
    text: |-
      de datum waarop een examen is afgelegd als bedoeld in [artikel 9, tweede lid][ref1], of
      [11, eerste of vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel11
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11f.2.j
    text: |-
      de datum van de laatste dag van de periode, bedoeld in [artikel 11, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11f.2.k
    text: de naam van het exameninstituut, waar het examen is afgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11f
  - number: 11g.1
    text: |-
      Een erkend exameninstituut verstrekt aan de beheerder van het informatiesysteem inzake beroepskwalificaties uit
      eigen beweging of op verzoek alle gegevens als bedoeld in [artikel 11f, tweede lid][ref1], die noodzakelijk zijn
      voor het bijhouden dan wel schonen van de gegevens in het informatiesysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11f
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11g
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11f
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 11g.2
    text: |-
      Persoonsgegevens die zijn opgenomen in het informatiesysteem inzake beroepskwalificaties worden slechts ter
      beschikking gesteld aan erkende exameninstituten en aan Onze Minister. De gegevens worden niet gebruikt voor een
      ander doel dan de uitvoering van de krachtens [artikel 4:9, vierde en vijfde lid][ref1], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11g
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 11h.1
    text: |-
      De in het informatiesysteem opgenomen gegevens, bedoeld in [artikel 11f][ref1], worden verwijderd:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11f
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11h
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11f
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 11h.1.a
    text: na verloop van tien jaren, of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11h
  - number: 11h.1.b
    text: indien de betrokken persoon is overleden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11h
  - number: 11h.2
    text: |-
      De termijn, genoemd in het eerste lid, onderdeel a, vangt aan op de dag waarop de laatste mutatie van de in
      [artikel 11f, tweede lid][ref1], genoemde gegevens in het informatiesysteem heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11f
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11h
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11f
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 11i.1
    text: |-
      Met betrekking tot het informatiesysteem inzake beroepskwalificaties is Onze Minister de
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11i
  - number: 11i.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de tijdelijke gegevensverwerking in de centrale examenbank ten
      behoeve van het afnemen van examens.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11i
  - number: 11j
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inrichting en beheer van het
      informatiesysteem inzake beroepskwalificaties.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11j
  - number: 11k.1
    text: |-
      Onze Minister brengt de kosten die verband houden met de uitvoering van de krachtens
      [artikel 4:9, vierde lid, van de wet][ref1], gestelde regels in rekening bij exameninstituten als bedoeld in
      artikel 4:9, vierde lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 11k.2
    text: 'De kosten, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11k
  - number: 11k.2.a
    text: kosten die verband houden met de ontwikkeling en het beheer van de centrale examenbank;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11k
  - number: 11k.2.b
    text: kosten die verband houden met de ontwikkeling en het beheer van de examenvragen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11k
  - number: 11k.2.c
    text: |-
      kosten die verband houden met de ontwikkeling en het beheer van het informatiesysteem, bedoeld in
      [artikel 4:9a, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 11k.2.d
    text: |-
      kosten die verband houden met de ontwikkeling en het beheer van de eindtermen en toetstermen, bedoeld in
      [artikel 9, vijfde lid][ref1], en [artikel 11, vijfde en zesde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel11
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11k.2.e
    text: kosten die verband houden met de controle op een ordelijk verloop van de afname van examens;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11k
  - number: 11k.2.f
    text: kosten die verband houden met het faciliteren van inzage in gemaakte examens;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11k
  - number: 11k.2.g
    text: kosten die verband houden met de behandeling van klachten die betrekking hebben op de inhoud van de examens.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11k
  - number: 11k.3
    text: |-
      Bij ministeriële regeling wordt het tarief vastgesteld dat per examen in rekening wordt gebracht in verband
      met de in het eerste lid bedoelde kosten. Voorts kunnen bij ministeriële regeling nadere regels worden gesteld
      met betrekking tot de wijze waarop de in het eerste lid genoemde kosten in rekening worden gebracht of worden
      verrekend.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11k
  - number: 11k.4
    text: |-
      De aanvrager van een erkenning als bedoeld in [artikel 11a, eerste lid][ref1], is voor het in behandeling nemen van
      een aanvraag voor de erkenning van het exameninstituut of voor de aanmelding van een additionele examenlocatie een
      bij ministeriële regeling vastgesteld tarief verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel11a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 11a
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '12.1'
    text: |-
      De Autoriteit Financiële Markten stelt vast of de betrouwbaarheid van een persoon als bedoeld in
      [artikel 4:10, eerste lid, van de wet][ref1] buiten twijfel staat op basis van diens voornemens, handelingen en
      antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '12.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de beoordeling van de betrouwbaarheid van
      een persoon door de Autoriteit Financiële Markten op grond van een verordening als bedoeld in
      [artikel 1:25, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '13'
    text: |-
      De Autoriteit Financiële Markten neemt bij de vaststelling, bedoeld in [artikel 12][ref1], in ieder geval de
      volgende antecedenten in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
  - number: 13.a
    text: |-
      de in de [onderdelen 1 en 2 van bijlage C][ref1] genoemde strafrechtelijke antecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 13.b
    text: |-
      de in [onderdeel 3 van bijlage C][ref1] genoemde financiële antecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 13.c
    text: |-
      de in [onderdeel 4 van bijlage C][ref1] genoemde toezichtantecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 13.d
    text: |-
      de in [onderdeel 5 van bijlage C][ref1] genoemde fiscaal bestuursrechtelijke antecedenten; en


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 13.e
    text: |-
      de in [onderdeel 6 van bijlage C][ref1] genoemde overige antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '14.1'
    text: |-
      De Autoriteit Financiële Markten verkrijgt inzicht in de in [artikel 12][ref1] bedoelde voornemens, handelingen en
      antecedenten op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
  - number: 14.1.a
    text: door betrokkene verstrekte gegevens en inlichtingen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: 14.1.b
    text: door de Landelijke Officier van Justitie verstrekte politiegegevens;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: 14.1.c
    text: |-
      gegevens uit de registratie, bedoeld in [artikel 1, onderdeel b, van de Wet controle op rechtspersonen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015049
        artikel: '1'
  - number: 14.1.d
    text: gegevens en inlichtingen, verkregen van de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: 14.1.e
    text: |-
      gegevens en inlichtingen, verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van Nederlandse of
      buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of op
      personen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: 14.1.f
    text: ambtsberichten van het Openbaar Ministerie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: 14.1.g
    text: inlichtingen, verkregen van door betrokkenen opgegeven referenties;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: 14.1.h
    text: gegevens uit openbare bronnen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: 14.1.i
    text: |-
      inlichtingen, verkregen van curatoren of bewindvoerders met betrekking tot faillissementen, surseances,
      schuldsaneringen, bewindvoeringen of noodregelingen waarbij de in [artikel 12][ref1] bedoelde persoon betrokken
      is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
  - number: 14.1.j
    text: inlichtingen, verkregen van organisaties van huidige of voormalige beroepsgenoten van betrokkene; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: 14.1.k
    text: gegevens en inlichtingen, verkregen uit andere bij ministeriële regeling aan te wijzen bronnen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: '14.2'
    text: |-
      Indien de gegevens en inlichtingen, verkregen overeenkomstig het eerste lid, de Autoriteit Financiële Markten
      aanleiding geven tot nader onderzoek, kan de Autoriteit Financiële Markten ook inlichtingen inwinnen en gegevens
      opvragen bij andere personen of instanties dan genoemd in dat lid. De Autoriteit Financiële Markten stelt de
      betrokkene in dat geval schriftelijk vooraf in kennis van:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: 14.2.a
    text: de reden van het nadere onderzoek;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: 14.2.b
    text: de personen of instanties bij wie nadere gegevens of inlichtingen zullen worden ingewonnen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: 14.2.c
    text: de aard van de nadere gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel14
  - number: '15.1'
    text: |-
      De betrouwbaarheid van een persoon als bedoeld in [artikel 12][ref1] staat niet buiten twijfel indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
  - number: 15.1.a
    text: |-
      deze onherroepelijk veroordeeld is terzake van een misdrijf, genoemd in onderdeel 1 van [bijlage C][ref1], waarbij
      sinds het onherroepelijk worden van de uitspraak minder dan acht jaren zijn verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 15.1.b
    text: |-
      deze veroordeeld is terzake van een misdrijf, genoemd in onderdeel 1 van [bijlage C][ref1], waarbij de uitspraak
      nog niet onherroepelijk is of waarbij sinds het onherroepelijk worden van de uitspraak acht of meer jaren zijn
      verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 15.1.c
    text: |-
      deze veroordeeld is terzake van een overtreding van [artikel 69 van de Algemene wet inzake de rijksbelastingen][ref1]
      of [artikel 65 van de Invorderingswet 1990][ref2], waarbij betrokkene veroordeeld is tot een gevangenisstraf of
      boete; of


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel65
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '65'
  - number: 15.1.d
    text: |-
      deze een vergrijpboete van meer dan € 62.500 opgelegd heeft gekregen terzake van een feit, genoemd in onderdeel 5
      van [bijlage C][ref1], en het besluit waarbij de vergrijpboete is opgelegd onherroepelijk is geworden of waarbij
      ten minste de rechter in eerste aanleg uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: '15.2'
    text: |-
      De Autoriteit Financiële Markten kan op grond van de omstandigheden of belangen, genoemd in [artikel 16][ref1],
      afwijken van het eerste lid, ten aanzien van de onderdelen b, c en d.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel16
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '16'
        hoofdstuk: '3'
  - number: '16'
    text: |-
      De Autoriteit Financiële Markten neemt bij de vaststelling, bedoeld in [artikel 12][ref1], in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel12
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '12'
        hoofdstuk: '3'
  - number: 16.a
    text: |-
      het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de overige
      omstandigheden van het geval;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel16
  - number: 16.b
    text: de belangen die de wet beoogt te beschermen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel16
  - number: 16.c
    text: |-
      de overige belangen van de beheerder, beleggingsmaatschappij, beleggingsonderneming, bewaarder of
      financiëledienstverlener en de betrokkene.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel16
  - number: '17.1'
    text: |-
      Een beheerder van een icbe, bewaarder van een icbe, icbe of pensioenbewaarder als bedoeld in
      [artikel 4:11, eerste lid, van de wet][ref1] draagt zorg voor een systematische analyse van integriteitrisico´s.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '17.2'
    text: |-
      De beheerder van een icbe, bewaarder van een icbe, icbe of pensioenbewaarder draagt er zorg voor dat het beleid,
      bedoeld in [artikel 4:11, eerste lid, van de wet][ref1], zijn neerslag vindt in procedures en maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '17.3'
    text: |-
      De beheerder van een icbe, bewaarder van een icbe, icbe of pensioenbewaarder stelt alle relevante
      bedrijfsonderdelen in kennis van het beleid en de procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel17
  - number: '17.4'
    text: |-
      De beheerder van een icbe, bewaarder van een icbe, icbe of pensioenbewaarder draagt zorg voor de uitvoering en de
      systematische toetsing van het beleid en de procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel17
  - number: '17.5'
    text: |-
      De beheerder van een icbe, bewaarder van een icbe, icbe of pensioenbewaarder draagt zorg voor onafhankelijk
      toezicht op de uitvoering van het beleid en de procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel17
  - number: '17.6'
    text: |-
      De beheerder van een icbe, bewaarder van een icbe, icbe of pensioenbewaarder beschikt over procedures die erin
      voorzien dat gesignaleerde tekortkomingen of gebreken met betrekking tot de integere uitoefening van het bedrijf
      tot een gepaste bijstelling leiden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel17
  - number: '18'
    text: |-
      Een beheerder van een icbe, bewaarder van een icbe, icbe of pensioenbewaarder als bedoeld in
      [artikel 4:14, eerste lid, van de wet][ref1] beschikt over procedures en maatregelen met betrekking tot het
      tegengaan van verstrengeling van de privé-belangen van personen die het beleid van de financiële onderneming
      bepalen, personen die onderdeel zijn van een orgaan dat is belast met toezicht op het beleid en de algemene gang
      van zaken van de financiële onderneming, andere werknemers, of andere personen die in opdracht van de betrokken
      onderneming op structurele basis werkzaamheden voor haar verrichten met haar belangen of die van haar deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '19.1'
    text: |-
      Een beheerder van een icbe, bewaarder van een icbe, icbe of pensioenbewaarder als bedoeld in
      [artikel 4:14, eerste lid, van de wet][ref1] beschikt over procedures en maatregelen met betrekking tot de omgang
      met en vastlegging van incidenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '19.2'
    text: |-
      De beheerder van een icbe, bewaarder van een icbe, icbe of pensioenbewaarder neemt naar aanleiding van een incident
      maatregelen die zijn gericht op het beheersen van de opgetreden risico’s en het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel19
  - number: '19.3'
    text: |-
      De beheerder van een icbe, bewaarder van een icbe, icbe of pensioenbewaarder informeert de Autoriteit Financiële
      Markten onverwijld omtrent incidenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel19
  - number: '20.1'
    text: |-
      Een beheerder van een icbe, bewaarder van een icbe, maatschappij voor collectieve belegging in effecten of
      pensioenbewaarder als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] maakt een onderbouwde beoordeling van
      de betrouwbaarheid van personen die hij onderscheidenlijk zij wil benoemen in een integriteitgevoelige functie.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '20.2'
    text: |-
      De beheerder van een icbe, bewaarder van een icbe, maatschappij voor collectieve belegging in effecten of
      pensioenbewaarder draagt zorg voor de beoordeling van de betrouwbaarheid van degenen die, anders dan op grond van
      een arbeidsovereenkomst, werkzaamheden in een integriteitgevoelige functie verrichten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel20
  - number: '21.1'
    text: |-
      Een beleggingsinstelling of icbe als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] beschikt ter
      bescherming van de integriteit van het bedrijf over procedures en maatregelen met betrekking tot de acceptatie
      van deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '21.2'
    text: |-
      Onverminderd het bepaalde ingevolge de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1]
      beschikt de beleggingsinstelling of icbe over procedures en maatregelen met betrekking tot de identificatie van
      deelnemers en de verificatie daarvan. De beleggingsinstelling of icbe accepteert een deelnemer niet indien zij de
      identiteit niet heeft vastgesteld overeenkomstig het daarvoor opgestelde beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: '21.3'
    text: |-
      De beleggingsinstelling of icbe beschikt ter bescherming van de integriteit van het bedrijf over organisatorische
      en administratieve procedures en maatregelen die betrekking hebben op risicoclassificaties ten aanzien van
      cliënten, producten of diensten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel21
  - number: '21.4'
    text: |-
      De beleggingsinstelling of icbe beschikt over procedures en maatregelen met betrekking tot de analyse van gegevens
      van deelnemers, mede in relatie tot de door de deelnemer afgenomen producten, en de detectie van afwijkende
      transactiepatronen. Aan de hand van deze procedures en maatregelen bepaalt de beleggingsinstelling of icbe tevens
      de risico’s van bepaalde cliënten, producten of diensten voor de integere uitoefening van haar bedrijf.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel21
  - number: '21.5'
    text: |-
      De beleggingsinstelling of icbe draagt zorg voor de documentatie en vastlegging met betrekking tot de acceptatie en
      indeling naar risico van cliënten, de identificatie en verificatie van de gegevens van cliënten en de bewaking van
      transacties van cliënten. Dergelijke gegevens worden tot vijf jaar na de dienstverlening of het beëindigen van de
      relatie bewaard.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel21
  - number: '21.6'
    text: |-
      Het eerste tot en met vijfde lid zijn niet van toepassing voorzover de beleggingsinstelling of icbe niet
      voorafgaand aan het intreden of uittreden van deelnemers in de beleggingsinstelling of icbe beslist omtrent
      acceptatie van deelnemers.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel21
  - number: '22.1'
    text: |-
      Een beleggingsinstelling of icbe als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] onderzoekt, op verzoek
      van de Autoriteit Financiële Markten, of in haar administratie bepaalde personen of instellingen voorkomen die
      naar het oordeel van Onze Minister, in verband met vermoede terroristische activiteiten of daarmee verband houdende
      activiteiten, de integriteit van de financiële sector kunnen schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '22.2'
    text: |-
      De beleggingsinstelling of icbe verstrekt de uitkomst van het in het eerste lid bedoelde onderzoek, binnen een door
      de Autoriteit Financiële Markten vast te stellen termijn, aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel22
  - number: '23.1'
    text: |-
      Een beleggingsonderneming draagt er, met het oog op de integere uitoefening van haar bedrijf, zorg voor dat het
      beleid, bedoeld in [artikel 4:11, eerste lid, van de wet][ref1], zijn neerslag vindt in procedures en maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '23.2'
    text: |-
      De beleggingsonderneming draagt zorg voor onafhankelijk toezicht op de uitvoering van het beleid en de procedures
      en maatregelen, bedoeld in het eerste lid, en beschikt over procedures die erin voorzien dat gesignaleerde
      tekortkomingen of gebreken worden gerapporteerd aan de personen die belast zijn met de taak, bedoeld in
      [artikel 31c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel31c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 31c
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '23.3'
    text: |-
      De beleggingsonderneming beschikt over procedures die erin voorzien dat gesignaleerde tekortkomingen of gebreken
      met betrekking tot de integere uitoefening van het bedrijf onder toezicht van de personen die zijn belast met de
      taak, bedoeld in [artikel 31c][ref1], tot een gepaste bijstelling leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel31c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 31c
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '24.1'
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] beschikt over procedures en
      maatregelen met betrekking tot de behandeling en administratieve vastlegging van incidenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '24.2'
    text: |-
      De beleggingsonderneming neemt naar aanleiding van een incident maatregelen die zijn gericht op het beheersen van
      de opgetreden risico’s en het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel24
  - number: '24.3'
    text: De beleggingsonderneming informeert de Autoriteit Financiële Markten onverwijld omtrent incidenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel24
  - number: '25.1'
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] maakt een onderbouwde
      beoordeling van de betrouwbaarheid van een personeelslid dat zij wil benoemen in een integriteitgevoelige functie.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '25.2'
    text: |-
      De beleggingsonderneming draagt zorg voor de beoordeling van de betrouwbaarheid van degenen die, anders dan op
      grond van een arbeidsovereenkomst, werkzaamheden in een integriteitgevoelige functie verrichten
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel25
  - number: '26.1'
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] beschikt over procedures
      en maatregelen met betrekking tot de acceptatie van cliënten. Deze procedures en maatregelen hebben betrekking op
      risicoclassificaties ten aanzien van cliënten, producten of diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '26.2'
    text: |-
      Onverminderd het bepaalde ingevolge de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1]
      beschikt de beleggingsonderneming over procedures en maatregelen met betrekking tot de identificatie van cliënten
      en de verificatie daarvan. De beleggingsonderneming accepteert een cliënt niet indien zij de identiteit niet heeft
      vastgesteld overeenkomstig het daarvoor opgestelde beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: '26.3'
    text: |-
      De beleggingsonderneming beschikt over procedures met betrekking tot de analyse van gegevens van cliënten, mede in
      relatie tot de door de cliënt afgenomen producten en diensten, en de detectie van afwijkende transactiepatronen.
      Aan de hand van deze procedures en maatregelen worden tevens de risico’s ten aanzien van bepaalde cliënten of
      producten bepaald.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel26
  - number: '26.4'
    text: |-
      De beleggingsonderneming draagt zorg voor de documentatie en vastlegging met betrekking tot de acceptatie en
      indeling van cliënten naar risico en de bewaking van het handelen van cliënten. Dergelijke gegevens worden tot vijf
      jaar na de dienstverlening of het beëindigen van de relatie bewaard.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel26
  - number: '27.1'
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] onderzoekt, op verzoek van
      de Autoriteit Financiële Markten, of in haar administratie bepaalde personen of instellingen voorkomen die naar
      het oordeel van Onze Minister, in verband met vermoede terroristische activiteiten of daarmee verband houdende
      activiteiten, de integriteit van de financiële sector kunnen schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '27.2'
    text: |-
      De beleggingsonderneming verstrekt de uitkomst van het in het eerste lid bedoelde onderzoek aan de Autoriteit
      Financiële Markten, binnen een door deze vast te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel27
  - number: '28.1'
    text: |-
      Een financiëledienstverlener als bedoeld in [artikel 4:11, tweede lid, van de wet][ref1] draagt er zorg voor
      dat de betrouwbaarheid van de werknemers en andere natuurlijke personen die zich onder zijn verantwoordelijkheid
      rechtstreeks bezighouden met het verlenen van financiële diensten en van de feitelijk leidinggevenden die voor deze
      personen verantwoordelijk zijn, buiten twijfel staat.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '28.2'
    text: |-
      Een persoon als bedoeld in het eerste lid is betrouwbaar, indien hij een verklaring omtrent het gedrag als bedoeld
      in de [Wet justitiële en strafvorderlijke gegevens][ref1] over kan leggen, en hij niet failliet is verklaard,
      tenzij rehabilitatie als bedoeld in [artikel 212 van de Faillissementswet][ref2] heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel212
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '212'
  - number: '29.1'
    text: |-
      Een financiëledienstverlener als bedoeld in [artikel 4:15, eerste lid, van de wet][ref1] stelt procedures en
      maatregelen vast met betrekking tot de omgang met en vastlegging van incidenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '29.2'
    text: |-
      De financiëledienstverlener neemt naar aanleiding van een incident passende maatregelen. Deze maatregelen zijn
      gericht op het beheersen van de opgetreden risico’s en het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel29
  - number: '29.3'
    text: De financiëledienstverlener informeert de Autoriteit Financiële Markten onverwijld omtrent incidenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel29
  - number: 29.0a
    text: |-
      [Artikel 31e][ref1] is niet van toepassing op beheerders van een beleggingsinstelling voor zover zij een
      activiteit verrichten of een dienst verlenen als bedoeld in [artikel 2:67a, tweede lid, van de wet][ref2]
      en op beheerders van een icbe die een activiteit verrichten of een dienst verlenen als bedoeld in
      [artikel 2:69c, tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel29.0a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '31'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 29a.1
    text: |-
      De bedrijfsvoering van een Nederlandse beheerder van een beleggingsinstelling voldoet aan de ingevolge artikel 18
      van de richtlijn beheerders van alternatieve beleggingsinstellingen gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel29a
  - number: 29a.2
    text: |-
      De bedrijfsvoering van een beleggingsonderneming voldoet aan artikel 16, tweede en vijfde lid, tweede alinea, van
      de richtlijn markten voor financiële instrumenten 2014 en de artikelen 21 en 24 van de gedelegeerde verordening
      markten voor financiële instrumenten 2014 inzake organisatorische eisen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel29a
  - number: 29a.3
    text: |-
      De bedrijfsvoering van een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht
      beleggingsondernemingen, niet zijnde een kleine en niet-verweven beleggingsonderneming als bedoeld in artikel 12,
      eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen, voldoet aan de ingevolge artikel
      26, eerste lid, van de richtlijn prudentieel toezicht beleggingsondernemingen gestelde eisen, met inachtneming
      van het bepaalde in het tweede en derde lid van dit artikel uit de richtlijn, alsmede aan de ingevolge artikel
      28 van die richtlijn gestelde eisen, voor zover het bedrijfsrisico’s betreft, niet zijnde de risico’s, bedoeld in
      [artikel 3:17, tweede lid, aanhef en onderdeel c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29b.1
    text: |-
      De bedrijfsvoering van een beleggingsonderneming voorziet in een duidelijke en adequate verdeling van taken,
      bevoegdheden en verantwoordelijkheden en maakt daarbij, indien van toepassing, een onderscheid tussen werknemers en
      andere natuurlijke personen die onder zijn verantwoordelijkheid cliënten informeren over financiële instrumenten,
      beleggingsdiensten of nevendiensten en werknemers en andere natuurlijke personen die zich rechtstreeks bezighouden
      met het adviseren van cliënten over financiële instrumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel29b
  - number: 29b.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de bedrijfsvoering van een
      beleggingsonderneming ten aanzien van het beoordelen, onderhouden en bijhouden van de vakbekwaamheid van
      werknemers.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel29b
  - number: '30.1'
    text: |-
      De bedrijfsvoering van een beheerder van een icbe, icbe, bewaarder of pensioenbewaarder, bedoeld in
      [artikel 4:14, eerste lid, van de wet][ref1] voorziet in:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 30.1.a
    text: duidelijke besluitvormingsprocedures en een duidelijke, evenwichtige en adequate organisatiestructuur;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
  - number: 30.1.b
    text: een duidelijke, evenwichtige en adequate verdeling van taken, bevoegdheden en verantwoordelijkheden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
  - number: 30.1.c
    text: eenduidige rapportagelijnen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
  - number: 30.1.d
    text: een adequaat systeem van informatievoorziening en communicatie; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
  - number: 30.1.e
    text: |-
      adequate interne controleprocedures om te waarborgen dat beslissingen en procedures op alle niveaus in acht worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
  - number: '30.2'
    text: |-
      De bedrijfsvoering is afgestemd op de aard, omvang, risico’s en complexiteit van de financiële onderneming en de
      werkzaamheden van de financiële onderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
  - number: '30.3'
    text: De bedrijfsvoering wordt op een inzichtelijke wijze vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
  - number: '30.4'
    text: |-
      De financiële onderneming beschikt over procedures en maatregelen om de vertrouwelijkheid en integriteit van
      informatie en de voortdurende beschikbaarheid en beveiliging van geautomatiseerde gegevensverwerking te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
  - number: '30.5'
    text: |-
      De effectiviteit van de organisatie-inrichting en van de procedures en maatregelen, bedoeld in het eerste lid,
      wordt door de financiële onderneming ten minste jaarlijks getoetst. De financiële onderneming voorziet erin dat
      gesignaleerde tekortkomingen worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
  - number: '30.6'
    text: |-
      De effectiviteit van de organisatie-inrichting en van de procedures en maatregelen wordt bij een beheerder van een
      instelling voor collectieve belegging in effecten onafhankelijk getoetst. Daartoe beschikt de beheerder over een
      organisatieonderdeel dat een interne controlefunctie uitoefent.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
  - number: '30.7'
    text: |-
      Een beheerder van een icbe neemt duurzaamheidsrisico’s in aanmerking bij het voldoen aan het in het eerste lid
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30
  - number: 30a
    text: |-
      Een beheerder van een icbe integreert duurzaamheidsrisico’s in het beheer van elke door hem beheerde icbe en houdt
      daarbij rekening met de aard, schaal en complexiteit van zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel30a
  - number: '31.1'
    text: |-
      Werknemers van een beheerder van een icbe en andere personen die door de desbetreffende financiële onderneming zijn
      belast met het beheren van icbe’s beschikken over de nodige vakbekwaamheid en deskundigheid om de hun toevertrouwde
      verantwoordelijkheid uit te oefenen en te zorgen voor een doeltreffende integratie van duurzaamheidsrisico’s.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31
  - number: '31.2'
    text: |-
      Een beheerder van een icbe zorgt ervoor dat werknemers die verscheidene functies uitoefenen, daardoor niet worden
      of kunnen worden belet een van deze functies op degelijke, eerlijke en professionele wijze uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31
  - number: '31.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt rekening gehouden met de aard, omvang en risico’s en de
      werkzaamheden van de beheerder.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31
  - number: 31a
    text: |-
      Het organisatieonderdeel, bedoeld in [artikel 30, zesde lid][ref1], heeft als taak:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel30
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 31a.a
    text: |-
      het vaststellen en uitvoeren van een controleplan om de deugdelijkheid en effectiviteit van de systemen, interne
      controleprocedures en regels van de financiële onderneming te onderzoeken en te beoordelen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31a
  - number: 31a.b
    text: het doen van aanbevelingen op basis van de resultaten van de werkzaamheden, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31a
  - number: 31a.c
    text: het controleren of aan deze aanbevelingen gevolg wordt gegeven; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31a
  - number: 31a.d
    text: |-
      het ten minste jaarlijks rapporteren aan de personen die het dagelijks beleid van de financiële onderneming bepalen
      en aan het orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de algemene gang van zaken van de
      financiële onderneming inzake aangelegenheden met betrekking tot de interne controle en de genomen maatregelen in
      geval van gesignaleerde tekortkomingen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31a
  - number: 31b.1
    text: |-
      Een beleggingsonderneming beschikt over een organisatieonderdeel dat op onafhankelijke en effectieve wijze een
      compliancefunctie uitoefent.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31b
  - number: 31b.2
    text: |-
      Het organisatieonderdeel, bedoeld in het eerste lid, voldoet aan artikel 22 van de gedelegeerde verordening markten
      voor financiële instrumenten 2014 inzake organisatorische eisen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31b
  - number: 31c.1
    text: |-
      Een beheerder van een icbe beschikt over een organisatieonderdeel dat op onafhankelijke en effectieve wijze een
      compliancefunctie uitoefent.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31c
  - number: 31c.2
    text: 'Het organisatieonderdeel, bedoeld in het eerste lid, heeft als taak:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31c
  - number: 31c.2.a
    text: het controleren van de naleving van wettelijke regels en van interne regels die de beheerder heeft opgesteld;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31c
  - number: 31c.2.b
    text: |-
      het adviseren van de personen die verantwoordelijk zijn voor het beheren van icbe’s bij de naleving van wettelijke
      regels en interne regels;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31c
  - number: 31c.2.c
    text: het toezien op de deugdelijkheid en effectiviteit van de interne regels en procedures;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31c
  - number: 31c.2.d
    text: |-
      het beoordelen van de effectiviteit van de procedures die zijn opgesteld en maatregelen die zijn genomen om
      gesignaleerde onvolkomenheden bij de naleving van wettelijke regels en interne regels op te heffen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31c
  - number: 31c.2.e
    text: |-
      het ten minste jaarlijks rapporteren aan de personen die het dagelijks beleid van de beheerder bepalen en aan het
      orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de algemene gang van zaken van de beheerder
      inzake aangelegenheden met betrekking tot de naleving van wettelijke regels en interne regels. In de jaarlijkse
      rapportage wordt met name vermeld of maatregelen zijn genomen in het geval van gesignaleerde tekortkomingen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31c
  - number: 31c.3
    text: |-
      Het organisatieonderdeel dat de compliancefunctie uitoefent beschikt over de nodige autoriteit, middelen,
      deskundigheid en toegang tot alle noodzakelijke informatie om haar taken onafhankelijk en effectief te kunnen
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31c
  - number: 31d.1
    text: 'Een beheerder van een icbe zorgt ervoor dat de personen die het dagelijks beleid bepalen van de beheerder:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31d
  - number: 31d.1.a
    text: |-
      verantwoordelijk zijn voor de uitvoering van het algemene beleggingsbeleid voor elke door de beheerder beheerde
      icbe als omschreven in het prospectus, het fondsreglement of de statuten van de beheerder;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31d
  - number: 31d.1.b
    text: toezicht houden op de goedkeuring van beleggingsstrategieën voor elke door de beheerder beheerde icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31d
  - number: 31d.1.c
    text: |-
      erop toezien dat de beheerder over een effectieve compliancefunctie beschikt als bedoeld in
      [artikel 31c, eerste lid][ref1], heeft, ook al wordt deze functie door een derde uitgeoefend;


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel31c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 31c
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 31d.1.d
    text: |-
      ervoor zorgen en zich periodiek van vergewissen dat het algemene beleggingsbeleid, de beleggingsstrategieën en de
      risicolimieten voor elke door de beheerder beheerde icbe op behoorlijke en doeltreffende wijze worden uitgevoerd en
      in acht genomen, ook al wordt de risicobeheerfunctie door een derde uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31d
  - number: 31d.1.e
    text: |-
      periodiek de deugdelijkheid van de interne procedures voor het nemen van beleggingsbeslissingen voor elke door
      de beheerder beheerde icbe goedkeuren en evalueren, om te zorgen dat deze beslissingen met de goedgekeurde
      beleggingsstrategieën verenigbaar zijn;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31d
  - number: 31d.1.f
    text: |-
      periodiek het risicobeheerbeleid en de procedures en maatregelen voor de uitvoering van het risicobeheerbeleid
      goedkeuren en evalueren, met inbegrip van het risicolimietensysteem voor elke door de beheerder beheerde icbe; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31d
  - number: 31d.1.g
    text: |-
      verantwoordelijk zijn voor de integratie van duurzaamheidsrisico’s in het algemene beleggingsbeleid,
      beleggingsstrategieën, interne procedures voor het nemen van beleggingsbeslissingen en het risicobeheerbeleid van
      elke door de beheerder beheerde icbe als bedoeld in de onderdelen a tot en met f.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31d
  - number: 31d.2
    text: |-
      De beheerder zorgt ervoor dat ten minste jaarlijks wordt gerapporteerd aan de personen die het dagelijks beleid
      bepalen van de beheerder over de uitvoering van de beleggingsstrategieën en interne procedures voor het nemen van
      de beleggingsbeslissingen, bedoeld in het eerste lid, onderdelen b tot en met e.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31d
  - number: 31e.1
    text: |-
      Een beleggingsonderneming beschikt over interne regelingen en procedures die zijn gericht op een doeltreffend
      en prudent bestuur van de onderneming die voldoen aan de vereisten in artikel 88, eerste lid, van de richtlijn
      kapitaalvereisten en artikel 9, derde lid, tweede alinea, van de richtlijn markten voor financiële instrumenten
      2014.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31e
  - number: 31e.2
    text: |-
      Een beleggingsonderneming die significant is ingevolge [artikel 31f][ref1], beschikt over een benoemingscommissie
      waarvan de taken en bevoegdheden voldoen aan de vereisten in artikel 88, tweede lid, van de richtlijn
      kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel31f
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31e
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 31f
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 31f
    text: |-
      Een beleggingsonderneming is, mede voor de toepassing van [4:9.0a, eerste lid, van de wet](onbekend), significant
      indien zij door de Autoriteit Financiële Markten, gelet op haar omvang, interne organisatie en de aard, reikwijdte
      en complexiteit van haar activiteiten als significant wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31f
  - number: 31g
    text: |-
      Een beleggingsonderneming die over een website beschikt, geeft daarop uitleg over de wijze waarop zij voldoet
      aan [artikel 4:9.0a van de wet][ref1] en de vereisten met betrekking tot een doeltreffend en prudent bestuur als
      bedoeld in [artikel 31e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel31e
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31g
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 31e
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 31ga
    text: |-
      Een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen, niet zijnde een
      kleine en niet-verweven beleggingsonderneming als bedoeld in artikel 12, eerste lid, van de verordening prudentiële
      vereisten voor beleggingsondernemingen, verstrekt de in artikel 34, vierde lid, van de richtlijn prudentieel
      toezicht beleggingsondernemingen bedoelde gegevens jaarlijks aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31ga
  - number: 31h
    text: |-
      Een beheerder van een icbe of een bewaarder beschikt over procedures die zijn werknemers in staat stellen om door
      hen geconstateerde mogelijke of feitelijke overtredingen van het bij of krachtens deze wet bepaalde intern te
      melden. Deze procedures voldoen aan de vereisten in artikel 99 quinquies, tweede lid, onderdelen b, c en d, van de
      richtlijn instellingen voor collectieve belegging in effecten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31h
  - number: 31j
    text: |-
      De [artikelen 32 tot en met 32c][ref1] zijn niet van toepassing op een in Nederland gelegen bijkantoor van een
      beleggingsonderneming met zetel in een andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel32
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel31j
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '32.1'
    text: |-
      Een financiële onderneming als bedoeld in [artikel 4:14][ref1] of [4:15 van de wet][ref2] die financiële producten
      aanbiedt of samenstelt en in de markt verkrijgbaar stelt, beschikt over adequate procedures en maatregelen die
      waarborgen dat bij de ontwikkeling van het financieel product op een evenwichtige wijze rekening wordt gehouden met
      de belangen van de consument, cliënt en, indien van toepassing, de begunstigde van het financieel product en dat
      het financieel product aantoonbaar het resultaat is van deze belangenafweging.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '32.2'
    text: 'De procedures en maatregelen, bedoeld in het eerste lid, worden vastgelegd en waarborgen in ieder geval dat:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: 32.2.a
    text: |-
      de doelgroep van het financieel product is afgebakend, waarbij is geanalyseerd en omschreven wat de beoogde
      doelstelling van de doelgroep is;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: 32.2.b
    text: |-
      analyses worden uitgevoerd waarin de werking van het financieel product als geheel en de afzonderlijke onderdelen
      daarvan in verschillende scenario’s wordt vastgesteld en waaruit blijkt dat het financieel product, gelet op de
      aard van het product, geen afbreuk doet aan de doelstelling, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: 32.2.c
    text: |-
      de productinformatie en, voor zover redelijkerwijs mag worden verwacht, de distributie van het financieel product
      is afgestemd op de doelgroep, bedoeld in onderdeel a; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: 32.2.d
    text: |-
      regelmatig een controle en indien nodig een gepaste bijstelling van de procedures en maatregelen, bedoeld in het
      eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: '32.3'
    text: |-
      De financiële onderneming past periodiek, op door haar te bepalen tijdstippen of als daar aanleiding toe is,
      de procedures en maatregelen, bedoeld in het eerste lid, toe op de financiële producten die door haar worden
      aangeboden, of zijn samengesteld en in de markt verkrijgbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: '32.4'
    text: |-
      Indien een financieel product afbreuk doet aan de belangen van de consument, cliënt of begunstigde voor wie
      het product ontwikkeld is, past de financiele onderneming zo spoedig mogelijk het product aan of staakt zij het
      aanbieden of samenstellen en het in de markt verkrijgbaar stellen van het financieel product.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: '32.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: '32.6'
    text: |-
      Het eerste tot en met vijfde lid zijn van overeenkomstige toepassing op beleggingsondernemingen die financiële
      instrumenten uitgeven, ontwikkelen of samenstellen en in de markt verkrijgbaar stellen. Bij de analyse en
      omschrijving van de beoogde doelstelling van de doelgroep, bedoeld in het tweede lid, onderdeel a, houdt de
      beleggingsonderneming eveneens rekening met de eventuele duurzaamheidsdoelstelling van de doelgroep.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: '32.7'
    text: |-
      Het vierde lid is niet van toepassing op het beheren of uitvoeren van overeenkomsten als bedoeld in de onderdelen
      a, b en c van de definitie van aanbieden in [artikel 1:1 van de wet][ref1] en op financiëledienstverleners die een
      verzekering aanbieden of samenstellen en in de markt verkrijgbaar stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '32.8'
    text: 'Dit artikel is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: 32.8.a
    text: |-
      beheerders van een beleggingsinstelling die rechten van deelneming in een beleggingsinstelling aanbieden aan
      professionele beleggers, beheerders van een icbe, en financiëledienstverleners die verzekeringen van grote risico’s
      aanbieden of samenstellen en in de markt verkrijgbaar stellen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: 32.8.b
    text: |-
      beleggingsondernemingen die obligaties zonder andere ingebedde afgeleide instrumenten dan een make-whole-clausule
      als bedoeld in artikel 4, eerste lid, onderdeel 44 bis, van de richtlijn markten voor financiële instrumenten 2014
      aanbieden of samenstellen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: 32.8.c
    text: |-
      financiële ondernemingen die financiële instrumenten uitgeven, ontwikkelen, samenstellen en uitsluitend aanbieden
      aan in aanmerking komende tegenpartijen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32
  - number: 32a.1
    text: |-
      Een beleggingsonderneming die een financieel instrument uitgeeft, ontwikkelt of samenstelt en in de markt
      verkrijgbaar stelt, informeert een beleggingsonderneming die beleggingsdiensten verleent met betrekking tot het
      desbetreffende financieel instrument over de kenmerken en risico’s van het financieel instrument, de kenmerken en
      doelstellingen van de doelgroep, met inbegrip van duurzaamheidsdoelstellingen, en de distributiestrategie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32a
  - number: 32a.2
    text: |-
      De beleggingsonderneming voldoet aan artikel 9, met uitzondering van het zevende en veertiende lid, van de
      gedelegeerde uitvoeringsrichtlijn markten voor financiële instrumenten 2014.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32a
  - number: 32a.3
    text: 'Dit artikel is niet van toepassing op beleggingsondernemingen die:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32a
  - number: 32a.3.a
    text: |-
      obligaties zonder andere ingebedde afgeleide instrumenten dan een make-whole-clausule als bedoeld in artikel 4,
      eerste lid, onderdeel 44 bis, van de richtlijn markten voor financiële instrumenten 2014 aanbieden of samenstellen
      en in de markt verkrijgbaar stellen; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32a
  - number: 32a.3.b
    text: |-
      financiële instrumenten uitgeven, ontwikkelen, samenstellen en uitsluitend aanbieden aan in aanmerking komende
      tegenpartijen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32a
  - number: 32aa
    text: |-
      Een financiële onderneming die een betaalrekening, krediet of spaarrekening aanbiedt of samenstelt en in de markt
      verkrijgbaar stelt, informeert de financiëledienstverlener die de betaalrekening, het krediet of de spaarrekening
      distribueert over de kenmerken van het financieel product, de kenmerken en doelstellingen van de doelgroep en de
      distributiestrategie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32aa
  - number: 32ab.1
    text: |-
      Een financiëledienstverlener die betaalrekeningen, kredieten of spaarrekeningen distribueert, beschikt over
      adequate procedures en maatregelen die waarborgen dat de desbetreffende financiële producten voldoen aan de
      behoeften, kenmerken en doelstellingen van de doelgroep en de distributiestrategie aansluit bij de desbetreffende
      doelgroep.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32ab
  - number: 32ab.2
    text: |-
      De financiëledienstverlener bepaalt op basis van de informatie, bedoeld in [artikel 32a, eerste lid][ref1], die
      door de aanbieder van de betaalrekening, het krediet of de spaarrekening is verstrekt, en informatie over haar
      eigen cliënten de doelgroep en de distributiestrategie.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel32a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32ab
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 32a
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 32ab.3
    text: |-
      De financiëledienstverlener evalueert periodiek de procedures en maatregelen, bedoeld in het eerste lid, en past
      indien nodig de procedures en maatregelen aan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32ab
  - number: 32ab.4
    text: |-
      De financiëledienstverlener evalueert periodiek of als daar aanleiding toe is, of de betaalrekeningen,
      kredieten of spaarrekeningen en de diensten die zij verleent, voldoen aan de doelstelling van de doelgroep en de
      distributiestrategie nog aansluit bij de doelgroep en past zo nodig de doelgroep of de distributiestrategie aan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32ab
  - number: 32ab.5
    text: |-
      De financiëledienstverlener verstrekt relevante informatie over de distributie van de betaalrekening, het krediet
      of de spaarrekening en over de uitkomsten van periodieke evaluaties, bedoeld in het derde en vierde lid, aan de
      financiële onderneming die het desbetreffende financieel product aanbiedt of bemiddelaar die het financieel product
      samenstelt en in de markt verkrijgbaar stelt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32ab
  - number: 32b.1
    text: |-
      Een beleggingsonderneming die financiële instrumenten distribueert, beschikt over adequate procedures en
      maatregelen die waarborgen dat de financiële instrumenten voldoen aan de behoeften, kenmerken en doelstellingen,
      met inbegrip van duurzaamheidsdoelstellingen, van de doelgroep en de distributiestrategie aansluit bij de
      desbetreffende doelgroep.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
  - number: 32b.2
    text: |-
      De beleggingsonderneming stelt vast voor welke doelgroep een bepaald financieel instrument niet passend is, behalve
      indien het gaat om een financieel instrument waarbij rekening wordt gehouden met duurzaamheidsfactoren als bedoeld
      in artikel 2, onder 24, van [Verordening (EU) 2019/2088](32088R2019) van het Europees Parlement en de Raad van
      27 november 2019 betreffende informatieverschaffing over duurzaamheid in de financiëledienstensector (PbEU 2019,
      L 317).
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
  - number: 32b.3
    text: |-
      De beleggingsonderneming beschikt over procedures en maatregelen om informatie over de kenmerken en risico’s van
      elk financieel instrument, de kenmerken en doelstellingen, met inbegrip van duurzaamheidsdoelstellingen, van de
      doelgroep en de distributiestrategie te verkrijgen en de beoogde doelgroep te begrijpen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
  - number: 32b.4
    text: |-
      De dagelijks beleidsbepalers van de beleggingsonderneming oefenen controle uit over de procedures en maatregelen,
      bedoeld in het eerste lid, en ontvangen periodiek verslagen over de financiële instrumenten die zijn gedistribueerd
      en de verleende beleggingsdiensten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
  - number: 32b.5
    text: |-
      Werknemers van de beleggingsonderneming die adviseren of individuele vermogens beheren, beschikken over de
      benodigde kennis over de kenmerken en risico’s van de financiële instrumenten, de beleggingsdiensten en over de
      behoeften, kenmerken en doelstellingen, met inbegrip van duurzaamheidsdoelstellingen, van de doelgroep.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
  - number: 32b.6
    text: |-
      De beleggingsonderneming bepaalt op basis van de informatie, bedoeld in [artikel 32a, eerste lid][ref1], en
      informatie over haar eigen cliënten de doelgroep en de distributiestrategie.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel32a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 32a
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 32b.7
    text: |-
      De beleggingsonderneming evalueert periodiek de procedures en maatregelen, bedoeld in het eerste en derde lid, en
      past indien nodig de procedures en maatregelen aan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
  - number: 32b.8
    text: |-
      De beleggingsonderneming evalueert periodiek of als daar aanleiding toe is of de financiële instrumenten en
      de diensten die zij verleent, voldoen aan de doelstellingen, met inbegrip van duurzaamheidsdoelstellingen,
      van de doelgroep en de distributiestrategie nog aansluit bij de doelgroep en past zo nodig de doelgroep of de
      distributiestrategie aan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
  - number: 32b.9
    text: |-
      De beleggingsonderneming verstrekt relevante informatie over de distributie van het financieel instrument en over
      de uitkomsten van periodieke evaluaties, bedoeld in het zevende en achtste lid, aan de beleggingsonderneming die
      het financieel instrument uitgeeft, ontwikkelt of samenstelt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
  - number: 32b.10
    text: 'Dit artikel is niet van toepassing op beleggingsondernemingen die:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
  - number: 32b.10.a
    text: |-
      obligaties zonder andere ingebedde afgeleide instrumenten dan een make-whole-clausule als bedoeld in artikel 4,
      eerste lid, onderdeel 44 bis, van de richtlijn markten voor financiële instrumenten 2014 distribueren; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
  - number: 32b.10.b
    text: financiële instrumenten uitsluitend aan in aanmerking komende tegenpartijen distribueren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32b
  - number: 32c.1
    text: |-
      Indien beleggingsondernemingen samenwerken die zelf niet de financiële instrumenten uitgeven, ontwikkelen
      of samenstellen, voldoet de beleggingsonderneming die rechtstreeks contact heeft met de cliënt aan
      [artikel 32b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel32b
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 32b
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 32c.2
    text: |-
      Indien sprake is van een situatie als bedoeld in het eerste lid voldoen de beleggingsondernemingen aan artikel
      10, tiende lid, onderdelen a tot en met c, van de gedelegeerde uitvoeringsrichtlijn markten voor financiële
      instrumenten 2014.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32c
  - number: 32d.1
    text: |-
      Een aanbieder als bedoeld in [4:15, eerste of vierde lid, van de wet][ref1] die een consument of, indien het een
      verzekering betreft, cliënt adviseert, bewaart, indien de advisering leidt tot het aangaan van een overeenkomst
      inzake het aanbevolen product met de consument onderscheidenlijk de cliënt, de informatie die hij overeenkomstig
      [artikel 4:23, eerste lid, onderdeel a, van de wet][ref2] heeft ingewonnen, alsmede de gegevens betreffende het
      verkochte financiële product, gedurende ten minste vijf jaren vanaf het moment van advisering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 32d.2
    text: |-
      Een adviseur als bedoeld in [4:15, eerste of vierde lid, van de wet][ref1] die een consument of, indien
      het een verzekering betreft, cliënt adviseert, en het aanbevolen financiële product niet tevens aanbiedt
      aan de consument of cliënt of met betrekking tot het aanbevolen financiële product niet tevens bemiddelt of
      optreedt als gevolmachtigde agent of ondergevolmachtigde agent, bewaart de informatie die hij overeenkomstig
      [artikel 4:23, eerste lid, onderdeel a, van de wet][ref2] heeft ingewonnen, alsmede de gegevens betreffende het
      aanbevolen financiële product, gedurende ten minste vijf jaren vanaf het moment van advisering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 32d.3
    text: |-
      Een bemiddelaar, gevolmachtigde agent of ondergevolmachtigde agent als bedoeld in
      [4:15, eerste of vierde lid, van de wet][ref1] die een consument of, indien het een verzekering betreft,
      cliënt adviseert bewaart, indien de advisering leidt tot het aangaan van een overeenkomst met de
      consument onderscheidenlijk de cliënt inzake het aanbevolen product, de informatie die hij overeenkomstig
      [artikel 4:23, eerste lid, onderdeel a, van de wet][ref2] heeft ingewonnen, alsmede de gegevens betreffende het
      aanbevolen financiële product, gedurende ten minste vijf jaren vanaf het moment van advisering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 32d.4
    text: |-
      Het eerste, tweede en derde lid zijn niet van toepassing op financiële ondernemingen die bij de advisering
      uitsluitend te werk gaan volgens een gestandaardiseerde en gesystematiseerde procedure die voor de Autoriteit
      Financiële Markten verifieerbaar is, en die aan de hand van deze procedure aan de Autoriteit Financiële Markten
      kunnen aantonen welke informatie zij overeenkomstig [artikel 4:23, eerste lid, onderdeel a, van de wet][ref1] over
      consumenten onderscheidenlijk cliënten inwinnen en welke adviezen consumenten onderscheidenlijk cliënten op basis
      van de aldus ingewonnen informatie worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 32d.5
    text: |-
      Een aanbieder, bemiddelaar, gevolmachtigde agent of ondergevolmachtigde agent als bedoeld in
      [4:15, eerste of vierde lid, van de wet][ref1] die in het kader van een door hem verstrekt advies met een
      consument of, indien het een verzekering betreft, cliënt een overeenkomst aangaat onderscheidenlijk bemiddelt
      bij de totstandkoming van een overeenkomst inzake een ander financieel product dan waarover hij de consument
      onderscheidenlijk de cliënt heeft geadviseerd, is gedurende ten minste vijf jaren na de totstandkoming van de
      overeenkomst in staat om aan de Autoriteit Financiële Markten aan te tonen dat de consument onderscheidenlijk de
      cliënt in weerwil van het advies de keuze heeft gemaakt voor het aangaan van die overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 32e.1
    text: |-
      Een financiëledienstverlener die een verzekering aanbiedt of samenstelt en in de markt verkrijgbaar stelt,
      informeert de adviseur, bemiddelaar in verzekeringen, gevolmachtigde agent of ondergevolmachtigde agent die de
      verzekering distribueert over de kenmerken van de verzekering, de kenmerken en doelstellingen van de doelgroep en
      de distributiestrategie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32e
  - number: 32e.2
    text: |-
      De financiëledienstverlener die verzekeringen distribueert, beschikt over procedures en maatregelen om de
      informatie over de kenmerken van elke verzekering, de kenmerken en de doelstelling van de doelgroep en de
      distributiestrategie te verkrijgen en de beoogde doelgroep te begrijpen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32e
  - number: 32e.3
    text: Dit artikel is niet van toepassing op financiëledienstverleners die verzekeringen van grote risico’s distribueren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel32e
  - number: '33'
    text: |-
      Een aanbieder van krediet als bedoeld in [artikel 4:15, eerste of vierde lid, van de wet][ref1] bewaart:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 33.a
    text: |-
      de informatie die hij ingevolge de [artikelen 4:34, eerste lid, van de wet][ref1] en [113][ref2], [114][ref3] en
      [115][ref4] heeft ingewonnen, alsmede de door hem aangeboden overeenkomst inzake krediet, indien die overeenkomst
      tot stand is gekomen, ten minste gedurende vijf jaren na de dag waarop die overeenkomst is afgewikkeld;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel113
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel114
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel115
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '113'
        hoofdstuk: '10'
        paragraaf: 10.2.2
        afdeling: '10.2'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '114'
        hoofdstuk: '10'
        paragraaf: 10.2.2
        afdeling: '10.2'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '115'
        hoofdstuk: '10'
        paragraaf: 10.2.2
        afdeling: '10.2'
  - number: 33.b
    text: |-
      indien het een overeenkomst inzake hypothecair krediet met een variabele rente betreft, de indexen die bij de
      berekening van de debetrentevoet worden gebruikt ten minste gedurende vijf jaren na de dag waarop de index voor de
      laatste maal is gebruikt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel33
  - number: 33a.1
    text: |-
      Een Nederlandse beheerder van een beleggingsinstelling voert met betrekking tot de
      beleggingsinstellingen die hij beheert, beleid gericht op het beheersen van risico’s die de in
      [artikel 4:14, tweede lid, onderdeel c, aanhef, van de wet][ref1] bedoelde belangen kunnen schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 33a.2
    text: |-
      De beheerder beschikt over procedures en maatregelen die waarborgen dat wordt voldaan aan de ingevolge artikel 15,
      eerste, tweede, derde en vijfde lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen gestelde
      voorwaarden die met het oog op de in het eerste lid bedoelde belangen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel33a
  - number: '34.1'
    text: |-
      De bedrijfsvoering van een beheerder van een icbe of icbe als bedoeld in
      [artikel 4:14, eerste lid, van de wet][ref1] omvat ten minste procedures en maatregelen die waarborgen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 34.1.a
    text: elke transactie waarbij de icbe is betrokken, kan worden gereconstrueerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
  - number: 34.1.b
    text: |-
      het beheerde vermogen van de icbe overeenkomstig het beleggingsbeleid en de bij of krachtens de wet gestelde regels
      wordt belegd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
  - number: 34.1.c
    text: |-
      een functiescheiding bestaat tussen het verrichten van rechtshandelingen met betrekking tot het vermogen van de
      icbe en het controleren en administreren van deze handelingen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
  - number: 34.1.d
    text: een betrouwbare, juiste en consistente intrinsieke waarde van de icbe wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
  - number: 34.1.e
    text: |-
      het proces van intrinsieke waardebepaling binnen de beheerder van een icbe of de maatschappij voor collectieve
      belegging in effecten wordt gescheiden van de overige activiteiten van de beheerder van een icbe of de maatschappij
      voor collectieve belegging in effecten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
  - number: 34.1.f
    text: de berekening van de intrinsieke waarde van de icbe aansluit bij de financiële administratie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
  - number: 34.1.g
    text: de risico’s die samenhangen met het beleggingsproces op een systematische wijze worden beheerst en geanalyseerd; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
  - number: 34.1.h
    text: |-
      er, voorzover mogelijk, een systematische, toegankelijke en actuele administratie van deelnemers in de icbe is
      waarin, voorzover van toepassing, de met de deelnemers gemaakte afspraken inzichtelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
  - number: '34.2'
    text: |-
      De maatregelen en procedures, bedoeld in het eerste lid, aanhef en onderdeel f, voorzien er in ieder geval in dat
      de voor de intrinsieke waardebepaling gebruikte subadministraties ten minste een keer per maand worden aangesloten
      met de saldibalans en dat de daaruit voortvloeiende verschillen worden geanalyseerd en gecorrigeerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
  - number: '34.3'
    text: |-
      De procedures en maatregelen, bedoeld in het eerste lid, onderdeel g, van een icbe omvatten in ieder geval een
      procedure voor de waardevaststelling van financiële derivaten die niet op een gereglementeerde markt of een andere
      markt in financiële instrumenten worden verhandeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
  - number: '34.4'
    text: |-
      Een beheerder van een icbe richt voor iedere icbe die hij beheert afzonderlijk een bedrijfsvoering als bedoeld in
      het eerste lid in.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34
  - number: 34a.1
    text: |-
      Een beheerder van een icbe stelt procedures en regelingen vast en past die toe zodat hij in staat is om de
      Autoriteit Financiële Markten op verzoek zo spoedig mogelijk financiële verslagen te verstrekken die een getrouw
      beeld geven van zijn financiële positie en die aan alle toepasselijke standaarden en regels voor financiële
      verslaggeving voldoen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34a
  - number: 34a.2
    text: |-
      Onverminderd [artikel 34][ref1] wordt de administratie van een icbe zodanig gevoerd dat de activa en passiva van de
      icbe te allen tijde rechtstreeks kunnen worden geïdentificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel34
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 34a.3
    text: |-
      Een beheerder van een icbe onderwerpt de waardevaststelling van financiële derivaten, bedoeld in
      [artikel 34, derde lid][ref1], aan een adequate, accurate en onafhankelijke toetsing.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel34
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 34a.4
    text: |-
      De procedure met betrekking tot de waardevaststelling van financiële derivaten, bedoeld in
      [artikel 34, derde lid][ref1], is adequaat en evenredig gelet op de aard en complexiteit van de desbetreffende
      financiële derivaten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel34
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 34a.5
    text: De procedure, bedoeld in het vierde lid, wordt op adequate wijze vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34a
  - number: 34b.1
    text: |-
      Een beheerder van een icbe treft maatregelen die waarborgen dat gegevens ten behoeve van de reconstructie van elke
      transactie, bedoeld in [artikel 34, eerste lid, onderdeel a][ref1], worden bijgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel34
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 34b.2
    text: 'De gegevens, bedoeld in het eerste lid, omvatten in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
  - number: 34b.2.a
    text: de naam of een andere omschrijving van de icbe en van de persoon die voor rekening van de icbe handelt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
  - number: 34b.2.b
    text: de bijzonderheden die nodig zijn om het financieel instrument te identificeren;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
  - number: 34b.2.c
    text: het aantal orders of transacties;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
  - number: 34b.2.d
    text: het soort order of transactie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
  - number: 34b.2.e
    text: de prijs per eenheid;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
  - number: 34b.2.f
    text: |-
      met betrekking tot orders, de datum en het tijdstip waarop de order is doorgegeven, en de naam of een andere
      omschrijving van de persoon aan wie de order is doorgegeven;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
  - number: 34b.2.g
    text: |-
      met betrekking tot transacties, de datum en het tijdstip waarop de handelsbeslissing is genomen en de transactie
      is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
  - number: 34b.2.h
    text: de naam van de persoon die de order doorgeeft of de transactie uitvoert;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
  - number: 34b.2.i
    text: in voorkomend geval, de redenen voor het intrekken van een order; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
  - number: 34b.2.j
    text: voor uitgevoerde transacties, de tegenpartij en de plaats van uitvoering.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34b
  - number: 34c.1
    text: |-
      Een beheerder van een icbe treft redelijke maatregelen om te waarborgen dat de gegevens over ontvangen opdrachten
      tot inschrijving of terugbetaling van rechten van deelneming met betrekking tot de icbe na ontvangst van een
      dergelijke opdracht onmiddellijk centraal worden geadministreerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2
    text: 'De gegevens, bedoeld in het eerste lid, omvatten informatie met betrekking tot de volgende aspecten:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2.a
    text: de betrokken icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2.b
    text: |-
      de persoon die de opdracht tot inschrijving of terugbetaling van rechten van deelneming heeft gegeven of
      overgedragen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2.c
    text: de persoon die de opdracht heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2.d
    text: de datum en het tijdstip van de ontvangen opdracht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2.e
    text: de betalingsvoorwaarden en betalingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2.f
    text: het soort opdracht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2.g
    text: de datum van uitvoering van de opdracht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2.h
    text: het aantal rechten van deelneming waarop wordt ingeschreven of dat wordt terugbetaald;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2.i
    text: de prijs van de inschrijving of de terugbetaling voor elk recht van deelneming;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2.j
    text: de totale waarde van de inschrijving of terugbetaling van de rechten van deelneming; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34c.2.k
    text: |-
      de brutowaarde van de opdracht inclusief de kosten van inschrijving of het nettobedrag na aftrek van de kosten
      van terugbetaling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34c
  - number: 34d.1
    text: |-
      Een beheerder van een icbe bewaart de gegevens, bedoeld in de [artikelen 34b, eerste lid][ref1], en
      [34c, eerste lid][ref2], gedurende tenminste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel34b
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel34c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 34b
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 34c
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 34d.2
    text: 'Een beheerder van een icbe bewaart de gegevens op een duurzame drager in en zodanige vorm en op zodanige wijze dat:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34d
  - number: 34d.2.a
    text: |-
      de Autoriteit Financiële Markten vlot toegang kan hebben tot de gegevens en elk stadium van de verwerking van een
      transactie kan reconstrueren;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34d
  - number: 34d.2.b
    text: |-
      alle wijzigingen, alsmede de inhoud van de gegevens voordat wijzigingen zijn aangebracht, gemakkelijk kunnen worden
      achterhaald; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34d
  - number: 34d.2.c
    text: de gegevens niet anderszins gemanipuleerd of gewijzigd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34d
  - number: 34d.3
    text: |-
      Indien de beheerder zijn verantwoordelijkheden met betrekking tot de icbe aan een andere beheerder overdraagt,
      worden maatregelen getroffen zodat de gegevens betreffende de voorafgaande vijf jaar voor de andere beheerder
      toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34d
  - number: 34e
    text: |-
      De bedrijfsvoering van een bewaarder omvat systemen, middelen en procedures om te zorgen voor continuïteit en
      regelmaat bij het uitoefenen van zijn bewaartaken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34e
  - number: 34f
    text: |-
      De bedrijfsvoering van een pensioenbewaarder als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] omvat ten
      minste procedures en maatregelen die waarborgen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 34f.a
    text: |-
      elke transactie in verband met het overgedragen pensioenvermogen, kan worden gereconstrueerd en de tegenprestatie
      voor de transactie tijdig wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34f
  - number: 34f.b
    text: |-
      het overgedragen pensioenvermogen overeenkomstig het door de premiepensioeninstelling bepaalde beleggingsbeleid en
      de bij of krachtens de wet gestelde regels wordt belegd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34f
  - number: 34f.c
    text: |-
      de pensioenbewaarder de instructies van de premiepensioeninstelling uitvoert, tenzij deze in strijd zijn met de wet
      of met een overeenkomst tussen de premiepensioeninstelling en de bijdragende onderneming of de pensioenbewaarder;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34f
  - number: 34f.d
    text: de risico’s die samenhangen met het beleggingsproces op een systematische wijze worden beheerst en geanalyseerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34f
  - number: 34f.e
    text: |-
      een functiescheiding bestaat tussen het verrichten van rechtshandelingen met betrekking tot het overgedragen
      pensioenvermogen en het controleren en administreren van deze handelingen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34f
  - number: 34f.f
    text: |-
      alle rechten en verplichtingen van de pensioenbewaarder juist, tijdig en volledig worden vastgelegd in een daartoe
      bestemde administratie en dat met betrekking tot andere activa wordt geverifieerd dat de premiepensioeninstelling
      de eigenaar is van het overgedragen pensioenvermogen, aan de hand van door de premiepensioeninstelling of anderen
      aangeleverde bewijzen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34f
  - number: 34f.g
    text: |-
      de administratie van het overgedragen pensioenvermogen ten minste een keer per maand wordt aangesloten met de
      saldibalans en dat de daaruit voortvloeiende verschillen worden geanalyseerd en gecorrigeerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34f
  - number: 34g
    text: |-
      De bedrijfsvoering van een premiepensioeninstelling als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1]
      omvat ten minste procedures en maatregelen die waarborgen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34g
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 34g.a
    text: |-
      er een systematische, toegankelijke en actuele administratie van pensioendeelnemers en pensioengerechtigden is
      waarin, voor zover van toepassing, de rechten en verplichtingen van die deelnemers en gerechtigden en de daarmee
      verband houdende afspraken inzichtelijk worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34g
  - number: 34g.b
    text: |-
      de administratie, bedoeld in onderdeel a, zodanig is dat deze geen belemmering vormt of kan vormen voor de
      toepassing van de regeling van [artikel 4:71a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel34g
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '35.1'
    text: |-
      Een beleggingsonderneming houdt gegevens bij over alle door haar verleende beleggingsdiensten, nevendiensten
      en verrichte beleggingsactiviteiten ten einde het toezicht op de naleving van hetgeen ter implementatie van de
      richtlijn markten voor financiële instrumenten 2014 ingevolge de [wet][ref1] is bepaald mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '35.2'
    text: |-
      Het bijhouden van gegevens als bedoeld in het eerste lid omvat het opnemen van telefoongesprekken, het vastleggen
      van rechtstreeks met de cliënt gevoerde gesprekken en elektronische communicatie die zijn gericht op het verrichten
      van transacties in financiële instrumenten voor eigen rekening of het verlenen van diensten inzake het ontvangen,
      doorgeven en uitvoeren van orders voor cliënten ongeacht of deze transacties ook daadwerkelijk zijn verricht of de
      diensten daadwerkelijk zijn verleend.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35
  - number: '35.3'
    text: De gegevens, bedoeld in het eerste en tweede lid, worden vijf jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35
  - number: '35.4'
    text: |-
      In afwijking van het derde lid kan de Autoriteit Financiële Markten voorschrijven dat een beleggingsonderneming de
      gegevens, bedoeld in het eerste en tweede lid, zeven jaar bewaart.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35
  - number: 35.0a.1
    text: |-
      Een beleggingsonderneming neemt maatregelen voor de opname en opslag van telefoongesprekken en elektronische
      communicatie tussen de beleggingsonderneming en haar cliënten die zijn gericht op het verrichten van transacties in
      financiële instrumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35.0a
  - number: 35.0a.2
    text: |-
      Een beleggingsonderneming neemt maatregelen om te voorkomen dat de werknemers of andere natuurlijke personen die
      werkzaam zijn onder haar verantwoordelijkheid de telefoongesprekken en elektronische communicatie bedoeld in het
      eerste lid tot stand brengen, versturen of ontvangen op privé-apparatuur waarvan de beleggingsonderneming geen
      gegevens kan opnemen of kan kopiëren.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35.0a
  - number: 35.0a.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op telefoongesprekken en elektronische communicatie
      die gericht zijn op het verrichten van transacties in financiële instrumenten voor eigen rekening.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35.0a
  - number: 35a.1
    text: |-
      Een beheerder van een icbe of beleggingsonderneming als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1]
      beschikt over procedures en maatregelen voor het voorkomen van en omgaan met belangenconflicten tussen de beheerder
      van een icbe of beleggingsonderneming en haar cliënten of tussen haar cliënten onderling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 35a.2
    text: |-
      De procedures en maatregelen, bedoeld in het eerste lid, zijn erop gericht dat relevante personen die betrokken
      zijn bij verschillende bedrijfsactiviteiten waarbij het risico bestaat op een belangenconflict als bedoeld in
      het eerste lid, deze activiteiten verrichten in een mate van onafhankelijkheid die evenredig is aan de omvang en
      activiteiten van de beheerder van een icbe en de groep waarvan zij deel uitmaakt, en aan de grootte van het risico
      dat de belangen van een cliënt worden geschaad.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35a
  - number: 35a.3
    text: |-
      De procedures en maatregelen, bedoeld in het eerste lid, omvatten, voor zover nodig en passend om de mate van
      onafhankelijkheid, bedoeld in het tweede lid, te waarborgen:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35a
  - number: 35a.3.a
    text: |-
      procedures ter voorkoming of controle van de uitwisseling van informatie tussen relevante personen die
      verschillende activiteiten verrichten waarbij het risico bestaat op een belangenconflict wanneer de uitwisseling
      van deze informatie de belangen van een cliënt kan schaden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35a
  - number: 35a.3.b
    text: |-
      controle op de activiteiten van relevante personen wier hoofdtaken bestaan in het uitoefenen van activiteiten in
      naam van, of het verlenen van diensten aan cliënten wier belangen met elkaar in strijd kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35a
  - number: 35a.3.c
    text: |-
      de uitsluiting van elk direct verband tussen de beloning van relevante personen die hoofdzakelijk betrokken
      zijn bij de ene activiteit en de beloning van of de inkomsten gegenereerd door andere relevante personen die
      hoofdzakelijk betrokken zijn bij een andere activiteit, wanneer door deze activiteiten een belangenconflict kan
      ontstaan;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35a
  - number: 35a.3.d
    text: |-
      maatregelen om te voorkomen of het risico te beperken dat een persoon zodanige invloed uitoefent op de wijze
      waarop een relevante persoon werkzaamheden in verband met het beheer van een icbe verricht, dat daardoor een
      belangenconflict ontstaat of kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35a
  - number: 35a.3.e
    text: |-
      maatregelen ter voorkoming of controle van de gelijktijdige of achtereenvolgende betrokkenheid van een relevante
      persoon bij verschillende werkzaamheden in verband met het beheer van een icbe wanneer een dergelijke betrokkenheid
      kan leiden tot het ontstaan van belangenconflicten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35a
  - number: 35a.4
    text: |-
      Indien bij vaststelling of toepassing van procedures of maatregelen als bedoeld in het eerste lid niet de in het
      tweede lid bedoelde mate van onafhankelijkheid kan worden gewaarborgd, draagt de beheerder van een icbe zorg voor
      alternatieve of aanvullende procedures of maatregelen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35a
  - number: 35b.1
    text: |-
      Een beheerder van een icbe legt de gegevens vast die betrekking hebben op de soorten door of in naam van de
      beheerder verrichte werkzaamheden in verband met het beheren van beleggingen waarbij een belangenconflict is
      ontstaan of kan ontstaan dat een wezenlijk risico met zich brengt dat de belangen van een of meer icbe's of van de
      deelnemers worden geschaad.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35b
  - number: 35b.2
    text: |-
      De beheerder zorgt ervoor dat de personen die het dagelijks beleid bepalen van de beheerder onmiddellijk in kennis
      worden gesteld wanneer de getroffen maatregelen voor het voorkomen van en omgaan met belangenconflicten niet
      volstaan om met redelijke zekerheid te garanderen dat risico’s dat de belangen van de icbe of de deelnemers ervan
      worden geschaad, zullen worden vermeden, zodat zij alle nodige beslissingen kunnen nemen om te waarborgen dat de
      beheerder in ieder geval handelt in het belang van de icbe en haar deelnemers.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35b
  - number: 35b.3
    text: |-
      De beheerder stelt de deelnemers van een door hem beheerde icbe via een duurzame drager op de hoogte van de
      situaties, bedoeld in het derde lid, met opgave van redenen van de beslissing die de personen die het dagelijks
      beleid bepalen ter zake hebben genomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35b
  - number: 35c.1
    text: |-
      Een beheerder van een icbe als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] beschikt over procedures en
      maatregelen met betrekking tot persoonlijke transacties.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 35c.2
    text: |-
      De procedures en maatregelen, bedoeld in het eerste lid, zijn er op gericht dat indien een relevante persoon
      betrokken is bij het verrichten van activiteiten die een belangenconflict kunnen doen ontstaan, of indien een
      relevante persoon als gevolg van een activiteit die hij in naam van de beheerder verricht toegang heeft tot
      informatie als bedoeld in artikel 7, eerste lid, van de verordening marktmisbruik of tot andere vertrouwelijke
      informatie over cliënten of transacties met of voor cliënten:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35c
  - number: 35c.2.a
    text: |-
      geen persoonlijke transactie door of in naam van die relevante persoon wordt verricht die in strijd is met artikel
      14 of 15 van de verordening marktmisbruik;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35c
  - number: 35c.2.b
    text: |-
      geen persoonlijke transactie door of in naam van die relevante persoon wordt verricht die gepaard gaat met misbruik
      of ongeoorloofde bekendmaking van de in de aanhef bedoelde vertrouwelijke informatie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35c
  - number: 35c.2.c
    text: |-
      geen persoonlijke transactie door of in naam van die relevante persoon wordt verricht die anderszins in strijd
      is of in strijd kan zijn met hetgeen ter uitvoering van de richtlijn instellingen voor collectieve belegging in
      effecten ingevolge de [wet][ref1] is bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 35c.2.d
    text: |-
      de relevante persoon niet, anders dan in de normale uitoefening van zijn beroep of bedrijf, een andere persoon
      adviseert om een transactie in een financieel instrument aan te gaan die, wanneer dit een persoonlijke transactie
      van de relevante persoon zou zijn, niet zou zijn toegestaan op grond van onderdeel a, b of c; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35c
  - number: 35c.2.e
    text: |-
      de relevante persoon geen informatie of advies aan een andere persoon bekendmaakt anders dan in de normale
      uitoefening van zijn beroep of bedrijf, indien de relevante persoon weet of redelijkerwijs behoort te weten dat
      de andere persoon een transactie in een financieel instrument zal of zou kunnen aangaan die, wanneer dit een
      persoonlijke transactie van de relevante persoon zou zijn, niet zou zijn toegestaan op grond van onderdeel a, b
      of c;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35c
  - number: 35c.2.f
    text: |-
      de relevante persoon geen informatie of advies aan een andere persoon bekendmaakt anders dan in de normale
      uitoefening van zijn beroep of bedrijf indien de relevante persoon weet of redelijkerwijs behoort te weten dat de
      andere persoon een derde zal of zou kunnen adviseren een transactie in een financieel instrument aan te gaan die,
      wanneer het een persoonlijke transactie van de relevante persoon zou zijn, niet zou zijn toegestaan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35c
  - number: 35d
    text: |-
      Een beheerder van een icbe als bedoeld in [artikel 4:14, eerste lid, van de wet][ref1] draagt er zorg voor
      dat relevante personen op de hoogte zijn van de door haar vastgestelde maatregelen en procedures, bedoeld in
      [artikel 35c, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel35c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 35c
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 35e.1
    text: |-
      De procedures en maatregelen bedoeld in [artikel 35c, eerste lid][ref1], houden in dat de beheerder van een icbe
      onverwijld in kennis wordt gesteld van elke persoonlijke transactie.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel35c
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 35c
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 35e.2
    text: |-
      De beheerder van een icbe houdt gegevens bij van aan haar gemelde of door haar onderkende persoonlijke transacties
      en vermeldt daarbij in voorkomend geval tevens of de desbetreffende transactie is toegestaan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35e
  - number: 35e.3
    text: |-
      Ingeval van uitbesteding draagt de beheerder van een icbe zorg voor registratie door de onderneming waaraan
      de activiteit wordt uitbesteed van gegevens met betrekking tot persoonlijke transacties. Deze gegevens worden
      desgevraagd onverwijld aan de beheerder van een icbe verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35e
  - number: 35e.4
    text: |-
      Het eerste tot en met het derde lid zijn niet van toepassing op achtereenvolgende persoonlijke transacties,
      met uitzondering van de eerste persoonlijke transactie, die worden uitgevoerd namens een relevante persoon
      overeenkomstig vooraf door de relevante persoon gegeven instructies, wanneer de instructies ongewijzigd van kracht
      blijven.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35e
  - number: 35f
    text: |-
      Een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen, niet zijnde een
      beleggingsonderneming als bedoeld in artikel 32, vierde lid, onderdeel a, van de richtlijn prudentieel toezicht
      beleggingsondernemingen, voldoet aan het bepaalde in artikel 52, eerste lid, van de verordening prudentiële
      vereisten voor beleggingsondernemingen, met inachtneming van het bepaalde in het tweede en het bepaalde ingevolge
      het derde lid van dat artikel.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel35f
  - number: '36'
    text: 'Dit hoofdstuk is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel36
  - number: 36.a
    text: |-
      beheerders van icbe’s met zetel in een andere lidstaat, icbe’s met zetel in een andere lidstaat en de eventueel aan
      die instellingen verbonden bewaarders van icbe’s; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel36
  - number: 36.b
    text: |-
      beheerders van beleggingsinstellingen met zetel in een aangewezen staat, beleggingsinstellingen met zetel in een
      aangewezen staat en de eventueel aan die beleggingsinstellingen verbonden bewaarders.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel36
  - number: '37'
    text: |-
      Een financiële onderneming gaat niet over tot het uitbesteden van werkzaamheden indien dat een belemmering vormt
      voor een adequaat toezicht op de naleving van het [Deel Gedragstoezicht financiële ondernemingen van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 37a
    text: |-
      Uitbesteding van werkzaamheden in een door een Nederlandse beheerder beheerde beleggingsinstelling door een
      beheerder of een derde is slechts toegestaan, indien wordt voldaan aan de ingevolge artikel 20 van de richtlijn
      beheerders van alternatieve beleggingsinstellingen gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel37a
  - number: 37b.1
    text: |-
      Een bewaarder neemt bij de uitbesteding aan een derde van taken die hij ten behoeve van een beleggingsinstelling
      verricht de ingevolge artikel 21, elfde en zeventiende lid, van de richtlijn beheerders van alternatieve
      beleggingsinstellingen gestelde regels in acht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel37b
  - number: 37b.2
    text: |-
      Een bewaarder neemt bij de uitbesteding aan een derde van taken die hij ten behoeve van een icbe verricht de
      ingevolge de artikelen 22bis en 26ter, onderdelen c tot en met e, van de richtlijn instellingen voor collectieve
      belegging in effecten gestelde regels in acht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel37b
  - number: '38.1'
    text: 'Indien een beheerder van een icbe in het kader van het beheer van een icbe een of meer werkzaamheden uitbesteedt:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38
  - number: 38.1.a
    text: |-
      is de derde op ieder door de beheerder van de icbe gewenst moment in staat verantwoording af te leggen over de door
      hem uitgevoerde werkzaamheden en de beheerder van de icbe daar inzicht in te bieden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38
  - number: 38.1.b
    text: |-
      kan de beheerder van de icbe te allen tijde instructies omtrent de uitvoering van de werkzaamheden geven aan de
      derde en kan hij de uitbesteding met onmiddellijke ingang beëindigen indien dit in het belang van de beleggers
      is; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38
  - number: 38.1.c
    text: |-
      is de derde, gelet op de aard van de opdracht, aantoonbaar in staat om de opdracht in overeenstemming met de wet
      te vervullen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38
  - number: '38.2'
    text: Een beheerder van een icbe besteedt het bepalen van het beleggingsbeleid van een icbe niet uit.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38
  - number: '38.3'
    text: |-
      Iedere overeenkomst die een beheerder van een icbe aangaat in het kader van het uitbesteden van het beheer van een
      icbe, wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38
  - number: 38a.1
    text: |-
      Indien een beheerder van een icbe voornemens is werkzaamheden uit te besteden, stelt hij de Autoriteit Financiële
      Markten daarvan in kennis. De Autoriteit Financiële Markten geeft deze informatie onverwijld door aan de
      toezichthoudende instantie van de lidstaat van de zetel van de icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38a
  - number: 38a.2
    text: 'Een beheerder van een icbe die het beheer van een icbe uitbesteedt draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38a
  - number: 38a.2.a
    text: |-
      uitbesteding van het beheer van beleggingengeschiedt aan een derde waaraan voor het beheren van
      beleggingsinstellingen of het beheren van individuele vermogens een vergunning of erkenning is verleend en die aan
      prudentieel toezicht is onderworpen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38a
  - number: 38a.2.b
    text: |-
      bij uitbesteding van het beheer van beleggingen aan een derde met zetel in een staat die geen lidstaat of
      aangewezen staat is, de samenwerking van de toezichthouders met de toezichthoudende instanties van de staat van de
      zetel van de derde op grond van een overeenkomst is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38a
  - number: 38a.2.c
    text: |-
      de belangen van de derde niet strijdig zijn met die van de beheerder zelf, de bewaarder of de deelnemers in de
      icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38a
  - number: 38a.2.d
    text: de uitbesteding niet verhindert dat wordt gehandeld in het beste belang van de deelnemers; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38a
  - number: 38a.2.e
    text: hij de nodige deskundigheid behoudt om een doeltreffende controle op de uitbestede werkzaamheden uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38a
  - number: 38a.2.f
    text: |-
      hij voldoende middelen en deskundigheid behoudt ten behoeve van de doeltreffende integratie van
      duurzaamheidsrisico’s; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38a
  - number: 38a.2.g
    text: |-
      hij over de nodige deskundigheid beschikt en de nodige zorgvuldigheid en waakzaamheid in acht neemt bij het
      aangaan, beheren of beëindigen van overeenkomsten met derden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38a
  - number: 38a.3
    text: |-
      De beheerder draagt er zorg voor dat de betrokken derde over de nodige deskundigheid en capaciteit beschikt om de
      uitbestede werkzaamheden op betrouwbare, professionele en doeltreffende wijze uit te oefenen. De beheerder stelt
      methoden vast voor de doorlopende beoordeling van het prestatieniveau van de desbetreffende derde.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38a
  - number: 38g
    text: |-
      Een betaalinstelling of elektronischgeldinstelling besteedt de taken en werkzaamheden van personen die het
      dagelijks beleid bepalen, daaronder mede verstaan het vaststellen van het beleid en het afleggen van verantwoording
      over het gevoerde beleid, niet uit.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38g
  - number: 38h
    text: |-
      Een betaalinstelling of elektronischgeldinstelling als bedoeld in [artikel 38g][ref1] gaat niet over tot
      het uitbesteden van werkzaamheden indien dat afbreuk doet aan de kwaliteit van de interne controle van de
      betaalinstelling of elektronischgeldinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel38g
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38h
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 38g
        hoofdstuk: '6'
  - number: 38i
    text: |-
      Indien een betaalinstelling of elektronischgeldinstelling voornemens is werkzaamheden in verband met het verlenen
      van betaaldiensten dan wel met de uitgifte van elektronisch geld uit te besteden, stelt zij de toezichthouder
      daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38i
  - number: 38j
    text: |-
      Bij de uitbesteding van werkzaamheden in verband met het verlenen van betaaldiensten dan wel de uitgifte van
      elektronisch geld draagt de betaalinstelling of de elektronischgeldinstelling er zorg voor dat uitbesteding de
      verplichtingen van de betaalinstelling, onderscheidenlijk de elektronischgeldinstelling, jegens haar cliënten en de
      rechten van haar cliënten uit hoofde van de [wet][ref1] of [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref2]
      niet wijzigt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0005290
  - number: 38k.1
    text: |-
      De [artikelen 37][ref1], [38g][ref2], [38h][ref3] en [38j][ref4] zijn slechts van toepassing op het uitbesteden
      van werkzaamheden door betaalinstellingen of elektronischgeldinstellingen voor zover het belangrijke werkzaamheden
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel38g
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel38h
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel38j
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '37'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 38g
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: 38h
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: 38j
        hoofdstuk: '6'
  - number: 38k.2
    text: |-
      Een werkzaamheid wordt als belangrijk aangemerkt indien een gebrekkige of tekortschietende uitvoering
      ervan wezenlijk afbreuk zou doen aan de naleving door de betaalinstelling of de elektronischgeldinstelling
      van de vergunningsvereisten, als bedoeld in [artikel 2:3b van de wet][ref1] respectievelijk
      [artikel 2:10b van de wet][ref2], of van andere verplichtingen ingevolge de [wet][ref3] of
      [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref4], dan wel aan haar financiële resultaten of de soliditeit of
      continuïteit van haar betaaldiensten of uitgifte van elektronisch geld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368
      [ref4]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
      - id: ref4
        bwb_id: BWBR0005290
  - number: 38l
    text: |-
      Indien een premiepensioeninstelling of pensioenbewaarder in het kader van het beheer van een pensioenvermogen
      onderscheidenlijk in het kader van de bewaring van een pensioenvermogen een of meer werkzaamheden uitbesteedt:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38l
  - number: 38l.a
    text: |-
      is de derde op ieder door de premiepensioeninstelling of de pensioenbewaarder gewenst moment in staat
      verantwoording af te leggen over de door hem uitgevoerde werkzaamheden en de premiepensioeninstelling of de
      pensioenbewaarder daar inzicht in te bieden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38l
  - number: 38l.b
    text: |-
      kan de premiepensioeninstelling of de pensioenbewaarder te allen tijde instructies omtrent de uitvoering van de
      werkzaamheden geven aan de derde en kan hij de uitbesteding met onmiddellijke ingang beëindigen indien dit in het
      belang van de pensioendeelnemers is; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38l
  - number: 38l.c
    text: |-
      is de derde, gelet op de aard van de opdracht, aantoonbaar in staat om de opdracht in overeenstemming met de wet
      te vervullen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel38l
  - number: '39'
    text: |-
      Deze paragraaf is van toepassing op financiële ondernemingen met uitzondering van beleggingsondernemingen
      waarvoor op grond van [artikel 4:17, eerste lid, van de wet][ref1] de verplichting geldt om over een interne
      klachtenprocedure te beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '40'
    text: |-
      De financiële onderneming stelt aan alle personen die binnen de onderneming betrokken zijn bij de afhandeling van
      klachten van consumenten, cliënten of deelnemers over betaaldiensten, financiële diensten of financiële producten
      van de financiële onderneming, een beschrijving beschikbaar van de te volgen procedure voor de afhandeling van
      die klachten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel40
  - number: '41.1'
    text: |-
      De financiële onderneming beschikt met het oog op een adequate behandeling van klachten als bedoeld in
      [artikel 40][ref1] over een behoorlijke administratie van klachten, waarin ten minste worden vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel40
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '40'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 41.1.a
    text: de naam en het adres van de klager;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel41
  - number: 41.1.b
    text: de klacht, met daarbij behorende dagtekening van ontvangst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel41
  - number: 41.1.c
    text: een omschrijving van de klacht;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel41
  - number: 41.1.d
    text: een beschrijving van de wijze waarop zij de klacht heeft behandeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel41
  - number: '41.2'
    text: |-
      De financiële onderneming bewaart de gegevens, bedoeld in het eerste lid, gedurende een periode van ten minste een
      jaar nadat de klacht door haar is afgehandeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel41
  - number: '42'
    text: |-
      De financiële onderneming informeert de klager bij een gehele of een gedeeltelijke afwijzing van diens klacht over
      financiële diensten of financiële producten over de mogelijkheid om de klacht voor te leggen aan de de op grond
      van [artikel 16 van de Implementatiewet buitengerechtelijke geschillenbeslechting consumenten][ref1] aangewezen
      geschilleninstantie waarbij zij is aangesloten, onder vermelding van de geldende termijnen. Daarbij wordt tevens
      vermeld dat een geschil ook direct bij een burgerlijke rechter aanhangig kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel16
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '16'
  - number: '43.1'
    text: De financiële onderneming draagt er zorg voor dat klachten binnen een redelijke termijn worden afgehandeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel43
  - number: '43.2'
    text: |-
      De financiële onderneming bevestigt de ontvangst van de klacht en bericht de klager binnen twee weken na ontvangst
      van de klacht binnen welke termijn de klacht zal worden afgehandeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel43
  - number: '43.3'
    text: |-
      De klager kan vanaf zes weken na ontvangst van de ontvangstbevestiging of acht weken na het indienen van de klacht,
      de klacht rechtstreeks voorleggen aan de de in [artikel 42][ref1] bedoelde aangewezen geschilleninstantie waarbij
      de financiële onderneming is aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel42
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '42'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '43.4'
    text: |-
      Indien de financiële onderneming voor de afwikkeling van de klacht nadere informatie nodig heeft van de klager,
      verzoekt zij deze informatie van de klager en geeft een termijn voor de beantwoording. De termijnen als bedoeld
      in het derde lid worden verlengd met de termijn voor beantwoording, of met de termijn waarbinnen de verzochte
      informatie wordt ontvangen door de financiële onderneming.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel43
  - number: '43.5'
    text: Dit artikel is niet van toepassing op betaaldienstverleners.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel43
  - number: 43a.1
    text: |-
      Een betaaldienstverlener draagt er zorg voor dat binnen een passende termijn inhoudelijk wordt gereageerd op alle
      in de klacht naar voren gebrachte punten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel43a
  - number: 43a.2
    text: |-
      Een passende termijn betreft een reactie binnen 15 werkdagen na ontvangst van de klacht; in uitzonderlijke
      situaties, vanwege redenen die de betaaldienstverlener niet verwijtbaar zijn, kan deze termijn worden verlengd tot
      uiterlijk 35 werkdagen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel43a
  - number: 43a.3
    text: |-
      Bij een verlenging van de termijn stelt de betaaldienstverlener de betaaldienstgebruiker op de hoogte en verzoekt
      om verlenging van de antwoordtermijn. De betaaldienstverlener vermeldt daarbij de reden van de vertraging en de
      termijn waarbinnen de betaaldienstgebruiker een definitieve reactie zal ontvangen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel43a
  - number: 43a.4
    text: |-
      Een betaaldienstverlener informeert de betaaldienstgebruiker over de mogelijkheid om de klacht voor te leggen aan
      de in [artikel 42][ref1] bedoelde aangewezen geschilleninstantie waarbij de betaaldienstverlener is aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel42
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '42'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 43a.5
    text: |-
      Een betaaldienstverlener stelt de informatie, bedoeld in lid 3, op een toegankelijke wijze beschikbaar
      op zijn website, in het bijkantoor en in de algemene voorwaarden van de overeenkomst gesloten tussen de
      betaaldienstverlener en de betaaldienstgebruiker.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel43a
  - number: 43a.6
    text: |-
      Dit artikel is niet van toepassing op de betaaldienstverlener die uitsluitend betaaldiensten verleent als bedoeld
      onder 8 van de bijlage bij de richtlijn betaaldiensten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel43a
  - number: '44'
    text: |-
      De financiële onderneming voorziet in procedures en maatregelen die waarborgen dat klachten van klagers zorgvuldig,
      verifieerbaar, consistent en binnen de in [artikel 43][ref1] en [43a][ref2] gestelde termijnen worden afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel43a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '43'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 43a
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 44a
    text: |-
      Voor zover een cliënt of deelnemer als bedoeld in [artikel 4:17, eerste lid, van de wet][ref1] niet tevens een
      consument is in de zin van de [Implementatiewet buitengerechtelijke geschillenbeslechting consumenten][ref2],
      geschiedt de beslechting van geschillen als bedoeld in artikel 4:17, eerste lid, onderdeel b, van de wet met
      overeenkomstige toepassing van de bepalingen van de Implementatiewet buitengerechtelijke geschillenbeslechting
      consumenten. Voorts staat de geschillenbeslechting tevens open voor cliënten, consumenten en deelnemers die buiten
      de Europese Unie woonachtig of gevestigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0036550
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0036550
  - number: '45.1'
    text: |-
      Een geschilleninstantie voldoet, in aanvulling op de uit de
      [Implementatiewet buitengerechtelijke geschillenbeslechting][ref1] voortvloeiende vereisten, tevens aan de volgende
      vereisten:


      [ref1]: https://wetten.overheid.nl/BWBR0036550
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0036550
  - number: 45.1.a
    text: |-
      de bij die geschilleninstantie aangesloten financiële ondernemingen vormen een groep van voldoende betekenis en
      veelsoortigheid of er kan aannemelijk gemaakt worden dat dit op korte termijn na erkenning het geval zal zijn;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel45
  - number: 45.1.b
    text: |-
      de geschilleninstantie draagt in voldoende mate bij tot het oplossen van geschillen die hun oorsprong vinden in
      klachten over financiële producten en diensten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel45
  - number: 45.1.c
    text: |-
      de geschilleninstantie beschikt over een adequate financieringssystematiek en realiseert een adequate
      bezettingsgraad;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel45
  - number: 45.1.d
    text: |-
      de [implementatiewet buitengerechtelijke geschillenbeslechting consumenten][ref1] en de
      [artikelen 45 tot en met 48f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036550
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel45
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0036550
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '45'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '45.2'
    text: Aan de aanwijzing van een geschilleninstantie kunnen door Onze Minister voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel45
  - number: '45.3'
    text: |-
      Onze Minister kan bij de beoordeling van een aanvraag om te worden aangewezen een uitzondering maken op het eerste
      lid, onderdeel a, indien de in dat onderdeel bedoelde groep financiële ondernemingen dezelfde financiële producten
      of financiële diensten aanbiedt en deze niet verweven zijn met andere financiële producten of financiële diensten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel45
  - number: '46.1'
    text: Een geschilleninstantie heeft een onafhankelijk en naar behoren samengesteld bestuur.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel46
  - number: '46.2'
    text: |-
      De onafhankelijkheid van het bestuur vereist ten minste dat de leden vanaf de aanvaarding van hun functie en
      gedurende een jaar voorafgaande aan de aanvaarding van hun functie niet werkzaam zijn of zijn geweest voor of enige
      functie bekleden of bekleed hebben bij een financiële onderneming of een beroepsorganisatie daarvan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel46
  - number: '46.3'
    text: |-
      De bij de benoeming van bestuursleden te volgen procedure is schriftelijk vastgelegd. De procedure wordt ter
      goedkeuring aan Onze Minister voorgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel46
  - number: '47.1'
    text: |-
      De geschilleninstantie draagt er zorg voor dat de met buitengerechtelijke geschillenbeslechting belaste personen
      vanaf de aanvaarding van hun functie en gedurende een jaar voorafgaande aan de aanvaarding van hun functie niet
      werkzaam zijn of zijn geweest voor of enige functie bekleden of bekleed hebben bij een financiële onderneming of
      beroepsorganisatie van financiële ondernemingen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel47
  - number: '47.2'
    text: |-
      De bij de benoeming van een persoon, bedoeld in het eerste lid, te volgen procedure is schriftelijk vastgelegd. De
      procedure behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel47
  - number: '48.1'
    text: |-
      Een geschilleninstantie beschikt over en handelt in overeenstemming met een reglement voor de behandeling van
      geschillen dat ten minste omvat:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.a
    text: |-
      een duidelijke omschrijving van de geschillen die ter behandeling aan de geschilleninstantie kunnen worden
      voorgelegd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.b
    text: |-
      regels met betrekking tot het aanhangig maken van een geschil en een duidelijke omschrijving van de partijen die
      een geschil aanhangig kunnen maken;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.c
    text: |-
      regels met betrekking tot wraking van een met buitengerechtelijke geschillenbeslechting belaste persoon, op grond
      van feiten of omstandigheden die een onpartijdig of onafhankelijk oordeel van die persoon zouden bemoeilijken;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.d
    text: regels met betrekking tot de behandeling van een geschil door de geschilleninstantie;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.e
    text: |-
      regels met betrekking tot het op voet van gelijkheid bieden van gelegenheid aan partijen om mondeling en
      schriftelijk, desgewenst met bijstand van derden, hun mening aan de geschilleninstantie kenbaar te maken;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.f
    text: regels met betrekking tot de voorwaarden waaronder een deskundige kan worden verzocht een advies uit te brengen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.g
    text: |-
      regels met betrekking tot de voorwaarden waaronder getuigen en deskundigen kunnen worden gehoord, dan wel
      inlichtingen van hen kunnen worden ingewonnen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.h
    text: |-
      regels met betrekking tot de mogelijkheid voor partijen om van alle door hen naar voren gebrachte feiten en
      stellingen, alsmede van verklaringen van getuigen en deskundigen, over en weer kennis te nemen en daarop te
      reageren;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.i
    text: |-
      regels met betrekking tot de voorwaarden waaronder een geschil door middel van een verkorte schriftelijke procedure
      of een voorlopig oordeel kan worden afgedaan;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.j
    text: regels op grond waarvan de geschilleninstantie haar beslissingen baseert;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.k
    text: regels met betrekking tot de mogelijkheid dat de beslechting van een geschil resulteert in een niet-bindend advies;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.l
    text: |-
      de bepaling dat de beslechting van een geschil slechts resulteert in een bindend advies indien de financiële
      onderneming daarmee uitdrukkelijk vooraf heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.m
    text: |-
      regels met betrekking tot de vaststelling van de hoogte van het bedrag dat, zo dit verschuldigd is, bij het
      aanhangig maken van het geschil dient te worden voldaan;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.n
    text: |-
      regels met betrekking tot de mogelijkheid om partijen in de kosten van de behandeling van een geschil te
      veroordelen en vaststelling van een hierbij geldend maximumbedrag;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.o
    text: |-
      regels met betrekking tot de vorm, inhoud en bekendmaking van de uitkomst van het advies, bedoeld in de onderdelen
      k en l, waarbij in ieder geval is bepaald dat deze uitkomst, met redenen omkleed, ondertekend en schriftelijk aan
      partijen wordt medegedeeld; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48.1.p
    text: |-
      indien beroep tegen een uitspraak mogelijk is: regels met betrekking tot het mededelen van de mogelijkheid van
      beroep, de wijze en termijn van het instellen, alsmede de behandeling van dit beroep.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: '48.2'
    text: |-
      De geschilleninstantie houdt het reglement, bedoeld in het eerste lid, beschikbaar en verstrekt het kosteloos op
      verzoek aan iedere belanghebbende.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48
  - number: 48a
    text: |-
      Een geschilleninstantie kan voorgenomen wijzigingen in de samenstelling van het bestuur, de de voorzitters van
      organen belast met buitengewone geschillenbeslechting of het reglement, bedoeld in [artikel 48][ref1], niet
      doorvoeren dan na instemming van Onze Minister. Bij voorgenomen wijzigingen in de samenstelling van het bestuur
      of de de voorzitters van organen belast met buitengewone geschillenbeslechting vermeldt de geschilleninstantie de
      leeftijd, genoten opleidingen en professionele achtergrond van de nieuwe leden.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel48
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '48'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 48d
    text: |-
      Een erkende geschilleninstantie stelt aan een financiële onderneming die zich bij haar wil aansluiten niet als
      voorwaarde voor aansluiting dat de financiële onderneming andere regels naleeft dan die welke betrekking hebben
      op het aanhangig maken van een geschil bij de geschilleninstantie of de verdere behandeling van een geschil door
      de geschilleninstantie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48d
  - number: 48e
    text: |-
      Een geschilleninstantie publiceert de bindende adviezen, bedoeld in [artikel 48, eerste lid, onderdeel i][ref1], en
      houdt deze elektronisch beschikbaar en algemeen toegankelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel48
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '48'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 48f.1
    text: |-
      Een geschilleninstantie verstrekt aan Onze Minister jaarlijks voor 1 juli een opgave van de in het afgelopen
      kalenderjaar bij de geschilleninstantie aangesloten financiële ondernemingen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48f
  - number: 48f.2
    text: |-
      Een geschilleninstantie verstrekt aan Onze Minister op diens verzoek de gegevens en inlichtingen die Onze Minister
      nodig heeft voor de uitoefening van diens in deze paragraaf omschreven taken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48f
  - number: 48f.3
    text: |-
      Een geschilleninstantie verstrekt de Autoriteit Financiële Markten en de Nederlandsche Bank de gegevens en
      inlichtingen die zij nodig hebben voor de uitoefening van hun taken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48f
  - number: 48f.4
    text: |-
      Een geschilleninstantie stelt jaarlijks een begroting op en zendt deze voor 1 december van het aan het
      begrotingsjaar voorafgaande jaar ter instemming aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48f
  - number: 48f.5
    text: |-
      Een geschilleninstantie stelt jaarlijks een bestuursverslag en een jaarrekening op. De jaarrekening gaat vergezeld
      van een verklaring omtrent de getrouwheid, afgegeven door een door de geschilleninstantie aangewezen accountant.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48f
  - number: 48f.6
    text: |-
      Een geschilleninstantie zendt de jaarrekening voor 1 mei van het op het boekjaar volgende jaar ter instemming aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48f
  - number: 48f.7
    text: |-
      De evaluatie die een geschilleninstantie ingevolge
      [artikel 18, onderdeel h, van de Implementatiewet buitengerechtelijke geschillenbeslechting][ref1] aan Onze
      Minister verstrekt wordt ten minste iedere vier jaar uitgevoerd door een onafhankelijke onderzoeksinstantie. De
      aangewezen geschilleninstantie voert periodiek een klanttevredenheidsonderzoek uit.


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel18
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '18'
  - number: 48f.8
    text: |-
      Onze minister kan de termijn van vier jaar, bedoeld in het zevende lid, verkorten en, op kosten van de
      geschilleninstantie, het opdrachtgeverschap van het evaluatieonderzoek, bedoeld in het zevende lid, overnemen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel48f
  - number: '49.1'
    text: |-
      Een financiële onderneming verstrekt de ingevolge deze afdeling en de
      [artikelen 4:25a, eerste lid, onderdeel a][ref1], en [4:25b, eerste en tweede lid, van de wet][ref2] aan de
      consument of cliënt te verstrekken informatie schriftelijk, tenzij in deze afdeling anders wordt bepaald. De
      financiële onderneming kan de informatie via een andere duurzame drager verstrekken, indien zij zich ervan heeft
      vergewist dat de consument onderscheidenlijk cliënt over de benodigde middelen beschikt om kennis te nemen van de
      aldus te verstrekken informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '49.2'
    text: |-
      De financiële onderneming verstrekt de informatie, bedoeld in het eerste lid, in de Nederlandse taal. De informatie
      kan in een andere taal worden verstrekt:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49
  - number: 49.2.a
    text: indien de consument of cliënt daarom verzoekt en de financiële onderneming hiermee heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49
  - number: 49.2.b
    text: |-
      indien partijen een keuze hebben gemaakt voor de toepasselijkheid van het recht van een andere staat op de
      overeenkomst inzake een financieel product; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49
  - number: 49.2.c
    text: |-
      indien het essentiële beleggersinformatie betreft en het gebruik van de desbetreffende taal door de Autoriteit
      Financiële Markten is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49
  - number: '49.3'
    text: 'Het eerste en tweede lid zijn niet van toepassing op het verstrekken van informatie met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49
  - number: 49.3.a
    text: het verlenen van beleggingsdiensten; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49
  - number: 49.3.b
    text: het verlenen van financiële diensten met betrekking tot een verzekering.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49
  - number: 49a.1
    text: |-
      Een verzekeraar, adviseur, bemiddelaar in verzekeringen, gevolmachtigde agent of ondergevolmachtigde agent
      verstrekt de ingevolge deze afdeling en de [artikelen 4:20, eerste en derde lid][ref1], [4:22, eerste lid][ref2],
      en [4:25b, eerste en tweede lid, van de wet][ref3] aan de cliënt te verstrekken informatie schriftelijk en
      kosteloos, tenzij in deze afdeling of die artikelen anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 49a.2
    text: |-
      De financiëledienstverlener kan na uitdrukkelijke toestemming van de cliënt en indien dit past in de context waarin
      hij met de cliënt zaken doet, de informatie op een andere duurzame drager verstrekken.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49a
  - number: 49a.3
    text: |-
      De financiëledienstverlener verstrekt de informatie, bedoeld in het eerste lid, in de Nederlandse taal of in de
      taal waar het risico is gelegen of in elke andere taal die door partijen is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49a
  - number: 49a.4
    text: |-
      De financiëledienstverlener kan, na toestemming van de cliënt, de ingevolge deze
      afdeling en de [artikelen 4:20, eerste en derde lid][ref1], [4:22, eerste lid][ref2], en
      [4:25b, eerste en tweede lid, van de wet][ref3] te verschaffen informatie die niet persoonlijk tot de cliënt is
      gericht via haar website verstrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 49a.4.a
    text: het gebruik van de website past in de context waarin hij met de cliënt zaken doet;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49a
  - number: 49a.4.b
    text: |-
      de cliënt elektronisch op de hoogte wordt gesteld van het adres van de website en de plaats op de website waar de
      informatie kan worden verkregen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49a
  - number: 49a.4.c
    text: de informatie actueel is en, zolang dat voor de cliënt van belang is, op de website toegankelijk blijft.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49a
  - number: 49a.5
    text: |-
      De verstrekking van informatie door de financiëledienstverlener aan de cliënt via een andere duurzame drager dan
      papier of via een website past in de context waarin de financiëledienstverlener met de cliënt zaken doet, indien is
      bewezen dat de cliënt regelmatig toegang heeft tot internet. Het gegeven dat de cliënt een e-mailadres opgeeft om
      zaken te kunnen doen geldt in ieder geval als bewijs hiervan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49a
  - number: 49a.6
    text: |-
      Een financiëledienstverlener verstrekt informatie die aan de cliënt via een andere duurzame drager dan papier of
      via een website is verstrekt op verzoek schriftelijk en kosteloos aan de cliënt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49a
  - number: 49.0b.1
    text: |-
      Een beleggingsonderneming verstrekt de ingevolge deze afdeling en de
      [artikelen 4:25a, eerste lid, onderdeel a][ref1], en [4:25b, eerste en tweede lid, van de wet][ref2] aan de cliënt
      te verstrekken informatie via een andere duurzame drager dan papier.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49.0b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 49.0b.2
    text: |-
      De beleggingsonderneming deelt een niet-professionele belegger mede dat hij de mogelijkheid heeft om de informatie
      op papier te ontvangen in plaats van via een andere duurzame drager.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49.0b
  - number: 49.0b.3
    text: |-
      In afwijking van het eerste lid verstrekt de beleggingsonderneming de informatie op papier en kosteloos op verzoek
      van een niet-professionele belegger.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49.0b
  - number: 49.0b.4
    text: |-
      De beleggingsonderneming deelt een bestaande niet-professionele belegger ten minste acht weken voordat zij de
      informatie, bedoeld in het eerste lid, op een andere duurzame drager dan papier zal verstrekken mee dat hij de
      informatie via een andere duurzame drager dan papier zal ontvangen. Daarbij geeft de beleggingsonderneming aan dat
      de niet-professionele belegger de keuze heeft om de informatie op papier te blijven ontvangen of de informatie te
      ontvangen via een andere duurzame drager dan papier.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49.0b
  - number: 49.0b.5
    text: |-
      In aanvulling op het vierde lid deelt de beleggingsonderneming de bestaande niet-professionele belegger mee dat
      de informatie via een andere duurzame drager dan papier zal worden verstrekt indien de niet-professionele belegger
      niet binnen de termijn van acht weken heeft aangegeven de informatie op papier te willen blijven ontvangen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49.0b
  - number: 49b
    text: |-
      Een cliënt die als niet-professionele belegger is gekwalificeerd, kan door een beleggingsonderneming of beheerder
      van een beleggingsinstelling op schriftelijk verzoek als professionele belegger worden behandeld indien is voldaan
      aan het in [artikel 4:18c van de wet][ref1] bepaalde, en:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 49b.a
    text: |-
      de beleggingsonderneming of beheerder van een beleggingsinstelling de cliënt schriftelijk waarschuwt voor het
      lagere beschermingsniveau en het niet van toepassing zijn van het beleggerscompensatiestelsel; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49b
  - number: 49b.b
    text: |-
      de cliënt in een afzonderlijk document bevestigt dat hij zich bewust is van de gevolgen die aan het lagere
      beschermingsniveau verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel49b
  - number: '50.1'
    text: 'Een beheerder van een icbe houdt de volgende gegevens beschikbaar op zijn website:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
  - number: 50.1.a
    text: |-
      de gegevens omtrent hemzelf, de door hem beheerde icbe’s en de bewaarders die aan de icbe’s zijn verbonden welke
      ingevolge enig wettelijk voorschrift in het handelsregister moeten worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
  - number: 50.1.b
    text: |-
      de overeenkomst, bedoeld in [artikel 4:62m, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 50.1.c
    text: zijn vergunning; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
  - number: 50.1.d
    text: |-
      elk door de Autoriteit Financiële Markten genomen geldend besluit tot ontheffing van het ingevolge deze wet
      bepaalde met betrekking tot hemzelf, de door hem beheerde icbe’s en de eventueel daaraan verbonden bewaarder.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
  - number: '50.2'
    text: |-
      Een beheerder van een icbe publiceert ten behoeve van de deelnemers in een door hem beheerde icbe maandelijks
      een opgave met toelichting van de hierna te noemen gegevens op zijn website, waarbij tussen de tijdstippen van
      opstelling een periode van ten minste een week ligt. De opgave is, indien van toepassing, mede door de bewaarder
      van een icbe ondertekend en bevat ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
  - number: 50.2.a
    text: de totale waarde van de beleggingen van de icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
  - number: 50.2.b
    text: een overzicht van de samenstelling van de beleggingen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
  - number: 50.2.c
    text: het aantal uitstaande rechten van deelneming; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
  - number: 50.2.d
    text: |-
      de meest recente bepaalde intrinsieke waarde van de rechten van deelneming, onder vermelding van het moment waarop
      de bepaling van de intrinsieke waarde plaatsvond.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
  - number: '50.3'
    text: |-
      Een beleggingsinstelling met zetel in een aangewezen staat waarvan de rechten van deelneming op verzoek van de
      deelnemers ten laste van de activa direct of indirect worden ingekocht of terugbetaald, deelt desgevraagd aan ieder
      de intrinsieke waarde van de rechten van deelneming mee. De intrinsieke waarde wordt bepaald op het meest recente
      moment van in- en uittreden van deelnemers in de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
  - number: '50.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op beheerders van icbe’s met zetel in een andere lidstaat
      voor zover het gaat om de soort informatieverschaffing aan de deelnemers.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel50
  - number: '51.1'
    text: |-
      Een beleggingsonderneming of bank deelt aan een ieder die een gerechtvaardigd belang heeft op verzoek mede
      aan welke systemen als bedoeld in [artikel 212a van de Faillissementswet][ref1] de beleggingsonderneming
      onderscheidenlijk de bank deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
  - number: '51.2'
    text: |-
      Een beleggingsonderneming of bank verstrekt aan een ieder die een gerechtvaardigd belang heeft op
      verzoek informatie over de belangrijkste regels die gelden voor de werking van de systemen bedoeld in
      [artikel 212a van de Faillissementswet][ref1], waaraan de beleggingsonderneming onderscheidenlijk de bank
      deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
  - number: '51.3'
    text: Het eerste en tweede lid zijn niet van toepassing op beleggingsondernemingen met zetel in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51
  - number: 51.0.1
    text: |-
      Een betaaldienstverlener stelt de informatie, bedoeld in artikel 106 van de richtlijn betaaldiensten, op een
      toegankelijke wijze beschikbaar op zijn website en op papier bij zijn bijkantoren, betaaldienstagenten en
      entiteiten waaraan de betaaldienstverlener werkzaamheden uitbesteedt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51.0
  - number: 51.0.2
    text: Voor het verstrekken van informatie ingevolge dit artikel worden geen kosten in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51.0
  - number: 51a.1
    text: |-
      Een beleggingsonderneming verleent geen beleggingsdienst aan een cliënt dan nadat de desbetreffende cliënt ervan in
      kennis is gesteld dat telefoongesprekken, elektronische communicatie of gesprekken tussen de beleggingsonderneming
      en de cliënt die gericht zijn op het verrichten van transacties, zullen worden opgenomen of vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51a
  - number: 51a.2
    text: |-
      De beleggingsonderneming verstrekt op verzoek aan een cliënt de opnames of verslagen van de gesprekken, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51a
  - number: 51b
    text: |-
      Een aanbieder van hypothecair krediet heeft op zijn website of op papier of een andere duurzame drager ten minste
      de volgende algemene informatie beschikbaar met betrekking tot het op dat moment aangeboden hypothecair krediet:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.a
    text: zijn naam en adres en, indien de aanbieder een rechtspersoon is, de statutaire naam en handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.b
    text: de doeleinden waarvoor het krediet gebruikt mag worden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.c
    text: |-
      de vormen van zekerheid alsmede, indien van toepassing, de vermelding dat de zekerheid zich ook in een andere
      lidstaat mag bevinden;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.d
    text: de mogelijke duur van de overeenkomsten inzake hypothecair krediet;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.e
    text: |-
      de actuele vaste debetrentevoet bij de mogelijke rentevastperiodes en, indien van toepassing, de variabele
      debetrentevoet, met een beschrijving van de kenmerken van een vaste debetrentevoet en variabele debetrentevoet en
      de gevolgen daarvan voor consumenten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.f
    text: |-
      indien kredieten worden aangeboden die een debetrentevoet gebruiken die gebaseerd is op een benchmark als bedoeld
      in artikel 3, eerste lid, onderdeel 3, van de verordening financiële benchmarks: de namen van de benchmarks en de
      beheerders daarvan, alsmede de mogelijke gevolgen voor de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.g
    text: |-
      indien leningen in vreemde valuta beschikbaar zijn, de vermelding van de vreemde valuta, met een toelichting van de
      gevolgen voor de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.h
    text: |-
      een representatief voorbeeld van het totale kredietbedrag, de totale kosten van het krediet voor de consument, het
      totale door de consument te betalen bedrag en het jaarlijks kostenpercentage;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.i
    text: |-
      een indicatie van de mogelijke bijkomende kosten die ter zake van een hypothecair krediet vereist zijn, die geen
      onderdeel zijn van de totale kosten van een krediet voor de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.j
    text: |-
      de verschillende mogelijkheden voor het aflossen van het krediet, met inbegrip van het aantal, de periodiciteit en
      het bedrag van de termijnen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.k
    text: |-
      indien van toepassing, een toelichting dat de naleving van de kredietovereenkomst niet hoeft te betekenen dat het
      totale krediet aan het einde van de looptijd is afgelost;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.l
    text: een beschrijving van de voorwaarden met betrekking tot vervroegde aflossing;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.m
    text: |-
      of een waardebepaling van het onroerend goed vereist is om het hypothecair krediet te verkrijgen, of de consument
      deze waardebepaling moet laten uitvoeren en of daaraan kosten zijn verbonden voor de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: 51b.n
    text: |-
      een indicatie van de nevendiensten bedoeld in [artikel 4:18, derde lid, van de wet][ref1] die de consument dient
      af te nemen teneinde het krediet, onder de geadverteerde voorwaarden te verkrijgen, en indien van toepassing, een
      vermelding dat de nevendiensten kunnen worden afgenomen bij een andere financiëledienstverlener;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 51b.o
    text: |-
      een waarschuwing betreffende de gevolgen van niet-naleving van de aan de kredietovereenkomst verbonden
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel51b
  - number: '52.1'
    text: |-
      Indien een financiële onderneming in een reclame-uiting, anders dan via de televisie of de radio, informatie
      verstrekt over een derdepijlerpensioenproduct en complex product voorzover het een verzekering met een
      beleggingscomponent of verpakt retailbeleggingsproduct is, verstrekt zij daarbij informatie over de belangrijkste
      financiële risico’s van dat product, die onder meer inzichtelijk worden gemaakt door een risico-indicator en,
      indien het een beleggingsobject betreft, de belangrijkste overige risico’s die samenhangen met dat product.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel52
  - number: '52.2'
    text: |-
      Indien een financiële onderneming in een reclame-uiting via de televisie informatie verstrekt over een
      derdepijlerpensioenproduct en complex product voorzover het een verzekering met een beleggingscomponent of verpakt
      retailbeleggingsproduct is, verstrekt zij daarbij informatie over de belangrijkste financiële risico’s van dat
      product door het weergeven van een risico-indicator en, indien het een beleggingsobject betreft, de belangrijkste
      overige risico’s die samenhangen met dat product.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel52
  - number: '52.3'
    text: |-
      Indien een financiële onderneming in een reclame-uiting via de radio informatie verstrekt over een
      derdepijlerpensioenproduct en complex product voorzover het een verzekering met een beleggingscomponent of verpakt
      retailbeleggingsproduct is, verstrekt zij daarbij informatie over de belangrijkste financiële risico’s van dat
      product en, indien het een beleggingsobject betreft, de belangrijkste overige risico’s die samenhangen met dat
      product.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel52
  - number: '52.4'
    text: |-
      Indien een financiële onderneming voorafgaand aan de totstandkoming van een overeenkomst inzake een
      derdepijlerpensioenproduct informatie verstrekt over dat product, verwijst zij naar het essentiële-
      informatiedocument voor pensioenproducten of, indien het rechten van deelneming in een icbe betreft, naar de
      essentiële-informatiedocument.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel52
  - number: '52.5'
    text: |-
      Indien een financiële onderneming voorafgaand aan de totstandkoming van een overeenkomst inzake een
      derdepijlerpensioenproduct en complex product voorzover het een verzekering met een beleggingscomponent of
      verpakt retailbeleggingsproduct is, anders dan in een reclame-uiting via de televisie of de radio, informatie
      verstrekt over een werkelijk of toekomstig rendement, verstrekt zij daarbij informatie over de belangrijkste
      kosten en de belangrijkste financiële risico’s van dat product en, indien het een beleggingsobject betreft, over de
      belangrijkste overige risico’s die samenhangen met dat product.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel52
  - number: '52.6'
    text: |-
      Indien een financiële onderneming in een reclame-uiting via de televisie of de radio informatie verstrekt over
      een werkelijk of toekomstig rendement van een derdepijlerpensioenproduct en complex product voorzover het een
      verzekering met een beleggingscomponent of verpakt retailbeleggingsproduct is, verstrekt zij daarbij of op
      enig ander moment voorafgaande aan de totstandkoming van een overeenkomst inzake dat product informatie over de
      belangrijkste kosten van dat product.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel52
  - number: '52.7'
    text: |-
      Indien een financiële onderneming voorafgaande aan de totstandkoming van een overeenkomst inzake een complex
      product informatie verstrekt over een gegarandeerd rendement, verstrekt zij daarbij of, indien de informatie wordt
      verstrekt in een reclame-uiting, op enig ander moment voorafgaande aan de totstandkoming van de overeenkomst inzake
      dat product, informatie over de belangrijkste voorwaarden van die garantie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel52
  - number: '52.8'
    text: |-
      [Artikel 49, eerste lid, eerste volzin][ref1], is niet van toepassing op het verstrekken van informatie in een
      reclame-uiting als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel49
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
  - number: '52.9'
    text: |-
      Het eerste tot en met achtste lid zijn niet van toepassing indien het een complex product betreft, niet zijnde
      een recht van deelneming in een beleggingsinstelling of icbe, ten aanzien waarvan uitsluitend financiële diensten
      worden verleend aan personen die handelen in de uitoefening van hun bedrijf of beroep.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel52
  - number: '52.10'
    text: |-
      Het eerste lid, met uitzondering van de verplichting om een risico-indicator te verstrekken, en het derde tot
      en met zevende lid, zijn niet van toepassing op beleggingsondernemingen voor zover zij beleggingsdiensten of
      nevendiensten verlenen met betrekking tot deelnemingsrechten in beleggingsinstellingen of icbe's.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel52
  - number: '52.11'
    text: |-
      Voor de toepassing van dit artikel wordt onder verpakt retailbeleggingsproduct verstaan: een verpakt
      retailbeleggingsproduct als bedoeld in artikel 4, eerste lid, van de verordening essentiële-informatiedocumenten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel52
  - number: '53.1'
    text: |-
      Indien een financiële onderneming in een reclame-uiting over krediet melding maakt van een debetrentevoet of andere
      gegevens betreffende de kosten van een krediet, verstrekt zij daarbij tevens informatie over:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.1.a
    text: |-
      de vaste of variabele debetrentevoet en de andere kosten die deel uitmaken van de totale kosten van het krediet
      voor de consument;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.1.b
    text: het totale kredietbedrag;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.1.c
    text: het jaarlijks kostenpercentage;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.1.d
    text: |-
      de identiteit en het adres van de aanbieder van krediet of van de bemiddelaar inzake krediet; en, indien van
      toepassing,
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.1.e
    text: de duur van de kredietovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.1.f
    text: |-
      in geval van goederenkrediet, de contante waarde en contante betalingen, genoemd in de definitie van kredietsom
      in [artikel 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 53.1.g
    text: het totale door de consument te betalen bedrag;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.1.h
    text: het aantal termijnen en de termijnbedragen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.1.i
    text: |-
      in geval van hypothecair krediet, dat de kredietovereenkomst gewaarborgd wordt door een hypotheek of vergelijkbare
      zekerheid, danwel een recht op voor bewoning bestemde onroerende zaken en in voorkomend geval een waarschuwing dat
      schommelingen van de wisselkoers van invloed kunnen zijn op het door de consument te betalen bedrag.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '53.2'
    text: |-
      Indien het sluiten van een overeenkomst voor een nevendienst verplicht is om het krediet op de in de reclame-uiting
      genoemde voorwaarden te verkrijgen, en de kosten voor die nevendienst vooraf niet kunnen worden bepaald, wordt de
      verplichting tot het sluiten van die overeenkomst op een duidelijke, beknopte en opvallende wijze, tezamen met het
      jaarlijks kostenpercentage vermeld.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '53.3'
    text: |-
      De informatie, bedoeld in het eerste lid, heeft alleen betrekking op kredieten die representatief zijn voor de
      kredieten die feitelijk door de financiële onderneming worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '53.4'
    text: |-
      Een financiële onderneming geeft de informatie, bedoeld in het eerste lid, en de vermelding, bedoeld in het
      tweede lid, indien deze wordt verstrekt in een reclame-uiting over krediet, anders dan via de televisie of radio,
      gecombineerd weer in een tabel waarin geen andere informatie wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '53.5'
    text: |-
      Indien een financiële onderneming in een reclame-uiting over krediet reclame maakt voor met krediet aan te schaffen
      goederen of diensten, verstrekt zij daarbij de informatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '53.6'
    text: |-
      Indien een reclame-uiting betrekking heeft op een krediet met een debetrentevoet die voor een beperkte duur of
      een beperkt deel van het krediet geldt, wordt bij het verstrekken van de informatie, bedoeld in het eerste lid,
      onderdeel a, de hoogste debetrentevoet in aanmerking genomen. Bij een krediet met een variabele debetrentevoet die
      voor beperkte duur of een beperkt deel van het krediet afwijkt van de variabele debetrentevoet die op het moment
      van het doen van de reclame-uiting geldt voor overeenkomsten over krediet van gelijke soort, omvang en duur, wordt
      bij het verstrekken van de informatie, bedoeld in het eerste lid, onderdeel a, de hoogste van genoemde variabele
      debetrentevoeten genoemd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '53.7'
    text: |-
      Een financiële onderneming neemt in een reclame-uiting over krediet een waarschuwing op met betrekking tot de
      gevolgen die aan het krediet zijn verbonden, tenzij het een reclame-uiting voor hypothecair krediet betreft waarbij
      geen relatie met een ander bestedingsdoel wordt gelegd dan de verwerving van de eigen woning.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '53.8'
    text: |-
      Een financiële onderneming neemt in een reclame-uiting over hypothecair krediet met een variabele debetrentevoet
      een waarschuwing op met betrekking tot de risico’s die aan een dergelijk krediet zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '53.9'
    text: 'Een financiële onderneming:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.9.a
    text: |-
      neemt in een reclame-uiting over krediet geen mededelingen op die gericht zijn op het gemak of de snelheid waarmee
      het krediet wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.9.b
    text: |-
      brengt in een reclame-uiting over krediet niet tot uiting dat lopende overeenkomsten inzake krediet bij de
      beoordeling van een kredietaanvraag geen of een ondergeschikte rol spelen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.9.c
    text: |-
      brengt in een reclame-uiting over krediet niet tot uiting dat met een negatieve uitkomst van de raadpleging van het
      stelsel van kredietregistratie of anderszins in afwijking van de geldende gedragscode toch een krediet kan worden
      verkregen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.9.d
    text: |-
      geeft in een reclame-uiting over krediet geen kenmerken van het krediet weer waarin fiscale voordelen zijn
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '53.10'
    text: |-
      Indien een financiële onderneming in een reclame-uiting informatie als bedoeld in het eerste of tweede lid
      of informatie over een specifiek product verstrekt over een krediet, verstrekt zij daarbij informatie over de
      verkrijgbaarheid van de informatie, bedoeld in [artikel 4:33, eerste lid, van de wet][ref1]. De eerste volzin is
      niet van toepassing op reclame-uitingen over krediet, voorzover het krediet onderdeel uitmaakt van een complex
      product.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '53.11'
    text: |-
      Indien een financiële onderneming informatie verstrekt over de kenmerken van het krediet, bedoeld in het eerste lid
      en tweede lid, is het vierde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '53.12'
    text: |-
      [Artikel 49, eerste lid, eerste volzin][ref1], is niet van toepassing op het verstrekken van informatie in een
      reclame-uiting als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel49
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '49'
        hoofdstuk: '8'
        paragraaf: 8.1.1
        afdeling: '8.1'
  - number: '53.13'
    text: |-
      Indien een financiële onderneming in een reclame-uiting over effectenkrediet melding maakt van een debetrentevoet
      of andere gegevens betreffende de kosten van een effectenkrediet, meldt zij tevens:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.13.a
    text: |-
      dat een doorlopend krediet wordt verleend of toegezegd tegen onderpand van financiële instrumenten, en de
      kredietlimiet afhankelijk is van de waarde daarvan;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.13.b
    text: |-
      de vaste of variabele debetrentevoet en de andere kosten die deel uitmaken van de totale kosten van het
      effectenkrediet; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.13.c
    text: |-
      indien een contract voor een nevendienst verplicht is om het effectenkrediet, in voorkomend geval op de
      geadverteerde voorwaarden te verkrijgen, en de kosten van die dienst niet vooraf bepaald kunnen worden, de
      verplichting tot het sluiten van die overeenkomst op een duidelijke, beknopte en opvallende wijze,
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '53.14'
    text: |-
      Onverminderd het eerste tot en met twaalfde lid meldt een bemiddelaar in krediet in een reclame-uiting over krediet
      tevens dat hij:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.14.a
    text: adviseert op grond van een objectieve analyse;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.14.b
    text: een contractuele verplichting heeft uitsluitend voor een of meer aanbieders te bemiddelen; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: 53.14.c
    text: |-
      geen contractuele verplichting heeft uitsluitend voor een of meer aanbieders te bemiddelen en hij niet adviseert op
      grond van een objectieve analyse.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel53
  - number: '54'
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de wijze waarop de informatie, bedoeld in de
      [artikelen 52][ref1] en [53][ref2], wordt gepresenteerd of geformuleerd, de wijze van berekening van werkelijke of
      toekomstige rendementen, kosten en risico’s als bedoeld in artikel 52, eerste, tweede, derde, vijfde en zesde lid,
      en de wijze van berekening van kosten en het bepalen van een representatief krediet als bedoeld in artikel 53.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel53
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '52'
        hoofdstuk: '8'
        paragraaf: 8.1.3
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '53'
        hoofdstuk: '8'
        paragraaf: 8.1.3
        afdeling: '8.1'
  - number: '55.1'
    text: |-
      In een reclame-uiting over een beheerder van een beleggingsinstelling, beleggingsinstelling, beheerder van een icbe
      of icbe worden in ieder geval vermeld:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel55
  - number: 55.1.a
    text: de naam van de beheerder van een beleggingsinstelling, beleggingsinstelling, beheerder van een icbe of icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel55
  - number: 55.1.b
    text: |-
      het feit dat het een beheerder van een beleggingsinstelling, beleggingsinstelling, beheerder van een icbe of icbe
      betreft;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel55
  - number: 55.1.c
    text: |-
      dat de beheerder van een beheerder van een beleggingsinstelling, beleggingsinstelling, beheerder van een icbe of
      icbe is opgenomen in het register dat wordt gehouden door de Autoriteit Financiële Markten; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel55
  - number: 55.1.d
    text: |-
      indien het een icbe betreft: waar het prospectus, bedoeld in [artikel 4:49, eerste lid, van de wet][ref1],
      verkrijgbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '55.2'
    text: Het eerste lid, onderdelen c en d, is niet van toepassing op reclame-uitingen op radio en televisie.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel55
  - number: '55.3'
    text: |-
      Onverminderd [artikel 52][ref1] wordt in een reclame-uiting anders dan via de televisie of radio over een icbe,
      indien van toepassing, duidelijk de aandacht gevestigd op het feit dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel52
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '52'
        hoofdstuk: '8'
        paragraaf: 8.1.3
        afdeling: '8.1'
  - number: 55.3.a
    text: de icbe voornamelijk belegt in financiële derivaten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel55
  - number: 55.3.b
    text: de icbe een aandelen- of obligatie-index volgt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel55
  - number: 55.3.c
    text: de waarde van de activa van de icbe als gevolg van het beleggingsbeleid sterk kan fluctueren; of
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel55
  - number: 55.3.d
    text: |-
      aan de icbe een ontheffing als bedoeld in [artikel 136, tweede lid][ref1], is verleend onder vermelding van
      de staat, het openbaar lichaam of de internationale organisatie die de financiële instrumenten, bedoeld in het
      [artikel 136, tweede lid][ref2], uitgeeft of garandeert waarin de icbe voor meer dan vijfendertig procent van het
      beheerde vermogen belegt.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel136
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '136'
        hoofdstuk: '10'
        paragraaf: 10.3.2
        afdeling: '10.3'
  - number: '56'
    text: |-
      De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot de vorm van waarschuwingszinnen in
      reclame-uitingen van beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel56
  - number: '57.1'
    text: |-
      Een financiëledienstverlener verstrekt een consument of, indien het een verzekering betreft, cliënt, voorafgaand
      aan de totstandkoming van een overeenkomst inzake een financieel product of financiële dienst ten minste de
      volgende informatie:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel57
  - number: 57.1.a
    text: |-
      zijn naam en adres en, indien de financiëledienstverlener een rechtspersoon is, de statutaire naam en handelsnaam
      of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel57
  - number: 57.1.b
    text: de aard van zijn financiële dienstverlening;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel57
  - number: 57.1.c
    text: |-
      voorzover [artikel 4:17 van de wet][ref1] van toepassing is: zijn interne klachtenprocedure, bedoeld in artikel
      4:17, eerste lid, onderdeel a, van de wet, en de erkende geschilleninstantie waarbij hij is aangesloten; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 57.1.d
    text: zijn inschrijving in het door de toezichthouder gehouden register.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel57
  - number: '57.2'
    text: |-
      Een bemiddelaar in hypothecair krediet, adviseur, bemiddelaar in verzekeringen, gevolmachtigde agent of
      ondergevolmachtigde agent verstrekt de consument in aanvulling op de informatie bedoeld in het eerste lid,
      onderdeel d, gegevens aan de hand waarvan deze inschrijving kan worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel57
  - number: '58.1'
    text: |-
      Een beleggingsonderneming verstrekt voorafgaand aan het verlenen van een beleggingsdienst of nevendienst aan
      een niet-professionele belegger informatie over de beleggingsdienst of nevendienst, financiële instrumenten, de
      voorgestelde beleggingsstrategieën, plaatsen van uitvoering en alle kosten en bijbehorende lasten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58
  - number: '58.2'
    text: |-
      Een beleggingsonderneming verstrekt voorafgaand aan het beheren van een individueel vermogen of advies over
      financiële instrumenten aan een professionele belegger informatie over alle kosten en bijbehorende lasten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58
  - number: '58.3'
    text: |-
      De informatie over de financiële instrumenten en voorgestelde beleggingsstrategieën, bedoeld in het eerste lid,
      omvat een toelichting en waarschuwing over de risico’s verbonden aan de desbetreffende financiële instrumenten of
      beleggingsstrategieën en voor welke doelgroep de financiële instrumenten bedoeld zijn.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58
  - number: '58.4'
    text: |-
      De informatie over alle kosten en bijbehorende lasten als bedoeld in het eerste lid omvat alle kosten en
      bijbehorende lasten voor het verlenen van beleggingsdiensten of nevendiensten en, in voorkomend geval, de kosten
      van het desbetreffende financieel instrument en de wijze waarop de cliënt kan betalen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58
  - number: '58.5'
    text: |-
      De informatie over alle kosten en bijbehorende lasten in verband met de dienst en het financieel instrument,
      die niet het gevolg zijn van de ontwikkeling van onderliggende marktrisico’s, wordt samengevoegd zodat de cliënt
      inzicht krijgt in de totale kosten, en mede in het cumulatieve effect van de kosten op het rendement en omvat,
      indien de cliënt hierom verzoekt, een puntsgewijze uitsplitsing van de kosten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58
  - number: '58.6'
    text: |-
      Indien een beleggingsdienst samen met een andere dienst of een ander product wordt aangeboden als pakket of als
      voorwaarde waarvan de overeenkomst of dat pakket afhankelijk wordt gesteld, deelt de beleggingsonderneming aan de
      cliënt mee of het mogelijk is de diensten of producten afzonderlijk te kopen en informeert zij de cliënt over de
      kosten van elke afzonderlijke dienst of elk afzonderlijk product.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58
  - number: '58.7'
    text: |-
      Indien aangenomen mag worden dat de risico’s die voortvloeien uit het pakket of de overeenkomst, bedoeld in het
      vijfde lid, verschillen van de risico’s die verbonden zijn aan elke financiële dienst of elk financieel product
      afzonderlijk, verstrekt de beleggingsonderneming aan de niet-professionele belegger een adequate beschrijving van
      de verschillende financiële diensten en financiële producten en de wijze waarop de wisselwerking daartussen de
      risico’s wijzigt.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58
  - number: 58a.1
    text: 'De beleggingsonderneming informeert de cliënt voorafgaand aan het advies over financiële instrumenten of:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58a
  - number: 58a.1.a
    text: het advies op afhankelijke of onafhankelijke basis wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58a
  - number: 58a.1.b
    text: |-
      of het advies op een brede dan wel beperktere analyse van verschillende soorten financiële instrumenten is
      gebaseerd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58a
  - number: 58a.1.c
    text: |-
      de cliënt een periodieke beoordeling ontvangt van de geschiktheid van de financiële instrumenten die de
      beleggingsonderneming aan de cliënt heeft geadviseerd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58a
  - number: 58a.2
    text: |-
      Indien een beleggingsonderneming aan een niet-professionele belegger meedeelt dat hij een periodieke beoordeling
      als bedoeld in het eerste lid, onderdeel c, ontvangt, verstrekt de beleggingsonderneming een bijgewerkte
      geschiktheidsverklaring als bedoeld in [artikel 4:23, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 58a.3
    text: 'Indien een beleggingsonderneming onafhankelijk adviseert over financiële instrumenten:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58a
  - number: 58a.3.a
    text: |-
      beoordeelt zij een toereikend aantal op de markt verkrijgbare financiële instrumenten die voldoende divers zijn
      wat type, uitgevende instelling of aanbieder betreft zodat aan de beleggingsdoelstelling van de cliënt kan worden
      voldaan;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58a
  - number: 58a.3.b
    text: |-
      worden de financiële instrumenten niet uitsluitend aangeboden door de beleggingsonderneming zelf of door entiteiten
      die nauwe banden met de beleggingsonderneming hebben of andere entiteiten waarmee de beleggingsonderneming
      in een zodanig nauw juridisch of economisch verband staat dat het risico bestaat dat dit afbreuk doet aan de
      onafhankelijkheid van het verstrekte advies;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58a
  - number: 58a.3.c
    text: |-
      voldoet zij aan de artikelen 52, tweede lid, en 53, eerste en tweede lid, van de gedelegeerde verordening markten
      voor financiële instrumenten 2014 inzake organisatorische eisen; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58a
  - number: 58a.3.d
    text: |-
      geeft zij de ontvangen provisies in zijn geheel door aan de professionele belegger indien zij advies geeft aan een
      professionele belegger.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel58a
  - number: 59a.1
    text: |-
      Een aanbieder verstrekt voorafgaand aan de totstandkoming van een overeenkomst inzake een complex product
      of hypothecair krediet aan de consument informatie over de totale prijs van het desbetreffende product met
      uitzondering van de advieskosten en distributiekosten, maar met inbegrip van alle bijbehorende kosten.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.2
    text: |-
      Onverminderd het eerste lid verstrekt een aanbieder voorafgaand aan de totstandkoming van een overeenkomst met een
      consument inzake een complex product dat strekt tot vermogensopbouw, aan de consument, voor zover van toepassing,
      ten minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.2.a
    text: het bedrag van de totale kosten, met uitzondering van de advieskosten en distributiekosten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.2.b
    text: |-
      de kosten die worden ingehouden op de inleg of de premie, onderverdeeld naar soorten kosten, zoals in elk geval
      eerste kosten, doorlopende kosten en aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.2.c
    text: |-
      de kosten die worden ingehouden op de vermogensopbouw of uitkering, onderverdeeld naar soorten kosten zoals in elk
      geval eerste kosten, doorlopende kosten en aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.2.d
    text: |-
      de kosten die de beheerder van een beleggingsinstelling of beheerder van een icbe jaarlijks in rekening brengt voor
      het beheer van rechten van deelneming in die beleggingsinstelling of icbe;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.2.e
    text: |-
      de invloed van het gemiddelde jaarlijkse percentage van de kosten, bedoeld onder b, c en d, op het rendement en de
      vermogensopbouw of uitkering, verbonden aan de overeenkomst; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.2.f
    text: de wijze waarop de kosten, bedoeld onder b, c en d, worden verdeeld over de looptijd van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.3
    text: 'Het eerste en tweede lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.3.a
    text: overeenkomsten met betrekking tot beleggingsobjecten; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.3.b
    text: overeenkomsten met betrekking tot het verlenen van een beleggingsdienst of nevendienst.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.4
    text: |-
      Het tweede lid, aanhef en de onderdelen b tot en met f, zijn niet van toepassing op een levensverzekeraar
      die een levensverzekering aanbiedt waarbij de uitkering wordt uitgedrukt in rechten van deelneming in een
      beleggingsinstelling of icbe.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
  - number: 59a.5
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op financiële ondernemingen die een complex product
      als bedoeld in [artikel 1, onderdeel d, onder 1°, 4° of 11°][ref1] samenstellen en dat product in de markt
      verkrijgbaar stellen voor consumenten of, indien het een recht van deelneming in een beleggingsinstelling of icbe
      betreft, cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 59aa.1
    text: |-
      Een aanbieder verstrekt een consument voorafgaand aan de totstandkoming van een overeenkomst inzake een hypothecair
      krediet met een variabele debetrentevoet, ten minste informatie over:
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59aa
  - number: 59aa.1.a
    text: de componenten waaruit de variabele debetrentevoet is opgebouwd;
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59aa
  - number: 59aa.1.b
    text: of deze componenten een vast of variabel bestanddeel vormen van de debetrentevoet; en
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59aa
  - number: 59aa.1.c
    text: de risico’s die verbonden zijn aan een variabele debetrentevoet.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59aa
  - number: 59aa.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de door een aanbieder in de
      informatieverstrekking aan de consument te gebruiken aanduiding van de componenten waaruit de variabele
      debetrentevoet is opgebouwd.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59aa
  - number: 59ab.1
    text: |-
      Voorafgaand aan de totstandkoming van een overeenkomst inzake hypothecair krediet verzoekt de aanbieder van
      hypothecair krediet de consument om de informatie en bewijsstukken te verstrekken die noodzakelijk zijn om de
      kredietwaardigheid van de consument te kunnen beoordelen.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59ab
  - number: 59ab.2
    text: |-
      Het verzoek, bedoeld in het eerste lid, vermeldt welke informatie en bewijsstukken verstrekt dienen te worden en
      binnen welke termijn aan dit verzoek dient te worden voldaan.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59ab
  - number: 59ab.3
    text: |-
      De aanbieder waarschuwt de consument dat het krediet niet kan worden verleend als de consument onvoldoende
      informatie verstrekt ten behoeve van de beoordeling van de kredietwaardigheid.
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59ab
  - number: 59ac
    text: |-
      Onverminderd [artikel 1:5a van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020421/2024-01-31#Artikel59ac
