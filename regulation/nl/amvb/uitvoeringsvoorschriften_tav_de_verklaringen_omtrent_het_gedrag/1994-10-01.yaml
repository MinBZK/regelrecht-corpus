preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 2 januari 1956, nummer U 15976, Directie Binnenlands
    Bestuur, Afdeling Bestuurszaken, mede namens Onze Minister van Justitie;

    Gelet op de artikelen 19, derde lid, laatste volzin, en 20, tweede lid, laatste zinsnede, der Wet op de justitiële
    documentatie en op de verklaringen omtrent het gedrag (Stb. 1955, 395);

    De Raad van State gehoord (advies van 17 januari 1956, no. 30);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 24 januari 1956, no. 16178, Directie
    Binnenlands Bestuur, Afdeling Bestuurszaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002204/1994-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In afwijking van het bepaalde in artikel 20, tweede lid, eerste zinsnede, van de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1], geschiedt de afgifte van een
      verklaring omtrent het gedrag van een persoon die buiten Nederland verblijft en niet in een basisadministratie
      persoonsgegevens is ingeschreven, doch onmiddellijk voorafgaand aan zijn vertrek in het persoonsregister van een
      gemeente was opgenomen, door de burgemeester van die gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0002204/1994-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002195
  - number: '2'
    text: 'Het model van de verklaring omtrent het gedrag wordt als volgt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0002204/1994-10-01#Artikel2
  - number: 2.a
    text: |-
      Indien de betrokkene als ingezetene in een basisadministratie persoonsgegevens is ingeschreven, als aangegeven in
      het bij dit besluit behorende model I;
    url: https://wetten.overheid.nl/BWBR0002204/1994-10-01#Artikel2
  - number: 2.b
    text: |-
      Indien de betrokkene anders dan als ingezetene in een basisadministratie persoonsgegevens is ingeschreven, als
      aangegeven in het bij dit besluit behorende model II;
    url: https://wetten.overheid.nl/BWBR0002204/1994-10-01#Artikel2
  - number: 2.c
    text: |-
      Indien de betrokkene buiten Nederland verblijft en niet in een basisadministratie persoonsgegevens is ingeschreven,
      doch onmiddellijk voorafgaand aan zijn vertrek in een gemeentelijk persoonsregister was opgenomen, als aangegeven
      in het bij dit besluit behorende model III.
    url: https://wetten.overheid.nl/BWBR0002204/1994-10-01#Artikel2
  - number: 2.d
    text: In alle andere gevallen, als aangegeven in het bij dit besluit behorende model IV.
    url: https://wetten.overheid.nl/BWBR0002204/1994-10-01#Artikel2
  - number: '3'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0002204/1994-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002195
