  - number: '7'
    text: |-
      Onverminderd het bepaalde in de [artikelen 1 tot en met 6][ref1] kan de Pensioen- & Verzekeringskamer nadere regels
      stellen omtrent de mate waarin technische voorzieningen moeten worden gevormd met betrekking tot verplichtingen en
      kosten en over de indeling van de technische voorzieningen. Zij kan daarbij voorschrijven naar welke grondslagen
      deze voorzieningen moeten worden berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006732#Artikel1
    url: https://wetten.overheid.nl/BWBR0006732/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006732
        artikel: '1'
        hoofdstuk: I
  - number: '8'
    text: |-
      1 De verzekeraar draagt er zorg voor dat de aard en de waardering van de waarden die dienen tot dekking van de
      technische voorzieningen in overeenstemming zijn met de aard onderscheidenlijk de waardering van de aangegane
      verplichtingen. Deze waarden worden adequaat gediversificeerd en gespreid. Waarden met een hoog risico worden tot
      een voorzichtig niveau beperkt en voorzichtig gewaardeerd.

      2 Bij of krachtens ministeriële regeling worden de categorieën van activa vastgesteld waarin de waarden die dienen
      tot dekking van de technische voorzieningen mogen worden aangehouden en de voorwaarden en maxima ten aanzien van
      bepaalde waarden.
    url: https://wetten.overheid.nl/BWBR0006732/2002-01-01#Artikel8
  - number: '9'
    text: |-
      1 De technische voorzieningen met betrekking tot uitkeringen die volgens de overeenkomst rechtstreeks gekoppeld
      zijn aan de waarde van een deelneming in een instelling voor collectieve belegging in effecten waarop [richtlijn
      nr. 85/611/EEG](31985L0611) van de Raad van de Europese Gemeenschappen van 20 december 1985 tot coördinatie van
      de wettelijke en bestuursrechtelijke bepalingen betreffende bepaalde instellingen voor collectieve belegging
      in effecten ( *PbEG* L 375) van toepassing is, of aan de waarde van activa die zijn opgenomen in een door de
      verzekeraar gehouden fonds dat gewoonlijk in fracties is verdeeld, worden gedekt door deze rechten van deelneming
      onderscheidenlijk fracties dan wel, indien geen fracties zijn gecreëerd, door deze activa.

      2 De technische voorzieningen met betrekking tot uitkeringen die volgens de overeenkomst rechtstreeks gekoppeld
      zijn aan een referentiewaarde anders dan die bedoeld in het eerste lid, worden gedekt door de eenheden die deze
      referentiewaarde vertegenwoordigen. Als deze eenheden ontbreken, worden de technische voorzieningen gedekt door
      activa die zo nauw mogelijk aansluiten bij die waarop de betrokken referentiewaarde is gebaseerd.

      3 Op de technische voorzieningen die rechtstreeks verband houden met de uitkeringen, bedoeld in het eerste en
      tweede lid, zijn, voor zover in die uitkeringen geen sprake is van een gegarandeerd rendement of een gegarandeerd
      uitkeringsniveau, [artikel 8, eerste lid][ref1], alsmede de krachtens [artikel 8, tweede lid][ref2], vastgestelde
      maxima niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006732#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006732#Artikel8
    url: https://wetten.overheid.nl/BWBR0006732/2002-01-01#Artikel9
