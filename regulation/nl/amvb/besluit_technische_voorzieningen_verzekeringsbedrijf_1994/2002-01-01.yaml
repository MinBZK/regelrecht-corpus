  - number: '5'
    text: |-
      De voorziening voor winstdeling en kortingen, bedoeld in [artikel 435, eerste lid, onderdeel ][ref1], omvat de
      bedragen die in de vorm van winstdeling bestemd zijn voor de verzekeringnemers, verzekerden of gerechtigden op
      uitkeringen, voor zover deze niet hebben geleid tot verhoging van de voorziening voor levensverzekering, alsmede
      de bedragen die een gedeeltelijke terugbetaling van premies op grond van het resultaat van de overeenkomsten
      vertegenwoordigen, voor zover deze niet tot verhoging van de ledenrekening hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel435
    url: https://wetten.overheid.nl/BWBR0006732/2002-01-01#Artikel5
    references:
