articles:
  - number: '1'
    text: |-
      1 De voorziening voor niet-verdiende premies en lopende risico's, bedoeld in
      [artikel 435, eerste lid, onderdeel ][ref1], omvat onder meer:

      a. de in het boekjaar ontvangen premies ter zake van risico’s die op het daarop volgende boekjaar of boekjaren
      betrekking hebben;

      b. de schaden en kosten uit lopende overeenkomsten van verzekering die na afloop van het boekjaar kunnen ontstaan
      en die niet gedekt kunnen worden door de voorziening die betrekking heeft op de niet-verdiende premies te zamen met
      de in het daarop volgende boekjaar of boekjaren nog te ontvangen premies.

      2 De voorziening voor niet-verdiende premies wordt voor elke overeenkomst voor het schadeverzekeringsbedrijf
      afzonderlijk en op voorzichtige wijze bepaald. Het gebruik van statistische of wiskundige methoden is toegestaan
      indien de aard van de overeenkomst dat toelaat en indien deze methoden naar verwachting dezelfde resultaten
      opleveren als de afzonderlijke berekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel435
    url: https://wetten.overheid.nl/BWBR0006732/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '435'
  - number: '2'
    text: |-
      1 De voorziening voor levensverzekering, bedoeld in [artikel 435, eerste lid, onderdeel ][ref1], wordt berekend
      op basis van een voldoende voorzichtige prospectieve actuariële methode, rekening houdend met de in de toekomst
      te ontvangen premies en met alle toekomstige verplichtingen volgens de voor iedere lopende overeenkomst van
      verzekering gestelde voorwaarden, met inbegrip van:

      a. alle gegarandeerde uitkeringen en gegarandeerde afkoopwaarden;

      b. de winstdelingen waarop de verzekeringnemer, verzekerde of gerechtigde op uitkering, collectief dan wel
      individueel recht heeft;

      c. alle keuzemogelijkheden waarover de verzekeringnemer, verzekerde of gerechtigde op uitkering, volgens de
      voorwaarden van de overeenkomst beschikt;

      d. de bedrijfskosten, met inbegrip van provisies.

      2 Deze voorziening wordt voor elke overeenkomst afzonderlijk berekend. Het gebruik van statistische of wiskundige
      methoden is toegestaan indien de aard van de overeenkomst dat toelaat en indien deze methoden naar verwachting
      dezelfde resultaten opleveren als de afzonderlijke berekeningen.

      3 In afwijking van het eerste lid kan een retrospectieve methode worden toegepast indien de op grond van die
      methode berekende technische voorzieningen niet lager zijn dan de voorzieningen bij toepassing van een prospectieve
      methode of indien het gebruik van een prospectieve methode vanwege de aard van het betrokken type overeenkomst niet
      mogelijk is.

      4 De Pensioen- & Verzekeringskamer stelt ten behoeve van de berekeningen, bedoeld in het eerste tot en met het
      derde lid, de maximum rentepercentages en de daarbij in acht te nemen voorzichtigheidsmarges vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel435
    url: https://wetten.overheid.nl/BWBR0006732/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '435'
  - number: '3'
    text: |-
      1 De voorziening voor te betalen schaden of voor te betalen uitkeringen, bedoeld in
      [artikel 435, eerste lid, onderdeel ][ref1], omvat het bedrag van de te verwachten schaden, in aanmerking nemende:

      a. de voor de balansdatum ontstane schaden of uitkeringen die zijn gemeld en nog niet zijn afgewikkeld en de
      schaden of uitkeringen die nog niet zijn gemeld;

      b. de kosten verband houdende met de afwikkeling van schaden of uitkeringen;

      c. de in verband met schaden of uitkeringen te verwachten baten uit subrogatie en de verkrijging van de eigendom
      van verzekerde zaken.

      2 De voorziening voor te betalen schaden wordt voor elke schade afzonderlijk bepaald of volgens statistische
      methoden indien de aard van de overeenkomst dat toelaat en indien deze methoden naar verwachting dezelfde
      resultaten opleveren als de afzonderlijke berekeningen. In geval van periodiek te betalen schaden geschiedt de
      bepaling volgens erkende actuariële methoden.

      3 Discontering van de voorziening voor te betalen schaden of voor te betalen uitkeringen, anders dan periodiek te
      betalen schaden, is slechts toegestaan indien

      a. de afwikkeling van de schaden ten minste vier jaren na het tijdstip van het opmaken van de jaarrekening zal
      duren en deze afwikkeling geschiedt volgens een betrouwbaar schade-afwikkelingsschema, waarin mede rekening wordt
      gehouden met alle factoren die de kosten van afwikkeling van de schade verhogen; en

      b. het rentepercentage dat voor de discontering wordt gebruikt niet hoger is dan het gemiddeld rendementspercentage
      van de voor deze technische voorziening aangehouden activa over de laatste vijf jaren voorafgaande aan het tijdstip
      van het opmaken van de jaarrekening en evenmin hoger is dan het rendementspercentage van deze activa over het
      boekjaar.

      4 Met betrekking tot een overeenkomst van communautaire co-assurantie als bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref2], zijn de voorzieningen voor te betalen schaden of voor te betalen
      uitkeringen verhoudingsgewijs ten minste gelijk aan die welke de co-assuradeur die als eerste verzekeraar
      optreedt, aanhoudt volgens de regels of gebruiken die gelden in de lid-staat van waaruit de eerste verzekeraar zijn
      verplichtingen uit hoofde van de overeenkomst van communautaire co-assurantie is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel435
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0006732/2002-01-01#Artikel3
