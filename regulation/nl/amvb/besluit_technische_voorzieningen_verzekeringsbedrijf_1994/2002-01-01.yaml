        artikel: '435'
  - number: '6'
    text: |-
      1 In de uitoefening van de branche Krediet wordt een egalisatievoorziening, bedoeld in
      [artikel 435, eerste lid, onderdeel ][ref1], aangehouden die wordt berekend volgens de in [bijlage A][ref2] bij dit
      besluit opgenomen methode voor:

      a. alle aangegane verplichtingen indien het een verzekeraar met zetel in Nederland betreft;

      b. de vanuit zijn bijkantoren in Nederland aangegane verplichtingen indien het een verzekeraar met zetel buiten de
      Unie betreft.

      2 Het eerste lid is niet van toepassing op een verzekeraar:

      a. met zetel in Nederland die naast de branche Krediet een of meer andere branches vanuit een vestiging in de Unie
      uitoefent, indien de door hem jaarlijks geboekte premies met betrekking tot zijn vanuit vestigingen in de Unie
      aangegane verplichtingen in de uitoefening van de branche Krediet minder dan vier procent van het totale bedrag aan
      jaarlijks geboekte premies en minder dan twee miljoen vijfhonderdduizend euro belopen;

      b. met zetel buiten de Unie die naast de branche Krediet een of meer andere branches vanuit een bijkantoor in
      Nederland uitoefent, indien de door hem jaarlijks geboekte premies met betrekking tot zijn vanuit bijkantoren in
      Nederland aangegane verplichtingen in de uitoefening van de branche Krediet minder dan vier procent van het totale
      bedrag aan jaarlijks geboekte premies en minder dan twee miljoen vijfhonderdduizend euro belopen.

      3 Voor de toepassing van dit artikel wordt onder "euro" verstaan de rekeneenheid, bedoeld in artikel 5, onderdeel
      *a*, van [richtlijn nr. 73/239/EEG](31973L0239) van de Raad van de Europese Gemeenschappen van 24 juli 1973
      tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende de toegang tot het directe
      verzekeringsbedrijf, met uitzondering van de levensverzekeringsbranche, en de uitoefening daarvan (*PbEG* L 228),
      met inachtneming van de artikelen 1 en 2 van [richtlijn nr. 76/580/EEG](31976L0580) van de Raad van de Europese
      Gemeenschappen van 29 juni 1976 tot wijziging van [Richtlijn 73/239/EEG](31973L0239) tot coördinatie van de
      wettelijke en de bestuursrechtelijke bepalingen betreffende de toegang tot het directe verzekeringsbedrijf, met
      uitzondering van de levensverzekeringsbranche, en de uitoefening daarvan (*PbEG* L 189) en van [verordening (EG)
      nr. 1103/97](31997R1103) van de Raad van 17 juni 1997 over enkele bepalingen betreffende de invoering van de euro
      (Pb EG L 162).


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel435
      [ref2]: https://wetten.overheid.nl/BWBR0006732
