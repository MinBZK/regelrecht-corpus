  - number: '10'
    text: |-
      1 De muntsoort waarin de verplichtingen van de verzekeraar luiden, wordt vastgesteld overeenkomstig de in
      [bijlage B][ref1] onderscheidenlijk [bijlage C][ref2] opgenomen regels. De Pensioen- & Verzekeringskamer kan ter
      zake van de muntsoort slechts vrijstelling of ontheffing verlenen voor zover dit blijkens de desbetreffende bijlage
      is toegelaten.

      2 Onverminderd het bepaalde in het eerste lid kan de Pensioen- & Verzekeringskamer de in
      [artikel 66, zevende lid, van de Wet toezicht verzekeringsbedrijf 1993][ref3] bedoelde vrijstelling
      onderscheidenlijk ontheffing verlenen indien de verzekeraar aannemelijk maakt dat de belangen van de
      verzekeringnemers, verzekerden of gerechtigden op uitkeringen zich daartegen niet verzetten.

      3 Onverminderd het bepaalde in het eerste lid kan de Pensioen- & Verzekeringskamer de in
      [artikel 94, achtste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref4] bedoelde vrijstelling dan wel
      ontheffing verlenen:

      a. indien de verzekeraar aannemelijk maakt dat de belangen van de verzekeringnemers, verzekerden of gerechtigden op
      uitkeringen zich daartegen niet verzetten; onderscheidenlijk

      b. indien de verzekeraar diensten verricht naar een andere lid-staat, voor zover die lid-staat het verrichten van
      deze diensten afhankelijk stelt van een vergunning.

      4 Een vrijstelling of ontheffing als bedoeld in het derde lid wordt niet verleend van het voorschrift dat de
      waarden die dienen tot dekking van de technische voorzieningen in Nederland aanwezig moeten zijn.

      5 Het eerste lid is niet van toepassing op de overeenkomsten, bedoeld in [artikel 9][ref5].


