      1 Het bedrag van de boete, bedoeld in
      [artikel 188d, vijfde lid, eerste volzin, van de Wet toezicht verzekeringsbedrijf 1993][ref1], wordt bepaald op de
      wijze, voorzien in [bijlage D][ref2] bij dit besluit.

      2 De Pensioen- & Verzekeringskamer kan het bedrag van de boete lager stellen dan in [bijlage D][ref3] is bepaald,
      indien het bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.


