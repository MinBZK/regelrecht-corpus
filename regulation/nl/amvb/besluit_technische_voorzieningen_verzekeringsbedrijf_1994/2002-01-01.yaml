  - number: '4'
    text: |-
      1 Indien de verplichtingen uit overeenkomsten van verzekering op het tijdstip van het opmaken van de jaarrekening
      redelijkerwijs niet te schatten zijn wegens het ontbreken van voldoende nauwkeurige gegevens met betrekking tot
      de over het tekenjaar te ontvangen premies of te betalen schaden en kosten van afwikkeling van de schade, kan, in
      afwijking van [artikel 3][ref1]:

      a. als voorziening voor te betalen schaden of voor te betalen uitkeringen worden opgenomen:

      1°. een percentage van de geboekte premies met betrekking tot het tekenjaar waarin de overeenkomsten een aanvang
      nemen, of

      2°. het positieve verschil tussen enerzijds de geboekte premies en anderzijds de betaalde schaden en kosten van
      afwikkeling van de schaden met betrekking tot het tekenjaar waarin de overeenkomsten een aanvang nemen; of

      b. ter bepaling van de voorziening voor te betalen schaden of voor te betalen uitkeringen gebruik worden gemaakt
      van gegevens, bedoeld in onderdeel *a*, die betrekking hebben op een jaar dat ten hoogste twaalf maanden aan het
      boekjaar voorafgaat.

      2 De overeenkomstig het eerste lid bepaalde voorziening moet te allen tijde toereikend zijn om aan de
      verplichtingen uit overeenkomsten van verzekering te voldoen.

      3 Het bedrag van de voorziening volgens de methode als bedoeld in het eerste lid, onderdeel *a* of *b*, wordt,
      zodra dat nodig blijkt, zodanig verhoogd tot het toereikend is om aan de huidige en toekomstige verplichtingen
      te voldoen.

      4 Indien de berekening, bedoeld in het eerste lid, onderdeel *a*, wordt toegepast, wordt zodra voldoende
      nauwkeurige gegevens, bedoeld in het eerste lid, aanhef, bekend zijn, doch uiterlijk aan het einde van het derde
      boekjaar volgend op het in het eerste lid bedoelde tekenjaar, de voorziening voor te betalen schaden of voor te
      betalen uitkeringen overeenkomstig [artikel 3][ref2] bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006732#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006732#Artikel3
    url: https://wetten.overheid.nl/BWBR0006732/2002-01-01#Artikel4
