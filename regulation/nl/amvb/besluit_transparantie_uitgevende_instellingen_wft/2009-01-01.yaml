valid_from: '2009-01-01'
bwb_id: BWBR0024950
url: https://wetten.overheid.nl/BWBR0024950/2009-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 21 november 2008, Generale Thesaurie, Directie Financiële
    Markten, Afdeling Marktgedrag/Effectenverkeer, nr. FM 2008-2941 M;

    Gelet op richtlijn nr. 2004/109/EG van het Europees Parlement en de Raad van de Europese Unie van 15 december
    2004 betreffende de transparantievereisten die gelden voor informatie over uitgevende instellingen waarvan
    effecten tot de handel op een gereglementeerde markt zijn toegelaten en tot wijziging van Richtlijn 2001/34/
    EG (PbEU L 390), richtlijn nr. 2007/14/EG van de Commissie van de Europese gemeenschappen van 8 maart 2007 tot
    vaststelling van concrete uitvoeringsvoorschriften van een aantal bepalingen van richtlijn 2004/109/EG betreffende
    de transparantievereisten die gelden voor informatie over uitgevende instellingen waarvan effecten tot de handel op
    een gereglementeerde markt zijn toegelaten (PbEU L 69) en de artikelen 5:25i, 5:25w, 5:33, eerste lid, onderdeel b,
    onder 4°, tweede volzin, 5:38, vierde lid, 5:44, 5:45, tiende lid en 5:46, vierde lid, van de Wet op het financieel
    toezicht;

    De Raad van State gehoord (advies van 8 december 2008, nr. W06.08.0504/III);

    Gezien het nader rapport van Onze Minister van Financiën van 15 december 2008 (nr. FM/2008/3186 M);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder wet: [Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '2.1'
    text: |-
      De halfjaarrekening van een uitgevende instelling die niet verplicht is een geconsolideerde jaarrekening op
      te maken, bevat in de verkorte balans en de verkorte winst- en verliesrekening dezelfde posten, opschriften en
      subtotalen als die in de laatste algemeen verkrijgbaar gestelde jaarrekening zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel2
  - number: '2.2'
    text: |-
      Aan de halfjaarrekening, bedoeld in het eerste lid, worden posten toegevoegd ingeval de halfjaarlijkse financiële
      verslaggeving zonder die toegevoegde posten geen getrouw beeld zou geven van het vermogen, de financiële toestand
      en de resultaten van de uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel2
  - number: '2.3'
    text: 'In de halfjaarrekening, bedoeld in het eerste lid, wordt voorts opgenomen:'
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel2
  - number: 2.3.a
    text: |-
      een vergelijkende verkorte balans waarin informatie is opgenomen die betrekking heeft op het eind van het
      voorgaande boekjaar; en
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel2
  - number: 2.3.b
    text: |-
      een vergelijkende verkorte winst- en verliesrekening waarin informatie is opgenomen die betrekking heeft op
      dezelfde periode van het voorgaande boekjaar.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel2
  - number: '2.4'
    text: 'De toelichting op de halfjaarrekening, bedoeld in het eerste lid, bevat:'
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel2
  - number: 2.4.a
    text: |-
      voldoende informatie om de halfjaarrekening met de laatste algemeen verkrijgbaar gestelde jaarrekening te kunnen
      vergelijken; en
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel2
  - number: 2.4.b
    text: |-
      voldoende informatie en uitleg om een goed inzicht te kunnen verschaffen in materiële veranderingen van bedragen
      en in de gebeurtenissen in de eerste zes maanden van het boekjaar die van invloed zijn in de balans en de winst-
      en verliesrekening.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het halfjaarverslag van een uitgevende instelling, bedoeld in [artikel 5:25d, negende lid, van de wet][ref1], die
      verplicht is een geconsolideerde jaarrekening op te maken, bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 3.1.a
    text: |-
      de transacties met verbonden partijen die in de eerste zes maanden van het lopende boekjaar hebben plaatsgevonden
      en die materiële gevolgen hebben gehad voor de financiële positie of resultaten van de uitgevende instelling in die
      periode; en
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel3
  - number: 3.1.b
    text: |-
      alle wijzigingen in de in het laatste algemeen verkrijgbaar gestelde jaarverslag beschreven transacties met
      verbonden partijen die materiële gevolgen kunnen hebben voor de financiële positie of resultaten van de uitgevende
      instelling in de eerste zes maanden van het lopende boekjaar.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel3
  - number: '3.2'
    text: |-
      Indien de uitgevende instelling, bedoeld in [artikel 5:25d, negende lid, van de wet][ref1] niet verplicht is
      een geconsolideerde jaarrekening op te maken, vermeldt het halfjaarverslag ten minste de van betekenis zijnde
      transacties door de rechtspersoon niet onder normale marktvoorwaarden met een verbonden een partij zijn aangegaan,
      de omvang van die transacties, de aard van de betrekking met de verbonden partij, alsmede andere informatie over
      die transacties die nodig is voor het verschaffen van inzicht in de financiële positie van de rechtspersoon.
      Informatie over individuele transacties kan overeenkomstig de aard ervan worden samengevoegd, tenzij gescheiden
      informatie nodig is om inzicht te verschaffen in de gevolgen van transacties met verbonden partijen voor de
      financiële positie van de rechtspersoon. Vermelding van transacties tussen twee of meer leden van een groep kan
      achterwege blijven, mits dochtermaatschappijen die partij zijn bij de transactie geheel in eigendom zijn van een of
      meer leden van de groep.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '4.1'
    text: |-
      Onder een rechtmatig belang als bedoeld in [artikel 5:25i, derde lid, onderdeel a, van de wet][ref1] wordt in elk
      geval verstaan het voorkomen dat de algemeenverkrijgbaarstelling van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 4.1.a
    text: |-
      informatie als bedoeld in [artikel 5:25i, tweede lid, van de wet][ref1], de uitkomst of het normale verloop van
      onderhandelingen waarbij de uitgevende instelling partij is, kan beïnvloeden;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 4.1.b
    text: |-
      door het bestuur van de uitgevende instelling genomen besluiten voordat de op grond van
      [Boek 2 van het Burgerlijk Wetboek][ref1] of de statutendoor de raad van commissarissen of een daarmee
      vergelijkbaar orgaan vereiste goedgekeurd is verleend, samen met de gelijktijdige aankondiging dat deze goedkeuring
      nog geen feit is, aan een correcte beoordeling door het publiek in de weg kan staan;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 4.1.c
    text: |-
      een besluit als bedoeld in [artikel 1:76 van de wet][ref1], een verzoek als bedoeld in [artikel 3:160][ref2]
      of [3:161 van de wet][ref3] of het verlenen van liquiditeitssteun door de Nederlandsche Bank op grond van
      [artikel 8, eerste lid, van de Bankwet 1998][ref4], strijd oplevert met het belang van de betrokken financiële
      onderneming; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0009508#Artikel8
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0009508
        artikel: '8'
  - number: 4.1.d
    text: |-
      het feit dat de Autoriteit Financiële Markten een verzoek of een
      mededeling als bedoeld in [artikel 2, eerste lid][ref1], onderscheidenlijk
      [artikel 3, eerste lid, van de Wet toezicht financiële verslaggeving][ref2] heeft gedaan, invloed
      zou kunnen hebben op de koers van de effecten van de effectenuitgevende instelling, bedoeld in
      [artikel 1, onderdeel b, van de Wet toezicht financiële verslaggeving][ref3], of op de koers van daarvan afgeleide
      effecten.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020369#Artikel1
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020369
        artikel: '1'
  - number: '4.2'
    text: |-
      Om de vertrouwelijkheid van informatie, bedoeld in [artikel 5:25i, derde lid, onderdeel c, van de wet][ref1]
      te kunnen waarborgen controleert de uitgevende instelling de toegang tot de informatie en treft de uitgevende
      instelling afdoende maatregelen waardoor deze toegang wordt beperkt tot personen voor wie het noodzakelijk is om in
      het kader van de normale uitoefening van werk, beroep of functie bekend te zijn met de informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '5.1'
    text: |-
      De veiligheid van een op grond van [artikel 5:25m van de wet][ref1] uit te brengen persbericht wordt door de
      uitgevende instelling gewaarborgd zodanig dat het risico op gegevenswijziging en ongeoorloofde toegang zo veel
      mogelijk is uitgesloten en zekerheid bestaat over de bron van de gereglementeerde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '5.2'
    text: |-
      De uitgevende instelling draagt er zorg voor dat eventuele tekortkomingen of storingen bij de
      algemeenverkrijgbaarstelling van gereglementeerde informatie via het persbericht zo spoedig mogelijk worden
      verholpen.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel5
  - number: '5.3'
    text: |-
      De uitgevende instelling is niet verantwoordelijk voor fouten of tekortkomingen in de systemen van de media via
      welke de gereglementeerde informatie algemeen verkrijgbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel5
  - number: '5.4'
    text: |-
      De uitgevende instelling stelt de gereglementeerde informatie volledig en onbewerkt en op zodanige wijze algemeen
      verkrijgbaar dat:
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel5
  - number: 5.4.a
    text: duidelijk wordt dat het om gereglementeerde informatie gaat;
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel5
  - number: 5.4.b
    text: correcte en tijdige inschatting van het publiek mogelijk is;
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel5
  - number: 5.4.c
    text: de identiteit van de betrokken uitgevende instelling duidelijk is;
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel5
  - number: 5.4.d
    text: het onderwerp van de gereglementeerde informatie duidelijk is; en
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel5
  - number: 5.4.e
    text: het tijdstip en de datum van het persbericht duidelijk is.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel5
  - number: '5.5'
    text: |-
      De uitgevende instelling doet de algemeenverkrijgbaarstelling van gereglementeerde informatie niet vergezellen van
      reclame-uitingen voor haar activiteiten, indien dit mogelijk misleidend is.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel5
  - number: '5.6'
    text: |-
      Indien de gereglementeerde informatie betrekking heeft op door een uitgevende instelling uitgegeven effecten ten
      aanzien waarvan door een persoon zonder toestemming van die uitgevende instelling om toelating tot de handel op een
      gereglementeerde markt van door de uitgevende instelling uitgegeven effecten is verzocht, rusten de in het eerste
      tot en met vijfde lid en de in [artikel 6][ref1] bedoelde verplichtingen op die persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0024950#Artikel6
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024950
        artikel: '6'
        hoofdstuk: IV
  - number: '6'
    text: 'Desgevraagd verstrekt de uitgevende instelling de volgende informatie aan de Autoriteit Financiële Markten:'
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel6
  - number: 6.a
    text: de naam van de persoon die de gereglementeerde informatie algemeen verkrijgbaar heeft gesteld;
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel6
  - number: 6.b
    text: de bijzonderheden over de beveiligingsvalidering;
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel6
  - number: 6.c
    text: |-
      de datum en het tijdstip waarop het persbericht, bedoeld in [artikel 5:25m, tweede lid, van de wet][ref1] algemeen
      verkrijgbaar is gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 6.d
    text: de drager waarop de gereglementeerde informatie algemeen verkrijgbaar is gesteld;
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel6
  - number: 6.e
    text: |-
      de bijzonderheden over een eventueel embargo dat de uitgevende instelling voorafgaand aan de algemeen
      verkrijgbaarstelling op de gereglementeerde informatie heeft gelegd.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel6
  - number: '7.1'
    text: |-
      Als instantie die belast is met de opslag van gereglementeerde informatie als bedoeld in
      [artikel 5:25m, vijfde lid, van de wet][ref1] wordt de Autoriteit Financiële Markten aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '7.2'
    text: 'De Autoriteit Financiële Markten draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel7
  - number: 7.2.a
    text: |-
      de veiligheid van de opgeslagen gereglementeerde informatie zodanig gewaarborgd is dat het risico op
      gegevenswijziging en ongeoorloofde toegang zo veel mogelijk is uitgesloten en zekerheid bestaat over de bron van de
      gereglementeerde informatie;
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel7
  - number: 7.2.b
    text: de gereglementeerde informatie op het moment van opslag wordt voorzien van een datum en tijdstempel;
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel7
  - number: 7.2.c
    text: |-
      de opgeslagen gereglementeerde informatie op een eenvoudige wijze en uiterlijk binnen vijf werkdagen na ontvangst
      toegankelijk is voor het publiek; en
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel7
  - number: 7.2.d
    text: |-
      de centrale opslag van gereglementeerde informatie op zodanig wijze wordt ingericht dat samenwerking met andere
      instanties die belast zijn met de centrale opslag van gereglementeerde informatie op eenvoudige wijze kan
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het jaarverslag van een uitgevende instelling met zetel in een staat die geen lidstaat is en waarvan Nederland
      lidstaat van herkomst is, die ingevolge [artikel 5:25v van de wet][ref1] haar jaarlijkse financiële verslaggeving
      opmaakt overeenkomstig de in die staat geldende wettelijke voorschriften dient ten minste te bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 8.1.a
    text: |-
      een getrouw beeld van de ontwikkeling en de resultaten van de uitgevende instelling en haar groep en van de
      positie van de uitgevende instelling, alsmede een beschrijving van de voornaamste risico’s en onzekerheden waarmee
      zij geconfronteerd wordt. Het jaarverslag bevat een evenwichtige en volledige analyse van de ontwikkeling en
      de resultaten van de uitgevende instelling en haar groep en van de positie van de uitgevende instelling die in
      overeenstemming is met de omvang en de complexiteit van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel8
  - number: 8.1.b
    text: informatie over de belangrijke gebeurtenissen die na het einde van het boekjaar hebben plaatsgevonden; en
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel8
  - number: 8.1.c
    text: informatie over de verwachte ontwikkeling van de uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel8
  - number: '8.2'
    text: |-
      De in het eerste lid, onderdeel a, bedoelde analyse bevat de essentiële voor de specifieke uitgevende instelling en
      haar groep relevante financiële en, voor zover van toepassing, niet-financiële prestatie-indicatoren die nodig zijn
      om inzicht te krijgen in de ontwikkeling, resultaten en positie van de uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het halfjaarverslag van een uitgevende instelling met zetel in een staat die geen lidstaat is en waarvan
      Nederland lidstaat van herkomst is, die ingevolge [artikel 5:25v van de wet][ref1] haar halfjaarlijkse financiële
      verslaggeving opmaakt overeenkomstig de in die staat geldende wettelijke voorschriften dient ten minste te
      bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 9.1.a
    text: een overzicht van de verslagperiode; en
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel9
  - number: 9.1.b
    text: |-
      informatie over de waarschijnlijke toekomstige ontwikkeling van de uitgevende instelling in de resterende zes
      maanden van het boekjaar.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien het een uitgevende instelling als bedoeld in het eerste lid betreft waarvan aandelen zijn toegelaten tot
      de handel op een gereglementeerde markt, vermeldt het halfjaarverslag eveneens de belangrijkste transacties met
      verbonden partijen voor zover deze niet al doorlopend worden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel9
  - number: '10'
    text: |-
      Een uitgevende instelling met zetel in een staat die geen lidstaat is en waarvan Nederland lidstaat van
      herkomst is, die ingevolge [artikel 5:25v van de wet][ref1] haar halfjaarlijkse financiële verslaggeving opmaakt
      overeenkomstig de in die staat geldende wettelijke voorschriften neemt in haar halfjaarlijkse en jaarlijkse
      financiële verslaggeving verklaringen op van de personen die krachtens de wetgeving van die staat verantwoordelijk
      zijn voor de jaarlijkse en halfjaarlijkse financiële verslaggeving ten aanzien van in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 10.a
    text: de conformiteit van de financiële overzichten met de toepasselijke verslaggevingsvoorschriften; en
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel10
  - number: 10.b
    text: de getrouwheid van het overzicht in het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel10
  - number: '11.1'
    text: |-
      Een consolidatieplichtige uitgevende instelling met zetel in een staat die geen lidstaat is en waarvan Nederland
      lidstaat van herkomst is en die ingevolge [artikel 5:25v van de wet][ref1] haar jaarlijkse financiële verslaggeving
      opmaakt overeenkomstig de in die staat geldende wettelijke voorschriften en die op grond van de op haar
      toepasselijke wetgeving niet verplicht is haar enkelvoudige jaarrekening algemeen verkrijgbaar te stellen, neemt in
      haar geconsolideerde jaarrekening ten minste de volgende informatie op:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 11.1.a
    text: |-
      indien het een uitgevende instelling betreft waarvan aandelen zijn toegelaten tot de handel op een gereglementeerde
      markt, de dividendberekening en het vermogen om dividend uit te keren; en
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel11
  - number: 11.1.b
    text: de minimumvereisten ten aanzien van kapitaal en eigen vermogen, alsmede informatie over haar liquiditeit.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel11
  - number: '11.2'
    text: |-
      De uitgevende instelling, bedoeld in het eerste lid, verstrekt op verzoek van de Autoriteit Financiële Markten
      aanvullende gecontroleerde informatie over haar enkelvoudige jaarrekening indien dit voor het begrip van de in het
      eerste lid, onderdelen a en b, bedoelde informatie van belang zijn. Deze informatie kan worden opgesteld volgens de
      standaarden voor de jaarrekeningen van het land waar de uitgevende instelling haar zetel heeft.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel11
  - number: '12.1'
    text: |-
      Een niet-consolidatieplichtige uitgevende instelling met zetel in een staat die geen lidstaat is en waarvan
      Nederland lidstaat van herkomst is en die ingevolge [artikel 5:25v van de wet][ref1] haar jaarlijkse financiële
      verslaggeving opmaakt overeenkomstig de in die staat geldende wettelijke voorschriften, stelt haar enkelvoudige
      jaarrekening op overeenkomstig artikel 3 van de IAS-verordening goedgekeurde voorschriften tenzij de in de
      desbetreffende staat geldende of toegelaten verslaggevingsvoorschriften daaraan gelijkwaardig zijn, in welk geval
      de uitgevende instelling opmaakt overeenkomstig de in die staat geldende wettelijke voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '12.2'
    text: |-
      Indien de jaarrekening bedoeld in het eerste lid niet overeenkomstig artikel 3 van de IAS-verordening goedgekeurde
      voorschriften is opgesteld, presenteert de uitgevende instelling deze jaarrekening in de vorm van aangepaste
      financiële overzichten.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel12
  - number: '12.3'
    text: |-
      De jaarrekening, bedoeld in het eerste lid, dient door een accountant worden gecontroleerd. Indien de
      jaarrekening is opgesteld overeenkomstig de in de die staat die geen lidstaat is geldende voorschriften,
      kan de controle worden verricht door een onafhankelijk accountant, niet zijnde een accountant als bedoeld in
      [artikel 5:25a, van de wet][ref1] die bevoegd is tot controle van de jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '18.1'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel18
  - number: '18.2'
    text: |-
      [Artikel 16][ref1] werkt terug tot en met 1 januari 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0024950#Artikel16
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0024950
        artikel: '16'
        hoofdstuk: VI
  - number: '19'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoeringsrichtlijn transparantie uitgevende instellingen Wft.'
    url: https://wetten.overheid.nl/BWBR0024950/2009-01-01#Artikel19
