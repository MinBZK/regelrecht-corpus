        artikel: 5:25d
  - number: '5'
    text: |-
      1 De veiligheid van een op grond van [artikel 5:25m van de wet][ref1] uit te brengen persbericht wordt door de
      uitgevende instelling gewaarborgd zodanig dat het risico op gegevenswijziging en ongeoorloofde toegang zo veel
      mogelijk is uitgesloten en zekerheid bestaat over de bron van de gereglementeerde informatie.

      2 De uitgevende instelling draagt er zorg voor dat eventuele tekortkomingen of storingen bij de
      algemeenverkrijgbaarstelling van gereglementeerde informatie via het persbericht zo spoedig mogelijk worden
      verholpen.

      3 De uitgevende instelling is niet verantwoordelijk voor fouten of tekortkomingen in de systemen van de media via
      welke de gereglementeerde informatie algemeen verkrijgbaar wordt gesteld.

      4 De uitgevende instelling stelt de gereglementeerde informatie volledig en onbewerkt en op zodanige wijze algemeen
      verkrijgbaar dat:

      a. duidelijk wordt dat het om gereglementeerde informatie gaat;

      b. correcte en tijdige inschatting van het publiek mogelijk is;

      c. de identiteit van de betrokken uitgevende instelling duidelijk is;

      d. het onderwerp van de gereglementeerde informatie duidelijk is; en

      e. het tijdstip en de datum van het persbericht duidelijk is.

      5 De uitgevende instelling doet de algemeenverkrijgbaarstelling van gereglementeerde informatie niet vergezellen
      van reclame-uitingen voor haar activiteiten, indien dit mogelijk misleidend is.

      6 Indien de gereglementeerde informatie betrekking heeft op door een uitgevende instelling uitgegeven effecten ten
      aanzien waarvan door een persoon zonder toestemming van die uitgevende instelling om toelating tot de handel op een
      gereglementeerde markt van door de uitgevende instelling uitgegeven effecten is verzocht, rusten de in het eerste
      tot en met vijfde lid en de in [artikel 6][ref2] bedoelde verplichtingen op die persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel525m
      [ref2]: https://wetten.overheid.nl/BWBR0024950#Artikel6
    url: https://wetten.overheid.nl/BWBR0024950/2019-07-21#Artikel5
    references:
      - id: ref1
