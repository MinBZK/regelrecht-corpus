  - number: '2'
    text: >-
      1 De halfjaarrekening van een uitgevende instelling die niet verplicht is een geconsolideerde jaarrekening op
      te maken, bevat in de verkorte balans en de verkorte winst- en verliesrekening dezelfde posten, opschriften en
      subtotalen als die in de laatste algemeen verkrijgbaar gestelde jaarrekening zijn opgenomen.


      2 Aan de halfjaarrekening, bedoeld in het eerste lid, worden posten toegevoegd ingeval de halfjaarlijkse financiële
      verslaggeving zonder die toegevoegde posten geen getrouw beeld zou geven van het vermogen, de financiële toestand
      en de resultaten van de uitgevende instelling.


      3 In de halfjaarrekening, bedoeld in het eerste lid, wordt voorts opgenomen:


      a. een vergelijkende verkorte balans waarin informatie is opgenomen die betrekking heeft op het eind van het
      voorgaande boekjaar; en


      b. een vergelijkende verkorte winst- en verliesrekening waarin informatie is opgenomen die betrekking heeft op
      dezelfde periode van het voorgaande boekjaar.


      4 De toelichting op de halfjaarrekening, bedoeld in het eerste lid, bevat:


      a. voldoende informatie om de halfjaarrekening met de laatste algemeen verkrijgbaar gestelde jaarrekening te kunnen
      vergelijken; en


      b. voldoende informatie en uitleg om een goed inzicht te kunnen verschaffen in materiële veranderingen van bedragen
      en in de gebeurtenissen in de eerste zes maanden van het boekjaar die van invloed zijn in de balans en de winst-
      en verliesrekening.
    url: https://wetten.overheid.nl/BWBR0024950/2019-07-21#Artikel2
  - number: '3'
    text: |-
      1 Het halfjaarlijks bestuursverslag van een uitgevende instelling, bedoeld in
      [artikel 5:25d, negende lid, van de wet][ref1], die verplicht is een geconsolideerde jaarrekening op te maken,
      bevat:

      a. de transacties met verbonden partijen die in de eerste zes maanden van het lopende boekjaar hebben
      plaatsgevonden en die materiële gevolgen hebben gehad voor de financiële positie of resultaten van de uitgevende
      instelling in die periode; en

      b. alle wijzigingen in de in het laatste algemeen verkrijgbaar gestelde bestuursverslag beschreven transacties met
      verbonden partijen die materiële gevolgen kunnen hebben voor de financiële positie of resultaten van de uitgevende
      instelling in de eerste zes maanden van het lopende boekjaar.

      2 Indien de uitgevende instelling, bedoeld in [artikel 5:25d, negende lid, van de wet][ref2] niet verplicht is een
      geconsolideerde jaarrekening op te maken, vermeldt het halfjaarlijks bestuursverslag ten minste de van betekenis
      zijnde transacties door de rechtspersoon niet onder normale marktvoorwaarden met een verbonden een partij zijn
      aangegaan, de omvang van die transacties, de aard van de betrekking met de verbonden partij, alsmede andere
      informatie over die transacties die nodig is voor het verschaffen van inzicht in de financiële positie van de
      rechtspersoon. Informatie over individuele transacties kan overeenkomstig de aard ervan worden samengevoegd, tenzij
      gescheiden informatie nodig is om inzicht te verschaffen in de gevolgen van transacties met verbonden partijen voor
      de financiële positie van de rechtspersoon. Vermelding van transacties tussen twee of meer leden van een groep kan
      achterwege blijven, mits dochtermaatschappijen die partij zijn bij de transactie geheel in eigendom zijn van een of
      meer leden van de groep.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel525d
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel525d
