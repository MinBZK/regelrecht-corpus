        artikel: 5:25m
      - id: ref2
        bwb_id: BWBR0024950
        artikel: '6'
        hoofdstuk: IV
  - number: '6'
    text: |-
      Desgevraagd verstrekt de uitgevende instelling de volgende informatie aan de Autoriteit Financiële Markten:

      a. de naam van de persoon die de gereglementeerde informatie algemeen verkrijgbaar heeft gesteld;

      b. de bijzonderheden over de beveiligingsvalidering;

      c. de datum en het tijdstip waarop het persbericht, bedoeld in [artikel 5:25m, tweede lid, van de wet][ref1]
      algemeen verkrijgbaar is gesteld;

      d. de drager waarop de gereglementeerde informatie algemeen verkrijgbaar is gesteld;

      e. de bijzonderheden over een eventueel embargo dat de uitgevende instelling voorafgaand aan de algemeen
      verkrijgbaarstelling op de gereglementeerde informatie heeft gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel525m
    url: https://wetten.overheid.nl/BWBR0024950/2019-07-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:25m
  - number: '7'
    text: |-
      1 Als instantie die belast is met de opslag van gereglementeerde informatie als bedoeld in
      [artikel 5:25m, vierde lid, van de wet][ref1] wordt de Autoriteit Financiële Markten aangewezen.

      2 De Autoriteit Financiële Markten draagt er zorg voor dat:

      a. de veiligheid van de opgeslagen gereglementeerde informatie zodanig gewaarborgd is dat het risico op
      gegevenswijziging en ongeoorloofde toegang zo veel mogelijk is uitgesloten en zekerheid bestaat over de bron van de
      gereglementeerde informatie;

      b. de gereglementeerde informatie op het moment van opslag wordt voorzien van een datum en tijdstempel;

      c. de opgeslagen gereglementeerde informatie op een eenvoudige wijze en uiterlijk binnen vijf werkdagen na
      ontvangst toegankelijk is voor het publiek; en

      d. de centrale opslag van gereglementeerde informatie op zodanig wijze wordt ingericht dat samenwerking met
      andere instanties die belast zijn met de centrale opslag van gereglementeerde informatie op eenvoudige wijze kan
      plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel525m
    url: https://wetten.overheid.nl/BWBR0024950/2019-07-21#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:25m
  - number: '8'
    text: |-
      1 Het bestuursverslag van een uitgevende instelling met zetel in een staat die geen lidstaat is en waarvan
      Nederland lidstaat van herkomst is, die ingevolge [artikel 5:25v van de wet][ref1] haar jaarlijkse financiële
      verslaggeving opmaakt overeenkomstig de in die staat geldende wettelijke voorschriften dient ten minste te
      bevatten:

      a. een getrouw beeld van de ontwikkeling en de resultaten van de uitgevende instelling en haar groep en van de
      positie van de uitgevende instelling, alsmede een beschrijving van de voornaamste risico’s en onzekerheden waarmee
      zij geconfronteerd wordt. Het bestuursverslag bevat een evenwichtige en volledige analyse van de ontwikkeling en
      de resultaten van de uitgevende instelling en haar groep en van de positie van de uitgevende instelling die in
      overeenstemming is met de omvang en de complexiteit van het bedrijf;

      b. informatie over de belangrijke gebeurtenissen die na het einde van het boekjaar hebben plaatsgevonden; en

      c. informatie over de verwachte ontwikkeling van de uitgevende instelling.

      2 De in het eerste lid, onderdeel a, bedoelde analyse bevat de essentiële voor de specifieke uitgevende instelling
      en haar groep relevante financiële en, voor zover van toepassing, niet-financiële prestatie-indicatoren die nodig
      zijn om inzicht te krijgen in de ontwikkeling, resultaten en positie van de uitgevende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel525v
    url: https://wetten.overheid.nl/BWBR0024950/2019-07-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:25v
  - number: '9'
    text: |-
      1 Het halfjaarlijks bestuursverslag van een uitgevende instelling met zetel in een staat die geen lidstaat is en
      waarvan Nederland lidstaat van herkomst is, die ingevolge [artikel 5:25v van de wet][ref1] haar halfjaarlijkse
      financiële verslaggeving opmaakt overeenkomstig de in die staat geldende wettelijke voorschriften dient ten minste
      te bevatten:

      a. een overzicht van de verslagperiode; en

      b. informatie over de waarschijnlijke toekomstige ontwikkeling van de uitgevende instelling in de resterende zes
      maanden van het boekjaar.

      2 Indien het een uitgevende instelling als bedoeld in het eerste lid betreft waarvan aandelen zijn toegelaten
      tot de handel op een gereglementeerde markt, vermeldt het halfjaarlijks bestuursverslag eveneens de belangrijkste
      transacties met verbonden partijen voor zover deze niet al doorlopend worden bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel525v
    url: https://wetten.overheid.nl/BWBR0024950/2019-07-21#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:25v
  - number: '10'
    text: |-
      Een uitgevende instelling met zetel in een staat die geen lidstaat is en waarvan Nederland lidstaat van
      herkomst is, die ingevolge [artikel 5:25v van de wet][ref1] haar halfjaarlijkse financiële verslaggeving opmaakt
      overeenkomstig de in die staat geldende wettelijke voorschriften neemt in haar halfjaarlijkse en jaarlijkse
      financiële verslaggeving verklaringen op van de personen die krachtens de wetgeving van die staat verantwoordelijk
      zijn voor de jaarlijkse en halfjaarlijkse financiële verslaggeving ten aanzien van in elk geval:

      a. de conformiteit van de financiële overzichten met de toepasselijke verslaggevingsvoorschriften; en

      b. de getrouwheid van het overzicht in het bestuursverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel525v
    url: https://wetten.overheid.nl/BWBR0024950/2019-07-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:25v
  - number: '11'
    text: |-
      1 Een consolidatieplichtige uitgevende instelling met zetel in een staat die geen lidstaat is en waarvan Nederland
      lidstaat van herkomst is en die ingevolge [artikel 5:25v van de wet][ref1] haar jaarlijkse financiële verslaggeving
      opmaakt overeenkomstig de in die staat geldende wettelijke voorschriften en die op grond van de op haar
      toepasselijke wetgeving niet verplicht is haar enkelvoudige jaarrekening algemeen verkrijgbaar te stellen, neemt in
      haar geconsolideerde jaarrekening ten minste de volgende informatie op:

      a. indien het een uitgevende instelling betreft waarvan aandelen zijn toegelaten tot de handel op een
      gereglementeerde markt, de dividendberekening en het vermogen om dividend uit te keren; en

      b. de minimumvereisten ten aanzien van kapitaal en eigen vermogen, alsmede informatie over haar liquiditeit.

      2 De uitgevende instelling, bedoeld in het eerste lid, verstrekt op verzoek van de Autoriteit Financiële Markten
      aanvullende gecontroleerde informatie over haar enkelvoudige jaarrekening indien dit voor het begrip van de in het
      eerste lid, onderdelen a en b, bedoelde informatie van belang zijn. Deze informatie kan worden opgesteld volgens de
      standaarden voor de jaarrekeningen van het land waar de uitgevende instelling haar zetel heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel525v
    url: https://wetten.overheid.nl/BWBR0024950/2019-07-21#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:25v
  - number: '12'
    text: |-
      1 Een niet-consolidatieplichtige uitgevende instelling met zetel in een staat die geen lidstaat is en waarvan
      Nederland lidstaat van herkomst is en die ingevolge [artikel 5:25v van de wet][ref1] haar jaarlijkse financiële
      verslaggeving opmaakt overeenkomstig de in die staat geldende wettelijke voorschriften, stelt haar enkelvoudige
      jaarrekening op overeenkomstig artikel 3 van de IAS-verordening goedgekeurde voorschriften tenzij de in de
      desbetreffende staat geldende of toegelaten verslaggevingsvoorschriften daaraan gelijkwaardig zijn, in welk geval
      de uitgevende instelling opmaakt overeenkomstig de in die staat geldende wettelijke voorschriften.

      2 Indien de jaarrekening bedoeld in het eerste lid niet overeenkomstig artikel 3 van de IAS-verordening
      goedgekeurde voorschriften is opgesteld, presenteert de uitgevende instelling deze jaarrekening in de vorm van
      aangepaste financiële overzichten.

      3 De jaarrekening, bedoeld in het eerste lid, dient door een accountant worden gecontroleerd. Indien de
      jaarrekening is opgesteld overeenkomstig de in de die staat die geen lidstaat is geldende voorschriften,
      kan de controle worden verricht door een onafhankelijk accountant, niet zijnde een accountant als bedoeld in
      [artikel 5:25a, van de wet][ref2] die bevoegd is tot controle van de jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel525v
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel525a
    url: https://wetten.overheid.nl/BWBR0024950/2019-07-21#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:25v
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 5:25a
  - number: '13'
    text: |-
      Het prospectus, bedoeld in [artikel 5:3 van de wet][ref1], bevat ten minste de gegevens, bedoeld in artikel 23,
      eerste en tweede lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel53
    url: https://wetten.overheid.nl/BWBR0024950/2019-07-21#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:3
  - number: '14'
    text: |-
      De jaarlijkse financiële verslaggeving, bedoeld in [artikel 5:25c van de wet][ref1], bevat ten minste de gegevens
      bedoeld in artikel 22, tweede lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel525c
    url: https://wetten.overheid.nl/BWBR0024950/2019-07-21#Artikel14
