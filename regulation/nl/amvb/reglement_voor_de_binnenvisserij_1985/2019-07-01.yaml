preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij, van 23 juli 1997, no. J. 977964,
    Directie Juridische Zaken;

    Gelet op artikel 16 van de Visserijwet 1963;

    De Raad van State gehoord (advies van 12 augustus 1997, no. W11.97.0503);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 11 november 1997, No. J.
    9712264, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.a
    text: '«boezemmaas»: nauwste maas bij meerwandige netten;'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.b
    text: |-
      «maaswijdte»: lengte van de zonder bijzondere krachtsinspanning tussen haar eindknopen gestrekte, doch niet gerekte
      maas, nat gemeten, met dien verstande, dat bij meerwandige netten deze meting wordt toegepast op de boezemmaas;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.c
    text: |-
      «fuik»: vistuig, bestaande uit om twee of meer hoepels gespannen netwerk, voorzien van één of meer inkelingen, aan
      de voorzijde al dan niet voorzien van één of twee vleugels;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.d
    text: '«visfuik»: fuik waarvan het netwerk, met uitzondering van de inkelingen, een maaswijdte heeft van tenminste 45 mm;'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.e
    text: '«aalfuik»: fuik waarvan het netwerk een maaswijdte heeft van ten hoogste 35 mm;'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.f
    text: |-
      «ankerkuil»: vistuig bestaande uit een trechtervormig net dat aan de voorzijde wordt opengehouden door een
      rechthoekig raamwerk of twee horizontale bomen, voorzien van een inkeling waarbij het gedeelte achter de inkeling
      is opgehoepeld aan tenminste drie hoepels, welke niet meer dan 1 m van elkaar verwijderd zijn, terwijl de zich
      achter het opgehoepelde deel bevindende zak korter is dan 50 cm;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.g
    text: |-
      «aalkistje»: vistuig bestaande uit een langwerpige doos waarin aan de uiteinden inkelingen zijn aangebracht,
      waarin ten minste in elke inkeling één zuiver rond ringetje van metaal of enige andere niet rekbare stof met een
      middellijn van tenminste 12 mm binnenwerks is aangebracht of, waarin in de zijwanden tenminste twee gaten met een
      middellijn van tenminste 12 mm binnenwerks zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.h
    text: |-
      «aalhoekwant»: vistuig bestaande uit een lange lijn met daaraan aan zijlijntjes bevestigde enkeltandige haken,
      waarvan de kortste afstand tussen de punt en de steel tenminste 7 mm bedraagt;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.i
    text: |-
      «aaldogger»: vistuig bestaande uit een drijver met een daaraan bevestigde lijn voorzien van één enkeltandige haak,
      waarvan de kortste afstand tussen de punt en de steel tenminste 7 mm bedraagt;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.j
    text: |-
      «zegen»: vistuig bestaande uit een van drijvers voorziene bovenpees en een verzwaarde onderpees met daartussen het
      netwerk met een, al dan niet van een inkeling voorziene uitstulping of zak en waarvan de aan de boven- en onderpees
      bevestigde lijnen een lengte van ten hoogste 100 m hebben of, in geval de bovenpees langer is, niet langer dan de
      lengte van de bovenpees;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.k
    text: |-
      «aalzegen»: zegen waarvan de bovenpees ten hoogste 40 m lengte heeft en het netwerk een maaswijdte van ten hoogste
      25 mm;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.l
    text: |-
      «aaskuil»: vistuig bestaande uit een trechtervormig net met in de laatste 5 m een maaswijdte van ten hoogste 20
      mm, aan de voorzijde of bek voorzien van een van drijvers voorziene bovenpees en een verzwaarde onderpees, niet
      voorzien van een inkeling en waarvan de bovenpees ten hoogste 7 m lengte heeft;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.m
    text: |-
      «staand net»: vistuig bestaande uit een van drijvers voorziene bovenpees en een verzwaarde onderpees met daartussen
      een één- of meerwandig netwerk, hetwelk noch door de stroom noch door enigerlei trekkracht wordt voortbewogen;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.n
    text: |-
      «gebbe»: vistuig bestaande uit een boom van tenminste 3 m lengte met daaraan bevestigd een vork waartussen netwerk
      met een maaswijdte van ten hoogste 25 mm is aangebracht;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.o
    text: |-
      «kruisnet»: vistuig bestaande uit een netwerk met een maaswijdte van ten hoogste 25 mm dat op enigerlei wijze wordt
      opengehouden en aan één centraal bevestigde lijn wordt opgehaald;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.p
    text: |-
      «electrovisapparaat»: vistuig bestaande uit één of twee negatieve polen en één positieve pool waartussen met al of
      niet pulserende gelijkstroom een spanningsverschil wordt opgewekt;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.q
    text: |-
      «kreeftenkorf»: vistuig bestaande uit een frame van kunststof of een ander niet vervormbaar materiaal, met een
      maximale afmeting van 100 cm lengte, 100 cm breedte en 60 cm hoogte, voorzien van een niet vervormbare omkleding,
      dan wel een omkleding van netwerk, met een open inzwemopening met een inkeling van niet vervormbaar materiaal met
      een doorsnede van minimaal 20 mm;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.1.r
    text: |-
      «schepnet»: vistuig bestaande uit een aan een stok of steel gemonteerd frame dat voorzien is van een zakvormig
      knoop- of strikwerk waarvan de diepte ten hoogste 150 cm bedraagt, en een framebreedte heeft van ten hoogste 100
      cm, een framehoogte van ten hoogste 80 cm, dan wel een frameoppervlak van ten hoogste 0,8 m2.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder het IJsselmeer mede verstaan de daaraan gelegen open
      havens.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: '1.3'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder het IJsselmeer mede verstaan het Markermeer en het
      IJmeer.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: '1.4'
    text: 'Waar het IJsselmeer in verbinding staat met andere binnenwateren geldt als grens:'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.4.a
    text: waar geen open verbinding is, de dichtst bij het IJsselmeer gelegen waterkering;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: 1.4.b
    text: |-
      waar een open verbinding is, de lijn gaande over de uitmonding, met dien verstande dat de grensscheiding tussen
      het Gooi- en Eemmeer en het IJsselmeer wordt gevormd door de as van de verkeersbrug nabij Muiderberg en dat
      de grensscheiding tussen het Ketelmeer en het IJsselmeer wordt gevormd door de as van de verkeersbrug nabij de
      Zwolsche Hoek.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel1
  - number: '2.1'
    text: 'Het is verboden te vissen met andere vistuigen dan de volgende:'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.a
    text: de hengel;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.b
    text: de peur;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.c
    text: de kreeftenkorf;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.d
    text: de visfuik;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.e
    text: de aalfuik;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.f
    text: de ankerkuil;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.g
    text: het aalkistje;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.h
    text: het aalhoekwant;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.i
    text: de aaldogger;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.j
    text: de zegen;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.k
    text: de aalzegen;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.l
    text: de aaskuil;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.m
    text: het staand net;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.n
    text: de gebbe;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.o
    text: het kruisnet;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.p
    text: het electrovisapparaat;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.1.q
    text: het schepnet.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: '2.2'
    text: 'Het gebruik van een schepnet is slechts toegestaan om:'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.2.a
    text: gevangen vis op te scheppen of over te zetten, of
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: 2.2.b
    text: vis te vangen, mits de gevangen vis levend in hetzelfde water wordt teruggezet.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden te vissen met een vistuig waarvan het netwerk van metaal- of niet vervormend kunststofgaas is
      vervaardigd, met uitzondering van de kreeftenkorf.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel2
  - number: '3'
    text: |-
      Het is degene die vist met de hengel of de peur verboden de daarmee gevangen vis in de handel te brengen, te koop
      aan te bieden of te vervreemden.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel3
  - number: '4.1'
    text: |-
      Het is verboden met de volgende vistuigen te vissen, indien de maaswijdte kleiner is dan het aantal millimeters,
      vermeld achter het desbetreffende vistuig:
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel4
  - number: 4.1.a
    text: 'de aalzegen en het kruisnet: 20 mm'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel4
  - number: 4.1.b
    text: 'de ankerkuil: 25 mm'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel4
  - number: 4.1.c
    text: 'het staand net: 101 mm'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel4
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid, onderdeel c, kan bij ministeriële regeling worden bepaald dat het in een daarbij
      te bepalen periode verboden is met het staand net te vissen, indien de maaswijdte kleiner is dan het in die
      regeling genoemde aantal millimeters.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel4
  - number: '4.3'
    text: |-
      Het is verboden met de aalfuik te vissen, indien de maaswijdte kleiner is dan 20 mm tenzij in de buitenwand daarvan
      een aantal zuiver ronde ringetjes van metaal of enige andere niet rekbare stof met een middellijn van tenminste 13
      mm binnenwerks zijn geplaatst binnen 20 mazen achter de aanhechting van de laatste inkeling of de laatste hoepel
      aan de bovenzijde van de fuik. Dit aantal bedraagt bij 300 of minder mazen opzet om de eerste hoepel achter de
      vleugels tenminste twee en bij meer dan 300 mazen opzet om de eerste hoepel achter de vleugels tenminste vier.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel4
  - number: '4.4'
    text: |-
      Het is verboden te vissen met een vistuig,, indien met betrekking tot dat vistuig enige handeling is verricht of
      enig middel is aangewend, waardoor het ontsnappen van vis kan worden bemoeilijkt of belet.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel4
  - number: '5.1'
    text: |-
      Het is verboden een vistuig door het water voort te trekken, anders dan om in het water te brengen, te lichten, op
      te halen of binnen te halen.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel5
  - number: '5.2'
    text: 'Het verbod geldt niet voor het vissen met:'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel5
  - number: 5.2.a
    text: de hengel;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel5
  - number: 5.2.b
    text: de peur;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel5
  - number: 5.2.c
    text: het schepnet;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel5
  - number: 5.2.d
    text: de aaskuil in het IJsselmeer;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel5
  - number: 5.2.e
    text: |-
      de zegen, mits deze is voorzien van een bovenpees van een lengte van meer dan 100 m en wordt voortgetrokken met een
      snelheid van minder dan 2 km/uur, gemeten ten opzichte van het water.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel5
  - number: '6.1'
    text: 'Het is verboden te vissen van 1 april tot en met 31 mei met:'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel6
  - number: 6.1.a
    text: |-
      de hengel, voor zover geaasd met slachtproducten, een dood visje, een stukje vis of enig kunstaas met uitzondering
      van kunstvliegen met een afmeting van ten hoogste 2,5 cm;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel6
  - number: 6.1.b
    text: de visfuik;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel6
  - number: 6.1.c
    text: de ankerkuil;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel6
  - number: 6.1.d
    text: de zegen;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel6
  - number: 6.1.e
    text: het staand net.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel6
  - number: '6.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt niet voor het vissen in de wateren van Walcheren, Schouwen-Duiveland,
      Tholen en Noord-Beveland, in het kanaal van Zuid-Beveland, in de Haven van Goes, in het Veerse Meer en het
      Grevelingenmeer en in de met die meren in open gemeenschap staande inhammen, kreken, spranken, killen en gaten.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel6
  - number: '6.3'
    text: |-
      Het verbod, bedoeld in het eerste lid, onderdeel a, voor zover het kunstaas betreft, geldt niet voor het vissen in
      de Geul en haar zijbeken.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel6
  - number: '6.4'
    text: |-
      Onze Minister kan het vissen verbieden in een of meer door hem aan te wijzen wateren met één of meer door hem aan
      te wijzen vistuigen gedurende het gehele jaar dan wel gedurende een nader te bepalen gedeelte van het jaar. Daarbij
      kan worden afgeweken van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel6
  - number: '7.1'
    text: Het is verboden tussen twee uur na zonsondergang en één uur voor zonsopgang te vissen.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel7
  - number: '7.2'
    text: 'Het verbod geldt niet:'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel7
  - number: 7.2.a
    text: voor het vissen met de hengel in andere dan door Onze Minister aangewezen wateren;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel7
  - number: 7.2.b
    text: voor het vissen met de peur, het aalkistje, het aalhoekwant en de aaldogger;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel7
  - number: 7.2.c
    text: voor het te water hebben van de aalfuik, het staand net, de visfuik, de ankerkuil en de kreeftenkorf;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel7
  - number: 7.2.d
    text: voor het vissen met de aalzegen in andere wateren dan het IJsselmeer;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel7
  - number: 7.2.e
    text: |-
      voor het vissen in de Rijn, de Maas, de IJssel en alle andere stromende wateren die met deze wateren in open
      verbinding staan en daarvan water afvoeren.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel7
  - number: 7a.1
    text: |-
      Het is verboden te vissen met de vistuigen genoemd in [artikel 2, eerste lid, onderdelen c tot en met q][ref1],
      tenzij dat vissen plaatsvindt in het IJsselmeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel2
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '2'
  - number: 7a.2
    text: |-
      Het verbod is niet van toepassing op de visrechthebbende en de houder van een schriftelijke toestemming, als
      bedoeld in [artikel 21, tweede lid, onderdeel a, van de Visserijwet 1963][ref1], die beroepsmatig de visserij
      uitoefent en voldoet aan bij ministeriële regeling gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel21
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '21'
  - number: '8.1'
    text: |-
      Het is verboden te vissen in het IJsselmeer zonder voorzien te zijn van een vergunning van Onze Minister geldende
      voor de visserij, welke wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel8
  - number: '8.2'
    text: Het verbod geldt niet voor zover wordt gevist met ten hoogste twee hengels.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel8
  - number: '9.1'
    text: Bij ministeriële regeling kan het vissen bij vispassages, stuwen, sluizen of gemalen worden verboden.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel9
  - number: '9.2'
    text: 'Bij de regeling, bedoeld in het eerste lid, wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel9
  - number: 9.2.a
    text: op welk water het verbod van toepassing is;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel9
  - number: 9.2.b
    text: op welke vispassage, stuw, sluis of gemaal het verbod van toepassing is;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel9
  - number: 9.2.c
    text: binnen welke afstand tot de vispassage, stuw, sluis of gemaal het verbod van toepassing is.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel9
  - number: '9.3'
    text: |-
      Bij de regeling, bedoeld in het eerste lid, kan worden bepaald dat het verbod niet van toepassing is, indien aan
      bij die regeling te stellen voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel9
  - number: '9.4'
    text: 'De voorwaarden, bedoeld in het derde lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel9
  - number: 9.4.a
    text: de vistuigen waarmee wordt gevist;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel9
  - number: 9.4.b
    text: de periode waarin wordt gevist;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel9
  - number: 9.4.c
    text: het terugzetten van gevangen vis.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel9
  - number: '10.1'
    text: 'Het is verboden op of in de nabijheid van enig binnenwater een of meer vistuigen voorhanden te hebben indien:'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel10
  - number: 10.1.a
    text: |-
      het gebruik daarvan in het betrokken water bij of krachtens de [artikelen 2 tot en met 9][ref1] verboden is;


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel2
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '2'
  - number: 10.1.b
    text: men niet bevoegd is daarmee te vissen;
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel10
  - number: 10.1.c
    text: men niet gerechtigd is in het betrokken water daarmee te vissen.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel10
  - number: '10.3'
    text: |-
      Het is verboden op het IJsselmeer, anders dan in een haven, vistuig aan boord van een vissersvaartuig als bedoeld
      in [artikel 1, onderdeel b, van het Besluit registratie vissersvaartuigen 1998][ref1] te hebben, indien het gebruik
      daarvan, ingevolge het bij of krachtens dit besluit bepaalde, verboden is.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel1
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '1'
  - number: 10a.1
    text: |-
      Een ieder die vis van de door Onze Minister aangewezen soorten aanvoert, aan- of verkoopt of onder zich houdt, of
      die bemiddeling verleent bij het veilen van die vis, is verplicht een administratie te voeren en aan Onze Minister
      periodiek of op verzoek opgave te doen van de hoeveelheden vis door hem aangevoerd, aan- of verkocht, onder zich
      gehouden, dan wel aan hem ter veiling aangeboden.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel10a
  - number: 10a.2
    text: |-
      In aanvulling op het eerste lid, is een ieder die vis van de door Onze Minister aangewezen soorten aanvoert, tevens
      verplicht een administratie te voeren en aan Onze Minister periodiek of op verzoek opgave te doen van andere bij
      ministeriële regeling aangewezen gegevens betreffende visserij-inspanning, dan wel andere gegevens die van belang
      kunnen zijn voor het bepalen van de visstand in het IJsselmeer.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel10a
  - number: 10a.3
    text: |-
      Onze Minister stelt nadere regels ten aanzien van de eisen waaraan de in het eerste lid bedoelde administratie
      dient te voldoen en de wijze waarop de in dat lid bedoelde opgave dient te geschieden, en kan voorschriften geven
      in het belang van de naleving van deze regels.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel10a
  - number: 10b
    text: |-
      In het belang van de visserij is Onze Minister bevoegd regelen te stellen ter uitvoering van op grond van
      internationale overeenkomsten of van besluiten van volkenrechtelijke organisaties opgelegde verplichtingen of
      verleende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel10b
  - number: '11'
    text: Onze Minister kan vrijstelling of ontheffing verlenen van de bepalingen bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel11
  - number: '12'
    text: |-
      Aan vrijstellingen, ontheffingen en vergunningen als bedoeld in de vorige artikelen kunnen voorschriften worden
      verbonden. Zij kunnen onder beperkingen worden verleend. Zij kunnen te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel12
  - number: '13'
    text: |-
      Na inwerkingtreding van dit besluit berusten de krachtens het Reglement voor de binnenvisserij 1985 vastgestelde
      regels en andere besluiten op dit besluit.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel13
  - number: '14'
    text: Het Reglement voor de binnenvisserij 1985 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel14
  - number: '15'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Reglement voor de binnenvisserij 1985.'
    url: https://wetten.overheid.nl/BWBR0009027/2019-07-01#Artikel16
