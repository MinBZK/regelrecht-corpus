preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 15 februari 2008, nr. HDJZ-SCH-2008-43,
    Hoofddirectie Juridische Zaken;


    Gelet op de op 17 oktober 1868 te Mannheim tot stand gekomen Herziene Rijnvaartakte (Trb. 1955, 161, en 1964, 83),
    de resolutie van de Centrale Commissie voor de Rijnvaart van 31 mei 2007 (protocol 2007-I-10), artikel 26a van de
    Binnenschepenwet, artikel 5 van de Wet vaartijden en bemanningssterkte binnenvaart en de artikelen 4, 9, 10, tweede
    lid, en 18 van de Scheepvaartverkeerswet;


    De Raad van State gehoord (advies van 22 februari 2008, nr. W09.08.0063/IV);


    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 4 maart 2008, nr. HDJZ/SCH/2008-255,
    Hoofddirectie Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0023693/2008-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de Rijn in Nederland met inbegrip van de Waal en de Lek is van kracht het [Patentreglement Rijn][ref1]
      met inbegrip van de daarbij behorende bijlagen, dat is gevoegd bij dit besluit en dat kan worden aangehaald als:
      [Patentreglement Rijn][ref2].

      2 Onverminderd het eerste lid zijn de bepalingen met betrekking tot de radarpatenten van het
      [Patentreglement Rijn][ref3] van toepassing op alle binnenwateren in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0023698
      [ref2]: https://wetten.overheid.nl/BWBR0023698
      [ref3]: https://wetten.overheid.nl/BWBR0023698
    url: https://wetten.overheid.nl/BWBR0023693/2008-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023698
      - id: ref2
        bwb_id: BWBR0023698
      - id: ref3
        bwb_id: BWBR0023698
  - number: '2'
    text: |-
      Onze Minister van Verkeer en Waterstaat bepaalt wie de bevoegde autoriteit is, of de bevoegde autoriteiten zijn,
      bedoeld in het [Patentreglement Rijn][ref1]. Van de desbetreffende beschikking wordt mededeling gedaan in de
      *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0023698
    url: https://wetten.overheid.nl/BWBR0023693/2008-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023698
  - number: '3'
    text: >-
      Bij ministeriële regeling worden richtlijnen vastgesteld voor de bevoegde autoriteit, overeenkomstig de door de
      Centrale Commissie voor de Rijnvaart aangenomen resoluties.
    url: https://wetten.overheid.nl/BWBR0023693/2008-04-01#Artikel3
  - number: '4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de procedure voor het examen,
      bedoeld in [hoofdstuk 2, paragraaf 3][ref1] en [hoofdstuk 3 van het Patentreglement Rijn][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023698#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0023698#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023693/2008-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023698
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0023698
        hoofdstuk: '3'
  - number: '5'
    text: |-
      Bij ministeriële regeling kunnen andere radardiploma’s als gelijkwaardig aan het radarpatent, bedoeld in het
      [Patentreglement Rijn][ref1], worden erkend, waarbij de erkenning beperkt kan worden tot nader te bepalen
      scheepvaartwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0023698
    url: https://wetten.overheid.nl/BWBR0023693/2008-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023698
  - number: '6'
    text: |-
      Bij ministeriële regeling worden de kosten, bedoeld in [artikel 2.18][ref1] en
      [artikel 3.08 van het Patentreglement Rijn][ref2], vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0023698#Artikel2.18
      [ref2]: https://wetten.overheid.nl/BWBR0023698#Artikel3.08
    url: https://wetten.overheid.nl/BWBR0023693/2008-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023698
        artikel: '2.18'
      - id: ref2
        bwb_id: BWBR0023698
        artikel: '3.08'
  - number: '11'
    text: |-
      Het [Besluit Reglement radarpatenten][ref1] en het [Besluit Reglement Rijnpatenten 1998][ref2] worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010916
      [ref2]: https://wetten.overheid.nl/BWBR0008935
    url: https://wetten.overheid.nl/BWBR0023693/2008-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010916
      - id: ref2
        bwb_id: BWBR0008935
  - number: '12'
    text: Dit besluit treedt in werking met ingang van 1 april 2008
    url: https://wetten.overheid.nl/BWBR0023693/2008-04-01#Artikel12
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit Patentreglement Rijn.'
    url: https://wetten.overheid.nl/BWBR0023693/2008-04-01#Artikel13
