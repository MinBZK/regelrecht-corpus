$id: besluit_ongeregeld_luchtvervoer
regulatory_layer: AMVB
publication_date: '2009-03-31'
valid_from: '2010-06-12'
bwb_id: BWBR0002965
url: https://wetten.overheid.nl/BWBR0002965/2010-06-12
preamble:
  text: >-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 7 april 1975, nr. Jur/L 21 811,
    Rijksluchtvaartdienst;


    Gelet op artikel 76, eerste lid onder k en l, van de Luchtvaartwet;


    De Raad van State gehoord (advies van 16 april 1975, nr. 17);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 24 april 1975, nr. Jur/L 22 143,
    Rijksluchtvaartdienst;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002965/2010-06-12#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder ongeregeld vervoer: vluchten die niet onder
      een bilaterale luchtvaartovereenkomst vallen tenzij in een dergelijke overeenkomst daarover anderszins is bepaald.
    url: https://wetten.overheid.nl/BWBR0002965/2010-06-12#Artikel1
  - number: '2'
    text: >-
      Dit besluit is van toepassing op alle vluchten in ongeregeld vervoer door luchtvaartmaatschappijen in, naar of uit
      Nederland of met Nederland als tussenstation uit of naar landen niet behorende tot de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0002965/2010-06-12#Artikel2
  - number: '3'
    text: >-
      Voor zover bij internationale overeenkomst niet anders is bepaald mogen vluchten in ongeregeld vervoer
      slechts worden uitgevoerd krachtens een daartoe strekkende toestemming door Onze Minister aan de betrokken
      luchtvaartmaatschappij.
    url: https://wetten.overheid.nl/BWBR0002965/2010-06-12#Artikel3
  - number: '4'
    text: |-
      Het bepaalde in [artikel 3][ref1] geldt niet, indien door Onze Minister daarvan ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002965#Artikel3
    url: https://wetten.overheid.nl/BWBR0002965/2010-06-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002965
        artikel: '3'
        hoofdstuk: II
  - number: '6'
    text: >-
      Bij het beslissen op een aanvraag voor ongeregeld luchtvervoer wordt in ieder geval rekening gehouden met:


      a. het mogelijke negatieve effect van ongeregeld vervoer op de rentabiliteit van een reeds bestaande geregelde
      vlucht naar dezelfde bestemming;


      b. het belang van de gebruikers bij een aan hun behoefte aangepast ongeregeld vervoer tegen een zo laag mogelijke
      prijs;


      c. het uitgangspunt van wederkerigheid.
    url: https://wetten.overheid.nl/BWBR0002965/2010-06-12#Artikel6
  - number: '7'
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot het uitvoeren van vluchten als bedoeld in
      [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002965#Artikel2
    url: https://wetten.overheid.nl/BWBR0002965/2010-06-12#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002965
        artikel: '2'
        hoofdstuk: I
  - number: '12'
    text: Dit besluit kan worden aangeduid als "Besluit ongeregeld luchtvervoer".
    url: https://wetten.overheid.nl/BWBR0002965/2010-06-12#Artikel12
  - number: '13'
    text: >-
      Dit besluit treedt in werking met ingang van de derde kalendermaand na de datum van uitgifte van het *Staatsblad*,
      waarin het is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002965/2010-06-12#Artikel13
