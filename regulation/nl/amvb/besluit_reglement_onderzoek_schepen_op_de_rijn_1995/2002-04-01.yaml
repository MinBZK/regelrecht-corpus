preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat, van 27 april 1995, nr. RV 195480, Hoofddirectie van
    de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;


    Gelet op de op 17 oktober 1868 te Mannheim tot stand gekomen Herziene Rijnvaartakte (Trb. 1955, 161, en 1964, 83)
    en op de resoluties van de Centrale Commissie voor de Rijnvaart van 18 mei 1994 en 18 mei 1995 (protocollen 1994-I-
    23 en 1995-I-18);


    De Raad van State gehoord (advies van 3 oktober 1995, no. W09.95 0213);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat, van 16 januari 1996, nr. RV 209415,
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007857/2002-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      Voor de Rijn in Nederland met inbegrip van de Waal en de Lek is van kracht het Reglement betreffende het onderzoek
      van schepen op de Rijn 1995 met de daarbij behorende bijlagen, dat is gevoegd bij dit besluit en dat kan worden
      aangehaald als: Reglement onderzoek schepen op de Rijn 1995.
    url: https://wetten.overheid.nl/BWBR0007857/2002-04-01#Artikel1
  - number: '2'
    text: >-
      Onze Minister van Verkeer en Waterstaat bepaalt wie de bevoegde autoriteit onderscheidenlijk de plaatselijk
      bevoegde autoriteit is, of de bevoegde autoriteiten zijn, bedoeld in het Reglement onderzoek schepen op de Rijn
      1995. Van de desbetreffende beschikking wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007857/2002-04-01#Artikel2
  - number: '3'
    text: >-
      Bij regeling van Onze Minister van Verkeer en Waterstaat wordt een regeling vastgesteld betreffende de werkwijze
      van de Commissies van Deskundigen voor de Rijnvaart en worden de vergoedingen vastgesteld, welke de leden van de
      Commissies van Deskundigen ontvangen voor de door hen verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007857/2002-04-01#Artikel3
  - number: '4'
    text: >-
      Bij regeling van Onze Minister van Verkeer en Waterstaat worden richtlijnen en aanwijzingen aan de Commissies van
      Deskundigen voor de Rijnvaart gegeven overeenkomstig de door de Centrale Commissie voor de Rijnvaart aangenomen
      resoluties.
    url: https://wetten.overheid.nl/BWBR0007857/2002-04-01#Artikel4
  - number: '5'
    text: >-
      1 De schipper van een schip dat de Rijn bevaart is verantwoordelijk voor de naleving van de artikelen 1.03 tot
      en met 1.05, van de hoofdstukken 3 tot en met 22, met uitzondering van de artikelen 8.07, derde lid, 9.07, derde
      lid, 12.01, derde en vierde lid, 14.15, tweede en derde lid, 15.05, eerste lid, en 16.06, eerste lid, en van de
      artikelen 23.01, eerste lid, tweede lid, derde alinea, en derde lid, 23.02, 23.03, 23.04, eerste, derde en vijfde
      lid, onderdeel 1, 23.05, 23.06, eerste lid, 23.07, en 23.08, eerste, derde, vierde en vijfde lid, van het Reglement
      onderzoek schepen op de Rijn 1995.


      2 De eigenaar van een schip dat de Rijn bevaart is verantwoordelijk voor de naleving van de artikelen 1.03 tot
      en met 1.05, 2.08, eerste lid, 2.09, eerste lid, van de hoofdstukken 3 tot en met 22, met uitzondering van de
      artikelen 8.07, derde lid, 9,07, derde lid, 12.01, derde en vierde lid, 14.15, tweede en derde lid, 15.05, eerste
      lid, en 16.06, eerste lid, en van artikel 23.09, eerste lid, van het Reglement onderzoek schepen op de Rijn 1995.


      3 De werkgever van de bemanning van een schip dat de Rijn bevaart is verantwoordelijk voor de naleving van de
      artikelen 23.01, eerste lid, tweede lid, derde alinea, en derde lid, 23.02, 23.03, 23.04, eerste, derde, en vijfde
      lid, onderdeel 1, 23.05, 23.06, eerste lid, 23.07, en 23.08, eerste, derde, vierde en vijfde lid, van het Reglement
      onderzoek schepen op de Rijn 1995.


      4 Een lid van de bemanning van een schip dat de Rijn bevaart, niet zijnde de schipper, is verantwoordelijk voor
      de naleving van de artikelen 23.03, derde lid, 23.04, eerste, tweede en vijfde lid, onderdeel 2, van het Reglement
      onderzoek schepen op de Rijn 1995.


      5 Het in het eerste tot en met vierde lid bepaalde is van overeenkomstige toepassing op de krachtens artikel 1.06
      van het Reglement onderzoek schepen op de Rijn 1995 aangebrachte wijzigingen.
    url: https://wetten.overheid.nl/BWBR0007857/2002-04-01#Artikel5
  - number: '6'
    text: >-
      Het koninklijk besluit van 8 juli 1976 (*Stb.* 476), houdende van kracht verklaring van het Reglement betreffende
      het onderzoek van schepen op de Rijn wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007857/2002-04-01#Artikel6
  - number: '7'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0007857/2002-04-01#Artikel7
  - number: '8'
    text: 'Dit besluit kan worden aangehaald als: Besluit Reglement onderzoek schepen op de Rijn 1995.'
    url: https://wetten.overheid.nl/BWBR0007857/2002-04-01#Artikel8
