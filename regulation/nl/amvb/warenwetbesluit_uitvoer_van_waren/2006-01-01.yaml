$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_uitvoer_van_waren
regulatory_layer: AMVB
publication_date: '2005-10-27'
valid_from: '2006-01-01'
bwb_id: BWBR0006007
url: https://wetten.overheid.nl/BWBR0006007/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 15 juni 1992, nr. VVP/L-U-
    921386, gedaan in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van Landbouw,
    Natuurbeheer en Visserij;

    Gelet op artikel 1, vijfde lid, van de Warenwet (Stb. 1988, 360);

    Gezien het advies van de Adviescommissie Warenwet (advies van 22 maart 1990, nr. 14169/035);

    De Raad van State gehoord (advies van 3 maart 1993, nr. W13.92.0263);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 18 mei 1993, nr.
    DGVgz/VVP/L 93836, uitgebracht in overeenstemming met Onze voornoemde Minister en Staatssecretaris;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#Artikel1
  - number: 1.a
    text: |-
      waren: andere waren dan die waarop de in artikel II, eerste lid, van de Wijzigingswet 1988 Warenwet (*Stb.* 358)
      bedoelde besluiten van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#Artikel1
  - number: 1.b
    text: 'uitvoer: het buiten Nederlands grondgebied brengen van waren;'
    url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#Artikel1
  - number: 1.c
    text: 'samenstelling: het geheel van kenmerkende ingrediënten of kenmerkende onderdelen van waren;'
    url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#Artikel1
  - number: 1.d
    text: |-
      *verordening (EG) 178/2002*: [verordening (EG) nr. 178/2002](32002R0178) van het Europees Parlement en de Raad
      van de Europese Unie van 28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de
      levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van
      procedures voor voedselveiligheidsaangelegenheden (PbEG L 31).
    url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#Artikel1
  - number: 1a
    text: |-
      Het is verboden ten aanzien van eet- en drinkwaren te handelen in strijd met artikel 12 van [verordening (EG)
      178/2002](32002R0178).
    url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#Artikel1a
  - number: '2'
    text: |-
      De krachtens de [artikelen 4 tot en met 9 van de Warenwet][ref1] (*Stb.* 1988, 360) gestelde voorschriften zijn
      niet van toepassing ten aanzien van waren die kennelijk bestemd zijn voor uitvoer:


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel4
    url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '4'
  - number: 2.a
    text: |-
      voor zover die waren voldoen aan door het land van bestemming ter zake gestelde specifieke voorschriften, dan wel
      aan ter zake welbepaalde internationale regelingen, aan de totstandkoming waarvan de Nederlandse regering heeft
      meegewerkt, en die voorschriften onderscheidenlijk regelingen desgevraagd door de belanghebbende zijn overgelegd
      ten behoeve van de met het toezicht ter zake belaste autoriteit;
    url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#Artikel2
  - number: 2.b
    text: |-
      voor zover, bij gebreke van voorschriften, bedoeld onder a: - die waren, voor wat betreft samenstellingseisen die
      geen verband houden met de veiligheid of de deugdelijkheid, in het land van bestemming rechtmatig kunnen worden
      verhandeld;
        - voor wat betreft het toevoegen van levensmiddelenadditieven, die toevoeging noodzakelijk is gezien de bijzondere
      klimatologische omstandigheden in het land van bestemming; of
        - voor wat betreft voorschriften met betrekking tot aanduidingen en vermeldingen, die voorgeschreven aanduidingen
      en vermeldingen zijn gesteld in een taal die begrijpelijk moet worden geacht voor de ge- of verbruiker in het land
      van bestemming; en de belanghebbende desgevraagd ten behoeve van de met het toezicht ter zake belaste autoriteit
      alle in zijn bezit zijnde gegevens overlegt, die van nut kunnen zijn voor een feitelijke beoordeling ter zake.
    url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#Artikel2
  - number: '3.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#Artikel3
  - number: '3.2'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit Uitvoer van waren.'
    url: https://wetten.overheid.nl/BWBR0006007/2006-01-01#Artikel3
