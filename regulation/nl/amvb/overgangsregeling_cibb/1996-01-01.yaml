---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: overgangsregeling_cibb
regulatory_layer: AMVB
publication_date: '1995-11-02'
valid_from: '1996-01-01'
bwb_id: BWBR0004686
url: https://wetten.overheid.nl/BWBR0004686/1996-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen van 31 maart 1989, nr. 156011, directie
    Arbeidsvoorwaardenbeleid;

    Overwegende, dat het wenselijk is te komen tot vaststelling van de rechtspositie van het personeel dat werkzaam is
    bij de landelijke instelling voor de ondersteuning van de volwasseneneducatie het "Centrum voor de Innovatie van
    Beroepsonderwijs Bedrijfsleven" (CIBB) en tot vaststelling van overgangsmaatregelen voor de overgang van personeel
    naar het CIBB vanuit instellingen waaraan de werkzaamheden in verband met de totstandkoming van het CIBB worden
    beëindigd;

    Gelet op artikel 9 van de Kaderwet volwasseneneducatie (Stb. 1985, 532);

    De Raad van State gehoord (advies van 29 mei 1989, nr. W05.89 0171);

    Gezien het nader rapport van Onze Minister van Onderwijs en Wetenschappen van 19 december 1989, nr. 156805,
    directie Arbeidsvoorwaardenbeleid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling zijn de begripsbepalingen van het [Rechtspositiebesluit onderwijspersoneel][ref1] (*Stb.* 1985,
      110) van overeenkomstige toepassing, behoudens het bepaalde in het tweede lid.

      2 In deze regeling wordt verstaan onder:

      a. "Rechtspositiebesluit": het [Rechtspositiebesluit onderwijspersoneel][ref2];

      b. "instelling": de landelijke instelling voor de ondersteuning van de volwasseneneducatie het "Centrum voor de
      Innovatie voor Beroepsonderwijs Bedrijfsleven";

      c. "instituut": de instelling het "Pedagogisch Centrum Beroepsonderwijs Bedrijfsleven" dan wel de instelling het
      "Centraal Overleg Beroepsbegeleidend Onderwijs" waaraan activiteiten die vergelijkbaar zijn met werkzaamheden voor
      de ondersteuning van de volwasseneneducatie op 1 april 1989 worden beëindigd in verband met de totstandkoming van
      de instelling, bedoeld onder *b*;

      d. "belanghebbende": degene die is benoemd bij een instituut en zonder onderbreking wordt benoemd bij de
      instelling;

      e. "overgang": de benoeming van de belanghebbende vanuit een instituut bij de instelling op 1 april 1989 in verband
      met de beëindiging op die datum bij dat instituut van activiteiten die vergelijkbaar zijn met werkzaamheden voor de
      ondersteuning van de volwasseneneducatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003771
      [ref2]: https://wetten.overheid.nl/BWBR0003771
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003771
      - id: ref2
        bwb_id: BWBR0003771
  - number: '2'
    text: |-
      De overige artikelen van deze regeling zijn niet van toepassing ten aanzien van de belanghebbende wiens betrekking
      bij een instituut in verband met de overgang wordt beëindigd en die aansluitend bij de instelling op zijn verzoek
      wordt belast met een functie waarbij een maximumschaal behoort die lager is dan de maximumschaal die behoort bij
      de functie die hem op grond van het bepaalde in deze regeling zou kunnen worden toegedeeld. De belanghebbende wordt
      in dat geval voor de toepassing van het bepaalde in de hoofdstukken I-P tot en met I-S van het Rechtspositiebesluit
      aangemerkt als een belanghebbende die in dienst treedt.
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel2
  - number: '3'
    text: |-
      De aan de hand van de [artikelen 7][ref1] tot en met [9][ref2] uit te voeren berekeningen geschieden op basis van
      het loonpeil dat geldt op 1 april 1989.


      [ref1]: https://wetten.overheid.nl/BWBR0004686#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004686#Artikel9
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004686
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004686
        artikel: '9'
  - number: '4'
    text: |-
      Indien de belanghebbende op de dag voorafgaande aan de overgang verlof volgens een of meer der hoofdstukken I-C,
      I-D of I-E, genoot, wordt dat verlof alsmede de daarmee eventueel samenhangende vermindering van de bezoldiging
      voor de toepassing van de overige bepalingen in deze regeling buiten beschouwing gelaten, behoudens het bepaalde
      in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004686#Artikel10
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004686
        artikel: '10'
  - number: '5'
    text: |-
      1 Het bevoegd gezag stelt per 1 april 1989 de formatie en de daarin voorkomende functies vast.

      2 Het bevoegd gezag deelt de functies aan de belanghebbenden toe, daarbij rekening houdend met de overige
      bepalingen van deze regeling.
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel5
  - number: '6'
    text: |-
      Aan de belanghebbende wordt, na vaststelling van de formatie, een functie toegedeeld die naar niveau en
      maximumsalaris zo veel mogelijk overeenkomt met de functie die hij bij het instituut vervulde.
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel6
  - number: '7'
    text: |-
      Voor de belanghebbende wiens salaris op de dag voorafgaand aan de overgang werd vastgesteld volgens een
      salarisschaal die overeenkomt met een van de schalen van het Rechtspositiebesluit, wordt vanaf de dag van de
      overgang een salaris bij normbetrekking vastgesteld overeenkomstig de [artikelen I][ref1]-Q104 dan wel I-S103 van
      het Rechtspositiebesluit met dien verstande dat voor hem geen lagere schaal en geen lager bedrag gaan gelden dan
      voor hem op de dag van de overgang zou hebben gegolden volgens de regeling die voor hem op de dag voor de overgang
      van toepassing was.


      [ref1]: https://wetten.overheid.nl/BWBR0004686#ArtikelI
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004686
        artikel: I
  - number: '8'
    text: |-
      1 Voor de belanghebbende, niet zijnde een belanghebbende als bedoeld in [artikel 7][ref1], wordt vanaf de dag
      van de overgang een salaris bij normbetrekking vastgesteld in het carrièrepatroon behorend bij de functie waarin
      hij op die dag wordt benoemd met inachtneming van het bepaalde in hoofdstuk I-Q dan wel hoofdstuk I-S van het
      Rechtspositiebesluit dat gelijk is aan het bedrag dat voor hem op die datum zou hebben gegolden volgens de schaal
      die op de dag voor de overgang voor hem van toepassing was, onverminderd het bepaalde in het tweede lid.

      2 Indien het in het eerste lid bedoelde salaris volgens de schaal die op de dag voor de overgang gold niet voorkomt
      in het carrièrepatroon waarin de inpassing plaatsvindt, wordt het salaris vastgesteld op het naasthogere bedrag in
      dat carrièrepatroon.


      [ref1]: https://wetten.overheid.nl/BWBR0004686#Artikel7
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004686
        artikel: '7'
  - number: '9'
    text: |-
      Indien het salaris bij normbetrekking van de belanghebbende hoger is dan het hoogste bedrag van de bij zijn
      functie, bedoeld in [artikel 6][ref1], behorende maximumschaal, geschiedt de inpassing op een salaris dat
      zo dicht mogelijk ligt bij en tenminste gelijk is aan zijn salaris bij normbetrekking en wel in de laagste
      schaal waarvan het maximum gelijk is aan of hoger dan dat salaris bij normbetrekking. Het bepaalde in
      [artikel 8, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004686#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004686#Artikel8
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004686
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004686
        artikel: '8'
  - number: '10'
    text: |-
      1 Met ingang van de dag van overgang blijft voor de belanghebbende, met inachtneming van het tweede tot en met
      vierde lid, de betrekkingsomvang ten minste gelijk aan die welke voor hem op evenbedoelde dag zou hebben gegolden
      volgens de regeling zoals die laatstelijk voor hem van toepassing was.

      2 Indien de betrekkingsomvang van de belanghebbende bij het instituut werd uitgedrukt in een normbetrekking van
      40 uur dan wel van 38,4 uur, wordt zijn betrekkingsomvang met ingang van de dag van overgang omgerekend naar een
      normbetrekking van 38 uur dan wel een evenredig deel daarvan.

      3 De in het tweede lid bedoelde omrekening geschiedt door het aantal uren van zijn betrekking te vermenigvuldigen
      met 38 en te delen door respectievelijk 40 dan wel 38,4 en de uitkomst met meer dan één decimaal af te ronden op
      het naasthogere tiende gedeelte van een uur.

      4 Indien de belanghebbende bij het instituut verlof genoot als bedoeld in [artikel 4][ref1], wordt de omvang van
      het verlof omgerekend overeenkomstig het tweede en het derde lid, voor zover dat verlof op de dag van de overgang
      zou worden genoten volgens de regeling zoals die luidde op de dag voor de overgang.


      [ref1]: https://wetten.overheid.nl/BWBR0004686#Artikel4
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004686
        artikel: '4'
  - number: '11'
    text: |-
      Indien voor een belanghebbende op de dag voorafgaand aan de overgang het salaris werd vastgesteld volgens een
      bedrag, niet zijnde het hoogste salaris, in een van de van toepassing zijnde schalen 1 tot en met 5 waarbij
      de eerstvolgende periodieke verhoging na een langere periode dan 12 maanden sedert de voorafgaande periodieke
      verhoging zou worden toegekend, wordt voor hem bij de instelling een salarisnummer bepaald dat er toe leidt dat de
      eerstvolgende periodieke verhoging bij de instelling niet later wordt toegekend dan bij het instituut het geval zou
      zijn geweest. Indien voor de belanghebbende de datum van de periodieke verhoging is een datum die ligt na de dag
      van de overgang en vóór 1 augustus, wordt het in de eerste volzin bedoelde salarisnummer met één verhoogd.
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel11
  - number: '12'
    text: |-
      Indien als gevolg van het van toepassing worden van het Rechtspositiebesluit aan de belanghebbende, niet zijnde
      een belanghebbende als bedoeld in [artikel 11][ref1], de eerstvolgende periodieke verhoging eerst na een periode
      van langer dan 12 maanden na zijn vorige salarisverhoging dan wel na de eerste van de maand waarin hij in dienst
      is getreden zou worden toegekend, wordt hem vóór de toepassing van de overige bepalingen in deze paragraaf met
      ingang van de dag van overgang een periodieke verhoging toegekend op de voet van de regeling zoals die voor hem
      laatstelijk van toepassing was.


      [ref1]: https://wetten.overheid.nl/BWBR0004686#Artikel11
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004686
        artikel: '11'
  - number: '13'
    text: |-
      Na toepassing van [artikel 7][ref1], [artikel 8][ref2] dan wel artikel 9 wordt het voor de belanghebbende
      vastgestelde inpassingsbedrag uitgedrukt in een salarisnummer in de voor hem vastgestelde schaal.


      [ref1]: https://wetten.overheid.nl/BWBR0004686#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004686#Artikel8
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004686
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004686
        artikel: '8'
  - number: '14'
    text: In de gevallen waarin deze regeling niet of niet naar billijkheid voorziet, beslist Onze minister.
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel14
  - number: '15'
    text: Deze regeling kan worden aangehaald als "Overgangsregeling CIBB".
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#Artikel15
  - number: II
    text: |-
      Ten aanzien van het personeel dat per 1 april 1989 vanuit de instellingen "Pedagogisch Centrum Beroepsonderwijs
      Bedrijfsleven" en "Centraal Overleg Beroepsbegeleidend Onderwijs" aan de instelling "Centrum voor de Innovatie voor
      Beroepsonderwijs Bedrijfsleven" wordt verbonden, wordt een overgangsregeling vastgesteld, luidende als volgt:
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#ArtikelII
  - number: III
    text: |-
      Dit besluit treedt in werking op een nader bij Koninklijk Besluit te bepalen datum waarbij kan worden geregeld dat
      het Koninklijk Besluit terugwerkt.
    url: https://wetten.overheid.nl/BWBR0004686/1996-01-01#ArtikelIII
