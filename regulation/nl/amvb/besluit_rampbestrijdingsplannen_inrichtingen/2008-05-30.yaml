---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_rampbestrijdingsplannen_inrichtingen
regulatory_layer: AMVB
publication_date: '2010-04-01'
valid_from: '2008-05-30'
bwb_id: BWBR0010506
url: https://wetten.overheid.nl/BWBR0010506/2008-05-30
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 22 juli 1998, nr. EB98/1170, directoraat-generaal
    voor Openbare Orde en Veiligheid, directie Brandweer en Rampenbestrijding;

    Gelet op richtlijn nr. 96/82/EG van de Raad van de Europese Unie van 9 december 1996 (PbEG L 10) betreffende de
    beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken;

    Gelet op artikel 7, derde lid, van de Wet rampen en zware ongevallen;

    De Raad van State gehoord (advies van 5 oktober 1998, nr. W04.98.0387);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties, directoraat-
    generaal voor Openbare Orde en Veiligheid, directie Brandweer en Rampenbestrijding, van 31 mei 1999, nr.
    EB1998/52494;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De burgemeester stelt een rampbestrijdingsplan vast voor een ramp of zwaar ongeval in een inrichting als bedoeld in
      [artikel 8 van het Besluit risico's zware ongevallen 1999][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel8
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '8'
  - number: '1.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van een calamiteit in een inrichting die in een andere
      staat is gelegen, welke calamiteit tot een ramp of zwaar ongeval in Nederland kan leiden. De artikelen van dit
      besluit worden daarbij voor zover mogelijk toegepast.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel1
  - number: '2.1'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel2
  - number: 2.1.a
    text: |-
      veiligheidsrapport: rapport, bedoeld in [artikel 10 van het Besluit risico's zware ongevallen 1999][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel10
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '10'
  - number: 2.1.b
    text: |-
      vergunning: vergunning krachtens de [artikelen 8.1][ref1] of [8.4 van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '2.2'
    text: |-
      Onverminderd [artikel 7, tweede lid][ref1], worden het rampbestrijdingsplan of wijzigingen
      daarvan vastgesteld uiterlijk een jaar na het tijdstip waarop de burgemeester op grond van
      [artikel 5.15, derde lid, van het Inrichtingen- en vergunningenbesluit milieubeheer][ref2] de delen van het
      veiligheidsrapport waarvan een aanvraag om een vergunning vergezeld gaat, heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0010506#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005829#Artikel5
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010506
        artikel: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005829
        artikel: '5'
  - number: '2.3'
    text: |-
      In afwijking van het tweede lid en onverminderd [artikel 7, tweede lid][ref1], worden in geval het
      veiligheidsrapport op grond van [artikel 28 van het Besluit risico's zware ongevallen 1999][ref2] wordt ingediend,
      het rampbestrijdingsplan of wijzigingen daarvan vastgesteld uiterlijk een jaar nadat de burgemeester met toepassing
      van [artikel 18, vierde lid, van dat besluit][ref3] een exemplaar van het rapport heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0010506#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel18
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010506
        artikel: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0010475
        artikel: '18'
  - number: '3'
    text: 'Het rampbestrijdingsplan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel3
  - number: 3.a
    text: |-
      de functies van de aan de inrichting verbonden personen die bevoegd zijn om procedures van alarmering binnen
      en buiten de inrichting en van inwerkingstelling van bestrijdingsacties binnen de inrichting in werking te doen
      treden;
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel3
  - number: 3.b
    text: |-
      de functies van de personen die belast zijn met het opperbevel over en de operationele leiding van het geheel van
      de bestrijdingsacties;
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel3
  - number: 3.c
    text: |-
      de maatregelen en voorzieningen die zijn getroffen opdat degene die is belast met het opperbevel en de
      hulpverleningsdiensten snel worden geïnformeerd en de bij de bestrijding betrokken personen snel worden opgeroepen;
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel3
  - number: 3.d
    text: |-
      het schema met betrekking tot de leiding over en de gecoördineerde inzet van diensten en organisaties die bij de
      bestrijding kunnen worden betrokken;
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel3
  - number: 3.e
    text: |-
      de maatregelen en voorzieningen die zijn getroffen met het oog op de bestrijding op en buiten het terrein van de
      inrichting;
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel3
  - number: 3.f
    text: |-
      de maatregelen en voorzieningen die zijn getroffen om de bevolking te informeren over de ramp of het zware ongeval
      of de dreigende ramp of het dreigende zware ongeval en over de door haar te volgen gedragslijn;
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel3
  - number: 3.g
    text: |-
      de maatregelen en voorzieningen die zijn getroffen om de hulpverleningsdiensten van een andere staat te informeren,
      indien de bevolking of het milieu van die staat door de ramp of het zware ongeval kunnen worden getroffen of
      dreigen te worden getroffen.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel3
  - number: '4.1'
    text: |-
      Op de vaststelling van het rampbestrijdingsplan of van belangrijke wijzigingen daarvan is
      [afdeling 3:4 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing, met dien verstande dat
      [artikel 10c van de Wet rampen en zware ongevallen][ref2] van toepassing is op alle informatie die ter inzage wordt
      gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003765#Artikel10c
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003765
        artikel: 10c
  - number: '4.2'
    text: |-
      Indien met betrekking tot de inrichting met toepassing van [artikel 19.3 van de Wet milieubeheer][ref1] van
      een document een tweede tekst is overgelegd waaruit vertrouwelijke gegevens als in die artikelen bedoeld zijn
      weggelaten, wordt alleen deze tekst ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
  - number: '5'
    text: |-
      Indien de bevolking van een andere staat kan worden getroffen door de gevolgen van een ramp of een zwaar ongeval in
      de inrichting waarop het rampbestrijdingsplan betrekking heeft, verzoekt de burgemeester van de gemeente waarin de
      inrichting geheel of in hoofdzaak is gelegen de bevoegde autoriteit van de andere staat de bevolking te informeren
      over de mogelijkheid haar zienswijze over het ontwerp naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel5
  - number: '6'
    text: |-
      De burgemeester verleent op verzoek van de bevoegde autoriteit van een andere staat medewerking aan de
      terinzagelegging van documenten die in de andere staat zijn opgesteld in het kader van de voorbereiding van een met
      een rampbestrijdingsplan gelijk te stellen plan voor een in die staat gelegen inrichting.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel6
  - number: '7.1'
    text: |-
      Burgemeester en wethouders verzorgen met passende tussenpozen doch ten minste éénmaal per drie jaar een oefening
      waarbij het rampbestrijdingsplan op juistheid, volledigheid en bruikbaarheid wordt getoetst.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel7
  - number: '7.2'
    text: |-
      De burgemeester beziet met passende tussenpozen doch ten minste éénmaal per drie jaar of het rampbestrijdingsplan
      moet worden herzien en bijgewerkt. Hij houdt daarbij rekening met veranderingen die zich in de inrichting of in de
      omgeving daarvan hebben voorgedaan, met veranderingen in de organisatie en taken van bij de bestrijding van rampen
      en zware ongevallen betrokken diensten en organisaties, met nieuwe technische kennis en met inzichten omtrent de
      bij rampen en zware ongevallen te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel7
  - number: '8.1'
    text: |-
      Indien de burgemeester besluit dat voor een inrichting als bedoeld in
      [artikel 8 van het Besluit risico's zware ongevallen 1999][ref1] geen rampbestrijdingsplan behoeft te worden
      vastgesteld, zendt hij een afschrift van zijn besluit aan:


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel8
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '8'
  - number: 8.1.a
    text: degene die de betrokken inrichting drijft;
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8
  - number: 8.1.b
    text: het bestuur van de regionale brandweer;
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8
  - number: 8.1.c
    text: |-
      het bestuursorgaan dat bevoegd is voor de desbetreffende inrichting een vergunning krachtens de
      [artikelen 8.1][ref1] of [8.4 van de Wet milieubeheer][ref2] te verlenen, tenzij burgemeester en wethouders het
      bevoegd gezag zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 8.1.d
    text: de commissaris van de Koning in de provincie;
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8
  - number: 8.1.e
    text: |-
      de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: 8.1.f
    text: Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8
  - number: '8.2'
    text: |-
      Indien het besluit van de burgemeester een inrichting betreft die geheel of gedeeltelijk is gelegen in een aan een
      andere staat grenzende gemeente, zendt Onze Minister een afschrift van het besluit aan de andere staat.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8
  - number: 8a.1
    text: |-
      De burgemeester stelt een rampbestrijdingsplan vast voor een ramp of zwaar ongeval in een afvalvoorziening
      categorie A.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8a
  - number: 8a.2
    text: |-
      [Artikel 3][ref1] is van overeenkomstige toepassing op het rampbestrijdingsplan, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010506#Artikel3
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0010506
        artikel: '3'
        paragraaf: '1'
  - number: 8a.3
    text: |-
      Het rampbestrijdingsplan, bedoeld in het eerste lid, wordt vastgesteld uiterlijk een jaar na het tijdstip waarop
      het college van burgemeester en wethouders een afschrift van een aanvraag om vergunning voor een afvalvoorziening
      categorie A heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8a
  - number: 8b
    text: |-
      Degene die de afvalvoorziening categorie A drijft, verstrekt bij een aanvraag om vergunning of op enig ander
      tijdstip aan het college van burgemeester en wethouders, de burgemeester en het bestuur van de regionale brandweer
      de gegevens die nodig zijn opdat zij hun taken in het kader van de voorbereiding van de bestrijding van rampen en
      zware ongevallen naar behoren kunnen uitvoeren. Dit geldt niet voor zover deze gegevens reeds op grond van andere
      voorschriften zijn verschaft of kunnen worden verkregen.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8b
  - number: 8c
    text: |-
      Op de vaststelling van het rampbestrijdingsplan of van belangrijke wijzigingen daarvan is [artikel 4][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010506#Artikel4
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0010506
        artikel: '4'
        paragraaf: '1'
  - number: '9'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit rampbestrijdingsplannen inrichtingen.'
    url: https://wetten.overheid.nl/BWBR0010506/2008-05-30#Artikel10
