      - id: ref2
        bwb_id: BWBR0008290
  - number: '2.1'
    text: |-
      Subsidies die worden verstrekt krachtens een ministeriële regeling op de gebieden, genoemd in
      [artikel 2 van de Kaderwet EZ-subsidies][ref1], worden verstrekt volgens de regels van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel2
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '2'
  - number: '2.2'
    text: |-
      Onze Minister kan op aanvraag voor de activiteiten op de gebieden, genoemd in het eerste lid, subsidie verstrekken
      volgens bij ministeriële regeling bepaalde regels.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister stelt regels als bedoeld in het tweede lid uitsluitend over activiteiten die tevens een positieve
      bijdrage leveren aan de economische, ecologische of sociale dimensie van duurzaamheid.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel2
  - number: '2.4'
    text: |-
      Onder dit besluit vallen niet per boekjaar verstrekte subsidies als bedoeld in
      [artikel 4:58 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '2.5'
    text: 'Onder dit besluit vallen niet:'
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel2
  - number: 2.5.a
    text: |-
      subsidies die worden verstrekt op basis van of in nauwe samenhang met een bindend besluit van de Raad van
      de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Europese Commissie betreffende
      ondersteuning van activiteiten op de in het eerste lid genoemde gebieden, en
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel2
  - number: 2.5.b
    text: |-
      subsidies die worden verstrekt met het oog op co-financiering van een door de Raad van de Europese Unie of de
      Europese Commissie goedgekeurd programma.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel2
  - number: '2.6'
    text: |-
      Onder dit besluit vallen niet specifieke uitkeringen die verstrekt worden op grond van een regeling die uitsluitend
      voorziet in het verstrekken van specifieke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel2
  - number: '2.7'
    text: |-
      Dit besluit is niet van toepassing op subsidies krachtens het [Besluit stimulering duurzame energieproductie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: '3.1'
    text: |-
      Een subsidie wordt verstrekt aan een in Nederland gevestigde natuurlijke persoon, rechtspersoon of vennootschap die
      voor eigen rekening en risico activiteiten uitvoert.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel3
  - number: '3.2'
    text: |-
      Bij ministeriële regeling kan, in aanvulling op het eerste lid, worden bepaald dat subsidie wordt verstrekt aan
      niet in Nederland gevestigde natuurlijke personen, rechtspersonen of vennootschappen of hiermee gelijk te stellen
      entiteiten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel3
  - number: '3.3'
    text: |-
      In aanvulling op het eerste lid kan een subsidie aan een financier ook worden verstrekt aan een niet in Nederland
      gevestigde financier.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel3
  - number: '3.4'
    text: |-
      Geen subsidie wordt verstrekt aan een provincie, gemeente of openbaar lichaam als bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1], tenzij bij ministeriële regeling is bepaald dat daaraan wel subsidie
      wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '4'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel4
  - number: 4.a
    text: de activiteiten waarvoor subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel4
  - number: 4.b
    text: de aanvragers;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel4
  - number: 4.c
    text: een samenwerkingsverband en de penvoerder van het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel4
  - number: 4.d
    text: de vorm van de subsidie;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel4
  - number: 4.e
    text: het verstrekken van vouchers en de aanwending van vouchers;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel4
  - number: 4.f
    text: degenen met wie een financier een overeenkomst sluit;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel4
  - number: 4.g
    text: verplichtingen van Onze Minister in verband met de subsidie;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel4
  - number: 4.h
    text: |-
      onderwerpen die, in afwijking van of in aanvulling op de regels van dit besluit, nadere regeling behoeven op basis
      van een Europees steunkader;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel4
  - number: 4.i
    text: |-
      de wijze van uitvoering van de activiteiten waarvoor subsidie wordt verleend met het oog op de economische,
      ecologische of sociale dimensie van duurzaamheid.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel4
  - number: '5.1'
    text: Bij ministeriële regeling wordt de wijze van berekenen van de subsidie of de hoogte van de subsidie bepaald.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel5
  - number: '5.2'
    text: Bij ministeriële regeling kan een maximum subsidiebedrag worden bepaald.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel5
  - number: '6.1'
    text: |-
      Indien reeds door een bestuursorgaan of de Europese Commissie subsidie, met uitzondering van subsidie aan een
      financier, is verstrekt voor de subsidiabele kosten of een deel daarvan, wordt slechts een zodanig bedrag aan
      subsidie verstrekt dat het totale bedrag aan subsidies niet meer bedraagt dan het bedrag dat krachtens dit besluit
      kan worden verstrekt noch meer bedraagt dan toegestaan volgens de toepasselijke Europese steunkaders.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is niet van toepassing voor zover de verstrekte subsidie geldmiddelen betreft die één van Onze
      Ministers onder door hem gestelde voorschriften ter beschikking stelt als bijdrage in de algemene exploitatie- en
      investeringskosten die een onderzoeksorganisatie maakt.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel6
  - number: '6.3'
    text: |-
      Indien bij ministeriële regeling is aangegeven dat een bijdrage van een gemeente, provincie of openbaar lichaam als
      bedoeld in [artikel 8 van de Wet gemeenschappelijke regelingen][ref1] of een ander bestuursorgaan aangemerkt wordt
      als publieke cofinanciering, kunnen bij ministeriële regeling van het eerste lid afwijkende regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: '6.4'
    text: |-
      Indien uit de aan Onze Minister op basis van [artikel 41, tweede lid][ref1], voorgelegde afspraken blijkt dat
      sprake is van staatssteun als gevolg van de overdracht van kennis of andere resultaten uit activiteiten, wordt
      slechts een zodanig bedrag aan subsidie verstrekt dat het totale bedrag aan subsidie niet meer bedraagt dan het
      in de beschikking tot subsidieverlening aangegeven bedrag dat maximaal mag worden verstrekt ingevolge een Europees
      steunkader.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel41
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '41'
        hoofdstuk: '11'
        paragraaf: '1'
  - number: '7.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat bepaalde subsidieregelingen of bijdragen van de Europese Commissie
      bij de toepassing van [artikel 6][ref1] buiten beschouwing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel6
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de subsidie aan een financier regels worden gesteld over
      de cumulatie van subsidie bij ondernemingen aan wie als gevolg van de subsidie aan een financier kapitaal wordt
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel7
  - number: '8'
    text: |-
      Indien bij ministeriële regeling is bepaald dat toepassing is gegeven aan een de-minimis verordening of de algemene
      groepsvrijstellingsverordening, wordt het bedrag van de subsidie verlaagd voor zover dit nodig is op basis van
      deze verordening.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel8
  - number: '10.1'
    text: |-
      Voor subsidie komen de redelijk gemaakte kosten in aanmerking die direct verbonden zijn met de uitvoering van een
      activiteit.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel10
  - number: '10.2'
    text: Vóór indiening van de aanvraag door de subsidieontvanger gemaakte kosten komen niet voor subsidie in aanmerking.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel10
  - number: '10.3'
    text: |-
      De eventuele restwaarde van specifiek voor de subsidiabele activiteiten aangeschafte apparatuur maakt geen deel uit
      van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel10
  - number: '10.4'
    text: |-
      De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidieontvanger die de kosten
      heeft gemaakt, omzetbelasting niet in aftrek kan brengen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel10
  - number: '10.5'
    text: |-
      Winstopslagen bij transacties binnen een groep worden alleen in aanmerking genomen voor zover het gebruikelijk is
      die winstopslagen ook bij soortgelijke transacties buiten de groep in rekening te brengen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel10
  - number: '10.6'
    text: |-
      Bij subsidie aan een ondernemer waar een Europees steunkader op van toepassing is, komen alleen de kosten voor
      vergoeding in aanmerking die voldoen aan de eisen van het desbetreffende steunkader.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel10
  - number: '10.7'
    text: |-
      Afschrijvingskosten van apparatuur en gebouwen worden lineair berekend als fractie van de aanschafprijs op basis
      van bedrijfseconomische grondslagen en normen, met een minimale afschrijvingstermijn van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel10
  - number: '11.1'
    text: |-
      Tenzij [artikel 14a][ref1] van toepassing is, kiest de aanvrager voor de berekening van de subsidiabele kosten uit:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel14a
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: 14a
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 11.1.a
    text: |-
      de integrale kostensystematiek, opgenomen in [artikel 12][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 11.1.b
    text: |-
      de loonkosten plus vaste-opslag-systematiek, opgenomen in [artikel 13][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel13
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 11.1.c
    text: |-
      de vaste-uurtarief-systematiek, opgenomen in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel14
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '14'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      De subsidiabele kosten worden berekend op basis van een voor de subsidie-ontvanger gebruikelijke en controleerbare
      methode, die is gebaseerd op bedrijfeconomische grondslagen en normen die in het maatschappelijk verkeer als
      aanvaardbaar worden beschouwd en die de subsidie-ontvanger stelselmatig toepast.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel11
  - number: '11.3'
    text: |-
      De kosten van aangeschafte apparatuur en verbruikte materialen en hulpmiddelen worden berekend op basis van
      historische aanschafprijzen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel11
  - number: '11.4'
    text: |-
      Indien het aantal direct productieve uren niet blijkt uit de methode, bedoeld in het tweede lid, wordt het aantal
      direct productieve uren voor een fulltime dienstverband gesteld op 1650 uur.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel11
  - number: '12.1'
    text: |-
      Indien de aanvrager kiest voor de integrale kostensystematiek, berekent de aanvrager de directe en indirecte kosten
      per kostendrager in een tarief per eenheid van deze kostendrager.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel12
  - number: '12.2'
    text: |-
      De subsidiabele kosten worden berekend door het aantal eenheden van de kostendragers te vermenigvuldigen met de
      ingevolge het eerste lid berekende tarief, vermeerderd met de aan derden betaalde kosten voor zover deze geen deel
      uitmaken van het ingevolge het eerste lid vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel12
  - number: '12.3'
    text: |-
      Bij een aanvraag om subsidie van € 125.000 of meer dient de subsidie-ontvanger uiterlijk bij de aanvraag om
      subsidievaststelling een afschrift in van een rapport van feitelijke bevindingen over de uitkomst van het onderzoek
      van een accountant betreffende de door de subsidie-ontvanger gehanteerde integrale kostensystematiek.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel12
  - number: '12.4'
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven over het rapport, bedoeld in het derde lid en kunnen andere
      rapporten worden aangewezen die in plaats van het rapport, bedoeld in het derde lid, worden ingediend.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel12
  - number: '13.1'
    text: |-
      Indien de aanvrager kiest voor de loonkosten plus vaste-opslag-systematiek, worden de subsidiabele kosten berekend
      door de directe loonkosten per uur te vermenigvuldigen met het aantal uren dat de direct bij de subsidiabele
      activiteiten betrokken personen ten behoeve van deze activiteiten hebben gemaakt, vermeerderd met:
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel13
  - number: 13.1.a
    text: |-
      een vaste opslag voor indirecte kosten uitgedrukt als een percentage van de loonkosten, welk percentage bij
      ministeriële regeling wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel13
  - number: 13.1.b
    text: |-
      de kosten van het gebruik van apparatuur en de kosten van verbruikte materialen en hulpmiddelen indien deze in de
      administratie te onderscheiden zijn;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel13
  - number: 13.1.c
    text: de aan derden betaalde kosten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel13
  - number: '13.2'
    text: |-
      Voor zover geen loonkosten worden gemaakt, maar niettemin arbeid wordt verricht, wordt voor de berekening van de
      kosten van die arbeid inclusief de opslag voor indirecte kosten, bedoeld in het eerste lid, onderdeel a, uitgegaan
      van een bij ministeriële regeling vast te stellen vast uurtarief.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel13
  - number: '14'
    text: |-
      Indien de aanvrager kiest voor de vaste-uurtarief-systematiek, worden de subsidiabele kosten berekend door het
      aantal uren dat de direct bij de subsidiabele activiteiten betrokken personen ten behoeve van deze activiteiten
      hebben gemaakt te vermenigvuldigen met een bij ministeriële regeling vast te stellen vast uurtarief waarin zowel de
      directe loonkosten als daaraan toegerekende indirecte kosten zijn begrepen, vermeerderd met:
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14
  - number: 14.a
    text: |-
      de kosten van het gebruik van apparatuur en de kosten van verbruikte materialen en hulpmiddelen indien deze in de
      administratie te onderscheiden zijn;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14
  - number: 14.b
    text: de aan derden betaalde kosten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14
  - number: 14a.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat voor subsidie in aanmerking komen de extra investeringskosten die
      noodzakelijk zijn voor de verwezenlijking van de voor subsidie in aanmerking komende maatregel met inachtneming van
      Punt 80 tot en met 84 van de Communautaire kaderregeling inzake staatssteun ten behoeve van het milieu (PbEU 2008
      C 82).
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: 14a.2
    text: 'Extra investeringskosten als bedoeld in het eerste lid hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: 14a.2.a
    text: kosten van verwerving of op andere titel dan verwerving in gebruik verkregen bedrijfsterreinen;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: 14a.2.b
    text: kosten van verwerving, huurkoop of lease van bedrijfsgebouwen en daartoe te rekenen centrale voorzieningen;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: 14a.2.c
    text: kosten van aangeschafte machines en apparatuur;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: 14a.2.d
    text: kosten van verbruikte materialen en hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: 14a.2.e
    text: |-
      kosten van onderhoud en inspectie, administratie en beheer, ontmanteling, onvoorziene reparaties, verplichte
      milieumonitoring en verzekeringen;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: 14a.2.f
    text: kosten van geleidelijk opstarten en in gebruik nemen van het project en daartoe te rekenen productiekosten;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: 14a.2.g
    text: kosten van tenaamstelling, verwerving en instandhouding van rechten van intellectuele eigendom;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: 14a.2.h
    text: aan derden verschuldigde kosten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: 14a.3
    text: |-
      De hoogte van de subsidiabele extra investeringskosten komt overeen met de som van de per kostensoort berekende
      investeringskosten van het project verminderd met de referentie-kosten, extra opbrengsten en enig ander extra
      voordeel in de periode tot vijf jaar na de ingebruikname alsmede extra besparingen die met het project gemoeid
      zijn.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: 14a.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de berekening van de kosten, bedoeld in het tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel14a
  - number: '15'
    text: |-
      Bij ministeriële regeling kan worden afgeweken van de subsidiabele kosten, bedoeld in [artikel 10][ref1] of de
      wijze van berekenen van de subsidiabele kosten, bedoeld in [artikel 11, eerste lid][ref2], en kunnen nadere regels
      worden gesteld met betrekking tot de uitleg van in dit hoofdstuk gebruikte, voor de berekening van de subsidiabele
      kosten relevante begrippen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel11
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '16'
    text: |-
      Bij ministeriële regeling wordt een subsidieplafond vastgesteld voor het verstrekken van subsidies op in een
      bepaalde periode ontvangen aanvragen op grond van dit besluit. Daarbij kunnen afzonderlijke subsidieplafonds worden
      vastgesteld voor bepaalde categorieën van aanvragers, ondernemingen of activiteiten of voor bepaalde thema’s of
      voor bepaalde vormen van subsidie.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel16
  - number: '17.1'
    text: 'Bij ministeriële regeling wordt gekozen voor:'
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel17
  - number: 17.1.a
    text: verdeling van het subsidieplafond op volgorde van binnenkomst van de aanvragen,
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel17
  - number: 17.1.b
    text: verdeling van het subsidieplafond op volgorde van rangschikking van de aanvragen,
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel17
  - number: 17.1.c
    text: evenredige verdeling van het subsidieplafond over de ingediende aanvragen of
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel17
  - number: 17.1.d
    text: verdeling van het subsidieplafond door vaststelling van een maximumbedrag per financier.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel17
  - number: '17.2'
    text: |-
      Indien wordt gekozen voor verdeling op volgorde van binnenkomst, kan bij ministeriële regeling worden bepaald op
      welke wijze wordt omgegaan met meerdere aanvragen van één aanvrager of aanvragers binnen één groep.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel17
  - number: '17.3'
    text: |-
      Indien de subsidie wordt verdeeld op volgorde van rangschikking, worden bij ministeriële regeling
      rangschikkingscriteria vastgesteld en, indien meerdere rangschikkingscriteria worden vastgesteld, de onderlinge
      weging hiervan.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel17
  - number: '17.4'
    text: |-
      Indien subsidie wordt verdeeld op volgorde van binnenkomst van de aanvragen, op volgorde van rangschikking van
      de aanvragen, of evenredig wordt verdeeld over de ingediende aanvragen worden bij ministeriële regeling perioden
      vastgesteld waarbinnen aanvragen om subsidie moeten zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel17
  - number: '17.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op vooraanmeldingen als bedoeld in [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel21
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '21'
        hoofdstuk: '7'
  - number: '17.6'
    text: |-
      Bij ministeriële regeling wordt een datum vastgesteld waarvoor het maximumbedrag per financier als bedoeld in
      [artikel 17, eerste lid, onderdeel d][ref1], wordt aangevraagd en vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel17
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '17'
        hoofdstuk: '5'
  - number: '17.7'
    text: |-
      Bij ministeriële regeling kunnen criteria worden bepaald voor de vaststelling van een maximumbedrag per financier
      en kunnen regels worden gesteld over wijziging van het maximumbedrag per financier.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel17
  - number: '18.1'
    text: |-
      Bij ministeriële regeling kan, als het maximale subsidiebedrag per aanvraag gelijk is aan of meer bedraagt dan
      € 25.000 of als een subsidie wordt verstrekt aan een financier, worden bepaald dat over aanvragen om subsidie
      ten behoeve van de beoordeling hiervan advies wordt ingewonnen bij een adviescommissie. In dat geval kan bij
      ministeriële regeling worden bepaald waarover de adviescommissie adviseert. Indien aanvragen worden voorgelegd aan
      een adviescommissie, gelden het tweede tot en met twaalfde lid.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '18.2'
    text: De adviescommissie heeft tot taak Onze Minister op zijn verzoek te adviseren omtrent aanvragen om subsidie.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '18.3'
    text: De adviezen van de adviescommissie gaan vergezeld van een deugdelijke motivering.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '18.4'
    text: |-
      De adviescommissie bestaat uit een voorzitter en een aantal leden. De leden zijn deskundig op het terrein waarop de
      adviescommissie een taak heeft en zijn geen ambtenaren, werkzaam bij het Ministerie van Economische Zaken of andere
      ministeries die voor de subsidie verantwoordelijk zijn of mede verantwoordelijk zijn.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '18.5'
    text: |-
      Bij ministeriële regeling wordt het aantal leden en de benoemingstermijn van de voorzitter en van de leden van de
      adviescommissie vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '18.6'
    text: |-
      De voorzitter en de leden worden door Onze Minister benoemd en ontslagen. Zij zijn telkens opnieuw benoembaar voor
      de termijn, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '18.7'
    text: De adviescommissie stelt haar eigen werkwijze schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '18.8'
    text: |-
      Een lid van de adviescommissie neemt niet deel aan de voorbereiding en vaststelling van een advies, indien hij een
      persoonlijk belang heeft bij de beschikking op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '18.9'
    text: Onze Minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de adviescommissie bij te wonen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '18.10'
    text: In het secretariaat van de adviescommissie wordt door Onze Minister voorzien.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '18.11'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de adviescommissie geschiedt op overeenkomstige
      wijze als bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de
      adviescommissie bewaard in het archief van dat ministerie.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '18.12'
    text: |-
      De adviescommissie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel18
  - number: '19.1'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van een formulier, dat bij ministeriële regeling wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel19
  - number: '19.2'
    text: |-
      De aanvraag gaat, overeenkomstig in het formulier is vermeld, vergezeld van de in het formulier aangegeven
      bescheiden.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel19
  - number: '19.3'
    text: Bij ministeriële regeling kunnen regels worden gesteld over het tijdstip van indienen van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel19
  - number: '20'
    text: |-
      Indien aanvragers van subsidie samenwerken in een samenwerkingsverband, dienen zij hun aanvraag in via een
      penvoerder.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel20
  - number: '21.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een aanvraag niet wordt ingediend dan nadat daarover door een
      adviescommissie aan de aanvrager advies is uitgebracht op basis van een vooraanmelding.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel21
  - number: '21.2'
    text: |-
      De vooraanmelding bevat een voorlopige opgave van de gewenste te subsidiëren activiteiten en van de wijze waarop
      aan de toepasselijke voorschriften naar verwachting zal kunnen worden voldaan.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel21
  - number: '21.3'
    text: |-
      Bij toepassing van het eerste lid wordt bij ministeriële regeling een formulier voor de vooraanmelding vastgesteld
      en kunnen nadere voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel21
  - number: '21.4'
    text: |-
      [Artikel 18, derde tot en met twaalfde lid][ref1], is van overeenkomstige toepassing op de adviescommissie, bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel18
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '18'
        hoofdstuk: '6'
  - number: '22'
    text: |-
      Onze Minister beslist afwijzend op een aanvraag om subsidie indien de aanvraag niet voldoet aan de bij of krachtens
      dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister beslist afwijzend op een aanvraag om subsidie, niet zijnde een subsidie aan een financier, voor
      zover:
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: 23.1.a
    text: |-
      door de toepassing van een de-minimis verordening, een bedrag aan de-minimis steun zou worden verstrekt dat hoger
      is dan geoorloofd op grond van deze verordening;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: 23.1.b
    text: onvoldoende vertrouwen bestaat dat de betrokkenen de activiteiten kunnen financieren;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: 23.1.c
    text: |-
      het onaannemelijk wordt geacht dat de activiteiten binnen een bij ministeriële regeling gestelde termijn kunnen
      worden voltooid;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: 23.1.d
    text: aannemelijk is dat de activiteiten ook zonder subsidie zonder belangrijke vertraging zouden worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: 23.1.e
    text: onvoldoende vertrouwen bestaat in de technische haalbaarheid van de activiteiten;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: 23.1.f
    text: onvoldoende vertrouwen bestaat in de economische haalbaarheid van de activiteiten;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: 23.1.g
    text: de activiteiten onvoldoende bijdrage aan de doelstellingen van de subsidie leveren;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: 23.1.h
    text: |-
      onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om de activiteiten naar behoren uit te
      voeren;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: 23.1.i
    text: |-
      het betreft een subsidie-ontvanger die een ondernemer is tegen wie een bevel tot terugvordering uitstaat als
      bedoeld in artikel 1, zesde lid, onderdeel a, van de algemene groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: 23.1.j
    text: |-
      er een naar het oordeel van Onze Minister onaanvaardbaar risico bestaat dat de uitvoering van een voorgenomen
      activiteit een onevenredige inbreuk zal maken op de economische, ecologische of sociale dimensie van duurzaamheid.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister beslist afwijzend op een verzoek om subsidie, indien met de uitvoering van de subsidiabele
      activiteiten of het project al is begonnen vóór de datum van indiening van de aanvraag, tenzij bij ministeriële
      regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel23
  - number: '24'
    text: 'Onze Minister beslist afwijzend op een aanvraag om subsidie aan een financier indien:'
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel24
  - number: 24.a
    text: |-
      de deskundigheid van degenen die zijn belast met het verstrekken, beheren en vervreemden van kapitaal en zekerheden
      onvoldoende gewaarborgd is;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel24
  - number: 24.b
    text: |-
      de betrouwbaarheid van degenen die zijn belast met het verstrekken, beheren en vervreemden van kapitaal en
      zekerheden, en met de bepaling van en het toezicht op het beleid ter zake onvoldoende gewaarborgd is;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel24
  - number: 24.c
    text: de integriteit van de financier onvoldoende gewaarborgd is;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel24
  - number: 24.d
    text: de financiële draagkracht en stabiliteit van de financier onvoldoende gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel24
  - number: '25'
    text: |-
      Bij ministeriële regeling kunnen andere afwijzingsgronden dan de afwijzingsgronden, bedoeld in de
      [artikelen 22 tot en met 24][ref1], worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
        hoofdstuk: '8'
  - number: '26.1'
    text: Onze Minister geeft een beschikking op een aanvraag om subsidie binnen de in onderstaande tabel aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel26
  - number: '26.2'
    text: |-
      Indien een beschikking niet binnen de in de tabel aangegeven termijn kan worden gegeven, kan deze termijn eenmaal
      met de in de tabel aangegeven termijn worden verlengd.








                    *Wijze van verdelen*


                    *Bij ministeriële regeling is wel/niet aangegeven dat een bijdrage van een gemeente, een provincie,
      een openbaar lichaam als bedoeld in artikel 8 van de Wet gemeenschappelijke regelingen of een ander bestuursorgaan
      aangemerkt wordt als publieke cofinanciering*


                    *Wel/geen advies ingewonnen bij een adviescommissie*


                    *Beslistermijn*






                    Volgorde van binnenkomst ([artikel 17, eerste lid, onderdeel a][ref1])


                    Geen sprake van publieke co-financiering


                    Over aanvragen om subsidie wordt geen advies ingewonnen bij een adviescommissie


                    8 weken na ontvangst van de aanvraag




                    Over aanvragen om subsidie wordt advies ingewonnen bij een adviescommissie


                    13 weken na ontvangst van de aanvraag




                    Wel sprake van publieke co-financiering



                    22 weken na ontvangst van de aanvraag




                    Volgorde van rangschikking ([artikel 17, eerste lid, onderdeel b][ref2])


                    Geen sprake van publieke co-financiering



                    13 weken na de laatste dag van de periode waarin aanvragen kunnen worden ingediend




                    Wel sprake van publieke co-financiering



                    22 weken na de laatste dag van de periode waarin aanvragen kunnen worden ingediend




                    Evenredige verdeling van het subsidieplafond over de ingediende aanvragen
      ([artikel 17, eerste lid, onderdeel c][ref3])


                    Geen sprake van publieke co-financiering



                    13 weken na de laatste dag van de periode waarin aanvragen kunnen worden ingediend




                    Wel sprake van publieke co-financiering



                    22 weken na de laatste dag van de periode waarin aanvragen kunnen worden ingediend




                    Maximumbedrag per financier ([artikel 17, eerste lid, onderdeel d][ref4])




                    Voor de bij ministeriële regeling bepaalde datum


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0024796#Artikel17
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '17'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '17'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0024796
        artikel: '17'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0024796
        artikel: '17'
        hoofdstuk: '5'
  - number: '27.1'
    text: |-
      Indien bij ministeriële regeling is gekozen voor verdeling van het subsidieplafond op volgorde van binnenkomst,
      verdeelt Onze Minister het beschikbare bedrag in de volgorde van ontvangst van de aanvragen, met dien verstande
      dat indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de
      verdeling als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '27.2'
    text: |-
      Indien Onze Minister op de dag dat het subsidieplafond van een subsidie die wordt verdeeld op volgorde van
      binnenkomst wordt bereikt meer dan één aanvraag ontvangt, stelt hij de onderlinge rangschikking van die aanvragen
      vast door middel van loting.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel27
  - number: '28'
    text: |-
      Indien bij ministeriële regeling is gekozen voor verdeling van het subsidieplafond op volgorde van rangschikking,
      verdeelt Onze Minister het beschikbare bedrag in de volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel28
  - number: '29'
    text: |-
      Indien de subsidie wordt verstrekt aan deelnemers in een samenwerkingsverband, verzendt Onze Minister de
      beschikkingen tot subsidieverlening aan de penvoerder.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel29
  - number: '30.1'
    text: |-
      De beschikking tot verlenen van een subsidie aan een financier wordt verleend onder de opschortende voorwaarde dat
      binnen acht weken na de beschikking een overeenkomst tot stand is gekomen tussen de Staat en de financier.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel30
  - number: '30.2'
    text: Het eerste lid is niet van toepassing indien tussen de Staat en de financier reeds een overeenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel30
  - number: '30.3'
    text: |-
      Bij ministeriële regeling kan een van het eerste lid afwijkende termijn worden vastgesteld waarbinnen een
      overeenkomst tot stand moet zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel30
  - number: '30.4'
    text: |-
      Bij ministeriële regeling kunnen, in aanvulling op de [artikelen 31 tot en met 33][ref1], nadere regels worden
      gesteld over de inhoud van de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel31
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '31'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: '30.5'
    text: Bij ministeriële regeling wordt een model voor de overeenkomst vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel30
  - number: '31'
    text: |-
      De overeenkomst, bedoeld in [artikel 30][ref1], bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel30
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '30'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: 31.a
    text: |-
      de bepaling dat kapitaal of zekerheid niet wordt verstrekt ten behoeve van een onderneming waarvan blijkens de
      geringe rentabiliteit de continuïteit voor de korte of middellange termijn in het geding is;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel31
  - number: 31.b
    text: |-
      de bepaling dat uitsluitend kapitaal of zekerheid wordt verstrekt aan ondernemingen die in Nederland zijn gevestigd
      en daar een substantieel deel van hun activiteiten uitvoeren;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel31
  - number: 31.c
    text: |-
      de verplichting van de financier er zorg voor te dragen dat de relaties tussen hem en de bij zijn onderneming
      betrokkenen enerzijds, en de ondernemers aan wie kapitaal wordt verschaft anderzijds, transparant zijn;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel31
  - number: 31.d
    text: de verplichting van de financier tot verstrekking van informatie aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel31
  - number: 31.e
    text: |-
      de verplichting van de financier onverwijld mededeling te doen aan Onze Minister van de indiening bij de rechtbank
      van een verzoek tot verlening van surseance van betaling aan hem, een verzoek tot faillietverklaring van hem of een
      verzoek om ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing te verklaren;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel31
  - number: 31.f
    text: de wijze van vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel31
  - number: 31.g
    text: aanvragen tot betaling;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel31
  - number: 31.h
    text: de wijze waarop Onze Minister gerechtigd is tot verhaal na uitbetaling van de financier.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel31
  - number: '32.1'
    text: |-
      Indien de overeenkomst, bedoeld in [artikel 30][ref1], een overeenkomst van borgstelling of garantstelling is,
      bevat deze overeenkomst in aanvulling op [artikel 31][ref2] in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel31
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '30'
        hoofdstuk: '10'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '31'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: 32.1.a
    text: de vergoeding of provisie;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel32
  - number: 32.1.b
    text: het maximum bedrag per borgstelling of garantstelling;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel32
  - number: 32.1.c
    text: |-
      de eisen waaraan de kredietovereenkomst, waarvan de te sluiten overeenkomst van borgstelling of garantstelling
      afhankelijk is, moet voldoen;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel32
  - number: 32.1.d
    text: de wijze waarop de omvang van de borgstelling of garantstelling wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel32
  - number: 32.1.e
    text: de voorwaarden waaronder de borgstelling of garantstelling kan worden ingeroepen;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel32
  - number: 32.1.f
    text: een bepaling inzake de duur en de beëindiging van de overeenkomst tot borgstelling of garantstelling;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel32
  - number: 32.1.g
    text: |-
      een bepaling met betrekking tot betalingen van de borgstelling of garantstelling door Onze Minister aan de
      financier;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel32
  - number: 32.1.h
    text: de terugvordering van kredieten en de uitwinning van zekerheden.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel32
  - number: '32.2'
    text: |-
      In de overeenkomst kan worden bepaald dat de financier kredietovereenkomsten kan sluiten voor zover het totaal van
      de verstrekte kredieten niet hoger is dan het maximale bedrag van de borgstelling.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel32
  - number: '32.3'
    text: Bij ministeriële regeling wordt de hoogte van de vergoeding of de wijze van berekenen van de provisie vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel32
  - number: '33.1'
    text: |-
      Indien de overeenkomst, bedoeld in [artikel 30][ref1], een overeenkomst van krediet is, bevat deze overeenkomst in
      aanvulling op [artikel 31][ref2] in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel31
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '30'
        hoofdstuk: '10'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '31'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: 33.1.a
    text: de vergoeding en het maximum bedrag per krediet;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel33
  - number: 33.1.b
    text: de wijze waarop de omvang van het krediet wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel33
  - number: 33.1.c
    text: de voorwaarden waaronder het krediet moet worden terugbetaald;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel33
  - number: 33.1.d
    text: een bepaling inzake de duur en de beëindiging van de overeenkomst tot krediet;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel33
  - number: 33.1.e
    text: een bepaling met betrekking tot betalingen door Onze Minister aan de financier;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel33
  - number: 33.1.f
    text: de terugvordering van kredieten en de uitwinning van zekerheden;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel33
  - number: '33.2'
    text: Bij ministeriële regeling wordt de hoogte van de vergoeding of de wijze van berekenen van de rente vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel33
  - number: '34.1'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de voorwaarden waaronder een subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel34
  - number: '34.2'
    text: |-
      Indien een subsidie wordt verleend aan de deelnemers in een samenwerkingsverband, kan bij ministeriële regeling
      of bij de beschikking tot subsidieverlening als voorwaarde worden gesteld dat binnen een bepaalde termijn een
      overeenkomst wordt verstrekt waarin de samenwerking tussen de deelnemers in het samenwerkingsverband is geregeld.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel34
  - number: '35'
    text: |-
      De in dit hoofdstuk opgenomen verplichtingen gelden voor een ontvanger van een subsidie, niet zijnde een subsidie
      aan een financier.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel35
  - number: '36'
    text: |-
      De subsidie-ontvanger en de penvoerder doen onverwijld mededeling aan Onze Minister van de indiening bij de
      rechtbank van een verzoek tot het op hem toepassing verklaren van de schuldsaneringsregeling natuurlijke personen,
      tot verlening van surseance van betaling aan hem of tot faillietverklaring van hem.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel36
  - number: 36a
    text: 'De subsidie-ontvanger doet onverwijld mededeling aan Onze Minister zodra aannemelijk is dat:'
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel36a
  - number: 36a.a
    text: de subsidiabele activiteiten niet, niet tijdig of niet geheel zullen worden verricht, of
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel36a
  - number: 36a.b
    text: niet, niet tijdig of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel36a
  - number: '37.1'
    text: |-
      Indien de beschikking tot subsidieverlening betrekking heeft op een plan, voert de subsidie-ontvanger de
      activiteiten uit overeenkomstig dit plan.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel37
  - number: '37.2'
    text: |-
      De subsidie-ontvanger meldt aan Onze Minister indien de subsidiabele kosten zoals opgenomen in de mijlpalen in het
      plan in het desbetreffende kwartaal of, indien er geen mijlpalenplanning is, in het desbetreffende kalenderjaar
      meer dan 25% afwijken van de begroting.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel37
  - number: '37.3'
    text: |-
      Onze Minister kan voor het vertragen, essentieel wijzigen of het stopzetten van activiteiten op voorafgaand verzoek
      van de subsidie-ontvanger ontheffing verlenen van de verplichting, bedoeld in het eerste lid. Aan de ontheffing
      kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel37
  - number: '38.1'
    text: |-
      De subsidie-ontvanger voert een zodanige administratie dat daaruit te allen tijde op eenvoudige en duidelijke wijze
      is af te leiden:
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel38
  - number: 38.1.a
    text: de aard, inhoud en voortgang van de verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel38
  - number: 38.1.b
    text: het aantal eenheden dat per kostendrager is besteed aan activiteiten die voor subsidie in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel38
  - number: 38.1.c
    text: het aantal uren dat per persoon is besteed aan activiteiten die voor subsidie in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel38
  - number: 38.1.d
    text: |-
      indien een tarief als bedoeld in [artikel 12, eerste lid][ref1], wordt gehanteerd, de berekening en samenstelling
      van het tarief;


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 38.1.e
    text: de specifiek ten behoeve van de activiteiten gemaakte en betaalde kosten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel38
  - number: '38.2'
    text: De administratie wordt tot vijf jaar na de datum van de beschikking tot subsidievaststelling bewaard.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel38
  - number: '38.3'
    text: |-
      Indien de subsidie minder bedraagt dan € 125.000 zijn het eerste en tweede lid niet van toepassing; in dat geval
      beschikt de subsidie-ontvanger tot vijf jaar na de datum van de beschikking tot subsidievaststelling over die
      gegevens die nodig zijn om desgevraagd aan te tonen dat de subsidiabele activiteiten zijn verricht.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel38
  - number: '39.1'
    text: |-
      Indien de periode van uitvoering van de activiteiten die voor subsidie in aanmerking komen meer dan twaalf maanden
      in beslag neemt, wordt bij de beschikking tot subsidieverlening de verplichting opgelegd tot indiening van één of
      meer rapportages, maar ten hoogste één rapportage per jaar, waarbij rekening wordt gehouden met de mijlpalen van
      de activiteiten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel39
  - number: '39.2'
    text: |-
      Indien subsidie-ontvangers samenwerken in een samenwerkingsverband, dienen zij hun rapportages in via een
      penvoerder.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel39
  - number: '39.3'
    text: Indien de subsidie minder bedraagt dan € 25.000 is het eerste lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel39
  - number: '40.1'
    text: |-
      De subsidie-ontvanger draagt zorg voor een verantwoord gebruik van de uit de activiteiten voortvloeiende resultaten
      overeenkomstig de subsidie-aanvraag.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel40
  - number: '40.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel40
  - number: '41.1'
    text: |-
      Wanneer een geheel of gedeeltelijk van overheidswege gefinancierde onderzoeksorganisatie deel uitmaakt van een
      samenwerkingsverband, sluiten de deelnemers in het samenwerkingsverband een overeenkomst over de wijze waarop wordt
      omgegaan met de overdracht van kennis of andere resultaten uit de activiteiten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel41
  - number: '41.2'
    text: |-
      Indien in de overeenkomst is opgenomen dat een onderzoeksorganisatie als bedoeld in het eerste lid kennis of andere
      resultaten uit de activiteiten overdraagt aan een ondernemer die deelneemt in het samenwerkingsverband, legt de
      penvoerder de afspraken voor aan Onze Minister, tenzij:
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel41
  - number: 41.2.a
    text: de deelnemende ondernemingen de volledige kosten dragen van de activiteiten van deze onderzoeksorganisatie,
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel41
  - number: 41.2.b
    text: |-
      de resultaten waaraan geen intellectuele eigendomsrechten kunnen worden ontleend, ruim kunnen worden verspreid
      en eventuele intellectuele eigendomsrechten op de resultaten die uit de activiteiten van de onderzoeksorganisatie
      voortvloeien, volledig aan deze onderzoeksorganisatie worden toegekend of,
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel41
  - number: 41.2.c
    text: |-
      deze onderzoeksorganisatie van de deelnemende ondernemingen een vergoeding ontvangt die overeenstemt met de
      marktprijs voor de intellectuele eigendomsrechten die voortvloeien uit de door de onderzoeksorganisatie in het
      kader van de activiteiten en die worden overgedragen aan de deelnemende ondernemingen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel41
  - number: '42.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een subsidie wordt verstrekt met de verplichting dat de subsidie-
      ontvanger de verstrekte subsidie volgens een in de beschikking tot subsidieverlening vastgelegd schema terugbetaalt
      aan Onze Minister. In dat geval wordt in de ministeriële regeling geregeld wanneer en onder welke voorwaarden de
      subsidie wordt terugbetaald.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel42
  - number: '42.2'
    text: 'Bij ministeriële regeling kan worden bepaald dat de subsidie die wordt terugbetaald, wordt vermeerderd met:'
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel42
  - number: 42.2.a
    text: rente, te rekenen vanaf het moment van betaling, of
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel42
  - number: 42.2.b
    text: een opslag.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel42
  - number: '42.3'
    text: |-
      De subsidie-ontvanger kan Onze Minister tot het tijdstip waarop een aanvraag tot subsidievaststelling is ingediend,
      verzoeken om ontheffing te verlenen van de verplichting de verstrekte subsidie, inclusief eventuele rente of
      opslag, terug te betalen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel42
  - number: '42.4'
    text: |-
      De ontheffing, bedoeld in het derde lid, kan worden verleend indien eerder een ontheffing is verleend voor het
      vertragen, essentieel wijzigen of stopzetten van de activiteiten in verband met onoverkomelijke problemen of het
      verloren gaan van het marktperspectief.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel42
  - number: '42.5'
    text: |-
      De subsidie-ontvanger kan Onze Minister nadat een aanvraag tot subsidievaststelling is ingediend, verzoeken om
      ontheffing te verlenen van de verplichting subsidie, inclusief eventuele rente of opslag, terug te betalen volgens
      het bij de beschikking tot subsidieverlening vastgelegde schema.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel42
  - number: '42.7'
    text: Aan de ontheffingen, bedoeld in het derde en vijfde lid, kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel42
  - number: '43'
    text: Onze Minister kan bij de beschikking tot subsidieverlening nadere verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel43
  - number: '44.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een of meer van de in dit hoofdstuk opgenomen verplichtingen niet
      van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel44
  - number: '44.2'
    text: |-
      Bij ministeriële regeling kunnen andere verplichtingen dan de in dit hoofdstuk opgenomen verplichtingen worden
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel44
  - number: '45.1'
    text: |-
      Onze Minister verstrekt ambtshalve voorschotten voor een subsidie, niet zijnde een subsidie aan een financier, die
      nog niet is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel45
  - number: '45.2'
    text: |-
      Indien subsidie-ontvangers samenwerken in een samenwerkingsverband, verstrekt Onze Minister de voorschotten via de
      penvoerder aan de subsidie-ontvanger. Deze betaling geldt als betaling aan de subsidie-ontvanger.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel45
  - number: '45.3'
    text: |-
      De hoogte en het moment van verstrekking van de voorschotten worden bepaald door de regels, genoemd in de vijfde
      kolom van onderstaande tabel voor de situaties als bedoeld in de eerste vier kolommen van de tabel.









