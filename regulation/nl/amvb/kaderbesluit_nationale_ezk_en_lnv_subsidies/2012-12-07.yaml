preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 14 juli 2008, nr. WJZ / 8086267;

    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    De Raad van State gehoord (advies van 29 augustus 2008, nr. W10.08.0292 III);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 17 november 2008, nr. WJZ / 8177535;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *algemene
      groepsvrijstellingsverordening:* [verordening (EG) nr. 800/2008](32008R0800) van de Commissie van de Europese
      Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van de artikelen 87 en 88 van het
      Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard («de algemene groepsvrijstellingsverordening»)
      (PbEU L 214);
        - *bank:* binnen het grondgebied van de Europese Unie gevestigde bank die is toegelaten het bedrijf van bank uit
      te oefenen;
        - *de-minimis verordening:* [verordening (EG) nr. 1998/2006](32006R1998) van de Commissie van Europese
      Gemeenschappen van 15 december 2006 betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op de-
      minimissteun (PbEU L379) ), [verordening (EG) nr. 1535/2007](32007R1535) van de Commissie van de Europese
      Gemeenschappen van 20 december 2007 betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op de-
      minimissteun in de landbouwproductiesector (PbEU L 337) en [verordening (EG) nr. 875/2007](32007R0875) van de
      Commissie van de Europese Gemeenschappen van 24 juli 2007 betreffende de toepassing van de artikelen 87 en 88 van
      het Verdrag op de-minimissteun in de landbouwsector en de visserijsector (PbEU L 193);
        - *Europees steunkader:* een mededeling, richtsnoer, kaderregeling, beschikking of vrijstellingsverordening op het
      gebied van staatssteun die de Europese Commissie, gelet op de artikelen 86, derde lid , 87 en 88 van het EG-Verdrag
      heeft vastgesteld
        - *financier:* een bank of een participatiemaatschappij of een andere, door Onze Minister aangewezen instelling;
        - *groep:* een economische eenheid, waarin organisatorisch zijn verbonden: a. een natuurlijke persoon of
      privaatrechtelijke rechtspersoon, die direct of indirect: 1°. meer dan de helft van het geplaatste kapitaal
      verschaft aan, 2°. volledig aansprakelijk vennoot is van, of 3°. overwegende zeggenschap heeft over een of meer
      rechtspersonen of vennootschappen, en b. laatstbedoelde rechtspersonen of vennootschappen;
        - *kapitaalvennootschap:* a. een vennootschap als bedoeld in artikel 1 van de Eerste [Richtlijn 68/151/EEG]
      (31968L0151) van de Raad van 9 maart 1968 strekkende tot het coördineren van de waarborgen, welke in de Lid-
      Staten worden verlangd van de vennootschappen in de zin van de tweede alinea van artikel 58 van het Verdrag, om
      de belangen te beschermen zowel van de deelnemers in deze vennootschappen als van derden, zulks ten einde die
      waarborgen gelijkwaardig te maken (PB EG L 65), of b. een kapitaalvennootschap die is ingericht naar het recht
      van één van de lidstaten van de Europese Unie, die rechtspersoonlijkheid bezit, een apart vermogen heeft dat bij
      uitsluiting voor de schulden van de vennootschap kan worden aangesproken en op grond van haar nationale wetgeving
      onderworpen is aan garantievoorwaarden zoals bedoeld in [Richtlijn 68/151/EEG](31968L0151) van de Raad om de
      belangen van zowel deelgerechtigden als derden te beschermen;
        - *kleine onderneming:* kleine onderneming in de zin van de algemene groepsvrijstellingsverordening;
        - *kostendrager:* een product of een in economisch opzicht homogene groep van producten, die als voorwerp van
      calculatie wordt gekozen;
        - *middelgrote onderneming:* een middelgrote onderneming in de zin van de algemene groepsvrijstellingsverordening;
        - *MKB-ondernemer:* een ondernemer die een kleine onderneming of een middelgrote onderneming in stand houdt;
        - *ondernemer:* een natuurlijke persoon, een rechtspersoon of een vennootschap, die een onderneming in stand houdt,
      niet zijnde een rechtspersoon die krachtens publiekrecht is ingesteld;
        - *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent;
        - *onderzoeksorganisatie:* een onderzoeksorganisatie als bedoeld in paragraaf 2.2, onderdeel d, van de
      Communautaire kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU
      C 323);
        - *penvoerder:* de door het samenwerkingsverband aangewezen penvoerende persoon of organisatie;
        - *participatiemaatschappij:* een vennootschap in de vorm van een kapitaalvennootschap of een vennootschap met een
      afgescheiden vermogen, ingericht naar het recht van één van de lidstaten van de Europese Unie, die blijkens haar
      statuten of blijkens de overeenkomst waarbij zij is aangegaan tot doel heeft of mede tot doel heeft het verstrekken
      van risicokapitaal aan ondernemers teneinde winst te behalen;
        - *samenwerkingsverband:* een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee niet in
      een groep verbonden deelnemers, dat is opgericht ten behoeve van de uitvoering van activiteiten, niet zijnde een
      vennootschap;
        - *specifieke uitkering:* een subsidie aan een provincie, gemeente of openbaar lichaam als bedoeld in
      de [Wet gemeenschappelijke regelingen][ref1] die tevens een specifieke uitkering is als bedoeld in de
      [Financiële-verhoudingswet][ref2];
        - *subsidie aan een financier:* een subsidie, verstrekt aan een financier, met als doel om kapitaal te doen
      verstrekken aan ondernemingen;
        - *universiteit:* een [onder a of b van de bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek]
      (onbekend) genoemde instelling voor hoger onderwijs, alsmede een [onder i van de bijlage van die wet](onbekend)
      genoemd academisch ziekenhuis;
        - *voucher:* een op grond van dit besluit door Onze Minister afgegeven waardedocument voor een deel van de kosten
      die met het doel waarvoor de voucher wordt gegeven, gepaard gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0008290
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel1
    references:
      - id: ref1
