        artikel: '46'
        hoofdstuk: '12'
  - number: '46.1'
    text: Onze Minister verstrekt het eerste voorschot ambtshalve binnen twee weken na aanvang van de activiteiten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel46
  - number: '46.2'
    text: |-
      De volgende voorschotten worden ambtshalve verstrekt binnen twee weken na 1 januari, 1 april, 1 juli en 1 oktober
      voor de in het desbetreffende kwartaal te maken kosten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel46
  - number: '46.3'
    text: |-
      Als datum van aanvang van de activiteiten geldt de dag na de verzending van de beschikking tot subsidieverlening
      of, indien deze later is, de datum die in het plan is opgenomen voor de start van de activiteiten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel46
  - number: '46.4'
    text: |-
      Het voorschot bedraagt 90% van het bedrag dat in het desbetreffende kwartaal maximaal voor subsidie in aanmerking
      komt.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel46
  - number: '46.5'
    text: |-
      Het voorschot bedraagt 100% van het bedrag dat in het desbetreffende kwartaal maximaal voor subsidie in aanmerking
      komt.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel46
  - number: '46.6'
    text: |-
      Onze Minister berekent de hoogte van het maximaal voor subsidie in aanmerking komende bedrag door de in de periode
      tussen twee mijlpalen te maken subsidiabele kosten te vermenigvuldigen met het subsidiepercentage, bedoeld in
      [artikel 5, eerste lid][ref1], of [artikel 9][ref2], en te delen door het aantal voorschotmomenten in deze periode.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel9
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '46.7'
    text: |-
      Onze Minister berekent de hoogte van het maximaal voor subsidie in aanmerking komende bedrag door de volgens het
      plan in dat kalenderjaar te maken subsidiabele kosten te vermenigvuldigen met het subsidiepercentage, bedoeld in
      [artikel 5, eerste lid][ref1], of [artikel 9][ref2], en te delen door het aantal voorschotmomenten in deze periode.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel9
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '46.8'
    text: |-
      De volgende voorschotten worden ambtshalve verstrekt telkens binnen twee weken na het verstrijken van twaalf
      maanden na de aanvang van de activiteiten.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel46
  - number: '46.9'
    text: |-
      Het bedrag van het voorschot wordt berekend door 90% van het maximale subsidiebedrag te delen door het aantal
      voorschotmomenten tijdens de gehele subsidieperiode. Bij ministeriële regeling kan een andere berekeningswijze
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel46
  - number: '46.10'
    text: Het geheel van voorschotten bedraagt niet meer dan het voorschotpercentage maal de maximale hoogte van de subsidie.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel46
  - number: '47.1'
    text: Het voorschot wordt ambtshalve verstrekt binnen twee weken na de datum van de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel47
  - number: '47.2'
    text: Het voorschot bedraagt 90% van de maximale hoogte van de subsidie.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel47
  - number: '47.3'
    text: Het voorschot bedraagt 100% van de maximale hoogte van de subsidie.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel47
  - number: '48.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het voorschot een ander percentage bedraagt dan genoemd in
      [artikel 46, vierde en vijfde lid][ref1] en [artikel 47, tweede en derde lid][ref2] of dat geen voorschot wordt
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel47
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '46'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '47'
        hoofdstuk: '12'
  - number: '48.2'
    text: |-
      Bij ministeriële regeling kunnen voor publiekrechtelijke rechtspersonen en andere, bij ministeriële regeling
      aangewezen instellingen of organisaties, van de [artikelen 45 tot en met 47][ref1] afwijkende bepalingen over
      voorschotten worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel45
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '45'
        hoofdstuk: '12'
  - number: '48.3'
    text: |-
      Bij ministeriële regeling kunnen van [artikelen 45 tot en met 47][ref1] afwijkende bepalingen over voorschotten
      worden opgenomen indien bij de verstrekking van een subsidie nauw wordt aangesloten bij subsidies als bedoeld in
      [artikel 2, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel2
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '45'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '2'
        hoofdstuk: '2'
  - number: '48.4'
    text: |-
      Bij ministeriële regeling kan in afwijking van [artikel 45, derde lid][ref1], voor subsidies waarvan het maximaal
      voor subsidie in aanmerking komende bedrag meer bedraagt dan € 25.000 maar niet meer dan € 125.000 en waarvan de
      duur van de subsidie meer dan één jaar kan bedragen, worden bepaald dat voor de bevoorschotting de regels gelden
      van [artikel 46, eerste, derde, achtste en negende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel46
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '45'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '46'
        hoofdstuk: '12'
  - number: '48.5'
    text: Indien de subsidie minder bedraagt dan € 25.000 is het eerste lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel48
  - number: '49'
    text: |-
      De in dit hoofdstuk opgenomen bepalingen gelden voor een ontvanger van een subsidie, niet zijnde een subsidie aan
      een financier.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel49
  - number: '50.1'
    text: |-
      Tenzij de beschikking tot subsidieverlening tevens de subsidievaststelling inhoudt, dient de subsidie-ontvanger
      zijn aanvraag om subsidievaststelling in uiterlijk dertien weken na het tijdstip waarop de activiteiten moeten
      zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel50
  - number: '50.2'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een formulier, dat bij ministeriële regeling wordt vastgesteld.
      De aanvraag gaat, overeenkomstig in het formulier is vermeld, vergezeld van de in het formulier aangegeven
      bescheiden, waaronder in elk geval:
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel50
  - number: 50.2.a
    text: een eindverslag omtrent de uitvoering en de resultaten van de activiteiten en
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel50
  - number: 50.2.b
    text: indien het subsidiebedrag € 125 000 of meer bedraagt, een accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel50
  - number: '50.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat, in afwijking van het tweede lid, onderdeel b, de aanvraag niet
      vergezeld hoeft te gaan van een accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel50
  - number: '50.4'
    text: |-
      In afwijking van het eerste lid kan bij ministeriële regeling worden bepaald dat de subsidie ambtshalve wordt
      vastgesteld. De beschikking tot subsidieverlening vermeldt de datum waarop:
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel50
  - number: 50.4.a
    text: de activiteiten uiterlijk zijn verricht;
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel50
  - number: 50.4.b
    text: de subsidie uiterlijk ambtshalve wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel50
  - number: '51.1'
    text: |-
      Indien subsidie-ontvangers samenwerken in een samenwerkingsverband, dienen zij hun aanvraag tot
      subsidievaststelling in via de penvoerder.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel51
  - number: '51.2'
    text: |-
      Indien subsidie-ontvangers samenwerken in een samenwerkingsverband, betaalt Onze Minister het subsidiebedrag via de
      penvoerder aan de subsidie-ontvanger. Deze betaling geldt als betaling aan de subsidie-ontvanger.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel51
  - number: '52.1'
    text: |-
      Onze Minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel52
  - number: '52.2'
    text: |-
      Indien een beschikking tot subsidievaststelling niet binnen de in het eerste lid genoemde termijn kan worden
      gegeven, kan deze termijn eenmaal met dertien weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel52
  - number: '53.1'
    text: |-
      Bij ministeriële regeling kunnen voor bij ministeriële regeling aangewezen instellingen of organisaties, van de
      [artikelen 50 tot en met 52][ref1] afwijkende bepalingen over de subsidievaststelling worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '50'
        hoofdstuk: '13'
  - number: '53.2'
    text: |-
      [Artikel 50][ref1] is niet van toepassing op de verstrekking van specifieke uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '50'
        hoofdstuk: '13'
  - number: '54.1'
    text: 'De volgende besluiten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel54
  - number: 54.1.a
    text: |-
      het [Besluit borgstelling MKB-kredieten 1997][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0009052
  - number: 54.1.b
    text: |-
      het [Besluit borgstelling scheepsnieuwbouw][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019103
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0019103
  - number: 54.1.c
    text: |-
      het [Besluit innovatiesubsidie samenwerkingsprojecten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015925
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0015925
  - number: 54.1.d
    text: |-
      het [Besluit subsidies investeringen kennisinfrastructuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014472
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0014472
  - number: '54.2'
    text: |-
      De overeenkomsten, gesloten op basis van [artikel 10 van het Besluit borgstelling MKB-kredieten 1997][ref1], worden
      geacht in stand te blijven tot een nieuwe overeenkomst is gesloten of, indien dit eerder is, tot twee jaar na de
      datum van inwerkingtreding van dit besluit, behoudens beëindiging van een overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0009052#Artikel10
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0009052
        artikel: '10'
  - number: '55'
    text: Dit besluit treedt in werking met ingang van 1 januari 2009.
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel55
  - number: '56'
    text: 'Dit besluit wordt aangehaald als: Kaderbesluit EZ-subsidies.'
    url: https://wetten.overheid.nl/BWBR0024796/2012-12-07#Artikel56
