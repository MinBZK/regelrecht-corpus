  - number: '18'
    text: |-
      1 Bij ministeriële regeling kan, als het maximale subsidiebedrag per aanvraag gelijk is aan of meer bedraagt dan
      € 25.000 of als een subsidie wordt verstrekt aan een financier, worden bepaald dat over aanvragen om subsidie
      ten behoeve van de beoordeling hiervan advies wordt ingewonnen bij een adviescommissie. In dat geval kan bij
      ministeriële regeling worden bepaald waarover de adviescommissie adviseert. Indien aanvragen worden voorgelegd aan
      een adviescommissie, gelden het tweede tot en met twaalfde lid.

      2 De adviescommissie heeft tot taak Onze Minister op zijn verzoek te adviseren omtrent aanvragen om subsidie.

      3 De adviezen van de adviescommissie gaan vergezeld van een deugdelijke motivering.

      4 De adviescommissie bestaat uit een voorzitter en een aantal leden. De leden zijn deskundig op het terrein waarop
      de adviescommissie een taak heeft. De voorzitter en de leden zijn geen ambtenaren, werkzaam bij het Ministerie van
      Economische Zaken of andere ministeries die voor de subsidie verantwoordelijk zijn of mede verantwoordelijk zijn.

      5 Bij ministeriële regeling wordt het aantal leden en de benoemingstermijn van de voorzitter en van de leden van de
      adviescommissie vastgesteld.

      6 De voorzitter en de leden worden door Onze Minister benoemd en ontslagen. Zij zijn telkens opnieuw benoembaar
      voor de termijn, bedoeld in het vijfde lid.

      7 De adviescommissie stelt haar eigen werkwijze schriftelijk vast.

      8 Een lid van de adviescommissie neemt niet deel aan de voorbereiding en vaststelling van een advies, indien hij
      een persoonlijk belang heeft bij de beschikking op de aanvraag.

      9 Onze Minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de adviescommissie bij te
      wonen.

      10 In het secretariaat van de adviescommissie wordt door Onze Minister voorzien.

      11 Het beheer van de bescheiden betreffende de werkzaamheden van de adviescommissie geschiedt op overeenkomstige
      wijze als bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de
      adviescommissie bewaard in het archief van dat ministerie.

      12 De adviescommissie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel18
  - number: '19'
    text: |-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van een middel dat door Onze Minister beschikbaar
      wordt gesteld.

      2 Bij ministeriële regeling kunnen nadere eisen worden gesteld aan de aanvraag om subsidie.

      3 Bij ministeriële regeling kunnen regels worden gesteld over het tijdstip van indienen van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel19
  - number: '20'
    text: |-
      Indien aanvragers van subsidie samenwerken in een samenwerkingsverband, dient de penvoerder namens hen de
      subsidieaanvraag in.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel20
  - number: '21'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat een aanvraag vergezeld gaat van een advies van een
      adviescommissie, uitgebracht aan de aanvrager op basis van een vooraanmelding.

      2 De vooraanmelding bevat een voorlopige opgave van de gewenste te subsidiëren activiteiten en van de wijze waarop
      aan de toepasselijke voorschriften naar verwachting zal kunnen worden voldaan.

      3 Bij de toepassing van het eerste lid vindt vooraanmelding plaats met gebruikmaking van een middel dat door Onze
      Minister beschikbaar wordt gesteld en kunnen bij ministeriële regeling nadere eisen worden gesteld.

      4 [Artikel 18, derde tot en met twaalfde lid][ref1], is van overeenkomstige toepassing op de adviescommissie,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel18
