  - number: '22'
    text: |-
      1 Onze Minister beslist afwijzend op een aanvraag om subsidie indien:

      a. de aanvraag niet voldoet aan de bij of krachtens dit besluit gestelde regels;

      b. de subsidieverstrekking:

      1°. niet zou voldoen aan de eis van transparantie van steun, bedoeld in het toepasselijke Europese steunkader;

      2°. zou leiden tot een overschrijding van het de-minimisplafond of de aanmeldingsdrempel, bedoeld in het
      toepasselijke Europese steunkader;

      3°. zou leiden tot een overschrijding van de maximale steunintensiteit, die van toepassing is op de specifieke
      steuncategorie, bedoeld in het toepasselijke Europese steunkader;

      4°. in strijd zou zijn met het bepaalde bij of krachtens [artikel 6][ref1], [7][ref2] of [8][ref3] of een
      bepaling inzake het cumuleren van steun als bedoeld in het toepasselijke Europese steunkader;

      c. niet voldaan wordt aan de eisen inzake het stimulerend effect, bedoeld in het toepasselijke Europese steunkader;

      d. de subsidie is bestemd voor:

      1°. een onderneming tegen wie een bevel tot terugvordering uitstaat als bedoeld in het toepasselijke Europese
      steunkader;

      2°. een onderneming in moeilijkheden als bedoeld in het toepasselijke Europese steunkader, tenzij het op grond van
      het toepasselijke Europese steunkader is toegestaan aan een onderneming in moeilijkheden subsidie te verlenen;

      3°. een onderneming die geen activiteiten verricht of niet actief is in de sectoren waarvoor steun wordt verleend
      op grond van het toepasselijke Europese steunkader, of

      4°. een onderneming die actief is in een sector waarvoor het op grond van het toepasselijke Europese steunkader
      niet is toegestaan steun te verlenen, tenzij deze onderneming tevens werkzaam is in een andere sector en zij er,
      met passende middelen zoals een scheiding van de activiteiten of een uitsplitsing van de kosten, voor zorgt dat de
      activiteiten in de uitgesloten sector geen voor de andere sector bestemde subsidie genieten;

      e. de subsidie bestaat uit steun die een effect heeft op de in- en uitvoer dat niet is toegestaan op grond van het
      toepasselijke Europese steunkader;

      f. sprake is van staatssteunmaatregelen die door de daaraan verbonden voorwaarden of de methode waarmee zij
      worden gefinancierd, tot een daarmee onlosmakelijk verbonden schending van het Unierecht leiden als bedoeld in het
      toepasselijke Europese steunkader.

      2 Het eerste lid is niet van toepassing voor zover in een door de Europese Commissie op grond van artikel 42, 106,
      derde lid, 107 of 108 van het Verdrag betreffende de werking van de Europese Unie verleende goedkeuring anders
      is bepaald.


