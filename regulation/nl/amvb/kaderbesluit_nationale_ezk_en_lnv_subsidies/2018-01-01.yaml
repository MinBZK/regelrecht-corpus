  - number: '52'
    text: |-
      Onze Minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel52
  - number: '53'
    text: |-
      1 Bij ministeriële regeling kunnen voor bij ministeriële regeling aangewezen instellingen of organisaties, van de
      [artikelen 50 tot en met 52][ref1] afwijkende bepalingen over de subsidievaststelling worden opgenomen.

      2 [Artikel 50][ref2] is niet van toepassing op de verstrekking van specifieke uitkeringen.


