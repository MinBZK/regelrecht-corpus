  - number: '46'
    text: |-
      1 Onze Minister verstrekt het eerste voorschot ambtshalve binnen twee weken na aanvang van de activiteiten.

      2 De volgende voorschotten worden ambtshalve verstrekt binnen twee weken na 1 januari, 1 april, 1 juli en 1 oktober
      voor de in het desbetreffende kwartaal te maken kosten.

      3 Als datum van aanvang van de activiteiten geldt de dag na de verzending van de beschikking tot subsidieverlening
      of, indien deze later is, de datum die in het plan is opgenomen voor de start van de activiteiten.

      4 Het voorschot bedraagt 90% van het bedrag dat in het desbetreffende kwartaal maximaal voor subsidie in aanmerking
      komt.

      5 Het voorschot bedraagt 100% van het bedrag dat in het desbetreffende kwartaal maximaal voor subsidie in
      aanmerking komt.

      6 Onze Minister berekent de hoogte van het maximaal voor subsidie in aanmerking komende bedrag door de in de
      periode tussen twee mijlpalen te maken subsidiabele kosten te vermenigvuldigen met een bij ministeriële regeling
      bepaald subsidiepercentage en te delen door het aantal voorschotmomenten in deze periode.

      7 Onze Minister berekent de hoogte van het maximaal voor subsidie in aanmerking komende bedrag door de volgens
      het plan in de gehele subsidieperiode te maken subsidiabele kosten te vermenigvuldigen met een bij ministeriële
      regeling bepaald subsidiepercentage en te delen door het aantal voorschotmomenten in deze periode.

      8 De volgende voorschotten worden ambtshalve verstrekt telkens binnen twee weken na het verstrijken van twaalf
      maanden na de aanvang van de activiteiten.

      9 Het bedrag van het voorschot wordt berekend door 90% van het maximale subsidiebedrag te delen door het aantal
      voorschotmomenten tijdens de gehele subsidieperiode. Bij ministeriële regeling kan een andere berekeningswijze
      worden vastgesteld.

      10 Het geheel van voorschotten bedraagt niet meer dan het voorschotpercentage maal de maximale hoogte van de
      subsidie.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel46
  - number: '47'
    text: |-
      1 Het voorschot wordt ambtshalve verstrekt binnen twee weken na de datum van de beschikking tot subsidieverlening.

      2 Het voorschot bedraagt 90% van de maximale hoogte van de subsidie.

      3 Het voorschot bedraagt 100% van de maximale hoogte van de subsidie.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel47
  - number: '48'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat het voorschot een ander percentage bedraagt dan genoemd in
      [artikel 46, vierde en vijfde lid][ref1] en [artikel 47, tweede en derde lid][ref2] of dat geen voorschot wordt
      verstrekt.

      2 Bij ministeriële regeling kunnen voor publiekrechtelijke rechtspersonen en andere, bij ministeriële regeling
      aangewezen instellingen of organisaties, van de [artikelen 45 tot en met 47][ref3] afwijkende bepalingen over
      voorschotten worden opgenomen.

      3 Bij ministeriële regeling kunnen van [artikelen 45 tot en met 47][ref4] afwijkende bepalingen over voorschotten
      worden opgenomen indien bij de verstrekking van een subsidie nauw wordt aangesloten bij:

      a. subsidies die worden verstrekt op basis van of in nauwe samenhang met een bindend besluit van de Raad, van het
      Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Unie, of

      b. subsidies die worden verstrekt met het oog op cofinanciering van een door de Raad of de Commissie van de
      Europese Unie goedgekeurd programma.

      4 Bij ministeriële regeling kan in afwijking van [artikel 45, tweede lid][ref5], voor subsidies waarvan het
      maximaal voor subsidie in aanmerking komende bedrag meer bedraagt dan € 25.000 maar niet meer dan € 125.000 en
      waarvan de duur van de subsidie meer dan één jaar kan bedragen, worden bepaald dat voor de bevoorschotting de
      regels gelden van [artikel 46, eerste, derde, achtste en negende lid][ref6].

      5 Indien de subsidie minder bedraagt dan € 25.000 is het eerste lid niet van toepassing.


