  - number: '49'
    text: |-
      De in dit hoofdstuk opgenomen bepalingen gelden voor een ontvanger van een subsidie, niet zijnde een subsidie aan
      een financier.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel49
  - number: '50'
    text: |-
      1 Tenzij de beschikking tot subsidieverlening tevens de subsidievaststelling inhoudt, dient de subsidieontvanger
      zijn aanvraag om subsidievaststelling in uiterlijk dertien weken na het tijdstip waarop de activiteiten moeten
      zijn voltooid.

      2 De aanvraag wordt ingediend met gebruikmaking van een middel dat door Onze Minister beschikbaar wordt gesteld. De
      aanvraag gaat vergezeld van de bij ministeriële regeling bepaalde bescheiden, waaronder in ieder geval:

      a. een eindverslag omtrent de uitvoering en de resultaten van de activiteiten,

      b. een mededeling van andere inkomsten, waaronder subsidies, waarmee de activiteit waarop de subsidie betrekking
      heeft is gefinancierd en

      c. indien het subsidiebedrag € 125.000 of meer bedraagt, een controleverklaring van een accountant of accountant-
      administratieconsulent als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1],
      waaruit blijkt dat met de aanvraag wordt voldaan aan de voorschriften bedoeld in
      [artikel 4:45 van de Algemene wet bestuursrecht][ref2].

      3 In afwijking van het tweede lid, kan bij ministeriële regeling worden bepaald dat de aanvraag uitsluitend
      vergezeld gaat van een verklaring van de subsidieontvanger waaruit blijkt:

      a. dat de activiteiten waarvoor de subsidie is verleend, zijn verricht, voorzien van een korte toelichting;

      b. dat is voldaan aan de verplichtingen die aan de subsidie zijn verbonden;

      c. wat het totale bedrag van de gerealiseerde subsidiabele kosten is;

      d. wat, in voorkomend geval, de stand van de egaliteitsreserve is;

      e. wat het totale bedrag van de gerealiseerde opbrengsten, inclusief bijdragen van derde is; en

      f. wat het totale bedrag van de gerealiseerde eigen bijdrage is.

      4 Bij ministeriële regeling kunnen nadere eisen worden gesteld aan de aanvraag.

      5 De controleverklaring, bedoeld in het tweede lid, onderdeel c, wordt vastgesteld met inachtneming van bij
      ministeriële regeling te bepalen regels.

      6 Bij ministeriële regeling kan worden bepaald dat de controleverklaring, bedoeld in het tweede lid, onderdeel c,
      wordt vervangen door een rapport van feitelijke bevindingen van een accountant of accountant-administratieconsulent
      over de in [artikel 4:45 van de Algemene wet bestuursrecht][ref3] bedoelde voorschriften.

      7 Bij ministeriële regeling kan worden bepaald dat, in afwijking van het tweede lid, onderdeel c, de aanvraag niet
      vergezeld hoeft te gaan van een controleverklaring.

      8 In afwijking van het eerste lid kan bij ministeriële regeling worden bepaald dat de subsidie ambtshalve wordt
      vastgesteld. De beschikking tot subsidieverlening vermeldt de datum waarop:

      a. de activiteiten uiterlijk zijn verricht;

      b. de subsidie uiterlijk ambtshalve wordt vastgesteld.

      9 Indien door Onze Minister krachtens dit besluit een subsidie wordt verleend van minder dan € 25.000, wordt de
      subsidie ambtshalve vastgesteld, tenzij bij ministeriële regeling anders is bepaald.


