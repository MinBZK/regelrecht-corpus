  - number: 1a
    text: |-
      1 Indien de op grond van dit besluit bij ministeriële regeling gestelde regels bepalen dat een subsidie kan worden
      verstrekt in de openbare lichamen Bonaire, Sint Eustatius of Saba, is dit besluit voor die subsidie aldaar van
      toepassing.

      2 In het geval, bedoeld in het eerste lid, wordt in [artikel 3, eerste lid][ref1], onder «de Nederlandse economie
      of andere Nederlandse belangen» verstaan de economie en andere belangen van Bonaire, Sint Eustatius of Saba, en
      wordt in de [artikelen 31, onderdeel b][ref2], en [39a][ref3] onder «Nederland» verstaan Bonaire, Sint Eustatius
      of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel39a
