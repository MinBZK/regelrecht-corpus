  - number: '23'
    text: |-
      Onze Minister beslist afwijzend op een aanvraag om subsidie, niet zijnde een subsidie aan een financier, voor
      zover:

      a. onvoldoende vertrouwen bestaat dat de betrokkenen de activiteiten kunnen financieren;

      b. het onaannemelijk wordt geacht dat de activiteiten binnen een bij ministeriële regeling gestelde termijn kunnen
      worden voltooid;

      c. aannemelijk is dat de activiteiten ook zonder subsidie zonder belangrijke vertraging zouden worden uitgevoerd;

      d. onvoldoende vertrouwen bestaat in de technische haalbaarheid van de activiteiten;

      e. onvoldoende vertrouwen bestaat in de economische haalbaarheid van de activiteiten;

      f. de activiteiten onvoldoende bijdrage aan de doelstellingen van de subsidie leveren;

      g. onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om de activiteiten naar behoren uit
      te voeren;

      h. er een naar het oordeel van Onze Minister onaanvaardbaar risico bestaat dat de uitvoering van een voorgenomen
      activiteit een onevenredige inbreuk zal maken op de economische, ecologische of sociale dimensie van duurzaamheid.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel23
  - number: '24'
    text: |-
      Onze Minister beslist afwijzend op een aanvraag om subsidie aan een financier indien:

      a. de deskundigheid van degenen die zijn belast met het verstrekken, beheren en vervreemden van kapitaal en
      zekerheden onvoldoende gewaarborgd is;

      b. de betrouwbaarheid van degenen die zijn belast met het verstrekken, beheren en vervreemden van kapitaal en
      zekerheden, en met de bepaling van en het toezicht op het beleid ter zake onvoldoende gewaarborgd is;

      c. de integriteit van de financier onvoldoende gewaarborgd is;

      d. de financiële draagkracht en stabiliteit van de financier onvoldoende gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel24
  - number: '25'
    text: |-
