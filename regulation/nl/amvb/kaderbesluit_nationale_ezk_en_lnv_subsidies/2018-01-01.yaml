  - number: '39'
    text: |-
      1 Indien de periode van uitvoering van de activiteiten die voor subsidie in aanmerking komen meer dan twaalf
      maanden in beslag neemt, wordt bij de beschikking tot subsidieverlening de verplichting opgelegd tot indiening van
      één of meer rapportages, maar ten hoogste één rapportage per jaar, waarbij rekening wordt gehouden met de mijlpalen
      van de activiteiten.

      2 Indien subsidieontvangers samenwerken in een samenwerkingsverband, dienen zij hun rapportages in via een
      penvoerder.

      3 Indien de subsidie minder bedraagt dan € 25.000 is het eerste lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel39
  - number: 39a
    text: |-
      Een onderneming die op het tijdstip van de verlening van de subsidie geen vaste inrichting of dochteronderneming in
      Nederland heeft, draagt er zorg voor dat deze onderneming voor de eerste voorschotbetaling een vaste inrichting of
      dochteronderneming in Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel39a
  - number: '40'
    text: |-
      1 De subsidieontvanger draagt zorg voor een verantwoord gebruik van de uit de activiteiten voortvloeiende
      resultaten overeenkomstig de subsidie-aanvraag.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel40
  - number: '41'
    text: |-
      De subsidieontvanger verleent gedurende vijf jaar na de datum van de beschikking tot subsidievaststelling
      medewerking aan een evaluatie van de doeltreffendheid en de effecten van de aan hem verleende subsidie, voor zover
      medewerking redelijkerwijs van hem kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel41
  - number: '42'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat een subsidie wordt verstrekt met de verplichting dat de
      subsidieontvanger de verstrekte subsidie volgens een in de beschikking tot subsidieverlening vastgelegd schema
      terugbetaalt aan Onze Minister. In dat geval wordt in de ministeriële regeling geregeld wanneer en onder welke
      voorwaarden de subsidie wordt terugbetaald.

      2 Bij ministeriële regeling kan worden bepaald dat de subsidie die wordt terugbetaald, wordt vermeerderd met:

      a. rente, te rekenen vanaf het moment van betaling, of

      b. een opslag.

      3 Voor zover dit is toegestaan op grond van de toepasselijke Europese steunkaders en indien eerder een ontheffing
      is verleend voor het vertragen of essentieel wijzigen van de activiteiten in verband met onoverkomelijke problemen
      of het verloren gaan van het marktperspectief kan Onze Minister op verzoek van de subsidieontvanger voorafgaand aan
      de vaststelling van de subsidie ontheffing verlenen van de verplichting de verstrekte subsidie, inclusief eventuele
      rente of opslag, terug te betalen. Bij ministeriële regeling kan worden bepaald dat ontheffing ook na het tijdstip
      van vaststelling van de subsidie kan worden verleend.

      4 De subsidieontvanger kan Onze Minister nadat een aanvraag tot subsidievaststelling is ingediend, verzoeken om
      ontheffing te verlenen van de verplichting subsidie, inclusief eventuele rente of opslag, terug te betalen volgens
      het bij de beschikking tot subsidieverlening vastgelegde schema.

      5 Aan de ontheffingen, bedoeld in het derde en vierde lid, kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel42
  - number: '43'
    text: |-
      Onze Minister kan bij de beschikking tot subsidieverlening bij of krachtens dit besluit gestelde voorschriften
      nader invullen.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel43
  - number: '44'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat een of meer van de in dit hoofdstuk opgenomen verplichtingen
      niet van toepassing zijn.

      2 Bij ministeriële regeling kunnen andere verplichtingen dan de in dit hoofdstuk opgenomen verplichtingen worden
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel44
