  - number: '34'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld over de voorwaarden waaronder een subsidie wordt verleend.

      2 Indien een subsidie wordt verleend aan de deelnemers in een samenwerkingsverband, kan bij ministeriële regeling
      of bij de beschikking tot subsidieverlening als voorwaarde worden gesteld dat binnen een bepaalde termijn een
      overeenkomst wordt verstrekt waarin de samenwerking tussen de deelnemers in het samenwerkingsverband is geregeld.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel34
  - number: '35'
    text: De in dit hoofdstuk opgenomen verplichtingen gelden voor een ontvanger van een subsidie, niet zijnde een financier.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel35
  - number: '36'
    text: |-
      De subsidieontvanger en de penvoerder doen onverwijld schriftelijk mededeling aan Onze Minister van de indiening
      bij de rechtbank van een verzoek tot het op hem toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen, tot verlening van surseance van betaling aan hem of tot faillietverklaring van hem.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel36
  - number: 36a
    text: |-
      De subsidieontvanger doet onverwijld schriftelijk mededeling aan Onze Minister zodra aannemelijk is dat:

      a. de subsidiabele activiteiten niet, niet tijdig of niet geheel zullen worden verricht, of

      b. niet, niet tijdig of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel36a
  - number: '37'
    text: |-
      1 Indien de beschikking tot subsidieverlening betrekking heeft op een plan, voert de subsidieontvanger de
      activiteiten uit overeenkomstig dit plan.

      2 De subsidieontvanger meldt aan Onze Minister indien de subsidiabele kosten zoals opgenomen in de mijlpalen in
      het plan in het desbetreffende kwartaal of, indien er geen mijlpalenplanning is, in het desbetreffende kalenderjaar
      meer dan 25% afwijken van de begroting.

      3 Onze Minister kan voor het vertragenof het essentieel wijzigen van de wijze van uitvoering van de activiteiten
      op voorafgaand verzoek van de subsidieontvanger ontheffing verlenen van de verplichting, bedoeld in het eerste
      lid, tenzij hierdoor afbreuk wordt gedaan aan doelstellingen als omschreven in het plan. Aan de ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel37
  - number: '38'
    text: |-
      1 De subsidieontvanger voert een zodanige administratie dat daaruit te allen tijde op eenvoudige en duidelijke
      wijze is af te leiden:

      a. de aard, inhoud en voortgang van de verrichte werkzaamheden;

      b. het aantal eenheden dat per kostendrager is besteed aan activiteiten die voor subsidie in aanmerking komen;

      c. het aantal uren dat per persoon is besteed aan activiteiten die voor subsidie in aanmerking komen;

      d. indien een tarief als bedoeld in [artikel 12, eerste lid][ref1], wordt gehanteerd, de berekening en
      samenstelling van het tarief;

      e. de specifiek ten behoeve van de activiteiten gemaakte en betaalde kosten.

      2 De administratie wordt tot vijf jaar na de datum van de beschikking tot subsidievaststelling bewaard.

      3 Indien de subsidie minder bedraagt dan € 125.000 en de aanvraag voor vaststelling van de subsidie niet vergezeld
      dient te gaan van een verklaring als bedoeld in [artikel 50, derde lid][ref2], zijn het eerste en tweede lid
      niet van toepassing; in dat geval beschikt de subsidieontvanger tot vijf jaar na de datum van de beschikking tot
      subsidievaststelling over die gegevens die nodig zijn om desgevraagd aan te tonen dat de subsidiabele activiteiten
      zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel50
