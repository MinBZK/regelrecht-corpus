  - number: '27'
    text: |-
      1 Indien bij ministeriële regeling wordt gekozen voor verdeling van het subsidieplafond op volgorde van binnenkomst
      van de aanvragen, komt de aanvraag die het eerst is binnengekomen, het eerst voor subsidie in aanmerking.

      2 Indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de
      aanvraag aan te vullen, geldt met betrekking tot de verdeling de dag waarop de aanvraag voldoet aan de wettelijke
      voorschriften als dag van binnenkomst.

      3 Indien Onze Minister op de dag dat het subsidieplafond wordt bereikt meer dan één aanvraag ontvangt, stelt hij de
      volgorde van die aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
