  - number: '2'
    text: |-
      1 Onze Minister kan op aanvraag voor de activiteiten op de gebieden, genoemd in
      [artikel 2 van de Kaderwet EZ-subsidies][ref1], subsidie verstrekken volgens bij ministeriële regeling bepaalde
      regels.

      2 Onze Minister stelt regels als bedoeld in het eerste lid uitsluitend over activiteiten die tevens een positieve
      bijdrage leveren aan de economische, ecologische of sociale dimensie van duurzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel2
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '2'
  - number: '3'
    text: |-
      1 Een subsidie wordt verstrekt aan een natuurlijke persoon, rechtspersoon of vennootschap die voor eigen rekening
      en risico activiteiten uitvoert die ten goede komen aan de Nederlandse economie of andere Nederlandse belangen.

      2 Geen subsidie wordt verstrekt aan een provincie, gemeente of openbaar lichaam als bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1], tenzij bij ministeriële regeling is bepaald dat daaraan wel subsidie
      wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over:

      a. de activiteiten waarvoor subsidie wordt verleend;

      b. de aanvragers;

      c. een samenwerkingsverband en de penvoerder van het samenwerkingsverband;

      d. de vorm van de subsidie;

      e. het verstrekken van vouchers en de aanwending van vouchers;

      f. degenen met wie een financier een overeenkomst sluit;

      g. verplichtingen van Onze Minister in verband met de subsidie;

      h. onderwerpen die, in afwijking van of in aanvulling op de regels van dit besluit, nadere regeling behoeven op
      basis van een Europees steunkader;

      i. de wijze van uitvoering van de activiteiten waarvoor subsidie wordt verleend met het oog op de economische,
      ecologische of sociale dimensie van duurzaamheid.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel4
  - number: '5'
    text: |-
      1 Bij ministeriële regeling wordt de wijze van berekenen van de subsidie of de hoogte van de subsidie bepaald.

      2 Bij ministeriële regeling kan een minimum en maximum subsidiebedrag worden bepaald.

      3 De subsidie bedraagt niet meer dan is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel5
  - number: '6'
    text: |-
      1 Indien reeds door een bestuursorgaan of de Europese Commissie subsidie, met uitzondering van subsidie aan een
      financier, is verstrekt voor de subsidiabele kosten of een deel daarvan, wordt slechts een zodanig bedrag aan
      subsidie verstrekt dat het totale bedrag aan subsidies niet meer bedraagt dan het bedrag dat krachtens dit besluit
      kan worden verstrekt noch meer bedraagt dan toegestaan volgens de toepasselijke Europese steunkaders.

      2 Het eerste lid is niet van toepassing voor zover de verstrekte subsidie geldmiddelen betreft die één van Onze
      Ministers onder door hem gestelde voorschriften ter beschikking stelt als bijdrage in de algemene exploitatie- en
      investeringskosten die een onderzoeksorganisatie maakt.

      3 Indien bij ministeriële regeling is aangegeven dat een bijdrage van een gemeente, provincie of openbaar lichaam
      als bedoeld in [artikel 8 van de Wet gemeenschappelijke regelingen][ref1] of een ander bestuursorgaan aangemerkt
      wordt als publieke cofinanciering, kunnen bij ministeriële regeling van het eerste lid afwijkende regels worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: '7'
    text: |-
      1 Voor zover dit is toegestaan op grond van de toepasselijke Europese steunkaders kan bij ministeriële regeling
      worden bepaald dat bepaalde subsidieregelingen of bijdragen van de Europese Commissie bij de toepassing van
      [artikel 6][ref1] buiten beschouwing blijven.

      2 Voor zover dit is toegestaan op grond van de toepasselijke Europese steunkaders kunnen bij ministeriële
      regeling met betrekking tot de subsidie aan een financier regels worden gesteld over de cumulatie van subsidie bij
      ondernemingen aan wie als gevolg van de subsidie aan een financier kapitaal wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel6
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel7
