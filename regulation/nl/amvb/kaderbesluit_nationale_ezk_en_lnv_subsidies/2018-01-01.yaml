  - number: '12'
    text: |-
      1 Indien de aanvrager kiest voor de integrale kostensystematiek, berekent de aanvrager de directe en indirecte
      kosten per kostendrager in een tarief per eenheid van deze kostendrager.

      2 De subsidiabele kosten worden berekend door het aantal eenheden van de kostendragers te vermenigvuldigen met de
      ingevolge het eerste lid berekende tarief, vermeerderd met de aan derden betaalde kosten voor zover deze geen deel
      uitmaken van het ingevolge het eerste lid vastgestelde tarief.

      3 Bij een aanvraag om subsidie van € 125.000 of meer dient de subsidieontvanger uiterlijk bij de aanvraag om
      subsidievaststelling een afschrift in van een rapport van feitelijke bevindingen over de uitkomst van het onderzoek
      van een accountant betreffende de door de subsidieontvanger gehanteerde integrale kostensystematiek.

      4 Bij ministeriële regeling worden voorschriften gegeven over het rapport, bedoeld in het derde lid en kunnen
      andere rapporten worden aangewezen die in plaats van het rapport, bedoeld in het derde lid, worden ingediend.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel12
  - number: '13'
    text: |-
      1 Indien de aanvrager kiest voor de loonkosten plus vaste-opslag-systematiek, worden de subsidiabele kosten
      berekend door de directe loonkosten per uur te vermenigvuldigen met het aantal uren dat de direct bij de
      subsidiabele activiteiten betrokken personen ten behoeve van deze activiteiten hebben gemaakt, vermeerderd met:

      a. een vaste opslag voor indirecte kosten uitgedrukt als een percentage van de loonkosten, welk percentage bij
      ministeriële regeling wordt vastgesteld;

      b. de kosten van het gebruik van apparatuur en de kosten van verbruikte materialen en hulpmiddelen indien deze in
      de administratie te onderscheiden zijn;

      c. de aan derden betaalde kosten.

      2 Voor zover geen loonkosten worden gemaakt, maar niettemin arbeid wordt verricht, wordt voor de berekening van de
      kosten van die arbeid inclusief de opslag voor indirecte kosten, bedoeld in het eerste lid, onderdeel a, uitgegaan
      van een bij ministeriële regeling vast te stellen vast uurtarief.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel13
  - number: '14'
    text: |-
      Indien de aanvrager kiest voor de vaste-uurtarief-systematiek, worden de subsidiabele kosten berekend door het
      aantal uren dat de direct bij de subsidiabele activiteiten betrokken personen ten behoeve van deze activiteiten
      hebben gemaakt te vermenigvuldigen met een bij ministeriële regeling vast te stellen vast uurtarief waarin zowel de
      directe loonkosten als daaraan toegerekende indirecte kosten zijn begrepen, vermeerderd met:

      a. de kosten van het gebruik van apparatuur en de kosten van verbruikte materialen en hulpmiddelen indien deze in
      de administratie te onderscheiden zijn;

      b. de aan derden betaalde kosten.
    url: https://wetten.overheid.nl/BWBR0024796/2018-01-01#Artikel14
  - number: '15'
    text: |-
      Bij ministeriële regeling kan worden afgeweken van de subsidiabele kosten, bedoeld in [artikel 10][ref1] of de
      wijze van berekenen van de subsidiabele kosten, bedoeld in [artikel 11, eerste lid][ref2], en kunnen nadere regels
      worden gesteld met betrekking tot de uitleg van in dit hoofdstuk gebruikte, voor de berekening van de subsidiabele
      kosten relevante begrippen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel11
