  - number: '7'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat bepaalde subsidieregelingen of bijdragen van de Commissie van de
      Europese Gemeenschappen bij de toepassing van [artikel 6][ref1] buiten beschouwing blijven.

      2 Bij ministeriële regeling kunnen met betrekking tot de subsidie aan een financier regels worden gesteld over
      de cumulatie van subsidie bij ondernemingen aan wie als gevolg van de subsidie aan een financier kapitaal wordt
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel6
