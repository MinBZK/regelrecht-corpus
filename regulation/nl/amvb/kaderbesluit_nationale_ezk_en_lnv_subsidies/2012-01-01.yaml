  - number: '3'
    text: |-
      1 Een subsidie wordt verstrekt aan een in Nederland gevestigde natuurlijke persoon, rechtspersoon of vennootschap
      die voor eigen rekening en risico activiteiten uitvoert.

      2 Bij ministeriële regeling kan, in aanvulling op het eerste lid, worden bepaald dat subsidie wordt verstrekt aan
      niet in Nederland gevestigde natuurlijke personen, rechtspersonen of vennootschappen of hiermee gelijk te stellen
      entiteiten.

      3 In aanvulling op het eerste lid kan een subsidie aan een financier ook worden verstrekt aan een niet in Nederland
      gevestigde financier.

      4 Geen subsidie wordt verstrekt aan een provincie, gemeente of openbaar lichaam als bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1], tenzij bij ministeriële regeling is bepaald dat daaraan wel subsidie
      wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over:

      a. de activiteiten waarvoor subsidie wordt verleend;

      b. de aanvragers;

      c. een samenwerkingsverband en de penvoerder van het samenwerkingsverband;

      d. de vorm van de subsidie;

      e. het verstrekken van vouchers en de aanwending van vouchers;

      f. degenen met wie een financier een overeenkomst sluit;

      g. verplichtingen van Onze Minister in verband met de subsidie;

      h. onderwerpen die, in afwijking van of in aanvulling op de regels van dit besluit, nadere regeling behoeven op
      basis van een Europees steunkader;

      i. de wijze van uitvoering van de activiteiten waarvoor subsidie wordt verleend met het oog op de economische,
      ecologische of sociale dimensie van duurzaamheid.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel4
  - number: '5'
    text: |-
      1 Bij ministeriële regeling wordt de wijze van berekenen van de subsidie of de hoogte van de subsidie bepaald.

      2 Bij ministeriële regeling kan een maximum subsidiebedrag worden bepaald.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel5
  - number: '6'
    text: |-
      1 Indien reeds door een bestuursorgaan of de Commissie van de Europese Gemeenschappen subsidie, met uitzondering
      van subsidie aan een financier, is verstrekt voor de subsidiabele kosten of een deel daarvan, wordt slechts een
      zodanig bedrag aan subsidie verstrekt dat het totale bedrag aan subsidies niet meer bedraagt dan het bedrag dat
      krachtens dit besluit kan worden verstrekt.

      2 Het eerste lid is niet van toepassing voor zover de verstrekte subsidie geldmiddelen betreft die één van Onze
      Ministers onder door hem gestelde voorschriften ter beschikking stelt als bijdrage in de algemene exploitatie- en
      investeringskosten die een onderzoeksorganisatie maakt.

      3 Indien bij ministeriële regeling is aangegeven dat een bijdrage van een gemeente, provincie of openbaar lichaam
      als bedoeld in [artikel 8 van de Wet gemeenschappelijke regelingen][ref1] of een ander bestuursorgaan aangemerkt
      wordt als publieke cofinanciering, kunnen bij ministeriële regeling van het eerste lid afwijkende regels worden
      gesteld.

      4 Indien uit de aan Onze Minister op basis van [artikel 41, tweede lid][ref2], voorgelegde afspraken blijkt dat
      sprake is van staatssteun als gevolg van de overdracht van kennis of andere resultaten uit activiteiten, wordt
      slechts een zodanig bedrag aan subsidie verstrekt dat het totale bedrag aan subsidie niet meer bedraagt dan het
      in de beschikking tot subsidieverlening aangegeven bedrag dat maximaal mag worden verstrekt ingevolge een Europees
      steunkader.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel41
