  - number: '39'
    text: |-
      1 Indien de periode van uitvoering van de activiteiten die voor subsidie in aanmerking komen meer dan twaalf
      maanden in beslag neemt, wordt bij de beschikking tot subsidieverlening de verplichting opgelegd tot indiening van
      één of meer rapportages, maar ten hoogste één rapportage per jaar, waarbij rekening wordt gehouden met de mijlpalen
      van de activiteiten.

      2 Indien subsidie-ontvangers samenwerken in een samenwerkingsverband, dienen zij hun rapportages in via een
      penvoerder.

      3 Indien de subsidie minder bedraagt dan € 25.000 is het eerste lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel39
  - number: '40'
    text: |-
      1 De subsidie-ontvanger draagt zorg voor een verantwoord gebruik van de uit de activiteiten voortvloeiende
      resultaten overeenkomstig de subsidie-aanvraag.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel40
  - number: '41'
    text: |-
      1 Wanneer een geheel of gedeeltelijk van overheidswege gefinancierde onderzoeksorganisatie deel uitmaakt van een
      samenwerkingsverband, sluiten de deelnemers in het samenwerkingsverband een overeenkomst over de wijze waarop wordt
      omgegaan met de overdracht van kennis of andere resultaten uit de activiteiten.

      2 Indien in de overeenkomst is opgenomen dat een onderzoeksorganisatie als bedoeld in het eerste lid kennis of
      andere resultaten uit de activiteiten overdraagt aan een ondernemer die deelneemt in het samenwerkingsverband, legt
      de penvoerder de afspraken voor aan Onze Minister, tenzij:

      a. de deelnemende ondernemingen de volledige kosten dragen van de activiteiten van deze onderzoeksorganisatie,

      b. de resultaten waaraan geen intellectuele eigendomsrechten kunnen worden ontleend, ruim kunnen worden verspreid
      en eventuele intellectuele eigendomsrechten op de resultaten die uit de activiteiten van de onderzoeksorganisatie
      voortvloeien, volledig aan deze onderzoeksorganisatie worden toegekend of,

      c. deze onderzoeksorganisatie van de deelnemende ondernemingen een vergoeding ontvangt die overeenstemt met de
      marktprijs voor de intellectuele eigendomsrechten die voortvloeien uit de door de onderzoeksorganisatie in het
      kader van de activiteiten en die worden overgedragen aan de deelnemende ondernemingen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel41
  - number: '42'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat een subsidie wordt verstrekt met de verplichting dat de
      subsidie-ontvanger de verstrekte subsidie volgens een in de beschikking tot subsidieverlening vastgelegd schema
      terugbetaalt aan Onze Minister. In dat geval wordt in de ministeriële regeling geregeld wanneer en onder welke
      voorwaarden de subsidie wordt terugbetaald.

      2 Bij ministeriële regeling kan worden bepaald dat de subsidie die wordt terugbetaald, wordt vermeerderd met:

      a. rente, te rekenen vanaf het moment van betaling, of

      b. een opslag.

      3 De subsidie-ontvanger kan Onze Minister tot het tijdstip waarop een aanvraag tot subsidievaststelling is
      ingediend, verzoeken om ontheffing te verlenen van de verplichting de verstrekte subsidie, inclusief eventuele
      rente of opslag, terug te betalen.

      4 De ontheffing, bedoeld in het derde lid, kan worden verleend indien eerder een ontheffing is verleend voor het
      vertragen, essentieel wijzigen of stopzetten van de activiteiten in verband met onoverkomelijke problemen of het
      verloren gaan van het marktperspectief.

      5 De subsidie-ontvanger kan Onze Minister nadat een aanvraag tot subsidievaststelling is ingediend, verzoeken om
      ontheffing te verlenen van de verplichting tot terugbetaling van de subsidie, inclusief eventuele rente of opslag,
      of ontheffing te verlenen van de verplichting subsidie, inclusief eventuele rente of opslag, terug te betalen
      volgens het bij de beschikking tot subsidieverlening vastgelegde schema.

      6 De ontheffing, bedoeld in het vijfde lid, kan worden verleend indien de verplichting tot terugbetaling leidt tot
      zodanige financiële problemen voor de subsidie-ontvanger dat het voortbestaan van zijn onderneming in gevaar komt.

      7 Aan de ontheffingen, bedoeld in het derde en vijfde lid, kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel42
  - number: '43'
    text: Onze Minister kan bij de beschikking tot subsidieverlening nadere verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel43
  - number: '44'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat een of meer van de in dit hoofdstuk opgenomen verplichtingen
      niet van toepassing zijn.

      2 Bij ministeriële regeling kunnen andere verplichtingen dan de in dit hoofdstuk opgenomen verplichtingen worden
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel44
