  - number: '49'
    text: |-
      De in dit hoofdstuk opgenomen bepalingen gelden voor een ontvanger van een subsidie, niet zijnde een subsidie aan
      een financier.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel49
  - number: '50'
    text: |-
      1 Tenzij de beschikking tot subsidieverlening tevens de subsidievaststelling inhoudt, dient de subsidie-ontvanger
      zijn aanvraag om subsidievaststelling in uiterlijk dertien weken na het tijdstip waarop de activiteiten moeten
      zijn voltooid.

      2 De aanvraag wordt ingediend met gebruikmaking van een formulier, dat bij ministeriële regeling wordt vastgesteld.
      De aanvraag gaat, overeenkomstig in het formulier is vermeld, vergezeld van de in het formulier aangegeven
      bescheiden, waaronder in elk geval:

      a. een eindverslag omtrent de uitvoering en de resultaten van de activiteiten en

      b. indien het subsidiebedrag € 125 000 of meer bedraagt, een accountantsverklaring.

      3 Bij ministeriële regeling kan worden bepaald dat, in afwijking van het tweede lid, onderdeel b, de aanvraag niet
      vergezeld hoeft te gaan van een accountantsverklaring.

      4 In afwijking van het eerste lid kan bij ministeriële regeling worden bepaald dat de subsidie ambtshalve wordt
      vastgesteld. De beschikking tot subsidieverlening vermeldt de datum waarop:

      a. de activiteiten uiterlijk zijn verricht;

      b. de subsidie uiterlijk ambtshalve wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel50
  - number: '51'
    text: |-
      1 Indien subsidie-ontvangers samenwerken in een samenwerkingsverband, dienen zij hun aanvraag tot
      subsidievaststelling in via de penvoerder.

      2 Indien subsidie-ontvangers samenwerken in een samenwerkingsverband, betaalt Onze Minister het subsidiebedrag via
      de penvoerder aan de subsidie-ontvanger. Deze betaling geldt als betaling aan de subsidie-ontvanger.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel51
  - number: '52'
    text: |-
      1 Onze Minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.

      2 Indien een beschikking tot subsidievaststelling niet binnen de in het eerste lid genoemde termijn kan worden
      gegeven, kan deze termijn eenmaal met dertien weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel52
  - number: '53'
    text: |-
      1 Bij ministeriële regeling kunnen voor bij ministeriële regeling aangewezen instellingen of organisaties, van de
      [artikelen 50 tot en met 52][ref1] afwijkende bepalingen over de subsidievaststelling worden opgenomen.

      2 [Artikel 50][ref2] is niet van toepassing op de verstrekking van specifieke uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel50
