  - number: '16'
    text: |-
      Bij ministeriële regeling wordt een subsidieplafond vastgesteld voor het verstrekken van subsidies op in een
      bepaalde periode ontvangen aanvragen op grond van dit besluit. Daarbij kunnen afzonderlijke subsidieplafonds worden
      vastgesteld voor bepaalde categorieën van aanvragers, ondernemingen of activiteiten of voor bepaalde thema’s of
      voor bepaalde vormen van subsidie.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel16
  - number: '17'
    text: |-
      1 Bij ministeriële regeling wordt gekozen voor:

      a. verdeling van het subsidieplafond op volgorde van binnenkomst van de aanvragen,

      b. verdeling van het subsidieplafond op volgorde van rangschikking van de aanvragen,

      c. evenredige verdeling van het subsidieplafond over de ingediende aanvragen of

      d. verdeling van het subsidieplafond door vaststelling van een maximumbedrag per financier.

      2 Indien wordt gekozen voor verdeling op volgorde van binnenkomst, kan bij ministeriële regeling worden bepaald op
      welke wijze wordt omgegaan met meerdere aanvragen van één aanvrager of aanvragers binnen één groep.

      3 Indien de subsidie wordt verdeeld op volgorde van rangschikking, worden bij ministeriële regeling
      rangschikkingscriteria vastgesteld en, indien meerdere rangschikkingscriteria worden vastgesteld, de onderlinge
      weging hiervan.

      4 Indien subsidie wordt verdeeld op volgorde van binnenkomst van de aanvragen, op volgorde van rangschikking van
      de aanvragen, of evenredig wordt verdeeld over de ingediende aanvragen worden bij ministeriële regeling perioden
      vastgesteld waarbinnen aanvragen om subsidie moeten zijn ontvangen.

      5 Het vierde lid is van overeenkomstige toepassing op vooraanmeldingen als bedoeld in [artikel 21][ref1].

      6 Bij ministeriële regeling wordt een datum vastgesteld waarvoor het maximumbedrag per financier als bedoeld in
      [artikel 17, eerste lid, onderdeel d][ref2], wordt aangevraagd en vastgesteld.

      7 Bij ministeriële regeling kunnen criteria worden bepaald voor de vaststelling van een maximumbedrag per financier
      en kunnen regels worden gesteld over wijziging van het maximumbedrag per financier.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel17
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel17
    references:
