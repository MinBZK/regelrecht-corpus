  - number: '2'
    text: |-
      1 Subsidies die worden verstrekt krachtens een ministeriële regeling op de gebieden, genoemd in
      [artikel 2 van de Kaderwet EZ-subsidies][ref1], worden verstrekt volgens de regels van dit besluit.

      2 Onze Minister kan op aanvraag voor de activiteiten op de gebieden, genoemd in het eerste lid, subsidie
      verstrekken volgens bij ministeriële regeling bepaalde regels.

      3 Onze Minister stelt regels als bedoeld in het tweede lid uitsluitend over activiteiten die tevens een positieve
      bijdrage leveren aan de economische, ecologische of sociale dimensie van duurzaamheid.

      4 Onder dit besluit vallen niet per boekjaar verstrekte subsidies als bedoeld in
      [artikel 4:58 van de Algemene wet bestuursrecht][ref2].

      5 Onder dit besluit vallen niet:

      a. subsidies die worden verstrekt op basis van of in nauwe samenhang met een bindend besluit van de Raad van de
      Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen
      betreffende ondersteuning van activiteiten op de in het eerste lid genoemde gebieden, en

      b. subsidies die worden verstrekt met het oog op co-financiering van een door de Raad van de Europese Unie of de
      Commissie van de Europese Gemeenschappen goedgekeurd programma.

      6 Onder dit besluit vallen niet specifieke uitkeringen die verstrekt worden op grond van een regeling die
      uitsluitend voorziet in het verstrekken van specifieke uitkeringen.

      7 Dit besluit is niet van toepassing op subsidies krachtens het
      [Besluit stimulering duurzame energieproductie][ref3].


