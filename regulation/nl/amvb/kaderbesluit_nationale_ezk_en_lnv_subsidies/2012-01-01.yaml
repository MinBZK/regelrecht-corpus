        artikel: 4:5
  - number: '28'
    text: |-
      Indien bij ministeriële regeling is gekozen voor verdeling van het subsidieplafond op volgorde van rangschikking,
      verdeelt Onze Minister het beschikbare bedrag in de volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel28
  - number: '29'
    text: |-
      Indien de subsidie wordt verstrekt aan deelnemers in een samenwerkingsverband, verzendt Onze Minister de
      beschikkingen tot subsidieverlening aan de penvoerder.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel29
  - number: '30'
    text: |-
      1 De beschikking tot verlenen van een subsidie aan een financier wordt verleend onder de opschortende voorwaarde
      dat binnen acht weken na de beschikking een overeenkomst tot stand is gekomen tussen de Staat en de financier.

      2 Het eerste lid is niet van toepassing indien tussen de Staat en de financier reeds een overeenkomst is gesloten.

      3 Bij ministeriële regeling kan een van het eerste lid afwijkende termijn worden vastgesteld waarbinnen een
      overeenkomst tot stand moet zijn gekomen.

      4 Bij ministeriële regeling kunnen, in aanvulling op de [artikelen 31 tot en met 33][ref1], nadere regels worden
      gesteld over de inhoud van de overeenkomst.

      5 Bij ministeriële regeling wordt een model voor de overeenkomst vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel31
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '31'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: '31'
    text: |-
      De overeenkomst, bedoeld in [artikel 30][ref1], bevat in ieder geval:

      a. de bepaling dat kapitaal of zekerheid niet wordt verstrekt ten behoeve van een onderneming waarvan blijkens de
      geringe rentabiliteit de continuïteit voor de korte of middellange termijn in het geding is;

      b. de bepaling dat uitsluitend kapitaal of zekerheid wordt verstrekt aan ondernemingen die in Nederland zijn
      gevestigd en daar een substantieel deel van hun activiteiten uitvoeren;

      c. de verplichting van de financier er zorg voor te dragen dat de relaties tussen hem en de bij zijn onderneming
      betrokkenen enerzijds, en de ondernemers aan wie kapitaal wordt verschaft anderzijds, transparant zijn;

      d. de verplichting van de financier tot verstrekking van informatie aan Onze Minister;

      e. de verplichting van de financier onverwijld mededeling te doen aan Onze Minister van de indiening bij de
      rechtbank van een verzoek tot verlening van surseance van betaling aan hem, een verzoek tot faillietverklaring
      van hem of een verzoek om ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing te
      verklaren;

      f. de wijze van vaststelling van de subsidie;

      g. aanvragen tot betaling;

      h. de wijze waarop Onze Minister gerechtigd is tot verhaal na uitbetaling van de financier.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel30
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '30'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: '32'
    text: |-
      1 Indien de overeenkomst, bedoeld in [artikel 30][ref1], een overeenkomst van borgstelling of garantstelling is,
      bevat deze overeenkomst in aanvulling op [artikel 31][ref2] in ieder geval:

      a. de vergoeding of provisie;

      b. het maximum bedrag per borgstelling of garantstelling;

      c. de eisen waaraan de kredietovereenkomst, waarvan de te sluiten overeenkomst van borgstelling of garantstelling
      afhankelijk is, moet voldoen;

      d. de wijze waarop de omvang van de borgstelling of garantstelling wordt bepaald;

      e. de voorwaarden waaronder de borgstelling of garantstelling kan worden ingeroepen;

      f. een bepaling inzake de duur en de beëindiging van de overeenkomst tot borgstelling of garantstelling;

      g. een bepaling met betrekking tot betalingen van de borgstelling of garantstelling door Onze Minister aan de
      financier;

      h. de terugvordering van kredieten en de uitwinning van zekerheden.

      2 In de overeenkomst kan worden bepaald dat de financier kredietovereenkomsten kan sluiten voor zover het totaal
      van de verstrekte kredieten niet hoger is dan het maximale bedrag van de borgstelling.

      3 Bij ministeriële regeling wordt de hoogte van de vergoeding of de wijze van berekenen van de provisie
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel31
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel32
