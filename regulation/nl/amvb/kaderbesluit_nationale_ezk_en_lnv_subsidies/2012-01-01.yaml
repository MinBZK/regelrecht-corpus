  - number: '22'
    text: |-
      Onze Minister beslist afwijzend op een aanvraag om subsidie indien de aanvraag niet voldoet aan de bij of krachtens
      dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel22
  - number: '23'
    text: |-
      Onze Minister beslist afwijzend op een aanvraag om subsidie, niet zijnde een subsidie aan een financier, voor
      zover:

      a. door de toepassing van een de-minimis verordening, een bedrag aan de-minimis steun zou worden verstrekt dat
      hoger is dan geoorloofd op grond van deze verordening;

      b. onvoldoende vertrouwen bestaat dat de betrokkenen de activiteiten kunnen financieren;

      c. het onaannemelijk wordt geacht dat de activiteiten binnen een bij ministeriële regeling gestelde termijn kunnen
      worden voltooid;

      d. aannemelijk is dat de activiteiten ook zonder subsidie zonder belangrijke vertraging zouden worden uitgevoerd;

      e. onvoldoende vertrouwen bestaat in de technische haalbaarheid van de activiteiten;

      f. onvoldoende vertrouwen bestaat in de economische haalbaarheid van de activiteiten;

      g. de activiteiten onvoldoende bijdrage aan de doelstellingen van de subsidie leveren;

      h. onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om de activiteiten naar behoren uit
      te voeren;

      i. het betreft een subsidie-ontvanger die een ondernemer is tegen wie een bevel tot terugvordering uitstaat als
      bedoeld in artikel 1, zesde lid, onderdeel a, van de algemene groepsvrijstellingsverordening;

      j. er een naar het oordeel van Onze Minister onaanvaardbaar risico bestaat dat de uitvoering van een voorgenomen
      activiteit een onevenredige inbreuk zal maken op de economische, ecologische of sociale dimensie van duurzaamheid.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel23
  - number: '24'
    text: |-
      Onze Minister beslist afwijzend op een aanvraag om subsidie aan een financier indien:

      a. de deskundigheid van degenen die zijn belast met het verstrekken, beheren en vervreemden van kapitaal en
      zekerheden onvoldoende gewaarborgd is;

      b. de betrouwbaarheid van degenen die zijn belast met het verstrekken, beheren en vervreemden van kapitaal en
      zekerheden, en met de bepaling van en het toezicht op het beleid ter zake onvoldoende gewaarborgd is;

      c. de integriteit van de financier onvoldoende gewaarborgd is;

      d. de financiële draagkracht en stabiliteit van de financier onvoldoende gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel24
  - number: '25'
    text: |-
      Bij ministeriële regeling kunnen andere afwijzingsgronden dan de afwijzingsgronden, bedoeld in de
      [artikelen 22 tot en met 24][ref1], worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
