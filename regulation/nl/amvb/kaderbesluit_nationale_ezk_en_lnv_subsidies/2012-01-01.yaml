  - number: '8'
    text: |-
      Indien bij ministeriële regeling is bepaald dat toepassing is gegeven aan een de-minimis verordening of de algemene
      groepsvrijstellingsverordening, wordt het bedrag van de subsidie verlaagd voor zover dit nodig is op basis van
      deze verordening.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel8
  - number: '10'
    text: |-
      1 Voor subsidie komen de redelijk gemaakte kosten in aanmerking die direct verbonden zijn met de uitvoering van
      een activiteit.

      2 Vóór indiening van de aanvraag door de subsidieontvanger gemaakte kosten komen niet voor subsidie in aanmerking.

      3 De eventuele restwaarde van specifiek voor de subsidiabele activiteiten aangeschafte apparatuur maakt geen deel
      uit van de subsidiabele kosten.

      4 De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidieontvanger die de kosten
      heeft gemaakt, omzetbelasting niet in aftrek kan brengen.

      5 Winstopslagen bij transacties binnen een groep worden alleen in aanmerking genomen voor zover het gebruikelijk is
      die winstopslagen ook bij soortgelijke transacties buiten de groep in rekening te brengen.

      6 Bij subsidie aan een ondernemer waar een Europees steunkader op van toepassing is, komen alleen de kosten voor
      vergoeding in aanmerking die voldoen aan de eisen van het desbetreffende steunkader.

      7 Afschrijvingskosten van apparatuur en gebouwen worden lineair berekend als fractie van de aanschafprijs op basis
      van bedrijfseconomische grondslagen en normen, met een minimale afschrijvingstermijn van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0024796/2012-01-01#Artikel10
  - number: '11'
    text: |-
      1 Tenzij [artikel 14a][ref1] van toepassing is, kiest de aanvrager voor de berekening van de subsidiabele kosten
      uit:

      a. de integrale kostensystematiek, opgenomen in [artikel 12][ref2],

      b. de loonkosten plus vaste-opslag-systematiek, opgenomen in [artikel 13][ref3], of

      c. de vaste-uurtarief-systematiek, opgenomen in [artikel 14][ref4].

      2 De subsidiabele kosten worden berekend op basis van een voor de subsidie-ontvanger gebruikelijke en
      controleerbare methode, die is gebaseerd op bedrijfeconomische grondslagen en normen die in het maatschappelijk
      verkeer als aanvaardbaar worden beschouwd en die de subsidie-ontvanger stelselmatig toepast.

      3 De kosten van aangeschafte apparatuur en verbruikte materialen en hulpmiddelen worden berekend op basis van
      historische aanschafprijzen.

      4 Indien het aantal direct productieve uren niet blijkt uit de methode, bedoeld in het tweede lid, wordt het aantal
      direct productieve uren voor een fulltime dienstverband gesteld op 1650 uur.


