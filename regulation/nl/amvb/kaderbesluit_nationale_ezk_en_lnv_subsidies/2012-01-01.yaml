      c. het [Besluit innovatiesubsidie samenwerkingsprojecten][ref3];

      d. het [Besluit subsidies investeringen kennisinfrastructuur][ref4];

      met dien verstande dat deze besluiten van toepassing blijven op de aanvragen om subsidie die voor de
      inwerkingtreding van dit besluit zijn ingediend en op subsidies die voor de inwerkingtreding van dit besluit zijn
      verstrekt.

      2 De overeenkomsten, gesloten op basis van [artikel 10 van het Besluit borgstelling MKB-kredieten 1997][ref5],
      worden geacht in stand te blijven tot een nieuwe overeenkomst is gesloten of, indien dit eerder is, tot twee jaar
      na de datum van inwerkingtreding van dit besluit, behoudens beëindiging van een overeenkomst.


