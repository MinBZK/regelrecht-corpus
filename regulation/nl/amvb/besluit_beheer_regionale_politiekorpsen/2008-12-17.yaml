$id: besluit_beheer_regionale_politiekorpsen
regulatory_layer: AMVB
publication_date: '2012-07-16'
valid_from: '2008-12-17'
bwb_id: BWBR0006560
url: https://wetten.overheid.nl/BWBR0006560/2008-12-17
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Binnenlandse Zaken en van Justitie, van 2 december 1993, directoraat-
    generaal voor Openbare Orde en Veiligheid, directie Politie, nummer EA93/U3429, en Stafafdeling Wetgeving
    Publiekrecht, nummer 411040/93/6;

    Gelet op de artikelen 9, vierde lid, 45, eerste lid, en 47, eerste lid, van de Politiewet 1993;

    Gezien het advies van de Registratiekamer van 26 oktober 1993, kenmerk 93.A.10;

    De Raad van State gehoord (advies van 15 februari 1994, nummer WO4.93.0813);

    Gezien het nader rapport van Onze Ministers van Binnenlandse Zaken en van Justitie, van 24 maart 1994, directoraat-
    generaal voor Openbare Orde en Veiligheid, directie Politie, nummer EA94/U1029, en Stafafdeling Wetgeving
    Publiekrecht, nummer 431498/94/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.'
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel1
  - number: 1.b
    text: |-
      korpsbeheerder: de burgemeester, bedoeld in [artikel 23, eerste lid, van de Politiewet 1993][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel23
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '23'
  - number: 1.c
    text: |-
      ingeslotene: de persoon die rechtens van zijn vrijheid is beroofd, alsmede de persoon die ten behoeve van de
      hulpverlening aan hem op een bureau van een regionaal politiekorps is ondergebracht;
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel1
  - number: 1.d
    text: |-
      politiecellencomplex: een in een gebouw te onderscheiden ruimte waarin een of meer gangen met daaraan grenzend een
      of meer ruimten liggen die worden gebruikt voor het insluiten van personen.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel1
  - number: '4.1'
    text: |-
      Het regionale politiekorps draagt ten behoeve van de opsporing van strafbare feiten zorg voor het inrichten van
      de recherchefunctie.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel4
  - number: '4.2'
    text: |-
      Een lid van de leiding van het regionale politiekorps, bedoeld in
      [artikel 25, derde lid, van de Politiewet 1993][ref1], is in het bijzonder verantwoordelijk voor de
      recherchefunctie van het regionale politiekorps.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel25
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '25'
  - number: '4.3'
    text: |-
      Het regionale politiekorps beschikt, zelfstandig of samen met andere politiekorpsen, ten behoeve van de uitoefening
      van de recherchefunctie over voorzieningen op het gebied van:
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel4
  - number: 4.3.a
    text: tactische recherche,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel4
  - number: 4.3.b
    text: technische recherche,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel4
  - number: 4.3.c
    text: financiële recherche,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel4
  - number: 4.3.d
    text: digitale recherche, en
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel4
  - number: 4.3.e
    text: informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister en Onze Minister van Justitie kunnen voorzieningen op andere gebieden dan die, genoemd in het derde
      lid, aanwijzen waarover het regionale politiekorps beschikt ten behoeve van de uitoefening van de recherchefunctie.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel4
  - number: '4.5'
    text: |-
      Onze Minister en Onze Minister van Justitie kunnen regels geven over de taken en de uitvoering van de werkzaamheden
      ten behoeve van de uitoefening van de recherchefunctie.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel4
  - number: '4.6'
    text: |-
      Met inachtneming van de regels, bedoeld in het vijfde lid, kan Onze Minister regels geven over het beheer van de
      voorzieningen bedoeld in het derde en vierde lid. Indien deze regels voorschriften bevatten die aan de inrichting
      van de voorzieningen worden gesteld, worden zij gegeven door Onze Minister in overeenstemming met Onze Minister
      van Justitie.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel4
  - number: '5.1'
    text: |-
      Het regionale politiekorps beschikt, zelfstandig of samen met andere politiekorpsen, over een eenheid die is belast
      met het, ten behoeve van de recherchefunctie, verwerken van gegevens die noodzakelijk zijn voor de opsporing van
      misdrijven als bedoeld in [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: '5.2'
    text: |-
      Het regionale politiekorps beschikt, zelfstandig of samen met andere politiekorpsen, over een eenheid
      die is belast met de uitvoering van een bevel tot observatie als bedoeld in de [artikelen 126g][ref1] en
      [126o van het Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126g
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126o
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126g
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126o
  - number: '5.3'
    text: |-
      Het regionale politiekorps beschikt, zelfstandig of samen met andere politiekorpsen, over een eenheid die is
      belast met de uitvoering van een bevel tot infiltratie als bedoeld in [artikel 126h, eerste lid][ref1], of
      [artikel 126p, eerste lid, van het Wetboek van Strafvordering][ref2] en met de begeleiding van personen die op
      grond van [artikel 126w van het Wetboek van Strafvordering][ref3] bijstand verlenen aan de opsporing. Daarnaast kan
      deze eenheid worden belast met de uitvoering van een bevel tot pseudo-koop of pseudo-dienstverlening als bedoeld
      in [artikel 126i, eerste lid][ref4], of [artikel 126ij, eerste lid, van het Wetboek van Strafvordering][ref5]
      en een bevel tot stelselmatige inwinning van informatie als bedoeld in [artikel 126j, eerste lid][ref6], of
      [artikel 126qa, eerste lid, van het Wetboek van Strafvordering][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126h
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126p
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126w
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel126i
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel126ij
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel126j
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel126qa
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126h
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126p
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126w
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 126i
      - id: ref5
        bwb_id: BWBR0001903
        artikel: 126ij
      - id: ref6
        bwb_id: BWBR0001903
        artikel: 126j
      - id: ref7
        bwb_id: BWBR0001903
        artikel: 126qa
  - number: '5.4'
    text: |-
      Onze Minister en Onze Minister van Justitie kunnen regels geven over de taken en de uitvoering van werkzaamheden
      van de eenheden, bedoeld in het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel5
  - number: '5.5'
    text: |-
      Met inachtneming van de regels, bedoeld in het vierde lid, kan Onze Minister regels geven over het beheer van
      de eenheden, bedoeld in het eerste, tweede en derde lid. Indien deze regels voorschriften bevatten die aan de
      organisatie van de eenheden worden gesteld, worden zij gegeven door Onze Minister in overeenstemming met Onze
      Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel5
  - number: 5a
    text: |-
      De regionale politiekorpsen werken onderling en met het Korps landelijke politiediensten samen op het terrein van
      de voorzieningen en eenheden die, overeenkomstig [de artikelen 4][ref1] en [5][ref2], zijn ingericht ten behoeve
      van de recherchefunctie.


      [ref1]: https://wetten.overheid.nl/BWBR0006560#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006560#Artikel5
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006560
        artikel: '4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006560
        artikel: '5'
        hoofdstuk: '3'
  - number: 5b
    text: |-
      Het regionale politiekorps houdt, zelfstandig of samen met andere politiekorpsen, ten behoeve
      van de recherchefunctie een gegevensbestand voor de verwerking van politiegegevens, bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1]. Het bestand wordt aangelegd en gehouden
      bij de eenheid, bedoeld in [artikel 5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006560#Artikel5
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0006560
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.1'
    text: |-
      Het regionale politiekorps beschikt over een organisatie van mobiele eenheden ten behoeve van de volgende
      werkzaamheden:
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel6
  - number: 6.1.a
    text: |-
      het optreden ter handhaving van de openbare orde en hulpverlening in het bijzonder bij grootschalige manifestaties
      en evenementen,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel6
  - number: 6.1.b
    text: het uitvoeren van evacuaties,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel6
  - number: 6.1.c
    text: het bewaken en beveiligen van objecten,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel6
  - number: 6.1.d
    text: het optreden bij crises en rampen,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel6
  - number: 6.1.e
    text: het uitvoeren van zoekacties en
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel6
  - number: 6.1.f
    text: het aanhouden van ordeverstoorders.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister geeft nadere regels over de organisatie, de sterkte ten behoeve van de bijstand en de paraatheid van
      de mobiele eenheden. Indien deze regels voorschriften bevatten die met het oog op de werkzaamheden, bedoeld in het
      eerste lid, onder f, worden gesteld, worden zij gegeven door Onze Minister in overeenstemming met Onze Minister
      van Justitie.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel6
  - number: '7.1'
    text: |-
      Het regionale politiekorps beschikt, zelfstandig of samen met een of meer andere regionale politiekorpsen, over een
      staf die ten behoeve van het bevoegd gezag zorgdraagt voor de coördinatie van grootschalig politie-optreden.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister kan regels geven over de organisatie van de in het eerste lid bedoelde staf. Indien deze regels
      voorschriften bevatten die ten behoeve van de strafrechtelijke handhaving van de rechtsorde dan wel de vervulling
      van taken ten dienste van de justitie worden gesteld, worden zij gegeven door Onze Minister in overeenstemming met
      Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel7
  - number: '8.1'
    text: |-
      Het regionale politiekorps beschikt, zelfstandig of samen met een of meer andere regionale politiekorpsen, over
      een eenheid die uitsluitend tot taak heeft, indien redelijkerwijs mag worden aangenomen dat levensbedreigende
      omstandigheden tegen de politie of anderen dreigen, de volgende werkzaamheden uit te voeren:
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel8
  - number: 8.1.a
    text: het verrichten van planmatige aanhoudingen,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel8
  - number: 8.1.b
    text: het bewaken en beveiligen van politie-infiltranten,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel8
  - number: 8.1.c
    text: het assisteren bij het bewaken en beveiligen van het transport van getuigen, verdachten of gedetineerden,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel8
  - number: 8.1.d
    text: het assisteren bij het bewaken en beveiligen van objecten en
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel8
  - number: 8.1.e
    text: andere werkzaamheden waarvoor toestemming is verkregen van Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister geeft regels over het beheer van de eenheid, bedoeld in het eerste lid. Indien deze regels
      voorschriften bevatten die aan de organisatie van de eenheid moeten worden gesteld, worden zij gegeven door Onze
      Minister in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel8
  - number: '10.1'
    text: |-
      De korpsbeheerder houdt binnen het regionale politiekorps ambtenaren van politie ter beschikking ten behoeve van
      het rampenidentificatieteam politie.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel10
  - number: '10.2'
    text: 'Onder het rampenidentificatieteam politie wordt verstaan een eenheid die wordt ingezet voor:'
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel10
  - number: 10.2.a
    text: |-
      het verlenen van assistentie aan een politiekorps bij berging en identificatie van slachtoffers bij rampen, of in
      die gevallen waarin identificatie van slachtoffers technisch bijzondere moeilijkheden oplevert;
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel10
  - number: 10.2.b
    text: |-
      het verlenen van assistentie op verzoek van Onze Minister van Buitenlandse Zaken bij identificatie van slachtoffers
      van calamiteiten buiten Nederland waarbij Nederlandse belangen in het geding zijn;
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel10
  - number: 10.2.c
    text: |-
      het verlenen van assistentie op verzoek van Onze Minister van Defensie bij identificatie van Nederlandse militairen
      buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel10
  - number: '10.3'
    text: |-
      De ambtenaren van politie, bedoeld in het eerste lid, worden door de korpsbeheerder aangewezen op aanbeveling
      van de korpschef van het Korps landelijke politiediensten, waarbij wordt aangegeven welke functie de betrokken
      ambtenaar in het rampenidentificatieteam politie zal vervullen. Zij zijn direct inzetbaar.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel10
  - number: '10.4'
    text: |-
      Onze Minister geeft regels over de organisatie, de beschikbaarheid en de paraatheid van de eenheid, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister en Onze Minister van Justitie kunnen bepalen dat een regionaal politiekorps, zelfstandig of samen
      met een of meer andere regionale politiekorpsen, beschikt over een eenheid die is belast met de uitvoering van een
      bijzonder onderdeel van de politietaak.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel11
  - number: '11.2'
    text: |-
      Onze Minister en Onze Minister van Justitie kunnen regels geven over de taken en de uitvoering van werkzaamheden
      van de eenheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel11
  - number: '11.3'
    text: |-
      Met inachtneming van de regels, bedoeld in het tweede lid, kan Onze Minister regels geven over het beheer
      van de eenheid, bedoeld in het eerste lid. Indien deze regels voorschriften bevatten die ten behoeve van de
      strafrechtelijke handhaving van de rechtsorde dan wel de vervulling van taken ten dienste van de justitie, aan
      de organisatie van een eenheid worden gesteld, worden zij gegeven door Onze Minister in overeenstemming met Onze
      Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel11
  - number: '11.4'
    text: |-
      De korpsbeheerder draagt er zorg voor dat een eenheid als bedoeld in het eerste lid, beschikt over voldoende kennis
      en deskundigheid ten aanzien van het desbetreffende onderdeel van de politietaak.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel11
  - number: 11a
    text: |-
      Onze Minister kan eenheden aanwijzen, bestaande uit ambtenaren van politie van een of meer regionale
      politiekorpsen, die zijn belast met het waken voor de veiligheid van daartoe door het bevoegd gezag aangewezen
      personen.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel11a
  - number: '12'
    text: |-
      De korpsbeheerder stelt de ambtenaar van politie in de gelegenheid de noodzakelijke training en opleiding te
      volgen.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel12
  - number: '13'
    text: Onze Minister geeft regels met betrekking tot het politielegitimatiebewijs en het gebruik van de politiehuisstijl.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel13
  - number: '15.1'
    text: 'De korpsbeheerder treft voorzieningen opdat de ingeslotene in ieder geval beschikt over:'
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: 15.1.a
    text: slaapgelegenheid,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: 15.1.b
    text: eten en drinken in overeenstemming met medische en levensbeschouwelijke of godsdienstige eisen,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: 15.1.c
    text: sanitair,
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: 15.1.d
    text: de noodzakelijke medische zorg en
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: 15.1.e
    text: informatie over de gang van zaken in het politiecellencomplex.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: '15.2'
    text: |-
      Tenzij het politiecellencomplex geen luchtplaats heeft, draagt de korpsbeheerder er zorg voor dat de ingeslotene
      tweemaal daags wordt gelucht.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: '15.3'
    text: |-
      In verband met het eerste lid, onder *d*, treft de korpsbeheerder een regeling met artsen in de regio ten einde van
      hulp verzekerd te zijn voor de medische zorg van ingeslotenen.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: '15.4'
    text: |-
      Met inachtneming van het bij of krachtens de wet bepaalde treft de korpsbeheerder een regeling met betrekking tot
      het roken, de ontspanning, het telefoneren en het ontvangen van bezoek van de ingeslotene.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: '15.5'
    text: Onze Minister geeft regels over de inrichting van een politiecellencomplex.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: '15.6'
    text: Onze Minister en Onze Minister van Justitie wijzen de gegevens aan die worden geregistreerd over ingeslotenen.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: '15.7'
    text: |-
      In geval van overlijden of poging tot zelfdoding van een ingeslotene draagt de korpsbeheerder er zorg voor dat
      het openbaar ministerie hiervan onverwijld in kennis wordt gesteld en dat aan Onze Minister en Onze Minister van
      Justitie hiervan een schriftelijk rapport wordt gezonden. Onze Minister stelt voor het rapport een model vast.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel15
  - number: '16.1'
    text: |-
      De korpsbeheerder wijst een ambtenaar van politie aan die wordt belast met de leiding van het politiecellencomplex
      en het toezicht op de ingeslotenen.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16
  - number: '16.2'
    text: |-
      Met inachtneming van de [artikelen 26][ref1], [27][ref2] en [32][ref3] tot en met
      __REF003___________________________________________________________________________________________________________
      __ stelt de korpsbeheerder een instructie vast voor het personeel, niet zijnde ambtenaren van politie, dat is
      belast met de zorg voor ingeslotenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0006589#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0006589#Artikel36
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0006589
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0006589
        artikel: '32'
      - id: ref4
        bwb_id: BWBR0006589
        artikel: '36'
  - number: '16.3'
    text: |-
      Onze Minister kan regels geven over de eisen van bekwaamheid waaraan het personeel, bedoeld in het tweede lid,
      moet voldoen.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16
  - number: 16a.1
    text: |-
      De korpsbeheerder stelt ten behoeve van de politiecellencomplexen in zijn regio een commissie van toezicht in,
      bestaande uit ten minste drie en ten hoogste twaalf, onafhankelijke leden.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16a
  - number: 16a.2
    text: 'De commissie heeft in ieder geval tot taak:'
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16a
  - number: 16a.2.a
    text: |-
      toezicht te houden op de huisvesting, veiligheid, verzorging en bejegening van ingeslotenen in de
      politiecellencomplexen;
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16a
  - number: 16a.2.b
    text: jaarlijks rapport uit te brengen aan de korpsbeheerder over haar werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16a
  - number: 16a.2.c
    text: |-
      gevraagd en ongevraagd aan de korpsbeheerder advies uit te brengen en inlichtingen te geven omtrent aangelegenheden
      betreffende de politiecellencomplexen.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16a
  - number: 16a.3
    text: |-
      De commissie van toezicht kan door de korpsbeheerder tevens worden belast met de behandeling van en de advisering
      over klachten als bedoeld in [artikel 61 van de Politiewet 1993][ref1], voor zover die klachten betrekking hebben
      op aangelegenheden betreffende de politiecellencomplexen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel61
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '61'
  - number: 16a.4
    text: |-
      De korpsbeheerder stelt regels vast over de voor een adequate taakvervulling benodigde bevoegdheden, de
      samenstelling en de werkwijze van de commissie van toezicht, de benoeming en het ontslag van haar leden.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16a
  - number: 16a.5
    text: |-
      Bij de samenstelling van de commissie wordt rekening gehouden met de benodigde maatschappelijke en bestuurlijke
      deskundigheid en ervaring van de leden.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16a
  - number: 16a.6
    text: |-
      Jaarlijks zendt de korpsbeheerder een verslag van de werkzaamheden en bevindingen van de commissie van toezicht aan
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel16a
  - number: '17.1'
    text: |-
      De korpsbeheerder verstrekt Onze Minister periodiek gegevens over de omvang en samenstelling, alsmede over de
      werkdruk en de taakuitvoering van het regionale politiekorps.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister kan regels stellen over de inrichting van de gegevens, bedoeld in het eerste lid, alsmede over
      de wijze waarop en de frequentie waarmee deze gegevens aan hem worden verstrekt. Deze gegevens worden door Onze
      Minister aan Onze Minister van Justitie ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel17
  - number: '17.3'
    text: |-
      Onze Minister doet jaarlijks verslag van de verkregen gegevens aan Onze Minister van Justitie en aan de
      korpsbeheerders.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel17
  - number: '17.4'
    text: |-
      De korpsbeheerder verstrekt op verzoek van Onze Minister de gegevens die Onze Minister of Onze Minister van
      Justitie overigens noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel17
  - number: '18.1'
    text: |-
      De korpsbeheerder draagt overeenkomstig door het regionale college vast te stellen regels zorg voor de
      archiefbescheiden van de regio, voor zover deze niet zijn overgebracht naar een archiefbewaarplaats als bedoeld in
      [artikel 31 van de Archiefwet 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel31
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '31'
  - number: '18.2'
    text: |-
      Het regionale college zendt de regels, bedoeld in het eerste lid, aan gedeputeerde staten van de provincie waarin
      de gemeente is gelegen waarvan de burgemeester korpsbeheerder is.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel18
  - number: '18.3'
    text: |-
      De kosten van de bewaring van archiefbescheiden van de regio in een archiefbewaarplaats en de kosten van het
      toezicht op het beheer van de archiefbescheiden van de regio, voor zover deze niet zijn overgebracht naar de
      archiefbewaarplaats, komen ten laste van de regio.
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel18
  - number: '19'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop de [Politiewet 1993][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: '20'
    text: 'Dit besluit wordt aangehaald als: Besluit beheer regionale politiekorpsen.'
    url: https://wetten.overheid.nl/BWBR0006560/2008-12-17#Artikel20
