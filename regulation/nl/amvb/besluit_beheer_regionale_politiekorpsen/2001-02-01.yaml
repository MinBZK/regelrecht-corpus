      - id: ref1
        bwb_id: BWBR0004798
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006560
        artikel: '5'
        hoofdstuk: '3'
  - number: '6'
    text: >-
      1 Het regionale politiekorps beschikt over een organisatie van mobiele eenheden ten behoeve van de volgende
      werkzaamheden:


      a. het optreden ter handhaving van de openbare orde en hulpverlening in het bijzonder bij grootschalige
      manifestaties en evenementen,


      b. het uitvoeren van evacuaties,


      c. het bewaken en beveiligen van objecten,


      d. het optreden bij crises en rampen,


      e. het uitvoeren van zoekacties en


      f. het aanhouden van ordeverstoorders.


      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties geeft nadere regels over de organisatie, de sterkte
      ten behoeve van de bijstand en de paraatheid van de mobiele eenheden.


      3 De in het tweede lid aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties toegekende bevoegdheid wordt
      door Onze Ministers uitgeoefend indien de regels eisen bevatten die ten behoeve van de strafrechtelijke handhaving
      van de rechtsorde dan wel de vervulling van taken ten dienste van de justitie moeten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel6
  - number: '7'
    text: >-
      1 Het regionale politiekorps beschikt, zelfstandig of samen met een of meer andere regionale politiekorpsen, over
      een staf die ten behoeve van het bevoegd gezag zorgdraagt voor de coördinatie van grootschalig politie-optreden.


      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels geven over de organisatie van de in het
      eerste lid bedoelde staf. Indien de strafrechtelijke handhaving van de rechtsorde dan wel de vervulling van taken
      ten dienste van de justitie in het geding zijn, wordt deze bevoegdheid door Onze Ministers uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel7
  - number: '8'
    text: >-
      1 Het regionale politiekorps beschikt, zelfstandig of samen met een of meer andere regionale politiekorpsen,
      over een eenheid die uitsluitend tot taak heeft, indien redelijkerwijs mag worden aangenomen dat gebruik van
      vuurwapengeweld tegen de politie of anderen dreigt, de volgende werkzaamheden uit te voeren:


      a. het verrichten van planmatige aanhoudingen,


      b. het bewaken en beveiligen van politie-infiltranten,


      c. het assisteren bij het bewaken en beveiligen van het transport van getuigen, verdachten of gedetineerden,


      d. het assisteren bij het bewaken en beveiligen van objecten en


      e. andere werkzaamheden waarvoor toestemming is verkregen van Onze Ministers.


      2 Onze Ministers geven regels over de organisatie van de eenheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel8
  - number: '9'
    text: >-
      1 De korpsbeheerder houdt binnen het regionale politiekorps ambtenaren van politie ter beschikking ten behoeve van
      de bijzondere bijstandseenheid politie.


      2 Onder de bijzondere bijstandseenheid politie, bedoeld in het eerste lid, wordt verstaan een eenheid die wordt
      ingezet voor de bijstandsverlening bij de daadwerkelijke bestrijding van zeer ernstige misdrijven waarbij sprake
      is van direct levensbedreigende omstandigheden en waarvan de leden zijn geoefend in het gebruik van een vuurwapen
      waarmee lange afstandsprecisievuur kan worden gegeven.


      3 De ambtenaren, bedoeld in het eerste lid, worden door de korpsbeheerder aangewezen op aanbeveling van de
      korpschef van het Korps landelijke politiediensten. Zij zijn direct inzetbaar.


      4 Onze Ministers bepalen de organisatie en paraatheid van de eenheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel9
  - number: '10'
    text: >-
      1 De korpsbeheerder houdt binnen het regionale politiekorps ambtenaren van politie ter beschikking ten behoeve van
      het rampenidentificatieteam politie.


      2 Onder het rampenidentificatieteam politie wordt verstaan een eenheid die wordt ingezet voor:


      a. het verlenen van assistentie aan een politiekorps bij berging en identificatie van slachtoffers bij rampen, of
      in die gevallen waarin identificatie van slachtoffers technisch bijzondere moeilijkheden oplevert;


      b. het verlenen van assistentie op verzoek van Onze Minister van Buitenlandse Zaken bij identificatie van
      slachtoffers van calamiteiten buiten Nederland waarbij Nederlandse belangen in het geding zijn;


      c. het verlenen van assistentie op verzoek van Onze Minister van Defensie bij identificatie van Nederlandse
      militairen buiten Nederland.


      3 De ambtenaren van politie, bedoeld in het eerste lid, worden door de korpsbeheerder aangewezen op aanbeveling
      van de korpschef van het Korps landelijke politiediensten, waarbij wordt aangegeven welke functie de betrokken
      ambtenaar in het rampenidentificatieteam politie zal vervullen. Zij zijn direct inzetbaar.


      4 Onze Ministers geven regels over de organisatie, beschikbaarheid en paraatheid van de eenheid, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel10
  - number: '11'
    text: >-
      1 Onze Ministers kunnen bepalen dat een regionaal politiekorps, zelfstandig of samen met een of meer andere
      regionale politiekorpsen, beschikt over een eenheid die is belast met de uitvoering van een bijzonder onderdeel van
      de politietaak.


      2 De korpsbeheerder draagt er zorg voor dat een eenheid als bedoeld in het eerste lid, beschikt over voldoende
      kennis en deskundigheid ten aanzien van het desbetreffende onderdeel van de politietaak.


      3 Onze Ministers kunnen regels geven over de organisatie van een eenheid als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel11
  - number: 11a
    text: >-
      Onze Ministers kunnen eenheden aanwijzen, bestaande uit ambtenaren van politie van een of meer regionale
      politiekorpsen, die zijn belast met het waken voor de veiligheid van daartoe door het bevoegd gezag aangewezen
      personen.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel11a
  - number: '12'
    text: >-
      1 Indien de aard van de werkzaamheden van de politie specifieke vaardigheid of kennis vereist kunnen Onze Ministers
      bepalen dat de met die werkzaamheden belaste ambtenaren van politie voldoen aan de daartoe door Onze Ministers
      vastgestelde eisen van bekwaamheid.


      2 De korpsbeheerder stelt de ambtenaar van politie, bedoeld in het eerste lid, in de gelegenheid de noodzakelijke
      training en opleiding te volgen.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel12
  - number: '13'
    text: >-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties geeft regels met betrekking tot het
      politielegitimatiebewijs en het gebruik van de politiehuisstijl.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel13
  - number: '14'
    text: Onze Ministers geven regels met betrekking tot de uitrusting van de regionale politiekorpsen.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel14
  - number: '15'
    text: >-
      1 De korpsbeheerder treft voorzieningen opdat de ingeslotene in ieder geval beschikt over:


      a. slaapgelegenheid,


      b. eten en drinken in overeenstemming met medische en levensbeschouwelijke of godsdienstige eisen,


      c. sanitair,


      d. de noodzakelijke medische zorg en


      e. informatie over de gang van zaken in het politiecellencomplex.


      2 Tenzij het politiecellencomplex geen luchtplaats heeft, draagt de korpsbeheerder er zorg voor dat de ingeslotene
      tweemaal daags wordt gelucht.


      3 In verband met het eerste lid, onder *d*, treft de korpsbeheerder een regeling met artsen in de regio ten einde
      van hulp verzekerd te zijn voor de medische zorg van ingeslotenen.


      4 Met inachtneming van het bij of krachtens de wet bepaalde treft de korpsbeheerder een regeling met betrekking tot
      het roken, de ontspanning, het telefoneren en het ontvangen van bezoek van de ingeslotene.


      5 Onze Ministers geven regels over de inrichting van een politiecellencomplex.


      6 Onze Ministers wijzen de gegevens aan die worden geregistreerd over ingeslotenen.


      7 In geval van overlijden of een poging tot zelfdoding van een ingeslotene draagt de korpsbeheerder er zorg voor
      dat het openbaar ministerie hiervan onverwijld in kennis wordt gesteld en dat aan Onze Ministers hiervan een
      schriftelijk rapport wordt toegezonden. Onze Ministers stellen voor het rapport een model vast.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel15
  - number: '16'
    text: |-
      1 De korpsbeheerder wijst een ambtenaar van politie aan die wordt belast met de leiding van het
      politiecellencomplex en het toezicht op de ingeslotenen.

      2 Met inachtneming van de [artikelen 26][ref1], [27][ref2] en [32][ref3] tot en met
      __REF003___________________________________________________________________________________________________________
      __ stelt de korpsbeheerder een instructie vast voor het personeel, niet zijnde ambtenaren van politie, dat is
      belast met de zorg voor ingeslotenen.

      3 Onze Ministers kunnen regels geven over de eisen van bekwaamheid waaraan het personeel, bedoeld in het tweede
      lid, moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006589#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0006589#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0006589#Artikel36
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel16
