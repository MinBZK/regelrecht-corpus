preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Ministers van Binnenlandse Zaken en van Justitie, van 2 december 1993, directoraat-
    generaal voor Openbare Orde en Veiligheid, directie Politie, nummer EA93/U3429, en Stafafdeling Wetgeving
    Publiekrecht, nummer 411040/93/6;


    Gelet op de artikelen 9, vierde lid, 45, eerste lid, en 47, eerste lid, van de Politiewet 1993;


    Gezien het advies van de Registratiekamer van 26 oktober 1993, kenmerk 93.A.10;


    De Raad van State gehoord (advies van 15 februari 1994, nummer WO4.93.0813);


    Gezien het nader rapport van Onze Ministers van Binnenlandse Zaken en van Justitie, van 24 maart 1994, directoraat-
    generaal voor Openbare Orde en Veiligheid, directie Politie, nummer EA94/U1029, en Stafafdeling Wetgeving
    Publiekrecht, nummer 431498/94/6;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Ministers: Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie gezamenlijk;

      b. korpsbeheerder: de burgemeester, bedoeld in [artikel 23, eerste lid, van de Politiewet 1993][ref1];

      c. ingeslotene: de persoon die rechtens van zijn vrijheid is beroofd, alsmede de persoon die ten behoeve van de
      hulpverlening aan hem op een bureau van een regionaal politiekorps is ondergebracht;

      d. politiecellencomplex: een in een gebouw te onderscheiden ruimte waarin een of meer gangen met daaraan grenzend
      een of meer ruimten liggen die worden gebruikt voor het insluiten van personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel23
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '23'
  - number: '2'
    text: |-
      1 Het regionale politiekorps registreert gegevens voor door Onze Ministers te bepalen doeleinden en door
      hen te bepalen categorieën dan wel in door hen aan te wijzen wettelijk geregelde registers en verstrekt deze
      gegevens aan de door hen aan te wijzen personen en instanties, onverminderd het bepaalde bij of krachtens de
      [Wet politieregisters][ref1].

      2 Onze Ministers kunnen bepalen dat in door hen aan te wijzen registers geen andere dan de in het eerste lid
      bedoelde gegevens worden geregistreerd en dat door hen aan te wijzen categorieën van gegevens in geen andere dan
      door hen aan te wijzen registers worden geregistreerd.

      3 Onze Ministers kunnen regels geven over de wijze waarop de gegevens, bedoeld in het eerste lid, worden
      geregistreerd, verwijderd dan wel verstrekt en op welke wijze bestandsvergelijking met die gegevens plaatsvindt.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan ter uitvoering van het derde lid nadere regels
      geven over de schrijfwijze, classificatie of codering van gegevens en de samenstelling van de gegevens in de vorm
      van berichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004798
  - number: '3'
    text: |-
      1 Het regionale politiekorps maakt voor de in [artikel 2, eerste lid][ref1], bedoelde verstrekking van gegevens via
      telecommunicatievoorzieningen, gebruik van de telecommunicatievoorzieningen die door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties kunnen worden aangewezen.

      2 Het regionale politiekorps maakt voor de overdracht van gegevens door middel van niet-draadgebonden
      telecommunicatie-voorzieningen gebruik van frequenties die door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties aan het regionale politiekorps worden toegewezen.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan, in overeenstemming met Onze Minister van
      Justitie, regels geven over de wijze waarop de in het eerste en tweede lid bedoelde voorzieningen worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006560#Artikel2
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006560
        artikel: '2'
        hoofdstuk: '2'
  - number: 3a
    text: |-
      1 De korpsbeheerder draagt zorg voor deugdelijke informatiebeveiliging, hetgeen omvat het treffen en onderhouden
      van een samenhangend pakket van maatregelen ter waarborging van de beschikbaarheid, integriteit en exclusiviteit
      van de informatiesystemen, onverminderd het bepaalde bij of krachtens de [Wet politieregisters][ref1] en de Wet
      persoonsregistraties.

      2 Onze Ministers kunnen regels geven met betrekking tot het onderwerp, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004798
  - number: '4'
    text: |-
      1 Het regionale politiekorps draagt ten behoeve van de opsporing van strafbare feiten zorg voor het inrichten van
      de recherchefunctie.

      2 Een lid van de leiding van het regionale politiekorps, bedoeld in
      [artikel 25, derde lid, van de Politiewet 1993][ref1], is in het bijzonder verantwoordelijk voor de
      recherchefunctie van het regionale politiekorps.

      3 Onze Ministers kunnen regels geven over de inrichting, taken en uitvoering van de werkzaamheden binnen het
      regionale politiekorps ten behoeve van de uitoefening van de recherchefunctie.

      4 Ieder regionaal politiekorps beschikt ten behoeve van de uitoefening van de recherchefunctie over voorzieningen
      op het gebied van:

      a. tactische recherche,

      b. technische recherche,

      c. financiële recherche,

      d. digitale recherche, en

      e. informatievoorziening.

      5 Onze Ministers kunnen voorzieningen op andere gebieden dan die, genoemd in het vierde lid, aanwijzen waarover het
      regionale politiekorps beschikt ten behoeve van de uitoefening van de recherchefunctie.

      6 Onze Ministers kunnen regels geven over het beheer en de inrichting van, alsmede over de taken en de uitvoering
      van de werkzaamheden met betrekking tot de voorzieningen, bedoeld in het vierde en vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel25
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '25'
  - number: '5'
    text: |-
      1 Het regionale politiekorps beschikt over een eenheid die is belast met het, ten behoeve van de
      recherchefunctie, verwerken van gegevens die noodzakelijk zijn voor de opsporing van misdrijven als bedoeld in
      [artikel 1, onderdelen k en l, van de Wet politieregisters][ref1].

      2 Onze Ministers kunnen regels geven over het beheer, de inrichting, taken en uitvoering van de werkzaamheden van
      de eenheid, bedoeld in het eerste lid.

      3 Het regionale politiekorps beschikt, zelfstandig of samen met een of meer andere politiekorpsen, over een
      eenheid die is belast met de uitvoering van een bevel tot observatie als bedoeld in de [artikelen 126g][ref2] en
      [126o van het Wetboek van Strafvordering][ref3].

      4 Het regionale politiekorps beschikt, zelfstandig of samen met een of meer andere politiekorpsen, over een eenheid
      die is belast met de uitvoering van een bevel tot infiltratie als bedoeld in [artikel 126h, eerste lid][ref4],
      of [artikel 126p, eerste lid, van het Wetboek van Strafvordering][ref5] en met de begeleiding van personen die op
      grond van [artikel 126w van het Wetboek van Strafvordering][ref6] bijstand verlenen aan de opsporing. Daarnaast
      kan deze eenheid worden belast met de uitvoering van een bevel tot pseudo-koop of -dienstverlening als bedoeld
      in [artikel 126i, eerste lid][ref7], of [artikel 126ij, eerste lid, van het Wetboek van Strafvordering][ref8]
      en een bevel tot stelselmatige inwinning van informatie als bedoeld in [artikel 126j, eerste lid][ref9], of
      [artikel 126qa, eerste lid, van het Wetboek van Strafvordering][ref10].

      5 Onze Ministers kunnen regels geven over het beheer, de inrichting, taken en uitvoering van de werkzaamheden van
      de eenheden, bedoeld in het derde en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel1
