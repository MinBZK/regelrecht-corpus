  - number: 5a
    text: |-
      De regionale politiekorpsen werken onderling en met het Korps landelijke politiediensten samen op het terrein van
      de voorzieningen en eenheden die, overeenkomstig [de artikelen 4][ref1] en [5][ref2], zijn ingericht ten behoeve
      van de recherchefunctie.


      [ref1]: https://wetten.overheid.nl/BWBR0006560#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006560#Artikel5
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006560
        artikel: '4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006560
        artikel: '5'
        hoofdstuk: '3'
  - number: 5b
    text: |-
      Het regionale politiekorps voert ten behoeve van de recherchefunctie een register zware criminaliteit en een
      voorlopig register als bedoeld in [artikel 1, onderdelen k en l, van de Wet politieregisters][ref1]. De registers
      worden aangelegd en gehouden bij de eenheid, bedoeld in [artikel 5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006560#Artikel5
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel5b
