  - number: 16a
    text: |-
      1 De korpsbeheerder stelt ten behoeve van de politiecellencomplexen in zijn regio een commissie van toezicht in,
      bestaande uit ten minste drie en ten hoogste twaalf, onafhankelijke leden.

      2 De commissie heeft in ieder geval tot taak:

      a. toezicht te houden op de huisvesting, veiligheid, verzorging en bejegening van ingeslotenen in de
      politiecellencomplexen;

      b. jaarlijks rapport uit te brengen aan de korpsbeheerder over haar werkzaamheden;

      c. gevraagd en ongevraagd aan de korpsbeheerder advies uit te brengen en inlichtingen te geven omtrent
      aangelegenheden betreffende de politiecellencomplexen.

      3 De commissie van toezicht kan door de korpsbeheerder tevens worden belast met de behandeling van en de advisering
      over klachten als bedoeld in [artikel 61 van de Politiewet 1993][ref1], voor zover die klachten betrekking hebben
      op aangelegenheden betreffende de politiecellencomplexen.

      4 De korpsbeheerder stelt regels vast over de voor een adequate taakvervulling benodigde bevoegdheden, de
      samenstelling en de werkwijze van de commissie van toezicht, de benoeming en het ontslag van haar leden.

      5 Bij de samenstelling van de commissie wordt rekening gehouden met de benodigde maatschappelijke en bestuurlijke
      deskundigheid en ervaring van de leden.

      6 Jaarlijks zendt de korpsbeheerder een verslag van de werkzaamheden en bevindingen van de commissie van toezicht
      aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel61
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '61'
  - number: '17'
    text: >-
      1 De korpsbeheerder verstrekt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties periodiek gegevens over:


      a. de omvang en samenstelling van het regionale politiekorps en


      b. de werkdruk en de taakuitvoering van het regionale politiekorps.


      2 De korpsbeheerder verstrekt op verzoek van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de
      gegevens die Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties of Onze Minister van Justitie overigens
      noodzakelijk acht.


      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen over de inrichting van de
      gegevens, bedoeld in het eerste lid, alsmede over de wijze waarop en de frequentie waarmee deze gegevens aan hem
      worden verstrekt. Voor zover deze gegevens betrekking hebben op de strafrechtelijke handhaving van de rechtsorde
      dan wel op taken ten dienste van de justitie, worden de regels door Onze Ministers gegeven en worden deze gegevens
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan Onze Minister van Justitie ter beschikking
      gesteld.


      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties doet jaarlijks verslag van de verkregen gegevens aan
      Onze Minister van Justitie en aan de korpsbeheerders.
    url: https://wetten.overheid.nl/BWBR0006560/2001-02-01#Artikel17
  - number: '18'
    text: |-
      1 De korpsbeheerder draagt overeenkomstig door het regionale college vast te stellen regels zorg voor de
      archiefbescheiden van de regio, voor zover deze niet zijn overgebracht naar een archiefbewaarplaats als bedoeld in
      [artikel 31 van de Archiefwet 1995][ref1].

      2 Het regionale college zendt de regels, bedoeld in het eerste lid, aan gedeputeerde staten van de provincie waarin
      de gemeente is gelegen waarvan de burgemeester korpsbeheerder is.

      3 De kosten van de bewaring van archiefbescheiden van de regio in een archiefbewaarplaats en de kosten van het
      toezicht op het beheer van de archiefbescheiden van de regio, voor zover deze niet zijn overgebracht naar de
      archiefbewaarplaats, komen ten laste van de regio.


