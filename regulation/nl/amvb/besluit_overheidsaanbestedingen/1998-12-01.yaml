  - number: '11'
    text: |-
      1 Voor het plaatsen van opdrachten voor leveringen als bedoeld in artikel 1, onderdeel a, van [richtlijn 93/36/EEG]
      (31993L0036), die voldoen aan het bepaalde in artikel 5, eerste tot en met zesde lid, van de richtlijn en die niet
      in de artikelen 2, eerste lid, 3 en 4 van de richtlijn van toepassing zijn uitgesloten, passen de aanbestedende
      diensten de artikelen 5, zevende lid, 6, tweede tot en met vierde lid, 7, 8, eerste tot en met vijfde lid, 9,
      eerste tot en met vijfde lid en negende en tiende lid, 10 tot en met 13, 15, eerste en tweede lid, 15, derde lid,
      eerste volzin, 16 tot en met 18, 19, eerste tot en met derde lid, 20 tot en met 24, 25, tweede tot en met vierde
      lid, 26, 27 en 30 van de richtlijn toe.

      2 De toepassing van het eerste lid geschiedt met inachtneming van het in artikel 5, eerste lid, onder *a*, van
      [richtlijn 93/36/EEG](31993L0036) gemaakte onderscheid tussen aanbestedende diensten die niet en aanbestedende
      diensten die wel zijn genoemd in bijlage I van de richtlijn.

      3 Onverminderd het eerste en tweede lid houden de in bijlage I van [richtlijn 93/36/EEG](31993L0036) genoemde
      aanbestedende diensten zich bij het plaatsen van opdrachten voor leveringen aan de bepalingen van artikel 28 van
      de richtlijn.

      4 Bij het sluiten van een overeenkomst als bedoeld in artikel 2, tweede lid, van [richtlijn 93/36/EEG](31993L0036)
      tussen een aanbestedende dienst en een concessiehouder, niet zijnde een aanbestedende dienst, wordt bepaald dat het
      plaatsen van opdrachten voor leveringen ter uitvoering van die overeenkomst door de concessiehouder geschiedt op
      niet-discriminerende wijze.
    url: https://wetten.overheid.nl/BWBR0006009/1998-12-01#Artikel11
