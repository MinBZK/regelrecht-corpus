  - number: '15'
    text: |-
      1 Voor het plaatsen van opdrachten voor dienstverlening als bedoeld in artikel 1, onderdeel a, van [richtlijn
      92/50/EEG](31992L0050), die voldoen aan het bepaalde in artikel 7 van de richtlijn en niet in de artikelen 4 tot en
      met 6 van de richtlijn van toepassing zijn uitgesloten, passen de aanbestedende diensten de artikelen 2, 3, tweede
      lid, 7, tweede lid, 8 tot en met 12, 14, eerste tot en met vijfde lid, 15, eerste en tweede lid, 16, eerste tot en
      met derde lid en vijfde lid, 17, eerste, tweede, zesde en zevende lid, 18 tot en met 21, 23, eerste lid, 23, tweede
      lid, eerste volzin, 24 tot en met 26, 27, eerste tot en met derde lid, 28, tweede lid, 29 tot en met 34, 35, tweede
      tot en met vierde lid, en 36 tot en met 38 van de richtlijn toe.

      2 Voor het uitschrijven van prijsvragen voor ontwerpen als bedoeld in artikel 1, onderdeel *g*, van [richtlijn
      92/50/EEG](31992L0050), die voldoen aan het bepaalde in artikel 13, eerste en tweede lid, van de richtlijn, passen
      de aanbestedende diensten de artikelen 13, derde tot en met zesde lid, 15, derde lid, 16, eerste en tweede lid en
      17 van de richtlijn toe.

      3 Een aanbestedende dienst zorgt ervoor dat de in het eerste lid vermelde artikelen van [richtlijn 92/50/EEG]
      (31992L0050) ook worden toegepast voor een opdracht voor dienstverlening die door een instantie, niet zijnde
      een aanbestedende dienst, wordt geplaatst, indien de aanbestedende dienst de opdracht voor meer dan 50 procent
      rechtstreeks subsidieert en deze opdracht verband houdt met een opdracht voor de uitvoering van werken in de zin
      van artikel 2, tweede lid, van [richtlijn 93/37/EEG](31993L0037).
    url: https://wetten.overheid.nl/BWBR0006009/1998-12-01#Artikel15
