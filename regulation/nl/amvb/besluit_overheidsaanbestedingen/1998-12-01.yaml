preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 4 september 1992, nr. 92069535 WJA/W, gedaan in
    overeenstemming met Onze Ministers van Binnenlandse Zaken en van Verkeer en Waterstaat;

    Gelet op richtlijn 92/50/EEG van de Raad van de Europese Gemeenschappen van 18 juni 1992, betreffende de
    coördinatie van de procedures voor het plaatsen van overheidsopdrachten voor dienstverlening (Pb L 209), alsmede op
    de artikelen 2 en 3 van de Raamwet EEG-voorschriften aanbestedingen;

    De Raad van State gehoord (advies van 23 februari 1993, nr. W10.92.0417.);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 27 mei 1993, nr. 93024457 WJA/W, uitgebracht
    in overeenstemming met Onze voornoemde Ministers;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006009/1998-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken;

      b. [richtlijn 92/50/EEG](31992L0050): [richtlijn nr. 92/50/EEG](31992L0050) van de Raad van de Europese
      Gemeenschappen van 18 juni 1992 betreffende de coördinatie van de procedures voor het plaatsen van
      overheidsopdrachten voor dienstverlening (PbEG L 209), naar de tekst zoals deze laatstelijk is gewijzigd bij
      [richtlijn nr. 97/52/EG](31997L0052) van het Europees Parlement en de Raad van de Europese Unie van 13 oktober 1997
      (PbEG L 328);

      c. [richtlijn 93/37/EEG](31993L0037): [richtlijn nr. 93/37/EEG](31993L0037) van de Raad van de Europese
      Gemeenschappen van 14 juni 1993 betreffende de coördinatie van de procedures voor het plaatsen van
      overheidsopdrachten voor de uitvoering van werken (PbEG L 199), naar de tekst zoals deze laatstelijk is gewijzigd
      bij [richtlijn nr. 97/52/EG](31997L0052) van het Europees Parlement en de Raad van de Europese Unie van 13 oktober
      1997 (PbEG L 328);

      d. [richtlijn 71/304/EEG](31971L0304): [richtlijn 71/304/EEG](31971L0304) van de Raad van de Europese
      Gemeenschappen van 26 juli 1971, betreffende de opheffing van de beperkingen van het vrij verrichten van diensten
      op het gebied van overheidsopdrachten voor de uitvoering van werken en van de gunning van overheidsopdrachten door
      bemiddeling van agentschappen of filialen (*PbEG* L 185);

      e. [richtlijn 93/36/EEG](31993L0036): [richtlijn nr. 93/36/EEG](31993L0036) van de Raad van de Europese
      Gemeenschappen van 14 juni 1993 betreffende de coördinatie van de procedures voor het plaatsen van
      overheidsopdrachten voor leveringen (PbEG L 199), naar de tekst zoals deze laatstelijk is gewijzigd bij [richtlijn
      nr. 97/52/EG](31997L0052) van het Europees Parlement en de Raad van de Europese Unie van 13 oktober 1997 (PbEG
      L 328);

      f. [richtlijn 89/665/EEG](31989L0665): [richtlijn 89/665/EEG](31989L0665) van de Raad van de Europese
      Gemeenschappen van 21 december 1989 houdende de coördinatie van de wettelijke en bestuursrechtelijke bepalingen
      betreffende de toepassing van de beroepsprocedures inzake het plaatsen van overheidsopdrachten voor leveringen en
      voor de uitvoering van werken (*PbEG* L 395), naar de tekst zoals deze is gewijzigd bij de Overeenkomst betreffende
      de Europese Economische Ruimte (*PbEG* 1994 L 1);

      g. een aanbestedende dienst: een dienst als bedoeld in artikel 1, onderdeel *b*, van de richtlijnen, genoemd onder
      *b*, *c* en *e*;

      h. de Commissie: de Commissie van de Europese Gemeenschappen;

      i. de Overeenkomst inzake overheidsopdrachten: de op 15 april 1994 te Marrakech tot stand gekomen Overeenkomst
      inzake overheidsopdrachten (Trb.1994, 235).
    url: https://wetten.overheid.nl/BWBR0006009/1998-12-01#Artikel1
  - number: '2'
    text: |-
      1 Aanbestedende diensten wenden zich zonder discriminatie en onder dezelfde voorwaarden als die welke zij voor
      gegadigden in Nederland stellen, tot aannemers, leveranciers en dienstverleners in andere lidstaten van de Europese
      Unie en in overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte die
      voldoen aan de vereisten, gesteld krachtens respectievelijk de [richtlijnen 93/37/EEG](31993L0037), [93/36/EEG]
      (31993L0036) en [92/50/EEG](31992L0050).

      2 Aanbestedende diensten passen bij een procedure voor het plaatsen van een opdracht tegenover aannemers,
      leveranciers en dienstverleners in de lidstaten van de Europese Unie de voorwaarden, bedoeld in de Overeenkomst
      inzake overheidsopdrachten, toe, indien zij deze voorwaarden voor diezelfde procedure toepassen ten aanzien
      van aannemers, leveranciers en dienstverleners uit andere staten die partij bij de Overeenkomst inzake
      overheidsopdrachten zijn en deze voorwaarden gunstiger voor hen zijn dan de voorwaarden, bedoeld in de [richtlijnen
      93/37/EEG](31993L0037), [93/36/EEG](31993L0036) en [92/50/EEG](31992L0050).
    url: https://wetten.overheid.nl/BWBR0006009/1998-12-01#Artikel2
  - number: '3'
    text: |-
      In de overeenkomsten die behoren bij opdrachten voor de uitvoering van werken, voor leveringen en voor het
      verrichten van diensten, worden geen technische specificaties opgenomen die produkten van een bepaald fabrikaat of
      een bepaalde herkomst dan wel bijzondere werkwijzen vermelden, waardoor bepaalde ondernemingen worden begunstigd
      of uitgeschakeld, tenzij dergelijke specificaties door het voorwerp van de opdracht worden gerechtvaardigd, in welk
      geval daaraan de vermelding «of daarmee overeenstemmend» wordt toegevoegd.
    url: https://wetten.overheid.nl/BWBR0006009/1998-12-01#Artikel3
  - number: '4'
    text: |-
      1 Als instantie die bevoegd is tot het afgeven van een bewijsstuk waaruit blijkt dat een gegadigde of tot het van
      toepassing verklaren van de schuldsaneringsregeling natuurlijke personen op de gegadigde voor een overheidsopdracht
      niet verkeert in een van de omstandigheden, bedoeld in artikel 29, onder *a* en *b*, van [richtlijn 92/50/
      EEG](31992L0050), artikel 20, eerste lid, onder *a* en *b*, van [richtlijn 93/36/EEG](31993L0036) en artikel
      24, onder *a* en *b*, van [richtlijn 93/37/EEG](31993L0037), geldt de griffier van de rechtbank die op grond
      van [artikel 2 van de Faillissementswet][ref1] bevoegd is tot het uitspreken van de faillietverklaring van de
      gegadigde.

      2 Als instantie die bevoegd is tot het afgeven van een verklaring waaruit blijkt dat een gegadigde voor
      een overheidsopdracht niet verkeert in de omstandigheid, bedoeld in artikel 29, onder *e*, van [richtlijn
      92/50/EEG](31992L0050), artikel 20, eerste lid, onder *e*, van [richtlijn 93/36/EEG](31993L0036) en
      artikel 24, onder *e*, van [richtlijn 93/37/EEG](31993L0037), geldt, voor zover het betreft bijdragen
      ten behoeve van werknemersverzekeringen, het Landelijk instituut sociale verzekeringen en geldt, voor
      zover het betreft de bijdragen ten behoeve van de volksverzekeringen, de inspecteur die ingevolge
      [artikel 3 van de Algemene wet inzake rijksbelastingen][ref2] bevoegd is tot heffing van belastingen van de
      gegadigde.

      3 Als instantie die bevoegd is tot het afgeven van een bewijsstuk waaruit blijkt dat een gegadigde
      voor een overheidsopdracht niet verkeert in de omstandigheid als bedoeld in artikel 29, onder *f*, van
      [richtlijn 92/50/EEG](31992L0050), artikel 20, eerste lid, onder *f*, van [richtlijn 93/36/EEG](31993L0036)
      en artikel 24, onder *f*, van [richtlijn 93/37/EEG](31993L0037), geldt de inspecteur die ingevolge
      [artikel 3 van de Algemene wet inzake rijksbelastingen][ref3] bevoegd is tot heffing van belastingen van de
      gegadigde.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006009/1998-12-01#Artikel4
