  - number: '5'
    text: |-
      Indien de Commissie toepassing geeft aan de procedures, bedoeld in artikel 3 van [richtlijn 89/665/EEG]
      (31989L0665), verlenen de betrokken aanbestedende diensten hun medewerking daaraan overeenkomstig artikel 3, derde
      tot en met vijfde lid, van deze richtlijn.
    url: https://wetten.overheid.nl/BWBR0006009/1998-12-01#Artikel5
  - number: 5a
    text: |-
      Aanbestedende diensten kunnen elke andere vorm van inschrijving dan schriftelijk, rechtstreeks of via de post,
      toestaan, indien zij er voor zorgen dat:

      a. elke inschrijving alle informatie bevat die voor de beoordeling ervan nodig is;

      b. het vertrouwelijk karakter van de inschrijvingen, in afwachting van de beoordeling ervan, wordt gerespecteerd;

      c. de inschrijvingen, indien zulks om redenen van juridisch bewijs noodzakelijk is, zo snel mogelijk schriftelijk
      of door toezending van een gewaarmerkt afschrift worden bevestigd en

      d. het openen van de inhoud van de inschrijvingen plaatsvindt na het verstrijken van de termijn voor indiening.
    url: https://wetten.overheid.nl/BWBR0006009/1998-12-01#Artikel5a
  - number: '6'
    text: |-
      1 Voor het plaatsen van opdrachten voor de uitvoering van werken als bedoeld in artikel 1, onderdeel a, van
      [richtlijn 93/37/EEG](31993L0037), die voldoen aan het bepaalde in artikel 6, eerste tot en met vijfde lid, van de
      richtlijn en niet in de artikelen 4 en 5 van de richtlijn van toepassing zijn uitgesloten, passen de aanbestedende
      diensten de artikelen 6, zesde lid, 7, tweede tot en met vierde lid, 8, 9, 10, eerste tot en met vijfde lid, 11,
      eerste tot en met zevende lid, elfde en twaalfde lid, 12 tot en met 14, 18, eerste lid, 18, tweede lid, eerste
      volzin, 19 tot en met 21, 22, eerste tot en met derde lid, 23, tweede lid, 24 tot en met 28, 29, tweede tot en met
      vierde lid, en 30 van de richtlijn toe.

      2 Een aanbestedende dienst zorgt ervoor dat de in het eerste lid vermelde artikelen van [richtlijn 93/37/EEG]
      (31993L0037) ook worden toegepast voor een opdracht voor de uitvoering van werken als bedoeld in artikel 2, tweede
      lid, van de richtlijn, die door een instantie, niet zijnde een aanbestedende dienst, wordt geplaatst, indien de
      aanbestedende dienst de opdracht voor meer dan 50 procent rechtstreeks subsidieert.

      3 Ten aanzien van de begunstigden, bedoeld in artikel 1 van [richtlijn 71/304/EEG](31971L0304), worden
      overeenkomstig het in die richtlijn bepaalde geen beperkingen opgelegd of toegepast.
    url: https://wetten.overheid.nl/BWBR0006009/1998-12-01#Artikel6
  - number: '7'
    text: |-
      1 Voor het sluiten van concessie-overeenkomsten voor openbare werken als bedoeld in artikel 1, onderdeel *d*, van
      [richtlijn 93/37/EEG](31993L0037), die voldoen aan het bepaalde in artikel 3, eerste lid, van de richtlijn passen
      de aanbestedende diensten de artikelen 3, tweede lid, 11, derde, zesde, zevende, elfde en twaalfde lid, en 15 van
      de richtlijn toe.

      2 Voor opdrachten voor de uitvoering van werken die voldoen aan het bepaalde in artikel 6 van de richtlijn en
      die worden geplaatst bij derden als bedoeld in artikel 3, vierde lid, van de [richtlijn 93/37/EEG](31993L0037),
      passen concessiehouders van openbare werken die geen aanbestedende dienst zijn, de artikelen 11, vierde, zesde,
      zevende, elfde en twaalfde lid, en 16 van de richtlijn toe. Publikatie op grond van artikel 11, vierde lid, van de
      richtlijn, kan echter achterwege blijven wanneer de opdracht voor de uitvoering van werken voldoet aan artikel 7,
      derde lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006009/1998-12-01#Artikel7
  - number: '8'
    text: |-
      1 De aanbestedende diensten verstrekken Onze Minister de gegevens die deze nodig heeft voor de in [artikel 9][ref1]
      bedoelde informatieverstrekking aan de Commissie.

      2 De aanbestedende diensten verstrekken Onze Minister op diens verzoek de gegevens, bedoeld in artikel 10, vierde
      lid, van [richtlijn 93/37/EEG](31993L0037).

      3 De aanbestedende diensten nemen daarbij, voor zover van toepassing, de nadere voorschriften in acht, bedoeld in
      [artikel 3, tweede lid, van de Raamwet EEG-voorschriften aanbestedingen][ref2].


