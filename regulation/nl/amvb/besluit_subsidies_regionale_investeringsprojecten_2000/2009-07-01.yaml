---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_subsidies_regionale_investeringsprojecten_2000
regulatory_layer: AMVB
publication_date: '2009-10-22'
valid_from: '2009-07-01'
bwb_id: BWBR0011582
url: https://wetten.overheid.nl/BWBR0011582/2009-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken van 19 juli 1999, nr. WJZ/JZ 99046291;

    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    De Raad van State gehoord (advies van 11 november 1999, nr. W 10.990410/II);

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken van 17 augustus 2000, nr. WJZ 00045024;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.a
    text: 'concern: een economische eenheid waarin organisatorisch zijn verbonden:'
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.a.1°
    text: |-
      een natuurlijke persoon of privaatrechtelijke rechtspersoon die direct of indirect: - de helft of meer van het
      geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen en
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.a.2°
    text: laatstbedoelde rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.b
    text: |-
      project: een technisch, functioneel en in de tijd samenhangend geheel van investeringen in duurzame
      bedrijfsuitrusting al dan niet in combinatie met grond of bedrijfsgebouwen;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.c
    text: 'vestigingsproject: een project, niet zijnde een uitbreidingsproject, inhoudende het stichten van:'
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.c.1°
    text: een industrieel bedrijf,
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.c.2°
    text: een stuwend dienstverlenend bedrijf, hoofdkantoor of laboratorium,
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.c.3°
    text: een stuwend toeristisch bedrijf;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.d
    text: |-
      uitbreidingsproject: een project inhoudende de uitbreiding van de capaciteit van een industrieel bedrijf, stuwend
      dienstverlenend bedrijf, stuwend toeristisch bedrijf, hoofdkantoor of laboratorium in dezelfde gemeente als waarin
      reeds een bedrijf van de ondernemer of een bedrijf van een tot hetzelfde concern behorende ondernemer is gevestigd;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.e
    text: |-
      fundamenteel wijzigingsproject: een fundamentele wijziging in het product of in het productieproces van een
      industrieel bedrijf;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.f
    text: |-
      strategisch uitbreidingsproject: een uitbreidingsproject waarbij sprake is van concurrentie binnen de Europese Unie
      ten aanzien van de plaats waar het project wordt gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.g
    text: |-
      stuwend toeristisch bedrijf: een bedrijf op het gebied van de toeristische dagrecreatie, dat de economische
      ontwikkeling in de regio van vestiging stimuleert en dat in overwegende mate bezoekers trekt van buiten de regio
      waarin het is of zal worden gevestigd;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.h
    text: |-
      stuwend dienstverlenend bedrijf: een dienstverlenend bedrijf, niet zijnde een toeristisch bedrijf of een bedrijf
      waarvan de activiteiten grotendeels bestaan uit het bieden van accommodatie aan congresgangers, dat naar zijn aard
      niet aan enige plaats gebonden is, dat de economische ontwikkeling van de regio van vestiging stimuleert en waarvan
      de afnemers in overwegende mate gevestigd zijn buiten de regio waarin het is of zal worden gevestigd;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.i
    text: |-
      hoofdkantoor: een kantoor van een concern waarin de centrale leiding of een zelfstandig onderdeel daarvan is
      gehuisvest;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.j
    text: |-
      een laboratorium: een bedrijf of bedrijfsonderdeel op het gebied van technisch of fysisch onderzoek, dat een
      belangrijke functie vervult voor de ontwikkeling van voor het bedrijf nieuwe producten;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.k
    text: |-
      S.B.I.-bedrijfsgroep: een bedrijfsgroep op vier-cijferniveau van de Standaardbedrijfsindeling 1993 van het Centraal
      Bureau voor de Statistiek;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: 1.1.l
    text: |-
      ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht is
      ingesteld, die een onderneming in stand houdt.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: '1.2'
    text: Bij ministeriële regeling wordt de omvang van de regio's, bedoeld in het eerste lid, onder g en h, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: '1.3'
    text: |-
      Bij ministeriële regeling kunnen ondernemingen worden aangewezen die van de toepassing van dit besluit zijn
      uitgesloten.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister verstrekt op aanvraag subsidie aan de ondernemer die een project tot stand brengt in een bij
      ministeriële regeling aangewezen gemeente of deel van een gemeente.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      Bij een regeling als bedoeld in het eerste lid kan Onze Minister bepalen voor welke soorten projecten in de
      onderscheiden gemeenten of delen van gemeenten subsidie kan worden verstrekt. Daarbij kan hij onderscheid maken
      tussen:
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel2
  - number: 2.2.a
    text: vestigingsprojecten;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel2
  - number: 2.2.b
    text: |-
      vestigingsprojecten die van bijzonder belang zijn voor de regionale economie en waarvan de subsidiabele kosten door
      Onze Minister zijn geraamd op € 13 600 000 of meer;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel2
  - number: 2.2.c
    text: |-
      fundamentele wijzigingsprojecten die van bijzonder belang zijn voor de regionale economie en waarvan de
      subsidiabele kosten door Onze Minister zijn geraamd op € 45 300 000 of meer;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel2
  - number: 2.2.d
    text: |-
      strategische uitbreidingsprojecten waarvan de subsidiabele kosten door Onze Minister zijn geraamd op € 13 600 000
      of meer.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel2
  - number: '2.3'
    text: |-
      Geen subsidie wordt verstrekt, indien voor het project reeds uit anderen hoofde door Onze Minister subsidie is
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel2
  - number: '3.1'
    text: 'De subsidie bedraagt:'
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel3
  - number: 3.1.a
    text: |-
      in geval van een project als bedoeld in [artikel 2, tweede lid, onder a][ref1]: een bij ministeriële regeling te
      bepalen percentage van de subsidiabele kosten, met dien verstande dat voor de berekening van het subsidiebedrag de
      kosten in aanmerking genomen worden tot ten hoogste € 8 200 000;


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel2
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '2'
        paragraaf: '1'
  - number: 3.1.b
    text: |-
      in geval van een project als bedoeld in [artikel 2, tweede lid, onder b, c of d][ref1]: een door Onze Minister te
      bepalen percentage van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel2
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '2'
        paragraaf: '1'
  - number: '3.2'
    text: |-
      Indien de geraamde subsidiabele kosten van een project, bedoeld in het eerste lid, onder a, meer bedragen dan
      € 8 200 000 en het project van bijzonder belang is voor de ontwikkeling van de regionale economie, kan Onze
      Minister een hoger subsidiebedrag verstrekken dan het bedrag ingevolge het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel3
  - number: '3.3'
    text: |-
      Indien ter zake van de subsidiabele kosten of een deel daarvan reeds door een ander bestuursorgaan of de Commissie
      van de Europese Gemeenschappen subsidie is verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt, dat
      het totale bedrag aan subsidie niet meer bedraagt dan het bedrag ingevolge het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel3
  - number: '4.1'
    text: |-
      De subsidiabele kosten zijn de in [artikel 5][ref1] en [6][ref2] bedoelde projectkosten, verminderd overeenkomstig
      de volgende leden van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011582#Artikel5
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011582
        artikel: '5'
        paragraaf: '1'
  - number: '4.2'
    text: 'Een vermindering wordt toegepast indien:'
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: 4.2.a
    text: |-
      de door realisering van het project verworven grond, verworven of tot stand gebrachte bedrijfsgebouwen of duurzame
      bedrijfsuitrusting binnen één jaar na het tijdstip waarop het project is uitgevoerd zijn afgestoten of buiten
      gebruik gesteld;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: 4.2.b
    text: |-
      de realisering van het project geschiedt in een bedrijfsgebouw of door aanschaf van vaste installaties in de open
      lucht, waarin of waarmee grotendeels activiteiten worden verricht welke behoren tot dezelfde S.B.I.-bedrijfsgroep
      als minder dan één jaar voor de indiening van de aanvraag reeds geschiedde;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: 4.2.c
    text: |-
      de realisering van het project geschiedt door de verzelfstandiging van een in Nederland gevestigd bedrijf en de
      daarin verrichte activiteiten blijven behoren tot dezelfde S.B.I.-bedrijfsgroep.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: '4.3'
    text: |-
      Een vermindering wordt voorts toegepast indien binnen een periode van één jaar vóór het indienen van de aanvraag
      tot één jaar na de datum waarop het project is uitgevoerd aan de subsidie-ontvanger of tot hetzelfde concern als
      de subsidie-ontvanger behorende grond, bedrijfsgebouwen of duurzame bedrijfsuitrusting welke zich bevinden in een
      bij regeling van Onze Minister aangewezen gemeente of deel van een gemeente worden afgestoten of buiten gebruik
      gesteld, waarin of waarmee activiteiten werden verricht welke behoren tot dezelfde S.B.I.-bedrijfsgroep als de
      activiteiten welke in of met de tot het project behorende bedrijfsgebouwen en duurzame bedrijfsuitrusting worden
      verricht. Deze vermindering geldt niet voor afstoot of buitengebruikstelling als onderdeel van een fundamenteel
      wijzigingsproject.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: '4.4'
    text: |-
      De in het tweede lid, onder a, bedoelde vermindering bedraagt het gedeelte van de projectkosten dat kan worden
      toegerekend aan de grond, de bedrijfsgebouwen of duurzame bedrijfsuitrusting die zijn afgestoten of buiten gebruik
      gesteld.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: '4.5'
    text: |-
      De in het tweede lid, onder b, bedoelde vermindering bedraagt het gedeelte van de projectkosten dat kan worden
      toegerekend aan het desbetreffende bedrijfsgebouw of de vaste installaties.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: '4.6'
    text: |-
      De in het tweede lid, onder c, bedoelde vermindering bedraagt het gedeelte van de projectkosten dat kan worden
      toegerekend aan de verkrijging van het desbetreffende bedrijf.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: '4.7'
    text: 'De in het derde lid bedoelde vermindering bedraagt:'
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: 4.7.a
    text: |-
      het gedeelte van de kosten van verkrijging van grond, dat overeenkomt met het gedeelte dat de oppervlakte die wordt
      afgestoten of buiten gebruik gesteld uitmaakt van de totale oppervlakte van de door het project verworven grond;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: 4.7.b
    text: |-
      het gedeelte van de kosten van verkrijging van bedrijfsgebouwen, dat overeenkomt met het gedeelte dat de inhoud die
      wordt afgestoten of buiten gebruik gesteld uitmaakt van de totale inhoud van de door het project verworven of tot
      stand gebrachte bedrijfsgebouwen;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: 4.7.c
    text: |-
      het gedeelte van de kosten van verkrijging van duurzame bedrijfsuitrusting, dat overeenkomt met het gedeelte dat
      de capaciteit die wordt afgestoten of buiten gebruik gesteld uitmaakt van de totale capaciteit van de door het
      project verworven of tot stand gebrachte duurzame bedrijfsuitrusting. Onder capaciteit wordt verstaan het door
      de duurzame bedrijfsuitrusting bepaalde, technisch maximale vermogen tot produceren per tijdseenheid. Indien de
      capaciteit vanwege het onderscheid tussen de producten niet vergelijkbaar is, wordt de vermindering berekend aan
      de hand van de verhouding tussen de kosten van verkrijging van duurzame bedrijfsuitrusting en de ten hoogst twee
      jaar voor de aanvraag om subsidie bepaalde taxatiewaarde welke ten grondslag ligt aan de verzekerde waarde van de
      op het tijdstip van het indienen van de aanvraag bij het bedrijf of het hoofdkantoor in gebruik zijnde duurzame
      bedrijfsuitrusting.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel4
  - number: '5.1'
    text: |-
      Als projectkosten worden uitsluitend in aanmerking genomen de rechtstreeks aan het project toe te rekenen, na
      de indiening van de aanvraag door de subsidie-ontvanger gemaakte en betaalde kosten van verkrijging van grond,
      bedrijfsgebouwen en duurzame bedrijfsuitrusting, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel5
  - number: 5.1.a
    text: |-
      grond, bedrijfsgebouwen of duurzame bedrijfsuitrusting die de subsidie-ontvanger heeft verkregen van een
      natuurlijke persoon of rechtspersoon die tot hetzelfde concern behoort;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel5
  - number: 5.1.b
    text: niet permanent in het bedrijf aanwezige duurzame bedrijfsuitrusting;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel5
  - number: 5.1.c
    text: |-
      immateriële vaste activa zoals omschreven in [artikel 365 van Boek 2 van het Burgerlijk Wetboek][ref1], daaronder
      niet begrepen legeskosten van bouw- en milieuvergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel365
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '365'
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid, onder a, worden als projectkosten wel in aanmerking genomen de kosten van
      verkrijging van:
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel5
  - number: 5.2.a
    text: bedrijfsgebouwen en duurzame bedrijfsuitrusting die specifiek ten behoeve van het project vervaardigd zijn;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel5
  - number: 5.2.b
    text: duurzame bedrijfsuitrusting die in serie voor de markt geproduceerd wordt;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel5
  - number: 5.2.c
    text: |-
      duurzame bedrijfsuitrusting die verkregen is van een in het buitenland gevestigd natuurlijke persoon of
      rechtspersoon die tot hetzelfde concern behoort.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel5
  - number: '5.3'
    text: |-
      In afwijking van het eerste lid worden als projectkosten wel in aanmerking genomen binnen drie maanden voor
      de indiening van de aanvraag gemaakte kosten van verkrijging van grond of bestaande bedrijfsgebouwen, mits de
      desbetreffende notariële akte tot levering wordt verleden na de indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel5
  - number: '5.4'
    text: |-
      Het vereiste dat de kosten moeten zijn betaald is niet van toepassing op kosten als bedoeld
      in [artikel 6, eerste lid, onder a, 2°, onder b, 3°, en onder c, 3°][ref1], en in
      [artikel 6, derde lid, onder c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011582#Artikel6
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011582
        artikel: '6'
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Als projectkosten worden uitsluitend in aanmerking genomen de volgende kosten, voorzover zij geactiveerd zijn op de
      fiscale balans, de taxatiewaarde niet te boven gaan en, tenzij het betreft grond of duurzame bedrijfsuitrusting die
      door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer met toepassing van artikel 10, derde
      lid, van de Wet op de inkomstenbelasting 1964 is aangewezen, niet binnen twee jaar worden afgeschreven:
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.1.a
    text: 'wat betreft grond:'
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.1.a.1°
    text: de koopsom en overdrachtskosten exclusief de overdrachtsbelasting, of
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.1.a.2°
    text: |-
      de gekapitaliseerde erfpachtcanon inclusief de kosten van vestiging van de erfpacht, indien de grond van een
      gemeente of enig ander van overheidswege opgericht lichaam in erfpacht is verkregen;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.1.b
    text: 'wat betreft bedrijfsgebouwen en de daartoe te rekenen centrale voorzieningen:'
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.1.b.1°
    text: |-
      de koopsom en de overdrachtskosten of de aan derden verschuldigde bouwkosten, exclusief de financieringskosten, de
      overdrachtsbelasting en, indien het bedrijfsgebouw is verkregen van een natuurlijke persoon of rechtspersoon die
      tot hetzelfde concern behoort, de winstopslag;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.1.b.2°
    text: de voortbrengingskosten;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.1.b.3°
    text: |-
      in geval van huurkoop of lease de aanschafwaarde dan wel, indien deze niet kan worden bepaald, de contante waarde
      van de in totaal verschuldigde lease-termijnen inclusief kosten, verdisconteerd op jaarbasis tegen een bij regeling
      van Onze Minister vast te stellen percentage;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.1.c
    text: 'wat betreft duurzame bedrijfsuitrusting:'
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.1.c.1°
    text: |-
      de koopsom, exclusief de winstopslag, indien de duurzame bedrijfsuitrusting verkregen is van een natuurlijke
      persoon of rechtspersoon die tot hetzelfde concern behoort;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.1.c.2°
    text: de voortbrengingskosten;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.1.c.3°
    text: |-
      in geval van huurkoop of lease de aanschafwaarde dan wel, indien deze niet kan worden bepaald, de contante waarde
      van de in totaal verschuldigde lease-termijnen inclusief kosten, verdisconteerd op jaarbasis tegen een bij regeling
      van Onze Minister vast te stellen percentage.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: '6.2'
    text: |-
      Voorzover het betreft gebruikte bedrijfsuitrusting, die verkregen is van een in het buitenland gevestigd
      natuurlijke persoon of rechtspersoon die tot hetzelfde concern behoort, wordt als projectkosten in aanmerking
      genomen de fiscale boekwaarde in het land van herkomst op het tijdstip van levering.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: '6.3'
    text: |-
      Onder voortbrengingskosten als bedoeld in het eerste lid, onder b, 2°, en c, 2°, worden de volgende kosten
      verstaan:
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.3.a
    text: |-
      loonkosten, met dien verstande dat wordt uitgegaan van een uurloon, berekend op basis van het jaarloon bij een
      volledige dienstbetrekking volgens de kolom «loon voor de loonbelasting» van de loonstaat van het betrokken directe
      personeel, verhoogd met de wettelijke dan wel de op grond van een individuele of collectieve arbeidsovereenkomst
      verschuldigde opslagen voor sociale lasten, en van 1600 productieve uren per jaar;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.3.b
    text: |-
      kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen, exclusief winstopslagen
      bij transacties binnen een concern en
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: 6.3.c
    text: een opslag voor algemene kosten, groot 20 procent van de onder a bedoelde loonkosten.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel6
  - number: '7'
    text: |-
      Bij ministeriële regeling wordt ieder begrotingsjaar een subsidieplafond vastgesteld voor het in dat jaar verlenen
      van subsidies krachtens dit besluit. Daarbij kunnen afzonderlijke subsidieplafonds worden vastgesteld voor bepaalde
      categorieën projecten.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel7
  - number: '8'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat bij
      ministeriële regeling wordt vastgesteld. Bij ministeriële regeling kan hiervan vrijstelling worden verleend.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel8
  - number: '9'
    text: Onze Minister geeft een beschikking binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel9
  - number: '10'
    text: 'Onze Minister beslist in ieder geval afwijzend op een aanvraag:'
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel10
  - number: 10.a
    text: indien hij de subsidiabele kosten van het project op minder dan € 4 500 000 raamt;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel10
  - number: 10.b
    text: |-
      in geval bij ministeriële regeling is bepaald dat subsidie zal worden verstrekt voor projecten als bedoeld in
      [artikel 2, tweede lid, onder b, c, of d][ref1], indien hij de subsidiabele kosten op minder dan € 13 600 000,
      € 45 300 000 onderscheidenlijk € 13 600 000 raamt;


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel2
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '2'
        paragraaf: '1'
  - number: 10.c
    text: |-
      in geval bij ministeriële regeling is bepaald dat subsidie zal worden verstrekt voor projecten als bedoeld in
      [artikel 2, tweede lid, onder d][ref1], indien de aanvrager niet heeft aangetoond dat hij met betrekking tot
      de uitvoering van het project binnen concernverband een bestaande of op te richten zusteronderneming heeft die
      met betrekking tot de uitvoering van een soortgelijk project op het grondgebied van een andere lidstaat van de
      Europese Unie een beroep kan doen op een gepubliceerde steunmaatregel van de desbetreffende overheid en dat de
      besluitvorming ten aanzien van de uitvoering van het project is voorbehouden aan de leiding van het concern;


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel2
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '2'
        paragraaf: '1'
  - number: 10.d
    text: |-
      indien ter zake van het project waarop de aanvraag betrekking heeft reeds subsidie is verstrekt vanwege een
      provincie met gebruikmaking van een door het Rijk verstrekte uitkering in het kader van het regionaal beleid,
      bestemd voor stimulering van investeringen door ondernemers;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel10
  - number: 10.e
    text: indien de projectkosten voor minder dan 25 procent met eigen middelen worden gefinancierd;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel10
  - number: 10.f
    text: |-
      indien de verhouding tussen eigen en vreemd vermogen, gezien de rentabiliteit en de aard van het bedrijf, naar
      verwachting niet aanvaardbaar zal zijn nadat na uitvoering van het project de bedrijfsactiviteiten een aanvang
      hebben genomen;
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel10
  - number: 10.g
    text: indien de gewenste structuur van de betrokken sector van het bedrijfsleven zich tegen het project verzet.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de aanvragen, met dien verstande
      dat indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de
      verdeling als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid kan Onze Minister, indien als gevolg van buitenlandse concurrentie ten aanzien
      van de vestigingsplaats spoed is vereist, subsidie verlenen op een aanvraag die nog niet geheel voldoet aan de
      wettelijke voorschriften. In dit geval kan Onze Minister, in afwijking van [artikel 2, eerste lid][ref1], ook
      subsidie verlenen aan een natuurlijke persoon of rechtspersoon die eerst door uitvoering van het project ondernemer
      zal worden.


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel2
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '2'
        paragraaf: '1'
  - number: '12.1'
    text: |-
      Aan de subsidieverlening zijn de in de [artikelen 13][ref1], [14][ref2], [15][ref3] en [16][ref4] opgenomen
      verplichtingen verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011582#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011582#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0011582#Artikel16
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011582
        artikel: '14'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011582
        artikel: '15'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0011582
        artikel: '16'
        paragraaf: '3'
  - number: '12.2'
    text: |-
      De in de [artikelen 12][ref1], [13][ref2], [14][ref3] en [15][ref4] opgenomen verplichtingen gelden tot aan de dag
      waarop de subsidie wordt vastgesteld. De in [artikel 16][ref5] opgenomen verplichting geldt totdat vijf jaren na de
      subsidieverlening zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0011582#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0011582#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0011582#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0011582#Artikel16
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011582
        artikel: '13'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011582
        artikel: '14'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0011582
        artikel: '15'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0011582
        artikel: '16'
        paragraaf: '3'
  - number: '13.1'
    text: |-
      De subsidie-ontvanger voert het project binnen achttien maanden na de subsidieverlening overeenkomstig het
      projectplan waarop de subsidieverlening betrekking heeft uit en verwerft de betrokken bedrijfsgebouwen en
      duurzame bedrijfsuitrusting en stelt deze in bedrijf binnen dezelfde termijn, behoudens voorafgaande schriftelijke
      ontheffing van Onze Minister voor het vertragen, het essentieel wijzigen of het stopzetten van het project.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister geeft op een aanvraag om ontheffing als bedoeld in het eerste lid een beschikking binnen dertien
      weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel13
  - number: '13.3'
    text: Onze Minister kan aan een ontheffing als bedoeld in het eerste lid voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel13
  - number: '14.1'
    text: |-
      De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling niet eerder dan een jaar na het
      tijdstip waarop het project is uitgevoerd, doch uiterlijk achttien maanden nadat het project ingevolge
      [artikel 13, eerste lid][ref1], moet zijn uitgevoerd, bij Onze Minister in.


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel13
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '13'
        paragraaf: '3'
  - number: '14.2'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat bij ministeriële
      regeling wordt vastgesteld. Bij ministeriële regeling kan hiervan vrijstelling worden verleend.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel14
  - number: '14.3'
    text: De aanvraag gaat vergezeld van een accountantsverklaring, overeenkomstig hetgeen in het formulier is vermeld.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel14
  - number: '15.1'
    text: |-
      De subsidie-ontvanger voert een administratie die zodanig is ingericht, dat daaruit te allen tijde op eenvoudige
      en duidelijke wijze alle projectkosten kunnen worden afgelezen, in het bijzonder de bestede en door middel van een
      sluitende tijdschrijving vastgestelde arbeidstijd, de verbruikte materialen en de overige kosten.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel15
  - number: '15.2'
    text: |-
      De subsidie-ontvanger doet onverwijld nadat een verzoek tot het op hem van toepassing verklaren van
      de schuldsaneringsregeling natuurlijke personen, tot verlening van surseance van betaling aan of tot
      faillietverklaring van hem bij de rechtbank is ingediend daarvan mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel15
  - number: '16'
    text: |-
      De subsidie-ontvanger stelt Onze Minister onverwijld in kennis van elk voornemen om van het project deel uitmakende
      duurzame bedrijfsuitrusting, grond of bedrijfsgebouwen in de kosten waarvan op grond van dit besluit subsidie is
      verstrekt af te stoten of buiten gebruik te stellen.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel16
  - number: '17.1'
    text: |-
      Voorschotten kunnen door Onze Minister slechts ten hoogste twee maal, telkens wanneer ten minste 40 procent van de
      geraamde subsidiabele kosten zijn gemaakt, op aanvraag van de subsidie-ontvanger worden verstrekt op een subsidie
      ter zake waarvan een beschikking tot subsidieverlening geldt.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel17
  - number: '17.2'
    text: |-
      Een voorschot wordt berekend naar rato van de gemaakte en betaalde subsidiabele kosten, voor zover deze nog niet
      eerder bij de verstrekking van een voorschot in aanmerking zijn genomen. In totaal zal het bedrag aan voorschotten
      niet groter zijn dan 80 procent van het bij de subsidieverlening vermelde maximale subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel17
  - number: '17.3'
    text: |-
      Bij de toepassing van het eerste en tweede lid wordt de opslag, bedoeld in [artikel 6, derde lid][ref1], geacht
      gemaakt en betaald te zijn voor zover de loonkosten waarover hij wordt berekend zijn gemaakt en betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel6
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '6'
        paragraaf: '1'
  - number: '18'
    text: |-
      Een aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat bij
      ministeriële regeling wordt vastgesteld. Bij ministeriële regeling kan hiervan vrijstelling worden verleend.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel18
  - number: '19'
    text: |-
      Onze Minister kan in ieder geval afwijzend beschikken op een aanvraag, indien de subsidie-ontvanger niet heeft
      voldaan aan ingevolge de subsidieverlening voor hem geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel19
  - number: '20'
    text: |-
      Onze Minister geeft de beschikking tot subsidievaststelling binnen zes maanden na ontvangst van de aanvraag dan wel
      nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel20
  - number: '21'
    text: |-
      Het Besluit subsidies regionale investeringsprojecten wordt ingetrokken, met dien verstande dat het van toepassing
      blijft op aanvragen waarop voor 1 januari 2000 is beslist.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel21
  - number: '22'
    text: |-
      In afwijking van [artikel 5, eerste lid][ref1], worden met betrekking tot projecten waarvoor voorafgaand aan
      de uitvoering van het project en voorafgaand aan de inwerkingtreding van dit besluit bij Onze Minister een
      vooraanmelding is gedaan als projectkosten mede in aanmerking genomen de kosten die zijn gemaakt en betaald na de
      datum van de vooraanmelding.


      [ref1]: https://wetten.overheid.nl/BWBR0011582#Artikel5
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011582
        artikel: '5'
        paragraaf: '1'
  - number: '23'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel23
  - number: '24'
    text: 'Dit besluit wordt aangehaald als: Besluit subsidies regionale investeringsprojecten 2000.'
    url: https://wetten.overheid.nl/BWBR0011582/2009-07-01#Artikel24
