preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 21 juli 1999, nr. 1999/30045(4754),
    directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op artikel 4.5, tweede en derde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek, artikel
    14 van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek en artikel 125, eerste lid, van de
    Ambtenarenwet;

    De Raad van State gehoord (advies van 3 september 1999, nr. W05.99.0409/III);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen, uitgebracht mede namens Onze
    Minister van Landbouw, Natuurbeheer en Visserij, van 30 november 1999, nr. 1999/37735(4754), directie Wetgeving en
    Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: 1.a
    text: |-
      *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschappen en, voor zover het betreft het onderwijs op
      het gebied van landbouw en natuurlijke omgeving, Onze Minister van Landbouw, Natuurbeheer en Visserij;
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: 1.b
    text: '*instelling:* een universiteit, een hogeschool of een onderzoekinstelling;'
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: 1.c
    text: |-
      *universiteit:*een universiteit die is opgenomen in [onderdeel a of b van de bijlage van de Wet op het hoger
      onderwijs en wetenschappelijk onderzoek](onbekend), alsmede de Open Universiteit;
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: 1.d
    text: |-
      *hogeschool:*een hogeschool die is opgenomen in [onderdeel c, e of g van de bijlage van de Wet op het hoger
      onderwijs en wetenschappelijk onderzoek](onbekend);
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: 1.e
    text: |-
      *onderzoekinstelling:*de Koninklijke Nederlandse Akademie van Wetenschappen
      te Amsterdam en de Koninklijke Bibliotheek te 's-Gravenhage, genoemd in
      [artikel 1.2, onder d, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],
      alsmede de Nederlandse organisatie voor wetenschappelijk onderzoek, genoemd in
      [artikel 2 van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004191#Artikel2
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004191
        artikel: '2'
  - number: 1.f
    text: |-
      *personeel:*de personen die in dienst zijn van de instelling, daaronder niet begrepen leden van colleges van
      bestuur, centrale directies of algemene besturen;
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: 1.g
    text: '*bestuur:*'
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: 1.g.1
    text: 'van een universiteit: het college van bestuur;'
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: 1.g.2
    text: 'van een openbare hogeschool: de centrale directie of het college van bestuur;'
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: 1.g.3
    text: |-
      van een bijzondere hogeschool: het instellingsbestuur, dan wel het college van bestuur, indien de statuten van de
      rechtspersoon waarvan de bijzondere hogeschool uitgaat, bepalen dat het college optreedt als instellingsbestuur;
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: 1.g.4
    text: 'van een onderzoekinstelling: het algemeen bestuur;'
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: 1.h
    text: '*deelgebied:*de gezamenlijke universiteiten, de gezamenlijke hogescholen of de gezamenlijke onderzoekinstellingen.'
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel1
  - number: '2.1'
    text: |-
      De bepalingen van dit besluit zijn regels voor onderzoekinstellingen en voor openbare universiteiten en
      hogescholen, alsmede voorwaarden voor bekostiging van bijzondere universiteiten en hogescholen.
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel2
  - number: '2.2'
    text: Het personeel en het gewezen personeel zijn belanghebbend in de zin van dit besluit.
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel2
  - number: '2.3'
    text: |-
      Het bestuur of diens rechtsopvolger is gehouden de aanspraken van het personeel en het gewezen personeel die
      uit de wet voortvloeien of krachtens dit besluit worden vastgesteld dan wel bij of krachtens dit besluit worden
      gehandhaafd, te honoreren.
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel2
  - number: '2.4'
    text: |-
      Indien een rechtsopvolger als bedoeld in het derde lid ontbreekt, waaronder tevens is begrepen het geval van
      een onherroepelijk vonnis tot faillietverklaring van de desbetreffende instelling, voorzien de besturen in het
      desbetreffende deelgebied er gezamenlijk in dat aan de verplichtingen van het derde lid jegens het personeel en het
      gewezen personeel wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel2
  - number: '3'
    text: |-
      Voor de uitkomsten van het functiewaarderingssysteem geldt, wat de hoogste functies van het personeel van een
      instelling betreft, als uitgangspunt dat aan deze functies ten hoogste een salarisschaal is verbonden waarvan
      het hoogste bedrag overeenkomt met het maximum salarisbedrag van schaal 18 van bijlage 1A van het Kaderbesluit
      rechtspositie personeel universiteiten en onderzoekinstellingen en bijlage 1A van het Kaderbesluit rechtspositie
      HBO, zoals die luidden op 31 december 1998. Dit maximum kan worden bijgesteld aan de hand van de algemene
      salarisontwikkeling die voor het personeel in een deelgebied wordt overeengekomen.
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel3
  - number: '4'
    text: |-
      Bij de vaststelling van de regels voor uitkeringen wegens werkloosheid draagt het bestuur er zorg voor dat de
      aanspraken van het personeel en het gewezen personeel ten minste gelijk, doch in elk geval ten minste gelijkwaardig
      zijn aan de aanspraken die het personeel zou hebben op grond van de [Werkloosheidswet][ref1]. Het bestuur handhaaft
      hierbij tevens de aanspraken van het gewezen personeel die aan dat personeel zijn gegarandeerd bij of krachtens de
      regelingen die volgens dit besluit komen te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '5'
    text: |-
      Bij de vaststelling van de regels voor uitkeringen wegens ziekte en arbeidsongeschiktheid draagt het bestuur er
      zorg voor dat de aanspraken van het personeel en het gewezen personeel ten minste gelijk, doch in elk geval ten
      minste gelijkwaardig zijn aan de aanspraken die het personeel zou hebben op grond van de [Ziektewet][ref1] en de
      [Wet uitbreiding loondoorbetalingsplicht bij ziekte][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0007892
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0007892
  - number: '12'
    text: Het Rechtspositiereglement wetenschappelijk onderwijs en onderzoek wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel12
  - number: '14'
    text: Het Kaderbesluit rechtspositie personeel universiteiten en onderzoekinstellingen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel14
  - number: '16.1'
    text: |-
      In afwijking van [paragraaf  3][ref1] blijven tot het tijdstip waarop het bestuur regels als bedoeld in
      [artikel 4.5 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] heeft vastgesteld, de op de
      dag voorafgaande aan de datum van inwerkingtreding van dit besluit geldende regels terzake van toepassing op het
      personeel van de instellingen. De uit die regels voortvloeiende aanspraken van het personeel gelden daarbij jegens
      het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0010940#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel4
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010940
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '4'
  - number: '16.2'
    text: |-
      In afwijking van het eerste lid geldt als tijdstip waarop de regels van het Kaderbesluit rechtspositie HBO en het
      Kaderbesluit rechtspositie personeel universiteiten en onderzoekinstellingen voor de toepassing van het eerste lid
      zijn gefixeerd: 31 december 1998.
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel16
  - number: '17'
    text: |-
      In afwijking van [paragraaf 3][ref1] blijven tot het tijdstip waarop het bestuur regels als bedoeld in de
      [artikelen 4][ref2] en [5][ref3] heeft vastgesteld, de op de dag voorafgaande aan de datum van inwerkingtreding
      van dit besluit geldende regels terzake van toepassing op het personeel en het gewezen personeel van de
      instellingen. De uit die regels voortvloeiende aanspraken van het personeel en het gewezen personeel gelden daarbij
      jegens het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0010940#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0010940#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010940#Artikel5
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0010940
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010940
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0010940
        artikel: '5'
        paragraaf: '2'
  - number: '18'
    text: |-
      In afwijking van [artikel 11][ref1] blijft tot het tijdstip waarop het bestuur
      regels heeft gesteld voor tegemoetkoming in ziektekosten en inkomenstoeslag, het
      [Besluit tegemoetkoming ziektekosten en inkomenstoeslag onderwijs- en onderzoekpersoneel][ref2], zoals dat luidde
      op de dag voorafgaande aan de datum van inwerkingtreding van dit besluit, van toepassing op het personeel van
      de instellingen. De uit dat besluit voortvloeiende aanspraken van het personeel en het gewezen personeel gelden
      daarbij jegens het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0010940#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007326
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0010940
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007326
  - number: '19'
    text: |-
      In afwijking van [artikel 15][ref1] blijft tot het tijdstip waarop het bestuur regels heeft gesteld voor de
      ziektekostenvoorziening, de [Regeling ziektekostenvoorziening onderwijs en onderzoekpersoneel][ref2], zoals die
      luidde op de dag voorafgaande aan de datum van inwerkingtreding van dit besluit, van toepassing op het personeel
      en het gewezen personeel van de instellingen. De uit dat besluit voortvloeiende aanspraken van het personeel en het
      gewezen personeel gelden daarbij jegens het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0010940#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008816
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010940
        artikel: '15'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008816
  - number: '20'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst, en werkt, met uitzondering van de [artikelen 7 tot en met 11][ref1], [13][ref2] en [15][ref3], terug tot
      en met 1 januari 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0010940#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010940#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0010940#Artikel15
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel20
    references:
