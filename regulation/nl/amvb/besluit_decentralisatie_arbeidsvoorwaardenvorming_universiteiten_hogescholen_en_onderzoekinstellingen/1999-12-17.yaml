      - id: ref3
        bwb_id: BWBR0010940
        artikel: '15'
        paragraaf: '3'
  - number: '21'
    text: |-
      Dit besluit wordt aangehaald als: Besluit decentralisatie arbeidsvoorwaardenvorming universiteiten, hogescholen
      en onderzoekinstellingen.
    url: https://wetten.overheid.nl/BWBR0010940/1999-12-17#Artikel21
