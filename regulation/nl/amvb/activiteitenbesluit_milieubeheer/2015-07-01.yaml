    text: |-
      1 [Artikel 3.23b, eerste lid][ref1], is tot 1 januari 2016 niet van toepassing op een inrichting waar het wassen
      van motorvoertuigen of werktuigen plaatsvindt waarmee geen gewasbeschermingsmiddelen zijn toegepast, indien op die
      inrichtingen onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van dat artikellid het Besluit landbouw
      milieubeheer van toepassing was.

      2 Het wassen van motorvoertuigen of werktuigen waarmee geen gewasbeschermingsmiddelen zijn toegepast in een
      inrichting als bedoeld in het eerste lid, vindt plaats boven een bodembeschermende voorziening.

      3 Het lozen van afvalwater afkomstig van een bodembeschermende voorziening als bedoeld in het tweede lid, vindt
      plaats in een vuilwaterriool, waarbij ten minste wordt voldaan aan [artikel 3.23c][ref2].


