      b. de in de periode tussen 07.00 en 19.00 uur in tabel 2.17a opgenomen maximale geluidsniveaus L niet van
      toepassing zijn op laad- en losactiviteiten;

      c. de in tabel 2.17a aangegeven waarden binnen in- of aanpandige gevoelige gebouwen niet gelden indien de gebruiker
      van deze gevoelige gebouwen geen toestemming geeft voor het in redelijkheid uitvoeren of doen uitvoeren van
      geluidsmetingen;

      d. de in tabel 2.17a aangegeven waarden op de gevel ook gelden bij gevoelige terreinen op de grens van het terrein,
      met dien verstande dat de waarden in geval van ligplaatsen, bestemd om te worden ingenomen door een woonschip als
      bedoeld in [artikel 1.2, derde lid, onderdeel b, van het Besluit geluidhinder][ref1], slechts gelden voor zover
      deze ligplaatsen als zodanig zijn bestemd op of na 1 juli 2012 en niet daarvoor in een gemeentelijke verordening
      waren aangewezen om door een woonschip te worden ingenomen;

      e. de in tabel 2.17a aangegeven waarden op de gevel, vermeerderd met 5 dB(A), ook gelden op de grens van
      het terrein in geval van ligplaatsen, bestemd om te worden ingenomen door een woonschip als bedoeld in
      [artikel 1.2, derde lid, onderdeel b, van het Besluit geluidhinder][ref2], voor zover deze ligplaatsen:

      1°. als zodanig zijn bestemd voor 1 juli 2012, of

      2°. voor 1 juli 2012 in een gemeentelijke verordening waren aangewezen om door een woonschip te worden ingenomen en
      voor 1 juli 2022 als zodanig zijn bestemd;

      f. de waarden in in- en aanpandige gevoelige gebouwen slechts gelden in geluidsgevoelige ruimten en
      verblijfsruimten; en

      g. de in tabel 2.17a aangegeven waarden niet gelden op gevoelige objecten die zijn gelegen op een gezoneerd
      industrieterrein.

      2 Ten aanzien van een inrichting die is gelegen op een gezoneerd industrieterrein, waarbij binnen een afstand van
      50 meter geen gevoelige objecten, anders dan gevoelige objecten gelegen op het gezoneerde industrieterrein, zijn
      gelegen, bedraagt in afwijking van het eerste lid, het langtijdgemiddeld beoordelingsniveau (L) veroorzaakt door
      de in de inrichting aanwezige installaties en toestellen, alsmede door die inrichting verrichte werkzaamheden en
      activiteiten niet meer dan de in tabel 2.17b bij het betreffende tijdstip aangegeven waarde.


