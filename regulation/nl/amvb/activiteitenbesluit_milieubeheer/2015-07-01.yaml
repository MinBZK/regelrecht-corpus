        afdeling: '3.5'
  - number: '3.87'
    text: |-
      1 Bij het lozen van afvalwater in een oppervlaktewaterlichaam, op of in de bodem of in een vuilwaterriool als
      gevolg van de teelt van gewassen in substraat wordt voldaan aan het tweede tot en met negende lid.

      2 Het lozen van afvalwater afkomstig van de teelt van gewassen op een niet-doorlatende ondergrond is toegestaan,
      indien:

      a. bij een teeltoppervlak van ten hoogste 500 vierkante meter bij bemesting uitsluitend gebruik wordt gemaakt van
      meststoffen die over langere periode de werkzame bestanddelen afgeven.

      b. bij een teeltoppervlak van meer dan 500 vierkante meter:

      1°. hemelwater en drainwater worden opgevangen in een opvangvoorziening van ten minste 1.200 kubieke meter per
      hectare teeltoppervlak;

      2°. het water uit de opvangvoorziening wordt gebruikt als eerste gietwaterbron, en

      3°. de bedrijfsvoering erop is gericht om na bemesting of bespuiting de eerste 50 kubieke meter hemelwater per
      hectare teeltoppervlak te allen tijde op te kunnen vangen in de opvangvoorziening.

      3 In afwijking van het tweede lid, onderdeel b, onder 1°, kan worden volstaan met een opvangvoorziening met een
      capaciteit van ten minste 500 kubieke meter per hectare teeltoppervlak, indien aanvullend gietwater wordt gebruikt
      met een natriumgehalte dat gelijkwaardig is aan dat van hemelwater.

      4 Indien de capaciteit van de opvangvoorziening, bedoeld in het tweede en derde lid, volledig is benut wordt het
      hemelwater geloosd via een overstortvoorziening, die is aangebracht voorafgaand aan de opvangvoorziening.

      5 In afwijking van het tweede en derde lid wordt bij de buitenteelt van aardbeienplanten op trayvelden drainwater
      opgevangen en hergebruikt en is de bedrijfsvoering erop gericht dat na bemesting of bespuiting de eerste 30 kubieke
      meter hemelwater per hectare teeltoppervlak wordt opgevangen en hergebruikt.

      6 Bij het lozen van afvalwater als gevolg van de teelt op een doorlatende ondergrond, wordt bij bemesting
      uitsluitend gebruik gemaakt van meststoffen die over langere periode de werkzame bestanddelen afgeven.

      7 In afwijking van het zesde lid kan het bevoegd gezag gedurende de perioden dat het gebruik van de in dat
      lid bedoelde meststoffen redelijkerwijs niet mogelijk is bij de teelt van aardbeienplanten op trayvelden, bij
      maatwerkvoorschrift het gebruik van andere meststoffen toestaan, indien het aanbrengen van een niet-doorlatende
      ondergrond redelijkerwijs niet mogelijk is en het belang van de bescherming van het milieu zich daartegen niet
      verzet.

      8 In afwijking van het zesde lid is bij de teelt waarbij bemesting plaatsvindt via een druppelsysteem, het gebruik
      van meststoffen als bedoeld in dat lid, niet verplicht, indien de watergift en de meststoffengift zijn afgestemd op
      de behoefte van het gewas, waarbij rekening is gehouden met de relevante specifieke teeltomstandigheden.

      9 Het bevoegd gezag kan bij de teelt op een doorlatende ondergrond, waarbij door middel van een drainagesysteem
      op een oppervlaktewaterlichaam wordt geloosd, indien de bescherming van het milieu daartoe noodzaakt, bij
      maatwerkvoorschrift bepalen dat het drainagewater wordt opgevangen en hergebruikt.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.87
  - number: '3.88'
    text: |-
      1 Bij de teelt van gewassen op stellingen of in een gotensysteem wordt drainwater opgevangen en hergebruikt.

      2 In afwijking van het eerste lid kan het bevoegd gezag bij maatwerkvoorschrift bepalen dat hergebruik van
      drainwater niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.88
  - number: '3.89'
    text: Deze paragraaf is van toepassing op de waterbehandeling voor agrarische activiteiten.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.89
  - number: '3.90'
    text: |-
      1 Bij het lozen van het afvalwater afkomstig van het voor de waterbehandeling voor agrarische activiteiten zuiveren
      van water door omgekeerde osmose of ionenwisselaars, wordt ten minste voldaan aan het tweede tot en met vijfde lid.

      2 Het lozen in een vuilwaterriool is verboden.

      3 Het bevoegd gezag kan bij maatwerkvoorschrift of bij verordening bepalen dat het tweede lid niet van toepassing
      is en het lozen in het vuilwaterriool toestaan, indien het belang van de bescherming van het milieu zich niet tegen
      het lozen in een vuilwaterriool verzet. [Artikel 2.2, vierde lid][ref1], is van overeenkomstige toepassing.

      4 Het lozen in een oppervlaktewaterlichaam is toegestaan, indien het gehalte aan:

      a. chloride ten hoogste 200 milligram per liter bedraagt;

      b. ijzer ten hoogste 2 milligram per liter bedraagt.

      5 Indien het belang van de bescherming van het milieu zich daartegen niet verzet, kan het bevoegd gezag bij
      maatwerkvoorschrift of bij verordening bepalen dat de gehalten bedoeld in het vierde lid niet van toepassing zijn
      en kunnen hogere gehalten worden vastgesteld.

      6 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.90
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.2'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '3.91'
    text: |-
      1 Het lozen van afvalwater als gevolg van het voor agrarische activiteiten zuiveren van water door het ontijzeren
      van grondwater in een oppervlaktewaterlichaam is toegestaan, indien ten minste:

      a. het perceel waar het afvalwater vrijkomt niet is aangesloten op een vuilwaterriool waarop geloosd kan worden
      en de afstand tot het dichtstbijzijnde vuilwaterriool of zuiveringtechnisch werk waarop kan worden aangesloten en
      geloosd, meer dan 40 meter bedraagt, en

      b. bij het lozen het gehalte aan ijzer in het afvalwater ten hoogste 5 milligram per liter bedraagt.

      2 De afstand, genoemd in het eerste lid, onderdeel a, wordt berekend:

      a. vanaf de kadastrale grens van het perceel waar het afvalwater vrijkomt, en

      b. langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.

      3 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.91
  - number: '3.92'
    text: |-
      Deze paragraaf is van toepassing op het voor agrarische activiteiten aanmaken van gewasbeschermingsmiddelen,
      biociden of bladmeststoffen of het transporteren daarvan via vaste leidingen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.92
  - number: '3.93'
    text: |-
      1 Bij het uit een oppervlaktewaterlichaam vullen van apparatuur waarin gewasbeschermingsmiddelen, biociden
      of bladmeststoffen worden aangemaakt, wordt een voorziening getroffen die terugstroming van het mengsel van
      gewasbeschermingsmiddelen, biociden of bladmeststoffen en water voorkomt.

      2 Bij het vullen van apparatuur waarin gewasbeschermingsmiddelen, biociden of bladmeststoffen worden aangemaakt,
      die niet is opgesteld boven een bodembeschermende voorziening, bevindt de apparatuur zich op een afstand van ten
      minste twee meter van de insteek van een oppervlaktewaterlichaam.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.93
  - number: '3.94'
    text: |-
      Bij het in een inrichting aanmaken van gewasbeschermingsmiddelen, biociden of bladmeststoffen of het transporteren
      via vaste leidingen wordt ten behoeve van:

      a. het realiseren van een verwaarloosbaar bodemrisico;

      b. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van het
      grondwater, of

      c. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan;

      ten minste voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.94
  - number: '3.95'
    text: |-
      Het lozen van afvalwater als gevolg van het inwendig reinigen van apparatuur voor het aanmaken van
      gewasbeschermingsmiddelen of als gevolg van het inwendig reinigen van vaste transportleidingen voor het transport
      van gewasbeschermingsmiddelen in een vuilwaterriool is verboden.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.95
  - number: '3.96'
    text: |-
      De [artikelen 3.97][ref1] en [3.98][ref2] zijn van toepassing op het voor agrarische activiteiten toepassen van
      gewasbeschermingsmiddelen of biociden in dompelbaden en douche-installaties.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.97
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.98
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.96
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3.97'
        hoofdstuk: '3'
        paragraaf: 3.5.6
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3.98'
        hoofdstuk: '3'
        paragraaf: 3.5.6
        afdeling: '3.5'
  - number: '3.97'
    text: |-
      Het lozen van afvalwater uit dompelbaden en douche-installaties waarin gewasbeschermingsmiddelen of biociden zijn
      toegepast in een vuilwaterriool is verboden.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.97
  - number: '3.98'
    text: |-
      Bij het toepassen van gewasbeschermingsmiddelen of biociden in dompelbaden en douche-installaties wordt, ten
      behoeve van het realiseren van een verwaarloosbaar bodemrisico, ten minste voldaan aan de bij ministeriële regeling
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.98
  - number: '3.99'
    text: |-
      [Artikel 3.100][ref1] is van toepassing op het spoelen van fusten en verpakkingsmateriaal waarin gewassen zijn
      opgeslagen voor agrarische activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.100
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.99
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3.100'
        hoofdstuk: '3'
        paragraaf: 3.5.6
        afdeling: '3.5'
  - number: '3.100'
    text: |-
      1 Bij het lozen van afvalwater als gevolg van het spoelen van fusten en verpakkingsmateriaal waarin gewassen zijn
      opgeslagen voor agrarische activiteiten, wordt ten minste voldaan aan het tweede tot en met vijfde lid.

      2 Bij het lozen van afvalwater in een vuilwaterriool is het gehalte aan onopgeloste stoffen ten hoogste 300
      milligram per liter.

      3 Het lozen van afvalwater op onverharde bodem is toegestaan, indien het perceel waar het afvalwater vrijkomt
      niet is aangesloten op een vuilwaterriool waarop geloosd kan worden en de afstand tot het dichtstbijzijnde
      vuilwaterriool of zuiveringtechnisch werk waarop kan worden aangesloten en geloosd meer dan 40 meter bedraagt.

      4 De afstand, genoemd in het derde lid, wordt berekend:

      a. vanaf de kadastrale grens van het perceel waar het afvalwater vrijkomt, en

      b. langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.

      5 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.100
  - number: '3.101'
    text: |-
      De [artikelen 3.102][ref1] en [3.103][ref2] zijn van toepassing op het spoelen van gewassen bij agrarische
      activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.102
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.103
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.101
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3.102'
        hoofdstuk: '3'
        paragraaf: 3.5.6
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3.103'
        hoofdstuk: '3'
        paragraaf: 3.5.6
        afdeling: '3.5'
  - number: '3.102'
    text: |-
      1 Bij het lozen van afvalwater afkomstig van het spoelen van gewassen wordt ten minste voldaan aan het tweede tot
      en met het elfde lid.

      2 Het spoelproces is onderverdeeld in voorspoelen en naspoelen, waarbij de uitsleep van water uit het voorspoelen
      zo veel mogelijk wordt voorkomen en de hoeveelheid naspoelwater wordt geminimaliseerd.

      3 Binnen het spoelproces vindt hergebruik van spoelwater plaats.

      4 Er wordt uitsluitend naspoelwater geloosd dat niet kan worden benut voor hergebruik.

      5 Bij het lozen in het vuilwaterriool bedraagt het gehalte aan onopgeloste stoffen in enig steekmonster ten hoogste
      300 milligram per liter.

      6 Het lozen van afvalwater in een oppervlaktewaterlichaam is toegestaan, indien:

      a. het perceel waar het afvalwater vrijkomt niet is aangesloten op een vuilwaterriool waarop geloosd kan worden;

      b. de afstand tot het dichtstbijzijnde vuilwaterriool of zuiveringtechnisch werk waarop kan worden aangesloten en
      geloosd meer dan 40 meter bedraagt, en

      c. het gehalte aan onopgeloste stoffen in enig steekmonster ten hoogste 100 milligram per liter bedraagt.

      7 De afstand, genoemd in het zesde lid, wordt berekend:

      a. vanaf de kadastrale grens van het perceel waar het afvalwater vrijkomt, en

      b. langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.

      8 Bij het lozen van afvalwater op of in de bodem wordt het naspoelwater gelijkmatig verspreid over de onverharde
      bodem, waarop de gewassen, bedoeld in het eerste lid, zijn geteeld.

      9 Het tweede, derde en vierde lid, zijn niet van toepassing op het spoelen van:

      a. prei, indien voorafgaand aan het spoelen de vervuiling met de buitenste bladeren van het gewas is verwijderd, of

      b. asperges.

      10 Indien het lozen van afvalwater plaatsvindt in een niet aangewezen oppervlaktewaterlichaam kan het bevoegd gezag
      aan het spoelproces bij maatwerkvoorschrift aanvullende eisen stellen, indien de bescherming van het milieu daartoe
      noodzaakt.

      11 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.102
  - number: '3.103'
    text: |-
      Bij het spoelen van bloembollen met een spoelmachine wordt, ten behoeve van het realiseren van een verwaarloosbaar
      bodemrisico, ten minste voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.103
  - number: '3.104'
    text: |-
      [Artikel 3.105][ref1] is van toepassing op het sorteren en transporteren van gewassen, die niet uitsluitend of in
      hoofdzaak afkomstig zijn van activiteiten van derden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.105
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3.105'
        hoofdstuk: '3'
        paragraaf: 3.5.6
        afdeling: '3.5'
  - number: '3.105'
    text: |-
      1 Bij het lozen van afvalwater afkomstig van het sorteren en transporteren van gewassen, wordt ten minste voldaan
      aan het tweede tot en met vijfde lid.

      2 Het lozen van afvalwater in een oppervlaktewaterlichaam is toegestaan, indien:

      a. het afvalwater afkomstig is van het sorteren en transporteren van uitsluitend biologisch geteelde gewassen;

      b. het gehalte aan onopgeloste stoffen in het te lozen afvalwater ten hoogste 100 milligram per liter bedraagt, en

      c. in het te lozen afvalwater het chemisch zuurstofverbruik ten hoogste 300 milligram per liter en het biologisch
      zuurstofverbruik ten hoogste 60 milligram per liter bedraagt.

      3 Het lozen van afvalwater op of in de bodem is toegestaan, indien het water gelijkmatig wordt verspreid over het
      land waarop een gewas wordt geteeld dat gelijk of soortgelijk is aan het gewas waarvan het afvalwater afkomstig is.

      4 Het lozen van afvalwater in een vuilwaterriool is verboden, tenzij het afvalwater afkomstig is van het sorteren
      en transporteren van uitsluitend biologisch geteelde gewassen.

      5 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.105
  - number: '3.106'
    text: |-
      1 Deze paragraaf is van toepassing op het composteren van groenafval, dat is ontstaan bij werkzaamheden die buiten
      de inrichting zijn verricht door degene die de inrichting drijft of dat niet afkomstig is van buiten de inrichting,
      voor zover geen sprake is van gevaarlijke afvalstoffen, met een volume van ten hoogste 600 kubieke meter.

      2 De [artikelen 3.107 tot en met 3.109][ref1] zijn niet van toepassing op het composteren van groenafval, van ten
      hoogste 3 kubieke meter.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.107
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3.107'
        hoofdstuk: '3'
        paragraaf: 3.5.7
        afdeling: '3.5'
  - number: '3.107'
    text: |-
      1 Voor het realiseren van een goede afbraak wordt een composteringshoop ten minste zo vaak omgezet als nodig is om
      anaërobe afbraak te voorkomen.

      2 Een composteringshoop bevat ten hoogste 50% aan hulpstoffen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.107
  - number: '3.108'
    text: |-
      1 Het composteren vindt plaats op ten minste:

      a. 100 meter afstand tot een geurgevoelig object, dat binnen de bebouwde kom is gelegen, of

      b. 50 meter afstand tot een geurgevoelig object, dat buiten de bebouwde kom is gelegen.

      2 De afstanden, genoemd in het eerste lid, worden gemeten vanaf de buitenzijde van het geurgevoelig object tot het
      dichtstbijzijnde punt van de locatie waar het composteren plaatsvindt.

      3 Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt, met inachtneming van
      de NeR, bij maatwerkvoorschrift eisen stellen aan:

      a. de situering van de composteringshoop, of

      b. het afdekken van de composteringshoop.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.108
  - number: '3.109'
    text: |-
      Bij het composteren wordt, ten behoeve van het realiseren van een verwaarloosbaar bodemrisico, voldaan aan de bij
      ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.109
  - number: '3.110'
    text: |-
      Een composteringshoop is gelegen op een afstand van ten minste 5 meter vanaf de insteek van een
      oppervlaktewaterlichaam.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.110
  - number: '3.111'
    text: |-
      1 De [artikelen 3.112 tot en met 3.129][ref1] zijn van toepassing op het houden van landbouwhuisdieren.

      2 De [artikelen 3.113 tot en met 3.126][ref2] zijn niet van toepassing op:

      a. inrichtingen waar minder dan 10 schapen, 5 paarden, 10 geiten, 25 stuks pluimvee, 25 konijnen of 10 overige
      landbouwhuisdieren worden gehouden;

      b. kinderboerderijen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.112
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.113
