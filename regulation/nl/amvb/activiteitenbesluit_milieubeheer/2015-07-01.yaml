        afdeling: '4.5'
  - number: '4.71'
    text: |-
      1 Het afvalwater bevat in enig steekmonster niet meer dan 20 milligram olie per liter.

      2 In afwijking van het eerste lid bedraagt het gehalte aan olie ten hoogste 200 milligram per liter in enig
      steekmonster indien het afvalwater wordt geleid door een olie-afscheider die voldoet aan en wordt gebruikt conform
      NEN-EN 858-1 en 2.

      3 Het te lozen afvalwater, bedoeld in het eerste en het tweede lid, kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.71
  - number: '4.72'
    text: |-
      1 Het lozen van metalen en hulpstoffen wordt beperkt door toepassing van beste beschikbare technieken.

      2 Het gebruik van kwik is verboden.

      3 Ter beperking van het lozen van metalen en hulpstoffen wordt ten minste voldaan aan de bij ministeriële regeling
      te stellen eisen daaromtrent.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.72
  - number: '4.73'
    text: |-
      1 Onverminderd [artikel 4.72][ref1] worden bij het lozen van afvalwater dat vrijkomt bij een of meer processen als
      bedoeld in de [paragrafen 4.5.7][ref2], [4.5.8][ref3], [4.5.10][ref4] en [4.5.11][ref5], de emissiegrenswaarden
      genoemd in kolom A van tabel 4.73 niet overschreden.


