    text: |-
      In afwijking van [artikel 3.58][ref1] is, indien assimilatiebelichting met een verlichtingssterkte van minder dan
      15.000 lux wordt toegepast, tot 1 januari 2017 gedurende de donkerteperiode die toepassing niet toegestaan, tenzij
      de bovenzijde op een zodanige wijze is afgeschermd dat de lichtuitstraling met ten minste 95% wordt gereduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.58
