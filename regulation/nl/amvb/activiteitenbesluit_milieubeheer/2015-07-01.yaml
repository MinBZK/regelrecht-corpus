  - number: 4.94ga
    text: Deze paragraaf is van toepassing op het reinigen of wassen van textiel.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.94ga
  - number: '4.95'
    text: |-
      1 Het reinigen van textiel vindt voor zover daar chemische stoffen bij worden gebruikt, uitsluitend plaats met
      behulp van PER of niet-gechloreerde alifatische koolwaterstoffen.

      2 Bij ministeriële regeling kunnen andere stoffen dan genoemd in het eerste lid, worden aangewezen.

      3 Degene die een inrichting drijft waarin activiteiten worden uitgeoefend als bedoeld in het eerste lid, voert een
      oplosmiddelenboekhouding, overeenkomstig de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.95
  - number: '4.96'
    text: |-
      1 Bij het reinigen of wassen van textiel is de immissieconcentratie van PER in een besloten ruimte van een gevoelig
      object, die geen deel uitmaakt van de inrichting, per week gemiddeld niet meer dan 0,25 milligram per normaal
      kubieke meter.

      2 Het eerste lid is niet van toepassing indien de gebruiker van een ruimte als bedoeld in dat lid geen toestemming
      geeft voor het verrichten van een meting als bedoeld in dat lid.

      3 Bij het reinigen of wassen van textiel is de immissieconcentratie van PER ter plaatse van gevoelige objecten en
      niet tot de inrichting behorende balkons, terrassen of tuinen, per jaar gemiddeld niet meer dan 0,25 milligram per
      normaal kubieke meter.

      4 Voor het bepalen van de immissieconcentratie van PER, bedoeld in het eerste of derde lid, wordt de methode met
      absorptiemateriaal of de methode met continu registrerende meetapparatuur toegepast.

      5 In afwijking van [artikel 1.1][ref1] wordt voor de toepassing van dit artikel verstaan onder gevoelig object:
      een gebouw of een gedeelte van een gebouw dat bestemd is voor het verblijf van personen of een object, gebouw of
      terrein dat bestemd is voor verblijfs- of dagrecreatie, niet zijnde een kampeerterreinen voor ten hoogste vijftien
      kampeermiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.96
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1.1'
        hoofdstuk: '1'
        paragraaf: 1.1.1
        afdeling: '1.1'
  - number: '4.97'
    text: |-
      1 Bij het meten van de immissieconcentratie van PER in de binnenlucht in een besloten ruimte van een gevoelig
      object, die geen deel uitmaakt van de inrichting, bedoeld in [artikel 4.96, vierde lid][ref1], door middel van de
      methode met absorptiemateriaal zijn het tweede tot en met vijftiende lid van toepassing.

      2 Voor de metingen wordt gebruik gemaakt van monsterneming door middel van adsorptiemateriaal in buisjes of badges.

      3 De toe te passen buisjes of badges hebben een detectielimiet van 0,1 milligram per normaal kubieke meter of lager
      en zijn volgens de schriftelijke verklaring van de fabrikant of leverancier geschikt voor de toepassing bij deze
      meetmethode.

      4 Bij de toepassing van buisjes of badges de door de fabrikant of leverancier opgestelde gebruiksvoorschriften
      worden in acht genomen.

      5 De bemonstering van de binnenlucht kan zowel passief als actief plaatsvinden. In geval van actieve bemonstering
      vindt deze plaats met een daartoe geschikte pomp.

      6 De gasconcentratie in de binnenlucht wordt na analyse van de koolbuisjes berekend uit het quotiënt van de
      aangetroffen hoeveelheid PER in de bemonstering en het totaal doorgezogen luchtvolume.

      7 De te bemonsteren ruimte is een ruimte waar personen verblijven of werkzaam zijn en direct grenst aan de
      inrichting.

      8 De plaats van monsterneming wordt vrij in de betreffende ruimte gepositioneerd op een zodanige plaats dat gassen
      kunnen worden bemonsterd. De afstand tussen die plaats en een vloer, een wand en het plafond van de te bemonsteren
      ruimte is ten minste 50 centimeter.

      9 De buisjes of badges zijn gedurende de voorgeschreven meettijd in de ruimte op dezelfde plek aanwezig.

      10 Gedurende de bemonsteringsperiode mag in de te bemonsteren ruimte geen gebruik worden gemaakt van
      oplosmiddelhoudende materialen.

      11 Het al dan niet aanwezig zijn van personen, de duur van die aanwezigheid en de wijze van ventileren en de duur
      daarvan gedurende een meting in de ruimte worden in een verslag vastgelegd.

      12 De meettijd bedraagt ten minste één week.

      13 Met de buisjes of badges wordt een gemiddelde immissieconcentratie gemeten over de meetperiode.

      14 De gemeten of de berekende immissieconcentratie mag uitsluitend voor de gevoelige objecten worden gecorrigeerd
      met de expositieduur, op basis van de gemiddelde verblijfstijd in zodanig object die redelijkerwijs mag worden
      verondersteld.

      15 Van een meting wordt een verslag gemaakt dat op het eerste verzoek van het bevoegd gezag wordt overgelegd en
      gedurende ten minste twee jaren na de eerstvolgende meting in de inrichting wordt bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.96
