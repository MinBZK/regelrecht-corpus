  - number: 6.21a
    text: |-
      1 In verband met een windturbine of een combinatie van windturbines waarvoor onmiddellijk voorafgaand aan het
      tijdstip van inwerkingtreding van [artikel 3.14a][ref1] een vergunning in werking en onherroepelijk was dan
      wel een melding was gedaan op grond van [artikel 1.10][ref2], kunnen bij ministeriële regeling maatregelen
      worden voorgeschreven die ertoe leiden dat binnen een bij die regeling te bepalen termijn aan de waarde van
      ten hoogste 47 dB L en ten hoogste 41 dB L op de gevel van gevoelige gebouwen en bij gevoelige terreinen
      op de grens van het terrein wordt voldaan in die gevallen waarin uit het akoestisch onderzoek, bedoeld in
      [artikel 1.11, negende lid][ref3], blijkt dat de geluidsbelasting die waarde overschrijdt.

      2 Bij de toepassing van [artikel 3.14a, tweede lid][ref4], wordt geen rekening gehouden met een windturbine of
      een combinatie van windturbines die behoort tot een andere inrichting waarvoor onmiddellijk voorafgaand aan het
      tijdstip van inwerkingtreding van dat artikel een vergunning in werking en onherroepelijk was dan wel een melding
      was gedaan op grond van [artikel 1.10][ref5].


