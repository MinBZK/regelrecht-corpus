      1 Deze paragraaf is van toepassing op een saneringsonderzoek en een bodemsanering in de zin van de
      [Wet bodembescherming][ref1]. Bij het lozen van grondwater vanuit een proefbronnering in het kader van een
      saneringsonderzoek of vanuit een bodemsanering wordt ten minste voldaan aan het tweede tot en met het negende lid.

      2 Het lozen in een aangewezen oppervlaktewaterlichaam of in een voorziening voor de inzameling en het transport van
      afvalwater, niet zijnde een vuilwaterriool, is toegestaan, indien bij het lozen:

      a. geen visuele verontreiniging plaatsvindt;

      b. het gehalte aan naftaleen in enig steekmonster ten hoogste 0,2 microgram per liter bedraagt;

      c. het gehalte aan PAK’s in enig steekmonster ten hoogste 1 microgram per liter bedraagt; en

      d. in enig steekmonster de emissiewaarden van de in dit artikel opgenomen tabel 3.1a niet worden overschreden.


