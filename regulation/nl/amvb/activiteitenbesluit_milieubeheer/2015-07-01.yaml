  - number: '3.78'
    text: |-
      1 De [artikelen 3.79 tot en met 3.83][ref1] zijn van toepassing op het gebruik van gewasbeschermingsmiddelen
      bij de teelt van gewassen in de open lucht binnen een afstand van 14 meter vanaf de insteek van een
      oppervlaktewaterlichaam.

      2 De [artikelen 3.84][ref2], [3.85][ref3] en [3.87][ref4] zijn van toepassing op het gebruik van meststoffen bij de
      teelt van gewassen in de open lucht.

      3 [Artikel 3.88][ref5] is van toepassing op het telen van gewassen in de open lucht.

      4 Voor de toepassing van deze paragraaf wordt in uiterwaarden en buitendijkse gebieden onder
      «oppervlaktewaterlichaam» verstaan: beddingen waarin ten tijde van het lozen een aan het aardoppervlak en de
      openlucht grenzende watermassa voorkomt.


