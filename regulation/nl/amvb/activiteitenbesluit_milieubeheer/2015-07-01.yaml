  - number: 6.24c
    text: |-
      1 [Artikel 3.46, eerste lid][ref1], is niet van toepassing op het opslaan van agrarische bedrijfsstoffen, indien
      de plaats waar deze bedrijfsstoffen zijn opgeslagen, is gelegen binnen een van de afstanden, genoemd in dat lid,
      het opslaan reeds voor het tijdstip van inwerkingtreding van dat artikel plaatsvond en verplaatsing van de opslagen
      bedrijfsstoffen redelijkerwijs niet kan worden gevergd.

      2 Indien het eerste lid van toepassing is:

      a. treft degene die de inrichting drijft maatregelen of voorzieningen die geurhinder voorkomen of tot een
      aanvaardbaar niveau beperken, en

      b. geeft degene die de inrichting drijft op verzoek van het bevoegd gezag aan welke maatregelen of voorzieningen
      hij daartoe heeft getroffen of zal treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.46
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel6.24c
