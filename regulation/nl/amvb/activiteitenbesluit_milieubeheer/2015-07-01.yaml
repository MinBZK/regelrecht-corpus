    text: |-
      1 [Artikel 3.20, eerste lid][ref1], is niet van toepassing op inrichtingen voor het afleveren van lichte olie
      aan motorvoertuigen voor het wegverkeer, waarbij het afleveren van lichte olie plaatsvindt met een maximale
      afleversnelheid van 10 liter per minuut, die zijn opgericht voor 1 januari 2012, tot het moment waarop het geheel
      van de tanks, pompen en leidingen van de afleverinstallatie, sterk wordt gewijzigd of vernieuwd.

      2 [Artikel 3.20, eerste lid][ref2], is niet van toepassing op inrichtingen voor het afleveren van lichte olie
      aan motorvoertuigen voor het wegverkeer anders dan ten behoeve van de openbare verkoop, die zijn opgericht voor
      1 januari 2012, tot het moment waarop het geheel van de tanks, pompen en leidingen van de afleverinstallatie, sterk
      wordt gewijzigd of vernieuwd.

      3 Het eerste en tweede lid zijn met ingang van 1 januari 2019 niet van toepassing op inrichtingen voor het
      afleveren van lichte olie aan motorvoertuigen voor het wegverkeer met een debiet van lichte olie van meer dan 3.000
      kubieke meter per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.20
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.20
