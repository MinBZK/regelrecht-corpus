  - number: '4.46'
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij solderen met vloeimiddelen die leiden tot
      gasvormige emissies naar de lucht de emissieconcentratie van de stoffen behorend tot de stofklassen gA.1,
      gA.2, gA.3, gA.4, gA.5, gO.1, gO.2 en gO.3, naar de lucht niet meer dan de voor die betreffende stofklasse
      genoemde emissieconcentratie-eis in [artikel 2.5][ref3] indien de massastroom gelijk of groter is dan de in
      [artikel 2.5][ref4] voor de betreffende stofklasse genoemde grensmassastroom.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.46
