  - number: '1.12'
    text: |-
      Indien op grond van [artikel 7 van het Besluit uniforme saneringen][ref1] met een sanering kan worden
      begonnen nadat vijf werkdagen zijn verstreken vanaf de datum van ontvangst van de melding, bedoeld in
      [artikel 6 van dat besluit][ref2], meldt degene die voornemens is te lozen vanuit die bodemsanering
      als bedoeld in [artikel 3.1, tweede, derde en vierde lid][ref3], in afwijking van de termijn bedoeld in
      [artikel 1.10, eerste lid][ref4], dit ten minste vijf werkdagen voordat met het lozen wordt aangevangen.


