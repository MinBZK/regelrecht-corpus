  - number: 4.74m
    text: Deze paragraaf is van toepassing op het vormgeven van betonproducten.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74m
  - number: 4.74n
    text: |-
      1 Het lozen van afvalwater afkomstig van het uitwassen van beton is uitsluitend toegestaan indien daarbij ten
      minste wordt voldaan aan de eisen, gesteld bij en krachtens het tweede tot en met vijfde lid.

      2 Bij het lozen van afvalwater in een aangewezen oppervlaktewaterlichaam bedraagt:

      a. het gehalte aan onopgeloste stoffen in enig steekmonster niet meer dan 100 milligram per liter, en

      b. het gehalte aan chemisch zuurstofverbruik in enig steekmonster niet meer dan 200 milligram per liter.

      3 Bij het lozen van afvalwater in een vuilwaterriool bevat het afvalwater in enig steekmonster niet meer dan 300
      milligram onopgeloste stoffen per liter.

      4 Het te lozen afvalwater kan op doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74n
  - number: 4.74o
    text: |-
      1 Bij het aanbrengen van ontkistingsmiddelen op bekisting wordt voldaan aan de bij ministeriële regeling gestelde
      eisen inzake de reductie van de emissie van vluchtige organische stoffen, tenzij deze niet kosteneffectief of
      technisch uitvoerbaar zijn.

      2 Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de
      activiteit, genoemd in het eerste lid, minder bedraagt dan 1.000 kilogram per jaar.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74o
  - number: 4.74p
    text: |-
      Bij het op bekisting aanbrengen van ontkistingsmiddelen en het uitwassen van beton wordt ten behoeve van het
      realiseren van een verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74p
  - number: 4.74q
    text: Deze paragraaf is van toepassing op het breken van steenachtig materiaal.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74q
  - number: 4.74r
    text: |-
      Bij het in de buitenlucht breken van steenachtig materiaal wordt:

      a. zoveel mogelijk voorkomen dat stofverspreiding optreedt die op een afstand van meer dan 2 meter van de bron met
      het blote oog waarneembaar is;

      b. verontreiniging van de omgeving zoveel mogelijk beperkt;

      c. zoveel mogelijk voorkomen dat steenachtig materiaal in een oppervlaktewaterlichaam geraakt, en

      d. zoveel mogelijk voorkomen dat steenachtig materiaal in een voorziening voor het beheer van afvalwater geraakt.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74r
  - number: 4.74s
    text: |-
      1 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het inpandig breken van steenachtig materiaal de
      emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur, en

      b. 50 milligram per normaal kubieke meter, indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.

      2 Bij het inpandig breken van steenachtig materiaal wordt ten behoeve van het voorkomen dan wel voor zover dat
      niet mogelijk is het beperken van diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht,
      voldaan aan de bij ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74s
