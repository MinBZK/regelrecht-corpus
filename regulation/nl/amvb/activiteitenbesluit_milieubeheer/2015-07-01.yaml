  - number: '3.66'
    text: |-
      1 Bij het lozen van drainwater wordt ten minste voldaan aan het tweede tot en met het tiende lid.

      2 Voor de gietwatervoorziening:

      a. is een hemelwateropvangvoorziening van ten minste 500 kubieke meter per hectare teeltoppervlak aanwezig en in
      gebruik, of

      b. wordt water met een natriumgehalte gebruikt dat gelijkwaardig is aan dat van hemelwater.

      3 Voor het recirculeren van drainwater is een recirculatiesysteem aanwezig en in gebruik.

      4 De hoeveelheid totaal stikstof in het te lozen drainwater bedraagt in kilogram totaal stikstof per hectare
      teeltoppervlak per jaar niet meer dan de in tabel 3.66 per categorie van gewassen genoemde waarden:


            Tabel 3.66 Maximale hoeveelheid totaal stikstof in het te lozen drainwater in kilogram per hectare
