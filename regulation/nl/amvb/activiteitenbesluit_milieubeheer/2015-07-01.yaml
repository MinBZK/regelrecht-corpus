        bwb_id: BWBR0027464
        artikel: '5.4'
  - number: 4.94dd
    text: |-
      1 Bij het vervaardigen van drukvormen voor het bedrukken met rotatieoffset druktechniek worden geen
      chroomzouthoudende ets- en correctiemiddelen toegepast.

      2 Bij het ontwikkelen en naharden van kopieerlagen voor het bedrukken met rotatieoffset druktechniek worden geen
      chroomhoudende oplossingen gebruikt.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.94dd
  - number: 4.94de
    text: |-
      Bij het bedrukken met rotatieoffset druktechniek wordt ten behoeve van:

      a. het voorkomen dan wel voor zover dat niet mogelijk is het beperken van diffuse emissies;

      b. het voorkomen dan wel voor zover dat niet mogelijk is het beperken van geurhinder, en

      c. het realiseren van een verwaarloosbaar bodemrisico,

      voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.94de
  - number: 4.94df
    text: Deze paragraaf is van toepassing op het bedrukken met flexodruktechniek of verpakkingsdiepdruktechniek.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.94df
  - number: 4.94dg
    text: |-
      Indien bij de toepassing van flexodruktechniek of verpakkingsdiepdruktechniek de drempelwaarden, genoemd in
      [tabel 2.28a van afdeling 2.11][ref1] worden overschreden, is die afdeling van toepassing.


