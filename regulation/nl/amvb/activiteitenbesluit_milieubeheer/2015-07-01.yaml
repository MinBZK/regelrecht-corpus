  - number: 1.17a
    text: |-
      Bij een melding als bedoeld in [artikel 1.10][ref1] worden, indien sprake is van de oprichting van een
      zuiveringtechnisch werk of de wijziging van een bestaand zuiveringtechnisch werk die de lozing van dat werk op een
      oppervlaktewaterlichaam beïnvloedt, tevens de volgende gegevens gemeld:

      a. de ontwerpcapaciteit, uitgedrukt in inwonerequivalenten, en de toename van de ontwerpcapaciteit tussen
      1 september 1992 en het tijdstip van de melding,

      b. het gemiddelde lozingsdebiet in kubieke meter per dag,

      c. de maximale hydraulische aanvoer in kubieke meter per uur,

      d. de te verwachten concentraties biochemisch zuurstofverbruik, chemisch zuurstofverbruik, onopgeloste stoffen,
      totaal fosfor en totaal stikstof in het te lozen afvalwater in milligram per liter,

      e. de resultaten van een immissietoets van de concentraties totaal fosfor en totaal stikstof, uitgevoerd
      overeenkomstig een daartoe krachtens artikel 5.4, tweede lid, van het Besluit omgevingsrecht aangewezen BBT-
      informatiedocument (Handboek immissietoets: toetsing van lozingen op effecten voor het oppervlaktewater), en

      f. de te verwerken afvalstoffen die per as van buiten de inrichting worden aangevoerd, de daarbij toe te passen
      best beschikbare verwerkingstechnieken en het acceptatie- en verwerkingsbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.17a
    references:
      - id: ref1
