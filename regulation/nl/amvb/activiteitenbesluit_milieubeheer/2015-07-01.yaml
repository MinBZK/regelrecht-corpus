  - number: 6.2a
    text: |-
      1 Voor het lozen anders dan vanuit een inrichting, waarvoor onmiddellijk voorafgaand aan het tijdstip
      van het van toepassing worden van [artikel 1.4a][ref1] op dat lozen, een vergunning op grond van
      [artikel 6.2 van de Waterwet][ref2] in werking en onherroepelijk was, worden de voorschriften van die vergunning
      gedurende drie jaar na het tijdstip van het van toepassing worden van artikel 1.4a op dat lozen aangemerkt als
      maatwerkvoorschriften, mits de voorschriften van die vergunning vallen binnen de bevoegdheid van het bevoegd gezag
      tot het stellen van maatwerkvoorschriften.

      2 De nadere eisen die onmiddellijk voorafgaand aan het tijdstip van het van toepassing worden van
      [artikel 1.4a][ref3] voor het lozen anders dan vanuit een inrichting in werking en onherroepelijk waren krachtens
      het [Lozingenbesluit open teelt en veehouderij][ref4], blijven na het tijdstip van het van toepassing worden van
      artikel 1.4a op dat lozen gelden als maatwerkvoorschriften, mits de nadere eisen vallen binnen de bevoegdheid van
      het bevoegd gezag tot het stellen van maatwerkvoorschriften.

      3 De voorschriften van een vergunning dan wel de nadere eisen op grond van het
      [Lozingenbesluit open teelt en veehouderij][ref5] voor het lozen anders dan vanuit een inrichting, die voor dat
      lozen onmiddellijk voorafgaand aan het tijdstip van het van toepassing worden van [artikel 1.4a][ref6] op dat lozen
      in werking en onherroepelijk waren en niet vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van
      maatwerkvoorschriften, worden indien op grond van dit besluit strengere bepalingen gelden, gedurende zes maanden
      aangemerkt als maatwerkvoorschriften.

      4 Voor de toepassing van dit artikel worden gegevens die in de aanvraag staan en die worden aangemerkt als
      onderdeel van de voorschriften van de vergunning, aangemerkt als voorschriften van de vergunning.


