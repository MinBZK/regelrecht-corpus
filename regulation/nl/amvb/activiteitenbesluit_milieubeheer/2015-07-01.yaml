  - number: 2.8a
    text: |-
      1 Deze afdeling is van toepassing op degene die:

      a. een inrichting type A of een inrichting type B drijft of een inrichting type C waartoe een IPPC-installatie
      behoort, of

      b. een inrichting type C drijft waartoe geen IPPC-installatie behoort, voor zover deze afdeling betrekking heeft
      op activiteiten die verricht worden binnen de inrichting waarop [hoofdstuk 3][ref1] van toepassing is.

      2 Voor zover het betreft een inrichting type C waartoe een IPPC-installatie behoort, is in afwijking van het eerste
      lid, onder a, [artikel 2.11, eerste lid][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.11
