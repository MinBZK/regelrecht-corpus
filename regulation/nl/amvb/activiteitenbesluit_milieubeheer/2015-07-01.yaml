  - number: '2.20'
    text: |-
      1 In afwijking van de waarden, bedoeld in de [artikelen 2.17][ref1], [2.19][ref2] dan wel [6.12][ref3], kan het
      bevoegd gezag bij maatwerkvoorschrift andere waarden voor het langtijdgemiddeld beoordelingsniveau (L) en het
      maximaal geluidsniveau L vaststellen.

      2 Het bevoegd gezag kan slechts hogere waarden vaststellen dan de waarden, bedoeld in de [artikelen 2.17][ref4],
      [2.19][ref5] dan wel [6.12][ref6], indien binnen geluidsgevoelige ruimten dan wel verblijfsruimten van gevoelige
      gebouwen, die zijn gelegen binnen de akoestische invloedssfeer van de inrichting, een etmaalwaarde van maximaal 35
      dB(A) wordt gewaarborgd.

      3 De in het tweede lid bedoelde etmaalwaarde is niet van toepassing indien de gebruiker van deze gevoelige gebouwen
      geen toestemming geeft voor het in redelijkheid uitvoeren of doen uitvoeren van geluidsmetingen.

      4 Het bevoegd gezag kan maatwerkvoorschriften stellen over de plaats waar de waarden, bedoeld in de
      [artikelen 2.17][ref7], [2.19][ref8] dan wel [6.12][ref9], voor een inrichting gelden.

      5 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen welke technische voorzieningen in de inrichting worden
      aangebracht en welke gedragsregels in acht worden genomen teneinde aan geldende geluidsnormen te voldoen.

      6 In afwijking van de waarden, bedoeld in de [artikelen 2.17][ref10], [2.19][ref11] dan wel [6.12][ref12] kan het
      bevoegd gezag bij maatwerkvoorschrift voor bepaalde activiteiten in een inrichting, anders dan festiviteiten als
      bedoeld in [artikel 2.21][ref13], andere waarden voor het langtijdgemiddeld beoordelingsniveau (L) en het maximaal
      geluidsniveau L vaststellen. Het bevoegd gezag kan daarbij voorschriften vaststellen met betrekking tot de duur
      van de activiteiten, het treffen van maatregelen, de tijdstippen waarop de activiteiten plaatsvinden of het vooraf
      melden per keer dat de activiteit plaatsvindt.

      7 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen welke technische voorzieningen worden aangebracht en welke
      gedragsregels in acht worden genomen ter beperking van het geluid als gevolg van werkzaamheden en activiteiten bij
      een inrichting als bedoeld in [artikel 2.17, vijfde lid][ref14].


