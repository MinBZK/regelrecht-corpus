  - number: '5.10'
    text: |-
      1 In afwijking van [artikel 5.4][ref1] mag een grote stookinstallatie, waar gewoonlijk laagzwavelige brandstof
      wordt verstookt, gedurende 240 uur in werking blijven, indien degene die de inrichting drijft wegens een
      onderbreking van de voorziening met laagzwavelige brandstof ten gevolge van een ernstig tekort aan dergelijke
      brandstoffen niet in staat is de emissiegrenswaarden van dat artikel in acht te nemen.

      2 Het bevoegd gezag kan bij maatwerkvoorschrift de periode, bedoeld in het eerste lid, verlengen tot ten hoogste
      zes maanden, voor zover de omstandigheid, bedoeld in het eerste lid, voortduurt en degene die de inrichting drijft
      daardoor redelijkerwijs niet in staat is de emissiegrenswaarden in acht te nemen.

      3 Degene die de inrichting drijft, meldt onmiddellijk aan het bevoegd gezag dat zich een situatie voordoet als
      bedoeld in het eerste lid.

      4 Het bevoegd gezag stelt Onze Minister onmiddellijk in kennis van een afwijking als bedoeld in het eerste of
      tweede lid.


