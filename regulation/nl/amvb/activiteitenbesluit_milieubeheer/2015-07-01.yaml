  - number: '4.76'
    text: Deze paragraaf is van toepassing op het afleveren van vloeibare brandstoffen aan vaartuigen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.76
  - number: '4.77'
    text: |-
      1 Met betrekking tot een bunkerstation waarin lichte olie wordt opgeslagen, wordt ten opzichte van buiten de
      inrichting gelegen kwetsbare objecten een afstand aangehouden van 20 meter gerekend vanaf de zijden van het
      bunkerstation alsmede het vulpunt van het bunkerstation.

      2 Met betrekking tot een op de wal geplaatste vaste afleverinstallatie voor het afleveren van lichte olie aan
      vaartuigen wordt ten opzichte van buiten de inrichting gelegen kwetsbare objecten een afstand aangehouden van
      20 meter gerekend vanaf het afleverpunt alsmede het vulpunt van de installatie.

      3 Binnen een afstand van 20 meter van een bunkerstation waarin lichte olie wordt opgeslagen gerekend vanaf de
      zijden van het bunkerstation alsmede het vulpunt van het bunkerstation en binnen een afstand van 20 meter van een
      op de wal geplaatste vaste afleverinstallatie voor het afleveren van lichte olie aan vaartuigen gerekend vanaf
      het afleverpunt alsmede het vulpunt van de installatie is overnachting en recreatief verblijf door derden niet
      toegestaan.

      4 Indien een bunkerstation waarin geen lichte olie wordt opgeslagen, is gelegen aan een doorgaande vaarroute, wordt
      ten opzichte van buiten de inrichting gelegen kwetsbare objecten een afstand aangehouden van 20 meter gerekend
      vanaf de aan de vaarroute grenzende zijde van het bunkerstation.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.77
  - number: '4.78'
    text: |-
      1 Bij het afleveren van vloeibare brandstoffen aan vaartuigen zijn voldoende absorptiemiddelen en andere
      hulpmiddelen aanwezig voor de eerste bestrijding van een waterverontreiniging ten gevolge van morsingen of een
      calamiteit bij het afleveren van brandstof.

      2 Een installatie voor het afleveren van vloeibare brandstoffen aan vaartuigen alsmede de daarbij behorende
      tankinstallatie, is zodanig uitgevoerd dat bij wisselende waterstanden, voor zover deze ter plaatse optreden, als
      gevolg van die waterstanden geen nadelige gevolgen voor het milieu optreden.

      3 Het bevoegd gezag kan, indien uit de aard en de ligging van de installatie onduidelijk zou kunnen zijn welke
      absorptie- en hulpmiddelen het meest zijn aangewezen, maatwerkvoorschriften stellen met betrekking tot de
      hoeveelheid en de soort middelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.78
  - number: '4.79'
    text: |-
      Bij het afleveren van vloeibare brandstoffen aan vaartuigen wordt ten behoeve van:

      a. het realiseren van een verwaarloosbaar bodemrisico;

      b. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan;

      c. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van een
      oppervlaktewaterlichaam;

      d. het voorkomen dan wel beperken van geurhinder,

      ten minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.79
  - number: '4.80'
    text: |-
      Deze paragraaf is van toepassing op inrichtingen voor het afleveren van vloeibare brandstof en gecomprimeerd
      aardgas, indien uitsluitend wordt afgeleverd anders dan aan motorvoertuigen voor het wegverkeer, vaartuigen of
      spoorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.80
  - number: 4.80a
    text: Het inpandig afleveren van lichte olie vindt niet plaats.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.80a
  - number: '4.81'
    text: |-
      1 De installatie voor het afleveren van gecomprimeerd aardgas, anders dan aan motorvoertuigen voor het wegverkeer
      en vaartuigen, bevindt zich op een afstand van ten minste 10 meter van kwetsbare en beperkt kwetsbare objecten.

      2 Een aardgas-afleverinstallatie voor het afleveren van gecomprimeerd aardgas, anders dan aan motorvoertuigen
      voor het wegverkeer en vaartuigen voldoet ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone
      voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving
      en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan, aan de bij ministeriële regeling te
      stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.81
  - number: '4.82'
    text: |-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van een vloeistofdichte vloer of verharding
      waarboven het afleveren van motorbrandstof, anders dan aan motorvoertuigen voor het wegverkeer, vaartuigen of
      spoorvoertuigen plaatsvindt, wordt ten minste voldaan aan het tweede tot en met het vierde lid.

      2 Het afvalwater wordt geleid door een slibvangput en olieafscheider die voldoen aan NEN-EN 858-1 en 2.

      3 Het gehalte aan olie in het afvalwater na de afscheider bedraagt niet meer dan 200 milligram per liter in enig
      steekmonster bepaald overeenkomstig de bepalingsmethode.

      4 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.82
  - number: '4.83'
    text: |-
      Bij het afleveren van vloeibare brandstof, anders dan aan motorvoertuigen voor het wegverkeer, vaartuigen of
      spoorvoertuigen, wordt:

      a. ten behoeve van het realiseren van een verwaarloosbaar bodemrisico en het voorkomen dan wel voor zover dat
      niet mogelijk is het zoveel mogelijk beperken van luchtverontreiniging voldaan aan de bij ministeriële regeling te
      stellen eisen; en

      b. ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, ten minste voldaan aan de bij ministeriële regeling gestelde eisen.

      ten minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.83
  - number: 4.83a
    text: |-
      Deze paragraaf is van toepassing op het onderhouden of repareren van motoren, motorvoertuigen, spoorvoertuigen of
      andere gemotoriseerde apparaten of proefdraaien van verbrandingsmotoren.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.83a
  - number: '4.84'
    text: |-
      1 In een inrichting voor onderhoud en reparatie van motorvoertuigen, niet zijnde een autodemontagebedrijf of een
      inrichting voor het opslaan van autowrakken in het kader van hulpverlening aan kentekenhouders door een daartoe
      aangewezen instantie of in het kader van onderzoek door politie of justitie, zijn niet meer dan vier autowrakken
      aanwezig.

      2 In een inrichting voor onderhoud en reparatie van motorvoertuigen, niet zijnde een demontagebedrijf voor
      tweewielige motorvoertuigen of een inrichting voor het opslaan van wrakken van tweewielige motorvoertuigen in het
      kader van hulpverlening aan kentekenhouders door een daartoe aangewezen instantie of in het kader van onderzoek
      door politie of justitie, zijn niet meer dan vier wrakken van tweewielige motorvoertuigen aanwezig.

      3 Het is niet toegestaan, anders dan bij een autodemontagebedrijf of een demontagebedrijf voor tweewielige
      motorvoertuigen, een autowrak onderscheidenlijk een wrak van een tweewielig motorvoertuig en de daarin aanwezige
      materialen of onderdelen te verwijderen of nuttig toe te passen, tenzij het betreft:

      1°. de opslag, of

      2°. accessoires die worden gedemonteerd omdat de laatste eigenaar of houder van het autowrak of wrak van een
      tweewielig motorvoertuig hierom anders dan in de uitoefening van zijn beroep of bedrijf heeft verzocht en met als
      doel die accessoires opnieuw te gebruiken ten behoeve van een ander motorvoertuig waarvan hij eigenaar of houder
      is.

      4 Het proefdraaien van verbrandingsmotoren vindt niet in de buitenlucht plaats.

      5 Bij het onderhouden of repareren van motoren, motorvoertuigen, spoorvoertuigen of andere gemotoriseerde apparaten
      of bij het proefdraaien van verbrandingsmotoren wordt ten behoeve van:

      a. het voorkomen of beperken van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan;

      b. het voorkomen of beperken van geurhinder;

      c. het doelmatig verspreiden van emissies naar de buitenlucht;

      d. het realiseren van een verwaarloosbaar bodemrisico,

      ten minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.84
  - number: '4.85'
    text: |-
      In afwijking van [artikel 4.84, vierde lid][ref1], is het proefdraaien van motoren van pleziervaartuigen in de
      buitenlucht toegestaan voor zover de motor zich in het vaartuig bevindt.


