      1 Voor inrichtingen waarop onmiddellijk voorafgaand aan de inwerkingtreding van [artikel 2.17][ref1], het
      [Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer][ref2] van toepassing was, en waarvoor voor
      muziekgeluid een bedrijfsduurcorrectie werd toegepast, kan het bevoegd gezag bij maatwerkvoorschrift bepalen dat
      [artikel 2.18, tweede lid][ref3], niet van toepassing is voor de toetsing van geluidsniveaus tussen 23.00 en 07.00
      uur.

      2 Indien op grond van het maatwerkvoorschrift, bedoeld in het eerste lid, een bedrijfsduurcorrectie wordt
      toegepast, is het door de inrichting veroorzaakte geluidsniveau gedurende de bedrijfstijd tussen 23.00 en 07.00 uur
      niet hoger dan op grond van [artikel 2.17][ref4] is toegestaan tussen 19.00 en 23.00 uur.


