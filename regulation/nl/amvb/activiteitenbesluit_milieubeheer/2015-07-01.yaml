    text: |-
      1 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij droogverspanende bewerkingen, thermische bewerkingen
      en bij mechanische eindafwerking van roestvast staal, de emissieconcentratie van chroom VI-verbindingen, berekend
      als chroom, niet meer dan 0,1 milligram per normaal kubieke meter, indien de massastroom van chroom VI-verbindingen
      naar de lucht, berekend als chroom, meer bedraagt dan 0,5 gram per uur.

      2 Het eerste lid is niet van toepassing indien de werkzaamheden op grond van de [artikelen 4.32, tweede lid][ref3],
      of [4.86][ref4] in de buitenlucht worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
