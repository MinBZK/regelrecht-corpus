  - number: '3.79'
    text: |-
      1 Bij het op een andere wijze dan met behulp van een werk lozen van gewasbeschermingsmiddelen in een
      oppervlaktewaterlichaam wordt ten minste voldaan aan het tweede tot en met achtste lid.

      2 Langs een oppervlaktewaterlichaam wordt een teeltvrije zone aangehouden.

      3 De teeltvrije zone wordt gemeten vanaf de insteek van een oppervlaktewaterlichaam en strekt zich, met
      uitzondering van de teelt van grasland, uit tot het hart van de buitenste planten van de te telen gewassen.

      4 In afwijking van het tweede lid hoeft geen teeltvrije zone te worden aangehouden grenzend aan gegraven waterlopen
      die:

      a. van 1 april tot 1 oktober onder normale omstandigheden geen water bevatten, of

      b. geen water afvoeren ten gevolge van door of namens de beheerder geplaatste stuwen die de waterstand reguleren,
      voor zover die waterlopen zonder deze stuwen, waterlopen als bedoeld in de aanhef en onderdeel a, zouden zijn.

      5 Binnen een teeltvrije zone worden geen gewasbeschermingsmiddelen gebruikt met apparatuur voor het druppelsgewijs
      gebruiken van gewasbeschermingsmiddelen, met uitzondering van pleksgewijze onkruidbestrijding met een afgeschermde
      spuitdop.

      6 In afwijking van het vijfde lid is het gebruik van gewasbeschermingsmiddelen op overhangend loof met een maximale
      omvang van een halve gewasrij toegestaan, indien geen gebruik wordt gemaakt van naar een oppervlaktewaterlichaam
      gerichte apparatuur.

      7 In afwijking van het tweede lid hoeft geen teeltvrije zone te worden aangehouden, aangrenzend aan
      oppervlaktewaterlichamen, anders dan de oppervlaktewaterlichamen, bedoeld in [artikel 3.81, eerste lid][ref1]:

      a. bij de teelt van appelen, peren en overige pit- en steenvruchten van bomen, waarvan de laagste gesteltak op
      175 centimeter of hoger uit de stam ontspringt, indien binnen een afstand van ten minste 900 centimeter vanaf de
      insteek van een oppervlaktewaterlichaam geen gewasbeschermingsmiddelen worden toegepast, of

      b. bij teelt anders dan de teelt van appelen, peren en overige pit- en steenvruchten, indien:

      1°. sprake is van een biologische productiemethode, of

      2°. gebruik wordt gemaakt van een emissiescherm dat voldoet aan de bij ministeriële regeling gestelde eisen.

      8 De toepassing van gewasbeschermingsmiddelen op het talud vindt pleksgewijs en driftvrij plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.81
