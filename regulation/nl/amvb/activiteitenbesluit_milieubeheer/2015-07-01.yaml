  - number: '2.18'
    text: |-
      1 Bij het bepalen van de geluidsniveaus, bedoeld in de [artikelen 2.17][ref1], [2.19][ref2], [2.20][ref3] dan wel
      [6.12][ref4], blijft buiten beschouwing:

      a. het stemgeluid van personen op een onverwarmd en onoverdekt terrein, dat onderdeel is van de inrichting, tenzij
      dit terrein kan worden aangemerkt als een binnenterrein;

      b. het stemgeluid van bezoekers op het open terrein van een inrichting voor sport- of recreatieactiviteiten;

      c. het geluid ten behoeve van het oproepen tot het belijden van godsdienst of levensovertuiging of het bijwonen van
      godsdienstige of levensbeschouwelijke bijeenkomsten en lijkplechtigheden, alsmede geluid in verband met het houden
      van deze bijeenkomsten of plechtigheden;

      d. het geluid van het traditioneel ten gehore brengen van muziek tijdens het hijsen en strijken van de nationale
      vlag bij zonsopkomst en zonsondergang op militaire inrichtingen;

      e. het ten gehore brengen van muziek vanwege het oefenen door militaire muziekcorpsen in de buitenlucht gedurende
      de dagperiode met een maximum van twee uren per week op militaire inrichtingen;

      f. het ten gehore brengen van onversterkte muziek tenzij en voor zover daarvoor bij gemeentelijke verordening
      regels zijn gesteld;

      g. het traditioneel schieten, bedoeld in [paragraaf 3.7.2.][ref5], tenzij en voor zover daarvoor bij gemeentelijke
      verordening regels zijn gesteld;

      h. het stemgeluid van kinderen op een onverwarmd of onoverdekt terrein dat onderdeel is van een inrichting voor
      primair onderwijs, in de periode vanaf een uur voor aanvang van het onderwijs tot een uur na beëindiging van het
      onderwijs;

      i. het stemgeluid van kinderen op een onverwarmd of onoverdekt terrein dat onderdeel is van een instelling voor
      kinderopvang.

      2 Bij het bepalen van de geluidsniveaus, bedoeld in [artikel 2.17][ref6], [2.20][ref7] dan wel [6.12][ref8], wordt
      voor muziekgeluid geen bedrijfsduurcorrectie toegepast.

      3 Bij het bepalen van het maximaal geluidsniveau (L), bedoeld in [artikel 2.17][ref9], [2.20][ref10] dan wel
      [6.12][ref11], blijft buiten beschouwing het geluid als gevolg van:

      a. het komen en gaan van bezoekers bij inrichtingen waar uitsluitend of in hoofdzaak horeca-, sport- en
      recreatieactiviteiten plaatsvinden;

      b. het verrichten in de open lucht van sportactiviteiten of activiteiten die hiermee in nauw verband staan;

      c. laad- en losactiviteiten in de periode tussen 19.00 uur en 06.00 uur ten behoeve van de aan- en afvoer van
      producten bij inrichtingen als bedoeld in [artikel 2.17, vijfde en zesde lid][ref12], voor zover dat ten hoogste
      een keer in de genoemde periode plaatsvindt;

      d. het verrichten van activiteiten in de periode tussen 19.00 uur en 6.00 uur ten behoeve van het wassen van
      kasdekken bij inrichtingen als bedoeld in [artikel 2.17, vijfde en zesde lid][ref13].

      4 De maximale geluidsniveaus (L), bedoeld in [artikel 2.17][ref14], [2.20][ref15] dan wel [6.12][ref16], zijn
      tussen 23.00 en 7.00 uur niet van toepassing ten aanzien van aandrijfgeluid van motorvoertuigen bij laad- en
      losactiviteiten indien:

      a. degene die de inrichting drijft aantoont dat het voor de betreffende inrichting in die periode geldende maximale
      geluidsniveau (LA), niet te bereiken is door het treffen van maatregelen; en

      b. het niveau van het aandrijfgeluid op een afstand van 7,5 meter van het motorvoertuig niet hoger is van 65dB(A).

      5 Bij gemeentelijke verordening kunnen ten behoeve van het voorkomen van geluidhinder regels worden gesteld met
      betrekking tot:

      a. het ten gehore brengen van onversterkte muziek, en

      b. het traditioneel schieten, bedoeld in [paragraaf 3.7.2][ref17].

      6 Bij het bepalen van het langtijdgemiddelde beoordelingsniveau (L) blijft het geluid veroorzaakt door het stomen
      van grond met een installatie van derden buiten beschouwing.

      7 Degene die een inrichting drijft, waar het stomen van grond plaatsvindt met een installatie van derden, treft
      maatregelen of voorzieningen die betrekking hebben op:

      a. de periode waarin het grondstomen plaatsvindt;

      b. de locatie waar de installatie wordt opgesteld, en

      c. het aanbrengen van geluidreducerende voorzieningen binnen de inrichting.

      8 Het bevoegd gezag kan ten behoeve van het voorkomen van geluidhinder dan wel voor zover dat niet mogelijk is
      het tot een aanvaardbaar niveau beperken daarvan, bij maatwerkvoorschrift eisen stellen aan de maatregelen of
      voorzieningen, bedoeld in het zevende lid.


