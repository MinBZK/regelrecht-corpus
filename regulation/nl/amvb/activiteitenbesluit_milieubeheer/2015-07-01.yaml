  - number: '5.21'
    text: |-
      Voor een afvalmeeverbrandingsinstallatie waarin vaste afvalstoffen worden verstookt gelden voor kwik, in plaats van
      de emissiegrenswaarde, bedoeld in [artikel 5.20][ref1], de volgende jaarlijkse gemiddelde inputeisen:

      a. bij het meeverbranden van 10 massaprocent of minder afvalstoffen van de gemiddelde jaarlijkse inzet van vaste
      brandstoffen of biomassa: 0,4 milligram kwik per kilogram afvalstof berekend als droge stof;

      b. bij het meeverbranden van meer dan 10 massaprocent afvalstoffen van de gemiddelde jaarlijkse inzet van vaste
      brandstoffen of biomassa: (3,5/massaprocent + 0,05) milligram kwik per kilogram afvalstof berekend als droge stof.


