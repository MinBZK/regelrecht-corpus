  - number: '3.115'
    text: |-
      1 Het oprichten, uitbreiden, of wijzigen van een dierenverblijf met dieren met geuremissiefactor is verboden,
      indien de geurbelasting die de inrichting vanwege dierenverblijven waar dieren met geuremissiefactor worden
      gehouden veroorzaakt, op geurgevoelige objecten die zijn gelegen in de gebieden, bedoeld in tabel 3.115, na de
      oprichting, uitbreiding of wijziging meer bedraagt dan de in die tabel aangegeven waarden.


            Tabel 3.115 geurbelasting ouE/m3 (odour units per kubieke meter lucht)







                    (P98)


                    niet-concentratiegebied


                    concentratiegebied






                    bebouwde kom


                    2,0


                    3,0




                    buiten bebouwde kom


                    8,0


                    14,0






      2 Het eerste lid is niet van toepassing:

      a. indien het geurgevoelig object een object als bedoeld in
      [artikel 3.116, eerste lid, onderdelen a, b of c, of tweede lid][ref1], is;

      b. op de uitbreiding van een dierenverblijf indien een geurbelastingreducerende maatregel wordt toegepast en de
      totale geurbelasting na de uitbreiding niet meer bedraagt dan het gemiddelde van de bij de betreffende situatie
      behorende waarde uit tabel 3.115 en de geurbelasting die de inrichting voorafgaand aan het toepassen van de
      maatregel veroorzaakte, of

      c. indien bij de oprichting, uitbreiding of wijziging van een dierenverblijf de geurbelasting die de inrichting op
      enig geurgevoelig object veroorzaakt, niet toeneemt en het aantal dieren per diercategorie met geuremissiefactor
      binnen de inrichting niet toeneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.116
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.115
    references:
      - id: ref1
