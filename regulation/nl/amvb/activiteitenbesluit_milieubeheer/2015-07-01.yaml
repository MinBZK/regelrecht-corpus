  - number: '1.19'
    text: |-
      Bij een melding als bedoeld in [artikel 1.10][ref1], worden de inputgegevens voor het luchtkwaliteitsmodel ISL3a
      verstrekt indien sprake is van het in huisvestingssystemen houden van:

      a. ten minste 500 en ten hoogste 1.200 vleesrunderen, behorend tot de diercategorieën A4 tot en met A7, genoemd in
      de regeling op grond van [artikel 1 van de Wet ammoniak en veehouderij][ref2];

      b. ten minste 3.000 stuks pluimvee, voor zover er geen sprake is van een gpbv-installatie;

      c. ten minste 900 varkens behorend tot de diercategorieën D1 tot en met D3, genoemd in de regeling op grond van
      [artikel 1 van de Wet ammoniak en veehouderij][ref3],voor zover er geen sprake is van een gpbv-installatie;

      d. ten minste 1.500 stuks pluimvee behorend tot de diercategorieën E1 tot en met E5, F1 tot en met F4, G1, G2
      en J1, genoemd in de regeling op grond van [artikel 1 van de Wet ammoniak en veehouderij][ref4], 500 gespeende
      biggen behorend tot de diercategorie D.1.1, genoemd in de regeling op grond van artikel 1 van de Wet ammoniak
      en veehouderij of 500 landbouwhuisdieren anders dan pluimvee en gespeende biggen indien binnen de inrichting
      landbouwhuisdieren van meer dan een hoofdcategorie als bedoeld in de regeling op grond van artikel 1 van de Wet
      ammoniak en veehouderij worden gehouden.


