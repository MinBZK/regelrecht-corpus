  - number: '2.29'
    text: |-
      1 Bij het in werking hebben van een oplosmiddeleninstallatie worden:

      a. de emissiegrenswaarden en de diffuse-emissiegrenswaarden van tabel 2.28a en tabel 2.28b niet overschreden, of

      b. de totale emissiegrenswaarden van tabel 2.28a en tabel 2.28b niet overschreden.

      2 Het eerste lid is niet van toepassing indien wordt voldaan aan een reductieprogramma waarmee een emissiebeperking
      wordt bereikt die gelijkwaardig is aan die welke bij toepassing van de in het eerste lid, onder a of b, bedoelde
      waarden zou zijn bereikt.

      3 Indien een bestaande oplosmiddeleninstallatie als bedoeld in [artikel 2.28][ref1] een verandering als bedoeld
      in artikel 1.10, tweede lid, of [artikel 2.1, eerste lid, onder e, onder 2][ref2] ondergaat of na een verandering
      voor het eerst onder deze afdeling valt, wordt dat deel van de oplosmiddeleninstallatie dat de verandering heeft
      ondergaan aangemerkt als nieuwe oplosmiddeleninstallatie. De eerste volzin is niet van toepassing indien de totale
      emissies van de oplosmiddeleninstallatie niet hoger zijn dan indien het deel dat de verandering heeft ondergaan als
      een nieuwe oplosmiddeleninstallatie zou zijn aangemerkt.

      4 Indien degene die een inrichting drijft waartoe een oplosmiddeleninstallatie behoort, aantoont dat het voldoen
      aan de diffuse-emissiegrenswaarde technisch en economisch niet haalbaar is voor die oplosmiddeleninstallatie, kan
      het bevoegd gezag bij maatwerkvoorschrift een andere diffuse-emissiegrenswaarde vaststellen.

      5 Voor coatingprocessen als bedoeld in tabel 2.28a, onderdeel 8, kan het bevoegd gezag bij maatwerkvoorschrift voor
      de oplosmiddeleninstallatie andere emissiegrenswaarden of diffuse-emissiegrenswaarden vaststellen dan die welke
      gelden op grond van het eerste lid, indien:

      a. de vrijkomende vluchtige organische stoffen niet beheerst kunnen worden afgevangen of uitgestoten, en

      b. degene die de inrichting drijft waartoe de oplosmiddeleninstallatie behoort, aantoont dat het voldoen aan de
      verplichtingen uit het eerste lid technisch en economisch niet haalbaar is.


