      1 In afwijking van [artikel 3.4, tweede lid, onderdeel a][ref1], wordt de afstand tot het dichtstbijzijnde
      vuilwaterriool of zuiveringtechnisch werk bij voortzetting van het lozen van huishoudelijk afvalwater op of in
      de bodem dat voor 1 juli 1990 al regelmatig plaatsvond, berekend vanaf het gedeelte van het gebouw dat zich het
      dichtst bij een vuilwaterriool of een zuiveringtechnisch werk bevindt.

      2 In afwijking van [artikel 3.4, tweede lid, onderdeel a][ref2], wordt de afstand tot het dichtstbijzijnde
      vuilwaterriool of zuiveringtechnisch werk bij voortzetting van het lozen van huishoudelijk afvalwater in het
      oppervlaktewater dat voor 1 maart 1997 al plaatsvond, berekend vanaf het gedeelte van het gebouw dat zich het
      dichtst bij een vuilwaterriool of een zuiveringtechnisch werk bevindt.


