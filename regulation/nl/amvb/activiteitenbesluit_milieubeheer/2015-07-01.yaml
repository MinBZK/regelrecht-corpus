  - number: '3.119'
    text: |-
      1 Onverminderd de [artikelen 3.115 tot en met 3.117][ref1] is het oprichten, uitbreiden of wijzigen van een
      dierenverblijf verboden, indien na de oprichting, uitbreiding of wijziging de afstand van de buitenzijde van een
      dierenverblijf tot de dichtstbijzijnde buitenzijde van een geurgevoelig object:

      a. minder dan 50 meter bedraagt, indien het geurgevoelig object binnen de bebouwde kom is gelegen, of

      b. minder dan 25 meter bedraagt, indien het geurgevoelig object buiten de bebouwde kom is gelegen.

      2 Het eerste lid is niet van toepassing, indien de afstand van de buitenzijde van het dierenverblijf tot de
      dichtstbijzijnde buitenzijde van een geurgevoelig object niet afneemt, en

      a. bij een dierenverblijf als bedoeld in [artikel 3.115][ref2] het aantal dieren per diercategorie met
      geuremissiefactor niet toeneemt en de geurbelasting die de inrichting op enig geurgevoelig object veroorzaakt niet
      toeneemt;

      b. bij een dierenverblijf als bedoeld in [artikel 3.116][ref3] het aantal dieren per diercategorie met
      geuremissiefactor niet toeneemt, de geurbelasting die de inrichting op enig geurgevoelig object veroorzaakt niet
      toeneemt en de afstand tot een geurgevoelig object niet afneemt, indien die kleiner is dan de afstand, genoemd in
      artikel 3.116, eerste lid, of

      c. bij een dierenverblijf als bedoeld in [artikel 3.117][ref4] het aantal dieren per diercategorie zonder
      geuremissiefactor niet toeneemt en de afstand tot een geurgevoelig object niet afneemt, indien die kleiner is dan
      de afstand, genoemd in artikel 3.117, eerste lid.


