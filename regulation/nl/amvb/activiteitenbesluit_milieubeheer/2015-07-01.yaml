  - number: '2'
    text: |-
      Deze afdeling is van toepassing op degene die:

      a. een inrichting type A of een inrichting B drijft, of

      b. een inrichting type C drijft, voor zover deze afdeling betrekking heeft op activiteiten die verricht worden
      binnen de inrichting waarop [hoofdstuk 3][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '3'
  - number: '2.1'
    text: |-
      1 Degene die een inrichting drijft en weet of redelijkerwijs had kunnen weten dat door het in werking zijn dan
      wel het al dan niet tijdelijk buiten werking stellen van de inrichting nadelige gevolgen voor het milieu ontstaan
      of kunnen ontstaan, die niet of onvoldoende worden voorkomen of beperkt door naleving van de bij of krachtens dit
      besluit gestelde regels, voorkomt die gevolgen of beperkt die voor zover voorkomen niet mogelijk is en voor zover
      dit redelijkerwijs van hem kan worden gevergd.

      2 Onder het voorkomen of beperken van het ontstaan van nadelige gevolgen voor het milieu als bedoeld in het eerste
      lid wordt verstaan:

      a. een doelmatig gebruik van energie;

      b. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van bodemverontreiniging;

      c. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van het
      grondwater;

      d. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de verontreiniging van
      een oppervlaktewaterlichaam;

      e. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van luchtverontreiniging;

      f. het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van geluidhinder;

      g. het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van geurhinder;

      h. het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van lichthinder;

      i. het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van stofhinder;

      j. het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van
      trillinghinder;

      k. het voorkomen dan wel voor zover dat niet mogelijk is het beperken van de nadelige gevolgen voor het milieu van
      het verkeer van personen en goederen van en naar de inrichting;

      l. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan;

      m. het zorgen voor een goede staat van onderhoud van de inrichting;

      n. de bescherming van de doelmatige werking van de voorzieningen voor het beheer van afvalwater;

      o. het doelmatig beheer van afvalwater;

      p. het doelmatig beheer van afvalstoffen;

      q. het beschermen van de duisternis en het donkere landschap in door het bevoegd gezag aangewezen gebieden.

      3 Het eerste en tweede lid, onderdelen b, c, d, n, o en p, zijn van overeenkomstige toepassing op degene die,
      anders dan vanuit een inrichting, loost ten gevolge van agrarische activiteiten dan wel activiteiten die daarmee
      verband houden.

      4 Het bevoegd gezag kan met betrekking tot de verplichting, bedoeld in het eerste en derde lid,
      maatwerkvoorschriften stellen voor zover het betreffende aspect bij of krachtens dit besluit niet uitputtend is
      geregeld. Deze maatwerkvoorschriften kunnen mede inhouden dat de door degene die de inrichting drijft dan wel
      degene die loost, te verrichten activiteiten worden beschreven alsmede dat metingen, berekeningen of tellingen
      moeten worden verricht ter bepaling van de mate waarin de inrichting dan wel het lozen, bedoeld in het derde lid,
      nadelige gevolgen voor het milieu veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.1
  - number: 2.1a
    text: |-
      Deze afdeling is van toepassing op degene die:

      a. een inrichting type A of een inrichting B drijft, of

      b. een inrichting type C drijft, voor zover deze afdeling betrekking heeft op activiteiten die verricht worden
      binnen de inrichting waarop [hoofdstuk 3][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.1a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '3'
  - number: '2.2'
    text: |-
      1 Het is verboden:

      a. afvalwater te lozen op of in de bodem, tenzij het lozen is toegestaan bij of krachtens de
      [artikelen 2.2b][ref1], [3.1 tot en met 3.5][ref2], [3.6a][ref3], [3.10k][ref4], [3.16h][ref5], [3.23d][ref6],
      [3.24][ref7], [3.32 tot en met 3.34][ref8], [3.47][ref9], [3.60][ref10], [3.61][ref11], [3.62][ref12],
      [3.77][ref13], [3.87][ref14], [3.100][ref15], [3.102][ref16], [3.105][ref17], [3.129][ref18], [3.131][ref19],
      [3.150][ref20], [4.74c][ref21], [4.104][ref22], [4.104b][ref23] en [4.104c][ref24],

      b. afvalwater en andere afvalstoffen te lozen in een voorziening voor de inzameling en het transport van afvalwater
      niet zijnde een vuilwaterriool, tenzij het lozen is toegestaan bij of krachtens de [artikelen 2.2b][ref25],
      [3.1 tot en met 3.3][ref26], [3.6a][ref27], [3.60][ref28], [3.61][ref29], [3.62][ref30], [3.150][ref31],
      [4.74c][ref32] en [4.104e][ref33].

      2 In afwijking van het eerste lid, onder a, is lozen op of in de bodem verboden, indien daarbij stoffen zonder
      doorsijpeling door bodem of ondergrond in het grondwater geraken.

      3 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat het eerste en tweede lid niet van toepassing zijn
      en dat lozen op of in de bodem of in een voorziening voor de inzameling en het transport van afvalwater niet
      zijnde een vuilwaterriool is toegestaan indien het belang van de bescherming van het milieu zich gelet op de
      samenstelling, hoeveelheid en eigenschappen van de lozing daartegen niet verzet.

      4 Bij maatwerkvoorschrift als bedoeld in het derde lid kunnen voorwaarden worden gesteld met betrekking tot:

      a. de samenstelling, eigenschappen of hoeveelheid van de lozing en het meten en registreren daarvan;

      b. te treffen maatregelen;

      c. de duur van de lozing; en

      d. de plaats van het lozingspunt.

      5 Het eerste lid, onder a, en het tweede lid zijn niet van toepassing op lozen in de bodem waaraan in een
      vergunning op grond van [artikel 6.4][ref34] of [artikel 6.5, onderdeel b, van de Waterwet][ref35], dan wel een
      vergunning op grond van een verordening van het waterschap voorschriften zijn gesteld.

      6 Indien een maatwerkvoorschrift als bedoeld in het derde lid een lozing betreft die aanzienlijke
      gevolgen voor het milieu kan hebben, is op de voorbereiding van het maatwerkvoorschrift
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref36] van toepassing.


