  - number: '4.74'
    text: |-
      1 Bij maatwerkvoorschrift kan het bevoegd gezag [artikel 4.73, eerste lid][ref1], niet van toepassing verklaren en
      hogere gehalten vaststellen dan de gehalten, bedoeld in dat lid.

      2 Het bevoegd gezag kan een maatwerkvoorschrift als bedoeld in het eerste lid slechts vaststellen indien:

      a. de som van de vrachten van de metalen chroom, koper, nikkel, lood, zink, tin en zilver na het proces maar voor
      de eindzuivering minder dan 200 gram per dag bedraagt, of de gehalten genoemd in kolom A van tabel 4.73 niet met
      de best beschikbare technieken kunnen worden bereikt, met dien verstand dat het bij maatwerkvoorschrift toegestane
      gehalte niet meer bedraagt dan de gehalten genoemd in kolom B van tabel 4.73;

      b. aannemelijk is dat de som van de vrachten van de metalen chroom, koper, nikkel, lood, zink, tin en zilver
      na het proces maar voor de eindzuivering minder dan 80 gram per dag bedraagt, met dien verstande dat het bij
      maatwerkvoorschrift toegestane som van de gehaltes van de metalen chroom, koper, nikkel, lood, zink, tin en zilver
      niet meer bedraagt dan 15 milligram per liter indien het de som van de metalen in een representatief etmaalmonster
      betreft of niet meer dan 45 milligram per liter indien het de som van de gehaltes van deze metalen in een
      steekmonster betreft.

      3 Het te lozen afvalwater, bedoeld in het tweede lid, kan op een doelmatige wijze worden bemonsterd.


