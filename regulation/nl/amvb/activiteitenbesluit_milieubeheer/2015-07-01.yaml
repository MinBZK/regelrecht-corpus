      het [Besluit textielreinigingsbedrijven milieubeheer][ref8], het [Besluit jachthavens milieubeheer][ref9], het
      Besluit motorvoertuigen milieubeheer of het [Besluit glastuinbouw][ref10] van toepassing was, en

      b. die voor de inwerkingtreding van het in onderdeel a genoemde besluit dat van toepassing was, is opgericht.

      2 De etmaalwaarde die het bevoegd gezag vaststelt op grond van [artikel 2.20, eerste lid][ref11], is niet lager
      dan 40 dB(A) voor een inrichting waarop onmiddellijk voorafgaand aan de inwerkingtreding van dit besluit het
      [Besluit tankstations milieubeheer][ref12] of het [Besluit tandartspraktijken milieubeheer][ref13] van toepassing
