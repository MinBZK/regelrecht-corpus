        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '4.47'
    text: |-
      1 Op verzoek van het bevoegd gezag overlegt degene die de inrichting drijft waar metalen worden gesoldeerd
      informatie ten aanzien van:

      a. de samenstelling en het jaarverbruik van de verschillende vloeimiddelen en soldeermaterialen, gesorteerd naar de
      verschillende procesvormen;

      b. een overzicht van de aard en omvang van de gasvormige emissies naar de lucht die bij het solderen vrijkomen.

      2 Het eerste lid, onderdeel b, is niet van toepassing indien het jaarverbruik van vloeimiddelen niet meer bedraagt
      dan 100 kilogram.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.47
  - number: '4.48'
    text: |-
      Bij het solderen van metalen worden ten behoeve van het voorkomen dan wel beperken van diffuse emissies en het
      doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling te bepalen maatregelen
      toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.48
  - number: 4.48a
    text: Deze paragraaf is van toepassing op het stralen van metalen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.48a
  - number: '4.49'
    text: |-
      1 Het is verboden om in de buitenlucht straalwerkzaamheden te verrichten.

      2 Het eerste lid is niet van toepassing indien het niet mogelijk is om in het inpandige deel van de inrichting te
      stralen vanwege de omvang van het te stralen object.

      3 Bij het stralen in de buitenlucht wordt ten behoeve van het voorkomen van stofhinder voldaan aan bij ministeriële
      regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.49
  - number: '4.50'
    text: |-
      1 Onverminderd de [artikelen 2.5 tot en met 2.6][ref1] is bij straalwerkzaamheden de emissieconcentratie van:

      a. stofklasse S niet meer dan 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar
      de lucht gelijk is aan of groter is dan 200 gram per uur, en niet meer dan 50 milligram per normaal kubieke meter
      indien de massastroom kleiner is dan 200 gram per uur;

      b. MVP1 stoffen niet meer dan 0,05 milligram per normaal kubieke meter, indien de massastroom van de MVP1 stoffen
      naar de lucht groter is dan 0,15 gram per uur;

      c. sA.1 stoffen niet meer dan 0,05 milligram per normaal kubieke meter, indien de massastroom van de sA.1 stoffen
      naar de lucht groter is dan 0,25 gram per uur;

      d. sA.2 stoffen niet meer dan 0,5 milligram per normaal kubieke meter, indien de massastroom van de sA.2 stoffen
      naar de lucht groter is dan 2,5 gram per uur;

      e. sA.3 stoffen niet meer dan 5,0 milligram per normaal kubieke meter, indien de massastroom van de sA.3 stoffen
      naar de lucht groter is dan 10 gram per uur;

      f. sO stoffen niet meer dan 5,0 milligram per normaal kubieke meter, indien de massastroom van de sO stoffen naar
      de lucht gelijk is aan of groter is dan 100 gram per uur, en niet meer dan 50 milligram per normaal kubieke meter
      indien de massastroom kleiner is dan 100 gram per uur.

      2 Het eerste lid is niet van toepassing indien de straalwerkzaamheden op grond van
      [artikel 4.49, tweede lid][ref2], in de buitenlucht worden verricht.

      3 Bij het stralen van metalen worden ten behoeve van het voorkomen dan wel beperken van diffuse emissies en
      het doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling te bepalen maatregelen
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.49
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.50
