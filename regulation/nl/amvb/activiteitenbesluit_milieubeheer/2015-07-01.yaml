  - number: '4.43'
    text: |-
      Bij het lassen van metalen worden ten behoeve van het voorkomen dan wel beperken van diffuse emissies en het
      doelmatig verspreiden van emissies naar de buitenlucht de bij ministeriële regeling te bepalen maatregelen
      toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.43
  - number: 4.43a
    text: Deze paragraaf is van toepassing op het solderen van metalen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.43a
  - number: '4.44'
    text: |-
      1 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij solderen de emissieconcentratie van stofklasse S niet
      meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur; en

      b. niet meer dan 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.

      2 Het eerste lid is niet van toepassing op zachtsolderen indien het jaarverbruik van soldeermiddel minder bedraagt
      dan 250 ton.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.44
