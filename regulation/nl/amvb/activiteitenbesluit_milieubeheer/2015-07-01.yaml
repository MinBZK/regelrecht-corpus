  - number: '2.30'
    text: |-
      1 Stoffen of mengsels waaraan een of meer van de gevarenaanduidingen H340, H350, H350i, H360D of H360F of de
      risicozinnen R45, R46, R49, R60 en R61 is of zijn toegekend of die van deze aanduidingen moeten zijn voorzien
      wegens hun gehalte aan vluchtige organische stoffen die krachtens de EG-verordening indeling, etikettering en
      verpakking van stoffen en mengsels als kankerverwekkend, mutageen of giftig voor de voortplanting zijn ingedeeld,
      worden voor zover mogelijk binnen zo kort mogelijke tijd vervangen door naar hun aard minder schadelijke stoffen
      of mengsels.

      2 De emissies van:

      a. vluchtige organische stoffen als bedoeld in het eerste lid en

      b. gehalogeneerde vluchtige organische stoffen waaraan de gevarenaanduidingen H341 of H351 of de risicozinnen R40
      of R68 zijn toegekend, of die van deze aanduidingen moeten zijn voorzien,

      overschrijden de emissiegrenswaarden van tabel 2.30 niet. De emissiegrenswaarden gelden voor de totale massa van de
      betrokken stoffen.


