  - number: '3.72'
    text: |-
      1 De volgende gegevens ten aanzien van de teelt worden gemeten of berekend en geregistreerd:

      a. de hoeveelheid voedingswater in kubieke meter die wordt toegediend;

      b. de hoeveelheid drainagewater in kubieke meter die wordt hergebruikt;

      c. de hoeveelheid drainagewater in kubieke meter die wordt geloosd;

      d. het gehalte aan nitraatstikstof en ammoniumstikstof en totaal fosfor in het te lozen drainagewater;

      e. per gewas of groep van gewassen met eenzelfde bemestingsniveau, het gehalte aan totaal stikstof en totaal fosfor
      in de bodem op basis van een representatief grondmonster;

      f. na elk gebruik de hoeveelheid in kilogram per hectare toegediende meststoffen onder vermelding van de
      samenstelling van de meststof;

      g. het gewas of de gewassen die worden geteeld en het teeltoppervlak per gewas en de teeltperiode, en

      h. jaarlijks de op 1 januari aanwezige meststoffen onder vermelding van de merknaam zoals die op de verpakking is
      vermeld, de naam en het adres van de leveranciers en de hoeveelheid, uitgedrukt in kilogrammen of liters.

      2 Indien op grond van [artikel 3.63, eerste lid][ref1], drainagewater zowel in het vuilwaterriool als in een
      oppervlaktewaterlichaam wordt geloosd, kan het bevoegd gezag bij maatwerkvoorschrift bepalen dat beide hoeveelheden
      worden gemeten en geregistreerd overeenkomstig het eerste lid.

      3 Bij ministeriële regeling worden nadere regels gesteld over het meten, berekenen en registreren.

      4 De resultaten van de metingen, berekeningen, en registraties, bedoeld in het eerste lid en van de metingen en
      registraties, bedoeld in het tweede lid, worden gedurende 5 jaren bewaard en op een daartoe strekkend verzoek aan
      het bevoegd gezag overgelegd.


