  - number: '3.120'
    text: |-
      Het aantal aanwezige dieren per diersoort wordt ten minste een keer per maand geregistreerd, waarbij de perioden
      tussen de registraties van een vergelijkbare tijdsduur zijn. De registraties zijn binnen de inrichting aanwezig en
      worden gedurende tien jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.120
  - number: '3.121'
    text: |-
      De geurbelasting, bedoeld in deze paragraaf, wordt bepaald en de afstanden, bedoeld in deze paragraaf, worden
      gemeten op de wijze die in de regeling op grond van [artikel 10 van de Wet geurhinder en veehouderij][ref1] is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel10
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.121
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '10'
  - number: '3.122'
    text: |-
      Bij het houden van landbouwhuisdieren in een dierenverblijf wordt, ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.122
  - number: '3.123'
    text: |-
      1 Ten behoeve van de goede werking van een huisvestingssysteem en het voorkomen dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van emissies naar de lucht, wordt ten minste voldaan aan het tweede en
      derde lid.

      2 Een huisvestingssysteem is uitgevoerd overeenkomstig de bij dat huisvestingssysteem
      behorende technische beschrijving, bedoeld in de bijlage bij de regeling op grond van
      [artikel 1 van de Wet ammoniak en veehouderij][ref1].

      3 Degene die een inrichting drijft waarin landbouwhuisdieren worden gehouden in een huisvestingssysteem, draagt er
      zorg voor dat het huisvestingssysteem wordt gebruikt en onderhouden overeenkomstig de voorwaarden die noodzakelijk
      zijn voor een goede werking van het huisvestingssysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.123
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '1'
  - number: '3.124'
    text: |-
      Indien landbouwhuisdieren worden gehouden in een huisvestingssysteem dat is voorzien van een luchtwassysteem,
      voldoet het luchtwassysteem, onverminderd [artikel 3.123][ref1], in het belang van de goede werking van het
      luchtwassysteem en van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      emissies naar de lucht, ten minste aan de artikelen [3.125][ref2] en [3.126][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.123
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.125
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel3.126
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.124
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3.123'
        hoofdstuk: '3'
        paragraaf: 3.5.8
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3.125'
        hoofdstuk: '3'
        paragraaf: 3.5.8
        afdeling: '3.5'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '3.126'
        hoofdstuk: '3'
        paragraaf: 3.5.8
        afdeling: '3.5'
  - number: '3.125'
    text: |-
      1 De capaciteit van het luchtwassysteem is ten minste gelijk aan de totale maximale ventilatiebehoefte van het
      aantal en de categorie landbouwhuisdieren die worden gehouden in het huisvestingssysteem.

      2 Bij ministeriële regeling kan worden bepaald op welke wijze de capaciteit en de totale maximale
      ventilatiebehoefte worden vastgesteld en vastgelegd.

      3 Ten behoeve van een evenredige verdeling van de stallucht door het luchtwassysteem, wordt voldaan aan de bij
      ministeriële regeling gestelde eisen.

      4 Het luchtwassysteem is voorzien van een elektronisch monitoringssysteem, waarmee de parameters die van belang
      zijn voor een goede werking van het luchtwassysteem worden geregistreerd.

      5 Bij ministeriële regeling worden regels gesteld over het elektronisch monitoringssysteem en wordt bepaald welke
      parameters in ieder geval worden geregistreerd.

      6 Indien uit de registratie, bedoeld in het vijfde lid, blijkt dat de parameters worden overschreden, worden
      onmiddellijk maatregelen getroffen om een goede werking van het luchtwassysteem te waarborgen.

      7 Ten aanzien van het gebruik en onderhoud van een luchtwassysteem, worden gedragsvoorschriften opgesteld, die ten
      minste voldoen aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.125
  - number: '3.126'
    text: |-
      1 Bij het lozen van spuiwater van een luchtwassysteem wordt ten minste voldaan aan het tweede tot en met vierde
      lid.

      2 Het lozen van spuiwater afkomstig van een luchtwassysteem in een vuilwaterriool is verboden.

      3 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat het tweede lid niet van toepassing is en het lozen in
      een vuilwaterriool toestaan, indien het belang van de bescherming van het milieu zich niet tegen het lozen in een
      vuilwaterriool verzet. [Artikel 2.2, vierde lid][ref1], is van overeenkomstige toepassing.

      4 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
