  - number: 1.3b
    text: |-
      [Hoofdstuk 6 van de Waterwet][ref1] is mede van toepassing op handelingen waaromtrent regels zijn opgesteld bij of
      krachtens de [Wet gewasbeschermingsmiddelen en biociden][ref2], voor zover die handelingen plaatsvinden:

      a. bij het verrichten van agrarische activiteiten of activiteiten die daarmee verband houden;

      b. bij het lozen van koelwater.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.3b
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0021670
  - number: 1.3c
    text: |-
      Een bedrijfswoning, behorend tot of voorheen behorend tot een inrichting waar uitsluitend of in hoofdzaak
      agrarische activiteiten dan wel activiteiten die daarmee verband houden worden verricht, die op grond van het
      bestemmingsplan, de beheersverordening of, indien met toepassing van [artikel 2.12, eerste lid, van de Wabo][ref1]
      van het bestemmingsplan of de beheersverordening is afgeweken, de omgevingsvergunning door een derde bewoond mag
      worden, wordt met betrekking tot die inrichting voor de toepassing van het bij of krachtens dit besluit bepaalde
      beschouwd als onderdeel van die inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.3c
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.12'
  - number: '1.4'
    text: |-
      Een ieder die loost vanuit een inrichting type A, een inrichting type B of een inrichting type C, voldoet voor
      lozen als bedoeld in [artikel 6.1 van de Waterwet][ref1], aan de bij of krachtens dit besluit gestelde regels, met
      uitzondering van [afdeling 1.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6.1'
      - id: ref2
        bwb_id: BWBR0022762
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.4a
    text: |-
      Degene die anders dan vanuit een inrichting loost ten gevolge van agrarische activiteiten dan wel activiteiten die
      daarmee verband houden, voldoet aan de voor dat lozen bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.4a
  - number: 1.4b
    text: |-
      Degene die nabij een oppervlaktewaterlichaam voor agrarische activiteiten dan wel activiteiten die daarmee verband
      houden gewasbeschermingsmiddelen en biociden gebruikt, voldoet aan de bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.4b
  - number: '1.5'
    text: |-
      De bij of krachtens de [artikelen 3.78 tot en met 3.83][ref1] gestelde regels zijn niet van toepassing op het
      gebruik van gewasbeschermingsmiddelen, indien op grond van of krachtens [artikel 3 van de Plantenziektenwet][ref2]
      aan dat gebruik regels zijn gesteld en voor zover die regels niet verenigbaar zijn met de bij of krachtens dit
      besluit gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.78
      [ref2]: https://wetten.overheid.nl/BWBR0002075#Artikel3
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.5
