    text: |-
      Bij een melding als bedoeld in [artikel 1.10][ref1] wordt, indien sprake is van een lozing in het vuilwaterriool
      van zuurstofbindende stoffen met een jaargemiddelde vervuilingswaarde van 5.000 inwonerequivalenten of meer,
      inzicht gegeven in de spreiding van de lozing over het jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
