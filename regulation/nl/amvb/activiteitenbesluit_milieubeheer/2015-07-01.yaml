  - number: '4.63'
    text: |-
      Bij het elektrolytisch of stroomloos aanbrengen van metaallagen wordt ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.63
  - number: 4.63a
    text: Deze paragraaf is van toepassing op het drogen van metalen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.63a
  - number: '4.64'
    text: |-
      1 Bij het drogen van metalen is het gebruik van oplosmiddelen niet toegestaan.

      2 Indien degene die de inrichting drijft aantoont dat het niet mogelijk is om anders te drogen dan met behulp
      van oplosmiddelen kan het bevoegd gezag bij maatwerkvoorschrift het eerste lid niet van toepassing verklaren en
      het gebruik van oplosmiddelen bij het drogen van metalen onder voorwaarden toestaan. Deze voorwaarden beogen de
      nadelige gevolgen van het drogen met behulp van oplosmiddelen te voorkomen of indien dat niet mogelijk is, zoveel
      mogelijk te beperken voor zover dat redelijkerwijs mogelijk is. Daarbij wordt ervan uitgegaan dat in de inrichting
      ten minste de voor de inrichting in aanmerking komende beste beschikbare technieken worden toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.64
  - number: 4.64a
    text: Deze paragraaf is van toepassing op het aanbrengen van conversielagen op metalen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.64a
  - number: '4.65'
    text: |-
      1 Onverminderd de [artikelen 2.5 tot en met 2.6][ref1] is bij het chroomzuuranodiseren en het zwavelzuuranodiseren
      de emissieconcentratie van:

      a. chroom VI-verbindingen berekend als chroom, niet meer dan 0,1 milligram per normaal kubieke meter indien de
      massastroom van chroom VI-verbindingen naar de lucht berekend als chroom, groter is dan 0,5 gram per uur;

      b. zwavelzuur niet meer dan 3 milligram per normaal kubieke meter indien de massastroom van zwavelzuur naar de
      lucht groter is dan 15 gram per uur.

      2 Bij het aanbrengen van conversielagen op metalen worden ten behoeve van het voorkomen dan wel beperken van
      diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling te
      bepalen maatregelen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
