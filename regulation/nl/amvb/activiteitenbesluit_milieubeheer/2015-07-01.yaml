      1 De volgende gegevens van een luchtwassysteem worden ten minste eenmaal per week geregistreerd:

      a. de zuurgraad van het waswater;

      b. de meterstand van de urenteller van de waswaterpomp;

      c. de meterstand van de watermeter van de spuiwaterproductie in kubieke meter.

      2 De gegevens, bedoeld in het eerste lid, worden gedurende ten minste drie jaar in de inrichting bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel6.24u
  - number: 6.24v
    text: |-
      1 Binnen 18 maanden na het tijdstip van inwerkingtreding van dit artikel wordt een meting naar de emissiereductie
      van ammoniak uitgevoerd.

      2 Een meting als bedoeld in het eerste lid vindt plaats onder representatieve bedrijfscondities in de zomerperiode
      tussen 10.00 en 14.00 uur, waarbij de meting wordt uitgevoerd overeenkomstig paragraaf 3.7 van de NeR en volgens
      NEN 2826.

      3 Een afschrift van de rapportage van de meting wordt in de inrichting bewaard tot ten minste het tijdstip waarop
      twee jaren zijn verstreken na de eerstvolgende meting.

      4 Indien uit de meting blijkt dat niet wordt voldaan aan de emissiereductie van ammoniak, genoemd in de
      systeembeschrijving, op grond waarvan krachtens [artikel 1 van de Wet ammoniak en veehouderij][ref1] een
      emissiefactor voor dat huisvestingssysteem is vastgesteld, worden maatregelen getroffen om daar alsnog aan te
      voldoen en wordt binnen een jaar na het uitvoeren van de meting een herhalingsmeting uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel6.24v
