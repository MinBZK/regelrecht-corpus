      1 [Artikel 3.131, vierde lid][ref1], is niet van toepassing indien voor het tijdstip waarop dat artikel op de
      inrichting van toepassing werd een slibvangput en een vetafscheider zijn geplaatst die voldoen aan en worden
      gebruikt conform NEN 7087.

      2 Indien op een inrichting voor 1 januari 2008 een besluit als bedoeld in [artikel 6.43][ref2] van toepassing was
