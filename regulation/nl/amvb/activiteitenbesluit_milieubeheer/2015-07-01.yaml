  - number: '3.81'
    text: |-
      1 In afwijking van [artikel 3.80, eerste, tweede, vierde lid, onderdelen b en c, zesde en zevende lid][ref1],
      bedraagt de teeltvrije zone langs de oppervlaktewaterlichamen, aangewezen in de
      [bijlage bij artikel 3 van het Uitvoeringsbesluit Meststoffenwet][ref2] ten minste 500 centimeter.

      2 In afwijking van [artikel 3.80, eerste lid][ref3], kan het bevoegd gezag bij maatwerkvoorschrift bepalen dat het
      tweede lid van dat artikel van toepassing is, indien sprake is van teelt van bloembollen en bloemknollen gedurende
      een periode van twee of meer opeenvolgende seizoenen op een perceel.

      3 In afwijking van [artikel 3.80][ref4] kan het bevoegd gezag, indien sprake is van een talud dat breder is dan 200
      centimeter, bij maatwerkvoorschrift een smallere teeltvrije zone vaststellen.

      4 In afwijking van [artikel 3.80][ref5] kan het bevoegd gezag bij het lozen in een niet aangewezen
      oppervlaktewaterlichaam, indien het belang van de bescherming van het milieu daartoe noodzaakt, bij
      maatwerkvoorschrift een bredere teeltvrije zone vaststellen.


