  - number: '3.67'
    text: |-
      1 De volgende gegevens worden gemeten of berekend en geregistreerd:

      a. de hoeveelheid drainwater in kubieke meter die wordt geloosd en de hoeveelheid voedingswater die wordt
      toegediend;

      b. het gehalte aan nitraatstikstof en ammoniumstikstof en totaal fosfor, natrium en de geleidingswaarde in het
      drainwater, en

      c. het gewas of de gewassen die worden geteeld, het teeltoppervlak en de teeltperiode per gewas.

      2 Indien op grond van [artikel 3.63, eerste lid][ref1], drainwater zowel in het vuilwaterriool als in een
      oppervlaktewaterlichaam wordt geloosd, kan het bevoegd gezag bij maatwerkvoorschrift bepalen dat beide hoeveelheden
      worden gemeten en geregistreerd overeenkomstig het eerste lid.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over het meten, berekenen en registreren, bedoeld
      in het eerste lid.

      4 De resultaten van de metingen, berekeningen en registraties, bedoeld in het eerste lid, en van de metingen en
      registraties, bedoeld in het tweede lid, worden gedurende 5 jaren bewaard en op een daartoe strekkend verzoek aan
      het bevoegd gezag overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.63
