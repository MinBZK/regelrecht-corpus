      5 Het lozen, bedoeld in het eerste lid, in een vuilwaterriool is verboden.

      6 Indien lozen als bedoeld in het eerste lid in een oppervlaktewaterlichaam, op of in de bodem of in een
      voorziening voor de inzameling en het transport van afvalwater, niet zijnde een vuilwaterriool, redelijkerwijs niet
      mogelijk is:

      a. is, in afwijking van het vijfde lid, het lozen vanuit een proefbronnering in het vuilwaterriool toegestaan
      indien het gehalte aan onopgeloste stoffen niet meer bedraagt dan 300 milligram per liter;

      b. kan het bevoegd gezag bij maatwerkvoorschrift het vijfde lid niet van toepassing verklaren en het lozen vanuit
      een bodemsanering in een vuilwaterriool toestaan, indien het belang van de bescherming van het milieu zich gelet
      op de samenstelling, hoeveelheid en eigenschappen van het afvalwater niet tegen het lozen in een vuilwaterriool
      verzet. [Artikel 2.2, vierde lid][ref3], is van overeenkomstige toepassing.

      7 Het bevoegd gezag kan bij maatwerkvoorschrift afwijken van:

      a. de gehalten aan naftaleen en PAK’s, bedoeld in onderdelen b en c van het tweede en het derde lid, de
      emissiewaarden, bedoeld in onderdeel d van het tweede en het derde lid en de streefwaarden, bedoeld in het vierde
      lid, en hogere waarden of gehalten bepalen, indien genoemde waarden of gehalten niet door toepassing van beste
      beschikbare technieken kunnen worden bereikt en het belang van de bescherming van het milieu zich niet verzet tegen
      het lozen met een hogere waarde of een hoger gehalte;

      b. de gehalten aan naftaleen en PAK’s, bedoeld in onderdelen b en c van het tweede en het derde lid, en lagere
      waarden bepalen, indien het belang van de bescherming van het milieu tot het stellen van een lagere waarde
      noodzaakt;

      c. de waarden bedoeld in het tweede lid, onderdeel d, en lagere waarden bepalen indien vanuit een voorziening
      bedoeld in dat lid geloosd wordt in een niet-aangewezen oppervlaktewaterlichaam, of op of in de bodem en het belang
      van bescherming van het milieu noodzaakt tot het stellen van een lagere waarde.

      8 De lagere gehalten, bedoeld in het zevende lid, onderdeel c, worden niet lager vastgesteld dan:

      a. de waarden opgenomen in tabel 3.1b, indien geloosd wordt in een oppervlaktewaterlichaam;

      b. de streefwaarden, bedoeld in het vierde lid, indien geloosd wordt op of in de bodem.

      9 Het te lozen grondwater, bedoeld in het eerste lid, kan op een doelmatige wijze worden bemonsterd.


