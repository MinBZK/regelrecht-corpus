  - number: '4.98'
    text: |-
      1 Bij het meten van de immissieconcentratie van PER in de binnenlucht in een besloten ruimte van een gevoelig
      object, die geen deel uitmaakt van de inrichting, bedoeld in [artikel 4.96, vierde lid][ref1], door middel van de
      methode met continu registrerende meetapparatuur zijn het tweede tot en met tiende lid van toepassing.

      2 Er wordt gebruik gemaakt van continu registrerende meetapparatuur die een detectielimiet heeft van 0,1 milligram
      per normaal kubieke meter of lager.

      3 Er wordt gemeten gedurende ten minste een hele werkdag waarbij het begin van een meting ligt op ten minste een
      uur voor de start van de bedrijfsvoering en het einde van een meting ligt op een uur na het beëindigen van de
      bedrijfsvoering op die werkdag.

      4 De weekgemiddelde immissieconcentratie wordt berekend door de gemiddelde gemeten immissieconcentratie tijdens de
      bedrijfsvoering te vermenigvuldigen met het quotiënt van het totaal aantal bedrijfsuren op weekbasis en het totaal
      aantal uren in een week dat 168 uur bedraagt.

      5 De gemeten of berekende immissieconcentratie mag uitsluitend voor een besloten ruimte van een gevoelig object
      worden gecorrigeerd met de expositieduur op basis van de gemiddelde verblijfstijd in die besloten ruimte, die
      redelijkerwijs mag worden verondersteld.

      6 De te bemonsteren ruimte is een ruimte waar personen verblijven of werkzaam zijn en direct grenst aan de
      inrichting.

      7 De plaats van monsterneming wordt vrij in de betreffende ruimte gepositioneerd op een zodanige plaats dat gassen
      kunnen worden bemonsterd. De afstand tussen die plaats en een vloer, een wand en het plafond van de te bemonsteren
      ruimte is ten minste 50 centimeter.

      8 Gedurende de bemonsteringsperiode in de te bemonsteren ruimte mag geen gebruik worden gemaakt van
      oplosmiddelhoudende materialen.

      9 Het al dan niet aanwezig zijn van personen, de duur van die aanwezigheid, de wijze van ventileren en de duur
      daarvan gedurende een meting in de ruimte, worden in een verslag vastgelegd.

      10 Van een meting een verslag wordt gemaakt dat op het eerste verzoek van het bevoegd gezag wordt overgelegd en
      gedurende ten minste twee jaren na de eerstvolgende meting in de inrichting wordt bewaard.


