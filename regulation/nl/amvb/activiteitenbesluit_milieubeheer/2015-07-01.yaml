  - number: 6.20a
    text: |-
      1 In afwijking van de [artikelen 3.10a][ref1] of [3.10b][ref2], voldoet het rookgas van een ketelinstallatie
      met een nominaal vermogen kleiner dan 1 megawatt die voor 1 januari 2013 is geplaatst of in gebruik is genomen,
      totdat het tweede lid van toepassing wordt, aan de emissiegrenswaarden die onmiddellijk voorafgaand aan het
      tijdstip van de inwerkingtreding van dit artikel voor die installatie golden ingevolge het Besluit typekeuring
      verwarmingstoestellen luchtverontreiniging stikstofoxiden, dan wel aan de daarvan afwijkende emissiegrenswaarden,
      die voor die stookinstallatie golden ingevolge een daarvoor verleende omgevingsvergunning of ingevolge het derde of
      vierde lid.

      2 Het rookgas van een ketelinstallatie als bedoeld in het eerste lid, voldoet aan de in de [artikelen 3.10a][ref3]
      of [3.10b][ref4] genoemde emissiegrenswaarden vanaf het tijdstip dat:

      a. de branders zijn vervangen;

      b. wijzigingen zijn aangebracht die met nieuwbouw van de ketelinstallatie overeenkomen, of

      c. een wijziging wordt doorgevoerd, die leidt tot een toename van de emissies van de stoffen, genoemd in de
      [artikelen 3.10a][ref5] of [3.10b][ref6], met meer dan 10 procent.

      3 In afwijking van [artikel 3.10a][ref7] en onverminderd het eerste lid, voldoet het rookgas van een
      ketelinstallatie met een nominaal vermogen tussen de 500 kilowatt en de 1 megawatt waarin biomassa wordt of
      houtpellets voor zover het geen biomassa betreft worden verbrand, tot 1 januari 2015 aan de emissiegrenswaarden,
      herleid op rookgas met een volumegehalte aan zuurstof van 6%, genoemd in tabel 6.20a (1).


