  - number: '6.16'
    text: |-
      1 Tot het tijdstip van inwerkingtreding van [artikel 2.19][ref1] is dit artikel van toepassing.

      2 [Artikel 2.17][ref2] is niet van toepassing op inrichtingen die zijn gelegen in een concentratiegebied voor
      horeca-inrichtingen of in een concentratiegebied voor detailhandel en ambachtsbedrijven, dat bij of krachtens een
      verordening als zodanig is aangewezen.

      3 In een gebied als bedoeld in het tweede lid bedraagt het langtijdgemiddeld beoordelingsniveau, veroorzaakt door
      de in de inrichting aanwezige installaties en toestellen, alsmede door de in de inrichting verrichte werkzaamheden
      en activiteiten, in ieder geval niet meer:

      a. dan het in dat gebied heersende referentieniveau;

      b. dan de in tabel 6.16 aangegeven waarden binnen een woning of andere geluidsgevoelige gebouwen en terreinen.


            Tabel 6.16









                    07.00-19.00 uur


                    19.00-23.00 uur


                    23.00-07.00 uur






                    Langtijdgemiddeld beoordelingsniveau (L)


                    35 dB(A)


                    30 dB(A)


                    25 dB(A)




                    Maximaal geluidsniveau


                    55 dB(A)


                    50 dB(A)


                    45 dB(A)






      4 Voor de toepassing van dit artikel wordt verstaan onder referentieniveau: hoogste waarde van de in onderdeel a en
      b genoemde niveaus:

      a. het geluidsniveau, uitgedrukt in dB(A), dat gemeten over een bepaalde periode, gedurende 95% van de tijd wordt
      overschreden, exclusief de bijdrage van de inrichting zelf;

      b. het optredende equivalente geluidsniveau (L), veroorzaakt door wegverkeerbronnen minus 10 dB(A), met dien
      verstande dat voor de nachtperiode van 23.00 tot 07.00 uur alleen wegverkeerbronnen in rekening mogen worden
      gebracht met een intensiteit van meer dan 500 motorvoertuigen gedurende die periode.


