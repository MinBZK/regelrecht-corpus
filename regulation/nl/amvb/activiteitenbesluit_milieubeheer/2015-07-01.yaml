  - number: '5.18'
    text: |-
      1 De warmte die door het proces van thermische behandeling in een afvalverbrandings- of
      afvalmeeverbrandingsinstallatie wordt opgewekt wordt teruggewonnen, voor zover dit technisch en economisch haalbaar
      is.

      2 Het ontstaan van afvalverbrandingsresiduen bij de exploitatie van een verbrandingsinstallatie en de
      schadelijkheid daarvan worden tot een minimum beperkt. De afvalverbrandingsresiduen worden, indien passend, in de
      installatie zelf of daarbuiten hergebruikt.
