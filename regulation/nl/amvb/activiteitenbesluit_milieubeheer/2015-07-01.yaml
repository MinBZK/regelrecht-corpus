  - number: '2.3'
    text: |-
      1 Emissiemetingen ter controle op de naleving van de emissie-eisen voor het lozen worden uitgevoerd volgens:

      a. NEN 6966 of NEN-EN-ISO 17294-2 ten aanzien van arseen, barium, berylium, boor, cadmium, chroom, cobalt, ijzer,
      koper, molybdeen, nikkel, lood, seleen, tin, titaan, uranium, vanadium, zilver en zink, waarbij de ontsluiting van
      de elementen plaats vindt volgens NEN-EN-ISO 15587-1 en NEN 6961;

      b. NEN-EN-1483 ten aanzien van kwik;

      c. NEN-EN-ISO 14403 ten aanzien van vrij cyanide in afvalwater;

      d. NEN-EN-ISO 15680 ten aanzien van benzeen, tolueen, ethylbenzeen, xyleen en naftaleen;

      e. NEN 6401 ten aanzien van vluchtige organohalogeenverbindingen;

      f. NEN-EN-ISO 6468 ten aanzien van aromatische organohalogeenverbindingen;

      g. NEN-EN-ISO 10301 ten aanzien van chlooretheen (vinylchloride), dichloormethaan, tetrachlooretheen (PER),
      tetrachloormethaan, trichlooretheen, trichloormethaan, 1,1-dichloorethaan, 1,2-dichloorethaan, 1,2-dichlooretheen,
      cis-1,2-dichlooretheen, trans-1,2-dichlooretheen 1,1,1-trichloorethaan en 1,1,2-trichloorethaan;

      h. NEN 6676 ten aanzien van extraheerbare organohalogeenverbindingen;

      i. NEN-EN-ISO 9377-2 ten aanzien van olie;

      j. NEN-EN-ISO 17993 ten aanzien van polycyclische aromatische koolwaterstoffen;

      k. ISO 5815-1/2 of NEN-EN 1899-1/2 ten aanzien van het biochemisch zuurstof verbruik;

      l. NEN 6633 ten aanzien van het chemisch zuurstof verbruik;

      m. NEN-EN-ISO 13395 ten aanzien van nitrietstikstof en nitraatstikstof;

      n. NEN-ISO 5663 of NEN 6646 ten aanzien van organisch stikstof (Kjeldahlstikstof);

      o. NEN 6646, NEN-EN-ISO 11732 of NEN 6604 ten aanzien van ammoniumstikstof;

      p. NEN-ISO 5813 of NEN-ISO 5814 ten aanzien van het zuurstofgehalte;

      q. NEN-EN 872 ten aanzien van onopgeloste stoffen;

      r. NEN-EN-ISO 15681-1 en NEN-EN-ISO 15681-2 ten aanzien van fosfor totaal;

      s. NEN 6414 ten aanzien van temperatuur;

      t. NEN-ISO 11083 ten aanzien van chroom VI.

      2 De monstername ten behoeve van de emissiemetingen ter controle van de naleving van de emissie-eisen voor het
      lozen wordt uitgevoerd volgens NEN 6600-1 en de conservering van het monster wordt uitgevoerd volgens NEN-EN-ISO
      5667-3. Het monster wordt niet gefiltreerd en de onopgeloste stoffen worden meegenomen in de analyse.

      3 In afwijking van het eerste en tweede lid kunnen andere methoden voor emissiemetingen, monstername en
      conservering worden gebruikt, indien deze gelijkwaardig zijn aan de in die leden genoemde methoden.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.3
  - number: 2.3a
    text: |-
      Deze afdeling is van toepassing op degene die:

      a. een inrichting type A of een inrichting type B drijft, of

      b. een inrichting type C drijft, voor zover deze afdeling betrekking heeft op activiteiten die verricht worden
      binnen de inrichting waarop [hoofdstuk 3][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.3a
