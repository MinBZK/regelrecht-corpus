      1 [Artikel 3.12, zesde lid][ref1], is niet van toepassing op een gasdrukmeet- en regelstation:

      a. waarop onmiddellijk voorafgaand aan de inwerkingtreding van [artikel 3.12][ref2] het
      [Besluit voorzieningen en installaties milieubeheer][ref3] van toepassing was, is opgericht voor 1 december 2001 en
      waarvoor onmiddellijk voorafgaand aan de laatstgenoemde datum een vergunning in werking en onherroepelijk was; of

      b. dat voor de inwerkingtreding van [artikel 3.12][ref4] is opgericht en waarvoor onmiddellijk voorafgaand aan die
      datum een vergunning in werking en onherroepelijk was;

      voor zover de afstanden opgenomen in de vergunning afwijken van de afstanden, bedoeld in tabel 3.12.

      2 Ten aanzien van een gasdrukmeet- en regelstation als bedoeld in het eerste lid zijn de afstanden opgenomen in de
      vergunning van toepassing.

      3 Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot de veiligheid, voor die situatie, bedoeld
      in het eerste lid, voor zover de afstanden opgenomen in de vergunning afwijken van de afstanden, bedoeld in tabel
      3.12.


