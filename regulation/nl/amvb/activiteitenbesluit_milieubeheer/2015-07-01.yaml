  - number: 3.26g
    text: Deze paragraaf is van toepassing op een jachthaven met meer dan 50 ligplaatsen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.26g
  - number: 3.26h
    text: |-
      1 Bij het in het vuilwaterriool lozen van ingenomen bilgewater van pleziervaartuigen wordt ten minste voldaan aan
      het tweede tot en met het vierde lid.

      2 Het afvalwater bevat in enig steekmonster niet meer dan:

      a. 20 milligram olie per liter;

      b. 300 milligram onopgeloste stoffen per liter.

      3 In afwijking van het tweede lid, bedraagt het gehalte aan olie ten hoogste 200 milligram per liter in enig
      steekmonster, indien het afvalwater voorafgaand aan vermenging met ander afvalwater wordt geleid door een
      slibvangput en olieafscheider die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.

      4 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.26h
  - number: 3.26i
    text: |-
      1 In het belang van het doelmatig beheer van afvalstoffen worden in een jachthaven van gebruikers van de jachthaven
      in ieder geval de afvalstoffen, genoemd onder a tot en met d, ingenomen.

      a. Indien een jachthaven beschikt over meer dan 50 ligplaatsen en binnen de jachthaven het afleveren van vloeibare
      brandstoffen aan vaartuigen plaatsvindt, neemt de jachthaven in:

      1°. afgewerkte olie en smeervet van onderhoud aan pleziervaartuigen, en

      2°. olie- en vethoudend afval van onderhoud aan pleziervaartuigen.

      b. Indien een jachthaven beschikt over meer dan 50 ligplaatsen en binnen de jachthaven het niet beroepsmatig
      onderhouden of reparareren van pleziervaartuigen plaatsvindt, wordt in de jachthaven tevens ingenomen:

      1°. afgewerkte olie en smeervet van onderhoud aan pleziervaartuigen;

      2°. olie- en vethoudend afval van onderhoud aan pleziervaartuigen, en

      3°. afvalstoffen van reparatie- en onderhoudswerkzaamheden aan pleziervaartuigen, die niet beroepsmatig binnen de
      jachthaven worden uitgevoerd.

      c. Indien een jachthaven beschikt over meer dan 50 ligplaatsen, daaronder niet begrepen ligplaatsen uitsluitend
      bestemd voor pleziervaartuigen die geen binnenboordmotor hebben, wordt in de jachthaven tevens bilgewater
      ingenomen.

      d. Indien een jachthaven beschikt over meer dan 50 ligplaatsen, daaronder niet begrepen ligplaatsen uitsluitend
      bestemd voor pleziervaartuigen zonder een vaste afsluitbare verblijfsruimte, wordt in de jachthaven tevens
      huishoudelijk afvalwater en de inhoud van chemische toiletten ingenomen.

      2 Indien twee of meer jachthavens in elkaars onmiddellijke nabijheid zijn gelegen, wordt voldaan aan het eerste lid
      indien de voorzieningen gemeenschappelijk worden aangebracht en beheerd en daartoe een overeenkomst is gesloten. De
      overeenkomst wordt ter goedkeuring voorgelegd aan het bevoegd gezag.

      3 Indien een jachthaven in de onmiddellijke nabijheid is gelegen van een inrichting waarbinnen uitvoering wordt
      gegeven aan [titel 10.4 van de wet][ref1], wordt voldaan aan het eerste lid indien de voorzieningen van die
      inrichting voldoen aan het eerste lid en gemeenschappelijk worden gebruikt op grond van een overeenkomst tussen de
      jachthaven en de inrichting. De overeenkomst wordt ter goedkeuring voorgelegd aan het bevoegd gezag.

      4 Voor de inzameling, bedoeld in het eerste lid, wordt geen aparte financiële vergoeding gevraagd aan de gebruikers
      van de inrichting.

      5 Indien een jachthaven niet op grond van het eerste lid behoeft te beschikken over een voorziening voor de
      inzameling van een bepaalde categorie afvalstoffen, wordt binnen de jachthaven duidelijk aangegeven waar de
      gebruikers van de jachthaven hun afvalstoffen kunnen afgeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.26i
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 3.26j
    text: |-
      1 In afwijking van [artikel 3.26i, eerste lid][ref1], worden de afvalstoffen, genoemd in dat lid, in een jachthaven
      die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen ingenomen ongeacht het aantal ligplaatsen in die
      inrichting.

      2 Degene die een jachthaven drijft die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen, maakt bij de
      inning van het havengeld kenbaar welk aandeel daarvan bestemd is voor het instandhouden van de voorzieningen voor
      het in ontvangst nemen en verder beheren van afvalstoffen.

      3 Degene die een jachthaven drijft die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen, stelt, na
      overleg met betrokken partijen, eens in de drie jaar een passend plan vast voor het in ontvangst nemen en verder
      beheren van afvalstoffen, en legt dit plan ter goedkeuring voor aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26i
