  - number: '4.86'
    text: |-
      1 In afwijking van de [artikelen 4.32][ref1] en [4.39][ref2] is het niet beroepsmatig onderhouden en repareren van
      pleziervaartuigen in de buitenlucht bij een jachthaven toegestaan.

      2 In afwijking van de [artikelen 4.22][ref3], [4.28][ref4] en [4.53][ref5] vinden niet beroepsmatige
      verfspuitwerkzaamheden bij een jachthaven waarbij verf met een nevelspuit wordt opgebracht plaats in een daartoe
      bestemde ruimte.


