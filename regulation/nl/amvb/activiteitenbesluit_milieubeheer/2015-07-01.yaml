  - number: '1.6'
    text: |-
      1 Vrijstelling wordt verleend van de verboden, bedoeld in [artikel 6.2, eerste en tweede lid, van de Waterwet][ref1]
      voor:

      a. lozen vanuit een inrichting type A of een inrichting type B voor zover aan dat lozen regels zijn gesteld bij
      of krachtens de [artikelen 3.1 tot en met 3.5][ref2], [3.5e tot en met 3.5g][ref3], [3.6 tot en met 3.6b][ref4],
      [3.10k][ref5], [3.31][ref6], [3.32][ref7], [3.33][ref8], [3.34][ref9], [3.60 tot en met 3.64][ref10],
      [3.76 tot en met 3.91][ref11], [3.101][ref12], [3.102][ref13], [3.104][ref14], [3.105][ref15], [3.131][ref16],
      [3.138][ref17], [3.150][ref18], [3.152][ref19], [4.74c][ref20], [4.74k][ref21], [4.74n][ref22], [4.103g][ref23]
      en [4.104e][ref24];

      b. lozen vanuit een inrichting type C, voor zover aan dat het lozen regels zijn gesteld bij of krachtens
      de [artikelen 3.1 tot en met 3.5][ref25], [3.5e tot en met 3.5g][ref26], [3.6 tot en met 3.6b][ref27],
      [3.10k][ref28], [3.31][ref29], [3.32][ref30], [3.33][ref31], [3.34][ref32], [3.60 tot en met 3.64][ref33],
      [3.76 tot en met 3.91][ref34], [3.101][ref35], [3.102][ref36], [3.104][ref37], [3.105][ref38], [3.131][ref39],
      [3.138][ref40] en [3.150][ref41] en [3.152][ref42];

      c. lozen anders dan vanuit een inrichting afkomstig van agrarische activiteiten dan wel activiteiten die
      daarmee verband houden voor zover aan dat lozen regels zijn gesteld in de [artikelen 3.3][ref43], [3.31][ref44],
      [3.32][ref45], [3.33][ref46], [3.34][ref47], [3.60 tot en met 3.64][ref48], [3.76 tot en met 3.91][ref49],
      [3.101][ref50], [3.102][ref51], [3.104][ref52], [3.105][ref53].

      2 Het lozen, bedoeld in het eerste lid, waarbij niet wordt voldaan aan de bij of krachtens dit besluit gestelde
      regels en voorschriften is verboden.

      3 Van het verbod, bedoeld in [artikel 10.2, eerste lid, van de wet][ref54], wordt vrijstelling verleend voor lozen
      op of in de bodem anders dan vanuit een inrichting afkomstig van agrarische activiteiten dan wel activiteiten die
      daarmee samenhangen.

      4 De artikelen van dit besluit zijn, behoudens dit artikellid, niet van toepassing op het in een
      oppervlaktewaterlichaam:

      1°. in een werk aanbrengen of houden van bouwstoffen;

      2°. aanbrengen, verspreiden of tijdelijk opslaan van grond of baggerspecie alsmede het houden van die aangebrachte
      of tijdelijk opgeslagen grond of baggerspecie;

      3°. lozen afkomstig van het toepassen van bouwstoffen, grond of baggerspecie, waarop het
      [Besluit bodemkwaliteit][ref55] van toepassing is.

      5 Dit besluit is niet van toepassing op lozingen op of in de bodem waaraan regels zijn gesteld krachtens de
      [Mijnbouwwet][ref56].


