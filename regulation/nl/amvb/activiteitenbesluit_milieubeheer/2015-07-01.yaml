  - number: 3.16o
    text: |-
      Het verrichten van werkzaamheden ten behoeve van een gesloten bodemenergiesysteem vindt plaats overeenkomstig de
      daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocumenten door een persoon of instelling die
      daartoe beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16o
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.16p
    text: |-
      Zo spoedig mogelijk na de beëindiging van het in werking hebben van een gesloten bodemenergiesysteem wordt:

      a. de circulatievloeistof uit de buizen verwijderd, en

      b. het systeem, zonder daarbij het ondergrondse deel te verwijderen, zodanig opgevuld dat de werking van de
      oorspronkelijke waterscheidende lagen wordt hersteld.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16p
  - number: '3.17'
    text: |-
      1 Deze paragraaf is van toepassing op een inrichting voor het afleveren van vloeibare brandstof en gecomprimeerd
      aardgas aan motorvoertuigen voor het wegverkeer of het afleveren van vloeibare brandstof aan spoorvoertuigen.

      2 De voorschriften die bij of krachtens deze paragraaf gesteld worden aan het afleveren van vloeibare brandstof
      en gecomprimeerd aardgas aan motorvoertuigen voor het wegverkeer zijn tevens van toepassing op het afleveren van
      vloeibare brandstof en gecomprimeerd aardgas anders dan aan motorvoertuigen voor het wegverkeer en vaartuigen,
      indien dit plaats vindt bij een installatie waar ook wordt afgeleverd aan motorvoertuigen voor het wegverkeer.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.17
  - number: '3.18'
    text: |-
      1 De afleverzuil bij een aardgas-afleverstation voor het afleveren van gecomprimeerd aardgas aan motorvoertuigen
      voor het wegverkeer die aardgas als motorbrandstof gebruiken bevindt zich op een afstand van ten minste 10 meter
      van kwetsbare en beperkt kwetsbare objecten. Indien per etmaal meer dan 300 personenauto’s worden gevuld, bedraagt
      deze afstand 15 meter. Indien per etmaal meer dan 100 autobussen worden gevuld, bedraagt deze afstand 20 meter.
      De bufferopslag bevindt zich op een afstand van kwetsbare en beperkt kwetsbare objecten zoals aangegeven in tabel
      3.18.


            Tabel 3.18






                    Waterinhoud bufferopslag


                    Afstand






                    Minder dan 3000 liter


                    10 meter




                    Vanaf 3000 tot 5000 liter


                    15 meter




                    Meer dan 5000 liter


                    20 meter






      2 Een aardgas-afleverinstallatie voor het afleveren van gecomprimeerd aardgas aan motorvoertuigen voor het
      wegverkeer voldoet aan de bij ministeriële regeling te stellen eisen ten behoeve van het voorkomen van risico’s
      voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.18
  - number: '3.19'
    text: |-
      Het afleveren van vloeibare brandstof aan motorvoertuigen voor het wegverkeer of het afleveren van vloeibare
      brandstof aan spoorvoertuigen voldoet ten behoeve van:

      a. het realiseren van een verwaarloosbaar bodemrisico en het voorkomen dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van luchtverontreiniging, aan de bij ministeriële regeling te stellen eisen; en

      b. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan, ten minste aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.19
  - number: '3.20'
    text: |-
      1 Het afleveren van lichte olie aan motorvoertuigen voor het wegverkeer vindt plaats via een EU-systeem voor
      dampretour fase-II, indien:

      a. het debiet van lichte olie meer dan 500 kubieke meter per jaar bedraagt, of

      b. het debiet van lichte olie meer dan 100 kubieke meter per jaar bedraagt en de inrichting is gelegen onder
      permanent in gebruik zijnde woon- of werkruimten.

      2 Het eerste lid is niet van toepassing op inrichtingen die uitsluitend in verband met de vervaardiging en
      aflevering aan nieuwe motorvoertuigen voor het wegverkeer lichte olie afleveren.

      3 Een EU-systeem voor dampretour fase-II heeft:

      a. een afvangrendement van damp van lichte olie van 85%;

      b. een damp/lichte olie-verhouding van ten minste 0,95 en ten hoogste 1,05.

      4 Een EU-systeem voor dampretour fase-II:

      a. is voorzien van een keurmerk waaruit blijkt dat het is goedgekeurd overeenkomstig de bij ministeriële regeling
      aangewezen testprocedure voor dampretour fase-II door een keuringsinstantie, welke daartoe door de Raad voor
      Accreditatie is geaccrediteerd op grond van NEN-EN-ISO/IEC 17020, en

      b. voldoet aan de bij ministeriële regeling gestelde eisen ten behoeve van het voorkomen van risico’s voor de
      omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de
      risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan.

      5 Een EU-systeem voor dampretour fase-II wordt ten minste eenmaal per jaar op de goede werking gecontroleerd
      overeenkomstig de testprocedure, bedoeld in het vierde lid, onder a, door een onafhankelijke inspectie-instelling
      of ten minste eenmaal per drie jaar wanneer een automatisch bewakingssysteem is geïnstalleerd.

      6 Een automatisch bewakingssysteem als bedoeld in het vijfde lid is in staat om:

      a. storingen daarin en in het functioneren van het EU-systeem voor dampretour fase-II op te sporen;

      b. deze storingen te melden aan degene die de inrichting drijft, en

      c. de toevoer van lichte olie naar de afleverzuil automatisch te stoppen indien de storing niet binnen zeven dagen
      is verholpen.

      7 Indien bij de controle, bedoeld in het vijfde lid, afwijkingen worden geconstateerd, worden deze afwijkingen
      onverwijld opgeheven.

      8 Degene die de inrichting drijft, maakt door middel van een uithangbord, sticker of andere melding in de
      inrichting duidelijk zichtbaar dat een EU-systeem voor dampretour fase-II is geïnstalleerd.

      9 Het bevoegd gezag kan voor het afleveren van lichte olie aan motorvoertuigen voor het wegverkeer, in de gevallen
      dat het eerste lid niet van toepassing is, bij maatwerkvoorschrift eisen stellen ten behoeve van:

      a. het voorkomen van geurhinder ten gevolge van het afleveren van lichte olie, of

      b. het beperken van de emissie van benzeen ten gevolge van het afleveren van lichte olie.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.20
  - number: 3.20a
    text: Het inpandig afleveren van lichte olie vindt niet plaats.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.20a
  - number: '3.21'
    text: |-
      1 Op plaatsen waar vloeibare brandstof wordt afgeleverd, die metaalhoudende additieven bevat, wordt op een label
      aangegeven hoeveel metaalhoudende additieven de betrokken brandstof bevat. Dit label bevat in elk geval de tekst:
      Bevat metaalhoudende additieven. Het wordt duidelijk zichtbaar bevestigd op de plaats waar de informatie over
      de brandstofsoort is aangegeven en is van zodanige afmetingen en van een zodanig lettertype dat het duidelijk
      zichtbaar en gemakkelijk leesbaar is.

      2 Op of direct bij een afleverzuil die bestemd is voor het afleveren van vloeibare brandstof ten behoeve van
      openbare verkoop aan motorvoertuigen voor het wegverkeer die voor meer dan 5% bestaat uit ethanol, wordt duidelijk
      zichtbaar de volgende tekst vermeld: Deze brandstof bevat meer dan 5% biobrandstoffen en is niet geschikt voor
      motorvoertuigen die voor het gebruik daarvan niet zijn uitgerust.

      3 Indien op een afleverpunt van vloeibare brandstof voor motorvoertuigen voor het wegverkeer de doorzet aan lichte
      olie meer dan 500 kubieke meter per jaar bedraagt, is ten minste één afleverpunt aanwezig van lichte olie waaraan
      ten hoogste 5% ethanol is toegevoegd.

      4 Op of direct bij een afleverzuil die bestemd is voor het afleveren van vloeibare brandstof ten behoeve van
      openbare verkoop aan motorvoertuigen voor het wegverkeer die voor meer dan 10% bestaat uit biobrandstof, wordt
      duidelijk zichtbaar de volgende tekst vermeld: Deze brandstof bevat meer dan 10% biobrandstoffen en is niet
      geschikt voor motorvoertuigen die voor het gebruik daarvan niet zijn uitgerust.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.21
  - number: '3.22'
    text: |-
      1 Degene die de inrichting drijft neemt de resultaten van de metingen, keuringen en controles, bedoeld in
      [artikel 3.20][ref1] op in een installatieboek.

      2 Het installatieboek bevat tevens:

      a. een plattegrond op een schaal van ten minste één op tweehonderdvijftig aanduidende de uit- en inwendige
      samenstelling van de inrichting en toebehoren;

      b. alle bewijzen van gecertificeerde of geaccrediteerde aanleg en inspectie die op grond van dit besluit uitgevoerd
      worden.

      3 De resultaten van de metingen, keuringen en controles worden in ieder geval tot het beschikbaar zijn van de
      resultaten van de eerstvolgende meting, keuring dan wel controle, maar ten minste drie jaar opgenomen in het
      installatieboek.

      4 Het installatieboek wordt in de inrichting bewaard of binnen een termijn die wordt gesteld door het bevoegd gezag
      voor deze beschikbaar.

      5 Het eerste lid is niet van toepassing op een inrichting voor het afleveren van lichte olie anders dan voor de
      openbare verkoop.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.20
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.22
