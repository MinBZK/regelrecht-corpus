      7 De in tabel 3.12 genoemde afstanden voor een ondergronds dan wel semi-ondergronds station mogen worden gehalveerd
      indien het gasvoerende deel geheel ondergronds ligt. Kasten mogen tegen gebouwen worden geplaatst mits wordt
      voldaan aan de bepalingen van NEN 1059.

      8 Onverminderd het eerste tot en met zevende lid wordt voldaan aan de bij ministeriële regeling te stellen eisen
      ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.12
  - number: '3.13'
    text: |-
      1 Deze paragraaf is van toepassing op een windturbine of een combinatie van windturbines.

      2 De artikelen [2.17 tot en met 2.22][ref1] zijn niet van toepassing op een windturbine of een combinatie van
      windturbines.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.17
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.17'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: '3.14'
    text: |-
      1 Een windturbine wordt ten minste eenmaal per kalenderjaar beoordeeld op de noodzakelijke beveiligingen, onderhoud
      en reparaties door een deskundige op het gebied van windturbines.

      2 Indien wordt geconstateerd of indien het redelijk vermoeden bestaat dat een onderdeel of onderdelen van de
      windturbine een gebrek bezitten, waardoor de veiligheid voor de omgeving in het geding is, wordt de windturbine
      onmiddellijk buiten bedrijf gesteld en het bevoegd gezag daaromtrent geïnformeerd. De windturbine wordt eerst weer
      in bedrijf genomen nadat alle gebreken zijn hersteld.

      3 Indien een windturbine als gevolg van het in werking treden van een beveiliging buiten bedrijf is gesteld, wordt
      deze pas weer in werking gesteld nadat de oorzaak van het buiten werking stellen is opgeheven.

      4 Bij het inwerking hebben van een windturbine worden ten behoeve van het voorkomen of beperken van slagschaduw en
      lichtschittering de bij ministeriële regeling te stellen maatregelen toegepast.

      5 Een windturbine voldoet ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat
      ongewone voorvallen zich voordoen en de gevolgen hiervan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.14
  - number: 3.14a
    text: |-
      1 Een windturbine of een combinatie van windturbines voldoet ten behoeve van het voorkomen of beperken van
      geluidhinder aan de norm van ten hoogste 47 dB L en aan de norm van ten hoogste 41 dB L op de gevel van gevoelige
      gebouwen en bij gevoelige terreinen op de grens van het terrein.

      2 Onverminderd het eerste lid kan het bevoegd gezag bij maatwerkvoorschrift teneinde rekening te houden met
      cumulatie van geluid als gevolg van een andere windturbine of een andere combinatie van windturbines, normen met
      een lagere waarde vaststellen ten aanzien een van de windturbines of een combinatie van windturbines.

      3 In afwijking van het eerste lid kan het bevoegd gezag bij maatwerkvoorschrift in verband met bijzondere lokale
      omstandigheden normen met een andere waarde vaststellen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.14a
  - number: '3.15'
    text: |-
      1 De metingen van de geluidemissie ter bepaling van de bronsterkte van een windturbine of een combinatie van
      windturbines worden uitgevoerd overeenkomstig de bij ministeriële regeling te stellen eisen.

      2 De drijver van de inrichting registreert de bij ministeriële regeling te bepalen gegevens welke gedurende vijf
      kalenderjaren na dagtekening worden bewaard en ter inzage gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.15
  - number: 3.15a
    text: |-
      1 Het plaatsgebonden risico voor een buiten de inrichting gelegen kwetsbaar object, veroorzaakt door een
      windturbine of een combinatie van windturbines, is niet hoger dan 10-6 per jaar.

      2 Het plaatsgebonden risico voor een buiten de inrichting gelegen beperkt kwetsbaar object, veroorzaakt door een
      windturbine of een combinatie van windturbines, is niet hoger dan 10-5 per jaar.

      3 Ten behoeve van het bepalen van het plaatsgebonden risico, bedoeld in het eerste en tweede lid, kunnen bij
      ministeriële regeling afstanden worden vastgesteld, die minimaal aanwezig moeten zijn tussen een windturbine of een
      combinatie van windturbines en een buiten de inrichting gelegen kwetsbaar dan wel beperkt kwetsbaar object.

      4 Indien op grond van het derde lid afstanden zijn vastgesteld, worden die in acht genomen en zijn het eerste en
      tweede lid niet van toepassing.

      5 Bij ministeriële regeling kunnen regels worden gesteld over de berekening van het plaatsgebonden risico.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.15a
  - number: '3.16'
    text: |-
      Bij het in werking hebben van een installatie voor het doorvoeren, bufferen of keren van rioolwater worden ten
      behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van
      geurhinder de bij ministeriële regeling te stellen maatregelen genomen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16
  - number: 3.16a
    text: |-
      Deze paragraaf is van toepassing op het in werking hebben van een natte koeltoren die water in aërosolvorm in de
      lucht kan brengen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16a
  - number: 3.16b
    text: |-
      Bij het in werking hebben van een natte koeltoren wordt ten behoeve van het voorkomen van risico’s voor de omgeving
      en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van risico’s voor de
      omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan, ten minste voldaan aan de bij
      ministeriële regeling voorgeschreven maatregelen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16b
  - number: 3.16c
    text: |-
      1 Deze paragraaf is van toepassing op:

      a. het in werking hebben van een koelinstallatie met een inhoud van minimaal 12 kilogram aan natuurlijk
      koudemiddel, of

      b. een koelinstallatie met een inhoud van maximaal 1500 kilogram ammoniak.

      2 In deze paragraaf wordt verstaan onder «natuurlijk koudemiddel»: de toepassing als koudemiddel van
      koolstofdioxide, ammoniak of koolwaterstoffen niet zijnde een gereguleerde stof of een preparaat dat een
      zodanige stof bevat als bedoeld in het [Uitvoeringsbesluit EG-verordening ozonlaagafbrekende stoffen][ref1]
      dan wel een gefluoreerd broeikasgas of een preparaat dat een zodanig gas bevat als bedoeld in het
      [Besluit gefluoreerde broeikasgassen milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030095
      [ref2]: https://wetten.overheid.nl/BWBR0022857
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16c
    references:
      - id: ref1
        bwb_id: BWBR0030095
      - id: ref2
        bwb_id: BWBR0022857
  - number: 3.16d
    text: |-
      1 Een koelinstallatie met een natuurlijk koudemiddel voldoet ten behoeve van het voorkomen van risico’s voor
      de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de
      risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan, aan de bij
      ministeriële regeling gestelde eisen.

      2 Een ammoniakkoelsysteem voldoet ten minste aan de bij ministeriële regeling gestelde eisen.

      3 Een koelinstallatie als bedoeld in het eerste lid en een ammoniakkoelsysteem als bedoeld in het tweede lid,
      worden ten minste eenmaal per twee kalenderjaren gekeurd op het veilig functioneren, lekkages en energiezuinigheid.

      4 Een keuring als bedoeld in het derde lid, wordt verricht door een onafhankelijk deskundig persoon die van de
      keuring een rapport opmaakt dat hij aan de drijver van de inrichting ter beschikking stelt.

      5 Indien een keuring uitwijst dat de koelinstallatie onderhoud behoeft, vindt dat onderhoud binnen twee weken na de
      keuring plaats.

      6 Het meest recent opgestelde keuringsrapport en het meest recent opgestelde onderhoudsbewijs, waaruit blijkt
      wanneer, door wie en welke onderhoud is verricht, worden bewaard.

      7 Indien in een kunstijsbaan een ammoniakkoelinstallatie wordt toegepast, wordt een indirect ammoniakkoelsysteem
      als bedoeld in hoofdstuk 2.4 van PGS 13 toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16d
  - number: 3.16e
    text: |-
      Deze paragraaf is van toepassing op het in werking hebben van een wisselverwarmingsinstallatie met vloeibare
      bodembedreigende stoffen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16e
  - number: 3.16f
    text: |-
      Bij het in werking hebben van een wisselverwarmingsinstallatie wordt ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16f
  - number: 3.16g
    text: Deze paragraaf is van toepassing op het installeren en in werking hebben van een gesloten bodemenergiesysteem.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16g
  - number: 3.16h
    text: |-
      Het lozen van spoelwater ten gevolge van het boren ten behoeve van een gesloten bodemenergiesysteem op de bodem
      is toegestaan.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16h
  - number: 3.16i
    text: |-
      1 Indien een redelijk vermoeden bestaat dat in een gesloten bodemenergiesysteem lekkage optreedt, wordt het
      onmiddellijk buiten werking gesteld en wordt de circulatievloeistof daaruit onmiddellijk verwijderd, tenzij water
      zonder toevoegingen wordt gebruikt.

      2 Bij het opslaan van circulatievloeistof in een buffertank wordt de druk in het systeem continu gemeten en worden
      voorzieningen toegepast waarmee drukverlagingen kunnen worden gesignaleerd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16i
  - number: 3.16j
    text: |-
      1 De temperatuur van de circulatievloeistof in de retourbuis van een gesloten bodemenergiesysteem bedraagt niet
      minder dan –3°C en niet meer dan 30°C.

      2 In afwijking van het eerste lid kan het bevoegd gezag in het belang van een doelmatig gebruik van bodemenergie
      bij maatwerkvoorschrift een hogere temperatuur dan 30°C toestaan, indien het belang van de bescherming van de bodem
      zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16j
  - number: 3.16k
    text: |-
      1 Een gesloten bodemenergiesysteem bereikt uiterlijk vijf jaar na de datum van ingebruikneming een moment waarop
      geen sprake is van een warmteoverschot en herhaalt dit telkens uiterlijk vijf jaar na het laatste moment waarop die
      situatie werd bereikt.

      2 Van een warmteoverschot is sprake indien de hoeveelheid warmte groter is dan de hoeveelheid koude, die,
      uitgedrukt in MWh, vanaf de datum van ingebruikneming door het systeem aan de bodem zijn toegevoegd.

      3 Het bevoegd gezag kan in het belang van een doelmatig gebruik van bodemenergie bij maatwerkvoorschrift eisen
      stellen ter beperking van het koudeoverschot dat het systeem mag veroorzaken.

      4 In afwijking van het eerste lid kan het bevoegd gezag in het belang van een doelmatig gebruik van bodemenergie
      bij maatwerkvoorschrift een warmteoverschot toestaan, indien het belang van de bescherming van de bodem zich
      daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16k
  - number: 3.16l
    text: |-
      1 Het ontwerp van een gesloten bodemenergiesysteem is afgestemd op aard en omvang van de behoefte aan warmte of
      koude waarin het systeem voorziet.

      2 Een gesloten bodemenergiesysteem levert het energierendement dat bij een doelmatig gebruik en goed onderhoud kan
      worden behaald.

      3 Indien een gesloten bodemenergiesysteem een energierendement levert dat lager is dan in de melding bij
      de installatie is opgegeven, kan het bevoegd gezag de verplichting opleggen om binnen een daarbij bepaalde
      termijn onderzoek te verrichten of te laten verrichten waaruit blijkt of wordt voldaan aan het eerste lid,
      onderscheidenlijk tweede lid.

      4 Indien uit het onderzoek, bedoeld in het derde lid, blijkt dat niet wordt voldaan aan het eerste lid,
      onderscheidenlijk tweede lid, kan het bevoegd gezag de verplichting opleggen om binnen een daarbij bepaalde termijn
      de daarbij aangegeven maatregelen te treffen teneinde te voldoen aan het eerste lid, voor zover dit redelijkerwijs
      van hem kan worden gevergd, onderscheidenlijk het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16l
  - number: 3.16m
    text: |-
      1 Het in werking hebben van een gesloten bodemenergiesysteem leidt niet tot zodanige interferentie met een eerder
      geïnstalleerd gesloten of open bodemenergiesysteem, dat het doelmatig functioneren van een van de desbetreffende
      systemen kan worden geschaad.

      2 Bij de toepassing van het eerste lid wordt rekening gehouden met een eerder geïnstalleerd bodemenergiesysteem,
      indien:

      a. het een open bodemenergiesysteem betreft waarvoor een vergunning is verleend krachtens
      [artikel 6.4, eerste lid, onder b, van de Waterwet][ref1], of dat aan het bevoegd gezag is gemeld krachtens
      [artikel 6.6 van die wet][ref2];

      b. het een gesloten bodemenergiesysteem betreft, dat is geïnstalleerd:

      1°. voor het tijdstip van inwerkingtreding van [paragraaf 3.2.8][ref3], indien het
      in werking hebben van het systeem na dat tijdstip aan het bevoegd gezag is gemeld
      overeenkomstig [artikel 1.10][ref4] juncto [artikel 1.21a, derde lid][ref5], dan wel
      [artikel 1.10a, vijfde lid, van het Besluit lozen buiten inrichtingen][ref6];

      2°. na het tijdstip van inwerkingtreding van [paragraaf 3.2.8][ref7], indien de installatie
      overeenkomstig [artikel 1.10][ref8] juncto [artikel 1.21a, eerste lid][ref9], dan wel
      [artikel 1.10a, eerste lid, van het Besluit lozen buiten inrichtingen][ref10] aan het bevoegd gezag is gemeld of
      voor de installatie een omgevingsvergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.6
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
      [ref5]: https://wetten.overheid.nl/BWBR0022762#Artikel1.21a
      [ref6]: https://wetten.overheid.nl/BWBR0029789#Artikel1.10a
      [ref7]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref8]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
      [ref9]: https://wetten.overheid.nl/BWBR0022762#Artikel1.21a
      [ref10]: https://wetten.overheid.nl/BWBR0029789#Artikel1.10a
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.16m
