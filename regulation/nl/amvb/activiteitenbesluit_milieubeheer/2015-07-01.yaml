      In afwijking van [artikel 3.56, eerste lid][ref1], is een kas waarin assimilatiebelichting wordt toegepast
      tot 1 januari 2017 aan de bovenzijde voorzien van een lichtscherminstallatie waarmee ten minste 95% van de
      lichtuitstraling kan worden gereduceerd, indien deze lichtscherminstallatie is aangebracht voor 1 januari 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.56
