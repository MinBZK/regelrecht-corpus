  - number: '3.117'
    text: |-
      1 Het oprichten, uitbreiden of wijzigen van een dierenverblijf met dieren zonder geuremissiefactor vindt
      niet plaats, indien de afstand tussen enig binnen de inrichting gelegen dierenverblijf waar dieren zonder
      geuremissiefactor worden gehouden en een geurgevoelig object, na de oprichting, uitbreiding of wijziging:

      a. minder dan 100 meter bedraagt, indien het geurgevoelige object binnen de bebouwde kom is gelegen, of

      b. minder dan 50 meter bedraagt, indien het geurgevoelige object buiten de bebouwde kom is gelegen.

      2 Het eerste lid is niet van toepassing als bij de oprichting, uitbreiding of wijziging van een dierenverblijf
      het aantal dieren per diercategorie zonder geuremissiefactor binnen de inrichting niet toeneemt en de afstand van
      het dierenverblijf tot een geurgevoelig object niet afneemt, indien die kleiner is dan de afstand, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.117
  - number: '3.118'
    text: |-
      1 De [artikelen 3.115 tot en met 3.117][ref1] zijn niet van toepassing, voor zover bij verordening op grond
      van [artikel 6 van de Wet geurhinder en veehouderij][ref2] andere waarden of afstanden zijn vastgesteld.
      In dat geval vindt het oprichten, uitbreiden of wijzigen van een dierenverblijf niet plaats, indien na die
      oprichting, uitbreiding of wijziging de geurbelasting die de inrichting vanwege dierenverblijven waar dieren
      met geuremissiefactor worden gehouden veroorzaakt op geurgevoelige objecten, groter is dan de in de verordening
      vastgestelde belasting dan wel, indien binnen de inrichting de afstand tussen enig dierenverblijf waar dieren
      zonder geuremissiefactor worden gehouden en een geurgevoelig object kleiner is dan in de verordening vastgestelde
      afstand.

      2 [Artikel 3.115, tweede lid, onderdeel b][ref3], is van overeenkomstige toepassing, met dien verstande dat de
      totale geurbelasting na de uitbreiding niet meer bedraagt dan het gemiddelde van de in de verordening vastgelegde
      waarde en de geurbelasting die de inrichting voorafgaand aan het toepassen van de maatregel veroorzaakte.

      3 De tweede volzin van het eerste lid is niet van toepassing op het oprichten, uitbreiden of wijzigen
      van een dierenverblijf, indien voorafgaand aan het tijdstip waarop een aanhoudingsbesluit als bedoeld in
      [artikel 7 van de Wet geurhinder en veehouderij][ref4] is genomen, of indien een dergelijk aanhoudingsbesluit niet
      is genomen, voor het tijdstip dat een verordening als bedoeld in [artikel 6 van die wet][ref5] is vastgesteld, een
      vergunning op grond van [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref6]
      voor die oprichting of uitbreiding onherroepelijk is geworden.

      4 De tweede volzin van het eerste lid is niet van toepassing op het oprichten, uitbreiden of wijzigen van een
      dierenverblijf, indien:

      a. bij een dierenverblijf als bedoeld in [artikel 3.115][ref7] de geurbelasting die de inrichting op enig
      geurgevoelig object veroorzaakt niet toeneemt en het aantal dieren per diercategorie met geuremissiefactor binnen
      de inrichting niet toeneemt;

      b. bij een dierenverblijf als bedoeld in [artikel 3.116][ref8] de geurbelasting die de inrichting op enig
      geurgevoelig object veroorzaakt niet toeneemt en het aantal dieren per diercategorie met geuremissiefactor binnen
      de inrichting niet toeneemt en de afstand tot een geurgevoelig object niet afneemt, indien die kleiner is dan de
      afstand, bedoeld in het eerste lid, of

      c. bij een dierenverblijf als bedoeld in [artikel 3.117][ref9] het aantal dieren per diercategorie zonder
      geuremissiefactor binnen de inrichting niet toeneemt en de afstand tot een geurgevoelig object niet afneemt, indien
      die kleiner is dan de afstand, bedoeld in het eerste lid.


