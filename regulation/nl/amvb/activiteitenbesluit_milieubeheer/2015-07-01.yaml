  - number: '3.6'
    text: |-
      1 Deze paragraaf is van toepassing op het lozen van koelwater met een warmtevracht van 50.000 kilojoule of minder
      per seconde. Bij het lozen wordt ten minste voldaan aan het tweede tot en met het zevende lid.

      2 Het lozen van koelwater waaraan geen chemicaliën zijn toegevoegd in een oppervlaktewaterlichaam of in een
      voorziening voor de inzameling en het transport van afvalwater niet zijnde een vuilwaterriool, is toegestaan indien
      de warmtevracht niet meer bedraagt dan:

      a. 1000 Kilojoule per seconde, indien het een aangewezen oppervlaktewaterlichaam betreft;

      b. 10 Kilojoule per seconde, indien het een niet aangewezen oppervlaktewaterlichaam betreft.

      3 De warmtevracht van een koelwaterlozing wordt berekend als het product van:

      a. het lozingsdebiet van koelwater in kubieke meter per seconde;

      b. het verschil tussen de lozingstemperatuur en de temperatuur van het ontvangende oppervlaktewaterlichaam in
      graden Celsius;

      c. de warmtecapaciteit van het koelwater hetgeen gelijk is aan 4190 Kilojoule per kubieke meter per graad
      temperatuursverhoging.

      4 Het bevoegd gezag kan indien het belang van de bescherming van het milieu zich daartegen niet verzet, bij
      maatwerkvoorschrift het tweede lid niet van toepassing verklaren en het lozen van koelwater met een hogere
      warmtevracht dan bedoeld in het tweede lid of waaraan in beperkte mate chemicaliën zijn toegevoegd toestaan.

      5 Indien het lozen, bedoeld in het tweede lid, een temperatuurstijging zou veroorzaken die tot beperking van
      de warmtevracht noodzaakt, kan het bevoegd gezag bij maatwerkvoorschrift voor de warmtevracht lagere waarden
      vaststellen dan bedoeld in het tweede lid.

      6 Het lozen van koelwater als bedoeld in het tweede lid vindt slechts dan in een vuilwaterriool plaats indien het
      lozen van dat koelwater in een oppervlaktewaterlichaam of in een voorziening voor de inzameling en het transport
      van afvalwater niet zijnde een vuilwaterriool redelijkerwijs niet mogelijk is.

      7 De warmtevracht van een lozing van koelwater kan op een doelmatige wijze worden bepaald, dan wel door degene die
      de inrichting drijft aannemelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.6
  - number: 3.6a
    text: |-
      1 Bij het lozen ten gevolge van reinigingswerkzaamheden, conserveringswerkzaamheden of andere
      onderhoudswerkzaamheden aan vaste objecten wordt ten minste voldaan aan het tweede tot en met het vijfde lid.

      2 Indien bij de werkzaamheden, bedoeld in het eerste lid, lozen in een oppervlaktewaterlichaam kan plaatsvinden,
      worden bij ministeriële regeling aangegeven maatregelen getroffen om het in dat oppervlaktewaterlichaam lozen van
      stoffen, die bij de werkzaamheden worden gebruikt dan wel van het vast object vrijkomen, te voorkomen dan wel,
      voor zover dat redelijkerwijs niet mogelijk is, zoveel mogelijk te beperken. Indien voorkomen redelijkerwijs niet
      mogelijk is, is na het treffen van maatregelen bedoeld in de eerste volzin lozen in een oppervlaktewaterlichaam
      toegestaan.

      3 Het lozen in een vuilwaterriool is verboden, tenzij het lozen betreft als bedoeld in het vierde lid.

      4 Bij reinigingswerkzaamheden, die periodiek worden uitgevoerd en waarbij uitsluitend vuilafzetting wordt
      verwijderd, is het lozen van reinigingswater in een voorziening voor de inzameling en het transport van afvalwater
      en op of in de bodem toegestaan.

      5 Het bevoegd gezag kan bij maatwerkvoorschrift afwijken van het derde lid en het lozen ten gevolge van
      gevelreiniging en graffitiverwijdering in een vuilwaterriool toestaan, indien het belang van de bescherming van het
      milieu zich gelet op de samenstelling, hoeveelheid en eigenschappen van het afvalwater niet tegen het lozen in een
      vuilwaterriool verzet. [Artikel 2.2, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.6a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.2'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: 3.6b
    text: |-
      1 Bij het lozen in een oppervlaktewaterlichaam ten gevolge van sloop-, renovatie- of nieuwbouwwerkzaamheden aan
      vaste objecten wordt ten minste voldaan aan het tweede en derde lid.

      2 Het lozen, dat gelet op de locatie van de in het eerste lid bedoelde werkzaamheden redelijkerwijs niet kan worden
      voorkomen, is toegestaan.

      3 Bij de werkzaamheden, bedoeld in het eerste lid, worden maatregelen getroffen om het lozen te voorkomen dan wel,
      voor zover dat niet mogelijk is, zoveel mogelijk te beperken. De maatregelen worden beschreven in een werkplan.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.6b
  - number: '3.7'
    text: |-
      1 De [artikelen 3.10 tot en met 3.10j][ref1] en [6.20 tot en met 6.20c][ref2] inzake emissies naar de lucht zijn
      van toepassing op het in werking hebben van een gasmotor, gasturbine, ketelinstallatie of dieselmotor, tenzij het
      betreft:

      a. een gasmotor, gasturbine, ketelinstallatie of dieselmotor die blijkens een daarvoor aan de inrichting
      verleende omgevingsvergunning worden gebruikt voor het onderzoeken, beproeven of demonstreren van experimentele
      verbrandingstechnieken of van technieken ter bestrijding van de uitworp van zwaveldioxide (SO), stikstofoxiden (NO)
      of totaal stof;

      b. een gasmotor, gasturbine, ketelinstallatie of dieselmotor die een noodvoorziening is en ten hoogste 500 uren per
      jaar in gebruik is;

      c. een ketelinstallatie met een nominaal vermogen van minder dan 400 kilowatt waarin andere brandstoffen dan
      biomassa worden toegepast;

      d. een grote stookinstallatie;

      e. een afvalverbrandingsinstallatie of afvalmeeverbrandingsinstallatie waarop [paragraaf 5.2][ref3] van toepassing
      is, of

      f. een mobiele stookinstallatie.

      2 De [artikelen 3.10k][ref4], [3.10n][ref5] en [3.10o][ref6] inzake het doelmatig beheer van afvalwater, het
      realiseren van een verwaarloosbaar bodemrisico en het doelmatig beheer van afval, zijn van toepassing op het in
      werking hebben van een stookinstallatie, tenzij het betreft:

      a. een grote stookinstallatie;

      b. een afvalverbrandingsinstallatie of afvalmeeverbrandingsinstallatie waarop [paragraaf 5.2][ref7] van toepassing
      is, of

      c. een mobiele stookinstallatie.

      3 De [artikelen 3.10l][ref8] en [3.10m][ref9] inzake een doelmatig gebruik van energie, zijn van toepassing op
      inrichtingen waarin zich geen broeikasgasinstallaties als bedoeld in [artikel 16.1 van de wet][ref10] bevinden en
      waarbij sprake is van het gelijktijdig produceren van elektrische energie en thermische energie door middel van een
      warmtekrachtinstallatie, tenzij:

      a. het een warmtekrachtinstallatie betreft waarin vergistinggas wordt gebruikt;

      b. de warmtekrachtinstallatie een grote stookinstallatie betreft;

      c. de warmtekrachtinstallatie een afvalverbrandingsinstallatie of afvalmeeverbrandingsinstallatie betreft waarop
      paragraaf 5.2 van toepassing is, of

      d. de warmtekrachtinstallatie een mobiele stookinstallatie betreft.

      4 Artikel 3.10p inzake keuring en onderhoud van een stookinstallatie is van toepassing op het in werking hebben van
      een stookinstallatie, tenzij het betreft:

      a. een stookinstallatie die blijkens een daarvoor aan de inrichting verleende omgevingsvergunning wordt gebruikt
      voor het onderzoeken, beproeven of demonstreren van experimentele verbrandingstechnieken of van technieken ter
      bestrijding van de uitworp van zwaveldioxide (SO), stikstofoxiden (NO) of totaal stof;

      b. een stookinstallatie die een noodvoorziening is en ten hoogste 500 uren per jaar in gebruik is;

      c. een grote stookinstallatie;

      d. een afvalverbrandingsinstallatie;

      e. een afvalmeeverbrandingsinstallatie waarop [paragraaf 5.2][ref11] van toepassing is, of

      f. een mobiele stookinstallatie.

      5 Deze paragraaf is niet van toepassing op het stoken van stookinstallaties die ingevolge
      [bijlage I, onderdeel C, categorie 1.4, onder a, van het Besluit omgevingsrecht][ref12] er toe leiden, dat een
      inrichting vergunningplichtig is.


