  - number: '3.140'
    text: |-
      1 Een inrichting voor het vervaardigen of bewerken van voedingsmiddelen of dranken voor menselijke consumptie
      wordt uitsluitend opgericht of uitgebreid in capaciteit voor dat vervaardigen of bewerken indien nieuwe geurhinder
      ter plaatse van geurgevoelige objecten door die oprichting of uitbreiding wordt voorkomen. De eerste volzin is
      eveneens van toepassing op het wijzigen van de inrichting, indien die wijziging leidt tot een grotere of andere
      geurbelasting ter plaatse van een of meer geurgevoelige objecten.

      2 Het bevoegd gezag kan in afwijking van het eerste lid bij maatwerkvoorschrift een bepaalde mate van nieuwe
      geurhinder ter plaatse van geurgevoelige objecten toestaan, indien het belang van de bescherming van het milieu
      zich daartegen niet verzet. Bij het opstellen van het maatwerkvoorschrift neemt het bevoegd gezag de NeR in acht en
      houdt het rekening met vastgesteld lokaal beleid ten aanzien van geurhinder.

      3 Het bevoegd gezag kan, indien blijkt dat ten gevolge van het vervaardigen of bewerken van voedingsmiddelen
      of dranken voor menselijke consumptie de geurhinder ter plaatse van een of meer geurgevoelige objecten een
      aanvaardbaar niveau overschrijdt, met inachtneming van de NeR bij maatwerkvoorschrift bepalen dat een bepaalde
      geurbelasting ter plaatse van geurgevoelige objecten niet wordt overschreden, dan wel dat technische voorzieningen
      in de inrichting worden aangebracht of gedragsregels in de inrichting in acht worden genomen om de geurhinder tot
      een aanvaardbaar niveau te beperken.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.140
  - number: '3.141'
    text: |-
      1 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het vervaardigen of bewerken van voedingsmiddelen
      of dranken voor menselijke consumptie waarbij voedingsmiddelen of dranken of grondstoffen daarvan worden gedroogd,
      gemalen, gebrand of geroosterd of waarbij goederen behorend tot de stuifklasse S1, S2, S3 of S4 worden gemengd, de
      emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur, en

      b. 50 milligram per normaal kubieke meter, indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.

      2 Het bevoegd gezag kan in de gevallen, bedoeld in het eerste lid, indien het gaat om een emissie van hygroscopisch
      stof, indien de massastroom van stofklasse S naar de lucht gelijk is aan of groter is dan 200 gram per uur, indien
      de toepassing van een filtrerende afscheider technisch niet haalbaar is en indien het belang van de bescherming
      van het milieu zich daartegen niet verzet, bij maatwerkvoorschrift een hogere emissieconcentratie van stofklasse
      S toestaan. De emissieconcentratie die bij maatwerkvoorschrift wordt toegestaan, bedraagt ten hoogste 50 milligram
      per normaal kubieke meter.

      3 Bij maatwerkvoorschrift, bedoeld in het tweede lid, kunnen eisen worden gesteld met betrekking tot:

      a. het controleren van de emissieconcentratie van stofklasse S, of

      b. het onderhoud en de controle van een emissiebeperkende techniek die in de inrichting wordt ingezet om aan het
      maatwerkvoorschrift te voldoen.

      4 Bij het vervaardigen of bewerken van voedingsmiddelen of dranken voor menselijke consumptie waarbij
      voedingsmiddelen of dranken of grondstoffen daarvan worden gedroogd, gemalen, gebrand of geroosterd of waarbij
      goederen behorend tot de stuifklasse S1, S2, S3 of S4 worden gemengd, wordt ten behoeve van het voorkomen dan wel
      beperken van diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht voldaan aan de bij
      ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
