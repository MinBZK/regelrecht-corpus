  - number: 6.19a
    text: |-
      1 Voor een inrichting type C worden de voorschriften van een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1], gedurende
      drie jaar na het tijdstip van inwerkingtreding van [artikel 3.5a][ref2] aangemerkt als maatwerkvoorschriften,
      mits de voorschriften van die vergunning vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van
      maatwerkvoorschriften voor de activiteit, bedoeld in [paragraaf 3.1.4a][ref3].

      2 De voorschriften van een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref4], voor een
      inrichting type C die betrekking hebben op de activiteit, bedoeld in [paragraaf 3.1.4a][ref5] en onmiddellijk
      voorafgaand aan het tijdstip van inwerkingtreding van [artikel 3.5a][ref6] in werking waren en niet vallen binnen
      de bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften worden indien op grond van paragraaf
      3.1.4a van het besluit strengere bepalingen gelden gedurende zes maanden aangemerkt als maatwerkvoorschriften.


