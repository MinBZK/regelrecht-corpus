  - number: '2.23'
    text: |-
      1 Trillingen, veroorzaakt door de tot de inrichting behorende installaties of toestellen alsmede de tot
      de inrichting toe te rekenen werkzaamheden of andere activiteiten, bedragen in geluidsgevoelige ruimten en
      verblijfsruimten, met uitzondering van geluidsgevoelige ruimten en verblijfsruimten gelegen op een gezoneerd
      industrieterrein, niet meer dan de trillingsterkte, genoemd in tabel 2 van de Meet- en beoordelingsrichtlijn deel B
      «Hinder voor personen in gebouwen» van de Stichting Bouwresearch Rotterdam, voor de gebouwfunctie wonen.

      2 De waarden gelden niet indien de gebruiker van de geluidsgevoelige ruimten of verblijfsruimten geen toestemming
      geeft voor het in redelijkheid uitvoeren of doen uitvoeren van trillingmetingen.

      3 Het bevoegd gezag kan bij maatwerkvoorschrift het eerste lid niet van toepassing verklaren en een andere
      trillingsterkte toelaten. Deze trillingsterkte is niet lager dan de streefwaarden die zijn gedefinieerd voor de
      gebouwfunctie wonen in de Meet- en beoordelingsrichtlijn deel B «Hinder voor personen in gebouwen» van de Stichting
      Bouwresearch Rotterdam.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.23
  - number: 2.23a
    text: |-
      Deze afdeling is van toepassing op degene die een inrichting type B of een inrichting type C drijft, voor
      zover binnen de inrichting vloeibare brandstof of afgewerkte olie in een ondergrondse opslagtank waarop
      [artikel 3.29, aanhef en onderdeel a of b][ref1], van toepassing is, wordt opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.29
