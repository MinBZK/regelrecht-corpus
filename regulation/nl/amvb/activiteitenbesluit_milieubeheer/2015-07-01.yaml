  - number: '4.25'
    text: |-
      Bij het reinigen, coaten of lijmen van hout, kurk dan wel houten, kurken of houtachtige voorwerpen worden ten
      behoeve van:

      a. het voorkomen dan wel beperken van diffuse emissies;

      b. het voorkomen dan wel beperken van stofhinder;

      c. het doelmatig verspreiden van emissies naar de buitenlucht;

      d. het voorkomen dan wel beperken van geurhinder;

      e. het realiseren van een verwaarloosbaar bodemrisico,

      de bij ministeriële regeling te bepalen maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.25
  - number: '4.26'
    text: |-
      1 Bij het lozen van afvalwater afkomstig van het reinigen, coaten of lijmen van hout of kurk dan wel houten, kurken
      of houtachtige voorwerpen in een vuilwaterriool wordt ten minste voldaan aan het tweede tot en met vijfde lid.

      2 Het lozen van afvalwater, bedoeld in het eerste lid, is toegestaan indien het afvalwater niet meer bevat dan
      2 milligram lood per liter en 2 milligram zink per liter.

      3 De in eerste lid genoemde waarden gelden voor representatieve etmaalmonsters. Voor steekmonsters gelden een
      factor drie hogere waarden.

      4 In afwijking van het tweede lid wordt afvalwater dat meer dan 3 milligram vluchtige organohalogeenverbindingen
      uitgedrukt als chloor per liter in enig steekmonster bevat, niet geloosd.

      5 Het te lozen afvalwater, bedoeld in het tweede lid, kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.26
  - number: '4.27'
    text: |-
