  - number: '6.2'
    text: |-
      1 Voor het lozen vanuit een inrichting type A of B, waarvoor onmiddellijk voorafgaand aan het tijdstip van het
      van toepassing worden van dit besluit of een deel daarvan op een activiteit in die inrichting een vergunning op
      grond van [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref1] dan wel een vergunning op grond van
      [artikel 6.2 van de Waterwet][ref2] in werking en onherroepelijk was, worden de voorschriften van die vergunning
      gedurende drie jaar na het tijdstip van het van toepassing worden van dit besluit of een deel daarvan op een
      activiteit in die inrichting aangemerkt als maatwerkvoorschriften, mits de voorschriften van die vergunning vallen
      binnen de bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften.

      2 Het eerste lid is van overeenkomstige toepassing bij het van toepassing worden van dit besluit of een deel
      daarvan, met betrekking tot het lozen vanuit een inrichting type C, voor zover het lozen betrekking heeft op de
      activiteiten genoemd in [hoofdstuk 3][ref3].

      3 De nadere eisen die onmiddellijk voorafgaand aan het tijdstip van het van toepassing worden
      van dit besluit of een deel daarvan op een activiteit in een inrichting golden krachtens het
      [Lozingenbesluit Wvo huishoudelijk afvalwater][ref4], het [Lozingenbesluit bodemsanering en proefbronnering][ref5]
      of het [Lozingenbesluit open teelt en veehouderij][ref6] voor het lozen vanuit een inrichting, blijven na
      het tijdstip van het van toepassing worden van dit besluit of een deel daarvan op die inrichting gelden als
      maatwerkvoorschriften, mits de nadere eisen vallen binnen de reikwijdte van een maatwerkvoorschrift.

      4 De voorschriften van een vergunning dan wel de nadere eisen op grond van het
      [Lozingenbesluit Wvo huishoudelijk afvalwater][ref7], het [Lozingenbesluit bodemsanering en proefbronnering][ref8]
      of het [Lozingenbesluit open teelt en veehouderij][ref9] voor het lozen vanuit een inrichting, die voor een
      inrichting onmiddellijk voorafgaand aan het tijdstip van het van toepassing worden van dit besluit of een deel
      daarvan op een activiteit in die inrichting in werking en onherroepelijk waren en niet vallen binnen de bevoegdheid
      van het bevoegd gezag tot het stellen van maatwerkvoorschriften worden indien op grond van dit besluit strengere
      bepalingen gelden, gedurende zes maanden aangemerkt als maatwerkvoorschriften.

      5 Voor de toepassing van dit artikel worden gegevens die in de aanvraag staan en die geacht worden onderdeel te
      zijn van de voorschriften van de vergunning, aangemerkt als voorschriften van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
