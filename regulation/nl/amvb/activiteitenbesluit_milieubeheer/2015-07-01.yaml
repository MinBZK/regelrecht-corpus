  - number: '3.71'
    text: |-
      1 Voor de gietwatervoorziening:

      a. is een hemelwateropvangvoorziening van ten minste 500 kubieke meter per hectare teeltoppervlak aanwezig en in
      gebruik, of

      b. wordt water gebruikt met een natriumgehalte dat gelijkwaardig is aan dat van hemelwater.

      2 Het bevoegd gezag kan bij maatwerkvoorschrift het eerste lid niet van toepassing verklaren, indien de
      maatregelen, bedoeld in dat lid, niet doelmatig zijn. [Artikel 2.2, vierde lid][ref1], is van overeenkomstige
      toepassing.

      3 Bij ministeriële regeling worden per gewas of gewasgroep de maximaal toegestane hoeveelheden aan totaal stikstof
      en totaal fosfor in kilogram per hectare per jaar vastgesteld.

      4 De hoeveelheden toe te dienen water en meststoffen zijn afgestemd op de behoefte van het gewas, waarbij rekening
      is gehouden met de relevante specifieke teeltomstandigheden en waarbij de hoeveelheden, bedoeld in het derde lid,
      niet worden overschreden.

      5 Voor het doorspoelen van de grond bij een volgteelt van bladgroentegewassen wordt ten hoogste 3000 kubieke meter
      water per hectare gestoomde grond gebruikt.

      6 Bij het lozen van drainagewater geldt ten minste dat:

      a. voor het recirculeren daarvan een recirculatiesysteem aanwezig en in gebruik is, en

      b. het te lozen drainagewater op een doelmatige wijze kan worden bemonsterd.

      7 In afwijking van het zesde lid, onderdeel a, behoeft geen recirculatiesysteem aanwezig te zijn, indien hergebruik
      van het drainagewater niet doelmatig is.

      8 Het eerste lid en het zesde lid, onderdeel a, zijn niet van toepassing indien het totale teeltoppervlak binnen de
      inrichting waarop telen of kweken van gewassen in een kas plaatsvindt, kleiner is dan 2.500 vierkante meter.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
