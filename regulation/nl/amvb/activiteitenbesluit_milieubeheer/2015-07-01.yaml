        hoofdstuk: '4'
        paragraaf: 4.6.6
        afdeling: '4.6'
  - number: '4.53'
    text: |-
      1 Het is verboden om in de buitenlucht metalen met behulp van een nevelspuit te coaten of te lijmen dan wel met
      behulp van een nevelspuit te reinigen met vluchtige organische stoffen houdende producten.

      2 Het eerste lid is niet van toepassing indien het niet mogelijk is om deze activiteiten in het inpandige deel van
      de inrichting te verrichten vanwege de omvang van het te bewerken object.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.53
  - number: '4.54'
    text: |-
      1 Onverminderd de [artikelen 2.5 tot en met 2.6][ref1] is bij het aanbrengen van coating of lijmlagen de
      emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur; en

      b. 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.

      2 Het eerste lid is niet van toepassing indien het coaten op grond van [artikel 4.53, tweede lid][ref2], in de
      buitenlucht plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.53
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.54
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4.53'
        hoofdstuk: '4'
        paragraaf: 4.5.5
        afdeling: '4.5'
  - number: 4.54a
    text: |-
      1 Het schoonbranden van lood, geïsoleerde kabels, oliegekoelde transformatoren en metaaloppervlakken die
      verontreinigd zijn met polyvinylchloride of andere halogeenverbindingen, is verboden.

      2 Voordat metalen worden schoongebrand, worden deze vrijgemaakt van materialen die redelijkerwijs op andere wijze
      dan door schoonbranden kunnen worden verwijderd.

      3 Bij het schoonbranden van metalen is de emissieconcentratie van:

      a. stofklasse S niet meer dan 25 milligram per normaal kubieke meter;

      b. gasvormige anorganische chloriden niet meer dan 20 milligram per normaal kubieke meter, of

      c. totaal koolwaterstoffen niet meer dan 50 milligram per normaal kubieke meter.

      4 Het in het vuilwaterriool lozen van afvalwater afkomstig van de behandeling van de emissie die vrijkomt bij het
      schoonbranden, is verboden.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.54a
  - number: '4.55'
    text: |-
      1 Degene die de inrichting drijft neemt bij het reinigen, coaten of lijmen van metalen voorwerpen met betrekking
      tot vluchtige organische stoffen de bij ministeriële regeling gestelde emissiereducerende maatregelen tenzij deze
      niet kosteneffectief of technisch uitvoerbaar zijn.

      2 Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de
      in het eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar, zoals dat blijkt uit de
      oplosmiddelenboekhouding als bedoeld in het derde lid.

      3 Degene die een inrichting drijft als bedoeld in het eerste lid, voert een oplosmiddelenboekhouding waarin het
      verbruik van vluchtige organische stoffen per kilogram per jaar wordt geregistreerd.

      4 Het eerste en derde lid is niet toepassing op het verbruik van vluchtige organische stoffen waarvan het in de
      handel brengen is gereguleerd door het [Besluit organische oplosmiddelen in verven en vernissen milieubeheer][ref1].

      5 De oplosmiddelenboekhouding, bedoeld in het derde lid, wordt ten minste drie jaar in de inrichting bewaard en ter
      inzage gehouden.

      6 Indien de drempelwaarden, genoemd in tabel 2.28a worden overschreden, zijn het eerste tot en met vijfde lid niet
      van toepassing en is [afdeling 2.11][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019122
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.55
