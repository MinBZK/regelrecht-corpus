  - number: '2.21'
    text: |-
      1 De waarden bedoeld in de [artikelen 2.17][ref1], [2.19][ref2], [2.20][ref3] dan wel [6.12][ref4] zijn voor zover
      de naleving van deze normen redelijkerwijs niet kan worden gevergd, niet van toepassing op dagen of dagdelen in
      verband met de viering van:

      a. festiviteiten die bij of krachtens een gemeentelijke verordening zijn aangewezen, in de gebieden in de gemeente
      waarvoor de verordening geldt;

      b. andere festiviteiten die plaatsvinden in de inrichting, waarbij het aantal bij of krachtens een gemeentelijke
      verordening aan te wijzen dagen of dagdelen per gebied of categorie van inrichtingen kan verschillen en niet meer
      mag bedragen dan twaalf per kalenderjaar.

      2 Bij of krachtens gemeentelijke verordening kunnen voorwaarden worden verbonden aan de festiviteiten ter
      voorkoming of beperking van geluidhinder.

      3 Een festiviteit als bedoeld in het eerste lid die maximaal een etmaal duurt, maar die zowel voor als na 00.00 uur
      plaatsvindt, wordt beschouwd als plaatshebbende op één dag.


