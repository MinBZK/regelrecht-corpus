  - number: '3.45'
    text: |-
      1 Deze paragraaf is van toepassing op het opslaan van agrarische bedrijfsstoffen met een totaal volume van meer dan
      3 kubieke meter.

      2 In afwijking van het eerste lid is deze paragraaf niet van toepassing op het opslaan van dierlijke meststoffen
      die niet verpompbaar zijn, met een totaal volume van meer dan 600 kubieke meter.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.45
  - number: '3.46'
    text: |-
      1 Het opslaan van agrarische bedrijfsstoffen vindt plaats op ten minste:

      a. 100 meter afstand tot een geurgevoelig object dat binnen de bebouwde kom is gelegen, of

      b. 50 meter afstand tot een geurgevoelig object dat buiten de bebouwde kom is gelegen.

      2 In afwijking van het eerste lid vindt het opslaan van agrarische bedrijfsstoffen bij kinderboerderijen plaats op
      ten minste 50 meter afstand tot een geurgevoelig object. Indien niet aan deze afstand kan worden voldaan, vindt het
      opslaan van agrarische bedrijfsstoffen plaats in een afgesloten voorziening en worden de agrarische bedrijfsstoffen
      niet langer dan twee weken bewaard.

      3 In afwijking van het eerste lid vindt het opslaan van kuilvoer plaats op ten minste 25 meter afstand tot een
      geurgevoelig object.

      4 Indien de afstand van het opslagen kuilvoer, niet zijnde knolgewassen, wortelgewassen of fruit, tot een
      geurgevoelig object minder dan 50 meter bedraagt, is het opslagen kuilvoer afgedekt, behoudens de periode dat
      veevoeder aan de veevoederopslag wordt toegevoegd of onttrokken.

      5 De afstanden, genoemd in het eerste tot en met vierde lid, worden gemeten vanaf de buitenzijde van het
      geurgevoelig object tot het dichtstbijzijnde punt van de plaats waar de agrarische bedrijfsstoffen zijn opgeslagen.

      6 Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt, met inachtneming van
      de NeR, bij maatwerkvoorschrift eisen stellen aan:

      a. de situering van de plaats van de opgeslagen bedrijfsstoffen;

      b. het afdekken van de opgeslagen agrarische bedrijfsstoffen, of

      c. de frequentie van de afvoer van de opgeslagen agrarische bedrijfsstoffen.

      7 Het eerste tot en met vierde lid is niet van toepassing op in plastic folie verpakte veevoederbalen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.46
  - number: '3.47'
    text: |-
      1 Het in een vuilwaterriool lozen van afvalwater afkomstig van het opslaan van kuilvoer en dierlijke meststoffen
      die niet verpompbaar zijn, is verboden.

      2 Het bevoegd gezag kan bij maatwerkvoorschrift het eerste lid niet van toepassing verklaren en het lozen toestaan,
      indien het belang van de bescherming van het milieu zich niet tegen het lozen in een vuilwaterriool verzet.
      [Artikel 2.2, vierde lid][ref1], is van overeenkomstige toepassing.

      3 Het lozen van afvalwater op of in de bodem ten gevolge van het opslaan van agrarische bedrijfsstoffen is
      toegestaan, indien het afvalwater ten minste gelijkmatig wordt verspreid over de onverharde bodem.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.47
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.2'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '3.48'
    text: |-
      Bij het opslaan van agrarische bedrijfsstoffen wordt ten behoeve van het realiseren van een verwaarloosbaar
      bodemrisico alsmede ten behoeve van het voorkomen van de verontreiniging van een oppervlaktewaterlichaam, voldaan
      aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.48
  - number: '3.49'
    text: |-
      Agrarische bedrijfsstoffen worden op onverhard oppervlak:

      a. op een afstand van ten minste 5 meter vanaf de insteek van een oppervlaktewaterlichaam opgeslagen, of

      b. zodanig opgeslagen dat het te lozen hemelwater niet in contact kan komen met de opgeslagen agrarische
      bedrijfsstoffen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.49
  - number: '3.50'
    text: |-
      1 Deze paragraaf is van toepassing op het opslaan van drijfmest in een of meer mestbassins met een gezamenlijke
      oppervlakte van ten hoogste 750 vierkante meter of een gezamenlijke inhoud van ten hoogste 2.500 kubieke meter.

      2 Deze paragraaf is tevens van toepassing op het opslaan van digestaat in één of meer mestbassins met een
      gezamenlijke oppervlakte van ten hoogste 750 vierkante meter of een gezamenlijke inhoud van ten hoogste 2.500
      kubieke meter.

      3 Voor de berekening van de gezamenlijke oppervlakte en de gezamenlijke inhoud, bedoeld in het eerste en tweede
      lid, worden de inhoud en oppervlakte van mestkelders en ondergrondse mestbassins die zijn voorzien van een
      afdekking die als vloer kan fungeren en onderdeel zijn van een werktuigberging, opslagvoorziening of erfverharding,
      niet meegerekend.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.50
  - number: '3.51'
    text: |-
      1 Een mestbassin is gelegen op een afstand van ten minste 100 meter van een geurgevoelig object.

      2 In afwijking van het eerste lid is een mestbassin gelegen op een afstand van ten minste 50 meter, indien het
      geurgevoelig object deel uitmaakt van een veehouderij.

      3 In afwijking van het eerste en tweede lid bedragen de afstanden, genoemd in die leden 50 meter onderscheidenlijk
      25 meter, indien de gezamenlijke oppervlakte van de in de inrichting aanwezige bassins minder bedraagt dan 350
      vierkante meter.

      4 Een mestbassin is gelegen:

      a. op een afstand van ten minste 150 meter van een zeer kwetsbaar gebied, indien de gezamenlijke oppervlakte van de
      mestbassins ten hoogste 350 vierkante meter bedraagt, of

      b. op een afstand van ten minste 250 meter van een zeer kwetsbaar gebied, indien de gezamenlijke oppervlakte van de
      mestbassins ten minste 350 vierkante meter bedraagt.

      5 Het vierde lid, onderdeel a, is niet van toepassing op:

      a. een mestbassin dat is opgericht voor 1 februari 1991, en

      b. een uitbreiding van een veehouderij die is opgericht voor 1 februari 1991 met een mestbassin,

      indien de in dat onderdeel genoemde afstand tot een zeer kwetsbaar gebied niet of redelijkerwijs niet in acht kan
      worden genomen.

      6 Het vierde lid is niet van toepassing, indien het mestbassin is opgericht in overeenstemming met dat lid en het
      mestbassin na het tijdstip van oprichting is komen te liggen binnen een van de afstanden van een zeer kwetsbaar
      gebied, genoemd in dat lid.

      7 Het bevoegd gezag kan met betrekking tot een geval als bedoeld in het vijfde lid, voor zover de bescherming van
      het milieu zich daartegen niet verzet, bij maatwerkvoorschrift een kleinere afstand tot een zeer kwetsbaar gebied
      vaststellen.

      8 De afstanden, genoemd in het eerste tot en met vierde lid, worden gemeten vanaf de buitenzijde van het mestbassin
      tot de dichtstbijzijnde gevel van een geurgevoelig object dan wel tot de grens van een zeer kwetsbaar gebied.

      9 Het eerste tot en met achtste lid is niet van toepassing op een mestkelder.

      10 Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt, met inachtneming
      van de NeR, bij maatwerkvoorschrift eisen stellen aan:

      a. de situering van het mestbassin;

      b. het afdekken van het mestbassin, of

      c. de frequentie en het tijdstip van de aan- en afvoer van de opgeslagen drijfmest en digestaat.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.51
  - number: '3.52'
    text: |-
      Bij het opslaan van drijfmest en digestaat in een mestbassin wordt ten behoeve van:

      a. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de emissie van ammoniak,
      of

      b. het realiseren van een verwaarloosbaar bodemrisico,

      voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.52
  - number: '3.53'
    text: |-
      Deze paragraaf is van toepassing op het opslaan van ten hoogste 1.000 kubieke meter van buiten de inrichting
      afkomstige vloeibare bijvoedermiddelen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.53
  - number: '3.54'
    text: |-
      Bij het opslaan van vloeibare bijvoedermiddelen wordt ten behoeve van het voorkomen dan wel voor zover dat niet
      mogelijk is het tot een aanvaardbaar niveau beperken van geurhinder, voldaan aan de bij ministeriële regeling
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.54
  - number: 3.54a
    text: |-
      Deze paragraaf is van toepassing op het vullen met propaan of butaan van gasflessen met een inhoud van maximaal 12
      liter vanuit een gasfles van maximaal 150 liter.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.54a
  - number: 3.54b
    text: |-
      Een vulstation voor het vullen van gasflessen voldoet ten behoeve van het voorkomen van risico’s voor de omgeving
      en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s
      voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan aan de bij ministeriële
      regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.54b
  - number: 3.54c
    text: |-
      1 Deze paragraaf is van toepassing op het opslaan van gasolie als bedoeld in
      [artikel 26 van de Wet op de accijns][ref1], smeerolie of afgewerkte olie in een of meer bovengrondse opslagtanks,
      voor zover:

      a. de gezamenlijke inhoud van bovengrondse opslagtanks voor gasolie of afgewerkte olie in de buitenlucht ten
      hoogste 150 kubieke meter is, of

      b. de gezamenlijke inhoud van bovengrondse opslagtanks voor gasolie of afgewerkte olie inpandig ten hoogste 15
      kubieke meter is.

      2 Deze paragraaf is niet van toepassing op bovengrondse opslagtanks die zijn ingebouwd in een installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.54c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '26'
  - number: 3.54d
    text: |-
      Bij het in gebruik hebben en het beëindigen van het gebruik van een bovengrondse opslagtank die wordt dan wel werd
      gebruikt voor de opslag van gasolie, smeerolie of afgewerkte olie wordt ten behoeve van:

      a. het realiseren van een verwaarloosbaar bodemrisico;

      b. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico's voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan, of

      c. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van een
      oppervlaktewaterlichaam,

      voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.54d
  - number: '3.55'
    text: Deze paragraaf is van toepassing op het telen of kweken van gewassen in een kas.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.55
  - number: '3.56'
    text: |-
      1 Een kas waarin assimilatiebelichting wordt toegepast, is aan de bovenzijde voorzien van een
      lichtscherminstallatie waarmee ten minste 98% van de lichtuitstraling kan worden gereduceerd.

      2 Het eerste lid is niet van toepassing op een kas waarin uitsluitend assimilatiebelichting wordt toegepast buiten
      de donkerteperiode.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.56
  - number: '3.57'
    text: |-
      1 Indien assimilatiebelichting met een verlichtingssterkte van ten minste 15.000 lux wordt toegepast, is vanaf
      het tijdstip van zonsondergang tot het tijdstip van zonsopgang de bovenzijde van de kas op een zodanige wijze
      afgeschermd dat ten minste 98% van de lichtuitstraling wordt gereduceerd.

      2 Het bevoegd gezag kan, indien het belang van de bescherming van het milieu zich daartegen niet verzet, bij
      maatwerkvoorschrift buiten de donkerteperiode een ander percentage dan het percentage, bedoeld in het eerste lid,
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.57
  - number: '3.58'
    text: |-
      1 Indien assimilatiebelichting met een verlichtingssterkte van minder dan 15.000 lux wordt toegepast, is:

      a. gedurende de donkerteperiode die toepassing niet toegestaan, tenzij de bovenzijde op een zodanige wijze is
      afgeschermd dat de lichtuitstraling met ten minste 98% wordt gereduceerd, en

      b. gedurende de nanacht die toepassing niet toegestaan, tenzij de bovenzijde op een zodanige wijze is afgeschermd
      dat de lichtuitstraling met ten minste 74% wordt gereduceerd.

      2 Het bevoegd gezag kan, indien het belang van de bescherming van het milieu zich daartegen niet verzet, bij
      maatwerkvoorschrift een ander percentage dan het percentage in het eerste lid, onder b, vaststellen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.58
  - number: '3.59'
    text: |-
      1. Vanaf het tijdstip van zonsondergang tot het tijdstip van zonsopgang is de gevel van een kas waarin
      assimilatiebelichting wordt toegepast op een zodanige wijze afgeschermd dat de lichtuitstraling op een afstand van
      ten hoogste 10 meter van die gevel met ten minste 95% wordt gereduceerd en de gebruikte lampen buiten de inrichting
      niet zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.59
  - number: '3.60'
    text: |-
      1 Bij het lozen uit het hemelwaterafvoersysteem van een kas, wordt ten minste voldaan aan het tweede tot en met
      vijfde lid.

      2 Het lozen in een vuilwaterriool is verboden.

      3 Het lozen anders dan in een vuilwaterriool is toegestaan.

      4 Indien bij het lozen, bedoeld in het derde lid, een hemelwateropvangvoorziening aanwezig is die volledig
      is benut, wordt het hemelwater geloosd via een overstortvoorziening, die is aangebracht voorafgaand aan de
      hemelwateropvangvoorziening.

      5 Het vierde lid is niet van toepassing, indien:

      a. de opvangvoorziening, bedoeld in dat lid, een inhoud heeft van ten minste 3500 kubieke meter per hectare
      teeltoppervlak;

      b. de kas zodanig is gebouwd dat condenswater niet in het hemelwaterafvoersysteem kan geraken;

      c. in de kas gewasbeschermingsmiddelen of biociden zodanig worden toegepast dat ze niet in het
      hemelwaterafvoersysteem kunnen geraken, of

      d. in de kas uitsluitend sprake is van biologische productiemethoden.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.60
  - number: '3.61'
    text: |-
      1 Bij het lozen van condenswater afkomstig van condensvorming aan de binnenzijde van de kas dat via condensgootjes
      wordt verzameld, wordt ten minste voldaan aan het tweede en derde lid.

      2 Het lozen in een vuilwaterriool is verboden, indien in de kas gewasbeschermingsmiddelen of biociden worden
      toegepast.

      3 Het lozen anders dan in een vuilwaterriool is toegestaan, indien condenswater afkomstig is van een kas:

      a. waarin geen gewasbeschermingsmiddelen of biociden worden toegepast, of

      b. waarin uitsluitend sprake is van biologische productiemethoden.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.61
  - number: '3.62'
    text: |-
      1 Bij het lozen van afvalwater afkomstig van het reinigen van de buitenkant van een kas wordt ten minste voldaan
      aan tweede tot en met vierde lid.

      2 Het lozen in een vuilwaterriool is verboden.

      3 Het lozen anders dan in een vuilwaterriool is toegestaan.

      4 Bij het lozen in een oppervlaktewaterlichaam vindt geen visuele verontreiniging plaats.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.62
  - number: '3.63'
    text: |-
      1 Het in een oppervlaktewaterlichaam lozen van:

      a. spoelwater van filters van een waterdoseringsinstallatie;

      b. afvalwater dat bloemvoorbehandelingsmiddelen uitsluitend op basis van actief chloor bevat;

      c. drainagewater afkomstig van een teelt waarbij gewassen op een bodem groeien die in verbinding staat met de
      ondergrond;

      d. drainwater;

      e. afvalwater afkomstig van het spuiten of schrobben van vloeren, niet zijnde vloeren van ruimten waar
      gewasbeschermingsmiddelen of biociden worden aangemaakt;

      f. reinigingswater van leidingen, druppelaars en slangen die onderdeel uitmaken van het systeem waarmee
      voedingswater aan het gewas wordt toegediend;

      g. condenswater van stoomleidingen en condenswater van verwarmingsketels;

      h. condenswater van warmtekrachtinstallaties, of

      i. afvalwater afkomstig van het bij opkweekbedrijven doorspoelen van substraatblokken die bestemd zijn voor de
      opkweek van uitgangsmateriaal;

      is toegestaan, indien ten minste:

      1°. het perceel waar het afvalwater vrijkomt niet is aangesloten op een vuilwaterriool of zuiveringtechnisch werk,
      waarop geloosd kan worden, en de afstand tot het dichtstbijzijnde vuilwaterriool waarop kan worden aangesloten en
      geloosd, meer dan 40 meter bedraagt, of

      2°. het lozen, bedoeld onder a tot en met j, in een vuilwaterriool, waarop het perceel waar het afvalwater vrijkomt
      is aangesloten, gelet op de capaciteit van dat vuilwaterriool niet volledig mogelijk is.

      2 De afstand, genoemd in het eerste lid, onderdeel 1°, wordt berekend:

      a. vanaf de kadastrale grens van het perceel waar het afvalwater vrijkomt, en

      b. langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.

      3 In afwijking van het eerste lid, onderdeel 1°, kan het bevoegd gezag bij maatwerkvoorschrift een grotere afstand
      vaststellen dan de afstand, genoemd in dat onderdeel, waarbij de afstand niet meer dan 10 meter per 0,1 hectare
      teeltoppervlak bedraagt en wordt berekend overeenkomstig het tweede lid.

      4 In een geval bedoeld in het eerste lid, onder 2°:

      a. wordt, voorafgaand aan het lozen in een oppervlaktewaterlichaam de afvoercapaciteit van het vuilwaterriool
      optimaal benut, en

      b. vindt lozen in dat vuilwaterriool plaats in een bij ministeriële regeling aangegeven volgorde.

      5 Het bevoegd gezag kan bij maatwerkvoorschrift dan wel bij gemeentelijke verordening een andere volgorde bepalen,
      dan de volgorde aangegeven in de ministeriële regeling, bedoeld in het vierde lid, onderdeel b.

      6 Het bevoegd gezag kan met betrekking tot het vierde lid, onderdeel a, maatwerkvoorschriften stellen ten aanzien
      van:

      a. de per tijdseenheid te lozen hoeveelheid;

      b. voorzieningen die gespreide afvoer in het vuilwaterriool mogelijk maken, of

      c. een buffervoorziening met een inhoud van ten hoogste 50 kubieke meter per hectare.

      7 Indien met toepassing van het eerste lid, het lozen in een oppervlaktewaterlichaam is toegestaan, zijn op dat
      lozen de [artikelen 3.66][ref1] en [3.71][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.66
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.71
