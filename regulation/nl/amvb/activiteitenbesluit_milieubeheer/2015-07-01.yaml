  - number: '3.2'
    text: |-
      1 Deze paragraaf is van toepassing op het lozen van grondwater bij ontwatering, niet zijnde:

      a. grondwater vanuit een proefbronnering in het kader van een saneringsonderzoek of vanuit een bodemsanering als
      bedoeld in [artikel 3.1, eerste lid][ref1];

      b. drainagewater afkomstig van telen in een kas als bedoeld in [artikel 3.70][ref2], en

      c. drainagewater als bedoeld in [artikel 3.87, negende lid][ref3].

      Bij het lozen wordt ten minste voldaan aan het tweede tot en met tiende lid.

      2 Het lozen op of in de bodem is toegestaan.

      3 Het lozen in een oppervlaktewaterlichaam is toegestaan indien:

      a. het gehalte onopgeloste stoffen in enig steekmonster ten hoogste 50 milligram per liter bedraagt; en

      b. als gevolg van het lozen geen visuele verontreiniging optreedt.

      4 Het bevoegd gezag kan met betrekking tot het lozen, bedoeld in het derde lid, bij maatwerkvoorschrift afwijken
      van:

      a. het gehalte, genoemd in dat lid en een hoger gehalte vaststellen, indien genoemd gehalte niet door toepassing
      van beste beschikbare technieken kan worden bereikt en het belang van de bescherming van het milieu zich niet tegen
      het lozen met een hoger gehalte verzet; en

      b. bepalen dat visuele verontreiniging mag optreden, indien visuele verontreiniging niet door toepassing van beste
      beschikbare technieken kan worden voorkomen en het belang van de bescherming van het milieu zich niet verzet tegen
      het lozen, waarbij visuele verontreiniging optreedt.

      5 Het lozen, in een voorziening voor de inzameling en het transport van afvalwater, niet zijnde een vuilwaterriool,
      is toegestaan indien het gehalte onopgeloste stoffen in enig steekmonster ten hoogste 50 milligram per liter
      bedraagt en het ijzergehalte in enig steekmonster ten hoogste 5 milligram per liter bedraagt.

      6 Het bevoegd gezag kan met betrekking tot lozen als bedoeld in het vijfde lid bij maatwerkvoorschrift of
      verordening als bedoeld in [artikel 10.32a van de Wet milieubeheer][ref4] afwijken van:

      a. de gehalten, bedoeld in dat lid en hogere gehalten vaststellen, indien eerstgenoemde gehalten niet door
      toepassing van beste beschikbare technieken kunnen worden bereikt en het belang van de bescherming van het milieu
      zich niet verzet tegen het lozen met een hoger gehalte;

      b. het ijzergehalte, bedoeld in dat lid en een lager ijzergehalte bepalen, indien het belang van bescherming van
      het milieu tot het stellen van een lager gehalte noodzaakt.

      7 Het lozen, in een vuilwaterriool is verboden, tenzij:

      a. het lozen ten hoogste 8 weken duurt;

      b. de geloosde hoeveelheid ten hoogste 5 kubieke meter per uur bedraagt; en

      c. het gehalte onopgeloste stoffen in enig steekmonster ten hoogste 300 milligram per liter bedraagt.

      8 Het bevoegd gezag kan met betrekking tot de tijdsduur en de hoeveelheid, bedoeld in het zevende lid bij
      maatwerkvoorschrift of bij verordening als bedoeld in [artikel 10.32a van de Wet milieubeheer][ref5] andere waarden
      stellen.

      9 Het te lozen grondwater kan op een doelmatige wijze worden bemonsterd.

      10 De per tijdseenheid geloosde hoeveelheid grondwater kan voor de toepassing van het zevende lid op een doelmatige
      wijze worden bepaald.


