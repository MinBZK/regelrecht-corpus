  - number: 6.19b
    text: |-
      1 [Artikel 3.5b, eerste en tweede lid][ref1], is niet van toepassing op een zuiveringtechnisch
      werk dat is opgericht voor 1 februari 1996 en waarvoor op dat tijdstip een vergunning op grond van
      [artikel 8.1 van de Wet milieubeheer][ref2] in werking en onherroepelijk was.

      2 Indien het eerste lid van toepassing is, dan is de geurbelasting als gevolg van een zuiveringtechnisch werk ter
      plaatse van geurgevoelige objecten niet meer dan 1,5 odour units per kubieke meter lucht als 98-percentiel.

      3 In afwijking van het tweede lid is de geurbelasting als gevolg van een zuiveringtechnisch werk ter plaatse van
      geurgevoelige objecten gelegen op een gezoneerd industrieterrein, een bedrijventerrein danwel buiten de bebouwde
      kom niet meer dan 3,5 odour units per kubieke meter lucht als 98-percentiel.

      4 Voor een zuiveringtechnisch werk waarvoor onmiddellijk voorafgaand aan tijdstip van
      het van toepassing worden van [artikel 3.5b][ref3] een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref4], in werking en
      onherroepelijk was, zijn het tweede en derde lid en artikel 3.5b, eerste en tweede lid, niet van toepassing op
      de geurbelasting ter plaatse van geurgevoelige objecten die op het moment van verlening van de vergunning niet
      aanwezig waren of in de vergunning niet als geurgevoelig werden beschouwd.

      5 Bij de verandering van een zuiveringtechnisch werk als bedoeld in het eerste en vierde lid is de
      geurbelasting ter plaatse van geurgevoelige objecten als gevolg van een zuiveringtechnisch werk niet
      hoger dan de geurbelasting onmiddellijk voorafgaand aan de verandering, tenzij de waarden, bedoeld in
      [artikel 3.5b, eerste en tweede lid][ref5], niet worden overschreden.


