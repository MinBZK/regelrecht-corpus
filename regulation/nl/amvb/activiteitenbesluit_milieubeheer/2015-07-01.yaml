  - number: '5.8'
    text: |-
      1 De emissiegrenswaarden, bedoeld in de [artikelen 5.4 tot en met 5.7][ref1], gelden niet voor gasturbines,
      gasmotoren en dieselmotoren die blijkens de daarvoor geldende omgevingsvergunning bestemd zijn voor noodgevallen en
      minder dan 500 bedrijfsuren per jaar in bedrijf zijn. Degene die de inrichting drijft, registreert de bedrijfsuren
      van dergelijke installaties.

      2 Voor de toepassing van het eerste lid wordt onder bedrijfsuren verstaan: de tijd, uitgedrukt in uren, gedurende
      welke een grote stookinstallatie geheel of gedeeltelijk in werking is en emissies in de lucht veroorzaakt, met
      uitzondering van de voor de inwerkingstelling en stillegging benodigde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.4
