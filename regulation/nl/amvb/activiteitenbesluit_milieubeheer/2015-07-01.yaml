  - number: 2.11a
    text: Deze afdeling is van toepassing op degene die een inrichting type A of een inrichting type B drijft.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.11a
  - number: '2.12'
    text: |-
      1 Het is verboden:

      a. gevaarlijke afvalstoffen te mengen met afvalstoffen, niet zijnde gevaarlijke afvalstoffen;

      b. afvalstoffen te mengen met andere afvalstoffen die wat betreft aard, samenstelling of concentraties niet
      vergelijkbaar zijn, en

      c. afvalstoffen te mengen met stoffen of materialen, niet zijnde afvalstoffen.

      2 Het verbod, bedoeld in het eerste lid, aanhef en onder b, is niet van toepassing op afvalstoffen, voor zover:

      a. de afvalstoffen geen gevaarlijke afvalstoffen zijn;

      b. de afvalstoffen niet van buiten de inrichting afkomstig zijn, en

      c. het gescheiden houden en gescheiden afgeven van de afvalstoffen redelijkerwijs niet kan worden gevergd.

      3 Het verbod, bedoeld in het eerste lid, aanhef en onder b en c, is niet van toepassing op het mengen:

      a. ten behoeve van recycling als product of als materiaal, en

      b. van afvalwater waarvan het lozen bij of krachtens dit besluit op dezelfde wijze is toegestaan, voorafgaand aan
      dat lozen.

      4 Het verbod, bedoeld in het eerste lid, aanhef en onderdelen b en c, is niet van toepassing op het mengen van:

      a. verschillende soorten afvalwater waarvan het lozen bij of krachtens dit besluit op dezelfde wijze is toegestaan,
      voorafgaand aan dat lozen, en

      b. afvalwater waarvan het lozen op of in de bodem krachtens dit besluit is toegestaan met meststoffen voor zover
      dit niet in strijd is met [artikel 5 van het Uitvoeringsbesluit Meststoffenwet][ref1].

      5 Bij ministeriële regeling worden categorieën van afvalstoffen aangewezen waarin per categorie de afvalstoffen wat
      betreft aard, samenstelling en concentratie in ieder geval vergelijkbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel5
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '5'
  - number: '2.13'
    text: |-
      Degene die de inrichting drijft verwijdert zo vaak als nodig etenswaren, verpakkingen, sport- of spelmaterialen, of
      andere materialen die uit de inrichting afkomstig zijn of voor de inrichting zijn bestemd binnen een straal van 25
      meter van de inrichting.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.13
  - number: '2.14'
    text: |-
      Indien binnen een inrichting een afvalstof zijnde metaal, hout, kunststof, textiel, steenachtige materialen of
      gips als grondstof wordt ingezet voor het vervaardigen, samenstellen of repareren van producten of onderdelen
      daarvan bestaande uit metaal, hout, kunststof, textiel, steenachtige materialen of gips en de eigenschappen van
      de afvalstof afwijken van de gangbare grondstof kan het bevoegd gezag maatwerkvoorschriften stellen om nadelige
      gevolgen voor het milieu die kunnen ontstaan door het afwijken van de eigenschappen, te voorkomen of voor zover dat
      niet mogelijk is te beperken.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.14
  - number: 2.14a
    text: |-
      1 Het is verboden afvalstoffen te verbranden, tenzij het betreft de verbranding van biomassa in een
      stookinstallatie met een thermisch vermogen van 15 megawatt of minder en bij die verbranding van biomassa wordt
      voldaan aan [artikel 3.10n][ref1].

      2 Het is verboden afvalstoffen op of in de bodem te brengen met het doel ze daar te laten.

      3 Het tweede lid geldt niet voor het toepassen van bouwstoffen en het toepassen van grond of baggerspecie, waarop
      het [Besluit bodemkwaliteit][ref2] van toepassing is.

      4 Het tweede lid geldt niet voor het lozen op of in de bodem.

      5 Het is verboden afvalstoffen voorafgaand aan nuttige toepassing langer dan drie jaren op te slaan.

      6 Het is verboden afvalstoffen voorafgaand aan verwijdering langer dan een jaar op te slaan.

      7 Uiterlijk binnen acht weken na de beëindiging van de inrichting worden de daarin aanwezige afvalstoffen uit de
      inrichting afgevoerd.

      8 Het is verboden afvalstoffen te verdichten, tenzij:

      a. het geen gevaarlijke afvalstof betreft, en

      b. het verdichten geen belemmering vormt voor de nascheiding of recycling.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.10n
      [ref2]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.14a
    references:
      - id: ref1
