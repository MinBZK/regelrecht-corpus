  - number: 6.21b
    text: |-
      [Artikel 3.15a][ref1] is niet van toepassing op een windturbine of een combinatie daarvan waarvoor onmiddellijk
      voorafgaand aan het tijdstip van inwerkingtreding van artikel 3.15a een vergunning in werking en onherroepelijk
      was dan wel een melding was gedaan op grond van [artikel 1.10][ref2] ten aanzien van een kwetsbaar respectievelijk
      beperkt kwetsbaar object, indien het plaatsgebonden risico ten gevolge van die windturbine of een combinatie van
      windturbines voor het betreffende kwetsbare respectievelijk beperkt kwetsbare object op het tijdstip voorafgaand
      aan het tijdstip van inwerkingtreding van artikel 3.15a groter is dan 10-6 respectievelijk 10-5 per jaar.


