        paragraaf: '5.2'
  - number: '5.2'
    text: |-
      Een grote stookinstallatie wordt op een zodanige wijze ontworpen, uitgerust, onderhouden en geëxploiteerd, met
      inbegrip van een op berekeningen gebaseerde hoogte van de schoorsteen, dat afgassen op gecontroleerde wijze door de
      schoorsteen worden afgevoerd en wordt voorkomen dat de emissies in de lucht leiden tot overschrijding van:

      a. de bij of krachtens dit besluit geldende emissiegrenswaarden;

      b. de in [bijlage 2 van de wet][ref1] opgenomen grenswaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '5.3'
    text: |-
      1 De emissiegrenswaarden, gesteld in deze paragraaf, zijn van toepassing op de emissies van alle gemeenschappelijke
      schoorstenen in relatie tot het totale nominale thermische ingangsvermogen van de gehele stookinstallatie.

      2 Bij uitbreiding van een bestaande grote stookinstallatie zijn de emissiegrenswaarden voor grote stookinstallaties
      van toepassing op het uitgebreide gedeelte van de bestaande grote stookinstallatie waarop de wijziging betrekking
      heeft. De emissiegrenswaarden worden vastgesteld op grond van het totale nominale thermische ingangsvermogen van de
      gehele stookinstallatie.

      3 In geval van een wijziging van een bestaande grote stookinstallatie die gevolgen kan hebben voor het milieu
      en die betrekking heeft op een gedeelte van een bestaande grote stookinstallatie met een nominaal thermisch
      ingangsvermogen van 50 MW of meer, zijn de emissiegrenswaarden voor grote stookinstallaties van toepassing op het
      gedeelte van de bestaande grote stookinstallatie dat is gewijzigd in relatie tot het totale nominale thermische
      ingangsvermogen van de gehele stookinstallatie.

      4 Voor de berekening van de emissies van een grote stookinstallatie wordt de massaconcentratie aan zwaveldioxide,
      stikstofoxiden of totaal stof herleid op een volumegehalte aan zuurstof van:

      a. ingeval het een grote stookinstallatie voor vaste brandstoffen betreft: 6 procent in afgas;

      b. ingeval het een gasturbine of een gasmotor betreft: 15 procent in afgas;

      c. ingeval het een andere grote stookinstallatie dan bedoeld onder a en b betreft: 3 procent in afgas.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5.3
