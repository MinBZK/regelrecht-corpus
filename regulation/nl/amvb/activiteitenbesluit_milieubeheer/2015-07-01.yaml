    text: |-
      1 In afwijking van [artikel 2.9][ref1] worden bij het ontwerp, de aanleg en het gebruik van het gedeelte van
      de waterlijn, vanaf het ontvangstwerk tot de selector of beluchtingstank, alsmede van het gedeelte van het
      zuiveringtechnisch werk waar slibontwatering, opslag en leidingwerk met primair slib plaatsvindt, bodembeschermende
      voorzieningen en bodembeschermende maatregelen getroffen waarmee een aanvaardbaar bodemrisico wordt gerealiseerd.

      2 De bodembeschermende voorzieningen en bodembeschermende maatregelen, bedoeld in het eerste lid, voldoen aan
      de bij ministeriële regeling te stellen eisen over de goede werking van die voorzieningen en maatregelen, en
      over de controle van die eisen alsmede aan de bij ministeriële regeling te stellen eisen over de mogelijkheid om
      bodemverontreiniging te kunnen signaleren en indien nodig te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.9
