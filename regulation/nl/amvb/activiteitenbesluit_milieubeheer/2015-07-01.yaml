    text: |-
      1 De [artikelen 3.23, tweede lid][ref1], [3.23c, derde lid][ref2], en [4.82, tweede lid][ref3], zijn niet van
      toepassing indien:

      a. voor het van toepassing worden van dit besluit of een deel daarvan op een activiteit in de inrichting een
      slibvangput en een olieafscheider zijn geplaatst die voldoen aan en gebruikt worden conform NEN 7089; of

      b. voor 1 maart 1997 een slibvangput of een olieafscheider zijn geplaatst, die op de hoeveelheid afvalwater zijn
      afgestemd.

      2 In afwijking van de [artikelen 3.26c, derde lid][ref4], [3.26f, derde lid][ref5], [3.26h, derde lid][ref6],
      [3.34, achtste lid][ref7], [4.71, tweede lid][ref8], en [4.75, vierde lid][ref9], zijn die artikelen van
      overeenkomstige toepassing indien het afvalwater niet wordt geleid door een slibvangput en olieafscheider die
      voldoen aan NEN-EN 858-1 en 2, maar door:

      a. een slibvangput en een olieafscheider die voldoen aan en worden gebruikt conform NEN 7089; of

      b. een slibvangput en een olieafscheider die zijn geplaatst voor 1 maart 1997 en op de hoeveelheid afvalwater zijn
      afgestemd.


