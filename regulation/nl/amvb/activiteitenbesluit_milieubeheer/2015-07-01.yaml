  - number: '3.84'
    text: |-
      Bij het op andere wijze dan door middel van een werk lozen van meststoffen in een oppervlaktewaterlichaam als
      gevolg van het gebruik van meststoffen bij het telen van gewassen in de open lucht, wordt ten minste voldaan aan
      [artikel 3.85][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.85
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.84
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3.85'
        hoofdstuk: '3'
        paragraaf: 3.5.3
        afdeling: '3.5'
  - number: '3.85'
    text: |-
      1 Binnen een teeltvrije zone als bedoeld in [artikel 3.79, tweede lid][ref1], worden geen meststoffen gebruikt.

      2 In afwijking van het eerste lid is het bij de teelt van opwaarts en zijwaarts te bespuiten boomkwekerijgewassen
      of van appelen, peren en overige pitvruchten en steenvruchten, toegestaan binnen een teeltvrije zone meststoffen
      te gebruiken op een afstand van ten minste 25 centimeter vanaf de insteek van een oppervlaktewaterlichaam, indien
      binnen die zone geen ander gewas dan gras wordt geteeld.

      3 In afwijking van het eerste lid en onverminderd het zesde lid is het pleksgewijs bemesten van een vanggewas op
      de teeltvrije zone op een afstand van ten minste 50 centimeter vanaf de insteek van een oppervlaktewaterlichaam
      toegestaan, indien het vanggewas voldoet aan de bij ministeriële regeling gestelde eisen.

      4 Bij het gebruik van korrelvormige of poedervormige meststoffen op de strook gelegen naast de teeltvrije zone
      wordt direct langs de zone gebruik gemaakt van een voorziening die de verspreiding van die meststoffen richting het
      oppervlaktewaterlichaam verhindert.

      5 Bij het gebruik van bladmeststoffen op een strook gelegen naast de teeltvrije zone wordt direct langs de zone:

      a. bij het bemesten van gewassen als bedoeld in [artikel 3.80, eerste, tweede, zesde en zevende lid][ref2],
      gebruik gemaakt van kantdoppen die aan de zijde van het oppervlaktewaterlichaam een verticale of nagenoeg verticale
      neerwaartse richting van de spuitvloeistof bewerkstelligen en andere driftarme doppen die zich niet hoger dan 50
      centimeter boven het gewas of de kale bodem bevinden, of

      b. bij het bemesten van gewassen als bedoeld in [artikel 3.80, derde en vierde lid][ref3], geen gebruik gemaakt van
      naar een oppervlaktewaterlichaam gerichte apparatuur.

      6 Bij het gebruik van bladmeststoffen bij de teelt van een gewas waarbij ingevolge
      [artikel 3.79, zevende lid, aanhef en onderdeel b, onder 2°][ref4], geen teeltvrije zone wordt aangehouden, wordt
      gebruik gemaakt van een emissiescherm, dat voldoet aan de bij ministeriële regeling gestelde eisen.

      7 Het tweede en derde lid zijn niet van toepassing op het gebruik van meststoffen langs de
      oppervlaktewaterlichamen, aangewezen in de [bijlage bij artikel 3 van het Uitvoeringsbesluit Meststoffenwet][ref5].

      8 Op braakliggend land worden binnen een afstand van 50 centimeter vanaf de insteek van een oppervlaktewaterlichaam
      geen meststoffen gebruikt.


