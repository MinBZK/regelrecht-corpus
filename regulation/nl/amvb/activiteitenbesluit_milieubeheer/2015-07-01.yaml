    text: |-
      Bij het stralen van metalen wordt ten behoeve van het realiseren van een verwaarloosbaar bodemrisico, voldaan aan
      de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.51
  - number: '4.52'
    text: |-
      1 Deze paragraaf is van toepassing op het reinigen, lijmen of coaten van metalen.

      2 In deze paragraaf wordt onder het reinigen van metalen niet verstaan het wassen van motorvoertuigen
      of werktuigen, bedoeld in [paragraaf 3.3.2][ref1]., en het afspuiten van pleziervaartuigen, bedoeld in
      [paragraaf 4.6.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.52
    references:
