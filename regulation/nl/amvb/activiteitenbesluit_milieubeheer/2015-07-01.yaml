      1 Voor het lozen in een oppervlaktewaterlichaam van drainagewater afkomstig van de teelt waarbij gewassen
      op materiaal groeien dat in verbinding staat met de ondergrond vanaf een perceel dat voor 1 november
      1994 niet voor glastuinbouwactiviteiten werd gebruikt, waarvoor onmiddellijk voorafgaand aan het
      tijdstip van het van toepassing worden van [artikel 3.64][ref1] op dat lozen, een vergunning op grond
      van [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref2] dan wel een vergunning op grond van
      [artikel 6.2 van de Waterwet][ref3] in werking en onherroepelijk was, worden de voorschriften van die vergunning
      aangemerkt als maatwerkvoorschriften, mits de voorschriften van die vergunning vallen binnen de bevoegdheid van het
      bevoegd gezag tot het stellen van maatwerkvoorschriften op grond van artikel 3.64, eerste lid.

      2 Voor het lozen in een oppervlaktewaterlichaam van drainwater vanaf een perceel dat voor 1 november
      1994 niet voor glastuinbouwactiviteiten werd gebruikt, waarvoor onmiddellijk voorafgaand aan het
      tijdstip van het van toepassing worden van [artikel 3.64][ref4] op dat lozen, een vergunning op grond
      van [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref5] dan wel een vergunning op grond van
      [artikel 6.2 van de Waterwet][ref6] in werking en onherroepelijk was, worden de voorschriften van die vergunning
      aangemerkt als maatwerkvoorschriften, mits de voorschriften van die vergunning vallen binnen de bevoegdheid van het
      bevoegd gezag tot het stellen van maatwerkvoorschriften op grond van artikel 3.64, tweede lid.


