        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.74k
    text: |-
      1 Het lozen van afvalwater afkomstig van het reinigen van met beton verontreinigde installatieonderdelen is
      uitsluitend toegestaan indien daarbij ten minste wordt voldaan aan de eisen, gesteld bij en krachtens het tweede
      tot en met vijfde lid.

      2 Bij het lozen in een aangewezen oppervlaktewaterlichaam of in een voorziening voor de inzameling en het transport
      van afvalwater, niet zijnde een vuilwaterriool, bedraagt:

      a. het gehalte aan onopgeloste stoffen in enig steekmonster niet meer dan 100 milligram per liter, en

      b. het gehalte aan chemisch zuurstofverbruik in enig steekmonster niet meer dan 200 milligram per liter.

      3 Bij het lozen in een vuilwaterriool bedraagt het gehalte aan onopgeloste stoffen niet meer dan 300 milligram
      per liter.

      4 Het te lozen afvalwater kan op doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74k
  - number: 4.74l
    text: |-
      1 Dit artikel is van toepassing op het mengen van afvalstoffen voor het vervaardigen van betonmortel waarop het
      Besluit bodemkwaliteit van toepassing is.

      2 Onverminderd [artikel 2.12][ref1] voldoen afvalstoffen die worden toegepast voor het vervaardigen van betonmortel
      afzonderlijk aan de kwaliteitseisen van [hoofdstuk 3 van het Besluit bodemkwaliteit][ref2].

      3 Onverminderd [artikel 2.12][ref3] kan het bevoegd gezag in afwijking van het tweede lid bepalen dat afvalstoffen
      die afzonderlijk niet aan de vereisten uit het [Besluit bodemkwaliteit][ref4] voldoen, voor het vervaardigen van
      betonmortel kunnen worden toegepast, indien:

      a. de nuttige toepassing van de afvalstof is toegestaan, en

      b. de toepassing van de afvalstof bijdraagt aan de fysische of bouwtechnische eigenschappen van de bouwstof en
      daarmee de inzet van primaire grondstoffen uitspaart.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2.12
      [ref4]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74l
