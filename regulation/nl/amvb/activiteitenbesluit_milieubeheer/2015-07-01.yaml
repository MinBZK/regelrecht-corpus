        artikel: 3.10n
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0022929
  - number: 2.14b
    text: |-
      1 Indien binnen een inrichting afvalstoffen worden op- of overgeslagen of verwerkt die worden ingezameld bij
      of afgegeven door een andere persoon dan degene die de inrichting drijft, is binnen de inrichting een actuele
      beschrijving aanwezig van de procedures van acceptatie en controle van de ontvangen afvalstoffen, die nodig zijn
      voor een doelmatig beheer van die afvalstoffen.

      2 De beschrijving, bedoeld in het eerste lid, onderscheidt groepen van afvalstoffen waarvoor vanuit het oogpunt van
      doelmatig beheer van afvalstoffen verschillende procedures worden gehanteerd en omvat per onderscheiden groep van
      afvalstoffen in ieder geval de volgende elementen:

      a. het type ontdoener waarvan afvalstoffen worden aangenomen, voor zover dit gevolgen heeft voor de acceptatie
      en controle;

      b. de eisen die degene die de inrichting drijft, stelt aan de manier waarop de afvalstoffen worden aangeboden;

      c. de manier waarop de afvalstoffen worden gecontroleerd bij ontvangst, en

      d. de manier waarop de afvalstoffen die op een milieuhygiënisch relevante manier afwijken van wat gangbaar is voor
      de categorie, worden behandeld.

      3 Degene die de inrichting drijft draagt er zorg voor dat:

      a. de procedures van acceptatie en controle, bedoeld in het eerste lid, binnen de inrichting in acht worden
      genomen, en

      b. de afvalstoffen binnen de inrichting uitsluitend worden ingenomen voor zover die procedures worden nageleefd.

      4 Het bevoegd gezag kan in het belang van het doelmatig beheer van afvalstoffen bij maatwerkvoorschrift eisen
      stellen aan de invulling van de procedures, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.14b
  - number: 2.14c
    text: Deze afdeling is van toepassing op degene die een inrichting type A of een inrichting type B drijft.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.14c
  - number: '2.15'
    text: |-
      1 Degene die de inrichting drijft neemt alle energiebesparende maatregelen met een terugverdientijd van vijf jaar
      of minder of alle energiebesparende maatregelen die een positieve netto contante waarde hebben bij een interne
      rentevoet van 15%.

      2 Indien aannemelijk is dat niet wordt voldaan aan het eerste lid, kan het bevoegd gezag degene die de inrichting
      drijft waarvan het energieverbruik in enig kalenderjaar groter is dan 200.000 kilowatt uur aan elektriciteit of
      groter is dan 75.000 kubieke meter aardgasequivalenten aan brandstoffen, verplichten om binnen een door het bevoegd
      gezag te bepalen termijn, onderzoek te verrichten of te laten verrichten waaruit blijkt of aan het eerste lid wordt
      voldaan.

      3 Indien uit het onderzoek, bedoeld in het tweede lid, blijkt dat niet wordt voldaan aan het eerste lid, neemt
      degene die de inrichting drijft de in het eerste lid bedoelde maatregelen binnen een door het bevoegd gezag te
      bepalen redelijke termijn.

      4 Het eerste lid is niet van toepassing indien het energiegebruik in de inrichting in enig kalenderjaar kleiner
      is dan 50.000 kilowatt uur aan elektriciteit en kleiner is dan 25.000 kubieke meter aardgasequivalenten aan
      brandstoffen.

      5 Het eerste lid is niet van toepassing op een inrichting waarop de verboden, bedoeld in
      [artikel 16.5 van de wet][ref1], betrekking hebben en op een inrichting als bedoeld in
      [artikel 15.51, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16.5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15.51
