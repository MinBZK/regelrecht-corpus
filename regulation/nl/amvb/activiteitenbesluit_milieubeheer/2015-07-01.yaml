  - number: '4.126'
    text: |-
      Bij activiteiten in een laboratorium of een praktijkruimte worden ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico en het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van
      die emissies naar de buitenlucht de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.126
  - number: '4.127'
    text: |-
      Bij het gericht werken met biologische agentia in een laboratorium of een praktijkruimte wordt ten behoeve van het
      voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel
      mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen
      hiervan, ten minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.127
  - number: '5'
    text: |-
      Dit hoofdstuk is van toepassing op degene die een inrichting type C drijft, waartoe een installatie behoort als
      bedoeld in hoofdstuk III, IV of VI, of bijlage I van richtlijn nr. 2010/75/EU van het Europees Parlement en de
      Raad van 24 november 2010 inzake industriële emissies (geïntegreerde preventie en bestrijding van verontreiniging)
      (herschikking) (PbEU L 334).
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5
  - number: '5.1'
    text: |-
      1 Deze paragraaf is van toepassing op het in werking hebben van een grote stookinstallatie, met uitzondering van:

      a. een stookinstallatie die bestemd is voor het drogen of behandelen van voorwerpen of materialen door middel van
      rechtstreeks contact met verbrandingsgas;

      b. technische voorzieningen voor de zuivering van afgassen door verbranding die niet als autonome stookinstallatie
      worden geëxploiteerd;

      c. het regenereren van katalysatoren voor het katalytisch kraakproces;

      d. het omzetten van zwavelwaterstof in zwavel;

      e. in de chemische industrie gebruikte reactoren;

      f. cokesovens;

      g. windverhitters van hoogovens;

      h. technische voorzieningen die bij de voortstuwing van een voertuig, schip of vliegtuig worden gebruikt;

      i. gasturbines en gasmotoren die op offshoreplatforms worden gebruikt;

      j. stookinstallaties waarvoor emissie-eisen zijn gesteld in [paragraaf 5.2][ref1].

      2 Voor de toepassing van deze paragraaf worden twee of meer stookinstallaties met een nominaal thermisch
      ingangsvermogen van 15 MW of meer als één stookinstallatie aangemerkt en worden de nominale thermische
      ingangsvermogens opgeteld indien:

      a. de afgassen van die stookinstallaties via één schoorsteen worden afgevoerd, of

      b. die stookinstallaties zodanig zijn gelegen dat de afgassen, naar het oordeel van het bevoegd gezag, op technisch
      en economisch aanvaardbare wijze via één schoorsteen kunnen worden afgevoerd.

      3 Het begrip «vloeibare brandstof» is niet van toepassing op de installaties waarop deze paragraaf van toepassing
      is.

      4 Voor de toepassing van deze paragraaf wordt onder bestaande grote stookinstallatie verstaan: grote
      stookinstallatie die op 30 oktober 1999, overeenkomstig de toen geldende regelgeving, in bedrijf was, of waarvoor
      een vergunning was verleend en die uiterlijk op 30 oktober 2000 in gebruik is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5.1
    references:
