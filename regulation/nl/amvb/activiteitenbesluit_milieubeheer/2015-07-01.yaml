  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      *bevoegd gezag:* bevoegd gezag als bedoeld in [artikel 1.1 van de wet][ref1], alsmede:

      a. het bestuursorgaan dat bevoegd zou zijn een omgevingsvergunning voor de betrokken inrichting te verlenen;

      b. de beheerder, indien het lozen betreft als bedoeld in [artikel 6.2 van de Waterwet][ref2];

      c. burgemeester en wethouders, indien het lozen betreft als bedoeld in [artikel 10.32 van de wet][ref3];

      d. gedeputeerde staten van de provincie waar het lozen in de bodem plaatsvindt, indien dat lozen plaatsvindt anders
      dan vanuit een inrichting en geheel of gedeeltelijk plaatsvindt op een diepte van meer dan 10 meter beneden het
      maaiveld;

      e. burgemeester en wethouders van de gemeente waar het lozen op of in de bodem plaatsvindt, indien dat lozen
      plaatsvindt anders dan vanuit een inrichting, niet zijnde lozen in de bodem als bedoeld in onderdeel d;

      *inrichting type A:* een inrichting:

      a. waarvoor geen omgevingsvergunning is vereist voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref4];

      b. waar, indien binnen een afstand van 50 meter van de grens van de inrichting gevoelige objecten aanwezig
      zijn, in de periode tussen 19.00 en 7.00 uur gemiddeld vier of minder transportbewegingen, als bedoeld in
      [artikel 1.11, eerste lid][ref5], plaatsvinden met motorvoertuigen waarvan de massa van het ledig voertuig
      vermeerderd met het laadvermogen meer dan 3500 kilogram is;

      c. waarbij mede op basis van de aard van de inrichting, niet aannemelijk is dat in enig vertrek van de inrichting
      het equivalente geluidsniveau (Leq) veroorzaakt door de ten gehore gebrachte muziek in de representatieve
      bedrijfssituatie, meer bedraagt dan:

      1°. 70 dB(A), indien dit vertrek in- of aanpandig is gelegen met gevoelige gebouwen;

      2°. 80 dB(A), indien onderdeel 1° niet van toepassing is;

      d. waar in de buitenlucht of op een open terrein van de inrichting geen muziek ten gehore wordt gebracht;

      e. waar in de buitenlucht geen oefenterrein voor motorvoertuigen aanwezig is;

      f. waar geen koelinstallatie aanwezig is die volgens de gebruiksaanwijzing behoort te zijn gevuld met meer dan 30
      kilogram koudemiddel; en

      g. waar geen activiteiten worden verricht met afvalstoffen die van buiten de inrichting afkomstig zijn;

      h. waarbinnen geen van de in [hoofdstukken 3][ref6] en [4][ref7] alsmede de in de hoofdstukken 3 en 4 van de
      Regeling algemene regels voor inrichtingen milieubeheer genoemde activiteiten of slechts één of meer van de
      volgende activiteiten dan wel deelactiviteiten worden verricht:

      1°. het vervaardigen van voedingsmiddelen voor personen die wonen of werken in de inrichting;

      2°. het in werking hebben van stookinstallaties voor de verwarming van gebouwen of de verwarming van tapwater;

      3°. het bieden van parkeergelegenheid in een parkeergarage voor maximaal 30 personenauto’s;

      4°. het aanwezig hebben van een noodstroomaggregaat dat niet meer dan 50 uren per jaar in werking is;

      5°. het lozen van huishoudelijk afvalwater in een vuilwaterriool;

      6°. het lozen van afvloeiend hemelwater dat niet afkomstig is van een bodembeschermende voorziening;

      7°. het lozen van koelwater anders dan in een vuilwaterriool;

      8°. het lozen van grondwater bij ontwatering, niet zijnde grondwater als bedoeld in
      [artikel 3.1, eerste lid][ref8], op of in de bodem of met een duur van ten hoogste 48 uur;

      9° het opslaan in opslagtanks van maximaal 1.000 liter gasolie of biodiesel die voldoet aan NEN-EN 14214;

      10° het opslaan in opslagtanks van stoffen niet zijnde gevaarlijke stoffen, minerale olie of biodiesel die voldoet
      aan NEN-EN 14214;

      11°. het opslaan van gevaarlijke stoffen als bedoeld in
      [artikel 7.6, tweede lid en derde lid, onder a tot en met d, van het Bouwbesluit 2012][ref9];

      12°. het opslaan in verpakking van maximaal 50 liter gasolie of biodiesel die voldoet aan NEN-EN 14214;

      13°. het opslaan in verpakking van stoffen, niet zijnde gevaarlijke stoffen;

      14°. het lozen ten gevolge van reinigingswerkzaamheden aan vaste objecten, die periodiek worden uitgevoerd en
      waarbij uitsluitend vuilafzetting wordt verwijderd;

      *inrichting type B:* een inrichting waarvoor geen omgevingsvergunning is vereist voor een activiteit als bedoeld
      in [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref10] en die geen inrichting
      type A is;

      *inrichting type C:* een inrichting die behoort tot een categorie van inrichtingen die op grond van
      [artikel 1.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref11] is aangewezen;

      *maatwerkvoorschrift:*voorschrift als bedoeld in de [artikelen 8.42, eerste lid][ref12],
      en [10.32 van de wet][ref13], [artikel 17, derde lid][ref14], en
      [artikel 65, eerste lid, van de Wet bodembescherming][ref15] en [artikel 6.6, tweede lid, van de Waterwet][ref16],
      inhoudende:

      a. een beschikking waarbij het bevoegd gezag aanvullende eisen stelt, dan wel

      b. een ontheffing waarbij het bevoegd gezag de daarbij aangewezen bepalingen niet van toepassing verklaart al dan
      niet onder het stellen van beperkingen of voorwaarden;

      *wet:* de [Wet milieubeheer][ref17].


