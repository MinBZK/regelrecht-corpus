  - number: 1.21a
    text: |-
      1 Bij een melding als bedoeld in [artikel 1.10][ref1] worden, indien sprake is van het installeren van een gesloten
      bodemenergiesysteem waarop [paragraaf 3.2.8][ref2] van toepassing is, tevens de volgende gegevens gemeld:

      a. de naam en het adres van degene die boringen of andere werkzaamheden ten behoeve van de installatie uitvoert;

      b. een situatieschets, met een schaal van ten minste 1:1.000 en voorzien van een noordpijl, waarop de ligging van
      het systeem ten opzichte van de omgeving is aangegeven;

      c. de einddiepte waarop het systeem zal worden geïnstalleerd;

      d. de x-y-coördinaten van het middelpunt van het systeem;

      e. een onderbouwing waaruit blijkt dat het in werking hebben van het systeem niet leidt tot zodanige interferentie
      met een eerder geïnstalleerd bodemenergiesysteem dat het doelmatig functioneren van een van de desbetreffende
      systemen kan worden geschaad;

      f. het energierendement, uitgedrukt als de SPF, dat het bodemenergiesysteem zal behalen bij voorzien gebruik
      van het gebouw overeenkomstig de bestemming waarvoor het systeem is ontworpen, blijkend uit een schriftelijke
      verklaring van de installateur;

      g. het bodemzijdig vermogen van het systeem en de omvang van de behoefte aan warmte en koude waarin het systeem
      voorziet.

      2 Bij een melding als bedoeld in [artikel 1.10][ref3] die werkzaamheden als bedoeld in [artikel 3.16p][ref4]
      betreft, worden de naam en het adres vermeld van degene die die werkzaamheden verricht.

      3 Indien een gesloten bodemenergiesysteem is geïnstalleerd voor het tijdstip van inwerkingtreding van
      [paragraaf 3.2.8][ref5] en vanaf dat tijdstip vrijwillig een melding wordt gedaan van het in werking hebben van dat
      systeem, worden bij de melding de volgende gegevens verstrekt:

      a. de naam en het adres van degene die het systeem in werking heeft;

      b. een beschrijving van de kenmerken van het systeem;

      c. de in het eerste lid, onderdelen b tot en met d, en g, bedoelde gegevens.


