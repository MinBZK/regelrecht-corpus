  - number: '2.6'
    text: |-
      Indien de massastroom van een bron op jaarbasis kleiner is dan de in tabel 2.6 genoemde vrijstellingsgrens gelden
      in afwijking van [artikel 2.5][ref1] en de emissieconcentratie-eisen voor stoffen waarvoor in [hoofdstuk 4][ref2]
      eisen ten aanzien van emissies naar de lucht zijn gesteld, de daarin genoemde emissieconcentratie-eisen niet voor
