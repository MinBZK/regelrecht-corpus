      1 In afwijking van [artikel 3.28, eerste lid][ref1], geldt voor een opslagtank met propaan groter dan 5 kubieke
      meter met een bevoorradingsfrequentie van meer dan 5 keer per jaar, die is opgericht voor de inwerkingtreding van
      dat artikel gedurende drie jaar een afstand van 20 meter.

      2 In afwijking van [artikel 3.28, tweede lid][ref2], geldt voor een opslagtank met propaan met een
      bevoorradingsfrequentie van meer dan 5 keer per jaar, die is opgericht voor de inwerkingtreding van dat artikel,
      gedurende drie jaar een afstand van 7,5 meter. Deze afstand wordt gemeten vanaf de bovengrondse opslagtank.


