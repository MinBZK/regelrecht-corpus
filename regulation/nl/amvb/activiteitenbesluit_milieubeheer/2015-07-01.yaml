  - number: '1.15'
    text: |-
      Degene die een inrichting drijft verstrekt desgevraagd aan het bevoegd gezag binnen de door dat bestuursorgaan
      gestelde redelijke termijn, voor zover hij daarover beschikt of redelijkerwijs kan beschikken, alle gegevens over
      stoffen en preparaten en producten waarin stoffen of preparaten zijn verwerkt, die het bevoegd gezag redelijkerwijs
      nodig heeft voor het stellen van maatwerkvoorschriften.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.15
  - number: '1.16'
    text: |-
      1 Bij een melding als bedoeld in [artikel 1.10][ref1] worden, indien sprake is van het opslaan, overslaan of
      verwerken van afvalstoffen die van buiten de inrichting afkomstig zijn, de volgende gegevens gemeld:

      a. de afvalstoffen en de activiteiten met afvalstoffen, bedoeld in onderdeel 28.10, onder 1° tot en met 34° van
      onderdeel C, [bijlage 1, bij het Besluit omgevingsrecht][ref2], en

      b. per handeling per afvalstof de maximale opslagcapaciteit en de verwerkingscapaciteit per jaar.

      2 Indien de afvalstoffen, bedoeld in het eerste lid, worden ingezameld bij of worden afgegeven door een andere
      persoon dan degene die de inrichting drijft, wordt bij de melding een beschrijving gevoegd van de procedures van
      acceptatie en controle van de ontvangen afvalstoffen als bedoeld in [artikel 2.14b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
