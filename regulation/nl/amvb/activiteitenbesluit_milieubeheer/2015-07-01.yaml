  - number: '6.10'
    text: |-
      1 In afwijking van [artikel 2.9][ref1] kan het bevoegd gezag op aanvraag bij maatwerkvoorschrift bepalen dat een
      aanvaardbaar bodemrisico kan worden gerealiseerd, indien:

      a. voor de inwerkingtreding van artikel 2.9 binnen een inrichting een bodembedreigende activiteit werd uitgevoerd,
      of

      b. onmiddellijk voorafgaand aan het van toepassing worden van dit besluit of een deel daarvan, binnen een
      inrichting een bodembedreigende activiteit werd uitgevoerd en voor die inrichting een vergunning in werking en
      onherroepelijk was.

      2 Een maatwerkvoorschrift als bedoeld in het eerste lid kan slechts worden gesteld indien het realiseren van een
      verwaarloosbaar bodemrisico redelijkerwijs niet kan worden gevergd en is voldaan aan het derde lid.

      3 Bij de aanvraag, bedoeld in het eerste lid, wordt een plan van aanpak gevoegd, waarin ten minste is vastgelegd:

      a. de wijze waarop het monitoringssysteem wordt uitgevoerd;

      b. de bodemkwaliteit op dat moment, zoals dat is onderzocht en vastgelegd door een persoon of een instelling die
      daartoe beschikt over een erkenning op grond van het [Besluit bodemkwaliteit][ref2];

      c. de wijze waarop en de termijn waarbinnen eventueel optredende verontreiniging of aantasting van de bodem
      wordt hersteld door een persoon of instelling die daartoe beschikt over een erkenning op grond van het
      [Besluit bodemkwaliteit][ref3];

      d. de kosten die daarvoor worden geraamd en de wijze waarop hiervoor financiële zekerheid wordt gesteld.

      4 Het plan van aanpak, bedoeld in het derde lid, waarmee het bevoegd gezag heeft ingestemd maakt deel uit van het
      maatwerkvoorschrift.

      5 Onder een aanvaardbaar bodemrisico als bedoeld in het eerste lid wordt verstaan: een situatie als bedoeld in de
      NRB waarin een bodemrisico aanvaardbaar is gemaakt middels een monitoringssysteem en door het anticiperen op het
      beperken en zoveel mogelijk ongedaan maken van eventueel optredende verontreiniging of aantasting van de bodem.

      6 Het monitoringssysteem als bedoeld in het derde en vijfde lid, voldoet aan bijlage 3 van deel 3 van de NRB
      en wordt uitgevoerd door een persoon of instelling die daartoe beschikt over een erkenning op grond van het
      [Besluit bodemkwaliteit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.9
