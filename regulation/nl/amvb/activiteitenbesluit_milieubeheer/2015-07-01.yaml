      evenredigheid van de hoeveelheden waarin deze grondstoffen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5.34
  - number: '5.35'
    text: Degene die de inrichting drijft, draagt er zorg voor dat de emissie van zuurdruppels in de lucht wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5.35
  - number: '5.36'
    text: |-
      De emissies in de lucht overschrijden de emissiegrenswaarden van tabel 5.36 niet.


          Tabel 5.36






                  Totaal stof


                  0,2 kg/ton geproduceerde titaandioxide (kalenderjaargemiddelde)




                  Massastroom ≥200 g/uur


                  5 mg/Nm3 (uurgemiddelde)




                  Massastroom <200 g/uur


                  20 mg/Nm3 (uurgemiddelde)








                  Gasvormig zwaveldioxide en zwaveltrioxide


                  1,7 kg/ton geproduceerde titaandioxide (kalenderjaargemiddelde)





                  50 mg/Nm3 (uurgemiddelde)
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5.36
  - number: '5.37'
    text: |-
      De emissies in de lucht van chloor en chloorverbindingen van een installatie die het chlorideproces toepast,
      overschrijden de emissiegrenswaarden van tabel 5.37 niet.


          Tabel 5.37






                  Zoutzuur (HCl)


                  0,1 kg/ton geproduceerde titaandioxide (kalenderjaargemiddelde)





                  10 mg/Nm3 (daggemiddelde)








                  Chloor


                  3 mg/Nm3 (daggemiddelde)





                  40 mg/Nm3(momentane waarde)
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5.37
  - number: '5.38'
    text: |-
      De meting van de emissies, waaronder tevens begrepen wordt de berekening, registratie en rapportage van de meting,
      voldoet aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5.38
  - number: '5.39'
    text: |-
      Voor een IPPC-installatie voor de productie van titaandioxide waarvoor onmiddellijk voorafgaand aan het tijdstip
      van het van toepassing worden van deze paragraaf op die installatie een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] of een vergunning
      op grond van [hoofdstuk 6 van de Waterwet][ref2] was verleend, blijven de voorschriften van die vergunning van
      toepassing, tenzij de betreffende voorschriften gelijkwaardige of minder strenge emissiegrenswaarden bevatten dan
      die welke gelden op grond van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5.39
