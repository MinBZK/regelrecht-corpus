  - number: '4.41'
    text: |-
      1 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het lassen van roestvast staal of Berylliumlegeringen
      de emissieconcentratie van:

      a. chroom VI-verbindingen, berekend als chroom, niet meer dan 0,1 milligram per normaal kubieke meter, indien de
      massastroom van chroom VI-verbindingen naar de lucht, berekend als chroom, meer bedraagt dan 0,5 gram per uur; en

      b. berylliumverbindingen, berekend als beryllium, niet meer dan 0,05 milligram per normaal kubieke meter indien de
      massastroom van berylliumverbindingen naar de lucht, berekend als Beryllium, meer bedraagt dan 0,15 gram per uur.

      2 Het eerste lid is niet van toepassing indien de laswerkzaamheden op grond van de
      [artikelen 4.39, tweede lid][ref3], of [4.86][ref4] in de buitenlucht worden verricht.


