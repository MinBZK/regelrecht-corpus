  - number: '4.36'
    text: |-
      Bij verspanende bewerkingen waar metaalbewerkingsvloeistoffen worden verneveld of verdampt worden maatregelen
      getroffen om zichtbare verspreiding van druppels en nevels die vrijkomen bij verspanende bewerkingen waarbij
      bewerkingsvloeistoffen worden gebruikt, in de buitenlucht te voorkomen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.36
  - number: '4.37'
    text: |-
      Bij het smeden, droogverspanende bewerkingen, thermische bewerking en mechanische eindafwerking van metalen worden
      ten behoeve van het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van emissies naar
      de buitenlucht de bij ministeriële regeling te bepalen maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.37
  - number: '4.38'
    text: |-
      Bij spaanloze, verspanende of thermische bewerkingen of mechanische eindafwerking van metalen wordt ten behoeve van
      het realiseren van een verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.38
  - number: 4.38a
    text: Deze paragraaf is van toepassing op het lassen van metalen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.38a
  - number: '4.39'
    text: |-
      1 Het is verboden om in de buitenlucht laswerkzaamheden te verrichten.

      2 Het eerste lid is niet van toepassing indien het niet mogelijk is om in het inpandig deel van de inrichting te
      lassen vanwege de omvang van het te lassen object.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.39
  - number: '4.40'
    text: |-
      1 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij laswerkzaamheden behorend tot de klassen III tot en
      met VII, de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur; en

      b. 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.

      2 Bij ministeriële regeling wordt de indeling van laswerkzaamheden in klassen, bedoeld in het eerste lid,
      vastgesteld.

      3 Het eerste lid is niet van toepassing indien de laswerkzaamheden op grond van de
      [artikelen 4.39, tweede lid][ref3], of [4.86][ref4] in de buitenlucht worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
