  - number: '3.31'
    text: |-
      1 Deze paragraaf is van toepassing op het op- en overslaan van inerte goederen.

      2 Onverminderd het eerste lid is deze paragraaf voor zover het betreft inrichtingen type B van
      toepassing op het op- en overslaan van goederen, niet zijnde inerte goederen, voor zover dat niet is
      geregeld in de [paragrafen 3.3.3][ref1], [3.4.1][ref2], [3.4.2][ref3], [3.4.5 tot en met 3.4.7][ref4],
      [4.1.1 tot en met 4.1.4][ref5] en [4.1.7.][ref6]

      3 Onverminderd het eerste lid is deze paragraaf voor zover het betreft inrichtingen type C van toepassing op:

      a. het op- en overslaan van goederen, niet zijnde inerte goederen, voor zover dat niet is geregeld in de
      [paragrafen 3.4.1][ref7], [3.4.2][ref8], [3.4.4 tot en met 3.4.7][ref9], [4.1.1 tot en met 4.1.4][ref10] en
      [4.1.7][ref11], bij:

      1°. een autodemontagebedrijf of een demontagebedrijf voor tweewielige motorvoertuigen;

      2°. een zuiveringtechnisch werk, of

      3°. een inrichting waar uitvoering wordt gegeven aan [titel 10.4 van de wet][ref12];

      b. het lozen in een aangewezen oppervlaktewaterlichaam als gevolg van het op- en overslaan van andere goederen dan
      inerte goederen.

      4 Bij ministeriële regeling worden goederen aangewezen welke in ieder geval worden aangemerkt als inerte goederen.


