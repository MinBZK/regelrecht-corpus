  - number: '2.5'
    text: |-
      1 Indien de som van de onder normale procesomstandigheden gedurende één uur optredende massastromen van stoffen
      naar de lucht binnen een zelfde stofklasse vanuit alle bronnen in de inrichting de in tabel 2.5 opgenomen
      grensmassastroom van die stofklasse overschrijdt, emitteren al die bronnen afzonderlijk niet meer dan de in tabel
      2.5 opgenomen emissieconcentratie-eis behorende bij die stofklasse.

      2 Voor stofklasse S geldt dat alle bronnen in de inrichting afzonderlijk:

      a. niet meer dan 5 milligram per normaal kubieke meter emitteren, indien de massastroom van een stof of de som van
      de onder normale procesomstandigheden gedurende één uur optredende massastromen van stoffen binnen deze stofklasse
      vanuit al die bronnen, groter of gelijk is aan 200 gram per uur; of

      b. niet meer dan 50 milligram per normaal kubieke meter emitteren, indien de massastroom van een stof of de som van
      de onder normale procesomstandigheden gedurende één uur optredende massastromen van stoffen binnen deze stofklasse
      vanuit al die bronnen, kleiner is dan 200 gram per uur.

      3 Voor stofklasse sO geldt dat alle bronnen in de inrichting afzonderlijk:

      a. niet meer dan 5 milligram per normaal kubieke meter emitteren, indien de massastroom van een stof of de som van
      de onder normale procesomstandigheden gedurende één uur optredende massastromen van stoffen binnen deze stofklasse
      vanuit al die bronnen, groter of gelijk is aan 100 gram per uur; of

      b. niet meer dan 50 milligram per normaal kubieke meter emitteren, indien de massastroom van een stof of de som van
      de onder normale procesomstandigheden gedurende één uur optredende massastromen van stoffen binnen deze stofklasse
      vanuit al die bronnen, kleiner is dan 100 gram per uur.

      4 Indien voor een bron geen filtrerende afscheider kan worden toegepast, emitteert deze bron in afwijking van het
      tweede lid, onderdeel a, en derde lid, onderdeel a, afzonderlijk niet meer dan 20 milligram per normaal kubieke
      meter.

      5 Onverminderd het eerste lid is voor de stofcategorieën MVP, sA en gO de in tabel 2.5 bij die stofklasse genoemde
      emmissieconcentratie-eis voor alle bronnen afzonderlijk van toepassing indien:

      a. de gedurende één uur optredende massastromen van stoffen uit een stofklasse genoemd in tabel 2.5 tezamen met
      de gedurende hetzelfde uur optredende massastromen van stoffen uit de eerstvolgende hogere stofklasse genoemd in
      die tabel, vanuit alle bronnen in de inrichting de in die tabel genoemde grensmassastroom van de laatstbedoelde
      stofklasse overschrijdt;

      b. de gedurende één uur optredende massastromen van afzonderlijke stofklassen binnen één stofcategorie tezamen
      vanuit alle bronnen in de inrichting de in tabel 2.5 genoemde grensmassastroom van de hoogste stofklasse genoemd in
      die tabel van die stofcategorie overschrijdt.

      6 Indien eisen zijn gesteld aan de emissie van chroom VI-verbindingen wordt ten aanzien van de berekeningen in
      het eerste en vijfde lid gerekend met de afwijkende massastroom en emissieconcentratie-eis zoals opgenomen in de
      betreffende artikelen van [hoofdstuk 4][ref1].


