    text: |-
      Deze paragraaf is van toepassing op spaanloze, verspanende of thermische bewerking of mechanische eindafwerking
      van metalen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.31e
  - number: '4.32'
    text: |-
      1 Het is verboden om in de buitenlucht verspanende of thermische bewerkingen of mechanische eindafwerking van
      metalen uit te voeren.

      2 Het eerste lid is niet van toepassing indien het niet mogelijk is om in het inpandig deel van de inrichting
      verspanende of thermische bewerkingen of mechanische eindafwerking van metalen uit te voeren vanwege het volume of
      het gewicht van het te bewerken object.

      3 Bij het uitvoeren van fijnverspanende bewerkingen aan metalen in de buitenlucht wordt ten behoeve van het
      voorkomen van stofhinder voldaan aan bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.32
  - number: '4.33'
    text: |-
      1 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij smeden, shredderen, droogverspanende bewerkingen,
      thermische bewerkingen en bij mechanische eindafwerking van metalen, de emissieconcentratie van stofklasse S niet
      meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur; en

      b. 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.

      2 Het eerste lid is niet van toepassing indien de werkzaamheden op grond van de [artikelen 4.32, tweede lid][ref3],
      of [4.86][ref4] in de buitenlucht worden verricht.


