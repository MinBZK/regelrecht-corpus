  - number: 6.22a
    text: |-
      1 In afwijking van [artikel 3.20, vijfde lid][ref1], wordt een systeem voor dampretour fase-II bij een inrichting
      die is opgericht voor 1 januari 2012 ten minste eenmaal per drie jaar op de goede werking gecontroleerd
      overeenkomstig de testprocedure, bedoeld in artikel 3.20, vierde lid, onder a, tot het moment dat het geheel van de
      tanks, pompen en leidingen van de afleverinstallatie sterk wordt gewijzigd of vernieuwd.

      2 Het eerste lid is met ingang van 1 januari 2019 niet van toepassing op inrichtingen voor het afleveren van lichte
      olie aan motorvoertuigen voor het wegverkeer met een debiet van lichte olie van meer dan 3.000 kubieke meter per
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.20
