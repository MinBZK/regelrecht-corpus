  - number: '6.12'
    text: |-
      1 De waarden op de gevel van gevoelige gebouwen en op de grens van gevoelige terreinen in tabel 2.17a
      onderscheidenlijk 2.17g worden met 5 dB(A) verhoogd indien onmiddellijk voorafgaand aan het tijdstip waarop artikel
      2.17 op een inrichting van toepassing wordt, op grond van een voorschrift als bedoeld in het derde lid, hogere
      waarden golden.

      2 Indien in een milieuvergunning die inwerking en onherroepelijk was op het tijdstip genoemd in het op de
      inrichting van toepassing geweest zijnde voorschrift, genoemd in het derde lid, lagere waarden dan de waarden,
      bedoeld in het eerste lid, waren vastgesteld, zijn die lagere waarden van toepassing.

      3 De voorschriften, bedoeld in het eerste en tweede lid zijn: [voorschrift 1.1.3 van
      de bijlage van het Besluit opslag- en transportbedrijven milieubeheer](onbekend),
      [voorschrift 1.1.5 van bijlage 2 van het Besluit detailhandel- en ambachtsbedrijven milieubeheer][ref1],
      [voorschrift 1.1.7 van de bijlage van het Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer]
      (onbekend), [voorschrift 1.1.3 van de bijlage van het Besluit bouw- en houtbedrijven milieubeheer](onbekend),
      [voorschrift 1.1.5 van de bijlage van het Besluit woon- en verblijfsgebouwen milieubeheer](onbekend),
      [voorschrift 1.1.3 van bijlage 2 van het Besluit voorzieningen- en installaties milieubeheer][ref2],
      [voorschrift 1.1.3 van bijlage 1 van het Besluit textielreinigingsbedrijven milieubeheer][ref3],
      [voorschrift 1.1.3 van de bijlage van het Besluit inrichtingen voor motorvoertuigen milieubeheer]
      (onbekend), [voorschrift 3.2 van bijlage 2 van het Besluit tankstations milieubeheer][ref4],
      [voorschrift 4.2.1 van bijlage 1 van het Besluit tandartspraktijken milieubeheer][ref5] en
      [voorschrift 1.1.3 van bijlage 2 van het Besluit glastuinbouw][ref6].

      4 Voor inrichtingen als bedoeld in [artikel 2.17, vijfde lid][ref7], waarop onmiddellijk voorafgaand aan het
      tijdstip van inwerkingtreding van dat artikellid, [bijlage 2 van het Besluit glastuinbouw][ref8] van toepassing
      was, gelden in afwijking van artikel 2.17, vijfde lid, gedurende drie jaar na dat tijdstip de geluidswaarden van
      voorschrift 1.1.1 van bijlage 2 van het Besluit glastuinbouw.

      5 Een gemeentelijke verordening als bedoeld in [voorschrift 1.1.2 van de bijlage bij het Besluit landbouw
      milieubeheer](onbekend), zoals dat luidde op het tijdstip onmiddellijk voorafgaand aan de inwerkingtreding van
      [artikel 2.17, zevende lid][ref9], berust met ingang van dat tijdstip op dat lid.


