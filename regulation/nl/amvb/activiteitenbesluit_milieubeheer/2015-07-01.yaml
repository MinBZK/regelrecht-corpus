  - number: 1.14a
    text: |-
      1 Bij een melding als bedoeld in [artikel 1.10][ref1] worden:

      a. indien sprake is van het gericht werken met een biologisch agens die is of wordt ingedeeld in groep 2 in een
      laboratorium of praktijkruimte als bedoeld in [artikel 4.122][ref2], de ligging van de ruimten gemeld waar gewerkt
      wordt met een biologisch agens die is of wordt ingedeeld in groep 2,

      b. indien sprake is van het gericht werken met een biologisch agens, anders dan dat bedoeld onder a, en dat behoort
      tot een soort die bij ministeriële regeling is aangewezen, gemeld tot welke soort het biologisch agens behoort.

      2 Voor de groepsindeling, bedoeld in het eerste lid, onder a, wordt aangesloten bij de indeling in risico-groepen
      van richtlijn nr. 2000/54/EG van het Europees Parlement en de Raad van 18 september 2000 betreffende de bescherming
      van de werknemers tegen de risico’s van blootstelling aan biologische agentia op het werk.


