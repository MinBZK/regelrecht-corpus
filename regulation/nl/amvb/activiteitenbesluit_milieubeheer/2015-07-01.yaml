        bwb_id: BWBR0022762
        hoofdstuk: '3'
        paragraaf: 3.4.3
        afdeling: '3.4'
  - number: '4.20'
    text: |-
      Deze paragraaf is van toepassing op mechanische bewerkingen van hout of kurk dan wel van houten, kurken of
      houtachtige voorwerpen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.20
  - number: '4.21'
    text: |-
      1 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij mechanische bewerkingen van hout of kurk dan wel van
      houten, kurken of houtachtige voorwerpen, de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter indien de massastroom van stofklasse S gelijk is aan of groter is dan 200
      gram per uur;

      b. 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.

      2 Bij de mechanische bewerkingen van hout of kurk, dan wel van houten, kurken of houtachtige voorwerpen worden ten
      behoeve van het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van emissies naar de
      buitenlucht, de bij ministeriële regeling te bepalen maatregelen toegepast.

      3 Het eerste en tweede lid zijn niet van toepassing op het niet beroepsmatig onderhouden en repareren van
      pleziervaartuigen in de buitenlucht op de winterberging bij een jachthaven.

      4 Het eerste en tweede lid zijn niet van toepassing, indien bij de mechanische bewerkingen van hout of kurk in de
      inrichting niet meer dan 3 kubieke meter hout of kurk per jaar wordt bewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.21a
    text: |-
      Bij het verkleinen van hout of kurk dan wel van houten, kurken of houtachtige voorwerpen wordt ten behoeve van het
      realiseren van een verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.21a
  - number: 4.21b
    text: |-
      Deze paragraaf is van toepassing op het reinigen, coaten of lijmen van hout of kurk dan wel van houten, kurken of
      houtachtige voorwerpen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.21b
  - number: '4.22'
    text: |-
      1 Het is verboden om in de buitenlucht hout, kurk dan wel houten, kurken of houtachtige voorwerpen met behulp van
      een nevelspuit te coaten of te lijmen dan wel met behulp van een nevelspuit te reinigen met vluchtige organische
      stoffen houdende producten.

      2 Het eerste lid is niet van toepassing indien het niet mogelijk is om deze activiteiten in het inpandige deel van
      de inrichting te verrichten vanwege de omvang van het te bewerken object.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.22
  - number: '4.23'
    text: |-
      1 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het aanbrengen van coating of lijmlagen de
      emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur; en

      b. 50 milligram per normaal kubieke meter indien de massastroom naar de lucht van stofklasse S kleiner is dan 200
      gram per uur.

      2 Het eerste lid is niet van toepassing indien het coaten op grond van [artikelen 4.22, tweede lid][ref3], in de
      buitenlucht plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel4.22
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
