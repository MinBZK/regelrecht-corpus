  - number: 6.5a
    text: |-
      Indien op het tijdstip van het van toepassing worden van [artikel 1.4a][ref1] op het lozen anders dan vanuit een
      inrichting, nog niet is beslist op een aanvraag om een vergunning op grond van [artikel 6.2 van de Waterwet][ref2]
      voor lozen als bedoeld in artikel 1.4a en dit besluit op het betreffende lozen van toepassing is, wordt de aanvraag
      om de vergunning aangemerkt als een melding overeenkomstig [artikel 1.10a][ref3].


