      Totdat met betrekking tot een inrichting als bedoeld in [artikel 3.111][ref1] waarvan een tot de inrichting
      behorend dierenverblijf geheel of gedeeltelijk is gelegen binnen een zeer kwetsbaar gebied of in een zone van 250
      meter rondom een zodanig gebied een wijziging waarop [artikel 3.113][ref2] of [artikel 3.114][ref3] van toepassing
      is, is gemeld, worden binnen de inrichting niet meer landbouwhuisdieren per diercategorie gehouden en is de
      ammoniakemissie niet groter dan:

      a. op grond van een vergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref4] mochten worden
      gehouden, onderscheidenlijk mocht worden veroorzaakt onmiddellijk voorafgaand aan het tijdstip waarop dit besluit
      op de inrichting van toepassing werd, of

      b. op grond van de betrokken algemene maatregel van bestuur mochten worden gehouden, onderscheidenlijk mocht
      worden veroorzaakt, onmiddellijk voorafgaand aan het tijdstip van het van toepassing worden van dit besluit
      op de inrichting en waarvan in geval van oprichting of wijziging van de inrichting een melding als bedoeld in
      [artikel 8.41, eerste lid, van de Wet milieubeheer][ref5] was gedaan.


