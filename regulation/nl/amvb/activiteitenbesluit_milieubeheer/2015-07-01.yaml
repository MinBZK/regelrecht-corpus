  - number: '6.20'
    text: |-
      1 In afwijking van de [artikelen 3.10][ref1], [3.10d][ref2], [3.10e][ref3] of [3.10f][ref4], voldoet
      het rookgas van een stookinstallatie die voor 1 april 2010 is geplaatst of in gebruik is genomen, tot
      de datum, genoemd in het tweede of derde lid, aan de emissiegrenswaarden die op 31 maart 2010 voor
      die installatie golden ingevolge het [Besluit emissie-eisen stookinstallaties milieubeheer B][ref5] of
      het [Besluit emissie-eisen stookinstallaties milieubeheer A][ref6], dan wel aan de daarvan afwijkende
      emissiegrenswaarden, die voor die stookinstallatie golden op grond van een daarvoor verleende omgevingsvergunning.

      2 Het rookgas in een stookinstallatie als bedoeld in het eerste lid, voldoet met ingang van 1 januari 2017 aan de
      emissiegrenswaarden, genoemd in de [artikelen 3.10][ref7], [3.10d][ref8], [3.10e][ref9] of [3.10f][ref10].

      3 In afwijking van het tweede lid voldoet het rookgas in een stookinstallatie als bedoeld in het eerste lid
      voor zover die zich binnen de Nederlandse exclusieve economische zone bevindt dan wel deel uitmaakt van een
      inrichting waarin kooldioxide (CO), afkomstig van een andere inrichting, wordt ingezet ten behoeve van de bemesting
      van gewassen teneinde het gebruik van brandstof te verminderen, met ingang van 1 januari 2019 aan de in de
      [artikelen 3.10][ref11], [3.10d][ref12], [3.10e][ref13] of [3.10f][ref14] genoemde emissiegrenswaarden.

      4 Op het in werking hebben van een stookinstallatie die voor 1 januari 2014 is geplaatst of in gebruik
      is genomen en waarop [titel 16.3 van de wet][ref15] van toepassing was, zijn de op grond van de
      [artikelen 3.10 tot en met 3.10j][ref16] en [6.20 tot en met 6.20c][ref17] geldende emissiegrenswaarden en
      meetmethoden voor stikstofoxiden (NO) tot de datum, genoemd in het tweede of derde lid, niet van toepassing.
      Het bevoegd gezag kan voor deze stookinstallaties tot de in het tweede of derde lid genoemde data bij
      maatwerkvoorschrift emissiegrenswaarden en meetmethoden voor stikstofoxiden (NO) in het rookgas van de
      stookinstallatie vaststellen, indien de lokale luchtkwaliteit dat vergt.

      5 Het eerste tot en met het derde lid zijn niet van toepassing op het rookgas van een ketelinstallatie met een
      nominaal vermogen kleiner dan 1 megawatt.

      5 Indien ingevolge het eerste lid de emissiegrenswaarden van het
      [Besluit emissie-eisen stookinstallaties milieubeheer A][ref18] van toepassing zijn, zijn in afwijking van
      [artikel 3.10p][ref19] tevens de regels inzake keuring en onderhoud van dat besluit van toepassing.


