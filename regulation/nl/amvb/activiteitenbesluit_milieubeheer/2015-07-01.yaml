  - number: '2.8'
    text: |-
      1 Indien bij ministeriële regeling op grond van [artikel 1.7][ref1] is bepaald dat daarbij aangegeven
      maatregelen ter bescherming van het milieu kunnen worden toegepast en degene die de inrichting drijft op een
      andere wijze voldoet aan de eisen ten aanzien van de emissies naar de lucht van stoffen die bij of krachtens de
      [hoofdstukken 3][ref2] en [4][ref3] zijn gesteld:

      a. wordt op verzoek van het bevoegd gezag éénmalig aangetoond of de grensmassastromen zoals bedoeld in
      [artikel 2.5][ref4] en in de [hoofdstukken 3][ref5] en [4][ref6], vanwege het in werking zijn van de inrichting,
      niet overschreden worden; of

      b. wordt op verzoek van het bevoegd gezag indien een of meer grensmassastromen als bedoeld in [artikel 2.5][ref7]
      worden overschreden, eenmalig aangetoond of wordt voldaan aan de emissie-eisen dan wel een op grond van
      [artikel 2.7, eerste lid][ref8], gestelde eis ten aanzien van stoffen waarvoor in de [artikelen 3.26b][ref9],
      [3.38][ref10], [3.141][ref11], [3.143][ref12], [4.21][ref13], [4.23][ref14], [4.27a][ref15], [4.29][ref16],
      [4.31b][ref17], [4.33 tot en met 4.35][ref18], [4.40 tot en met 4.42][ref19], [4.44 tot en met 4.46][ref20],
      [4.50][ref21], [4.54][ref22], [4.54a][ref23], [4.58][ref24], [4.60][ref25], [4.62][ref26], [4.65][ref27],
      [4.68][ref28], [4.74b][ref29], [4.74f][ref30], [4.74j][ref31], [4.74s][ref32], [4.94][ref33], [4.94g][ref34],
      [4.103aa][ref35], [4.103d][ref36], [4.119][ref37] en [4.125][ref38], eisen ten aanzien van emissies naar de
      lucht zijn gesteld door middel van een emissiemeting, dan wel door middel van een emissieberekening mits dit is
      goedgekeurd door het bevoegd gezag, met uitzondering van bronnen waarvan is aangetoond dat de massastroom lager is
      dan de vrijstellingsgrens, bedoeld in [artikel 2.6][ref39].

      2 Het eerste lid, onderdelen a en b, is van overeenkomstige toepassing op een verandering van de inrichting indien
      de verandering naar verwachting zal leiden tot een significante toename van de emissie.

      3 Emissiemetingen ter controle op de naleving van de emissie-eisen worden uitgevoerd overeenkomstig paragraaf 3.7
      van de NeR en volgens:

      a. NEN-EN 13284-1, dan wel in het geval van continue metingen, volgens NEN-EN 13284-2, ten aanzien van stofklasse
      S;

      b. NEN-ISO 16740, ten aanzien van chroom VI -verbindingen;

      c. NEN-EN 14385, ten aanzien van zware metalen;

      d. NEN-EN 1911, dan wel in het geval van continue metingen volgens VDI 3480-3, ten aanzien van zoutzuur;

      e. NEN-ISO 15713, ten aanzien van waterstoffluoride;

      f. NEN-EN 14792, dan wel in het geval van continue metingen volgens NEN-ISO 10849, ten aanzien van stikstofoxiden;
      en

      g. NEN 2826, ten aanzien van ammoniak.

      4 Toetsing van emissiemetingen aan de emissieconcentratie-eisen als bedoeld in [artikel 2.5][ref40] en in de
      [hoofdstukken 3][ref41] en [4][ref42] vindt plaats overeenkomstig paragraaf 3.7 van de NeR.

      5 In afwijking van het derde lid kunnen andere bepalingsmethoden worden gebruikt indien deze gelijkwaardig zijn aan
      de in dat lid genoemde methoden.


