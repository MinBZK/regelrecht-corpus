  - number: '4.101'
    text: |-
      1 Een machine bestemd voor het reinigen met een koolwaterstof wordt zo ingesteld, gebruikt en onderhouden dat de
      hoeveelheid van die koolwaterstof in het gereinigde textiel en in de vrijkomende drooglucht niet meer bedraagt dan
      20 gram per kilogram gereinigd textiel.

      2 Indien bij ministeriële regeling als bedoeld in [artikel 4.95, tweede lid][ref1], een andere stof wordt
      aangewezen dan die genoemd in het eerste lid, kan bij die regeling tevens de ten hoogste toelaatbare hoeveelheid
      van die stof in het gereinigde textiel en in de vrijkomende drooglucht worden aangegeven.

      3 De drijver van de inrichting bewaart het laatste keurings- en onderhoudsrapport, waaruit mede blijkt wie en
      wanneer de keuring of het onderhoud heeft onderscheidenlijk is verricht.


