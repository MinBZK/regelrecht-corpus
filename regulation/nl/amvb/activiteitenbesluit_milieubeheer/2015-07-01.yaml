  - number: '2.7'
    text: |-
      1 Indien de NeR daartoe aanleiding geeft kan het bevoegd gezag de emissieconcentratie-eisen, bedoeld
      in de [artikelen 2.5][ref1] en [2.6][ref2], en de emissieconcentratie-eisen voor stoffen waarvoor in de
      [hoofdstukken 3][ref3] en [4][ref4] eisen ten aanzien van de emissies naar de lucht zijn gesteld, bij
      maatwerkvoorschrift niet van toepassing verklaren en met inachtneming van de NeR ten aanzien van stoffen genoemd
      in die artikelen en hoofdstukken andere emissieconcentratie-eisen dan wel andere eisen stellen ter beperking van de
      emissies naar de lucht.

      2 Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot het controleren van emissies naar de lucht
      als bedoeld in de [artikelen 2.5][ref5] en [2.6][ref6] ten aanzien van alle activiteiten waarvoor bij of krachtens
      de [hoofdstukken 3][ref7] en [4][ref8] eisen ten aanzien van emissies naar de lucht zijn gesteld indien:

      a. de inrichting een andere maatregel heeft gekozen dan de maatregel die is erkend op grond van de ministeriële
      regeling, bedoeld in [1.7][ref9];

      b. de toegepaste emissiebeperkende techniek in combinatie met de geëmitteerde stoffen leidt tot hoge
      storinggevoeligheid, er veel onderhoud nodig is dan wel er veel fluctuaties zijn in de aard en grootte van de
      emissies;

      c. de grootte en aard van de emissies daartoe aanleiding geven;

      d. de grootte van emissies die kunnen optreden bij storing aan de emissiebeperkende techniek, daartoe aanleiding
      geven.

      3 Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot het onderhoud en de controle
      van een emissiebeperkende techniek die door de inrichting wordt ingezet om aan de [artikelen 2.5][ref10],
      [2.6][ref11], [3.26b][ref12], [3.38][ref13], [3.141][ref14], [3.143][ref15], [4.21][ref16], [4.23][ref17],
      [4.27a][ref18], [4.29][ref19], [4.31b][ref20], [4.33 tot en met 4.35][ref21], [4.40 tot en met 4.42][ref22],
      [4.44 tot en met 4.46][ref23], [4.50][ref24], [4.54][ref25], [4.54a][ref26], [4.58][ref27], [4.60][ref28],
      [4.62][ref29], [4.65][ref30], [4.68][ref31], [4.74b][ref32], [4.74f][ref33], [4.74j][ref34], [4.74s][ref35],
      [4.94][ref36], [4.94g][ref37], [4.103aa][ref38], [4.103d][ref39], [4.119][ref40] en [4.125][ref41] te voldoen
      indien geen of naar de mening van het bevoegd gezag onvoldoende onderhoud is verricht aan de emissiebeperkende
      techniek.


