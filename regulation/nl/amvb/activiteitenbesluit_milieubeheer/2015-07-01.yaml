      1 [Artikel 3.51, eerste tot en met derde lid][ref1], is niet van toepassing op een mestbassin dat is opgericht
      voor het tijdstip van inwerkingtreding van dat artikel en dat op grond van een vergunning als bedoeld in
      [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref2], dan wel op grond
      van het [Besluit landbouw milieubeheer][ref3] of het [Besluit mestbassins milieubeheer][ref4] op een kleinere
      afstand is gelegen dan de afstand die zou gelden op grond van 3.51, eerste tot en met derde lid, de afstand tot een
      geurgevoelig object niet is afgenomen en verplaatsing van het mestbassin redelijkerwijs niet kan worden gevergd.

      2 Indien het eerste lid van toepassing is:

      a. treft degene die de inrichting drijft maatregelen of voorzieningen die geurhinder voorkomen of tot een
      aanvaardbaar niveau beperken, en

      b. geeft degene die de inrichting drijft op verzoek van het bevoegd gezag aan welke maatregelen of voorzieningen
      hij daartoe heeft getroffen of zal treffen.


