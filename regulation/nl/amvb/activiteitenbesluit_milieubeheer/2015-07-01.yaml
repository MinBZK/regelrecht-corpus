  - number: '3.86'
    text: |-
      De [artikelen 3.87][ref1] en [3.88][ref2] zijn van toepassing op substraatteelt van gewassen anders dan in een kas
      of een gebouw.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.87
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.88
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.86
    references:
