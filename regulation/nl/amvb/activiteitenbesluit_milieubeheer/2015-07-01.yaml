      1 Voor het langtijdgemiddelde beoordelingsniveau (L) en het maximaal geluidsniveau L, veroorzaakt door de in
      de inrichting aanwezige installaties en toestellen, alsmede door de in de inrichting verrichte werkzaamheden en
      activiteiten en laad- en losactiviteiten ten behoeve van en in de onmiddellijke nabijheid van de inrichting, geldt
      dat:

      a. de niveaus op de in tabel 2.17a genoemde plaatsen en tijdstippen niet meer bedragen dan de in die tabel
      aangegeven waarden;


                Tabel 2.17a









