  - number: '3.75'
    text: Deze paragraaf is van toepassing op het telen of kweken van gewassen in een gebouw, anders dan in een kas.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.75
  - number: '3.76'
    text: |-
      1 Bij het lozen van afvalwater als gevolg van het telen of kweken van gewassen in een gebouw, anders dan in een
      kas, wordt ten minste voldaan aan het tweede tot en met vijfde lid.

      2 Lozen in een oppervlaktewaterlichaam is toegestaan, indien:

      a. het perceel waar het afvalwater vrijkomt niet is aangesloten op een vuilwaterriool, waarop geloosd kan worden
      en de afstand tot het dichtstbijzijnde vuilwaterriool of zuiveringtechnisch werk waarop kan worden aangesloten en
      geloosd meer dan 40 meter bedraagt, of

      b. het afvalwater afkomstig is van een teelt waarbij geen gewasbeschermingsmiddelen of biociden worden gebruikt,
      van een ruimte waarin geen gewasbeschermingsmiddelen of biociden worden toegepast of van een ruimte waarin
      uitsluitend sprake is van biologische productiemethoden, en

      c. in het te lozen afvalwater, bedoeld in de onderdelen a en b:

      1°. het gehalte aan onopgeloste stoffen ten hoogste 100 milligram per liter bedraagt,

      2°. het gehalte aan chemisch zuurstof verbruik ten hoogste 300 milligram per liter bedraagt, en

      3°. het gehalte aan biochemisch zuurstof verbruik ten hoogste 60 milligram per liter bedraagt.

      3 De afstand, genoemd in het tweede lid, onderdeel a, wordt berekend:

      a. vanaf de kadastrale grens van het perceel waar het afvalwater vrijkomt, en

      b. langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.

      4 Bij het lozen van afvalwater in een vuilwaterriool, bedraagt het gehalte aan onopgeloste stoffen ten hoogste 300
      milligram per liter.

      5 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.76
  - number: '3.77'
    text: |-
      1 In afwijking van [artikel 3.76][ref1] wordt bij het lozen van afvalwater als gevolg van het circuleren van
      water door trekbakken waarin witlofpennen staan voor de groei van witlofstronken of als gevolg van het broeien van
      bolgewassen, ten minste voldaan aan het tweede tot en met het zesde lid.

      2 Het afvalwater wordt hergebruikt totdat het water niet langer geschikt is om als proceswater te worden gebruikt.

      3 Het lozen van afvalwater in een oppervlaktewaterlichaam is toegestaan, indien:

      a. het afvalwater afkomstig is van een teelt waarbij geen gewasbeschermingsmiddelen of biociden worden gebruikt of
      het proceswater afkomstig is van uitsluitend biologische productiemethoden, en

      b. het gehalte aan onopgeloste stoffen ten hoogste 100 milligram per liter bedraagt.

      4 Bij het lozen van afvalwater in een vuilwaterriool bedraagt het gehalte aan onopgeloste stoffen ten hoogste 300
      milligram per liter.

      5 Het lozen van afvalwater op of in de bodem is toegestaan, indien het afvalwater gelijkmatig wordt verspreid over
      de onverharde bodem.

      6 Het in een oppervlaktewaterlichaam of een vuilwaterriool te lozen afvalwater kan op een doelmatige wijze worden
      bemonsterd.


