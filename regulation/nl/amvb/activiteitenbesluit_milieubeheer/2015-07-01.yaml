  - number: '6.33'
    text: |-
      In afwijking van [artikel 6.2, vierde lid][ref1], kan het bevoegd gezag het lozen van afvalwater dat vrijkomt bij
      een of meer processen als bedoeld in de [paragrafen 4.5.7][ref2], [4.5.8][ref3], [4.5.10][ref4] en [4.5.11][ref5]
      bij maatwerkvoorschrift voor een daarbij aangegeven termijn bepalen dat het lozen van afvalwater met een hogere
      waarde dan de waarden genoemd in kolom B van tabel 4.73 is toegestaan, indien:

      a. het lozen van afvalwater met een hogere waarde dan de waarden genoemd in kolom B van tabel 4.73 was toegestaan
      op grond van een vergunning op grond van [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref6], die
      onmiddellijk voorafgaand aan het tijdstip van het van toepassing worden van [artikel 4.74][ref7] op de inrichting
      in werking en onherroepelijk was;

      b. degene die de inrichting drijft aantoont dat bij het lozen niet aan de emissiegrenswaarden genoemd in kolom B
      van [artikel 4.73][ref8] kan worden voldaan; en

      c. het verzoek tot het stellen van het maatwerkvoorschrift binnen zes maanden na het van toepassing worden van
      [artikel 4.74][ref9] op de inrichting bij het bevoegd gezag is gedaan.


