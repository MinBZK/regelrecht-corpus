  - number: '4.59'
    text: |-
      Bij het aanbrengen van anorganische deklagen van metaal worden ten behoeve van:

      a. het voorkomen dan wel beperken van diffuse emissies;

      b. het voorkomen dan wel beperken van stofhinder;

      c. het doelmatig verspreiden van emissies naar de buitenlucht;

      d. het voorkomen dan wel beperken van geurhinder;

      e. het realiseren van een verwaarloosbaar bodemrisico,

      de bij ministeriële regeling te bepalen maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.59
  - number: 4.59a
    text: Deze paragraaf is van toepassing op het beitsen of etsen van metalen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.59a
  - number: '4.60'
    text: |-
      1 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het beitsen of etsen van metalen of metalen
      voorwerpen de emissieconcentratie van:

      a. waterstoffluoride niet meer dan 3 milligram per normaal kubieke meter indien de massastroom van
      waterstoffluoride naar de lucht groter is dan 15 gram per uur;

      b. zoutzuur niet meer dan 10 milligram per normaal kubieke meter indien de massastroom van zoutzuur naar de lucht
      groter is dan 150 gram per uur, tenzij de concentratie aan zoutzuur in de ongereinigde massastroom kleiner is dan 1
      gram per normaal kubieke meter in welk geval de emissieconcentratie van zoutzuur niet meer is dan 30 milligram per
      normaal kubieke meter;

      c. salpeterzuur niet meer dan 30 milligram per normaal kubieke meter indien de massastroom van salpeterzuur groter
      is dan 150 gram per uur;

      d. zwavelzuur niet meer dan 3 milligram per normaal kubieke meter indien de massastroom van zwavelzuur groter is
      dan 15 gram per uur;

      e. azijnzuur niet meer dan 50 milligram per normaal kubieke meter indien de massastroom van azijnzuur groter is dan
      500 gram per uur.

      2 Bij het beitsen of etsen van metalen worden ten behoeve van het voorkomen dan wel beperken van diffuse emissies
      en het doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling te bepalen maatregelen
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.60
