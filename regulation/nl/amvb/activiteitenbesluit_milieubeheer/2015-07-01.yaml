  - number: '4.16'
    text: Deze paragraaf is van toepassing op het opslaan van vaste kunstmeststoffen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.16
  - number: '4.17'
    text: |-
      Onverminderd [paragraaf 3.4.3][ref1] wordt bij het opslaan van vaste kunstmeststoffen ten behoeve van het voorkomen
      van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk
      beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan,
      ten minste voldaan aan de bij ministeriële regeling te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.17
    references:
