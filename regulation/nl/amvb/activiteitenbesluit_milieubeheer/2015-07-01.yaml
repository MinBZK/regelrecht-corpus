      assimilatiebelichting wordt toegepast en waarbij het technisch of teelttechnisch redelijkerwijs niet kan worden
      gevergd de bovenzijde te voorzien van een lichtscherminstallatie als bedoeld in dat lid.

      2 [Artikel 3.58, eerste lid, onderdeel b][ref2], is tot 1 januari 2018 niet van toepassing op een kas als bedoeld
