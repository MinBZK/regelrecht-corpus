  - number: '4.99'
    text: |-
      1 Bij het meten van de immissieconcentratie van PER in de buitenlucht, bedoeld in [artikel 4.96, vierde lid][ref1],
      door middel van de methode met absorptiemateriaal zijn het tweede tot en met negentiende lid van toepassing.

      2 Er wordt gebruik gemaakt van monsterneming door middel van absorptiemateriaal in buisjes of badges.

      3 De toe te passen buisjes of badges hebben een detectielimiet van 0,1 milligram per normaal kubieke meter of lager
      en zijn volgens de schriftelijke verklaring van de fabrikant of leverancier geschikt voor de toepassing bij deze
      meetmethode.

      4 Bij de toepassing van buisjes of badges worden de door de fabrikant of leverancier opgestelde
      gebruiksvoorschriften in acht worden.

      5 De bemonstering van de buitenlucht kan zowel passief als actief plaatsvinden. In geval van actieve bemonstering
      vindt deze plaats met een daartoe geschikte pomp.

      6 De gasconcentratie in de buitenlucht wordt na analyse van de koolbuisjes berekend uit het quotiënt van de
      aangetroffen hoeveelheid PER in de bemonstering en het totaal doorgezogen luchtvolume.

      7 De meettijd bedraagt ten minste twee weken.

      8 De monstername vindt plaats in de buitenlucht en bij de keuze van een meetplaats wordt in beschouwing genomen:

      a. de afstand van het emissiepunt tot het dichtstbij gelegen gevoelige object, en

      b. de te verwachten wijze van emissie, waaronder het concentratieverloop in de tijd.

      9 De aanwezige en mogelijke emissieplaatsen en gevoelige objecten worden geïnventariseerd overeenkomstig de bij
      ministeriële regeling gestelde selectielijst meetplaatsen PER-imissiemeting.

      10 Als gevoelige objecten worden aangemerkt:

      a. te openen ramen, deuren en ventilatieroosters;

      b. terrassen;

      c. balkons;

      d. tuinen; en

      e. perceelsgrens.

      11 Per geïnventariseerde emissieplaats wordt de omvang van de emissie ingeschat.

      12 De afstand tot een gevoelig object wordt bepaald of ingeschat en ingedeeld in de volgende categorieën:

      a. minder dan 5 meter;

      b. vanaf 5 tot 15 meter;

      c. vanaf 15 tot 25 meter;

      d. vanaf 25 meter.

      13 Uit de geïnventariseerde gevoelige objecten wordt een selectie gemaakt van de gevoelige objecten die de meeste
      relevantie hebben.

      14 De resultaten van de inventarisatie van aanwezige en mogelijke meetplaatsen en gevoelige objecten, bedoeld in
      het negende lid, de inschatting van de emissie, bedoeld in het elfde lid, en de indeling en selectie van gevoelige
      objecten, bedoeld in het twaalfde en dertiende lid, worden in een verslag opgenomen.

      15 Een meting vindt plaats ter plaatse van de geselecteerde gevoelige objecten, bedoeld in het dertiende lid.
      Indien het gevoelige object geen perceelsgrens is, vindt tevens op de perceelsgrens een meting plaats. Indien
      meting op de perceelsgrens niet mogelijk is, wordt een plaats genomen die zo dicht mogelijk bij de perceelsgrens
      ligt.

      16 De exacte plaats van elke meetplaats wordt op een situatietekening aangegeven, die wordt opgenomen in een
      verslag.

      17 Het meetinstrumentarium wordt ter plaatse van een meetplaats bevestigd.

      18 De jaargemiddelde immissieconcentratie is gelijk aan de gemiddelde concentratie die gedurende twee weken wordt
      gemeten.

      19 Van een meting wordt een verslag gemaakt dat op eerste verzoek van het bevoegd gezag wordt overgelegd en
      gedurende ten minste twee jaren na de eerstvolgende meting in de inrichting wordt bewaard.


