      In afwijking van [artikel 5.19, eerste lid][ref1], stelt het bevoegd gezag voor een installatie die niet kan
      voldoen aan de op grond van dat artikellid toepasselijke emissiegrenswaarden, bij vergunningvoorschrift een
      emissiegrenswaarde voor koolmonoxide vast van ten hoogste:

      a. een daggemiddelde van 50 mg/Nm3 naast het tienminutengemiddelde, of,

      b. met betrekking tot een afvalverbrandings- of een afvalmeeverbrandingsinstallatie waarin de wervelbedtechnologie
      wordt gebruikt: een uurgemiddelde van 100 mg/Nm3.


