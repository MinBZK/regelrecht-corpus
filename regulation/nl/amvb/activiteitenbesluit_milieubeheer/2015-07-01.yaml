  - number: '3.82'
    text: |-
      Op braakliggend land worden binnen een afstand van 50 centimeter vanaf de insteek van een oppervlaktewaterlichaam
      geen gewasbeschermingsmiddelen gebruikt.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.82
  - number: '3.83'
    text: |-
      1 Het gebruik van veldspuitapparatuur is verboden, tenzij:

      a. deze uitsluitend is voorzien van spuitdoppen die in het toe te passen drukbereik, vergeleken met de grensdop van
      de klasse fijn en midden volgens de classificatie van de British Crop Protection Council (931-030-F110 bij 3 bar),
      een ten minste 50% kleiner volumepercentage druppels met een diameter kleiner dan 100 μm produceren;

      b. de buitenste in gebruik zijnde spuitdop aan de zijde van het oppervlaktewaterlichaam een kantdop is die
      aan de zijde van het oppervlaktewaterlichaam een verticale of nagenoeg verticale neerwaartse richting van de
      spuitvloeistof bewerkstelligt, en

      c. de apparatuur zodanig is ingesteld dat de spuitdoppen zich niet hoger dan 50 cm boven het gewas bevinden.

      2 Het driftarme karakter van spuitdoppen als bedoeld in het eerste lid:

      a. is vastgelegd in een keuringsverklaring, afgegeven door een deskundig, onafhankelijk instituut, waaruit blijkt
      dat een driftarme dop, die bij het gebruik van gewasbeschermingsmiddelen wordt toegepast, voldoet aan de bij of
      krachtens dit besluit gestelde eisen ten aanzien van driftarme doppen, en

      b. wordt volgens een bij ministeriële regeling te bepalen testmethode vastgesteld.

      3 Bij het gebruik van veldspuitapparatuur wordt:

      a. de spuitdruk geregistreerd door een drukregistratievoorziening, of

      b. uitsluitend gebruik gemaakt van venturidoppen uit de 50% driftreductieklasse.

      4 Bij het op- en zijwaarts spuiten van appelen, peren en overige pit- en steenvruchten op de wijze, bedoeld in
      [artikel 3.80, vierde lid, onderdeel c, onder 5°][ref1], waarbij spuitdoppen worden gebruikt die uitsluitend
      zijn aangewezen voor het gebruik bij een spuitdruk lager dan 5 bar, wordt de spuitdruk geregistreerd door een
      drukregistratievoorziening.

      5 Een drukregistratievoorziening als bedoeld in het derde lid, onderdeel a, en het vierde lid, voldoet aan de bij
      ministeriële regeling gestelde eisen.

      6 Het gebruik van gewasbeschermingsmiddelen is verboden bij een windsnelheid groter dan 5 meter per seconde,
      gemeten op spuitdophoogte, tenzij degene die de gewasbeschermingsmiddelen gebruikt, kan aantonen dat redelijkerwijs
      niet anders dan door het gebruik van die middelen bij een windsnelheid groter dan 5 meter per seconde een
      teeltbedreigende situatie kan worden afgewend.

      7 Het gebruik van een spuitgeweer dat is voorzien van een werveldop of dat gebruik maakt van een werkdruk van 5 bar
      of meer is verboden.

      8 Het eerste tot en met zesde lid is niet van toepassing op het gebruik van gewasbeschermingsmiddelen met een
      overkapte beddenspuit.

      9 Het eerste lid, onderdelen a en c, en tweede lid, zijn niet van toepassing op een veldspuit als bedoeld in
      [artikel 3.80, tweede lid, onderdeel a, onder 2°, of onderdeel b, onder 3°][ref2].

      10 In afwijking van het eerste lid, onderdeel c, kan bij ministeriële regeling ten aanzien van de daarbij
      aangewezen driftarme doppen een lagere hoogte worden vastgesteld waarop de spuitdoppen zich ten hoogste boven het
      gewas mogen bevinden.


