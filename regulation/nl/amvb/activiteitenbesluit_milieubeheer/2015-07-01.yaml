  - number: '4.100'
    text: |-
      1 Bij het meten van de immissieconcentratie van PER in de buitenlucht, bedoeld in [artikel 4.96, vierde lid][ref1],
      door middel van de methode met continu registrerende meetapparatuur zijn het tweede tot en met twintigste lid van
      toepassing.

      2 Er wordt gebruik gemaakt van continu registrerende meetapparatuur dat een detectielimiet heeft van 0,1 milligram
      per normaal kubieke meter of lager.

      3 Er wordt gemeten gedurende ten minste een hele werkdag waarbij het begin van een meting ligt op ten minste een
      uur voor de start van de bedrijfsvoering en het einde van een meting ligt op een uur na het beëindigen van de
      bedrijfsvoering op die werkdag.

      4 De meting wordt uitgevoerd bij de op de meetplaats van toepassing zijnde meest voorkomende windcondities met
      betrekking tot de windrichting en windsnelheid.

      5 Indien een gevoelig object zich niet aan de lijzijde van de meest voorkomende windrichting bevindt, wordt een
      meting uitgevoerd gedurende een tweede hele werkdag bij een tegenovergestelde windrichting.

      6 Voor het vaststellen van de meest voorkomende windcondities wordt gebruik gemaakt van de jaargegevens van het
      KNMI weerstation dat het dichtst bij de locatie is gelegen en deze gegevens worden in een verslag vermeld.

      7 Een meting wordt niet uitgevoerd wanneer er neerslag valt noch wanneer het mistig is.

      8 De monstername vindt plaats in de buitenlucht en bij de keuze van een meetplaats wordt in beschouwing genomen:

      a. de afstand van het emissiepunt tot het dichtstbij gelegen gevoelige object; en

      b. de te verwachten wijze van emissieconcentratieverloop in de tijd.

      9 Aanwezige en mogelijke emissieplaatsen van gevoelige objecten worden geïnventariseerd overeenkomstig de bij
      ministeriële regeling vastgestelde selectielijst meetplaatsen PER-imissiemeting.

      10 Als gevoelige objecten worden aangemerkt:

      a. te openen ramen, deuren en ventilatieroosters;

      b. terrassen;

      c. balkons;

      d. tuinen; en

      e. de perceelsgrens.

      11 Per geïnventariseerde emissieplaats wordt de omvang van de emissie ingeschat.

      12 De afstand tot een geïnventariseerd gevoelig object wordt bepaald of ingeschat en ingedeeld in de volgende
      categorieën:

      a. minder dan 5 meter;

      b. vanaf 5 tot 15 meter;

      c. vanaf 15 tot 25 meter;

      d. vanaf 25 meter.

      13 Uit de geïnventariseerde gevoelige objecten wordt een selectie gemaakt van de gevoelige objecten die de meeste
      relevantie hebben.

      14 De resultaten van de inventarisatie van aanwezige en mogelijke meetplaatsen en gevoelige objecten, bedoeld in
      het tiende lid, de inschatting van de emissie, bedoeld in het elfde lid, en de indeling en selectie van gevoelige
      objecten, bedoeld in het twaalfde en dertiende lid, worden in een verslag opgenomen.

      15 Een meting vindt plaats ter plaatse van de geselecteerde gevoelige objecten, bedoeld in het dertiende lid.
      Indien het gevoelige object geen perceelsgrens is, vindt tevens op de perceelsgrens een meting plaats. Indien
      meting op de perceelsgrens niet mogelijk is wordt een plaats genomen die zo dicht mogelijk bij de perceelsgrens
      ligt.

      16 De exacte plaats van elke meetplaats wordt op een situatietekening aangegeven, die wordt opgenomen in een
      verslag.

      17 Het meetinstrumentarium wordt ter plaatse van een meetplaats bevestigd.

      18 De gemiddelde immissieconcentratie wordt bepaald door de gemeten gemiddelde immissie te vermenigvuldigen met het
      quotiënt van het totaal aantal bedrijfsuren op jaarbasis en het totaal aantal uren per jaar. Het totaal aantal uren
      per jaar bedraagt 8760. Vervolgens wordt de gemeten immissie gecorrigeerd met de expositieduur die redelijkerwijs
      mag worden verondersteld, op het gevoelige object. De toe te passen expositieduur wordt ter goedkeuring aan het
      bevoegd gezag voorgelegd.

      19 Zowel de niet gecorrigeerde als de gecorrigeerde waarde van de berekende jaargemiddelde immissie wordt in een
      verslag vermeld.

      20 Van een meting wordt een verslag gemaakt dat op eerste verzoek van het bevoegd gezag wordt overgelegd en
      gedurende ten minste twee jaren na de eerstvolgende meting in de inrichting wordt bewaard.


