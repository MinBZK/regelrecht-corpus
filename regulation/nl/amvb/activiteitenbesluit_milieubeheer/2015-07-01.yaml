        artikel: '4.22'
        hoofdstuk: '4'
        paragraaf: 4.3.2
        afdeling: '4.3'
  - number: '4.24'
    text: |-
      1 Degene die de inrichting drijft neemt bij het reinigen, coaten of lijmen van hout of kurk dan wel van houten,
      kurken of houtachtige voorwerpen de bij ministeriële regeling gestelde emissiereducerende maatregelen met
      betrekking tot vluchtige organische stoffen tenzij deze niet kosteneffectief of technisch uitvoerbaar zijn.

      2 Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de
      in het eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar, zoals dat blijkt uit de
      oplosmiddelenboekhouding als bedoeld in het derde lid.

      3 Degene die een inrichting drijft als bedoeld in het eerste lid, voert een oplosmiddelenboekhouding waarin het
      verbruik van vluchtige organische stoffen per kilogram per jaar wordt geregistreerd.

      4 Het eerste en derde lid is niet van toepassing op het verbruik van vluchtige organische stoffen waarvan het in de
      handel brengen is gereguleerd door het [Besluit organische oplosmiddelen in verven en vernissen milieubeheer][ref1].

      5 De oplosmiddelenboekhouding, bedoeld in het derde lid, wordt ten minste drie jaar in de inrichting bewaard en ter
      inzage gehouden.

      6 Indien de drempelwaarden, genoemd in tabel 2.28a worden overschreden, zijn het eerste tot en met vijfde lid niet
      van toepassing en is [afdeling 2.11][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019122
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.24
