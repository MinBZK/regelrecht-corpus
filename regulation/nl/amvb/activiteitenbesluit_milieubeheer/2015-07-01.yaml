      1 [Artikel 4.80a][ref1] is niet van toepassing op inpandige afleverinstallaties voor lichte olie die zijn
      geïnstalleerd voor 1 januari 2011.

      2 In de gevallen, bedoeld in het eerste lid, waarin het inpandig afleveren van lichte olie is toegestaan, vindt
      het inpandig afleveren in het belang van het voorkomen van risico’s voor de omgeving en ongewone voorvallen dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat
      ongewone voorvallen zich voordoen en de gevolgen hiervan, ten minste plaats via een EU-systeem voor dampretour
      fase-II.

      3 Op het inpandig afleveren van lichte olie, bedoeld in het tweede lid, zijn
      [artikel 3.20, derde tot en met achtste lid][ref2], alsmede de krachtens die leden en krachtens
      [artikel 4.83][ref3] gestelde regels van toepassing.


