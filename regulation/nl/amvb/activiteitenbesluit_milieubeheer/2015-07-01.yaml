  - number: 1.3a
    text: |-
      Dit besluit berust mede op de [artikelen 10.2, tweede lid][ref1], en [10.32 van de wet][ref2],
      de [artikelen 6.2, eerste lid, onderdeel b, en tweede lid, onderdeel b][ref3], [6.6][ref4],
      [6.7][ref5] en [6.12, onderdeel e, van de Waterwet][ref6], de [artikelen 78][ref7],
