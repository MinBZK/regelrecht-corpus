      lozen een ontheffing die als maatwerkvoorschrift als bedoeld [artikel 3.131, vijfde lid][ref3], wordt aangemerkt.

      3 Het tweede lid is van overeenkomstige toepassing op een inrichting waarop met ingang van 1 januari 2008 tot
