      1 [Artikel 3.3, derde lid][ref1], is niet van toepassing op het lozen vanuit een inrichting dat is aangevangen voor
      het van toepassing worden van dat artikel op die inrichting.

      2 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat het lozen, bedoeld in artikel 3.3, eerste lid, in het
      vuilwaterriool van afvloeiend hemelwater dat niet afkomstig is van een bodembeschermende voorziening, dat reeds
      plaatsvond voorafgaand aan het tijdstip, bedoeld in het eerste lid, binnen een in dat maatwerkvoorschrift gestelde
      termijn wordt gestaakt.


