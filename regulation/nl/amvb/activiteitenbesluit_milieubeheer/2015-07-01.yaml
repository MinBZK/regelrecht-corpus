  - number: '5.9'
    text: |-
      1 Bij gelijktijdig gebruik van verschillende soorten brandstof in een grote stookinstallatie gelden
      als emissiegrenswaarden voor zwaveldioxide, stikstofoxiden en totaal stof de gewogen gemiddelden van de
      emissiegrenswaarden die op grond van de [artikelen 5.4 tot en met 5.8][ref1] voor elk van de brandstoffen
      afzonderlijk zouden gelden.

      2 Een gewogen gemiddelde als bedoeld in het eerste lid wordt per tijdseenheid berekend naar het aandeel van elk van
      de brandstoffen in de energetische inhoud van de toegevoerde brandstoffen.

      3 In afwijking van het eerste lid bedraagt de emissie van zwaveldioxide van een bestaande grote stookinstallatie
      gemiddeld niet meer dan 500 mg/Nm3 indien:

      a. die installatie deel uitmaakt van een raffinaderij, en

      b. die installatie destillatie- of omzettingsresiduen afkomstig van het raffineren van ruwe aardolie, alleen of in
      combinatie met andere brandstoffen, zelf verbruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.4
