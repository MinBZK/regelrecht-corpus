  - number: '4.75'
    text: |-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van een of meer activiteiten als bedoeld in de
      [paragrafen 4.6.2][ref1], [4.6.3][ref2], [4.6.5][ref3] en [4.6.6][ref4] wordt ten minste voldaan aan het tweede tot
      en met het vijfde lid.

      2 In het afvalwater afkomstig van het reviseren van motoren worden de emissiegrenswaarden genoemd in tabel 4.75
      niet overschreden:


            Tabel 4.75






                    Stoffen


                    Emissiegrenswaarde






                    BTEX-som


                    15 milligram per liter




                    Vluchtige organohalogeenverbindingen uitgedrukt als chloor


                    100 microgram per liter




                    Olie


                    20 milligram per liter




                    PAK’s


                    5 microgram per liter




                    Koper


                    1 milligram per liter




                    Nikkel


                    3 milligram per liter




                    Lood


                    3 milligram per liter




                    Zink


                    3 milligram per liter




                    Chroom


                    2 milligram per liter






      3 Ander afvalwater dan het afvalwater, bedoeld in het tweede lid, dat afkomstig is uit een ruimte waar een
      activiteit als bedoeld in het eerste lid wordt uitgevoerd of van een vloeistofdichte vloer of verharding waarop die
      activiteit wordt uitgevoerd wordt niet geloosd, indien het in enig steekmonster meer bevat dan:

      a. 20 milligram olie per liter;

      b. 300 milligram onopgeloste stoffen per liter.

      4 In afwijking van het derde lid bedraagt het gehalte aan olie ten hoogste 200 milligram per liter in enig
      steekmonster indien het afvalwater, voor vermenging met ander afvalwater, wordt geleid door een slibvangput en
      olieafscheider die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.

      5 Het te lozen afvalwater, bedoeld in het tweede en derde lid, kan op een doelmatige wijze worden bemonsterd.


