  - number: '1.7'
    text: |-
      1 Bij ministeriële regeling kunnen:

      a. ter bescherming van het milieu regels worden gesteld ter uitwerking van de [hoofdstukken 2][ref1], [3][ref2]
      en [4][ref3];

      b. ter uitwerking van de bij of krachtens dit besluit voor het lozen in een oppervlaktewaterlichaam gestelde
      regels, oppervlaktewaterlichamen worden aangewezen, die met het oog op het lozen geen bijzondere bescherming
      behoeven.

      2 Bij ministeriële regeling kan de verplichting worden opgelegd te voldoen aan maatwerkvoorschriften die nodig zijn
      ter bescherming van het milieu gesteld door het bevoegd gezag met betrekking tot de regels, bedoeld in het eerste
      lid, onderdeel a, en kan worden bepaald in welke mate die maatwerkvoorschriften kunnen afwijken van de regels,
      bedoeld in onderdeel a.

      3 Bij ministeriële regeling worden regels gesteld omtrent de bij de toepassing van dit besluit in acht te nemen
      tekst van:

      a. de bij of krachtens dit besluit genoemde niet-publiekrechtelijke regelingen;

      b. de NeR; en

      c. de NRB.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0022762
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0022762
        hoofdstuk: '4'
  - number: '1.8'
    text: |-
      Indien bij of krachtens dit besluit is bepaald dat een daarbij aangegeven maatregel ter bescherming van het milieu
      moet worden toegepast kan een andere maatregel worden toegepast indien het bevoegd gezag heeft beslist dat met die
      maatregel ten minste een gelijkwaardig niveau van bescherming van het milieu wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.8
  - number: '1.9'
    text: |-
      Van de beschikking waarbij bij of krachtens dit besluit een maatwerkvoorschrift wordt gesteld, wordt kennisgegeven
      in één of meer dagbladen, nieuwsbladen of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.9
  - number: 1.9a
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1], is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om accreditatie als
      bedoeld in [artikel 3.20, vierde lid, onder a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel3.20
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.9a
