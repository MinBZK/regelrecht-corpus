        bwb_id: BWBR0022762
        artikel: '3.3'
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: '3.26'
    text: |-
      Deze paragraaf is van toepassing op:

      a. het demonteren van autowrakken of wrakken van tweewielige motorvoertuigen,

      b. het aftappen van vloeistoffen uit autowrakken of wrakken van tweewielige motorvoertuigen,

      c. het opslaan van autowrakken of wrakken van tweewielige motorvoertuigen voorafgaand aan het demonteren en het
      aftappen van vloeistoffen,

      d. het opslaan van afvalstoffen die vrijkomen bij het demonteren van autowrakken of wrakken van tweewielige
      motorvoertuigen en het aftappen van vloeistoffen uit autowrakken of wrakken van tweewielige motorvoertuigen, en

      e. het neutraliseren van airbags en gordelspanners.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.26
  - number: 3.26a
    text: |-
      Bij de activiteiten, bedoeld in [artikel 3.26][ref1], wordt ten behoeve van:

      a. een doelmatig beheer van afvalstoffen;

      b. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan, en

      c. het realiseren van een verwaarloosbaar bodemrisico;

      ten minste voldaan aan de bij ministeriële regeling te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.26a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3.26'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.26b
    text: |-
      1 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het ontsteken van airbags en gordelspanners de
      emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur;

      b. 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.

      2 Bij het ontsteken van airbags en gordelspanners worden ten behoeve van het voorkomen dan wel het beperken van
      diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling
      voorgeschreven maatregelen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.26b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 3.26c
    text: |-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van:

      a. het demonteren van autowrakken of wrakken van tweewielige motorvoertuigen,

      b. het voor demontage aanwezig hebben van autowrakken of wrakken van tweewielige motorvoertuigen die vloeistoffen
      bevatten, of

      c. het opslaan van vloeistof bevattende onderdelen van autowrakken of wrakken van tweewielige motorvoertuigen,

      wordt ten minste voldaan aan het tweede tot en met vierde lid.

      2 Het afvalwater bevat in enig steekmonster niet meer dan:

      a. 20 milligram olie per liter;

      b. 300 milligram onopgeloste stoffen per liter.

      3 In afwijking van het tweede lid mag het gehalte aan olie ten hoogste 200 milligram per liter in enig steekmonster
      bedragen, indien het afvalwater voorafgaand aan vermenging met ander afvalwater wordt geleid door een slibvangput
      en olieafscheider die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.

      4 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.26c
  - number: 3.26d
    text: Deze paragraaf is van toepassing op een parkeergarage met meer dan 20 parkeerplaatsen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.26d
  - number: 3.26e
    text: |-
      1 Bij een mechanische ventilatie in een parkeergarage met meer dan 20 parkeerplaatsen wordt ten behoeve van:

      a. het doelmatig verspreiden van emissies;

      b. het voorkomen dan wel beperken van geurhinder, of

      c. het voorkomen dan wel beperken van luchtverontreiniging door benzeen,

      voldaan aan de bij ministeriële regeling gestelde eisen.

      2 Het bevoegd gezag kan bij maatwerkvoorschrift eisen stellen ten aanzien van:

      a. de beperking van de emissie van benzeen uit een parkeergarage indien dit nodig is in het belang van de
      luchtkwaliteit, of

      b. de aanzuigopeningen en uitblaasopeningen van de mechanische ventilatie van een parkeergarage en de uitvoering en
      het onderhoud van de ventilatoren indien dit nodig is in het belang van de luchtkwaliteit dan wel indien dit nodig
      is om de geurhinder te voorkomen dan wel voor zover dat niet mogelijk is te beperken.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.26e
  - number: 3.26f
    text: |-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van een activiteit als bedoeld in
      [artikel 3.26d][ref1] wordt ten minste voldaan aan het tweede tot en met het vierde lid.

      2 Afvalwater dat afkomstig is uit een ruimte waar een activiteit als bedoeld in het eerste lid wordt uitgevoerd of
      van een vloeistofdichte vloer of verharding waarop die activiteit wordt uitgevoerd wordt niet geloosd, indien het
      in enig steekmonster meer bevat dan:

      a. 20 milligram olie per liter;

      b. 300 milligram onopgeloste stoffen per liter.

      3 In afwijking van het tweede lid bedraagt het gehalte aan olie ten hoogste 200 milligram per liter in enig
      steekmonster indien het afvalwater, voor vermenging met ander afvalwater, wordt geleid door een slibvangput en
      olieafscheider die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.

      4 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26d
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.26f
