  - number: '6'
    text: |-
      Dit hoofdstuk is van toepassing op degene die een inrichting type A, een inrichting type B, of een inrichting type
      C drijft.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel6
  - number: '6.1'
    text: |-
      1 Voor inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip van het van toepassing
      worden van dit besluit of een deel daarvan op een activiteit in die inrichtingen, een vergunning op
      grond van [artikel 8.1 van de Wet milieubeheer][ref1] dan wel een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] in werking en
      onherroepelijk was, worden de voorschriften van die vergunning gedurende drie jaar na het van toepassing worden
      van dit besluit of een deel daarvan op een activiteit in die inrichtingen, aangemerkt als maatwerkvoorschriften,
      mits de voorschriften van die vergunning vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van
      maatwerkvoorschriften en voor zover dit besluit op de inrichting van toepassing is.

      2 De nadere eisen die voor een inrichting onmiddellijk voorafgaand aan het tijdstip van het van toepassing worden
      van dit besluit of een deel daarvan op een activiteit in die inrichting op grond van de besluiten, bedoeld in
      [artikel 6.43][ref3] in werking en onherroepelijk waren, worden aangemerkt als maatwerkvoorschriften, mits de
      nadere eisen vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften en voor
      zover dit besluit op de inrichting van toepassing is.

      3 De maatwerkvoorschriften die voor een inrichting onmiddellijk voorafgaand aan het tijdstip van het van toepassing
      worden van dit besluit of een deel daarvan op een activiteit in die inrichting op grond van de besluiten,
      bedoeld in [artikel 6.43][ref4] in werking en onherroepelijk waren, blijven van kracht, mits ze vallen binnen
      de bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften en voor zover dit besluit op die
      inrichting van toepassing is.

      4 De voorschriften van een vergunning als bedoeld in het eerste lid dan wel de nadere eisen op grond van de
      besluiten, bedoeld in [artikel 6.43][ref5], die voor een inrichting onmiddellijk voorafgaand aan het tijdstip
      van het van toepassing worden van dit besluit of een deel daarvan op een activiteit in die inrichting in
      werking en onherroepelijk waren en niet vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van
      maatwerkvoorschriften, worden indien op grond van dit besluit strengere bepalingen gelden, gedurende zes maanden
      aangemerkt als maatwerkvoorschriften.

      5 Voor de toepassing van dit artikel worden de gegevens die in de aanvraag staan en die geacht worden onderdeel
      te zijn van de voorschriften van de vergunning, bedoeld in het eerste lid, aangemerkt als voorschriften van de
      vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref5]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
