  - number: 3.5e
    text: |-
      1 Bij het lozen in een oppervlaktewaterlichaam wordt ten minste voldaan aan het tweede tot en met zevende lid.

      2 Een zuiveringtechnisch werk wordt zodanig ontworpen, gebouwd, geëxploiteerd en onderhouden dat onder alle normale
      plaatselijke weersomstandigheden de doelmatige werking daarvan is gewaarborgd, ongebruikelijke situaties daarbij
      buiten beschouwing gelaten.

      3 De plaats van de lozing en de benedenstroomse afvoer zijn van dien aard dat nadelige gevolgen voor de kwaliteit
      van het ontvangende oppervlaktewaterlichaam worden voorkomen dan wel voor zover dat niet mogelijk is zoveel
      mogelijk worden beperkt.

      4 Stedelijk afvalwater met een vervuilingswaarde van 2.000 inwonerequivalenten of meer ondergaat in een
      zuiveringtechnisch werk een zodanige behandeling, dat het voorafgaand aan het lozen in een oppervlaktewaterlichaam
      ten minste voldoet aan de volgende grenswaarden:









                    Parameters


                    Grenswaarde in etmaalmonster


                    Grenswaarde als voortschrijdend jaargemiddelde






                    Biochemisch zuurstofverbruik (BZV bij 20 °C) zonder nitrificatie


                    20 milligram O per liter





                    Chemisch zuurstofverbruik (CZV)


                    125 milligram O per liter





                    Totale hoeveelheid onopgeloste stoffen


                    30 milligram per liter





                    Totaal fosfor (ontwerpcapaciteit van meer dan 100.000 inwonerequivalenten)



                    1,0 milligram per liter




                    Totaal fosfor (ontwerpcapaciteit van 2.000 tot en met 100.000 inwonerequivalenten)



                    2,0 milligram per liter




                    Totaal stikstof (ontwerpcapaciteit van 20.000 inwonerequivalenten of meer)



                    10 milligram per liter




                    Totaal stikstof (ontwerpcapaciteit van 2.000 tot 20.000 inwonerequivalenten)



                    15 milligram per liter






      5 De beoordeling of bij het lozen wordt voldaan aan de grenswaarden, genoemd in het vierde lid, geschiedt
      overeenkomstig de bij ministeriële regeling gestelde eisen.

      6 Het bevoegd gezag kan, indien het belang van de bescherming van de kwaliteit van het oppervlaktewaterlichaam
      daartoe noodzaakt, bij maatwerkvoorschrift lagere grenswaarden vaststellen dan de grenswaarden, genoemd in het
      vierde lid.

      7 Het bevoegd gezag kan bij maatwerkvoorschrift op verzoek van het openbaar lichaam of een andere rechtspersoon
      die krachtens [artikel 3.4 van de Waterwet][ref1] is belast met de zorg voor een zuiveringtechnisch werk,
      de grenswaarden voor de concentraties totaal fosfor en totaal stikstof, genoemd in het vierde lid, niet van
      toepassing verklaren en hogere grenswaarden vaststellen dan de grenswaarden, bedoeld in dat lid, indien het
      percentage van totaal fosfor onderscheidenlijk totaal stikstof dat uit het stedelijk afvalwater wordt verwijderd
      en dat op de onder de zorg van hetzelfde openbaar lichaam of dezelfde andere rechtspersoon staande gezamenlijke
      zuiveringtechnische werken wordt aangevoerd, ten minste 75 procent bedraagt en het een zuiveringtechnisch werk
      betreft:

      a. dat voor 1 september 1992 in bedrijf is genomen en waarvan de ontwerpcapaciteit sinds die datum met niet meer
      dan 25 procent is uitgebreid, of

      b. met een ontwerpcapaciteit van minder dan 20.000 inwonerequivalenten.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3.4
