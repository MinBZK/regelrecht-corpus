  - number: '5.12'
    text: |-
      1 Indien bij een grote stookinstallatie de afgasreinigingsapparatuur is uitgevallen en deze apparatuur niet binnen
      24 uur weer normaal functioneert, wordt de grote stookinstallatie geheel of gedeeltelijk buiten gebruik gesteld of
      met een weinig vervuilende brandstof in bedrijf gehouden.

      2 Een grote stookinstallatie mag als gevolg van storingen als bedoeld in het eerste lid gedurende ten hoogste 120
      uur gedurende een periode van 12 maanden in bedrijf zijn zonder dat de afgasreinigingsapparatuur functioneert.

      3 Het bevoegd gezag kan bij maatwerkvoorschrift de periode, bedoeld in het eerste of tweede lid, verlengen, indien:

      a. het absoluut noodzakelijk is om de energievoorziening in stand te houden, of

      b. de betreffende grote stookinstallatie anders gedurende die periode vervangen zou worden door een
      stookinstallatie die over het geheel genomen hogere emissies zou veroorzaken.

      4 Degene die de inrichting drijft, meldt een geval als bedoeld in het eerste lid binnen 48 uur aan het bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5.12
  - number: '5.13'
    text: |-
      De meting van de emissies, waaronder tevens begrepen wordt de berekening, registratie en rapportage van de meting,
      voldoet aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel5.13
  - number: '5.14'
    text: |-
      1 Tot 1 januari 2016 is deze paragraaf niet van toepassing op een grote stookinstallatie:

      a. waarvoor vergunning is verleend vóór 1 januari 2013, of

      b. waarvoor vóór 1 januari 2013 een ontvankelijke aanvraag om vergunning is ingediend en die uiterlijk op 1 januari
      2014 in gebruik is genomen.

      2 Voor een grote stookinstallatie waarop onmiddellijk voorafgaand aan het tijdstip van het van
      toepassing worden van deze paragraaf op die grote stookinstallatie een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] was verleend,
      blijven de voorschriften van die vergunning van toepassing, tenzij de betreffende voorschriften gelijke of minder
      strenge emissiegrenswaarden bevatten dan die welke gelden op grond van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
