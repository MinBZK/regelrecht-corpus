  - number: 1.9b
    text: |-
      Deze afdeling is van toepassing op degene die:

      a. een inrichting type B drijft, of

      b. een inrichting type C drijft, voor zover deze afdeling betrekking heeft op activiteiten die verricht worden
      binnen de inrichting waarop [hoofdstuk 3][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.9b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '3'
  - number: '1.10'
    text: |-
      1 Degene die een inrichting opricht, meldt dit ten minste vier weken voor de oprichting aan het bevoegd gezag.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting en het
      veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding overeenkomstig dit
      artikel is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding verstrekte gegevens.

      3 Bij de melding worden de volgende gegevens verstrekt:

      a. het adres en het nummer van de Kamer van Koophandel van de inrichting;

      b. de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien dit iemand anders is, van degene die de inrichting drijft of zal drijven;

      c. het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de
      verandering van de werking daarvan verwezenlijkt zal zijn;

      d. de aard en omvang van de activiteiten en processen in de inrichting;

      e. de indeling en uitvoering van de inrichting, waarbij de grenzen van het terrein van de inrichting, de ligging en
      de indeling van de gebouwen, de functie van de te onderscheiden ruimten en de ligging van de bedrijfsriolering en
      de plaats van de lozingspunten worden aangegeven; en

      f. een situatieschets, met een schaal van ten minste 1:10.000 waarop de ligging van de inrichting ten opzichte van
      de omgeving is aangegeven en die is voorzien van een noordpijl.

      4 Het bestuursorgaan dat een melding ontvangt waarvoor een ander bestuursorgaan mede bevoegd gezag is, stuurt
      onverwijld een kopie van de melding aan dat andere bevoegde gezag. De melding wordt geacht mede bij dat andere
      bevoegde gezag te zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.10
  - number: 1.10a
    text: |-
      1 Degene die voornemens is agrarische activiteiten of activiteiten die daarmee verband houden uit te voeren buiten
      een inrichting ten gevolge waarvan lozen kan plaatsvinden, meldt het lozen ten minste vier weken voordat daarmee
      wordt aangevangen aan het bevoegd gezag.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van de activiteiten, bedoeld
      in dat lid. Een melding is niet vereist indien:

      a. eerder een melding overeenkomstig dit artikel is gedaan en door dit veranderen geen afwijking ontstaat van
      de bij die melding verstrekte gegevens en de [artikelen 1.13][ref1] en [1.14][ref2] niet verplichten tot het
      verstrekken van andere gegevens, of

      b. de veranderende activiteiten slechts een wijziging in teelt betreffen en de gegevens omtrent de te telen
      gewassen en de betreffende percelen op grond van [artikel 26 van het Uitvoeringsbesluit Meststoffenwet][ref3] zijn
      gemeld aan Onze Minister van Economische Zaken, Landbouw en Innovatie.

      3 Bij de melding worden de volgende gegevens verstrekt:

      a. de naam en het adres van degene die meldt;

      b. de aard en omvang van de activiteiten die worden verricht;

      c. het tijdstip waarop het lozen zal aanvangen en de duur van het lozen, en

      d. de locatie van de percelen van waaraf het lozen plaatsvindt.

      4 Het bevoegd gezag kan de krachtens [artikel 26 van het Uitvoeringsbesluit Meststoffenwet][ref4] gemelde gegevens
      gebruiken voor zover noodzakelijk voor het toezicht op de naleving van de bij of krachtens dit besluit gestelde
      regels.

      5 Onverminderd het eerste en tweede lid is een melding evenmin vereist voor het lozen als bedoeld in
      [paragraaf 3.1.3][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.13
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel1.14
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel1.10a
