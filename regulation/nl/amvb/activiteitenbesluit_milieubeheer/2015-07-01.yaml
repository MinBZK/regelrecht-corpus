  - number: '3.32'
    text: |-
      Goederen worden in de buitenlucht zodanig op- of overgeslagen dat:

      a. zoveel mogelijk wordt voorkomen dat stofverspreiding optreedt die op een afstand van meer dan 2 meter van de
      bron met het blote oog waarneembaar is;

      b. verontreiniging van de omgeving zoveel mogelijk wordt beperkt;

      c. zoveel mogelijk wordt voorkomen dat goederen in een oppervlaktewaterlichaam geraken;

      d. zoveel mogelijk wordt voorkomen dat goederen in een voorziening voor het beheer van afvalwater geraken.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.32
  - number: '3.33'
    text: |-
      1 Het in een oppervlaktewaterlichaam, op of in de bodem of in een voorziening voor de inzameling en het transport
      van afvalwater, niet zijnde een vuilwaterriool, lozen van afvalwater dat in contact is geweest met inerte goederen,
      is toegestaan indien het gehalte aan onopgeloste stoffen in enig steekmonster niet meer bedraagt dan 300 milligram
      per liter.

      2 Het in een vuilwaterriool lozen van afvalwater dat in contact is geweest met inerte goederen vindt slechts dan
      in een vuilwaterriool plaats indien het lozen, bedoeld in het eerste lid, redelijkerwijs niet mogelijk is en het
      gehalte aan onopgeloste stoffen niet meer bedraagt dan 300 milligram per liter.

      3 Het bevoegd gezag kan in het belang van de bescherming van het milieu met betrekking tot het lozen, bedoeld in
      het eerste lid, bij maatwerkvoorschrift voor onopgeloste stoffen lagere emissiegrenswaarden vaststellen.

      4 Het te lozen afvalwater, bedoeld in het eerste en tweede lid, kan op een doelmatige wijze worden bemonsterd.

      5 Indien de opgeslagen inerte goederen worden bevochtigd, wordt afvalwater dat met opgeslagen goederen in contact
      is geweest, zoveel mogelijk voor dit bevochtigen gebruikt.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.33
  - number: '3.34'
    text: |-
      1 Bij het lozen van afvalwater afkomstig van het op- en overslaan van goederen, niet zijnde inerte goederen, wordt
      ten minste voldaan aan het tweede tot en met negende lid.

      2 Indien opgeslagen goederen als bedoeld in het eerste lid worden bevochtigd, wordt afvalwater dat met die goederen
      in contact is geweest, zoveel mogelijk voor dit bevochtigen gebruikt.

      3 Het in een aangewezen oppervlaktewaterlichaam lozen van afvalwater dat in contact is geweest met goederen als
      bedoeld in het eerste lid waaruit geen vloeibare bodembedreigende stoffen kunnen lekken, is toegestaan indien in
      enig steekmonster de emissiegrenswaarden, vermeld in tabel 3.34, niet worden overschreden.


            Tabel 3.34






                    Parameter


                    Emissiegrenswaarde






                    Chemisch zuurstof verbruik


                    200 milligram per liter




                    Onopgeloste stoffen


                    300 milligram per liter




                    Som zware metalen (som van arseen, chroom, koper, lood, nikkel en zink)


                    1 milligram per liter




                    Minerale olie


                    20 milligram per liter




                    PAK’s


                    50 microgram per liter




                    Extraheerbaar organisch chloor


                    5 microgram per liter




                    Totaal stikstof


                    10 milligram per liter




                    Fosfor


                    2 milligram per liter






      4 Het bevoegd gezag kan met betrekking tot het lozen, bedoeld in het derde lid, bij maatwerkvoorschrift hogere
      emissiegrenswaarden vaststellen, voor zover het belang van de bescherming van het milieu zich daartegen niet
      verzet.

      5 Het bevoegd gezag kan in belang van bescherming van het milieu met betrekking tot het lozen, bedoeld in het derde
      lid, bij maatwerkvoorschrift voor onopgeloste stoffen lagere emissiegrenswaarden vaststellen.

      6 Het lozen van afvalwater, bedoeld in het derde lid, in een vuilwaterriool is toegestaan indien het gehalte aan
      onopgeloste stoffen niet meer bedraagt dan 300 milligram per liter.

      7 Het lozen van afvalwater dat in contact is geweest met goederen als bedoeld in het eerste lid waaruit vloeibare
      bodembedreigende stoffen kunnen lekken in een vuilwaterriool is toegestaan indien enig steekmonster niet meer bevat
      dan:

      a. 20 milligram olie per liter;

      b. 300 milligram onopgeloste stoffen per liter.

      8 In afwijking van het zevende lid mag het gehalte aan olie ten hoogste 200 milligram per liter in enig
      steekmonster bedragen, indien het afvalwater voorafgaand aan vermenging met ander afvalwater wordt geleid door een
      slibvangput en olieafscheider die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.

      9 Het te lozen afvalwater, bedoeld in het derde tot en met achtste lid, kan op een doelmatige wijze worden
      bemonsterd.

      10 Bij ministeriële regeling worden goederen aangewezen die voor de toepassing van deze paragraaf in ieder geval
      worden aangemerkt als goederen waaruit vloeibare bodembedreigende stoffen kunnen lekken.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.34
  - number: '3.35'
    text: |-
      1 Het boven een oppervlaktewaterlichaam opslaan van goederen, niet zijnde inerte goederen, vindt niet plaats,
      tenzij het opslaan benedendeks plaatsvindt op een binnenschip.

      2 Indien goederen, niet zijnde inerte goederen, boven een oppervlaktewaterlichaam aanwezig zijn, wordt ten behoeve
      van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van een
      oppervlaktewaterlichaam voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.35
  - number: '3.36'
    text: |-
      1 Bij het opslaan en overslaan van goederen, niet zijnde inerte goederen, wordt ten behoeve van het realiseren van
      een verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.

      2 Bij het opslaan en overslaan van bederfelijke afvalstoffen wordt ten behoeve van het voorkomen dan wel beperken
      van geurhinder ten minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.36
  - number: '3.37'
    text: |-
      1 Bij de volgende windsnelheden vinden afhankelijk van de stuifgevoeligheid van de goederen, behorend tot de
      stuifklassen volgens bijlage 4.6 van de NeR, geen overslagactiviteiten plaats:

      a. S1 en S2 bij een windsnelheid groter dan 8 meter per seconde;

      b. S3 bij een windsnelheid groter dan 14 meter per seconde.

      2 Indien degene die de inrichting drijft aantoont dat door het treffen van maatregelen verspreiding en morsing van
      losse goederen ten gevolge van de weersomstandigheden wordt voorkomen kan het bevoegd gezag bij maatwerkvoorschrift
      het eerste lid niet van toepassing verklaren en overslagactiviteiten bij grotere windsnelheden dan aangegeven
      in het eerste lid onder voorwaarden toestaan. Deze voorwaarden kunnen betrekking hebben op de toe te passen
      maatregelen om verspreiding of morsing van goederen te voorkomen of op hogere maximale windsnelheden dan genoemd in
      het eerste lid, waarboven overslag niet meer is toegestaan.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.37
  - number: '3.38'
    text: |-
      1 Het opslaan en mengen van goederen behorend tot stuifklassen S1 of S3 van bijlage 4.6 van de NeR vindt plaats in
      gesloten ruimtes.

      2 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het opslaan, overslaan en mengen van stuifgevoelige
      goederen in gesloten ruimtes de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S gelijk is aan of groter is dan
      200 gram per uur; en

      b. 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.

      3 Bij pneumatisch transport van stuifgevoelige goederen behorend tot stuifklasse S1 of S2 van bijlage 4.6 van de
      NeR is de emissie van stofklasse S uit een container, bulktransportwagen of ander transportmiddel niet hoger dan
      10 milligram per normaal kubieke meter.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '3.39'
    text: |-
      Bij het opslaan, overslaan en mengen van stuifgevoelige goederen in gesloten ruimtes worden ten behoeve van het
      voorkomen dan wel beperken van diffuse emissie en om het doelmatig verspreiden van emissies naar de buitenlucht te
      bevorderen ten minste de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.39
  - number: '3.40'
    text: |-
      Bij het voldoen aan [artikel 3.32, onder a en b][ref1], wordt de opslag van asbesthoudende afvalstoffen bij
      een inrichting waar uitvoering wordt gegeven aan [titel 10.4 van de wet][ref2] ten minste overeenkomstig
      [artikel 7 van het Asbestverwijderingsbesluit 2005][ref3] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.32
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0019316#Artikel7
