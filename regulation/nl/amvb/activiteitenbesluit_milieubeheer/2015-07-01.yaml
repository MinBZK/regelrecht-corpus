  - number: '1.17'
    text: |-
      1 Bij een melding als bedoeld in [artikel 1.10][ref1], wordt indien sprake is van een zuiveringtechnisch werk,
      een beschrijving gevoegd hoe invulling wordt gegeven aan het bepaalde bij of krachtens [artikel 3.5b][ref2] en
      [artikel 3.5d][ref3].

      2 Bij een melding als bedoeld in [artikel 1.10][ref4], wordt indien sprake is van een inrichting voor het
      vervaardigen of bewerken van voedingsmiddelen of dranken als bedoeld in [artikel 3.137][ref5], een beschrijving
      gevoegd hoe invulling wordt gegeven aan [artikel 3.140][ref6].

      3 Bij een melding als bedoeld in [artikel 1.10][ref7], wordt indien sprake is van een inrichting voor de verwerking
      van polyesterhars, een beschrijving gevoegd hoe invulling wordt gegeven aan het bepaalde bij of krachtens
      [artikel 4.31c][ref8].

      4 Het bevoegd gezag kan binnen vier weken na ontvangst van de melding, bedoeld in het eerste en tweede lid,
      indien onvoldoende aannemelijk is dat aan [artikel 3.5b][ref9] en [artikel 3.5d][ref10], respectievelijk
      [artikel 3.140][ref11] wordt voldaan, besluiten dat een rapport van een geuronderzoek wordt overgelegd.

      5 Een geuronderzoek als bedoeld in het vierde lid wordt uitgevoerd overeenkomstig NTA 9065: 2012.


