  - number: 4.67a
    text: Deze paragraaf is van toepassing op het thermisch aanbrengen van metaallagen op metalen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.67a
  - number: '4.68'
    text: |-
      1 Onverminderd de [artikelen 2.5 tot en met 2.6][ref1] is bij het thermisch aanbrengen van metaallagen op metalen:

      a. de emissieconcentratie van stofklasse S niet meer dan 5 milligram per normaal kubieke meter, indien de
      massastroom van stofklasse S naar de lucht gelijk is aan of groter is dan 200 gram per uur, en niet meer dan
      50 milligram per normaal kubieke meter indien de massastroom naar de lucht kleiner is dan 200 gram per uur;

      b. de emissieconcentratie van zinkchloride niet meer dan 5,0 milligram per normaal kubieke meter, indien de
      massastroom van zinkchloride naar de lucht groter is dan 10 gram per uur;

      c. de emissieconcentratie van chloorverbindingen, niet zijnde zinkchloride, niet meer dan 30 milligram per normaal
      kubieke meter, indien de massastroom van chloorverbindingen naar de lucht groter is dan 150 gram per uur.

      2 Bij het thermisch aanbrengen van metaallagen op metalen worden ten behoeve van het voorkomen dan wel beperken
      van diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling te
      bepalen maatregelen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.68
