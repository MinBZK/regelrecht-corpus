  - number: 4.74a
    text: Deze paragraaf is van toepassing op mechanische bewerkingen van steen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74a
  - number: 4.74aa
    text: |-
      1 Het is verboden om in de buitenlucht mechanische bewerkingen van steen uit te voeren.

      2 Het eerste lid is niet van toepassing:

      a. indien het vanwege de omvang van het te bewerken object niet mogelijk is om in het inpandige deel van de
      inrichting de mechanische bewerking uit te voeren, of

      b. op het breken van steenachtig materiaal als bedoeld in [paragraaf 4.5a.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74aa
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '4'
        paragraaf: 4.5a.6
        afdeling: 4.5a
  - number: 4.74b
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij mechanische bewerkingen van steen de
      emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter indien de massastroom van stofklasse S gelijk is aan of groter is dan 200
      gram per uur;

      b. 50 milligram per normaal kubieke meter indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.74c
    text: |-
      1 Indien bij de mechanische bewerking van steen water als koel- of smeermiddel wordt toegepast, wordt gebruik
      gemaakt van een gesloten watercircuit, waarbij water wordt gereinigd en hergebruikt voor zover dat redelijkerwijs
      mogelijk is.

      2 Bij het lozen van afvalwater afkomstig van het mechanisch bewerken van steen wordt ten minste voldaan aan het
      derde tot en met het vijfde lid.

      3 Het in een oppervlaktewaterlichaam, op of in de bodem of in een voorziening voor de inzameling en het transport
      van afvalwater, niet zijnde een vuilwaterriool, lozen van afvalwater afkomstig van:

        - het mechanisch bewerken van natuursteen of beton,
        - een luchtreinigingsinstallatie voor het mechanisch bewerken van natuursteen of beton, of
        - het reinigen van apparatuur of werkruimten voor het mechanisch bewerken van natuursteen of beton,

      is toegestaan indien geen flocculanten zijn toegevoegd.

      4 Bij het lozen als bedoeld in het derde lid bedraagt het gehalte aan onopgeloste stoffen niet meer dan 100
      milligram per liter.

      5 Het lozen in een vuilwaterriool van afvalwater afkomstig van:

        - het mechanisch bewerken van steen,
        - een luchtreinigingsinstallatie voor het mechanisch bewerken van steen, of
        - het reinigen van apparatuur of werkruimten voor het mechanisch bewerken van steen,

      vindt slechts plaats indien: het gehalte aan onopgeloste stoffen niet meer bedraagt dan 300 milligram per liter en
      de korreldiameter van onopgeloste stoffen niet meer dan 0,75 millimeter bedragen.

      6 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74c
  - number: 4.74d
    text: |-
      Bij de mechanische verwerking van steen wordt ten behoeve van het voorkomen dan wel beperken van diffuse emissies
      en het doelmatig verspreiden van emissies naar de buitenlucht, voldaan aan de bij ministeriële regeling te stellen
      eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74d
  - number: 4.74da
    text: Deze paragraaf is van toepassing op het aanbrengen van lijmen, harsen of coatings op steen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74da
  - number: 4.74e
    text: |-
      1 Het is verboden in de buitenlucht met behulp van een nevelspuit vluchtige organische stoffen houdende lijmen,
      harsen of coatings aan te brengen op steen.

      2 Het eerste lid is niet van toepassing indien het vanwege de omvang van het te bewerken object niet mogelijk is om
      deze activiteit in het inpandige deel van de inrichting te verrichten.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74e
  - number: 4.74f
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het aanbrengen van lijmen, harsen of coatings op steen
      de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur;

      b. 50 milligram per normaal kubieke meter, indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74f
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.74g
    text: |-
      Bij het aanbrengen van lijmen, harsen of coatings op steen worden ten behoeve van:

      a. het voorkomen dan wel beperken van diffuse emissies;

      b. het voorkomen dan wel beperken van geurhinder;

      c. het realiseren van een verwaarloosbaar bodemrisico;

      de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74g
  - number: 4.74ga
    text: Deze paragraaf is van toepassing op het chemisch behandelen van steen.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74ga
  - number: 4.74h
    text: |-
      Bij het chemisch behandelen van steen worden ten behoeve van het realiseren van een verwaarloosbaar bodemrisico de
      bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74h
  - number: 4.74i
    text: Deze paragraaf is van toepassing op het vervaardigen van betonmortel.
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74i
  - number: 4.74j
    text: |-
      1 Het doseren en mengen van goederen behorende tot stuifklasse S1 voor het vervaardigen van betonmortel, vindt
      plaats in gesloten ruimtes of in een gesloten systeem.

      2 Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het doseren en mengen van goederen, bedoeld in het
      eerste lid, ten behoeve van het vervaardigen van betonmortel de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur, en

      b. 50 milligram per normaal kubieke meter, indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.

      3 Bij het doseren en mengen ten behoeve van het vervaardigen van betonmortel wordt ten behoeve van het voorkomen
      dan wel voor zover dat niet mogelijk is het beperken van diffuse emissies en het doelmatig verspreiden van emissies
      naar de buitenlucht, voldaan aan de bij ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel4.74j
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
