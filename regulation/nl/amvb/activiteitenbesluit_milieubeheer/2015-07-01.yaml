  - number: '3.80'
    text: |-
      1 De teeltvrije zone, bedoeld in [artikel 3.79, tweede lid][ref1], bedraagt bij de teelt van aardappelen, uien,
      bloembollen en bloemknollen in andere gebieden dan de gebieden, genoemd in [bijlage 1][ref2], aardbeien, asperges,
      prei, schorseneren, sla, wortelen, vaste planten, en in neerwaartse richting te bespuiten boomkwekerijgewassen:

      a. ten minste 150 centimeter;

      b. ten minste 100 centimeter, indien gebruik gemaakt wordt van:

      1°. veldspuitapparatuur met luchtondersteuning;

      2°. een overkapte beddenspuit;

      3°. een motorisch aangedreven handgedragen spuit, of

      4°. vanggewas, dat voldoet aan de bij ministeriële regeling gestelde eisen, of

      c. ten minste 50 centimeter, indien gebruik gemaakt wordt van een handmatig aangedreven handgedragen spuit.

      2 De teeltvrije zone bedraagt bij de teelt van bloembollen en bloemknollen in de gebieden, genoemd in
      [bijlage 1][ref3]:

      a. ten minste 150 centimeter, indien gebruik gemaakt wordt van:

      1°. veldspuitapparatuur die is voorzien van driftarme doppen, aangewezen bij ministeriële regeling, of

      2°. veldspuitapparatuur die is voorzien van spuitdoppen, aangewezen bij ministeriële regeling, waarvan de
      onderlinge afstand niet groter is dan 25 centimeter en de apparatuur zodanig is ingesteld dat de spuitdoppen zich
      niet hoger dan 30 cm boven het gewas bevinden, of

      b. ten minste 100 centimeter, indien gebruikt wordt gemaakt van:

      1°. veldspuitapparatuur die is voorzien van driftarme doppen, aangewezen bij ministeriële regeling en de
      bestrijding van Botrytis plaatsvindt op basis van een waarschuwingssysteem van een onafhankelijk deskundige dat
      voldoet aan de bij ministeriële regeling gestelde eisen;

      2°. veldspuitapparatuur met luchtondersteuning;

      3°. veldspuitapparatuur die is voorzien van spuitdoppen, aangewezen bij ministeriële regeling, waarvan de
      onderlinge afstand niet groter is dan 25 centimeter, waarbij gebruik wordt gemaakt van luchtondersteuning en de
      apparatuur zodanig is ingesteld dat de spuitdoppen zich niet hoger dan 30 cm boven het gewas bevinden;

      4°. een overkapte beddenspuit, of

      5°. een handgedragen spuit.

      3 De teeltvrije zone bedraagt bij de teelt van in opwaartse of zijwaartse richting te bespuiten
      boomkwekerijgewassen ten minste 500 centimeter.

      4 De teeltvrije zone bedraagt bij de teelt van appelen, peren en overige pit- en steenvruchten:

      a. ten minste 900 centimeter;

      b. ten minste 450 centimeter, indien gebruik wordt gemaakt van een reflectiescherm, of

      c. ten minste 300 centimeter, indien:

      1°. gebruik wordt gemaakt van een tunnelspuit;

      2°. gebruik wordt gemaakt van een vanggewas, dat voldoet aan de bij ministeriële regeling gestelde eisen;

      3°. sprake is van biologische productiemethode;

      4°. gebruik wordt gemaakt van een dwarsstroomspuit met reflectiescherm en van een emissiescherm, die voldoen aan de
      bij ministeriële regeling gestelde eisen, of

      5°. gebruik wordt gemaakt van een dwarsstroomspuit of axiaalspuit en bij de bespuiting van de buitenste gewasrij
      geen gebruik wordt gemaakt van naar een oppervlaktewaterlichaam gerichte apparatuur en slechts gebruik wordt
      gemaakt van spuitdoppen waarvan door een deskundig, onafhankelijk instituut is vastgesteld dat het gebruik van
      die spuitdoppen bij die wijze van bespuiten resulteert in een driftdepositie in een oppervlaktewaterlichaam in de
      volbladsituatie van ten hoogste 1,5%.

      5 In afwijking van het vierde lid, onderdeel a, bedraagt de teeltvrije zone, aangrenzend aan de kopakker ten
      minste 600 centimeter, indien bij de bespuiting van de buitenste gewasrij geen gebruik wordt gemaakt van naar een
      oppervlaktewaterlichaam gerichte apparatuur.

      6 De teeltvrije zone bedraagt bij de teelt van grasland, graszaad, haver, rogge, spelt, teff, triticale, vlas,
      zomertarwe, wintertarwe, zomergerst en wintergerst ten minste 25 centimeter.

      7 De teeltvrije zone bedraagt bij de teelt van andere gewassen dan de gewassen, genoemd in het eerste tot en met
      zesde lid, ten minste 50 centimeter.


