      1 De etmaalwaarde die het bevoegd gezag vaststelt op grond van [artikel 2.20, eerste lid][ref1], is niet lager dan
      40 dB(A) voor een inrichting:

      a. waarop onmiddellijk voorafgaand aan het tijdstip waarop [artikel 2.20][ref2] van toepassing
      wordt op die inrichting, het [Besluit opslag- en transportbedrijven milieubeheer][ref3],
