  - number: 2.2a
    text: |-
      Indien er sprake is van een zodanige combinatie van meerdere activiteiten, dat een scheiding van het afvalwater,
      afkomstig van die activiteiten, niet doelmatig is, kan het bevoegd gezag, indien het belang van de bescherming
      van het milieu zich daartegen niet verzet, op verzoek van de aanvrager bij maatwerkvoorschrift aan het lozen
      voorwaarden stellen, die afwijken van de voorwaarden die aan het lozen als gevolg van een afzonderlijke activiteit
      bij of krachtens [hoofdstuk 3][ref1] of [4][ref2] zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0022762
        hoofdstuk: '4'
  - number: 2.2b
    text: |-
      1 In afwijking van [artikel 2.2, eerste lid][ref1], is het lozen van spoelwater ten gevolge van het boren ten
      behoeve van een open bodemenergiesysteem op de bodem toegestaan.

      2 In afwijking van [artikel 2.2, eerste lid][ref2], is het lozen van spoelwater ten gevolge van het ontwikkelen
      en het onderhoud van een open bodemenergiesysteem in een voorziening voor de inzameling en het transport van
      afvalwater, niet zijnde een vuilwaterriool, toegestaan.

      3 Het lozen van spoelwater ten gevolge van het ontwikkelen en het onderhoud van een open bodemenergiesysteem vindt
      slechts dan in een vuilwaterriool plaats, indien lozen als bedoeld in het tweede lid, redelijkerwijs niet mogelijk
      is.

      4 In afwijking van [artikel 2, onder b][ref3], is [artikel 2.1][ref4] van toepassing op degene die een inrichting
      type C drijft ten aanzien van het lozen in een voorziening voor de inzameling en het transport van afvalwater op of
      in de bodem ten gevolge van een open bodemenergiesysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel2.2b
