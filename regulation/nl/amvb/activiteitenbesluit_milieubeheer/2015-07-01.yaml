        paragraaf: 3.5.8
        afdeling: '3.5'
  - number: '3.112'
    text: |-
      1 Voor de berekening van de ammoniakemissie van een inrichting wordt het aantal landbouwhuisdieren dat in
      de inrichting aanwezig mag zijn, vermenigvuldigd met de emissiefactoren, genoemd in de regeling op grond van
      [artikel 1 van de Wet ammoniak en veehouderij][ref1].

      2 Voor de toepassing van [artikel 3.114][ref2] geldt voor een diercategorie waarvoor geen maximale emissiewaarde is
      vastgesteld, de emissiefactor behorende bij het betrokken huisvestingssysteem als maximale emissiewaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.114
    url: https://wetten.overheid.nl/BWBR0022762/2015-07-01#Artikel3.112
