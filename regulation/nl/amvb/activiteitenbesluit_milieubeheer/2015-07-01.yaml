  - number: 1.5a
    text: |-
      In afwijking van de [artikelen 1][ref1], [1.9b][ref2], 1.22, [2.1a][ref3], [2.3a][ref4], [2.8a][ref5],
      [2.11a][ref6], [2.14c][ref7], [2.15a][ref8], [2.16b][ref9], [2.22a][ref10], [2.23a][ref11], [2.27a][ref12],
      [3][ref13], [4][ref14] en [5][ref15], voldoet degene die een stookinstallatie binnen de Nederlandse exclusieve
      economische zone in werking heeft, uitsluitend aan de bij of krachtens dit besluit gestelde regels en voorschriften
      in [hoofdstuk 1][ref16], met uitzondering van [artikel 1.4][ref17], en in [paragraaf 3.2.1][ref18], met
      uitzondering van de [artikelen 3.10k][ref19], [3.10n][ref20] en [3.10o][ref21], en [hoofdstuk 6][ref22].


