  - number: '2.7'
    text: |-
      1 Indien de geografische ligging, de plaatselijke milieuomstandigheden of de technische kenmerken van de betrokken
      installatie daartoe aanleiding geven, kan het bevoegd gezag de emissiegrenswaarden voor de stofcategorieën S,
      sO, sA, gA en gO, bedoeld in de [artikelen 2.5][ref1] en [2.6][ref2], met uitzondering van de emissiegrenswaarden
      voor stoffen waarvoor in de [hoofdstukken 3][ref3], [4][ref4] en [5][ref5] eisen aan emissies naar de lucht zijn
      gesteld, bij maatwerkvoorschrift niet van toepassing verklaren en andere emissiegrenswaarden vaststellen, dan wel
      andere eisen stellen om luchtverontreiniging te voorkomen dan wel voor zover dat niet mogelijk is zoveel mogelijk
      te beperken.

      2 Het bevoegd gezag kan bij maatwerkvoorschrift voor de stofcategorieën S, sO, sA, gA en gO, bedoeld in de
      [artikelen 2.5][ref6] en [2.6][ref7], eisen stellen aan emissies van diffuse bronnen.

      3 Bij maatwerkvoorschriften op grond van het eerste en tweede lid worden in de inrichting ten minste de voor de
      inrichting in aanmerking komende beste beschikbare technieken toegepast.

      4 Ten aanzien van de technische kenmerken wordt onder meer rekening gehouden met een afwijkend emissiepatroon,
      kosteneffectiviteit en integrale afweging van de mogelijkheden voor emissiebeperking.

      5 Het bevoegd gezag stelt de kosteneffectiviteit van maatregelen vast volgens de rekenmethode in [bijlage 2][ref8]
      en de waarden, bedoeld in het zesde tot en met achtste lid.

      6 Een maatregel met betrekking tot emissies van stikstofoxiden (NO), zwaveldioxide (SO), vluchtige organische
      stoffen (VOS) of totaal stof is in ieder geval kosteneffectief indien de berekende waarde lager is dan de laagste
      waarde van het afwegingsgebied in tabel 2.7.


            Tabel 2.7







                    Afwegingsgebied (€/kg)






                    NO


                    5 – 20




                    SO


                    5 – 10




                    VOS


                    8 – 15




                    Stof


                    8 – 15






      7 Een maatregel met betrekking tot de emissie van de stoffen, bedoeld in het zesde lid, is niet kosteneffectief
      indien de berekende waarde hoger is dan de hoogste waarde van het afwegingsgebied in tabel 2.7.

      8 Indien de berekende kosteneffectiviteit van een maatregel, met betrekking tot de emissie van de stoffen, bedoeld
      in het zesde lid, binnen het afwegingsgebied van tabel 2.7 ligt, bepaalt het bevoegd gezag bij maatwerkvoorschrift
      of die maatregel in een individueel geval kosteneffectief is.

      9 Indien een maatwerkvoorschrift, als bedoeld in het eerste lid, wordt vastgesteld kan het bevoegd gezag besluiten
      dat door degene die de inrichting drijft een rapport van een onderzoek naar de beschikbaarheid van maatregelen
      wordt overgelegd om te kunnen voldoen aan de [artikelen 2.5][ref9] en [2.6][ref10].

      10 Het bevoegd gezag kan tevens, in het belang van de bescherming van het milieu, maatwerkvoorschriften stellen met
      betrekking tot het controleren van emissies naar de lucht, bedoeld in de artikelen 2.5 en 2.6, en alle activiteiten
      waarvoor bij of krachtens de hoofdstukken 3 en 4 eisen aan emissies naar de lucht zijn gesteld indien:

      a. de inrichting een andere maatregel heeft gekozen dan de maatregel die is erkend op grond van de ministeriële
      regeling, bedoeld in artikel 1.7;

      b. de toegepaste emissiebeperkende techniek in combinatie met de geëmitteerde stoffen leidt tot hoge
      storinggevoeligheid, er veel onderhoud nodig is dan wel er veel fluctuaties zijn in de aard en grootte van de
      emissies;

      c. de grootte en aard van de emissies daartoe aanleiding geven, of

      d. de grootte van de emissies die kunnen optreden bij storing aan de emissiebeperkende techniek, daartoe aanleiding
      geven.

      11 Het bevoegd gezag kan tevens, in het belang van de bescherming van het milieu, maatwerkvoorschriften
      stellen met betrekking tot het onderhoud en de controle van een emissiebeperkende techniek die door degene
      die de inrichting drijft, wordt ingezet om aan de [artikelen 2.5][ref11], [2.6][ref12], [3.26b][ref13],
      [3.38][ref14], [3.141][ref15], [3.143][ref16], [4.21][ref17], [4.23][ref18], [4.27a][ref19], [4.29][ref20],
      [4.31b][ref21],[ 4.33 tot en met 4.35][ref22], [4.40 tot en met 4.42][ref23],[ 4.44 tot en met 4.46][ref24],
      [4.50][ref25],[ 4.54][ref26], [4.54a][ref27], [4.58][ref28], [4.60][ref29], [4.62][ref30], [4.65][ref31],
      [4.68][ref32], [4.74b][ref33], [4.74f][ref34], [4.74j][ref35], [4.74s][ref36], [4.94][ref37], [4.94g][ref38],
      [4.103aa][ref39], [4.103d][ref40], [4.119][ref41] en [4.125][ref42] te voldoen indien geen of naar de mening van
      het bevoegd gezag onvoldoende onderhoud is verricht aan de emissiebeperkende techniek.


