  - number: 4.61a
    text: Deze paragraaf is van toepassing op het elektrolytisch of stroomloos aanbrengen van metaallagen op metalen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.61a
  - number: '4.62'
    text: |-
      1 Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het elektrolytisch
      of stroomloos aanbrengen van chroom en cadmiumlagen de emissieconcentratie van:

      a. chroom VI-verbindingen, berekend als chroom, niet meer dan 0,1 milligram per normaal kubieke meter indien de
      massastroom van chroom VI-verbindingen naar de lucht, berekend als chroom, groter is dan 0,5 gram per uur;

      b. cadmium en cadmiumverbindingen niet meer dan 0,05 milligram per normaal kubieke meter indien de massastroom van
      cadmium en cadmiumverbindingen groter is dan 0,25 gram per uur.

      2 Bij het elektrolytisch of stroomloos aanbrengen van metaallagen op metalen worden ten behoeve van het voorkomen
      dan wel beperken van diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht de bij
      ministeriële regeling te bepalen maatregelen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.62
