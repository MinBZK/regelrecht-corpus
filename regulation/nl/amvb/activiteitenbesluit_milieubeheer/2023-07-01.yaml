      - id: ref1
        bwb_id: BWBR0022762
        artikel: 3.26m
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
  - number: '3.27'
    text: >-
      Deze paragraaf is van toepassing op inrichtingen waarbij sprake is van het opslaan van propaan indien:


      a. het opslaan van propaan geschiedt in opslagtanks elk met een inhoud van maximaal 13 kubieke meter;


      b. niet meer dan twee opslagtanks binnen de inrichting aanwezig zijn; en


      c. propaan uitsluitend in de gasfase aan een opslagtank wordt onttrokken behoudens het leegmaken van een opslagtank
      voor verplaatsing.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.27
  - number: '3.28'
    text: |-
      1 Met betrekking tot de opstelplaats van een opslagtank met propaan, het vulpunt van een opslagtank met propaan
      en de opstelplaats van de tankwagen worden ten opzichte van buiten de inrichting gelegen kwetsbare en beperkt
      kwetsbare objecten, de in tabel 3.28 opgenomen afstanden in acht genomen, waarbij de afstanden gelden van het
      vulpunt en de opslagtank, gerekend vanaf de aansluitpunten van de leidingen alsmede het bovengrondse deel van de
      leidingen en de pomp bij de opslagtank:


            Tabel 3.28 veiligheidsafstanden








                    Bevoorrading tot en met 5 keer per jaar


                    Bevoorrading meer dan 5 keer per jaar






                    Opslagtank met propaan tot en met 5 kubieke meter


                    10 meter


                    20 meter




                    Opslagtank met propaan groter dan 5 kubieke meter tot en met 13 kubieke meter


                    15 meter


                    25 meter






      2 Een opslagtank met propaan, het vulpunt van een opslagtank met propaan en de opstelplaats van de tankwagen is
      gelegen op ten minste de helft van de afstanden, genoemd in tabel 3.28, indien het objecten betreft waar ook een
      opslagtank met propaan of propeen aanwezig is.

      3 In afwijking van het eerste lid worden met betrekking tot de opstelplaats van een opslagtank met propaan, het
      vulpunt van een opslagtank met propaan en de opstelplaats van de tankwagen ten opzichte van gebouwen bestemd voor
      het verblijf, al dan niet gedurende een gedeelte van de dag, van minderjarigen, ouderen, zieken of gehandicapten,
      dan wel gebouwen waarin doorgaans grote aantallen personen gedurende een groot gedeelte van de dag aanwezig zijn,
      de volgende afstanden in acht genomen:

      a. bij een opslagtank met propaan tot en met 5 kubieke meter: 25 meter;

      b. bij een opslagtank met propaan van meer dan 5 kubieke meter tot en met 13 kubieke meter: 50 meter.

      4 Onverminderd het eerste tot en met derde lid, voldoet een opslagtank met propaan alsmede de bijbehorende
      leidingen en appendages ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat
      ongewone voorvallen zich voordoen en de gevolgen hiervan, aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.28
  - number: '3.29'
    text: >-
      1 Deze paragraaf is van toepassing op het opslaan in een ondergrondse opslagtank van metaal of kunststof van
      maximaal 150 kubieke meter van:


      a. vloeibare brandstof;


      b. afgewerkte olie;


      c. butanon;


      d. ethanol;


      e. ethylethanoaat;


      f. 4-methyl-2-pentanon;


      g. 1-propanol;


      h. 2-propanol, of


      i. propanon.


      2 Deze paragraaf is ook van toepassing op het opslaan van een vloeibare bodembedreigende stof, die geen gevaarlijke
      stof of CMR-stof is, in een ondergrondse opslagtank van metaal of kunststof of in een betonnen constructie die
      geheel of gedeeltelijk ondergronds ligt.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.29
  - number: '3.30'
    text: |-
      Bij het in gebruik hebben en bij het beëindigen van het gebruik van een ondergrondse opslagtank of een betonnen
      constructie als bedoeld in [artikel 3.29][ref1] die wordt of werd gebruikt voor de opslag van de stoffen, genoemd
      in dat artikel, wordt ten behoeve van:

      a. het realiseren van een verwaarloosbaar bodemrisico;

      b. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan;

      c. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van het
      grondwater, of

      d. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van luchtverontreiniging,

      voldaan aan de bij ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.29
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.30
