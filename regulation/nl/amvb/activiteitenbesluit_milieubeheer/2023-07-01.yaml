        afdeling: 4.7a
  - number: '4.102'
    text: >-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het reinigen of wassen van textiel wordt ten
      minste voldaan aan het tweede en derde lid.


      2 Afvalwater afkomstig van het wasproces bevat in enig steekmonster niet meer dan 0,1 milligram PER per liter.


      3 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.102
  - number: '4.103'
    text: >-
      Bij het reinigen of wassen van textiel wordt ten behoeve van het realiseren van een verwaarloosbaar bodemrisico,
      voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103
  - number: 4.103a
    text: Deze paragraaf is van toepassing op de mechanische bewerking of verwerking van textiel.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103a
  - number: 4.103aa
    text: |-
      Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het geautomatiseerd
      weven, spinnen en breien en het verkleinen van textiel en producten van textiel, de emissieconcentratie van
      stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter indien de massastroom van stofklasse S gelijk is aan of groter is dan 200
      gram per uur;

      b. 50 milligram per normaal kubieke meter indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103aa
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.103b
    text: >-
      Bij het geautomatiseerd weven, spinnen en breien en verkleinen van textiel en producten van textiel, worden ten
      behoeve van het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van emissies naar de
      buitenlucht, de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103b
  - number: 4.103ba
    text: >-
      Bij het verkleinen van textiel en producten van textiel wordt ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103ba
  - number: 4.103bb
    text: Deze paragraaf is van toepassing op het lassen van textiel.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103bb
  - number: 4.103c
    text: >-
      Bij het lassen van textiel wordt ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht ten
      minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103c
  - number: 4.103ca
    text: Deze paragraaf is van toepassing op het lijmen of coaten of veredelen van textiel, leer of bont.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103ca
  - number: 4.103d
    text: |-
      Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het aanbrengen van
      coating of lijmlagen en het veredelen de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur; en

      b. 50 milligram per normaal kubieke meter indien de massastroom van stofklasse S naar de lucht kleiner is dan 200
      gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.103da
    text: |-
      1 Bij het in een vuilwaterriool lozen van afvalwater afkomstig van het veredelen van textiel wordt ten minste
      voldaan aan het tweede en derde lid.

      2 Het te lozen afvalwater bevat geen stoffen die op grond van het BBT-informatiedocument Algemene
      BeoordelingsMethodiek 2016, aangewezen krachtens [artikel 5.4, eerste lid, van het Besluit omgevingsrecht][ref1],
      worden aangemerkt als stoffen waarvoor een saneringsinspanning Z of A geldt.

      3 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103da
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5.4'
  - number: 4.103e
    text: |-
      1 Degene die de inrichting drijft, neemt bij het lijmen of coaten of veredelen van textiel, leer of bont de bij
      ministeriële regeling voorgeschreven emissiereducerende maatregelen met betrekking tot vluchtige organische stoffen
      tenzij deze niet kosteneffectief of technisch uitvoerbaar zijn.

      2 Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de in het
      eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar.

      5 Indien de drempelwaarden, genoemd in tabel 2.28a worden overschreden, zijn het eerste en tweede lid niet van
      toepassing en is [afdeling 2.11][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103e
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '2'
        afdeling: '2.11'
  - number: 4.103f
    text: >-
      Bij het reinigen, lijmen of coaten of veredelen van textiel, leer of bont worden ten behoeve van:


      a. het voorkomen dan wel beperken van diffuse emissies;


      b. het voorkomen dan wel beperken van geurhinder;


      c. het realiseren van een verwaarloosbaar bodemrisico, of


      d. het beperken van het lozen van hulpstoffen,


      de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103f
  - number: 4.103g
    text: >-
      Deze paragraaf is van toepassing op het inwendig reinigen of ontsmetten van:


      a. tanks,


      b. tankwagens,


      c. vrachtwagens,


      d. andere transportmiddelen, of


      e. werktuigen, waarmee gewasbeschermingsmiddelen of meststoffen zijn toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103g
  - number: 4.103h
    text: >-
      Bij het in een inrichting inwendig reinigen of ontsmetten van vrachtwagens of andere transportmiddelen wordt, ten
      behoeve van het realiseren van een verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling gestelde
      eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.103h
  - number: '4.104'
    text: >-
      1 Bij het inwendig reinigen of ontsmetten van tanks of tankwagens wordt het in het afvalwater geraken van het
      daarin vervoerde product zo veel mogelijk voorkomen.


      2 Indien in de inrichting afvalwater ontstaat met een soortgelijke samenstelling, afkomstig van een andere
      activiteit, als het afvalwater dat ontstaat bij het inwendig reinigen of ontsmetten van tanks of tankwagens,
      is het toegestaan laatstgenoemd afvalwater te lozen op dezelfde wijze als het afvalwater van soortgelijke
      samenstelling mits het afvalwater van soortgelijke samenstelling door een zuiveringsvoorziening wordt geleid, die
      is gedimensioneerd op de totale afvalwaterstroom.


      3 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.104
  - number: 4.104a
    text: |-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het inwendig reinigen of ontsmetten van
      vrachtwagens of andere transportmiddelen waarin vlees onverpakt is vervoerd, wordt ten minste voldaan aan het
      tweede en derde lid.

      2 Het afvalwater afkomstig van het inwendig reinigen of ontsmetten van vrachtwagens of andere transportmiddelen
      waarin vlees onverpakt is vervoerd, wordt voor vermenging met ander niet vethoudend afvalwater, geleid door een
      vetafscheider en slibvangput die voldoen aan en worden gebruikt conform NEN-EN 1825-1 en 2. In afwijking van NEN-EN
      1825-1 en 2 kan met een lagere frequentie van het legen en reinigen dan daarin vermeld worden volstaan, indien een
      lagere frequentie geen nadelige gevolgen heeft voor het doelmatig functioneren van de afscheider.

      3 Het bevoegd gezag kan bij maatwerkvoorschrift het tweede lid niet van toepassing verklaren en het lozen zonder
      een vetafscheider en slibvangput toestaan indien, gelet op het gehalte aan vet en onopgeloste stoffen in het te
      lozen afvalwater in combinatie met de hoeveelheid te lozen afvalwater, het lozen geen nadelige gevolgen heeft voor
      de doelmatige werking van de voorzieningen voor het beheer van afvalwater. [Artikel 2.2, vierde lid][ref1], is van
      overeenkomstige toepassing.

      4 Het tweede lid is niet van toepassing op een slibvangput en een vetafscheider die zijn geplaatst binnen een
      inrichting voorafgaand aan het tijdstip waarop die leden op die inrichting van toepassing werden.

      5 Het tweede lid is eveneens niet van toepassing op een flocculatieafscheider die binnen een inrichting is
      geplaatst voorafgaand aan het tijdstip waarop dat artikel op de inrichting van toepassing werd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.104a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.2'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: 4.104b
    text: >-
      1 Bij het lozen van afvalwater, afkomstig van het inwendig reinigen of ontsmetten van vrachtwagens of andere
      transportmiddelen waarin dieren zijn vervoerd, wordt ten minste voldaan aan het tweede en derde lid.


      2 Het lozen, bedoeld in het eerste lid, in een vuilwateriool bevat in enig steekmonster ten hoogste 300 milligram
      onopgeloste stoffen per liter.


      3 Het lozen, bedoeld in het eerste lid, op of in de bodem is toegestaan indien het afvalwater gelijkmatig wordt
      verspreid over de onverharde bodem.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.104b
  - number: 4.104c
    text: >-
      1 Bij het lozen van afvalwater afkomstig van het inwendig reinigen van werktuigen, waarmee
      gewasbeschermingsmiddelen of meststoffen zijn toegepast, wordt ten minste voldaan aan het tweede en derde lid.


      2 Bij het lozen in een vuilwaterriool wordt het afvalwater afkomstig van het inwendig reinigen van werktuigen
      waarin gewasbeschermingsmiddelen zijn toegepast geleid door een zuiveringsvoorziening waarmee ten minste 95% van de
      gewasbeschermingsmiddelen wordt verwijderd.


      3 Het lozen op of in de bodem is toegestaan, indien:


      a. het afvalwater gelijkmatig wordt verspreid over de onverharde bodem waarop de gewasbeschermingsmiddelen of
      meststoffen zijn toegepast, of


      b. het afvalwater wordt geleid door een zuiveringsvoorziening waarmee ten minste 95% van de
      gewasbeschermingsmiddelen wordt verwijderd en wordt verspreid over een onverharde bodem.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.104c
  - number: 4.104d
    text: >-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het inwendig reinigen of ontsmetten van veegwagens
      of vuilniswagens, geldt ten minste dat het afvalwater in enig steekmonster niet meer dan 300 milligram onopgeloste
      stoffen per liter bevat.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.104d
  - number: 4.104e
    text: >-
      1 Het lozen van afvalwater afkomstig van het inwendig reinigen van een transportmiddel waarin betonmortel is
      vervoerd is uitsluitend toegestaan indien daarbij ten minste wordt voldaan aan de eisen, gesteld bij en krachtens
      het tweede tot en met vijfde lid.


      2 Bij het lozen in een aangewezen oppervlaktewaterlichaam of in een voorziening voor de inzameling en het transport
      van afvalwater, niet zijnde een vuilwaterriool, bedraagt:


      a. het gehalte aan onopgeloste stoffen in enig steekmonster niet meer dan 100 milligram per liter, en


      b. het gehalte aan chemisch zuurstofverbruik in enig steekmonster niet meer dan 200 milligram per liter.


      3 Bij het lozen in een vuilwaterriool bedraagt het gehalte aan onopgeloste stoffen niet meer dan 300 milligram
      per liter.


      4 In afwijking van het tweede lid kan het bevoegd gezag in het belang van de bescherming van het milieu bij
      maatwerkvoorschrift voor onopgeloste stoffen lagere gehaltes vaststellen.


      5 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.104e
  - number: 4.113c
    text: Deze paragraaf is van toepassing op het in werking hebben van een acculader.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.113c
  - number: '4.114'
    text: >-
      Bij het opladen van accu’s die vloeibare bodembedreigende stoffen bevatten wordt ten behoeve van het realiseren van
      een verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.114
  - number: '4.116'
    text: >-
      Deze paragraaf is van toepassing op het in werking hebben van een crematorium of het in gebruik hebben van een
      strooiveld.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.116
  - number: '4.117'
    text: >-
      Het is verboden in een crematieoven kisten te verbranden die met lood of zink bekleed zijn. Metalen en kunststof
      handvatten en andere versierselen van kunststof of metaal worden voor invoer van de kist verwijderd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.117
  - number: '4.118'
    text: >-
      Bij het in werking hebben van een crematieoven worden ten behoeve van:


      a. het zo volledig mogelijk verbranden van rookgassen, en


      b. het zo veel mogelijk beperken van het ontstaan van stikstofoxiden,


      de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.118
  - number: 4.118a
    text: |-
      Onverminderd de [artikel 2.5, eerste, vierde en zesde lid][ref1], en [2.6][ref2] is bij het in werking hebben van
      een crematieoven voor dieren de emissieconcentratie van stofklasse S ten hoogste:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S gelijk is aan of groter is dan 200
      gram per uur, en

      b. 50 milligram per normaal kubieke meter indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.118a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '4.119'
    text: |-
      Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het in werking hebben
      van een crematieoven niet zijnde een crematieoven voor dieren de emissieconcentratie van kwik en kwikverbindingen
      niet meer dan 0,05 milligram per normaal kubieke meter, indien de massastroom van kwik naar de lucht gelijk is aan
      of groter is dan 0,25 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.119
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '4.120'
    text: |-
      In afwijking van [artikel 2.9, eerste lid][ref1], worden bij het verstrooien van crematie-as op een strooiveld ten
      behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, zoveel mogelijk beperken van de belasting van
      de bodem de bij ministeriële regeling voorgeschreven maatregelen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.120
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.9'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: '4.122'
    text: >-
      Deze paragraaf is van toepassing op inrichtingen waarbij sprake is van een laboratorium of een praktijkruimte,
      met uitzondering van praktijkruimten voor het middelbaar onderwijs en laboratoria ten behoeve van huisartsen,
      dierenartsen, apothekers, tandartsen of tandtechnici.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.122
  - number: '4.123'
    text: >-
      Bij het lozen van afvalwater afkomstig van een laboratorium of een praktijkruimte op het vuilwaterriool wordt ten
      behoeve van de bescherming van het milieu ten minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.123
  - number: '4.124'
    text: |-
      1 Bij het lozen van afvalwater afkomstig van een laboratorium of een praktijkruimte in een vuilwaterriool worden de
      emissiegrenswaarden, vermeld in tabel 4.124, niet overschreden.


            Tabel 4.124






                    Stof


                    Emissiegrenswaarde in milligram per liter






                    Kwik


                    0,01




                    Cadmium


                    0,02




                    Overige metalen, som van 5 metalen1)


                    2




                    Chloorkoolwaterstoffen CKW2)


                    0,1




                    BTEX


                    0,1






      1) Als som van 5 willekeurige metalen uit de volgende reeks: Ni, Cr, Pb, Se, As, Mo, Ti, Sn, Ba, Be, B, U, V, Co,
      Ag.

      2) De 11 CKW die standaard bepaald worden in afvalwater betreffen: Dichloormethaan, Trichloormethaan,
      Tetrachloormethaan, Trichlooretheen, Tetrachlooretheen, 1,1-dichloorethaan, 1,2-dichloorethaan, 1,1,1-
      trichloorethaan, 1,1,2-trichloorethaan, cis-1,2-dichlooretheen, trans-1,2-dichlooretheen. De chloorkoolwaterstoffen
      worden als som bepaald.

      De in tabel 4.124 genoemde emissiewaarden gelden voor steekmonsters. Indien sprake is van representatieve
      etmaalbemonstering geldt voor de «overige metalen, som van 5 metalen» een factor 2 lagere waarde (1 mg/l).

      2 Het bevoegd gezag kan bij maatwerkvoorschrift:

      a. de emissiegrenswaarden, bedoeld in het eerste lid, niet van toepassing verklaren en lagere emissiegrenswaarden
      vaststellen dan de emissiegrenswaarden, bedoeld in dat lid, indien het te lozen afvalwater meer dan 10.000 kubieke
      meter per jaar bedraagt en met toepassing van de beste beschikbare technieken aan deze lagere emissiegrenswaarden
      kan worden voldaan;

      b. de emissiegrenswaarden, bedoeld in het eerste lid, niet van toepassing verklaren en hogere emissiegrenswaarden
      bepalen dan de emissiegrenswaarden, bedoeld in dat lid, indien aan de emissiegrenswaarden, bedoeld in het eerste
      lid met toepassing van de beste beschikbare technieken niet kan worden voldaan en het belang van de bescherming van
      het milieu zich niet tegen het lozen met hogere emissiegrenswaarden verzet.

      3 Het te lozen afvalwater, bedoeld in het eerste lid, kan op een doelmatige wijze worden bemonsterd.

      4 Het derde lid is niet van toepassing op inrichtingen waarbinnen, in overeenstemming met de
      vergunningvoorschriften zoals die luidden tot 1 januari 2010, geen voorzieningen zijn geplaatst voor het
      afzonderlijk bemonsteren van het te lozen afvalwater als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.124
  - number: '4.125'
    text: |-
      1 Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij activiteiten
      die leiden tot stofvormige emissies afkomstig van een laboratorium of een praktijkruimte naar de lucht, de
      emissieconcentratie van de stoffen behorend tot de stofklassen S, sO, sA1, sA2 en sA3 naar de lucht niet meer dan
      de voor die betreffende stofklasse genoemde emissieconcentratie-eis in artikel 2.5 indien de massastroom gelijk is
      aan of groter is dan de in artikel 2.5 voor de betreffende stofklasse genoemde grensmassastroom.

      2 Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref3], en [artikel 2.6][ref4] is bij activiteiten
      die leiden tot gasvormige emissies afkomstig van een laboratorium of praktijkruimte naar de lucht, de
      emissieconcentratie van de stoffen behorend tot de stofklassen gA.1, gA.2, gA.3, gO.1, gO.2 en gO.3, naar
      de lucht niet meer dan de voor die betreffende stofklasse genoemde emissieconcentratie-eis in artikel 2.5
      indien de massastroom gelijk is aan of groter is dan de in artikel 2.5 voor de betreffende stofklasse genoemde
      grensmassastroom.

      3 Indien bij activiteiten emissies van Extreem risicovolle stoffen of MVP, afkomstig van een laboratorium of
      praktijkruimte, kunnen vrijkomen, kan het bevoegd gezag in het belang van de luchtkwaliteit maatwerkvoorschriften
      stellen aan de minimalisatie van die emissies. [Artikel 2.4][ref5] is van overeenkomstige toepassing.


