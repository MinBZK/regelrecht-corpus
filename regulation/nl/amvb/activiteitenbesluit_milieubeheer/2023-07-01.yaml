  - number: 3.64a
    text: >-
      1 Drainwater, drainagewater of het spoelwater van filters van een waterdoseringsinstallatie, dat
      gewasbeschermingsmiddelen bevat, wordt voorafgaand aan het lozen door een zuiveringsvoorziening geleid die ten
      minste 95% van de werkzame stoffen die bestaan uit organische verbindingen, uit het water verwijdert.


      2 Het eerste lid is niet van toepassing indien het water na de lozing wordt geleid door een zuiveringsvoorziening
      die, of een zuiveringtechnisch werk dat, ten minste 95% van de werkzame stoffen die bestaan uit organische
      verbindingen, uit het water verwijdert.


      3 De werking van de zuiveringsvoorziening of het zuiveringtechnisch werk wordt aangetoond volgens een bij
      ministeriële regeling aangewezen testmethode.


      4 De hoeveelheid van het, in het eerste lid bedoelde, water dat wordt geloosd, wordt gemeten en geregistreerd.


      5 De resultaten van de metingen en registraties worden gedurende vijf jaren bewaard.


      6 Bij ministeriële regeling kunnen nadere regels worden gesteld over het meten en registreren, bedoeld in het
      vierde lid.


      7 Het bevoegd gezag kan bij maatwerkvoorschrift afwijken van het eerste lid voor lozingen van drainagewater,
      afkomstig van de teelt waarbij gewassen op materiaal groeien dat in verbinding staat met de ondergrond, indien door
      kwel of inzijgend water het ondoelmatig is om ten minste 95% van de werkzame stoffen, die bestaan uit organische
      verbindingen, uit het afvalwater te verwijderen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.64a
  - number: 3.64b
    text: |-
      1 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat artikel 3.64a, eerste lid, niet van toepassing
      is indien naar zijn oordeel aannemelijk is dat uiterlijk op 1 januari 2021 het water, bedoeld in
      [artikel 3.64a, eerste lid][ref1], wordt geleid door een collectieve zuiveringsvoorziening die of een collectief
      zuiveringtechnisch werk dat ten minste 95% van de werkzame stoffen die bestaan uit organische verbindingen, uit het
      water verwijdert.

      2 Het maatwerkvoorschrift wordt verleend tot de collectieve zuiveringsvoorziening, bedoeld in het eerste lid, is
      gerealiseerd of tot uiterlijk 1 januari 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.64a
