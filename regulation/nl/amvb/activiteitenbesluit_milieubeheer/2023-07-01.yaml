  - number: '5.46'
    text: |-
      1 Bij de productie van asfalt is de emissiegrenswaarde van:

      a. polycyclische aromatische koolwaterstoffen ten hoogste 0,05 mg/Nm3 indien de massastroom van polycyclische
      aromatische koolwaterstoffen naar de lucht groter is dan 0,15 gram per uur;

      b. totaal stof ten hoogste 5 mg/Nm3, indien de massastroom van een stof of de som van de onder normale
      procesomstandigheden gedurende één uur optredende massastromen van stoffen binnen deze stofklasse vanuit al die
      bronnen, groter of gelijk is aan 200 gram per uur en ten hoogste 20 mg/Nm3 indien de massastroom van een stof of
      de som van de onder normale procesomstandigheden gedurende één uur optredende massastromen van stoffen binnen deze
      stofklasse vanuit al die bronnen, kleiner is dan 200 gram per uur;

      c. stikstofoxiden ten hoogste 50 mg/Nm3 indien de massastroom van stikstofoxiden naar de lucht groter is dan 2.000
      gram per uur;

      d. zwaveloxiden ten hoogste 50 mg/Nm3 indien de massastroom van zwaveloxiden naar de lucht groter is dan 2.000 gram
      per uur;

      e. vluchtige organische stoffen ten hoogste 200 mg/Nm3 indien de massastroom van vluchtige organische stoffen naar
      de lucht groter is dan 500 gram per uur.

      2 Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken
      van geurhinder bij geurgevoelige objecten, wordt bij de productie van asfalt voldaan aan [artikel 2.7a][ref1].

      3 In afwijking van [artikel 2.8, zevende lid, onder d][ref2], worden emissies van een installatie voor de productie
      van asfalt herleid op afgas met een volumegehalte aan zuurstof van 17%.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.8
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.46
