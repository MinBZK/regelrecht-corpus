  - number: 2.7a
    text: >-
      1 Indien bij een activiteit emissies naar de lucht plaatsvinden, wordt daarbij geurhinder bij geurgevoelige
      objecten voorkomen, dan wel voor zover dat niet mogelijk is wordt de geurhinder tot een aanvaardbaar niveau
      beperkt.


      2 Het bevoegd gezag kan, indien het redelijk vermoeden bestaat dat niet aan het eerste lid wordt voldaan, besluiten
      dat een rapport van een geuronderzoek wordt overgelegd. Een geuronderzoek wordt uitgevoerd overeenkomstig de NTA
      9065.


      3 Bij het bepalen van een aanvaardbaar niveau van geurhinder wordt ten minste rekening gehouden met de volgende
      aspecten:


      a. de bestaande toetsingskaders, waaronder lokaal geurbeleid;


      b. de geurbelasting ter plaatse van geurgevoelige objecten;


      c. de aard, omvang en waardering van de geur die vrijkomt bij de betreffende inrichting;


      d. de historie van de betreffende inrichting en het klachtenpatroon met betrekking geurhinder;


      e. de bestaande en verwachte geurhinder van de betreffende inrichting, en


      f. de kosten en baten van technische voorzieningen en gedragsregels in de inrichting.


      4 Het bevoegd gezag kan, indien blijkt dat de geurhinder ter plaatse van een of meer geurgevoelige objecten een
      aanvaardbaar hinderniveau kan overschrijden, bij maatwerkvoorschrift:


      a. geuremissiewaarden vaststellen;


      b. bepalen dat bepaalde geurbelastingen ter plaatse van die objecten niet worden overschreden, of


      c. bepalen dat technische voorzieningen in de inrichting worden aangebracht of gedragsregels in de inrichting in
      acht worden genomen om de geurhinder tot een aanvaardbaar niveau te beperken.


      5 Indien een maatwerkvoorschrift als bedoeld in het vierde lid wordt vastgesteld, kan het bevoegd gezag besluiten
      dat door degene die de inrichting drijft een rapport van een onderzoek naar de beschikbaarheid van technische
      voorzieningen en gedragsregels wordt overgelegd waaruit blijkt dat aan het eerste lid wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.7a
  - number: '2.8'
    text: |-
      1 Indien bij ministeriële regeling op grond van [artikel 1.7][ref1] is bepaald dat daarbij aangegeven
      maatregelen ter bescherming van het milieu kunnen worden toegepast maar degene die de inrichting drijft op een
      andere wijze voldoet aan de eisen ten aanzien van emissies naar de lucht van stoffen die bij of krachtens de
      [hoofdstukken 3][ref2], [4][ref3] of [5][ref4] zijn gesteld:

      a. wordt op verzoek van het bevoegd gezag eenmalig aangetoond dat de grensmassastromen zoals bedoeld in
      [artikel 2.5][ref5] en in de [hoofdstukken 3][ref6], [4][ref7] of [5][ref8] vanwege het in werking zijn van de
      inrichting, niet overschreden worden, of

      b. wordt op verzoek van het bevoegd gezag, indien één of meer grensmassastromen als bedoeld in de
      [hoofdstukken 3][ref9], [4][ref10], en [5][ref11] worden overschreden, eenmalig aangetoond of wordt voldaan
      aan de emissie-eisen dan wel een op grond van [artikel 2.7, eerste lid][ref12], gestelde eis ten aanzien van
      stoffen waarvoor in de [artikelen 3.38][ref13], [3.43][ref14], [4.21][ref15], [4.23][ref16], [4.27][ref17],
      [4.29][ref18], [4.33 tot en met 4.35][ref19], [4.40 tot en met 4.42][ref20], [4.44 tot en met 4.46][ref21],
      [4.50][ref22], [4.54][ref23], [4.54a][ref24], [4.58][ref25], [4.60][ref26], [4.62][ref27], [4.65][ref28],
      [4.68][ref29], [4.74b][ref30], [4.74f][ref31], [4.94][ref32], [4.94g][ref33], [4.103a][ref34], [4.103d][ref35],
      [4.119][ref36] en [4.125][ref37], eisen ten aanzien van emissies naar de lucht zijn gesteld door middel van een
      emissiemeting, dan wel door middel van een emissieberekening mits dit is goedgekeurd door het bevoegd gezag, met
      uitzondering van bronnen waarvan is aangetoond dat de massastroom lager is dan de vrijstellingsgrens, bedoeld in
      [artikel 2.6][ref38].

      2 Het eerste lid, onderdelen a en b, is van overeenkomstige toepassing op een verandering van de inrichting indien
      de verandering naar verwachting zal leiden tot een significante toename van de emissie.

      3 Indien op grond van [artikel 2.5][ref39] en [artikel 2.6][ref40] emissiegrenswaarden gelden dan worden de
      emissies gecontroleerd op basis van een controleregime als bedoeld in tabel 2.8.


            Tabel 2.8







                    storingsfactor F


                    Controleregime


                    Mogelijke controlevormen






                    F < 3


                    0


                    ERP’s cat. B




                    3 < F < 30


                    1


                    Meting eenmalig + ERP’s cat. B




                    30 < F < 300


                    2


                    Meting 1 x per 3 jaar + ERP’s cat. B




                    300 < F < 3.000


                    3


                    Meting 1 x per jaar + ERP’s cat. B
                    Bij sterke fluctuaties: controleregime 4




                    F > 3.000


                    4


                    Continue meting of
                    ERP’s cat. A of
                    Meting 2 x per jaar + ERP’s cat. B






      4 De controle van emissies wordt gebaseerd op de grootte van de storingsfactor, bedoeld in tabel 2.8. Het bevoegd
      gezag kan, indien het belang van de bescherming van het milieu zich daartegen niet verzet, bij maatwerkvoorschrift
      van de in tabel 2.8 opgenomen controlevormen afwijken.

      5 Voor zover de controlevorm een ERP voorschrijft, toont de drijver van de inrichting aan:

      a. welke ERP’s dienen om de emissies van een specifieke component te controleren;

      b. binnen welke grenzen van de waarden van de ERP’s wordt voldaan aan de emissie-eisen.

      6 De metingen van emissies waarvoor grenswaarden gelden als bedoeld in [artikel 2.5][ref41] en in de
      [hoofdstukken 3][ref42] en [4][ref43] worden uitgevoerd door een daartoe geaccrediteerde meetinstantie. Het bevoegd
      gezag kan, indien het belang van de bescherming van het milieu zich daartegen niet verzet, bij maatwerkvoorschrift
      hiervan afwijken.

      7 Voor de resultaten van emissiemetingen of controle van ERP’s geldt dat:

      a. deze worden vastgelegd in een rapport;

      b. de resultaten van emissiemetingen worden gerapporteerd bij standaard luchtcondities voor temperatuur en druk, en
      bij droog afgas;

      c. de resultaten van emissiemetingen worden gecorrigeerd voor de meetonzekerheid;

      d. emissies van verbrandingsprocessen worden herleid op afgas met een volumegehalte aan zuurstof van:

      1°. 6 procent, indien het een stookinstallatie met vaste brandstof betreft;

      2°. 3 procent, indien het een stookinstallatie met een gasvormige of vloeibare brandstof betreft, of

      3°. het gehalte dat het bevoegd gezag bij maatwerkvoorschrift heeft vastgelegd.

      e. het resultaat van afzonderlijke emissiemetingen de emissiegrenswaarde niet mag overschrijden;

      f. de daggemiddelde waarde van de emissieconcentratie, bepaald op basis van het resultaat van continu metingen,
      niet hoger mag zijn dan de emissiegrenswaarde, en

      g. geen van de halfuurgemiddelde waarden, als resultaat van continu metingen, hoger mag zijn dan het dubbele van
      de emissiegrenswaarde.

      8 De metingen, bedoeld in het eerste lid, onder b, en in het vierde lid, met inbegrip van berekeningen en
      bepalingen van ERP’s, de registratie en rapportage van de meting, voldoen, ten behoeve van de bescherming van het
      milieu, aan de bij ministeriële regeling gestelde eisen.


