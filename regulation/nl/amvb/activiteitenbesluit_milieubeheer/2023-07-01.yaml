  - number: '3.80'
    text: |-
      1 De teeltvrije zone, bedoeld in [artikel 3.79, tweede lid][ref1], bedraagt bij de teelt van aardappelen,
      uien, bloembollen en bloemknollen, aardbeien, asperges, prei, schorseneren, sla, wortelen, vaste planten, en in
      neerwaartse richting te bespuiten boomkwekerijgewassen:

      a. ten minste 150 centimeter;

      b. ten minste 100 centimeter, indien een techniek wordt gebruikt waarmee een driftreductie wordt bereikt van ten
      minste 90%, ten opzichte van een bij ministeriële regeling aangewezen referentietechniek, of

      c. ten minste 50 centimeter, indien gebruik gemaakt wordt van een handmatig aangedreven handgedragen spuit.

      2 De teeltvrije zone bedraagt bij de teelt van in opwaartse of zijwaartse richting te bespuiten
      boomkwekerijgewassen ten minste 500 centimeter.

      3 De teeltvrije zone bedraagt bij de teelt van appelen, peren en overige pit- en steenvruchten:

      a. ten minste 450 centimeter, of

      b. ten minste 300 centimeter, indien:

      1°. een techniek wordt gebruikt waarmee een driftreductie wordt bereikt van ten minste 90%, ten opzichte van een
      bij ministeriële regeling aangewezen referentietechniek, of

      2°. een biologische productiemethode wordt toegepast.

      4 De teeltvrije zone bedraagt bij de teelt van andere gewassen dan de gewassen, genoemd in het eerste tot en met
      derde lid, ten minste 50 centimeter.

      5 De driftreductie van een techniek, als bedoeld in het eerste lid, onderdeel b, en het derde lid, onderdeel b,
      onder 1°, wordt aangetoond volgens een bij ministeriële regeling aangewezen testmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.79
