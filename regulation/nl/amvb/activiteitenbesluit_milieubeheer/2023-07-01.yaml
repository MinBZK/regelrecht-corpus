  - number: '3.125'
    text: >-
      1 De capaciteit van het luchtwassysteem is ten minste gelijk aan de totale maximale ventilatiebehoefte van het
      aantal en de categorie landbouwhuisdieren die worden gehouden in het huisvestingssysteem.


      2 Bij ministeriële regeling kan worden bepaald op welke wijze de capaciteit en de totale maximale
      ventilatiebehoefte worden vastgesteld en vastgelegd.


      3 Ten behoeve van een evenredige verdeling van de stallucht door het luchtwassysteem, wordt voldaan aan de bij
      ministeriële regeling gestelde eisen.


      4 Het luchtwassysteem is voorzien van een elektronisch monitoringssysteem, waarmee de parameters die van belang
      zijn voor een goede werking van het luchtwassysteem worden geregistreerd.


      5 Bij ministeriële regeling worden regels gesteld over het elektronisch monitoringssysteem en wordt bepaald welke
      parameters in ieder geval worden geregistreerd.


      6 Indien uit de registratie, bedoeld in het vijfde lid, blijkt dat de parameters worden overschreden, worden
      onmiddellijk maatregelen getroffen om een goede werking van het luchtwassysteem te waarborgen.


      7 Ten aanzien van het gebruik en onderhoud van een luchtwassysteem, worden gedragsvoorschriften opgesteld, die ten
      minste voldoen aan de bij ministeriële regeling gestelde eisen.


      8 Het vierde lid is tot 1 januari 2016 niet van toepassing op een luchtwassysteem dat is geïnstalleerd voor
      1 januari 2013 en niet is voorzien van een elektronisch monitoringssysteem als bedoeld in dat lid.


      9 Van een luchtwassysteem als bedoeld in het achtste lid worden tot 1 januari 2016 ten minste eenmaal per week de
      volgende gegevens geregistreerd:


      a. de zuurgraad van het waswater;


      b. de meterstand van de urenteller van de waswaterpomp;


      c. de meterstand van de watermeter van de spuiwaterproductie in kubieke meter.


      10 De gegevens, genoemd in het achtste lid, worden gedurende ten minste drie jaar in de inrichting bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.125
  - number: 3.125a
    text: |-
      1 Aan een luchtwassysteem als bedoeld in [artikel 3.125, achtste lid][ref1], wordt uiterlijk 1 juli 2015 een meting
      naar de emissiereductie van ammoniak uitgevoerd.

      2 Een meting als bedoeld in het eerste lid vindt plaats onder representatieve bedrijfscondities in de zomerperiode
      tussen 10.00 en 14.00 uur, waarbij de meting wordt uitgevoerd overeenkomstig [artikel 2.8][ref2].

      3 Een afschrift van de rapportage van de meting wordt in de inrichting bewaard tot ten minste het tijdstip waarop
      twee jaren zijn verstreken na de eerstvolgende meting.

      4 Indien uit de meting blijkt dat niet wordt voldaan aan de emissiereductie van ammoniak, genoemd in de
      systeembeschrijving, op grond waarvan krachtens [artikel 1 van de Wet ammoniak en veehouderij][ref3] een
      emissiefactor voor dat huisvestingssysteem is vastgesteld, worden maatregelen getroffen om daar alsnog aan te
      voldoen en wordt binnen een jaar na het uitvoeren van de meting een herhalingsmeting uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.125
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.8
      [ref3]: https://wetten.overheid.nl/BWBR0013402#Artikel1
