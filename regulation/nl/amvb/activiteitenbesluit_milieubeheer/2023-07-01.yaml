  - number: '3.140'
    text: |-
      1 Een inrichting voor het vervaardigen of bewerken van voedingsmiddelen of dranken wordt uitsluitend opgericht of
      uitgebreid in capaciteit voor dat vervaardigen of bewerken indien nieuwe geurhinder ter plaatse van geurgevoelige
      objecten door die oprichting of uitbreiding wordt voorkomen. De eerste volzin is eveneens van toepassing op het
      wijzigen van de inrichting, indien die wijziging leidt tot een grotere of andere geurbelasting ter plaatse van een
      of meer geurgevoelige objecten.

      2 Het bevoegd gezag kan in afwijking van het eerste lid bij maatwerkvoorschrift een bepaalde mate van nieuwe
      geurhinder ter plaatse van geurgevoelige objecten toestaan, indien het belang van de bescherming van het
      milieu zich daartegen niet verzet. Bij het opstellen van het maatwerkvoorschrift is [artikel 2.7a][ref1] van
      overeenkomstige toepassing en houdt het bevoegd gezag rekening met vastgesteld lokaal beleid ten aanzien van
      geurhinder.

      3 Het bevoegd gezag kan, indien blijkt dat ten gevolge van het vervaardigen of bewerken van voedingsmiddelen of
      dranken de geurhinder ter plaatse van een of meer geurgevoelige objecten een aanvaardbaar niveau overschrijdt,
      onverminderd [artikel 2.7a][ref2] bij maatwerkvoorschrift bepalen dat een bepaalde geurbelasting ter plaatse
      van geurgevoelige objecten niet wordt overschreden, dan wel dat technische voorzieningen in de inrichting worden
      aangebracht of gedragsregels in de inrichting in acht worden genomen om de geurhinder tot een aanvaardbaar niveau
      te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.140
    references:
