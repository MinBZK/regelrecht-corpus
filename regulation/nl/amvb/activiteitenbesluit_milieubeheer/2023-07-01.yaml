        paragraaf: 3.2.8
        afdeling: '3.2'
  - number: '3.17'
    text: >-
      1 Deze paragraaf is van toepassing op een inrichting voor het afleveren van vloeibare brandstof en gecomprimeerd
      aardgas aan motorvoertuigen voor het wegverkeer of het afleveren van vloeibare brandstof aan spoorvoertuigen.


      2 De voorschriften die bij of krachtens deze paragraaf gesteld worden aan het afleveren van vloeibare brandstof
      en gecomprimeerd aardgas aan motorvoertuigen voor het wegverkeer zijn tevens van toepassing op het afleveren van
      vloeibare brandstof en gecomprimeerd aardgas anders dan aan motorvoertuigen voor het wegverkeer, indien dit plaats
      vindt bij een installatie waar ook wordt afgeleverd aan motorvoertuigen voor het wegverkeer.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.17
  - number: '3.18'
    text: |-
      1 De afleverzuil bij een aardgas-afleverstation voor het afleveren van gecomprimeerd aardgas aan motorvoertuigen
      voor het wegverkeer die aardgas als motorbrandstof gebruiken bevindt zich op een afstand van ten minste 10
      meter van buiten de inrichting gelegen kwetsbare en beperkt kwetsbare objecten. Indien per etmaal meer dan 300
      personenauto’s worden gevuld, bedraagt deze afstand 15 meter. Indien per etmaal meer dan 100 autobussen worden
      gevuld, bedraagt deze afstand 20 meter. De bufferopslag bevindt zich op een afstand van buiten de inrichting
      gelegen kwetsbare en beperkt kwetsbare objecten zoals aangegeven in tabel 3.18.


            Tabel 3.18






                    Waterinhoud bufferopslag


                    Afstand






                    Minder dan 3000 liter


                    10 meter




                    Vanaf 3000 tot 5000 liter


                    15 meter




                    Meer dan 5000 liter


                    20 meter






      2 Een aardgas-afleverinstallatie voor het afleveren van gecomprimeerd aardgas aan motorvoertuigen voor het
      wegverkeer voldoet aan de bij ministeriële regeling te stellen eisen ten behoeve van het voorkomen van risico’s
      voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.18
  - number: '3.19'
    text: >-
      Het afleveren van vloeibare brandstof aan motorvoertuigen voor het wegverkeer of het afleveren van vloeibare
      brandstof aan spoorvoertuigen voldoet ten behoeve van:


      a. het realiseren van een verwaarloosbaar bodemrisico en het voorkomen dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van luchtverontreiniging, aan de bij ministeriële regeling te stellen eisen; en


      b. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan, ten minste aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.19
  - number: '3.20'
    text: >-
      1 Het afleveren van lichte olie aan motorvoertuigen voor het wegverkeer vindt plaats via een EU-systeem voor
      dampretour fase-II, indien:


      a. het debiet van lichte olie meer dan 500 kubieke meter per jaar bedraagt, of


      b. het debiet van lichte olie meer dan 100 kubieke meter per jaar bedraagt en de inrichting is gelegen onder
      permanent in gebruik zijnde woon- of werkruimten.


      2 Het eerste lid is niet van toepassing op inrichtingen die uitsluitend in verband met de vervaardiging en
      aflevering aan nieuwe motorvoertuigen voor het wegverkeer lichte olie afleveren.


      3 Een EU-systeem voor dampretour fase-II heeft:


      a. een afvangrendement van damp van lichte olie van 85%;


      b. een damp/lichte olie-verhouding van ten minste 0,95 en ten hoogste 1,05.


      4 Een EU-systeem voor dampretour fase-II:


      a. is voorzien van een keurmerk waaruit blijkt dat het is goedgekeurd overeenkomstig de bij ministeriële regeling
      aangewezen testprocedure voor dampretour fase-II door een keuringsinstantie, welke daartoe door de Raad voor
      Accreditatie is geaccrediteerd op grond van NEN-EN-ISO/IEC 17020, en


      b. voldoet aan de bij ministeriële regeling gestelde eisen ten behoeve van het voorkomen van risico’s voor de
      omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de
      risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan.


      5 Een EU-systeem voor dampretour fase-II wordt ten minste eenmaal per jaar op de goede werking gecontroleerd
      overeenkomstig de testprocedure, bedoeld in het vierde lid, onder a, door een onafhankelijke inspectie-instelling
      of ten minste eenmaal per drie jaar wanneer een automatisch bewakingssysteem is geïnstalleerd.


      6 Een automatisch bewakingssysteem als bedoeld in het vijfde lid is in staat om:


      a. storingen daarin en in het functioneren van het EU-systeem voor dampretour fase-II op te sporen;


      b. deze storingen te melden aan degene die de inrichting drijft, en


      c. de toevoer van lichte olie naar de afleverzuil automatisch te stoppen indien de storing niet binnen zeven dagen
      is verholpen.


      7 Indien bij de controle, bedoeld in het vijfde lid, afwijkingen worden geconstateerd, worden deze afwijkingen
      onverwijld opgeheven.


      8 Degene die de inrichting drijft, maakt door middel van een uithangbord, sticker of andere melding in de
      inrichting duidelijk zichtbaar dat een EU-systeem voor dampretour fase-II is geïnstalleerd.


      9 Het bevoegd gezag kan voor het afleveren van lichte olie aan motorvoertuigen voor het wegverkeer, in de gevallen
      dat het eerste lid niet van toepassing is, bij maatwerkvoorschrift eisen stellen ten behoeve van:


      a. het voorkomen van geurhinder ten gevolge van het afleveren van lichte olie, of


      b. het beperken van de emissie van benzeen ten gevolge van het afleveren van lichte olie.


      10 Het eerste lid is niet van toepassing op inrichtingen voor het afleveren van lichte olie aan motorvoertuigen
      voor het wegverkeer, waarbij het afleveren van lichte olie plaatsvindt met een maximale afleversnelheid van 10
      liter per minuut, die zijn opgericht voor 1 januari 2012, tot het moment waarop het geheel van de tanks of pompen
      en leidingen van de afleverinstallatie, sterk wordt gewijzigd of vernieuwd.


      11 Het eerste lid is niet van toepassing op inrichtingen voor het afleveren van lichte olie aan motorvoertuigen
      voor het wegverkeer anders dan ten behoeve van de openbare verkoop, die zijn opgericht voor 1 januari 2012, tot
      het moment waarop het geheel van de tanks of pompen en leidingen van de afleverinstallatie, sterk wordt gewijzigd
      of vernieuwd.


      12 Het tiende en elfde lid zijn met ingang van 1 januari 2019 niet van toepassing op inrichtingen voor het
      afleveren van lichte olie aan motorvoertuigen voor het wegverkeer met een debiet van lichte olie van meer dan 3.000
      kubieke meter per jaar.


      13 In afwijking van het vijfde lid wordt een systeem voor dampretour fase-II bij een inrichting die is opgericht
      voor 1 januari 2012 ten minste eenmaal per drie jaar op de goede werking gecontroleerd overeenkomstig de
      testprocedure, bedoeld in het vierde lid, onderdeel a, tot het moment dat het geheel van de tanks of pompen en
      leidingen van de afleverinstallatie sterk wordt gewijzigd of vernieuwd.


      14 Het dertiende lid is met ingang van 1 januari 2019 niet van toepassing op inrichtingen voor het afleveren van
      lichte olie aan motorvoertuigen voor het wegverkeer met een debiet van lichte olie van meer dan 3.000 kubieke meter
      per jaar.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.20
  - number: 3.20a
    text: |-
      1 Het inpandig afleveren van lichte olie vindt niet plaats.

      2 Het eerste lid is niet van toepassing op inpandige afleverinstallaties voor lichte olie die zijn geïnstalleerd
      voor 1 januari 2012.

      3 In de gevallen, bedoeld in het tweede lid, waarin het inpandig afleveren van lichte olie is toegestaan, vindt
      het inpandig afleveren in het belang van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat
      ongewone voorvallen zich voordoen en de gevolgen hiervan ten minste plaats via een EU-systeem voor dampretour fase-
      II.

      4 Op het inpandig afleveren van lichte olie, bedoeld in het derde lid, is
      [artikel 3.20, derde tot en met achtste lid][ref1], alsmede de krachtens die leden en krachtens
      [artikel 3.19][ref2] gestelde regels van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.20
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.19
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.20a
