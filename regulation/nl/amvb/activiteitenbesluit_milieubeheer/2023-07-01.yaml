  - number: '2.20'
    text: |-
      1 In afwijking van de waarden, bedoeld in de [artikelen 2.17][ref1], [2.17a][ref2], 2.19 dan wel [2.19a][ref3], kan
      het bevoegd gezag bij maatwerkvoorschrift andere waarden voor het langtijdgemiddeld beoordelingsniveau (L) en het
      maximaal geluidsniveau L vaststellen.

      2 Het bevoegd gezag kan slechts hogere waarden vaststellen dan de waarden, bedoeld in de [artikelen 2.17][ref4],
      [2.17a][ref5], 2.19 dan wel [2.19a][ref6], indien binnen geluidsgevoelige ruimten dan wel verblijfsruimten van
      gevoelige gebouwen, die zijn gelegen binnen de akoestische invloedssfeer van de inrichting, een etmaalwaarde van
      maximaal 35 dB(A) wordt gewaarborgd.

      3 De in het tweede lid bedoelde etmaalwaarde is niet van toepassing indien de gebruiker van deze gevoelige gebouwen
      geen toestemming geeft voor het in redelijkheid uitvoeren of doen uitvoeren van geluidsmetingen.

      4 Het bevoegd gezag kan maatwerkvoorschriften stellen over de plaats waar de waarden, bedoeld in de
      [artikelen 2.17][ref7], [2.17a][ref8], 2.19 dan wel [2.19a][ref9], voor een inrichting gelden.

      5 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen welke technische voorzieningen in de inrichting worden
      aangebracht en welke gedragsregels in acht worden genomen teneinde aan geldende geluidsnormen te voldoen.

      6 In afwijking van de waarden, bedoeld in de [artikelen 2.17][ref10], [2.17a][ref11], 2.19 dan wel [2.19a][ref12]
      kan het bevoegd gezag bij maatwerkvoorschrift voor bepaalde activiteiten in een inrichting, anders dan
      festiviteiten als bedoeld in [artikel 2.21][ref13], andere waarden voor het langtijdgemiddeld beoordelingsniveau
      (L) en het maximaal geluidsniveau L vaststellen. Het bevoegd gezag kan daarbij voorschriften vaststellen met
      betrekking tot de duur van de activiteiten, het treffen van maatregelen, de tijdstippen waarop de activiteiten
      plaatsvinden of het vooraf melden per keer dat de activiteit plaatsvindt.

      7 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen welke technische voorzieningen worden aangebracht en welke
      gedragsregels in acht worden genomen ter beperking van het geluid als gevolg van werkzaamheden en activiteiten bij
      een inrichting als bedoeld in [artikel 2.17, vijfde lid][ref14].

      8 De etmaalwaarde die het bevoegd gezag vaststelt op grond van het eerste lid, is niet lager dan 40 dB(A) voor
      een inrichting:

      a. waarop tot het van toepassing worden van dit artikel op die inrichting,
      het [Besluit opslag- en transportbedrijven milieubeheer][ref15], het
      [Besluit detailhandel- en ambachtsbedrijven milieubeheer][ref16], het
      [Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer][ref17], het
      [Besluit bouw- en houtbedrijven milieubeheer][ref18], het [Besluit woon- en verblijfsgebouwen milieubeheer][ref19],
      het [Besluit textielreinigingsbedrijven milieubeheer][ref20], het [Besluit jachthavens milieubeheer][ref21], het
      [Besluit motorvoertuigen milieubeheer][ref22] of het [Besluit glastuinbouw][ref23] van toepassing was, en

      b. die voor de inwerkingtreding van het in onderdeel a genoemde besluit dat van toepassing was, is opgericht.

      9 De etmaalwaarde die het bevoegd gezag vaststelt op grond van het eerste lid is niet lager dan 40 dB(A)
      voor een inrichting waarop tot 1 januari 2008 het [Besluit tankstations milieubeheer][ref24] of het
      [Besluit tandartspraktijken milieubeheer][ref25] van toepassing was.


