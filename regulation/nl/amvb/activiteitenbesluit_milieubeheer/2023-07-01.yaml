  - number: '6.5'
    text: |-
      Indien op het tijdstip van het van toepassing worden van dit besluit of een deel daarvan op een
      activiteit in een inrichting nog niet is beslist op een aanvraag om een vergunning op grond van
      [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref1] dan wel een vergunning op grond van
      [artikel 6.2 van de Waterwet][ref2] en dit besluit op het betreffende lozen van toepassing is, wordt de aanvraag om
      de vergunning aangemerkt als:

      a. een melding overeenkomstig [artikel 1.10][ref3], voor zover het lozen bij of krachtens de in [hoofdstuk 3][ref4]
      of [4][ref5] van dit besluit gestelde voorschriften is toegestaan;

      b. een verzoek tot het stellen van een maatwerkvoorschrift als bedoeld in
      [artikel 3.1, zesde lid, onderdeel b][ref6], voor zover de aanvraag lozen betreft als bedoeld in artikel 3.1,
      vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
