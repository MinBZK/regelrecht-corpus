  - number: 4.74m
    text: Deze paragraaf is van toepassing op het vormgeven van betonproducten.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.74m
  - number: 4.74n
    text: >-
      1 Het lozen van afvalwater afkomstig van het uitwassen van beton is uitsluitend toegestaan indien daarbij ten
      minste wordt voldaan aan de eisen, gesteld bij en krachtens het tweede tot en met vijfde lid.


      2 Bij het lozen van afvalwater in een aangewezen oppervlaktewaterlichaam bedraagt:


      a. het gehalte aan onopgeloste stoffen in enig steekmonster niet meer dan 100 milligram per liter, en


      b. het gehalte aan chemisch zuurstofverbruik in enig steekmonster niet meer dan 200 milligram per liter.


      3 Bij het lozen van afvalwater in een vuilwaterriool bevat het afvalwater in enig steekmonster niet meer dan 300
      milligram onopgeloste stoffen per liter.


      4 Het te lozen afvalwater kan op doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.74n
  - number: 4.74o
    text: >-
      1 Bij het aanbrengen van ontkistingsmiddelen op bekisting wordt voldaan aan de bij ministeriële regeling gestelde
      eisen inzake de reductie van de emissie van vluchtige organische stoffen, tenzij deze niet kosteneffectief of
      technisch uitvoerbaar zijn.


      2 Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de
      activiteit, genoemd in het eerste lid, minder bedraagt dan 1.000 kilogram per jaar.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.74o
  - number: 4.74p
    text: >-
      Bij het op bekisting aanbrengen van ontkistingsmiddelen en het uitwassen van beton wordt ten behoeve van het
      realiseren van een verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.74p
  - number: 4.74p1
    text: |-
      In afwijking van [artikel 6.1, eerste lid][ref1], worden voor inrichtingen als bedoeld in
      categorie 11.3, onderdeel c, onder 2° en 3°, van [bijlage I, bij het Besluit omgevingsrecht][ref2]
      waarvoor tot de inwerkingtreding van deze paragraaf, een vergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref3] in werking en
      onherroepelijk was, de voorschriften van die vergunning in afwijking van artikel 6.1, eerste lid, voor onbepaalde
      tijd aangemerkt als maatwerkvoorschriften, mits de voorschriften van de vergunning vallen binnen de bevoegdheid van
      het bevoegd gezag tot het stellen van maatwerkvoorschriften op grond van [artikel 2.20][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0027464
