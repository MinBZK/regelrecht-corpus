  - number: 3.5g
    text: |-
      1 Het openbaar lichaam of een andere rechtspersoon welke krachtens [artikel 3.4 van de Waterwet][ref1] is belast
      met de zorg voor een zuiveringtechnisch werk voor de behandeling van stedelijk afvalwater met een vervuilingswaarde
      van 2.000 inwonerequivalenten of meer bemonstert zowel het inkomende, onbehandelde stedelijk afvalwater als het te
      lozen gezuiverde stedelijk afvalwater, analyseert de monsters en beoordeelt de resultaten daarvan overeenkomstig de
      bij ministeriële regeling gestelde eisen.

      2 Het openbaar lichaam of een andere rechtspersoon als bedoeld in het eerste lid legt binnen vier maanden na afloop
      van ieder kalenderjaar aan Onze Minister een overzicht over van de onder zijn zorg staande zuiveringtechnische
      werken en van de resultaten van de bemonstering, analyse en beoordeling, bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3.4
