  - number: '2.25'
    text: |-
      Degene die een inrichting drijft waarin vloeibare brandstof of afgewerkte olie in een ondergrondse tank wordt
      opgeslagen, legt binnen acht weken nadat hij met deze activiteit is aangevangen aan het bevoegd gezag schriftelijk
      bewijsstukken over, waaruit blijkt dat:

      a. wordt voldaan aan [artikel 2.24, eerste en tweede lid][ref1];

      b. voor zover sprake is van het drijven van een tankstation voor het wegverkeer kan worden voldaan aan
      [artikel 2.24, vierde lid][ref2];

      c. degene die contractueel instaat voor de financiële dekking van de aansprakelijkheid, bedoeld in
      [artikel 2.24, eerste lid][ref3], voor zover sprake is van het drijven van een tankstation voor het wegverkeer,
      het bevoegd gezag zo spoedig mogelijk schriftelijk in kennis zal stellen van het tijdstip waarop die zekerheid
      is of zal komen te vervallen, alsmede van de opneming van uitsluitingen en andere fundamentele wijzigingen in de
      afgesloten overeenkomst die de gestelde zekerheid inperken; en

      d. de persoon, bedoeld in onderdeel b, tot een jaar na de in dat onderdeel bedoelde schriftelijke kennisgeving
      garant staat voor herstel of vergoeding van schade die is ontstaan tijdens de looptijd van de financiële zekerheid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.24
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.24
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2.24
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.25
