  - number: '4.126'
    text: >-
      Bij activiteiten in een laboratorium of een praktijkruimte worden ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico en het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van
      die emissies naar de buitenlucht de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.126
  - number: '4.127'
    text: >-
      Bij het gericht werken met biologische agentia in een laboratorium of een praktijkruimte wordt ten behoeve van het
      voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel
      mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen
      hiervan, ten minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.127
  - number: '5'
    text: |-
      1 De [paragrafen 5.1.1 tot en met 5.1.3][ref1] zijn van toepassing op degene die een inrichting type C drijft,
      waartoe een installatie behoort als bedoeld in hoofdstuk III, IV of VI, of bijlage I van de EU-richtlijn
      industriële emissies.

      2 De [paragrafen 5.1.4 tot en met 5.1.7][ref2] zijn van toepassing op degene die een inrichting type B of C drijft,
      waartoe een installatie behoort als bedoeld in de paragrafen 5.1.4 tot en met 5.1.7.

      3 [Paragrafen 5.2.1][ref3] en [5.2.2][ref4] zijn van toepassing op degene die een inrichting type C drijft of op
      degene die een inrichting type B drijft waartoe een installatie behoort als bedoeld in artikel 2, onderdeel c, van
      richtlijn 94/63/EG.

      4 [Paragraaf 5.3.1][ref5] is van toepassing op degene die een inrichting type C drijft.


