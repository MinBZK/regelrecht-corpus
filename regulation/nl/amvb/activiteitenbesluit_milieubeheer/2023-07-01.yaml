        afdeling: '3.3'
  - number: '3.25'
    text: |-
      Onverminderd [artikel 3.3][ref1], worden motorvoertuigen of werktuigen waarmee gewasbeschermingsmiddelen
      zijn toegepast, op een verhard oppervlak zodanig gestald, dat het te lozen hemelwater niet met de toegepaste
      gewasbeschermingsmiddelen kan worden verontreinigd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.3
