      die zijn aangewezen krachtens [artikel 88, negende lid, van de Wet bodembescherming][ref1], en een regionaal
      openbaar bestuur als bedoeld in de [Kaderwet bestuur in verandering][ref2], treden voor de toepassing van
      [artikel 2.24, vierde lid][ref3], in de plaats van gedeputeerde staten. Een regionaal openbaar lichaam als
      bedoeld in de vorige volzin treedt slechts in de plaats van gedeputeerde staten, indien de in dit artikel bedoelde
      bevoegdheden bij die algemene maatregel van bestuur zijn overgedragen.


