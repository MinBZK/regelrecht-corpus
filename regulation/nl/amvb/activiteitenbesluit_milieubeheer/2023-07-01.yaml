  - number: '3.142'
    text: >-
      Deze paragraaf is van toepassing op het schieten op een schietbaan of een combinatie van schietbanen in een gebouw
      of een deel van een gebouw, zonder open zijden en met een gesloten afdekking.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.142
  - number: '3.143'
    text: |-
      1 Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het schieten op een
      binnenschietbaan, de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur, en

      b. 50 milligram per normaal kubieke meter, indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.

      2 Bij het schieten op een binnenschietbaan wordt ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk
      is het beperken van diffuse emissies en stofhinder en het doelmatig verspreiden van emissies naar de buitenlucht,
      voldaan aan de bij ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.143
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '3.144'
    text: >-
      1 Bij het schieten op een binnenschietbaan wordt ten behoeve van:


      a. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan, of


      b. het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van bodemverontreiniging;


      ten minste voldaan aan de bij ministeriële regeling gestelde eisen.


      2 Voor de bepaling van het langtijdgemiddelde beoordelingsniveau (L) en het maximaal geluidniveau L, veroorzaakt
      door een inrichting met een binnenschietbaan, wordt voldaan aan bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.144
  - number: '3.145'
    text: >-
      Deze paragraaf is van toepassing op het door schutterijen of schuttersgilden schieten met buksen of geweren vanaf
      een vaste standplaats op een stilstaand doel in de buitenlucht.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.145
  - number: '3.146'
    text: |-
      Bij het traditioneel schieten wordt:

      a. in afwijking van [artikel 2.9, eerste lid][ref1], ten behoeve van het voorkomen dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de belasting van de bodem, of

      b. ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, ten minste voldaan aan de bij ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.146
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.9'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: '3.147'
    text: >-
      Deze paragraaf is van toepassing op het bieden van gelegenheid voor het beoefenen van sport in de buitenlucht
      waarbij terreinverlichting wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.147
  - number: '3.148'
    text: >-
      1 De verlichting bij een gelegenheid voor sportbeoefening in de buitenlucht is uitgeschakeld:


      a. tussen 23.00 uur en 07.00 uur, en


      b. indien er geen sport wordt beoefend noch onderhoud plaatsvindt.


      2 Het eerste lid is niet van toepassing op dagen of dagdelen in verband met:


      a. de viering van festiviteiten die bij of krachtens een gemeentelijke verordening zijn aangewezen, in de gebieden
      in de gemeente waarvoor de verordening geldt;


      b. de viering van andere festiviteiten die plaatsvinden in de inrichting, waarbij het aantal bij of krachtens een
      gemeentelijke verordening aan te wijzen dagen of dagdelen niet meer mag bedragen dan twaalf per kalenderjaar, of


      c. door het bevoegd gezag aangewezen activiteiten in een inrichting, anders dan festiviteiten als bedoeld in
      onderdeel b, waarbij het aantal aan te wijzen dagen of dagdelen gebaseerd op dit artikel tezamen niet meer bedraagt
      dan twaalf dagen per kalenderjaar.


      3 Een festiviteit of activiteit als bedoeld in het tweede lid die maximaal een etmaal duurt, maar die zowel voor
      als na 00.00 uur plaatsvindt, wordt hierbij beschouwd als plaatshebbende op één dag.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.148
  - number: '3.149'
    text: Deze paragraaf is van toepassing op het lozen van spuiwater uit recreatieve visvijvers.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.149
  - number: '3.150'
    text: >-
      1 Het lozen van spuiwater uit recreatieve visvijvers in een oppervlaktewaterlichaam, op of in de bodem of in een
      voorziening voor de inzameling en het transport van afvalwater, niet zijnde een vuilwaterriool, is toegestaan.


      2 Het lozen van spuiwater uit recreatieve visvijvers in een vuilwaterriool is verboden.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.150
  - number: '3.151'
    text: Deze paragraaf is van toepassing op het gebruiken van gewasbeschermingsmiddelen op sport- of recreatieterreinen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.151
  - number: '3.152'
    text: >-
      1 Bij het lozen van gewasbeschermingsmiddelen in een oppervlaktewaterlichaam ten gevolge van het gebruik van
      gewasbeschermingsmiddelen op een sport- of recreatieterrein in de nabijheid van een oppervlaktewaterlichaam wordt
      ten minste voldaan aan het tweede tot en met het derde lid.


      2 Binnen een afstand van een meter vanaf de insteek van een oppervlaktewaterlichaam worden
      gewasbeschermingsmiddelen niet gebruikt met apparatuur die bestemd is voor het druppelsgewijs gebruiken van
      gewasbeschermingsmiddelen, met uitzondering van pleksgewijze onkruidbestrijding met een afgeschermde spuitdop.


      3 Binnen een afstand van 14 meter vanaf de insteek van een oppervlaktewaterlichaam:


      a. worden gewasbeschermingsmiddelen slechts gebruikt met mechanisch voortbewogen apparatuur, indien deze
      uitsluitend is voorzien van driftarme doppen, en zodanig is ingesteld dat de spuitdoppen zich niet hoger dan 50 cm
      boven de grond bevinden;


      b. wordt geen gebruik gemaakt van een spuitgeweer dat is voorzien van een werveldop of dat gebruik maakt van een
      werkdruk van 5 bar of hoger;


      c. worden geen gewasbeschermingsmiddelen gebruikt bij een windsnelheid van meer dan 5 meter per seconde gemeten op
      twee meter boven het grondoppervlak.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.152
  - number: '3.155'
    text: |-
      Deze paragraaf is van toepassing op inrichtingen waar een gemeente ter uitvoering van
      [artikel 10.22, eerste lid, van de wet][ref1] gelegenheid biedt om grove huishoudelijke afvalstoffen achter te
      laten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.22
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.155
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10.22'
  - number: '3.156'
    text: |-
      1 Bij een inrichting waar een gemeente gelegenheid biedt om grove huishoudelijke afvalstoffen achter te laten wordt
      ten behoeve van een doelmatig beheer van afvalstoffen ten minste voldaan aan de bij ministeriële regeling gestelde
      eisen.

      2 In afwijking van [artikel 2.12][ref1] is het bij een inrichting die voldoet aan de krachtens het eerste lid
      gestelde eisen toegestaan afvalstoffen, zijnde grove huishoudelijke afvalstoffen, te mengen met andere categorieën
      van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.156
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.12'
        hoofdstuk: '2'
        afdeling: '2.5'
  - number: '3.157'
    text: >-
      Deze paragraaf is van toepassing op het schieten op:


      a. een buitenschietbaan die wordt gebruikt door de Nederlandse of een bondgenootschappelijke krijgsmacht waar
      minder dan 3 miljoen schoten per jaar worden afgevuurd;


      b. een buitenschietbaan, niet zijnde een buitenschietbaan als bedoeld onder a, met beperkte onveilige zone;


      c. een kleiduivenbaan.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.157
  - number: '3.158'
    text: |-
      In afwijking van [artikel 2.9, eerste lid][ref1], worden bij het schieten op een buitenschietbaan ten behoeve van
      het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van bodemverontreiniging de bij
      ministeriële regeling voorgeschreven maatregelen getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.158
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.9'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: '3.159'
    text: |-
      De [artikelen 2.17 tot en met 2.22][ref1] zijn niet van toepassing op een buitenschietbaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.17
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.159
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.17'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: '3.160'
    text: |-
      1 Een buitenschietbaan voldoet ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot
      een aanvaardbaar niveau beperken van geluidhinder aan de norm van ten hoogste 50 dB B op de gevel van gevoelige
      gebouwen en bij gevoelige terreinen op de grens van het terrein.

      2 In afwijking van het eerste lid kan het bevoegd gezag in verband met nationale of operationele belangen, of
      indien bijzondere lokale omstandigheden daartoe aanleiding geven, bij maatwerkvoorschrift normen met een andere
      waarde vaststellen, echter niet hoger dan 55 dB B.

      3 De geluidvoorschriften in een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1], voor een
      inrichting waarvan een buitenschietbaan deel uitmaakt, die in werking en onherroepelijk was tot het tijdstip van
      het in werking treden van het eerste lid, blijven van toepassing gedurende ten hoogste vijf jaar na dat tijdstip
      dan wel tot het tijdstip waarop het gebruik, het wapentype of de constructie van de buitenschietbaan wordt
      gewijzigd dan wel tot het tijdstip waarop een maatwerkvoorschrift als bedoeld in het tweede lid, wordt opgelegd.

      4 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen welke technische voorzieningen in de inrichting worden
      aangebracht en welke gedragsregels in acht worden genomen teneinde aan geldende geluidsnormen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.160
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.1'
  - number: '3.161'
    text: >-
      1 De berekening van de geluidbelasting wordt uitgevoerd overeenkomstig de bij ministeriële regeling gestelde eisen.


      2 De drijver van de inrichting registreert de bij ministeriële regeling te bepalen gegevens welke gedurende vijf
      kalenderjaren na dagtekening worden bewaard en ter inzage gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.161
  - number: '3.162'
    text: >-
      Bij het schieten op een buitenschietbaan wordt ten behoeve van het voorkomen van risico’s voor de omgeving en
      ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de
      omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan, voldaan aan de bij ministeriele
      regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.162
  - number: '3.163'
    text: Deze paragraaf is van toepassing op het coaten of lijmen van planten of onderdelen van planten, anders dan hout.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.163
  - number: '3.164'
    text: >-
      Het is verboden om in de buitenlucht planten of onderdelen van planten met behulp van een nevelspuit te coaten
      of lijmen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.164
  - number: '3.165'
    text: |-
      Onverminderd de [artikelen 2.5, eerste, vierde en zesde lid][ref1], en [2.6][ref2] is bij het coaten of lijmen van
      planten of onderdelen van planten de emissieconcentratie van stofklasse S ten hoogste:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur, en

      b. 50 milligram per normaal kubieke meter, indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.165
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '3.166'
    text: >-
      Degene die de inrichting drijft, treft bij het coaten of lijmen van planten of onderdelen van planten de
      emissiereducerende maatregelen met betrekking tot vluchtige organische stoffen die zijn gesteld bij ministeriële
      regeling tenzij deze niet kosteneffectief of technisch uitvoerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.166
  - number: '3.167'
    text: >-
      Bij het coaten of lijmen van planten of onderdelen van planten worden ten behoeve van:


      a. het voorkomen dan wel voor zover dat niet mogelijk is het beperken van diffuse emissies;


      b. het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van stofhinder;


      c. het doelmatig verspreiden van emissies naar de buitenlucht;


      d. het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van geurhinder,
      en


      e. het realiseren van een verwaarloosbaar bodemrisico,


      de bij ministeriële regeling voorgeschreven maatregelen getroffen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.167
  - number: '3.168'
    text: >-
      1 Deze paragraaf is van toepassing op het fokken, houden of trainen van meer dan 25 vogels of meer dan 5
      zoogdieren.


      2 Deze paragraaf is niet van toepassing op het houden van landbouwhuisdieren.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.168
  - number: '3.169'
    text: >-
      Bij het fokken, houden of trainen van vogels of zoogdieren wordt ten behoeve van:


      a. het realiseren van een verwaarloosbaar bodemrisico, en


      b. het voorkomen of voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van de geurhinder,


      ten minste voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.169
  - number: '4'
    text: Dit hoofdstuk is van toepassing op degene die een inrichting type A of een inrichting type B drijft.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4
  - number: 4a
    text: >-
      Deze paragraaf is van toepassing op het opslaan van gevaarlijke stoffen, CMR-stoffen of bodembedreigende stoffen in
      verpakking, met uitzondering van:


      a. de opslag van vuurwerk;


      b. pyrotechnische artikelen voor theatergebruik;


      c. andere ontplofbare stoffen;


      d. stoffen van ADR klasse 5.2 type C tot en met F;


      e. asbest;


      f. gedemonteerde airbags;


      g. gordelspanners, of


      h. vaste kunstmeststoffen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4a
  - number: '4.1'
    text: |-
      1 De verpakking en de opslag van gevaarlijke stoffen en CMR-stoffen in verpakking voldoen ten behoeve van het
      voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel
      mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen
      hiervan, ten minste aan de bij ministeriële regeling te stellen eisen.

      2 Indien in een opslagvoorziening bestemd voor de opslag van gevaarlijke stoffen en CMR-stoffen in verpakking
      meer dan 2.500 kilogram gevaarlijke stoffen, niet zijnde gasflessen behorende tot de ADR klasse 2, aanwezig zijn,
      bedraagt de afstand tussen de opslagvoorziening en de dichtstbijzijnde woning van derden ten minste 20 meter.

      3 Indien de opslagvoorziening bestemd voor de opslag van gevaarlijke stoffen en CMR-stoffen in verpakking is
      uitgevoerd als brandcompartiment of indien tussen de opslagvoorziening en de woning van derden een brandwerende
      voorziening van voldoende omvang aanwezig is, bedraagt de afstand, bedoeld in het tweede lid, ten minste 8 meter.

      4 Het tweede en derde lid zijn niet van toepassing indien in de opslagvoorziening geen brandbare gevaarlijke
      stoffen aanwezig zijn.

      5 Indien in een in de buitenlucht gesitueerde opslagvoorziening meer dan 1.000 liter brandbare gassen in
      gasflessen gemeten naar de totale waterinhoud aanwezig zijn, bedraagt de afstand tussen de opslagvoorziening en de
      dichtstbijzijnde woning van derden ten minste 15 meter. Indien tussen de opslagvoorziening en de woning van derden
      een brandwerende voorziening van voldoende omvang aanwezig is, bedraagt de afstand, bedoeld in de eerste zin, ten
      minste 7,5 meter.

      6 Het voorhanden hebben en het gebruik van gasflessen die gevuld zijn met autogas is verboden, met uitzondering
      van wisselreservoirs ten behoeve van interne transportmiddelen. De eerste volzin is niet van toepassing op
      gedemonteerde LPG-tanks van motorvoertuigen.

      7 De verpakking en de opslag van vloeibare bodembedreigende stoffen in verpakking en afvalstoffen waaruit vloeibaar
      bodembedreigende stoffen kunnen lekken voldoen ten behoeve van het realiseren van een verwaarloosbaar bodemrisico,
      aan de bij ministeriële regeling te stellen eisen.

      8 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      verontreiniging van een oppervlaktewaterlichaam is het boven een oppervlaktewaterlichaam opslaan van gevaarlijke
      stoffen in verpakking, CMR-stoffen in verpakking, bodembedreigende stoffen in verpakking en van lege, ongereinigde
      verpakkingen van gevaarlijke stoffen, CMR-stoffen en vloeibare bodembedreigende stoffen verboden, met uitzondering
      van:

      a. het opslaan benedendeks op een binnenschip dat beschikt over een certificaat van onderzoek als bedoeld in
      [artikel 6 van het Binnenvaartbesluit][ref1], of

      b. het opslaan van gasflessen.

      9 Indien gevaarlijke stoffen of CMR-stoffen in verpakking of vloeibare bodembedreigende stoffen in verpakking boven
      een oppervlaktewaterlichaam aanwezig zijn, wordt ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk
      is het zoveel mogelijk beperken van verontreiniging van een oppervlaktewaterlichaam ten minste voldaan aan de bij
      ministeriële regeling te stellen eisen.

      10 Het tweede tot en met zesde lid en het achtste en negende lid, zijn niet van toepassing op het opslaan van
      vloeibare kunstmeststoffen in verpakking, indien dat opslaan plaatsvindt in het kader van agrarische activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '6'
  - number: 4.1a
    text: >-
      1 Deze paragraaf is van toepassing op het opslaan van vuurwerk, pyrotechnische artikelen voor theatergebruik of
      andere ontplofbare stoffen.


      2 Deze paragraaf is niet van toepassing op inrichtingen die in gebruik zijn bij de Nederlandse of een
      bondgenootschappelijke krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.1a
  - number: '4.2'
    text: >-
      Inbeslaggenomen vuurwerk met aan consumentenvuurwerk vergelijkbare eigenschappen dat wordt opgeslagen in
      politiebureaus en theatervuurwerk wordt opgeslagen in een brandveiligheidsopslagkast, die voldoet aan de bij
      ministeriële regeling te stellen eisen ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone
      voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving
      en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.2
  - number: '4.3'
    text: >-
      1 Zwart kruit, rookzwak kruit en noodsignalen worden opgeslagen in een brandcompartiment dat voldoet aan de bij
      ministeriële regeling te stellen eisen ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone
      voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving
      en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan.


      2 Een brandcompartiment bestemd voor de opslag van zwart kruit of rookzwak kruit is gelegen op een afstand van ten
      minste 8 meter van buiten de inrichting gelegen kwetsbare of beperkt kwetsbare objecten.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.3
  - number: '4.4'
    text: >-
      1 Een voorziening voor de opslag van meer dan 10.000 patronen voor vuurwapens, dan wel onderdelen daarvan, is
      gelegen op een afstand van ten minste 8 meter van buiten de inrichting gelegen kwetsbare of beperkt kwetsbare
      objecten.


      2 Het eerste lid is niet van toepassing indien de voorziening, bedoeld in dat lid, in een brandcompartiment is
      gesitueerd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.4
  - number: 4.4a
    text: |-
      1 Deze paragraaf is van toepassing op het opslaan van stoffen in een bovengrondse opslagtank van:

      a. propeen, zuurstof, kooldioxide, argon, helium of stikstof;

      b. stoffen van ADR klasse 5.1 of klasse 8, verpakkingsgroepen II en III, zonder bijkomend gevaar;

      c. halfzware olie als bedoeld in [artikel 26 van de Wet op de accijns][ref1] bij een inrichting voor agrarische
      activiteiten;

      d. PER bij een inrichting voor de reiniging van textiel;

      e. polyesterhars, of

      f. andere vloeibare bodembedreigende stoffen, niet zijnde:

      1°. gevaarlijke stoffen;

      2°. CMR-stoffen;

      3°. smeerolie,

      4°. afgewerkte olie, of

      5°. gasolie.

      2 Deze paragraaf is niet van toepassing op bovengrondse opslagtanks die ingebouwd zijn in een installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.4a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '26'
  - number: '4.5'
    text: >-
      1 Bij het in gebruik hebben en het beëindigen van het gebruik van een bovengrondse opslagtank die wordt dan
      wel werd gebruikt voor de opslag van zuurstof, kooldioxide, argon, helium of stikstof wordt ten behoeve van het
      voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel
      mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen
      hiervan, ten minste voldaan aan de bij ministeriële regeling te stellen eisen.


      2 Indien in een inrichting een bovengrondse opslagtank, bestemd voor de opslag van zuurstof, op een afstand van
      minder dan 10 meter is gelegen van een andere opslagtank, bestemd voor de opslag van propaan, propeen of een gas
      als bedoeld in het eerste lid, is de opslagtank bestemd voor de opslag van zuurstof gelegen op een afstand van ten
      minste 20 meter van buiten de inrichting gelegen kwetsbare of beperkt kwetsbare objecten.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.5
  - number: 4.5a
    text: |-
      1 Met betrekking tot de opstelplaats van een opslagtank met propeen, het vulpunt van een opslagtank met propeen
      en de opstelplaats van de tankwagen worden ten opzichte van buiten de inrichting gelegen kwetsbare en beperkt
      kwetsbare objecten, de in tabel 4.5a opgenomen afstanden in acht genomen, waarbij de afstanden gelden van het
      vulpunt en de bovengrondse opslagtank, gerekend vanaf de aansluitpunten van de leidingen alsmede het bovengrondse
      deel van de leidingen en de pomp bij de opslagtank:


            Tabel 4.5a veiligheidsafstanden








                    Bevoorrading tot en met 5 keer per jaar


                    Bevoorrading meer dan 5 keer per jaar






                    Opslagtank met propeen tot en met 5 kubieke meter


                    10 meter


                    20 meter




                    Opslagtank met propeen groter dan 5 kubieke meter tot en met 13 kubieke meter


                    15 meter


                    25 meter






      2 Een opslagtank met propeen, het vulpunt van een opslagtank met propeen en de opstelplaats van de tankwagen is
      gelegen op ten minste de helft van de afstanden, genoemd in tabel 4.5a, indien het objecten betreft waar ook een
      opslagtank met propeen of propaan aanwezig is.

      3 In afwijking van het eerste lid worden met betrekking tot de opstelplaats van een opslagtank met propeen, het
      vulpunt van een opslagtank met propeen en de opstelplaats van de tankwagen ten opzichte van gebouwen bestemd voor
      het verblijf, al dan niet gedurende een gedeelte van de dag, van minderjarigen, ouderen, zieken of gehandicapten,
      dan wel gebouwen waarin doorgaans grote aantallen personen gedurende een groot gedeelte van de dag aanwezig zijn,
      de volgende afstanden in acht genomen:

      a. bij een opslagtank met propeen tot en met 5 kubieke meter: 25 meter;

      b. bij een opslagtank met propeen van meer dan 5 kubieke meter tot en met 13 kubieke meter: 50 meter.

      4 Onverminderd het eerste tot en met derde lid, voldoet een opslagtank met propeen alsmede de bijbehorende
      leidingen en appendages ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat
      ongewone voorvallen zich voordoen en de gevolgen hiervan, aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.5a
  - number: 4.5b
    text: >-
      1 Met betrekking tot de opstelplaats van een bovengrondse opslagtank met polyesterhars, het vulpunt van een
      bovengrondse opslagtank met polyesterhars of de opstelplaats van de tankwagen, wordt ten opzichte van buiten de
      inrichting gelegen kwetsbare en beperkt kwetsbare objecten een afstand aangehouden van ten minste 20 meter.


      2 Het eerste lid is niet van toepassing op een opslagtank die is geïnstalleerd voor 1 januari 2013.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.5b
  - number: '4.6'
    text: |-
      Bij het in gebruik hebben en het beëindigen van het gebruik van een bovengrondse opslagtank die wordt dan wel werd
      gebruikt voor de opslag van halfzware olie als bedoeld in [artikel 26 van de Wet op de accijns][ref1], stoffen van
      ADR klasse 8 verpakkingsgroep II en III zonder bijkomend gevaar, PER, stoffen van ADR klasse 5.1, polyesterhars of
      andere vloeibare bodembedreigende stoffen wordt ten behoeve van:

      a. het realiseren van een verwaarloosbaar bodemrisico;

      b. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan;

      c. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van een
      oppervlaktewaterlichaam,

      voldaan aan de bij ministeriële regeling te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '26'
  - number: 4.6a
    text: >-
      Deze paragraaf is van toepassing op het parkeren van vervoerseenheden met stoffen of voorwerpen, waarvan het
      vervoer volgens het ADR is verboden of slechts onder daarin opgenomen voorwaarden is toegestaan, dan wel stoffen,
      materialen en voorwerpen aangeduid in de International Maritime Dangerous Goods Code.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.6a
  - number: '4.7'
    text: >-
      1 De afstand tussen een geparkeerde vervoerseenheid met gevaarlijke stoffen en een woning van derden bedraagt ten
      minste 20 meter. Deze afstand wordt gemeten vanaf de rand van de vervoerseenheid tot de gevel van de woning.


      2 In een geparkeerde vervoerseenheid met gevaarlijke stoffen zijn gevaarlijke stoffen van verpakkingsgroep I en
      gevaarlijke stoffen van de klasse ADR 1 of 6.2, met uitzondering van categorie I3 en I4 niet aanwezig.


      3 Het eerste en het tweede lid zijn niet van toepassing op het opstellen van vervoerseenheden met gevaarlijke
      stoffen in verband met aanmelden of andere formaliteiten, of op het opstellen van vervoerseenheden met gevaarlijke
      stoffen voor het verrichten van laad- of loshandelingen.


      4 Met betrekking tot het parkeren van vervoerseenheden met gevaarlijke stoffen wordt ten behoeve van het voorkomen
      van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk
      beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan,
      ten minste voldaan aan de bij ministeriële regeling te stellen eisen
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.7
  - number: '4.8'
    text: >-
      Deze paragraaf is van toepassing op:


      a. het opslaan van stoffen van ADR klasse 5.2 behorend tot type C, D, E of F, waarvoor volgens het ADR
      temperatuurbeheersing niet vereist is, in een hoeveelheid van ten hoogste 1.000 kilogram per opslagvoorziening en
      in LQ-verpakking;


      b. het opslaan van stoffen van ADR klasse 5.2 behorend tot type D, E of F, waarvoor ingevolge het ADR
      temperatuurbeheersing niet is vereist, in een hoeveelheid van ten hoogste 1.000 kilogram per opslagvoorziening,
      in een verpakking niet zijnde LQ en voor zover het desinfectiemiddelen betreft of de opslag plaatsvindt bij een
      inrichting waar rubber of kunststof wordt verwerkt;


      c. het gebruik van stoffen van ADR klasse 5.2 behorend tot type D, E of F, waarvoor ingevolge het ADR
      temperatuurbeheersing niet is vereist, als desinfectiemiddel of bij een inrichting waar rubber of kunststof wordt
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.8
  - number: '4.9'
    text: |-
      Het gebruik of de opslag in verpakking van stoffen van ADR klasse 5.2 type C tot en met F als bedoeld in
      [artikel 4.8][ref1] voldoet ten behoeve van:

      a. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan, en

      b. het realiseren van een verwaarloosbaar bodemrisico,

      aan de bij ministeriële regeling gestelde eisen.


