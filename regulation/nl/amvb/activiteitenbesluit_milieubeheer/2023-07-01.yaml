  - number: 3.74a
    text: |-
      Indien op 1 april 2002 door middel van een systeem van onderbemaling werd gerecirculeerd, en:

      a. recirculatie plaatsvindt door middel van een drainagestelsel met verzamelput en afvoer naar een centrale opvang
      waarin het drainwater wordt verwerkt;

      b. een drainagekoker gelegen is op een diepte van ten hoogste 0,25 m boven de gemiddelde grondwaterstand en ten
      hoogste 1,25 m onder het maaiveld;

      c. ten hoogste 10% van de totale hoeveelheid drainwater naar de bodem sijpelt;

      d. door een door het bevoegd gezag geaccepteerde deskundige is beoordeeld of aan de in de onderdelen a tot en
      met c genoemde criteria wordt voldaan en een bewijs van de beoordeling, afgegeven door of namens degene die de
      beoordeling heeft uitgevoerd, binnen de inrichting wordt bewaard:

      wordt het lozen van drainwater in de bodem aangemerkt als het lozen van drainwater waarvoor een maatwerkvoorschrift
      als bedoeld in [artikel 2.2, derde lid][ref1], is vastgesteld.


