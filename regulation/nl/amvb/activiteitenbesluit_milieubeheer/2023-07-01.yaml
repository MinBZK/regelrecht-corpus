  - number: 5.28a
    text: |-
      1 Voor de toepassing van dit artikel wordt onder «netto elektrisch rendement» verstaan: de aan het landelijk
      hoogspanningsnet, bedoeld in [artikel 1, eerste lid, onder j, van de Elektriciteitswet 1998][ref1], geleverde
      elektriciteit gedeeld door de energie-inhoud van de ingezette brandstoffen.

      2 In het geval van levering aan een warmtenet als bedoeld in [artikel 1, onder c, van de Warmtewet][ref2], wordt
      het netto elektrisch rendement, bedoeld in het eerste lid, wat betreft:

      a. de energie-inhoud van de ingezette brandstoffen gecorrigeerd voor de energie-inhoud van de brandstoffen die
      worden gebruikt in verband met de warmteproductie, of

      b. de netto elektriciteitslevering berekend door de aan het landelijk hoogspanningsnet geleverde elektriciteit te
      verhogen met de elektriciteitsderving als gevolg van de warmtelevering.

      3 Het netto elektrisch rendement van een afvalmeeverbrandingsinstallatie met een totaal nominaal thermisch
      ingangsvermogen van 300 MW of meer die met steenkool of een combinatie van steenkool en een of meer andere
      brandstoffen wordt gestookt en die niet bestemd is voor het drogen of behandelen van voorwerpen of materialen door
      middel van rechtstreeks contact met verbrandingsgas is ten minste 40,00%.

      4 Het netto elektrisch rendement wordt bepaald over de laatste vijf jaar dat de stookinstallatie in bedrijf is
      geweest of, indien de afvalmeeverbrandingsinstallatie, bedoeld in het derde lid, minder dan vijf jaar in bedrijf
      is, over de periode dat de installatie elektriciteit heeft geleverd aan het landelijk hoogspanningsnet met een
      minimum van een jaar.

      5 Op verzoek van het bevoegd gezag overlegt degene die de inrichting drijft de gegevens over het netto elektrisch
      rendement van de afvalmeeverbrandingsinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel1
