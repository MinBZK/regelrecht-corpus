  - number: 3.10c
    text: |-
      1 Bij gelijktijdig gebruik van verschillende soorten brandstof in een stookinstallatie geldt als emissiegrenswaarde
      voor stikstofoxiden (NO), zwaveldioxide (SO) en totaal stof, het gewogen gemiddelde van de emissiegrenswaarden die
