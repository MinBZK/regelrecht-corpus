  - number: 3.26c
    text: >-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van:


      a. het demonteren van autowrakken of wrakken van tweewielige motorvoertuigen,


      b. het voor demontage aanwezig hebben van autowrakken of wrakken van tweewielige motorvoertuigen die vloeistoffen
      bevatten, of


      c. het opslaan van vloeistof bevattende onderdelen van autowrakken of wrakken van tweewielige motorvoertuigen,


      wordt ten minste voldaan aan het tweede tot en met vierde lid.


      2 Het afvalwater bevat in enig steekmonster niet meer dan:


      a. 20 milligram olie per liter;


      b. 300 milligram onopgeloste stoffen per liter.


      3 In afwijking van het tweede lid bedraagt het gehalte aan olie ten hoogste 200 milligram per liter in enig
      steekmonster, indien het afvalwater voorafgaand aan vermenging met ander afvalwater wordt geleid door een
      slibvangput en olieafscheider die:


      a. voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2, of


      b. zijn geplaatst voor het van toepassing worden van dit besluit of een deel daarvan op een activiteit in de
      inrichting en op de hoeveelheid afvalwater zijn afgestemd.


      4 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26c
  - number: 3.26d
    text: Deze paragraaf is van toepassing op een parkeergarage met meer dan 20 parkeerplaatsen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26d
  - number: 3.26e
    text: >-
      1 Bij een mechanische ventilatie in een parkeergarage met meer dan 20 parkeerplaatsen wordt ten behoeve van:


      a. het doelmatig verspreiden van emissies;


      b. het voorkomen dan wel beperken van geurhinder, of


      c. het voorkomen dan wel beperken van luchtverontreiniging door benzeen,


      voldaan aan de bij ministeriële regeling gestelde eisen.


      2 Het bevoegd gezag kan bij maatwerkvoorschrift eisen stellen ten aanzien van:


      a. de beperking van de emissie van benzeen uit een parkeergarage indien dit nodig is in het belang van de
      luchtkwaliteit, of


      b. de aanzuigopeningen en uitblaasopeningen van de mechanische ventilatie van een parkeergarage en de uitvoering en
      het onderhoud van de ventilatoren indien dit nodig is in het belang van de luchtkwaliteit dan wel indien dit nodig
      is om de geurhinder te voorkomen dan wel voor zover dat niet mogelijk is te beperken.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26e
  - number: 3.26g
    text: Deze paragraaf is van toepassing op een jachthaven met meer dan 50 ligplaatsen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26g
  - number: 3.26h
    text: >-
      1 Bij het in het vuilwaterriool lozen van ingenomen bilgewater van pleziervaartuigen wordt ten minste voldaan aan
      het tweede tot en met het vierde lid.


      2 Het afvalwater bevat in enig steekmonster niet meer dan:


      a. 20 milligram olie per liter;


      b. 300 milligram onopgeloste stoffen per liter.


      3 In afwijking van het tweede lid bedraagt het gehalte aan olie ten hoogste 200 milligram per liter in enig
      steekmonster, indien het afvalwater voorafgaand aan vermenging met ander afvalwater wordt geleid door een
      slibvangput en olieafscheider die:


      a. voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2, of


      b. zijn geplaatst voor het van toepassing worden van dit besluit of een deel daarvan op een activiteit in de
      inrichting en op de hoeveelheid afvalwater zijn afgestemd.


      4 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26h
  - number: 3.26i
    text: |-
      1 In het belang van het doelmatig beheer van afvalstoffen worden in een jachthaven van gebruikers van de jachthaven
      in ieder geval de afvalstoffen, genoemd onder a tot en met d, ingenomen.

      a. Indien een jachthaven beschikt over meer dan 50 ligplaatsen en binnen de jachthaven het afleveren van vloeibare
      brandstoffen aan vaartuigen plaatsvindt, neemt de jachthaven in:

      1°. afgewerkte olie en smeervet van onderhoud aan pleziervaartuigen, en

      2°. olie- en vethoudend afval van onderhoud aan pleziervaartuigen.

      b. Indien een jachthaven beschikt over meer dan 50 ligplaatsen en binnen de jachthaven het niet beroepsmatig
      onderhouden of repareren van pleziervaartuigen plaatsvindt, wordt in de jachthaven tevens ingenomen:

      1°. afgewerkte olie en smeervet van onderhoud aan pleziervaartuigen;

      2°. olie- en vethoudend afval van onderhoud aan pleziervaartuigen, en

      3°. afvalstoffen van reparatie- en onderhoudswerkzaamheden aan pleziervaartuigen, die niet beroepsmatig binnen de
      jachthaven worden uitgevoerd.

      c. Indien een jachthaven beschikt over meer dan 50 ligplaatsen, daaronder niet begrepen ligplaatsen uitsluitend
      bestemd voor pleziervaartuigen die geen binnenboordmotor hebben, wordt in de jachthaven tevens bilgewater
      ingenomen.

      d. Indien een jachthaven beschikt over meer dan 50 ligplaatsen, daaronder niet begrepen ligplaatsen uitsluitend
      bestemd voor pleziervaartuigen zonder een vaste afsluitbare verblijfsruimte, wordt in de jachthaven tevens
      huishoudelijk afvalwater en de inhoud van chemische toiletten ingenomen.

      2 Indien twee of meer jachthavens in elkaars onmiddellijke nabijheid zijn gelegen, wordt voldaan aan het eerste lid
      indien de voorzieningen gemeenschappelijk worden aangebracht en beheerd en daartoe een overeenkomst is gesloten. De
      overeenkomst wordt ter goedkeuring voorgelegd aan het bevoegd gezag.

      3 Indien een jachthaven in de onmiddellijke nabijheid is gelegen van een inrichting waarbinnen uitvoering wordt
      gegeven aan [titel 10.4 van de wet][ref1], wordt voldaan aan het eerste lid indien de voorzieningen van die
      inrichting voldoen aan het eerste lid en gemeenschappelijk worden gebruikt op grond van een overeenkomst tussen de
      jachthaven en de inrichting. De overeenkomst wordt ter goedkeuring voorgelegd aan het bevoegd gezag.

      4 Voor de inzameling, bedoeld in het eerste lid, wordt geen aparte financiële vergoeding gevraagd aan de gebruikers
      van de inrichting.

      5 Indien een jachthaven niet op grond van het eerste lid behoeft te beschikken over een voorziening voor de
      inzameling van een bepaalde categorie afvalstoffen, wordt binnen de jachthaven duidelijk aangegeven waar de
      gebruikers van de jachthaven hun afvalstoffen kunnen afgeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26i
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 3.26j
    text: |-
      1 In afwijking van [artikel 3.26i, eerste lid][ref1], worden de afvalstoffen, genoemd in dat lid, in een jachthaven
      die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen ingenomen ongeacht het aantal ligplaatsen in die
      inrichting.

      2 Degene die een jachthaven drijft die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen, maakt bij de
      inning van het havengeld kenbaar welk aandeel daarvan bestemd is voor het instandhouden van de voorzieningen voor
      het in ontvangst nemen en verder beheren van afvalstoffen.

      3 Degene die een jachthaven drijft die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen, stelt, na
      overleg met betrokken partijen, eens in de vijf jaar een havenafvalplan op voor de ontvangst en verwerking van
      afvalstoffen. Binnen veertien dagen na vaststelling van het havenafvalplan wordt het ter goedkeuring voorgelegd aan
      het bevoegd gezag.

      4 Bij aanzienlijke veranderingen in de exploitatie van de jachthaven, stelt degene die de jachthaven drijft zo
      spoedig mogelijk een geactualiseerd havenafvalplan vast. Binnen veertien dagen na vaststelling van dit plan wordt
      het ter goedkeuring voorgelegd aan het bevoegd gezag.

      5 Als geen aanzienlijke veranderingen zich voordoen, kan degene die de jachthaven drijft na evaluatie van het
      havenafvalplan besluiten om het bevoegd gezag te verzoeken de geldigheidsduur van het havenafvalplan te verlengen
      met een opeenvolgende periode van niet meer dan vijf jaar.

      6 Degene die een jachthaven drijft kan het bevoegd gezag vragen ontheffing te verlenen van de verplichting om een
      havenafvalplan op te stellen, indien aan de volgende voorwaarden wordt voldaan:

      a. de jachthaven wordt uitsluitend aangedaan door pleziervaartuigen en wordt gekenmerkt door schaars of weinig
      verkeer;

      b. de havenontvangstvoorzieningen zijn geïntegreerd in het afvalverwerkingssysteem dat ter uitvoering van
      [titel 10.4 van de wet][ref2] wordt beheerd; en

      c. de informatie over het afvalbeheersysteem wordt beschikbaar gesteld aan de gebruikers van de haven.

      7 Onze Minister van Infrastructuur en Waterstaat wordt geïnformeerd als een ontheffing op grond van het zesde lid
      wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26i
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26j
