  - number: 1.3b
    text: |-
      [Hoofdstuk 6 van de Waterwet][ref1] is mede van toepassing op handelingen waaromtrent regels zijn opgesteld bij of
      krachtens de [Wet gewasbeschermingsmiddelen en biociden][ref2], voor zover die handelingen plaatsvinden:

      a. bij het verrichten van agrarische activiteiten of activiteiten die daarmee verband houden;

      b. bij het lozen van koelwater.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel1.3b
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0021670
  - number: 1.3c
    text: |-
      Een bedrijfswoning, behorend tot of voorheen behorend tot een inrichting waar uitsluitend of in hoofdzaak
      agrarische activiteiten dan wel activiteiten die daarmee verband houden worden verricht, die op grond van het
      bestemmingsplan, de beheersverordening of, indien met toepassing van [artikel 2.12, eerste lid, van de Wabo][ref1]
      van het bestemmingsplan of de beheersverordening is afgeweken, de omgevingsvergunning door een derde bewoond mag
      worden, wordt met betrekking tot die inrichting voor de toepassing van het bij of krachtens dit besluit bepaalde
      beschouwd als onderdeel van die inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel1.3c
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.12'
  - number: '1.4'
    text: |-
      Een ieder die loost vanuit een inrichting type A, een inrichting type B of een inrichting type C, voldoet voor
      lozen als bedoeld in [artikel 6.1 van de Waterwet][ref1], aan de bij of krachtens dit besluit gestelde regels, met
      uitzondering van [afdeling 1.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel1.4
