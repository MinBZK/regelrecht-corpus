  - number: '5.26'
    text: |-
      1 Een afvalverbrandings- of afvalmeeverbrandingsinstallatie mag de bij of krachtens dit besluit gestelde
      emissiegrenswaarden voor emissies in de lucht slechts overschrijden indien deze overschrijdingen het gevolg zijn
      van technisch onvermijdelijke storingen of stilleggingen van de afgasreinigingsapparatuur of meetapparatuur of
      defecten aan de afgasreinigingsapparatuur of meetapparatuur.

      2 Een afvalverbrandings- of afvalmeeverbrandingsinstallatie mag ingeval er sprake is van overschrijding van de
      bij of krachtens dit besluit gestelde emissiegrenswaarden voor emissies in de lucht in geen geval langer dan
      vier uur ononderbroken met de thermische behandeling van afvalstoffen voortgaan. De totale duur dat ovens van
      een verbrandingsinstallatie welke verbonden zijn met dezelfde afgasreinigingsinstallatie per kalenderjaar in
      werking mogen zijn, bedraagt ingeval er sprake is van overschrijding van de bij of krachtens dit besluit gestelde
      emissiegrenswaarden en:

      a. er sprake is van thermische behandeling van afvalstoffen: ten hoogste 60 uur;

      b. er geen sprake is van thermische behandeling van afvalstoffen: ten hoogste 120 uur verminderd met het aantal
      uren in het betreffende jaar dat de verbrandingsstraten onder de in de aanhef en onder a bedoelde omstandigheid in
      werking zijn.

      3 De [artikelen 5.19 tot en met 5.24][ref1] zijn, met uitzondering van de bij of krachtens deze artikelen gestelde
      emissiegrenswaarden voor koolmonoxide en gasvormige en vluchtige organische stoffen, gedurende de periode dat een
      omstandigheid als bedoeld in het tweede lid zich voordoet, niet van toepassing, met dien verstande dat de emissies
      van totaal stof een halfuurgemiddelde van 150 mg/Nm3 niet overschrijden.

      4 In geval van een defect van de afgasreinigingsinstallatie vermindert degene die de inrichting drijft de
      activiteit van de afvalverbrandings- of afvalmeeverbrandingsinstallatie zo spoedig mogelijk of legt hij deze stil
      totdat normale werking opnieuw mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.19
