    text: |-
      1 Tot 1 januari 2021 geldt [artikel 3.78a][ref1], niet voor de teelt van in opwaartse of zijwaartse richting te
      bespuiten boomkwekerijgewassen.

      2 Tot 1 januari 2021 geldt [artikel 3.80, derde lid][ref2], niet voor de teelt van appelen, peren en overige pit-
      en steenvruchten waarbij een teeltvrije zone van 3 meter wordt gehanteerd, en:

      a. langs het oppervlaktewater een vanggewas is geplaatst dat voldoet aan ministeriële eisen;

      b. of, gebruik wordt gemaakt van een tunnelspuit.


