  - number: 4.74q
    text: Deze paragraaf is van toepassing op het breken van steenachtig materiaal.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.74q
  - number: 4.74r
    text: >-
      Bij het in de buitenlucht breken van steenachtig materiaal wordt:


      a. zoveel mogelijk voorkomen dat stofverspreiding optreedt die op een afstand van meer dan 2 meter van de bron met
      het blote oog waarneembaar is;


      b. verontreiniging van de omgeving zoveel mogelijk beperkt;


      c. zoveel mogelijk voorkomen dat steenachtig materiaal in een oppervlaktewaterlichaam geraakt, en


      d. zoveel mogelijk voorkomen dat steenachtig materiaal in een voorziening voor het beheer van afvalwater geraakt.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.74r
  - number: 4.74s
    text: |-
      1 Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het inpandig breken
      van steenachtig materiaal de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur, en

      b. 50 milligram per normaal kubieke meter, indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.

      2 Bij het inpandig breken van steenachtig materiaal wordt ten behoeve van het voorkomen dan wel voor zover dat
      niet mogelijk is het beperken van diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht,
      voldaan aan de bij ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.74s
