  - number: '4.53'
    text: >-
      1 Het is verboden om in de buitenlucht metalen met behulp van een nevelspuit te coaten of te lijmen dan wel met
      behulp van een nevelspuit te reinigen met vluchtige organische stoffen houdende producten.


      2 Het eerste lid is niet van toepassing indien het niet mogelijk is om deze activiteiten in het inpandige deel van
      de inrichting te verrichten vanwege de omvang van het te bewerken object.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.53
  - number: '4.54'
    text: |-
      1 Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het aanbrengen van
      coating of lijmlagen de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur; en

      b. 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.

      2 Het eerste lid is niet van toepassing indien het coaten op grond van [artikel 4.53, tweede lid][ref3], in de
      buitenlucht plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel4.53
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.54
