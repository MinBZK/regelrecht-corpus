  - number: '4.35'
    text: |-
      1 Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het snijden van
      koper:

      a. de emissieconcentratie van koperverbindingen berekend als koper, niet meer dan 5 milligram per normaal kubieke
      meter indien de massastroom van koperverbindingen naar de lucht berekend als koper, meer bedraagt dan 10 gram per
      uur;

      b. de emissieconcentratie van koperrook berekend als koper, niet meer dan 0,5 milligram per normaal kubieke meter
      indien de massastroom van koperrook naar de lucht berekend als koper, meer bedraagt dan 2,5 gram per uur.

      2 Het eerste lid is niet van toepassing indien de werkzaamheden op grond van [artikel 4.32, tweede lid][ref3], in
      de buitenlucht worden verricht.


