      1 In afwijking van [artikel 5.41, eerste lid][ref1], geldt voor een bestaande installatie waarvoor
      onmiddellijk voorafgaand aan de inwerkingtreding van deze paragraaf een vergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] in werking en
      onherroepelijk was waarin een lagere omzettingsgraad is vastgelegd dan genoemd in artikel 5.41, eerste lid, de in
      die vergunning voorgeschreven omzettingsgraad.

      2 Indien de verwerkingscapaciteit van de totale inrichting met meer dan 50% wordt verhoogd, geldt voor de
      verwerking van het totale HS -aanbod, met inbegrip van een bestaande installatie als bedoeld in het eerste lid, een
      omzettingsgraad van ten minste 99,8% als maandgemiddelde.


