  - number: '4.24'
    text: |-
      1 Degene die de inrichting drijft neemt bij het reinigen, coaten of lijmen van hout of kurk dan wel van houten,
      kurken of houtachtige voorwerpen de bij ministeriële regeling gestelde emissiereducerende maatregelen met
      betrekking tot vluchtige organische stoffen tenzij deze niet kosteneffectief of technisch uitvoerbaar zijn.

      2 Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de in het
      eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar.

      3 Het eerste lid is niet van toepassing op het verbruik van vluchtige organische stoffen waarvan het in de handel
      brengen is gereguleerd door het [Besluit organische oplosmiddelen in verven en vernissen milieubeheer][ref1].

      4 Indien de drempelwaarden, genoemd in tabel 2.28a worden overschreden, zijn het eerste tot en met derde lid niet
      van toepassing en is [afdeling 2.11][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019122
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.24
