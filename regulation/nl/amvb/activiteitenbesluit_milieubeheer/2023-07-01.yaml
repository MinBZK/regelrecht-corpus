  - number: 4.74la
    text: |-
      In afwijking van [artikel 6.1, eerste lid][ref1], worden voor inrichtingen als bedoeld in
      categorie 11.3, onderdeel c, onder 2°, van [bijlage I, bij het Besluit omgevingsrecht][ref2]
