  - number: 4.74.1
    text: >-
      Deze paragraaf is van toepassing op:


      a. het smelten en gieten van metalen met uitzondering van goud, zilver, platina en legeringen met ten minste 30%
      van deze metalen tot ten hoogste 500 kilo per jaar;


      b. het maken en coaten van vormen en kernen in kleigebonden of chemisch gebonden zand ten behoeve van het gieten
      van metalen;


      c. het maken van croning- en coldbox-kernen ten behoeve van het gieten van metalen;


      d. het uitbreken en ontzanden van gietstukken;


      e. de koude regeneratie van zand ten behoeve van het gieten van metalen;


      f. het maken van de vorm met behulp van was, inclusief het verwijderen van de was, waaronder keramische vormen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.74.1
  - number: 4.74.2
    text: |-
      1 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van emissies
      van dioxines en polycyclische aromatische koolwaterstoffen naar lucht worden bij het smelten van metalen alleen
      metalen gesmolten die voldoen aan de bij ministeriële regeling gestelde eisen.

      2 Onverminderd de [artikel 2.5, eerste, vierde en zesde lid][ref1], en [2.6][ref2] is bij het smelten van metalen
      de emissieconcentratie van lood naar de lucht ten hoogste 0,5 milligram per normaal kubieke meter, indien de
      massastroom van lood naar de lucht gelijk is aan of groter is dan 2,5 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.74.2
