  - number: 2.19a
    text: |-
      1 Tot de inwerkingtreding van artikel 2.19 zijn het tweede tot en met vierde lid van toepassing.

      2 [Artikel 2.17][ref1] is niet van toepassing op inrichtingen die zijn gelegen in een concentratiegebied voor
      horeca-inrichtingen of in een concentratiegebied voor detailhandel en ambachtsbedrijven, dat bij of krachtens een
      verordening als zodanig is aangewezen.

      3 In een gebied als bedoeld in het tweede lid bedraagt het langtijdgemiddeld beoordelingsniveau, veroorzaakt door
      de in de inrichting aanwezige installaties en toestellen, alsmede door de in de inrichting verrichte werkzaamheden
      en activiteiten, in ieder geval niet meer:

      a. dan de in [artikel 2.17][ref2] bedoelde waarden op de gevel of, als dat hoger is, het in dat gebied heersende
      referentieniveau;

      b. dan de in tabel 2.19a aangegeven waarden binnen gevoelige gebouwen.


