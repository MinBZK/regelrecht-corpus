  - number: '5.23'
    text: |-
      1 Indien in tabel 5.20 in plaats van een concrete emissiegrenswaarde de aanduiding «mengregel» is opgenomen, wordt
      voor de bepaling van de emissiegrenswaarde de volgende formule gebruikt:

      (V x C + V x C)/(V + V) = C

      V: volume van het afgas ten gevolge van uitsluitend de verbranding van afvalstoffen, bepaald op basis van de
      in de omgevingsvergunning gespecificeerde afvalstof of categorie van afvalstoffen met de laagste gemiddelde
      netto calorische waarde en herleid tot de emissieconcentratie bij een genormaliseerd zuurstofgehalte
      overeenkomstig de bij ministeriële regeling bepaalde formule, temperatuur druk en droog gas. Indien de warmte
      die vrijkomt bij de verbranding van gevaarlijke afvalstoffen minder dan 10 procent bedraagt van de totale in de
      afvalmeeverbrandingsinstallatie vrijkomende warmte, wordt V berekend op basis van een hoeveelheid afvalstoffen die
      bij verbranding, bij de totale hoeveelheid vrijkomende warmte, 10 procent van de vrijkomende warmte zou opleveren.

      C: in tabel 5.19 aangegeven emissiegrenswaarde voor de desbetreffende stof. Indien er in tabel 5.19 voor een stof
      meerdere emissiegrenswaarden zijn opgenomen, heeft C betrekking op de daggemiddelde emissiegrenswaarde. De C-
      emissiegrenswaarde wordt omgerekend naar het zuurstofgehalte van de meeverbrandingsinstallatie.

      V: volume van het afgas ten gevolge van het in de verbrandingsinstallatie plaatshebbende proces van de verbranding
      van niet als afvalstoffen aan te merken brandstoffen, bepaald bij een zuurstofgehalte dat bij ministeriële
      regeling is vastgesteld. Indien geen voorschriften gelden met betrekking tot het volume van het afgas van
      de afvalmeeverbrandingsinstallatie, wordt het werkelijke zuurstofgehalte in het afgas zonder verdunning door
      toevoeging van voor het verbrandingsproces onnodige lucht gebruikt.

      C: emissiegrenswaarde die voor de desbetreffende stof zou gelden op grond van [paragraaf 5.1.1][ref1] voor
      grote stookinstallaties of op grond van [paragraaf 3.2.1.][ref2] voor het in werking hebben van andere dan
      grote stookinstallaties, wanneer in het desbetreffende type installatie andere brandstoffen dan afvalstoffen
      zouden worden gestookt. Bij het ontbreken van zodanige regelgeving wordt de in de omgevingsvergunning vermelde
      emissiegrenswaarde gebruikt. Indien in de omgevingsvergunning geen emissiegrenswaarde is gesteld, wordt de
      werkelijke massaconcentratie gebruikt.

      C: totale emissiegrenswaarde, bepaald bij een bij ministeriële regeling vastgesteld zuurstofgehalte.

      2 Voor de toepassing van het eerste lid wordt onder gemiddelde netto calorische waarde verstaan: op de onderste
      verbrandingswaarde betrokken hoeveelheid energie die bij de verbranding van een bepaalde hoeveelheid brandstof
      vrijkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
