  - number: '3.82'
    text: >-
      Op braakliggend land worden binnen een afstand van 50 centimeter vanaf de insteek van een oppervlaktewaterlichaam
      geen gewasbeschermingsmiddelen gebruikt.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.82
  - number: '3.83'
    text: >-
      1 Het gebruik van veldspuitapparatuur is verboden, tenzij:


      a. de buitenste in gebruik zijnde spuitdop aan de zijde van het oppervlaktewaterlichaam een kantdop is die
      aan de zijde van het oppervlaktewaterlichaam een verticale of nagenoeg verticale neerwaartse richting van de
      spuitvloeistof bewerkstelligt, en


      b. de apparatuur zodanig is ingesteld dat de spuitdoppen zich niet hoger dan 50 cm boven het gewas bevinden.


      2 Bij het gebruik van veldspuitapparatuur wordt de spuitdruk geregistreerd door een drukregistratievoorziening.


      3 Bij het op- en zijwaarts spuiten van appelen, peren en overige pit- en steenvruchten met een axiaal- of
      dwarsstroomspuit, waarbij spuitdoppen worden gebruikt die uitsluitend zijn aangewezen voor het gebruik bij een
      spuitdruk lager dan 5 bar, wordt de spuitdruk geregistreerd door een drukregistratievoorziening.


      4 Een drukregistratievoorziening als bedoeld in het tweede en derde lid, voldoet aan de bij ministeriële regeling
      gestelde eisen.


      5 Het gebruik van gewasbeschermingsmiddelen is verboden bij een windsnelheid groter dan 5 meter per seconde,
      gemeten op:


      a. twee meter boven het grondoppervlak bij neerwaartse bespuiting;


      b. of, een meter boven de gemiddelde boomhoogte bij op- of zijwaartse bespuiting;


      tenzij degene die de gewasbeschermingsmiddelen gebruikt, kan aantonen dat redelijkerwijs niet anders dan door het
      gebruik van die middelen bij een windsnelheid groter dan 5 meter per seconde een teeltbedreigende situatie kan
      worden afgewend.


      6 Het gebruik van een spuitgeweer dat is voorzien van een werveldop of dat gebruik maakt van een werkdruk van 5 bar
      of meer is verboden.


      7 Het eerste tot en met vijfde lid is niet van toepassing op het gebruik van gewasbeschermingsmiddelen met een
      overkapte beddenspuit.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.83
  - number: '3.84'
    text: |-
      Bij het op andere wijze dan door middel van een werk lozen van meststoffen in een oppervlaktewaterlichaam als
      gevolg van het gebruik van meststoffen bij het telen van gewassen in de open lucht, wordt ten minste voldaan aan
      [artikel 3.85][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.85
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.84
    references:
      - id: ref1
