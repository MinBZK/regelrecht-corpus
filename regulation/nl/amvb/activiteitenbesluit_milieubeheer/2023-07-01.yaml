  - number: '3.73'
    text: |-
      1 Jaarlijks voor 1 mei wordt aan het bevoegd gezag een rapportage met de volgende gegevens overgelegd:

      a. de gegevens, bedoeld in [artikel 3.72, eerste lid, onderdelen c, d en g, en tweede lid][ref1], over het aan die
      datum voorafgaande kalenderjaar;

      b. de berekende hoeveelheid toegediende totaal stikstof en totaal fosfor per vierkante meter over
      het aan die datum voorafgaande kalenderjaar, uitgaande van de gegevens, geregistreerd op grond van
      [artikel 3.72, eerste lid, onderdelen f en g][ref2].

      c. de berekende hoeveelheid totaal stikstof en totaal fosfor in het drainagewater die over het aan die
      datum voorafgaande kalenderjaar is geloosd, uitgaande van de gegevens die zijn geregistreerd op grond van
      [artikel 3.72, eerste lid, onderdelen c, d en g][ref3].

      2 Bij ministeriële regeling worden nadere regels gesteld over de rapportage.

      3 Op een daartoe strekkend verzoek van het bevoegd gezag wordt een verantwoording over de hoeveelheid toegediende
      meststoffen en water, bedoeld in [artikel 3.71, vierde lid][ref4], overgelegd.

      4 Het bevoegd gezag kan het met oog op de verantwoording, bedoeld in het derde lid, bij maatwerkvoorschrift
      aanvullende onderzoeksverplichtingen opleggen ter verantwoording van het meststoffen- en watergebruik.


