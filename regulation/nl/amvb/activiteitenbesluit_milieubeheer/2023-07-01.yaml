        artikel: '6.1'
      - id: ref2
        bwb_id: BWBR0022762
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.4a
    text: >-
      Degene die anders dan vanuit een inrichting loost ten gevolge van agrarische activiteiten dan wel activiteiten die
      daarmee verband houden, voldoet aan de voor dat lozen bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel1.4a
  - number: 1.4b
    text: >-
      Degene die nabij een oppervlaktewaterlichaam voor agrarische activiteiten dan wel activiteiten die daarmee verband
      houden gewasbeschermingsmiddelen en biociden gebruikt, voldoet aan de bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel1.4b
  - number: '1.5'
    text: |-
      De bij of krachtens de [artikelen 3.78 tot en met 3.83][ref1] gestelde regels zijn niet van toepassing op het
      gebruik van gewasbeschermingsmiddelen, indien op grond van of krachtens [artikel 3 van de Plantenziektenwet][ref2]
      aan dat gebruik regels zijn gesteld en voor zover die regels niet verenigbaar zijn met de bij of krachtens dit
      besluit gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.78
      [ref2]: https://wetten.overheid.nl/BWBR0002075#Artikel3
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel1.5
