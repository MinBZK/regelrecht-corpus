  - number: '6.4'
    text: |-
      1 Degene die een inrichting type B of C drijft die is opgericht voor het van toepassing worden van dit besluit of
      een deel daarvan op een activiteit in die inrichting en waarvoor onmiddellijk voorafgaand aan het tijdstip van het
      van toepassing worden van dit besluit of een deel daarvan op een activiteit in die inrichting geen vergunning als
      bedoeld in [artikel 6.1, eerste lid][ref1], in werking en onherroepelijk was en geen melding was gedaan op grond
      van een van de in [artikel 6.43][ref2] genoemde besluiten, meldt aan het bevoegd gezag dat hij de inrichting in
      werking heeft.

      2 Degene die de inrichting drijft doet de melding, bedoeld in het eerste lid, binnen vier weken na het
      tijdstip van het van toepassing worden van dit besluit of een deel daarvan op een activiteit in die inrichting.
      [Afdeling 1.2][ref3] is van overeenkomstige toepassing.

      3 Indien op het tijdstip van het van toepassing worden van dit besluit of een deel daarvan op een activiteit in een
      inrichting type B ten aanzien van die inrichting nog niet is beslist op een aanvraag om een omgevingsvergunning op
      grond van [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref4] voor
      een inrichting, zijn het eerste en tweede lid niet van toepassing en wordt de aanvraag om een vergunning aangemerkt
      als een melding overeenkomstig [artikel 1.10][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref5]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel6.4
