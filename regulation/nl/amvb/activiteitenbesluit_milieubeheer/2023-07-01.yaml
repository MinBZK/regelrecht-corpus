  - number: '3.7'
    text: |-
      1 Deze paragraaf is niet van toepassing op:

      a. het stoken van brandstoffen in stookinstallaties die ingevolge
      [bijlage I, onderdeel C, categorie 1.4, onder a, van het Besluit omgevingsrecht][ref1] er toe leiden, dat een
      inrichting vergunningplichtig is;

      b. stookinstallaties waarop [paragraaf 5.1.1][ref2] van toepassing is;

      c. stookinstallaties waarop [paragraaf 5.1.2][ref3] van toepassing is;

      d. stookinstallaties waarop [Richtlijn 97/68/EG](31997L0068) betrekking heeft en andere mobiele stookinstallaties;

      e. technische voorzieningen die bij de voortstuwing van een voertuig, schip of vliegtuig worden gebruikt;

      f. in de chemische industrie gebruikte reactoren;

      g. windverhitters van hoogovens;

      h. terugwinningsinstallaties in installaties voor de productie van pulp.

      2 De [artikelen 3.10 tot en met 3.10j][ref4] en [3.10q tot en met 3.10t][ref5] inzake emissies naar de lucht zijn
      van toepassing op het in werking hebben van een stookinstallatie, tenzij het betreft:

      a. een stookinstallatie die blijkens een daarvoor aan de inrichting verleende omgevingsvergunning wordt gebruikt
      voor het onderzoeken, beproeven of demonstreren van experimentele verbrandingstechnieken of van technieken ter
      bestrijding van de uitworp van zwaveldioxide (SO), stikstofoxiden (NO) of totaal stof;

      b. een stookinstallatie die ten hoogste 500 uren per jaar in gebruik is, met uitzondering van dieselmotoren die,
      behoudens de vanuit bedrijfszekerheid noodzakelijke testen, worden gebruikt voor de opwekking van elektriciteit
      terwijl het openbare net beschikbaar is. Voor zover het een installatie betreft met een nominaal thermisch
      ingangsvermogen vanaf 1MW waarin een vaste brandstof wordt gestookt, voldoet deze aan een emissiegrenswaarde
      voor stof van 200 mg/Nm3 indien deze voor 20 december 2018 in gebruik is genomen en voldoet deze aan een
      emissiegrenswaarde voor stof van 100 mg/Nm3 indien deze op of na 20 december 2018 in gebruik is genomen;

      c. technische voorzieningen voor de zuivering van afgassen door verbranding die niet als autonome stookinstallatie
      worden geëxploiteerd;

      d. stookinstallaties waar de gasvormige producten van het stookproces worden gebruikt voor het direct verwarmen,
      drogen of anderzijds behandelen van voorwerpen of materialen;

      e. stookinstallaties waarin de gasvormige producten van het stookproces worden gebruikt voor het direct verwarmen
      met gas van binnenruimten ter verbetering van de omstandigheden op de arbeidsplaats;

      f. crematoria.

      3 De [artikelen 3.10k][ref6], [3.10n][ref7] en [3.10o][ref8] inzake het doelmatig beheer van afvalwater, het
      realiseren van een verwaarloosbaar bodemrisico en het doelmatig beheer van afval, zijn van toepassing op het in
      werking hebben van een stookinstallatie.

      4 De [artikelen 3.10l][ref9] en [3.10m][ref10] inzake een doelmatig gebruik van energie, zijn van toepassing op
      inrichtingen waarin zich geen broeikasgasinstallaties als bedoeld in [artikel 16.1 van de wet][ref11] bevinden
      en waarbij het gelijktijdig produceren van elektrische energie en thermische energie door middel van een
      warmtekrachtinstallatie plaatsvindt, tenzij het een warmtekrachtinstallatie betreft waarin vergistingsgas wordt
      gebruikt.

      5 [Artikel 3.10p][ref12] inzake keuring en onderhoud van een stookinstallatie is van toepassing op het in
      werking hebben van een stookinstallatie, tenzij het betreft een stookinstallatie die blijkens een daarvoor aan
      de inrichting verleende omgevingsvergunning wordt gebruikt voor het onderzoeken, beproeven of demonstreren van
      experimentele verbrandingstechnieken of van technieken ter bestrijding van de uitworp van zwaveldioxide (SO),
      stikstofoxiden (NO) of totaal stof.

      6 Voor de toepassing van deze paragraaf worden twee of meer stookinstallaties met een nominaal thermisch
      ingangsvermogen van 1 MWth of meer als één stookinstallatie aangemerkt en worden de vermogens opgeteld indien:

      a. de afgassen van die stookinstallaties via één schoorsteen worden afgevoerd, of

      b. de afgassen van die stookinstallaties, met inachtneming van technische en economische factoren, volgens het
      oordeel van het bevoegd gezag via een gemeenschappelijke schoorsteen kunnen worden uitgestoten.

      Indien toepassing wordt gegeven aan onderdeel b, stelt het bevoegd gezag in een maatwerkvoorschrift vast welke
      stookinstallaties deel uitmaken van het samenstel van stookinstallaties.

      7 Voor zover stookinstallaties onder de werkingssfeer van deze paragraaf vallen, zijn de [artikelen 2.5][ref13],
      [2.6][ref14], [2.7][ref15] en [2.8, derde tot en met achtste lid][ref16], niet van toepassing.

      8 Onverminderd de emissie-eisen in deze paragraaf kan het bevoegd gezag in het belang van de bescherming van het
      milieu bij maatwerkvoorschrift eisen stellen aan de emissies van een stookinstallatie.


