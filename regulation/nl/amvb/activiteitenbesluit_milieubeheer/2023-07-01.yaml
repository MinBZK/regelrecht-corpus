  - number: 3.10g
    text: >-
      1 Een stookinstallatie waarvan het rookgas vanwege een storing niet voldoet aan de emissiegrenswaarden die op
      grond van deze paragraaf voor die stookinstallatie gelden, wordt zo spoedig mogelijk opgelost en mag ten hoogste
      120 achtereenvolgende uren na het optreden van de storing in gebruik blijven, met een maximum van 120 uur per
      kalenderjaar.


      2 Indien een storing als bedoeld in het eerste lid niet binnen 120 uur op een zodanige wijze is opgeheven dat
      het rookgas van de stookinstallatie weer aan de van toepassing zijnde emissiegrenswaarden voldoet, wordt de
      stookinstallatie door de drijver van de inrichting buiten bedrijf gesteld.


      3 Het tweede lid blijft buiten toepassing indien het een stookinstallatie betreft die zich binnen de Nederlandse
      exclusieve economische zone bevindt, de storing redelijkerwijs niet binnen het in het eerste lid genoemde aantal
      uren kan worden hersteld en deze omstandigheid voor het verstrijken van dat aantal uren schriftelijk en met
      opgave van redenen is gemeld bij het Staatstoezicht op de mijnen. Het Staatstoezicht op de mijnen stelt in dat
      geval een termijn waarbinnen de storing wordt hersteld. De storing wordt zo spoedig mogelijk opgelost. Indien de
      storing niet wordt hersteld binnen de door het Staatstoezicht op de mijnen gestelde termijn, wordt de betreffende
      stookinstallatie alsnog buiten bedrijf gesteld.


      4 Indien een storing samenhangt met de brandstof die in een stookinstallatie wordt verstookt mag gedurende het
      aantal uren, genoemd in het eerste lid, een andere brandstof worden gebruikt en blijven de emissiegrenswaarden, die
      gelden op grond van deze paragraaf, gedurende die uren buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.10g
  - number: 3.10h
    text: >-
      Een stookinstallatie die strekt tot vervanging voor ten hoogste zes maanden van een stookinstallatie die
      buiten bedrijf is gesteld in verband met onderhoud, reparatie of definitieve vervanging en die is afgekoppeld
      van de brandstoftoevoer of van het stoom- of elektriciteitsnet waaraan zij levert, voldoet ten minste aan de
      emissiegrenswaarden die gelden voor de buiten bedrijf gestelde stookinstallatie.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.10h
  - number: 3.10i
    text: >-
      1 Voor de berekening van de uitworp van rookgas door een stookinstallatie wordt de massaconcentratie van
      stikstofoxiden (NO), zwaveldioxide (SO), totaal stof en onverbrande koolwaterstoffen (CH, uitgedrukt in C) in het
      rookgas herleid op rookgas met een volumegehalte aan zuurstof van:


      a. 15 procent, indien het een dieselmotor, gasmotor of gasturbine betreft;


      b. 6 procent, indien het een stookinstallatie met vaste brandstof betreft;


      c. 3 procent, in alle andere gevallen.


      2 Voor de berekening van de uitworp van rookgas door een stookinstallatie, wordt de massaconcentratie aan
      stikstofoxiden (NO) in het rookgas berekend als massaconcentratie van stikstofdioxide.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.10i
  - number: 3.10j
    text: >-
      1 De concentratie aan stikstofoxiden (NO), zwaveldioxide (SO), totaal stof en onverbrande koolwaterstoffen
      (CH, uitgedrukt in C) in het rookgas dat wordt uitgeworpen door een stookinstallatie waarvoor in deze paragraaf
      emissiegrenswaarden zijn gesteld, wordt door de drijver van de inrichting bepaald door een meting.


      2 In afwijking van het eerste lid behoeft geen meting te worden verricht van zwaveldioxide (SO), indien het in
      acht nemen van de emissiegrenswaarden geschiedt door het stoken van brandstof met een bekend zwavelgehalte en de
      stookinstallatie niet is uitgerust met apparatuur voor het reduceren van de emissie van zwaveldioxide.


      3 De meting, bedoeld in het eerste lid, waaronder tevens begrepen wordt de berekening, registratie en rapportage
      van de meting, voldoet aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.10j
  - number: 3.10k
    text: >-
      1 Het spuien van een stoomketel van een stookinstallatie geschiedt in een geschikte spuitank dan wel in een
      andere geschikte voorziening die ten behoeve van het doelmatig beheer van afvalwater ten minste voldoet aan de bij
      ministeriële regeling gestelde eisen.


      2 Het lozen van spuiwater van een stoomketel of condensaat van rookgassen van een stookinstallatie op of in de
      bodem of in een oppervlaktewaterlichaam is toegestaan, indien niet in een vuilwaterriool kan worden geloosd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.10k
  - number: 3.10l
    text: >-
      1 Van een warmtekrachtinstallatie is het jaargemiddeld rendement ten minste 65%, berekend volgens de formule: de
      som van het energetisch rendement van de opwekking van kracht plus tweederde deel van het energetisch rendement van
      de productie van nuttig aan te wenden warmte.


      2 In afwijking van het eerste lid haalt een warmtekrachtinstallatie die in gebruik is genomen voor 1 januari 2008
      een jaargemiddeld rendement van ten minste 60% berekend volgens de formule, bedoeld in het eerste lid.


      3 De warmtekrachtinstallatie wordt zodanig in bedrijf gehouden dat de hoeveelheid warmte die nuttig gebruikt wordt
      zo hoog mogelijk is en de hoeveelheid warmte die ongebruikt aan de omgeving wordt afgegeven zo klein mogelijk is.
      Onder ongebruikte warmte wordt mede verstaan de warmte die door de noodkoeler wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.10l
  - number: 3.10m
    text: >-
      1 Jaarlijks wordt het brandstofverbruik en de geproduceerde elektriciteit van een warmtekrachtinstallatie
      geregistreerd.


      2 Indien de warmtekrachtinstallatie is aangesloten op een noodkoeler wordt jaarlijks de hoeveelheid nuttig
      toegepaste warmte geregistreerd.


      3 Indien de warmtekrachtinstallatie niet is aangesloten op een noodkoeler wordt het thermisch rendement eenmaal per
      vier jaar vastgesteld.


      4 De registraties, bedoeld in het eerste en tweede lid, worden gedurende vijf kalenderjaren na dagtekening
      bewaard en zijn in de inrichting aanwezig of binnen een termijn die wordt gesteld door het bevoegd gezag voor deze
      beschikbaar.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.10m
  - number: 3.10n
    text: |-
      1 In afwijking van [artikel 2.14a, eerste lid][ref1], is het verbranden van biomassa die tevens afvalstof is, met
      uitzondering van verpakkingshout, toegestaan indien:

      a. het de verbranding in een stookinstallatie met een nominaal thermisch ingangsvermogen van15 MWth of minder
      betreft;

      b. het verbranden van de biomassa materiaalhergebruik niet belemmert, en

      c. de vrijkomende warmte nuttig wordt gebruikt.

      2 In afwijking van [artikel 2.12, tweede en derde lid][ref2], is het toegestaan verschillende categorieën van
      afvalstoffen, zijnde biomassa, te mengen bij de verbranding van biomassa mits wordt voldaan aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.14a
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.12
