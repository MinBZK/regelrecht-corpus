  - number: 3.10e
    text: |-
      1 Het rookgas van een dieselmotor voldoet aan de emissiegrenswaarden, genoemd in tabel 3.10e.

      2 In afwijking van het eerste lid voldoet een installatie van meer dan 5 MWth die voor 20 december 2018 in gebruik
      is genomen tot 1 januari 2025 aan een emissiegrenswaarde voor stof van 20 mg/Nm3.

      3 In afwijking van het eerste lid voldoet een installatie van meer dan 5 MWth en 20 MWth of minder die voor
      20 december 2018 in gebruik is genomen vanaf 1 januari 2025 aan een emissiegrenswaarde voor stof van 20 mg/Nm3.

      4 In afwijking van het eerste lid kan het bevoegd gezag bij maatwerkvoorschrift een hogere emissiegrenswaarde
      voor stikstofoxiden vaststellen voor een dieselmotor met een nominaal thermisch ingangsvermogen van minder dan
      600 kWth gelegen op een platform dat is gelegen binnen de Nederlandse exclusieve economische zone. De afwijkende
      emissiegrenswaarde voor stikstofoxiden bedraagt ten hoogste 930 mg/Nm3.

      5 Degene die een inrichting drijft waartoe een dieselmotor als bedoeld in het vierde lid behoort, legt elke vijf
      jaar ten behoeve van het maatwerkvoorschrift aan het bevoegd gezag een haalbaarheidsstudie over naar vermindering
      van de NOx-emissies door toepassing van emissiebeperkende maatregelen of alternatieve technieken, zoals zonne- en
      windenergie, gasmotoren en -turbines. Van de haalbaarheidsstudie maakt een kosteneffectiviteitsberekening deel uit.

      6 In afwijking van het vijfde lid kan het bevoegd gezag bepalen dat kan worden volstaan met een
      kosteneffectiviteitsberekening indien de resterende levensduur van de installatie daartoe aanleiding geeft.

      7 Bij de beoordeling van de kosteneffectiviteitsberekening gaat het bevoegd gezag uit van een kosteneffectiviteit
      als bedoeld in artikel 2.7, vierde tot en met zesde lid.


