    text: |-
      Bij een melding als bedoeld in [artikel 1.10][ref1] of [artikel 1.10a][ref2] worden indien sprake is van een lozing
      van huishoudelijk afvalwater in een oppervlaktewaterlichaam of op of in de bodem als bedoeld in [artikel 3.4][ref3]
      de volgende gegevens gemeld:

      a. het aantal inwonerequivalenten dat wordt geloosd; en

      b. de wijze van behandeling van het afvalwater.


