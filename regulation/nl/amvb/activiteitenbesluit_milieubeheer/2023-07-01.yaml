  - number: '1.1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      *aangewezen oppervlaktewaterlichaam:* oppervlaktewaterlichaam dat op grond van
      [artikel 1.7, eerste lid, onderdeel b][ref1], is aangewezen;

      *aardgas:* in de natuur voorkomend methaan met maximaal 20 volumeprocent inerte en andere bestanddelen;

      *ADR:* de op 30 september 1957 te Genève totstandgekomen Europese Overeenkomst betreffende het internationale
      vervoer van gevaarlijke stoffen over de weg (Trb. 1959, 171);

      *afgewerkte olie:* afgewerkte olie als bedoeld in [artikel 1 van het Besluit inzamelen afvalstoffen][ref2];

      *afleverinstallatie:* geheel van één of meer afleverzuilen, bestaande uit pompen, leidingen, meet en regelwerken,
      schakelaars en vulpistolen omgeven door een omkasting of daarmee direct in verbinding staand, met daaraan
      gekoppelde leidingen en appendages;

      *afvalmeeverbrandingsinstallatie:* technische eenheid die in hoofdzaak is bestemd voor de opwekking van energie of
      de fabricage van materiële producten en waarin afvalstoffen als normale of aanvullende brandstof worden gebruikt,
      of waarin afvalstoffen thermisch worden behandeld ten behoeve van verwijdering door de verbranding door oxidatie
      van afvalstoffen alsmede andere thermische behandelingsprocessen voor zover de producten van de behandeling
      vervolgens worden verbrand;

      *afvalstoffenlijst:* afvalstoffenlijst als bedoeld in
      [artikel 1, eerste lid, van de Regeling Europese afvalstoffenlijst][ref3];

      *afvalverbrandingsinstallatie:* technische eenheid die specifiek bestemd is voor de thermische behandeling van
      afvalstoffen, waarin al dan niet de opgewekte warmte wordt teruggewonnen, door de verbranding door oxidatie van
      afvalstoffen alsmede andere thermische behandelingsprocessen voor zover de producten van de behandeling vervolgens
      worden verbrand;

      *afvalverbrandingsresiduen:* vloeibare of vaste afvalstoffen die worden geproduceerd door een
      afvalverbrandingsinstallatie of afvalmeeverbrandingsinstallatie;

      *afvangrendement:* hoeveelheid damp van lichte olie die door een EU-systeem voor dampretour fase-II wordt
      afgevangen, vergeleken met de hoeveelheid damp van lichte olie die in de atmosfeer zou zijn uitgestoten zonder een
      dergelijk systeem, uitgedrukt als percentage;

      *agrarische activiteiten:* geheel van activiteiten dat betrekking heeft op gewassen of landbouwhuisdieren voor
      zover deze geteeld of gekweekt onderscheidenlijk gefokt, gemest, gehouden of verhandeld worden, daaronder mede
      begrepen agrarisch gemechaniseerd loonwerk zoals het uitvoeren van cultuurtechnische werken, mestdistributie,
      grondverzet of soortgelijke dienstverlening;

      *agrarische bedrijfsstoffen:* dierlijke meststoffen die niet verpompbaar zijn, kuilvoer, bijvoedermiddelen die niet
      verpompbaar zijn, gebruikt substraatmateriaal van plantaardige oorsprong en restmateriaal afkomstig van de teelt
      van gewassen, voor zover geen sprake is van inerte goederen;

      *ammoniakemissie:* emissie van ammoniak, uitgedrukt in kilogram NH per jaar;

      *assimilatiebelichting:* kunstmatige belichting van gewassen, gericht op de bevordering van het groeiproces van
      gewassen;

      *autodemontagebedrijf:* inrichting voor het demonteren van autowrakken;

      *autowrak:*

      1°. bedrijfsauto als bedoeld in de regeling op grond van
      [artikel 21, eerste lid, van de Wegenverkeerswet 1994][ref4], met een gewicht van ten hoogste 3500 kilogram,

      2°. personenauto als bedoeld in de regeling op grond van
      [artikel 21, eerste lid, van de Wegenverkeerswet 1994][ref5], en

      3°. bromfiets als bedoeld in de regeling op grond van [artikel 21, eerste lid, van de Wegenverkeerswet 1994][ref6],
      niet zijnde een voertuig op twee wielen,

      die een afvalstof is in de zin van [artikel 1.1, eerste lid, van de wet][ref7];

      *autowrakkenrichtlijn:* richtlijn nr. 2000/53/EG van het Europees Parlement en de Raad van de Europese Unie van
      18 september 2000 betreffende autowrakken (PbEG L 269);

      *axiaalspuit:* apparatuur voor het gebruik van gewasbeschermingsmiddelen in opgaande gewasrijen, waarbij de
      spuitvloeistof, met luchtondersteuning horizontaal en schuin omhoog verspoten wordt;

      *B:* geluidbelastingindicator inzake schietgeluid voor de dag, avond en nachtperiode, berekend overeenkomstig de
      berekeningsmethodiek inzake schietgeluid;

      *bedrijfsduurcorrectie:* correctie als bedoeld in de Handleiding meten en rekenen industrielawaai, zijnde de
      logaritmische verhouding tussen de tijdsduur dat de geluidsbron gedurende de beoordelingstijd in werking is, en de
      duur van die beoordelingsperiode;

      *bedrijventerrein:* cluster aaneengesloten percelen met overwegend bedrijfsbestemmingen, binnen een in een
      bestemmingsplan als bedrijventerrein aangewezen gebied, daaronder niet begrepen een gezoneerd industrieterrein;

      *beheerder:* beheerder als bedoeld in [artikel 1.1 van de Waterwet][ref8];

      *beperkt kwetsbaar object:* beperkt kwetsbaar object als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van het Besluit externe veiligheid inrichtingen][ref9];

      *bijkomend gevaar:* een gevaar naast de grootste gevaarseigenschap als bedoeld in het ADR;

      *bijvoedermiddel:* plantaardig restproduct uit de land- en tuinbouw en uit de voedselbereiding en -verwerking,
      uitgezonderd voedselresten afkomstig van restaurants, cateringfaciliteiten en keukens, met inbegrip van centrale
      keukens en keukens van huishoudens;

      *binnenschietbaan:* een schietbaan of een combinatie van schietbanen in een gebouw of een deel van een gebouw,
      zonder open zijden en met een gesloten afdekking;

      *biobrandstof:* biobrandstof als bedoeld in artikel 2, onderdeel i, van Richtlijn 2009/28/EG van het Europees
      Parlement en de Raad van 23 april 2009 tot bevordering van het gebruik van energie uit hernieuwbare bronnen en
      houdende wijziging en intrekking van richtlijn 2001/77/EG en Richtlijn 2003/30/EG (PbEU 2009, L 140);

      *biocide:* biocide als bedoeld in [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref10];

      *biologische productiemethode:* productiemethode als bedoeld in
      [artikel 1, eerste lid, onderdeel q, van het Landbouwkwaliteitsbesluit 2007][ref11];

      *biomassa:*

      a. producten die bestaan uit plantaardig landbouw- of bosbouwmateriaal dat gebruikt kan worden als brandstof om de
      energetische inhoud ervan te benutten;

      b. de volgende afvalstoffen:

      1°. plantaardig afval uit land- of bosbouw;

      2°. plantaardig afval van de levensmiddelenindustrie, indien de opgewekte warmte wordt teruggewonnen;

      3°. vezelachtig plantaardig afval afkomstig van de productie van ruwe pulp en van de productie van papier uit pulp,
      indien het op de plaats van productie wordt meeverbrand en de opgewekte warmte wordt teruggewonnen;

      4°. kurkafval;

      5°. houtafval, met uitzondering van houtafval dat ten gevolge van een behandeling met houtbeschermingsmiddelen
      of door het aanbrengen van een beschermingslaag gehalogeneerde organische verbindingen dan wel zware metalen kan
      bevatten;

      *bodem:* bovenste laag van de aardkorst die begrensd is door het vaste gesteente en het aardoppervlak, bestaande
      uit minerale deeltjes, organisch materiaal, water, lucht en levende organismen;

      *bodembedreigende activiteit:* bedrijfsmatige activiteit die gepaard gaat met het gebruik, de productie of de
      emissie van een bodembedreigende stof;

      *bodembedreigende stof:* stof die de bodem kan verontreinigen als bedoeld in bijlage 2 van deel 3 van de NRB, en
      stoffen of mengsels als omschreven in artikel 3 van de EG-verordening indeling, etikettering en verpakking van
      stoffen en mengsels die de bodem kunnen verontreinigen;

      *bodembeschermende maatregel:* op de gebezigde stoffen en gebruikte bodembeschermende voorziening toegesneden
      beheermaatregel gericht op reparatie, schoonmaak, onderhoud, actie bij incidenten, bedrijfsinterne controle,
      inspectie of toezicht, ter voorkoming van immissies in de bodem of herstel van de effecten van zulke immissies op
      de bodemkwaliteit, waarvan de uitvoering is gewaarborgd;

      *bodembeschermende voorziening:* een vloeistofkerende voorziening, een vloeistofdichte vloer of verharding of een
      andere doelmatige fysieke voorziening, ter voorkoming van immissies in de bodem;

      *bodemzijdig vermogen:* grootste hoeveelheid energie, uitgedrukt in kW, die het bodemzijdig deel van een gesloten
      bodemenergiesysteem bij normaal gebruik kan uitwisselen met de bodem;

      *bovengrondse opslagtank:* opslagtank niet zijnde een ondergrondse opslagtank en niet zijnde een ladingtank van
      een bunkerstation;

      *brandcompartiment:* brandcompartiment als bedoeld in [artikel 1.1, eerste lid, van het Bouwbesluit 2012][ref12];

      *brandstof:* vaste, vloeibare of gasvormige brandbare stof;

      *BTEX:* benzeen, tolueen, ethylbenzeen en xyleen;

      *buitenschietbaan:* een schietbaan of een combinatie van schietbanen in de buitenlucht of in een gebouw of deel van
      een gebouw zonder een gesloten afdekking;

      *buitenschietbaan met beperkte onveilige zone:* buitenschietbaan met zodanige voorzieningen dat de onveilige zone
      wordt beperkt tot een gebied tussen het wapen en de kogelvanger;

      *bunkerstation:* drijvend bouwsel dat wegens zijn bestemming in de regel niet wordt verplaatst en dat bestemd of in
      gebruik is voor de opslag of levering van brandstof voor voortstuwing van schepen;

      *coating:* mengsel, met inbegrip van alle voor een juist gebruik benodigde organische oplosmiddelen of mengsels,
      dat wordt gebruikt om op een oppervlak voor een decoratief, beschermend of ander functioneel effect te zorgen;

      *composteren:* omzetten van groenafval en hulpstoffen in een product dat geheel of grotendeels bestaat uit een of
      meer organische afvalstoffen die met behulp van micro-organismen zijn afgebroken en omgezet tot een zodanig stabiel
      eindproduct dat daarin alleen nog een langzame afbraak van humeuze verbindingen plaatsvindt;

      *composteringshoop:* hoop van groenafval en hulpstoffen, opgezet met als doel dit materiaal te composteren;

      *concentratiegebied:* concentratiegebied als bedoeld in [artikel 1 van de Wet geurhinder en veehouderij][ref13];

      *consumentenvuurwerk:* consumentenvuurwerk als bedoeld in
      [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref14];

      *CMR-stof:* stof of preparaat die volgens bijlage I bij [Richtlijn nr. 67/548/EEG](31967L0548) geclassificeerd
      is als Kankerverwekkend categorie 1 of 2 of als Mutageen categorie 1 of 2 of als «Voor de voortplanting giftig»
      categorie 1 of 2;

      *damp/lichte olie-verhouding:* verhouding tussen het volume bij atmosferische druk van damp van lichte olie die
      door een EU-systeem voor dampretour fase-II loopt en het volume van de geleverde lichte olie;

      *dampterugwinningseenheid:* installatie voor de terugwinning van benzine uit damp of de omzetting naar elektrische
      energie of warmte uit damp, met inbegrip van eventuele buffertanksystemen van een terminal;

      *debiet van lichte olie:* totale jaarlijkse hoeveelheid lichte olie die uit mobiele tanks aan een inrichting wordt
      geleverd;

      *demontagebedrijf voor tweewielige motorvoertuigen:* inrichting voor het demonteren van wrakken van tweewielige
      motorvoertuigen;

      *diercategorie:* diercategorie als bedoeld in de regeling op grond van
      [artikel 1 van de Wet ammoniak en veehouderij][ref15];

      *dieren met geuremissiefactor:* dieren waarvoor een geuremissiefactor is vastgesteld op grond van
      [artikel 10 van de Wet geurhinder en veehouderij][ref16];

      *dieren zonder geuremissiefactor:* dieren waarvoor geen emissiefactor is vastgesteld op grond van
      [artikel 10 van de Wet geurhinder en veehouderij][ref17];

      *dierenverblijf:* al dan niet overdekte ruimte waarbinnen landbouwhuisdieren worden gehouden;

      *dierlijke bijproducten:* bijproducten als bedoeld in artikel 2, eerste lid, onder a, van Verordening nr. 1774/2002
      van het Europees Parlement en de Raad tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke
      consumptie bestemde dierlijke bijproducten;

      *dierlijke meststoffen:* dierlijke meststoffen als bedoeld in artikel 1, eerste lid, onderdeel c, van de
      Meststoffenwet;

      *dierplaats:* dierplaats als bedoeld in [artikel 1, eerste lid, van de Wet ammoniak en veehouderij][ref18];

      *dieselmotor:* verbrandingsmotor die werkt volgens de dieselcyclus en die gebruik maakt van compressieontsteking om
      brandstof te verbranden;

      *diffuse emissie:* emissie, in een andere vorm dan vanuit een puntbron, in de lucht, bodem of water, almede in enig
      product, tenzij anders vermeld in tabel 2.28a;

      *digestaat:* restproduct dat overblijft na het vergisten van ten minste 50% dierlijke uitwerpselen met als
      nevenbestanddeel uitsluitend producten die krachtens [artikel 5 van het Uitvoeringsbesluit Meststoffenwet][ref19]
      zijn aangewezen;

      *dioxinen en furanen:* 2,3,7,8 -tetrachloordibenzodioxine (tcdd), 1,2,3,7,8 -pentachloordibenzodioxine
      (pecdd), 1,2,3,4,7,8 -hexachloordibenzodioxine (hxcdd), 1,2,3,6,7,8 -hexachloordibenzodioxine (hxcdd),
      1,2,3,7,8,9 -hexachloordibenzodioxine (hxcdd), 1,2,3,4,6,7,8 -heptachloordibenzodioxine (hpcdd),
      octachloordibenzodioxine (ocdd), 2,3,7,8 -tetrachloordibenzofuraan (tcdf), 2,3,4,7,8 -pentachloordibenzofuraan
      (pecdf), 1,2,3,7,8 -pentachloordibenzofuraan (pecdf), 1,2,3,4,7,8 -hexachloordibenzofuraan (hxcdf),
      1,2,3,6,7,8 -hexachloordibenzofuraan (hxcdf), 1,2,3,7,8,9 -hexachloordibenzofuraan (hxcdf), 2,3,4,6,7,8
      -hexachloordibenzofuraan (hxcdf), 1,2,3,4,6,7,8 -heptachloordibenzofuraan (hpcdf), 1,2,3,4,7,8,9
      -heptachloordibenzofuraan (hpcdf), of octachloordibenzofuraan (ocdf);

      *doelmatig beheer van afvalwater:* zodanig beheer van afvalwater dat daarbij rekening wordt gehouden met de
      voorkeursvolgorde aangegeven in [artikel 10.29a van de wet][ref20];

      *donkerteperiode:* periode van 1 november tot 1 april van 18.00 tot 24.00 uur en van 1 april tot 1 mei en van
      1 september tot 1 november van het tijdstip van een half uur na zonsondergang tot 02.00 uur;

      *drainagewater:* water dat wordt afgevoerd via een stelsel van geperforeerde buizen die in de grond zijn
      aangebracht;

      *drainwater:* voedingswater dat bij substraatteelt niet wordt opgenomen door het gewas;

      *driftarme dop:* spuitdop, waarvan volgens een bij ministeriële regeling aangewezen testmethode is aangetoond dat
      deze de drift met ten minste 50% reduceert ten opzichte van de grensdop van de klasse fijn en midden volgens de
      classificatie van de British Crop Protection Council (931-030-F110 bij 3 bar);

      *drijfmest:* dierlijke meststoffen die verpompbaar zijn;

      *dwarsstroomspuit:* apparatuur voor het gebruik van gewasbeschermingsmiddelen in opgaande gewasrijen waarbij de
      spuitvloeistof in de hoogte gelijkmatig en links en rechts symmetrisch wordt verdeeld;

      *emissiescherm:* scherm ter beperking van het verwaaien van spuitvloeistof bij het toepassen van
      gewasbeschermingsmiddelen of bladmeststoffen;

      *equivalent geluidsniveau:*: equivalent geluidsniveau als bedoeld in [artikel 1 van de Wet geluidhinder][ref21];

      *etmaalwaarde:* de hoogste van de volgende drie waarden:

      a. de waarde van het langtijdgemiddelde beoordelingsniveau (L) tussen 07.00 en 19.00 uur (dag);

      b. de met 5 dB(A) verhoogde waarde van het langtijdgemiddelde beoordelingsniveau (L) tussen 19.00 en 23.00 uur
      (avond);

      c. de met 10 dB(A) verhoogde waarde van het langtijdgemiddelde beoordelingsniveau (L) tussen 23.00 en 07.00 uur
      (nacht);

      *EU-richtlijn industriële emissies:* EU-richtlijn industriële emissies als bedoeld in artikel 1.1, eerste lid, van
      het Besluit omgevingsrecht;

      *EU-systeem voor dampretour fase-II:* apparatuur als bedoeld in artikel 2, onder 6, van richtlijn nr. 2009/126/
      EG van het Europees Parlement en de Raad van 21 oktober 2009 inzake fase II-benzinedampterugwinning tijdens het
      bijtanken van motorvoertuigen in benzinestations (PbEU L 285);

      *gasdrukmeet- en regelstation categorie A:* gasdrukmeet- en regelstation met:

      - een ontwerpcapaciteit die kleiner of gelijk aan 650 normaal kubieke meter per uur is met een maximale
      operationele inlaatzijdige werkdruk die kleiner of gelijk aan 0,1 bar is;
      - een ontwerpcapaciteit die kleiner of gelijk aan 10 normaal kubieke meter per uur is met een maximale operationele
      inlaatzijdige werkdruk die kleiner of gelijk aan 16 bar is;

      *gasdrukmeet- en regelstation categorie B:* gasdrukmeet- en regelstation met een ontwerpcapaciteit die kleiner of
      gelijk aan 6000 normaal kubieke meter per uur is met een maximale operationele inlaatzijdige werkdruk die kleiner
      of gelijk aan 16 bar is, niet zijnde een gasdrukmeet- en regelstation categorie A;

      *gasdrukmeet- en regelstation categorie C:* gasdrukmeet- en regelstation met een maximale operationele
      inlaatzijdige werkdruk die kleiner of gelijk aan 100 bar is, niet zijnde een gasdrukmeet- en regelstation categorie
      A of gasdrukmeet- en regelstation categorie B;

      *gasfles:* een verplaatsbare drukhouder met een waterinhoud van niet meer dan 150 liter;

      *gasmotor:* verbrandingsmotor die werkt volgens de ottocyclus en gebruikmaakt van vonkontsteking of, in het geval
      van dual-fuelmotoren, compressieontsteking om brandstof te verbranden;

      *gasturbine:* roterende machine die thermische energie in arbeid omzet, in hoofdzaak bestaande uit een compressor,
      een thermisch toestel waarin brandstof wordt geoxideerd om het werkmedium te verhitten en een turbine en waaronder
      tevens wordt begrepen een open- of gecombineerde-cyclus gasturbine en een gasturbine in warmtekrachtkoppeling, met
      of zonder aanvullende verbranding;

      *gaszak:* flexibele opslagvoorziening voor gassen;

      *geluidsgevoelige ruimte:* geluidsgevoelige ruimte als bedoeld in [artikel 1 van de Wet geluidhinder][ref22];

      *geluidsniveau:* geluidsniveau in dB(A) als bedoeld in [artikel 1 van de Wet geluidhinder][ref23];

      *gesloten bodemenergiesysteem:* installatie waarmee, zonder grondwater te onttrekken en na gebruik in de bodem
      terug te brengen, gebruik wordt gemaakt van de bodem voor de levering van warmte of koude ten behoeve van de
      verwarming of koeling van ruimten in bouwwerken, door middel van een gesloten circuit van leidingen, met inbegrip
      van een bijbehorende warmtepomp, circulatiepomp en regeneratievoorziening, voor zover aanwezig;

      *geurgevoelig object:* geurgevoelig object als bedoeld in [artikel 1 van de Wet geurhinder en veehouderij][ref24];

      *gevaarlijke stoffen:* stoffen en voorwerpen, waarvan het vervoer volgens het ADR is verboden of slechts onder
      daarin opgenomen voorwaarden is toegestaan, dan wel stoffen, materialen en voorwerpen aangeduid in de International
      Maritime Dangerous Goods Code;

      *gevel:* gevel als bedoeld in [artikel 1][ref25] juncto [artikel 1b, vierde lid, van de Wet geluidhinder][ref26];

      *gevoelige gebouwen:* woningen en gebouwen die op grond van [artikel 1 van de Wet geluidhinder][ref27] worden
      aangemerkt als andere geluidsgevoelige gebouwen, met uitzondering van die gebouwen behorende bij de betreffende
      inrichting;

      *gevoelige objecten:* gevoelige gebouwen en gevoelige terreinen;

      *gevoelige terreinen:* terreinen die op grond van [artikel 1 van de Wet geluidhinder][ref28] worden aangemerkt als
      geluidsgevoelige terreinen, met uitzondering van die terreinen behorende bij de betreffende inrichting;

      *gewasbed:* strook beteelde grond die in de breedte wordt begrensd door een strook onbeteelde grond;

      *gewasbeschermingsmiddel:* gewasbeschermingsmiddel als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref29];

      *gezoneerd industrieterrein:* industrieterrein als bedoeld in [artikel 1 van de Wet geluidhinder][ref30];

      *glastuinbouwbedrijf:* inrichting die uitsluitend of in hoofdzaak is bestemd voor het in een kas telen van
      gewassen, met uitzondering van een zodanige inrichting die uitsluitend of in hoofdzaak is bestemd tot het in een
      kas telen van eetbare paddenstoelen of witlof;

      *glastuinbouwgebied:* cluster aaneengesloten percelen met overwegend glastuinbouwbestemmingen;

      *grote stookinstallatie:* stookinstallatie met een totaal nominaal thermisch ingangsvermogen van 50 MW of meer,
      ongeacht het toegepaste brandstoftype;

      *helitraumacentrum:* een academisch ziekenhuis dat binnen de inrichting beschikt over een voorziening voor het
      landen en opstijgen van hefschroefvliegtuigen en die voorziening hoofdzakelijk in gebruik heeft voor het regulier
      vervoeren van een mobiel medisch team;

      *hernieuwbare energie:* energie uit hernieuwbare bronnen als bedoeld in artikel 2, onderdeel 1, van de [richtlijn
      (EU) 2018/2001](32018L2001) van het Europees Parlement en de Raad van 11 december 2018 ter bevordering van het
      gebruik van energie uit hernieuwbare bronnen (PbEU 2018, L 328);

      *huisvestingssysteem:* gedeelte van een dierenverblijf waarin landbouwhuisdieren van één diercategorie op dezelfde
      wijze worden gehouden;

      *inerte goederen:* goederen die geen bodembedreigende stoffen, gevaarlijke stoffen of CMR-stoffen zijn;

      *inkt:* mengsel dat bij een drukactiviteit wordt gebruikt om een tekst of afbeelding op een oppervlak af te
      drukken;

      *insteek van een oppervlaktewaterlichaam:* snijpunt van de raaklijnen van het talud en het horizontale maaiveld;

      *ISO:* door de Internationale Organisatie voor Standaardisatie uitgegeven norm;

      *jachthaven:* inrichting voor het bieden van gelegenheid tot het afmeren van pleziervaartuigen;

      *kantdop:* spuitdop die een tophoek van maximaal 90° heeft;

      *ketelinstallatie:* stookinstallatie, bestaande uit een ketel waarin brandstof wordt verstookt, welke verbranding
      in hoofdzaak is bedoeld om kracht op te wekken of om warmte over te dragen aan water, stoom of een combinatie van
      water of stoom;

      *kleefstof:* mengsel dat wordt gebruikt om afzonderlijke delen van een product samen te kleven;

      *kleiduiven:* voorwerpen die, in de lucht geschoten of geworpen, dan wel over de grond gerold of mechanisch
      voortbewogen, dienen als doel bij het schieten met hagelgeweren;

      *kleiduivenbaan:* buitenschietbaan waarop wordt geschoten met hagelgeweren met als doel, kleiduiven of andere
      doelen in het kader van de oefening voor de jacht te raken;

      *koelinstallatie:* een combinatie van met koudemiddel gevulde onderdelen die met elkaar zijn verbonden en die
      tezamen een gesloten koudemiddelcircuit vormen waarin het koudemiddel circuleert met het doel warmte op te nemen of
      af te staan;

      *kunststeen:* blokken van korrels of brokken van natuursteen met bindmiddel;

      *kwetsbaar object:* kwetsbaar object als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit externe veiligheid inrichtingen][ref31];

      *L:* de geluidsbelastingsindicator zoals opgenomen in artikel 3, onder f, van richtlijn nr. 2002/49/EG van het
      Europees Parlement en de Raad van de Europese Unie van 25 juni 2002, inzake de evaluatie en de beheersing van
      omgevingslawaai;

      *L:* de geluidsbelastingsindicator zoals opgenomen in artikel 3, onder i, van richtlijn nr. 2002/49/EG van het
      Europees Parlement en de Raad van de Europese Unie van 25 juni 2002, inzake de evaluatie en de beheersing van
      omgevingslawaai;

      *laadportaal:* laadportaal als bedoeld in artikel 2, onderdeel o, van richtlijn 94/63/EG;

      *lak:* doorzichtige coating;

      *langtijdgemiddeld beoordelingsniveau:* (L) het gemiddelde van de afwisselende niveaus van het ter plaatse
      optredende geluid, gemeten in een bepaalde periode en vastgesteld en beoordeeld overeenkomstig de Handleiding meten
      en rekenen industrielawaai;

      *lassen van textiel:* het door middel van warmteopwekking of warmtetoevoer aaneenhechten van textiel;

      *lekbak:* een voorziening waarvan de bodembeschermende werking door de daarop afgestemde bodembeschermende
      maatregelen is gewaarborgd, en die zich rondom of onder een bodembedreigende activiteit bevindt en in staat is de
      bij normale bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen;

      *lozen:* het brengen van:

      1°. stoffen als bedoeld in [artikel 6.1 van de Waterwet][ref32] in een oppervlaktewaterlichaam;

      2°. afvalwater of overige vloeistoffen op of in de bodem;

      3°. afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel;

      4°. afvalwater of andere afvalstoffen in een openbaar ontwateringstelsel;

      5°. afvalwater of andere afvalstoffen in een openbaar vuilwaterriool;

      6°. afvalwater of andere afvalstoffen in een andere voorziening voor de inzameling en het transport van afvalwater,
      of

      7°. water of stoffen als bedoeld in [artikel 6.1 van de Waterwet][ref33] met behulp van een werk, niet zijnde een
      openbaar vuilwaterriool, op een zuiveringtechnisch werk;

      *LPG:* mengsel, bestaande uit hoofdzakelijk propaan, propeen, butanen en butenen;

      *LPG-afleverinstallatie:* reservoir inclusief de leidingen, appendages en toebehoren, de afleverzuilen en het
      vulpunt van het reservoir;

      *LPG-tankstation:* inrichting voor het afleveren van LPG aan motorvoertuigen voor het wegverkeer;

      *LPG-tankwagen:* voertuig, gebouwd om LPG te vervoeren en uitgerust met één of meer vaste tanks;

      *LQ:* Limited Quantities, gelimiteerde hoeveelheden als bedoeld in het ADR;

      *massastroom:* massa van een bepaalde stof of stoffen die per tijdseenheid wordt geëmitteerd, uitgedrukt in massa
      per tijdseenheid;

      *maximaal geluidsniveau:* (L) maximaal geluidsniveau gemeten in de meterstand «F» of «fast», als vastgesteld en
      beoordeeld overeenkomstig de Handleiding meten en rekenen industrielawaai;

      *maximale emissiewaarde:* maximale emissiewaarde als bedoeld in
      [artikel 1, eerste lid, van de Wet ammoniak en veehouderij][ref34];

      *meerjarenafspraak energie-efficiëntie:* De op 1 juli 2008 tot stand gekomen meerjarenafspraak energie-efficiëntie
      (Stcrt. 2018, 50932);

      *melkrundvee:* melkrundvee als bedoeld in [artikel 1, eerste lid, van de Wet ammoniak en veehouderij][ref35];

      *mestbassin:* voorziening voor het opslaan van drijfmest, niet zijnde een opslagtank of verpakking;

      *mestkelder:* ondergronds mestbassin, voorzien van een afdekking die als vloer kan fungeren en onderdeel is van een
      dierenverblijf of van een voormalig dierenverblijf;

      *meststoffen:* meststoffen als bedoeld in [artikel 1, eerste lid, onderdeel d, van de Meststoffenwet][ref36];

      *meststoffengroep:* aanduiding van de gevaarscategorie van vaste minerale anorganische meststoffen overeenkomstig
      de indeling van PGS 7;

      *mobiel medisch team:* team bestaande uit in ieder geval een arts en een verpleegkundige, ieder met een specifieke
      opleiding en ervaring op het gebied van de pre-hospitale spoedeisende medische hulpverlening;

      *motorvoertuigen of werktuigen:* motorvoertuigen, aanhangers, landbouwwerktuigen en -machines en
      carrosserieonderdelen;

      *munitie-QRA:* beoordeling van de veiligheidssituatie en het risico van voorgenomen activiteiten in de
      veiligheidszones van een militaire munitieopslagplaats;

      *nanacht:* periode van 1 november tot 1 april van 24.00 uur tot het tijdstip van zonsopgang en van 1 april tot
      1 mei en van 1 september tot 1 november van 02.00 uur tot het tijdstip van zonsopgang;

      *natte koeltoren:* installatie gebruikt voor het, middels een open constructie, afvoeren van overtollige warmte uit
      productieprocessen en gebouwen door middel van het vernevelen van water;

      *natuurlijk koudemiddel:* kooldioxide, ammoniak of koolwaterstoffen niet zijnde een gefluoreerd broeikasgas als
      bedoeld in Verordening (EU) nr. 517/2014 van het Europees Parlement en de Raad van de Europese Unie van 16 april
      2014 dan wel een gereguleerde stof als bedoeld in Verordening (EG) nr. 1005/2009 van het Europees Parlement en de
      Raad van de Europese Unie van 16 september 2009, voor zover toegepast als koudemiddel;

      *natuursteen:* uit de natuur gewonnen blokken en platen van steen;

      *NEG:* netto explosief gewicht, uitgedrukt als de massa van de explosieve stof of de massa van de explosieve stof
      in een ontplofbaar voorwerp;

      *NEN:* door de Stichting Nederlands Normalisatie-instituut uitgegeven norm;

      *niet aangewezen oppervlaktewaterlichaam:* oppervlaktewaterlichaam dat geen aangewezen oppervlaktewaterlichaam is;

      *niet-doorlatende ondergrond:* bodembedekkende voorziening waarbij geen uitspoeling plaatsvindt naar de
      onderliggende bodemlaag;

      *Nm3:* normaal kubieke meter;

      *noodsignalen:* noodsignalen die onder de klasse 1.3 of klasse 1.4 van het ADR vallen;

      *normaal kubieke meter:* afgashoeveelheid bij 273,15 Kelvin en 101,3 kilo Pascal en betrokken op droge lucht;

      *NRB:* Nederlandse Richtlijn Bodembescherming;

      *NTA:* door de Stichting Nederlandse Normalisatie-instituut uitgegeven Nederlandse Technische Afspraak;

      *odour unit:* Europese eenheid voor geurconcentratie volgens NEN-EN 13725;

      *ondergrondse opslagtank:* opslagtank die geheel in de bodem ligt of ingeterpt is;

      *onveilige zone:* gebied waarin kogels dan wel hagel afkomstig uit vuurwapens kunnen neerkomen tijdens schieten op
      een buitenschietbaan;

      *open bodemenergiesysteem:* installatie waarmee van de bodem gebruik wordt gemaakt voor de levering van warmte
      of koude ten behoeve van de verwarming of koeling van ruimten in bouwwerken, door grondwater te onttrekken en na
      gebruik in de bodem terug te brengen, met inbegrip van bijbehorende bronpompen en warmtewisselaar en, voor zover
      aanwezig, warmtepomp en regeneratievoorziening;

      *oplosmiddelenhergebruik:* gebruik van uit een oplosmiddeleninstallatie teruggewonnen organische oplosmiddelen
      voor elk technisch of commercieel doel, met inbegrip van het gebruik als brandstof maar met uitzondering van het
      verwijderen van deze teruggewonnen organische oplosmiddelen als afval;

      *oplosmiddeleninput:* de hoeveelheid organische oplosmiddelen en de hoeveelheid daarvan in mengsels die tijdens het
      uitoefenen van een activiteit worden gebruikt, met inbegrip van de hergebruikte oplosmiddelen, binnen en buiten de
      installatie, die telkens worden meegerekend wanneer zij worden gebruikt om de betrokken activiteit uit te oefenen;

      *oplosmiddeleninstallatie:* installatie waarin activiteiten en processen als bedoeld in bijlage VII, deel 1, bij de
      EU-richtlijn industriële emissies plaatsvinden;

      *oplosmiddelenverbruik:* de totale input van organische oplosmiddelen per twaalf maanden in een installatie,
      verminderd met eventuele vluchtige organische stoffen die voor hergebruik worden teruggewonnen;

      *opslagtank:* een vormvaste opslagvoorziening voor gas met een inhoud van ten minste 150 liter of een vormvaste
      opslagvoorziening voor vloeistof met een inhoud van ten minste 300 liter, uitgezonderd een intermediate bulk
      container die voldoet aan hoofdstuk 6.5 van het ADR;

      *organisch oplosmiddel:* vluchtige organische verbinding die wordt gebruikt:

      a. om, alleen of in combinatie met andere stoffen en zonder een chemische verandering te ondergaan, grondstoffen,
      producten of afvalmaterialen op te lossen,

      b. als schoonmaakmiddel om verontreinigingen op te lossen,

      c. als verdunner,

      d. als dispergeermiddel,

      e. om de viscositeit aan te passen,

      f. om de oppervlaktespanning aan te passen,

      g. als weekmaker, of

      h. als conserveermiddel;

      *overkapte beddenspuit:* apparatuur voor het gebruik van gewasbeschermingsmiddelen waarbij de spuitdoppen
      gemonteerd zijn binnen een overkapping, die met uitzondering van de voor- en de achterzijde van de apparatuur, het
      gewasbed min of meer omsluit en waarbij per gewasbed een eenheid van spuitleiding en overkapping wordt gebruikt;

      *PAK’s:* som van naftaleen, anthraceen, fluorantheen, benzo(g, h, i)peryleen, benzo(a)pyreen, benzo(b)fluorantheen,
      benzo(k)fluorantheen en indeno(1,2,3-cd)pyreen;

      *PER:* tetrachlooretheen;

      *PGS:* Publicatiereeks Gevaarlijke Stoffen;

      *pleziervaartuig:* schip bestemd of gebruikt voor sport of vrijetijdsbesteding;

      *pluimvee:* dieren behorend tot diercategorieën E1 tot en met E5, F1 tot en met F4, G1, G2 en J1, als bedoeld in de
      regeling op grond van [artikel 1 van de Wet ammoniak en veehouderij][ref37];

      *praktijkruimte:* ruimte voor chemisch, natuurkundig of medisch onderwijs waarop de
      [Wet op het hoger onderwijs en het wetenschappelijk onderzoek][ref38] van toepassing is;

      *propaan:* product, hoofdzakelijk bestaande uit propaan en propeen, met geringe hoeveelheden ethaan, butanen
      en butenen, voor zover de dampspanning bij 343 Kelvin (70 graden Celsius) ten hoogste 3100 kilopascal (31 bar)
      bedraagt;

      *propeen:* zeer licht ontvlambaar tot vloeistof verdicht gas met UN-nummer 1077;

      *pyrotechnische artikelen voor theatergebruik:* pyrotechnische artikelen voor theatergebruik als bedoeld in
      [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref39];

      *raffinaderijbrandstof:* vaste, vloeibare of gasvormige brandbare stof, afkomstig uit de destillatie en de
      omzettingsstappen bij de raffinaderij van ruwe olie, met inbegrip van raffinaderijgas, syngas, geraffineerde oliën
      en petroleumcokes;

      *recirculatie:* hergebruik van opgevangen drain- of drainagewater;

      *recirculatiesysteem:* voorziening voor het opvangen en transporteren van drain- of drainagewater, ten behoeve
      van hergebruik;

      *referentieniveau:* hoogste waarde van de in de onderdelen a en b genoemde niveaus:

      a. het geluidsniveau, uitgedrukt in dB(A), dat gemeten over een bepaalde periode, gedurende 95% van de tijd wordt
      overschreden, exclusief de bijdrage van de inrichting zelf;

      b. het optredende equivalente geluidsniveau (L), veroorzaakt door wegverkeerbronnen minus 10 dB(A), met dien
      verstande dat voor de nachtperiode van 23.00 tot 07.00 uur alleen wegverkeerbronnen in rekening mogen worden
      gebracht met een intensiteit van meer dan 500 motorvoertuigen gedurende die periode;

      *reflectiescherm:* verticale constructie aan apparatuur voor het gebruik van gewasbeschermingsmiddelen, die een
      zodanige hoogte en breedte heeft, dat het verwaaien van spuitnevel wordt beperkt;

      *retourbuis van een gesloten bodemenergiesysteem:* de leiding die de circulatievloeistof terug geleidt door de
      bodem, waardoor warmte of koude wordt afgegeven aan de bodem;

      *richtlijn 94/63/EG:* richtlijn 94/63/EG van het Europees Parlement en de Raad van 20 december 1994 betreffende
      de beheersing van de uitstoot van vluchtige organische stoffen (VOS) als gevolg van de opslag van benzine en de
      distributie van benzine vanaf terminals naar benzinestations (PbEG 1994 L 365);

      *richtlijn energie-efficiëntie:* [Richtlijn 2012/27](32012L0027)/EU van het Europees Parlement en de Raad van
      25 oktober 2012 betreffende energie-efficiëntie, tot wijziging van [Richtlijnen 2009/125/EG](32009L0125) en
      [2010/30](32010L0030)/EU en houdende intrekking van de Richtlijnen [2004/8/EG](32004L0008) en [2006/32/EG]
      (32006L0032) (PbEU 2012, L 315);

      *rookzwak kruit:* kruit dat onder de klasse 1.3 van het ADR valt;

      *schoorsteen:* structuur met een of meer afgaskanalen voor de afvoer van afgassen met het oog op de emissie ervan
      in de lucht;

      *SPF:* Seasonal Performance Factor, waarmee het rendement van een bodemenergiesysteem wordt weergegeven, uitgedrukt
      als de door het systeem geleverde hoeveelheden warmte en koude per jaar in MWh, gedeeld door het gemeten of
      berekende energieverbruik van het systeem per jaar in MWh;

      *spoorvoertuig:* voertuig, bestemd voor het verkeer over spoorstaven met inbegrip van de carrosserieonderdelen
      daarvan;

      *spuitbus:* niet-hervulbare houder van metaal, glas of kunststof die een samengeperst, vloeibaar gemaakt
      of opgelost gas bevat, al dan niet met een vloeibare, pasteuze of poedervormige stof, en voorzien van een
      aftapinrichting die het mogelijk maakt, dat de inhoud wordt uitgestoten in de vorm van een suspensie van vaste of
      vloeibare deeltjes in een gas, in de vorm van schuim, pasta of poeder of in vloeibare of gasvormige toestand;

      *spuitdop:* uitstroomopening van apparatuur voor het gebruik van gewasbeschermingsmiddelen die in staat is
      spuitvloeistof zo te verdelen in druppels dat er op de grond of op het gewas een regelmatige verdeling ontstaat;

      *spuitgeweer:* apparatuur voor het gebruik van gewasbeschermingsmiddelen bestaande uit een spuitleiding die is
      voorzien van een spuitdop die met de hand wordt vastgehouden en bediend;

      *stookinstallatie:* technische eenheid waarin brandstoffen worden geoxideerd ten einde de aldus opgewekte warmte
      te gebruiken;

      *substraatmateriaal:* materiaal, bestemd om te worden gebruikt voor het telen van gewassen los van de ondergrond;

      *substraatteelt:* wijze van telen waarbij gewassen groeien los van de ondergrond;

      *teeltoppervlak:* oppervlak, uitgedrukt in vierkante meter, dat wordt gebruikt voor het telen van gewassen;

      *teeltvrije zone:* strook tussen de insteek van het oppervlaktewaterlichaam en het te telen gewas waarop, behoudens
      grasland, geen gewas of niet hetzelfde gewas als op de rest van het perceel wordt geteeld;

      *theatervuurwerk:* theatervuurwerk als bedoeld in [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref40];

      *totaal stikstof:* de som van nitraat-, nitriet-, organisch en ammonium stikstof waarvan de emissiemetingen worden
      uitgevoerd, bedoeld in [artikel 2.3][ref41];

      *tunnelspuit:* apparatuur voor het gebruik van gewasbeschermingsmiddelen in een gewasrij waarbij het verwaaien van
      spuitnevel wordt beperkt door een constructie die de gewasrij geheel of gedeeltelijk omsluit;

      *tweewielig motorvoertuig:* bromfiets als bedoeld in de regeling op grond van artikel 21, eerste lid, van de
      Wegenverkeerswet 1994, zijnde een voertuig op twee wielen of motorfiets als bedoeld in die regeling;

      *vanggewas:* barrière van bomen, struiken of andere gewassen, die het verwaaien van spuitvloeistof bij het gebruik
      van gewasbeschermingsmiddelen of bladmeststoffen naar een oppervlaktewaterlichaam beperkt;

      *vast object:* locatiegebonden constructie of gedeelte daarvan;

      *veehouderij:* inrichting voor het kweken, fokken, mesten, houden of verhandelen van landbouwhuisdieren;

      *veldspuitapparatuur:* mechanisch voortbewogen apparatuur voor het gebruik van gewasbeschermingsmiddelen bij de
      bovengrondse volveldsbehandeling in buitenteelten, die een overwegend neerwaartse uitstroming van de spuitvloeistof
      bewerkstelligt;

      *verblijfsruimten:* verblijfsruimten als bedoeld in [artikel 1.1, onderdeel d, van het Besluit geluidhinder][ref42];

      *verdichten:* reduceren van het volume bij een gelijkblijvende massa of een gelijkblijvend gewicht;

      *vergistinggas:* gasvormige brandstof, met als hoofdbestanddelen methaan en kooldioxide, dat is ontstaan door
      vergisting van organisch materiaal;

      *verkleinen:* in kleinere delen opdelen;

      *verpakkingsgroep:* een groep, waarin bepaalde stoffen op grond van hun gevaarlijkheid tijdens het vervoer conform
      het ADR zijn ingedeeld voor verpakkingsdoeleinden:

      1°. *verpakkingsgroep I*: zeer gevaarlijke stoffen;

      2°. *verpakkingsgroep II*: gevaarlijke stoffen;

      3°. *verpakkingsgroep III*: minder gevaarlijke stoffen;

      *vervoerseenheid met gevaarlijke stoffen:* een voertuig, oplegger of aanhanger met een conform het ADR voor het
      vervoer van gevaarlijke stoffen toegelaten tank, tankcontainer, tankbatterij, laadketel, laadruimte of laadvloer
      waarin gevaarlijke stoffen aanwezig zijn;

      *verwaarloosbaar bodemrisico:* een situatie als bedoeld in de NRB waarin door een goede afstemming van
      voorzieningen en maatregelen het ontstaan of de toename van verontreiniging van de bodem gemeten tussen het nul- en
      eindsituatieonderzoek, bedoeld in [artikel 2.11, eerste en derde lid][ref43], zo veel mogelijk wordt voorkomen en
      waarbij herstel van de bodem redelijkerwijs mogelijk is;

      *vloeibaar bijvoedermiddel:* bijvoedermiddel dat verpompbaar is en dat is aan te merken als «inerte goederen» als
      bedoeld in dit artikel;

      *vloeibare brandstof:* lichte olie, halfzware olie of gasolie als bedoeld in
      [artikel 26 van de Wet op de accijns][ref44];

      *vloeistofdichte vloer of verharding:* vloer of verharding direct op de bodem die waarborgt dat geen vloeistof aan
      de niet met vloeistof belaste zijde van die vloer of verharding kan komen;

      *vloeistofkerende voorziening:* fysieke barrière die in staat is stoffen tijdelijk te keren;

      *vluchtige organische stof:* organische verbinding, alsook de fractie creosoot, die bij 293,15 K een dampspanning
      van 0,01 kPa of meer heeft of onder specifieke gebruiksomstandigheden een vergelijkbare vluchtigheid heeft;

      *voedingswater:* water dat aan het gewas wordt toegediend en waar eventueel meststoffen aan zijn toegevoegd;

      *voorziening voor het beheer van afvalwater:* een openbaar vuilwaterriool, openbaar hemelwaterstelsel,
      openbaar ontwateringstelsel, een andere voorziening voor de inzameling en het transport van afvalwater, een
      zuiveringtechnisch werk of een zuiveringsvoorziening;

      *vuilwaterriool:*

      1°. een openbaar vuilwaterriool;

      2°. een andere voorziening voor de inzameling en het transport van stedelijk afvalwater, aangesloten op een
      zuiveringsvoorziening, die blijkens een vergunning als bedoeld in [artikel 6.2 van de Waterwet][ref45] mede voor
      het zuiveren van stedelijk afvalwater is bedoeld, of aangesloten op een zuiveringtechnisch werk; of

      3°. een werk, niet zijnde een voorziening voor de inzameling en het transport van afvalwater, aangesloten op een
      zuiveringtechnisch werk;

      *vuurwerk:* vuurwerk als bedoeld in [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref46];

      *warmtekrachtinstallatie:* stookinstallatie, bestemd voor het gelijktijdig opwekken van warmte en kracht waarbij de
      warmte nuttig wordt aangewend;

      *werkzame stof:* werkzame stof als bedoeld in [artikel 18 van de Wet gewasbeschermingsmiddelen en biociden][ref47];

      *windturbine:* een apparaat voor het opwekken van elektrisch of thermisch vermogen uit wind;

      *windturbinepark:* inrichting, bestaande uit ten minste drie windturbines;

      *woning:* gebouw of gedeelte van een gebouw waar bewoning is toegestaan op grond van het bestemmingsplan,
      de beheersverordening, bedoeld in [artikel 3.38 van de Wet ruimtelijke ordening][ref48], of, indien
      met toepassing van [artikel 2.12, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref49]
      van het bestemmingsplan of de beheersverordening is afgeweken, de omgevingsvergunning bedoeld in
      [artikel 1.1, eerste lid, van laatstgenoemde wet][ref50];

      *wrak van een tweewielig motorvoertuig:* tweewielig motorvoertuig dat een afvalstof is in de zin van
      [artikel 1.1, eerste lid, van de wet][ref51];

      *zeer kwetsbaar gebied:* zeer kwetsbaar gebied in de zin van de [Wet ammoniak en veehouderij][ref52].

      *ziekenhuis:* algemeen, academisch of categoriaal ziekenhuis als bedoeld in categorie 23.1, onderdeel a, onderdeel
      C van bijlage I bij het Besluit omgevingsrecht;

      *zuiveringsvoorziening:* werk voor het zuiveren van afvalwater, dat geen zuiveringtechnisch werk is;

      *zwart kruit:* kruit dat onder de klasse 1.1 van het ADR valt.

      2 In dit besluit en de daarop berustende bepalingen wordt ten aanzien van emissies naar de lucht, verstaan onder:

      - *bron:* emissie naar de lucht van een bewerkingseenheid al dan niet voorzien van emissiebeperkende voorzieningen
      en ongeacht de vraag of die emissie gecombineerd met andere emissies wordt geloosd op één of meer puntbronnen;
      - *ERP:* emissierelevante parameter: meetbare of berekenbare grootheid die in directe of indirecte relatie staat
      met de te beoordelen emissies, onderverdeeld in de categorieën A en B, waarbij categorie A, zo nodig na kalibratie,
      een kwantitatief beeld geeft van de emissie en categorie B een kwalitatief beeld;
      - *grensmassastroom:* een drempelwaarde per stofklasse, uitgedrukt in gram emissie per uur, waarboven een emissie
      naar de lucht als relevant beschouwd wordt;
      - *ISO-luchtcondities:* temperatuur van 288 Kelvin, een druk van 101,3 kiloPascal en een relatieve vochtigheid van
      60 procent;
      - *kosteneffectiviteit:* jaarkosten van emissiebeperkende maatregelen gedeeld door de emissiereductie, uitgedrukt
      in euro per kilogram emissiereductie;
      - *maximaal toelaatbaar risiconiveau:* een op basis van wetenschappelijke gegevens afgeleide norm voor een stof die
      aangeeft bij welke concentratie in lucht: 1° voor ecosystemen geen onomkeerbaar nadelig effect te verwachten is;
      2° voor de mens geen onomkeerbaar nadelig effect te verwachten is, of, met betrekking tot genotoxisch carcinogene
      stoffen, de kans op overlijden kleiner is dan 10-6 per jaar;
      - *meetmethode:* het geheel van monsterneming, monsterbehandeling en analyse ten behoeve van de kwantificering
      van emissies;
      - *standaardluchtcondities:* condities van de lucht bij een temperatuur van 273 K, 101,3 kPa en betrokken op droge
      lucht;
      - *storingsemissie:* de toename van de vracht van de emissie, uitgedrukt in g/uur, bij het falen van een
      reinigingstechniek of procesgeïntegreerde maatregel. Deze wordt berekend als het verschil tussen de ongereinigde
      massastroom en de massastroom berekend uit het debiet vermenigvuldigd met de geldende emissieconcentratie;
      - *storingsfactor F:* de storingsemissie gedeeld door de grensmassastroom;
      - *TEQ:* toxische equivalentiefactor, te hanteren voor het bepalen van de totale concentratie van dioxinen en
      furanen;
      - *stofcategorie:* clustering van stoffen op basis van vergelijkbare fysische of chemische eigenschappen;
      - *stofklasse:* onderverdeling binnen een stofcategorie op basis van vergelijkbare (toxicologische) eigenschappen;
      - *ERS:* stofklasse van extreem risicovolle stoffen: persistente, gemakkelijk accumuleerbare en zeer toxische stof;
      - *gA:* stofcategorie van gasvormige anorganische stoffen;
      - *gO:* stofcategorie van gasvormige organische stoffen, met uitzondering van methaan;
      - *MVP:* stofklasse van minimalisatieverplichte stoffen;
      - *puntbron:* een gefixeerd punt van gekanaliseerde en daarmee in principe kwantificeerbare emissies naar de lucht;
      - *S:* stofcategorie van zwevende deeltjes, uitgedrukt als totaal stof;
      - *sO:* stofcategorie van stofvormige organische stoffen;
      - *sA:* stofcategorie van stofvormige anorganische stoffen;
      - *ZZS:* stofcategorie van zeer zorgwekkende stoffen, onderverdeeld in de stofklassen ERS, MVP1 en MVP2.

      3 Bij ministeriële regeling kunnen, in het belang van de bescherming van het milieu, regels worden gesteld over de
      aanwijzing van stoffen en de onderverdeling van stofklassen en stofcategorieën als bedoeld in het tweede lid.

      4 Een wijziging van artikel 3, onder f en i, van richtlijn nr. 2002/49/EG van het Europees Parlement en de
      Raad van de Europese Unie van 25 juni 2002, inzake de evaluatie en de beheersing van omgevingslawaai, gaat
      voor de toepassing van de in het eerste lid gegeven omschrijving van L en L gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


