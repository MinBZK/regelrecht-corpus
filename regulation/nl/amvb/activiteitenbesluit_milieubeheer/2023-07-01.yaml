      5 Bij ministeriële regeling wordt de indeling van gewassen in de categorieën, bedoeld in tabel 3.66, vastgesteld.

      6 De hoeveelheid totaal stikstof, bedoeld in het vierde lid, wordt berekend door de in een jaar geloosde
      hoeveelheid drainwater te vermenigvuldigen met het daarin aanwezige gehalte aan nitraatstikstof en
      ammoniumstikstof. Bij ministeriële regeling kunnen nadere regels worden gesteld over het berekenen van het gehalte
      aan totaal stikstof.

      7 Het tweede en derde lid zijn niet van toepassing indien bij het lozen van drainwater de hoeveelheid totaal
      stikstof, bedoeld in het vierde lid, niet meer bedraagt dan 25 kilogram.

      8 Het bevoegd gezag kan bij maatwerkvoorschrift het tweede en derde lid niet van toepassing verklaren, indien de
      maatregelen, bedoeld in die leden niet doelmatig zijn. [Artikel 2.2, vierde lid][ref1], is van overeenkomstige
      toepassing.

      9 Het tweede, derde en vierde lid, zijn niet van toepassing, indien het totale teeltoppervlak binnen de inrichting
      waarop telen of kweken van gewassen in een kas plaatsvindt, kleiner is dan 2.500 vierkante meter.

      10 Het te lozen drainwater kan op een doelmatige wijze worden bemonsterd.


