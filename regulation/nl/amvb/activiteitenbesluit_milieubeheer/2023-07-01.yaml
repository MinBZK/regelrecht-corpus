        afdeling: '1.2'
  - number: '1.18'
    text: |-
      1 Bij een melding als bedoeld in [artikel 1.10][ref1] worden, indien in de inrichting landbouwhuisdieren worden
      gehouden in dierenverblijven, tevens de volgende gegevens verstrekt:

      a. per dierenverblijf het aantal landbouwhuisdieren per diercategorie en per huisvestingssysteem, genoemd in de
      regeling op grond van artikel 1 van de Wet ammoniak en veehouderij;

      b. per dierenverblijf een beschrijving van het ventilatiesysteem;

      c. per dierenverblijf waarin dieren met een geuremissiefactor worden gehouden:

      1°. de inputgegevens van het verspreidingsmodel V-stacks vergunning, genoemd in de regeling op grond van
      [artikel 10 van de Wet geurhinder en veehouderij][ref2];

      2°. een plattegrondtekening overeenkomstig de beschrijving van de binnen het dierenverblijf toegepaste
      huisvestingssystemen, waarop de emissiepunten en de ventilatoren met hun diameter zijn aangegeven;

      3°. een doorsnedetekening overeenkomstig de beschrijving van de binnen het dierenverblijf toegepaste
      huisvestingssystemen, waarop de goothoogte, de nokhoogte, de emissiepunten en de ventilatoren zijn aangegeven.

      2 Het eerste lid is niet van toepassing op inrichtingen waar minder dan 10 schapen, 5 paarden, 10 geiten, 25 stuks
      pluimvee, 25 konijnen en 10 overige landbouwhuisdieren worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel10
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel1.18
