  - number: '3.39'
    text: >-
      Bij het opslaan, overslaan en mengen van stuifgevoelige goederen in gesloten ruimtes worden ten behoeve van het
      voorkomen dan wel beperken van diffuse emissie en om het doelmatig verspreiden van emissies naar de buitenlucht te
      bevorderen ten minste de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.39
  - number: '3.45'
    text: >-
      1 Deze paragraaf is van toepassing op het opslaan van agrarische bedrijfsstoffen met een totaal volume van meer dan
      3 kubieke meter.


      2 In afwijking van het eerste lid is deze paragraaf niet van toepassing op het opslaan van dierlijke meststoffen
      die niet verpompbaar zijn, met een totaal volume van meer dan 600 kubieke meter.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.45
  - number: '3.46'
    text: |-
      1 Het opslaan van agrarische bedrijfsstoffen vindt plaats op ten minste:

      a. 100 meter afstand tot een geurgevoelig object dat binnen de bebouwde kom is gelegen, of

      b. 50 meter afstand tot een geurgevoelig object dat buiten de bebouwde kom is gelegen.

      2 Het eerste lid is niet van toepassing op het opslaan van agrarische bedrijfsstoffen, indien de plaats waar deze
      bedrijfsstoffen zijn opgeslagen, is gelegen binnen een van de afstanden genoemd in dat lid, het opslaan reeds voor
      1 januari 2013 plaatsvond en verplaatsing van de opgeslagen bedrijfsstoffen redelijkerwijs niet kan worden gevergd.

      3 Indien het tweede lid van toepassing is:

      a. treft degene die de inrichting drijft maatregelen of voorzieningen die geurhinder voorkomen of tot een
      aanvaardbaar risico beperken, en

      b. geeft degene die de inrichting drijft op verzoek van het bevoegd gezag aan welke maatregelen of voorzieningen
      hij daartoe heeft getroffen of zal treffen.

      4 Het eerste lid is niet van toepassing op het opslaan van vaste dierlijke meststoffen die niet afkomstig zijn
      van landbouwhuisdieren. Het opslaan van vaste dierlijke meststoffen die niet afkomstig zijn van landbouwhuisdieren
      vindt plaats:

      a. in een afgesloten voorziening voor een periode van ten hoogste twee weken, of

      b. op ten minste 50 meter afstand tot een geurgevoelig object.

      5 In afwijking van het eerste lid vindt het opslaan van kuilvoer plaats op ten minste 25 meter afstand tot een
      geurgevoelig object.

      6 Indien de afstand van het opslagen kuilvoer, niet zijnde knolgewassen, wortelgewassen of fruit, tot een
      geurgevoelig object minder dan 50 meter bedraagt, is het opslagen kuilvoer afgedekt, behoudens de periode dat
      veevoeder aan de veevoederopslag wordt toegevoegd of onttrokken.

      7 De afstanden, genoemd in het eerste lid en vierde tot en met zesde lid, worden gemeten vanaf de buitenzijde
      van het geurgevoelig object tot het dichtstbijzijnde punt van de plaats waar de agrarische bedrijfsstoffen zijn
      opgeslagen.

      8 Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt, onverminderd
      [artikel 2.7a][ref1], bij maatwerkvoorschrift eisen stellen aan:

      a. de situering van de plaats van de opgeslagen bedrijfsstoffen;

      b. het afdekken van de opgeslagen agrarische bedrijfsstoffen, of

      c. de frequentie van de afvoer van de opgeslagen agrarische bedrijfsstoffen.

      9 Het eerste lid en vierde tot en met zesde lid zijn niet van toepassing op in plastic folie verpakte
      veevoederbalen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.46
