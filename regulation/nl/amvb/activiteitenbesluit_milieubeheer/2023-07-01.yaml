  - number: '3.23'
    text: >-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van een vloeistofdichte vloer of verharding waarop
      het afleveren van vloeibare brandstof aan motorvoertuigen voor het wegverkeer of het afleveren van vloeibare
      brandstof aan spoorvoertuigen plaatsvindt, wordt ten minste voldaan aan het tweede tot en met het vierde lid.


      2 Het afvalwater wordt geleid door een slibvangput en olieafscheider die voldoen aan en worden gebruikt conform
      NEN-EN 858-1 en 2.


      3 Het gehalte aan olie in het afvalwater na de afscheider bedraagt niet meer dan 200 milligram per liter in enig
      steekmonster.


      4 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.


      5 Het tweede lid is niet van toepassing indien voor het van toepassing worden van dit besluit of een deel daarvan
      op een activiteit in de inrichting een slibvangput en een olieafscheider zijn geplaatst die op de hoeveelheid
      afvalwater zijn afgestemd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.23
  - number: 3.23a
    text: >-
      Deze paragraaf is van toepassing op:


      a. het uitwendig wassen van motorvoertuigen of werktuigen of van spoorvoertuigen,


      b. het verwijderen van graffiti van motorvoertuigen of werktuigen of van spoorvoertuigen, of


      c. het stallen en uitwendig wassen van werktuigen waarmee gewasbeschermingsmiddelen zijn toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.23a
  - number: 3.23b
    text: >-
      1 Bij het in een inrichting uitwendig wassen van motorvoertuigen of werktuigen of van spoorvoertuigen wordt ten
      behoeve van het realiseren van een verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling gestelde
      eisen.


      2 Het eerste lid is niet van toepassing, indien:


      a. per week ten hoogste een spoorvoertuig of een motorvoertuig of werktuig waarmee geen gewasbeschermingsmiddelen
      zijn toegepast, uitwendig wordt gewassen, en


      b. per jaar ten hoogste twee werktuigen waarmee gewasbeschermingsmiddelen zijn toegepast, uitwendig worden
      gewassen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.23b
  - number: 3.23c
    text: >-
      1 Bij het lozen in een vuilwaterriool van afvalwater afkomstig van een bodembeschermende voorziening als
      gevolg van het uitwendig wassen van motorvoertuigen of werktuigen of van spoorvoertuigen waarmee geen
      gewasbeschermingsmiddelen zijn toegepast, wordt ten minste voldaan aan het tweede tot en met vierde lid.


      2 Het afvalwater in enig steekmonster bevat ten hoogste:


      a. 20 milligram olie per liter;


      b. 300 milligram onopgeloste stoffen per liter.


      3 In afwijking van het tweede lid bedraagt het gehalte aan olie ten hoogste 200 milligram per liter in enig
      steekmonster, indien het afvalwater voorafgaand aan vermenging met ander afvalwater wordt geleid door een
      slibvangput en olieafscheider die:


      a. voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2, of


      b. zijn geplaatst voor het van toepassing worden van dit besluit of een deel daarvan op een activiteit in de
      inrichting en op de hoeveelheid afvalwater zijn afgestemd.


      4 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.23c
  - number: 3.23d
    text: >-
      1 Bij het lozen op of in de bodem of in een vuilwaterriool van afvalwater afkomstig van een bodembeschermende
      voorziening als gevolg van het uitwendig wassen van werktuigen waarmee gewasbeschermingsmiddelen zijn toegepast,
      wordt ten minste voldaan aan het tweede tot en met vijfde lid.


      2 Het afvalwater wordt geleid door een zuiveringsvoorziening waarmee ten minste 95% van de
      gewasbeschermingsmiddelen wordt verwijderd.


      3 Bij het lozen op of in de bodem bevat het afvalwater in enig steekmonster ten hoogste 20 milligram olie per liter
      en wordt het afvalwater gelijkmatig verspreid over een onverharde bodem.


      4 Bij het lozen in een vuilwaterriool bevat het afvalwater in enig steekmonster ten hoogste:


      a. 200 milligram olie per liter;


      b. 300 milligram onopgeloste stoffen per liter.


      5 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.23d
  - number: '3.24'
    text: |-
      Onverminderd [artikel 3.23d][ref1] is het lozen op of in de bodem van afvalwater als gevolg van het uitwendig
      wassen van motorvoertuigen of werktuigen of van spoorvoertuigen, toegestaan:

      a. indien in de inrichting per week ten hoogste een spoorvoertuig, motorvoertuig of werktuig, waarmee geen
      gewasbeschermingsmiddelen zijn toegepast, uitwendig wordt gewassen,

      b. indien in de inrichting per jaar ten hoogste twee werktuigen waarmee gewasbeschermingsmiddelen zijn toegepast,
      uitwendig worden gewassen, of

      c. indien het lozen plaatsvindt als gevolg van het uitwendig wassen van werktuigen waarmee
      gewasbeschermingsmiddelen zijn toegepast, op een perceel waar de gewasbeschermingsmiddelen zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.23d
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.24
