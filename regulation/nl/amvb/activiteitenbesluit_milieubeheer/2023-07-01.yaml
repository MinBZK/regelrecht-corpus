    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 29 maart 2007,
    nr. DJZ2007031290, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de Staatssecretaris van
    Verkeer en Waterstaat;


    Gelet op de richtlijn nr. 2003/30/EG van het Europees Parlement en de Raad van de Europese Unie van 8 mei 2003
    (PbEU L 123) ter bevordering van het gebruik van biobrandstoffen of andere hernieuwbare brandstoffen in het
    vervoer, richtlijn nr. 91/271/EEG van de Europese Gemeenschappen van 21 mei 1991 betreffende het stedelijk
    afvalwater (PbEG L 135), richtlijn 91/689/EEG van de Raad van de Europese Gemeenschappen van 12 december 1991
    betreffende gevaarlijke afvalstoffen (PbEG L 377), richtlijn 2000/53/EG van het Europees Parlement en de Raad
    van de Europese Unie van 11 maart 1999 inzake de beperking van de emissie van vluchtige organische stoffen ten
    gevolge van het gebruik van organische oplosmiddelen bij bepaalde werkzaamheden en installaties (PbEG L 85),
    richtlijn 2000/59/EG van het Europees Parlement en de Raad van de Europese Unie van 27 november 2000 betreffende
    havenontvangstvoorzieningen voor scheepsafval en ladingresiduen (PbEG L 332), richtlijn 2000/91/EG van het Europees
    Parlement en de Raad van 16 december 2002 betreffende de energieprestatie van gebouwen (PbEU 1), richtlijn 2000/60/
    EG van 23 oktober 2000 tot vaststelling van een kader voor communautaire maatregelen betreffende het waterbeleid
    (PbEG L 327), richtlijn 2006/11/EG van 15 februari 2006 betreffende de verontreiniging veroorzaakt door bepaalde
    gevaarlijke stoffen die in het aquatisch milieu van de Gemeenschap worden geloosd (PbEU L 64), richtlijn 80/86/EEG
    van de Raad van 17 december 1979 betreffende de bescherming van het grondwater tegen verontreiniging veroorzaakt
    door de lozing van bepaalde gevaarlijke stoffen (PbEG L 20), richtlijn 2006/118/EG van het Europees Parlement en de
    Raad van de Europese Unie van 12 december 2006 betreffende de bescherming van het grondwater tegen verontreiniging
    en achteruitgang van de toestand (Pb L 371) en op de artikelen 8.1, tweede lid, 8.40, 8.41 en 8.42 van de Wet
    milieubeheer, en op de artikelen 2a, eerste en tweede lid, 2b en 2c, van de Wet verontreiniging oppervlaktewateren;


    De Raad van State gehoord (advies van 28 juni 2007, nr. W08.07.0082/IV);


    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 15
    oktober 2007, nr. DJZ2007098397, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens de
    Staatssecretaris van Verkeer en Waterstaat;


    Hebben goedgevonden en verstaan:
