  - number: 3.119a
    text: |-
      1 Totdat met betrekking tot een inrichting die een activiteit verricht als bedoeld in [artikel 3.111][ref1] een
      wijziging waarop de [artikelen 3.115 tot en met 3.119][ref2] van toepassing zijn, is gemeld, worden binnen de
      inrichting niet meer landbouwhuisdieren per diercategorie gehouden, is de geurbelasting niet groter en is de
      afstand tot een geurgevoelig object niet kleiner dan:

      a. op grond van een vergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref3] mochten worden
      gehouden, mocht worden veroorzaakt onderscheidenlijk mocht bedragen tot het tijdstip waarop dit besluit op de
      inrichting van toepassing werd, of

      b. op grond van de betrokken algemene maatregel van bestuur mochten worden gehouden, mocht worden
      veroorzaakt onderscheidenlijk mocht bedragen, tot het van toepassing worden van dit besluit op de
      inrichting en waarvan in geval van oprichting of wijziging van de inrichting een melding als bedoeld in
      [artikel 8.41, eerste lid, van de Wet milieubeheer][ref4] is gedaan.

      2 Het eerste lid is niet van toepassing op de afstand tot een geurgevoelig object indien deze is afgenomen anders
      dan door wijziging van de inrichting.


