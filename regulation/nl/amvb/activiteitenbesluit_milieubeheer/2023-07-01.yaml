  - number: 1.21c
    text: |-
      Bij een melding als bedoeld in [artikel 1.10][ref1] worden, indien sprake van een stookinstallatie met een nominaal
      thermisch ingangsvermogen van 1 MW of meer en minder dan 50 MW, tevens de volgende gegevens verstrekt:

      a. het nominaal thermisch ingangsvermogen (MWth) van de stookinstallatie;

      b. het type stookinstallatie, onderverdeeld in gasmotor, dieselmotor, dual-fuelmotor, gasturbine, ketel, fornuis,
      droger, luchtverhitter of andere stookinstallatie;

      c. het type gebruikte brandstoffen en het aandeel ervan, onderverdeeld naar vaste biomassa, andere vaste brandstof,
      gasolie, andere vloeibare brandstoffen dan gasolie, aardgas, vergistingsgas en andere gasvormige brandstoffen;

      d. de sector waarin de stookinstallatie werkt of de inrichting waarin zij wordt gebruikt (4-cijferige NACE-code);

      e. het verwachte aantal jaarlijkse bedrijfsuren van de stookinstallatie en de gemiddelde belasting tijdens gebruik;

      f. indien het betreft een stookinstallatie als bedoeld in [artikel 3.7, tweede lid, onder b][ref2], een door de
      exploitant ondertekende verklaring dat hij de stookinstallatie niet meer dan het in dat lid genoemde aantal uren
      zal exploiteren.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.7
