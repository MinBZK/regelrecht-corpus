        bwb_id: BWBR0013402
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3.114'
        hoofdstuk: '3'
        paragraaf: 3.5.8
        afdeling: '3.5'
  - number: '3.113'
    text: >-
      Binnen een zeer kwetsbaar gebied of in een zone van 250 meter rondom een zodanig gebied, vindt het oprichten van
      een dierenverblijf, indien voorafgaand aan het oprichten geen sprake is van een inrichting waar landbouwhuisdieren
      worden gehouden, niet plaats, tenzij het dierenverblijf bestemd is voor landbouwhuisdieren die uitsluitend of in
      hoofdzaak worden gehouden ten behoeve van natuurbeheer.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.113
  - number: '3.114'
    text: |-
      1 Binnen een inrichting waar landbouwhuisdieren worden gehouden in een dierenverblijf dat is gelegen binnen een
      zeer kwetsbaar gebied of in een zone van 250 meter rondom een zodanig gebied, vindt het uitbreiden van het aantal
      landbouwhuisdieren van een of meer diercategorieën niet plaats, tenzij:

      a. de ammoniakemissie na de uitbreiding niet meer bedraagt dan de ammoniakemissie uit de tot de inrichting
      behorende dierenverblijven die de inrichting:

      1°. voorafgaand aan de uitbreiding zou mogen veroorzaken, indien de emissie per dierplaats gelijk zou zijn aan de
      maximale emissiewaarde, of

      2°. voorafgaand aan de uitbreiding mocht veroorzaken, indien deze lager is dan de ammoniakemissie als bedoeld onder
      1°;

      b. in de inrichting op 31 december 2001 melkrundvee werd gehouden, de uitbreiding uitsluitend melkrundvee betreft
      en de ammoniakemissie na de uitbreiding niet meer bedraagt dan de ammoniakemissie die een melkrundveehouderij
      met 200 stuks melkvee en 140 stuks vrouwelijk jongvee in geval van oprichting zou veroorzaken, indien de
      ammoniakemissie per dierplaats gelijk zou zijn aan de maximale emissiewaarde;

      c. de uitbreiding schapen of paarden betreft;

      d. de uitbreiding dieren betreft die worden gehouden overeenkomstig de regels die krachtens
      [artikel 2 van de Landbouwkwaliteitswet][ref1] zijn gesteld ten aanzien van de biologische productiemethoden, of

      e. de uitbreiding dieren betreft die worden gehouden uitsluitend of in hoofdzaak ten behoeve van natuurbeheer.

      2 Het eerste lid is van overeenkomstige toepassing op het zodanig wijzigen van een huisvestingssysteem dat de
      ammoniakemissie per dierplaats toeneemt, tenzij de wijziging bestaat uit een aanpassing van het systeem die
      noodzakelijk is op grond van de wettelijke voorschriften op het gebied van dierenwelzijn en slechts voor zover het
      aantal dierplaatsen niet wordt uitgebreid.

      3 Voor het bepalen van de ammoniakemissie uit de dierenverblijven die de inrichting
      voorafgaand aan de uitbreiding, bedoeld in het eerste lid, zou mogen veroorzaken, worden de
      ammoniakemissie van de dieren waarvoor eerder een vergunning is verleend met toepassing van
      __REF000___________________________________________________________________________________________________________
      ____________________________________ en de ammoniakemissie van de dieren waarmee de inrichting op grond van het
      eerste lid, onderdelen b, c, d of e, is uitgebreid, niet meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013402#Artikel5
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.114
