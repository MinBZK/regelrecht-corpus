        paragraaf: 3.4.2
        afdeling: '3.4'
  - number: '2.24'
    text: |-
      1 Degene die een inrichting drijft waarin vloeibare brandstof of afgewerkte olie in een ondergrondse tank wordt
      opgeslagen stelt door verzekering of anderszins financiële zekerheid ter dekking van de aansprakelijkheid die
      voortvloeit uit verontreiniging van de bodem als gevolg van dat opslaan of het drijven van het tankstation. De
      eerste volzin is niet van toepassing op het Rijk.

      2 De zekerheid bedraagt € 225.000 per ondergrondse tank. Bij meer dan zes ondergrondse tanks bedraagt de zekerheid
      in totaal € 1.361.340,65.

      3 De zekerheid wordt in stand gehouden vanaf het tijdstip waarop het opslaan aanvangt tot vier weken na toezending
      van een rapport als bedoeld in [artikel 2.11, derde lid][ref1], aan het bevoegd gezag.

      4 Indien uit een rapport als bedoeld in [artikel 2.11, derde lid][ref2], blijkt dat de bodem met vloeibare
      brandstof of met afgewerkte olie is verontreinigd, wordt, in afwijking van het derde lid, de financiële zekerheid
      in stand gehouden tot het tijdstip waarop gedeputeerde staten aan degene die opslaat of een tankstation voor het
      wegverkeer drijft, schriftelijk hebben verklaard dat de door hen nodig geachte maatregelen zijn genomen. Degene
      die opslaat of een tankstation voor het wegverkeer drijft, kan gedeputeerde staten schriftelijk verzoeken om een
      verklaring als bedoeld in de eerste volzin. Gedeputeerde staten beslissen op het verzoek uiterlijk vier weken nadat
      het verzoek is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.11
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.24
