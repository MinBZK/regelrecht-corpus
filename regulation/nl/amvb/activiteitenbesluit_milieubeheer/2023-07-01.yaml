    text: |-
      1 Bij het bepalen van het maximaal geluidsniveau L, bedoeld in de [artikelen 2.17][ref1], [2.17a][ref2], 2.19,
      [2.19a][ref3] dan wel [2.20][ref4], blijft buiten beschouwing het geluid als gevolg van het uitrukken van
      motorvoertuigen ten behoeve van ongevallenbestrijding, spoedeisende medische hulpverlening, brandbestrijding en
      gladheidbestrijding en het vrijmaken van de weg na een ongeval.

      2 Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot het treffen van technische
      en organisatorische maatregelen ten aanzien van het uitrukken van motorvoertuigen ten behoeve van
      ongevallenbestrijding, spoedeisende medische hulpverlening, brandbestrijding en gladheidbestrijding en het
      vrijmaken van de weg na een ongeval, indien dat bijzonder is aangewezen in het belang van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.17
