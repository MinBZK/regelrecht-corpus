  - number: '5.44'
    text: |-
      1 De [artikelen 3.7, tweede lid, onder b en zesde lid][ref1], [3.10c][ref2], [3.10g tot en met 3.10j][ref3],
      [3.10n][ref4] en [3.10u][ref5] zijn van overeenkomstige toepassing op de emissiegrenswaarden in deze paragraaf.

      2 De emissiegrenswaarden in deze paragraaf gelden voor een stookinstallatie die voor 20 december 2018 in bedrijf is
      genomen vanaf:

      a. 1 januari 2019 voor een installatie voor de regeneratie van glycol;

      b. 1 januari 2025 voor een stookinstallatie anders dan een installatie voor de regeneratie van glycol, met een
      nominaal thermisch ingangsvermogen van meer dan 5 MWth;

      c. 1 januari 2030 voor een stookinstallatie anders dan een installatie voor de regeneratie van glycol, met een
      nominaal thermisch ingangsvermogen van 1 MWth of meer en 5 MWth of minder.

      3 Tot de datum die ingevolge het tweede lid, onder b of c, van toepassing is, gelden voor die stookinstallatie de
      emissiegrenswaarden in de verleende omgevingsvergunning.

      4 Indien de in het derde lid bedoelde emissiegrenswaarden strenger zijn dan de emissiegrenswaarden of de
      emissiegrenswaarden tussen haakjes in deze paragraaf, dan blijven de emissiegrenswaarden in de verleende
      omgevingsvergunning ook van kracht na de in het tweede lid, onder b of c, genoemde datum.

      5 Het bevoegd gezag kan op grond van een BBT-afweging een strengere emissiegrenswaarde dan de in deze paragraaf
      gestelde emissiegrenswaarde stellen.

      6 Het toepassen van maatwerkvoorschriften als bedoeld in de [artikelen 5.44a, derde lid][ref6],
      [5.44b, vijfde lid][ref7], [5.44c, derde lid][ref8] en [5.44d, vierde lid][ref9], vindt plaats, indien de
      geografische ligging, de plaatselijke milieuomstandigheden of de technische kenmerken van de betrokken installatie
      daartoe aanleiding geven.


