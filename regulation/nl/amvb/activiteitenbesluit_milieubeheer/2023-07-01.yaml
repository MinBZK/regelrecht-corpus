  - number: '5.12'
    text: >-
      1 Indien bij een grote stookinstallatie de afgasreinigingsapparatuur is uitgevallen en deze apparatuur niet binnen
      24 uur weer normaal functioneert, wordt de grote stookinstallatie geheel of gedeeltelijk buiten gebruik gesteld of
      met een weinig vervuilende brandstof in bedrijf gehouden.


      2 Een grote stookinstallatie mag als gevolg van storingen als bedoeld in het eerste lid gedurende ten hoogste 120
      uur gedurende een periode van 12 maanden in bedrijf zijn zonder dat de afgasreinigingsapparatuur functioneert.


      3 Het bevoegd gezag kan bij maatwerkvoorschrift de periode, bedoeld in het eerste of tweede lid, verlengen, indien:


      a. het absoluut noodzakelijk is om de energievoorziening in stand te houden, of


      b. de betreffende grote stookinstallatie anders gedurende die periode vervangen zou worden door een
      stookinstallatie die over het geheel genomen hogere emissies zou veroorzaken.


      4 Degene die de inrichting drijft, meldt een geval als bedoeld in het eerste lid binnen 48 uur aan het bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.12
  - number: 5.12a
    text: |-
      1 Voor de toepassing van dit artikel wordt onder «netto elektrisch rendement» verstaan: de aan het landelijk
      hoogspanningsnet, bedoeld in [artikel 1, eerste lid, onderdeel j, van de Elektriciteitswet 1998][ref1], geleverde
      elektriciteit gedeeld door de energie-inhoud van de ingezette brandstoffen.

      2 In het geval van levering aan een warmtenet als bedoeld in [artikel 1, onderdeel c, van de Warmtewet][ref2],
      wordt het netto elektrisch rendement, bedoeld in het eerste lid, wat betreft:

      a. de energie-inhoud van de ingezette brandstoffen gecorrigeerd voor de energie-inhoud van de brandstoffen die
      additioneel worden gebruikt in verband met de warmtelevering, of

      b. de elektriciteitslevering berekend door de aan het landelijk hoogspanningsnet geleverde elektriciteit te
      verhogen met de elektriciteitsderving als gevolg van de warmtelevering.

      3 Het netto elektrisch rendement van een grote stookinstallatie die met steenkool of een combinatie van steenkool
      en een of meer andere brandstoffen wordt gestookt is ten minste 40,00%.

      4 Het netto elektrisch rendement wordt bepaald over de laatste vijf jaar dat de stookinstallatie in bedrijf is
      geweest of, indien de stookinstallatie minder dan vijf jaar in bedrijf is, over de periode dat de stookinstallatie
      elektriciteit heeft geleverd aan het landelijk hoogspanningsnet met een minimum van een jaar.

      5 Op verzoek van het bevoegd gezag overlegt degene die de inrichting drijft de gegevens over het netto elektrisch
      rendement van de stookinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel1
