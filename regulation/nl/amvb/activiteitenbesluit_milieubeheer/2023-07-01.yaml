      type B of een inrichting type C drijft, voor zover sprake is van een inrichting als bedoeld in de categorieën
      1.1, onderdeel c met een vermogen van 50 MW of meer, 1.4, onderdeel a, 1.4, onderdeel b, 1.4, onderdeel c met
      een vermogen van 50 MW of meer, 1.4, onderdeel d, 2.1 tot en met 2.6, 2.7, onderdelen a tot en met c, k tot en
      met o en q tot en met s, 3 tot en met 8, 9.1, onderdelen a tot en met e waarbij gebruik wordt gemaakt van een
      stookinstallatie met een nominaal thermisch ingangsvermogen van 100 kW of meer, 9.1, onderdeel f, 9.4, 10 tot
