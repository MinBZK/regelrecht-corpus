  - number: '3.15'
    text: >-
      1 De metingen van de geluidemissie ter bepaling van de bronsterkte van een windturbine of een combinatie van
      windturbines worden uitgevoerd overeenkomstig de bij ministeriële regeling te stellen eisen.


      2 De drijver van de inrichting registreert de bij ministeriële regeling te bepalen gegevens welke gedurende vijf
      kalenderjaren na dagtekening worden bewaard en ter inzage gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.15
  - number: 3.15a
    text: |-
      1 Het plaatsgebonden risico voor een buiten de inrichting gelegen kwetsbaar object, veroorzaakt door een
      windturbine of een combinatie van windturbines, is niet hoger dan 10-6 per jaar.

      2 Het plaatsgebonden risico voor een buiten de inrichting gelegen beperkt kwetsbaar object, veroorzaakt door een
      windturbine of een combinatie van windturbines, is niet hoger dan 10-5 per jaar.

      3 Ten behoeve van het bepalen van het plaatsgebonden risico, bedoeld in het eerste en tweede lid, kunnen bij
      ministeriële regeling afstanden worden vastgesteld, die minimaal aanwezig moeten zijn tussen een windturbine of een
      combinatie van windturbines en een buiten de inrichting gelegen kwetsbaar dan wel beperkt kwetsbaar object.

      4 Indien op grond van het derde lid afstanden zijn vastgesteld, worden die in acht genomen en zijn het eerste en
      tweede lid niet van toepassing.

      5 Bij ministeriële regeling kunnen regels worden gesteld over de berekening van het plaatsgebonden risico.

      6 Het eerste tot en met vijfde lid zijn niet van toepassing op een windturbine of een combinatie daarvan waarvoor
      tot 1 januari 2011 een vergunning in werking en onherroepelijk was dan wel een melding was gedaan op grond
      van [artikel 1.10][ref1] ten aanzien van een kwetsbaar onderscheidenlijk beperkt kwetsbaar object, indien het
      plaatsgebonden risico ten gevolge van die windturbine of een combinatie van windturbines voor het betreffende
      kwetsbare onderscheidenlijk beperkt kwetsbare object voor 1 januari 2011 groter is dan 10-6 onderscheidenlijk 10-5
      per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.15a
    references:
