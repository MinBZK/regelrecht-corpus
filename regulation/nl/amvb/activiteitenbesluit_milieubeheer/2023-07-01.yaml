    text: >-
      Deze paragraaf is van toepassing op het in werking hebben van een IPPC-installatie voor de productie van
      titaandioxide.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.31
  - number: '5.32'
    text: >-
      Het is verboden de volgende afvalstoffen te brengen in het oppervlaktewater, het grondwater of het zeewater:


      a. vaste afvalstoffen;


      b. moederlogen afkomstig uit de filtratiefase na de hydrolyse van de oplossing van titanylsulfaat van een
      installatie die het sulfaatproces toepast, waartoe in elk geval behoren:


      1°. zure afvalstoffen die met deze logen zijn gecombineerd en die gemiddeld meer dan 0,5 procent vrij zwavelzuur en
      verschillende zware metalen bevatten;


      2°. die moederlogen welke zijn verdund tot ze 0,5 procent of minder vrij zwavelzuur bevatten;


      c. afvalstoffen afkomstig van een installatie die het chlorideproces toepast en die meer dan 0,5 procent vrij
      zoutzuur en verschillende zware metalen bevatten, waartoe in elk geval behoren: afvalstoffen die zijn verdund tot
      ze 0,5 procent of minder vrij zoutzuur bevatten;


      d. filterzouten en slibvormige en vloeibare afvalstoffen die vrijkomen bij de behandeling, in de vorm van
      concentratie of neutralisatie, van de onder b en c genoemde afvalstoffen en die verschillende zware metalen
      bevatten, uitgezonderd geneutraliseerde en gefilterde of gedecanteerde afvalstoffen die slechts sporen van zware
      metalen bevatten en die, vóór enigerlei verdunning, een pH-waarde van meer dan 5,5 hebben.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.32
