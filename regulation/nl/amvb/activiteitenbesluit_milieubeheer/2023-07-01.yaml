  - number: 4.31a
    text: >-
      Deze paragraaf is van toepassing op het wegen of mengen van rubbercompounds of op het verwerken van rubber,
      thermoplastisch kunststof of polyesterhars.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.31a
  - number: 4.31b
    text: |-
      1 Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het wegen of mengen
      van rubbercompounds de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur, en

      b. 50 milligram per normaal kubieke meter, indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.

      2 Onverminderd [artikel 2.5][ref3] en [2.6][ref4] is bij het wegen of mengen van rubbercompounds of het
      verwerken van rubber of thermoplastisch kunststof de emissie van stoffen die onder een minimalisatieverplichting
      vallen, niet meer dan 0,05 milligram per normaal kubieke meter, indien de massastroom van stoffen met een
      minimalisatieverplichting meer bedraagt dan 0,15 gram per uur.

      3 Bij ministeriële regeling worden stoffen als bedoeld in het tweede lid aangewezen.

      4 Bij het wegen of mengen van rubbercompounds of het verwerken van rubber, thermoplastisch kunststof of
      polyesterhars wordt ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het beperken van diffuse
      emissies en het doelmatig verspreiden van emissies naar de buitenlucht voldaan aan de bij ministeriële regeling
      gestelde eisen.


