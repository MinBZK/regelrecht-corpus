  - number: '3.26'
    text: >-
      Deze paragraaf is van toepassing op:


      a. het demonteren van autowrakken of wrakken van tweewielige motorvoertuigen,


      b. het aftappen van vloeistoffen uit autowrakken of wrakken van tweewielige motorvoertuigen,


      c. het opslaan van autowrakken of wrakken van tweewielige motorvoertuigen voorafgaand aan het demonteren en het
      aftappen van vloeistoffen,


      d. het opslaan van afvalstoffen die vrijkomen bij het demonteren van autowrakken of wrakken van tweewielige
      motorvoertuigen en het aftappen van vloeistoffen uit autowrakken of wrakken van tweewielige motorvoertuigen, en


      e. het neutraliseren van airbags en gordelspanners.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26
  - number: 3.26a
    text: |-
      Bij de activiteiten, bedoeld in [artikel 3.26][ref1], wordt ten behoeve van:

      a. een doelmatig beheer van afvalstoffen;

      b. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan, en

      c. het realiseren van een verwaarloosbaar bodemrisico;

      ten minste voldaan aan de bij ministeriële regeling te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26a
