  - number: '5.9'
    text: |-
      1 Bij gelijktijdig gebruik van verschillende soorten brandstof in een grote stookinstallatie gelden
      als emissiegrenswaarden voor zwaveldioxide, stikstofoxiden en totaal stof de gewogen gemiddelden van de
      emissiegrenswaarden die op grond van de [artikelen 5.4 tot en met 5.7][ref1] voor elk van de brandstoffen
      afzonderlijk zouden gelden.

      2 Een gewogen gemiddelde als bedoeld in het eerste lid wordt per tijdseenheid berekend naar het aandeel van elk van
      de brandstoffen in de energetische inhoud van de toegevoerde brandstoffen.

      3 In afwijking van het eerste lid stelt het bevoegd gezag bij vergunningvoorschrift voor een bestaande grote
      stookinstallatie een emissiegrenswaarde voor zwaveldioxide vast van gemiddeld ten hoogste 500 mg/Nm indien:

      a. die installatie deel uitmaakt van een raffinaderij, en

      b. die installatie destillatie- of omzettingsresiduen afkomstig van het raffineren van ruwe aardolie, alleen of in
      combinatie met andere brandstoffen, zelf verbruikt.

      4 De emissiegrenswaarden, bedoeld in de [artikelen 5.4 tot en met 5.8][ref2], gelden niet voor gasturbines,
      gasmotoren en dieselmotoren die blijkens de daarvoor geldende omgevingsvergunning bestemd zijn voor noodgevallen en
      minder dan 500 bedrijfsuren per jaar in bedrijf zijn. Degene die de inrichting drijft, registreert de bedrijfsuren
      van dergelijke installaties.

      5 Voor de toepassing van het vierde lid wordt onder bedrijfsuren verstaan: de tijd, uitgedrukt in uren, gedurende
      welke een grote stookinstallatie geheel of gedeeltelijk in werking is en emissies in de lucht veroorzaakt, met
      uitzondering van de voor de inwerkingstelling en stillegging benodigde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel5.4
