      2 Bij het lozen in het vuilwaterriool van afvalwater dat vrijkomt bij een of meer processen als bedoeld in het
      eerste lid bedraagt het gehalte aan vluchtige organohalogeenverbindingen uitgedrukt als chloor niet meer dan 0,1
      milligram per liter.

      3 Het te lozen afvalwater, bedoeld in het eerste lid, kan op een doelmatige wijze worden bemonsterd.


