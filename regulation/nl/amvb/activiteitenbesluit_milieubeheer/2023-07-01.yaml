  - number: '2.15'
    text: >-
      1 Degene die de inrichting drijft neemt alle maatregelen ter verduurzaming van het energiegebruik met een
      terugverdientijd van vijf jaar of minder, waarbij onder maatregelen ter verduurzaming van het energiegebruik worden
      verstaan:


      a. energiebesparende maatregelen;


      b. maatregelen voor het jaarlijks produceren van hernieuwbare energie in de inrichting tot ten hoogste het
      jaarlijkse energiegebruik van de energiedrager waarvoor jaarlijks hernieuwbare energie geproduceerd wordt; en


      c. maatregelen voor het vervangen van een energiedrager die leiden tot een lagere emissie van kooldioxide.


      2 Degene die de inrichting drijft rapporteert uiterlijk op 1 december 2023 en daarna eenmaal per vier jaar aan het
      bevoegd gezag welke maatregelen ter verduurzaming van het energiegebruik zijn getroffen.


      3 Indien andere maatregelen zijn uitgevoerd dan de maatregelen die bij ministeriële regeling zijn aangewezen, voor
      zover deze op de inrichting van toepassing zijn, worden deze maatregelen in de rapportage omschreven.


      4 Het bevoegd gezag kan bij maatwerkvoorschrift een gefaseerde uitvoering van de verplichting, bedoeld in het
      eerste lid, toestaan waarbij rekening wordt gehouden met de bedrijfseconomische omstandigheden van de inrichting.
      Hierbij stelt het bevoegd gezag per maatregel een redelijke termijn vast waarbinnen die maatregel moet zijn
      uitgevoerd.


      5 Indien aannemelijk is dat niet wordt voldaan aan het eerste lid, kan het bevoegd gezag degene die de inrichting
      drijft waarvan het energiegebruik in enig kalenderjaar groter is dan 200.000 kilowatt uur aan elektriciteit of
      groter is dan 75.000 kubieke meter aardgasequivalenten, verplichten om binnen een door het bevoegd gezag te bepalen
      termijn, onderzoek te verrichten of te laten verrichten waaruit blijkt of aan het eerste lid wordt voldaan. Het
      onderzoek wordt verricht naar de maatregelen bedoeld in het eerste lid, voor zover deze niet zien op een gebouw of
      een deel van een gebouw.


      6 Indien uit het onderzoek, bedoeld in het vijfde lid, blijkt dat niet wordt voldaan aan het eerste lid, neemt
      degene die de inrichting drijft de in het eerste lid bedoelde maatregelen binnen een door het bevoegd gezag te
      bepalen redelijke termijn.


      7 Het eerste en tweede lid zijn niet van toepassing indien:


      a. het energiegebruik in de inrichting in enig kalenderjaar kleiner is dan 50.000 kilowatt uur aan elektriciteit en
      kleiner is dan 25.000 kubieke meter aardgasequivalenten; of


      b. als voor het energiegebruik alleen gebruik wordt gemaakt van hernieuwbare energie die wordt geproduceerd binnen
      de inrichting.


      8 Onder de in het eerste lid bedoelde maatregelen worden niet verstaan maatregelen voor het gebruik van biomassa
      voor de productie van elektriciteit en laagwaardige warmte met een temperatuur van ten hoogste 100 °C.


      9 Degene die een inrichting drijft, waarvan het energiegebruik in enig kalenderjaar groter is dan 10.000.000
      kilowatt uur aan elektriciteit of 170.000 kubieke meter aardgasequivalenten:


      a. rapporteert overeenkomstig het tweede lid, over de maatregelen ter verduurzaming van het energiegebruik die zien
      op een gebouw of een deel van een gebouw; en


      b. verricht onderzoek naar alle mogelijke maatregelen ter verduurzaming van het energiegebruik gericht op de
      activiteiten en processen binnen de inrichting met een terugverdientijd van ten hoogste vijf jaar.


      10 Degene die de inrichting, als bedoeld in het negende lid, drijft, rapporteert uiterlijk op 1 december 2023 en
      daarna eenmaal per vier jaar aan het bevoegd gezag over de verplichtingen, bedoeld in het negende lid.


      11 Onder de verplichting, bedoeld in het eerste lid, wordt mede verstaan het doelmatig beheer en onderhoud van de
      maatregelen ter verduurzaming van het energiegebruik.
