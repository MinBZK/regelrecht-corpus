    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van de activiteiten genoemd in de
      [paragrafen 4.5.1 tot en met 4.5.11][ref1] wordt ten minste voldaan aan de [artikelen 4.71 tot en met 4.74][ref2].


