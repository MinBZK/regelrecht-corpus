  - number: 2.8a
    text: |-
      Voor een inrichting type C waarvoor onmiddellijk voorafgaand aan het tijdstip van het van toepassing worden
      van dit besluit of een deel daarvan op een activiteit in die inrichtingen een omgevingsvergunning op grond
      van [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1]
      in werking en onherroepelijk was, worden de geurvoorschriften van die vergunning in afwijking van
      [artikel 6.1, eerste lid][ref2], na het van toepassing worden van dit besluit of een deel daarvan op een
      activiteit in die inrichtingen, tot het tijdstip waarop de Omgevingswet in werking treedt aangemerkt als
      maatwerkvoorschriften, mits de geurvoorschriften van de vergunning vallen binnen de bevoegdheid van het bevoegd
      gezag tot het stellen van maatwerkvoorschriften en voor zover dit besluit op de inrichting van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6.1
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.8a
    references:
