      cadmiumhoudend soldeermiddel de emissieconcentratie van cadmium en cadmiumverbindingen, niet meer dan 0,05
      milligram per normaal kubieke meter indien de massastroom van cadmium en cadmiumverbindingen naar de lucht meer
      bedraagt dan 10 gram per uur.


