  - number: '3.116'
    text: |-
      1 Het oprichten, uitbreiden of wijzigen van een dierenverblijf met dieren met geuremissiefactor vindt niet plaats,
      indien na de oprichting, uitbreiding of wijziging de afstand tussen het dierenverblijf en:

      a. een geurgevoelig object dat deel uitmaakt van een andere veehouderij;

      b. een geurgevoelig object dat op of na 19 maart 2000 heeft opgehouden deel uit te maken van een andere
      veehouderij, of

      c. een woning die op of na 19 maart 2000 is gebouwd:

      1°. op een kavel die op dat tijdstip in gebruik was als veehouderij;

      2°. in samenhang met het geheel of gedeeltelijk buiten werking stellen van de veehouderij, en

      3°. in samenhang met de sloop van de bedrijfsgebouwen die onderdeel hebben uitgemaakt van de veehouderij:

      minder dan 100 meter bedraagt, indien het object, bedoeld in onderdeel a, b of c, binnen de bebouwde kom is
      gelegen, of

      minder dan 50 meter bedraagt, indien het object, bedoeld in onderdeel a, b of c, buiten de bebouwde kom is gelegen.

      2 Het eerste lid is van overeenkomstige toepassing op een geurgevoelig object dat op de kavel, bedoeld in onderdeel
      c van dat lid, aanwezig is.

      3 Het eerste lid is niet van toepassing indien de geurbelasting op het object, bedoeld in de onderdelen a, b of c
      van dat lid, lager is dan de waarde die volgens [artikel 3.115, eerste lid][ref1], geldt voor het gebied waarin dat
      object ligt.

      4 Het eerste lid is eveneens niet van toepassing als bij de oprichting, uitbreiding of wijziging van een
      dierenverblijf de geurbelasting op een geurgevoelig object niet toeneemt, het aantal dieren per diercategorie met
      geuremissiefactor binnen de inrichting niet toeneemt en de afstand van het dierenverblijf tot een geurgevoelig
      object niet afneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.115
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.116
