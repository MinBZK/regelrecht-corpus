  - number: 2.11a
    text: |-
      1 Deze afdeling is van toepassing op degene die een inrichting type A of een inrichting type B drijft.

      2 In afwijking van het eerste lid is [artikel 2.12][ref1] van toepassing op degene die een inrichting type A, een
      inrichting type B of een inrichting type C drijft.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.12
