  - number: '6.6'
    text: >-
      Voor de toepassing van dit besluit wordt als eerste dag van de termijn waarbinnen wordt gekeurd aangemerkt: de dag
      waarop voor het laatst is gekeurd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel6.6
  - number: 6.7a
    text: |-
      Maatwerkvoorschriften als bedoeld in [artikel 2.2, derde lid][ref1], zoals dat luidde vóór 22 december
      2009, met betrekking tot het lozen in het oppervlaktewater en gesteld vóór dat tijdstip, worden
      aangemerkt als een vergunning voor het brengen van stoffen in een oppervlaktewaterlichaam als bedoeld in
      [artikel 6.2, eerste lid, van de Waterwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel6.7a
