                    45 dB(A)






      4 Voor inrichtingen waarop tot 1 januari 2008 het
      [Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer][ref3],
      het [Besluit detailhandel en ambachtsbedrijven milieubeheer][ref4] of het
      [Besluit woon- en verblijfsgebouwen milieubeheer][ref5] van toepassing was, zijn de waarden uit dit artikel niet
      van toepassing op de gevel van onderscheidenlijk een dienst- of bedrijfswoning dan wel een woning die deel uitmaakt
      van een inrichting.


