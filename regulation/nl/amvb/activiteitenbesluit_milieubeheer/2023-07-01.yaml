  - number: '3.130'
    text: >-
      Deze paragraaf is van toepassing op het bereiden van voedingsmiddelen met:


      a. keukenapparatuur;


      b. grootkeukenapparatuur;


      c. één of meer bakkerijovens die chargegewijs beladen worden, of


      d. één of meer bakkerijovens die continu beladen worden met een nominaal vermogen van ten hoogste 400 kilowatt.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.130
  - number: '3.131'
    text: |-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het bereiden van voedingsmiddelen en daarmee
      samenhangende activiteiten wordt ten minste voldaan aan het tweede tot en met het vijfde lid.

      2 Indien niet in een vuilwaterriool geloosd kan worden, is lozen anders dan in een vuilwaterriool toegestaan,
      indien het afvalwater gezamenlijk met huishoudelijk afvalwater wordt geloosd en de voorzieningen voor het zuiveren
      van huishoudelijk afvalwater zijn berekend op het zuiveren van het afvalwater afkomstig van het bereiden van
      voedingsmiddelen en daarmee samenhangende activiteiten.

      3 Afvalwater dat afvalstoffen bevat, die door versnijdende of vermalende apparatuur zijn versneden of vermalen,
      wordt niet geloosd.

      4 Het vethoudende afvalwater wordt voorafgaand aan de vermenging met ander niet-vethoudend afvalwater geleid door
      een vetafscheider en slibvangput die voldoen aan en worden gebruikt conform NEN-EN 1825-1 en 2. In afwijking van
      NEN-EN 1825-1 en 2 kan met een lagere frequentie van het ledigen en reinigen dan daarin vermeld worden volstaan,
      indien een lagere frequentie geen nadelige gevolgen heeft voor het doelmatig functioneren van de afscheider.

      5 Bij maatwerkvoorschrift kan het bevoegd gezag in afwijking van het vierde lid, het lozen zonder een vetafscheider
      en slibvangput toestaan, indien gelet op het vetgehalte in het te lozen afvalwater in combinatie met de hoeveelheid
      te lozen afvalwater, het lozen geen nadelige gevolgen heeft voor de doelmatige werking van de voorzieningen voor
      het beheer van afvalwater. [Artikel 2.2, vierde lid][ref1], is van overeenkomstige toepassing.

      6 Het vierde lid is niet van toepassing indien voor het tijdstip waarop dat artikel op de inrichting van toepassing
      werd een slibvangput en een vetafscheider zijn geplaatst die op de hoeveelheid afvalwater is afgestemd.

      7 Indien op een inrichting voor 1 januari 2008 een besluit als bedoeld in [artikel 6.43][ref2] van toepassing was
      en vanuit die inrichting het afvalwater van het vervaardigen of bereiden van voedingsmiddelen werd geloosd zonder
      behandeling in een vetafscheider en slibvangput die voldoen aan NEN-EN-1825-1 en 2 dan wel op de hoeveelheid
      afvalwater is afgestemd, geldt voor dat lozen een ontheffing die als maatwerkvoorschrift als bedoeld in het vijfde
      lid wordt aangemerkt.

      8 Het zevende lid is van overeenkomstige toepassing op een inrichting waarop van 1 januari 2008 tot
      1 januari 2013 het [Besluit landbouw milieubeheer][ref3], het [Besluit mestbassins milieubeheer][ref4] of het
      [Besluit glastuinbouw][ref5] van toepassing was.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref3]: https://wetten.overheid.nl/BWBR0020112
      [ref4]: https://wetten.overheid.nl/BWBR0004990
      [ref5]: https://wetten.overheid.nl/BWBR0013430
