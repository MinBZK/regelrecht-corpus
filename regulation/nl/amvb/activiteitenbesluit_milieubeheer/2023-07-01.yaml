  - number: 3.30a
    text: >-
      Met betrekking tot het vulpunt van een ondergrondse opslagtank met organische oplosmiddelen of de opstelplaats
      van een tankwagen met organische oplosmiddelen, wordt ten opzichte van buiten de inrichting gelegen kwetsbare en
      beperkt kwetsbare objecten een afstand aangehouden van tenminste 20 meter.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.30a
  - number: '3.31'
    text: |-
      1 Deze paragraaf is van toepassing op het op- en overslaan van inerte goederen.

      2 Onverminderd het eerste lid is deze paragraaf voor zover het betreft inrichtingen type B van toepassing
      op het op- en overslaan van goederen, niet zijnde inerte goederen, voor zover dat niet is geregeld in de
      [paragrafen 3.3.3][ref1], [3.4.1][ref2], [3.4.2][ref3], [3.4.5 tot en met 3.4.7][ref4], [3.4.11][ref5],
      [4.1.1 tot en met 4.1.4][ref6] en [4.1.7.][ref7]

      3 Onverminderd het eerste lid is deze paragraaf voor zover het betreft inrichtingen type C van toepassing op:

      a. het op- en overslaan van goederen, niet zijnde inerte goederen, voor zover dat niet is geregeld
      in de [paragrafen 3.4.1][ref8], [3.4.2][ref9], [3.4.4 tot en met 3.4.7][ref10], [3.4.11][ref11],
      [4.1.1 tot en met 4.1.4][ref12] en [4.1.7][ref13], bij:

      1°. een autodemontagebedrijf of een demontagebedrijf voor tweewielige motorvoertuigen;

      2°. een zuiveringtechnisch werk, of

      3°. een inrichting waar uitvoering wordt gegeven aan [titel 10.4 van de wet][ref14];

      b. het lozen in een aangewezen oppervlaktewaterlichaam als gevolg van het op- en overslaan van andere goederen dan
      inerte goederen.

      4 Onverminderd het eerste tot en met derde lid is deze paragraaf van toepassing op het zeven van grond met een
      capaciteit daarvoor van minder dan 100.000 ton per jaar.

      5 Bij ministeriële regeling worden goederen aangewezen welke in ieder geval worden aangemerkt als inerte goederen.


