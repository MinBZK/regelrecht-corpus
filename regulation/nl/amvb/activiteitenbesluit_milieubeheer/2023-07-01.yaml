  - number: '6.3'
    text: |-
      1 Een ontheffing op grond van de [artikelen 14, tweede lid][ref1], [24, tweede lid][ref2], en
      [25, tweede lid, van het Lozingenbesluit bodembescherming][ref3] met betrekking tot het lozen, bedoeld in
      [artikel 2.2, eerste lid, onder a, of tweede lid][ref4], wordt gedurende de resterende termijn van die ontheffing
      aangemerkt als een maatwerkvoorschrift als bedoeld in artikel 2.2, derde lid.

      2 In afwijking van [artikel 6.2, eerste lid][ref5], wordt een vergunning als bedoeld in
      [artikel 1, tweede lid, van de Wet verontreiniging oppervlaktewateren][ref6] dan wel een vergunning op grond van
      [artikel 6.2 van de Waterwet][ref7] met betrekking tot het lozen, bedoeld in [artikel 3.1, vijfde lid][ref8],
      gedurende de resterende termijn van die vergunning aangemerkt als een maatwerkvoorschrift als bedoeld in artikel
      3.1, zesde lid, onder b.

      3 Onverminderd [artikel 6.2, derde en vierde lid][ref9], is het lozen vanuit een bodemsanering in het
      vuilwaterriool dat op het tijdstip van het van toepassing worden van dit besluit of een deel daarvan op
      een inrichting was toegestaan volgens het [Lozingenbesluit Wvo bodemsanering en proefbronnering][ref10], in
      afwijking van [artikel 3.1, vijfde lid][ref11], toegestaan en worden de [artikelen 5, eerste lid][ref12],
      [6, eerste tot en met derde lid][ref13], [7, eerste lid][ref14], [8][ref15], [12][ref16], [13][ref17] en
      [14 van dat besluit][ref18] aangemerkt als een maatwerkvoorschrift als bedoeld in artikel 3.1, zesde lid, onder b.

      4 Indien op het tijdstip van het van toepassing worden van dit besluit of een deel daarvan op een
      inrichting het lozen van huishoudelijk afvalwater in een oppervlaktewaterlichaam was toegestaan op grond van
      [artikel 14 van het Lozingenbesluit Wvo huishoudelijk afvalwater][ref19], blijft die toestemming gelden gedurende
      de termijn die volgt uit de toepassing van dat artikel.

      5 Voor het lozen, bedoeld in [artikel 2.2, eerste lid, onder b][ref20], waarvoor op 24 april 2013 een ontheffing
      gold op grond van [artikel 10.63, eerste lid, van de wet][ref21], geldt gedurende de op die datum resterende
      termijn waarvoor de ontheffing was verleend, een maatwerkvoorschrift als bedoeld in artikel 2.2, derde lid, waarvan
      de inhoud overeenkomt met de ontheffing.

      6 Voor de toepassing van dit artikel worden gegevens die in de aanvraag staan en die worden aangemerkt als
      onderdeel van de voorschriften van de ontheffing of vergunning aangemerkt als voorschriften van de ontheffing of
      vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
