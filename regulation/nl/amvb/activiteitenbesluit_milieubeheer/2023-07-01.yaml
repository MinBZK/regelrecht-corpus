  - number: '3.81'
    text: |-
      1 In afwijking van [artikel 3.80, eerste, derde lid, onderdelen a en b, en vierde lid][ref1]
      bedraagt de teeltvrije zone langs de oppervlaktewaterlichamen, aangewezen in de
      [bijlage bij artikel 3 van het Uitvoeringsbesluit Meststoffenwet][ref2] ten minste 500 centimeter.

      2 In afwijking van [artikel 3.80][ref3] kan het bevoegd gezag, indien sprake is van een talud dat breder is dan 200
      centimeter, bij maatwerkvoorschrift een smallere teeltvrije zone vaststellen.

      3 In afwijking van [artikel 3.80][ref4] kan het bevoegd gezag bij het lozen in een niet aangewezen
      oppervlaktewaterlichaam, indien het belang van de bescherming van het milieu daartoe noodzaakt, bij
      maatwerkvoorschrift een bredere teeltvrije zone vaststellen.


