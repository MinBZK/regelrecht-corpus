  - number: 3.10r
    text: |-
      1 In afwijking van [artikel 3.10b][ref1], voldoet het rookgas van een ketelinstallatie met een nominaal vermogen
      kleiner dan 1 MWth die voor 1 januari 2013 is geplaatst of in gebruik is genomen, totdat het tweede lid van
      toepassing wordt, aan de emissiegrenswaarden die tot 1 januari 2013 voor die installatie golden ingevolge
      het [Besluit typekeuring verwarmingstoestellen luchtverontreiniging stikstofoxiden][ref2], dan wel aan de
      daarvan afwijkende emissiegrenswaarden, die voor die stookinstallatie golden ingevolge een daarvoor verleende
      omgevingsvergunning of ingevolge het derde of vierde lid.

      2 Het rookgas van een ketelinstallatie als bedoeld in het eerste lid, voldoet aan de in [artikel 3.10b][ref3]
      genoemde emissiegrenswaarden vanaf het tijdstip dat:

      a. de branders zijn vervangen;

      b. wijzigingen zijn aangebracht die met nieuwbouw van de ketelinstallatie overeenkomen, of

      c. een wijziging wordt doorgevoerd, die leidt tot een toename van emissies van de stoffen, genoemd in
      [artikel 3.10b][ref4], met meer dan 10 procent.

      3 In afwijking van [artikel 3.10b][ref5] en onverminderd het eerste lid, voldoet het rookgas van een
      ketelinstallatie met een nominaal vermogen tussen 500 kWth en 1 MWth, waarin biomassa wordt verbrand of waarin
      houtpellets, voor zover het geen biomassa betreft worden verbrand, die in gebruik is genomen tussen 1 januari 2013
      en 1 januari 2015, aan een emissiegrenswaarde van 75 mg per normaal kubieke meter voor totaal stof, herleid op
      rookgas met een volumegehalte aan zuurstof van 6%, totdat aan een van de criteria, bedoeld in het tweede lid, wordt
      voldaan.

      4 In afwijking van [artikel 3.10b][ref6] en onverminderd het eerste lid, voldoet het rookgas van een
      ketelinstallatie met een nominaal vermogen kleiner dan of gelijk aan 500 kWth, waarin biomassa wordt verbrand
      of waarin houtpellets, voor zover het geen biomassa betreft worden verbrand, die in gebruik is genomen tussen
      1 januari 2013 en 1 januari 2015, aan een emissiegrenswaarde van 150 mg per normaal kubieke meter voor normaal
      stof, herleid op rookgas met een volumegehalte aan zuurstof van 6%, totdat aan een van de criteria, bedoeld in het
      tweede lid, wordt voldaan.


