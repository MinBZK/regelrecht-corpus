  - number: '2.9'
    text: >-
      1 Indien in een inrichting een bodembedreigende activiteit wordt verricht worden bodembeschermende voorzieningen en
      bodembeschermende maatregelen getroffen waarmee een verwaarloosbaar bodemrisico wordt gerealiseerd.


      2 De bodembeschermende voorzieningen en bodembeschermende maatregelen voldoen aan de bij ministeriële regeling
      gestelde eisen in verband met de goede werking van die voorzieningen en maatregelen, en omtrent de controle
      van die eisen alsmede aan de bij ministeriële regeling gestelde eisen in verband met de mogelijkheid om
      bodemverontreiniging te kunnen signaleren.


      3 In de bij ministeriële regeling te bepalen gevallen zendt degene die de inrichting drijft de resultaten van het
      onderzoek in verband met de mogelijkheid om bodemverontreiniging te kunnen signaleren, bedoeld in het tweede lid,
      aan het bij die regeling aangegeven bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.9
  - number: 2.9a
    text: |-
      1 In afwijking van [artikel 2.9][ref1] kan het bevoegd gezag op aanvraag bij maatwerkvoorschrift bepalen dat een
      aanvaardbaar bodemrisico wordt gerealiseerd, indien:

      a. voor 1 januari 2008 binnen een inrichting een bodembedreigende activiteit werd uitgevoerd, of

      b. tot het van toepassing worden van dit besluit of een deel daarvan, binnen een inrichting een bodembedreigende
      activiteit werd uitgevoerd en voor die inrichting een vergunning in werking en onherroepelijk was.

      2 Een maatwerkvoorschrift als bedoeld in het eerste lid kan slechts worden gesteld indien het realiseren van een
      verwaarloosbaar bodemrisico redelijkerwijs niet kan worden gevergd en is voldaan aan het derde lid.

      3 Bij de aanvraag, bedoeld in het eerste lid, wordt een plan van aanpak gevoegd, waarin ten minste is vastgelegd:

      a. de wijze waarop het monitoringssysteem wordt uitgevoerd;

      b. de bodemkwaliteit op dat moment, zoals die is onderzocht en vastgelegd door een persoon of een instelling die
      daartoe beschikt over een erkenning op grond van het Besluit bodemkwaliteit;

      c. de wijze waarop en de termijn waarbinnen eventueel optredende verontreiniging of aantasting van de bodem
      wordt hersteld door een persoon of instelling die daartoe beschikt over een erkenning op grond van het Besluit
      bodemkwaliteit;

      d. de kosten die daarvoor worden geraamd en de wijze waarop hiervoor financiële zekerheid wordt gesteld.

      4 Het plan van aanpak, bedoeld in het derde lid, waarmee het bevoegd gezag heeft ingestemd maakt deel uit van het
      maatwerkvoorschrift.

      5 Onder een aanvaardbaar bodemrisico als bedoeld in het eerste lid wordt verstaan: een situatie als bedoeld in de
      NRB waarin een bodemrisico aanvaardbaar is gemaakt middels een monitoringssysteem en door het anticiperen op het
      beperken en zoveel mogelijk ongedaan maken van eventueel optredende verontreiniging of aantasting van de bodem.

      6 Het monitoringssysteem als bedoeld in het derde en vijfde lid voldoet aan bijlage 3 van deel 3 van de NRB en
      wordt uitgevoerd door een persoon of instelling die daartoe beschikt over een erkenning op grond van het Besluit
      bodemkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.9a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.9'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: '2.10'
    text: >-
      1 Om een verwaarloosbaar bodemrisico te realiseren voldoet een ondergrondse opslagtank aan de bij ministeriële
      regeling gestelde eisen in verband met:


      a. de goede werking van die opslagtank;


      b. de mogelijkheid om bodemverontreiniging te kunnen signaleren.


      2 Een kathodische bescherming voldoet aan de bij ministeriële regeling gestelde eisen in verband met de goede
      werking van die bescherming.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.10
  - number: '2.11'
    text: |-
      1 Indien in de inrichting een bodembedreigende activiteit wordt verricht, wordt uiterlijk binnen drie maanden na
      oprichting van de inrichting, een rapport met de resultaten van een onderzoek naar de bodemkwaliteit toegestuurd
      aan het bevoegd gezag.

      2 Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot het uitvoeren van een onderzoek naar de
      bodemkwaliteit bij een verandering van de inrichting, indien het gelet op de aard of de mate waarin de inrichting
      verandert, nodig is de bodemkwaliteit vast te leggen met het oog op een mogelijke aantasting of verontreiniging van
      de bodem die kan of is ontstaan door een bodembedreigende activiteit.

      3 Indien in de inrichting een bodembedreigende activiteit is verricht wordt uiterlijk binnen zes maanden na
      beëindiging van de inrichting of de IPPC-installatie of na beëindiging van het opslaan van vloeibare brandstof,
      afgewerkte olie of pekel in een ondergrondse opslagtank, een rapport met de resultaten van een onderzoek naar de
      bodemkwaliteit toegezonden aan het bevoegd gezag. In dit rapport wordt ten minste vermeld:

      a. de naam en adres van degene die het onderzoek heeft verricht;

      b. de wijze waarop het onderzoek is verricht;

      c. de aard en de mate van de aangetroffen verontreinigende stoffen en de herkomst daarvan;

      d. de mate waarin de bodemkwaliteit is gewijzigd ten opzichte van de situatie bij de oprichting of de verandering
      van de inrichting voor zover die situatie is vastgelegd in een rapport;

      e. de wijze waarop en de mate waarin de bodemkwaliteit wordt hersteld als bedoeld in het vijfde lid.

      4 De onderzoeken en rapporten, bedoeld in het eerste, tweede en derde lid, worden uitgevoerd onderscheidenlijk
      opgesteld door een persoon of een instelling die daartoe beschikt over een erkenning op grond van het
      [Besluit bodemkwaliteit][ref1].

      5 Indien uit het rapport, bedoeld in het derde lid, blijkt dat de bodem als gevolg van de activiteiten in de
      inrichting is aangetast of verontreinigd, draagt degene die de inrichting drijft er zorg voor dat binnen zes
      maanden na toezending van dat rapport aan het bevoegd gezag de bodemkwaliteit is hersteld tot:

      a. de situatie bij oprichting of verandering van de inrichting voor zover die situatie is vastgelegd in een
      rapport;

      b. de achtergrondwaarden als bedoeld in het [Besluit bodemkwaliteit][ref2] indien er geen rapport als bedoeld in
      onderdeel a beschikbaar is.

      Herstel vindt plaats voor zover dat met de beste beschikbare technieken redelijkerwijs haalbaar is.

      6 Het herstel van de bodemkwaliteit als bedoeld in het vijfde lid geschiedt door een persoon of een instelling die
      beschikt over een erkenning op grond van het [Besluit bodemkwaliteit][ref3].

      7 Degene die de inrichting drijft meldt de aanvang en de afronding van de werkzaamheden, bedoeld in het vijfde lid,
      direct aan het bevoegd gezag.

      8 De onderzoeken, bedoeld in het eerste tot en met derde lid, voldoen aan NEN 5740 en richten zich uitsluitend
      op de bodembedreigende stoffen die door de werkzaamheden ter plaatse een bedreiging voor de bodemkwaliteit vormen
      of vormden en op de plaatsen waar bodembedreigende activiteiten plaatsvinden, zullen plaatsvinden dan wel hebben
      plaatsgevonden.

      9 Een aanwezige vloeistofdichte vloer of verharding wordt ten behoeve van het onderzoek, bedoeld in het eerste lid
      of tweede lid, niet doorboord of anderszins aangetast.

      10 Bij ministeriële regeling kunnen bodembedreigende activiteiten worden aangewezen waarop dit artikel geheel of
      gedeeltelijk niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
      [ref2]: https://wetten.overheid.nl/BWBR0022929
      [ref3]: https://wetten.overheid.nl/BWBR0022929
