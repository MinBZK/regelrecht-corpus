  - number: 3.10v
    text: |-
      Onverminderd het gestelde in de [artikelen 3.10g][ref1] en [3.10h][ref2] neemt, indien de emissiegrenswaarden
      genoemd in de [artikelen 3.10 tot en met 3.10f][ref3] of in maatwerkvoorschriften niet worden nageleefd, degene die
      de inrichting drijft de nodige maatregelen om ervoor te zorgen dat die grenswaarden zo spoedig mogelijk weer worden
      nageleefd. Hij meldt zo spoedig mogelijk aan het bevoegd gezag het niet naleven, de oorzaak ervan en de genomen
      maatregelen.


