  - number: '3.4'
    text: >-
      1 Deze paragraaf is van toepassing op het lozen van huishoudelijk afvalwater en het behandelen van dit afvalwater
      voorafgaand daaraan. Het lozen van huishoudelijk afvalwater in een oppervlaktewaterlichaam of op of in de bodem is
      toegestaan indien het lozen plaatsvindt buiten een bebouwde kom of binnen een bebouwde kom van waaruit stedelijk
      afvalwater wordt geloosd met een vervuilingswaarde van minder dan 2000 inwonerequivalenten en de afstand tot het
      dichtstbijzijnde vuilwaterriool of een zuiveringtechnisch werk waarop kan worden aangesloten meer bedraagt dan:


      a. 40 meter bij niet meer dan 10 inwonerequivalenten;


      b. 100 meter bij meer dan 10 doch minder dan 25 inwonerequivalenten;


      c. 600 meter bij 25 doch minder dan 50 inwonerequivalenten;


      d. 1500 meter bij 50 doch minder dan 100 inwonerequivalenten; en


      e. 3.000 meter bij 100 of meer inwonerequivalenten.


      2 De afstand, bedoeld in het eerste lid, wordt berekend:


      a. vanaf de kadastrale grens van het perceel waar het huishoudelijk afvalwater vrijkomt; en


      b. langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.


      3 Indien de afstand, bedoeld in het eerste lid, minder bedraagt dan de afstanden, genoemd in dat lid, kan het
      bevoegd gezag indien het belang van de bescherming van de bodem of de kwaliteit van een oppervlaktewaterlichaam
      zich daartegen niet verzet, bij maatwerkvoorschrift het lozen op of in de bodem of in een oppervlaktewaterlichaam
      toestaan:


      a. voor een door hem vast te stellen termijn, gebaseerd op het nog niet verstreken deel van een
      afschrijvingstermijn van de bij de aanleg van het vuilwaterriool of het zuiveringtechnisch werk reeds bestaande
      zuiveringsvoorziening; of


      b. indien voor een deel van het huishoudelijk afvalwater dat vrijkomt binnen de inrichting waarvan de
      vervuilingswaarde niet groter is dan 3 inwonerequivalenten aansluiting op de bedrijfsriolering die op een
      vuilwaterriool is aangesloten niet doelmatig is, waarbij kan worden bepaald dat het afvalwater door een
      zuiveringsvoorziening wordt geleid.


      4 In afwijking van het tweede lid, onderdeel a, wordt de afstand tot het dichtstbijzijnde vuilwaterriool of
      zuiveringtechnisch werk bij voortzetting van het lozen van huishoudelijk afvalwater op of in de bodem dat voor
      1 juli 1990 al regelmatig plaatsvond, berekend vanaf het gedeelte van het gebouw dat zich het dichtst bij een
      vuilwaterriool of een zuiveringtechnisch werk bevindt.


      5 In afwijking van het tweede lid, onderdeel a, wordt de afstand tot het dichtstbijzijnde vuilwaterriool of
      zuiveringtechnisch werk bij voortzetting van het lozen van huishoudelijk afvalwater in het oppervlaktewaterlichaam
      dat voor 1 maart 1997 al plaatsvond, berekend vanaf het gedeelte van het gebouw dat zich het dichtst bij een
      vuilwaterriool of een zuiveringtechnisch werk bevindt.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 Bij het lozen van huishoudelijk afvalwater op of in de bodem of in een oppervlaktewaterlichaam worden de volgende
      grenswaarden niet overschreden:


            Tabel 3.5










                    Lozen op of in de bodem en in een aangewezen oppervlaktewaterlichaam


                    Lozen in een niet aangewezen oppervlaktewaterlichaam




                    Parameter


                    Representatief etmaalmonster


