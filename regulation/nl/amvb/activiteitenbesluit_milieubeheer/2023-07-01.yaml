  - number: 3.6f
    text: |-
      1 Deze paragraaf is van toepassing op het lozen ten gevolge van het schoonmaken en in gebruik
      nemen van de middelen voor het opslaan, transporteren en de distribueren van drinkwater of warm
      tapwater als bedoeld in [artikel 1 van de Drinkwaterwet][ref1] of van huishoudwater als bedoeld
      in[ artikel 1 van het Drinkwaterbesluit][ref2]. Bij het lozen wordt ten minste voldaan aan het tweede tot en met
      het vijfde lid.

      2 Het lozen op of in de bodem is toegestaan indien aan het drinkwater, warm tapwater of huishoudwater geen
      chemicaliën zijn toegevoegd en als gevolg van het lozen geen wateroverlast ontstaat.

      3 Het lozen in een oppervlaktewaterlichaam of in een voorziening voor de inzameling en het transport van
      afvalwater, niet zijnde een vuilwaterriool, is toegestaan, indien aan het drinkwater, warm tapwater of
      huishoudwater geen chemicaliën zijn toegevoegd.

      4 Het lozen vindt slechts dan in een vuilwaterriool plaats, indien het lozen, bedoeld in het tweede en derde lid,
      redelijkerwijs niet mogelijk is.

      5 In afwijking van het tweede en derde lid kan het bevoegd gezag het lozen van afvalwater, bedoeld in het eerste
      lid, met geringe concentraties chemicaliën bij maatwerkvoorschrift toestaan indien het belang van de bescherming
      van het milieu zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel1
