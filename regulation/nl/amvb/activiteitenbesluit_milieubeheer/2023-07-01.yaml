    text: >-
      1 Het bevoegd gezag kan bij maatwerkvoorschrift andere eisen stellen dan bij of krachtens deze paragraaf gestelde
      eisen, indien het belang van de bescherming van het milieu zich daartegen niet verzet.


      2 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van diffuse
      emissies van vluchtige organische stoffen wordt voldaan aan de bij ministeriële regeling gestelde eisen.


      3 Het tweede lid is niet van toepassing op vloeistoffen met een dampspanning van ten hoogste 1 kPa.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.50
  - number: '5.51'
    text: |-
      1 Het begrip «vloeibare brandstof» is niet van toepassing op installaties waarop deze afdeling van toepassing is.

      2 Voor de toepassing van deze afdeling wordt verstaan onder:

      - *benzine:* benzine als bedoeld in artikel 2, onderdeel a, van [richtlijn 94/63/EG](31994L0063);
      - *benzinedebiet:* de in de drie voorgaande jaren gemeten grootste totale jaarlijkse hoeveelheid benzine die van
      een opslaginstallatie van een terminal is overgeslagen in een mobiele tank;
      - *damp:* damp als bedoeld in artikel 2, onderdeel b, van [richtlijn 94/63/EG](31994L0063);
      - *mobiele tank:* mobiele tank als bedoeld in artikel 2, onderdeel e, van [richtlijn 94/63/EG](31994L0063);
      - *terminal:* inrichting of een gedeelte van een inrichting voor de opslag of overslag van benzine in mobiele
      tanks;

      3 Het bevoegd gezag kan bij maatwerkvoorschrift eisen stellen die strekken tot een hoger beschermingsniveau dan de
      voorschriften die bij of krachtens deze afdeling zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.51
  - number: '5.52'
    text: >-
      Deze paragraaf is van toepassing op het in werking hebben van een terminal met een opslaginstallatie als bedoeld in
      artikel 2, onderdeel c, van [richtlijn 94/63/EG](31994L0063).
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.52
  - number: '5.53'
    text: >-
      Degene die een terminal met opslaginstallatie drijft, voldoet ten behoeve van het verminderen van de emissie van
      benzinedamp naar de lucht aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.53
  - number: '5.54'
    text: |-
      1 Deze paragraaf is van toepassing op het in werking hebben van een terminal met een overslaginstallatie als
      bedoeld in artikel 2, onderdeel n, van [richtlijn 94/63/EG](31994L0063).

      2 Deze paragraaf is niet van toepassing op terminals met een benzinedebiet van minder dan 10.000 ton per
      jaar die voor 31 december 1995 in werking waren of waarvoor voor 31 december 1995 een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1] was verleend en onherroepelijk was.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.54
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8.1'
  - number: '5.55'
    text: >-
      1 Tijdens het vullen van een mobiele tank worden verplaatsingsdampen via een dampdichte leiding teruggevoerd naar
      een dampterugwinningseenheid.


      2 Het eerste lid is niet van toepassing op het vullen van een tankwagen langs de bovenzijde.


      3 Indien het vullen langs de bovenzijde van een mobiele tank plaatsvindt, wordt het uiteinde van de vularm zoveel
      mogelijk onderin de mobiele tank gehouden.


      4 In afwijking van het eerste lid kan een dampterugwinningseenheid worden vervangen door een
      dampverbrandingseenheid, indien dampterugwinning onveilig of technisch onmogelijk is vanwege de hoeveelheden
      retourdamp.


      5 Op een terminal met een benzinedebiet van minder dan 25.000 ton per jaar kan onmiddellijke dampterugwinning op
      de terminal worden vervangen door voorlopige dampopslag in een tank met een vast dak op een terminal voor latere
      overbrenging naar en terugwinning op een andere terminal, daaronder niet begrepen de overbrenging van damp van de
      ene naar de andere opslaginstallatie op een terminal.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.55
  - number: '5.56'
    text: |-
      1 De gemiddelde concentratie dampen in de afvoer van een dampterugwinningseenheid, gecorrigeerd voor de verdunning
      tijdens de behandeling, bedraagt ten hoogste 35 g/Nm3 gedurende één uur.

      2 Dit artikel is van overeenkomstige toepassing op een dampverbrandingseenheid als bedoeld in
      [artikel 5.55, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.55
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.56
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5.55'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '5.57'
    text: >-
      1 Bij het meten van de gemiddelde concentratie dampen wordt voldaan aan de bij ministeriële regeling gestelde
      eisen.


      2 De nauwkeurigheid van de meting bedraagt ten minste 95 procent van de gemeten waarde.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.57
  - number: '5.58'
    text: Het normale laaddebiet van benzine per vularm op een laadportaal bedraagt ten hoogste 2.500 liter per minuut.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.58
  - number: '5.59'
    text: >-
      Bij piekbelasting van een terminal brengt het dampopvangsysteem van het laadportaal, met inbegrip van de
      dampterugwinningseenheid, een maximale tegendruk van 55 millibar aan de voertuigzijde van de dampopvangadapter
      teweeg.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.59
  - number: '5.60'
    text: >-
      1 Het vullen van een tankwagen langs de onderzijde is uitsluitend toegestaan indien het vultoelatingssignaal is
      gegeven door de gecombineerde aardings- en overloopbedieningseenheid.


      2 Bij het vullen van een tankwagen langs de onderzijde is de dampopvangslang met de tankwagen verbonden en stroomt
      de verplaatste damp vrij van de tankwagen naar de dampopvangvoorziening van de terminal.


      3 In geval van overloop of onderbreking van de aarding van een tankwagen sluit de bedieningseenheid van het
      laadportaal de vulcontroleklep aan het laadportaal.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.60
  - number: '5.61'
    text: >-
      1 Dampen die worden opgeslagen in een tank met vast dak voor voorlopige dampopslag worden via een dampdichte
      leiding teruggevoerd naar de mobiele tank van waaruit de benzine wordt geleverd.


      2 Vulwerkzaamheden vinden alleen plaats indien de voorzieningen, bedoeld in deze paragraaf, aanwezig zijn en
      adequaat werken.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.61
  - number: '5.62'
    text: >-
      Een terminal met een overslaginstallatie voor het vullen van tankwagens is uitgerust met ten minste één laadportaal
      dat ten behoeve van het verminderen van de emissie van benzinedamp naar de lucht voldoet aan de bij ministeriële
      regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.62
  - number: '5.63'
    text: >-
      Degene die een terminal met overslaginstallatie drijft, voldoet ten behoeve van het verminderen van de emissie van
      benzinedamp naar de lucht aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.63
  - number: '5.64'
    text: >-
      Deze paragraaf is van toepassing op LPG-tankstations waar:


      a. de doorzet van LPG meer bedraagt dan 50 m3 per jaar, en


      b. de opslagcapaciteit voor LPG niet meer bedraagt dan 50 ton.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.64
  - number: '5.65'
    text: >-
      Met betrekking tot een LPG-afleverinstallatie, de aflevering van LPG aan een afnemer bij een LPG-tankstation en de
      opstelplaats van de LPG-tankwagen, wordt ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone
      voorvallen, dan wel voor zover dat niet mogelijk is het beperken van de risico’s voor de omgeving en de kans dat
      ongewone voorvallen zich voordoen en de gevolgen hiervan, ten minste voldaan aan de bij ministeriële regeling
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.65
  - number: '6'
    text: >-
      Dit hoofdstuk is van toepassing op degene die een inrichting type A, een inrichting type B, of een inrichting type
      C drijft.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel6
  - number: '6.1'
    text: |-
      1 Voor inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip van het van toepassing
      worden van dit besluit of een deel daarvan op een activiteit in die inrichtingen, een vergunning op
      grond van [artikel 8.1 van de Wet milieubeheer][ref1] dan wel een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] in werking en
      onherroepelijk was, worden de voorschriften van die vergunning gedurende drie jaar na het van toepassing worden
      van dit besluit of een deel daarvan op een activiteit in die inrichtingen, aangemerkt als maatwerkvoorschriften,
      mits de voorschriften van die vergunning vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van
      maatwerkvoorschriften en voor zover dit besluit op de inrichting van toepassing is.

      2 De nadere eisen die voor een inrichting onmiddellijk voorafgaand aan het tijdstip van het van toepassing worden
      van dit besluit of een deel daarvan op een activiteit in die inrichting op grond van de besluiten, bedoeld in
      [artikel 6.43][ref3] in werking en onherroepelijk waren, worden aangemerkt als maatwerkvoorschriften, mits de
      nadere eisen vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften en voor
      zover dit besluit op de inrichting van toepassing is.

      3 De maatwerkvoorschriften die voor een inrichting onmiddellijk voorafgaand aan het tijdstip van het van toepassing
      worden van dit besluit of een deel daarvan op een activiteit in die inrichting op grond van de besluiten,
      bedoeld in [artikel 6.43][ref4] in werking en onherroepelijk waren, blijven van kracht, mits ze vallen binnen
      de bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften en voor zover dit besluit op die
      inrichting van toepassing is.

      4 De voorschriften van een vergunning als bedoeld in het eerste lid dan wel de nadere eisen op grond van de
      besluiten, bedoeld in [artikel 6.43][ref5], die voor een inrichting onmiddellijk voorafgaand aan het tijdstip
      van het van toepassing worden van dit besluit of een deel daarvan op een activiteit in die inrichting in
      werking en onherroepelijk waren en niet vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van
      maatwerkvoorschriften, worden indien op grond van dit besluit strengere bepalingen gelden, gedurende zes maanden
      aangemerkt als maatwerkvoorschriften.

      5 Voor de toepassing van dit artikel worden de gegevens die in de aanvraag staan en die geacht worden onderdeel
      te zijn van de voorschriften van de vergunning, bedoeld in het eerste lid, aangemerkt als voorschriften van de
      vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref5]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
