  - number: '6.41'
    text: >-
      Indien een niet-publiekrechtelijke norm waarnaar in dit besluit wordt verwezen, de NRB wijzigt kan bij ministeriële
      regeling overgangsrecht worden opgenomen waarbij kan worden bepaald dat de oude norm voor bestaande inrichtingen al
      dan niet tijdelijk blijft gelden.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel6.41
  - number: '6.42'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt in overeenstemming met Onze Minister
      van Verkeer en Waterstaat binnen zes jaar na de inwerkingtreding van [artikel 2.1][ref1] aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van dit besluit in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.1
