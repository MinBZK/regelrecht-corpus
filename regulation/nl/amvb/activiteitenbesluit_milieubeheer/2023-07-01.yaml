  - number: 3.26l
    text: |-
      1 Deze paragraaf is van toepassing op het gebruik van hefschroefvliegtuigen bij ziekenhuizen.

      2 De [artikelen 2.17 tot en met 2.22][ref1] zijn niet van toepassing op het gebruik van hefschroefvliegtuigen bij
      ziekenhuizen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.17
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26l
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.17'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: 3.26m
    text: >-
      Degene die een helitraumacentrum drijft, draagt er zorg voor dat het geluidsvermogensniveau van
      hefschroefvliegtuigen die door hem worden ingezet voor het vervoer van mobiele medische teams niet hoger is dan
      140 dB(A).
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26m
  - number: 3.26n
    text: >-
      Degene die een ziekenhuis, niet zijnde een helitraumacentrum, drijft, draagt er zorg voor dat zijn voorziening ten
      behoeve van het landen en opstijgen van hefschroefvliegtuigen uitsluitend door hefschroefvliegtuigen wordt gebruikt
      indien dit gebruik bijzonder is aangewezen voor:


      a. het vervoer van ongevalslachtoffers en zieken die spoedeisende medische zorg behoeven, met inbegrip van
      apparatuur en begeleidend personeel;


      b. het vervoer van pasgeboren kinderen die spoedeisende medische zorg behoeven, met inbegrip van apparatuur en
      begeleidend personeel;


      c. het vervoer van organen of transplantatieteams in het kader van transplantatie;


      d. het vervoer van een lid van een mobiel medisch team dat, nadat het mobiel medisch team met een
      hefschroefvliegtuig op een ongevallenlocatie is ingezet, met een ongevalslachtoffer of zieke die spoedeisende
      medische zorg behoeft anders dan met een hefschroefvliegtuig naar het ziekenhuis is vervoerd;


      e. het verplaatsen van een hefschroefvliegtuig in verband met de opleiding en training van de piloot tot ten
      hoogste 20 vliegbewegingen per ziekenhuis per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26n
  - number: 3.26o
    text: >-
      Degene die een helitraumacentrum drijft, draagt er zorg voor dat zijn voorziening ten behoeve van het landen
      en opstijgen van hefschroefvliegtuigen uitsluitend door hefschroefvliegtuigen wordt gebruikt indien dit gebruik
      bijzonder aangewezen is voor:


      a. het vervoer van ongevalslachtoffers en zieken die spoedeisende medische zorg behoeven, met inbegrip van
      apparatuur en begeleidend personeel;


      b. het vervoer van pasgeboren kinderen die spoedeisende medische zorg behoeven, met inbegrip van apparatuur en
      begeleidend personeel;


      c. het vervoer van organen of transplantatieteams in het kader van transplantatie;


      d. het vervoer van mobiele medische teams, met inbegrip van apparatuur naar en van ongevallenlocaties;


      e. het verplaatsen van een hefschroefvliegtuig in verband met de komst van een ander hefschroefvliegtuig
      dat ongevalslachtoffers, zieken en pasgeboren kinderen die spoedeisende medische zorg behoeven, organen of
      transplantatieteams vervoert;


      f. het verplaatsen van een hefschroefvliegtuig tot ten hoogste 400 vliegbewegingen per helitraumacentrum per
      kalenderjaar in verband met:


      1°. onderhoud of reparatie;


      2°. tankvluchten;


      3°. opleiding en training van de piloot en van het mobiel medisch team.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26o
  - number: 3.26p
    text: >-
      1 Degene die het helitraumacentrum of het ziekenhuis, niet zijnde een helitraumacentrum drijft, registreert met
      betrekking tot het gebruik van zijn voorziening ten behoeve van het landen en opstijgen van hefschroefvliegtuigen
      ten minste de volgende gegevens:


      a. de reden voor het gebruik van de voorziening;


      b. de tijd van vertrek;


      c. de tijd van aankomst.


      2 De registratie wordt binnen twee werkdagen na gebruik van de voorziening bijgewerkt en gedurende ten minste vijf
      jaar na het vastleggen in de registratie bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26p
  - number: 3.26q
    text: |-
      In afwijking van [artikel 3.26m][ref1] is het degene die op 1 februari 2003 een helitraumacentrum dreef, tot
      het moment van vervanging van het hefschroefvliegtuig dat op die datum werd ingezet voor het vervoer van mobiele
      medische teams, toegestaan een hefschroefvliegtuig in te zetten met een geluidsvermogensniveau van ten hoogste
      145 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26m
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.26q
