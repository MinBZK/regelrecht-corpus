  - number: 2.17a
    text: |-
      1 De waarden op de gevel van gevoelige gebouwen en op de grens van gevoelige terreinen in
      [tabel 2.17a onderscheidenlijk 2.17g][ref1] worden met 5 dB(A) verhoogd indien tot het van toepassing worden van
      artikel 2.17 op een inrichting, op grond van een voorschrift als bedoeld in het derde lid hogere waarden golden.

      2 Indien in een milieuvergunning die in werking en onherroepelijk was op het tijdstip genoemd in het op de
      inrichting van toepassing geweest zijnde voorschrift, genoemd in het derde lid, lagere waarden dan de waarden,
      bedoeld in het eerste lid, waren vastgesteld, zijn die lagere waarden van toepassing.

      3 De voorschriften, bedoeld in het eerste en tweede lid, zijn: voorschrift 1.1.3 van de [bijlage
      van het Besluit opslag- en transportbedrijven milieubeheer](onbekend), voorschrift 1.1.5 van
      [bijlage 2 van het Besluit detailhandel- en ambachtsbedrijven milieubeheer][ref2], voorschrift 1.1.7
      van de [bijlage van het Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer](onbekend),
      voorschrift 1.1.3 van de [bijlage van het Besluit bouw- en houtbedrijven milieubeheer](onbekend),
      voorschrift 1.1.5 van de [bijlage van het Besluit woon- en verblijfsgebouwen milieubeheer](onbekend),
      voorschrift 1.1.3 van [bijlage 2 van het Besluit voorzieningen- en installaties milieubeheer][ref3],
      voorschrift 1.1.3 van [bijlage 1 van het Besluit textielreinigingsbedrijven milieubeheer][ref4],
      voorschrift 1.1.3 van de [bijlage van het Besluit inrichtingen voor motorvoertuigen milieubeheer]
      (onbekend), voorschrift 3.2 van [bijlage 2 van het Besluit tankstations milieubeheer][ref5], voorschrift
      4.2.1 van [bijlage 1 van het Besluit tandartspraktijken milieubeheer][ref6] en voorschrift 1.1.3 van
      [bijlage 2 van het Besluit glastuinbouw][ref7].

      4

      5 Een gemeentelijke verordening als bedoeld in voorschrift 1.1.2 van de [bijlage bij het Besluit
      landbouw milieubeheer](onbekend), zoals dat luidde tot 1 januari 2013, berust met ingang van die datum op
      [artikel 2.17, zevende lid][ref8].

      6 Voor inrichtingen waarop tot 1 januari 2008 het
      [Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer][ref9],
      het [Besluit detailhandel en ambachtsbedrijven milieubeheer][ref10] of het
      [Besluit woon- en verblijfsgebouwen milieubeheer][ref11] van toepassing was, zijn de waarden uit
      [artikel 2.17][ref12] niet van toepassing op de gevel van onderscheidenlijk in een dienst- of bedrijfswoning dan
      wel een woning die deel uitmaakt van een inrichting.


