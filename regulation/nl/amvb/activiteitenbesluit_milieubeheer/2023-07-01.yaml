  - number: 2.3b
    text: >-
      1 Voor de toepassing van deze afdeling wordt onder een zeer zorgwekkende stof verstaan: een stof die voldoet aan
      een of meer van de criteria of voorwaarden, bedoeld in artikel 57 van EG-verordening registratie, evaluatie en
      autorisatie van chemische stoffen.


      2 Bij ministeriële regeling worden regels gesteld over zeer zorgwekkende stoffen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.3b
  - number: '2.4'
    text: |-
      1 In afwijking van [artikel 2.3a, eerste lid][ref1], is dit artikel, met uitzondering van het achtste lid, onder b,
      uitsluitend van toepassing op degene die een inrichting type C drijft.

      2 Emissies van zeer zorgwekkende stoffen naar de lucht worden zoveel mogelijk voorkomen dan wel, indien dat niet
      mogelijk is, tot een minimum beperkt.

      3 Degene die een inrichting drijft van waaruit emissies van zeer zorgwekkende stoffen naar de lucht plaatsvinden,
      overlegt elke vijf jaar informatie aan het bevoegd gezag over:

      a. de mate waarin emissies van zeer zorgwekkende stoffen naar de lucht plaatsvinden;

      b. de mogelijkheden om emissies van die stoffen te voorkomen dan wel, indien dat niet mogelijk is, te beperken.

      4 In afwijking van het derde lid, kan het bevoegd gezag, indien het belang van de bescherming van het milieu zich
      daartegen niet verzet, bij maatwerkvoorschrift toestaan dat:

      a. aan de informatieverplichting niet hoeft te worden voldaan indien naar het oordeel van het bevoegd gezag
      de bijdrage van emissies uit de inrichting aan het maximaal toelaatbaar risico, bedoeld in het vijfde lid,
      verwaarloosbaar is, of

      b. de informatieverplichting, rekening houdend met de meest relevante zeer zorgwekkende stoffen, gefaseerd wordt
      uitgevoerd. Hierbij stelt het bevoegd gezag per stof een redelijke termijn vast waarbinnen die informatie wordt
      aangeleverd.

      5 Indien bij activiteiten emissies van zeer zorgwekkende stoffen naar de lucht plaatsvinden, leiden de
      emissiewaarden van die stoffen, genoemd in [artikel 2.5][ref2], niet tot overschrijding van het maximaal
      toelaatbaar risiconiveau van de immissieconcentratie van die stof.

      6 Bij ministeriële regeling worden ten behoeve van de bescherming van het milieu regels gesteld over:

      a. het opstellen van de programma’s voor het voorkomen dan wel, indien dat niet mogelijk is, beperken van emissies
      van zeer zorgwekkende stoffen, bedoeld in het derde lid;

      b. het maximaal toelaatbaar risiconiveau en de vaststelling daarvan;

      c. de bepaling van de immissieconcentratie, bedoeld in het vijfde lid.

      7 Indien voor een van de zeer zorgwekkende stoffen nog geen maximaal toelaatbaar risiconiveau is vastgesteld, is
      het vijfde lid niet van toepassing op die stof tot het moment waarop de vaststelling plaatsvindt.

      8 Indien de geografische ligging, de plaatselijke milieuomstandigheden of de technische kenmerken van de
      betrokken installatie daartoe aanleiding geven, kan het bevoegd gezag, als het belang van de bescherming van het
      milieu en het belang van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      luchtverontreiniging zich daartegen niet verzetten, bij maatwerkvoorschrift voor de stofcategorie ZZS voor zover
      het betreft:

      a. een inrichting type C, emissiegrenswaarden vaststellen die afwijken van de emissiewaarden, bedoeld in het
      vijfde lid, dan wel afwijken van de emissiewaarden in de [tabellen 2.5][ref3] en [2.6][ref4] of de tijdelijk bij
      ministeriële regeling vastgestelde waarden als bedoeld in artikel 2.5, zesde lid, dan wel andere eisen stellen;

      b. een inrichting type B, eisen stellen aan de situering en uitvoering van het afvoerpunt van emissies;

      c. eisen stellen aan de emissies van diffuse bronnen.

      9 Ten aanzien van de technische kenmerken, bedoeld in het achtste lid, wordt onder meer rekening gehouden met een
      afwijkend emissiepatroon, de kosten en baten en een integrale afweging van de mogelijkheden voor emissiebeperking.

      10 Dit artikel is, met uitzondering van het tweede lid, het achtste lid en het negende lid, niet van toepassing op
      de stoffen genoemd in [bijlage 2 bij de Wet milieubeheer][ref5].

      11 De termijn van vijf jaar, genoemd in het derde lid, vangt aan:

      a. op het tijdstip van het van toepassing worden van [artikel 2.4][ref6]. op de inrichting, of

      b. in afwijking van onderdeel a, voor een inrichting waarvoor tot het toepassing worden van [artikel 2.4][ref7]
      voor die inrichting in een vergunning een afwijkend tijdstip was vastgelegd, op dat afwijkende tijdstip.


