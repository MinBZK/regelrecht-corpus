  - number: '5.29'
    text: >-
      1 De meting van de emissies, waaronder tevens begrepen wordt de berekening, registratie en rapportage van de
      meting, voldoet aan de bij ministeriële regeling gestelde eisen.


      2 Een afvalverbrandings- of een afvalmeeverbrandingsinstallatie voldoet ten behoeve van:a. het voorkomen van
      risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk
      beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan,


      b. het realiseren van een verwaarloosbaar bodemrisico,


      c. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van het
      oppervlaktewater, en


      d. een doelmatig beheer van afvalstoffen


      aan de bij ministeriële regeling te stellen eisen.
