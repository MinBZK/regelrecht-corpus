  - number: 3.5f
    text: |-
      1 Voor de toepassing van dit artikel wordt onder «voorzienbare bijzondere bedrijfsomstandigheden bij een
      zuiveringtechnisch werk» verstaan: andere dan de reguliere bedrijfsomstandigheden, niet zijnde een ongewoon
      voorval, zoals onderhouds- en reparatiewerkzaamheden, waardoor onderdelen van het zuiveringsproces tijdelijk buiten
      bedrijf worden gesteld.

      2 In het geval van voorzienbare bijzondere bedrijfsomstandigheden als bedoeld in het eerste lid die gevolgen
      kunnen hebben voor de kwaliteit van het na zuivering te lozen afvalwater, kan het bevoegd gezag op verzoek van
      het openbaar lichaam of een andere rechtspersoon die krachtens [artikel 3.4 van de Waterwet][ref1] is belast met
      de zorg voor een zuiveringstechnisch werk voor een door hem vast te stellen periode bij maatwerkvoorschrift de
      grenswaarden, genoemd in [artikel 3.5e, vierde, zesde of zevende lid][ref2], niet van toepassing verklaren en
      hogere grenswaarden vaststellen alsmede tijdelijk aanvullende maatregelen voorschrijven om de nadelige gevolgen
      voor de waterkwaliteit zoveel mogelijk te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3.4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.5e
