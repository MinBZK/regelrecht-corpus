  - number: '3.64'
    text: |-
      1 Indien het op grond van [artikel 3.63, eerste lid][ref1], is toegestaan drainagewater afkomstig van de teelt
      waarbij gewassen op materiaal groeien dat in verbinding staat met de ondergrond in een oppervlaktewaterlichaam te
      lozen vanaf een perceel dat voor 1 november 1994 niet voor glastuinbouwactiviteiten werd gebruikt, kan het bevoegd
      gezag, indien het belang van de bescherming van het milieu daartoe noodzaakt, in afwijking van artikel 3.63,
      eerste, derde, zesde of zevende lid, bij maatwerkvoorschrift eisen stellen waarmee het lozen wordt voorkomen of
      verder wordt beperkt, dan met toepassing van dat artikel het geval zou zijn. [Artikel 2.2, vierde lid][ref2], is
      van overeenkomstige toepassing.

      2 Indien het op grond van [artikel 3.63, eerste lid][ref3], is toegestaan drainwater in een oppervlaktewaterlichaam
      te lozen vanaf een perceel dat voor 1 november 1994 niet voor het telen of kweken van gewassen in een kas
      werd gebruikt, kan het bevoegd gezag, indien het belang van de bescherming van het milieu daartoe noodzaakt,
      in afwijking van artikel 3.63, eerste, derde, zesde of zevende lid, met betrekking tot dat lozen bij
      maatwerkvoorschrift eisen stellen waarmee het lozen wordt voorkomen of verder wordt beperkt, dan met toepassing van
      dat artikel het geval zou zijn. [Artikel 2.2, vierde lid][ref4], is van overeenkomstige toepassing.

      3 Voor het lozen in een oppervlaktewaterlichaam van drainagewater afkomstig van de teelt waarbij gewassen op
      materiaal groeien dat in verbinding staat met de ondergrond vanaf een perceel dat voor 1 november 1994 niet voor
      glastuinbouwactiviteiten werd gebruikt, waarvoor tot het van toepassing worden van het eerste lid op dat lozen,
      een vergunning op grond van [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref5] dan wel een vergunning
      op grond van [artikel 6.2 van de Waterwet][ref6] in werking en onherroepelijk was, worden de voorschriften van
      die vergunning aangemerkt als maatwerkvoorschriften, mits de voorschriften van die vergunning vallen binnen de
      bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften op grond van het eerste lid.

      4 Voor het lozen in een oppervlaktewaterlichaam van drainwater vanaf een perceel dat voor 1 november 1994 niet voor
      glastuinbouwactiviteiten werd gebruikt, waarvoor tot het van toepassing worden van het tweede lid op dat lozen,
      een vergunning op grond van [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref7] dan wel een vergunning
      op grond van [artikel 6.2 van de Waterwet][ref8] in werking en onherroepelijk was, worden de voorschriften van
      die vergunning aangemerkt als maatwerkvoorschriften, mits de voorschriften van die vergunning vallen binnen de
      bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften op grond van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.63
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel3.63
