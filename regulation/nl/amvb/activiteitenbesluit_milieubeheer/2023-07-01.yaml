  - number: '2.12'
    text: |-
      1 Onverminderd [artikel 10.54a, eerste lid, van de Wet milieubeheer][ref1] is het verboden voorafgaand aan
      het afvalstoffenbeheer gevaarlijke afvalstoffen te mengen, daaronder mede begrepen het verdunnen, met andere
      categorieën van afvalstoffen of met andere stoffen of materialen.

      2 Het is verboden afvalstoffen, niet zijnde gevaarlijke afvalstoffen, die binnen de inrichting zijn ontstaan, te
      mengen met andere categorieën van afvalstoffen, indien het gescheiden houden en gescheiden afgeven gelet op de
      hoeveelheden en de manier van vrijkomen van deze afvalstoffen en de kosten van het gescheiden houden en gescheiden
      afgeven op grond van het Landelijk afvalbeheerplan kan worden gevergd.

      3 Het is verboden afvalstoffen, niet zijnde gevaarlijke afvalstoffen, afkomstig van buiten de inrichting, te mengen
      met andere categorieën van afvalstoffen.

      4 Het eerste lid is niet van toepassing op het mengen van gevaarlijke afvalstoffen met afvalstoffen, niet zijnde
      gevaarlijke afvalstoffen, voor zover het mengen bij ministeriële regeling is toegestaan.

      5 Het derde lid is niet van toepassing voor zover het mengen is toegestaan op grond van een omgevingsvergunning.

      6 Bij ministeriële regeling worden, voor toepassing van dit artikel, categorieën van afvalstoffen aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.54a
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 10.54a
  - number: '2.13'
    text: >-
      Degene die de inrichting drijft verwijdert zo vaak als nodig etenswaren, verpakkingen, sport- of spelmaterialen, of
      andere materialen die uit de inrichting afkomstig zijn of voor de inrichting zijn bestemd binnen een straal van 25
      meter van de inrichting.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.13
  - number: '2.14'
    text: >-
      Indien binnen een inrichting een afvalstof zijnde metaal, hout, kunststof, textiel, steenachtige materialen of
      gips als grondstof wordt ingezet voor het vervaardigen, samenstellen of repareren van producten of onderdelen
      daarvan bestaande uit metaal, hout, kunststof, textiel, steenachtige materialen of gips en de eigenschappen van
      de afvalstof afwijken van de gangbare grondstof kan het bevoegd gezag maatwerkvoorschriften stellen om nadelige
      gevolgen voor het milieu die kunnen ontstaan door het afwijken van de eigenschappen, te voorkomen of voor zover dat
      niet mogelijk is te beperken.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.14
  - number: 2.14a
    text: |-
      1 Het is verboden afvalstoffen te verbranden.

      2 Het is verboden afvalstoffen op of in de bodem te brengen met het doel ze daar te laten.

      3 Het tweede lid geldt niet voor het toepassen van bouwstoffen en het toepassen van grond of baggerspecie, waarop
      het [Besluit bodemkwaliteit][ref1] van toepassing is.

      4 Het tweede lid geldt niet voor het lozen op of in de bodem.

      5 Het is verboden afvalstoffen voorafgaand aan nuttige toepassing langer dan drie jaren op te slaan.

      6 Het is verboden afvalstoffen voorafgaand aan verwijdering langer dan een jaar op te slaan.

      7 Uiterlijk binnen acht weken na de beëindiging van de inrichting worden de daarin aanwezige afvalstoffen uit de
      inrichting afgevoerd.

      8 Het is verboden afvalstoffen te verdichten, tenzij:

      a. het geen gevaarlijke afvalstof betreft, en

      b. het verdichten geen belemmering vormt voor de nascheiding of recycling.


