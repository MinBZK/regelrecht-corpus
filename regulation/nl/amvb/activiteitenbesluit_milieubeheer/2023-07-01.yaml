  - number: 4.74.5
    text: |-
      1 Onverminderd de [artikel 2.5, eerste, vierde en zesde lid][ref1], en [2.6][ref2] is bij uitbreken van gietstukken
      de emissieconcentratie van totaal stof ten hoogste 5 milligram per normaal kubieke meter, indien de massastroom van
      totaal stof naar de lucht gelijk is aan of groter is dan 200 gram per uur en ten hoogste 50 milligram per normaal
      kubieke meter indien de massastroom kleiner is dan 200 gram per uur.

      2 Het eerste lid is niet van toepassing indien het gietstuk inclusief zandvorm vanwege het gewicht en de omvang
      niet verplaatsbaar is.

      3 Bij het uitbreken en ontzanden van het gietstuk, bedoeld in het tweede lid, wordt ten behoeve van het voorkomen
      dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van emissies van totaal stof naar de lucht
      voldaan aan de bij ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
