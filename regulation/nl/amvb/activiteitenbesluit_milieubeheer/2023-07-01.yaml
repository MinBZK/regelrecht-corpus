  - number: '2.5'
    text: |-
      1 Indien de som van de onder normale procesomstandigheden gedurende één uur optredende massastromen van stoffen in
      de stofcategorieën ZZS, sA en gO naar de lucht binnen eenzelfde stofklasse vanuit alle puntbronnen in de inrichting
      de in tabel 2.5 opgenomen grensmassastroom van die stofklasse overschrijdt, is de emissieconcentratie van die
      stofklasse per puntbron niet hoger dan de in tabel 2.5 opgenomen emissiegrenswaarde behorende bij die stofklasse.

      2 Voor stofklassen S en sO geldt dat alle bronnen in de inrichting afzonderlijk:

      a. ten hoogste 5 mg/Nm3 emitteren, indien de massastroom van een stof of de som van de onder normale
      procesomstandigheden gedurende één uur optredende massastromen van stoffen binnen deze stofklasse vanuit al die
      puntbronnen, groter of gelijk is aan 200 gram per uur, of

      b. ten hoogste 20 mg/Nm3 emitteren, indien de massastroom van een stof of de som van de onder normale
      procesomstandigheden gedurende één uur optredende massastromen van stoffen binnen deze stofklasse vanuit al die
      puntbronnen, kleiner is dan 200 gram per uur.

      3 Indien voor een bron geen filtrerende afscheider kan worden toegepast, emitteert deze bron in afwijking van het
      tweede lid, onderdeel a, afzonderlijk ten hoogste 20 mg/Nm3.

      4 Onverminderd het eerste lid is voor de stofcategorieën ZZS, sA en gO in tabel 2.5 een emissiegrenswaarde voor
      alle bronnen afzonderlijk van toepassing indien:

      a. de gedurende één uur optredende massastromen van stoffen uit een stofklasse genoemd in tabel 2.5 samen met de
      gedurende hetzelfde uur optredende massastromen van stoffen uit de eerstvolgende hogere stofklasse genoemd in die
      tabel, vanuit alle puntbronnen in de inrichting de in die tabel genoemde grensmassastroom van de laatstbedoelde
      stofklasse overschrijdt. De emissieconcentratie van deze stofklassen per puntbron is in dit geval niet hoger dan de
      in tabel 2.5 opgenomen emissiegrenswaarde behorende bij de hogere stofklasse;

      b. de gedurende één uur optredende massastromen van afzonderlijke stofklassen binnen één stofcategorie samen vanuit
      alle puntbronnen in de inrichting de in tabel 2.5 genoemde grensmassastroom van de hoogste stofklasse genoemd in
      die tabel van die stofcategorie overschrijdt. De emissieconcentratie van deze stofcategorie per puntbron is in dit
      geval niet hoger dan de in tabel 2.5 opgenomen emissiegrenswaarde behorende bij de hoogste stofklasse.

      5 Indien de onder normale procesomstandigheden gedurende één uur optredende massastromen van een stof in de
      stofcategorie gA naar de lucht vanuit alle puntbronnen in de inrichting de in tabel 2.5 opgenomen grensmassastroom
      van die stofklasse overschrijdt, is de emissieconcentratie van die stof per puntbron niet hoger dan de in tabel 2.5
      opgenomen emissiegrenswaarde behorende bij die stof.

      6 Voor stoffen die in een andere stofklasse of stofcategorie worden ingedeeld kunnen, in afwijking van de waarden
      genoemd in tabel 2.5 en [2.6][ref1], indien het belang van de bescherming van het milieu zich daartegen niet
      verzet, bij ministeriële regeling voor de betreffende stof tijdelijk andere waarden worden vastgesteld.

      7 Indien in hoofdstuk 4 of bij ministeriële regeling als bedoeld in het vijfde lid, eisen zijn gesteld aan de
      emissie van stoffen in de stofcategorie ZZS wordt ten aanzien van de berekeningen in het eerste en vierde lid
      gerekend met de afwijkende massastroom en emissiegrenswaarde zoals opgenomen in de betreffende artikelen van
      [hoofdstuk 4][ref2] of in de betreffende artikelen van de ministeriële regeling.


