    text: |-
      1 Deze paragraaf is van toepassing op het lozen van afvloeiend hemelwater dat:

      a. niet afkomstig is van een bodembeschermende voorziening,

      b. geen hemelwater is waarop de [artikelen 3.33][ref1], [3.34][ref2], [3.49][ref3] en [3.60][ref4] van toepassing
      zijn, of

      c. geen drainagewater is als bedoeld in [artikel 3.87, negende lid][ref5].

      2 Het lozen anders dan in een vuilwaterriool is toegestaan.

      3 Het lozen vindt slechts dan in een vuilwaterriool plaats, indien het lozen op of in de bodem, in een openbaar
      hemelwaterstelsel of in een oppervlaktewaterlichaam redelijkerwijs niet mogelijk is.

      4 Gewasbeschermingsmiddelen, waaronder onkruidbestrijdingsmiddelen, worden slechts op half-open en gesloten
      verhardingen gebruikt, indien:

      a. sprake is van pleksgewijze behandeling door middel van selectieve toepassingstechnieken; en

      b. de kans op neerslag voor een periode van 24 uur na het voorgenomen gebruik niet groter is dan 40% volgens het
      weerbericht, bedoeld in [artikel 3, eerste lid, onderdeel a, van de Wet taken meteorologie en seismologie][ref6],
      voor de desbetreffende regio van het land.

      5 Gewasbeschermingsmiddelen, waaronder onkruidbestrijdingsmiddelen, worden niet gebruikt in of nabij straatkolken
      of putten.

      6 Het derde lid is niet van toepassing op het lozen dat is aangevangen voor het van toepassing worden van het
      eerste tot en met vijfde lid op de inrichting.

      7 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat het lozen in het vuilwaterriool van afvloeiend
      hemelwater dat niet afkomstig is van een bodembeschermende voorziening, dat reeds plaatsvond voorafgaand aan het
      tijdstip, bedoeld in het zesde lid, binnen een in dat maatwerkvoorschrift gestelde termijn wordt gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.33
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.34
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel3.49
