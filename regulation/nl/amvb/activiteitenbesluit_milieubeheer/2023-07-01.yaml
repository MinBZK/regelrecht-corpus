      2.17e en 2.17g zijn niet van toepassing op inrichtingen die zijn gelegen in een gebied waarvoor bij of krachtens
      een gemeentelijke verordening regels zijn gesteld. In een dergelijk gebied bedraagt het langtijdgemiddeld
      beoordelingsniveau (L) niet meer dan de waarden die zijn opgenomen in die gemeentelijke verordening.

      8 Voor inrichtingen in een gebied als bedoeld in het zevende lid, bedragen de in de verordening vastgelegde waarden
      ten hoogste 5 dB(A) meer of minder dan de waarden in tabel 2.17e en voor inrichtingen als bedoeld in het zesde lid,
      bedragen de in de verordening vastgelegde waarden ten hoogste 5 dB(A) meer of minder dan de waarden in tabel 2.17g.

      9 Bij vaststelling van de waarden, bedoeld in het zevende lid, wordt in ieder geval rekening gehouden met het
      in het gebied heersende referentieniveau. Indien voor inrichtingen als bedoeld in het zesde lid, waarden worden
      vastgelegd die hoger zijn dan de waarden in tabel 2.17g, wordt daarmee het in het gebied heersende referentieniveau
      niet overschreden.


