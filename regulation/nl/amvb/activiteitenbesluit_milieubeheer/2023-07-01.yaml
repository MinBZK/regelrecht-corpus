        afdeling: '2.3'
  - number: 4.74.3
    text: |-
      Onverminderd de [artikel 2.5, eerste, vierde en zesde lid][ref1], en [2.6][ref2] is bij het maken en coaten van
      verloren gietvormen en kernen uit kleigebonden of chemische gebonden zand de emissieconcentratie van totaal stof
      ten hoogste 5 milligram per normaal kubieke meter, indien de massastroom van totaal stof naar de lucht gelijk is
      aan of groter is dan 200 gram per uur en ten hoogste 50 milligram per normaal kubieke meter indien de massastroom
      kleiner is dan 200 gram per uur;


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.74.3
