  - number: '5.48'
    text: |-
      1 [Artikel 5.46, eerste lid, onderdelen c en d][ref1], is niet van toepassing op een installatie voor de productie
      van asfalt die voor 1 januari 2009 in gebruik genomen is.

      2 In de gevallen, bedoeld in het eerste lid, is bij de productie van asfalt, onverminderd de [artikelen 2.5][ref2]
      en [2.6][ref3], de emissiegrenswaarde van:

      a. stikstofoxiden ten hoogste 75 mg/Nm3 indien de massastroom van stikstofoxiden naar de lucht groter is dan 2000
      gram per uur;

      b. zwaveloxiden ten hoogste 75 mg/Nm3 indien de massastroom van zwaveloxiden naar de lucht groter is dan 2000 gram
      per uur.


