  - number: 3.10f
    text: |-
      1 Het rookgas van een gasmotor voldoet aan de emissiegrenswaarden, genoemd in tabel 3.10f.

      2 In afwijking van het eerste lid voldoet een installatie van minder dan 2,5 MWth, die voor 20 december 2018 in
      gebruik is genomen en op aardgas wordt gestookt, tot 1 januari 2030 aan een emissiegrenswaarde voor stikstofoxiden
      (NO) van 115 mg/Nm3.

      3 In afwijking van het eerste lid voldoet een installatie, die voor 20 december 2018 in gebruik is genomen en wordt
      gestookt op vergistingsgas, aan een emissiegrenswaarde voor zwaveldioxide (SO) van 65 mg/Nm3.

      4 In afwijking van het eerste lid en derde lid voldoet een installatie van 5 MWth of minder, die voor 20 december
      2018 in gebruik is genomen en wordt gestookt op vergistingsgas, vanaf 1 januari 2030 aan een emissiegrenswaarde
      voor zwaveldioxide (SO) van 60 mg/Nm3.

      5 In afwijking van het eerste lid en derde lid voldoet een installatie van meer dan 5 MWth, die voor 20 december
      2018 in gebruik is genomen en wordt gestookt op vergistingsgas, vanaf 1 januari 2025 aan een emissiegrenswaarde
      voor zwaveldioxide (SO) van 60 mg/Nm3.

      6 In afwijking van het eerste lid kan het bevoegd gezag bij maatwerkvoorschrift een hogere emissiegrenswaarde voor
      onverbrande koolwaterstoffen vaststellen voor een gasmotor met een nominaal thermisch ingangsvermogen van 2,5 MWth
      of meer, die voor 1 april 2010 is geplaatst of in gebruik is genomen en waarin brandstof anders dan vergistingsgas
      wordt verbrand, indien met een motorzijdige aanpassing onvoldoende reductie van koolwaterstoffen kan worden
      bereikt. In het maatwerkvoorschrift wordt een einddatum opgenomen.


