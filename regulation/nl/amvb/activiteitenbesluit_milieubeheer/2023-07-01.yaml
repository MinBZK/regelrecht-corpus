  - number: 3.5a
    text: >-
      Deze paragraaf is van toepassing op zuiveringtechnische werken, voor zover het de waterlijn betreft met inbegrip
      van slibindikking en mechanische slibontwatering.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.5a
  - number: 3.5b
    text: |-
      1 De geurbelasting als gevolg van een zuiveringtechnisch werk is ter plaatse van geurgevoelige objecten niet meer
      dan 0,5 odour unit per kubieke meter lucht als 98-percentiel.

      2 In afwijking van het eerste lid is de geurbelasting als gevolg van een zuiveringtechnisch werk ter plaatse van
      geurgevoelige objecten gelegen op een gezoneerd industrieterrein, een bedrijventerrein danwel buiten de bebouwde
      kom, niet meer dan 1 odour unit per kubieke meter lucht als 98-percentiel.

      3 Onverminderd het eerste en tweede lid, wordt bij een zuiveringtechnisch werk voldaan aan de bij ministeriële
      regeling te stellen eisen.

      4 Het eerste en tweede lid zijn niet van toepassing op een zuiveringtechnisch werk dat is opgericht voor 1 februari
      1996 en waarvoor op dat tijdstip een vergunning op grond van [artikel 8.1 van de Wet milieubeheer][ref1] in werking
      en onherroepelijk was.

      5 Indien het vierde lid van toepassing is, dan is de geurbelasting als gevolg van een zuiveringtechnisch werk ter
      plaatse van geurgevoelige objecten ten hoogste 1,5 odour units per kubieke meter lucht als 98-percentiel.

      6 In afwijking van het vijfde lid is de geurbelasting als gevolg van een zuiveringtechnisch werk ter plaatse van
      geurgevoelige objecten gelegen op een gezoneerd industrieterrein, een bedrijventerrein dan wel buiten de bebouwde
      kom ten hoogste 3,5 odour units per kubieke meter lucht als 98-percentiel.

      7 Voor een zuiveringtechnisch werk waarvoor tot 1 januari 2011 een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2], in werking
      en onherroepelijk was, zijn het eerste, tweede, vijfde en zesde lid niet van toepassing op de geurbelasting ter
      plaatse van geurgevoelige objecten die op het moment van verlening van de vergunning niet aanwezig waren of in de
      vergunning niet als geurgevoelig werden beschouwd.

      8 Bij de verandering van een zuiveringtechnisch werk als bedoeld in het vierde en zevende lid is de geurbelasting
      ter plaatse van geurgevoelige objecten als gevolg van een zuiveringtechnisch werk niet hoger dan de geurbelasting
      voorafgaand aan de verandering, tenzij de waarden, bedoeld in het eerste en tweede lid niet worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
