  - number: '3.139'
    text: |-
      1 Het lozen in een vuilwaterriool van afvalwater afkomstig van het vervaardigen of bewerken van voedingsmiddelen of
      dranken is toegestaan indien daarbij ten minste voldaan wordt aan de eisen, gesteld bij en krachtens het tweede tot
      en met zevende lid.

      2 Het te lozen afvalwater bevat geen stoffen die op grond van het BBT-informatiedocument Algemene
      BeoordelingsMethodiek 2016, aangewezen krachtens [artikel 5.4, eerste lid, van het Besluit omgevingsrecht][ref1],
      worden aangemerkt als stoffen waarvoor een saneringsinspanning Z of A geldt.

      3 In afwijking van het tweede lid kan het bevoegd gezag, indien het belang van de bescherming van het milieu
      zich daar niet tegen verzet, bij maatwerkvoorschrift het lozen van afvalwater, bedoeld in dat lid, toestaan.
      [Artikel 2.2, vierde lid][ref2], is van overeenkomstige toepassing.

      4 Het afvalwater wordt voorafgaand aan het lozen in een vuilwaterriool niet onderworpen aan een biologische
      behandeling.

      5 Het bevoegd gezag kan, indien het belang van de bescherming van het milieu zich daartegen niet verzet, bij
      maatwerkvoorschrift, in afwijking van het vierde lid, een biologische behandeling toestaan voorafgaand aan het
      lozen in een vuilwaterriool.

      6 Bij het in het vuilwaterriool lozen van afvalwater waarbij olie, vet, zuivel, vlees of vis wordt verwerkt, wordt
      het afvalwater, voor vermenging met ander niet-vethoudend afvalwater geleid door een vetafscheider en slibvangput
      die voldoen aan en worden gebruikt conform NEN-EN 1825-1 en -2. In afwijking van NEN-EN 1825-1 en 2 kan met een
      lagere frequentie van het ledigen en reinigen dan daar vermeld worden volstaan indien dit geen nadelige gevolgen
      heeft voor het doelmatig functioneren van de afscheider.

      7 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.

      8 Het zesde lid is niet van toepassing op een slibvangput en een vetafscheider die zijn geplaatst binnen een
      inrichting voorafgaand aan het tijdstip waarop dat lid op die inrichting van toepassing werd.

      9 Het zesde lid is eveneens niet van toepassing op een flocculatie-afscheider die binnen een inrichting is
      geplaatst voorafgaand aan het tijdstip waarop die leden op die inrichting van toepassing werden.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
