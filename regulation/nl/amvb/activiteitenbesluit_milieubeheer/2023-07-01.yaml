                    H341 of H351 en verplichte etikettering


                    ≥ 100 g/uur


                    20 mg/Nm³






      3 Een oplosmiddeleninstallatie waarin twee of meer activiteiten worden verricht die elk de drempelwaarden van tabel
      2.28a of tabel 2.28b overschrijden, voldoet:

      a. ten aanzien van de stoffen of mengsels, genoemd in het eerste of tweede lid, voor elke activiteit afzonderlijk
      aan de in die leden vermelde eisen, en

      b. ten aanzien van de andere stoffen of mengsels dan bedoeld onder a:

      1°. voor elke activiteit afzonderlijk aan [artikel 2.29, eerste of tweede lid][ref1], of

      2°. aan een waarde voor de totale emissies, die niet hoger is dan bij toepassing van het onder 1° gestelde het
      geval zou zijn.


