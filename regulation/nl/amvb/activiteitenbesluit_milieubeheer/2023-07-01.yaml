        bwb_id: BWBR0022762
        artikel: '3.26'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.26b
    text: |-
      1 Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het ontsteken van
      airbags en gordelspanners de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur;

      b. 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.

      2 Bij het ontsteken van airbags en gordelspanners worden ten behoeve van het voorkomen dan wel het beperken van
      diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling
      voorgeschreven maatregelen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
