  - number: '3.132'
    text: >-
      Bij het bereiden van voedingsmiddelen wordt ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is
      het tot een aanvaardbaar niveau beperken van geurhinder voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.132
  - number: '3.133'
    text: >-
      1 Deze paragraaf is van toepassing op:


      a. het slachten van ten hoogste 10.000 kilogram levend gewicht aan dieren per week en het broeien, koken of pekelen
      van daarbij vrijkomende dierlijke bijproducten;


      b. het uitsnijden van vlees van karkassen of karkasdelen;


      c. het uitsnijden van vis, of


      d. het uitsnijden en pekelen van organen.


      2 Deze paragraaf is niet van toepassing op een IPPC-installatie.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.133
  - number: '3.134'
    text: >-
      1 Het slachten van dieren en het bewerken van dierlijke bijproducten vindt inpandig plaats.


      2 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het bewerken van dierlijke bijproducten of het
      reinigen en desinfecteren van ruimtes waar dieren zijn geslacht, karkassen zijn bewerkt, vlees is uitgesneden van
      karkassen of karkasdelen, vis is uitgesneden, organen worden verwerkt of dierlijke bijproducten worden bewerkt,
      wordt ten minste voldaan aan het derde tot en met zevende lid.


      3 Het afvalwater, bedoeld in het tweede lid, wordt voor vermenging met ander niet vethoudend afvalwater geleid door
      een vetafscheider en slibvangput die voldoen aan en worden gebruikt conform NEN-EN 1825-1 en 2. In afwijking van
      NEN-EN 1825-1 en 2 kan met een lagere frequentie van het legen en reinigen dan daar vermeld worden volstaan indien
      dit geen nadelige gevolgen heeft voor het doelmatig functioneren van de afscheider.


      4 Het afvalwater wordt voorafgaand aan het lozen in een vuilwaterriool niet onderworpen aan een biologische
      behandeling.


      5 Het bevoegd gezag kan, indien het belang van de bescherming van het milieu zich daartegen niet verzet, bij
      maatwerkvoorschrift, in afwijking van het vierde lid, een biologische behandeling toestaan voorafgaand aan het
      lozen in een vuilwaterriool.


      6 Het derde lid is niet van toepassing op een slibvangput en een vetafscheider die zijn geplaatst binnen een
      inrichting voorafgaand aan het tijdstip waarop dat lid op die inrichting van toepassing werd.


      7 Het derde lid is eveneens niet van toepassing op een flocculatie-afscheider die binnen een inrichting is
      geplaatst voorafgaand aan het tijdstip waarop die leden op die inrichting van toepassing werden.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.134
  - number: '3.135'
    text: >-
      1 Bij het broeien of koken van dierlijke bijproducten wordt ten behoeve van het voorkomen dan wel, voor zover dat
      niet mogelijk is, het tot een aanvaardbaar niveau beperken van geurhinder voldaan aan de bij ministeriële regeling
      gestelde eisen.


      2 Bij het pekelen wordt ten behoeve van het realiseren van een verwaarloosbaar bodemrisico voldaan aan de bij
      ministeriële regeling gestelde eisen.


      3 Bij het pekelen wordt:


      a. ter bescherming van de doelmatige werking van voorzieningen voor het beheer van afvalwater, of


      b. ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de
      verontreiniging van een oppervlaktewaterlichaam,


      ten minste voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.135
  - number: '3.136'
    text: >-
      Bij het slachten van dieren wordt:


      a. ten behoeve van het realiseren van een verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling
      gestelde eisen, of


      b. ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken
      van geurhinder ten minste voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.136
  - number: '3.137'
    text: >-
      1 Deze paragraaf is van toepassing op het vervaardigen of bewerken van voedingsmiddelen of dranken, voor zover
      daarbij geen sprake is van:


      a. het ambachtelijk bereiden van voedingsmiddelen of dranken;


      b. het bereiden van voedingsmiddelen of dranken met:


      1°. keukenapparatuur,


      2°. grootkeukenapparatuur;


      3°. een of meer bakkerijovens die chargegewijs beladen worden, of


      4°. één of meer bakkerijovens die continu beladen worden met een nominaal vermogen van ten hoogste 400 kilowatt;


      c. het slachten van dieren en het uitsnijden van vlees en vis;


      d. de extractie van plantaardige oliën of veredeling van vetten;


      e. de productie van zetmeel of suiker;


      f. de productie van alcohol, of


      g. de productie van voedingsmiddelen voor landbouwhuisdieren.


      2 Deze paragraaf is niet van toepassing op een IPPC-installatie.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.137
  - number: '3.138'
    text: |-
      1 Het in een oppervlaktewaterlichaam lozen van afvalwater afkomstig van het vervaardigen of bewerken van
      voedingsmiddelen of dranken is uitsluitend toegestaan, indien daarbij ten minste wordt voldaan aan de eisen,
      gesteld bij of krachtens het tweede tot en met het zesde lid.

      2 Het te lozen afvalwater bevat geen stoffen die op grond van het BBT-informatiedocument Algemene
      BeoordelingsMethodiek 2016, aangewezen krachtens [artikel 5.4, eerste lid, van het Besluit omgevingsrecht][ref1],
      worden aangemerkt als stoffen waarvoor een:

      a. saneringsinspanning Z of A geldt, of

      b. saneringsinspanning B geldt, tenzij het afvalwater wordt gezuiverd door middel van biologische zuivering.

      3 In afwijking van het tweede lid kan het bevoegd gezag, indien het belang van de bescherming van het milieu zich
      daar niet tegen verzet, bij maatwerkvoorschrift het lozen van afvalwater als bedoeld in dat lid, onder a of b,
      toestaan. [Artikel 2.2, vierde lid][ref2], is van overeenkomstige toepassing.

      4 Onverminderd het tweede en derde lid voldoet het te lozen afvalwater in enig steekmonster aan de volgende eisen:

      a) het biochemisch zuurstofverbruik bedraagt ten hoogste 30 mg/l;

      b) het chemisch zuurstofverbruik bedraagt ten hoogste 250 mg/l;

      c) de totale hoeveelheid onopgeloste bestanddelen bedraagt ten hoogste 100 mg/l;

      d) het gehalte aan zink bedraagt ten hoogste 1 mg/l;

      e) het gehalte aan koper bedraagt ten hoogste 1 mg/l;

      f) het gehalte aan totaalfosfor bedraagt ten hoogste 2 mg/l, en

      g) het gehalte aan totaalstikstof bedraagt ten hoogste 15 mg/l.

      5 In afwijking van het vierde lid kan het bevoegd gezag bij maatwerkvoorschrift:

      a. lagere gehaltes of grenswaarden vaststellen indien het belang van het milieu daartoe noodzaakt, of

      b. hogere gehaltes of grenswaarden vaststellen, indien het belang van de bescherming van het milieu zich daartegen
      niet verzet.

      [Artikel 2.2, vierde lid][ref3], is van overeenkomstige toepassing.

      6 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2.2
