  - number: 3.26k
    text: |-
      Ten aanzien van een jachthaven die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen en is aangewezen
      krachtens [artikel 6 van de Wet voorkoming verontreiniging door schepen][ref1], zijn de [artikelen 3.26i][ref2] en
      [3.26j][ref3] niet van toepassing.


