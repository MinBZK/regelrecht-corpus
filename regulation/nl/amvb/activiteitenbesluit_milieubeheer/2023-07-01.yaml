                    10 meter


                    4 meter




                    C


                    Alle stations t/m 40 000 normaal kubieke meter per uur aardgas


                    15 meter


                    4 meter




                    Alle stations boven 40 000 normaal kubieke meter per uur aardgas


                    25 meter


                    4 meter






      7 De in tabel 3.12 genoemde afstanden voor een ondergronds dan wel semi-ondergronds station mogen worden gehalveerd
      indien het gasvoerende deel geheel ondergronds ligt. Kasten mogen tegen gebouwen worden geplaatst mits wordt
      voldaan aan de bepalingen van NEN 1059.

      8 Onverminderd het eerste tot en met zevende lid wordt voldaan aan de bij ministeriële regeling te stellen eisen
      ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan.

      9 Het zesde lid is niet van toepassing op een gasdrukmeet- en regelstation:

      a. waarop tot 1 januari 2008 het [Besluit voorzieningen en installaties milieubeheer][ref1] van toepassing was,
      is opgericht voor 1 december 2001 en waarvoor tot laatstgenoemde datum een vergunning in werking en onherroepelijk
      was, of

      b. dat voor 1 januari 2008 is opgericht en waarvoor tot die datum een vergunning in werking en onherroepelijk was;

      voor zover de afstanden opgenomen in de vergunning afwijken van de afstanden, bedoeld in tabel 3.12.

      10 Voor een gasdrukmeet- en regelstation als bedoeld in het negende lid zijn de afstanden opgenomen in de
      vergunning van toepassing.

      11 Het bevoegd gezag kan bij maatwerkvoorschrift eisen stellen aan de veiligheid, voor de situatie, bedoeld in het
      negende lid, voor zover de afstanden opgenomen in de vergunning afwijken van de afstanden, genoemd in het zesde
      lid, tabel 3.12.


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.12
