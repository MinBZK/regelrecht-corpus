  - number: 3.54g
    text: >-
      1 Gevaarlijke stoffen van de ADR klasse 1.1, 1.2 of 1.3 worden binnen inrichtingen die in gebruik zijn bij de
      Nederlandse of een bondgenootschappelijke krijgsmacht zodanig opgeslagen of bewerkt dat:


      a. de veiligheidszones van de activiteit niet groter zijn dan de veiligheidszones die volgen uit de munitie-QRA;


      b. de hoeveelheid gevaarlijke stoffen van de ADR klasse 1.1, 1.2 of 1.3 per opslagvoorziening niet groter is
      dan de hoeveelheid die is gebruikt in de munitie-QRA die is ingediend bij de aanvraag voor de laatst verleende
      omgevingsvergunning voor die activiteit, en


      c. de bouwkundige staat van de voorzieningen waarin gevaarlijke stoffen van de ADR klasse 1.1 of 1.2 of meer dan 50
      kilogram NEG van klasse 1.3 worden opgeslagen gelijk is aan de staat waarvan is uitgegaan in de munitie-QRA die is
      ingediend bij de aanvraag voor de laatst verleende omgevingsvergunning voor die activiteit.


      2 In of op elke voorziening voor het opslaan of bewerken van gevaarlijke stoffen van de ADR klasse 1.1, 1.2 of
      1.3 is duidelijk zichtbaar aangegeven welke hoeveelheid NEG per ADR klasse volgens het eerste lid, onderdeel b,
      aanwezig mag zijn.


      3 Indien sprake is van het gezamenlijk opslaan van de ADR klassen 1.1, 1.2 of 1.3, is de totale hoeveelheid NEG
      niet groter dan de maximaal toegestane hoeveelheid van de klasse met de meest dominante effecten, vastgesteld in de
      munitie-QRA die is ingediend bij de aanvraag voor de laatst verleende omgevingsvergunning voor die activiteit.


      4 In afwijking van het derde lid is de totale hoeveelheid NEG van een gezamenlijke opslag van de ADR klassen 1.2
      en 1.3 niet groter dan de toegestane hoeveelheid van de ADR klasse 1.1, indien de gezamenlijke opslag van de ADR
      klassen 1.2 en 1.3 kan reageren als ADR klasse 1.1.


      5 Bij het opslaan of bewerken van gevaarlijke stoffen van de ADR klasse 1.1, 1.2, 1.3, 1.4, 1.5 of 1.6 binnen
      inrichtingen die in gebruik zijn bij de Nederlandse of een bondgenootschappelijke krijgsmacht wordt ten behoeve
      van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan, voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.54g
  - number: 3.54h
    text: |-
      1 Deze paragraaf is van toepassing op het op- en overslaan van verwijderd asbest:

      a. bij een inrichting waar uitvoering wordt gegeven aan [titel 10.4 van de wet][ref1], of

      b. dat afkomstig is van werkzaamheden die buiten de inrichting zijn verricht door degene die de inrichting drijft,
      in een hoeveelheid van ten hoogste 50 ton.

      2 Deze paragraaf is van overeenkomstige toepassing op een verwijderd asbesthoudend product.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.54h
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 3.54i
    text: |-
      1 In het belang van het doelmatig beheer van afvalstoffen wordt bij het op- en overslaan van asbest ten minste
      voldaan aan het tweede tot en met vierde lid.

      2 Het op- en overslaan van asbest geeft geen stofverspreiding die met het blote oog waarneembaar is.

      3 Asbest is uitsluitend aanwezig in een container en verpakt in niet luchtdoorlatend verpakkingsmateriaal van
      voldoende dikte en sterkte.

      4 Als de inrichtinghouder asbest van verschillende saneringen samenvoegt in een container, legt hij per container
      vast van welke saneringen het asbest afkomstig is. De drijver van de inrichting bewaart deze gegevens gedurende ten
      minste vijf jaar.

      5 Het vierde lid is niet van toepassing op asbest dat is ingenomen bij een inrichting waar uitvoering wordt gegeven
      aan [titel 10.4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.54i
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '3.55'
    text: Deze paragraaf is van toepassing op het telen of kweken van gewassen in een kas.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.55
  - number: '3.56'
    text: >-
      1 Een kas waarin assimilatiebelichting wordt toegepast, is aan de bovenzijde voorzien van een
      lichtscherminstallatie waarmee ten minste 98% van de lichtuitstraling kan worden gereduceerd.


      2 Het eerste lid is niet van toepassing op een kas waarin uitsluitend assimilatiebelichting wordt toegepast buiten
      de donkerteperiode.


      3 In afwijking van het eerste lid is een kas waarin assimilatiebelichting wordt toegepast tot 1 januari 2017 aan
      de bovenzijde voorzien van een lichtscherminstallatie waarmee ten minste 95% van de lichtuitstraling kan worden
      gereduceerd, indien deze lichtscherminstallatie is aangebracht voor 1 januari 2014.


      4 Het eerste lid is tot 1 januari 2018 niet van toepassing op een kas waarin assimilatiebelichting wordt toegepast
      en waarbij het technisch of teelttechnisch redelijkerwijs niet kan worden gevergd de bovenzijde te voorzien van een
      lichtscherminstallatie als bedoeld in dat lid.


      5 Het eerste en tweede lid zijn tot 1 januari 2021 niet van toepassing op een kas, kleiner dan 2.500 vierkante
      meter, waarin assimilatiebelichting wordt toegepast.


      6 Op een kas als bedoeld in het vijfde lid is tot 1 januari 2021 paragraaf 1.5 van de [bijlage bij het Besluit
      landbouw milieubeheer](onbekend) zoals deze luidde tot 1 januari 2013 van toepassing.


      7 Het eerste en tweede lid zijn tot 1 januari 2018 niet van toepassing op een inrichting waar kunstmatige
      belichting van gewassen wordt toegepast, gericht op de beïnvloeding van het groeiproces van de gewassen, waarvan
      het geïnstalleerde elektrische vermogen op 1 januari 2013 minder bedraagt dan 20 Watt per vierkante meter.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.56
  - number: '3.57'
    text: >-
      1 Indien assimilatiebelichting met een verlichtingssterkte van ten minste 15.000 lux wordt toegepast, is vanaf
      het tijdstip van zonsondergang tot het tijdstip van zonsopgang de bovenzijde van de kas op een zodanige wijze
      afgeschermd dat ten minste 98% van de lichtuitstraling wordt gereduceerd.


      2 Het bevoegd gezag kan, indien het belang van de bescherming van het milieu zich daartegen niet verzet, bij
      maatwerkvoorschrift een ander percentage dan het percentage, bedoeld in het eerste lid, vaststellen.


      3 Het eerste en tweede lid zijn tot 1 januari 2021 niet van toepassing op een kas, kleiner dan 2.500 vierkante
      meter, waarin assimilatiebelichting wordt toegepast.


      4 Op een kas als bedoeld in het derde lid is tot 1 januari 2021 paragraaf 1.5 van de [bijlage bij het Besluit
      landbouw milieubeheer](onbekend) zoals deze luidde tot 1 januari 2013 van toepassing.


      5 Het eerste en tweede lid zijn tot 1 januari 2018 niet van toepassing op een inrichting waar kunstmatige
      belichting van gewassen wordt toegepast, gericht op de beïnvloeding van het groeiproces van de gewassen, waarvan
      het geïnstalleerde elektrische vermogen op 1 januari 2013 minder bedraagt dan 20 Watt per vierkante meter.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.57
  - number: '3.58'
    text: >-
      1 Indien assimilatiebelichting met een verlichtingssterkte van minder dan 15.000 lux wordt toegepast, is:


      a. gedurende de donkerteperiode die toepassing niet toegestaan, tenzij de bovenzijde op een zodanige wijze is
      afgeschermd dat de lichtuitstraling met ten minste 98% wordt gereduceerd, en


      b. gedurende de nanacht die toepassing niet toegestaan, tenzij de bovenzijde op een zodanige wijze is afgeschermd
      dat de lichtuitstraling met ten minste 74% wordt gereduceerd.


      2 Het bevoegd gezag kan, indien het belang van de bescherming van het milieu zich daartegen niet verzet, bij
      maatwerkvoorschrift een ander percentage dan het percentage in het eerste lid, onder a en b, vaststellen.


      3 Het eerste lid, onderdeel b, is tot 1 januari 2018 niet van toepassing op een kas waarin assimilatiebelichting
      wordt toegepast en waarbij het technisch of teelttechnisch redelijkerwijs niet kan worden gevergd de bovenzijde te
      voorzien van een lichtscherminstallatie als bedoeld in dat onderdeel.


      4 In afwijking van het eerste en tweede lid is, indien assimilatiebelichting met een verlichtingssterkte van minder
      dan 15.000 lux wordt toegepast, tot 1 januari 2017 gedurende de donkerteperiode die toepassing niet toegestaan,
      tenzij de bovenzijde op een zodanige wijze is afgeschermd dat de lichtuitstraling met ten minste 95% wordt
      gereduceerd.


      5 Het eerste en tweede lid zijn tot 1 januari 2021 niet van toepassing op een kas, kleiner dan 2.500 vierkante
      meter, waarin assimilatiebelichting wordt toegepast.


      6 Op een kas als bedoeld in het vijfde lid is tot 1 januari 2021 paragraaf 1.5 van de [bijlage bij het Besluit
      landbouw milieubeheer](onbekend) zoals deze luidde tot 1 januari 2013 van toepassing.


      7 Het eerste en tweede lid zijn tot 1 januari 2018 niet van toepassing op een inrichting waar kunstmatige
      belichting van gewassen wordt toegepast, gericht op de beïnvloeding van het groeiproces van de gewassen, waarvan
      het geïnstalleerde elektrische vermogen op 1 januari 2013 minder bedraagt dan 20 Watt per vierkante meter.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.58
  - number: '3.59'
    text: >-
      Vanaf het tijdstip van zonsondergang tot het tijdstip van zonsopgang is de gevel van een kas waarin
      assimilatiebelichting wordt toegepast op een zodanige wijze afgeschermd dat de lichtuitstraling op een afstand van
      ten hoogste 10 meter van die gevel met ten minste 95% wordt gereduceerd en de gebruikte lampen buiten de inrichting
      niet zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.59
  - number: '3.60'
    text: >-
      1 Bij het lozen uit het hemelwaterafvoersysteem van een kas, wordt ten minste voldaan aan het tweede tot en met
      vijfde lid.


      2 Het lozen in een vuilwaterriool is verboden.


      3 Het lozen anders dan in een vuilwaterriool is toegestaan.


      4 Indien bij het lozen, bedoeld in het derde lid, een hemelwateropvangvoorziening aanwezig is die volledig
      is benut, wordt het hemelwater geloosd via een overstortvoorziening, die is aangebracht voorafgaand aan de
      hemelwateropvangvoorziening.


      5 Het vierde lid is niet van toepassing, indien:


      a. de opvangvoorziening, bedoeld in dat lid, een inhoud heeft van ten minste 3500 kubieke meter per hectare
      teeltoppervlak;


      b. de kas zodanig is gebouwd dat condenswater niet in het hemelwaterafvoersysteem kan geraken;


      c. in de kas gewasbeschermingsmiddelen of biociden zodanig worden toegepast dat ze niet in het
      hemelwaterafvoersysteem kunnen geraken, of


      d. in de kas uitsluitend sprake is van biologische productiemethoden.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.60
  - number: '3.61'
    text: >-
      1 Bij het lozen van condenswater afkomstig van condensvorming aan de binnenzijde van de kas dat via condensgootjes
      wordt verzameld, wordt ten minste voldaan aan het tweede en derde lid.


      2 Het lozen in een vuilwaterriool is verboden, indien in de kas gewasbeschermingsmiddelen of biociden worden
      toegepast.


      3 Het lozen anders dan in een vuilwaterriool is toegestaan, indien condenswater afkomstig is van een kas:


      a. waarin geen gewasbeschermingsmiddelen of biociden worden toegepast, of


      b. waarin uitsluitend sprake is van biologische productiemethoden.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.61
  - number: '3.62'
    text: >-
      1 Bij het lozen van afvalwater afkomstig van het reinigen van de buitenkant van een kas wordt ten minste voldaan
      aan tweede tot en met vierde lid.


      2 Het lozen in een vuilwaterriool is verboden.


      3 Het lozen anders dan in een vuilwaterriool is toegestaan.


      4 Bij het lozen in een oppervlaktewaterlichaam vindt geen visuele verontreiniging plaats.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.62
  - number: '3.63'
    text: |-
      1 Het in een oppervlaktewaterlichaam lozen van:

      a. spoelwater van filters van een waterdoseringsinstallatie;

      b. afvalwater dat bloemvoorbehandelingsmiddelen uitsluitend op basis van actief chloor bevat;

      c. drainagewater afkomstig van een teelt waarbij gewassen op een bodem groeien die in verbinding staat met de
      ondergrond;

      d. drainwater;

      e. afvalwater afkomstig van het spuiten of schrobben van vloeren, niet zijnde vloeren van ruimten waar
      gewasbeschermingsmiddelen of biociden worden aangemaakt;

      f. reinigingswater van leidingen, druppelaars en slangen die onderdeel uitmaken van het systeem waarmee
      voedingswater aan het gewas wordt toegediend;

      g. condenswater van stoomleidingen en condenswater van verwarmingsketels;

      h. condenswater van warmtekrachtinstallaties, of

      i. afvalwater afkomstig van het bij opkweekbedrijven doorspoelen van substraatblokken die bestemd zijn voor de
      opkweek van uitgangsmateriaal;

      is toegestaan, indien ten minste:

      1°. het perceel waar het afvalwater vrijkomt niet is aangesloten op een vuilwaterriool of zuiveringtechnisch werk,
      waarop geloosd kan worden, en de afstand tot het dichtstbijzijnde vuilwaterriool waarop kan worden aangesloten en
      geloosd, meer dan 40 meter bedraagt, of

      2°. het lozen, bedoeld onder a tot en met j, in een vuilwaterriool, waarop het perceel waar het afvalwater vrijkomt
      is aangesloten, gelet op de capaciteit van dat vuilwaterriool niet volledig mogelijk is.

      2 De afstand, genoemd in het eerste lid, onderdeel 1°, wordt berekend:

      a. vanaf de kadastrale grens van het perceel waar het afvalwater vrijkomt, en

      b. langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.

      3 In afwijking van het eerste lid, onderdeel 1°, kan het bevoegd gezag bij maatwerkvoorschrift een grotere afstand
      vaststellen dan de afstand, genoemd in dat onderdeel, waarbij de afstand niet meer dan 10 meter per 0,1 hectare
      teeltoppervlak bedraagt en wordt berekend overeenkomstig het tweede lid.

      4 In een geval bedoeld in het eerste lid, onder 2°:

      a. wordt, voorafgaand aan het lozen in een oppervlaktewaterlichaam de afvoercapaciteit van het vuilwaterriool
      optimaal benut, en

      b. vindt lozen in dat vuilwaterriool plaats in een bij ministeriële regeling aangegeven volgorde.

      5 Het bevoegd gezag kan bij maatwerkvoorschrift dan wel bij gemeentelijke verordening een andere volgorde bepalen,
      dan de volgorde aangegeven in de ministeriële regeling, bedoeld in het vierde lid, onderdeel b.

      6 Het bevoegd gezag kan met betrekking tot het vierde lid, onderdeel a, maatwerkvoorschriften stellen ten aanzien
      van:

      a. de per tijdseenheid te lozen hoeveelheid;

      b. voorzieningen die gespreide afvoer in het vuilwaterriool mogelijk maken, of

      c. een buffervoorziening met een inhoud van ten hoogste 50 kubieke meter per hectare.

      7 Indien met toepassing van het eerste lid, het lozen in een oppervlaktewaterlichaam is toegestaan, zijn op dat
      lozen de [artikelen 3.66][ref1] en [3.71][ref2] van overeenkomstige toepassing.

      8 In afwijking van het tweede lid, onderdeel a, wordt de afstand tot het dichtstbijzijnde vuilwaterriool of
      zuiveringstechnisch werk bij voortzetting van het lozen van afvalwater in het oppervlaktewaterlichaam dat voor
      1 januari 2013 al plaatsvond, berekend vanaf de plaats waar het afvalwater vrijkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.66
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.71
