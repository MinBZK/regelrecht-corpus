  - number: 1.21b
    text: |-
      1 Bij een melding als bedoeld in [artikel 1.10][ref1] wordt een munitie-QRA gevoegd, die voldoet aan de regels,
      gesteld krachtens [artikel 2.6.7, vijfde lid, van het Besluit algemene regels ruimtelijke ordening][ref2],
      indien sprake is van het binnen een inrichting die in gebruik is bij de Nederlandse of een bondgenootschappelijke
      krijgsmacht:

      a. oprichten van een voorziening waarin gevaarlijke stoffen van de ADR klasse 1.1 of 1.2 of meer dan 50 kilogram
      NEG van klasse 1.3 worden opgeslagen;

      b. uitbreiden van de hoeveelheid opgeslagen gevaarlijke stoffen van de ADR klasse 1.1 of 1.2 per opslagvoorziening;

      c. uitbreiden van de hoeveelheid opgeslagen gevaarlijke stoffen van de ADR klasse 1.3 per opslagvoorziening, indien
      na uitbreiding meer dan 50 kilogram NEG van deze klasse aanwezig is;

      d. veranderen van de bouwkundige staat van een voorziening waarin gevaarlijke stoffen van de ADR klasse 1.1 of 1.2
      of meer dan 50 kilogram NEG van klasse 1.3 wordt opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.6.7
