        afdeling: '4.5'
  - number: '4.87'
    text: >-
      Degene die een inrichting drijft waar gelegenheid wordt geboden voor het niet beroepsmatig onderhouden, repareren
      of afspuiten van pleziervaartuigen voldoet ten behoeve van het voorkomen van milieuverontreiniging bij die
      werkzaamheden ten minste aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.87
  - number: '4.88'
    text: >-
      Bij het onderhouden, repareren of afspuiten van pleziervaartuigen wordt ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.88
  - number: 4.88a
    text: Deze paragraaf is van toepassing op het ontwikkelen of afdrukken van fotografisch materiaal.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.88a
  - number: '4.89'
    text: >-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het ontwikkelen of afdrukken van fotografisch
      materiaal wordt ten minste voldaan aan het tweede tot en met het vijfde lid.


      2 Bij het ontwikkelen of afdrukken van fotografisch materiaal worden in goede staat verkerende afkwetsrollen
      gebruikt en een doelmatige zilverterugwininstallatie toegepast.


      3 In afwijking van het tweede lid behoeft geen zilverterugwininstallatie te worden toegepast indien per jaar minder
      dan 700 liter aan gebruiksklare fixeer wordt gebruikt en in de inrichting gedragsvoorschriften aanwezig zijn en
      worden nageleefd gericht op de beperking van de zilveremissie.


      4 Het gehalte aan zilver in het afvalwater afkomstig van het ontwikkelen of afdrukken van fotografisch materiaal
      bedraagt in enig steekmonster minder dan 4 milligram per liter.


      5 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.89
  - number: 4.89a
    text: Deze paragraaf is van toepassing op het zeefdrukken.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.89a
  - number: '4.90'
    text: >-
      Voor de eindreiniging van zeefdrukramen worden uitsluitend reinigingsmiddelen gebruikt met een vlampunt groter dan
      55 graden Celsius of op waterbasis.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.90
  - number: '4.91'
    text: |-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van zeefdruk wordt ten minste voldaan aan het tweede
      en derde lid en [artikel 4.92][ref1].

      2 Bij het reinigen van zeefdrukramen wordt het lozen van oplosmiddelen en inkten zoveel mogelijk voorkomen door
      het verwijderen van inkt en het strippen van de sjabloon procesmatig te scheiden. Het lozen mag uitsluitend
      bestaan uit het lozen van spoelwater afkomstig van het polijsten, ontvetten of ontwikkelen van het zeefdrukgaas,
      sjabloonverwijdering of schaduwbeeldverwijdering.

      3 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.92
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.91
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4.92'
        hoofdstuk: '4'
        paragraaf: 4.7.2
        afdeling: '4.7'
  - number: '4.92'
    text: |-
      Bij het lozen als bedoeld in [artikel 4.91][ref1] wordt rekening gehouden met de beschikbare milieu-informatie
      van de stoffen die in het afvalwater kunnen geraken. Indien op grond van die informatie uit de algemene
      beoordelingsmethodiek voor stoffen en preparaten zoals opgenomen in het BBT-informatiedocument Algemene
      BeoordelingsMethodiek 2016, aangewezen krachtens [artikel 5.4, eerste lid, van het Besluit omgevingsrecht][ref2]
      blijkt dat de stof wordt aangemerkt als een stof met saneringsinspanning Z of A, wordt deze niet geloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.91
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.92
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4.91'
        hoofdstuk: '4'
        paragraaf: 4.7.2
        afdeling: '4.7'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '5.4'
  - number: '4.93'
    text: >-
      Bij het zeefdrukken wordt ten behoeve van


      a. het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van geurhinder;


      b. het realiseren van een verwaarloosbaar bodemrisico,


      voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.93
  - number: 4.93a
    text: Deze paragraaf is van toepassing op het bedrukken met vellenoffset.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.93a
  - number: '4.94'
    text: |-
      Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het toepassen van
      anti-smetpoeder in vellenoffsetdrukpersen de emissieconcentratie van stofklasse S niet meer dan:

      a. 5 milligram per normaal kubieke meter indien de massastroom van stofklasse S gelijk is aan of groter is dan 200
      gram per uur;

      b. 50 milligram per normaal kubieke meter indien de massastroom van stofklasse S kleiner is dan 200 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.94a
    text: |-
      1 Degene die de inrichting drijft, neemt bij het bedrukken met vellenoffset met betrekking tot vluchtige
      organische stoffen de bij ministeriële regeling voorgeschreven emissiereducerende maatregelen, tenzij deze niet
      kosteneffectief of technisch uitvoerbaar zijn.

      2 Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de in het
      eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar.

      3 Indien het bedrukken met vellenoffset plaatsvindt in samenhang met het coaten van het substraat en daarbij de
      drempelwaarden, genoemd in tabel 2.28a worden overschreden, zijn het eerste en tweede lid niet van toepassing op
      het bedrukken met vellenoffset en het reinigen van de daarbij gebruikte apparatuur en is [afdeling 2.11][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '2'
        afdeling: '2.11'
  - number: 4.94b
    text: |-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van:

      a. het toepassen van vellenoffsettechnieken;

      b. het reinigen van de daarbij gebruikte apparatuur, of

      c. de vormvervaardiging exclusief fotografische processen,

      wordt ten minste voldaan aan het tweede tot en met het vierde lid.

      2 Het afvalwater afkomstig van het reinigen van rubberdoeken en drukvormen van vellenoffsetpersen bevat, voor
      vermenging met ander afvalwater, niet meer dan 200 milligram olie per liter in enig steekmonster.

      3 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.

      4 Bij het lozen, bedoeld in het eerste lid, wordt rekening gehouden met de beschikbare milieu-informatie
      van de stoffen die in het afvalwater kunnen geraken. Indien op grond van die informatie uit de algemene
      beoordelingsmethodiek voor stoffen en preparaten zoals opgenomen in het BBT-informatiedocument Algemene
      BeoordelingsMethodiek 2016, aangewezen krachtens [artikel 5.4, eerste lid, van het Besluit omgevingsrecht][ref1],
      blijkt dat de stof wordt aangemerkt als een stof met saneringsinspanning Z of A, wordt deze niet geloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94b
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5.4'
  - number: 4.94c
    text: >-
      1 Bij de vervaardiging van drukvormen voor het bedrukken met vellenoffset worden geen chroomzouthoudende ets- en
      correctiemiddelen toegepast.


      2 Bij het ontwikkelen en naharden van kopieerlagen voor het bedrukken met vellenoffset worden geen chroomhoudende
      oplossingen gebruikt.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94c
  - number: 4.94d
    text: >-
      Bij het bedrukken met vellenoffset worden ten behoeve van:


      a. het voorkomen dan wel beperken van diffuse emissies;


      b. het doelmatig verspreiden van emissies naar de buitenlucht;


      c. het voorkomen dan wel beperken van geurhinder, en


      d. het realiseren van een verwaarloosbaar bodemrisico,


      de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94d
  - number: 4.94da
    text: Deze paragraaf is van toepassing op het bedrukken met rotatieoffset druktechniek.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94da
  - number: 4.94db
    text: >-
      Indien bij het bedrukken met heatsetrotatieoffset druktechniek de drempelwaarden, genoemd in tabel 2.28a van
      afdeling 2.11 worden overschreden, is die afdeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94db
  - number: 4.94dc
    text: |-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van:

      a. het toepassen van rotatieoffset druktechniek;

      b. het reinigen van de daarbij gebruikte apparatuur, of

      c. de vormvervaardiging exclusief fotografische processen,

      wordt ten minste voldaan aan het tweede tot en met vierde lid.

      2 Het afvalwater afkomstig van het reinigen van rubberdoeken en drukvormen van rotatieoffset druktechniekpersen
      bevat, voor vermenging met ander afvalwater, niet meer dan 200 milligram olie per liter in enig steekmonster.

      3 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.

      4 Het te lozen afvalwater bevat geen stoffen die op grond van het BBT-informatiedocument Algemene
      BeoordelingsMethodiek 2016, aangewezen krachtens [artikel 5.4, eerste lid, van het Besluit omgevingsrecht][ref1],
      worden aangemerkt als stoffen waarvoor een saneringsinspanning Z of A geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94dc
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5.4'
  - number: 4.94dd
    text: >-
      1 Bij het vervaardigen van drukvormen voor het bedrukken met rotatieoffset druktechniek worden geen
      chroomzouthoudende ets- en correctiemiddelen toegepast.


      2 Bij het ontwikkelen en naharden van kopieerlagen voor het bedrukken met rotatieoffset druktechniek worden geen
      chroomhoudende oplossingen gebruikt.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94dd
  - number: 4.94de
    text: >-
      Bij het bedrukken met rotatieoffset druktechniek wordt ten behoeve van:


      a. het voorkomen dan wel voor zover dat niet mogelijk is het beperken van diffuse emissies;


      b. het voorkomen dan wel voor zover dat niet mogelijk is het beperken van geurhinder, en


      c. het realiseren van een verwaarloosbaar bodemrisico,


      voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94de
  - number: 4.94df
    text: Deze paragraaf is van toepassing op het bedrukken met flexodruktechniek of verpakkingsdiepdruktechniek.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94df
  - number: 4.94dg
    text: |-
      Indien bij de toepassing van flexodruktechniek of verpakkingsdiepdruktechniek de drempelwaarden, genoemd in
      [tabel 2.28a van afdeling 2.11][ref1] worden overschreden, is die afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.28
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94dg
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.28'
        hoofdstuk: '2'
        afdeling: '2.11'
  - number: 4.94dh
    text: |-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van de toepassing van flexodruktechniek of
      verpakkingsdiepdruktechniek, waarbij gebruik wordt gemaakt van watergedragen inkten, wordt rekening gehouden met de
      beschikbare milieu-informatie van de stoffen die in het afvalwater kunnen geraken.

      2 Het te lozen afvalwater bevat geen stoffen die op grond van het BBT-informatiedocument Algemene
      BeoordelingsMethodiek 2016, aangewezen krachtens [artikel 5.4, eerste lid, van het Besluit omgevingsrecht][ref1],
      worden aangemerkt als stoffen waarvoor een saneringsinspanning Z of A geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94dh
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5.4'
  - number: 4.94di
    text: >-
      Bij het toepassen van flexodruktechniek of verpakkingsdiepdruktechniek wordt ten behoeve van:


      a. het voorkomen dan wel voor zover dat niet mogelijk is het beperken van diffuse emissies;


      b. het voorkomen dan wel voor zover dat niet mogelijk is het beperken van geurhinder;


      c. het realiseren van een verwaarloosbaar bodemrisico, of


      d. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan,


      voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94di
  - number: 4.94dj
    text: Deze paragraaf is van toepassing op het bewerken, lijmen, coaten of lamineren van papier of karton.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94dj
  - number: 4.94e
    text: |-
      1 Degene die de inrichting drijft neemt bij het lijmen, coaten of lamineren van papier of karton met betrekking tot
      vluchtige organische stoffen de bij ministeriële regeling voorgeschreven emissiereducerende maatregelen tenzij deze
      niet kosteneffectief of technisch uitvoerbaar zijn.

      2 Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de in het
      eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar.

      3 Indien de drempelwaarden, genoemd in tabel 2.28a worden overschreden, zijn het eerste en tweede lid niet van
      toepassing en is [afdeling 2.11][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94e
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '2'
        afdeling: '2.11'
  - number: 4.94f
    text: >-
      Bij het lijmen, coaten of lamineren van papier of karton worden ten behoeve van:


      a. het voorkomen dan wel beperken van diffuse emissies;


      b. het voorkomen dan wel beperken van geurhinder, en


      c. het realiseren van een verwaarloosbaar bodemrisico,


      de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94f
  - number: 4.94g
    text: |-
      1 Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het mechanisch
      verkleinen van papier of karton of van papieren of kartonnen producten de emissieconcentratie van stofklasse S niet
      meer dan:

      a. 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar de lucht gelijk is aan of
      groter is dan 200 gram per uur;

      b. 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.

      2 Bij het mechanisch verkleinen van papier of karton of van papieren of kartonnen producten worden ten behoeve van
      het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht
      de bij ministeriële regeling voorgeschreven maatregelen toegepast.

      3 Bij het mechanisch verkleinen van papier of karton of van papieren of kartonnen producten wordt ten behoeve van
      het realiseren van een verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94g
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.94ga
    text: Deze paragraaf is van toepassing op het reinigen of wassen van textiel.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.94ga
  - number: '4.95'
    text: >-
      1 Het reinigen van textiel vindt voor zover daar chemische stoffen bij worden gebruikt, uitsluitend plaats met
      behulp van PER of niet-gechloreerde alifatische koolwaterstoffen.


      2 Bij ministeriële regeling kunnen andere stoffen dan genoemd in het eerste lid, worden aangewezen.


      3 Degene die een inrichting drijft waarin activiteiten worden uitgeoefend als bedoeld in het eerste lid, voert een
      oplosmiddelenboekhouding, overeenkomstig de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.95
  - number: '4.101'
    text: |-
      1 Een machine bestemd voor het reinigen met een koolwaterstof wordt zo ingesteld, gebruikt en onderhouden dat de
      hoeveelheid van die koolwaterstof in het gereinigde textiel en in de vrijkomende drooglucht niet meer bedraagt dan
      20 gram per kilogram gereinigd textiel.

      2 Indien bij ministeriële regeling als bedoeld in [artikel 4.95, tweede lid][ref1], een andere stof wordt
      aangewezen dan die genoemd in het eerste lid, kan bij die regeling tevens de ten hoogste toelaatbare hoeveelheid
      van die stof in het gereinigde textiel en in de vrijkomende drooglucht worden aangegeven.

      3 De drijver van de inrichting bewaart het laatste keurings- en onderhoudsrapport, waaruit mede blijkt wie en
      wanneer de keuring of het onderhoud heeft onderscheidenlijk is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.95
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.101
    references:
