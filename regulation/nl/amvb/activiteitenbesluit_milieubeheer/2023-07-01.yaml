  - number: '1.11'
    text: |-
      1 Bij de melding, bedoeld in [artikel 1.10][ref1], wordt een rapport van een akoestisch onderzoek gevoegd
      indien tussen 19.00 en 7.00 uur naar verwachting gemiddeld meer dan vier transportbewegingen plaatsvinden met
      motorvoertuigen waarvan de massa van het ledig voertuig vermeerderd met het laadvermogen meer is dan 3.500 kilogram
      en binnen een afstand van 50 meter van de grens van de inrichting gevoelige objecten aanwezig zijn. Het gemiddelde
      als bedoeld in de eerste volzin betreft een gemiddelde gemeten over de periode van een jaar. Voor inrichtingen
      als bedoeld in [artikel 2.17, vijfde en zesde lid][ref2], wordt in plaats van «tussen 19.00 en 7.00 uur» gelezen
      «tussen 19.00 en 6.00 uur». De eerste volzin is niet van toepassing op inrichtingen die uitsluitend of in
      hoofdzaak bestemd zijn voor de openbare verkoop aan derden van vloeibare brandstof, mengsmering en aardgas voor het
      wegverkeer en inrichtingen waar uitsluitend of in hoofdzaak horeca-activiteiten plaatsvinden.

      2 Bij de melding, bedoeld in [artikel 1.10][ref3], wordt een rapport van een akoestisch onderzoek gevoegd indien
      het, mede op basis van de aard van de inrichting, aannemelijk is dat:

      a. in enig vertrek van de inrichting het equivalente geluidsniveau (L) veroorzaakt door de ten gehore gebrachte
      muziek in de representatieve bedrijfssituatie, meer bedraagt dan:

      1°. 70 dB(A), indien dit vertrek in- of aanpandig is gelegen met gevoelige gebouwen;

      2°. 80 dB(A), indien onderdeel 1° niet van toepassing is; of

      b. in de buitenlucht of op een open terrein van de inrichting muziek ten gehore zal worden gebracht.

      3 Bij een melding als bedoeld in [artikel 1.10][ref4], wordt een rapport van een akoestisch onderzoek gevoegd
      indien:

      a. de melding betrekking heeft op een of meer windturbines;

      b. in de buitenlucht metalen in bulk worden overgeslagen of in de buitenlucht metalen mechanisch worden bewerkt;

      c. de melding betrekking heeft op een inrichting als bedoeld in categorie 27.3 van onderdeel C, van
      [bijlage 1, bij het Besluit omgevingsrecht][ref5];

      d. airbags of gordelspanners worden geneutraliseerd door deze te ontsteken;

      e. de melding betrekking heeft op een inrichting als bedoeld in categorie 11.1, onderdeel b, van onderdeel C, van
      [bijlage 1, bij het Besluit omgevingsrecht][ref6], voor zover het een inrichting betreft voor het vervaardigen van
      betonmortel of betonwaren;

      f. de melding betrekking heeft op een binnenschietbaan en de afstand van de binnenschietbaan tot het
      dichtstbijzijnde gevoelige object kleiner is dan 50 meter, of

      g. de melding betrekking heeft op een buitenschietbaan.

      4 Het bevoegd gezag kan besluiten dat het overleggen van een rapport van een akoestisch onderzoek als bedoeld
      in het eerste tot en met derde lid niet is vereist, indien aannemelijk is dat aan de waarden, bedoeld in de
      [artikelen 2.17][ref7], [2.17a][ref8], 2.19, [2.19a][ref9], [2.20][ref10], [3.14a][ref11], [3.160][ref12], dan wel
      de van toepassing zijnde geluidswaarden van de omgevingsvergunning kan worden voldaan.

      5 Indien er een melding is gedaan als bedoeld in [artikel 1.10, eerste of tweede lid][ref13], en aannemelijk
      is dat, in andere gevallen dan die genoemd in het eerste tot en met derde lid, het langtijdgemiddeld
      beoordelingsniveau (L) of het maximaal geluidsniveau (L) veroorzaakt door de in de inrichting aanwezige
      installaties en toestellen, alsmede door de in de inrichting verrichte werkzaamheden en activiteiten of
      veroorzaakt door de verandering daarvan, meer bedragen dan de waarden, bedoeld in de [artikelen 2.17][ref14],
      2.19, [2.20][ref15], [2.17a][ref16] dan wel de van toepassing zijnde geluidswaarden van de omgevingsvergunning,
      kan het bevoegd gezag binnen vier weken na ontvangst van de melding besluiten dat binnen een door het bevoegd gezag
      gestelde termijn een rapport van een akoestisch onderzoek wordt overgelegd.

      6 Het bevoegd gezag kan binnen vier weken na ontvangst van de melding, bedoeld in [artikel 1.10][ref17], besluiten
      dat een rapport van een akoestisch onderzoek wordt overgelegd indien de inrichting is gelegen op een gezoneerd
      industrieterrein en een rapport van een akoestisch onderzoek noodzakelijk is voor zonebeheer.

      7 Uit het rapport van een akoestisch onderzoek blijkt op grond van verrichte geluidsmetingen of geluidsberekeningen
      of aan de waarden, bedoeld in de [artikelen 2.17][ref18], [2.17a][ref19], 2.19, [2.19a][ref20], [2.20][ref21],
      [3.14a][ref22], [3.160][ref23] dan wel de van toepassing zijnde geluidswaarden van de omgevingsvergunning kan
      worden voldaan. In het rapport wordt aangegeven welke voorzieningen worden getroffen om te voorkomen dat de in de
      eerste volzin bedoelde waarden worden overschreden.

      8 Indien het een inrichting betreft als bedoeld in categorie 11.3, onderdeel c, onder 2° en 3°, van onderdeel
      C, van [bijlage I, bij het Besluit omgevingsrecht][ref24] geeft het rapport tevens een beschrijving van het
      langtijdgemiddelde beoordelingsniveau (L) veroorzaakt door de inrichting op de zonegrens en op gevoelige objecten
      binnen de zone op basis waarvan het bevoegd gezag kan beoordelen of aan de geluidsvoorwaarden voor de zone kan
      worden voldaan.

      9 Het akoestisch onderzoek wordt uitgevoerd overeenkomstig de Handleiding meten en rekenen industrielawaai.

      10 In afwijking van het negende lid wordt het akoestisch onderzoek voor windturbines, een buitenschietbaan of een
      binnenschietbaan uitgevoerd overeenkomstig de bij ministeriële regeling te stellen eisen.

      11 Indien aannemelijk is dat de geluidniveaus vanwege werkzaamheden en activiteiten bij een inrichting als
      bedoeld in [artikel 2.17, vijfde lid][ref25], een significante bijdrage leveren aan de totale geluidsbelasting
      van de inrichting, kan het bevoegd gezag binnen vier weken na ontvangst van de melding besluiten dat een rapport
      van een akoestisch onderzoek wordt overgelegd. Het onderzoek richt zich met gebruikmaking van geluidmetingen of
      geluidberekeningen op de bestaande en te verwachten geluidniveaus vanwege de werkzaamheden en activiteiten. In
      het rapport wordt aangegeven welke technische voorzieningen worden getroffen en welke gedragsregels in acht worden
      genomen om deze geluidsniveaus te beperken.


