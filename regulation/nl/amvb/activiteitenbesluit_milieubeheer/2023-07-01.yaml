  - number: '5.15'
    text: >-
      1 Deze paragraaf is van toepassing op het in werking hebben van een afvalverbrandings- of een
      afvalmeeverbrandingsinstallatie waar vaste of vloeibare afvalstoffen worden verbrand of meeverbrand.


      2 Deze paragraaf is niet van toepassing op:


      a. een afvalverbrandings- of afvalmeeverbrandingsinstallatie waarin uitsluitend de volgende afvalstoffen thermisch
      worden behandeld of producten van thermische behandeling van uitsluitend de volgende afvalstoffen worden verbrand:


      1°. biomassa;


      2°. radioactieve afvalstoffen;


      3°. afvalstoffen ontstaan bij de exploratie en exploitatie van olie- en gasbronnen vanaf een installatie in zee en
      die aan boord van die installatie worden verbrand;


      b. een experimentele afvalverbrandings- of afvalmeeverbrandingsinstallatie, bestemd voor onderzoek, ontwikkeling
      en tests ter verbetering van het thermisch behandelingsproces, waarin per kalenderjaar minder dan 50.000 kilogram
      afvalstoffen wordt verwerkt;


      c. installaties voor vergassing of pyrolyse, voor zover de gassen die het resultaat zijn van deze thermische
      behandeling van afvalstoffen vóór de verbranding zodanig worden gereinigd dat bij de verbranding ervan niet meer
      emissies ontstaan dan bij de verbranding van aardgas.


      3 Voor de toepassing van deze paragraaf omvat een afvalverbrandings- en afvalmeeverbrandingsinstallatie alle
      verbrandingsstraten of meeverbrandingsstraten en de voorzieningen voor ontvangst, opslag en voorbehandeling ter
      plaatse van het afval, de systemen voor de toevoer van afval, brandstof en lucht, stoomketels, de voorzieningen
      voor de behandeling van afgassen, de voorzieningen voor de behandeling of opslag van afvalverbrandingsresiduen
      en afvalwater, de schoorstenen, alsook de apparatuur en de systemen voor de regeling van het verbrandings- of
      meeverbrandingsproces en voor de registratie en monitoring van de verbrandings- of meeverbrandingsomstandigheden.


      4 Indien voor de thermische behandeling van afval gebruik wordt gemaakt van andere processen van oxidatie, omvat
      de afvalverbrandings- of de afvalmeeverbrandingsinstallatie zowel het proces voor thermische behandeling als het
      daaropvolgende verbrandingsproces.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.15
  - number: '5.16'
    text: |-
      Een afvalverbrandings- en afvalmeeverbrandingsinstallatie wordt op een zodanige wijze ontworpen, uitgerust,
      onderhouden en geëxploiteerd, met inbegrip van een op berekeningen gebaseerde hoogte van de schoorsteen, dat
      afgassen op gecontroleerde wijze door de schoorsteen worden afgevoerd en wordt voorkomen dat de emissies in de
      lucht leiden tot overschrijding van:

      a. de bij of krachtens dit besluit geldende emissiegrenswaarden;

      b. de in [bijlage 2 van de wet][ref1] opgenomen grenswaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '5.17'
    text: |-
      1 Degene die een inrichting drijft waarbinnen zich een afvalverbrandings- of afvalmeeverbrandingsinstallatie
      bevindt, draagt er zorg voor dat afvalstoffen niet in ontvangst worden genomen dan nadat:

      a. ten minste de massa van de afvalstoffen, voor zover mogelijk per categorie, genoemd in de afvalstoffenlijst, is
      bepaald en geregistreerd;

      b. voor zover het gevaarlijke afvalstoffen betreft: ten minste van die afvalstoffen representatieve monsters zijn
      genomen, zo mogelijk voordat de lading wordt gelost, en die monsters zijn geanalyseerd, tenzij dit niet gepast is;

      c. voor zover het gevaarlijke afvalstoffen betreft: hij van de ontdoener van die afvalstoffen ten minste de
      volgende gegevens heeft ontvangen en daarvan de gegevens, bedoeld onder 1° en 2°, heeft gecontroleerd:

      1°. de begeleidingsbrieven, bedoeld in [artikel 10.39, eerste lid, onder b, van de wet][ref1] en, voor zover van
      toepassing, op grond van bijlage IB bij de EG-verordening overbrenging van afvalstoffen;

      2°. de gegevens die vereist zijn bij of krachtens de [Wet vervoer gevaarlijke stoffen][ref2];

      3°. gegevens over de gevaarlijke eigenschappen van de gevaarlijke afvalstoffen;

      4°. gegevens over de stoffen waarmee zij niet mogen worden gemengd;

      5°. gegevens over de bij de behandeling van de gevaarlijke afvalstoffen te treffen voorzorgsmaatregelen;

      6°. de fysische, en voor zover mogelijk, chemische samenstelling van de afvalstoffen;

      7°. alle overige gegevens die nodig zijn voor de beoordeling van de geschiktheid van die stoffen voor het beoogde
      verbrandingsproces.

      2 De monsters, bedoeld in het eerste lid, onder b, worden ten minste gedurende een maand na het thermisch
      behandelen van de partij waaruit de monsters zijn genomen, bewaard. De omstandigheden waaronder de monsters worden
      bewaard, zijn zodanig dat de fysische en chemische samenstelling ongewijzigd blijft.

      3 De gegevens, bedoeld in het eerste lid, onder a en c, worden ten minste gedurende vijf jaren na het thermisch
      behandelen van de partij waarop de gegevens betrekking hebben, bewaard.

      4 Het bevoegd gezag kan bij vergunningvoorschrift afwijken van het bepaalde in het eerste, tweede en derde
      lid, voor zover het een IPPC-installatie betreft waarin uitsluitend afvalstoffen thermisch worden behandeld die
      afkomstig zijn van diezelfde IPPC-installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.39
      [ref2]: https://wetten.overheid.nl/BWBR0007606
