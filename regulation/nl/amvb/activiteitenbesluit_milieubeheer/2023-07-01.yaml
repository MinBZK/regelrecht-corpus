    text: Een stookinstallatie kan gelegen zijn binnen de Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.8
  - number: '3.9'
    text: |-
      1 Het rookgas van een installatie voor de regeneratie van glycol voldoet aan een emissiegrenswaarde van
      stikstofoxiden naar de lucht van ten hoogste 80 mg/Nm3.

      2 Indien de kwaliteit van het aardgas en de technische kenmerken van de in het eerste lid genoemde installatie
      daartoe aanleiding geven, kan het bevoegd gezag, bij maatwerkvoorschrift een hogere emissiegrenswaarde voor
      stikstofoxiden dan genoemd in dat lid vaststellen. De emissiegrenswaarde voor stikstofoxiden naar de lucht is in
      dat geval ten hoogste 150 mg/Nm3 indien het belang van de bescherming van het milieu zich daartegen niet verzet.

      3 Ten aanzien van de technische kenmerken, bedoeld in het tweede lid, wordt onder meer rekening gehouden met de
      kosteneffectiviteit, bedoeld in [artikel 2.7, vierde tot en met zesde lid][ref1], en met de integrale afweging van
      de mogelijkheden voor emissiebeperking.

      4 De emissiegrenswaarden genoemd in het eerste en tweede lid zijn tot 1 januari 2019 niet van toepassing op het
      rookgas van een stookinstallatie voor de regeneratie van glycol die voor 1 januari 2016 in gebruik is genomen.

      5 Voor installaties als bedoeld in het vierde lid blijven, in afwijking van [artikel 6.1][ref2], tot 1 januari 2019
      de emissiegrenswaarden van de vergunning van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6.1
