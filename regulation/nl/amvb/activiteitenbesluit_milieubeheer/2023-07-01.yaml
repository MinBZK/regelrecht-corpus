    text: |-
      1 Deze paragraaf is van toepassing op het lozen van afvalwater dat vrijkomt bij een calamiteitenoefening met
      uitzondering van inrichtingen voor het oefenen van brandbestrijdingstechnieken als bedoeld in categorie 26 van
      onderdeel C van [bijlage I bij het Besluit omgevingsrecht][ref1].

      2 Het lozen van afvalwater is toegestaan.


