  - number: '4.75'
    text: |-
      1 Bij het in het vuilwaterriool lozen van afvalwater afkomstig van een of meer activiteiten als bedoeld in de
      [paragrafen 4.6.3][ref1], [4.6.5][ref2] en [4.6.6][ref3] wordt ten minste voldaan aan het tweede tot en met het
      vijfde lid.

      2 In het afvalwater afkomstig van het reviseren van motoren worden de emissiegrenswaarden genoemd in tabel 4.75
      niet overschreden:


            Tabel 4.75






                    Stoffen


                    Emissiegrenswaarde






                    BTEX-som


                    15 milligram per liter




                    Vluchtige organohalogeenverbindingen uitgedrukt als chloor


                    100 microgram per liter




                    Olie


                    20 milligram per liter




                    PAK’s


                    5 microgram per liter




                    Koper


                    1 milligram per liter




                    Nikkel


                    3 milligram per liter




                    Lood


                    3 milligram per liter




                    Zink


                    3 milligram per liter




                    Chroom


                    2 milligram per liter






      3 Ander afvalwater dan het afvalwater bedoeld in het tweede lid, afkomstig van een activiteit als bedoeld in het
      eerste lid, wordt niet geloosd indien het in enig steekmonster meer bevat dan:

      a. 20 milligram olie per liter;

      b. 300 milligram onopgeloste stoffen per liter.

      4 In afwijking van het derde lid bedraagt het gehalte aan olie ten hoogste 200 milligram per liter in enig
      steekmonster, indien het afvalwater voorafgaand aan vermenging met ander afvalwater wordt geleid door een
      slibvangput en olieafscheider die:

      a. voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2, of

      b. zijn geplaatst voor het van toepassing worden van dit besluit of een deel daarvan op een activiteit in de
      inrichting en op de hoeveelheid afvalwater zijn afgestemd.

      5 Het te lozen afvalwater, bedoeld in het tweede en derde lid, kan op een doelmatige wijze worden bemonsterd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.75
