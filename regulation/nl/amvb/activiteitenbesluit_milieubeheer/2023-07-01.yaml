      c. de hoeveelheid totaal stikstof, bedoeld in [artikel 3.66, vierde lid][ref3], over het aan die datum voorafgaande
      kalenderjaar, berekend aan de hand van de gegevens, bedoeld in onderdeel a, en

      d. de hoeveelheid totaal fosfor in het geloosde drainwater per hectare teeltoppervlak over het aan die datum
      voorafgaande kalenderjaar, berekend aan de hand van de gegevens, bedoeld in onderdeel a.

      2 Bij ministeriële regeling worden nadere regels gesteld over de rapportage, bedoeld in het eerste lid.


