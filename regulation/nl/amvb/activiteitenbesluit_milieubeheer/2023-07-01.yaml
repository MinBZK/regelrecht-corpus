  - number: 4.54a
    text: >-
      1 Het schoonbranden van lood, geïsoleerde kabels, oliegekoelde transformatoren en metaaloppervlakken die
      verontreinigd zijn met polyvinylchloride of andere halogeenverbindingen, is verboden.


      2 Voordat metalen worden schoongebrand, worden deze vrijgemaakt van materialen die redelijkerwijs op andere wijze
      dan door schoonbranden kunnen worden verwijderd.


      3 Bij het schoonbranden van metalen is de emissieconcentratie van:


      a. stofklasse S niet meer dan 25 milligram per normaal kubieke meter;


      b. gasvormige anorganische chloriden niet meer dan 20 milligram per normaal kubieke meter, of


      c. totaal koolwaterstoffen niet meer dan 50 milligram per normaal kubieke meter.


      4 Het in het vuilwaterriool lozen van afvalwater afkomstig van de behandeling van de emissie die vrijkomt bij het
      schoonbranden, is verboden.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.54a
  - number: '4.55'
    text: |-
      1 Degene die de inrichting drijft neemt bij het reinigen, coaten of lijmen van metalen voorwerpen met betrekking
      tot vluchtige organische stoffen de bij ministeriële regeling gestelde emissiereducerende maatregelen tenzij deze
      niet kosteneffectief of technisch uitvoerbaar zijn.

      2 Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de in het
      eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar.

      3 Het eerste lid is niet toepassing op het verbruik van vluchtige organische stoffen waarvan het in de handel
      brengen is gereguleerd door het [Besluit organische oplosmiddelen in verven en vernissen milieubeheer][ref1].

      4 Indien de drempelwaarden, genoemd in tabel 2.28a worden overschreden, zijn het eerste tot en met derde lid niet
      van toepassing en is [afdeling 2.11][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019122
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.55
    references:
      - id: ref1
        bwb_id: BWBR0019122
      - id: ref2
        bwb_id: BWBR0022762
        hoofdstuk: '2'
        afdeling: '2.11'
  - number: '4.56'
    text: >-
      Bij het reinigen, coaten en lijmen van metalen worden ten behoeve van:


      a. het voorkomen dan wel beperken van diffuse emissies;


      b. het voorkomen dan wel beperken van stofhinder;


      c. het doelmatig verspreiden van emissies naar de buitenlucht;


      d. het voorkomen dan wel beperken van geurhinder;


      e. het realiseren van een verwaarloosbaar bodemrisico,


      de bij ministeriële regeling te bepalen maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.56
  - number: 4.56a
    text: Deze paragraaf is van toepassing op het aanbrengen van anorganische deklagen op metalen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.56a
  - number: '4.57'
    text: >-
      1 Het is verboden om in de buitenlucht anorganische deklagen op metalen aan te brengen.


      2 Het eerste lid is niet van toepassing op schooperen indien het niet mogelijk is om deze werkzaamheden in het
      inpandige deel van de inrichting uit te voeren vanwege de omvang van het te bewerken object.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.57
  - number: '4.58'
    text: |-
      Onverminderd [artikel 2.5, eerste, vierde en zesde lid][ref1], en [artikel 2.6][ref2] is bij het aanbrengen van
      anorganische deklagen op metalen de emissieconcentratie van:

      a. stofklasse S niet meer dan 5 milligram per normaal kubieke meter, indien de massastroom van stofklasse S naar
      de lucht gelijk is aan of groter is dan 200 gram per uur, en niet meer dan 50 milligram per normaal kubieke meter
      indien de massastroom van stofklasse S naar de lucht kleiner is dan 200 gram per uur;

      b. MVP1 stoffen niet meer dan 0,05 milligram per normaal kubieke meter, indien de massastroom van de MVP1 stoffen
      naar de lucht groter is dan 0,15 gram per uur;

      c. sA.1 stoffen niet meer dan 0,05 milligram per normaal kubieke meter, indien de massastroom van de sA.1 stoffen
      naar de lucht groter is dan 0,25 gram per uur;

      d. sA.2 stoffen niet meer dan 0,5 milligram per normaal kubieke meter, indien de massastroom van de sA.2 stoffen
      naar de lucht groter is dan 2,5 gram per uur;

      e. sA.3 stoffen niet meer dan 5,0 milligram per normaal kubieke meter, indien de massastroom van de sA.3 stoffen
      naar de lucht groter is dan 10 gram per uur;

      f. sO stoffen niet meer dan 5,0 milligram per normaal kubieke meter, indien de massastroom van de sO stoffen naar
      de lucht gelijk is of groter is dan 100 gram per uur, en niet meer dan 50 milligram per normaal kubieke meter
      indien de massastroom kleiner is dan 100 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel4.58
    references:
      - id: ref1
