  - number: '5.43'
    text: |-
      Deze paragraaf is van toepassing op het in werking hebben van stookinstallaties met een nominaal thermisch
      ingangsvermogen van 1 MWth of meer, met uitzondering van:

      a. stookinstallaties waarop [paragraaf 3.2.1][ref1] van toepassing is;

      b. stookinstallaties waarop [paragraaf 5.1.1][ref2] van toepassing is;

      c. stookinstallaties waarop [paragraaf 5.1.2][ref3] van toepassing is;

      d. stookinstallaties waarop [Richtlijn 97/68/EG](31997L0068) betrekking heeft en andere mobiele stookinstallaties;

      e. stookinstallaties op landbouwbedrijven met een totaal nominaal thermisch ingangsvermogen van 5 MWth of minder,
      die als brandstof uitsluitend onverwerkte mest van gevogelte gebruiken, zoals bedoeld in artikel 9, onder a), van
      Verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad;

      f. stookinstallaties waar de gasvormige producten van het stookproces worden gebruikt voor het direct verwarmen,
      drogen of anderzijds behandelen van voorwerpen of materialen;

      g. stookinstallaties waarin de gasvormige producten van het stookproces worden gebruikt voor het direct verwarmen
      met gas van binnenruimten ter verbetering van de omstandigheden op de arbeidsplaats;

      h. technische voorzieningen voor de zuivering van afgassen door verbranding die niet als autonome stookinstallatie
      worden geëxploiteerd;

      i. technische voorzieningen die bij de voortstuwing van een voertuig, schip of vliegtuig worden gebruikt;

      j. het regenereren van katalysatoren voor het katalytisch kraakproces;

      k. het omzetten van zwavelwaterstof in zwavel;

      l. in de chemische industrie gebruikte reactoren;

      m. cokesovens;

      n. windverhitters van hoogovens;

      o. crematoria;

      p. stookinstallaties die raffinaderijbrandstof eventueel gemengd met andere brandstof gebruiken voor de opwekking
      van energie binnen olie- en gasraffinaderijen;

      q. terugwinningsinstallaties in installaties voor de productie van pulp.

      r. stookinstallaties die blijkens een daarvoor aan de inrichting verleende omgevingsvergunning worden gebruikt
      voor het onderzoeken, beproeven of demonstreren van experimentele verbrandingstechnieken of van technieken ter
      bestrijding van de uitworp van zwaveldioxide (SO), stikstofoxiden (NO) of totaal stof.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk5
