  - number: 3.16n
    text: |-
      1 Met betrekking tot het in werking hebben van een gesloten bodemenergiesysteem wordt een registratie bijgehouden,
      die de volgende gegevens bevat:

      a. de temperatuur van de circulatievloeistof in de retourbuis;

      b. de hoeveelheden warmte en koude die vanaf de datum van ingebruikneming aan de bodem zijn toegevoegd, op zodanige
      wijze dat daaruit de data kunnen worden afgelezen, waarop aan [artikel 3.16k][ref1] is voldaan;

      c. het energierendement dat het systeem jaarlijks vanaf de datum van ingebruikneming heeft geleverd.

      2 Indien de geregistreerde gegevens, bedoeld in het eerste lid, betrekking hebben op een gesloten
      bodemenergiesysteem met een bodemzijdig vermogen van 70 kW of meer, worden zij binnen drie maanden na afloop van
      elk kalenderjaar toegezonden aan het bevoegd gezag.

      3 Indien de geregistreerde gegevens, bedoeld in het eerste lid, betrekking hebben op een gesloten
      bodemenergiesysteem met een bodemzijdig vermogen van minder dan 70 kW, worden zij ten minste tien jaar in de
      inrichting bewaard en ter inzage gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.16k
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.16n
