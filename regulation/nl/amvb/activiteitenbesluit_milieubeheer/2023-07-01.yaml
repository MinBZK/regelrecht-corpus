  - number: 3.10o
    text: >-
      Een stookinstallatie waarin vloeibare brandstof wordt verbrand, voldoet ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.10o
  - number: 3.10p
    text: >-
      Een stookinstallatie voldoet ten behoeve van het veilig functioneren, een optimale verbranding en energiezuinigheid
      van deze stookinstallatie aan de bij ministeriële regeling inzake keuring en onderhoud gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.10p
  - number: 3.10q
    text: |-
      1 In afwijking van de [artikelen 3.10][ref1], [3.10d][ref2], [3.10e][ref3] of [3.10f][ref4], voldoet het rookgas
      van een stookinstallatie die voor 1 april 2010 is geplaatst of in gebruik is genomen, voor zover die zich binnen
      de Nederlandse exclusieve economische zone bevindt dan wel deel uitmaakt van een inrichting waarin kooldioxide
      (CO), afkomstig van een andere inrichting, wordt ingezet ten behoeve van de bemesting van gewassen teneinde het
      gebruik van brandstof te verminderen, tot 1 januari 2019 aan de emissiegrenswaarden die op 31 maart 2010 voor die
      installatie golden ingevolge het Besluit emissie-eisen stookinstallaties milieubeheer B of het Besluit emissie-
      eisen stookinstallaties milieubeheer A, dan wel aan de daarvan afwijkende emissiegrenswaarden, die voor die
      stookinstallatie golden op grond van een daarvoor verleende omgevingsvergunning.

      2 Het rookgas van een stookinstallatie als bedoeld in het eerste lid voldoet met ingang van 1 januari 2019 aan de
      in de [artikelen 3.10][ref5], [3.10d][ref6], [3.10e][ref7] of [3.10f][ref8] bedoelde emissiegrenswaarden.

      3 Het bevoegd gezag kan bij maatwerkbesluit voor de off shore gasplatforms G16a-A, G16a-B, K2b-A, K12-B, K12-
      K, K9ab-A en P6A bepalen dat de emissiegrenswaarden in de [artikelen 3.10][ref9], [3.10d][ref10], [3.10e][ref11]
      of [3.10f][ref12], niet van toepassing zijn, indien degene die de inrichting drijft voor 1 januari 2019 aan het
      bevoegd gezag schriftelijk kenbaar heeft gemaakt de activiteiten te beëindigen voor 1 januari 2022.

      4 Op het in werking hebben van een stookinstallatie die voor 1 januari 2014 is geplaatst of in gebruik
      is genomen en waarop [titel 16.3 van de wet][ref13] van toepassing was, zijn de op grond van de
      [artikelen 3.10 tot en met 3.10j][ref14] geldende emissiegrenswaarden en meetmethoden voor stikstofoxiden
      (NO) tot 1 januari 2019 niet van toepassing. Het bevoegd gezag kan voor deze stookinstallaties tot deze datum
      bij maatwerkvoorschrift emissiegrenswaarden en meetmethoden voor stikstofoxiden (NO) in het rookgas van de
      stookinstallatie vaststellen, indien de lokale luchtkwaliteit dat vergt.

      5 Indien ingevolge het eerste lid de emissiegrenswaarden van het
      [Besluit emissie-eisen stookinstallaties milieubeheer A][ref15] van toepassing zijn, zijn in afwijking van
      [artikel 3.10p][ref16] tevens de regels inzake keuring en onderhoud van dat besluit van toepassing.


