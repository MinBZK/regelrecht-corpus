    text: |-
      Indien aan een stookinstallatie als bedoeld in [artikel 3.10q, eerste lid][ref1], of
      [artikel 3.10r, eerste lid][ref2], voor 1 januari 2019 een wijziging van het nominaal thermisch ingangsvermogen
      wordt aangebracht die leidt tot een toename van emissies van de stoffen, genoemd in deze paragraaf, met
      meer dan 10 procent, wordt die wijziging zodanig uitgevoerd dat aan de emissiegrenswaarden, genoemd in de
      [artikelen 3.10][ref3], [3.10a][ref4], [3.10b][ref5], [3.10d][ref6], [3.10e][ref7] of [3.10f][ref8] wordt voldaan.


