    text: |-
      1 Indien een grote stookinstallatie die gewoonlijk met gasvormige brandstof wordt gestookt, met een andere
      brandstof wordt gestookt in het geval geen levering van gas kan plaatsvinden wegens weersomstandigheden of
      storingen in de gastoevoer, zijn de emissiegrenswaarden, bedoeld in de [artikelen 5.4 tot en met 5.7][ref1], niet
      van toepassing gedurende ten hoogste 240 uur per incident.

      2 Degene die de inrichting drijft, meldt onmiddellijk aan het bevoegd gezag dat zich een situatie voordoet als
      bedoeld in het eerste lid.

      3 Het bevoegd gezag stelt Onze Minister onmiddellijk in kennis van een afwijking als bedoeld in het eerste lid.


