  - number: 4.74t
    text: |-
      Deze paragraaf is van toepassing op activiteiten als bedoeld in de [paragrafen 4.6.3.][ref1], [4.6.5][ref2], en
      [4.6.6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
