  - number: 3.10a
    text: |-
      1 Het rookgas van een stookinstallatie anders dan een ketelinstallatie, zuigermotor, gasturbine of installatie
      voor de regeneratie van glycol, met een nominaal thermisch ingangsvermogen vanaf 1 MWth voldoet aan de
      emissiegrenswaarden, genoemd in tabel 3.10a.

      2 In afwijking van het eerste lid kan het bevoegd gezag voor installaties die voor 20 december 2018 in gebruik zijn
      genomen, indien de geografische ligging, de plaatselijke milieuomstandigheden of de technische kenmerken van de
      betrokken installatie daartoe aanleiding geven, bij maatwerkvoorschrift een hogere emissiegrenswaarde vaststellen
      tot maximaal de in tabel 3.10a tussen haakjes aangegeven waarden.

      3 In afwijking van het eerste lid gelden de emissiegrenswaarden in dit artikel voor stookinstallaties die voor
      20 december 2018 in bedrijf zijn genomen vanaf:

      a. 1 januari 2025 voor stookinstallaties meer dan 5 MWth;

      b. 1 januari 2030 voor stookinstallaties van 1 MWth of meer en 5 MWth of minder.

      4 In afwijking van het eerste lid en onverminderd het derde lid voldoet een stookinstallatie gestookt op
      vergistingsgas die voor 20 december 2018 in gebruik is genomen aan een emissiegrenswaarde voor zwaveldioxide (SO):

      a. van 170 mg/Nm3 voor een stookinstallatie van meer dan 5 MWth;

      b. van 200 mg/Nm3 voor een stookinstallatie van 1 MWth of meer en 5 MWth of minder.


