  - number: '2.31'
    text: >-
      Degene die een inrichting drijft waartoe een oplosmiddeleninstallatie behoort, neemt alle passende
      voorzorgsmaatregelen om de emissies van vluchtige organische stoffen bij het opstarten en stilleggen van de
      installatie tot een minimum te beperken.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel2.31
  - number: '2.32'
    text: >-
      De monitoring van emissies, het opstellen van een reductieprogramma en een oplosmiddelenboekhouding en de
      emissiemetingen ter controle op de naleving van de emissiegrenswaarden voldoen aan de bij ministeriële regeling
      gestelde eisen.
