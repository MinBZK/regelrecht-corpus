    text: |-
      Onverminderd de [artikel 2.5, eerste, vierde en zesde lid][ref1], en [2.6][ref2] is bij het maken van croning- en
      coldbox-kernen de emissieconcentratie van:

      a. totaal stof ten hoogste 20 milligram per normaal kubieke meter, indien de massastroom van totaal stof naar de
      lucht gelijk is aan of groter is dan 200 gram per uur en ten hoogste 50 milligram per normaal kubieke meter indien
      de massastroom kleiner is dan 200 gram per uur, en

      b. aminen ten hoogste 5 milligram per normaal kubieke meter.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.6
