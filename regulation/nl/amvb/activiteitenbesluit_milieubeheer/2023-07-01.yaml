        bwb_id: BWBR0022762
        artikel: '2.2'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '3.127'
    text: >-
      1 Bij het lozen van afvalwater als gevolg van het reinigen en ontsmetten van dierenverblijven wordt ten minste
      voldaan aan het tweede en derde lid.


      2 Bij het in het vuilwaterriool lozen van afvalwater als gevolg van het reinigen en ontsmetten van
      dierenverblijven, bedraagt het gehalte aan onopgeloste stoffen niet meer dan 300 milligram per liter.


      3 Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.127
  - number: '3.129'
    text: >-
      1 Bij het lozen van afvalwater als gevolg van het wassen en spoelen bij melkwinning wordt ten minste voldaan aan
      het tweede en derde lid.


      2 Afvalwater afkomstig van het wassen en spoelen van melkwininstallaties wordt zo veel mogelijk hergebruikt.


      3 Het lozen van afvalwater op of in de bodem is toegestaan, indien het afvalwater gelijkmatig wordt verspreid over
      de onverharde bodem.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.129
  - number: 3.129a
    text: >-
      Deze paragraaf is van toepassing op het bereiden van brijvoer met plantaardige bijvoedermiddelen voor
      landbouwhuisdieren die binnen dezelfde inrichting worden gehouden voor zover de verwerkingscapaciteit voor het
      bereiden van brijvoer ten hoogste 4.000 ton per jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.129a
  - number: 3.129b
    text: >-
      Bij het bereiden van brijvoer wordt ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het
      tot een aanvaardbaar niveau beperken van geurhinder, ten minste voldaan aan de bij ministeriële regeling gestelde
      eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.129b
  - number: 3.129c
    text: >-
      1 Deze paragraaf is van toepassing op het vergisten van dierlijke mest met een verwerkingscapaciteit van ten
      hoogste 25.000 kubieke meter mest per jaar.


      2 Onverminderd het eerste lid is deze paragraaf eveneens van toepassing op het voor of na het vergisten, bedoeld in
      het eerste lid:


      a. biologisch behandelen van dierlijke meststoffen;


      b. opslaan van digestaat van het vergisten van dierlijke meststoffen, zolang dat nog biologisch actief is;


      c. opslaan, bewerken en transporteren van vergistinggas met een capaciteit voor de opslag in opslagtanks van ten
      hoogste 20.000 liter.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.129c
  - number: 3.129d
    text: >-
      1 Een installatie voor het vergisten van dierlijke meststoffen en de opslag van digestaat dat nog biologisch actief
      is, is gasdicht en voorzien van een overdrukbeveiliging.


      2 Het is verboden digestaat dat nog biologisch actief is buiten de inrichting te brengen of buiten de
      vergistingstank te mengen met andere dierlijke meststoffen.


      3 Bij het vergisten van dierlijke meststoffen en de opslag van digestaat dat nog biologisch actief is, is emissie
      van vergistinggas verboden anders dan een emissie via de overdrukbeveiliging die plaatsvindt als gevolg van een
      incident of via een fakkel of andere maatregel als bedoeld in het vijfde lid.


      4 Een installatie voor het vergisten van dierlijke meststoffen, het opslaan van vergistinggas en het transporteren
      en bewerken van vergistinggas is voorzien van een elektronisch monitoringssysteem dat de goede werking van
      de installatie controleert en de inrichtinghouder waarschuwt bij incidenten die kunnen leiden tot onveilige
      situaties of de emissie van vergistinggas meldt. De inrichtinghouder draagt er zorg voor dat binnen een uur na de
      waarschuwing actie wordt ondernomen om incidenten die zijn gemeld door het systeem te verhelpen.


      5 Het bevoegd gezag kan, indien blijkt dat de inrichtinghouder onvoldoende maatregelen treft om uitstoot van
      vergistinggas bij incidenten te voorkomen, bij maatwerkvoorschrift voorschrijven dat een fakkel of andere maatregel
      wordt toegepast om vergistinggas bij incidenten te verbranden.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.129d
  - number: 3.129e
    text: |-
      1 Vergistinggas bevat, op de plaats waar het de installatie, bedoeld in [artikel 3.129d, eerste lid][ref1],
      verlaat, ten hoogste 430 milligram waterstofsulfide per normaal kubieke meter.

      2 Onverminderd het eerste lid bevat vergistinggas dat de inrichting via een leiding verlaat ten hoogste 15
      milligram ammoniak per normaal kubieke meter.

      3 Een installatie voor het vergisten van dierlijke meststoffen heeft ten minste één monsternamepunt voor
      vergistinggas.

      4 Het vergistinggas wordt bij ingebruikname van de installatie en vervolgens maandelijks bemonsterd en geanalyseerd
      op het gehalte waterstofsulfide en, indien het tweede lid van toepassing is, op het gehalte ammoniak.

      5 De resultaten van de analyses worden ten minste vijf jaar binnen de inrichting bewaard.

      6 Het bevoegd gezag kan op verzoek van de drijver van de inrichting bij maatwerkvoorschrift bepalen dat het vierde
      en vijfde lid niet van toepassing zijn, indien de drijver van de inrichting zorgt voor een continue registratie
      van het gehalte waterstofsulfide en, indien het tweede lid van toepassing is, het gehalte ammoniak. In dat geval
      kan het bevoegd gezag bij maatwerkvoorschrift eisen stellen aan de toegepaste meetmethode en de verwerking van
      de meetonnauwkeurigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.129d
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.129e
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: 3.129d
        hoofdstuk: '3'
        paragraaf: 3.5.10
        afdeling: '3.5'
  - number: 3.129f
    text: >-
      1 Tussen een gaszak met vergistinggas en buiten de inrichting gelegen kwetsbare en beperkt kwetsbare objecten is de
      afstand ten minste 50 meter, gerekend vanaf het middelpunt van de gaszak.


      2 Tussen een opslagtank voor vloeibaar biogas en buiten de inrichting gelegen kwetsbare en beperkt kwetsbare
      objecten is de afstand ten minste 50 meter, gerekend vanaf het aftappunt van de opslagtank.


      3 Binnen de afstanden, genoemd in het eerste en tweede lid, is overnachting en recreatief verblijf door derden
      niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.129f
  - number: 3.129g
    text: |-
      1 Een voorziening voor het biologisch behandelen van dierlijke meststoffen voor of na het vergisten ligt op een
      afstand van ten minste 100 meter van een geurgevoelig object dat binnen de bebouwde kom is gelegen.

      2 Een voorziening voor het biologisch behandelen van dierlijke meststoffen voor of na het vergisten ligt op een
      afstand van ten minste 50 meter van een geurgevoelig object dat buiten de bebouwde kom is gelegen.

      3 Het bevoegd gezag kan, indien blijkt dat de geurhinder als gevolg van het biologisch behandelen van dierlijke
      meststoffen voor of na het vergisten een aanvaardbaar niveau overschrijdt, onverminderd [artikel 2.7a][ref1], bij
      maatwerkvoorschrift eisen stellen aan:

      a. de situering van de voorziening;

      b. het gesloten uitvoeren van de voorziening;

      c. de ligging en afvoerhoogte van het emissiepunt, indien emissies worden afgezogen;

      d. de toepassing van een doelmatige ontgeuringsinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.129g
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: 2.7a
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 3.129h
    text: |-
      Bij het vergisten van dierlijke meststoffen en de activiteiten, bedoeld in [artikel 3.129c, tweede lid][ref1],
      wordt ten behoeve van:

      a. het realiseren van een verwaarloosbaar bodemrisico;

      b. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet mogelijk is,
      het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en
      de gevolgen hiervan; of

      c. het doelmatig verspreiden van emissies naar de buitenlucht,

      ten minste voldaan aan de bij ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.129c
    url: https://wetten.overheid.nl/BWBR0022762/2023-07-01#Artikel3.129h
