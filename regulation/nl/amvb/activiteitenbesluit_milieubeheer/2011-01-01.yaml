        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.4
        afdeling: '4.6'
  - number: 6.17.1.a
    text: |-
      voor het van toepassing worden van [artikel 1.4, eerste, tweede of derde lid][ref1], op de inrichting een
      slibvangput en een olieafscheider zijn geplaatst die voldoen aan en gebruikt worden conform NEN 7089; of


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.1.2
        afdeling: '1.1'
  - number: 6.17.1.b
    text: |-
      voor 1 maart 1997 een slibvangput of een olieafscheider zijn geplaatst, die op de hoeveelheid afvalwater zijn
      afgestemd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.17
  - number: 6.17.2
    text: |-
      In afwijking van de [artikelen 3.25, derde lid][ref1], [4.71, tweede lid][ref2], [4.75, vierde lid][ref3], en
      [4.105, vierde lid][ref4] zijn die artikelen van overeenkomstige toepassing indien het afvalwater niet wordt geleid
      door een slibvangput en olieafscheider die voldoen aan NEN-EN 858-1 en 2, maar door:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.12
        afdeling: '4.5'
      - id: ref3
