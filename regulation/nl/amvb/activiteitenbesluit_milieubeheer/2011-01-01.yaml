  - number: 1.11.11
    text: |-
      In de gevallen, bedoeld in het vijfde lid, geeft het rapport tevens een beschrijving van het langtijdgemiddelde
      beoordelingsniveau (LAr, LT) veroorzaakt door de inrichting op de zonegrens en op geluidgevoelige objecten binnen
      de zone op basis waarvan het bevoegd gezag kan beoordelen of aan de geluidsvoorwaarden voor de zone kan worden
      voldaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
  - number: 1.11.12
    text: Het akoestisch onderzoek wordt uitgevoerd overeenkomstig de Handleiding meten en rekenen industrielawaai.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
  - number: 1.11.13
    text: |-
      In afwijking van het twaalfde lid wordt het akoestisch onderzoek voor windturbines uitgevoerd overeenkomstig de bij
      ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
  - number: '1.12'
    text: |-
      Bij een melding als bedoeld in [artikel 1.10][ref1] worden indien sprake is van een lozing vanuit een bodemsanering
      of een proefbronnering als bedoeld in [artikel 3.1][ref2] de volgende gegevens gemeld:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.1
        afdeling: '3.1'
  - number: 1.12.a
    text: het tijdstip van de aanvang, de verwachte duur en het maximale debiet van het lozen; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.12
  - number: 1.12.b
    text: de oorzaak van de bodemverontreiniging.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.12
  - number: '1.13'
    text: |-
      Bij een melding als bedoeld in [artikel 1.10][ref1] worden indien sprake is van een lozing van grondwater als
      bedoeld in [artikel 3.2, derde, vierde, zevende en negende lid][ref2], in een oppervlaktewaterlichaam of in een
      voorziening voor de inzameling en het transport van afvalwater, de volgende gegevens gemeld:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: 1.13.a
    text: het tijdstip van de aanvang, de verwachte duur en het maximale debiet van het lozen; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.13
  - number: 1.13.b
    text: |-
      gegevens over de samenstelling van het te lozen grondwater, voor zover die afwijkt van de in het gebied voorkomende
      grondwaterkwaliteit.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.13
  - number: '1.14'
    text: |-
      Bij een melding als bedoeld in [artikel 1.10][ref1] worden indien sprake is van een lozing van huishoudelijk
      afvalwater in een oppervlaktewaterlichaam of op of in de bodem als bedoeld in [artikel 3.4][ref2] de volgende
      gegevens gemeld:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.4
        afdeling: '3.1'
  - number: 1.14.a
    text: het aantal inwonerequivalenten dat wordt geloosd; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.14
  - number: 1.14.b
    text: de wijze van behandeling van het afvalwater.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.14
  - number: 1.14a.1
    text: |-
      Bij een melding als bedoeld in [artikel 1.10][ref1] worden:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.14a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.14a.1.a
    text: |-
      indien sprake is van het gericht werken met een biologisch agens die is of wordt ingedeeld in groep 2 in een
      laboratorium of praktijkruimte als bedoeld in [artikel 4.122][ref1], de ligging van de ruimten gemeld waar gewerkt
      wordt met een biologisch agens die is of wordt ingedeeld in groep 2,


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.14a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.10
        afdeling: '4.8'
  - number: 1.14a.1.b
    text: |-
      indien sprake is van het gericht werken met een biologisch agens, anders dan dat bedoeld onder a, en dat behoort
      tot een soort die bij ministeriële regeling is aangewezen, gemeld tot welke soort het biologisch agens behoort.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.14a
  - number: 1.14a.2
    text: |-
      Voor de groepsindeling, bedoeld in het eerste lid, onder a, wordt aangesloten bij de indeling in risico-groepen van
      richtlijn nr. 2000/54/EG van het Europees Parlement en de Raad van 18 september 2000 betreffende de bescherming van
      de werknemers tegen de risico’s van blootstelling aan biologische agentia op het werk.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.14a
  - number: '1.15'
    text: |-
      Degene die een inrichting drijft verstrekt desgevraagd aan het bevoegd gezag binnen de door dat bestuursorgaan
      gestelde redelijke termijn, voor zover hij daarover beschikt of redelijkerwijs kan beschikken, alle gegevens over
      stoffen en preparaten en producten waarin stoffen of preparaten zijn verwerkt, die het bevoegd gezag redelijkerwijs
      nodig heeft voor het stellen van maatwerkvoorschriften.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.15
  - number: 1.16.1
    text: |-
      Bij een melding als bedoeld in [artikel 1.10][ref1] worden, indien sprake is van het opslaan, overslaan, bewerken
      of verwerken van afvalstoffen die van buiten de inrichting afkomstig zijn, de volgende gegevens gemeld:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.16.1.a
    text: |-
      de afvalstoffen en de activiteiten met afvalstoffen, bedoeld in onderdeel 28.10, onder 1° tot en met 31° van
      onderdeel C, [bijlage 1, bij het Besluit omgevingsrecht][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 1.16.1.b
    text: per handeling per afvalstof de maximale opslagcapaciteit en de be- of verwerkingscapaciteit per jaar.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.16
  - number: 1.16.2
    text: |-
      Indien de afvalstoffen, bedoeld in het eerste lid, worden ingezameld bij of worden afgegeven door een andere
      persoon dan degene die de inrichting drijft, wordt bij de melding een beschrijving gevoegd van de procedures van
      acceptatie en controle van de ontvangen afvalstoffen als bedoeld in [artikel 2.14b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.5'
  - number: 1.17.1
    text: |-
      Bij een melding als bedoeld in [artikel 1.10][ref1] wordt, indien sprake is van de oprichting van een
      zuiveringtechnisch werk of verandering van een zuiveringtechnisch werk die van invloed is op de geurbelasting op
      gevoelige objecten, een rapport van een geuronderzoek gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.17.2
    text: 'Uit het rapport van een geuronderzoek, bedoeld in het eerste lid, blijkt:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.17
  - number: 1.17.2.a
    text: |-
      op grond van de verrichte geurberekeningen of aan de waarden, bedoeld in [artikel 3.5b, eerste en tweede lid][ref1],
      dan wel [artikel 6.19b, tweede tot en met vijfde lid][ref2], is voldaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.4a
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: 6.8a
  - number: 1.17.2.b
    text: welke voorzieningen worden getroffen om de geuremissie te beperken.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.17
  - number: 2.1.1
    text: |-
      Degene die een inrichting drijft en weet of redelijkerwijs had kunnen weten dat door het in werking zijn dan wel
      het al dan niet tijdelijk buiten werking stellen van de inrichting nadelige gevolgen voor het milieu ontstaan of
      kunnen ontstaan, die niet of onvoldoende worden voorkomen of beperkt door naleving van de bij of krachtens dit
      besluit gestelde regels, voorkomt die gevolgen of beperkt die voor zover voorkomen niet mogelijk is en voor zover
      dit redelijkerwijs van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Onder het voorkomen of beperken van het ontstaan van nadelige gevolgen voor het milieu als bedoeld in het eerste
      lid wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.a
    text: een doelmatig gebruik van energie;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.b
    text: het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van bodemverontreiniging;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.c
    text: |-
      het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van het
      grondwater;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.d
    text: |-
      het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de verontreiniging van een
      oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.e
    text: het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van luchtverontreiniging;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.f
    text: het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van geluidhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.g
    text: het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van geurhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.h
    text: het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van lichthinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.i
    text: het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van stofhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.j
    text: het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van trillinghinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.k
    text: |-
      het voorkomen dan wel voor zover dat niet mogelijk is het beperken van de nadelige gevolgen voor het milieu van het
      verkeer van personen en goederen van en naar de inrichting;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.l
    text: |-
      het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.m
    text: het zorgen voor een goede staat van onderhoud van de inrichting;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.n
    text: de bescherming van de doelmatige werking van de voorzieningen voor het beheer van afvalwater;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.o
    text: het doelmatig beheer van afvalwater;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.p
    text: het doelmatig beheer van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.2.q
    text: het beschermen van de duisternis en het donkere landschap in door het bevoegd gezag aangewezen gebieden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.1.3
    text: |-
      Het bevoegd gezag kan met betrekking tot de verplichting bedoeld in het eerste lid maatwerkvoorschriften
      stellen voor zover het betreffende aspect bij of krachtens dit besluit niet uitputtend is geregeld. Deze
      maatwerkvoorschriften kunnen mede inhouden dat de door de inrichting te verrichten activiteiten worden beschreven
      alsmede dat metingen, berekeningen of tellingen moeten worden verricht ter bepaling van de mate waarin de
      inrichting nadelige gevolgen voor het milieu veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.1
  - number: 2.2.1
    text: |-
      Het lozen op of in de bodem of in een voorziening voor de inzameling en het transport van afvalwater niet zijnde
      een vuilwaterriool, is verboden tenzij het lozen bij of krachtens de [artikelen 3.1 tot en met 3.6][ref1],
      [3.32 tot en met 3.34][ref2], [4.19][ref3], [4.74c][ref4], [4.104][ref5], [4.109][ref6], [4.113a][ref7], is
      toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel4
