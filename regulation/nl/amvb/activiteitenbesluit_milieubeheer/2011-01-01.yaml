  - number: 6.2.3
    text: |-
      De nadere eisen die onmiddellijk voorafgaand aan het tijdstip van het van toepassing
      worden van [artikel 1.4, eerste, tweede of derde lid][ref1], voor een inrichting
      golden krachtens het [Lozingenbesluit Wvo huishoudelijk afvalwater][ref2] of het
      [Lozingenbesluit bodemsanering en proefbronnering][ref3] voor het lozen vanuit een inrichting, blijven na het
      tijdstip van het van toepassing worden van [artikel 1.4][ref4] op die inrichting gelden als maatwerkvoorschriften,
      mits de nadere eisen vallen binnen de reikwijdte van een maatwerkvoorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008512
      [ref3]: https://wetten.overheid.nl/BWBR0008511
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel1
