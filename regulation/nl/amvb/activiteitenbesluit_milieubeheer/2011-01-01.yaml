        hoofdstuk: '4'
        paragraaf: 4.8.3
        afdeling: '4.8'
  - number: 6.36.2
    text: |-
      Indien op een inrichting voor het tijdstip van inwerkingtreding van [artikel 4.109][ref1] een besluit als
      bedoeld in [artikel 6.43][ref2] van toepassing was en vanuit die inrichting het afvalwater van het vervaardigen
      of bereiden van voedingsmiddelen werd geloosd zonder behandeling in een vetafscheider en slibvangput die
      voldoen aan NEN-EN-1825-1 en 2 dan wel NEN 7087, wordt voor dat lozen een maatwerkvoorschrift als bedoeld
      [artikel 4.109, vijfde lid][ref3], geacht te zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel4
