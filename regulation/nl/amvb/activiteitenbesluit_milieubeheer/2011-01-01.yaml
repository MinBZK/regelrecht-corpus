    text: |-
      [Artikel 3.5b, eerste en tweede lid][ref1], is niet van toepassing op een zuiveringtechnisch werk
      dat is opgericht voor 1 februari 1996 en waarvoor op dat tijdstip een vergunning op grond van
      [artikel 8.1 van de Wet milieubeheer][ref2] in werking en onherroepelijk was.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.19b
