  - number: 2.7.2.b
    text: |-
      de toegepaste emissiebeperkende techniek in combinatie met de geëmitteerde stoffen leidt tot hoge
      storinggevoeligheid, er veel onderhoud nodig is dan wel er veel fluctuaties zijn in de aard en grootte van de
      emissies;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.7
  - number: 2.7.2.c
    text: de grootte en aard van de emissies daartoe aanleiding geven;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.7
  - number: 2.7.2.d
    text: |-
      de grootte van emissies die kunnen optreden bij storing aan de emissiebeperkende techniek, daartoe aanleiding
      geven.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.7
  - number: 2.7.3
    text: |-
