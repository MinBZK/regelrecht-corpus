      koper, molybdeen, nikkel, lood, seleen, tin, titaan, uranium, vanadium, zilver en zink, waarbij de ontsluiting van
      de elementen plaats vindt volgens NEN-EN-ISO 15587-1 en NEN 6961;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.3
