  - number: 1.6.2.a.1°
    text: in een werk aanbrengen of houden van bouwstoffen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.6
  - number: 1.6.2.a.2°
    text: |-
      aanbrengen, verspreiden of tijdelijk opslaan van grond of baggerspecie alsmede het houden van die aangebrachte of
      tijdelijk opgeslagen grond of baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.6
  - number: 1.6.2.a.3°
    text: |-
      lozen ten gevolge van het toepassen van bouwstoffen, grond of baggerspecie, waarop het Besluit bodemkwaliteit van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.6
  - number: 1.6.2.b
    text: |-
      het lozen waarvoor regels zijn gesteld bij of krachtens het [Lozingenbesluit Wvo vaste objecten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009355
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0009355
  - number: 1.6.2.c
