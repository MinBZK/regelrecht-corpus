        artikel: '2'
      - id: ref4
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.1.2
        afdeling: '1.1'
  - number: 6.1.2
    text: |-
      De nadere eisen die voor een inrichting onmiddellijk voorafgaand aan het tijdstip van het van toepassing worden
      van [artikel 1.4, eerste, tweede of derde lid][ref1], op die inrichting op grond van de besluiten, bedoeld in
      [artikel 6.43][ref2] in werking en onherroepelijk waren, worden aangemerkt als maatwerkvoorschriften, mits de
      nadere eisen vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften en voor
      zover dit besluit op de inrichting van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
