  - number: 3.1.4
    text: |-
      Het lozen, bedoeld in het eerste lid, op of in de bodem is toegestaan indien het gehalte aan stoffen in enig
      steekmonster niet meer bedraagt dan de streefwaarden in [Circulaire bodemsanering 2009][ref1] en geen wateroverlast
      plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0025649
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0025649
  - number: 3.1.5
    text: Het lozen, bedoeld in het eerste lid, in een vuilwaterriool is verboden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.6
    text: |-
      Indien lozen als bedoeld in het eerste lid in een oppervlaktewaterlichaam, op of in de bodem of in een voorziening
      voor de inzameling en het transport van afvalwater, niet zijnde een vuilwaterriool, redelijkerwijs niet mogelijk
      is:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.6.a
    text: |-
      is, in afwijking van het vijfde lid, het lozen vanuit een proefbronnering in het vuilwaterriool toegestaan indien
      het gehalte aan onopgeloste stoffen niet meer bedraagt dan 300 milligram per liter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.6.b
    text: |-
      kan het bevoegd gezag bij maatwerkvoorschrift het vijfde lid niet van toepassing verklaren en het lozen vanuit een
      bodemsanering in een vuilwaterriool toestaan, indien het belang van de bescherming van het milieu zich gelet op de
      samenstelling, hoeveelheid en eigenschappen van het afvalwater niet tegen het lozen in een vuilwaterriool verzet.
      [Artikel 2.2, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: 3.1.7
    text: 'Het bevoegd gezag kan bij maatwerkvoorschrift:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.7.a
    text: |-
      de waarden, bedoeld in het tweede tot en met vierde lid en zesde lid, onderdeel a, niet van toepassing verklaren
      en hogere gehalten bepalen dan de gehalten, bedoeld in het tweede tot en met het vierde lid en het zesde lid,
      onderdeel a, of het zuurstofgehalte, bedoeld in het tweede en derde lid, niet van toepassing verklaren en een
      lagere waarde bepalen voor het zuurstofgehalte dan het zuurstofgehalte, bedoeld in tweede en derde lid, indien
      de gehalten bedoeld in het twee tot en met vierde lid en zesde lid, onderdeel a, dan wel de waarde bedoeld in het
      tweede en derde lid niet door toepassing van beste beschikbare technieken kunnen worden bereikt en het belang van
      de bescherming van het milieu zich niet tegen het lozen met een hoger gehalte dan wel een lagere waarde verzet;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.7.b
    text: |-
      lagere gehalten bepalen dan de gehalten bedoeld in het tweede lid, indien vanuit een voorziening bedoeld in dat lid
      geloosd wordt in een niet aangewezen oppervlaktewaterlichaam, of op of in de bodem en het belang van bescherming
      van het milieu tot het stellen van een lager gehalte noodzaakt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.8
    text: 'De lagere gehalten, bedoeld in het zevende lid, onderdeel b, worden niet lager vastgesteld dan:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.8.a
    text: de waarden opgenomen in tabel 3.1b, indien geloosd wordt in een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.8.b
    text: de streefwaarden, bedoeld in het vierde lid, indien geloosd wordt op of in de bodem.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.9
    text: Het te lozen grondwater, bedoeld in het eerste lid, kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.2.1
    text: |-
      Deze paragraaf is van toepassing op het lozen van grondwater bij ontwatering, niet zijnde grondwater als bedoeld in
      [artikel 3.1, eerste lid][ref1]. Bij het lozen wordt ten minste voldaan aan het tweede tot en met het twaalfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.1
        afdeling: '3.1'
  - number: 3.2.2
    text: |-
      Het lozen, bedoeld in het eerste lid, op of in de bodem is toegestaan indien als gevolg van het lozen geen
      wateroverlast ontstaat.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.3
    text: 'Het lozen, bedoeld in het eerste lid, in een aangewezen oppervlaktewaterlichaam is toegestaan indien:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.3.a
    text: het gehalte onopgeloste stoffen ten hoogste 50 milligram per liter bedraagt;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.3.b
    text: het zuurstofgehalte ten minste 5 milligram per liter bedraagt; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.3.c
    text: als gevolg van het lozen geen visuele verontreiniging optreedt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.4
    text: 'Het lozen, bedoeld in het eerste lid, in een niet aangewezen oppervlaktewaterlichaam is toegestaan indien:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.4.a
    text: het lozen ten hoogste 4 weken duurt en de geloosde hoeveelheid ten hoogste 5 kubieke meter per uur bedraagt;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.4.b
    text: het gehalte onopgeloste stoffen ten hoogste 50 milligram per liter bedraagt;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.4.c
    text: het zuurstofgehalte ten minste 5 milligram per liter bedraagt; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.4.d
    text: als gevolg van het lozen geen visuele verontreiniging optreedt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.5
    text: 'Het bevoegd gezag kan met betrekking tot het lozen, bedoeld in het derde en vierde lid, bij maatwerkvoorschrift:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.5.a
    text: |-
      de gehalten, genoemd in die leden, niet van toepassing verklaren en een hoger gehalte aan onopgeloste
      stoffen vaststellen dan de gehalten, genoemd in die leden, en een lager zuurstofgehalte vaststellen dan het
      zuurstofgehalte, genoemd in die leden, indien laatstgenoemde gehalten niet door toepassing van beste beschikbare
      technieken kunnen worden bereikt en het belang van de bescherming van het milieu zich niet tegen het lozen met een
      hoger respectievelijk lager gehalte verzet; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.5.b
    text: |-
      bepalen dat visuele verontreiniging mag optreden, indien visuele verontreiniging niet door toepassing van beste
      beschikbare technieken kan worden voorkomen en het belang van de bescherming van het milieu zich niet tegen het
      lozen waarbij visuele verontreiniging optreedt verzet.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.6
    text: |-
      Het bevoegd gezag kan met betrekking tot de tijdsduur en de hoeveelheid, bedoeld in het vierde lid, bij
      maatwerkvoorschrift andere waarden vaststellen dan de waarden, bedoeld in dat lid, indien dat nodig is in het
      belang van een doelmatig beheer van afvalwater.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.7
    text: |-
      Het lozen, bedoeld in het eerste lid, in een openbaar hemelwaterstelsel of een openbaar ontwateringsstelsel is
      toegestaan indien het gehalte onopgeloste stoffen ten hoogste 50 milligram per liter bedraagt en het ijzergehalte
      ten hoogste 5 milligram per liter bedraagt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.8
    text: |-
      Het bevoegd gezag kan met betrekking tot het lozen als bedoeld in het zevende lid bij maatwerkvoorschrift of
      verordening als bedoeld in [artikel 10.32a van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 3.2.8.a
    text: |-
      de gehalten, bedoeld in dat lid niet van toepassing verklaren en hogere gehalten vaststellen dan de gehalten,
      bedoeld in dat lid, indien laatstgenoemde gehalten niet door toepassing van beste beschikbare technieken kunnen
      worden bereikt en het belang van de bescherming van het milieu zich niet tegen het lozen met een hoger gehalte
      verzet;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.8.b
    text: |-
      het ijzergehalte, bedoeld in dat lid niet van toepassing verklaren en een lager ijzergehalte bepalen dan het
      gehalte, bedoeld in dat lid, indien het belang van bescherming van het milieu tot het stellen van een lager gehalte
      noodzaakt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.9
    text: 'Het lozen, bedoeld in het eerste lid, in een vuilwaterriool is verboden, tenzij:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.9.a
    text: het lozen ten hoogste 4 weken duurt;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.9.b
    text: de geloosde hoeveelheid ten hoogste 5 kubieke meter per uur bedraagt; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.9.c
    text: het gehalte onopgeloste stoffen ten hoogste 300 milligram per liter bedraagt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.10
    text: |-
      Het bevoegd gezag kan met betrekking tot de tijdsduur en de hoeveelheid, bedoeld in het negende lid bij
      maatwerkvoorschrift of bij verordening als bedoeld in [artikel 10.32a van de wet][ref1] andere waarden vaststellen
      indien dit nodig is in het belang van een doelmatig beheer van afvalwater.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 3.2.11
    text: Het te lozen grondwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.2.12
    text: |-
      De per tijdseenheid geloosde hoeveelheid grondwater als bedoeld in het vierde en negende lid kan op een doelmatige
      wijze worden bepaald.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.2
  - number: 3.3.1
    text: 'Deze paragraaf is van toepassing op het lozen van afvloeiend hemelwater dat:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.3
  - number: 3.3.1.a
    text: |-
      niet afkomstig is van een bodembeschermende voorziening als bedoeld in [artikel 2.9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 3.3.1.b
    text: |-
      geen hemelwater is waarop de [artikelen 3.33][ref1] en [3.34][ref2] van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
  - number: 3.3.2
    text: Het lozen, bedoeld in het eerste lid, anders dan in een vuilwaterriool is toegestaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.3
  - number: 3.3.3
    text: |-
      Het lozen, bedoeld in het eerste lid, vindt slechts dan in een vuilwaterriool plaats, indien het lozen op of in de
      bodem, in een openbaar hemelwaterstelsel of in een oppervlaktewaterlichaam redelijkerwijs niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Deze paragraaf is van toepassing op het lozen van huishoudelijk afvalwater en het behandelen van dit afvalwater
      voorafgaand daaraan. Het lozen van huishoudelijk afvalwater in een oppervlaktewaterlichaam of op of in de bodem is
      toegestaan indien het lozen plaatsvindt buiten een bebouwde kom of binnen een bebouwde kom van waaruit stedelijk
      afvalwater wordt geloosd met een vervuilingswaarde van minder dan 2000 inwonerequivalenten en de afstand tot het
      dichtstbijzijnde vuilwaterriool of een zuiveringtechnisch werk waarop kan worden aangesloten meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.4.1.a
    text: 40 meter bij niet meer dan 10 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.4.1.b
    text: 100 meter bij meer dan 10 doch minder dan 25 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.4.1.c
    text: 600 meter bij 25 doch minder dan 50 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.4.1.d
    text: 1500 meter bij 50 doch minder dan 100 inwonerequivalenten; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.4.1.e
    text: 3000 meter bij 100 tot en met 200 inwonerequivalenten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.4.2
    text: 'De afstand, bedoeld in het eerste lid, wordt berekend:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.4.2.a
    text: vanaf de kadastrale grens van het perceel waar het huishoudelijk afvalwater vrijkomt; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.4.2.b
    text: langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Indien de afstand, bedoeld in het eerste lid, minder bedraagt dan de afstanden, genoemd in dat lid, kan het
      bevoegd gezag indien het belang van de bescherming van de bodem of de kwaliteit van een oppervlaktewaterlichaam
      zich daartegen niet verzet, bij maatwerkvoorschrift het lozen op of in de bodem of in een oppervlaktewaterlichaam
      toestaan:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.4.3.a
    text: |-
      voor een door hem vast te stellen termijn, gebaseerd op het nog niet verstreken deel van een afschrijvingstermijn
      van de bij de aanleg van het vuilwaterriool of het zuiveringtechnisch werk reeds bestaande zuiveringsvoorziening;
      of
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.4.3.b
    text: |-
      indien voor een deel van het huishoudelijk afvalwater dat vrijkomt binnen de inrichting waarvan de
      vervuilingswaarde niet groter is dan 3 inwonerequivalenten aansluiting op de bedrijfsriolering die op een
      vuilwaterriool is aangesloten niet doelmatig is, waarbij kan worden bepaald dat het afvalwater door een
      zuiveringsvoorziening wordt geleid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Bij het lozen van huishoudelijk afvalwater op of in de bodem of in een oppervlaktewaterlichaam worden de volgende
      grenswaarden niet overschreden:
            Tabel 3.5










                    Lozen op of in de bodem en in een aangewezen oppervlaktewaterlichaam


                    Lozen in een niet aangewezen oppervlaktewaterlichaam




                    Parameter


                    Representatief etmaalmonster


                    Steekmonster


                    Representatief etmaalmonster


                    Steekmonster






                    Biochemisch zuurstof verbruik


                    30 milligram per liter


                    60 milligram per liter


                    20 milligram per liter


                    40 milligram per liter




                    Chemisch zuurstof verbruik


                    150 milligram per liter


                    300 milligram per liter


                    100 milligram per liter


                    200 milligram per liter




                    Totaal stikstof




                    30 milligram per liter


                    60 milligram per liter




                    Ammoniumstikstof




                    2 milligram per liter


                    4 milligram per liter




                    Onopgeloste stoffen


                    30 milligram per liter


                    60 milligram per liter


                    30 milligram per liter


                    60 milligram per liter




                    Fosfor totaal




                    3 milligram per liter


                    6 milligram per liter
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5
  - number: 3.5.2
    text: |-
      Bij lozen op of in de bodem wordt het huishoudelijk afvalwater op een zodanige wijze geloosd, dat de nadelige
      gevolgen voor het milieu zo veel mogelijk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5
  - number: 3.5.3
    text: |-
      Het eerste lid is niet van toepassing op een lozing van huishoudelijk afvalwater van minder dan 6
      inwonerequivalenten indien het afvalwater is geleid door een zuiveringsvoorziening die voldoet aan bij ministeriële
      regeling bepaalde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5
  - number: 3.5.4
    text: |-
      Het bevoegd gezag kan, bij lozen in een niet aangewezen oppervlaktewaterlichaam, indien het belang van de
      bescherming van het milieu daartoe noodzaakt bij maatwerkvoorschrift de eisen bedoeld in het derde lid niet van
      toepassing verklaren en daarbij bepalen dat het huishoudelijk afvalwater door een aangegeven zuiveringsvoorziening
      dient te worden geleid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5
  - number: 3.5.5
    text: |-
      In afwijking van het eerste lid, kan het bevoegd gezag, indien het belang van de bescherming van het milieu
      zich daartegen niet verzet, op een daartoe strekkende aanvraag voor een door hem vast te stellen termijn bij
      maatwerkvoorschrift bepalen dat bij het lozen niet aan de in dat lid genoemde waarden behoeft te worden voldaan.
      Het bevoegd gezag kan daarbij:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5
  - number: 3.5.5.a
    text: andere waarden vaststellen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5
  - number: 3.5.5.b
    text: bepalen dat het huishoudelijk afvalwater door een aangegeven zuiveringsvoorziening dient te worden geleid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5
  - number: 3.5.6
    text: Het te lozen huishoudelijk afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5
  - number: 3.5a
    text: |-
      Deze paragraaf is van toepassing op zuiveringtechnische werken, voor zover het de waterlijn betreft met inbegrip
      van slibindikking en mechanische slibontwatering.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5a
  - number: 3.5b.1
    text: |-
      De geurbelasting als gevolg van een zuiveringtechnisch werk is ter plaatse van geurgevoelige objecten niet meer dan
      0,5 odour unit per kubieke meter lucht als 98-percentiel.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5b
  - number: 3.5b.2
    text: |-
      In afwijking van het eerste lid is de geurbelasting als gevolg van een zuiveringtechnisch werk ter plaatse van
      geurgevoelige objecten gelegen op een gezoneerd industrieterrein, een bedrijventerrein danwel buiten de bebouwde
      kom, niet meer dan 1 odour unit per kubieke meter lucht als 98-percentiel.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5b
  - number: 3.5b.3
    text: |-
      Onverminderd het eerste en tweede lid, wordt bij een zuiveringtechnisch werk voldaan aan de bij ministeriële
      regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5b
  - number: 3.5c
    text: |-
      De geurbelasting, bedoeld in [artikel 3.5b][ref1], eerste en tweede lid, en
      [artikel 6.19b, tweede tot en met vijfde lid][ref2], wordt bepaald volgens de bij ministeriële regeling te stellen
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5c
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.4a
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: 6.8a
  - number: 3.5d.1
    text: |-
      In afwijking van [artikel 2.9][ref1] worden bij het ontwerp, de aanleg en het gebruik van het gedeelte van
      de waterlijn, vanaf het ontvangstwerk tot de selector of beluchtingstank, alsmede van het gedeelte van het
      zuiveringtechnisch werk waar slibontwatering, opslag en leidingwerk met primair slib plaatsvindt, bodembeschermende
      voorzieningen en bodembeschermende maatregelen getroffen waarmee een aanvaardbaar bodemrisico wordt gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 3.5d.2
    text: |-
      De bodembeschermende voorzieningen en bodembeschermende maatregelen, bedoeld in het eerste lid, voldoen aan de
      bij ministeriële regeling te stellen eisen over de goede werking van die voorzieningen en maatregelen, en over
      de controle van die eisen alsmede aan de bij ministeriële regeling te stellen eisen over de mogelijkheid om
      bodemverontreiniging te kunnen signaleren en indien nodig te herstellen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.5d
  - number: 3.6.1
    text: |-
      Deze paragraaf is van toepassing op het lozen van koelwater. Bij het lozen wordt ten minste voldaan aan het tweede
      tot en met het zevende lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: 3.6.2
    text: |-
      Het lozen van koelwater waaraan geen chemicaliën zijn toegevoegd in een oppervlaktewaterlichaam of in een
      voorziening voor de inzameling en het transport van afvalwater niet zijnde een vuilwaterriool, is toegestaan indien
      de warmtevracht niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: 3.6.2.a
    text: 1000 Kilojoule per seconde, indien het een aangewezen oppervlaktewaterlichaam betreft;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: 3.6.2.b
    text: 10 Kilojoule per seconde, indien het een niet aangewezen oppervlaktewaterlichaam betreft.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: 3.6.3
    text: 'De warmtevracht van een koelwaterlozing wordt berekend als het product van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: 3.6.3.a
    text: het lozingsdebiet van koelwater in kubieke meter per seconde;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: 3.6.3.b
    text: |-
      het verschil tussen de lozingstemperatuur en de temperatuur van het ontvangende oppervlaktewaterlichaam in graden
      Celsius;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: 3.6.3.c
    text: |-
      de warmtecapaciteit van het koelwater hetgeen gelijk is aan 4190 Kilojoule per kubieke meter per graad
      temperatuursverhoging.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: 3.6.4
    text: |-
      Het bevoegd gezag kan indien het belang van de bescherming van het milieu zich daartegen niet verzet, bij
      maatwerkvoorschrift het tweede lid niet van toepassing verklaren en het lozen van koelwater met een hogere
      warmtevracht dan bedoeld in het tweede lid of waaraan in beperkte mate chemicaliën zijn toegevoegd toestaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: 3.6.5
    text: |-
      Indien het lozen, bedoeld in het tweede lid, een temperatuurstijging zou veroorzaken die tot beperking van
      de warmtevracht noodzaakt, kan het bevoegd gezag bij maatwerkvoorschrift voor de warmtevracht lagere waarden
      vaststellen dan bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: 3.6.6
    text: |-
      Het lozen van koelwater als bedoeld in het tweede lid vindt slechts dan in een vuilwaterriool plaats indien het
      lozen van dat koelwater in een oppervlaktewaterlichaam of in een voorziening voor de inzameling en het transport
      van afvalwater niet zijnde een vuilwaterriool redelijkerwijs niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: 3.6.7
    text: |-
      De warmtevracht van een lozing van koelwater kan op een doelmatige wijze worden bepaald, dan wel door degene die de
      inrichting drijft aannemelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      Deze paragraaf is van toepassing op inrichtingen waarbij sprake is van het gelijktijdig produceren van elektrische
      energie en thermische energie door middel van een warmtekrachtinstallatie, indien:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.7
  - number: 3.7.a
    text: de installatie een totaal motorisch vermogen heeft van maximaal 15 megawatt;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.7
  - number: 3.7.b
    text: de installatie een nominaal vermogen heeft van meer dan 100 kilowatt;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.7
  - number: 3.7.c
    text: ten behoeve van de installatie geen andere brandstof dan aardgas, propaangas of butaangas wordt gebruikt; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.7
  - number: 3.7.d
    text: |-
      zich in de inrichting geen broeikasgasinstallaties bevinden als bedoeld in [artikel 16.1 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
  - number: '3.8'
    text: 'Een warmtekrachtinstallatie voldoet ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.8
  - number: 3.8.a
    text: |-
      het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.8
  - number: 3.8.b
    text: het realiseren van een verwaarloosbaar bodemrisico;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      Van een warmtekrachtinstallatie is het jaargemiddeld rendement ten minste 65%, berekend volgens de formule: de som
      van het energetisch rendement van de opwekking van kracht plus tweederde deel van het energetisch rendement van de
      productie van nuttig aan te wenden warmte.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      De warmtekrachtinstallatie wordt zodanig in bedrijf gehouden dat de hoeveelheid warmte die nuttig gebruikt wordt
      zo hoog mogelijk is en de hoeveelheid warmte die ongebruikt aan de omgeving wordt afgegeven zo klein mogelijk is.
      Onder ongebruikte warmte wordt mede verstaan de warmte die door de noodkoeler wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.9
  - number: 3.10.1
    text: Jaarlijks wordt het brandstofverbruik en de geproduceerde elektriciteit geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Indien de warmtekrachtinstallatie is aangesloten op een noodkoeler wordt jaarlijks de hoeveelheid nuttig toegepaste
      warmte geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.10
  - number: 3.10.3
    text: |-
      Indien de warmtekrachtinstallatie niet is aangesloten op een noodkoeler wordt het thermisch rendement eenmaal per
      vier jaar vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.10
  - number: 3.10.4
    text: |-
      De in het eerste en tweede lid bedoelde registraties worden gedurende vijf kalenderjaren na dagtekening bewaard
      en zijn in de inrichting aanwezig of binnen een termijn die wordt gesteld door het bevoegd gezag voor deze
      beschikbaar.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.10
  - number: '3.11'
    text: |-
      Deze paragraaf is van toepassing op het in werking hebben van een installatie voor het reduceren van aardgasdruk,
      meten en regelen van aardgashoeveelheid of aardgaskwaliteit, niet zijnde een gasdrukmeet- en regelstation categorie
      A, indien:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.11
  - number: 3.11.a
    text: de maximale inlaatzijdige werkdruk maximaal 10.000 kilo Pascal bedraagt;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.11
  - number: 3.11.b
    text: geen expansieturbine aanwezig is;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.11
  - number: 3.11.c
    text: geen drukverhogende installatie aanwezig is;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.11
  - number: 3.11.d
    text: de gastoevoerleiding een diameter van maximaal 50,8 centimeter heeft.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.11
  - number: 3.12.1
    text: |-
      In inrichtingen waar gasdrukmeet- en regelstations categorie B en C in werking zijn, is een bedrijfsnoodplan
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.2
    text: 'Het bedrijfsnoodplan omvat informatie betreffende:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.2.a
    text: het gebouw, de technische installaties, de locaties van gevaarlijke stoffen en de beschikbare hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.2.b
    text: de interne organisatie en taken en verantwoordelijkheden;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.2.c
    text: de actieplannen en maatregelen gebaseerd op alle reëel te achten calamiteiten en incidenten;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.2.d
    text: de interne en externe meldingsstructuur bij calamiteiten en incidenten;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.2.e
    text: het beheer van het bedrijfsnoodplan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.3
    text: Het bedrijfsnoodplan alsmede wijzigingen daarvan wordt toegestuurd aan het bevoegd gezag en de regionale brandweer.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.4
    text: |-
      Degene die de inrichting als bedoeld in het eerste lid drijft heeft op inzichtelijke wijze binnen de inrichting dan
      wel binnen een door het bevoegd gezag gestelde termijn, beschikbaar:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.4.a
    text: |-
      het algemene beheerssysteem voor milieu- en veiligheidsaspecten waarmee aan de bij of krachtens dit besluit
      gestelde regels wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.4.b
    text: periodieke onderhoudsschema’s en de resultaten van inspecties;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.4.c
    text: een actuele plattegrond en situatietekening van de inrichting.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.5
    text: 'Het bedienend personeel heeft toegang tot:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.5.a
    text: een schema van het aardgasmeet- of regelstation en de toegepaste appendages;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.5.b
    text: een schema van de in- en uitgaande leidingen met hun afsluiters;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.5.c
    text: rapporten van eerdere beproevingen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.6
    text: |-
      Met betrekking tot de opstelplaats van een gasdrukmeet- en regelstation ten opzichte van buiten de inrichting
      gelegen kwetsbare objecten en beperkt kwetsbare objecten, worden de in tabel 3.12 opgenomen afstanden in acht
      genomen:
            Tabel 3.12 veiligheidsafstanden








                    Categorie-indeling


                    Opstellingswijze


                    Kwetsbare objecten


                    Beperkt kwetsbare objecten






                    B


                    Kast


                    4 meter


                    2 meter




                    (semi-)Ondergronds station


                    4 meter


                    2 meter




                    Kaststation


                    6 meter


                    4 meter




                    Open opstelling/vrijstaand gebouw


                    10 meter


                    4 meter




                    C


                    Alle stations t/m 40 000 normaal kubieke meter per uur aardgas


                    15 meter


                    4 meter




                    Alle stations boven 40 000 normaal kubieke meter per uur aardgas


                    25 meter


                    4 meter
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.7
    text: |-
      De in tabel 3.12 genoemde afstanden voor een ondergronds dan wel semi-ondergronds station mogen worden gehalveerd
      indien het gasvoerende deel geheel ondergronds ligt. Kasten mogen tegen gebouwen worden geplaatst mits wordt
      voldaan aan de bepalingen van NEN 1059.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.12.8
    text: |-
      Onverminderd het eerste tot en met zevende lid wordt voldaan aan de bij ministeriële regeling te stellen eisen
      ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.12
  - number: 3.13.1
    text: Deze paragraaf is van toepassing op een windturbine of een combinatie van windturbines.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.13
  - number: 3.13.2
    text: |-
      De artikelen [2.17 tot en met 2.22][ref1] zijn niet van toepassing op een windturbine of een combinatie van
      windturbines.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: 3.14.1
    text: |-
      Een windturbine wordt ten minste eenmaal per kalenderjaar beoordeeld op de noodzakelijke beveiligingen, onderhoud
      en reparaties door een deskundige op het gebied van windturbines.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Indien wordt geconstateerd of indien het redelijk vermoeden bestaat dat een onderdeel of onderdelen van de
      windturbine een gebrek bezitten, waardoor de veiligheid voor de omgeving in het geding is, wordt de windturbine
      onmiddellijk buiten bedrijf gesteld en het bevoegd gezag daaromtrent geïnformeerd. De windturbine wordt eerst weer
      in bedrijf genomen nadat alle gebreken zijn hersteld.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.14
  - number: 3.14.3
    text: |-
      Indien een windturbine als gevolg van het in werking treden van een beveiliging buiten bedrijf is gesteld, wordt
      deze pas weer in werking gesteld nadat de oorzaak van het buiten werking stellen is opgeheven.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.14
  - number: 3.14.4
    text: |-
      Bij het inwerking hebben van een windturbine worden ten behoeve van het voorkomen of beperken van slagschaduw en
      lichtschittering de bij ministeriële regeling te stellen maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.14
  - number: 3.14.5
    text: |-
      Een windturbine voldoet ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat
      ongewone voorvallen zich voordoen en de gevolgen hiervan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.14
  - number: 3.14a.1
    text: |-
      Een windturbine of een combinatie van windturbines voldoet ten behoeve van het voorkomen of beperken van
      geluidhinder aan de norm van ten hoogste 47 dB L en aan de norm van ten hoogste 41 dB L op de gevel van gevoelige
      gebouwen en bij gevoelige terreinen op de grens van het terrein.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.14a
  - number: 3.14a.2
    text: |-
      Onverminderd het eerste lid kan het bevoegd gezag bij maatwerkvoorschrift teneinde rekening te houden met cumulatie
      van geluid als gevolg van een andere windturbine of een andere combinatie van windturbines, normen met een lagere
      waarde vaststellen ten aanzien een van de windturbines of een combinatie van windturbines.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.14a
  - number: 3.14a.3
    text: |-
      In afwijking van het eerste lid kan het bevoegd gezag bij maatwerkvoorschrift in verband met bijzondere lokale
      omstandigheden normen met een andere waarde vaststellen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.14a
  - number: 3.15.1
    text: |-
      De metingen van de geluidemissie ter bepaling van de bronsterkte van een windturbine of een combinatie van
      windturbines worden uitgevoerd overeenkomstig de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.15
  - number: 3.15.2
    text: |-
      De drijver van de inrichting registreert de bij ministeriële regeling te bepalen gegevens welke gedurende vijf
      kalenderjaren na dagtekening worden bewaard en ter inzage gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.15
  - number: 3.15a.1
    text: |-
      Het plaatsgebonden risico voor een buiten de inrichting gelegen kwetsbaar object, veroorzaakt door een windturbine
      of een combinatie van windturbines, is niet hoger dan 10-6 per jaar.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.15a
  - number: 3.15a.2
    text: |-
      Het plaatsgebonden risico voor een buiten de inrichting gelegen beperkt kwetsbaar object, veroorzaakt door een
      windturbine of een combinatie van windturbines, is niet hoger dan 10-5 per jaar.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.15a
  - number: 3.15a.3
    text: |-
      Ten behoeve van het bepalen van het plaatsgebonden risico, bedoeld in het eerste en tweede lid, kunnen bij
      ministeriële regeling afstanden worden vastgesteld, die minimaal aanwezig moeten zijn tussen een windturbine of een
      combinatie van windturbines en een buiten de inrichting gelegen kwetsbaar dan wel beperkt kwetsbaar object.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.15a
  - number: 3.15a.4
    text: |-
      Indien op grond van het derde lid afstanden zijn vastgesteld, worden die in acht genomen en zijn het eerste en
      tweede lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.15a
  - number: 3.15a.5
    text: Bij ministeriële regeling kunnen regels worden gesteld over de berekening van het plaatsgebonden risico.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.15a
  - number: '3.16'
    text: |-
      Bij het in werking hebben van een installatie voor het doorvoeren, bufferen of keren van rioolwater worden ten
      behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van
      geurhinder de bij ministeriële regeling te stellen maatregelen genomen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.16
  - number: 3.16a
    text: |-
      Deze paragraaf is van toepassing op het in werking hebben van een natte koeltoren die water in aërosolvorm in de
      lucht kan brengen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.16a
  - number: 3.16b
    text: |-
      Bij het in werking hebben van een natte koeltoren wordt ten behoeve van het voorkomen van risico’s voor de omgeving
      en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van risico’s voor de
      omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan, ten minste voldaan aan de bij
      ministeriële regeling voorgeschreven maatregelen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.16b
  - number: '3.17'
    text: |-
      Deze paragraaf is van toepassing op een inrichting waarbij sprake is van het afleveren van vloeibare brandstof,
      mengsmering en aardgas ten behoeve van openbare verkoop voor motorvoertuigen voor het wegverkeer voorzover geen
      aflevering plaatsvindt met een pomp die zich onder het vloeistofniveau in een ondergrondse tank bevindt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.17
  - number: 3.18.1
    text: |-
      De afleverzuil bij een aardgas-afleverstation voor het afleveren van gecomprimeerd aardgas aan motorvoertuigen
      voor het wegverkeer die aardgas als motorbrandstof gebruiken bevindt zich op een afstand van ten minste 10 meter
      van kwetsbare en beperkt kwetsbare objecten. Indien per etmaal meer dan 300 personenauto’s worden gevuld, bedraagt
      deze afstand 15 meter. Indien per etmaal meer dan 100 autobussen worden gevuld, bedraagt deze afstand 20 meter.
      De bufferopslag bevindt zich op een afstand van kwetsbare en beperkt kwetsbare objecten zoals aangegeven in tabel
      3.18.
            Tabel 3.18






                    Waterinhoud bufferopslag


                    Afstand






                    Minder dan 3000 liter


                    10 meter




                    Vanaf 3000 tot 5000 liter


                    15 meter




                    Meer dan 5000 liter


                    20 meter
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.18
  - number: 3.18.2
    text: |-
      Een aardgas-afleverinstallatie voor het afleveren van aardgas ten behoeve van openbare verkoop voor motorvoertuigen
      voor het wegverkeer voldoet aan de bij ministeriële regeling te stellen eisen ten behoeve van het voorkomen van
      risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk
      beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.18
  - number: '3.19'
    text: |-
      Het afleveren van vloeibare brandstoffen en mengsmering ten behoeve van openbare verkoop voor motorvoertuigen voor
      het wegverkeer voldoet ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.19
  - number: 3.19.a
    text: |-
      het realiseren van een verwaarloosbaar bodemrisico en het voorkomen dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van luchtverontreiniging, aan de bij ministeriële regeling te stellen eisen; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.19
  - number: 3.19.b
    text: |-
      het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan, ten minste aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.19
  - number: 3.20.1
    text: |-
      Het afleveren van lichte olie aan motorvoertuigen voor het wegverkeer ten behoeve van openbare verkoop geschiedt
      via een systeem voor dampretour Stage-II. Deze verplichting geldt niet voor:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.20
  - number: 3.20.1.a
    text: het afleveren van lichte olie met een maximale afleversnelheid van 10 liter per minuut of minder; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.20
  - number: 3.20.1.b
    text: het afleveren van lichte olie met mengsmering met een maximale afleversnelheid van 45 liter per minuut of minder.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.20
  - number: 3.20.2
    text: |-
      Het gebruikte systeem voor dampretour Stage-II moet ten minste 75% van de uit de brandstofreservoirs van de
      motorvoertuigen verdreven dampen naar de ondergrondse opslagtank terugvoeren.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.20
  - number: 3.20.3
    text: 'Een systeem voor dampretour Stage-II:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.20
  - number: 3.20.3.a
    text: |-
      is goedgekeurd overeenkomstig de Test Procedure voor Damp Retour Systemen in Benzinepompen voor Nederland van het
      Nederlands Meetinstituut door een keuringsinstantie, welke daartoe door de Raad voor Accreditatie is geaccrediteerd
      op grond van NEN-EN-ISO/IEC 17020; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.20
  - number: 3.20.3.b
    text: |-
      voldoet aan de bij ministeriële regeling te stellen eisen ten behoeve van het voorkomen van risico’s voor de
      omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de
      risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.20
  - number: 3.20.4
    text: |-
      Een systeem voor dampretour Stage-II wordt voor ingebruikname en daarna eenmaal per drie jaar gecontroleerd op de
      goede werking. Deze controle moet overeenkomstig de Test Procedure voor Damp Retour Systemen in Benzinepompen voor
      Nederland van het Nederlands Meetinstituut plaatsvinden door een onafhankelijke inspectie-instelling.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.20
  - number: 3.20.5
    text: |-
      Indien tijdens de uitvoering van de in het vierde lid bedoelde controle afwijkingen worden geconstateerd worden
      deze afwijkingen onverwijld opgeheven.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.20
  - number: '3.21'
    text: |-
      Op of direct bij een afleverzuil die bestemd is voor het afleveren van brandstof waarin een hoger percentage
      biobrandstoffen en andere hernieuwbare brandstoffen dan de grenswaarde van 5% methylvetzuur (FAME) of bio-
      ethanol is bijgemengd, wordt duidelijk zichtbaar de volgende tekst vermeld: Deze brandstof bevat meer dan 5%
      biobrandstoffen en is niet geschikt voor motorvoertuigen die voor het gebruik daarvan niet zijn uitgerust.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.21
  - number: 3.22.1
    text: |-
      Degene die de inrichting drijft neemt de resultaten van de metingen, keuringen en controles aan installaties of
      installatieonderdelen die op grond van [artikel 3.20][ref1] worden verricht, op in een installatieboek.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 3.22.2
    text: 'Het installatieboek bevat voor zover van toepassing tevens:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.22
  - number: 3.22.2.a
    text: |-
      een plattegrond op een schaal van ten minste één op tweehonderdvijftig aanduidende de uit- en inwendige
      samenstelling van de inrichting en toebehoren;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.22
  - number: 3.22.2.b
    text: |-
      alle bewijzen van gecertificeerde of geaccrediteerde aanleg en inspectie die op grond van dit besluit uitgevoerd
      worden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.22
  - number: 3.22.3
    text: |-
      De resultaten van de metingen, keuringen en controles worden in ieder geval tot het beschikbaar zijn van de
      resultaten van de eerstvolgende meting, keuring dan wel controle, maar ten minste drie jaar opgenomen in het
      installatieboek.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.22
  - number: 3.22.4
    text: Het installatieboek wordt in de inrichting bewaard en ter inzage beschikbaar gehouden voor het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.22
  - number: 3.22.5
    text: |-
      Het vierde lid is niet van toepassing op een onbemand tankstation, in welk geval het bevoegd gezag bij
      maatwerkvoorschrift de locatie bepaalt waar het installatieboek wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.22
  - number: 3.23.1
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van een bodembeschermende voorziening waarop het
      afleveren van vloeibare brandstof, mengsmering en aardgas ten behoeve van openbare verkoop voor motorvoertuigen
      voor het wegverkeer plaatsvindt, wordt ten minste voldaan aan het tweede tot en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.23
  - number: 3.23.2
    text: |-
      Het afvalwater wordt geleid door een slibvangput en olieafscheider die voldoen aan en worden gebruikt conform NEN-
      EN 858-1 en 2.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.23
  - number: 3.23.3
    text: |-
      Het gehalte aan olie in het afvalwater na de afscheider bedraagt niet meer dan 200 milligram per liter in enig
      steekmonster.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.23
  - number: 3.23.4
    text: Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.23
  - number: 3.23a.1
    text: Deze paragraaf is van toepassing op het wassen van motorvoertuigen of carrosserie-onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.23a
  - number: 3.23a.2
    text: |-
      Deze paragraaf is niet van toepassing op landbouwinrichtingen, glastuinbouwbedrijven en op inrichtingen type C die
      zijn bestemd voor het kweken, fokken, mesten, houden, verhandelen, verladen of wegen van landbouwhuisdieren.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.23a
  - number: 3.23a.3
    text: |-
      Deze paragraaf is niet van toepassing op het inwendig reinigen van tanks en tankwagens en het inwendig reinigen en
      ontsmetten van vrachtwagens en andere transportmiddelen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.23a
  - number: '3.24'
    text: |-
      Bij het wassen van motorvoertuigen of carrosserie-onderdelen daarvan wordt ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.24
  - number: 3.25.1
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van een bodembeschermende voorziening waarop
      motorvoertuigen of carrosserie-onderdelen daarvan worden gewassen, wordt ten minste voldaan aan het tweede tot en
      met vierde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.25
  - number: 3.25.2
    text: 'Het afvalwater bevat in enig steekmonster niet meer dan:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.25
  - number: 3.25.2.a
    text: 20 milligram olie per liter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.25
  - number: 3.25.2.b
    text: 300 milligram onopgeloste stoffen per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.25
  - number: 3.25.3
    text: |-
      In afwijking van het tweede lid mag het gehalte aan olie ten hoogste 200 milligram per liter in enig steekmonster
      bedragen, indien het afvalwater voorafgaand aan vermenging met ander afvalwater wordt geleid door een slibvangput
      en olieafscheider die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.25
  - number: 3.25.4
    text: Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.25
  - number: '3.26'
    text: |-
      Ten behoeve van het verwijderen van amalgaam wordt bij het in het vuilwaterriool lozen van afvalwater afkomstig van
      tandheelkundige bewerkingen het amalgaamhoudend afvalwater geleid door een amalgaamafscheider, die voldoet aan de
      eisen gesteld in NEN-EN-ISO 11143.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.26
  - number: '3.27'
    text: 'Deze paragraaf is van toepassing op inrichtingen waarbij sprake is van het opslaan van propaan indien:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.27
  - number: 3.27.a
    text: het opslaan van propaan geschiedt in opslagtanks elk met een inhoud van maximaal 13 kubieke meter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.27
  - number: 3.27.b
    text: niet meer dan twee opslagtanks binnen de inrichting aanwezig zijn; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.27
  - number: 3.27.c
    text: |-
      propaan uitsluitend in de gasfase aan een opslagtank wordt onttrokken behoudens het leegmaken van een opslagtank
      voor verplaatsing.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.27
  - number: 3.28.1
    text: |-
      Met betrekking tot de opstelplaats van een opslagtank met propaan, het vulpunt van een opslagtank met propaan en de
      opstelplaats van de tankwagen worden ten opzichte van buiten de inrichting gelegen kwetsbare en beperkt kwetsbare
      objecten, de in tabel 3.28 opgenomen afstanden in acht genomen, waarbij de afstanden gelden van het vulpunt en de
      opslagtank, gerekend vanaf de aansluitpunten van de leidingen alsmede het bovengrondse deel van de leidingen en de
      pomp bij de opslagtank:
            Tabel 3.28 veiligheidsafstanden








                    Bevoorrading tot en met 5 keer per jaar


                    Bevoorrading meer dan 5 keer per jaar






                    Opslagtank met propaan tot en met 5 kubieke meter


                    10 meter


                    20 meter




                    Opslagtank met propaan groter dan 5 kubieke meter tot en met 13 kubieke meter


                    15 meter


                    25 meter
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.28
  - number: 3.28.2
    text: |-
      Een opslagtank met propaan, het vulpunt van een opslagtank met propaan en de opstelplaats van de tankwagen is
      gelegen op ten minste de helft van de afstanden, genoemd in tabel 3.28, indien het objecten betreft waar ook een
      opslagtank met propaan of propeen aanwezig is.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.28
  - number: 3.28.3
    text: |-
      In afwijking van het eerste lid worden met betrekking tot de opstelplaats van een opslagtank met propaan, het
      vulpunt van een opslagtank met propaan en de opstelplaats van de tankwagen ten opzichte van gebouwen bestemd voor
      het verblijf, al dan niet gedurende een gedeelte van de dag, van minderjarigen, ouderen, zieken of gehandicapten,
      dan wel gebouwen waarin doorgaans grote aantallen personen gedurende een groot gedeelte van de dag aanwezig zijn,
      de volgende afstanden in acht genomen:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.28
  - number: 3.28.3.a
    text: 'bij een opslagtank met propaan tot en met 5 kubieke meter: 25 meter;'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.28
  - number: 3.28.3.b
    text: 'bij een opslagtank met propaan van meer dan 5 kubieke meter tot en met 13 kubieke meter: 50 meter.'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.28
  - number: 3.28.4
    text: |-
      Onverminderd het eerste tot en met derde lid, voldoet een opslagtank met propaan alsmede de bijbehorende leidingen
      en appendages ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor
      zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone
      voorvallen zich voordoen en de gevolgen hiervan, aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.28
  - number: '3.29'
    text: |-
      Deze paragraaf is van toepassing op het opslaan van vloeibare brandstof en afgewerkte olie in ondergrondse tanks
      van metaal of kunststof van maximaal 150 kubieke meter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.29
  - number: '3.30'
    text: |-
      Bij het in gebruik hebben en het beëindigen van het gebruik van een ondergrondse opslagtank die wordt dan wel werd
      gebruikt voor de opslag van vloeibare brandstof of afgewerkte olie wordt ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.30
  - number: 3.30.a
    text: het realiseren van een verwaarloosbaar bodemrisico;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.30
  - number: 3.30.b
    text: |-
      het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.30
  - number: 3.30.c
    text: |-
      het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van het
      grondwater,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.30
  - number: 3.31.1
    text: Deze paragraaf is van toepassing op het op- en overslaan van inerte goederen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.31
  - number: 3.31.2
    text: 'Onverminderd het eerste lid is deze paragraaf van toepassing op een inrichting type B bij:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.31
  - number: 3.31.2.a
    text: |-
      het op- en overslaan van goederen, niet zijnde inerte goederen, voor zover dat niet is geregeld in de
      [paragrafen 3.3.4][ref1], [3.3.5][ref2], [3.3.7][ref3], [4.1.1 tot en met 4.1.4][ref4] en [4.1.7][ref5];


