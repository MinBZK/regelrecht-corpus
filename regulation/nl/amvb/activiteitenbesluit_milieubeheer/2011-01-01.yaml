      - id: ref2
        bwb_id: BWBR0006423
      - id: ref3
        bwb_id: BWBR0008877
  - number: 6.14.1
    text: |-
      Voor inrichtingen waarop onmiddellijk voorafgaand aan de inwerkingtreding van [artikel 2.17][ref1], het
      [Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer][ref2] van toepassing was, en waarvoor voor
      muziekgeluid een bedrijfsduurcorrectie werd toegepast, kan het bevoegd gezag bij maatwerkvoorschrift bepalen dat
      [artikel 2.18, tweede lid][ref3], niet van toepassing is voor de toetsing van geluidsniveaus tussen 23.00 en 07.00
      uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009633
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
      - id: ref2
        bwb_id: BWBR0009633
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: 6.14.2
    text: |-
      Indien op grond van het maatwerkvoorschrift, bedoeld in het eerste lid, een bedrijfsduurcorrectie wordt toegepast,
      is het door de inrichting veroorzaakte geluidsniveau gedurende de bedrijfstijd tussen 23.00 en 07.00 uur niet hoger
      dan op grond van [artikel 2.17][ref1] is toegestaan tussen 19.00 en 23.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: '6.15'
    text: |-
      Voor inrichtingen waarop onmiddellijk voorafgaand aan de inwerkingtreding van de [artikelen 2.17][ref1]
      en [2.18][ref2], het [Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer][ref3],
      het [Besluit detailhandel en ambachtsbedrijven milieubeheer][ref4] of het
      [Besluit woon- en verblijfsgebouwen milieubeheer][ref5] van toepassing was, zijn de waarden uit de
      [artikelen 2.17][ref6], [2.18][ref7] dan wel [2.19][ref8] niet van toepassing op de gevel van respectievelijk in
      een dienst- of bedrijfswoning dan wel een woning die deel uitmaakt van een inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009633
      [ref4]: https://wetten.overheid.nl/BWBR0009935
      [ref5]: https://wetten.overheid.nl/BWBR0009934
      [ref6]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref8]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.15
    references:
