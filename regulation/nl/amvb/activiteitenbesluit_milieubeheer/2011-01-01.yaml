        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.2
        afdeling: '4.8'
  - number: 6.17.2.a
    text: een slibvangput en een olieafscheider zijn geplaatst die voldoen aan en worden gebruikt conform NEN 7089;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.17
  - number: 6.17.2.b
    text: |-
      voor 1 maart 1997 een slibvangput en een olieafscheider zijn geplaatst, die op de hoeveelheid afvalwater zijn
      afgestemd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.17
  - number: 6.18.1
    text: |-
      [Artikel 3.3, derde lid][ref1], is niet van toepassing op het lozen vanuit een inrichting dat is aangevangen voor
      het van toepassing worden van dat artikel op die inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0022762
