        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
  - number: '4.36'
    text: |-
      Bij verspanende bewerkingen waar metaalbewerkingsvloeistoffen worden verneveld of verdampt worden maatregelen
      getroffen om zichtbare verspreiding van druppels en nevels die vrijkomen bij verspanende bewerkingen waarbij
      bewerkingsvloeistoffen worden gebruikt, in de buitenlucht te voorkomen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.36
  - number: '4.37'
    text: |-
      Bij het smeden, droogverspanende bewerkingen, thermische bewerking en mechanische eindafwerking van metalen worden
      ten behoeve van het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van emissies naar
      de buitenlucht de bij ministeriële regeling te bepalen maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.37
  - number: '4.38'
    text: |-
      Bij spaanloze, verspanende en thermische bewerkingen en mechanische eindafwerkingen van metalen wordt ten behoeve
      van het realiseren van een verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.38
  - number: 4.39.1
    text: Het is verboden om in de buitenlucht laswerkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.39
  - number: 4.39.2
    text: |-
      Het eerste lid is niet van toepassing indien het niet mogelijk is om in het inpandig deel van de inrichting te
      lassen vanwege de omvang van het te lassen object.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.39
  - number: 4.40.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij laswerkzaamheden behorend tot de klassen III tot en met
      VII als genoemd in de Praktijkrichtlijn Lasrook, beschrijving doeltreffende maatregelen bij blootstelling aan rook
      en/of gassen en/of aanverwante processen, de emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.40
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.40.1.a
    text: |-
