        afdeling: '2.3'
  - number: 4.125.2
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij activiteiten die leiden tot gasvormige emissies
      afkomstig van een laboratorium of praktijkruimte naar de lucht, de emissieconcentratie van de stoffen behorend
      tot de stofklassen gA.1, gA.2, gA.3, gO.1, gO.2 en gO.3, naar de lucht niet meer dan de voor die betreffende
      stofklasse genoemde emissieconcentratie-eis in artikel 2.5 indien de massastroom gelijk is aan of groter is dan de
      in [artikel 2.5][ref3] voor de betreffende stofklasse genoemde grensmassastroom.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.125
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
