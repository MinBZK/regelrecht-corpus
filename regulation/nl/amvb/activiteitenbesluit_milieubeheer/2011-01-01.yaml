  - number: 6.2.4
    text: |-
      De voorschriften van een vergunning dan wel de nadere eisen op grond van het
      [Lozingenbesluit Wvo huishoudelijk afvalwater][ref1] of het [Lozingenbesluit bodemsanering en proefbronnering][ref2]
      voor het lozen vanuit een inrichting, die voor een inrichting onmiddellijk voorafgaand aan het tijdstip van
      het van toepassing worden van [artikel 1.4, eerste, tweede of derde lid][ref3], op die inrichting in werking
      en onherroepelijk waren en niet vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van
      maatwerkvoorschriften worden indien op grond van dit besluit strengere bepalingen gelden, gedurende zes maanden
      aangemerkt als maatwerkvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0008512
      [ref2]: https://wetten.overheid.nl/BWBR0008511
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel1
