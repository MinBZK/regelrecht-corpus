      van de voorschriften van de vergunning, aangemerkt als voorschriften van de vergunning.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.2
  - number: 6.3.1
    text: |-
      Een ontheffing op grond van de [artikelen 14, tweede lid][ref1], [24, tweede lid][ref2], en
      [25, tweede lid, van het Lozingenbesluit bodembescherming][ref3] met betrekking tot het lozen, bedoeld in
      [artikel 2.2, eerste of tweede lid][ref4], wordt gedurende de resterende termijn van die ontheffing aangemerkt als
      een maatwerkvoorschrift als bedoeld in artikel 2.2, derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.3
    references:
