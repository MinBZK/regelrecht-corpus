        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.125.3
    text: |-
      Indien bij activiteiten emissies van Extreem risicovolle stoffen of MVP, afkomstig van een laboratorium of
      praktijkruimte, kunnen vrijkomen, kan het bevoegd gezag in het belang van de luchtkwaliteit met inachtneming van de
      NeR maatwerkvoorschriften stellen aan de minimalisatie van die emissies.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.125
  - number: '4.126'
    text: |-
      Bij activiteiten in een laboratorium of een praktijkruimte worden ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico en het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van
      die emissies naar de buitenlucht de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.126
  - number: '4.127'
    text: |-
      Bij het gericht werken met biologische agentia in een laboratorium of een praktijkruimte wordt ten behoeve van het
      voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel
      mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen
      hiervan, ten minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.127
  - number: 6.1.1
    text: |-
      Voor inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip van het van toepassing worden
      van [artikel 1.4, eerste, tweede of derde lid][ref1], op die inrichtingen, een vergunning op
      grond van [artikel 8.1 van de Wet milieubeheer][ref2] dan wel een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref3] in werking en
      onherroepelijk was, worden de voorschriften van die vergunning gedurende drie jaar na het van toepassing worden
      van [artikel 1.4, eerste, tweede of derde lid][ref4], op die inrichtingen, aangemerkt als maatwerkvoorschriften,
      mits de voorschriften van die vergunning vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van
      maatwerkvoorschriften en voor zover dit besluit op de inrichting van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.1
    references:
      - id: ref1
