  - number: 6.34.2
    text: |-
      [Artikel 4.80a][ref1] is niet van toepassing op inpandige afleverinstallaties voor lichte olie die zijn
      geïnstalleerd voor 1 januari 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.34
