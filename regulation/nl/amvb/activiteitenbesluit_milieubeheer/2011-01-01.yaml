  - number: 6.3.2
    text: |-
      In afwijking van [artikel 6.2, eerste lid][ref1], wordt een vergunning als bedoeld in
      [artikel 1, tweede lid, van de Wet verontreiniging oppervlaktewateren][ref2] dan wel een vergunning op grond van
      [artikel 6.2 van de Waterwet][ref3] met betrekking tot het lozen, bedoeld in [artikel 3.1, vijfde lid][ref4],
      gedurende de resterende termijn van die vergunning aangemerkt als een maatwerkvoorschrift als bedoeld in artikel
      3.1, zesde lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel6
