      bescherming van het milieu kunnen worden toegepast en degene die de inrichting drijft op een andere wijze voldoet
      aan de eisen ten aanzien van de emissies naar de lucht van stoffen die bij of krachtens de [hoofdstukken 3][ref2]
      en [4][ref3] zijn gesteld:


