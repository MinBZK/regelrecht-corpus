  - number: 6.2.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij het van toepassing worden van [artikel 1.4, derde lid][ref1],
      met betrekking tot het lozen vanuit een inrichting type C, voor zover het lozen betrekking heeft op de activiteiten
      genoemd in [hoofdstuk 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.2
