preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 29 maart 2007,
    nr. DJZ2007031290, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de Staatssecretaris van
    Verkeer en Waterstaat;

    Gelet op de richtlijn nr. 2003/30/EG van het Europees Parlement en de Raad van de Europese Unie van 8 mei 2003
    (PbEU L 123) ter bevordering van het gebruik van biobrandstoffen of andere hernieuwbare brandstoffen in het
    vervoer, richtlijn nr. 91/271/EEG van de Europese Gemeenschappen van 21 mei 1991 betreffende het stedelijk
    afvalwater (PbEG L 135), richtlijn 91/689/EEG van de Raad van de Europese Gemeenschappen van 12 december 1991
    betreffende gevaarlijke afvalstoffen (PbEG L 377), richtlijn 2000/53/EG van het Europees Parlement en de Raad
    van de Europese Unie van 11 maart 1999 inzake de beperking van de emissie van vluchtige organische stoffen ten
    gevolge van het gebruik van organische oplosmiddelen bij bepaalde werkzaamheden en installaties (PbEG L 85),
    richtlijn 2000/59/EG van het Europees Parlement en de Raad van de Europese Unie van 27 november 2000 betreffende
    havenontvangstvoorzieningen voor scheepsafval en ladingresiduen (PbEG L 332), richtlijn 2000/91/EG van het Europees
    Parlement en de Raad van 16 december 2002 betreffende de energieprestatie van gebouwen (PbEU 1), richtlijn 2000/60/
    EG van 23 oktober 2000 tot vaststelling van een kader voor communautaire maatregelen betreffende het waterbeleid
    (PbEG L 327), richtlijn 2006/11/EG van 15 februari 2006 betreffende de verontreiniging veroorzaakt door bepaalde
    gevaarlijke stoffen die in het aquatisch milieu van de Gemeenschap worden geloosd (PbEU L 64), richtlijn 80/86/EEG
    van de Raad van 17 december 1979 betreffende de bescherming van het grondwater tegen verontreiniging veroorzaakt
    door de lozing van bepaalde gevaarlijke stoffen (PbEG L 20), richtlijn 2006/118/EG van het Europees Parlement en de
    Raad van de Europese Unie van 12 december 2006 betreffende de bescherming van het grondwater tegen verontreiniging
    en achteruitgang van de toestand (Pb L 371) en op de artikelen 8.1, tweede lid, 8.40, 8.41 en 8.42 van de Wet
    milieubeheer, en op de artikelen 2a, eerste en tweede lid, 2b en 2c, van de Wet verontreiniging oppervlaktewateren;

    De Raad van State gehoord (advies van 28 juni 2007, nr. W08.07.0082/IV);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 15
    oktober 2007, nr. DJZ2007098397, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens de
    Staatssecretaris van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: *aangewezen oppervlaktewaterlichaam:*
      oppervlaktewaterlichaam dat op grond van [artikel 1.7, eerste lid, onderdeel b][ref1], is aangewezen; *ADR*:
      de op 30 september 1957 te Genève totstandgekomen Europese Overeenkomst betreffende het internationale vervoer
      van gevaarlijke stoffen over de weg (Trb. 1959, 171); *afleverinstallatie*: geheel van de al dan niet onder de
      grond liggende tank of tanks met daaraan gekoppelde leidingen, appendages, één of meer afleverzuilen, voorzover
      aanwezig, een kassa en, voorzover aanwezig, één of meer betaalautomaten; *andere hernieuwbare brandstoffen*:
      andere hernieuwbare brandstoffen als bedoeld in artikel 2, eerste lid, onderdeel c, van [richtlijn 2003/30/
      EG](32003L0030); *autodemontagebedrijf*: inrichting voor het demonteren van autowrakken; *autowrak*: voertuig
      dat een afvalstof is in de zin van [artikel 1.1, eerste lid, van de wet][ref2]; *autowrakkenrichtlijn*:
      richtlijn nr. 2000/53/EG van het Europees Parlement en de Raad van de Europese Unie van 18 september 2000
      betreffende autowrakken (PbEG L 269); *bedrijfsduurcorrectie*: correctie als bedoeld in de Handleiding meten
      en rekenen industrielawaai, zijnde de logaritmische verhouding tussen de tijdsduur dat de geluidsbron gedurende
      de beoordelingstijd in werking is, en de duur van die beoordelingsperiode; *bedrijventerrein*: cluster
      aaneengesloten percelen met overwegend bedrijfsbestemmingen, binnen een in een bestemmingsplan als bedrijventerrein
      aangewezen gebied, daaronder niet begrepen een gezoneerd industrieterrein; *beheerder:* beheerder als bedoeld
      in [artikel 1.1 van de Waterwet][ref3]; *beperkt kwetsbaar object*: beperkt kwetsbaar object als bedoeld
      in [artikel 1, eerste lid, onderdeel b, van het Besluit externe veiligheid inrichtingen][ref4]; *bijkomend
      gevaar*: een gevaar naast de grootste gevaarseigenschap als bedoeld in het ADR; *biobrandstof*: biobrandstof als
      bedoeld in artikel 2, eerste lid, onderdeel a, van [richtlijn 2003/30/EG](32003L0030), waaronder in elk geval
      de biobrandstoffen, bedoeld in artikel 2, tweede lid, van [richtlijn 2003/30/EG](32003L0030), worden verstaan;
      *bodembedreigende activiteit*: bedrijfsmatige activiteit als bedoeld in paragraaf 3.1 van deel A 3 van de NRB;
      *bodembedreigende stof*: stof die de bodem kan verontreinigen als bedoeld in paragraaf 3.1 van deel A3 van de
      NRB; *bodembeschermende maatregel*: op de gebezigde stoffen en gebruikte bodembeschermende voorziening toegesneden
      beheermaatregel gericht op reparatie, schoonmaak, onderhoud, actie bij incidenten, bedrijfsinterne controle,
      inspectie of toezicht, ter voorkoming van immissies in de bodem of herstel van de effecten van zulke immissies
      op de bodemkwaliteit, waarvan de uitvoering is gewaarborgd; *bodembeschermende voorziening*: een vloeistofkerende
      voorziening, een vloeistofdichte vloer of verharding of een andere doelmatige fysieke voorziening, ter
      voorkoming van immissies in de bodem; *bovengrondse opslagtank*: opslagtank die geheel boven de bodem is gelegen;
      *brandcompartiment*: brandcompartiment als bedoeld in [artikel 1.1, eerste lid, van het Bouwbesluit 2003][ref5];
      *BTEX*: benzeen, tolueen, ethylbenzeen en xyleen; *bunkerstation*: drijvend bouwsel dat wegens zijn
      bestemming in de regel niet wordt verplaatst en dat bestemd of in gebruik is voor de opslag of levering
      van brandstof voor voortstuwing van schepen; *consumentenvuurwerk*: consumentenvuurwerk als bedoeld in
      [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref6]; *CMR-stof*: stof of preparaat die volgens bijlage I
      bij [Richtlijn nr. 67/548/EEG](31967L0548) geclassificeerd is als Kankerverwekkend categorie 1 of 2 of als Mutageen
      categorie 1 of 2 of als «Voor de voortplanting giftig» categorie 1 of 2; *dierlijke bijproducten*: bijproducten
      als bedoeld in artikel 2, eerste lid, onder a, van Verordening nr. 1774/2002 van het Europees Parlement en de
      Raad tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke
      bijproducten; *doelmatig beheer van afvalwater*: zodanig beheer van afvalwater dat daarbij rekening wordt gehouden
      met de voorkeursvolgorde aangegeven in [artikel 10.29a van de wet][ref7]; *equivalent geluidsniveau*: equivalent
      geluidsniveau als bedoeld in [artikel 1 van de Wet geluidhinder][ref8]; *etmaalwaarde*: de hoogste van de volgende
      drie waarden: a. de waarde van het langtijdgemiddelde beoordelingsniveau (L) tussen 07.00 en 19.00 uur (dag); b. de
      met 5 dB(A) verhoogde waarde van het langtijdgemiddelde beoordelingsniveau (L) tussen 19.00 en 23.00 uur (avond);
      c. de met 10 dB(A) verhoogde waarde van het langtijdgemiddelde beoordelingsniveau (L) tussen 23.00 en 07.00 uur
      (nacht); *gasdrukmeet- en regelstation categorie A*: gasdrukmeet- en regelstation met: - een ontwerpcapaciteit die
      kleiner of gelijk aan 650 normaal kubieke meter per uur is met een maximale operationele inlaatzijdige werkdruk die
      kleiner of gelijk aan 0,1 bar is;
        - een ontwerpcapaciteit die kleiner of gelijk aan 10 normaal kubieke meter per uur is met een maximale
      operationele inlaatzijdige werkdruk die kleiner of gelijk aan 16 bar is; *gasdrukmeet- en regelstation categorie
      B*: gasdrukmeet- en regelstation met een ontwerpcapaciteit die kleiner of gelijk aan 6000 normaal kubieke
      meter per uur is met een maximale operationele inlaatzijdige werkdruk die kleiner of gelijk aan 16 bar is, niet
      zijnde een gasdrukmeet- en regelstation categorie A; *gasdrukmeet- en regelstation categorie C*: gasdrukmeet-
      en regelstation met een maximale operationele inlaatzijdige werkdruk die kleiner of gelijk aan 100 bar is, niet
      zijnde een gasdrukmeet- en regelstation categorie A of gasdrukmeet- en regelstation categorie B; *gasfles*:
      een verplaatsbare drukhouder met een waterinhoud van niet meer dan 150 liter; *geluidsgevoelige ruimte*:
      geluidsgevoelige ruimte als bedoeld in [artikel 1 van de Wet geluidhinder][ref9]; *geluidsniveau*: geluidsniveau
      in dB(A) als bedoeld in [artikel 1 van de Wet geluidhinder][ref10]; *geurgevoelig object*: geurgevoelig object
      als bedoeld in [artikel 1 van de Wet geurhinder en veehouderij][ref11]; *gevaarlijke stoffen*: stoffen en
      voorwerpen, waarvan het vervoer volgens het ADR is verboden of slechts onder daarin opgenomen voorwaarden is
      toegestaan, dan wel stoffen, materialen en voorwerpen aangeduid in de International Maritime Dangerous Goods Code;
      *gevel*: gevel als bedoeld in [artikel 1][ref12] juncto [artikel 1b, vijfde lid, van de Wet geluidhinder][ref13];
      *gevoelige gebouwen*: woningen en gebouwen die op grond van [artikel 1 van de Wet geluidhinder][ref14]
      worden aangemerkt als andere geluidsgevoelige gebouwen, met uitzondering van die gebouwen behorende bij
      de betreffende inrichting; *gevoelige objecten*: gevoelige gebouwen en gevoelige terreinen; *gevoelige
      terreinen*: terreinen die op grond van [artikel 1 van de Wet geluidhinder][ref15] worden aangemerkt als
      geluidsgevoelige terreinen, met uitzondering van die terreinen behorende bij de betreffende inrichting;
      *gezoneerd industrieterrein*: industrieterrein als bedoeld in [artikel 1 van de Wet geluidhinder][ref16];
      *inerte goederen*: goederen die geen bodembedreigende stoffen, gevaarlijke stoffen of CMR-stoffen zijn;
      *ISO*: door de Internationale Organisatie voor Standaardisatie uitgegeven norm; *jachthaven*: inrichting voor
      het bieden van gelegenheid tot het afmeren van pleziervaartuigen; *koelinstallatie*: een combinatie van met
      koudemiddel gevulde onderdelen die met elkaar zijn verbonden en die tezamen een gesloten koudemiddelcircuit
      vormen waarin het koudemiddel circuleert met het doel warmte op te nemen of af te staan; *kunststeen*:
      blokken van korrels of brokken van natuursteen met bindmiddel; *kwetsbaar object*: kwetsbaar object als
      bedoeld in [artikel 1, eerste lid, onderdeel l, van het Besluit externe veiligheid inrichtingen][ref17];
      *L*: de geluidsbelastingsindicator zoals opgenomen in artikel 3, onder f, van richtlijn nr. 2002/49/
      EG van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002, inzake de evaluatie en de
      beheersing van omgevingslawaai; *L*: de geluidsbelastingsindicator zoals opgenomen in artikel 3, onder i,
      van richtlijn nr. 2002/49/EG van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002,
      inzake de evaluatie en de beheersing van omgevingslawaai; *landbouwinrichting*: inrichting als bedoeld in
      [artikel 2 van het Besluit landbouw milieubeheer][ref18]; *langtijdgemiddeld beoordelingsniveau*: (L) het
      gemiddelde van de afwisselende niveaus van het ter plaatse optredende geluid, gemeten in een bepaalde periode
      en vastgesteld en beoordeeld overeenkomstig de Handleiding meten en rekenen industrielawaai; *lassen van
      textiel*: het door middel van warmteopwekking of warmtetoevoer aaneenhechten van textiel; *lekbak*: een
      voorziening waarvan de bodembeschermende werking door de daarop afgestemde bodembeschermende maatregelen
      is gewaarborgd, en die zich rondom of onder een bodembedreigende activiteit bevindt en in staat is de bij
      normale bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen; *lozen*: het brengen van: 1°.
      afvalwater of andere afvalstoffen, verontreinigende of schadelijke stoffen in een oppervlaktewaterlichaam; 2°.
      afvalwater of overige vloeistoffen op of in de bodem; 3°. afvalwater of andere afvalstoffen in een openbaar
      hemelwaterstelsel; 4°. afvalwater of andere afvalstoffen in een openbaar ontwateringstelsel; 5°. afvalwater
      of andere afvalstoffen in een openbaar vuilwaterriool; 6°. afvalwater of andere afvalstoffen in een andere
      voorziening voor de inzameling en het transport van afvalwater, of 7°. afvalwater of andere afvalstoffen met
      behulp van een werk niet zijnde een voorziening voor de inzameling en het transport van afvalwater op een
      zuiveringtechnisch werk; *LQ*: Limited Quantities, gelimiteerde hoeveelheden als bedoeld in het ADR; *massastroom*:
      massa van een bepaalde stof of stoffen die per tijdseenheid wordt geëmitteerd, uitgedrukt in massa per uur;
      *maximaal geluidsniveau*: (L) maximaal geluidsniveau gemeten in de meterstand «F» of «fast», als vastgesteld en
      beoordeeld overeenkomstig de Handleiding meten en rekenen industrielawaai; *meststoffengroep*: aanduiding van
      de gevaarscategorie van vaste minerale anorganische meststoffen overeenkomstig de indeling van PGS 7; *natte
      koeltoren*: installatie gebruikt voor het afvoeren van overtollige warmte uit productieprocessen en gebouwen
      door middel van het vernevelen van water; *natuursteen*: uit de natuur gewonnen blokken en platen van steen;
      *NEN*: door de Stichting Nederlands Normalisatie-instituut uitgegeven norm; *NeR*: door InfoMil uitgegeven
      Nederlandse Emissie Richtlijnen lucht; *niet aangewezen oppervlaktewaterlichaam:* oppervlaktewaterlichaam dat
      geen aangewezen oppervlaktewaterlichaam is; *noodsignalen*: noodsignalen die onder de klasse 1.3 of klasse
      1.4 van het ADR vallen; *normaal kubieke meter*: afgashoeveelheid bij 273,15 Kelvin en 101,3 kilo Pascal en
      betrokken op droge lucht; *NRB*: door InfoMil uitgegeven Nederlandse richtlijn bodembescherming bedrijfsmatige
      activiteiten; *odour unit*: Europese eenheid voor geurconcentratie volgens NEN-EN-13725; *opslagtank*: een
      opslagvoorziening voor gas met een inhoud van ten minste 150 liter of een opslagvoorziening voor vloeistof met
      een inhoud van ten minste 300 liter, uitgezonderd een intermediate bulk container die voldoet aan hoofdstuk
      6.5 van het ADR; *PER*: tetrachlooretheen; *PGS*: Publicatiereeks Gevaarlijke Stoffen; *pleziervaartuig*: schip
      bestemd of gebruikt voor sport of vrijetijdsbesteding; *praktijkruimte*: ruimte voor chemisch, natuurkundig
      of medisch onderwijs waarop de [Wet op het hoger onderwijs en het wetenschappelijk onderzoek][ref19] van
      toepassing is; *propaan*: product, hoofdzakelijk bestaande uit propaan en propeen, met geringe hoeveelheden
      ethaan, butanen en butenen, voor zover de dampspanning bij 343 Kelvin (70 graden Celsius) ten hoogste 3100
      kilopascal (31 bar) bedraagt; *propeen*: zeer licht ontvlambaar tot vloeistof verdicht gas met UN-nummer 1077;
      *pyrotechnische artikelen voor theatergebruik*: pyrotechnische artikelen voor theatergebruik als bedoeld in
      [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref20]; *richtlijn 2003/30/EG*: [richtlijn nr. 2003/30/
      EG](32003L0030) van het Europees Parlement en de Raad van de Europese Unie van 8 mei 2003 (PbEU L 123) ter
      bevordering van het gebruik van biobrandstoffen of andere hernieuwbare brandstoffen in het vervoer; *rookzwak
      kruit*: kruit dat onder de klasse 1.3 van het ADR valt; *spuitbus*: niet-hervulbare houder van metaal, glas
      of kunststof die een samengeperst, vloeibaar gemaakt of opgelost gas bevat, al dan niet met een vloeibare,
      pasteuze of poedervormige stof, en voorzien van een aftapinrichting die het mogelijk maakt, dat de inhoud wordt
      uitgestoten in de vorm van een suspensie van vaste of vloeibare deeltjes in een gas, in de vorm van schuim,
      pasta of poeder of in vloeibare of gasvormige toestand; *stookinstallatie*: stookinstallatie als bedoeld in
      het [Besluit emissie-eisen middelgrote stookinstallaties milieubeheer][ref21]; *systeem voor dampretour Stage-
      II*: geheel van vulpistool, slang, appendages, regelinstrumenten en overige toebehoren waarmee de bij het
      afleveren van benzine aan motorvoertuigen voor het wegverkeer uit het brandstofreservoir van het motorvoertuig
      verdreven dampen worden teruggevoerd in de ondergrondse opslagtank van het tankstation; *theatervuurwerk*:
      theatervuurwerk als bedoeld in [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref22]; *totaal stikstof*:
      de som van nitraat-, nitriet-, organisch en ammonium stikstof waarvan de emissiemetingen worden uitgevoerd,
      bedoeld in [artikel 2.3][ref23]; *traditioneel schieten*: door schutterijen of schuttersgilden schieten met
      buksen ofwel geweren vanaf een vaste standplaats op een stilstaand doel in de buitenlucht; *verblijfsruimten*:
      verblijfsruimten als bedoeld in [artikel 1.1, onderdeel e, van het Besluit geluidhinder][ref24];
      *verbruik van vluchtige organische stoffen*: verbruik van vluchtige organische stoffen als bedoeld in het
      [Oplosmiddelenbesluit omzetting EG-VOS-richtlijn milieubeheer][ref25]; *verdichten*: reduceren van het volume;
      *verkleinen*: in kleinere delen opdelen; *verpakkingsgroep*: een groep, waarin bepaalde stoffen op grond van hun
      gevaarlijkheid tijdens het vervoer conform het ADR zijn ingedeeld voor verpakkingsdoeleinden: 1°. *verpakkingsgroep
      I*: zeer gevaarlijke stoffen; 2°. *verpakkingsgroep II*: gevaarlijke stoffen; 3°. *verpakkingsgroep III*:
      minder gevaarlijke stoffen; *vervoerseenheid met gevaarlijke stoffen*: een voertuig, oplegger of aanhanger
      met een conform het ADR voor het vervoer van gevaarlijke stoffen toegelaten tank, tankcontainer, tankbatterij,
      laadketel, laadruimte of laadvloer waarin gevaarlijke stoffen aanwezig zijn; *verwaarloosbaar bodemrisico*:
      een situatie als bedoeld in de NRB waarin door een goede afstemming van bodembeschermende voorzieningen en
      bodembeschermende maatregelen de kans op een verandering van de bodemkwaliteit, ten gevolge van een immissie
      van een stof, verwaarloosbaar is gemaakt; *vloeibare brandstof*: lichte olie, halfzware olie of gasolie als
      bedoeld in [artikel 26 van de Wet op de accijns][ref26]; *vloeistofdichte vloer of verharding*: vloer of
      verharding direct op de bodem die waarborgt dat geen vloeistof aan de niet met vloeistof belaste zijde van die
      vloer of verharding kan komen; *vloeistofkerende voorziening*: lekbak, tankput, vloer, verharding of een andere
      doelmatige fysieke voorziening die vrijgekomen stoffen keert zolang als nodig is om met de daarop afgestemde
      bodembeschermende maatregelen te voorkomen dat deze stoffen in de bodem kunnen geraken; *vluchtige organische
      stoffen*: stoffen als bedoeld in het [Oplosmiddelenbesluit omzetting EG-VOS-richtlijn milieubeheer][ref27];
      *voertuig*: 1°. bedrijfsauto als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref28] met een maximum gewicht
      van ten hoogste 3500 kilogram; 2°. personenauto als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref29],
      of 3°. bromfiets als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref30], niet zijnde een
      voertuig op twee wielen; *voorziening voor het beheer van afvalwater*: een openbaar vuilwaterriool,
      openbaar hemelwaterstelsel, openbaar ontwateringstelsel, een andere voorziening voor de inzameling en
      het transport van afvalwater, een zuiveringtechnisch werk of een zuiveringsvoorziening; *vuilwaterriool*:
      1°. een openbaar vuilwaterriool; 2°. een andere voorziening voor de inzameling en het transport van
      stedelijk afvalwater, aangesloten op een zuiveringsvoorziening, die blijkens een vergunning als bedoeld in
      [artikel 6.2 van de Waterwet][ref31] mede voor het zuiveren van stedelijk afvalwater is bedoeld, of aangesloten
      op een zuiveringtechnisch werk; of 3°. een werk, niet zijnde een voorziening voor de inzameling en het
      transport van afvalwater, aangesloten op een zuiveringtechnisch werk; *vuurwerk*: vuurwerk als bedoeld in
      [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref32]; *warmtekrachtinstallatie*: stookinstallatie, bestemd
      voor het gelijktijdig opwekken van warmte en kracht waarbij de warmte nuttig wordt aangewend; *windturbine*:een
      apparaat voor het opwekken van elektrisch of thermisch vermogen uit wind; *woning*: een gebouw of een deel van een
      gebouw dat voor bewoning wordt gebruikt of daartoe is bestemd; *zuiveringsvoorziening*: werk voor het zuiveren van
      afvalwater, dat geen zuiveringtechnisch werk is; *zwart kruit*: kruit dat onder de klasse 1.1 van het ADR valt.


