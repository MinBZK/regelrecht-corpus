      - id: ref6
        bwb_id: BWBR0013430
  - number: 1.11.8
    text: |-
      Indien er een melding is gedaan als bedoeld in [artikel 1.10, eerste of tweede lid][ref1], en aannemelijk is dat,
      in andere gevallen dan die genoemd in het eerste, tweede en derde lid, het langtijdgemiddeld beoordelingsniveau
      (L) of het maximaal geluidsniveau (L) veroorzaakt door de in de inrichting aanwezige installaties en
      toestellen, alsmede door de in de inrichting verrichte werkzaamheden en activiteiten of veroorzaakt door
      de verandering daarvan, meer bedragen dan de waarden, bedoeld in de [artikelen 2.17][ref2], [2.19][ref3],
      [2.20][ref4], [6.12][ref5] dan wel de van toepassing zijnde geluidswaarden van de omgevingsvergunning, het
      [Besluit landbouw milieubeheer][ref6] of het [Besluit glastuinbouw][ref7], kan het bevoegd gezag binnen vier weken
      na ontvangst van de melding besluiten dat binnen een door het bevoegd gezag gestelde termijn een rapport van een
      akoestisch onderzoek wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0022762#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0020112
      [ref7]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
    references:
      - id: ref1
