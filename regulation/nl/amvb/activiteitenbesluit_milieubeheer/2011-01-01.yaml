  - number: 3.31.2.b
    text: het composteren van groenafval.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.31
  - number: 3.31.3
    text: 'Onverminderd het eerste lid is deze paragraaf van toepassing op een inrichting type C bij:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.31
  - number: 3.31.3.a
    text: |-
      het op- en overslaan van goederen, niet zijnde inerte goederen, voor zover dat niet is geregeld in de
      [paragrafen 3.3.4][ref1], [3.3.5][ref2], [3.3.7][ref3], [4.1.1 tot en met 4.1.4][ref4] en [4.1.7][ref5], bij:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '3'
