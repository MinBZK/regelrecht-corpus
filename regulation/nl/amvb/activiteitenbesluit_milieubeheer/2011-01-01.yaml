  - number: 1.11.9
    text: |-
      Het bevoegd gezag kan binnen vier weken na ontvangst van de melding, bedoeld in [artikel 1.10][ref1], besluiten
      dat een rapport van een akoestisch onderzoek wordt overgelegd indien de inrichting is gelegen op een gezoneerd
      industrieterrein en een rapport van een akoestisch onderzoek noodzakelijk is voor zonebeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.11.10
    text: |-
      Uit het rapport van een akoestisch onderzoek blijkt op grond van verrichte geluidsmetingen of
      geluidsberekeningen of aan de waarden, bedoeld in de [artikelen 2.17][ref1], [2.19][ref2], [2.20][ref3],
      [3.14a][ref4], [6.12][ref5] dan wel de van toepassing zijnde geluidswaarden van de omgevingsvergunning, het
      [Besluit landbouw milieubeheer][ref6] of het [Besluit glastuinbouw][ref7] kan worden voldaan. In het rapport wordt
      aangegeven welke voorzieningen worden getroffen om te voorkomen dat de in de eerste volzin bedoelde waarden worden
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0022762#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0020112
      [ref7]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
    references:
