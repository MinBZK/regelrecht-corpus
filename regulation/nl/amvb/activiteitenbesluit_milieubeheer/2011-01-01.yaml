  - number: 2.2.2
    text: |-
      In afwijking van het eerste lid is lozen op of in de bodem verboden, indien daarbij stoffen zonder doorsijpeling
      door bodem of ondergrond in het grondwater geraken.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.2
  - number: 2.2.3
    text: |-
      Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat het eerste en tweede lid niet van toepassing zijn en dat
      lozen op of in de bodem of in een voorziening voor de inzameling en het transport van afvalwater niet zijnde een
      vuilwaterriool is toegestaan indien het belang van de bescherming van het milieu zich gelet op de samenstelling,
      hoeveelheid en eigenschappen van de lozing daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.2
  - number: 2.2.4
    text: 'Bij maatwerkvoorschrift als bedoeld in het derde lid kunnen voorwaarden worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.2
  - number: 2.2.4.a
    text: de samenstelling, eigenschappen of hoeveelheid van de lozing en het meten en registreren daarvan;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.2
  - number: 2.2.4.b
    text: te treffen maatregelen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.2
  - number: 2.2.4.c
    text: de duur van de lozing; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.2
  - number: 2.2.4.d
    text: de plaats van het lozingspunt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.2
  - number: 2.2.5
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing op lozen in de bodem waaraan in een vergunning op grond van
      [artikel 6.4][ref1] of [artikel 6.5, onderdeel b, van de Waterwet][ref2], dan wel een vergunning op grond van een
      verordening van het waterschap voorschriften zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 2.2.6
    text: |-
      Indien een maatwerkvoorschrift als bedoeld in het derde lid een lozing betreft die aanzienlijke
      gevolgen voor het milieu kan hebben, is op de voorbereiding van het maatwerkvoorschrift
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 2.2a
    text: |-
      Indien er sprake is van een zodanige combinatie van meerdere activiteiten, dat een scheiding van het afvalwater,
      afkomstig van die activiteiten, niet doelmatig is, kan het bevoegd gezag, indien het belang van de bescherming
      van het milieu zich daartegen niet verzet, op verzoek van de aanvrager bij maatwerkvoorschrift aan het lozen
      voorwaarden stellen, die afwijken van de voorwaarden die aan het lozen als gevolg van een afzonderlijke activiteit
      bij of krachtens [hoofdstuk 3][ref1] of [4][ref2] zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0022762
        hoofdstuk: '4'
  - number: 2.3.1
    text: 'Emissiemetingen ter controle op de naleving van de emissie-eisen voor het lozen worden uitgevoerd volgens:'
