        afdeling: '2.8'
  - number: 6.16.1
    text: |-
      Tot het tijdstip van inwerkingtreding van [artikel 2.19][ref1] is dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: 6.16.2
    text: |-
      [Artikel 2.17][ref1] is niet van toepassing op inrichtingen die zijn gelegen in een concentratiegebied voor
      horeca-inrichtingen of in een concentratiegebied voor detailhandel en ambachtsbedrijven, dat bij of krachtens een
      verordening als zodanig is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: 6.16.3
    text: |-
      In een gebied als bedoeld in het tweede lid bedraagt het langtijdgemiddeld beoordelingsniveau, veroorzaakt door de
      in de inrichting aanwezige installaties en toestellen, alsmede door de in de inrichting verrichte werkzaamheden en
      activiteiten, in ieder geval niet meer:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.16
  - number: 6.16.3.a
    text: dan het in dat gebied heersende referentieniveau;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.16
  - number: 6.16.3.b
    text: dan de in tabel 6.16 aangegeven waarden binnen een woning of andere geluidsgevoelige gebouwen en terreinen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.16
  - number: 6.16.4
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder referentieniveau: hoogste waarde van de in onderdeel a en b
      genoemde niveaus:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.16
  - number: 6.16.4.a
    text: |-
      het geluidsniveau, uitgedrukt in dB(A), dat gemeten over een bepaalde periode, gedurende 95% van de tijd wordt
      overschreden, exclusief de bijdrage van de inrichting zelf;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.16
  - number: 6.16.4.b
    text: |-
      het optredende equivalente geluidsniveau (L), veroorzaakt door wegverkeerbronnen minus 10 dB(A), met dien verstande
      dat voor de nachtperiode van 23.00 tot 07.00 uur alleen wegverkeerbronnen in rekening mogen worden gebracht met een
      intensiteit van meer dan 500 motorvoertuigen gedurende die periode.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.16
  - number: 6.17.1
    text: |-
      De [artikelen 3.23, tweede lid][ref1], en [4.82, tweede lid][ref2], zijn niet van toepassing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.17
    references:
