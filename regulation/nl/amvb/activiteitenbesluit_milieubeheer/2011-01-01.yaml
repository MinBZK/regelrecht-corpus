  - number: '6.44'
    text: |-
      Dit besluit treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor verschillende
      artikelen of onderdelen en voor verschillende soorten inrichtingen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.44
  - number: 6.44a
