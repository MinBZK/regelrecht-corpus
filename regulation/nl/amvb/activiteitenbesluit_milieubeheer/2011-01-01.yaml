  - number: 6.24b.2
    text: |-
      De voorschriften van een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1], voor een
      inrichting type C die betrekking hebben op de activiteiten, bedoeld in [paragraaf 3.3.7][ref2] en onmiddellijk
      voorafgaand aan het tijdstip van inwerkingtreding van [artikel 3.41][ref3] in werking waren en niet vallen binnen
      de bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften worden indien op grond van paragraaf
      3.3.7 van het besluit strengere bepalingen gelden gedurende zes maanden aangemerkt als maatwerkvoorschriften.


