    text: |-
      Op de inrichtingen, bedoeld in het eerste lid, blijven gedurende drie jaar de voorschriften uit de vergunning van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.25
  - number: 6.25a.1
    text: |-
      [Artikel 4.5, tweede lid][ref1], is gedurende twaalf maanden met ingang van de datum waarop op grond van dat
      lid geen inhoudsgrens geldt, niet van toepassing op inrichtingen met bovengrondse opslagtanks voor de opslag
      van zuurstof met een inhoud van minder dan 25 kubieke meter waarop artikel 4.5, tweede lid, zoals dat luidde op
      1 januari 2008, niet van toepassing was.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.25a
