  - number: 1.6.2
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.6
  - number: 1.6.2.a
    text: 'het in een oppervlaktewaterlichaam:'
