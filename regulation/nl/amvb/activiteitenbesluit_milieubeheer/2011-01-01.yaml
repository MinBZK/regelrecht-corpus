      C geheel of in hoofdzaak is of zal zijn gelegen voor zover dit een inrichting is als bedoeld in categorie 28.4 of
      28.5 van onderdeel C, [bijlage 1, van het Besluit omgevingsrecht][ref2], aangemerkt als bevoegd gezag.


