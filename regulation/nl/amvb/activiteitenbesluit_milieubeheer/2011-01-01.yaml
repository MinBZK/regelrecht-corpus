  - number: 2.8.2
    text: |-
      Het eerste lid, onderdelen a en b, is van overeenkomstige toepassing op een verandering van de inrichting indien de
      verandering naar verwachting zal leiden tot een significante toename van de emissie.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.8
  - number: 2.8.3
    text: |-
      Emissiemetingen ter controle op de naleving van de emissie-eisen worden uitgevoerd overeenkomstig paragraaf 3.7 van
      de NeR en volgens:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.8
  - number: 2.8.3.a
    text: NEN-EN 13284-1, dan wel in het geval van continue metingen, volgens NEN-EN 13284-2, ten aanzien van totaal stof;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.8
  - number: 2.8.3.b
    text: ISO 16740, ten aanzien van chroom VI -verbindingen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.8
  - number: 2.8.3.c
    text: NEN-EN 14385, ten aanzien van zware metalen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.8
  - number: 2.8.3.d
    text: |-
      NEN-EN 1911-1, 1911-2 en 1911-3, dan wel in het geval van continue metingen volgens VDI 3480-3, ten aanzien van
      zoutzuur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.8
  - number: 2.8.3.e
    text: NEN 2819, ten aanzien van waterstoffluoride;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.8
  - number: 2.8.3.f
    text: NEN-EN 14792, dan wel in het geval van continue metingen volgens NEN-ISO 10849, ten aanzien van stikstofoxiden; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.8
  - number: 2.8.3.g
    text: NEN 2826, ten aanzien van ammoniak.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.8
  - number: 2.8.4
    text: |-
      Toetsing van emissiemetingen aan de emissieconcentratie-eisen als bedoeld in [artikel 2.5][ref1] en in de
      [hoofdstukken 3][ref2] en [4][ref3] vindt plaats overeenkomstig paragraaf 3.7 van de NeR.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0022762
        hoofdstuk: '4'
  - number: 2.8.5
    text: |-
      In afwijking van het derde lid kunnen andere bepalingsmethoden worden gebruikt indien deze gelijkwaardig zijn aan
      de in dat lid genoemde methoden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Indien in een inrichting een bodembedreigende activiteit wordt verricht worden bodembeschermende voorzieningen en
      bodembeschermende maatregelen getroffen waarmee een verwaarloosbaar bodemrisico wordt gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.9
  - number: 2.9.2
    text: |-
      De bodembeschermde voorzieningen en bodembeschermende maatregelen voldoen aan de bij ministeriële regeling gestelde
      eisen in verband met de goede werking van die voorzieningen en maatregelen, en omtrent de controle van die eisen
      alsmede aan de bij ministeriële regeling gestelde eisen in verband met de mogelijkheid om bodemverontreiniging te
      kunnen signaleren.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.9
  - number: 2.9.3
    text: |-
      In de bij ministeriële regeling te bepalen gevallen zendt degene die de inrichting drijft de resultaten van het
      onderzoek in verband met de mogelijkheid om bodemverontreiniging te kunnen signaleren, bedoeld in het tweede lid,
      aan het bij die regeling aangegeven bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.9
  - number: 2.10.1
    text: |-
      Om een verwaarloosbaar bodemrisico te realiseren voldoet een ondergrondse opslagtank aan de bij ministeriële
      regeling gestelde eisen in verband met:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.10
  - number: 2.10.1.a
    text: de goede werking van die opslagtank;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.10
  - number: 2.10.1.b
    text: de mogelijkheid om bodemverontreiniging te kunnen signaleren.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.10
  - number: 2.10.2
    text: |-
      Een kathodische bescherming voldoet aan de bij ministeriële regeling gestelde eisen in verband met de goede werking
      van die bescherming.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.10
  - number: 2.11.1
    text: |-
      Indien in de inrichting een bodembedreigende activiteit wordt verricht, wordt uiterlijk binnen drie maanden na
      oprichting van de inrichting, een rapport met de resultaten van een onderzoek naar de bodemkwaliteit toegestuurd
      aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.2
    text: |-
      Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot het uitvoeren van een onderzoek naar de
      bodemkwaliteit bij een verandering van de inrichting, indien het gelet op de aard of de mate waarin de inrichting
      verandert, nodig is de bodemkwaliteit vast te leggen met het oog op een mogelijke aantasting of verontreiniging van
      de bodem die kan of is ontstaan door een bodembedreigende activiteit.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.3
    text: |-
      Indien in de inrichting een bodembedreigende activiteit is verricht wordt uiterlijk binnen zes maanden na
      beëindiging van de inrichting of na beëindiging van het opslaan van vloeibare brandstof, afgewerkte olie of pekel
      in een ondergrondse opslagtank, een rapport met de resultaten van een onderzoek naar de bodemkwaliteit toegezonden
      aan het bevoegd gezag. In dit rapport wordt ten minste vermeld:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.3.a
    text: de naam en adres van degene die het onderzoek heeft verricht;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.3.b
    text: de wijze waarop het onderzoek is verricht;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.3.c
    text: de aard en de mate van de aangetroffen verontreinigende stoffen en de herkomst daarvan;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.3.d
    text: |-
      de mate waarin de bodemkwaliteit is gewijzigd ten opzichte van de situatie bij de oprichting of de verandering van
      de inrichting voor zover die situatie is vastgelegd in een rapport;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.3.e
    text: de wijze waarop en de mate waarin de bodemkwaliteit wordt hersteld als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.4
    text: |-
      De onderzoeken en rapporten, bedoeld in het eerste, tweede en derde lid, worden uitgevoerd onderscheidenlijk
      opgesteld door een persoon of een instelling die daartoe beschikt over een erkenning op grond van het
      [Besluit bodemkwaliteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 2.11.5
    text: |-
      Indien uit het rapport, bedoeld in het derde lid, blijkt dat de bodem als gevolg van de activiteiten in de
      inrichting is aangetast of verontreinigd, draagt degene die de inrichting drijft er zorg voor dat binnen zes
      maanden na toezending van dat rapport aan het bevoegd gezag de bodemkwaliteit is hersteld tot:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.5.a
    text: de situatie bij oprichting of verandering van de inrichting voor zover die situatie is vastgelegd in een rapport;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.5.b
    text: |-
      de achtergrondwaarden als bedoeld in het [Besluit bodemkwaliteit][ref1] indien er geen rapport als bedoeld in
      onderdeel a beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 2.11.6
    text: |-
      Het herstel van de bodemkwaliteit als bedoeld in het vijfde lid geschiedt door een persoon of een instelling die
      beschikt over een erkenning op grond van het [Besluit bodemkwaliteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 2.11.7
    text: |-
      Degene die de inrichting drijft meldt de aanvang en de afronding van de werkzaamheden, bedoeld in het vijfde lid,
      direct aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.8
    text: |-
      De onderzoeken, bedoeld in het eerste tot en met derde lid, voldoen aan NEN 5740 en richten zich uitsluitend op
      de bodembedreigende stoffen die door de werkzaamheden ter plaatse een bedreiging voor de bodemkwaliteit vormen
      of vormden en op de plaatsen waar bodembedreigende activiteiten plaatsvinden, zullen plaatsvinden dan wel hebben
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.9
    text: |-
      Een aanwezige vloeistofdichte vloer of verharding wordt ten behoeve van het onderzoek, bedoeld in het eerste lid of
      tweede lid, niet doorboord of anderszins aangetast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.11.10
    text: |-
      Bij ministeriële regeling kunnen bodembedreigende activiteiten worden aangewezen waarop dit artikel geheel of
      gedeeltelijk niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.11
  - number: 2.12.1
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: 2.12.1.a
    text: gevaarlijke afvalstoffen te mengen met afvalstoffen, niet zijnde gevaarlijke afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: 2.12.1.b
    text: |-
      afvalstoffen te mengen met andere afvalstoffen die wat betreft aard, samenstelling of concentraties niet
      vergelijkbaar zijn, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: 2.12.1.c
    text: afvalstoffen te mengen met stoffen, niet zijnde afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: 2.12.2
    text: 'Het verbod, bedoeld in het eerste lid, aanhef en onder b, is niet van toepassing op afvalstoffen, voor zover:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: 2.12.2.a
    text: de afvalstoffen geen gevaarlijke afvalstoffen zijn;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: 2.12.2.b
    text: de afvalstoffen niet van buiten de inrichting afkomstig zijn, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: 2.12.2.c
    text: het gescheiden houden en gescheiden afgeven van de afvalstoffen redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: 2.12.3
    text: 'Het verbod, bedoeld in het eerste lid, aanhef en onder b en c, is niet van toepassing op het mengen:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: 2.12.3.a
    text: ten behoeve van product- of materiaalhergebruik, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: 2.12.3.b
    text: |-
      van afvalwater waarvan het lozen bij of krachtens dit besluit op dezelfde wijze is toegestaan, voorafgaand aan
      dat lozen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: 2.12.4
    text: |-
      Bij ministeriële regeling worden categorieën van afvalstoffen aangewezen waarin per categorie de afvalstoffen wat
      betreft aard, samenstelling en concentratie in ieder geval vergelijkbaar zijn.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.12
  - number: '2.13'
    text: |-
      Degene die de inrichting drijft verwijdert zo vaak als nodig etenswaren, verpakkingen, sport- of spelmaterialen, of
      andere materialen die uit de inrichting afkomstig zijn of voor de inrichting zijn bestemd binnen een straal van 25
      meter van de inrichting.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.13
  - number: '2.14'
    text: |-
      Indien binnen een inrichting een afvalstof zijnde metaal, hout, kunststof, textiel, steenachtige materialen of
      gips als grondstof wordt ingezet voor het vervaardigen, samenstellen of repareren van producten of onderdelen
      daarvan bestaande uit metaal, hout, kunststof, textiel, steenachtige materialen of gips en de eigenschappen van
      de afvalstof afwijken van de gangbare grondstof kan het bevoegd gezag maatwerkvoorschriften stellen om nadelige
      gevolgen voor het milieu die kunnen ontstaan door het afwijken van de eigenschappen, te voorkomen of voor zover dat
      niet mogelijk is te beperken.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14
  - number: 2.14a.1
    text: Het is verboden afvalstoffen te verbranden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14a
  - number: 2.14a.2
    text: Het is verboden afvalstoffen op of in de bodem te brengen met het doel ze daar te laten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14a
  - number: 2.14a.3
    text: |-
      Het tweede lid geldt niet voor het toepassen van bouwstoffen en het toepassen van grond of baggerspecie, waarop het
      [Besluit bodemkwaliteit][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14a
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 2.14a.4
    text: Het tweede lid geldt niet voor het lozen op of in de bodem.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14a
  - number: 2.14a.5
    text: Het is verboden afvalstoffen voorafgaand aan nuttige toepassing langer dan drie jaren op te slaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14a
  - number: 2.14a.6
    text: Het is verboden afvalstoffen voorafgaand aan verwijdering langer dan een jaar op te slaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14a
  - number: 2.14a.7
    text: |-
      Uiterlijk binnen acht weken na de beëindiging van de inrichting worden de daarin aanwezige afvalstoffen uit de
      inrichting afgevoerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14a
  - number: 2.14b.1
    text: |-
      Indien binnen een inrichting afvalstoffen worden op- of overgeslagen, bewerkt of verwerkt die worden ingezameld
      bij of afgegeven door een andere persoon dan degene die de inrichting drijft, is binnen de inrichting een actuele
      beschrijving aanwezig van de procedures van acceptatie en controle van de ontvangen afvalstoffen, die nodig zijn
      voor een doelmatig beheer van die afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14b
  - number: 2.14b.2
    text: |-
      De beschrijving, bedoeld in het eerste lid, onderscheidt groepen van afvalstoffen waarvoor vanuit het oogpunt van
      doelmatig beheer van afvalstoffen verschillende procedures worden gehanteerd en omvat per onderscheiden groep van
      afvalstoffen in ieder geval de volgende elementen:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14b
  - number: 2.14b.2.a
    text: |-
      het type ontdoener waarvan afvalstoffen worden aangenomen, voor zover dit gevolgen heeft voor de acceptatie en
      controle;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14b
  - number: 2.14b.2.b
    text: de eisen die degene die de inrichting drijft, stelt aan de manier waarop de afvalstoffen worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14b
  - number: 2.14b.2.c
    text: de manier waarop de afvalstoffen worden gecontroleerd bij ontvangst, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14b
  - number: 2.14b.2.d
    text: |-
      de manier waarop de afvalstoffen die op een milieuhygiënisch relevante manier afwijken van wat gangbaar is voor de
      categorie, worden behandeld.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14b
  - number: 2.14b.3
    text: 'Degene die de inrichting drijft draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14b
  - number: 2.14b.3.a
    text: |-
      de procedures van acceptatie en controle, bedoeld in het eerste lid, binnen de inrichting in acht worden genomen,
      en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14b
  - number: 2.14b.3.b
    text: de afvalstoffen binnen de inrichting uitsluitend worden ingenomen voor zover die procedures worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14b
  - number: 2.14b.4
    text: |-
      Het bevoegd gezag kan in het belang van het doelmatig beheer van afvalstoffen bij maatwerkvoorschrift eisen stellen
      aan de invulling van de procedures, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.14b
  - number: 2.15.1
    text: |-
      Degene die de inrichting drijft neemt alle energiebesparende maatregelen met een terugverdientijd van vijf jaar
      of minder of alle energiebesparende maatregelen die een positieve netto contante waarde hebben bij een interne
      rentevoet van 15%.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.15
  - number: 2.15.2
    text: |-
      Indien aannemelijk is dat niet wordt voldaan aan het eerste lid, kan het bevoegd gezag degene die de inrichting
      drijft waarvan het energieverbruik in enig kalenderjaar groter is dan 200.000 kilowatt uur aan elektriciteit of
      groter is dan 75.000 kubieke meter aardgasequivalenten aan brandstoffen, verplichten om binnen een door het bevoegd
      gezag te bepalen termijn, onderzoek te verrichten of te laten verrichten waaruit blijkt of aan het eerste lid wordt
      voldaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.15
  - number: 2.15.3
    text: |-
      Indien uit het onderzoek, bedoeld in het tweede lid, blijkt dat niet wordt voldaan aan het eerste lid, neemt degene
      die de inrichting drijft de in het eerste lid bedoelde maatregelen binnen een door het bevoegd gezag te bepalen
      redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.15
  - number: 2.15.4
    text: |-
      Het eerste lid is niet van toepassing indien het energiegebruik in de inrichting in enig kalenderjaar kleiner
      is dan 50.000 kilowatt uur aan elektriciteit en kleiner is dan 25.000 kubieke meter aardgasequivalenten aan
      brandstoffen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.15
  - number: 2.17.1
    text: |-
      Voor het langtijdgemiddelde beoordelingsniveau (L) en het maximaal geluidsniveau L, veroorzaakt door de in de
      inrichting aanwezige installaties en toestellen, alsmede door de in de inrichting verrichte werkzaamheden en
      activiteiten en laad- en losactiviteiten ten behoeve van en in de onmiddellijke nabijheid van de inrichting, geldt
      dat:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.1.a
    text: |-
      de niveaus op de in tabel 2.17a genoemde plaatsen en tijdstippen niet meer bedragen dan de in die tabel aangegeven
      waarden;
                Tabel 2.17a









