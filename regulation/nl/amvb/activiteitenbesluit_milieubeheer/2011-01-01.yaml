  - number: 6.38.1
    text: |-
      Indien [artikel 1.4][ref1] in werking treedt voor het tijdstip waarop de op grond van
      [artikel 8, achtste lid, van de Woningwet][ref2] te geven algemene maatregel van bestuur waarin voorschriften
      worden gegeven omtrent het brandveilig gebruik van bouwwerken, open erven en terreinen in werking treedt zijn het
      tweede tot en met vijfde lid van toepassing op het opslaan van brandbare stoffen op open erven of terreinen tot de
      datum van inwerkingtreding van die algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.38
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.1.2
        afdeling: '1.1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '8'
  - number: 6.38.2
    text: |-
      Bij de opslag van brandbare stoffen anders dan in een gebouw draagt degene die de inrichting drijft er zorg
      voor dat er bij brand geen onveilige situatie kan ontstaan voor een op een aangrenzend perceel gelegen of op
      dat perceel volgens het bestemmingsplan nog te realiseren gebouw dat op grond van het [Bouwbesluit 2003][ref1]
      een brandcompartiment of gedeelte van een brandcompartiment is, speeltuin, kampeerterrein als bedoeld in de
      [Wet op de openluchtrecreatie][ref2] of opslag van gevaarlijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012727
      [ref2]: https://wetten.overheid.nl/BWBR0006548
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.38
    references:
      - id: ref1
        bwb_id: BWBR0012727
      - id: ref2
        bwb_id: BWBR0006548
  - number: 6.38.3
    text: 'Aan het tweede lid wordt bij opslag van hout voldaan indien:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.38
  - number: 6.38.3.a
    text: |-
      de opslag bij brand geen grotere stralingsbelasting veroorzaakt dan 15 kilowatt per vierkante meter gedurende ten
      minste 60 minuten, gerekend vanaf het ontstaan van de brand;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.38
  - number: 6.38.3.b
    text: |-
      de bereikbaarheid van de opslag vanaf twee tegenover elkaar liggende zijden is gewaarborgd en de bereikbaarheid van
      ten minste één van de andere zijden indien die langer zijn dan 40 meter, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.38
  - number: 6.38.3.c
    text: |-
      bij of in de directe omgeving van de opslag een bluswatervoorziening aanwezig is die gedurende ten minste vier uren
      een toevoercapaciteit heeft van ten minste 90 kubieke meter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.38
  - number: 6.38.4
    text: 'De in het derde lid, onderdeel a, bedoelde stralingsbelasting wordt gemeten op:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.38
  - number: 6.38.4.a
    text: |-
      de naar de houtopslag toegekeerde uitwendige scheidingsconstructie van het op het aangrenzend perceel gelegen
      gebouw, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.38
  - number: 6.38.4.b
    text: |-
      de perceelsgrens, indien het aangrenzend perceel is ingericht als speeltuin of kampeerterrein of op dat aangrenzend
      perceel gevaarlijke stoffen zijn opgeslagen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.38
  - number: 6.38.5
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.38
  - number: '6.41'
    text: |-
      Indien een niet-publiekrechtelijke norm waarnaar in dit besluit wordt verwezen, de NeR of de NRB wijzigt kan bij
      ministeriële regeling overgangsrecht worden opgenomen waarbij kan worden bepaald dat de oude norm voor bestaande
      inrichtingen al dan niet tijdelijk blijft gelden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.41
  - number: '6.42'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt in overeenstemming met Onze Minister
      van Verkeer en Waterstaat binnen zes jaar na de inwerkingtreding van [artikel 2.1][ref1] aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van dit besluit in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.42
