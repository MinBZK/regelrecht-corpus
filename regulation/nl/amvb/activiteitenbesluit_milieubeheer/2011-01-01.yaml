        paragraaf: '6.5'
  - number: 2.21.1.a
    text: |-
      festiviteiten die bij of krachtens een gemeentelijke verordening zijn aangewezen, in de gebieden in de gemeente
      waarvoor de verordening geldt;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.21
  - number: 2.21.1.b
    text: |-
      andere festiviteiten die plaatsvinden in de inrichting, waarbij het aantal bij of krachtens een gemeentelijke
      verordening aan te wijzen dagen of dagdelen per gebied of categorie van inrichtingen kan verschillen en niet meer
      mag bedragen dan twaalf per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.21
  - number: 2.21.2
    text: |-
      Bij of krachtens gemeentelijke verordening kunnen voorwaarden worden verbonden aan de festiviteiten ter voorkoming
      of beperking van geluidhinder.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.21
  - number: 2.21.3
    text: |-
      Een festiviteit als bedoeld in het eerste lid die maximaal een etmaal duurt, maar die zowel voor als na 00.00 uur
      plaatsvindt, wordt beschouwd als plaatshebbende op één dag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.21
  - number: 2.22.1
    text: |-
      Bij het bepalen van het maximaal geluidsniveau L, bedoeld in de [artikelen 2.17][ref1], [2.19][ref2], [2.20][ref3]
      dan wel [6.12][ref4], blijft buiten beschouwing het geluid als gevolg van het uitrukken van motorvoertuigen ten
      behoeve van ongevallenbestrijding, brandbestrijding en gladheidbestrijding en het vrijmaken van de weg na een
      ongeval.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.22
    references:
