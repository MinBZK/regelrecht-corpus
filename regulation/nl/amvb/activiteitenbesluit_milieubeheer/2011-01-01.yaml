      In afwijking van [artikel 2.9][ref1] kan het bevoegd gezag op aanvraag bij maatwerkvoorschrift bepalen dat een
      aanvaardbaar bodemrisico kan worden gerealiseerd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 6.10.1.a
    text: voor de inwerkingtreding van artikel 2.9 binnen een inrichting een bodembedreigende activiteit werd uitgevoerd, of
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
  - number: 6.10.1.b
    text: |-
      onmiddellijk voorafgaand aan het van toepassing worden van [artikel 1.4, tweede of derde lid][ref1], binnen een
      inrichting een bodembedreigende activiteit werd uitgevoerd en voor die inrichting een vergunning in werking en
      onherroepelijk was.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.1.2
        afdeling: '1.1'
  - number: 6.10.2
    text: |-
      Een maatwerkvoorschrift als bedoeld in het eerste lid kan slechts worden gesteld indien het realiseren van een
      verwaarloosbaar bodemrisico redelijkerwijs niet kan worden gevergd en is voldaan aan het derde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
  - number: 6.10.3
    text: 'Bij de aanvraag, bedoeld in het eerste lid, wordt een plan van aanpak gevoegd, waarin ten minste is vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
  - number: 6.10.3.a
    text: de wijze waarop het risicobeperkende bodemonderzoek wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
  - number: 6.10.3.b
    text: |-
      de bodemkwaliteit op dat moment, zoals dat is onderzocht en vastgelegd door een persoon of een instelling die
      daartoe beschikt over een erkenning op grond van het [Besluit bodemkwaliteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 6.10.3.c
    text: |-
      de wijze waarop en de termijn waarbinnen eventueel optredende verontreiniging of aantasting van de bodem
      wordt hersteld door een persoon of instelling die daartoe beschikt over een erkenning op grond van het
      [Besluit bodemkwaliteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 6.10.3.d
    text: de kosten die daarvoor worden geraamd en de wijze waarop hiervoor financiële zekerheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
  - number: 6.10.4
    text: |-
      Het plan van aanpak, bedoeld in het derde lid, waarmee het bevoegd gezag heeft ingestemd maakt deel uit van het
      maatwerkvoorschrift.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
  - number: 6.10.5
    text: |-
      Onder een aanvaarbaar bodemrisico als bedoeld in het eerste lid wordt verstaan: een situatie als bedoeld in de NRB
      waarin een bodemrisico aanvaardbaar is gemaakt met risicobeperkend bodemonderzoek en door het anticiperen op het
      beperken en zoveel mogelijk ongedaan maken van eventueel optredende verontreiniging of aantasting van de bodem.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
  - number: 6.10.6
    text: |-
      Het risicobeperkend bodemonderzoek als bedoeld in het derde en vijfde lid, voldoet aan paragraaf 1.5 van onderdeel
      B1 van de NRB en wordt uitgevoerd door een persoon of instelling die daartoe beschikt over een erkenning op grond
      van het [Besluit bodemkwaliteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 6.12.1
    text: |-
      De waarden op de gevel van gevoelige gebouwen en de grens van gevoelige terreinen in tabel 2.17a worden met 5 dB(A)
      verhoogd indien onmiddellijk voorafgaand aan de inwerkingtreding van [artikel 2.17][ref1] op grond van een in het
      derde lid genoemd voorschrift hogere waarden golden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: 6.12.2
    text: |-
      Indien in een milieuvergunning die inwerking en onherroepelijk was op het tijdstip genoemd in het op de inrichting
      van toepassing geweest zijnde voorschrift, genoemd in het derde lid, lagere waarden dan de waarden, bedoeld in het
      eerste lid, waren vastgesteld, zijn die lagere waarden van toepassing.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.12
  - number: 6.12.3
    text: |-
      De voorschriften, bedoeld in het eerste en tweede lid zijn: [voorschrift 1.1.3 van
      de bijlage van het Besluit opslag- en transportbedrijven milieubeheer](onbekend),
      [voorschrift 1.1.5 van bijlage 2 van het Besluit detailhandel- en ambachtsbedrijven milieubeheer][ref1],
      [voorschrift 1.1.7 van de bijlage van het Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer]
      (onbekend), [voorschrift 1.1.3 van de bijlage van het Besluit bouw- en houtbedrijven milieubeheer](onbekend),
      [voorschrift 1.1.5 van de bijlage van het Besluit woon- en verblijfsgebouwen milieubeheer](onbekend),
      [voorschrift 1.1.3 van bijlage 2 van het Besluit voorzieningen- en installaties milieubeheer][ref2],
      [voorschrift 1.1.3 van bijlage 1 van het Besluit textielreinigingsbedrijven milieubeheer][ref3],
      [voorschrift 1.1.3 van de bijlage van het Besluit inrichtingen voor motorvoertuigen milieubeheer]
      (onbekend), [voorschrift 3.2 van bijlage 2 van het Besluit tankstations milieubeheer][ref4] en
      [voorschrift 4.2.1 van bijlage 1 van het Besluit tandartspraktijken milieubeheer][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009935
      [ref2]: https://wetten.overheid.nl/BWBR0012897
      [ref3]: https://wetten.overheid.nl/BWBR0012328
      [ref4]: https://wetten.overheid.nl/BWBR0006423
      [ref5]: https://wetten.overheid.nl/BWBR0008877
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0009935
      - id: ref2
        bwb_id: BWBR0012897
      - id: ref3
        bwb_id: BWBR0012328
      - id: ref4
        bwb_id: BWBR0006423
      - id: ref5
        bwb_id: BWBR0008877
  - number: 6.13.1
    text: |-
      De etmaalwaarde die het bevoegd gezag vaststelt op grond van [artikel 2.20, eerste lid][ref1], is niet lager dan 40
      dB(A) voor een inrichting:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.13
    references:
