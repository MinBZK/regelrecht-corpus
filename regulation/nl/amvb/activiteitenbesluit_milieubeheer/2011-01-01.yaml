  - number: '4.43'
    text: |-
      Bij het lassen van metalen worden ten behoeve van het voorkomen dan wel beperken van diffuse emissies en het
      doelmatig verspreiden van emissies naar de buitenlucht de bij ministeriële regeling te bepalen maatregelen
      toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.43
  - number: 4.44.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij solderen de emissieconcentratie van totaal stof niet
      meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.44
