  - number: 6.1.4
    text: |-
      Voor de toepassing van dit artikel worden de gegevens die in de aanvraag staan en die geacht worden onderdeel
      te zijn van de voorschriften van de vergunning, bedoeld in het eerste lid, aangemerkt als voorschriften van de
      vergunning.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.1
  - number: 6.2.1
    text: |-
      Voor het lozen vanuit een inrichting type A of B, waarvoor onmiddellijk voorafgaand aan het tijdstip van
      het van toepassing worden van [artikel 1.4, eerste of tweede lid][ref1], op die inrichting een vergunning op
      grond van [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref2] dan wel een vergunning op grond van
      [artikel 6.2 van de Waterwet][ref3] in werking en onherroepelijk was, worden de voorschriften van die vergunning
      gedurende drie jaar na het tijdstip van het van toepassing worden van [artikel 1.4, eerste of tweede lid][ref4],
      op die inrichting aangemerkt als maatwerkvoorschriften, mits de voorschriften van die vergunning vallen binnen de
      bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
