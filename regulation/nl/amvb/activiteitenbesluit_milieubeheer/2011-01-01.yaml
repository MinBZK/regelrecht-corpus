        afdeling: '2.10'
  - number: 3.1.1
    text: |-
      Deze paragraaf is van toepassing op een saneringsonderzoek en een bodemsanering in de zin van de
      [Wet bodembescherming][ref1]. Bij het lozen van grondwater vanuit een proefbronnering in het kader van een
      saneringsonderzoek of vanuit een bodemsanering wordt ten minste voldaan aan het tweede tot en met het negende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0003994
  - number: 3.1.2
    text: |-
      Het lozen, bedoeld in het eerste lid, in een aangewezen oppervlaktewaterlichaam of in een voorziening voor de
      inzameling en het transport van afvalwater, niet zijnde een vuilwaterriool, is toegestaan, indien bij het lozen:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.2.a
    text: het zuurstofgehalte ten minste 5 milligram per liter bedraagt;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.2.b
    text: geen visuele verontreiniging plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.1
  - number: 3.1.2.c
    text: |-
      in enig steekmonster de emissiegrenswaarden van tabel 3.1a niet worden overschreden.
