  - number: 4.47.1
    text: |-
      Op verzoek van het bevoegd gezag overlegt degene die de inrichting drijft waar metalen worden gesoldeerd informatie
      ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.47
  - number: 4.47.1.a
    text: |-
      de samenstelling en het jaarverbruik van de verschillende vloeimiddelen en soldeermaterialen, gesorteerd naar de
      verschillende procesvormen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.47
  - number: 4.47.1.b
    text: een overzicht van de aard en omvang van de gasvormige emissies naar de lucht die bij het solderen vrijkomen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.47
  - number: 4.47.2
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing indien het jaarverbruik van vloeimiddelen niet meer bedraagt
      dan 100 kilogram.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.47
  - number: '4.48'
    text: |-
      Bij het solderen van metalen worden ten behoeve van het voorkomen dan wel beperken van diffuse emissies en het
      doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling te bepalen maatregelen
      toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.48
  - number: 4.49.1
    text: Het is verboden om in de buitenlucht straalwerkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.49
  - number: 4.49.2
    text: |-
      Het eerste lid is niet van toepassing indien het niet mogelijk is om in het inpandige deel van de inrichting te
      stralen vanwege de omvang van het te stralen object.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.49
  - number: 4.49.3
    text: |-
      Bij het stralen in de buitenlucht wordt ten behoeve van het voorkomen van stofhinder voldaan aan bij ministeriële
      regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.49
  - number: 4.50.1
    text: |-
      Onverminderd de [artikelen 2.5 tot en met 2.6][ref1] is bij straalwerkzaamheden de emissieconcentratie van:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.50
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.50.1.a
    text: |-
      totaal stof niet meer dan 5 milligram per normaal kubieke meter, indien de massastroom van totaal stof naar de
      lucht gelijk is aan of groter is dan 200 gram per uur, en niet meer dan 50 milligram per normaal kubieke meter
      indien de massastroom kleiner is dan 200 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.50
  - number: 4.50.1.b
    text: |-
      MVP1 stoffen niet meer dan 0,05 milligram per normaal kubieke meter, indien de massastroom van de MVP1 stoffen naar
      de lucht groter is dan 0,15 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.50
  - number: 4.50.1.c
    text: |-
      sA.1 stoffen niet meer dan 0,05 milligram per normaal kubieke meter, indien de massastroom van de sA.1 stoffen naar
      de lucht groter is dan 0,25 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.50
  - number: 4.50.1.d
    text: |-
      sA.2 stoffen niet meer dan 0,5 milligram per normaal kubieke meter, indien de massastroom van de sA.2 stoffen naar
      de lucht groter is dan 2,5 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.50
  - number: 4.50.1.e
    text: |-
      sA.3 stoffen niet meer dan 5,0 milligram per normaal kubieke meter, indien de massastroom van de sA.3 stoffen naar
      de lucht groter is dan 10 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.50
  - number: 4.50.1.f
    text: |-
      sO stoffen niet meer dan 5,0 milligram per normaal kubieke meter, indien de massastroom van de sO stoffen naar
      de lucht gelijk is aan of groter is dan 100 gram per uur, en niet meer dan 50 milligram per normaal kubieke meter
      indien de massastroom kleiner is dan 100 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.50
  - number: 4.50.2
    text: |-
      Het eerste lid is niet van toepassing indien de straalwerkzaamheden op grond van [artikel 4.49, tweede lid][ref1],
      in de buitenlucht worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.50
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.4
        afdeling: '4.5'
  - number: 4.50.3
    text: |-
      Bij het stralen van metalen worden ten behoeve van het voorkomen dan wel beperken van diffuse emissies en het
      doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling te bepalen maatregelen
      toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.50
  - number: '4.51'
    text: |-
      Bij het stralen van metalen wordt ten behoeve van het realiseren van een verwaarloosbaar bodemrisico, voldaan aan
      de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.51
  - number: '4.52'
    text: |-
      In deze paragraaf wordt onder het reinigen van metalen niet verstaan het wassen van motorvoertuigen of carrosserie-
      onderdelen daarvan als bedoeld in [artikel 3.23a][ref1] en het afspuiten van pleziervaartuigen als bedoeld in
      [paragraaf 4.6.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0022762
        hoofdstuk: '4'
        paragraaf: 4.6.6
        afdeling: '4.6'
  - number: 4.53.1
    text: |-
      Het is verboden om in de buitenlucht metalen met behulp van een nevelspuit te coaten of te lijmen dan wel met
      behulp van een nevelspuit te reinigen met vluchtige organische stoffen houdende producten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.53
  - number: 4.53.2
    text: |-
      Het eerste lid is niet van toepassing indien het niet mogelijk is om deze activiteiten in het inpandige deel van de
      inrichting te verrichten vanwege de omvang van het te bewerken object.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.53
  - number: 4.54.1
    text: |-
      Onverminderd de [artikelen 2.5 tot en met 2.6][ref1] is bij het aanbrengen van coating of lijmlagen de
      emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.54
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.54.1.a
    text: |-
      5 milligram per normaal kubieke meter, indien de massastroom van totaal stof naar de lucht gelijk is aan of groter
      is dan 200 gram per uur; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.54
  - number: 4.54.1.b
    text: 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.54
  - number: 4.54.2
    text: |-
      Het eerste lid is niet van toepassing indien het coaten op grond van [artikel 4.53, tweede lid][ref1], in de
      buitenlucht plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.54
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.5
        afdeling: '4.5'
  - number: 4.55.1
    text: |-
      Degene die de inrichting drijft neemt bij het reinigen, coaten of lijmen van metalen voorwerpen met betrekking tot
      vluchtige organische stoffen de bij ministeriële regeling gestelde emissiereducerende maatregelen tenzij deze niet
      kosteneffectief of technisch uitvoerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.55
  - number: 4.55.2
    text: |-
      Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de in
      het eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar, zoals dat blijkt uit de
      oplosmiddelenboekhouding als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.55
  - number: 4.55.3
    text: |-
      Degene die een inrichting drijft als bedoeld in het eerste lid, voert een oplosmiddelenboekhouding waarin het
      verbruik van vluchtige organische stoffen per kilogram per jaar wordt geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.55
  - number: 4.55.4
    text: |-
      Het eerste en derde lid is niet toepassing op het verbruik van vluchtige organische stoffen waarvan het in de handel
      brengen is gereguleerd door het [Besluit organische oplosmiddelen in verven en vernissen milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019122
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.55
    references:
      - id: ref1
        bwb_id: BWBR0019122
  - number: 4.55.5
    text: |-
      De oplosmiddelenboekhouding, bedoeld in het derde lid, wordt ten minste drie jaar in de inrichting bewaard en ter
      inzage gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.55
  - number: 4.55.6
    text: |-
      Indien de drempelwaarden, genoemd in
      [bijlage IIa van het Oplosmiddelenbesluit omzetting EG-VOS-richtlijn milieubeheer][ref1] worden overschreden, zijn
      het eerste tot en met vijfde lid niet van toepassing en is dat besluit van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.55
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: '4.56'
    text: 'Bij het reinigen, coaten en lijmen van metalen worden ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.56
  - number: 4.56.a
    text: het voorkomen dan wel beperken van diffuse emissies;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.56
  - number: 4.56.b
    text: het voorkomen dan wel beperken van stofhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.56
  - number: 4.56.c
    text: het doelmatig verspreiden van emissies naar de buitenlucht;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.56
  - number: 4.56.d
    text: het voorkomen dan wel beperken van geurhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.56
  - number: 4.56.e
    text: het realiseren van een verwaarloosbaar bodemrisico,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.56
  - number: 4.57.1
    text: Het is verboden om in de buitenlucht anorganische deklagen op metalen aan te brengen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.57
  - number: 4.57.2
    text: |-
      Het eerste lid is niet van toepassing op schooperen indien het niet mogelijk is om deze werkzaamheden in het
      inpandige deel van de inrichting uit te voeren vanwege de omvang van het te bewerken object.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.57
  - number: '4.58'
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het aanbrengen van anorganische deklagen op metalen de
      emissieconcentratie van:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.58
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.58.a
    text: |-
      totaal stof niet meer dan 5 milligram per normaal kubieke meter, indien de massastroom van totaal stof naar de
      lucht gelijk is aan of groter is dan 200 gram per uur, en niet meer dan 50 milligram per normaal kubieke meter
      indien de massastroom van totaal stof naar de lucht kleiner is dan 200 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.58
  - number: 4.58.b
    text: |-
      MVP1 stoffen niet meer dan 0,05 milligram per normaal kubieke meter, indien de massastroom van de MVP1 stoffen naar
      de lucht groter is dan 0,15 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.58
  - number: 4.58.c
    text: |-
      sA.1 stoffen niet meer dan 0,05 milligram per normaal kubieke meter, indien de massastroom van de sA.1 stoffen naar
      de lucht groter is dan 0,25 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.58
  - number: 4.58.d
    text: |-
      sA.2 stoffen niet meer dan 0,5 milligram per normaal kubieke meter, indien de massastroom van de sA.2 stoffen naar
      de lucht groter is dan 2,5 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.58
  - number: 4.58.e
    text: |-
      sA.3 stoffen niet meer dan 5,0 milligram per normaal kubieke meter, indien de massastroom van de sA.3 stoffen naar
      de lucht groter is dan 10 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.58
  - number: 4.58.f
    text: |-
      sO stoffen niet meer dan 5,0 milligram per normaal kubieke meter, indien de massastroom van de sO stoffen naar de
      lucht gelijk is of groter is dan 100 gram per uur, en niet meer dan 50 milligram per normaal kubieke meter indien
      de massastroom kleiner is dan 100 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.58
  - number: '4.59'
    text: 'Bij het aanbrengen van anorganische deklagen van metaal worden ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.59
  - number: 4.59.a
    text: het voorkomen dan wel beperken van diffuse emissies;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.59
  - number: 4.59.b
    text: het voorkomen dan wel beperken van stofhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.59
  - number: 4.59.c
    text: het doelmatig verspreiden van emissies naar de buitenlucht;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.59
  - number: 4.59.d
    text: het voorkomen dan wel beperken van geurhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.59
  - number: 4.59.e
    text: het realiseren van een verwaarloosbaar bodemrisico,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.59
  - number: 4.60.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het beitsen en etsen van metalen en metalen voorwerpen
      de emissieconcentratie van:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.60
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.60.1.a
    text: |-
      waterstoffluoride niet meer dan 3 milligram per normaal kubieke meter indien de massastroom van waterstoffluoride
      naar de lucht groter is dan 15 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.60
  - number: 4.60.1.b
    text: |-
      zoutzuur niet meer dan 10 milligram per normaal kubieke meter indien de massastroom van zoutzuur naar de lucht
      groter is dan 150 gram per uur, tenzij de concentratie aan zoutzuur in de ongereinigde massastroom kleiner is dan 1
      gram per normaal kubieke meter in welk geval de emissieconcentratie van zoutzuur niet meer is dan 30 milligram per
      normaal kubieke meter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.60
  - number: 4.60.1.c
    text: |-
      salpeterzuur niet meer dan 30 milligram per normaal kubieke meter indien de massastroom van salpeterzuur groter is
      dan 150 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.60
  - number: 4.60.1.d
    text: |-
      zwavelzuur niet meer dan 3 milligram per normaal kubieke meter indien de massastroom van zwavelzuur groter is dan
      15 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.60
  - number: 4.60.1.e
    text: |-
      azijnzuur niet meer dan 50 milligram per normaal kubieke meter indien de massastroom van azijnzuur groter is dan
      500 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.60
  - number: 4.60.2
    text: |-
      Bij het beitsen en etsen van metalen worden ten behoeve van het voorkomen dan wel beperken van diffuse emissies
      en het doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling te bepalen maatregelen
      toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.60
  - number: '4.61'
    text: |-
      Bij het beitsen en etsen van metalen wordt ten behoeve van het realiseren van een verwaarloosbaar bodemrisico,
      voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.61
  - number: 4.62.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het elektrolytisch en stroomloos aanbrengen van chroom
      en cadmiumlagen de emissieconcentratie van:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.62
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.62.1.a
    text: |-
      chroom VI-verbindingen, berekend als chroom, niet meer dan 0,1 milligram per normaal kubieke meter indien de
      massastroom van chroom VI-verbindingen naar de lucht, berekend als chroom, groter is dan 0,5 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.62
  - number: 4.62.1.b
    text: |-
      cadmium en cadmiumverbindingen niet meer dan 0,05 milligram per normaal kubieke meter indien de massastroom van
      cadmium en cadmiumverbindingen groter is dan 0,25 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.62
  - number: 4.62.2
    text: |-
      Bij het elektrolytisch en stroomloos aanbrengen van metaallagen op metalen worden ten behoeve van het voorkomen dan
      wel beperken van diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht de bij ministeriële
      regeling te bepalen maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.62
  - number: '4.63'
    text: |-
      Bij het elektrolytisch en stroomloos aanbrengen van metaallagen wordt ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.63
  - number: 4.64.1
    text: Bij het drogen van metalen is het gebruik van oplosmiddelen niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.64
  - number: 4.64.2
    text: |-
      Indien degene die de inrichting drijft aantoont dat het niet mogelijk is om anders te drogen dan met behulp
      van oplosmiddelen kan het bevoegd gezag bij maatwerkvoorschrift het eerste lid niet van toepassing verklaren en
      het gebruik van oplosmiddelen bij het drogen van metalen onder voorwaarden toestaan. Deze voorwaarden beogen de
      nadelige gevolgen van het drogen met behulp van oplosmiddelen te voorkomen of indien dat niet mogelijk is, zoveel
      mogelijk te beperken voor zover dat redelijkerwijs mogelijk is. Daarbij wordt ervan uitgegaan dat in de inrichting
      ten minste de voor de inrichting in aanmerking komende beste beschikbare technieken worden toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.64
  - number: 4.65.1
    text: |-
      Onverminderd de [artikelen 2.5 tot en met 2.6][ref1] is bij het chroomzuuranodiseren en het zwavelzuuranodiseren de
      emissieconcentratie van:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.65
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.65.1.a
    text: |-
      chroom VI-verbindingen berekend als chroom, niet meer dan 0,1 milligram per normaal kubieke meter indien de
      massastroom van chroom VI-verbindingen naar de lucht berekend als chroom, groter is dan 0,5 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.65
  - number: 4.65.1.b
    text: |-
      zwavelzuur niet meer dan 3 milligram per normaal kubieke meter indien de massastroom van zwavelzuur naar de lucht
      groter is dan 15 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.65
  - number: 4.65.2
    text: |-
      Bij het aanbrengen van conversielagen op metalen worden ten behoeve van het voorkomen dan wel beperken van diffuse
      emissies en het doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling te bepalen
      maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.65
  - number: '4.66'
    text: Het gebruik van perfluoroctaansulfonaten bij anodiseren is verboden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.66
  - number: '4.67'
    text: |-
      Bij het aanbrengen van conversielagen op metalen wordt ten behoeve van het realiseren van een verwaarloosbaar
      bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.67
  - number: 4.68.1
    text: |-
      Onverminderd de [artikelen 2.5 tot en met 2.6][ref1] is bij het thermisch aanbrengen van metaallagen op metalen:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.68
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.68.1.a
    text: |-
      de emissieconcentratie van totaal stof niet meer dan 5 milligram per normaal kubieke meter, indien de massastroom
      van totaal stof naar de lucht gelijk is aan of groter is dan 200 gram per uur, en niet meer dan 50 milligram per
      normaal kubieke meter indien de massastroom naar de lucht kleiner is dan 200 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.68
  - number: 4.68.1.b
    text: |-
      de emissieconcentratie van zinkchloride niet meer dan 5,0 milligram per normaal kubieke meter, indien de
      massastroom van zinkchloride naar de lucht groter is dan 10 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.68
  - number: 4.68.1.c
    text: |-
      de emissieconcentratie van chloorverbindingen, niet zijnde zinkchloride, niet meer dan 30 milligram per normaal
      kubieke meter, indien de massastroom van chloorverbindingen naar de lucht groter is dan 150 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.68
  - number: 4.68.2
    text: |-
      Bij het thermisch aanbrengen van metaallagen op metalen worden ten behoeve van het voorkomen dan wel beperken van
      diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling te
      bepalen maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.68
  - number: '4.69'
    text: |-
      Bij het thermisch aanbrengen van metaallagen op metalen wordt ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.69
  - number: '4.70'
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van de activiteiten genoemd in de
      [paragrafen 4.5.1 tot en met 4.5.11][ref1] wordt ten minste voldaan aan de [artikelen 4.71 tot en met 4.74][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.70
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.12
        afdeling: '4.5'
  - number: 4.71.1
    text: Het afvalwater bevat in enig steekmonster niet meer dan 20 milligram olie per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.71
  - number: 4.71.2
    text: |-
      In afwijking van het eerste lid bedraagt het gehalte aan olie ten hoogste 200 milligram per liter in enig
      steekmonster indien het afvalwater wordt geleid door een olie-afscheider die voldoet aan en wordt gebruikt conform
      NEN-EN 858-1 en 2.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.71
  - number: 4.71.3
    text: Het te lozen afvalwater, bedoeld in het eerste en het tweede lid, kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.71
  - number: 4.72.1
    text: Het lozen van metalen en hulpstoffen wordt beperkt door toepassing van beste beschikbare technieken.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.72
  - number: 4.72.2
    text: Het gebruik van kwik is verboden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.72
  - number: 4.72.3
    text: |-
      Ter beperking van het lozen van metalen en hulpstoffen wordt ten minste voldaan aan de bij ministeriële regeling te
      stellen eisen daaromtrent.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.72
  - number: 4.73.1
    text: |-
      Onverminderd [artikel 4.72][ref1] worden bij het lozen van afvalwater dat vrijkomt bij een of meer processen als
      bedoeld in de [paragrafen 4.5.7][ref2], [4.5.8][ref3], [4.5.10][ref4] en [4.5.11][ref5], de emissiegrenswaarden
      genoemd in kolom A van tabel 4.73 niet overschreden.
