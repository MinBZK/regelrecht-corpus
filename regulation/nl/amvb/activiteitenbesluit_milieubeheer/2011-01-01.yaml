        bwb_id: BWBR0022762
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 2.22.2
    text: |-
      Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot het treffen van technische en
      organisatorische maatregelen ten aanzien van het uitrukken van motorvoertuigen bij ongevallenbestrijding,
      brandbestrijding en gladheidbestrijding, indien dat bijzonder is aangewezen in het belang van het milieu.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.22
  - number: 2.23.1
    text: |-
      Trillingen, veroorzaakt door de tot de inrichting behorende installaties of toestellen alsmede de tot de inrichting
      toe te rekenen werkzaamheden of andere activiteiten, bedragen in geluidsgevoelige ruimten en verblijfsruimten, met
      uitzondering van geluidsgevoelige ruimten en verblijfsruimten gelegen op een gezoneerd industrieterrein, niet meer
      dan de trillingsterkte, genoemd in tabel 2 van de Meet- en beoordelingsrichtlijn deel B «Hinder voor personen in
      gebouwen» van de Stichting Bouwresearch Rotterdam, voor de gebouwfunctie wonen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.23
  - number: 2.23.2
    text: |-
      De waarden gelden niet indien de gebruiker van de geluidsgevoelige ruimten of verblijfsruimten geen toestemming
      geeft voor het in redelijkheid uitvoeren of doen uitvoeren van trillingmetingen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.23
  - number: 2.23.3
    text: |-
      Het bevoegd gezag kan bij maatwerkvoorschrift het eerste lid niet van toepassing verklaren en een andere
      trillingsterkte toelaten. Deze trillingsterkte is niet lager dan de streefwaarden die zijn gedefinieerd voor de
      gebouwfunctie wonen in de Meet- en beoordelingsrichtlijn deel B «Hinder voor personen in gebouwen» van de Stichting
      Bouwresearch Rotterdam.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.23
  - number: 2.24.1
    text: |-
      Degene die een inrichting drijft waarin vloeibare brandstof of afgewerkte olie in een ondergrondse tank wordt
      opgeslagen stelt door verzekering of anderszins financiële zekerheid ter dekking van de aansprakelijkheid die
      voortvloeit uit verontreiniging van de bodem als gevolg van dat opslaan of het drijven van het tankstation. De
      eerste volzin is niet van toepassing op het Rijk.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.24
  - number: 2.24.2
    text: |-
      De zekerheid bedraagt € 225.000 per ondergrondse tank. Bij meer dan zes ondergrondse tanks bedraagt de zekerheid in
      totaal € 1.361.340,65.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.24
  - number: 2.24.3
    text: |-
      De zekerheid wordt in stand gehouden vanaf het tijdstip waarop het opslaan aanvangt tot vier weken na toezending
      van een rapport als bedoeld in [artikel 2.11, derde lid][ref1], aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 2.24.4
    text: |-
      Indien uit een rapport als bedoeld in [artikel 2.11, derde lid][ref1], blijkt dat de bodem met vloeibare brandstof
      of met afgewerkte olie is verontreinigd, wordt, in afwijking van het derde lid, de financiële zekerheid in stand
      gehouden tot het tijdstip waarop gedeputeerde staten aan degene die opslaat of een tankstation voor het wegverkeer
      drijft, schriftelijk hebben verklaard dat de door hen nodig geachte maatregelen zijn genomen. Degene die opslaat
      of een tankstation voor het wegverkeer drijft, kan gedeputeerde staten schriftelijk verzoeken om een verklaring als
      bedoeld in de eerste volzin. Gedeputeerde staten beslissen op het verzoek uiterlijk vier weken nadat het verzoek
      is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: '2.25'
    text: |-
      Degene die een inrichting drijft waarin vloeibare brandstof of afgewerkte olie in een ondergrondse tank wordt
      opgeslagen, legt binnen acht weken nadat hij met deze activiteit is aangevangen aan het bevoegd gezag schriftelijk
      bewijsstukken over, waaruit blijkt dat:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.25
  - number: 2.25.a
    text: |-
      wordt voldaan aan [artikel 2.24, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.10'
  - number: 2.25.b
    text: |-
      voor zover sprake is van het drijven van een tankstation voor het wegverkeer kan worden voldaan aan
      [artikel 2.24, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.10'
  - number: 2.25.c
    text: |-
      degene die contractueel instaat voor de financiële dekking van de aansprakelijkheid, bedoeld in
      [artikel 2.24, eerste lid][ref1], voor zover sprake is van het drijven van een tankstation voor het wegverkeer,
      het bevoegd gezag zo spoedig mogelijk schriftelijk in kennis zal stellen van het tijdstip waarop die zekerheid
      is of zal komen te vervallen, alsmede van de opneming van uitsluitingen en andere fundamentele wijzigingen in de
      afgesloten overeenkomst die de gestelde zekerheid inperken; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.10'
  - number: 2.25.d
    text: |-
      de persoon, bedoeld in onderdeel b, tot een jaar na de in dat onderdeel bedoelde schriftelijke kennisgeving garant
      staat voor herstel of vergoeding van schade die is ontstaan tijdens de looptijd van de financiële zekerheid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.25
  - number: '2.26'
    text: |-
      Degene die een tankstation voor het wegverkeer drijft, draagt er zorg voor dat de vorm van de financiële zekerheid
      en de hoedanigheid van degene die contractueel instaat voor de financiële dekking van de aansprakelijkheid,
      bedoeld in [artikel 2.24, eerste lid][ref1], niet wordt gewijzigd dan nadat aan het bevoegd gezag een schriftelijk
      bewijsstuk is overgelegd, waaruit blijkt dat de gewijzigde financiële zekerheid voldoet aan [artikel 2.24][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.10'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.10'
  - number: '2.27'
    text: |-
      Burgemeester en wethouders van de gemeenten Amsterdam, 's-Gravenhage, Rotterdam en Utrecht, van gemeenten
      die zijn aangewezen krachtens [artikel 88, negende lid, van de Wet bodembescherming][ref1], en een regionaal
      openbaar bestuur als bedoeld in de [Kaderwet bestuur in verandering][ref2], treden voor de toepassing van
      [artikel 2.24, vierde lid][ref3], in de plaats van gedeputeerde staten. Een regionaal openbaar lichaam als
      bedoeld in de vorige volzin treedt slechts in de plaats van gedeputeerde staten, indien de in dit artikel bedoelde
      bevoegdheden bij die algemene maatregel van bestuur zijn overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006620
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.27
    references:
      - id: ref1
