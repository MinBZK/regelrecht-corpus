                        L op de gevel van gevoelige gebouwen


                        50 dB(A)


                        40 dB(A)




                        L op de gevel van gevoelige gebouwen


                        70 dB(A)


                        60 dB(A)
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.4.c
    text: de in tabel 2.17d aangegeven waarden op de gevel ook gelden bij gevoelige terreinen op de grens van het terrein;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.4.d
    text: |-
      indien de inrichting is gelegen op een gezoneerd industrieterrein en binnen een afstand van 50 meter geen gevoelige
      objecten, anders dan gevoelige objecten gelegen op het gezoneerde industrieterrein zijn gelegen, de waarden van het
      langtijdgemiddelde beoordelingsniveau (L) uit tabel 2.17d gelden op een afstand van 50 meter vanaf de grens van de
      inrichting; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.4.e
    text: |-
      de in tabel 2.17d aangegeven waarden niet gelden op gevoelige objecten die zijn gelegen op een gezoneerd
      industrieterrein.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.18.1
    text: |-
      Bij het bepalen van de geluidsniveaus, bedoeld in de [artikelen 2.17][ref1], [2.19][ref2], [2.20][ref3] dan wel
      [6.12][ref4], blijft buiten beschouwing:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
      - id: ref4
        bwb_id: BWBR0022762
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 2.18.1.a
    text: |-
      het stemgeluid van personen op een onverwarmd en onoverdekt terrein, dat onderdeel is van de inrichting, tenzij dit
      terrein kan worden aangemerkt als een binnenterrein;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.1.b
    text: het stemgeluid van bezoekers op het open terrein van een inrichting voor sport- of recreatieactiviteiten;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.1.c
    text: |-
      het geluid ten behoeve van het oproepen tot het belijden van godsdienst of levensovertuiging of het bijwonen van
      godsdienstige of levensbeschouwelijke bijeenkomsten en lijkplechtigheden, alsmede geluid in verband met het houden
      van deze bijeenkomsten of plechtigheden;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.1.d
    text: |-
      het geluid van het traditioneel ten gehore brengen van muziek tijdens het hijsen en strijken van de nationale vlag
      bij zonsopkomst en zonsondergang op militaire inrichtingen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.1.e
    text: |-
      het ten gehore brengen van muziek vanwege het oefenen door militaire muziekcorpsen in de buitenlucht gedurende de
      dagperiode met een maximum van twee uren per week op militaire inrichtingen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.1.f
    text: |-
      het ten gehore brengen van onversterkte muziek tenzij en voor zover daarvoor bij gemeentelijke verordening regels
      zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.1.g
    text: het traditioneel schieten, tenzij en voor zover daarvoor bij gemeentelijke verordening regels zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.1.h
    text: |-
      het stemgeluid van kinderen op een onverwarmd of onoverdekt terrein dat onderdeel is van een inrichting voor
      primair onderwijs, in de periode vanaf een uur voor aanvang van het onderwijs tot een uur na beëindiging van het
      onderwijs;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.1.i
    text: |-
      het stemgeluid van kinderen op een onverwarmd of onoverdekt terrein dat onderdeel is van een instelling voor
      kinderopvang.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.2
    text: |-
      Bij het bepalen van de geluidsniveaus, bedoeld in [artikel 2.17][ref1] wordt voor muziekgeluid geen
      bedrijfsduurcorrectie toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: 2.18.3
    text: |-
      Bij het bepalen van het maximaal geluidsniveau (L), bedoeld in [artikel 2.17][ref1] blijft buiten beschouwing het
      geluid als gevolg van:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: 2.18.3.a
    text: |-
      het komen en gaan van bezoekers bij inrichtingen waar uitsluitend of in hoofdzaak horeca-, sport- en
      recreatieactiviteiten plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.3.b
    text: het verrichten in de open lucht van sportactiviteiten of activiteiten die hiermee in nauw verband staan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.4
    text: |-
      De maximale geluidsniveaus (L), bedoeld in [artikel 2.17][ref1] zijn tussen 23.00 en 7.00 uur niet van toepassing
      ten aanzien van aandrijfgeluid van motorvoertuigen bij laad- en losactiviteiten indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
  - number: 2.18.4.a
    text: |-
      degene die de inrichting drijft aantoont dat het maximaal geluidsniveau (L), genoemd in tabel 2.17a, niet te
      bereiken is door het treffen van maatregelen; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.4.b
    text: het niveau van het aandrijfgeluid op een afstand van 7,5 meter van het motorvoertuig niet hoger is van 65dB(A).
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.5
    text: |-
      Bij gemeentelijke verordening kunnen ten behoeve van het voorkomen van geluidhinder regels worden gesteld met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.5.a
    text: het ten gehore brengen van onversterkte muziek, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.18.5.b
    text: het traditioneel schieten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.18
  - number: 2.20.1
    text: |-
      In afwijking van de waarden, bedoeld in de [artikelen 2.17][ref1], [2.19][ref2] dan wel [6.12][ref3], kan het
      bevoegd gezag bij maatwerkvoorschrift andere waarden voor het langtijdgemiddeld beoordelingsniveau (L) en het
      maximaal geluidsniveau L vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 2.20.2
    text: |-
      Het bevoegd gezag kan slechts hogere waarden vaststellen dan de waarden, bedoeld in de [artikelen 2.17][ref1],
      [2.19][ref2] dan wel [6.12][ref3], indien binnen geluidsgevoelige ruimten dan wel verblijfsruimten van gevoelige
      gebouwen, die zijn gelegen binnen de akoestische invloedssfeer van de inrichting, een etmaalwaarde van maximaal 35
      dB(A) wordt gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 2.20.3
    text: |-
      De in het tweede lid bedoelde etmaalwaarde is niet van toepassing indien de gebruiker van deze gevoelige gebouwen
      geen toestemming geeft voor het in redelijkheid uitvoeren of doen uitvoeren van geluidsmetingen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.20
  - number: 2.20.4
    text: |-
      Het bevoegd gezag kan maatwerkvoorschriften stellen over de plaats waar de waarden, bedoeld in de
      [artikelen 2.17][ref1], [2.19][ref2] dan wel [6.12][ref3], voor een inrichting gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.8'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 2.20.5
    text: |-
      Het bevoegd gezag kan bij maatwerkvoorschrift bepalen welke technische voorzieningen in de inrichting worden
      aangebracht en welke gedragsregels in acht worden genomen teneinde aan geldende geluidsnormen te voldoen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.20
  - number: 2.20.6
    text: |-
      In afwijking van de waarden, bedoeld in de [artikelen 2.17][ref1], [2.19][ref2] dan wel [6.12][ref3] kan het
      bevoegd gezag bij maatwerkvoorschrift voor bepaalde activiteiten in een inrichting, anders dan festiviteiten als
      bedoeld in [artikel 2.21][ref4], andere waarden voor het langtijdgemiddeld beoordelingsniveau (L) en het maximaal
      geluidsniveau L vaststellen. Het bevoegd gezag kan daarbij voorschriften vaststellen met betrekking tot de duur
      van de activiteiten, het treffen van maatregelen, de tijdstippen waarop de activiteiten plaatsvinden of het vooraf
      melden per keer dat de activiteit plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.20
