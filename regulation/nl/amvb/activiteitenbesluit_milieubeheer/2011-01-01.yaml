      [artikel 4.94a][ref1][paragraaf 4.7.3][ref2] van toepassing was, is dat artikel van toepassing met ingang van de
      dag waarop twaalf maanden zijn verstreken na die inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.34a
