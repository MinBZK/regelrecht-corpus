        paragraaf: 4.6.3
        afdeling: '4.6'
  - number: 6.33a.2
    text: |-
      In het belang van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan kan het bevoegd gezag bij maatwerkvoorschrift eisen stellen aan de locatie van een
      bunkerstation of een op de wal geplaatste vaste afleverinstallatie als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.33a
  - number: 6.34.1
    text: |-
      [Artikel 4.80, eerste lid][ref1], is tot vijf jaar na de inwerkingtreding van [dat artikel][ref2] niet
      van toepassing op afleverinstallaties van benzine, anders dan bedoeld in de [artikelen 3.17][ref3],
      [4.77 tot en met 4.79][ref4], voor motorvoertuigen voor het wegverkeer die onmiddellijk voorafgaand aan de
      inwerkingtreding van dat lid aanwezig waren.


