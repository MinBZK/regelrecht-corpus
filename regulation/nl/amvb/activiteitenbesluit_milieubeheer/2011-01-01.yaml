      het lozen ten gevolge van agrarische activiteiten als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van het Lozingenbesluit open teelt en veehouderij][ref1] dan wel activiteiten
      die daarmee verband houden;


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.6
