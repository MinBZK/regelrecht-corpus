  - number: 1.7.1
    text: 'Bij ministeriële regeling kunnen in overeenstemming met Onze Minister van Verkeer en Waterstaat:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.7
  - number: 1.7.1.a
    text: |-
      ter bescherming van het milieu regels worden gesteld ter uitwerking van de [hoofdstukken 2][ref1], [3][ref2] en
      [4][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0022762
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0022762
        hoofdstuk: '4'
  - number: 1.7.1.b
    text: |-
      ter uitwerking van de bij of krachtens dit besluit voor het lozen in een oppervlaktewaterlichaam gestelde regels,
      oppervlaktewaterlichamen worden aangewezen, die met het oog op het lozen geen bijzondere bescherming behoeven; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.7
  - number: 1.7.1.c
    text: |-
      bodembedreigende activiteiten worden aangewezen, waarop [afdeling 2.4][ref1] niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 1.7.2
    text: |-
      Bij ministeriële regeling kan in overeenstemming met Onze Minister van Verkeer en Waterstaat de verplichting
      worden opgelegd te voldoen aan maatwerkvoorschriften die nodig zijn ter bescherming van het milieu gesteld door het
      bevoegd gezag met betrekking tot de regels, bedoeld in het eerste lid, onderdeel a, en kan worden bepaald in welke
      mate die maatwerkvoorschriften kunnen afwijken van de regels, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.7
  - number: 1.7.3
    text: |-
      Bij ministeriële regeling worden in overeenstemming met Onze Minister van Verkeer en Waterstaat regels gesteld
      omtrent de bij de toepassing van dit besluit in acht te nemen tekst van:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.7
  - number: 1.7.3.a
    text: de bij of krachtens dit besluit genoemde niet-publiekrechtelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.7
  - number: 1.7.3.b
    text: de NeR; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.7
  - number: 1.7.3.c
    text: de NRB.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.7
  - number: '1.8'
    text: |-
      Indien bij of krachtens dit besluit is bepaald dat een daarbij aangegeven maatregel ter bescherming van het milieu
      moet worden toegepast kan een andere maatregel worden toegepast indien het bevoegd gezag heeft beslist dat met die
      maatregel ten minste een gelijkwaardig niveau van bescherming van het milieu wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.8
  - number: '1.9'
    text: |-
      Van de beschikking waarbij bij of krachtens dit besluit een maatwerkvoorschrift wordt gesteld, wordt kennisgegeven
      in één of meer dagbladen, nieuwsbladen of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.9
  - number: 1.10.1
    text: Degene die een inrichting opricht, meldt dit ten minste vier weken voor de oprichting aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.10
  - number: 1.10.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting en het
      veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding overeenkomstig dit
      artikel is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding verstrekte gegevens en op
      grond van de [artikelen 1.11][ref1], [1.12][ref2], [1.13][ref3] en [1.14][ref4] geen andere gegevens zouden moeten
      worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
      - id: ref4
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.10.3
    text: 'Bij de melding worden de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.10
  - number: 1.10.3.a
    text: het adres en het nummer van de Kamer van Koophandel van de inrichting;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.10
  - number: 1.10.3.b
    text: |-
      de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien dit iemand anders is, van degene die de inrichting drijft of zal drijven;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.10
  - number: 1.10.3.c
    text: |-
      het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de verandering
      van de werking daarvan verwezenlijkt zal zijn;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.10
  - number: 1.10.3.d
    text: de aard en omvang van de activiteiten en processen in de inrichting;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.10
  - number: 1.10.3.e
    text: |-
      de indeling en uitvoering van de inrichting, waarbij de grenzen van het terrein van de inrichting, de ligging en de
      indeling van de gebouwen, de functie van de te onderscheiden ruimten en de ligging van de bedrijfsriolering en de
      plaats van de lozingspunten worden aangegeven; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.10
  - number: 1.10.3.f
    text: |-
      een situatieschets, met een schaal van ten minste 1:10.000 waarop de ligging van de inrichting ten opzichte van de
      omgeving is aangegeven en die is voorzien van een noordpijl.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.10
  - number: 1.10.4
    text: |-
      Het bestuursorgaan dat een melding ontvangt waarvoor een ander bestuursorgaan mede bevoegd gezag is, stuurt
      onverwijld een kopie van de melding aan dat andere bevoegde gezag. De melding wordt geacht mede bij dat andere
      bevoegde gezag te zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.10
  - number: 1.11.1
    text: |-
      Bij de melding, bedoeld in [artikel 1.10][ref1], wordt een rapport van een akoestisch onderzoek gevoegd
      indien tussen 19.00 en 7.00 uur naar verwachting gemiddeld meer dan vier transportbewegingen plaatsvinden met
      motorvoertuigen waarvan de massa van het ledig voertuig vermeerderd met het laadvermogen meer is dan 3.500 kilogram
      en binnen een afstand van 50 meter van de grens van de inrichting gevoelige objecten aanwezig zijn. Het gemiddelde
      als bedoeld in de eerste volzin betreft een gemiddelde gemeten over de periode van een jaar. De eerste volzin
      is niet van toepassing op inrichtingen die uitsluitend of in hoofdzaak bestemd zijn voor de openbare verkoop aan
      derden van vloeibare brandstof, mengsmering en aardgas voor het wegverkeer en inrichtingen waar uitsluitend of in
      hoofdzaak horeca-activiteiten plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.11.2
    text: |-
      Bij de melding, bedoeld in [artikel 1.10][ref1], wordt een rapport van een akoestisch onderzoek gevoegd indien het,
      mede op basis van de aard van de inrichting, aannemelijk is dat:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.11.2.a
    text: |-
      in enig vertrek van de inrichting het equivalente geluidsniveau (L) veroorzaakt door de ten gehore gebrachte muziek
      in de representatieve bedrijfssituatie, meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
  - number: 1.11.2.a.1°
    text: 70 dB(A), indien dit vertrek in- of aanpandig is gelegen met gevoelige gebouwen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
  - number: 1.11.2.a.2°
    text: 80 dB(A), indien onderdeel 1° niet van toepassing is; of
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
  - number: 1.11.2.b
    text: in de buitenlucht of op een open terrein van de inrichting muziek ten gehore zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
  - number: 1.11.3
    text: |-
      Bij de melding, bedoeld in [artikel 1.10][ref1], wordt een rapport van een akoestisch onderzoek gevoegd indien de
      melding betrekking heeft op een of meer windturbines.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.11.4
    text: |-
      Bij de melding, bedoeld in [artikel 1.10][ref1], wordt een rapport van een akoestisch onderzoek gevoegd indien in
      de buitenlucht metalen in bulk worden overgeslagen of in de buitenlucht metalen mechanisch worden bewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.11.5
    text: |-
      Bij de melding, bedoeld in [artikel 1.10][ref1], wordt een rapport van een akoestisch onderzoek gevoegd
      indien de melding betrekking heeft op een inrichting als bedoeld in categorie 27.3 van onderdeel C,
      [bijlage 1, bij het Besluit omgevingsrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
      - id: ref2
        bwb_id: BWBR0027464
  - number: 1.11.6
    text: |-
      Bij de melding, bedoeld in [artikel 1.10][ref1], wordt een rapport van een akoestisch onderzoek gevoegd indien
      airbags of gordelspanners worden geneutraliseerd door deze te ontsteken.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: 1.11.7
    text: |-
      Het bevoegd gezag kan besluiten dat het overleggen van een rapport van een akoestisch onderzoek als bedoeld in het
      eerste tot en met zesde lid niet is vereist, indien aannemelijk is dat het langtijdgemiddelde beoordelingsniveau
      (L) en de maximale geluidsniveaus (L) veroorzaakt door de inrichting niet meer bedragen dan de waarden, bedoeld in
      de [artikelen 2.17][ref1], [2.19][ref2], [2.20][ref3], [6.12][ref4] dan wel de van toepassing zijnde geluidswaarden
      van de omgevingsvergunning, het [Besluit landbouw milieubeheer][ref5] of het [Besluit glastuinbouw][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0020112
      [ref6]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.11
    references:
