        afdeling: '4.5'
      - id: ref4
        bwb_id: BWBR0022762
        hoofdstuk: '4'
        paragraaf: 4.5.10
        afdeling: '4.5'
      - id: ref5
        bwb_id: BWBR0022762
        hoofdstuk: '4'
        paragraaf: 4.5.11
        afdeling: '4.5'
  - number: 4.73.2
    text: |-
      Bij het lozen in het vuilwaterriool van afvalwater dat vrijkomt bij een of meer processen als bedoeld in het eerste
      lid bedraagt het gehalte aan vluchtige organohalogeenverbindingen uitgedrukt als chloor niet meer dan 0,1 milligram
      per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.73
  - number: 4.73.3
    text: Het te lozen afvalwater, bedoeld in het eerste lid, kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.73
  - number: 4.74.1
    text: |-
      Bij maatwerkvoorschrift kan het bevoegd gezag [artikel 4.73, eerste lid][ref1], niet van toepassing verklaren en
      hogere gehalten vaststellen dan de gehalten, bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.12
        afdeling: '4.5'
  - number: 4.74.2
    text: 'Het bevoegd gezag kan een maatwerkvoorschrift als bedoeld in het eerste lid slechts vaststellen indien:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74
  - number: 4.74.2.a
    text: |-
      de som van de vrachten van de metalen chroom, koper, nikkel, lood, zink, tin en zilver na het proces maar voor de
      eindzuivering minder dan 200 gram per dag bedraagt, of de gehalten genoemd in kolom A van tabel 4.73 niet met de
      best beschikbare technieken kunnen worden bereikt, met dien verstand dat het bij maatwerkvoorschrift toegestane
      gehalte niet meer bedraagt dan de gehalten genoemd in kolom B van tabel 4.73;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74
  - number: 4.74.2.b
    text: |-
      aannemelijk is dat de som van de vrachten van de metalen chroom, koper, nikkel, lood, zink, tin en zilver
      na het proces maar voor de eindzuivering minder dan 80 gram per dag bedraagt, met dien verstande dat het bij
      maatwerkvoorschrift toegestane som van de gehaltes van de metalen chroom, koper, nikkel, lood, zink, tin en zilver
      niet meer bedraagt dan 15 milligram per liter indien het de som van de metalen in een representatief etmaalmonster
      betreft of niet meer dan 45 milligram per liter indien het de som van de gehaltes van deze metalen in een
      steekmonster betreft.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74
  - number: 4.74.3
    text: Het te lozen afvalwater, bedoeld in het tweede lid, kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74
  - number: 4.74a
    text: Het is verboden om in de buitenlucht mechanische bewerkingen van natuursteen of kunststeen uit te voeren.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74a
  - number: 4.74b
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij mechanische bewerkingen van natuursteen of kunststeen
      de emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.74b.a
    text: |-
      5 milligram per normaal kubieke meter indien de massastroom van totaal stof gelijk is aan of groter is dan 200 gram
      per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74b
  - number: 4.74b.b
    text: 50 milligram per normaal kubieke meter indien de massastroom van totaal stof kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74b
  - number: 4.74c.1
    text: |-
      Indien bij de mechanische bewerking van natuursteen of kunststeen water als koel- of smeermiddel wordt toegepast,
      wordt gebruik gemaakt van een gesloten watercircuit, waarbij water wordt gereinigd en hergebruikt voor zover dat
      redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74c
  - number: 4.74c.2
    text: |-
      Bij het lozen van afvalwater afkomstig van het mechanisch bewerken van natuursteen of kunststeen wordt ten minste
      voldaan aan het derde tot en met het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74c
  - number: 4.74c.3
    text: |-
      Het in een oppervlaktewaterlichaam, op of in de bodem of in een voorziening voor de inzameling en het transport
      van afvalwater, niet zijnde een vuilwaterriool, lozen van afvalwater afkomstig van: - het mechanisch bewerken van
      natuursteen,
        - een luchtreinigingsinstallatie voor het mechanisch bewerken van natuursteen, of
        - het reinigen van apparatuur of werkruimten voor het mechanisch bewerken van natuursteen, is toegestaan indien
      geen flocculanten zijn toegevoegd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74c
  - number: 4.74c.4
    text: |-
      Bij het lozen als bedoeld in het derde lid bedraagt het gehalte aan onopgeloste stoffen niet meer dan 50 milligram
      per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74c
  - number: 4.74c.5
    text: |-
      Het lozen in een vuilwaterriool van afvalwater afkomstig van: - het mechanisch bewerken van natuursteen of
      kunststeen,
        - een luchtreinigingsinstallatie voor het mechanisch bewerken van natuursteen of kunststeen, of
        - het reinigen van apparatuur of werkruimten voor het mechanisch bewerken van natuursteen of kunststeen, vindt
      slechts plaats indien: het gehalte aan onopgeloste stoffen niet meer bedraagt dan 300 milligram per liter en de
      korreldiameter van onopgeloste stoffen niet meer dan 0,75 millimeter bedragen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74c
  - number: 4.74c.6
    text: Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74c
  - number: 4.74d
    text: |-
      Bij de mechanische verwerking van natuursteen of kunststeen wordt ten behoeve van het voorkomen dan wel beperken
      van diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht, voldaan aan de bij ministeriële
      regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74d
  - number: 4.74e
    text: |-
      Het is verboden in de buitenlucht met behulp van een nevelspuit lijmen, harsen en coatings aan te brengen op
      natuursteen of kunststeen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74e
  - number: 4.74f
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het aanbrengen van lijmen, harsen en coatings op
      natuursteen of kunststeen de emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74f
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.74f.a
    text: |-
      5 milligram per normaal kubieke meter, indien de massastroom van totaal stof naar de lucht gelijk is aan of groter
      is dan 200 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74f
  - number: 4.74f.b
    text: 50 milligram per normaal kubieke meter, indien de massastroom van totaal stof kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74f
  - number: 4.74g
    text: 'Bij het aanbrengen van lijmen, harsen en coatings op natuursteen of kunststeen worden ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74g
  - number: 4.74g.a
    text: het voorkomen dan wel beperken van diffuse emissies;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74g
  - number: 4.74g.b
    text: het voorkomen dan wel beperken van geurhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74g
  - number: 4.74g.c
    text: het realiseren van een verwaarloosbaar bodemrisico;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74g
  - number: 4.74h
    text: |-
      Bij het chemisch behandelen van natuursteen of kunststeen worden ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.74h
  - number: 4.75.1
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van een of meer activiteiten als bedoeld in de
      [paragrafen 4.6.2][ref1], [4.6.3][ref2], [4.6.5][ref3] en [4.6.6][ref4] wordt ten minste voldaan aan het tweede tot
      en met het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.75
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '4'
        paragraaf: 4.6.2
        afdeling: '4.6'
      - id: ref2
        bwb_id: BWBR0022762
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
      - id: ref3
        bwb_id: BWBR0022762
        hoofdstuk: '4'
        paragraaf: 4.6.5
        afdeling: '4.6'
      - id: ref4
        bwb_id: BWBR0022762
        hoofdstuk: '4'
        paragraaf: 4.6.6
        afdeling: '4.6'
  - number: 4.75.2
    text: |-
      In het afvalwater afkomstig van het reviseren van motoren worden de emissiegrenswaarden genoemd in tabel 4.75 niet
      overschreden:
            Tabel 4.75






                    Stoffen


                    Emissiegrenswaarde






                    BTEX-som


                    15 milligram per liter




                    Vluchtige organohalogeenverbindingen uitgedrukt als chloor


                    100 microgram per liter




                    Olie


                    20 milligram per liter




                    PAK’s (som van naftaleen, anthraceen, fluorantheen, benzo(g, h, i,)peryleen, benzo(a)pyreen,
      benzo(b)fluorantheen, benzo(k)fluorantheen en indeno(1, 2, 3-cd)pyreen)


                    5 microgram per liter




                    Koper


                    1 milligram per liter




                    Nikkel


                    3 milligram per liter




                    Lood


                    3 milligram per liter




                    Zink


                    3 milligram per liter




                    Chroom


                    2 milligram per liter
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.75
  - number: 4.75.3
    text: |-
      Ander afvalwater dan het afvalwater, bedoeld in het tweede lid, dat afkomstig is uit een ruimte waar een activiteit
      als bedoeld in het eerste lid wordt uitgevoerd of van een vloeistofdichte vloer of verharding waarop die activiteit
      wordt uitgevoerd wordt niet geloosd, indien het in enig steekmonster meer bevat dan:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.75
  - number: 4.75.3.a
    text: 20 milligram olie per liter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.75
  - number: 4.75.3.b
    text: 300 milligram onopgeloste stoffen per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.75
  - number: 4.75.4
    text: |-
      In afwijking van het derde lid bedraagt het gehalte aan olie ten hoogste 200 milligram per liter in enig
      steekmonster indien het afvalwater, voor vermenging met ander afvalwater, wordt geleid door een slibvangput en
      olieafscheider die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.75
  - number: 4.75.5
    text: Het te lozen afvalwater, bedoeld in het tweede en derde lid, kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.75
  - number: 4.76.1
    text: 'Bij een mechanische ventilatie in een parkeergarage met ten minste 20 parkeerplaatsen worden ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.76
  - number: 4.76.1.a
    text: het doelmatig verspreiden van emissies;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.76
  - number: 4.76.1.b
    text: het voorkomen dan wel beperken van geurhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.76
  - number: 4.76.1.c
    text: het voorkomen dan wel beperken van luchtverontreiniging door benzeen,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.76
  - number: 4.76.2
    text: 'Het bevoegd gezag kan maatwerkvoorschriften stellen:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.76
  - number: 4.76.2.a
    text: |-
      ten aanzien van de beperking van de emissie van benzeen uit een parkeergarage indien dit nodig is in het belang van
      de luchtkwaliteit;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.76
  - number: 4.76.2.b
    text: |-
      ten aanzien van de aanzuigopeningen en uitblaasopeningen van de mechanische ventilatie van een parkeergarage en
      de uitvoering en het onderhoud van de ventilatoren indien dit nodig is in het belang van de luchtkwaliteit dan wel
      indien dit nodig is om de geurhinder te voorkomen dan wel te beperken.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.76
  - number: 4.77.1
    text: |-
      Met betrekking tot een bunkerstation waarin lichte olie wordt opgeslagen, wordt ten opzichte van buiten de
      inrichting gelegen kwetsbare objecten een afstand aangehouden van 20 meter gerekend vanaf de zijden van het
      bunkerstation alsmede het vulpunt van het bunkerstation.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.77
  - number: 4.77.2
    text: |-
      Met betrekking tot een op de wal geplaatste vaste afleverinstallatie voor het afleveren van lichte olie aan
      vaartuigen wordt ten opzichte van buiten de inrichting gelegen kwetsbare objecten een afstand aangehouden van
      20 meter gerekend vanaf het afleverpunt alsmede het vulpunt van de installatie.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.77
  - number: 4.77.3
    text: |-
      Binnen een afstand van 20 meter van een bunkerstation waarin lichte olie wordt opgeslagen gerekend vanaf de
      zijden van het bunkerstation alsmede het vulpunt van het bunkerstation en binnen een afstand van 20 meter van een
      op de wal geplaatste vaste afleverinstallatie voor het afleveren van lichte olie aan vaartuigen gerekend vanaf
      het afleverpunt alsmede het vulpunt van de installatie is overnachting en recreatief verblijf door derden niet
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.77
  - number: 4.77.4
    text: |-
      Indien een bunkerstation waarin geen lichte olie wordt opgeslagen, is gelegen aan een doorgaande vaarroute, wordt
      ten opzichte van buiten de inrichting gelegen kwetsbare objecten een afstand aangehouden van 20 meter gerekend
      vanaf de aan de vaarroute grenzende zijde van het bunkerstation.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.77
  - number: 4.78.1
    text: |-
      Bij het afleveren van vloeibare brandstoffen aan vaartuigen zijn voldoende absorptiemiddelen en andere hulpmiddelen
      aanwezig voor de eerste bestrijding van een waterverontreiniging ten gevolge van morsingen of een calamiteit bij
      het afleveren van brandstof.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.78
  - number: 4.78.2
    text: |-
      Een installatie voor het afleveren van vloeibare brandstoffen aan vaartuigen alsmede de daarbij behorende
      tankinstallatie, is zodanig uitgevoerd dat bij wisselende waterstanden, voor zover deze ter plaatse optreden, als
      gevolg van die waterstanden geen nadelige gevolgen voor het milieu optreden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.78
  - number: 4.78.3
    text: |-
      Het bevoegd gezag kan, indien uit de aard en de ligging van de installatie onduidelijk zou kunnen zijn welke
      absorptie- en hulpmiddelen het meest zijn aangewezen, maatwerkvoorschriften stellen met betrekking tot de
      hoeveelheid en de soort middelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.78
  - number: '4.79'
    text: 'Bij het afleveren van vloeibare brandstoffen aan vaartuigen wordt ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.79
  - number: 4.79.a
    text: het realiseren van een verwaarloosbaar bodemrisico;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.79
  - number: 4.79.b
    text: |-
      het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.79
  - number: 4.79.c
    text: |-
      het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van een
      oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.79
  - number: 4.79.d
    text: het voorkomen dan wel beperken van geurhinder,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.79
  - number: 4.80.1
    text: |-
      Het afleveren van lichte olie, anders dan bedoeld in de [artikelen 3.17][ref1], [4.77 tot en met 4.79][ref2],
      geschiedt via een systeem voor dampretour Stage-II. De eerste zin is niet van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
  - number: 4.80.1.a
    text: op het afleveren van lichte olie met een maximale afleversnelheid van 10 liter per minuut of minder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
  - number: 4.80.1.b
    text: |-
      op het afleveren van lichte olie met mengsmering met een maximale afleversnelheid van 45 liter per minuut of
      minder; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
  - number: 4.80.1.c
    text: |-
      indien de doorzet aan lichte olie minder bedraagt dan 500 kubieke meter per jaar, waarbij als bewijs dat de doorzet
      aan lichte olie in enig jaar minder heeft bedragen dan 500 kubieke meter is uiterlijk op 31 maart van het daarop
      volgende kalenderjaar een afschrift van een accountantsverklaring daaromtrent in de inrichting aanwezig is.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
  - number: 4.80.2
    text: |-
      Het gebruikte systeem voor dampretour Stage-II voert ten minste 75% van de uit de brandstofreservoirs van de
      motorvoertuigen verdreven dampen naar de ondergrondse opslagtank terug.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
  - number: 4.80.3
    text: |-
      Een systeem voor dampretour Stage-II is goedgekeurd overeenkomstig de Test Procedure voor Damp Retour Systemen in
      Benzinepompen voor Nederland van het Nederlands Meetinstituut door een keuringsinstantie, welke daartoe door de
      Raad voor Accreditatie is geaccrediteerd op grond van NEN-EN-ISO/IEC 17020.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
  - number: 4.80.4
    text: |-
      Een systeem voor dampretour Stage-II wordt voor ingebruikname en daarna eenmaal per drie jaar overeenkomstig
      de Test Procedure voor Damp Retour Systemen in Benzinepompen voor Nederland van het Nederlands Meetinstituut,
      gecontroleerd op de goede werking door een onafhankelijke inspectie-instelling.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
  - number: 4.80.5
    text: |-
      Indien tijdens de uitvoering van de in het vierde lid bedoelde controle afwijkingen worden geconstateerd ten
      opzichte van de eisen gesteld in het tweede en derde lid, worden deze afwijkingen onverwijld opgeheven.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
  - number: 4.80.6
    text: |-
      De keuringscertificaten zijnde de resultaten van de keuring en de controle, bedoeld in het derde onderscheidenlijk
      vierde lid, worden in de inrichting bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
  - number: 4.80.7
    text: 'Het bevoegd gezag kan ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
  - number: 4.80.7.a
    text: het voorkomen van stankhinder ten gevolge van het afleveren van lichte olie, of
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
  - number: 4.80.7.b
    text: |-
      het beperken van de emissie van benzeen ten gevolge van het afleveren van lichte olie, bij maatwerkvoorschrift
      bepalen welke maatregelen bij een inrichting als bedoeld in het eerste lid, onderdeel c, worden getroffen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80
  - number: 4.80a
    text: Het inpandig afleveren van lichte olie vindt niet plaats.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.80a
  - number: 4.81.1
    text: |-
      De afleverzuil bij een aardgas-afleverstation voor het afleveren van gecomprimeerd aardgas aan motorvoertuigen
      voor het wegverkeer die aardgas als motorbrandstof gebruiken bevindt zich op een afstand van ten minste 10 meter
      van kwetsbare en beperkt kwetsbare objecten. Indien per etmaal meer dan 300 personenauto’s worden gevuld, bedraagt
      deze afstand 15 meter. Indien per etmaal meer dan 100 autobussen worden gevuld, bedraagt deze afstand 20 meter.
      De bufferopslag bevindt zich op een afstand van kwetsbare en beperkt kwetsbare objecten zoals aangegeven in tabel
      4.81.
            Tabel 4.81






                    Waterinhoud bufferopslag


                    Afstand






                    Minder dan 3000 liter


                    10 meter




                    Vanaf 3000 tot 5000 liter


                    15 meter




                    Meer dan 5000 liter


                    20 meter
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.81
  - number: 4.81.2
    text: |-
      Een aardgas-afleverinstallatie voor het afleveren van aardgas ten behoeve van niet-openbare verkoop voor
      motorvoertuigen voor het wegverkeer voldoet ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone
      voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving
      en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan, aan de bij ministeriële regeling te
      stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.81
  - number: 4.82.1
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van een vloeistofdichte vloer of verharding waarboven
      het afleveren van motorbrandstof, anders dan bedoeld in de [artikelen 3.17][ref1], [4.77 tot en met 4.79][ref2]
      plaatsvindt, wordt ten minste voldaan aan het tweede tot en met het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.82
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
  - number: 4.82.2
    text: Het afvalwater wordt geleid door een slibvangput en olieafscheider die voldoen aan NEN-EN 858-1 en 2.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.82
  - number: 4.82.3
    text: |-
      Het gehalte aan olie in het afvalwater na de afscheider bedraagt niet meer dan 200 milligram per liter in enig
      steekmonster bepaald overeenkomstig de bepalingsmethode.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.82
  - number: 4.82.4
    text: Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.82
  - number: '4.83'
    text: |-
      Bij het afleveren van vloeibare brandstoffen en aardgas, anders dan bedoeld in de [artikelen 3.17][ref1],
      [4.77 tot en met 4.79][ref2] wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.83
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
  - number: 4.83.a
    text: |-
      ten behoeve van het realiseren van een verwaarloosbaar bodemrisico en het voorkomen dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van luchtverontreiniging voldaan aan de bij ministeriële regeling te
      stellen eisen; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.83
  - number: 4.83.b
    text: |-
      ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.83
  - number: 4.84.1
    text: |-
      In een inrichting voor onderhoud en reparatie van motorvoertuigen, niet zijnde een autodemontagebedrijf of een
      inrichting voor het opslaan van autowrakken in het kader van hulpverlening aan kentekenhouders door een daartoe
      aangewezen instantie of in het kader van onderzoek door politie of justitie, zijn niet meer dan vier autowrakken
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.84
  - number: 4.84.2
    text: |-
      Het is niet toegestaan, anders dan bij een autodemontagebedrijf, een autowrak en de daarin aanwezige materialen of
      onderdelen te verwijderen of nuttig toe te passen, behoudens voor zover:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.84
  - number: 4.84.2.1°
    text: het de opslag betreft, of
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.84
  - number: 4.84.2.2°
    text: |-
      het accessoires betreft die worden gedemonteerd omdat de laatste eigenaar of houder van het autowrak hierom
      anders dan in de uitoefening van zijn beroep of bedrijf heeft verzocht en met als doel die accessoires opnieuw te
      gebruiken ten behoeve van een ander motorvoertuig waarvan hij eigenaar of houder is.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.84
  - number: 4.84.3
    text: Het proefdraaien van verbrandingsmotoren vindt niet in de buitenlucht plaats.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.84
  - number: 4.84.4
    text: |-
      Bij het onderhouden of repareren van motoren, motorvoertuigen of andere gemotoriseerde apparaten of bij het
      proefdraaien van verbrandingsmotoren wordt ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.84
  - number: 4.84.4.a
    text: |-
      het voorkomen of beperken van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.84
  - number: 4.84.4.b
    text: het voorkomen of beperken van geurhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.84
  - number: 4.84.4.c
    text: het doelmatig verspreiden van emissies naar de buitenlucht;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.84
  - number: 4.84.4.d
    text: het realiseren van een verwaarloosbaar bodemrisico,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.84
  - number: '4.85'
    text: |-
      In afwijking van [artikel 4.84, derde lid][ref1], is het proefdraaien van motoren van pleziervaartuigen in de
      buitenlucht toegestaan voor zover de motor zich in het vaartuig bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.85
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.5
        afdeling: '4.6'
  - number: 4.86.1
    text: |-
      In afwijking van de [artikelen 4.32][ref1] en [4.39][ref2] is het onderhouden en repareren van pleziervaartuigen
      door derden bij een jachthaven toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.86
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.2
        afdeling: '4.5'
  - number: 4.86.2
    text: |-
      In afwijking van de [artikelen 4.22][ref1], [4.28][ref2] en [4.53][ref3] vinden verfspuitwerkzaamheden aan
      pleziervaartuigen door derden bij een jachthaven waarbij verf met een nevelspuit wordt opgebracht plaats in een
      daartoe bestemde ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.86
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.3.2
        afdeling: '4.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.4.2
        afdeling: '4.4'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.5
        afdeling: '4.5'
  - number: '4.87'
    text: |-
      Degene die een inrichting drijft waar derden gelegenheid wordt geboden om pleziervaartuigen te onderhouden, te
      repareren of af te spuiten voldoet ten behoeve van het voorkomen van milieuverontreiniging bij die werkzaamheden
      ten minste aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.87
  - number: '4.88'
    text: |-
      Bij het onderhouden, repareren en afspuiten van pleziervaartuigen wordt ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.88
  - number: 4.89.1
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het ontwikkelen en afdrukken van fotografisch
      materiaal wordt ten minste voldaan aan het tweede tot en met het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.89
  - number: 4.89.2
    text: |-
      Bij het ontwikkelen en afdrukken van fotografisch materiaal worden in goede staat verkerende afkwetsrollen gebruikt
      en een doelmatige zilverterugwininstallatie toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.89
  - number: 4.89.3
    text: |-
      In afwijking van het tweede lid behoeft geen zilverterugwininstallatie te worden toegepast indien per jaar minder
      dan 700 liter aan gebruiksklare fixeer wordt gebruikt en in de inrichting gedragsvoorschriften aanwezig zijn en
      worden nageleefd gericht op de beperking van de zilveremissie.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.89
  - number: 4.89.4
    text: |-
      Het gehalte aan zilver in het afvalwater afkomstig van het ontwikkelen en afdrukken van fotografisch materiaal
      bedraagt in enig steekmonster minder dan 4 milligram per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.89
  - number: 4.89.5
    text: Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.89
  - number: 4.90.1
    text: |-
      Voor de eindreiniging van zeefdrukramen worden uitsluitend reinigingsmiddelen gebruikt met een vlampunt groter dan
      55 graden Celsius of op waterbasis.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.90
  - number: 4.90.2
    text: |-
      Indien voor de zeefdruk per jaar meer dan 1.000 kilogram inkt op basis van organische oplosmiddelen gebruikt wordt,
      wordt een registratie bijgehouden van het verbruik aan vluchtige organische stoffen in kilogram per jaar.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.90
  - number: 4.90.3
    text: |-
      De registratie, bedoeld in het tweede lid, wordt ten minste drie jaar in de inrichting bewaard en ter inzage
      gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.90
  - number: 4.91.1
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van zeefdruk wordt ten minste voldaan aan het tweede
      en derde lid en [artikel 4.92][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.91
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.7.2
        afdeling: '4.7'
  - number: 4.91.2
    text: |-
      Bij het reinigen van zeefdrukramen wordt het lozen van oplosmiddelen en inkten zoveel mogelijk voorkomen door
      het verwijderen van inkt en het strippen van de sjabloon procesmatig te scheiden. Het lozen mag uitsluitend
      bestaan uit het lozen van spoelwater afkomstig van het polijsten, ontvetten of ontwikkelen van het zeefdrukgaas,
      sjabloonverwijdering of schaduwbeeldverwijdering.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.91
  - number: 4.91.3
    text: Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.91
  - number: '4.92'
    text: |-
      Bij het lozen als bedoeld in [artikel 4.91][ref1] wordt rekening gehouden met de beschikbare milieu-informatie
      van de stoffen die in het afvalwater kunnen geraken. Indien op grond van die informatie uit de algemene
      beoordelingsmethodiek voor stoffen en preparaten zoals opgenomen in de nota «Het beoordelen van stoffen en
      preparaten voor de uitvoering van het emissiebeleid water» van de Commissie Integraal Waterbeheer blijkt dat de
      stof wordt aangemerkt als een stof met saneringsinspanning A, wordt deze niet geloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.92
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.7.2
        afdeling: '4.7'
  - number: '4.93'
    text: Bij het zeefdrukken wordt ten behoeve van
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.93
  - number: 4.93.a
    text: het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van geurhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.93
  - number: 4.93.b
    text: het realiseren van een verwaarloosbaar bodemrisico,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.93
  - number: '4.94'
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het toepassen van anti-smetpoeder in
      vellenoffsetdrukpersen de emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.94.a
    text: |-
      5 milligram per normaal kubieke meter indien de massastroom van totaal stof gelijk is aan of groter is dan 200 gram
      per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94
  - number: 4.94.b
    text: 50 milligram per normaal kubieke meter indien de massastroom van totaal stof kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94
  - number: 4.94a.1
    text: |-
      Degene die de inrichting drijft, neemt bij het bedrukken met vellenoffset met betrekking tot vluchtige
      organische stoffen de bij ministeriële regeling voorgeschreven emissiereducerende maatregelen, tenzij deze niet
      kosteneffectief of technisch uitvoerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94a
  - number: 4.94a.2
    text: |-
      Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de in
      het eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar, zoals dat blijkt uit de
      oplosmiddelenboekhouding, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94a
  - number: 4.94a.3
    text: |-
      Degene die een inrichting als bedoeld in het eerste lid drijft, voert een oplosmiddelenboekhouding waarin het
      verbruik van vluchtige organische stoffen per kilogram wordt geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94a
  - number: 4.94a.4
    text: |-
      Indien het totaal verbruik van vluchtige organische stoffen bij de in het eerste lid genoemde activiteiten meer
      bedraagt dan 1.000 kilogram per jaar, geeft de oplosmiddelenboekhouding, bedoeld in het derde lid:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94a
  - number: 4.94a.4.a
    text: |-
      per kwartaal informatie over het verbruik aan isopropylalcohol of andere vluchtige organische stoffen welke als
      toevoegmiddel in het vochtwater worden gebruikt,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94a
  - number: 4.94a.4.b
    text: |-
      per kwartaal informatie over het gewicht van het bedrukte substraat dan wel informatie over het aantal druks en het
      aantal gebruikte torens,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94a
  - number: 4.94a.4.c
    text: |-
      per jaar een berekening van het verbruik aan isopropylalcohol of andere vluchtige organische stoffen welke als
      toevoegmiddel in het vochtwater worden gebruikt, per ton substraat of per 1.000 toren-druks,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94a
  - number: 4.94a.4.d
    text: per kwartaal informatie over de ingekochte reinigingsmiddelen, onderscheiden naar vluchtigheid, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94a
  - number: 4.94a.4.e
    text: per jaar informatie over het verbruik aan vluchtige organische stoffen als gevolg van de toepassing van inkten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94a
  - number: 4.94a.5
    text: |-
      De oplosmiddelenboekhouding, bedoeld in het derde lid, wordt ten minste drie jaar in de inrichting bewaard en ter
      inzage gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94a
  - number: 4.94a.6
    text: |-
      Indien het bedrukken met vellenoffset plaatsvindt in samenhang met het coaten van het substraat en daarbij de
      drempelwaarden, genoemd in [bijlage IIa van het Oplosmiddelenbesluit omzetting EG-VOS-richtlijn milieubeheer][ref1]
      worden overschreden, zijn het eerste tot en met het vijfde lid niet van toepassing op het bedrukken met
      vellenoffset en het reinigen van de daarbij gebruikte apparatuur en is dat besluit van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94a
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: 4.94b.1
    text: 'Bij het in het vuilwaterriool lozen van afvalwater afkomstig van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94b
  - number: 4.94b.1.a
    text: het toepassen van vellenoffsettechnieken;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94b
  - number: 4.94b.1.b
    text: het reinigen van de daarbij gebruikte apparatuur, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94b
  - number: 4.94b.1.c
    text: de vormvervaardiging exclusief fotografische processen,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94b
  - number: 4.94b.2
    text: |-
      Het afvalwater afkomstig van het reinigen van rubberdoeken en drukvormen van vellenoffsetpersen bevat, voor
      vermenging met ander afvalwater, niet meer dan 200 milligram olie per liter in enig steekmonster.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94b
  - number: 4.94b.3
    text: Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94b
  - number: 4.94b.4
    text: |-
      Bij het lozen, bedoeld in het eerste lid, wordt rekening gehouden met de beschikbare milieu-informatie
      van de stoffen die in het afvalwater kunnen geraken. Indien op grond van die informatie uit de algemene
      beoordelingsmethodiek voor stoffen en preparaten zoals opgenomen in de nota «Het beoordelen van stoffen en
      preparaten voor de uitvoering van het emissiebeleid water» van de Commissie Integraal Waterbeheer, blijkt dat de
      stof wordt aangemerkt als een stof met saneringsinspanning A, wordt deze niet geloosd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94b
  - number: 4.94c.1
    text: |-
      Bij de vervaardiging van drukvormen voor het bedrukken met vellenoffset worden geen chroomzouthoudende ets- en
      correctiemiddelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94c
  - number: 4.94c.2
    text: |-
      Bij het ontwikkelen en naharden van kopieerlagen voor het bedrukken met vellenoffset worden geen chroomhoudende
      oplossingen gebruikt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94c
  - number: 4.94d
    text: 'Bij het bedrukken met vellenoffset worden ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94d
  - number: 4.94d.a
    text: het voorkomen dan wel beperken van diffuse emissies;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94d
  - number: 4.94d.b
    text: het doelmatig verspreiden van emissies naar de buitenlucht;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94d
  - number: 4.94d.c
    text: het voorkomen dan wel beperken van geurhinder, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94d
  - number: 4.94d.d
    text: het realiseren van een verwaarloosbaar bodemrisico,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94d
  - number: 4.94e.1
    text: |-
      Degene die de inrichting drijft neemt bij het lijmen, coaten en lamineren van papier of karton met betrekking tot
      vluchtige organische stoffen de bij ministeriële regeling voorgeschreven emissiereducerende maatregelen tenzij deze
      niet kosteneffectief of technisch uitvoerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94e
  - number: 4.94e.2
    text: |-
      Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de in
      het eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar, zoals dat blijkt uit de
      oplosmiddelenboekhouding, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94e
  - number: 4.94e.3
    text: |-
      Degene die een inrichting als bedoeld in het eerste lid drijft, voert een oplosmiddelenboekhouding waarin het
      verbruik van vluchtige organische stoffen per kilogram per jaar wordt geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94e
  - number: 4.94e.4
    text: |-
      De oplosmiddelenboekhouding, bedoeld in het derde lid, wordt ten minste drie jaar in de inrichting bewaard en ter
      inzage gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94e
  - number: 4.94e.5
    text: |-
      Indien de drempelwaarden, genoemd in
      [bijlage IIa van het Oplosmiddelenbesluit omzetting EG-VOS-richtlijn milieubeheer][ref1] worden overschreden, zijn
      het eerste tot en met het vierde lid niet van toepassing en is dat besluit van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94e
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: 4.94f
    text: 'Bij het lijmen, coaten en lamineren van papier of karton worden ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94f
  - number: 4.94f.a
    text: het voorkomen dan wel beperken van diffuse emissies;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94f
  - number: 4.94f.b
    text: het voorkomen dan wel beperken van geurhinder, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94f
  - number: 4.94f.c
    text: het realiseren van een verwaarloosbaar bodemrisico,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94f
  - number: 4.94g.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het mechanisch verkleinen van papier en karton en van
      papieren en kartonnen producten de emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94g
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.94g.1.a
    text: |-
      5 milligram per normaal kubieke meter, indien de massastroom van totaal stof naar de lucht gelijk is aan of groter
      is dan 200 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94g
  - number: 4.94g.1.b
    text: 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94g
  - number: 4.94g.2
    text: |-
      Bij het mechanisch verkleinen van papier en karton en van papieren en kartonnen producten worden ten behoeve van
      het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht
      de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94g
  - number: 4.94g.3
    text: |-
      Bij het mechanisch verkleinen van papier en karton en van papieren en kartonnen producten wordt ten behoeve van het
      realiseren van een verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.94g
  - number: 4.95.1
    text: |-
      Het reinigen van textiel vindt voor zover daar chemische stoffen bij worden gebruikt, uitsluitend plaats met behulp
      van PER of niet-gechloreerde alifatische koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.95
  - number: 4.95.2
    text: Bij ministeriële regeling kunnen andere stoffen dan genoemd in het eerste lid, worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.95
  - number: 4.95.3
    text: |-
      Degene die een inrichting drijft waarin activiteiten worden uitgeoefend als bedoeld in het eerste lid, voert
      een oplosmiddelenboekhouding waarin het verbruik van vluchtige organische stoffen per kilogram per jaar wordt
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.95
  - number: 4.95.4
    text: 'De oplosmiddelenboekhouding, bedoeld in het derde lid, bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.95
  - number: 4.95.4.a
    text: het totaal aan inkoop van VOS-houdende producten in het betreffende kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.95
  - number: 4.95.4.b
    text: de voorraad aan VOS-houdende producten en afvalstoffen op 1 januari van elk jaar;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.95
  - number: 4.95.4.c
    text: |-
      de totale hoeveelheid vluchtige organische stoffen aanwezig in afvalstoffen, die in het betreffende kalenderjaar
      uit de inrichting zijn afgevoerd;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.95
  - number: 4.95.4.d
    text: |-
      het totale verbruik van vluchtige organische stoffen in het verstreken kalenderjaar, te berekenen uit het verschil
      tussen de ingekochte hoeveelheden, de afgevoerde hoeveelheden, de aan de leverancier geretourneerde hoeveelheden en
      het voorraadverschil, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.95
  - number: 4.95.4.e
    text: de totale hoeveelheid textiel, uitgedrukt in kilogram gereinigd textiel, die is gereinigd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.95
  - number: 4.95.5
    text: |-
      De oplosmiddelenboekhouding, bedoeld in het derde lid, wordt ten minste gedurende drie jaren bewaard en ter inzage
      gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.95
  - number: 4.96.1
    text: |-
      Bij het reinigen en wassen van textiel is de immissieconcentratie van PER in een besloten ruimte van een gevoelig
      object, die geen deel uitmaakt van de inrichting, per week gemiddeld niet meer dan 0,25 milligram per normaal
      kubieke meter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.96
  - number: 4.96.2
    text: |-
      Het eerste lid is niet van toepassing indien de gebruiker van een ruimte als bedoeld in dat lid geen toestemming
      geeft voor het verrichten van een meting als bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.96
  - number: 4.96.3
    text: |-
      Bij het reinigen en wassen van textiel is de immissieconcentratie van PER ter plaatse van gevoelige objecten en
      niet tot de inrichting behorende balkons, terrassen of tuinen, per jaar gemiddeld niet meer dan 0,25 milligram per
      normaal kubieke meter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.96
  - number: 4.96.4
    text: |-
      Voor het bepalen van de immissieconcentratie van PER, bedoeld in het eerste of derde lid, wordt de methode met
      absorptiemateriaal of de methode met continu registrerende meetapparatuur toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.96
  - number: 4.96.5
    text: |-
      In afwijking van [artikel 1.1][ref1] wordt voor de toepassing van dit artikel verstaan onder gevoelig object:
      een gebouw of een gedeelte van een gebouw dat bestemd is voor het verblijf van personen of een object, gebouw of
      terrein dat bestemd is voor verblijfs- of dagrecreatie, niet zijnde een kampeerterreinen voor ten hoogste vijftien
      kampeermiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.96
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.1.1
        afdeling: '1.1'
  - number: 4.97.1
    text: |-
      Bij het meten van de immissieconcentratie van PER in de binnenlucht in een besloten ruimte van een gevoelig object,
      die geen deel uitmaakt van de inrichting, bedoeld in [artikel 4.96, vierde lid][ref1], door middel van de methode
      met absorptiemateriaal zijn het tweede tot en met vijftiende lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.7.4
        afdeling: '4.7'
  - number: 4.97.2
    text: Voor de metingen wordt gebruik gemaakt van monsterneming door middel van adsorptiemateriaal in buisjes of badges.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.3
    text: |-
      De toe te passen buisjes of badges hebben een detectielimiet van 0,1 milligram per normaal kubieke meter of lager
      en zijn volgens de schriftelijke verklaring van de fabrikant of leverancier geschikt voor de toepassing bij deze
      meetmethode.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.4
    text: |-
      Bij de toepassing van buisjes of badges de door de fabrikant of leverancier opgestelde gebruiksvoorschriften worden
      in acht genomen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.5
    text: |-
      De bemonstering van de binnenlucht kan zowel passief als actief plaatsvinden. In geval van actieve bemonstering
      vindt deze plaats met een daartoe geschikte pomp.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.6
    text: |-
      De gasconcentratie in de binnenlucht wordt na analyse van de koolbuisjes berekend uit het quotiënt van de
      aangetroffen hoeveelheid PER in de bemonstering en het totaal doorgezogen luchtvolume.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.7
    text: |-
      De te bemonsteren ruimte is een ruimte waar personen verblijven of werkzaam zijn en direct grenst aan de
      inrichting.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.8
    text: |-
      De plaats van monsterneming wordt vrij in de betreffende ruimte gepositioneerd op een zodanige plaats dat gassen
      kunnen worden bemonsterd. De afstand tussen die plaats en een vloer, een wand en het plafond van de te bemonsteren
      ruimte is ten minste 50 centimeter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.9
    text: De buisjes of badges zijn gedurende de voorgeschreven meettijd in de ruimte op dezelfde plek aanwezig.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.10
    text: |-
      Gedurende de bemonsteringsperiode mag in de te bemonsteren ruimte geen gebruik worden gemaakt van
      oplosmiddelhoudende materialen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.11
    text: |-
      Het al dan niet aanwezig zijn van personen, de duur van die aanwezigheid en de wijze van ventileren en de duur
      daarvan gedurende een meting in de ruimte worden in een verslag vastgelegd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.12
    text: De meettijd bedraagt ten minste één week.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.13
    text: Met de buisjes of badges wordt een gemiddelde immissieconcentratie gemeten over de meetperiode.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.14
    text: |-
      De gemeten of de berekende immissieconcentratie mag uitsluitend voor de gevoelige objecten worden gecorrigeerd
      met de expositieduur, op basis van de gemiddelde verblijfstijd in zodanig object die redelijkerwijs mag worden
      verondersteld.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.97.15
    text: |-
      Van een meting wordt een verslag gemaakt dat op het eerste verzoek van het bevoegd gezag wordt overgelegd en
      gedurende ten minste twee jaren na de eerstvolgende meting in de inrichting wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.97
  - number: 4.98.1
    text: |-
      Bij het meten van de immissieconcentratie van PER in de binnenlucht in een besloten ruimte van een gevoelig object,
      die geen deel uitmaakt van de inrichting, bedoeld in [artikel 4.96, vierde lid][ref1], door middel van de methode
      met continu registrerende meetapparatuur zijn het tweede tot en met tiende lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.98
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.7.4
        afdeling: '4.7'
  - number: 4.98.2
    text: |-
      Er wordt gebruik gemaakt van continu registrerende meetapparatuur die een detectielimiet heeft van 0,1 milligram
      per normaal kubieke meter of lager.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.98
  - number: 4.98.3
    text: |-
      Er wordt gemeten gedurende ten minste een hele werkdag waarbij het begin van een meting ligt op ten minste een
      uur voor de start van de bedrijfsvoering en het einde van een meting ligt op een uur na het beëindigen van de
      bedrijfsvoering op die werkdag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.98
  - number: 4.98.4
    text: |-
      De weekgemiddelde immissieconcentratie wordt berekend door de gemiddelde gemeten immissieconcentratie tijdens de
      bedrijfsvoering te vermenigvuldigen met het quotiënt van het totaal aantal bedrijfsuren op weekbasis en het totaal
      aantal uren in een week dat 168 uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.98
  - number: 4.98.5
    text: |-
      De gemeten of berekende immissieconcentratie mag uitsluitend voor een besloten ruimte van een gevoelig object
      worden gecorrigeerd met de expositieduur op basis van de gemiddelde verblijfstijd in die besloten ruimte, die
      redelijkerwijs mag worden verondersteld.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.98
  - number: 4.98.6
    text: |-
      De te bemonsteren ruimte is een ruimte waar personen verblijven of werkzaam zijn en direct grenst aan de
      inrichting.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.98
  - number: 4.98.7
    text: |-
      De plaats van monsterneming wordt vrij in de betreffende ruimte gepositioneerd op een zodanige plaats dat gassen
      kunnen worden bemonsterd. De afstand tussen die plaats en een vloer, een wand en het plafond van de te bemonsteren
      ruimte is ten minste 50 centimeter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.98
  - number: 4.98.8
    text: |-
      Gedurende de bemonsteringsperiode in de te bemonsteren ruimte mag geen gebruik worden gemaakt van
      oplosmiddelhoudende materialen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.98
  - number: 4.98.9
    text: |-
      Het al dan niet aanwezig zijn van personen, de duur van die aanwezigheid, de wijze van ventileren en de duur
      daarvan gedurende een meting in de ruimte, worden in een verslag vastgelegd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.98
  - number: 4.98.10
    text: |-
      Van een meting een verslag wordt gemaakt dat op het eerste verzoek van het bevoegd gezag wordt overgelegd en
      gedurende ten minste twee jaren na de eerstvolgende meting in de inrichting wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.98
  - number: 4.99.1
    text: |-
      Bij het meten van de immissieconcentratie van PER in de buitenlucht, bedoeld in [artikel 4.96, vierde lid][ref1],
      door middel van de methode met absorptiemateriaal zijn het tweede tot en met negentiende lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.7.4
        afdeling: '4.7'
  - number: 4.99.2
    text: Er wordt gebruik gemaakt van monsterneming door middel van absorptiemateriaal in buisjes of badges.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.3
    text: |-
      De toe te passen buisjes of badges hebben een detectielimiet van 0,1 milligram per normaal kubieke meter of lager
      en zijn volgens de schriftelijke verklaring van de fabrikant of leverancier geschikt voor de toepassing bij deze
      meetmethode.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.4
    text: |-
      Bij de toepassing van buisjes of badges worden de door de fabrikant of leverancier opgestelde gebruiksvoorschriften
      in acht worden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.5
    text: |-
      De bemonstering van de buitenlucht kan zowel passief als actief plaatsvinden. In geval van actieve bemonstering
      vindt deze plaats met een daartoe geschikte pomp.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.6
    text: |-
      De gasconcentratie in de buitenlucht wordt na analyse van de koolbuisjes berekend uit het quotiënt van de
      aangetroffen hoeveelheid PER in de bemonstering en het totaal doorgezogen luchtvolume.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.7
    text: De meettijd bedraagt ten minste twee weken.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.8
    text: 'De monstername vindt plaats in de buitenlucht en bij de keuze van een meetplaats wordt in beschouwing genomen:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.8.a
    text: de afstand van het emissiepunt tot het dichtstbij gelegen gevoelige object, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.8.b
    text: de te verwachten wijze van emissie, waaronder het concentratieverloop in de tijd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.9
    text: |-
      De aanwezige en mogelijke emissieplaatsen en gevoelige objecten worden geïnventariseerd overeenkomstig de bij
      ministeriële regeling gestelde selectielijst meetplaatsen PER-imissiemeting.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.10
    text: 'Als gevoelige objecten worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.10.a
    text: te openen ramen, deuren en ventilatieroosters;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.10.b
    text: terrassen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.10.c
    text: balkons;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.10.d
    text: tuinen; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.10.e
    text: perceelsgrens.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.11
    text: Per geïnventariseerde emissieplaats wordt de omvang van de emissie ingeschat.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.12
    text: 'De afstand tot een gevoelig object wordt bepaald of ingeschat en ingedeeld in de volgende categorieën:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.12.a
    text: minder dan 5 meter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.12.b
    text: vanaf 5 tot 15 meter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.12.c
    text: vanaf 15 tot 25 meter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.12.d
    text: vanaf 25 meter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.13
    text: |-
      Uit de geïnventariseerde gevoelige objecten wordt een selectie gemaakt van de gevoelige objecten die de meeste
      relevantie hebben.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.14
    text: |-
      De resultaten van de inventarisatie van aanwezige en mogelijke meetplaatsen en gevoelige objecten, bedoeld in het
      negende lid, de inschatting van de emissie, bedoeld in het elfde lid, en de indeling en selectie van gevoelige
      objecten, bedoeld in het twaalfde en dertiende lid, worden in een verslag opgenomen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.15
    text: |-
      Een meting vindt plaats ter plaatse van de geselecteerde gevoelige objecten, bedoeld in het dertiende lid. Indien
      het gevoelige object geen perceelsgrens is, vindt tevens op de perceelsgrens een meting plaats. Indien meting op de
      perceelsgrens niet mogelijk is, wordt een plaats genomen die zo dicht mogelijk bij de perceelsgrens ligt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.16
    text: De exacte plaats van elke meetplaats wordt op een situatietekening aangegeven, die wordt opgenomen in een verslag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.17
    text: Het meetinstrumentarium wordt ter plaatse van een meetplaats bevestigd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.18
    text: |-
      De jaargemiddelde immissieconcentratie is gelijk aan de gemiddelde concentratie die gedurende twee weken wordt
      gemeten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.99.19
    text: |-
      Van een meting wordt een verslag gemaakt dat op eerste verzoek van het bevoegd gezag wordt overgelegd en gedurende
      ten minste twee jaren na de eerstvolgende meting in de inrichting wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.99
  - number: 4.100.1
    text: |-
      Bij het meten van de immissieconcentratie van PER in de buitenlucht, bedoeld in [artikel 4.96, vierde lid][ref1],
      door middel van de methode met continu registrerende meetapparatuur zijn het tweede tot en met twintigste lid van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.7.4
        afdeling: '4.7'
  - number: 4.100.2
    text: |-
      Er wordt gebruik gemaakt van continu registrerende meetapparatuur dat een detectielimiet heeft van 0,1 milligram
      per normaal kubieke meter of lager.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.3
    text: |-
      Er wordt gemeten gedurende ten minste een hele werkdag waarbij het begin van een meting ligt op ten minste een
      uur voor de start van de bedrijfsvoering en het einde van een meting ligt op een uur na het beëindigen van de
      bedrijfsvoering op die werkdag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.4
    text: |-
      De meting wordt uitgevoerd bij de op de meetplaats van toepassing zijnde meest voorkomende windcondities met
      betrekking tot de windrichting en windsnelheid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.5
    text: |-
      Indien een gevoelig object zich niet aan de lijzijde van de meest voorkomende windrichting bevindt, wordt een
      meting uitgevoerd gedurende een tweede hele werkdag bij een tegenovergestelde windrichting.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.6
    text: |-
      Voor het vaststellen van de meest voorkomende windcondities wordt gebruik gemaakt van de jaargegevens van het KNMI
      weerstation dat het dichtst bij de locatie is gelegen en deze gegevens worden in een verslag vermeld.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.7
    text: Een meting wordt niet uitgevoerd wanneer er neerslag valt noch wanneer het mistig is.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.8
    text: 'De monstername vindt plaats in de buitenlucht en bij de keuze van een meetplaats wordt in beschouwing genomen:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.8.a
    text: de afstand van het emissiepunt tot het dichtstbij gelegen gevoelige object; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.8.b
    text: de te verwachten wijze van emissieconcentratieverloop in de tijd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.9
    text: |-
      Aanwezige en mogelijke emissieplaatsen van gevoelige objecten worden geïnventariseerd overeenkomstig de bij
      ministeriële regeling vastgestelde selectielijst meetplaatsen PER-imissiemeting.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.10
    text: 'Als gevoelige objecten worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.10.a
    text: te openen ramen, deuren en ventilatieroosters;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.10.b
    text: terrassen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.10.c
    text: balkons;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.10.d
    text: tuinen; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.10.e
    text: de perceelsgrens.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.11
    text: Per geïnventariseerde emissieplaats wordt de omvang van de emissie ingeschat.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.12
    text: |-
      De afstand tot een geïnventariseerd gevoelig object wordt bepaald of ingeschat en ingedeeld in de volgende
      categorieën:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.12.a
    text: minder dan 5 meter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.12.b
    text: vanaf 5 tot 15 meter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.12.c
    text: vanaf 15 tot 25 meter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.12.d
    text: vanaf 25 meter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.13
    text: |-
      Uit de geïnventariseerde gevoelige objecten wordt een selectie gemaakt van de gevoelige objecten die de meeste
      relevantie hebben.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.14
    text: |-
      De resultaten van de inventarisatie van aanwezige en mogelijke meetplaatsen en gevoelige objecten, bedoeld in
      het tiende lid, de inschatting van de emissie, bedoeld in het elfde lid, en de indeling en selectie van gevoelige
      objecten, bedoeld in het twaalfde en dertiende lid, worden in een verslag opgenomen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.15
    text: |-
      Een meting vindt plaats ter plaatse van de geselecteerde gevoelige objecten, bedoeld in het dertiende lid. Indien
      het gevoelige object geen perceelsgrens is, vindt tevens op de perceelsgrens een meting plaats. Indien meting op de
      perceelsgrens niet mogelijk is wordt een plaats genomen die zo dicht mogelijk bij de perceelsgrens ligt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.16
    text: De exacte plaats van elke meetplaats wordt op een situatietekening aangegeven, die wordt opgenomen in een verslag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.17
    text: Het meetinstrumentarium wordt ter plaatse van een meetplaats bevestigd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.18
    text: |-
      De gemiddelde immissieconcentratie wordt bepaald door de gemeten gemiddelde immissie te vermenigvuldigen met het
      quotiënt van het totaal aantal bedrijfsuren op jaarbasis en het totaal aantal uren per jaar. Het totaal aantal uren
      per jaar bedraagt 8760. Vervolgens wordt de gemeten immissie gecorrigeerd met de expositieduur die redelijkerwijs
      mag worden verondersteld, op het gevoelige object. De toe te passen expositieduur wordt ter goedkeuring aan het
      bevoegd gezag voorgelegd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.19
    text: |-
      Zowel de niet gecorrigeerde als de gecorrigeerde waarde van de berekende jaargemiddelde immissie wordt in een
      verslag vermeld.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.100.20
    text: |-
      Van een meting wordt een verslag gemaakt dat op eerste verzoek van het bevoegd gezag wordt overgelegd en gedurende
      ten minste twee jaren na de eerstvolgende meting in de inrichting wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.100
  - number: 4.101.1
    text: |-
      Een machine bestemd voor het reinigen met een koolwaterstof wordt zo ingesteld, gebruikt en onderhouden dat de
      hoeveelheid van die koolwaterstof in het gereinigde textiel en in de vrijkomende drooglucht niet meer bedraagt dan
      20 gram per kilogram gereinigd textiel.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.101
  - number: 4.101.2
    text: |-
      Indien bij ministeriële regeling als bedoeld in [artikel 4.95, tweede lid][ref1], een andere stof wordt aangewezen
      dan die genoemd in het eerste lid, kan bij die regeling tevens de ten hoogste toelaatbare hoeveelheid van die stof
      in het gereinigde textiel en in de vrijkomende drooglucht worden aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.101
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.7.4
        afdeling: '4.7'
  - number: 4.101.3
    text: |-
      De drijver van de inrichting bewaart het laatste keurings- en onderhoudsrapport, waaruit mede blijkt wie en wanneer
      de keuring of het onderhoud heeft onderscheidenlijk is verricht.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.101
  - number: 4.102.1
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het reinigen en wassen van textiel wordt ten
      minste voldaan aan het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.102
  - number: 4.102.2
    text: Afvalwater afkomstig van het wasproces bevat in enig steekmonster niet meer dan 0,1 milligram PER per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.102
  - number: 4.102.3
    text: Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.102
  - number: '4.103'
    text: |-
      Bij het reinigen en wassen van textiel wordt ten behoeve van het realiseren van een verwaarloosbaar bodemrisico,
      voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103
  - number: 4.103a
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het geautomatiseerd weven, spinnen en breien en het
      verkleinen van textiel en producten van textiel, de emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.103a.a
    text: |-
      5 milligram per normaal kubieke meter indien de massastroom van totaal stof gelijk is aan of groter is dan 200 gram
      per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103a
  - number: 4.103a.b
    text: 50 milligram per normaal kubieke meter indien de massastroom van totaal stof kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103a
  - number: 4.103b
    text: |-
      Bij het geautomatiseerd weven, spinnen en breien en verkleinen van textiel en producten van textiel, worden ten
      behoeve van het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van emissies naar de
      buitenlucht, de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103b
  - number: 4.103ba
    text: |-
      Bij het verkleinen van textiel en producten van textiel wordt ten behoeve van het realiseren van een
      verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103ba
  - number: 4.103c
    text: |-
      Bij het lassen van textiel wordt ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht ten
      minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103c
  - number: 4.103d
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het aanbrengen van coating of lijmlagen de
      emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.103d.a
    text: |-
      5 milligram per normaal kubieke meter indien de massastroom van totaal stof naar de lucht gelijk is aan of groter
      is dan 200 gram per uur; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103d
  - number: 4.103d.b
    text: |-
      50 milligram per normaal kubieke meter indien de massastroom van totaal stof naar de lucht kleiner is dan 200 gram
      per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103d
  - number: 4.103e.1
    text: |-
      Degene die de inrichting drijft, neemt bij het lijmen en coaten van textiel de bij ministeriële regeling
      voorgeschreven emissiereducerende maatregelen met betrekking tot vluchtige organische stoffen tenzij deze niet
      kosteneffectief of technisch uitvoerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103e
  - number: 4.103e.2
    text: |-
      Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de in
      het eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar, zoals dat blijkt uit de
      oplosmiddelenboekhouding, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103e
  - number: 4.103e.3
    text: |-
      Degene die een inrichting als bedoeld in het eerste lid drijft, voert een oplosmiddelenboekhouding waarin het
      verbruik van vluchtige organische stoffen per kilogram per jaar wordt geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103e
  - number: 4.103e.4
    text: |-
      De oplosmiddelenboekhouding, bedoeld in het derde lid, wordt ten minste drie jaren in de inrichting bewaard en ter
      inzage gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103e
  - number: 4.103e.5
    text: |-
      Indien de drempelwaarden, genoemd in
      [bijlage IIa van het Oplosmiddelenbesluit omzetting EG-VOS-richtlijn milieubeheer][ref1] worden overschreden, zijn
      het eerste tot en met het vierde lid niet van toepassing en is dat besluit van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103e
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: 4.103f
    text: 'Bij het reinigen, lijmen en coaten van textiel worden ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103f
  - number: 4.103f.a
    text: het voorkomen dan wel beperken van diffuse emissies;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103f
  - number: 4.103f.b
    text: het voorkomen dan wel beperken van geurhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103f
  - number: 4.103f.c
    text: het realiseren van een verwaarloosbaar bodemrisico,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.103f
  - number: 4.104.1
    text: |-
      Bij het inwendig reinigen van tanks en tankwagens wordt het in het afvalwater geraken van het product zo veel
      mogelijk voorkomen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.104
  - number: 4.104.2
    text: |-
      Indien in de inrichting afvalwater ontstaat met een soortgelijke samenstelling als het afvalwater dat ontstaat
      bij het inwendig reinigen van tanks en tankwagens, is het toegestaan laatstgenoemd afvalwater te lozen op dezelfde
      wijze als het afvalwater van soortgelijke samenstelling mits het afvalwater van soortgelijke samenstelling door een
      zuiveringsvoorziening wordt geleid, die is gedimensioneerd op de totale afvalwaterstroom.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.104
  - number: 4.104a.1
    text: |-
      Het in het vuilwaterriool lozen van afvalwater afkomstig van het inwendig reinigen en ontsmetten van vrachtwagens
      en andere transportmiddelen waarin vlees onverpakt is vervoerd, voldoet ten minste aan het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.104a
  - number: 4.104a.2
    text: |-
      Het afvalwater afkomstig van het inwendig reinigen en ontsmetten van vrachtwagens en andere transportmiddelen
      waarin vlees onverpakt is vervoerd, wordt voor vermenging met ander niet vethoudend afvalwater geleid door een
      vetafscheider en slibvangput die voldoen aan en worden gebruikt conform NEN-EN 1825-1 en 2. In afwijking van NEN-EN
      1825-1 en 2 kan met een lagere frequentie van het legen en reinigen dan daarin vermeld worden volstaan indien een
      lagere frequentie geen nadelige gevolgen heeft voor het doelmatig functioneren van de afscheider.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.104a
  - number: 4.104a.3
    text: |-
      Bij maatwerkvoorschrift kan het bevoegd gezag het tweede lid niet van toepassing verklaren en het lozen zonder
      een vetafscheider en slibvangput toestaan indien, gelet op het gehalte vet en onopgeloste stoffen in het te lozen
      afvalwater in combinatie met de hoeveelheid te lozen afvalwater, het lozen geen nadelige gevolgen heeft voor de
      doelmatige werking van de voorzieningen voor het beheer van afvalwater. [Artikel 2.2, vierde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.104a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: 4.104b
    text: |-
      Bij het inwendig reinigen en ontsmetten van vrachtwagens en andere transportmiddelen wordt ten behoeve van het
      realiseren van een verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.104b
  - number: 4.104c
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het inwendig reinigen van veegwagens en
      vuilniswagens bevat het afvalwater in enig steekmonster niet meer dan 300 milligram onopgeloste stoffen per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.104c
  - number: 4.105.1
    text: |-
      Bij het in het vuilwaterriool lozen van ingenomen bilgewater van pleziervaartuigen wordt ten minste voldaan aan de
      voorwaarden genoemd in het derde tot en met het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.105
  - number: 4.105.2
    text: 'Het afvalwater bevat in enig steekmonster niet meer dan:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.105
  - number: 4.105.2.a
    text: 20 milligram olie per liter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.105
  - number: 4.105.2.b
    text: 300 milligram onopgeloste stoffen per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.105
  - number: 4.105.3
    text: |-
      In afwijking van het derde lid mag het gehalte aan olie ten hoogste 200 milligram per liter in enig steekmonster
      bedragen indien het afvalwater, voorafgaand aan de vermenging met ander afvalwater wordt geleid door een
      slibvangput en olieafscheider die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.105
  - number: 4.105.4
    text: Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.105
  - number: 4.106.1
    text: |-
      In het belang van het doelmatig beheer van afvalstoffen worden in een jachthaven van gebruikers van de jachthaven
      in ieder geval de afvalstoffen genoemd onder a tot en met d, ingenomen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.1.a
    text: |-
      Indien een jachthaven beschikt over meer dan 50 ligplaatsen en binnen de jachthaven het afleveren van vloeibare
      brandstoffen aan vaartuigen plaatsvindt, neemt de jachthaven in:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.1.a.1°
    text: afgewerkte olie en smeervet van onderhoud aan pleziervaartuigen, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.1.a.2°
    text: olie- en vethoudend afval van onderhoud aan pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.1.b
    text: |-
      Indien een jachthaven beschikt over meer dan 50 ligplaatsen en binnen de jachthaven onderhoud en reparatie van
      pleziervaartuigen door derden plaatsvindt, wordt in de jachthaven tevens ingenomen:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.1.b.1°
    text: afgewerkte olie en smeervet van onderhoud aan pleziervaartuigen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.1.b.2°
    text: olie- en vethoudend afval van onderhoud aan pleziervaartuigen, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.1.b.3°
    text: |-
      afvalstoffen van reparatie- en onderhoudswerkzaamheden aan pleziervaartuigen, die binnen de jachthaven door derden
      worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.1.c
    text: |-
      Indien een jachthaven beschikt over meer dan 50 ligplaatsen, daaronder niet begrepen ligplaatsen uitsluitend
      bestemd voor pleziervaartuigen die geen binnenboordmotor hebben, wordt in de jachthaven tevens bilgewater
      ingenomen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.1.d
    text: |-
      Indien een jachthaven beschikt over meer dan 50 ligplaatsen, daaronder niet begrepen ligplaatsen uitsluitend
      bestemd voor pleziervaartuigen zonder een vaste afsluitbare verblijfsruimte, wordt in de jachthaven tevens
      huishoudelijk afvalwater en de inhoud van chemische toiletten ingenomen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.2
    text: |-
      Indien twee of meer jachthavens in elkaars onmiddellijke nabijheid zijn gelegen wordt voldaan aan het eerste lid
      indien de voorzieningen gemeenschappelijk worden aangebracht en beheerd en daartoe een overeenkomst is gesloten. De
      overeenkomst wordt ter goedkeuring voorgelegd aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.3
    text: |-
      Indien een jachthaven in de onmiddellijke nabijheid is gelegen van een inrichting waarbinnen uitvoering wordt
      gegeven aan [titel 10.4 van de wet][ref1] is voldaan aan het eerste lid indien de voorzieningen van de inrichting
      waar uitvoering wordt gegeven aan titel 10.4 van de wet voldoen aan het eerste lid en gemeenschappelijk worden
      gebruikt op grond van een overeenkomst tussen de jachthaven en de inrichting. De overeenkomst wordt ter goedkeuring
      voorgelegd aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 4.106.4
    text: |-
      Voor de inzameling, bedoeld in het eerste lid, wordt geen aparte financiële vergoeding gevraagd aan de gebruikers
      van de inrichting.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.106.5
    text: |-
      Indien een jachthaven op grond van het eerste lid niet behoeft te beschikken over een voorziening voor de
      inzameling van een bepaalde categorie afvalstoffen, wordt binnen de jachthaven duidelijk aangegeven waar de
      gebruikers van de jachthaven hun afvalstoffen kunnen afgeven.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.106
  - number: 4.107.1
    text: |-
      In afwijking van [artikel 4.106, eerste lid][ref1], worden de in dat lid genoemde afvalstoffen in een jachthaven
      die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen ingenomen ongeacht het aantal ligplaatsen in die
      inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.107
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.2
        afdeling: '4.8'
  - number: 4.107.2
    text: |-
      Degene die een jachthaven drijft die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen, maakt bij de
      inning van het havengeld kenbaar welk aandeel daarvan bestemd is voor het instandhouden van de voorzieningen voor
      het in ontvangst nemen en verder beheren van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.107
  - number: 4.107.3
    text: |-
      Degene die een jachthaven drijft die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen, stelt, na overleg
      met betrokken partijen, eens in de drie jaar een passend plan vast voor het in ontvangst nemen en verder beheren
      van afvalstoffen, en legt dit plan ter goedkeuring voor aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.107
  - number: '4.108'
    text: |-
      Ten aanzien van een jachthaven die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen en is aangewezen
      krachtens [artikel 6 van de Wet voorkoming verontreiniging door schepen][ref1], zijn de [artikelen 4.106][ref2] en
      [4.107][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.108
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.2
        afdeling: '4.8'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.2
        afdeling: '4.8'
  - number: 4.109.1
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het bereiden van voedingsmiddelen en daarmee
      samenhangende activiteiten wordt ten minste voldaan aan het derde tot en met het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.109
  - number: 4.109.2
    text: |-
      Indien niet in een vuilwaterriool geloosd kan worden, is lozen anders dan in een vuilwaterriool toegestaan indien
      het afvalwater gezamenlijk met huishoudelijk afvalwater wordt geloosd en de voorzieningen voor het zuiveren van
      huishoudelijk afvalwater zijn berekend op het zuiveren van het afvalwater van het bereiden van voedingsmiddelen en
      daarmee samenhangende activiteiten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.109
  - number: 4.109.3
    text: |-
      Afvalwater dat afvalstoffen bevat, die door versnijdende of vermalende apparatuur zijn versneden of vermalen, wordt
      niet geloosd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.109
  - number: 4.109.4
    text: |-
      Het vethoudende afvalwater wordt voorafgaand aan de vermenging met ander niet-vethoudend afvalwater geleid door een
      vetafscheider en slibvangput die voldoen aan en worden gebruikt conform NEN-EN 1825-1 en 2. In afwijking van NEN-EN
      1825-1 en 2 kan met een lagere frequentie van het ledigen en reinigen dan daarin vermeld worden volstaan indien een
      lagere frequentie geen nadelige gevolgen heeft met het oog op het doelmatig functioneren van de afscheider.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.109
  - number: 4.109.5
    text: |-
      Bij maatwerkvoorschrift kan het bevoegd gezag het vierde lid niet van toepassing verklaren en het lozen zonder
      een vetafscheider en slibvangput toestaan indien gelet op het vetgehalte in het te lozen afvalwater in combinatie
      met de hoeveelheid te lozen afvalwater, het lozen geen nadelige gevolgen heeft voor de doelmatige werking van de
      voorzieningen voor het beheer van afvalwater. [Artikel 2.2, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.109
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '4.110'
    text: |-
      Bij het bereiden van voedingsmiddelen worden ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk
      is het tot een aanvaardbaar niveau beperken van geurhinder de bij ministeriële regeling te bepalen maatregelen
      toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.110
  - number: 4.111.1
    text: Het slachten van dieren en het bewerken van dierlijke bijproducten vindt inpandig plaats.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.111
  - number: 4.111.2
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het bewerken van dierlijke bijproducten of het
      reinigen en desinfecteren van ruimtes waar dieren zijn geslacht, karkassen zijn bewerkt, vlees is uitgesneden van
      karkassen of karkasdelen, vis is uitgesneden, organen worden verwerkt of dierlijke bijproducten worden bewerkt,
      wordt ten minste voldaan aan het derde tot en met het zesde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.111
  - number: 4.111.3
    text: |-
      Het afvalwater, bedoeld in het tweede lid, wordt voor vermenging met ander niet vethoudend afvalwater geleid door
      een vetafscheider en slibvangput die voldoen aan en worden gebruikt conform NEN-EN 1825-1 en 2. In afwijking van
      NEN-EN 1825-1 en 2 kan met een lagere frequentie van het legen en reinigen dan daar vermeld worden volstaan indien
      dit geen nadelige gevolgen heeft voor het doelmatig functioneren van de afscheider.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.111
  - number: 4.111.4
    text: |-
      Bij de plaatsing van een vetafscheider die wordt ingezet voor het afvalwater, bedoeld in het tweede lid, wordt een
      rapport opgesteld waarin staat beschreven hoe invulling is gegeven aan paragraaf 6.3 van NEN-EN 1825-2. Dit rapport
      wordt binnen de inrichting bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.111
  - number: 4.111.5
    text: |-
      Het afvalwater, bedoeld in het tweede lid, wordt voorafgaand aan het lozen op een vuilwaterriool niet onderworpen
      aan een biologische behandeling.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.111
  - number: 4.111.6
    text: |-
      Het bevoegd gezag kan, indien het belang van de bescherming van het milieu en in het bijzonder het belang van
      de bescherming van de doelmatige werking van de voorzieningen voor het beheer van afvalwater zich hiertegen niet
      verzetten, bij maatwerkvoorschrift het vijfde lid niet van toepassing verklaren.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.111
  - number: 4.111a.1
    text: |-
      Bij het broeien of koken van dierlijke bijproducten worden ten behoeve van het voorkomen dan wel, voor zover
      dat niet mogelijk is, het tot een aanvaardbaar niveau beperken van geurhinder de bij ministeriële regeling
      voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.111a
  - number: 4.111a.2
    text: 'Bij het pekelen wordt:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.111a
  - number: 4.111a.2.a
    text: |-
      ten behoeve van het realiseren van een verwaarloosbaar bodemrisico de bij ministeriële regeling voorgeschreven
      maatregelen toegepast,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.111a
  - number: 4.111a.2.b
    text: ter bescherming van de doelmatige werking van voorzieningen voor het beheer van afvalwater, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.111a
  - number: 4.111a.2.c
    text: |-
      ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de
      verontreiniging van een oppervlaktewaterlichaam,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.111a
  - number: '4.112'
    text: 'Bij het slachten van dieren wordt:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.112
  - number: 4.112.a
    text: |-
      ten behoeve van het realiseren van een verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling te
      stellen eisen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.112
  - number: 4.112.b
    text: |-
      ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van
      geurhinder ten minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.112
  - number: 4.113.1
    text: 'De verlichting ten behoeve van sportbeoefening in de buitenlucht is uitgeschakeld:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.113
  - number: 4.113.1.a
    text: tussen 23.00 uur en 07.00 uur; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.113
  - number: 4.113.1.b
    text: indien er geen sport beoefend wordt noch onderhoud plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.113
  - number: 4.113.2
    text: 'Het eerste lid is niet van toepassing op dagen of dagdelen in verband met:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.113
  - number: 4.113.2.a
    text: |-
      de viering van festiviteiten die bij of krachtens een gemeentelijke verordening zijn aangewezen, in de gebieden in
      de gemeente waarvoor de verordening geldt;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.113
  - number: 4.113.2.b
    text: |-
      de viering van andere festiviteiten die plaatsvinden in de inrichting, waarbij het aantal bij of krachtens een
      gemeentelijke verordening aan te wijzen dagen of dagdelen niet meer mag bedragen dan twaalf per kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.113
  - number: 4.113.2.c
    text: |-
      door het bevoegd gezag aangewezen activiteiten in een inrichting, anders dan festiviteiten als bedoeld in onderdeel
      b, waarbij het aantal aan te wijzen dagen of dagdelen gebaseerd op dit artikel tezamen niet meer bedraagt dan
      twaalf dagen per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.113
  - number: 4.113.3
    text: |-
      Een festiviteit of activiteit als bedoeld in het tweede lid die maximaal een etmaal duurt, maar die zowel voor als
      na 00.00 uur plaatsvindt, wordt hierbij beschouwd als plaatshebbende op één dag.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.113
  - number: 4.113a.1
    text: |-
      Het lozen van spuiwater uit recreatieve visvijvers in een oppervlaktewaterlichaam, op of in de bodem of in een
      voorziening voor de inzameling en het transport van afvalwater, niet zijnde een vuilwaterriool is toegestaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.113a
  - number: 4.113a.2
    text: Het lozen van spuiwater uit recreatieve visvijvers in een vuilwaterriool is verboden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.113a
  - number: '4.114'
    text: |-
      Bij het opladen van accu’s die vloeibare bodembedreigende stoffen bevatten wordt ten behoeve van het realiseren van
      een verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.114
  - number: '4.115'
    text: |-
      Bij het in werking hebben van een noodstroomaggregaat wordt ten behoeve van het realiseren van een verwaarloosbaar
      bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.115
  - number: '4.116'
    text: 'Bij het traditioneel schieten wordt:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.116
  - number: 4.116.a
    text: |-
      in afwijking van [artikel 2.9, eerste lid][ref1], ten behoeve van het voorkomen dan wel, voor zover dat niet
      mogelijk is, zoveel mogelijk beperken van de belasting van de bodem, en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.116
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 4.116.b
    text: |-
      ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, ten minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.116
  - number: '4.117'
    text: |-
      Het is verboden in een crematieoven kisten te verbranden die met lood of zink bekleed zijn. Metalen en kunststof
      handvatten en andere versierselen van kunststof of metaal worden voor invoer van de kist verwijderd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.117
  - number: '4.118'
    text: 'Bij het in werking hebben van een crematieoven worden ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.118
  - number: 4.118.a
    text: het zo volledig mogelijk verbranden van rookgassen, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.118
  - number: 4.118.b
    text: het zo veel mogelijk beperken van het ontstaan van stikstofoxiden,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.118
  - number: '4.119'
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het in werking hebben van een crematieoven de
      emissieconcentratie van kwik en kwikverbindingen niet meer dan 0,05 milligram per normaal kubieke meter, indien de
      massastroom van kwik naar de lucht gelijk is aan of groter is dan 0,25 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.119
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '4.120'
    text: |-
      In afwijking van [artikel 2.9, eerste lid][ref1], worden bij het verstrooien van crematie-as op een strooiveld ten
      behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, zoveel mogelijk beperken van de belasting van
      de bodem de bij ministeriële regeling voorgeschreven maatregelen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.120
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: '4.122'
    text: |-
      Deze paragraaf is van toepassing op inrichtingen waarbij sprake is van een laboratorium of een praktijkruimte,
      met uitzondering van praktijkruimten voor het middelbaar onderwijs en laboratoria ten behoeve van huisartsen,
      dierenartsen, apothekers, tandartsen of tandtechnici.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.122
  - number: '4.123'
    text: |-
      Bij het lozen van afvalwater afkomstig van een laboratorium of een praktijkruimte op het vuilwaterriool wordt ten
      behoeve van de bescherming van het milieu ten minste voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.123
  - number: 4.124.1
    text: |-
      Bij het lozen van afvalwater afkomstig van een laboratorium of een praktijkruimte in een vuilwaterriool worden de
      emissiegrenswaarden, vermeld in tabel 4.124, niet overschreden.
            Tabel 4.124






                    Stof


                    Emissiegrenswaarde in milligram per liter






                    Kwik


                    0,01




                    Cadmium


                    0,02




                    Overige metalen, som van 5 metalen1)


                    2




                    Chloorkoolwaterstoffen CKW2)


                    0,1




                    BTEX


                    0,1




           1) Als som van 5 willekeurige metalen uit de volgende reeks: Ni, Cr, Pb, Se, As, Mo, Ti, Sn, Ba, Be, B, U,
      V, Co, Ag. 2) De 11 CKW die standaard bepaald worden in afvalwater betreffen: Dichloormethaan, Trichloormethaan,
      Tetrachloormethaan, Trichlooretheen, Tetrachlooretheen, 1,1-dichloorethaan, 1,2-dichloorethaan, 1,1,1-
      trichloorethaan, 1,1,2-trichloorethaan, cis-1,2-dichlooretheen, trans-1,2-dichlooretheen. De chloorkoolwaterstoffen
      worden als som bepaald. De in tabel 4.124 genoemde emissiewaarden gelden voor steekmonsters. Indien sprake is van
      representatieve etmaalbemonstering geldt voor de «overige metalen, som van 5 metalen» een factor 2 lagere waarde (1
      mg/l).
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.124
  - number: 4.124.2
    text: 'Het bevoegd gezag kan bij maatwerkvoorschrift:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.124
  - number: 4.124.2.a
    text: |-
      de emissiegrenswaarden, bedoeld in het eerste lid, niet van toepassing verklaren en lagere emissiegrenswaarden
      vaststellen dan de emissiegrenswaarden, bedoeld in dat lid, indien het te lozen afvalwater meer dan 10.000 kubieke
      meter per jaar bedraagt en met toepassing van de beste beschikbare technieken aan deze lagere emissiegrenswaarden
      kan worden voldaan;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.124
  - number: 4.124.2.b
    text: |-
      de emissiegrenswaarden, bedoeld in het eerste lid, niet van toepassing verklaren en hogere emissiegrenswaarden
      bepalen dan de emissiegrenswaarden, bedoeld in dat lid, indien aan de emissiegrenswaarden, bedoeld in het eerste
      lid met toepassing van de beste beschikbare technieken niet kan worden voldaan en het belang van de bescherming van
      het milieu zich niet tegen het lozen met hogere emissiegrenswaarden verzet.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.124
  - number: 4.124.3
    text: Het te lozen afvalwater, bedoeld in het eerste lid, kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.124
  - number: 4.125.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij activiteiten die leiden tot stofvormige emissies
      afkomstig van een laboratorium of een praktijkruimte naar de lucht, de emissieconcentratie van de stoffen
      behorend tot de stofklassen S, sO, sA1, sA2 en sA3 naar de lucht niet meer dan de voor die betreffende stofklasse
      genoemde emissieconcentratie-eis in [artikel 2.5][ref3] indien de massastroom gelijk is aan of groter is dan de in
      [artikel 2.5][ref4] voor de betreffende stofklasse genoemde grensmassastroom.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.125
    references:
