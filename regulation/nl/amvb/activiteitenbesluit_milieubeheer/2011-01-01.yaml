        artikel: '8'
  - number: 6.19b.2
    text: |-
      Indien het eerste lid van toepassing is, dan is de geurbelasting als gevolg van een zuiveringtechnisch werk ter
      plaatse van geurgevoelige objecten niet meer dan 1,5 odour units per kubieke meter lucht als 98-percentiel.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.19b
  - number: 6.19b.3
    text: |-
      In afwijking van het tweede lid is de geurbelasting als gevolg van een zuiveringtechnisch werk ter plaatse van
      geurgevoelige objecten gelegen op een gezoneerd industrieterrein, een bedrijventerrein danwel buiten de bebouwde
      kom niet meer dan 3,5 odour units per kubieke meter lucht als 98-percentiel.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.19b
  - number: 6.19b.4
    text: |-
      Voor een zuiveringtechnisch werk waarvoor onmiddellijk voorafgaand aan tijdstip van
      het van toepassing worden van [artikel 3.5b][ref1] een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2], in werking en
      onherroepelijk was, zijn het tweede en derde lid en artikel 3.5b, eerste en tweede lid, niet van toepassing op
      de geurbelasting ter plaatse van geurgevoelige objecten die op het moment van verlening van de vergunning niet
      aanwezig waren of in de vergunning niet als geurgevoelig werden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.19b
