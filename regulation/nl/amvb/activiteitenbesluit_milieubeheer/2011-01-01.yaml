    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.3
  - number: 2.3.1.t
    text: ISO 11083 ten aanzien van chroom VI.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.3
  - number: 2.3.2
    text: |-
      De monstername ten behoeve van de emissiemetingen ter controle van de naleving van de emissie-eisen voor het lozen
      wordt uitgevoerd volgens NEN-6600-1 en de conservering van het monster wordt uitgevoerd volgens NEN-EN-ISO 5667-3.
      Het monster wordt niet gefiltreerd en de onopgeloste stoffen worden meegenomen in de analyse.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      In afwijking van het eerste en tweede lid kunnen andere methoden voor emissiemetingen, monstername en conservering
      worden gebruikt, indien deze gelijkwaardig zijn aan de in die leden genoemde methoden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      De [artikelen 2.5][ref1] en [2.6][ref2] zijn uitsluitend van toepassing op emissies van stoffen bij activiteiten
      waarvoor bij of krachtens de [artikelen 3.38][ref3], [3.43][ref4], [4.21][ref5], [4.23][ref6], [4.27][ref7],
      [4.29][ref8], [4.33 tot en met 4.35][ref9], [4.40 tot en met 4.42][ref10], [4.44 tot en met 4.46][ref11],
