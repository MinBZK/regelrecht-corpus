  - number: 1.3.5
    text: |-
      Met de bij of krachtens dit besluit genoemde niet-publiekrechtelijke regelingen, de NeR en de NRB, voor zover de
      tekst daarvan ingevolge het bepaalde krachtens [artikel 1.7, derde lid][ref1], bij de toepassing van dit besluit in
      acht moet worden genomen, worden gelijkgesteld regels die zijn vastgesteld en bekendgemaakt in een andere lidstaat
      van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een
      daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en een beschermingsniveau bieden dat ten
      minste gelijkwaardig is aan het niveau dat met de nationale regels wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.3
