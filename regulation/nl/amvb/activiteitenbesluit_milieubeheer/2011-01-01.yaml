        hoofdstuk: '4'
        paragraaf: 4.6.4
        afdeling: '4.6'
  - number: 6.34.3
    text: |-
      Indien het inpandig afleveren van lichte olie op grond van het tweede lid is toegestaan, geschiedt dit in het
      belang van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk
      is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen
      en de gevolgen hiervan ten minste via een systeem voor dampretour Stage-II.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.34
  - number: 6.34.4
    text: |-
      Op het inpandig afleveren van lichte olie, bedoeld in het derde lid, is
      [artikel 4.80, tweede tot en met zevende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.34
