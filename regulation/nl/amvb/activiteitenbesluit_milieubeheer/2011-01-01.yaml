        afdeling: '1.1'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.29'
  - number: 6.1.3
    text: |-
      De voorschriften van een vergunning als bedoeld in het eerste lid dan wel de nadere eisen op grond van de
      besluiten, bedoeld in [artikel 6.43][ref1], die voor een inrichting onmiddellijk voorafgaand aan het tijdstip
      van het van toepassing worden van [artikel 1.4, eerste, tweede of derde lid][ref2], op die inrichting in
      werking en onherroepelijk waren en niet vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van
      maatwerkvoorschriften, worden indien op grond van dit besluit strengere bepalingen gelden, gedurende zes maanden
      aangemerkt als maatwerkvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.1
    references:
