        paragraaf: 4.1.3
        afdeling: '4.1'
  - number: 6.25a.2
    text: |-
      Indien in een inrichting ten minste twee bovengrondse opslagtanks bestemd voor de opslag van zuurstof, elk met
      een inhoud van ten minste 25 kubieke meter aanwezig zijn, geldt gedurende twaalf maanden met ingang van de datum,
      waarop op grond van [artikel 4.5, tweede lid][ref1], geen inhoudsgrens geldt, dat elke tank is gelegen op een
      afstand van ten minste 20 meter van kwetsbare of beperkt kwetsbare objecten.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
