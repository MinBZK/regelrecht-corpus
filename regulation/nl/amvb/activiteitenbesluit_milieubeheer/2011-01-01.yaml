      emissiebeperkende techniek die door de inrichting wordt ingezet om aan de [artikelen 2.5][ref1], [2.6][ref2],
      [3.38][ref3], [3.43][ref4], [4.21][ref5], [4.23][ref6], [4.27][ref7], [4.29][ref8], [4.33 tot en met 4.35][ref9],
      [4.40 tot en met 4.42][ref10], [4.44 tot en met 4.46][ref11], [4.50][ref12], [4.54][ref13], [4.58][ref14],
