    text: |-
      5 milligram per normaal kubieke meter, indien de massastroom van totaal stof naar de lucht gelijk is aan of groter
      is dan 200 gram per uur; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.44
  - number: 4.44.1.b
    text: niet meer dan 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.44
  - number: 4.44.2
    text: |-
      Het eerste lid is niet van toepassing op zachtsolderen indien het jaarverbruik van soldeermiddel minder bedraagt
      dan 250 ton.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.44
  - number: '4.45'
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij hardsolderen met cadmiumhoudend soldeermiddel de
      emissieconcentratie van cadmium en cadmiumverbindingen, niet meer dan 0,05 milligram per normaal kubieke meter
      indien de massastroom van cadmium en cadmiumverbindingen naar de lucht meer bedraagt dan 10 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.45
