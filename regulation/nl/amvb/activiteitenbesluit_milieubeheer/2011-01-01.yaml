      als bedoeld in de [artikelen 2.5][ref1] en [2.6][ref2] ten aanzien van alle activiteiten waarvoor bij of krachtens
      de [hoofdstukken 3][ref3] en [4][ref4] eisen ten aanzien van emissies naar de lucht zijn gesteld indien:


