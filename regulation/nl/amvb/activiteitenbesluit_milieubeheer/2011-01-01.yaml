        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: 6.18.2
    text: |-
      Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat het lozen, bedoeld in artikel 3.3, eerste lid, in het
      vuilwaterriool van afvloeiend hemelwater dat niet afkomstig is van een bodembeschermende voorziening, dat reeds
      plaatsvond voorafgaand aan het tijdstip, bedoeld in het eerste lid, binnen een in dat maatwerkvoorschrift gestelde
      termijn wordt gestaakt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.18
  - number: 6.19.1
    text: |-
      In afwijking van [artikel 3.4, tweede lid, onderdeel a][ref1], wordt de afstand tot het dichtstbijzijnde
      vuilwaterriool of zuiveringtechnisch werk bij voortzetting van het lozen van huishoudelijk afvalwater op of in
      de bodem dat voor 1 juli 1990 al regelmatig plaatsvond, berekend vanaf het gedeelte van het gebouw dat zich het
      dichtst bij een vuilwaterriool of een zuiveringtechnisch werk bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.19
