  - number: 6.19b.5
    text: |-
      Bij de verandering van een zuiveringtechnisch werk als bedoeld in het eerste en vierde lid is de
      geurbelasting ter plaatse van geurgevoelige objecten als gevolg van een zuiveringtechnisch werk niet
      hoger dan de geurbelasting onmiddellijk voorafgaand aan de verandering, tenzij de waarden, bedoeld in
      [artikel 3.5b, eerste en tweede lid][ref1], niet worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
