    text: |-
      [Artikel 4.109, vierde lid][ref1], is niet van toepassing indien voor de inwerkingtreding van dat lid een
      slibvangput en een vetafscheider zijn geplaatst die voldoen aan en worden gebruikt conform NEN 7087.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.36
    references:
