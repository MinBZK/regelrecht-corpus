  - number: 2.17.1.b
    text: |-
      de in de periode tussen 07.00 en 19.00 uur in tabel 2.17a opgenomen maximale geluidsniveaus L niet van toepassing
      zijn op laad- en losactiviteiten;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.1.c
    text: |-
      de in tabel 2.17a aangegeven waarden binnen in- of aanpandige gevoelige gebouwen niet gelden indien de gebruiker
      van deze gevoelige gebouwen geen toestemming geeft voor het in redelijkheid uitvoeren of doen uitvoeren van
      geluidsmetingen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.1.d
    text: de in tabel 2.17a aangegeven waarden op de gevel ook gelden bij gevoelige terreinen op de grens van het terrein;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.1.e
    text: |-
      de waarden in in- en aanpandige gevoelige gebouwen slechts gelden in geluidsgevoelige ruimten en verblijfsruimten;
      en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.1.f
    text: |-
      de in tabel 2.17a aangegeven waarden niet gelden op gevoelige objecten die zijn gelegen op een gezoneerd
      industrieterrein.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.2
    text: |-
      Ten aanzien van een inrichting die is gelegen op een gezoneerd industrieterrein, waarbij binnen een afstand van
      50 meter geen gevoelige objecten, anders dan gevoelige objecten gelegen op het gezoneerde industrieterrein, zijn
      gelegen, bedraagt in afwijking van het eerste lid, het langtijdgemiddeld beoordelingsniveau (L) veroorzaakt door
      de in de inrichting aanwezige installaties en toestellen, alsmede door die inrichting verrichte werkzaamheden en
      activiteiten niet meer dan de in tabel 2.17b bij het betreffende tijdstip aangegeven waarde. De eerste volzin is
      niet van toepassing op windturbines.
            Tabel 2.17b









                    07.00–19.00 uur


                    19.00–23.00 uur


                    23.00–07.00 uur






                    L op een afstand van 50 meter vanaf de grens van de inrichting


                    50 dB(A)


                    45 dB(A)


                    40 dB(A)
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.3
    text: 'In afwijking van het eerste lid geldt voor een inrichting die is gelegen op een bedrijventerrein, dat:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.3.a
    text: |-
      het langtijdgemiddelde beoordelingsniveau (L) en het maximaal geluidsniveau (L) op de in tabel 2.17c genoemde
      plaatsen en tijdstippen niet meer bedragen dan de in die tabel aangegeven waarden;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.3.b
    text: |-
      de in de periode tussen 07:00 uur en 19:00 uur in tabel 2.17c opgenomen maximale geluidsniveaus (L) niet van
      toepassing zijn op laad- en losactiviteiten;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.3.c
    text: |-
      de in tabel 2.17c aangeven waarden binnen in- of aanpandige gevoelige gebouwen niet van toepassing zijn, indien de
      gebruiker van deze gevoelige gebouwen geen toestemming geeft voor het in redelijkheid uitvoeren of doen uitvoeren
      van geluidsmetingen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.3.d
    text: |-
      de in tabel 2.17c aangegeven waarden op de gevel ook van toepassing zijn bij gevoelige terreinen op de grens van
      het terrein;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.3.e
    text: |-
      de waarden in in- en aanpandige gevoelige gebouwen slechts gelden in geluidsgevoelige ruimten en verblijfsruimten,
      en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.3.f
    text: |-
      de in tabel 2.17c aangegeven waarden gelden niet op gevoelige objecten die zijn gelegen op een gezoneerd
      industrieterrein.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.4
    text: |-
      In afwijking van het eerste en het tweede lid, geldt voor het langtijdgemiddeld beoordelingsniveau (L) en het
      maximaal geluidsniveau (L, bij een inrichting die uitsluitend of in hoofdzaak bestemd is voor openbare verkoop van
      vloeibare brandstoffen, mengsmering of aardgas aan derden voor motorvoertuigen voor het wegverkeer, dat:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.4.a
    text: |-
      de geluidsniveaus op de in tabel 2.17d genoemde plaatsen en tijdstippen niet meer bedragen dan de in die tabel
      aangegeven waarden;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel2.17
  - number: 2.17.4.b
    text: |-
      de in de periode tussen 07.00 en 21.00 uur in tabel 2.17d opgenomen maximale geluidsniveaus L niet van toepassing
      zijn op laad- en losactiviteiten;
                Tabel 2.17d








                        07:00–21:00 uur


