  - number: 3.31.3.a.1°
    text: een autodemontagebedrijf;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.31
  - number: 3.31.3.a.2°
    text: een zuiveringtechnisch werk, of
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.31
  - number: 3.31.3.a.3°
    text: |-
      een inrichting waar uitvoering wordt gegeven aan [titel 10.4 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 3.31.3.b
    text: |-
      het lozen in een aangewezen oppervlaktewaterlichaam als gevolg van het op- en overslaan van andere goederen dan
      inerte goederen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.31
  - number: 3.31.4
    text: Bij ministeriële regeling worden goederen aangewezen welke in ieder geval worden aangemerkt als inerte goederen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.31
  - number: '3.32'
    text: 'Goederen worden in de buitenlucht zodanig op- of overgeslagen dat:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.32
  - number: 3.32.a
    text: |-
      zoveel mogelijk wordt voorkomen dat stofverspreiding optreedt die op een afstand van meer dan 2 meter van de bron
      met het blote oog waarneembaar is;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.32
  - number: 3.32.b
    text: verontreiniging van de omgeving zoveel mogelijk wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.32
  - number: 3.32.c
    text: zoveel mogelijk wordt voorkomen dat goederen in een oppervlaktewaterlichaam geraken;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.32
  - number: 3.32.d
    text: zoveel mogelijk wordt voorkomen dat goederen in een voorziening voor het beheer van afvalwater geraken.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.32
  - number: 3.33.1
    text: |-
      Het in een oppervlaktewaterlichaam, op of in de bodem of in een voorziening voor de inzameling en het transport
      van afvalwater, niet zijnde een vuilwaterriool, lozen van afvalwater dat in contact is geweest met inerte goederen,
      is toegestaan indien het gehalte aan onopgeloste stoffen in enig steekmonster niet meer bedraagt dan 300 milligram
      per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.33
  - number: 3.33.2
    text: |-
      Het in een vuilwaterriool lozen van afvalwater dat in contact is geweest met inerte goederen vindt slechts dan
      in een vuilwaterriool plaats indien het lozen, bedoeld in het eerste lid, redelijkerwijs niet mogelijk is en het
      gehalte aan onopgeloste stoffen niet meer bedraagt dan 300 milligram per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.33
  - number: 3.33.3
    text: |-
      Het bevoegd gezag kan in het belang van de bescherming van het milieu met betrekking tot het lozen, bedoeld in het
      tweede lid, bij maatwerkvoorschrift voor onopgeloste stoffen lagere emissiegrenswaarden vaststellen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.33
  - number: 3.33.4
    text: Het te lozen afvalwater, bedoeld in het eerste en tweede lid, kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.33
  - number: 3.33.5
    text: |-
      Indien de opgeslagen inerte goederen worden bevochtigd, wordt afvalwater dat met opgeslagen goederen in contact is
      geweest, zoveel mogelijk voor dit bevochtigen gebruikt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.33
  - number: 3.34.1
    text: |-
      Bij het lozen van afvalwater afkomstig van het op- en overslaan van goederen, niet zijnde inerte goederen, wordt
      ten minste voldaan aan het tweede tot en met negende lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.34.2
    text: |-
      Indien opgeslagen goederen als bedoeld in het eerste lid worden bevochtigd, wordt afvalwater dat met die goederen
      in contact is geweest, zoveel mogelijk voor dit bevochtigen gebruikt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.34.3
    text: |-
      Het in een aangewezen oppervlaktewaterlichaam lozen van afvalwater dat in contact is geweest met goederen als
      bedoeld in het eerste lid waaruit geen vloeibare bodembedreigende stoffen kunnen lekken, is toegestaan indien in
      enig steekmonster de emissiegrenswaarden, vermeld in tabel 3.34, niet worden overschreden.
            Tabel 3.34






                    Parameter


                    Emissiegrenswaarde






                    Chemisch zuurstof verbruik


                    200 milligram per liter




                    Onopgeloste stoffen


                    300 milligram per liter




                    Som zware metalen (som van arseen, chroom, koper, lood, nikkel en zink)


                    1 milligram per liter




                    Minerale olie


                    20 milligram per liter




                    PAK’s (som van naftaleen, anthraceen, fluorantheen, benzo(g, h, i,)peryleen, benzo(a)pyreen,
      benzo(b)fluorantheen, benzo(k)fluorantheen en indeno(1, 2, 3-cd)pyreen)


                    50 microgram per liter




                    Extraheerbaar organisch chloor


                    5 microgram per liter




                    Totaal stikstof


                    10 milligram per liter




                    Fosfor


                    2 milligram per liter
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.34.4
    text: |-
      Het bevoegd gezag kan met betrekking tot het lozen, bedoeld in het derde lid, bij maatwerkvoorschrift hogere
      emissiegrenswaarden vaststellen, voor zover het belang van de bescherming van het milieu zich daartegen niet
      verzet.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.34.5
    text: |-
      Het bevoegd gezag kan in belang van bescherming van het milieu met betrekking tot het lozen, bedoeld in het derde
      lid, bij maatwerkvoorschrift voor onopgeloste stoffen lagere emissiegrenswaarden vaststellen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.34.6
    text: |-
      Het lozen van afvalwater, bedoeld in het derde lid, in een vuilwaterriool is toegestaan indien het gehalte aan
      onopgeloste stoffen niet meer bedraagt dan 300 milligram per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.34.7
    text: |-
      Het lozen van afvalwater dat in contact is geweest met goederen als bedoeld in het eerste lid waaruit vloeibare
      bodembedreigende stoffen kunnen lekken in een vuilwaterriool is toegestaan indien enig steekmonster niet meer bevat
      dan:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.34.7.a
    text: 20 milligram olie per liter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.34.7.b
    text: 300 milligram onopgeloste stoffen per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.34.8
    text: |-
      In afwijking van het zevende lid mag het gehalte aan olie ten hoogste 200 milligram per liter in enig steekmonster
      bedragen, indien het afvalwater voorafgaand aan vermenging met ander afvalwater wordt geleid door een slibvangput
      en olieafscheider die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.34.9
    text: |-
      Het te lozen afvalwater, bedoeld in het derde tot en met achtste lid, kan op een doelmatige wijze worden
      bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.34.10
    text: |-
      Bij ministeriële regeling worden goederen aangewezen die voor de toepassing van deze paragraaf in ieder geval
      worden aangemerkt als goederen waaruit vloeibare bodembedreigende stoffen kunnen lekken.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.34
  - number: 3.35.1
    text: |-
      Het boven een oppervlaktewaterlichaam opslaan van goederen, niet zijnde inerte goederen, vindt niet plaats, tenzij
      het opslaan benedendeks plaatsvindt op een binnenschip.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.35
  - number: 3.35.2
    text: |-
      Indien goederen, niet zijnde inerte goederen, boven een oppervlaktewaterlichaam aanwezig zijn, wordt ten behoeve
      van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van een
      oppervlaktewaterlichaam voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.35
  - number: 3.36.1
    text: |-
      Bij het opslaan en overslaan van goederen, niet zijnde inerte goederen, wordt ten behoeve van het realiseren van
      een verwaarloosbaar bodemrisico, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.36
  - number: 3.36.2
    text: |-
      Bij het opslaan en overslaan van bederfelijke afvalstoffen wordt ten behoeve van het voorkomen dan wel beperken van
      geurhinder voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.36
  - number: 3.37.1
    text: |-
      Bij de volgende windsnelheden vinden afhankelijk van de stuifgevoeligheid van de goederen, behorend tot de
      stuifklassen volgens bijlage 4.6 van de NeR, geen overslagactiviteiten plaats:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.37
  - number: 3.37.1.a
    text: S1 en S2 bij een windsnelheid groter dan 8 meter per seconde;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.37
  - number: 3.37.1.b
    text: S3 bij een windsnelheid groter dan 14 meter per seconde.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.37
  - number: 3.37.2
    text: |-
      Indien degene die de inrichting drijft aantoont dat door het treffen van maatregelen verspreiding en morsing van
      losse goederen ten gevolge van de weersomstandigheden wordt voorkomen kan het bevoegd gezag bij maatwerkvoorschrift
      het eerste lid niet van toepassing verklaren en overslagactiviteiten bij grotere windsnelheden dan aangegeven
      in het eerste lid onder voorwaarden toestaan. Deze voorwaarden kunnen betrekking hebben op de toe te passen
      maatregelen om verspreiding of morsing van goederen te voorkomen of op hogere maximale windsnelheden dan genoemd in
      het eerste lid, waarboven overslag niet meer is toegestaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.37
  - number: 3.38.1
    text: |-
      Het opslaan en mengen van goederen behorend tot stuifklassen S1 of S3 van bijlage 4.6 van de NeR vindt plaats in
      gesloten ruimtes.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.38
  - number: 3.38.2
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het opslaan, overslaan en mengen van stuifgevoelige
      goederen in gesloten ruimtes de emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 3.38.2.a
    text: |-
      5 milligram per normaal kubieke meter, indien de massastroom van totaal stof gelijk is aan of groter is dan
      200 gram per uur; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.38
  - number: 3.38.2.b
    text: 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.38
  - number: 3.38.3
    text: |-
      Bij pneumatisch transport van stuifgevoelige goederen behorend tot stuifklasse S1 of S2 van bijlage 4.6 van de
      NeR is de emissie van totaal stof uit een container, bulktransportwagen of ander transportmiddel niet hoger dan
      10 milligram per normaal kubieke meter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.38
  - number: '3.39'
    text: |-
      Bij het opslaan, overslaan en mengen van stuifgevoelige goederen in gesloten ruimtes worden ten behoeve van het
      voorkomen dan wel beperken van diffuse emissie en om het doelmatig verspreiden van emissies naar de buitenlucht te
      bevorderen ten minste de bij ministeriële regeling voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.39
  - number: 3.40.1
    text: |-
      Bij het voldoen aan [artikel 3.32, onder a en b][ref1], wordt de opslag van asbesthoudende afvalstoffen bij
      een inrichting waar uitvoering wordt gegeven aan [titel 10.4 van de wet][ref2] ten minste overeenkomstig
      [artikel 7 van het Asbestverwijderingsbesluit 2005][ref3] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0019316#Artikel7
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0003245
      - id: ref3
        bwb_id: BWBR0019316
        artikel: '7'
  - number: 3.40.2
    text: |-
      In afwijking van [artikel 2.9][ref1], zijn de [afdelingen 2.2](onbekend), [2.3](onbekend) en [2.4 van het Besluit
      landbouw milieubeheer](onbekend) van overeenkomstige toepassing op het opslaan van vaste mest en het composteren
      van groenafval, afgedragen gewas of bloembollenafval.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: '3.41'
    text: 'Deze paragraaf is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.41
  - number: 3.41.a
    text: het demonteren van autowrakken;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.41
  - number: 3.41.b
    text: het aftappen van vloeistoffen uit autowrakken;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.41
  - number: 3.41.c
    text: |-
      het opslaan van bij het demonteren van autowrakken en het aftappen van vloeistoffen uit autowrakken vrijkomende
      afvalstoffen, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.41
  - number: 3.41.d
    text: het neutraliseren van airbags en gordelspanners.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.41
  - number: '3.42'
    text: |-
      Bij de activiteiten, bedoeld in artikel [3.41][ref1], wordt ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.7
        afdeling: '3.3'
  - number: 3.42.a
    text: een doelmatig beheer van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.42
  - number: 3.42.b
    text: |-
      het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan, en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.42
  - number: 3.42.c
    text: het realiseren van een verwaarloosbaar bodemrisico;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.42
  - number: 3.43.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het ontsteken van airbags en gordelspanners de
      emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 3.43.1.a
    text: |-
      5 milligram per normaal kubieke meter, indien de massastroom van totaal stof naar de lucht gelijk is aan of groter
      is dan 200 gram per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.43
  - number: 3.43.1.b
    text: 50 milligram per normaal kubieke meter indien de massastroom
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.43
  - number: 3.43.2
    text: |-
      Bij het ontsteken van airbags en gordelspanners worden ten behoeve van het voorkomen dan wel het beperken van
      diffuse emissies en het doelmatig verspreiden van emissies naar de buitenlucht, de bij ministeriële regeling
      voorgeschreven maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.43
  - number: 3.44.1
    text: |-
      Bij het in het vuilwaterriool lozen van afvalwater afkomstig van het demonteren van autowrakken wordt ten minste
      voldaan aan het tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.44
  - number: 3.44.2
    text: 'Het afvalwater bevat in enig steekmonster niet meer dan:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.44
  - number: 3.44.2.a
    text: 20 milligram olie per liter;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.44
  - number: 3.44.2.b
    text: 300 milligram onopgeloste stoffen per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.44
  - number: 3.44.3
    text: |-
      In afwijking van het tweede lid mag het gehalte aan olie ten hoogste 200 milligram per liter in enig steekmonster
      bedragen, indien het afvalwater voorafgaand aan vermenging met ander afvalwater wordt geleid door een slibvangput
      en olieafscheider die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.44
  - number: 3.44.4
    text: Het te lozen afvalwater kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel3.44
  - number: 4.1.1
    text: |-
      De verpakking en de opslag van gevaarlijke stoffen en CMR-stoffen in verpakking voldoen ten behoeve van het
      voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel
      mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen
      hiervan, ten minste aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Indien in een opslagvoorziening bestemd voor de opslag van gevaarlijke stoffen en CMR-stoffen in verpakking meer
      dan 2.500 kilogram gevaarlijke stoffen, niet zijnde gasflessen behorende tot de ADR klasse 2, aanwezig zijn,
      bedraagt de afstand tussen de opslagvoorziening en de dichtstbijzijnde woning van derden ten minste 20 meter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Indien de opslagvoorziening bestemd voor de opslag van gevaarlijke stoffen en CMR-stoffen in verpakking is
      uitgevoerd als brandcompartiment of indien tussen de opslagvoorziening en de woning van derden een brandwerende
      voorziening van voldoende omvang aanwezig is, bedraagt de afstand, bedoeld in het tweede lid, ten minste 8 meter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Het tweede en derde lid zijn niet van toepassing indien in de opslagvoorziening geen brandbare gevaarlijke stoffen
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
  - number: 4.1.5
    text: |-
      Indien in een in de buitenlucht gesitueerde opslagvoorziening meer dan 1.000 liter brandbare gassen in gasflessen
      gemeten naar de totale waterinhoud aanwezig zijn, bedraagt de afstand tussen de opslagvoorziening en de
      dichtstbijzijnde woning van derden ten minste 15 meter. Indien tussen de opslagvoorziening en de woning van derden
      een brandwerende voorziening van voldoende omvang aanwezig is, bedraagt de afstand, bedoeld in de eerste zin, ten
      minste 7,5 meter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
  - number: 4.1.6
    text: |-
      Het voorhanden hebben en het gebruik van gasflessen die gevuld zijn met autogas is verboden, met uitzondering
      van wisselreservoirs ten behoeve van interne transportmiddelen. De eerste volzin is niet van toepassing op
      gedemonteerde LPG-tanks van motorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
  - number: 4.1.7
    text: |-
      De verpakking en de opslag van vloeibare bodembedreigende stoffen in verpakking en afvalstoffen waaruit vloeibaar
      bodembedreigende stoffen kunnen lekken voldoen ten behoeve van het realiseren van een verwaarloosbaar bodemrisico,
      aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
  - number: 4.1.8
    text: |-
      Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      verontreiniging van een oppervlaktewaterlichaam is het boven een oppervlaktewaterlichaam opslaan van gevaarlijke
      stoffen in verpakking, CMR-stoffen in verpakking, bodembedreigende stoffen in verpakking en van lege, ongereinigde
      verpakkingen van gevaarlijke stoffen, CMR-stoffen en vloeibare bodembedreigende stoffen verboden, met uitzondering
      van:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
  - number: 4.1.8.a
    text: |-
      het opslaan benedendeks op een binnenschip dat beschikt over een certificaat van onderzoek als bedoeld in
      [artikel 6 van het Binnenvaartbesluit][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel6
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '6'
  - number: 4.1.8.b
    text: het opslaan van gasflessen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
  - number: 4.1.9
    text: |-
      Indien gevaarlijke stoffen of CMR-stoffen in verpakking of vloeibare bodembedreigende stoffen in verpakking boven
      een oppervlaktewaterlichaam aanwezig zijn, wordt ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk
      is het zoveel mogelijk beperken van verontreiniging van een oppervlaktewaterlichaam ten minste voldaan aan de bij
      ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
  - number: 4.1.10
    text: |-
      Dit artikel is niet van toepassing op de opslag van vuurwerk, pyrotechnische artikelen voor theatergebruik, andere
      ontplofbare stoffen, asbest, gedemonteerde airbags, gordelspanners en vaste kunstmeststoffen in verpakking.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Inbeslaggenomen vuurwerk met aan consumentenvuurwerk vergelijkbare eigenschappen dat wordt opgeslagen in
      politiebureaus en theatervuurwerk wordt opgeslagen in een brandveiligheidsopslagkast, die voldoet aan de bij
      ministeriële regeling te stellen eisen ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone
      voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving
      en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      De opslag van vuurwerk of pyrotechnische artikelen voor theatergebruik vindt niet plaats in combinatie met het
      afleveren van vloeibare brandstof, mengsmering of aardgas ten behoeve van openbare verkoop voor motorvoertuigen
      voor het wegverkeer.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Zwart kruit, rookzwak kruit en noodsignalen worden opgeslagen in een brandcompartiment dat voldoet aan de bij
      ministeriële regeling te stellen eisen ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone
      voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving
      en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.3
  - number: 4.3.2
    text: |-
      Een brandcompartiment bestemd voor de opslag van zwart kruit of rookzwak kruit is gelegen op een afstand van ten
      minste 8 meter van kwetsbare of beperkt kwetsbare objecten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Een voorziening voor de opslag van meer dan 10.000 patronen voor vuurwapens, dan wel onderdelen daarvan, is gelegen
      op een afstand van ten minste 8 meter van kwetsbare of beperkt kwetsbare objecten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.4
  - number: 4.4.2
    text: |-
      Het eerste lid is niet van toepassing indien de voorziening, bedoeld in dat lid, in een brandcompartiment is
      gesitueerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.4
  - number: 4.5.1
    text: |-
      Bij het in gebruik hebben en het beëindigen van het gebruik van een bovengrondse opslagtank die wordt dan wel
      werd gebruikt voor de opslag van zuurstof, koolzuur, lucht, argon, helium of stikstof wordt ten behoeve van het
      voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel
      mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen
      hiervan, voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.5
  - number: 4.5.2
    text: |-
      Indien in een inrichting een bovengrondse opslagtank, bestemd voor de opslag van zuurstof, op een afstand van
      minder dan 10 meter is gelegen van een andere opslagtank, bestemd voor de opslag van propaan, propeen of een gas
      als bedoeld in het eerste lid, is de opslagtank bestemd voor de opslag van zuurstof gelegen op een afstand van ten
      minste 20 meter van kwetsbare of beperkt kwetsbare objecten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.5
  - number: 4.5a.1
    text: |-
      Met betrekking tot de opstelplaats van een opslagtank met propeen, het vulpunt van een opslagtank met propeen en de
      opstelplaats van de tankwagen worden ten opzichte van buiten de inrichting gelegen kwetsbare en beperkt kwetsbare
      objecten, de in tabel 4.5a opgenomen afstanden in acht genomen, waarbij de afstanden gelden van het vulpunt en de
      bovengrondse opslagtank, gerekend vanaf de aansluitpunten van de leidingen alsmede het bovengrondse deel van de
      leidingen en de pomp bij de opslagtank:
            Tabel 4.5a veiligheidsafstanden








                    Bevoorrading tot en met 5 keer per jaar


                    Bevoorrading meer dan 5 keer per jaar






                    Opslagtank met propeen tot en met 5 kubieke meter


                    10 meter


                    20 meter




                    Opslagtank met propeen groter dan 5 kubieke meter tot en met 13 kubieke meter


                    15 meter


                    25 meter
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.5a
  - number: 4.5a.2
    text: |-
      Een opslagtank met propeen, het vulpunt van een opslagtank met propeen en de opstelplaats van de tankwagen is
      gelegen op ten minste de helft van de afstanden, genoemd in tabel 4.5a, indien het objecten betreft waar ook een
      opslagtank met propeen of propaan aanwezig is.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.5a
  - number: 4.5a.3
    text: |-
      In afwijking van het eerste lid worden met betrekking tot de opstelplaats van een opslagtank met propeen, het
      vulpunt van een opslagtank met propeen en de opstelplaats van de tankwagen ten opzichte van gebouwen bestemd voor
      het verblijf, al dan niet gedurende een gedeelte van de dag, van minderjarigen, ouderen, zieken of gehandicapten,
      dan wel gebouwen waarin doorgaans grote aantallen personen gedurende een groot gedeelte van de dag aanwezig zijn,
      de volgende afstanden in acht genomen:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.5a
  - number: 4.5a.3.a
    text: 'bij een opslagtank met propeen tot en met 5 kubieke meter: 25 meter;'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.5a
  - number: 4.5a.3.b
    text: 'bij een opslagtank met propeen van meer dan 5 kubieke meter tot en met 13 kubieke meter: 50 meter.'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.5a
  - number: 4.5a.4
    text: |-
      Onverminderd het eerste tot en met derde lid, voldoet een opslagtank met propeen alsmede de bijbehorende leidingen
      en appendages ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor
      zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone
      voorvallen zich voordoen en de gevolgen hiervan, aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.5a
  - number: '4.6'
    text: |-
      Bij het in gebruik hebben en het beëindigen van het gebruik van een bovengrondse opslagtank of een opslagtank boven
      een oppervlaktewaterlichaam die wordt dan wel werd gebruikt voor de opslag van vloeibare brandstof, afgewerkte
      olie, stoffen van ADR klasse 8 verpakkingsgroep II en III zonder bijkomend gevaar, PER, stoffen van ADR klasse 5.1
      of andere vloeibare bodembedreigende stoffen wordt ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.6
  - number: 4.6.a
    text: het realiseren van een verwaarloosbaar bodemrisico;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.6
  - number: 4.6.b
    text: |-
      het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.6
  - number: 4.6.c
    text: |-
      het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van een
      oppervlaktewaterlichaam,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.6
  - number: 4.7.1
    text: |-
      De afstand tussen een geparkeerde vervoerseenheid met gevaarlijke stoffen en een woning van derden bedraagt ten
      minste 20 meter. Deze afstand wordt gemeten vanaf de rand van de vervoerseenheid tot de gevel van de woning.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.7
  - number: 4.7.2
    text: |-
      In een geparkeerde vervoerseenheid met gevaarlijke stoffen zijn gevaarlijke stoffen van verpakkingsgroep I en
      gevaarlijke stoffen van de klasse ADR 1 of 6.2, met uitzondering van categorie I3 en I4 niet aanwezig.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.7
  - number: 4.7.3
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing op het opstellen van vervoerseenheden met gevaarlijke stoffen
      in verband met aanmelden of andere formaliteiten, of op het opstellen van vervoerseenheden met gevaarlijke stoffen
      voor het verrichten van laad- of loshandelingen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.7
  - number: 4.7.4
    text: |-
      Met betrekking tot het parkeren van vervoerseenheden met gevaarlijke stoffen wordt ten behoeve van het voorkomen
      van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk
      beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan,
      ten minste voldaan aan de bij ministeriële regeling te stellen eisen
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.7
  - number: '4.16'
    text: |-
      Een vulstation voor het vullen van gasflessen voldoet ten behoeve van het voorkomen van risico’s voor de omgeving
      en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s
      voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan aan de bij ministeriële
      regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.16
  - number: '4.17'
    text: |-
      Onverminderd [paragraaf 3.3.6][ref1] wordt bij het opslaan van vaste kunstmeststoffen ten behoeve van het voorkomen
      van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk
      beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan,
      ten minste voldaan aan de bij ministeriële regeling te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0022762
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
  - number: 4.19.1
    text: |-
      Het spuien van een stoomketel geschiedt in een geschikte spuitank dan wel in een andere geschikte voorziening die
      ten minste voldoen aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.19
  - number: 4.19.2
    text: |-
      Indien spuiwater van een stoomketel of condensaat van rookgassen van een stookinstallatie niet in een openbaar
      vuilwaterriool geloosd kan worden, is lozing op of in de bodem of in een oppervlaktewaterlichaam toegestaan.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.19
  - number: 4.20.1
    text: |-
      Een koelinstallatie met een inhoud van 12 kilogram of meer aan natuurlijk koudemiddel voldoet ten behoeve van het
      voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel
      mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen
      hiervan, aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.20
  - number: 4.20.2
    text: |-
      Onverminderd het eerste lid, voldoet een ammoniakkoelsysteem ten minste aan de bij ministeriële regeling gestelde
      eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.20
  - number: 4.20.3
    text: |-
      Een koelinstallatie als bedoeld in het eerste lid en een ammoniakkoelsysteem als bedoeld in het tweede lid worden
      ten minste eenmaal per twee kalenderjaren gekeurd op veilig functioneren, lekkages en energiezuinigheid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.20
  - number: 4.20.4
    text: |-
      Een keuring als bedoeld in het derde lid wordt verricht door een onafhankelijk deskundig persoon die van de keuring
      een rapport opmaakt dat hij aan de drijver van de inrichting ter beschikking stelt.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.20
  - number: 4.20.5
    text: |-
      Indien een keuring uitwijst dat de koelinstallatie onderhoud behoeft, vindt dat onderhoud binnen twee weken na de
      keuring plaats. Degene die de inrichting drijft vraagt naar een bewijs waaruit blijkt wanneer, door wie en welk
      onderhoud is verricht.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.20
  - number: 4.20.6
    text: Het laatst opgestelde keuringsrapport en het laatst opgestelde onderhoudsbewijs worden bewaard.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.20
  - number: 4.20.7
    text: |-
      In een kunstijsbaan waar een ammoniakkoelinstallatie wordt toegepast wordt een indirect ammoniakkoelsysteem als
      bedoeld in hoofdstuk 2.4 van PGS 13 toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.20
  - number: 4.20.8
    text: |-
      In deze paragraaf wordt verstaan onder «natuurlijk koudemiddel»: de toepassing als koudemiddel van koolstofdioxide,
      ammoniak of koolwaterstoffen niet zijnde een gereguleerde stof of een preparaat dat een zodanige stof bevat als
      bedoeld in het [Besluit ozonlaagafbrekende stoffen milieubeheer][ref1] dan wel een gefluoreerd broeikasgas of een
      preparaat dat een zodanig gas bevat als bedoeld in het [Besluit gefluoreerde broeikasgassen milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015507
      [ref2]: https://wetten.overheid.nl/BWBR0022857
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0015507
      - id: ref2
        bwb_id: BWBR0022857
  - number: 4.21.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij mechanische bewerkingen van hout of kurk dan wel van
      houten, kurken of houtachtige voorwerpen, de emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.21.1.a
    text: |-
      5 milligram per normaal kubieke meter indien de massastroom van totaal stof gelijk is aan of groter is dan 200 gram
      per uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.21
  - number: 4.21.1.b
    text: 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.21
  - number: 4.21.2
    text: |-
      Bij de mechanische bewerkingen van hout of kurk, dan wel van houten, kurken of houtachtige voorwerpen worden ten
      behoeve van het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van emissies naar de
      buitenlucht, de bij ministeriële regeling te bepalen maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.21
  - number: 4.21.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op het onderhouden en repareren van pleziervaartuigen in de
      buitenlucht door derden op de winterberging bij een jachthaven.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.21
  - number: 4.21a
    text: |-
      Bij het verkleinen van hout of kurk dan wel van houten, kurken of houtachtige voorwerpen wordt ten behoeve van het
      realiseren van een verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.21a
  - number: 4.22.1
    text: |-
      Het is verboden om in de buitenlucht hout, kurk dan wel houten, kurken of houtachtige voorwerpen met behulp van
      een nevelspuit te coaten of te lijmen dan wel met behulp van een nevelspuit te reinigen met vluchtige organische
      stoffen houdende producten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.22
  - number: 4.22.2
    text: |-
      Het eerste lid is niet van toepassing indien het niet mogelijk is om deze activiteiten in het inpandige deel van de
      inrichting te verrichten vanwege de omvang van het te bewerken object.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.22
  - number: 4.23.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het aanbrengen van coating of lijmlagen de
      emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.23.1.a
    text: |-
      5 milligram per normaal kubieke meter indien de massastroom van totaal stof naar de lucht gelijk is aan of groter
      is dan 200 gram per uur; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.23
  - number: 4.23.1.b
    text: |-
      50 milligram per normaal kubieke meter indien de massastroom naar de lucht van totaal stof kleiner is dan 200 gram
      per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.23
  - number: 4.23.2
    text: |-
      Het eerste lid is niet van toepassing indien het coaten op grond van [artikelen 4.22, tweede lid][ref1], in de
      buitenlucht plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.3.2
        afdeling: '4.3'
  - number: 4.24.1
    text: |-
      Degene die de inrichting drijft neemt bij het reinigen, coaten of lijmen van hout of kurk dan wel van houten,
      kurken of houtachtige voorwerpen de bij ministeriële regeling gestelde emissiereducerende maatregelen met
      betrekking tot vluchtige organische stoffen tenzij deze niet kosteneffectief of technisch uitvoerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.24
  - number: 4.24.2
    text: |-
      Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de in
      het eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar, zoals dat blijkt uit de
      oplosmiddelenboekhouding als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.24
  - number: 4.24.3
    text: |-
      Degene die een inrichting drijft als bedoeld in het eerste lid, voert een oplosmiddelenboekhouding waarin het
      verbruik van vluchtige organische stoffen per kilogram per jaar wordt geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.24
  - number: 4.24.4
    text: |-
      Het eerste en derde lid is niet van toepassing op het verbruik van vluchtige organische stoffen waarvan het in de
      handel brengen is gereguleerd door het [Besluit organische oplosmiddelen in verven en vernissen milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019122
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0019122
  - number: 4.24.5
    text: |-
      De oplosmiddelenboekhouding, bedoeld in het derde lid, wordt ten minste drie jaar in de inrichting bewaard en ter
      inzage gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.24
  - number: 4.24.6
    text: |-
      Indien de drempelwaarden, genoemd in
      [bijlage IIa van het Oplosmiddelenbesluit omzetting EG-VOS-richtlijn milieubeheer][ref1] worden overschreden, zijn
      het eerste tot en met vijfde lid niet van toepassing en is dat besluit van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: '4.25'
    text: |-
      Bij het reinigen, coaten en lijmen van hout, kurk dan wel houten, kurken of houtachtige voorwerpen worden ten
      behoeve van:
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.25
  - number: 4.25.a
    text: het voorkomen dan wel beperken van diffuse emissies;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.25
  - number: 4.25.b
    text: het voorkomen dan wel beperken van stofhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.25
  - number: 4.25.c
    text: het doelmatig verspreiden van emissies naar de buitenlucht;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.25
  - number: 4.25.d
    text: het voorkomen dan wel beperken van geurhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.25
  - number: 4.25.e
    text: het realiseren van een verwaarloosbaar bodemrisico,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.25
  - number: 4.26.1
    text: |-
      Bij het lozen van afvalwater afkomstig van het reinigen, coaten of lijmen van hout of kurk dan wel houten, kurken
      of houtachtige voorwerpen in een vuilwaterriool wordt ten minste voldaan aan het tweede tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.26
  - number: 4.26.2
    text: |-
      Het lozen van afvalwater, bedoeld in het eerste lid, is toegestaan indien het afvalwater niet meer bevat dan
      2 milligram lood per liter en 2 milligram zink per liter.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.26
  - number: 4.26.3
    text: |-
      De in eerste lid genoemde waarden gelden voor representatieve etmaalmonsters. Voor steekmonsters gelden een factor
      drie hogere waarden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.26
  - number: 4.26.4
    text: |-
      In afwijking van het tweede lid wordt afvalwater dat meer dan 3 milligram vluchtige organohalogeenverbindingen
      uitgedrukt als chloor per liter in enig steekmonster bevat, niet geloosd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.26
  - number: 4.26.5
    text: Het te lozen afvalwater, bedoeld in het tweede lid, kan op een doelmatige wijze worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.26
  - number: 4.27.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij mechanische bewerkingen van kunststof of
      kunststofproducten de emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.27.1.a
    text: |-
      5 milligram per normaal kubieke meter indien de massastroom van totaal stof naar de lucht gelijk is aan of groter
      is dan 200 gram per uur; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.27
  - number: 4.27.1.b
    text: 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.27
  - number: 4.27.2
    text: |-
      Bij extrusie en spuitgieten van kunststof en bij de mechanische bewerkingen van kunststof of kunststofproducten
      worden ten behoeve van het voorkomen dan wel beperken van diffuse emissies en het doelmatig verspreiden van
      emissies naar de buitenlucht de bij ministeriële regeling te bepalen maatregelen toegepast.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.27
  - number: 4.27.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op het onderhouden en repareren van pleziervaartuigen in de
      buitenlucht door derden bij een jachthaven.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.27
  - number: 4.27a
    text: |-
      Bij extrusie en spuitgieten van kunststof en het verkleinen van kunststof of kunststofproducten wordt ten behoeve
      van het realiseren van een verwaarloosbaar bodemrisico voldaan aan de bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.27a
  - number: 4.28.1
    text: |-
      Het is verboden om in de buitenlucht kunststof of kunststofproducten met behulp van een nevelspuit te coaten of te
      lijmen dan wel met behulp van een nevelspuit te reinigen met vluchtige organische stoffen houdende producten.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.28
  - number: 4.28.2
    text: |-
      Het eerste lid is niet van toepassing indien het niet mogelijk is om deze activiteiten in het inpandige deel van de
      inrichting te verrichten vanwege de omvang van het te bewerken object.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.28
  - number: 4.29.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het aanbrengen van coating of lijmlagen de
      emissieconcentratie van totaal stof niet meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.29.1.a
    text: |-
      5 milligram per normaal kubieke meter, indien de massastroom van totaal stof naar de lucht gelijk is aan of groter
      is dan 200 gram per uur; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.29
  - number: 4.29.1.b
    text: 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.29
  - number: 4.29.2
    text: |-
      Het eerste lid is niet van toepassing indien het coaten op grond van [artikel 4.28, tweede lid][ref1], in de
      buitenlucht plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.4.2
        afdeling: '4.4'
  - number: 4.30.1
    text: |-
      Degene die de inrichting drijft neemt bij het reinigen, coaten of lijmen van kunststof of kunststofproducten de
      bij ministeriële regeling gestelde emissiereducerende maatregelen met betrekking tot vluchtige organische stoffen
      tenzij deze niet kosteneffectief of technisch uitvoerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.30
  - number: 4.30.2
    text: |-
      Het eerste lid is niet van toepassing indien het totaal verbruik van vluchtige organische stoffen bij de in
      het eerste lid genoemde activiteiten minder bedraagt dan 1.000 kilogram per jaar, zoals dat blijkt uit de
      oplosmiddelenboekhouding als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.30
  - number: 4.30.3
    text: |-
      Degene die een inrichting drijft als bedoeld in het eerste lid, voert een oplosmiddelenboekhouding waarin het
      verbruik van vluchtige organische stoffen per kilogram per jaar wordt geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.30
  - number: 4.30.4
    text: |-
      Het eerste en derde lid zijn niet van toepassing op het verbruik van vluchtige organische stoffen waarvan het in de
      handel brengen is gereguleerd door het [Besluit organische oplosmiddelen in verven en vernissen milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019122
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0019122
  - number: 4.30.5
    text: |-
      De oplosmiddelenboekhouding, bedoeld in het derde lid, wordt ten minste drie jaar in de inrichting bewaard en ter
      inzage gehouden.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.30
  - number: 4.30.6
    text: |-
      indien de drempelwaarden, genoemd in
      [bijlage IIa van het Oplosmiddelenbesluit omzetting EG-VOS-richtlijn milieubeheer][ref1] worden overschreden, zijn
      het eerste tot en met vijfde lid niet van toepassing en is dat besluit van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: '4.31'
    text: 'Bij het reinigen, coaten en lijmen van kunststof of kunststofproducten worden ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.31
  - number: 4.31.a
    text: het voorkomen dan wel beperken van diffuse emissies;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.31
  - number: 4.31.b
    text: het voorkomen dan wel beperken van stofhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.31
  - number: 4.31.c
    text: het doelmatig verspreiden van emissies naar de buitenlucht;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.31
  - number: 4.31.d
    text: het voorkomen dan wel beperken van geurhinder;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.31
  - number: 4.31.e
    text: het realiseren van een verwaarloosbaar bodemrisico,
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.31
  - number: 4.32.1
    text: |-
      Het is verboden om in de buitenlucht verspanende en thermische bewerkingen en mechanische eindafwerking van metalen
      uit te voeren.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.32
  - number: 4.32.2
    text: |-
      Het eerste lid is niet van toepassing indien het niet mogelijk is om in het inpandig deel van de inrichting
      verspanende en thermische bewerking en mechanische eindafwerking van metalen uit te voeren vanwege het volume of
      het gewicht van het te bewerken object.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.32
  - number: 4.32.3
    text: |-
      Bij het uitvoeren van fijnverspanende bewerkingen aan metalen in de buitenlucht wordt ten behoeve van het voorkomen
      van stofhinder voldaan aan bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.32
  - number: 4.33.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij smeden, shredderen, droogverspanende bewerkingen,
      thermische bewerkingen en bij mechanische eindafwerking van metalen, de emissieconcentratie van totaal stof niet
      meer dan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.33.1.a
    text: |-
      5 milligram per normaal kubieke meter, indien de massastroom van totaal stof naar de lucht gelijk is aan of groter
      is dan 200 gram per uur; en
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.33
  - number: 4.33.1.b
    text: 50 milligram per normaal kubieke meter indien de massastroom kleiner is dan 200 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.33
  - number: 4.33.2
    text: |-
      Het eerste lid is niet van toepassing indien de werkzaamheden op grond van de [artikelen 4.32, tweede lid][ref1],
      of [4.86][ref2] in de buitenlucht worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.6
        afdeling: '4.6'
  - number: 4.34.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij droogverspanende bewerkingen, thermische bewerkingen
      en bij mechanische eindafwerking van roestvast staal, de emissieconcentratie van chroom VI-verbindingen, berekend
      als chroom, niet meer dan 0,1 milligram per normaal kubieke meter, indien de massastroom van chroom VI-verbindingen
      naar de lucht, berekend als chroom, meer bedraagt dan 0,5 gram per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.34
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.34.2
    text: |-
      Het eerste lid is niet van toepassing indien de werkzaamheden op grond van de [artikelen 4.32, tweede lid][ref1],
      of [4.86][ref2] in de buitenlucht worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.34
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.6
        afdeling: '4.6'
  - number: 4.35.1
    text: |-
      Onverminderd de [artikelen 2.5][ref1] en [2.6][ref2] is bij het snijden van koper:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.35
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4.35.1.a
    text: |-
      de emissieconcentratie van koperverbindingen berekend als koper, niet meer dan 5 milligram per normaal kubieke
      meter indien de massastroom van koperverbindingen naar de lucht berekend als koper, meer bedraagt dan 10 gram per
      uur;
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.35
  - number: 4.35.1.b
    text: |-
      de emissieconcentratie van koperrook berekend als koper, niet meer dan 0,5 milligram per normaal kubieke meter
      indien de massastroom van koperrook naar de lucht berekend als koper, meer bedraagt dan 2,5 gram per uur.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.35
  - number: 4.35.2
    text: |-
      Het eerste lid is niet van toepassing indien de werkzaamheden op grond van [artikel 4.32, tweede lid][ref1], in de
      buitenlucht worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel4.35
