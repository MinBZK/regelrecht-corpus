  - number: 1.3.1
    text: |-
      Met goederen als bedoeld bij of krachtens dit besluit worden gelijkgesteld desbetreffende goederen die rechtmatig
      zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie of in een staat, niet
      zijnde een lidstaat van de Europese Unie, die partij is bij een tot een douane-unie strekkend Verdrag, dan wel
      rechtmatig zijn vervaardigd in een staat die partij is bij een tot een vrijhandelszone strekkend Verdrag dat
      Nederland bindt, en die voldoen aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het
      niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.3
  - number: 1.3.2
    text: |-
      Met keuringsverklaringen als bedoeld bij of krachtens dit besluit worden gelijkgesteld keuringsverklaringen,
      afgegeven door een onafhankelijke keuringsinstelling in een andere lidstaat van de Europese Unie dan wel in
      een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede
      daartoe strekkend Verdrag dat Nederland bindt, welke verklaring is afgegeven op basis van onderzoekingen die een
      beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale onderzoekingen wordt
      nagestreefd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.3
  - number: 1.3.3
    text: |-
      Met beroepseisen als bedoeld bij of krachtens dit besluit worden gelijkgesteld beroepseisen die worden gesteld in
      een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die
      partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die een beroepsniveau
      waarborgen dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.3
  - number: 1.3.4
    text: |-
      Met een certificaat of accreditatie als bedoeld bij of krachtens dit besluit of in een bij of krachtens dit
      besluit genoemde niet-publiekrechtelijke regeling, de NeR of de NRB, voor zover de tekst daarvan ingevolge het
      bepaalde krachtens [artikel 1.7, derde lid][ref1], bij de toepassing van dit besluit in acht moet worden genomen,
      wordt gelijkgesteld een certificaat of accreditatie afgegeven door een daartoe bevoegde instelling in een andere
      lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of
      documenten die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale
      onderzoekingen of documenten wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.3
    references:
      - id: ref1
