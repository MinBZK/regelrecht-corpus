  - number: 1.1.2
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt ten aanzien van emissies naar de lucht, verstaan
      onder: '*bron*: emissie naar de lucht van een bewerkingseenheid al dan niet voorzien van emissiebeperkende'
      voorzieningen en ongeacht de vraag of die emissie gecombineerd met andere emissies wordt geloosd op één of meer
      puntbronnen; *emissieconcentratie-eis*: per bron voor onderscheiden afgascomponenten als bovengrens te hanteren
      emissieconcentratie ten aanzien van emissies naar de lucht, uitgedrukt in massa per normaal kubieke meter;
      *grensmassastroom*: een drempelwaarde per stofklasse, uitgedrukt in gram emissie per uur, waarboven een emissie
      naar de lucht als relevant beschouwd wordt; *meetmethode*: het geheel van monsterneming, monsterbehandeling
      en analyse ten behoeve van de kwantificering van emissies; *stofcategorie*: clustering van stoffen op basis
      van vergelijkbare fysische of chemische eigenschappen, overeenkomstig paragraaf 4.4 van de NeR; *stofklasse*:
      onderverdeling binnen een stofcategorie op basis van vergelijkbare (toxicologische) eigenschappen, overeenkomstig
      paragraaf 4.5 van de NeR; *gA*: gasvormige anorganische stoffen als bedoeld in de NeR; *gO*: gasvormige organische
      stoffen als bedoeld in de NeR; *MVP*: minimalisatieverplichte stoffen als bedoeld in de NeR; *puntbron*: een
      gefixeerd punt van gekanaliseerde en daarmee in principe kwantificeerbare emissies naar de lucht; *S*: totaal stof,
      als bedoeld in de NeR; *sO*: stofvormige organische stoffen als bedoeld in de NeR; *sA*: stofvormige anorganische
      stoffen als bedoeld in de NeR.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.1
  - number: 1.1.3
    text: |-
      Een wijziging van artikel 3, onder f en i, van richtlijn nr. 2002/49/EG van het Europees Parlement en de Raad
      van de Europese Unie van 25 juni 2002, inzake de evaluatie en de beheersing van omgevingslawaai, gaat voor
      de toepassing van de in het eerste lid gegeven omschrijving van L en L gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel1.1
  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: *bevoegd gezag*: het
      bevoegd gezag, bedoeld in [artikel 1.1 van de wet][ref1], alsmede het bestuursorgaan dat bevoegd
      zou zijn een omgevingsvergunning voor de betrokken inrichting te verlenen of de beheerder, indien
      het lozen betreft als bedoeld in [artikel 6.2 van de Waterwet][ref2]; *inrichting type A*: een
      inrichting: a. waarvoor geen omgevingsvergunning is vereist voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref3]; b. waar, indien binnen
      een afstand van 50 meter van de grens van de inrichting gevoelige objecten aanwezig zijn, in de periode tussen
      19.00 en 7.00 uur gemiddeld vier of minder transportbewegingen, als bedoeld in [artikel 1.11, eerste lid][ref4],
      plaatsvinden met motorvoertuigen waarvan de massa van het ledig voertuig vermeerderd met het laadvermogen meer
      dan 3500 kilogram is; c. waarbij mede op basis van de aard van de inrichting, niet aannemelijk is dat in enig
      vertrek van de inrichting het equivalente geluidsniveau (Leq) veroorzaakt door de ten gehore gebrachte muziek
      in de representatieve bedrijfssituatie, meer bedraagt dan: 1°. 70 dB(A), indien dit vertrek in- of aanpandig
      is gelegen met gevoelige gebouwen; 2°. 80 dB(A), indien onderdeel 1° niet van toepassing is; d. waar in de
      buitenlucht of op een open terrein van de inrichting geen muziek ten gehore wordt gebracht; e. waar in de
      buitenlucht geen oefenterrein voor motorvoertuigen aanwezig is; f. waar geen koelinstallatie aanwezig is die
      volgens de gebruiksaanwijzing behoort te zijn gevuld met meer dan 30 kilogram koudemiddel; en g. waar geen
      activiteiten worden verricht met afvalstoffen die van buiten de inrichting afkomstig zijn; h. waarbinnen geen van
      de in [hoofdstukken 3][ref5] en [4][ref6] alsmede de in de hoofdstukken 3 en 4 van de Regeling algemene regels
      voor inrichtingen milieubeheer genoemde activiteiten of slechts één of meer van de volgende activiteiten dan wel
      deelactiviteiten worden verricht: 1°. het vervaardigen van voedingsmiddelen voor personen die wonen of werken in
      de inrichting; 2°. het in werking hebben van stookinstallaties voor de verwarming van gebouwen of de verwarming
      van tapwater; 3°. het bieden van parkeergelegenheid in een parkeergarage voor maximaal 30 personenauto’s; 4°.
      het aanwezig hebben van een noodstroomaggregaat dat niet meer dan 50 uren per jaar in werking is; 5°. het lozen
      van huishoudelijk afvalwater in een vuilwaterriool; 6°. het lozen van afvloeiend hemelwater dat niet afkomstig
      is van een bodembeschermende voorziening; 7°. het lozen van koelwater anders dan in een vuilwaterriool; 8°. het
      lozen van grondwater bij ontwatering, niet zijnde grondwater als bedoeld in [artikel 3.1, eerste lid][ref7],
      op of in de bodem; 9° het opslaan in opslagtanks van maximaal 1.000 liter gasolie of biodiesel die voldoet
      aan NEN-EN 14214; 10° het opslaan in opslagtanks van stoffen niet zijnde gevaarlijke stoffen, minerale
      olie of biodiesel die voldoet aan NEN-EN 14214; 11°. het opslaan van gevaarlijke stoffen als bedoeld in
      __REF007___________________________________________________________________________________________________________
      ____; 12°. het opslaan in verpakking van maximaal 50 liter gasolie of biodiesel die voldoet aan NEN-
      EN 14214; 13°. het opslaan in verpakking van stoffen, niet zijnde gevaarlijke stoffen; en *inrichting
      type B*: een inrichting waarvoor geen omgevingsvergunning is vereist voor een activiteit als bedoeld
      in [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref9] en die geen
      inrichting type A of C is; *inrichting type C*: een inrichting: a. die behoort tot een categorie van
      inrichtingen die op grond van [artikel 1.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref10]
      is aangewezen, voor zover daartoe geen gpbv-installatie behoort; b. die een landbouwinrichting
      is; c. die een glastuinbouwbedrijf type B als bedoeld in het [Besluit glastuinbouw][ref11] is; of
      d. die uitsluitend bestaat uit één of meer bassins voor het bewaren van dunne mest als bedoeld in
      [artikel 1, eerste lid, onderdelen b, c en d, van het Besluit mestbassins milieubeheer][ref12];
      *maatwerkvoorschrift*: voorschrift als bedoeld in [artikel 8.42, eerste lid, van de wet][ref13], inhoudende: a. een
      beschikking waarbij het bevoegd gezag aanvullende eisen stelt; dan wel b. een ontheffing waarbij het bevoegd gezag
      de daarbij aangewezen bepalingen niet van toepassing verklaart al dan niet onder het stellen van beperkingen of
      voorwaarden; *wet*: de [Wet milieubeheer][ref14].


