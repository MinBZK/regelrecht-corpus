  - number: 6.13.1.b
    text: die voor de inwerkingtreding van het betreffende in onderdeel a genoemde besluit is opgericht.
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.13
  - number: 6.13.2
    text: |-
      De etmaalwaarde die het bevoegd gezag vaststelt op grond van [artikel 2.20, eerste lid][ref1], is niet lager
      dan 40 dB(A) voor een inrichting waarop onmiddellijk voorafgaand aan de inwerkingtreding van dit besluit het
      [Besluit tankstations milieubeheer][ref2] of het [Besluit tandartspraktijken milieubeheer][ref3] van toepassing
      was.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006423
      [ref3]: https://wetten.overheid.nl/BWBR0008877
    url: https://wetten.overheid.nl/BWBR0022762/2011-01-01#Artikel6.13
    references:
      - id: ref1
