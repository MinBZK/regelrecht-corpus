        hoofdstuk: '2'
        afdeling: '2.8'
  - number: 6.13.1.a
    text: |-
      waarop onmiddellijk voorafgaand aan de inwerkingtreding van [artikel 2.20][ref1],
      het [Besluit opslag- en transportbedrijven milieubeheer][ref2], het
      [Besluit detailhandel- en ambachtsbedrijven milieubeheer][ref3], het
      [Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer][ref4], het
      [Besluit bouw- en houtbedrijven milieubeheer][ref5], het [Besluit woon- en verblijfsgebouwen milieubeheer][ref6],
      het [Besluit textielreinigingsbedrijven milieubeheer][ref7], het [Besluit jachthavens milieubeheer][ref8] of het
      Besluit motorvoertuigen milieubeheer van toepassing was, en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011417
      [ref3]: https://wetten.overheid.nl/BWBR0009935
      [ref4]: https://wetten.overheid.nl/BWBR0009633
