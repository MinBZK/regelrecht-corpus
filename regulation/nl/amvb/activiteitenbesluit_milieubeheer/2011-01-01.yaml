      vergunningvoorschriften voorafgaand aan de inwerkingtreding van dat artikel, geen voorzieningen zijn geplaatst voor
      het afzonderlijk bemonsteren van het te lozen afvalwater als bedoeld in artikel 4.124, eerste lid.


