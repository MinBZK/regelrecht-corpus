  - number: '7.2'
    text: |-
      Een wijziging van een koers als bedoeld in het eerste lid beïnvloedt het op grond van [artikel 6][ref1]
      vastgestelde inkomen niet, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0019165#Artikel6
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel7
    references:
