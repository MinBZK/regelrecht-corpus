---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: inkomensbesluit_wet_wia
regulatory_layer: AMVB
publication_date: '2010-12-29'
valid_from: '2006-01-01'
bwb_id: BWBR0019165
url: https://wetten.overheid.nl/BWBR0019165/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid, van 13 juli 2005, directie Sociale
    Verzekeringen, nr. SV/F&W/05/52295;

    Gelet op de artikelen 52, vijfde lid, 60, vijfde lid, en 61, tiende lid, van de Wet werk en inkomen naar
    arbeidsvermogen;

    De Raad van State gehoord (advies van 3 augustus 2005, no. W12.05.0319/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid, van 28 november 2005, directie
    Sociale Verzekeringen, nr. SV/AL/05/61774;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
  - number: 1.a
    text: |-
      Wet WIA: de [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 1.b
    text: 'loondervingsuitkeringen:'
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
  - number: 1.b.1°
    text: |-
      uitkeringen op grond van de [Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 1.b.2°
    text: |-
      uitkeringen op grond van de [Ziektewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 1.b.3°
    text: |-
      hetgeen wordt genoten op grond van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1] of de bezoldiging op
      grond van [artikel 76a van de Ziektewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76a
  - number: 1.b.4°
    text: |-
      uitkeringen op grond van de [artikelen 6][ref1], [51][ref2] en
      [131 van de Algemene pensioenwet politieke ambtsdragers][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel131
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '51'
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '131'
  - number: 1.b.5°
    text: |-
      uitkeringen bij ziekte of werkloosheid op grond van een regeling welke geldt voor personen die op
      grond van [artikel 6, eerste lid, onderdeel a of onderdeel b, van de Ziektewet][ref1] onderscheidenlijk
      [artikel 6, eerste lid, onderdeel a of onderdeel b, van de Werkloosheidswet][ref2], niet ingevolge [die wet][ref3]
      verzekerd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0004045
  - number: 1.b.6°
    text: |-
      uitkeringen ingevolge een regeling voor vervroegde uittreding of een pensioenregeling als bedoeld in
      [artikel 32aa][ref1] onderscheidenlijk [artikel 18 van de Wet op de loonbelasting 1964][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32aa
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32aa
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '18'
  - number: 1.b.7°
    text: |-
      uitkeringen op grond van de wetgeving van de Nederlandse Antillen, Aruba, een andere Mogendheid of een
      volkenrechtelijke organisatie die naar aard en strekking overeenkomen met de uitkeringen, bedoeld onder 1° tot en
      met 6°;
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
  - number: 1.c
    text: |-
      aangiftetijdvak: het tijdvak van vier weken dan wel een maand waarop de aangifte waarop de ingehouden loonbelasting
      wordt afgedragen betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
  - number: 1.d
    text: |-
      verlof: een tussen de werkgever en werknemer voor een gedeelte of het geheel van de arbeidstijd overeengekomen
      verlof, waarin de werknemer geen arbeid jegens de werkgever verricht.
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel1
  - number: '2.1'
    text: |-
      Voor de toepassing van de [artikelen 52, vierde lid][ref1], [60, eerste lid, aanhef en onderdeel a][ref2], en
      [61, negende lid, van de Wet WIA][ref3] wordt onder inkomen uit arbeid in het bedrijfs- en beroepsleven verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel61
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '61'
  - number: 2.1.a
    text: |-
      het loon in de zin van [artikel 16 van de Wet financiering sociale verzekeringen][ref1] voor de werknemer in de zin
      van die wet met uitzondering van degenen waarvan op grond van [artikel 21 van die wet][ref2] geen premies voor de
      werknemersverzekeringen worden geheven;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel21
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '21'
  - number: 2.1.b
    text: |-
      het loon in de zin van de [Wet op de loonbelasting 1964][ref1], voorzover de verzekerde geen werknemer is als
      bedoeld in onderdeel a;


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 2.1.c
    text: |-
      het belastbaar loon of het belastbaar resultaat uit overige werkzaamheden, bedoeld in [paragraaf 3.3.1][ref1]
      onderscheidenlijk [paragraaf 3.4.1 van de Wet inkomstenbelasting 2001][ref2], voorzover de verzekerde geen
      werknemer is als bedoeld in de onderdelen a en b;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.4.1
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        paragraaf: 3.3.1
      - id: ref2
        bwb_id: BWBR0011353
        paragraaf: 3.4.1
  - number: 2.1.d
    text: |-
      de belastbare winst uit onderneming, bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref1],
      vermeerderd met de ondernemersaftrek, bedoeld in [artikel 3.74 van die wet][ref2], met dien verstande dat de
      bestanddelen van de winst, bedoeld in [artikel 3.78, derde lid, onderdelen a, b en c, van die wet][ref3], niet
      geacht worden te behoren tot de winst.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        paragraaf: 3.2.1
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '2.2'
    text: |-
      Indien de berekening van het resultaat uit overige werkzaamheden, bedoeld in het eerste lid, onderdeel c, of de
      winst, bedoeld in het eerste lid, onderdeel d, leidt tot een negatief bedrag, wordt het resultaat onderscheidenlijk
      de winst op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel2
  - number: '3.1'
    text: |-
      In afwijking van [artikel 2, eerste lid, onderdelen a en b][ref1], wordt niet als inkomen uit arbeid in het
      bedrijfs- en beroepsleven beschouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0019165#Artikel2
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019165
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.a
    text: |-
      het loon uit vroegere dienstbetrekking in de zin van de [Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 3.1.b
    text: |-
      loondervingsuitkeringen en uitkeringen op grond van de [Wet WIA][ref1], alsmede de door de werkgever betaalde
      aanvullingen op die uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: '3.2'
    text: |-
      In afwijking van [artikel 2, eerste lid, onderdeel b][ref1], wordt niet als inkomen uit arbeid in het bedrijfs- en
      beroepsleven beschouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0019165#Artikel2
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019165
        artikel: '2'
        paragraaf: '2'
  - number: 3.2.a
    text: |-
      een vergoeding voor de inkomensafhankelijke bijdrage als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: 3.2.b
    text: |-
      de eindheffingsbestanddelen, bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '4.1'
    text: |-
      Voor de toepassing van de [artikelen 52, vierde lid][ref1], en [61, achtste lid, van de Wet WIA][ref2] wordt in
      aanvulling op of in afwijking van [artikel 2, eerste lid][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0019165#Artikel2
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '61'
      - id: ref3
        bwb_id: BWBR0019165
        artikel: '2'
        paragraaf: '2'
  - number: 4.1.a
    text: |-
      als inkomen uit arbeid in het bedrijfs- en beroepsleven beschouwd het loon of de inkomsten die ten grondslag liggen
      aan een recht op loondervingsuitkering of die werden genoten in de kalendermaand voor de aanvang van het verlof;
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel4
  - number: 4.1.b
    text: |-
      niet als inkomen uit arbeid in het bedrijfs- en beroepsleven beschouwd het loon of de inkomsten die door de
      verzekerde worden genoten indien hij tegelijkertijd uit hoofde van dezelfde arbeidsrelatie loon of inkomsten als
      bedoeld in onderdeel a ontvangt.
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij het bepalen van de hoogte van de arbeidsongeschiktheidsuitkering wordt, indien sprake is van een verkorte
      wachttijd als bedoeld in [artikel 23, zesde lid, van de Wet WIA][ref1], geen rekening gehouden met het loon dat
      door de werkgever wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
  - number: '5'
    text: |-
      Voor de toepassing van [artikel 60, eerste lid, aanhef en onderdeel a, van de Wet WIA][ref1] wordt in aanvulling op
      of in afwijking van [artikel 2, eerste lid][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0019165#Artikel2
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0019165
        artikel: '2'
        paragraaf: '2'
  - number: 5.a
    text: 'als inkomen uit arbeid in het bedrijfs- en beroepsleven beschouwd:'
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel5
  - number: 5.a.1°
    text: |-
      het loon of de inkomsten die ten grondslag liggen aan een recht op uitkering in verband met
      vorstwerkloosheid als bedoeld in [artikel 18 van de Werkloosheidswet][ref1] of werkloosheid
      die uitsluitend het gevolg is van verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2] ontheffing is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002014
        artikel: '8'
  - number: 5.a.2°
    text: |-
      het loon of de inkomsten die ten grondslag liggen aan een loondervingsuitkering als bedoeld in
      [artikel 1, onderdeel b, onder 2°, 3°, 5° en 7°][ref1], voorzover deze ziet op loonderving als gevolg van
      ziekte;


      [ref1]: https://wetten.overheid.nl/BWBR0019165#Artikel1
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019165
        artikel: '1'
        paragraaf: '1'
  - number: 5.a.3°
    text: |-
      het loon of de inkomsten die werden genoten in de kalendermaand voor de aanvang van verlof als bedoeld in de
      [Wet arbeid en zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 5.b
    text: |-
      niet als inkomen uit arbeid in het bedrijfs- en beroepsleven beschouwd het loon of de inkomsten die door de
      verzekerde worden genoten indien hij tegelijkertijd uit hoofde van dezelfde arbeidsrelatie loon of inkomsten als
      bedoeld in onderdeel a ontvangt.
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel5
  - number: '6.1'
    text: Het inkomen uit arbeid uit het bedrijfs- en beroepsleven is het tot een bedrag per kalendermaand herleide inkomen.
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij de toepassing van het eerste lid wordt voorzover sprake is van loon als bedoeld in
      [artikel 2, eerste lid, onderdelen a en b][ref1], het loon door de werknemer geacht te zijn genoten in het
      aangiftetijdvak waarover de werkgever of de inhoudingsplichtige van dat loon opgave heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019165#Artikel2
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019165
        artikel: '2'
        paragraaf: '2'
  - number: '6.3'
    text: |-
      Bij de toepassing van het eerste lid kan op basis van een geschat inkomen een gemiddeld genoten inkomen per
      kalendermaand worden bepaald, waarna per periode van ten hoogste twaalf kalendermaanden een herberekening
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel6
  - number: '6.4'
    text: |-
      Het UWV kan bij de bepaling van het inkomen
      [artikel 3, eerste lid, van het Besluit dagloonregels werknemersverzekeringen][ref1] overeenkomstig toepassen,
      waarbij in plaats van een refertejaar, kalendermaand wordt gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel3
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '3'
  - number: '6.5'
    text: |-
      Indien een loondervingsuitkering wordt geweigerd in verband met enig handelen of nalaten van betrokkene
      dat hem redelijkerwijs kan worden verweten, of het recht op een loondervingsuitkering als bedoeld
      in [artikel 1, onderdeel b, onder 3°][ref1] gedeeltelijk ontbreekt dan wel de betaling daarvan is
      opgeschort door toepassing van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref2] onderscheidenlijk
      [artikel 76b, eerste tot en met derde lid][ref3], of [76c van de Ziektewet][ref4], wordt voor de toepassing van dit
      besluit de uitkering in aanmerking genomen als ware deze niet geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019165#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel76b
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel76c
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019165
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 76b
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 76c
  - number: '6.6'
    text: |-
      Indien een loondervingsuitkering niet tot uitbetaling komt omdat deze niet is aangevraagd, wordt voor de toepassing
      van dit besluit de uitkering in aanmerking genomen als ware deze genoten.
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel6
  - number: '6.7'
    text: |-
      Het UWV kan dit artikel buiten toepassing laten of daarvan afwijken voorzover toepassing, gelet op het belang dat
      dit besluit beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel6
  - number: '7.1'
    text: |-
      De bij de toepassing van [artikel 6][ref1] noodzakelijke omrekening in euro’s van een niet in euro’s uitgedrukt
      inkomen uit arbeid geschiedt met behulp van de door de Europese Centrale Bank geadviseerde wisselkoersen.


      [ref1]: https://wetten.overheid.nl/BWBR0019165#Artikel6
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel7
