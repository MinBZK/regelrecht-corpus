  - number: 7.2.a
    text: |-
      bij wijziging van het inkomen uit arbeid, anders dan ten gevolge van de koersmutaties, een omrekening plaatsvindt;
      en
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel7
  - number: 7.2.b
    text: ten minste eens per jaar een omrekening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0019165/2006-01-01#Artikel7
  - number: '8'
    text: Dit besluit treedt in werking met ingang van 29 december 2005.
