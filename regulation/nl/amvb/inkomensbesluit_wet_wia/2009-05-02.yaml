  - number: '6'
    text: |-
      1 Het inkomen uit arbeid uit het bedrijfs- en beroepsleven is het tot een bedrag per kalendermaand herleide
      inkomen.

      2 Bij de toepassing van het eerste lid wordt voorzover sprake is van loon als bedoeld in
      [artikel 2, eerste lid, onderdelen a en b][ref1], het loon door de werknemer geacht te zijn genoten in het
      aangiftetijdvak waarover de werkgever of de inhoudingsplichtige van dat loon opgave heeft gedaan.

      3 Bij de toepassing van het eerste lid kan op basis van een geschat inkomen een gemiddeld genoten inkomen
      per kalendermaand worden bepaald, waarna per periode van ten hoogste twaalf kalendermaanden een herberekening
      plaatsvindt.

      4 Het UWV kan bij de bepaling van het inkomen
      [artikel 3, eerste lid, van het Besluit dagloonregels werknemersverzekeringen][ref2] overeenkomstig toepassen,
      waarbij in plaats van een refertejaar, kalendermaand wordt gelezen.

      5 Indien een loondervingsuitkering wordt geweigerd in verband met enig handelen of nalaten van betrokkene
      dat hem redelijkerwijs kan worden verweten, of het recht op een loondervingsuitkering als bedoeld
      in [artikel 1, onderdeel b, onder 3°][ref3] gedeeltelijk ontbreekt dan wel de betaling daarvan is
      opgeschort door toepassing van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref4] onderscheidenlijk
      [artikel 76b, eerste tot en met derde lid][ref5], of [76c van de Ziektewet][ref6], wordt voor de toepassing van dit
      besluit de uitkering in aanmerking genomen als ware deze niet geweigerd.

      6 Indien een loondervingsuitkering niet tot uitbetaling komt omdat deze niet is aangevraagd, wordt voor de
      toepassing van dit besluit de uitkering in aanmerking genomen als ware deze genoten.

      7 Het UWV kan dit artikel buiten toepassing laten of daarvan afwijken voorzover toepassing, gelet op het belang dat
      dit besluit beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.


