  - number: '2'
    text: |-
      1 Voor de toepassing van de [artikelen 52, vierde lid][ref1], [60, eerste lid, aanhef en onderdeel a][ref2], en
      [61, achtste lid, van de Wet WIA][ref3] wordt onder inkomen uit arbeid in het bedrijfs- en beroepsleven verstaan:

      a. het loon in de zin van [artikel 16 van de Wet financiering sociale verzekeringen][ref4] voor de werknemer in de
      zin van die wet met uitzondering van degenen waarvan op grond van [artikel 21 van die wet][ref5] geen premies voor
      de werknemersverzekeringen worden geheven;

      b. het loon in de zin van de [Wet op de loonbelasting 1964][ref6], voorzover de verzekerde geen werknemer is als
      bedoeld in onderdeel a;

      c. het belastbaar loon of het belastbaar resultaat uit overige werkzaamheden, bedoeld in [paragraaf 3.3.1][ref7]
      onderscheidenlijk [paragraaf 3.4.1 van de Wet inkomstenbelasting 2001][ref8], voorzover de verzekerde geen
      werknemer is als bedoeld in de onderdelen a en b;

      d. de belastbare winst uit onderneming, bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref9],
      vermeerderd met de ondernemersaftrek, bedoeld in [artikel 3.74 van die wet][ref10], met dien verstande dat de
      bestanddelen van de winst, bedoeld in [artikel 3.78, derde lid, onderdelen a, b en c, van die wet][ref11], niet
      geacht worden te behoren tot de winst.

      2 Indien de berekening van het resultaat uit overige werkzaamheden, bedoeld in het eerste lid, onderdeel c, of de
      winst, bedoeld in het eerste lid, onderdeel d, leidt tot een negatief bedrag, wordt het resultaat onderscheidenlijk
      de winst op nihil gesteld.


