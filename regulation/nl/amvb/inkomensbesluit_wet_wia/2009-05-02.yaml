  - number: '5'
    text: |-
      Voor de toepassing van [artikel 60, eerste lid, aanhef en onderdeel a, van de Wet WIA][ref1] wordt in aanvulling op
      of in afwijking van [artikel 2, eerste lid][ref2]:

      a. als inkomen uit arbeid in het bedrijfs- en beroepsleven beschouwd:

      1°. het loon of de inkomsten die werden genoten in de kalendermaand voorafgaand aan een recht op uitkering
      in verband met vorstwerkloosheid als bedoeld in [artikel 18 van de Werkloosheidswet][ref3] of in verband
      met werkloosheid die uitsluitend het gevolg is van verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref4] ontheffing is verleend;

      2°. het loon of de inkomsten die werden genoten in de kalendermaand voorafgaand aan een recht op een
      loondervingsuitkering als bedoeld in [artikel 1, onderdeel b, onder 2°, 3°, 5° en 7°][ref5], voor zover deze
      ziet op loonderving als gevolg van ziekte;

      3°. het loon of de inkomsten die werden genoten in de kalendermaand voorafgaand aan een recht op een
      loondervingsuitkering als bedoeld in [artikel 1, onderdeel b, onder 6°][ref6], of aan het verlof, bedoeld in de
      [Wet arbeid en zorg][ref7];

      b. niet als inkomen uit arbeid in het bedrijfs- en beroepsleven beschouwd het loon of de inkomsten die door de
      verzekerde worden genoten indien hij tegelijkertijd uit hoofde van dezelfde arbeidsrelatie loon of inkomsten als
      bedoeld in onderdeel a ontvangt.


