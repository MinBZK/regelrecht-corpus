  - number: '3'
    text: |-
      1 In afwijking van [artikel 2, eerste lid, onderdelen a en b][ref1], wordt niet als inkomen uit arbeid in het
      bedrijfs- en beroepsleven beschouwd:

      a. het loon uit vroegere dienstbetrekking in de zin van de [Wet op de loonbelasting 1964][ref2];

      b. loondervingsuitkeringen en uitkeringen op grond van de [Wet WIA][ref3], alsmede aanvullingen op die uitkeringen.

      2 In afwijking van [artikel 2, eerste lid, onderdeel b][ref4], wordt niet als inkomen uit arbeid in het bedrijfs-
      en beroepsleven beschouwd:

      a. een vergoeding voor de inkomensafhankelijke bijdrage als bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref5];

      b. de eindheffingsbestanddelen, bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref6].


