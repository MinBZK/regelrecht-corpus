  - number: '4'
    text: |-
      1 Voor de toepassing van de [artikelen 52, vierde lid][ref1], en [61, achtste lid, van de Wet WIA][ref2] wordt in
      aanvulling op of in afwijking van [artikel 2, eerste lid][ref3]:

      a. als inkomen uit arbeid in het bedrijfs- en beroepsleven wordt beschouwd het loon of de inkomsten die werden
      genoten in de kalendermaand voorafgaand aan een recht op loondervingsuitkering of aan het verlof;

      b. niet als inkomen uit arbeid in het bedrijfs- en beroepsleven beschouwd het loon of de inkomsten die door de
      verzekerde worden genoten indien hij tegelijkertijd uit hoofde van dezelfde arbeidsrelatie loon of inkomsten als
      bedoeld in onderdeel a ontvangt.

      2 Bij het bepalen van de hoogte van de arbeidsongeschiktheidsuitkering wordt, indien sprake is van een verkorte
      wachttijd als bedoeld in [artikel 23, zesde lid, van de Wet WIA][ref4], geen rekening gehouden met het loon dat
      door de werkgever wordt betaald.


