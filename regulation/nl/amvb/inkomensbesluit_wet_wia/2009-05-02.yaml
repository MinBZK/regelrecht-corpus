articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Wet WIA: de [Wet werk en inkomen naar arbeidsvermogen][ref1];

      b. loondervingsuitkeringen:

      1°. uitkeringen op grond van de [Werkloosheidswet][ref2];

      2°. uitkeringen op grond van de [Ziektewet][ref3];

      3°. hetgeen wordt genoten op grond van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref4] of de bezoldiging
      op grond van [artikel 76a van de Ziektewet][ref5];

      4°. uitkeringen op grond van de [artikelen 6][ref6], [51][ref7] en
      [131 van de Algemene pensioenwet politieke ambtsdragers][ref8];

      5°. uitkeringen bij ziekte of werkloosheid op grond van een regeling welke geldt voor personen die op
      grond van [artikel 6, eerste lid, onderdeel a of onderdeel b, van de Ziektewet][ref9] onderscheidenlijk
      [artikel 6, eerste lid, onderdeel a of onderdeel b, van de Werkloosheidswet][ref10], niet ingevolge
      [die wet][ref11] verzekerd zijn;

      6°. uitkeringen op grond van een regeling voor vervroegde uittreding als bedoeld in
      [artikel 32ba van de Wet op de loonbelasting 1964][ref12], op grond van een pensioenregeling als bedoeld in
      [artikel 18, eerste lid, onderdeel a, onder 1°, van de Wet op de loonbelasting 1964][ref13], op grond van
      een levensloopregeling als bedoeld in [artikel 19g van de Wet op de loonbelasting 1964][ref14] of op grond
      van een prepensioenregeling als bedoeld in [artikel 38a van de Wet op de loonbelasting 1964][ref15] zoals
      [dat artikel][ref16] luidde op 31 december 2004;

      7°. uitkeringen op grond van de wetgeving van de Nederlandse Antillen, Aruba, een andere Mogendheid of een
      volkenrechtelijke organisatie die naar aard en strekking overeenkomen met de uitkeringen, bedoeld onder 1° tot en
      met 6°;

      c. aangiftetijdvak: het tijdvak van vier weken dan wel een maand waarop de aangifte waarop de ingehouden
      loonbelasting wordt afgedragen betrekking heeft;

      d. verlof: een tussen de werkgever en werknemer voor een gedeelte of het geheel van de arbeidstijd overeengekomen
      verlof, waarin de werknemer geen arbeid jegens de werkgever verricht.


