  - number: '7'
    text: |-
      1 De bij de toepassing van [artikel 6][ref1] noodzakelijke omrekening in euro’s van een niet in euro’s uitgedrukt
      inkomen uit arbeid geschiedt met behulp van de door de Europese Centrale Bank geadviseerde wisselkoersen.

      2 Een wijziging van een koers als bedoeld in het eerste lid beïnvloedt het op grond van [artikel 6][ref2]
      vastgestelde inkomen niet, met dien verstande dat:

      a. bij wijziging van het inkomen uit arbeid, anders dan ten gevolge van de koersmutaties, een omrekening
      plaatsvindt; en

      b. ten minste eens per jaar een omrekening plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0019165#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019165#Artikel6
