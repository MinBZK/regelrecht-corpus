preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 28 september 2012, nr. FM/2012/613 M, Generale Thesaurie,
    Directie Financiële Markten, Afdeling Marktgedrag en Effectenverkeer;

    Gelet op de artikelen 46 en 54, derde lid, van de Wet op het accountantsberoep en de artikelen 1, tweede lid, 8,
    18, derde lid, van de Wet toezicht accountantsorganisaties;

    De Afdeling advisering van de Raad van State gehoord (advies van 24 oktober 2012, no. W06.12.0405/III);

    Gezien het nader rapport van Onze Minister van Financiën van 14 december 2012, FM/2012/1573 U;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0032724/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *examen Nederlands recht:* examen, bedoeld in [artikel 54, eerste lid, onderdeel c, van de wet][ref1];
        - *richtlijn:* [richtlijn nr. 2006/43/EG](32006L0043) van het Europees Parlement en de Raad van de Europese
      Unie van 17 mei 2006 betreffende de wettelijke controles van jaarrekeningen en geconsolideerde jaarrekeningen,
      tot wijziging van de [Richtlijnen 78/660/EEG](31978L0660) en [83/349/EEG](31983L0349) van de Raad en houdende
      intrekking van [Richtlijn 84/253/EEG](31984L0253) van de Raad (PbEU 2006, L 157);
        - *wet:* [Wet op het accountantsberoep][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0032573
    url: https://wetten.overheid.nl/BWBR0032724/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0032573
  - number: '2'
    text: |-
      De opleiding, bedoeld in [artikel 46 van de wet][ref1], heeft betrekking op de vakgebieden, bedoeld in artikel 8
      van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel46
    url: https://wetten.overheid.nl/BWBR0032724/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '46'
  - number: '3'
    text: |-
      In het examen Nederlands recht wordt getoetst of de betrokkene voldoende kennis heeft van de vakgebieden, bedoeld
      in artikel 8, eerste lid, onderdelen b en h, en tweede lid, onderdelen a tot en met e, van de richtlijn, voor zover
      deze kennis voor controles van financiële verantwoordingen van belang is, met dien verstande dat van het vakgebied,
      bedoeld artikel 8, eerste lid, onderdeel h, van de richtlijn niet de kennis van gedrags- en beroepsregels, bedoeld
      in [artikel 54, eerste lid, onderdeel d, van de wet][ref1], wordt getoetst.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel54
    url: https://wetten.overheid.nl/BWBR0032724/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '54'
  - number: '4'
    text: |-
      1 De commissie stelt de eindtermen vast die betrekking hebben op de in [artikel 3][ref1] bedoelde vakgebieden.

      2 De commissie maakt de vastgestelde eindtermen bekend door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0032724#Artikel3
    url: https://wetten.overheid.nl/BWBR0032724/2014-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0032724
        artikel: '3'
  - number: '5'
    text: 1 De beroepsorganisatie verzorgt het examen Nederlands recht.
    url: https://wetten.overheid.nl/BWBR0032724/2014-01-01#Artikel5
  - number: '10'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet op het accountantsberoep][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0032573
    url: https://wetten.overheid.nl/BWBR0032724/2014-01-01#Artikel10
