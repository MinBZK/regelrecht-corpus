preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur en Onze Minister van Justitie van
    14 juli 1993, DGVgz/GVC/CB/931800;

    Gelet op de artikelen 37, vierde lid, 56, vierde lid, en 57, tweede lid, van de Wet bijzondere opnemingen in
    psychiatrische ziekenhuizen;

    De Raad van State gehoord (advies van 28 oktober 1993, nr. W13.93.0452);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur en Onze Minister van
    Justitie van 1 november 1993, nr. GVC/CB/9370;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006224/1996-07-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt onder de wet verstaan: de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0006224/1996-07-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: '2'
    text: |-
      1 Er wordt een dossier ingericht met betrekking tot de behandeling van de patiënt, waarbij in ieder geval de
      volgende gegevens worden vastgelegd:

      a. de gegevens, bedoeld in artikel 56, eerste en tweede lid, van de wet;

      b. de opname- en ontslaggegevens;

      c. rapporten uitgebracht door of aan de inrichting betreffende de ten uitvoerlegging van de opgelegde maatregel van
      ter beschikkingstelling;

      d. adviezen en aantekeningen, als bedoeld in [artikel 509][ref1];

      e. de gegevens, bedoeld in [artikel 454, eerste en tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref2].

      2 De bescheiden, bedoeld in het eerste lid, worden, onverminderd artikel 56, derde lid, van de wet, bewaard
      gedurende vijf jaren te rekenen vanaf het tijdstip waarop de behandeling in het kader van de wet, de plaatsing in
      het ziekenhuis, dan wel de ter beschikkingstelling, is beëindigd of zo veel langer als redelijkerwijs uit de zorg
      van een goed hulpverlener voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509o
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0006224/1996-07-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509o
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '454'
  - number: '3'
    text: |-
      1 Na beëindiging van de vijf jaren worden de bewaarde bescheiden, bedoeld in [artikel 2][ref1], binnen drie maanden
      na een daartoe strekkend verzoek van de patiënt vernietigd.

      2 Het eerste lid geldt niet voor zover het verzoek bescheiden betreft waarvan redelijkerwijs aannemelijk is dat de
      bewaring van aanmerkelijk belang is voor een ander dan de patiënt, alsmede voor zover het bepaalde bij of krachtens
      enige wettelijke bepaling zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0006224#Artikel2
    url: https://wetten.overheid.nl/BWBR0006224/1996-07-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006224
        artikel: '2'
  - number: '4'
    text: Patiëntendossiers worden op zorgvuldige wijze, volgens een vaste standaardindeling opgebouwd.
    url: https://wetten.overheid.nl/BWBR0006224/1996-07-22#Artikel4
  - number: '5'
    text: |-
      In afwijking van [artikel 457 van Boek 7 van het Burgerlijk Wetboek][ref1] kan verstrekking van de in
      [artikel 2][ref2] bedoelde bescheiden zonder toestemming van de patiënt gescheiden bij overplaatsing van de patiënt
      aan de vanaf het moment van overplaatsing voor de behandeling verantwoordelijke persoon, dan wel indien het bij of
      krachtens een andere wet bepaalde daartoe verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0006224#Artikel2
    url: https://wetten.overheid.nl/BWBR0006224/1996-07-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '457'
      - id: ref2
        bwb_id: BWBR0006224
        artikel: '2'
  - number: '8'
    text: Dit besluit treedt in werking op het tijdstip, bedoeld in artikel 80, tweede lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0006224/1996-07-22#Artikel8
  - number: '9'
    text: Dit besluit kan worden aangehaald als Besluit patiëntendossier Bopz.
    url: https://wetten.overheid.nl/BWBR0006224/1996-07-22#Artikel9
