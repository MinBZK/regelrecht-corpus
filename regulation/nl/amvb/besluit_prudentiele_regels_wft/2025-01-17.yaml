  - number: 32bb
    text: |-
      1 Met betrekking tot een voornemen tot wijziging als bedoeld in [artikel 3:28a, tweede lid, van de wet][ref1] legt
      de centrale effectenbewaarinstelling over aan de Nederlandsche Bank:

      a. een beschrijving van de voorgenomen wijziging;

      b. gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of wordt voldaan aan de artikelen
      39 tot en met 47, 54 en 59 van de verordening centrale effectenbewaarinstellingen.

      2 De centrale effectenbewaarinstelling geeft geen uitvoering aan het voornemen voordat de Nederlandsche Bank heeft
      ingestemd met de wijziging.

      3 De Nederlandsche Bank neemt een besluit omtrent instemming:

      a. binnen zes weken na ontvangst van de kennisgeving; of

      b. indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen zes weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel328a
