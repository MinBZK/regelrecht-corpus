  - number: 32b
    text: |-
      1 Een betaalinstelling of elektronischgeldinstelling geeft onverwijld schriftelijk aan de Nederlandsche Bank
      kennis van een wijziging in de ingevolge [artikel 2:3b, tweede lid, van de wet][ref1] respectievelijk ingevolge
      [artikel 2:10b, tweede lid, van de wet][ref2] verstrekte gegevens met betrekking tot:

      a. de activiteiten die de betaaldienstverlener of de elektronischgeldinstelling voornemens is te verrichten;

      b. het bedrijfsplan waarmee wordt aangetoond dat de betaaldienstverlener of de elektronischgeldinstelling in
      staat is gebruik te maken van passende en evenredige systemen, middelen en procedures om op een gezonde basis te
      opereren;

      c. de identiteit van personen die, direct of indirect, gekwalificeerde deelnemingen als bedoeld in artikel 1 van de
      wet in de betaaldienstverlener of de elektronischgeldinstelling bezitten, alsmede de omvang van hun deelnemingen en
      het bewijs van hun geschiktheid;

      d. indien van toepassing, de accountantsorganisatie of het auditkantoor, bedoeld in
      [artikel 1, eerste lid, onderdelen a en c, van de Wet toezicht accountantsorganisaties][ref3], belast met de
      wettelijke controle bedoeld in artikel 2, onderdeel 1, van de richtlijn nr. 2006/43/EG van het Europees Parlement
      en de Raad van de Europese Unie van 17 mei 2006 betreffende de wettelijke controles van jaarrekeningen en
      geconsolideerde jaarrekeningen, tot wijziging van de Richtlijnen 78/660/EEG en 83/349/EEG van de Raad, en houdende
      intrekking van Richtlijn 84/253/EEG van de Raad (PbEU L 157) van de jaarrekening van de betaaldienstverlener of
      de elektronischgeldinstelling;

      e. gegevens op basis waarvan de Nederlandsche Bank heeft geoordeeld dat wordt voldaan aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref4] is bepaald met betrekking tot de geschiktheid van de personen die het dagelijks
      beleid bepalen;

      f. gegevens op basis waarvan de Nederlandsche Bank heeft geoordeeld dat wordt voldaan aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref5] is bepaald met betrekking tot de betrouwbaarheid van de personen die het beleid
      bepalen of mede bepalen of onderdeel zijn van een orgaan dat belast is met toezicht op het beleid en de algemene
      gang van zaken;

      g. het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref6];

      h. de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere bedrijfsuitoefening, bedoeld in
      [artikel 3:17, eerste en tweede lid, van de wet][ref7];

      i. de wijze waarop wordt voldaan aan het ingevolge [artikel 3:29a van de wet][ref8] bepaalde met betrekking tot de
      geldmiddelen die worden of zijn ontvangen van betaaldienstgebruikers of betaaldienstverleners en met betrekking tot
      de geldmiddelen die worden of zijn ontvangen in ruil voor elektronisch geld dat is uitgegeven; en

      j. het eigen vermogen, bedoeld in [artikel 3:53, eerste lid, van de wet][ref9].

      2 Bij de toepassing van het eerste lid, onderdelen h en i, geeft de betaalinstelling een beschrijving van de
      wijzigingen in de regelingen voor accountantscontrole en de organisatorische regelingen die hij heeft getroffen
      voor het nemen van alle redelijke maatregelen om de belangen van zijn gebruikers te beschermen en om de
      continuïteit en betrouwbaarheid bij het uitvoeren van betaaldiensten te garanderen.

      3 Het eerste lid, onderdeel f, is niet van toepassing indien de wijziging een persoon betreft wiens
      betrouwbaarheid voor de toepassing van de wet door een toezichthouder reeds is vastgesteld, tenzij de
      Nederlandsche Bank besluit dat een redelijke aanleiding bestaat tot een nieuwe beoordeling als bedoeld in
      [artikel 3:9, tweede lid, van de wet][ref10].


