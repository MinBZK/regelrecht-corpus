  - number: 40c
    text: |-
      Betaalinstellingen of elektronischgeldinstellingen verlenen slechts krediet in verband met de in de punten 4 en 5
      van de bijlage bij de richtlijn betaaldiensten bedoelde betaaldiensten indien:

      a. het krediet een aanvullend krediet is en uitsluitend wordt verstrekt in verband met de uitvoering van een
      betalingstransactie;

      b. het krediet dat is verstrekt in verband met een betaaldienst die is verleend door middel van dienstverrichting
      naar een andere lidstaat of vanuit een bijkantoor in een andere lidstaat wordt terugbetaald binnen een korte
      termijn, die in geen geval meer dan twaalf maanden bedraagt;

      c. het niet wordt verleend uit geldmiddelen die zijn ontvangen of die worden aangehouden voor het uitvoeren van
      toekomstige betalingstransacties; en

      d. het eigen vermogen van de betaalinstelling of de elektronischgeldinstelling te allen tijde in redelijke
      verhouding staat tot het totale bedrag van het verleende krediet.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel40c
  - number: 40d
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *dekkingsactiva:* activa als bedoeld in artikel 3, onderdeel 4, van de richtlijn gedekte obligaties;
        - *overcollateralisatie:* overcollateralisatie als bedoeld in artikel 3, onderdeel 14, van de richtlijn gedekte
      obligaties;
        - *primaire activa:* primaire activa als bedoeld in artikel 3, onderdeel 12, van de richtlijn gedekte obligaties;
        - *vervangende activa:* vervangende activa als bedoeld in artikel 3, onderdeel 13, van de richtlijn gedekte
      obligaties;
        - *zekerheidsactiva:* zekerheidsactiva als bedoeld in artikel 3, onderdeel 5, van de richtlijn gedekte obligaties.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel40d
  - number: 40e
    text: |-
      1 Een bank die gedekte obligaties uitgeeft, draagt er zorg voor dat de dekkingsactiva van het programma van gedekte
      obligaties waartoe een gedekte obligatie behoort, worden veiliggesteld door overgang onder algemene of bijzondere
      titel naar een andere rechtspersoon, waarbij aan de volgende voorwaarden wordt voldaan:

      a. de rechtspersoon is met uitsluiting van andere activiteiten opgericht om de dekkingsactiva van een programma van
      gedekte obligaties te scheiden van het vermogen van de bank en hetgeen te doen dat noodzakelijk is of wenselijk is
      voor het desbetreffende programma van gedekte obligaties; en

      b. de bank, alsmede rechtspersonen die tot dezelfde groep als de bank behoren, houden geen aandelen in de
      rechtspersoon, hebben daarin geen beleidsbepalende zeggenschap en hebben daarin ook niet op andere wijze een
      eigendomsbelang.

      2 De bank is te allen tijde in staat om de dekkingsactiva van een programma van gedekte obligaties te
      identificeren.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel40e
  - number: 40f
    text: |-
      1 Een bank die gedekte obligaties uitgeeft, neemt voor ten minste 80% van de totale nominale waarde van de activa
      in de dekkingspool één van de soorten dekkingsactiva, bedoeld in artikel 129, eerste lid, onderdelen a tot en met
      g, van de verordening kapitaalvereisten als primair dekkingsactivum op.

      2 De bank kan voor ten hoogste 20% van de totale nominale waarde van de activa in de dekkingspool vervangende
      dekkingsactiva opnemen, die bestaan uit één of meer van de overige soorten activa, bedoeld in artikel 129, eerste
      lid, onderdelen a tot en met g, van de verordening kapitaalvereisten.

      3 Voor de berekening van de nominale waarde van de dekkingsactiva, bedoeld in het eerste en tweede lid, neemt
      de bank, waar van toepassing, de restricties in artikel 129, eerste lid tot en met derde lid, van de verordening
      kapitaalvereisten in acht.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel40f
  - number: 40g
    text: |-
      1 De totale nominale waarde van de betalingsvorderingen voortvloeiend uit de dekkingsactiva behorend
      tot de dekkingspool is ten minste gelijk aan de totale nominale waarde van de verplichtingen, bedoeld in
      [artikel 3:33b, van de wet][ref1].

      2 De totale nominale waarde van de dekkingsactiva, bedoeld in [artikel 40f, eerste en tweede lid][ref2], tezamen
      is ten minste gelijk aan de totale nominale waarde van de uitstaande gedekte obligaties en is daarnaast onderworpen
      aan een overcollateralisatie bestaande uit 5% van de nominale waarde van de uitstaande gedekte obligaties die wordt
      gedekt door de nominale waarde van dekkingsactiva, bedoeld in artikel 129, eerste lid, onderdelen a tot en met g,
      van de verordening kapitaalvereisten.

      3 Niet door zekerheden gedekte vorderingen waarbij wanbetaling als bedoeld in artikel 178 van de verordening
      kapitaalvereisten wordt geacht zich te hebben voorgedaan, kunnen niet bijdragen aan de dekking in de dekkingspool.

      4 Voor de berekening van de verwachte kosten, bedoeld in [artikel 3:33b, derde lid, van de wet][ref3], kan in
      afwijking van het eerste lid, in plaats van de nominale waarde een forfaitair bedrag worden gehanteerd bestaande
      uit ten minste vier basispunten van de totale nominale waarde van de uitstaande gedekte obligaties, of een vast
      bedrag van 400.000 euro, indien dat bedrag hoger is.

      5 Voor de berekening van de verschuldigde rente op de uitstaande gedekte obligaties en de te ontvangen rente met
      betrekking tot de dekkingsactiva wordt uitgegaan van de nominale waarde.

      6 Voor de berekening van de nominale waarde van de dekkingsactiva, bedoeld in het tweede lid, neemt de bank,
      waar van toepassing, de restricties in artikel 129, eerste lid tot en met derde lid, van de verordening
      kapitaalvereisten in acht. Activa die bijdragen aan de 5% overcollateralisatie, bedoeld in het tweede lid, zijn
      niet onderworpen aan de limieten voor de omvang van de blootstelling als bepaald in artikel 129, eerste lid bis,
      van de verordening kapitaalvereisten en worden niet meegeteld voor die limieten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel333b
