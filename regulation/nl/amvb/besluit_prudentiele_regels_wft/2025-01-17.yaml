  - number: '73'
    text: |-
      1 Een beheerder van een icbe, maatschappij voor collectieve belegging in effecten, of bewaarder van een icbe als
      bedoeld in [artikel 3:57, vijfde lid, van de wet][ref1] verstrekt geen kredieten voor rekening van derden, stelt
      zich niet garant en gaat geen borgtochtverplichtingen aan.

      2 Een financiële onderneming als bedoeld in het eerste lid verkoopt geen financiële instrumenten die de instelling
      voor collectieve belegging in effecten niet in eigendom heeft.

      3 De financiële onderneming gaat niet als debiteur geldleningen aan met uitzondering van:

      a. kortlopende leningen die gezamenlijk niet meer bedragen dan tien procent van de activa van de instelling voor
      collectieve belegging in effecten;

      b. leningen voor het verwerven van onroerende zaken die rechtstreeks noodzakelijk zijn voor de uitoefening van de
      werkzaamheden van de beleggingsmaatschappij en die gezamenlijk niet meer bedragen dan tien procent van haar activa,
      voor zover de omvang van deze geldleningen tezamen met de omvang van de in onderdeel a genoemde leningen niet meer
      bedraagt dan vijftien procent van haar activa; of

      c. leningen met als doel de verwerving van vreemde valuta waardoor de netto schuld van de instelling voor
      collectieve belegging in effecten niet verandert of zal veranderen.


