      1 Een verzekeraar met beperkte risico-omvang die het levensverzekeringsbedrijf of het natura-
      uitvaartverzekeringsbedrijf uitoefent als bedoeld in [artikel 3:42][ref1], [3:43, tweede lid][ref2],
      [3:48, eerste lid][ref3], onderscheidenlijk [3:52 van de wet][ref4], geeft schriftelijk kennis aan de Nederlandsche
      Bank van een voornemen tot een wijziging van de overeenkomsten die hij voornemens is te sluiten.

      2 Een schadeverzekeraar als bedoeld in [artikel 3:42][ref5], [3:43, tweede lid][ref6],
      [3:48, eerste lid, van de wet][ref7], die vanuit een vestiging in een lidstaat diensten naar Nederland verricht,
      geeft aan de Nederlandsche Bank kennis van het voornemen tot een wijziging van de in Nederland gelegen risico’s die
      hij voornemens is te dekken.

      3 Een herverzekeraar als bedoeld in [artikel 3:49 van de wet][ref8], geeft schriftelijk kennis aan de Nederlandsche
      Bank van een voornemen tot een wijziging van de risico’s die zij onderscheidenlijk hij voornemens is te dekken.

      4 De verzekeraar kan het voornemen, bedoeld in het eerste, tweede of derde lid, ten uitvoer brengen vanaf de dag
      waarop de Nederlandsche Bank de kennisgeving, bedoeld in het eerste, tweede of derde lid, heeft ontvangen. De
      Nederlandsche Bank bevestigt de ontvangst onverwijld aan de verzekeraar.

      5 Indien de schadeverzekeraar voornemens is de in Nederland gelegen risico’s zodanig te wijzigen dat deze risico’s
      behorende tot de branche Aansprakelijkheid motorrijtuigen omvatten, legt hij bij de kennisgeving de volgende
      gegevens over aan de Nederlandsche Bank:

      a. een schriftelijk bewijs waaruit blijkt dat hij is aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref9];

      b. een schriftelijk bewijs waaruit blijkt dat hij zich heeft gemeld bij het Waarborgfonds Motorverkeer teneinde
      te voldoen aan zijn verplichtingen jegens dat fonds uit hoofde van de [artikelen 24, eerste lid][ref10],
      en [24a, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref11], alsmede,
      als het een schadeverzekeraar als bedoeld in [artikel 3:43, tweede lid, van de wet][ref12]
      betreft, aan zijn verplichtingen jegens dat fonds uit hoofde van
      [artikel 24b, tweede, derde en achtste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref13]; en

      c. een opgave van de naam en het adres van de schaderegelaar, bedoeld in
      [artikel 4:70, tweede lid, van de wet][ref14], die hij in iedere andere lidstaat heeft aangesteld.


