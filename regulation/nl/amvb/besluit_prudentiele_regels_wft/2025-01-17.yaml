  - number: 134c
    text: |-
      1 Een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-omvang, publiceert
      jaarlijks een rapport over de solvabiliteit en financiële positie overeenkomstig de artikelen 51 en 53, derde en
      vierde lid, van de richtlijn solvabiliteit II en met inachtneming van titel I, hoofdstuk XII, van de verordening
      solvabiliteit II.

      2 De verzekeraar maakt in het geval van belangrijke ontwikkelingen die van invloed zijn op de relevantie van
      de overeenkomstig het eerste lid bekend gemaakte informatie, informatie bekend over de aard en gevolgen van die
      belangrijke ontwikkelingen, overeenkomstig artikel 54 van de richtlijn en met inachtneming van artikel 302 van de
      verordening solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel134c
  - number: 134d
    text: |-
      [Artikel 134c][ref1] is van overeenkomstige toepassing op in Nederland gelegen bijkantoren van:

      a. levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;

      b. herverzekeraars met zetel in een niet-aangewezen staat.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel134c
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel134d
