  - number: 24a2
    text: |-
      1 Indien een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen
      die eerst niet kwalificeerde als kleine en niet-verweven beleggingsonderneming als bedoeld in artikel 12,
      eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen, op enig moment wel als
      zodanig kwalificeert dan mag zij aan de [artikelen 23][ref1], [23a][ref2] en [23b][ref3] van dit besluit, de
      [artikelen 29a, vierde lid][ref4], en [31ga van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref5] en
      [artikel 3 van het Besluit uitvoering publicatieverplichtingen richtlijnen kapitaalvereisten][ref6] en prudentieel
      toezicht beleggingsondernemingen voldoen als kleine en niet-verweven beleggingsonderneming zodra een periode van
      zes aaneengesloten maanden is verstreken vanaf de datum waarop zij voor het eerst als zodanig heeft gekwalificeerd,
      zij gedurende die periode doorlopend als zodanig heeft gekwalificeerd en mits zij de Nederlandsche Bank daarvan in
      kennis heeft gesteld.

      2 Indien een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen
      niet langer kwalificeert als kleine en niet-verweven beleggingsonderneming als bedoeld in artikel 12,
      eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen, dan stelt zij de
      Nederlandsche Bank daarvan in kennis en voldoet zij binnen twaalf maanden na de datum waarop zij niet
      meer als zodanig kwalificeert aan de [artikelen 23][ref7], [23a][ref8] en [23b][ref9] van dit besluit, de
      [artikelen 29a, vierde lid][ref10], en [31ga van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref11]
      en [artikel 3 van het Besluit uitvoering publicatieverplichtingen richtlijnen kapitaalvereisten][ref12] en
      prudentieel toezicht beleggingsondernemingen, als beleggingsonderneming in de zin van de richtlijn prudentieel
      toezicht beleggingsondernemingen niet zijnde een kleine en niet-verweven beleggingsonderneming.


