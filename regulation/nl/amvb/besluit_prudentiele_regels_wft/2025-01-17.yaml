  - number: 40q
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de activa, bedoeld in artikel 6, eerste lid, onderdelen b en c,
      van de richtlijn gedekte obligaties, onder de daarin te bepalen voorwaarden als primaire of vervangende activa in
      de dekkingspool, als bedoeld in [artikel 40g, eerste en tweede lid][ref1], kunnen worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40g
