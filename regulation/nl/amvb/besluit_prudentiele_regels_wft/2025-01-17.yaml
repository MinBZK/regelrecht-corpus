      1 Het kapitaalconserveringsplan, bedoeld in [artikel 3:62a, vierde lid][ref1], en
      [artikel 3:62ba, vijfde lid, van de wet][ref2], bevat:

      a. een schatting van de inkomsten en uitgaven en een balansverwachting;

      b. een beschrijving van de maatregelen die de betrokken onderneming voornemens is te nemen om haar
      toetsingsvermogen te vergroten;

      c. een plan en tijdpad om het toetsingsvermogen te vergroten opdat de onderneming voldoet aan de
      ingevolge [artikel 3:62a, eerste lid, van de wet][ref3] op de onderneming toepasselijke kapitaalbuffer
      en indien van toepassing, de op de onderneming toepasselijke hefboomratiobuffer, als bedoeld in
      [artikel 3:62ba, eerste lid, van de wet][ref4];

      d. andere informatie die noodzakelijk is voor een adequate beoordeling van het kapitaalconserveringsplan.

      2 De Nederlandsche Bank kan nadere regels stellen met betrekking tot de informatie, bedoeld in het eerste lid,
      onderdeel d.


