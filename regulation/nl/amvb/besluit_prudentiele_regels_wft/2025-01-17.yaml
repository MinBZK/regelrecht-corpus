  - number: '69'
    text: |-
      1 De Nederlandsche Bank toetst op regelmatige basis, maar ten minste eenmaal per drie jaar, of een bank of
      een beleggingsonderneming die gebruik maakt van interne modellen voor de berekening van de kapitaalvereisten
      overeenkomstig deel 3 van de verordening kapitaalvereisten, voldoet aan de ingevolge dat deel gestelde eisen.
      Daarbij houdt de Nederlandsche Bank in het bijzonder rekening met wijzigingen in de activiteiten van de bank of
      beleggingsonderneming en het toepassen van interne modellen op nieuwe financiële producten en diensten.

      2 Indien bij de toetsing, bedoeld in het eerste lid, wezenlijke tekortkomingen worden vastgesteld in het
      ondervangen van risico’s door het interne model, neemt de Nederlandsche Bank maatregelen om deze tekortkomingen
      te verhelpen of andere passende maatregelen. Daarbij is de Nederlandsche Bank in ieder geval bevoegd een
      hogere vermenigvuldigingsfactor op te leggen of te bepalen dat de bank of beleggingsonderneming over een hoger
      toetsingsvermogen beschikt dan ingevolge [artikel 3:57 van de wet][ref1] is vereist.

      3 Indien uit veelvuldige overschrijding blijkt dat een intern model niet of niet langer voldoende accuraat
      is, trekt de Nederlandsche Bank de toestemming aan de bank of beleggingsonderneming voor het gebruik van het
      betreffende model in, of legt zij maatregelen op die ertoe leiden dat het model onverwijld wordt verbeterd.

      4 Indien een bank of beleggingsonderneming niet langer voldoet aan de vereisten voor het gebruik van een bepaald
      intern model, stelt de Nederlandsche Bank de bank of beleggingsonderneming in de gelegenheid om aan te tonen dat
      het niet voldoen aan de vereisten van ondergeschikt belang is of om een plan op te stellen op grond waarvan binnen
      een redelijke termijn opnieuw aan de vereisten wordt voldaan. De Nederlandsche Bank kan, voor zover naar haar
      oordeel noodzakelijk, verbeteringen aan het plan opleggen of een andere termijn vaststellen waarbinnen het plan
      wordt uitgevoerd.

      5 Indien de Nederlandsche Bank van oordeel is dat de bank of beleggingsonderneming niet in staat is om uitvoering
      te geven aan het plan, bedoeld in het vierde lid, en de bank of beleggingsonderneming niet heeft aangetoond dat
      het niet voldoen aan de vereisten van ondergeschikt belang is, trekt zij de toestemming voor het gebruik van het
      interne model in of beperkt zij de toestemming tot de onderdelen ten aanzien waarvan wel aan de vereisten wordt
      voldaan of binnen een redelijke termijn kan worden voldaan.


