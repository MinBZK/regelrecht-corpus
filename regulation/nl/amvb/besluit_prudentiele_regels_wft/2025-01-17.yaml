  - number: 32aa
    text: |-
      1 Met betrekking tot het voornemen, bedoeld in [artikel 3:28a, eerste lid, van de wet][ref1], legt de centrale
      tegenpartij over:

      a. een beschrijving van de voorgenomen wijziging, bedoeld in het eerste lid;

      b. gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of wordt voldaan aan hetgeen is
      bepaald in de artikelen 26 tot en met 35 en 40 tot en met 54 van de verordening, bedoeld in het eerste lid, en op
      basis waarvan de Autoriteit Financiële Markten redelijkerwijs een advies als bedoeld in [Bijlage 5, onder 3, eerste
      lid, van het Besluit EU-verordeningen Wft](onbekend) kan geven.

      2 De centrale tegenpartij geeft geen uitvoering aan het voornemen, bedoeld in
      [artikel 3:28a, eerste lid, van de wet][ref2], voordat de Nederlandsche Bank heeft ingestemd met de wijziging.

      3 De Nederlandsche Bank neemt een besluit omtrent instemming:

      a. binnen zes weken na de kennisgeving;

      b. indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen zes weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van de
      kennisgeving; of

      c. indien de Nederlandsche Bank de Autoriteit Financiële Markten om advies heeft gevraagd ingevolge [Bijlage
      5, onder 3, eerste lid, van het Besluit EU-verordeningen Wft](onbekend), binnen vier weken na ontvangst van dat
      advies.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel328a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel328a
