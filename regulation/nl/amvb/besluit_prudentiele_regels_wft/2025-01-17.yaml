  - number: 24a1
    text: |-
      1 Een beleggingsonderneming als bedoeld in [artikel 23, negende lid en tiende lid, aanhef en onderdeel b][ref1],
      beschikt over solide, doeltreffende en allesomvattende strategieën en procedures aan de hand waarvan zij doorlopend
      nagaat of en ervoor zorgt dat de hoogte, samenstelling en verdeling van haar toetsingsvermogen en haar liquide
      activa aansluiten op de omvang en de aard van de risico’s waaraan zij blootstaat, zou kunnen blootstaan en die zij
      voor anderen kan inhouden.

      2 De Nederlandsche Bank kan categorieën beleggingsondernemingen in de zin van de richtlijn prudentieel toezicht
      beleggingsondernemingen die kwalificeren als kleine en niet-verweven beleggingsonderneming als bedoeld in artikel
      12, eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen, verplichten te voldoen aan
      het eerste lid, indien zij dit passend acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
