  - number: 23i
    text: |-
      1 Een bank of beleggingsonderneming als bedoeld in [artikel 23, eerste lid][ref1], beschikt over passende
      procedures die haar werknemers in staat stellen om door hen geconstateerde mogelijke of feitelijke overtredingen
      van de verordening kapitaalvereisten, de verordening prudentiële vereisten voor beleggingsondernemingen of het bij
      of krachtens [hoofdstuk 1.7][ref2] en het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref3]
      bepaalde intern te melden.

      2 Deze procedures voldoen aan de vereisten in artikel 71, tweede lid, onderdelen b, c en d, en derde lid, van de
      richtlijn kapitaalvereisten, of, in het geval van beleggingsondernemingen in de zin van de richtlijn prudentieel
      toezicht beleggingsondernemingen, aan de vereisten in artikel 22, eerste lid, onderdelen b, c en d, van de
      richtlijn prudentieel toezicht beleggingsondernemingen. [Artikel 23, tiende lid][ref4], is van overeenkomstige
      toepassing.


