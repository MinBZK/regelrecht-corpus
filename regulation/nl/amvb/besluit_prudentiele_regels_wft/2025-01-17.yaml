      1 De vereiste omvang van de kapitaalbuffer, bedoeld in [artikel 3:62a, eerste lid, van de wet][ref1], bedraagt de
      som van de omvang van de volgende componenten, voor zover van toepassing:

      a. een kapitaalconserveringsbuffer als bedoeld in artikel 128, onderdeel 1, van de richtlijn kapitaalvereisten,
      zijnde de minimaal vereiste omvang van de kapitaalbuffer;

      b. een contracyclische kapitaalbuffer als bedoeld in artikel 128, onderdeel 2, van de richtlijn
      kapitaalvereisten, in verband met risico’s die voortvloeien uit de kredietcyclus, als bedoeld in
      [artikel 3:62a, tweede lid, onderdeel a, van de wet;][ref2]

      c. een systeemrelevantiebuffer bestaande uit een MSI-buffer als bedoeld in artikel 128, onderdeel 3, of
      een ASI-buffer als bedoeld in artikel 128, onderdeel 4, van de richtlijn kapitaalvereisten, in verband met
      het risico dat de financiële onderneming vormt voor de stabiliteit van het financiële stelsel, als bedoeld
      in[ artikel 3:62a, tweede lid, onderdeel b, van de wet][ref3];

      d. een systeemrisicobuffer als bedoeld in artikel 128, onderdeel 5, van de richtlijn kapitaalvereisten,
      in verband met risico’s die voortvloeien uit macroprudentiële of systeemrisico’s als bedoeld in
      [artikel 3:62a, tweede lid, onderdeel c, van de wet][ref4], en niet afdoende worden gedekt door de contracyclische
      kapitaalbuffer of systeemrelevantiebuffer.

      2 De omvang van de in het eerste lid bedoelde buffercomponenten wordt uitgedrukt in een percentage van het
      overeenkomstig artikel 92, derde lid, van de verordening kapitaalvereisten berekende totaal van risicoposten.

      3 Indien op een onderneming een systeemrelevantiebuffer als bedoeld in het eerste lid, onderdeel c, of een
      systeemrisicobuffer als bedoeld in het eerste lid, onderdeel d, van toepassing is, wordt de totale toepasselijke
      omvang van die buffercomponenten bepaald op de wijze, genoemd in artikel 131, veertiende en vijftiende lid, van de
      richtlijn kapitaalvereisten.


