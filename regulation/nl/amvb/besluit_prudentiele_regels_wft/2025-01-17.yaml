  - number: '26.03'
    text: |-
      De Nederlandsche Bank kan een premiepensioeninstelling de verplichting opleggen om een stresstest uit te voeren, om
      de financiële omstandigheden van de premiepensioeninstelling te kunnen bepalen of de ontwikkeling ervan te kunnen
      volgen.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26.03
  - number: '26.1'
    text: |-
      1 Een beheerder van een beleggingsinstelling als bedoeld in [artikel 3:17, derde lid, van de wet][ref1] voert
      met betrekking tot de beleggingsinstellingen die hij beheert beleid gericht op het beheersen van risico’s die de
      soliditeit van die instellingen kunnen aantasten.

      2 De beheerder beschikt over procedures en maatregelen die waarborgen dat wordt voldaan aan de ingevolge artikel 15
      en 16 van de richtlijn beheerders van alternatieve beleggingsinstellingen gestelde voorwaarden die met het oog op
      de in het eerste lid bedoelde belangen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel317
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26.1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:17
  - number: '26.2'
    text: |-
      1 Een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-omvang, voldoet met
      betrekking tot zijn bedrijfsvoering aan de artikelen 41 en 44 tot en met 48 van de richtlijn solvabiliteit II, met
      inachtneming van titel I, hoofdstuk IX, afdelingen 1 en 2, van de verordening solvabiliteit II.

      2 De werknemers van een verzekeraar als bedoeld in het eerste lid, niet zijnde personen als bedoeld in
      [artikel 3:8, eerste lid, derde volzin, van de wet][ref1], die een sleutelfunctie vervullen als bedoeld in artikel
      42 van de richtlijn solvabiliteit II zijn geschikt voor de vervulling van hun taken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel38
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26.2
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:8
  - number: '26.3'
    text: |-
      1 De artikelen 41 en 44 tot en met 48 van de richtlijn solvabiliteit II en titel I, hoofdstuk IX, afdelingen 1
      en 2, van de verordening solvabiliteit II inzake de bedrijfsvoering van verzekeraars zijn van overeenkomstige
      toepassing op de volgende verzekeraars, voor zover zij hun bedrijf uitoefenen vanuit een in Nederland gelegen
      bijkantoor:

      a. levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;

      b. herverzekeraars met zetel in een niet-aangewezen staat.

      2 [Artikel 26.2, tweede lid][ref1], is van overeenkomstige toepassing op werknemers van verzekeraars als bedoeld in
      het eerste lid, onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel26.2
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26.3
    references:
      - id: ref1
