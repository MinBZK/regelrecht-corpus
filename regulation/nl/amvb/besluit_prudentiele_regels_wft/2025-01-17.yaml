      1 Op een clearinginstelling als bedoeld in [artikel 3:57, vijfde lid, van de wet][ref1] zijn de eisen betreffende
      grote risicoblootstellingen ingevolge deel 4 van de verordening kapitaalvereisten van overeenkomstige toepassing.

      2 Op een kredietunie als bedoeld in [artikel 3:57, zesde lid, van de wet][ref2] zijn de eisen betreffende grote
      risicoblootstellingen ingevolge deel 4 van de verordening kapitaalvereisten van overeenkomstige toepassing, met
      dien verstande dat de minimum omvang van het toetsingvermogen in afwijking van [artikel 61, eerste lid][ref3],
      van dit besluit, 20 procent bedraagt voor het meerdere van grote risicoblootstellingen boven 15 procent van het
      aanwezige in aanmerking komende toetsingsvermogen.


