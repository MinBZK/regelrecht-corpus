  - number: '29'
    text: |-
      1 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in
      [artikel 27, tweede lid][ref1], voert een adequaat beleid en beschikt over procedures en maatregelen met betrekking
      tot het op structurele basis uitbesteden van werkzaamheden.

      2 De premiepensioeninstelling legt het beleid, bedoeld in het eerste lid, schriftelijk vast en evalueert het beleid
      ten minste eenmaal per drie jaar en past dit zo spoedig mogelijk aan in geval van een belangrijke wijziging met
      betrekking tot de uitbesteding of de overige onderdelen van de bedrijfsvoering.


