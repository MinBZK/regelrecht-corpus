  - number: '37'
    text: |-
      1 Een afwikkelonderneming, clearinginstelling of verzekeraar als bedoeld in
      [artikel 3:29, eerste lid, van de wet][ref1] met zetel in Nederland die haar bedrijf uitoefent vanuit een in een
      andere lidstaat gelegen bijkantoor geeft schriftelijk aan de Nederlandsche Bank en de toezichthoudende instantie
      van die lidstaat kennis van een wijziging in het adres van het bijkantoor.

      2 De financiële onderneming geeft van een wijziging als bedoeld in het eerste lid kennis binnen twee weken nadat de
      wijziging zich heeft voorgedaan.

      3 Een afwikkelonderneming of clearinginstelling als bedoeld in [artikel 3:29, eerste lid, van de wet][ref2] die
      haar bedrijf uitoefent vanuit een in een andere lidstaat gelegen bijkantoor, geeft schriftelijk kennis aan de
      Nederlandsche Bank en de toezichthoudende instantie van die lidstaat van het voornemen de uitoefening van haar
      bedrijf vanuit het in de andere lidstaat gelegen bijkantoor te staken. De afwikkelonderneming of clearinginstelling
      geeft geen uitvoering aan het voornemen gedurende de eerste vier weken na de kennisgeving.


