    text: |-
      Op de berekening van het solvabiliteitskapitaalvereiste volgens de standaardformule overeenkomstig
      [artikel 65][ref1] of [66][ref2] zijn de overgangsmaatregelen, bedoeld in artikel 308 ter, twaalfde en dertiende
      lid, van de richtlijn solvabiliteit II van toepassing dan wel van overeenkomstige toepassing, tenzij een
      verzekeraar gebruik maakt van de overgangsmaatregel, bedoeld in artikel 308 quinquies van die richtlijn.


