  - number: '130'
    text: |-
      1 De door een bank, als bedoeld in [artikel 3:72, eerste lid, van de wet][ref1] of, een beleggingsonderneming
      onder de verordening kapitaalvereisten of door een clearinginstelling als bedoeld in artikel 3:72, eerste lid, of
      [3:86, eerste lid, van de wet][ref2] te verstrekken staten omvatten uitsluitend:

      a. gegevens betreffende rapportageverplichtingen ingevolge de verordening kapitaalvereisten;

      b. gegevens ten behoeve van het depositogarantiestelsel, bedoeld in [artikel 3:259, tweede lid, van de wet][ref3],
      betreffende de aangehouden deposito’s die worden gegarandeerd uit hoofde van het depositogarantiestelsel;

      2 De door een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen te
      verstrekken staten omvatten uitsluitend de in artikel 54 en artikel 55 van de verordening prudentiële vereisten
      voor beleggingsondernemingen bedoelde gegevens.

      3 De door een beleggingsonderneming als bedoeld in artikel 3:82, eerste lid, van de wet te verstrekken staten
      omvatten uitsluitend:

      a. de in artikel 430, eerste lid, onderdelen a en d, van de verordening kapitaalvereisten bedoelde gegevens
      voor zover het een beleggingsonderneming betreft waarop, indien zij haar zetel had gehad in een lidstaat, die
      verordening van toepassing zou zijn;

      b. de in artikel 54, eerste lid, onderdelen a tot en met c en f, van de verordening prudentiële vereisten voor
      beleggingsondernemingen bedoelde gegevens, voor zover het een beleggingsonderneming betreft waarop, indien zij haar
      zetel had gehad in een lidstaat, die verordening van toepassing zou zijn.

      4 De door een entiteit voor risico-acceptatie als bedoeld in [artikel 3:72, derde lid, van de wet][ref4] te
      verstrekken staten omvatten uitsluitend de gegevens, bedoeld in artikel 325 van de verordening solvabiliteit II.

      5 De door een verzekeraar als bedoeld in [artikel 3:72, derde lid, van de wet][ref5], niet zijnde een verzekeraar
      met beperkte risico-omvang, bijkantoor als bedoeld in [artikel 3:82, tweede lid, van de wet][ref6], of bijkantoor
      van een herverzekeraar als bedoeld in [artikel 3:86, tweede lid][ref7], te verstrekken staten omvatten uitsluitend:

      a. de gegevens, bedoeld in titel I, hoofdstuk XIII, afdeling 1, van de verordening solvabiliteit II;

      b. andere voor toezichtdoeleinden benodigde periodieke informatie als bedoeld in artikel 35, eerste lid, van de
      richtlijn solvabiliteit II.

      6 De door een verzekeraar als bedoeld in [artikel 3:72, derde lid, van de wet][ref8] met beperkte risico-omvang
      of bijkantoor als bedoeld in [artikel 3:86, tweede lid, van de wet][ref9] van een verzekeraar met beperkte risico-
      omvang te verstrekken staten omvatten uitsluitend:

      a. een jaarrekening alsmede aanvullende financiële gegevens ten behoeve van het toezicht op de naleving van het
      Deel Prudentieel toezicht financiële ondernemingen van de wet;

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:

      1°. de solvabiliteit ingevolge [artikel 3:57, eerste lid][ref10], [3:61, eerste of tweede lid][ref11], of
      [3:62 van de wet][ref12]; en

      2°. de technische voorzieningen ingevolge [artikel 3:67][ref13], [3:69][ref14] of [3:73 van de wet][ref15].

      7 De door een betaalinstelling of elektronischgeldinstelling als bedoeld in
      [artikel 3:72, eerste lid, van de wet][ref16] te verstrekken staten omvatten uitsluitend:

      a. balans- en resultatengegevens alsmede aanvullende financiële gegevens ten behoeve van het toezicht op de
      naleving van het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref17];

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot de solvabiliteit
      ingevolge [artikel 3:57, eerste lid, van de wet][ref18];

      c. voor zover van toepassing een opgave van het gemiddeld uitstaand elektronisch geld.

      8 De door een bank als bedoeld in [artikel 3:77 van de wet][ref19] met betrekking tot het bijkantoor te verstrekken
      staten omvatten uitsluitend de gegevens, bedoeld in het eerste lid, onderdeel b, ten behoeve van de doeleinden,
      genoemd in artikel 40 van de richtlijn kapitaalvereisten.

      9 De door een premiepensioeninstelling als bedoeld in [artikel 3:72, eerste lid, van de wet][ref20] te verstrekken
      staten omvatten uitsluitend:

      a. een jaarrekening alsmede aanvullende financiële gegevens ten behoeve van het toezicht op de naleving van het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref21];

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:

      1°. het bedrag aan eigen vermogen ingevolge [artikel 3:53 van de wet][ref22];

      2°. de solvabiliteit ingevolge [artikel 3:57 van de wet][ref23];

      3°. het beleggingsbeleid ingevolge [artikel 3:267b van de wet][ref24];

      4°. informatie inzake de uitgevoerde pensioenregelingen.

      10 De door een beheerder als bedoeld in [artikel 3:72, eerste lid, van de wet][ref25] te verstrekken staten
      bevatten uitsluitend balans- en resultaatgegevens ten behoeve van het toezicht op de naleving van de regels
      met betrekking tot het bedrag aan eigen vermogen ingevolge [artikel 3:53][ref26] en de solvabiliteit ingevolge
      [artikel 3:57, van de wet][ref27]. Indien een beheerder van een beleggingsinstelling of een beheerder van een
      icbe een beleggingsdienst verleent op grond van [artikel 2:67a, tweede lid][ref28], respectievelijk [artikel
      2:69c, tweede lid, van de wet](onbekend) omvatten de door hem te verstrekken staten tevens de in artikel 54 van de
      verordening prudentiële vereisten voor beleggingsondernemingen bedoelde gegevens.

      11 De door een afwikkelonderneming als bedoeld in [artikel 3:72, eerste lid, van de wet][ref29] te verstrekken
      staten omvatten uitsluitend:

      a. balans- en resultatengegevens alsmede aanvullende gegevens ten behoeve van toezicht op de naleving van het Deel
      Prudentieel toezicht financiële ondernemingen van de wet;

      b. gegevens met betrekking tot de verrichte girale betalingstransacties, bedoeld in de [artikelen 2:3.0c][ref30],
      [2:3.0h][ref31] of [2:3.0m van de wet][ref32].

      12 De door een kredietunie als bedoeld in [artikel 3:72, eerste lid, van de wet][ref33] te verstrekken staten
      omvatten uitsluitend:

      a. balans- en resultatengegevens en aanvullende gegevens ten behoeve van het toezicht op de naleving van het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref34];

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:

      1°. het bedrag aan eigen vermogen ingevolge [artikel 3:53, eerste lid, van de wet][ref35];

      2°. de solvabiliteit ingevolge [artikel 3:57, eerste lid, van de wet][ref36];

      3°. de liquiditeit ingevolge [artikel 3:63, eerste lid, van de wet][ref37].

      13 De door een bank als bedoeld in [artikel 3:82, eerste lid, van de wet][ref38] met betrekking tot het bijkantoor
      te verstrekken informatie omvat uitsluitend de gegevens:

      a. genoemd in artikel 47, eerste lid bis, onderdeel a tot en met g, van de richtlijn kapitaalvereisten;

      b. andere door de Nederlandsche Bank voor toezichtdoeleinden benodigde periodieke informatie als bedoeld in
      artikel 47, eerste lid bis, onderdeel h, van de richtlijn kapitaalvereisten.


