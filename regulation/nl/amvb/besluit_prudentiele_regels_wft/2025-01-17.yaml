  - number: '123'
    text: |-
      Het beleggingsbeleid van een pensioenregeling die niet wordt beheerst door het recht van een lidstaat wordt
      uitgevoerd overeenkomstig de bepalingen van het land van herkomst van de regeling.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel123
  - number: '124'
    text: |-
      1 Het beleggingsbeleid van een pensioenregeling die wordt beheerst door het recht van een lidstaat wordt uitgevoerd
      overeenkomstig de volgende beginselen:

      a. beleggingen in de bijdragende onderneming worden beperkt tot ten hoogste 5% van de portefeuille als geheel, en
      ingeval de bijdragende onderneming tot een groep behoort, worden beleggingen in de ondernemingen die tot dezelfde
      groep als de bijdragende onderneming behoren, beperkt tot ten hoogste 10% van de portefeuille. Wanneer een groep
      van ondernemingen aan de premiepensioeninstelling bijdragen betaalt, geschieden beleggingen in deze bijdragende
      ondernemingen prudent, waarbij rekening wordt gehouden met de noodzaak van een behoorlijke diversificatie;

      b. de beleggingen worden gewaardeerd op basis van marktwaardering;

      c. beleggingen in niet tot de handel op een gereglementeerde markt, of een multilaterale handelsfaciliteit of een
      daarmee vergelijkbaar systeem in een staat die geen lidstaat is toegelaten waarden worden tot een prudent niveau
      beperkt.

      d. beleggingen in derivaten zijn toegestaan voor zover deze bijdragen aan een vermindering van het risicoprofiel
      of een doeltreffend portefeuillebeheer vergemakkelijken. De premiepensioeninstelling vermijdt een bovenmatig risico
      met betrekking tot een en dezelfde tegenpartij en tot andere derivatenverrichtingen;

      e. de waarden worden naar behoren gediversifieerd zodat een bovenmatige afhankelijkheid van of vertrouwen in
      bepaalde waarden, of een bepaalde emittent van waarden of groep van ondernemingen en risicoaccumulatie in de
      portefeuille als geheel worden vermeden.

      2 De eisen die zijn opgenomen in het eerste lid, aanhef en onderdelen a en e, zijn niet van toepassing op
      beleggingen in staatsobligaties.

      3 Onder waardering op marktwaarde bedoeld in het eerste lid, onderdeel b, wordt verstaan: het bedrag waarvoor een
      actief kan worden verhandeld of een passief kan worden afgewikkeld tussen terzake goed geïnformeerde partijen, die
      tot een transactie bereid en onafhankelijk van elkaar zijn.

      4 Leningen als bedoeld in [artikel 3:267b, vierde lid, van de wet][ref1] mogen slechts worden aangegaan voor een
      periode van niet langer dan een jaar.

      5 Van een liquiditeitsdoelstelling als bedoeld in [artikel 3:267b, vierde lid, van de wet][ref2] is sprake als
      de premiepensioeninstelling tijdelijk niet kan voldoen aan zijn verplichtingen of de betreffende lening wordt
      aangegaan ter verbetering van het risicoprofiel van de premiepensioeninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3267b
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3267b
