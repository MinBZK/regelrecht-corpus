  - number: 3a
    text: |-
      1 De [hoofdstukken 9][ref1] en [10][ref2] zijn niet van toepassing op betaalinstellingen:

      a. voor zover zij uitsluitend in Nederland betaaldiensten verlenen als bedoeld onder 6 van de bijlage bij de
      richtlijn betaaldiensten;

      b. waarvan het gemiddelde van het totale bedrag van de betalingstransacties die zij de voorafgaande twaalf maanden
      hebben verricht, met inbegrip van die van agenten waarvoor zij volledig aansprakelijk zijn, niet hoger is dan €
      3.000.000 per maand; en

      c. waarvan geen van de personen die het beleid bepalen of mede bepalen personen zijn met antecedenten als
      bedoeld in [artikel 6, onderdelen a, b en d][ref3], voor zover deze betrekking hebben op het witwassen van
      geld, terrorismefinanciering of vermogensmisdrijven of als misdrijf aangemerkte overtredingen van financiële
      toezichtswetgeving.

      2 Een betaalinstelling als bedoeld in het eerste lid stelt de Nederlandsche Bank in kennis van elke verandering in
      zijn situatie die relevant is voor het naleven van de in het eerste lid gestelde voorschriften.

      3 Indien een betaaldienstverlener zijn werkzaamheden niet gedurende de gehele periode van de voorafgaande twaalf
      maanden heeft verricht, kan voor de toepassing van het eerste lid, onderdeel b, worden uitgegaan van een programma
      van werkzaamheden waarin naar het oordeel van de Nederlandsche Bank een reële begroting van het totale bedrag aan
      betalingstransacties is opgenomen.


