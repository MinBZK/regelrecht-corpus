      Een groepsmaatschappij verstrekt bij een kennisgeving als bedoeld in [artikel 3:103a, eerste lid, van de wet][ref1]
      aan de Nederlandsche Bank de volgende gegevens:

      Een groepsmaatschappij verstrekt bij een kennisgeving als bedoeld in [artikel 3:103a, eerste lid, van de wet][ref2]
      aan de Nederlandsche Bank de volgende gegevens:

      a. een omschrijving van de wijziging, bedoeld in [artikel 3:103a, eerste lid, van de wet][ref3];

      b. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:100, eerste lid, onderdeel a, van de wet][ref4] is bepaald met betrekking tot de betrouwbaarheid van de
      persoon die als gevolg van de voorgenomen wijziging het beleid van de betrokken onderneming zou kunnen bepalen of
      mede bepalen of zou bepalen of mede bepalen;

      c. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:99a van de wet][ref5] is bepaald met betrekking tot de geschiktheid, gelet op diens reputatie, van de
      persoon die als gevolg van de voorgenomen wijziging het beleid van de betrokken onderneming zou kunnen bepalen of
      mede bepalen of zou bepalen of mede bepalen;

      d. bescheiden waaruit de financiële positie van de bij de voorgenomen wijziging betrokken groepsmaatschappijen,
      bedoeld in [artikel 3:103a, eerste lid, van de wet][ref6] blijkt, voor zover deze informatie niet eerder, voor de
      uitoefening van haar toezicht, aan de Nederlandsche Bank is verstrekt;

      e. bescheiden waaruit de juridische groepsstructuur als gevolg van de wijziging blijkt.


