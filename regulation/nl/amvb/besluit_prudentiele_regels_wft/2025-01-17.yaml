    text: |-
      Het minimumbedrag aan eigen vermogen van een bewaarder of pensioenbewaarder als bedoeld in
      [artikel 3:53, eerste lid, van de wet][ref1] wordt gevormd door de waarde van de vermogensbestanddelen, bedoeld
      in de artikelen 26, eerste lid, onderdelen a tot en met e, 51 en 62 van de verordening kapitaalvereisten.
      Op een bewaarder of pensioenbewaarder met de rechtsvorm van een stichting is artikel 27 van de verordening
      kapitaalvereisten van overeenkomstige toepassing.


