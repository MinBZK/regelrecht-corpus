  - number: 106b
    text: |-
      1 De liquiditeit van een beleggingsonderneming als bedoeld in [artikel 3:63, eerste lid, van de wet][ref1] is
      voldoende, indien wordt voldaan aan:

      a. de liquiditeitsvereisten ingevolge deel 6 van de verordening kapitaalvereisten, indien het een
      beleggingsonderneming onder de verordening kapitaalvereisten betreft;

      b. de liquiditeitsvereisten ingevolge deel 5 van de verordening prudentiële vereisten voor beleggingsondernemingen,
      indien het een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen
      betreft.

      2 Op beleggingsondernemingen als bedoeld in [artikel 3:65 van de wet][ref2] is van overeenkomstige toepassing:

      a. het eerste lid, onderdeel a, voor zover het een beleggingsonderneming betreft waarop, indien zij haar zetel had
      gehad in een lidstaat, de verordening kapitaalvereisten van toepassing zou zijn;

      b. het eerste lid, onderdeel b, voor zover het een beleggingsonderneming betreft waarop, indien zij haar zetel had
      gehad in een lidstaat, de verordening prudentiële vereisten voor beleggingsondernemingen van toepassing zou zijn.

      3 Het eerste lid, aanhef en onderdeel b, is van overeenkomstige toepassing op een beheerder van een
      beleggingsinstelling of een beheerder van een icbe die tevens een beleggingsdienst verleent op grond van
      [artikel 2:67a, tweede lid, van de wet][ref3], respectievelijk [artikel 2:69c, tweede lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel363
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel365
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel267a
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel269c
