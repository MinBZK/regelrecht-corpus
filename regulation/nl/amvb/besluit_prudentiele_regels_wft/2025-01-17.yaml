  - number: 24a
    text: |-
      1 Een bank of beleggingsonderneming als bedoeld in
      [artikel 23, achtste lid en tiende lid, aanhef en onderdeel a][ref1], beschikt over solide, doeltreffende en
      alomvattende strategieën en procedures aan de hand waarvan zij doorlopend nagaat of en ervoor zorgt dat de hoogte,
      samenstelling en verdeling van haar toetsingsvermogen aansluiten op de omvang en de aard van haar de korte- en
      langetermijnrisico’s waaraan zij blootstaat of zou kunnen blootstaan.

      2 Een verzekeraar met beperkte risico-omvang gaat regelmatig na hoe zijn solvabiliteit zich verhoudt tot de korte-
      en langetermijnrisico’s waaraan hij blootstaat of zou kunnen blootstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
