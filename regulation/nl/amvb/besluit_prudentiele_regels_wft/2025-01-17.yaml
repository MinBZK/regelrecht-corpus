  - number: '42'
    text: |-
      Als adres van een vertegenwoordiger in Nederland van een verzekeraar als bedoeld in [artikel 3:40 van de wet][ref1]
      waaraan rechtsgeldig mededelingen kunnen worden gedaan wordt beschouwd het in Nederland gelegen bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel340
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:40
  - number: '43'
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:40][ref1], [3:47, zesde lid][ref2] of
      [3:50, tweede lid, van de wet][ref3] wordt geacht, indien de vertegenwoordiger ontbreekt, zijn woonplaats te
      hebben bij het parket van de officier van justitie in het arrondissement waarin de rechtbank is gelegen waar de
      verzekeraar ingevolge [artikel 42][ref4] het laatst zijn woonplaats had, of anders bij het parket van de officier
      van justitie bij het arrondissementsparket Amsterdam.


