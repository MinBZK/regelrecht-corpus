articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      *authenticatie:* een procedure waarmee een betaaldienstverlener de identiteit van een betaaldienstgebruiker dan wel
      de validiteit van het gebruik van een specifiek betaalinstrument kan verifiëren, met inbegrip van het gebruik van
      persoonlijke beveiligingsgegevens van de betaaldienstgebruiker;

      *back-to-back lening:* kredietinstrument waarbij de kredietnemer geld of financiële instrumenten ter beschikking
      krijgt, waartegenover de kredietverstrekker een zekerheid ontvangt, direct of indirect, uit eigen liquide middelen
      van de kredietnemer;

      *betaalgegevens:* gegevens die samenhangen met het houden van een betaalrekening en met het uitvoeren van een
      betalingstransactie vanaf deze rekening;

      *betalingstransactie op afstand:* betalingstransactie die via het internet of met een voor communicatie op afstand
      bruikbaar apparaat wordt geïnitieerd;

      *daggeld:* kortlopende vorderingen die dagelijks opvraagbaar zijn en die uiterlijk twee werkdagen na opvraging dan
      wel opzegging moeten worden terugbetaald;

      *gemiddeld uitstaand elektronisch geld:* het gemiddelde totale bedrag gedurende de zes voorafgaande kalendermaanden
      van de met elektronisch geld verband houdende financiële verplichtingen dat op het eind van elke kalenderdag in
      omloop is, berekend op de eerste kalenderdag van elke kalendermaand en toegepast voor die kalendermaand.

      *gevoelige betaalgegevens:* betaalgegevens, waaronder persoonlijke beveiligingsgegevens, met behulp waarvan
      fraude kan worden gepleegd, met uitzondering van de naam van de rekeninghouder en het rekeningnummer voor
      zover betaalinitiatie- en rekeninginformatiedienstverleners deze gegevens gebruiken ten behoeve van hun
      bedrijfsuitoefening;

      *groepsbestuurder:* ieder die binnen een groep het beleid bepaalt;

      *incident:* gedraging of gebeurtenis die een ernstig gevaar vormt voor de integere uitoefening van het bedrijf van
      de desbetreffende financiële onderneming;

      *integriteitgevoelige functie:*

      a. leidinggevende functie direct onder die van de personen die het beleid van een financiële onderneming bepalen of
      mede bepalen; of

      b. functie waaraan een bevoegdheid is verbonden die een wezenlijk risico inhoudt voor de integere uitoefening van
      het bedrijf van een financiële onderneming;

      *integriteitsrisico:* gevaar voor aantasting van de reputatie of bestaande of toekomstige bedreiging van vermogen
      of resultaat van een financiële onderneming als gevolg van een ontoereikende naleving van hetgeen bij of krachtens
      enig wettelijk voorschrift is voorgeschreven;

      *internationale jaarrekeningstandaarden:* internationale standaarden voor jaarrekeningen die door de Commissie
      van de Europese Gemeenschappen van toepassing zijn verklaard overeenkomstig artikel 3 van [verordening (EG) nr.
      1606/2002](32002R1606) van het Europees Parlement en de Raad van de Europese Unie van 19 juli 2002 (PbEG L 243);

      *kalenderpost:* actiefpost of passiefpost waarvan de kasinstromen respectievelijk kasuitstromen als gevolg van
      aflossing of rentebetalingen in de vervalkalender worden opgenomen;

      *kasstromen van het kernbedrijf:* kasstromen van leningen die met een vaste termijn zijn verstrekt aan
      tegenpartijen, die geen kantoren en bancaire deelnemingen zijn die niet in de rapportage worden betrokken, die
      geen banken en geen professionele geldmarktpartijen zijn, en van deze tegenpartijen met een vaste termijn opgenomen
      gelden, met inbegrip van te ontvangen onderscheidenlijk te betalen rente;

      *maandperiode:* eerste kalendermaand volgend op de verslagdatum;

      *niet-volgestorte kredietprotectie*: kredietrisicovermindering waarbij het kredietrisico met betrekking tot een
      vordering van een financiële onderneming wordt beperkt door de garantie van een derde partij om een bepaald bedrag
      uit te keren bij wanbetaling van de wederpartij of bij andere in de overeenkomst tot kredietprotectie vermelde
      gebeurtenissen die betaling onder de overeenkomst of afwikkeling van de overeenkomst tot gevolg hebben;

      *officiële stand-by faciliteiten:* liquiditeitsgarantie die, onder door de Nederlandsche Bank te stellen
      voorwaarden, is ontvangen van onderscheidenlijk afgegeven door een binnenlandse of buitenlandse bank;

      *operationeel risico*: risico van verliezen als gevolg van tekortschietende of falende interne procedures en
      systemen of als gevolg van externe gebeurtenissen, met inbegrip van juridische risico’s;

      *persoonlijke beveiligingsgegevens:* gepersonaliseerde kenmerken die door de betaaldienstverlener aan een
      betaaldienstgebruiker worden verstrekt ten behoeve van authenticatie;

      *professionele geldmarktpartij:* persoon die geen bank is en die in het kader van zijn middelenbeheer transacties
      verricht op de geldmarkt met bij de geldmarkt passende volumes en op die markt met enige regelmaat opereert op een
      manier die vergelijkbaar is met die van een bank;

      *rekeninghoudende betaaldienstverlener:* een betaaldienstverlener die ten behoeve van een betaler een
      betaalrekening aanbiedt en beheert;

      *securitisatie*: transactie of regeling waarbij:

      a. het kredietrisico van een vordering of verzameling van vorderingen wordt onderverdeeld in ten minste twee
      tranches;

      b. de in het kader van de transactie of regeling verrichte betalingen afhangen van de prestatie van de vordering of
      de verzameling van vorderingen; en

      c. de rangorde van de tranches bepalend is voor de verdeling van de verliezen tijdens de looptijd van de transactie
      of regeling;

      *securitisatiepositie*: vordering in het kader van een securitisatie;

      *stresstest*: onderzoek naar de risico’s die ontstaan als zich veranderingen in de marktsituatie voordoen of zouden
      voordoen die een ongunstige invloed uitoefenen op de toereikendheid van het toetsingsvermogen van een financiële
      onderneming, en naar de risico’s die ontstaan als zekerheidsrechten worden uitgeoefend in crisissituaties;

      *tegenpartijkredietrisico*: risico dat de wederpartij bij een transactie in gebreke blijft voordat de definitieve
      afwikkeling van de met de transactie samenhangende kasstromen heeft plaatsgevonden;

      *toetsingsvermogen:* het eigen vermogen, bedoeld in artikel 72 van de verordening kapitaalvereisten of, in het
      geval van beleggingsondernemingen in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen, artikel
      9 van de verordening prudentiële vereisten voor beleggingsondernemingen;

      *tranche*: contractueel vastgesteld segment van het kredietrisico van een gesecuritiseerde vordering of verzameling
      van vorderingen, waarbij een securitisatiepositie in dit segment een groter of kleiner risico op verlies meebrengt
      dan een securitisatiepositie van dezelfde omvang in elk ander segment, indien geen rekening wordt gehouden
      met de volgestorte of niet-volgestorte kredietprotectie die door derden rechtstreeks aan de houders van de
      securitisatieposities in dit segment of in andere segmenten wordt geboden;

      *verordening digitale operationele weerbaarheid:* [Verordening (EU) 2022/2554](32022R2554) van het Europees
      Parlement en de Raad van 14 december 2022 betreffende digitale operationele weerbaarheid voor de financiële sector
      en tot wijziging van de [Verordeningen (EG) nr. 1060/2009](32009R1060), [(EU) nr. 648/2012](32012R0648), [(EU)
      nr. 600/2014](32014R0600), [(EU) nr. 909/2014](32014R0909) en [(EU) 2016/1011](32016R1011) (PbEU 2022, L 333);

      *verordening solvabiliteit II:* gedelegeerde verordening (EU) nr. 2015/35 van de Commissie van 10 oktober 2014
      tot aanvulling van Richtlijn 2009/138/EG van het Europees Parlement en de Raad betreffende de toegang tot en
      uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II) (PbEU L12);

      *verslagdatum:* datum van de dag direct voorafgaande aan de periode waarover wordt gerapporteerd;

      *vervalkalender:* overzicht van contractuele looptijden van overeenkomsten gesloten door een financiële
      onderneming;

      *volgestorte kredietprotectie*: kredietrisicovermindering waarbij het kredietrisico met betrekking tot een
      vordering van een financiële onderneming wordt beperkt door het recht van die financiële onderneming om bij
      wanbetaling van de wederpartij of bij andere specifieke gebeurtenissen in verband met de wederpartij die gevolgen
      hebben of kunnen hebben voor het kredietrisico met betrekking tot de vordering:

      a. bepaalde activa of posten buiten de balanstelling te gelde te maken;

      b. bepaalde activa of posten buiten de balanstelling over te nemen;

      c. de eigendom van bepaalde activa of posten buiten de balanstelling te verwerven of te behouden;

      d. de waarde van bepaalde activa of posten buiten de balanstelling te verlagen; of

      e. de waarde van bepaalde activa of posten buiten de balanstelling te vervangen door het verschil tussen deze
      waarde en de waarde van een vordering op de financiële onderneming;

      *voorraadposten:* liquide activa die niet in de vervalkalender worden opgenomen;

      *waarde van de gekwalificeerde deelneming:* koopprijs van een aandeel, op het moment van de verwerving of
      vergroting van de gekwalificeerde deelneming, vermenigvuldigd met het aantal verworven aandelen;

      *weekperiode:* eerste zeven kalenderdagen volgend op de verslagdatum;

      *de wet:* de [Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
