  - number: '26.02'
    text: |-
      1 Een premiepensioeninstelling voert in het kader van het risicobeheer ten minste eenmaal per drie jaar een
      eigenrisicobeoordeling uit en legt de resultaten hiervan schriftelijk vast.

      2 De eigenrisicobeoordeling en de vastlegging van de resultaten hiervan wordt door de premiepensioeninstelling in
      aanmerking genomen bij het nemen van strategische beslissingen en omvat in ieder geval:

      a. een beoordeling van de relevante risico’s, bedoeld in [artikel 23, tweede lid][ref1] en
      [artikel 26.0, tweede lid][ref2];

      b. een beoordeling van de doelmatigheid van het beleid, bedoeld in [artikel 23, eerste lid][ref3], en de procedures
      en maatregelen, bedoeld in artikel 23, derde lid, en [artikel 26.0, eerste en derde lid][ref4];

      c. een kwalitatieve beoordeling van de mechanismen ter bescherming van de pensioenuitkeringen;

      d. een beschrijving van de methoden waarover een premiepensioeninstelling beschikt om de risico’s, bedoeld in
      onderdeel a, te identificeren en evalueren; en

      e. een beschrijving van de wijze waarop de eigenrisicobeoordeling overeenkomstig het bepaalde in
      [artikel 23, derde lid][ref5], is geïntegreerd in de bedrijfsprocessen.

      3 Indien het risicoprofiel van de premiepensioeninstelling, dan wel het risicoprofiel van een door de
      premiepensioeninstelling uitgevoerde pensioenregeling, in belangrijke mate wijzigt, vindt zo spoedig mogelijk
      een nieuwe eigenrisicobeoordeling plaats, met dien verstande dat bij een wijziging in het risicoprofiel van een
      specifieke pensioenregeling de eigenrisicobeoordeling beperkt kan blijven tot de betreffende pensioenregeling.

      4 De premiepensioeninstelling zendt de door het bestuur vastgestelde resultaten van de eigenrisicobeoordeling of
      wijzigingen in de resultaten van de eigenrisicobeoordeling zo spoedig mogelijk na de totstandkoming daarvan aan
      de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
