  - number: 27a
    text: |-
      1 Indien een betaalinstelling voornemens is werkzaamheden in verband met het verlenen van betaaldiensten uit te
      besteden, stelt zij de Nederlandsche Bank daarvan in kennis.

      2 Een betaalinstelling deelt de Nederlandse Bank onverwijld elke wijziging mee met betrekking
      tot het gebruik van entiteiten waaraan werkzaamheden worden uitbesteed en, in overeenstemming met
      [artikel 2:3c, tweede lid, van de wet][ref1], van het gebruik van betaaldienstagenten.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op elektronischgeldinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel23c
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 2:3c
  - number: 27b
    text: |-
      Bij de uitbesteding van werkzaamheden in verband met het verlenen van betaaldiensten draagt de betaalinstelling er
      zorg voor dat uitbesteding de verplichtingen van de betaalinstelling jegens haar cliënten en de rechten van haar
      cliënten uit hoofde van de [wet][ref1] of [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref2] niet wijzigt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0005290
  - number: 27c
    text: |-
      De Nederlandsche Bank kan ter uitvoering van internationaal aanvaarde standaarden nadere regels stellen met
      betrekking tot de uitbesteding door afwikkelondernemingen van werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel27c
  - number: 27d
    text: |-
      Een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-omvang, voldoet met
      betrekking tot uitbesteding van werkzaamheden aan artikel 49 van de richtlijn solvabiliteit II, met inachtneming
      van titel I, hoofdstuk IX, afdeling 4, van de verordening solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel27d
  - number: 27e
    text: |-
      Artikel 49 van de richtlijn solvabiliteit II en titel I, hoofdstuk IX, afdeling 4, van de verordening solvabiliteit
      II inzake uitbesteding van werkzaamheden zijn van overeenkomstige toepassing op de volgende verzekeraars, voor
      zover zij hun bedrijf uitoefenen vanuit een in Nederland gelegen bijkantoor:

      a. levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;

      b. herverzekeraars met zetel in een niet-aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel27e
  - number: 27f
    text: |-
      1 Een premiepensioeninstelling stelt de Nederlandsche Bank tijdig in kennis van het voornemen om werkzaamheden
      uit te besteden en van belangrijke ontwikkelingen met betrekking tot de uitbestede werkzaamheden. Bij
      uitbesteding van de uitoefening van de interne controlefunctie, de risicobeheerfunctie of het beheer van de
      premiepensioeninstelling, stelt de premiepensioeninstelling de Nederlandsche Bank daarvan in kennis voordat de
      overeenkomst, bedoeld in [artikel 31][ref1], in werking treedt.

      2 In geval van uitbesteding van werkzaamheden door een premiepensioeninstelling aan een onderneming die geen
      financiële onderneming is, draagt een premiepensioeninstelling er zorg voor dat het beloningsbeleid van die
      onderneming in overeenstemming is met de vereisten ingevolge [afdeling 1.7.2. van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Afdeling1.7.2
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel27f
