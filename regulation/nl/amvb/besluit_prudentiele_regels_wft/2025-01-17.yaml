      1 Het minimumbedrag aan eigen vermogen, bedoeld in [artikel 3:53, eerste lid, van de wet][ref1] bedraagt:

      a. € 5 miljoen voor een bank als bedoeld in [artikel 3:53, eerste lid][ref2], of
      [3:54, eerste lid, van de wet][ref3] die geen bank als bedoeld in onderdeel b is, of voor een clearinginstelling
      als bedoeld in [artikel 3:53, eerste lid][ref4], of [3:55, eerste lid, van de wet][ref5];

      b. € 2,5 miljoen voor een bank als bedoeld in [artikel 2:13 van de wet][ref6] die in hoofdzaak haar bedrijf maakt
      van het verlenen van beleggingsdiensten of het verrichten van beleggingsactiviteiten;

      c. € 125.000 voor een beheerder van een beleggingsinstelling als bedoeld in
      [artikel 3:53, eerste lid van de wet][ref7];

      d. € 125.000 voor een beheerder van een icbe als bedoeld in [artikel 3:53, eerste lid, van de wet][ref8];

      e. € 300.000 voor een beleggingsmaatschappij of een maatschappij voor collectieve belegging in effecten als bedoeld
      in [artikel 3:53, eerste lid, van de wet][ref9] die geen aparte beheerder hebben;

      f. € 750.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref10], of
      [3:54, eerste lid, van de wet][ref11] die de beleggingsdienst verleent, bedoeld in onderdeel e van de definitie
      van het verlenen van een beleggingsdienst in [artikel 1:1 van de wet][ref12], of de beleggingsactiviteit verricht,
      bedoeld in onderdeel a van de definitie van het verrichten van een beleggingsactiviteit in artikel 1:1 van de wet;

      g. € 750.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref13], of
      [3:54, eerste lid, van de wet][ref14] die de beleggingsactiviteit verricht, bedoeld in onderdeel b van de definitie
      van het verrichten van een beleggingsactiviteit in [artikel 1:1 van de wet][ref15], indien de beleggingsonderneming
      handelt voor eigen rekening of het de beleggingsonderneming op grond van haar vergunning is toegestaan te handelen
      voor eigen rekening;

      h. € 75.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref16], of
      [3:54, eerste lid, van de wet][ref17], die niet handelt voor eigen rekening en die uitsluitend een of meer van de
      beleggingsdiensten, bedoeld in de onderdelen a, b, c, d en f van de definitie van verlenen van een beleggingsdienst
      in [artikel 1:1 van de wet][ref18], verleent en waaraan het op grond van haar vergunning niet is toegestaan gelden
      of financiële instrumenten van cliënten onder zich te houden;

      i. € 150.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref19], of
      [3:54, eerste lid, van de wet][ref20], niet zijnde een beleggingsonderneming als bedoeld in de onderdelen f tot en
      met h;

      j. € 20.000 voor een betaalinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref21] die uitsluitend
      de in punt 6 van de bijlage bij de richtlijn betaaldiensten vermelde betaaldienst verleent;

      k. € 50.000 voor een betaalinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref22] die uitsluitend
      de in punt 7 van de richtlijn betaaldiensten vermelde betaaldienst verleent;

      l. € 125.000 voor een betaalinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref23] die een in de
      punten 1 tot en met 5 van de bijlage bij de richtlijn betaaldiensten vermelde betaaldienst verleent;

      m. € 730.000 voor een bewaarder als bedoeld in [artikel 3:53, eerste lid, van de wet][ref24] of het bedrag als
      berekend overeenkomstig artikel 315 of 317 van de verordening kapitaalvereisten indien dat bedrag hoger is;

      n. € 350.000 voor een elektronischgeldinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref25];

      o. € 500.000 voor een premiepensioeninstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref26];

      p. € 112.500 voor een pensioenbewaarder als bedoeld in [artikel 3:53, eerste lid, van de wet][ref27];

      q. € 1 miljoen voor een kredietunie als bedoeld in [artikel 3:53, eerste lid, van de wet][ref28].

      2 Voor de toepassing van het eerste lid wordt een beheerder van een beleggingsinstelling of een beheerder van
      een icbe die tevens een beleggingsdienst verleent op grond van [artikel 2:67a, tweede lid, van de wet][ref29],
      respectievelijk [artikel 2:69c, tweede lid, van de wet][ref30] gelijkgesteld met een beleggingsonderneming, met
      dien verstande dat het minimumbedrag aan eigen vermogen ten minste € 125.000 bedraagt.


