  - number: 40p
    text: |-
      1 Een bank die een aanvraag doet als bedoeld in [artikel 3:33a, tweede lid, van de wet][ref1], verstrekt aan de
      Nederlandsche Bank de volgende informatie ten aanzien van het programma van gedekte obligaties:

      a. een juridische opinie van een juridisch deskundige die onafhankelijk is van de bank op basis waarvan de
      Nederlandsche Bank kan beoordelen of wordt voldaan aan [artikel 40e, eerste lid][ref2];

      b. de overeenkomsten van de rechtspersoon die rechthebbende is van de dekkingsactiva met zijn bestuurder;

      c. de overeenkomst met de dekkingspoolmonitor of de accountant, bedoeld in [artikel 40n][ref3];

      d. een schriftelijke verklaring van de bestuurder van de bank waaruit blijkt dat aan het bepaalde ingevolge de
      [artikelen 3:33a, derde en vierde lid][ref4], [3:33b][ref5] en [3:33ba][ref6] wordt voldaan; en

      e. andere door de Nederlandsche Bank benodigde informatie voor de beoordeling, bedoeld in
      [artikel 3:33a, tweede lid van de wet][ref7].

      2 Een bank waaraan toestemming is verleend op grond van [artikel 3:33a, tweede lid, van de wet][ref8] meldt de
      Nederlandsche Bank terstond wijzigingen met betrekking tot de gegevens, bedoeld in het eerste lid, onderdelen b en
      c. Zij verstrekt de verklaring, bedoeld in het eerste lid, onderdeel d, jaarlijks.

      3 De gegevens, bedoeld in [artikel 3:33ba, tweede lid, van de wet][ref9], zijn:

      a. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan de dekkingsvereisten in de
      [artikelen 40f][ref10] en [40g][ref11];

      b. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan de vereisten met betrekking
      tot waardering, verzekering en lokalisatie in de [artikelen 40h][ref12] en [40i][ref13];

      c. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan de vereisten met betrekking
      tot in de dekkingspool opgenomen derivatencontracten in [artikel 40j][ref14];

      d. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan de vereisten met betrekking
      tot de liquiditeitsbuffer in [artikel 40k][ref15];

      e. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan de vereisten met betrekking
      tot de verlengbare looptijd in [artikel 40m][ref16]; en

      f. andere door de Nederlandsche Bank benodigde informatie voor de beoordeling of de bank voldoet aan het bepaalde
      ingevolge de [artikelen 3:33a, derde en vierde lid][ref17], [3:33b][ref18] en [3:33ba, eerste lid][ref19].

      4 De gegevens, bedoeld in het derde lid, onderdelen a en d, worden bij aanvang van het programma verstrekt en
      vervolgens elk kwartaal. De gegevens, bedoeld in het derde lid, onderdelen b, c, e en f, worden bij aanvang van het
      programma verstrekt en uitsluitend opnieuw verstrekt indien zij zijn gewijzigd of op verzoek van de Nederlandsche
      Bank.

      5 Een bank die een gedekte obligatie uitgeeft, en die gedurende de looptijd van de gedekte obligatie voornemens is
      significante wijzigingen aan te brengen in de voorwaarden die van toepassing zijn op die gedekte obligatie, doet
      voorafgaand aan het doorvoeren daarvan mededeling aan de Nederlandsche Bank.


