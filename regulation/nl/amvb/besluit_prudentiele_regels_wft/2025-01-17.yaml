  - number: '26'
    text: |-
      1 Een beheerder van een icbe, een bewaarder, pensioenbewaarder of premiepensioeninstelling beschikt over procedures
      en maatregelen die waarborgen dat de omvang en samenstelling van en mutaties in de aan te houden financiële
      waarborgen getrouw en volledig kunnen worden vastgesteld.

      2 Met het oog op de bewaking en beheersing van solvabiliteitsrisico’s voorziet de bedrijfsvoering van een beheerder
      van een icbe of een premiepensioeninstelling in ieder geval in de bewaking en beheersing van de:

      a. aard en omvang van de activa en passiva;

      b. niet uit de balans blijkende verplichtingen; en

      c. resultaatontwikkeling, uitgesplitst naar de onderscheiden bedrijfsactiviteiten en bedrijfsonderdelen.

      3 Met het oog op de bewaking en beheersing van liquiditeitsrisico’s voorziet de bedrijfsvoering van een beheerder
      van een icbe voor elke icbe die hij beheert onder meer in autorisatieprocedures, limietstellingen, limietbewaking
      en procedures en maatregelen voor noodsituaties met betrekking tot de liquiditeitspositie van de icbe.

      4 In voorkomend geval voert een beheerder van een icbe stresstests uit die een beoordeling van het
      liquiditeitsrisico van de instelling voor collectieve belegging in effecten in uitzonderlijke omstandigheden
      mogelijk maken.

      5 De beheerder van een icbe draagt er zorg voor dat voor elke door hem beheerde instelling voor collectieve
      belegging in effecten het liquiditeitsprofiel past bij het terugbetalingsbeleid dat in het fondsreglement, in de
      statuten of in het prospectus is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26
  - number: '26.0'
    text: |-
      1 De procedures en maatregelen van een premiepensioeninstelling ter beheersing van de relevante risico’s, bedoeld
      in [artikel 23, derde lid][ref1], zijn gericht op de relevante risico’s waaraan de premiepensioeninstelling
      wordt of kan worden blootgesteld, alsmede op de risico’s voor de door de premiepensioeninstelling uitgevoerde
      pensioenregelingen, waarbij de onderlinge afhankelijkheden en relaties in acht worden genomen.

      2 Tot de relevante risico’s voor een premiepensioeninstelling worden, in aanvulling op de risico’s, bedoeld in
      [artikel 23, tweede lid][ref2], tevens gerekend:

      a. risico’s in verband met afgestemd beheer van activa en passiva;

      b. risico’s in verband met beleggingen, met name derivatencontracten, securitisaties en vergelijkbare
      overeenkomsten;

      c. risico’s in verband met verzekering en andere risicobeperkingstechnieken;

      d. bestaande of opkomende risico’s met betrekking tot het milieu, maatschappelijk verantwoord ondernemen of
      behoorlijk bestuur, waaronder risico’s op het gebied van klimaatverandering, het gebruik van hulpbronnen,
      maatschappelijke risico’s of risico’s in verband met waardevermindering van activa als gevolg van gewijzigde
      regelgeving; en

      e. de risico’s die de pensioendeelnemers, gewezen pensioendeelnemers of pensioengerechtigden dragen overeenkomstig
      de voorwaarden van de pensioenregeling, vanuit het oogpunt van de pensioendeelnemer of pensioengerechtigde.

      3 Een premiepensioeninstelling draagt er zorg voor dat de procedures en maatregelen, bedoeld in
      [artikel 23, derde lid][ref3], tevens procedures omvatten voor het rapporteren van relevante risico’s
      door de risicobeheerfunctie aan het bestuur en, indien aanwezig, het toezichthoudend orgaan van de
      premiepensioeninstelling.

      4 De premiepensioeninstelling evalueert het beleid, bedoeld in [artikel 23, eerste lid][ref4], ten minste eenmaal
      per drie jaar en past het beleid in geval van een belangrijke wijziging op het gebied van het risicobeheer of met
      betrekking tot de overige onderdelen van de bedrijfsvoering zo spoedig mogelijk aan.

      5 De premiepensioeninstelling draagt er zorg voor dat in de procedures en maatregelen, bedoeld in
      [artikel 23, derde lid][ref5], voor de beoordeling van de kredietwaardigheid van de activa niet uitsluitend of
      mechanisch wordt uitgegaan van ratings, uitgegeven door een ratingbureau.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
