        bwb_id: BWBR0020420
        artikel: '29'
        hoofdstuk: '5'
  - number: 32a
    text: |-
      1 Dit hoofdstuk is, met uitzondering van [artikel 27a][ref1], slechts van toepassing op het uitbesteden van
      werkzaamheden door betaalinstellingen of elektronischgeldinstellingen voor zover het belangrijke werkzaamheden
      betreft.

      2 Een werkzaamheid wordt als belangrijk aangemerkt indien een gebrekkige of tekortschietende uitvoering
      ervan wezenlijk afbreuk zou doen aan de naleving door de betaalinstelling van de vergunningsvereisten,
      als bedoeld in [artikel 2:3b van de wet][ref2], of van andere verplichtingen ingevolge de [wet][ref3] of
      [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref4], dan wel aan haar financiële resultaten of de soliditeit of
      continuïteit van haar betaaldiensten.

      3 Een werkzaamheid wordt als belangrijk aangemerkt indien een gebrekkige of tekortschietende uitvoering ervan
      wezenlijk afbreuk zou doen aan de naleving door de elektronischgeldinstelling van de vergunningvereisten, genoemd
      in [artikel 2:10b van de wet][ref5], dan wel aan haar financiële resultaten of de soliditeit of continuïteit van
      haar dienstverlening ter zake van de uitgifte van elektronisch geld.


