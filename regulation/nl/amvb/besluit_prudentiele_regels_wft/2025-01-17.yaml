  - number: '66'
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1], [3:58, eerste of tweede lid][ref2],
      [3:59, eerste lid][ref3], [3:61, eerste of tweede lid][ref4], of [3:62, eerste lid][ref5], met beperkte
      risico-omvang berekent het op hem of op het in Nederland gelegen bijkantoor van toepassing zijnde
      solvabiliteitskapitaalvereiste ten minste eenmaal per jaar en opnieuw indien het risicoprofiel van de verzekeraar
      duidelijk afwijkt van de aannames die ten grondslag lagen aan de laatste berekening, of indien de Nederlandsche
      Bank daarom verzoekt vanwege aanwijzingen dat het risicoprofiel sinds die laatste berekening duidelijk is
      veranderd. De verzekeraar meldt de uitkomst van een tussentijdse herberekening onverwijld aan de Nederlandsche
      Bank.

      2 De verzekeraar maakt voor de berekening, bedoeld in het eerste lid, gebruik van de standaardformule, bedoeld in
      artikel 103 van de richtlijn solvabiliteit II, zonder toepassing van de in onderdeel c van dat artikel bedoelde
      correctie voor het verliesabsorberend vermogen van de technische voorzieningen. Titel I, hoofdstuk VI, afdeling
      4, onderafdeling 2, van de richtlijn solvabiliteit II en titel I, hoofdstuk V, van de verordening solvabiliteit II
      zijn van overeenkomstige toepassing, met dien verstande dat de verzekeraar de vereenvoudigde berekeningsmethoden
      als bedoeld in de artikelen 89 tot en met 112 van de verordening, kan toepassen, mits:

      a. deze berekeningsmethoden passen bij de aard, omvang en complexiteit van de risico’s van de verzekeraar en deze
      berekeningen niet leiden tot een significante onderschatting van het solvabiliteitskapitaalvereiste;

      b. het gebruik ervan goed wordt onderbouwd en vastgelegd;

      c. ten aanzien van de toepassing van de berekeningsmethoden een bestendige gedragslijn wordt gevolgd.

      3 [Artikel 65, vierde lid][ref6], is van overeenkomstige toepassing.

      4 De verzekeraar kan bij de berekening van het solvabiliteitskapitaalvereiste rekening houden met:

      a. aanwezige risicomitigerende instrumenten, mits deze aantoonbaar effectief zijn en niet resulteren in een
      materieel basisrisico als bedoeld in artikel 1, punt 25, van de verordening solvabiliteit II;

      b. toekomstige risicomitigerende instrumenten, mits deze realistisch zijn en aantoonbaar voortvloeien uit de
      reguliere bedrijfsvoering, het gevoerde risicobeheer of het afdekkingsbeleid.

      5 In afwijking van het tweede lid, tweede volzin, gaat een verzekeraar die het natura-uitvaartverzekeringsbedrijf
      uitoefent bij de toepassing van artikel 142, zesde lid, onderdeel b, van de verordening solvabiliteit II uit van de
      stopzetting van 20% van de verzekeringsovereenkomsten.

      6 Het vijfde lid is van overeenkomstige toepassing op levensverzekeraars met beperkte risico-omvang als bedoeld in
      [artikel 49b, tweede lid, onderdeel a][ref7].

      7 [Artikel 65, negende lid][ref8], is van overeenkomstige toepassing.


