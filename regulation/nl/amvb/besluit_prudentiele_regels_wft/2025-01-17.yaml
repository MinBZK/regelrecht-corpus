      1 De Nederlandsche Bank kan, al dan niet periodiek, andere gegevens dan de gegevens, bedoeld in artikel 24, eerste,
      tweede en vierde lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen, van een beheerder van
      een beleggingsinstelling verlangen indien de Nederlandsche Bank dit nodig acht om de stabiliteit van het financiële
      stelsel te waarborgen.

      2 De Nederlandsche Bank kan de in het eerste lid bedoelde gegevens alleen verlangen indien de Europese Autoriteit
      van effecten en markten hiervan in kennis is gesteld of de Europese Autoriteit van effecten en markten de
      Nederlandsche Bank hierom heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel135a
  - number: 135b
    text: |-
      De Nederlandsche Bank kan ter uitvoering van internationaal aanvaarde standaarden nadere regels stellen met
      betrekking tot het effectief verlenen van afwikkeldiensten.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel135b
