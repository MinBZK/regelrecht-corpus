  - number: '24'
    text: |-
      1 Een bank, beheerder van een icbe, beleggingsonderneming, betaalinstelling, clearinginstelling,
      elektronischgeldinstelling, kredietunie, premiepensioeninstelling, verzekeraar met beperkte risico-omvang,
      wisselinstelling of bijkantoor als bedoeld in [artikel 23, eerste lid][ref1], ziet er op systematische wijze
      op toe dat de procedures en maatregelen, bedoeld in artikel 23, derde lid, worden nageleefd en zorgt ervoor dat
      gesignaleerde tekortkomingen of gebreken worden opgeheven.

      2 Een betaaldienstverlener die betaaldiensten verleent als bedoeld onder 7 van de bijlage bij de
      richtlijn betaaldiensten, beschikt over een beroepsaansprakelijkheidsverzekering, of over een andere
      vergelijkbare waarborg, tegen aansprakelijkheid ingevolge de artikelen [528][ref2], [545a][ref3] of
      [547 van boek 7 van het Burgerlijk Wetboek][ref4].

      3 Een betaaldienstverlener die betaaldiensten verleent als bedoeld onder 8 van de bijlage bij de richtlijn
      betaaldiensten, beschikt over een verzekering, of over een andere vergelijkbare waarborg, tegen aansprakelijkheid
      jegens de rekeninghoudende betaaldienstverlener of de betaaldienstgebruiker als gevolg van niet-toegestane of
      frauduleuze toegang tot of niet-toegestaan of frauduleus gebruik van betaalrekeninginformatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
