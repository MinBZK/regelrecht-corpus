  - number: '13'
    text: |-
      1 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie,
      bank, kredietunie, premiepensioeninstelling, verzekeraar, wisselinstelling of bijkantoor als bedoeld in
      [artikel 11, eerste lid][ref1], maakt een onderbouwde beoordeling van de betrouwbaarheid van personen die zij wil
      benoemen in een integriteitsgevoelige functie.

      2 De financiële onderneming, onderscheidenlijk het bijkantoor, draagt zorg voor de beoordeling van de
      betrouwbaarheid van degenen die, anders dan op grond van een arbeidsovereenkomst, werkzaamheden in een
      integriteitgevoelige functie verrichten.

      3 Het eerste en tweede lid zijn niet van toepassing op een verzekeraar, niet zijnde een verzekeraar met beperkte
      risico-omvang, voor zover het een integriteitgevoelige functie betreft die is aan te merken als een sleutelfunctie
      als bedoeld in artikel 42, eerste lid, van de richtlijn solvabiliteit II.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel13
    references:
