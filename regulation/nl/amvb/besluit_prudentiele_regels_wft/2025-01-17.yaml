  - number: 40h
    text: |-
      1 Een bank die gedekte obligaties uitgeeft en fysieke zekerheidsactiva hanteert die strekken tot zekerheid
      van de dekkingsactiva als bedoeld in artikel 129, eerste lid, onderdelen d tot en met g, van de verordening
      kapitaalvereisten, voldoet aan de vereisten van artikel 208 van die verordening.

      2 De fysieke zekerheidsactiva worden gewaardeerd tegen of onder de marktwaarde of de hypotheekwaarde, bedoeld in
      artikel 4, eerste lid, onderdeel 76, onderscheidenlijk onderdeel 74, van de verordening kapitaalvereisten.

      3 De waardering van de fysieke zekerheidsactiva wordt uitgevoerd door een taxateur die voldoet aan de eisen,
      bedoeld in artikel 6, vijfde lid, onderdelen b en c, van de richtlijn gedekte obligaties.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel40h
  - number: 40i
    text: |-
      1 Een bank die gedekte obligaties uitgeeft, draagt er zorg voor dat de debiteur van de dekkingsactiva zijn
      woonplaats heeft, respectievelijk is gevestigd of zijn zetel heeft, binnen de grenzen van de lidstaten van de
      Europese Unie, of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte.

      2 Een bank draagt er zorg voor dat, indien van toepassing, het fysieke zekerheidsactivum is gelegen binnen de
      grenzen van de lidstaten van de Europese Unie, of in een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel40i
  - number: 40j
    text: |-
      1 Een bank die gedekte obligaties uitgeeft, draagt er zorg voor dat in de dekkingspool uitsluitend een
      derivatencontract wordt opgenomen indien dit bijdraagt aan de beheersing van risico’s voor de houders van gedekte
      obligaties. Een derivatencontract wordt uit de dekkingspool verwijderd indien het risico voor de houders van
      gedekte obligaties ophoudt te bestaan.

      2 Het volume van een derivatencontract wordt aangepast indien sprake is van een vermindering van het risico waarop
      het derivatencontract betrekking heeft. Een derivatencontract wordt uit de dekkingspool verwijderd indien het
      risico voor de houders van gedekte obligaties ophoudt te bestaan.

      3 Een derivatencontract kan uitsluitend in de dekkingspool worden opgenomen, indien het contract:

      a. voldoende is gedocumenteerd;

      b. niet kan worden beëindigd indien de bank die de gedekte obligaties heeft uitgegeven in staat van faillissement
      is verklaard, of indien jegens de bank op grond van [Deel 3A van de wet][ref1] een afwikkelingsmaatregel is
      toegepast;

      c. is gesloten met een financiële onderneming die onder toezicht staat; en

      d. in geval van verlies van voldoende kredietwaardigheid van de wederpartij verplicht dat de wederpartij gepaste
      zekerheid verschaft of zich als wederpartij doet vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel40j
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 40k
    text: |-
      1 Een bank die gedekte obligaties uitgeeft, draagt er zorg voor dat de dekkingspool te allen tijde een uit liquide
      activa samengestelde liquiditeitsbuffer bevat, die beschikbaar is om de nettoliquiditeitsuitstroom, bedoeld in
      artikel 3, onderdeel 16, van de richtlijn gedekte obligaties, van het programma van gedekte obligaties te dekken.

      2 De liquiditeitsbuffer, bedoeld in het eerste lid, dekt de maximale gecumuleerde nettoliquiditeitsuitstroom
      tijdens de volgende 180 dagen.

      3 Indien de looptijd van een gedekte obligatie op grond van [artikel 40m][ref1] kan worden verlengd, wordt bij de
      berekening van de nettoliquiditeitsuitstroom, bedoeld in het tweede lid, uitgegaan van de hoofdsom, gebaseerd op
      de einddatum.

      4 De liquiditeitsbuffer, bedoeld in het eerste lid, omvat de activa, bedoeld in artikel 16, derde lid, onderdelen a
      en b, van de richtlijn gedekte obligaties.

      5 Niet door zekerheden gedekte vorderingen waarbij wanbetaling als bedoeld in artikel 178 van de verordening
      kapitaalvereisten wordt geacht zich te hebben voorgedaan, kunnen niet bijdragen aan de liquiditeitsbuffer van de
      dekkingspool.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40m
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel40k
