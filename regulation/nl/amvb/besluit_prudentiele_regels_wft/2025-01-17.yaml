  - number: 105f
    text: |-
      1 De vereiste omvang van de kapitaalbuffer, bedoeld in [artikel 105][ref1], wordt gedekt door tier 1-kernkapitaal
      als bedoeld in artikel 50 van de verordening kapitaalvereisten.

      2 Het tier 1-kernkapitaal dat wordt aangehouden ter dekking van de kapitaalbuffer dient niet tevens ter dekking van
      de minimumomvang van het toetsingsvermogen ingevolge [artikel 59, derde lid][ref2].

      3 Een bank of beleggingsonderneming als bedoeld in [artikel 3:62a, eerste lid, van de wet][ref3], beschikt
      over voldoende kapitaal dat naar aard, omvang en samenstelling noodzakelijk is om zowel te voldoen aan de
      kapitaalbuffer, als aan elk van de in artikel 92, eerste lid, onderdeel a tot en met c, van de verordening
      kapitaalvereisten genoemde kapitaalratio’s en aan de hogere eisen van solvabiliteit opgelegd op grond van
      [artikel 3:111a, tweede lid, onderdeel a, van de wet][ref4], ter ondervanging van andere risico's dan het risico
      van buitensporige hefboomwerking.

      4 Het tier 1-kernkapitaal dat wordt aangehouden ter dekking van de kapitaalbuffer dient niet tevens ter
      dekking van de in artikel 92, eerste lid, onderdeel a tot en met c, van de verordening kapitaalvereisten
      genoemde kapitaalratio’s of de hogere eisen van solvabiliteit en liquiditeit opgelegd op basis van
      [3:111a, tweede lid, onderdeel a, van de wet][ref5], ter ondervanging van andere risico’s dan het
      risico van buitensporige hefboomwerking, of ter dekking van de door de Nederlandsche Bank op grond van
      [artikel 3:111aa, eerste lid, van de wet][ref6], medegedeelde richtsnoeren voor het ondervangen van andere
      risico's dan het risico van buitensporige hefboomwerking.

      5 Het tier 1-kernkapitaal dat wordt aangehouden ter dekking van een van de componenten van de kapitaalbuffer dient
      niet tevens ter dekking van een van de andere componenten van de kapitaalbuffer.

      6 Het tier 1-kernkapitaal dat wordt aangehouden ter dekking van de kapitaalbuffer dient niet tevens ter dekking
      van de risicogebaseerde onderdelen van de vereisten uit de artikelen 92 bis en 92 ter van de verordening
      kapitaalvereisten en de artikelen 45 quater en 45 quinquies van de richtlijn herstel en afwikkeling van banken
      en beleggingsondernemingen.


