      1 De Nederlandsche Bank stelt vast of de betrouwbaarheid van een persoon als bedoeld in
      [artikel 3:9, eerste lid][ref1], [3:11][ref2], [3:13][ref3], [3:37, derde lid en vierde lid][ref4],
      [3:47, eerste en vijfde lid][ref5], of [3:99, eerste lid, van de wet][ref6] en van een persoon als bedoeld in
      [artikel 17aa, vierde lid][ref7], buiten twijfel staat op basis van diens voornemens, handelingen en antecedenten.

      2 Het eerste lid is van overeenkomstige toepassing op de beoordeling van de betrouwbaarheid van een persoon door de
      Nederlandsche Bank op grond van een verordening als bedoeld in [artikel 1:24, derde lid, van de wet][ref8].


