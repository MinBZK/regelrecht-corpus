  - number: 23.0a
    text: |-
      In aanvulling op artikel 23, eerste lid, omvat het risicobeheerbeleid van een beheerder van een icbe procedures
      ter beheersing van duurzaamheidsrisico’s als bedoeld in artikel 2, onder 22, van [Verordening (EU) 2019/2088]
      (32088R2019) van het Europees Parlement en de Raad van 27 november 2019 betreffende informatieverschaffing over
      duurzaamheid in de financiëledienstensector (PbEU 2019, L 317).
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel23.0a
  - number: 23aa
    text: |-
      1 De Nederlandsche Bank kan een bank of beleggingsonderneming onder de verordening kapitaalvereisten verplichten
      de gestandaardiseerde methode, bedoeld in artikel 84, eerste lid, van de richtlijn kapitaalvereisten te gebruiken
      indien zij van oordeel is dat de interne systemen die de bank of beleggingsonderneming heeft voor de beoordeling
      van renterisico’s als bedoeld in dat artikellid niet adequaat zijn.

      2 De Nederlandsche Bank kan een kleine en niet-complexe instelling, als bedoeld in artikel 4, eerste lid,
      onderdeel 145 van de verordening kapitaalvereisten, verplichten de gestandaardiseerde methode te gebruiken indien
      zij van oordeel is dat de vereenvoudigde gestandaardiseerde methode, bedoeld in artikel 84, eerste lid, van de
      richtlijn kapitaalvereisten niet adequaat is voor het ondervangen van renterisico’s als bedoeld in dat artikellid.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel23aa
  - number: 23b
    text: |-
      1 Het bestuur van een bank, beleggingsonderneming of clearinginstelling als bedoeld in
      [artikel 23, eerste lid][ref1], en, indien aanwezig, het orgaan dat is belast met toezicht op het beleid en de
      algemene gang van zaken van de onderneming:

      a. zijn betrokken bij het beleid gericht op het beheersen van relevante risico’s overeenkomstig artikel 76, eerste
      en tweede lid, van de richtlijn kapitaalvereisten, dan wel, in het geval van een beleggingsonderneming in de zin
      van de richtlijn prudentieel toezicht beleggingsondernemingen, overeenkomstig artikel 28, eerste en tweede lid, van
      de richtlijn prudentieel toezicht beleggingsondernemingen;

      b. worden daarbij bijgestaan en geadviseerd door een risicocommissie overeenkomstig artikel 76, derde lid, van
      de richtlijn kapitaalvereisten, dan wel, in het geval van een beleggingsonderneming in de zin van de richtlijn
      prudentieel toezicht beleggingsondernemingen, overeenkomstig artikel 28, vierde lid, van de richtlijn prudentieel
      toezicht beleggingsondernemingen; en

      c. hebben voldoende toegang tot informatie betreffende de risicosituatie van de financiële onderneming, de
      risicobeheerfunctie en de adviezen van externe deskundigen overeenkomstig artikel 76, vierde lid, van de richtlijn
      kapitaalvereisten, dan wel, in het geval van een beleggingsonderneming in de zin van de richtlijn prudentieel
      toezicht beleggingsondernemingen, overeenkomstig artikel 28, derde en vijfde lid, van de richtlijn prudentieel
      toezicht beleggingsondernemingen.

      2 De risicobeheerfunctie van een bank, beleggingsonderneming onder de verordening kapitaalvereisten of
      clearinginstelling als bedoeld in het eerste lid is ingericht overeenkomstig artikel 76, vijfde lid, van de
      richtlijn kapitaalvereisten.

      3 Het eerste lid, onderdeel b, vindt slechts toepassing, indien de bank of beleggingsonderneming
      onder de verordening kapitaalvereisten significant is ingevolge [artikel 17d][ref2], respectievelijk
      [artikel 31f van het Besluit gedragstoezicht financiële ondernemingen Wft][ref3] dan wel indien de
      beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen niet voldoet
      aan de criteria bedoeld in artikel 32, vierde lid, onderdeel a, van de richtlijn prudentieel toezicht
      beleggingsondernemingen.

      4 [Artikel 23, tiende lid][ref4], is van overeenkomstige toepassing.

      5 Het eerste en derde lid zijn niet van toepassing op een beleggingsonderneming in de zin van de richtlijn
      prudentieel toezicht beleggingsondernemingen die kwalificeert als kleine en niet-verweven beleggingsonderneming als
      bedoeld in artikel 12, eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel17d
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel31f
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel23
