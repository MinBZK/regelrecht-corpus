  - number: 40n
    text: |-
      1 Een bank die gedekte obligaties uitgeeft, draagt er zorg voor dat voorafgaand aan de eerste uitgifte
      van een programma van gedekte obligaties een dekkingspoolmonitor wordt aangesteld die geen banden heeft
      met en onafhankelijk is van de bank en de externe accountant van de bank en die ten minste jaarlijks
      controleert of de bank voldoet aan de [artikelen 3:33b][ref1] en [3:33ba van de wet][ref2] en de
      [artikelen 40e tot en met 40m][ref3], waarbij de controle van de [artikelen 40g][ref4] en [40k][ref5] in ieder
      geval door een accountant wordt verricht.

      2 In afwijking van het eerste lid, kan een dekkingspoolmonitor worden aangesteld die banden heeft met de bank,
      waaronder de externe accountant van de bank, indien in ieder geval de jaarlijkse controle of de bank voldoet aan de
      [artikelen 40g][ref6] en [40k][ref7] door die externe accountant wordt verricht.

      3 De dekkingspoolmonitor georganiseerd overeenkomstig het tweede lid is onafhankelijk van het
      kredietacceptatieproces van de bank, kan niet van de functie van dekkingspoolmonitor worden ontheven zonder
      voorafgaande toestemming van de raad van commissarissen van de bank of het orgaan dat een daarmee vergelijkbare
      taak heeft, bedoeld in [artikel 3:19, tweede lid, van de wet][ref8], en heeft direct toegang tot de raad van
      commissarissen van de bank of het orgaan dat een daarmee vergelijkbare taak heeft, bedoeld in artikel 3:19, tweede
      lid, van de wet.

      4 De bank draagt er zorg voor dat de controle van de [artikelen 40g][ref9] en [40k][ref10] blijft plaatsvinden
      indien en nadat ten aanzien van de bank een afwikkelingsmaatregel als bedoeld in [artikel 3A:1 van de wet][ref11]
      is toegepast of indien en nadat de bank in staat van faillissement is verklaard.

      5 De bank brengt jaarlijks verslag uit aan de Nederlandsche Bank over de uitkomsten van de controle ten aanzien van
      de [artikelen 40g][ref12] en [40k][ref13].

      6 De bank draagt er zorg voor dat de dekkingspoolmonitor voor de uitoefening van zijn taken over alle daartoe
      benodigde informatie beschikt.


