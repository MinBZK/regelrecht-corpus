  - number: '32'
    text: |-
      De [artikelen 29 tot en met 31][ref1] zijn niet van toepassing op het uitbesteden van werkzaamheden aan
      ondernemingen met zetel in een lidstaat die deel uitmaken van de groep waartoe de financiële onderneming
      behoort, tenzij die financiële onderneming een bank, betaalinstelling, elektronischgeldinstelling of
      premiepensioeninstelling is.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel29
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel32
    references:
