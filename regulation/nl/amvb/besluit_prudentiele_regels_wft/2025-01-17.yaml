    text: |-
      1 Een betaalinstelling als bedoeld in [artikel 3:29a, eerste lid, van de wet][ref1] en die betaaldiensten verleent
      als bedoeld onder 1 tot en met 6 van de bijlage bij de richtlijn betaaldiensten, stelt geldmiddelen die zijn
      ontvangen van betaaldienstgebruikers of andere betaaldienstverleners voor de uitvoering van betalingstransacties op
      een van de volgende wijzen veilig:

      a. de geldmiddelen worden niet vermengd met de geldmiddelen van andere schuldeisers van de betaalinstelling; of

      b. de geldmiddelen worden gedekt door een verzekeringspolis of een vergelijkbare garantie van een verzekeraar of
      een bank die niet tot dezelfde groep behoort als de betaalinstelling, tegen het risico dat de betaalinstelling niet
      in staat is haar verplichtingen met betrekking tot de geldmiddelen na te komen, voor een bedrag dat gelijk is aan
      het bedrag dat afgescheiden zou zijn bij het ontbreken van de verzekeringspolis of vergelijkbare garantie.

      2 Indien toepassing wordt gegeven aan het eerste lid, aanhef en onderdeel a, en de geldmiddelen aan het einde
      van de werkdag, volgend op de dag waarop zij zijn ontvangen, nog niet aan de betalingsbegunstigde of aan een
      andere betaaldienstaanbieder zijn overgemaakt, worden zij op een afzonderlijke rekening gestort bij een bank
      of belegd in veilige, liquide activa met een lage risicograad, op zodanige wijze dat andere schuldeisers van de
      betaalinstelling, in het bijzonder in het geval van insolventie van de betaalinstelling, hun vorderingen niet op
      deze geldmiddelen kunnen verhalen.

      3 Voor de toepassing van het tweede lid zijn veilige activa met een lage risicograad activa die vallen in een van
      de categorieën opgenomen in artikel 336, eerste lid, tabel 1, van de verordening kapitaalvereisten waarvoor het
      kapitaalvereiste voor het specifieke risico niet hoger ligt dan 1,6%, terwijl andere in aanmerking komende activa,
      als bedoeld in artikel 336, vierde lid, van de verordening, worden uitgesloten.

      Voor de toepassing van het tweede lid zijn veilige activa met een lage risicograad eveneens deelnemingsrechten in
      een instelling voor collectieve belegging in effecten (ICBE) die enkel investeert in activa zoals gespecificeerd in
      de eerste alinea.

      In buitengewone omstandigheden en wanneer dit voldoende gemotiveerd is, mogen de bevoegde autoriteiten, op
      basis van een evaluatie van de veiligheid, de looptijd, de waarde of andere risicofactoren van de activa zoals
      gespecificeerd in de eerste en tweede alinea, bepalen welke van deze activa geen veilige activa met een lage
      risicograad zijn voor de toepassing van het tweede lid.

      4 Indien het deel van de geldmiddelen dat bestemd is voor toekomstige betalingstransacties niet bekend of variabel
      is, is het de betaalinstellingen toegestaan om het eerste lid uitsluitend toe te passen op een representatief
      gedeelte dat geacht wordt voor betalingsdiensten te worden gebruikt. Dit representatieve gedeelte moet
      redelijkerwijs kunnen worden geraamd op basis van historische gegevens.

      5 Een betaalinstelling die betaaldiensten verleent als bedoeld onder 7 van de bijlage bij de richtlijn
      betaaldiensten houdt op geen enkel moment de met het aanbieden van de betaalinitiatiedienst verband houdende
      geldmiddelen van de betaler aan.

      6 Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op elektronischgeldinstellingen als bedoeld
      in [artikel 3:29a, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel329a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel329a
