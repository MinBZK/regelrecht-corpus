      1 In afwijking van de [artikelen 3:36, derde lid][ref1], en [3:43, eerste lid, van de wet][ref2] is het
      schadeverzekeraars toegestaan in de uitoefening van hun bedrijf, naast de risico’s die behoren tot de branche
      waarvoor de vergunning is verleend, tevens risico’s te verzekeren die behoren tot andere branches, met uitzondering
      van de branches Krediet en Borgtocht, indien deze risico’s naar het oordeel van de Nederlandsche Bank als
      bijkomende risico’s kunnen worden beschouwd, omdat zij:

      a. samenhangen met het hoofdrisico dat behoort tot de branche waarvoor de vergunning is verleend;

      b. betrekking hebben op het belang of gevaarsobject dat is verzekerd tegen het hoofdrisico; en

      c. worden verzekerd bij dezelfde overeenkomst als het hoofdrisico.

      2 De risico’s van de branche Rechtsbijstand mogen uitsluitend worden verzekerd als bijkomend risico van de branche
      Hulpverlening en van branches waarbij risico’s worden verzekerd die verband houden met het gebruikvan zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel336
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel343
