  - number: '26.01'
    text: |-
      [Artikel 17aa, derde lid][ref1], is van overeenkomstige toepassing op de uitoefening van de risicobeheerfunctie
      bij een premiepensioeninstelling. De [artikelen 5, eerste lid][ref2], 17aa, vierde lid, en [17ab][ref3] zijn
      van overeenkomstige toepassing op de personen die verantwoordelijk zijn voor de risicobeheerfunctie van een
      premiepensioeninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17aa
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel17ab
