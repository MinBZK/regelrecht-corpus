  - number: '65'
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1], [3:58, eerste of tweede lid][ref2],
      [3:59, eerste lid][ref3], [3:61, eerste of tweede lid][ref4], of [3:62, eerste lid][ref5], niet zijnde een
      verzekeraar met beperkte risico-omvang, berekent het op hem of op het in Nederland gelegen bijkantoor van
      toepassing zijnde solvabiliteitskapitaalvereiste ten minste eenmaal per jaar en opnieuw indien het risicoprofiel
      van de verzekeraar duidelijk afwijkt van de aannames die ten grondslag lagen aan de laatste berekening, of indien
      de Nederlandsche Bank daarom verzoekt vanwege aanwijzingen dat het risicoprofiel sinds die laatste berekening
      duidelijk is veranderd. De verzekeraar meldt de uitkomst van een tussentijdse herberekening onverwijld aan de
      Nederlandsche Bank.

      2 De verzekeraar maakt voor de berekening, bedoeld in het eerste lid, gebruik van de standaardformule, bedoeld
      in artikel 103 van de richtlijn solvabiliteit II, of van een geheel of gedeeltelijk intern model als bedoeld in
      artikel 112, eerste lid, van de richtlijn.

      3 Een verzekeraar die de standaardformule, bedoeld in het tweede lid, toepast, berekent het
      solvabiliteitskapitaalvereiste overeenkomstig titel I, hoofdstuk VI, afdeling 4, onderafdeling 2, van de richtlijn
      solvabiliteit II en neemt daarbij titel I, hoofdstuk V, van de verordening solvabiliteit II in acht.

      4 De Nederlandsche Bank kan, overeenkomstig artikel 104, zevende lid, van de richtlijn solvabiliteit II, aan een
      verzekeraar die de standaardformule toepast, goedkeuring verlenen voor het gebruik van de in dat lid bedoelde
      ondernemingsspecifieke parameters voor de modules voor het levens-, schade- en ziektekostenverzekeringstechnische
      risico. De verzekeraar voldoet daarbij aan de in dat lid gestelde eisen.

      5 Een verzekeraar maakt uitsluitend gebruik van een intern model dat door de Nederlandsche Bank is goedgekeurd
      overeenkomstig de artikelen 112 tot en met 115 van de richtlijn solvabiliteit II. De verzekeraar voldoet aan
      de artikelen 116 en 120 tot en met 126 van de richtlijn, met inachtneming van titel I, hoofdstuk VI, van de
      verordening solvabiliteit II.

      6 De Nederlandsche Bank kan een verzekeraar als bedoeld in het eerste lid verplichten een intern model te
      gebruiken voor de berekening van het solvabiliteitskapitaalvereiste of relevante risicomodules daarvan,
      indien het risicoprofiel van de verzekeraar duidelijk afwijkt van de aannames die ten grondslag liggen aan de
      standaardformule, bedoeld in het tweede lid.

      7 Een verzekeraar die goedkeuring heeft gekregen voor het gebruik van een intern model valt niet terug op het
      gebruik van de standaardformule, bedoeld in het tweede lid, tenzij daar goede redenen voor zijn en de Nederlandsche
      Bank ermee heeft ingestemd.

      8 Een verzekeraar die niet meer voldoet aan de artikelen 120 tot en met 126 van de richtlijn solvabiliteit II dient
      onverwijld een plan in bij de Nederlandsche Bank om aan deze situatie een einde te maken. Indien de verzekeraar
      het plan niet uitvoert kan de Nederlandsche Bank de verzekeraar verplichten het solvabiliteitskapitaalvereiste te
      berekenen met gebruikmaking van de standaardformule, bedoeld in het tweede lid.

      9 Indien de Europese Commissie op grond van artikel 172, tweede of vierde lid, van de richtlijn solvabiliteit
      II het solvabiliteitsregime van een staat die geen lidstaat is gelijkwaardig acht met die van de richtlijn
      solvabiliteit II, worden voor de berekening van het solvabiliteitskapitaalvereiste herverzekeringsovereenkomsten
      met verzekeraars met zetel in die staat gelijkgesteld met herverzekeringsovereenkomsten met verzekeraars met zetel
      in een lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel357
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel358
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel359
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel361
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel362
