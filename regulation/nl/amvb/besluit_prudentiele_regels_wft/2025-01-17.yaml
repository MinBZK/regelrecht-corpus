        artikel: '11'
        hoofdstuk: '3'
  - number: '17'
    text: |-
      1 De bedrijfsvoering van een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als
      bedoeld in [artikel 3:17, eerste lid][ref1], [3:23][ref2], [3:24a][ref3], [3:24b][ref4], [3:26][ref5] of
      [3:27 van de wet][ref6] omvat:

      a. een duidelijke, evenwichtige en adequate organisatiestructuur;

      b. een duidelijke, evenwichtige en adequate verdeling van taken, bevoegdheden en verantwoordelijkheden;

      c. een adequate vastlegging van rechten en verplichtingen;

      d. eenduidige rapportagelijnen; en

      e. een adequaat systeem van informatievoorziening en communicatie.

      2 De bedrijfsvoering is afgestemd op de aard, omvang, risico’s en complexiteit van de werkzaamheden van de
      financiële onderneming of bijkantoor.

      3 De bedrijfsvoering wordt op een inzichtelijke wijze vastgelegd.

      4 De effectiviteit van de organisatie-inrichting en van de procedures en maatregelen wordt ten minste jaarlijks
      op onafhankelijke wijze getoetst. Daartoe beschikt de financiële onderneming of het bijkantoor over een
      organisatieonderdeel dat deze interne controlefunctie uitoefent. De financiële onderneming of bijkantoor voorziet
      erin dat gesignaleerde tekortkomingen worden opgeheven.

      5 De toepassing van het vierde lid op betaalinstellingen, elektronischgeldinstellingen of hun bijkantoren ziet
      tevens op het gebruik van hun betaaldienstagenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel317
