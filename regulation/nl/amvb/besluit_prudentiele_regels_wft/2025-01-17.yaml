  - number: '107'
    text: |-
      1 Het is een clearinginstelling of kredietunie als bedoeld in [artikel 3:63, eerste lid, van de wet][ref1]
      toegestaan om:

      a. zowel de te ontvangen rente bij de aanwezige liquiditeit als de te betalen rente bij de vereiste liquiditeit mee
      te rekenen;

      b. dochtermaatschappijen en bijkantoren die elk minder dan één procent uitmaken van het balanstotaal niet te
      betrekken bij de liquiditeitsberekeningen, indien ten minste 95 procent van het totale geconsolideerde balanstotaal
      wordt betrokken in de berekening;

      c. middellijke deelnemingen en bijkantoren van deelnemingen waarbij geen sprake is van, in verhouding tot de
      clearinginstelling of kredietunie als geheel, grote liquiditeitsbehoefte terwijl de liquiditeitsvoorziening ervan
      in belangrijke mate afhankelijk is van de moederonderneming onderscheidenlijk het hoofdkantoor, niet te betrekken
      bij de liquiditeitsberekeningen; of

      d. een liquiditeitstekort in convertibele of inconvertibele valuta’s te compenseren met een overschot in
      convertibele valuta’s, voor zover afkomstig uit een land van waaruit vrije overdracht van liquiditeiten mogelijk
      is.

      2 Indien een clearinginstelling kiest voor toepassing van het eerste lid, onderdeel b of c, betrekt zij de
      intragroepstransacties in de berekening van de liquiditeit.

      3 De Nederlandsche Bank stelt nadere regels betreffende de valuta’s die voor de toepassing van dit hoofdstuk als
      convertibel aangemerkt worden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel363
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:63
  - number: '108'
    text: |-
      1 De vereiste liquiditeit van een clearinginstelling als bedoeld in [artikel 3:63, eerste lid, van de wet][ref1]
      bedraagt de som van de gewogen uitgaande kasstromen op basis van de kalenderposten, vermeerderd met de niet in de
      vervalkalender opgenomen gewogen toevertrouwde middelen en overige posten die opgevraagd kunnen worden of tot een
      betalingsverplichting kunnen leiden, gedurende de weekperiode respectievelijk de maandperiode.

      2 De vereiste liquiditeit van een kredietunie als bedoeld in [artikel 3:63 van de wet][ref2] bedraagt de som van de
      gewogen uitgaande kasstromen op basis van de kalenderposten, vermeerderd met de niet in de vervalkalender opgenomen
      gewogen toevertrouwde middelen en overige posten die opgevraagd kunnen worden of tot een betalingsverplichting
      kunnen leiden, gedurende de maandperiode.

      3 De Nederlandsche Bank stelt regels met betrekking tot de in het eerste en tweede lid bedoelde posten en de weging
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel363
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel363
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel108
