    text: |-
      Een beheerder van een beleggingsinstelling of een beheerder van een icbe die een activiteit verricht
      of een beleggingsdienst verleent op grond van [artikel 2:67a, tweede lid, van de wet][ref1],
      respectievelijk [artikel 2:69c, tweede lid, van de wet][ref2], voldoet aan het bepaalde in de
      [artikelen 23, eerste tot en met vijfde lid en negende lid][ref3], [23a, aanhef en onderdeel b][ref4],
      [23b, eerste, derde en vierde lid][ref5], en [24a1][ref6] voor een beleggingsonderneming in de zin van de
      richtlijn prudentieel toezicht beleggingsondernemingen of voor een beleggingsonderneming die kwalificeert als
      klein en niet-verweven als bedoeld in artikel 12, eerste lid, van de verordening prudentiële vereisten voor
      beleggingsondernemingen indien wordt voldaan aan de voorwaarden bedoeld in dat artikel. [Artikel 24a2][ref7], voor
      zover het de toepassing van de [artikelen 23][ref8], [23a][ref9] en [23b][ref10] betreft, is van overeenkomstige
      toepassing.


