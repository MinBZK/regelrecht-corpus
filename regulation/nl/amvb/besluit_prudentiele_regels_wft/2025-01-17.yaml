  - number: '21'
    text: |-
      1 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld
      in [artikel 17][ref1] beschikt over een organisatieonderdeel dat op onafhankelijke en effectieve wijze een
      compliancefunctie uitoefent. Het organisatieonderdeel heeft als taak het controleren van de naleving van wettelijke
      regels en van interne regels die de financiële onderneming of bijkantoor zelf heeft opgesteld.

      2 Het organisatieonderdeel, bedoeld in het eerste lid, van een bank als bedoeld in
      [artikel 3:17, eerste lid][ref2], of [3:23, tweede lid, van de wet][ref3] die in Nederland beleggingsdiensten mag
      verlenen of beleggingsactiviteiten mag verrichten, heeft voorts als taak:

      a. het adviseren van de personen die verantwoordelijk zijn voor het verlenen van beleggingsdiensten of het
      verrichten van beleggingsactiviteiten bij de naleving van wettelijke regels en interne regels;

      b. het toezien op de deugdelijkheid en effectiviteit van de interne regels en procedures;

      c. het beoordelen van de effectiviteit van de procedures die zijn opgesteld en maatregelen die zijn genomen om
      gesignaleerde onvolkomenheden bij de naleving van wettelijke regels en interne regels op te heffen; en

      d. het ten minste jaarlijks rapporteren aan de personen die het dagelijks beleid van de bank bepalen en aan het
      orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de algemene gang van zaken van de bank inzake
      aangelegenheden met betrekking tot de naleving van wettelijke regels en interne regels. In de jaarlijkse rapportage
      wordt met name vermeld of maatregelen zijn genomen in het geval van gesignaleerde tekortkomingen.

      3 Het organisatieonderdeel van een bank als bedoeld in het tweede lid beschikt over de nodige autoriteit, middelen,
      deskundigheid en toegang tot alle noodzakelijke informatie om haar taken onafhankelijk en effectief te kunnen
      uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel317
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel323
