  - number: '4'
    text: |-
      1 Berekeningen met betrekking tot het minimumbedrag aan eigen vermogen, de solvabiliteit, de kapitaalbuffer,
      de hefboomratiobuffer onderscheidenlijk de liquiditeit van financiële ondernemingen, niet zijnde verzekeraars,
      op grond van de [hoofdstukken 9][ref1], [10][ref2], [10A][ref3] onderscheidenlijk [11][ref4] worden, voor
      zover niet anders is bepaald, gedaan op basis van de enkelvoudige jaarrekening zoals opgemaakt ingevolge
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref5] of de internationale jaarrekeningstandaarden.

      2 Berekeningen met betrekking tot de solvabiliteit van banken op grond van [hoofdstuk 10][ref6], de kapitaalbuffer
      en de hefboomratiobuffer van banken op grond van [hoofdstuk 10A][ref7] en de liquiditeit van banken op grond van
      [hoofdstuk 11][ref8] worden, voor zover niet anders is bepaald, gedaan op basis van de geconsolideerde jaarrekening
      indien deze wordt opgemaakt ingevolge [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref9] of de internationale
      jaarrekeningstandaarden.

      3 Onverminderd [artikel 3:69a van de wet][ref10] waardeert een verzekeraar met beperkte risico-
      omvang, voor zover in dit besluit niet anders wordt bepaald, zijn activa en passiva op basis van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref11].

      4 Een verzekeraar met beperkte risico-omvang houdt zich aan door de Nederlandsche Bank te stellen nadere regels met
      betrekking tot de waardering van deelnemingen.


