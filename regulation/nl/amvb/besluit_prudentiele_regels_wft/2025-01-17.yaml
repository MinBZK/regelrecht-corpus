  - number: 23a
    text: |-
      Het beleid en de procedures en maatregelen, bedoeld in [artikel 23, eerste en derde tot en met vijfde lid][ref1]:

      a. van een bank, een beleggingsonderneming onder de verordening kapitaalvereisten, een beleggingsonderneming als
      bedoeld in [artikel 23, tiende lid, aanhef en onderdeel a][ref2], of een clearinginstelling voldoen aan de op de
      betrokken onderneming van toepassing zijnde technische criteria voor de organisatie en behandeling van risico’s in
      de artikelen 79 tot en met 87 van de richtlijn kapitaalvereisten;

      b. van een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen en
      een beleggingsonderneming als bedoeld in [artikel 23, tiende lid, aanhef en onderdeel b][ref3], voldoen aan de
      technische criteria voor de organisatie en behandeling van risico’s, bedoeld in de artikelen 26, eerste lid,
      onderdelen b en c, derde lid, en 29, eerste lid, van de richtlijn prudentieel toezicht beleggingsondernemingen
      en indien de beleggingsonderneming kwalificeert als kleine en niet-verweven beleggingsonderneming als bedoeld in
      artikel 12, eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen aan die bedoeld in
      artikel 29, eerste lid, onderdelen a, c, en d, van die richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel23
