  - number: 134b
    text: |-
      1 Een bank als bedoeld in [artikel 3:74a, eerste lid, van de wet][ref1] die over een website beschikt, geeft daarop
      uitleg over de wijze waarop zij voldoet aan de vereisten inzake bestuur, beloning en publicatie van gegevens in
      [artikel 17c][ref2], de bij of krachtens [artikel 23e, vijfde lid][ref3], gestelde regels, het Besluit uitvoering
      publicatieverplichtingen richtlijn kapitaalvereisten en [artikel 3:8, derde en vierde lid, van de wet][ref4].

      2 Een beleggingsonderneming onder de verordening kapitaalvereisten die over een website beschikt, geeft daarop
      uitleg over de wijze waarop zij voldoet aan de bij of krachtens [artikel 23e, vijfde lid][ref5], gestelde regels en
      het [Besluit uitvoering publicatieverplichtingen richtlijn kapitaalvereisten][ref6].

      3 Het eerste lid is van overeenkomstige toepassing op een bank met zetel in een staat die geen lidstaat is die haar
      bedrijf uitoefent vanuit een in Nederland gelegen bijkantoor.


