  - number: 140a
    text: |-
      De gegevens, bedoeld in [artikel 3:111b, eerste lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres, het telefoon- en faxnummer en emailadres van de betaaldienstagent;

      b. een beschrijving van de interne controlemechanismen die door de betaaldienstagent zullen worden gebruikt om
      de in de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] neergelegde verplichtingen na te
      komen; en

      c. de identiteit van de bestuurders en de personen die verantwoordelijk zijn voor het beleid van de
      betaaldienstagent die bij het aanbieden van betaaldiensten wordt gebruikt, alsmede gegevens waaruit blijkt dat zij
      betrouwbaar en deskundig zijn;

      d. de betaaldiensten die de betaaldienstagent namens de betaalinstelling verleent; en

      e. voor zover van toepassing, de unieke identificatiecode of het unieke identificatienummer van de
      betaaldienstagent.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3111b
