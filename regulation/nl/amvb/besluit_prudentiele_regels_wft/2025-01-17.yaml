      1 Onverminderd artikel 77 van de verordening kapitaalvereisten kan een bank of beleggingsonderneming als bedoeld
      in [artikel 3:62b, tweede lid][ref1], of [artikel 3:62ba, tweede lid, van de wet][ref2], in afwijking van die
      artikelen de bedoelde uitkeringen, toekenningen of betalingen doen, ter grootte van ten hoogste het maximaal
      uitkeerbare bedrag, berekend overeenkomstig artikel 141, vierde lid, respectievelijk artikel 141 ter, vierde lid,
      van de richtlijn kapitaalvereisten. [Artikel 4][ref3] is van overeenkomstige toepassing.

      2 Van het voornemen tot het doen van een uitkering, toekenning of betaling als bedoeld in het eerste lid geeft
      de bank of beleggingsonderneming kennis aan de Nederlandsche Bank, onder overlegging van de gegevens, bedoeld in
      artikel 141, achtste lid, respectievelijk artikel 141 ter, achtste lid, van de richtlijn kapitaalvereisten.


