  - number: 17aa
    text: |-
      1 Het organisatieonderdeel van een premiepensioeninstelling dat is belast met de uitoefening van de interne
      controlefunctie, bedoeld in [artikel 17, vierde lid][ref1], heeft in ieder geval als taak het interne
      controlesysteem en andere onderdelen van de bedrijfsvoering, inclusief de uitbesteding van werkzaamheden, te
      evalueren, om te beoordelen of deze adequaat en doeltreffend zijn.

      2 De premiepensioeninstelling stelt beleid op met betrekking tot de interne controle en draagt zorg voor de
      uitvoering van dat beleid. De premiepensioeninstelling evalueert het beleid ten minste eenmaal per drie jaar en
      past het beleid in geval van een belangrijke wijziging in het interne controlesysteem of met betrekking tot de
      overige onderdelen van de bedrijfsvoering zo spoedig mogelijk aan.

      3 De interne controlefunctie bij een premiepensioeninstelling wordt uitgeoefend door personen die geschikt
      zijn in verband met de uitoefening van deze functie en van wie de betrouwbaarheid buiten twijfel staat.
      [Artikel 3:9, tweede lid, van de wet][ref2] is van overeenkomstige toepassing.

      4 De premiepensioeninstelling stelt de persoon die verantwoordelijk is voor de interne controlefunctie in staat
      diens taken op een objectieve en eerlijke wijze uit te oefenen.

      5 De personen die betrokken zijn bij de uitoefening van de interne controlefunctie kunnen niet tevens de
      risicobeheerfunctie, bedoeld in [artikel 23, zesde lid][ref3], uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel23
