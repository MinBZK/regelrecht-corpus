  - number: '134'
    text: |-
      1 De Nederlandsche Bank stelt aan de hand van openbare gegevens uit de staten de volgende niet-geaggregeerde
      kerngegevens van banken met zetel in Nederland vast en publiceert die op haar website:

      a. de volgende gegevens met betrekking tot de activa:

      1°. de totale activa;

      2°. het totaal aan hypothecaire kredieten voor woningaankoop;

      3°. het totaal aan bedrijfskredieten;

      4°. het totaal aan financiële activa;

      b. het totaal aan onvolwaardige leningen, uitgedrukt als percentage van het totaal aan leningen;

      c. het totaal aan voorzieningen op leningen, uitgedrukt als percentage van het totaal aan leningen;

      d. de volgende gegevens met betrekking tot de passiva:

      1° totale passiva;

      2°. het eigen vermogen;

      3°. het vreemd vermogen, met afzonderlijke vermelding van gelden aangehouden door huishoudens;

      e. de verplichtingen buiten de balans;

      f. de volgende gegevens met betrekking tot de resultatenrekening:

      1°. de totale baten;

      2°. de netto rentebaten;

      3°. de netto baten uit dienstverlening en provisies;

      4°. de overige baten;

      5°. het resultaat na belastingen;

      g. het tier 1-kapitaal, bedoeld in artikel 25 van de verordening kapitaalvereisten;

      h. het tier 1-kernkapitaal, bedoeld in artikel 50 van de verordening kapitaalvereisten;

      i. het totaal van de risicoposten (de risicogewogen activa), bedoeld in artikel 92, derde lid, van de verordening
      kapitaalvereisten;

      j. de volgende ratio’s, bedoeld in artikel 92 van de verordening kapitaalvereisten:

      1°. de totale kapitaalratio;

      2°. de tier 1 kapitaalratio;

      3°. de tier 1-kernkapitaalratio;

      4°. de hefboomratio.

      2 De Nederlandsche Bank maakt de gegevens uit de staten die zij bij het vaststellen van de kerngegevens gebruikt
      bekend en maakt bekend op welk consolidatieniveau de door haar te gebruiken gegevens betrekking hebben.

      3 De kerngegevens hebben betrekking op de financiële toestand van een bank per 30 juni en 31 december van elk jaar.

      4 De Nederlandsche Bank actualiseert een kerngegeven tweemaal per jaar, op de laatste werkdag van juni en van
      december van elk jaar, tenzij het een kerngegeven, genoemd in onderdeel f, is en de bank waarop het gegeven
      betrekking heeft de gewoonte heeft haar resultatenrekening maar eenmaal per jaar te publiceren.

      5 De Nederlandsche Bank gebruikt bij het vaststellen van een kerngegeven gegevens uit de meest actuele staten die
      haar twee weken voorafgaand aan de publicatie ter beschikking staan.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel134
  - number: 134a
    text: |-
      Tot de gegevens, bedoeld in [artikel 3:73a van de wet][ref1], behoren in ieder geval de gegevens met betrekking tot
      storingen die zich hebben voorgedaan of bijna hebben voorgedaan in het verrichten van afwikkeldiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel373a
