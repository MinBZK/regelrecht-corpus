  - number: 40l
    text: |-
      1 Een bank die gedekte obligaties uitgeeft, identificeert de in [artikel 40f, eerste en tweede lid][ref1],
      bedoelde dekkingsactiva, en documenteert de wijze waarop haar kredietverleningsbeleid voldoet aan de vereisten
      van [artikel 40h][ref2].

      2 De bank registreert alle transacties met betrekking tot het programma van gedekte obligaties en beschikt daartoe
      over adequate en passende documentatiesystemen en documentatieprocessen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40f
