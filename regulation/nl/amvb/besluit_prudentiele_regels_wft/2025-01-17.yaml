  - number: '111'
    text: |-
      1 De aanwezige liquiditeit van een clearinginstelling of kredietunie als bedoeld in
      [artikel 3:63, eerste lid, van de wet][ref1] in de weekperiode wordt gevormd door de gewogen voorraadposten, de
      gewogen kasinstroom van de kalenderposten gedurende de weekperiode en de officiële stand-by faciliteiten.

      2 De financiële onderneming betrekt bij de berekening van de aanwezige liquiditeit in de weekperiode uitsluitend
      de activa die in het kader van het dagelijkse liquiditeitenbeheer aan haar ter beschikking staan teneinde te kunnen
      voorzien in de directe liquiditeitsbehoefte en de inkomende kasstromen uit het kernbedrijf waarmee in het kader van
      het dagelijkse liquiditeitenbeheer rekening wordt gehouden. Daartoe worden in elk geval gerekend:

      a. financiële instrumenten op basis waarvan op korte termijn liquide middelen kunnen worden verkregen door verkoop
      of belening zonder dat dit gepaard gaat met meer dan marginale kosten of verliezen;

      b. onmiddellijk opeisbaar interbancair actief; en

      c. onmiddellijk opeisbare vorderingen op overheden en professionele geldmarktpartijen.

      3 De aanwezige liquiditeit van de clearinginstelling of kredietunie in de maandperiode wordt gevormd door de
      gewogen voorraadposten en de gewogen kasinstroom gedurende de maandperiode.

      4 De financiële onderneming betrekt, onverminderd het eerste en derde lid, bij de berekening van de aanwezige
      liquiditeit het liquiditeitsoverschot van een bijkantoor of een dochtermaatschappij met zetel buiten Nederland,
      welk liquiditeitsoverschot wordt berekend op basis van dit besluit of, indien dit lager is, volgens de in de staat
      van de zetel daarvoor geldende regels, slechts voor zover:

      a. overdracht van het liquiditeitsoverschot niet leidt tot een liquiditeitstekort bij het bijkantoor of de
      dochtermaatschappij volgens de lokale liquiditeitstoetsing;

      b. het om een overschot in convertibele valuta’s gaat; en

      c. vrije en grensoverschrijdende overdracht van liquiditeit mogelijk is.

      5 De financiële onderneming betrekt bij de berekening van de aanwezige liquiditeit niet:

      a. activa die niet onbelemmerd overdraagbaar zijn;

      b. direct opeisbare tegoeden bij personen die geen bank of professionele geldmarktpartij zijn.

      6 De Nederlandsche Bank stelt regels met betrekking tot de in het eerste, tweede en derde lid bedoelde posten en de
      weging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel363
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:63
  - number: '112'
    text: |-
      De aanwezige liquiditeit van een icbe als bedoeld in [artikel 3:63 van de wet][ref1] wordt gevormd door de volgende
      posten:

      a. kasmiddelen, daggeld en direct opvraagbare tegoeden bij banken die een vergunning als bedoeld in
      [artikel 2:11 van de wet][ref2] hebben of waarop toezicht op het uitoefenen van het bedrijf van bank wordt
      uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen;

      b. kortlopende schuldtitels aan toonder;

      c. financiële instrumenten die zijn toegelaten tot de handel aan een gereglementeerde markt of een markt in
      financiële instrumenten waarvan de houder gevestigd is in een staat die deel uitmaakt van de G10 of aan een andere
      door de Nederlandsche Bank aangewezen gereglementeerde markt;

      d. officiële stand-by faciliteiten afgegeven door banken die een vergunning als bedoeld in
      [artikel 2:11 van de wet][ref3] hebben of waarop toezicht op het uitoefenen van het bedrijf van bank wordt
      uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen; en

      e. onvoorwaardelijke garanties van banken en verzekeraars die een vergunning als bedoeld in [artikel 2:11][ref4]
      onderscheidenlijk [artikel 2:27 van de wet][ref5] hebben of waarop toezicht op het uitoefenen van het bedrijf van
      bank onderscheidenlijk verzekeraar wordt uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de
      belangen die de [wet][ref6] beoogt te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel363
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel211
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel211
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel211
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel227
      [ref6]: https://wetten.overheid.nl/BWBR0020368
