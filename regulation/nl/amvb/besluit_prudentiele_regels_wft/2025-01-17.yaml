  - number: 122a
    text: |-
      De gegevens, bedoeld in [artikel 3:267e, derde lid, van de wet][ref1] zijn:

      a. het herverzekeringscontract inclusief bijlagen, waaronder een toelichting van de wijze waarop de vordering van
      de cederende verzekeraar op de andere verzekeraar wordt gewaardeerd;

      b. indien van toepassing, de zekerheidsovereenkomsten;

      c. informatie over de geografische locatie van de vordering van de cederende verzekeraar op de andere verzekeraar
      en de daarmee samenhangende zekerheden;

      d. een onderbouwing van de toereikendheid van het risicobeheer ten aanzien van de herverzekering;

      e. een analyse van de kredietrisico’s betreffende de herverzekering;

      f. gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of zij na herverzekering gebruik
      kan maken van haar bevoegdheid als bedoeld in [artikel 3:137][ref2];

      g. een opinie van de risicobeheerfunctie van de verzekeraar over de mate waarin de verzekeraar in
      staat is om aan de voorwaarden met betrekking tot de herverzekering als bedoeld in dit artikel en
      [artikel 3:267e van de wet][ref3], te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3267e
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3137
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3267e
