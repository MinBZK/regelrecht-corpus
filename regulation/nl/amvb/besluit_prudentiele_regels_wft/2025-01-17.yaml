        hoofdstuk: '5'
  - number: '31'
    text: |-
      1 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in
      [artikel 27, tweede lid][ref1], legt de overeenkomst met de derde waaraan de werkzaamheden op structurele basis
      worden uitbesteed schriftelijk vast.

      2 In de overeenkomst wordt in ieder geval het volgende geregeld:

      a. de onderlinge informatie-uitwisseling, met inbegrip van afspraken over het beschikbaar stellen van informatie
      waarom de toezichthouders ter uitvoering van hun wettelijke taak verzoeken;

      b. de mogelijkheid voor de financiële onderneming of het bijkantoor om te allen tijde wijzigingen aan te brengen in
      de wijze waarop de uitvoering van de werkzaamheden door de derde geschiedt;

      c. de verplichting voor de derde om de financiële onderneming of het bijkantoor in staat te stellen blijvend te
      voldoen aan het bij of krachtens de wet bepaalde; en

      d. de mogelijkheid voor de toezichthouders om onderzoek ter plaatse te doen of te laten doen bij de derde; en

      e. de wijze waarop de overeenkomst wordt beëindigd, en de wijze waarop wordt gewaarborgd dat de financiële
      onderneming of het bijkantoor de werkzaamheden na beëindiging van de overeenkomst weer zelf kan uitvoeren of door
      een andere derde kan laten uitvoeren.

      3 De toezichthouders maken slechts gebruik van de mogelijkheid, bedoeld in het tweede lid, onderdeel d, indien niet
      op andere wijze kan worden vastgesteld dat ten aanzien van de uitbestede werkzaamheden wordt voldaan aan het bij of
      krachtens de wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27
