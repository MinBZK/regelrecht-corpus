    text: |-
      Een herverzekeraar die zijn bedrijf uitoefent in de activiteit schadeherverzekering of
      schadeverzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1], [3:58, eerste of tweede lid][ref2],
      [3:61, eerste lid][ref3], of [3:62, eerste lid, van de wet][ref4] en daarbij zorgverzekeringen als bedoeld
      in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref5] herverzekert onderscheidenlijk sluit, kan zijn
      solvabiliteitskapitaalvereiste berekenen met toepassing van artikel 149 van de verordening solvabiliteit II.


