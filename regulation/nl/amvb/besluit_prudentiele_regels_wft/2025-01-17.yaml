  - number: '49'
    text: |-
      1 Een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-omvang, berekent het
      minimumkapitaalvereiste overeenkomstig artikel 129 van de richtlijn solvabiliteit II, met inachtneming van titel
      I, hoofdstuk VII, van de verordening solvabiliteit II. Artikel 131 van de richtlijn solvabiliteit II is van
      toepassing.

      2 De Nederlandsche Bank kan gedurende een periode die niet later eindigt dan 31 december 2017 voorschrijven dat
      verzekeraars de in artikel 129, derde lid, eerste alinea, van de richtlijn solvabiliteit II bedoelde percentages
      uitsluitend toepassen op het met behulp van de standaardformule, bedoeld in titel I, hoofdstuk VI, afdeling 4,
      onderafdeling 2, van die richtlijn, berekende solvabiliteitskapitaalvereiste.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel49
  - number: 49a
    text: |-
      De artikelen 129 en 131 van de richtlijn solvabiliteit II en titel I, hoofdstuk VII, van de verordening
      solvabiliteit II inzake het minimumkapitaalvereiste zijn van overeenkomstige toepassing op het
      minimumkapitaalvereiste van een in Nederland gelegen bijkantoor van:

      a. levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;

      b. herverzekeraars met zetel in een niet-aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel49a
  - number: 49b
    text: |-
      1 De artikelen 129 en 131 van de richtlijn solvabiliteit II en titel I, hoofdstuk VII, van de verordening
      solvabiliteit II inzake het minimumkapitaalvereiste zijn van overeenkomstige toepassing op:

      a. verzekeraars met beperkte risico-omvang met zetel in Nederland;

      b. verzekeraars met beperkte risico-omvang met zetel in een niet-aangewezen staat die hun bedrijf uitoefenen vanuit
      een in Nederland gelegen bijkantoor.

      2 Voor de toepassing van het eerste lid bedraagt de absolute ondergrens van het minimumkapitaalvereiste,
      in afwijking van artikel 129, eerste lid, onderdeel d, van de richtlijn, voor de in het eerste lid bedoelde
      verzekeraars:

      a. 250.000 euro voor een levensverzekeraar die uitsluitend of nagenoeg uitsluitend uitkeringen bij overlijden
      verzekert, waarvan het bedrag per verzekerde niet groter is dan het gemiddelde bedrag van de kosten van uitvaart;

      b. 250.000 euro voor een natura-uitvaartverzekeraar;

      c. 200.000 euro voor een schadeverzekeraar.

      3 De in het tweede lid bedoelde bedragen worden elke vijf jaar gewijzigd teneinde deze aan te passen aan de
      ontwikkeling van het door de Europese Commissie overeenkomstig artikel 300 van de richtlijn solvabiliteit II
      bekendgemaakte geharmoniseerde indexcijfer van de consumentenprijzen van alle lidstaten, afgerond op een veelvoud
      van 10.000 euro. De gewijzigde bedragen worden bij ministeriële regeling vastgesteld.

      4 Voor de toepassing van het eerste lid, wordt in artikel 131 van de richtlijn solvabiliteit II voor «31 december
      2016» gelezen: 31 december 2017.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel49b
  - number: '50'
    text: |-
      1 Het minimumbedrag aan eigen vermogen van een bank als bedoeld in [artikel 2:13, eerste lid][ref1],
      [3:53, eerste lid][ref2], of [3:54, eerste lid, van de wet][ref3], van een betaalinstelling als bedoeld in
      artikel 3:53, eerste lid, van de wet, van een clearinginstelling als bedoeld in artikel 3:53, eerste lid, of
      [3:55, eerste lid, van de wet][ref4], van een elektronischgeldinstelling als bedoeld in artikel 3:53, eerste lid,
      van de wet, kredietunie als bedoeld in artikel 3:53, eerste lid, van de wet of van een premiepensioeninstelling
      als bedoeld in artikel 3:53, eerste lid, van de wet, wordt gevormd door de waarde van de vermogensbestanddelen,
      bedoeld in artikel 26, eerste lid, onderdelen a tot en met e, van de verordening kapitaalvereisten. Op een
      premiepensioeninstelling met de rechtsvorm van een stichting is artikel 27 van de verordening kapitaalvereisten van
      overeenkomstige toepassing.

      2 Het minimumbedrag aan eigen vermogen van een beheerder van een beleggingsinstelling als bedoeld in
      [artikel 3:53, eerste lid, van de wet][ref5], van een beheerder van een icbe als bedoeld in artikel
      3:53, eerste lid, van de wet en van een beleggingsonderneming als bedoeld in artikel 3:53, eerste lid, of
      [3:54, eerste lid, van de wet][ref6] is samengesteld overeenkomstig artikel 9 van de verordening prudentiële
      vereisten voor beleggingsondernemingen.


