  - number: '59'
    text: |-
      1 De solvabiliteit van een beheerder van een beleggingsinstelling, beheerder van een icbe,
      betaalinstelling, elektronischgeldinstelling, kredietunie of premiepensioeninstelling als bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref1] is voldoende, indien het aanwezige in aanmerking komende
      toetsingsvermogen van de onderneming ten minste gelijk is aan de minimum omvang van het toetsingsvermogen, berekend
      overeenkomstig de [artikelen 60a][ref2], [61][ref3], [63][ref4], [63a][ref5], [63b][ref6] en [64][ref7].

      2 De solvabiliteit van een verzekeraar als bedoeld in [artikel 3:57, eerste lid][ref8],
      [3:58, eerste of tweede lid][ref9], of [3:61, eerste of tweede lid][ref10], of van een bijkantoor als bedoeld
      in [artikel 3:59, eerste lid][ref11], of [3:62, eerste lid, van de wet][ref12] is voldoende indien het eigen
      vermogen, bedoeld in [artikel 70][ref13], ten minste gelijk is aan het solvabiliteitskapitaalvereiste, berekend
      overeenkomstig, al naar gelang van toepassing, [artikel 65][ref14], [66][ref15] of [68][ref16].

      3 De solvabiliteit van een bank als bedoeld in [artikel 3:57, eerste lid][ref17], of
      [3:58, eerste lid, van de wet][ref18] of een beleggingsonderneming onder de verordening kapitaalvereisten,
      is voldoende, indien het aanwezige toetsingsvermogen van de onderneming voldoet aan de op de bank of
      beleggingsonderneming van toepassing zijnde kapitaaleisen uit deel 3 van de verordening kapitaalvereisten.

      4 De solvabiliteit van een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht
      beleggingsondernemingen is voldoende, indien het aanwezige toetsingsvermogen van de onderneming voldoet aan de
      op de beleggingsonderneming van toepassing zijnde kapitaaleisen uit delen 3 en 4 van de verordening prudentiële
      vereisten voor beleggingsondernemingen.

      5 Op een beleggingsonderneming als bedoeld in [artikel 3:58, eerste lid, onderdeel a, van de wet][ref19], is:

      a. het derde lid van overeenkomstige toepassing, indien het een beleggingsonderneming betreft waarop, zou zij haar
      zetel hebben in een lidstaat, de verordening kapitaalvereisten van toepassing zou zijn; of

      b. het vierde lid van overeenkomstige toepassing, indien het een beleggingsonderneming betreft waarop, zou zij
      haar zetel hebben in een lidstaat, de verordening prudentiële vereisten voor beleggingsondernemingen van toepassing
      zou zijn.

      6 De solvabiliteit van een clearinginstelling als bedoeld in [artikel 3:57, eerste lid][ref20], of
      [3:61, eerste lid, van de wet][ref21] is voldoende, indien de omvang van het aanwezige toetsingsvermogen ten minste
      gelijk is aan de minimumomvang van het toetsingsvermogen voor een bank, berekend overeenkomstig deel 3 van de
      verordening kapitaalvereisten.

      7 Onverminderd het eerste tot en met vierde en zesde lid is de omvang van Het aanwezige toetsingsvermogen,
      bedoeld in het eerste, derde, vierde en zesde lid, onderscheidenlijk het eigen vermogen, bedoeld in het
      tweede lid, ten minste gelijk aan het ingevolge [artikel 48][ref22] voorgeschreven minimumbedrag aan eigen
      vermogen, onderscheidenlijk het ingevolge [artikel 49][ref23], [49a][ref24] of [49b][ref25] voorgeschreven
      minimumkapitaalvereiste.

      8 Voor de toepassing van het eerste lid:

      1°. wordt het tier 1-kernkapitaal als bedoeld in artikel 50 van de verordening kapitaalvereisten volledig voor de
      berekening van het aanwezige toetsingsvermogen in aanmerking genomen;

      2°. wordt het aanvullend tier 1-kapitaal als bedoeld in artikel 61 van de verordening kapitaalvereisten voor de
      berekening van het aanwezige toetsingsvermogen slechts in aanmerking genomen voor zover het niet meer bedraagt dan
      een derde van het tier 1-kernkapitaal;

      3°. wordt het tier 2-kapitaal als bedoeld in artikel 71 van de verordening kapitaalvereisten voor de berekening van
      het aanwezige toetsingsvermogen slechts in aanmerking genomen voor zover het niet meer bedraagt dan een derde van
      het tier 1-kapitaal; en

      4°. mag, indien wordt voldaan aan de onderdelen 2° en 3°, het tier 2-kapitaal worden gesubstitueerd door aanvullend
      tier 1-kapitaal.

      9 De solvabiliteit van een beheerder van een beleggingsinstelling of een beheerder van een icbe die tevens
      een beleggingsdienst verleent op grond van [artikel 2:67a, tweede lid, van de wet][ref26], respectievelijk
      [artikel 2:69c, tweede lid, van de wet][ref27] is voldoende, indien het aanwezige toetsingsvermogen van de
      onderneming voldoet aan de voor diezelfde beleggingsdienst op een beleggingsonderneming van toepassing zijnde
      kapitaaleisen van deel 3 van de verordening prudentiële vereisten voor beleggingsondernemingen, met dien verstande
      dat het toetsingsvermogen ten minste gelijk is aan het toetsingsvermogen berekent overeenkomstig het eerste lid.

      10 De Nederlandsche Bank stelt ter uitvoering van het negende lid nadere regels met betrekking tot de toepassing
      van de kapitaaleisen van deel 3 van de verordening prudentiële vereisten voor beleggingsondernemingen voor
      beheerders van beleggingsinstellingen en beheerders van icbe’s als bedoeld in het negende lid.


