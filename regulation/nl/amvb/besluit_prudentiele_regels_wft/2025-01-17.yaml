  - number: 23g
    text: |-
      1 De Nederlandsche Bank beoordeelt een herstelplan of groepsherstelplan dat haar goedkeuring behoeft binnen
      zes maanden na de voorlegging ervan, overeenkomstig artikel 6, tweede en derde lid, van de richtlijn herstel en
      afwikkeling van banken en beleggingsondernemingen.

      2 De beoordeling van een groepsherstelplan geschiedt overeenkomstig de afstemmingsprocedure van artikel 8 van de
      richtlijn herstel en afwikkeling van banken en beleggingsondernemingen.

      3 Indien het herstelplan wezenlijke tekortkomingen vertoont of indien er wezenlijke belemmeringen zijn voor
      de tenuitvoerlegging van het herstelplan, wordt goedkeuring aan het plan onthouden. Binnen twee maanden legt
      de indiener van het herstelplan opnieuw een herstelplan ter goedkeuring voor, waarbij de bij de afwijzing
      geconstateerde tekortkomingen of belemmeringen zijn weggenomen.

      4 De Nederlandsche Bank kan nadere regels stellen met betrekking tot het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel23g
  - number: 23h
    text: |-
      Indien een onderneming, entiteit of groep als bedoeld in de [artikelen 23d, eerste of vijfde lid][ref1], of
      [23e, eerste of vierde lid][ref2], uitvoering geeft aan maatregelen die zijn opgenomen in het herstelplan
      of deze maatregelen achterwege laat in afwijking van de uitkomsten van de indicatoren, bedoeld in
      [artikel 23f, tweede lid][ref3], doet de onderneming, de entiteit of de EU-moederonderneming van de groep daarvan
      onverwijld mededeling aan de Nederlandsche Bank.


