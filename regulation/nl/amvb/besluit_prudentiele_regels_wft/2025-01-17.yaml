  - number: 22a
    text: |-
      De werknemers van een bank met zetel in Nederland die in Nederland beleggingsdiensten mag verlenen of
      beleggingsactiviteiten mag verrichten en andere personen die door de bank zijn belast met het verrichten
      van zodanige werkzaamheden beschikken over de nodige vakbekwaamheid en deskundigheid om de hun toevertrouwde
      verantwoordelijkheden uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel22a
  - number: '23'
    text: |-
      1 Een bank, beheerder van een icbe, beleggingsonderneming, betaalinstelling, clearinginstelling,
      elektronischgeldinstelling, kredietunie, premiepensioeninstelling, verzekeraar met beperkte risico-omvang,
      wisselinstelling of bijkantoor als bedoeld in de [artikelen 3:17, eerste en derde lid][ref1],[ 3:22][ref2],
      [3:23][ref3], [3:24a][ref4], [3:24b][ref5], [3:24c][ref6], [3:26][ref7] of [3:27 van de wet][ref8] voert beleid
      gericht op het beheersen van relevante risico’s.

      2 Onder relevante risico’s, bedoeld in het eerste lid, worden in het bijzonder verstaan het concentratierisico,
      krediet- en tegenpartijrisico, liquiditeitsrisico, marktrisico, operationeel risico, renterisico voortvloeiend
      uit niet-handelsactiviteiten, restrisico, risico van buitensporige hefboomwerking, securitisatierisico,
      verzekeringsrisico en afkooprisico.

      3 Het beleid wordt vastgelegd in procedures en maatregelen ter beheersing van relevante risico’s en geïntegreerd
      in de bedrijfsprocessen. De procedures en maatregelen die zijn gericht op de beheersing van het liquiditeitsrisico
      hebben betrekking op het beheer van de actuele en toekomstige netto financiële positie en behoeften.

      4 De procedures en maatregelen, bedoeld in het derde lid, bestaan onder meer uit autorisatieprocedures,
      limietstellingen, limietbewaking en procedures en maatregelen voor noodsituaties en zijn afgestemd op de aard, de
      omvang, het risicoprofiel en de complexiteit van de werkzaamheden van de financiële onderneming of bijkantoor.

      5 De procedures en maatregelen, bedoeld in het derde lid, worden vastgelegd en ter kennis gebracht van alle
      relevante bedrijfsonderdelen van de financiële onderneming of het bijkantoor.

      6 De financiële onderneming, niet zijnde een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht
      beleggingsondernemingen, heeft een onafhankelijke risicobeheerfunctie die op systematische wijze een onafhankelijk
      risicobeheer uitvoert dat gericht is op het identificeren, meten en evalueren van de risico’s waaraan de financiële
      onderneming of het bijkantoor is of kan worden blootgesteld. Het risicobeheer wordt zowel uitgevoerd ten aanzien
      van de financiële onderneming of het bijkantoor als geheel als ten aanzien van de onderscheiden bedrijfsonderdelen.

      7 De risicobeheerfunctie beschikt over de nodige autoriteit en toegang tot alle noodzakelijke informatie om haar
      taken te kunnen uitoefenen.

      8 Een bank, beleggingsonderneming onder de verordening kapitaalvereisten of clearinginstelling als bedoeld in
      [artikel 3:17, eerste of derde lid][ref9], [3:23][ref10] of [3:27 van de wet][ref11] houdt in aanvulling op het
      tweede lid rekening met de risico’s die voortvloeien uit de macro-economische omgeving waarin de onderneming actief
      is en die verband houden met de stand van de conjunctuurcyclus.

      9 Een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen als bedoeld
      in [artikel 3:17, derde lid, van de wet][ref12], niet zijnde een kleine en niet-verweven beleggingsonderneming als
      bedoeld in artikel 12, eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen, houdt
      in aanvulling op het tweede lid tevens rekening met de risico’s die voortvloeien uit de macro-economische omgeving
      waarin zij actief is en die verband houden met haar bedrijfscyclus en de risico’s die zij voor anderen inhoudt of
      kan inhouden.

      10 Een beleggingsonderneming als bedoeld in [artikel 3:22 van de wet][ref13] waarop, zou zij haar zetel hebben in
      een lidstaat:

      a. de verordening kapitaalvereisten van toepassing zou zijn, voldoet aan de op een beleggingsonderneming onder de
      verordening kapitaalvereisten van toepassing zijnde verplichting bedoeld in het achtste lid; of

      b. de verordening prudentiële vereisten voor beleggingsondernemingen van toepassing zou zijn, voldoet aan de op een
      beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen van toepassing zijnde
      verplichting bedoeld in het negende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel317
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel322
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel323
