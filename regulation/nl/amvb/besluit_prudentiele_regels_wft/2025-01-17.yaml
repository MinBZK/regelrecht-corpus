    text: |-
      Indien een beleggingsonderneming, betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank of
      bijkantoor als bedoeld in [artikel 23, eerste lid][ref1], gebruik maakt van intern ontwikkelde modellen, beoordeelt
      deze die modellen en de gehanteerde veronderstellingen en variabelen op systematische wijze op validiteit, onder
      meer door voorspellingen van het model te vergelijken met de werkelijke uitkomsten.


