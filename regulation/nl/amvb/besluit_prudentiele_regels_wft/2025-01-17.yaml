  - number: 23f
    text: |-
      1 De inrichting van de bedrijfsvoering van een onderneming of entiteit als bedoeld in de
      [artikelen 23d, eerste of vijfde lid][ref1], of [23e, eerste of vierde lid][ref2], is in overeenstemming met het
      herstelplan en waarborgt dat het herstelplan zonder wezenlijke belemmeringen ten uitvoer kan worden gelegd, in
      ieder geval met betrekking tot:

      a. het risicoprofiel van de onderneming;

      b. de mogelijkheden tot tijdige herkapitalisatie;

      c. de strategie en structuur van de onderneming;

      d. de financieringsstrategie, teneinde de weerbaarheid van de kernbedrijfsonderdelen en kritieke functies te
      waarborgen; en

      e. de governancestructuur.

      2 De bedrijfsvoering voorziet in een periodieke evaluatie van de indicatoren, bedoeld in artikel 9, eerste lid,
      van de richtlijn herstel en afwikkeling van banken en beleggingsondernemingen, voor het uitvoeren van in het
      herstelplan opgenomen maatregelen.

      3 De Nederlandsche Bank kan nadere regels stellen met betrekking tot het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23d
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel23e
