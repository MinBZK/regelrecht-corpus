    lid, 3:99, derde lid, van de Wet op het financieel toezicht en de richtlijnen nr. 73/239/EEG, 85/611/EEG, 88/357/
    EEG, 91/674/EEG, 92/49/EEG, 93/6/EEG, 93/22/EEG, 2000/12/EG, 2000/46/EG en 2002/83/EG;

