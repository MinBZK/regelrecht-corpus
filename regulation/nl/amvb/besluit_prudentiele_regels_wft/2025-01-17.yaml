  - number: 36a
    text: |-
      1 Een bank als bedoeld in [artikel 3:29, eerste lid, van de wet][ref1] met zetel in Nederland die haar bedrijf
      uitoefent vanuit een in een andere lidstaat gelegen bijkantoor geeft aan de Nederlandsche Bank schriftelijk
      kennis van een voornemen tot wijziging van de gegevens, bedoeld in artikel 4 van [Verordening (EU) nr. 1151/2014]
      (32014R1151) van de Commissie van 4 juni 2014 tot aanvulling van [Richtlijn 2013/36](32013L0036)/EU van het
      Europees Parlement en de Raad met technische reguleringsnormen betreffende de gegevens die moeten worden verstrekt
      bij de uitoefening van het recht van vestiging en van het vrij verrichten van diensten (PbEU 2014, L 309).

      2 De procedure voor de kennisgeving is:

      a. indien het bijkantoor is gelegen in een deelnemende lidstaat als bedoeld in artikel 2 van de verordening
      bankentoezicht, de procedure in artikel 11, vijfde lid, van [Verordening (EU) nr. 468/2014](32014R0468)
      van de Europese Centrale Bank van 16 april 2014 tot vaststelling van een kader voor samenwerking binnen het
      Gemeenschappelijk Toezichtsmechanisme tussen de Europese Centrale Bank en nationale bevoegde autoriteiten en met
      nationale aangewezen autoriteiten (PbEU 2014, L 141);

      b. indien het bijkantoor is gelegen in een lidstaat, niet zijnde een deelnemende lidstaat als bedoeld in artikel 2
      van de verordening bankentoezicht, de procedure in artikel 36, derde lid, van de richtlijn kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel329
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel36a
