  - number: 134e
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:73c][ref1], [3:82a][ref2] of [3:86a][ref3] met beperkte risico-omvang
      maakt jaarlijks binnen een termijn van zes maanden de jaarrekening, het bestuursverslag en de overige gegevens
      openbaar en vermeldt daarbij in de toelichting op de jaarrekening:

      a. de in overeenstemming met de [wet][ref4] en dit besluit opgestelde balans en de daarbij gehanteerde grondslagen
      en methoden voor de waardering van activa, technische voorzieningen en andere verplichtingen, met een toelichting
      op de belangrijkste verschillen met de grondslagen en methoden die in de jaarrekening voor de waardering ervan
      zijn gehanteerd;

      b. het bedrag en de samenstelling van het aanwezige solvabiliteitskapitaal;

      c. het bedrag van het solvabiliteitskapitaalvereiste en van het minimumkapitaalvereiste;

      d. indien [artikel 19, derde lid][ref5], op de verzekeraar van toepassing is: het bedrag van de technische
      voorzieningen indien deze worden berekend op basis van afkoop van alle verzekeringen;

      e. indien van toepassing: informatie over de winstdeling ten gunste van polishouders per productgroep;

      f. indien de verzekeraar niet voldoet aan het minimumkapitaalvereiste of significant niet voldoet aan het
      solvabiliteitskapitaalvereiste: het bedrag van het tekort alsmede een toelichting op de oorzaak en gevolgen ervan
      en de genomen corrigerende maatregelen;

      g. indien de verzekeraar ondernemingspecifieke parameters gebruikt voor de berekening van zijn
      solvabiliteitskapitaalvereiste: de belangrijkste verschillen tussen die parameters en de aannames die ten grondslag
      liggen aan de standaardformule;

      h. indien aan de verzekeraar door de Nederlandsche Bank specifieke parameters ter berekening van
      verzekeringstechnische risicomodules zijn opgelegd: het effect daarvan, alsmede de gronden van het daartoe
      strekkende besluit van de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel373c
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel382a
