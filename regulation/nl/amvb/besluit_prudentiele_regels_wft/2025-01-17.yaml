  - number: '52'
    text: |-
      Het minimumkapitaalvereiste van een verzekeraar als bedoeld in [artikel 3:53, eerste lid][ref1],
      [3:54, eerste lid][ref2], of [3:55, eerste lid, van de wet][ref3] of van een bijkantoor als bedoeld in
      [artikel 3:54, derde lid][ref4], [3:55, tweede lid][ref5], of [3:55a, eerste lid, van de wet][ref6] wordt
      gevormd door de waarde van het kernvermogen, bedoeld in artikel 88 van de richtlijn solvabiliteit II, voor
      zover dat ingevolge artikel 98, tweede en vierde lid, van de richtlijn solvabiliteit II, en met inachtneming
      van artikel 82, tweede en derde lid, van de verordening solvabiliteit II, in aanmerking komt ter dekking van het
      minimumkapitaalvereiste.


