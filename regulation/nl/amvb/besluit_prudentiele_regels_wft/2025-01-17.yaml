  - number: 40m
    text: |-
      1 Een bank die gedekte obligaties uitgeeft, kan gedekte obligaties uitgeven met een verlengbare looptijd, indien
      voorafgaand aan de eerste uitgifte van het programma van gedekte obligaties in de contractuele voorwaarden van
      dat programma is opgenomen dat verlenging van de looptijd niet kan geschieden naar goeddunken van de bank en
      uitsluitend plaatsvindt indien:

      a. er sprake is van wanprestatie of wanbetaling door de bank of enig handelen daartoe, er sprake is van
      liquidatie, ontbinding of herstructurering van schulden van de bank of een schuldeisersakkoord, of op de bank
      een afwikkelingsmaatregel als bedoeld in [artikel 3A:1 van de wet][ref1] is toegepast of de bank in staat van
      faillissement is verklaard; en

      b. de rechtspersoon waarop de dekkingsactiva zijn overgegaan op de einddatum van de gedekte obligaties over
      onvoldoende middelen beschikt voor de aflossing van de hoofdsom van die gedekte obligatie, die rechtspersoon
      niet kan voldoen aan een van de dekkingsvereisten, bedoeld in [artikel 40g, eerste en tweede lid][ref2], of die
      rechtspersoon niet kan voldoen aan een ander contractueel overeengekomen vereiste met betrekking tot waarborging
      van de dekking.

      2 Een bank die een gedekte obligatie uitgeeft waarvan de looptijd kan worden verlengd, verstrekt bij uitgifte van
      de gedekte obligatie informatie over:

      a. de voorwaarden voor verlenging van de looptijd;

      b. de gevolgen die het faillissement of de afwikkeling van de bank die gedekte obligaties uitgeeft, heeft voor de
      verlenging van de looptijd; en

      c. de rol van de Nederlandsche Bank ten aanzien van de verlenging van de looptijd.

      3 Een bank die een gedekte obligatie uitgeeft, draagt er zorg voor dat de einddatum van die gedekte obligatie te
      allen tijde kan worden bepaald.

      4 Indien op de bank een afwikkelingsmaatregel als bedoeld in [artikel 3A:1 van de wet][ref3] is toegepast of de
      bank in staat van faillissement is verklaard, is een looptijdverlenging niet van invloed op de volgorde waarin
      houders van gedekte obligaties hun vorderingen kunnen verhalen en wordt de volgorde van het oorspronkelijke
      looptijdenschema van het programma van gedekte obligaties niet omgekeerd.

      5 De looptijdverlenging heeft geen invloed op het recht van een houder van een gedekte obligatie om
      zijn vordering te verhalen op zowel de bank als op de rechtspersoon waarop de dekkingsactiva ingevolge
      [artikel 40e][ref4] zijn overgegaan of op de uitoefening van de rechten van de schuldeisers als bedoeld in
      [artikel 212re van de Faillissementswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a1
