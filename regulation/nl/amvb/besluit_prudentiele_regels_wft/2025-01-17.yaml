  - number: 17ab
    text: |-
      1 De persoon die binnen een premiepensioeninstelling verantwoordelijk is voor de interne controlefunctie,
      bedoeld in [artikel 17aa, vierde lid][ref1], rapporteert periodiek en schriftelijk materiële bevindingen en doet
      aanbevelingen aan het bestuur van de premiepensioeninstelling naar aanleiding van de uitoefening van de interne
      controlefunctie. Indien de persoon die verantwoordelijk is voor de interne controlefunctie tevens bestuurder
      is van de premiepensioeninstelling, worden de materiële bevindingen en aanbevelingen tevens gericht aan het
      toezichthoudend orgaan.

      2 Het bestuur draagt zorgt voor tijdige en passende maatregelen naar aanleiding van een rapportage of aanbeveling
      als bedoeld in het eerste lid.

      3 De persoon, bedoeld in het eerste lid, meldt het de Nederlandsche Bank zo spoedig mogelijk indien het bestuur van
      de premiepensioeninstelling niet tijdig passende maatregelen neemt, nadat het bestuur overeenkomstig het eerste lid
      op de hoogte is gesteld van:

      a. een substantieel risico dat de premiepensioeninstelling niet zal voldoen aan een wettelijk vereiste en dit
      ernstige nadelige gevolgen kan hebben voor de belangen van de pensioendeelnemers, gewezen pensioendeelnemers,
      pensioengerechtigden of andere aanspraakgerechtigden; of

      b. een ernstige overtreding van een wettelijk vereiste dat van toepassing is op de premiepensioeninstelling.

      4 De premiepensioeninstelling zorgt ervoor dat een persoon die op grond van het derde lid te goeder trouw en naar
      behoren een melding heeft gedaan bij de Nederlandsche Bank, niet wordt benadeeld als gevolg van de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17aa
