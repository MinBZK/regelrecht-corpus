  - number: 59a
    text: |-
      De Nederlandsche Bank kan ter uitvoering van internationaal aanvaarde standaarden nadere regels stellen met
      betrekking tot de solvabiliteit van afwikkelondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel59a
  - number: 60a
    text: |-
      1 De minimumomvang van het toetsingsvermogen van een betaalinstelling, met uitzondering van een betaalinstelling
      die alleen betaalinitiatiediensten of rekeninginformatiediensten aanbiedt, wordt berekend met toepassing van met de
      Nederlandsche Bank overeengekomen methode A, B of C, bedoeld in bijlage B bij dit besluit.

      2 In afwijking van het eerste lid kan de Nederlandsche Bank indien een evaluatie van de risicobeheersingsprocessen,
      het verzamelen en vastleggen van risicoverliesgegevens en het interne controlesysteem en het
      bedrijfscontinuïteitsbeheer van de betaalinstelling daartoe aanleiding geeft, de betaalinstelling verplichten een
      toetsingsvermogen aan te houden dat ten hoogste 20% hoger is dan het bedrag dat het resultaat is van de toepassing
      van een uit [bijlage B][ref1] gekozen methode, of de betaalinstelling toestaan een toetsingsvermogen aan te houden
      dat ten hoogste 20% lager is dan het bedrag dat het resultaat is van de uit [bijlage B][ref2] gekozen methode.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
      [ref2]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0020420
      - id: ref2
        bwb_id: BWBR0020420
  - number: '61'
    text: |-
      De minimumomvang van het toetsingsvermogen van een kredietunie bedraagt 10 procent van de totale
      risicoblootstelling, berekend overeenkomstig deel 7 van de verordening kapitaalvereisten.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel61
  - number: '63'
    text: |-
      1 De minimumomvang van het toetsingsvermogen van een beheerder van een beleggingsinstelling als bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref1], of van een beheerder van een icbe als bedoeld in artikel 3:57, eerste
      lid, van de wet bedraagt € 125.000 vermeerderd met twee honderdste procent van het bedrag waarmee de waarde van het
      beheerde vermogen het bedrag van € 250 miljoen te boven gaat. De minimumomvang van het toetsingsvermogen bedraagt
      niet meer dan € 10 miljoen.

      2 Tot het beheerde vermogen wordt gerekend het vermogen van de beleggingsinstellingen of van de icbe’s waarover
      de beheerder het beheer voert met inbegrip van de delen van het vermogen waarvan hij het beheer heeft uitbesteed,
      uitgezonderd de delen van het vermogen waarvan het beheer door derden aan hem is uitbesteed.

      3 De minimumomvang van het toetsingsvermogen van een beheerder van een beleggingsinstelling of een beheerder
      van een icbe als bedoeld in het eerste lid bedraagt ten minste 25 procent van de vaste kosten in het afgelopen
      boekjaar. Artikel 13 van de verordening prudentiële vereisten voor beleggingsondernemingen is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel357
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:57
  - number: 63a
    text: |-
      1 De minimumomvang van het toetsingsvermogen van een premiepensioeninstelling als bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref1] bedraagt twee tiende procent van het beheerde pensioenvermogen. De
      minimumomvang van het toetsingsvermogen bedraagt niet meer dan € 20 miljoen.

      2 In aanvulling op het eerste lid beschikt een premiepensioeninstelling naar keuze over:

      a. een beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening die haar aansprakelijkheid
      dekt wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van haar beroep of bedrijf en voorgevallen
      op het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, voor een
      bedrag van ten minste vijfenzeventig honderdste procent van de waarde van het beheerde pensioenvermogen, met een
      minimum van € 2 miljoen en een maximum van € 20 miljoen per schadegeval, en ten minste een procent van de waarde
      van het beheerde pensioenvermogen, met een minimum van € 2,5 miljoen en een maximum van € 25 miljoen per jaar, voor
      alle schadegevallen gezamenlijk; of

      b. een aanvulling op het toetsingsvermogen, bedoeld in het eerste lid, welke een tiende procent van de waarde van
      het beheerde pensioenvermogen bedraagt.

      3 Tot het beheerde pensioenvermogen wordt gerekend het vermogen onder beheer van de premiepensioeninstelling met
      inbegrip van de delen van het vermogen waarvan zij de bewaring heeft uitbesteed aan een pensioenbewaarder.

      4 Indien een premiepensioeninstelling pensioenvermogen beheert in opdracht van een cliënt buiten het grondgebied
      waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, beschikt zij voor dat deel van
      het beheerde pensioenvermogen in afwijking van het tweede lid, aanhef, over de aanvulling op het toetsingsvermogen,
      bedoeld in het tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel357
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel63a
