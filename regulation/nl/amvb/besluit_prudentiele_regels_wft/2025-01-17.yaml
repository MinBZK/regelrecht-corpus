  - number: 105c
    text: |-
      1 De Nederlandsche Bank beoordeelt met inachtneming van artikel 131 van de richtlijn kapitaalvereisten of banken
      en beleggingsondernemingen als bedoeld in [artikel 3:62a, eerste lid, van de wet][ref1], alsmede groepen onder
      leiding van een Nederlandse EU-moederbank, Nederlandse EU-moederbeleggingsonderneming, Nederlandse financiële
      EU-moederholdings, Nederlandse gemengde financiële EU-moederholdings, Nederlandse financiële moederholdings en
      Nederlandse gemengde financiële moederholdings mondiaal systeemrelevant of anderszins systeemrelevant zijn.

      2 De beoordeling ingevolge het eerste lid van de anderszins systeemrelevantie geschiedt in ieder geval aan de hand
      van de volgende criteria:

      a. de omvang van de onderneming;

      b. de verwevenheid van de activiteiten, de activa, de passiva of de zeggenschap van de onderneming met andere
      financiële ondernemingen of andere partijen die hoofdzakelijk actief zijn op de financiële markten;

      c. de mate van vervangbaarheid van de dienstverlening van de onderneming;

      d. de belemmeringen die bestaan ten aanzien van de afwikkelbaarheid van de onderneming;

      e. de mate waarin een gedraging van de onderneming of van een derde ten aanzien van de onderneming op de financiële
      markten kan leiden tot gedragingen van andere partijen die actief zijn op de financiële markten;

      f. de complexiteit van de onderneming, met inbegrip van complexiteit in verband met grensoverschrijdende
      activiteiten.

      3 De Nederlandsche Bank stelt voor de banken, beleggingsondernemingen en groepen die op grond van het eerste
      lid als mondiaal systeemrelevant danwel anderszins systeemrelevant zijn aangemerkt de vereiste omvang van de
      MSI-buffer danwel ASI-buffer vast met inachtneming van artikel 131 van de richtlijn kapitaalvereisten. Indien
      de Nederlandsche Bank een groep onder leiding van een Nederlandse financiële EU-moederholding, Nederlandse
      gemengde financiële EU-moederholding, Nederlandse financiële moederholding of Nederlandse gemengde financiële
      moederholding als systeemrelevant heeft aangemerkt, is de systeemrelevantiebuffer van toepassing op de banken en
      beleggingsondernemingen die dochteronderneming van die holding zijn, op basis van de geconsolideerde financiële
      positie van de holding.

      4 De Nederlandsche Bank voert de beoordeling, bedoeld in het eerste lid, ten minste jaarlijks uit. Onze Minister
      kan de Nederlandsche Bank op ieder moment verzoeken een beoordeling uit te voeren.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de in het tweede lid bedoelde
      criteria. Tevens kunnen bij ministeriële regeling aanvullende criteria worden vastgesteld in verband met de
      stabiliteit van het financiële stelsel.

      6 De Nederlandsche Bank stelt ten minste dertig dagen voordat zij een besluit tot vaststelling van een MSI-buffer
      of ASI-buffer als bedoeld in het derde lid neemt, Onze Minister op de hoogte van haar voornemen. Hetzelfde geldt
      ten aanzien van het voornemen tot wijziging of intrekking van een zodanig besluit. De verplichting tot kennisgeving
      aan Onze Minister is niet van toepassing indien de Europese Centrale Bank de bevoegdheid, bedoeld in het derde
      lid, uitoefent.


