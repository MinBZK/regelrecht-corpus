  - number: 134da
    text: |-
      1 De Nederlandsche Bank staat een verzekeraar als bedoeld in [artikel 134c][ref1] of [artikel 134d][ref2] toe
      bepaalde informatie in het rapport over de solvabiliteit en financiële positie niet openbaar bekend te maken,
      indien is voldaan aan een van de voorwaarden, genoemd in artikel 53, eerste lid, van de richtlijn solvabiliteit II.

      2 De verzekeraar vermeldt in het rapport over de solvabiliteit en financiële positie de reden voor het niet
      openbaar bekend maken van de in het eerste lid bedoelde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel134c
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel134d
