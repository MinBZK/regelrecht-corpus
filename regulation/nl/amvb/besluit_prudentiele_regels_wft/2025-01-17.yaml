    text: |-
      1 De gegevens, bedoeld in [artikel 3:95, tweede lid][ref1], en [3:96, tweede lid, van de wet][ref2] zijn:

      1°. een opgave van de omvang van een gekwalificeerde deelneming als bedoeld in [artikel 3:95 van de wet][ref3];

      2°. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:99 van de wet][ref4] is bepaald met betrekking tot de betrouwbaarheid van de aanvrager of houder van
      een verklaring van geen bezwaar die op grond van zijn gekwalificeerde deelneming het beleid van de betrokken
      onderneming zou kunnen bepalen of mede bepalen of zou bepalen of mede bepalen;

      3°. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:99a van de wet][ref5] is bepaald met betrekking tot de geschiktheid, gelet op diens reputatie, van de
      aanvrager of houder van een verklaring van geen bezwaar die op grond van zijn gekwalificeerde deelneming het beleid
      van de betrokken onderneming zou kunnen bepalen of mede bepalen of zou bepalen of mede bepalen;

      4°. bescheiden waaruit de financiële positie en de juridische groepsstructuur van de aanvrager of houder van een
      verklaring van geen bezwaar blijken; en

      5°. bescheiden waaruit blijkt dat de financiële onderneming als gevolg van de gekwalificeerde deelneming zal kunnen
      blijven voldoen aan de prudentiële regels die ingevolge deze wet zijn gesteld.

      2 De gegevens, bedoeld in het eerste lid, onder 2°, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in [bijlage A][ref6] bij dit besluit; en

      d. een opgave van referenten.

      3 De gegevens, bedoeld in het eerste lid, onder 3°, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. een curriculum vitae;

      d. een opgave van de relevante diploma’s;

      e. gegevens met betrekking tot het verwerven en besturen van deelnemingen; en

      f. een opgave van referenten.

      4 De Nederlandsche Bank kan, in aanvulling op de gegevens, bedoeld in het eerste lid, andere
      gegevens van de aanvrager of houder van een verklaring van geen bezwaar verlangen, indien die
      gegevens nodig zijn voor de beoordeling of er sprake is van de weigeringsgrond als bedoeld in
      [artikel 3:100, eerste lid, aanhef en onderdeel e, van de wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel395
