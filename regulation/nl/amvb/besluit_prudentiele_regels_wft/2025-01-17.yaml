  - number: '26.6'
    text: |-
      1 Een verzekeraar of holding als bedoeld in [artikel 3:288i1, eerste lid, van de wet][ref1] beschikt over een
      voorbereidend groepscrisisplan dat door de Nederlandsche Bank is goedgekeurd en dat voorziet in maatregelen met
      betrekking tot de verzekeraar, zijn dochterondernemingen of holding, die de groep in staat stellen de financiële
      positie van de afzonderlijke groepsleden en de groep als geheel na een aanzienlijke verslechtering ervan te
      herstellen.

      2 Het voorbereidende groepscrisisplan bevat een identificatie van de belangrijkste onderdelen van de groep.

      3 [Artikel 26.5, tweede tot en met vijfde lid][ref2], is van overeenkomstige toepassing op een voorbereidend
      groepscrisisplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3288i1
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel26.5
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26.6
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:288i1
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '26.5'
        hoofdstuk: '4'
        paragraaf: 4.3a
  - number: '26.7'
    text: |-
      De inrichting van de bedrijfsvoering van een verzekeraar als bedoeld in [artikel 26.5, eerste lid][ref1], of van
      een verzekeraar dan wel holding als bedoeld in [artikel 26.6, eerste lid][ref2], waarborgt dat elke maatregel
      bedoeld in artikel 26.5, vierde lid, onderdeel a, zonder wezenlijke belemmeringen ten uitvoer kan worden gelegd, in
      ieder geval met betrekking tot:

      a. aanpassingen in het risicoprofiel van de verzekeraar;

      b. de mogelijkheden tot tijdige herkapitalisatie;

      c. aanpassingen in de strategie en bedrijfsvoering; en

      d. de financieringsstrategie, teneinde de weerbaarheid van de bedrijfsonderdelen te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel26.5
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel26.6
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26.7
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '26.5'
        hoofdstuk: '4'
        paragraaf: 4.3a
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '26.6'
        hoofdstuk: '4'
        paragraaf: 4.3a
  - number: '26.8'
    text: |-
      1 De Nederlandsche Bank beoordeelt een voorbereidend crisisplan of voorbereidend groepscrisisplan binnen zes
      maanden na de voorlegging ervan.

      2 Indien het voorbereidend crisisplan of groepscrisisplan wezenlijke tekortkomingen vertoont of indien er
      wezenlijke belemmeringen zijn voor de uitvoering van het voorbereidende crisisplan en deze tekortkomingen of
      belemmeringen niet binnen een redelijke termijn zullen worden weggenomen, wordt goedkeuring aan het plan onthouden.
      Binnen drie maanden legt de indiener van het voorbereidende crisisplan opnieuw een voorbereidend crisisplan ter
      goedkeuring voor, waarbij de geconstateerde tekortkomingen of belemmeringen binnen een redelijke termijn zullen
      worden weggenomen.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26.8
  - number: '26.9'
    text: |-
      Indien een verzekeraar, onderdeel of holding als bedoeld in [artikel 26.6, eerste lid][ref1], uitvoering geeft
      aan maatregelen die zijn opgenomen in het voorbereidende crisisplan of deze maatregelen achterwege laat bij een
      aanzienlijke verslechtering van de financiële positie als bedoeld in [artikel 26.5, eerste lid][ref2], doet de
      verzekeraar, het onderdeel of de holding daarvan onverwijld mededeling aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel26.6
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel26.5
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26.9
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '26.6'
        hoofdstuk: '4'
        paragraaf: 4.3a
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '26.5'
        hoofdstuk: '4'
        paragraaf: 4.3a
  - number: 26a
    text: |-
      1 Een bank, beleggingsonderneming of financiële instelling die een verklaring van ondertoezichtstelling als bedoeld
      in [artikel 3:110][ref1] heeft, beschikt over procedures en maatregelen die waarborgen dat de voor de uitvoering
      van de vangnetregelingen noodzakelijke gegevens voortdurend actueel worden bijgehouden en adequaat zijn vastgelegd.

      2 De financiële onderneming verstrekt de gegevens, bedoeld in het eerste lid, op verzoek van de Nederlandsche Bank
      binnen een door de Nederlandsche Bank te bepalen termijn en op een op de Nederlandsche Bank te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3110
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:110
  - number: 26b
    text: |-
      Afwikkelondernemingen, banken, betaalinstellingen en elektronischgeldinstellingen nemen bij de inrichting van
      hun bedrijfsvoering de regels in acht die door de Nederlandsche Bank terzake worden gesteld ter uitvoering van
      internationaal aanvaarde standaarden om de goede werking van het betalingsverkeer te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26b
  - number: 26ba
    text: |-
      1 Een betaalinstelling beschikt over een beschrijving van de regelingen op het gebied van bestuur en mechanismen
      voor interne controle.

      2 De in het eerste lid genoemde bestuursregelingen en interne controlemechanismen omvatten in elk geval:

      a. administratieve en boekhoudkundige procedures;

      b. procedures voor risicobeheersing;

      c. regelingen voor het gebruik van ICT-diensten in overeenstemming met de verordening digitale operationele
      weerbaarheid, waaruit blijkt dat die bestuursregelingen en interne controlemechanismen evenredig, passend, degelijk
      en adequaat zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26ba
  - number: 26c
    text: |-
      1 Een betaalinstelling beschikt over een beveiligingsbeleid om betaaldienstgebruikers te beschermen tegen
      beveiligingsrisico’s, zoals fraude en illegaal gebruik van gevoelige betaalgegevens en persoonsgegevens.

      2 Het beveiligingsbeleid omvat ten minste:

      a. maatregelen op het gebied van beveiliging en risicobescherming, met inbegrip van een risicoanalyse met
      betrekking tot de aangeboden betaaldiensten onder meer in relatie tot digitale operationele veiligheid als bedoeld
      in de verordening digitale operationele weerbaarheid;

      b. procedures voor het registreren en afhandelen van veiligheidsincidenten en veiligheidsgerelateerde klachten van
      cliënten en de nabehandeling ervan, met inbegrip van een mechanisme voor het melden van incidenten die rekening
      houden met de kennisgevingsverplichtingen voor betaalinstellingen die zijn vastgelegd in hoofdstuk III van de
      verordening digitale operatonele weerbaarheid;

      c. procedures voor het opslaan, monitoren, traceren en beperken van de toegang tot gevoelige betaalgegevens; en

      d. uitgangspunten en standaarden die worden toegepast bij het verzamelen van statistische gegevens over prestaties,
      transacties en fraude.

      3 Indien de betaalinstelling uitsluitend betaaldiensten verleent als bedoeld onder 8 van de bijlage bij de
      richtlijn betaaldiensten, is het tweede lid, onderdeel d, niet van toepassing.

      4 Het eerste en tweede lid zijn van overeenkomstige toepassing op elektronischgeldinstellingen.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26c
  - number: 26d
    text: |-
      Een betaaldienstverlener beschikt over procedures ter waarborging van de bedrijfscontinuïteit, waaronder
      de bedrijfscontinuïteit op het gebied van de informatie- en communicatievoorziening, waarin de kritieke
      bedrijfsactiviteiten zijn opgenomen, met inbegrip van respons- en herstelplannen voor de informatie- en
      communicatievoorziening en een procedure om de toereikendheid en efficiëntie van deze procedures en plannen
      periodiek te toetsen en te herzien met inachtneming van de verordening digitale operationele weerbaarheid.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26d
  - number: 26e
    text: |-
      Een betaaldienstverlener, met uitzondering van de betaaldienstverlener die uitsluitend betaaldiensten verleent als
      bedoeld onder 8 van de bijlage bij de richtlijn betaaldiensten, verkrijgt alleen met de uitdrukkelijke toestemming
      van de betaaldienstgebruiker toegang tot diens persoonsgegevens, om deze gegevens te verwerken en te bewaren voor
      zover noodzakelijk voor het verlenen van betaaldiensten.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26e
  - number: 26f
    text: |-
      1 Een betaaldienstverlener voorziet in passende risicobeperkende maatregelen en controlemechanismen ter voorkoming
      van operationele en beveiligingsrisico’s die zijn verbonden aan de door hem aangeboden betaaldiensten.

      2 Een betaaldienstverlener beschikt over procedures ter beheersing incidenten, inclusief een procedure om grote
      operationele incidenten en veiligheidsincidenten te detecteren en te classificeren.

      3 Een betaaldienstverlener verstrekt de Nederlandsche Bank ten minste jaarlijks een beoordeling van de operationele
      en beveiligingsrisico’s en van de toereikendheid van de in reactie op deze risico’s ingevoerde risicobeperkende
      maatregelen en controlemechanismen.

      4 Dit artikel is van toepassing onverminderd hoofdstuk II van de verordening digitale operationele weerbaarheid.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26f
  - number: 26g
    text: |-
      1 Een betaaldienstverlener stelt de Nederlandsche Bank onverwijld in kennis van een groot operationeel of
      beveiligingsincident. Indien het incident gevolgen heeft of kan hebben voor de financiële belangen van hun
      betaaldienstgebruikers, stelt de betaaldienstverlener ook deze onverwijld van het incident in kennis en vermeldt
      hij welke maatregelen hij treft om de mogelijke schadelijke gevolgen van het incident te beperken.

      2 Een betaaldienstverlener verstrekt ten minste jaarlijks statistische gegevens over de door hem geconstateerde
      fraude met betrekking tot verschillende betaalmiddelen aan de Nederlandsche Bank.

      3 Het eerste lid is niet van toepassing op de in artikel 96, zevende lid, van de richtlijn betaaldiensten genoemde
      betaaldienstverleners.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26g
  - number: 26l
    text: |-
      De [artikelen 26e tot en met 26k][ref1] zijn van toepassing op betalingstransacties in alle valuta, waarbij één of
      de enige bij de betalingstransactie betrokken betaaldienstverlener zijn zetel in een lidstaat heeft, met betrekking
      tot de delen van de betalingstransactie die binnen een lidstaat worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel26e
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26l
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 26e
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 26h
    text: |-
      1 Een betaaldienstverlener voorziet in sterke cliëntauthenticatie indien:

      a. een betaler zich via het internet toegang tot zijn betaalrekening verschaft;

      b. een betaler een elektronische betalingstransactie initieert;

      c. een betaler via een communicatiemiddel op afstand een handeling uitvoert die een risico op betaalfraude of
      andere vormen van misbruik met zich mee kan brengen;

      d. een betaling via een betaalinitiatiedienstverlener wordt geïnitieerd; of

      e. informatie via een rekeninginformatiedienstverlener wordt opgevraagd.

      2 Sterke cliëntauthenticatie is een vorm van authenticatie die zodanig is opgezet dat de vertrouwelijkheid van de
      persoonlijke beveiligingsgegevens wordt beschermd en waarbij gebruik wordt gemaakt van twee of meer van de volgende
      factoren:

      a. wetenschap, iets wat alleen de gebruiker weet;

      b. bezit, iets waarover alleen de gebruiker beschikt; of

      c. inherente eigenschap, een unieke persoonlijke eigenschap van de gebruiker.

      3 De factoren dienen onderling onafhankelijk te zijn, in die zin dat schending van de vertrouwelijkheid van één
      ervan geen afbreuk doet aan de betrouwbaarheid van de andere factoren.

      4 Indien een betaaldienstverlener sterke cliëntauthenticatie toepast treft hij beveiligingsmaatregelen en voorziet
      hij in authenticatieprocedures ter bescherming van de vertrouwelijkheid en integriteit van de persoonlijke
      beveiligingsgegevens van betaaldienstgebruikers.

      5 Indien er sprake is van het initiëren van een elektronische betalingstransactie op afstand, gebruikt een
      betaaldienstverlener sterke cliëntauthenticatie met elementen die transacties op dynamische wijze aan een specifiek
      bedrag en een specifieke betalingsbegunstigde verbinden.

      6 De rekeninghoudende betaaldienstverlener staat de betaalinitiatiedienstverlener en de
      rekeninginformatiedienstverlener toe dat zij mogen vertrouwen op de door hem ten behoeve van de
      betaaldienstgebruiker verstrekte authenticatieprocedures.

      7 Toepassing van dit artikel geschiedt met inachtneming van de krachtens artikel 98 van de richtlijn betaaldiensten
      door de EBA vastgestelde technische reguleringsnormen.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26h
  - number: 26i
    text: |-
      1 Een betaalinitiatiedienstverlener zorgt ervoor dat de persoonlijke beveiligingsgegevens van de
      betaaldienstgebruiker alleen toegankelijk zijn voor de gebruiker en de uitgever van de persoonlijke
      beveiligingsgegevens, en verzendt de persoonlijke beveiligingsgegevens op een veilige en efficiënte manier.

      2 Een betaalinitiatiedienstverlener verstrekt iedere andere informatie over de betaaldienstgebruiker, die is
      verkregen bij het verstrekken van betaalinitiatiedienst, alleen aan de betalingsbegunstigde en alleen met de
      uitdrukkelijke instemming van de betaaldienstgebruiker.

      3 Een betaalinitiatiedienstverlener identificeert zich bij elke betaalinitiatie ten overstaan van de
      rekeninghoudende betaaldienstverlener van de betaler en communiceert op een veilige manier met de rekeninghoudende
      betaaldienstverlener.

      4 Een betaalinitiatiedienstverlener slaat geen gevoelige betaalgegevens van de betaaldienstgebruiker op.

      5 Een betaalinitiatiedienstverlener vraagt uitsluitend gegevens op van de betaaldienstgebruiker die nodig zijn voor
      het verstrekken van de betaalinitiatiedienst.

      6 Een betaalinitiatiedienstverlener gebruikt, verschaft zich toegang tot of slaat gegevens op, uitsluitend ten
      behoeve van de door de betaler uitdrukkelijk gevraagde betaalinitiatiedienst.

      7 Een betaalinitiatiedienstverlener laat het bedrag, de betalingsbegunstigde of enig ander element van de
      transactie ongewijzigd.

      8 Toepassing van dit artikel vindt plaats met inachtneming van de krachtens artikel 98 van de richtlijn
      betaaldiensten door de EBA vastgestelde technische reguleringsnormen.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26i
  - number: 26j
    text: |-
      1 Een rekeninginformatiedienstverlener verricht zijn diensten alleen met uitdrukkelijke instemming van de
      betaaldienstgebruiker.

      2 Een rekeninginformatiedienstverlener zorgt ervoor dat de persoonlijke beveiligingsgegevens van de
      betaaldienstgebruiker alleen toegankelijk zijn voor de gebruiker en de uitgever van de persoonlijke
      beveiligingsgegevens, en verzendt de persoonlijke beveiligingsgegevens op een veilige en efficiënte manier.

      3 Een rekeninginformatiedienstverlener identificeert zich bij elke communicatiesessie met de rekeninghoudende
      betaaldienstverlener van de betaaldienstgebruiker en communiceert op een veilige manier met de rekeninghoudende
      betaaldienstverlener en de betaaldienstgebruiker.

      4 Een rekeninginformatiedienstverlener heeft uitsluitend toegang tot de informatie van de aangewezen
      betaalrekeningen en de betrokken betalingstransacties.

      5 Een rekeninginformatiedienstverlener vraagt geen gevoelige betaalgegevens met betrekking tot de betaalrekeningen
      op.

      6 Een rekeninginformatiedienstverlener gebruikt, verschaft zich toegang tot of slaat gegevens op uitsluitend ten
      behoeve van het uitvoeren van de door de betaaldienstgebruiker uitdrukkelijk gevraagde rekeninginformatiedienst,
      overeenkomstig Verordening (EU) 2016/679 van het Europees Parlement en de Raad van 27 april 2016 betreffende
      de bescherming van natuurlijke personen in verband met de verwerking van persoonsgegevens en betreffende het
      vrije verkeer van die gegevens en tot intrekking van [Richtlijn 95/46/EG](31995L0046) en bij of krachtens de
      Uitvoeringswet Algemene Verordening Gegevensbescherming gestelde regels.

      7 Toepassing van dit artikel vindt plaats met inachtneming van de krachtens artikel 98 van de richtlijn
      betaaldiensten door de EBA vastgestelde technische reguleringsnormen.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26j
  - number: 26k
    text: |-
      1 De rekeninghoudende betaaldienstverlener:

      a. communiceert op een veilige manier met zowel betaalinitiatiedienstverleners als
      rekeninginformatiedienstverleners;

      b. behandelt een door een rekeninginformatiedienstverlener verzonden verzoek om gegevens niet anders dan een door
      de betaaldienstgebruiker verzonden verzoek om gegevens, tenzij om objectieve redenen;

      c. behandelt de via de diensten van een betaalinitiatiedienstverlener doorgegeven betaalopdrachten niet anders dan
      door de betaler rechtstreeks verzonden betaalopdrachten, met name wat betreft termijn, voorrang of kosten, tenzij
      om objectieve redenen;

      d. verstrekt onmiddellijk na ontvangst van de betaalopdracht van de betaalinitiatiedienstverlener alle informatie
      over de initiëring van de betalingstransactie, alsmede alle informatie die toegankelijk is voor de rekeninghoudende
      betaaldienstverlener met betrekking tot de uitvoering van deze transactie aan de betaalinitiatiedienstverlener, of
      stelt deze informatie ter beschikking;

      e. laat het gebruik van betaalinitiatie- en rekeninginformatiediensten niet afhangen van een contractuele relatie
      tussen hem en de betaalinitiatie- of rekeninginformatiedienstverlener;

      f. werpt geen obstakels op voor het verlenen van betaalinitiatiediensten en rekeninginformatiediensten.

      2 Toepassing van dit artikel vindt plaats met inachtneming van de krachtens artikel 98 van de richtlijn
      betaaldiensten door de EBA vastgestelde technische reguleringsnormen.
    url: https://wetten.overheid.nl/BWBR0020420/2025-01-17#Artikel26k
  - number: '27'
    text: |-
      1 Een financiële onderneming of bijkantoor als bedoeld in [artikel 3:18, eerste lid][ref1], [3:22][ref2],
      [3:23][ref3], [3:24b][ref4], [3:26][ref5] of [3:27, van de wet][ref6] gaat niet over tot het uitbesteden van
      werkzaamheden indien die uitbesteding een belemmering kan vormen voor een adequaat toezicht op de naleving van het
      bij of krachtens het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref7] bepaalde.

      2 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in
      [artikel 3:18, tweede lid][ref8], [3:23][ref9], [3:26][ref10] of [3:27 van de wet][ref11] besteedt de taken en
      werkzaamheden van personen die het dagelijks beleid bepalen, daaronder mede verstaan het vaststellen van het beleid
      en het afleggen van verantwoording over het gevoerde beleid, niet uit.


