  - number: '133'
    text: |-
      Het onderzoek van de staten, bedoeld in [artikel 130][ref1], door de accountant, uitmondend in een verklaring
      omtrent de getrouwheid als bedoeld in [artikel 3:72, zevende lid, eerste volzin, van de wet][ref2], wordt
      een maal per jaar uitgevoerd. De Nederlandsche Bank stelt regels waarin wordt bepaald welke staten door de
      accountant in zijn onderzoek worden betrokken, met dien verstande dat een beheerder, betaalinstelling of
      elektronischgeldinstelling die een maal per jaar een door een accountant gewaarmerkte jaarrekening verstrekt
      daarmee voldoet aan de verplichting als bedoeld in artikel 3:72, zevende lid, van de wet. De accountant waarmerkt
      deze staten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel372
