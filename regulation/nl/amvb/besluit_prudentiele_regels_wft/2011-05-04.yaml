  - number: 136.2.c
    text: |-
      indien de Nederlandsche Bank daarom verzoekt, een nadere toelichting op de gegevens, bedoeld in de onderdelen a
      en b.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel136
  - number: '137.1'
    text: |-
      De accountant of actuaris die voornemens is gegevens als bedoeld in [artikel 136][ref1], eerste onderscheidenlijk
      tweede lid, te verstrekken, stelt de financiële onderneming daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel136
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '136'
        hoofdstuk: '14'
  - number: '137.2'
    text: |-
      Indien de financiële onderneming dat wenst, kan zij zelf de gegevens aan de Nederlandsche Bank verstrekken. In dat
      geval stelt zij de accountant of de actuaris daarvan in kennis. De accountant of de actuaris vergewist zich ervan
      dat de Nederlandsche Bank de gegevens heeft ontvangen en dat de inhoud van de gegevens hem geen aanleiding geeft
      alsnog gegevens aan de Nederlandsche Bank te verstrekken.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel137
  - number: '137.3'
    text: |-
      Indien de accountant of actuaris schriftelijk gegevens verstrekt aan de Nederlandsche Bank, zendt hij onverwijld
      aan de financiële onderneming een afschrift van de gegevens en, indien van toepassing, van de begeleidende brief.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel137
  - number: '138'
    text: |-
      De gegevens, bedoeld in [artikel 3:95, tweede lid][ref1], en [3:96, tweede lid, van de wet][ref2] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel138
