      van gegevens op basis waarvan de Nederlandsche Bank heeft geoordeeld dat wordt voldaan aan hetgeen ingevolge
      [artikel 3:9][ref2] wordt bepaald met betrekking tot de betrouwbaarheid van de in [dat artikel][ref3] bedoelde
      personen.


