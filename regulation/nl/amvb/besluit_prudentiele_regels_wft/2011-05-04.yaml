      De waarden die dienen tot dekking van het minimumbedrag aan solvabiliteitsmarge van een bijkantoor als bedoeld in
      het eerste lid zijn aanwezig in één of meer lidstaten.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel101
  - number: '102.1'
    text: |-
      De waarde van de grote posities van een bank of beleggingsonderneming als bedoeld in
      [artikel 3:57, zesde lid][ref1], of [3:58, eerste lid, van de wet][ref2] of van een clearinginstelling als bedoeld
      in [artikel 3:57, zesde lid][ref3], of [3:61, eerste lid, van de wet][ref4], met inbegrip van de waarde van de
      grote posities van haar bijkantoren in een staat die geen lidstaat is, bedraagt ten aanzien van een wederpartij of
      groep van verbonden wederpartijen niet meer dan 25 procent van haar toetsingsvermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel102
    references:
