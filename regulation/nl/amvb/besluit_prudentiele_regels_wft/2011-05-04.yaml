  - number: '97.1'
    text: |-
      De Nederlandsche Bank kan er, op verzoek, mee instemmen dat de verzekeraar bij de berekening van de aanwezige
      solvabiliteitsmarge, bedoeld in [artikel 95, eerste lid][ref1], tevens de waarde betrekt van:


