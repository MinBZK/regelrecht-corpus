  - number: '98.3'
    text: |-
      Voor de berekening van de aanwezige solvabiliteitsmarge van een herverzekeraar die zijn bedrijf uitoefent in
      de activiteit levensherverzekering, levensverzekeraar of natura-uitvaartverzekeraar wordt niet meegerekend
      het positieve verschil tussen de gedisconteerde technische voorzieningen die niet worden gedekt door
      rentedragende beleggingen met dezelfde looptijd, berekend met een voorzichtige vaste disconteringsvoet en met
      de disconteringsvoet die is gebruikt voor de toets, bedoeld in [artikel 121, tweede lid][ref1], tenzij hiermee
      reeds rekening gehouden is in de balanswaardering van de technische voorzieningen. De Nederlandsche Bank stelt de
      voorzichtige vaste disconteringsvoet vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel121
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel98
