      Het derde lid is niet van toepassing indien het voornemen tot wijziging een persoon betreft wiens
      betrouwbaarheid voor de toepassing van de wet door een toezichthouder reeds is vastgesteld, tenzij de
      Nederlandsche Bank besluit dat een redelijke aanleiding bestaat tot een nieuwe beoordeling als bedoeld in
      [artikel 3:9, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '39.1'
    text: |-
      Een levensverzekeraar of natura-uitvaartverzekeraar als bedoeld in [artikel 3:42][ref1], [3:43, tweede lid][ref2],
      [3:48, eerste lid][ref3], onderscheidenlijk [3:52 van de wet][ref4], geeft schriftelijk kennis aan de Nederlandsche
      Bank van een voornemen tot een wijziging van de overeenkomsten die hij voornemens is te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '39.2'
    text: |-
      Een schadeverzekeraar als bedoeld in [artikel 3:42][ref1], [3:43, tweede lid][ref2],
      [3:48, eerste lid, van de wet][ref3], die vanuit een vestiging in een lidstaat diensten naar Nederland verricht,
      geeft aan de Nederlandsche Bank kennis van het voornemen tot een wijziging van de in Nederland gelegen risico’s die
      hij voornemens is te dekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '39.3'
    text: |-
      Een entiteit voor risico-acceptatie of een herverzekeraar als bedoeld in [artikel 3:49 van de wet][ref1],
      geeft schriftelijk kennis aan de Nederlandsche Bank van een voornemen tot een wijziging van de risico’s die zij
      onderscheidenlijk hij voornemens is te dekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '39.4'
    text: |-
      De verzekeraar kan het voornemen, bedoeld in het eerste, tweede of derde lid, ten uitvoer brengen vanaf de dag
      waarop de Nederlandsche Bank de kennisgeving, bedoeld in het eerste, tweede of derde lid, heeft ontvangen. De
      Nederlandsche Bank bevestigt de ontvangst onverwijld aan de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel39
  - number: '39.5'
    text: |-
      Indien de schadeverzekeraar voornemens is de in Nederland gelegen risico’s zodanig te wijzigen dat deze risico’s
      behorende tot de branche Aansprakelijkheid motorrijtuigen omvatten, legt hij bij de kennisgeving de volgende
      gegevens over aan de Nederlandsche Bank:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel39
  - number: 39.5.a
    text: |-
      een schriftelijk bewijs waaruit blijkt dat hij is aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
  - number: 39.5.b
    text: |-
      een schriftelijk bewijs waaruit blijkt dat hij zich heeft gemeld bij het Waarborgfonds Motorverkeer teneinde
      te voldoen aan zijn verplichtingen jegens dat fonds uit hoofde van de [artikelen 24, eerste lid][ref1], en
      [24a, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel24a
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: 24a
  - number: 39.5.c
    text: |-
      een opgave van de naam en het adres van de schaderegelaar, bedoeld in [artikel 4:70, tweede lid, van de wet][ref1],
      die hij in iedere andere lidstaat heeft aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '40.1'
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:43, tweede lid][ref1], of [3:49 van de wet][ref2] geeft schriftelijk
      kennis aan de Nederlandsche Bank van een wijziging van gegevens op basis waarvan de Nederlandsche Bank heeft
      geoordeeld dat wordt voldaan aan hetgeen ingevolge [artikel 3:9 van de wet][ref3] wordt bepaald met betrekking tot
      de betrouwbaarheid van de vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '40.2'
    text: |-
      De financiële onderneming geeft van een wijziging als bedoeld in het eerste lid, onverwijld kennis nadat zij van de
      wijziging op de hoogte is gekomen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40
  - number: 40a.1
    text: |-
      Een betaalinstelling stelt geldmiddelen die zijn ontvangen van betaaldienstgebruikers of andere
      betaaldienstverleners voor de uitvoering van betalingstransacties op een van de volgende wijzen veilig:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40a
  - number: 40a.1.a
    text: de geldmiddelen worden niet vermengd met de geldmiddelen van andere schuldeisers van de betaalinstelling; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40a
  - number: 40a.1.b
    text: |-
      de geldmiddelen worden gedekt door een verzekeringspolis of een vergelijkbare garantie van een verzekeraar of een
      bank die niet tot dezelfde groep behoort als de betaalinstelling, tegen het risico dat de betaalinstelling niet in
      staat is haar verplichtingen met betrekking tot de geldmiddelen na te komen, voor een bedrag dat gelijk is aan het
      bedrag dat afgescheiden zou zijn bij het ontbreken van de verzekeringspolis of vergelijkbare garantie.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40a
  - number: 40a.2
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, aanhef en onderdeel a, en de geldmiddelen aan het einde
      van de werkdag, volgend op de dag waarop zij zijn ontvangen, nog niet aan de betalingsbegunstigde of aan een
      andere betaaldienstaanbieder zijn overgemaakt, worden zij op een afzonderlijke rekening gestort bij een bank
      of belegd in veilige, liquide activa met een lage risicograad, op zodanige wijze dat andere schuldeisers van de
      betaalinstelling, in het bijzonder in het geval van insolventie van de betaalinstelling, hun vorderingen niet op
      deze geldmiddelen kunnen verhalen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40a
  - number: 40a.3
    text: |-
      Voor de toepassing van het tweede lid zijn veilige activa met een lage risicograad activa die vallen in een van
      de categorieën opgenomen in tabel 1 van punt 14 van bijlage I bij Richtlijn 2006/49/EG van het Europees Parlement
      en de Raad van 14 juni 2006 inzake de kapitaaltoereikendheid van beleggingsondernemingen en kredietinstellingen
      (PbEU L 177) waarvoor het kapitaalvereiste voor het specifieke risico niet hoger ligt dan 1,6%, terwijl andere
      in aanmerking komende activa, als gedefinieerd in punt 15 van die bijlage, worden uitgesloten. Voor de toepassing
      van het tweede lid zijn veilige activa met een lage risicograad eveneens deelnemingsrechten in een instelling
      voor collectieve belegging in effecten (ICBE) die enkel investeert in activa zoals gespecificeerd in de eerste
      alinea. In buitengewone omstandigheden en wanneer dit voldoende gemotiveerd is, mogen de bevoegde autoriteiten,
      op basis van een evaluatie van de veiligheid, de looptijd, de waarde of andere risicofactoren van de activa zoals
      gespecificeerd in de eerste en tweede alinea, bepalen welke van deze activa geen veilige activa met een lage
      risicograad zijn voor de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40a
  - number: 40a.4
    text: |-
      Indien het deel van de geldmiddelen dat bestemd is voor toekomstige betalingstransacties niet bekend of variabel
      is, is het de betaalinstellingen toegestaan om het eerste lid uitsluitend toe te passen op een representatief
      gedeelte dat geacht wordt voor betalingsdiensten te worden gebruikt. Dit representatieve gedeelte moet
      redelijkerwijs kunnen worden geraamd op basis van historische gegevens.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40a
  - number: 40b
    text: |-
      Betaalinstellingen verlenen slechts krediet in verband met de in de punten 4, 5 en 7 van de bijlage bij de
      richtlijn betaaldiensten bedoelde betaaldiensten indien:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40b
  - number: 40b.a
    text: |-
      het krediet een aanvullend krediet is en uitsluitend wordt verstrekt in verband met de uitvoering van een
      betalingstransactie;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40b
  - number: 40b.b
    text: |-
      het krediet dat is verstrekt in verband met een betaaldienst die is verleend door middel van dienstverrichting naar
      een andere lidstaat of vanuit een bijkantoor in een andere lidstaat wordt terugbetaald binnen een korte termijn,
      die in geen geval meer dan twaalf maanden bedraagt;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40b
  - number: 40b.c
    text: |-
      het niet wordt verleend uit geldmiddelen die zijn ontvangen of die worden aangehouden voor het uitvoeren van
      toekomstige betalingstransacties; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40b
  - number: 40b.d
    text: |-
      het eigen vermogen van de betaalinstelling te allen tijde in redelijke verhouding staat tot het totale bedrag van
      het verleende krediet.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel40b
  - number: '41.1'
    text: |-
      In afwijking van de [artikelen 3:36, derde lid][ref1], en [3:43, eerste lid, van de wet][ref2] is het
      schadeverzekeraars toegestaan in de uitoefening van hun bedrijf, naast de risico’s die behoren tot de branche
      waarvoor de vergunning is verleend, tevens risico’s te verzekeren die behoren tot andere branches, met uitzondering
      van de branches Krediet en Borgtocht, indien deze risico’s naar het oordeel van de Nederlandsche Bank als
      bijkomende risico’s kunnen worden beschouwd, omdat zij:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 41.1.a
    text: samenhangen met het hoofdrisico dat behoort tot de branche waarvoor de vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel41
  - number: 41.1.b
    text: betrekking hebben op het belang of gevaarsobject dat is verzekerd tegen het hoofdrisico; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel41
  - number: 41.1.c
    text: worden verzekerd bij dezelfde overeenkomst als het hoofdrisico.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel41
  - number: '41.2'
    text: |-
      De risico’s van de branche Rechtsbijstand mogen uitsluitend worden verzekerd als bijkomend risico van de branche
      Hulpverlening en van branches waarbij risico’s worden verzekerd die verband houden met het gebruikvan zeeschepen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel41
  - number: '42'
    text: |-
      Als adres van een vertegenwoordiger in Nederland van een verzekeraar als bedoeld in [artikel 3:40 van de wet][ref1]
      waaraan rechtsgeldig mededelingen kunnen worden gedaan wordt beschouwd het in Nederland gelegen bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '43'
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:40][ref1], [3:47, zesde lid][ref2] of
      [3:50, tweede lid, van de wet][ref3] wordt geacht, indien de vertegenwoordiger ontbreekt, zijn woonplaats te hebben
      ten parkette van de officier van justitie bij de rechtbank binnen het rechtsgebied waarvan de verzekeraar ingevolge
      [artikel 42][ref4] het laatst zijn woonplaats had, of anders ten parkette van de officier van justitie bij de
      rechtbank te Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel42
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: '42'
        hoofdstuk: '8'
  - number: '44.1'
    text: |-
      De omstandigheden, bedoeld in [artikel 3:40][ref1] en [3:47, zesde lid, van de wet][ref2] waaronder de
      vertegenwoordiger van een verzekeraar als bedoeld in [artikel 3:40][ref3], [3:47, zesde lid][ref4], of
      [3:50, tweede lid, van de wet][ref5] ophoudt vertegenwoordiger te zijn, zijn de omstandigheden, bedoeld in het
      tweede tot en met vijfde lid en in de [artikelen 45 tot en met 47][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020420#Artikel45
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020420
        artikel: '45'
        hoofdstuk: '8'
  - number: '44.2'
    text: |-
      De verzekeraar die voornemens is de vertegenwoordiging te beëindigen, geeft daarvan kennis aan de Nederlandsche
      Bank.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel44
  - number: '44.3'
    text: |-
      De kennisgeving, bedoeld in het tweede lid, vermeldt tevens de naam van degene die de verzekeraar voornemens is aan
      te stellen als opvolger van de vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel44
  - number: '44.4'
    text: |-
      Indien de opvolger rechtspersoon is, gaat de kennisgeving gepaard met de statuten van deze rechtspersoon, een
      opgave van het nummer van inschrijving in het handelsregister en een bewijs van aanstelling van de natuurlijke
      persoon die is aangesteld als vertegenwoordiger van de vertegenwoordiger die rechtspersoon is.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel44
  - number: '44.5'
    text: |-
      De verzekeraar, bedoeld in [artikel 3:47, eerste lid][ref1], of [3:50, tweede lid, van de wet][ref2] beëindigt de
      vertegenwoordiging op de dag waarop van de beëindiging kennis is gegeven aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '44.6'
    text: |-
      De verzekeraar, bedoeld in [artikel 3:47, eerste lid][ref1], of [artikel 3:50, tweede lid, van de wet][ref2] geeft
      geen uitvoering aan het voornemen indien de Nederlandsche Bank er niet mee instemt. Indien de Nederlandsche Bank
      besluit niet in te stemmen met het voornemen, maakt zij haar besluit daartoe aan de financiële onderneming bekend:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 44.6.a
    text: binnen zes weken na ontvangst van de kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel44
  - number: 44.6.b
    text: |-
      indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel44
  - number: '45.1'
    text: |-
      De vertegenwoordiger, bedoeld in [artikel 3:40][ref1], [3:47, zesde lid][ref2], of
      [3:50, tweede lid, van de wet][ref3] die voornemens is de vertegenwoordiging te beëindigen, geeft daarvan kennis
      aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '45.2'
    text: |-
      De vertegenwoordiger van een verzekeraar als bedoeld in [artikel 3:47, eerste lid][ref1], of
      [3:50, tweede lid, van de wet][ref2] behoudt de hoedanigheid van vertegenwoordiger tot de dag waarop hij van de
      beëindiging kennis heeft gegeven aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '45.3'
    text: |-
      De vertegenwoordiger geeft geen uitvoering aan het voornemen indien de Nederlandsche Bank er niet mee instemt.
      Indien de Nederlandsche Bank besluit niet in te stemmen met het voornemen, maakt zij haar besluit daartoe aan de
      financiële onderneming bekend:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel45
  - number: 45.3.a
    text: binnen zes weken na ontvangst van de kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel45
  - number: 45.3.b
    text: |-
      indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel45
  - number: '46.1'
    text: |-
      De vertegenwoordiger van een verzekeraar als bedoeld in [artikel 3:40][ref1], [3:47, tweede lid][ref2]
      of [3:50, tweede lid, van de wet][ref3] houdt op vertegenwoordiger te zijn vanaf de dag van het van
      toepassing verklaren van de schuldsanering natuurlijke personen, de verlening van surseance van betaling, de
      faillietverklaring, de ontbinding, bedoeld in [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref4], de
      onderbewindstelling van een of meer goederen, bedoeld in [titel 19 van Boek 1 van het Burgerlijk Wetboek][ref5], of
      de ondercuratelestelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0002656
  - number: '46.2'
    text: |-
      De aanwijzing door de vertegenwoordiger van een natuurlijk persoon die is aangewezen als vertegenwoordiger die een
      rechtspersoon is, vervalt van rechtswege op de dag van het van toepassing verklaren van de schuldsaneringsregeling
      natuurlijke personen, de verlening van surseance van betaling, de faillietverklaring, de ontbinding, bedoeld
      in [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref1], of de ondercuratelestelling van de aangewezen
      natuurlijk persoon alsmede op de dag van verlening van surseance van betaling aan of faillietverklaring van de
      vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel19
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '19'
  - number: '47.1'
    text: |-
      Van het overlijden, het van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen, de verlening van surseance van betaling, de faillietverklaring, de ontbinding, bedoeld in
      [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref1], de onderbewindstelling van een of meer goederen, bedoeld
      in [titel 19 van Boek 1 van het Burgerlijk Wetboek][ref2], of de ondercuratelestelling van de vertegenwoordiger
      of de natuurlijke persoon die is aangewezen als vertegenwoordiger van de vertegenwoordiger die rechtspersoon is,
      alsmede van de beëindiging van de vertegenwoordiging van de vertegenwoordiger door deze natuurlijke persoon, geeft
      de verzekeraar onderscheidenlijk de vertegenwoordiger binnen zeven dagen kennis aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002656
  - number: '47.2'
    text: |-
      De verzekeraar, bedoeld in [artikel 3:40 van de wet][ref1], legt, in de gevallen, genoemd in het eerste lid, en
      in het geval dat de vertegenwoordiger of de natuurlijke persoon, bedoeld in het eerste lid, de vertegenwoordiging
      heeft beëindigd, aan de Nederlandsche Bank een bewijs van aanstelling van de vertegenwoordiger over alsmede,
      indien de vertegenwoordiger een rechtspersoon is, de statuten van deze rechtspersoon, een opgave van het nummer
      van inschrijving in het handelsregister en een bewijs van aanstelling van de natuurlijke persoon, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '47.3'
    text: |-
      De verzekeraar, bedoeld in het tweede lid, verstrekt de gegevens, bedoeld in het tweede lid, binnen twee weken na
      de betrokken aanstelling.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel47
  - number: '47.4'
    text: |-
      De verzekeraar, bedoeld in [artikel 3:47, tweede lid][ref1], of [3:50, tweede lid, van de wet][ref2], wijst,
      in de gevallen, genoemd in het eerste lid, en in het geval dat de vertegenwoordiger of de natuurlijke persoon,
      bedoeld in [artikel 3:47, vijfde lid, van de wet][ref3], de vertegenwoordiging heeft beëindigd, binnen een door de
      Nederlandsche Bank te bepalen termijn een nieuwe vertegenwoordiger onderscheidenlijk natuurlijk persoon aan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '47.5'
    text: |-
      De verzekeraar, bedoeld in het vierde lid, legt aan de Nederlandsche Bank een bewijs van aanstelling van de
      nieuwe vertegenwoordiger over alsmede, indien de nieuwe vertegenwoordiger rechtspersoon is, de statuten van deze
      rechtspersoon, een uittreksel uit diens inschrijving in het handelsregister en de akte van aanstelling van de
      natuurlijke persoon, bedoeld in [artikel 3:47, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel47
