      de identiteit van de bestuurders en de personen die verantwoordelijk zijn voor het beleid van de betaaldienstagent
      die bij het aanbieden van betaaldiensten wordt gebruikt, alsmede gegevens waaruit blijkt dat zij betrouwbaar en
      deskundig zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140a
  - number: '141.1'
    text: |-
      Onverminderd het tweede lid is [hoofdstuk 5][ref1] niet van toepassing op overeenkomsten met betrekking tot het
      uitbesteden van werkzaamheden die:


