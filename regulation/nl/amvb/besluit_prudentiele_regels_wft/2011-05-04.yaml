        artikel: '3'
  - number: '34.2'
    text: |-
      De financiële onderneming geeft van een wijziging als bedoeld in het eerste lid onverwijld schriftelijk kennis
      nadat zij van de wijziging op de hoogte is gekomen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel34
  - number: '35.1'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling of verzekeraar als
      bedoeld in [artikel 33, eerste lid][ref1], geeft schriftelijk kennis aan de Nederlandsche Bank van een wijziging
      in:


