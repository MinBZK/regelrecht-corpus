        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '130.3'
    text: |-
      De door een bijkantoor als bedoeld in [artikel 3:77 van de wet][ref1] te verstrekken staten omvatten uitsluitend
      gegevens ten behoeve van het toezicht op de liquiditeit ingevolge [artikel 3:64][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '131.1'
    text: |-
      De Nederlandsche Bank stelt, met inachtneming van het bepaalde ingevolge het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref1], alsmede met inachtneming van
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2] en de internationale jaarrekeningstandaarden, regels met
      betrekking tot de staten, bedoeld in [artikel 130][ref3]. Deze omvatten uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel130
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0003045
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
  - number: 131.1.a
    text: de modellen van de staten;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
  - number: 131.1.b
    text: |-
      de reikwijdte van toepassing van de staten en de mate van detaillering van de in te vullen gegevens; deze omvatten
      geen uitbreiding of nadere rubricering van de staten;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
  - number: 131.1.c
    text: |-
      de reikwijdte van de consolidatie overeenkomstig de regels met betrekking tot consolidatie die de financiële
      onderneming in haar jaarrekening toepast, voor zover uit de wet niet anders voortvloeit;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
  - number: 131.1.d
    text: |-
      de waardering van de posten overeenkomstig de waarderingsmethoden die de financiële onderneming in haar
      jaarrekening toepast;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
  - number: 131.1.e
    text: de te hanteren valuta en rekeneenheid;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
  - number: 131.1.f
    text: de afronding;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
  - number: 131.1.g
    text: |-
      de termijn waarbinnen de staten worden verstrekt, met dien verstande dat deze niet
      korter is dan noodzakelijk voor de uitoefening van het toezicht op de naleving van het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 131.1.h
    text: de frequentie waarmee de staten worden verstrekt, met dien verstande dat deze ten minste een maal per jaar is.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
  - number: '131.2'
    text: |-
      De regels, bedoeld in het eerste lid, onderdelen b, f, g en h, zijn afgestemd op de aard en de omvang van de
      financiële onderneming, alsmede op de omvang van de solvabiliteit van de financiële onderneming. De frequentie,
      bedoeld in het eerste lid, onderdeel h, is evenwel niet hoger dan:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
  - number: 131.2.a
    text: |-
      twaalf maal per jaar voor de staten ten behoeve van het toezicht op de liquiditeit, bedoeld in
      [artikel 130, eerste lid, onderdeel b, onder 3° en derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
  - number: 131.2.b
    text: |-
      een maal per jaar voor de jaarrekening, bedoeld in [artikel 130, tweede lid, onderdeel a][ref1],
      en de staten ten behoeve van het toezicht op de technische voorzieningen, bedoeld in
      [artikel 130, tweede lid, onderdeel b, onder 2°][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel130
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
  - number: 131.2.c
    text: |-
      vier maal per jaar voor de overige in [artikel 130, eerste en tweede lid][ref1], genoemde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
  - number: '131.3'
    text: |-
      De Nederlandsche Bank kan in individuele gevallen besluiten dat een financiële onderneming als bedoeld in
      [artikel 130][ref1] periodiek moet melden of haar solvabiliteit of liquiditeit zich boven een door de Nederlandsche
      Bank vastgestelde signaleringswaarde bevindt. De frequentie van de melding is niet hoger dan een maal per maand en
      is afgestemd op de aard en de omvang van de financiële onderneming, alsmede op de omvang van de solvabiliteit van
      de financiële onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
  - number: '131.4'
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 48, eerste lid, onderdeel i, j of k][ref1], doet de
      melding, bedoeld in het derde lid, met redenen omkleed aan de Nederlandsche Bank in elke maand waarin zij niet
      ingevolge het tweede lid, onderdeel c, staten verstrekt. Zij meldt daarbij in ieder geval wat de waarde van
      haar toetsingsvermogen is, hoe deze waarde is berekend en hoe deze waarde zich verhoudt tot de waarde van haar
      toetsingsvermogen zoals vermeld in de laatst verstrekte staten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel48
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '48'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: '131.5'
    text: |-
      Ter voorbereiding op de implementatie van richtlijn nr. 2009/138/EG van het Europees Parlement en de Raad van
      de Europese Unie van 25 november 2009 betreffende de toegang tot en uitoefening van het verzekerings- en het
      herverzekeringsbedrijf (Solvabiliteit II) (herschikking) (PbEU L 335) dienen entiteiten voor risico-acceptatie en
      verzekeraars de in [Bijlage D][ref1] vastgestelde modellen van staten in, met inachtneming van het zesde lid. Voor
      zover niet anders blijkt, zijn op deze modellen van staten de regels van toepassing die de Nederlandsche Bank heeft
      vastgesteld op grond van het eerste lid, onderdelen b, c, e, f en h.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: '131.6'
    text: |-
      Voor het boekjaar 2011 dienen entiteiten voor risico-acceptatie en verzekeraars de modellen van staten 1 tot en met
      3, bedoeld in [bijlage D][ref1], in binnen acht maanden na afloop van dat boekjaar. Voor het boekjaar 2012 dienen
      entiteiten voor risico-acceptatie en verzekeraars de modellen van staten, bedoeld in bijlage D, gelijktijdig in met
      de kwartaalrapportages over het eerste kwartaal van 2013 die op grond van de in het vijfde lid genoemde richtlijn
      worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 131a.1
    text: |-
      Indien blijkt dat de rapportage zoals vastgesteld in [bijlage D][ref1] materiële afwijkingen bevat ten opzichte
      van de rapportage zoals die ingevolge de richtlijn nr. 2009/138/EG van het Europees Parlement en de Raad van
      de Europese Unie van 25 november 2009 betreffende de toegang tot en uitoefening van het verzekerings- en het
      herverzekeringsbedrijf (Solvabiliteit II) (herschikking) (PbEU L 335) zal worden vastgesteld, besluit Onze Minister
      dat de rapportage over het boekjaar 2011, bedoeld in [artikel 131, zesde lid][ref2], niet behoeft te worden
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel131
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131a
    references:
      - id: ref1
        bwb_id: BWBR0020420
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '131'
        hoofdstuk: '13'
        paragraaf: '13.2'
  - number: 131a.2
    text: |-
      Onze Minister stelt de modellen van staten, bedoeld in [bijlage D][ref1], voor het boekjaar 2012 zo spoedig
      mogelijk opnieuw vast indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131a
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 131a.2.a
    text: het eerste lid toepassing heeft gevonden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131a
  - number: 131a.2.b
    text: |-
      het eerste lid geen toepassing heeft gevonden en de staten die ingevolge de richtlijn, genoemd in het eerste lid,
      zullen worden vastgesteld materieel afwijken van de staten, bedoeld in bijlage D.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel131a
  - number: '132'
    text: |-
      Indien een beleggingsonderneming, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      verzekeraar of bijkantoor als bedoeld in [artikel 130][ref1] de staten niet langs elektronische weg verstrekt, kan
      de Nederlandsche Bank, op verzoek van de financiële onderneming, besluiten dat het de financiële onderneming is
      toegestaan andere informatiedragers dan de modellen, bedoeld in [artikel 131, eerste lid, onderdeel a][ref2], te
      gebruiken, indien deze wat betreft indeling en inhoud geen afwijking vertonen van de modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel131
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '131'
        hoofdstuk: '13'
        paragraaf: '13.2'
  - number: '133.1'
    text: |-
      Het onderzoek van de staten, bedoeld in [artikel 130][ref1], door de accountant, uitmondend in een verklaring
      omtrent de getrouwheid als bedoeld in [artikel 3:72, zevende lid, eerste volzin, van de wet][ref2], wordt een maal
      per jaar uitgevoerd. De Nederlandsche Bank stelt regels waarin wordt bepaald welke staten door de accountant in
      zijn onderzoek worden betrokken. De accountant waarmerkt deze staten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '133.2'
    text: |-
      Het onderzoek van het actuarieel verslag van een verzekeraar als bedoeld in [artikel 130, tweede lid][ref1], door
      de actuaris, uitmondend in een verklaring als bedoeld in [artikel 3:73 van de wet][ref2], wordt een maal per jaar
      uitgevoerd en omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 133.2.a
    text: |-
      de toets, bedoeld in [artikel 121, eerste lid, onderdeel a][ref1], voor zover het betreft verzekeringen met een
      contractduur van meer dan vier jaar waarbij gedurende de contractduur:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel121
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '121'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 133.2.a.1°
    text: de premie jaarlijks niet of slechts beperkt kan worden verhoogd; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel133
  - number: 133.2.a.2°
    text: de risico’s significant oplopen; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel133
  - number: 133.2.b
    text: |-
      de toets, bedoeld in [artikel 121, tweede lid][ref1], met inachtneming van de
      [artikelen 98, derde en vierde lid][ref2], en [121, derde en vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel121
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '121'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '98'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '121'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '134'
    text: |-
      Een entiteit voor risico-acceptatie of verzekeraar als bedoeld in [artikel 130, tweede lid][ref1], maakt de staten,
      bedoeld in dat lid, onderdeel a, vergezeld van de verklaring, bedoeld in [artikel 3:73 van de wet][ref2], jaarlijks
      binnen een termijn van zes maanden openbaar, voor zover het gaat om staten omvattende:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 134.a
    text: |-
      de jaarrekening, het jaarverslag en de overige gegevens en wat betreft indeling en inhoud in de vorm waarin deze
      zijn opgemaakt ingevolge [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] of de internationale jaarrekening
      standaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 134.b
    text: 'indien van toepassing: informatie over de winstdeling ten gunste van polishouders per productgroep; en'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel134
  - number: 134.c
    text: |-
      indien van toepassing: financiële informatie over de zorgverzekering, bedoeld in
      [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
  - number: '135.1'
    text: |-
      Een levensverzekeraar als bedoeld in [artikel 3:74, eerste lid][ref1], [3:78, eerste lid][ref2], of
      [3:83, eerste lid, van de wet][ref3], vermeldt bij de opgave van gesloten levensverzekeringen per branche de in het
      boekjaar geboekte premies, niet verminderd met het bedrag van de herverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '135.2'
    text: |-
      Een schadeverzekeraar als bedoeld in [artikel 3:74, eerste lid][ref1], [3:78, eerste lid][ref2], of
      [3:83, eerste lid, van de wet][ref3] vermeldt bij de opgave van gesloten schadeverzekeringen per branchegroep de in
      het boekjaar geboekte premies, schaden en provisies, telkens niet verminderd met het bedrag van de herverzekering.
      Deze gegevens alsmede de frequentie en de gemiddelde kosten van de schadegevallen, worden voor de branche
      Aansprakelijkheid motorrijtuigen evenwel afzonderlijk vermeld. De Nederlandsche Bank stelt de branchegroepen vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '135.3'
    text: |-
      Een natura-uitvaartverzekeraar als bedoeld in [artikel 3:87, eerste lid, van de wet][ref1], vermeldt bij de opgave
      van gesloten natura-uitvaartverzekeringen de in het boekjaar geboekte premies, niet verminderd met het bedrag van
      de herverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '135.4'
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:74, eerste lid][ref1], of [3:83, eerste lid, van de wet][ref2] vermeldt
      bij de in dat artikellid bedoelde opgave de gegevens, bedoeld in het eerste en tweede lid, per lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '135.5'
    text: |-
      De [artikelen 131, eerste lid, aanhef en onderdeel a][ref1], en [132][ref2] zijn van overeenkomstige toepassing op
      de verstrekking van de opgaven, bedoeld in het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel132
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '131'
        hoofdstuk: '13'
        paragraaf: '13.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '132'
        hoofdstuk: '13'
        paragraaf: '13.2'
  - number: '136.1'
    text: |-
      De door een accountant als bedoeld in [artikel 3:88, tweede lid][ref1], [3:90][ref2], [3:91][ref3] of
      [3:93 van de wet][ref4] te verstrekken gegevens zijn:


