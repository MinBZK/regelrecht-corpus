  - number: '53.2'
    text: |-
      De [artikelen 89][ref1], [95, vierde en vijfde lid][ref2], en [98, tweede en derde lid][ref3], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel89
