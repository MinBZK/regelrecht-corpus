  - number: '129'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      pensioenbewaarder, premiepensioeninstelling of verzekeraar als bedoeld in [artikel 3:71, eerste lid][ref1],
      [3:81, eerste lid][ref2], of [3:85, eerste of tweede lid, van de wet][ref3] verstrekt de documenten, bedoeld in
      [artikel 3:71, eerste lid][ref4], of [3:81, eerste lid, van de wet][ref5], wat betreft indeling en inhoud in de
      vorm waarin deze zijn opgemaakt ingevolge [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref6], de internationale
      jaarrekeningstandaarden onderscheidenlijk het recht van de staat waar deze financiële onderneming haar zetel
      heeft. Een financiële onderneming met zetel in Nederland vermeldt of de jaarrekening al dan niet is vastgesteld en
      goedgekeurd overeenkomstig de statuten of de vennootschapsakte.


