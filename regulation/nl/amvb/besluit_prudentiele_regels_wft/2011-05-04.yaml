    text: |-
      suppletiebijdragen die een onderlinge waarborgmaatschappij die het bedrijf van herverzekeraar die zijn bedrijf
      uitoefent in de activiteit schadeherverzekering, natura-uitvaartverzekeraar of schadeverzekeraar uitoefent, tijdens
      het boekjaar krachtens de statuten van haar leden kan eisen tot maximaal vijftig procent van het verschil tussen de
      maximumbijdragen en de werkelijk gevorderde bedragen; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel97
  - number: 97.1.c
    text: |-
      de helft van het geplaatste, niet-gestorte kapitaal of van het in aandelen verdeeld waarborgkapitaal indien van het
      geplaatste kapitaal minimaal 25 procent is gestort.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel97
  - number: '97.2'
    text: |-
      De Nederlandsche Bank stelt nadere regels met betrekking tot de voorwaarden waaronder de suppletiebijdragen,
      bedoeld in het eerste lid, onderdeel b, bij de berekening kunnen worden betrokken.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel97
  - number: '98.1'
    text: |-
