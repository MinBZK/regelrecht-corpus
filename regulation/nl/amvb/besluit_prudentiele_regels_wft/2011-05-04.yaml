    text: voldoen aan de op dat moment geldende regelgeving.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel141
  - number: '141.2'
    text: |-
      Indien de overeenkomst, bedoeld in het eerste lid, materieel wordt aangepast, is [hoofdstuk 5][ref1] vanaf dat
      moment van toepassing op de gehele overeenkomst.


