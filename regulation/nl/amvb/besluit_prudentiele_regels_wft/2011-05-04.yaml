        bwb_id: BWBR0020420
        artikel: '131'
        hoofdstuk: '13'
        paragraaf: '13.2'
  - number: 3a.1
    text: |-
      De [hoofdstukken 9][ref1] en [10][ref2] zijn niet van toepassing op betaalinstellingen:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
  - number: 3a.1.a
    text: |-
      voor zover zij uitsluitend in Nederland betaaldiensten verlenen als bedoeld onder 6 van de bijlage bij de richtlijn
      betaaldiensten;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel3a
  - number: 3a.1.b
    text: |-
      waarvan het gemiddelde van het totale bedrag van de betalingstransacties die zij de voorafgaande twaalf maanden
      hebben verricht, met inbegrip van die van agenten waarvoor zij volledig aansprakelijk zijn, niet hoger is dan €
      3.000.000 per maand; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel3a
  - number: 3a.1.c
    text: |-
      waarvan geen van de personen die het beleid bepalen of mede bepalen personen zijn met antecedenten als
      bedoeld in [artikel 6, onderdelen a, b en d][ref1], voor zover deze betrekking hebben op het witwassen van
      geld, terrorismefinanciering of vermogensmisdrijven of als misdrijf aangemerkte overtredingen van financiële
      toezichtswetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel6
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '6'
        hoofdstuk: '2'
  - number: 3a.2
    text: |-
      Een betaalinstelling als bedoeld in het eerste lid stelt de Nederlandsche Bank in kennis van elke verandering in
      zijn situatie die relevant is voor het naleven van de in het eerste lid gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel3a
  - number: 3a.3
    text: |-
      Indien een betaaldienstverlener zijn werkzaamheden niet gedurende de gehele periode van de voorafgaande twaalf
      maanden heeft verricht, kan voor de toepassing van het eerste lid, onderdeel b, worden uitgegaan van een programma
      van werkzaamheden waarin naar het oordeel van de Nederlandsche Bank een reële begroting van het totale bedrag aan
      betalingstransacties is opgenomen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel3a
  - number: '4.1'
    text: |-
      Berekeningen met betrekking tot het minimumbedrag aan eigen vermogen, de solvabiliteit en de liquiditeit
      op grond van de [hoofdstukken 9][ref1], [10][ref2] onderscheidenlijk [11][ref3] worden, voor zover
      niet anders is bepaald, gedaan op basis van de enkelvoudige jaarrekening zoals opgemaakt ingevolge
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref4] of de internationale jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk11
      [ref4]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0020420
        hoofdstuk: '11'
      - id: ref4
        bwb_id: BWBR0003045
  - number: '4.2'
    text: |-
      Berekeningen met betrekking tot de solvabiliteit van kredietinstellingen op grond van [hoofdstuk 10][ref1]
      en de liquiditeit van banken op grond van [hoofdstuk 11][ref2] worden, voor zover niet anders is
      bepaald, gedaan op basis van de geconsolideerde jaarrekening indien deze wordt opgemaakt ingevolge
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref3] of de internationale jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk11
      [ref3]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0003045
  - number: '5'
    text: |-
      De Nederlandsche Bank stelt vast of de betrouwbaarheid van een persoon als bedoeld in
      [artikel 3:9, eerste lid][ref1], [3:11][ref2], [3:13][ref3], [3:37, derde lid en vierde lid][ref4],
      [3:47, eerste en vijfde lid][ref5], [3:99, eerste lid][ref6], of [3:149 van de wet][ref7] buiten twijfel staat op
      basis van diens voornemens, handelingen en antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '6'
    text: |-
      De Nederlandsche Bank neemt bij de vaststelling, bedoeld in [artikel 5][ref1], in ieder geval in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '5'
        hoofdstuk: '2'
  - number: 6.a
    text: |-
      de in de [onderdelen 1 en 2 van Bijlage A][ref1] genoemde strafrechtelijke antecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 6.b
    text: |-
      de in [onderdeel 3 van Bijlage A][ref1] genoemde financiële antecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 6.c
    text: |-
      de in [onderdeel 4 van Bijlage A][ref1] genoemde toezichtantecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 6.d
    text: |-
      de in [onderdeel 5 van Bijlage A][ref1] genoemde fiscaal bestuursrechtelijke antecedenten; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 6.e
    text: |-
      de in [onderdeel 6 van Bijlage A][ref1] genoemde overige antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: '7.1'
    text: |-
      De Nederlandsche Bank verkrijgt inzicht in de in [artikel 5][ref1] bedoelde voornemens, handelingen en antecedenten
      op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '5'
        hoofdstuk: '2'
  - number: 7.1.a
    text: door betrokkene verstrekte gegevens en inlichtingen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: 7.1.b
    text: door de Landelijke Officier van Justitie verstrekte politiegegevens;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: 7.1.c
    text: |-
      gegevens uit de registratie, bedoeld in [artikel 1, onderdeel b, van de Wet documentatie vennootschappen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel1
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015049
        artikel: '1'
  - number: 7.1.d
    text: gegevens en inlichtingen, verkregen van de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: 7.1.e
    text: |-
      gegevens en inlichtingen, verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van Nederlandse of
      buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of op
      personen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: 7.1.f
    text: ambtsberichten van het Openbaar Ministerie;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: 7.1.g
    text: inlichtingen, verkregen van door betrokkene opgegeven referenties;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: 7.1.h
    text: gegevens uit openbare bronnen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: 7.1.i
    text: |-
      inlichtingen, verkregen van curatoren of bewindvoerders met betrekking tot faillissementen, surseances,
      schuldsaneringen, bewindvoeringen of noodregelingen waarbij de in [artikel 5][ref1] bedoelde persoon betrokken
      is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '5'
        hoofdstuk: '2'
  - number: 7.1.j
    text: inlichtingen, verkregen van organisaties van huidige of voormalige beroepsgenoten van betrokkene; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: 7.1.k
    text: gegevens en inlichtingen, verkregen uit andere bij ministeriële regeling aan te wijzen bronnen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: '7.2'
    text: |-
      Indien de gegevens of inlichtingen, verkregen overeenkomstig het eerste lid, de Nederlandsche Bank aanleiding geven
      tot nader onderzoek, kan de Nederlandsche Bank ook inlichtingen inwinnen en gegevens opvragen bij andere personen
      of instanties dan genoemd in dat lid. De Nederlandsche Bank stelt de betrokkene in dat geval vooraf schriftelijk in
      kennis van:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: 7.2.a
    text: de reden van het nadere onderzoek;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: 7.2.b
    text: de personen of instanties bij wie nadere gegevens of inlichtingen zullen worden ingewonnen; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: 7.2.c
    text: de aard van de nadere gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel7
  - number: '8.1'
    text: |-
      De betrouwbaarheid van een persoon als bedoeld in [artikel 5][ref1] staat niet buiten twijfel als deze veroordeeld
      is terzake van een misdrijf, genoemd in [onderdeel 1 van bijlage A][ref2], tenzij er sinds het onherroepelijk
      worden van de uitspraak acht jaren of meer zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020420
  - number: '8.2'
    text: |-
      De Nederlandsche Bank kan op grond van de omstandigheden of belangen, genoemd in [artikel 9][ref1], afwijken van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel9
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '9'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      De Nederlandsche Bank neemt bij de vaststelling, bedoeld in [artikel 5][ref1], in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '5'
        hoofdstuk: '2'
  - number: 9.a
    text: |-
      het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de overige
      omstandigheden van het geval;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel9
  - number: 9.b
    text: |-
      de belangen die de [wet][ref1] beoogt te beschermen; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 9.c
    text: |-
      de overige belangen van de clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling of verzekeraar en
      de betrokkene.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel9
  - number: '10.1'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 3:10, eerste lid][ref1],
      [3:11][ref2], [3:12][ref3], [3:13][ref4] of [3:14 van de wet][ref5] draagt zorg voor een systematische analyse van
      integriteitsrisico´s.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '10.2'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, draagt er zorg voor dat het beleid, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref1] zijn neerslag vindt in procedures en maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '10.3'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, stelt alle relevante bedrijfsonderdelen in kennis van
      het beleid en de procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel10
  - number: '10.4'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, draagt zorg voor de uitvoering en de systematische
      toetsing van het beleid en de procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel10
  - number: '10.5'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, draagt zorg voor onafhankelijk toezicht op de
      uitvoering van het beleid en de procedures en maatregelen met betrekking tot de integere uitoefening van het
      bedrijf en beschikt over procedures die erin voorzien dat gesignaleerde tekortkomingen of gebreken worden
      gerapporteerd aan de personen belast met de taak, bedoeld in [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel21
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '10.6'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, beschikt over procedures die erin voorzien dat
      gesignaleerde tekortkomingen of gebreken met betrekking tot de integere uitoefening van het bedrijf onder toezicht
      van de personen belast met de taak, bedoeld in [artikel 21][ref1], tot een gepaste bijstelling leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel21
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '11.1'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 3:17, eerste lid][ref1], [3:23][ref2],
      [3:24a][ref3], [3:24b][ref4], [3:26][ref5] of [3:27 van de wet][ref6] beschikt over procedures en maatregelen met
      betrekking tot het tegengaan van verstrengeling van privé-belangen van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 11.1.a
    text: personen die het beleid van de financiële onderneming bepalen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel11
  - number: 11.1.b
    text: groepsbestuurders;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel11
  - number: 11.1.c
    text: |-
      leden van het orgaan dat is belast met het toezicht op het beleid en de algemene gang van zaken van de financiële
      onderneming; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel11
  - number: 11.1.d
    text: |-
      andere werknemers of andere personen die in haar opdracht op structurele basis werkzaamheden voor haar verrichten,
      met haar belangen of die van haar cliënten.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel11
  - number: '11.2'
    text: |-
      De entiteit voor risico-acceptatie, kredietinstelling, premiepensioeninstelling of verzekeraar, onderscheidenlijk
      het bijkantoor, beschikt over procedures en maatregelen met betrekking tot het verlenen van financiële
      diensten op basis van personeelscondities aan personen die het beleid van de financiële onderneming bepalen en
      groepsbestuurders.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel11
  - number: '11.3'
    text: |-
      Financiële dienstverlening door de entiteit voor risico-acceptatie, kredietinstelling, premiepensioeninstelling
      of verzekeraar, onderscheidenlijk het bijkantoor, op basis van personeelscondities aan personen die het beleid van
      de financiële onderneming bepalen of groepsbestuurders vindt uitsluitend plaats in de normale uitoefening van het
      bedrijf en vindt telkens slechts plaats na instemming door het orgaan dat is belast met het toezicht op het beleid
      en de algemene gang van zaken van de financiële onderneming dan wel namens een daartoe aangewezen orgaan.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel11
  - number: '11.4'
    text: |-
      Financiële dienstverlening door de entiteit voor risico-acceptatie, kredietinstelling, premiepensioeninstelling of
      verzekeraar, onderscheidenlijk het bijkantoor, aan personen die het beleid van de financiële onderneming bepalen of
      groepsbestuurders vindt, indien de dienst buiten de grenzen van het bij de financiële onderneming bestaande systeem
      van personeelscondities wordt verleend, uitsluitend plaats in de normale uitoefening van het bedrijf en tegen de
      gebruikelijke commerciële voorwaarden en zekerheden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel11
  - number: '11.5'
    text: |-
      Financiële dienstverlening door de entiteit voor risico-acceptatie, kredietinstelling, premiepensioeninstelling
      of verzekeraar, onderscheidenlijk het bijkantoor, aan leden van het orgaan dat belast is met het toezicht op
      het beleid en de algemene gang van zaken van de financiële onderneming, alsmede aan familieleden, niet zijnde
      personeelsleden, van personen die het beleid van de financiële onderneming bepalen, van groepsbestuurders en van
      leden van het orgaan dat belast is met het toezicht op het beleid en de algemene gang van zaken van de financiële
      onderneming, geschiedt uitsluitend in de normale uitoefening van het bedrijf en tegen de gebruikelijke commerciële
      voorwaarden en zekerheden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel11
  - number: '12.1'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 11, eerste lid][ref1], beschikt over
      procedures en maatregelen met betrekking tot de omgang met en vastlegging van incidenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, neemt naar aanleiding van een incident maatregelen die
      zijn gericht op het beheersen van de opgetreden risico’s en het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel12
  - number: '12.3'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, informeert de Nederlandsche Bank onverwijld omtrent
      incidenten.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel12
  - number: '13.1'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 11, eerste lid][ref1], maakt een
      onderbouwde beoordeling van de betrouwbaarheid van personen die zij wil benoemen in een integriteitsgevoelige
      functie.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '13.2'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, draagt zorg voor de beoordeling van de betrouwbaarheid
      van degenen die, anders dan op grond van een arbeidsovereenkomst, werkzaamheden in een integriteitgevoelige functie
      verrichten.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel13
  - number: '14.1'
    text: |-
      Een kredietinstelling, levensverzekeraar, premiepensioeninstelling of bijkantoor als bedoeld in
      [artikel 11, eerste lid][ref1], beschikt met het oog op een integere uitoefening van het bedrijf over procedures en
      maatregelen met betrekking tot de acceptatie van cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '14.2'
    text: |-
      Onverminderd het bepaalde ingevolge de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1]
      beschikt een kredietinstelling, levensverzekeraar, premiepensioeninstelling of bijkantoor als bedoeld in het eerste
      lid, over procedures en maatregelen met betrekking tot het vaststellen van de identiteit van cliënten en van de
      verificatie daarvan. De kredietinstelling, levensverzekeraar, onderscheidenlijk het bijkantoor, accepteert een
      cliënt niet indien de identiteit niet is vastgesteld overeenkomstig het daarvoor opgestelde beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: '14.3'
    text: |-
      De financiële onderneming, bedoeld in het tweede lid, onderscheidenlijk het bijkantoor, beschikt met het oog op
      een integere uitoefeningvan het bedrijf over organisatorische en administratieve procedures en maatregelen die
      betrekking hebben op risicoclassificaties ten aanzien van cliënten, producten of diensten.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel14
  - number: '14.4'
    text: |-
      De financiële onderneming, bedoeld in het tweede lid, onderscheidenlijk het bijkantoor, beschikt over procedures
      en maatregelen met betrekking tot de analyse van gegevens van cliënten, mede in relatie tot de door de cliënt
      afgenomen producten of diensten, en terzake van de detectie van afwijkende transactiepatronen. Aan de hand van
      voornoemde procedures en maatregelen bepaalt de financiële onderneming tevens de risico’s van bepaalde cliënten,
      producten of diensten voor de integere uitoefening van haar bedrijf.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel14
  - number: '14.5'
    text: |-
      De financiële onderneming, bedoeld in het tweede lid, onderscheidenlijk het bijkantoor, draagt zorg voor de
      documentatie en vastlegging met betrekking tot de acceptatie en indeling naar risico van cliënten, de identificatie
      en verificatie van de gegevens van cliënten en de bewaking van het handelen van cliënten. Dergelijke gegevens
      worden tot vijf jaar na de dienstverlening of het beëindigen van de relatie bewaard.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel14
  - number: '14.6'
    text: |-
      De Nederlandsche Bank kan met het oog op een integere uitoefening van het bedrijf regels stellen met betrekking tot
      het door kredietinstellingen en bijkantoren van kredietinstellingen als bedoeld in het eerste lid te voeren beleid
      met betrekking tot afgeschermde rekeningen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel14
  - number: '15.1'
    text: |-
      Een kredietinstelling of bijkantoor van een kredietinstelling als bedoeld in [artikel 11, eerste lid][ref1],
      beschikt over procedures met betrekking tot de verstrekking van back-to-back leningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '15.2'
    text: |-
      Indien de kredietinstelling of het bijkantoor voornemens is een back-to-back lening te verstrekken, onderzoekt zij
      of het krediet voor legitieme doeleinden gebruikt zal worden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel15
  - number: '15.3'
    text: |-
      Indien er een back-to-back lening wordt verstrekt, legt de kredietinstelling of het bijkantoor de overeenkomst met
      vermelding van de gestelde essentiële zekerheden, deugdelijk vast.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel15
  - number: '16.1'
    text: |-
      Een financiële onderneming of bijkantoor als bedoeld in [artikel 11, eerste lid][ref1], onderzoekt, op verzoek van
      de Nederlandsche Bank, of in haar administratie bepaalde personen of instellingen voorkomen die naar het oordeel
      van Onze Minister, in verband met vermoede terroristische activiteiten of daarmee verband houdende activiteiten, de
      integriteit van de financiële sector kunnen schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '16.2'
    text: |-
      De financiële onderneming verstrekt de uitkomst van het in het eerste lid bedoelde onderzoek, binnen een door de
      Nederlandsche Bank te stellen termijn, aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel16
  - number: '17.1'
    text: |-
      De bedrijfsvoering van een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 3:17, eerste lid][ref1], [3:23][ref2],
      [3:24a][ref3], [3:24b][ref4], [3:26][ref5] of [3:27 van de wet][ref6] omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 17.1.a
    text: een duidelijke en adequate organisatiestructuur;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17
  - number: 17.1.b
    text: een duidelijke en adequate verdeling van taken, bevoegdheden en verantwoordelijkheden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17
  - number: 17.1.c
    text: een adequate vastlegging van rechten en verplichtingen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17
  - number: 17.1.d
    text: eenduidige rapportagelijnen; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17
  - number: 17.1.e
    text: een adequaat systeem van informatievoorziening en communicatie.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17
  - number: '17.2'
    text: |-
      De bedrijfsvoering is afgestemd op de aard, omvang, risico’s en complexiteit van de werkzaamheden van de financiële
      onderneming of bijkantoor.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17
  - number: '17.3'
    text: De bedrijfsvoering wordt op een inzichtelijke wijze vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17
  - number: '17.4'
    text: |-
      De effectiviteit van de organisatie-inrichting en van de procedures en maatregelen wordt ten minste jaarlijks
      op onafhankelijke wijze getoetst. Daartoe beschikt de financiële onderneming of het bijkantoor over een
      organisatieonderdeel dat deze interne controlefunctie uitoefent. De financiële onderneming of bijkantoor voorziet
      erin dat gesignaleerde tekortkomingen worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17
  - number: 17a
    text: |-
      Het organisatieonderdeel, bedoeld in [artikel 17, vierde lid][ref1], van een bank als bedoeld in
      [artikel 3:17, eerste lid][ref2], of [3:23, tweede lid, van de wet][ref3] die in Nederland beleggingsdiensten mag
      verlenen of beleggingsactiviteiten mag verrichten, heeft als taak:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 17a.a
    text: |-
      het vaststellen en uitvoeren van een controleplan om de deugdelijkheid en effectiviteit van de systemen, interne
      controleprocedures en regels van de bank te onderzoeken en te beoordelen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17a
  - number: 17a.b
    text: het doen van aanbevelingen op basis van de resultaten van de werkzaamheden, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17a
  - number: 17a.c
    text: het controleren of aan deze aanbevelingen gevolg wordt gegeven; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17a
  - number: 17a.d
    text: |-
      het ten minste jaarlijks rapporteren aan de personen die het dagelijks beleid van de bank bepalen en aan het
      orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de algemene gang van zaken van de bank
      inzake aangelegenheden met betrekking tot de interne controle en de genomen maatregelen in geval van gesignaleerde
      tekortkomingen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel17a
  - number: '18'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 17][ref1] beschikt over een adequate
      functiescheiding met het oog op een beheerste bedrijfsvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '19'
    text: |-
      De bedrijfsvoering van een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie,
      kredietinstelling, premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 17][ref1] voorziet
      in een juiste, tijdige en volledige vastlegging van alle rechten en verplichtingen van de financiële onderneming of
      bijkantoor in een daartoe bestemde administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '20.1'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 17][ref1] beschikt over een
      informatiesysteem dat een effectieve beheersing van de bedrijfsprocessen en de risico’s mogelijk maakt en dat
      voorziet in interne en externe informatiebehoeften.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '20.2'
    text: |-
      De financiële onderneming of bijkantoor beschikt over procedures en maatregelen om de integriteit, voortdurende
      beschikbaarheid en beveiliging van geautomatiseerde gegevensverwerking te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel20
  - number: '20.3'
    text: De functiescheidingen binnen de geautomatiseerde gegevensverwerking sluiten aan bij de organisatiestructuur.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel20
  - number: '21.1'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 17][ref1] beschikt over
      een organisatieonderdeel dat op onafhankelijke en effectieve wijze een compliancefunctie uitoefent. Het
      organisatieonderdeel heeft als taak het controleren van de naleving van wettelijke regels en van interne regels die
      de financiële onderneming of bijkantoor zelf heeft opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '21.2'
    text: |-
      Het organisatieonderdeel, bedoeld in het eerste lid, van een bank als bedoeld in [artikel 3:17, eerste lid][ref1],
      of [3:23, tweede lid, van de wet][ref2] die in Nederland beleggingsdiensten mag verlenen of beleggingsactiviteiten
      mag verrichten, heeft voorts als taak:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 21.2.a
    text: |-
      het adviseren van de personen die verantwoordelijk zijn voor het verlenen van beleggingsdiensten of het verrichten
      van beleggingsactiviteiten bij de naleving van wettelijke regels en interne regels;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel21
  - number: 21.2.b
    text: het toezien op de deugdelijkheid en effectiviteit van de interne regels en procedures;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel21
  - number: 21.2.c
    text: |-
      het beoordelen van de effectiviteit van de procedures die zijn opgesteld en maatregelen die zijn genomen om
      gesignaleerde onvolkomenheden bij de naleving van wettelijke regels en interne regels op te heffen; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel21
  - number: 21.2.d
    text: |-
      het ten minste jaarlijks rapporteren aan de personen die het dagelijks beleid van de bank bepalen en aan het
      orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de algemene gang van zaken van de bank inzake
      aangelegenheden met betrekking tot de naleving van wettelijke regels en interne regels. In de jaarlijkse rapportage
      wordt met name vermeld of maatregelen zijn genomen in het geval van gesignaleerde tekortkomingen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel21
  - number: '21.3'
    text: |-
      Het organisatieonderdeel van een bank als bedoeld in het tweede lid beschikt over de nodige autoriteit, middelen,
      deskundigheid en toegang tot alle noodzakelijke informatie om haar taken onafhankelijk en effectief te kunnen
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel21
  - number: '22'
    text: |-
      De opdracht tot onderzoek van de jaarrekening van een betaalinstelling, clearinginstelling, entiteit voor
      risico-acceptatie, kredietinstelling, premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in
      [artikel 17][ref1] aan de externe accountant voorziet in een toetsing en beoordeling op hoofdlijnen met betrekking
      tot de toereikendheid van de organisatie-inrichting en risicobeheersing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 22a
    text: |-
      De werknemers van een bank die een vergunning heeft als bedoeld in [artikel 2:11 van de wet][ref1] en in Nederland
      beleggingsdiensten mag verlenen of beleggingsactiviteiten mag verrichten en andere personen die door een dergelijke
      bank zijn belast met het verrichten van zodanige werkzaamheden beschikken over de nodige vakbekwaamheid en
      deskundigheid om de hun toevertrouwde verantwoordelijkheden uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: '23.1'
    text: |-
      Een beleggingsonderneming, betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie,
      kredietinstelling, verzekeraar of bijkantoor als bedoeld in [artikel 3:17, eerste en derde lid][ref1],
      [3:22][ref2], [3:23][ref3], [3:24a][ref4], [3:24b][ref5], [3:26][ref6] of [3:27 van de wet][ref7] voert beleid
      gericht op het beheersen van relevante risico’s.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '23.2'
    text: |-
      Onder relevante risico’s, bedoeld in het eerste lid, worden in het bijzonder verstaan het concentratierisico,
      krediet- en tegenpartijrisico, liquiditeitsrisico, marktrisico, operationeel risico, renterisico voortvloeiend uit
      niet-handelsactiviteiten, restrisico, securitisatierisico en verzekeringsrisico. Een bank, beleggingsonderneming
      of clearinginstelling als bedoeld in [artikel 3:17, eerste of derde lid][ref1], [3:22][ref2], [3:23][ref3] of
      [3:27 van de wet][ref4] houdt tevens rekening met de risico’s die voortvloeien uit de macro-economische omgeving
      waarin de onderneming actief is en die verband houden met de stand van de conjunctuurcyclus.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '23.3'
    text: |-
      Het beleid wordt vastgelegd in procedures en maatregelen ter beheersing van relevante risico’s en geïntegreerd in
      de bedrijfsprocessen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23
  - number: '23.4'
    text: |-
      De procedures en maatregelen, bedoeld in het derde lid, bestaan onder meer uit autorisatieprocedures,
      limietstellingen, limietbewaking en procedures en maatregelen voor noodsituaties en zijn afgestemd op de aard, de
      omvang, het risicoprofiel en de complexiteit van de werkzaamheden van de financiële onderneming of bijkantoor.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23
  - number: '23.5'
    text: |-
      De procedures en maatregelen, bedoeld in het derde lid, worden vastgelegd en ter kennis gebracht van alle relevante
      bedrijfsonderdelen van de financiële onderneming of het bijkantoor.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23
  - number: '23.6'
    text: |-
      De financiële onderneming heeft een onafhankelijke risicobeheerfunctie die op systematische wijze een onafhankelijk
      risicobeheer uitvoert dat gericht is op het identificeren, meten en evalueren van de risico’s waaraan de financiële
      onderneming of het bijkantoor is of kan worden blootgesteld. Het risicobeheer wordt zowel uitgevoerd ten aanzien
      van de financiële onderneming of het bijkantoor als geheel als ten aanzien van de onderscheiden bedrijfsonderdelen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23
  - number: 23a.1
    text: |-
      Een bank als bedoeld in [artikel 3:17, eerste lid][ref1], of [3:23 van de wet][ref2] legt de procedures voor de
      acceptatie, aanpassing, vernieuwing en herfinanciering van kredieten duidelijk vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 23a.2
    text: |-
      Voor de doorlopende administratie en bewaking van de verschillende portefeuilles en vorderingen waaraan een
      kredietrisico is verbonden, inclusief de detectie en het beheer van probleemkredieten, het verrichten van adequate
      waardeaanpassingen en de vorming van voorzieningen, wordt van doeltreffende systemen gebruik gemaakt.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23a
  - number: 23a.3
    text: |-
      De bank zorgt ervoor dat de spreiding van de kredietportefeuille aansluit bij de doelmarkten en bij de algemene
      kredietstrategie van de bank.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23a
  - number: 23b.1
    text: |-
      De procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref1], die zijn gericht op het liquiditeitsrisico
      hebben betrekking op het beheer van de actuele en toekomstige netto financiële positie en behoeften.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23b.2
    text: |-
      Door een bank, beleggingsonderneming of clearinginstelling als bedoeld in
      [artikel 23, tweede lid, tweede volzin][ref1], worden alternatieve scenario’s in overweging genomen en de
      hypothesen die aan beslissingen betreffende de netto financiële positie ten grondslag liggen, worden regelmatig aan
      een nieuw onderzoek onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23c.1
    text: |-
      De procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref1], die zijn gericht op het beheersen van het
      operationeel risico zijn eveneens gericht op zelden voorkomende, zeer ernstige gebeurtenissen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23c.2
    text: |-
      Een bank of beleggingsonderneming als bedoeld in [artikel 23, tweede lid, tweede volzin][ref1], geeft in aanvulling
      op hetgeen in dit besluit onder operationeel risico wordt verstaan, aan wat zij onder operationeel risico verstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23d
    text: |-
      Een bank of beleggingsonderneming als bedoeld in [artikel 23, tweede lid, tweede volzin][ref1], past systemen toe
      voor de beoordeling en het beheer van het risico dat uit potentiële veranderingen in rentetarieven voortvloeit,
      voor zover deze veranderingen van invloed zijn op de activiteiten buiten de handelsportefeuille van die bank,
      beleggingsonderneming of clearinginstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23e.1
    text: |-
      De procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref1], die betrekking hebben op het beheersen van
      het securitisatierisico zijn erop gericht dat bij het nemen van beslissingen op het gebied van risicobeoordeling en
      het risicobeheer rekening wordt gehouden met het economisch belang van de transactie.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23e.2
    text: |-
      Een bank of beleggingsonderneming als bedoeld in [artikel 23, tweede lid, tweede volzin][ref1], die initiator is
      van een securitisatie van revolverende vorderingen waarop een vervroegde- aflossingsbepaling van toepassing is,
      stelt een liquiditeitsplan vast om de gevolgen van zowel geplande als vervroegde aflossingen op te vangen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23f.1
    text: |-
      Het beleid als bedoeld in [artikel 23, eerste lid][ref1], of de procedures en maatregelen en de bedrijfsvoering
      als bedoeld in [artikel 26, tweede lid][ref2], houdt respectievelijk houden mede in dat de financiële onderneming
      een beleid inzake beloningen voert dat niet aanmoedigt tot het nemen van meer risico’s dan voor de desbetreffende
      financiële onderneming aanvaardbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel26
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23f
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23f.2
    text: |-
      De financiële onderneming legt het beleid inzake beloningen schriftelijk vast en draagt er zorg voor dit beleid
      te implementeren en in stand te houden. Het beleid is afgestemd op de omvang en organisatie van de financiële
      onderneming en aan de aard, omvang en complexiteit van haar bedrijf.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23f
  - number: 23f.3
    text: |-
      Het beleid inzake beloningen omschrijft de beloningscomponenten en beloningsstructuren die ertoe zouden kunnen
      bijdragen dat de financiële onderneming meer risico’s neemt dan voor haar aanvaardbaar is, alsmede de te volgen
      procedures en maatregelen die dergelijke beloningscomponenten en beloningsstructuren voorkomen en beheersen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23f
  - number: 23f.4
    text: De financiële onderneming maakt een beschrijving van haar beleid inzake beloningen openbaar.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23f
  - number: 23f.5
    text: 'De Nederlandsche Bank kan regels stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23f
  - number: 23f.5.a
    text: |-
      de wijze waarop het beleid inzake beloningen wordt opgesteld en vastgesteld of goedgekeurd, uitgevoerd, geëvalueerd
      en aangepast;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23f
  - number: 23f.5.b
    text: |-
      de wijze waarop vorm wordt gegeven aan beloningscomponenten en beloningsstructuren en de wijze waarop de risico's
      die uit het beleid en de uitvoering daarvan voortvloeien, worden beheerst; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23f
  - number: 23f.5.c
    text: de inhoud en de wijze van openbaarmaking van het beleid inzake beloningen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel23f
  - number: '24'
    text: |-
      Een beleggingsonderneming, betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie,
      kredietinstelling, verzekeraar of bijkantoor als bedoeld in [artikel 23, eerste lid][ref1], ziet er op
      systematische wijze op toe dat de procedures en maatregelen, bedoeld in [artikel 23, tweede lid][ref2], worden
      nageleefd en zorgt ervoor dat gesignaleerde tekortkomingen of gebreken worden opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24a.1
    text: |-
      Een bank of beleggingsonderneming als bedoeld in [artikel 23, tweede lid, tweede volzin][ref1], beschikt over
      solide, doeltreffende en alomvattende strategieën en procedures aan de hand waarvan zij doorlopend nagaat of en
      ervoor zorgt dat de hoogte, samenstelling en verdeling van haar eigen vermogen aansluiten op de omvang en de aard
      van haar huidige en mogelijk toekomstige risico’s.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24a.2
    text: |-
      De financiële onderneming ziet er op systematische wijze op toe dat de strategieën en procedures, bedoeld in het
      eerste lid, worden nageleefd en zorgt ervoor dat gesignaleerde tekortkomingen of gebreken worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel24a
  - number: 24b.1
    text: |-
      Het risicobeheer, bedoeld in [artikel 23, zesde lid][ref1], van een bank die in Nederland beleggingsdiensten
      mag verlenen of beleggingsactiviteiten mag verrichten, of beleggingsonderneming als bedoeld in
      [artikel 3:17, eerste en derde lid][ref2], [3:22][ref3] of [3:23, tweede lid, van de wet][ref4] oefent controle
      uit op:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 24b.1.a
    text: |-
      de deugdelijkheid en effectiviteit van de door de bank of beleggingsonderneming vastgestelde procedures en
      maatregelen, bedoeld in [artikel 23, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24b.1.b
    text: |-
      de mate waarin de bank of beleggingsonderneming en haar medewerkers de procedures en maatregelen, bedoeld in
      [artikel 23, derde lid][ref1], naleven; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24b.1.c
    text: |-
      de deugdelijkheid en effectiviteit van de maatregelen die zijn genomen om gesignaleerde tekortkomingen of gebreken
      op te heffen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel24b
  - number: 24b.2
    text: |-
      Het risicobeheer rapporteert ten minste jaarlijks aan personen die het dagelijks beleid van de bank of
      beleggingsonderneming bepalen en aan het orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de
      algemene gang van zaken van de bank of beleggingsonderneming. In de jaarlijkse rapportage wordt met name aangegeven
      of maatregelen zijn genomen in het geval van gesignaleerde onvolkomenheden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel24b
  - number: '25'
    text: |-
      Indien een beleggingsonderneming, betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie,
      kredietinstelling, verzekeraar of bijkantoor als bedoeld in [artikel 23, eerste lid][ref1], gebruik maakt van
      intern ontwikkelde modellen, beoordeelt deze die modellen en de gehanteerde veronderstellingen en variabelen op
      systematische wijze op validiteit, onder meer door voorspellingen van het model te vergelijken met de werkelijke
      uitkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 25a.1
    text: |-
      De door de Nederlandsche Bank uitgevoerde evaluatie, bedoeld in [artikel 3:18a, eerste lid, van de wet][ref1] heeft
      ten minste betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 25a.1.a
    text: |-
      de risico’s, bedoeld in [artikel 60, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 25a.1.b
    text: |-
      het renterisico dat een bank of beleggingsonderneming als bedoeld in [artikel 23, tweede lid, tweede volzin][ref1],
      bij niet-handelsactiviteiten loopt;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 25a.1.c
    text: |-
      de resultaten van de stresstests die zijn uitgevoerd door de financiële onderneming die voor het kredietrisico een
      interne modellenmethode toepast;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25a
  - number: 25a.1.d
    text: |-
      de blootstelling aan en het beheer van het concentratierisico, het liquiditeitsrisico en grote posities door de
      financiële onderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25a
  - number: 25a.1.e
    text: |-
      de deugdelijkheid, geschiktheid en wijze van toepassing van de door de financiële onderneming gevolgde
      procedures met het oog op het beheer van het restrisico dat de toepassing van toegelaten technieken van
      kredietrisicovermindering met zich brengt;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25a
  - number: 25a.1.f
    text: |-
      de vraag in hoeverre het toetsingsvermogen dat de financiële onderneming houdt met betrekking tot de activa die zij
      heeft gesecuritiseerd, toereikend is in het licht van de economische kenmerken van de transactie, inclusief de mate
      waarin sprake is van risico-overdracht;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25a
  - number: 25a.1.g
    text: |-
      de impact van de diversificatie-effecten en de wijze waarop dergelijke effecten in het systeem van risicometing
      worden verwerkt; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25a
  - number: 25a.1.h
    text: |-
      de resultaten van de stresstests die zijn uitgevoerd door de financiële onderneming die gebruik maakt
      van interne modellen voor de berekening van de vereiste solvabiliteit voor het risico, bedoeld in
      [artikel 60, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 25a.2
    text: |-
      De Nederlandsche Bank controleert of de financiële onderneming een securitisatie stilzwijgend buiten de grenzen
      van haar contractuele verplichtingen heeft gesteund. Indien blijkt dat de financiële onderneming meerdere keren
      buiten de grenzen van haar contractuele verplichtingen stilzwijgende steun heeft verleend, neemt de Nederlandsche
      Bank passende maatregelen op basis van het vermoeden dat de kans groot is dat de financiële onderneming ook in de
      toekomst haar securitisaties zal steunen buiten de grenzen van haar contractuele verplichtingen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25a
  - number: 25a.3
    text: |-
      De Nederlandsche Bank houdt bij het bepalen of het aangehouden toetsingsvermogen een beheerste en duurzame
      dekking van risico’s waarborgt, rekening met de vraag of de waardeaanpassingen en voorzieningen voor posities en
      portefeuilles in de handelsportefeuille de financiële onderneming in staat stellen haar posities onder normale
      marktomstandigheden op korte termijn te verkopen of af te dekken zonder dat wezenlijke verliezen worden geleden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25a
  - number: 25b.1
    text: |-
      De Nederlandsche Bank treft maatregelen indien de economische waarde van een bank of beleggingsonderneming als
      bedoeld in [artikel 23, tweede lid, tweede volzin][ref1], met meer dan twintig procent van het toetsingsvermogen
      afneemt door een plotselinge en onverwachte verandering in de rentetarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 25b.2
    text: De Nederlandsche Bank stelt de omvang van de verandering in de rentetarieven vast, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel25b
  - number: '26.1'
    text: |-
      Een beheerder, bewaarder of pensioenbewaarder als bedoeld in [artikel 3:17, derde lid][ref1], of
      [3:25 van de wet][ref2] beschikt over procedures en maatregelen die waarborgen dat de omvang en samenstelling van
      en mutaties in de aan te houden financiële waarborgen getrouw en volledig kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '26.2'
    text: |-
      Met het oog op de bewaking en beheersing van solvabiliteitsrisico’s voorziet de bedrijfsvoering van een beheerder
      van een instelling voor collectieve belegging in effecten in ieder geval in de bewaking en beheersing van de:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel26
  - number: 26.2.a
    text: aard en omvang van de activa en passiva;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel26
  - number: 26.2.b
    text: niet uit de balans blijkende verplichtingen; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel26
  - number: 26.2.c
    text: resultaatontwikkeling, uitgesplitst naar de onderscheiden bedrijfsactiviteiten en bedrijfsonderdelen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel26
  - number: '26.3'
    text: |-
      Met het oog op de bewaking en beheersing van liquiditeitsrisico’s voorziet de bedrijfsvoering van elke
      beleggingsinstelling waarvan de rechten van deelneming op verzoek van de deelnemers ten laste van de activa
      direct of indirect worden ingekocht of terugbetaald onder meer in autorisatieprocedures, limietstellingen,
      limietbewaking en procedures en maatregelen voor noodsituaties met betrekking tot de liquiditeitspositie van de
      beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel26
  - number: '26.0'
    text: |-
      Een premiepensioeninstelling beschikt over procedures en maatregelen die waarborgen dat de omvang en samenstelling
      van en mutaties in de aan te houden financiële waarborgen getrouw en volledig kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel26.0
  - number: 26a.1
    text: |-
      Een bank, beleggingsonderneming of financiële instelling die een verklaring van ondertoezichtstelling als bedoeld
      in [artikel 3:110][ref1] heeft, beschikt over procedures en maatregelen die waarborgen dat de voor de uitvoering
      van de vangnetregelingen noodzakelijke gegevens voortdurend actueel worden bijgehouden en adequaat zijn vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 26a.2
    text: |-
      De financiële onderneming verstrekt de gegevens, bedoeld in het eerste lid, binnen een door de Nederlandsche Bank
      te bepalen termijn, in een voor de Nederlandsche Bank toegankelijke vorm nadat de Nederlandsche Bank ten aanzien
      van haar heeft besloten tot toepassing van een vangnetregeling.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel26a
  - number: 26a.3
    text: |-
      De Nederlandsche Bank deelt het besluit tot toepassing van een vangnetregeling onverwijld mede aan de
      desbetreffende financiële onderneming.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel26a
  - number: '27.1'
    text: |-
      Een financiële onderneming of bijkantoor als bedoeld in [artikel 3:18, eerste lid][ref1], [3:22][ref2],
      [3:23][ref3], [3:24b][ref4], [3:25][ref5], [3:26][ref6] of [3:27, van de wet][ref7] gaat niet over tot het
      uitbesteden van werkzaamheden indien die uitbesteding een belemmering kan vormen voor een adequaat toezicht op
      de naleving van het bij of krachtens het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref8]
      bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref8
        bwb_id: BWBR0020368
  - number: '27.2'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 3:18, tweede lid][ref1], [3:23][ref2],
      [3:26][ref3] of [3:27 van de wet][ref4] besteedt de taken en werkzaamheden van personen die het dagelijks beleid
      bepalen, daaronder mede verstaan het vaststellen van het beleid en het afleggen van verantwoording over het
      gevoerde beleid, niet uit.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 27a
    text: |-
      Indien een betaalinstelling voornemens is werkzaamheden in verband met het verlenen van betaaldiensten uit te
      besteden, stelt zij de Nederlandsche Bank daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel27a
  - number: 27b
    text: |-
      Bij de uitbesteding van werkzaamheden in verband met het verlenen van betaaldiensten draagt de betaalinstelling er
      zorg voor dat uitbesteding de verplichtingen van de betaalinstelling jegens haar cliënten en de rechten van haar
      cliënten uit hoofde van de [wet][ref1] of [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref2] niet wijzigt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0005290
  - number: '28'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 27, tweede lid][ref1], gaat niet over
      tot het uitbesteden van werkzaamheden indien dat afbreuk doet aan de kwaliteit van haar onafhankelijke interne
      toetsing als bedoeld in [artikel 17, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '27'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '29'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 27, tweede lid][ref1], voert een
      adequaat beleid en beschikt over procedures en maatregelen met betrekking tot het op structurele basis uitbesteden
      van werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '27'
        hoofdstuk: '5'
  - number: '30'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 27, tweede lid][ref1], beschikt over
      toereikende procedures, maatregelen, deskundigheid en informatie om de uitvoering van de op structurele basis
      uitbestede werkzaamheden te kunnen beoordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '27'
        hoofdstuk: '5'
  - number: '31.1'
    text: |-
      Een betaalinstelling, clearinginstelling, entiteit voor risico-acceptatie, kredietinstelling,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 27, tweede lid][ref1], legt de
      overeenkomst met de derde waaraan de werkzaamheden op structurele basis worden uitbesteed schriftelijk vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '27'
        hoofdstuk: '5'
  - number: '31.2'
    text: 'In de overeenkomst wordt in ieder geval het volgende geregeld:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel31
  - number: 31.2.a
    text: |-
      de onderlinge informatie-uitwisseling, met inbegrip van afspraken over het beschikbaar stellen van informatie
      waarom de toezichthouders ter uitvoering van hun wettelijke taak verzoeken;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel31
  - number: 31.2.b
    text: |-
      de mogelijkheid voor de financiële onderneming of het bijkantoor om te allen tijde wijzigingen aan te brengen in de
      wijze waarop de uitvoering van de werkzaamheden door de derde geschiedt;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel31
  - number: 31.2.c
    text: |-
      de verplichting voor de derde om de financiële onderneming of het bijkantoor in staat te stellen blijvend te
      voldoen aan het bij of krachtens de wet bepaalde; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel31
  - number: 31.2.d
    text: de mogelijkheid voor de toezichthouders om onderzoek ter plaatse te doen of te laten doen bij de derde; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel31
  - number: 31.2.e
    text: |-
      de wijze waarop de overeenkomst wordt beëindigd, en de wijze waarop wordt gewaarborgd dat de financiële onderneming
      of het bijkantoor de werkzaamheden na beëindiging van de overeenkomst weer zelf kan uitvoeren of door een andere
      derde kan laten uitvoeren.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel31
  - number: '31.3'
    text: |-
      De toezichthouders maken slechts gebruik van de mogelijkheid, bedoeld in het tweede lid, onderdeel d, indien niet
      op andere wijze kan worden vastgesteld dat ten aanzien van de uitbestede werkzaamheden wordt voldaan aan het bij of
      krachtens de wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel31
  - number: '32'
    text: |-
      De [artikelen 29 tot en met 31][ref1] zijn niet van toepassing op het uitbesteden van werkzaamheden aan
      ondernemingen met zetel in een lidstaat die deel uitmaken van de groep waartoe de financiële onderneming behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel29
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '29'
        hoofdstuk: '5'
  - number: 32a.1
    text: |-
      Dit hoofdstuk is, met uitzondering van [artikel 27a][ref1], slechts van toepassing op het uitbesteden van
      werkzaamheden door betaalinstellingen voor zover het belangrijke werkzaamheden betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27a
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 27a
        hoofdstuk: '5'
  - number: 32a.2
    text: |-
      Een werkzaamheid wordt als belangrijk aangemerkt indien een gebrekkige of tekortschietende uitvoering
      ervan wezenlijk afbreuk zou doen aan de naleving door de betaalinstelling van de vergunningsvereisten,
      als bedoeld in [artikel 2:3b van de wet][ref1], of van andere verplichtingen ingevolge de [wet][ref2] of
      [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref3], dan wel aan haar financiële resultaten of de soliditeit of
      continuïteit van haar betaaldiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368
      [ref3]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
      - id: ref3
        bwb_id: BWBR0005290
  - number: 32b.1
    text: |-
      Een betaalinstelling geeft onverwijld schriftelijk aan de Nederlandsche Bank kennis van een wijziging in de
      ingevolge [artikel 2:3b, tweede lid, van de wet][ref1] verstrekte gegevens met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 32b.1.a
    text: de activiteiten die de betaaldienstverlener voornemens is te verrichten;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel32b
  - number: 32b.1.b
    text: |-
      het bedrijfsplan waarmee wordt aangetoond dat de betaaldienstverlener in staat is gebruik te maken van passende en
      evenredige systemen, middelen en procedures om op een gezonde basis te opereren;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel32b
  - number: 32b.1.c
    text: |-
