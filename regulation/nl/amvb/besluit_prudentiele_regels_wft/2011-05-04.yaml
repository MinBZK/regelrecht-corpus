  - number: '3'
    text: |-
      [Hoofdstuk 10][ref1] is niet van toepassing op beleggingsondernemingen die uitsluitend een
      beleggingsdienst als bedoeld in onderdeel a of d van de definitie van verlenen van een beleggingsdienst
      in [artikel 1:1 van de wet][ref2] verlenen. In afwijking van [artikel 130][ref3] verstrekt een
      beleggingsonderneming als bedoeld in de vorige volzin slechts staten ten behoeve van het toezicht op de naleving
      van de regels met betrekking tot het minimum vermogen ingevolge de [artikelen 3:53, eerste lid][ref4], en
      [3:54, eerste lid, van de wet][ref5]. De [artikelen 131 tot en met 133][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel130
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020420#Artikel131
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
