        artikel: '90'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '94'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: '140.2'
    text: |-
      Een verklaring van geen bezwaar betreffende een gekwalificeerde deelneming als bedoeld in
      [artikel 3:96, eerste lid, onderdeel c, van de wet][ref1] wordt, onverminderd het eerste lid, verleend, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 140.2.a
    text: |-
      de gekwalificeerde deelneming wordt verworven en gehouden in het kader van een schuldsanering of reddingsoperatie
      bij de betrokken onderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140
  - number: 140.2.b
    text: de gekwalificeerde deelneming wordt verworven en gehouden in het kader van een overgenomen emissie van aandelen; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140
  - number: 140.2.c
    text: |-
      de gekwalificeerde deelneming wordt verworven en tijdelijk gehouden in het kader van een stallingaffaire op eigen
      naam van de bank maar voor rekening van derden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140
  - number: '140.3'
    text: |-
      Een verklaring van geen bezwaar voor een gekwalificeerde deelneming als bedoeld in het tweede lid wordt voor
      bepaalde tijd verleend; de gekwalificeerde deelnemingwordt niet betrokken in de berekening op grond van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140
  - number: 140a
    text: |-
      De gegevens, bedoeld in [artikel 3:111b, eerste lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 140a.a
    text: een opgave van de naam, het adres, het telefoon- en faxnummer en emailadres van de betaaldienstagent;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140a
  - number: 140a.b
    text: |-
      een beschrijving van de interne controlemechanismen die door de betaaldienstagent zullen worden gebruikt om de in
      de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] neergelegde verplichtingen na te komen;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140a
    references:
