      [artikelen 6 tot en met 9][ref1], redelijkerwijs kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:9, van de wet][ref2] wordt bepaald met betrekking tot de betrouwbaarheid van de betrokkene.


