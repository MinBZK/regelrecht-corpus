      de [artikelen 95, tweede lid][ref4], [96][ref5] en [97][ref6], verminderd met de waarde van de posten, bedoeld in
      [artikel 95, derde lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel95
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Artikel96
