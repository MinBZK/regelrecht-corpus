      [artikel 3:29, eerste lid, van de wet][ref1], met zetel in Nederland die haar bedrijf uitoefent vanuit een in een
      andere lidstaat gelegen bijkantoor geeft schriftelijk aan de Nederlandsche Bank en de toezichthoudende instantie
      van die lidstaat kennis van een wijziging met betrekking tot de toepasselijkheid van een depositogarantiestelsel op
      het bijkantoor.


