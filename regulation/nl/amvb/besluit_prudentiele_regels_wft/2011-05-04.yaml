      wijziging van het door Eurostat bekendgemaakte Europese indexcijfer van de consumptieprijzen aangepaste bedragen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel49
  - number: '49.5'
    text: |-
