        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 96.c
    text: |-
      het gestorte deel op schuldtitels met onbepaalde looptijd en andere financieringsinstrumenten indien aan de
      voorwaarden, bedoeld in [artikel 92, tweede lid, onderdeel b, onder 1° tot en met 4°][ref1], is voldaan.


