        artikel: '3'
  - number: 138.1°
    text: |-
      een opgave van de omvang van een gekwalificeerde deelneming als bedoeld in [artikel 3:95 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 138.2°
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:99 van de wet][ref1] is bepaald met betrekking tot de betrouwbaarheid van de aanvrager of houder van
      een verklaring van geen bezwaar die op grond van zijn gekwalificeerde deelneming het beleid van de betrokken
      onderneming zou kunnen bepalen of mede bepalen of zou bepalen of mede bepalen; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 138.3°
    text: |-
      bescheiden waaruit de financiële positie en de juridische groepsstructuur van de aanvrager of houder van een
      verklaring van geen bezwaar blijken.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel138
  - number: '139'
    text: |-
      Tot de liquide middelen van een vennootschap als bedoeld in [artikel 3:96, derde lid, van de wet][ref1] worden
      uitsluitend gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel139
    references:
