      Nederlandsche Bank en de toezichthoudende instantie van die lidstaat van het voornemen de uitoefening van haar
      bedrijf vanuit het in de andere lidstaat gelegen bijkantoor te staken. De clearinginstelling of kredietinstelling
      geeft geen uitvoering aan het voornemen gedurende de eerste vier weken na de kennisgeving.


