articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: *back-to-back lening:* kredietinstrument waarbij de kredietnemer geld of
      financiële instrumenten ter beschikking krijgt, waartegenover de kredietverstrekker een zekerheid ontvangt,
      direct of indirect, uit eigen liquide middelen van de kredietnemer; *business line*: afgezonderde categorie
      activiteiten, bedoeld in bijlage X, deel 2, tabel 2, van de herziene richtlijn banken; *convertibele valuta’s:*
      valuta’s van: a. de staten die deel uitmaken van de G10; b. de overige staten die deel uitmaken van de Europese
      Economische Ruimte; of c. Australië of Nieuw-Zeeland; *daggeld:* kortlopende vorderingen die dagelijks opvraagbaar
      zijn en die uiterlijk twee werkdagen na opvraging dan wel opzegging moeten worden terugbetaald; *entiteit voor
      securitisatiedoeleinden*: onderneming: a. die geen kredietinstelling is; b. die is opgericht ten behoeve van een
      of meer securitisaties; c. wier activiteiten zich beperken tot hetgeen noodzakelijk is voor die securitisaties;
      d. wier oprichting dient om haar verplichtingen te scheiden van de verplichtingen van de initiator; en e. wier
      eigenaars hun deelneming onvoorwaardelijk in pand kunnen geven of kunnen verkopen; *gedekte obligatie:* obligatie
      ten aanzien waarvan wordt voldaan aan de volgende criteria: a. de obligatie is of wordt uitgegeven door een bank
      met zetel in Nederland; b. de obligatie is gedekt door activa die, indien de uitgevende bank in gebreke blijft,
      bij voorrang aangewend worden voor de aflossing van de hoofdsom en de betaling van rente op de obligatie; c. de
      activa zijn ten behoeve van de obligatiehouders veiliggesteld: 1°. door overgang onder algemene of bijzondere
      titel naar een rechtspersoon die uitsluitend tot doel heeft het in onderdeel b genoemde te bewerkstelligen en
      door vestiging van een pandrecht of een met pandrecht vergelijkbaar zekerheidsrecht naar buitenlands recht ten
      behoeve van een andere, zodanige rechtspersoon; of 2°. op een andere, bij ministeriële regeling vast te stellen
      wijze; d. de activa bieden gedurende de looptijd van de obligatie voldoende dekking voor de aflossing van de
      hoofdsom en betaling van rente op de obligatie, alsmede voor betalingen inzake het beheer en de administratie
      van de activa; e. op de activa is het recht van toepassing van een lidstaat, de Verenigde Staten van Amerika,
      Canada, Japan, de Republiek Korea, Hong Kong, Singapore, Australië, Nieuw-Zeeland of Zwitserland; en f. de
      uitgevende bank heeft geen aandelenbelang in de rechtspersonen, bedoeld onder c, onder 1º, oefent daarin geen
      beleidsbepalende zeggenschap uit en is ook niet op andere wijze gerechtigd tot een eigendomsbelang in die
      rechtspersonen. *geregistreerde gedekte obligatie:* obligatie, behorend tot een categorie die: a. is opgenomen
      op een lijst waarvan de gegevens door de Commissie van de Europese Gemeenschappen op grond van artikel 22, vierde
      lid, van de richtlijn beleggingsinstellingen ter beschikking zijn gesteld aan het publiek, of b. is geregistreerd
      overeenkomstig [artikel 124b][ref1]; *groepsbestuurder:* ieder die binnen een groep het beleid bepaalt; *groep
      van verbonden wederpartijen:* ten minste twee personen die uit een oogpunt van de te lopen risico’s als een geheel
      moeten worden beschouwd omdat zij: a. met elkaar zijn verbonden in een formele of feitelijke zeggenschapsstructuur;
      of b. zodanig onderling verbonden zijn dat, indien een van hen financiële problemen zou ondervinden, in elk geval
      een van de anderen waarschijnlijk in betalingsproblemen zou komen; *grote posities:* niet naar risico gewogen
      activa en posten buiten de balanstelling ten aanzien van een wederpartij of groep van verbonden wederpartijen
      waarvan de waarde ten minste tien procent van het toetsingsvermogen bedraagt, uitgezonderd: a. de activa en
      posten buiten de balanstelling die een financiële onderneming in mindering brengt op haar toetsingsvermogen;
      b. de niet naar risico gewogen activa en posten buiten de balanstelling die worden aangehouden in het kader
      van de normale afwikkeling van: 1°. valutatransacties binnen 48 uur nadat de betaling heeft plaatsgevonden; 2°.
      effectentransacties binnen vijf werkdagen nadat de betaling heeft plaatsgevonden of nadat de effecten geleverd
      zijn indien deze levering eerder plaatsvindt; *ondernemingsgebonden herverzekeraar:* herverzekeraar waarvan alle
      aandelen worden gehouden door een financiële onderneming die geen verzekeraar is of door een onderneming die geen
      financiële onderneming is, of die deel uitmaakt van een groep die geen verzekeringsgroep is als bedoeld in de
      [afdelingen 3.6.1.][ref2] en [3.6.3. van de wet][ref3], en die uitsluitend risico’s in herverzekering neemt van
      de eerdergenoemde financiële onderneming onderscheidenlijk onderneming of van de ondernemingen die deel uitmaken
      van de groep waarvan hij deel uitmaakt; *incident:* gedraging of gebeurtenis die een ernstig gevaar vormt voor
      de integere uitoefening van het bedrijf van de desbetreffende financiële onderneming; *initiator*: onderneming
      die: a. zelf of via een andere onderneming rechtstreeks of middellijk partij is geweest bij de oorspronkelijke
      overeenkomst waarmee de verplichtingen of mogelijke verplichtingen van de debiteur of mogelijke debiteur die
      worden gesecuritiseerd, zijn ontstaan; of b. vorderingen van een derde koopt, in haar balans opneemt en vervolgens
      securitiseert; *integriteitgevoelige functie:* a. leidinggevende functie direct onder die van de personen die het
      beleid van een financiële onderneming bepalen of mede bepalen; of b. functie waaraan een bevoegdheid is verbonden
      die een wezenlijk risico inhoudt voor de integere uitoefening van het bedrijf van een financiële onderneming;
      *integriteitsrisico:* gevaar voor aantasting van de reputatie of bestaande of toekomstige bedreiging van
      vermogen of resultaat van een financiële onderneming als gevolg van een ontoereikende naleving van hetgeen bij of
      krachtens enig wettelijk voorschrift is voorgeschreven; *internationale jaarrekeningstandaarden:* internationale
      standaarden voor jaarrekeningen die door de Commissie van de Europese Gemeenschappen van toepassing zijn verklaard
      overeenkomstig artikel 3 van [verordening (EG) nr. 1606/2002](32002R1606) van het Europees Parlement en de Raad
      van de Europese Unie van 19 juli 2002 (PbEG L 243); *interne modellenmethode*: methode waarbij de som van de naar
      risico gewogen activa en posten buiten de balanstelling voor de kredietrisico’s van een financiële onderneming
      wordt bepaald op basis van een intern model; *kalenderpost:* actiefpost of passiefpost waarvan de kasinstromen
      respectievelijk kasuitstromen als gevolg van aflossing of rentebetalingen in de vervalkalender worden opgenomen;
      *kans op wanbetaling*: kans dat een wederpartij over een periode van een jaar in gebreke blijft; *kasstromen van
      het kernbedrijf:* kasstromen van leningen die met een vaste termijn zijn verstrekt aan tegenpartijen, die geen
      kantoren en bancaire deelnemingen zijn die niet in de rapportage worden betrokken, die geen kredietinstellingen
      en geen professionele geldmarktpartijen zijn, en van deze tegenpartijen met een vaste termijn opgenomen gelden,
      met inbegrip van te ontvangen onderscheidenlijk te betalen rente; *kredietbeoordeling*: taxatie van de kans op
      wanbetaling en de mate van wanbetaling door een bepaalde debiteur op al zijn verplichtingen of een deel van zijn
      verplichtingen; *kredietbeoordelingsbureau*: bureau dat kredietbeoordelingen opstelt; *kredietrisicovermindering*:
      techniek ter beperking van het kredietrisico dat verbonden is aan activa en posten buiten de balanstelling;
      *kredietverbetering*: contractuele regeling die de kans op wanbetaling en de mate van wanbetaling van een
      securitisatiepositie vermindert ten opzichte van de situatie waarin van die regeling geen sprake zou zijn;
      *leningverstrekkende financiële onderneming*: financiële onderneming die een vordering heeft, ongeacht of daaraan
      een lening ten grondslag ligt; *maandperiode:* eerste kalendermaand volgend op de verslagdatum; *niet-volgestorte
      kredietprotectie*: kredietrisicovermindering waarbij het kredietrisico met betrekking tot een vordering van een
      financiële onderneming wordt beperkt door de garantie van een derde partij om een bepaald bedrag uit te keren
      bij wanbetaling van de wederpartij of bij andere in de overeenkomst tot kredietprotectie vermelde gebeurtenissen
      die betaling onder de overeenkomst of afwikkeling van de overeenkomst tot gevolg hebben; *officiële stand-by
      faciliteiten:* liquiditeitsgarantie die, onder door de Nederlandsche Bank te stellen voorwaarden, is ontvangen
      van onderscheidenlijk afgegeven door een binnenlandse of buitenlandse bank; *omgekeerde retrocessieovereenkomst*:
      overeenkomst waarbij een wederpartij aan een financiële onderneming effecten, grondstoffen of gegarandeerde rechten
      betreffende de eigendom van effecten of grondstoffen verkoopt, onder de ontbindende voorwaarde deze of vervangende
      effecten of grondstoffen tegen een vastgestelde prijs op een door de wederpartij te bepalen tijdstip in de toekomst
      terug te kopen, indien: a. in geval van gegarandeerde rechten, de garantie is verstrekt door een gereglementeerde
      markt die houder is van de rechten; en b. de overeenkomst bepaalt dat het de financiële onderneming niet is
      toegestaan een bepaald effect of een bepaalde grondstof aan meer dan een wederpartij tegelijkertijd over te
      dragen of toe te zeggen; *omrekeningsfactor*: verhouding tussen het op een bepaald moment onbenutte bedrag van
      een kredietlijn dat naar verwachting opgenomen wordt en openstaat in geval van wanbetaling en het onbenutte bedrag
      van die kredietlijn, waarbij de omvang van de kredietlijn wordt bepaald door de toegestane limiet, tenzij de niet-
      toegestane limiet hoger is; *operationeel risico*: risico van verliezen als gevolg van tekortschietende of falende
      interne procedures en systemen of als gevolg van externe gebeurtenissen, met inbegrip van juridische risico’s;
      *opgenomen effectenlening*: overeenkomst waarbij een wederpartij aan een financiële onderneming effecten uitleent
      tegen zekerheid, onder de ontbindende voorwaarde dat de financiële onderneming op een tijdstip in de toekomst
      of zodra de wederpartij daarom verzoekt, gelijkwaardige effecten teruglevert; *opgenomen grondstoffenlening*:
      overeenkomst waarbij een wederpartij aan een financiële onderneming grondstoffen uitleent tegen zekerheid, onder
      de ontbindende voorwaarde dat de financiële onderneming op een tijdstip in de toekomst of zodra de wederpartij
      daarom verzoekt, gelijkwaardige grondstoffen teruglevert; *professionele geldmarktpartij:* persoon die geen
      bank is en die in het kader van zijn middelenbeheer transacties verricht op de geldmarkt met bij de geldmarkt
      passende volumes en op die markt met enige regelmaat opereert op een manier die vergelijkbaar is met die van een
      bank; *retrocessie:* overeenkomst waarbij een verzekeraar een gedeelte van het door hem herverzekerde risico,
      tegen betaling van herverzekeringspremie, overdraagt aan een andere verzekeraar; *retrocessieovereenkomst*:
      overeenkomst waarbij een financiële onderneming aan een wederpartij effecten, grondstoffen of gegarandeerde
      rechten betreffende de eigendom van effecten of grondstoffen verkoopt, onder de ontbindende voorwaarde deze
      of vervangende effecten of grondstoffen tegen een vastgestelde prijs op een door de financiële onderneming te
      bepalen tijdstip in de toekomst terug te kopen, indien: a. in geval van gegarandeerde rechten, de garantie is
      verstrekt door een gereglementeerde markt die houder is van de rechten; en b. de overeenkomst bepaalt dat het de
      financiële onderneming niet toegestaan is een bepaald effect of een bepaalde grondstof aan meer dan een wederpartij
      tegelijkertijd over te dragen of toe te zeggen; *revolverende vordering*: vordering waarbij de wederpartij het
      openstaande bedrag mag laten variëren tot een van tevoren afgesproken limiet; *risicomeetsysteem*: systeem voor de
      meting van het operationeel risico; *securitisatie*: transactie of regeling waarbij: a. het kredietrisico van een
      vordering of verzameling van vorderingen wordt onderverdeeld in ten minste twee tranches; b. de in het kader van
      de transactie of regeling verrichte betalingen afhangen van de prestatie van de vordering of de verzameling van
      vorderingen; en c. de rangorde van de tranches bepalend is voor de verdeling van de verliezen tijdens de looptijd
      van de transactie of regeling; *securitisatiepositie*: vordering in het kader van een securitisatie; *sponsor*:
      onderneming, niet zijnde een initiator, die securitisatieregelingen waarbij vorderingen van derden worden gekocht,
      opzet en beheert; *stresstest*: onderzoek naar de risico’s die ontstaan als zich veranderingen in de marktsituatie
      voordoen of zouden voordoen die een ongunstige invloed uitoefenen op de toereikendheid van het toetsingsvermogen
      van een financiële onderneming, en naar de risico’s die ontstaan als zekerheidsrechten worden uitgeoefend in
      crisissituaties; *suppletiebijdragen:* bedragen die het bestuur van een onderlinge waarborgmaatschappij krachtens
      haar statuten in verband met een nadelig saldo over enig boekjaar te allen tijde en zonder bijkomende voorwaarden
      van haar leden kan eisen; *synthetische securitisatie*: securitisatie waarbij: a. de onderverdeling in tranches van
      het kredietrisico van een vordering of verzameling van vorderingen geschiedt door middel van kredietderivaten of
      garanties; en b. de vordering of verzameling van vorderingen in de balanstelling van de initiator blijft opgenomen;
      *tegenpartijkredietrisico*: risico dat de wederpartij bij een transactie in gebreke blijft voordat de definitieve
      afwikkeling van de met de transactie samenhangende kasstromen heeft plaatsgevonden; *traditionele securitisatie*:
      securitisatie waarbij: a. de gesecuritiseerde vorderingen in economische zin worden overgedragen aan een entiteit
      voor securitisatiedoeleinden die daartoe effecten uitgeeft; b. de eigendom van de gesecuritiseerde vorderingen
      door de initiator wordt overgedragen of de kasstromen uit hoofde van de gesecuritiseerde vorderingen door middel
      van een overeenkomst van subdeelneming door de initiator worden overgedragen; en c. de uitgegeven effecten niet
      leiden tot een betalingsverplichting voor de initiator; *tranche*: contractueel vastgesteld segment van het
      kredietrisico van een gesecuritiseerde vordering of verzameling van vorderingen, waarbij een securitisatiepositie
      in dit segment een groter of kleiner risico op verlies meebrengt dan een securitisatiepositie van dezelfde omvang
      in elk ander segment, indien geen rekening wordt gehouden met de volgestorte of niet-volgestorte kredietprotectie
      die door derden rechtstreeks aan de houders van de securitisatieposities in dit segment of in andere segmenten
      wordt geboden; *verlies bij wanbetaling*: verhouding tussen het verwachte economisch verlies op een vordering als
      gevolg van wanbetaling, met inachtneming van de tijdwaarde van geld, en het naar verwachting uitstaande bedrag
      bij wanbetaling; *verslagdatum:* datum van de dag direct voorafgaande aan de periode waarover wordt gerapporteerd;
      *verstrekte effectenlening*: overeenkomst waarbij een financiële onderneming aan een wederpartij effecten uitleent
      tegen zekerheid, onder de ontbindende voorwaarde dat de wederpartij op een tijdstip in de toekomst of zodra de
      financiële onderneming daarom verzoekt, gelijkwaardige effecten teruglevert; *verstrekte grondstoffenlening*:
      overeenkomst waarbij een financiële onderneming aan een wederpartij grondstoffen uitleent tegen zekerheid, onder
      de ontbindende voorwaarde dat de wederpartij op een tijdstip in de toekomst of zodra de financiële onderneming
      daarom verzoekt, gelijkwaardige grondstoffen teruglevert; *vervalkalender:* overzicht van contractuele looptijden
      van overeenkomsten gesloten door een financiële onderneming; *vervroegde-aflossingsbepaling*: contractuele bepaling
      op grond waarvan de securitisatieposities van beleggers voor de oorspronkelijke vervaldatum van de uitgegeven
      effecten geheel of gedeeltelijk worden afgelost; *verwachte verliespost*: product van de kans op wanbetaling,
      het verlies bij wanbetaling en de waarde van een actief of post buiten de balanstelling; *verwateringsrisico*:
      risico dat de waarde van een kortlopende handelsvordering afneemt door crediteringen aan de debiteur; *volgestorte
      kredietprotectie*: kredietrisicovermindering waarbij het kredietrisico met betrekking tot een vordering van
      een financiële onderneming wordt beperkt door het recht van die financiële onderneming om bij wanbetaling van
      de wederpartij of bij andere specifieke gebeurtenissen in verband met de wederpartij die gevolgen hebben of
      kunnen hebben voor het kredietrisico met betrekking tot de vordering: a. bepaalde activa of posten buiten de
      balanstelling te gelde te maken; b. bepaalde activa of posten buiten de balanstelling over te nemen; c. de eigendom
      van bepaalde activa of posten buiten de balanstelling te verwerven of te behouden; d. de waarde van bepaalde
      activa of posten buiten de balanstelling te verlagen; of e. de waarde van bepaalde activa of posten buiten de
      balanstelling te vervangen door het verschil tussen deze waarde en de waarde van een vordering op de financiële
      onderneming; *voorraadposten:* liquide activa die niet in de vervalkalender worden opgenomen; *vorderingswaarde:*
      waarde van een niet naar risico gewogen actief of post buiten de balanstelling; *waarde van de gekwalificeerde
      deelneming:* koopprijs van een aandeel, op het moment van de verwerving of vergroting van de gekwalificeerde
      deelneming, vermenigvuldigd met het aantal verworven aandelen; *wanbetaling*: a. situatie waarin een financiële
      onderneming het onwaarschijnlijk acht dat een debiteur zijn verplichtingen jegens haar, de moederonderneming
      of een van de dochterondernemingen van de financiële onderneming volledig zal nakomen zonder dat de financiële
      onderneming, de moederonderneming of een van de dochterondernemingen zal moeten overgaan tot maatregelen; of
      b. situatie waarin een debiteur meer dan negentig dagen in gebreke is bij het nakomen van een aanzienlijke
      verplichting jegens een financiële onderneming, de moederonderneming of een van de dochterondernemingen van
      de financiële onderneming; *weekperiode:* eerste zeven kalenderdagen volgend op de verslagdatum; *de wet:* de
      [Wet op het financieel toezicht][ref4].


