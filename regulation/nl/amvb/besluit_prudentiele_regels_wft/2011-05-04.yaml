    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel139
  - number: 139.b
    text: direct opvorderbare tegoeden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel139
  - number: 139.c
    text: kortlopende vorderingen die geen direct opvorderbare tegoeden zijn; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel139
  - number: 139.d
    text: |-
      activa die geen kortlopende vorderingen zijn en die op zeer korte termijn en zonder substantiële verliezen kunnen
      worden omgezet in munten of bankbiljetten of direct opvorderbare tegoeden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel139
  - number: '140.1'
    text: |-
      Een verklaring van geen bezwaar betreffende een gekwalificeerde deelneming als bedoeld in
      [artikel 3:96, eerste lid, onderdeel c, van de wet][ref1] wordt verleend, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 140.1.a
    text: |-
      de waarde van de gekwalificeerde deelneming bij verwerving of na vergroting van de gekwalificeerde
      deelneming niet groter is dan vijftien procent van het toetsingsvermogen van de bank, zoals berekend
      ingevolge de [artikelen 90 tot en met 94][ref1], met uitzondering van de vermindering, bedoeld in
      [artikel 94, tweede lid, aanhef en onderdelen f en g][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel94
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '90'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '94'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 140.1.b
    text: |-
      de totale waarde van de gekwalificeerde deelnemingen van de bank in ondernemingen die geen financiële
      ondernemingen zijn, door de nieuwe of vergrote gekwalificeerde deelneming niet groter wordt dan 60 procent van het
      toetsingsvermogen van de bank, zoals berekend ingevolge de [artikelen 90 tot en met 94][ref1], met uitzondering van
      de vermindering, bedoeld in [artikel 94, tweede lid, aanhef en onderdelen f en g][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel94
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel140
    references:
