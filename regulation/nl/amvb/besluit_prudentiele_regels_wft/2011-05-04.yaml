        bwb_id: BWBR0020420
        artikel: '81'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '81.1'
    text: |-
      Een zekerheidsregeling wordt slechts in het kader van kredietrisicovermindering overeengekomen, indien zij in alle
      relevante rechtsgebieden rechtsgeldig en afdwingbaar is.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel81
  - number: '81.2'
    text: |-
      Een financiële onderneming als bedoeld in [artikel 80][ref1] die leningverstrekkende financiële onderneming is,
      neemt alle vereiste maatregelen om de effectiviteit van de kredietrisicovermindering te waarborgen en de daaraan
      verbonden risico’s te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel80
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '80'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '81.3'
    text: |-
      In geval van volgestorte kredietprotectie worden geen activa in aanmerking genomen die onvoldoende zekerheid bieden
      ten aanzien van de protectie van de activa.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel81
  - number: '81.4'
    text: |-
      Volgestorte kredietprotectie wordt slechts als kredietrisicovermindering in aanmerking genomen, indien
      de leningverstrekkende financiële onderneming het recht heeft om bij in gebreke blijven, insolventie of
      faillissement van de debiteur of indien van toepassing, van de bewaarnemer van de zekerheid of bij een andere
      in de desbetreffende overeenkomst vermelde gebeurtenis die betaling onder de overeenkomst of afwikkeling van
      de overeenkomst tot gevolg heeft, de activa die als zekerheid dienen zo spoedig mogelijk te liquideren of te
      behouden. De waarde van de activa die als zekerheid worden gebruikt, mag niet te nauw zijn gekoppeld aan de kans op
      wanbetaling van de debiteur.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel81
  - number: '81.5'
    text: |-
      In geval van niet-volgestorte kredietprotectie mag de verstrekker van de garanties alleen in aanmerking worden
      genomen als deze betrouwbaar is en de overeenkomst tot kredietprotectie in de relevante rechtsgebieden rechtsgeldig
      en afdwingbaar is.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel81
  - number: '81.6'
    text: |-
      De Nederlandsche Bank stelt nadere regels met betrekking tot de voorwaarden waaronder technieken van
      kredietrisicovermindering toelaatbaar zijn en de beperking van de aan kredietrisicovermindering verbonden risico’s.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel81
  - number: '82.1'
    text: |-
      Een financiële onderneming als bedoeld in [artikel 80, eerste lid][ref1], die kredietrisicovermindering in
      aanmerking neemt, past de berekening van de naar risico gewogen activa en posten buiten de balanstelling en, indien
      van toepassing, de berekening van de verwachte verliesposten aan. De Nederlandsche Bank stelt regels met betrekking
      tot de aanpassing van deze berekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel80
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '80'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '82.2'
    text: |-
      Het in aanmerking nemen van kredietrisicovermindering levert geen hoger bedrag van de naar risico gewogen activa
      of posten buiten de balanstelling of een hogere verwachte verliespost op dan het bedrag van de naar risico gewogen
      activa of posten buiten de balanstelling onderscheidenlijk de verwachte verliespost van in alle overige opzichten
      identieke activa of posten buiten de balanstelling waarbij geen kredietrisicovermindering in aanmerking wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel82
  - number: '82.3'
    text: |-
      Indien bij de berekening van het bedrag van de naar risico gewogen activa en posten buiten de balanstelling
      ingevolge [artikel 61][ref1], of ingevolge een interne modellenmethode rekening is gehouden met
      kredietrisicovermindering, wordt kredietrisicovermindering ingevolge deze paragraaf niet nogmaals in aanmerking
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel61
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '83'
    text: |-
      Een bank, beleggingsonderneming of clearinginstelling als bedoeld in [artikel 3:57, eerste lid][ref1],
      [3:58, eerste lid][ref2], of [3:61, eerste lid, van de wet][ref3] berekent het bedrag van naar risico
      gewogen posten bij gesecuritiseerde activa en posten buiten de balanstelling en van naar risico gewogen
      securitisatieposities op de wijze, bepaald ingevolge deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '84.1'
    text: |-
      Indien een aanzienlijk deel van het aan de gesecuritiseerde posten verbonden kredietrisico is overgedragen door een
      financiële onderneming als bedoeld in [artikel 83][ref1] die initiator is, mag zij:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel83
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '83'
        hoofdstuk: '10'
        paragraaf: '10.4'
  - number: 84.1.a
    text: |-
      ingeval van een traditionele securitisatie de door haar gesecuritiseerde posten buiten beschouwing laten bij de
      berekening op grond van [paragraaf 10.1][ref1] of [10.2][ref2] van het bedrag van de naar risico gewogen activa en
      posten buiten de balanstelling en, indien van toepassing, van de verwachte verliesposten;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 84.1.b
    text: |-
      ingeval van een synthetische securitisatie de naar risico gewogen activa en posten buiten de balanstelling en,
      indien van toepassing, de verwachte verliesposten voor de gesecuritiseerde posten in plaats van op grond van
      [paragraaf 10.1][ref1] of [10.2][ref2] berekenen op grond van door de Nederlandsche Bank te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '84.2'
    text: |-
      Indien het eerste lid van toepassing is, berekent de financiële onderneming het bedrag van de naar risico gewogen
      securitisatieposities op grond van [artikel 85][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel85
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '85'
        hoofdstuk: '10'
        paragraaf: '10.4'
  - number: '84.3'
    text: |-
      Indien het eerste lid niet van toepassing is, berekent de financiële onderneming het bedrag van de naar risico
      gewogen activa en posten buiten de balanstelling alsof er geen securitisatie heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel84
  - number: '84.4'
    text: |-
      De Nederlandsche Bank stelt regels met betrekking tot de voorwaarden waaronder de overdracht van het aan de
      securitisatieposities verbonden kredietrisico in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel84
  - number: '85.1'
    text: |-
      Het bedrag van een naar risico gewogen securitisatiepositie is gelijk aan de waarde van de securitisatiepositie
      vermenigvuldigd met een aan die securitisatiepositie toegekend risicogewicht. Elke tranche van een
      securitisatiepositie geldt daarbij als afzonderlijke securitisatiepositie.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel85
  - number: '85.2'
    text: |-
      De Nederlandsche Bank stelt, met inachtneming van het derde tot en met vijfde lid, regels met betrekking tot
      het in aanmerking nemen van posten als securitisatieposities en de aan die securitisatieposities toe te kennen
      risicogewichten. Zij maakt daarbij onderscheid tussen gevallen waarin [artikel 61][ref1] wordt toegepast voor
      de berekening van de naar risico gewogen activa en posten buiten de balanstelling voor de categorie waarin de
      gesecuritiseerde posten op grond van [artikel 61, vijfde lid, onderdeel a][ref2], zou zijn ingedeeld en alle
      overige gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel61
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '85.3'
    text: |-
      Bij de toekenning van een risicogewicht aan een securitisatiepositie kan een financiële onderneming als bedoeld in
      [artikel 83][ref1] een kredietbeoordeling van een door de Nederlandsche Bank of door een toezichthoudende instantie
      van een andere lidstaat ingevolge [paragraaf 10.5][ref2] erkend kredietbeoordelingsbureau op een consistente wijze
      gebruiken. De Nederlandsche Bank stelt nadere regels met betrekking tot het gebruik van een kredietbeoordeling als
      bedoeld in de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '83'
        hoofdstuk: '10'
        paragraaf: '10.4'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.5'
  - number: '85.4'
    text: |-
      De Nederlandsche Bank kent op een objectieve en consequente wijze een risicogewicht toe aan kredietbeoordelingen
      als bedoeld in het derde lid met inachtneming van het volgende:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel85
  - number: 85.4.a
    text: zij onderscheidt de relatieve risicograden waaraan de kredietbeoordeling uitdrukking geeft;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel85
  - number: 85.4.b
    text: |-
      zij zorgt ervoor dat aan securitisatieposities die een gelijkwaardig kredietrisico lopen op grond van
      kredietbeoordelingen hetzelfde risicogewicht wordt toegekend; in voorkomende gevallen past zij de toekenning van
      een risicogewicht op grond van kredietbeoordelingen aan een securitisatiepositie aan.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel85
  - number: '85'
    text: |-
      [Artikel 61a, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel61a
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 61a
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '86.1'
    text: |-
      Indien op een securitisatie van revolverende vorderingen een vervroegde- aflossingsbepaling van toepassing is,
      berekent een financiële onderneming als bedoeld in [artikel 83][ref1] die initiator is een aanvullende naar risico
      gewogen post.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel83
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '83'
        hoofdstuk: '10'
        paragraaf: '10.4'
  - number: '86.2'
    text: De Nederlandsche Bank stelt regels met betrekking tot de berekening van de aanvullende naar risico gewogen post.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel86
  - number: '86.3'
    text: |-
      De Nederlandsche Bank kan, na overleg met de relevante toezichthoudende instanties in andere lidstaten, een
      financiële onderneming als bedoeld in het eerste lid toestaan de aanvullende naar risico gewogen post te berekenen
      op een wijze die niet wezenlijk afwijkt van de regels, bedoeld in het tweede lid, indien het een securitisatie
      betreft:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel86
  - number: 86.3.a
    text: |-
      van vorderingen op particulieren of op kleine of middelgrote ondernemingen die niet zijn toegezegd en
      onvoorwaardelijk, zonder opzegtermijn, kunnen worden opgezegd; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel86
  - number: 86.3.b
    text: |-
      waarbij een kwantitatieve waarde, die losstaat van het driemaandsgemiddelde van de overgebleven rentemarge,
      aanleiding is voor de vervroegde aflossing.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel86
  - number: '86.4'
    text: |-
      De Nederlandsche Bank maakt openbaar welke opvattingen en bedenkingen bij het overleg, bedoeld in het derde lid,
      door de toezichthoudende instanties zijn geuit.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel86
  - number: '87.1'
    text: |-
      Indien [artikel 84, eerste en tweede lid][ref1], van toepassing is op een financiële onderneming als bedoeld in
      [artikel 83][ref2] of indien een financiële onderneming als bedoeld in [artikel 83][ref3] die sponsor is steun
      verleent aan een securitisatie, overschrijdt zij niet de grenzen van haar contractuele verplichtingen teneinde de
      mogelijke of feitelijke verliezen van de beleggers te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel83
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '84'
        hoofdstuk: '10'
        paragraaf: '10.4'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '83'
        hoofdstuk: '10'
        paragraaf: '10.4'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '83'
        hoofdstuk: '10'
        paragraaf: '10.4'
  - number: '87.2'
    text: |-
      Indien de financiële onderneming die initiator of sponsor is bij een securitisatie niet voldoet aan het eerste lid,
      dan houdt zij voor alle gesecuritiseerde posten evenveel toetsingsvermogen aan als noodzakelijk was geweest indien
      deze posten niet waren gesecuritiseerd.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel87
  - number: '87.3'
    text: |-
      De financiële onderneming maakt openbaar dat zij buiten de grenzen van haar contractuele verplichtingen steun heeft
      verleend en welke gevolgen dit heeft voor haar toetsingsvermogen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel87
  - number: '88.1'
    text: |-
      De Nederlandsche Bank erkent, op aanvraag, al dan niet voor bepaalde tijd, een kredietbeoordelingsbureau indien
      het geregistreerd is, bedoeld in artikel 14, vierde lid, van de verordening (EG) nr. 1060/2009 van het Europees
      Parlement en de Raad van 16 september 2009 inzake ratingbureaus (PbEU L 302), en voldoet aan de criteria, bedoeld
      in de [artikelen 81, tweede lid][ref1], en [97, tweede lid][ref2], en de bijlagen VI, deel 2 en IX, deel 3, punt 1,
      van de herziene richtlijn banken.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel97
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '81'
        hoofdstuk: '10'
        paragraaf: '10.3'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '97'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: '88.2'
    text: De Nederlandsche Bank stelt een procedure vast voor de erkenning, bedoeld in het eerste lid, en maakt deze bekend.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel88
  - number: '88.3'
    text: |-
      Indien een kredietbeoordelingsbureau niet meer voldoet aan de criteria, bedoeld in het eerste lid, kan de
      Nederlandsche Bank de erkenning intrekken.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel88
  - number: '88.4'
    text: |-
      Indien een toezichthoudende instantie van een andere lidstaat een kredietbeoordelingsbureau heeft erkend, erkent de
      Nederlandsche Bank het kredietbeoordelingsbureau zonder toetsing.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel88
  - number: 88a
    text: |-
      De Nederlandsche Bank erkent, op aanvraag, al dan niet voor bepaalde tijd, de kredietbeoordelingen van een
      exportkredietverzekeraar, indien de kredietbeoordelingen voldoen aan de criteria opgenomen in bijlage VI, deel 1,
      punt 6, van de herziene richtlijn banken.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel88a
  - number: '89.1'
    text: |-
      Bij de berekening van het toetsingsvermogen, bedoeld in de [artikelen 90 tot en met 94][ref1], of de aanwezige
      solvabiliteitsmarge, bedoeld in de [artikelen 95 tot en met 98][ref2], wordt per afzonderlijke post rekening
      gehouden met het voorzienbare bedrag van de daarover verschuldigde belastingen. De vermogensbestanddelen, bedoeld
      in [artikel 91, tweede lid, onderdelen a tot en met j][ref3], of [95, tweede lid][ref4], alsmede de waarden
      die tegenover die vermogensbestanddelen staan, staan onmiddellijk en zonder beperkingen ter beschikking van de
      desbetreffende financiële onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel95
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '90'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '95'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '91'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: '95'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: '89.2'
    text: 'De Nederlandsche Bank stelt regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel89
  - number: 89.2.a
    text: |-
      het als toetsingsvermogen of aanwezige solvabiliteitsmarge in aanmerking nemen van innovatieve
      financiële instrumenten die gelijk te stellen zijn met de vermogensbestanddelen, bedoeld in de
      [artikelen 90 tot en met 98][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel90
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '90'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 89.2.b
    text: |-
      het als immateriële activa als bedoeld in de [artikelen 91, derde lid, onderdeel c][ref1], en
      [95, derde lid, onderdeel e][ref2], in aanmerking nemen van activa.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel95
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '91'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '95'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: '90.1'
    text: |-
      Het toetsingsvermogen van een bank, beleggingsonderneming, betaalinstelling of
      clearinginstelling als bedoeld in [artikel 3:57, eerste lid][ref1], [3:58, eerste lid][ref2],
      of [3:61, eerste lid, van de wet][ref3] wordt gevormd door de som van het overeenkomstig
      [artikel 94, eerste lid, onderdelen a tot en met c, tweede, derde en vierde lid][ref4], in aanmerking te nemen
      kernkapitaal en aanvullend kapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel94
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: '94'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: '90.2'
    text: |-
      In afwijking van het eerste lid kan de financiële onderneming ervoor kiezen dat haar toetsingsvermogen, uitsluitend
      ter dekking van de bedragen, bedoeld in [artikel 60, eerste lid, onderdeel b][ref1], voor zover het betreft de
      vereiste solvabiliteit ter dekking van de positierisico’s en grote posities, en onderdeel c, en het vereiste,
      bedoeld in [artikel 60, derde lid][ref2], wordt gevormd door de som van het overeenkomstig [artikel 94][ref3], in
      aanmerking te nemen kernkapitaal, aanvullend kapitaal en overig kapitaal. De bestanddelen van dit toetsingsvermogen
      dienen niet tevens ter dekking van andere in [artikel 60, eerste lid][ref4], bedoelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel94
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '94'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '90.3'
    text: |-
      Het toetsingsvermogen van een beheerder van een instelling voor collectieve belegging in effecten als
      bedoeld in [artikel 3:57, eerste lid, van de wet][ref1] wordt gevormd door de som van het overeenkomstig
      [artikel 94, eerste lid, onderdelen a tot en met c][ref2], in aanmerking te nemen kernkapitaal en aanvullend
      kapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel94
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '94'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: '90.4'
    text: |-
      Het toetsingsvermogen van een elektronischgeldinstelling als bedoeld in [artikel 3:57, eerste lid][ref1],
      of [3:58, eerste lid, van de wet][ref2] wordt gevormd door de som van het overeenkomstig
      [artikel 94, eerste lid, onderdelen a en b, tweede en derde lid][ref3], in aanmerking te nemen kernkapitaal en
      aanvullend hoger kapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel94
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '94'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: '91.1'
    text: |-
      Het kernkapitaal wordt gevormd door de waarde van de vermogensbestanddelen, bedoeld in het tweede lid, verminderd
      met de waarde van de posten, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: '91.2'
    text: 'De voor de bepaling van het kernkapitaal in aanmerking te nemen vermogensbestanddelen zijn:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.2.a
    text: |-
      voor een naamloze of besloten vennootschap: het geplaatste en volgestorte aandelenkapitaal, met uitsluiting van
      cumulatief preferente aandelen en van preferente aandelen met een vaste looptijd;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.2.b
    text: 'voor een vennootschap onder firma: de afgezonderde gestorte vermogensbestanddelen van de beherende vennoten;'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.2.c
    text: |-
      voor een commanditaire vennootschap: de afgezonderde gestorte vermogensbestanddelen van de beherende vennoten
      alsmede het gestorte commanditaire kapitaal;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.2.d
    text: 'voor een coöperatie: het door de leden gestorte of ingelegde kapitaal;'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.2.e
    text: |-
      voor een onderneming die een andere rechtsvorm heeft dan de hierboven genoemde: het voordelige verschil tussen
      bezittingen en schulden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.2.f
    text: reserves, met uitsluiting van de herwaarderingsreserves;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.2.g
    text: |-
      tussentijdse en door een accountant beoordeelde positieve resultaten, verminderd met uit te keren dividenden en,
      in het geval de financiële onderneming een initiator van een securitisatie is, met uitsluiting van de nettowinsten
      die zijn ontstaan uit de kapitalisatie van toekomstige inkomsten uit de gesecuritiseerde activa en die als
      kredietverbetering voor de securitisatieposities dienen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.2.h
    text: het fonds ter dekking van algemene bankrisico’s;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.2.i
    text: het belang van derden, voor zover het vermogensbestanddelen als bedoeld in dit lid omvat;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.2.j
    text: |-
      de negatieve onderdelen van de herwaarderingsreserves, voor zover ontstaan door waardeveranderingen van beleggingen
      in niet-rentedragende waarden; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.2.k
    text: tussentijdse negatieve resultaten.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: '91.3'
    text: 'De voor de bepaling van het kernkapitaal in aanmerking te nemen posten zijn:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.3.a
    text: |-
      reserves, voor zover ontstaan door ongerealiseerde resultaten op de eigen kredietwaardigheid van de financiële
      onderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.3.b
    text: |-
      de boekwaarde van de door de financiële onderneming uitgegeven effecten en van afgeleide financiële instrumenten op
      door de financiële onderneming uitgegeven effecten, voor zover het vermogensbestanddelen als bedoeld in het tweede
      lid omvat;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.3.c
    text: immateriële activa;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.3.d
    text: |-
      reserves, voor zover ontstaan door nog niet tot het resultaat gerekende waardeveranderingen van
      afdekkingstransacties; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.3.e
    text: |-
      in geval van een financiële onderneming die [artikel 90, tweede lid][ref1], toepast, of een beheerder van een
      instelling voor collectieve belegging in effecten, de volgende niet-liquide activa:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel90
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '90'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 91.3.e.1°
    text: |-
      materiële vaste activa andere dan terreinen en gebouwen die in aanmerking genomen kunnen worden tegenover de
      leningen waarvoor zij als zekerheid dienen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.3.e.2°
    text: |-
      de posten, bedoeld in [artikel 94, tweede lid, aanhef en onderdelen a tot en met e][ref1], waarbij het
      [vijfde tot en met zevende lid van dat artikel][ref2] van overeenkomstige toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel94
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '94'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '94'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 91.3.e.3°
    text: |-
      niet onmiddellijk verhandelbare deelnemingen en andere beleggingen in ondernemingen die geen entiteit voor risico-
      acceptatie, financiële instelling, kredietinstelling of verzekeraar zijn;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.3.e.4°
    text: tekorten bij dochterondernemingen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.3.e.5°
    text: |-
      deposito’s, uitgezonderd deposito’s die binnen negentig dagen opvraagbaar zijn of margebetalingen in verband met
      rechten op overdracht op termijn van goederen en optiecontracten;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.3.e.6°
    text: leningen en andere verschuldigde bedragen, die niet binnen negentig dagen hoeven worden afgelost; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: 91.3.e.7°
    text: fysieke voorraden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel91
  - number: '92.1'
    text: Het aanvullend kapitaal wordt gevormd door het hoger aanvullend kapitaal en het lager aanvullend kapitaal.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: '92.2'
    text: 'Het hoger aanvullend kapitaal wordt gevormd door de waarde van:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.2.a
    text: |-
      de herwaarderingsreserves, voor zover niet reeds verwerkt in [artikel 91, tweede lid, onderdeel j][ref1], en voor
      zover niet ontstaan door nog niet tot het resultaat gerekende waardeveranderingen van afdekkingstransacties of door
      waardering van rentedragende waarden tegen de actuele waarde;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel91
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '91'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 92.2.b
    text: 'het gestorte deel op schuldtitels met onbepaalde looptijd en andere financieringsinstrumenten indien:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.2.b.1°
    text: |-
      aflossing slechts plaatsvindt indien de Nederlandsche Bank daartoe, op verzoek van de financiële onderneming,
      instemming verleent;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.2.b.2°
    text: de schuldovereenkomst bepaalt dat de financiële onderneming de rentebetaling over de schuld mag uitstellen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.2.b.3°
    text: |-
      de documenten inzake de uitgifte van de schuldtitels bepalen dat schuld en niet betaalde rente kunnen worden
      gebruikt om verliezen op te vangen, terwijl de financiële onderneming haar werkzaamheden kan voortzetten; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.2.b.4°
    text: de vorderingen van de crediteur volledig achtergesteld zijn bij die van alle niet-achtergestelde crediteuren;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.2.c
    text: cumulatief preferente aandelen met onbepaalde looptijd, voor zover deel uitmakend van het gestorte kapitaal;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.2.d
    text: |-
      het verschil, indien positief, van de som van de waardeaanpassingen en voorzieningen die samenhangen
      met de verwachte verliesposten in verband met de activa en posten buiten de balanstelling, bedoeld in
      [artikel 71, eerste lid, onderdelen a tot en met d][ref1], en de som van die verwachte verliesposten
      berekend ingevolge [artikel 75, eerste lid, onderdelen a en c][ref2], indien de financiële onderneming
      [paragraaf 10.2][ref3] toepast en dit verschil in aanmerking genomen wordt tot ten hoogste 0,6 procent van
      het totaal van de naar risico gewogen activa en posten buiten de balanstelling, met dien verstande dat bij de
      berekening van de naar risico gewogen activa en posten buiten de balanstelling niet de securitisatieposities
      waaraan een risicogewicht van 1250 procent is toegekend in aanmerking worden genomen; de waardeaanpassingen en
      voorzieningen worden slechts op grond van dit onderdeel als toetsingsvermogen van de financiële onderneming in
      aanmerking genomen; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '75'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref3
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 92.2.e
    text: het belang van derden, voor zover het vermogensbestanddelen als bedoeld in dit lid omvat.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: '92.3'
    text: 'Het lager aanvullend kapitaal wordt gevormd door de waarde van:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.3.a
    text: |-
      aansprakelijkheidsverplichtingen van leden, indien het een coöperatie betreft, te weten het niet gestorte kapitaal
      en statutaire verplichtingen van die leden tot het doen van aanvullende niet-aflosbare stortingen bij verlies,
      indien die stortingen in dat geval onmiddellijk gevorderd kunnen worden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.3.b
    text: |-
      preferente en cumulatief preferente aandelen met een vaste looptijd, voor zover deel uitmakend van het gestorte
      kapitaal;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.3.c
    text: 'het gestorte deel op langlopende achtergestelde leningen indien:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.3.c.1°
    text: |-
      de vorderingen van de crediteur, voor zover het de terugbetaling van het leningbedrag betreft, volledig
      achtergesteld zijn bij die van alle andere crediteuren;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.3.c.2°
    text: |-
      de achtergestelde lening een vaste looptijd van oorspronkelijk ten minste vijf jaar of, indien de looptijd
      onbepaald is, een opzeggingstermijn van ten minste vijf jaar heeft;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.3.c.3°
    text: |-
      vervroegde aflossing slechts plaatsvindt indien de Nederlandsche Bank daartoe, op verzoek van de financiële
      onderneming, besluit;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.3.c.4°
    text: |-
      de hoogte tot welke de achtergestelde lening in aanmerking kan worden genomen als lager aanvullend kapitaal lineair
      wordt verlaagd gedurende ten minste de vijf jaar die voorafgaan aan de datum van de aflossing; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.3.c.5°
    text: |-
      de leningovereenkomst geen bepaling bevat op grond waarvan de achtergestelde lening voor het einde van de looptijd,
      anders dan bij liquidatie, moet worden afgelost; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: 92.3.d
    text: het belang van derden, voor zover het vermogensbestanddelen als bedoeld in dit lid omvat.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel92
  - number: '93'
    text: |-
      Het overig kapitaal wordt gevormd door de waarde van het gestorte deel op kortlopende achtergestelde leningen
      indien:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel93
  - number: 93.a
    text: de achtergestelde lening een looptijd heeft van oorspronkelijk ten minste twee jaar;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel93
  - number: 93.b
    text: |-
      de leningovereenkomst geen bepaling bevat op grond waarvan de achtergestelde lening voor het einde van de looptijd,
      anders dan bij liquidatie, moet worden afgelost, tenzij de Nederlandsche Bank daartoe, op verzoek van de financiële
      onderneming, besluit; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel93
  - number: 93.c
    text: |-
      op de achtergestelde lening, indien het toetsingsvermogen minder dan 120 procent bedraagt van de minimumomvang van
      het toetsingsvermogen, bedoeld in [artikel 60][ref1], niet wordt afgelost, tenzij de financiële onderneming hiervan
      kennis geeft aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '94.1'
    text: |-
      Voor de toepassing van de [artikelen 90 tot en met 93][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel90
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '90'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 94.1.a
    text: wordt het kernkapitaal volledig voor de berekening van het toetsingsvermogen in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
  - number: 94.1.b
    text: |-
      wordt het aanvullend kapitaal voor de berekening van het toetsingsvermogen slechts in aanmerking genomen voor zover
      het niet meer bedraagt dan het kernkapitaal;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
  - number: 94.1.c
    text: |-
      wordt het lager aanvullend kapitaal voor de berekening van het toetsingsvermogen slechts in aanmerking genomen voor
      zover het niet meer bedraagt dan vijftig procent van het kernkapitaal;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
  - number: 94.1.d
    text: |-
      wordt het overig kapitaal voor de berekening van het toetsingsvermogen in aanmerking genomen voor zover het niet
      meer bedraagt dan tweehonderdvijftig procent van het kernkapitaal dat in aanmerking komt ter dekking van deze
      bedragen en dat vereiste;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
  - number: 94.1.e
    text: |-
      wordt het aanvullend kapitaal, vermeerderd met het overig kapitaal, voor de berekening van het toetsingsvermogen
      slechts in aanmerking genomen voor zover het niet meer bedraagt dan het kernkapitaal; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
  - number: 94.1.f
    text: |-
      mag, indien wordt voldaan aan de onderdelen b, c en e, voor de berekening van het toetsingsvermogen het overig
      kapitaal worden gesubstitueerd door aanvullend kapitaal.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
  - number: '94.2'
    text: |-
      Het ingevolge het eerste lid als toetsingsvermogen in aanmerking te nemen kernkapitaal en aanvullend
      kapitaal van een bank, beleggingsonderneming, betaalinstelling of clearinginstelling als bedoeld in
      [artikel 90, eerste lid][ref1], of elektronischgeldinstelling als bedoeld in [artikel 90, vierde lid][ref2], worden
      beide verminderd met de helft van de som van de waarde van:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel90
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '90'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '90'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 94.2.a
    text: |-
      aandelen die een belang van meer dan tien procent vertegenwoordigen van het geplaatste aandelenkapitaal van een
      financiële instelling of kredietinstelling;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
  - number: 94.2.b
    text: |-
      indien de bank, beleggingsonderneming, betaalinstelling, clearinginstelling of elektronischgeldinstelling
      een belang als bedoeld in onderdeel a aanhoudt, de achtergestelde leningen en de posten, bedoeld in
      [artikel 92, tweede lid, onderdelen b en c, en derde lid, onderdelen b en c][ref1], die tot het toetsingsvermogen
      van de financiële instelling of kredietinstelling gerekend worden;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel92
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '92'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 94.2.c
    text: |-
      aandelen die een belang van tien procent of minder vertegenwoordigen van het geplaatste aandelenkapitaal
      van een financiële instelling of kredietinstelling, achtergestelde leningen en posten, bedoeld in
      [artikel 92, tweede lid, onderdelen b en c, en derde lid, onderdelen b en c][ref1], die tot het toetsingsvermogen
      van andere dan de in onderdeel b bedoelde financiële instellingen of kredietinstellingen gerekend worden, voor
      zover de waarde tien procent van het in aanmerking te nemen toetsingsvermogen van de bank, beleggingsonderneming,
      betaalinstelling, clearinginstelling of elektronischgeldinstelling zonder toepassing van dit lid overstijgt,
      en indien de genoemde posten deel uitmaken van de handelsportefeuille van de bank, beleggingsonderneming,
      betaalinstelling, clearinginstelling of elektronischgeldinstelling voor zover de waarde per individuele financiële
      instelling of kredietinstelling tien procent van het in aanmerking te nemen toetsingsvermogen van de bank,
      beleggingsonderneming, betaalinstelling, clearinginstelling of elektronischgeldinstelling zonder toepassing van dit
      lid overstijgt;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel92
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '92'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 94.2.d
    text: |-
      deelnemingen als bedoeld in [artikel 3:268, eerste lid, onderdeel b, van de wet][ref1] in een entiteit voor risico-
      acceptatie of verzekeraar;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 94.2.e
    text: |-
      indien de bank, beleggingsonderneming, betaalinstelling, clearinginstelling of elektronischgeldinstelling
      een deelneming als bedoeld in onderdeel d aanhoudt, de posten, bedoeld in [artikel 96][ref1], die tot de
      solvabiliteitsmarge van de entiteit voor risico-acceptatie of verzekeraar worden gerekend;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel96
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '96'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 94.2.f
    text: |-
      indien de financiële onderneming voor de berekening van de naar risico gewogen activa en posten buiten de
      balanstelling ingevolge [paragraaf 10.2][ref1] een interne modellenmethode toepast:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 94.2.f.1°
    text: |-
      het verschil, indien negatief, van de som van de waardeaanpassingen en voorzieningen die samenhangen
      met de verwachte verliesposten in verband met de activa en posten buiten de balanstelling, bedoeld in
      [artikel 71, eerste lid, onderdelen a tot en met d][ref1], en de som van die verwachte verliesposten, berekend
      ingevolge [artikel 75, eerste lid, onderdelen a en c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel75
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '75'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 94.2.f.2°
    text: |-
      de verwachte verliesposten in verband met posities in aandelen, bedoeld in
      [artikel 71, eerste lid, onderdeel e][ref1], berekend ingevolge [artikel 75, eerste lid, onderdeel a of b][ref2];
      en


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel75
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '75'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 94.2.g
    text: |-
      de vorderingen bij securitisatieposities waaraan ingevolge [artikel 85, tweede lid][ref1], een risicogewicht van
      1250 procent wordt toegekend, voor zover deze niet in aanmerking zijn genomen in de berekening van de naar risico
      gewogen activa en posten buiten de balanstelling, bedoeld in [artikel 85][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel85
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '85'
        hoofdstuk: '10'
        paragraaf: '10.4'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '85'
        hoofdstuk: '10'
        paragraaf: '10.4'
  - number: '94.3'
    text: |-
      In afwijking van het tweede lid worden het als toetsingsvermogen in aanmerking te nemen kernkapitaal en aanvullend
      kapitaal van de financiële onderneming die [artikel 90, tweede lid][ref1], toepast, verminderd met de helft van de
      som van de waarde van de posten, bedoeld in het tweede lid, onderdelen f en g.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel90
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '90'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: '94.4'
    text: |-
      Indien de helft van de som van de waarde van de bestanddelen, bedoeld in het tweede lid, meer bedraagt dan het als
      toetsingsvermogen in aanmerking te nemen aanvullend kapitaal, wordt het verschil in mindering gebracht op het als
      toetsingsvermogen in aanmerking te nemen kernkapitaal.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
  - number: '94.5'
    text: |-
      De Nederlandsche Bank kan, op verzoek, besluiten dat de financiële onderneming, bedoeld in het tweede lid, aanhef,
      al dan niet voor bepaalde tijd, haar als toetsingsvermogen in aanmerking te nemen kernkapitaal en aanvullend
      kapitaal niet hoeft te verminderen met de waarde van de in het tweede lid bedoelde posten indien het belang in
      de entiteit voor risico-acceptatie, financiële instelling, kredietinstelling, verzekeraar of verzekeringsholding,
      of de door deze financiële ondernemingen uitgegeven achtergestelde leningen of overige posten tijdelijk worden
      gehouden met het oog op een financiële bijstandsoperatie, bedoeld om die financiële onderneming te saneren of te
      redden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
  - number: '94.6'
    text: |-
      De financiële onderneming, bedoeld in het tweede lid, aanhef, kan, in plaats van de vermindering met de
      waarde van de posten, bedoeld in het tweede lid, onderdelen d en e, de methodes 1, 2 of 3, bedoeld in
      [bijlage B van het Besluit prudentieel toezicht financiële groepen Wft][ref1] op overeenkomstige wijze toepassen,
      met dien verstande dat methode 1 uitsluitend kan worden toegepast indien de Nederlandsche Bank, op verzoek, heeft
      besloten dat haar dat is toegestaan. De Nederlandsche Bank besluit hiertoe indien het geïntegreerd beheer en de
      interne controle van de in de consolidatie te betrekken ondernemingen voldoende zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020415
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020415
  - number: '94.7'
    text: |-
      Indien op de financiële onderneming, bedoeld in de aanhef van het tweede lid, toezicht op geconsolideerde
      basis ingevolge [afdeling 3.6.2 van de wet][ref1] of prudentieel toezicht op financiële conglomeraten ingevolge
      [afdeling 3.6.4 van de wet][ref2] wordt gehouden, hoeft zij haar als toetsingsvermogen in aanmerking te nemen
      kernkapitaal en aanvullend kapitaal niet te verminderen met de waarde van de in het tweede lid bedoelde posten
      die worden gehouden in een financiële instelling, kredietinstelling, verzekeraar of verzekeringsholding die in dat
      geconsolideerde toezicht of prudentieel toezicht op financiële conglomeraten wordt betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Afdeling3.6.2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Afdeling3.6.4
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0020368
        afdeling: 3.6.2
      - id: ref2
        bwb_id: BWBR0020368
        afdeling: 3.6.4
  - number: '94.8'
    text: |-
      De Nederlandsche Bank kan, op verzoek, in uitzonderlijke omstandigheden besluiten dat het een financiële
      onderneming toegestaan is voor bepaalde tijd een der limieten, bedoeld in het eerste lid, onderdeel b tot en met e,
      te overschrijden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel94
  - number: '95.1'
    text: |-
      De aanwezige solvabiliteitsmarge van een verzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1],
      [3:58, eerste of tweede lid][ref2], of [3:61, eerste of tweede lid, van de wet][ref3] wordt gevormd door de waarde
      van de vermogensbestanddelen, bedoeld in het tweede lid, verminderd met de waarde van de posten, bedoeld in het
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '95.2'
    text: 'De vermogensbestanddelen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.2.a
    text: 'het gestorte aandelenkapitaal of waarborgkapitaal, indien van toepassing vermeerderd met de ledenrekeningen indien:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.2.a.1°
    text: de ledenrekeningen statutair een achtergesteld karakter hebben;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.2.a.2°
    text: |-
      de statuten bepalen dat vanaf de ledenrekeningen slechts betalingen aan de leden plaatsvinden indien daardoor de
      solvabiliteitsmarge niet daalt beneden het minimumbedrag, dan wel indien bij liquidatie van de verzekeraar alle
      andere schulden zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.2.a.3°
    text: |-
      de statuten bepalen dat elke betaling vanaf de ledenrekeningen voor andere doeleinden dan voor de individuele
      opzegging van het lidmaatschap niet eerder plaatsvindt dan dertig dagen na kennisgeving ervan aan de Nederlandsche
      Bank; de Nederlandsche Bank kan besluiten dat een voorgenomen betaling niet mag plaatsvinden; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.2.a.4°
    text: |-
      de statutaire bepalingen met betrekking tot de ledenrekeningen slechts kunnen worden gewijzigd indien de
      Nederlandsche Bank daartoe, op verzoek, besluit;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.2.b
    text: |-
      de reserves, waaronder de herwaarderingsreserves voor zover deze niet zijn ontstaan door nog niet tot het resultaat
      gerekende waardeveranderingen van afdekkingstransacties;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.2.c
    text: de onverdeelde winst, verminderd met uit te keren dividenden; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.2.d
    text: |-
      het negatieve verschil tussen de uitkomst van de netto-vermogensmutatiemethode en de uitkomst van de
      vermogensmutatiemethode of de kostprijs van belangen in dochtermaatschappijen, in deelnemingen in maatschappijen
      waarin de verzekeraar invloed van betekenis uitoefent op het zakelijke en financiële beleid en in rechtspersonen
      waarin wordt deelgenomen volgens een onderlinge regeling tot samenwerking.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: '95.3'
    text: 'De posten, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.3.a
    text: de reserves, voor zover ontstaan door ongerealiseerde resultaten op de eigen kredietwaardigheid van de verzekeraar;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.3.b
    text: |-
      de egalisatiereserve voor de branche Krediet, bedoeld in [artikel 114, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 95.3.c
    text: het onverdeelde verlies;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.3.d
    text: |-
      de boekwaarde van de door de verzekeraar uitgegeven effecten en van afgeleide financiële instrumenten op door de
      verzekeraar uitgegeven effecten, voor zover het vermogensbestanddelen als bedoeld in het tweede lid omvat;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.3.e
    text: immateriële activa;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: 95.3.f
    text: |-
      deelnemingen als bedoeld in [artikel 3:268, eerste lid, onderdeel b, van de wet][ref1] in een
      beleggingsonderneming, financiële instelling, kredietinstelling, verzekeraar of verzekeringsholding als bedoeld in
      [artikel 3:268, eerste lid, onderdeel j, van de wet][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 95.3.g
    text: |-
      indien de verzekeraar een deelneming als bedoeld in onderdeel f aanhoudt: de posten, bedoeld in de
      [artikelen 92, tweede lid, onderdelen b en c, en derde lid, onderdelen b en c][ref1], en [96][ref2], die tot de
      solvabiliteitsmarge dan wel het toetsingsvermogen van de financiële onderneming, bedoeld in onderdeel f, worden
      gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel96
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '92'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '96'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: '95.4'
    text: |-
      De Nederlandsche Bank kan, op verzoek, besluiten dat een verzekeraar als bedoeld in het eerste lid, al dan niet
      voor bepaalde tijd, zijn aanwezige solvabiliteitsmarge niet hoeft te verminderen met de waarde van de posten,
      bedoeld in het derde lid, onderdelen f en g, indien deze posten tijdelijk worden gehouden met het oog op een
      financiële bijstandsoperatie, bedoeld om de financiële onderneming, bedoeld in het derde lid, onderdeel f, te
      saneren of te redden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
  - number: '95.5'
    text: |-
      Een verzekeraar als bedoeld in het eerste lid kan, in plaats van de vermindering met de waarde van de
      posten, bedoeld in het derde lid, onderdelen f en g, de methodes 1, 2 of 3, bedoeld in [bijlage A][ref1] of
      [B, van het Besluit prudentieel toezicht financiële groepen Wft][ref2] op overeenkomstige wijze toepassen, met
      dien verstande dat methode 1 uitsluitend kan worden toegepast indien de Nederlandsche Bank, op verzoek, heeft
      besloten dat hem dat is toegestaan. De Nederlandsche Bank besluit hiertoe indien het geïntegreerd beheer en de
      interne controle van de in de consolidatie te betrekken ondernemingen voldoende zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020415
      [ref2]: https://wetten.overheid.nl/BWBR0020415
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0020415
      - id: ref2
        bwb_id: BWBR0020415
  - number: '96'
    text: |-
      De aanwezige solvabiliteitsmarge, bedoeld in [artikel 95, eerste lid][ref1], wordt tevens gevormd door de waarde
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel95
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '95'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 96.a
    text: cumulatief preferente aandelen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel96
  - number: 96.b
    text: |-
      het gestorte deel op achtergestelde leningen indien is voldaan aan de voorwaarden, bedoeld in
      [artikel 92, derde lid, onderdeel c, onder 1° tot en met 5°][ref1], en de leningovereenkomst slechts gewijzigd
      kan worden indien de Nederlandsche Bank daartoe, op verzoek, besluit; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel92
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel96
    references:
