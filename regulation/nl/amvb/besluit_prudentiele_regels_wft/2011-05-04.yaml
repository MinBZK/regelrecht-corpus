        artikel: '3'
  - number: '102.2'
    text: |-
      De totale waarde van de grote posities van een financiële onderneming als bedoeld in het eerste lid bedraagt niet
      meer dan achthonderd procent van haar toetsingsvermogen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel102
  - number: '102.3'
    text: |-
      Voor de toepassing van dit artikel is de waarde van een actief gelijk aan de balanswaarde en is de waarde van een
      post buiten de balanstelling gelijk aan de actuele waarde. De Nederlandsche Bank stelt nadere regels met betrekking
      tot de waardering van activa en posten buiten de balanstelling voor de toepassing van dit artikel, het geheel of
      gedeeltelijk niet in aanmerking nemen van bepaalde activa of posten buiten de balanstelling voor de toepassing van
      dit artikel en het toepassen van risicogewichten op bepaalde activa en posten buiten de balanstelling.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel102
  - number: '102.4'
    text: |-
      De financiële onderneming geeft de Nederlandsche Bank onverwijld kennis van een overschrijding van een limiet
      als bedoeld in het eerste of tweede lid. De Nederlandsche Bank kan, op verzoek, besluiten dat het een financiële
      onderneming voor een beperkte duur is toegestaan een limiet te overschrijden. De Nederlandsche Bank stelt regels
      met betrekking tot de voorwaarden waaronder zij een overschrijding toestaat. Zij kan daarbij bepalen dat de eerste
      volzin van dit lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel102
  - number: '103.1'
    text: |-
      De waarde van de onroerende zaken, bedrijfsmiddelen, deelnemingen in ondernemingen die geen financiële
      ondernemingen zijn, en kredieten aan ondernemingen die geen financiële ondernemingen zijn, indien daarin
      deelnemingen worden gehouden, verminderd met de waarde van eventueel gestelde zekerheden, van een bank als bedoeld
      in [artikel 3:57, zesde lid][ref1], of [3:58, eerste lid, van de wet][ref2] of van een clearinginstelling als
      bedoeld in [artikel 3:57, zesde lid][ref3], of [3:61, eerste lid, van de wet][ref4] bedraagt niet meer dan haar
      toetsingsvermogen, verminderd met het overig kapitaal, bedoeld in [artikel 93][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Artikel93
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020420
        artikel: '93'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: '103.2'
    text: |-
      Onverminderd het eerste lid, bedraagt de waarde van onroerende zaken van een financiële onderneming als bedoeld in
      het eerste lid, anders dan voor eigen gebruik, niet meer dan 25 procent van haar toetsingsvermogen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel103
  - number: '103.3'
    text: 'Voor de toepassing van het tweede lid kan een financiële onderneming als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel103
  - number: 103.3.a
    text: |-
      een onroerende zaak die zij volgens een huurcontract heeft verhuurd, waarderen tegen de actuele waarde, verminderd
      met de contante waarde van de overeengekomen huurtermijnen of leasetermijnen tijdens de duur van het contract op
      basis van de contractrente;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel103
  - number: 103.3.b
    text: |-
      een onroerende zaak die zij heeft verhuurd voor een periode van twee jaar of langer, waarderen tegen de actuele
      waarde, verminderd met de contante waarde van de huurtermijnen en de waarde van de eventueel gestelde zekerheden.
      Als waarde van de zekerheden wordt aangemerkt de waarde, berekend naar de in het bankwezen gebruikelijke
      maatstaven, uitgezonderd de hypothecaire dekking, die hier op de executiewaarde van het hypothecair verbondene
      wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel103
  - number: '103.4'
    text: |-
      De berekening van de waarde van de activa, bedoeld in het eerste en tweede lid, geschiedt met uitzondering van de
      waarde van onroerende zaken in ontwikkeling zijn voor rekening en risico van derden, of van onroerende zaken die
      zijn verkocht, waarbij de obligatoire overeenkomst tot verkoop nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel103
  - number: '104.1'
    text: |-
      Een beheerder van een instelling voor collectieve belegging in effecten, instelling voor collectieve belegging
      in effecten die een beleggingsmaatschappij is, of bewaarder die is verbonden aan een instelling voor collectieve
      belegging in effecten als bedoeld in [artikel 3:57, zesde lid, van de wet][ref1] verstrekt geen kredieten voor
      rekening van derden, stelt zich niet garant en gaat geen borgtochtverplichtingen aan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '104.2'
    text: |-
      Een financiële onderneming als bedoeld in het eerste lid verkoopt geen financiële instrumenten die de instelling
      voor collectieve belegging in effecten niet in eigendom heeft.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel104
  - number: '104.3'
    text: 'De financiële onderneming gaat niet als debiteur geldleningen aan met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel104
  - number: 104.3.a
    text: |-
      kortlopende leningen die gezamenlijk niet meer bedragen dan tien procent van de activa van de instelling voor
      collectieve belegging in effecten;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel104
  - number: 104.3.b
    text: |-
      leningen voor het verwerven van onroerende zaken die rechtstreeks noodzakelijk zijn voor de uitoefening van de
      werkzaamheden van de beleggingsmaatschappij en die gezamenlijk niet meer bedragen dan tien procent van haar activa,
      voor zover de omvang van deze geldleningen tezamen met de omvang van de in onderdeel a genoemde leningen niet meer
      bedraagt dan vijftien procent van haar activa; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel104
  - number: 104.3.c
    text: |-
      leningen met als doel de verwerving van vreemde valuta waardoor de netto schuld van de instelling voor collectieve
      belegging in effecten niet verandert of zal veranderen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel104
  - number: '105.1'
    text: |-
      Een elektronischgeldinstelling als bedoeld in [artikel 3:57, zesde lid][ref1], of
      [3:58, eerste lid, van de wet][ref2] houdt, ter dekking van haar financiële verplichtingen die met uitstaand
      elektronisch geld verband houden, uitsluitend de volgende activa aan, gewaardeerd tegen de historische kostprijs of
      de actuele waarde, naar gelang welke het laagst is:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 105.1.a
    text: |-
      activa die voldoende liquide zijn, waaraan ingevolge [artikel 61, derde lid, onderdeel a][ref1], een risicogewicht
      van nul procent is toegekend;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel61
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 105.1.b
    text: |-
      onmiddellijk opvraagbare deposito’s bij een bank met zetel in Nederland, in een andere lidstaat, of in een
      ingevolge [artikel 3:2, eerste lid, onderdeel c, onder 2°, van de wet][ref1] aangewezen staat; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 105.1.c
    text: |-
      overige voldoende liquide schuldinstrumenten als bedoeld in [artikel 113, eerste lid][ref1], die niet
      zijn uitgegeven door een persoon met welke de elektronischgeldinstelling in een formele of feitelijke
      zeggenschapsstructuur is verbonden, indien de Nederlandsche Bank daartoe, op verzoek, heeft besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel113
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '113'
        hoofdstuk: '11'
        paragraaf: '11.3'
  - number: '105.2'
    text: |-
      Indien de financiële verplichtingen van de elektronischgeldinstelling die met uitstaand elektronisch geld verband
      houden niet volledig worden gedekt door de activa, bedoeld in het eerste lid, kan de Nederlandsche Bank, op
      verzoek, besluiten dat de elektronischgeldinstelling deze verplichtingen voor een beperkte duur door andere
      activa dekt. De waarde van deze andere activa bedraagt niet meer dan vijf procent van haar totale financiële
      verplichtingen die met uitstaand elektronisch geld verband houden of haar toetsingsvermogen, naargelang welk bedrag
      het laagst is.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel105
  - number: '105.3'
    text: |-
      [Artikel 102, eerste tot en met derde lid en vierde lid, eerste, tweede en vierde volzin][ref1], is
      van overeenkomstige toepassing op de activa, bedoeld in het eerste lid, onderdelen b en c, met dien
      verstande dat de totale waarde van deze activa niet meer bedraagt dan twintig maal het toetsingsvermogen
      van de elektronischgeldinstelling, en dat [artikel 102, eerste lid][ref2], niet van toepassing is op een
      elektronischgeldinstelling waarvan de financiële verplichtingen die met uitstaand elektronisch geld verband houden,
      minder dan € 50 miljoen bedragen. Een elektronischgeldinstelling gaat geen risico’s aan ten aanzien van personen
      die formeel of feitelijk zeggenschap over haar hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel102
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '102'
        hoofdstuk: '10'
        paragraaf: '10.8'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '102'
        hoofdstuk: '10'
        paragraaf: '10.8'
  - number: '105.4'
    text: |-
      De Nederlandsche Bank stelt nadere regels met betrekking tot het beperken van of het verbinden van voorwaarden aan
      het aanhouden van activa en posten buiten de balanstelling door een elektronischgeldinstelling.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel105
  - number: '106'
    text: |-
      De liquiditeit van een financiële onderneming als bedoeld in [artikel 3:63, eerste lid][ref1], [3:64][ref2],
      [3:65][ref3] of [3:66 van de wet][ref4] is voldoende indien de aanwezige liquiditeit, bedoeld in
      [artikel 111][ref5], [112][ref6] of [113][ref7], ten minste gelijk is aan de vereiste liquiditeit, bedoeld in
      [artikel 108][ref8], [109][ref9] of [110][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Artikel111
      [ref6]: https://wetten.overheid.nl/BWBR0020420#Artikel112
      [ref7]: https://wetten.overheid.nl/BWBR0020420#Artikel113
      [ref8]: https://wetten.overheid.nl/BWBR0020420#Artikel108
      [ref9]: https://wetten.overheid.nl/BWBR0020420#Artikel109
      [ref10]: https://wetten.overheid.nl/BWBR0020420#Artikel110
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020420
        artikel: '111'
        hoofdstuk: '11'
        paragraaf: '11.3'
      - id: ref6
        bwb_id: BWBR0020420
        artikel: '112'
        hoofdstuk: '11'
        paragraaf: '11.3'
      - id: ref7
        bwb_id: BWBR0020420
        artikel: '113'
        hoofdstuk: '11'
        paragraaf: '11.3'
      - id: ref8
        bwb_id: BWBR0020420
        artikel: '108'
        hoofdstuk: '11'
        paragraaf: '11.2'
      - id: ref9
        bwb_id: BWBR0020420
        artikel: '109'
        hoofdstuk: '11'
        paragraaf: '11.2'
      - id: ref10
        bwb_id: BWBR0020420
        artikel: '110'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: '107.1'
    text: |-
      Het is een bank of clearinginstelling als bedoeld in [artikel 3:63][ref1], [3:64][ref2], [3:65][ref3] of
      [3:66 van de wet][ref4] toegestaan om:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 107.1.a
    text: |-
      zowel de te ontvangen rente bij de aanwezige liquiditeit als de te betalen rente bij de vereiste liquiditeit mee
      te rekenen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel107
  - number: 107.1.b
    text: |-
      dochtermaatschappijen en bijkantoren die elk minder dan één procent uitmaken van het balanstotaal niet te betrekken
      bij de liquiditeitsberekeningen, indien ten minste 95 procent van het totale geconsolideerde balanstotaal wordt
      betrokken in de berekening;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel107
  - number: 107.1.c
    text: |-
      middellijke deelnemingen en bijkantoren van deelnemingen waarbij geen sprake is van, in verhouding tot de bank of
      clearinginstelling als geheel, grote liquiditeitsbehoefte terwijl de liquiditeitsvoorziening ervan in belangrijke
      mate afhankelijk is van de moederonderneming onderscheidenlijk het hoofdkantoor, niet te betrekken bij de
      liquiditeitsberekeningen; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel107
  - number: 107.1.d
    text: |-
      een liquiditeitstekort in convertibele of inconvertibele valuta’s te compenseren met een overschot in convertibele
      valuta’s, voor zover afkomstig uit een land van waaruit vrije overdracht van liquiditeiten mogelijk is.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel107
  - number: '107.2'
    text: |-
      Indien een bank of clearinginstelling kiest voor toepassing van het eerste lid, onderdeel b of c, betrekt zij de
      intragroepstransacties in de berekening van de liquiditeit.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel107
  - number: '108.1'
    text: |-
      De vereiste liquiditeit van een bank of clearinginstelling als bedoeld in [artikel 3:63][ref1], [3:64][ref2],
      [3:65][ref3] of [3:66 van de wet][ref4] bedraagt de som van de gewogen uitgaande kasstromen op basis van de
      kalenderposten, vermeerderd met de niet in de vervalkalender opgenomen gewogen toevertrouwde middelen en overige
      posten die opgevraagd kunnen worden of tot een betalingsverplichting kunnen leiden, gedurende de weekperiode
      respectievelijk de maandperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '108.2'
    text: De Nederlandsche Bank stelt regels met betrekking tot de in het eerste lid bedoelde posten en de weging daarvan.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel108
  - number: '109.1'
    text: |-
      De vereiste liquiditeit van een beleggingsinstelling als bedoeld in [artikel 3:63][ref1] of [3:66 van de wet][ref2]
      bedraagt tien procent van het beheerde vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '109.2'
    text: |-
      In afwijking van het vorige lid kan, indien uit een overeengekomen ontbindings- of beëindigingsregeling vooraf
      bekend is voor welk bedrag op een bepaalde datum wordt ingekocht, worden volstaan met dat bedrag.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel109
  - number: '110'
    text: |-
      De vereiste liquiditeit van een elektronischgeldinstelling als bedoeld in [artikel 3:63][ref1] of
      [3:65 van de wet][ref2] is gelijk aan het bedrag van de betalingsverplichtingen dat verband houdt met het uitstaand
      elektronisch geld en de overige verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '111.1'
    text: |-
      De aanwezige liquiditeit van een bank of clearinginstelling als bedoeld in [artikel 3:63][ref1], [3:64][ref2],
      [3:65][ref3] of [3:66 van de wet][ref4] in de weekperiode wordt gevormd door de gewogen voorraadposten, de gewogen
      kasinstroom van de kalenderposten gedurende de weekperiode en de officiële stand-by faciliteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '111.2'
    text: |-
      De financiële onderneming betrekt bij de berekening van de aanwezige liquiditeit in de weekperiode uitsluitend de
      activa die in het kader van het dagelijkse liquiditeitenbeheer aan haar ter beschikking staan teneinde te kunnen
      voorzien in de directe liquiditeitsbehoefte en de inkomende kasstromen uit het kernbedrijf waarmee in het kader van
      het dagelijkse liquiditeitenbeheer rekening wordt gehouden. Daartoe worden in elk geval gerekend:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: 111.2.a
    text: |-
      financiële instrumenten op basis waarvan op korte termijn liquide middelen kunnen worden verkregen door verkoop of
      belening zonder dat dit gepaard gaat met meer dan marginale kosten of verliezen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: 111.2.b
    text: onmiddellijk opeisbaar interbancair actief; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: 111.2.c
    text: onmiddellijk opeisbare vorderingen op overheden en professionele geldmarktpartijen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: '111.3'
    text: |-
      De aanwezige liquiditeit van de financiële onderneming in de maandperiode wordt gevormd door de gewogen
      voorraadposten en de gewogen kasinstroom gedurende de maandperiode.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: '111.4'
    text: |-
      De financiële onderneming betrekt, onverminderd het eerste en derde lid, bij de berekening van de aanwezige
      liquiditeit het liquiditeitsoverschot van een bijkantoor of een dochtermaatschappij met zetel buiten Nederland,
      welk liquiditeitsoverschot wordt berekend op basis van dit besluit of, indien dit lager is, volgens de in de staat
      van de zetel daarvoor geldende regels, slechts voor zover:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: 111.4.a
    text: |-
      overdracht van het liquiditeitsoverschot niet leidt tot een liquiditeitstekort bij het bijkantoor of de
      dochtermaatschappij volgens de lokale liquiditeitstoetsing;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: 111.4.b
    text: het om een overschot in convertibele valuta’s gaat; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: 111.4.c
    text: vrije en grensoverschrijdende overdracht van liquiditeit mogelijk is.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: '111.5'
    text: 'De financiële onderneming betrekt bij de berekening van de aanwezige liquiditeit niet:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: 111.5.a
    text: activa die niet onbelemmerd overdraagbaar zijn;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: 111.5.b
    text: direct opeisbare tegoeden bij personen die geen kredietinstelling of professionele geldmarktpartij zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: '111.6'
    text: |-
      De Nederlandsche Bank stelt regels met betrekking tot de in het eerste, tweede en derde lid bedoelde posten en de
      weging daarvan.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel111
  - number: '112'
    text: |-
      De aanwezige liquiditeit van een beleggingsinstelling als bedoeld in [artikel 3:63][ref1] of
      [3:66 van de wet][ref2] wordt gevormd door de volgende posten:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 112.a
    text: |-
      kasmiddelen, daggeld en direct opvraagbare tegoeden bij banken die een vergunning als bedoeld in
      [artikel 2:11 van de wet][ref1] hebben of waarop toezicht op het uitoefenen van het bedrijf van bank wordt
      uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 112.b
    text: kortlopende schuldtitels aan toonder;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel112
  - number: 112.c
    text: |-
      financiële instrumenten die zijn toegelaten tot de handel aan een gereglementeerde markt of een markt in financiële
      instrumenten waarvan de houder gevestigd is in een staat die deel uitmaakt van de G10 of aan een andere door de
      Nederlandsche Bank aangewezen gereglementeerde markt;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel112
  - number: 112.d
    text: |-
      officiële stand-by faciliteiten afgegeven door banken die een vergunning als bedoeld in
      [artikel 2:11 van de wet][ref1] hebben of waarop toezicht op het uitoefenen van het bedrijf van bank wordt
      uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 112.e
    text: |-
      onvoorwaardelijke garanties van banken en verzekeraars die een vergunning als bedoeld in [artikel 2:11][ref1]
      onderscheidenlijk [artikel 2:27 van de wet][ref2] hebben of waarop toezicht op het uitoefenen van het bedrijf van
      bank onderscheidenlijk verzekeraar wordt uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de
      belangen die de [wet][ref3] beoogt te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
  - number: '113.1'
    text: |-
      De aanwezige liquiditeit van een elektronischgeldinstelling als bedoeld in [artikel 3:63][ref1] of
      [3:65 van de wet][ref2] wordt gevormd door activa als bedoeld in [artikel 105, eerste lid][ref3], voorzover deze
      beleggingen direct in geld opvraagbare activa zijn of beleggingen zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel105
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '105'
        hoofdstuk: '10'
        paragraaf: '10.8'
  - number: 113.1.a
    text: |-
      waarvoor door een gereglementeerde markt of door verschillende, niet gelieerde, professionele marktpartijen
      regelmatig en minimaal dagelijks biedprijzen en laatprijzen worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel113
  - number: 113.1.b
    text: die regelmatig worden verhandeld;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel113
  - number: 113.1.c
    text: waarvan de verkoop of belening op dagelijkse termijn kan plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel113
  - number: 113.1.d
    text: |-
      waarvan de opbrengstwaarde dan wel de beleningswaarde niet anders dan marginaal wordt beïnvloed door de omvang of
      de snelheid van de verkoop onderscheidenlijk de belening;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel113
  - number: 113.1.e
    text: |-
      waarvan de liquiditeit ten minste gelijkwaardig is aan uitzettingen bij centrale overheidslichamen van een
      krachtens [artikel 3:2, eerste lid, onderdeel c, onder 2°, van de wet][ref1] aangewezen staat; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 113.1.f
    text: |-
      waarvan de afwikkeling in de markt waar de desbetreffende activa worden verhandeld, plaats vindt volgens een vast
      en niet onderhandelbaar tijdschema.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel113
  - number: '113.2'
    text: |-
      De financiële onderneming houdt ten minste twintig procent van de betalingsverplichtingen, bedoeld in
      [artikel 110][ref1], aan in de vorm van:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel110
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '110'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 113.2.a
    text: direct opvraagbare deposito’s;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel113
  - number: 113.2.b
    text: |-
      onherroepelijke officiële stand-by faciliteiten bij banken met zetel in een lidstaat of een staat die deel uitmaakt
      van de G10; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel113
  - number: 113.2.c
    text: direct bij een centrale bank beleenbaar papier tegen de beleningswaarde.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel113
  - number: '114.1'
    text: |-
      Een entiteit voor risico-acceptatie als bedoeld in [artikel 3:67, eerste lid][ref1], of
      [artikel 3:68a, eerste lid, van de wet][ref2], een herverzekeraar als bedoeld in [artikel 3:67, eerste lid][ref3],
      of [3:68a, eerste lid, van de wet][ref4], of een levensverzekeraar of schadeverzekeraar als bedoeld in
      [artikel 3:67, eerste lid][ref5], of [3:68, eerste lid, van de wet][ref6], of een natura-uitvaartverzekeraar
      als bedoeld in [artikel 3:67, eerste lid][ref7], of [3:69, eerste lid, van de wet][ref8] houdt, met inachtneming
      van [artikel 427, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref9] de technische voorzieningen, bedoeld
      in [artikel 435, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref10], aan voor zover deze op haar
      onderscheidenlijk hem van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref9]: https://wetten.overheid.nl/BWBR0003045#Artikel427
      [ref10]: https://wetten.overheid.nl/BWBR0003045#Artikel435
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref8
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref9
        bwb_id: BWBR0003045
        artikel: '427'
      - id: ref10
        bwb_id: BWBR0003045
        artikel: '435'
  - number: '114.2'
    text: |-
      Een schadeverzekeraar als bedoeld in het eerste lid die zijn jaarrekening opstelt overeenkomstig de
      internationale jaarrekeningstandaarden houdt voor de branche Krediet, in plaats van een egalisatievoorziening,
      een egalisatiereserve aan. Voor de toepassing van dit besluit wordt de egalisatiereserve aangemerkt als technische
      voorziening.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel114
  - number: '114.3'
    text: |-
      Een entiteit voor risico-acceptatie of een verzekeraar als bedoeld in het eerste lid kan afwijken van de
      indeling, bedoeld in [artikel 435, eerste lid, van Boek 2 van het Burgerlijk Wetboek,][ref1] of van de berekening
      van de technische voorzieningen, bedoeld in de [artikelen 115 tot en met 119][ref2], indien de internationale
      jaarrekeningstandaarden zulks voorschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel435
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel115
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '435'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '115'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 114a
    text: |-
      De waarden, die tegenover de technische voorzieningen staan die door een entiteit voor risico-acceptatie als
      bedoeld in [artikel 3:67, eerste lid][ref1], of [artikel 3:68a, eerste lid, van de wet][ref2], worden aangehouden,
      zijn gelijk aan het bedrag dat maximaal wordt uitgekeerd door de entiteit voor risico-acceptatie indien het gedekte
      risico zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '115.1'
    text: |-
      De door een verzekeraar als bedoeld in [artikel 114, eerste lid][ref1], aan te houden voorziening voor niet-
      verdiende premies en lopende risico’s, waaronder de catastrofevoorziening indien deze is getroffen, omvat onder
      meer:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 115.1.a
    text: |-
      de in het boekjaar ontvangen premies ter zake van risico’s die op het daarop volgende boekjaar of boekjaren
      betrekking hebben; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel115
  - number: 115.1.b
    text: |-
      de schaden en kosten uit lopende verzekeringen die na afloop van het boekjaar kunnen ontstaan en die niet gedekt
      kunnen worden door de voorziening die betrekking heeft op de niet-verdiende premies tezamen met de in het daarop
      volgende boekjaar of boekjaren nog te ontvangen premies.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel115
  - number: '115.2'
    text: |-
      De voorziening voor niet-verdiende premies wordt voor elke schadeverzekering afzonderlijk en op voorzichtige wijze
      bepaald. Het gebruik van statistische of wiskundige methoden is toegestaan indien de aard van de verzekering dat
      toelaat en indien deze methoden naar verwachting dezelfde resultaten opleveren als de afzonderlijke berekeningen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel115
  - number: '116.1'
    text: |-
      De door een verzekeraar als bedoeld in [artikel 114, eerste lid][ref1], aan te houden voorziening voor
      levensverzekeringen wordt berekend op basis van een voldoende voorzichtige prospectieve actuariële methode,
      rekening houdend met de in de toekomst te ontvangen premies en met alle toekomstige verplichtingen volgens de voor
      iedere lopende levensverzekering gestelde voorwaarden, met inbegrip van:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 116.1.a
    text: alle gegarandeerde uitkeringen en gegarandeerde afkoopwaarden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel116
  - number: 116.1.b
    text: |-
      de winstdelingen waarop de verzekeringnemer, verzekerde of gerechtigde op uitkeringen, collectief dan wel
      individueel recht heeft;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel116
  - number: 116.1.c
    text: |-
      alle keuzemogelijkheden waarover de verzekeringnemer, verzekerde of gerechtigde op uitkeringen, volgens de
      voorwaarden van de levensverzekering beschikt; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel116
  - number: 116.1.d
    text: de bedrijfskosten, met inbegrip van provisies.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel116
  - number: '116.2'
    text: |-
      [Artikel 115, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel115
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '115'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '116.3'
    text: |-
      In afwijking van het eerste lid kan een retrospectieve methode worden toegepast indien de op grond van die methode
      berekende technische voorzieningen niet lager zijn dan de voorzieningen bij toepassing van een prospectieve methode
      of indien het gebruik van een prospectieve methode vanwege de aard van het betrokken type levensverzekering niet
      mogelijk is.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel116
  - number: '117.1'
    text: |-
      De door een verzekeraar als bedoeld in [artikel 114, eerste lid][ref1], aan te houden voorziening voor te betalen
      schaden of voor te betalen uitkeringen omvat het bedrag van de te verwachten schaden, in aanmerking nemende:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 117.1.a
    text: |-
      de voor de balansdatum ontstane schaden of verplichtingen tot uitkering die zijn gemeld en nog niet zijn
      afgewikkeld en de schaden of verplichtingen tot uitkering die nog niet zijn gemeld;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel117
  - number: 117.1.b
    text: de kosten die verband houden met de afwikkeling van schaden of uitkeringen; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel117
  - number: 117.1.c
    text: |-
      de in verband met schaden of uitkeringen te verwachten baten uit subrogatie en de verkrijging van de eigendom van
      verzekerde zaken.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel117
  - number: '117.2'
    text: |-
      [Artikel 115, tweede lid][ref1], is van overeenkomstige toepassing. In geval van periodiek te betalen uitkeringen
      geschiedt de bepaling volgens erkende actuariële methoden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel115
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '115'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '117.3'
    text: |-
      Discontering van de voorziening voor te betalen schaden of voor te betalen uitkeringen, anders dan periodieke
      uitkeringen, is slechts toegestaan indien de afwikkeling van de schaden ten minste vier jaren na het tijdstip
      van het opmaken van de jaarrekening zal duren en deze afwikkeling geschiedt volgens een betrouwbaar schade-
      afwikkelingsschema, waarin mede rekening wordt gehouden met alle factoren die de kosten van afwikkeling van de
      schade verhogen. Indien de voorziening voor te betalen schaden of te betalen uitkeringen wordt verminderd ten
      gevolge van discontering van te betalen schaden worden in de toelichting op de balans het bedrag van de voorziening
      voor discontering en de gebruikte methode van discontering vermeld.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel117
  - number: '117.4'
    text: |-
      Met betrekking tot een communautaire co-assurantie zijn de voorzieningen voor te betalen schaden of voor te
      betalen uitkeringen verhoudingsgewijs ten minste gelijk aan die welke de co-assuradeur die als eerste verzekeraar
      optreedt, aanhoudt volgens de regels of gebruiken die gelden in de lidstaat van waaruit de eerste verzekeraar zijn
      verplichtingen uit hoofde van de communautaire co-assurantie is aangegaan.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel117
  - number: '118.1'
    text: |-
      Indien de verplichtingen uit hoofde van verzekeringen op het tijdstip van het opmaken van de jaarrekening
      redelijkerwijs niet te schatten zijn wegens het ontbreken van voldoende nauwkeurige gegevens met betrekking tot de
      over het tekenjaar te ontvangen premies of te betalen schaden en kosten van afwikkeling van de schade, kan door een
      verzekeraar als bedoeld in [artikel 114, eerste lid][ref1], in afwijking van [artikel 117][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel117
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '117'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 118.1.a
    text: 'als voorziening voor te betalen schaden of voor te betalen uitkeringen worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel118
  - number: 118.1.a.1°
    text: |-
      een percentage van de geboekte premies met betrekking tot het tekenjaar waarin de verzekeringen een aanvang nemen;
      of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel118
  - number: 118.1.a.2°
    text: |-
      het positieve verschil tussen enerzijds de geboekte premies en anderzijds de betaalde schaden en kosten van
      afwikkeling van de schaden met betrekking tot het tekenjaar waarin de verzekeringen een aanvang nemen; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel118
  - number: 118.1.b
    text: |-
      ter bepaling van de voorziening voor te betalen schaden of voor te betalen uitkeringen gebruik wordt gemaakt van
      gegevens, bedoeld in onderdeel a, die betrekking hebben op een jaar dat ten hoogste twaalf maanden aan het boekjaar
      voorafgaat.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel118
  - number: '118.2'
    text: |-
      De overeenkomstig het eerste lid bepaalde voorziening moet te allen tijde toereikend zijn om aan de huidige
      en toekomstige verplichtingen te voldoen. Het bedrag van de voorziening wordt, zodra dat nodig blijkt, zodanig
      verhoogd tot het toereikend is.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel118
  - number: '118.3'
    text: |-
      Indien de berekening, bedoeld in het eerste lid, onderdeel a, wordt toegepast, wordt zodra voldoende nauwkeurige
      gegevens, bedoeld in het eerste lid, aanhef, bekend zijn, doch uiterlijk aan het einde van het derde boekjaar
      volgend op het in het eerste lid bedoelde tekenjaar, de voorziening voor te betalen schaden of voor te betalen
      uitkeringen overeenkomstig [artikel 117][ref1] bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel117
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '117'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '119'
    text: |-
      De voorziening voor winstdeling en kortingen van een verzekeraar als bedoeld in [artikel 114, eerste lid][ref1],
      omvat de bedragen die in de vorm van winstdeling bestemd zijn voor de verzekeringnemers, verzekerden of
      gerechtigden op uitkeringen, voor zover deze niet hebben geleid tot verhoging van de voorziening voor
      levensverzekering, alsmede de bedragen die een gedeeltelijke terugbetaling van premies op grond van het resultaat
      van de verzekeringen vertegenwoordigen, voor zover deze niet tot verhoging van de ledenrekening hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '120.1'
    text: |-
      Een herverzekeraar of schadeverzekeraar als bedoeld in [artikel 114, eerste lid][ref1], houdt een
      egalisatievoorziening aan voor het herverzekeren van risico’s in de branche Krediet onderscheidenlijk voor de
      branche Krediet voor:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 120.1.a
    text: alle aangegane verplichtingen indien het een herverzekeraar of schadeverzekeraar met zetel in Nederland betreft;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel120
  - number: 120.1.b
    text: |-
      de vanuit zijn in Nederland gelegen bijkantoren aangegane verplichtingen indien het een herverzekeraar met zetel in
      een niet-aangewezen staat of een schadeverzekeraar met zetel in een staat die geen lidstaat is betreft.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel120
  - number: '120.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel120
  - number: 120.2.a
    text: |-
      herverzekeraars met zetel in Nederland die naast de risico’s van de branche Krediet risico’s van een andere branche
      vanuit een vestiging in een lidstaat herverzekeren, indien de door hun jaarlijks geboekte premies met betrekking
      tot hun vanuit vestigingen in een lidstaat aangegane verplichtingen voor de risico’s van de branche Krediet minder
      dan vier procent van het totale bedrag aan jaarlijks geboekte premies en minder dan € 2.500.000 belopen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel120
  - number: 120.2.b
    text: |-
      herverzekeraars met zetel in een niet-aangewezen staat die naast de risico’s van de branche Krediet risico’s van
      een andere branche vanuit een in Nederland gelegen bijkantoor herverzekeren, indien de door hun jaarlijks geboekte
      premies met betrekking tot hun vanuit bijkantoren in Nederland aangegane verplichtingen in de herverzekering van
      risico’s van de branche Krediet minder dan vier procent van het totale bedrag aan jaarlijks geboekte premies en
      minder dan € 2.500.000 belopen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel120
  - number: 120.2.c
    text: |-
      schadeverzekeraars met zetel in Nederland die naast de branche Krediet een of meer andere branches vanuit een
      vestiging in een lidstaat uitoefenen, indien de door hun jaarlijks geboekte premies met betrekking tot hun vanuit
      vestigingen in een lidstaat aangegane verplichtingen in de uitoefening van de branche Krediet minder dan vier
      procent van het totale bedrag aan jaarlijks geboekte premies en minder dan € 2.500.000 belopen; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel120
  - number: 120.2.d
    text: |-
      schadeverzekeraars met zetel in een staat die geen lidstaat is die naast de branche Krediet een of meer andere
      branches vanuit een in Nederland gelegen bijkantoor uitoefenen, indien de door hun jaarlijks geboekte premies
      met betrekking tot hun vanuit bijkantoren in Nederland aangegane verplichtingen in de uitoefening van de branche
      Krediet minder dan vier procent van het totale bedrag aan jaarlijks geboekte premies en minder dan € 2.500.000
      belopen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel120
  - number: '120.3'
    text: |-
      De egalisatievoorziening wordt gevormd ter dekking van een tijdens het boekjaar in de branche Krediet geleden
      technisch verlies en beloopt ten minste 134 procent van het gemiddelde van de tijdens de vijf voorgaande boekjaren
      jaarlijks geboekte premies verminderd met het bedrag van de overdrachten uit hoofde van herverzekering en na
      toevoeging van de geaccepteerde herverzekeringen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel120
  - number: '120.4'
    text: |-
      Aan de egalisatievoorziening wordt in elk van de opeenvolgende boekjaren waarin in de branche Krediet een technisch
      overschot werd geboekt, 75 procent van dit technisch overschot toegevoegd, totdat de voorziening gelijk is aan of
      hoger dan het overeenkomstig het derde lid berekende minimum.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel120
  - number: '120.5'
    text: |-
      Dit artikel is van overeenkomstige toepassing op de egalisatiereserve voor de branche Krediet, bedoeld in
      [artikel 114, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '121.1'
    text: |-
      Onverminderd de [artikelen 115][ref1], [116][ref2], [117][ref3] en [119][ref4] voert een verzekeraar als bedoeld
      in [artikel 114, eerste lid][ref5], jaarlijks een toets uit naar de toereikendheid van de balanswaarde van de
      voorzieningen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel117
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel119
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '115'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '116'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '117'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: '119'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref5
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 121.1.a
    text: niet-verdiende premies en lopende risico’s, waaronder de catastrofevoorziening indien deze wordt aangehouden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel121
  - number: 121.1.b
    text: levensverzekering;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel121
  - number: 121.1.c
    text: te betalen schaden of voor te betalen uitkeringen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel121
  - number: 121.1.d
    text: winstdeling en kortingen; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel121
  - number: 121.1.e
    text: latente winstdelingsverplichtingen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel121
  - number: '121.2'
    text: |-
      Indien discontering wordt gebruikt bij de bepaling van de balanswaarde van de voorzieningen, bedoeld in het
      eerste lid, stelt de Nederlandsche Bank voor de toepassing van de toets, bedoeld in dat lid, onverminderd
      de [artikelen 114][ref1], [116][ref2], [117][ref3] en [119][ref4] en met inachtneming van de internationale
      jaarrekeningstandaarden, regels met betrekking tot de te hanteren grondslagen en rekenprincipes voor de
      disconteringsvoet, sterfte en invaliditeit.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel117
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel119
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '116'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '117'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: '119'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '121.3'
    text: |-
      Indien de waarden die dienen tot dekking van de technische voorzieningen niet tegen de actuele waarde zijn
      gewaardeerd, betrekt de verzekeraar het verschil tussen de actuele waarde en de balanswaarde van deze waarden bij
      de toets, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel121
  - number: '121.4'
    text: |-
      De balanswaarde van de technische voorzieningen is ten minste gelijk aan de waarde die volgt uit de toets, bedoeld
      in het tweede lid, met inachtneming van het derde lid.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel121
  - number: '122.1'
    text: |-
      Een entiteit voor risico-acceptatie of herverzekeraar als bedoeld in [artikel 3:67, eerste lid][ref1],
      of [3:68a, eerste lid, van de wet][ref2], levensverzekeraar of schadeverzekeraar als bedoeld in
      [artikel 3:67, eerste lid][ref3], of [3:68, eerste lid, van de wet][ref4] of natura-uitvaartverzekeraar als bedoeld
      in [artikel 3:67, eerste lid][ref5], of [3:69, eerste lid, van de wet][ref6] draagt er zorg voor dat de aard van de
      waarden die dienen tot dekking van de technische voorzieningen in overeenstemming zijn met de aard van de aangegane
      verplichtingen. Deze waarden worden adequaat gediversifieerd en gespreid. Waarden met een hoog risico worden tot
      een voorzichtig niveau beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '122.2'
    text: |-
      Een vordering op een entiteit voor risico-acceptatie of verzekeraar, die geen vergunning op grond van deze wet of
      op grond van het recht van een andere lidstaat behoeft te hebben, uit hoofde van een door een andere verzekeraar
      als verzekeringnemer gesloten herverzekeringsovereenkomst kan slechts dienen als waarde ter dekking van de
      technische voorzieningen indien:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122
  - number: 122.2.a
    text: geen tegenvordering openstaat; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122
  - number: 122.2.b
    text: het aannemelijk is dat de vordering zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122
  - number: 122a.1
    text: |-
      Onverminderd [artikel 122, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '122'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 122a.1.a
    text: |-
      beperkt een entiteit voor risico-acceptatie of herverzekeraar beleggingen in waarden die niet op een
      gereglementeerde markt worden verhandeld tot een voorzichtig niveau;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122a
  - number: 122a.1.b
    text: |-
      belegt een entiteit voor risico-acceptatie of herverzekeraar slechts in afgeleide financiële instrumenten, voor
      zover deze worden gebruikt om het beleggingsrisico te beperken of een efficiënt portefeuillebeheer mogelijk te
      maken;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122a
  - number: 122a.1.c
    text: |-
      vermijdt een entiteit voor risico-acceptatie of herverzekeraar een bovenmatig risico met betrekking tot dezelfde
      wederpartij;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122a
  - number: 122a.1.d
    text: |-
      diversifieert een entiteit voor risico-acceptatie of herverzekeraar de waarden zodanig dat een bovenmatige
      afhankelijkheid van een bepaald actief, een bepaalde emittent of groep van verbonden wederpartijen en
      risicoaccumulatie in de portefeuille wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122a
  - number: 122a.2
    text: |-
      Er is geen sprake van een bovenmatige afhankelijkheid van een bepaald actief in geval van beleggingen door een
      entiteit voor risico-acceptatie of herverzekeraar in staatsobligaties.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122a
  - number: 122a.3
    text: |-
      [Artikel 122, tweede lid][ref1], is van overeenkomstige toepassing op entiteiten voor risico-acceptatie voor zover
      het betreft het gebruik van vorderingen die dienen als dekking van de technische voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '122'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 122b.1
    text: |-
      De technische voorzieningen van een levensverzekeraar of schadeverzekeraar als bedoeld in [artikel 122][ref1]
      worden gedekt door:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '122'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 122b.1.a
    text: 'de volgende beleggingen:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.a.1°
    text: obligaties en andere geld- en kapitaalmarktinstrumenten;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.a.2°
    text: leningen die geen obligaties zijn;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.a.3°
    text: aandelen en andere met aandelen gelijk te stellen niet-rentedragende beleggingen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.a.4°
    text: |-
      rechten van deelneming in instellingen voor collectieve belegging in effecten en deelnemingen in andere
      beleggingsfondsen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.a.5°
    text: onroerende zaken, waaronder onroerende zaken voor eigen gebruik, alsmede zakelijke rechten op onroerende zaken; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.a.6°
    text: |-
      afgeleide financiële instrumenten, voor zover deze worden gebruikt om het beleggingsrisico te beperken of een
      efficiënt portefeuillebeheer mogelijk te maken;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.b
    text: 'de volgende vorderingen:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.b.1°
    text: |-
      vorderingen op herverzekeraars, met inbegrip van het aandeel van herverzekeraars in de technische voorzieningen, en
      verhaalbare bedragen op entiteiten voor risico-acceptatie;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.b.2°
    text: deposito’s en vorderingen uit hoofde van herverzekering;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.b.3°
    text: |-
      vorderingen op verzekeringnemers en tussenpersonen uit hoofde van verzekeringen en herverzekeringen, voor zover
      binnen negentig dagen opeisbaar;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.b.4°
    text: vorderingen van een schadeverzekeraar uit hoofde van verhaalsrecht of subrogatie;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.b.5°
    text: voorschotten op polissen van een levensverzekeraar;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.b.6°
    text: belastingtegoeden; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.b.7°
    text: vorderingen op garantiefondsen; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.c
    text: 'de volgende andere activa:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.c.1°
    text: materiële vaste activa, andere dan onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.c.2°
    text: |-
      liquide middelen en deposito’s bij kredietinstellingen of bij buitenlandse andere instellingen die vergunning
      hebben om deposito’s te ontvangen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.c.3°
    text: overlopende acquisitiekosten;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.c.4°
    text: lopende interest en huur en andere overlopende posten; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.1.c.5°
    text: zakelijke rechten waarvan het genot is uitgesteld.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.2
    text: |-
      Indien beleggingen van een levensverzekeraar of schadeverzekeraar worden beheerd door een dochteronderneming
      van die verzekeraar, wordt voor de toepassing van het eerste lid uitgegaan van de activa in het bezit van deze
      dochteronderneming.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: 122b.3
    text: |-
      De Nederlandsche Bank kan in individuele gevallen besluiten dat de waarden die dienen tot dekking van de technische
      voorzieningen voor de toepassing van dit besluit tegen een lager bedrag worden gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel122b
  - number: '123.1'
    text: |-
      Onverminderd de [artikelen 122][ref1] en [122b][ref2], worden de waarden die dienen tot dekking van de technische
      voorzieningen van een levensverzekeraar of schadeverzekeraar als bedoeld in [artikel 3:67, eerste lid][ref3], of
      [3:68, eerste lid, van de wet][ref4], ten opzichte van het totaal van de technische voorzieningen, per categorie
      van activa als bedoeld in [artikel 122b, eerste lid][ref5], verdeeld met inachtneming van de volgende maxima:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel122b
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Artikel122b
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '122'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 122b
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020420
        artikel: 122b
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 123.1.a
    text: |-
      leningen als bedoeld in [artikel 122b, eerste lid, onderdeel a, onder 2°][ref1], aan ondernemingen en instellingen
      die geen beleggingsinstelling, kredietinstelling of verzekeraar met zetel in een lidstaat zijn, voor zover deze
      leningen niet zijn voorzien van een garantie, hypotheek of andere zekerheid: vijf procent;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122b
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 122b
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 123.1.b
    text: 'kasmiddelen: drie procent; en'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel123
  - number: 123.1.c
    text: |-
      beleggingen als bedoeld in [artikel 122b, eerste lid, onderdeel a, onder 1°en 3°][ref1], voor zover deze
      beleggingen niet op een gereglementeerde markt worden verhandeld: tien procent.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122b
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 122b
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '123.2'
    text: |-
      De waarden die dienen tot dekking van de technische voorzieningen worden, ten opzichte van het totaal van de
      technische voorzieningen, per individueel actief als bedoeld in [artikel 122b, eerste lid][ref1], verdeeld met
      inachtneming van de volgende maxima:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122b
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 122b
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 123.2.a
    text: |-
      een bepaald terrein of gebouw als bedoeld in [artikel 122b, eerste lid, onderdeel a, onder 5°][ref1], of een
      complex van verschillende terreinen of gebouwen dat als een belegging kan worden beschouwd: tien procent per
      object; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122b
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 122b
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 123.2.b
    text: |-
      een bepaalde lening als bedoeld in [artikel 122b, eerste lid, onderdeel a, onder 2°][ref1], aan ondernemingen en
      instellingen die geen beleggingsinstelling, kredietinstelling of verzekeraar met zetel in een lidstaat zijn, voor
      zover deze leningen niet zijn voorzien van een garantie, hypotheek of andere zekerheid: een procent per lening.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122b
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 122b
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '123.3'
    text: |-
      De waarden die dienen tot dekking van de technische voorzieningen bestaan, ten opzichte van het
      totaal van de technische voorzieningen, voor maximaal vijf procent uit beleggingen als bedoeld in
      [artikel 122b, eerste lid, onderdeel a, onder 1° en 3°][ref1], uitgegeven door een bepaalde emittent
      of uit leningen aan een bepaalde kredietnemer, tezamen genomen. Waardepapieren uitgegeven of gegarandeerd
      door onderscheidenlijk leningen aan of gegarandeerd door centrale, regionale of lokale overheidslichamen of
      internationale instellingen of organisaties waarvan een of meer lidstaten deel uitmaken, blijven hierbij buiten
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122b
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 122b
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '123.4'
    text: |-
      De Nederlandsche Bank kan, op verzoek, besluiten het maximum, bedoeld in het eerste lid, onderdeel a, voor
      een levensverzekeraar te verhogen tot acht procent van de technische voorzieningen en het maximum, bedoeld
      in het tweede lid, onderdeel b, tot twee procent van de technische voorzieningen indien de belangen van de
      verzekeringnemers, verzekerden of gerechtigden op uitkeringen zich daartegen niet verzetten.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel123
  - number: '123.5'
    text: |-
      De Nederlandsche Bank kan, op verzoek, besluiten dat voor de toepassing van het derde lid een bepaalde
      kredietinstelling met zetel in Nederland met een overheidslichaam wordt gelijkgesteld, indien de aandelen van
      die kredietinstelling in handen zijn van de Nederlandse Staat of Nederlandse provincies, gemeenten, waterschappen
      of andere openbare lichamen als bedoeld in [artikel 134 van de Grondwet][ref1] en de werkzaamheden van die
      kredietinstelling statutair bestaan in het door haar tussenkomst verstrekken van leningen aan, of met garantie van
      de Nederlandse Staat of andere overheidslichamen of het vertrekken van leningen aan nauw met de Nederlandse Staat
      of de lokale overheidslichamen verbonden instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: '123.6'
    text: |-
      Het maximum, bedoeld in het derde lid, wordt gesteld op tien procent van de technische voorzieningen indien de
      waarden die dienen tot dekking van de technische voorzieningen voor niet meer dan veertig procent bestaan uit
      leningen aan of waardepapieren van kredietnemers en emittenten waarin de verzekeraar meer dan vijf procent van zijn
      activa heeft belegd.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel123
  - number: '124'
    text: |-
      Onverminderd [artikel 123][ref1] stelt de Nederlandsche Bank nadere regels met betrekking tot het gebruik van de
      waarden die dienen tot dekking van de technische voorzieningen van levensverzekeraars of schadeverzekeraars als
      bedoeld in [artikel 122, eerste lid][ref2], en de daarbij in acht te nemen voorwaarden, ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel122
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '123'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '122'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 124.a
    text: |-
      de leningen waarvoor niet door middel van een bankgarantie, een garantie toegekend door een verzekeraar, een recht
      van hypotheek of een andere wijze zekerheid is gegeven;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124
  - number: 124.b
    text: deelnemingen in een beleggingsinstelling, voor zover de richtlijn beleggingsinstellingen niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124
  - number: 124.c
    text: effecten die niet worden verhandeld op een gereglementeerde markt; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124
  - number: 124.d
    text: |-
      beleggingen als bedoeld in [artikel 122b, eerste lid, onderdeel a, onder 1°][ref1], uitgegeven door een emittent
      niet zijnde centrale, regionale of lokale overheid of een ander openbaar lichaam, een internationale organisatie
      waarvan een of meer lidstaten deel uitmaken of een kredietinstelling met zetel in Nederland, in een andere lidstaat
      of in een ingevolge [artikel 3:2, eerste lid, onderdeel c, onder 2°, van de wet][ref2] aangewezen staat.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122b
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 122b
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 124a
    text: |-
      In afwijking van [artikel 123, derde lid][ref1], kan een levensverzekeraar of schadeverzekeraar tot ten hoogste
      veertig procent van de waarden die dienen tot dekking van de technische voorzieningen beleggen in geregistreerde
      gedekte obligaties van een bepaalde uitgevende bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel123
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '123'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 124b.1
    text: |-
      De Nederlandsche Bank besluit op verzoek van een bank met zetel in Nederland om een door die bank uitgegeven of
      uit te geven categorie obligaties alsmede de uitgevende bank in een openbaar register op te nemen, indien die
      bank aantoont dat de obligaties zijn aan te merken als gedekte obligaties. Bij ministeriële regeling worden regels
      gesteld met betrekking tot de wijze waarop de bank dit kan aantonen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124b
  - number: 124b.2
    text: |-
      De Nederlandsche Bank stelt een lijst van de overeenkomstig het eerste lid geregistreerde categorieën obligaties
      en banken alsmede wijzigingen daarvan, ter kennis van de Commissie van de Europese Gemeenschappen met het oog
      op de toepassing van artikel 22, vierde lid, van de richtlijn beleggingsinstellingen. De Nederlandsche Bank doet
      onverwijld mededeling aan de uitgevende bank van iedere kennisgeving als bedoeld in de vorige volzin met betrekking
      tot die bank en de door haar uitgegeven categorieën obligaties.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124b
  - number: 124b.3
    text: |-
      Indien een categorie obligaties niet langer voldoet aan het in het eerste lid bedoelde vereiste voor registratie of
      indien de uitgevende bank niet of niet langer voldoet aan [artikel 124c][ref1], kan de Nederlandsche Bank besluiten
      de registratie van de categorie obligaties of van de uitgevende bank, bedoeld in het eerste lid, door te halen.
      In dat geval stelt zij de Commissie van de Europese Gemeenschappen daarvan onverwijld in kennis en maakt zij dit
      onverwijld openbaar op haar website.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel124c
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 124c
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 124c
    text: |-
      Een bank die obligaties heeft uitgegeven die behoren tot een categorie die is geregistreerd overeenkomstig
      [artikel 124b][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel124b
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124c
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 124b
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 124c.a
    text: 'houdt een administratie bij waarin zijn opgenomen:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124c
  - number: 124c.a.1°
    text: de uitgegeven obligaties die tot die categorie behoren, en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124c
  - number: 124c.a.2°
    text: de activa die dienen ter dekking van die obligaties; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124c
  - number: 124c.b
    text: |-
      toont aan de Nederlandsche Bank tenminste jaarlijks aan dat de categorie obligaties nog voldoet aan het in
      [artikel 124b, eerste lid][ref1], bedoelde vereiste voor registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel124b
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124c
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 124b
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 124d
    text: |-
      Het beleggingsbeleid van een pensioenregeling die niet wordt beheerst door het recht van een lidstaat wordt
      uitgevoerd overeenkomstig de bepalingen van het land van herkomst van de regeling.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124d
  - number: 124e.1
    text: |-
      Het beleggingsbeleid van een pensioenregeling die wordt beheerst door het recht van een lidstaat wordt uitgevoerd
      overeenkomstig de volgende beginselen:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124e
  - number: 124e.1.a
    text: |-
      beleggingen in de bijdragende onderneming worden beperkt tot ten hoogste 5% van de portefeuille als geheel, en
      ingeval de bijdragende onderneming tot een groep behoort, worden beleggingen in de ondernemingen die tot dezelfde
      groep als de bijdragende onderneming behoren, beperkt tot ten hoogste 10% van de portefeuille. Wanneer een groep
      van ondernemingen aan de premiepensioeninstelling bijdragen betaalt, geschieden beleggingen in deze bijdragende
      ondernemingen prudent, waarbij rekening wordt gehouden met de noodzaak van een behoorlijke diversificatie;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124e
  - number: 124e.1.b
    text: de beleggingen worden gewaardeerd op basis van marktwaardering;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124e
  - number: 124e.1.c
    text: |-
      beleggingen in niet tot de handel op een gereglementeerde markt, of een multilaterale handelsfaciliteit of een
      daarmee vergelijkbaar systeem in een staat die geen lidstaat is toegelaten waarden worden tot een prudent niveau
      beperkt.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124e
  - number: 124e.1.d
    text: |-
      beleggingen in derivaten zijn toegestaan voor zover deze bijdragen aan een vermindering van het risicoprofiel of
      een doeltreffend portefeuillebeheer vergemakkelijken. De premiepensioeninstelling vermijdt een bovenmatig risico
      met betrekking tot een en dezelfde tegenpartij en tot andere derivatenverrichtingen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124e
  - number: 124e.1.e
    text: |-
      de waarden worden naar behoren gediversifieerd zodat een bovenmatige afhankelijkheid van of vertrouwen in bepaalde
      waarden, of een bepaalde emittent van waarden of groep van ondernemingen en risicoaccumulatie in de portefeuille
      als geheel worden vermeden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124e
  - number: 124e.2
    text: |-
      De eisen die zijn opgenomen in het eerste lid, aanhef en onderdelen a en e, zijn niet van toepassing op beleggingen
      in staatsobligaties.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124e
  - number: 124e.3
    text: |-
      Onder waardering op marktwaarde bedoeld in het eerste lid, onderdeel b, wordt verstaan: het bedrag waarvoor een
      actief kan worden verhandeld of een passief kan worden afgewikkeld tussen terzake goed geïnformeerde partijen, die
      tot een transactie bereid en onafhankelijk van elkaar zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124e
  - number: 124e.4
    text: |-
      Leningen als bedoeld in [artikel 3:267b, vierde lid, van de wet][ref1] mogen slechts worden aangegaan voor een
      periode van niet langer dan een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124e
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 124e.5
    text: |-
      Van een liquiditeitsdoelstelling als bedoeld in [artikel 3:267b, vierde lid, van de wet][ref1] is sprake als
      de premiepensioeninstelling tijdelijk niet kan voldoen aan zijn verplichtingen of de betreffende lening wordt
      aangegaan ter verbetering van het risicoprofiel van de premiepensioeninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel124e
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '125.1'
    text: |-
      De technische voorzieningen van een levensverzekeraar of schadeverzekeraar als bedoeld in
      [artikel 122, eerste lid][ref1], met betrekking tot uitkeringen die volgens de verzekering rechtstreeks gekoppeld
      zijn aan de waarde van een deelneming in een instelling voor collectieve belegging in effecten, of aan de waarde
      van activa die zijn opgenomen in een door de verzekeraar gehouden fonds dat gewoonlijk in fracties is verdeeld,
      worden gedekt door deze rechten van deelneming onderscheidenlijk fracties dan wel, indien geen fracties zijn
      gecreëerd, door deze activa.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '122'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '125.2'
    text: |-
      De technische voorzieningen met betrekking tot uitkeringen die volgens de verzekering rechtstreeks gekoppeld
      zijn aan een referentiewaarde anders dan die bedoeld in het eerste lid, worden gedekt door de eenheden die deze
      referentiewaarde vertegenwoordigen. Als deze eenheden ontbreken, worden de technische voorzieningen gedekt door
      activa die zo nauw mogelijk aansluiten bij die waarop de betrokken referentiewaarde is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel125
  - number: '125.3'
    text: |-
      Op de technische voorzieningen die rechtstreeks verband houden met de uitkeringen, bedoeld in het eerste en
      tweede lid, zijn, voor zover in die uitkeringen geen sprake is van een gegarandeerd rendement of een gegarandeerd
      uitkeringsniveau, de [artikelen 122][ref1] en [122b tot en met 124][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel120
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '122'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '120'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '126.1'
    text: |-
      Indien de dekking van een levensverzekering of schadeverzekering van een verzekeraar als bedoeld in
      [artikel 122, eerste lid][ref1], in een bepaalde muntsoort is uitgedrukt, zijn de verplichtingen van die
      verzekeraar opeisbaar in deze muntsoort.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '122'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '126.2'
    text: |-
      Indien de dekking van een schadeverzekering niet in een bepaalde muntsoort is uitgedrukt, zijn de verplichtingen
      van de schadeverzekeraar opeisbaar in de muntsoort van de staat waar het risico is gelegen. De schadeverzekeraar
      kan evenwel de muntsoort kiezen waarin de premie is uitgedrukt, indien goede gronden voor een dergelijke keuze
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: '126.3'
    text: |-
      De Nederlandsche Bank kan, op verzoek, toestaan dat de verplichtingen van de schadeverzekeraar opeisbaar zijn in de
      muntsoort die hij overeenkomstig de opgedane ervaring zal gebruiken, of, bij ontstentenis daarvan, de muntsoort van
      de staat waar zich de vestiging bevindt van waaruit de schadeverzekering is aangegaan voor schadeverzekeringen ter
      dekking van de risico’s die zijn ingedeeld in:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: 126.3.a
    text: |-
      de branches Casco rollend spoorwegmaterieel, Luchtvaartuigcasco, Casco zee- en binnenschepen, Vervoerde zaken,
      Aansprakelijkheid luchtvaartuigen, Aansprakelijkheid zee- en binnenschepen en Algemene aansprakelijkheid, voor
      zover het productenaansprakelijkheid betreft; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: 126.3.b
    text: |-
      de andere branches indien overeenkomstig de aard van de risico’s aan de verplichtingen moet worden voldaan in een
      andere muntsoort dan die welke uit de voorgaande leden voortvloeit.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: '126.4'
    text: |-
      Indien uitkeringen ter zake van een schadeverzekering moeten plaatsvinden in een bepaalde andere muntsoort dan
      die welke uit de voorgaande leden voortvloeit, zijn de verplichtingen van de schadeverzekeraar opeisbaar in die
      muntsoort, met name de muntsoort waarin de door de schadeverzekeraar te betalen schadevergoeding is vastgesteld bij
      een rechterlijke uitspraak of bij overeenkomst tussen de schadeverzekeraar en de verzekerde.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: '126.5'
    text: |-
      Indien een schade wordt begroot in een muntsoort die bij de schadeverzekeraar vooraf bekend is, maar die verschilt
      van die welke voortvloeit uit de voorgaande leden, mogen zijn verplichtingen opeisbaar zijn in deze muntsoort.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: '126.6'
    text: |-
      De Nederlandsche Bank kan, op verzoek, besluiten dat het de levensverzekeraar of schadeverzekeraar is toegestaan
      tegenover zijn technische voorzieningen geen waarden te stellen die inbaar of te gelde te maken zijn in de
      muntsoort waarin de dekking van de verzekering luidt, indien uit de voorgaande leden voortvloeit dat de verzekeraar
      om te voldoen aan [artikel 127, eerste lid, eerste volzin][ref1], over waarden in een bepaalde muntsoort moet
      beschikken voor een bedrag van niet meer dan zeven procent van de waarden in andere muntsoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel127
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '127'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '126.7'
    text: |-
      De Nederlandsche Bank kan, op verzoek, aan een levensverzekeraar of schadeverzekeraar ontheffing verlenen van
      [artikel 127, eerste lid, eerste volzin][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel127
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '127'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 126.7.a
    text: de verplichtingen opeisbaar zijn in een andere muntsoort dan die van een van de lidstaten;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: 126.7.b
    text: voor beleggingen in deze muntsoort voorschriften bestaan;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: 126.7.c
    text: voor deze muntsoort transferbeperkingen gelden; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: 126.7.d
    text: |-
      deze muntsoort om soortgelijke redenen ongeschikt is om te worden gebruikt tot dekking van technische
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: '126.8'
    text: |-
      De levensverzekeraar of schadeverzekeraar mag een bedrag van ten hoogste twintig procent van zijn in een bepaalde
      muntsoort luidende verplichtingen dekken met waarden die inbaar of te gelde te maken zijn in een andere muntsoort
      dan die waarin de dekking van de verzekering luidt. De totale waarden in alle muntsoorten tezamen moeten ten minste
      gelijk zijn aan de totale verplichtingen in alle muntsoorten tezamen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: '126.9'
    text: |-
      De Nederlandsche Bank kan, op verzoek, besluiten dat, indien ingevolge de voorgaande leden tegenover verplichtingen
      waarden moeten staan die luiden in de muntsoort van een lidstaat, aan deze voorwaarde eveneens is voldaan indien de
      betreffende waarden in euro luiden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
  - number: '126.10'
    text: |-
      Dit artikel is niet van toepassing op verzekeringen als bedoeld in [artikel 125][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel125
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '125'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '127.1'
    text: |-
      De waarden die dienen tot dekking van de technische voorzieningen van een levensverzekeraar of schadeverzekeraar
      als bedoeld in [artikel 122, eerste lid][ref1], moeten in toereikende mate kunnen worden geïnd of te gelde
      gemaakt in dezelfde muntsoort als die waarin de verplichtingen ingevolge [artikel 126][ref2] luiden. De waarden
      die dienen tot dekking van de technische voorzieningen van een natura-uitvaartverzekeraar als bedoeld in
      [artikel 122, eerste lid][ref3], moeten in toereikende mate kunnen worden geïnd of te gelde gemaakt in de muntsoort
      van de staat waarin de verzekerde ten tijde van het sluiten van de natura-uitvaartverzekering zijn woonplaats
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel122
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '122'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '126'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '122'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '127.2'
    text: |-
      Voor zover de waarden, bedoeld in het eerste lid, eerste volzin, dienen tot dekking van de technische voorzieningen
      voor aangegane verplichtingen, moeten zij:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel127
  - number: 127.2.a
    text: |-
      in geval van een levensverzekeraar of schadeverzekeraar met zetel in Nederland: aanwezig zijn in een lidstaat
      indien wat een levensverzekeraar betreft de verzekeringnemer zijn gewone verblijfplaats in een lidstaat heeft, of,
      indien de verzekeringnemer een rechtspersoon is, de zetel van de verzekeringnemer zich in een lidstaat bevindt, en
      wat een schadeverzekeraar betreft het risico in een lidstaat is gelegen; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel127
  - number: 127.2.b
    text: |-
      in geval van een levensverzekeraar of schadeverzekeraar met zetel in een staat die geen lidstaat is: aanwezig zijn
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel127
  - number: '127.3'
    text: |-
      Voor zover de waarden, bedoeld in het eerste lid, tweede volzin, dienen tot dekking van de technische voorzieningen
      voor de vanuit de vestigingen in Nederland aangegane verplichtingen, moeten zij:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel127
  - number: 127.3.a
    text: 'in geval van een natura-uitvaartverzekeraar met zetel in Nederland: aanwezig zijn in een lidstaat; of'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel127
  - number: 127.3.b
    text: 'in geval van een natura-uitvaartverzekeraar met zetel in een niet-aangewezen staat: aanwezig zijn in Nederland.'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel127
  - number: '128.1'
    text: |-
      De [artikelen 122 tot en met 126][ref1] en [127, eerste en tweede lid][ref2], zijn van
      overeenkomstige toepassing op de waarden, bedoeld in [artikel 3:67, derde lid][ref3], of
