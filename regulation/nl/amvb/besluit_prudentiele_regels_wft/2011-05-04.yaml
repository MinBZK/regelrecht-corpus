  - number: '54'
    text: |-
      De waarden die dienen tot dekking van het minimumbedrag van het garantiefonds, bedoeld in
      [artikel 3:54, derde lid][ref1], of [3:55, tweede lid, van de wet][ref2] zijn aanwezig in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '55.1'
    text: |-
      Ten minste de helft van het minimumbedrag van het garantiefonds, bedoeld in [artikel 54][ref1], wordt gedekt
      door verhandelbare waarden die in open bewaring worden gegeven bij een bank die in Nederland haar bedrijf mag
      uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel54
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '54'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '55.2'
    text: |-
      De Nederlandsche Bank kan, met het oog op het voorkomen van waardevermindering van de waarden, bedoeld in het
      eerste lid, regels stellen met betrekking tot de voorwaarden waaronder die waarden in bewaring kunnen worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel55
  - number: '56.1'
    text: |-
      Een verzekeraar kan met de bank, bedoeld in [artikel 55, eerste lid][ref1], overeenkomen dat deze bij haar
      in bewaring gegeven waarden op naam van de verzekeraar mag overdragen aan een effectenbewaarinstelling die
      rechtspersoon is, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel55
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '55'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: 56.1.a
    text: de nakoming van de verplichtingen van de effectenbewaarinstelling is gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel56
  - number: 56.1.b
    text: |-
      de effectenbewaarinstelling zich jegens de bank heeft verplicht om hetzij die waarden hetzij een gelijke
      hoeveelheid waarden van dezelfde soort op naam van de verzekeraar in haar voorraad aanwezig te houden en na
      beëindiging van de overeenkomst tussen de verzekeraar en de bank af te geven aan de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel56
  - number: '56.2'
    text: |-
      De bank, bedoeld in [artikel 55, eerste lid][ref1], onderscheidenlijk de effectenbewaarinstelling draagt
      zelfstandig zorg voor verkrijging van nieuwe coupon- en dividendbladen en voor bewaargeving in verband met het
      bijwonen van aandeelhoudersvergaderingen door de verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel55
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '55'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '56.3'
    text: |-
      De waarden worden slechts aan de verzekeraar afgegeven en ten aanzien daarvan worden slechts rechtshandelingen
      verricht, indien de Nederlandsche Bank daartoe, op verzoek, heeft besloten. De bank, bedoeld in
      [artikel 55, eerste lid][ref1], onderscheidenlijk de effectenbewaarinstelling mag evenwel vanaf twee weken voor de
      dag der betaalbaarstelling coupons en dividendbewijzen zonder een besluit van de Nederlandsche Bank daartoe aan de
      verzekeraar afgeven, tenzij de Nederlandsche Bank heeft besloten dat zij dat niet mag. De Nederlandsche Bank deelt
      dit besluit onverwijld aan de verzekeraar mede.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel55
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '55'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '56.4'
    text: |-
      De waarden worden op verzoek van de Nederlandsche Bank aan haar ter bewaring afgegeven, indien de bank, bedoeld in
      [artikel 55, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel55
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '55'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: 56.4.a
    text: niet langer in Nederland haar bedrijf mag uitoefenen; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel56
  - number: 56.4.b
    text: |-
      de overeenkomst met de verzekeraar beëindigt dan wel de nakoming van de verplichtingen van de
      effectenbewaarinstelling niet langer waarborgt.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel56
  - number: '56.5'
    text: |-
      De Nederlandsche Bank geeft de waarden onverwijld na de afgifte, bedoeld in het vierde lid, op kosten van de
      verzekeraar in bewaring bij een bank die in Nederland haar bedrijf mag uitoefenen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel56
  - number: '57.1'
    text: |-
      In afwijking van [artikel 49, eerste lid, aanhef en onderdeel d][ref1], bedraagt het minimumbedrag van het
      garantiefonds, bedoeld in [artikel 3:53, vierde lid, van de wet][ref2], € 0 voor de volgende levensverzekeraars:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '49'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 57.1.a
    text: Wederkerige Verzekeringsmaatschappij «Begrafenis Sociëteit» W.A., gevestigd te Edam;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel57
  - number: 57.1.b
    text: Onderling Fonds Sliedrecht B.A., gevestigd te Sliedrecht; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel57
  - number: 57.1.c
    text: Tiels Onderling Fonds tot uitkering bij overlijden «Gustaaf Adolf» U.A., gevestigd te Tiel.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel57
  - number: '57.2'
    text: 'Het eerste lid is slechts van toepassing voor zover de in dat lid genoemde levensverzekeraars:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel57
  - number: 57.2.a
    text: |-
      uitsluitend of nagenoeg uitsluitend uitkeringen bij overlijden verzekeren, waarvan het bedrag per verzekerde niet
      groter is dan het gemiddelde bedrag van de kosten van uitvaart;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel57
  - number: 57.2.b
    text: niet hun bedrijf uitbreiden met een of meer branches voor de uitoefening waarvan zij een vergunning behoeven; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel57
  - number: 57.2.c
    text: niet in een andere lidstaat een bijkantoor openen of aldaar hun bedrijf uitbreiden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel57
  - number: '58.1'
    text: |-
      In afwijking van [artikel 49, eerste lid, aanhef en onderdeel f of g][ref1], bedraagt het minimumbedrag van het
      garantiefonds, bedoeld in [artikel 3:53, vierde lid, van de wet][ref2], € 0 voor schadeverzekeraars met zetel in
      Nederland die:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '49'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 58.1.a
    text: op 1 januari 1986 het bedrijf van schadeverzekeraar uitoefenden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel58
  - number: 58.1.b
    text: |-
      beschikken over een vergunning als bedoeld in [artikel 2:27, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 58.1.c
    text: |-
      gedurende het laatst verstreken boekjaar voor 1 augustus 1978 niet een premie-inkomen van ten minste
      zesmaal de waarde van het minimumbedrag van het garantiefonds zoals dat gold op 1 juli 1994 op grond van de
      [Wet toezicht verzekeringsbedrijf 1993][ref1] hebben geboekt;


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: 58.1.d
    text: niet hun bedrijf uitbreiden met een of meer branches voor de uitoefening waarvan zij een vergunning behoeven; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel58
  - number: 58.1.e
    text: niet in een andere lidstaat een bijkantoor openen of aldaar hun bedrijf uitbreiden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel58
  - number: '58.2'
    text: |-
      Het eerste lid is van toepassing op een in dat lid bedoelde schadeverzekeraar tot het einde van het boekjaar waarin
      deze een premie-inkomen van ten minste zesmaal de waarde van het minimumbedrag van het garantiefonds zoals deze
      gold op 1 juli 1994 op grond van de [Wet toezicht verzekeringsbedrijf 1993][ref1] boekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: '59.1'
    text: |-
      De solvabiliteit, bedoeld in [artikel 3:57, eerste lid, van de wet][ref1] is voldoende indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 59.1.a
    text: |-
      het in aanmerking te nemen toetsingsvermogen, bedoeld in de [artikelen 90 tot en met 94][ref1], ten minste gelijk
      is aan de minimumomvang van het toetsingsvermogen, berekend overeenkomstig de [artikelen 60 tot en met 64][ref2] of
      [paragraaf 10.2][ref3], met inachtneming van de [paragrafen 10.3][ref4] en [10.4][ref5]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '90'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref3
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref4
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.3'
      - id: ref5
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.4'
  - number: 59.1.b
    text: |-
      de aanwezige solvabiliteitsmarge, bedoeld in de [artikelen 95 tot en met 98][ref1], ten minste gelijk is aan het
      minimumbedrag aan solvabiliteitsmarge, berekend overeenkomstig de [artikelen 65 tot en met 68][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel65
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '95'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '65'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '59.2'
    text: |-
      Onverminderd het eerste lid is de solvabiliteit ten minste gelijk aan het ingevolge [artikel 48][ref1]
      voorgeschreven minimumbedrag aan eigen vermogen of het ingevolge [artikel 49][ref2] of [57][ref3] voorgeschreven
      minimumbedrag van het garantiefonds. Zolang [artikel 58, eerste lid][ref4], van toepassing is, is de
      solvabiliteitsmarge van een schadeverzekeraar als bedoeld in dat lid ten minste gelijk aan € 205.000.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel58
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '48'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '49'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '57'
        hoofdstuk: '9'
        paragraaf: '9.4'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: '58'
        hoofdstuk: '9'
        paragraaf: '9.4'
  - number: '60.1'
    text: |-
      De minimumomvang van het toetsingsvermogen van een bank of beleggingsonderneming als bedoeld in
      [artikel 3:57, eerste lid][ref1], of [3:58, eerste lid, van de wet][ref2] of van een clearinginstelling als bedoeld
      in [artikel 3:57, eerste lid][ref3], of [3:61, eerste lid, van de wet][ref4] bedraagt de som van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 60.1.a
    text: |-
      acht procent van de som van de ingevolge [artikel 61][ref1] te berekenen bedragen van de naar risico gewogen
      activa en posten buiten de balanstelling voor de kredietrisico’s, met inbegrip van de tegenpartijkredietrisico’s en
      verwateringsrisico’s, met betrekking tot het totale bedrijf, uitgezonderd de handelsportefeuille en de niet-liquide
      activa van een bank, beleggingsonderneming of clearinginstelling die [artikel 90, tweede lid][ref2], toepast;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel90
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '90'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 60.1.b
    text: |-
      het ingevolge het tweede lid te berekenen bedrag van de met betrekking tot de handelsportefeuille vereiste
      solvabiliteit ter dekking van de positierisico’s, afwikkelingsrisico’s, leveringsrisico’s, tegenpartijrisico’s en,
      in geval van een overschrijding als bedoeld in [artikel 102, eerste of tweede lid][ref1], grote posities;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel102
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '102'
        hoofdstuk: '10'
        paragraaf: '10.8'
  - number: 60.1.c
    text: |-
      het ingevolge het tweede lid te berekenen bedrag van de met betrekking tot het totale bedrijf vereiste
      solvabiliteit ter dekking van de valutarisico’s en grondstoffenrisico’s; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
  - number: 60.1.d
    text: |-
      het ingevolge de [artikelen 62b tot en met 62e][ref1] te berekenen bedrag van de met betrekking tot het totale
      bedrijf vereiste solvabiliteit ter dekking van het operationeel risico.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel62b
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 62b
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '60.2'
    text: |-
      De Nederlandsche Bank stelt nadere regels met betrekking tot de berekening, bedoeld in het eerste lid, onderdelen b
      en c.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
  - number: '60.3'
    text: |-
      De minimumomvang van het toetsingsvermogen van een beleggingsonderneming als bedoeld in het eerste lid waarop
      [artikel 62a][ref1] van toepassing is, bedraagt in elk geval 25 procent van de vaste kosten in het afgelopen
      boekjaar. Indien zij haar werkzaamheden niet gedurende een volledig boekjaar heeft uitgeoefend, bedraagt de
      minimumomvang van het toetsingsvermogen 25 procent van de in haar programma van werkzaamheden begrote vaste
      kosten. De Nederlandsche Bank kan besluiten dat voor de beleggingsonderneming een hogere minimumomvang geldt indien
      aannemelijk is dat de begrote vaste kosten te laag zijn begroot.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel62a
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 62a
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '60.4'
    text: 'De vaste kosten, bedoeld in het derde lid, omvatten alle kosten, uitgezonderd:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
  - number: 60.4.a
    text: |-
      variabele kosten van werknemers wier dienstverband niet onverwijld en zonder schadeloosstelling kan worden
      opgezegd;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
  - number: 60.4.b
    text: kosten van werknemers wier dienstverband onverwijld en zonder schadeloosstelling kan worden opgezegd;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
  - number: 60.4.c
    text: variabele kosten betreffende de voor de beleggingsonderneming verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
  - number: 60.4.d
    text: afschrijvingen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
  - number: 60.4.e
    text: |-
      rentekosten over achtergestelde leningen die ingevolge [artikel 92, derde lid, onderdeel c][ref1], of
      [artikel 93][ref2], deel uitmaken van het toetsingsvermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel93
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '92'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '93'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 60.4.f
    text: buitengewone kosten met een eenmalig karakter; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
  - number: 60.4.g
    text: overige variabele kosten indien de Nederlandsche Bank daartoe, op schriftelijk verzoek, heeft besloten.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
  - number: '60.5'
    text: |-
      De Nederlandsche Bank kan besluiten dat voor een beleggingsonderneming als bedoeld in het eerste lid een
      andere minimumomvang geldt indien sinds het afgelopen boekjaar sprake is van aanzienlijke wijzigingen in dier
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60
  - number: 60a.1
    text: |-
      De minimumomvang van het toetsingsvermogen van een betaalinstelling wordt berekend met toepassing van met de
      Nederlandsche Bank overeengekomen methode A, B of C, genoemd in [bijlage B][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 60a.2
    text: |-
      In afwijking van het eerste lid kan de Nederlandsche Bank indien een evaluatie van de risicobeheersingsprocessen,
      het verzamelen en vastleggen van risicoverliesgegevens en het interne controlesysteem en het
      bedrijfscontinuïteitsbeheer van de betaalinstelling daartoe aanleiding geeft, de betaalinstelling verplichten een
      toetsingsvermogen aan te houden dat ten hoogste 20% hoger is dan het bedrag dat het resultaat is van de toepassing
      van een uit [bijlage B][ref1] gekozen methode, of de betaalinstelling toestaan een toetsingsvermogen aan te houden
      dat ten hoogste 20% lager is dan het bedrag dat het resultaat is van de uit [bijlage B][ref2] gekozen methode.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
      [ref2]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0020420
      - id: ref2
        bwb_id: BWBR0020420
  - number: '61.1'
    text: |-
      Het bedrag van een naar risico gewogen actief of post buiten de balanstelling, bedoeld in
      [artikel 60, eerste lid, onderdeel a][ref1], is gelijk aan zijn vorderingswaarde vermenigvuldigd met het aan
      dat actief of post buiten de balanstelling ingevolge het vijfde lid, onderdeel a, toegekende risicogewicht.
      In afwijking van de vorige volzin wordt het bedrag van een naar risico gewogen post bij gesecuritiseerde
      activa en posten buiten de balanstelling of van een naar risico gewogen securitisatiepositie berekend volgens
      [paragraaf 10.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.4'
  - number: '61.2'
    text: 'Onverminderd het vijfde lid, onderdeel c, is de vorderingswaarde van:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: 61.2.a
    text: een actief gelijk aan zijn balanswaarde;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: 61.2.b
    text: een post buiten de balanstelling met een volledig risico gelijk aan zijn actuele waarde;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: 61.2.c
    text: een post buiten de balanstelling met een middelgroot risico gelijk aan vijftig procent van zijn actuele waarde;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: 61.2.d
    text: |-
      een post buiten de balanstelling met een laag tot middelgroot risico gelijk aan twintig procent van zijn actuele
      waarde; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: 61.2.e
    text: een post buiten de balanstelling met een laag risico gelijk aan nul.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: '61.3'
    text: |-
      De vorderingswaarde, bedoeld in het tweede lid, van effecten of grondstoffen die in het kader van een
      retrocessieovereenkomst, omgekeerde retrocessieovereenkomst, opgenomen effectenlening, verstrekte effectenlening,
      opgenomen grondstoffenlening, verstrekte grondstoffenlening of margeleningstransactie worden verkocht,
      gedeponeerd of verstrekt, wordt indien de financiële onderneming ingevolge [artikel 82, eerste lid][ref1], de
      uitgebreide benadering van financiële zekerheden toepast, verhoogd met de overeenkomstig die benadering berekende
      volatiliteitsaanpassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel82
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '82'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '61.4'
    text: |-
      De vorderingswaarde van een door een volgestorte kredietprotectie gegarandeerd actief of gegarandeerde post buiten
      de balanstelling mag overeenkomstig [paragraaf 10.3][ref1] worden aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '61.5'
    text: 'De Nederlandsche Bank stelt regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: 61.5.a
    text: |-
      de indeling van de activa en posten buiten de balanstelling in categorieën naar gelang de wederpartij en de aan die
      categorieën toe te kennen risicogewichten met inachtneming van [artikel 61a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel61a
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 61a
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 61.5.b
    text: |-
      de indeling van de posten buiten de balanstelling in posten met een volledig risico, posten met een middelgroot
      risico, posten met een middelgroot tot laag risico en posten met een laag risico, bedoeld in het tweede lid,
      onderdelen b tot en met e;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: 61.5.c
    text: |-
      de vorderingswaarde van afgeleide financiële instrumenten als bedoeld in [bijlage C][ref1] en uitstaande
      kredietrisico’s met een centrale tegenpartij die optreedt als exclusieve wederpartij bij overeenkomsten betreffende
      financiële instrumenten waarbij geldt dat het tegenpartijkredietrisico van de centrale tegenpartij ten aanzien van
      alle deelnemers in haar regelingen dagelijks volledig door zekerheden wordt gedekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: '61.6'
    text: |-
      De vorderingswaarde van retrocessieovereenkomsten, omgekeerde retrocessieovereenkomsten, opgenomen
      effectenleningen, verstrekte effectenleningen, opgenomen grondstoffenleningen, verstrekte grondstoffenleningen,
      transacties met afwikkeling op lange termijn of margeleningstransacties mag, met instemming van de Nederlandsche
      Bank, worden bepaald op grond van de door de Nederlandsche Bank te stellen regels, bedoeld in het vijfde lid,
      aanhef en onderdeel c.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: '61.7'
    text: |-
      Op verzoek van een bank, beleggingsonderneming of clearinginstelling als bedoeld in
      [artikel 3:57, eerst lid, van de wet][ref1], kan de Nederlandsche Bank een risicogewicht van nul toestaan voor
      een actief of post buiten de balanstelling van de hiervoor bedoelde financiële ondernemingen indien het betreft
      vorderingen op hun moederondernemingen, dochterondernemingen, dochterondernemingen van hun moederondernemingen
      of ondernemingen waarmee zij verbonden zijn door een betrekking als bedoeld in artikel 12, eerste lid, van de
      richtlijn geconsolideerde jaarrekening, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 61.7.a
    text: |-
      de vordering bestaat op een andere bank, beleggingsonderneming of clearinginstelling, een financiële holding, een
      financiële instelling, of een onderneming die nevendiensten verricht, en deze ondernemingen betrokken zijn in het
      bedrijfseconomische toezicht;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: 61.7.b
    text: de in onderdeel a bedoelde onderneming onderdeel uitmaakt van dezelfde volledige consolidatie;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: 61.7.c
    text: de in onderdeel a bedoelde onderneming aan dezelfde risicobeoordeling, meet- en controleprocedures is onderworpen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: 61.7.d
    text: de in onderdeel a bedoelde onderneming haar zetel heeft in Nederland; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: 61.7.e
    text: |-
      de bank, beleggingsonderneming of clearinginstelling aantoont dat geen feitelijke of juridische belemmeringen
      aanwezig of te voorzien zijn die een onmiddellijke overdracht van toetsingsvermogen of terugbetaling van schulden
      door de in onderdeel a bedoelde ondernemingen aan haar kan verhinderen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
  - number: '61.8'
    text: |-
      Het zevende lid is niet van toepassing op de vermogensbestanddelen, bedoeld in de [artikelen 91, tweede lid][ref1],
      en [92, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel92
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '91'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '92'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 61a.1
    text: |-
      Bij de toekenning van een risicogewicht aan een categorie activa of posten buiten de balanstelling kan een bank,
      beleggingsonderneming of clearinginstelling als bedoeld in [artikel 60, eerste lid][ref1], een kredietbeoordeling
      van een door de Nederlandsche Bank of door een toezichthoudende instantie van een andere lidstaat ingevolge
      [paragraaf 10.5][ref2] erkend kredietbeoordelingsbureau of, ingeval van vorderingen op centrale overheden en
      centrale banken, erkende kredietbeoordelingen van een exportkredietverzekeraar op een consistente wijze gebruiken.
      De Nederlandsche Bank stelt nadere regels met betrekking tot het gebruik van een kredietbeoordeling als bedoeld in
      de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.5'
  - number: 61a.2
    text: |-
      De financiële onderneming gebruikt slechts gevraagde kredietbeoordelingen. De Nederlandsche Bank kan, op verzoek,
      de financiële onderneming toestemming verlenen om ongevraagde kredietbeoordelingen te gebruiken.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61a
  - number: 61a.3
    text: |-
      De Nederlandsche Bank kent op een objectieve en consequente wijze een risicogewicht toe aan kredietbeoordelingen
      als bedoeld in het eerste lid met inachtneming van het volgende:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61a
  - number: 61a.3.a
    text: zij onderscheidt de relatieve risicograden waaraan de kredietbeoordeling uitdrukking geeft;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61a
  - number: 61a.3.b
    text: |-
      in geval van een kredietbeoordelingsbureau dat pas is opgericht of dat over beperkte gegevens met betrekking
      tot wanbetaling beschikt, vraagt zij welke mate van wanbetaling op lange termijn naar het oordeel van het
      kredietbeoordelingsbureau overeenkomt met alle activa of posten buiten de balanstelling waaraan dezelfde
      kredietbeoordeling is toegekend;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61a
  - number: 61a.3.c
    text: |-
      zij vergelijkt de voor elke kredietbeoordeling van een kredietbeoordelingsbureau geconstateerde mate van
      wanbetaling en vergelijkt deze met een referentiewaarde die is opgesteld op basis van de mate van wanbetaling die
      door andere kredietbeoordelingsbureaus zijn geconstateerd bij een groep van uitgevende instellingen waaraan een
      gelijkwaardig kredietrisico is verbonden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61a
  - number: 61a.3.d
    text: |-
      indien zij van oordeel is dat de voor een kredietbeoordeling van een kredietbeoordelingsbureau geconstateerde mate
      van wanbetaling structureel wezenlijk hoger ligt dan de referentiewaarde, kent zij aan de kredietbeoordeling van
      het betreffende kredietbeoordelingsbureau een hoger risicogewicht toe;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61a
  - number: 61a.3.e
    text: |-
      indien zij het aan een kredietbeoordeling toegekende risicogewicht heeft verhoogd en het kredietbeoordelingsbureau
      toont aan dat de voor haar kredietbeoordeling geconstateerde mate van wanbetaling niet langer structureel wezenlijk
      hoger is dan de referentiewaarde, kan zij aan de kredietbeoordeling weer het oorspronkelijke risicogewicht
      toekennen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61a
  - number: 61a.4
    text: |-
      Indien een toezichthoudende instantie van een andere lidstaat op een met het derde lid vergelijkbare wijze een
      risicogewicht heeft toegekend aan de kredietbeoordeling, kan de Nederlandsche Bank deze overnemen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel61a
  - number: '62.1'
    text: |-
      Het is een bank, beleggingsonderneming of clearinginstelling als bedoeld in [artikel 60, eerste lid][ref1],
      toegestaan het bedrag van de met betrekking tot de handelsportefeuille vereiste solvabiliteit ter dekking
      van de positierisico’s, afwikkelingsrisico’s, leveringsrisico’s en tegenpartijrisico’s, bedoeld in
      [artikel 60, eerste lid, onderdeel b][ref2], te berekenen volgens de ingevolge [artikel 61][ref3] gestelde regels
      indien haar handelsportefeuille onder normale omstandigheden:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel61
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 62.1.a
    text: niet meer bedraagt dan vijf procent van het totale bedrijf; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62
  - number: 62.1.b
    text: niet meer bedraagt dan € 15 miljoen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62
  - number: '62.2'
    text: |-
      De Nederlandsche Bank stelt regels met betrekking tot de berekening van de omvang van de handelsportefeuille ten
      opzichte van het totale bedrijf en de grondslagen van die berekening.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62
  - number: '62.3'
    text: |-
      Een financiële onderneming die het eerste lid toepast, geeft hiervan kennis aan de Nederlandsche Bank met een door
      deze na overleg met de financiële onderneming te bepalen frequentie. Een overschrijding van een limiet als bedoeld
      in het eerste lid, onderdeel a of b, meldt de financiële onderneming onverwijld aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62
  - number: '62.4'
    text: |-
      Indien de handelsportefeuille van een financiële onderneming die het eerste lid toepast op enig moment meer dan
      zes procent van haar totale bedrijf uitmaakt of meer dan € 20 miljoen bedraagt, is die toepassing haar vanaf zes
      maanden na die overschrijding niet langer toegestaan.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62
  - number: '62.5'
    text: |-
      De Nederlandsche Bank kan, op verzoek, besluiten dat een financiële onderneming die een der limieten, bedoeld in
      het vierde lid, heeft overschreden, opnieuw het eerste lid toepast indien de financiële onderneming aantoont dat
      zij na de overschrijding gedurende ten minste twee jaren heeft voldaan aan de voorwaarden, bedoeld in het eerste
      lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62
  - number: 62a.1
    text: |-
      Het solvabiliteitsvereiste ter dekking van het operationeel risico, bedoeld in
      [artikel 60, eerste lid, onderdeel d][ref1], is niet van toepassing op beleggingsondernemingen waarvan het
      minimumbedrag aan eigen vermogen op grond van [artikel 48, aanhef en onderdeel g of h][ref2], € 50.000 bedraagt
      of clearinginstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel48
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '48'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 62a.2
    text: |-
      De Nederlandsche Bank kan, op verzoek, toestemming verlenen om het solvabiliteitsvereiste te berekenen op grond van
      het derde lid, aan:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62a
  - number: 62a.2.a
    text: |-
      beleggingsondernemingen waarvan het minimumbedrag aan eigen vermogen op grond van
      [artikel 48, eerste lid, aanhef en onderdelen i, j of k][ref1], € 730.000 bedraagt en die uitsluitend voor eigen
      rekening handelen:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel48
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '48'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 62a.2.a.1°
    text: om orders van cliënten uit te voeren; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62a
  - number: 62a.2.a.2°
    text: |-
      om toegang te verkrijgen tot een clearing- en afwikkelingssysteem dan wel een gereglementeerde markt in de
      hoedanigheid van gemachtigde of uitvoerder van een order van een cliënt; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62a
  - number: 62a.2.b
    text: |-
      beleggingsondernemingen waarvan het minimumbedrag aan eigen vermogen op grond van
      [artikel 48, eerste lid, aanhef en onderdelen i, j of k][ref1], € 730.000 bedraagt en:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel48
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '48'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 62a.2.b.1°
    text: waarbij cliënten geen gelden of effecten aanhouden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62a
  - number: 62a.2.b.2°
    text: die uitsluitend voor eigen rekening handelen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62a
  - number: 62a.2.b.3°
    text: die geen externe cliënten hebben; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62a
  - number: 62a.2.b.4°
    text: |-
      waarvan de uitvoering en afwikkeling van transacties geschieden onder de verantwoordelijkheid van en worden
      gegarandeerd door een clearinginstelling met zetel in Nederland.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62a
  - number: 62a.3
    text: |-
      Indien de Nederlandsche Bank toestemming als bedoeld in het tweede lid heeft verleend, houdt de
      beleggingsonderneming een toetsingsvermogen aan dat ten minste gelijk is aan de som van de bedragen, bedoeld in
      [artikel 60, eerste lid, onderdelen a tot en met c, en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 62b.1
    text: |-
      Een bank of beleggingsonderneming als bedoeld in [artikel 60, eerste lid][ref1], maakt gebruik van de
      basisindicatorbenadering voor de berekening van het bedrag van de met betrekking tot het totale bedrijf vereiste
      solvabiliteit ter dekking van het operationeel risico, bedoeld in [artikel 60, eerste lid, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 62b.2
    text: De Nederlandsche Bank stelt regels met betrekking tot de basisindicatorbenadering.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62b
  - number: 62c.1
    text: |-
      In afwijking van [artikel 62b][ref1] kan een bank of beleggingsonderneming als bedoeld in
      [artikel 60, eerste lid][ref2], gebruik maken van de standaardbenadering voor de berekening van
      het bedrag van de vereiste solvabiliteit ter dekking van het operationeel risico, bedoeld in
      [artikel 60, eerste lid, onderdeel d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel62b
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62c
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 62b
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 62c.2
    text: |-
      Indien de financiële onderneming gebruik maakt van de standaardbenadering worden de activiteiten in een aantal
      business lines gesplitst. Voor elke business line berekent de financiële onderneming het bedrag met betrekking tot
      de vereiste solvabiliteit op grond van door de Nederlandsche Bank te stellen regels.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62c
  - number: 62c.3
    text: |-
      In de standaardbenadering bedraagt het bedrag, bedoeld in het eerste lid, de som van de met betrekking tot het
      totale bedrijf vereiste solvabiliteit voor het operationeel risico in de afzonderlijke business lines.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62c
  - number: 62c.4
    text: |-
      De Nederlandsche Bank stelt regels met betrekking tot de voorwaarden waaraan de financiële onderneming voldoet
      indien zij gebruik wil maken van de standaardbenadering en met betrekking tot de berekening van de vereiste
      solvabiliteit ter dekking van het operationeel risico volgens die benadering.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62c
  - number: 62d.1
    text: |-
      De Nederlandsche Bank kan een bank als bedoeld in [artikel 60, eerste lid][ref1], op verzoek, toestemming verlenen
      om gebruik te maken van een alternatieve indicator voor de berekening van de vereiste solvabiliteit ter dekking van
      het operationeel risico met betrekking tot de business lines «bankdiensten ten behoeve van particulieren en kleine
      en middelgrote ondernemingen» en «zakelijke bankdiensten», indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62d
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 62d.1.a
    text: |-
      deze business lines gezamenlijk ten minste 90 procent van haar netto rentebaten en netto niet-rentebaten
      vertegenwoordigen; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62d
  - number: 62d.1.b
    text: |-
      de bank kan aantonen dat een aanzienlijk deel van haar activiteiten op het gebied van deze business lines
      betrekking heeft op leningen met een grote kans op wanbetalingen en dat de alternatieve indicator een betere
      grondslag biedt om het operationeel risico te berekenen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62d
  - number: 62d.2
    text: De Nederlandsche Bank stelt regels met betrekking tot de alternatieve indicator, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62d
  - number: 62e.1
    text: |-
      Het is een bank of beleggingsonderneming als bedoeld in [artikel 60, eerste lid][ref1], die eenmaal de
      standaardbenadering gebruikt, niet toegestaan daarna alsnog de basisindicatorbenadering te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62e
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 62e.2
    text: |-
      De Nederlandsche Bank kan, op aanvraag, al dan niet voor bepaalde tijd, ontheffing verlenen van het eerste lid,
      indien de aanvrager aantoont dat daarvoor goede redenen zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62e
  - number: 62e.3
    text: |-
      De Nederlandsche Bank kan, op verzoek, toestemming verlenen aan een bank of beleggingsonderneming om de
      standaardbenadering in combinatie met de basisindicatorbenadering toe te passen, indien de financiële onderneming
      de standaardbenadering implementeert overeenkomstig een met de Nederlandsche Bank overeengekomen tijdschema.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel62e
  - number: '63.1'
    text: |-
      De minimumomvang van het toetsingsvermogen van een beheerder van een instelling voor collectieve belegging in
      effecten als bedoeld in [artikel 3:57, eerste lid, van de wet][ref1] bedraagt € 125.000 vermeerderd met twee
      honderdste procent van het bedrag waarmee de waarde van het beheerde vermogen het bedrag van € 250 miljoen te boven
      gaat. De minimumomvang van het toetsingsvermogen bedraagt niet meer dan € 10 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '63.2'
    text: |-
      Tot het beheerde vermogen wordt gerekend het vermogen van de beleggingsinstellingen waarover de beheerder het
      beheer voert met inbegrip van de delen van het vermogen waarvan hij het beheer heeft uitbesteed, uitgezonderd de
      delen van het vermogen waarvan het beheer door derden aan hem is uitbesteed.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel63
  - number: '63.3'
    text: |-
      [Artikel 60, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '64'
    text: |-
      De minimumomvang van het toetsingsvermogen van een elektronischgeldinstelling als bedoeld in
      [artikel 3:57, eerste lid][ref1], of [3:58, eerste lid, van de wet][ref2] bedraagt twee procent van het
      lopende bedrag of het gemiddelde bedrag over de laatste zes maanden van haar totale financiële verplichtingen
      die met uitstaand elektronisch geld verband houden, naar gelang welk bedrag het hoogst is. Indien de
      elektronischgeldinstelling haar werkzaamheden niet gedurende zes maanden heeft uitgeoefend, bedraagt de
      minimumomvang van het toetsingsvermogen twee procent van het lopende bedrag of het blijkens haar programma van
      werkzaamheden op zes maanden nagestreefde bedrag van haar totale financiële verplichtingen die met uitstaand
      elektronisch geld verband houden, naar gelang welk bedrag het hoogst is. De Nederlandsche Bank kan, indien de
      vorige volzin van toepassing is en aannemelijk is dat het nagestreefde bedrag te laag is geschat, besluiten dat
      voor de elektronischgeldinstelling een hogere minimumomvang geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 64a
    text: |-
      Het minimumbedrag aan solvabiliteitsmarge van een herverzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1],
      of [3:61, eerste lid, van de wet][ref2] die zijn bedrijf uitoefent zowel in de activiteit levensherverzekering of
      natura-uitvaartherverzekering, als in de activiteit schadeherverzekering, bedraagt de som van de bedragen, berekend
      ingevolge de [artikelen 64b][ref3] en [64c][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel64b
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel64c
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: 64b
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: 64c
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 64b.1
    text: |-
      Het minimumbedrag aan solvabiliteitsmarge van een herverzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1],
      [3:61, eerste lid][ref2], of [3:62, eerste of tweede lid, van de wet][ref3] die zijn bedrijf uitoefent in de
      activiteit levensherverzekering wordt bepaald overeenkomstig [artikel 64c][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel64c
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: 64c
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 64b.2
    text: |-
      Het minimumbedrag aan solvabiliteitsmarge van een herverzekeraar die zijn bedrijf uitoefent in de activiteit
      levensherverzekering wordt, in afwijking van het eerste lid, bepaald overeenkomstig [artikel 65][ref1] indien
      die activiteit betrekking heeft op de werkzaamheden, bedoeld in artikel 2, punt 1, onderdeel a, voor zover die
      verbonden zijn met beleggingsfondsen of in verband staan met overeenkomsten met winstdeling, en punt 2, onderdelen
      b, c, d en e, van richtlijn nr. 2002/83/EG van het Europees Parlement en de Raad van de Europese Unie van 5
      november 2002 betreffende levensverzekering (PbEU L 345).


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel65
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '65'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 64b.3
    text: |-
      Het minimumbedrag aan solvabiliteitsmarge van een herverzekeraar die zijn bedrijf uitoefent in de activiteit
      natura-uitvaartherverzekering wordt bepaald overeenkomstig [artikel 65][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel65
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '65'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 64c.1
    text: |-
      Het minimumbedrag aan solvabiliteitsmarge van een herverzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1],
      [3:61, eerste lid][ref2], of [3:62, eerste lid, van de wet][ref3] die zijn bedrijf uitoefent in de activiteit
      schadeherverzekering bedraagt het product van het op grond van onderdeel c berekende percentage, vermenigvuldigd
      met het hoogste van de op grond van de onderdelen a en b berekende bedragen. De bedragen en het percentage worden
      als volgt berekend:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 64c.1.a
    text: |-
      achttien procent van de in het voorafgaande boekjaar geboekte dan wel verdiende premies, naargelang welk bedrag
      het hoogst is en van de in rekening gebrachte poliskosten, voor zover deze premies en kosten niet meer bedragen
      dan € 57,5 miljoen, vermeerderd met zestien procent van deze premies en kosten voor zover deze meer bedragen dan €
      57,5 miljoen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: 64c.1.b
    text: |-
      26 procent van de gemiddeld geboekte bruto schaden in de voorafgaande drie boekjaren en van de gemiddelde
      toevoeging aan de schadevoorziening in deze jaren, voor zover deze schaden en toevoeging niet meer bedragen dan €
      40,3 miljoen, vermeerderd met 23 procent van deze schaden en toevoeging, voor zover deze meer bedragen dan € 40,3
      miljoen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: 64c.1.c
    text: |-
      de verhouding, welke ten minste vijftig procent bedraagt, berekend over de voorafgaande drie boekjaren tezamen,
      tussen de schaden die voor eigen rekening komen van de herverzekeraar, na overdracht uit hoofde van retrocessie, en
      de bruto schaden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: 64c.2
    text: |-
      Voor zover het de berekening met betrekking tot de herverzekering van risico’s van de branches Aansprakelijkheid
      luchtvaartuigen, Aansprakelijkheid zee- en binnenschepen en Algemene aansprakelijkheid betreft, worden de
      geboekte dan wel verdiende premies, bedoeld in het eerste lid, onderdeel a, of de geboekte bruto schaden, bedoeld
      in het eerste lid, onderdeel b, met vijftig procent verhoogd. Voor de herverzekering van risico’s van andere
      branches kunnen de geboekte dan wel verdiende premies, bedoeld in het eerste lid, onderdeel a, voor bijzondere
      herverzekeringsactiviteiten of categorieën overeenkomsten worden verhoogd met ten hoogste vijftig procent. De
      Nederlandsche Bank past het percentage toe dat is vastgesteld volgens de procedure van artikel 55, tweede lid,
      van richtlijn nr. 2005/68/EG van het Europees Parlement en de Raad van de Europese Unie van 16 november 2005
      betreffende herverzekering en houdende wijziging van Richtlijnen 73/239/EEG en 92/49/EEG van de Raad en van
      Richtlijnen 98/78/EG en 2002/83/EG van het Europees Parlement en de Raad (PbEU L 323). De Nederlandsche Bank doet
      mededeling van dat percentage in de Staatscourant. Het percentage wordt voor het eerst toegepast in het boekjaar
      dat begint op 1 januari van het op de mededeling volgende kalenderjaar of gedurende dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: 64c.3
    text: |-
      De Nederlandsche Bank kan op aanvraag besluiten dat voor de toerekening van de geboekte dan wel verdiende premies
      of geboekte bruto schaden aan de branches gebruik kan worden gemaakt van statistische methoden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: 64c.4
    text: |-
      Indien het een herverzekeraar betreft die in hoofdzaak risico’s van kredietschade, stormschade, hagelschade of
      vorstschade dekt, wordt in de berekening en de verhouding, bedoeld in het eerste lid, onderdeel b onderscheidenlijk
      onderdeel c, uitgegaan van de voorafgaande zeven boekjaren.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: 64c.5
    text: |-
      Voor de toepassing van dit artikel worden ontvangen premies en betaalde of te betalen schaden in verband met
      herverzekeringen, die ingevolge de internationale jaarrekeningstandaarden niet als zodanig worden aangemerkt, in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: 64c.6
    text: |-
      Indien het minimumbedrag aan solvabiliteitsmarge zoals berekend overeenkomstig dit artikel lager is dan
      het minimumbedrag aan solvabiliteitsmarge van het voorafgaande boekjaar, bedraagt het minimumbedrag aan
      solvabiliteitsmarge ten minste de uitkomst van de volgende berekening: het minimumbedrag aan solvabiliteitsmarge
      van het voorafgaande boekjaar wordt vermenigvuldigd met de verhouding, welke ten hoogste honderd procent bedraagt,
      tussen de bedragen voor technische voorzieningen voor te betalen schaden verminderd met het bedrag van de
      overdrachten uit retrocessie aan het einde van het boekjaar en de bedragen voor technische voorzieningen voor te
      betalen schaden verminderd met het bedrag van de overdrachten uit retrocessie aan het begin van het boekjaar.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: 64c.7
    text: |-
      De Nederlandsche Bank kan besluiten de op retrocessie gebaseerde vermindering, bedoeld in het eerste lid, onderdeel
      c, te beperken indien:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: 64c.7.a
    text: |-
      de aard of de kwaliteit van de overdracht uit hoofde van retrocessie sinds het afgelopen boekjaar sterk is
      gewijzigd; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: 64c.7.b
    text: er nauwelijks risico-overdracht plaatsvindt uit hoofde van retrocessie.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: 64c.8
    text: |-
      [Artikel 49, vierde en vijfde lid][ref1], is van overeenkomstige toepassing op de bedragen, bedoeld in het eerste
      lid, onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel49
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '49'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 64c.9
    text: |-
      De Nederlandsche Bank kan op aanvraag besluiten dat voor de toepassing van het eerste lid, onderdeel c, vorderingen
      op een entiteit voor risico-acceptatie worden beschouwd als overdracht uit hoofde van retrocessie indien de
      zekerheid die een vordering op een entiteit voor risico-acceptatie biedt vergelijkbaar is met de zekerheid van een
      vordering op een herverzekeraar.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel64c
  - number: '65.1'
    text: |-
      Het minimumbedrag aan solvabiliteitsmarge van een levensverzekeraar als bedoeld in
      [artikel 3:57, eerste lid][ref1], of [3:58, eerste of tweede lid, van de wet][ref2] bedraagt de som van de als
      volgt te berekenen bedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 65.1.a
    text: |-
      voor zover het verzekeringen betreft waarbij door de levensverzekeraar beleggingsrisico wordt gelopen: vier procent
      van het bedrag van de bruto technische voorzieningen, vermenigvuldigd met de verhouding, welke ten minste 85
      procent bedraagt, tussen de technische voorzieningen verminderd met het bedrag van de overdrachten uit hoofde van
      herverzekering en de bruto technische voorzieningen aan het eind van het afgelopen boekjaar;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.1.b
    text: |-
      voor zover het verzekeringen betreft waarbij door de levensverzekeraar geen beleggingsrisico wordt gelopen
      en waarbij de beheerslasten voor een periode van meer dan vijf jaar zijn vastgelegd: een procent van de bruto
      technische voorzieningen, vermenigvuldigd met de verhouding, welke ten minste 85 procent bedraagt, tussen de
      technische voorzieningen de overdrachten uit hoofde van herverzekering en de bruto technische voorzieningen aan het
      eind van het afgelopen boekjaar;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.1.c
    text: |-
      voor zover het verzekeringen betreft waarbij door de levensverzekeraar geen beleggingsrisico wordt gelopen
      en waarbij de beheerslasten voor een periode van vijf jaar of minder zijn vastgelegd: 25 procent van de netto
      beheerslasten in verband met de bedrijfsuitoefening in het afgelopen boekjaar;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.1.d
    text: 'voor zover het spaarkassen betreft: een procent van het vermogen van de spaarkassen;'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.1.e
    text: |-
      voor zover het verzekeringen met risicokapitaal betreft, de som van de uitkomsten van de hierna onder 1° tot en met
      3° bedoelde berekeningen, vermenigvuldigd met de verhouding, welke ten minste vijftig procent bedraagt, tussen het
      risicokapitaal verminderd met het bedrag van de overdrachten uit hoofde van herverzekering en het risicokapitaal in
      het afgelopen boekjaar:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.1.e.1°
    text: |-
      tijdelijke verzekeringen met een contractsduur van ten hoogste drie jaar: 0,1 procent van het risicokapitaal bij
      overlijden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.1.e.2°
    text: |-
      tijdelijke verzekeringen met een contractsduur van meer dan drie jaar en ten hoogste vijf jaar: 0,15 procent van
      het risicokapitaal bij overlijden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.1.e.3°
    text: |-
      verzekeringen anders dan tijdelijke verzekeringen met een contractsduur van ten hoogste vijf jaar: 0,3 procent van
      het risicokapitaal bij overlijden;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.1.f
    text: |-
      voor zover het aanvullende verzekeringen betreft: het overeenkomstig
      [artikel 67, eerste, zesde en zevende lid][ref1], berekende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel67
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '67'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '65.2'
    text: |-
      Voor de toepassing van dit artikel wordt het verschil, bedoeld in [artikel 98, derde lid][ref1], aangemerkt als
      bruto technische voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel98
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '98'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: '65.3'
    text: |-
      Voor de toepassing van dit artikel worden verplichtingen uit hoofde van levensverzekeringen waarvoor ingevolge
      de internationale jaarrekeningstandaarden geen technische voorzieningen worden gevormd, aangemerkt als technische
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: '65.4'
    text: |-
      De Nederlandsche Bank kan besluiten de op herverzekering gebaseerde vermindering, bedoeld in het eerste lid,
      onderdeel a, b, e, laatste volzin, of f, te beperken indien:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.4.a
    text: |-
      de aard of de kwaliteit van de overdracht uit hoofde van herverzekering sinds het afgelopen boekjaar sterk is
      gewijzigd; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.4.b
    text: er nauwelijks of geen risico-overdracht plaatsvindt uit hoofde van herverzekering.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: '65.5'
    text: |-
      De Nederlandsche Bank kan op aanvraag besluiten dat voor de toepassing van het eerste lid, onderdelen a en e,
      bedragen die op een entiteit voor risico-acceptatie kunnen worden verhaald, worden beschouwd als een overdracht uit
      hoofde van herverzekering.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: '65.6'
    text: |-
      De [artikelen 64a tot en met 64c][ref1] zijn van overeenkomstige toepassing ten aanzien van de
      herverzekeringsactiviteiten van de levensverzekeraar indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel64a
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 64a
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 65.6.1°
    text: het bedrag aan geïnde herverzekeringspremies hoger is dan tien procent van het totale premie-inkomen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.6.2°
    text: het bedrag aan geïnde herverzekeringspremies hoger is dan € 50 miljoen; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: 65.6.3°
    text: |-
      de technische voorzieningen als gevolg van geaccepteerde herverzekering hoger zijn dan tien procent van de totale
      technische voorzieningen voor het gehele bedrijf.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel65
  - number: '66.1'
    text: |-
      Het minimumbedrag aan solvabiliteitsmarge van een natura-uitvaartverzekeraar als bedoeld in
      [artikel 3:57, eerste lid][ref1], of [3:61, eerste of tweede lid, van de wet][ref2] bedraagt de som van de als
      volgt te berekenen bedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 66.1.a
    text: |-
      voor zover het verzekeringen betreft waarbij door de natura-uitvaartverzekeraar beleggingsrisico wordt gelopen: de
      uitkomst van de berekening, bedoeld in [artikel 65, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel65
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '65'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 66.1.b
    text: |-
      voor zover het verzekeringen betreft waarbij door de natura-uitvaartverzekeraar geen beleggingsrisico wordt gelopen
      en waarbij de beheerslasten voor een periode van meer dan vijf jaar zijn vastgelegd: de uitkomst van de berekening,
      bedoeld in [artikel 65, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel65
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '65'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 66.1.c
    text: 'voor zover het uitstaande depots ten behoeve van uitvaarten betreft: een procent van het depotbedrag;'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel66
  - number: 66.1.d
    text: |-
      voor alle verzekeringen: 0,3 procent van het risicokapitaal bij overlijden, vermenigvuldigd met de verhouding,
      welke ten minste vijftig procent bedraagt, tussen het risicokapitaal verminderd met het bedrag van de overdrachten
      uit hoofde van herverzekering en het risicokapitaal in het afgelopen boekjaar; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel66
  - number: 66.1.e
    text: |-
      voor zover het aanvullende verzekeringen betreft: achttien procent van de in het afgelopen boekjaar geboekte
      premies en van de in rekening gebrachte poliskosten, voor zover deze premies en kosten niet meer bedragen dan €
      10 miljoen, vermeerderd met zestien procent van deze premies en kosten, voor zover deze meer bedragen dan € 10
      miljoen. De uitkomst van de berekening, bedoeld in de vorige volzin, wordt vermenigvuldigd met de verhouding,
      welke ten minste vijftig procent bedraagt, tussen de uitkeringen die voor eigen rekening komen van de natura-
      uitvaartverzekeraar na overdracht uit hoofde van herverzekering en de bruto uitkeringen in het laatste boekjaar.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel66
  - number: '66.2'
    text: |-
      [Artikel 65, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel65
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '65'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '67.1'
    text: |-
      Het minimumbedrag aan solvabiliteitsmarge van een schadeverzekeraar als bedoeld in
      [artikel 3:57, eerste lid][ref1], of [3:58, eerste of tweede lid, van de wet][ref2] bedraagt het product van het
      op grond van onderdeel c van dit lid berekende percentage, vermenigvuldigd met het hoogste van de op grond van de
      onderdelen a en b van dit lid berekende bedragen. De bedragen en het percentage worden als volgt berekend:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 67.1.a
    text: |-
      achttien procent van de in het afgelopen boekjaar geboekte dan wel verdiende premies, naargelang welk bedrag het
      hoogst is en van de in rekening gebrachte poliskosten, voor zover deze premies en kosten niet meer bedragen dan €
      57,5 miljoen, vermeerderd met zestien procent van deze premies en kosten voor zover deze meer bedragen dan € 57,5
      miljoen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
  - number: 67.1.b
    text: |-
      26 procent van de gemiddeld geboekte bruto schaden in de afgelopen drie boekjaren en van de gemiddelde toevoeging
      aan de schadevoorziening in deze jaren, voor zover deze schaden en toevoeging niet meer bedragen dan € 40,3
      miljoen, vermeerderd met 23 procent van deze schaden en toevoeging, voor zover deze meer bedragen dan € 40,3
      miljoen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
  - number: 67.1.c
    text: |-
      de verhouding, welke ten minste vijftig procent bedraagt, tussen de schaden die voor eigen rekening komen van de
      verzekeraar na overdracht uit hoofde van herverzekering en de bruto schaden in de afgelopen drie boekjaren.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
  - number: '67.2'
    text: |-
      Voor zover het de berekening met betrekking tot de branches Aansprakelijkheid luchtvaartuigen, Aansprakelijkheid
      zee- en binnenschepen en Algemene aansprakelijkheid betreft, worden de geboekte dan wel verdiende premies, bedoeld
      in het eerste lid, onderdeel a, of de geboekte bruto schaden, bedoeld in het eerste lid, onderdeel b, met vijftig
      procent verhoogd. De Nederlandsche Bank kan besluiten dat voor de toerekening van de geboekte dan wel verdiende
      premies of geboekte bruto schaden aan de genoemde branches gebruik kan worden gemaakt van statistische methoden.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
  - number: '67.3'
    text: |-
      Voor zover het een schadeverzekeraar betreft die in hoofdzaak ten minste een van de risico’s van kredietschade,
      stormschade, hagelschade of vorstschade dekt, wordt in de berekening en de verhouding, bedoeld in het eerste lid,
      onderdeel b onderscheidenlijk onderdeel c, uitgegaan van de afgelopen zeven boekjaren.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
  - number: '67.4'
    text: |-
      Voor zover het de branche Hulpverlening betreft, wordt voor het bedrag van de geboekte bruto schaden, bedoeld
      in het eerste lid, onderdeel b, uitgegaan van de voor de schadeverzekeraar uit de verleende hulp voortvloeiende
      kosten.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
  - number: '67.5'
    text: |-
      Voor de toepassing van dit artikel wordt de hogekostencompensatie, bedoeld in
      [artikel 1, onderdeel x, van het Besluit zorgverzekering][ref1], aangemerkt als herverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel1
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '1'
  - number: '67.6'
    text: |-
      Voor de toepassing van dit artikel worden ontvangen premies en betaalde of te betalen schaden in verband met
      schadeverzekeringen, die ingevolge de internationale jaarrekeningstandaarden niet als zodanig worden aangemerkt, in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
  - number: '67.7'
    text: |-
      Indien het minimumbedrag aan solvabiliteitsmarge zoals berekend overeenkomstig dit artikel lager is dan
      het minimumbedrag aan solvabiliteitsmarge van het voorafgaande boekjaar, dan bedraagt het minimumbedrag aan
      solvabiliteitsmarge ten minste de uitkomst van de volgende berekening: het minimumbedrag aan solvabiliteitsmarge
      van het voorafgaande boekjaar wordt vermenigvuldigd met de verhouding, welke ten hoogste honderd procent bedraagt,
      tussen de bedragen voor technische voorzieningen voor te betalen schaden verminderd met het bedrag van de
      overdrachten uit herverzekering aan het einde van het boekjaar en de bedragen voor technische voorzieningen voor te
      betalen schaden verminderd met het bedrag van de overdrachten uit herverzekering aan het begin van het boekjaar.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
  - number: '67.8'
    text: |-
      [Artikel 65, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel65
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '65'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '67.9'
    text: |-
      [Artikel 49, vierde en vijfde lid][ref1], is van overeenkomstige toepassing op de bedragen, bedoeld in het eerste
      lid, onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel49
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '49'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: '67.10'
    text: |-
      De Nederlandsche Bank kan op aanvraag besluiten dat voor de toepassing van het eerste lid, onderdeel c, bedragen
      die op een entiteit voor risico-acceptatie kunnen worden verhaald, worden beschouwd als een overdracht uit hoofde
      van herverzekering.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel67
  - number: '68.1'
    text: |-
      Het minimumbedrag aan solvabiliteitsmarge van een herverzekeraar die zijn bedrijf uitoefent in de
      activiteit schadeherverzekering of schadeverzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1],
      [3:58, eerste of tweede lid][ref2], [3:61, eerste lid][ref3], of [3:62, eerste lid, van de wet][ref4] bedraagt
      een derde van het overeenkomstig [artikel 64c][ref5] onderscheidenlijk [artikel 67][ref6] berekende bedrag voor
      het gedeelte dat betrekking heeft op ziektekostenverzekeringen indien die verzekeringen op analoge wijze als
      levensverzekeringen worden beheerd en:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Artikel64c
      [ref6]: https://wetten.overheid.nl/BWBR0020420#Artikel67
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020420
        artikel: 64c
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref6
        bwb_id: BWBR0020420
        artikel: '67'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 68.1.a
    text: de geheven premie volgens verzekeringswiskundige methoden wordt berekend;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel68
  - number: 68.1.b
    text: een actuarieel berekende ouderdomsvoorziening wordt gevormd;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel68
  - number: 68.1.c
    text: een aanvullende premie wordt geheven om een reële veiligheidsmarge te vormen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel68
  - number: 68.1.d
    text: |-
      de herverzekeraar of schadeverzekeraar de ziektekostenverzekering uiterlijk voor het einde van het derde
      verzekeringsjaar kan opzeggen; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel68
  - number: 68.1.e
    text: |-
      in de ziektekostenverzekering de mogelijkheid is opgenomen om ook voor lopende verzekeringen de premies te verhogen
      of de verstrekkingen te verminderen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel68
  - number: '68.2'
    text: |-
      Bij ministeriële regeling kan het minimumbedrag aan solvabiliteitsmarge, bedoeld in het eerste lid, worden
      verhoogd tot ten hoogste het overeenkomstig [artikel 64c][ref1] onderscheidenlijk [artikel 67][ref2] berekende
      bedrag, indien de ingevolge [paragraaf 4.2 van de Zorgverzekeringswet][ref3] gestelde regels met betrekking tot de
      risicoverevening daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel64c
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Paragraaf4.2
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 64c
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '67'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref3
        bwb_id: BWBR0018450
        paragraaf: '4.2'
  - number: '69.1'
    text: |-
      De Nederlandsche Bank kan een bank of beleggingsonderneming als bedoeld in [artikel 3:57, eerste lid][ref1], of
      [3:58, eerste lid, van de wet][ref2], op verzoek, toestemming verlenen om de bedragen van haar naar risico gewogen
      activa of posten buiten de balanstelling in afwijking van [artikel 61][ref3] te berekenen volgens een interne
      modellenmethode, waarbij gebruik wordt gemaakt van eigen ramingen van de kans op wanbetaling. De Nederlandsche
      Bank kan tevens, op verzoek, toestemming verlenen om daarbij gebruik te maken van eigen ramingen van verliezen bij
      wanbetaling en omrekeningsfactoren.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel61
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '69.2'
    text: |-
      De gehanteerde interne modellen voor het beheer en de beoordeling van kredietrisico’s worden zorgvuldig toegepast.
      De Nederlandsche Bank stelt regels met betrekking tot deze interne modellen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel69
  - number: '69.3'
    text: |-
      De toestemming, bedoeld in het eerste lid, wordt verleend indien de financiële onderneming heeft aangetoond dat de
      gehanteerde interne modellen voldoen aan het bepaalde ingevolge het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel69
  - number: '69.4'
    text: |-
      De financiële onderneming die een verzoek voor toestemming voor het gebruik van een interne modellenmethode
      indient, legt bewijsstukken over waaruit blijkt dat zij al ten minste gedurende drie jaar voor de desbetreffende
      categorieën van activa en posten buiten de balanstelling, bedoeld in [artikel 71, eerste lid][ref1], systemen voor
      de beoordeling van kredietrisico’s hanteert die in grote lijnen in overeenstemming zijn met de regels, bedoeld in
      het tweede lid, laatste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '69.5'
    text: |-
      De financiële onderneming die een verzoek voor toestemming voor het gebruik van eigen ramingen van verliezen bij
      wanbetaling en omrekeningsfactoren indient, legt bewijsstukken over waaruit blijkt dat zij al ten minste gedurende
      drie jaar eigen ramingen van verliezen bij wanbetaling of omrekeningsfactoren opstelt en daarvan gebruik maakt op
      een wijze die in grote lijnen in overeenstemming is met de regels, bedoeld in het tweede lid, laatste volzin.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel69
  - number: '69.6'
    text: |-
      Onverminderd de [artikelen 70][ref1] en [76][ref2] gebruikt de financiële onderneming die toestemming heeft
      gekregen voor het gebruik van een interne modellenmethode, deze voor alle activa en posten buiten de balanstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel76
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '70'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '76'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '69.7'
    text: |-
      Indien de financiële onderneming niet langer voldoet aan het eerste tot en met zesde lid of de
      [artikelen 70 tot en met 76][ref1], dient zij bij de Nederlandsche Bank een plan in om zo spoedig mogelijk opnieuw
      aan deze leden en artikelen te voldoen, of toont zij aan dat dit geen noemenswaardige gevolgen voor het gebruik van
      de interne modellenmethode heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel70
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '70'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '70.1'
    text: |-
      De Nederlandsche Bank kan een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1], op
      verzoek, toestemming verlenen een interne modellenmethode stapsgewijs in te voeren:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '69'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 70.1.a
    text: |-
      per categorie of, ingeval van de categorie, bedoeld in [artikel 71, eerste lid, aanhef en onderdeel d][ref1], per
      subcategorie activa of posten buiten de balanstelling, bedoeld in [artikel 71, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel71
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 70.1.b
    text: binnen dezelfde bedrijfsactiviteit;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel70
  - number: 70.1.c
    text: per bedrijfsactiviteit binnen dezelfde groep; of
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel70
  - number: 70.1.d
    text: |-
      voor het gebruik van eigen ramingen van verliezen bij wanbetaling en omrekeningsfactoren voor de berekening van
      risicogewichten voor vorderingen op ondernemingen, banken en beleggingsondernemingen en centrale overheden en
      centrale banken.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel70
  - number: '70.2'
    text: |-
      De Nederlandsche Bank stelt regels teneinde te waarborgen dat de stapsgewijze invoering, bedoeld in het eerste
      lid, binnen een redelijke termijn plaatsvindt en niet wordt gebruikt om voor de categorieën vorderingen of
      bedrijfsactiviteiten, bedoeld in het eerste lid, waarop een interne modellenmethode niet wordt toegepast een lagere
      minimumomvang van het toetsingsvermogen te bereiken.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel70
  - number: '70.3'
    text: |-
      De financiële onderneming die voor enige categorie activa of posten buiten de balanstelling, bedoeld in
      [artikel 71, eerste lid][ref1], een interne modellenmethode gebruikt, gebruikt deze ook voor de posities in
      aandelen, bedoeld in onderdeel e van laatstgenoemd lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '70.4'
    text: |-
      Onverminderd het eerste tot en met derde lid en [artikel 76][ref1] valt de financiële onderneming die ingevolge
      [artikel 69, eerste lid][ref2], toestemming heeft verkregen voor het gebruik van een interne modellenmethode, voor
      de berekening van de bedragen van de naar risico gewogen activa en posten buiten de balanstelling niet terug op
      [artikel 61][ref3], tenzij de Nederlandsche Bank daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel61
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '76'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '69'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '70.5'
    text: |-
      Onverminderd het eerste en tweede lid en [artikel 76][ref1] is het de financiële onderneming die ingevolge
      [artikel 69, eerste lid][ref2], toestemming heeft verkregen voor het gebruik van eigen ramingen van verliezen
      bij wanbetaling en omrekeningsfactoren, niet toegestaan voor de berekening van de bedragen van de naar risico
      gewogen activa en posten buiten de balanstelling daarna alsnog de ingevolge [artikel 73, tweede lid][ref3], door de
      Nederlandsche Bank vastgestelde waarde van verliezen bij wanbetaling en omrekeningsfactoren te gebruiken, tenzij de
      Nederlandsche Bank daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel73
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '76'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '69'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '73'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '71.1'
    text: |-
      Een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1], die een interne modellenmethode
      gebruikt, deelt haar activa en posten buiten de balanstelling volgens een geschikte en in de tijd consistente
      methodiek in de volgende categorieën in:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '69'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 71.1.a
    text: vorderingen of voorwaardelijke vorderingen op centrale overheden en centrale banken;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel71
  - number: 71.1.b
    text: vorderingen of voorwaardelijke vorderingen op banken en beleggingsondernemingen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel71
  - number: 71.1.c
    text: |-
      vorderingen of voorwaardelijke vorderingen op ondernemingen, waaronder vorderingen uit hoofde van gespecialiseerde
      kredietverlening;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel71
  - number: 71.1.d
    text: vorderingen of voorwaardelijke vorderingen op particulieren en op kleine en middelgrote ondernemingen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel71
  - number: 71.1.e
    text: posities in aandelen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel71
  - number: 71.1.f
    text: securitisatieposities; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel71
  - number: 71.1.g
    text: andere activa of posten buiten de balanstelling die geen kredietverplichting vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel71
  - number: '71.2'
    text: |-
      Activa of posten buiten de balanstelling die een kredietverplichting vertegenwoordigen die niet worden ingedeeld
      in een van de categorieën, bedoeld in het eerste lid, onderdelen a, b of d tot en met f, worden ingedeeld in de
      categorie, bedoeld in onderdeel c.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel71
  - number: '71.3'
    text: |-
      De Nederlandsche Bank stelt nadere regels met betrekking tot de indeling in de categorieën, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel71
  - number: '72.1'
    text: |-
      De Nederlandsche Bank stelt, met inachtneming van de [artikelen 73][ref1] en [74][ref2], regels met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel74
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '73'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '74'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 72.1.a
    text: |-
      de berekening van het bedrag van de naar kredietrisico gewogen activa en posten buiten de balanstelling, bedoeld in
      [artikel 71, eerste lid, onderdelen a tot en met e of g][ref1], voor zover dit bedrag niet op het toetsingsvermogen
      in mindering wordt gebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 72.1.b
    text: |-
      de berekening van het bedrag van de naar verwateringsrisico gewogen activa en posten buiten de balanstelling die
      verband houden met gekochte kortlopende handelsvorderingen, met of zonder verhaal op de wederpartij.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel72
  - number: '72.2'
    text: |-
      Het bedrag van een naar risico gewogen post bij gesecuritiseerde activa en posten buiten de balanstelling of van
      een naar risico gewogen securitisatiepositie als bedoeld in [artikel 71, eerste lid, onderdeel f][ref1], wordt
      berekend volgens [paragraaf 10.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.4'
  - number: '73.1'
    text: |-
      De regels, bedoeld in [artikel 72, eerste lid][ref1], voorzien in berekening op basis van de volgende parameters:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel72
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '72'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 73.1.a
    text: de kans op wanbetaling;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel73
  - number: 73.1.b
    text: het verlies bij wanbetaling;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel73
  - number: 73.1.c
    text: de looptijd; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel73
  - number: 73.1.d
    text: |-
      de waarde van de desbetreffende activa of posten buiten de balanstelling, bepaald door onder meer de
      omrekeningsfactoren.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel73
  - number: '73.2'
    text: |-
      De door de Nederlandsche Bank ingevolge [artikel 72, eerste lid][ref1], te stellen regels omvatten mede regels
      met betrekking tot de waarden van verlies bij wanbetaling en de omrekeningsfactoren alsmede voorwaarden voor
      het gebruik van eigen ramingen van de kans op wanbetaling, het verlies bij wanbetaling, de looptijd en de
      omrekeningsfactoren.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel72
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '72'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '73.3'
    text: |-
      In de door haar ingevolge [artikel 72, eerste lid][ref1], te stellen regels kan de Nederlandsche Bank
      afwijken van het eerste lid, voor zover het betreft de berekening van het bedrag van de naar kredietrisico
      gewogen posities in aandelen, bedoeld in [artikel 71, eerste lid, onderdeel e][ref2], waaronder posities in
      instellingen voor collectieve belegging, vorderingen uit hoofde van gespecialiseerde kredietverlening, bedoeld
      in [artikel 71, eerste lid, onderdeel c][ref3], of andere activa of posten buiten de balanstelling die geen
      kredietverplichting vertegenwoordigen, bedoeld in [artikel 71, eerste lid, onderdeel g][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel71
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '72'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '74.1'
    text: |-
      Een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1], die toestemming
      heeft gekregen voor het gebruik van een interne modellenmethode gebruikt voor de berekening
      van het bedrag van de naar risico gewogen activa en posten buiten de balanstelling, bedoeld in
      [artikel 71, eerste lid, onderdelen a tot en met d][ref2], eigen ramingen van de kans op wanbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel71
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '69'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '74.2'
    text: |-
      De financiële onderneming die ingevolge [artikel 69, eerste lid, laatste volzin][ref1], tevens toestemming heeft
      gekregen voor de activa en posten buiten de balanstelling, bedoeld in [artikel 71, eerste lid, onderdeel d][ref2],
      gebruikt voor de berekening van het bedrag van de naar risico gewogen activa en posten buiten de balanstelling
      eigen ramingen van verlies bij wanbetaling en omrekeningsfactoren.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel71
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '69'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '74.3'
    text: |-
      De financiële onderneming gebruikt voor de categorieën, bedoeld in
      [artikel 71, eerste lid, onderdelen a tot en met c][ref1], de ingevolge [artikel 73, tweede lid][ref2], voor
      de berekening van het bedrag van de naar risico gewogen activa en posten buiten de balanstelling vastgestelde
      waarden van verliezen bij wanbetaling en omrekeningsfactoren, tenzij de financiële onderneming, bedoeld in het
      eerste lid, ingevolge [artikel 69, eerste lid, laatste volzin][ref3], tevens toestemming heeft gekregen voor
      die activa en posten buiten de balanstelling. In dat geval gebruikt zij voor de berekening van het bedrag van
      de naar risico gewogen activa en posten buiten de balanstelling eigen ramingen van verliezen bij wanbetaling en
      omrekeningsfactoren.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel69
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '73'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '69'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '75.1'
    text: 'De Nederlandsche Bank stelt regels met betrekking tot de berekening van de verwachte verliesposten in verband met:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel75
  - number: 75.1.a
    text: |-
      activa en posten buiten de balanstelling, bedoeld in [artikel 71, eerste lid, onderdelen a tot en met e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 75.1.b
    text: |-
      posities in instellingen voor collectieve belegging, bedoeld in [artikel 73, derde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel73
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '73'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 75.1.c
    text: het verwateringsrisico van gekochte kortlopende handelsvorderingen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel75
  - number: '75.2'
    text: |-
      De verwachte verliesposten in verband met securitisatieposities, bedoeld in
      [artikel 71, eerste lid, onderdeel f][ref1], worden berekend volgens [paragraaf 10.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
        paragraaf: '10.4'
  - number: '75.3'
    text: |-
      De verwachte verliespost bij activa of posten buiten de balanstelling die geen kredietverplichting
      vertegenwoordigen, bedoeld in [artikel 71, eerste lid, onderdeel g][ref1], is gelijk aan nul.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '76.1'
    text: |-
      De Nederlandsche Bank kan een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1], die bij
      de berekening van het bedrag van de naar risico gewogen activa of posten buiten de balanstelling en de verwachte
      verliesposten voor een of meer categorieën, bedoeld in [artikel 71, eerste lid][ref2], gebruik maakt van een
      interne modellenmethode, op verzoek, toestemming verlenen om de standaardbenadering, bedoeld in [artikel 61][ref3],
      te gebruiken voor activa en posten buiten de balanstelling indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel61
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '69'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 76.1.a
    text: |-
      het activa of posten buiten de balanstelling als bedoeld in [artikel 71, eerste lid, onderdelen a en b][ref1],
      betreft, het aantal wederpartijen beperkt is en het voor de financiële onderneming te belastend zou zijn om voor
      deze wederpartijen een interne modellenmethode in te voeren;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel71
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '71'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 76.1.b
    text: |-
      het activa of posten buiten de balanstelling betreft in verband met niet-belangrijke bedrijfsactiviteiten en in
      categorieën die geen noemenswaardige omvang hebben en waarvan het risicoprofiel als laag wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel76
  - number: 76.1.c
    text: |-
      het vorderingen betreft op de Nederlandse Staat of, indien er op grond van bepaalde publiekrechtelijke
      regelingen geen verschil in risico bestaat tussen de vorderingen op de Nederlandse Staat en deze
      vorderingen, Nederlandse provincies, gemeenten, waterschappen of andere openbare lichamen als
      bedoeld in [artikel 134 van de Grondwet][ref1], en aan vorderingen op de Nederlandse Staat ingevolge
      [artikel 61, vijfde lid, onderdeel a][ref2], een risicogewicht van nul procent is toegekend;


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel61
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 76.1.d
    text: |-
      het vorderingen betreft op een wederpartij die haar moederonderneming, dochteronderneming of een dochteronderneming
      van haar moederonderneming is, indien deze wederpartij een bank, beleggingsonderneming, financiële
      holding, financiële instelling, vermogensbeheerder of onderneming die nevendiensten verricht is waarop de
      [hoofdstukken 9][ref1], [10][ref2] en [13][ref3] van dit besluit van toepassing zijn of een verbonden onderneming
      als bedoeld in artikel 12, eerste lid, van de richtlijn geconsolideerde jaarrekening;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk13
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0020420
        hoofdstuk: '13'
  - number: 76.1.e
    text: |-
      het posities in aandelen betreft van rechtspersonen aan wier kredietverplichtingen ingevolge
      [artikel 61, vijfde lid, onderdeel a][ref1], een risicogewicht van nul procent is toegekend;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel61
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 76.1.f
    text: |-
      het posities in aandelen betreft, ten belope van ten hoogste tien procent van de som van het bedrag van
      het kernkapitaal, bedoeld in [artikel 91][ref1], en het bedrag van het aanvullend kapitaal, bedoeld in
      [artikel 92][ref2], die zijn ingenomen in het kader van overheidsprogramma’s waarmee steun wordt verleend aan
      bepaalde economische sectoren en waarbij de financiële onderneming omvangrijke subsidies ontvangt voor haar
      beleggingen en de beleggingen op de een of andere wijze onderworpen zijn aan overheidstoezicht en restricties;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel92
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '91'
        hoofdstuk: '10'
        paragraaf: '10.6'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '92'
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 76.1.g
    text: |-
      het vorderingen op ondernemingen betreft in de vorm van door de Europese Centrale Bank of een centrale bank van een
      lidstaat voorgeschreven door de financiële onderneming aan te houden minimumreserves; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel76
  - number: 76.1.h
    text: |-
      het overheidsgaranties of door de overheid herverzekerde garanties betreft die voldoen aan door de Nederlandsche
      Bank te stellen regels.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel76
  - number: '76.2'
    text: |-
      Onverminderd de onderdelen a tot en met g van het eerste lid verleent de Nederlandsche Bank de in de aanhef van dat
      lid bedoelde toestemming indien het posities in aandelen als bedoeld in het eerste lid, onderdeel e of f, betreft
      waarvoor in een andere lidstaat toestemming tot het gebruik van de standaardbenadering is verleend.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel76
  - number: '76.3'
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onderdeel b, worden posities in aandelen als omvangrijk beschouwd
      indien de totale waarde ervan, uitgezonderd de in het eerste lid, onderdeel f, genoemde posities in aandelen in het
      voorgaande jaar gemiddeld meer dan tien procent of, indien in minder dan tien individuele bedrijven een positie in
      aandelen is opgebouwd, meer dan vijf procent van het toetsingsvermogen van de financiële onderneming bedraagt.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel76
  - number: '77.1'
    text: |-
      De Nederlandsche Bank kan een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1],
      op verzoek, toestemming verlenen om het bedrag van de vereiste solvabiliteit voor de positierisico’s met
      betrekking tot de handelsportefeuille, bedoeld in [artikel 60, eerste lid, onderdeel b][ref2], of voor de
      valutarisico’s of grondstoffenrisico’s, bedoeld in [artikel 60, eerste lid, onderdeel c][ref3], in afwijking van
      [artikel 60, tweede lid][ref4], te berekenen op basis van interne modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '69'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '77.2'
    text: |-
      De Nederlandsche Bank stelt regels met betrekking tot interne modellen als bedoeld in het eerste lid en het gebruik
      ervan.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel77
  - number: '78.1'
    text: |-
      De Nederlandsche Bank kan een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1], op
      verzoek, toestemming verlenen om het bedrag van de met betrekking tot het totale bedrijf vereiste solvabiliteit ter
      dekking van het operationeel risico, bedoeld in [artikel 60, eerste lid, onderdeel b][ref2], te berekenen op basis
      van de geavanceerde benadering die is gebaseerd op een risicomeetsysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel60
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '69'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '60'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '78.2'
    text: |-
      Alvorens de Nederlandsche Bank toestemming verleent voor de toepassing van de geavanceerde benadering, bedoeld in
      het eerste lid, valideert de Nederlandsche Bank het risicomeetsysteem en toetst zij of de:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel78
  - number: 78.2.a
    text: interne validatieprocedures van de financiële onderneming adequaat functioneren; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel78
  - number: 78.2.b
    text: |-
      datastromen en procedures ten behoeve van het risicomeetsysteem van de financiële onderneming doorzichtig en
      toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel78
  - number: '78.3'
    text: |-
      De Nederlandsche Bank stelt regels met betrekking tot het risicomeetsysteem en het risicobeheersingsysteem voor de
      berekening van de vereiste solvabiliteit ter dekking van het operationeel risico.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel78
  - number: '78.4'
    text: |-
      Indien een Nederlandse EU-moederbeleggingsonderneming of Nederlandse EU-moederkredietinstelling en haar
      dochterondernemingen of de dochterondernemingen van een Nederlandse financiële EU-moederholding een geavanceerde
      benadering voor het operationeel risico centraal toepast, kan de Nederlandsche Bank, op verzoek, toestaan dat de
      moederonderneming en haar dochterondernemingen samen voldoen aan de bij of krachtens dit besluit gestelde regels
      met betrekking tot de geavanceerde benadering.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel78
  - number: '78.5'
    text: De Nederlandsche Bank stelt regels waaraan het verzoek, bedoeld in het vierde lid, moet voldoen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel78
  - number: '79.1'
    text: |-
      Het is een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1], die eenmaal de geavanceerde
      benadering gebruikt, niet toegestaan daarna alsnog de basisindicatorbenadering of standaardbenadering te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '69'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '79.2'
    text: |-
      De Nederlandsche Bank kan, op aanvraag, al dan niet voor bepaalde tijd, ontheffing verlenen van het eerste lid,
      indien de aanvrager aantoont dat daarvoor goede redenen zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel79
  - number: '79.3'
    text: |-
      De Nederlandsche Bank kan, op verzoek, toestemming verlenen aan een financiële onderneming als bedoeld in het
      eerste lid om de geavanceerde benadering in combinatie met de basisindicatorbenadering of standaardbenadering toe
      te passen, indien:
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel79
  - number: 79.3.a
    text: |-
      deze gecombineerde toepassing van benaderingen alle operationele risico’s in aanmerking neemt die de financiële
      onderneming kan lopen;
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel79
  - number: 79.3.b
    text: |-
      zij instemt met de methodiek die de financiële onderneming toepast om de operationele risico’s van haar
      verschillende activiteiten, bedrijfsonderdelen, juridische structuren of andere door haar relevant geachte factoren
      in aanmerking te nemen; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel79
  - number: 79.3.c
    text: wordt voldaan aan de bij of krachtens dit besluit gestelde regels met betrekking tot de gebruikte benaderingen.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel79
  - number: '79.4'
    text: 'De Nederlandsche Bank kan aan de toestemming, bedoeld in het derde lid, het voorschrift verbinden dat:'
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel79
  - number: 79.4.a
    text: |-
      op het moment dat de geavanceerde benadering wordt ingevoerd deze benadering op een aanzienlijk gedeelte van de
      operationele risico’s van de financiële onderneming wordt toegepast; en
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel79
  - number: 79.4.b
    text: |-
      de financiële onderneming de geavanceerde benadering over een aanzienlijk gedeelte van haar activiteiten
      implementeert overeenkomstig een met de Nederlandsche Bank overeengekomen tijdschema.
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel79
  - number: '80'
    text: |-
      Een bank, beleggingsonderneming of clearinginstelling als bedoeld in [artikel 3:57, eerste lid][ref1],
      [3:58, eerste lid][ref2], of [3:61, eerste lid, van de wet][ref3] die het bedrag van de naar risico gewogen
      activa en posten buiten de balanstelling berekent ingevolge [artikel 61][ref4] of [paragraaf 10.2][ref5],
      waarbij zij geen gebruik maakt van eigen ramingen van verliezen bij wanbetaling en omrekeningsfactoren,
      neemt slechts kredietrisicovermindering in aanmerking bij deze berekening of, indien van toepassing, bij
      de berekening van de verwachte verliesposten ingevolge [artikel 92, tweede lid, onderdeel d][ref6], of
      [artikel 94, tweede lid, onderdeel f][ref7], indien is voldaan aan [artikel 81][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel61
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
      [ref6]: https://wetten.overheid.nl/BWBR0020420#Artikel92
      [ref7]: https://wetten.overheid.nl/BWBR0020420#Artikel94
      [ref8]: https://wetten.overheid.nl/BWBR0020420#Artikel81
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
