  - number: 136.2.b
    text: |-
      overige stukken die voortvloeien uit de werkzaamheden, bedoeld in [artikel 3:73 van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2011-05-04#Artikel136
    references:
