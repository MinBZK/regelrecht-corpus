  - number: '24'
    text: |-
      Een beheerder van een instelling voor collectieve belegging in effecten, beleggingsonderneming, betaalinstelling,
      clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie, bank, verzekeraar of bijkantoor
      als bedoeld in [artikel 23, eerste lid][ref1], ziet er op systematische wijze op toe dat de procedures en
      maatregelen, bedoeld in artikel 23, derde lid, worden nageleefd en zorgt ervoor dat gesignaleerde tekortkomingen of
      gebreken worden opgeheven.


