  - number: 24a
    text: |-
      1 Een bank of beleggingsonderneming als bedoeld in [artikel 23, tweede lid, tweede volzin][ref1], beschikt over
      solide, doeltreffende en alomvattende strategieën en procedures aan de hand waarvan zij doorlopend nagaat of en
      ervoor zorgt dat de hoogte, samenstelling en verdeling van haar eigen vermogen aansluiten op de omvang en de aard
      van haar huidige en mogelijk toekomstige risico’s.

      2 De financiële onderneming ziet er op systematische wijze op toe dat de strategieën en procedures, bedoeld in het
      eerste lid, worden nageleefd en zorgt ervoor dat gesignaleerde tekortkomingen of gebreken worden opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
