  - number: '99'
    text: |-
      1 De [artikelen 89][ref1], [95][ref2], [96][ref3], [97, eerste lid][ref4], voor zover dit lid niet de meerwaarden
      op grond van winstverwachtingen betreft, en [98, eerste, derde en vierde lid][ref5], zijn van overeenkomstige
      toepassing op het garantiefonds van een herverzekeraar, levensverzekeraar of natura-uitvaartverzekeraar als
      bedoeld in [artikel 3:57, eerste lid][ref6], [3:58, eerste of tweede lid][ref7], [3:61, eerste lid][ref8],
      onderscheidenlijk [3:62, eerste of tweede lid, van de wet][ref9].

      2 De [artikelen 89][ref10], [95 tot en met 97][ref11] en [98, tweede en derde lid][ref12], zijn van
      overeenkomstige toepassing op het garantiefonds van een natura-uitvaartverzekeraar als bedoeld in
      [artikel 3:57, eerste lid][ref13], of [3:61, eerste of tweede lid, van de wet][ref14].


