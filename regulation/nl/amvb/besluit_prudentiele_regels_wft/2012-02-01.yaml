      1 Voor het deel van de werkzaamheden van een elektronischgeldinstelling dat betrekking heeft op de uitgifte van
      elektronisch geld en betaaldiensten die verband houden met de uitgifte van dit elektronisch geld, bedraagt de
      minimumomvang van het toetsingsvermogen 2% van het gemiddeld uitstaand elektronisch geld.

      2 Voor het deel van de werkzaamheden van een elektronischgeldinstelling dat betrekking heeft op het verlenen
      van betaaldiensten die geen verband houden met de uitgifte van elektronisch geld, wordt de minimumomvang van het
      toetsingsvermogen berekend met overeenkomstige toepassing van [artikel 60a, eerste lid][ref1].

      3 De omvang van het toetsingsvermogen van een elektronischgeldinstelling bedraagt te allen tijde ten minste de
      som van de minimumomvang van het toetsingsvermogen berekend volgens het eerste lid en de minimumomvang van het
      toetsingsvermogen berekend volgens het tweede lid.

      4 Indien een elektronischgeldinstelling de uitgifte van elektronisch geld niet gedurende ten minste zes maanden
      heeft uitgeoefend, bedraagt de minimum omvang van het toetsingsvermogen, bedoeld in het tweede lid, twee procent
      van het uitstaand elektronisch geld of het blijkens haar programma van werkzaamheden na zes maanden nagestreefde
      bedrag aan uitstaand elektronisch geld, naar gelang welk bedrag het hoogst is.

      5 In afwijking van het eerste en tweede lid kan de Nederlandsche Bank indien een evaluatie van de
      risicobeheersingsprocessen, het verzamelen en vastleggen van risicoverliesgegevens en het internecontrolesysteem
      van de elektronischgeldinstelling daartoe aanleiding geeft, de elektronischgeldinstelling verplichten een
      toetsingsvermogen aan te houden dat ten hoogste 20 procent hoger is dan het bedrag dat het resultaat is van de
      toepassing van de methode, bedoeld in het eerste of tweede lid, of de elektronischgeldinstelling toestaan een
      toetsingsvermogen aan te houden dat ten hoogste 20 procent lager is dan het bedrag dat het resultaat is van de
      toepassing van de methode, bedoeld in het eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60a
