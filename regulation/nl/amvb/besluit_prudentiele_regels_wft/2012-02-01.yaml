  - number: '79'
    text: |-
      1 Het is een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1], die eenmaal de
      geavanceerde benadering gebruikt, niet toegestaan daarna alsnog de basisindicatorbenadering of standaardbenadering
      te gebruiken.

      2 De Nederlandsche Bank kan, op aanvraag, al dan niet voor bepaalde tijd, ontheffing verlenen van het eerste lid,
      indien de aanvrager aantoont dat daarvoor goede redenen zijn.

      3 De Nederlandsche Bank kan, op verzoek, toestemming verlenen aan een financiële onderneming als bedoeld in het
      eerste lid om de geavanceerde benadering in combinatie met de basisindicatorbenadering of standaardbenadering toe
      te passen, indien:

      a. deze gecombineerde toepassing van benaderingen alle operationele risico’s in aanmerking neemt die de financiële
      onderneming kan lopen;

      b. zij instemt met de methodiek die de financiële onderneming toepast om de operationele risico’s van haar
      verschillende activiteiten, bedrijfsonderdelen, juridische structuren of andere door haar relevant geachte factoren
      in aanmerking te nemen; en

      c. wordt voldaan aan de bij of krachtens dit besluit gestelde regels met betrekking tot de gebruikte benaderingen.

      4 De Nederlandsche Bank kan aan de toestemming, bedoeld in het derde lid, het voorschrift verbinden dat:

      a. op het moment dat de geavanceerde benadering wordt ingevoerd deze benadering op een aanzienlijk gedeelte van de
      operationele risico’s van de financiële onderneming wordt toegepast; en

      b. de financiële onderneming de geavanceerde benadering over een aanzienlijk gedeelte van haar activiteiten
      implementeert overeenkomstig een met de Nederlandsche Bank overeengekomen tijdschema.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
