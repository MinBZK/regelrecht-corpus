    text: |-
      Een bank of beleggingsonderneming als bedoeld in [artikel 23, tweede lid, tweede volzin][ref1], past systemen toe
      voor de beoordeling en het beheer van het risico dat uit potentiële veranderingen in rentetarieven voortvloeit,
      voor zover deze veranderingen van invloed zijn op de activiteiten buiten de handelsportefeuille van die bank,
      beleggingsonderneming of clearinginstelling.


