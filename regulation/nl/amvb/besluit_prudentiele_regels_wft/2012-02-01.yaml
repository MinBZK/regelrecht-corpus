  - number: '11'
    text: |-
      1 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie, bank,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 3:17, eerste lid][ref1], [3:23][ref2],
      [3:24a][ref3], [3:24b][ref4], [3:26][ref5] of [3:27 van de wet][ref6] beschikt over procedures en maatregelen met
      betrekking tot het tegengaan van verstrengeling van privé-belangen van:

      a. personen die het beleid van de financiële onderneming bepalen;

      b. groepsbestuurders;

      c. leden van het orgaan dat is belast met het toezicht op het beleid en de algemene gang van zaken van de
      financiële onderneming; en

      d. andere werknemers of andere personen die in haar opdracht op structurele basis werkzaamheden voor haar
      verrichten, met haar belangen of die van haar cliënten.

      2 De entiteit voor risico-acceptatie, bank, premiepensioeninstelling of verzekeraar, onderscheidenlijk het
      bijkantoor, beschikt over procedures en maatregelen met betrekking tot het verlenen van financiële diensten
      op basis van personeelscondities aan personen die het beleid van de financiële onderneming bepalen en
      groepsbestuurders.

      3 Financiële dienstverlening door de entiteit voor risico-acceptatie, bank, premiepensioeninstelling of
      verzekeraar, onderscheidenlijk het bijkantoor, op basis van personeelscondities aan personen die het beleid van
      de financiële onderneming bepalen of groepsbestuurders vindt uitsluitend plaats in de normale uitoefening van het
      bedrijf en vindt telkens slechts plaats na instemming door het orgaan dat is belast met het toezicht op het beleid
      en de algemene gang van zaken van de financiële onderneming dan wel namens een daartoe aangewezen orgaan.

      4 Financiële dienstverlening door de entiteit voor risico-acceptatie, bank, premiepensioeninstelling of
      verzekeraar, onderscheidenlijk het bijkantoor, aan personen die het beleid van de financiële onderneming bepalen of
      groepsbestuurders vindt, indien de dienst buiten de grenzen van het bij de financiële onderneming bestaande systeem
      van personeelscondities wordt verleend, uitsluitend plaats in de normale uitoefening van het bedrijf en tegen de
      gebruikelijke commerciële voorwaarden en zekerheden.

      5 Financiële dienstverlening door de entiteit voor risico-acceptatie, bank, premiepensioeninstelling of
      verzekeraar, onderscheidenlijk het bijkantoor, aan leden van het orgaan dat belast is met het toezicht op
      het beleid en de algemene gang van zaken van de financiële onderneming, alsmede aan familieleden, niet zijnde
      personeelsleden, van personen die het beleid van de financiële onderneming bepalen, van groepsbestuurders en van
      leden van het orgaan dat belast is met het toezicht op het beleid en de algemene gang van zaken van de financiële
      onderneming, geschiedt uitsluitend in de normale uitoefening van het bedrijf en tegen de gebruikelijke commerciële
      voorwaarden en zekerheden.


