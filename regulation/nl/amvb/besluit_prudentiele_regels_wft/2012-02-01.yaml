  - number: 62a
    text: |-
      1 Het solvabiliteitsvereiste ter dekking van het operationeel risico, bedoeld in
      [artikel 60, eerste lid, onderdeel d][ref1], is niet van toepassing op beleggingsondernemingen waarvan het
      minimumbedrag aan eigen vermogen op grond van [artikel 48, aanhef en onderdeel g of h][ref2], € 50.000 bedraagt
      of clearinginstellingen.

      2 De Nederlandsche Bank kan, op verzoek, toestemming verlenen om het solvabiliteitsvereiste te berekenen op grond
      van het derde lid, aan:

      a. beleggingsondernemingen waarvan het minimumbedrag aan eigen vermogen op grond van
      [artikel 48, eerste lid, aanhef en onderdelen i, j of k][ref3], € 730.000 bedraagt en die uitsluitend voor eigen
      rekening handelen:

      1°. om orders van cliënten uit te voeren; of

      2°. om toegang te verkrijgen tot een clearing- en afwikkelingssysteem dan wel een gereglementeerde markt in de
      hoedanigheid van gemachtigde of uitvoerder van een order van een cliënt; of

      b. beleggingsondernemingen waarvan het minimumbedrag aan eigen vermogen op grond van
      [artikel 48, eerste lid, aanhef en onderdelen i, j of k][ref4], € 730.000 bedraagt en:

      1°. waarbij cliënten geen gelden of effecten aanhouden;

      2°. die uitsluitend voor eigen rekening handelen;

      3°. die geen externe cliënten hebben; en

      4°. waarvan de uitvoering en afwikkeling van transacties geschieden onder de verantwoordelijkheid van en worden
      gegarandeerd door een clearinginstelling met zetel in Nederland.

      3 Indien de Nederlandsche Bank toestemming als bedoeld in het tweede lid heeft verleend, houdt de
      beleggingsonderneming een toetsingsvermogen aan dat ten minste gelijk is aan de som van de bedragen, bedoeld in
      [artikel 60, eerste lid, onderdelen a tot en met c, en derde lid][ref5].


