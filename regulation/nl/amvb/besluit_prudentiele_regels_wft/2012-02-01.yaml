      1 De vertegenwoordiger van een verzekeraar als bedoeld in [artikel 3:40][ref1], [3:47, tweede lid][ref2]
      of [3:50, tweede lid, van de wet][ref3] houdt op vertegenwoordiger te zijn vanaf de dag van het van
      toepassing verklaren van de schuldsanering natuurlijke personen, de verlening van surseance van betaling, de
      faillietverklaring, de ontbinding, bedoeld in [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref4], de
      onderbewindstelling van een of meer goederen, bedoeld in [titel 19 van Boek 1 van het Burgerlijk Wetboek][ref5], of
      de ondercuratelestelling.

      2 De aanwijzing door de vertegenwoordiger van een natuurlijk persoon die is aangewezen als vertegenwoordiger
      die een rechtspersoon is, vervalt van rechtswege op de dag van het van toepassing verklaren van de
      schuldsaneringsregeling natuurlijke personen, de verlening van surseance van betaling, de faillietverklaring, de
      ontbinding, bedoeld in [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref6], of de ondercuratelestelling van de
      aangewezen natuurlijk persoon alsmede op de dag van verlening van surseance van betaling aan of faillietverklaring
      van de vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel340
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel347
