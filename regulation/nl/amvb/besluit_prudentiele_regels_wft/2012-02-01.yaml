  - number: '117'
    text: |-
      1 De door een verzekeraar als bedoeld in [artikel 114, eerste lid][ref1], aan te houden voorziening voor te betalen
      schaden of voor te betalen uitkeringen omvat het bedrag van de te verwachten schaden, in aanmerking nemende:

      a. de voor de balansdatum ontstane schaden of verplichtingen tot uitkering die zijn gemeld en nog niet zijn
      afgewikkeld en de schaden of verplichtingen tot uitkering die nog niet zijn gemeld;

      b. de kosten die verband houden met de afwikkeling van schaden of uitkeringen; en

      c. de in verband met schaden of uitkeringen te verwachten baten uit subrogatie en de verkrijging van de eigendom
      van verzekerde zaken.

      2 [Artikel 115, tweede lid][ref2], is van overeenkomstige toepassing. In geval van periodiek te betalen uitkeringen
      geschiedt de bepaling volgens erkende actuariële methoden.

      3 Discontering van de voorziening voor te betalen schaden of voor te betalen uitkeringen, anders dan periodieke
      uitkeringen, is slechts toegestaan indien de afwikkeling van de schaden ten minste vier jaren na het tijdstip
      van het opmaken van de jaarrekening zal duren en deze afwikkeling geschiedt volgens een betrouwbaar schade-
      afwikkelingsschema, waarin mede rekening wordt gehouden met alle factoren die de kosten van afwikkeling van de
      schade verhogen. Indien de voorziening voor te betalen schaden of te betalen uitkeringen wordt verminderd ten
      gevolge van discontering van te betalen schaden worden in de toelichting op de balans het bedrag van de voorziening
      voor discontering en de gebruikte methode van discontering vermeld.

      4 Met betrekking tot een communautaire co-assurantie zijn de voorzieningen voor te betalen schaden of voor te
      betalen uitkeringen verhoudingsgewijs ten minste gelijk aan die welke de co-assuradeur die als eerste verzekeraar
      optreedt, aanhoudt volgens de regels of gebruiken die gelden in de lidstaat van waaruit de eerste verzekeraar zijn
      verplichtingen uit hoofde van de communautaire co-assurantie is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel115
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel117
