  - number: '60'
    text: |-
      1 De minimumomvang van het toetsingsvermogen van een bank of beleggingsonderneming als bedoeld in
      [artikel 3:57, eerste lid][ref1], of [3:58, eerste lid, van de wet][ref2] of van een clearinginstelling als bedoeld
      in [artikel 3:57, eerste lid][ref3], of [3:61, eerste lid, van de wet][ref4] bedraagt de som van:

      a. acht procent van de som van de ingevolge [artikel 61][ref5] te berekenen bedragen van de naar risico gewogen
      activa en posten buiten de balanstelling voor de kredietrisico’s, met inbegrip van de tegenpartijkredietrisico’s en
      verwateringsrisico’s, met betrekking tot het totale bedrijf, uitgezonderd de handelsportefeuille en de niet-liquide
      activa van een bank, beleggingsonderneming of clearinginstelling die [artikel 90, tweede lid][ref6], toepast;

      b. het ingevolge het tweede lid te berekenen bedrag van de met betrekking tot de handelsportefeuille vereiste
      solvabiliteit ter dekking van de positierisico’s, afwikkelingsrisico’s, leveringsrisico’s, tegenpartijrisico’s en,
      in geval van een overschrijding als bedoeld in [artikel 102, eerste, tweede en derde lid][ref7], grote posities;

      c. het ingevolge het tweede lid te berekenen bedrag van de met betrekking tot het totale bedrijf vereiste
      solvabiliteit ter dekking van de valutarisico’s, afwikkelingsrisico’s en grondstoffenrisico’s; en

      d. het ingevolge de [artikelen 62b tot en met 62e][ref8] te berekenen bedrag van de met betrekking tot het totale
      bedrijf vereiste solvabiliteit ter dekking van het operationeel risico.

      2 De Nederlandsche Bank stelt nadere regels met betrekking tot de berekening, bedoeld in het eerste lid, onderdelen
      b en c.

      3 De minimumomvang van het toetsingsvermogen van een beleggingsonderneming als bedoeld in het eerste lid waarop
      [artikel 62a][ref9] van toepassing is, bedraagt in elk geval 25 procent van de vaste kosten in het afgelopen
      boekjaar. Indien zij haar werkzaamheden niet gedurende een volledig boekjaar heeft uitgeoefend, bedraagt de
      minimumomvang van het toetsingsvermogen 25 procent van de in haar programma van werkzaamheden begrote vaste
      kosten. De Nederlandsche Bank kan besluiten dat voor de beleggingsonderneming een hogere minimumomvang geldt indien
      aannemelijk is dat de begrote vaste kosten te laag zijn begroot.

      4 De vaste kosten, bedoeld in het derde lid, omvatten alle kosten, uitgezonderd:

      a. variabele kosten van werknemers wier dienstverband niet onverwijld en zonder schadeloosstelling kan worden
      opgezegd;

      b. kosten van werknemers wier dienstverband onverwijld en zonder schadeloosstelling kan worden opgezegd;

      c. variabele kosten betreffende de voor de beleggingsonderneming verrichte werkzaamheden;

      d. afschrijvingen;

      e. rentekosten over achtergestelde leningen die ingevolge [artikel 92, derde lid, onderdeel c][ref10], of
      [artikel 93][ref11], deel uitmaken van het toetsingsvermogen;

      f. buitengewone kosten met een eenmalig karakter; en

      g. overige variabele kosten indien de Nederlandsche Bank daartoe, op schriftelijk verzoek, heeft besloten.

      5 De Nederlandsche Bank kan besluiten dat voor een beleggingsonderneming als bedoeld in het eerste lid een
      andere minimumomvang geldt indien sinds het afgelopen boekjaar sprake is van aanzienlijke wijzigingen in dier
      werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel357
