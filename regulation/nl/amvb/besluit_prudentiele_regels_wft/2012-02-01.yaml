      1 De waarden die dienen tot dekking van het garantiefonds van een bijkantoor als bedoeld in
      [artikel 3:59, eerste lid][ref1], of [3:62, eerste lid, van de wet][ref2] zijn aanwezig in Nederland.

      2 De waarden die dienen tot dekking van het minimumbedrag aan solvabiliteitsmarge van een bijkantoor als bedoeld in
      het eerste lid zijn aanwezig in één of meer lidstaten.


