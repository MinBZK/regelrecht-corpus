  - number: '123'
    text: |-
      1 Onverminderd de [artikelen 122][ref1] en [122b][ref2], worden de waarden die dienen tot dekking van de technische
      voorzieningen van een levensverzekeraar of schadeverzekeraar als bedoeld in [artikel 3:67, eerste lid][ref3], of
      [3:68, eerste lid, van de wet][ref4], ten opzichte van het totaal van de technische voorzieningen, per categorie
      van activa als bedoeld in artikel 122b, eerste lid, verdeeld met inachtneming van de volgende maxima:

      a. leningen als bedoeld in [artikel 122b, eerste lid, onderdeel a, onder 2°][ref5], aan ondernemingen en
      instellingen die geen beleggingsinstelling, bank of verzekeraar met zetel in een lidstaat zijn, voor zover deze
      leningen niet zijn voorzien van een garantie, hypotheek of andere zekerheid: vijf procent;

      b. kasmiddelen: drie procent; en

      c. beleggingen als bedoeld in [artikel 122b, eerste lid, onderdeel a, onder 1°en 3°][ref6], voor zover deze
      beleggingen niet op een gereglementeerde markt worden verhandeld: tien procent.

      2 De waarden die dienen tot dekking van de technische voorzieningen worden, ten opzichte van het totaal van de
      technische voorzieningen, per individueel actief als bedoeld in [artikel 122b, eerste lid][ref7], verdeeld met
      inachtneming van de volgende maxima:

      a. een bepaald terrein of gebouw als bedoeld in [artikel 122b, eerste lid, onderdeel a, onder 5°][ref8], of
      een complex van verschillende terreinen of gebouwen dat als een belegging kan worden beschouwd: tien procent per
      object; en

      b. een bepaalde lening als bedoeld in [artikel 122b, eerste lid, onderdeel a, onder 2°][ref9], aan ondernemingen
      en instellingen die geen beleggingsinstelling, bank of verzekeraar met zetel in een lidstaat zijn, voor zover deze
      leningen niet zijn voorzien van een garantie, hypotheek of andere zekerheid: een procent per lening.

      3 De waarden die dienen tot dekking van de technische voorzieningen bestaan, ten opzichte van het
      totaal van de technische voorzieningen, voor maximaal vijf procent uit beleggingen als bedoeld in
      [artikel 122b, eerste lid, onderdeel a, onder 1° en 3°][ref10], uitgegeven door een bepaalde emittent
      of uit leningen aan een bepaalde kredietnemer, tezamen genomen. Waardepapieren uitgegeven of gegarandeerd
      door onderscheidenlijk leningen aan of gegarandeerd door centrale, regionale of lokale overheidslichamen of
      internationale instellingen of organisaties waarvan een of meer lidstaten deel uitmaken, blijven hierbij buiten
      beschouwing.

      4 De Nederlandsche Bank kan, op verzoek, besluiten het maximum, bedoeld in het eerste lid, onderdeel a, voor
      een levensverzekeraar te verhogen tot acht procent van de technische voorzieningen en het maximum, bedoeld
      in het tweede lid, onderdeel b, tot twee procent van de technische voorzieningen indien de belangen van de
      verzekeringnemers, verzekerden of gerechtigden op uitkeringen zich daartegen niet verzetten.

      5 De Nederlandsche Bank kan, op verzoek, besluiten dat voor de toepassing van het derde lid een bepaalde bank
      met zetel in Nederland met een overheidslichaam wordt gelijkgesteld, indien de aandelen van die bank in handen
      zijn van de Nederlandse Staat of Nederlandse provincies, gemeenten, waterschappen of andere openbare lichamen als
      bedoeld in [artikel 134 van de Grondwet][ref11] en de werkzaamheden van die bank statutair bestaan in het door haar
      tussenkomst verstrekken van leningen aan, of met garantie van de Nederlandse Staat of andere overheidslichamen of
      het vertrekken van leningen aan nauw met de Nederlandse Staat of de lokale overheidslichamen verbonden instanties.

      6 Het maximum, bedoeld in het derde lid, wordt gesteld op tien procent van de technische voorzieningen indien
      de waarden die dienen tot dekking van de technische voorzieningen voor niet meer dan veertig procent bestaan uit
      leningen aan of waardepapieren van kredietnemers en emittenten waarin de verzekeraar meer dan vijf procent van zijn
      activa heeft belegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel122b
