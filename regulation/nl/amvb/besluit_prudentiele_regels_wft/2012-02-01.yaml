  - number: 64c
    text: |-
      1 Het minimumbedrag aan solvabiliteitsmarge van een herverzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1],
      [3:61, eerste lid][ref2], of [3:62, eerste lid, van de wet][ref3] die zijn bedrijf uitoefent in de activiteit
      schadeherverzekering bedraagt het product van het op grond van onderdeel c berekende percentage, vermenigvuldigd
      met het hoogste van de op grond van de onderdelen a en b berekende bedragen. De bedragen en het percentage worden
      als volgt berekend:

      a. achttien procent van de in het voorafgaande boekjaar geboekte dan wel verdiende premies, naargelang welk bedrag
      het hoogst is en van de in rekening gebrachte poliskosten, voor zover deze premies en kosten niet meer bedragen
      dan € 61,3 miljoen, vermeerderd met zestien procent van deze premies en kosten voor zover deze meer bedragen dan €
      61,3 miljoen;

      b. 26 procent van de gemiddeld geboekte bruto schaden in de voorafgaande drie boekjaren en van de gemiddelde
      toevoeging aan de schadevoorziening in deze jaren, voor zover deze schaden en toevoeging niet meer bedragen dan €
      42,9 miljoen, vermeerderd met 23 procent van deze schaden en toevoeging, voor zover deze meer bedragen dan € 42,9
      miljoen;

      c. de verhouding, welke ten minste vijftig procent bedraagt, berekend over de voorafgaande drie boekjaren tezamen,
      tussen de schaden die voor eigen rekening komen van de herverzekeraar, na overdracht uit hoofde van retrocessie, en
      de bruto schaden.

      2 Voor zover het de berekening met betrekking tot de herverzekering van risico’s van de branches Aansprakelijkheid
      luchtvaartuigen, Aansprakelijkheid zee- en binnenschepen en Algemene aansprakelijkheid betreft, worden de
      geboekte dan wel verdiende premies, bedoeld in het eerste lid, onderdeel a, of de geboekte bruto schaden, bedoeld
      in het eerste lid, onderdeel b, met vijftig procent verhoogd. Voor de herverzekering van risico’s van andere
      branches kunnen de geboekte dan wel verdiende premies, bedoeld in het eerste lid, onderdeel a, voor bijzondere
      herverzekeringsactiviteiten of categorieën overeenkomsten worden verhoogd met ten hoogste vijftig procent. De
      Nederlandsche Bank past het percentage toe dat is vastgesteld volgens de procedure van artikel 55, tweede lid,
      van richtlijn nr. 2005/68/EG van het Europees Parlement en de Raad van de Europese Unie van 16 november 2005
      betreffende herverzekering en houdende wijziging van Richtlijnen 73/239/EEG en 92/49/EEG van de Raad en van
      Richtlijnen 98/78/EG en 2002/83/EG van het Europees Parlement en de Raad (PbEU L 323). De Nederlandsche Bank doet
      mededeling van dat percentage in de Staatscourant. Het percentage wordt voor het eerst toegepast in het boekjaar
      dat begint op 1 januari van het op de mededeling volgende kalenderjaar of gedurende dat kalenderjaar.

      3 De Nederlandsche Bank kan op aanvraag besluiten dat voor de toerekening van de geboekte dan wel verdiende premies
      of geboekte bruto schaden aan de branches gebruik kan worden gemaakt van statistische methoden.

      4 Indien het een herverzekeraar betreft die in hoofdzaak risico’s van kredietschade, stormschade, hagelschade of
      vorstschade dekt, wordt in de berekening en de verhouding, bedoeld in het eerste lid, onderdeel b onderscheidenlijk
      onderdeel c, uitgegaan van de voorafgaande zeven boekjaren.

      5 Voor de toepassing van dit artikel worden ontvangen premies en betaalde of te betalen schaden in verband met
      herverzekeringen, die ingevolge de internationale jaarrekeningstandaarden niet als zodanig worden aangemerkt, in
      aanmerking genomen.

      6 Indien het minimumbedrag aan solvabiliteitsmarge zoals berekend overeenkomstig dit artikel lager is dan
      het minimumbedrag aan solvabiliteitsmarge van het voorafgaande boekjaar, bedraagt het minimumbedrag aan
      solvabiliteitsmarge ten minste de uitkomst van de volgende berekening: het minimumbedrag aan solvabiliteitsmarge
      van het voorafgaande boekjaar wordt vermenigvuldigd met de verhouding, welke ten hoogste honderd procent bedraagt,
      tussen de bedragen voor technische voorzieningen voor te betalen schaden verminderd met het bedrag van de
      overdrachten uit retrocessie aan het einde van het boekjaar en de bedragen voor technische voorzieningen voor te
      betalen schaden verminderd met het bedrag van de overdrachten uit retrocessie aan het begin van het boekjaar.

      7 De Nederlandsche Bank kan besluiten de op retrocessie gebaseerde vermindering, bedoeld in het eerste lid,
      onderdeel c, te beperken indien:

      a. de aard of de kwaliteit van de overdracht uit hoofde van retrocessie sinds het afgelopen boekjaar sterk is
      gewijzigd; of

      b. er nauwelijks risico-overdracht plaatsvindt uit hoofde van retrocessie.

      8 [Artikel 49, vierde en vijfde lid][ref4], is van overeenkomstige toepassing op de bedragen, bedoeld in het eerste
      lid, onderdelen a en b.

      9 De Nederlandsche Bank kan op aanvraag besluiten dat voor de toepassing van het eerste lid, onderdeel c,
      vorderingen op een entiteit voor risico-acceptatie worden beschouwd als overdracht uit hoofde van retrocessie
      indien de zekerheid die een vordering op een entiteit voor risico-acceptatie biedt vergelijkbaar is met de
      zekerheid van een vordering op een herverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel357
