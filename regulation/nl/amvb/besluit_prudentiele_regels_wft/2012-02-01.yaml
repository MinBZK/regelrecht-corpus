      1 De vereiste liquiditeit van een bank of clearinginstelling als bedoeld in [artikel 3:63][ref1], [3:64][ref2],
      [3:65][ref3] of [3:66 van de wet][ref4] bedraagt de som van de gewogen uitgaande kasstromen op basis van de
      kalenderposten, vermeerderd met de niet in de vervalkalender opgenomen gewogen toevertrouwde middelen en overige
      posten die opgevraagd kunnen worden of tot een betalingsverplichting kunnen leiden, gedurende de weekperiode
      respectievelijk de maandperiode.

      2 De Nederlandsche Bank stelt regels met betrekking tot de in het eerste lid bedoelde posten en de weging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel363
