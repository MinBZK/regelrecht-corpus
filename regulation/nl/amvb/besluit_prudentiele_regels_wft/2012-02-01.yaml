  - number: '121'
    text: |-
      1 Onverminderd de [artikelen 115][ref1], [116][ref2], [117][ref3] en [119][ref4] voert een verzekeraar als bedoeld
      in [artikel 114, eerste lid][ref5], jaarlijks een toets uit naar de toereikendheid van de balanswaarde van de
      voorzieningen voor:

      a. niet-verdiende premies en lopende risico’s, waaronder de catastrofevoorziening indien deze wordt aangehouden;

      b. levensverzekering;

      c. te betalen schaden of voor te betalen uitkeringen;

      d. winstdeling en kortingen; en

      e. latente winstdelingsverplichtingen.

      De verzekeraar gaat bij de uitvoering van de toets, voor zover van toepassing, uit van toekomstige
      betalingsverplichtingen, daarbij passende onzekerheidsmarges en methoden om toekomstige verplichtingen te waarderen
      op de balansdatum.

      2 Indien discontering wordt gebruikt bij de bepaling van de balanswaarde van de voorzieningen, bedoeld in
      het eerste lid, stelt de Nederlandsche Bank voor de toepassing van de toets, bedoeld in dat lid, onverminderd
      de [artikelen 114][ref6], [116][ref7], [117][ref8] en [119][ref9] en met inachtneming van de internationale
      jaarrekeningstandaarden, regels met betrekking tot de te hanteren grondslagen en rekenprincipes voor de
      disconteringsvoet, sterfte en invaliditeit.

      3 Indien de waarden die dienen tot dekking van de technische voorzieningen niet tegen de actuele waarde zijn
      gewaardeerd, betrekt de verzekeraar het verschil tussen de actuele waarde en de balanswaarde van deze waarden bij
      de toets, bedoeld in het tweede lid.

      4 De balanswaarde van de technische voorzieningen is ten minste gelijk aan de waarde die volgt uit de toets,
      bedoeld in het tweede lid, met inachtneming van het derde lid.


