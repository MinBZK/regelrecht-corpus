  - number: '93'
    text: |-
      Het overig kapitaal wordt gevormd door de waarde van het gestorte deel op kortlopende achtergestelde leningen
      indien:

      a. de achtergestelde lening een looptijd heeft van oorspronkelijk ten minste twee jaar;

      b. de leningovereenkomst geen bepaling bevat op grond waarvan de achtergestelde lening voor het einde van de
      looptijd, anders dan bij liquidatie, moet worden afgelost, tenzij de Nederlandsche Bank daartoe, op verzoek van de
      financiële onderneming, besluit; en

      c. op de achtergestelde lening, indien het toetsingsvermogen minder dan 120 procent bedraagt van de minimumomvang
      van het toetsingsvermogen, bedoeld in [artikel 60][ref1], niet wordt afgelost, tenzij de financiële onderneming
      hiervan kennis geeft aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
