    text: |-
      1 De door een beleggingsonderneming of bank als bedoeld in [artikel 3:72, eerste lid][ref1], of
      [3:82, eerste lid, van de wet][ref2] of door een clearinginstelling als bedoeld in artikel 3:72, eerste lid, of
      [3:86, eerste lid, van de wet][ref3] te verstrekken staten omvatten uitsluitend:

      a. balans- en resultatengegevens alsmede aanvullende financiële gegevens ten behoeve van het toezicht op de
      naleving van het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref4];

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:

      1°. de solvabiliteit ingevolge [artikel 3:57, eerste lid][ref5], [3:58, eerste lid][ref6], of
      [3:61, eerste lid, van de wet][ref7];

      2°. het aanhouden van balansposten en posten buiten de balanstelling ingevolge [artikel 3:57, zesde lid][ref8],
      [3:58, eerste lid][ref9], of [3:61, eerste lid, van de wet][ref10]; en

      3°. de liquiditeit ingevolge [artikel 3:63, eerste lid][ref11], [3:64][ref12] of [3:65 van de wet][ref13].

      2 De door een entiteit voor risico-acceptatie of verzekeraar als bedoeld in
      [artikel 3:72, derde lid, van de wet][ref14] of bijkantoor als bedoeld in [artikel 3:82, tweede lid][ref15], of
      [3:86, tweede lid, van de wet][ref16] te verstrekken staten omvatten uitsluitend:

      a. een jaarrekening alsmede aanvullende financiële gegevens ten behoeve van het toezicht op de naleving van het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref17];

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:

      1°. de solvabiliteit ingevolge [artikel 3:57, eerste lid][ref18], [3:58, eerste of tweede lid][ref19],
      [3:59][ref20], [3:61, eerste of tweede lid][ref21], of [3:62 van de wet][ref22]; en

      2°. de technische voorzieningen ingevolge [artikel 3:67][ref23], [3:68][ref24], [3:68a][ref25], [3:69][ref26] of
      [3:73 van de wet][ref27].

      3 De door een betaalinstelling of elektronischgeldinstelling als bedoeld in
      [artikel 3:72, eerste lid, van de wet][ref28] te verstrekken staten omvatten uitsluitend:

      a. balans- en resultatengegevens alsmede aanvullende financiële gegevens ten behoeve van het toezicht op de
      naleving van het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref29];

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot de solvabiliteit
      ingevolge [artikel 3:57, eerste lid, van de wet][ref30];

      c. voor zover van toepassing een opgave van het gemiddeld uitstaand elektronisch geld.

      4 De door een bijkantoor als bedoeld in [artikel 3:77 van de wet][ref31] te verstrekken staten omvatten uitsluitend
      gegevens ten behoeve van het toezicht op de liquiditeit ingevolge [artikel 3:64][ref32].


