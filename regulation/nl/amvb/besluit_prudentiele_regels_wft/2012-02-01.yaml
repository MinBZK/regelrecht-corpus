  - number: '102'
    text: |-
      1 De waarde van de grote posities van een bank of beleggingsonderneming als bedoeld in
      [artikel 3:57, zesde lid][ref1], of [3:58, eerste lid, van de wet][ref2] of van een clearinginstelling als
      bedoeld in artikel 3:57, zesde lid, of [3:61, eerste lid, van de wet][ref3], is met inachtneming van de
      kredietrisicolimitering, ten aanzien van een wederpartij of groep van verbonden wederpartijen niet groter dan 25
      procent van haar toetsingsvermogen.

      2 Indien de wederpartij een bank of beleggingsonderneming is als bedoeld in het eerste lid of wanneer een groep
      van verbonden wederpartijen een of meer banken of beleggingsondernemingen als bedoeld in het eerste lid omvat,
      kan deze waarde niet meer bedragen dan 25 procent van het toetsingsvermogen van de bank of beleggingsonderneming
      of € 150 miljoen, naargelang welk bedrag het hoogst is, voor zover de som van de waarde van de posities, met
      inaanmerkingneming van het effect van de kredietrisicolimitering, jegens alle verbonden wederpartijen die geen
      bank of beleggingsonderneming zijn, niet meer bedraagt dan 25 procent van het toetsingsvermogen van de bank of
      beleggingsonderneming.

      3 Indien het bedrag van € 150 miljoen groter is dan 25 procent van het toetsingsvermogen van de bank
      of beleggingsonderneming, mag de waarde van de grote positie, met inachtneming van het effect van de
      kredietrisicolimitering, een redelijke limiet, gelet op het toetsingsvermogen van de bank of beleggingsonderneming,
      bedoeld in het eerste lid, niet te boven gaan. Deze limiet wordt door de bank of beleggingsonderneming bepaald
      overeenkomstig het door haar gevoerde beleid ten aanzien van het beheersen van concentratierisico’s, maar mag niet
      groter zijn dan honderd procent van haar toetsingsvermogen.

      4 Het tweede en het derde lid zijn van overeenkomstige toepassing op posities die worden gehouden in geregistreerde
      gedekte obligaties.

      5 De Nederlandsche bank stelt aanvullende regels vast omtrent posities die zijn uitgezonderd van de toepassing van
      het eerste, tweede en derde lid.

      6 Voor de toepassing van dit artikel is de waarde van een actief gelijk aan de balanswaarde en is de waarde van een
      post buiten de balanstelling gelijk aan de actuele waarde. De Nederlandsche Bank stelt nadere regels met betrekking
      tot de waardering van activa en posten buiten de balanstelling voor de toepassing van dit artikel, het geheel of
      gedeeltelijk niet in aanmerking nemen van bepaalde activa of posten buiten de balanstelling voor de toepassing van
      dit artikel en het toepassen van risicogewichten op bepaalde activa en posten buiten de balanstelling.

      7 De financiële onderneming geeft de Nederlandsche Bank onverwijld kennis van een overschrijding van een limiet als
      bedoeld in het eerste, tweede of derde lid. De Nederlandsche Bank kan, op verzoek, besluiten dat het een bank of
      beleggingsonderneming voor een beperkte duur is toegestaan een limiet te overschrijden of in het geval de limiet
      van € 150 miljoen bedoeld in het derde lid van toepassing is, in een uitzonderlijk geval toestaan dat de limiet
      van honderd procent van het eigen vermogen van de bank wordt overschreden. De Nederlandsche Bank stelt regels met
      betrekking tot de voorwaarden waaronder zij een overschrijding toestaat. Zij kan daarbij bepalen dat de eerste
      volzin van dit lid niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel357
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel358
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel361
