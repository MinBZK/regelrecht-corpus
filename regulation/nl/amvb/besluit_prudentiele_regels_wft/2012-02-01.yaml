  - number: '111'
    text: |-
      1 De aanwezige liquiditeit van een bank of clearinginstelling als bedoeld in [artikel 3:63][ref1], [3:64][ref2],
      [3:65][ref3] of [3:66 van de wet][ref4] in de weekperiode wordt gevormd door de gewogen voorraadposten, de gewogen
      kasinstroom van de kalenderposten gedurende de weekperiode en de officiële stand-by faciliteiten.

      2 De financiële onderneming betrekt bij de berekening van de aanwezige liquiditeit in de weekperiode uitsluitend
      de activa die in het kader van het dagelijkse liquiditeitenbeheer aan haar ter beschikking staan teneinde te kunnen
      voorzien in de directe liquiditeitsbehoefte en de inkomende kasstromen uit het kernbedrijf waarmee in het kader van
      het dagelijkse liquiditeitenbeheer rekening wordt gehouden. Daartoe worden in elk geval gerekend:

      a. financiële instrumenten op basis waarvan op korte termijn liquide middelen kunnen worden verkregen door verkoop
      of belening zonder dat dit gepaard gaat met meer dan marginale kosten of verliezen;

      b. onmiddellijk opeisbaar interbancair actief; en

      c. onmiddellijk opeisbare vorderingen op overheden en professionele geldmarktpartijen.

      3 De aanwezige liquiditeit van de financiële onderneming in de maandperiode wordt gevormd door de gewogen
      voorraadposten en de gewogen kasinstroom gedurende de maandperiode.

      4 De financiële onderneming betrekt, onverminderd het eerste en derde lid, bij de berekening van de aanwezige
      liquiditeit het liquiditeitsoverschot van een bijkantoor of een dochtermaatschappij met zetel buiten Nederland,
      welk liquiditeitsoverschot wordt berekend op basis van dit besluit of, indien dit lager is, volgens de in de staat
      van de zetel daarvoor geldende regels, slechts voor zover:

      a. overdracht van het liquiditeitsoverschot niet leidt tot een liquiditeitstekort bij het bijkantoor of de
      dochtermaatschappij volgens de lokale liquiditeitstoetsing;

      b. het om een overschot in convertibele valuta’s gaat; en

      c. vrije en grensoverschrijdende overdracht van liquiditeit mogelijk is.

      5 De financiële onderneming betrekt bij de berekening van de aanwezige liquiditeit niet:

      a. activa die niet onbelemmerd overdraagbaar zijn;

      b. direct opeisbare tegoeden bij personen die geen bank of professionele geldmarktpartij zijn.

      6 De Nederlandsche Bank stelt regels met betrekking tot de in het eerste, tweede en derde lid bedoelde posten en de
      weging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel363
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel364
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel365
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel366
