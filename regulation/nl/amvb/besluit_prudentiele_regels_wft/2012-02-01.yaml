      1 De solvabiliteit, bedoeld in [artikel 3:57, eerste lid, van de wet][ref1] is voldoende indien:

      a. het in aanmerking te nemen toetsingsvermogen, bedoeld in de [artikelen 90 tot en met 94][ref2],
      ten minste gelijk is aan de minimumomvang van het toetsingsvermogen, berekend overeenkomstig de
      [artikelen 60 tot en met 64][ref3] of [paragraaf 10.2][ref4], met inachtneming van de [paragrafen 10.3][ref5] en
      [10.4][ref6]; of

      b. de aanwezige solvabiliteitsmarge, bedoeld in de [artikelen 95 tot en met 98][ref7], ten minste gelijk is aan het
      minimumbedrag aan solvabiliteitsmarge, berekend overeenkomstig de [artikelen 65 tot en met 68][ref8].

      2 Onverminderd het eerste lid is de solvabiliteit ten minste gelijk aan het ingevolge [artikel 48][ref9]
      voorgeschreven minimumbedrag aan eigen vermogen of het ingevolge [artikel 49][ref10] of [57][ref11] voorgeschreven
      minimumbedrag van het garantiefonds. Zolang [artikel 58, eerste lid][ref12], van toepassing is, is de
      solvabiliteitsmarge van een schadeverzekeraar als bedoeld in dat lid ten minste gelijk aan € 205.000.


