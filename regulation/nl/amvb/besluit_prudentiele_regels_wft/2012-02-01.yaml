  - number: '126'
    text: |-
      1 Indien de dekking van een levensverzekering of schadeverzekering van een verzekeraar als bedoeld in
      [artikel 122, eerste lid][ref1], in een bepaalde muntsoort is uitgedrukt, zijn de verplichtingen van die
      verzekeraar opeisbaar in deze muntsoort.

      2 Indien de dekking van een schadeverzekering niet in een bepaalde muntsoort is uitgedrukt, zijn de verplichtingen
      van de schadeverzekeraar opeisbaar in de muntsoort van de staat waar het risico is gelegen. De schadeverzekeraar
      kan evenwel de muntsoort kiezen waarin de premie is uitgedrukt, indien goede gronden voor een dergelijke keuze
      aanwezig zijn.

      3 De Nederlandsche Bank kan, op verzoek, toestaan dat de verplichtingen van de schadeverzekeraar opeisbaar zijn in
      de muntsoort die hij overeenkomstig de opgedane ervaring zal gebruiken, of, bij ontstentenis daarvan, de muntsoort
      van de staat waar zich de vestiging bevindt van waaruit de schadeverzekering is aangegaan voor schadeverzekeringen
      ter dekking van de risico’s die zijn ingedeeld in:

      a. de branches Casco rollend spoorwegmaterieel, Luchtvaartuigcasco, Casco zee- en binnenschepen, Vervoerde zaken,
      Aansprakelijkheid luchtvaartuigen, Aansprakelijkheid zee- en binnenschepen en Algemene aansprakelijkheid, voor
      zover het productenaansprakelijkheid betreft; en

      b. de andere branches indien overeenkomstig de aard van de risico’s aan de verplichtingen moet worden voldaan in
      een andere muntsoort dan die welke uit de voorgaande leden voortvloeit.

      4 Indien uitkeringen ter zake van een schadeverzekering moeten plaatsvinden in een bepaalde andere muntsoort dan
      die welke uit de voorgaande leden voortvloeit, zijn de verplichtingen van de schadeverzekeraar opeisbaar in die
      muntsoort, met name de muntsoort waarin de door de schadeverzekeraar te betalen schadevergoeding is vastgesteld bij
      een rechterlijke uitspraak of bij overeenkomst tussen de schadeverzekeraar en de verzekerde.

      5 Indien een schade wordt begroot in een muntsoort die bij de schadeverzekeraar vooraf bekend is, maar die
      verschilt van die welke voortvloeit uit de voorgaande leden, mogen zijn verplichtingen opeisbaar zijn in deze
      muntsoort.

      6 De Nederlandsche Bank kan, op verzoek, besluiten dat het de levensverzekeraar of schadeverzekeraar is toegestaan
      tegenover zijn technische voorzieningen geen waarden te stellen die inbaar of te gelde te maken zijn in de
      muntsoort waarin de dekking van de verzekering luidt, indien uit de voorgaande leden voortvloeit dat de verzekeraar
      om te voldoen aan [artikel 127, eerste lid, eerste volzin][ref2], over waarden in een bepaalde muntsoort moet
      beschikken voor een bedrag van niet meer dan zeven procent van de waarden in andere muntsoorten.

      7 De Nederlandsche Bank kan, op verzoek, aan een levensverzekeraar of schadeverzekeraar ontheffing verlenen van
      [artikel 127, eerste lid, eerste volzin][ref3], indien:

      a. de verplichtingen opeisbaar zijn in een andere muntsoort dan die van een van de lidstaten;

      b. voor beleggingen in deze muntsoort voorschriften bestaan;

      c. voor deze muntsoort transferbeperkingen gelden; of

      d. deze muntsoort om soortgelijke redenen ongeschikt is om te worden gebruikt tot dekking van technische
      voorzieningen.

      8 De levensverzekeraar of schadeverzekeraar mag een bedrag van ten hoogste twintig procent van zijn in een bepaalde
      muntsoort luidende verplichtingen dekken met waarden die inbaar of te gelde te maken zijn in een andere muntsoort
      dan die waarin de dekking van de verzekering luidt. De totale waarden in alle muntsoorten tezamen moeten ten minste
      gelijk zijn aan de totale verplichtingen in alle muntsoorten tezamen.

      9 De Nederlandsche Bank kan, op verzoek, besluiten dat, indien ingevolge de voorgaande leden tegenover
      verplichtingen waarden moeten staan die luiden in de muntsoort van een lidstaat, aan deze voorwaarde eveneens is
      voldaan indien de betreffende waarden in euro luiden.

      10 Dit artikel is niet van toepassing op verzekeringen als bedoeld in [artikel 125][ref4].


