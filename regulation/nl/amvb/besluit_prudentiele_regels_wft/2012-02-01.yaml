  - number: '62'
    text: |-
      1 Het is een bank, beleggingsonderneming of clearinginstelling als bedoeld in [artikel 60, eerste lid][ref1],
      toegestaan het bedrag van de met betrekking tot de handelsportefeuille vereiste solvabiliteit ter dekking
      van de positierisico’s, afwikkelingsrisico’s, leveringsrisico’s en tegenpartijrisico’s, bedoeld in
      [artikel 60, eerste lid, onderdeel b][ref2], te berekenen volgens de ingevolge [artikel 61][ref3] gestelde regels
      indien haar handelsportefeuille onder normale omstandigheden:

      a. niet meer bedraagt dan vijf procent van het totale bedrijf; en

      b. niet meer bedraagt dan € 15 miljoen.

      2 De Nederlandsche Bank stelt regels met betrekking tot de berekening van de omvang van de handelsportefeuille ten
      opzichte van het totale bedrijf en de grondslagen van die berekening.

      3 Een financiële onderneming die het eerste lid toepast, geeft hiervan kennis aan de Nederlandsche Bank met een
      door deze na overleg met de financiële onderneming te bepalen frequentie. Een overschrijding van een limiet als
      bedoeld in het eerste lid, onderdeel a of b, meldt de financiële onderneming onverwijld aan de Nederlandsche Bank.

      4 Indien de handelsportefeuille van een financiële onderneming die het eerste lid toepast op enig moment meer dan
      zes procent van haar totale bedrijf uitmaakt of meer dan € 20 miljoen bedraagt, is die toepassing haar vanaf zes
      maanden na die overschrijding niet langer toegestaan.

      5 De Nederlandsche Bank kan, op verzoek, besluiten dat een financiële onderneming die een der limieten, bedoeld in
      het vierde lid, heeft overschreden, opnieuw het eerste lid toepast indien de financiële onderneming aantoont dat
      zij na de overschrijding gedurende ten minste twee jaren heeft voldaan aan de voorwaarden, bedoeld in het eerste
      lid, onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
