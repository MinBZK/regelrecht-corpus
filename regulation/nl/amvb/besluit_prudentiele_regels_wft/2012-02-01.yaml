  - number: 87a
    text: |-
      1 Een bank of beleggingsonderneming die niet optreedt als initiator, sponsor of oorspronkelijke kredietverstrekker,
      staat alleen bloot aan het kredietrisico van een securitisatiepositie in of buiten de handelsportefeuille indien
      de initiator, sponsor of oorspronkelijke kredietverstrekker jegens de bank of beleggingsonderneming expliciet te
      kennen heeft gegeven om permanent een materieel netto economisch belang aan te houden van minimaal vijf procent.

      2 Een bank of beleggingsonderneming die optreedt als sponsor of als initiator maakt aan beleggers bekend welk netto
      economisch belang zij in de securitisatie aanhoudt.

      3 De Nederlandsche Bank stelt regels met betrekking tot het aanhouden en meten van het netto economisch belang, de
      relevante informatie over de securitisatie die voor potentiële beleggers beschikbaar moet worden gesteld door als
      sponsor en als initiator optredende banken of beleggingsondernemingen alsmede de verplichtingen die voortvloeien
      uit de securitisatieposities.

      4 Voor het toezicht op geconsolideerde basis op een Nederlandse EU-moederkredietinstelling, een
      Nederlandse EU-moederbeleggingsonderneming of een Nederlandse financiële EU-moederholding, als bedoeld in
      [artikel 1:1 van de wet][ref1] stelt de Nederlandsche Bank nadere regels met betrekking tot het bepaalde in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
