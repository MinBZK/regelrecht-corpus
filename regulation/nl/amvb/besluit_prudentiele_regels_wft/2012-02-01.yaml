  - number: 23a
    text: |-
      1 Een bank als bedoeld in [artikel 3:17, eerste lid][ref1], of [3:23 van de wet][ref2] legt de procedures voor de
      acceptatie, aanpassing, vernieuwing en herfinanciering van kredieten duidelijk vast.

      2 Voor de doorlopende administratie en bewaking van de verschillende portefeuilles en vorderingen waaraan een
      kredietrisico is verbonden, inclusief de detectie en het beheer van probleemkredieten, het verrichten van adequate
      waardeaanpassingen en de vorming van voorzieningen, wordt van doeltreffende systemen gebruik gemaakt.

      3 De bank zorgt ervoor dat de spreiding van de kredietportefeuille aansluit bij de doelmarkten en bij de algemene
      kredietstrategie van de bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel317
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel323
