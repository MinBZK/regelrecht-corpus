  - number: '82'
    text: |-
      1 Een financiële onderneming als bedoeld in [artikel 80, eerste lid][ref1], die kredietrisicovermindering in
      aanmerking neemt, past de berekening van de naar risico gewogen activa en posten buiten de balanstelling en, indien
      van toepassing, de berekening van de verwachte verliesposten aan. De Nederlandsche Bank stelt regels met betrekking
      tot de aanpassing van deze berekeningen.

      2 Het in aanmerking nemen van kredietrisicovermindering levert geen hoger bedrag van de naar risico gewogen activa
      of posten buiten de balanstelling of een hogere verwachte verliespost op dan het bedrag van de naar risico gewogen
      activa of posten buiten de balanstelling onderscheidenlijk de verwachte verliespost van in alle overige opzichten
      identieke activa of posten buiten de balanstelling waarbij geen kredietrisicovermindering in aanmerking wordt
      genomen.

      3 Indien bij de berekening van het bedrag van de naar risico gewogen activa en posten buiten de
      balanstelling ingevolge [artikel 61][ref2], of ingevolge een interne modellenmethode rekening is gehouden met
      kredietrisicovermindering, wordt kredietrisicovermindering ingevolge deze paragraaf niet nogmaals in aanmerking
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel61
