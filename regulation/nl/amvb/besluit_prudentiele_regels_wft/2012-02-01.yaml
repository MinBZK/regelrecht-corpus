      1 Het is een bank of beleggingsonderneming als bedoeld in [artikel 60, eerste lid][ref1], die eenmaal de
      standaardbenadering gebruikt, niet toegestaan daarna alsnog de basisindicatorbenadering te gebruiken.

      2 De Nederlandsche Bank kan, op aanvraag, al dan niet voor bepaalde tijd, ontheffing verlenen van het eerste lid,
      indien de aanvrager aantoont dat daarvoor goede redenen zijn.

      3 De Nederlandsche Bank kan, op verzoek, toestemming verlenen aan een bank of beleggingsonderneming om de
      standaardbenadering in combinatie met de basisindicatorbenadering toe te passen, indien de financiële onderneming
      de standaardbenadering implementeert overeenkomstig een met de Nederlandsche Bank overeengekomen tijdschema.


