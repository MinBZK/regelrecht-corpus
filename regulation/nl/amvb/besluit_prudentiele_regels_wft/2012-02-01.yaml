  - number: '12'
    text: |-
      1 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie, bank,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 11, eerste lid][ref1], beschikt over
      procedures en maatregelen met betrekking tot de omgang met en vastlegging van incidenten.

      2 De financiële onderneming, onderscheidenlijk het bijkantoor, neemt naar aanleiding van een incident maatregelen
      die zijn gericht op het beheersen van de opgetreden risico’s en het voorkomen van herhaling.

      3 De financiële onderneming, onderscheidenlijk het bijkantoor, informeert de Nederlandsche Bank onverwijld omtrent
      incidenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '13'
    text: |-
      1 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie, bank,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 11, eerste lid][ref1], maakt een
      onderbouwde beoordeling van de betrouwbaarheid van personen die zij wil benoemen in een integriteitsgevoelige
      functie.

      2 De financiële onderneming, onderscheidenlijk het bijkantoor, draagt zorg voor de beoordeling van de
      betrouwbaarheid van degenen die, anders dan op grond van een arbeidsovereenkomst, werkzaamheden in een
      integriteitgevoelige functie verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '14'
    text: |-
      1 Een bank, levensverzekeraar, premiepensioeninstelling of bijkantoor als bedoeld in
      [artikel 11, eerste lid][ref1], beschikt met het oog op een integere uitoefening van het bedrijf over procedures en
      maatregelen met betrekking tot de acceptatie van cliënten.

      2 Onverminderd het bepaalde ingevolge de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref2]
      beschikt een bank, levensverzekeraar, premiepensioeninstelling of bijkantoor als bedoeld in het eerste lid, over
      procedures en maatregelen met betrekking tot het vaststellen van de identiteit van cliënten en van de verificatie
      daarvan. De bank, levensverzekeraar, onderscheidenlijk het bijkantoor, accepteert een cliënt niet indien de
      identiteit niet is vastgesteld overeenkomstig het daarvoor opgestelde beleid.

      3 De financiële onderneming, bedoeld in het tweede lid, onderscheidenlijk het bijkantoor, beschikt met het oog
      op een integere uitoefeningvan het bedrijf over organisatorische en administratieve procedures en maatregelen die
      betrekking hebben op risicoclassificaties ten aanzien van cliënten, producten of diensten.

      4 De financiële onderneming, bedoeld in het tweede lid, onderscheidenlijk het bijkantoor, beschikt over procedures
      en maatregelen met betrekking tot de analyse van gegevens van cliënten, mede in relatie tot de door de cliënt
      afgenomen producten of diensten, en terzake van de detectie van afwijkende transactiepatronen. Aan de hand van
      voornoemde procedures en maatregelen bepaalt de financiële onderneming tevens de risico’s van bepaalde cliënten,
      producten of diensten voor de integere uitoefening van haar bedrijf.

      5 De financiële onderneming, bedoeld in het tweede lid, onderscheidenlijk het bijkantoor, draagt zorg voor de
      documentatie en vastlegging met betrekking tot de acceptatie en indeling naar risico van cliënten, de identificatie
      en verificatie van de gegevens van cliënten en de bewaking van het handelen van cliënten. Dergelijke gegevens
      worden tot vijf jaar na de dienstverlening of het beëindigen van de relatie bewaard.

      6 De Nederlandsche Bank kan met het oog op een integere uitoefening van het bedrijf regels stellen met betrekking
      tot het door banken en bijkantoren van banken als bedoeld in het eerste lid te voeren beleid met betrekking tot
      afgeschermde rekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel14
