  - number: '76'
    text: |-
      1 De Nederlandsche Bank kan een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1],
      die bij de berekening van het bedrag van de naar risico gewogen activa of posten buiten de balanstelling en
      de verwachte verliesposten voor een of meer categorieën, bedoeld in [artikel 71, eerste lid][ref2], gebruik
      maakt van een interne modellenmethode, op verzoek, toestemming verlenen om de standaardbenadering, bedoeld in
      [artikel 61][ref3], te gebruiken voor activa en posten buiten de balanstelling indien:

      a. het activa of posten buiten de balanstelling als bedoeld in [artikel 71, eerste lid, onderdelen a en b][ref4],
      betreft, het aantal wederpartijen beperkt is en het voor de financiële onderneming te belastend zou zijn om voor
      deze wederpartijen een interne modellenmethode in te voeren;

      b. het activa of posten buiten de balanstelling betreft in verband met niet-belangrijke bedrijfsactiviteiten en in
      categorieën die geen noemenswaardige omvang hebben en waarvan het risicoprofiel als laag wordt aangemerkt;

      c. het vorderingen betreft op de centrale overheid, regionale overheden, lagere overheden en administratieve
      organen van een lidstaat, indien er op grond van bepaalde publiekrechtelijke regelingen geen verschil
      in risico bestaat tussen de vorderingen op de centrale overheid en de vorderingen op de andere hierboven
      bedoelde overheden en organen, en aan de vorderingen op de centrale overheid van die lidstaat ingevolge
      [artikel 61, vijfde lid, onderdeel a][ref5], een risicogewicht van nul procent is toegekend;

      d. het vorderingen betreft op een wederpartij die haar moederonderneming, dochteronderneming of een
      dochteronderneming van haar moederonderneming is, indien deze wederpartij een bank, beleggingsonderneming,
      financiële holding, financiële instelling, vermogensbeheerder of onderneming die nevendiensten verricht is
      waarop de [hoofdstukken 9][ref6], [10][ref7] en [13][ref8] van dit besluit van toepassing zijn of een verbonden
      onderneming als bedoeld in artikel 12, eerste lid, van de richtlijn geconsolideerde jaarrekening;

      e. het posities in aandelen betreft van rechtspersonen aan wier kredietverplichtingen ingevolge
      [artikel 61, vijfde lid, onderdeel a][ref9], een risicogewicht van nul procent is toegekend;

      f. het posities in aandelen betreft, ten belope van ten hoogste tien procent van de som van het bedrag van
      het kernkapitaal, bedoeld in [artikel 91][ref10], en het bedrag van het aanvullend kapitaal, bedoeld in
      [artikel 92][ref11], die zijn ingenomen in het kader van overheidsprogramma’s waarmee steun wordt verleend aan
      bepaalde economische sectoren en waarbij de financiële onderneming omvangrijke subsidies ontvangt voor haar
      beleggingen en de beleggingen op de een of andere wijze onderworpen zijn aan overheidstoezicht en restricties;

      g. het vorderingen op ondernemingen betreft in de vorm van door de Europese Centrale Bank of een centrale bank van
      een lidstaat voorgeschreven door de financiële onderneming aan te houden minimumreserves; en

      h. het overheidsgaranties of door de overheid herverzekerde garanties betreft die voldoen aan door de Nederlandsche
      Bank te stellen regels.

      2 Onverminderd de onderdelen a tot en met g van het eerste lid verleent de Nederlandsche Bank de in de aanhef
      van dat lid bedoelde toestemming indien het posities in aandelen als bedoeld in het eerste lid, onderdeel e of f,
      betreft waarvoor in een andere lidstaat toestemming tot het gebruik van de standaardbenadering is verleend.

      3 Voor de toepassing van het eerste lid, aanhef en onderdeel b, worden posities in aandelen als omvangrijk
      beschouwd indien de totale waarde ervan, uitgezonderd de in het eerste lid, onderdeel f, genoemde posities in
      aandelen in het voorgaande jaar gemiddeld meer dan tien procent of, indien in minder dan tien individuele bedrijven
      een positie in aandelen is opgebouwd, meer dan vijf procent van het toetsingsvermogen van de financiële onderneming
      bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
