        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '116'
    text: |-
      1 De door een verzekeraar als bedoeld in [artikel 114, eerste lid][ref1], aan te houden voorziening voor
      levensverzekeringen wordt berekend op basis van een voldoende voorzichtige prospectieve actuariële methode,
      rekening houdend met de in de toekomst te ontvangen premies en met alle toekomstige verplichtingen volgens de voor
      iedere lopende levensverzekering gestelde voorwaarden, met inbegrip van:

      a. alle gegarandeerde uitkeringen en gegarandeerde afkoopwaarden;

      b. de winstdelingen waarop de verzekeringnemer, verzekerde of gerechtigde op uitkeringen, collectief dan wel
      individueel recht heeft;

      c. alle keuzemogelijkheden waarover de verzekeringnemer, verzekerde of gerechtigde op uitkeringen, volgens de
      voorwaarden van de levensverzekering beschikt; en

      d. de bedrijfskosten, met inbegrip van provisies.

      2 [Artikel 115, tweede lid][ref2], is van overeenkomstige toepassing.

      3 In afwijking van het eerste lid kan een retrospectieve methode worden toegepast indien de op grond van die
      methode berekende technische voorzieningen niet lager zijn dan de voorzieningen bij toepassing van een prospectieve
      methode of indien het gebruik van een prospectieve methode vanwege de aard van het betrokken type levensverzekering
      niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel115
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel116
