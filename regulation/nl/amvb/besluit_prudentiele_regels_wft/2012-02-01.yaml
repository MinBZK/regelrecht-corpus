  - number: '15'
    text: |-
      1 Een bank of bijkantoor van een bank als bedoeld in [artikel 11, eerste lid][ref1], beschikt over procedures met
      betrekking tot de verstrekking van back-to-back leningen.

      2 Indien de bank of het bijkantoor voornemens is een back-to-back lening te verstrekken, onderzoekt zij of het
      krediet voor legitieme doeleinden gebruikt zal worden.

      3 Indien er een back-to-back lening wordt verstrekt, legt de bank of het bijkantoor de overeenkomst met vermelding
      van de gestelde essentiële zekerheden, deugdelijk vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '16'
    text: |-
      1 Een financiële onderneming of bijkantoor als bedoeld in [artikel 11, eerste lid][ref1], onderzoekt, op verzoek
      van de Nederlandsche Bank, of in haar administratie bepaalde personen of instellingen voorkomen die naar het
      oordeel van Onze Minister, in verband met vermoede terroristische activiteiten of daarmee verband houdende
      activiteiten, de integriteit van de financiële sector kunnen schaden.

      2 De financiële onderneming verstrekt de uitkomst van het in het eerste lid bedoelde onderzoek, binnen een door de
      Nederlandsche Bank te stellen termijn, aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel16
