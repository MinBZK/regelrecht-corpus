  - number: '94'
    text: |-
      1 Voor de toepassing van de [artikelen 90 tot en met 93][ref1]:

      a. wordt het kernkapitaal volledig voor de berekening van het toetsingsvermogen in aanmerking genomen;

      b. wordt het aanvullend kapitaal voor de berekening van het toetsingsvermogen slechts in aanmerking genomen voor
      zover het niet meer bedraagt dan het kernkapitaal;

      c. wordt het lager aanvullend kapitaal voor de berekening van het toetsingsvermogen slechts in aanmerking genomen
      voor zover het niet meer bedraagt dan vijftig procent van het kernkapitaal;

      d. wordt het overig kapitaal voor de berekening van het toetsingsvermogen in aanmerking genomen voor zover het
      niet meer bedraagt dan tweehonderdvijftig procent van het kernkapitaal dat in aanmerking komt ter dekking van deze
      bedragen en dat vereiste;

      e. wordt het aanvullend kapitaal, vermeerderd met het overig kapitaal, voor de berekening van het toetsingsvermogen
      slechts in aanmerking genomen voor zover het niet meer bedraagt dan het kernkapitaal; en

      f. mag, indien wordt voldaan aan de onderdelen b, c en e, voor de berekening van het toetsingsvermogen het overig
      kapitaal worden gesubstitueerd door aanvullend kapitaal.

      2 Het ingevolge het eerste lid als toetsingsvermogen in aanmerking te nemen kernkapitaal en aanvullend kapitaal van
      een bank, beleggingsonderneming, betaalinstelling, clearinginstelling of elektronischgeldinstelling als bedoeld in
      [artikel 90, eerste lid][ref2], worden beide verminderd met de helft van de som van de waarde van:

      a. aandelen die een belang van meer dan tien procent vertegenwoordigen van het geplaatste aandelenkapitaal van een
      financiële instelling of bank;

      b. indien de bank, beleggingsonderneming, betaalinstelling, clearinginstelling of elektronischgeldinstelling
      een belang als bedoeld in onderdeel a aanhoudt, de achtergestelde leningen en de posten, bedoeld in
      [artikel 92, tweede lid, onderdelen b en c, en derde lid, onderdelen b en c][ref3], die tot het toetsingsvermogen
      van de financiële instelling of bank gerekend worden;

      c. aandelen die een belang van tien procent of minder vertegenwoordigen van het geplaatste
      aandelenkapitaal van een financiële instelling of bank, achtergestelde leningen en posten, bedoeld in
      [artikel 92, tweede lid, onderdelen b en c, en derde lid, onderdelen b en c][ref4], die tot het toetsingsvermogen
      van andere dan de in onderdeel b bedoelde financiële instellingen of banken gerekend worden, voor zover de waarde
      tien procent van het in aanmerking te nemen toetsingsvermogen van de bank, beleggingsonderneming, betaalinstelling,
      clearinginstelling of elektronischgeldinstelling zonder toepassing van dit lid overstijgt, en indien de
      genoemde posten deel uitmaken van de handelsportefeuille van de bank, beleggingsonderneming, betaalinstelling,
      clearinginstelling of elektronischgeldinstelling voor zover de waarde per individuele financiële instelling of bank
      tien procent van het in aanmerking te nemen toetsingsvermogen van de bank, beleggingsonderneming, betaalinstelling,
      clearinginstelling of elektronischgeldinstelling zonder toepassing van dit lid overstijgt;

      d. deelnemingen als bedoeld in [artikel 3:268, eerste lid, onderdeel b, van de wet][ref5] in een entiteit voor
      risico-acceptatie of verzekeraar;

      e. indien de bank, beleggingsonderneming, betaalinstelling, clearinginstelling of elektronischgeldinstelling
      een deelneming als bedoeld in onderdeel d aanhoudt, de posten, bedoeld in [artikel 96][ref6], die tot de
      solvabiliteitsmarge van de entiteit voor risico-acceptatie of verzekeraar worden gerekend;

      f. indien de financiële onderneming voor de berekening van de naar risico gewogen activa en posten buiten de
      balanstelling ingevolge [paragraaf 10.2][ref7] een interne modellenmethode toepast:

      1°. het verschil, indien negatief, van de som van de waardeaanpassingen en voorzieningen die samenhangen
      met de verwachte verliesposten in verband met de activa en posten buiten de balanstelling, bedoeld in
      [artikel 71, eerste lid, onderdelen a tot en met d][ref8], en de som van die verwachte verliesposten, berekend
      ingevolge [artikel 75, eerste lid, onderdelen a en c][ref9];

      2°. de verwachte verliesposten in verband met posities in aandelen, bedoeld in
      [artikel 71, eerste lid, onderdeel e][ref10], berekend ingevolge [artikel 75, eerste lid, onderdeel a of b][ref11];
      en

      g. de vorderingen bij securitisatieposities waaraan ingevolge [artikel 85, tweede lid][ref12], een risicogewicht
      van 1250 procent wordt toegekend, voor zover deze niet in aanmerking zijn genomen in de berekening van de
      naar risico gewogen activa en posten buiten de balansstelling, bedoeld in artikel 85 en de vorderingen bij
      securitisatieposities in de handelsportefeuille die, als ze in de niet-handelsportefeuille van dezelfde financiële
      ondernemingen zaten, een risicogewicht van 1250 procent zouden krijgen.

      3 In afwijking van het tweede lid worden het als toetsingsvermogen in aanmerking te nemen kernkapitaal en
      aanvullend kapitaal van de financiële onderneming die [artikel 90, tweede lid][ref13], toepast, verminderd met de
      helft van de som van de waarde van de posten, bedoeld in het tweede lid, onderdelen f en g.

      4 Indien de helft van de som van de waarde van de bestanddelen, bedoeld in het tweede lid, meer bedraagt dan het
      als toetsingsvermogen in aanmerking te nemen aanvullend kapitaal, wordt het verschil in mindering gebracht op het
      als toetsingsvermogen in aanmerking te nemen kernkapitaal.

      5 De Nederlandsche Bank kan, op verzoek, besluiten dat de financiële onderneming, bedoeld in het tweede lid,
      aanhef, al dan niet voor bepaalde tijd, haar als toetsingsvermogen in aanmerking te nemen kernkapitaal en
      aanvullend kapitaal niet hoeft te verminderen met de waarde van de in het tweede lid bedoelde posten indien het
      belang in de entiteit voor risico-acceptatie, financiële instelling, bank, verzekeraar of verzekeringsholding,
      of de door deze financiële ondernemingen uitgegeven achtergestelde leningen of overige posten tijdelijk worden
      gehouden met het oog op een financiële bijstandsoperatie, bedoeld om die financiële onderneming te saneren of te
      redden.

      6 De financiële onderneming, bedoeld in het tweede lid, aanhef, kan, in plaats van de vermindering met
      de waarde van de posten, bedoeld in het tweede lid, onderdelen d en e, de methodes 1, 2 of 3, bedoeld in
      [bijlage B van het Besluit prudentieel toezicht financiële groepen Wft][ref14] op overeenkomstige wijze toepassen,
      met dien verstande dat methode 1 uitsluitend kan worden toegepast indien de Nederlandsche Bank, op verzoek, heeft
      besloten dat haar dat is toegestaan. De Nederlandsche Bank besluit hiertoe indien het geïntegreerd beheer en de
      interne controle van de in de consolidatie te betrekken ondernemingen voldoende zijn.

      7 Indien op de financiële onderneming, bedoeld in de aanhef van het tweede lid, toezicht op geconsolideerde
      basis ingevolge [afdeling 3.6.2 van de wet][ref15] of prudentieel toezicht op financiële conglomeraten ingevolge
      [afdeling 3.6.4 van de wet][ref16] wordt gehouden, hoeft zij haar als toetsingsvermogen in aanmerking te nemen
      kernkapitaal en aanvullend kapitaal niet te verminderen met de waarde van de in het tweede lid bedoelde posten die
      worden gehouden in een financiële instelling, bank, verzekeraar of verzekeringsholding die in dat geconsolideerde
      toezicht of prudentieel toezicht op financiële conglomeraten wordt betrokken.

      8 De Nederlandsche Bank kan op verzoek besluiten dat het een bank of beleggingsonderneming is toegestaan
      de limieten, bedoeld in het eerste lid, onderdelen b en c, en het negende lid in noodsituaties tijdelijk te
      overschrijden.

      9 Voor de toepassing van [artikel 91, tweede lid, onderdeel h][ref17], gelden de volgende limieten:

      a. vermogensbestanddelen die in noodsituaties als bedoeld in het achtste lid, binnen een vooraf bepaalde
      marge geconverteerd moeten worden en op initiatief van de Nederlandsche Bank in het licht van de financiële
      en solvabiliteitssituatie van de bank of beleggingsonderneming te allen tijde geconverteerd mogen worden in
      vermogensbestanddelen als bedoeld in [artikel 91, tweede lid, onderdeel a][ref18], mogen tezamen niet meer bedragen
      dan vijftig procent van de som van de vermogensbestanddelen, bedoeld in artikel 91, tweede lid, onderdelen a tot en
      met e en h, verminderd met de som van de vermogensbestanddelen, bedoeld in artikel 91, tweede lid, onderdelen f en
      g en het derde lid;

      b. binnen de limiet, bedoeld in onderdeel a, bedragen alle andere vermogensbestanddelen
      tezamen niet meer dan 35 procent van de som van de vermogensbestanddelen genoemd in
      [artikel 91, tweede lid, onderdelen a tot en met e en h][ref19] verminderd met de som van de vermogensbestanddelen
      bedoeld in artikel 91, tweede lid, onderdelen f en g en het derde lid;

      c. binnen de limieten, bedoeld in de onderdelen a en b bedraagt de som van vermogensbestanddelen met
      bepaalde looptijd en vermogensbestanddelen waarvan de bepalingen een aflossingsprikkel voor de bank en
      beleggingsonderneming bevatten, niet meer dan vijftien procent van de vermogensbestanddelen, bedoeld in
      [artikel 91, tweede lid, onderdelen a tot en met e en h][ref20], verminderd met de som van de vermogensbestanddelen
      bedoeld in artikel 91, tweede lid, onderdelen f en g en het derde lid;

      d. voor het bedrag van de vermogensbestanddelen dat uitkomt boven de limieten bedoeld in de onderdelen a, b en c,
      van dit lid, geldt de limiet, bedoeld in [artikel 94, eerste lid, onderdelen b en c][ref21].


