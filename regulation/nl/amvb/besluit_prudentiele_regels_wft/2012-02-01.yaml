  - number: '96'
    text: |-
      De aanwezige solvabiliteitsmarge, bedoeld in [artikel 95, eerste lid][ref1], wordt tevens gevormd door de waarde
      van:

      a. cumulatief preferente aandelen;

      b. het gestorte deel op achtergestelde leningen indien is voldaan aan de voorwaarden, bedoeld in
      [artikel 92, derde lid, onderdeel c, onder 1° tot en met 5°][ref2], en de leningovereenkomst slechts gewijzigd
      kan worden indien de Nederlandsche Bank daartoe, op verzoek, besluit; en

      c. het gestorte deel op schuldtitels met onbepaalde looptijd en andere financieringsinstrumenten indien aan de
      voorwaarden, bedoeld in [artikel 92, tweede lid, onderdeel b, onder 1° tot en met 4°][ref3], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel95
