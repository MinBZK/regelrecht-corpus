      1 De Nederlandsche Bank kan een bank als bedoeld in [artikel 60, eerste lid][ref1], op verzoek, toestemming
      verlenen om gebruik te maken van een alternatieve indicator voor de berekening van de vereiste solvabiliteit
      ter dekking van het operationeel risico met betrekking tot de business lines «bankdiensten ten behoeve van
      particulieren en kleine en middelgrote ondernemingen» en «zakelijke bankdiensten», indien:

      a. deze business lines gezamenlijk ten minste 90 procent van haar netto rentebaten en netto niet-rentebaten
      vertegenwoordigen; en

      b. de bank kan aantonen dat een aanzienlijk deel van haar activiteiten op het gebied van deze business lines
      betrekking heeft op leningen met een grote kans op wanbetalingen en dat de alternatieve indicator een betere
      grondslag biedt om het operationeel risico te berekenen.

      2 De Nederlandsche Bank stelt regels met betrekking tot de alternatieve indicator, bedoeld in het eerste lid.


