    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 27 juni 2006, nr. FM 2006-01567 M;

    Gelet op de artikelen 3:9, derde lid, 3:10, tweede en derde lid, 3:17, tweede lid, 3:18, tweede en derde lid, 3:29,
    derde lid, 3:36, vierde lid, 3:40, 3:41, 3:42, 3:43, tweede lid, 3:47, zesde lid, 3:48, 3:52, 3:53, derde lid,
