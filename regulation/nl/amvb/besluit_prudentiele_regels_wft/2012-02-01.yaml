  - number: '69'
    text: |-
      1 De Nederlandsche Bank kan een bank of beleggingsonderneming als bedoeld in [artikel 3:57, eerste lid][ref1], of
      [3:58, eerste lid, van de wet][ref2], op verzoek, toestemming verlenen om de bedragen van haar naar risico gewogen
      activa of posten buiten de balanstelling in afwijking van [artikel 61][ref3] te berekenen volgens een interne
      modellenmethode, waarbij gebruik wordt gemaakt van eigen ramingen van de kans op wanbetaling. De Nederlandsche
      Bank kan tevens, op verzoek, toestemming verlenen om daarbij gebruik te maken van eigen ramingen van verliezen bij
      wanbetaling en omrekeningsfactoren.

      2 De gehanteerde interne modellen voor het beheer en de beoordeling van kredietrisico’s worden zorgvuldig
      toegepast. De Nederlandsche Bank stelt regels met betrekking tot deze interne modellen.

      3 De toestemming, bedoeld in het eerste lid, wordt verleend indien de financiële onderneming heeft aangetoond dat
      de gehanteerde interne modellen voldoen aan het bepaalde ingevolge het tweede lid.

      4 De financiële onderneming die een verzoek voor toestemming voor het gebruik van een interne modellenmethode
      indient, legt bewijsstukken over waaruit blijkt dat zij al ten minste gedurende drie jaar voor de desbetreffende
      categorieën van activa en posten buiten de balanstelling, bedoeld in [artikel 71, eerste lid][ref4], systemen voor
      de beoordeling van kredietrisico’s hanteert die in grote lijnen in overeenstemming zijn met de regels, bedoeld in
      het tweede lid, laatste volzin.

      5 De financiële onderneming die een verzoek voor toestemming voor het gebruik van eigen ramingen van verliezen bij
      wanbetaling en omrekeningsfactoren indient, legt bewijsstukken over waaruit blijkt dat zij al ten minste gedurende
      drie jaar eigen ramingen van verliezen bij wanbetaling of omrekeningsfactoren opstelt en daarvan gebruik maakt op
      een wijze die in grote lijnen in overeenstemming is met de regels, bedoeld in het tweede lid, laatste volzin.

      6 Onverminderd de [artikelen 70][ref5] en [76][ref6] gebruikt de financiële onderneming die toestemming heeft
      gekregen voor het gebruik van een interne modellenmethode, deze voor alle activa en posten buiten de balanstelling.

      7 Indien de financiële onderneming niet langer voldoet aan het eerste tot en met zesde lid of de
      [artikelen 70 tot en met 76][ref7], dient zij bij de Nederlandsche Bank een plan in om zo spoedig mogelijk opnieuw
      aan deze leden en artikelen te voldoen, of toont zij aan dat dit geen noemenswaardige gevolgen voor het gebruik van
      de interne modellenmethode heeft.


