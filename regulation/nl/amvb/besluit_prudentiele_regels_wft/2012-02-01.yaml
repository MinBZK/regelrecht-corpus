  - number: '87'
    text: |-
      1 Indien [artikel 84, eerste en tweede lid][ref1], van toepassing is op een financiële onderneming als bedoeld in
      [artikel 83][ref2] of indien een financiële onderneming als bedoeld in artikel 83 die sponsor is steun verleent
      aan een securitisatie of indien een financiële onderneming financiële instrumenten uit haar handelsportefeuille aan
      een entiteit voor securitisatiedoeleinden verkocht heeft, overschrijdt zij niet de grenzen van haar contractuele
      verplichtingen teneinde de mogelijke of feitelijke verliezen van de beleggers te beperken.

      2 Indien de financiële onderneming die initiator of sponsor is bij een securitisatie niet voldoet aan het eerste
      lid, dan houdt zij voor alle gesecuritiseerde posten evenveel toetsingsvermogen aan als noodzakelijk was geweest
      indien deze posten niet waren gesecuritiseerd.

      3 De financiële onderneming maakt openbaar dat zij buiten de grenzen van haar contractuele verplichtingen steun
      heeft verleend en welke gevolgen dit heeft voor haar toetsingsvermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel83
