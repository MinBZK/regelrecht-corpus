  - number: '26'
    text: |-
      1 Een beheerder, bewaarder of pensioenbewaarder als bedoeld in [artikel 3:17, derde lid][ref1], of
      [3:25 van de wet][ref2] beschikt over procedures en maatregelen die waarborgen dat de omvang en samenstelling van
      en mutaties in de aan te houden financiële waarborgen getrouw en volledig kunnen worden vastgesteld.

      2 Met het oog op de bewaking en beheersing van solvabiliteitsrisico’s voorziet de bedrijfsvoering van een beheerder
      van een instelling voor collectieve belegging in effecten in ieder geval in de bewaking en beheersing van de:

      a. aard en omvang van de activa en passiva;

      b. niet uit de balans blijkende verplichtingen; en

      c. resultaatontwikkeling, uitgesplitst naar de onderscheiden bedrijfsactiviteiten en bedrijfsonderdelen.

      3 Met het oog op de bewaking en beheersing van liquiditeitsrisico’s voorziet de bedrijfsvoering van elke
      beleggingsinstelling waarvan de rechten van deelneming op verzoek van de deelnemers ten laste van de activa
      direct of indirect worden ingekocht of terugbetaald onder meer in autorisatieprocedures, limietstellingen,
      limietbewaking en procedures en maatregelen voor noodsituaties met betrekking tot de liquiditeitspositie van de
      beleggingsinstelling.

      4 In voorkomend geval voert een beheerder van een instelling voor collectieve belegging in effecten stresstests
      uit die een beoordeling van het liquiditeitsrisico van de instelling voor collectieve belegging in effecten in
      uitzonderlijke omstandigheden mogelijk maken.

      5 De beheerder van een instelling voor collectieve belegging in effecten draagt er zorg voor dat voor elke
      door hem beheerde instelling voor collectieve belegging in effecten het liquiditeitsprofiel past bij het
      terugbetalingsbeleid dat in het fondsreglement, in de statuten of in het prospectus is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel317
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel325
