  - number: '89'
    text: |-
      1 Bij de berekening van het toetsingsvermogen, bedoeld in de [artikelen 90 tot en met 94][ref1], of de aanwezige
      solvabiliteitsmarge, bedoeld in de [artikelen 95 tot en met 98][ref2], wordt per afzonderlijke post rekening
      gehouden met het voorzienbare bedrag van de daarover verschuldigde belastingen. De vermogensbestanddelen, bedoeld
      in [artikel 91, tweede lid, onderdelen a tot en met f][ref3], of [95, tweede lid][ref4], alsmede de waarden
      die tegenover die vermogensbestanddelen staan, staan onmiddellijk en zonder beperkingen ter beschikking van de
      desbetreffende financiële onderneming.

      2 De Nederlandsche Bank stelt regels met betrekking tot:

      a. het als toetsingsvermogen of aanwezige solvabiliteitsmarge in aanmerking nemen van hybride kapitaalinstrumenten
      als bedoeld in [artikel 91, tweede lid, onderdeel h][ref5], die onderdeel kunnen zijn van het kernkapitaal als
      bedoeld in artikel 91, tweede lid, onderdeel a en het in aanmerking nemen van hybride kapitaalinstrumenten die
      gelijk te stellen zijn met de vermogensbestanddelen, bedoeld in de [artikelen 92, tweede en derde lid][ref6],
      [artikel 95, tweede lid][ref7] en [artikel 96][ref8].

      b. het als immateriële activa als bedoeld in de [artikelen 91, derde lid, onderdeel c][ref9], en
      [95, derde lid, onderdeel e][ref10], in aanmerking nemen van activa.


