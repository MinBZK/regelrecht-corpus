      1 Een financiële onderneming of bijkantoor als bedoeld in [artikel 3:18, eerste lid][ref1], [3:22][ref2],
      [3:23][ref3], [3:24b][ref4], [3:25][ref5], [3:26][ref6] of [3:27, van de wet][ref7] gaat niet over tot het
      uitbesteden van werkzaamheden indien die uitbesteding een belemmering kan vormen voor een adequaat toezicht op
      de naleving van het bij of krachtens het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref8]
      bepaalde.

      2 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie, bank,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 3:18, tweede lid][ref9], [3:23][ref10],
      [3:26][ref11] of [3:27 van de wet][ref12] besteedt de taken en werkzaamheden van personen die het dagelijks
      beleid bepalen, daaronder mede verstaan het vaststellen van het beleid en het afleggen van verantwoording over het
      gevoerde beleid, niet uit.


