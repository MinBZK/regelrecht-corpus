  - number: '133'
    text: |-
      1 Het onderzoek van de staten, bedoeld in [artikel 130][ref1], door de accountant, uitmondend in een verklaring
      omtrent de getrouwheid als bedoeld in [artikel 3:72, zevende lid, eerste volzin, van de wet][ref2], wordt een maal
      per jaar uitgevoerd. De Nederlandsche Bank stelt regels waarin wordt bepaald welke staten door de accountant in
      zijn onderzoek worden betrokken. De accountant waarmerkt deze staten.

      2 Het onderzoek van het actuarieel verslag van een verzekeraar als bedoeld in [artikel 130, tweede lid][ref3], door
      de actuaris, uitmondend in een verklaring als bedoeld in [artikel 3:73 van de wet][ref4], wordt een maal per jaar
      uitgevoerd en omvat:

      a. de toets, bedoeld in [artikel 121, eerste lid, onderdeel a][ref5], voor zover het betreft verzekeringen met een
      contractduur van meer dan vier jaar waarbij gedurende de contractduur:

      1°. de premie jaarlijks niet of slechts beperkt kan worden verhoogd; en

      2°. de risico’s significant oplopen; en

      b. de toets, bedoeld in [artikel 121, tweede lid][ref6], met inachtneming van de
      [artikelen 98, derde en vierde lid][ref7], en [121, derde en vierde lid][ref8].


