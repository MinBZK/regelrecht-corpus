  - number: '88'
    text: |-
      1 De Nederlandsche Bank erkent, op aanvraag, al dan niet voor bepaalde tijd, een kredietbeoordelingsbureau indien
      het geregistreerd is, bedoeld in artikel 14, vierde lid, van de verordening (EG) nr. 1060/2009 van het Europees
      Parlement en de Raad van 16 september 2009 inzake ratingbureaus (PbEU L 302).

      2 De Nederlandsche Bank stelt een procedure vast voor de erkenning, bedoeld in het eerste lid, en maakt deze
      bekend.

      3 Indien een kredietbeoordelingsbureau niet meer voldoet aan de criteria, bedoeld in het eerste lid, kan de
      Nederlandsche Bank de erkenning intrekken.

      4 Indien een toezichthoudende instantie van een andere lidstaat een kredietbeoordelingsbureau heeft erkend, erkent
      de Nederlandsche Bank het kredietbeoordelingsbureau zonder toetsing.
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel88
  - number: 88a
    text: |-
      De Nederlandsche Bank erkent, op aanvraag, al dan niet voor bepaalde tijd, de kredietbeoordelingen van een
      exportkredietverzekeraar, indien de kredietbeoordelingen voldoen aan de criteria opgenomen in bijlage VI, deel 1,
      punt 6, van de herziene richtlijn banken.
