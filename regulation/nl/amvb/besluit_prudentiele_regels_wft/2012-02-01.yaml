  - number: '134'
    text: |-
      Een entiteit voor risico-acceptatie of verzekeraar als bedoeld in [artikel 130, tweede lid][ref1], maakt de staten,
      bedoeld in dat lid, onderdeel a, vergezeld van de verklaring, bedoeld in [artikel 3:73 van de wet][ref2], jaarlijks
      binnen een termijn van zes maanden openbaar, voor zover het gaat om staten omvattende:

      a. de jaarrekening, het jaarverslag en de overige gegevens en wat betreft indeling en inhoud in de vorm waarin deze
      zijn opgemaakt ingevolge [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref3] of de internationale jaarrekening
      standaarden;

      b. indien van toepassing: informatie over de winstdeling ten gunste van polishouders per productgroep; en

      c. indien van toepassing: financiële informatie over de zorgverzekering, bedoeld in
      [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref4].


