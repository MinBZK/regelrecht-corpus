  - number: '71'
    text: |-
      1 Een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1], die een interne modellenmethode
      gebruikt, deelt haar activa en posten buiten de balanstelling volgens een geschikte en in de tijd consistente
      methodiek in de volgende categorieën in:

      a. vorderingen of voorwaardelijke vorderingen op centrale overheden en centrale banken;

      b. vorderingen of voorwaardelijke vorderingen op banken en beleggingsondernemingen;

      c. vorderingen of voorwaardelijke vorderingen op ondernemingen, waaronder vorderingen uit hoofde van
      gespecialiseerde kredietverlening;

      d. vorderingen of voorwaardelijke vorderingen op particulieren en op kleine en middelgrote ondernemingen;

      e. posities in aandelen;

      f. securitisatieposities; en

      g. andere activa of posten buiten de balanstelling die geen kredietverplichting vertegenwoordigen.

      2 Activa of posten buiten de balanstelling die een kredietverplichting vertegenwoordigen die niet worden ingedeeld
      in een van de categorieën, bedoeld in het eerste lid, onderdelen a, b of d tot en met f, worden ingedeeld in de
      categorie, bedoeld in onderdeel c.

      3 De Nederlandsche Bank stelt nadere regels met betrekking tot de indeling in de categorieën, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
