  - number: '9'
    text: |-
      De Nederlandsche Bank neemt bij de vaststelling, bedoeld in [artikel 5][ref1], in aanmerking:

      a. het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de
      overige omstandigheden van het geval;

      b. de belangen die de [wet][ref2] beoogt te beschermen; en

      c. de overige belangen van de clearinginstelling, entiteit voor risico-acceptatie, bank of verzekeraar en de
      betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
