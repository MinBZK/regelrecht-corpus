  - number: 122a
    text: |-
      1 Onverminderd [artikel 122, eerste lid][ref1]:

      a. beperkt een entiteit voor risico-acceptatie of herverzekeraar beleggingen in waarden die niet op een
      gereglementeerde markt worden verhandeld tot een voorzichtig niveau;

      b. belegt een entiteit voor risico-acceptatie of herverzekeraar slechts in afgeleide financiële instrumenten,
      voor zover deze worden gebruikt om het beleggingsrisico te beperken of een efficiënt portefeuillebeheer mogelijk
      te maken;

      c. vermijdt een entiteit voor risico-acceptatie of herverzekeraar een bovenmatig risico met betrekking tot dezelfde
      wederpartij;

      d. diversifieert een entiteit voor risico-acceptatie of herverzekeraar de waarden zodanig dat een bovenmatige
      afhankelijkheid van een bepaald actief, een bepaalde emittent of groep van verbonden wederpartijen en
      risicoaccumulatie in de portefeuille wordt vermeden.

      2 Er is geen sprake van een bovenmatige afhankelijkheid van een bepaald actief in geval van beleggingen door een
      entiteit voor risico-acceptatie of herverzekeraar in staatsobligaties.

      3 [Artikel 122, tweede lid][ref2], is van overeenkomstige toepassing op entiteiten voor risico-acceptatie voor
      zover het betreft het gebruik van vorderingen die dienen als dekking van de technische voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel122
