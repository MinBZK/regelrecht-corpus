  - number: 122b
    text: |-
      1 De technische voorzieningen van een levensverzekeraar of schadeverzekeraar als bedoeld in [artikel 122][ref1]
      worden gedekt door:

      a. de volgende beleggingen:

      1°. obligaties en andere geld- en kapitaalmarktinstrumenten;

      2°. leningen die geen obligaties zijn;

      3°. aandelen en andere met aandelen gelijk te stellen niet-rentedragende beleggingen;

      4°. rechten van deelneming in instellingen voor collectieve belegging in effecten en deelnemingen in andere
      beleggingsfondsen;

      5°. onroerende zaken, waaronder onroerende zaken voor eigen gebruik, alsmede zakelijke rechten op onroerende zaken;
      en

      6°. afgeleide financiële instrumenten, voor zover deze worden gebruikt om het beleggingsrisico te beperken of een
      efficiënt portefeuillebeheer mogelijk te maken;

      b. de volgende vorderingen:

      1°. vorderingen op herverzekeraars, met inbegrip van het aandeel van herverzekeraars in de technische
      voorzieningen, en verhaalbare bedragen op entiteiten voor risico-acceptatie;

      2°. deposito’s en vorderingen uit hoofde van herverzekering;

      3°. vorderingen op verzekeringnemers en tussenpersonen uit hoofde van verzekeringen en herverzekeringen, voor zover
      binnen negentig dagen opeisbaar;

      4°. vorderingen van een schadeverzekeraar uit hoofde van verhaalsrecht of subrogatie;

      5°. voorschotten op polissen van een levensverzekeraar;

      6°. belastingtegoeden; en

      7°. vorderingen op garantiefondsen; en

      c. de volgende andere activa:

      1°. materiële vaste activa, andere dan onroerende zaken;

      2°. liquide middelen en deposito’s bij banken of bij buitenlandse andere instellingen die vergunning hebben om
      deposito’s te ontvangen;

      3°. overlopende acquisitiekosten;

      4°. lopende interest en huur en andere overlopende posten; en

      5°. zakelijke rechten waarvan het genot is uitgesteld.

      2 Indien beleggingen van een levensverzekeraar of schadeverzekeraar worden beheerd door een dochteronderneming
      van die verzekeraar, wordt voor de toepassing van het eerste lid uitgegaan van de activa in het bezit van deze
      dochteronderneming.

      3 De Nederlandsche Bank kan in individuele gevallen besluiten dat de waarden die dienen tot dekking van de
      technische voorzieningen voor de toepassing van dit besluit tegen een lager bedrag worden gewaardeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
