  - number: '119'
    text: |-
      De voorziening voor winstdeling en kortingen van een verzekeraar als bedoeld in [artikel 114, eerste lid][ref1],
      omvat de bedragen die in de vorm van winstdeling bestemd zijn voor de verzekeringnemers, verzekerden of
      gerechtigden op uitkeringen, voor zover deze niet hebben geleid tot verhoging van de voorziening voor
      levensverzekering, alsmede de bedragen die een gedeeltelijke terugbetaling van premies op grond van het resultaat
      van de verzekeringen vertegenwoordigen, voor zover deze niet tot verhoging van de ledenrekening hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel119
