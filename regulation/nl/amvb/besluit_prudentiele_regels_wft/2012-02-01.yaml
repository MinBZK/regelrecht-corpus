  - number: '131'
    text: |-
      1 De Nederlandsche Bank stelt, met inachtneming van het bepaalde ingevolge het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref1], alsmede met inachtneming van
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2] en de internationale jaarrekeningstandaarden, regels met
      betrekking tot de staten, bedoeld in [artikel 130][ref3]. Deze omvatten uitsluitend:

      a. de modellen van de staten;

      b. de reikwijdte van toepassing van de staten en de mate van detaillering van de in te vullen gegevens; deze
      omvatten geen uitbreiding of nadere rubricering van de staten;

      c. de reikwijdte van de consolidatie overeenkomstig de regels met betrekking tot consolidatie die de financiële
      onderneming in haar jaarrekening toepast, voor zover uit de wet niet anders voortvloeit;

      d. de waardering van de posten overeenkomstig de waarderingsmethoden die de financiële onderneming in haar
      jaarrekening toepast;

      e. de te hanteren valuta en rekeneenheid;

      f. de afronding;

      g. de termijn waarbinnen de staten worden verstrekt, met dien verstande dat deze niet
      korter is dan noodzakelijk voor de uitoefening van het toezicht op de naleving van het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref4]; en

      h. de frequentie waarmee de staten worden verstrekt, met dien verstande dat deze ten minste een maal per jaar is.

      2 De regels, bedoeld in het eerste lid, onderdelen b, f, g en h, zijn afgestemd op de aard en de omvang van de
      financiële onderneming, alsmede op de omvang van de solvabiliteit van de financiële onderneming. De frequentie,
      bedoeld in het eerste lid, onderdeel h, is evenwel niet hoger dan:

      a. twaalf maal per jaar voor de staten ten behoeve van het toezicht op de liquiditeit, bedoeld in
      [artikel 130, eerste lid, onderdeel b, onder 3° en derde lid][ref5];

      b. een maal per jaar voor de jaarrekening, bedoeld in [artikel 130, tweede lid, onderdeel a][ref6], en de staten
      ten behoeve van het toezicht op de technische voorzieningen, bedoeld in artikel 130, tweede lid, onderdeel b, onder
      2°; en

      c. vier maal per jaar voor de overige in [artikel 130, eerste en tweede lid][ref7], genoemde staten;

      d. twee maal per jaar voor de in [artikel 130, derde lid][ref8], genoemde staten.

      3 De Nederlandsche Bank kan in individuele gevallen besluiten dat een financiële onderneming als bedoeld in
      [artikel 130][ref9] periodiek moet melden of haar solvabiliteit of liquiditeit zich boven een door de Nederlandsche
      Bank vastgestelde signaleringswaarde bevindt. De frequentie van de melding is niet hoger dan een maal per maand en
      is afgestemd op de aard en de omvang van de financiële onderneming, alsmede op de omvang van de solvabiliteit van
      de financiële onderneming.

      4 Een beleggingsonderneming als bedoeld in [artikel 48, eerste lid, onderdeel i, j of k][ref10], doet de
      melding, bedoeld in het derde lid, met redenen omkleed aan de Nederlandsche Bank in elke maand waarin zij niet
      ingevolge het tweede lid, onderdeel c, staten verstrekt. Zij meldt daarbij in ieder geval wat de waarde van
      haar toetsingsvermogen is, hoe deze waarde is berekend en hoe deze waarde zich verhoudt tot de waarde van haar
      toetsingsvermogen zoals vermeld in de laatst verstrekte staten.

      5 Ter voorbereiding op de implementatie van richtlijn nr. 2009/138/EG van het Europees Parlement en de Raad van
      de Europese Unie van 25 november 2009 betreffende de toegang tot en uitoefening van het verzekerings- en het
      herverzekeringsbedrijf (Solvabiliteit II) (herschikking) (PbEU L 335) dienen entiteiten voor risico-acceptatie en
      verzekeraars de in [Bijlage D][ref11] vastgestelde modellen van staten in, met inachtneming van het zesde lid. Voor
      zover niet anders blijkt, zijn op deze modellen van staten de regels van toepassing die de Nederlandsche Bank heeft
      vastgesteld op grond van het eerste lid, onderdelen b, c, e, f en h.

      6 Voor het boekjaar 2011 dienen entiteiten voor risico-acceptatie en verzekeraars de modellen van staten 1 tot en
      met 3, bedoeld in [bijlage D][ref12], in binnen acht maanden na afloop van dat boekjaar. Voor het boekjaar 2012
      dienen entiteiten voor risico-acceptatie en verzekeraars de modellen van staten, bedoeld in bijlage D, gelijktijdig
      in met de kwartaalrapportages over het eerste kwartaal van 2013 die op grond van de in het vijfde lid genoemde
      richtlijn worden ingediend.


