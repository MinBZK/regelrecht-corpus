  - number: '103'
    text: |-
      1 De waarde van de onroerende zaken, bedrijfsmiddelen, deelnemingen in ondernemingen die geen financiële
      ondernemingen zijn, en kredieten aan ondernemingen die geen financiële ondernemingen zijn, indien daarin
      deelnemingen worden gehouden, verminderd met de waarde van eventueel gestelde zekerheden, van een bank als bedoeld
      in [artikel 3:57, zesde lid][ref1], of [3:58, eerste lid, van de wet][ref2] of van een clearinginstelling als
      bedoeld in [artikel 3:57, zesde lid][ref3], of [3:61, eerste lid, van de wet][ref4] bedraagt niet meer dan haar
      toetsingsvermogen, verminderd met het overig kapitaal, bedoeld in [artikel 93][ref5].

      2 Onverminderd het eerste lid, bedraagt de waarde van onroerende zaken van een financiële onderneming als bedoeld
      in het eerste lid, anders dan voor eigen gebruik, niet meer dan 25 procent van haar toetsingsvermogen.

      3 Voor de toepassing van het tweede lid kan een financiële onderneming als bedoeld in het eerste lid:

      a. een onroerende zaak die zij volgens een huurcontract heeft verhuurd, waarderen tegen de actuele waarde,
      verminderd met de contante waarde van de overeengekomen huurtermijnen of leasetermijnen tijdens de duur van het
      contract op basis van de contractrente;

      b. een onroerende zaak die zij heeft verhuurd voor een periode van twee jaar of langer, waarderen tegen de actuele
      waarde, verminderd met de contante waarde van de huurtermijnen en de waarde van de eventueel gestelde zekerheden.
      Als waarde van de zekerheden wordt aangemerkt de waarde, berekend naar de in het bankwezen gebruikelijke
      maatstaven, uitgezonderd de hypothecaire dekking, die hier op de executiewaarde van het hypothecair verbondene
      wordt gesteld.

      4 De berekening van de waarde van de activa, bedoeld in het eerste en tweede lid, geschiedt met uitzondering van
      de waarde van onroerende zaken in ontwikkeling zijn voor rekening en risico van derden, of van onroerende zaken die
      zijn verkocht, waarbij de obligatoire overeenkomst tot verkoop nog niet is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel357
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel358
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel357
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel361
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Artikel93
