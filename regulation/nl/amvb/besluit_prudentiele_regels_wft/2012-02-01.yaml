  - number: '61'
    text: |-
      1 Het bedrag van een naar risico gewogen actief of post buiten de balanstelling, bedoeld in
      [artikel 60, eerste lid, onderdeel a][ref1], is gelijk aan zijn vorderingswaarde vermenigvuldigd met het aan
      dat actief of post buiten de balanstelling ingevolge het vijfde lid, onderdeel a, toegekende risicogewicht.
      In afwijking van de vorige volzin wordt het bedrag van een naar risico gewogen post bij gesecuritiseerde
      activa en posten buiten de balanstelling of van een naar risico gewogen securitisatiepositie berekend volgens
      [paragraaf 10.4][ref2].

      2 Onverminderd het vijfde lid, onderdeel c, is de vorderingswaarde van:

      a. een actief gelijk aan zijn balanswaarde;

      b. een post buiten de balanstelling met een volledig risico gelijk aan zijn actuele waarde;

      c. een post buiten de balanstelling met een middelgroot risico gelijk aan vijftig procent van zijn actuele waarde;

      d. een post buiten de balanstelling met een laag tot middelgroot risico gelijk aan twintig procent van zijn actuele
      waarde; en

      e. een post buiten de balanstelling met een laag risico gelijk aan nul.

      3 De vorderingswaarde, bedoeld in het tweede lid, van effecten of grondstoffen die in het kader van een
      retrocessieovereenkomst, omgekeerde retrocessieovereenkomst, opgenomen effectenlening, verstrekte effectenlening,
      opgenomen grondstoffenlening, verstrekte grondstoffenlening of margeleningstransactie worden verkocht,
      gedeponeerd of verstrekt, wordt indien de financiële onderneming ingevolge [artikel 82, eerste lid][ref3], de
      uitgebreide benadering van financiële zekerheden toepast, verhoogd met de overeenkomstig die benadering berekende
      volatiliteitsaanpassing.

      4 De vorderingswaarde van een door een volgestorte kredietprotectie gegarandeerd actief of gegarandeerde post
      buiten de balanstelling mag overeenkomstig [paragraaf 10.3][ref4] worden aangepast.

      5 De Nederlandsche Bank stelt regels met betrekking tot:

      a. de indeling van de activa en posten buiten de balanstelling in categorieën naar gelang de wederpartij en de aan
      die categorieën toe te kennen risicogewichten met inachtneming van [artikel 61a][ref5];

      b. de indeling van de posten buiten de balanstelling in posten met een volledig risico, posten met een middelgroot
      risico, posten met een middelgroot tot laag risico en posten met een laag risico, bedoeld in het tweede lid,
      onderdelen b tot en met e;

      c. de vorderingswaarde van afgeleide financiële instrumenten als bedoeld in [bijlage C][ref6] en uitstaande
      kredietrisico’s met een centrale tegenpartij die optreedt als exclusieve wederpartij bij overeenkomsten betreffende
      financiële instrumenten waarbij geldt dat het tegenpartijkredietrisico van de centrale tegenpartij ten aanzien van
      alle deelnemers in haar regelingen dagelijks volledig door zekerheden wordt gedekt.

      6 De vorderingswaarde van retrocessieovereenkomsten, omgekeerde retrocessieovereenkomsten, opgenomen
      effectenleningen, verstrekte effectenleningen, opgenomen grondstoffenleningen, verstrekte grondstoffenleningen,
      transacties met afwikkeling op lange termijn of margeleningstransacties mag, met instemming van de Nederlandsche
      Bank, worden bepaald op grond van de door de Nederlandsche Bank te stellen regels, bedoeld in het vijfde lid,
      aanhef en onderdeel c.

      7 Op verzoek van een bank, beleggingsonderneming of clearinginstelling als bedoeld in
      [artikel 3:57, eerst lid, van de wet][ref7], kan de Nederlandsche Bank een risicogewicht van nul toestaan voor
      een actief of post buiten de balanstelling van de hiervoor bedoelde financiële ondernemingen indien het betreft
      vorderingen op hun moederondernemingen, dochterondernemingen, dochterondernemingen van hun moederondernemingen
      of ondernemingen waarmee zij verbonden zijn door een betrekking als bedoeld in artikel 12, eerste lid, van de
      richtlijn geconsolideerde jaarrekening, indien:

      a. de vordering bestaat op een andere bank, beleggingsonderneming of clearinginstelling, een financiële holding,
      een financiële instelling, of een onderneming die nevendiensten verricht, en deze ondernemingen betrokken zijn in
      het bedrijfseconomische toezicht;

      b. de in onderdeel a bedoelde onderneming onderdeel uitmaakt van dezelfde volledige consolidatie;

      c. de in onderdeel a bedoelde onderneming aan dezelfde risicobeoordeling, meet- en controleprocedures is
      onderworpen;

      d. de in onderdeel a bedoelde onderneming haar zetel heeft in Nederland; en

      e. de bank, beleggingsonderneming of clearinginstelling aantoont dat geen feitelijke of juridische belemmeringen
      aanwezig of te voorzien zijn die een onmiddellijke overdracht van toetsingsvermogen of terugbetaling van schulden
      door de in onderdeel a bedoelde ondernemingen aan haar kan verhinderen.

      8 Het zevende lid is niet van toepassing op de vermogensbestanddelen, bedoeld in de
      [artikelen 91, tweede lid][ref8], en [92, tweede en derde lid][ref9].


