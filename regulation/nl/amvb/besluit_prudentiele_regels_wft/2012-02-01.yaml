  - number: '7'
    text: |-
      1 De Nederlandsche Bank verkrijgt inzicht in de in [artikel 5][ref1] bedoelde voornemens, handelingen en
      antecedenten op grond van:

      a. door betrokkene verstrekte gegevens en inlichtingen;

      b. door de Landelijke Officier van Justitie verstrekte politiegegevens;

      c. gegevens uit de registratie, bedoeld in [artikel 1, onderdeel b, van de Wet controle op rechtspersonen][ref2];

      d. gegevens en inlichtingen, verkregen van de Belastingdienst;

      e. gegevens en inlichtingen, verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van Nederlandse
      of buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of
      op personen die op die markten werkzaam zijn;

      f. ambtsberichten van het Openbaar Ministerie;

      g. inlichtingen, verkregen van door betrokkene opgegeven referenties;

      h. gegevens uit openbare bronnen;

      i. inlichtingen, verkregen van curatoren of bewindvoerders met betrekking tot faillissementen, surseances,
      schuldsaneringen, bewindvoeringen of noodregelingen waarbij de in [artikel 5][ref3] bedoelde persoon betrokken
      is geweest;

      j. inlichtingen, verkregen van organisaties van huidige of voormalige beroepsgenoten van betrokkene; of

      k. gegevens en inlichtingen, verkregen uit andere bij ministeriële regeling aan te wijzen bronnen.

      2 Indien de gegevens of inlichtingen, verkregen overeenkomstig het eerste lid, de Nederlandsche Bank aanleiding
      geven tot nader onderzoek, kan de Nederlandsche Bank ook inlichtingen inwinnen en gegevens opvragen bij andere
      personen of instanties dan genoemd in dat lid. De Nederlandsche Bank stelt de betrokkene in dat geval vooraf
      schriftelijk in kennis van:

      a. de reden van het nadere onderzoek;

      b. de personen of instanties bij wie nadere gegevens of inlichtingen zullen worden ingewonnen; en

      c. de aard van de nadere gegevens of inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0015049#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel5
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel7
