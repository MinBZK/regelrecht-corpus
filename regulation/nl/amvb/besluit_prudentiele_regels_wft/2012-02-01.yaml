  - number: '92'
    text: |-
      1 Het aanvullend kapitaal wordt gevormd door het hoger aanvullend kapitaal en het lager aanvullend kapitaal.

      2 Het hoger aanvullend kapitaal wordt gevormd door de waarde van:

      a. de herwaarderingsreserves, voor zover niet reeds verwerkt in [artikel 91, tweede lid, onderdeel f][ref1], en
      voor zover niet ontstaan door nog niet tot het resultaat gerekende waardeveranderingen van afdekkingstransacties of
      door waardering van rentedragende waarden tegen de actuele waarde;

      b. het gestorte deel op schuldtitels met onbepaalde looptijd en andere financieringsinstrumenten indien:

      1°. aflossing slechts plaatsvindt indien de Nederlandsche Bank daartoe, op verzoek van de financiële onderneming,
      instemming verleent;

      2°. de schuldovereenkomst bepaalt dat de financiële onderneming de rentebetaling over de schuld mag uitstellen;

      3°. de documenten inzake de uitgifte van de schuldtitels bepalen dat schuld en niet betaalde rente kunnen worden
      gebruikt om verliezen op te vangen, terwijl de financiële onderneming haar werkzaamheden kan voortzetten; en

      4°. de vorderingen van de crediteur volledig achtergesteld zijn bij die van alle niet-achtergestelde crediteuren;

      c. cumulatief preferente aandelen met onbepaalde looptijd, voor zover deel uitmakend van het gestorte kapitaal;

      d. het verschil, indien positief, van de som van de waardeaanpassingen en voorzieningen die samenhangen
      met de verwachte verliesposten in verband met de activa en posten buiten de balanstelling, bedoeld in
      [artikel 71, eerste lid, onderdelen a tot en met d][ref2], en de som van die verwachte verliesposten
      berekend ingevolge [artikel 75, eerste lid, onderdelen a en c][ref3], indien de financiële onderneming
      [paragraaf 10.2][ref4] toepast en dit verschil in aanmerking genomen wordt tot ten hoogste 0,6 procent van
      het totaal van de naar risico gewogen activa en posten buiten de balanstelling, met dien verstande dat bij de
      berekening van de naar risico gewogen activa en posten buiten de balanstelling niet de securitisatieposities
      waaraan een risicogewicht van 1250 procent is toegekend in aanmerking worden genomen; de waardeaanpassingen en
      voorzieningen worden slechts op grond van dit onderdeel als toetsingsvermogen van de financiële onderneming in
      aanmerking genomen; en

      e. het belang van derden, voor zover het vermogensbestanddelen als bedoeld in dit lid omvat.

      3 Het lager aanvullend kapitaal wordt gevormd door de waarde van:

      a. aansprakelijkheidsverplichtingen van leden, indien het een coöperatie betreft, te weten het niet gestorte
      kapitaal en statutaire verplichtingen van die leden tot het doen van aanvullende niet-aflosbare stortingen bij
      verlies, indien die stortingen in dat geval onmiddellijk gevorderd kunnen worden;

      b. preferente en cumulatief preferente aandelen met een vaste looptijd, voor zover deel uitmakend van het gestorte
      kapitaal;

      c. het gestorte deel op langlopende achtergestelde leningen indien:

      1°. de vorderingen van de crediteur, voor zover het de terugbetaling van het leningbedrag betreft, volledig
      achtergesteld zijn bij die van alle andere crediteuren;

      2°. de achtergestelde lening een vaste looptijd van oorspronkelijk ten minste vijf jaar of, indien de looptijd
      onbepaald is, een opzeggingstermijn van ten minste vijf jaar heeft;

      3°. vervroegde aflossing slechts plaatsvindt indien de Nederlandsche Bank daartoe, op verzoek van de financiële
      onderneming, besluit;

      4°. de hoogte tot welke de achtergestelde lening in aanmerking kan worden genomen als lager aanvullend kapitaal
      lineair wordt verlaagd gedurende ten minste de vijf jaar die voorafgaan aan de datum van de aflossing; en

      5°. de leningovereenkomst geen bepaling bevat op grond waarvan de achtergestelde lening voor het einde van de
      looptijd, anders dan bij liquidatie, moet worden afgelost; en

      d. het belang van derden, voor zover het vermogensbestanddelen als bedoeld in dit lid omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel91
