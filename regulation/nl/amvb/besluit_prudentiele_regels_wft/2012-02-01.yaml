  - number: '112'
    text: |-
      De aanwezige liquiditeit van een beleggingsinstelling als bedoeld in [artikel 3:63][ref1] of
      [3:66 van de wet][ref2] wordt gevormd door de volgende posten:

      a. kasmiddelen, daggeld en direct opvraagbare tegoeden bij banken die een vergunning als bedoeld in
      [artikel 2:11 van de wet][ref3] hebben of waarop toezicht op het uitoefenen van het bedrijf van bank wordt
      uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen;

      b. kortlopende schuldtitels aan toonder;

      c. financiële instrumenten die zijn toegelaten tot de handel aan een gereglementeerde markt of een markt in
      financiële instrumenten waarvan de houder gevestigd is in een staat die deel uitmaakt van de G10 of aan een andere
      door de Nederlandsche Bank aangewezen gereglementeerde markt;

      d. officiële stand-by faciliteiten afgegeven door banken die een vergunning als bedoeld in
      [artikel 2:11 van de wet][ref4] hebben of waarop toezicht op het uitoefenen van het bedrijf van bank wordt
      uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen; en

      e. onvoorwaardelijke garanties van banken en verzekeraars die een vergunning als bedoeld in [artikel 2:11][ref5]
      onderscheidenlijk [artikel 2:27 van de wet][ref6] hebben of waarop toezicht op het uitoefenen van het bedrijf van
      bank onderscheidenlijk verzekeraar wordt uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de
      belangen die de [wet][ref7] beoogt te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel363
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel366
