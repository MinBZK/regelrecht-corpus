      1 Het minimumbedrag aan eigen vermogen, bedoeld in [artikel 3:53, eerste lid, van de wet][ref1] bedraagt:

      a. € 5 miljoen voor een bank als bedoeld in [artikel 3:53, eerste lid][ref2], of
      [3:54, eerste lid, van de wet][ref3] die geen bank als bedoeld in onderdeel b is, of voor een clearinginstelling
      als bedoeld in [artikel 3:53, eerste lid][ref4], of [3:55, eerste lid, van de wet][ref5];

      b. € 2,5 miljoen voor een bank als bedoeld in [artikel 2:13 van de wet][ref6] die in hoofdzaak haar bedrijf maakt
      van het verlenen van beleggingsdiensten of het verrichten van beleggingsactiviteiten;

      c. € 225.000 voor een beheerder als bedoeld in [artikel 3:53, eerste lid][ref7], of
      [3:55, eerste lid, van de wet][ref8] die geen beheerder van een instelling voor collectieve belegging in effecten
      is en die een vermogen van ten minste € 250 miljoen beheert;

      d. € 125.000 voor een beheerder van een instelling voor collectieve belegging in effecten als
      bedoeld in [artikel 3:53, eerste lid, van de wet][ref9] of voor een beheerder als bedoeld in
      [artikel 3:53, eerste lid][ref10], of [3:55, eerste lid, van de wet][ref11] die geen beheerder van een instelling
      voor collectieve belegging in effecten is en die een vermogen van minder dan € 250 miljoen beheert;

      e. € 300.000 voor een beleggingsmaatschappij als bedoeld in [artikel 3:53, eerste lid, van de wet][ref12] die een
      instelling voor collectieve belegging in effecten is en die geen aparte beheerder heeft;

      f. € 35.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref13], of
      [3:54, eerste lid, van de wet][ref14] die uitsluitend de beleggingsdienst, bedoeld in onderdeel a van de definitie
      van verlenen van een beleggingsdienst in [artikel 1:1 van de wet][ref15], verleent en die deze beleggingsdienst
      niet vanuit een bijkantoor in een andere lidstaat of door middel van het verrichten van diensten naar een andere
      lidstaat mag verlenen;

      g. € 50.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref16], of
      [3:54, eerste lid, van de wet][ref17], die de beleggingsdienst, bedoeld in onderdeel a van de definitie van
      verlenen van een beleggingsdienst in [artikel 1:1 van de wet][ref18], vanuit een bijkantoor in een andere lidstaat
      of door middel van het verrichten van diensten naar een andere lidstaat mag verlenen;

      h. € 50.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref19], of
      [3:54, eerste lid, van de wet][ref20], niet zijnde een beleggingsonderneming als bedoeld in onderdeel g,
      die de beleggingsdienst verleent, bedoeld in onderdeel b, c, d of f, van de definitie van verlenen van een
      beleggingsdienst in [artikel 1:1 van de wet][ref21];

      i. € 730.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref22], of
      [3:54, eerste lid, van de wet][ref23], niet zijnde een beleggingsonderneming als bedoeld in onderdeel f of g, die
      de beleggingsdienst verleent, bedoeld in onderdeel e van de definitie van verlenen van een beleggingsdienst in
      [artikel 1:1 van de wet][ref24];

      j. € 730.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref25], of
      [3:54, eerste lid, van de wet][ref26], niet zijnde een beleggingsonderneming als bedoeld in onderdeel f
      of g, die de beleggingsactiviteit verricht, bedoeld in onderdeel a van de definitie van verrichten van een
      beleggingsactiviteit in [artikel 1:1 van de wet][ref27];

      k. € 730.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref28], of
      [3:54, eerste lid, van de wet][ref29], die de beleggingsactiviteit verricht, bedoeld in onderdeel b van de
      definitie van verrichten van een beleggingsactiviteit in [artikel 1:1 van de wet][ref30];

      l. € 20.000 voor een betaalinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref31] die uitsluitend
      de in punt 6 van de bijlage bij de richtlijn betaaldiensten vermelde betaaldienst verleent;

      m. € 50.000 voor een betaalinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref32] die uitsluitend
      de in punt 7 van de richtlijn betaaldiensten vermelde betaaldienst verleent;

      n. € 125.000 voor een betaalinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref33] die een in de
      punten 1 tot en met 5 van de bijlage bij de richtlijn betaaldiensten vermelde betaaldienst verleent;

      o. € 112.500 voor een bewaarder als bedoeld in [artikel 3:53, eerste lid][ref34], of
      [3:55, eerste lid, van de wet][ref35];

      p. € 350.000 voor een elektronischgeldinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref36];

      q. € 225.000 voor een premiepensioeninstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref37];

      r. € 112.500 voor een pensioenbewaarder als bedoeld in [artikel 3:53, eerste lid, van de wet][ref38].

      2 Het eerste lid is niet van toepassing op beleggingsondernemingen als bedoeld in
      [artikel 3:53, eerste lid][ref39], of [3:54, eerste lid, van de wet][ref40] die geen andere beleggingsdienst
      mogen verlenen dan de beleggingsdienst, bedoeld in onderdeel a of d van de definitie van verlenen van een
      beleggingsdienst in [artikel 1:1 van de wet][ref41], en geen nevendiensten als bedoeld in onderdeel a van de
      definitie van nevendienst in [artikel 1:1 van de wet][ref42] verrichten, indien zij beschikken over:

      a. een beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening die de aansprakelijkheid dekt
      van de beleggingsonderneming wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van diens beroep en
      voorgevallen op het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing
      is, voor een bedrag van ten minste € 1.120.200 per schadegeval en ten minste € 1.680.300 per jaar voor alle
      schadegevallen gezamenlijk; of

      b. een combinatie van een bedrag aan eigen vermogen als bedoeld in het eerste lid, onderdelen g of h en een
      beroepsaansprakelijkheidsverzekering als bedoeld in onderdeel a die resulteert in een dekking die ten minste
      gelijkwaardig is aan € 50.000 of onderdeel a.

      3 Onverminderd het eerste lid, aanhef en onderdeel g of h, beschikken beleggingsondernemingen als bedoeld in het
      tweede lid, waaraan een vergunning als bedoeld in [artikel 2:80][ref43] of [2:86 van de wet][ref44] is verleend,
      over:

      a. een minimumbedrag aan eigen vermogen van € 25.000;

      b. een beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening die hun aansprakelijkheid
      dekt wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van hun beroep en voor gevallen op het
      grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, voor een bedrag
      van ten minste € 500.000 per schadegeval en ten minste € 750.000 per jaar voor alle schadegevallen gezamenlijk; of

      c. een combinatie van een beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening als bedoeld
      in onderdeel a die resulteert in een dekking die ten minste gelijkwaardig is aan € 25.000 of onderdeel b.


