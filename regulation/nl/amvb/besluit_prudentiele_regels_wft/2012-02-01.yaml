      1 De vertegenwoordiger, bedoeld in [artikel 3:40][ref1], [3:47, zesde lid][ref2], of
      [3:50, tweede lid, van de wet][ref3] die voornemens is de vertegenwoordiging te beëindigen, geeft daarvan kennis
      aan de Nederlandsche Bank.

      2 De vertegenwoordiger van een verzekeraar als bedoeld in [artikel 3:47, eerste lid][ref4], of
      [3:50, tweede lid, van de wet][ref5] behoudt de hoedanigheid van vertegenwoordiger tot de dag waarop hij van de
      beëindiging kennis heeft gegeven aan de Nederlandsche Bank.

      3 De vertegenwoordiger geeft geen uitvoering aan het voornemen indien de Nederlandsche Bank er niet mee instemt.
      Indien de Nederlandsche Bank besluit niet in te stemmen met het voornemen, maakt zij haar besluit daartoe aan de
      financiële onderneming bekend:

      a. binnen zes weken na ontvangst van de kennisgeving; of

      b. indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.


