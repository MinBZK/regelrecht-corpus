  - number: '70'
    text: |-
      1 De Nederlandsche Bank kan een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1], op
      verzoek, toestemming verlenen een interne modellenmethode stapsgewijs in te voeren:

      a. per categorie of, ingeval van de categorie, bedoeld in [artikel 71, eerste lid, aanhef en onderdeel d][ref2],
      per subcategorie activa of posten buiten de balanstelling, bedoeld in [artikel 71, eerste lid][ref3];

      b. binnen dezelfde bedrijfsactiviteit;

      c. per bedrijfsactiviteit binnen dezelfde groep; of

      d. voor het gebruik van eigen ramingen van verliezen bij wanbetaling en omrekeningsfactoren voor de berekening
      van risicogewichten voor vorderingen op ondernemingen, banken en beleggingsondernemingen en centrale overheden en
      centrale banken.

      2 De Nederlandsche Bank stelt regels teneinde te waarborgen dat de stapsgewijze invoering, bedoeld in het eerste
      lid, binnen een redelijke termijn plaatsvindt en niet wordt gebruikt om voor de categorieën vorderingen of
      bedrijfsactiviteiten, bedoeld in het eerste lid, waarop een interne modellenmethode niet wordt toegepast een lagere
      minimumomvang van het toetsingsvermogen te bereiken.

      3 De financiële onderneming die voor enige categorie activa of posten buiten de balanstelling, bedoeld in
      [artikel 71, eerste lid][ref4], een interne modellenmethode gebruikt, gebruikt deze ook voor de posities in
      aandelen, bedoeld in onderdeel e van laatstgenoemd lid.

      4 Onverminderd het eerste tot en met derde lid en [artikel 76][ref5] valt de financiële onderneming die ingevolge
      [artikel 69, eerste lid][ref6], toestemming heeft verkregen voor het gebruik van een interne modellenmethode, voor
      de berekening van de bedragen van de naar risico gewogen activa en posten buiten de balanstelling niet terug op
      [artikel 61][ref7], tenzij de Nederlandsche Bank daarmee instemt.

      5 Onverminderd het eerste en tweede lid en [artikel 76][ref8] is het de financiële onderneming die ingevolge
      [artikel 69, eerste lid][ref9], toestemming heeft verkregen voor het gebruik van eigen ramingen van verliezen bij
      wanbetaling en omrekeningsfactoren, niet toegestaan voor de berekening van de bedragen van de naar risico gewogen
      activa en posten buiten de balanstelling daarna alsnog de ingevolge [artikel 73, tweede lid][ref10], door de
      Nederlandsche Bank vastgestelde waarde van verliezen bij wanbetaling en omrekeningsfactoren te gebruiken, tenzij de
      Nederlandsche Bank daarmee instemt.


