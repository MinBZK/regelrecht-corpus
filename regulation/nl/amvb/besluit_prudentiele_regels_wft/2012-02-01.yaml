  - number: '135'
    text: |-
      1 Een levensverzekeraar als bedoeld in [artikel 3:74, eerste lid][ref1], [3:78, eerste lid][ref2], of
      [3:83, eerste lid, van de wet][ref3], vermeldt bij de opgave van gesloten levensverzekeringen per branche de in het
      boekjaar geboekte premies, niet verminderd met het bedrag van de herverzekering.

      2 Een schadeverzekeraar als bedoeld in [artikel 3:74, eerste lid][ref4], [3:78, eerste lid][ref5], of
      [3:83, eerste lid, van de wet][ref6] vermeldt bij de opgave van gesloten schadeverzekeringen per branchegroep de in
      het boekjaar geboekte premies, schaden en provisies, telkens niet verminderd met het bedrag van de herverzekering.
      Deze gegevens alsmede de frequentie en de gemiddelde kosten van de schadegevallen, worden voor de branche
      Aansprakelijkheid motorrijtuigen evenwel afzonderlijk vermeld. De Nederlandsche Bank stelt de branchegroepen vast.

      3 Een natura-uitvaartverzekeraar als bedoeld in [artikel 3:87, eerste lid, van de wet][ref7], vermeldt bij de
      opgave van gesloten natura-uitvaartverzekeringen de in het boekjaar geboekte premies, niet verminderd met het
      bedrag van de herverzekering.

      4 Een verzekeraar als bedoeld in [artikel 3:74, eerste lid][ref8], of [3:83, eerste lid, van de wet][ref9] vermeldt
      bij de in dat artikellid bedoelde opgave de gegevens, bedoeld in het eerste en tweede lid, per lidstaat.

      5 De [artikelen 131, eerste lid, aanhef en onderdeel a][ref10], en [132][ref11] zijn van overeenkomstige toepassing
      op de verstrekking van de opgaven, bedoeld in het eerste tot en met derde lid.


