  - number: 24b
    text: |-
      1 Het risicobeheer, bedoeld in [artikel 23, zesde lid][ref1], van een bank die in Nederland beleggingsdiensten
      mag verlenen of beleggingsactiviteiten mag verrichten, een beheerder van een instelling voor collectieve belegging
      in effecten, of beleggingsonderneming als bedoeld in [artikel 3:17, eerste en derde lid][ref2], [3:22][ref3] of
      [3:23, tweede lid, van de wet][ref4] oefent controle uit op:

      a. de deugdelijkheid en effectiviteit van de door de bank, beheerder van een instelling voor collectieve
      belegging in effecten of beleggingsonderneming vastgestelde procedures en maatregelen, bedoeld in
      [artikel 23, derde lid][ref5];

      b. de mate waarin de bank, beheerder van een instelling voor collectieve belegging in effecten of
      beleggingsonderneming en haar medewerkers de procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref6],
      naleven; en

      c. de deugdelijkheid en effectiviteit van de maatregelen die zijn genomen om gesignaleerde tekortkomingen of
      gebreken op te heffen.

      2 Het risicobeheer rapporteert ten minste jaarlijks aan personen die het dagelijks beleid van de bank, beheerder
      of beleggingsonderneming bepalen en aan het orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de
      algemene gang van zaken van de bank, beheerder of beleggingsonderneming. In de jaarlijkse rapportage wordt met name
      aangegeven of maatregelen zijn genomen in het geval van gesignaleerde onvolkomenheden.

      3 Het risicobeheer van een beheerder van een instelling voor collectieve belegging in effecten brengt regelmatig
      verslag uit aan de personen die het dagelijks beleid van de beheerder bepalen en aan het orgaan, indien aanwezig,
      dat is belast met het toezicht op het beleid en de algemene gang van zaken van de beheerder over:

      a. de consistentie tussen de actuele omvang van het risico dat elke door hem beheerde instelling voor collectieve
      belegging in effecten loopt, en het risicoprofiel dat voor deze instelling voor collectieve belegging in effecten
      is overeengekomen;

      b. de nakoming van het relevante risicolimietensysteem door elke door hem beheerde instelling voor collectieve
      belegging in effecten; en

      c. de deugdelijkheid en effectiviteit van de risicobeheerprocedure, waarbij met name wordt aangegeven of passende
      maatregelen zijn genomen in het geval van gesignaleerde onvolkomenheden.

      4 Het risicobeheer van een beheerder van een instelling voor collectieve belegging in effecten brengt aan de
      personen die het dagelijks beleid bepalen van de beheerder:

      a. advies uit betreffende de identificatie van het risicoprofiel van elke door de beheerder beheerde instelling
      voor collectieve belegging in effecten; en

      b. regelmatig verslag uit over de actuele omvang van het risico dat elke door de beheerder beheerde instelling
      voor collectieve belegging in effecten loopt en feitelijke of voorzienbare inbreuken op de limieten van de
      desbetreffende instelling voor collectieve belegging in effecten opdat onmiddellijk passende maatregelen kunnen
      worden ondernomen.

      5 Het risicobeheer van een beheerder van een instelling voor collectieve belegging in
      effecten onderzoekt en ondersteunt in voorkomend geval de procedures en maatregelen,
      bedoeld in de [artikelen 34, eerste lid, onderdeel g, en derde lid][ref7], en
      [34a van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref8].


