  - number: '73'
    text: |-
      1 De regels, bedoeld in [artikel 72, eerste lid][ref1], voorzien in berekening op basis van de volgende parameters:

      a. de kans op wanbetaling;

      b. het verlies bij wanbetaling;

      c. de looptijd; en

      d. de waarde van de desbetreffende activa of posten buiten de balanstelling, bepaald door onder meer de
      omrekeningsfactoren.

      2 De door de Nederlandsche Bank ingevolge [artikel 72, eerste lid][ref2], te stellen regels omvatten mede
      regels met betrekking tot de waarden van verlies bij wanbetaling en de omrekeningsfactoren alsmede voorwaarden
      voor het gebruik van eigen ramingen van de kans op wanbetaling, het verlies bij wanbetaling, de looptijd en de
      omrekeningsfactoren.

      3 In de door haar ingevolge [artikel 72, eerste lid][ref3], te stellen regels kan de Nederlandsche Bank
      afwijken van het eerste lid, voor zover het betreft de berekening van het bedrag van de naar kredietrisico
      gewogen posities in aandelen, bedoeld in [artikel 71, eerste lid, onderdeel e][ref4], waaronder posities in
      instellingen voor collectieve belegging, vorderingen uit hoofde van gespecialiseerde kredietverlening, bedoeld
      in [artikel 71, eerste lid, onderdeel c][ref5], of andere activa of posten buiten de balanstelling die geen
      kredietverplichting vertegenwoordigen, bedoeld in [artikel 71, eerste lid, onderdeel g][ref6].


