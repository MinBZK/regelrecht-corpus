  - number: '98'
    text: |-
      1 Voor de toepassing van de [artikelen 95 tot en met 97][ref1] ten aanzien van herverzekeraars, levensverzekeraars
      en schadeverzekeraars:

      a. wordt de waarde van de vermogensbestanddelen, bedoeld in [artikel 95, tweede lid][ref2], verminderd met de
      waarde van de posten, bedoeld in [artikel 95, derde lid][ref3], volledig voor de berekening van de aanwezige
      solvabiliteitsmarge in aanmerking genomen;

      b. wordt de waarde van de vermogensbestanddelen, bedoeld in de [artikelen 96][ref4] en [97][ref5], voor zover
      het niet betreft de meerwaarden in verband met de onderwaardering van activa of overwaardering van de technische
      voorzieningen ingevolge [artikel 121, vierde lid][ref6], voor de berekening van de aanwezige solvabiliteitsmarge
      gezamenlijk slechts in aanmerking genomen voor zover deze niet meer bedraagt dan vijftig procent van het totaal van
      de aanwezige solvabiliteitsmarge of het minimumbedrag aan solvabiliteitsmarge, naar gelang welk bedrag het laagst
      is; en

      c. wordt de waarde van de vermogensbestanddelen, bedoeld in [artikel 96, onderdelen a en b][ref7], met een
      vaste looptijd voor de berekening van de aanwezige solvabiliteitsmarge gezamenlijk slechts in aanmerking genomen
      voor zover deze niet meer bedragen dan 25 procent van het totaal van de aanwezige solvabiliteitsmarge of het
      minimumbedrag aan solvabiliteitsmarge, naar gelang welk bedrag het laagst is.

      2 Voor de toepassing van de [artikelen 95 tot en met 97][ref8] ten aanzien van natura-uitvaartverzekeraars:

      a. wordt de waarde van de vermogensbestanddelen, bedoeld in [artikel 95, tweede lid][ref9], verminderd met de
      waarde van de posten, bedoeld in [artikel 95, derde lid][ref10], volledig voor de berekening van de aanwezige
      solvabiliteitsmarge in aanmerking genomen;

      b. wordt de waarde van de vermogensbestanddelen, bedoeld in de [artikelen 96][ref11] en
      [97, eerste lid, onderdeel b][ref12], voor de berekening van de aanwezige solvabiliteitsmarge gezamenlijk
      slechts in aanmerking genomen voor zover deze niet meer bedraagt dan vijftig procent van het minimumbedrag aan
      solvabiliteitsmarge; en

      c. wordt de waarde van de vermogensbestanddelen, bedoeld in [artikel 96, onderdelen a en b][ref13], met een vaste
      looptijd voor de berekening van de aanwezige solvabiliteitsmarge gezamenlijk slechts in aanmerking genomen voor
      zover deze niet meer bedraagt dan 25 procent van het minimumbedrag aan solvabiliteitsmarge.

      3 Voor de berekening van de aanwezige solvabiliteitsmarge van een herverzekeraar die zijn bedrijf uitoefent
      in de activiteit levensherverzekering, levensverzekeraar of natura-uitvaartverzekeraar wordt niet meegerekend
      het positieve verschil tussen de gedisconteerde technische voorzieningen die niet worden gedekt door
      rentedragende beleggingen met dezelfde looptijd, berekend met een voorzichtige vaste disconteringsvoet en met
      de disconteringsvoet die is gebruikt voor de toets, bedoeld in [artikel 121, tweede lid][ref14], tenzij hiermee
      reeds rekening gehouden is in de balanswaardering van de technische voorzieningen. De Nederlandsche Bank stelt de
      voorzichtige vaste disconteringsvoet vast.

      4 Voor de berekening van de aanwezige solvabiliteitsmarge van een herverzekeraar die zijn bedrijf uitoefent in de
      activiteit schadeherverzekering of schadeverzekeraar, die overeenkomstig [artikel 121, tweede lid][ref15], de toets
      naar de toereikendheid van de balanswaarde van de voorzieningen uitvoert, wordt niet meegerekend het positieve
      verschil tussen de uitkomst van de toets zonder discontering en de balanswaarde van de technische voorzieningen,
      bedoeld in [artikel 121, vierde lid][ref16], voor alle verplichtingen die geen verband houden met de branches
      Ongevallen en Ziekte en die niet resulteren in periodieke uitkeringen. Het derde lid is van overeenkomstige
      toepassing op de in de toets naar de toereikendheid van de balanswaarde van de voorzieningen betrokken
      verplichtingen die verband houden met de branches Ongevallen en Ziekte of die resulteren in periodieke uitkeringen.


