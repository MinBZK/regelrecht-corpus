    text: |-
      1 De Nederlandsche Bank stelt regels met betrekking tot de berekening van de verwachte verliesposten in verband
      met:

      a. activa en posten buiten de balanstelling, bedoeld in [artikel 71, eerste lid, onderdelen a tot en met e][ref1];

      b. posities in instellingen voor collectieve belegging, bedoeld in [artikel 73, derde lid][ref2]; en

      c. het verwateringsrisico van gekochte kortlopende handelsvorderingen.

      2 De verwachte verliesposten in verband met securitisatieposities, bedoeld in
      [artikel 71, eerste lid, onderdeel f][ref3], worden berekend volgens [paragraaf 10.4][ref4].

      3 De verwachte verliespost bij activa of posten buiten de balanstelling die geen kredietverplichting
      vertegenwoordigen, bedoeld in [artikel 71, eerste lid, onderdeel g][ref5], is gelijk aan nul.


