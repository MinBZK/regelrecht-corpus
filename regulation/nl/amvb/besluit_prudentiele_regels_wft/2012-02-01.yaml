  - number: '97'
    text: |-
      1 De Nederlandsche Bank kan er, op verzoek, mee instemmen dat de verzekeraar bij de berekening van de aanwezige
      solvabiliteitsmarge, bedoeld in [artikel 95, eerste lid][ref1], tevens de waarde betrekt van:

      a. meerwaarden in verband met de onderwaardering van activa of overwaardering van de technische voorzieningen
      ingevolge [artikel 121, vierde lid][ref2];

      b. suppletiebijdragen die een onderlinge waarborgmaatschappij die het bedrijf van herverzekeraar die zijn bedrijf
      uitoefent in de activiteit schadeherverzekering, natura-uitvaartverzekeraar of schadeverzekeraar uitoefent, tijdens
      het boekjaar krachtens de statuten van haar leden kan eisen tot maximaal vijftig procent van het verschil tussen de
      maximumbijdragen en de werkelijk gevorderde bedragen; of

      c. de helft van het geplaatste, niet-gestorte kapitaal of van het in aandelen verdeeld waarborgkapitaal indien van
      het geplaatste kapitaal minimaal 25 procent is gestort.

      2 De Nederlandsche Bank stelt nadere regels met betrekking tot de voorwaarden waaronder de suppletiebijdragen,
      bedoeld in het eerste lid, onderdeel b, bij de berekening kunnen worden betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel121
