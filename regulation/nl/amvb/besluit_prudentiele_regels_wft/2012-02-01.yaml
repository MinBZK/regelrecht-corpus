  - number: '91'
    text: |-
      1 Het kernkapitaal wordt gevormd door de waarde van de vermogensbestanddelen, bedoeld in het tweede lid, verminderd
      met de waarde van de posten, bedoeld in het derde lid.

      2 De voor de bepaling van het kernkapitaal in aanmerking te nemen vermogensbestanddelen zijn:

      a. de vermogensbestanddelen, voorzover deze bestanddelen de verliezen bij doorgaande bedrijfsvoering volledig
      opvangen en in geval van faillissement of liquidatie achtergesteld zijn bij alle andere schuldvorderingen en
      preferente aandelen;

      1°. voor een naamloze of besloten vennootschap: het geplaatste en volgestorte aandelenkapitaal, met uitsluiting van
      preferente aandelen;

      2°. voor een vennootschap onder firma: de afgezonderde gestorte vermogensbestanddelen van de beherende vennoten;

      3°. voor een commanditaire vennootschap: de afgezonderde gestorte vermogensbestanddelen van de beherende vennoten
      alsmede het gestorte commanditaire kapitaal;

      4°. voor een coöperatie: het door de leden gestorte of ingelegde kapitaal;

      5°. voor een onderneming die een andere rechtsvorm heeft dan de hierboven genoemde: het positieve verschil tussen
      bezittingen en schulden;

      b. reserves, met uitsluiting van de herwaarderingsreserves en, in het geval de financiële onderneming een
      initiator van een securitisatie is, met uitsluiting van de nettowinsten die zijn ontstaan uit de kapitalisatie van
      toekomstige inkomsten uit de gesecuritiseerde activa en die als kredietverbetering voor de securitisatieposities
      dienen;

      c. positieve eindejaarsresultaten of tussentijdse resultaten beoordeeld door een accountant, voordat een
      formeel besluit is genomen omtrent de vaststelling, verminderd met alle te verwachten lasten en met voorziene
      dividenduitkeringen;

      d. het fonds ter dekking van algemene bankrisico’s;

      e. het belang van derden, voor zover het vermogensbestanddelen als bedoeld in dit lid omvat;

      f. de negatieve onderdelen van de herwaarderingsreserves, voor zover ontstaan door waardeveranderingen van
      beleggingen in niet-rentedragende waarden;

      g. negatieve tussentijdse resultaten of eindejaarsresultaten; en

      h. vermogensbestanddelen die voldoen aan [artikel 91a][ref1].

      3 De voor de bepaling van het kernkapitaal in aanmerking te nemen posten zijn:

      a. reserves, voor zover ontstaan door ongerealiseerde resultaten op de eigen kredietwaardigheid van de financiële
      onderneming;

      b. de boekwaarde van de door de financiële onderneming uitgegeven effecten en van afgeleide financiële instrumenten
      op door de financiële onderneming uitgegeven effecten, voor zover het vermogensbestanddelen als bedoeld in het
      tweede lid omvat;

      c. immateriële activa;

      d. reserves, voor zover ontstaan door nog niet tot het resultaat gerekende waardeveranderingen van
      afdekkingstransacties; en

      e. in geval van een financiële onderneming die [artikel 90, tweede lid][ref2], toepast, of een beheerder van een
      instelling voor collectieve belegging in effecten, de volgende niet-liquide activa:

      1°. materiële vaste activa andere dan terreinen en gebouwen die in aanmerking genomen kunnen worden tegenover de
      leningen waarvoor zij als zekerheid dienen;

      2°. de posten, bedoeld in [artikel 94, tweede lid, aanhef en onderdelen a tot en met e][ref3], waarbij het
      [vijfde tot en met zevende lid van dat artikel][ref4] van overeenkomstige toepassing zijn;

      3°. niet onmiddellijk verhandelbare deelnemingen en andere beleggingen in ondernemingen die geen entiteit voor
      risico-acceptatie, financiële instelling, bank of verzekeraar zijn;

      4°. tekorten bij dochterondernemingen;

      5°. deposito’s, uitgezonderd deposito’s die binnen negentig dagen opvraagbaar zijn of margebetalingen in verband
      met rechten op overdracht op termijn van goederen en optiecontracten;

      6°. leningen en andere verschuldigde bedragen, die niet binnen negentig dagen hoeven worden afgelost; en

      7°. fysieke voorraden.


