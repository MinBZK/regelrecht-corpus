    text: |-
      1 Berekeningen met betrekking tot het minimumbedrag aan eigen vermogen, de solvabiliteit en de liquiditeit
      op grond van de [hoofdstukken 9][ref1], [10][ref2] onderscheidenlijk [11][ref3] worden, voor zover
      niet anders is bepaald, gedaan op basis van de enkelvoudige jaarrekening zoals opgemaakt ingevolge
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref4] of de internationale jaarrekeningstandaarden.

      2 Berekeningen met betrekking tot de solvabiliteit van banken op grond van [hoofdstuk 10][ref5]
      en de liquiditeit van banken op grond van [hoofdstuk 11][ref6] worden, voor zover niet anders is
      bepaald, gedaan op basis van de geconsolideerde jaarrekening indien deze wordt opgemaakt ingevolge
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref7] of de internationale jaarrekeningstandaarden.


