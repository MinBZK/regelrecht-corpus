  - number: '67'
    text: |-
      1 Het minimumbedrag aan solvabiliteitsmarge van een schadeverzekeraar als bedoeld in
      [artikel 3:57, eerste lid][ref1], of [3:58, eerste of tweede lid, van de wet][ref2] bedraagt het product van het
      op grond van onderdeel c van dit lid berekende percentage, vermenigvuldigd met het hoogste van de op grond van de
      onderdelen a en b van dit lid berekende bedragen. De bedragen en het percentage worden als volgt berekend:

      a. achttien procent van de in het afgelopen boekjaar geboekte dan wel verdiende premies, naargelang welk bedrag
      het hoogst is en van de in rekening gebrachte poliskosten, voor zover deze premies en kosten niet meer bedragen
      dan € 61,3 miljoen, vermeerderd met zestien procent van deze premies en kosten voor zover deze meer bedragen dan €
      61,3 miljoen;

      b. 26 procent van de gemiddeld geboekte bruto schaden in de afgelopen drie boekjaren en van de gemiddelde
      toevoeging aan de schadevoorziening in deze jaren, voor zover deze schaden en toevoeging niet meer bedragen dan €
      42,9 miljoen, vermeerderd met 23 procent van deze schaden en toevoeging, voor zover deze meer bedragen dan € 42,9
      miljoen;

      c. de verhouding, welke ten minste vijftig procent bedraagt, tussen de schaden die voor eigen rekening komen van de
      verzekeraar na overdracht uit hoofde van herverzekering en de bruto schaden in de afgelopen drie boekjaren.

      2 Voor zover het de berekening met betrekking tot de branches Aansprakelijkheid luchtvaartuigen, Aansprakelijkheid
      zee- en binnenschepen en Algemene aansprakelijkheid betreft, worden de geboekte dan wel verdiende premies, bedoeld
      in het eerste lid, onderdeel a, of de geboekte bruto schaden, bedoeld in het eerste lid, onderdeel b, met vijftig
      procent verhoogd. De Nederlandsche Bank kan besluiten dat voor de toerekening van de geboekte dan wel verdiende
      premies of geboekte bruto schaden aan de genoemde branches gebruik kan worden gemaakt van statistische methoden.

      3 Voor zover het een schadeverzekeraar betreft die in hoofdzaak ten minste een van de risico’s van kredietschade,
      stormschade, hagelschade of vorstschade dekt, wordt in de berekening en de verhouding, bedoeld in het eerste lid,
      onderdeel b onderscheidenlijk onderdeel c, uitgegaan van de afgelopen zeven boekjaren.

      4 Voor zover het de branche Hulpverlening betreft, wordt voor het bedrag van de geboekte bruto schaden, bedoeld
      in het eerste lid, onderdeel b, uitgegaan van de voor de schadeverzekeraar uit de verleende hulp voortvloeiende
      kosten.

      5 Voor de toepassing van dit artikel wordt de hogekostencompensatie, bedoeld in
      [artikel 1, onderdeel dd, van het Besluit zorgverzekering][ref3], aangemerkt als herverzekering.

      6 Voor de toepassing van dit artikel worden ontvangen premies en betaalde of te betalen schaden in verband met
      schadeverzekeringen, die ingevolge de internationale jaarrekeningstandaarden niet als zodanig worden aangemerkt, in
      aanmerking genomen.

      7 Indien het minimumbedrag aan solvabiliteitsmarge zoals berekend overeenkomstig dit artikel lager is dan
      het minimumbedrag aan solvabiliteitsmarge van het voorafgaande boekjaar, dan bedraagt het minimumbedrag aan
      solvabiliteitsmarge ten minste de uitkomst van de volgende berekening: het minimumbedrag aan solvabiliteitsmarge
      van het voorafgaande boekjaar wordt vermenigvuldigd met de verhouding, welke ten hoogste honderd procent bedraagt,
      tussen de bedragen voor technische voorzieningen voor te betalen schaden verminderd met het bedrag van de
      overdrachten uit herverzekering aan het einde van het boekjaar en de bedragen voor technische voorzieningen voor te
      betalen schaden verminderd met het bedrag van de overdrachten uit herverzekering aan het begin van het boekjaar.

      8 [Artikel 65, vierde lid][ref4], is van overeenkomstige toepassing.

      9 [Artikel 49, vierde en vijfde lid][ref5], is van overeenkomstige toepassing op de bedragen, bedoeld in het eerste
      lid, onderdelen a en b.

      10 De Nederlandsche Bank kan op aanvraag besluiten dat voor de toepassing van het eerste lid, onderdeel c, bedragen
      die op een entiteit voor risico-acceptatie kunnen worden verhaald, worden beschouwd als een overdracht uit hoofde
      van herverzekering.


