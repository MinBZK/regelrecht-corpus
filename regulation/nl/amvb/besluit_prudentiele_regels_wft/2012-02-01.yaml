  - number: '19'
    text: |-
      De bedrijfsvoering van een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-
      acceptatie, bank, premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 17][ref1] voorziet
      in een juiste, tijdige en volledige vastlegging van alle rechten en verplichtingen van de financiële onderneming of
      bijkantoor in een daartoe bestemde administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
