    text: |-
      1 Indien een aanzienlijk deel van het aan de gesecuritiseerde posten verbonden kredietrisico is overgedragen door
      een financiële onderneming als bedoeld in [artikel 83][ref1] die initiator is, mag zij:

      a. ingeval van een traditionele securitisatie de door haar gesecuritiseerde posten buiten beschouwing laten bij de
      berekening op grond van [paragraaf 10.1][ref2] of [10.2][ref3] van het bedrag van de naar risico gewogen activa en
      posten buiten de balanstelling en, indien van toepassing, van de verwachte verliesposten;

      b. ingeval van een synthetische securitisatie de naar risico gewogen activa en posten buiten de balanstelling
      en, indien van toepassing, de verwachte verliesposten voor de gesecuritiseerde posten in plaats van op grond van
      [paragraaf 10.1][ref4] of [10.2][ref5] berekenen op grond van door de Nederlandsche Bank te stellen regels.

      2 Indien het eerste lid van toepassing is, berekent de financiële onderneming het bedrag van de naar risico gewogen
      securitisatieposities op grond van [artikel 85][ref6].

      3 Indien het eerste lid niet van toepassing is, berekent de financiële onderneming het bedrag van de naar risico
      gewogen activa en posten buiten de balanstelling alsof er geen securitisatie heeft plaatsgevonden.

      4 De Nederlandsche Bank stelt regels met betrekking tot de voorwaarden waaronder de overdracht van het aan de
      securitisatieposities verbonden kredietrisico in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel83
