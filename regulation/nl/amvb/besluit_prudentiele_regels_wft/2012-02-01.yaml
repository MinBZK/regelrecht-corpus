  - number: '20'
    text: |-
      1 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie,
      bank, premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 17][ref1] beschikt over een
      informatiesysteem dat een effectieve beheersing van de bedrijfsprocessen en de risico’s mogelijk maakt en dat
      voorziet in interne en externe informatiebehoeften.

      2 De financiële onderneming of bijkantoor beschikt over procedures en maatregelen om de integriteit, voortdurende
      beschikbaarheid en beveiliging van geautomatiseerde gegevensverwerking te waarborgen.

      3 De functiescheidingen binnen de geautomatiseerde gegevensverwerking sluiten aan bij de organisatiestructuur.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel20
