  - number: '81'
    text: |-
      1 Een zekerheidsregeling wordt slechts in het kader van kredietrisicovermindering overeengekomen, indien zij in
      alle relevante rechtsgebieden rechtsgeldig en afdwingbaar is.

      2 Een financiële onderneming als bedoeld in [artikel 80][ref1] die leningverstrekkende financiële onderneming is,
      neemt alle vereiste maatregelen om de effectiviteit van de kredietrisicovermindering te waarborgen en de daaraan
      verbonden risico’s te beperken.

      3 In geval van volgestorte kredietprotectie worden geen activa in aanmerking genomen die onvoldoende zekerheid
      bieden ten aanzien van de protectie van de activa.

      4 Volgestorte kredietprotectie wordt slechts als kredietrisicovermindering in aanmerking genomen, indien
      de leningverstrekkende financiële onderneming het recht heeft om bij in gebreke blijven, insolventie of
      faillissement van de debiteur of indien van toepassing, van de bewaarnemer van de zekerheid of bij een andere
      in de desbetreffende overeenkomst vermelde gebeurtenis die betaling onder de overeenkomst of afwikkeling van
      de overeenkomst tot gevolg heeft, de activa die als zekerheid dienen zo spoedig mogelijk te liquideren of te
      behouden. De waarde van de activa die als zekerheid worden gebruikt, mag niet te nauw zijn gekoppeld aan de kans op
      wanbetaling van de debiteur.

      5 In geval van niet-volgestorte kredietprotectie mag de verstrekker van de garanties alleen in aanmerking worden
      genomen als deze betrouwbaar is en de overeenkomst tot kredietprotectie in de relevante rechtsgebieden rechtsgeldig
      en afdwingbaar is.

      6 De Nederlandsche Bank stelt nadere regels met betrekking tot de voorwaarden waaronder technieken van
      kredietrisicovermindering toelaatbaar zijn en de beperking van de aan kredietrisicovermindering verbonden risico’s.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel80
