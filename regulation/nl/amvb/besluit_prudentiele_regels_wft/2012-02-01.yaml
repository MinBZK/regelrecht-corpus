      1 Het minimumbedrag aan solvabiliteitsmarge van een natura-uitvaartverzekeraar als bedoeld in
      [artikel 3:57, eerste lid][ref1], of [3:61, eerste of tweede lid, van de wet][ref2] bedraagt de som van de als
      volgt te berekenen bedragen:

      a. voor zover het verzekeringen betreft waarbij door de natura-uitvaartverzekeraar beleggingsrisico wordt gelopen:
      de uitkomst van de berekening, bedoeld in [artikel 65, eerste lid, onderdeel a][ref3];

      b. voor zover het verzekeringen betreft waarbij door de natura-uitvaartverzekeraar geen beleggingsrisico wordt
      gelopen en waarbij de beheerslasten voor een periode van meer dan vijf jaar zijn vastgelegd: de uitkomst van de
      berekening, bedoeld in [artikel 65, eerste lid, onderdeel b][ref4];

      c. voor zover het uitstaande depots ten behoeve van uitvaarten betreft: een procent van het depotbedrag;

      d. voor alle verzekeringen: 0,3 procent van het risicokapitaal bij overlijden, vermenigvuldigd met de verhouding,
      welke ten minste vijftig procent bedraagt, tussen het risicokapitaal verminderd met het bedrag van de overdrachten
      uit hoofde van herverzekering en het risicokapitaal in het afgelopen boekjaar; en

      e. voor zover het aanvullende verzekeringen betreft: achttien procent van de in het afgelopen boekjaar geboekte
      premies en van de in rekening gebrachte poliskosten, voor zover deze premies en kosten niet meer bedragen dan €
      10 miljoen, vermeerderd met zestien procent van deze premies en kosten, voor zover deze meer bedragen dan € 10
      miljoen. De uitkomst van de berekening, bedoeld in de vorige volzin, wordt vermenigvuldigd met de verhouding,
      welke ten minste vijftig procent bedraagt, tussen de uitkeringen die voor eigen rekening komen van de natura-
      uitvaartverzekeraar na overdracht uit hoofde van herverzekering en de bruto uitkeringen in het laatste boekjaar.

      2 [Artikel 65, tweede en derde lid][ref5], is van overeenkomstige toepassing.


