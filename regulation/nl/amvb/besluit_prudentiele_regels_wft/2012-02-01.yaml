      1 Het minimumbedrag aan solvabiliteitsmarge van een levensverzekeraar als bedoeld in
      [artikel 3:57, eerste lid][ref1], of [3:58, eerste of tweede lid, van de wet][ref2] bedraagt de som van de als
      volgt te berekenen bedragen:

      a. voor zover het verzekeringen betreft waarbij door de levensverzekeraar beleggingsrisico wordt gelopen: vier
      procent van het bedrag van de bruto technische voorzieningen, vermenigvuldigd met de verhouding, welke ten minste
      85 procent bedraagt, tussen de technische voorzieningen verminderd met het bedrag van de overdrachten uit hoofde
      van herverzekering en de bruto technische voorzieningen aan het eind van het afgelopen boekjaar;

      b. voor zover het verzekeringen betreft waarbij door de levensverzekeraar geen beleggingsrisico wordt gelopen
      en waarbij de beheerslasten voor een periode van meer dan vijf jaar zijn vastgelegd: een procent van de bruto
      technische voorzieningen, vermenigvuldigd met de verhouding, welke ten minste 85 procent bedraagt, tussen de
      technische voorzieningen de overdrachten uit hoofde van herverzekering en de bruto technische voorzieningen aan het
      eind van het afgelopen boekjaar;

      c. voor zover het verzekeringen betreft waarbij door de levensverzekeraar geen beleggingsrisico wordt gelopen
      en waarbij de beheerslasten voor een periode van vijf jaar of minder zijn vastgelegd: 25 procent van de netto
      beheerslasten in verband met de bedrijfsuitoefening in het afgelopen boekjaar;

      d. voor zover het spaarkassen betreft: een procent van het vermogen van de spaarkassen;

      e. voor zover het verzekeringen met risicokapitaal betreft, de som van de uitkomsten van de hierna onder 1° tot
      en met 3° bedoelde berekeningen, vermenigvuldigd met de verhouding, welke ten minste vijftig procent bedraagt,
      tussen het risicokapitaal verminderd met het bedrag van de overdrachten uit hoofde van herverzekering en het
      risicokapitaal in het afgelopen boekjaar:

      1°. tijdelijke verzekeringen met een contractsduur van ten hoogste drie jaar: 0,1 procent van het risicokapitaal
      bij overlijden;

      2°. tijdelijke verzekeringen met een contractsduur van meer dan drie jaar en ten hoogste vijf jaar: 0,15 procent
      van het risicokapitaal bij overlijden;

      3°. verzekeringen anders dan tijdelijke verzekeringen met een contractsduur van ten hoogste vijf jaar: 0,3 procent
      van het risicokapitaal bij overlijden;

      f. voor zover het aanvullende verzekeringen betreft: het overeenkomstig
      [artikel 67, eerste, zesde en zevende lid][ref3], berekende bedrag.

      2 Voor de toepassing van dit artikel wordt het verschil, bedoeld in [artikel 98, derde lid][ref4], aangemerkt als
      bruto technische voorzieningen.

      3 Voor de toepassing van dit artikel worden verplichtingen uit hoofde van levensverzekeringen waarvoor ingevolge
      de internationale jaarrekeningstandaarden geen technische voorzieningen worden gevormd, aangemerkt als technische
      voorzieningen.

      4 De Nederlandsche Bank kan besluiten de op herverzekering gebaseerde vermindering, bedoeld in het eerste lid,
      onderdeel a, b, e, laatste volzin, of f, te beperken indien:

      a. de aard of de kwaliteit van de overdracht uit hoofde van herverzekering sinds het afgelopen boekjaar sterk is
      gewijzigd; of

      b. er nauwelijks of geen risico-overdracht plaatsvindt uit hoofde van herverzekering.

      5 De Nederlandsche Bank kan op aanvraag besluiten dat voor de toepassing van het eerste lid, onderdelen a en e,
      bedragen die op een entiteit voor risico-acceptatie kunnen worden verhaald, worden beschouwd als een overdracht uit
      hoofde van herverzekering.

      6 De [artikelen 64a tot en met 64c][ref5] zijn van overeenkomstige toepassing ten aanzien van de
      herverzekeringsactiviteiten van de levensverzekeraar indien:

      1°. het bedrag aan geïnde herverzekeringspremies hoger is dan tien procent van het totale premie-inkomen;

      2°. het bedrag aan geïnde herverzekeringspremies hoger is dan € 50 miljoen; of

      3°. de technische voorzieningen als gevolg van geaccepteerde herverzekering hoger zijn dan tien procent van de
      totale technische voorzieningen voor het gehele bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel357
