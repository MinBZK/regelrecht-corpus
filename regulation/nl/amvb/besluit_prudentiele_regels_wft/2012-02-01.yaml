  - number: '95'
    text: |-
      1 De aanwezige solvabiliteitsmarge van een verzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1],
      [3:58, eerste of tweede lid][ref2], of [3:61, eerste of tweede lid, van de wet][ref3] wordt gevormd door de waarde
      van de vermogensbestanddelen, bedoeld in het tweede lid, verminderd met de waarde van de posten, bedoeld in het
      derde lid.

      2 De vermogensbestanddelen, bedoeld in het eerste lid, zijn:

      a. het gestorte aandelenkapitaal of waarborgkapitaal, indien van toepassing vermeerderd met de ledenrekeningen
      indien:

      1°. de ledenrekeningen statutair een achtergesteld karakter hebben;

      2°. de statuten bepalen dat vanaf de ledenrekeningen slechts betalingen aan de leden plaatsvinden indien daardoor
      de solvabiliteitsmarge niet daalt beneden het minimumbedrag, dan wel indien bij liquidatie van de verzekeraar alle
      andere schulden zijn voldaan;

      3°. de statuten bepalen dat elke betaling vanaf de ledenrekeningen voor andere doeleinden dan voor de individuele
      opzegging van het lidmaatschap niet eerder plaatsvindt dan dertig dagen na kennisgeving ervan aan de Nederlandsche
      Bank; de Nederlandsche Bank kan besluiten dat een voorgenomen betaling niet mag plaatsvinden; en

      4°. de statutaire bepalingen met betrekking tot de ledenrekeningen slechts kunnen worden gewijzigd indien de
      Nederlandsche Bank daartoe, op verzoek, besluit;

      b. de reserves, waaronder de herwaarderingsreserves voor zover deze niet zijn ontstaan door nog niet tot het
      resultaat gerekende waardeveranderingen van afdekkingstransacties;

      c. de onverdeelde winst, verminderd met uit te keren dividenden; en

      d. het negatieve verschil tussen de uitkomst van de netto-vermogensmutatiemethode en de uitkomst van de
      vermogensmutatiemethode of de kostprijs van belangen in dochtermaatschappijen, in deelnemingen in maatschappijen
      waarin de verzekeraar invloed van betekenis uitoefent op het zakelijke en financiële beleid en in rechtspersonen
      waarin wordt deelgenomen volgens een onderlinge regeling tot samenwerking.

      3 De posten, bedoeld in het eerste lid, zijn:

      a. de reserves, voor zover ontstaan door ongerealiseerde resultaten op de eigen kredietwaardigheid van de
      verzekeraar;

      b. de egalisatiereserve voor de branche Krediet, bedoeld in [artikel 114, tweede lid][ref4];

      c. het onverdeelde verlies;

      d. de boekwaarde van de door de verzekeraar uitgegeven effecten en van afgeleide financiële instrumenten op door de
      verzekeraar uitgegeven effecten, voor zover het vermogensbestanddelen als bedoeld in het tweede lid omvat;

      e. immateriële activa;

      f. deelnemingen als bedoeld in [artikel 3:268, eerste lid, onderdeel b, van de wet][ref5] in een
      beleggingsonderneming, financiële instelling, bank, verzekeraar of verzekeringsholding als bedoeld in
      [artikel 3:268, eerste lid, onderdeel j, van de wet][ref6]; en

      g. indien de verzekeraar een deelneming als bedoeld in onderdeel f aanhoudt: de posten, bedoeld in de
      [artikelen 92, tweede lid, onderdelen b en c, en derde lid, onderdelen b en c][ref7], en [96][ref8], die tot de
      solvabiliteitsmarge dan wel het toetsingsvermogen van de financiële onderneming, bedoeld in onderdeel f, worden
      gerekend.

      4 De Nederlandsche Bank kan, op verzoek, besluiten dat een verzekeraar als bedoeld in het eerste lid, al dan niet
      voor bepaalde tijd, zijn aanwezige solvabiliteitsmarge niet hoeft te verminderen met de waarde van de posten,
      bedoeld in het derde lid, onderdelen f en g, indien deze posten tijdelijk worden gehouden met het oog op een
      financiële bijstandsoperatie, bedoeld om de financiële onderneming, bedoeld in het derde lid, onderdeel f, te
      saneren of te redden.

      5 Een verzekeraar als bedoeld in het eerste lid kan, in plaats van de vermindering met de waarde van de
      posten, bedoeld in het derde lid, onderdelen f en g, de methodes 1, 2 of 3, bedoeld in [bijlage A][ref9] of
      [B, van het Besluit prudentieel toezicht financiële groepen Wft][ref10] op overeenkomstige wijze toepassen, met
      dien verstande dat methode 1 uitsluitend kan worden toegepast indien de Nederlandsche Bank, op verzoek, heeft
      besloten dat hem dat is toegestaan. De Nederlandsche Bank besluit hiertoe indien het geïntegreerd beheer en de
      interne controle van de in de consolidatie te betrekken ondernemingen voldoende zijn.


