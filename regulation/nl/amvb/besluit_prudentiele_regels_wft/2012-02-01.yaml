    text: |-
      1 Een clearinginstelling, bank of verzekeraar als bedoeld in [artikel 3:29, eerste lid, van de wet][ref1] met zetel
      in Nederland die haar bedrijf uitoefent vanuit een in een andere lidstaat gelegen bijkantoor geeft schriftelijk aan
      de Nederlandsche Bank en de toezichthoudende instantie van die lidstaat kennis van een wijziging in het adres van
      het bijkantoor.

      2 Onverminderd het eerste lid, geeft een bank als bedoeld in [artikel 3:29, eerste lid, van de wet][ref2],
      met zetel in Nederland die haar bedrijf uitoefent vanuit een in een andere lidstaat gelegen bijkantoor geeft
      schriftelijk aan de Nederlandsche Bank en de toezichthoudende instantie van die lidstaat kennis van een wijziging
      met betrekking tot de toepasselijkheid van een depositogarantiestelsel op het bijkantoor.

      3 De financiële onderneming geeft van een wijziging als bedoeld in het eerste of tweede lid kennis binnen twee
      weken nadat de wijziging zich heeft voorgedaan.

      4 Een clearinginstelling of bank als bedoeld in [artikel 3:29, eerste lid, van de wet][ref3] die haar bedrijf
      uitoefent vanuit een in een andere lidstaat gelegen bijkantoor geeft schriftelijk kennis aan de Nederlandsche Bank
      en de toezichthoudende instantie van die lidstaat van het voornemen de uitoefening van haar bedrijf vanuit het
      in de andere lidstaat gelegen bijkantoor te staken. De clearinginstelling of bank geeft geen uitvoering aan het
      voornemen gedurende de eerste vier weken na de kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel329
