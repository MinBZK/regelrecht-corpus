  - number: '58'
    text: |-
      1 In afwijking van [artikel 49, eerste lid, aanhef en onderdeel f of g][ref1], bedraagt het minimumbedrag van het
      garantiefonds, bedoeld in [artikel 3:53, vierde lid, van de wet][ref2], € 0 voor schadeverzekeraars met zetel in
      Nederland die:

      a. op 1 januari 1986 het bedrijf van schadeverzekeraar uitoefenden;

      b. beschikken over een vergunning als bedoeld in [artikel 2:27, eerste lid, van de wet][ref3];

      c. gedurende het laatst verstreken boekjaar voor 1 augustus 1978 niet een premie-inkomen van ten minste
      zesmaal de waarde van het minimumbedrag van het garantiefonds zoals dat gold op 1 juli 1994 op grond van de
      [Wet toezicht verzekeringsbedrijf 1993][ref4] hebben geboekt;

      d. niet hun bedrijf uitbreiden met een of meer branches voor de uitoefening waarvan zij een vergunning behoeven; en

      e. niet in een andere lidstaat een bijkantoor openen of aldaar hun bedrijf uitbreiden.

      2 Het eerste lid is van toepassing op een in dat lid bedoelde schadeverzekeraar tot het einde van het boekjaar
      waarin deze een premie-inkomen van ten minste zesmaal de waarde van het minimumbedrag van het garantiefonds zoals
      deze gold op 1 juli 1994 op grond van de [Wet toezicht verzekeringsbedrijf 1993][ref5] boekt.


