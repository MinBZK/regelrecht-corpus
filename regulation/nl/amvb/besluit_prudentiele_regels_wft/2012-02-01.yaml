  - number: '78'
    text: |-
      1 De Nederlandsche Bank kan een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1], op
      verzoek, toestemming verlenen om het bedrag van de met betrekking tot het totale bedrijf vereiste solvabiliteit ter
      dekking van het operationeel risico, bedoeld in [artikel 60, eerste lid, onderdeel b][ref2], te berekenen op basis
      van de geavanceerde benadering die is gebaseerd op een risicomeetsysteem.

      2 Alvorens de Nederlandsche Bank toestemming verleent voor de toepassing van de geavanceerde benadering, bedoeld in
      het eerste lid, valideert de Nederlandsche Bank het risicomeetsysteem en toetst zij of de:

      a. interne validatieprocedures van de financiële onderneming adequaat functioneren; en

      b. datastromen en procedures ten behoeve van het risicomeetsysteem van de financiële onderneming doorzichtig en
      toegankelijk zijn.

      3 De Nederlandsche Bank stelt regels met betrekking tot het risicomeetsysteem en het risicobeheersingsysteem voor
      de berekening van de vereiste solvabiliteit ter dekking van het operationeel risico.

      4 Indien een Nederlandse EU-moederbeleggingsonderneming of Nederlandse EU-moederbank en haar dochterondernemingen
      of de dochterondernemingen van een Nederlandse financiële EU-moederholding een geavanceerde benadering voor het
      operationeel risico centraal toepast, kan de Nederlandsche Bank, op verzoek, toestaan dat de moederonderneming en
      haar dochterondernemingen samen voldoen aan de bij of krachtens dit besluit gestelde regels met betrekking tot de
      geavanceerde benadering.

      5 De Nederlandsche Bank stelt regels waaraan het verzoek, bedoeld in het vierde lid, moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel60
