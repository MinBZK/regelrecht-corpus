    text: |-
      1 Het is een bank of clearinginstelling als bedoeld in [artikel 3:63][ref1], [3:64][ref2], [3:65][ref3] of
      [3:66 van de wet][ref4] toegestaan om:

      a. zowel de te ontvangen rente bij de aanwezige liquiditeit als de te betalen rente bij de vereiste liquiditeit mee
      te rekenen;

      b. dochtermaatschappijen en bijkantoren die elk minder dan één procent uitmaken van het balanstotaal niet te
      betrekken bij de liquiditeitsberekeningen, indien ten minste 95 procent van het totale geconsolideerde balanstotaal
      wordt betrokken in de berekening;

      c. middellijke deelnemingen en bijkantoren van deelnemingen waarbij geen sprake is van, in verhouding tot de
      bank of clearinginstelling als geheel, grote liquiditeitsbehoefte terwijl de liquiditeitsvoorziening ervan in
      belangrijke mate afhankelijk is van de moederonderneming onderscheidenlijk het hoofdkantoor, niet te betrekken bij
      de liquiditeitsberekeningen; of

      d. een liquiditeitstekort in convertibele of inconvertibele valuta’s te compenseren met een overschot in
      convertibele valuta’s, voor zover afkomstig uit een land van waaruit vrije overdracht van liquiditeiten mogelijk
      is.

      2 Indien een bank of clearinginstelling kiest voor toepassing van het eerste lid, onderdeel b of c, betrekt zij de
      intragroepstransacties in de berekening van de liquiditeit.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel363
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel364
