  - number: '68'
    text: |-
      1 Het minimumbedrag aan solvabiliteitsmarge van een herverzekeraar die zijn bedrijf uitoefent in de
      activiteit schadeherverzekering of schadeverzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1],
      [3:58, eerste of tweede lid][ref2], [3:61, eerste lid][ref3], of [3:62, eerste lid, van de wet][ref4] bedraagt
      een derde van het overeenkomstig [artikel 64c][ref5] onderscheidenlijk [artikel 67][ref6] berekende bedrag voor
      het gedeelte dat betrekking heeft op ziektekostenverzekeringen indien die verzekeringen op analoge wijze als
      levensverzekeringen worden beheerd en:

      a. de geheven premie volgens verzekeringswiskundige methoden wordt berekend;

      b. een actuarieel berekende ouderdomsvoorziening wordt gevormd;

      c. een aanvullende premie wordt geheven om een reële veiligheidsmarge te vormen;

      d. de herverzekeraar of schadeverzekeraar de ziektekostenverzekering uiterlijk voor het einde van het derde
      verzekeringsjaar kan opzeggen; en

      e. in de ziektekostenverzekering de mogelijkheid is opgenomen om ook voor lopende verzekeringen de premies te
      verhogen of de verstrekkingen te verminderen.

      2 Bij ministeriële regeling kan het minimumbedrag aan solvabiliteitsmarge, bedoeld in het eerste lid, worden
      verhoogd tot ten hoogste het overeenkomstig [artikel 64c][ref7] onderscheidenlijk [artikel 67][ref8] berekende
      bedrag, indien de ingevolge [paragraaf 4.2 van de Zorgverzekeringswet][ref9] gestelde regels met betrekking tot de
      risicoverevening daartoe aanleiding geven.


