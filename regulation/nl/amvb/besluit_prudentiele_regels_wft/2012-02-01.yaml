  - number: 23g
    text: |-
      1 De beheerder van een instelling voor collectieve belegging in effecten vermeldt in het beleid, bedoeld in
      [artikel 23, eerste lid][ref1]:

      a. de technieken, instrumenten en regelingen om te allen tijde de risico’s te kunnen meten en beheren waaraan elke
      door hem beheerde instelling voor collectieve belegging in effecten is of zou kunnen worden blootgesteld;

      b. de verantwoordelijkheden binnen de organisatie van de beheerder met betrekking tot het risicobeheer; en

      c. de voorwaarden, inhoud en frequentie van de rapportage door de risicobeheerfunctie, bedoeld in
      [artikel 23, zesde lid][ref2], aan de personen die het dagelijks beleid van de beheerder van de instelling voor
      collectieve belegging in effecten bepalen en aan het orgaan, indien aanwezig, dat is belast met toezicht op het
      beleid en de algemene gang van zaken van de beheerder.

      2 De procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref3], stellen een beheerder van een instelling
      voor collectieve belegging in effecten in staat:

      a. te allen tijde de risico’s te kunnen meten waaraan de instelling voor collectieve belegging in effecten wordt of
      zou kunnen worden blootgesteld; en

      b. de naleving van limieten voor het totale risico en het tegenpartijrisico voor elke door hem
      beheerde instelling voor collectieve belegging in effecten, bedoeld in de [artikelen 133][ref4] en
      [134 van het Besluit gedragstoezicht financiële ondernemingen Wft][ref5], te waarborgen.

      3 Een beheerder van een instelling voor collectieve belegging in effecten neemt voor de toepassing van het tweede
      lid de volgende maatregelen:

      a. zorgen voor procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref6], die noodzakelijk zijn om te
      garanderen dat de risico’s van ingenomen posities en het aandeel van deze posities in het totale risicoprofiel
      nauwkeurig en op basis van degelijke en betrouwbare gegevens worden gemeten en dat deze procedures en maatregelen
      op adequate wijze zijn gedocumenteerd;

      b. in voorkomend geval, achteraf uitvoeren van periodieke tests om de geldigheid te evalueren van regels met
      betrekking tot risicometingregelingen die modelmatige prognoses en ramingen omvatten;

      c. in voorkomend geval, uitvoeren van periodieke stresstests en scenarioanalyses om de eventueel uit wisselende
      marktomstandigheden voortvloeiende risico’s aan te pakken die negatieve gevolgen voor de instelling voor
      collectieve belegging in effecten kunnen hebben;

      d. het opzetten, implementeren en in stand houden van een gedocumenteerd systeem van interne limieten voor de
      maatregelen die worden genomen om de relevante risico’s voor elke beheerde instelling voor collectieve belegging
      in effecten te beheren en te controleren, waarbij rekening wordt gehouden met relevante risico’s als bedoeld in
      [artikel 23, tweede lid][ref7], en waarbij overeenstemming met het risicoprofiel van de instelling voor collectieve
      belegging in effecten wordt gewaarborgd;

      e. zorgen dat voor elke door hem beheerde instelling voor collectieve belegging in effecten de huidige risico-
      omvang voldoet aan het risicolimietensysteem, bedoeld in onderdeel d; en

      f. opzetten, implementeren en in stand houden van adequate procedures die in geval van feitelijke en voorzienbare
      inbreuken op het risicolimietensysteem van de instelling voor collectieve belegging in effecten tot tijdige
      herstelmaatregelen in belang van de deelnemers leiden.


