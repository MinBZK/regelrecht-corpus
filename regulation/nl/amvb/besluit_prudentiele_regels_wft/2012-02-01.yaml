      1 De Nederlandsche Bank verleent een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1],
      op verzoek, toestemming, op verzoek, toestemming verlenen om het bedrag van de vereiste solvabiliteit voor de
      positierisico’s met betrekking tot de handelsportefeuille, bedoeld in [artikel 60, eerste lid, onderdeel b][ref2],
      of voor de valutarisico’s of grondstoffenrisico’s, bedoeld in [artikel 60, eerste lid, onderdeel c][ref3], in
      afwijking van [artikel 60, tweede lid][ref4], te berekenen op basis van interne modellen.

      2 De Nederlandsche Bank stelt regels met betrekking tot interne modellen als bedoeld in het eerste lid en het
      gebruik ervan.


