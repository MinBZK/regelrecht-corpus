      1 De betrouwbaarheid van een persoon als bedoeld in [artikel 5][ref1] staat niet buiten twijfel als deze
      veroordeeld is terzake van een misdrijf, genoemd in [onderdeel 1 van bijlage A][ref2], tenzij er sinds het
      onherroepelijk worden van de uitspraak acht jaren of meer zijn verstreken.

      2 De Nederlandsche Bank kan op grond van de omstandigheden of belangen, genoemd in [artikel 9][ref3], afwijken van
      het eerste lid.


