  - number: '115'
    text: |-
      1 De door een verzekeraar als bedoeld in [artikel 114, eerste lid][ref1], aan te houden voorziening voor niet-
      verdiende premies en lopende risico’s, waaronder de catastrofevoorziening indien deze is getroffen, omvat onder
      meer:

      a. de in het boekjaar ontvangen premies ter zake van risico’s die op het daarop volgende boekjaar of boekjaren
      betrekking hebben; en

      b. de schaden en kosten uit lopende verzekeringen die na afloop van het boekjaar kunnen ontstaan en die niet gedekt
      kunnen worden door de voorziening die betrekking heeft op de niet-verdiende premies tezamen met de in het daarop
      volgende boekjaar of boekjaren nog te ontvangen premies.

      2 De voorziening voor niet-verdiende premies wordt voor elke schadeverzekering afzonderlijk en op voorzichtige
      wijze bepaald. Het gebruik van statistische of wiskundige methoden is toegestaan indien de aard van de verzekering
      dat toelaat en indien deze methoden naar verwachting dezelfde resultaten opleveren als de afzonderlijke
      berekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel115
    references:
      - id: ref1
