  - number: 124c
    text: |-
      Een bank die obligaties heeft uitgegeven die behoren tot een categorie die is geregistreerd overeenkomstig
      [artikel 124b][ref1]:

      a. houdt een administratie bij waarin zijn opgenomen:

      1°. de uitgegeven obligaties die tot die categorie behoren, en

      2°. de activa die dienen ter dekking van die obligaties; en

      b. toont aan de Nederlandsche Bank tenminste jaarlijks aan dat de categorie obligaties nog voldoet aan het in
      [artikel 124b, eerste lid][ref2], bedoelde vereiste voor registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel124b
