  - number: '25'
    text: |-
      Indien een beleggingsonderneming, betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor
      risico-acceptatie, bank, verzekeraar of bijkantoor als bedoeld in [artikel 23, eerste lid][ref1], gebruik maakt
      van intern ontwikkelde modellen, beoordeelt deze die modellen en de gehanteerde veronderstellingen en variabelen
      op systematische wijze op validiteit, onder meer door voorspellingen van het model te vergelijken met de werkelijke
      uitkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel25
