  - number: 61a
    text: |-
      1 Bij de toekenning van een risicogewicht aan een categorie activa of posten buiten de balanstelling kan een bank,
      beleggingsonderneming of clearinginstelling als bedoeld in [artikel 60, eerste lid][ref1], een kredietbeoordeling
      van een door de Nederlandsche Bank of door een toezichthoudende instantie van een andere lidstaat ingevolge
      [paragraaf 10.5][ref2] erkend kredietbeoordelingsbureau of, ingeval van vorderingen op centrale overheden en
      centrale banken, erkende kredietbeoordelingen van een exportkredietverzekeraar op een consistente wijze gebruiken.
      De Nederlandsche Bank stelt nadere regels met betrekking tot het gebruik van een kredietbeoordeling als bedoeld in
      de vorige volzin.

      2 De financiële onderneming gebruikt slechts gevraagde kredietbeoordelingen. De Nederlandsche Bank kan, op verzoek,
      de financiële onderneming toestemming verlenen om ongevraagde kredietbeoordelingen te gebruiken.

      3 De Nederlandsche Bank kent op een objectieve en consequente wijze een risicogewicht toe aan kredietbeoordelingen
      als bedoeld in het eerste lid met inachtneming van het volgende:

      a. zij onderscheidt de relatieve risicograden waaraan de kredietbeoordeling uitdrukking geeft;

      b. in geval van een kredietbeoordelingsbureau dat pas is opgericht of dat over beperkte gegevens met betrekking
      tot wanbetaling beschikt, vraagt zij welke mate van wanbetaling op lange termijn naar het oordeel van het
      kredietbeoordelingsbureau overeenkomt met alle activa of posten buiten de balanstelling waaraan dezelfde
      kredietbeoordeling is toegekend;

      c. zij vergelijkt de voor elke kredietbeoordeling van een kredietbeoordelingsbureau geconstateerde mate van
      wanbetaling en vergelijkt deze met een referentiewaarde die is opgesteld op basis van de mate van wanbetaling die
      door andere kredietbeoordelingsbureaus zijn geconstateerd bij een groep van uitgevende instellingen waaraan een
      gelijkwaardig kredietrisico is verbonden;

      d. indien zij van oordeel is dat de voor een kredietbeoordeling van een kredietbeoordelingsbureau geconstateerde
      mate van wanbetaling structureel wezenlijk hoger ligt dan de referentiewaarde, kent zij aan de kredietbeoordeling
      van het betreffende kredietbeoordelingsbureau een hoger risicogewicht toe;

      e. indien zij het aan een kredietbeoordeling toegekende risicogewicht heeft verhoogd en het
      kredietbeoordelingsbureau toont aan dat de voor haar kredietbeoordeling geconstateerde mate van wanbetaling
      niet langer structureel wezenlijk hoger is dan de referentiewaarde, kan zij aan de kredietbeoordeling weer het
      oorspronkelijke risicogewicht toekennen.

      4 Indien een toezichthoudende instantie van een andere lidstaat op een met het derde lid vergelijkbare wijze een
      risicogewicht heeft toegekend aan de kredietbeoordeling, kan de Nederlandsche Bank deze overnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
