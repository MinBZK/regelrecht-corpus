  - number: '90'
    text: |-
      1 Het toetsingsvermogen van een bank, beleggingsonderneming, betaalinstelling, clearinginstelling of
      elektronischgeldinstelling als bedoeld in [artikel 3:57, eerste lid][ref1], [3:58, eerste lid][ref2],
      of [3:61, eerste lid, van de wet][ref3] wordt gevormd door de som van het overeenkomstig
      [artikel 94, eerste lid, onderdelen a tot en met c, tweede, derde en vierde lid][ref4], in aanmerking te nemen
      kernkapitaal en aanvullend kapitaal.

      2 In afwijking van het eerste lid kan de financiële onderneming ervoor kiezen dat haar toetsingsvermogen,
      uitsluitend ter dekking van de bedragen, bedoeld in [artikel 60, eerste lid, onderdeel b][ref5], voor zover het
      betreft de vereiste solvabiliteit ter dekking van de positierisico’s en grote posities, en onderdeel c, en het
      vereiste, bedoeld in artikel 60, derde lid, wordt gevormd door de som van het overeenkomstig [artikel 94][ref6], in
      aanmerking te nemen kernkapitaal, aanvullend kapitaal en overig kapitaal. De bestanddelen van dit toetsingsvermogen
      dienen niet tevens ter dekking van andere in artikel 60, eerste lid, bedoelde bedragen.

      3 Het toetsingsvermogen van een beheerder van een instelling voor collectieve belegging in effecten als
      bedoeld in [artikel 3:57, eerste lid, van de wet][ref7] wordt gevormd door de som van het overeenkomstig
      [artikel 94, eerste lid, onderdelen a tot en met c][ref8], in aanmerking te nemen kernkapitaal en aanvullend
      kapitaal.


