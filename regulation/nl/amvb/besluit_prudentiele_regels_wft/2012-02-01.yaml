      1 De minimumomvang van het toetsingsvermogen van een beheerder van een instelling voor collectieve belegging
      in effecten als bedoeld in [artikel 3:57, eerste lid, van de wet][ref1] bedraagt € 125.000 vermeerderd met twee
      honderdste procent van het bedrag waarmee de waarde van het beheerde vermogen het bedrag van € 250 miljoen te boven
      gaat. De minimumomvang van het toetsingsvermogen bedraagt niet meer dan € 10 miljoen.

      2 Tot het beheerde vermogen wordt gerekend het vermogen van de beleggingsinstellingen waarover de beheerder het
      beheer voert met inbegrip van de delen van het vermogen waarvan hij het beheer heeft uitbesteed, uitgezonderd de
      delen van het vermogen waarvan het beheer door derden aan hem is uitbesteed.

      3 [Artikel 60, derde tot en met vijfde lid][ref2], is van overeenkomstige toepassing.


