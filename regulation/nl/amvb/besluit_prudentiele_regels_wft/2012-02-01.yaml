  - number: 124b
    text: |-
      1 De Nederlandsche Bank besluit op verzoek van een bank met zetel in Nederland om een door die bank uitgegeven
      of uit te geven categorie obligaties alsmede de uitgevende bank in een openbaar register op te nemen, indien die
      bank aantoont dat de obligaties zijn aan te merken als gedekte obligaties. Bij ministeriële regeling worden regels
      gesteld met betrekking tot de wijze waarop de bank dit kan aantonen.

      2 De Nederlandsche Bank stelt een lijst van de overeenkomstig het eerste lid geregistreerde categorieën obligaties
      en banken alsmede wijzigingen daarvan, ter kennis van de Commissie van de Europese Gemeenschappen met het oog
      op de toepassing van artikel 22, vierde lid, van de richtlijn beleggingsinstellingen. De Nederlandsche Bank doet
      onverwijld mededeling aan de uitgevende bank van iedere kennisgeving als bedoeld in de vorige volzin met betrekking
      tot die bank en de door haar uitgegeven categorieën obligaties.

      3 Indien een categorie obligaties niet langer voldoet aan het in het eerste lid bedoelde vereiste voor registratie
      of indien de uitgevende bank niet of niet langer voldoet aan [artikel 124c][ref1], kan de Nederlandsche Bank
      besluiten de registratie van de categorie obligaties of van de uitgevende bank, bedoeld in het eerste lid, door te
      halen. In dat geval stelt zij de Commissie van de Europese Gemeenschappen daarvan onverwijld in kennis en maakt zij
      dit onverwijld openbaar op haar website.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel124c
