    text: |-
      1 Het minimumbedrag aan eigen vermogen van een bank als bedoeld in [artikel 2:13, eerste lid][ref1],
      [3:53, eerste lid][ref2], of [3:54, eerste lid, van de wet][ref3], van een beheerder van een instelling voor
      collectieve beleggingen in effecten als bedoeld in artikel 3:53, eerste lid, van de wet, van een beheerder als
      bedoeld in artikel 3:53, eerste lid, of [3:55, eerste lid, van de wet][ref4] die geen beheerder van een instelling
      voor collectieve belegging in effecten is en die een vermogen van minder dan € 250 miljoen beheert, van een
      beleggingsmaatschappij als bedoeld in artikel 3:53, eerste lid, van de wet, van een beleggingsonderneming als
      bedoeld in artikel 3:53, eerste lid, of 3:54, eerste lid, van de wet, van een betaalinstelling als bedoeld in
      artikel 3:53, eerste lid, van de wet, van een clearinginstelling als bedoeld in artikel 3:53, eerste lid, of 3:55,
      eerste lid, van de wet, van een elektronischgeldinstelling als bedoeld in artikel 3:53, eerste lid, van de wet of
      van een premiepensioeninstelling als bedoeld in artikel 3:53, eerste lid, van de wet, wordt gevormd door de waarde
      van de vermogensbestanddelen, bedoeld in [artikel 91, tweede lid, onderdelen a tot en met c][ref5].

      2 [Artikel 89, eerste en tweede lid, onderdeel a][ref6], is van overeenkomstige toepassing.


