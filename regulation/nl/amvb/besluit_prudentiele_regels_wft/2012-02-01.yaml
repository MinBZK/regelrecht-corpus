    text: |-
      1 Een entiteit voor risico-acceptatie als bedoeld in [artikel 3:67, eerste lid][ref1], of
      [artikel 3:68a, eerste lid, van de wet][ref2], een herverzekeraar als bedoeld in [artikel 3:67, eerste lid][ref3],
      of [3:68a, eerste lid, van de wet][ref4], of een levensverzekeraar of schadeverzekeraar als bedoeld in
      [artikel 3:67, eerste lid][ref5], of [3:68, eerste lid, van de wet][ref6], of een natura-uitvaartverzekeraar
      als bedoeld in [artikel 3:67, eerste lid][ref7], of [3:69, eerste lid, van de wet][ref8] houdt, met inachtneming
      van [artikel 427, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref9] de technische voorzieningen, bedoeld
      in [artikel 435, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref10], aan voor zover deze op haar
      onderscheidenlijk hem van toepassing zijn.

      2 Een schadeverzekeraar als bedoeld in het eerste lid die zijn jaarrekening opstelt overeenkomstig de
      internationale jaarrekeningstandaarden houdt voor de branche Krediet, in plaats van een egalisatievoorziening,
      een egalisatiereserve aan. Voor de toepassing van dit besluit wordt de egalisatiereserve aangemerkt als technische
      voorziening.

      3 Een entiteit voor risico-acceptatie of een verzekeraar als bedoeld in het eerste lid kan afwijken van de
      indeling, bedoeld in [artikel 435, eerste lid, van Boek 2 van het Burgerlijk Wetboek,][ref11] of van de berekening
      van de technische voorzieningen, bedoeld in de [artikelen 115 tot en met 119][ref12], indien de internationale
      jaarrekeningstandaarden zulks voorschrijven.


