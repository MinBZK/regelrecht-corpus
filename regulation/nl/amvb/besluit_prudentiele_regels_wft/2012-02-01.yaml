  - number: 17a
    text: |-
      Het organisatieonderdeel, bedoeld in [artikel 17, vierde lid][ref1], van een bank als bedoeld in
      [artikel 3:17, eerste lid][ref2], of [3:23, tweede lid, van de wet][ref3] die in Nederland beleggingsdiensten mag
      verlenen of beleggingsactiviteiten mag verrichten, heeft als taak:

      a. het vaststellen en uitvoeren van een controleplan om de deugdelijkheid en effectiviteit van de systemen, interne
      controleprocedures en regels van de bank te onderzoeken en te beoordelen;

      b. het doen van aanbevelingen op basis van de resultaten van de werkzaamheden, bedoeld in onderdeel a;

      c. het controleren of aan deze aanbevelingen gevolg wordt gegeven; en

      d. het ten minste jaarlijks rapporteren aan de personen die het dagelijks beleid van de bank bepalen en aan
      het orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de algemene gang van zaken van de bank
      inzake aangelegenheden met betrekking tot de interne controle en de genomen maatregelen in geval van gesignaleerde
      tekortkomingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel317
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel323
