  - number: 91a
    text: |-
      1 De vermogensbestanddelen, bedoeld in [artikel 91, tweede lid, onderdeel h][ref1], voldoen aan de volgende
      vereisten:

      a. de vermogensbestanddelen hebben geen vervaldatum of hebben een oorspronkelijke looptijd van ten minste dertig
      jaar;

      b. de vermogensbestanddelen kunnen een of meer, uitsluitend naar het oordeel van de uitgevende financiële
      onderneming uit te oefenen callopties omvatten, maar worden ten vroegste vijf jaar na de datum van uitgifte
      afgelost;

      c. als de bepalingen die voor vermogensbestanddelen zonder vervaldatum gelden, voorzien in een gematigde, door
      de Nederlandsche Bank te beoordelen aflossingsprikkel voor de financiële onderneming, mag die prikkel zich ten
      vroegste tien jaar na datum van uitgifte voordoen; en

      d. de bepalingen die voor vermogensbestanddelen met vervaldatum gelden, staan niet toe dat van
      vermogensbestanddelen een prikkel tot aflossing op een andere datum dan de vervaldatum uitgaat.

      2 Onverminderd het eerste lid, voldoen de vermogensbestanddelen bedoeld in
      [artikel 91, tweede lid, onderdeel h][ref2], aan de volgende vereisten:

      a. de financiële onderneming heeft de mogelijkheid de uitkering van rente of dividend zo nodig voor onbepaalde tijd
      en op niet-cumulatieve basis te staken;

      b. de financiële onderneming staakt rente of dividenduitkeringen, als zij niet voldoet aan de kapitaalvereisten van
      [artikel 60, eerste lid][ref3];

      c. het staken van de uitkering van rente of dividend doet geen afbreuk aan het recht van de financiële onderneming
      om de rente- of dividenduitkering te vervangen door een voldoening in de vorm van een vermogensbestanddeel dat
      voldoet aan de vereisten van [artikel 91, tweede lid, onderdeel a][ref4], mits de financiële onderneming daardoor
      financiële middelen kan behouden. De Nederlandsche Bank kan aan die vervanging voorwaarden verbinden; en

      d. vermogensbestanddelen met, zowel als zonder vervaldatum, kunnen alleen met voorafgaande toestemming van de
      Nederlandsche Bank worden afgelost of ingekocht. De Nederlandsche Bank kan deze toestemming verlenen mits het op
      verzoek van de financiële onderneming wordt gedaan en noch de financiële positie noch de solvabiliteitspositie
      van de financiële onderneming al te zeer wordt aangetast. De Nederlandsche Bank kan van de financiële onderneming
      verlangen dat zij de vermogensbestanddelen vervangen door direct uitgegeven vermogensbestanddelen als bedoeld in
      [artikel 91, tweede lid, onderdelen a en h][ref5], van dezelfde of betere kwaliteit.

      3 De Nederlandsche Bank verlangt dat de aflossing van vermogensbestanddelen met vervaldatum wordt opgeschort als
      de financiële onderneming niet aan de kapitaalsvereisten van artikel 60 voldoet en kan verlangen dat aflossing op
      andere tijdstippen wordt opgeschort op grond van de financiële positie en solvabiliteitspositie van de financiële
      onderneming.

      4 De Nederlandsche Bank kan te allen tijde toestemming verlenen voor een vroegtijdige aflossing van
      vermogensbestanddelen ingeval de toepasselijke fiscale behandeling of indeling van deze vermogensbestanddelen
      volgens de regelgeving een wijziging ondergaat die bij uitgifte niet was voorzien.

      5 De Nederlandsche Bank kan verlangen dat de uitkering van rente of dividend op grond van de financiële positie en
      de solvabiliteitspositie van de financiële onderneming wordt gestaakt.

      6 De hoofdsom en niet uitgekeerde rente of dividend kunnen eventuele verliezen opvangen en vormen geen belemmering
      voor de herkapitalisatie van de financiële onderneming.

      7 Bij het faillissement of de liquidatie van de financiële onderneming zijn de vermogensbestanddelen achtergesteld
      bij de in [artikel 92, tweede lid, onderdeel b][ref6], bedoelde vermogensbestanddelen.

      8 De Nederlandsche Bank stelt nadere regels met betrekking tot de vermogensbestanddelen als bedoeld in
      [artikel 91, tweede lid, onderdeel h][ref7].


