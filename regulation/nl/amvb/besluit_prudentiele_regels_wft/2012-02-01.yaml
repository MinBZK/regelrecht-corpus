  - number: '122'
    text: |-
      1 Een entiteit voor risico-acceptatie of herverzekeraar als bedoeld in [artikel 3:67, eerste lid][ref1],
      of [3:68a, eerste lid, van de wet][ref2], levensverzekeraar of schadeverzekeraar als bedoeld in
      [artikel 3:67, eerste lid][ref3], of [3:68, eerste lid, van de wet][ref4] of natura-uitvaartverzekeraar als bedoeld
      in [artikel 3:67, eerste lid][ref5], of [3:69, eerste lid, van de wet][ref6] draagt er zorg voor dat de aard van de
      waarden die dienen tot dekking van de technische voorzieningen in overeenstemming zijn met de aard van de aangegane
      verplichtingen. Deze waarden worden adequaat gediversifieerd en gespreid. Waarden met een hoog risico worden tot
      een voorzichtig niveau beperkt.

      2 Een vordering op een entiteit voor risico-acceptatie of verzekeraar, die geen vergunning op grond van deze wet
      of op grond van het recht van een andere lidstaat behoeft te hebben, uit hoofde van een door een andere verzekeraar
      als verzekeringnemer gesloten herverzekeringsovereenkomst kan slechts dienen als waarde ter dekking van de
      technische voorzieningen indien:

      a. geen tegenvordering openstaat; en

      b. het aannemelijk is dat de vordering zal worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel367
