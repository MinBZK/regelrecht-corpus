  - number: '125'
    text: |-
      1 De technische voorzieningen van een levensverzekeraar of schadeverzekeraar als bedoeld in
      [artikel 122, eerste lid][ref1], met betrekking tot uitkeringen die volgens de verzekering rechtstreeks gekoppeld
      zijn aan de waarde van een deelneming in een instelling voor collectieve belegging in effecten, of aan de waarde
      van activa die zijn opgenomen in een door de verzekeraar gehouden fonds dat gewoonlijk in fracties is verdeeld,
      worden gedekt door deze rechten van deelneming onderscheidenlijk fracties dan wel, indien geen fracties zijn
      gecreëerd, door deze activa.

      2 De technische voorzieningen met betrekking tot uitkeringen die volgens de verzekering rechtstreeks gekoppeld
      zijn aan een referentiewaarde anders dan die bedoeld in het eerste lid, worden gedekt door de eenheden die deze
      referentiewaarde vertegenwoordigen. Als deze eenheden ontbreken, worden de technische voorzieningen gedekt door
      activa die zo nauw mogelijk aansluiten bij die waarop de betrokken referentiewaarde is gebaseerd.

      3 Op de technische voorzieningen die rechtstreeks verband houden met de uitkeringen, bedoeld in het eerste en
      tweede lid, zijn, voor zover in die uitkeringen geen sprake is van een gegarandeerd rendement of een gegarandeerd
      uitkeringsniveau, de [artikelen 122][ref2] en [122b tot en met 124][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel122
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel120
