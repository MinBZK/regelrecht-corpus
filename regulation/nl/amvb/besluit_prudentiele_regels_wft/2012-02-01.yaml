  - number: '132'
    text: |-
      Indien een beleggingsonderneming, betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit
      voor risico-acceptatie, bank, verzekeraar of bijkantoor als bedoeld in [artikel 130][ref1] de staten niet
      langs elektronische weg verstrekt, kan de Nederlandsche Bank, op verzoek van de financiële onderneming,
      besluiten dat het de financiële onderneming is toegestaan andere informatiedragers dan de modellen, bedoeld
      in [artikel 131, eerste lid, onderdeel a][ref2], te gebruiken, indien deze wat betreft indeling en inhoud geen
      afwijking vertonen van de modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel131
