  - number: '49'
    text: |-
      1 Het minimumbedrag van het garantiefonds, bedoeld in [artikel 3:53, vierde lid][ref1], bedraagt:

      a. voor een entiteit voor risico-acceptatie als bedoeld in [artikel 3:53, eerste lid, van de wet][ref2] een door
      de Nederlandsche Bank te bepalen bedrag, dat niet hoger is dan € 1 miljoen, afhankelijk van het risicoprofiel van
      de entiteit;

      b. € 1,2 miljoen voor een herverzekeraar als bedoeld in [artikel 3:53, eerste lid][ref3], of
      [3:55a, eerste lid, van de wet][ref4] die ondernemingsgebonden herverzekeraar is;

      c. € 3,4 miljoen voor een herverzekeraar als bedoeld in [artikel 3:53, eerste lid][ref5],
      of[ 3:55a, eerste lid, van de wet][ref6], niet zijnde een herverzekeraar als bedoeld onder b;

      d. € 3,7 miljoen voor een levensverzekeraar als bedoeld in [artikel 3:53, eerste lid][ref7], of
      [3:54, eerste lid, van de wet][ref8];

      e. € 45.378,02 voor een natura-uitvaartverzekeraar als bedoeld in [artikel 3:53, eerste lid][ref9], of
      [3:55, eerste lid, van de wet][ref10];

      f. € 2,5 miljoen voor een schadeverzekeraar als bedoeld in [artikel 3:53, eerste lid][ref11], of
      [3:54, eerste lid, van de wet][ref12], die geen schadeverzekeraar als bedoeld in onderdeel g is;

      g. € 3,7 miljoen voor een schadeverzekeraar als bedoeld in [artikel 3:53, eerste lid][ref13], of
      [3:54, eerste lid, van de wet][ref14] die zijn bedrijf uitoefent in de branche Aansprakelijkheid motorrijtuigen,
      Aansprakelijkheid wegvervoer, Aansprakelijkheid luchtvaartuigen, Aansprakelijkheid zee- en binnenschepen, Algemene
      aansprakelijkheid of Krediet en Borgtocht.

      2 Het minimumbedrag van het garantiefonds, bedoeld in [artikel 3:54, derde lid][ref15], [3:55, tweede lid][ref16],
      of [3:55a, tweede lid, van de wet][ref17] bedraagt:

      a. voor een in Nederland gelegen bijkantoor van een entiteit voor risico-acceptatie als bedoeld in
      [artikel 3:55a, eerste lid, van de wet][ref18] een door de Nederlandsche Bank te bepalen bedrag, dat niet hoger is
      dan € 1 miljoen, afhankelijk van het risicoprofiel van de entiteit;

      b. € 0,6 miljoen voor een in Nederland gelegen bijkantoor van een herverzekeraar als bedoeld in
      [artikel 3:55a, eerste lid, van de wet][ref19] die ondernemingsgebonden herverzekeraar is;

      c. € 1,7 miljoen voor een in Nederland gelegen bijkantoor van een herverzekeraar als bedoeld in
      [artikel 3:55a, eerste lid, van de wet][ref20], niet zijnde een bijkantoor als bedoeld onder b;

      d. € 1,9 miljoen voor een in Nederland gelegen bijkantoor van een levensverzekeraar als bedoeld in
      [artikel 3:54, derde lid, van de wet][ref21];

      e. € 45.378,02 voor een in Nederland gelegen bijkantoor van een natura-uitvaartverzekeraar als bedoeld in
      [artikel 3:55, tweede lid, van de wet][ref22];

      f. € 1,3 miljoen voor een in Nederland gelegen bijkantoor van een schadeverzekeraar als bedoeld in
      [artikel 3:54, derde lid, van de wet][ref23] die geen schadeverzekeraar als bedoeld in onderdeel g is;

      g. € 1,9 miljoen voor een in Nederland gelegen bijkantoor van een schadeverzekeraar als bedoeld in
      [artikel 3:54, derde lid, van de wet][ref24] die zijn bedrijf uitoefent in de branche Aansprakelijkheid
      motorrijtuigen, Aansprakelijkheid wegvervoer, Aansprakelijkheid luchtvaartuigen, Aansprakelijkheid zee- en
      binnenschepen, Algemene aansprakelijkheid of Krediet en Borgtocht.

      3 Voor schadeverzekeraars als bedoeld in het eerste lid, aanhef en onderdelen f en g, die tevens het
      bedrijf van herverzekeraar uitoefenen, bedraagt evenwel het minimumbedrag van het garantiefonds, bedoeld in
      [artikel 3:53, vierde lid][ref25], het bedrag, genoemd in het eerste lid, onderdeel c, f of g, al naar gelang welk
      bedrag het hoogste is, indien:

      1°. het bedrag aan geïnde herverzekeringspremies groter is dan tien procent van het totale premiebedrag;

      2°. het bedrag aan geïnde herverzekeringspremies hoger is dan € 50 miljoen; of

      3°. de technische voorzieningen als gevolg van geaccepteerde herverzekering groter zijn dan tien procent van de
      totale technische voorzieningen.

      4 De in het eerste lid, onderdelen b tot en met d, f en g, en tweede lid, onderdelen b tot en met d, f en
      g, bedoelde bedragen wijzigen van rechtswege overeenkomstig de jaarlijkse kennisgeving van de Commissie van
      de Europese Gemeenschappen aan het Europees Parlement en de Raad van de Europese Unie betreffende de aan de
      procentuele wijziging van het door Eurostat bekendgemaakte Europese indexcijfer van de consumptieprijzen aangepaste
      bedragen.

      5 Van de in het vierde lid bedoelde kennisgeving, de gewijzigde bedragen en het tijdstip waarop de gewijzigde
      bedragen voor het eerst worden toegepast doet de Nederlandsche Bank onverwijld mededeling in de Staatscourant.


