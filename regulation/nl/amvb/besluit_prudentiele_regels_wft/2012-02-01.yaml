        artikel: 3:96
  - number: '140'
    text: |-
      1 Een verklaring van geen bezwaar betreffende een gekwalificeerde deelneming als bedoeld in
      [artikel 3:96, eerste lid, onderdeel c, van de wet][ref1] wordt verleend, indien:

      a. de waarde van de gekwalificeerde deelneming bij verwerving of na vergroting van de gekwalificeerde
      deelneming niet groter is dan vijftien procent van het toetsingsvermogen van de bank, zoals berekend
      ingevolge de [artikelen 90 tot en met 94][ref2], met uitzondering van de vermindering, bedoeld in
      [artikel 94, tweede lid, aanhef en onderdelen f en g][ref3]; en

      b. de totale waarde van de gekwalificeerde deelnemingen van de bank in ondernemingen die geen financiële
      ondernemingen zijn, door de nieuwe of vergrote gekwalificeerde deelneming niet groter wordt dan 60 procent van het
      toetsingsvermogen van de bank, zoals berekend ingevolge de [artikelen 90 tot en met 94][ref4], met uitzondering van
      de vermindering, bedoeld in [artikel 94, tweede lid, aanhef en onderdelen f en g][ref5].

      2 Een verklaring van geen bezwaar betreffende een gekwalificeerde deelneming als bedoeld in
      [artikel 3:96, eerste lid, onderdeel c, van de wet][ref6] wordt, onverminderd het eerste lid, verleend, indien:

      a. de gekwalificeerde deelneming wordt verworven en gehouden in het kader van een schuldsanering of
      reddingsoperatie bij de betrokken onderneming;

      b. de gekwalificeerde deelneming wordt verworven en gehouden in het kader van een overgenomen emissie van aandelen;
      of

      c. de gekwalificeerde deelneming wordt verworven en tijdelijk gehouden in het kader van een stallingaffaire op
      eigen naam van de bank maar voor rekening van derden.

      3 Een verklaring van geen bezwaar voor een gekwalificeerde deelneming als bedoeld in het tweede lid wordt voor
      bepaalde tijd verleend; de gekwalificeerde deelnemingwordt niet betrokken in de berekening op grond van het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel396
