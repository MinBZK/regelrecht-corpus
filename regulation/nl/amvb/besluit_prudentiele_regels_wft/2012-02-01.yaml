  - number: '86'
    text: |-
      1 Indien op een securitisatie van revolverende vorderingen een vervroegde- aflossingsbepaling van toepassing is,
      berekent een financiële onderneming als bedoeld in [artikel 83][ref1] die initiator is een aanvullende naar risico
      gewogen post.

      2 De Nederlandsche Bank stelt regels met betrekking tot de berekening van de aanvullende naar risico gewogen post.

      3 De Nederlandsche Bank kan, na overleg met de relevante toezichthoudende instanties in andere lidstaten, een
      financiële onderneming als bedoeld in het eerste lid toestaan de aanvullende naar risico gewogen post te berekenen
      op een wijze die niet wezenlijk afwijkt van de regels, bedoeld in het tweede lid, indien het een securitisatie
      betreft:

      a. van vorderingen op particulieren of op kleine of middelgrote ondernemingen die niet zijn toegezegd en
      onvoorwaardelijk, zonder opzegtermijn, kunnen worden opgezegd; en

      b. waarbij een kwantitatieve waarde, die losstaat van het driemaandsgemiddelde van de overgebleven rentemarge,
      aanleiding is voor de vervroegde aflossing.

      4 De Nederlandsche Bank maakt openbaar welke opvattingen en bedenkingen bij het overleg, bedoeld in het derde lid,
      door de toezichthoudende instanties zijn geuit.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel83
