  - number: '29'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie, bank,
      premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 27, tweede lid][ref1], voert een
      adequaat beleid en beschikt over procedures en maatregelen met betrekking tot het op structurele basis uitbesteden
      van werkzaamheden.


