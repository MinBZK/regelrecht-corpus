      1 De Nederlandsche Bank maakt de algemene criteria en methodieken openbaar op basis waarvan wordt vastgesteld of is
      voldaan aan hetgeen in [artikel 87a][ref1] is bepaald.

      2 Onverminderd [artikel 1:89 van de wet][ref2], maakt de Nederlandsche Bank jaarlijks het resultaat van
      de evaluatie en de maatregelen die zijn opgelegd in gevallen dat niet is voldaan aan hetgeen ingevolge
      [artikel 87a][ref3] is bepaald bekend.


