      1 Als liquiditeit van een bank als bedoeld in [artikel 3:63, eerste lid][ref1], [3:64][ref2] of
      [3:65 van de wet][ref3] geldt de aanwezige liquiditeit, bedoeld in de [artikelen 111][ref4], [112][ref5] of
      [113][ref6].

      2 De minimale omvang van de liquiditeit, bedoeld in het eerste lid, is ten minste gelijk aan de vereiste
      liquiditeit, bedoeld in [artikel 108][ref7].

      3 De liquiditeit van een onderneming als bedoeld in [artikel 3:63, eerste lid][ref8], [3:64][ref9], [3:65][ref10]
      of [3:66 van de wet][ref11], niet zijnde een bank, is voldoende indien de aanwezige liquiditeit, bedoeld in de
      [artikelen 111][ref12], [112][ref13] of [113][ref14], tenminste gelijk is aan de vereiste liquiditeit, bedoeld in
