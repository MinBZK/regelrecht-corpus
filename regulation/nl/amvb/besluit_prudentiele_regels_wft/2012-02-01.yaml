    text: |-
      1 De door een accountant als bedoeld in [artikel 3:88, tweede lid][ref1], [3:90][ref2], [3:91][ref3] of
      [3:93 van de wet][ref4] te verstrekken gegevens zijn:

      a. het accountantsverslag aan de bestuurders en de raad van commissarissen;

      b. de directiebrieven;

      c. overige correspondentie tussen de accountant en de financiële onderneming die rechtstreeks betrekking heeft op
      de verklaring omtrent de getrouwheid van de jaarrekening of de staten van de financiële onderneming; en

      d. indien de Nederlandsche Bank daarom verzoekt, een nadere toelichting op de gegevens, bedoeld in de onderdelen a
      tot en met c.

      2 De door een actuaris als bedoeld in [artikel 3:89, eerste lid][ref5], [3:92][ref6] of [3:94 van de wet][ref7] te
      verstrekken gegevens zijn:

      a. het actuarieel rapport en het actuarieel verslag aan de bestuurders en de raad van commissarissen;

      b. overige stukken die voortvloeien uit de werkzaamheden, bedoeld in [artikel 3:73 van de wet][ref8]; en

      c. indien de Nederlandsche Bank daarom verzoekt, een nadere toelichting op de gegevens, bedoeld in de onderdelen a
      en b.


