    text: |-
      1 De procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref1], die zijn gericht op het beheersen van het
      operationeel risico zijn eveneens gericht op zelden voorkomende, zeer ernstige gebeurtenissen.

      2 Een bank of beleggingsonderneming als bedoeld in [artikel 23, tweede lid, tweede volzin][ref2], geeft in
      aanvulling op hetgeen in dit besluit onder operationeel risico wordt verstaan, aan wat zij onder operationeel
      risico verstaat.


