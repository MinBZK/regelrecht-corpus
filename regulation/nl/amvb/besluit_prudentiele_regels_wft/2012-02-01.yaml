        paragraaf: '12.1'
  - number: '120'
    text: |-
      1 Een herverzekeraar of schadeverzekeraar als bedoeld in [artikel 114, eerste lid][ref1], houdt een
      egalisatievoorziening aan voor het herverzekeren van risico’s in de branche Krediet onderscheidenlijk voor de
      branche Krediet voor:

      a. alle aangegane verplichtingen indien het een herverzekeraar of schadeverzekeraar met zetel in Nederland betreft;

      b. de vanuit zijn in Nederland gelegen bijkantoren aangegane verplichtingen indien het een herverzekeraar met zetel
      in een niet-aangewezen staat of een schadeverzekeraar met zetel in een staat die geen lidstaat is betreft.

      2 Het eerste lid is niet van toepassing op:

      a. herverzekeraars met zetel in Nederland die naast de risico’s van de branche Krediet risico’s van een andere
      branche vanuit een vestiging in een lidstaat herverzekeren, indien de door hun jaarlijks geboekte premies met
      betrekking tot hun vanuit vestigingen in een lidstaat aangegane verplichtingen voor de risico’s van de branche
      Krediet minder dan vier procent van het totale bedrag aan jaarlijks geboekte premies en minder dan € 2.500.000
      belopen;

      b. herverzekeraars met zetel in een niet-aangewezen staat die naast de risico’s van de branche Krediet risico’s van
      een andere branche vanuit een in Nederland gelegen bijkantoor herverzekeren, indien de door hun jaarlijks geboekte
      premies met betrekking tot hun vanuit bijkantoren in Nederland aangegane verplichtingen in de herverzekering van
      risico’s van de branche Krediet minder dan vier procent van het totale bedrag aan jaarlijks geboekte premies en
      minder dan € 2.500.000 belopen;

      c. schadeverzekeraars met zetel in Nederland die naast de branche Krediet een of meer andere branches vanuit een
      vestiging in een lidstaat uitoefenen, indien de door hun jaarlijks geboekte premies met betrekking tot hun vanuit
      vestigingen in een lidstaat aangegane verplichtingen in de uitoefening van de branche Krediet minder dan vier
      procent van het totale bedrag aan jaarlijks geboekte premies en minder dan € 2.500.000 belopen; of

      d. schadeverzekeraars met zetel in een staat die geen lidstaat is die naast de branche Krediet een of meer andere
      branches vanuit een in Nederland gelegen bijkantoor uitoefenen, indien de door hun jaarlijks geboekte premies
      met betrekking tot hun vanuit bijkantoren in Nederland aangegane verplichtingen in de uitoefening van de branche
      Krediet minder dan vier procent van het totale bedrag aan jaarlijks geboekte premies en minder dan € 2.500.000
      belopen.

      3 De egalisatievoorziening wordt gevormd ter dekking van een tijdens het boekjaar in de branche Krediet geleden
      technisch verlies en beloopt ten minste 134 procent van het gemiddelde van de tijdens de vijf voorgaande boekjaren
      jaarlijks geboekte premies verminderd met het bedrag van de overdrachten uit hoofde van herverzekering en na
      toevoeging van de geaccepteerde herverzekeringen.

      4 Aan de egalisatievoorziening wordt in elk van de opeenvolgende boekjaren waarin in de branche Krediet een
      technisch overschot werd geboekt, 75 procent van dit technisch overschot toegevoegd, totdat de voorziening gelijk
      is aan of hoger dan het overeenkomstig het derde lid berekende minimum.

      5 Dit artikel is van overeenkomstige toepassing op de egalisatiereserve voor de branche Krediet, bedoeld in
      [artikel 114, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel114
