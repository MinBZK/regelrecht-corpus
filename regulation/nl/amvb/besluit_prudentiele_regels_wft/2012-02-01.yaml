  - number: '85'
    text: |-
      1 Het bedrag van een naar risico gewogen securitisatiepositie is gelijk aan de waarde van de securitisatiepositie
      vermenigvuldigd met een aan die securitisatiepositie toegekend risicogewicht. Elke tranche van een
      securitisatiepositie geldt daarbij als afzonderlijke securitisatiepositie.

      2 De Nederlandsche Bank stelt, met inachtneming van het derde tot en met vijfde lid, regels met betrekking tot
      het in aanmerking nemen van posten als securitisatieposities en de aan die securitisatieposities toe te kennen
      risicogewichten. Zij maakt daarbij onderscheid tussen gevallen waarin [artikel 61][ref1] wordt toegepast voor
      de berekening van de naar risico gewogen activa en posten buiten de balanstelling voor de categorie waarin de
      gesecuritiseerde posten op grond van [artikel 61, vijfde lid, onderdeel a][ref2], zou zijn ingedeeld en alle
      overige gevallen.

      3 Bij de toekenning van een risicogewicht aan een securitisatiepositie kan een financiële onderneming als bedoeld
      in [artikel 83][ref3] een kredietbeoordeling van een door de Nederlandsche Bank of door een toezichthoudende
      instantie van een andere lidstaat ingevolge [paragraaf 10.5][ref4] erkend kredietbeoordelingsbureau op een
      consistente wijze gebruiken. De Nederlandsche Bank stelt nadere regels met betrekking tot het gebruik van een
      kredietbeoordeling als bedoeld in de vorige volzin.

      4 De Nederlandsche Bank kent op een objectieve en consequente wijze een risicogewicht toe aan kredietbeoordelingen
      als bedoeld in het derde lid met inachtneming van het volgende:

      a. zij onderscheidt de relatieve risicograden waaraan de kredietbeoordeling uitdrukking geeft;

      b. zij zorgt ervoor dat aan securitisatieposities die een gelijkwaardig kredietrisico lopen op grond van
      kredietbeoordelingen hetzelfde risicogewicht wordt toegekend; in voorkomende gevallen past zij de toekenning van
      een risicogewicht op grond van kredietbeoordelingen aan een securitisatiepositie aan.

      [Artikel 61a, vierde lid][ref5], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel61
