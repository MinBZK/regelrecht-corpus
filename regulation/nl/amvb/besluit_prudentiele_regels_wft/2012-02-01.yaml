  - number: '10'
    text: |-
      1 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie,
      bank, premiepensioeninstelling, verzekeraar of bijkantoor als bedoeld in [artikel 3:10, eerste lid][ref1],
      [3:11][ref2], [3:12][ref3], [3:13][ref4] of [3:14 van de wet][ref5] draagt zorg voor een systematische analyse van
      integriteitsrisico´s.

      2 De financiële onderneming, onderscheidenlijk het bijkantoor, draagt er zorg voor dat het beleid, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref6] zijn neerslag vindt in procedures en maatregelen.

      3 De financiële onderneming, onderscheidenlijk het bijkantoor, stelt alle relevante bedrijfsonderdelen in kennis
      van het beleid en de procedures en maatregelen.

      4 De financiële onderneming, onderscheidenlijk het bijkantoor, draagt zorg voor de uitvoering en de systematische
      toetsing van het beleid en de procedures en maatregelen.

      5 De financiële onderneming, onderscheidenlijk het bijkantoor, draagt zorg voor onafhankelijk toezicht op de
      uitvoering van het beleid en de procedures en maatregelen met betrekking tot de integere uitoefening van het
      bedrijf en beschikt over procedures die erin voorzien dat gesignaleerde tekortkomingen of gebreken worden
      gerapporteerd aan de personen belast met de taak, bedoeld in [artikel 21][ref7].

      6 De financiële onderneming, onderscheidenlijk het bijkantoor, beschikt over procedures die erin voorzien dat
      gesignaleerde tekortkomingen of gebreken met betrekking tot de integere uitoefening van het bedrijf onder toezicht
      van de personen belast met de taak, bedoeld in [artikel 21][ref8], tot een gepaste bijstelling leiden.


