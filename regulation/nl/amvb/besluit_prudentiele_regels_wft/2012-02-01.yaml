  - number: 25b
    text: |-
      1 De Nederlandsche Bank treft maatregelen indien de economische waarde van een bank of beleggingsonderneming als
      bedoeld in [artikel 23, tweede lid, tweede volzin][ref1], met meer dan twintig procent van het toetsingsvermogen
      afneemt door een plotselinge en onverwachte verandering in de rentetarieven.

      2 De Nederlandsche Bank stelt de omvang van de verandering in de rentetarieven vast, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
