  - number: '124'
    text: |-
      Onverminderd [artikel 123][ref1] stelt de Nederlandsche Bank nadere regels met betrekking tot het gebruik van de
      waarden die dienen tot dekking van de technische voorzieningen van levensverzekeraars of schadeverzekeraars als
      bedoeld in [artikel 122, eerste lid][ref2], en de daarbij in acht te nemen voorwaarden, ten aanzien van:

      a. de leningen waarvoor niet door middel van een bankgarantie, een garantie toegekend door een verzekeraar, een
      recht van hypotheek of een andere wijze zekerheid is gegeven;

      b. deelnemingen in een beleggingsinstelling, voor zover de richtlijn beleggingsinstellingen niet van toepassing is;

      c. effecten die niet worden verhandeld op een gereglementeerde markt; en

      d. beleggingen als bedoeld in [artikel 122b, eerste lid, onderdeel a, onder 1°][ref3], uitgegeven door een
      emittent niet zijnde centrale, regionale of lokale overheid of een ander openbaar lichaam, een internationale
      organisatie waarvan een of meer lidstaten deel uitmaken of een bank met zetel in Nederland, in een andere lidstaat
      of in een ingevolge [artikel 3:2, eerste lid, onderdeel c, onder 2°, van de wet][ref4] aangewezen staat.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel123
