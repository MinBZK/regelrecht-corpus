  - number: 23e
    text: |-
      1 De procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref1], die betrekking hebben op het
      beheersen van het securitisatierisico zijn erop gericht dat bij het nemen van beslissingen op het gebied van
      risicobeoordeling en het risicobeheer rekening wordt gehouden met het economisch belang van de transactie.

      2 Een bank of beleggingsonderneming als bedoeld in [artikel 23, tweede lid, tweede volzin][ref2], die initiator
      is van een securitisatie van revolverende vorderingen waarop een vervroegde- aflossingsbepaling van toepassing is,
      stelt een liquiditeitsplan vast om de gevolgen van zowel geplande als vervroegde aflossingen op te vangen.


