        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 25a
    text: |-
      1 De door de Nederlandsche Bank uitgevoerde evaluatie, bedoeld in [artikel 3:18a, eerste lid, van de wet][ref1]
      heeft ten minste betrekking op:

      a. de risico’s, bedoeld in [artikel 60, eerste lid][ref2];

      b. het renterisico dat een bank of beleggingsonderneming als bedoeld in
      [artikel 23, tweede lid, tweede volzin][ref3], bij niet-handelsactiviteiten loopt;

      c. de resultaten van de stresstests die zijn uitgevoerd door de financiële onderneming die voor het kredietrisico
      een interne modellenmethode toepast;

      d. de blootstelling aan en het beheer van het concentratierisico, het liquiditeitsrisico en grote posities door de
      financiële onderneming;

      e. de deugdelijkheid, geschiktheid en wijze van toepassing van de door de financiële onderneming gevolgde
      procedures met het oog op het beheer van het restrisico dat de toepassing van toegelaten technieken van
      kredietrisicovermindering met zich brengt;

      f. de vraag in hoeverre het toetsingsvermogen dat de financiële onderneming houdt met betrekking tot de activa die
      zij heeft gesecuritiseerd, toereikend is in het licht van de economische kenmerken van de transactie, inclusief de
      mate waarin sprake is van risico-overdracht;

      g. de blootstelling aan en de meting en het beheer van het liquiditeitsrisico door de financiële onderneming,
      waaronder onderzoek van alternatieve scenario’s, het beheer van risicovermindering, met name de omvang,
      samenstelling en kwaliteit van liquiditeitsbuffers, en effectieve calamiteitenplannen;

      h. de impact van de diversificatie-effecten en de wijze waarop dergelijke effecten in het systeem van risicometing
      worden verwerkt; en

      i. de resultaten van de stresstests die zijn uitgevoerd door de financiële onderneming die gebruik
      maakt van interne modellen voor de berekening van de vereiste solvabiliteit voor het risico, bedoeld in
      [artikel 60, eerste lid, onderdeel b][ref4].

      2 Voor de toepassing van het eerste lid, onderdeel g, onderwerpt de Nederlandsche Bank het gehele
      liquiditeitsrisicobeheer van de financiële onderneming regelmatig aan een uitgebreide evaluatie en bevordert zij
      de ontwikkeling van solide interne methoden. Bij deze evaluaties let zij op de rol die deze financiële onderneming
      speelt op de financiële markten en neemt de gevolgen die haar besluiten kunnen hebben voor de stabiliteit van het
      financiële stelsel van alle andere betrokken lidstaten in overweging.

      3 De Nederlandsche Bank controleert of de financiële onderneming een securitisatie stilzwijgend buiten de grenzen
      van haar contractuele verplichtingen heeft gesteund. Indien blijkt dat de financiële onderneming meerdere keren
      buiten de grenzen van haar contractuele verplichtingen stilzwijgende steun heeft verleend, neemt de Nederlandsche
      Bank passende maatregelen op basis van het vermoeden dat de kans groot is dat de financiële onderneming ook in de
      toekomst haar securitisaties zal steunen buiten de grenzen van haar contractuele verplichtingen.

      4 De Nederlandsche Bank houdt bij het bepalen of het aangehouden toetsingsvermogen een beheerste en duurzame
      dekking van risico’s waarborgt, rekening met de vraag of de waardeaanpassingen en voorzieningen voor posities en
      portefeuilles in de handelsportefeuille de financiële onderneming in staat stellen haar posities onder normale
      marktomstandigheden op korte termijn te verkopen of af te dekken zonder dat wezenlijke verliezen worden geleden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel318a
