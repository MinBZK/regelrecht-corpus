      Voor het boekjaar 2007 wordt het minimumbedrag aan solvabiliteitsmarge voor herverzekeraars of schadeverzekeraars
      die zorgverzekeringen als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref1] of daarop
      aanvullende ziektekostenverzekeringen herverzekeren onderscheidenlijk uitvoeren, bepaald op de wijze als
      bedoeld in [artikel 67][ref2], met dien verstande dat bij de berekening en de verhouding, bedoeld in het
      [eerste lid, onderdeel b onderscheidenlijk c, van dat artikel][ref3] niet wordt uitgegaan van de afgelopen drie
      boekjaren, maar van de boekjaren 2006 en 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel67
