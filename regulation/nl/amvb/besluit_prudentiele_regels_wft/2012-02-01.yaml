  - number: '23'
    text: |-
      1 Een beheerder van een instelling voor collectieve belegging in effecten, beleggingsonderneming, betaalinstelling
      clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie, bank, verzekeraar of bijkantoor
      als bedoeld in [artikel 3:17, eerste en derde lid][ref1], [3:22][ref2], [3:23][ref3], [3:24a][ref4], [3:24b][ref5],
      [3:26][ref6] of [3:27 van de wet][ref7] voert beleid gericht op het beheersen van relevante risico’s.

      2 Onder relevante risico’s, bedoeld in het eerste lid, worden in het bijzonder verstaan het concentratierisico,
      krediet- en tegenpartijrisico, liquiditeitsrisico, marktrisico, operationeel risico, renterisico voortvloeiend uit
      niet-handelsactiviteiten, restrisico, securitisatierisico en verzekeringsrisico. Een bank, beleggingsonderneming
      of clearinginstelling als bedoeld in [artikel 3:17, eerste of derde lid][ref8], [3:22][ref9], [3:23][ref10] of
      [3:27 van de wet][ref11] houdt tevens rekening met de risico’s die voortvloeien uit de macro-economische omgeving
      waarin de onderneming actief is en die verband houden met de stand van de conjunctuurcyclus.

      3 Het beleid wordt vastgelegd in procedures en maatregelen ter beheersing van relevante risico’s en geïntegreerd
      in de bedrijfsprocessen. De procedures en maatregelen die zijn gericht op de beheersing van het liquiditeitsrisico
      hebben betrekking op het beheer van de actuele en toekomstige netto financiële positie en behoeften.

      4 De procedures en maatregelen, bedoeld in het derde lid, bestaan onder meer uit autorisatieprocedures,
      limietstellingen, limietbewaking en procedures en maatregelen voor noodsituaties en zijn afgestemd op de aard, de
      omvang, het risicoprofiel en de complexiteit van de werkzaamheden van de financiële onderneming of bijkantoor.

      5 De procedures en maatregelen, bedoeld in het derde lid, worden vastgelegd en ter kennis gebracht van alle
      relevante bedrijfsonderdelen van de financiële onderneming of het bijkantoor.

      6 De financiële onderneming heeft een onafhankelijke risicobeheerfunctie die op systematische wijze een
      onafhankelijk risicobeheer uitvoert dat gericht is op het identificeren, meten en evalueren van de risico’s waaraan
      de financiële onderneming of het bijkantoor is of kan worden blootgesteld. Het risicobeheer wordt zowel uitgevoerd
      ten aanzien van de financiële onderneming of het bijkantoor als geheel als ten aanzien van de onderscheiden
      bedrijfsonderdelen.

      7 De risicobeheerfunctie beschikt over de nodige autoriteit en toegang tot alle noodzakelijke informatie om haar
      taken te kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel317
