  - number: '74'
    text: |-
      1 Een bank of beleggingsonderneming als bedoeld in [artikel 69, eerste lid][ref1], die toestemming
      heeft gekregen voor het gebruik van een interne modellenmethode gebruikt voor de berekening
      van het bedrag van de naar risico gewogen activa en posten buiten de balanstelling, bedoeld in
      [artikel 71, eerste lid, onderdelen a tot en met d][ref2], eigen ramingen van de kans op wanbetaling.

      2 De financiële onderneming die ingevolge [artikel 69, eerste lid, laatste volzin][ref3], tevens toestemming heeft
      gekregen voor de activa en posten buiten de balanstelling, bedoeld in [artikel 71, eerste lid, onderdeel d][ref4],
      gebruikt voor de berekening van het bedrag van de naar risico gewogen activa en posten buiten de balanstelling
      eigen ramingen van verlies bij wanbetaling en omrekeningsfactoren.

      3 De financiële onderneming gebruikt voor de categorieën, bedoeld in
      [artikel 71, eerste lid, onderdelen a tot en met c][ref5], de ingevolge [artikel 73, tweede lid][ref6], voor
      de berekening van het bedrag van de naar risico gewogen activa en posten buiten de balanstelling vastgestelde
      waarden van verliezen bij wanbetaling en omrekeningsfactoren, tenzij de financiële onderneming, bedoeld in het
      eerste lid, ingevolge [artikel 69, eerste lid, laatste volzin][ref7], tevens toestemming heeft gekregen voor
      die activa en posten buiten de balanstelling. In dat geval gebruikt zij voor de berekening van het bedrag van
      de naar risico gewogen activa en posten buiten de balanstelling eigen ramingen van verliezen bij wanbetaling en
      omrekeningsfactoren.


