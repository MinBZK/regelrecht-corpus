    text: |-
      1 De waarden die dienen tot dekking van de technische voorzieningen van een levensverzekeraar of schadeverzekeraar
      als bedoeld in [artikel 122, eerste lid][ref1], moeten in toereikende mate kunnen worden geïnd of te gelde
      gemaakt in dezelfde muntsoort als die waarin de verplichtingen ingevolge [artikel 126][ref2] luiden. De waarden
      die dienen tot dekking van de technische voorzieningen van een natura-uitvaartverzekeraar als bedoeld in
      [artikel 122, eerste lid][ref3], moeten in toereikende mate kunnen worden geïnd of te gelde gemaakt in de muntsoort
      van de staat waarin de verzekerde ten tijde van het sluiten van de natura-uitvaartverzekering zijn woonplaats
      heeft.

      2 Voor zover de waarden, bedoeld in het eerste lid, eerste volzin, dienen tot dekking van de technische
      voorzieningen voor aangegane verplichtingen, moeten zij:

      a. in geval van een levensverzekeraar of schadeverzekeraar met zetel in Nederland: aanwezig zijn in een lidstaat
      indien wat een levensverzekeraar betreft de verzekeringnemer zijn gewone verblijfplaats in een lidstaat heeft, of,
      indien de verzekeringnemer een rechtspersoon is, de zetel van de verzekeringnemer zich in een lidstaat bevindt, en
      wat een schadeverzekeraar betreft het risico in een lidstaat is gelegen; of

      b. in geval van een levensverzekeraar of schadeverzekeraar met zetel in een staat die geen lidstaat is: aanwezig
      zijn in Nederland.

      3 Voor zover de waarden, bedoeld in het eerste lid, tweede volzin, dienen tot dekking van de technische
      voorzieningen voor de vanuit de vestigingen in Nederland aangegane verplichtingen, moeten zij:

      a. in geval van een natura-uitvaartverzekeraar met zetel in Nederland: aanwezig zijn in een lidstaat; of

      b. in geval van een natura-uitvaartverzekeraar met zetel in een niet-aangewezen staat: aanwezig zijn in Nederland.


