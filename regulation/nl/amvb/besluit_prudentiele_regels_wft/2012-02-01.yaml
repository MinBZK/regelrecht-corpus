  - number: 23f
    text: |-
      1 Het beleid als bedoeld in [artikel 23, eerste lid][ref1], of de procedures en maatregelen en de bedrijfsvoering
      als bedoeld in [artikel 26, tweede lid][ref2], houdt respectievelijk houden mede in dat de financiële onderneming
      een beleid inzake beloningen voert dat niet aanmoedigt tot het nemen van meer risico’s dan voor de desbetreffende
      financiële onderneming aanvaardbaar is.

      2 De financiële onderneming legt het beleid inzake beloningen schriftelijk vast en draagt er zorg voor dit beleid
      te implementeren en in stand te houden. Het beleid is afgestemd op de omvang en organisatie van de financiële
      onderneming en aan de aard, omvang en complexiteit van haar bedrijf.

      3 Het beleid inzake beloningen omschrijft de beloningscomponenten en beloningsstructuren die ertoe zouden kunnen
      bijdragen dat de financiële onderneming meer risico’s neemt dan voor haar aanvaardbaar is, alsmede de te volgen
      procedures en maatregelen die dergelijke beloningscomponenten en beloningsstructuren voorkomen en beheersen.

      4 De financiële onderneming maakt een beschrijving van haar beleid inzake beloningen openbaar.

      5 De Nederlandsche Bank kan regels stellen met betrekking tot:

      a. de wijze waarop het beleid inzake beloningen wordt opgesteld en vastgesteld of goedgekeurd, uitgevoerd,
      geëvalueerd en aangepast;

      b. de wijze waarop vorm wordt gegeven aan beloningscomponenten en beloningsstructuren en de wijze waarop de
      risico's die uit het beleid en de uitvoering daarvan voortvloeien, worden beheerst; en

      c. de inhoud en de wijze van openbaarmaking van het beleid inzake beloningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel26
