  - number: '72'
    text: |-
      1 De Nederlandsche Bank stelt, met inachtneming van de [artikelen 73][ref1] en [74][ref2], regels met betrekking
      tot:

      a. de berekening van het bedrag van de naar kredietrisico gewogen activa en posten buiten de balanstelling,
      bedoeld in [artikel 71, eerste lid, onderdelen a tot en met e of g][ref3], voor zover dit bedrag niet op het
      toetsingsvermogen in mindering wordt gebracht; en

      b. de berekening van het bedrag van de naar verwateringsrisico gewogen activa en posten buiten de balanstelling die
      verband houden met gekochte kortlopende handelsvorderingen, met of zonder verhaal op de wederpartij.

      2 Het bedrag van een naar risico gewogen post bij gesecuritiseerde activa en posten buiten de balanstelling of
      van een naar risico gewogen securitisatiepositie als bedoeld in [artikel 71, eerste lid, onderdeel f][ref4], wordt
      berekend volgens [paragraaf 10.4][ref5].


