  - number: 131a
    text: |-
      1 Indien blijkt dat de rapportage zoals vastgesteld in [bijlage D][ref1] materiële afwijkingen bevat ten opzichte
      van de rapportage zoals die ingevolge de richtlijn nr. 2009/138/EG van het Europees Parlement en de Raad van
      de Europese Unie van 25 november 2009 betreffende de toegang tot en uitoefening van het verzekerings- en het
      herverzekeringsbedrijf (Solvabiliteit II) (herschikking) (PbEU L 335) zal worden vastgesteld, besluit Onze Minister
      dat de rapportage over het boekjaar 2011, bedoeld in [artikel 131, zesde lid][ref2], niet behoeft te worden
      ingediend.

      2 Onze Minister stelt de modellen van staten, bedoeld in [bijlage D][ref3], voor het boekjaar 2012 zo spoedig
      mogelijk opnieuw vast indien:

      a. het eerste lid toepassing heeft gevonden;

      b. het eerste lid geen toepassing heeft gevonden en de staten die ingevolge de richtlijn, genoemd in het eerste
      lid, zullen worden vastgesteld materieel afwijken van de staten, bedoeld in bijlage D.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel131
