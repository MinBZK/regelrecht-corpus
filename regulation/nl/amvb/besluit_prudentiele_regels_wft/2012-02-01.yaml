  - number: 23b
    text: |-
      Een bank, beleggingsonderneming of clearinginstelling, bedoeld in [artikel 23, tweede lid][ref1], beschikt
      over deugdelijke procedures en maatregelen voor de vaststelling, de meting, het beheer en de bewaking van het
      liquiditeitsrisico over een passende reeks termijnen aan de hand waarvan zij doorlopend nagaat of en ervoor zorgt
      dat de hoogte, samenstelling en verdeling van de aanwezige liquiditeit aansluiten op de aard en de omvang van haar
      huidige en toekomstige liquiditeitsrisico’s. Deze procedures en maatregelen voldoen tenminste aan de technische
      criteria voor de organisatie en behandeling van risico’s als bedoeld in paragraaf 10 van bijlage V van de herziene
      richtlijn banken.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
