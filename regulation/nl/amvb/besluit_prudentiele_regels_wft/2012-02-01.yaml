      [50][ref7], [59 tot en met 62][ref8], [89 tot en met 94][ref9], [102][ref10], [103][ref11], [138][ref12],
      [139][ref13], en [145][ref14] zijn, voor zover zij betrekking hebben op banken, van overeenkomstige toepassing
      op financiële instellingen die beschikken over een verklaring van ondertoezichtstelling als bedoeld in
      [artikel 3:110 van de wet][ref15].


