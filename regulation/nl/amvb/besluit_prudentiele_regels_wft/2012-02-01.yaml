  - number: '26.0'
    text: |-
      Een premiepensioeninstelling beschikt over procedures en maatregelen die waarborgen dat de omvang en samenstelling
      van en mutaties in de aan te houden financiële waarborgen getrouw en volledig kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020420/2012-02-01#Artikel26.0
  - number: 26a
    text: |-
      1 Een bank, beleggingsonderneming of financiële instelling die een verklaring van ondertoezichtstelling als bedoeld
      in [artikel 3:110][ref1] heeft, beschikt over procedures en maatregelen die waarborgen dat de voor de uitvoering
      van de vangnetregelingen noodzakelijke gegevens voortdurend actueel worden bijgehouden en adequaat zijn vastgelegd.

      2 De financiële onderneming verstrekt de gegevens, bedoeld in het eerste lid, binnen een door de Nederlandsche Bank
      te bepalen termijn, in een voor de Nederlandsche Bank toegankelijke vorm nadat de Nederlandsche Bank ten aanzien
      van haar heeft besloten tot toepassing van een vangnetregeling.

      3 De Nederlandsche Bank deelt het besluit tot toepassing van een vangnetregeling onverwijld mede aan de
      desbetreffende financiële onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3110
