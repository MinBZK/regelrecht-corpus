        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '26.4'
    text: |-
      De artikelen 319, 320, 321, 324, 326 en 327 van de verordening solvabiliteit II inzake de bedrijfsvoering van
      entiteiten voor risico-acceptatie zijn van overeenkomstige toepassing op entiteiten voor risico-acceptatie met
      zetel in een niet-aangewezen staat die hun bedrijf uitoefenen vanuit een in Nederland gelegen bijkantoor.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel26.4
  - number: '26.5'
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 3:17, tweede lid, onderdeel c, onder 4°][ref1], of
      [artikel 3:23, eerste lid, van de wet][ref2] beschikt over een voorbereidend crisisplan dat door de Nederlandsche
      Bank is goedgekeurd en dat voorziet in maatregelen die de verzekeraar in staat stellen zijn financiële positie na
      een aanzienlijke verslechtering ervan te herstellen.

      2 Een voorbereidend crisisplan wordt ten minste elke drie jaar geëvalueerd en zo nodig bijgewerkt, alsook na elke
      significante verandering in de juridische structuur, de feitelijke bedrijfsuitoefening of de financiële positie van
      de verzekeraar.

      3 Een aanzienlijke verslechtering van de financiële positie als bedoeld in het eerste lid omvat ten minste een
      dreigende of daadwerkelijke doorbreking van het solvabiliteitskapitaalvereiste, een dreigende of daadwerkelijke
      doorbreking van het minimumkapitaalvereiste, alsmede een dreigende of daadwerkelijke verslechtering van de
      liquiditeitspositie.

      4 Het voorbereidende crisisplan bevat in ieder geval:

      a. de maatregelen voor herstel van de financiële positie in verschillende crisisscenario’s, de verwachte
      effectiviteit ervan en de voor de uitvoering benodigde tijd;

      b. een beschrijving van de procedures voor het bepalen van de waarde en verkoopbaarheid van bedrijfsactiviteiten en
      activa in diverse crisisscenario’s;

      c. een beschrijving van de wijze waarop het voorbereidende crisisplan in de bestuurs- en bedrijfsvoeringsstructuur
      is geïntegreerd, alsmede van het beleid en de procedures met betrekking tot de goedkeuring van het voorbereidende
      crisisplan en de identificatie van de personen in de organisatie die voor de opstelling en uitvoering van het plan
      verantwoordelijk zijn;

      d. de wijze waarop de verzekeraar de continue werking van de kritische bedrijfsprocessen waarborgt;

      e. de wijze waarop de verzekeraar beoogt verzekeringsportefeuilles of delen daarvan met de daarbij behorende activa
      te verkopen binnen een tijdsbestek dat passend is voor het herstel van de financiële soliditeit;

      f. voorbereidingen die de verzekeraar heeft getroffen of voornemens is te treffen om de uitvoering van het
      voorbereidende crisisplan te vergemakkelijken, met inbegrip van maatregelen die nodig kunnen zijn voor een tijdige
      herkapitalisatie van de verzekeraar;

      g. indien van toepassing: een samenvatting van wezenlijke veranderingen in de juridische structuur of de feitelijke
      bedrijfsuitoefening die zich sinds de opstelling van het laatste voorbereidende crisisplan hebben voorgedaan;

      h. een analyse van het effect van de uitvoering van de in het plan opgenomen maatregelen op de polishouders en,
      voor zover van toepassing, de rest van de groep;

      i. een communicatieplan voor de media en het publiek; en,

      j. indien van toepassing: een beschrijving van de wezenlijke belemmeringen voor de doeltreffende uitvoering van
      het voorbereidende crisisplan en maatregelen om deze belemmeringen weg te nemen en de voor de uitvoering van die
      maatregelen benodigde tijd.

      5 Indien in het laatst ingediende periodieke toezichtrapport, bedoeld in artikel 304, eerste lid, onderdeel b,
      van de verordening solvabiliteit II, reeds de in het vierde lid genoemde onderdelen zijn opgenomen, vervalt de
      verplichting bedoeld in het vierde lid, voor de betreffende onderdelen.

      6 De Nederlandsche Bank kan toestaan dat het tweede tot en met vierde lid op vereenvoudigde wijze wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel317
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel323
