  - number: 40i
    text: |-
      1 De Nederlandsche bank kan besluiten om een verzoek van een bank tot registratie als bedoeld in
      [artikel 3:33a, eerste lid, van de wet][ref1] af te wijzen indien de Nederlandsche Bank oordeelt dat uitgifte van
      geregistreerde gedekte obligaties door die bank afbreuk doet aan een gezonde verhouding tussen de totale uitstaande
      geregistreerde gedekte obligaties van die bank en de totale geconsolideerde balans van die bank.

      2 De Nederlandsche Bank kan besluiten om een bank die een geregistreerde gedekte obligatie uitgeeft, te verbieden
      over te gaan tot verdere uitgifte van geregistreerde gedekte obligaties, indien de Nederlandsche Bank oordeelt dat
      een verdere uitgifte afbreuk doet aan een gezonde verhouding tussen de totale uitstaande geregistreerde gedekte
      obligaties van die bank en de totale geconsolideerde balans van die bank.


