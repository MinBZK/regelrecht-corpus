  - number: 25a
    text: |-
      De Nederlandsche Bank kan een entiteit als bedoeld in [artikel 3A:2 van de wet][ref1] verplichten gedetailleerde
      gegevens bij te houden over financiële contracten als bedoeld in artikel 2, eerste lid, onderdeel 100, van de
      richtlijn herstel en afwikkeling van banken en beleggingsondernemingen waarbij zij partij is, indien dit nodig is
      met het oog op:

      a. het opstellen of het uitvoeren van een herstelplan als bedoeld in de [artikelen 23d][ref2] of [23e][ref3]; of

      b. de toepassing van [hoofdstuk 3A.2 van de wet][ref4] of de verordening gemeenschappelijk afwikkelingsmechanisme.


