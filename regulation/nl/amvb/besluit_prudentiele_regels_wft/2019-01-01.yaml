  - number: 17b
    text: |-
      De Nederlandsche Bank kan ter uitvoering van internationaal aanvaarde standaarden nadere regels stellen met
      betrekking tot de bedrijfsvoering van afwikkelondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel17b
  - number: 17c
    text: |-
      1 Een bank of clearinginstelling als bedoeld in [artikel 17, eerste lid][ref1], beschikt over interne regelingen en
      procedures die zijn gericht op een doeltreffend en prudent bestuur van de onderneming, dat voldoet aan de vereisten
      in artikel 88, eerste lid, van de richtlijn kapitaalvereisten.

      2 Een bank als bedoeld in [artikel 17, eerste lid][ref2], die significant is ingevolge [artikel 17d][ref3],
      beschikt over een benoemingscommissie waarvan de taken en bevoegdheden voldoen aan de vereisten in artikel 88,
      tweede lid, van de richtlijn kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel17
