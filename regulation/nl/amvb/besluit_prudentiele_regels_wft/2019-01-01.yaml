    text: |-
      De liquiditeit van een bank als bedoeld in [artikel 3:63, eerste lid][ref1], [3:64][ref2] of
      [3:65 van de wet][ref3] is voldoende, indien wordt voldaan aan de liquiditeitsvereisten ingevolge deel 6 van de
      verordening kapitaalvereisten, dat van overeenkomstige toepassing is op de activiteiten vanuit een bijkantoor in
      Nederland van een bank met zetel in een staat die geen lidstaat is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel363
