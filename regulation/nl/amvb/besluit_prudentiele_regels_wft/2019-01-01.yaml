  - number: '114'
    text: |-
      1 Een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-omvang, berekent de door
      hem aan te houden technische voorzieningen overeenkomstig de artikelen 76 tot en met 83 en 192 van de richtlijn
      solvabiliteit II, met inachtneming van titel I, hoofdstuk III, van de verordening solvabiliteit II.

      2 Indien een kapitaalopslag aan de verzekeraar is opgelegd en de verzekeraar artikel 77, vijfde lid, van de
      richtlijn solvabiliteit II toepast, neemt hij tevens artikel 37, vijfde lid, tweede alinea, van die richtlijn in
      acht.

      3 Indien de Europese Commissie op grond van artikel 172, tweede of vierde lid, van de richtlijn solvabiliteit
      II het solvabiliteitsregime van een staat die geen lidstaat is gelijkwaardig acht met die van de richtlijn
      solvabiliteit II, worden voor de berekening van de technische voorzieningen herverzekeringsovereenkomsten met
      verzekeraars met zetel in die staat gelijk gesteld met herverzekeringsovereenkomsten met verzekeraars met zetel in
      een lidstaat.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel114
  - number: '115'
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 114][ref1] kan bij het berekening van de technische voorzieningen,
      na voorafgaande goedkeuring van de Nederlandsche Bank, gebruik maken van hetzij de overgangsmaatregel, bedoeld
      in artikel 308 quater van de richtlijn solvabiliteit II, hetzij de overgangsmaatregel, bedoeld in artikel 308
      quinquies van die richtlijn.

      2 Een verzekeraar die gebruik maakt van een overgangsmaatregel als bedoeld in het eerste lid en vaststelt dat hij
      zonder toepassing van die overgangsmaatregel niet aan het solvabiliteitskapitaalvereiste zou voldoen, geeft hiervan
      onverwijld kennis aan de Nederlandsche Bank en treft de in artikel 308 sexies, tweede en derde alinea, van de
      richtlijn solvabiliteit II bedoelde maatregelen.

      3 De Nederlandsche Bank trekt de in het eerste lid bedoelde goedkeuring in indien uit de door de verzekeraar
      overgelegde informatie blijkt dat het onrealistisch is dat deze aan het einde van de overgangsperiode aan het
      solvabiliteitskapitaalvereiste zal voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '116'
    text: |-
      1 De artikelen 76 tot en met 83, 192 en 308 quater tot en met 308 sexies van de richtlijn solvabiliteit II en titel
      I, hoofdstuk III, van de verordening solvabiliteit II inzake de berekening van de technische voorzieningen zijn
      van overeenkomstige toepassing op de door de volgende verzekeraars aan te houden technische voorzieningen voor hun
      vanuit een in Nederland gelegen bijkantoor aangegane verzekeringsverplichtingen:

      a. levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;

      b. herverzekeraars met zetel in een niet-aangewezen staat.

      2 [Artikel 114, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '117'
    text: |-
      1 De artikelen 76 tot en met 77 bis en 77 quinquies tot en met 83 van de richtlijn solvabiliteit II en titel I,
      hoofdstuk III, met uitzondering van afdeling 4, onderafdeling 4, van de verordening solvabiliteit II inzake de
      berekening van de technische voorzieningen zijn van overeenkomstige toepassing op:

      a. verzekeraars met beperkte risico-omvang met zetel in Nederland;

      b. verzekeraars met beperkte risico-omvang met zetel in een niet-aangewezen staat voor wat betreft de door
      hen aan te houden technische voorzieningen voor hun vanuit een in Nederland gelegen bijkantoor aangegane
      verzekeringsverplichtingen.

      2 Een verzekeraar met beperkte risico-omvang als bedoeld in het eerste lid kan bij de berekening van de technische
      voorzieningen gebruik maken van de vereenvoudigde berekeningsmethoden als bedoeld in de artikelen 57 tot en met 61
      van de verordening solvabiliteit II, mits:

      a. deze passen bij de aard, omvang en complexiteit van de risico’s van de verzekeraar en deze berekeningswijzen
      niet leiden tot een significante onderschatting van de technische voorzieningen;

      b. het gebruik ervan goed wordt onderbouwd en vastgelegd;

      c. ten aanzien van de toepassing van de berekeningsmethoden een bestendige gedragslijn wordt gevolgd.

      3 In afwijking van het eerste lid, aanhef, wordt voor natura-uitvaartverzekeraars en levensverzekeraars met
      beperkte risico-omvang als bedoeld in [artikel 49b, tweede lid, onderdeel a][ref1], bij de toepassing van artikel
      39 van de verordening solvabiliteit II het kapitaalkostenpercentage gesteld op 4%.

      4 De verzekeraar kan bij de berekening van de technische voorzieningen rekening houden met:

      a. aanwezige risicomitigerende instrumenten, mits deze aantoonbaar effectief zijn en niet resulteren in een
      materieel basisrisico als bedoeld in artikel 1, punt 25, van de verordening solvabiliteit II;

      b. toekomstige risicomitigerende instrumenten, mits deze realistisch zijn en aantoonbaar voortvloeien uit de
      reguliere bedrijfsvoering, het gevoerde risicobeheer of het afdekkingsbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel49b
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 49b
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: '118'
    text: |-
      1 Het beleggingsbeleid van een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-
      omvang, voldoet aan het prudent person beginsel, bedoeld in artikel 132, tweede tot en met vierde lid, van de
      richtlijn solvabiliteit II, met inachtneming van titel I, hoofdstuk VIII, van de verordening solvabiliteit II.

      2 De vereisten in de door de Europese Commissie vastgestelde uitvoeringsmaatregelen als bedoeld in artikel 135,
      tweede lid, van de richtlijn solvabiliteit II zijn op verzekeraars die beleggen in verhandelbare effecten of andere
      op herverpakte kredieten gebaseerde instrumenten die voor 1 januari 2011 zijn uitgegeven, slechts van toepassing
      indien na 31 december 2014 nieuwe onderliggende vorderingen zijn of worden toegevoegd of vervangen.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel118
  - number: '119'
    text: |-
      Artikel 132, tweede tot en met vierde lid, van de richtlijn solvabiliteit II en titel I, hoofdstuk VIII, van de
      verordening solvabiliteit II inzake het beleggingsbeleid zijn van overeenkomstige toepassing op de activa van de in
      Nederland gelegen bijkantoren van:

      a. levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;

      b. herverzekeraars met zetel in een niet-aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel119
  - number: '120'
    text: |-
      Artikel 132, tweede tot en met vierde lid, van de richtlijn solvabiliteit II en titel I, hoofdstuk VIII, van de
      verordening solvabiliteit II inzake het beleggingsbeleid zijn van overeenkomstige toepassing op:

      a. verzekeraars met beperkte risico-omvang met zetel in Nederland;

      b. verzekeraars met beperkte risico-omvang met zetel in een niet-aangewezen staat voor wat betreft de activa van
      hun in Nederland gelegen bijkantoren.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel120
  - number: '121'
    text: |-
      De waarden die dienen tot dekking van de technische voorzieningen voor de door een verzekeraar met beperkte risico-
      omvang vanuit zijn vestigingen in Nederland aangegane verplichtingen zijn:

      a. in geval van een verzekeraar met zetel in Nederland: aanwezig in een lidstaat; of

      b. in geval van een verzekeraar met zetel in een niet-aangewezen staat: aanwezig in Nederland.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel121
  - number: '122'
    text: |-
      Artikel 132, tweede tot en met vierde lid, van de richtlijn solvabiliteit II en titel I, hoofdstuk VIII, van de
      verordening solvabiliteit II inzake het beleggingsbeleid zijn van overeenkomstige toepassing op:

      a. de waarden, bedoeld in [artikel 3:67, vierde lid][ref1], of [3:68, derde lid, van de wet][ref2]
      die dienen tot dekking van de verplichtingen van een levensverzekeraar of schadeverzekeraar
      als bedoeld in die artikelen die voortvloeien uit vorderingen van werknemers als bedoeld in
      [artikel 3:198, tweede lid, onderdelen b, c en d, of derde lid, onderdelen a, b en c, van de wet][ref3];

      b. de waarden, bedoeld in [artikel 3:67, vierde lid][ref4], of [3:69, tweede lid, van de wet][ref5],
      die dienen tot dekking van de verplichtingen van een verzekeraar met beperkte risico-omvang
      als bedoeld in die artikelen die voortvloeien uit vorderingen van werknemers als bedoeld in
      [artikel 3:198, vierde lid, onderdelen a, b en c, van de wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel367
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel368
