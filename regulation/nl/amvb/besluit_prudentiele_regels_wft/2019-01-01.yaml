  - number: '30'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in
      [artikel 27, tweede lid][ref1], beschikt over toereikende procedures, maatregelen, deskundigheid en informatie om
      de uitvoering van de op structurele basis uitbestede werkzaamheden te kunnen beoordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel30
    references:
