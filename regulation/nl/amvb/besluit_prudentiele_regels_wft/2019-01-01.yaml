  - number: '146'
    text: |-
      Indien de Nederlandsche Bank ten aanzien van een bank of elektronischgeldinstelling een besluit heeft genomen
      dat overeenkomt met een besluit als bedoeld in [artikel 60, eerste lid, onderdeel a, of derde lid][ref1],
      [62, vijfde lid][ref2], [64][ref3], [92, tweede of derde lid][ref4], [93][ref5], [102, zevende lid][ref6], wordt
      het eerstbedoelde besluit aangemerkt als besluit in de zin van het desbetreffende artikel. De aan het besluit
      gestelde beperkingen of verbonden voorschriften blijven van kracht.


