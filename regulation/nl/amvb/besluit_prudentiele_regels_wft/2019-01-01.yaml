  - number: 106b
    text: |-
      1 Het vereiste van voldoende liquiditeit ingevolge de [artikelen 3:63][ref1], [3:64][ref2] en
      [3:65 van de wet][ref3] is van toepassing op beleggingsondernemingen als bedoeld in die artikelen, indien zij
      beleggingsdiensten verlenen als bedoeld in onderdeel e van de definitie van verlenen van een beleggingsdienst in
      [artikel 1:1 van de wet][ref4] of beleggingsactiviteiten verrichten als bedoeld in onderdeel a van de definitie van
      verrichten van een beleggingsactiviteit in artikel 1:1 van de wet.

      2 Aan het vereiste, bedoeld in het eerste lid, is voldaan indien de beleggingsonderneming voldoet aan de
      liquiditeitsvereisten ingevolge deel 6 van de verordening kapitaalvereisten, dat van overeenkomstige toepassing is
      op beleggingsondernemingen als bedoeld in [artikel 3:65 van de wet][ref5] waarop het eerste lid van toepassing is.


