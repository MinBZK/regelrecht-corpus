  - number: 37a
    text: |-
      1 Een afwikkelonderneming waaraan de Nederlandsche Bank een vergunning heeft verleend voor het uitoefenen van het
      bedrijf van afwikkelonderneming geeft aan de Nederlandsche Bank schriftelijk kennis van het voornemen tot:

      a. een wijziging of het doen ontstaan van een verbinding met een andere afwikkelonderneming;

      b. een wijziging van de contractuele algemene voorwaarden van de afwikkelonderneming;

      c. een substantiële wijziging in de bedrijfsvoering;

      d. een substantiële wijziging in het risicomanagement, voor zover ten aanzien daarvan nadere regels krachtens
      [artikel 17b][ref1] zijn gesteld;

      e. een handeling van de afwikkelonderneming die zal leiden tot een substantiële wijziging van de balans van de
      afwikkelonderneming.

      2 Met betrekking tot het voornemen overlegt de afwikkelonderneming:

      a. een beschrijving van de voorgenomen wijziging, bedoeld in het eerste lid;

      b. gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of wordt voldaan aan hetgeen in
      [artikel 3:17 van de wet][ref2] wordt bepaald met betrekking tot de beheerste uitoefening van het bedrijf.

      3 De financiële onderneming geeft geen uitvoering aan het voornemen voordat de Nederlandsche Bank heeft ingestemd
      met de wijziging. De Nederlandsche Bank neemt een besluit omtrent instemming:

      a. binnen zes weken na ontvangst van de kennisgeving;

      b. indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van de
      kennisgeving; of

      c. indien de Nederlandsche Bank de Autoriteit Financiële Markten om advies heeft gevraagd, binnen vier weken na
      ontvangst van dat advies.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel317
