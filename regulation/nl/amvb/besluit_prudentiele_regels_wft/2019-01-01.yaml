  - number: '35'
    text: |-
      1 Een afwikkelonderneming, betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar of wisselinstelling als bedoeld in [artikel 33, eerste lid][ref1], geeft
      schriftelijk kennis aan de Nederlandsche Bank van een wijziging in:

      a. de naam of het adres van de financiële onderneming;

      b. de rechtsvorm van de financiële onderneming;

      c. indien van toepassing, de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. indien van toepassing, het nummer van inschrijving in het handelsregister;

      e. indien van toepassing, de statuten van de financiële onderneming;

      f. de zeggenschapsstructuur binnen de financiële onderneming; en

      g. indien van toepassing, het adres van een in een andere staat gelegen bijkantoor.

      2 De financiële onderneming geeft van een wijziging als bedoeld in het eerste lid kennis binnen twee weken nadat de
      wijziging zich heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel33
