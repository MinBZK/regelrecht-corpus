  - number: '131'
    text: |-
      1 De Nederlandsche Bank stelt, met inachtneming van het bepaalde ingevolge het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref1], alsmede met inachtneming van
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2] en de internationale jaarrekeningstandaarden, regels met
      betrekking tot de staten, bedoeld in [artikel 130][ref3]. Deze omvatten uitsluitend:

      a. de modellen van de staten;

      b. de reikwijdte van toepassing van de staten en de mate van detaillering van de in te vullen gegevens; deze
      omvatten geen uitbreiding of nadere rubricering van de staten;

      c. de reikwijdte van de consolidatie overeenkomstig de regels met betrekking tot consolidatie die de financiële
      onderneming in haar jaarrekening toepast, voor zover uit de wet niet anders voortvloeit;

      d. de waardering van de posten overeenkomstig [artikel 3:69a van de wet][ref4] en [artikel 4, derde lid][ref5];

      e. de te hanteren valuta en rekeneenheid;

      f. de afronding;

      g. de termijn waarbinnen de staten worden verstrekt, met dien verstande dat deze niet
      korter is dan noodzakelijk voor de uitoefening van het toezicht op de naleving van het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref6] en ten behoeve van de uitvoering van de bij
      of krachtens dat deel gestelde regels met betrekking tot het depositogarantiestelsel; en

      h. de frequentie waarmee de staten worden verstrekt, met dien verstande dat deze ten minste een maal per jaar is.

      2 De regels, bedoeld in het eerste lid, onderdelen b, f, g en h, zijn afgestemd op de aard en de omvang van de
      financiële onderneming, alsmede op de omvang van de solvabiliteit van de financiële onderneming. De frequentie,
      bedoeld in het eerste lid, onderdeel h, is evenwel niet hoger dan:

      a. twaalf maal per jaar voor de staten ten behoeve van het toezicht op de liquiditeit, bedoeld in
      [artikel 130, eerste lid, onderdeel c en zesde lid][ref7];

      b. een maal per jaar voor de jaarrekening, bedoeld in [artikel 130, vierde lid, onderdeel a][ref8], en de staten
      ten behoeve van het toezicht op de technische voorzieningen, bedoeld in artikel 130, vierde, onderdeel b, onder
      2°; en

      c. vier maal per jaar voor de overige in [artikel 130, eerste en vierde lid][ref9], genoemde staten;

      d. twee maal per jaar voor de in [artikel 130, vijfde lid][ref10], genoemde staten;

      e. een maal per jaar voor de jaarrekening, bedoeld in [artikel 130, zevende lid, onderdeel a][ref11];

      f. vier maal per jaar voor de in [artikel 130, zevende lid, onderdeel b][ref12], genoemde staten;

      g. twee maal per jaar voor de in [artikel 130, achtste lid][ref13], genoemde staten;

      h. tweemaal per jaar voor de in [artikel 130, tiende lid][ref14], genoemde staten.

      3 De Nederlandsche Bank kan in individuele gevallen besluiten dat een financiële onderneming als bedoeld
      in [artikel 130][ref15] periodiek moet melden of haar solvabiliteit of liquiditeit zich boven een door de
      Nederlandsche Bank vastgestelde signaleringswaarde bevindt. De frequentie van de melding is niet hoger dan een
      maal per maand en is afgestemd op de aard en de omvang van de financiële onderneming, alsmede op de omvang van de
      solvabiliteit van de financiële onderneming.

      4 Een beleggingsonderneming als bedoeld in [artikel 48, eerste lid, onderdeel j][ref16], doet de melding, bedoeld
      in het derde lid, met redenen omkleed aan de Nederlandsche Bank in elke maand waarin zij niet ingevolge het tweede
      lid, onderdeel c, staten verstrekt. Zij meldt daarbij in ieder geval wat de waarde van haar toetsingsvermogen is,
      hoe deze waarde is berekend en hoe deze waarde zich verhoudt tot de waarde van haar toetsingsvermogen zoals vermeld
      in de laatst verstrekte staten.

      5 De Nederlandsche Bank kan, met inachtneming van artikel 35, zesde tot en met achtste lid, van de richtlijn
      solvabiliteit II, ontheffing verlenen van:

      a. de verplichting periodieke rapportagestaten vaker dan eenmaal per jaar te verstrekken;

      b. itemgewijze rapportageverplichtingen.


