  - number: '59'
    text: |-
      1 De solvabiliteit van een beheerder van een beleggingsinstelling, beheerder van een icbe,
      betaalinstelling, elektronischgeldinstelling, kredietunie of premiepensioeninstelling als bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref1] is voldoende, indien het aanwezige in aanmerking komende
      toetsingsvermogen van de onderneming ten minste gelijk is aan de minimum omvang van het toetsingsvermogen, berekend
      overeenkomstig de [artikelen 60a][ref2], [61][ref3], [63][ref4], [63a][ref5], [63b][ref6] en [64][ref7].

      2 De solvabiliteit van een verzekeraar als bedoeld in [artikel 3:57, eerste lid][ref8],
      [3:58, eerste of tweede lid][ref9], of [3:61, eerste of tweede lid][ref10], of van een bijkantoor als bedoeld
      in [artikel 3:59, eerste lid][ref11], of [3:62, eerste lid, van de wet][ref12] is voldoende indien het eigen
      vermogen, bedoeld in [artikel 70][ref13], ten minste gelijk is aan het solvabiliteitskapitaalvereiste, berekend
      overeenkomstig, al naar gelang van toepassing, [artikel 65][ref14], [66][ref15] of [68][ref16].

      3 De solvabiliteit van een bank of beleggingsonderneming als bedoeld in [artikel 3:57, eerste lid][ref17], of
      [3:58, eerste lid, van de wet][ref18], is voldoende, indien het aanwezige toetsingsvermogen van de onderneming
      voldoet aan de op de bank of beleggingsonderneming van toepassing zijnde kapitaaleisen uit deel 3 van de
      verordening kapitaalvereisten.

      4 De solvabiliteit van een clearinginstelling als bedoeld in [artikel 3:57, eerste lid][ref19], of
      [3:61, eerste lid, van de wet][ref20] is voldoende, indien de omvang van het aanwezige toetsingsvermogen ten minste
      gelijk is aan de minimumomvang van het toetsingsvermogen voor een bank, berekend overeenkomstig deel 3 van de
      verordening kapitaalvereisten.

      5 Onverminderd het eerste tot en met vierde lid is de omvang van het aanwezige toetsingsvermogen, bedoeld in het
      eerste, derde en vierde lid, onderscheidenlijk het eigen vermogen, bedoeld in het tweede lid, ten minste gelijk aan
      het ingevolge [artikel 48][ref21] voorgeschreven minimumbedrag aan eigen vermogen, onderscheidenlijk het ingevolge
      [artikel 49][ref22], [49a][ref23] of [49b][ref24] voorgeschreven minimumkapitaalvereiste.

      6 Voor de toepassing van het eerste lid:

      1°. wordt het tier 1-kernkapitaal als bedoeld in artikel 50 van de verordening kapitaalvereisten volledig voor de
      berekening van het aanwezige toetsingsvermogen in aanmerking genomen;

      2°. wordt het aanvullend tier 1-kapitaal als bedoeld in artikel 61 van de verordening kapitaalvereisten voor de
      berekening van het aanwezige toetsingsvermogen slechts in aanmerking genomen voor zover het niet meer bedraagt dan
      een derde van het tier 1-kernkapitaal;

      3°. wordt het tier 2-kapitaal als bedoeld in artikel 71 van de verordening kapitaalvereisten voor de berekening van
      het aanwezige toetsingsvermogen slechts in aanmerking genomen voor zover het niet meer bedraagt dan een derde van
      het tier 1-kapitaal; en

      4°. mag, indien wordt voldaan aan de onderdelen 2° en 3°, het tier 2-kapitaal worden gesubstitueerd door aanvullend
      tier 1-kapitaal.

      7 De solvabiliteit van een beheerder van een beleggingsinstelling of een beheerder van een icbe die tevens
      een beleggingsdienst verleent op grond van [artikel 2:67a, tweede lid, van de wet][ref25], respectievelijk
      [artikel 2:69c, tweede lid, van de wet][ref26] is voldoende, indien het aanwezige toetsingsvermogen van de
      onderneming voldoet aan de op een beleggingsonderneming van toepassing zijnde kapitaaleisen van deel 3 van
      de verordening kapitaalvereisten, met dien verstande dat het toetsingsvermogen ten minste gelijk is aan het
      toetsingsvermogen berekent overeenkomstig het eerste lid.


