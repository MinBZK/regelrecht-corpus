  - number: 40c
    text: |-
      Betaalinstellingen of elektronischgeldinstellingen verlenen slechts krediet in verband met de in de punten 4, 5 en
      7 van de bijlage bij de richtlijn betaaldiensten bedoelde betaaldiensten indien:

      a. het krediet een aanvullend krediet is en uitsluitend wordt verstrekt in verband met de uitvoering van een
      betalingstransactie;

      b. het krediet dat is verstrekt in verband met een betaaldienst die is verleend door middel van dienstverrichting
      naar een andere lidstaat of vanuit een bijkantoor in een andere lidstaat wordt terugbetaald binnen een korte
      termijn, die in geen geval meer dan twaalf maanden bedraagt;

      c. het niet wordt verleend uit geldmiddelen die zijn ontvangen of die worden aangehouden voor het uitvoeren van
      toekomstige betalingstransacties; en

      d. het eigen vermogen van de betaalinstelling of de elektronischgeldinstelling te allen tijde in redelijke
      verhouding staat tot het totale bedrag van het verleende krediet.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel40c
  - number: 40d
    text: |-
      1 Een bank die een geregistreerde gedekte obligatie uitgeeft, draagt er zorg voor dat de dekkingsactiva van de
      categorie waartoe die obligatie behoort, worden veiliggesteld:

      a. door overgang onder algemene of bijzondere titel naar een andere rechtspersoon; of

      b. op een andere, bij ministeriële regeling vast te stellen wijze.

      2 Een bank voldoet uitsluitend aan het eerste lid, onderdeel a, indien:

      a. de rechtspersoon, bedoeld in het eerste lid, onderdeel a, met uitsluiting van andere activiteiten, is opgericht
      om de dekkingsactiva van een categorie geregistreerde gedekte obligaties te scheiden van het vermogen van die
      bank en hetgeen te doen dat noodzakelijk of wenselijk is voor de desbetreffende categorie geregistreerde gedekte
      obligaties; en

      b. zij, alsmede de rechtspersonen die tot dezelfde groep behoren, geen aandelen houden in de rechtspersoon, bedoeld
      in het eerste lid, onderdeel a, daarin geen beleidsbepalende zeggenschap hebben en daarin ook niet op andere wijze
      een eigendomsbelang hebben.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel40d
  - number: 40e
    text: |-
      1 Bij een verzoek tot registratie van een categorie geregistreerde gedekte obligaties overeenkomstig
      [artikel 3:33a, eerste lid, van de wet][ref1], geeft de verzoekende bank aan de Nederlandsche Bank op welke
      voorwaarden op die categorie geregistreerde gedekte obligaties van toepassing zijn, waaronder in ieder geval:

      a. welke van de volgende aflossingsstructuren wordt gehanteerd:

      1°. de aflossingsdatum kan niet of met maximaal vierentwintig maanden worden uitgesteld; of

      2°. de aflossingsdatum kan met meer dan vierentwintig maanden worden uitgesteld;

      b. welke soort of soorten dekkingsactiva primair worden gehanteerd en, in dat laatste geval, in welke verhouding;
      en

      c. in welk land de debiteuren van de dekkingsactiva zijn gevestigd, respectievelijk hun zetel of woonplaats hebben
      en door welk recht de dekkingsactiva worden beheerst.

      2 Een bank die een geregistreerde gedekte obligatie uitgeeft, draagt er zorg voor dat die obligatie gedurende de
      gehele looptijd ten aanzien van de voorwaarden genoemd in het eerste lid, onderdelen a tot en met c, blijft voldoen
      aan de bij het verzoek tot registratie opgegeven voorwaarden.

      3 De verzoekende bank hanteert één van de volgende soorten dekkingsactiva primair als dekkingsactiva overeenkomstig
      het eerste lid, onderdeel b:

      a. blootstellingen, bedoeld in artikel 129, eerste lid, onderdeel a en onderdeel b, van de verordening
      kapitaalvereisten, voor laatstgenoemd onderdeel met uitzondering van blootstellingen welke in aanmerking komen voor
      kredietkwaliteitscategorie 2 als bedoeld in dat onderdeel;

      b. leningen die gedekt zijn door niet-zakelijk onroerend goed of woonkredieten, bedoeld in artikel 129, eerste lid,
      onderdeel d onder i, respectievelijk onderdeel e, van de verordening kapitaalvereisten;

      c. leningen die gedekt zijn door zakelijk onroerend goed, bedoeld in artikel 129, eerste lid, onderdeel f onder i,
      van de verordening kapitaalvereisten;

      d. leningen die gedekt zijn door pandrechten op schepen als bedoeld in artikel 129, eerste lid, onderdeel g, van de
      verordening kapitaalvereisten; of

      e. andere bij ministeriële regeling aan te wijzen activa.

      4 In afwijking van het derde lid kan een bank die een geregistreerde gedekte obligatie uitgeeft, een combinatie
      hanteren van leningen of woonkredieten als bedoeld in onderdelen b en c van het derde lid, mits zij zich hierbij
      vastlegt op een vaste verhouding tussen deze soorten dekkingsactiva.

      5 Een bank die een geregistreerde gedekte obligatie uitgeeft, draagt er zorg voor dat daarop geen voorwaarden
      van toepassing zijn die in de weg staan aan het uitoefenen van effectief toezicht op die geregistreerde gedekte
      obligatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel333a
