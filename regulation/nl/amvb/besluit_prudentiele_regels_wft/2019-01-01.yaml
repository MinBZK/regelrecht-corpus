    text: |-
      De Nederlandsche Bank kan ter uitvoering van internationaal aanvaarde standaarden nadere regels stellen met
      betrekking tot de solvabiliteit van afwikkelondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel59a
  - number: 60a
    text: |-
      1 De minimumomvang van het toetsingsvermogen van een betaalinstelling wordt berekend met toepassing van met de
      Nederlandsche Bank overeengekomen methode A, B of C, genoemd in [bijlage B][ref1] bij dit besluit.

      2 In afwijking van het eerste lid kan de Nederlandsche Bank indien een evaluatie van de risicobeheersingsprocessen,
      het verzamelen en vastleggen van risicoverliesgegevens en het interne controlesysteem en het
      bedrijfscontinuïteitsbeheer van de betaalinstelling daartoe aanleiding geeft, de betaalinstelling verplichten een
      toetsingsvermogen aan te houden dat ten hoogste 20% hoger is dan het bedrag dat het resultaat is van de toepassing
      van een uit [bijlage B][ref2] gekozen methode, of de betaalinstelling toestaan een toetsingsvermogen aan te houden
      dat ten hoogste 20% lager is dan het bedrag dat het resultaat is van de uit [bijlage B][ref3] gekozen methode.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
