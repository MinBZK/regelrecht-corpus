        artikel: 3:288i1
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '26.5'
        hoofdstuk: '4'
        paragraaf: 4.3a
  - number: '26.7'
    text: |-
      De inrichting van de bedrijfsvoering van een verzekeraar als bedoeld in [artikel 26.5, eerste lid][ref1], of van
      een verzekeraar dan wel holding als bedoeld in [artikel 26.6, eerste lid][ref2], waarborgt dat elke maatregel
      bedoeld in artikel 26.5, vierde lid, onderdeel a, zonder wezenlijke belemmeringen ten uitvoer kan worden gelegd, in
      ieder geval met betrekking tot:

      a. aanpassingen in het risicoprofiel van de verzekeraar;

      b. de mogelijkheden tot tijdige herkapitalisatie;

      c. aanpassingen in de strategie en bedrijfsvoering; en

      d. de financieringsstrategie, teneinde de weerbaarheid van de bedrijfsonderdelen te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel26.5
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel26.6
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel26.7
