  - number: 63b
    text: |-
      1 In aanvulling op het op grond van de [artikelen 48, eerste lid, onderdelen c en e][ref1], vereiste
      minimumbedrag aan eigen vermogen en het op grond van [artikel 63][ref2] vereiste toetsingsvermogen, beschikt
      een beleggingsmaatschappij die geen aparte beheerder heeft, of een beheerder van een beleggingsinstelling,
      over een bijkomend toetsingsvermogen of een beroepsaansprakelijkheidsverzekering ter dekking van mogelijke
      beroepsaansprakelijkheidsrisico’s in overeenstemming met artikel 9, zevende en negende lid, van de richtlijn
      beheerders van alternatieve beleggingsinstellingen.

      2 Het eigen vermogen, toetsingsvermogen en het bijkomend toetsingsvermogen als bedoeld in het eerste lid
      wordt belegd in overeenstemming met artikel 9, achtste lid, van de richtlijn beheerders van alternatieve
      beleggingsinstellingen.


