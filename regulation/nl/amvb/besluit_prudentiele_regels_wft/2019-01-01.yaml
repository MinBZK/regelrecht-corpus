  - number: 40f
    text: |-
      1 Een bank die een geregistreerde gedekte obligatie uitgeeft, draagt er zorg voor dat de totale waarde van de
      dekkingsactiva van de categorie waartoe die obligatie behoort, minimaal 105% bedraagt van het nominale bedrag van
      de geregistreerde gedekte obligaties die onder de desbetreffende categorie uitstaan.

      2 In aanvulling op het eerste lid, draagt een bank die een geregistreerde gedekte obligatie uitgeeft, er zorg
      voor dat de waarde van de dekkingsactiva, berekend met inachtneming van de restricties, bedoeld in artikel 129,
      eerste lid onderdeel d, onder i, e, f onder i, en g, van de verordening kapitaalvereisten, voor zover toepasbaar
      op de soort gehanteerde dekkingsactiva, ten minste gelijk is aan het nominale bedrag van de geregistreerde gedekte
      obligaties die onder de desbetreffende categorie uitstaan.

      3 Een bank die een geregistreerde gedekte obligatie uitgeeft, kan bij het voldoen aan de verplichting, bedoeld
      in het eerste en tweede lid, dekkingsactiva hanteren die niet overeenkomstig artikel 40e, eerste lid, onderdeel
      b, zijn opgegeven als dekkingsactiva die primair worden gehanteerd, voor zover de dekkingsactiva bestaan uit de
      volgende soorten:

      a. blootstellingen als bedoeld in artikel 129, eerste lid, onderdeel a, van de verordening kapitaalvereisten;

      b. blootstellingen als bedoeld in artikel 129, eerste lid, onderdeel b, van de verordening kapitaalvereisten;

      c. blootstellingen als bedoeld in artikel 129, eerste lid, onderdeel c, van de verordening kapitaalvereisten; of

      d. blootstellingen ten aanzien waarvan de Nederlandsche Bank ontheffing heeft verleend als bedoeld in artikel 129,
      eerste lid, derde alinea, van de verordening kapitaalvereisten.

      4 Bij hantering van dekkingsactiva op grond van het derde lid, gelden de volgende maxima:

      a. voor die dekkingsactiva gezamenlijk: 20% van het nominale bedrag van de geregistreerde gedekte obligaties die
      onder de desbetreffende categorie uitstaan; en

      b. voor de afzonderlijke soorten als bedoeld in de onderdelen a tot en met d van het derde lid: de maxima voor
      dekkingsactiva van een bepaalde soort van artikel 129, eerste lid, onderdelen a tot en met c en derde alinea, van
      de verordening kapitaalvereisten.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel40f
  - number: 40g
    text: |-
      1 Een bank die een geregistreerde gedekte obligatie uitgeeft, draagt er zorg voor dat de rechtspersoon die
      rechthebbende is van de dekkingsactiva, voor de categorie waartoe die obligatie behoort, te allen tijde voldoende
      liquide activa aanhoudt of genereert door middel van dekkingsactiva om de volgende zes maanden te kunnen voldoen
      aan:

      a. haar verplichting tot tijdige betaling van de over de uitstaande geregistreerde gedekte obligaties verschuldigde
      rente;

      b. haar verplichting tot betaling van de aflossing over de uitstaande geregistreerde gedekte obligaties; en

      c. andere bij ministeriële regeling vast te stellen verplichtingen.

      2 De verplichting op grond van het eerste lid, onderdeel b, geldt niet indien de rechtspersoon die rechthebbende is
      van de dekkingsactiva, op grond van de op die obligatie toepasselijke voorwaarden gerechtigd is om betaling van de
      aflossing met minimaal zes maanden uit te stellen ten opzichte van de oorspronkelijke aflossingsdatum.

      3 Bij berekening van de hoogte van de verplichtingen waarvoor een bank die een geregistreerde gedekte obligatie
      uitgeeft, liquide activa moet aanhouden of doen aanhouden, dan wel genereren of doen genereren, op grond van
      het eerste lid, worden verwachte kasstromen uit derivatencontracten en andere risicomitigatie-instrumenten ter
      afdekking van die verplichtingen in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel40g
  - number: 40h
    text: |-
      Een bank die een geregistreerde gedekte obligatie uitgeeft, voorziet in betrouwbare en doeltreffende strategieën en
      procedures aan de hand waarvan zij gedurende de looptijd van de geregistreerde gedekte obligatie voortdurend nagaat
      of, en er zorg voor draagt dat, er voldoende dekkingsactiva en liquide activa met de juiste eigenschappen zijn
      veiliggesteld, rekening houdend met de aard en samenstelling van de dekkingsactiva en liquide activa, het minimale
      bedrag aan dekkingsactiva, bedoeld in [artikel 40f, eerste en tweede lid][ref1], en liquide activa, bedoeld in
      [artikel 40g, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40f
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel40g
