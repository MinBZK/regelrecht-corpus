  - number: 23a
    text: |-
      Het beleid en de procedures en maatregelen, bedoeld in [artikel 23, eerste en derde tot en met vijfde lid][ref1],
      van een bank, een beleggingsonderneming in de zin van de verordening kapitaalvereisten of een clearinginstelling
      voldoen aan de op de betrokken onderneming van toepassing zijnde technische criteria voor de organisatie en
      behandeling van risico’s in de artikelen 79 tot en met 87 van de richtlijn kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel23a
