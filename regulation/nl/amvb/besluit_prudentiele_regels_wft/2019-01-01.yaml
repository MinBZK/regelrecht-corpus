  - number: '130'
    text: |-
      1 De door een bank of beleggingsonderneming als bedoeld in [artikel 3:72, eerste lid][ref1], of
      [3:82, eerste lid, van de wet][ref2] of door een clearinginstelling als bedoeld in artikel 3:72, eerste lid, of
      [3:86, eerste lid, van de wet][ref3] te verstrekken staten omvatten uitsluitend:

      a. gegevens betreffende het eigen vermogen en financiële informatie als bedoeld in de artikelen 99 tot en met 101
      van de verordening kapitaalvereisten;

      b. gegevens betreffende het aanhouden van balansposten en posten buiten de balanstelling, bedoeld in artikel 394
      van de verordening kapitaalvereisten;

      c. gegevens betreffende de liquiditeit en informatie als bedoeld in de artikelen 412 tot en met 428 van de
      verordening kapitaalvereisten;

      d. gegevens ten behoeve van het depositogarantiestelsel, bedoeld in [artikel 3:259, tweede lid, van de wet][ref4],
      betreffende de aangehouden deposito’s die worden gegarandeerd uit hoofde van het depositogarantiestelsel.

      2 De door een entiteit voor risico-acceptatie als bedoeld in [artikel 3:72, derde lid, van de wet][ref5] te
      verstrekken staten omvatten uitsluitend de gegevens, bedoeld in artikel 325 van de verordening solvabiliteit II.

      3 De door een verzekeraar als bedoeld in [artikel 3:72, derde lid, van de wet][ref6], niet zijnde een verzekeraar
      met beperkte risico-omvang, bijkantoor als bedoeld in [artikel 3:82, tweede lid, van de wet][ref7], of bijkantoor
      van een herverzekeraar als bedoeld in [artikel 3:86, tweede lid][ref8], te verstrekken staten omvatten uitsluitend:

      a. de gegevens, bedoeld in titel I, hoofdstuk XIII, afdeling 1, van de verordening solvabiliteit II;

      b. andere voor toezichtdoeleinden benodigde periodieke informatie als bedoeld in artikel 35, eerste lid, van de
      richtlijn solvabiliteit II.

      4 De door een verzekeraar als bedoeld in [artikel 3:72, derde lid, van de wet][ref9] met beperkte risico-omvang of
      bijkantoor als bedoeld in [artikel 3:86, tweede lid, van de wet][ref10] van een verzekeraar met beperkte risico-
      omvang te verstrekken staten omvatten uitsluitend:

      a. een jaarrekening alsmede aanvullende financiële gegevens ten behoeve van het toezicht op de naleving van het
      Deel Prudentieel toezicht financiële ondernemingen van de wet;

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:

      1°. de solvabiliteit ingevolge [artikel 3:57, eerste lid][ref11], [3:61, eerste of tweede lid][ref12], of
      [3:62 van de wet][ref13]; en

      2°. de technische voorzieningen ingevolge [artikel 3:67][ref14], [3:69][ref15] of [3:73 van de wet][ref16].

      5 De door een betaalinstelling of elektronischgeldinstelling als bedoeld in
      [artikel 3:72, eerste lid, van de wet][ref17] te verstrekken staten omvatten uitsluitend:

      a. balans- en resultatengegevens alsmede aanvullende financiële gegevens ten behoeve van het toezicht op de
      naleving van het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref18];

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot de solvabiliteit
      ingevolge [artikel 3:57, eerste lid, van de wet][ref19];

      c. voor zover van toepassing een opgave van het gemiddeld uitstaand elektronisch geld.

      6 De door een bank als bedoeld in [artikel 3:77 van de wet][ref20] met betrekking tot het bijkantoor te verstrekken
      staten omvatten uitsluitend de gegevens, bedoeld in het eerste lid, onderdelen c en d, ten behoeve van de
      doeleinden, genoemd in artikel 40 van de richtlijn kapitaalvereisten.

      7 De door een premiepensioeninstelling als bedoeld in [artikel 3:72, eerste lid, van de wet][ref21] te verstrekken
      staten omvatten uitsluitend:

      a. een jaarrekening alsmede aanvullende financiële gegevens ten behoeve van het toezicht op de naleving van het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref22];

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:

      1°. het bedrag aan eigen vermogen ingevolge [artikel 3:53 van de wet][ref23];

      2°. de solvabiliteit ingevolge [artikel 3:57 van de wet][ref24];

      3°. het beleggingsbeleid ingevolge [artikel 3:267b van de wet][ref25];

      4°. informatie inzake de uitgevoerde pensioenregelingen.

      8 De door een beheerder als bedoeld in [artikel 3:72, eerste lid, van de wet][ref26] te verstrekken staten
      bevatten uitsluitend balans- en resultaatgegevens ten behoeve van het toezicht op de naleving van de regels
      met betrekking tot het bedrag aan eigen vermogen ingevolge [artikel 3:53][ref27] en de solvabiliteit ingevolge
      [artikel 3:57, van de wet][ref28].

      9 De door een afwikkelonderneming als bedoeld in [artikel 3:72, eerste lid, van de wet][ref29] te verstrekken
      staten omvatten uitsluitend:

      a. balans- en resultatengegevens alsmede aanvullende gegevens ten behoeve van toezicht op de naleving van het Deel
      Prudentieel toezicht financiële ondernemingen van de wet;

      b. gegevens met betrekking tot de verrichte girale betalingstransacties, bedoeld in de [artikelen 2:3.0c][ref30],
      [2:3.0h][ref31] of [2:3.0m van de wet][ref32].

      10 De door een kredietunie als bedoeld in [artikel 3:72, eerste lid, van de wet][ref33] te verstrekken staten
      omvatten uitsluitend:

      a. balans- en resultatengegevens en aanvullende gegevens ten behoeve van het toezicht op de naleving van het
      [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref34];

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:

      1°. het bedrag aan eigen vermogen ingevolge [artikel 3:53, eerste lid, van de wet][ref35];

      2°. de solvabiliteit ingevolge [artikel 3:57, eerste lid, van de wet][ref36];

      3°. de liquiditeit ingevolge [artikel 3:63, eerste lid, van de wet][ref37].


