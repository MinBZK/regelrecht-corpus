      1 Onverminderd artikel 77 van de verordening kapitaalvereisten kan een bank of beleggingsonderneming als bedoeld in
      [artikel 3:62b, tweede lid, van de wet][ref1], in afwijking van dat artikel de bedoelde uitkeringen, toekenningen
      of betalingen doen, ter grootte van ten hoogste het maximaal uitkeerbare bedrag, berekend overeenkomstig artikel
      141, vierde lid, van de richtlijn kapitaalvereisten. [Artikel 4][ref2] is van overeenkomstige toepassing.

      2 Van het voornemen tot het doen van een uitkering, toekenning of betaling als bedoeld in het eerste lid geeft de
      betrokken onderneming kennis aan de Nederlandsche Bank, onder overlegging van de gegevens, bedoeld in artikel 141,
