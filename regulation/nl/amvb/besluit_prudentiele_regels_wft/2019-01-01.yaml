  - number: 23i
    text: |-
      Een bank of een beleggingsonderneming in de zin van de verordening kapitaalvereisten als bedoeld in
      [artikel 23, eerste lid][ref1], beschikt over passende procedures die haar werknemers in staat stellen om door hen
      geconstateerde mogelijke of feitelijke overtredingen van de verordening kapitaalvereisten of het bij of krachtens
      het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref2] bepaalde intern te melden. Deze
      procedures voldoen aan de vereisten in artikel 71, tweede lid, onderdelen b, c en d, en derde lid, van de richtlijn
      kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
