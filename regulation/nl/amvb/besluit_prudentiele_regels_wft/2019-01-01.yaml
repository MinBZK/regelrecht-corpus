  - number: 105b
    text: |-
      1 De contracyclische kapitaalbuffer, bedoeld in [artikel 105, eerste lid, onderdeel b][ref1], is gelijk
      aan het overeenkomstig artikel 140 van de richtlijn kapitaalvereisten berekende gewogen gemiddelde van de
      contracyclischebufferpercentages die de betrokken bank of beleggingsonderneming dient toe te passen voor elke staat
      waar de relevante kredietblootstellingen van de onderneming gelegen zijn.

      2 De Nederlandsche Bank stelt elk kwartaal het contracyclischebufferpercentage vast voor in Nederland gelegen
      kredietblootstellingen, met inachtneming van artikel 136, tweede tot en met zesde lid, van de richtlijn
      kapitaalvereisten.

      3 Ten aanzien van kredietblootstellingen, gelegen in een andere lidstaat of een staat die geen lidstaat is, past
      de bank of beleggingsonderneming het contracyclischebufferpercentage toe dat door de ingevolge artikel 136, eerste
      lid, van de richtlijn kapitaalvereisten aangewezen autoriteit van de betrokken lidstaat of staat is vastgesteld.
      Indien in plaats of in afwijking daarvan door de Nederlandsche Bank een percentage is vastgesteld overeenkomstig
      artikel 139, tweede of derde lid, van de richtlijn kapitaalvereisten of dat voortvloeit uit de toepassing van de
      artikelen 137, eerste lid, en 140, tweede en derde lid van de richtlijn, past de bank of beleggingsonderneming dat
      percentage toe.

      4 De Nederlandsche Bank maakt de door een bank of beleggingsonderneming ingevolge het tweede en derde lid toe te
      passen contracyclischebufferpercentages bekend door publicatie op haar website, met inachtneming van de artikelen
      136, zevende lid, 137, tweede lid, en 139, vijfde lid, van de richtlijn kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel105
