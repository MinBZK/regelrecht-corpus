  - number: '19'
    text: |-
      1 De bedrijfsvoering van een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit
      voor risico-acceptatie, bank, kredietunie, premiepensioeninstelling, verzekeraar met beperkte risico-omvang,
      wisselinstelling of bijkantoor als bedoeld in [artikel 17][ref1] voorziet in een juiste, tijdige en volledige
      vastlegging van alle rechten en verplichtingen van de financiële onderneming of bijkantoor in een daartoe bestemde
      administratie.

      2 De administratie, bedoeld in het eerste lid, van een premiepensioeninstelling is zodanig dat deze geen
      belemmering vormt of kan vormen voor de toepassing van het in [artikel 4:71a van de wet][ref2] bepaalde.

      3 Een verzekeraar met beperkte risico-omvang beschikt over een organisatie-onderdeel dat op onafhankelijke en
      effectieve wijze een actuariële functie uitoefent. Het organisatie-onderdeel heeft als taak de berekening van
      de technische voorzieningen te coördineren en te controleren en de personen die het dagelijks beleid van de
      verzekeraar bepalen te informeren over de adequaatheid en betrouwbaarheid van die berekening.

      4 Het derde lid is op schadeverzekeraars alleen van toepassing voor zover deze verzekeringsovereenkomsten sluiten
      met een contractduur van meer dan vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel471a
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel19
