  - number: '48'
    text: |-
      1 Het minimumbedrag aan eigen vermogen, bedoeld in [artikel 3:53, eerste lid, van de wet][ref1] bedraagt:

      a. € 5 miljoen voor een bank als bedoeld in [artikel 3:53, eerste lid][ref2], of
      [3:54, eerste lid, van de wet][ref3] die geen bank als bedoeld in onderdeel b is, of voor een clearinginstelling
      als bedoeld in [artikel 3:53, eerste lid][ref4], of [3:55, eerste lid, van de wet][ref5];

      b. € 2,5 miljoen voor een bank als bedoeld in [artikel 2:13 van de wet][ref6] die in hoofdzaak haar bedrijf maakt
      van het verlenen van beleggingsdiensten of het verrichten van beleggingsactiviteiten;

      c. € 125.000 voor een beheerder van een beleggingsinstelling als bedoeld in
      [artikel 3:53, eerste lid van de wet][ref7];

      d. € 125.000 voor een beheerder van een icbe als bedoeld in [artikel 3:53, eerste lid, van de wet][ref8];

      e. € 300.000 voor een beleggingsmaatschappij of een maatschappij voor collectieve belegging in effecten als bedoeld
      in [artikel 3:53, eerste lid, van de wet][ref9] die geen aparte beheerder hebben;

      f. € 35.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref10], of
      [3:54, eerste lid, van de wet][ref11] die uitsluitend de beleggingsdienst, bedoeld in onderdeel a van de definitie
      van verlenen van een beleggingsdienst in [artikel 1:1 van de wet][ref12], verleent en die deze beleggingsdienst
      niet vanuit een bijkantoor in een andere lidstaat of door middel van het verrichten van diensten naar een andere
      lidstaat mag verlenen;

      g. € 125.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref13], of
      [3:54, eerste lid, van de wet][ref14], die niet handelt voor eigen rekening en die een of meer van de
      beleggingsdiensten, bedoeld in de onderdelen a, b en c van de definitie van verlenen van een beleggingsdienst
      in [artikel 1:1 van de wet][ref15], verleent en waaraan het op grond van haar vergunning is toegestaan gelden of
      financiële instrumenten van cliënten onder zich te houden;

      h. € 50.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref16], of
      [3:54, eerste lid, van de wet][ref17], die niet handelt voor eigen rekening en die uitsluitend een of meer van de
      beleggingsdiensten, bedoeld in de onderdelen a, b, c, d en f van de definitie van verlenen van een beleggingsdienst
      in [artikel 1:1 van de wet][ref18], verleent en waaraan het op grond van haar vergunning niet is toegestaan gelden
      of financiële instrumenten van cliënten onder zich te houden;

      i. € 50.000 voor een plaatselijke onderneming die haar werkzaamheden vanuit een bijkantoor in een andere lidstaat
      of door middel van het verrichten van diensten naar een andere lidstaat mag verrichten;

      j. € 730.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref19], of
      [3:54, eerste lid, van de wet][ref20], niet zijnde een beleggingsonderneming als bedoeld in de onderdelen f tot en
      met i;

      k. € 20.000 voor een betaalinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref21] die uitsluitend
      de in punt 6 van de bijlage bij de richtlijn betaaldiensten vermelde betaaldienst verleent;

      l. € 50.000 voor een betaalinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref22] die uitsluitend
      de in punt 7 van de richtlijn betaaldiensten vermelde betaaldienst verleent;

      m. € 125.000 voor een betaalinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref23] die een in de
      punten 1 tot en met 5 van de bijlage bij de richtlijn betaaldiensten vermelde betaaldienst verleent;

      n. € 730.000 voor een bewaarder als bedoeld in [artikel 3:53, eerste lid, van de wet][ref24] of het bedrag als
      berekend overeenkomstig artikel 315 of 317 van de verordening kapitaalvereisten indien dat bedrag hoger is;

      o. € 350.000 voor een elektronischgeldinstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref25];

      p. € 500.000 voor een premiepensioeninstelling als bedoeld in [artikel 3:53, eerste lid, van de wet][ref26];

      q. € 112.500 voor een pensioenbewaarder als bedoeld in [artikel 3:53, eerste lid, van de wet][ref27];

      r. € 1 miljoen voor een kredietunie als bedoeld in [artikel 3:53, eerste lid, van de wet][ref28].

      2 Voor de toepassing van het eerste lid, onderdelen g en h, wordt niet als handelen voor eigen rekening aangemerkt:

      a. het houden van posities in financiële instrumenten als belegging van het eigen vermogen;

      b. het tijdelijk voor eigen rekening aanhouden van posities in financiële instrumenten bij het uitvoeren van orders
      van cliënten met betrekking tot deze instrumenten, mits toegestaan door de Autoriteit Financiële Markten en onder
      de voorwaarden, bedoeld in artikel 29, tweede lid, van de richtlijn kapitaalvereisten.

      3 Het eerste lid is niet van toepassing op beleggingsondernemingen als bedoeld in
      [artikel 3:53, eerste lid][ref29], of [3:54, eerste lid, van de wet][ref30] die geen andere beleggingsdienst
      mogen verlenen dan de beleggingsdienst, bedoeld in onderdeel a of d van de definitie van verlenen van een
      beleggingsdienst in [artikel 1:1 van de wet][ref31], en geen nevendiensten als bedoeld in onderdeel a van de
      definitie van nevendienst in [artikel 1:1 van de wet][ref32] verrichten, indien zij beschikken over:

      a. een beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening die de aansprakelijkheid dekt
      van de beleggingsonderneming wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van diens beroep en
      voorgevallen op het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing
      is, voor een bedrag van ten minste € 1.120.200 per schadegeval en ten minste € 1.680.300 per jaar voor alle
      schadegevallen gezamenlijk; of

      b. een combinatie van een bedrag aan eigen vermogen als bedoeld in het eerste lid, onderdeel h, en een
      beroepsaansprakelijkheidsverzekering als bedoeld in onderdeel a die resulteert in een dekking die ten minste
      gelijkwaardig is aan € 50.000 of onderdeel a.

      4 Onverminderd het eerste lid, aanhef en onderdeel h, beschikken beleggingsondernemingen als bedoeld in het derde
      lid, waaraan een vergunning als bedoeld in [artikel 2:80][ref33] of [2:86 van de wet][ref34] is verleend, over:

      a. een minimumbedrag aan eigen vermogen van € 25.000;

      b. een beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening die hun aansprakelijkheid
      dekt wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van hun beroep en voor gevallen op het
      grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, voor een bedrag
      van ten minste € 500.000 per schadegeval en ten minste € 750.000 per jaar voor alle schadegevallen gezamenlijk; of

      c. een combinatie van een beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening als bedoeld
      in onderdeel a die resulteert in een dekking die ten minste gelijkwaardig is aan € 25.000 of onderdeel b.

      5 Voor de toepassing van het eerste lid wordt een beheerder van een beleggingsinstelling of een beheerder van
      een icbe die tevens een beleggingsdienst verleent op grond van [artikel 2:67a, tweede lid, van de wet][ref35],
      respectievelijk [artikel 2:69c, tweede lid, van de wet][ref36] gelijkgesteld met een beleggingsonderneming, met
      dien verstande dat het minimumbedrag aan eigen vermogen ten minste € 125.000 bedraagt.


