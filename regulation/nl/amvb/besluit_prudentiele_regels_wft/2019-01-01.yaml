  - number: 105c
    text: |-
      1 De Nederlandsche Bank beoordeelt of banken en beleggingsondernemingen als bedoeld in
      [artikel 3:62a, eerste lid, van de wet][ref1], alsmede Nederlandse financiële EU-moederholdings en Nederlandse
      gemengde financiële moederholdings:

      a. als mondiaal systeemrelevant worden aangemerkt, aan de hand van de criteria, bedoeld in artikel 131, tweede lid,
      van de richtlijn kapitaalvereisten; of

      b. als anderzins systeemrelevant worden aangemerkt, aan de hand van de volgende criteria:

      1°. de omvang van de onderneming;

      2°. de verwevenheid van de activiteiten, de activa, de passiva of de zeggenschap van de onderneming met andere
      financiële ondernemingen of andere partijen die hoofdzakelijk actief zijn op de financiële markten;

      3°. de mate van vervangbaarheid van de dienstverlening van de onderneming;

      4°. de belemmeringen die bestaan ten aanzien van de afwikkelbaarheid van de onderneming;

      5°. de mate waarin een gedraging van de onderneming of van een derde ten aanzien van de onderneming op de
      financiële markten kan leiden tot gedragingen van andere partijen die actief zijn op de financiële markten.

      2 De beoordeling ingevolge het eerste lid van de systeemrelevantie van een Nederlandse financiële EU-moederholding
      of Nederlandse gemengde financiële EU-moederholding vindt plaats op basis van de geconsolideerde financiële positie
      van de holding.

      3 De Nederlandsche Bank voert de beoordeling, bedoeld in het eerste lid, ten minste jaarlijks uit. Onze Minister
      kan de Nederlandsche Bank op ieder moment verzoeken een beoordeling uit te voeren.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de in het eerste lid,
      onderdeel b, bedoelde criteria. Tevens kunnen bij ministeriële regeling aanvullende criteria worden vastgesteld in
      verband met de stabiliteit van het financiële stelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel362a
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel105c
