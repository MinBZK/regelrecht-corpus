  - number: 134db
    text: |-
      Een verzekeraar als bedoeld in [artikel 134c][ref1] of [134d][ref2] behoeft tot en met 31 december 2020 de
      informatie, bedoeld in artikel 51, tweede lid, derde alinea, van de richtlijn solvabiliteit II niet afzonderlijk
      openbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel134c
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel134d
