  - number: '61'
    text: |-
      1 De minimumomvang van het toetsingsvermogen van een kredietunie bedraagt 10 procent van de totale
      risicoblootstelling, berekend overeenkomstig het tweede en derde lid.

      2 De voor de bepaling van de totale risicoblootstelling in aanmerking te nemen posten zijn:

      a. de balanswaarde van alle activa, met uitzondering van de in bijlage II van de verordening kapitaalvereisten
      opgesomde contracten en van kredietderivaten;

      b. de blootstellingswaarde van de in bijlage II van de verordening kapitaalvereisten opgesomde contracten en van
      kredietderivaten, berekend overeenkomstig artikel 429 bis van de verordening kapitaalvereisten;

      c. de opslagfactoren voor tegenpartijkredietrisico bij retrocessietransacties, transacties inzake
      verstrekte of opgenomen effecten- of grondstofleningen en transacties met afwikkeling op lange termijn en
      margeleningstransacties, berekend overeenkomstig artikel 429 ter van de verordening kapitaalvereisten; en

      d. de blootstellingswaarde van de posten buiten de balanstelling, met uitzondering van de posten, bedoeld in
      onderdeel b, berekend overeenkomstig het bepaalde in artikel 429, tiende lid, van de verordening kapitaalvereisten.

      3 De voor de bepaling van de totale risicoblootstelling uit te zonderen posten zijn:

      a. alle activa en posten buiten de balanstelling die zijn afgetrokken bij de vaststelling van het
      toetsingsvermogen;

      b. de activa, bedoeld in artikel 429, dertiende lid, van de verordening kapitaalvereisten, indien is voldaan aan de
      voorwaarden van dat lid; en

      c. activa voor zover die gedekt zijn door een garantie van de Nederlandse Staat.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel61
  - number: '63'
    text: |-
      1 De minimumomvang van het toetsingsvermogen van een beheerder van een beleggingsinstelling als bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref1], of van een beheerder van een icbe als bedoeld in artikel 3:57, eerste
      lid, van de wet bedraagt € 125.000 vermeerderd met twee honderdste procent van het bedrag waarmee de waarde van het
      beheerde vermogen het bedrag van € 250 miljoen te boven gaat. De minimumomvang van het toetsingsvermogen bedraagt
      niet meer dan € 10 miljoen.

      2 Tot het beheerde vermogen wordt gerekend het vermogen van de beleggingsinstellingen of van de icbe’s waarover
      de beheerder het beheer voert met inbegrip van de delen van het vermogen waarvan hij het beheer heeft uitbesteed,
      uitgezonderd de delen van het vermogen waarvan het beheer door derden aan hem is uitbesteed.

      3 De minimumomvang van het toetsingsvermogen van een beheerder van een beleggingsinstelling of een beheerder
      van een icbe als bedoeld in het eerste lid bedraagt ten minste 25 procent van de vaste kosten in het afgelopen
      boekjaar. Artikel 97 van de verordening kapitaalvereisten is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel357
