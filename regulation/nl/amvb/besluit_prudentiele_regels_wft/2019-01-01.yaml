  - number: '26.0'
    text: |-
      1 Een premiepensioeninstelling als bedoeld in [artikel 3:17, eerste lid, van de we][ref1]t beschikt over procedures
      en maatregelen die waarborgen dat de omvang en samenstelling van en mutaties in de aan te houden financiële
      waarborgen getrouw en volledig kunnen worden vastgesteld.

      2 Met het oog op de bewaking en beheersing van solvabiliteitsrisico’s voorziet de bedrijfsvoering van een
      premiepensioeninstelling in ieder geval in de bewaking en beheersing van de:

      a. aard en omvang van de activa en passiva;

      b. niet uit de balans blijkende verplichtingen; en

      c. resultaatontwikkeling, uitgesplitst naar de onderscheiden bedrijfsactiviteiten en bedrijfsonderdelen.

      3 De premiepensioeninstelling draagt er zorg voor dat in de procedures en maatregelen, bedoeld in
      [artikel 23, derde lid][ref2], voor de beoordeling van de kredietwaardigheid van de activa niet uitsluitend of
      mechanisch wordt uitgegaan van ratings, uitgegeven door een ratingbureau.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel317
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel26.0
