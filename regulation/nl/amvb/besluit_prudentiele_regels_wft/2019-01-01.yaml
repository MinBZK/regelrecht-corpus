        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23b
    text: |-
      1 Het bestuur van een bank, beleggingsonderneming in de zin van de verordening kapitaalvereisten of
      clearinginstelling als bedoeld in [artikel 23, eerste lid][ref1], en, indien aanwezig, het orgaan dat is belast met
      toezicht op het beleid en de algemene gang van zaken van de onderneming:

      a. zijn betrokken bij het beleid gericht op het beheersen van relevante risico’s overeenkomstig artikel 76, eerste
      en tweede lid, van de richtlijn kapitaalvereisten;

      b. worden daarbij bijgestaan en geadviseerd door een risicocommissie overeenkomstig artikel 76, derde lid, van de
      richtlijn kapitaalvereisten; en

      c. hebben voldoende toegang tot informatie betreffende de risicosituatie van de financiële onderneming, de
      risicobeheerfunctie en de adviezen van externe deskundigen overeenkomstig artikel 76, vierde lid, van de richtlijn
      kapitaalvereisten.

      2 De risicobeheerfunctie van een bank, beleggingsonderneming of clearinginstelling als bedoeld in het eerste lid is
      ingericht overeenkomstig artikel 76, vijfde lid, van de richtlijn kapitaalvereisten.

      3 Het eerste lid, onderdeel b, vindt slechts toepassing, indien de bank of
      beleggingsonderneming significant is ingevolge [artikel 17d][ref2], respectievelijk
      [artikel 31f van het Besluit gedragstoezicht financiële ondernemingen Wft][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel17d
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel31f
