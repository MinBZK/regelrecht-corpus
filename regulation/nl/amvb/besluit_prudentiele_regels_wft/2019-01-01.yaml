  - number: '18'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie, premiepensioeninstelling,
      verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in [artikel 17][ref1] beschikt
      over een adequate functiescheiding met het oog op een beheerste bedrijfsvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
