    text: |-
      1 Een afwikkelonderneming, betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar of wisselinstelling als bedoeld in [artikel 33, eerste lid][ref1], geeft
      schriftelijk kennis aan de Nederlandsche Bank van een wijziging van gegevens op basis waarvan de Nederlandsche Bank
      heeft geoordeeld dat wordt voldaan aan hetgeen ingevolge [artikel 3:9][ref2] wordt bepaald met betrekking tot de
      betrouwbaarheid van de in dat artikel bedoelde personen.

      2 De financiële onderneming geeft van een wijziging als bedoeld in het eerste lid onverwijld schriftelijk kennis
      nadat zij van de wijziging op de hoogte is gekomen.


