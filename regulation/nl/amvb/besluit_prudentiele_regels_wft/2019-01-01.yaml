  - number: 27a
    text: |-
      1 Indien een betaalinstelling of een elektronischgeldinstelling voornemens is werkzaamheden in verband met het
      verlenen van betaaldiensten uit te besteden, stelt zij de Nederlandsche Bank daarvan in kennis.

      2 Indien een elektronischgeldinstelling voornemens is werkzaamheden in verband met de uitgifte van elektronisch
      geld uit te besteden, stelt zij de Nederlandsche Bank daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel27a
  - number: 27b
    text: |-
      Bij de uitbesteding van werkzaamheden in verband met het verlenen van betaaldiensten draagt de betaalinstelling er
      zorg voor dat uitbesteding de verplichtingen van de betaalinstelling jegens haar cliënten en de rechten van haar
      cliënten uit hoofde van de [wet][ref1] of [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref2] niet wijzigt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0005290
  - number: 27c
    text: |-
      De Nederlandsche Bank kan ter uitvoering van internationaal aanvaarde standaarden nadere regels stellen met
      betrekking tot de uitbesteding door afwikkelondernemingen van werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel27c
  - number: 27d
    text: |-
      Een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-omvang, voldoet met
      betrekking tot uitbesteding van werkzaamheden aan artikel 49 van de richtlijn solvabiliteit II, met inachtneming
      van titel I, hoofdstuk IX, afdeling 4, van de verordening solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel27d
  - number: 27e
    text: |-
      Artikel 49 van de richtlijn solvabiliteit II en titel I, hoofdstuk IX, afdeling 4, van de verordening solvabiliteit
      II inzake uitbesteding van werkzaamheden zijn van overeenkomstige toepassing op de volgende verzekeraars, voor
      zover zij hun bedrijf uitoefenen vanuit een in Nederland gelegen bijkantoor:

      a. levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;

      b. herverzekeraars met zetel in een niet-aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel27e
  - number: '28'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in
      [artikel 27, tweede lid][ref1], gaat niet over tot het uitbesteden van werkzaamheden indien dat afbreuk doet aan de
      kwaliteit van haar onafhankelijke interne toetsing als bedoeld in [artikel 17, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel28
