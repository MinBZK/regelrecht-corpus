  - number: '139'
    text: |-
      Tot de liquide middelen van een vennootschap als bedoeld in [artikel 3:96, derde lid, van de wet][ref1] worden
      uitsluitend gerekend:

      a. aanwezige munten of bankbiljetten;

      b. direct opvorderbare tegoeden;

      c. kortlopende vorderingen die geen direct opvorderbare tegoeden zijn; en

      d. activa die geen kortlopende vorderingen zijn en die op zeer korte termijn en zonder substantiële verliezen
      kunnen worden omgezet in munten of bankbiljetten of direct opvorderbare tegoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel396
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:96
  - number: 140a
    text: |-
      De gegevens, bedoeld in [artikel 3:111b, eerste lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres, het telefoon- en faxnummer en emailadres van de betaaldienstagent;

      b. een beschrijving van de interne controlemechanismen die door de betaaldienstagent zullen worden gebruikt om
      de in de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] neergelegde verplichtingen na te
      komen; en

      c. de identiteit van de bestuurders en de personen die verantwoordelijk zijn voor het beleid van de
      betaaldienstagent die bij het aanbieden van betaaldiensten wordt gebruikt, alsmede gegevens waaruit blijkt dat zij
      betrouwbaar en deskundig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3111b
      [ref2]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:111b
      - id: ref2
        bwb_id: BWBR0024282
  - number: '141'
    text: |-
      1 Onverminderd het tweede lid is [hoofdstuk 5][ref1] niet van toepassing op overeenkomsten met betrekking tot het
      uitbesteden van werkzaamheden die:

      a. zijn gesloten door een clearinginstelling, bank, verzekeraar of bijkantoor als bedoeld in
      [artikel 3:18, eerste lid][ref2], [3:23][ref3], [3:26][ref4] of [3:27 van de wet][ref5] voor de datum van
      inwerkingtreding van dit besluit; en

      b. voldoen aan de op dat moment geldende regelgeving.

      2 Indien de overeenkomst, bedoeld in het eerste lid, materieel wordt aangepast, is [hoofdstuk 5][ref6] vanaf dat
      moment van toepassing op de gehele overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk5
