  - number: '24'
    text: |-
      Een bank, beheerder van een icbe, beleggingsonderneming, betaalinstelling, clearinginstelling,
      elektronischgeldinstelling, kredietunie, premiepensioeninstelling, verzekeraar met beperkte risico-omvang,
      wisselinstelling of bijkantoor als bedoeld in [artikel 23, eerste lid][ref1], ziet er op systematische wijze
      op toe dat de procedures en maatregelen, bedoeld in artikel 23, derde lid, worden nageleefd en zorgt ervoor dat
      gesignaleerde tekortkomingen of gebreken worden opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24a
    text: |-
      1 Een bank of beleggingsonderneming als bedoeld in [artikel 23, tweede lid, tweede volzin][ref1], beschikt over
      solide, doeltreffende en alomvattende strategieën en procedures aan de hand waarvan zij doorlopend nagaat of en
      ervoor zorgt dat de hoogte, samenstelling en verdeling van haar toetsingsvermogen aansluiten op de omvang en de
      aard van haar de korte- en langetermijnrisico’s waaraan zij blootstaat of zou kunnen blootstaan.

      2 Een verzekeraar met beperkte risico-omvang gaat regelmatig na hoe zijn solvabiliteit zich verhoudt tot de korte-
      en langetermijnrisico’s waaraan hij blootstaat of zou kunnen blootstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel24a
