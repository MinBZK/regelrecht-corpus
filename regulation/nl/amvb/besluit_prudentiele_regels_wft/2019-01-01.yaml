  - number: '70'
    text: |-
      1 Het eigen vermogen van een verzekeraar wordt gevormd door het eigen vermogen, bedoeld in artikel 87 van de
      richtlijn solvabiliteit II, ingedeeld in tiers overeenkomstig de artikelen 93 tot en met 96 van die richtlijn, voor
      zover dat overeenkomstig artikel 98 van de richtlijn, en met inachtneming van artikel 82, eerste en derde lid, van
      de verordening solvabiliteit II, in aanmerking komt ter dekking van het solvabiliteitskapitaalvereiste. Het bij
      de berekening van het eigen vermogen in aanmerking te nemen bedrag aan aanvullend vermogen behoeft de voorafgaande
      goedkeuring van de Nederlandsche Bank overeenkomstig artikel 90 van de richtlijn solvabiliteit II.

      2 Met betrekking tot de indeling van het eigen vermogen in tier 1 en tier 2, is de overgangsmaatregel, bedoeld in
      artikel 308 ter, negende onderscheidenlijk tiende lid, van de richtlijn solvabiliteit II van toepassing.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel70
  - number: 70a
    text: |-
      Een verzekeraar met beperkte risico-omvang waarop artikel 308 ter, veertiende lid, van de richtlijn solvabiliteit
      II van overeenkomstige toepassing is en die op 31 december 2017 niet voldoet of gedurende het jaar 2018 dreigt niet
      te voldoen aan het solvabiliteitskapitaalvereiste, treft de nodige maatregelen om uiterlijk op 31 december 2022 het
      in aanmerking komend eigen vermogen ter dekking van het sovabiliteitskapitaalvereiste op peil te brengen of zijn
      risicoprofiel zodanig te verlagen dat wordt voldaan aan het solvabiliteitskapitaalvereiste.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel70a
  - number: '71'
    text: |-
      De waarden die dienen ter dekking van het solvabiliteitskapitaalvereiste van een bijkantoor van een
      levensverzekeraar of schadeverzekeraar als bedoeld in [artikel 3:59, tweede lid, van de wet][ref1] of een
      verzekeraar met beperkte risico-omvang als bedoeld in [artikel 3:62, tweede lid, van de wet][ref2] zijn aanwezig in
      Nederland tot het bedrag van het minimumkapitaalvereiste en voor het meerdere in één of meer lidstaten.


