        artikel: 3:62a
  - number: 105d
    text: |-
      1 De systeemrelevantiebuffer is van toepassing op banken en beleggingsondernemingen die ingevolge
      [artikel 105c][ref1] als systeemrelevant zijn aangemerkt. Indien de Nederlandsche Bank een Nederlandse financiële
      EU-moederholding of Nederlandse gemengde financiële EU-moederholding als systeemrelevant heeft aangemerkt, is
      de systeemrelevantiebuffer van toepassing op de banken en beleggingsondernemingen die dochteronderneming van die
      holding zijn, op basis van de geconsolideerde financiële positie van de holding.

      2 De Nederlandsche Bank stelt de vereiste omvang van de systeemrelevantiebuffer vast. Deze buffer
      bedraagt een, anderhalf of twee procent, al naar gelang de mate waarin, gelet op de criteria, bedoeld in
      [artikel 105c, eerste lid][ref2], naar het oordeel van de Nederlandsche Bank het risico bestaat dat de situatie
      waarin de als systeemrelevant aangemerkte onderneming op enig moment zou kunnen komen te verkeren, de stabiliteit
      van het financiële stelsel in gevaar kan brengen. Indien de onderneming als mondiaal systeemrelevant is aangemerkt,
      kan de vereiste omvang van de buffer overeenkomstig artikel 131, negende tot en met elfde lid, van de richtlijn
      kapitaalvereisten en met inachtneming van artikel 131, veertiende tot en met zeventiende lid, van de richtlijn
      tevens worden vastgesteld op tweeënhalf of drieënhalf procent.

      3 De Nederlandsche Bank stelt ten minste dertig dagen voordat zij een besluit tot vaststelling van een
      systeemrelevantiebuffervereiste als bedoeld in het tweede lid neemt, Onze Minister op de hoogte van haar voornemen.
      Hetzelfde geldt ten aanzien van het voornemen tot wijziging of intrekking van een zodanig besluit. De verplichting
      tot kennisgeving aan Onze Minister is niet van toepassing indien de Europese Centrale Bank de bevoegdheid, bedoeld
      in het tweede lid, uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel105c
