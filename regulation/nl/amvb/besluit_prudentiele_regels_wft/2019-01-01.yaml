  - number: 23c
    text: |-
      1 Een clearinginstelling als bedoeld in [artikel 23, eerste lid][ref1], beschikt over een plan dat voorziet in een
      duurzaam herstel van de financiële positie van de onderneming na een aanzienlijke verslechtering van de financiële
      positie.

      2 Het plan, bedoeld in het eerste lid, wordt afgestemd op de aard, de omvang, het risicoprofiel en de complexiteit
      van de werkzaamheden van de clearinginstelling.

      3 De Nederlandsche Bank kan nadere regels stellen met betrekking tot het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
