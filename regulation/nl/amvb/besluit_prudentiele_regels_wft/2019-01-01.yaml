        artikel: 3:93
  - number: '137'
    text: |-
      1 De accountant of actuaris die voornemens is gegevens als bedoeld in [artikel 136][ref1] te verstrekken, stelt de
      financiële onderneming daarvan in kennis.

      2 Indien de financiële onderneming dat wenst, kan zij zelf de gegevens aan de Nederlandsche Bank verstrekken. In
      dat geval stelt zij de accountant of de actuaris daarvan in kennis. De accountant of de actuaris vergewist zich
      ervan dat de Nederlandsche Bank de gegevens heeft ontvangen en dat de inhoud van de gegevens hem geen aanleiding
      geeft alsnog gegevens aan de Nederlandsche Bank te verstrekken.

      3 Indien de accountant of actuaris schriftelijk gegevens verstrekt aan de Nederlandsche Bank, zendt hij onverwijld
      aan de financiële onderneming een afschrift van de gegevens en, indien van toepassing, van de begeleidende brief.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel136
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel137
    references:
      - id: ref1
