  - number: '105'
    text: |-
      1 De vereiste omvang van de kapitaalbuffer, bedoeld in [artikel 3:62a, eerste lid, van de wet][ref1], bedraagt de
      som van de omvang van de volgende componenten, voor zover van toepassing:

      a. een kapitaalconserveringsbuffer, zijnde de minimaal vereiste omvang van de kapitaalbuffer;

      b. een contracyclische kapitaalbuffer, in verband met risico’s die voortvloeien uit de kredietcyclus, als bedoeld
      in [artikel 3:62a, tweede lid, onderdeel a, van de wet][ref2];

      c. een systeemrelevantiebuffer, in verband met het risico dat de financiële onderneming vormt voor de stabiliteit
      van het financiële stelsel, als bedoeld in [artikel 3:62a, tweede lid, onderdeel b, van de wet][ref3];

      d. een systeemrisicobuffer, in verband met risico’s die voortvloeien uit niet-cyclische
      langetermijnsysteemrisico’s of niet-cyclische macroprudentiële langetermijnrisico’s, als bedoeld in
      [artikel 3:62a, tweede lid, onderdeel c, van de wet][ref4].

      2 De omvang van de in het eerste lid bedoelde buffercomponenten wordt uitgedrukt in een percentage van het
      overeenkomstig artikel 92, derde lid, van de verordening kapitaalvereisten berekende totaal van risicoposten.

      3 Indien op een onderneming een systeemrelevantiebuffer als bedoeld in het eerste lid, onderdeel c, of een
      systeemrisicobuffer als bedoeld in het eerste lid, onderdeel d, van toepassing is, wordt de totale toepasselijke
      omvang van die buffercomponenten bepaald op de wijze, genoemd in artikel 131, veertiende tot en met zeventiende
      lid, van de richtlijn kapitaalvereisten.

      4 De ingevolge de [artikelen 105a][ref5] en [105d][ref6] vereiste omvang van de in het eerste lid, onderdelen a
      en c, bedoelde componenten wordt gedurende de hierna genoemde perioden vermenigvuldigd met de daarbij vermelde
      percentages:

      a. tot en met 31 december 2015: 0 procent;

      b. voor de duur van het kalenderjaar 2016: 25 procent;

      c. voor de duur van het kalenderjaar 2017: 50 procent;

      d. voor de duur van het kalenderjaar 2018: 75 procent.


