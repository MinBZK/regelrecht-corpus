  - number: '33'
    text: |-
      1 Een afwikkelonderneming, bank, betaalinstelling, clearinginstelling, elektronischgeldinstelling, kredietunie,
      premiepensioeninstelling, verzekeraar of wisselinstelling als bedoeld in [artikel 3:29, eerste lid][ref1],
      [3:42][ref2], [3:43, tweede lid][ref3], of [3:49 van de wet][ref4] geeft schriftelijk aan de Nederlandsche Bank
      kennis van het voornemen tot een wijziging van:

      a. de personen die het dagelijks beleid van de financiële onderneming bepalen of het beleid van de financiële
      onderneming bepalen of mede bepalen;

      b. indien van toepassing, de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het
      beleid en de algemene gang van zaken van de financiële onderneming; en

      c. indien van toepassing, de personen werkzaam onder verantwoordelijkheid van een bank of verzekeraar, die een
      leidinggevende functie vervullen direct onder het echelon van de beleidsbepalers en verantwoordelijk zijn voor
      natuurlijke personen wier werkzaamheden het risicoprofiel van de onderneming wezenlijk kunnen beïnvloeden.

      2 De financiële onderneming geeft geen uitvoering aan het voornemen voordat de Nederlandsche Bank heeft ingestemd
      met de wijziging. De Nederlandsche Bank neemt een besluit omtrent instemming:

      a. binnen zes weken na ontvangst van de kennisgeving; of

      b. indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.

      3 Met betrekking tot het voornemen legt de financiële onderneming de volgende gegevens over:

      a. gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of wordt voldaan aan hetgeen in
      [artikel 3:8 van de wet][ref5] wordt bepaald met betrekking tot de geschiktheid van de betrokkene;

      b. gegevens op basis waarvan de Nederlandsche Bank, onder overeenkomstige toepassing van de
      [artikelen 6 tot en met 9][ref6], redelijkerwijs kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:9, van de wet][ref7] wordt bepaald met betrekking tot de betrouwbaarheid van de betrokkene.

      4 De gegevens, bedoeld in het derde lid, onderdeel a, zijn:

      a. een opgave van de naam, het adres en de functie;

      b. een curriculum vitae;

      c. een opgave van de geldige relevante diploma’s; en

      d. een kopie van een geldig identiteitsbewijs.

      5 Het derde lid, onderdeel b, is niet van toepassing indien het voornemen tot wijziging een persoon betreft
      wiens betrouwbaarheid voor de toepassing van de wet door een toezichthouder reeds is vastgesteld, tenzij de
      Nederlandsche Bank besluit dat een redelijke aanleiding bestaat tot een nieuwe beoordeling als bedoeld in
      [artikel 3:9, tweede lid, van de wet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel329
