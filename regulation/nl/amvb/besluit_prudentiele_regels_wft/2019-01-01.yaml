  - number: 40k
    text: |-
      De Nederlandsche Bank stelt een lijst op van de op grond van
      [artikel 1:107, eerste en derde lid, onderdelen m en n, van de wet][ref1] geregistreerde categorieën geregistreerde
      gedekte obligaties en banken die geregistreerde gedekte obligaties uitgeven en doet daarvan, alsmede van
      wijzigingen daarvan, mededeling aan de Europese Commissie en de Europese Autoriteit voor effecten en markten.


