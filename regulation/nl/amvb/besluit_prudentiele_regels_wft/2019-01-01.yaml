  - number: 135a
    text: |-
      1 De gegevens, bedoeld [artikel 3:74c van de wet][ref1], omvatten de informatie, genoemd in artikel 24, eerste,
      tweede, vierde en zesde lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen.

      2 De Nederlandsche Bank kan in aanvulling op de gegevens, bedoeld in het eerste lid, al dan niet periodiek,
      andere gegevens van beheerders, bedoeld in [artikel 3:74c][ref2], verlangen, indien dit nodig wordt geacht om de
      stabiliteit van het financiële stelsel te waarborgen.

      3 De Nederlandsche Bank kan de in het tweede lid bedoelde gegevens alleen verlangen indien de Europese Autoriteit
      van effecten en markten hiervan in kennis is gesteld of de Europese Autoriteit van effecten en markten de
      Nederlandsche Bank hierom heeft verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel374c
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel374c
