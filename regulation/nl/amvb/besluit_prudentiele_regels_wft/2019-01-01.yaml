  - number: 135b
    text: |-
      De Nederlandsche Bank kan ter uitvoering van internationaal aanvaarde standaarden nadere regels stellen met
      betrekking tot het effectief verlenen van afwikkeldiensten.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel135b
  - number: '136'
    text: |-
      De door een accountant als bedoeld in [artikel 3:88, tweede lid][ref1], [3:90][ref2], [3:91][ref3] of
      [3:93 van de wet][ref4] te verstrekken gegevens zijn:

      a. het accountantsverslag aan de bestuurders en de raad van commissarissen;

      b. de directiebrieven;

      c. overige correspondentie tussen de accountant en de financiële onderneming die rechtstreeks betrekking heeft op
      de verklaring omtrent de getrouwheid van de jaarrekening of de staten van de financiële onderneming; en

      d. indien de Nederlandsche Bank daarom verzoekt, een nadere toelichting op de gegevens, bedoeld in de onderdelen a
      tot en met c.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel388
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel390
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel391
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel393
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel136
    references:
