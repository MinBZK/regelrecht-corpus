  - number: '26.6'
    text: |-
      1 Een verzekeraar of holding als bedoeld in [artikel 3:288i1, eerste lid, van de wet][ref1] beschikt over een
      voorbereidend groepscrisisplan dat door de Nederlandsche Bank is goedgekeurd en dat voorziet in maatregelen met
      betrekking tot de verzekeraar, zijn dochterondernemingen of holding, die de groep in staat stellen de financiële
      positie van de afzonderlijke groepsleden en de groep als geheel na een aanzienlijke verslechtering ervan te
      herstellen.

      2 Het voorbereidende groepscrisisplan bevat een identificatie van de belangrijkste onderdelen van de groep.

      3 [Artikel 26.5, tweede tot en met vijfde lid][ref2], is van overeenkomstige toepassing op een voorbereidend
      groepscrisisplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3288i1
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel26.5
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel26.6
    references:
