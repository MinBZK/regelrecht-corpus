  - number: '55'
    text: |-
      1 Ten minste een vierde gedeelte van de absolute ondergrens van het minimumkapitaalvereiste, bedoeld in artikel
      54, wordt gedekt door verhandelbare waarden die in open bewaring worden gegeven bij een bank die in Nederland haar
      bedrijf mag uitoefenen.

      2 De Nederlandsche Bank kan, met het oog op het voorkomen van waardevermindering van de waarden, bedoeld in het
      eerste lid, regels stellen met betrekking tot de voorwaarden waaronder die waarden in bewaring kunnen worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel55
  - number: '56'
    text: |-
      1 Een verzekeraar kan met de bank, bedoeld in [artikel 55, eerste lid][ref1], overeenkomen dat deze bij haar
      in bewaring gegeven waarden op naam van de verzekeraar mag overdragen aan een effectenbewaarinstelling die
      rechtspersoon is, indien:

      a. de nakoming van de verplichtingen van de effectenbewaarinstelling is gewaarborgd; en

      b. de effectenbewaarinstelling zich jegens de bank heeft verplicht om hetzij die waarden hetzij een gelijke
      hoeveelheid waarden van dezelfde soort op naam van de verzekeraar in haar voorraad aanwezig te houden en na
      beëindiging van de overeenkomst tussen de verzekeraar en de bank af te geven aan de verzekeraar.

      2 De bank, bedoeld in [artikel 55, eerste lid][ref2], onderscheidenlijk de effectenbewaarinstelling draagt
      zelfstandig zorg voor verkrijging van nieuwe coupon- en dividendbladen en voor bewaargeving in verband met het
      bijwonen van aandeelhoudersvergaderingen door de verzekeraar.

      3 De waarden worden slechts aan de verzekeraar afgegeven en ten aanzien daarvan worden slechts rechtshandelingen
      verricht, indien de Nederlandsche Bank daartoe, op verzoek, heeft besloten. De bank, bedoeld in
      [artikel 55, eerste lid][ref3], onderscheidenlijk de effectenbewaarinstelling mag evenwel vanaf twee weken voor de
      dag der betaalbaarstelling coupons en dividendbewijzen zonder een besluit van de Nederlandsche Bank daartoe aan de
      verzekeraar afgeven, tenzij de Nederlandsche Bank heeft besloten dat zij dat niet mag. De Nederlandsche Bank deelt
      dit besluit onverwijld aan de verzekeraar mede.

      4 De waarden worden op verzoek van de Nederlandsche Bank aan haar ter bewaring afgegeven, indien de bank, bedoeld
      in [artikel 55, eerste lid][ref4]:

      a. niet langer in Nederland haar bedrijf mag uitoefenen; of

      b. de overeenkomst met de verzekeraar beëindigt dan wel de nakoming van de verplichtingen van de
      effectenbewaarinstelling niet langer waarborgt.

      5 De Nederlandsche Bank geeft de waarden onverwijld na de afgifte, bedoeld in het vierde lid, op kosten van de
      verzekeraar in bewaring bij een bank die in Nederland haar bedrijf mag uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel55
