    text: |-
      1 De betrouwbaarheid van een persoon als bedoeld in [artikel 5][ref1] staat niet buiten twijfel indien:

      a. deze onherroepelijk veroordeeld is terzake van een misdrijf, genoemd in onderdeel 1 van
      [bijlage A, ][ref2]waarbij sinds het onherroepelijk worden van de uitspraak minder dan acht jaren zijn verstreken;

      b. deze veroordeeld is terzake van een misdrijf, genoemd in onderdeel 1 van [bijlage A][ref3], waarbij de uitspraak
      nog niet onherroepelijk is of waarbij sinds het onherroepelijk worden van de uitspraak acht of meer jaren zijn
      verstreken;

      c. deze veroordeeld is terzake van een overtreding van
      [artikel 69 van de Algemene wet inzake de rijksbelastingen][ref4] of [artikel 65 van de Invorderingswet 1990][ref5],
      waarbij betrokkene veroordeeld is tot een gevangenisstraf of boete; of

      d. deze een vergrijpboete van meer dan € 62.500 opgelegd heeft gekregen terzake van een feit, genoemd in onderdeel
      5 van [bijlage A][ref6], en het besluit waarbij de vergrijpboete is opgelegd onherroepelijk is geworden of waarbij
      ten minste de rechter in eerste aanleg uitspraak heeft gedaan.

      2 De Nederlandsche Bank kan op grond van de omstandigheden of belangen, genoemd in [artikel 9][ref7], afwijken van
      het eerste lid, ten aanzien van de onderdelen b, c en d.


