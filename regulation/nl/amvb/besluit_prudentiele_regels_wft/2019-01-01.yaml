  - number: '13'
    text: |-
      1 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie,
      bank, kredietunie, premiepensioeninstelling, verzekeraar, wisselinstelling of bijkantoor als bedoeld in
      [artikel 11, eerste lid][ref1], maakt een onderbouwde beoordeling van de betrouwbaarheid van personen die zij wil
      benoemen in een integriteitsgevoelige functie.

      2 De financiële onderneming, onderscheidenlijk het bijkantoor, draagt zorg voor de beoordeling van de
      betrouwbaarheid van degenen die, anders dan op grond van een arbeidsovereenkomst, werkzaamheden in een
      integriteitgevoelige functie verrichten.

      3 Het eerste en tweede lid zijn niet van toepassing op een verzekeraar, niet zijnde een verzekeraar met beperkte
      risico-omvang, voor zover het een integriteitgevoelige functie betreft die is aan te merken als een sleutelfunctie
      als bedoeld in artikel 42, eerste lid, van de richtlijn solvabiliteit II.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: 13a
    text: |-
      1 Een verzekeraar draagt er zorg voor dat de betrouwbaarheid van de werknemers en andere natuurlijke personen die
      zich onder zijn verantwoordelijkheid rechtstreeks bezighouden met het verlenen van financiële diensten en van de
      feitelijk leidinggevenden die voor deze personen verantwoordelijk zijn, buiten twijfel staat.

      2 Een persoon als bedoeld in het eerste lid is betrouwbaar, indien hij een verklaring omtrent het gedrag als
      bedoeld in de [Wet justitiële strafvorderlijke gegevens][ref1] over kan leggen, en hij niet failliet is verklaard,
      tenzij rehabilitatie als bedoeld in [artikel 212 van de Faillissementswet][ref2] heeft plaatsgevonden.

      3 De verzekeraar legt alle relevante documentatie met betrekking tot de toepassing van dit artikel vast en houdt de
      documentatie bij.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel212
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel13a
