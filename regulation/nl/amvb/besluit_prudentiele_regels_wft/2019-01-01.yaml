  - number: 26a
    text: |-
      1 Een bank, beleggingsonderneming of financiële instelling die een verklaring van ondertoezichtstelling als bedoeld
      in [artikel 3:110][ref1] heeft, beschikt over procedures en maatregelen die waarborgen dat de voor de uitvoering
      van de vangnetregelingen noodzakelijke gegevens voortdurend actueel worden bijgehouden en adequaat zijn vastgelegd.

      2 De financiële onderneming verstrekt de gegevens, bedoeld in het eerste lid, op verzoek van de Nederlandsche Bank
      binnen een door de Nederlandsche Bank te bepalen termijn en op een op de Nederlandsche Bank te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3110
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:110
  - number: 26b
    text: |-
      Afwikkelondernemingen, banken, betaalinstellingen en elektronischgeldinstellingen nemen bij de inrichting van
      hun bedrijfsvoering de regels in acht die door de Nederlandsche Bank terzake worden gesteld ter uitvoering van
      internationaal aanvaarde standaarden om de goede werking van het betalingsverkeer te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel26b
  - number: '27'
    text: |-
      1 Een financiële onderneming of bijkantoor als bedoeld in [artikel 3:18, eerste lid][ref1], [3:22][ref2],
      [3:23][ref3], [3:24b][ref4], [3:26][ref5] of [3:27, van de wet][ref6] gaat niet over tot het uitbesteden van
      werkzaamheden indien die uitbesteding een belemmering kan vormen voor een adequaat toezicht op de naleving van het
      bij of krachtens het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref7] bepaalde.

      2 Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in
      [artikel 3:18, tweede lid][ref8], [3:23][ref9], [3:26][ref10] of [3:27 van de wet][ref11] besteedt de taken en
      werkzaamheden van personen die het dagelijks beleid bepalen, daaronder mede verstaan het vaststellen van het beleid
      en het afleggen van verantwoording over het gevoerde beleid, niet uit.


