    text: |-
      Tot de gegevens, bedoeld in [artikel 3:73a van de wet][ref1], behoren in ieder geval de gegevens met betrekking tot
      storingen die zich hebben voorgedaan of bijna hebben voorgedaan in het verrichten van afwikkeldiensten.


