  - number: 63a
    text: |-
      1 De minimumomvang van het toetsingsvermogen van een premiepensioeninstelling als bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref1] bedraagt twee tiende procent van het beheerde pensioenvermogen. De
      minimumomvang van het toetsingsvermogen bedraagt niet meer dan € 20 miljoen.

      2 In aanvulling op het eerste lid beschikt een premiepensioeninstelling naar keuze over:

      a. een beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening die haar aansprakelijkheid
      dekt wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van haar beroep of bedrijf en voorgevallen
      op het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, voor een
      bedrag van ten minste vijfenzeventig honderdste procent van de waarde van het beheerde pensioenvermogen, met een
      minimum van € 2 miljoen en een maximum van € 20 miljoen per schadegeval, en ten minste een procent van de waarde
      van het beheerde pensioenvermogen, met een minimum van € 2,5 miljoen en een maximum van € 25 miljoen per jaar, voor
      alle schadegevallen gezamenlijk; of

      b. een aanvulling op het toetsingsvermogen, bedoeld in het eerste lid, welke een tiende procent van de waarde van
      het beheerde pensioenvermogen bedraagt.

      3 Tot het beheerde pensioenvermogen wordt gerekend het vermogen onder beheer van de premiepensioeninstelling met
      inbegrip van de delen van het vermogen waarvan zij de bewaring heeft uitbesteed aan een pensioenbewaarder.

      4 Indien een premiepensioeninstelling pensioenvermogen beheert in opdracht van een cliënt buiten het grondgebied
      waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, beschikt zij voor dat deel van
      het beheerde pensioenvermogen in afwijking van het tweede lid, aanhef, over de aanvulling op het toetsingsvermogen,
      bedoeld in het tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel357
