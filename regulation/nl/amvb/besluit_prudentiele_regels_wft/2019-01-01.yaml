  - number: 23e
    text: |-
      1 Een EU-moederonderneming met zetel in Nederland van een groep als bedoeld in [artikel 3A:1 van de wet][ref1]
      beschikt over een herstelplan dat door de consoliderende toezichthouder, bedoeld in artikel 4, eerste lid,
      van de verordening kapitaalvereisten, is goedgekeurd en dat voorziet in maatregelen met betrekking tot de EU-
      moederonderneming of haar dochterondernemingen, die de groep in staat stellen haar financiële positie na een
      aanzienlijke verslechtering ervan te herstellen. Een herstelplan wordt ter goedkeuring voorgelegd na vaststelling
      door het bestuur van de onderneming.

      2 Het groepsherstelplan voldoet aan de eisen ingevolge de artikelen 5, derde tot en met zesde en tiende lid, 7,
      vierde tot en met zesde lid, en 9, eerste lid, eerste alinea, van de richtlijn herstel en afwikkeling van banken
      en beleggingsondernemingen.

      3 [Artikel 23d, derde en vierde lid][ref2], is van overeenkomstige toepassing.

      4 Een groepsherstelplan dat is goedgekeurd door de consoliderende toezichthouder in een andere lidstaat, is op
      entiteiten van een groep met zetel in Nederland van toepassing, tenzij de Nederlandsche Bank overeenkomstig artikel
      8, vierde lid, van de richtlijn herstel en afwikkeling van banken en beleggingsondernemingen besluit dat deze
      entiteiten moeten beschikken over een eigen herstelplan, waarop [artikel 23d][ref3] van overeenkomstige toepassing
      is.

      5 De Nederlandsche Bank kan nadere regels stellen met betrekking tot het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a1
