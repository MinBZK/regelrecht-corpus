  - number: 17d
    text: |-
      Een bank is, mede voor de toepassing van [artikel 3:8, vierde lid, van de wet][ref1], significant, indien:

      a. zij op individuele basis een instelling van groot belang is op grond van de voorwaarden ingevolge artikel 6 van
      de verordening bankentoezicht; of

      b. zij door de Nederlandsche Bank, gelet op haar omvang, interne organisatie en de aard, reikwijdte en complexiteit
      van haar activiteiten als significant wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel38
