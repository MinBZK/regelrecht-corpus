  - number: '44'
    text: |-
      1 De omstandigheden, bedoeld in [artikel 3:40][ref1] en [3:47, zesde lid, van de wet][ref2] waaronder de
      vertegenwoordiger van een verzekeraar als bedoeld in [artikel 3:40][ref3], [3:47, zesde lid][ref4], of
      [3:50, tweede lid, van de wet][ref5] ophoudt vertegenwoordiger te zijn, zijn de omstandigheden, bedoeld in het
      tweede tot en met vijfde lid en in de [artikelen 45 tot en met 47][ref6].

      2 De verzekeraar die voornemens is de vertegenwoordiging te beëindigen, geeft daarvan kennis aan de Nederlandsche
      Bank.

      3 De kennisgeving, bedoeld in het tweede lid, vermeldt tevens de naam van degene die de verzekeraar voornemens is
      aan te stellen als opvolger van de vertegenwoordiger.

      4 Indien de opvolger rechtspersoon is, gaat de kennisgeving gepaard met de statuten van deze rechtspersoon, een
      opgave van het nummer van inschrijving in het handelsregister en een bewijs van aanstelling van de natuurlijke
      persoon die is aangesteld als vertegenwoordiger van de vertegenwoordiger die rechtspersoon is.

      5 De verzekeraar, bedoeld in [artikel 3:47, eerste lid][ref7], of [3:50, tweede lid, van de wet][ref8] beëindigt de
      vertegenwoordiging op de dag waarop van de beëindiging kennis is gegeven aan de Nederlandsche Bank.

      6 De verzekeraar, bedoeld in [artikel 3:47, eerste lid][ref9], of [artikel 3:50, tweede lid, van de wet][ref10]
      geeft geen uitvoering aan het voornemen indien de Nederlandsche Bank er niet mee instemt. Indien de Nederlandsche
      Bank besluit niet in te stemmen met het voornemen, maakt zij haar besluit daartoe aan de financiële onderneming
      bekend:

      a. binnen zes weken na ontvangst van de kennisgeving; of

      b. indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.


