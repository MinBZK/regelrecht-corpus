  - number: 40j
    text: |-
      Bij of krachtens ministeriële regeling worden nadere regels gesteld met betrekking tot:

      a. de veiligstelling van de dekkingsactiva en de veiligstelling van betaling op de geregistreerde gedekte
      obligaties op adequate, transparante en verantwoorde wijze;

      b. de door een bank die een geregistreerde gedekte obligatie uitgeeft, aan de houders daarvan of aan de
      Nederlandsche Bank te verstrekken informatie.
