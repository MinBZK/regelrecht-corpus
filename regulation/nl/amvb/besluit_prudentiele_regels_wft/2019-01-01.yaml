  - number: '22'
    text: |-
      De opdracht tot onderzoek van de jaarrekening van een betaalinstelling, clearinginstelling,
      elektronischgeldinstelling, bank, kredietunie, premiepensioeninstelling, verzekeraar met beperkte risico-omvang of
      bijkantoor als bedoeld in [artikel 17][ref1] aan de externe accountant voorziet in een toetsing en beoordeling op
      hoofdlijnen met betrekking tot de toereikendheid van de organisatie-inrichting en risicobeheersing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2019-01-01#Artikel22
