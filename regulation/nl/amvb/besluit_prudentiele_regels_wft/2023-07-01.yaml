  - number: '50.2'
    text: |-
      Het minimumbedrag aan eigen vermogen van een beheerder van een beleggingsinstelling als bedoeld in
      [artikel 3:53, eerste lid, van de wet][ref1], van een beheerder van een icbe als bedoeld in artikel
      3:53, eerste lid, van de wet en van een beleggingsonderneming als bedoeld in artikel 3:53, eerste lid, of
      [3:54, eerste lid, van de wet][ref2] is samengesteld overeenkomstig artikel 9 van de verordening prudentiële
      vereisten voor beleggingsondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
