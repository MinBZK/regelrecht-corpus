        paragraaf: '10.1'
  - number: '144.1'
    text: |-
      De ingevolge dit besluit te verstrekken staten worden voor de eerste maal verstrekt over het boekjaar dat aanvangt
      op of na 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel144
  - number: '144.2'
    text: |-
      Ten aanzien van de staten over het in 2006 geëindigde boekjaar blijft het bepaalde
      ingevolge [artikel 55, tweede lid, van de Wet toezicht kredietwezen 1992][ref1], het
      [Besluit staten verzekeringsbedrijf 1994][ref2], het [Besluit staten natura-uitvaartverzekeringsbedrijf][ref3] en
      [artikel 8 van de Nadere regeling prudentieel toezicht effectenverkeer 2002][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0006735
      [ref3]: https://wetten.overheid.nl/BWBR0007652
      [ref4]: https://wetten.overheid.nl/BWBR0013315#Artikel8
