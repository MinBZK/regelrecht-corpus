  - number: 3a.1
    text: |-
      De [hoofdstukken 9][ref1] en [10][ref2] zijn niet van toepassing op betaalinstellingen:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
  - number: 3a.1.a
    text: |-
      voor zover zij uitsluitend in Nederland betaaldiensten verlenen als bedoeld onder 6 van de bijlage bij de richtlijn
      betaaldiensten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel3a
  - number: 3a.1.b
    text: |-
      waarvan het gemiddelde van het totale bedrag van de betalingstransacties die zij de voorafgaande twaalf maanden
      hebben verricht, met inbegrip van die van agenten waarvoor zij volledig aansprakelijk zijn, niet hoger is dan €
      3.000.000 per maand; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel3a
  - number: 3a.1.c
    text: |-
      waarvan geen van de personen die het beleid bepalen of mede bepalen personen zijn met antecedenten als
      bedoeld in [artikel 6, onderdelen a, b en d][ref1], voor zover deze betrekking hebben op het witwassen van
      geld, terrorismefinanciering of vermogensmisdrijven of als misdrijf aangemerkte overtredingen van financiële
      toezichtswetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel6
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '6'
        hoofdstuk: '2'
  - number: 3a.2
    text: |-
      Een betaalinstelling als bedoeld in het eerste lid stelt de Nederlandsche Bank in kennis van elke verandering in
      zijn situatie die relevant is voor het naleven van de in het eerste lid gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel3a
  - number: 3a.3
    text: |-
      Indien een betaaldienstverlener zijn werkzaamheden niet gedurende de gehele periode van de voorafgaande twaalf
      maanden heeft verricht, kan voor de toepassing van het eerste lid, onderdeel b, worden uitgegaan van een programma
      van werkzaamheden waarin naar het oordeel van de Nederlandsche Bank een reële begroting van het totale bedrag aan
      betalingstransacties is opgenomen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel3a
  - number: '4.1'
    text: |-
      Berekeningen met betrekking tot het minimumbedrag aan eigen vermogen, de solvabiliteit, de kapitaalbuffer, de
      hefboomratiobuffer onderscheidenlijk de liquiditeit van financiële ondernemingen, niet zijnde verzekeraars,
      op grond van de [hoofdstukken 9][ref1], [10][ref2], [10A][ref3] onderscheidenlijk [11][ref4] worden, voor
      zover niet anders is bepaald, gedaan op basis van de enkelvoudige jaarrekening zoals opgemaakt ingevolge
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref5] of de internationale jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10a
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk11
      [ref5]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0020420
        hoofdstuk: 10a
      - id: ref4
        bwb_id: BWBR0020420
        hoofdstuk: '11'
      - id: ref5
        bwb_id: BWBR0003045
  - number: '4.2'
    text: |-
      Berekeningen met betrekking tot de solvabiliteit van banken op grond van [hoofdstuk 10][ref1], de kapitaalbuffer
      en de hefboomratiobuffer van banken op grond van [hoofdstuk 10A][ref2] en de liquiditeit van banken op grond van
      [hoofdstuk 11][ref3] worden, voor zover niet anders is bepaald, gedaan op basis van de geconsolideerde jaarrekening
      indien deze wordt opgemaakt ingevolge [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref4] of de internationale
      jaarrekeningstandaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk10a
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk11
      [ref4]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020420
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0020420
        hoofdstuk: 10a
      - id: ref3
        bwb_id: BWBR0020420
        hoofdstuk: '11'
      - id: ref4
        bwb_id: BWBR0003045
  - number: '4.3'
    text: |-
      Onverminderd [artikel 3:69a van de wet][ref1] waardeert een verzekeraar met beperkte risico-
      omvang, voor zover in dit besluit niet anders wordt bepaald, zijn activa en passiva op basis van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003045
  - number: '4.4'
    text: |-
      Een verzekeraar met beperkte risico-omvang houdt zich aan door de Nederlandsche Bank te stellen nadere regels met
      betrekking tot de waardering van deelnemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel4
  - number: '5.1'
    text: |-
      De Nederlandsche Bank stelt vast of de betrouwbaarheid van een persoon als bedoeld in
      [artikel 3:9, eerste lid][ref1], [3:11][ref2], [3:13][ref3], [3:37, derde lid en vierde lid][ref4],
      [3:47, eerste en vijfde lid][ref5], of [3:99, eerste lid, van de wet][ref6] en van een persoon als bedoeld in
      [artikel 17aa, vierde lid][ref7], buiten twijfel staat op basis van diens voornemens, handelingen en antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0020420#Artikel17aa
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0020420
        artikel: 17aa
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '5.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de beoordeling van de betrouwbaarheid van een persoon door de
      Nederlandsche Bank op grond van een verordening als bedoeld in [artikel 1:24, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '6'
    text: |-
      De Nederlandsche Bank neemt bij de vaststelling, bedoeld in [artikel 5][ref1], in ieder geval in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '5'
        hoofdstuk: '2'
  - number: 6.a
    text: |-
      de in de [onderdelen 1 en 2 van Bijlage A][ref1] genoemde strafrechtelijke antecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 6.b
    text: |-
      de in [onderdeel 3 van Bijlage A][ref1] genoemde financiële antecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 6.c
    text: |-
      de in [onderdeel 4 van Bijlage A][ref1] genoemde toezichtantecedenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 6.d
    text: |-
      de in [onderdeel 5 van Bijlage A][ref1] genoemde fiscaal bestuursrechtelijke antecedenten; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 6.e
    text: |-
      de in [onderdeel 6 van Bijlage A][ref1] genoemde overige antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: '7.1'
    text: |-
      De Nederlandsche Bank verkrijgt inzicht in de in [artikel 5][ref1] bedoelde voornemens, handelingen en antecedenten
      op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '5'
        hoofdstuk: '2'
  - number: 7.1.a
    text: door betrokkene verstrekte gegevens en inlichtingen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: 7.1.b
    text: door de Landelijke Officier van Justitie verstrekte politiegegevens;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: 7.1.c
    text: |-
      gegevens uit de registratie, bedoeld in [artikel 1, onderdeel b, van de Wet controle op rechtspersonen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel1
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015049
        artikel: '1'
  - number: 7.1.d
    text: gegevens en inlichtingen, verkregen van de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: 7.1.e
    text: |-
      gegevens en inlichtingen, verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van Nederlandse of
      buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of op
      personen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: 7.1.f
    text: ambtsberichten van het Openbaar Ministerie;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: 7.1.g
    text: inlichtingen, verkregen van door betrokkene opgegeven referenties;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: 7.1.h
    text: gegevens uit openbare bronnen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: 7.1.i
    text: |-
      inlichtingen, verkregen van curatoren of bewindvoerders met betrekking tot faillissementen, surseances,
      schuldsaneringen, bewindvoeringen of noodregelingen waarbij de in [artikel 5][ref1] bedoelde persoon betrokken
      is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '5'
        hoofdstuk: '2'
  - number: 7.1.j
    text: inlichtingen, verkregen van organisaties van huidige of voormalige beroepsgenoten van betrokkene; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: 7.1.k
    text: gegevens en inlichtingen, verkregen uit andere bij ministeriële regeling aan te wijzen bronnen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: '7.2'
    text: |-
      Indien de gegevens of inlichtingen, verkregen overeenkomstig het eerste lid, de Nederlandsche Bank aanleiding geven
      tot nader onderzoek, kan de Nederlandsche Bank ook inlichtingen inwinnen en gegevens opvragen bij andere personen
      of instanties dan genoemd in dat lid. De Nederlandsche Bank stelt de betrokkene in dat geval vooraf schriftelijk in
      kennis van:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: 7.2.a
    text: de reden van het nadere onderzoek;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: 7.2.b
    text: de personen of instanties bij wie nadere gegevens of inlichtingen zullen worden ingewonnen; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: 7.2.c
    text: de aard van de nadere gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel7
  - number: '8.1'
    text: |-
      De betrouwbaarheid van een persoon als bedoeld in [artikel 5][ref1] staat niet buiten twijfel indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '5'
        hoofdstuk: '2'
  - number: 8.1.a
    text: |-
      deze onherroepelijk veroordeeld is terzake van een misdrijf, genoemd in onderdeel 1 van [bijlage A, ][ref1]waarbij
      sinds het onherroepelijk worden van de uitspraak minder dan acht jaren zijn verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 8.1.b
    text: |-
      deze veroordeeld is terzake van een misdrijf, genoemd in onderdeel 1 van [bijlage A][ref1], waarbij de uitspraak
      nog niet onherroepelijk is of waarbij sinds het onherroepelijk worden van de uitspraak acht of meer jaren zijn
      verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 8.1.c
    text: |-
      deze veroordeeld is terzake van een overtreding van [artikel 69 van de Algemene wet inzake de rijksbelastingen][ref1]
      of [artikel 65 van de Invorderingswet 1990][ref2], waarbij betrokkene veroordeeld is tot een gevangenisstraf of
      boete; of


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel65
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '65'
  - number: 8.1.d
    text: |-
      deze een vergrijpboete van meer dan € 62.500 opgelegd heeft gekregen terzake van een feit, genoemd in onderdeel 5
      van [bijlage A][ref1], en het besluit waarbij de vergrijpboete is opgelegd onherroepelijk is geworden of waarbij
      ten minste de rechter in eerste aanleg uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: '8.2'
    text: |-
      De Nederlandsche Bank kan op grond van de omstandigheden of belangen, genoemd in [artikel 9][ref1], afwijken van
      het eerste lid, ten aanzien van de onderdelen b, c en d.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel9
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '9'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      De Nederlandsche Bank neemt bij de vaststelling, bedoeld in [artikel 5][ref1], in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel5
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '5'
        hoofdstuk: '2'
  - number: 9.a
    text: |-
      het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de overige
      omstandigheden van het geval;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel9
  - number: 9.b
    text: |-
      de belangen die de [wet][ref1] beoogt te beschermen; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 9.c
    text: de overige belangen van de onderneming en de betrokkene.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel9
  - number: '10.1'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie,
      bank, kredietunie, premiepensioeninstelling, verzekeraar, wisselinstelling of bijkantoor als bedoeld
      in [artikel 3:10, eerste lid][ref1], [3:11][ref2], [3:12][ref3], [3:12a][ref4], [3:13][ref5] of
      [3:14 van de wet][ref6] draagt zorg voor een systematische analyse van integriteitsrisico´s.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '10.2'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, draagt er zorg voor dat het beleid, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref1] zijn neerslag vindt in procedures en maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '10.3'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, stelt alle relevante bedrijfsonderdelen in kennis van
      het beleid en de procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel10
  - number: '10.4'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, draagt zorg voor de uitvoering en de systematische
      toetsing van het beleid en de procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel10
  - number: '10.5'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, draagt zorg voor onafhankelijk toezicht op de
      uitvoering van het beleid en de procedures en maatregelen met betrekking tot de integere uitoefening van het
      bedrijf en beschikt over procedures die erin voorzien dat gesignaleerde tekortkomingen of gebreken worden
      gerapporteerd aan de personen belast met de taak, bedoeld in [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel21
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '10.6'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, beschikt over procedures die erin voorzien dat
      gesignaleerde tekortkomingen of gebreken met betrekking tot de integere uitoefening van het bedrijf onder toezicht
      van de personen belast met de taak, bedoeld in [artikel 21][ref1], tot een gepaste bijstelling leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel21
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '11.1'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie,
      bank, kredietunie, premiepensioeninstelling, verzekeraar, wisselinstelling of bijkantoor als bedoeld
      in [artikel 3:17, eerste lid][ref1], [3:23][ref2], [3:24a][ref3], [3:24b][ref4], [3:26][ref5] of
      [3:27 van de wet][ref6] beschikt over procedures en maatregelen met betrekking tot het tegengaan van verstrengeling
      van privé-belangen van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 11.1.a
    text: personen die het beleid van de financiële onderneming bepalen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel11
  - number: 11.1.b
    text: groepsbestuurders;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel11
  - number: 11.1.c
    text: |-
      leden van het orgaan dat is belast met het toezicht op het beleid en de algemene gang van zaken van de financiële
      onderneming; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel11
  - number: 11.1.d
    text: |-
      andere werknemers of andere personen die in haar opdracht op structurele basis werkzaamheden voor haar verrichten,
      met haar belangen of die van haar cliënten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel11
  - number: '11.2'
    text: |-
      De entiteit voor risico-acceptatie, bank, premiepensioeninstelling of verzekeraar, onderscheidenlijk het
      bijkantoor, beschikt over procedures en maatregelen met betrekking tot het verlenen van financiële diensten
      op basis van personeelscondities aan personen die het beleid van de financiële onderneming bepalen en
      groepsbestuurders.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel11
  - number: '11.3'
    text: |-
      Financiële dienstverlening door de entiteit voor risico-acceptatie, bank, premiepensioeninstelling of verzekeraar,
      onderscheidenlijk het bijkantoor, op basis van personeelscondities aan personen die het beleid van de financiële
      onderneming bepalen of groepsbestuurders vindt uitsluitend plaats in de normale uitoefening van het bedrijf en
      vindt telkens slechts plaats na instemming door het orgaan dat is belast met het toezicht op het beleid en de
      algemene gang van zaken van de financiële onderneming dan wel namens een daartoe aangewezen orgaan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel11
  - number: '11.4'
    text: |-
      Financiële dienstverlening door de entiteit voor risico-acceptatie, bank, premiepensioeninstelling of verzekeraar,
      onderscheidenlijk het bijkantoor, aan personen die het beleid van de financiële onderneming bepalen of
      groepsbestuurders vindt, indien de dienst buiten de grenzen van het bij de financiële onderneming bestaande systeem
      van personeelscondities wordt verleend, uitsluitend plaats in de normale uitoefening van het bedrijf en tegen de
      gebruikelijke commerciële voorwaarden en zekerheden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel11
  - number: '11.5'
    text: |-
      Financiële dienstverlening door de entiteit voor risico-acceptatie, bank, premiepensioeninstelling of verzekeraar,
      onderscheidenlijk het bijkantoor, aan leden van het orgaan dat belast is met het toezicht op het beleid en de
      algemene gang van zaken van de financiële onderneming, alsmede aan familieleden, niet zijnde personeelsleden,
      van personen die het beleid van de financiële onderneming bepalen, van groepsbestuurders en van leden van het
      orgaan dat belast is met het toezicht op het beleid en de algemene gang van zaken van de financiële onderneming,
      geschiedt uitsluitend in de normale uitoefening van het bedrijf en tegen de gebruikelijke commerciële voorwaarden
      en zekerheden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel11
  - number: '12.1'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie,
      bank, kredietunie, premiepensioeninstelling, verzekeraar, wisselinstelling of bijkantoor als bedoeld in
      [artikel 11, eerste lid][ref1], beschikt over procedures en maatregelen met betrekking tot de omgang met en
      vastlegging van incidenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, neemt naar aanleiding van een incident maatregelen die
      zijn gericht op het beheersen van de opgetreden risico’s en het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel12
  - number: '12.3'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, informeert de Nederlandsche Bank onverwijld omtrent
      incidenten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel12
  - number: '13.1'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-acceptatie,
      bank, kredietunie, premiepensioeninstelling, verzekeraar, wisselinstelling of bijkantoor als bedoeld in
      [artikel 11, eerste lid][ref1], maakt een onderbouwde beoordeling van de betrouwbaarheid van personen die zij wil
      benoemen in een integriteitsgevoelige functie.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '13.2'
    text: |-
      De financiële onderneming, onderscheidenlijk het bijkantoor, draagt zorg voor de beoordeling van de betrouwbaarheid
      van degenen die, anders dan op grond van een arbeidsovereenkomst, werkzaamheden in een integriteitgevoelige functie
      verrichten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel13
  - number: '13.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op een verzekeraar, niet zijnde een verzekeraar met beperkte
      risico-omvang, voor zover het een integriteitgevoelige functie betreft die is aan te merken als een sleutelfunctie
      als bedoeld in artikel 42, eerste lid, van de richtlijn solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel13
  - number: 13a.1
    text: |-
      Een verzekeraar draagt er zorg voor dat de betrouwbaarheid van de werknemers en andere natuurlijke personen die
      zich onder zijn verantwoordelijkheid rechtstreeks bezighouden met het verlenen van financiële diensten en van de
      feitelijk leidinggevenden die voor deze personen verantwoordelijk zijn, buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel13a
  - number: 13a.2
    text: |-
      Een persoon als bedoeld in het eerste lid is betrouwbaar, indien hij een verklaring omtrent het gedrag als bedoeld
      in de [Wet justitiële strafvorderlijke gegevens][ref1] over kan leggen, en hij niet failliet is verklaard, tenzij
      rehabilitatie als bedoeld in [artikel 212 van de Faillissementswet][ref2] heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel212
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '212'
  - number: 13a.3
    text: |-
      De verzekeraar legt alle relevante documentatie met betrekking tot de toepassing van dit artikel vast en houdt de
      documentatie bij.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel13a
  - number: '14.1'
    text: |-
      Een bank, levensverzekeraar, premiepensioeninstelling of bijkantoor als bedoeld in [artikel 11, eerste lid][ref1],
      beschikt met het oog op een integere uitoefening van het bedrijf over procedures en maatregelen met betrekking tot
      de acceptatie van cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '14.2'
    text: |-
      Onverminderd het bepaalde ingevolge de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1]
      beschikt een bank, levensverzekeraar, premiepensioeninstelling of bijkantoor als bedoeld in het eerste lid, over
      procedures en maatregelen met betrekking tot het vaststellen van de identiteit van cliënten en van de verificatie
      daarvan. De bank, levensverzekeraar, onderscheidenlijk het bijkantoor, accepteert een cliënt niet indien de
      identiteit niet is vastgesteld overeenkomstig het daarvoor opgestelde beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: '14.3'
    text: |-
      De financiële onderneming, bedoeld in het tweede lid, onderscheidenlijk het bijkantoor, beschikt met het oog op
      een integere uitoefeningvan het bedrijf over organisatorische en administratieve procedures en maatregelen die
      betrekking hebben op risicoclassificaties ten aanzien van cliënten, producten of diensten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel14
  - number: '14.4'
    text: |-
      De financiële onderneming, bedoeld in het tweede lid, onderscheidenlijk het bijkantoor, beschikt over procedures
      en maatregelen met betrekking tot de analyse van gegevens van cliënten, mede in relatie tot de door de cliënt
      afgenomen producten of diensten, en terzake van de detectie van afwijkende transactiepatronen. Aan de hand van
      voornoemde procedures en maatregelen bepaalt de financiële onderneming tevens de risico’s van bepaalde cliënten,
      producten of diensten voor de integere uitoefening van haar bedrijf.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel14
  - number: '14.5'
    text: |-
      De financiële onderneming, bedoeld in het tweede lid, onderscheidenlijk het bijkantoor, draagt zorg voor de
      documentatie en vastlegging met betrekking tot de acceptatie en indeling naar risico van cliënten, de identificatie
      en verificatie van de gegevens van cliënten en de bewaking van het handelen van cliënten. Dergelijke gegevens
      worden tot vijf jaar na de dienstverlening of het beëindigen van de relatie bewaard.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel14
  - number: '14.6'
    text: |-
      De Nederlandsche Bank kan met het oog op een integere uitoefening van het bedrijf regels stellen met betrekking
      tot het door banken en bijkantoren van banken als bedoeld in het eerste lid te voeren beleid met betrekking tot
      afgeschermde rekeningen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel14
  - number: '15.1'
    text: |-
      Een bank of bijkantoor van een bank als bedoeld in [artikel 11, eerste lid][ref1], beschikt over procedures met
      betrekking tot de verstrekking van back-to-back leningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '15.2'
    text: |-
      Indien de bank of het bijkantoor voornemens is een back-to-back lening te verstrekken, onderzoekt zij of het
      krediet voor legitieme doeleinden gebruikt zal worden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel15
  - number: '15.3'
    text: |-
      Indien er een back-to-back lening wordt verstrekt, legt de bank of het bijkantoor de overeenkomst met vermelding
      van de gestelde essentiële zekerheden, deugdelijk vast.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel15
  - number: '16.1'
    text: |-
      Een financiële onderneming of bijkantoor als bedoeld in [artikel 11, eerste lid][ref1], onderzoekt, op verzoek van
      de Nederlandsche Bank, of in haar administratie bepaalde personen of instellingen voorkomen die naar het oordeel
      van Onze Minister, in verband met vermoede terroristische activiteiten of daarmee verband houdende activiteiten, de
      integriteit van de financiële sector kunnen schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel11
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '11'
        hoofdstuk: '3'
  - number: '16.2'
    text: |-
      De financiële onderneming verstrekt de uitkomst van het in het eerste lid bedoelde onderzoek, binnen een door de
      Nederlandsche Bank te stellen termijn, aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel16
  - number: '17.1'
    text: |-
      De bedrijfsvoering van een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als
      bedoeld in [artikel 3:17, eerste lid][ref1], [3:23][ref2], [3:24a][ref3], [3:24b][ref4], [3:26][ref5] of
      [3:27 van de wet][ref6] omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 17.1.a
    text: een duidelijke, evenwichtige en adequate organisatiestructuur;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17
  - number: 17.1.b
    text: een duidelijke, evenwichtige en adequate verdeling van taken, bevoegdheden en verantwoordelijkheden;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17
  - number: 17.1.c
    text: een adequate vastlegging van rechten en verplichtingen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17
  - number: 17.1.d
    text: eenduidige rapportagelijnen; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17
  - number: 17.1.e
    text: een adequaat systeem van informatievoorziening en communicatie.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17
  - number: '17.2'
    text: |-
      De bedrijfsvoering is afgestemd op de aard, omvang, risico’s en complexiteit van de werkzaamheden van de financiële
      onderneming of bijkantoor.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17
  - number: '17.3'
    text: De bedrijfsvoering wordt op een inzichtelijke wijze vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17
  - number: '17.4'
    text: |-
      De effectiviteit van de organisatie-inrichting en van de procedures en maatregelen wordt ten minste jaarlijks
      op onafhankelijke wijze getoetst. Daartoe beschikt de financiële onderneming of het bijkantoor over een
      organisatieonderdeel dat deze interne controlefunctie uitoefent. De financiële onderneming of bijkantoor voorziet
      erin dat gesignaleerde tekortkomingen worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17
  - number: '17.5'
    text: |-
      De toepassing van het vierde lid op betaalinstellingen, elektronischgeldinstellingen of hun bijkantoren ziet tevens
      op het gebruik van hun betaaldienstagenten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17
  - number: 17a
    text: |-
      Het organisatieonderdeel, bedoeld in [artikel 17, vierde lid][ref1], van een bank als bedoeld in
      [artikel 3:17, eerste lid][ref2], of [3:23, tweede lid, van de wet][ref3] die in Nederland beleggingsdiensten mag
      verlenen of beleggingsactiviteiten mag verrichten, heeft als taak:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 17a.a
    text: |-
      het vaststellen en uitvoeren van een controleplan om de deugdelijkheid en effectiviteit van de systemen, interne
      controleprocedures en regels van de bank te onderzoeken en te beoordelen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17a
  - number: 17a.b
    text: het doen van aanbevelingen op basis van de resultaten van de werkzaamheden, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17a
  - number: 17a.c
    text: het controleren of aan deze aanbevelingen gevolg wordt gegeven; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17a
  - number: 17a.d
    text: |-
      het ten minste jaarlijks rapporteren aan de personen die het dagelijks beleid van de bank bepalen en aan het
      orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de algemene gang van zaken van de bank
      inzake aangelegenheden met betrekking tot de interne controle en de genomen maatregelen in geval van gesignaleerde
      tekortkomingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17a
  - number: 17aa.1
    text: |-
      Het organisatieonderdeel van een premiepensioeninstelling dat is belast met de uitoefening van de interne
      controlefunctie, bedoeld in [artikel 17, vierde lid][ref1], heeft in ieder geval als taak het interne
      controlesysteem en andere onderdelen van de bedrijfsvoering, inclusief de uitbesteding van werkzaamheden, te
      evalueren, om te beoordelen of deze adequaat en doeltreffend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17aa
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 17aa.2
    text: |-
      De premiepensioeninstelling stelt beleid op met betrekking tot de interne controle en draagt zorg voor de
      uitvoering van dat beleid. De premiepensioeninstelling evalueert het beleid ten minste eenmaal per drie jaar en
      past het beleid in geval van een belangrijke wijziging in het interne controlesysteem of met betrekking tot de
      overige onderdelen van de bedrijfsvoering zo spoedig mogelijk aan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17aa
  - number: 17aa.3
    text: |-
      De interne controlefunctie bij een premiepensioeninstelling wordt uitgeoefend door personen die geschikt
      zijn in verband met de uitoefening van deze functie en van wie de betrouwbaarheid buiten twijfel staat.
      [Artikel 3:9, tweede lid, van de wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17aa
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 17aa.4
    text: |-
      De premiepensioeninstelling stelt de persoon die verantwoordelijk is voor de interne controlefunctie in staat diens
      taken op een objectieve en eerlijke wijze uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17aa
  - number: 17aa.5
    text: |-
      De personen die betrokken zijn bij de uitoefening van de interne controlefunctie kunnen niet tevens de
      risicobeheerfunctie, bedoeld in [artikel 23, zesde lid][ref1], uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17aa
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 17ab.1
    text: |-
      De persoon die binnen een premiepensioeninstelling verantwoordelijk is voor de interne controlefunctie, bedoeld in
      [artikel 17aa, vierde lid][ref1], rapporteert periodiek en schriftelijk materiële bevindingen en doet aanbevelingen
      aan het bestuur van de premiepensioeninstelling naar aanleiding van de uitoefening van de interne controlefunctie.
      Indien de persoon die verantwoordelijk is voor de interne controlefunctie tevens bestuurder is van de
      premiepensioeninstelling, worden de materiële bevindingen en aanbevelingen tevens gericht aan het toezichthoudend
      orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17aa
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17ab
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 17aa
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 17ab.2
    text: |-
      Het bestuur draagt zorgt voor tijdige en passende maatregelen naar aanleiding van een rapportage of aanbeveling als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17ab
  - number: 17ab.3
    text: |-
      De persoon, bedoeld in het eerste lid, meldt het de Nederlandsche Bank zo spoedig mogelijk indien het bestuur van
      de premiepensioeninstelling niet tijdig passende maatregelen neemt, nadat het bestuur overeenkomstig het eerste lid
      op de hoogte is gesteld van:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17ab
  - number: 17ab.3.a
    text: |-
      een substantieel risico dat de premiepensioeninstelling niet zal voldoen aan een wettelijk vereiste en dit
      ernstige nadelige gevolgen kan hebben voor de belangen van de pensioendeelnemers, gewezen pensioendeelnemers,
      pensioengerechtigden of andere aanspraakgerechtigden; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17ab
  - number: 17ab.3.b
    text: een ernstige overtreding van een wettelijk vereiste dat van toepassing is op de premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17ab
  - number: 17ab.4
    text: |-
      De premiepensioeninstelling zorgt ervoor dat een persoon die op grond van het derde lid te goeder trouw en naar
      behoren een melding heeft gedaan bij de Nederlandsche Bank, niet wordt benadeeld als gevolg van de melding.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17ab
  - number: 17b
    text: |-
      De Nederlandsche Bank kan ter uitvoering van internationaal aanvaarde standaarden nadere regels stellen met
      betrekking tot de bedrijfsvoering van afwikkelondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17b
  - number: 17c.1
    text: |-
      Een bank of clearinginstelling als bedoeld in [artikel 17, eerste lid][ref1], beschikt over interne regelingen en
      procedures die zijn gericht op een doeltreffend en prudent bestuur van de onderneming, dat voldoet aan de vereisten
      in artikel 88, eerste lid, van de richtlijn kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 17c.2
    text: |-
      Een bank als bedoeld in [artikel 17, eerste lid][ref1], die significant is ingevolge [artikel 17d][ref2], beschikt
      over een benoemingscommissie waarvan de taken en bevoegdheden voldoen aan de vereisten in artikel 88, tweede lid,
      van de richtlijn kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel17d
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 17d
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 17d
    text: |-
      Een bank is, mede voor de toepassing van [artikel 3:8, vierde lid, van de wet][ref1], significant, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 17d.a
    text: |-
      zij op individuele basis een instelling van groot belang is op grond van de voorwaarden ingevolge artikel 6 van de
      verordening bankentoezicht; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17d
  - number: 17d.b
    text: |-
      zij door de Nederlandsche Bank, gelet op haar omvang, interne organisatie en de aard, reikwijdte en complexiteit
      van haar activiteiten als significant wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel17d
  - number: '18'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie, premiepensioeninstelling,
      verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in [artikel 17][ref1] beschikt
      over een adequate functiescheiding met het oog op een beheerste bedrijfsvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '19.1'
    text: |-
      De bedrijfsvoering van een betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit voor risico-
      acceptatie, bank, kredietunie, premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling
      of bijkantoor als bedoeld in [artikel 17][ref1] voorziet in een juiste, tijdige en volledige vastlegging van alle
      rechten en verplichtingen van de financiële onderneming of bijkantoor in een daartoe bestemde administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '19.2'
    text: |-
      De administratie, bedoeld in het eerste lid, van een premiepensioeninstelling is zodanig dat deze geen belemmering
      vormt of kan vormen voor de toepassing van het in [artikel 4:71a van de wet][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '19.3'
    text: |-
      Een verzekeraar met beperkte risico-omvang beschikt over een organisatie-onderdeel dat op onafhankelijke en
      effectieve wijze een actuariële functie uitoefent. Het organisatie-onderdeel heeft als taak de berekening van
      de technische voorzieningen te coördineren en te controleren en de personen die het dagelijks beleid van de
      verzekeraar bepalen te informeren over de adequaatheid en betrouwbaarheid van die berekening.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel19
  - number: '19.4'
    text: |-
      Het derde lid is op schadeverzekeraars alleen van toepassing voor zover deze verzekeringsovereenkomsten sluiten met
      een contractduur van meer dan vier jaar.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel19
  - number: '20.1'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie, premiepensioeninstelling,
      verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in [artikel 17][ref1] beschikt
      over een informatiesysteem dat een effectieve beheersing van de bedrijfsprocessen en de risico’s mogelijk maakt en
      dat voorziet in interne en externe informatiebehoeften.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '20.2'
    text: |-
      De financiële onderneming of bijkantoor beschikt over procedures en maatregelen om de integriteit, voortdurende
      beschikbaarheid en beveiliging van geautomatiseerde gegevensverwerking te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel20
  - number: '20.3'
    text: De functiescheidingen binnen de geautomatiseerde gegevensverwerking sluiten aan bij de organisatiestructuur.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel20
  - number: '21.1'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie, premiepensioeninstelling,
      verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in [artikel 17][ref1] beschikt
      over een organisatieonderdeel dat op onafhankelijke en effectieve wijze een compliancefunctie uitoefent. Het
      organisatieonderdeel heeft als taak het controleren van de naleving van wettelijke regels en van interne regels die
      de financiële onderneming of bijkantoor zelf heeft opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '21.2'
    text: |-
      Het organisatieonderdeel, bedoeld in het eerste lid, van een bank als bedoeld in [artikel 3:17, eerste lid][ref1],
      of [3:23, tweede lid, van de wet][ref2] die in Nederland beleggingsdiensten mag verlenen of beleggingsactiviteiten
      mag verrichten, heeft voorts als taak:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 21.2.a
    text: |-
      het adviseren van de personen die verantwoordelijk zijn voor het verlenen van beleggingsdiensten of het verrichten
      van beleggingsactiviteiten bij de naleving van wettelijke regels en interne regels;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel21
  - number: 21.2.b
    text: het toezien op de deugdelijkheid en effectiviteit van de interne regels en procedures;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel21
  - number: 21.2.c
    text: |-
      het beoordelen van de effectiviteit van de procedures die zijn opgesteld en maatregelen die zijn genomen om
      gesignaleerde onvolkomenheden bij de naleving van wettelijke regels en interne regels op te heffen; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel21
  - number: 21.2.d
    text: |-
      het ten minste jaarlijks rapporteren aan de personen die het dagelijks beleid van de bank bepalen en aan het
      orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de algemene gang van zaken van de bank inzake
      aangelegenheden met betrekking tot de naleving van wettelijke regels en interne regels. In de jaarlijkse rapportage
      wordt met name vermeld of maatregelen zijn genomen in het geval van gesignaleerde tekortkomingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel21
  - number: '21.3'
    text: |-
      Het organisatieonderdeel van een bank als bedoeld in het tweede lid beschikt over de nodige autoriteit, middelen,
      deskundigheid en toegang tot alle noodzakelijke informatie om haar taken onafhankelijk en effectief te kunnen
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel21
  - number: '22'
    text: |-
      De opdracht tot onderzoek van de jaarrekening van een betaalinstelling, clearinginstelling,
      elektronischgeldinstelling, bank, kredietunie, premiepensioeninstelling, verzekeraar met beperkte risico-omvang of
      bijkantoor als bedoeld in [artikel 17][ref1] aan de externe accountant voorziet in een toetsing en beoordeling op
      hoofdlijnen met betrekking tot de toereikendheid van de organisatie-inrichting en risicobeheersing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 22a
    text: |-
      De werknemers van een bank met zetel in Nederland die in Nederland beleggingsdiensten mag verlenen of
      beleggingsactiviteiten mag verrichten en andere personen die door de bank zijn belast met het verrichten
      van zodanige werkzaamheden beschikken over de nodige vakbekwaamheid en deskundigheid om de hun toevertrouwde
      verantwoordelijkheden uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel22a
  - number: '23.1'
    text: |-
      Een bank, beheerder van een icbe, beleggingsonderneming, betaalinstelling, clearinginstelling,
      elektronischgeldinstelling, kredietunie, premiepensioeninstelling, verzekeraar met beperkte risico-omvang,
      wisselinstelling of bijkantoor als bedoeld in de [artikelen 3:17, eerste en derde lid][ref1],[ 3:22][ref2],
      [3:23][ref3], [3:24a][ref4], [3:24b][ref5], [3:24c][ref6], [3:26][ref7] of [3:27 van de wet][ref8] voert beleid
      gericht op het beheersen van relevante risico’s.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref8
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '23.2'
    text: |-
      Onder relevante risico’s, bedoeld in het eerste lid, worden in het bijzonder verstaan het concentratierisico,
      krediet- en tegenpartijrisico, liquiditeitsrisico, marktrisico, operationeel risico, renterisico voortvloeiend
      uit niet-handelsactiviteiten, restrisico, risico van buitensporige hefboomwerking, securitisatierisico,
      verzekeringsrisico en afkooprisico.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
  - number: '23.3'
    text: |-
      Het beleid wordt vastgelegd in procedures en maatregelen ter beheersing van relevante risico’s en geïntegreerd in
      de bedrijfsprocessen. De procedures en maatregelen die zijn gericht op de beheersing van het liquiditeitsrisico
      hebben betrekking op het beheer van de actuele en toekomstige netto financiële positie en behoeften.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
  - number: '23.4'
    text: |-
      De procedures en maatregelen, bedoeld in het derde lid, bestaan onder meer uit autorisatieprocedures,
      limietstellingen, limietbewaking en procedures en maatregelen voor noodsituaties en zijn afgestemd op de aard, de
      omvang, het risicoprofiel en de complexiteit van de werkzaamheden van de financiële onderneming of bijkantoor.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
  - number: '23.5'
    text: |-
      De procedures en maatregelen, bedoeld in het derde lid, worden vastgelegd en ter kennis gebracht van alle relevante
      bedrijfsonderdelen van de financiële onderneming of het bijkantoor.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
  - number: '23.6'
    text: |-
      De financiële onderneming, niet zijnde een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht
      beleggingsondernemingen, heeft een onafhankelijke risicobeheerfunctie die op systematische wijze een onafhankelijk
      risicobeheer uitvoert dat gericht is op het identificeren, meten en evalueren van de risico’s waaraan de financiële
      onderneming of het bijkantoor is of kan worden blootgesteld. Het risicobeheer wordt zowel uitgevoerd ten aanzien
      van de financiële onderneming of het bijkantoor als geheel als ten aanzien van de onderscheiden bedrijfsonderdelen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
  - number: '23.7'
    text: |-
      De risicobeheerfunctie beschikt over de nodige autoriteit en toegang tot alle noodzakelijke informatie om haar
      taken te kunnen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
  - number: '23.8'
    text: |-
      Een bank, beleggingsonderneming onder de verordening kapitaalvereisten of clearinginstelling als bedoeld in
      [artikel 3:17, eerste of derde lid][ref1], [3:23][ref2] of [3:27 van de wet][ref3] houdt in aanvulling op het
      tweede lid rekening met de risico’s die voortvloeien uit de macro-economische omgeving waarin de onderneming actief
      is en die verband houden met de stand van de conjunctuurcyclus.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '23.9'
    text: |-
      Een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen als bedoeld in
      [artikel 3:17, derde lid, van de wet][ref1], niet zijnde een kleine en niet-verweven beleggingsonderneming als
      bedoeld in artikel 12, eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen, houdt
      in aanvulling op het tweede lid tevens rekening met de risico’s die voortvloeien uit de macro-economische omgeving
      waarin zij actief is en die verband houden met haar bedrijfscyclus en de risico’s die zij voor anderen inhoudt of
      kan inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '23.10'
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 3:22 van de wet][ref1] waarop, zou zij haar zetel hebben in een
      lidstaat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 23.10.a
    text: |-
      de verordening kapitaalvereisten van toepassing zou zijn, voldoet aan de op een beleggingsonderneming onder de
      verordening kapitaalvereisten van toepassing zijnde verplichting bedoeld in het achtste lid; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
  - number: 23.10.b
    text: |-
      de verordening prudentiële vereisten voor beleggingsondernemingen van toepassing zou zijn, voldoet aan de op een
      beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen van toepassing zijnde
      verplichting bedoeld in het negende lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23
  - number: 23a
    text: |-
      Het beleid en de procedures en maatregelen, bedoeld in [artikel 23, eerste en derde tot en met vijfde lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23a.a
    text: |-
      van een bank, een beleggingsonderneming onder de verordening kapitaalvereisten, een beleggingsonderneming als
      bedoeld in [artikel 23, tiende lid, aanhef en onderdeel a][ref1], of een clearinginstelling voldoen aan de op de
      betrokken onderneming van toepassing zijnde technische criteria voor de organisatie en behandeling van risico’s in
      de artikelen 79 tot en met 87 van de richtlijn kapitaalvereisten;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23a.b
    text: |-
      van een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen en een
      beleggingsonderneming als bedoeld in [artikel 23, tiende lid, aanhef en onderdeel b][ref1], voldoen aan de
      technische criteria voor de organisatie en behandeling van risico’s, bedoeld in de artikelen 26, eerste lid,
      onderdelen b en c, derde lid, en 29, eerste lid, van de richtlijn prudentieel toezicht beleggingsondernemingen
      en indien de beleggingsonderneming kwalificeert als kleine en niet-verweven beleggingsonderneming als bedoeld in
      artikel 12, eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen aan die bedoeld in
      artikel 29, eerste lid, onderdelen a, c, en d, van die richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23.0a
    text: |-
      In aanvulling op artikel 23, eerste lid, omvat het risicobeheerbeleid van een beheerder van een icbe procedures
      ter beheersing van duurzaamheidsrisico’s als bedoeld in artikel 2, onder 22, van [Verordening (EU) 2019/2088]
      (32088R2019) van het Europees Parlement en de Raad van 27 november 2019 betreffende informatieverschaffing over
      duurzaamheid in de financiëledienstensector (PbEU 2019, L 317).
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23.0a
  - number: 23aa.1
    text: |-
      De Nederlandsche Bank kan een bank of beleggingsonderneming onder de verordening kapitaalvereisten verplichten
      de gestandaardiseerde methode, bedoeld in artikel 84, eerste lid, van de richtlijn kapitaalvereisten te gebruiken
      indien zij van oordeel is dat de interne systemen die de bank of beleggingsonderneming heeft voor de beoordeling
      van renterisico’s als bedoeld in dat artikellid niet adequaat zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23aa
  - number: 23aa.2
    text: |-
      De Nederlandsche Bank kan een kleine en niet-complexe instelling, als bedoeld in artikel 4, eerste lid,
      onderdeel 145 van de verordening kapitaalvereisten, verplichten de gestandaardiseerde methode te gebruiken indien
      zij van oordeel is dat de vereenvoudigde gestandaardiseerde methode, bedoeld in artikel 84, eerste lid, van de
      richtlijn kapitaalvereisten niet adequaat is voor het ondervangen van renterisico’s als bedoeld in dat artikellid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23aa
  - number: 23b.1
    text: |-
      Het bestuur van een bank, beleggingsonderneming of clearinginstelling als bedoeld in
      [artikel 23, eerste lid][ref1], en, indien aanwezig, het orgaan dat is belast met toezicht op het beleid en de
      algemene gang van zaken van de onderneming:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23b.1.a
    text: |-
      zijn betrokken bij het beleid gericht op het beheersen van relevante risico’s overeenkomstig artikel 76, eerste en
      tweede lid, van de richtlijn kapitaalvereisten, dan wel, in het geval van een beleggingsonderneming in de zin van
      de richtlijn prudentieel toezicht beleggingsondernemingen, overeenkomstig artikel 28, eerste en tweede lid, van de
      richtlijn prudentieel toezicht beleggingsondernemingen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23b
  - number: 23b.1.b
    text: |-
      worden daarbij bijgestaan en geadviseerd door een risicocommissie overeenkomstig artikel 76, derde lid, van
      de richtlijn kapitaalvereisten, dan wel, in het geval van een beleggingsonderneming in de zin van de richtlijn
      prudentieel toezicht beleggingsondernemingen, overeenkomstig artikel 28, vierde lid, van de richtlijn prudentieel
      toezicht beleggingsondernemingen; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23b
  - number: 23b.1.c
    text: |-
      hebben voldoende toegang tot informatie betreffende de risicosituatie van de financiële onderneming, de
      risicobeheerfunctie en de adviezen van externe deskundigen overeenkomstig artikel 76, vierde lid, van de richtlijn
      kapitaalvereisten, dan wel, in het geval van een beleggingsonderneming in de zin van de richtlijn prudentieel
      toezicht beleggingsondernemingen, overeenkomstig artikel 28, derde en vijfde lid, van de richtlijn prudentieel
      toezicht beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23b
  - number: 23b.2
    text: |-
      De risicobeheerfunctie van een bank, beleggingsonderneming onder de verordening kapitaalvereisten of
      clearinginstelling als bedoeld in het eerste lid is ingericht overeenkomstig artikel 76, vijfde lid, van de
      richtlijn kapitaalvereisten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23b
  - number: 23b.3
    text: |-
      Het eerste lid, onderdeel b, vindt slechts toepassing, indien de bank of beleggingsonderneming
      onder de verordening kapitaalvereisten significant is ingevolge [artikel 17d][ref1], respectievelijk
      [artikel 31f van het Besluit gedragstoezicht financiële ondernemingen Wft][ref2] dan wel indien de
      beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen niet voldoet
      aan de criteria bedoeld in artikel 32, vierde lid, onderdeel a, van de richtlijn prudentieel toezicht
      beleggingsondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17d
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel31f
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 17d
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 31f
  - number: 23b.4
    text: |-
      [Artikel 23, tiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23b.5
    text: |-
      Het eerste en derde lid zijn niet van toepassing op een beleggingsonderneming in de zin van de richtlijn
      prudentieel toezicht beleggingsondernemingen die kwalificeert als kleine en niet-verweven beleggingsonderneming als
      bedoeld in artikel 12, eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23b
  - number: 23c.1
    text: |-
      Een clearinginstelling als bedoeld in [artikel 23, eerste lid][ref1], beschikt over een plan dat voorziet in een
      duurzaam herstel van de financiële positie van de onderneming na een aanzienlijke verslechtering van de financiële
      positie.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23c.2
    text: |-
      Het plan, bedoeld in het eerste lid, wordt afgestemd op de aard, de omvang, het risicoprofiel en de complexiteit
      van de werkzaamheden van de clearinginstelling.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23c
  - number: 23c.3
    text: De Nederlandsche Bank kan nadere regels stellen met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23c
  - number: 23d.1
    text: |-
      Een bank of beleggingsonderneming als bedoeld in [artikel 3A:2 van de wet][ref1] die geen deel uitmaakt van een
      groep als bedoeld in [artikel 3A:1 van de wet][ref2], beschikt over een herstelplan dat door de Nederlandsche Bank
      is goedgekeurd en dat voorziet in maatregelen die de onderneming in staat stellen haar financiële positie na een
      aanzienlijke verslechtering ervan te herstellen. Een herstelplan wordt ter goedkeuring voorgelegd na vaststelling
      door het bestuur van de onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 23d.2
    text: |-
      Het herstelplan voldoet aan de eisen ingevolge de artikelen 5, derde tot en met zesde en tiende lid, en 9, eerste
      lid, eerste alinea, van de richtlijn herstel en afwikkeling van banken en beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23d
  - number: 23d.3
    text: |-
      Het herstelplan wordt ten minste eenmaal per jaar herzien en voorts wanneer zich een wezenlijke verandering in de
      organisatie of bedrijfsvoering van de onderneming voordoet die noodzaakt tot aanpassing van het plan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23d
  - number: 23d.4
    text: |-
      De Nederlandsche Bank kan toestaan dat het bepaalde in het tweede of derde lid op vereenvoudigde wijze wordt
      toegepast.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23d
  - number: 23d.5
    text: |-
      De Nederlandsche Bank kan, indien zij de consoliderende toezichthouder is, bedoeld in artikel 4, eerste lid,
      onderdeel 41, van de verordening kapitaalvereisten, besluiten dat een bank of beleggingsonderneming als bedoeld
      in [artikel 3A:2 van de wet][ref1] die deel uitmaakt van een groep als bedoeld in [artikel 3A:1 van de wet][ref2],
      beschikt over een eigen herstelplan overeenkomstig het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 23d.6
    text: De Nederlandse Bank kan nadere regels stellen met betrekking tot het tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23d
  - number: 23e.1
    text: |-
      Een EU-moederonderneming met zetel in Nederland van een groep als bedoeld in [artikel 3A:1 van de wet][ref1]
      beschikt over een herstelplan dat door de consoliderende toezichthouder, bedoeld in artikel 4, eerste lid,
      onderdeel 41, van de verordening kapitaalvereisten, is goedgekeurd en dat voorziet in maatregelen met betrekking
      tot de EU-moederonderneming of haar dochterondernemingen, die de groep in staat stellen haar financiële positie
      na een aanzienlijke verslechtering ervan te herstellen. Een herstelplan wordt ter goedkeuring voorgelegd na
      vaststelling door het bestuur van de onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 23e.2
    text: |-
      Het groepsherstelplan voldoet aan de eisen ingevolge de artikelen 5, derde tot en met zesde en tiende lid, 7,
      vierde tot en met zesde lid, en 9, eerste lid, eerste alinea, van de richtlijn herstel en afwikkeling van banken
      en beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23e
  - number: 23e.3
    text: |-
      [Artikel 23d, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23d
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 23d
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23e.4
    text: |-
      Een groepsherstelplan dat is goedgekeurd door de consoliderende toezichthouder in een andere lidstaat, is op
      entiteiten van een groep met zetel in Nederland van toepassing, tenzij de Nederlandsche Bank overeenkomstig artikel
      8, vierde lid, van de richtlijn herstel en afwikkeling van banken en beleggingsondernemingen besluit dat deze
      entiteiten moeten beschikken over een eigen herstelplan, waarop [artikel 23d][ref1] van overeenkomstige toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23d
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 23d
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23e.5
    text: De Nederlandsche Bank kan nadere regels stellen met betrekking tot het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23e
  - number: 23f.1
    text: |-
      De inrichting van de bedrijfsvoering van een onderneming of entiteit als bedoeld in de
      [artikelen 23d, eerste of vijfde lid][ref1], of [23e, eerste of vierde lid][ref2], is in overeenstemming met het
      herstelplan en waarborgt dat het herstelplan zonder wezenlijke belemmeringen ten uitvoer kan worden gelegd, in
      ieder geval met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23d
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel23e
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23f
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 23d
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 23e
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23f.1.a
    text: het risicoprofiel van de onderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23f
  - number: 23f.1.b
    text: de mogelijkheden tot tijdige herkapitalisatie;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23f
  - number: 23f.1.c
    text: de strategie en structuur van de onderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23f
  - number: 23f.1.d
    text: |-
      de financieringsstrategie, teneinde de weerbaarheid van de kernbedrijfsonderdelen en kritieke functies te
      waarborgen; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23f
  - number: 23f.1.e
    text: de governancestructuur.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23f
  - number: 23f.2
    text: |-
      De bedrijfsvoering voorziet in een periodieke evaluatie van de indicatoren, bedoeld in artikel 9, eerste lid,
      van de richtlijn herstel en afwikkeling van banken en beleggingsondernemingen, voor het uitvoeren van in het
      herstelplan opgenomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23f
  - number: 23f.3
    text: De Nederlandsche Bank kan nadere regels stellen met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23f
  - number: 23g.1
    text: |-
      De Nederlandsche Bank beoordeelt een herstelplan of groepsherstelplan dat haar goedkeuring behoeft binnen zes
      maanden na de voorlegging ervan, overeenkomstig artikel 6, tweede en derde lid, van de richtlijn herstel en
      afwikkeling van banken en beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23g
  - number: 23g.2
    text: |-
      De beoordeling van een groepsherstelplan geschiedt overeenkomstig de afstemmingsprocedure van artikel 8 van de
      richtlijn herstel en afwikkeling van banken en beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23g
  - number: 23g.3
    text: |-
      Indien het herstelplan wezenlijke tekortkomingen vertoont of indien er wezenlijke belemmeringen zijn voor
      de tenuitvoerlegging van het herstelplan, wordt goedkeuring aan het plan onthouden. Binnen twee maanden legt
      de indiener van het herstelplan opnieuw een herstelplan ter goedkeuring voor, waarbij de bij de afwijzing
      geconstateerde tekortkomingen of belemmeringen zijn weggenomen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23g
  - number: 23g.4
    text: De Nederlandsche Bank kan nadere regels stellen met betrekking tot het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23g
  - number: 23h
    text: |-
      Indien een onderneming, entiteit of groep als bedoeld in de [artikelen 23d, eerste of vijfde lid][ref1], of
      [23e, eerste of vierde lid][ref2], uitvoering geeft aan maatregelen die zijn opgenomen in het herstelplan
      of deze maatregelen achterwege laat in afwijking van de uitkomsten van de indicatoren, bedoeld in
      [artikel 23f, tweede lid][ref3], doet de onderneming, de entiteit of de EU-moederonderneming van de groep daarvan
      onverwijld mededeling aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23d
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel23e
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel23f
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23h
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 23d
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 23e
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: 23f
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23i.1
    text: |-
      Een bank of beleggingsonderneming als bedoeld in [artikel 23, eerste lid][ref1], beschikt over passende procedures
      die haar werknemers in staat stellen om door hen geconstateerde mogelijke of feitelijke overtredingen van de
      verordening kapitaalvereisten, de verordening prudentiële vereisten voor beleggingsondernemingen of het bij of
      krachtens [hoofdstuk 1.7][ref2] en het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref3]
      bepaalde intern te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk1.7
      [ref3]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020368
        hoofdstuk: '1.7'
      - id: ref3
        bwb_id: BWBR0020368
  - number: 23i.2
    text: |-
      Deze procedures voldoen aan de vereisten in artikel 71, tweede lid, onderdelen b, c en d, en derde lid, van de
      richtlijn kapitaalvereisten, of, in het geval van beleggingsondernemingen in de zin van de richtlijn prudentieel
      toezicht beleggingsondernemingen, aan de vereisten in artikel 22, eerste lid, onderdelen b, c en d, van de
      richtlijn prudentieel toezicht beleggingsondernemingen. [Artikel 23, tiende lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23j.1
    text: |-
      De beheerder van een icbe vermeldt in het beleid, bedoeld in [artikel 23, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23j.1.a
    text: |-
      de technieken, instrumenten en regelingen om te allen tijde de risico’s te kunnen meten en beheren waaraan elke
      door hem beheerde instelling voor collectieve belegging in effecten is of zou kunnen worden blootgesteld;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
  - number: 23j.1.b
    text: de verantwoordelijkheden binnen de organisatie van de beheerder met betrekking tot het risicobeheer; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
  - number: 23j.1.c
    text: |-
      de voorwaarden, inhoud en frequentie van de rapportage door de risicobeheerfunctie, bedoeld in
      [artikel 23, zesde lid][ref1], aan de personen die het dagelijks beleid van de beheerder van de icbe bepalen en
      aan het orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de algemene gang van zaken van de
      beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23j.2
    text: |-
      De procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref1], stellen een beheerder van een icbe in
      staat:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23j.2.a
    text: |-
      te allen tijde de risico’s te kunnen meten waaraan de instelling voor collectieve belegging in effecten wordt of
      zou kunnen worden blootgesteld; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
  - number: 23j.2.b
    text: |-
      de naleving van limieten voor het totale risico en het tegenpartijrisico voor elke door hem
      beheerde instelling voor collectieve belegging in effecten, bedoeld in de [artikelen 133][ref1] en
      [134 van het Besluit gedragstoezicht financiële ondernemingen Wft][ref2], te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel134
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '133'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '134'
  - number: 23j.3
    text: 'Een beheerder van een icbe neemt voor de toepassing van het tweede lid de volgende maatregelen:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
  - number: 23j.3.a
    text: |-
      zorgen voor procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref1], die noodzakelijk zijn om te
      garanderen dat de risico’s van ingenomen posities en het aandeel van deze posities in het totale risicoprofiel
      nauwkeurig en op basis van degelijke en betrouwbare gegevens worden gemeten en dat deze procedures en maatregelen
      op adequate wijze zijn gedocumenteerd;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23j.3.b
    text: |-
      zorgen dat in de procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref1], voor de beoordeling van de
      kredietwaardigheid van de activa van de icbe niet uitsluitend of mechanisch wordt uitgegaan van ratings, uitgegeven
      door een ratingbureau;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23j.3.c
    text: |-
      in voorkomend geval, achteraf uitvoeren van periodieke tests om de geldigheid te evalueren van regels met
      betrekking tot risicometingregelingen die modelmatige prognoses en ramingen omvatten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
  - number: 23j.3.d
    text: |-
      in voorkomend geval, uitvoeren van periodieke stresstests en scenarioanalyses om de eventueel uit wisselende
      marktomstandigheden voortvloeiende risico’s aan te pakken die negatieve gevolgen voor de instelling voor
      collectieve belegging in effecten kunnen hebben;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
  - number: 23j.3.e
    text: |-
      het opzetten, implementeren en in stand houden van een gedocumenteerd systeem van interne limieten voor de
      maatregelen die worden genomen om de relevante risico’s voor elke beheerde instelling voor collectieve belegging
      in effecten te beheren en te controleren, waarbij rekening wordt gehouden met relevante risico’s als bedoeld in
      [artikel 23, tweede lid][ref1], en waarbij overeenstemming met het risicoprofiel van de instelling voor collectieve
      belegging in effecten wordt gewaarborgd;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 23j.3.f
    text: |-
      zorgen dat voor elke door hem beheerde instelling voor collectieve belegging in effecten de huidige risico-omvang
      voldoet aan het risicolimietensysteem, bedoeld in onderdeel d; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
  - number: 23j.3.g
    text: |-
      opzetten, implementeren en in stand houden van adequate procedures die in geval van feitelijke en voorzienbare
      inbreuken op het risicolimietensysteem van de instelling voor collectieve belegging in effecten tot tijdige
      herstelmaatregelen in belang van de deelnemers leiden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel23j
  - number: '24.1'
    text: |-
      Een bank, beheerder van een icbe, beleggingsonderneming, betaalinstelling, clearinginstelling,
      elektronischgeldinstelling, kredietunie, premiepensioeninstelling, verzekeraar met beperkte risico-omvang,
      wisselinstelling of bijkantoor als bedoeld in [artikel 23, eerste lid][ref1], ziet er op systematische wijze
      op toe dat de procedures en maatregelen, bedoeld in artikel 23, derde lid, worden nageleefd en zorgt ervoor dat
      gesignaleerde tekortkomingen of gebreken worden opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '24.2'
    text: |-
      Een betaaldienstverlener die betaaldiensten verleent als bedoeld onder 7 van de bijlage bij de
      richtlijn betaaldiensten, beschikt over een beroepsaansprakelijkheidsverzekering, of over een andere
      vergelijkbare waarborg, tegen aansprakelijkheid ingevolge de artikelen [528][ref1], [545a][ref2] of
      [547 van boek 7 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel528
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel545a
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel547
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '528'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 545a
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '547'
  - number: '24.3'
    text: |-
      Een betaaldienstverlener die betaaldiensten verleent als bedoeld onder 8 van de bijlage bij de richtlijn
      betaaldiensten, beschikt over een verzekering, of over een andere vergelijkbare waarborg, tegen aansprakelijkheid
      jegens de rekeninghoudende betaaldienstverlener of de betaaldienstgebruiker als gevolg van niet-toegestane of
      frauduleuze toegang tot of niet-toegestaan of frauduleus gebruik van betaalrekeninginformatie.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24
  - number: 24a.1
    text: |-
      Een bank of beleggingsonderneming als bedoeld in
      [artikel 23, achtste lid en tiende lid, aanhef en onderdeel a][ref1], beschikt over solide, doeltreffende en
      alomvattende strategieën en procedures aan de hand waarvan zij doorlopend nagaat of en ervoor zorgt dat de hoogte,
      samenstelling en verdeling van haar toetsingsvermogen aansluiten op de omvang en de aard van haar de korte- en
      langetermijnrisico’s waaraan zij blootstaat of zou kunnen blootstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24a.2
    text: |-
      Een verzekeraar met beperkte risico-omvang gaat regelmatig na hoe zijn solvabiliteit zich verhoudt tot de korte- en
      langetermijnrisico’s waaraan hij blootstaat of zou kunnen blootstaan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24a
  - number: 24a1.1
    text: |-
      Een beleggingsonderneming als bedoeld in [artikel 23, negende lid en tiende lid, aanhef en onderdeel b][ref1],
      beschikt over solide, doeltreffende en allesomvattende strategieën en procedures aan de hand waarvan zij doorlopend
      nagaat of en ervoor zorgt dat de hoogte, samenstelling en verdeling van haar toetsingsvermogen en haar liquide
      activa aansluiten op de omvang en de aard van de risico’s waaraan zij blootstaat, zou kunnen blootstaan en die zij
      voor anderen kan inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24a1
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24a1.2
    text: |-
      De Nederlandsche Bank kan categorieën beleggingsondernemingen in de zin van de richtlijn prudentieel toezicht
      beleggingsondernemingen die kwalificeren als kleine en niet-verweven beleggingsonderneming als bedoeld in artikel
      12, eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen, verplichten te voldoen aan
      het eerste lid, indien zij dit passend acht.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24a1
  - number: 24a2.1
    text: |-
      Indien een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen
      die eerst niet kwalificeerde als kleine en niet-verweven beleggingsonderneming als bedoeld in artikel 12,
      eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen, op enig moment wel als
      zodanig kwalificeert dan mag zij aan de [artikelen 23][ref1], [23a][ref2] en [23b][ref3] van dit besluit, de
      [artikelen 29a, derde lid][ref4], en [31ga van het Besluit Gedragstoezicht financiële ondernemingen Wft](onbekend)
      en [artikel 3 van het Besluit uitvoering publicatieverplichtingen richtlijnen kapitaalvereisten][ref5] en
      prudentieel toezicht beleggingsondernemingen voldoen als kleine en niet-verweven beleggingsonderneming zodra een
      periode van zes aaneengesloten maanden is verstreken vanaf de datum waarop zij voor het eerst als zodanig heeft
      gekwalificeerd, zij gedurende die periode doorlopend als zodanig heeft gekwalificeerd en mits zij de Nederlandsche
      Bank daarvan in kennis heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel23a
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel23b
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel29a
      [ref5]: https://wetten.overheid.nl/BWBR0035575#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24a2
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 23a
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: 23b
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: 29a
      - id: ref5
        bwb_id: BWBR0035575
        artikel: '3'
  - number: 24a2.2
    text: |-
      Indien een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen
      niet langer kwalificeert als kleine en niet-verweven beleggingsonderneming als bedoeld in artikel 12,
      eerste lid, van de verordening prudentiële vereisten voor beleggingsondernemingen, dan stelt zij de
      Nederlandsche Bank daarvan in kennis en voldoet zij binnen twaalf maanden na de datum waarop zij niet
      meer als zodanig kwalificeert aan de [artikelen 23][ref1], [23a][ref2] en [23b][ref3] van dit besluit, de
      [artikelen 29a, derde lid][ref4], en [31ga van het Besluit Gedragstoezicht financiële ondernemingen Wft](onbekend)
      en [artikel 3 van het Besluit uitvoering publicatieverplichtingen richtlijnen kapitaalvereisten][ref5] en
      prudentieel toezicht beleggingsondernemingen, als beleggingsonderneming in de zin van de richtlijn prudentieel
      toezicht beleggingsondernemingen niet zijnde een kleine en niet-verweven beleggingsonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel23a
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel29a
      [ref5]: https://wetten.overheid.nl/BWBR0035575#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24a2
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 23a
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: 29a
      - id: ref5
        bwb_id: BWBR0035575
        artikel: '3'
  - number: 24b.1
    text: |-
      Het risicobeheer, bedoeld in [artikel 23, zesde lid][ref1], van een bank die in Nederland
      beleggingsdiensten mag verlenen of beleggingsactiviteiten mag verrichten, een bank als bedoeld in
      [artikel 3:23, tweede lid, van de wet][ref2], een beheerder van een icbe, een beleggingsonderneming onder de
      verordening kapitaalvereisten en een beleggingsonderneming als bedoeld in [artikel 3:22 van de wet][ref3], waarop,
      zou zij haar zetel hebben in een lidstaat de verordening kapitaalvereisten van toepassing zou zijn oefent controle
      uit op:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 24b.1.a
    text: |-
      de deugdelijkheid en effectiviteit van de door de bank, beheerder van een icbe of beleggingsonderneming
      vastgestelde procedures en maatregelen, bedoeld in [artikel 23, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24b.1.b
    text: |-
      de mate waarin de bank, beheerder van een icbe of beleggingsonderneming en haar medewerkers de procedures en
      maatregelen, bedoeld in [artikel 23, derde lid][ref1], naleven; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24b.1.c
    text: |-
      de deugdelijkheid en effectiviteit van de maatregelen die zijn genomen om gesignaleerde tekortkomingen of gebreken
      op te heffen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
  - number: 24b.2
    text: |-
      Het risicobeheer rapporteert ten minste jaarlijks aan personen die het dagelijks beleid van de bank, beheerder of
      beleggingsonderneming bepalen en aan het orgaan, indien aanwezig, dat is belast met toezicht op het beleid en de
      algemene gang van zaken van de bank, beheerder of beleggingsonderneming. In de jaarlijkse rapportage wordt met name
      aangegeven of maatregelen zijn genomen in het geval van gesignaleerde onvolkomenheden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
  - number: 24b.3
    text: |-
      Het risicobeheer van een beheerder van een icbe brengt regelmatig verslag uit aan de personen die het dagelijks
      beleid van de beheerder bepalen en aan het orgaan, indien aanwezig, dat is belast met het toezicht op het beleid en
      de algemene gang van zaken van de beheerder over:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
  - number: 24b.3.a
    text: |-
      de consistentie tussen de actuele omvang van het risico dat elke door hem beheerde instelling voor collectieve
      belegging in effecten loopt, en het risicoprofiel dat voor deze instelling voor collectieve belegging in effecten
      is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
  - number: 24b.3.b
    text: |-
      de nakoming van het relevante risicolimietensysteem door elke door hem beheerde instelling voor collectieve
      belegging in effecten; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
  - number: 24b.3.c
    text: |-
      de deugdelijkheid en effectiviteit van de risicobeheerprocedure, waarbij met name wordt aangegeven of passende
      maatregelen zijn genomen in het geval van gesignaleerde onvolkomenheden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
  - number: 24b.4
    text: |-
      Het risicobeheer van een beheerder van een icbe brengt aan de personen die het dagelijks beleid bepalen van de
      beheerder:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
  - number: 24b.4.a
    text: |-
      advies uit betreffende de identificatie van het risicoprofiel van elke door de beheerder beheerde instelling voor
      collectieve belegging in effecten; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
  - number: 24b.4.b
    text: |-
      regelmatig verslag uit over de actuele omvang van het risico dat elke door de beheerder beheerde instelling
      voor collectieve belegging in effecten loopt en feitelijke of voorzienbare inbreuken op de limieten van de
      desbetreffende instelling voor collectieve belegging in effecten opdat onmiddellijk passende maatregelen kunnen
      worden ondernomen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
  - number: 24b.5
    text: |-
      Het risicobeheer van een beheerder van een icbe onderzoekt en ondersteunt in voorkomend geval de
      procedures en maatregelen, bedoeld in de [artikelen 34, eerste lid, onderdeel g, en derde lid][ref1], en
      [34a van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel34a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: 34a
  - number: '25'
    text: |-
      Indien een beleggingsonderneming, betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank of
      bijkantoor als bedoeld in [artikel 23, eerste lid][ref1], gebruik maakt van intern ontwikkelde modellen, beoordeelt
      deze die modellen en de gehanteerde veronderstellingen en variabelen op systematische wijze op validiteit, onder
      meer door voorspellingen van het model te vergelijken met de werkelijke uitkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 25a
    text: |-
      De Nederlandsche Bank kan een entiteit als bedoeld in [artikel 3A:2 van de wet][ref1] verplichten gedetailleerde
      gegevens bij te houden over financiële contracten als bedoeld in artikel 2, eerste lid, onderdeel 100, van de
      richtlijn herstel en afwikkeling van banken en beleggingsondernemingen waarbij zij partij is, indien dit nodig is
      met het oog op:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 25a.a
    text: |-
      het opstellen of het uitvoeren van een herstelplan als bedoeld in de [artikelen 23d][ref1] of [23e][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23d
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel23e
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 23d
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 23e
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 25a.b
    text: |-
      de toepassing van [hoofdstuk 3A.1 van de wet][ref1] of de verordening gemeenschappelijk afwikkelingsmechanisme.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk3a.1
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        hoofdstuk: 3a.1
  - number: 25b
    text: |-
      Een beheerder van een beleggingsinstelling of een beheerder van een icbe die een activiteit verricht
      of een beleggingsdienst verleent op grond van [artikel 2:67a, tweede lid, van de wet][ref1],
      respectievelijk [artikel 2:69c, tweede lid, van de wet][ref2], voldoet aan het bepaalde in de
      [artikelen 23, eerste tot en met vijfde lid en negende lid][ref3], [23a, aanhef en onderdeel b][ref4],
      [23b, eerste, derde en vierde lid][ref5], en [24a1][ref6] voor een beleggingsonderneming in de zin van de
      richtlijn prudentieel toezicht beleggingsondernemingen of voor een beleggingsonderneming die kwalificeert als
      klein en niet-verweven als bedoeld in artikel 12, eerste lid, van de verordening prudentiële vereisten voor
      beleggingsondernemingen indien wordt voldaan aan de voorwaarden bedoeld in dat artikel. [Artikel 24a2][ref7], voor
      zover het de toepassing van de [artikelen 23][ref8], [23a][ref9] en [23b][ref10] betreft, is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel23a
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Artikel23b
      [ref6]: https://wetten.overheid.nl/BWBR0020420#Artikel24a1
      [ref7]: https://wetten.overheid.nl/BWBR0020420#Artikel24a2
      [ref8]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref9]: https://wetten.overheid.nl/BWBR0020420#Artikel23a
      [ref10]: https://wetten.overheid.nl/BWBR0020420#Artikel23b
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: 23a
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref5
        bwb_id: BWBR0020420
        artikel: 23b
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref6
        bwb_id: BWBR0020420
        artikel: 24a1
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref7
        bwb_id: BWBR0020420
        artikel: 24a2
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref8
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref9
        bwb_id: BWBR0020420
        artikel: 23a
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref10
        bwb_id: BWBR0020420
        artikel: 23b
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '26.1'
    text: |-
      Een beheerder van een icbe, een bewaarder, pensioenbewaarder of premiepensioeninstelling beschikt over procedures
      en maatregelen die waarborgen dat de omvang en samenstelling van en mutaties in de aan te houden financiële
      waarborgen getrouw en volledig kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26
  - number: '26.2'
    text: |-
      Met het oog op de bewaking en beheersing van solvabiliteitsrisico’s voorziet de bedrijfsvoering van een beheerder
      van een icbe of een premiepensioeninstelling in ieder geval in de bewaking en beheersing van de:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26
  - number: 26.2.a
    text: aard en omvang van de activa en passiva;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26
  - number: 26.2.b
    text: niet uit de balans blijkende verplichtingen; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26
  - number: 26.2.c
    text: resultaatontwikkeling, uitgesplitst naar de onderscheiden bedrijfsactiviteiten en bedrijfsonderdelen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26
  - number: '26.3'
    text: |-
      Met het oog op de bewaking en beheersing van liquiditeitsrisico’s voorziet de bedrijfsvoering van een beheerder van
      een icbe voor elke icbe die hij beheert onder meer in autorisatieprocedures, limietstellingen, limietbewaking en
      procedures en maatregelen voor noodsituaties met betrekking tot de liquiditeitspositie van de icbe.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26
  - number: '26.4'
    text: |-
      In voorkomend geval voert een beheerder van een icbe stresstests uit die een beoordeling van het liquiditeitsrisico
      van de instelling voor collectieve belegging in effecten in uitzonderlijke omstandigheden mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26
  - number: '26.5'
    text: |-
      De beheerder van een icbe draagt er zorg voor dat voor elke door hem beheerde instelling voor collectieve belegging
      in effecten het liquiditeitsprofiel past bij het terugbetalingsbeleid dat in het fondsreglement, in de statuten of
      in het prospectus is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26
  - number: 26.0.1
    text: |-
      De procedures en maatregelen van een premiepensioeninstelling ter beheersing van de relevante risico’s, bedoeld
      in [artikel 23, derde lid][ref1], zijn gericht op de relevante risico’s waaraan de premiepensioeninstelling
      wordt of kan worden blootgesteld, alsmede op de risico’s voor de door de premiepensioeninstelling uitgevoerde
      pensioenregelingen, waarbij de onderlinge afhankelijkheden en relaties in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.0
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 26.0.2
    text: |-
      Tot de relevante risico’s voor een premiepensioeninstelling worden, in aanvulling op de risico’s, bedoeld in
      [artikel 23, tweede lid][ref1], tevens gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.0
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 26.0.2.a
    text: risico’s in verband met afgestemd beheer van activa en passiva;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.0
  - number: 26.0.2.b
    text: risico’s in verband met beleggingen, met name derivatencontracten, securitisaties en vergelijkbare overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.0
  - number: 26.0.2.c
    text: risico’s in verband met verzekering en andere risicobeperkingstechnieken;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.0
  - number: 26.0.2.d
    text: |-
      bestaande of opkomende risico’s met betrekking tot het milieu, maatschappelijk verantwoord ondernemen of behoorlijk
      bestuur, waaronder risico’s op het gebied van klimaatverandering, het gebruik van hulpbronnen, maatschappelijke
      risico’s of risico’s in verband met waardevermindering van activa als gevolg van gewijzigde regelgeving; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.0
  - number: 26.0.2.e
    text: |-
      de risico’s die de pensioendeelnemers, gewezen pensioendeelnemers of pensioengerechtigden dragen overeenkomstig de
      voorwaarden van de pensioenregeling, vanuit het oogpunt van de pensioendeelnemer of pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.0
  - number: 26.0.3
    text: |-
      Een premiepensioeninstelling draagt er zorg voor dat de procedures en maatregelen, bedoeld in
      [artikel 23, derde lid][ref1], tevens procedures omvatten voor het rapporteren van relevante risico’s
      door de risicobeheerfunctie aan het bestuur en, indien aanwezig, het toezichthoudend orgaan van de
      premiepensioeninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.0
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 26.0.4
    text: |-
      De premiepensioeninstelling evalueert het beleid, bedoeld in [artikel 23, eerste lid][ref1], ten minste eenmaal
      per drie jaar en past het beleid in geval van een belangrijke wijziging op het gebied van het risicobeheer of met
      betrekking tot de overige onderdelen van de bedrijfsvoering zo spoedig mogelijk aan.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.0
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 26.0.5
    text: |-
      De premiepensioeninstelling draagt er zorg voor dat in de procedures en maatregelen, bedoeld in
      [artikel 23, derde lid][ref1], voor de beoordeling van de kredietwaardigheid van de activa niet uitsluitend of
      mechanisch wordt uitgegaan van ratings, uitgegeven door een ratingbureau.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.0
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '26.01'
    text: |-
      [Artikel 17aa, derde lid][ref1], is van overeenkomstige toepassing op de uitoefening van de risicobeheerfunctie
      bij een premiepensioeninstelling. De [artikelen 5, eerste lid][ref2], 17aa, vierde lid, en [17ab][ref3] zijn
      van overeenkomstige toepassing op de personen die verantwoordelijk zijn voor de risicobeheerfunctie van een
      premiepensioeninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17aa
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel17ab
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.01
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 17aa
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: 17ab
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 26.02.1
    text: |-
      Een premiepensioeninstelling voert in het kader van het risicobeheer ten minste eenmaal per drie jaar een
      eigenrisicobeoordeling uit en legt de resultaten hiervan schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.02
  - number: 26.02.2
    text: |-
      De eigenrisicobeoordeling en de vastlegging van de resultaten hiervan wordt door de premiepensioeninstelling in
      aanmerking genomen bij het nemen van strategische beslissingen en omvat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.02
  - number: 26.02.2.a
    text: |-
      een beoordeling van de relevante risico’s, bedoeld in [artikel 23, tweede lid][ref1] en
      [artikel 26.0, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel26
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.02
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 26.02.2.b
    text: |-
      een beoordeling van de doelmatigheid van het beleid, bedoeld in [artikel 23, eerste lid][ref1], en de procedures en
      maatregelen, bedoeld in artikel 23, derde lid, en [artikel 26.0, eerste en derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel26
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.02
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 26.02.2.c
    text: een kwalitatieve beoordeling van de mechanismen ter bescherming van de pensioenuitkeringen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.02
  - number: 26.02.2.d
    text: |-
      een beschrijving van de methoden waarover een premiepensioeninstelling beschikt om de risico’s, bedoeld in
      onderdeel a, te identificeren en evalueren; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.02
  - number: 26.02.2.e
    text: |-
      een beschrijving van de wijze waarop de eigenrisicobeoordeling overeenkomstig het bepaalde in
      [artikel 23, derde lid][ref1], is geïntegreerd in de bedrijfsprocessen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.02
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 26.02.3
    text: |-
      Indien het risicoprofiel van de premiepensioeninstelling, dan wel het risicoprofiel van een door de
      premiepensioeninstelling uitgevoerde pensioenregeling, in belangrijke mate wijzigt, vindt zo spoedig mogelijk
      een nieuwe eigenrisicobeoordeling plaats, met dien verstande dat bij een wijziging in het risicoprofiel van een
      specifieke pensioenregeling de eigenrisicobeoordeling beperkt kan blijven tot de betreffende pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.02
  - number: 26.02.4
    text: |-
      De premiepensioeninstelling zendt de door het bestuur vastgestelde resultaten van de eigenrisicobeoordeling of
      wijzigingen in de resultaten van de eigenrisicobeoordeling zo spoedig mogelijk na de totstandkoming daarvan aan
      de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.02
  - number: '26.03'
    text: |-
      De Nederlandsche Bank kan een premiepensioeninstelling de verplichting opleggen om een stresstest uit te voeren, om
      de financiële omstandigheden van de premiepensioeninstelling te kunnen bepalen of de ontwikkeling ervan te kunnen
      volgen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.03
  - number: 26.1.1
    text: |-
      Een beheerder van een beleggingsinstelling als bedoeld in [artikel 3:17, derde lid, van de wet][ref1] voert met
      betrekking tot de beleggingsinstellingen die hij beheert beleid gericht op het beheersen van risico’s die de
      soliditeit van die instellingen kunnen aantasten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 26.1.2
    text: |-
      De beheerder beschikt over procedures en maatregelen die waarborgen dat wordt voldaan aan de ingevolge artikel 15
      en 16 van de richtlijn beheerders van alternatieve beleggingsinstellingen gestelde voorwaarden die met het oog op
      de in het eerste lid bedoelde belangen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.1
  - number: 26.2.1
    text: |-
      Een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-omvang, voldoet met
      betrekking tot zijn bedrijfsvoering aan de artikelen 41 en 44 tot en met 48 van de richtlijn solvabiliteit II, met
      inachtneming van titel I, hoofdstuk IX, afdelingen 1 en 2, van de verordening solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.2
  - number: 26.2.2
    text: |-
      De werknemers van een verzekeraar als bedoeld in het eerste lid, niet zijnde personen als bedoeld in
      [artikel 3:8, eerste lid, derde volzin, van de wet][ref1], die een sleutelfunctie vervullen als bedoeld in artikel
      42 van de richtlijn solvabiliteit II zijn geschikt voor de vervulling van hun taken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.2
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 26.3.1
    text: |-
      De artikelen 41 en 44 tot en met 48 van de richtlijn solvabiliteit II en titel I, hoofdstuk IX, afdelingen 1 en 2,
      van de verordening solvabiliteit II inzake de bedrijfsvoering van verzekeraars zijn van overeenkomstige toepassing
      op de volgende verzekeraars, voor zover zij hun bedrijf uitoefenen vanuit een in Nederland gelegen bijkantoor:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.3
  - number: 26.3.1.a
    text: |-
      levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.3
  - number: 26.3.1.b
    text: herverzekeraars met zetel in een niet-aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.3
  - number: 26.3.2
    text: |-
      [Artikel 26.2, tweede lid][ref1], is van overeenkomstige toepassing op werknemers van verzekeraars als bedoeld in
      het eerste lid, onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel26
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.3
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '26.4'
    text: |-
      De artikelen 319, 320, 321, 324, 326 en 327 van de verordening solvabiliteit II inzake de bedrijfsvoering van
      entiteiten voor risico-acceptatie zijn van overeenkomstige toepassing op entiteiten voor risico-acceptatie met
      zetel in een niet-aangewezen staat die hun bedrijf uitoefenen vanuit een in Nederland gelegen bijkantoor.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.4
  - number: 26.5.1
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:17, tweede lid, onderdeel c, onder 4°][ref1], of
      [artikel 3:23, eerste lid, van de wet][ref2] beschikt over een voorbereidend crisisplan dat door de Nederlandsche
      Bank is goedgekeurd en dat voorziet in maatregelen die de verzekeraar in staat stellen zijn financiële positie na
      een aanzienlijke verslechtering ervan te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 26.5.2
    text: |-
      Een voorbereidend crisisplan wordt ten minste elke drie jaar geëvalueerd en zo nodig bijgewerkt, alsook na elke
      significante verandering in de juridische structuur, de feitelijke bedrijfsuitoefening of de financiële positie van
      de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.3
    text: |-
      Een aanzienlijke verslechtering van de financiële positie als bedoeld in het eerste lid omvat ten minste een
      dreigende of daadwerkelijke doorbreking van het solvabiliteitskapitaalvereiste, een dreigende of daadwerkelijke
      doorbreking van het minimumkapitaalvereiste, alsmede een dreigende of daadwerkelijke verslechtering van de
      liquiditeitspositie.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.4
    text: 'Het voorbereidende crisisplan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.4.a
    text: |-
      de maatregelen voor herstel van de financiële positie in verschillende crisisscenario’s, de verwachte effectiviteit
      ervan en de voor de uitvoering benodigde tijd;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.4.b
    text: |-
      een beschrijving van de procedures voor het bepalen van de waarde en verkoopbaarheid van bedrijfsactiviteiten en
      activa in diverse crisisscenario’s;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.4.c
    text: |-
      een beschrijving van de wijze waarop het voorbereidende crisisplan in de bestuurs- en bedrijfsvoeringsstructuur
      is geïntegreerd, alsmede van het beleid en de procedures met betrekking tot de goedkeuring van het voorbereidende
      crisisplan en de identificatie van de personen in de organisatie die voor de opstelling en uitvoering van het plan
      verantwoordelijk zijn;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.4.d
    text: de wijze waarop de verzekeraar de continue werking van de kritische bedrijfsprocessen waarborgt;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.4.e
    text: |-
      de wijze waarop de verzekeraar beoogt verzekeringsportefeuilles of delen daarvan met de daarbij behorende activa te
      verkopen binnen een tijdsbestek dat passend is voor het herstel van de financiële soliditeit;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.4.f
    text: |-
      voorbereidingen die de verzekeraar heeft getroffen of voornemens is te treffen om de uitvoering van het
      voorbereidende crisisplan te vergemakkelijken, met inbegrip van maatregelen die nodig kunnen zijn voor een tijdige
      herkapitalisatie van de verzekeraar;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.4.g
    text: |-
      indien van toepassing: een samenvatting van wezenlijke veranderingen in de juridische structuur of de feitelijke
      bedrijfsuitoefening die zich sinds de opstelling van het laatste voorbereidende crisisplan hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.4.h
    text: |-
      een analyse van het effect van de uitvoering van de in het plan opgenomen maatregelen op de polishouders en, voor
      zover van toepassing, de rest van de groep;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.4.i
    text: een communicatieplan voor de media en het publiek; en,
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.4.j
    text: |-
      indien van toepassing: een beschrijving van de wezenlijke belemmeringen voor de doeltreffende uitvoering van
      het voorbereidende crisisplan en maatregelen om deze belemmeringen weg te nemen en de voor de uitvoering van die
      maatregelen benodigde tijd.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.5
    text: |-
      Indien in het laatst ingediende periodieke toezichtrapport, bedoeld in artikel 304, eerste lid, onderdeel b,
      van de verordening solvabiliteit II, reeds de in het vierde lid genoemde onderdelen zijn opgenomen, vervalt de
      verplichting bedoeld in het vierde lid, voor de betreffende onderdelen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.5.6
    text: De Nederlandsche Bank kan toestaan dat het tweede tot en met vierde lid op vereenvoudigde wijze wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.5
  - number: 26.6.1
    text: |-
      Een verzekeraar of holding als bedoeld in [artikel 3:288i1, eerste lid, van de wet][ref1] beschikt over een
      voorbereidend groepscrisisplan dat door de Nederlandsche Bank is goedgekeurd en dat voorziet in maatregelen met
      betrekking tot de verzekeraar, zijn dochterondernemingen of holding, die de groep in staat stellen de financiële
      positie van de afzonderlijke groepsleden en de groep als geheel na een aanzienlijke verslechtering ervan te
      herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.6
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 26.6.2
    text: Het voorbereidende groepscrisisplan bevat een identificatie van de belangrijkste onderdelen van de groep.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.6
  - number: 26.6.3
    text: |-
      [Artikel 26.5, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing op een voorbereidend
      groepscrisisplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel26
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.6
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: 4.3a
  - number: '26.7'
    text: |-
      De inrichting van de bedrijfsvoering van een verzekeraar als bedoeld in [artikel 26.5, eerste lid][ref1], of van
      een verzekeraar dan wel holding als bedoeld in [artikel 26.6, eerste lid][ref2], waarborgt dat elke maatregel
      bedoeld in artikel 26.5, vierde lid, onderdeel a, zonder wezenlijke belemmeringen ten uitvoer kan worden gelegd, in
      ieder geval met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel26
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.7
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: 4.3a
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: 4.3a
  - number: 26.7.a
    text: aanpassingen in het risicoprofiel van de verzekeraar;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.7
  - number: 26.7.b
    text: de mogelijkheden tot tijdige herkapitalisatie;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.7
  - number: 26.7.c
    text: aanpassingen in de strategie en bedrijfsvoering; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.7
  - number: 26.7.d
    text: de financieringsstrategie, teneinde de weerbaarheid van de bedrijfsonderdelen te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.7
  - number: 26.8.1
    text: |-
      De Nederlandsche Bank beoordeelt een voorbereidend crisisplan of voorbereidend groepscrisisplan binnen zes maanden
      na de voorlegging ervan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.8
  - number: 26.8.2
    text: |-
      Indien het voorbereidend crisisplan of groepscrisisplan wezenlijke tekortkomingen vertoont of indien er wezenlijke
      belemmeringen zijn voor de uitvoering van het voorbereidende crisisplan en deze tekortkomingen of belemmeringen
      niet binnen een redelijke termijn zullen worden weggenomen, wordt goedkeuring aan het plan onthouden. Binnen drie
      maanden legt de indiener van het voorbereidende crisisplan opnieuw een voorbereidend crisisplan ter goedkeuring
      voor, waarbij de geconstateerde tekortkomingen of belemmeringen binnen een redelijke termijn zullen worden
      weggenomen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.8
  - number: '26.9'
    text: |-
      Indien een verzekeraar, onderdeel of holding als bedoeld in [artikel 26.6, eerste lid][ref1], uitvoering geeft
      aan maatregelen die zijn opgenomen in het voorbereidende crisisplan of deze maatregelen achterwege laat bij een
      aanzienlijke verslechtering van de financiële positie als bedoeld in [artikel 26.5, eerste lid][ref2], doet de
      verzekeraar, het onderdeel of de holding daarvan onverwijld mededeling aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel26
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26.9
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: 4.3a
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: 4.3a
  - number: 26a.1
    text: |-
      Een bank, beleggingsonderneming of financiële instelling die een verklaring van ondertoezichtstelling als bedoeld
      in [artikel 3:110][ref1] heeft, beschikt over procedures en maatregelen die waarborgen dat de voor de uitvoering
      van de vangnetregelingen noodzakelijke gegevens voortdurend actueel worden bijgehouden en adequaat zijn vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 26a.2
    text: |-
      De financiële onderneming verstrekt de gegevens, bedoeld in het eerste lid, op verzoek van de Nederlandsche Bank
      binnen een door de Nederlandsche Bank te bepalen termijn en op een op de Nederlandsche Bank te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26a
  - number: 26b
    text: |-
      Afwikkelondernemingen, banken, betaalinstellingen en elektronischgeldinstellingen nemen bij de inrichting van
      hun bedrijfsvoering de regels in acht die door de Nederlandsche Bank terzake worden gesteld ter uitvoering van
      internationaal aanvaarde standaarden om de goede werking van het betalingsverkeer te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26b
  - number: 26c.1
    text: |-
      Een betaalinstelling beschikt over een beveiligingsbeleid om betaaldienstgebruikers te beschermen tegen
      beveiligingsrisico’s, zoals fraude en illegaal gebruik van gevoelige betaalgegevens en persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26c
  - number: 26c.2
    text: 'Het beveiligingsbeleid omvat ten minste:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26c
  - number: 26c.2.a
    text: |-
      maatregelen op het gebied van beveiliging en risicobescherming, met inbegrip van een risicoanalyse met betrekking
      tot de aangeboden betaaldiensten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26c
  - number: 26c.2.b
    text: |-
      procedures voor het registreren en afhandelen van veiligheidsincidenten en veiligheidsgerelateerde klachten van
      cliënten en de nabehandeling ervan, met inbegrip van een mechanisme voor het melden van incidenten met inachtneming
      van de in [artikel 26g, eerste lid][ref1], vastgelegde meldingsplicht voor betaalinstellingen;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel26g
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26c
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 26g
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 26c.2.c
    text: procedures voor het opslaan, monitoren, traceren en beperken van de toegang tot gevoelige betaalgegevens; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26c
  - number: 26c.2.d
    text: |-
      uitgangspunten en standaarden die worden toegepast bij het verzamelen van statistische gegevens over prestaties,
      transacties en fraude.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26c
  - number: 26c.3
    text: |-
      Indien de betaalinstelling uitsluitend betaaldiensten verleent als bedoeld onder 8 van de bijlage bij de richtlijn
      betaaldiensten, is het tweede lid, onderdeel d, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26c
  - number: 26c.4
    text: Het eerste en tweede lid zijn van overeenkomstige toepassing op elektronischgeldinstellingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26c
  - number: 26d
    text: |-
      Een betaaldienstverlener beschikt over procedures ter waarborging van de bedrijfscontinuïteit, waarin de kritieke
      bedrijfsactiviteiten en noodplannen zijn opgenomen, met inbegrip van een procedure om de toereikendheid en
      effectiviteit van deze plannen periodiek te toetsen en te herzien.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26d
  - number: 26e
    text: |-
      Een betaaldienstverlener, met uitzondering van de betaaldienstverlener die uitsluitend betaaldiensten verleent als
      bedoeld onder 8 van de bijlage bij de richtlijn betaaldiensten, verkrijgt alleen met de uitdrukkelijke toestemming
      van de betaaldienstgebruiker toegang tot diens persoonsgegevens, om deze gegevens te verwerken en te bewaren voor
      zover noodzakelijk voor het verlenen van betaaldiensten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26e
  - number: 26f.1
    text: |-
      Een betaaldienstverlener voorziet in passende risicobeperkende maatregelen en controlemechanismen ter voorkoming
      van operationele en beveiligingsrisico’s die zijn verbonden aan de door hem aangeboden betaaldiensten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26f
  - number: 26f.2
    text: |-
      Een betaaldienstverlener beschikt over procedures ter beheersing incidenten, inclusief een procedure om grote
      operationele incidenten en veiligheidsincidenten te detecteren en te classificeren.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26f
  - number: 26f.3
    text: |-
      Een betaaldienstverlener verstrekt de Nederlandsche Bank ten minste jaarlijks een beoordeling van de operationele
      en beveiligingsrisico’s en van de toereikendheid van de in reactie op deze risico’s ingevoerde risicobeperkende
      maatregelen en controlemechanismen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26f
  - number: 26g.1
    text: |-
      Een betaaldienstverlener stelt de Nederlandsche Bank onverwijld in kennis van een groot operationeel of
      beveiligingsincident. Indien het incident gevolgen heeft of kan hebben voor de financiële belangen van hun
      betaaldienstgebruikers, stelt de betaaldienstverlener ook deze onverwijld van het incident in kennis en vermeldt
      hij welke maatregelen hij treft om de mogelijke schadelijke gevolgen van het incident te beperken.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26g
  - number: 26g.2
    text: |-
      Een betaaldienstverlener verstrekt ten minste jaarlijks statistische gegevens over de door hem geconstateerde
      fraude met betrekking tot verschillende betaalmiddelen aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26g
  - number: 26l
    text: |-
      De [artikelen 26e tot en met 26k][ref1] zijn van toepassing op betalingstransacties in alle valuta, waarbij één of
      de enige bij de betalingstransactie betrokken betaaldienstverlener zijn zetel in een lidstaat heeft, met betrekking
      tot de delen van de betalingstransactie die binnen een lidstaat worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel26e
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26l
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 26e
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 26h.1
    text: |-
      Een betaaldienstverlener treft beveiligingsmaatregelen en voorziet in authenticatieprocedures ter bescherming van
      de vertrouwelijkheid en integriteit van de persoonlijke beveiligingsgegevens van betaaldienstgebruikers.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.2
    text: |-
      Sterke cliëntauthenticatie is een vorm van authenticatie die zodanig is opgezet dat de vertrouwelijkheid van de
      persoonlijke beveiligingsgegevens wordt beschermd en waarbij gebruik wordt gemaakt van twee of meer van de volgende
      factoren:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.2.a
    text: wetenschap, iets wat alleen de gebruiker weet;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.2.b
    text: bezit, iets waarover alleen de gebruiker beschikt; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.2.c
    text: inherente eigenschap, een unieke persoonlijke eigenschap van de gebruiker.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.3
    text: |-
      De factoren dienen onderling onafhankelijk te zijn, in die zin dat schending van de vertrouwelijkheid van één ervan
      geen afbreuk doet aan de betrouwbaarheid van de andere factoren.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.4
    text: 'Een betaaldienstverlener voorziet in sterke cliëntauthenticatie indien:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.4.a
    text: een betaler zich via het internet toegang tot zijn betaalrekening verschaft;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.4.b
    text: een betaler een elektronische betalingstransactie initieert;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.4.c
    text: |-
      een betaler via een communicatiemiddel op afstand een handeling uitvoert die een risico op betaalfraude of andere
      vormen van misbruik met zich mee kan brengen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.4.d
    text: een betaling via een betaalinitiatiedienstverlener wordt geïnitieerd; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.4.e
    text: informatie via een rekeninginformatiedienstverlener wordt opgevraagd.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.5
    text: |-
      Indien er sprake is van het initiëren van een elektronische betalingstransactie op afstand, gebruikt een
      betaaldienstverlener sterke cliëntauthenticatie met elementen die transacties op dynamische wijze aan een specifiek
      bedrag en een specifieke betalingsbegunstigde verbinden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26h.6
    text: |-
      De rekeninghoudende betaaldienstverlener staat de betaalinitiatiedienstverlener en de
      rekeninginformatiedienstverlener toe dat zij mogen vertrouwen op de door hem ten behoeve van de
      betaaldienstgebruiker verstrekte authenticatieprocedures.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26h
  - number: 26i.1
    text: |-
      Een betaalinitiatiedienstverlener zorgt ervoor dat de persoonlijke beveiligingsgegevens van de
      betaaldienstgebruiker alleen toegankelijk zijn voor de gebruiker en de uitgever van de persoonlijke
      beveiligingsgegevens, en verzendt de persoonlijke beveiligingsgegevens op een veilige en efficiënte manier.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26i
  - number: 26i.2
    text: |-
      Een betaalinitiatiedienstverlener verstrekt iedere andere informatie over de betaaldienstgebruiker, die is
      verkregen bij het verstrekken van betaalinitiatiedienst, alleen aan de betalingsbegunstigde en alleen met de
      uitdrukkelijke instemming van de betaaldienstgebruiker.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26i
  - number: 26i.3
    text: |-
      Een betaalinitiatiedienstverlener identificeert zich bij elke betaalinitiatie ten overstaan van de
      rekeninghoudende betaaldienstverlener van de betaler en communiceert op een veilige manier met de rekeninghoudende
      betaaldienstverlener.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26i
  - number: 26i.4
    text: Een betaalinitiatiedienstverlener slaat geen gevoelige betaalgegevens van de betaaldienstgebruiker op.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26i
  - number: 26i.5
    text: |-
      Een betaalinitiatiedienstverlener vraagt uitsluitend gegevens op van de betaaldienstgebruiker die nodig zijn voor
      het verstrekken van de betaalinitiatiedienst.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26i
  - number: 26i.6
    text: |-
      Een betaalinitiatiedienstverlener gebruikt, verschaft zich toegang tot of slaat gegevens op, uitsluitend ten
      behoeve van de door de betaler uitdrukkelijk gevraagde betaalinitiatiedienst.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26i
  - number: 26i.7
    text: |-
      Een betaalinitiatiedienstverlener laat het bedrag, de betalingsbegunstigde of enig ander element van de transactie
      ongewijzigd.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26i
  - number: 26i.8
    text: |-
      Toepassing van dit artikel vindt plaats met inachtneming van de krachtens artikel 98 van de richtlijn
      betaaldiensten door de EBA vastgestelde technische reguleringsnormen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26i
  - number: 26j.1
    text: |-
      Een rekeninginformatiedienstverlener verricht zijn diensten alleen met uitdrukkelijke instemming van de
      betaaldienstgebruiker.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26j
  - number: 26j.2
    text: |-
      Een rekeninginformatiedienstverlener zorgt ervoor dat de persoonlijke beveiligingsgegevens van de
      betaaldienstgebruiker alleen toegankelijk zijn voor de gebruiker en de uitgever van de persoonlijke
      beveiligingsgegevens, en verzendt de persoonlijke beveiligingsgegevens op een veilige en efficiënte manier.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26j
  - number: 26j.3
    text: |-
      Een rekeninginformatiedienstverlener identificeert zich bij elke communicatiesessie met de rekeninghoudende
      betaaldienstverlener van de betaaldienstgebruiker en communiceert op een veilige manier met de rekeninghoudende
      betaaldienstverlener en de betaaldienstgebruiker.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26j
  - number: 26j.4
    text: |-
      Een rekeninginformatiedienstverlener heeft uitsluitend toegang tot de informatie van de aangewezen betaalrekeningen
      en de betrokken betalingstransacties.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26j
  - number: 26j.5
    text: |-
      Een rekeninginformatiedienstverlener vraagt geen gevoelige betaalgegevens met betrekking tot de betaalrekeningen
      op.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26j
  - number: 26j.6
    text: |-
      Een rekeninginformatiedienstverlener gebruikt, verschaft zich toegang tot of slaat gegevens op uitsluitend ten
      behoeve van het uitvoeren van de door de betaaldienstgebruiker uitdrukkelijk gevraagde rekeninginformatiedienst,
      overeenkomstig Verordening (EU) 2016/679 van het Europees Parlement en de Raad van 27 april 2016 betreffende
      de bescherming van natuurlijke personen in verband met de verwerking van persoonsgegevens en betreffende het
      vrije verkeer van die gegevens en tot intrekking van [Richtlijn 95/46/EG](31995L0046) en bij of krachtens de
      Uitvoeringswet Algemene Verordening Gegevensbescherming gestelde regels.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26j
  - number: 26j.7
    text: |-
      Toepassing van dit artikel vindt plaats met inachtneming van de krachtens artikel 98 van de richtlijn
      betaaldiensten door de EBA vastgestelde technische reguleringsnormen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26j
  - number: 26k.1
    text: 'De rekeninghoudende betaaldienstverlener:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26k
  - number: 26k.1.a
    text: communiceert op een veilige manier met zowel betaalinitiatiedienstverleners als rekeninginformatiedienstverleners;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26k
  - number: 26k.1.b
    text: |-
      behandelt een door een rekeninginformatiedienstverlener verzonden verzoek om gegevens niet anders dan een door de
      betaaldienstgebruiker verzonden verzoek om gegevens, tenzij om objectieve redenen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26k
  - number: 26k.1.c
    text: |-
      behandelt de via de diensten van een betaalinitiatiedienstverlener doorgegeven betaalopdrachten niet anders dan
      door de betaler rechtstreeks verzonden betaalopdrachten, met name wat betreft termijn, voorrang of kosten, tenzij
      om objectieve redenen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26k
  - number: 26k.1.d
    text: |-
      verstrekt onmiddellijk na ontvangst van de betaalopdracht van de betaalinitiatiedienstverlener alle informatie
      over de initiëring van de betalingstransactie, alsmede alle informatie die toegankelijk is voor de rekeninghoudende
      betaaldienstverlener met betrekking tot de uitvoering van deze transactie aan de betaalinitiatiedienstverlener, of
      stelt deze informatie ter beschikking;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26k
  - number: 26k.1.e
    text: |-
      laat het gebruik van betaalinitiatie- en rekeninginformatiediensten niet afhangen van een contractuele relatie
      tussen hem en de betaalinitiatie- of rekeninginformatiedienstverlener;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26k
  - number: 26k.1.f
    text: werpt geen obstakels op voor het verlenen van betaalinitiatiediensten en rekeninginformatiediensten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26k
  - number: 26k.2
    text: |-
      Toepassing van dit artikel vindt plaats met inachtneming van de krachtens artikel 98 van de richtlijn
      betaaldiensten door de EBA vastgestelde technische reguleringsnormen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel26k
  - number: '27.1'
    text: |-
      Een financiële onderneming of bijkantoor als bedoeld in [artikel 3:18, eerste lid][ref1], [3:22][ref2],
      [3:23][ref3], [3:24b][ref4], [3:26][ref5] of [3:27, van de wet][ref6] gaat niet over tot het uitbesteden van
      werkzaamheden indien die uitbesteding een belemmering kan vormen voor een adequaat toezicht op de naleving van het
      bij of krachtens het [Deel Prudentieel toezicht financiële ondernemingen van de wet][ref7] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0020368
  - number: '27.2'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld
      in [artikel 3:18, tweede lid][ref1], [3:23][ref2], [3:26][ref3] of [3:27 van de wet][ref4] besteedt de taken en
      werkzaamheden van personen die het dagelijks beleid bepalen, daaronder mede verstaan het vaststellen van het beleid
      en het afleggen van verantwoording over het gevoerde beleid, niet uit.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 27a.1
    text: |-
      Indien een betaalinstelling voornemens is werkzaamheden in verband met het verlenen van betaaldiensten uit te
      besteden, stelt zij de Nederlandsche Bank daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27a
  - number: 27a.2
    text: |-
      Een betaalinstelling deelt de Nederlandse Bank onverwijld elke wijziging mee met betrekking tot
      het gebruik van entiteiten waaraan werkzaamheden worden uitbesteed en, in overeenstemming met
      [artikel 2:3c, tweede lid, van de wet][ref1], van het gebruik van betaaldienstagenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 27a.3
    text: Het eerste en tweede lid zijn van overeenkomstige toepassing op elektronischgeldinstellingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27a
  - number: 27b
    text: |-
      Bij de uitbesteding van werkzaamheden in verband met het verlenen van betaaldiensten draagt de betaalinstelling er
      zorg voor dat uitbesteding de verplichtingen van de betaalinstelling jegens haar cliënten en de rechten van haar
      cliënten uit hoofde van de [wet][ref1] of [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref2] niet wijzigt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0005290
  - number: 27c
    text: |-
      De Nederlandsche Bank kan ter uitvoering van internationaal aanvaarde standaarden nadere regels stellen met
      betrekking tot de uitbesteding door afwikkelondernemingen van werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27c
  - number: 27d
    text: |-
      Een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-omvang, voldoet met
      betrekking tot uitbesteding van werkzaamheden aan artikel 49 van de richtlijn solvabiliteit II, met inachtneming
      van titel I, hoofdstuk IX, afdeling 4, van de verordening solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27d
  - number: 27e
    text: |-
      Artikel 49 van de richtlijn solvabiliteit II en titel I, hoofdstuk IX, afdeling 4, van de verordening solvabiliteit
      II inzake uitbesteding van werkzaamheden zijn van overeenkomstige toepassing op de volgende verzekeraars, voor
      zover zij hun bedrijf uitoefenen vanuit een in Nederland gelegen bijkantoor:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27e
  - number: 27e.a
    text: |-
      levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27e
  - number: 27e.b
    text: herverzekeraars met zetel in een niet-aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27e
  - number: 27f.1
    text: |-
      Een premiepensioeninstelling stelt de Nederlandsche Bank tijdig in kennis van het voornemen om werkzaamheden uit te
      besteden en van belangrijke ontwikkelingen met betrekking tot de uitbestede werkzaamheden. Bij uitbesteding van de
      uitoefening van de interne controlefunctie, de risicobeheerfunctie of het beheer van de premiepensioeninstelling,
      stelt de premiepensioeninstelling de Nederlandsche Bank daarvan in kennis voordat de overeenkomst, bedoeld in
      [artikel 31][ref1], in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel31
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27f
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '31'
        hoofdstuk: '5'
  - number: 27f.2
    text: |-
      In geval van uitbesteding van werkzaamheden door een premiepensioeninstelling aan een onderneming die geen
      financiële onderneming is, draagt een premiepensioeninstelling er zorg voor dat het beloningsbeleid van die
      onderneming in overeenstemming is met de vereisten ingevolge [afdeling 1.7.2. van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Afdeling1.7.2
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel27f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        afdeling: 1.7.2
  - number: '28'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in
      [artikel 27, tweede lid][ref1], gaat niet over tot het uitbesteden van werkzaamheden indien dat afbreuk doet aan de
      kwaliteit van haar onafhankelijke interne toetsing als bedoeld in [artikel 17, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel17
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '27'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '29.1'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in
      [artikel 27, tweede lid][ref1], voert een adequaat beleid en beschikt over procedures en maatregelen met betrekking
      tot het op structurele basis uitbesteden van werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '27'
        hoofdstuk: '5'
  - number: '29.2'
    text: |-
      De premiepensioeninstelling legt het beleid, bedoeld in het eerste lid, schriftelijk vast en evalueert het beleid
      ten minste eenmaal per drie jaar en past dit zo spoedig mogelijk aan in geval van een belangrijke wijziging met
      betrekking tot de uitbesteding of de overige onderdelen van de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel29
  - number: '30'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in
      [artikel 27, tweede lid][ref1], beschikt over toereikende procedures, maatregelen, deskundigheid en informatie om
      de uitvoering van de op structurele basis uitbestede werkzaamheden te kunnen beoordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '27'
        hoofdstuk: '5'
  - number: '31.1'
    text: |-
      Een betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar met beperkte risico-omvang, wisselinstelling of bijkantoor als bedoeld in
      [artikel 27, tweede lid][ref1], legt de overeenkomst met de derde waaraan de werkzaamheden op structurele basis
      worden uitbesteed schriftelijk vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '27'
        hoofdstuk: '5'
  - number: '31.2'
    text: 'In de overeenkomst wordt in ieder geval het volgende geregeld:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel31
  - number: 31.2.a
    text: |-
      de onderlinge informatie-uitwisseling, met inbegrip van afspraken over het beschikbaar stellen van informatie
      waarom de toezichthouders ter uitvoering van hun wettelijke taak verzoeken;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel31
  - number: 31.2.b
    text: |-
      de mogelijkheid voor de financiële onderneming of het bijkantoor om te allen tijde wijzigingen aan te brengen in de
      wijze waarop de uitvoering van de werkzaamheden door de derde geschiedt;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel31
  - number: 31.2.c
    text: |-
      de verplichting voor de derde om de financiële onderneming of het bijkantoor in staat te stellen blijvend te
      voldoen aan het bij of krachtens de wet bepaalde; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel31
  - number: 31.2.d
    text: de mogelijkheid voor de toezichthouders om onderzoek ter plaatse te doen of te laten doen bij de derde; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel31
  - number: 31.2.e
    text: |-
      de wijze waarop de overeenkomst wordt beëindigd, en de wijze waarop wordt gewaarborgd dat de financiële onderneming
      of het bijkantoor de werkzaamheden na beëindiging van de overeenkomst weer zelf kan uitvoeren of door een andere
      derde kan laten uitvoeren.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel31
  - number: '31.3'
    text: |-
      De toezichthouders maken slechts gebruik van de mogelijkheid, bedoeld in het tweede lid, onderdeel d, indien niet
      op andere wijze kan worden vastgesteld dat ten aanzien van de uitbestede werkzaamheden wordt voldaan aan het bij of
      krachtens de wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel31
  - number: '32'
    text: |-
      De [artikelen 29 tot en met 31][ref1] zijn niet van toepassing op het uitbesteden van werkzaamheden aan
      ondernemingen met zetel in een lidstaat die deel uitmaken van de groep waartoe de financiële onderneming behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel29
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '29'
        hoofdstuk: '5'
  - number: 32a.1
    text: |-
      Dit hoofdstuk is, met uitzondering van [artikel 27a][ref1], slechts van toepassing op het uitbesteden van
      werkzaamheden door betaalinstellingen of elektronischgeldinstellingen voor zover het belangrijke werkzaamheden
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel27a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 27a
        hoofdstuk: '5'
  - number: 32a.2
    text: |-
      Een werkzaamheid wordt als belangrijk aangemerkt indien een gebrekkige of tekortschietende uitvoering
      ervan wezenlijk afbreuk zou doen aan de naleving door de betaalinstelling van de vergunningsvereisten,
      als bedoeld in [artikel 2:3b van de wet][ref1], of van andere verplichtingen ingevolge de [wet][ref2] of
      [Titel 7B van Boek 7 van het Burgerlijk Wetboek][ref3], dan wel aan haar financiële resultaten of de soliditeit of
      continuïteit van haar betaaldiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368
      [ref3]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
      - id: ref3
        bwb_id: BWBR0005290
  - number: 32a.3
    text: |-
      Een werkzaamheid wordt als belangrijk aangemerkt indien een gebrekkige of tekortschietende uitvoering ervan
      wezenlijk afbreuk zou doen aan de naleving door de elektronischgeldinstelling van de vergunningvereisten, genoemd
      in [artikel 2:10b van de wet][ref1], dan wel aan haar financiële resultaten of de soliditeit of continuïteit van
      haar dienstverlening ter zake van de uitgifte van elektronisch geld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 32aa.1
    text: |-
      Met betrekking tot het voornemen, bedoeld in [artikel 3:28a, eerste lid, van de wet][ref1], legt de centrale
      tegenpartij over:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32aa
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 32aa.1.a
    text: een beschrijving van de voorgenomen wijziging, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32aa
  - number: 32aa.1.b
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of wordt voldaan aan
      hetgeen is bepaald in de artikelen 26 tot en met 35 en 40 tot en met 54 van de verordening, bedoeld in het
      eerste lid, en op basis waarvan de Autoriteit Financiële Markten redelijkerwijs een advies als bedoeld in
      [artikel 2a van het Besluit uitvoering EU-verordeningen financiële markten][ref1] kan geven.


      [ref1]: https://wetten.overheid.nl/BWBR0032230#Artikel2a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32aa
    references:
      - id: ref1
        bwb_id: BWBR0032230
        artikel: 2a
  - number: 32aa.2
    text: |-
      De centrale tegenpartij geeft geen uitvoering aan het voornemen, bedoeld in
      [artikel 3:28a, eerste lid, van de wet][ref1], voordat de Nederlandsche Bank heeft ingestemd met de wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32aa
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 32aa.3
    text: 'De Nederlandsche Bank neemt een besluit omtrent instemming:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32aa
  - number: 32aa.3.a
    text: binnen zes weken na de kennisgeving;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32aa
  - number: 32aa.3.b
    text: |-
      indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van de
      kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32aa
  - number: 32aa.3.c
    text: |-
      indien de Nederlandsche Bank de Autoriteit Financiële Markten om advies heeft gevraagd ingevolge
      [artikel 2a Besluit uitvoering EU-verordeningen financiële markten][ref1], binnen vier weken na ontvangst van
      dat advies.


      [ref1]: https://wetten.overheid.nl/BWBR0032230#Artikel2a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32aa
    references:
      - id: ref1
        bwb_id: BWBR0032230
        artikel: 2a
  - number: 32bb.1
    text: |-
      Met betrekking tot een voornemen tot wijziging als bedoeld in [artikel 3:28a, tweede lid, van de wet][ref1] legt de
      centrale effectenbewaarinstelling over aan de Nederlandsche Bank:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32bb
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 32bb.1.a
    text: een beschrijving van de voorgenomen wijziging;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32bb
  - number: 32bb.1.b
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of wordt voldaan aan de artikelen 39
      tot en met 47, 54 en 59 van de verordening centrale effectenbewaarinstellingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32bb
  - number: 32bb.2
    text: |-
      De centrale effectenbewaarinstelling geeft geen uitvoering aan het voornemen voordat de Nederlandsche Bank heeft
      ingestemd met de wijziging.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32bb
  - number: 32bb.3
    text: 'De Nederlandsche Bank neemt een besluit omtrent instemming:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32bb
  - number: 32bb.3.a
    text: binnen zes weken na ontvangst van de kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32bb
  - number: 32bb.3.b
    text: |-
      indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32bb
  - number: 32b.1
    text: |-
      Een betaalinstelling of elektronischgeldinstelling geeft onverwijld schriftelijk aan de Nederlandsche Bank
      kennis van een wijziging in de ingevolge [artikel 2:3b, tweede lid, van de wet][ref1] respectievelijk ingevolge
      [artikel 2:10b, tweede lid, van de wet][ref2] verstrekte gegevens met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 32b.1.a
    text: de activiteiten die de betaaldienstverlener of de elektronischgeldinstelling voornemens is te verrichten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
  - number: 32b.1.b
    text: |-
      het bedrijfsplan waarmee wordt aangetoond dat de betaaldienstverlener of de elektronischgeldinstelling in staat is
      gebruik te maken van passende en evenredige systemen, middelen en procedures om op een gezonde basis te opereren;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
  - number: 32b.1.c
    text: |-
      de identiteit van personen die, direct of indirect, gekwalificeerde deelnemingen als bedoeld in artikel 1 van de
      wet in de betaaldienstverlener of de elektronischgeldinstelling bezitten, alsmede de omvang van hun deelnemingen en
      het bewijs van hun geschiktheid;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
  - number: 32b.1.d
    text: |-
      indien van toepassing, de accountantsorganisatie of het auditkantoor, bedoeld in
      [artikel 1, eerste lid, onderdelen a en c, van de Wet toezicht accountantsorganisaties][ref1], belast met de
      wettelijke controle bedoeld in artikel 2, onderdeel 1, van de richtlijn nr. 2006/43/EG van het Europees Parlement
      en de Raad van de Europese Unie van 17 mei 2006 betreffende de wettelijke controles van jaarrekeningen en
      geconsolideerde jaarrekeningen, tot wijziging van de Richtlijnen 78/660/EEG en 83/349/EEG van de Raad, en houdende
      intrekking van Richtlijn 84/253/EEG van de Raad (PbEU L 157) van de jaarrekening van de betaaldienstverlener of
      de elektronischgeldinstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
  - number: 32b.1.e
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank heeft geoordeeld dat wordt voldaan aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref1] is bepaald met betrekking tot de geschiktheid van de personen die het dagelijks
      beleid bepalen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 32b.1.f
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank heeft geoordeeld dat wordt voldaan aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref1] is bepaald met betrekking tot de betrouwbaarheid van de personen die het beleid
      bepalen of mede bepalen of onderdeel zijn van een orgaan dat belast is met toezicht op het beleid en de algemene
      gang van zaken;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 32b.1.g
    text: |-
      het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening, bedoeld in
      [artikel 3:10, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 32b.1.h
    text: |-
      de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere bedrijfsuitoefening, bedoeld in
      [artikel 3:17, eerste en tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 32b.1.i
    text: |-
      de wijze waarop wordt voldaan aan het ingevolge [artikel 3:29a van de wet][ref1] bepaalde met betrekking tot de
      geldmiddelen die worden of zijn ontvangen van betaaldienstgebruikers of betaaldienstverleners en met betrekking tot
      de geldmiddelen die worden of zijn ontvangen in ruil voor elektronisch geld dat is uitgegeven; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 32b.1.j
    text: |-
      het eigen vermogen, bedoeld in [artikel 3:53, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 32b.2
    text: |-
      Bij de toepassing van het eerste lid, onderdelen h en i, geeft de betaalinstelling een beschrijving van de
      wijzigingen in de regelingen voor accountantscontrole en de organisatorische regelingen die hij heeft getroffen
      voor het nemen van alle redelijke maatregelen om de belangen van zijn gebruikers te beschermen en om de
      continuïteit en betrouwbaarheid bij het uitvoeren van betaaldiensten te garanderen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
  - number: 32b.3
    text: |-
      Het eerste lid, onderdeel f, is niet van toepassing indien de wijziging een persoon betreft wiens
      betrouwbaarheid voor de toepassing van de wet door een toezichthouder reeds is vastgesteld, tenzij de
      Nederlandsche Bank besluit dat een redelijke aanleiding bestaat tot een nieuwe beoordeling als bedoeld in
      [artikel 3:9, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '33.1'
    text: |-
      Een afwikkelonderneming, bank, betaalinstelling, clearinginstelling, elektronischgeldinstelling, kredietunie,
      premiepensioeninstelling, verzekeraar of wisselinstelling als bedoeld in [artikel 3:29, eerste lid][ref1],
      [3:42][ref2], [3:43, tweede lid][ref3], of [3:49 van de wet][ref4] geeft schriftelijk aan de Nederlandsche Bank
      kennis van het voornemen tot een wijziging van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 33.1.a
    text: |-
      de personen die het dagelijks beleid van de financiële onderneming bepalen of het beleid van de financiële
      onderneming bepalen of mede bepalen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: 33.1.b
    text: |-
      indien van toepassing, de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid
      en de algemene gang van zaken van de financiële onderneming; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: 33.1.c
    text: |-
      indien van toepassing, de personen werkzaam onder verantwoordelijkheid van een bank of verzekeraar, die een
      leidinggevende functie vervullen direct onder het echelon van de beleidsbepalers en verantwoordelijk zijn voor
      natuurlijke personen wier werkzaamheden het risicoprofiel van de onderneming wezenlijk kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: '33.2'
    text: |-
      De financiële onderneming geeft geen uitvoering aan het voornemen voordat de Nederlandsche Bank heeft ingestemd met
      de wijziging. De Nederlandsche Bank neemt een besluit omtrent instemming:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: 33.2.a
    text: binnen zes weken na ontvangst van de kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: 33.2.b
    text: |-
      indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: '33.3'
    text: 'Met betrekking tot het voornemen legt de financiële onderneming de volgende gegevens over:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: 33.3.a
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of wordt voldaan aan hetgeen in
      [artikel 3:8 van de wet][ref1] wordt bepaald met betrekking tot de geschiktheid van de betrokkene;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 33.3.b
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank, onder overeenkomstige toepassing van de
      [artikelen 6 tot en met 9][ref1], redelijkerwijs kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:9, van de wet][ref2] wordt bepaald met betrekking tot de betrouwbaarheid van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '33.4'
    text: 'De gegevens, bedoeld in het derde lid, onderdeel a, zijn:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: 33.4.a
    text: een opgave van de naam, het adres en de functie;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: 33.4.b
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: 33.4.c
    text: een opgave van de geldige relevante diploma’s; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: 33.4.d
    text: een kopie van een geldig identiteitsbewijs.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
  - number: '33.5'
    text: |-
      Het derde lid, onderdeel b, is niet van toepassing indien het voornemen tot wijziging een persoon betreft
      wiens betrouwbaarheid voor de toepassing van de wet door een toezichthouder reeds is vastgesteld, tenzij de
      Nederlandsche Bank besluit dat een redelijke aanleiding bestaat tot een nieuwe beoordeling als bedoeld in
      [artikel 3:9, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '34.1'
    text: |-
      Een afwikkelonderneming, betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar of wisselinstelling als bedoeld in [artikel 33, eerste lid][ref1], geeft
      schriftelijk kennis aan de Nederlandsche Bank van een wijziging van gegevens op basis waarvan de Nederlandsche Bank
      heeft geoordeeld dat wordt voldaan aan hetgeen ingevolge [artikel 3:9][ref2] wordt bepaald met betrekking tot de
      betrouwbaarheid van de in dat artikel bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '33'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '34.2'
    text: |-
      De financiële onderneming geeft van een wijziging als bedoeld in het eerste lid onverwijld schriftelijk kennis
      nadat zij van de wijziging op de hoogte is gekomen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel34
  - number: '35.1'
    text: |-
      Een afwikkelonderneming, betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank, kredietunie,
      premiepensioeninstelling, verzekeraar of wisselinstelling als bedoeld in [artikel 33, eerste lid][ref1], geeft
      schriftelijk kennis aan de Nederlandsche Bank van een wijziging in:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel33
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '33'
        hoofdstuk: '6'
  - number: 35.1.a
    text: de naam of het adres van de financiële onderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel35
  - number: 35.1.b
    text: de rechtsvorm van de financiële onderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel35
  - number: 35.1.c
    text: indien van toepassing, de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel35
  - number: 35.1.d
    text: indien van toepassing, het nummer van inschrijving in het handelsregister;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel35
  - number: 35.1.e
    text: indien van toepassing, de statuten van de financiële onderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel35
  - number: 35.1.f
    text: de zeggenschapsstructuur binnen de financiële onderneming; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel35
  - number: 35.1.g
    text: indien van toepassing, het adres van een in een andere staat gelegen bijkantoor.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel35
  - number: '35.2'
    text: |-
      De financiële onderneming geeft van een wijziging als bedoeld in het eerste lid kennis binnen twee weken nadat de
      wijziging zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel35
  - number: '36.1'
    text: |-
      Een afwikkelonderneming, clearinginstelling, bank, verzekeraar of wisselinstelling als bedoeld in
      [artikel 3:29, eerste lid][ref1], [3:42][ref2] of [3:43, eerste lid, van de wet][ref3] geeft schriftelijk aan de
      Nederlandsche Bank kennis van het voornemen tot een wijziging van de personen die het dagelijks beleid van het
      bijkantoor bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '36.2'
    text: |-
      [Artikel 33, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel33
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '33'
        hoofdstuk: '6'
  - number: 36a.1
    text: |-
      Een bank als bedoeld in [artikel 3:29, eerste lid, van de wet][ref1] met zetel in Nederland die haar bedrijf
      uitoefent vanuit een in een andere lidstaat gelegen bijkantoor geeft aan de Nederlandsche Bank schriftelijk
      kennis van een voornemen tot wijziging van de gegevens, bedoeld in artikel 4 van [Verordening (EU) nr. 1151/2014]
      (32014R1151) van de Commissie van 4 juni 2014 tot aanvulling van [Richtlijn 2013/36](32013L0036)/EU van het
      Europees Parlement en de Raad met technische reguleringsnormen betreffende de gegevens die moeten worden verstrekt
      bij de uitoefening van het recht van vestiging en van het vrij verrichten van diensten (PbEU 2014, L 309).


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 36a.2
    text: 'De procedure voor de kennisgeving is:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel36a
  - number: 36a.2.a
    text: |-
      indien het bijkantoor is gelegen in een deelnemende lidstaat als bedoeld in artikel 2 van de verordening
      bankentoezicht, de procedure in artikel 11, vijfde lid, van [Verordening (EU) nr. 468/2014](32014R0468)
      van de Europese Centrale Bank van 16 april 2014 tot vaststelling van een kader voor samenwerking binnen het
      Gemeenschappelijk Toezichtsmechanisme tussen de Europese Centrale Bank en nationale bevoegde autoriteiten en met
      nationale aangewezen autoriteiten (PbEU 2014, L 141);
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel36a
  - number: 36a.2.b
    text: |-
      indien het bijkantoor is gelegen in een lidstaat, niet zijnde een deelnemende lidstaat als bedoeld in artikel 2 van
      de verordening bankentoezicht, de procedure in artikel 36, derde lid, van de richtlijn kapitaalvereisten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel36a
  - number: '37.1'
    text: |-
      Een afwikkelonderneming, clearinginstelling of verzekeraar als bedoeld in
      [artikel 3:29, eerste lid, van de wet][ref1] met zetel in Nederland die haar bedrijf uitoefent vanuit een in een
      andere lidstaat gelegen bijkantoor geeft schriftelijk aan de Nederlandsche Bank en de toezichthoudende instantie
      van die lidstaat kennis van een wijziging in het adres van het bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '37.2'
    text: |-
      De financiële onderneming geeft van een wijziging als bedoeld in het eerste lid kennis binnen twee weken nadat de
      wijziging zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37
  - number: '37.3'
    text: |-
      Een afwikkelonderneming of clearinginstelling als bedoeld in [artikel 3:29, eerste lid, van de wet][ref1] die
      haar bedrijf uitoefent vanuit een in een andere lidstaat gelegen bijkantoor, geeft schriftelijk kennis aan de
      Nederlandsche Bank en de toezichthoudende instantie van die lidstaat van het voornemen de uitoefening van haar
      bedrijf vanuit het in de andere lidstaat gelegen bijkantoor te staken. De afwikkelonderneming of clearinginstelling
      geeft geen uitvoering aan het voornemen gedurende de eerste vier weken na de kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 37a.1
    text: |-
      Een afwikkelonderneming waaraan de Nederlandsche Bank een vergunning heeft verleend voor het uitoefenen van het
      bedrijf van afwikkelonderneming geeft aan de Nederlandsche Bank schriftelijk kennis van het voornemen tot:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
  - number: 37a.1.a
    text: een wijziging of het doen ontstaan van een verbinding met een andere afwikkelonderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
  - number: 37a.1.b
    text: een wijziging van de contractuele algemene voorwaarden van de afwikkelonderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
  - number: 37a.1.c
    text: een substantiële wijziging in de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
  - number: 37a.1.d
    text: |-
      een substantiële wijziging in het risicomanagement, voor zover ten aanzien daarvan nadere regels krachtens
      [artikel 17b][ref1] zijn gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17b
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 17b
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 37a.1.e
    text: |-
      een handeling van de afwikkelonderneming die zal leiden tot een substantiële wijziging van de balans van de
      afwikkelonderneming.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
  - number: 37a.2
    text: 'Met betrekking tot het voornemen overlegt de afwikkelonderneming:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
  - number: 37a.2.a
    text: een beschrijving van de voorgenomen wijziging, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
  - number: 37a.2.b
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of wordt voldaan aan hetgeen in
      [artikel 3:17 van de wet][ref1] wordt bepaald met betrekking tot de beheerste uitoefening van het bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 37a.3
    text: |-
      De financiële onderneming geeft geen uitvoering aan het voornemen voordat de Nederlandsche Bank heeft ingestemd met
      de wijziging. De Nederlandsche Bank neemt een besluit omtrent instemming:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
  - number: 37a.3.a
    text: binnen zes weken na ontvangst van de kennisgeving;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
  - number: 37a.3.b
    text: |-
      indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van de
      kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
  - number: 37a.3.c
    text: |-
      indien de Nederlandsche Bank de Autoriteit Financiële Markten om advies heeft gevraagd, binnen vier weken na
      ontvangst van dat advies.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel37a
  - number: '38.1'
    text: |-
      Een levensverzekeraar of schadeverzekeraar als bedoeld in [artikel 3:29, eerste lid, van de wet][ref1] die
      zijn bedrijf uitoefent door middel van een buiten Nederland gelegen bijkantoor geeft schriftelijk kennis aan de
      Nederlandsche Bank van het voornemen tot wijziging van de vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '38.2'
    text: |-
      De financiële onderneming geeft geen uitvoering aan het voornemen voordat de Nederlandsche Bank heeft ingestemd met
      de wijziging. De Nederlandsche Bank neemt een besluit omtrent instemming:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
  - number: 38.2.a
    text: binnen zes weken na ontvangst van de kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
  - number: 38.2.b
    text: |-
      indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
  - number: '38.3'
    text: 'Met betrekking tot het voornemen legt de financiële onderneming de volgende gegevens over:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
  - number: 38.3.a
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank redelijkerwijs kan beoordelen of wordt voldaan aan hetgeen in
      [artikel 3:8 van de wet][ref1] wordt bepaald met betrekking tot de geschiktheid van de vertegenwoordiger; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 38.3.b
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank, onder overeenkomstige toepassing van de
      [artikelen 6 tot en met 9][ref1], kan beoordelen of wordt voldaan aan het hetgeen ingevolge
      [artikel 3:9 van de wet][ref2] wordt bepaald met betrekking tot de betrouwbaarheid van de vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '38.4'
    text: 'De gegevens, bedoeld in het derde lid, onderdeel a, zijn:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
  - number: 38.4.a
    text: een opgave van de naam, het adres en de functie;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
  - number: 38.4.b
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
  - number: 38.4.c
    text: een opgave van de geldige relevante diploma’s; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
  - number: 38.4.d
    text: een kopie van een geldig identiteitsbewijs.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
  - number: '38.5'
    text: |-
      Het derde lid is niet van toepassing indien het voornemen tot wijziging een persoon betreft wiens
      betrouwbaarheid voor de toepassing van de wet door een toezichthouder reeds is vastgesteld, tenzij de
      Nederlandsche Bank besluit dat een redelijke aanleiding bestaat tot een nieuwe beoordeling als bedoeld in
      [artikel 3:9, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '39.1'
    text: |-
      Een verzekeraar met beperkte risico-omvang die het levensverzekeringsbedrijf of het natura-
      uitvaartverzekeringsbedrijf uitoefent als bedoeld in [artikel 3:42][ref1], [3:43, tweede lid][ref2],
      [3:48, eerste lid][ref3], onderscheidenlijk [3:52 van de wet][ref4], geeft schriftelijk kennis aan de Nederlandsche
      Bank van een voornemen tot een wijziging van de overeenkomsten die hij voornemens is te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '39.2'
    text: |-
      Een schadeverzekeraar als bedoeld in [artikel 3:42][ref1], [3:43, tweede lid][ref2],
      [3:48, eerste lid, van de wet][ref3], die vanuit een vestiging in een lidstaat diensten naar Nederland verricht,
      geeft aan de Nederlandsche Bank kennis van het voornemen tot een wijziging van de in Nederland gelegen risico’s die
      hij voornemens is te dekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '39.3'
    text: |-
      Een herverzekeraar als bedoeld in [artikel 3:49 van de wet][ref1], geeft schriftelijk kennis aan de Nederlandsche
      Bank van een voornemen tot een wijziging van de risico’s die zij onderscheidenlijk hij voornemens is te dekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '39.4'
    text: |-
      De verzekeraar kan het voornemen, bedoeld in het eerste, tweede of derde lid, ten uitvoer brengen vanaf de dag
      waarop de Nederlandsche Bank de kennisgeving, bedoeld in het eerste, tweede of derde lid, heeft ontvangen. De
      Nederlandsche Bank bevestigt de ontvangst onverwijld aan de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel39
  - number: '39.5'
    text: |-
      Indien de schadeverzekeraar voornemens is de in Nederland gelegen risico’s zodanig te wijzigen dat deze risico’s
      behorende tot de branche Aansprakelijkheid motorrijtuigen omvatten, legt hij bij de kennisgeving de volgende
      gegevens over aan de Nederlandsche Bank:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel39
  - number: 39.5.a
    text: |-
      een schriftelijk bewijs waaruit blijkt dat hij is aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
  - number: 39.5.b
    text: |-
      een schriftelijk bewijs waaruit blijkt dat hij zich heeft gemeld bij het Waarborgfonds Motorverkeer teneinde
      te voldoen aan zijn verplichtingen jegens dat fonds uit hoofde van de [artikelen 24, eerste lid][ref1], en
      [24a, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel24a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: 24a
  - number: 39.5.c
    text: |-
      een opgave van de naam en het adres van de schaderegelaar, bedoeld in [artikel 4:70, tweede lid, van de wet][ref1],
      die hij in iedere andere lidstaat heeft aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '40.1'
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:43, tweede lid][ref1], of [3:49 van de wet][ref2] geeft schriftelijk
      kennis aan de Nederlandsche Bank van een wijziging van gegevens op basis waarvan de Nederlandsche Bank heeft
      geoordeeld dat wordt voldaan aan hetgeen ingevolge [artikel 3:9 van de wet][ref3] wordt bepaald met betrekking tot
      de betrouwbaarheid van de vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '40.2'
    text: |-
      De financiële onderneming geeft van een wijziging als bedoeld in het eerste lid, onverwijld kennis nadat zij van de
      wijziging op de hoogte is gekomen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40
  - number: 40a.1
    text: |-
      Een betaalinstelling als bedoeld in [artikel 3:29a, eerste lid, van de wet][ref1] en die betaaldiensten verleent
      als bedoeld onder 1 tot en met 6 van de bijlage bij de richtlijn betaaldiensten, stelt geldmiddelen die zijn
      ontvangen van betaaldienstgebruikers of andere betaaldienstverleners voor de uitvoering van betalingstransacties op
      een van de volgende wijzen veilig:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40a.1.a
    text: de geldmiddelen worden niet vermengd met de geldmiddelen van andere schuldeisers van de betaalinstelling; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40a
  - number: 40a.1.b
    text: |-
      de geldmiddelen worden gedekt door een verzekeringspolis of een vergelijkbare garantie van een verzekeraar of een
      bank die niet tot dezelfde groep behoort als de betaalinstelling, tegen het risico dat de betaalinstelling niet in
      staat is haar verplichtingen met betrekking tot de geldmiddelen na te komen, voor een bedrag dat gelijk is aan het
      bedrag dat afgescheiden zou zijn bij het ontbreken van de verzekeringspolis of vergelijkbare garantie.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40a
  - number: 40a.2
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, aanhef en onderdeel a, en de geldmiddelen aan het einde
      van de werkdag, volgend op de dag waarop zij zijn ontvangen, nog niet aan de betalingsbegunstigde of aan een
      andere betaaldienstaanbieder zijn overgemaakt, worden zij op een afzonderlijke rekening gestort bij een bank
      of belegd in veilige, liquide activa met een lage risicograad, op zodanige wijze dat andere schuldeisers van de
      betaalinstelling, in het bijzonder in het geval van insolventie van de betaalinstelling, hun vorderingen niet op
      deze geldmiddelen kunnen verhalen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40a
  - number: 40a.3
    text: |-
      Voor de toepassing van het tweede lid zijn veilige activa met een lage risicograad activa die vallen in een van
      de categorieën opgenomen in artikel 336, eerste lid, tabel 1, van de verordening kapitaalvereisten waarvoor het
      kapitaalvereiste voor het specifieke risico niet hoger ligt dan 1,6%, terwijl andere in aanmerking komende activa,
      als bedoeld in artikel 336, vierde lid, van de verordening, worden uitgesloten. Voor de toepassing van het tweede
      lid zijn veilige activa met een lage risicograad eveneens deelnemingsrechten in een instelling voor collectieve
      belegging in effecten (ICBE) die enkel investeert in activa zoals gespecificeerd in de eerste alinea. In
      buitengewone omstandigheden en wanneer dit voldoende gemotiveerd is, mogen de bevoegde autoriteiten, op basis van
      een evaluatie van de veiligheid, de looptijd, de waarde of andere risicofactoren van de activa zoals gespecificeerd
      in de eerste en tweede alinea, bepalen welke van deze activa geen veilige activa met een lage risicograad zijn voor
      de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40a
  - number: 40a.4
    text: |-
      Indien het deel van de geldmiddelen dat bestemd is voor toekomstige betalingstransacties niet bekend of variabel
      is, is het de betaalinstellingen toegestaan om het eerste lid uitsluitend toe te passen op een representatief
      gedeelte dat geacht wordt voor betalingsdiensten te worden gebruikt. Dit representatieve gedeelte moet
      redelijkerwijs kunnen worden geraamd op basis van historische gegevens.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40a
  - number: 40a.5
    text: |-
      Een betaalinstelling die betaaldiensten verleent als bedoeld onder 7 van de bijlage bij de richtlijn betaaldiensten
      houdt op geen enkel moment de met het aanbieden van de betaalinitiatiedienst verband houdende geldmiddelen van de
      betaler aan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40a
  - number: 40a.6
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op elektronischgeldinstellingen als bedoeld in
      [artikel 3:29a, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40b.1
    text: |-
      Een elektronischgeldinstelling als bedoeld in [artikel 3:29a, tweede lid, van de wet][ref1], stelt de middelen die
      zij ontvangt in ruil voor elektronisch geld dat is uitgegeven, veilig op het moment dat deze gelden ter beschikking
      komen van de elektronischgeldinstelling doch uiterlijk vijf werkdagen na uitgifte van het elektronisch geld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40b.2
    text: |-
      De financiële onderneming stelt chartale of girale gelden die zij ontvangt in ruil voor elektronisch geld op een
      van de volgende wijzen veilig:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40b
  - number: 40b.2.a
    text: de gelden worden niet vermengd met de geldmiddelen van andere schuldeisers van de elektronischgeldinstelling;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40b
  - number: 40b.2.b
    text: |-
      de gelden worden gedekt door een verzekeringspolis of een vergelijkbare garantie van een verzekeraar of
      een bank die niet tot dezelfde groep behoort als de elektronischgeldinstelling, tegen het risico dat de
      elektronischgeldinstelling niet in staat is haar verplichtingen met betrekking tot de gelden na te komen, voor
      een bedrag dat gelijk is aan het bedrag dat afgescheiden zou zijn bij het ontbreken van de verzekeringspolis of
      vergelijkbare garantie.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40b
  - number: 40b.3
    text: |-
      Indien toepassing wordt gegeven aan het tweede lid, aanhef en onderdeel a, worden de ontvangen gelden op een
      afzonderlijke rekening gestort bij een bank of belegd in veilige, liquide activa met een lage risicograad, op
      zodanige wijze dat andere schuldeisers van de elektronischgeldinstelling, in het bijzonder in het geval van
      insolventie van de elektronischgeldinstelling, hun vorderingen niet op deze gelden kunnen verhalen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40b
  - number: 40b.4
    text: |-
      Voor de toepassing van het derde lid is [artikel 40a, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40a
        hoofdstuk: 6a
  - number: 40b.5
    text: |-
      Voor de toepassing van het tweede en derde lid is [artikel 40a, vierde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40a
        hoofdstuk: 6a
  - number: 40c
    text: |-
      Betaalinstellingen of elektronischgeldinstellingen verlenen slechts krediet in verband met de in de punten 4 en 5
      van de bijlage bij de richtlijn betaaldiensten bedoelde betaaldiensten indien:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40c
  - number: 40c.a
    text: |-
      het krediet een aanvullend krediet is en uitsluitend wordt verstrekt in verband met de uitvoering van een
      betalingstransactie;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40c
  - number: 40c.b
    text: |-
      het krediet dat is verstrekt in verband met een betaaldienst die is verleend door middel van dienstverrichting naar
      een andere lidstaat of vanuit een bijkantoor in een andere lidstaat wordt terugbetaald binnen een korte termijn,
      die in geen geval meer dan twaalf maanden bedraagt;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40c
  - number: 40c.c
    text: |-
      het niet wordt verleend uit geldmiddelen die zijn ontvangen of die worden aangehouden voor het uitvoeren van
      toekomstige betalingstransacties; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40c
  - number: 40c.d
    text: |-
      het eigen vermogen van de betaalinstelling of de elektronischgeldinstelling te allen tijde in redelijke verhouding
      staat tot het totale bedrag van het verleende krediet.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40c
  - number: 40d
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *dekkingsactiva:* activa als bedoeld in
      artikel 3, onderdeel 4, van de richtlijn gedekte obligaties;
        - *overcollateralisatie:* overcollateralisatie als bedoeld in artikel 3, onderdeel 14, van de richtlijn gedekte
      obligaties;
        - *primaire activa:* primaire activa als bedoeld in artikel 3, onderdeel 12, van de richtlijn gedekte obligaties;
        - *vervangende activa:* vervangende activa als bedoeld in artikel 3, onderdeel 13, van de richtlijn gedekte
      obligaties;
        - *zekerheidsactiva:* zekerheidsactiva als bedoeld in artikel 3, onderdeel 5, van de richtlijn gedekte obligaties.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40d
  - number: 40e.1
    text: |-
      Een bank die gedekte obligaties uitgeeft, draagt er zorg voor dat de dekkingsactiva van het programma van gedekte
      obligaties waartoe een gedekte obligatie behoort, worden veiliggesteld door overgang onder algemene of bijzondere
      titel naar een andere rechtspersoon, waarbij aan de volgende voorwaarden wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40e
  - number: 40e.1.a
    text: |-
      de rechtspersoon is met uitsluiting van andere activiteiten opgericht om de dekkingsactiva van een programma van
      gedekte obligaties te scheiden van het vermogen van de bank en hetgeen te doen dat noodzakelijk is of wenselijk is
      voor het desbetreffende programma van gedekte obligaties; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40e
  - number: 40e.1.b
    text: |-
      de bank, alsmede rechtspersonen die tot dezelfde groep als de bank behoren, houden geen aandelen in de
      rechtspersoon, hebben daarin geen beleidsbepalende zeggenschap en hebben daarin ook niet op andere wijze een
      eigendomsbelang.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40e
  - number: 40e.2
    text: De bank is te allen tijde in staat om de dekkingsactiva van een programma van gedekte obligaties te identificeren.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40e
  - number: 40f.1
    text: |-
      Een bank die gedekte obligaties uitgeeft, neemt voor ten minste 80% van de totale nominale waarde van de activa in
      de dekkingspool één van de soorten dekkingsactiva, bedoeld in artikel 129, eerste lid, onderdelen a tot en met g,
      van de verordening kapitaalvereisten als primair dekkingsactivum op.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40f
  - number: 40f.2
    text: |-
      De bank kan voor ten hoogste 20% van de totale nominale waarde van de activa in de dekkingspool vervangende
      dekkingsactiva opnemen, die bestaan uit één of meer van de overige soorten activa, bedoeld in artikel 129, eerste
      lid, onderdelen a tot en met g, van de verordening kapitaalvereisten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40f
  - number: 40f.3
    text: |-
      Voor de berekening van de nominale waarde van de dekkingsactiva, bedoeld in het eerste en tweede lid, neemt de
      bank, waar van toepassing, de restricties in artikel 129, eerste lid tot en met derde lid, van de verordening
      kapitaalvereisten in acht.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40f
  - number: 40g.1
    text: |-
      De totale nominale waarde van de betalingsvorderingen voortvloeiend uit de dekkingsactiva behorend tot
      de dekkingspool is ten minste gelijk aan de totale nominale waarde van de verplichtingen, bedoeld in
      [artikel 3:33b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40g
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40g.2
    text: |-
      De totale nominale waarde van de dekkingsactiva, bedoeld in [artikel 40f, eerste en tweede lid][ref1], tezamen is
      ten minste gelijk aan de totale nominale waarde van de uitstaande gedekte obligaties en is daarnaast onderworpen
      aan een overcollateralisatie bestaande uit 5% van de nominale waarde van de uitstaande gedekte obligaties die wordt
      gedekt door de nominale waarde van dekkingsactiva, bedoeld in artikel 129, eerste lid, onderdelen a tot en met g,
      van de verordening kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40f
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40g
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40f
        hoofdstuk: 6b
  - number: 40g.3
    text: |-
      Niet door zekerheden gedekte vorderingen waarbij wanbetaling als bedoeld in artikel 178 van de verordening
      kapitaalvereisten wordt geacht zich te hebben voorgedaan, kunnen niet bijdragen aan de dekking in de dekkingspool.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40g
  - number: 40g.4
    text: |-
      Voor de berekening van de verwachte kosten, bedoeld in [artikel 3:33b, derde lid, van de wet][ref1], kan in
      afwijking van het eerste lid, in plaats van de nominale waarde een forfaitair bedrag worden gehanteerd bestaande
      uit ten minste vier basispunten van de totale nominale waarde van de uitstaande gedekte obligaties, of een vast
      bedrag van 400.000 euro, indien dat bedrag hoger is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40g
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40g.5
    text: |-
      Voor de berekening van de verschuldigde rente op de uitstaande gedekte obligaties en de te ontvangen rente met
      betrekking tot de dekkingsactiva wordt uitgegaan van de nominale waarde.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40g
  - number: 40g.6
    text: |-
      Voor de berekening van de nominale waarde van de dekkingsactiva, bedoeld in het tweede lid, neemt de bank, waar van
      toepassing, de restricties in artikel 129, eerste lid tot en met derde lid, van de verordening kapitaalvereisten
      in acht. Activa die bijdragen aan de 5% overcollateralisatie, bedoeld in het tweede lid, zijn niet onderworpen
      aan de limieten voor de omvang van de blootstelling als bepaald in artikel 129, eerste lid bis, van de verordening
      kapitaalvereisten en worden niet meegeteld voor die limieten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40g
  - number: 40h.1
    text: |-
      Een bank die gedekte obligaties uitgeeft en fysieke zekerheidsactiva hanteert die strekken tot zekerheid
      van de dekkingsactiva als bedoeld in artikel 129, eerste lid, onderdelen d tot en met g, van de verordening
      kapitaalvereisten, voldoet aan de vereisten van artikel 208 van die verordening.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40h
  - number: 40h.2
    text: |-
      De fysieke zekerheidsactiva worden gewaardeerd tegen of onder de marktwaarde of de hypotheekwaarde, bedoeld in
      artikel 4, eerste lid, onderdeel 76, onderscheidenlijk onderdeel 74, van de verordening kapitaalvereisten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40h
  - number: 40h.3
    text: |-
      De waardering van de fysieke zekerheidsactiva wordt uitgevoerd door een taxateur die voldoet aan de eisen, bedoeld
      in artikel 6, vijfde lid, onderdelen b en c, van de richtlijn gedekte obligaties.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40h
  - number: 40i.1
    text: |-
      Een bank die gedekte obligaties uitgeeft, draagt er zorg voor dat de debiteur van de dekkingsactiva zijn woonplaats
      heeft, respectievelijk is gevestigd of zijn zetel heeft, binnen de grenzen van de lidstaten van de Europese Unie,
      of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40i
  - number: 40i.2
    text: |-
      Een bank draagt er zorg voor dat, indien van toepassing, het fysieke zekerheidsactivum is gelegen binnen de grenzen
      van de lidstaten van de Europese Unie, of in een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40i
  - number: 40j.1
    text: |-
      Een bank die gedekte obligaties uitgeeft, draagt er zorg voor dat in de dekkingspool uitsluitend een
      derivatencontract wordt opgenomen indien dit bijdraagt aan de beheersing van risico’s voor de houders van gedekte
      obligaties. Een derivatencontract wordt uit de dekkingspool verwijderd indien het risico voor de houders van
      gedekte obligaties ophoudt te bestaan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40j
  - number: 40j.2
    text: |-
      Het volume van een derivatencontract wordt aangepast indien sprake is van een vermindering van het risico waarop
      het derivatencontract betrekking heeft. Een derivatencontract wordt uit de dekkingspool verwijderd indien het
      risico voor de houders van gedekte obligaties ophoudt te bestaan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40j
  - number: 40j.3
    text: 'Een derivatencontract kan uitsluitend in de dekkingspool worden opgenomen, indien het contract:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40j
  - number: 40j.3.a
    text: voldoende is gedocumenteerd;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40j
  - number: 40j.3.b
    text: |-
      niet kan worden beëindigd indien de bank die de gedekte obligaties heeft uitgegeven in staat van faillissement is
      verklaard, of indien jegens de bank op grond van [Deel 3A van de wet][ref1] een afwikkelingsmaatregel is toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40j
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 40j.3.c
    text: is gesloten met een financiële onderneming die onder toezicht staat; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40j
  - number: 40j.3.d
    text: |-
      in geval van verlies van voldoende kredietwaardigheid van de wederpartij verplicht dat de wederpartij gepaste
      zekerheid verschaft of zich als wederpartij doet vervangen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40j
  - number: 40k.1
    text: |-
      Een bank die gedekte obligaties uitgeeft, draagt er zorg voor dat de dekkingspool te allen tijde een uit liquide
      activa samengestelde liquiditeitsbuffer bevat, die beschikbaar is om de nettoliquiditeitsuitstroom, bedoeld in
      artikel 3, onderdeel 16, van de richtlijn gedekte obligaties, van het programma van gedekte obligaties te dekken.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40k
  - number: 40k.2
    text: |-
      De liquiditeitsbuffer, bedoeld in het eerste lid, dekt de maximale gecumuleerde nettoliquiditeitsuitstroom tijdens
      de volgende 180 dagen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40k
  - number: 40k.3
    text: |-
      Indien de looptijd van een gedekte obligatie op grond van [artikel 40m][ref1] kan worden verlengd, wordt bij de
      berekening van de nettoliquiditeitsuitstroom, bedoeld in het tweede lid, uitgegaan van de hoofdsom, gebaseerd op
      de einddatum.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40m
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40k
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40m
        hoofdstuk: 6b
  - number: 40k.4
    text: |-
      De liquiditeitsbuffer, bedoeld in het eerste lid, omvat de activa, bedoeld in artikel 16, derde lid, onderdelen a
      en b, van de richtlijn gedekte obligaties.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40k
  - number: 40k.5
    text: |-
      Niet door zekerheden gedekte vorderingen waarbij wanbetaling als bedoeld in artikel 178 van de verordening
      kapitaalvereisten wordt geacht zich te hebben voorgedaan, kunnen niet bijdragen aan de liquiditeitsbuffer van de
      dekkingspool.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40k
  - number: 40l.1
    text: |-
      Een bank die gedekte obligaties uitgeeft, identificeert de in [artikel 40f, eerste en tweede lid][ref1], bedoelde
      dekkingsactiva, en documenteert de wijze waarop haar kredietverleningsbeleid voldoet aan de vereisten van
      [artikel 40h][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40f
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel40h
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40l
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40f
        hoofdstuk: 6b
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 40h
        hoofdstuk: 6b
  - number: 40l.2
    text: |-
      De bank registreert alle transacties met betrekking tot het programma van gedekte obligaties en beschikt daartoe
      over adequate en passende documentatiesystemen en documentatieprocessen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40l
  - number: 40m.1
    text: |-
      Een bank die gedekte obligaties uitgeeft, kan gedekte obligaties uitgeven met een verlengbare looptijd, indien
      voorafgaand aan de eerste uitgifte van het programma van gedekte obligaties in de contractuele voorwaarden van
      dat programma is opgenomen dat verlenging van de looptijd niet kan geschieden naar goeddunken van de bank en
      uitsluitend plaatsvindt indien:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40m
  - number: 40m.1.a
    text: |-
      er sprake is van wanprestatie of wanbetaling door de bank of enig handelen daartoe, er sprake is van
      liquidatie, ontbinding of herstructurering van schulden van de bank of een schuldeisersakkoord, of op de bank
      een afwikkelingsmaatregel als bedoeld in [artikel 3A:1 van de wet][ref1] is toegepast of de bank in staat van
      faillissement is verklaard; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40m
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 40m.1.b
    text: |-
      de rechtspersoon waarop de dekkingsactiva zijn overgegaan op de einddatum van de gedekte obligaties over
      onvoldoende middelen beschikt voor de aflossing van de hoofdsom van die gedekte obligatie, die rechtspersoon
      niet kan voldoen aan een van de dekkingsvereisten, bedoeld in [artikel 40g, eerste en tweede lid][ref1], of die
      rechtspersoon niet kan voldoen aan een ander contractueel overeengekomen vereiste met betrekking tot waarborging
      van de dekking.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40g
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40m
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40g
        hoofdstuk: 6b
  - number: 40m.2
    text: |-
      Een bank die een gedekte obligatie uitgeeft waarvan de looptijd kan worden verlengd, verstrekt bij uitgifte van de
      gedekte obligatie informatie over:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40m
  - number: 40m.2.a
    text: de voorwaarden voor verlenging van de looptijd;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40m
  - number: 40m.2.b
    text: |-
      de gevolgen die het faillissement of de afwikkeling van de bank die gedekte obligaties uitgeeft, heeft voor de
      verlenging van de looptijd; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40m
  - number: 40m.2.c
    text: de rol van de Nederlandsche Bank ten aanzien van de verlenging van de looptijd.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40m
  - number: 40m.3
    text: |-
      Een bank die een gedekte obligatie uitgeeft, draagt er zorg voor dat de einddatum van die gedekte obligatie te
      allen tijde kan worden bepaald.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40m
  - number: 40m.4
    text: |-
      Indien op de bank een afwikkelingsmaatregel als bedoeld in [artikel 3A:1 van de wet][ref1] is toegepast of de
      bank in staat van faillissement is verklaard, is een looptijdverlenging niet van invloed op de volgorde waarin
      houders van gedekte obligaties hun vorderingen kunnen verhalen en wordt de volgorde van het oorspronkelijke
      looptijdenschema van het programma van gedekte obligaties niet omgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40m
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 40m.5
    text: |-
      De looptijdverlenging heeft geen invloed op het recht van een houder van een gedekte obligatie om
      zijn vordering te verhalen op zowel de bank als op de rechtspersoon waarop de dekkingsactiva ingevolge
      [artikel 40e][ref1] zijn overgegaan of op de uitoefening van de rechten van de schuldeisers als bedoeld in
      [artikel 212re van de Faillissementswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40e
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel212re
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40m
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40e
        hoofdstuk: 6b
      - id: ref2
        bwb_id: BWBR0001860
        artikel: 212re
  - number: 40n.1
    text: |-
      Een bank die gedekte obligaties uitgeeft, draagt er zorg voor dat voorafgaand aan de eerste uitgifte
      van een programma van gedekte obligaties een dekkingspoolmonitor wordt aangesteld die geen banden heeft
      met en onafhankelijk is van de bank en de externe accountant van de bank en die ten minste jaarlijks
      controleert of de bank voldoet aan de [artikelen 3:33b][ref1] en [3:33ba van de wet][ref2] en de
      [artikelen 40e tot en met 40m][ref3], waarbij de controle van de [artikelen 40g][ref4] en [40k][ref5] in ieder
      geval door een accountant wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel40e
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel40g
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Artikel40k
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40n
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: 40e
        hoofdstuk: 6b
      - id: ref4
        bwb_id: BWBR0020420
        artikel: 40g
        hoofdstuk: 6b
      - id: ref5
        bwb_id: BWBR0020420
        artikel: 40k
        hoofdstuk: 6b
  - number: 40n.2
    text: |-
      In afwijking van het eerste lid, kan een dekkingspoolmonitor worden aangesteld die banden heeft met de bank,
      waaronder de externe accountant van de bank, indien in ieder geval de jaarlijkse controle of de bank voldoet aan de
      [artikelen 40g][ref1] en [40k][ref2] door die externe accountant wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40g
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel40k
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40n
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40g
        hoofdstuk: 6b
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 40k
        hoofdstuk: 6b
  - number: 40n.3
    text: |-
      De dekkingspoolmonitor georganiseerd overeenkomstig het tweede lid is onafhankelijk van het kredietacceptatieproces
      van de bank, kan niet van de functie van dekkingspoolmonitor worden ontheven zonder voorafgaande toestemming
      van de raad van commissarissen van de bank of het orgaan dat een daarmee vergelijkbare taak heeft, bedoeld in
      [artikel 3:19, tweede lid, van de wet][ref1], en heeft direct toegang tot de raad van commissarissen van de bank of
      het orgaan dat een daarmee vergelijkbare taak heeft, bedoeld in artikel 3:19, tweede lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40n
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40n.4
    text: |-
      De bank draagt er zorg voor dat de controle van de [artikelen 40g][ref1] en [40k][ref2] blijft plaatsvinden indien
      en nadat ten aanzien van de bank een afwikkelingsmaatregel als bedoeld in [artikel 3A:1 van de wet][ref3] is
      toegepast of indien en nadat de bank in staat van faillissement is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40g
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel40k
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40n
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40g
        hoofdstuk: 6b
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 40k
        hoofdstuk: 6b
      - id: ref3
        bwb_id: BWBR0020368
        artikel: 3a
  - number: 40n.5
    text: |-
      De bank brengt jaarlijks verslag uit aan de Nederlandsche Bank over de uitkomsten van de controle ten aanzien van
      de [artikelen 40g][ref1] en [40k][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40g
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel40k
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40n
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40g
        hoofdstuk: 6b
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 40k
        hoofdstuk: 6b
  - number: 40n.6
    text: |-
      De bank draagt er zorg voor dat de dekkingspoolmonitor voor de uitoefening van zijn taken over alle daartoe
      benodigde informatie beschikt.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40n
  - number: 40o
    text: |-
      Het label «Europese gedekte obligaties (premium)» wordt uitsluitend gebruikt voor gedekte obligaties die voldoen
      aan de vereisten ingevolge de [artikelen 3:33a][ref1], [3:33b][ref2] en [3:33ba van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40o
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40p.1
    text: |-
      Een bank die een aanvraag doet als bedoeld in [artikel 3:33a, tweede lid, van de wet][ref1], verstrekt aan de
      Nederlandsche Bank de volgende informatie ten aanzien van het programma van gedekte obligaties:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40p.1.a
    text: |-
      een juridische opinie van een juridisch deskundige die onafhankelijk is van de bank op basis waarvan de
      Nederlandsche Bank kan beoordelen of wordt voldaan aan [artikel 40e, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40e
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40e
        hoofdstuk: 6b
  - number: 40p.1.b
    text: de overeenkomsten van de rechtspersoon die rechthebbende is van de dekkingsactiva met zijn bestuurder;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
  - number: 40p.1.c
    text: |-
      de overeenkomst met de dekkingspoolmonitor of de accountant, bedoeld in [artikel 40n][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40n
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40n
        hoofdstuk: 6b
  - number: 40p.1.d
    text: |-
      een schriftelijke verklaring van de bestuurder van de bank waaruit blijkt dat aan het bepaalde ingevolge de
      [artikelen 3:33a, derde en vierde lid][ref1], [3:33b][ref2] en [3:33ba][ref3] wordt voldaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40p.1.e
    text: |-
      andere door de Nederlandsche Bank benodigde informatie voor de beoordeling, bedoeld in
      [artikel 3:33a, tweede lid van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40p.2
    text: |-
      Een bank waaraan toestemming is verleend op grond van [artikel 3:33a, tweede lid, van de wet][ref1] meldt de
      Nederlandsche Bank terstond wijzigingen met betrekking tot de gegevens, bedoeld in het eerste lid, onderdelen b en
      c. Zij verstrekt de verklaring, bedoeld in het eerste lid, onderdeel d, jaarlijks.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40p.3
    text: |-
      De gegevens, bedoeld in [artikel 3:33ba, tweede lid, van de wet][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40p.3.a
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan de dekkingsvereisten in de
      [artikelen 40f][ref1] en [40g][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40f
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel40g
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40f
        hoofdstuk: 6b
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 40g
        hoofdstuk: 6b
  - number: 40p.3.b
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan de vereisten met betrekking tot
      waardering, verzekering en lokalisatie in de [artikelen 40h][ref1] en [40i][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40h
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel40i
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40h
        hoofdstuk: 6b
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 40i
        hoofdstuk: 6b
  - number: 40p.3.c
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan de vereisten met betrekking tot
      in de dekkingspool opgenomen derivatencontracten in [artikel 40j][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40j
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40j
        hoofdstuk: 6b
  - number: 40p.3.d
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan de vereisten met betrekking tot
      de liquiditeitsbuffer in [artikel 40k][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40k
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40k
        hoofdstuk: 6b
  - number: 40p.3.e
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan de vereisten met betrekking tot
      de verlengbare looptijd in [artikel 40m][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40m
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40m
        hoofdstuk: 6b
  - number: 40p.3.f
    text: |-
      andere door de Nederlandsche Bank benodigde informatie voor de beoordeling of de bank voldoet aan het bepaalde
      ingevolge de [artikelen 3:33a, derde en vierde lid][ref1], [3:33b][ref2] en [3:33ba, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 40p.4
    text: |-
      De gegevens, bedoeld in het derde lid, onderdelen a en d, worden bij aanvang van het programma verstrekt en
      vervolgens elk kwartaal. De gegevens, bedoeld in het derde lid, onderdelen b, c, e en f, worden bij aanvang van het
      programma verstrekt en uitsluitend opnieuw verstrekt indien zij zijn gewijzigd of op verzoek van de Nederlandsche
      Bank.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
  - number: 40p.5
    text: |-
      Een bank die een gedekte obligatie uitgeeft, en die gedurende de looptijd van de gedekte obligatie voornemens is
      significante wijzigingen aan te brengen in de voorwaarden die van toepassing zijn op die gedekte obligatie, doet
      voorafgaand aan het doorvoeren daarvan mededeling aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40p
  - number: 40q
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de activa, bedoeld in artikel 6, eerste lid, onderdelen b en c,
      van de richtlijn gedekte obligaties, onder de daarin te bepalen voorwaarden als primaire of vervangende activa in
      de dekkingspool, als bedoeld in [artikel 40g, eerste en tweede lid][ref1], kunnen worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel40g
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel40q
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 40g
        hoofdstuk: 6b
  - number: '41.1'
    text: |-
      In afwijking van de [artikelen 3:36, derde lid][ref1], en [3:43, eerste lid, van de wet][ref2] is het
      schadeverzekeraars toegestaan in de uitoefening van hun bedrijf, naast de risico’s die behoren tot de branche
      waarvoor de vergunning is verleend, tevens risico’s te verzekeren die behoren tot andere branches, met uitzondering
      van de branches Krediet en Borgtocht, indien deze risico’s naar het oordeel van de Nederlandsche Bank als
      bijkomende risico’s kunnen worden beschouwd, omdat zij:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 41.1.a
    text: samenhangen met het hoofdrisico dat behoort tot de branche waarvoor de vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel41
  - number: 41.1.b
    text: betrekking hebben op het belang of gevaarsobject dat is verzekerd tegen het hoofdrisico; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel41
  - number: 41.1.c
    text: worden verzekerd bij dezelfde overeenkomst als het hoofdrisico.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel41
  - number: '41.2'
    text: |-
      De risico’s van de branche Rechtsbijstand mogen uitsluitend worden verzekerd als bijkomend risico van de branche
      Hulpverlening en van branches waarbij risico’s worden verzekerd die verband houden met het gebruikvan zeeschepen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel41
  - number: '42'
    text: |-
      Als adres van een vertegenwoordiger in Nederland van een verzekeraar als bedoeld in [artikel 3:40 van de wet][ref1]
      waaraan rechtsgeldig mededelingen kunnen worden gedaan wordt beschouwd het in Nederland gelegen bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '43'
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:40][ref1], [3:47, zesde lid][ref2] of
      [3:50, tweede lid, van de wet][ref3] wordt geacht, indien de vertegenwoordiger ontbreekt, zijn woonplaats te
      hebben bij het parket van de officier van justitie in het arrondissement waarin de rechtbank is gelegen waar de
      verzekeraar ingevolge [artikel 42][ref4] het laatst zijn woonplaats had, of anders bij het parket van de officier
      van justitie bij het arrondissementsparket Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel42
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: '42'
        hoofdstuk: '8'
  - number: '44.1'
    text: |-
      De omstandigheden, bedoeld in [artikel 3:40][ref1] en [3:47, zesde lid, van de wet][ref2] waaronder de
      vertegenwoordiger van een verzekeraar als bedoeld in [artikel 3:40][ref3], [3:47, zesde lid][ref4], of
      [3:50, tweede lid, van de wet][ref5] ophoudt vertegenwoordiger te zijn, zijn de omstandigheden, bedoeld in het
      tweede tot en met vijfde lid en in de [artikelen 45 tot en met 47][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020420#Artikel45
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0020420
        artikel: '45'
        hoofdstuk: '8'
  - number: '44.2'
    text: |-
      De verzekeraar die voornemens is de vertegenwoordiging te beëindigen, geeft daarvan kennis aan de Nederlandsche
      Bank.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel44
  - number: '44.3'
    text: |-
      De kennisgeving, bedoeld in het tweede lid, vermeldt tevens de naam van degene die de verzekeraar voornemens is aan
      te stellen als opvolger van de vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel44
  - number: '44.4'
    text: |-
      Indien de opvolger rechtspersoon is, gaat de kennisgeving gepaard met de statuten van deze rechtspersoon, een
      opgave van het nummer van inschrijving in het handelsregister en een bewijs van aanstelling van de natuurlijke
      persoon die is aangesteld als vertegenwoordiger van de vertegenwoordiger die rechtspersoon is.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel44
  - number: '44.5'
    text: |-
      De verzekeraar, bedoeld in [artikel 3:47, eerste lid][ref1], of [3:50, tweede lid, van de wet][ref2] beëindigt de
      vertegenwoordiging op de dag waarop van de beëindiging kennis is gegeven aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '44.6'
    text: |-
      De verzekeraar, bedoeld in [artikel 3:47, eerste lid][ref1], of [artikel 3:50, tweede lid, van de wet][ref2] geeft
      geen uitvoering aan het voornemen indien de Nederlandsche Bank er niet mee instemt. Indien de Nederlandsche Bank
      besluit niet in te stemmen met het voornemen, maakt zij haar besluit daartoe aan de financiële onderneming bekend:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 44.6.a
    text: binnen zes weken na ontvangst van de kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel44
  - number: 44.6.b
    text: |-
      indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel44
  - number: '45.1'
    text: |-
      De vertegenwoordiger, bedoeld in [artikel 3:40][ref1], [3:47, zesde lid][ref2], of
      [3:50, tweede lid, van de wet][ref3] die voornemens is de vertegenwoordiging te beëindigen, geeft daarvan kennis
      aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '45.2'
    text: |-
      De vertegenwoordiger van een verzekeraar als bedoeld in [artikel 3:47, eerste lid][ref1], of
      [3:50, tweede lid, van de wet][ref2] behoudt de hoedanigheid van vertegenwoordiger tot de dag waarop hij van de
      beëindiging kennis heeft gegeven aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '45.3'
    text: |-
      De vertegenwoordiger geeft geen uitvoering aan het voornemen indien de Nederlandsche Bank er niet mee instemt.
      Indien de Nederlandsche Bank besluit niet in te stemmen met het voornemen, maakt zij haar besluit daartoe aan de
      financiële onderneming bekend:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel45
  - number: 45.3.a
    text: binnen zes weken na ontvangst van de kennisgeving; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel45
  - number: 45.3.b
    text: |-
      indien de Nederlandsche Bank binnen twee weken na ontvangst van de kennisgeving om nadere gegevens heeft
      verzocht, binnen vier weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van
      de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel45
  - number: '46.1'
    text: |-
      De vertegenwoordiger van een verzekeraar als bedoeld in [artikel 3:40][ref1], [3:47, tweede lid][ref2]
      of [3:50, tweede lid, van de wet][ref3] houdt op vertegenwoordiger te zijn vanaf de dag van het van
      toepassing verklaren van de schuldsanering natuurlijke personen, de verlening van surseance van betaling, de
      faillietverklaring, de ontbinding, bedoeld in [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref4], de
      onderbewindstelling van een of meer goederen, bedoeld in [titel 19 van Boek 1 van het Burgerlijk Wetboek][ref5], of
      de ondercuratelestelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0002656
  - number: '46.2'
    text: |-
      De aanwijzing door de vertegenwoordiger van een natuurlijk persoon die is aangewezen als vertegenwoordiger die een
      rechtspersoon is, vervalt van rechtswege op de dag van het van toepassing verklaren van de schuldsaneringsregeling
      natuurlijke personen, de verlening van surseance van betaling, de faillietverklaring, de ontbinding, bedoeld
      in [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref1], of de ondercuratelestelling van de aangewezen
      natuurlijk persoon alsmede op de dag van verlening van surseance van betaling aan of faillietverklaring van de
      vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel19
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '19'
  - number: '47.1'
    text: |-
      Van het overlijden, het van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen, de verlening van surseance van betaling, de faillietverklaring, de ontbinding, bedoeld in
      [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref1], de onderbewindstelling van een of meer goederen, bedoeld
      in [titel 19 van Boek 1 van het Burgerlijk Wetboek][ref2], of de ondercuratelestelling van de vertegenwoordiger
      of de natuurlijke persoon die is aangewezen als vertegenwoordiger van de vertegenwoordiger die rechtspersoon is,
      alsmede van de beëindiging van de vertegenwoordiging van de vertegenwoordiger door deze natuurlijke persoon, geeft
      de verzekeraar onderscheidenlijk de vertegenwoordiger binnen zeven dagen kennis aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002656
  - number: '47.2'
    text: |-
      De verzekeraar, bedoeld in [artikel 3:40 van de wet][ref1], legt, in de gevallen, genoemd in het eerste lid, en
      in het geval dat de vertegenwoordiger of de natuurlijke persoon, bedoeld in het eerste lid, de vertegenwoordiging
      heeft beëindigd, aan de Nederlandsche Bank een bewijs van aanstelling van de vertegenwoordiger over alsmede,
      indien de vertegenwoordiger een rechtspersoon is, de statuten van deze rechtspersoon, een opgave van het nummer
      van inschrijving in het handelsregister en een bewijs van aanstelling van de natuurlijke persoon, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '47.3'
    text: |-
      De verzekeraar, bedoeld in het tweede lid, verstrekt de gegevens, bedoeld in het tweede lid, binnen twee weken na
      de betrokken aanstelling.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel47
  - number: '47.4'
    text: |-
      De verzekeraar, bedoeld in [artikel 3:47, tweede lid][ref1], of [3:50, tweede lid, van de wet][ref2], wijst,
      in de gevallen, genoemd in het eerste lid, en in het geval dat de vertegenwoordiger of de natuurlijke persoon,
      bedoeld in [artikel 3:47, vijfde lid, van de wet][ref3], de vertegenwoordiging heeft beëindigd, binnen een door de
      Nederlandsche Bank te bepalen termijn een nieuwe vertegenwoordiger onderscheidenlijk natuurlijk persoon aan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '47.5'
    text: |-
      De verzekeraar, bedoeld in het vierde lid, legt aan de Nederlandsche Bank een bewijs van aanstelling van de
      nieuwe vertegenwoordiger over alsmede, indien de nieuwe vertegenwoordiger rechtspersoon is, de statuten van deze
      rechtspersoon, een uittreksel uit diens inschrijving in het handelsregister en de akte van aanstelling van de
      natuurlijke persoon, bedoeld in [artikel 3:47, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '48.1'
    text: |-
      Het minimumbedrag aan eigen vermogen, bedoeld in [artikel 3:53, eerste lid, van de wet][ref1] bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 48.1.a
    text: |-
      € 5 miljoen voor een bank als bedoeld in [artikel 3:53, eerste lid][ref1], of [3:54, eerste lid, van de wet][ref2]
      die geen bank als bedoeld in onderdeel b is, of voor een clearinginstelling als bedoeld in
      [artikel 3:53, eerste lid][ref3], of [3:55, eerste lid, van de wet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 48.1.b
    text: |-
      € 2,5 miljoen voor een bank als bedoeld in [artikel 2:13 van de wet][ref1] die in hoofdzaak haar bedrijf maakt van
      het verlenen van beleggingsdiensten of het verrichten van beleggingsactiviteiten;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 48.1.c
    text: |-
      € 125.000 voor een beheerder van een beleggingsinstelling als bedoeld in
      [artikel 3:53, eerste lid van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 48.1.d
    text: |-
      € 125.000 voor een beheerder van een icbe als bedoeld in [artikel 3:53, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 48.1.e
    text: |-
      € 300.000 voor een beleggingsmaatschappij of een maatschappij voor collectieve belegging in effecten als bedoeld in
      [artikel 3:53, eerste lid, van de wet][ref1] die geen aparte beheerder hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 48.1.f
    text: |-
      € 750.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref1], of
      [3:54, eerste lid, van de wet][ref2] die de beleggingsdienst verleent, bedoeld in onderdeel e van de definitie
      van het verlenen van een beleggingsdienst in [artikel 1:1 van de wet][ref3], of de beleggingsactiviteit verricht,
      bedoeld in onderdeel a van de definitie van het verrichten van een beleggingsactiviteit in artikel 1:1 van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 48.1.g
    text: |-
      € 750.000 voor een beleggingsonderneming als bedoeld in [artikel 3:53, eerste lid][ref1], of
      [3:54, eerste lid, van de wet][ref2] die de beleggingsactiviteit verricht, bedoeld in onderdeel b van de definitie
      van het verrichten van een beleggingsactiviteit in [artikel 1:1 van de wet][ref3], indien de beleggingsonderneming
      handelt voor eigen rekening of het de beleggingsonderneming op grond van haar vergunning is toegestaan te handelen
      voor eigen rekening;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel48
