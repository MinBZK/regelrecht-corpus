      solvabiliteit II, ontheffing verlenen van:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel131
  - number: 131.4.a
    text: de verplichting periodieke rapportagestaten vaker dan eenmaal per jaar te verstrekken;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel131
  - number: 131.4.b
    text: itemgewijze rapportageverplichtingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel131
  - number: '132'
    text: |-
      Indien een beleggingsonderneming, betaalinstelling, clearinginstelling, elektronischgeldinstelling, entiteit
      voor risico-acceptatie, bank, kredietunie, verzekeraar of bijkantoor als bedoeld in [artikel 130][ref1] de staten
      niet langs elektronische weg verstrekt, kan de Nederlandsche Bank, op verzoek van de financiële onderneming,
      besluiten dat het de financiële onderneming is toegestaan andere informatiedragers dan de modellen, bedoeld
      in [artikel 131, eerste lid, onderdeel a][ref2], te gebruiken, indien deze wat betreft indeling en inhoud geen
      afwijking vertonen van de modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel131
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '131'
        hoofdstuk: '13'
        paragraaf: '13.2'
  - number: '133'
    text: |-
      Het onderzoek van de staten, bedoeld in [artikel 130][ref1], door de accountant, uitmondend in een verklaring
      omtrent de getrouwheid als bedoeld in [artikel 3:72, zevende lid, eerste volzin, van de wet][ref2], wordt een maal
      per jaar uitgevoerd. De Nederlandsche Bank stelt regels waarin wordt bepaald welke staten door de accountant in
      zijn onderzoek worden betrokken, met dien verstande dat een beheerder die een maal per jaar een door een accountant
      gewaarmerkte jaarrekening verstrekt daarmee voldoet aan de verplichting als bedoeld in artikel 3:72, zevende lid,
      van de wet. De accountant waarmerkt deze staten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '130'
        hoofdstuk: '13'
        paragraaf: '13.2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '134.1'
    text: |-
      De Nederlandsche Bank stelt aan de hand van openbare gegevens uit de staten de volgende niet-geaggregeerde
      kerngegevens van banken met zetel in Nederland vast en publiceert die op haar website:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.a
    text: 'de volgende gegevens met betrekking tot de activa:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.a.1°
    text: de totale activa;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.a.2°
    text: het totaal aan hypothecaire kredieten voor woningaankoop;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.a.3°
    text: het totaal aan bedrijfskredieten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.a.4°
    text: het totaal aan financiële activa;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.b
    text: het totaal aan onvolwaardige leningen, uitgedrukt als percentage van het totaal aan leningen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.c
    text: het totaal aan voorzieningen op leningen, uitgedrukt als percentage van het totaal aan leningen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.d
    text: 'de volgende gegevens met betrekking tot de passiva:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.d.1
    text: totale passiva;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.d.2°
    text: het eigen vermogen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.d.3°
    text: het vreemd vermogen, met afzonderlijke vermelding van gelden aangehouden door huishoudens;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.e
    text: de verplichtingen buiten de balans;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.f
    text: 'de volgende gegevens met betrekking tot de resultatenrekening:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.f.1°
    text: de totale baten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.f.2°
    text: de netto rentebaten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.f.3°
    text: de netto baten uit dienstverlening en provisies;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.f.4°
    text: de overige baten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.f.5°
    text: het resultaat na belastingen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.g
    text: het tier 1-kapitaal, bedoeld in artikel 25 van de verordening kapitaalvereisten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.h
    text: het tier 1-kernkapitaal, bedoeld in artikel 50 van de verordening kapitaalvereisten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.i
    text: |-
      het totaal van de risicoposten (de risicogewogen activa), bedoeld in artikel 92, derde lid, van de verordening
      kapitaalvereisten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.j
    text: 'de volgende ratio’s, bedoeld in artikel 92 van de verordening kapitaalvereisten:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.j.1°
    text: de totale kapitaalratio;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.j.2°
    text: de tier 1 kapitaalratio;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.j.3°
    text: de tier 1-kernkapitaalratio;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134.1.j.4°
    text: de hefboomratio.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: '134.2'
    text: |-
      De Nederlandsche Bank maakt de gegevens uit de staten die zij bij het vaststellen van de kerngegevens gebruikt
      bekend en maakt bekend op welk consolidatieniveau de door haar te gebruiken gegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: '134.3'
    text: De kerngegevens hebben betrekking op de financiële toestand van een bank per 30 juni en 31 december van elk jaar.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: '134.4'
    text: |-
      De Nederlandsche Bank actualiseert een kerngegeven tweemaal per jaar, op de laatste werkdag van juni en van
      december van elk jaar, tenzij het een kerngegeven, genoemd in onderdeel f, is en de bank waarop het gegeven
      betrekking heeft de gewoonte heeft haar resultatenrekening maar eenmaal per jaar te publiceren.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: '134.5'
    text: |-
      De Nederlandsche Bank gebruikt bij het vaststellen van een kerngegeven gegevens uit de meest actuele staten die
      haar twee weken voorafgaand aan de publicatie ter beschikking staan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134
  - number: 134a
    text: |-
      Tot de gegevens, bedoeld in [artikel 3:73a van de wet][ref1], behoren in ieder geval de gegevens met betrekking tot
      storingen die zich hebben voorgedaan of bijna hebben voorgedaan in het verrichten van afwikkeldiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 134b.1
    text: |-
      Een bank als bedoeld in [artikel 3:74a, eerste lid, van de wet][ref1] die over een website beschikt, geeft daarop
      uitleg over de wijze waarop zij voldoet aan de vereisten inzake bestuur, beloning en publicatie van gegevens in
      [artikel 17c][ref2], de bij of krachtens [artikel 23e, vijfde lid][ref3], gestelde regels, het Besluit uitvoering
      publicatieverplichtingen richtlijn kapitaalvereisten en [artikel 3:8, derde en vierde lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel17c
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel23e
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 17c
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: 23e
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 134b.2
    text: |-
      Een beleggingsonderneming onder de verordening kapitaalvereisten die over een website beschikt, geeft daarop uitleg
      over de wijze waarop zij voldoet aan de bij of krachtens [artikel 23e, vijfde lid][ref1], gestelde regels en het
      [Besluit uitvoering publicatieverplichtingen richtlijn kapitaalvereisten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel23e
      [ref2]: https://wetten.overheid.nl/BWBR0035575
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 23e
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0035575
  - number: 134b.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een bank met zetel in een staat die geen lidstaat is die haar
      bedrijf uitoefent vanuit een in Nederland gelegen bijkantoor.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134b
  - number: 134c.1
    text: |-
      Een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-omvang, publiceert
      jaarlijks een rapport over de solvabiliteit en financiële positie overeenkomstig de artikelen 51 en 53, derde en
      vierde lid, van de richtlijn solvabiliteit II en met inachtneming van titel I, hoofdstuk XII, van de verordening
      solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134c
  - number: 134c.2
    text: |-
      De verzekeraar maakt in het geval van belangrijke ontwikkelingen die van invloed zijn op de relevantie van de
      overeenkomstig het eerste lid bekend gemaakte informatie, informatie bekend over de aard en gevolgen van die
      belangrijke ontwikkelingen, overeenkomstig artikel 54 van de richtlijn en met inachtneming van artikel 302 van de
      verordening solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134c
  - number: 134d
    text: |-
      [Artikel 134c][ref1] is van overeenkomstige toepassing op in Nederland gelegen bijkantoren van:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel134c
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134d
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 134c
        hoofdstuk: '13'
        paragraaf: 13.2c
  - number: 134d.a
    text: |-
      levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134d
  - number: 134d.b
    text: herverzekeraars met zetel in een niet-aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134d
  - number: 134da.1
    text: |-
      De Nederlandsche Bank staat een verzekeraar als bedoeld in [artikel 134c][ref1] of [artikel 134d][ref2] toe
      bepaalde informatie in het rapport over de solvabiliteit en financiële positie niet openbaar bekend te maken,
      indien is voldaan aan een van de voorwaarden, genoemd in artikel 53, eerste lid, van de richtlijn solvabiliteit II.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel134c
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel134d
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134da
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 134c
        hoofdstuk: '13'
        paragraaf: 13.2c
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 134d
        hoofdstuk: '13'
        paragraaf: 13.2c
  - number: 134da.2
    text: |-
      De verzekeraar vermeldt in het rapport over de solvabiliteit en financiële positie de reden voor het niet openbaar
      bekend maken van de in het eerste lid bedoelde informatie.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134da
  - number: 134db
    text: |-
      Een verzekeraar als bedoeld in [artikel 134c][ref1] of [134d][ref2] behoeft tot en met 31 december 2020 de
      informatie, bedoeld in artikel 51, tweede lid, derde alinea, van de richtlijn solvabiliteit II niet afzonderlijk
      openbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel134c
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel134d
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134db
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 134c
        hoofdstuk: '13'
        paragraaf: 13.2c
      - id: ref2
        bwb_id: BWBR0020420
        artikel: 134d
        hoofdstuk: '13'
        paragraaf: 13.2c
  - number: 134e
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:73c][ref1], [3:82a][ref2] of [3:86a][ref3] met beperkte risico-omvang
      maakt jaarlijks binnen een termijn van zes maanden de jaarrekening, het bestuursverslag en de overige gegevens
      openbaar en vermeldt daarbij in de toelichting op de jaarrekening:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134e
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 134e.a
    text: |-
      de in overeenstemming met de [wet][ref1] en dit besluit opgestelde balans en de daarbij gehanteerde grondslagen en
      methoden voor de waardering van activa, technische voorzieningen en andere verplichtingen, met een toelichting op
      de belangrijkste verschillen met de grondslagen en methoden die in de jaarrekening voor de waardering ervan zijn
      gehanteerd;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134e
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 134e.b
    text: het bedrag en de samenstelling van het aanwezige solvabiliteitskapitaal;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134e
  - number: 134e.c
    text: het bedrag van het solvabiliteitskapitaalvereiste en van het minimumkapitaalvereiste;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134e
  - number: 134e.d
    text: |-
      indien [artikel 19, derde lid][ref1], op de verzekeraar van toepassing is: het bedrag van de technische
      voorzieningen indien deze worden berekend op basis van afkoop van alle verzekeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel19
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134e
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 134e.e
    text: 'indien van toepassing: informatie over de winstdeling ten gunste van polishouders per productgroep;'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134e
  - number: 134e.f
    text: |-
      indien de verzekeraar niet voldoet aan het minimumkapitaalvereiste of significant niet voldoet aan het
      solvabiliteitskapitaalvereiste: het bedrag van het tekort alsmede een toelichting op de oorzaak en gevolgen ervan
      en de genomen corrigerende maatregelen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134e
  - number: 134e.g
    text: |-
      indien de verzekeraar ondernemingspecifieke parameters gebruikt voor de berekening van zijn
      solvabiliteitskapitaalvereiste: de belangrijkste verschillen tussen die parameters en de aannames die ten grondslag
      liggen aan de standaardformule;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134e
  - number: 134e.h
    text: |-
      indien aan de verzekeraar door de Nederlandsche Bank specifieke parameters ter berekening van
      verzekeringstechnische risicomodules zijn opgelegd: het effect daarvan, alsmede de gronden van het daartoe
      strekkende besluit van de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel134e
  - number: '135.1'
    text: |-
      Een levensverzekeraar als bedoeld in [artikel 3:74, eerste lid][ref1], [3:78, eerste lid][ref2], of
      [3:83, eerste lid, van de wet][ref3], vermeldt bij de opgave van gesloten levensverzekeringen per branche de in het
      boekjaar geboekte premies, niet verminderd met het bedrag van de herverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '135.2'
    text: |-
      Een schadeverzekeraar als bedoeld in [artikel 3:74, eerste lid][ref1], [3:78, eerste lid][ref2], of
      [3:83, eerste lid, van de wet][ref3] vermeldt bij de opgave van gesloten schadeverzekeringen per branchegroep de in
      het boekjaar geboekte premies, schaden en provisies, telkens niet verminderd met het bedrag van de herverzekering.
      Deze gegevens alsmede de frequentie en de gemiddelde kosten van de schadegevallen, worden voor de branche
      Aansprakelijkheid motorrijtuigen evenwel afzonderlijk vermeld. De Nederlandsche Bank stelt de branchegroepen vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '135.3'
    text: |-
      Een natura-uitvaartverzekeraar als bedoeld in [artikel 3:87, eerste lid, van de wet][ref1], vermeldt bij de opgave
      van gesloten natura-uitvaartverzekeringen de in het boekjaar geboekte premies, niet verminderd met het bedrag van
      de herverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '135.4'
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:74, eerste lid][ref1], of [3:83, eerste lid, van de wet][ref2] vermeldt
      bij de in dat artikellid bedoelde opgave de gegevens, bedoeld in het eerste en tweede lid, per lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '135.5'
    text: |-
      De [artikelen 131, eerste lid, aanhef en onderdeel a][ref1], en [132][ref2] zijn van overeenkomstige toepassing op
      de verstrekking van de opgaven, bedoeld in het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel132
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '131'
        hoofdstuk: '13'
        paragraaf: '13.2'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '132'
        hoofdstuk: '13'
        paragraaf: '13.2'
  - number: 135a.1
    text: |-
      De Nederlandsche Bank kan, al dan niet periodiek, andere gegevens dan de gegevens, bedoeld in artikel 24, eerste,
      tweede en vierde lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen, van een beheerder van
      een beleggingsinstelling verlangen indien de Nederlandsche Bank dit nodig acht om de stabiliteit van het financiële
      stelsel te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel135a
  - number: 135a.2
    text: |-
      De Nederlandsche Bank kan de in het eerste lid bedoelde gegevens alleen verlangen indien de Europese Autoriteit van
      effecten en markten hiervan in kennis is gesteld of de Europese Autoriteit van effecten en markten de Nederlandsche
      Bank hierom heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel135a
  - number: 135b
    text: |-
      De Nederlandsche Bank kan ter uitvoering van internationaal aanvaarde standaarden nadere regels stellen met
      betrekking tot het effectief verlenen van afwikkeldiensten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel135b
  - number: '136'
    text: |-
      De door een accountant als bedoeld in [artikel 3:88, tweede lid][ref1], [3:90][ref2], [3:91][ref3] of
      [3:93 van de wet][ref4] te verstrekken gegevens zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 136.a
    text: het accountantsverslag aan de bestuurders en de raad van commissarissen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel136
  - number: 136.b
    text: de directiebrieven;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel136
  - number: 136.c
    text: |-
      overige correspondentie tussen de accountant en de financiële onderneming die rechtstreeks betrekking heeft op de
      verklaring omtrent de getrouwheid van de jaarrekening of de staten van de financiële onderneming; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel136
  - number: 136.d
    text: |-
      indien de Nederlandsche Bank daarom verzoekt, een nadere toelichting op de gegevens, bedoeld in de onderdelen a tot
      en met c.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel136
  - number: '137.1'
    text: |-
      De accountant of actuaris die voornemens is gegevens als bedoeld in [artikel 136][ref1] te verstrekken, stelt de
      financiële onderneming daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel136
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '136'
        hoofdstuk: '14'
  - number: '137.2'
    text: |-
      Indien de financiële onderneming dat wenst, kan zij zelf de gegevens aan de Nederlandsche Bank verstrekken. In dat
      geval stelt zij de accountant of de actuaris daarvan in kennis. De accountant of de actuaris vergewist zich ervan
      dat de Nederlandsche Bank de gegevens heeft ontvangen en dat de inhoud van de gegevens hem geen aanleiding geeft
      alsnog gegevens aan de Nederlandsche Bank te verstrekken.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel137
  - number: '137.3'
    text: |-
      Indien de accountant of actuaris schriftelijk gegevens verstrekt aan de Nederlandsche Bank, zendt hij onverwijld
      aan de financiële onderneming een afschrift van de gegevens en, indien van toepassing, van de begeleidende brief.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel137
  - number: '138.1'
    text: |-
      De gegevens, bedoeld in [artikel 3:95, tweede lid][ref1], en [3:96, tweede lid, van de wet][ref2] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 138.1.1°
    text: |-
      een opgave van de omvang van een gekwalificeerde deelneming als bedoeld in [artikel 3:95 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 138.1.2°
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:99 van de wet][ref1] is bepaald met betrekking tot de betrouwbaarheid van de aanvrager of houder van
      een verklaring van geen bezwaar die op grond van zijn gekwalificeerde deelneming het beleid van de betrokken
      onderneming zou kunnen bepalen of mede bepalen of zou bepalen of mede bepalen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 138.1.3°
    text: |-
      gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 3:99a van de wet][ref1] is bepaald met betrekking tot de geschiktheid, gelet op diens reputatie, van de
      aanvrager of houder van een verklaring van geen bezwaar die op grond van zijn gekwalificeerde deelneming het beleid
      van de betrokken onderneming zou kunnen bepalen of mede bepalen of zou bepalen of mede bepalen; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 138.1.4°
    text: |-
      bescheiden waaruit de financiële positie en de juridische groepsstructuur van de aanvrager of houder van een
      verklaring van geen bezwaar blijken.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: '138.2'
    text: 'De gegevens, bedoeld in het eerste lid, onder 2°, zijn:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: 138.2.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: 138.2.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: 138.2.c
    text: |-
      gegevens met betrekking tot de antecedenten, bedoeld in [bijlage A][ref1] bij dit besluit; en


      [ref1]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020420
  - number: 138.2.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: '138.3'
    text: 'De gegevens, bedoeld in het eerste lid, onder 3°, zijn:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: 138.3.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: 138.3.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: 138.3.c
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: 138.3.d
    text: een opgave van de relevante diploma’s;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: 138.3.e
    text: gegevens met betrekking tot het verwerven en besturen van deelnemingen; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: 138.3.f
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel138
  - number: '139'
    text: |-
      Tot de liquide middelen van een vennootschap als bedoeld in [artikel 3:96, derde lid, van de wet][ref1] worden
      uitsluitend gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 139.a
    text: aanwezige munten of bankbiljetten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel139
  - number: 139.b
    text: direct opvorderbare tegoeden;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel139
  - number: 139.c
    text: kortlopende vorderingen die geen direct opvorderbare tegoeden zijn; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel139
  - number: 139.d
    text: |-
      activa die geen kortlopende vorderingen zijn en die op zeer korte termijn en zonder substantiële verliezen kunnen
      worden omgezet in munten of bankbiljetten of direct opvorderbare tegoeden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel139
  - number: 140a
    text: |-
      De gegevens, bedoeld in [artikel 3:111b, eerste lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 140a.a
    text: een opgave van de naam, het adres, het telefoon- en faxnummer en emailadres van de betaaldienstagent;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel140a
  - number: 140a.b
    text: |-
      een beschrijving van de interne controlemechanismen die door de betaaldienstagent zullen worden gebruikt om de in
      de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] neergelegde verplichtingen na te komen;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: 140a.c
    text: |-
      de identiteit van de bestuurders en de personen die verantwoordelijk zijn voor het beleid van de betaaldienstagent
      die bij het aanbieden van betaaldiensten wordt gebruikt, alsmede gegevens waaruit blijkt dat zij betrouwbaar en
      deskundig zijn;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel140a
  - number: 140a.d
    text: de betaaldiensten die de betaaldienstagent namens de betaalinstelling verleent; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel140a
  - number: 140a.e
    text: voor zover van toepassing, de unieke identificatiecode of het unieke identificatienummer van de betaaldienstagent.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel140a
  - number: '141.1'
    text: |-
      Onverminderd het tweede lid is [hoofdstuk 5][ref1] niet van toepassing op overeenkomsten met betrekking tot het
      uitbesteden van werkzaamheden die:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Hoofdstuk5
