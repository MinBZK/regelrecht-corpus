  - number: '51'
    text: |-
      Het minimumbedrag aan eigen vermogen van een bewaarder of pensioenbewaarder als bedoeld in
      [artikel 3:53, eerste lid, van de wet][ref1] wordt gevormd door de waarde van de vermogensbestanddelen, bedoeld
      in de artikelen 26, eerste lid, onderdelen a tot en met e, 51 en 62 van de verordening kapitaalvereisten.
      Op een bewaarder of pensioenbewaarder met de rechtsvorm van een stichting is artikel 27 van de verordening
      kapitaalvereisten van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '52'
    text: |-
      Het minimumkapitaalvereiste van een verzekeraar als bedoeld in [artikel 3:53, eerste lid][ref1],
      [3:54, eerste lid][ref2], of [3:55, eerste lid, van de wet][ref3] of van een bijkantoor als bedoeld in
      [artikel 3:54, derde lid][ref4], [3:55, tweede lid][ref5], of [3:55a, eerste lid, van de wet][ref6] wordt
      gevormd door de waarde van het kernvermogen, bedoeld in artikel 88 van de richtlijn solvabiliteit II, voor
      zover dat ingevolge artikel 98, tweede en vierde lid, van de richtlijn solvabiliteit II, en met inachtneming
      van artikel 82, tweede en derde lid, van de verordening solvabiliteit II, in aanmerking komt ter dekking van het
      minimumkapitaalvereiste.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel52
