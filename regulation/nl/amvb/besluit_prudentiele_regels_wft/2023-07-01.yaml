        bwb_id: BWBR0020420
        hoofdstuk: '5'
  - number: 141.1.a
    text: |-
      zijn gesloten door een clearinginstelling, bank, verzekeraar of bijkantoor als bedoeld in
      [artikel 3:18, eerste lid][ref1], [3:23][ref2], [3:26][ref3] of [3:27 van de wet][ref4] voor de datum van
      inwerkingtreding van dit besluit; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel141
    references:
