  - number: '54.1'
    text: |-
      De waarden die dienen ter dekking van de absolute ondergrens van het minimumkapitaalvereiste, bedoeld in artikel
      129, eerste lid, onderdeel d, van de richtlijn solvabiliteit II, van een levensverzekeraar of schadeverzekeraar als
      bedoeld in [artikel 3:54, eerste lid, van de wet][ref1] zijn voor ten minste de helft aanwezig in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '54.2'
    text: |-
      De waarden ter dekking van de absolute ondergrens van het minimumkapitaalvereiste, bedoeld in
      [artikel 49b, tweede lid][ref1], van een verzekeraar met beperkte risico-omvang als bedoeld in
      [artikel 3:55, eerste lid, van de wet][ref2], zijn voor ten minste de helft aanwezig in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 49b
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '55.1'
    text: |-
      Ten minste een vierde gedeelte van de absolute ondergrens van het minimumkapitaalvereiste, bedoeld in artikel 54,
      wordt gedekt door verhandelbare waarden die in open bewaring worden gegeven bij een bank die in Nederland haar
      bedrijf mag uitoefenen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel55
  - number: '55.2'
    text: |-
      De Nederlandsche Bank kan, met het oog op het voorkomen van waardevermindering van de waarden, bedoeld in het
      eerste lid, regels stellen met betrekking tot de voorwaarden waaronder die waarden in bewaring kunnen worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel55
  - number: '56.1'
    text: |-
      Een verzekeraar kan met de bank, bedoeld in [artikel 55, eerste lid][ref1], overeenkomen dat deze bij haar
      in bewaring gegeven waarden op naam van de verzekeraar mag overdragen aan een effectenbewaarinstelling die
      rechtspersoon is, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel55
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '55'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: 56.1.a
    text: de nakoming van de verplichtingen van de effectenbewaarinstelling is gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel56
  - number: 56.1.b
    text: |-
      de effectenbewaarinstelling zich jegens de bank heeft verplicht om hetzij die waarden hetzij een gelijke
      hoeveelheid waarden van dezelfde soort op naam van de verzekeraar in haar voorraad aanwezig te houden en na
      beëindiging van de overeenkomst tussen de verzekeraar en de bank af te geven aan de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel56
  - number: '56.2'
    text: |-
      De bank, bedoeld in [artikel 55, eerste lid][ref1], onderscheidenlijk de effectenbewaarinstelling draagt
      zelfstandig zorg voor verkrijging van nieuwe coupon- en dividendbladen en voor bewaargeving in verband met het
      bijwonen van aandeelhoudersvergaderingen door de verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel55
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '55'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '56.3'
    text: |-
      De waarden worden slechts aan de verzekeraar afgegeven en ten aanzien daarvan worden slechts rechtshandelingen
      verricht, indien de Nederlandsche Bank daartoe, op verzoek, heeft besloten. De bank, bedoeld in
      [artikel 55, eerste lid][ref1], onderscheidenlijk de effectenbewaarinstelling mag evenwel vanaf twee weken voor de
      dag der betaalbaarstelling coupons en dividendbewijzen zonder een besluit van de Nederlandsche Bank daartoe aan de
      verzekeraar afgeven, tenzij de Nederlandsche Bank heeft besloten dat zij dat niet mag. De Nederlandsche Bank deelt
      dit besluit onverwijld aan de verzekeraar mede.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel55
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '55'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '56.4'
    text: |-
      De waarden worden op verzoek van de Nederlandsche Bank aan haar ter bewaring afgegeven, indien de bank, bedoeld in
      [artikel 55, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel55
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '55'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: 56.4.a
    text: niet langer in Nederland haar bedrijf mag uitoefenen; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel56
  - number: 56.4.b
    text: |-
      de overeenkomst met de verzekeraar beëindigt dan wel de nakoming van de verplichtingen van de
      effectenbewaarinstelling niet langer waarborgt.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel56
  - number: '56.5'
    text: |-
      De Nederlandsche Bank geeft de waarden onverwijld na de afgifte, bedoeld in het vierde lid, op kosten van de
      verzekeraar in bewaring bij een bank die in Nederland haar bedrijf mag uitoefenen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel56
  - number: '59.1'
    text: |-
      De solvabiliteit van een beheerder van een beleggingsinstelling, beheerder van een icbe,
      betaalinstelling, elektronischgeldinstelling, kredietunie of premiepensioeninstelling als bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref1] is voldoende, indien het aanwezige in aanmerking komende
      toetsingsvermogen van de onderneming ten minste gelijk is aan de minimum omvang van het toetsingsvermogen, berekend
      overeenkomstig de [artikelen 60a][ref2], [61][ref3], [63][ref4], [63a][ref5], [63b][ref6] en [64][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel60a
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Artikel63a
      [ref6]: https://wetten.overheid.nl/BWBR0020420#Artikel63b
      [ref7]: https://wetten.overheid.nl/BWBR0020420#Artikel64
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
