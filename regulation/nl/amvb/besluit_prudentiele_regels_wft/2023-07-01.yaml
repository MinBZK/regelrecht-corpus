  - number: '59.3'
    text: |-
      De solvabiliteit van een bank als bedoeld in [artikel 3:57, eerste lid][ref1], of
      [3:58, eerste lid, van de wet][ref2] of een beleggingsonderneming onder de verordening kapitaalvereisten,
      is voldoende, indien het aanwezige toetsingsvermogen van de onderneming voldoet aan de op de bank of
      beleggingsonderneming van toepassing zijnde kapitaaleisen uit deel 3 van de verordening kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '59.4'
    text: |-
      De solvabiliteit van een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht
      beleggingsondernemingen is voldoende, indien het aanwezige toetsingsvermogen van de onderneming voldoet aan de
      op de beleggingsonderneming van toepassing zijnde kapitaaleisen uit delen 3 en 4 van de verordening prudentiële
      vereisten voor beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
  - number: '59.5'
    text: |-
      Op een beleggingsonderneming als bedoeld in [artikel 3:58, eerste lid, onderdeel a, van de wet][ref1], is:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 59.5.a
    text: |-
      het derde lid van overeenkomstige toepassing, indien het een beleggingsonderneming betreft waarop, zou zij haar
      zetel hebben in een lidstaat, de verordening kapitaalvereisten van toepassing zou zijn; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
  - number: 59.5.b
    text: |-
      het vierde lid van overeenkomstige toepassing, indien het een beleggingsonderneming betreft waarop, zou zij haar
      zetel hebben in een lidstaat, de verordening prudentiële vereisten voor beleggingsondernemingen van toepassing
      zou zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
  - number: '59.6'
    text: |-
      De solvabiliteit van een clearinginstelling als bedoeld in [artikel 3:57, eerste lid][ref1], of
      [3:61, eerste lid, van de wet][ref2] is voldoende, indien de omvang van het aanwezige toetsingsvermogen ten minste
      gelijk is aan de minimumomvang van het toetsingsvermogen voor een bank, berekend overeenkomstig deel 3 van de
      verordening kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '59.7'
    text: |-
      Onverminderd het eerste tot en met vierde en zesde lid is de omvang van Het aanwezige toetsingsvermogen, bedoeld in
      het eerste, derde, vierde en zesde lid, onderscheidenlijk het eigen vermogen, bedoeld in het tweede lid, ten minste
      gelijk aan het ingevolge [artikel 48][ref1] voorgeschreven minimumbedrag aan eigen vermogen, onderscheidenlijk het
      ingevolge [artikel 49][ref2], [49a][ref3] of [49b][ref4] voorgeschreven minimumkapitaalvereiste.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel49a
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel49b
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '48'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '49'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: 49a
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: 49b
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: '59.8'
    text: 'Voor de toepassing van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
  - number: 59.8.1°
    text: |-
      wordt het tier 1-kernkapitaal als bedoeld in artikel 50 van de verordening kapitaalvereisten volledig voor de
      berekening van het aanwezige toetsingsvermogen in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
  - number: 59.8.2°
    text: |-
      wordt het aanvullend tier 1-kapitaal als bedoeld in artikel 61 van de verordening kapitaalvereisten voor de
      berekening van het aanwezige toetsingsvermogen slechts in aanmerking genomen voor zover het niet meer bedraagt dan
      een derde van het tier 1-kernkapitaal;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
  - number: 59.8.3°
    text: |-
      wordt het tier 2-kapitaal als bedoeld in artikel 71 van de verordening kapitaalvereisten voor de berekening van het
      aanwezige toetsingsvermogen slechts in aanmerking genomen voor zover het niet meer bedraagt dan een derde van het
      tier 1-kapitaal; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
  - number: 59.8.4°
    text: |-
      mag, indien wordt voldaan aan de onderdelen 2° en 3°, het tier 2-kapitaal worden gesubstitueerd door aanvullend
      tier 1-kapitaal.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
  - number: '59.9'
    text: |-
      De solvabiliteit van een beheerder van een beleggingsinstelling of een beheerder van een icbe die tevens
      een beleggingsdienst verleent op grond van [artikel 2:67a, tweede lid, van de wet][ref1], respectievelijk
      [artikel 2:69c, tweede lid, van de wet][ref2] is voldoende, indien het aanwezige toetsingsvermogen van de
      onderneming voldoet aan de voor diezelfde beleggingsdienst op een beleggingsonderneming van toepassing zijnde
      kapitaaleisen van deel 3 van de verordening prudentiële vereisten voor beleggingsondernemingen, met dien verstande
      dat het toetsingsvermogen ten minste gelijk is aan het toetsingsvermogen berekent overeenkomstig het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: '59.10'
    text: |-
      De Nederlandsche Bank stelt ter uitvoering van het negende lid nadere regels met betrekking tot de toepassing van
      de kapitaaleisen van deel 3 van de verordening prudentiële vereisten voor beleggingsondernemingen voor beheerders
      van beleggingsinstellingen en beheerders van icbe’s als bedoeld in het negende lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59
  - number: 59a
    text: |-
      De Nederlandsche Bank kan ter uitvoering van internationaal aanvaarde standaarden nadere regels stellen met
      betrekking tot de solvabiliteit van afwikkelondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel59a
  - number: 60a.1
    text: |-
      De minimumomvang van het toetsingsvermogen van een betaalinstelling, met uitzondering van een betaalinstelling die
      alleen betaalinitiatiediensten of rekeninginformatiediensten aanbiedt, wordt berekend met toepassing van met de
      Nederlandsche Bank overeengekomen methode A, B of C, bedoeld in bijlage B bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel60a
  - number: 60a.2
    text: |-
      In afwijking van het eerste lid kan de Nederlandsche Bank indien een evaluatie van de risicobeheersingsprocessen,
      het verzamelen en vastleggen van risicoverliesgegevens en het interne controlesysteem en het
      bedrijfscontinuïteitsbeheer van de betaalinstelling daartoe aanleiding geeft, de betaalinstelling verplichten een
      toetsingsvermogen aan te houden dat ten hoogste 20% hoger is dan het bedrag dat het resultaat is van de toepassing
      van een uit [bijlage B][ref1] gekozen methode, of de betaalinstelling toestaan een toetsingsvermogen aan te houden
      dat ten hoogste 20% lager is dan het bedrag dat het resultaat is van de uit [bijlage B][ref2] gekozen methode.


      [ref1]: https://wetten.overheid.nl/BWBR0020420
      [ref2]: https://wetten.overheid.nl/BWBR0020420
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0020420
      - id: ref2
        bwb_id: BWBR0020420
  - number: '61'
    text: |-
      De minimumomvang van het toetsingsvermogen van een kredietunie bedraagt 10 procent van de totale
      risicoblootstelling, berekend overeenkomstig deel 7 van de verordening kapitaalvereisten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel61
  - number: '63.1'
    text: |-
      De minimumomvang van het toetsingsvermogen van een beheerder van een beleggingsinstelling als bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref1], of van een beheerder van een icbe als bedoeld in artikel 3:57, eerste
      lid, van de wet bedraagt € 125.000 vermeerderd met twee honderdste procent van het bedrag waarmee de waarde van het
      beheerde vermogen het bedrag van € 250 miljoen te boven gaat. De minimumomvang van het toetsingsvermogen bedraagt
      niet meer dan € 10 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '63.2'
    text: |-
      Tot het beheerde vermogen wordt gerekend het vermogen van de beleggingsinstellingen of van de icbe’s waarover de
      beheerder het beheer voert met inbegrip van de delen van het vermogen waarvan hij het beheer heeft uitbesteed,
      uitgezonderd de delen van het vermogen waarvan het beheer door derden aan hem is uitbesteed.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel63
  - number: '63.3'
    text: |-
      De minimumomvang van het toetsingsvermogen van een beheerder van een beleggingsinstelling of een beheerder van een
      icbe als bedoeld in het eerste lid bedraagt ten minste 25 procent van de vaste kosten in het afgelopen boekjaar.
      Artikel 13 van de verordening prudentiële vereisten voor beleggingsondernemingen is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel63
  - number: 63a.1
    text: |-
      De minimumomvang van het toetsingsvermogen van een premiepensioeninstelling als bedoeld in
      [artikel 3:57, eerste lid, van de wet][ref1] bedraagt twee tiende procent van het beheerde pensioenvermogen. De
      minimumomvang van het toetsingsvermogen bedraagt niet meer dan € 20 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 63a.2
    text: 'In aanvulling op het eerste lid beschikt een premiepensioeninstelling naar keuze over:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel63a
  - number: 63a.2.a
    text: |-
      een beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening die haar aansprakelijkheid dekt
      wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van haar beroep of bedrijf en voorgevallen op het
      grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, voor een bedrag
      van ten minste vijfenzeventig honderdste procent van de waarde van het beheerde pensioenvermogen, met een minimum
      van € 2 miljoen en een maximum van € 20 miljoen per schadegeval, en ten minste een procent van de waarde van het
      beheerde pensioenvermogen, met een minimum van € 2,5 miljoen en een maximum van € 25 miljoen per jaar, voor alle
      schadegevallen gezamenlijk; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel63a
  - number: 63a.2.b
    text: |-
      een aanvulling op het toetsingsvermogen, bedoeld in het eerste lid, welke een tiende procent van de waarde van het
      beheerde pensioenvermogen bedraagt.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel63a
  - number: 63a.3
    text: |-
      Tot het beheerde pensioenvermogen wordt gerekend het vermogen onder beheer van de premiepensioeninstelling met
      inbegrip van de delen van het vermogen waarvan zij de bewaring heeft uitbesteed aan een pensioenbewaarder.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel63a
  - number: 63a.4
    text: |-
      Indien een premiepensioeninstelling pensioenvermogen beheert in opdracht van een cliënt buiten het grondgebied
      waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, beschikt zij voor dat deel van
      het beheerde pensioenvermogen in afwijking van het tweede lid, aanhef, over de aanvulling op het toetsingsvermogen,
      bedoeld in het tweede lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel63a
  - number: 63b.1
    text: |-
      In aanvulling op het op grond van de [artikelen 48, eerste lid, onderdelen c en e][ref1], vereiste
      minimumbedrag aan eigen vermogen en het op grond van [artikel 63][ref2] vereiste toetsingsvermogen, beschikt
      een beleggingsmaatschappij die geen aparte beheerder heeft, of een beheerder van een beleggingsinstelling,
      over een bijkomend toetsingsvermogen of een beroepsaansprakelijkheidsverzekering ter dekking van mogelijke
      beroepsaansprakelijkheidsrisico’s in overeenstemming met artikel 9, zevende en negende lid, van de richtlijn
      beheerders van alternatieve beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel63
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '48'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '63'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 63b.2
    text: |-
      Het eigen vermogen, toetsingsvermogen en het bijkomend toetsingsvermogen als bedoeld in het eerste lid wordt belegd
      in overeenstemming met artikel 9, achtste lid, van de richtlijn beheerders van alternatieve beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel63b
  - number: '64.1'
    text: |-
      Voor het deel van de werkzaamheden van een elektronischgeldinstelling dat betrekking heeft op de uitgifte van
      elektronisch geld en betaaldiensten die verband houden met de uitgifte van dit elektronisch geld, bedraagt de
      minimumomvang van het toetsingsvermogen 2% van het gemiddeld uitstaand elektronisch geld.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel64
  - number: '64.2'
    text: |-
      Voor het deel van de werkzaamheden van een elektronischgeldinstelling dat betrekking heeft op het verlenen van
      betaaldiensten die geen verband houden met de uitgifte van elektronisch geld, wordt de minimumomvang van het
      toetsingsvermogen berekend met overeenkomstige toepassing van [artikel 60a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel60a
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 60a
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '64.3'
    text: |-
      De omvang van het toetsingsvermogen van een elektronischgeldinstelling bedraagt te allen tijde ten minste de
      som van de minimumomvang van het toetsingsvermogen berekend volgens het eerste lid en de minimumomvang van het
      toetsingsvermogen berekend volgens het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel64
  - number: '64.4'
    text: |-
      Indien een elektronischgeldinstelling de uitgifte van elektronisch geld niet gedurende ten minste zes maanden heeft
      uitgeoefend, bedraagt de minimum omvang van het toetsingsvermogen, bedoeld in het tweede lid, twee procent van het
      uitstaand elektronisch geld of het blijkens haar programma van werkzaamheden na zes maanden nagestreefde bedrag aan
      uitstaand elektronisch geld, naar gelang welk bedrag het hoogst is.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel64
  - number: '64.5'
    text: |-
      In afwijking van het eerste en tweede lid kan de Nederlandsche Bank indien een evaluatie van de
      risicobeheersingsprocessen, het verzamelen en vastleggen van risicoverliesgegevens en het internecontrolesysteem
      van de elektronischgeldinstelling daartoe aanleiding geeft, de elektronischgeldinstelling verplichten een
      toetsingsvermogen aan te houden dat ten hoogste 20 procent hoger is dan het bedrag dat het resultaat is van de
      toepassing van de methode, bedoeld in het eerste of tweede lid, of de elektronischgeldinstelling toestaan een
      toetsingsvermogen aan te houden dat ten hoogste 20 procent lager is dan het bedrag dat het resultaat is van de
      toepassing van de methode, bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel64
  - number: '65.1'
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1], [3:58, eerste of tweede lid][ref2],
      [3:59, eerste lid][ref3], [3:61, eerste of tweede lid][ref4], of [3:62, eerste lid][ref5], niet zijnde een
      verzekeraar met beperkte risico-omvang, berekent het op hem of op het in Nederland gelegen bijkantoor van
      toepassing zijnde solvabiliteitskapitaalvereiste ten minste eenmaal per jaar en opnieuw indien het risicoprofiel
      van de verzekeraar duidelijk afwijkt van de aannames die ten grondslag lagen aan de laatste berekening, of indien
      de Nederlandsche Bank daarom verzoekt vanwege aanwijzingen dat het risicoprofiel sinds die laatste berekening
      duidelijk is veranderd. De verzekeraar meldt de uitkomst van een tussentijdse herberekening onverwijld aan de
      Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '65.2'
    text: |-
      De verzekeraar maakt voor de berekening, bedoeld in het eerste lid, gebruik van de standaardformule, bedoeld
      in artikel 103 van de richtlijn solvabiliteit II, of van een geheel of gedeeltelijk intern model als bedoeld in
      artikel 112, eerste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel65
  - number: '65.3'
    text: |-
      Een verzekeraar die de standaardformule, bedoeld in het tweede lid, toepast, berekent het
      solvabiliteitskapitaalvereiste overeenkomstig titel I, hoofdstuk VI, afdeling 4, onderafdeling 2, van de richtlijn
      solvabiliteit II en neemt daarbij titel I, hoofdstuk V, van de verordening solvabiliteit II in acht.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel65
  - number: '65.4'
    text: |-
      De Nederlandsche Bank kan, overeenkomstig artikel 104, zevende lid, van de richtlijn solvabiliteit II, aan een
      verzekeraar die de standaardformule toepast, goedkeuring verlenen voor het gebruik van de in dat lid bedoelde
      ondernemingsspecifieke parameters voor de modules voor het levens-, schade- en ziektekostenverzekeringstechnische
      risico. De verzekeraar voldoet daarbij aan de in dat lid gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel65
  - number: '65.5'
    text: |-
      Een verzekeraar maakt uitsluitend gebruik van een intern model dat door de Nederlandsche Bank is goedgekeurd
      overeenkomstig de artikelen 112 tot en met 115 van de richtlijn solvabiliteit II. De verzekeraar voldoet aan
      de artikelen 116 en 120 tot en met 126 van de richtlijn, met inachtneming van titel I, hoofdstuk VI, van de
      verordening solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel65
  - number: '65.6'
    text: |-
      De Nederlandsche Bank kan een verzekeraar als bedoeld in het eerste lid verplichten een intern model te
      gebruiken voor de berekening van het solvabiliteitskapitaalvereiste of relevante risicomodules daarvan,
      indien het risicoprofiel van de verzekeraar duidelijk afwijkt van de aannames die ten grondslag liggen aan de
      standaardformule, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel65
  - number: '65.7'
    text: |-
      Een verzekeraar die goedkeuring heeft gekregen voor het gebruik van een intern model valt niet terug op het gebruik
      van de standaardformule, bedoeld in het tweede lid, tenzij daar goede redenen voor zijn en de Nederlandsche Bank
      ermee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel65
  - number: '65.8'
    text: |-
      Een verzekeraar die niet meer voldoet aan de artikelen 120 tot en met 126 van de richtlijn solvabiliteit II dient
      onverwijld een plan in bij de Nederlandsche Bank om aan deze situatie een einde te maken. Indien de verzekeraar
      het plan niet uitvoert kan de Nederlandsche Bank de verzekeraar verplichten het solvabiliteitskapitaalvereiste te
      berekenen met gebruikmaking van de standaardformule, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel65
  - number: '65.9'
    text: |-
      Indien de Europese Commissie op grond van artikel 172, tweede of vierde lid, van de richtlijn solvabiliteit II het
      solvabiliteitsregime van een staat die geen lidstaat is gelijkwaardig acht met die van de richtlijn solvabiliteit
      II, worden voor de berekening van het solvabiliteitskapitaalvereiste herverzekeringsovereenkomsten met verzekeraars
      met zetel in die staat gelijkgesteld met herverzekeringsovereenkomsten met verzekeraars met zetel in een lidstaat.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel65
  - number: '66.1'
    text: |-
      Een verzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1], [3:58, eerste of tweede lid][ref2],
      [3:59, eerste lid][ref3], [3:61, eerste of tweede lid][ref4], of [3:62, eerste lid][ref5], met beperkte
      risico-omvang berekent het op hem of op het in Nederland gelegen bijkantoor van toepassing zijnde
      solvabiliteitskapitaalvereiste ten minste eenmaal per jaar en opnieuw indien het risicoprofiel van de verzekeraar
      duidelijk afwijkt van de aannames die ten grondslag lagen aan de laatste berekening, of indien de Nederlandsche
      Bank daarom verzoekt vanwege aanwijzingen dat het risicoprofiel sinds die laatste berekening duidelijk is
      veranderd. De verzekeraar meldt de uitkomst van een tussentijdse herberekening onverwijld aan de Nederlandsche
      Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '66.2'
    text: |-
      De verzekeraar maakt voor de berekening, bedoeld in het eerste lid, gebruik van de standaardformule, bedoeld in
      artikel 103 van de richtlijn solvabiliteit II, zonder toepassing van de in onderdeel c van dat artikel bedoelde
      correctie voor het verliesabsorberend vermogen van de technische voorzieningen. Titel I, hoofdstuk VI, afdeling
      4, onderafdeling 2, van de richtlijn solvabiliteit II en titel I, hoofdstuk V, van de verordening solvabiliteit II
      zijn van overeenkomstige toepassing, met dien verstande dat de verzekeraar de vereenvoudigde berekeningsmethoden
      als bedoeld in de artikelen 89 tot en met 112 van de verordening, kan toepassen, mits:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
  - number: 66.2.a
    text: |-
      deze berekeningsmethoden passen bij de aard, omvang en complexiteit van de risico’s van de verzekeraar en deze
      berekeningen niet leiden tot een significante onderschatting van het solvabiliteitskapitaalvereiste;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
  - number: 66.2.b
    text: het gebruik ervan goed wordt onderbouwd en vastgelegd;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
  - number: 66.2.c
    text: ten aanzien van de toepassing van de berekeningsmethoden een bestendige gedragslijn wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
  - number: '66.3'
    text: |-
      [Artikel 65, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel65
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '65'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '66.4'
    text: 'De verzekeraar kan bij de berekening van het solvabiliteitskapitaalvereiste rekening houden met:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
  - number: 66.4.a
    text: |-
      aanwezige risicomitigerende instrumenten, mits deze aantoonbaar effectief zijn en niet resulteren in een materieel
      basisrisico als bedoeld in artikel 1, punt 25, van de verordening solvabiliteit II;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
  - number: 66.4.b
    text: |-
      toekomstige risicomitigerende instrumenten, mits deze realistisch zijn en aantoonbaar voortvloeien uit de reguliere
      bedrijfsvoering, het gevoerde risicobeheer of het afdekkingsbeleid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
  - number: '66.5'
    text: |-
      In afwijking van het tweede lid, tweede volzin, gaat een verzekeraar die het natura-uitvaartverzekeringsbedrijf
      uitoefent bij de toepassing van artikel 142, zesde lid, onderdeel b, van de verordening solvabiliteit II uit van de
      stopzetting van 20% van de verzekeringsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
  - number: '66.6'
    text: |-
      Het vijfde lid is van overeenkomstige toepassing op levensverzekeraars met beperkte risico-omvang als bedoeld in
      [artikel 49b, tweede lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel49b
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 49b
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: '66.7'
    text: |-
      [Artikel 65, negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel65
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '65'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '67'
    text: |-
      Op de berekening van het solvabiliteitskapitaalvereiste volgens de standaardformule overeenkomstig
      [artikel 65][ref1] of [66][ref2] zijn de overgangsmaatregelen, bedoeld in artikel 308 ter, twaalfde en dertiende
      lid, van de richtlijn solvabiliteit II van toepassing dan wel van overeenkomstige toepassing, tenzij een
      verzekeraar gebruik maakt van de overgangsmaatregel, bedoeld in artikel 308 quinquies van die richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel66
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '65'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '66'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '68'
    text: |-
      Een herverzekeraar die zijn bedrijf uitoefent in de activiteit schadeherverzekering of
      schadeverzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1], [3:58, eerste of tweede lid][ref2],
      [3:61, eerste lid][ref3], of [3:62, eerste lid, van de wet][ref4] en daarbij zorgverzekeringen als bedoeld
      in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref5] herverzekert onderscheidenlijk sluit, kan zijn
      solvabiliteitskapitaalvereiste berekenen met toepassing van artikel 149 van de verordening solvabiliteit II.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0018450
        artikel: '1'
  - number: '69.1'
    text: |-
      De Nederlandsche Bank toetst op regelmatige basis, maar ten minste eenmaal per drie jaar, of een bank of
      een beleggingsonderneming die gebruik maakt van interne modellen voor de berekening van de kapitaalvereisten
      overeenkomstig deel 3 van de verordening kapitaalvereisten, voldoet aan de ingevolge dat deel gestelde eisen.
      Daarbij houdt de Nederlandsche Bank in het bijzonder rekening met wijzigingen in de activiteiten van de bank of
      beleggingsonderneming en het toepassen van interne modellen op nieuwe financiële producten en diensten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel69
  - number: '69.2'
    text: |-
      Indien bij de toetsing, bedoeld in het eerste lid, wezenlijke tekortkomingen worden vastgesteld in het
      ondervangen van risico’s door het interne model, neemt de Nederlandsche Bank maatregelen om deze tekortkomingen
      te verhelpen of andere passende maatregelen. Daarbij is de Nederlandsche Bank in ieder geval bevoegd een
      hogere vermenigvuldigingsfactor op te leggen of te bepalen dat de bank of beleggingsonderneming over een hoger
      toetsingsvermogen beschikt dan ingevolge [artikel 3:57 van de wet][ref1] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '69.3'
    text: |-
      Indien uit veelvuldige overschrijding blijkt dat een intern model niet of niet langer voldoende accuraat is, trekt
      de Nederlandsche Bank de toestemming aan de bank of beleggingsonderneming voor het gebruik van het betreffende
      model in, of legt zij maatregelen op die ertoe leiden dat het model onverwijld wordt verbeterd.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel69
  - number: '69.4'
    text: |-
      Indien een bank of beleggingsonderneming niet langer voldoet aan de vereisten voor het gebruik van een bepaald
      intern model, stelt de Nederlandsche Bank de bank of beleggingsonderneming in de gelegenheid om aan te tonen dat
      het niet voldoen aan de vereisten van ondergeschikt belang is of om een plan op te stellen op grond waarvan binnen
      een redelijke termijn opnieuw aan de vereisten wordt voldaan. De Nederlandsche Bank kan, voor zover naar haar
      oordeel noodzakelijk, verbeteringen aan het plan opleggen of een andere termijn vaststellen waarbinnen het plan
      wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel69
  - number: '69.5'
    text: |-
      Indien de Nederlandsche Bank van oordeel is dat de bank of beleggingsonderneming niet in staat is om uitvoering
      te geven aan het plan, bedoeld in het vierde lid, en de bank of beleggingsonderneming niet heeft aangetoond dat
      het niet voldoen aan de vereisten van ondergeschikt belang is, trekt zij de toestemming voor het gebruik van het
      interne model in of beperkt zij de toestemming tot de onderdelen ten aanzien waarvan wel aan de vereisten wordt
      voldaan of binnen een redelijke termijn kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel69
  - number: '70.1'
    text: |-
      Het eigen vermogen van een verzekeraar wordt gevormd door het eigen vermogen, bedoeld in artikel 87 van de
      richtlijn solvabiliteit II, ingedeeld in tiers overeenkomstig de artikelen 93 tot en met 96 van die richtlijn, voor
      zover dat overeenkomstig artikel 98 van de richtlijn, en met inachtneming van artikel 82, eerste en derde lid, van
      de verordening solvabiliteit II, in aanmerking komt ter dekking van het solvabiliteitskapitaalvereiste. Het bij
      de berekening van het eigen vermogen in aanmerking te nemen bedrag aan aanvullend vermogen behoeft de voorafgaande
      goedkeuring van de Nederlandsche Bank overeenkomstig artikel 90 van de richtlijn solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel70
  - number: '70.2'
    text: |-
      Met betrekking tot de indeling van het eigen vermogen in tier 1 en tier 2, is de overgangsmaatregel, bedoeld in
      artikel 308 ter, negende onderscheidenlijk tiende lid, van de richtlijn solvabiliteit II van toepassing.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel70
  - number: 70a
    text: |-
      Een verzekeraar met beperkte risico-omvang waarop artikel 308 ter, veertiende lid, van de richtlijn solvabiliteit
      II van overeenkomstige toepassing is en die op 31 december 2017 niet voldoet of gedurende het jaar 2018 dreigt niet
      te voldoen aan het solvabiliteitskapitaalvereiste, treft de nodige maatregelen om uiterlijk op 31 december 2022 het
      in aanmerking komend eigen vermogen ter dekking van het sovabiliteitskapitaalvereiste op peil te brengen of zijn
      risicoprofiel zodanig te verlagen dat wordt voldaan aan het solvabiliteitskapitaalvereiste.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel70a
  - number: '71'
    text: |-
      De waarden die dienen ter dekking van het solvabiliteitskapitaalvereiste van een bijkantoor van een
      levensverzekeraar of schadeverzekeraar als bedoeld in [artikel 3:59, tweede lid, van de wet][ref1] of een
      verzekeraar met beperkte risico-omvang als bedoeld in [artikel 3:62, tweede lid, van de wet][ref2] zijn aanwezig in
      Nederland tot het bedrag van het minimumkapitaalvereiste en voor het meerdere in één of meer lidstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '72.1'
    text: |-
      Op een clearinginstelling als bedoeld in [artikel 3:57, vijfde lid, van de wet][ref1] zijn de eisen betreffende
      grote risicoblootstellingen ingevolge deel 4 van de verordening kapitaalvereisten van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '72.2'
    text: |-
      Op een kredietunie als bedoeld in [artikel 3:57, zesde lid, van de wet][ref1] zijn de eisen betreffende grote
      risicoblootstellingen ingevolge deel 4 van de verordening kapitaalvereisten van overeenkomstige toepassing, met
      dien verstande dat de minimum omvang van het toetsingvermogen in afwijking van [artikel 61, eerste lid][ref2],
      van dit besluit, 20 procent bedraagt voor het meerdere van grote risicoblootstellingen boven 15 procent van het
      aanwezige in aanmerking komende toetsingsvermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel61
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '61'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '73.1'
    text: |-
      Een beheerder van een icbe, maatschappij voor collectieve belegging in effecten, of bewaarder van een icbe als
      bedoeld in [artikel 3:57, vijfde lid, van de wet][ref1] verstrekt geen kredieten voor rekening van derden, stelt
      zich niet garant en gaat geen borgtochtverplichtingen aan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '73.2'
    text: |-
      Een financiële onderneming als bedoeld in het eerste lid verkoopt geen financiële instrumenten die de instelling
      voor collectieve belegging in effecten niet in eigendom heeft.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel73
  - number: '73.3'
    text: 'De financiële onderneming gaat niet als debiteur geldleningen aan met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel73
  - number: 73.3.a
    text: |-
      kortlopende leningen die gezamenlijk niet meer bedragen dan tien procent van de activa van de instelling voor
      collectieve belegging in effecten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel73
  - number: 73.3.b
    text: |-
      leningen voor het verwerven van onroerende zaken die rechtstreeks noodzakelijk zijn voor de uitoefening van de
      werkzaamheden van de beleggingsmaatschappij en die gezamenlijk niet meer bedragen dan tien procent van haar activa,
      voor zover de omvang van deze geldleningen tezamen met de omvang van de in onderdeel a genoemde leningen niet meer
      bedraagt dan vijftien procent van haar activa; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel73
  - number: 73.3.c
    text: |-
      leningen met als doel de verwerving van vreemde valuta waardoor de netto schuld van de instelling voor collectieve
      belegging in effecten niet verandert of zal veranderen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel73
  - number: '105.1'
    text: |-
      De vereiste omvang van de kapitaalbuffer, bedoeld in [artikel 3:62a, eerste lid, van de wet][ref1], bedraagt de som
      van de omvang van de volgende componenten, voor zover van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 105.1.a
    text: |-
      een kapitaalconserveringsbuffer als bedoeld in artikel 128, onderdeel 1, van de richtlijn kapitaalvereisten, zijnde
      de minimaal vereiste omvang van de kapitaalbuffer;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105
  - number: 105.1.b
    text: |-
      een contracyclische kapitaalbuffer als bedoeld in artikel 128, onderdeel 2, van de richtlijn
      kapitaalvereisten, in verband met risico’s die voortvloeien uit de kredietcyclus, als bedoeld in
      [artikel 3:62a, tweede lid, onderdeel a, van de wet;][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 105.1.c
    text: |-
      een systeemrelevantiebuffer bestaande uit een MSI-buffer als bedoeld in artikel 128, onderdeel 3, of een
      ASI-buffer als bedoeld in artikel 128, onderdeel 4, van de richtlijn kapitaalvereisten, in verband met
      het risico dat de financiële onderneming vormt voor de stabiliteit van het financiële stelsel, als bedoeld
      in[ artikel 3:62a, tweede lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 105.1.d
    text: |-
      een systeemrisicobuffer als bedoeld in artikel 128, onderdeel 5, van de richtlijn kapitaalvereisten,
      in verband met risico’s die voortvloeien uit macroprudentiële of systeemrisico’s als bedoeld in
      [artikel 3:62a, tweede lid, onderdeel c, van de wet][ref1], en niet afdoende worden gedekt door de contracyclische
      kapitaalbuffer of systeemrelevantiebuffer.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '105.2'
    text: |-
      De omvang van de in het eerste lid bedoelde buffercomponenten wordt uitgedrukt in een percentage van het
      overeenkomstig artikel 92, derde lid, van de verordening kapitaalvereisten berekende totaal van risicoposten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105
  - number: '105.3'
    text: |-
      Indien op een onderneming een systeemrelevantiebuffer als bedoeld in het eerste lid, onderdeel c, of een
      systeemrisicobuffer als bedoeld in het eerste lid, onderdeel d, van toepassing is, wordt de totale toepasselijke
      omvang van die buffercomponenten bepaald op de wijze, genoemd in artikel 131, veertiende en vijftiende lid, van de
      richtlijn kapitaalvereisten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105
  - number: 105a
    text: |-
      De kapitaalconserveringsbuffer, bedoeld in [artikel 105, eerste lid, onderdeel a][ref1], bedraagt tweeënhalf
      procent.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel105
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105a
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '105'
        hoofdstuk: 10a
        paragraaf: 10a.1
  - number: 105b.1
    text: |-
      De contracyclische kapitaalbuffer, bedoeld in [artikel 105, eerste lid, onderdeel b][ref1], is gelijk aan het
      overeenkomstig artikel 140 van de richtlijn kapitaalvereisten berekende gewogen gemiddelde van de contracyclische
      bufferpercentages, bedoeld in artikel 128, onderdeel 7, van de richtlijn kapitaalvereisten, die de betrokken
      bank of beleggingsonderneming dient toe te passen voor elke staat waar de relevante kredietblootstellingen van de
      onderneming gelegen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel105
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105b
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '105'
        hoofdstuk: 10a
        paragraaf: 10a.1
  - number: 105b.2
    text: |-
      De Nederlandsche Bank stelt elk kwartaal het contracyclische bufferpercentage vast voor in Nederland gelegen
      kredietblootstellingen, met inachtneming van artikel 136, tweede tot en met zesde lid, van de richtlijn
      kapitaalvereisten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105b
  - number: 105b.3
    text: |-
      Ten aanzien van kredietblootstellingen, gelegen in een andere lidstaat of een staat die geen lidstaat is, past de
      bank of beleggingsonderneming het contracyclische bufferpercentage toe dat door de ingevolge artikel 136, eerste
      lid, van de richtlijn kapitaalvereisten aangewezen autoriteit van de betrokken lidstaat of staat is vastgesteld.
      Indien in plaats of in afwijking daarvan door de Nederlandsche Bank een percentage is vastgesteld overeenkomstig
      artikel 139, tweede of derde lid, van de richtlijn kapitaalvereisten of dat voortvloeit uit de toepassing van de
      artikelen 137, eerste lid, en 140, tweede en derde lid van de richtlijn, past de bank of beleggingsonderneming dat
      percentage toe.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105b
  - number: 105b.4
    text: |-
      De Nederlandsche Bank maakt de door een bank of beleggingsonderneming ingevolge het tweede en derde lid toe te
      passen contracyclische bufferpercentages bekend door publicatie op haar website, met inachtneming van de artikelen
      136, zevende lid, 137, tweede lid, en 139, vijfde lid, van de richtlijn kapitaalvereisten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105b
  - number: 105c.1
    text: |-
      De Nederlandsche Bank beoordeelt met inachtneming van artikel 131 van de richtlijn kapitaalvereisten of banken
      en beleggingsondernemingen als bedoeld in [artikel 3:62a, eerste lid, van de wet][ref1], alsmede groepen onder
      leiding van een Nederlandse EU-moederbank, Nederlandse EU-moederbeleggingsonderneming, Nederlandse financiële
      EU-moederholdings, Nederlandse gemengde financiële EU-moederholdings, Nederlandse financiële moederholdings en
      Nederlandse gemengde financiële moederholdings mondiaal systeemrelevant of anderszins systeemrelevant zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 105c.2
    text: |-
      De beoordeling ingevolge het eerste lid van de anderszins systeemrelevantie geschiedt in ieder geval aan de hand
      van de volgende criteria:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
  - number: 105c.2.a
    text: de omvang van de onderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
  - number: 105c.2.b
    text: |-
      de verwevenheid van de activiteiten, de activa, de passiva of de zeggenschap van de onderneming met andere
      financiële ondernemingen of andere partijen die hoofdzakelijk actief zijn op de financiële markten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
  - number: 105c.2.c
    text: de mate van vervangbaarheid van de dienstverlening van de onderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
  - number: 105c.2.d
    text: de belemmeringen die bestaan ten aanzien van de afwikkelbaarheid van de onderneming;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
  - number: 105c.2.e
    text: |-
      de mate waarin een gedraging van de onderneming of van een derde ten aanzien van de onderneming op de financiële
      markten kan leiden tot gedragingen van andere partijen die actief zijn op de financiële markten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
  - number: 105c.2.f
    text: de complexiteit van de onderneming, met inbegrip van complexiteit in verband met grensoverschrijdende activiteiten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
  - number: 105c.3
    text: |-
      De Nederlandsche Bank stelt voor de banken, beleggingsondernemingen en groepen die op grond van het eerste lid
      als mondiaal systeemrelevant danwel anderszins systeemrelevant zijn aangemerkt de vereiste omvang van de MSI-
      buffer danwel ASI-buffer vast met inachtneming van artikel 131 van de richtlijn kapitaalvereisten. Indien
      de Nederlandsche Bank een groep onder leiding van een Nederlandse financiële EU-moederholding, Nederlandse
      gemengde financiële EU-moederholding, Nederlandse financiële moederholding of Nederlandse gemengde financiële
      moederholding als systeemrelevant heeft aangemerkt, is de systeemrelevantiebuffer van toepassing op de banken en
      beleggingsondernemingen die dochteronderneming van die holding zijn, op basis van de geconsolideerde financiële
      positie van de holding.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
  - number: 105c.4
    text: |-
      De Nederlandsche Bank voert de beoordeling, bedoeld in het eerste lid, ten minste jaarlijks uit. Onze Minister kan
      de Nederlandsche Bank op ieder moment verzoeken een beoordeling uit te voeren.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
  - number: 105c.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de in het tweede lid bedoelde
      criteria. Tevens kunnen bij ministeriële regeling aanvullende criteria worden vastgesteld in verband met de
      stabiliteit van het financiële stelsel.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
  - number: 105c.6
    text: |-
      De Nederlandsche Bank stelt ten minste dertig dagen voordat zij een besluit tot vaststelling van een MSI-buffer of
      ASI-buffer als bedoeld in het derde lid neemt, Onze Minister op de hoogte van haar voornemen. Hetzelfde geldt ten
      aanzien van het voornemen tot wijziging of intrekking van een zodanig besluit. De verplichting tot kennisgeving
      aan Onze Minister is niet van toepassing indien de Europese Centrale Bank de bevoegdheid, bedoeld in het derde
      lid, uitoefent.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105c
  - number: 105e
    text: |-
      De Nederlandsche Bank kan met inachtneming van de artikelen 133 en 134 van de richtlijn kapitaalvereisten regels
      stellen ten aanzien van de systeemrisicobuffer, bedoeld in [artikel 105, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel105
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105e
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '105'
        hoofdstuk: 10a
        paragraaf: 10a.1
  - number: 105f.1
    text: |-
      De vereiste omvang van de kapitaalbuffer, bedoeld in [artikel 105][ref1], wordt gedekt door tier 1-kernkapitaal als
      bedoeld in artikel 50 van de verordening kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel105
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105f
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '105'
        hoofdstuk: 10a
        paragraaf: 10a.1
  - number: 105f.2
    text: |-
      Het tier 1-kernkapitaal dat wordt aangehouden ter dekking van de kapitaalbuffer dient niet tevens ter dekking van
      de minimumomvang van het toetsingsvermogen ingevolge [artikel 59, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel59
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105f
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '59'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 105f.3
    text: |-
      Een bank of beleggingsonderneming als bedoeld in [artikel 3:62a, eerste lid, van de wet][ref1], beschikt
      over voldoende kapitaal dat naar aard, omvang en samenstelling noodzakelijk is om zowel te voldoen aan de
      kapitaalbuffer, als aan elk van de in artikel 92, eerste lid, onderdeel a tot en met c, van de verordening
      kapitaalvereisten genoemde kapitaalratio’s en aan de hogere eisen van solvabiliteit opgelegd op grond van
      [artikel 3:111a, tweede lid, onderdeel a, van de wet][ref2], ter ondervanging van andere risico's dan het risico
      van buitensporige hefboomwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 105f.4
    text: |-
      Het tier 1-kernkapitaal dat wordt aangehouden ter dekking van de kapitaalbuffer dient niet tevens ter
      dekking van de in artikel 92, eerste lid, onderdeel a tot en met c, van de verordening kapitaalvereisten
      genoemde kapitaalratio’s of de hogere eisen van solvabiliteit en liquiditeit opgelegd op basis van
      [3:111a, tweede lid, onderdeel a, van de wet][ref1], ter ondervanging van andere risico’s dan het
      risico van buitensporige hefboomwerking, of ter dekking van de door de Nederlandsche Bank op grond van
      [artikel 3:111aa, eerste lid, van de wet][ref2], medegedeelde richtsnoeren voor het ondervangen van andere
      risico's dan het risico van buitensporige hefboomwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 105f.5
    text: |-
      Het tier 1-kernkapitaal dat wordt aangehouden ter dekking van een van de componenten van de kapitaalbuffer dient
      niet tevens ter dekking van een van de andere componenten van de kapitaalbuffer.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105f
  - number: 105f.6
    text: |-
      Het tier 1-kernkapitaal dat wordt aangehouden ter dekking van de kapitaalbuffer dient niet tevens ter dekking
      van de risicogebaseerde onderdelen van de vereisten uit de artikelen 92 bis en 92 ter van de verordening
      kapitaalvereisten en de artikelen 45 quater en 45 quinquies van de richtlijn herstel en afwikkeling van banken
      en beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105f
  - number: 105g.1
    text: |-
      Onverminderd artikel 77 van de verordening kapitaalvereisten kan een bank of beleggingsonderneming als bedoeld
      in [artikel 3:62b, tweede lid][ref1], of [artikel 3:62ba, tweede lid, van de wet][ref2], in afwijking van die
      artikelen de bedoelde uitkeringen, toekenningen of betalingen doen, ter grootte van ten hoogste het maximaal
      uitkeerbare bedrag, berekend overeenkomstig artikel 141, vierde lid, respectievelijk artikel 141 ter, vierde lid,
      van de richtlijn kapitaalvereisten. [Artikel 4][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel4
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105g
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '4'
        hoofdstuk: '1'
  - number: 105g.2
    text: |-
      Van het voornemen tot het doen van een uitkering, toekenning of betaling als bedoeld in het eerste lid geeft de
      bank of beleggingsonderneming kennis aan de Nederlandsche Bank, onder overlegging van de gegevens, bedoeld in
      artikel 141, achtste lid, respectievelijk artikel 141 ter, achtste lid, van de richtlijn kapitaalvereisten.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105g
  - number: 105h
    text: |-
      De kennisgeving, bedoeld in [artikel 3:62a, derde lid][ref1], of [artikel 3:62ba, vierde lid, van de wet][ref2],
      vermeldt tevens het maximaal uitkeerbare bedrag, bedoeld in [artikel 105g, eerste lid][ref3], zoals berekend door
      de bank of beleggingsonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel105g
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105h
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: 105g
        hoofdstuk: 10a
        paragraaf: 10a.2
  - number: 105i.1
    text: |-
      Het kapitaalconserveringsplan, bedoeld in [artikel 3:62a, vierde lid][ref1], en
      [artikel 3:62ba, vijfde lid, van de wet][ref2], bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105i
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 105i.1.a
    text: een schatting van de inkomsten en uitgaven en een balansverwachting;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105i
  - number: 105i.1.b
    text: |-
      een beschrijving van de maatregelen die de betrokken onderneming voornemens is te nemen om haar toetsingsvermogen
      te vergroten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105i
  - number: 105i.1.c
    text: |-
      een plan en tijdpad om het toetsingsvermogen te vergroten opdat de onderneming voldoet aan de
      ingevolge [artikel 3:62a, eerste lid, van de wet][ref1] op de onderneming toepasselijke kapitaalbuffer
      en indien van toepassing, de op de onderneming toepasselijke hefboomratiobuffer, als bedoeld in
      [artikel 3:62ba, eerste lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105i
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 105i.1.d
    text: andere informatie die noodzakelijk is voor een adequate beoordeling van het kapitaalconserveringsplan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105i
  - number: 105i.2
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de informatie, bedoeld in het eerste lid,
      onderdeel d.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel105i
  - number: '106'
    text: |-
      De liquiditeit van een clearinginstelling, kredietunie of icbe als bedoeld in
      [artikel 3:63, eerste lid, van de wet][ref1] is voldoende, indien de aanwezige liquiditeit, bedoeld in
      [artikel 111][ref2] of [112][ref3], ten minste gelijk is aan de ingevolge [artikel 108][ref4], onderscheidenlijk
      [artikel 109][ref5], vereiste liquiditeit.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0020420#Artikel112
      [ref4]: https://wetten.overheid.nl/BWBR0020420#Artikel108
      [ref5]: https://wetten.overheid.nl/BWBR0020420#Artikel109
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '111'
        hoofdstuk: '11'
        paragraaf: '11.3'
      - id: ref3
        bwb_id: BWBR0020420
        artikel: '112'
        hoofdstuk: '11'
        paragraaf: '11.3'
      - id: ref4
        bwb_id: BWBR0020420
        artikel: '108'
        hoofdstuk: '11'
        paragraaf: '11.2'
      - id: ref5
        bwb_id: BWBR0020420
        artikel: '109'
        hoofdstuk: '11'
        paragraaf: '11.2'
  - number: 106a
    text: |-
      De liquiditeit van een bank als bedoeld in [artikel 3:63, eerste lid][ref1], [3:64][ref2] of
      [3:65 van de wet][ref3] is voldoende, indien wordt voldaan aan de liquiditeitsvereisten ingevolge deel 6 van de
      verordening kapitaalvereisten, dat van overeenkomstige toepassing is op de activiteiten vanuit een bijkantoor in
      Nederland van een bank met zetel in een staat die geen lidstaat is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 106b.1
    text: |-
      De liquiditeit van een beleggingsonderneming als bedoeld in [artikel 3:63, eerste lid, van de wet][ref1] is
      voldoende, indien wordt voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel106b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 106b.1.a
    text: |-
      de liquiditeitsvereisten ingevolge deel 6 van de verordening kapitaalvereisten, indien het een
      beleggingsonderneming onder de verordening kapitaalvereisten betreft;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel106b
  - number: 106b.1.b
    text: |-
      de liquiditeitsvereisten ingevolge deel 5 van de verordening prudentiële vereisten voor beleggingsondernemingen,
      indien het een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen
      betreft.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel106b
  - number: 106b.2
    text: |-
      Op beleggingsondernemingen als bedoeld in [artikel 3:65 van de wet][ref1] is van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel106b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 106b.2.a
    text: |-
      het eerste lid, onderdeel a, voor zover het een beleggingsonderneming betreft waarop, indien zij haar zetel had
      gehad in een lidstaat, de verordening kapitaalvereisten van toepassing zou zijn;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel106b
  - number: 106b.2.b
    text: |-
      het eerste lid, onderdeel b, voor zover het een beleggingsonderneming betreft waarop, indien zij haar zetel had
      gehad in een lidstaat, de verordening prudentiële vereisten voor beleggingsondernemingen van toepassing zou zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel106b
  - number: 106b.3
    text: |-
      Het eerste lid, aanhef en onderdeel b, is van overeenkomstige toepassing op een beheerder van een
      beleggingsinstelling of een beheerder van een icbe die tevens een beleggingsdienst verleent op grond van
      [artikel 2:67a, tweede lid, van de wet][ref1], respectievelijk [artikel 2:69c, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel106b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: '107.1'
    text: |-
      Het is een clearinginstelling of kredietunie als bedoeld in [artikel 3:63, eerste lid, van de wet][ref1] toegestaan
      om:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 107.1.a
    text: |-
      zowel de te ontvangen rente bij de aanwezige liquiditeit als de te betalen rente bij de vereiste liquiditeit mee
      te rekenen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel107
  - number: 107.1.b
    text: |-
      dochtermaatschappijen en bijkantoren die elk minder dan één procent uitmaken van het balanstotaal niet te betrekken
      bij de liquiditeitsberekeningen, indien ten minste 95 procent van het totale geconsolideerde balanstotaal wordt
      betrokken in de berekening;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel107
  - number: 107.1.c
    text: |-
      middellijke deelnemingen en bijkantoren van deelnemingen waarbij geen sprake is van, in verhouding tot de
      clearinginstelling of kredietunie als geheel, grote liquiditeitsbehoefte terwijl de liquiditeitsvoorziening ervan
      in belangrijke mate afhankelijk is van de moederonderneming onderscheidenlijk het hoofdkantoor, niet te betrekken
      bij de liquiditeitsberekeningen; of
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel107
  - number: 107.1.d
    text: |-
      een liquiditeitstekort in convertibele of inconvertibele valuta’s te compenseren met een overschot in convertibele
      valuta’s, voor zover afkomstig uit een land van waaruit vrije overdracht van liquiditeiten mogelijk is.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel107
  - number: '107.2'
    text: |-
      Indien een clearinginstelling kiest voor toepassing van het eerste lid, onderdeel b of c, betrekt zij de
      intragroepstransacties in de berekening van de liquiditeit.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel107
  - number: '107.3'
    text: |-
      De Nederlandsche Bank stelt nadere regels betreffende de valuta’s die voor de toepassing van dit hoofdstuk als
      convertibel aangemerkt worden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel107
  - number: '108.1'
    text: |-
      De vereiste liquiditeit van een clearinginstelling als bedoeld in [artikel 3:63, eerste lid, van de wet][ref1]
      bedraagt de som van de gewogen uitgaande kasstromen op basis van de kalenderposten, vermeerderd met de niet in de
      vervalkalender opgenomen gewogen toevertrouwde middelen en overige posten die opgevraagd kunnen worden of tot een
      betalingsverplichting kunnen leiden, gedurende de weekperiode respectievelijk de maandperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '108.2'
    text: |-
      De vereiste liquiditeit van een kredietunie als bedoeld in [artikel 3:63 van de wet][ref1] bedraagt de som van de
      gewogen uitgaande kasstromen op basis van de kalenderposten, vermeerderd met de niet in de vervalkalender opgenomen
      gewogen toevertrouwde middelen en overige posten die opgevraagd kunnen worden of tot een betalingsverplichting
      kunnen leiden, gedurende de maandperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '108.3'
    text: |-
      De Nederlandsche Bank stelt regels met betrekking tot de in het eerste en tweede lid bedoelde posten en de weging
      daarvan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel108
  - number: '109.1'
    text: |-
      De vereiste liquiditeit van een icbe als bedoeld in [artikel 3:63 van de wet][ref1] bedraagt tien procent van het
      beheerde vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '109.2'
    text: |-
      In afwijking van het vorige lid kan, indien uit een overeengekomen ontbindings- of beëindigingsregeling vooraf
      bekend is voor welk bedrag op een bepaalde datum wordt ingekocht, worden volstaan met dat bedrag.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel109
  - number: '111.1'
    text: |-
      De aanwezige liquiditeit van een clearinginstelling of kredietunie als bedoeld in
      [artikel 3:63, eerste lid, van de wet][ref1] in de weekperiode wordt gevormd door de gewogen voorraadposten, de
      gewogen kasinstroom van de kalenderposten gedurende de weekperiode en de officiële stand-by faciliteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '111.2'
    text: |-
      De financiële onderneming betrekt bij de berekening van de aanwezige liquiditeit in de weekperiode uitsluitend de
      activa die in het kader van het dagelijkse liquiditeitenbeheer aan haar ter beschikking staan teneinde te kunnen
      voorzien in de directe liquiditeitsbehoefte en de inkomende kasstromen uit het kernbedrijf waarmee in het kader van
      het dagelijkse liquiditeitenbeheer rekening wordt gehouden. Daartoe worden in elk geval gerekend:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: 111.2.a
    text: |-
      financiële instrumenten op basis waarvan op korte termijn liquide middelen kunnen worden verkregen door verkoop of
      belening zonder dat dit gepaard gaat met meer dan marginale kosten of verliezen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: 111.2.b
    text: onmiddellijk opeisbaar interbancair actief; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: 111.2.c
    text: onmiddellijk opeisbare vorderingen op overheden en professionele geldmarktpartijen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: '111.3'
    text: |-
      De aanwezige liquiditeit van de clearinginstelling of kredietunie in de maandperiode wordt gevormd door de gewogen
      voorraadposten en de gewogen kasinstroom gedurende de maandperiode.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: '111.4'
    text: |-
      De financiële onderneming betrekt, onverminderd het eerste en derde lid, bij de berekening van de aanwezige
      liquiditeit het liquiditeitsoverschot van een bijkantoor of een dochtermaatschappij met zetel buiten Nederland,
      welk liquiditeitsoverschot wordt berekend op basis van dit besluit of, indien dit lager is, volgens de in de staat
      van de zetel daarvoor geldende regels, slechts voor zover:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: 111.4.a
    text: |-
      overdracht van het liquiditeitsoverschot niet leidt tot een liquiditeitstekort bij het bijkantoor of de
      dochtermaatschappij volgens de lokale liquiditeitstoetsing;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: 111.4.b
    text: het om een overschot in convertibele valuta’s gaat; en
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: 111.4.c
    text: vrije en grensoverschrijdende overdracht van liquiditeit mogelijk is.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: '111.5'
    text: 'De financiële onderneming betrekt bij de berekening van de aanwezige liquiditeit niet:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: 111.5.a
    text: activa die niet onbelemmerd overdraagbaar zijn;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: 111.5.b
    text: direct opeisbare tegoeden bij personen die geen bank of professionele geldmarktpartij zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: '111.6'
    text: |-
      De Nederlandsche Bank stelt regels met betrekking tot de in het eerste, tweede en derde lid bedoelde posten en de
      weging daarvan.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel111
  - number: '112'
    text: |-
      De aanwezige liquiditeit van een icbe als bedoeld in [artikel 3:63 van de wet][ref1] wordt gevormd door de volgende
      posten:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 112.a
    text: |-
      kasmiddelen, daggeld en direct opvraagbare tegoeden bij banken die een vergunning als bedoeld in
      [artikel 2:11 van de wet][ref1] hebben of waarop toezicht op het uitoefenen van het bedrijf van bank wordt
      uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 112.b
    text: kortlopende schuldtitels aan toonder;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel112
  - number: 112.c
    text: |-
      financiële instrumenten die zijn toegelaten tot de handel aan een gereglementeerde markt of een markt in financiële
      instrumenten waarvan de houder gevestigd is in een staat die deel uitmaakt van de G10 of aan een andere door de
      Nederlandsche Bank aangewezen gereglementeerde markt;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel112
  - number: 112.d
    text: |-
      officiële stand-by faciliteiten afgegeven door banken die een vergunning als bedoeld in
      [artikel 2:11 van de wet][ref1] hebben of waarop toezicht op het uitoefenen van het bedrijf van bank wordt
      uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de belangen die de wet beoogt te beschermen; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 112.e
    text: |-
      onvoorwaardelijke garanties van banken en verzekeraars die een vergunning als bedoeld in [artikel 2:11][ref1]
      onderscheidenlijk [artikel 2:27 van de wet][ref2] hebben of waarop toezicht op het uitoefenen van het bedrijf van
      bank onderscheidenlijk verzekeraar wordt uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de
      belangen die de [wet][ref3] beoogt te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
  - number: '114.1'
    text: |-
      Een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-omvang, berekent de door
      hem aan te houden technische voorzieningen overeenkomstig de artikelen 76 tot en met 83 en 192 van de richtlijn
      solvabiliteit II, met inachtneming van titel I, hoofdstuk III, van de verordening solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel114
  - number: '114.2'
    text: |-
      Indien een kapitaalopslag aan de verzekeraar is opgelegd en de verzekeraar artikel 77, vijfde lid, van de richtlijn
      solvabiliteit II toepast, neemt hij tevens artikel 37, vijfde lid, tweede alinea, van die richtlijn in acht.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel114
  - number: '114.3'
    text: |-
      Indien de Europese Commissie op grond van artikel 172, tweede of vierde lid, van de richtlijn solvabiliteit II het
      solvabiliteitsregime van een staat die geen lidstaat is gelijkwaardig acht met die van de richtlijn solvabiliteit
      II, worden voor de berekening van de technische voorzieningen herverzekeringsovereenkomsten met verzekeraars met
      zetel in die staat gelijk gesteld met herverzekeringsovereenkomsten met verzekeraars met zetel in een lidstaat.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel114
  - number: '115.1'
    text: |-
      Een verzekeraar als bedoeld in [artikel 114][ref1] kan bij het berekening van de technische voorzieningen, na
      voorafgaande goedkeuring van de Nederlandsche Bank, gebruik maken van hetzij de overgangsmaatregel, bedoeld
      in artikel 308 quater van de richtlijn solvabiliteit II, hetzij de overgangsmaatregel, bedoeld in artikel 308
      quinquies van die richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '115.2'
    text: |-
      Een verzekeraar die gebruik maakt van een overgangsmaatregel als bedoeld in het eerste lid en vaststelt dat hij
      zonder toepassing van die overgangsmaatregel niet aan het solvabiliteitskapitaalvereiste zou voldoen, geeft hiervan
      onverwijld kennis aan de Nederlandsche Bank en treft de in artikel 308 sexies, tweede en derde alinea, van de
      richtlijn solvabiliteit II bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel115
  - number: '115.3'
    text: |-
      De Nederlandsche Bank trekt de in het eerste lid bedoelde goedkeuring in indien uit de door de verzekeraar
      overgelegde informatie blijkt dat het onrealistisch is dat deze aan het einde van de overgangsperiode aan het
      solvabiliteitskapitaalvereiste zal voldoen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel115
  - number: '116.1'
    text: |-
      De artikelen 76 tot en met 83, 192 en 308 quater tot en met 308 sexies van de richtlijn solvabiliteit II en titel
      I, hoofdstuk III, van de verordening solvabiliteit II inzake de berekening van de technische voorzieningen zijn
      van overeenkomstige toepassing op de door de volgende verzekeraars aan te houden technische voorzieningen voor hun
      vanuit een in Nederland gelegen bijkantoor aangegane verzekeringsverplichtingen:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel116
  - number: 116.1.a
    text: |-
      levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel116
  - number: 116.1.b
    text: herverzekeraars met zetel in een niet-aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel116
  - number: '116.2'
    text: |-
      [Artikel 114, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel114
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '114'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '117.1'
    text: |-
      De artikelen 76 tot en met 77 bis en 77 quinquies tot en met 83 van de richtlijn solvabiliteit II en titel I,
      hoofdstuk III, met uitzondering van afdeling 4, onderafdeling 4, van de verordening solvabiliteit II inzake de
      berekening van de technische voorzieningen zijn van overeenkomstige toepassing op:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel117
  - number: 117.1.a
    text: verzekeraars met beperkte risico-omvang met zetel in Nederland;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel117
  - number: 117.1.b
    text: |-
      verzekeraars met beperkte risico-omvang met zetel in een niet-aangewezen staat voor wat betreft de door
      hen aan te houden technische voorzieningen voor hun vanuit een in Nederland gelegen bijkantoor aangegane
      verzekeringsverplichtingen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel117
  - number: '117.2'
    text: |-
      Een verzekeraar met beperkte risico-omvang als bedoeld in het eerste lid kan bij de berekening van de technische
      voorzieningen gebruik maken van de vereenvoudigde berekeningsmethoden als bedoeld in de artikelen 57 tot en met 61
      van de verordening solvabiliteit II, mits:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel117
  - number: 117.2.a
    text: |-
      deze passen bij de aard, omvang en complexiteit van de risico’s van de verzekeraar en deze berekeningswijzen niet
      leiden tot een significante onderschatting van de technische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel117
  - number: 117.2.b
    text: het gebruik ervan goed wordt onderbouwd en vastgelegd;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel117
  - number: 117.2.c
    text: ten aanzien van de toepassing van de berekeningsmethoden een bestendige gedragslijn wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel117
  - number: '117.3'
    text: |-
      In afwijking van het eerste lid, aanhef, wordt voor natura-uitvaartverzekeraars en levensverzekeraars met beperkte
      risico-omvang als bedoeld in [artikel 49b, tweede lid, onderdeel a][ref1], bij de toepassing van artikel 39 van de
      verordening solvabiliteit II het kapitaalkostenpercentage gesteld op 4%.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel49b
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: 49b
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: '117.4'
    text: 'De verzekeraar kan bij de berekening van de technische voorzieningen rekening houden met:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel117
  - number: 117.4.a
    text: |-
      aanwezige risicomitigerende instrumenten, mits deze aantoonbaar effectief zijn en niet resulteren in een materieel
      basisrisico als bedoeld in artikel 1, punt 25, van de verordening solvabiliteit II;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel117
  - number: 117.4.b
    text: |-
      toekomstige risicomitigerende instrumenten, mits deze realistisch zijn en aantoonbaar voortvloeien uit de reguliere
      bedrijfsvoering, het gevoerde risicobeheer of het afdekkingsbeleid.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel117
  - number: '118.1'
    text: |-
      Het beleggingsbeleid van een verzekeraar met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-
      omvang, voldoet aan het prudent person beginsel, bedoeld in artikel 132, tweede tot en met vierde lid, van de
      richtlijn solvabiliteit II, met inachtneming van titel I, hoofdstuk VIII, van de verordening solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel118
  - number: '118.2'
    text: |-
      De vereisten in de door de Europese Commissie vastgestelde uitvoeringsmaatregelen als bedoeld in artikel 135,
      tweede lid, van de richtlijn solvabiliteit II zijn op verzekeraars die beleggen in verhandelbare effecten of andere
      op herverpakte kredieten gebaseerde instrumenten die voor 1 januari 2011 zijn uitgegeven, slechts van toepassing
      indien na 31 december 2014 nieuwe onderliggende vorderingen zijn of worden toegevoegd of vervangen.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel118
  - number: '119'
    text: |-
      Artikel 132, tweede tot en met vierde lid, van de richtlijn solvabiliteit II en titel I, hoofdstuk VIII, van de
      verordening solvabiliteit II inzake het beleggingsbeleid zijn van overeenkomstige toepassing op de activa van de in
      Nederland gelegen bijkantoren van:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel119
  - number: 119.a
    text: |-
      levensverzekeraars en schadeverzekeraars, niet zijnde verzekeraars met beperkte risico-omvang, met zetel in een
      staat die geen lidstaat is;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel119
  - number: 119.b
    text: herverzekeraars met zetel in een niet-aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel119
  - number: '120'
    text: |-
      Artikel 132, tweede tot en met vierde lid, van de richtlijn solvabiliteit II en titel I, hoofdstuk VIII, van de
      verordening solvabiliteit II inzake het beleggingsbeleid zijn van overeenkomstige toepassing op:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel120
  - number: 120.a
    text: verzekeraars met beperkte risico-omvang met zetel in Nederland;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel120
  - number: 120.b
    text: |-
      verzekeraars met beperkte risico-omvang met zetel in een niet-aangewezen staat voor wat betreft de activa van hun
      in Nederland gelegen bijkantoren.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel120
  - number: '121'
    text: |-
      De waarden die dienen tot dekking van de technische voorzieningen voor de door een verzekeraar met beperkte risico-
      omvang vanuit zijn vestigingen in Nederland aangegane verplichtingen zijn:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel121
  - number: 121.a
    text: 'in geval van een verzekeraar met zetel in Nederland: aanwezig in een lidstaat; of'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel121
  - number: 121.b
    text: 'in geval van een verzekeraar met zetel in een niet-aangewezen staat: aanwezig in Nederland.'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel121
  - number: '122'
    text: |-
      Artikel 132, tweede tot en met vierde lid, van de richtlijn solvabiliteit II en titel I, hoofdstuk VIII, van de
      verordening solvabiliteit II inzake het beleggingsbeleid zijn van overeenkomstige toepassing op:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel122
  - number: 122.a
    text: |-
      de waarden, bedoeld in [artikel 3:67, vierde lid][ref1], of [3:68, derde lid, van de wet][ref2]
      die dienen tot dekking van de verplichtingen van een levensverzekeraar of schadeverzekeraar
      als bedoeld in die artikelen die voortvloeien uit vorderingen van werknemers als bedoeld in
      [artikel 3:198, tweede lid, onderdelen b, c en d, of derde lid, onderdelen a, b en c, van de wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 122.b
    text: |-
      de waarden, bedoeld in [artikel 3:67, vierde lid][ref1], of [3:69, tweede lid, van de wet][ref2],
      die dienen tot dekking van de verplichtingen van een verzekeraar met beperkte risico-omvang
      als bedoeld in die artikelen die voortvloeien uit vorderingen van werknemers als bedoeld in
      [artikel 3:198, vierde lid, onderdelen a, b en c, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '123'
    text: |-
      Het beleggingsbeleid van een pensioenregeling die niet wordt beheerst door het recht van een lidstaat wordt
      uitgevoerd overeenkomstig de bepalingen van het land van herkomst van de regeling.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel123
  - number: '124.1'
    text: |-
      Het beleggingsbeleid van een pensioenregeling die wordt beheerst door het recht van een lidstaat wordt uitgevoerd
      overeenkomstig de volgende beginselen:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel124
  - number: 124.1.a
    text: |-
      beleggingen in de bijdragende onderneming worden beperkt tot ten hoogste 5% van de portefeuille als geheel, en
      ingeval de bijdragende onderneming tot een groep behoort, worden beleggingen in de ondernemingen die tot dezelfde
      groep als de bijdragende onderneming behoren, beperkt tot ten hoogste 10% van de portefeuille. Wanneer een groep
      van ondernemingen aan de premiepensioeninstelling bijdragen betaalt, geschieden beleggingen in deze bijdragende
      ondernemingen prudent, waarbij rekening wordt gehouden met de noodzaak van een behoorlijke diversificatie;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel124
  - number: 124.1.b
    text: de beleggingen worden gewaardeerd op basis van marktwaardering;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel124
  - number: 124.1.c
    text: |-
      beleggingen in niet tot de handel op een gereglementeerde markt, of een multilaterale handelsfaciliteit of een
      daarmee vergelijkbaar systeem in een staat die geen lidstaat is toegelaten waarden worden tot een prudent niveau
      beperkt.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel124
  - number: 124.1.d
    text: |-
      beleggingen in derivaten zijn toegestaan voor zover deze bijdragen aan een vermindering van het risicoprofiel of
      een doeltreffend portefeuillebeheer vergemakkelijken. De premiepensioeninstelling vermijdt een bovenmatig risico
      met betrekking tot een en dezelfde tegenpartij en tot andere derivatenverrichtingen;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel124
  - number: 124.1.e
    text: |-
      de waarden worden naar behoren gediversifieerd zodat een bovenmatige afhankelijkheid van of vertrouwen in bepaalde
      waarden, of een bepaalde emittent van waarden of groep van ondernemingen en risicoaccumulatie in de portefeuille
      als geheel worden vermeden.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel124
  - number: '124.2'
    text: |-
      De eisen die zijn opgenomen in het eerste lid, aanhef en onderdelen a en e, zijn niet van toepassing op beleggingen
      in staatsobligaties.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel124
  - number: '124.3'
    text: |-
      Onder waardering op marktwaarde bedoeld in het eerste lid, onderdeel b, wordt verstaan: het bedrag waarvoor een
      actief kan worden verhandeld of een passief kan worden afgewikkeld tussen terzake goed geïnformeerde partijen, die
      tot een transactie bereid en onafhankelijk van elkaar zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel124
  - number: '124.4'
    text: |-
      Leningen als bedoeld in [artikel 3:267b, vierde lid, van de wet][ref1] mogen slechts worden aangegaan voor een
      periode van niet langer dan een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '124.5'
    text: |-
      Van een liquiditeitsdoelstelling als bedoeld in [artikel 3:267b, vierde lid, van de wet][ref1] is sprake als
      de premiepensioeninstelling tijdelijk niet kan voldoen aan zijn verplichtingen of de betreffende lening wordt
      aangegaan ter verbetering van het risicoprofiel van de premiepensioeninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '129'
    text: |-
      Een afwikkelonderneming, betaalinstelling, clearinginstelling, elektronischgeldinstelling, bank,
      kredietunie, pensioenbewaarder, premiepensioeninstelling, verzekeraar of wisselinstelling als bedoeld in
      [artikel 3:71, eerste lid][ref1], [3:81, eerste lid][ref2] of [3:85][ref3] verstrekt de documenten, bedoeld in
      [artikel 3:71, eerste lid][ref4], of [3:81, eerste lid, van de wet][ref5], wat betreft indeling en inhoud in de
      vorm waarin deze zijn opgemaakt ingevolge [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref6], de internationale
      jaarrekeningstandaarden onderscheidenlijk het recht van de staat waar deze financiële onderneming haar zetel
      heeft. Een financiële onderneming met zetel in Nederland vermeldt of de jaarrekening al dan niet is vastgesteld en
      goedgekeurd overeenkomstig de statuten of de vennootschapsakte.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0003045
  - number: '130.1'
    text: |-
      De door een bank, als bedoeld in [artikel 3:72, eerste lid, van de wet][ref1] of, een beleggingsonderneming
      onder de verordening kapitaalvereisten of door een clearinginstelling als bedoeld in artikel 3:72, eerste lid, of
      [3:86, eerste lid, van de wet][ref2] te verstrekken staten omvatten uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 130.1.a
    text: gegevens betreffende rapportageverplichtingen ingevolge de verordening kapitaalvereisten;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
  - number: 130.1.b
    text: |-
      gegevens ten behoeve van het depositogarantiestelsel, bedoeld in [artikel 3:259, tweede lid, van de wet][ref1],
      betreffende de aangehouden deposito’s die worden gegarandeerd uit hoofde van het depositogarantiestelsel;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '130.2'
    text: |-
      De door een beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen te
      verstrekken staten omvatten uitsluitend de in artikel 54 en artikel 55 van de verordening prudentiële vereisten
      voor beleggingsondernemingen bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
  - number: '130.3'
    text: |-
      De door een beleggingsonderneming als bedoeld in artikel 3:82, eerste lid, van de wet te verstrekken staten
      omvatten uitsluitend:
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
  - number: 130.3.a
    text: |-
      de in artikel 430, eerste lid, onderdelen a en d, van de verordening kapitaalvereisten bedoelde gegevens voor zover
      het een beleggingsonderneming betreft waarop, indien zij haar zetel had gehad in een lidstaat, die verordening van
      toepassing zou zijn;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
  - number: 130.3.b
    text: |-
      de in artikel 54, eerste lid, onderdelen a tot en met c en f, van de verordening prudentiële vereisten voor
      beleggingsondernemingen bedoelde gegevens, voor zover het een beleggingsonderneming betreft waarop, indien zij haar
      zetel had gehad in een lidstaat, die verordening van toepassing zou zijn.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
  - number: '130.4'
    text: |-
      De door een entiteit voor risico-acceptatie als bedoeld in [artikel 3:72, derde lid, van de wet][ref1] te
      verstrekken staten omvatten uitsluitend de gegevens, bedoeld in artikel 325 van de verordening solvabiliteit II.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '130.5'
    text: |-
      De door een verzekeraar als bedoeld in [artikel 3:72, derde lid, van de wet][ref1], niet zijnde een verzekeraar met
      beperkte risico-omvang, bijkantoor als bedoeld in [artikel 3:82, tweede lid, van de wet][ref2], of bijkantoor van
      een herverzekeraar als bedoeld in [artikel 3:86, tweede lid][ref3], te verstrekken staten omvatten uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 130.5.a
    text: de gegevens, bedoeld in titel I, hoofdstuk XIII, afdeling 1, van de verordening solvabiliteit II;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
  - number: 130.5.b
    text: |-
      andere voor toezichtdoeleinden benodigde periodieke informatie als bedoeld in artikel 35, eerste lid, van de
      richtlijn solvabiliteit II.
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
  - number: '130.6'
    text: |-
      De door een verzekeraar als bedoeld in [artikel 3:72, derde lid, van de wet][ref1] met beperkte risico-omvang of
      bijkantoor als bedoeld in [artikel 3:86, tweede lid, van de wet][ref2] van een verzekeraar met beperkte risico-
      omvang te verstrekken staten omvatten uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 130.6.a
    text: |-
      een jaarrekening alsmede aanvullende financiële gegevens ten behoeve van het toezicht op de naleving van het Deel
      Prudentieel toezicht financiële ondernemingen van de wet;
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
  - number: 130.6.b
    text: 'andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020420/2023-07-01#Artikel130
  - number: 130.6.b.1°
    text: |-
      de solvabiliteit ingevolge [artikel 3:57, eerste lid][ref1], [3:61, eerste of tweede lid][ref2], of
      [3:62 van de wet][ref3]; en


