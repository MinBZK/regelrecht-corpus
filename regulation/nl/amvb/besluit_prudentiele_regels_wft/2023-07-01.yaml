        artikel: '64'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '59.2'
    text: |-
      De solvabiliteit van een verzekeraar als bedoeld in [artikel 3:57, eerste lid][ref1],
      [3:58, eerste of tweede lid][ref2], of [3:61, eerste of tweede lid][ref3], of van een bijkantoor als bedoeld
      in [artikel 3:59, eerste lid][ref4], of [3:62, eerste lid, van de wet][ref5] is voldoende indien het eigen
      vermogen, bedoeld in [artikel 70][ref6], ten minste gelijk is aan het solvabiliteitskapitaalvereiste, berekend
      overeenkomstig, al naar gelang van toepassing, [artikel 65][ref7], [66][ref8] of [68][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020420#Artikel70
      [ref7]: https://wetten.overheid.nl/BWBR0020420#Artikel65
      [ref8]: https://wetten.overheid.nl/BWBR0020420#Artikel66
      [ref9]: https://wetten.overheid.nl/BWBR0020420#Artikel68
