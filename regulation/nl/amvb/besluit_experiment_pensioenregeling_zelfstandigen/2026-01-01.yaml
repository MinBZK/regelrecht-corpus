---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_experiment_pensioenregeling_zelfstandigen
regulatory_layer: AMVB
publication_date: '2023-06-30'
valid_from: '2026-01-01'
bwb_id: BWBR0048326
url: https://wetten.overheid.nl/BWBR0048326/2026-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Armoedebeleid, Participatie en Pensioenen van 24 februari, 2023-0000100036;

    Gelet op artikel 150a van de Pensioenwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 12 april 2023, nr. W12.23.00041/III);

    Gezien het nader rapport van Onze Minister voor Armoedebeleid, Participatie en Pensioenen van 19 juni 2023, nr.
    2023-000032463;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel1
  - number: 1.a
    text: |-
      *derdepijlerlijfrente:* fiscaal gefaciliteerd product als bedoeld in de [artikelen 3.125][ref1] en
      [3.126a van de Wet inkomstenbelasting 2001][ref2], die niet voortkomt uit een arbeidsrechtelijke overeenkomst
      en waarop de [wet][ref3] en de [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref4] niet van
      toepassing zijn, met als doel het genereren van pensioeninkomen voor de zelfstandige;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020809
      [ref4]: https://wetten.overheid.nl/BWBR0012092
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020809
      - id: ref4
        bwb_id: BWBR0012092
  - number: 1.b
    text: |-
      *experiment:* tijdelijke mogelijkheid om een pensioenregeling als bedoeld in de [wet][ref1] aan zelfstandigen te
      bieden om op basis daarvan sparen voor de oude dag door zelfstandigen te stimuleren;


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: 1.c
    text: |-
      *wet:* [Pensioenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: 1.d
    text: |-
      *zelfstandige:* een zelfstandige of een directeur-grootaandeelhouder in de zin van de [wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '2.1'
    text: |-
      In afwijking van [artikel 117, eerste en vijfde lid, van de wet][ref1], kan een pensioenfonds een pensioenregeling
      voor zelfstandigen uitvoeren, waarbij deze pensioenregeling geen aanvulling op een door datzelfde pensioenfonds
      uitgevoerde basisregeling betreft. [Artikel 120, tweede lid, aanhef en onderdeel b, van de wet][ref2] zijn niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel120
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '117'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '120'
  - number: '2.2'
    text: |-
      Werkgevers of de partijen die betrokken zijn bij de vaststelling, wijziging of intrekking van een
      pensioenovereenkomst die ondergebracht is bij een pensioenfonds, dragen er zorg voor dat zelfstandigenorganisaties
      betrokken worden bij de vormgeving van een experiment, de vormgeving van de pensioenregeling voor zelfstandigen
      of de keuze of de pensioenregeling van werknemers wordt opengesteld voor zelfstandigen of dat hiervoor een eigen
      pensioenregeling voor zelfstandigen wordt opengesteld.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: '2.3'
    text: |-
      Een ondernemingspensioenfonds kan een pensioenregeling openstellen voor zelfstandigen in het kader van een
      experiment uitsluitend voor zover de zelfstandige werkzaamheden verricht voor de werkgever.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: '2.4'
    text: |-
      Een bedrijfstakpensioenfonds kan een pensioenregeling openstellen voor zelfstandigen in het kader van
      een experiment uitsluitend voor zover de zelfstandige onder de werkingssfeer valt van een door het
      bedrijfstakpensioenfonds uitgevoerde pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: '2.5'
    text: |-
      Een algemeen pensioenfonds kan een pensioenregeling openstellen voor zelfstandigen in het kader van een experiment
      waarbij het volgende geldt:
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: 2.5.a
    text: |-
      indien de pensioenregeling van werknemers wordt opengesteld voor zelfstandigen dan dient de zelfstandige
      werkzaamheden te verrichten voor de werkgever van de betreffende collectiviteitkring;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: 2.5.b
    text: |-
      indien een pensioenregeling voor zelfstandigen in een eigen collectiviteitkring wordt opengesteld, dan is het niet
      noodzakelijk dat de zelfstandige werkzaamheden verricht voor de werkgever.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: '2.6'
    text: |-
      Het verantwoordingsorgaan, het belanghebbendenorgaan, de raad van toezicht en de niet-uitvoerende bestuursleden
      worden door het pensioenfonds in de gelegenheid gesteld een oordeel te geven over het openstellen van de
      pensioenregeling, bedoeld in het derde, vierde of vijfde lid, aanhef en onderdeel a. Het oordeel wordt op een
      zodanig tijdstip gevraagd dat het van invloed kan zijn op het wel of niet openstellen van de pensioenregeling,
      waarbij door het pensioenfonds alle relevante informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: '2.7'
    text: |-
      Het pensioenfonds stelt uiterlijk bij de start van de verwerving van pensioenaanspraken door de zelfstandige vast
      of wordt voldaan aan de voorwaarde voor het openstellen van de pensioenregeling, bedoeld in het derde, vierde of
      vijfde lid, aanhef en onderdeel a.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: '2.8'
    text: |-
      In aanvulling op het tweede lid en vijfde lid, aanhef en onderdeel b, kan een algemeen pensioenfonds zelfstandig
      besluiten een pensioenregeling voor zelfstandigen in een eigen collectiviteitkring open te stellen, waarbij het
      algemeen pensioenfonds er voor zorgdraagt dat zelfstandigenorganisaties betrokken worden bij de vormgeving van een
      experiment en de vormgeving van de pensioenregeling voor zelfstandigen.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: '2.9'
    text: 'Een zelfstandigenorganisatie als bedoeld in het tweede en achtste lid dient aan de volgende voorwaarden te voldoen:'
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: 2.9.a
    text: |-
      de zelfstandigenorganisatie bezit volledige rechtsbevoegdheid als bedoeld in
      [Boek 2 van het Burgerlijk Wetboek][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 2.9.b
    text: haar statutaire doel omvat in elk geval de belangenbehartiging van zelfstandigen.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: '2.10'
    text: |-
      Een verzekeraar of premiepensioeninstelling kan zelfstandig besluiten een pensioenregeling open te stellen voor
      zelfstandigen.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      De pensioenuitvoerder die een pensioenregeling openstelt voor zelfstandigen kan de vrijwillige deelname aan deze
      pensioenregeling kenbaar maken aan zelfstandigen. De zelfstandige neemt deel op eigen initiatief.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Op initiatief van een bedrijfstakpensioenfonds kan het kenbaar maken van de pensioenregeling, bedoeld in het eerste
      lid, als ook het doen van het aanbod om deel te nemen plaatsvinden via het aanschrijven van zelfstandigen. Hierbij
      geldt het volgende op het moment van de aanschrijving:
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: 3.2.a
    text: de zelfstandige is gewezen deelnemer bij het bedrijfstakpensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: 3.2.b
    text: de zelfstandige verricht werkzaamheden binnen de statutaire werkingssfeer van het bedrijfstakpensioenfonds.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: '3.3'
    text: |-
      De pensioenuitvoerder informeert een zelfstandige, als onderdeel van het aanbod om deel te nemen,
      voorafgaand aan de deelneming in de pensioenregeling overeenkomstig [artikel 45 van de wet][ref1] en
      [artikel 8 van het Besluit uitvoering Pensioenwet en Wet verplichte beroepspensioenregeling][ref2]. In aanvulling
      op de eerste zin informeert de pensioenuitvoerder over:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel8
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '8'
  - number: 3.3.a
    text: de wijze waarop aanbod en aanvaarding in ieder geval tot stand komt;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: 3.3.b
    text: de vrijwilligheid van de pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: 3.3.c
    text: |-
      de wijze waarop en de termijnen waarin de verschuldigde premie moet worden voldaan met in achtneming van
      [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0048326#Artikel4
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0048326
        artikel: '4'
  - number: 3.3.d
    text: |-
      de fiscale behandeling, waaronder begrepen de fiscale behandeling van premies, uitkeringen en de fiscale
      consequenties van afkoop in algemene zin;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: 3.3.e
    text: de gevolgen voor de fiscale ruimte in een derdepijlerlijfrente in algemene zin;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: 3.3.f
    text: het gegeven dat de betaalde premie niet wordt teruggestort aan de zelfstandige;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: 3.3.g
    text: |-
      de jaarlijkse totale uitvoeringskosten per soort uitvoeringskosten, bedoeld in
      [artikel 10a van het Besluit uitvoering Pensioenwet en Wet verplichte beroepspensioenregeling][ref1], afgezet tegen
      de jaarlijkse verwachte pensioenopbouw in procenten;


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
  - number: 3.3.h
    text: de duur van het experiment;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: 3.3.i
    text: |-
      het gebruik van het recht van de pensioenuitvoerder om aan het einde van het experiment de pensioenregeling te
      beëindigen als bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0048326#Artikel9
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0048326
        artikel: '9'
  - number: 3.3.j
    text: de gevolgen en keuzemogelijkheden bij de beëindiging van het experiment;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: 3.3.k
    text: de gegevensuitwisseling in het kader van bewaken van het experiment en de evaluatie daarvan; en
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: 3.3.l
    text: |-
      de overige informatie die de pensioenuitvoerder nodig heeft om deelname aan de pensioenregeling door de
      zelfstandige te kunnen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: '3.4'
    text: |-
      De pensioenuitvoerder stelt als onderdeel van het aanbod om deel te nemen aan de pensioenregeling de
      uitvoeringsovereenkomst of het uitvoeringsreglement ter beschikking aan een zelfstandige.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel3
  - number: '4.1'
    text: |-
      [Artikel 120, eerste en tweede lid, aanhef en onderdeel a, derde en vierde lid, van de wet][ref1] zijn niet
      van toepassing. [Artikel 24 van de wet][ref2] is van overeenkomstige toepassing, waarbij de zelfstandige aan de
      pensioenuitvoerder de verschuldigde premie voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel24
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '24'
  - number: '4.2'
    text: |-
      Overeenkomstig [artikel 25 van de wet][ref1] is in de uitvoeringsovereenkomst respectievelijk het
      uitvoeringsreglement het volgende opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel25
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '25'
  - number: 4.2.a
    text: de wijze waarop de verschuldigde premie wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel4
  - number: 4.2.b
    text: |-
      de wijze waarop en termijnen waarin de verschuldigde premie moet worden voldaan waarbij [artikel 26][ref1] van
      overeenkomstige toepassing is; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel26
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '26'
  - number: 4.2.c
    text: de procedures die gelden bij het niet nakomen van premiebetalingsverplichtingen door de zelfstandige.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel4
  - number: '4.3'
    text: |-
      [Artikel 29 van de wet][ref1] is van overeenkomstige toepassing waarbij voor de verzekeraar de pensioenuitvoerder
      gelezen dient te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel29
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '29'
  - number: '5'
    text: |-
      De voortzetting van het nabestaandenpensioen voor de periode van drie maanden of periode van zes maanden na
      beëindiging deelneming, bedoeld in [artikel 55 van de wet][ref1], is van overeenkomstige toepassing indien de
      zelfstandige niet meer deelneemt omdat degene niet meer valt onder de definitie van zelfstandige of indien sprake
      is van een situatie als bedoeld in [artikel 9, derde lid, of vierde lid, aanhef en onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0048326#Artikel9
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0048326
        artikel: '9'
  - number: '6'
    text: |-
      In afwijking van [artikel 65 van de wet][ref1] geldt het volgende. Het recht op afkoop klein ouderdomspensioen,
      bedoeld in [artikel 66 van de wet][ref2], is van overeenkomstige toepassing waarbij uitsluitend de
      pensioenaanspraak opgebouwd als zelfstandige in het kader van dit experiment gehanteerd wordt voor de vaststelling
      of de opgebouwde pensioenaanspraak op ouderdomspensioen minder bedraagt dan het in artikel 66, eerste lid,
      onderdeel a, van de wet genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '66'
  - number: '7.1'
    text: |-
      Een pensioenuitvoerder die een pensioenregeling openstelt voor zelfstandigen, meldt dit uiterlijk een maand
      voorafgaand aan het openstellen van de pensioenregeling bij Onze Minister via het hierna genoemde e-mailadres, te
      weten: 'meldingWTPexperiment@minszw.nl. De melding bevat ten minste het volgende:'
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel7
  - number: 7.1.a
    text: het pensioenreglement en de uitvoeringsovereenkomst of uitvoeringsreglement;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel7
  - number: 7.1.b
    text: de naam en het adres van de pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel7
  - number: 7.1.c
    text: de contactpersoon namens de pensioenuitvoerder en de contactgegevens;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel7
  - number: 7.1.d
    text: de bedrijfstak dan wel de werkgever;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel7
  - number: 7.1.e
    text: de startdatum van het experiment;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel7
  - number: 7.1.f
    text: |-
      het gegeven of sprake is van een eigen pensioenregeling voor zelfstandigen of van een openstelling van een
      bestaande pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel7
  - number: 7.1.g
    text: |-
      voor zover van toepassing, het gegeven of het bedrijfstakpensioenfonds wel of niet gebruikmaakt van het
      aanschrijven van zelfstandigen, als bedoeld in [artikel 3, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0048326#Artikel3
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0048326
        artikel: '3'
  - number: 7.1.h
    text: informatie over de keuzemogelijkheden van de zelfstandige waarin de pensioenregeling voorziet.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel7
  - number: '7.2'
    text: Onze Minister meldt aan de toezichthouders welke pensioenuitvoerders gebruik maken van dit experiment.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel7
  - number: '8.1'
    text: |-
      De pensioenuitvoerder is bevoegd tot het verwerken van persoonsgegevens van de zelfstandige, voor zover dat
      noodzakelijk is voor de uitvoering van het experiment.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      De pensioenuitvoerder is bevoegd tot het verwerken van persoonsgegevens van de zelfstandige voor zover dat
      noodzakelijk is voor het bewaken van het experiment en de evaluatie daarvan.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel8
  - number: '8.3'
    text: |-
      Het onafhankelijke onderzoeksbureau, bedoeld in [artikel 10][ref1] is bevoegd tot het verwerken van gegevens,
      waaronder persoonsgegevens, voor zover dat noodzakelijk is voor het bewaken van het experiment en de evaluatie
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0048326#Artikel10
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048326
        artikel: '10'
  - number: '8.4'
    text: |-
      De pensioenuitvoerder is bevoegd uit eigen beweging en is verplicht op verzoek van Onze Minister gegevens,
      waaronder persoonsgegevens, te verstrekken aan Onze Minister voor zover dat noodzakelijk is voor het bewaken van
      het experiment en de evaluatie daarvan.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel8
  - number: '8.5'
    text: |-
      De verwerking van bijzondere categorieën van persoonsgegevens als bedoeld in artikel 9 van de Algemene verordening
      persoonsgegevens, is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      Een pensioenuitvoerder kan gedurende dit experiment de pensioenregeling sluiten voor zelfstandigen die niet
      deelnemen.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      Een pensioenuitvoerder kan de deelneming van een zelfstandige gedurende dit experiment niet op initiatief van de
      pensioenuitvoerder tussentijds beëindigen, tenzij de beëindiging het gevolg is van [artikel 29 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel29
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '29'
  - number: '9.3'
    text: |-
      Indien dit experiment wordt omgezet in een structurele wettelijke regeling, als bedoeld in
      [artikel 150a, tweede lid, van de wet][ref1], heeft de pensioenuitvoerder het recht om na afloop van de duur van
      het experiment de pensioenregeling te beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150a
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150a
  - number: '9.4'
    text: |-
      Indien het experiment wordt beëindigd en dit besluit als gevolg komt te vervallen als bedoeld in
      [artikel 10][ref1], geldt het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0048326#Artikel10
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0048326
        artikel: '10'
  - number: 9.4.a
    text: |-
      de pensioenuitvoerder kan voor de zelfstandige vrijwillige voortzetting van de pensioenregeling uitvoeren als
      bedoeld in [artikel 54 van de wet][ref1], waarbij een termijn van tien jaar geldt voor zover degene gedurende de
      vrijwillige voortzetting een zelfstandige is;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel54
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '54'
  - number: 9.4.b
    text: |-
      in afwijking van [artikel 65 van de wet][ref1] is het recht op afkoop klein ouderdomspensioen, bedoeld in
      [artikel 66, tweede lid, van de wet][ref2], van overeenkomstige toepassing waarbij in afwijking hiervan:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '66'
  - number: 9.4.b.1°
    text: |-
      uitsluitend de pensioenaanspraak opgebouwd als zelfstandige in het kader van dit experiment gehanteerd wordt
      voor de vaststelling of de opgebouwde pensioenaanspraak op ouderdomspensioen minder bedraagt dan het in het
      [eerste lid, onderdeel a, van artikel 66 van de wet][ref1] genoemde bedrag; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
  - number: 9.4.b.2°
    text: |-
      de pensioenuitvoerder binnen een jaar na einde van het experiment ten minste eenmaal tevergeefs gepoogd heeft de
      overdrachtswaarde van een zelfstandige over te dragen als bedoeld in [artikel 70a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 70a
  - number: 9.4.c
    text: |-
      in afwijking van [artikel 70 van de wet][ref1] is de pensioenuitvoerder verplicht om na een verzoek van de
      zelfstandige tot waardeoverdracht de overdrachtswaarde van diens pensioenaanspraken rechtstreeks over te dragen
      aan een andere pensioenuitvoerder indien de zelfstandige reeds pensioenaanspraken heeft bij de ontvangende
      pensioenuitvoerder, tenzij sprake is van een van de in de [artikelen 72][ref2], [72a][ref3] en [73][ref4]
      omschreven situaties; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel72a
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel73
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '70'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '72'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 72a
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '73'
  - number: 9.4.d
    text: |-
      in afwijking van [artikel 70 van de wet][ref1] is de pensioenuitvoerder verplicht om na een verzoek van de
      zelfstandige tot waardeoverdracht de overdrachtswaarde van diens pensioenaanspraken rechtstreeks over te
      dragen naar een toegestane uitvoerder voor de aanwending van een derdepijlerlijfrente, mits dit verzoek voor
      waardeoverdracht door de zelfstandige is gedaan binnen een jaar nadat de deelname is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '70'
  - number: '9.5'
    text: |-
      De pensioenuitvoerder informeert de zelfstandige tijdig indien dit experiment wordt beëindigd of de
      pensioenuitvoerder gebruikmaakt van de beëindiging op grond van het derde lid. [Artikel 39 van de wet][ref1] is van
      overeenkomstige toepassing waarbij voor de informatie, bedoeld in het eerste lid, onderdeel c, van de wet tevens
      het vierde lid gelezen wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel39
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '39'
  - number: '9.6'
    text: |-
      [Artikel 71 van de wet][ref1] is van overeenkomstige toepassing op de waardeoverdracht, bedoeld in het vierde lid,
      aanhef en onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
  - number: '9.7'
    text: Elk beding in strijd met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel9
  - number: '10.1'
    text: |-
      Een onafhankelijk onderzoeksbureau, aan wie de opdracht door Onze Minister is verstrekt, bewaakt het experiment ten
      behoeve van de evaluatie en voert deze evaluatie uit.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
  - number: '10.2'
    text: |-
      Het onafhankelijke onderzoeksbureau is bevoegd in aanvulling op [artikel 8][ref1] gedurende de experimenteerperiode
      gegevens te verzamelen ten behoeve van de evaluatie en de uitvoering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0048326#Artikel8
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0048326
        artikel: '8'
  - number: '10.3'
    text: |-
      De pensioenuitvoerder die in het kader van dit besluit een pensioenregeling voor zelfstandigen aanbiedt, verstrekt
      op verzoek van het onafhankelijke onderzoeksbureau de relevante informatie ten behoeve van de evaluatie en de
      uitvoering daarvan.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
  - number: '10.4'
    text: |-
      Bij de evaluatie over de experimenten wordt voor de beoordeling van de doeltreffendheid en de effecten mede
      betrokken:
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
  - number: 10.4.a
    text: |-
      de zelfstandigen die de gehele experimenteerperiode dan wel een deel van deze periode deelnamen aan de
      pensioenregeling; en
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
  - number: 10.4.b
    text: |-
      voor zover van toepassing, de deelnemers, gewezen deelnemers en pensioengerechtigden waarbij de pensioenregeling
      is opengesteld voor zelfstandigen bij een ondernemingspensioenfonds, bedrijfstakpensioenfonds en een algemeen
      pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
  - number: '10.5'
    text: 'Voor de beoordeling van de doeltreffendheid en effecten is in elk geval het volgende van belang:'
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
  - number: 10.5.a
    text: |-
      de mate waarin zelfstandigen pensioen sparen in een pensioenregeling die in het kader van dit besluit tot stand is
      gekomen en de omvang van de pensioenopbouw;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
  - number: 10.5.b
    text: de mate waarin de pensioenregeling aansluit op de behoeften van deelnemende zelfstandigen;
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
  - number: 10.5.c
    text: |-
      de mate waarin en de wijze waarop zelfstandigen vertegenwoordigd en betrokken zijn bij de totstandkoming van
      pensioenregeling; de effecten van pensioenregelingen waarbij het initiatief tot deelname is genomen door de
      pensioenuitvoerder door middel van automatisch aanschrijven, bedoeld in [artikel 3][ref1], afgezet tegen de
      effecten van pensioenregelingen waarbij het initiatief tot deelname is genomen door de zelfstandige; en


      [ref1]: https://wetten.overheid.nl/BWBR0048326#Artikel3
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0048326
        artikel: '3'
  - number: 10.5.d
    text: |-
      voor zover van toepassing, de effecten van het experiment op de deelnemers, gewezen deelnemers
      en pensioengerechtigden waarbij de pensioenregeling is opengesteld voor zelfstandigen bij een
      ondernemingspensioenfonds, bedrijfstakpensioenfonds en een algemeen pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
  - number: '10.6'
    text: |-
      In het verslag, bedoeld in [artikel 150a, zesde lid, van de wet][ref1], is opgenomen in hoeverre het experiment
      heeft bijgedragen aan het doel van de experimenteerbepaling, bedoeld in artikel 150a, eerste lid, van de wet. In
      het verslag wordt gebruik gemaakt van geaggregeerde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150a
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150a
  - number: '11.1'
    text: Dit besluit treedt in werking met ingang van 1 juli 2023.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel11
  - number: '11.2'
    text: |-
      Dit besluit vervalt op een bij koninklijk besluit te bepalen tijdstip dat niet later ligt dan vijf jaar na het
      tijdstip van inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel11
  - number: '11.3'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 150a, tweede lid, tweede zin, van de wet][ref1], vervalt dit besluit,
      in afwijking van het tweede lid, op een bij koninklijk besluit te bepalen tijdstip met inachtneming van genoemd
      artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150a
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150a
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit experiment pensioenregeling zelfstandigen.'
    url: https://wetten.overheid.nl/BWBR0048326/2026-01-01#Artikel12
