      - id: ref1
        bwb_id: BWBR0013360
  - number: 1.o
    text: |-
      kunststofverwerking: 'toepassing van ten minste één van de volgende verwerkingstechnieken: blazen, extrusie,'
      spuitgieten, thermovormen, schuimen, open maltechniek, gesloten maltechniek, vezelspuiten, agglomereren,
      expanderen, kalanderen, na-condenseren, pull trusion, rotatiegieten en vulkaniseren, en
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel1
  - number: 1.p
    text: |-
      kunststofbewerking: 'toepassing van de volgende bewerkingstechnieken: boren, frezen, verspanen, draaien, zagen,'
      snijden, stansen, tappen, slijpen, polijsten, lassen, lijmen, kitten en snijden.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel1
  - number: '2.1'
    text: 'Dit besluit is van toepassing op een inrichting die uitsluitend of in hoofdzaak is bestemd voor:'
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel2
  - number: 2.1.a
    text: |-
      het vervaardigen, bewerken, verwerken of opslaan van hout of kurk dan wel van houten, kurken of houtachtige
      voorwerpen;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel2
  - number: 2.1.b
    text: het bewerken van kunststof of kunststof voorwerpen;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel2
  - number: 2.1.c
    text: |-
      het ten behoeve van het bouwen, verbouwen of herstellen op locatie van woningen, woongebouwen of utiliteitsgebouwen
      opslaan van bouwstoffen, preparaten, producten of bouwmaterialen en het voor directe toepassing of verwerking
      geschikt maken daarvan, of
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel2
  - number: 2.1.d
    text: |-
      het aanbrengen, herstellen of onderhouden van technische installaties, toestellen of voorzieningen aan of in
      woningen, woongebouwen of utiliteitsgebouwen.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel2
  - number: '2.2'
    text: |-
      Dit besluit is eveneens van toepassing op inrichtingen waarin uitsluitend of in hoofdzaak sprake is van een
      samenstel van bedrijvigheden als bedoeld in het eerste lid, onder a tot en met d.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel2
  - number: '3.1'
    text: |-
      Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011529#Artikel2
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011529
        artikel: '2'
  - number: 3.1.a
    text: |-
      in de inrichting één of meer stooktoestellen voor verwarming of warmtekrachtopwekking aanwezig zijn met een
      thermisch vermogen per toestel van 7500 kW of meer;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.b
    text: |-
      in de inrichting een of meer installaties of voorzieningen aanwezig zijn die kunnen worden gebruikt voor het
      verstoken of verbranden van andere brandstoffen dan aardgas, propaangas, butaangas of gasolie;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.c
    text: |-
      in de inrichting koel- en vriesinstallaties of warmtepompen aanwezig zijn met een capaciteit of een totale
      capaciteit van meer dan 200 kg ammoniak of van meer dan 100 kg propaan, butaan of mengsels van propaan en butaan;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.d
    text: |-
      in de inrichting afvalstoffen worden op- of overgeslagen die niet binnen de bedrijfseigen activiteiten zijn
      ontstaan voorzover de inrichting beschikt over een capaciteit:
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.d.1°
    text: van meer dan 35 m3 voor de opslag van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.d.2°
    text: voor de opslag van gevaarlijke afvalstoffen, of
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.d.3°
    text: van meer dan 1000 m3 per jaar voor de overslag van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.e
    text: in de inrichting meer dan in totaal 10 000 kg aan gevaarlijke stoffen wordt opgeslagen;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.f
    text: 'in de inrichting voorzieningen of installaties aanwezig zijn voor het afleveren van:'
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.f.1°
    text: LPG, of
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.f.2°
    text: andere brandstoffen die niet in hoofdzaak worden gebruikt ten behoeve van transportmiddelen voor eigen gebruik;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.g
    text: |-
      in de inrichting vloeibare gevaarlijke stoffen, vloeibare gevaarlijke afvalstoffen of brandbare vloeistoffen in
      tanks worden op- of overgeslagen, tenzij sprake is van:
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.g.1°
    text: |-
      opslag in ondergrondse tanks, waarop het [Besluit opslaan in ondergrondse tanks 1998][ref1] van toepassing is, of


      [ref1]: https://wetten.overheid.nl/BWBR0009747
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009747
  - number: 3.1.g.2°
    text: opslag van brandbare vloeistoffen in bovengrondse tanks;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.h
    text: |-
      in de inrichting gassen of gasmengsels in tanks worden opgeslagen, tenzij sprake is van opslag waarop het
      [Besluit voorzieningen en installaties milieubeheer][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012897
  - number: 3.1.i
    text: |-
      in de inrichting meer dan 400 kg bestrijdingsmiddelen in de zin van de [Bestrijdingsmiddelenwet][ref1] worden
      opgeslagen;


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: 3.1.j
    text: 'in de inrichting voorzieningen of installaties aanwezig zijn voor:'
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.j.1°
    text: het vervaardigen van producten van houtmeel-, houtwol- of houtvezels;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.j.2°
    text: het vervaardigen van triplex-, fineer-, vezel- of spaanplaten;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.j.3°
    text: het galvaniseren of thermisch verzinken van materialen;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.j.4°
    text: het vervaardigen, onderhouden of herstellen van motorvoertuigen of schepen;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.j.5°
    text: het impregneren van hout door middel van spuiten, sproeien of de vacuümdrukmethode;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.j.6°
    text: het verbranden van hout of houtmot;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.j.7°
    text: het toepassen van kunststofverwerkingstechnieken, of
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.j.8°
    text: |-
      het vullen van gasflessen door middel van een vulstation anders dan de in richtlijn CPR 11–5 opgenomen type A of
      type B vulstations;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.k
    text: in de inrichting jaarlijks meer dan 15 000 kg organische oplosmiddelen worden verbruikt en
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: 3.1.l
    text: |-
      de inrichting of een onderdeel daarvan is ingericht voor de opslag van vuurwerk, tenzij met inachtneming van
      [artikel 2.2.1, eerste lid, van het Vuurwerkbesluit][ref1] ten hoogste 1000 kilogram consumentenvuurwerk wordt
      opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
  - number: '3.2'
    text: |-
      Dit besluit is eveneens niet van toepassing indien het emissiepunt van een verfverwerkings- of dompelruimte
      is gelegen op minder dan 50 meter van een stankgevoelig object, met uitzondering van die situaties waarvoor
      onmiddellijk voorafgaand aan 1 december 2000 een vergunning nog in werking en onherroepelijk was.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel3
  - number: '4.1'
    text: |-
      De voorschriften die zijn opgenomen in de bijlage gelden voor een ieder die de inrichting drijft. Deze draagt er
      zorg voor dat de voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel4
  - number: '4.2'
    text: |-
      Indien een voorschrift dat is opgenomen in de bijlage, hoofdstukken 1 tot en met 3, inhoudt dat daarbij aangegeven
      middelen ter bescherming van het milieu moeten worden toegepast, meldt degene die de inrichting drijft en die
      voornemens is andere middelen toe te passen, dit voornemen ten minste vier weken voordat hij die andere middelen
      wil toepassen aan het bevoegd gezag, onder overlegging van de in [artikel 6, twaalfde lid][ref1], bedoelde
      gegevens. Het bevoegd gezag beslist over de juistheid van een gekozen middel.


      [ref1]: https://wetten.overheid.nl/BWBR0011529#Artikel6
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011529
        artikel: '6'
  - number: '5.1'
    text: 'Het bevoegd gezag kan nadere eisen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel5
  - number: 5.1.a
    text: |-
      de in de bijlage opgenomen voorschriften ten aanzien van geluid, trilling, energie, afvalstoffen, afvalwater,
      lucht, verlichting, veiligheid, houtopslag en bodembescherming, voorzover dat in hoofdstuk 4 van die bijlage is
      aangegeven, of
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel5
  - number: 5.1.b
    text: |-
      de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, het verbruik van grondstoffen, de gevolgen van het verkeer
      van personen of goederen van en naar de inrichting, en de nadelige gevolgen voor het milieu die de inrichting kan
      veroorzaken waarop voorschrift 1.8.1 van de bijlage betrekking heeft, indien dat bijzonder is aangewezen in het
      belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel5
  - number: '5.2'
    text: |-
      De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel5
  - number: '5.3'
    text: |-
      Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel5
  - number: '6.1'
    text: Degene die een inrichting opricht, meldt dit ten minste vier weken voor de oprichting aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting en het
      veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding overeenkomstig het
      bepaalde in dit artikel is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding verstrekte
      gegevens en niet ingevolge het vierde of achtste lid andere gegevens zouden moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: '6.3'
    text: 'Bij de melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: 6.3.a
    text: het adres van de inrichting,
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: 6.3.b
    text: |-
      de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien dit iemand anders is, van degene die de inrichting drijft of zal drijven,
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: 6.3.c
    text: de aard en omvang van de activiteiten of processen in de inrichting,
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: 6.3.d
    text: de indeling en de uitvoering van de inrichting, en
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: 6.3.e
    text: |-
      het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de verandering
      van de werking daarvan verwezenlijkt zal zijn.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: '6.4'
    text: |-
      Indien de melding betrekking heeft op een inrichting waar transportbewegingen buiten de dagperiode van 07.00
      tot 19.00 uur plaatsvinden, dan wel een inrichting die gelegen is binnen een afstand van 50 meter van een woning
      van derden of andere geluidgevoelige bestemmingen, wordt bij de melding tevens een rapportage van een akoestisch
      onderzoek gevoegd.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: '6.5'
    text: |-
      Uit het rapport van een akoestisch onderzoek dient op grond van verrichte geluidmetingen of geluidberekeningen
      te blijken of aan het gestelde in voorschrift 1.1.1 of 1.1.3 van de bijlage kan worden voldaan, en in het rapport
      wordt aangegeven welke de hiertoe te treffen voorzieningen zijn.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: '6.6'
    text: |-
      Voorzover het een melding betreft als bedoeld in het tweede lid, is het overleggen van een rapport van een
      akoestisch onderzoek alleen vereist, indien een beoogde uitbreiding of een verandering van de inrichting of het
      veranderen van de werking daarvan naar verwachting van nadelige invloed kan zijn op de geluidbelasting die door de
      inrichting wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: '6.7'
    text: |-
      Indien bij de melding geen rapport van een akoestisch onderzoek is gevoegd, kan het bevoegd gezag besluiten dat het
      overleggen van een zodanig rapport niet is vereist, indien aannemelijk is dat het geluidniveau en de piekniveaus,
      veroorzaakt door de inrichting, niet meer bedragen dan de waarden, bedoeld in voorschrift 1.1.1 of 1.1.3 van de
      bijlage.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: '6.8'
    text: |-
      Bij de melding wordt een rapport van een onderzoek naar de nulsituatie van de bodem gevoegd. Het onderzoek naar
      de nulsituatie richt zich uitsluitend op de stoffen die door de werkzaamheden ter plaatse een bedreiging voor de
      bodemkwaliteit vormen en op de plaatsen waar bodembedreigende handelingen plaatsvinden dan wel zullen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: '6.9'
    text: |-
      Indien bij de melding geen rapport van een onderzoek naar de nulsituatie van de bodem is gevoegd, kan het bevoegd
      gezag besluiten dat een zodanig onderzoek niet is vereist, indien het aannemelijk is dat de kans op toekomstige
      bodemverontreiniging afwezig is.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: '6.10'
    text: |-
      De in het derde tot en met het vijfde lid en in het achtste lid vermelde gegevens behoeven niet te worden verstrekt
      indien het bevoegd gezag reeds over die gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: '6.11'
    text: |-
      Degene die de melding doet, geeft bij de melding aan welke van de ingevolge dit artikel over te leggen gegevens hij
      reeds aan het bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
  - number: '6.12'
    text: |-
      Bij de melding overeenkomstig [artikel 4, tweede lid][ref1], worden aan het bevoegd gezag gegevens verstrekt
      waaruit blijkt dat met de volgens die melding toe te passen andere middelen een ten minste gelijkwaardige
      bescherming voor het milieu wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011529#Artikel4
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011529
        artikel: '4'
  - number: '7.1'
    text: |-
      Voor een inrichting die op het tijdstip van inwerkingtreding van dit besluit reeds was opgericht en waarvoor
      onmiddellijk daaraan voorafgaand een vergunning in werking en onherroepelijk was, blijven de voorschriften van
      die vergunning in verbinding met de gegevens die behoren bij de aanvraag, alsmede de aanvraag voorzover die deel
      uitmaakt van de vergunning en gegevens bevat die zich lenen voor opname of omzetting in voorschriften, gelden
      als nadere eis, bedoeld in [artikel 5][ref1], behoudens eerdere wijziging of intrekking van die voorschriften,
      gedurende drie jaar na het tijdstip van het van toepassing worden van dit besluit op die inrichting, mits het
      voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011529#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011529#Artikel5
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011529
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011529
        artikel: '5'
  - number: '7.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de
      vergunning dan wel krachtens het Besluit houtbewerkende bedrijven milieubeheer, blijven gelden als nadere eis,
      bedoeld in [artikel 5][ref1], na het tijdstip van de inwerkingtreding van dit besluit, mits het voorschrift
      betrekking heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011529#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011529#Artikel5
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011529
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011529
        artikel: '5'
  - number: '8.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een inrichting reeds is opgericht en voor die
      inrichting onmiddellijk voor dat tijdstip geen vergunning in werking en onherroepelijk was of geen melding was
      gedaan krachtens het Besluit houtbewerkende bedrijven milieubeheer, meldt degene die de inrichting drijft, aan het
      bevoegd gezag dat hij de inrichting in werking heeft.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel8
  - number: '8.2'
    text: |-
      De melding geschiedt ten hoogste twaalf weken na het tijdstip waarop dit besluit in werking treedt.
      [Artikel 6, derde tot en met elfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011529#Artikel6
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011529
        artikel: '6'
  - number: '8.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een aanvraag om een vergunning voor het oprichten van
      de inrichting door het bevoegd gezag in behandeling is genomen en dit besluit op de inrichting van toepassing is
      of zal zijn, zijn het eerste en tweede lid niet van toepassing. De aanvraag om de vergunning wordt in dat geval
      aangemerkt als een melding overeenkomstig [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011529#Artikel6
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011529
        artikel: '6'
  - number: '9.1'
    text: Het Besluit houtbewerkende bedrijven milieubeheer wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel9
  - number: '9.2'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling slibvangputten en vet- of olie-afscheiders mede op het in
      de bijlage opgenomen voorschrift 1.3.13, onder c en d.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking met ingang van 1 december 2000.
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit bouw- en houtbedrijven milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel11
