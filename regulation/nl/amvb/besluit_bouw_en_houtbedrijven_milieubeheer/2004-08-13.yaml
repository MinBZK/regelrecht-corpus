      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.c
