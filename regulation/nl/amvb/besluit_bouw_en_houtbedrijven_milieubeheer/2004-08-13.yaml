    text: 'piekniveau (LAmax): maximaal geluidniveau gemeten in de meterstand «F» of «fast»;'
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel1
  - number: 1.k
    text: |-
      stankgevoelig object: woning, school, ziekenhuis, bejaardencentrum, hotel, restaurant of recreatie-inrichting,
      voedings- en genotmiddelenindustrie, detailhandel in voedings- en genotmiddelen, kantoorgebouw met meer dan 50
      werknemers, opslag van voedings- en genotmiddelen;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel1
  - number: 1.l
    text: |-
      organisch oplosmiddel: een vluchtige organische verbinding die alleen of in combinatie met andere stoffen en zonder
      chemische verandering te ondergaan, wordt gebruikt om grondstoffen, producten of afvalmaterialen op te lossen, dan
      wel wordt toegepast als schoonmaakmiddel, als verdunner, als dispergeermiddel, als middel om de viscositeit aan te
      passen, als weekmaker of als conserveermiddel;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel1
  - number: 1.m
    text: |-
      CPR 11–5: Richtlijn 11–5 van de CPR, getiteld «Propaan, vulstations van butaan- en propaanflessen», eerste druk,
      uitgave 1994;
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel1
  - number: 1.n
    text: |-
      vuurwerk: vuurwerk in de zin van het [Vuurwerkbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel1
