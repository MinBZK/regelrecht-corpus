  - number: 1.a
    text: |-
      bevoegd gezag: bestuursorgaan dat bevoegd zou zijn een vergunning te verlenen voor een inrichting als bedoeld in
      [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011529#Artikel2
    url: https://wetten.overheid.nl/BWBR0011529/2004-08-13#Artikel1
    references:
