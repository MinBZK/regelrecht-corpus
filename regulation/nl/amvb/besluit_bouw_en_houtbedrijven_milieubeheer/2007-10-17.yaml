articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. andere geluidsgevoelige gebouwen: andere geluidsgevoelige gebouwen als bedoeld in
      [artikel 1 van de Wet geluidhinder][ref1];

      b. bevoegd gezag: bestuursorgaan dat bevoegd zou zijn een vergunning te verlenen voor een inrichting als bedoeld
      in [artikel 2][ref2];

      c. vergunning: vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref3];

      d. bijlage: de bij dit besluit behorende bijlage;

      e. brandbare vloeistof: stof in vloeibare toestand die een vlampunt heeft dat hoger ligt dan 55° C (K3-vloeistof);

      f. gevaarlijke stof: stof die of preparaat dat bij of krachtens het
      [Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref4] is ingedeeld in een categorie als
      bedoeld in [artikel 34, tweede lid, van de Wet milieugevaarlijke stoffen][ref5];

      g. geluidniveau: niveau van het ter plaatse optredende geluid, uitgedrukt in dB(A), overeenkomstig de door de
      Internationale Electrotechnische Commissie (IEC) opgestelde regels, zoals neergelegd in de IEC-publicatie nr. 651,
      uitgave 1979;

      h. langtijdgemiddeld beoordelingsniveau (LAr, LT): gemiddelde van de afwisselende niveaus van het ter plaatse
      optredende geluid, gemeten in de loop van een bepaalde periode en vastgesteld en beoordeeld overeenkomstig de
      «Handleiding meten en rekenen industrielawaai», uitgave 1999;

      i. woning: gebouw of gedeelte van een gebouw dat voor bewoning wordt gebruikt of daartoe is bestemd, met
      uitzondering van een dienst- of bedrijfswoning:

      1°. behorende bij een inrichting als bedoeld in [artikel 2][ref6], of

      2°. die op een bedrijventerrein is gelegen met een gemiddelde dichtheid aan dienst- of bedrijfswoningen van ten
      hoogste één per hectare;

      j. geluidsgevoelige terreinen: geluidsgevoelige terreinen als bedoeld in [artikel 1 van de Wet geluidhinder][ref7];

      k. piekniveau (LAmax): maximaal geluidniveau gemeten in de meterstand «F» of «fast»;

      l. stankgevoelig object: woning, school, ziekenhuis, bejaardencentrum, hotel, restaurant of recreatie-inrichting,
      voedings- en genotmiddelenindustrie, detailhandel in voedings- en genotmiddelen, kantoorgebouw met meer dan 50
      werknemers, opslag van voedings- en genotmiddelen;

      m. organisch oplosmiddel: een vluchtige organische verbinding die alleen of in combinatie met andere stoffen
      en zonder chemische verandering te ondergaan, wordt gebruikt om grondstoffen, producten of afvalmaterialen op
      te lossen, dan wel wordt toegepast als schoonmaakmiddel, als verdunner, als dispergeermiddel, als middel om de
      viscositeit aan te passen, als weekmaker of als conserveermiddel;

      n. CPR 11–5: Richtlijn 11–5 van de CPR, getiteld «Propaan, vulstations van butaan- en propaanflessen», eerste druk,
      uitgave 1994;

      o. vuurwerk: vuurwerk in de zin van het [Vuurwerkbesluit][ref8].

      p. kunststofverwerking: toepassing van ten minste één van de volgende verwerkingstechnieken: blazen, extrusie,
      spuitgieten, thermovormen, schuimen, open maltechniek, gesloten maltechniek, vezelspuiten, agglomereren,
      expanderen, kalanderen, na-condenseren, pull trusion, rotatiegieten en vulkaniseren, en

      q. kunststofbewerking: toepassing van de volgende bewerkingstechnieken: boren, frezen, verspanen, draaien, zagen,
      snijden, stansen, tappen, slijpen, polijsten, lassen, lijmen, kitten en snijden.


