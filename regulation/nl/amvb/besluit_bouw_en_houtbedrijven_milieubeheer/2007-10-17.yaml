      1 Dit besluit is van toepassing op een inrichting die uitsluitend of in hoofdzaak is bestemd voor:

      a. het vervaardigen, bewerken, verwerken of opslaan van hout of kurk dan wel van houten, kurken of houtachtige
      voorwerpen;

      b. het bewerken van kunststof of kunststof voorwerpen;

      c. het ten behoeve van het bouwen, verbouwen of herstellen op locatie van woningen, woongebouwen of
      utiliteitsgebouwen opslaan van bouwstoffen, preparaten, producten of bouwmaterialen en het voor directe toepassing
      of verwerking geschikt maken daarvan, of

      d. het aanbrengen, herstellen of onderhouden van technische installaties, toestellen of voorzieningen aan of in
      woningen, woongebouwen of utiliteitsgebouwen.

      2 Dit besluit is eveneens van toepassing op inrichtingen waarin uitsluitend of in hoofdzaak sprake is van een
      samenstel van bedrijvigheden als bedoeld in het eerste lid, onder a tot en met d.
    url: https://wetten.overheid.nl/BWBR0011529/2007-10-17#Artikel2
  - number: '3'
    text: |-
      1 Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], indien:

      a. in de inrichting één of meer stooktoestellen voor verwarming of warmtekrachtopwekking aanwezig zijn met een
      thermisch vermogen per toestel van 7500 kW of meer;

      b. in de inrichting een of meer installaties of voorzieningen aanwezig zijn die kunnen worden gebruikt voor het
      verstoken of verbranden van andere brandstoffen dan aardgas, propaangas, butaangas of gasolie;

      c. in de inrichting koel- en vriesinstallaties of warmtepompen aanwezig zijn met een capaciteit of een totale
      capaciteit van meer dan 200 kg ammoniak of van meer dan 100 kg propaan, butaan of mengsels van propaan en butaan;

      d. in de inrichting afvalstoffen worden op- of overgeslagen die niet binnen de bedrijfseigen activiteiten zijn
      ontstaan voorzover de inrichting beschikt over een capaciteit:

      1°. van meer dan 35 m3 voor de opslag van afvalstoffen;

      2°. voor de opslag van gevaarlijke afvalstoffen, of

      3°. van meer dan 1000 m3 per jaar voor de overslag van afvalstoffen;

      e. in de inrichting meer dan in totaal 10 000 kg aan gevaarlijke stoffen wordt opgeslagen;

      f. in de inrichting voorzieningen of installaties aanwezig zijn voor het afleveren van:

      1°. LPG, of

      2°. andere brandstoffen die niet in hoofdzaak worden gebruikt ten behoeve van transportmiddelen voor eigen gebruik;

      g. in de inrichting vloeibare gevaarlijke stoffen, vloeibare gevaarlijke afvalstoffen of brandbare vloeistoffen in
      tanks worden op- of overgeslagen, tenzij sprake is van:

      1°. opslag in ondergrondse tanks, waarop het [Besluit opslaan in ondergrondse tanks 1998][ref2] van toepassing
      is, of

      2°. opslag van brandbare vloeistoffen in bovengrondse tanks;

      h. in de inrichting gassen of gasmengsels in tanks worden opgeslagen, tenzij sprake is van opslag waarop het
      [Besluit voorzieningen en installaties milieubeheer][ref3] van toepassing is;

      i. in de inrichting meer dan 400 kg gewasbeschermingsmiddelen of biociden als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref4] worden opgeslagen;

      j. in de inrichting voorzieningen of installaties aanwezig zijn voor:

      1°. het vervaardigen van producten van houtmeel-, houtwol- of houtvezels;

      2°. het vervaardigen van triplex-, fineer-, vezel- of spaanplaten;

      3°. het galvaniseren of thermisch verzinken van materialen;

      4°. het vervaardigen, onderhouden of herstellen van motorvoertuigen of schepen;

      5°. het impregneren van hout door middel van spuiten, sproeien of de vacuümdrukmethode;

      6°. het verbranden van hout of houtmot;

      7°. het toepassen van kunststofverwerkingstechnieken, of

      8°. het vullen van gasflessen door middel van een vulstation anders dan de in richtlijn CPR 11–5 opgenomen type A
      of type B vulstations;

      k. in de inrichting jaarlijks meer dan 15 000 kg organische oplosmiddelen worden verbruikt en

      l. de inrichting of een onderdeel daarvan is ingericht voor de opslag van vuurwerk, tenzij met inachtneming van
      [artikel 2.2.1, eerste lid, van het Vuurwerkbesluit][ref5] ten hoogste 1000 kilogram consumentenvuurwerk wordt
      opgeslagen.

      2 Dit besluit is eveneens niet van toepassing indien het emissiepunt van een verfverwerkings- of dompelruimte
      is gelegen op minder dan 50 meter van een stankgevoelig object, met uitzondering van die situaties waarvoor
      onmiddellijk voorafgaand aan 1 december 2000 een vergunning nog in werking en onherroepelijk was.


