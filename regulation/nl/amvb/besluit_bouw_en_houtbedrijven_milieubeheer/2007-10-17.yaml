  - number: '8'
    text: |-
      1 Indien op het tijdstip waarop dit besluit in werking treedt, een inrichting reeds is opgericht en voor die
      inrichting onmiddellijk voor dat tijdstip geen vergunning in werking en onherroepelijk was of geen melding was
      gedaan krachtens het Besluit houtbewerkende bedrijven milieubeheer, meldt degene die de inrichting drijft, aan het
      bevoegd gezag dat hij de inrichting in werking heeft.

      2 De melding geschiedt ten hoogste twaalf weken na het tijdstip waarop dit besluit in werking treedt.
      [Artikel 6, derde tot en met elfde lid][ref1], is van overeenkomstige toepassing.

      3 Indien op het tijdstip waarop dit besluit in werking treedt, een aanvraag om een vergunning voor het oprichten
      van de inrichting door het bevoegd gezag in behandeling is genomen en dit besluit op de inrichting van toepassing
      is of zal zijn, zijn het eerste en tweede lid niet van toepassing. De aanvraag om de vergunning wordt in dat geval
      aangemerkt als een melding overeenkomstig [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011529#Artikel6
