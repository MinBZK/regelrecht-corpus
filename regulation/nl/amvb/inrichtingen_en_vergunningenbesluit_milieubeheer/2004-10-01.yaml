  - number: 7.4.d
    text: |-
      gedeputeerde staten van een provincie, waarin een gemeente is gelegen, waarvan burgemeester en wethouders ingevolge
      onderdeel c betrokken overheidsorgaan zijn;
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel7.4
  - number: 7.4.e
    text: |-
      gedeputeerde staten van de provincie Zuid-Holland, indien de aanvraag betrekking heeft op een inrichting voor het
      op of in de zeebodem brengen van baggerspecie om deze daar te laten, die is gelegen binnen het gebied dat door
      arcering is aangegeven op de kaart die is opgenomen in bijlage IV.
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel7.4
  - number: '8.1'
    text: |-
      Het bevoegd gezag zendt in een geval als bedoeld in artikel 5.14 met het oog op de voorbereiding van de bestrijding
      van rampen en zware ongevallen een exemplaar van de schriftelijke samenvatting van de risico-analyse aan:
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.1
  - number: 8.1.a
    text: de burgemeester van de gemeente waarin de inrichting geheel of in hoofdzaak zal zijn of is gelegen;
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.1
  - number: 8.1.b
    text: de commissaris van de Koning in de provincie waarin een gemeente als bedoeld onder *a* is gelegen;
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.1
  - number: 8.1.c
    text: het bestuur van de regionale brandweer waarin een gemeente als bedoeld onder *a* is gelegen.
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.1
  - number: 8.2.1
    text: |-
      Het bevoegd gezag zendt in een geval als bedoeld in de artikelen 5.15 en 5.17 met het oog op de voorbereiding van
      de bestrijding van rampen en zware ongevallen de daar bedoelde onderdelen van het veiligheidsrapport en, indien
      tijdens de behandeling van de aanvraag een aanvulling op het veiligheidsrapport is ontvangen, deze aanvulling aan:
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.2
  - number: 8.2.1.a
    text: |-
      de burgemeester van de gemeenten waarvan het grondgebied is gelegen binnen de lijn van 10-8 individueel risico,
      bedoeld in [bijlage III, onder 2, onder c, van het Besluit risico's zware ongevallen 1999][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 8.2.1.b
    text: |-
      de commissaris van de Koningin in de provincie waarin een gemeente is gelegen waarin de inrichting geheel of
      gedeeltelijk zal zijn of is gelegen;
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.2
  - number: 8.2.1.c
    text: de commissaris van de Koningin in de provincie waarin een gemeente als bedoeld onder a is gelegen;
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.2
  - number: 8.2.1.d
    text: het bestuur van de regionale brandweer binnen wier gebied een gemeente als bedoeld onder a of c is gelegen.
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.2
  - number: 8.2.2
    text: Het bevoegd gezag zendt een exemplaar van de stukken, bedoeld in het eerste lid, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.2
  - number: 8.2.3
    text: |-
      Onze Minister zendt een exemplaar van de stukken, bedoeld in het eerste lid, indien de lijn van 10-8 individueel
      risico, bedoeld in [bijlage III, onder 2, onder c, van het Besluit risico's zware ongevallen 1999][ref1] zich
      uitstrekt over het grondgebied van een andere staat, aan die staat. In dat geval zendt hij tevens een exemplaar aan
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties. In afwijking van de eerste volzin zendt Onze Minister,
      indien krachtens [artikel 19.3 van de wet][ref2] een tweede tekst is overgelegd, een exemplaar van deze tekst aan
      de betrokken staat.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0010475
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '19'
  - number: '8.3'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting, die behoort tot een categorie, die is genoemd in bijlage
      I, onder 28.4 onder *a*, 5°, onder *c*, 2°, onder *e*, 3°, of onder *f*, 3°, zendt het bevoegd gezag, tenzij de
      vergunning is geweigerd, tegelijk met de toezending van de beschikking aan de betrokken andere bestuursorganen,
      overeenkomstig [artikel 3:44, eerste lid, van de Algemene wet bestuursrecht][ref1], Onze Minister de aanvraag en de
      beschikking daarop, voor zover deze het beheren van gevaarlijke afvalstoffen betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '8.4'
    text: |-
      Indien een inrichting belangrijke nadelige gevolgen voor het milieu in een andere lid-staat van de Europese Unie
      kan veroorzaken, dan wel indien een andere lid-staat van de Europese Unie die belangrijke nadelige gevolgen voor
      het milieu van een inrichting kan ondervinden daarom verzoekt, verstrekt het bevoegd gezag de aanvraag met de
      daarbij behorende stukken aan die lid-staat op het tijdstip waarop daarvan in Nederland kennis wordt gegeven dan
      wel de aanvraag met de daarbij behorende stukken in Nederland ter inzage wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel8.4
  - number: '9.1'
    text: |-
