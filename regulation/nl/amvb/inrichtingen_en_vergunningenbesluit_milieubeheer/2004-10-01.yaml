    url: https://wetten.overheid.nl/BWBR0005829/2004-10-01#Artikel7.4
  - number: 7.4.b
    text: |-
      burgemeester en wethouders van de gemeenten, waarvan de grens is gelegen op meer dan 200 meter en minder dan 10
