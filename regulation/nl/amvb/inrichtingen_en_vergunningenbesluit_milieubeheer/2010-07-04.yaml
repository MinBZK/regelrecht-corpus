  - number: 1.a
    text: |-
      de wet: de [Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 1.b
    text: |-
      vergunning: een vergunning als bedoeld in [artikel 8.1 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.c
    text: 'bijlage: bij dit besluit behorende bijlage;'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
  - number: 1.d
    text: |-
      bodem: hetgeen daaronder wordt verstaan in [artikel 1 van de Wet bodembescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel1
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
    references:
      - id: ref1
