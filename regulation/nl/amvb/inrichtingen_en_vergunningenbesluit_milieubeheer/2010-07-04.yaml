        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020724
        artikel: '4'
  - number: 5.17b.2
    text: |-
      Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de werking daarvan, als bedoeld in
      [artikel 8.1, eerste lid, onderdeel b, van de wet][ref1], vermeldt de aanvrager in of bij de aanvraag onverminderd
      hetgeen is bepaald in enig ander artikel van dit hoofdstuk, herziene gegevens als bedoeld in [artikel 5.15c][ref2],
      eerste lid, voor zover de herziening van die gegevens nodig is voor het nemen van een beslissing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005829#Artikel5
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.17b
    references:
      - id: ref1
