preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 23 december 1991,
    nr. MJZ 23d91011, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Gelet op de artikelen 1.1, derde en vijfde lid, 8.2, tweede lid, 8.5, 8.7, eerste en derde lid, 8.19, derde lid,
    8.35, eerste lid, 8.44, derde lid, en 21.7 van de Wet milieubeheer en, voor zover het betreft artikel 2.4 van dit
    besluit, op artikel 41 van de Wet geluidhinder;

    De Raad van State gehoord (adviezen van 3 november 1992, no. W08.91.0724 en van 4 december 1992, no. W08.92.0315);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 30
    december 1992, nr. MJZ30d92043, Centrale Directie Juridische Zaken, afdeling Wetgeving, en het nader rapport van
    Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 30 december 1992, nr. MJZ30d92044,
    Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
