        bwb_id: BWBR0010475
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '19'
  - number: '8.4'
    text: |-
      Indien een inrichting belangrijke nadelige gevolgen voor het milieu in een andere lid-staat van de Europese Unie
      kan veroorzaken, dan wel indien een andere lid-staat van de Europese Unie die belangrijke nadelige gevolgen voor
      het milieu van een inrichting kan ondervinden daarom verzoekt, verstrekt het bevoegd gezag de aanvraag met de
      daarbij behorende stukken aan die lid-staat op het tijdstip waarop daarvan in Nederland kennis wordt gegeven dan
      wel de aanvraag met de daarbij behorende stukken in Nederland ter inzage wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel8.4
  - number: 8a.1
    text: |-
      Het bevoegd gezag, dan wel, in gevallen waarin een vergunning krachtens [artikel 6.2 van de Waterwet][ref1]
      is aangevraagd, het bestuursorgaan dat bevoegd is die vergunning te verlenen, geeft in ieder geval toepassing,
      onderscheidenlijk overeenkomstige toepassing aan het bepaalde in [artikel 8.22, eerste lid, van de wet][ref2]
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel8a.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 8a.1.a
    text: |-
      de door de inrichting of onderdelen daarvan veroorzaakte verontreiniging van dien aard is dat de
      emissiegrenswaarden die zijn vastgesteld in de aan de vergunning verbonden voorschriften, gewijzigd moeten worden
      of daarin nieuwe emissiegrenswaarden vastgesteld moeten worden;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel8a.1
  - number: 8a.1.b
    text: |-
      belangrijke veranderingen in de beste beschikbare technieken een aanmerkelijke beperking van de emissies zonder
      buitensporige kosten mogelijk maken;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel8a.1
  - number: 8a.1.c
    text: |-
      de noodzaak om ongevallen te voorkomen en de gevolgen daarvan voor het milieu te beperken de toepassing van andere
      technieken vereist.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel8a.1
