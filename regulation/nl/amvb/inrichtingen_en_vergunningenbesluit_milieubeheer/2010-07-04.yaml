  - number: 1.e
    text: |-
      genetische modificatie, micro-organismen, organismen en genetisch gemodificeerde organismen: hetgeen daaronder
      wordt verstaan in het [Besluit genetisch gemodificeerde organismen milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004703
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004703
  - number: 1.f
    text: |-
      regionaal openbaar lichaam: een regionaal openbaar lichaam als bedoeld in de
      [Kaderwet bestuur in verandering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006620
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006620
  - number: 1.g
    text: 'dagelijks bestuur: dagelijks bestuur van een regionaal openbaar lichaam;'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
  - number: 1.h
    text: |-
      samenwerkingsgebied: een samenwerkingsgebied als bedoeld in de [Kaderwet bestuur in verandering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006620
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006620
  - number: 1.i
    text: |-
      autowrak: motorrijtuig op meer dan twee wielen dat een afvalstof is in de zin van
      [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.j
    text: |-
      groepsrisico: cumulatieve kansen per jaar dat ten minste 10, 100 of 1000 personen overlijden als rechtstreeks
      gevolg van hun aanwezigheid in het invloedsgebied van een inrichting en een ongewoon voorval binnen die inrichting
      waarbij een gevaarlijke stof betrokken is;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
  - number: 1.k
    text: |-
      plaatsgebonden risico: risico op een plaats buiten een inrichting, uitgedrukt als de kans per jaar dat een persoon
      die onafgebroken en onbeschermd op die plaats zou verblijven, overlijdt als rechtstreeks gevolg van een ongewoon
      voorval binnen die inrichting waarbij een gevaarlijke stof betrokken is;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
  - number: 1.l
    text: |-
      invloedsgebied: gebied waarin volgens door Onze Minister bij ministeriële regeling op grond van
      [artikel 15, eerste lid, van het Besluit externe veiligheid inrichtingen][ref1] te stellen regels personen worden
      meegeteld voor de berekening van het groepsrisico.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel15
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '15'
  - number: 2.1.1
    text: |-
      Als categorieën van inrichtingen als bedoeld in artikel 1.1, derde lid, van de wet, die nadelige gevolgen voor het
      milieu kunnen veroorzaken, worden aangewezen de categorieën van inrichtingen, die in bijlage I zijn genoemd.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel2.1
  - number: 2.1.2
    text: |-
      In afwijking van het eerste lid heeft de aanwijzing geen betrekking op inrichtingen voor de uitoefening van
      detailhandel, voor zover die aanwijzing uitsluitend zou gelden omdat in de inrichting stoffen, preparaten of andere
      produkten worden op- of overgeslagen, die zijn genoemd in bijlage I, onder de categorieën 4.1, onder *b* tot en met
      *f*, 6.1, 8.1, 9.1, 11.1, met uitzondering van asbest of asbesthoudende produkten, 12.1, 15 of 16.1.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel2.1
  - number: '2.2'
    text: |-
      Als categorieën van inrichtingen als bedoeld in [artikel 8.17, tweede lid, van de wet][ref1],
      worden aangewezen de categorieën van inrichtingen die zijn genoemd in
      [bijlage I, onder 28.4, onder a tot en met d en onder g, 28.5 en 28.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005829
  - number: 2.4.1
    text: |-
      Als categorie van inrichtingen als bedoeld in [artikel 41, derde lid, van de Wet geluidhinder][ref1], die
      in belangrijke mate geluidhinder kunnen veroorzaken, worden aangewezen de categorieën van inrichtingen
      die zijn genoemd in bijlage I, onder: 1.3, onder *a*, *b*, voor zover het thermisch vermogen 75 MW of meer
      bedraagt, *c*, 1° en 2°, en *d*, waarbij voor de toepassing van onderdeel 1.3 veiligheidsfakkels ten behoeve
      van de opsporing of winning van aardgas buiten beschouwing blijven, 2.6, onder *b*, voor zover het betreft
      aardgasbehandelingsinstallaties bij aardgaswinputten en gasverzamelinrichtingen, en *c*, 4.3, onder *d*, 5.3, onder
      *b*, 6.2, 9.3, 11.3, onder *a* tot en met *e*, onder *g* en onder *k*, 12.2, onder *a* tot en met *g*, 12.2, onder
      *h*, voor zover het smeltpunt van de metalen of hun legeringen hoger is dan 800 K, 13.3, onder *b*, 14.2, voor
      zover een rangeerheuvel aanwezig is, 16.2, 19.2, 20.1, onder *b*, 24.2 en 27.3.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel41
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '41'
  - number: 2.4.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel 1.3, onder b, voor zover het thermisch vermogen 75 MW of
      meer bedraagt, blijven buiten beschouwing inrichtingen voor het verstoken van biomassa waarvan het equivalente
      geluidsniveau (LAr, LT), veroorzaakt door de in de inrichting aanwezige vast opgestelde toestellen en installaties,
      alsmede door de in de inrichting verrichte werkzaamheden en activiteiten op de grens van het bedrijventerrein niet
      meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel2.4
  - number: 2.4.2.a
    text: 50 dB(A) tussen 07.00 en 19.00 uur;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel2.4
  - number: 2.4.2.b
    text: 45 dB(A) tussen 19.00 en 23.00 uur;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel2.4
  - number: 2.4.2.c
    text: 40 dB(A) tussen 23.00 en 07.00 uur.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel2.4
  - number: '3.1'
    text: |-
      Gedeputeerde staten van de provincie waarin de inrichting geheel of in hoofdzaak zal zijn of is gelegen, zijn
      bevoegd te beslissen op de aanvraag om een vergunning ten aanzien van inrichtingen die behoren tot een categorie
      die daartoe in bijlage I is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel3.1
  - number: '3.2'
    text: |-
      Onze Minister is bevoegd te beslissen op de aanvraag om een vergunning ten aanzien van inrichtingen die behoren tot
      een categorie die in bijlage II is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel3.2
  - number: 3.3.1
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd, in overeenstemming met Onze Minister, te beslissen op
      de aanvraag om een vergunning ten aanzien van inrichtingen die behoren tot een categorie die in bijlage I is
      aangewezen en die zijn of zullen zijn gelegen op of in de territoriale zee op een plaats die niet deel uitmaakt van
      een gemeente of provincie.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel3.3
  - number: 3.3.2
    text: |-
      In afwijking van het eerste lid, is Onze Minister van Economische Zaken bevoegd te beslissen op een aanvraag om
      een vergunning voor een inrichting die een krachtens [artikel 1, onder n, van de Mijnbouwwet](onbekend) aangewezen
      mijnbouwwerk is, voor zover het niet betreft de ondergrondse gelegen inrichting voor het opslaan van afvalstoffen
      die van buiten het betrokken mijnbouwwerk afkomstig zijn, dan wel gevaarlijke stoffen.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel3.3
  - number: 4.1.1
    text: |-
      De aanvraag om een vergunning wordt in viervoud ingediend, indien zij betrekking heeft op een inrichting waarvoor
      burgemeester en wethouders bevoegd zijn te beslissen op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel4.1
  - number: 4.1.2
    text: |-
      De aanvraag om een vergunning wordt in zesvoud bij het bevoegde gezag ingediend, indien zij betrekking heeft op een
      inrichting waarvoor het dagelijks bestuur, gedeputeerde staten, Onze Minister, Onze Minister van Economische Zaken
      of Onze Minister van Verkeer en Waterstaat bevoegd zijn te beslissen op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel4.1
  - number: 4.1.3
    text: |-
      In gevallen waarin bij de [artikelen 7.1][ref1], dan wel [7.2][ref2] of [7.3][ref3] van dit besluit meer dan een,
      onderscheidenlijk drie adviseurs en betrokken bestuursorganen zijn aangewezen, verstrekt de aanvrager op verzoek
      van het bevoegd gezag even zoveel meer exemplaren van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005829#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005829#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005829#Artikel7
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005829
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0005829
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0005829
        artikel: '7'
        hoofdstuk: '7'
  - number: '4.2'
    text: |-
      De bij de vergunningaanvraag behorende stukken worden door of namens de aanvrager gekenmerkt als behorende tot
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel4.2
  - number: 5.1.1
    text: |-
      In of bij de aanvraag om een vergunning voor het oprichten of het in werking hebben van een inrichting als bedoeld
      in [artikel 8.1, eerste lid, onder a en c, van de wet][ref1], vermeldt de aanvrager:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 5.1.1.a
    text: zijn naam en adres;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.b
    text: het adres, de kadastrale aanduiding en de ligging van de inrichting;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.c
    text: de aard van de inrichting;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.d
    text: |-
      de indeling, de uitvoering, de activiteiten en de processen in de inrichting en de ten behoeve daarvan toe
      te passen technieken of installaties, waaronder begrepen de wijze van energievoorziening, voor zover die
      redelijkerwijs van belang kunnen zijn voor de beoordeling van de nadelige gevolgen voor het milieu, die de
      inrichting kan veroorzaken;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.e
    text: |-
      de voor de activiteiten en de processen, bedoeld onder d, kenmerkende gegevens met betrekking tot grondstoffen,
      tussen-, neven- en eindproducten;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.f
    text: |-
      de maximale capaciteit van de inrichting en het maximale motorische of thermische vermogen van de tot de inrichting
      behorende installaties;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.g
    text: |-
      de tijden en dagen, dan wel perioden waarop de inrichting of de te onderscheiden onderdelen daarvan in bedrijf
      zullen zijn;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.h
    text: |-
      de aard en omvang van de belasting van het milieu die de inrichting tijdens normaal bedrijf kan veroorzaken,
      daaronder begrepen een overzicht van de belangrijke nadelige gevolgen voor het milieu die daardoor kunnen worden
      veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.i
    text: 'de maatregelen of voorzieningen ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.i.1°
    text: het voorkomen of beperken van het ontstaan van afvalstoffen in de inrichting;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.i.2°
    text: |-
      het nuttig toepassen dan wel het geschikt maken voor nuttig toepassing van de afvalstoffen die in de inrichting
      ontstaan;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.i.3°
    text: het opslaan van de afvalstoffen in de inrichting;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.i.4°
    text: het zich ontdoen van de afvalstoffen die in de inrichting ontstaan;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.j
    text: |-
      de andere maatregelen of voorzieningen die zijn of worden getroffen om de nadelige gevolgen voor het milieu die de
      inrichting kan veroorzaken, te voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.k
    text: |-
      de wijze waarop gedurende het in werking zijn van de inrichting de belasting van het milieu, die de inrichting
      veroorzaakt, wordt vastgesteld en geregistreerd, en
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.l
    text: |-
      de voor de aanvrager redelijkerwijs te verwachten ontwikkelingen met betrekking tot de inrichting die voor de
      beslissing op de aanvraag van belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.1.m
    text: |-
      voor zover het betreft inrichtingen waartoe gpbv-installaties behoren: een beknopte beschrijving van de
      belangrijkste door de aanvrager bestudeerde alternatieven, voor zover deze bestaan.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: 5.1.2
    text: De aanvraag gaat vergezeld van een niet-technische samenvatting van de in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.1
  - number: '5.2'
    text: |-
      Indien de inrichting waarvoor de vergunning wordt aangevraagd, naar haar aard tijdelijk is, vermeldt de aanvrager
      dit in de aanvraag. Hij vermeldt daarbij tevens zo mogelijk het tijdstip waarop de inrichting buiten werking zal
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.2
  - number: '5.3'
    text: |-
      In gevallen waarin de vergunning betrekking heeft op het oprichten van een inrichting, dat tevens is aan te merken
      als bouwen in de zin van de [Woningwet][ref1], verstrekt de aanvrager aan het bevoegd gezag:


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 5.3.a
    text: |-
      indien de aanvraag om bouwvergunning voor dat bouwen tegelijk met de aanvraag om de vergunning krachtens de wet
      wordt ingediend, een afschrift van die aanvraag om bouwvergunning bij zijn aanvraag;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.3
  - number: 5.3.b
    text: |-
      indien de aanvraag om bouwvergunning voor dat bouwen niet tegelijk met de aanvraag om de vergunning krachtens
      de wet wordt ingediend, een afschrift van die aanvraag om bouwvergunning gelijktijdig met de indiening van die
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.3
  - number: '5.4'
    text: |-
      Voor zover die gegevens nodig zijn voor de beslissing op de aanvraag, verstrekt de aanvrager bij de aanvraag
      gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.4
  - number: 5.4.a
    text: voorvallen, als bedoeld in artikel 17.1 van de wet, die redelijkerwijs mogelijk zijn te achten;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.4
  - number: 5.4.b
    text: de belasting van het milieu, die die voorvallen kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.4
  - number: 5.4.c
    text: de aard en de omvang van de bij die voorvallen te onderscheiden vormen van belasting van het milieu;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.4
  - number: 5.4.d
    text: |-
      de maatregelen die worden getroffen om de belasting van het milieu, die de inrichting ten gevolge van die
      voorvallen kan veroorzaken, te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.4
  - number: '5.5'
    text: |-
      Voor zover die gegevens nodig zijn voor de beslissing op de aanvraag, verstrekt de aanvrager op verzoek van het
      bevoegd gezag bij de aanvraag de resultaten van een onderzoek naar de kwaliteit van de bodem op de plaats waar de
      inrichting zal zijn of is gelegen.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.5
  - number: '5.6'
    text: |-
      Voor zover die gegevens nodig zijn voor de beslissing op de aanvraag, verstrekt de aanvrager op verzoek van het
      bevoegd gezag bij de aanvraag nadere gegevens.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.6
  - number: 5.7.1
    text: 'De in artikel 5.1, eerste lid, of 5.4 vermelde gegevens behoeven niet te worden verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.7
  - number: 5.7.1.a
    text: |-
      de aanvrager die gegevens reeds aan het bevoegd gezag heeft verschaft en het bevoegd gezag over die gegevens
      beschikt, dan wel
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.7
  - number: 5.7.1.b
    text: |-
      het bevoegd gezag op verzoek van de aanvrager heeft beslist dat verstrekking van die gegevens voor het nemen van
      een beslissing op de aanvraag niet nodig is.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.7
  - number: 5.7.2
    text: |-
      De aanvrager deelt in of bij de aanvraag mee ten aanzien van welke gegevens het eerste lid, onder *a*,
      onderscheidenlijk *b*, is toegepast.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.7
  - number: '5.8'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting, die behoort tot een of meer in deze paragraaf genoemde
      categorieën, verstrekt de aanvrager, onverminderd hetgeen is bepaald in enig ander artikel van dit hoofdstuk, de
      daarbij genoemde gegevens.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.8
  - number: 5.9.1
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting, die behoort tot een categorie, waarvoor gedeputeerde staten,
      Onze Minister, Onze Minister van Economische Zaken of Onze Minister van Verkeer en Waterstaat bevoegd zijn te
      beslissen op de aanvraag, vermeldt de aanvrager in of bij de aanvraag de maatregelen die worden getroffen om de
      belasting van het milieu, die de inrichting kan veroorzaken, te voorkomen of te beperken:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.9
  - number: 5.9.1.a
    text: |-
      tijdens het in werking zijn van de inrichting of de te onderscheiden onderdelen daarvan, waarbij, voor zover
      van toepassing, onderscheid wordt gemaakt tussen proefdraaien, normaal bedrijf, schoonmaak-, onderhouds- en
      herstelwerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.9
  - number: 5.9.1.b
    text: ten gevolge van voorvallen, als bedoeld in artikel 17.1 van de wet, die redelijkerwijs mogelijk zijn te achten.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.9
  - number: 5.9.2
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting waarvoor Onze Minister, Onze Minister van Economische Zaken
      of Onze Minister van Verkeer en Waterstaat bevoegd is te beslissen, kan hij bepalen dat het eerste lid buiten
      toepassing blijft, indien die gegevens niet nodig zijn voor de beslissing op de aanvraag gezien de aard of de
      omvang van de gevolgen die die inrichting voor het milieu kan veroorzaken.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.9
  - number: '5.10'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting, die behoort tot een categorie, die is genoemd in bijlage
      I, onder 11.1, 12.1, 13.1, onder *a*, 1° tot en met 3°, 17, onder *a*, 18 of 19, of die behoort tot een categorie,
      waarvoor gedeputeerde staten, Onze Minister, Onze Minister van Economische Zaken of Onze Minister van Verkeer en
      Waterstaat bevoegd zijn te beslissen op de aanvraag, vermeldt de aanvrager op verzoek van het bevoegd gezag in of
      bij de aanvraag:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.10
  - number: 5.10.a
    text: |-
      de aard van de geluiden en hoogte van de te verwachten geluidsbelasting welke de inrichting binnen een door het
      bevoegd gezag aangegeven gebied buiten de inrichting kan veroorzaken;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.10
  - number: 5.10.b
    text: de tijden waarop die geluidsbelasting zich zal voordoen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.10
  - number: 5.10.c
    text: de methode waarmee de aard van de geluiden en hoogte van de geluidsbelasting zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.10
  - number: '5.11'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting, die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 28.4 of 28.5][ref1], vermeldt de aanvrager in of bij de aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0005829
  - number: 5.11.a
    text: de aard, de samenstelling, de hoeveelheid en de herkomst van de inkomende afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.11
  - number: 5.11.b
    text: de procedures van acceptatie en controle van de inkomende afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.11
  - number: 5.11.c
    text: |-
      de wijze van financiering van de activiteiten, alsmede een schatting van de omvang van de investeringen die worden
      gedaan;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.11
  - number: 5.11.d
    text: |-
      de tarieven die de aanvrager voor het nuttig toepassen of verwijderen wil vaststellen alsmede de wijze waarop de
      tarieven zijn samengesteld;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.11
  - number: 5.11.e
    text: de beschikbaarheid en vakbekwaamheid van de in de inrichting werkzame personen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.11
  - number: 5.11.f
    text: de wijze waarop de inkomende afvalstoffen worden geregistreerd;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.11
  - number: 5.11.g
    text: |-
      de wijze waarop de bij het proces van nuttig toepassen of verwijderen ontstane stoffen, preparaten of andere
      producten of afvalstoffen worden afgezet, afgevoerd, nuttig toegepast of verwijderd, alsmede de wijze van
      registratie daarvan;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.11
  - number: 5.11.h
    text: |-
      de ondernemings- en organisatiestruktuur, alsmede de regeling van de feitelijke leiding van de activiteiten in
      de inrichting;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.11
  - number: 5.11.i
    text: de naam en het adres van degene die de feitelijke leiding van de activiteiten heeft in de inrichting.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.11
  - number: '5.12'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie, die is genoemd in bijlage I,
      onder 28.6, vermeldt de aanvrager in of bij de aanvraag de aard, de samenstelling, de hoeveelheid en de herkomst
      van de betrokken afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.12
  - number: 5.13.1
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 28.1, onder c, onder 28.4, onder f, of 28.4, onder g][ref1], in gevallen waarin sprake is van het
      storten van afvalstoffen, vermeldt de aanvrager in of bij de aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0005829
  - number: 5.13.1.a
    text: de kwaliteit van de bodem op de plaats waar de inrichting zal zijn of is gelegen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.1.b
    text: |-
      de bodemkundige gesteldheid en geohydrologische omstandigheden op de plaats waar de inrichting zal zijn of is
      gelegen, waaronder ten minste gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.1.b.1°
    text: |-
      voor zover van toepassing de gemiddelde grondwaterstand, vastgesteld door metingen volgens de door het Nederlands
      Normalisatie Instituut uitgeven norm NEN 5766, uitgave 1990, welke metingen tenminste tweemaal per maand op de 14e
      en 28e van die maand, gedurende een periode van tenminste een jaar voorafgaand aan de indiening van de aanvraag
      zijn verricht;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.1.b.2°
    text: de grondwaterstroming;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.1.b.3°
    text: de doorlatendheid, dikte, samenstelling en zetting van de bodemlagen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.1.c
    text: |-
      de vormen van belasting van het milieu alsmede de aard, de omvang en de duur daarvan die de inrichting naar
      verwachting kan veroorzaken na de beëindiging van de werking van de inrichting of de sluiting daarvan;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.1.d
    text: |-
      de wijze waarop na beëindiging van het op of in de bodem brengen van de afvalstoffen het milieuhygiënische beheer
      van die stoffen en van de milieubeschermende voorzieningen is geregeld;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.1.e
    text: |-
      een exploitatie-, toezicht- en controleplan dat ten minste de gegevens, bedoeld in de
      [onderdelen d, e, f, g en k van artikel 5.1][ref1], alsmede de gegevens, bedoeld in de
      [onderdelen a tot en met h van artikel 5.11][ref2], bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0005829#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005829#Artikel5
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0005829
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005829
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.13.2
    text: |-
      In of bij een aanvraag die betrekking heeft op een inrichting als bedoeld in het eerste lid, toont de aanvrager aan
      dat financiële zekerheid is of wordt gesteld, voor het nakomen van de voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.2.a
    text: de bovenafdichting van een stortplaats, niet zijnde een stortplaats waar uitsluitend baggerspecie wordt gestort;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.2.b
    text: |-
      het zo nodig aanbrengen van een geohydrologisch isolatiesysteem, of het zo nodig aanbrengen van een afdeklaag op
      een stortplaats, zijnde een stortplaats waar uitsluitend baggerspecie wordt gestort.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.3
    text: |-
      Indien een gemeente-, een provincie-, of een waterschapsbestuur, dan wel het Rijk, vergunninghouder zal zijn,
      kan in afwijking van het tweede lid in plaats van het stellen van financiële zekerheid een daaraan gelijkwaardige
      voorziening zijn of worden getroffen.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.4
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting als bedoeld in het eerste lid in gevallen waarin sprake is
      van het storten van afvalstoffen in de diepe ondergrond, gaat zij tevens vergezeld van een rapport, inhoudende
      een veiligheidsbeoordeling die voldoet aan onderdeel 2.5 van de bijlage bij de beschikking nr. 2003/33/EG van de
      Raad van de Europese Unie van 19 december 2002 tot vaststelling van criteria en procedures voor het aanvaarden
      van afvalstoffen op stortplaatsen overeenkomstig artikel 16 en bijlage II van Richtlijn 1999/31/EG betreffende het
      storten van afvalstoffen (PbEG L11).
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.5
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting als bedoeld in het eerste lid en er sprake is van het opslaan
      of storten van metallisch kwik, voldoet deze tevens aan artikel 4, eerste lid, van verordening (EG) nr. 1102/2008
      van het Europees Parlement en de Raad van 22 oktober 2008 inzake het verbod op de uitvoer van metallisch kwik en
      andere kwikverbindingen en -mengsels en de veilige opslag van metallisch kwik (PbEU L 304/75).
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13.6
    text: |-
      Een wijziging van de bijlage, bedoeld in het vierde lid, gaat voor de toepassing van dat lid gelden met ingang van
      de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13
  - number: 5.13a.1
    text: |-
      Indien de aanvraag betrekking heeft op een afvalvoorziening, gaat de aanvraag vergezeld van een
      door degene die de afvalvoorziening drijft, opgesteld winningsafvalbeheersplan als bedoeld in
      [artikel 3 van het Besluit beheer winningsafvalstoffen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023903#Artikel3
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
    references:
      - id: ref1
        bwb_id: BWBR0023903
        artikel: '3'
  - number: 5.13a.2
    text: 'In of bij een aanvraag die betrekking heeft op een afvalvoorziening, toont de aanvrager aan dat:'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.a
    text: |-
      de afvalvoorziening geschikt gelegen is, in het bijzonder gelet op verplichtingen ten aanzien van beschermde
      gebieden en geologische, hydrologische en hydrogeologische, seismische en geotechnische factoren;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.b
    text: 'de afvalvoorziening zo is ontworpen dat voldaan wordt aan de noodzakelijke voorwaarden om:'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.b.1°
    text: |-
      verontreiniging van de bodem, de lucht, het grondwater of een oppervlaktewaterlichaam, rekening houdende met in het
      bijzonder richtlijn 2006/11/EG, het Lozingenbesluit bodembescherming en de kaderrichtlijn water, te voorkomen,
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.b.2°
    text: te verzekeren dat verontreinigd water en percolaat op doelmatige wijze kunnen worden verzameld, en
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.b.3°
    text: erosie door water of wind wordt tegengegaan voor zover dat technisch mogelijk en economisch haalbaar is;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.c
    text: 'de afvalvoorziening passend is gebouwd, wordt beheerd en onderhouden teneinde:'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.c.1°
    text: haar fysische stabiliteit te verzekeren,
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.c.2°
    text: |-
      verontreiniging of besmetting van de bodem, de lucht, een oppervlaktewaterlichaam of het grondwater te voorkomen,
      en
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.c.3°
    text: schade aan het landschap zoveel mogelijk te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.d
    text: 'passende plannen en regelingen zijn getroffen voor:'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.d.1°
    text: |-
      een periodieke monitoring en inspectie van de afvalvoorziening door binnen de inrichting werkzame personen, die
      beschikken over de voor die werkzaamheden benodigde vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.d.2°
    text: |-
      het treffen van maatregelen indien de resultaten van die monitoring en de inspectie wijzen op instabiliteit of
      verontreiniging van het water of de bodem;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.e
    text: 'passende regelingen zijn getroffen voor:'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.e.1°
    text: de rehabilitatie en de sluiting van de afvalvoorziening;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.e.2°
    text: de fase na de sluiting van de afvalvoorziening;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
  - number: 5.13a.2.f
    text: |-
      in het ontwerp en bij de bouw van die afvalvoorziening rekening is gehouden met de noodzakelijke voorwaarden om
      een zwaar ongeval als bedoeld in [artikel 1, onderdeel f, van het Besluit risico’s zware ongevallen 1999][ref1]
      te voorkomen en de nadelige gevolgen van een dergelijk ongeval voor de gezondheid van de mens of het milieu zoveel
      mogelijk te voorkomen of te beperken, met inbegrip van de grensoverschrijdende gevolgen;


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel1
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '1'
  - number: 5.13a.2.g
    text: |-
      financiële zekerheid is of wordt gesteld, voor het nakomen van de voorschriften die ingevolge het
      [Besluit beheer winningsafvalstoffen][ref1] aan de vergunning worden verbonden, alsmede voor het nakomen van
      [titel 8.3 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023903
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.13a
    references:
      - id: ref1
        bwb_id: BWBR0023903
      - id: ref2
        bwb_id: BWBR0003245
  - number: '5.14'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting, die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 21 of 28.4, onder g][ref1], of in [bijlage II, onder 9][ref2], vermeldt de aanvrager in of bij
      de aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0005829
      [ref2]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005829
      - id: ref2
        bwb_id: BWBR0005829
  - number: 5.14.a
    text: |-
      de namen van degenen die verantwoordelijk zijn voor de handelingen met de genetisch gemodificeerde organismen en
      voor het toezicht op en de controle van de veiligheid daarvan;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14
  - number: 5.14.b
    text: de vakbekwaamheid van de in de inrichting werkzame personen die bij die handelingen zijn betrokken;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14
  - number: 5.14.c
    text: het eventuele bestaan van biologische veiligheidscomités of subcomités;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14
  - number: 5.14.d
    text: het hoogste inperkingsniveau waaraan de ruimte bestemd voor ingeperkt gebruik voldoet.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14
  - number: 5.14a.1
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting waar ten hoogste 10 000 kilogram consumentenvuurwerk als
      bedoeld in het [Vuurwerkbesluit][ref1] wordt opgeslagen vermeldt de aanvrager in of bij de aanvraag de maximale
      hoeveelheid consumentenvuurwerk in de zin van het [Vuurwerkbesluit][ref2] die in de inrichting wordt opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14a
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
  - number: 5.14a.2
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie die is genoemd in
      [bijlage I][ref1] bij dit besluit, onder 3.5, vermeldt de aanvrager in of bij de aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14a
    references:
      - id: ref1
        bwb_id: BWBR0005829
  - number: 5.14a.2.a
    text: |-
      de maximale hoeveelheden stoffen en voorwerpen behorend tot transport-gevarenklasse 1 als bedoeld in
      [bijlage 1 van de Regeling vervoer over land van gevaarlijke stoffen][ref1], onderscheiden naar gevarensubklasse en
      compatibiliteitsgroep, die in de inrichting worden opgeslagen;


      [ref1]: https://wetten.overheid.nl/BWBR0010054
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14a
    references:
      - id: ref1
        bwb_id: BWBR0010054
  - number: 5.14a.2.b
    text: |-
      de maximale hoeveelheid consumenten- en professioneel vuurwerk dan wel pyrotechnische artikelen voor theatergebruik
      in de zin van het [Vuurwerkbesluit][ref1] die in de inrichting wordt opgeslagen;


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14a
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 5.14a.2.c
    text: |-
      de namen van degenen door wie of onder voortdurend toezicht van wie handelingen met professioneel vuurwerk of
      pyrotechnische artikelen voor theatergebruik worden verricht, voor zover de aanvraag betrekking heeft op het
      bewerken van professioneel vuurwerk onderscheidenlijk pyrotechnische artikelen voor theatergebruik;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14a
  - number: 5.14a.2.d
    text: |-
      gegevens over de vakbekwaamheid van de in de inrichting werkzame personen, voor zover de aanvraag betrekking heeft
      op het bewerken van professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14a
  - number: 5.14b.1
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting waarop het [Besluit verbranden afvalstoffen][ref1] van
      toepassing is, vermeldt de aanvrager in of bij de aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0016460
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14b
    references:
      - id: ref1
        bwb_id: BWBR0016460
  - number: 5.14b.1.a
    text: |-
      de maatregelen of voorzieningen ten behoeve van terugwinning van de als gevolg van thermische behandeling van
      afvalstoffen opgewekte warmte;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14b
  - number: 5.14b.1.b
    text: |-
      de gegevens, bedoeld in [artikel 5.1, eerste lid, onder d][ref1], per categorie van stoffen, preparaten of andere
      producten, genoemd in de bijlage bij beschikking nr. 2000/532/EG van de Commissie van de Europese Gemeenschappen
      van 3 mei 2000 houdende vaststelling van een lijst van afvalstoffen overeenkomstig artikel 1, onder a), van
      [Richtlijn 75/442/EEG](31975L0442) van de Raad van de Europese Gemeenschappen betreffende afvalstoffen en
      Beschikking 94/904/EG van de Raad van de Europese Unie tot vaststelling van een lijst van gevaarlijke afvalstoffen
      overeenkomstig artikel 1, lid 4, van [Richtlijn 91/689/EEG](31991L0689) van de Raad van de Europese Gemeenschappen
      betreffende gevaarlijke afvalstoffen (PbEG L 226/3), en


      [ref1]: https://wetten.overheid.nl/BWBR0005829#Artikel5
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14b
    references:
      - id: ref1
        bwb_id: BWBR0005829
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.14b.1.c
    text: |-
      een nadere omschrijving van de slechtst denkbare bedrijfsomstandigheden als bedoeld in artikel 11, derde lid, van
      [richtlijn nr. 2000/76/EG](32000L0076) van het Europees Parlement en de Raad van de Europese Unie van 4 december
      2000 betreffende de verbranding van afval (PbEG L 332).
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14b
  - number: 5.14b.2
    text: 'Voor de toepassing van het eerste lid gaat een wijziging van:'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14b
  - number: 5.14b.2.a
    text: |-
      de bijlage, bedoeld in het eerste lid, onder b, gelden met ingang van de dag waarop aan die wijziging uitvoering
      moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip
      wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14b
  - number: 5.14b.2.b
    text: |-
      de richtlijn, bedoeld in het eerste lid, onder c, gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.14b
  - number: 5.15.1
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting waarop
      [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref1] van toepassing is, gaat zij vergezeld van die
      onderdelen van het veiligheidsrapport, bedoeld in [artikel 10 van dat besluit][ref2], die betrekking hebben op de
      risico's voor personen buiten de inrichting en voor het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel10
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0010475
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '10'
  - number: 5.15.2
    text: |-
      In een geval als bedoeld in het eerste lid vermeldt de aanvrager in of bij de aanvraag, per stof, genoemd in
      bijlage I, deel 1, bij dat besluit en per categorie van stoffen en preparaten, genoemd in bijlage I, deel 2, bij
      dat besluit, de maximale hoeveelheid waarvoor vergunning wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15
  - number: 5.15.3
    text: |-
      Het bevoegd gezag zendt uiterlijk twee weken na ontvangst van een aanvraag, als bedoeld in het eerste lid, een
      exemplaar daarvan en van de stukken, bedoeld in het eerste lid, aan:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15
  - number: 5.15.3.a
    text: |-
      de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: 5.15.3.b
    text: de burgemeester van de gemeente waarin de inrichting geheel of gedeeltelijk zal zijn of is gelegen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15
  - number: 5.15.3.c
    text: |-
      het bestuur van de regionale brandweer binnen wier gebied de inrichting geheel of gedeeltelijk zal zijn of is
      gelegen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15
  - number: 5.15.3.d
    text: |-
      voor zover de onderdelen van het veiligheidsrapport betrekking hebben op de risicos voor een
      oppervlaktewaterlichaam: het bestuursorgaan dat tot het verlenen van de vergunning krachtens
      [artikel 6.2 van de Waterwet][ref1] bevoegd is, behoudens in een geval als bedoeld in
      [artikel 8.28 van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 5.15.4
    text: |-
      Het bevoegd gezag zendt, indien tijdens de behandeling van de aanvraag een aanvulling op het veiligheidsrapport is
      ontvangen, deze aanvulling uiterlijk twee weken na ontvangst aan de in het derde lid genoemde bestuursorganen en
      aan de daar bedoelde toezichthouder.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15
  - number: 5.15a.1
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting waarop [paragraaf 2][ref1] en niet tevens
      [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref2] van toepassing is, vermeldt de aanvrager in of
      bij de aanvraag, de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
    references:
      - id: ref1
        bwb_id: BWBR0010475
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010475
        paragraaf: '3'
  - number: 5.15a.1.a
    text: het adres van de inrichting;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.b
    text: de naam of de handelsnaam van degene die de inrichting drijft en zijn adres;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.c
    text: |-
      de naam en de functie van de met de feitelijke leiding van de inrichting belaste persoon, indien deze een ander is
      dan degene die de inrichting drijft;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.d
    text: de aard van de in de inrichting aanwezige gevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.e
    text: |-
      per stof, genoemd in bijlage I, deel 1, bij dat besluit, en per categorie van stoffen en preparaten, genoemd in
      bijlage I, deel 2, bij dat besluit:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.e.1°
    text: de maximale hoeveelheid waarvoor vergunning wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.e.2°
    text: de hoeveelheid die bij een normale bedrijfsvoering in de inrichting aanwezig is;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.e.3°
    text: de fysische vorm van de betrokken gevaarlijke stof of stoffen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.f
    text: |-
      met het oog op de vaststelling van domino-effecten: voor gevaarlijke stoffen behorend tot de categorie ontplofbaar,
      ontvlambaar, licht ontvlambaar of zeer licht ontvlambaar, bedoeld in bijlage I, deel 2, bij dat besluit:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.f.1°
    text: een aanduiding van het grootste insluitsysteem;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.f.2°
    text: de maximale hoeveelheid van de betrokken gevaarlijke stof die daarin aanwezig kan zijn;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.f.3°
    text: een aanduiding van de betrokken gevaarlijke stof alsmede een aanduiding van de categorie waartoe die stof behoort;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.f.4°
    text: de plaats van het insluitsysteem in de inrichting;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.f.5°
    text: de druk en de temperatuur van de betrokken stoffen en preparaten in het insluitsysteem;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.g
    text: de activiteiten die in de inrichting worden uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.1.h
    text: |-
      de met de onmiddellijke omgeving van de inrichting samenhangende omstandigheden die een zwaar ongeval kunnen
      veroorzaken of de gevolgen daarvan ernstiger kunnen maken.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.2
    text: Artikel 5.15, derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15a.3
    text: |-
      Onze Minister kan in overeenstemming met Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van
      Sociale Zaken en Werkgelegenheid nadere regels stellen met betrekking tot de gegevens bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15a
  - number: 5.15b
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting waarop
      [artikel 10c van het Besluit emissie-eisen stookinstallaties milieubeheer A][ref1] van toepassing is, vermeldt de
      aanvrager in of bij de aanvraag de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel10c
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15b
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: 10c
  - number: 5.15b.a
    text: de resultaten van het onderzoek naar de technische en economische haalbaarheid van warmtekrachtkoppeling;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15b
  - number: 5.15b.b
    text: 'indien van toepassing: de maatregelen of voorzieningen ten behoeve van warmtekrachtkoppeling.'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15b
  - number: 5.15c.1
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting als bedoeld in [artikel 3, onderdelen b, e, f, g en h][ref1],
      of [artikel 4, onder b, e en f, van het Registratiebesluit externe veiligheid][ref2] vermeldt de aanvrager in of
      bij de aanvraag de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel4
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15c
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '4'
  - number: 5.15c.1.a
    text: |-
      de ligging van zowel de 10-5 per jaar contour als de 10-6 per jaar contour van het plaatsgebonden risico en, indien
      beschikbaar, de 10-8 per jaar contour van het plaatsgebonden risico, dan wel de afstanden die overeenkomen met deze
      waarden voor het plaatsgebonden risico indien deze afstanden door Onze Minister zijn voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15c
  - number: 5.15c.1.b
    text: |-
      de grootte van het groepsrisico, uitgedrukt in een grafiek met op de horizontale as het aantal dodelijke
      slachtoffers en op de verticale as de cumulatieve kansen per jaar op ten minste dat aantal slachtoffers,
      dan wel voor inrichtingen waarvoor geen veiligheidsrapport verplicht is gesteld op grond van het
      [Besluit risico’s zware ongevallen 1999][ref1], indien bekend de op grond van de oriënterende waarde voor het
      groepsrisico gemiddeld toelaatbare dichtheid van personen binnen het invloedsgebied rond de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15c
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 5.15c.2
    text: |-
      Voor inrichtingen waarop het [Besluit LPG-tankstations milieubeheer][ref1] of het [Vuurwerkbesluit][ref2] van
      toepassing zijn, blijft het eerste lid buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004327
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15c
    references:
      - id: ref1
        bwb_id: BWBR0004327
      - id: ref2
        bwb_id: BWBR0013360
  - number: 5.15c.3
    text: |-
      Bij de berekening van de in de onderdelen a en b van het eerste lid bedoelde gegevens wordt uitgegaan van de in de
      aanvraag genoemde maximale hoeveelheid gevaarlijke stof.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.15c
  - number: 5.16.1
    text: |-
      In of bij de aanvraag om een vergunning voor het veranderen van een inrichting of van de werking daarvan, als
      bedoeld in artikel 8.1, eerste lid, onder *b*, van de wet, vermeldt de aanvrager:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.16
  - number: 5.16.1.a
    text: zijn naam en adres;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.16
  - number: 5.16.1.b
    text: de vergunning of vergunningen krachtens welke de inrichting opgericht dan wel in werking is;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.16
  - number: 5.16.1.c
    text: de beoogde verandering van de inrichting of van de werking daarvan;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.16
  - number: 5.16.1.d
    text: |-
      voor zover de beoogde verandering van de inrichting of van de werking daarvan van invloed is op de onderwerpen
      waaromtrent voor het verkrijgen van de onder *b* bedoelde vergunning of vergunningen gegevens zijn verstrekt, een
      aanduiding van die gegevens en van de door de verandering veroorzaakte wijzigingen daarvan.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.16
  - number: 5.16.2
    text: De artikelen 5.2 tot en met 5.14 van dit besluit zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.16
  - number: 5.17.1
    text: |-
      Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de werking
      daarvan, als bedoeld in artikel 8.1, eerste lid, onder *b*, van de wet, gaat zij vergezeld van een
      rapport, als bedoeld in artikel 5.15, indien de aanvraag betrekking heeft op een inrichting waarop
      [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref1] ten gevolge van het veranderen van de inrichting
      of het veranderen van de werking ervan voor de eerste maal van toepassing wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0010475
        paragraaf: '3'
  - number: 5.17.2
    text: |-
      Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de werking daarvan,
      als bedoeld in artikel 8.1, eerste lid, onder *b*, van de wet, gaat zij vergezeld van een herzien
      rapport, als bedoeld in artikel 5.15, indien de aanvraag betrekking heeft op een inrichting waarop
      [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref1] van toepassing is en ten aanzien waarvan reeds
      een rapport is overgelegd, voor zover de herziening van de gegevens in bedoeld rapport nodig is voor het nemen van
      de beslissing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0010475
        paragraaf: '3'
  - number: 5.17.3
    text: |-
      Op een aanvraag als bedoeld in het eerste en tweede lid is artikel 5.15, tweede lid, van overeenkomstige
      toepassing, voor zover de gegevens met betrekking tot de maximale hoeveelheid nodig zijn voor het nemen van de
      beslissing op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.17
  - number: 5.17.4
    text: Artikel 5.15, derde en vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.17
  - number: 5.17a.1
    text: |-
      Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de werking daarvan, als
      bedoeld in [artikel 8.1, eerste lid, onder b, van de wet][ref1], vermeldt de aanvrager in of bij de aanvraag,
      onverminderd hetgeen is bepaald in enig ander artikel van dit hoofdstuk, de gegevens, bedoeld in artikel 5.15a,
      eerste lid, indien de aanvraag betrekking heeft op een inrichting waarop [paragraaf 2][ref2] en niet tevens
      [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref3] ten gevolge van het veranderen van de
      inrichting of het veranderen van de werking daarvan voor de eerste maal van toepassing wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.17a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0010475
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0010475
        paragraaf: '3'
  - number: 5.17a.2
    text: |-
      Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de werking daarvan, als bedoeld
      in [artikel 8.1, eerste lid, onder b, van de wet][ref1], vermeldt de aanvrager in of bij de aanvraag, onverminderd
      hetgeen is bepaald in enig ander artikel van dit hoofdstuk, herziene gegevens als bedoeld in artikel 5.15a,
      eerste lid, indien de aanvraag betrekking heeft op een inrichting waarop [paragraaf 2][ref2] en niet tevens
      [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref3] van toepassing is en ten aanzien waarvan reeds
      gegevens als bedoeld in die paragraaf zijn overgelegd, voor zover de herziening van die gegevens nodig is voor het
      nemen van de beslissing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.17a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0010475
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0010475
        paragraaf: '3'
  - number: 5.17a.3
    text: Artikel 5.15, derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.17a
  - number: 5.17b.1
    text: |-
      Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de werking daarvan,
      als bedoeld in [artikel 8.1, eerste lid, onderdeel b, van de wet][ref1], vermeldt de aanvrager
      in of bij de aanvraag onverminderd hetgeen is bepaald in enig ander artikel van dit hoofdstuk,
      de gegevens, bedoeld in [artikel 5.15c, eerste lid][ref2], indien de aanvraag ten gevolge van
      het veranderen van de inrichting of het veranderen van de werking ervan, voor de eerste maal
      betrekking heeft op een inrichting als bedoeld in [artikel 3, onderdelen b, e, f, g en h][ref3], of
      [artikel 4, onderdelen b, e en f, van het Registratiebesluit externe veiligheid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005829#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0020724#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020724#Artikel4
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.17b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
