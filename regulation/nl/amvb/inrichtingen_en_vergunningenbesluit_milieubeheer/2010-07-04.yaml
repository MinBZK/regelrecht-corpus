    text: Het bevoegd gezag zendt een exemplaar van de stukken, bedoeld in het eerste lid, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel8.2
  - number: 8.2.3
    text: |-
      Onze Minister zendt een exemplaar van de stukken, bedoeld in het eerste
      lid, indien de lijn van 10-8 van het plaatsgebonden risico, bedoeld in
      [bijlage III, onder 2, onder c, van het Besluit risico's zware ongevallen 1999][ref1] zich uitstrekt over het
      grondgebied van een andere staat, aan die staat. In dat geval zendt hij tevens een exemplaar aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties. In afwijking van de eerste volzin zendt Onze Minister, indien krachtens
      [artikel 19.3 van de wet][ref2] een tweede tekst is overgelegd, een exemplaar van deze tekst aan de betrokken
      staat.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel8.2
    references:
