        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '5.18'
    text: |-
      Met betrekking tot een aanvraag als bedoeld in artikel 8.4 van de wet zijn de artikelen 5.1 tot en met 5.16 van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.18
  - number: '5.19'
    text: 'Bij een melding, als bedoeld in artikel 8.19, tweede lid, van de wet, vermeldt de vergunninghouder:'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.19
  - number: 5.19.a
    text: zijn naam en adres;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.19
  - number: 5.19.b
    text: de vergunning of vergunningen krachtens welke de inrichting opgericht dan wel in werking is;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.19
  - number: 5.19.c
    text: de beoogde verandering van de inrichting of van de werking daarvan;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.19
  - number: 5.19.d
    text: |-
      gegevens waaruit blijkt van welke onderdelen en in welke mate van de onder b bedoelde vergunning of vergunningen en
      de daaraan verbonden beperkingen en voorschriften wordt afgeweken;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.19
  - number: 5.19.e
    text: |-
      gegevens waaruit blijkt dat de beoogde verandering van de inrichting of van de werking daarvan niet leidt tot
      andere of grotere nadelige gevolgen voor het milieu dan die de inrichting ingevolge de vergunning en de daaraan
      verbonden beperkingen en voorschriften mag veroorzaken;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.19
  - number: 5.19.f
    text: het tijdstip waarop beoogd wordt de voorgenomen verandering te verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.19
  - number: '5.20'
    text: |-
      Bij een melding als bedoeld in [artikel 8.20, tweede lid, van de wet][ref1], vermeldt de vergunninghouder:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 5.20.a
    text: zijn naam en adres;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.20
  - number: 5.20.b
    text: de vergunning of vergunningen krachtens welke de inrichting opgericht dan wel in werking is;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.20
  - number: 5.20.c
    text: de naam, het adres en het telefoonnummer van degene voor wie de vergunning zal gaan gelden;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.20
  - number: 5.20.d
    text: een contactpersoon van degene voor wie de vergunning zal gaan gelden;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.20
  - number: 5.20.e
    text: het beoogde tijdstip waarop de vergunning zal gaan gelden voor de onder c bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5.20
  - number: 5a.1.1
    text: |-
      Het bevoegd gezag, dan wel, in gevallen waarin een vergunning krachtens [artikel 6.2 van de Waterwet][ref1]
      is aangevraagd, het bestuursorgaan dat bevoegd is die vergunning te verlenen, betrekt bij de bepaling van de
      voor een inrichting, onderscheidenlijk met betrekking tot een lozing in aanmerking komende beste beschikbare
      technieken, rekening houdend met de voorzienbare kosten en baten van maatregelen, en met het voorzorg- en het
      preventiebeginsel:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 5a.1.1.a
    text: de toepassing van technieken die weinig afvalstoffen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.1.b
    text: de toepassing van minder gevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.1.c
    text: |-
      de ontwikkeling, waar mogelijk, van technieken voor de terugwinning en het opnieuw gebruiken van de bij de
      processen in de inrichting uitgestoten en gebruikte stoffen en van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.1.d
    text: vergelijkbare processen, apparaten of wijzen van bedrijfsvoering die met succes in de praktijk zijn beproefd;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.1.e
    text: de vooruitgang van de techniek en de ontwikkeling van de wetenschappelijke kennis;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.1.f
    text: de aard, de effecten en de omvang van de betrokken emissies;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.1.g
    text: de data waarop de installaties in de inrichting in gebruik zijn of worden genomen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.1.h
    text: de tijd die nodig is om een betere techniek toe te gaan passen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.1.i
    text: het verbruik en de aard van de grondstoffen, met inbegrip van water, en de energie-efficiëntie;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.1.j
    text: |-
      de noodzaak om het algemene effect van de emissies op en de risico’s voor het milieu te voorkomen of tot een
      minimum te beperken;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.1.k
    text: de noodzaak ongevallen te voorkomen en de gevolgen daarvan voor het milieu te beperken.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.2
    text: |-
      Het bevoegd gezag houdt bij de bepaling van de voor een inrichting of met betrekking tot een lozing in aanmerking
      komende beste beschikbare technieken rekening met bij ministeriële regeling aangewezen:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.2.a
    text: |-
      documenten waarin door de Commissie van de Europese Gemeenschappen krachtens artikel 16, tweede lid, van de
      EG-richtlijn inzake geïntegreerde preventie en bestrijding van verontreiniging bekendgemaakte informatie met
      betrekking tot de bepaling van beste beschikbare technieken is opgenomen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.2.b
    text: |-
      door andere internationale organisaties bekendgemaakte informatie met betrekking tot de bepaling van beste
      beschikbare technieken;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: 5a.1.2.c
    text: andere informatie met betrekking tot de bepaling van die technieken.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel5a.1
  - number: '6.1'
    text: 'Het bevoegd gezag geeft openbaar kennis van de verklaring, in ieder geval door:'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.1
  - number: 6.1.a
    text: overeenkomstige toepassing van artikel 19.1 van de wet;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.1
  - number: 6.1.b
    text: |-
      kennisgeving daarvan in een of meer dag-, nieuws- of huis-aan-huis-bladen op zodanige wijze dat het daarmee beoogde
      doel zo goed mogelijk wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.1
  - number: '6.2'
    text: 'Bij de openbare kennisgeving van de verklaring vermeldt het bevoegd gezag ten minste:'
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.2
  - number: 6.2.a
    text: de zakelijke inhoud van de verklaring;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.2
  - number: 6.2.b
    text: de uren waarop en de plaats waar de stukken kunnen worden ingezien.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.2
  - number: '6.3'
    text: |-
      In gevallen waarin een verklaring betrekking heeft op een inrichting waarvoor Onze Minister bevoegd is te beslissen
      op de aanvraag om een vergunning, kan hij de toepassing van de artikelen 6.1 en 6.2 geheel of gedeeltelijk
      achterwege laten, voor zover dat geboden is in het belang van de veiligheid van de Staat.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.3
  - number: '6.4'
    text: |-
      In gevallen waarin de verklaring betrekking heeft op een inrichting waarop het
      [Besluit risico's zware ongevallen 1999][ref1] van toepassing is en die verklaring betrekking heeft op het
      onderdeel externe veiligheid, zendt het bevoegd gezag zo spoedig mogelijk, doch uiterlijk twee weken na de
      bekendmaking van de verklaring, een exemplaar daarvan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 6.4.a
    text: het Rijksinstituut voor Volksgezondheid en Milieu;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.4
  - number: 6.4.b
    text: de inspecteur;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.4
  - number: 6.4.c
    text: |-
      de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: 6.4.d
    text: |-
      burgemeester en wethouders van de gemeente waarin de inrichting geheel of gedeeltelijk is gelegen, tenzij
      burgemeester en wethouders het bevoegd gezag zijn;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.4
  - number: 6.4.e
    text: het bestuur van de regionale brandweer binnen wier gebied de inrichting geheel of gedeeltelijk is gelegen.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel6.4
  - number: 7.1.1
    text: |-
      Met betrekking tot een aanvraag om een vergunning voor een inrichting, waarop burgemeester en wethouders bevoegd
      zijn of het dagelijks bestuur op grond van artikel 8.2*a*, eerste lid, onder *a*, van de wet bevoegd is te
      beslissen, worden naast de in artikel 8.7, eerste lid, onder *a* en *b*, van de wet aangewezen adviseurs tevens als
      adviseur aangewezen:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel7.1
  - number: 7.1.1.a
    text: |-
      de commandant van de regionale brandweer binnen wiens gebied de inrichting geheel of in hoofdzaak zal zijn of is
      gelegen, indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie, die is genoemd in
      bijlage I, onder 3.1 of 17;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel7.1
  - number: 7.1.1.b
    text: |-
      gedeputeerde staten van de provincie, waarin de inrichting geheel of in hoofdzaak zal zijn of is gelegen, indien
      de inrichting of een onderdeel daarvan is gelegen in een gebied, waarvoor bij provinciale verordening regels zijn
      gesteld ter bescherming van de kwaliteit van het grondwater met het oog op de waterwinning;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel7.1
  - number: 7.1.1.c
    text: |-
      gedeputeerde staten van een provincie, waarin de inrichting geheel of in hoofdzaak zal
      zijn of is gelegen, indien de inrichting is gelegen op een industrieterrein als bedoeld in
      [artikel 163, tweede lid, van de Wet geluidhinder][ref1], of met betrekking waartoe toepassing is gegeven aan
      [artikel 163, derde lid, van de Wet geluidhinder][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel163
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '163'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '163'
  - number: 7.1.1.d
    text: |-
      Onze Minister, indien de inrichting is gelegen op een industrieterrein als bedoeld in
      [artikel 163, vierde lid, van de Wet geluidhinder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel163
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '163'
  - number: 7.1.2
    text: |-
      Met betrekking tot een aanvraag om een vergunning voor een inrichting, waarop burgemeester en wethouders bevoegd
      zijn of het dagelijks bestuur op grond van artikel 8.2*a*, eerste lid, onder *a*, van de wet bevoegd is te
      beslissen, worden als betrokken bestuursorganen, als bedoeld in artikel 8.7, derde lid, van de wet, aangewezen:
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel7.1
  - number: 7.1.2.a
    text: |-
      burgemeester en wethouders van de gemeenten, waarvan de grens is gelegen binnen een afstand van 200 meter van de
      plaats waar de inrichting zal zijn of is gelegen;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel7.1
  - number: 7.1.2.b
    text: |-
      burgemeester en wethouders van de gemeenten waarvan het grondgebied is gelegen binnen de lijn van 10-8, bedoeld in
      [bijlage III, onder 2, onder c, van het Besluit risico's zware ongevallen 1999][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 7.1.2.c
    text: |-
      gedeputeerde staten van een provincie waarin een gemeente is gelegen, waarvan burgemeester en wethouders ingevolge
      onderdeel *b*, betrokken bestuursorgaan zijn;
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel7.1
  - number: 7.1.2.d
    text: |-
      het dagelijks bestuur in een samenwerkingsgebied waarin een gemeente is gelegen, waarvan burgemeester en wethouders
      ingevolge de onderdelen *a* of *b* betrokken bestuursorgaan zijn, tenzij het dagelijks bestuur bevoegd is te
      beslissen op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005829/2010-07-04#Artikel7.1
  - number: 7.2.1
    text: |-
      Met betrekking tot een aanvraag om een vergunning voor een inrichting, die behoort tot een
      categorie, waarvoor gedeputeerde staten bevoegd zijn te beslissen op de aanvraag, worden naast de in
