  url: https://wetten.overheid.nl/BWBR0017117/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als rechtspersonen, bedoeld in [artikel 45, eerste lid, van de Comptabiliteitswet 2001][ref1], worden aangewezen de
      rechtspersonen, opgenomen in [bijlage A, onderdeel 1][ref2], behorende bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0017117
    url: https://wetten.overheid.nl/BWBR0017117/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0017117
  - number: '2'
    text: |-
      Als rechtspersonen, bedoeld in [artikel 45, tweede lid, van de Comptabiliteitswet 2001][ref1], worden aangewezen de
      rechtspersonen, opgenomen in [bijlage B, onderdeel 1][ref2], behorende bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0017117
    url: https://wetten.overheid.nl/BWBR0017117/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0017117
  - number: '3'
    text: |-
      Als rechtspersonen, bedoeld in [artikel 45, derde lid, van de Comptabiliteitswet 2001][ref1], waarop het
      bepaalde in [artikel 45, eerste lid][ref2], van toepassing is, worden aangewezen de rechtspersonen, opgenomen in
      [bijlage A, onderdeel 2][ref3], behorende bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0017117
    url: https://wetten.overheid.nl/BWBR0017117/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0017117
  - number: '4'
    text: |-
      1 Onze Minister van Financiën kan in overeenstemming met Onze betrokken Ministers andere rechtspersonen als bedoeld
      in [artikel 45, eerste en tweede lid, van de Comptabiliteitswet 2001][ref1], aanwijzen.

      2 Onze Minister van Financiën kan in overeenstemming met Onze betrokken Ministers de aanwijzing van een
      rechtspersoon als bedoeld in [artikel 45, eerste en tweede lid, van de Comptabiliteitswet 2001][ref2] intrekken,
      indien hij handhaving op deze lijsten uit een oogpunt van een doelmatig en risico-arm kasbeheer niet langer zinvol
      oordeelt.

      3 Van besluiten, bedoeld in het eerste en tweede lid, wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel45
    url: https://wetten.overheid.nl/BWBR0017117/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '45'
  - number: '5'
    text: |-
      1 [Artikel 1][ref1] is gedurende zes maanden na het tijdstip van inwerkingtreding van dit besluit niet van
      toepassing op liquide middelen, die door een aangewezen rechtspersoon buiten 's Rijks schatkist worden uitgezet na
      het tijdstip van inwerkingtreding van dit besluit.

      2 [Artikel 1][ref2] is voorts in aansluiting op de periode van zes maanden, bedoeld in het eerste lid, gedurende
      zes maanden niet van toepassing op de in het eerste lid bedoelde liquide middelen waarvan de uitzetting binnen
      de in het eerste lid bedoelde periode van zes maanden door een aangewezen rechtspersoon is aangemeld bij Onze
      betrokken Minister, teneinde afspraken te maken over de periode waarbinnen de betrokken rechtspersoon alsnog de
      bedoelde middelen in 's Rijks schatkist zal brengen.

      3 Onze Minister van Financiën kan de periode van zes maanden, bedoeld in het tweede lid, verlengen met een door hem
      te bepalen termijn.

      4 Onze Minister van Financiën kan de perioden van zes maanden, bedoeld in het eerste en het tweede lid, voor een
      afzonderlijke rechtspersoon verkorten.


      [ref1]: https://wetten.overheid.nl/BWBR0017117#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017117#Artikel1
    url: https://wetten.overheid.nl/BWBR0017117/2017-01-01#Artikel5
    references:
