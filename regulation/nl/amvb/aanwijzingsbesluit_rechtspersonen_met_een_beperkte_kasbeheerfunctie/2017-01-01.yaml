        artikel: '1'
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van 1 september 2004. Indien het Staatsblad waarin dit besluit wordt
      geplaatst, wordt uitgegeven na 30 augustus 2004, dan treedt het in werking met ingang van de dag na de uitgifte van
      het Staatsblad waarin het wordt geplaatst en werkt het terug tot en met 1 september 2004.
    url: https://wetten.overheid.nl/BWBR0017117/2017-01-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Aanwijzingsbesluit rechtspersonen met een beperkte kasbeheerfunctie.'
    url: https://wetten.overheid.nl/BWBR0017117/2017-01-01#Artikel7
