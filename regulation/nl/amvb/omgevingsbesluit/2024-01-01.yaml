  - number: '10.42'
    text: |-
      Als dat nodig is voor de vaststelling van een geluidbelastingkaart als bedoeld in
      [artikel 20.17, eerste lid, onder a, van de wet][ref1], verstrekken bestuursorganen elkaar op verzoek alle
      gevraagde gegevens voor zover het verzoekende bestuursorgaan daar geen toegang toe heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel20.17
