  - number: '4.32'
    text: |-
      1 Onze Minister van Onderwijs, Cultuur en Wetenschap is adviseur voor een aanvraag om een omgevingsvergunning voor
      zover de aanvraag betrekking heeft op:

      a. een rijksmonumentenactiviteit met betrekking tot een archeologisch monument; of

      b. een rijksmonumentenactiviteit met betrekking tot een monument, in de volgende gevallen:

      1°. het slopen van het monument, als het gaat om het geheel afbreken van het monument of het gedeeltelijk afbreken
      daarvan als die gedeeltelijke afbraak van ingrijpende aard is voor de monumentale waarden van het monument;

      2°. het ingrijpend wijzigen van het monument of een belangrijk deel daarvan, als de gevolgen voor de monumentale
      waarden van het monument vergelijkbaar zijn met de gevolgen van het slopen van het monument, bedoeld onder 1°;

      3°. het reconstrueren van het monument of een belangrijk deel daarvan, waarbij de staat van het monument wordt
      teruggebracht naar een eerdere staat of een veronderstelde eerdere staat van het monument;

      4°. het wijzigen van het monument of een belangrijk deel daarvan voor een gebruiksverandering van het monument, als
      dat ingrijpende gevolgen heeft voor de monumentale waarden; of

      5°. het verplaatsen van het monument of een belangrijk deel daarvan.

      2 De voorgenomen beslissing op de aanvraag, bedoeld in het eerste lid, aanhef en onder a, behoeft ook instemming
      van Onze Minister van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel4.32
  - number: '4.33'
    text: |-
      Het bestuur van de veiligheidsregio op het grondgebied waarvan een milieubelastende activiteit geheel of in
      hoofdzaak plaatsvindt, is adviseur voor een aanvraag om een omgevingsvergunning voor zover de aanvraag betrekking
      heeft op een milieubelastende activiteit als bedoeld in [bijlage III][ref1], onder 1.


      [ref1]: https://wetten.overheid.nl/BWBR0041278
