      1 Het bevoegd gezag zendt aan de vervreemder een afschrift van:

      a. een verzoek aan de rechtbank als bedoeld in [artikel 9.16, eerste lid, van de wet][ref1]; en

      b. een schriftelijke intrekking van een verzoek als bedoeld in
      [artikel 9.17, eerste lid, onder b, en tweede lid, onder b, van de wet][ref2].

      2 De vervreemder zendt aan het bevoegd gezag een afschrift van een verzoek als bedoeld in
      [artikel 9.18, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel9.16
