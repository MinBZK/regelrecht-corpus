  - number: 10.42a
    text: |-
      1 De volgende bestuursorganen verstrekken de volgende gegevens op elektronische wijze aan Onze Minister van
      Infrastructuur en Waterstaat binnen de daarbij aangegeven termijn:

      a. het college van burgemeester en wethouders, gedeputeerde staten en Onze
      Minister van Infrastructuur en Waterstaat verstrekken de gegevens, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________, binnen vier weken na bekendmaking van hun besluit tot vaststelling van een
      geluidproductieplafond als omgevingswaarde;

      b. het college van burgemeester en wethouders, gedeputeerde staten en Onze
      Minister van Infrastructuur en Waterstaat verstrekken de gegevens, bedoeld in
      [artikel 11.52, eerste lid, onder a, onder 2°, van het Besluit kwaliteit leefomgeving][ref2], op de dag van
      bekendmaking van hun besluit tot vaststelling van een geluidproductieplafond als omgevingswaarde;

      c. het college van burgemeester en wethouders, gedeputeerde staten, Onze Minister van Infrastructuur en Waterstaat
      en de beheerder, bedoeld in [artikel 1, eerste lid, van de Spoorwegwet][ref3], verstrekken de gegevens, bedoeld
      in [artikel 11.52, eerste lid, onder a, onder 6°, van het Besluit kwaliteit leefomgeving][ref4], over een
      kalenderjaar voor 18 juli van het daarop volgende jaar;

      d. het college van burgemeester en wethouders en het dagelijks
      bestuur van het waterschap verstrekken de gegevens, bedoeld in
      [artikel 11.52, eerste lid, onder b, onder 1°, 2°, 3° en 5°, van het Besluit kwaliteit leefomgeving][ref5],
      binnen vier weken:

      1°. na het bij koninklijk besluit te bepalen tijdstip, bedoeld in
      [artikel 11.46, derde lid, van dat besluit][ref6];

      2°. nadat toepassing is gegeven aan [artikel 3.27, zesde lid, van dat besluit][ref7]; en

      3°. nadat hun besluit tot aanleg van een weg of spoorweg als bedoeld in
      [artikel 3.27, eerste lid, onder b, van dat besluit][ref8] is genomen;

      e. het college van burgemeester en wethouders en het dagelijks bestuur van het waterschap verstrekken de gegevens,
      bedoeld in [artikel 11.52, eerste lid, onder b, onder 4°, van het Besluit kwaliteit leefomgeving][ref9], binnen
      vier weken na het uiterste tijdstip, bedoeld in [artikel 10.42c, eerste lid, onder b][ref10];

      f. gedeputeerde staten, Onze Minister van Defensie en Onze Minister van Infrastructuur en Waterstaat verstrekken
      de gegevens, bedoeld in [artikel 11.52, eerste lid, onder c, van het Besluit kwaliteit leefomgeving][ref11] binnen
      vier weken na de bekendmaking van hun luchthavenbesluit;

      g. het college van burgemeester en wethouders, de gemeenteraad, gedeputeerde staten, Onze Minister voor Klimaat
      en Energie en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verstrekken de gegevens, bedoeld
      in [artikel 11.52, eerste lid, onder d, van het Besluit kwaliteit leefomgeving][ref12], binnen vier weken na
      de bekendmaking van hun besluit tot vaststelling van het omgevingsplan dat, de omgevingsvergunning voor een
      omgevingsplanactiviteit die of het projectbesluit dat waarden bevat voor het geluid door een windturbine of een
      windpark op een industrieterrein; en

      h. het college van burgemeester en wethouders, de gemeenteraad, gedeputeerde staten, Onze Minister van
      Defensie en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verstrekken de gegevens, bedoeld
      in [artikel 11.52, eerste lid, onder e, van het Besluit kwaliteit leefomgeving][ref13], binnen vier weken
      na de bekendmaking van hun besluit tot vaststelling van het omgevingsplan dat, de omgevingsvergunning voor
      een omgevingsplanactiviteit die of het projectbesluit dat waarden bevat voor het geluid door een civiele
      buitenschietbaan, een militaire buitenschietbaan of een militair springterrein op een industrieterrein.

      2 De bestuursorganen, bedoeld in het eerste lid, verstrekken onverwijld gecorrigeerde gegevens nadat is gebleken
      dat eerder door hen verstrekte gegevens onjuist zijn.


