    text: |-
      1 Bij het vaststellen van een omgevingsvisie wordt aangegeven hoe burgers, bedrijven, maatschappelijke organisaties
      en bestuursorganen bij de voorbereiding zijn betrokken en wat de resultaten daarvan zijn.

      2 Als een omgevingsvisie wordt vastgesteld door de gemeenteraad of provinciale staten, wordt daarbij aangegeven op
      welke wijze invulling is gegeven aan het toepasselijke decentrale participatiebeleid.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.7
  - number: 10.7a
    text: |-
      1 Bij de voorbereiding van een gemeentelijke, provinciale of nationale omgevingsvisie waarop
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, wordt van het ontwerp mededeling gedaan
      in het gemeenteblad, het provinciaal blad respectievelijk de Staatscourant.

      2 [Artikel 140 van de Gemeentewet][ref2], [artikel 137 van de Provinciewet][ref3] en
      [artikel 10a van de Bekendmakingswet][ref4] zijn van overeenkomstige toepassing op een gemeentelijke, provinciale
      respectievelijk nationale omgevingsvisie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel137
