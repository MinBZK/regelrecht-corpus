  - number: '14.8'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is verwerkingsverantwoordelijke voor de verwerking
      van persoonsgegevens in de landelijke voorziening.

      2 Het bevoegd gezag is verwerkingsverantwoordelijke voor de verwerking van persoonsgegevens in een bericht, vanaf
      het moment dat het dit heeft opgehaald uit de landelijke voorziening.

      3 Onze Minister van Infrastructuur en Waterstaat is verwerkingsverantwoordelijke voor de verwerking van
      persoonsgegevens in een bericht als bedoeld in [artikel 14.7b, eerste lid][ref1], vanaf het moment dat hij dit
      heeft opgehaald uit de landelijke voorziening.

      4 In afwijking van het eerste lid zijn, als sprake is van het uitwisselen van gegevens als bedoeld in
      [artikel 14.7a][ref2], Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en het bestuursorgaan dat
      het initiatief heeft genomen tot het uitwisselen van gegevens gezamenlijke verwerkingsverantwoordelijken voor de
      verwerking van persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel14.7b
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel14.7a
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel14.8
