  - number: '10.22'
    text: |-
      1 Het bevoegd gezag verstrekt aan een bevoegde autoriteit van een andere staat een afschrift van de aanvraag om een
      omgevingsvergunning voor een milieubelastende activiteit met de daarbij behorende gegevens als:

      a. die activiteit aanzienlijke nadelige gevolgen voor het milieu in die staat kan veroorzaken; of

      b. die staat vanwege mogelijke aanzienlijke nadelige gevolgen voor het milieu daarom verzoekt.

      2 Het afschrift en de daarbij behorende gegevens worden verstrekt op het moment waarop op grond van:

      a. [artikel 16.57 van de wet][ref1] kennis wordt gegeven van de aanvraag; of

      b. [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref2] het ontwerpbesluit met de daarbij behorende
      stukken ter inzage wordt gelegd.

      3 Als de aanvraag om een omgevingsvergunning betrekking heeft op een winningsafvalvoorziening categorie A
      als bedoeld in [bijlage I bij het Besluit kwaliteit leefomgeving][ref3], die aanzienlijke nadelige gevolgen
      voor het milieu kan hebben in een andere staat, en over het op die aanvraag te nemen besluit overleg
      plaatsvindt met bestuursorganen in die andere staat, wordt dit overleg vermeld in de kennisgeving, bedoeld in
      [artikel 3:12 van de Algemene wet bestuursrecht][ref4].

      4 Als de aanvraag betrekking heeft op het produceren en leveren van teruggewonnen water, bedoeld in
      [artikel 19.1c van het Besluit activiteiten leefomgeving][ref5], wordt informatie uitgewisseld als bedoeld in de
      artikelen 6, vierde lid, en 8, eerste lid, van de verordening hergebruik stedelijk afvalwater.

      5 Nadat het besluit is vastgesteld, verstrekt het bevoegd gezag dat besluit aan de bevoegde autoriteit, het
      betrokken publiek en de bevoegde instanties van die andere staat.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16.57
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel311
      [ref3]: https://wetten.overheid.nl/BWBR0041313
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel312
      [ref5]: https://wetten.overheid.nl/BWBR0041330#Artikel19.1c
