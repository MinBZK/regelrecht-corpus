        artikel: '16.45'
  - number: '11.11'
    text: |-
      1 Het bevoegd gezag neemt binnen zes weken na ontvangst van de mededeling de beslissing, bedoeld in
      [artikel 16.43, tweede lid, van de wet][ref1], op grond van de informatie, bedoeld in [artikel 11.10][ref2].

      2 Het bevoegd gezag neemt het resultaat van de beoordeling of sprake is van aanzienlijke milieueffecten, bedoeld in
      [artikel 16.43, tweede lid, van de wet][ref3], met de bijbehorende motivering op in het besluit en, voor zover hier
      sprake van is, in het ontwerp van het besluit.

      3 In de motivering van de beslissing wordt in ieder geval verwezen naar:

      a. de relevante criteria van bijlage III bij de mer-richtlijn; en

      b. als is beslist dat geen milieueffectrapport moet worden gemaakt:

      1°. de kenmerken en maatregelen, bedoeld in [artikel 11.10, derde lid][ref4], als degene die voornemens is het
      project uit te voeren deze heeft voorgesteld; en

      2°. het moment waarop die maatregelen moeten zijn uitgevoerd.


