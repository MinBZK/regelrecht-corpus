  - number: '10.41'
    text: |-
      1 Degene die een geluidbron beheert, verstrekt op verzoek van het bestuursorgaan dat is belast met de vaststelling
      van een geluidbelastingkaart als bedoeld in [artikel 20.17, eerste lid, onder a, van de wet][ref1], alle gevraagde
      gegevens voor zover dat bestuursorgaan daar zelf geen toegang toe heeft.

      2 De gegevens worden binnen drie maanden na de dag waarop het verzoek is ontvangen verstrekt, of, wanneer de
      gevraagde gegevens nog niet beschikbaar zijn, onverwijld nadat die beschikbaar zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel20.17
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.41
