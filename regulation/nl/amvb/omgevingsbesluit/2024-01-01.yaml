  - number: '4.20'
    text: |-
      1 Het college van burgemeester en wethouders is adviseur voor een aanvraag om een omgevingsvergunning voor zover de
      aanvraag betrekking heeft op:

      a. een bouwactiviteit;

      b. een omgevingsplanactiviteit;

      c. een rijksmonumentenactiviteit met betrekking tot een monument; of

      d. een milieubelastende activiteit.

      2 De voorgenomen beslissing op de aanvraag behoeft ook instemming van het college van burgemeester en wethouders
      als het gaat om een aanvraag als bedoeld in:

      a. het eerste lid, aanhef en onder b, voor zover het gaat om een omgevingsplanactiviteit anders dan een
      omgevingsplanactiviteit van provinciaal of nationaal belang; of

      b. het eerste lid, aanhef en onder d, voor zover het gaat om een milieubelastende activiteit
      anders dan een milieubelastende activiteit als bedoeld in [artikel 4.6, eerste lid, onder c][ref1],
      [4.10, eerste lid, onder a][ref2], of [4.11, eerste lid, onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel4.10
      [ref3]: https://wetten.overheid.nl/BWBR0041278#Artikel4.11
