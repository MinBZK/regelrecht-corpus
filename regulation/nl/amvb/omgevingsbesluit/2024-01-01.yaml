  - number: '13.18'
    text: |-
      1 Het bevoegd gezag onderzoekt of de onderdelen van het opgestelde of bijgewerkte veiligheidsrapport
      die gaan over externe veiligheidsrisico’s voldoen aan de [artikelen 4.14][ref1], [4.15][ref2] en
      [4.16 van het Besluit activiteiten leefomgeving][ref3].

      2 Het bevoegd gezag stelt de toezichthouder, bedoeld in
      [artikel 1, derde lid, onder d, van de Arbeidsomstandighedenwet][ref4], tijdig in de gelegenheid om te
      onderzoeken of de onderdelen van het veiligheidsrapport die gaan over de bescherming van de veiligheid en de
      gezondheid van de werknemers, de werkgever en zelfstandige voldoen aan de [artikelen 4.14][ref5], [4.15][ref6] en
      [4.18 van het Besluit activiteiten leefomgeving][ref7].

      3 Het bevoegd gezag stelt het bestuur van de veiligheidsregio waarin de Seveso-inrichting geheel of gedeeltelijk
      is gelegen, tijdig in de gelegenheid om te onderzoeken of de onderdelen van het veiligheidsrapport die gaan over de
      bedrijfsbrandweer en de voorbereiding van de rampenbestrijding, voldoen aan de [artikelen 4.14][ref8], [4.15][ref9]
      en [4.17 van het Besluit activiteiten leefomgeving][ref10].

      4 Het bevoegd gezag stelt het bevoegd gezag voor een omgevingsvergunning voor een lozingsactiviteit
      op een oppervlaktewaterlichaam en een lozingsactiviteit op een zuiveringtechnisch werk tijdig
      in de gelegenheid om te onderzoeken of de onderdelen van het veiligheidsrapport die gaan over
      mogelijke waterverontreiniging of een mogelijke belemmering voor de doelmatige werking van het
      zuiveringtechnisch werk bij een zwaar ongeval voldoen aan de [artikelen 4.14][ref11], [4.15][ref12] en
      [4.16, eerste lid, onder c en d, van het Besluit activiteiten leefomgeving][ref13].


