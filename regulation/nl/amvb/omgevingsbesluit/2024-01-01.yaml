  - number: '13.2'
    text: |-
      De bestuursrechtelijke handhavingstaak, bedoeld in [artikel 18.1 van de wet][ref1], berust in geval van de volgende
      gedoogplichten uit [hoofdstuk 10 van de wet][ref2] bij:

      a. gedeputeerde staten: bij een gedoogplicht als bedoeld in [artikel 10.10 van de wet][ref3];

      b. Onze Minister van Infrastructuur en Waterstaat:

      1°. bij een gedoogplicht als bedoeld in [artikel 10.7 van de wet][ref4];

      2°. bij een gedoogplicht als bedoeld in [artikel 10.8, eerste lid, van de wet][ref5];

      c. het bestuursorgaan dat verantwoordelijk is voor de uitvoering van een gedoogplicht:

      1°. bij een gedoogplicht als bedoeld in [artikel 10.2 van de wet][ref6];

      2°. bij een gedoogplicht als bedoeld in [artikel 10.3, eerste, derde en vierde lid, van de wet][ref7]; en

      3°. bij een gedoogplicht als bedoeld in [artikel 10.6, eerste lid, van de wet][ref8];

      d. het bevoegd gezag, bedoeld in [artikel 17.9, eerste tot en met vierde lid, van de Wet milieubeheer][ref9]: bij
      een gedoogplicht als bedoeld in [artikel 10.6, tweede lid, van de wet][ref10];

      e. het dagelijks bestuur van een openbaar lichaam, bedoeld in
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref11]: bij een gedoogplicht als bedoeld in
      [artikel 10.8, derde lid, van de wet][ref12];

      f. het bevoegd gezag voor een vergunning voor het opsporen van CO-opslagcomplexen, het opsporen of winnen van
      delfstoffen of aardwarmte of het opslaan van stoffen als bedoeld in [artikel 1 van de Mijnbouwwet][ref13]: bij een
      gedoogplicht als bedoeld in [artikel 10.9 van de wet][ref14]; en

      g. het bestuursorgaan dat bevoegd is tot oplegging van een gedoogplicht:

      1°. bij een gedoogplicht als bedoeld in [artikel 10.13a, eerste lid, van de wet][ref15];

      2°. bij een gedoogplicht als bedoeld in [artikel 10.17 van de wet][ref16];

      3°. bij een gedoogplicht als bedoeld in [artikel 10.19, eerste en tweede lid, van de wet][ref17]; en

      4°. bij een gedoogplicht als bedoeld in [artikel 10.19a van de wet][ref18].


