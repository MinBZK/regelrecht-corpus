  - number: '11.10'
    text: |-
      1 Bij een mededeling als bedoeld in [artikel 16.45, eerste lid, van de wet][ref1] verstrekt degene die voornemens
      is het project uit te voeren in ieder geval een beschrijving van:

      a. het project, met in ieder geval een beschrijving van:

      1°. de fysieke kenmerken van het gehele project en, als dat van toepassing is, van de sloopactiviteiten;

      2°. de locatie van het project, met bijzondere aandacht voor de kwetsbaarheid van het milieu in de gebieden waarop
      het project van invloed kan zijn;

      b. de mogelijk aanzienlijke milieueffecten van het project; en

      c. voor zover er informatie over deze effecten beschikbaar is: de mogelijk aanzienlijke milieueffecten van het
      project als gevolg van:

      1°. de verwachte residuen en emissies en de productie van afvalstoffen; en

      2°. het gebruik van natuurlijke bronnen, waaronder bodem, land, water en biodiversiteit.

      2 Bij het verstrekken van de informatie, bedoeld in het eerste lid, houdt degene die voornemens is het project uit
      te voeren rekening met de relevante criteria van bijlage III bij de mer-richtlijn en, voor zover relevant, met de
      beschikbare resultaten van andere relevante beoordelingen van de milieueffecten.

      3 Bij de mededeling kan een beschrijving worden verstrekt van de kenmerken van het voorgenomen project en van de
      voorgenomen maatregelen om mogelijk aanzienlijke milieueffecten te vermijden of te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16.45
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.10
