      Onverminderd [artikel 5.54 van de wet][ref1] wordt aan [artikel 5.7, eerste lid, onder a][ref2], in ieder geval
      toepassing gegeven als een projectbesluit:

      a. een activiteit toelaat op een industrieterrein waarvoor op grond van [artikel 2.12a van de wet][ref3]
      geluidproductieplafonds als omgevingswaarden zijn vastgesteld en door het geluid door die activiteit niet aan die
      plafonds kan worden voldaan;

      b. ziet op de aanleg van een weg of spoorweg waarvoor op grond van [artikel 2.13a][ref4] of
      [2.15, tweede lid, van de wet][ref5] geluidproductieplafonds als omgevingswaarden worden vastgesteld; of

      c. ziet op een wijziging van een weg of spoorweg waarvoor op grond van [artikel 2.13a][ref6] of
      [2.15, tweede lid, van de wet][ref7] geluidproductieplafonds als omgevingswaarden zijn vastgesteld en na die
      wijziging niet aan die plafonds kan worden voldaan.


