      1 In afwijking van [artikel 10.42a, eerste lid, aanhef en onder a en b][ref1], verstrekt het bestuursorgaan
      dat bevoegd is geluidproductieplafonds vast te stellen de in die onderdelen bedoelde gegevens met
      betrekking tot geluidproductieplafonds langs wegen en spoorwegen die zijn herberekend op grond van
      [artikel 3.2 van de Aanvullingswet geluid Omgevingswet][ref2], met uitzondering van het gegeven, bedoeld in
      [artikel 11.52, eerste lid, onder a, onder 7°, van het Besluit kwaliteit leefomgeving][ref3], binnen vier weken na
      die herberekening.

      2 In afwijking van [artikel 10.42a, eerste lid, aanhef en onder f][ref4], verstrekken gedeputeerde staten, Onze
      Minister van Defensie en Onze Minister van Infrastructuur en Waterstaat de in dat onderdeel bedoelde gegevens
      met betrekking tot op het tijdstip van inwerkingtreding van het [Aanvullingsbesluit geluid Omgevingswet][ref5]
      geldende besluit over het toegelaten geluid van een luchthaven waarvoor op grond van de [Wet luchtvaart][ref6]
      een luchthavenindelingbesluit, een luchthavenbesluit of een besluit beperkingengebied buitenlandse luchthaven is
      vereist, binnen een bij koninklijk besluit te bepalen termijn.

      3 In afwijking van [artikel 10.42a, eerste lid, aanhef en onder g en h][ref7], verstrekt het college van
      burgemeester en wethouders, de gemeenteraad, gedeputeerde staten, Onze Minister voor Infrastructuur en Waterstaat,
      Onze Minister voor Klimaat en Energie en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties binnen een
      bij koninklijk besluit te bepalen termijn de in die onderdelen bedoelde gegevens met betrekking tot activiteiten
      die op het tijdstip van inwerkingtreding van het [Aanvullingsbesluit geluid Omgevingswet][ref8] rechtmatig worden
      verricht.


