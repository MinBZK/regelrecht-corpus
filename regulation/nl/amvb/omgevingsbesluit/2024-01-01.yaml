      1 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van een besluit op
      een aanvraag om, wijziging van of intrekking van een omgevingsvergunning, als de aanvraag, wijziging of intrekking
      geheel of gedeeltelijk betrekking heeft op de volgende activiteiten:

      a. een rijksmonumentenactiviteit als het gaat om een rijksmonumentenactiviteit als bedoeld in
      [artikel 4.32, eerste lid, onder a of b][ref2];

      b. een milieubelastende activiteit voor zover het gaat om het exploiteren van een ippc-installatie, bedoeld in
      [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref3];

      c. een milieubelastende activiteit voor zover het gaat om het exploiteren van een Seveso-inrichting, bedoeld in
      [artikel 3.50 van het Besluit activiteiten leefomgeving][ref4];

      d. een milieubelastende activiteit voor zover het gaat om het exploiteren van een andere milieubelastende
      installatie voor het vergassen en vloeibaar maken van steenkool of andere brandstoffen, bedoeld in
      [artikel 3.63, onder b, van het Besluit activiteiten leefomgeving][ref5];

      e. een milieubelastende activiteit voor zover het gaat om het storten of verzamelen
      van winningsafvalstoffen in een winningsafvalstoffenvoorziening, bedoeld in
      [artikel 3.84, onder c, van het Besluit activiteiten leefomgeving][ref6];

      f. een lozingsactiviteit op een oppervlaktewaterlichaam of een zuiveringtechnisch werk voor het lozen van afvalwater
      afkomstig van een ippc-installatie, bedoeld in [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref7];

      g. een lozingsactiviteit op een oppervlaktewaterlichaam of een zuiveringtechnisch werk voor het lozen van afvalwater
      afkomstig van een Seveso-inrichting, bedoeld in [artikel 3.50 van het Besluit activiteiten leefomgeving][ref8];

      h. een lozingsactiviteit als bedoeld in [artikel 3.16, tweede lid][ref9],
      [3.42, tweede lid][ref10], [3.108][ref11], [3.141][ref12], [3.149][ref13],
      [3.286, derde lid][ref14], [3.301, tweede lid][ref15], [6.55, eerste lid, onder c][ref16], of
      [7.60, eerste lid, onder c, van het Besluit activiteiten leefomgeving][ref17];

      i. een stortingsactiviteit als bedoeld in [artikel 7.62 van het Besluit activiteiten leefomgeving][ref18];

      j. een Natura 2000-activiteit; of

      k. een wateractiviteit anders dan bedoeld in de onderdelen f tot en met i, met uitzondering van een als
      wateractiviteit aan te merken beperkingengebiedactiviteit, als die betrekking heeft op:

      1°. een ippc-installatie; of

      2°. een Seveso-inrichting.

      2 Dit artikel is niet van toepassing op een activiteit als bedoeld in het eerste lid, onder a, als die
      activiteit alleen wordt verricht voor archeologisch vooronderzoek voor zover dit bestaat uit booronderzoek,
      proefputtenonderzoek, proefsleuvenonderzoek, of, bij cultureel erfgoed onder water, het nemen van materiaalmonsters
      of het meenemen van een archeologische vondst als bedoeld in de [Erfgoedwet][ref19].

      3 Dit artikel is niet van toepassing op een activiteit als bedoeld in het eerste lid, onder d, als die activiteit
      alleen of voornamelijk wordt uitgevoerd voor onderzoek, ontwikkeling en het testen van nieuwe methoden of producten
      gedurende minder dan twee jaar, tenzij aannemelijk is dat de activiteit significante nadelige gevolgen heeft voor
      de gezondheid of het milieu.

      4 Dit artikel is niet van toepassing op een wijziging van een omgevingsvergunning als bedoeld in het eerste lid,
      onder b tot en met f, en k, onder 1°, als die wijziging naar het oordeel van het bevoegd gezag geen significante
      nadelige gevolgen heeft voor de gezondheid of het milieu.


