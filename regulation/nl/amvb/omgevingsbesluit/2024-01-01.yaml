  - number: '4.30'
    text: |-
      1 Onze Minister van Infrastructuur en Waterstaat is adviseur voor een aanvraag om een omgevingsvergunning voor
      zover de aanvraag betrekking heeft op:

      a. een wateractiviteit die betrekking heeft op een watersysteem of onderdeel daarvan als bedoeld in
      [artikel 3.1][ref1];

      b. een ontgrondingsactiviteit in:

      1°. het winterbed van een tot de rijkswateren behorende rivier; of

      2°. een rijkswater, anders dan in het winterbed van een rivier, waarbij minder dan 100.000 m3 in situ wordt
      ontgraven;

      c. een beperkingengebiedactiviteit met betrekking tot een weg in beheer bij het Rijk, de luchthaven Schiphol, een
      overige burgerluchthaven van nationale betekenis, een burgerluchthaven van regionale betekenis, een hoofdspoorweg
      of een bijzondere spoorweg;

      d. een activiteit anders dan bedoeld in [artikel 4.11, eerste lid, onder a tot en met c][ref2], of in
      [artikel 4.10, eerste lid][ref3], [4.12][ref4] of [4.13][ref5], die geheel of in hoofdzaak plaatsvindt in:

      1°. de territoriale zee voor zover gelegen buiten het provinciaal en gemeentelijk ingedeelde gebied; of

      2°. de exclusieve economische zone;

      e. een omgevingsplanactiviteit in een radarverstoringsgebied als bedoeld in
      [artikel 5.155, eerste lid, van het Besluit kwaliteit leefomgeving][ref6] als het gaat om mogelijke gevolgen voor
      het civiele radarbeeld; of

      f. een omgevingsplanactiviteit in een gebied als bedoeld in
      [artikel 5.161a, eerste lid, van het Besluit kwaliteit leefomgeving][ref7].

      2 Onze Minister van Infrastructuur en Waterstaat is ook adviseur voor een aanvraag om een omgevingsvergunning voor
      zover de aanvraag betrekking heeft op een of meer activiteiten als bedoeld in [artikel 4.11, tweede lid][ref8],
      maar hij op grond van [artikel 4.15, vierde lid][ref9], niet bevoegd is op die aanvraag te beslissen.

      3 De voorgenomen beslissing op de aanvraag, bedoeld in het eerste lid, aanhef en onder a, b, c of d, of tweede
      lid, behoeft ook instemming van Onze Minister van Infrastructuur en Waterstaat, met uitzondering van een aanvraag
      als bedoeld in het eerste lid, aanhef en onder c, die betrekking heeft op een beperkingengebiedactiviteit met
      betrekking tot een burgerluchthaven van regionale betekenis, als de voorgenomen beslissing strekt tot het weigeren
      van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel4.11
