  - number: '4.16'
    text: |-
      1 In afwijking van [artikel 4.6][ref1] beslissen gedeputeerde staten op elke enkel- of meervoudige aanvraag om
      een omgevingsvergunning die betrekking heeft op een of meer activiteiten als bedoeld in [artikel 5.1][ref2] of
      [5.4 van de wet][ref3] als:

      a. die activiteiten geen wateractiviteiten zijn;

      b. die activiteiten worden verricht op dezelfde locatie als een milieubelastende activiteit als bedoeld in
      [artikel 3.51, eerste lid][ref4], [3.55, eerste lid][ref5], [3.58, eerste lid][ref6], [3.61, eerste lid][ref7],
      [3.64, eerste lid][ref8], [3.67, eerste lid][ref9], [3.70, eerste lid][ref10], [3.73, eerste lid][ref11],
      [3.76, eerste lid][ref12], [3.79, eerste lid][ref13], [3.82, eerste lid][ref14], [3.85, eerste lid][ref15],
      [3.88, eerste lid][ref16], of [3.91, eerste lid, van het Besluit activiteiten leefomgeving][ref17]; en

      c. voor de milieubelastende activiteit, bedoeld onder b, een door gedeputeerde staten eerder verleende
      omgevingsvergunning geldt.

      2 Het eerste lid is niet van toepassing als de aanvraag alleen of onder meer betrekking heeft op:

      a. een omgevingsplanactiviteit van nationaal belang;

      b. een milieubelastende activiteit als bedoeld in
      [artikel 3.321, eerste lid, van het Besluit activiteiten leefomgeving][ref18], tenzij het gaat om het aanleggen of
      het exploiteren van een mijnbouwwerk voor het opsporen of winnen van aardwarmte;

      c. een mijnbouwlocatieactiviteit; of

      d. een beperkingengebiedactiviteit met betrekking tot een mijnbouwinstallatie in een waterstaatswerk.


