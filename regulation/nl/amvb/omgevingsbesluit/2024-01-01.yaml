  - number: 10.39a
    text: |-
      1 Degene die op een industrieterrein een activiteit anders dan het wonen verricht, verstrekt op verzoek van de
      gemeenteraad, of provinciale staten als [artikel 2.12a, eerste lid, van de wet][ref1] wordt toegepast, gegevens
      over het geluid door die activiteit voor de vaststelling van een geluidproductieplafond als omgevingswaarde voor
      het industrieterrein.

      2 Het eerste lid geldt niet voor:

      a. informatie die is aangemerkt als staatsgeheim als bedoeld in het
      [Besluit Voorschrift Informatiebeveiliging Rijksdienst Bijzondere Informatie 2013 (VIRBI 2013][ref2]); en

      b. informatie over het geluid door een activiteit waarvoor het omgevingsplan of een omgevingsvergunning voor een
      buitenplanse omgevingsplanactiviteit waarborgt dat het langtijdgemiddelde beoordelingsniveau L van het geluid op
      een afstand van 30 m van de begrenzing van de locatie waar de activiteit wordt verricht, niet meer bedraagt dan de
      standaardwaarden, bedoeld in [tabel 5.65.1 van het Besluit kwaliteit leefomgeving][ref3], verminderd met 5 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2.12a
      [ref2]: https://wetten.overheid.nl/BWBR0033507
      [ref3]: https://wetten.overheid.nl/BWBR0041313#Artikel5.65
