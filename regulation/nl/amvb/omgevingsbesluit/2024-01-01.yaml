  - number: '5.8'
    text: |-
      1 Het bestuursorgaan dat op grond van de [wet][ref1], de [Wegenverkeerswet 1994](onbekend) of de [Wegenwet][ref2]
      bevoegd zou zijn om de besluiten, bedoeld in [artikel 5.7, eerste lid][ref3], te nemen, is adviseur voor dat
      onderdeel van het projectbesluit.

      2 Het in het eerste lid bedoelde onderdeel van het projectbesluit behoeft ook instemming van het adviserende
      bestuursorgaan, waarbij geen instemming is vereist als:

      a. het projectbesluit wordt vastgesteld door Onze Minister die het aangaat als bedoeld in
      [artikel 5.44 van de wet][ref4]; of

      b. het projectbesluit wordt vastgesteld door gedeputeerde staten en het projectbesluit geldt als besluit waarvoor
      een ander bestuursorgaan, met uitzondering van een bestuursorgaan van het Rijk, het adviserende bestuursorgaan is.

      3 Instemming wordt alleen onthouden op dezelfde gronden als die, waarop een aanvraag om een besluit kan worden
      afgewezen.


