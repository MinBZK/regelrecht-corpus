  - number: '14.2'
    text: |-
      1 Als via de landelijke voorziening een aanvraag om een omgevingsvergunning, een maatwerkvoorschrift of
      toestemming tot het treffen van een gelijkwaardige maatregel wordt ingediend, een melding als bedoeld in
      [artikel 4.4, eerste lid, van de wet][ref1] wordt gedaan of aan een informatieverplichting anders dan een melding
      wordt voldaan:

      a. wordt gebruikgemaakt van het elektronische formulier dat op de datum van indiening beschikbaar is in de
      landelijke voorziening; en

      b. worden de daarbij te verstrekken gegevens en bescheiden ook via de landelijke voorziening verstrekt, tenzij het
      bevoegd gezag instemt met een andere wijze van verstrekken.

      2 In afwijking van het eerste lid worden niet via de landelijke voorziening verstrekt:

      a. bijzondere categorieën van persoonsgegevens of persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.1][ref2] respectievelijk [3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3];
      en

      b. informatie die is aangemerkt als staatsgeheim als bedoeld in het
      [Besluit Voorschrift Informatiebeveiliging Rijksdienst Bijzondere Informatie 2013][ref4].

      3 Het bevoegd gezag stelt aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de informatie beschikbaar
      die nodig is om het elektronische formulier te kunnen samenstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref3]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
      [ref4]: https://wetten.overheid.nl/BWBR0033507
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel14.2
