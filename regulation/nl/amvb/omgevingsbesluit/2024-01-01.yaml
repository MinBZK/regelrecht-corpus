  - number: '4.13'
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap beslist op een enkel- of meervoudige aanvraag om een
      omgevingsvergunning als de aanvraag alleen betrekking heeft op een of meer rijksmonumentenactiviteiten met
      betrekking tot een archeologisch monument.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel4.13
  - number: '4.14'
    text: |-
      1 Dit artikel is alleen van toepassing als:

      a. het college van burgemeester en wethouders niet behoort tot de bij de aanvraag betrokken bestuursorganen,
      bedoeld in [artikel 5.12, eerste lid, van de wet][ref1]; en

      b. op grond van de [artikelen 4.6][ref2], [4.7][ref3], [4.9][ref4], [4.10][ref5], [4.11][ref6], [4.11a][ref7],
      [4.12, eerste lid,][ref8] en [4.13][ref9] nog geen bevoegd gezag is aangewezen.

      2 Gedeputeerde staten beslissen op een meervoudige aanvraag om een omgevingsvergunning als de aanvraag alleen
      betrekking heeft op een combinatie van activiteiten die bestaat uit:

      a. een of meer activiteiten als bedoeld in [artikel 4.6, eerste lid][ref10]; en

      b. een of meer activiteiten als bedoeld in [artikel 4.7][ref11].

      3 Onze Minister van Defensie beslist op een meervoudige aanvraag om een omgevingsvergunning als de aanvraag alleen
      betrekking heeft op een combinatie van activiteiten die bestaat uit:

      a. een of meer activiteiten als bedoeld in [artikel 4.9][ref12]; en

      b. een of meer activiteiten als bedoeld in [artikel 4.6, eerste lid][ref13], of [4.7][ref14].

      4 Onze Minister van Economische Zaken en Klimaat beslist op een meervoudige aanvraag om een omgevingsvergunning als
      de aanvraag alleen betrekking heeft op een combinatie van activiteiten die bestaat uit:

      a. een of meer activiteiten als bedoeld in [artikel 4.10, eerste lid][ref15]; en

      b. een of meer activiteiten als bedoeld in [artikel 4.6, eerste lid][ref16], of [4.7][ref17].

      5 Onze Minister van Infrastructuur en Waterstaat beslist op een meervoudige aanvraag om een omgevingsvergunning als
      de aanvraag alleen betrekking heeft op een combinatie van activiteiten die bestaat uit:

      a. een of meer activiteiten als bedoeld in [artikel 4.11, eerste lid][ref18]; en

      b. een of meer activiteiten als bedoeld in [artikel 4.6, eerste lid][ref19], of [4.7][ref20].

      6 Onze Minister van Landbouw, Natuur en Voedselkwaliteit beslist op een meervoudige aanvraag om een
      omgevingsvergunning als de aanvraag alleen betrekking heeft op een combinatie van activiteiten die bestaat uit:

      a. een of meer activiteiten als bedoeld in [artikel 4.11a][ref21]; en

      b. een of meer activiteiten als bedoeld in [artikel 4.6, eerste lid][ref22], of [4.7][ref23].

      7 Onze Minister voor Natuur en Stikstof beslist op een meervoudige aanvraag om een omgevingsvergunning als de
      aanvraag alleen betrekking heeft op een combinatie van activiteiten die bestaat uit:

      a. een of meer activiteiten als bedoeld in [artikel 4.12, eerste lid][ref24]; en

      b. een of meer activiteiten als bedoeld in [artikel 4.6, eerste lid][ref25], of [4.7][ref26].

      8 Voor zover op grond van het tweede tot en met zevende lid nog geen bevoegd gezag is aangewezen, beslist Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties op een meervoudige aanvraag om een omgevingsvergunning als
      de aanvraag betrekking heeft op een combinatie van activiteiten die bestaat uit:

      a. een of meer activiteiten als bedoeld in [artikel 4.9][ref27], [4.10, eerste lid][ref28],
      [4.11, eerste lid][ref29], [4.11a][ref30], [4.12, eerste lid,][ref31] of [4.13][ref32]; en

      b. in voorkomend geval een of meer activiteiten als bedoeld in [artikel 4.6, eerste lid][ref33], of [4.7][ref34].


