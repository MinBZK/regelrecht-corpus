  - number: '10.37'
    text: |-
      Het dagelijks bestuur of het algemeen bestuur van een waterschap verstrekt jaarlijks uiterlijk op 31 oktober
      over elke zwemlocatie waarover het het beheer heeft in ieder geval de volgende gegevens aan Onze Minister van
      Infrastructuur en Waterstaat:

      a. het verslag van de resultaten van de monitoring voor de omgevingswaarde voor een zwemlocatie, bedoeld in
      [artikel 2.19 van het Besluit kwaliteit leefomgeving][ref1];

      b. de uitkomst van de beoordeling van de resultaten van de monitoring voor de omgevingswaarde voor een zwemlocatie,
      bedoeld in [artikel 2.19 van het Besluit kwaliteit leefomgeving][ref2], uitgevoerd in overeenstemming met de bij
      ministeriële regeling gestelde regels; en

      c. een beschrijving van de belangrijkste getroffen beheersmaatregelen, bedoeld in de
      [artikelen 3.7 tot en met 3.9 van het Besluit kwaliteit leefomgeving][ref3].


