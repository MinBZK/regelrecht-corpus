  - number: '14.3'
    text: |-
      1 Een aanvraag of melding die is ingediend of gedaan via de landelijke voorziening geldt als ondertekend.

      2 Gegevens en bescheiden die zijn verstrekt via de landelijke voorziening gelden als ondertekend.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel14.3
  - number: '14.4'
    text: |-
      1 De Dienst, bedoeld in [artikel 2 van de Organisatiewet Kadaster][ref1], stelt voor ontsluiting via de landelijke
      voorziening beschikbaar:

      a. de inhoud van de bij ministeriële regeling aangewezen omgevingsdocumenten, in een zodanige vorm dat de
      informatie in samenhang per geometrisch begrensd object raadpleegbaar is;

      b. informatie over de status van de omgevingsdocumenten, bedoeld onder a; en

      c. informatie uit documenten die zijn opgenomen in de landelijke voorziening, bedoeld in
      [artikel 1.2.1, tweede lid, van het Besluit ruimtelijke ordening][ref2], in een zodanige vorm dat deze begrijpelijk
      en in combinatie met de informatie, bedoeld onder a, raadpleegbaar is.

      2 De Dienst draagt zorg voor het beheer van de ingevolge het eerste lid beschikbaar gestelde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel14.4
    references:
