        artikel: '8.1'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '8.2'
  - number: '7.1'
    text: |-
      1 Een voorkeursrechtbeschikking bevat in ieder geval:

      a. de kadastrale aanduidingen van de onroerende zaak of zaken waarop het voorkeursrecht wordt gevestigd en de naam
      van de gemeente of gemeenten waar die onroerende zaak of zaken zijn gelegen;

      b. de kadastrale grootte van elk van de in de beschikking opgenomen percelen;

      c. als een gedeelte van een perceel in de beschikking wordt opgenomen: de grootte van dat gedeelte;

      d. de namen van de eigenaren van en de beperkt gerechtigden op de in de beschikking opgenomen onroerende zaak of
      zaken volgens de basisregistratie kadaster;

      e. de grondslag op basis waarvan het besluit is genomen;

      f. de eerst mogelijke vervaldatum van het voorkeursrecht;

      g. voor zover van toepassing: de grondslag op basis waarvan eerder een voorkeursrecht is gevestigd op de onroerende
      zaak of zaken en het tijdstip waarop dat voorkeursrecht is vervallen; en

      h. een grondtekening waarop is weergegeven of vermeld:

      1°. de ligging van de percelen of gedeelten van percelen die tot de onroerende zaak of zaken behoren en de
      kadastrale nummers van die percelen op een goed afleesbare en op de tekening vermelde schaalgrootte;

      2°. elke onroerende zaak waarop een voorkeursrecht wordt gevestigd;

      3°. de aansluiting van de onroerende zaak of zaken op het daaromheen gelegen gebied; en

      4°. een noordpijl en de naam van de gemeente of gemeenten.

      2 Een voorkeursrechtbeschikking die betrekking heeft op een provinciaal of nationaal voorkeursrecht, vermeldt ook:

      a. of op de onroerende zaak of zaken al een voorkeursrecht is gevestigd door een ander bestuursorgaan; en

      b. als op de onroerende zaak of zaken al een voorkeursrecht is gevestigd door een ander bestuursorgaan:

      1°. het rechtsgevolg van de voorkeursrechtbeschikking voor het al eerder gevestigde voorkeursrecht;

      2°. als al een uitnodiging tot onderhandeling is gedaan als bedoeld in
      [artikel 9.12, vierde lid, van de wet][ref1]: het rechtsgevolg van de voorkeursrechtbeschikking voor die
      uitnodiging.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel9.12
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '9.12'
  - number: '7.2'
    text: |-
      1 Een besluit tot intrekking van een voorkeursrecht als bedoeld in [artikel 9.5, eerste lid, van de wet][ref1]
      bevat de kadastrale aanduidingen van de onroerende zaak of zaken waarop de intrekking betrekking heeft en de naam
      van de gemeente of gemeenten waar die onroerende zaak of zaken zijn gelegen.

      2 Het eerste lid is van overeenkomstige toepassing op een mededeling als bedoeld in
      [artikel 9.5, derde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel9.5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel9.5
