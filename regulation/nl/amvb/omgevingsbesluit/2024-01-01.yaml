        artikel: '15.53'
      - id: ref2
        bwb_id: BWBR0041330
  - number: '10.1'
    text: |-
      Het bevoegde bestuursorgaan voert voorafgaand aan het nemen van een voorbereidingsbesluit op grond van
      [artikel 4.16, eerste of tweede lid, van de wet][ref1] overleg met het college van burgemeester en wethouders of
      de gemeenteraad.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4.16
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4.16'
  - number: '10.2'
    text: |-
      1 Bij de kennisgeving van het voornemen om een omgevingsplan vast te stellen, bedoeld in
      [artikel 16.29 van de wet][ref1], wordt aangegeven hoe burgers, bedrijven, maatschappelijke organisaties en
      bestuursorganen bij de voorbereiding worden betrokken.

      2 Bij het vaststellen van een omgevingsplan wordt aangegeven hoe burgers, bedrijven, maatschappelijke organisaties
      en bestuursorganen bij de voorbereiding zijn betrokken en wat de resultaten daarvan zijn. Daarbij wordt aangegeven
      op welke wijze invulling is gegeven aan het toepasselijke decentrale participatiebeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16.29
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16.29'
  - number: '10.3'
    text: |-
      1 De gemeenteraad of het college van burgemeester en wethouders zenden een besluit tot vaststelling
      van een omgevingsplan onverwijld aan gedeputeerde staten als sprake is van een geval als bedoeld in
      [artikel 16.21, eerste lid, onder a of b, van de wet][ref1].

      2 Gedeputeerde staten voeren voorafgaand aan het nemen van een besluit als bedoeld in
      [artikel 16.21 van de wet][ref2] overleg met het college van burgemeester en wethouders of de gemeenteraad.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16.21
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel16.21
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.3
