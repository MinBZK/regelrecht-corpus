  - number: 10.6c
    text: |-
      1 Onze Minister voor Natuur en Stikstof draagt zorg voor de actualisatie van de besluiten tot aanwijzing van een
      Natura 2000-gebied, bedoeld in [artikel 2.44, eerste lid, van de wet][ref1], en van de besluiten tot aanwijzing
      van een bijzonder nationaal natuurgebied, bedoeld in artikel 2.44, tweede lid, van de wet.

      2 Bij de actualisatie wordt rekening gehouden met de inzichten die voortkomen uit de monitoring, bedoeld in
      [artikel 11.67 van het Besluit kwaliteit leefomgeving][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2.44
      [ref2]: https://wetten.overheid.nl/BWBR0041313#Artikel11.67
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.6c
