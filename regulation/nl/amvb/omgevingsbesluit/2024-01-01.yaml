  - number: 10.26e
    text: |-
      1 De toelatingsorganisatie neemt binnen twee werkdagen na ontvangst daarvan de gegevens,
      bedoeld in [artikel 7ah, eerste lid, van de Woningwet][ref1], op in het register, bedoeld in
      [artikel 7ai, eerste lid, van die wet][ref2].

      2 Bij het verstrekken van de gegevens, bedoeld in het eerste lid, aan de toelatingsorganisatie vermeldt de
      instrumentaanbieder:

      a. de bedrijfsnaam en de plaats van vestiging van de kwaliteitsborger en het nummer van inschrijving van de
      kwaliteitsborger in het handelsregister;

      b. vermelding van de gevolgklasse en de type bouwwerken waarop de toestemming is gericht;

      c. voor zover van toepassing:

      1°. de reden voor de waarschuwing en de datum waarop de waarschuwing is gegeven;

      2°. de reden voor de schorsing en de datum en de termijn van de schorsing; en

      3°. de reden voor de intrekking en de datum van de intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ah
