  - number: 10.42b
    text: |-
      1 Voor industrieterreinen in een gemeente die niet ligt in een bij ministeriële regeling aangewezen agglomeratie,
      doet het college van burgemeester en wethouders voor 18 juli 2029 en daarna elke vijf jaar verslag van de
      resultaten van de monitoring, bedoeld in [artikel 11.45 van het Besluit kwaliteit leefomgeving][ref1], en de wijze
      waarop is voldaan aan de resultaatsverplichting, bedoeld in [artikel 3.44 van dat besluit][ref2]. Het verslag
      bevat daarnaast:

      a. een overzicht van de op grond van [artikel 2.11a van de wet][ref3] vastgestelde geluidproductieplafonds waarbij
      toepassing is gegeven aan [artikel 3.37 van het Besluit kwaliteit leefomgeving][ref4];

      b. een beschrijving van de ontwikkelingen van het bronbeleid en andere relevante ontwikkelingen die van invloed
      kunnen zijn op de geluidproductieplafonds als bedoeld onder a;

      c. een motivering of de ontwikkelingen, bedoeld onder b, aanleiding geven tot intrekking of wijziging van
      geluidproductieplafonds als bedoeld onder a;

      d. de conclusies naar aanleiding van de resultaten van de monitoring, bedoeld in
      [artikel 11.45 van het Besluit kwaliteit leefomgeving][ref5]; en

      e. een overzicht van de maatregelen die naar verwachting de komende vijf jaar nodig zijn om te voldoen aan de
      resultaatsverplichting, bedoeld in [artikel 3.44 van het Besluit kwaliteit leefomgeving][ref6].

      2 Onze Minister van Infrastructuur en Waterstaat doet jaarlijks verslag van de resultaten van de monitoring,
      bedoeld in [artikel 11.45 van het Besluit kwaliteit leefomgeving][ref7], en de wijze waarop is voldaan aan de
      resultaatsverplichting, bedoeld in [artikel 3.44 van dat besluit][ref8].

      3 De beheerder, bedoeld in [artikel 1, eerste lid, van de Spoorwegwet][ref9], doet jaarlijks aan Onze
      Minister van Infrastructuur en Waterstaat verslag van de resultaten van de monitoring, bedoeld in
      [artikel 11.45 van het Besluit kwaliteit leefomgeving][ref10], en de wijze waarop is voldaan aan de
      resultaatsverplichting, bedoeld in [artikel 3.44 van dat besluit][ref11].

      4 Als toepassing is gegeven aan [artikel 3.46, tweede lid, van het Besluit kwaliteit leefomgeving][ref12],
      doen het college van burgemeesters en wethouders en gedeputeerde staten elk jaar voor 18 juli voor de betrokken
      geluidproductieplafonds verslag van de monitoring, bedoeld in [artikel 11.45 van dat besluit][ref13].

      5 Het verslag van de monitoring wordt voor een ieder elektronisch beschikbaar gesteld.


