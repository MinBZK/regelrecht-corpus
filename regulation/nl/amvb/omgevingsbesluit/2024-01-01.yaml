      Het dagelijks bestuur van het waterschap, gedeputeerde staten en Onze Minister van Infrastructuur en Waterstaat
      stellen aan het eind van de looptijd van een waterbeheerprogramma als bedoeld in [artikel 3.7 van de wet][ref1],
      een regionaal waterprogramma als bedoeld in [artikel 3.8, tweede lid, van de wet][ref2] respectievelijk
      het nationale waterprogramma, bedoeld in [artikel 3.9, tweede lid, onder e, van de wet][ref3], elektronisch
      beschikbaar:

      a. een verslag over de resultaten van de monitoring voor de omgevingswaarden voor
      waterkwaliteit, bedoeld in de [artikelen 2.10][ref4], [2.11][ref5], [2.13][ref6], [2.14][ref7] en
      [2.15 van het Besluit kwaliteit leefomgeving][ref8]; en

      b. een verslag als bedoeld in [artikel 11.41 van het Besluit kwaliteit leefomgeving][ref9] over de resultaten van
      de monitoring van de andere parameters, bedoeld in [artikel 11.27 van dat besluit][ref10].


