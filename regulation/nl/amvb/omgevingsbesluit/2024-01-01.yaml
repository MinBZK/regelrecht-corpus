  - number: '10.40'
    text: |-
      1 Gedeputeerde staten verstrekken elke vijf jaar uiterlijk op 31 maart de gegevens, bedoeld in
      [artikel 11.49, eerste lid, van het Besluit kwaliteit leefomgeving][ref1], aan Onze Minister van Infrastructuur
      en Waterstaat.

      2 Onze Minister van Infrastructuur en Waterstaat publiceert elke vijf jaar uiterlijk op 29 juni in de
      Staatscourant:

      a. de door gedeputeerde staten verstrekte gegevens; en

      b. de gegevens, bedoeld in [artikel 11.49, tweede lid, van het Besluit kwaliteit leefomgeving][ref2].


