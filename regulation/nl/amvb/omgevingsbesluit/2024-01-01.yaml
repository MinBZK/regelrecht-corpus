  - number: '14.1'
    text: |-
      1 Via de landelijke voorziening kan worden ingediend of gedaan:

      a. een aanvraag om een omgevingsvergunning;

      b. een aanvraag om een maatwerkvoorschrift;

      c. een aanvraag om toestemming tot het treffen van een gelijkwaardige maatregel; en

      d. een melding als bedoeld in [artikel 4.4, eerste lid, van de wet][ref1].

      2 Via de landelijke voorziening kan worden voldaan aan een andere informatieverplichting dan een melding, tenzij
      bij wettelijk voorschrift een andere wijze is aangewezen waarop aan de informatieverplichting wordt voldaan.

      3 Dit artikel is niet van toepassing op een aanvraag, een melding of informatie:

      a. die is aangemerkt als staatsgeheim als bedoeld in het
      [Besluit Voorschrift Informatiebeveiliging Rijksdienst Bijzondere Informatie 2013][ref2]; of

      b. met betrekking tot:

      1°. een jachtgeweeractiviteit;

      2°. een valkeniersactiviteit;

      3°. een flora- en fauna-activiteit van nationaal belang als bedoeld in [artikel 4.12, derde lid, onder c][ref3];

      4°. een activiteit met betrekking tot dieren, planten of producten daarvan als bedoeld in
      [artikel 11.96 van het Besluit activiteiten leefomgeving][ref4]; of

      5°. een activiteit met betrekking tot de introductie of verspreiding van invasieve uitheemse soorten als bedoeld in
      [artikel 11.108 van het Besluit activiteiten leefomgeving][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0033507
      [ref3]: https://wetten.overheid.nl/BWBR0041278#Artikel4.12
      [ref4]: https://wetten.overheid.nl/BWBR0041330#Artikel11.96
      [ref5]: https://wetten.overheid.nl/BWBR0041330#Artikel11.108
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel14.1
