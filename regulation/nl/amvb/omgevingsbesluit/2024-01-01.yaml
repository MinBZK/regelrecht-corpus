  - number: '13.11'
    text: |-
      1 De bestuursorganen, bedoeld in [artikel 13.5][ref1], rapporteren jaarlijks over de mate waarin uitvoering van het
      uitvoeringsprogramma heeft plaatsgevonden en de mate waarin deze uitvoering heeft bijgedragen aan het bereiken van
      de doelen, bedoeld in het eerste lid van dat artikel.

      2 Naar aanleiding van de in het eerste lid bedoelde rapportage wordt de uitvoerings- en handhavingsstrategie bezien
      en zo nodig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel13.5
