  - number: '8.21'
    text: |-
      1 Als categorieën ontwikkelingen ter verbetering van de kwaliteit van de fysieke leefomgeving waarvoor, als wordt
      voldaan aan de criteria van [artikel 13.23, eerste lid, onder a en b, van de wet][ref1], in een omgevingsplan
      kan worden bepaald dat een financiële bijdrage wordt verhaald op degene die een activiteit als bedoeld in
      [artikel 13.11 van de wet][ref2] verricht, worden aangewezen:

      a. wijziging van de inrichting van het landelijk gebied ter verbetering van landschappelijke waarden door
      middel van het treffen van maatregelen in de fysieke leefomgeving, waaronder in ieder geval worden begrepen het
      verwijderen van vrijkomende agrarische bebouwing en het herstellen of aanvullen van landschappelijke elementen;

      b. aanleg of wijziging van gebieden als bedoeld in [artikel 2.44 van de wet][ref3] of gebieden die in het
      omgevingsplan ter bescherming van de natuur zijn aangewezen en herstel, op basis van een omgevingsvisie of
      programma, van dier- en plantensoorten die van nature in Nederland in het wild voorkomen door middel van het
      treffen van maatregelen in de fysieke leefomgeving, waaronder in ieder geval worden begrepen maatregelen in de
      fysieke leefomgeving:

      1°. ter vermindering van de stikstofdepositie; of

      2°. ter bescherming en verbetering van de chemische en ecologische kwaliteit van watersystemen;

      c. aanleg van infrastructuur voor verkeers- en openbaar vervoersnetwerken van gemeentelijk of regionaal belang;

      d. aanleg van recreatievoorzieningen die behoren tot de gemeentelijke of regionale groenstructuur, waaronder in
      ieder geval worden begrepen parken en recreatiegebieden;

      e. ontwikkelingen gericht op het bereiken van een naar prijsklasse evenwichtige samenstelling van de woningvoorraad
      in de gemeente of regio door middel van het realiseren van sociale huur- of koopwoningen als bedoeld in
      [artikel 5.161c, eerste lid, onder a en b, van het Besluit kwaliteit leefomgeving][ref4] buiten het gebied waar
      de activiteit, bedoeld in [artikel 13.11 van de wet][ref5], plaatsvindt, voor zover in dat gebied met het oog op
      die evenwichtige samenstelling onvoldoende sociale huur- of koopwoningen worden gerealiseerd en het op een andere
      locatie realiseren van die woningen:

      1°. in het omgevingsplan is toegelaten of voorgeschreven op grond van regels als bedoeld in
      [artikel 5.161c, eerste lid, onder a of b, van dat besluit][ref6] of in een programma is opgenomen; en

      2°. tot gevolg heeft dat de kosten, bedoeld in [artikel 13.11 van de wet][ref7], op grond van het eerste lid van
      dat artikel niet volledig kunnen worden verhaald of dat een tekort op de gemeentelijke exploitatie van de benodigde
      gronden ontstaat; en

      f. stedelijke herstructurering ter verbetering van het woon- en leefklimaat in verouderde wijken of gebieden met
      leegstandsproblemen door middel van het treffen van maatregelen in de fysieke leefomgeving, waaronder in ieder
      geval worden begrepen het slopen van woningen en het aanleggen of wijzigen van wegen.

      2 Onder de aanwijzing valt niet de aanleg van voorzieningen of het treffen van maatregelen in de fysieke
      leefomgeving waarvoor kosten worden gemaakt die op grond van [artikel 13.11, eerste lid, van de wet][ref8] geheel
      of gedeeltelijk moeten worden verhaald op degene die de betrokken activiteit verricht.


