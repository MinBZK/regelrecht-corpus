      1 Onze Minister van Defensie is adviseur voor een aanvraag om een omgevingsvergunning voor zover de aanvraag
      betrekking heeft op:

      a. een beperkingengebiedactiviteit met betrekking tot een militaire luchthaven; of

      b. een omgevingsplanactiviteit in een radarverstoringsgebied als bedoeld in
      [artikel 5.155, derde lid, van het Besluit kwaliteit leefomgeving][ref1] als het gaat om mogelijke gevolgen voor
      het militaire radarbeeld.

      2 De voorgenomen beslissing op de aanvraag, bedoeld in het eerste lid, aanhef en onder a, behoeft ook instemming
      van Onze Minister van Defensie.


