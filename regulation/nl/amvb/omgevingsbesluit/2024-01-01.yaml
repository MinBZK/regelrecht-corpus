  - number: '8.12'
    text: |-
      Het bevoegd gezag bepaalt in het vergunningvoorschrift over financiële zekerheid dat, binnen een door het bevoegd
      gezag te bepalen redelijke termijn nadat dat voorschrift aan de vergunning is verbonden, bewijs wordt verstrekt dat
      financiële zekerheid is gesteld.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel8.12
  - number: '8.13'
    text: |-
      Bouwactiviteiten waarvan kosten worden verhaald als bedoeld in
      [artikel 13.11, eerste lid, aanhef, van de wet][ref1], zijn:

      a. de bouw van een of meer gebouwen met een woonfunctie;

      b. de bouw van een of meer hoofdgebouwen anders dan gebouwen met een woonfunctie;

      c. de uitbreiding van een gebouw met ten minste 1.000 m2 bruto-vloeroppervlakte of met een of meer gebouwen met
      een woonfunctie;

      d. de bouw van een gebouw dat geen hoofdgebouw als bedoeld onder b is, met ten minste 1.000 m2 bruto-
      vloeroppervlakte;

      e. de verbouwing van een of meer aaneengesloten gebouwen met andere gebruiksfuncties dan een woonfunctie tot
      gebouwen met een woonfunctie, mits het ten minste tien woonfuncties betreft; of

      f. de verbouwing van een of meer aaneengesloten gebouwen met andere gebruiksfuncties dan een kantoorfunctie,
      een winkelfunctie of een bijeenkomstfunctie voor het verstrekken van consumpties voor het gebruik ter plaatse
      tot gebouwen met een of meer van deze gebruiksfuncties, mits de cumulatieve bruto-vloeroppervlakte van de nieuwe
      gebruiksfuncties ten minste 1.500 m2 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel13.11
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '13.11'
  - number: '8.14'
    text: |-
      Het bevoegd gezag kan beslissen kosten niet te verhalen als:

      a. het totaal van de verschuldigde geldsommen dat op grond van [artikel 13.18 van de wet][ref1] kan worden
      verhaald, minder bedraagt dan € 10.000,–;

      b. er geen verhaalbare kosten als bedoeld in de onderdelen A5 tot en met A9 van [bijlage IV][ref2] zijn; of

      c. de verhaalbare kosten alleen de aansluiting van een locatie op de openbare ruimte of de aansluiting op
      nutsvoorzieningen betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel13.18
      [ref2]: https://wetten.overheid.nl/BWBR0041278
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel8.14
