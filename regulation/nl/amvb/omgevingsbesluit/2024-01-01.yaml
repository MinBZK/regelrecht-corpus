        artikel: '2.34'
  - number: '10.23'
    text: |-
      1 In een omgevingsvergunning voor een bouwactiviteit die betrekking heeft op een tijdelijk bouwwerk wordt bepaald
      dat de vergunninghouder na het verstrijken van een bij de omgevingsvergunning gestelde termijn van ten hoogste
      vijftien jaar, verplicht is de voor de verlening van de omgevingsvergunning bestaande toestand te hebben hersteld.

      2 Als de in de omgevingsvergunning voor een bouwactiviteit bepaalde termijn korter is dan vijftien jaar, kan die
      termijn worden verlengd tot ten hoogste vijftien jaar.

      3 In een omgevingsvergunning voor een jachtgeweeractiviteit wordt bepaald dat die geldt:

      a. voor een daarbij gestelde termijn van ten hoogste een jaar, binnen een periode die loopt van 1 april tot 1 april
      van het daaropvolgende jaar; of

      b. als dat eerder is, tot het tijdstip waarop een rechterlijke uitspraak ten uitvoer kan worden gelegd waarbij de
      bevoegdheid tot het gebruik van een geweer ter uitvoering van de [wet][ref1] is ontzegd.

      4 In een omgevingsvergunning voor een valkeniersactiviteit wordt bepaald dat die geldt:

      a. voor een daarbij gestelde termijn van ten hoogste vijf jaar, binnen een periode die loopt van 1 april tot
      1 april van het vijfde daaropvolgende jaar; of

      b. als dat eerder is, tot het tijdstip waarop een rechterlijke uitspraak ten uitvoer kan worden gelegd waarbij de
      bevoegdheid tot het gebruik van een roofvogel ter uitvoering van de [wet][ref2] is ontzegd.

      5 Als toepassing wordt gegeven aan [artikel 8.74u][ref3] of [8.74x van het Besluit kwaliteit leefomgeving][ref4]
      en een omgevingsvergunning aan niet in Nederland woonachtige personen wordt verleend, wordt in de
      omgevingsvergunning voor een jachtgeweeractiviteit en in de omgevingsvergunning voor een valkeniersactiviteit
      bepaald dat die geldt voor een daarbij gestelde termijn van ten hoogste zes opeenvolgende in de vergunning vermelde
      dagen.


