        artikel: 3.48b
  - number: '4.12'
    text: |-
      1 Onze Minister voor Natuur en Stikstof beslist op een enkel- of meervoudige aanvraag om een omgevingsvergunning
      als de aanvraag alleen betrekking heeft op een of meer van de volgende activiteiten:

      a. een Natura 2000-activiteit van nationaal belang; of

      b. een flora- en fauna-activiteit van nationaal belang.

      2 De volgende Natura 2000-activiteiten en de volgende flora- en fauna-activiteiten als bedoeld in de
      [artikelen 11.37][ref1], [11.39][ref2], [11.40][ref3], [11.46][ref4], [11,47, aanhef en onder b][ref5],
      [11.48][ref6], [11.54][ref7]. [11.60][ref8] en [11.61 van het Besluit activiteiten leefomgeving][ref9] worden als
      activiteiten van nationaal belang aangewezen:

      a. een activiteit voor het aanleggen, uitbreiden, inrichten, wijzigen, gebruiken, beheren of onderhouden van:

      1°. een autoweg, autosnelweg, vaarweg, hoofdspoorweg of bijzondere spoorweg, voor zover deze weg wordt beheerd
      door het Rijk en voor zover de activiteit rechtstreeks samenhangt met het vervoer en transport via deze weg of de
      inpassing in de fysieke leefomgeving;

      2°. een primaire waterkering in beheer bij het Rijk en doorgangen in deze waterkeringen, voor zover de activiteit
      rechtstreeks samenhangt met de waterveiligheid of de inpassing in de fysieke leefomgeving;

      3°. een militair terrein en een terrein met een militair object als bedoeld in
      [artikel 5.150, eerste lid, van het Besluit kwaliteit leefomgeving][ref10], voor zover de activiteit rechtstreeks
      samenhangt met militaire doeleinden of de inpassing in de fysieke leefomgeving;

      4°. een militaire luchthaven;

      5°. de luchthaven Schiphol of een overige burgerluchthaven van nationale betekenis, voor zover de activiteit
      rechtstreeks samenhangt met het vervoer en transport via deze luchthaven of met de inpassing in de fysieke
      leefomgeving;

      6°. het gastransportnet, bedoeld in [artikel 1, eerste lid, onder n, van de Gaswet][ref11], en de daarmee
      verbonden gasdrukregelstations en gasdrukmeetstations, voor zover de activiteit rechtstreeks samenhangt met het
      gastransport; en

      7°. een hoogspanningsverbinding met een spanning van ten minste 220 kV en de daarmee verbonden schakel-
      en transformatorstations en andere hulpmiddelen, voor zover de activiteit rechtstreeks samenhangt met de
      elektriciteitsvoorziening;

      b. een activiteit die rechtstreeks samenhangt met:

      1°. het voorkomen of tegengaan van landwaartse verplaatsing van de kustlijn als bedoeld in
      [artikel 2.19, tweede lid, onder b, van de wet][ref12];

      2°. landaanwinning in de territoriale zee; of

      3°. het opsporen, winnen of opslaan van:

      i. delfstoffen als bedoeld in [artikel 1, onder a, van de Mijnbouwwet][ref13] die zich bevinden op een diepte van
      meer dan 100 m beneden de oppervlakte van de aardbodem; of

      ii. aardwarmte als bedoeld in [artikel 1, onder b, van de Mijnbouwwet][ref14] die zich bevindt op een diepte van
      meer dan 500 m beneden de oppervlakte van de aardbodem;

      c. een activiteit van het Rijk die nodig is voor de ontwikkeling, werking en bescherming van de hoofdwateren,
      bedoeld in [bijlage II][ref15], onder 1, onder A;

      d. een militaire activiteit, verricht door de Nederlandse of een bondgenootschappelijke krijgsmacht, buiten de
      onder a, onder 3°, bedoelde terreinen, en buiten de onder a, onder 4°, bedoelde militaire luchthavens;

      e. een vlucht met opsporings- of reddingshelikopters buiten de reguliere routes;

      f. de uitoefening van een van de volgende vormen van commerciële visserij of vanwege onderzoek uitgevoerde
      visserij:

      1°. niet-handmatige schaal- en schelpdiervisserij, met inbegrip van het invangen van schelpdierenzaad en van
      schelpdiercultures en het uitzetten van schelpdieren; of

      2°. sleepnetvisserij in zoute wateren;

      g. een lozingsactiviteit, inhoudende het brengen van afvalwater in de Waddenzee;

      h. een activiteit verricht door of namens een buitenlandse mogendheid;

      i. een activiteit die rechtstreeks uitvoering geeft aan het op 19 april 1839 te Londen gesloten Tractaat tussen
      het Koninkrijk der Nederlanden en het Koninkrijk België betreffende de scheiding der wederzijdse grondgebieden
      (Trb. 1966, nr. 161);

      j. een activiteit van of namens een lid van het Koninklijk Huis of op terreinen waar de Kroondrager gerechtigd is
      tot het uitoefenen van de jacht; en

      k. een activiteit die geheel of grotendeels plaatsvindt in:

      1°. het grensgebied, bedoeld in artikel 1 van de op 14 mei 1962 te Bennekom tot stand gekomen aanvullende
      Overeenkomst bij het Eems-Dollardverdrag (Trb. 1962, nr. 54);

      2°. niet-provinciaal ingedeeld gebied; of

      3°. de exclusieve economische zone.

      3 Als flora- en fauna-activiteiten van nationaal belang worden ook aangewezen:

      a. een activiteit als bedoeld in [artikel 11.38, eerste lid, van het Besluit activiteiten leefomgeving][ref16];

      b. een activiteit als bedoeld in
      [artikel 11.47, eerste lid, aanhef en onder a, van het Besluit activiteiten leefomgeving][ref17];

      c. een activiteit als bedoeld in [artikel 11.37, eerste lid][ref18], [11.39, eerste lid][ref19],
      [11.46, eerste lid][ref20], [11.47, eerste lid, aanhef en onder b][ref21], of
      [11.54, eerste lid, van het Besluit activiteiten leefomgeving][ref22], als het gaat om:

      1°. het vangen of onder zich hebben van zieke of gewonde dieren ten behoeve van vervoer in een motorvoertuig dat is
      ingericht en bestemd om te worden gebruikt voor het vervoer van zieke of gewonde dieren;

      2°. het zich toe-eigenen en onder zich hebben van een dood uit het wild afkomstig dier, dat buiten schuld of
      medeweten van degene die zich het dier toe-eigent is gestorven, met het oog op het prepareren ervan;

      3°. het onder zich hebben van een geprepareerd uit het wild afkomstig dier; of

      4°. het onder zich hebben van dieren of planten die vanuit een ander land binnen het grondgebied van Nederland
      zijn gebracht;

      d. een activiteit als bedoeld in [artikel 11.40 van het Besluit activiteiten leefomgeving][ref23] waarbij gebruik
      wordt gemaakt van motorboten op open zee als bedoeld in bijlage IV, onder b, tweede gedachtestreep, tweede zin, bij
      de vogelrichtlijn;

      e. een activiteit als bedoeld in [artikel 11.46, eerste lid][ref24], [11.47, eerste lid, aanhef en onder b][ref25],
      of [11.54, eerste lid, van het Besluit activiteiten leefomgeving][ref26], als het gaat om het vangen en onder zich
      hebben van bruinvissen, gewone dolfijnen, gewone zeehonden, grijze zeehonden, tuimelaars, witflankdolfijnen of
      witsnuitdolfijnen ten behoeve van:

      1°. het opvangen en verzorgen van zieke of gewonde dieren van deze soorten in een opvangcentrum; of

      2°. het doen van wetenschappelijk onderzoek; en

      f. activiteiten als bedoeld in [artikel 11.61, eerste lid, van het Besluit activiteiten leefomgeving][ref27], als
      het gaat om:

      1°. herintroductie van soorten;

      2°. het uitzetten van dieren voor het bestrijden van ziekten, plagen of onkruiden;

      3°. het uitzetten van dieren samen met de onder 2° bedoelde dieren, als prooidieren voor die dieren; of

      4°. het uitzetten van dieren of eieren van dieren buiten het natuurlijke verspreidingsgebied van de soort.

      4 Onze Minister voor Natuur en Stikstof beslist op een enkelvoudige aanvraag om een omgevingsvergunning als de
      aanvraag betrekking heeft op een valkeniersactiviteit.


