    text: |-
      1 Als in [bijlage V][ref1], kolom 4, de omgevingsvergunning voor een milieubelastende activiteit is aangewezen,
      wordt ook de omgevingsvergunning voor een lozingsactiviteit van afvalwater op een oppervlaktewaterlichaam of een
      zuiveringtechnisch werk bedoeld voor zover in [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref2] is
      bepaald dat het is verboden om:

      a. zonder omgevingsvergunning die milieubelastende activiteit te verrichten; en

      b. zonder omgevingsvergunning afvalwater afkomstig van die activiteit op een oppervlaktewaterlichaam of een
      zuiveringtechnisch werk te lozen.

      2 Als geen sprake is van een besluit als bedoeld in [artikel 11.6, derde lid][ref3], kan het bevoegd gezag
      een ander besluit aanwijzen dat nodig is voor een project waarvoor moet worden beoordeeld of dat aanzienlijke
      milieueffecten kan hebben en, als dat het geval is, waarvoor bij de voorbereiding van dat besluit een
      milieueffectrapport moet worden gemaakt.

      3 Als voor een project een omgevingsvergunning voor een omgevingsplanactiviteit wordt aangevraagd,
      wordt die omgevingsvergunning voor een omgevingsplanactiviteit aangemerkt als het besluit, bedoeld in
      [artikel 16.43, eerste lid, van de wet][ref4], in plaats van het besluit tot vaststelling van een omgevingsplan,
      bedoeld in [bijlage V][ref5], kolom 4.


