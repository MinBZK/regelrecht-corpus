  - number: '1.3'
    text: |-
      1 Het verbod, bedoeld in [artikel 1.7a, eerste lid, van de wet][ref1], om een activiteit te verrichten of na
      te laten als door het verrichten of nalaten daarvan aanzienlijke nadelige gevolgen voor de fysieke leefomgeving
      ontstaan of dreigen te ontstaan, geldt voor de volgende activiteiten en nadelige gevolgen:

      a. direct of indirect stoffen, trillingen, warmte of geluid in water, bodem of lucht brengen, waardoor aanzienlijke
      schade aan de kwaliteit van water, bodem of lucht of aan landschappen, natuur of cultureel erfgoed ontstaat of
      dreigt te ontstaan;

      b. het met het oog op het gebruik van de bodem in of op de bodem brengen van stoffen of activiteiten die erosie,
      verdichting of verzilting tot gevolg hebben, als dat leidt tot aantasting of dreigende aantasting van de bodem; en

      c. het verwaarlozen van een beschermd landschap, beschermde natuur of beschermd cultureel erfgoed, als dat
      aanzienlijke nadelige gevolgen heeft of dreigt te hebben voor de beschermde waarden.

      2 Voor de toepassing van het eerste lid, aanhef en onder c, wordt onder beschermd verstaan: beschermd bij wettelijk
      voorschrift of besluit op grond van de [wet][ref2] of een andere wet.


