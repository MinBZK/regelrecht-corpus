  - number: '4.27'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is adviseur voor een aanvraag om een
      omgevingsvergunning voor zover de aanvraag betrekking heeft op een bouwactiviteit en het voornemen
      bestaat om bij de beslissing op de aanvraag in een voorschrift van de omgevingsvergunning op grond
      van [artikel 4.5 van het Besluit bouwwerken leefomgeving][ref1] af te wijken van een regel uit
      [hoofdstuk 4 van dat besluit][ref2].

      2 De voorgenomen beslissing op de aanvraag behoeft ook instemming van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een aanvraag om een maatwerkvoorschrift om af te
      wijken van een regel als bedoeld in het eerste lid.

      4 Het eerste, tweede en derde lid zijn van niet toepassing op het met een vergunningvoorschrift of
      maatwerkvoorschrift afwijken van [artikel 4.103 van het Besluit bouwwerken leefomgeving][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0041297#Artikel4.5
      [ref2]: https://wetten.overheid.nl/BWBR0041297#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0041297#Artikel4.103
