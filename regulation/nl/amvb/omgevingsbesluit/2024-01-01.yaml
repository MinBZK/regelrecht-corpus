  - number: '8.5'
    text: |-
      De gevallen, bedoeld in [artikel 13.5, eerste lid, van de wet][ref1], waarvoor aan een omgevingsvergunning het
      voorschrift kan worden verbonden dat degene die de activiteit verricht financiële zekerheid stelt, zijn:

      a. een wateractiviteit;

      b. een ontgrondingsactiviteit;

      c. het op of in de bodem brengen van bedrijfsafvalstoffen of gevaarlijke afvalstoffen, bedoeld in
      [artikel 3.40b van het Besluit activiteiten leefomgeving][ref2];

      d. het verbranden van bedrijfsafvalstoffen of gevaarlijke afvalstoffen, bedoeld in
      [artikel 3.40d van het Besluit activiteiten leefomgeving][ref3];

      e. het exploiteren van een ippc-installatie voor het behandelen van afvalwater, bedoeld in
      [artikel 3.41, onder a, van het Besluit activiteiten leefomgeving][ref4];

      f. het exploiteren van een zuiveringsvoorziening voor het zuiveren van ingezameld of afgegeven afvalwater, bedoeld
      in [artikel 3.41, onder b, van het Besluit activiteiten leefomgeving][ref5];

      g. het exploiteren van een ippc-installatie voor het verwijderen of nuttig toepassen van gevaarlijke afvalstoffen,
      bedoeld in [artikel 3.78, eerste lid, onder a, van het Besluit activiteiten leefomgeving][ref6];

      h. het exploiteren van een ippc-installatie voor het verwijderen of nuttig toepassen van ongevaarlijke
      afvalstoffen, bedoeld in [artikel 3.78, eerste lid, onder b, van het Besluit activiteiten leefomgeving][ref7];

      i. het exploiteren van een ippc-installatie voor het tijdelijk opslaan van gevaarlijke afvalstoffen, bedoeld in
      [artikel 3.78, eerste lid, onder c, van het Besluit activiteiten leefomgeving][ref8];

      j. het exploiteren van een ippc-installatie voor het ondergronds opslaan van gevaarlijke afvalstoffen, bedoeld in
      [artikel 3.78, eerste lid, onder d, van het Besluit activiteiten leefomgeving][ref9];

      k. het exploiteren van een ippc-installatie voor de destructie of het verwerken van kadavers of dierlijk afval,
      bedoeld in [artikel 3.81 van het Besluit activiteiten leefomgeving][ref10];

      l. het exploiteren van een ippc-installatie voor het storten van afvalstoffen, bedoeld in
      [artikel 3.84, eerste lid, onder a, van het Besluit activiteiten leefomgeving][ref11];

      m. het exploiteren van een andere milieubelastende installatie voor het storten
      van bedrijfsafvalstoffen of gevaarlijke afvalstoffen op een stortplaats, bedoeld in
      [artikel 3.84, eerste lid, onder b, van het Besluit activiteiten leefomgeving][ref12];

      n. het exploiteren van een andere milieubelastende installatie voor het storten
      of verzamelen van winningsafvalstoffen in een winningsafvalvoorziening, bedoeld in
      [artikel 3.84, eerste lid, onder c, van het Besluit activiteiten leefomgeving][ref13];

      o. het exploiteren van een ippc-installatie voor het verwijderen of het nuttig toepassen van
      afvalstoffen in een afvalverbrandingsinstallatie of afvalmeeverbrandingsinstallatie, bedoeld in
      [artikel 3.87 van het Besluit activiteiten leefomgeving][ref14];

      p. het demonteren van ingezamelde of afgegeven autowrakken of wrakken van tweewielige motorvoertuigen, bedoeld in
      [artikel 3.152 van het Besluit activiteiten leefomgeving][ref15];

      q. het voorbehandelen van ingezameld of afgegeven rubberafval of kunststofafval voor verdere recycling, bedoeld in
      [artikel 3.159 van het Besluit activiteiten leefomgeving][ref16];

      r. het voorbehandelen van ingezameld of afgegeven metaalafval voor verdere recycling, bedoeld in
      [artikel 3.163 van het Besluit activiteiten leefomgeving][ref17]; en

      s. het verwerken van bedrijfsafvalstoffen of gevaarlijke afvalstoffen, bedoeld in
      [artikel 3.184 van het Besluit activiteiten leefomgeving][ref18].


