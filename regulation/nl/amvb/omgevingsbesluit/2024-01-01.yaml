  - number: '10.38'
    text: |-
      Onze Minister van Infrastructuur en Waterstaat stelt een verslag van de resultaten van de monitoring van de
      omgevingswaarde voor zwemlocaties, bedoeld in [artikel 2.19 van het Besluit kwaliteit leefomgeving][ref1],
      elektronisch beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel2.19
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.38
    references:
      - id: ref1
        bwb_id: BWBR0041313
        artikel: '2.19'
  - number: '10.39'
    text: |-
      1 Gedeputeerde staten lichten het publiek gedurende het badseizoen voor over:

      a. de indeling van de zwemlocaties in klassen, bedoeld in bijlage II bij de zwemwaterrichtlijn, de ingestelde
      negatieve zwemadviezen en opgelegde zwemverboden;

      b. de risico’s voor de gezondheid en de veiligheid van zwemmers:

      1°. als zich een overmatige groei van cyanobacteriën of een neiging tot overmatige groei van macroalgen of
      marien fytoplankton voordoet en gedeputeerde staten een gezondheidsrisico vaststellen of vermoeden als bedoeld in
      [artikel 3.7 van het Besluit kwaliteit leefomgeving][ref1];

      2°. als sprake is van een zwemwaterverontreiniging als bedoeld in
      [artikel 11.44, eerste lid, aanhef en onder c, van het Besluit kwaliteit leefomgeving][ref2]; en

      3°. als sprake is van onverwachte situaties die negatieve gevolgen hebben of redelijkerwijs kunnen hebben op de
      kwaliteit van de zwemlocatie en op de gezondheid van zwemmers;

      c. de getroffen zwemwaterbeheersmaatregelen, bedoeld in [artikel 3.8 van het Besluit kwaliteit leefomgeving][ref3],
      als dat naar hun oordeel nodig is; en

      d. de uitkomsten van het onderzoek, bedoeld in [artikel 3.5 van het Besluit kwaliteit leefomgeving][ref4], als de
      uitkomsten niet leiden tot een negatief zwemadvies of een zwemverbod.

      2 Gedeputeerde staten geven in de nabijheid van een zwemlocatie op passende wijze voorlichting, via de media en
      langs elektronische weg, zodra de informatie beschikbaar is.

      3 In de gevallen, bedoeld in het eerste lid, aanhef en onder a tot en met c, bestaat de voorlichting in ieder geval
      uit:

      a. het plaatsen van een bord in de nabijheid van de zwemlocatie op een zichtbare en gemakkelijk toegankelijke
      plaats met de informatie, bedoeld in artikel 12, eerste lid, van de zwemwaterrichtlijn; en

      b. het verspreiden van de informatie, bedoeld in artikel 12, tweede lid, van de zwemwaterrichtlijn via internet, zo
      nodig ook in andere talen.


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel3.7
      [ref2]: https://wetten.overheid.nl/BWBR0041313#Artikel11.44
      [ref3]: https://wetten.overheid.nl/BWBR0041313#Artikel3.8
      [ref4]: https://wetten.overheid.nl/BWBR0041313#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.39
