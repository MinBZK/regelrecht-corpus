  - number: '8.17'
    text: |-
      1 De raming van de inbrengwaarde, bedoeld in [artikel 13.17 van de wet][ref1], wordt vastgesteld:

      a. met overeenkomstige toepassing van de [artikelen 15.21 tot en met 15.24 van de wet][ref2], met dien
      verstande dat voor gronden die zijn onteigend of waarvoor een onteigeningsbeschikking is gegeven of die op
      onteigeningsbasis zijn of worden verworven, de inbrengwaarde gelijk is aan de schadeloosstelling op basis van
      [paragraaf 15.3.1 van de wet][ref3]; of

      b. overeenkomstig de waarde die bij beschikking op grond van
      [artikel 22, eerste lid, van de Wet waardering onroerende zaken][ref4] is vastgesteld voor het kalenderjaar waarin
      de raming wordt vastgesteld.

      2 Tot de inbrengwaarde worden gerekend:

      a. de waarde van de grond en de te slopen opstallen in de toestand voorafgaand aan het vaststellen van
      het omgevingsplan of het projectbesluit of het verlenen van de omgevingsvergunning voor een buitenplanse
      omgevingsplanactiviteit; en

      b. de in [bijlage IV][ref5], onder B2, B3 en B4, genoemde kosten, inclusief de kosten die voorafgaand aan
      het vaststellen van het omgevingsplan of het projectbesluit of het verlenen van de omgevingsvergunning voor
      een buitenplanse omgevingsplanactiviteit zijn gemaakt en die direct verband houden met de te verrichten
      bouwactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel13.17
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel15.21
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Paragraaf15.3.1
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0041278
