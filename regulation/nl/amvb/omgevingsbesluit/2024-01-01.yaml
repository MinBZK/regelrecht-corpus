  - number: '8.8'
    text: |-
      Het bevoegd gezag houdt bij het verbinden van een voorschrift aan de omgevingsvergunning over het stellen van
      financiële zekerheid en het wijzigen van een dergelijk voorschrift in een geval als bedoeld in [artikel 8.5][ref1]
      in ieder geval rekening met:

      a. de financiële draagkracht van degene die de activiteit verricht;

      b. de aanwezigheid en aard van de stoffen die nadelige gevolgen voor de fysieke leefomgeving kunnen veroorzaken;

      c. de ten hoogste verwachte schade die kan voortvloeien uit door de activiteit veroorzaakte nadelige gevolgen voor
      de fysieke leefomgeving;

      d. de technische en bedrijfsorganisatorische veiligheidsmaatregelen die zijn getroffen ter voorkoming en beperking
      van schade als bedoeld onder c;

      e. de verhouding tussen het risico op schade als bedoeld onder c van een bepaalde omvang en de daarmee gemoeide
      kosten van het stellen van financiële zekerheid;

      f. de naleving van de aan de omgevingsvergunning verbonden voorschriften; en

      g. de verhouding tussen de criteria, bedoeld onder a tot en met f.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel8.5
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0041278
        artikel: '8.5'
        hoofdstuk: '8'
        afdeling: '8.3'
  - number: '8.9'
    text: |-
      1 Het bevoegd gezag stelt in het vergunningvoorschrift over financiële zekerheid de vorm vast waarin de financiële
      zekerheid wordt gesteld.

      2 Het bevoegd gezag houdt bij het vaststellen van de vorm waarin de financiële zekerheid wordt gesteld, in ieder
      geval rekening met:

      a. de voorkeur van degene die de activiteit verricht voor een specifieke vorm van financiële zekerheid, als die
      vorm voldoende zekerheid biedt; en

      b. de vraag of degene die de activiteit verricht een openbaar lichaam is.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel8.9
  - number: '8.10'
    text: |-
      1 Het bevoegd gezag stelt in het vergunningvoorschrift over financiële zekerheid vast voor welk bedrag de zekerheid
      wordt gesteld.

      2 Het bedrag is:

      a. voor een geval als bedoeld in [artikel 8.5][ref1] niet hoger dan de kosten die noodzakelijk worden geacht
      voor het nakomen van verplichtingen die op grond van de omgevingsvergunning gelden of voor de dekking van
      aansprakelijkheid voor schade aan de fysieke leefomgeving als gevolg van die activiteit;

      b. voor een geval als bedoeld in [artikel 8.6, onder a][ref2], ten hoogste € 2,27 per ton gestorte afvalstoffen;

      c. voor een geval als bedoeld in [artikel 8.6, onder b][ref3], ten hoogste € 1,– per ton droge stof gestorte
      afvalstoffen; en

      d. voor een geval als bedoeld in [artikel 8.6, onder d][ref4], ten minste € 5.000.000,– per vergunningplichtige
      activiteit.

      3 Voor een geval als bedoeld in [artikel 8.6, onder c][ref5], is de berekening gebaseerd op de criteria die zijn
      opgenomen in Beschikking nr. 2009/335/EG van de Commissie van 20 april 2009 inzake technische richtsnoeren voor het
      stellen van de financiële zekerheid overeenkomstig [Richtlijn 2006/21/EG](32006L0021) van het Europees Parlement en
      de Raad betreffende het beheer van afval van winningsindustrieën (PbEG 2009, L 101).


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel8.5
