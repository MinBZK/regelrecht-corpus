      1 Onze Minister van Infrastructuur en Waterstaat beslist op een enkel- of meervoudige aanvraag om een
      omgevingsvergunning als de aanvraag alleen betrekking heeft op een of meer van de volgende wateractiviteiten:

      a. een wateractiviteit die betrekking heeft op een watersysteem of onderdeel daarvan als bedoeld in
      [artikel 3.1][ref1]; of

      b. een stortingsactiviteit op zee vanaf een in Nederland geregistreerd vaartuig of luchtvaartuig dat zich buiten
      Nederland en de exclusieve economische zone bevindt.

      2 Onze Minister van Infrastructuur en Waterstaat beslist ook op een meervoudige aanvraag om een omgevingsvergunning
      als de aanvraag betrekking heeft op een of meer wateractiviteiten als bedoeld in het eerste lid, onder a, voor
      zover het gaat om:

      a. een lozingsactiviteit op een oppervlaktewaterlichaam als het gaat om het lozen van afvalwater afkomstig van een
      milieubelastende activiteit met betrekking tot een ippc-installatie of een Seveso-inrichting; of

      b. een beperkingengebiedactiviteit met betrekking tot een waterstaatswerk die wordt verricht in het kader van de
      aanleg of wijziging van een waterstaatswerk door of namens Onze Minister van Infrastructuur en Waterstaat;

      en een of meer andere wateractiviteiten.


