  - number: '13.19'
    text: |-
      1 Het bevoegd gezag stelt degene die de Seveso-inrichting exploiteert binnen een redelijke termijn, maar uiterlijk
      binnen zes maanden na ontvangst van het veiligheidsrapport, in kennis van de conclusies van het onderzoek daarvan.

      2 Als het bevoegd gezag van oordeel is dat het veiligheidsrapport onvolledig is, wordt degene die de Seveso-
      inrichting exploiteert binnen acht weken na ontvangst van het veiligheidsrapport verzocht om aanvullende gegevens
      en bescheiden te verstrekken binnen een bij het verzoek te stellen termijn van ten hoogste zes weken.

      3 De termijn, bedoeld in het eerste lid, wordt opgeschort met ingang van de dag dat het verzoek, bedoeld in het
      tweede lid, is gedaan tot de dag waarop de aanvullende gegevens en bescheiden zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel13.19
  - number: '13.20'
    text: |-
      1 Het bevoegd gezag, de toezichthouder, bedoeld in
      [artikel 1, derde lid, onder d, van de Arbeidsomstandighedenwet][ref1], en het bestuur van de veiligheidsregio
      zorgen gezamenlijk voor het vaststellen, bezien en bijwerken van een toezichtsysteem en een toezichtplan.

      2 Het toezichtplan bevat ten minste:

      a. een algemene beoordeling van de relevante veiligheidskwesties;

      b. het gebied dat het toezichtplan bestrijkt;

      c. een lijst van de Seveso-inrichtingen die onder het plan vallen;

      d. een lijst van de Seveso-inrichtingen die zijn aangewezen op grond van
      [artikel 8.38 van het Besluit kwaliteit leefomgeving][ref2];

      e. een lijst van de Seveso-inrichtingen met specifieke externe risico’s of gevarenbronnen die het risico op of de
      gevolgen van een zwaar ongeval kunnen vergroten;

      f. procedures voor routinematig toezicht;

      g. procedures voor niet-routinematig toezicht waarmee ernstige klachten, zware ongevallen, bijna-ongevallen,
      incidenten en overtredingen zo spoedig mogelijk worden onderzocht; en

      h. afspraken over samenwerking tussen het bevoegd gezag, de toezichthouder, bedoeld in
      [artikel 1, derde lid, onder d, van de Arbeidsomstandighedenwet][ref3], en het bestuur van de veiligheidsregio.

      3 Het toezichtplan wordt regelmatig bezien en zo nodig bijgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0041313#Artikel8.38
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel1
