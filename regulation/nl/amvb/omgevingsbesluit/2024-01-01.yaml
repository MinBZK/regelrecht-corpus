        artikel: 8.74b
      - id: ref2
        bwb_id: BWBR0041313
        artikel: '10.24'
  - number: 10.36c
    text: |-
      1 Gedeputeerde staten verstrekken aan Onze Minister voor Natuur en Stikstof uiterlijk op
      1 juni 2025, en daarna steeds na zes jaar, gegevens over de uitvoering van de maatregelen voor
      de preventie en beheersing van de introductie en verspreiding van invasieve exoten van de in
      [bijlage VC bij het Besluit kwaliteit leefomgeving][ref1] genoemde soorten.

      2 De door gedeputeerde staten verstrekte gegeven hebben betrekking op:

      a. de aard en de doeltreffendheid van de getroffen maatregelen en de gevolgen van deze maatregelen voor niet-
      doelsoorten;

      b. de maatregelen die zijn getroffen om het publiek te informeren over de aanwezigheid van invasieve uitheemse
      soorten en over acties die burgers verzocht worden te ondernemen; en

      c. als deze gegevens aanwezig zijn: de kostprijs van de onder a en b bedoelde maatregelen.

      3 Onze Minister voor Natuur en Stikstof verstrekt de gegevens aan de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0041313
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.36c
    references:
      - id: ref1
        bwb_id: BWBR0041313
  - number: 10.36d
    text: |-
      1 Gedeputeerde staten verstrekken aan Onze Minister voor Natuur en Stikstof gegevens over de voortgang van de
      totstandkoming en instandhouding van het natuurnetwerk Nederland.

      2 Onze Minister voor Natuur en Stikstof informeert op basis van de gegevens van gedeputeerde staten de beide Kamers
      der Staten-Generaal over de voortgang van de totstandkoming en instandhouding van het natuurnetwerk Nederland.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.36d
  - number: 10.36da
    text: |-
      1 De bestuursorganen die zijn belast met de uitvoering van de maatregelen, opgenomen in
      het programma stikstofreductie en natuurverbetering, verstrekken de gegevens, bedoeld in
      [artikel 11.69, eerste lid, van het Besluit kwaliteit leefomgeving][ref1], elke twee jaar aan Onze Minister voor
      Natuur en Stikstof.

      2 De bestuursorganen die verantwoordelijk zijn voor de vaststelling van het beheerplan, bedoeld in de
      [artikelen 3.8, derde lid][ref2], en [3.9, derde lid, van de wet][ref3], verstrekken de gegevens, bedoeld in
      [artikel 11.69, tweede lid, van het Besluit kwaliteit leefomgeving][ref4], elke zes jaar aan Onze Minister voor
      Natuur en Stikstof.


