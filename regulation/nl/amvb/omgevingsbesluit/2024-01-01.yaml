  - number: '13.7'
    text: |-
      1 Tot de wijze waarop toezicht op de naleving van het bepaalde bij of krachtens de [wet][ref1] wordt gehouden,
      bedoeld in [artikel 13.6, tweede lid, onder b][ref2], behoort in ieder geval:

      a. de wijze waarop toezicht wordt voorbereid, uitgaande van een register waarin in ieder geval ippc-installaties
      zijn opgenomen;

      b. de frequentie waarmee routinematig toezicht wordt gehouden, waarbij die frequentie voor ippc-installaties,
      afhankelijk van de milieurisico’s, het nalevingsgedrag en de aanwezigheid van een gecertificeerd milieuzorgsysteem,
      ten minste is:

      1°. eenmaal per drie jaar bij beperkte milieurisico’s; en

      2°. eenmaal per jaar bij grote milieurisico’s; en

      c. de termijn waarbinnen na het vaststellen van een ernstige klacht, ernstig ongewoon voorval of ernstige
      overtreding niet-routinematig toezicht wordt gehouden, waarbij die termijn voor ippc-installaties is:

      1°. na het vaststellen van een ernstige klacht, ernstig ongewoon voorval of ernstige overtreding: zo spoedig
      mogelijk en in voorkomend geval voor de verlening of wijziging van een omgevingsvergunning; of

      2°. na het vaststellen van een ernstige overtreding: in ieder geval binnen zes maanden.

      2 Tot de wijze waarop wordt gerapporteerd over bevindingen over de naleving van het bepaalde bij of krachtens de
      [wet][ref3] en eventueel daaraan verbonden consequenties, bedoeld in [artikel 13.6, tweede lid, onder c][ref4],
      behoort in ieder geval:

      a. de termijn waarbinnen een rapportage wordt gedeeld met betrokkenen, waarbij die termijn voor rapportage met
      betrekking tot ippc-installaties twee maanden is; en

      b. de termijn waarbinnen en mate waarin een rapportage openbaar wordt gemaakt, waarbij
      die termijn voor rapportage met betrekking tot ippc-installaties vier maanden is en de
      [artikelen 19.3 tot en met 19.5 van de Wet milieubeheer][ref5] van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel13.6
      [ref3]: https://wetten.overheid.nl/BWBR0037885
      [ref4]: https://wetten.overheid.nl/BWBR0041278#Artikel13.6
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel19.3
