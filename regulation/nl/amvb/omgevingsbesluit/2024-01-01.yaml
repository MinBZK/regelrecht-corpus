        artikel: '16.47'
  - number: '11.15'
    text: |-
      Als voor een project een milieueffectrapport moet worden gemaakt en voor dat project een ontwerpbesluit ter inzage
      is gelegd waarvoor op grond van [artikel 16.53c van de wet][ref1] een passende beoordeling is gemaakt, wordt
      de passende beoordeling ook tegelijkertijd met het milieueffectrapport door het bevoegd gezag voor het besluit
      waarvoor het milieueffectrapport wordt gemaakt, ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16.53c
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.15
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: 16.53c
  - number: '11.16'
    text: |-
      1 Het milieueffectrapport bevat in ieder geval de volgende informatie:

      a. een beschrijving van het project;

      b. een beschrijving van de redelijke alternatieven voor het project en de specifieke kenmerken ervan, met
      inbegrip van een vergelijking van de milieueffecten, en een motivering voor de gekozen optie in het licht van de
      milieueffecten;

      c. een beschrijving van de relevante aspecten van de bestaande staat of kwaliteit van het milieu en de mogelijke
      ontwikkelingen daarvan als het project niet wordt uitgevoerd voor zover natuurlijke veranderingen redelijkerwijs
      kunnen worden beoordeeld op basis van beschikbare milieu-informatie en wetenschappelijke kennis;

      d. een beschrijving van de factoren bevolking, gezondheid, biodiversiteit, land, bodem, water, lucht, klimaat,
      materiële goederen, cultureel erfgoed en landschap, waarop het project aanzienlijke milieueffecten kan hebben, en
      de samenhang daartussen;

      e. een beschrijving van de mogelijk aanzienlijke milieueffecten van het project;

      f. een beschrijving van de methoden of bewijsstukken die zijn gebruikt voor de identificatie en de beoordeling van
      de aanzienlijke milieueffecten, met inbegrip van de moeilijkheden die bij het verzamelen van de vereiste informatie
      zijn ondervonden;

      g. een beschrijving van de kenmerken van het project en de voorgenomen maatregelen om alle beschreven aanzienlijke
      nadelige milieueffecten te vermijden, te voorkomen, te beperken en, als dat mogelijk is, te compenseren en, voor
      zover van toepassing, van voorgestelde monitoringsmaatregelen en procedures voor monitoring;

      h. een beschrijving van de verwachte aanzienlijke nadelige milieueffecten van het project die voortvloeien uit de
      kwetsbaarheid van het project voor risico’s op zware ongevallen of rampen;

      i. een niet-technische samenvatting van de op grond van de onderdelen a tot en met h verstrekte informatie; en

      j. een referentielijst waarin de bronnen worden vermeld die zijn gebruikt voor de in het milieueffectrapport
      opgenomen beschrijvingen en beoordelingen.

      2 Bij de beschrijving, bedoeld in het eerste lid, onder g, wordt aangegeven in welke mate aanzienlijke nadelige
      milieueffecten worden vermeden, voorkomen, beperkt of gecompenseerd in zowel de bouwfase als de bedrijfsfase.

      3 Voor zover van toepassing omvat de beschrijving, bedoeld in het eerste lid, onder h, de geplande maatregelen om
      de aanzienlijke nadelige milieueffecten van dergelijke gebeurtenissen te voorkomen of te beperken, en informatie
      over paraatheid en de voorgenomen reactie bij dergelijke noodsituaties.

      4 Wanneer een advies over de reikwijdte en het detailniveau, bedoeld in
      [artikel 16.46, eerste lid, van de wet][ref1], is uitgebracht, is het milieueffectrapport gebaseerd op dat advies.
      Het milieueffectrapport bevat de informatie die redelijkerwijs mag worden vereist om tot een gemotiveerde conclusie
      over de aanzienlijke milieueffecten van het project te komen, waarbij rekening wordt gehouden met de bestaande
      kennis en beoordelingsmethoden.

      5 Om overlapping van milieueffectrapporten te voorkomen, wordt bij het maken van het milieueffectrapport rekening
      gehouden met de beschikbare resultaten die op grond van verordeningen, richtlijnen en besluiten als bedoeld in
      artikel 288 van het Verdrag betreffende de werking van de Europese Unie zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16.46
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.16
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16.46'
  - number: '11.17'
    text: |-
      De beschrijving van het project, bedoeld in [artikel 11.16, eerste lid, onder a][ref1], bevat in ieder geval:

      a. een beschrijving van de locatie van het project;

      b. een beschrijving van de fysieke kenmerken van het gehele project en, als dat van toepassing is, van de
      sloopactiviteiten, en de eisen over landgebruik tijdens de bouw- en bedrijfsfase;

      c. een beschrijving van de belangrijkste kenmerken van de bedrijfsfase van het project, waaronder de
      productieprocessen; en

      d. een prognose van de soort en de hoeveelheid van de verwachte residuen en emissies en de hoeveelheden en soorten
      tijdens de bouw- en bedrijfsfase geproduceerde afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel11.16
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.17
    references:
      - id: ref1
        bwb_id: BWBR0041278
        artikel: '11.16'
        hoofdstuk: '11'
        afdeling: '11.2'
  - number: '11.18'
    text: |-
      1 De beschrijving van de mogelijk aanzienlijke milieueffecten van het project, bedoeld in
      [artikel 11.16, eerste lid, onder e][ref1], op de in artikel 11.16, eerste lid, onder d, bedoelde factoren, bevat
      in ieder geval een beschrijving van:

      a. de realisatie en het bestaan van het project, en, als dat van toepassing is, van de sloopactiviteiten;

      b. het gebruik van natuurlijke bronnen, met name land, bodem, water en biodiversiteit, waarbij zoveel mogelijk
      rekening wordt gehouden met de duurzame beschikbaarheid van deze bronnen;

      c. de uitstoot van verontreinigende stoffen, geluidhinder, trillingen, licht, warmte, straling, het ontstaan van
      milieuhinder en het verwijderen en terugwinnen van afvalstoffen;

      d. de risico’s voor de gezondheid, het cultureel erfgoed of het milieu;

      e. de cumulatie van effecten met andere bestaande of goedgekeurde projecten, waarbij rekening wordt gehouden
      met alle bestaande milieuproblemen van gebieden die vanuit milieuoogpunt van bijzonder belang zijn en waarop het
      project van invloed kan zijn, of met het gebruik van natuurlijke bronnen;

      f. het effect van het project op het klimaat en de kwetsbaarheid van het project voor klimaatverandering; en

      g. de gebruikte technologieën en stoffen.

      2 De beschrijving van de mogelijk aanzienlijke milieueffecten van het project heeft betrekking op de directe
      en, voor zover van toepassing, de indirecte, secundaire, cumulatieve en grensoverschrijdende effecten op korte,
      middellange en lange termijn, permanente en tijdelijke en positieve en negatieve effecten van het project.

      3 De beschrijving van de mogelijk aanzienlijke milieueffecten van het project houdt rekening met de Europese of
      nationale doelstellingen over milieubescherming, die relevant zijn voor het project.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel11.16
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.18
    references:
      - id: ref1
        bwb_id: BWBR0041278
        artikel: '11.16'
        hoofdstuk: '11'
        afdeling: '11.2'
  - number: '11.19'
    text: |-
      1 In het besluit waarvoor bij de voorbereiding een milieueffectrapport moet worden gemaakt, vermeldt het bevoegd
      gezag in ieder geval hoe rekening is gehouden met:

      a. het milieueffectrapport; en

      b. indien van toepassing, het advies van de Commissie voor de milieueffectrapportage.

      2 Daarnaast bevat het besluit in ieder geval:

      a. de gemotiveerde conclusie van het bevoegd gezag over de aanzienlijke milieueffecten van het project;

      b. alle aan het besluit verbonden voorschriften;

      c. voor zover van toepassing, een beschrijving van alle kenmerken van het project en de voorgenomen maatregelen
      om aanzienlijke nadelige milieueffecten te vermijden, te voorkomen of te beperken en, als dat mogelijk is, te
      compenseren en op welk moment de maatregelen moeten zijn uitgevoerd; en

      d. in voorkomend geval, monitoringsmaatregelen en procedures voor de monitoring van die effecten waarvoor het
      bevoegd gezag monitoring noodzakelijk acht, waarbij het soort parameters dat wordt gemonitord en de looptijd van
      de monitoring evenredig moeten zijn aan de aard, de locatie en de omvang van het project en met het belang van
      de milieueffecten.

      3 Het bevoegd gezag kan bepalen dat degene die voornemens is het project uit te voeren bestaande monitoring
      gebruikt voor de monitoringsmaatregelen en de procedures voor de monitoring.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.19
  - number: '11.20'
    text: |-
      1 Als op grond van [artikel 11.19, tweede lid, onder d][ref1], monitoring plaatsvindt, verstrekt degene die het
      project uitvoert de resultaten van de monitoring aan het bevoegd gezag.

      2 Het bevoegd gezag stelt de resultaten van de monitoring elektronisch beschikbaar.

      3 Het bevoegd gezag treft, als dat naar zijn oordeel nodig is, passende maatregelen om de onvoorziene nadelige
      milieueffecten zoveel mogelijk te beperken of ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel11.19
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.20
    references:
      - id: ref1
        bwb_id: BWBR0041278
        artikel: '11.19'
        hoofdstuk: '11'
        afdeling: '11.2'
  - number: '11.21'
    text: |-
      Het bevoegd gezag voor het milieueffectrapport verstrekt aan Onze Minister van Infrastructuur en Waterstaat op
      verzoek de bij dat gezag beschikbare gegevens die nodig zijn om te kunnen voldoen aan artikel 12, tweede lid, van
      de mer-richtlijn.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.21
  - number: '11.22'
    text: |-
      1 Als een plan of programma waarvoor een milieueffectrapport moet worden gemaakt mogelijk aanzienlijke
      grensoverschrijdende milieueffecten heeft, deelt het bevoegd gezag dit mee aan de bevoegde autoriteit van de staat
      die deze mogelijke effecten zal ondervinden. Tegelijk met die mededeling, of nadat die autoriteit hierom heeft
      verzocht, zendt het bevoegd gezag aan die autoriteit in ieder geval:

      a. het ontwerp van het plan of programma;

      b. het milieueffectrapport, voor zover dit niet is opgenomen in het ontwerp van het plan of programma, met inbegrip
      van informatie over de mogelijke grensoverschrijdende milieueffecten en een vertaling van de samenvatting van het
      milieueffectrapport in de taal van de andere staat;

      c. informatie over de totstandkomingsprocedure van het plan of programma; en

      d. de termijn waarbinnen de bevoegde autoriteit van de andere staat kan aangeven of zij overleg wenst over de
      mogelijke grensoverschrijdende milieueffecten.

      2 Het bevoegd gezag doet de mededeling zo spoedig mogelijk en zendt de informatie in ieder geval voor de
      vaststelling van het plan of programma.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.22
  - number: '11.23'
    text: |-
      1 Als de bevoegde autoriteit van de andere staat binnen de gestelde termijn heeft aangegeven dat zij overleg wenst,
      overlegt het bevoegd gezag met die autoriteit over de mogelijk aanzienlijke grensoverschrijdende milieueffecten
      van het plan of programma en de voorgenomen maatregelen om de nadelige effecten te voorkomen, te beperken of zoveel
      mogelijk te compenseren.

      2 Onze Minister van Infrastructuur en Waterstaat kan contacten onderhouden met de bevoegde autoriteit van de andere
      staat als er geen contact is tussen het bevoegd gezag en die autoriteit of als het overleg niet tot het gewenste
      resultaat heeft geleid. Het bevoegd gezag zendt de benodigde informatie aan Onze Minister van Infrastructuur en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.23
  - number: '11.24'
    text: |-
      Het betrokken publiek en de bevoegde instanties van de andere staat worden in de gelegenheid gesteld zienswijzen
      naar voren te brengen, met overeenkomstige toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '11.25'
    text: |-
      Nadat het plan of programma is vastgesteld, verstrekt het bevoegd gezag dat plan of programma aan de bevoegde
      autoriteit van de andere staat, degenen die zienswijzen naar voren hebben gebracht en de bevoegde instanties van de
      andere staat.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.25
  - number: '11.26'
    text: |-
      1 Als de bevoegde autoriteit van een andere staat heeft meegedeeld dat een plan of programma mogelijk aanzienlijke
      grensoverschrijdende milieueffecten heeft in Nederland, geeft het betrokken bestuursorgaan binnen de door die
      autoriteit gestelde termijn aan of overleg is gewenst.

      2 Als toepassing is gegeven aan het eerste lid, overlegt het betrokken bestuursorgaan met de bevoegde autoriteit
      over de mogelijk aanzienlijke milieueffecten van het plan of programma en de voorgenomen maatregelen om de nadelige
      effecten te voorkomen, te beperken of te compenseren.

      3 Als toepassing is gegeven aan het eerste lid, stelt het betrokken bestuursorgaan, in overeenstemming met de
      bevoegde autoriteit, het betrokken publiek en de bevoegde instanties in de gelegenheid zienswijzen naar voren te
      brengen.

      4 Als toepassing is gegeven aan het eerste lid, geeft het betrokken bestuursorgaan, in overeenstemming met de
      bevoegde autoriteit en met overeenkomstige toepassing van [artikel 3:42 van de Algemene wet bestuursrecht][ref1],
      kennis van:

      a. het vastgestelde plan of programma;

      b. een door de bevoegde autoriteit van de andere staat opgestelde samenvatting van de wijze waarop de
      milieuoverwegingen, de gehouden overleggen, de naar voren gebrachte zienswijzen en het milieueffectrapport zijn
      betrokken bij het vaststellen van het plan of programma; en

      c. de monitoringsmaatregelen waartoe de bevoegde autoriteit heeft besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel342
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:42
  - number: '11.27'
    text: |-
      1 Als een project waarvoor een milieueffectrapport moet worden gemaakt mogelijk aanzienlijke grensoverschrijdende
      milieueffecten heeft, deelt het bevoegd gezag dit mee aan de bevoegde autoriteit van de andere staat die deze
      mogelijke effecten zal ondervinden. Tegelijk met deze mededeling, of zo spoedig mogelijk nadat die autoriteit
      hierom heeft verzocht, zendt het bevoegd gezag aan die autoriteit in ieder geval:

      a. informatie over het project, waaronder alle beschikbare informatie over de mogelijke grensoverschrijdende
      milieueffecten;

      b. informatie over de aard en de totstandkoming van het te nemen besluit; en

      c. informatie over de termijn waarbinnen de bevoegde autoriteit van de andere staat advies kan uitbrengen over het
      milieueffectrapport en zienswijzen naar voren kan brengen over het ontwerp van het besluit.

      2 Het bevoegd gezag zendt die informatie niet later dan het moment waarop derden op grond van
      [artikel 16.46][ref1] of [16.50 van de wet][ref2] worden betrokken bij het besluit, bedoeld in
      [artikel 16.43, eerste lid, van de wet][ref3].

      3 Als sprake is van een projectbesluit, zendt het bevoegd gezag deze informatie niet later dan het moment van de
      kennisgeving van het voornemen om een verkenning uit te voeren naar een mogelijk bestaande of toekomstige opgave in
      de fysieke leefomgeving, bedoeld in [artikel 5.47 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16.46
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel16.50
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel16.43
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel5.47
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.27
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16.46'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '16.50'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '16.43'
      - id: ref4
        bwb_id: BWBR0037885
        artikel: '5.47'
  - number: '11.28'
    text: |-
      1 Als de bevoegde autoriteit van de andere staat aangeeft deel te willen nemen aan de totstandkomingsprocedure
      van het besluit waarvoor een milieueffectrapport moet worden gemaakt, worden het betrokken publiek en de bevoegde
      instanties in de andere staat in ieder geval in de gelegenheid gesteld om:

      a. zienswijzen naar voren te brengen, met overeenkomstige toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]; en

      b. als het om een projectprocedure gaat: mogelijke oplossingen aan te dragen voor de mogelijk
      bestaande of toekomstige opgave in de fysieke leefomgeving, met overeenkomstige toepassing van
      [artikel 5.47, derde lid, van de wet][ref2].

      2 De hiertoe aangewezen bevoegde instanties in de andere staat worden, voor zover van toepassing, in de
      gelegenheid gesteld om advies uit te brengen over de reikwijdte en het detailniveau van de informatie voor het
      milieueffectrapport, met overeenkomstige toepassing van [artikel 16.46 van de wet][ref3].

      3 Voor zover dit nog niet is gebeurd, zendt het bevoegd gezag de volgende informatie aan de bevoegde autoriteit en
      de bevoegde instanties van de andere staat:

      a. het ontwerp van het besluit, met inbegrip van het milieueffectrapport;

      b. de termijn waarbinnen zienswijzen naar voren kunnen worden gebracht en waarbinnen advies kan worden uitgebracht;
      en

      c. een vertaling van de samenvatting van het milieueffectrapport in de taal van de andere staat.

      4 De vertaling van de samenvatting van het milieueffectrapport wordt gemaakt door degene die op grond van
      [artikel 16.43, vijfde lid, van de wet][ref4] het milieueffectrapport maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5.47
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel16.46
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel16.43
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.28
    references:
      - id: ref1
