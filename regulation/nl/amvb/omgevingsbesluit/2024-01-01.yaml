  - number: '7.5'
    text: |-
      Een onteigeningsbeschikking bevat in ieder geval:

      a. de kadastrale aanduidingen van de te onteigenen onroerende zaak of zaken en de naam van de gemeente of gemeenten
      waar die onroerende zaak of zaken zijn gelegen;

      b. de kadastrale grootte van elk van de in de beschikking opgenomen percelen;

      c. als een gedeelte van een perceel in de beschikking wordt opgenomen: de grootte van dat gedeelte;

      d. de namen van de eigenaren van en de beperkt gerechtigden op de te onteigenen onroerende zaak of zaken volgens de
      basisregistratie kadaster;

      e. een beschrijving van de beoogde vorm van ontwikkeling, gebruik of beheer van de fysieke leefomgeving waarvoor de
      onteigening nodig is; en

      f. de naam van de onteigenaar.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel7.5
  - number: '7.6'
    text: |-
      Het ontwerp van de onteigeningsbeschikking wordt ter inzage gelegd met:

      a. een grondtekening waarop is weergegeven of vermeld:

      1°. de ligging van de percelen of gedeelten van percelen die tot de te onteigenen onroerende zaak of zaken behoren
      en de kadastrale nummers van die percelen op een goed afleesbare en op de tekening vermelde schaalgrootte;

      2°. elke te onteigenen onroerende zaak;

      3°. de aansluiting van de te onteigenen onroerende zaak of zaken op het daaromheen gelegen gebied; en

      4°. een noordpijl en de naam van de gemeente of gemeenten; en

      b. het ter inzage gelegde ontwerp van het omgevingsplan of het projectbesluit, het vastgestelde omgevingsplan
      of projectbesluit, de aanvraag om een omgevingsvergunning voor een buitenplanse omgevingsplanactiviteit of
      de verleende omgevingsvergunning voor een buitenplanse omgevingsplanactiviteit waarmee de beoogde vorm van
      ontwikkeling, gebruik of beheer van de fysieke leefomgeving mogelijk wordt gemaakt, met daarop ook een projectie
      van de grondtekening, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel7.6
  - number: '8.1'
    text: |-
      De gevallen van verontreiniging, aantasting, verstoring of beschadiging, bedoeld in
      [artikel 13.3a, eerste lid, van de wet][ref1], waarin de voor rekening van de daarin bedoelde rechtspersonen
      komende kosten kunnen worden verhaald, zijn:

      a. de verontreiniging of aantasting van de bodem; of

      b. de verontreiniging of aantasting van de bodem of oever van een oppervlaktewaterlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel13.3a
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: 13.3a
  - number: 8.1a
    text: |-
      Gevallen als bedoeld in [artikel 13.3d van de wet][ref1] zijn de gevallen waarin schadevergoeding als gevolg
      van een besluit of een regel als bedoeld in [artikel 15.1, eerste lid, onder a, e, i of k, van de wet][ref2] is
      betaald, voor zover dat besluit of die regel betrekking heeft op waterbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel13.3d
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel15.1
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel8.1a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: 13.3d
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '15.1'
  - number: '8.2'
    text: |-
      1 Als minder dan 10.000 m3 vaste stoffen in situ wordt ontgraven, is geen heffing als bedoeld in
      [artikel 13.4a, eerste lid, van de wet][ref1], verschuldigd.

      2 Als het bedrag van de ontgrondingenheffing lager is dan € 250,–, vindt geen teruggave van de heffing plaats.

      3 De ontgrondingenheffing wordt geheven bij wijze van aanslag.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel13.4a
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: 13.4a
  - number: '8.3'
    text: |-
      Van de heffing, bedoeld in [artikel 13.4b, eerste lid, van de wet][ref1], zijn vrijgesteld onttrekkingen van
      grondwater:

      a. door het gemeentebestuur, het waterschapsbestuur, het provinciebestuur of Onze Minister van Infrastructuur en
      Waterstaat voor de uitoefening van taken op het gebied van het beheer van watersystemen op grond van de wet;

      b. voor het gebruiken van een open bodemenergiesysteem, bedoeld in
      [artikel 4.1146 van het Besluit activiteiten leefomgeving][ref2];

      c. voor het saneren van een verontreiniging van de bodem of het grondwater;

      d. voor landijsbanen;

      e. voor het ontwateren of afwateren van gronden; en

      f. door een oevergrondwaterwinning.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel13.4b
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Artikel4.1146
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: 13.4b
      - id: ref2
        bwb_id: BWBR0041330
        artikel: '4.1146'
  - number: '8.4'
    text: |-
      1 De onderzoeken, bedoeld in [artikel 13.4b, eerste lid, onder b, van de wet][ref1], waarvan de kosten kunnen
      worden bestreden met de grondwateronttrekkingsheffing zijn de onderzoeken voor het grondwaterbeleid van de
      provincie die noodzakelijk zijn voor het vaststellen en uitvoeren van een regionaal waterprogramma als bedoeld in
      [artikel 3.8, tweede lid, van de wet][ref2].

      2 De kosten van de onderzoeken, bedoeld in [artikel 13.4b, vierde lid, van de wet][ref3], die kunnen worden
      bestreden met de grondwateronttrekkingsheffing zijn de kosten van:

      a. het monitoren en verzamelen van gegevens over de geohydrologische gesteldheid van de bodem van de provincie;

      b. een bijdrage aan een onderzoeksprogramma dat direct verband houdt met de totstandkoming en uitvoering van het
      grondwaterbeleid;

      c. het verzamelen, beoordelen en berekenen van gegevens voor het grondwaterbeleid;

      d. het personeel dat de onderzoeken verricht of begeleidt; en

      e. het beschikbaar stellen van de resultaten van de onderzoeken aan het publiek.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel13.4b
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel3.8
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel13.4b
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel8.4
