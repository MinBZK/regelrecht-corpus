  - number: '11.7'
    text: |-
      1 Voor gevallen die zowel in kolom 2 als in kolom 3 van [bijlage V][ref1] zijn aangegeven, wordt bij de
      voorbereiding van het besluit een milieueffectrapport gemaakt.

      2 Bij de vaststelling of sprake is van een project als bedoeld in [artikel 11.6, eerste of tweede lid][ref2], wordt
      het gehele project in beschouwing genomen, met inbegrip van de grensoverschrijdende onderdelen.

      3 Projecten als bedoeld in [bijlage V][ref3], kolom 2, in samenhang met kolom 1, die alleen of hoofdzakelijk
      dienen voor het ontwikkelen en beproeven van nieuwe methoden of producten en die niet langer dan twee jaar worden
      gebruikt, worden in afwijking van [artikel 11.6, eerste lid][ref4], aangemerkt als projecten als bedoeld in artikel
      11.6, tweede lid.

      4 Onder een wijziging of uitbreiding als bedoeld in [bijlage V][ref5], kolom 3, wordt ook verstaan:

      a. een wijziging die betrekking heeft op reconstructie of een andere verandering van aangelegde werken, ingerichte
      gebieden of bestaande installaties; en

      b. een uitbreiding die betrekking heeft op het opnieuw in gebruik nemen van aangelegde werken, ingerichte gebieden
      of bestaande installaties.


