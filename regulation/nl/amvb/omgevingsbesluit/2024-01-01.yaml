  - number: 13.3a
    text: |-
      1 Als regels als bedoeld in [artikel 18.15a, eerste lid, van de wet][ref1] bij overtreding waarvan Onze Minister
      voor Natuur en Stikstof een bestuurlijke boete kan opleggen worden aangewezen:

      a. [artikel 11.93 van het Besluit activiteiten leefomgeving][ref2], voor zover het de volgende handelingen
      betreft:

      1°. het binnenbrengen in de Europese Unie van een specimen in strijd met artikel 4, derde en vierde lid, van de
      cites-basisverordening;

      2°. handelen in strijd met een voorwaarde of vereiste, verbonden aan een vergunning of certificaat op grond
      van artikel 11, derde lid, van de cites-basisverordening, voor zover de voorwaarde of het vereiste ziet op de
      administratie, de verstrekking van gegevens of het merken van dieren, planten of eieren; en

      3°. handelen in strijd met de artikelen 33, eerste lid, onder c, en 40, eerste lid, onder d, van de cites-
      uitvoeringsverordening; en

      b. de [artikelen 11.103][ref3] en [11.104 van het Besluit activiteiten leefomgeving][ref4].

      2 De bestuurlijke boete bedraagt ten hoogste 50% van het bedrag dat is vastgesteld voor de eerste categorie,
      bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5].

      3 In afwijking van het tweede lid bedraagt de op grond van [7.6, tweede lid][ref6], vast te stellen
      bestuurlijke boete ten hoogste het bedrag dat is vastgesteld voor de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref7], als ten tijde van het begaan van de overtreding
      nog geen vijf jaar zijn verstreken sinds een eerder aan de overtreder opgelegde bestuurlijke boete voor een
      overtreding, behorende tot eenzelfde categorie van gedragingen als bedoeld in het eerste lid, onherroepelijk is
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18.15a
