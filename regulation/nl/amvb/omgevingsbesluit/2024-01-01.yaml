  - number: '8.7'
    text: |-
      1 Als degene die de activiteit verricht een openbaar lichaam is, wordt alleen in gevallen als bedoeld in
      [artikel 8.6, onder a, b of c][ref1], een voorschrift aan de omgevingsvergunning verbonden over het stellen van
      financiële zekerheid.

      2 In gevallen als bedoeld in [artikel 8.6, onder a of b][ref2], is het treffen van een gelijkwaardige maatregel
      uitgesloten voor een ander dan een openbaar lichaam.


