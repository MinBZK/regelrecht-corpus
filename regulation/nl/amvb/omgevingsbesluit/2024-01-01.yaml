      De korpschef verstrekt op verzoek gegevens uit de gegevensverzameling, bedoeld in
      [artikel 11.73 van het Besluit kwaliteit leefomgeving][ref1], over de nakoming van een verzekering als bedoeld in
      [artikel 11.78 van het Besluit activiteiten leefomgeving][ref2], aan:

      a. Onze Minister voor Natuur en Stikstof en Onze Minister van Justitie en Veiligheid;

      b. de personen belast met de opsporing van strafbaar gestelde feiten wegens handelen in strijd met het bepaalde bij
      of krachtens de [wet][ref3]; en

      c. hen die aannemelijk maken dat zij zijn betrokken bij schade die grond kan opleveren voor toepassing van
      [artikel 8.4 van de wet][ref4].


