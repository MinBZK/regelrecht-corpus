  - number: '4.35'
    text: |-
      Het bestuursorgaan dat zorg draagt voor het beheer van een zuiveringtechnisch werk of een oppervlaktewaterlichaam
      waarop afvalwater vanuit een voorziening voor de inzameling en het transport van afvalwater wordt gebracht,
      is adviseur voor een aanvraag om een omgevingsvergunning voor zover de aanvraag betrekking heeft op een
      omgevingsvergunning voor een milieubelastende activiteit die betrekking heeft op het brengen van afvalwater of
      andere afvalstoffen in een dergelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel4.35
  - number: '4.36'
    text: |-
      Het bestuursorgaan dat zijn bevoegdheid om op een aanvraag om een omgevingsvergunning te beslissen met toepassing
      van [artikel 5.16 van de wet][ref1] heeft overgedragen, is adviseur voor die aanvraag voor zover die betrekking
      heeft op de activiteit of activiteiten die bepalend zijn geweest voor de aanwijzing van dat bestuursorgaan als
      bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5.16
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel4.36
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5.16'
  - number: '4.37'
    text: |-
      Het op grond van de [artikelen 4.20 tot en met 4.32][ref1] aangewezen bestuursorgaan kan gevallen aanwijzen waarin
      instemming niet is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel4.20
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0041278
        artikel: '4.20'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: '4.38'
    text: |-
      1 Instemming wordt alleen verleend of onthouden op dezelfde gronden als de gronden voor het verlenen of weigeren
      van de omgevingsvergunning voor de activiteit, tenzij het tweede, derde of vierde lid van toepassing is. Daarbij
      geldt een ontheffing als bedoeld in [artikel 2.32 van de wet][ref1] die is verleend voor een voorgenomen beslissing
      tot verlening van een omgevingsvergunning als ontheffing voor het verlenen van instemming.

      2 Als de aanvraag om een omgevingsvergunning betrekking heeft op een omgevingsplanactiviteit als bedoeld in
      [artikel 4.25, eerste lid, onder g][ref2], kan instemming alleen worden onthouden als de voorgenomen beslissing
      op de aanvraag in strijd is met een door een bestuursorgaan van de provincie in een openbaar document aangegeven
      provinciaal belang en het provinciebestuur dat belang niet met inzet van andere aan hem toekomende bevoegdheden
      kan beschermen.

      3 Als de aanvraag om een omgevingsvergunning betrekking heeft op een bouwactiviteit als bedoeld in
      [artikel 4.27, eerste lid][ref3], of als het gaat om een aanvraag om een maatwerkvoorschrift als bedoeld in artikel
      4.27, derde lid, kan instemming alleen worden onthouden als geen sprake is van een bijzonder geval dat het afwijken
      van de regel uit [hoofdstuk 4 van het Besluit bouwwerken leefomgeving][ref4] rechtvaardigt.

      4 Als de aanvraag om een omgevingsvergunning betrekking heeft op een beperkingengebiedactiviteit met betrekking
      tot een burgerluchthaven van regionale betekenis als bedoeld in [artikel 4.30, eerste lid, onder c][ref5], kan
      instemming alleen worden onthouden in het belang van het veilig gebruik van het luchtruim.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2.32
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel4.25
      [ref3]: https://wetten.overheid.nl/BWBR0041278#Artikel4.27
      [ref4]: https://wetten.overheid.nl/BWBR0041297#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0041278#Artikel4.30
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel4.38
