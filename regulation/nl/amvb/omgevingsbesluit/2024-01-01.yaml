  - number: '10.8'
    text: |-
      1 Bij het vaststellen van een programma wordt aangegeven hoe burgers, bedrijven, maatschappelijke organisaties en
      bestuursorganen bij de voorbereiding zijn betrokken en wat de resultaten daarvan zijn.

      2 Als een programma wordt vastgesteld door het college van burgemeester en wethouders, het algemeen bestuur
      van het waterschap of gedeputeerde staten, wordt daarbij aangegeven op welke wijze invulling is gegeven aan het
      toepasselijke decentrale participatiebeleid.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.8
  - number: '10.9'
    text: |-
      Het college van burgemeester en wethouders of de gemeenteraad, het dagelijks bestuur of het algemeen bestuur
      van een waterschap en gedeputeerde staten of provinciale staten verstrekken aan Onze Minister die het aangaat de
      benodigde gegevens over:

      a. een programma als bedoeld in [artikel 3.10, eerste lid, van de wet][ref1] voor zover dat is gericht op het
      voldoen aan een omgevingswaarde voor de kwaliteit van de buitenlucht;

      b. een stroomgebiedsbeheerplan als bedoeld in [artikel 3.9, tweede lid, onder a, van de wet][ref2];

      c. een overstromingsrisicobeheerplan als bedoeld in [artikel 3.9, tweede lid, onder b, van de wet][ref3];

      d. een programma van maatregelen mariene strategie als bedoeld in
      [artikel 3.9, tweede lid, onder c, van de wet][ref4];

      e. een maritiem ruimtelijk plan als bedoeld in [artikel 3.9, tweede lid, onder d, van de wet][ref5]; of

      f. een actieplan geluid als bedoeld in de [artikelen 3.6, eerste lid][ref6], [3.8, eerste lid][ref7], en
      [3.9, eerste lid, van de wet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel3.10
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel3.9
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel3.9
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel3.9
      [ref5]: https://wetten.overheid.nl/BWBR0037885#Artikel3.9
      [ref6]: https://wetten.overheid.nl/BWBR0037885#Artikel3.6
      [ref7]: https://wetten.overheid.nl/BWBR0037885#Artikel3.8
      [ref8]: https://wetten.overheid.nl/BWBR0037885#Artikel3.9
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.9
