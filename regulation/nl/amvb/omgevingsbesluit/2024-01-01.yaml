  - number: 13.15a
    text: |-
      Onze Minister van Infrastructuur en Waterstaat is verwerkingsverantwoordelijke voor de verwerking van
      persoonsgegevens in Inspectieview Milieu.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel13.15a
  - number: 13.15b
    text: |-
      Onze Minister van Infrastructuur en Waterstaat zorgt ervoor dat in Inspectieview Milieu geen gegevens worden
      bewaard.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel13.15b
  - number: 13.15c
    text: |-
      De jaarlijkse beheerkosten van Inspectieview Milieu komen, voor zover ze niet worden gedekt door de jaarlijkse
      bijdragen van aangesloten bestuursorganen en instanties, voor rekening van Onze Minister van Infrastructuur en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel13.15c
  - number: '13.16'
    text: |-
      Deze afdeling is van toepassing op het verrichten van de volgende werkzaamheden door het bevoegd gezag, de
      toezichthouder, bedoeld in [artikel 1, derde lid, onder d, van de Arbeidsomstandighedenwet][ref1], en het bestuur
      van de veiligheidsregio:

      a. het houden van toezicht op de naleving van [paragraaf 4.2 van het Besluit activiteiten leefomgeving][ref2], met
      inbegrip van het verzamelen en registreren van gegevens die hiervoor van belang zijn; en

      b. het behandelen van klachten over de naleving van [paragraaf 4.2 van het Besluit activiteiten leefomgeving][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Paragraaf4.2
      [ref3]: https://wetten.overheid.nl/BWBR0041330#Paragraaf4.2
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel13.16
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0041330
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0041330
        paragraaf: '4.2'
  - number: '13.17'
    text: |-
      1 Het bevoegd gezag draagt zorg voor de coördinatie van het onderling afgestemd verrichten van de werkzaamheden,
      bedoeld in [artikel 13.16][ref1], waartoe in ieder geval behoren:

      a. het houden van toezicht op de naleving van de [artikelen 4.5][ref2], [4.6][ref3], [4.10 tot en met 4.20][ref4],
      [4.22][ref5], [4.24][ref6] en [4.26 tot en met 4.28 van het Besluit activiteiten leefomgeving][ref7];

      b. het vaststellen van een toezichtplan, bedoeld in [artikel 13.20, eerste lid][ref8];

      c. het uitwerken van een toezichtplan in toezichtprogramma’s, bedoeld in [artikel 13.21, eerste lid][ref9];

      d. het overleg over toezicht, toezichtrapporten, bestuurlijke handhaving en andere vervolgacties;

      e. het verzamelen en evalueren van voortgangsgegevens, realisatiegegevens en kwaliteitsgegevens over toezicht en
      vervolgacties; en

      f. het signaleren van geconstateerde overtredingen die ernstig van aard zijn en het organiseren en treffen van
      verbetermaatregelen.

      2 Het bevoegd gezag, de toezichthouder, bedoeld in
      [artikel 1, derde lid, onder d, van de Arbeidsomstandighedenwet][ref10], en het bestuur van de veiligheidsregio:

      a. verstrekken elkaar onverwijld langs elektronische weg de gegevens en bescheiden waarover zij beschikken, voor
      zover die gegevens en bescheiden noodzakelijk zijn voor het goed verrichten van de werkzaamheden, bedoeld in
      [artikel 13.16][ref11]; en

      b. stemmen het verrichten van de werkzaamheden, bedoeld onder a, onderling af.

      3 Tot de gegevens en bescheiden, bedoeld in het tweede lid, onder a, behoren in ieder geval:

      a. de gegevens en bescheiden, bedoeld in de [artikelen 4.5, eerste lid][ref12], en
      [4.6, eerste lid, van het Besluit activiteiten leefomgeving][ref13], die moeten worden verstrekt als
      [paragraaf 4.2 van dat besluit][ref14] van toepassing is geworden op een Seveso-inrichting of bij een wijziging als
      bedoeld in artikel 4.6, eerste lid, van dat besluit;

      b. de voor een Seveso-inrichting verleende omgevingsvergunningen, de aanvragen om omgevingsvergunningen voor een
      Seveso-inrichting en de daarbij verstrekte gegevens en bescheiden;

      c. besluiten tot aanwijzing als inrichting als bedoeld in artikel 9, eerste lid, van de Seveso-richtlijn in de
      omgevingsvergunning op grond van [artikel 8.38 van het Besluit kwaliteit leefomgeving][ref15] of door Onze Minister
      van Sociale Zaken en Werkgelegenheid;

      d. een opgesteld of bijgewerkt veiligheidsrapport of deel daarvan;

      e. de conclusies van het onderzoek van het veiligheidsrapport, bedoeld in [artikel 13.19, eerste lid][ref16];

      f. de toezichtrapporten, bedoeld in [artikel 13.23, eerste lid][ref17];

      g. handhavingsacties en beschikkingen tot het opleggen van een bestuurlijke sanctie aan degene die een Seveso-
      inrichting exploiteert;

      h. het rapport inzake de bedrijfsbrandweer, bedoeld in
      [artikel 7.2, eerste lid, van het Besluit veiligheidsregio’s][ref18], en het besluit tot het aanwijzen van een
      locatie als bedrijfsbrandweerplichtig, bedoeld in [artikel 31, eerste lid, van de Wet veiligheidsregio’s][ref19];
      en

      i. de gegevens en bescheiden, bedoeld in [artikel 4.7, eerste lid, van het Besluit activiteiten leefomgeving][ref20]
      die worden verstrekt als een zwaar ongeval heeft plaatsgevonden.


