  - number: '3.3'
    text: |-
      Het beperkingengebied met betrekking tot een weg in beheer bij het Rijk bestaat uit de weg en het daaromheen
      gelegen gebied, begrensd door een lijn liggend op een afstand van:

      a. bij een weg op maaiveldniveau: 10 m, gemeten vanaf de kant van de verharding;

      b. bij een weg naast een watergang, die het water van de weg opvangt: 1 m vanaf de insteek van de watergang,
      gemeten vanaf de insteek die het meest verwijderd is van de weg;

      c. bij een weg in ingraving: 5 m, gemeten vanaf de insteek van de maaiveldverlaging;

      d. bij een weg in ophoging: 10 m, gemeten vanaf de kant van de verharding, vermeerderd met vijfmaal het
      hoogteverschil tussen de verharding en de insteek van de maaiveldverhoging;

      e. bij een weg in een tunnel of onder een aquaduct: 10 m, gemeten vanaf de rand van het kunstwerk, vermeerderd met
      viermaal het hoogteverschil tussen de verharding en het maaiveld; of

      f. bij een weg op een brug of op een viaduct: 10 m, gemeten vanaf de rand van het kunstwerk, vermeerderd met
      vijfmaal het hoogteverschil tussen de verharding en het maaiveld.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      Het beperkingengebied met betrekking tot een waterstaatswerk in beheer bij het Rijk valt samen met het
      waterstaatswerk.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 Het beperkingengebied met betrekking tot hoofdspoorweginfrastructuur bestaat uit de hoofdspoorweg en het
      daaromheen gelegen gebied, begrensd door een lijn liggend op een afstand van:

      a. bij een hoofdspoorweg op maaiveldniveau: 11 m, gemeten vanaf het hart van het buitenste spoor, zijnde een
      denkbeeldige lijn in de lengterichting van het spoor midden tussen beide spoorstaven;

      b. bij een hoofdspoorweg in ingraving: 6 m, gemeten uit de bovenzijde van de ingraving;

      c. bij een hoofdspoorweg in ophoging: 6 m, gemeten uit de teen van het talud;

      d. bij een hoofdspoorweg in een tunnel: 30 m, gemeten vanaf de buitenste wand van de tunnel; of

      e. bij een hoofdspoorweg op een brug of op een viaduct: 30 m, gemeten vanaf de buitenste rand van de constructie.

      2 Als een deel van de hoofdspoorweg alleen is bestemd voor goederenvervoer voor de lokale ontsluiting van
      haven- en industriegebieden, bestaat het beperkingengebied, in afwijking van het eerste lid, uit dat deel van
      de hoofdspoorweg en het daaromheen gelegen gebied, begrensd door een lijn liggend op een afstand van 3 m op
      maaiveldniveau, gemeten vanaf het hart van het buitenste spoor.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      Het beperkingengebied met betrekking tot installaties in een oppervlaktewaterlichaam anders dan
      mijnbouwinstallaties bestaat uit de installatie en het daaromheen gelegen gebied, begrensd door een lijn liggend op
      een afstand van 500 m van enig onderdeel van de installatie.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      Het beperkingengebied met betrekking tot een mijnbouwinstallatie in een oppervlaktewaterlichaam bestaat uit de
      mijnbouwinstallatie en het daaromheen gelegen gebied, begrensd door een lijn liggend op een afstand van 500 m van
      enig onderdeel van de mijnbouwinstallatie.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel3.7
