      1 Onze Minister van Infrastructuur en Waterstaat beslist op een enkel- of meervoudige aanvraag om een
      omgevingsvergunning als de aanvraag alleen betrekking heeft op een of meer van de volgende activiteiten:

      a. een ontgrondingsactiviteit in een rijkswater anders dan in het winterbed van een rivier;

      b. een milieubelastende activiteit waarbij nationale veiligheidsbelangen zijn betrokken als bedoeld in:

      1°. [artikel 3.247 van het Besluit activiteiten leefomgeving][ref1];

      2°. [artikel 3.324, eerste lid][ref2], [3.327][ref3], [3.332][ref4] of
      [3.335, eerste lid, van het Besluit activiteiten leefomgeving][ref5]; of

      3°. elke andere bepaling uit [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref6] waarin een
      vergunningplichtige milieubelastende activiteit is aangewezen, als die activiteit geheel of in hoofdzaak
      plaatsvindt op:

      i. een locatie als bedoeld in [artikel 5.28, onder b, van het Besluit kwaliteit leefomgeving][ref7]; of

      ii. een militair terrein of een terrein met een militair object als bedoeld in
      [artikel 5.150, eerste lid, van het Besluit kwaliteit leefomgeving][ref8];

      c. een beperkingengebiedactiviteit met betrekking tot een weg in beheer bij het Rijk, de luchthaven Schiphol, een
      overige burgerluchthaven van nationale betekenis, een hoofdspoorweg of een bijzondere spoorweg; of

      d. een activiteit anders dan bedoeld onder a tot en met c of in [artikel 4.10, eerste lid][ref9], [4.12][ref10] of
      [4.13][ref11], die geheel of in hoofdzaak plaatsvindt in:

      1°. de territoriale zee voor zover gelegen buiten het provinciaal en gemeentelijk ingedeelde gebied; of

      2°. de exclusieve economische zone.

      2 Onze Minister van Infrastructuur en Waterstaat beslist ook op een meervoudige aanvraag om een omgevingsvergunning
      als de aanvraag betrekking heeft op een of meer activiteiten als bedoeld in:

      a. het eerste lid, onder a, voor zover het gaat om een ontgrondingsactiviteit waarbij 100.000 m3 of meer in situ
      wordt ontgraven; of

      b. het eerste lid, onder b;

      en een of meer andere activiteiten.


