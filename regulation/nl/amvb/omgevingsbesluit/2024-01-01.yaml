  - number: '8.15'
    text: |-
      De kostensoorten, bedoeld in [artikel 13.11, eerste lid, aanhef, van de wet][ref1], zijn:

      a. voor kostenverhaalsgebieden waarvoor geen tijdvak als bedoeld in [artikel 13.15, eerste lid, van de wet][ref2]
      is opgenomen: de in tabel A van [bijlage IV][ref3] aangegeven kostensoorten; en

      b. voor kostenverhaalsgebieden waarvoor wel een tijdvak als bedoeld in
      [artikel 13.15, eerste lid, van de wet][ref4] is opgenomen: de in de tabellen A en B van [bijlage IV][ref5]
      aangegeven kostensoorten.


