  - number: '4.25'
    text: |-
      1 Gedeputeerde staten zijn adviseur voor een aanvraag om een omgevingsvergunning voor zover de aanvraag betrekking
      heeft op:

      a. een wateronttrekkingsactiviteit als bedoeld in [artikel 16.4 van het Besluit activiteiten leefomgeving][ref1];

      b. een ontgrondingsactiviteit in het winterbed van een tot de rijkswateren behorende rivier of buiten de
      rijkswateren, waarbij minder dan 100.000 m3 in situ wordt ontgraven;

      c. een milieubelastende activiteit als bedoeld in:

      1°. [artikel 3.19, eerste lid][ref2], of [3.48, eerste lid][ref3], voor zover het gaat om een activiteit als
      bedoeld in [artikel 3.47, onder a][ref4], of [artikel 19.1c van het Besluit activiteiten leefomgeving][ref5]; of

      2°. [artikel 3.321, eerste lid, van het Besluit activiteiten leefomgeving][ref6];

      d. een beperkingengebiedactiviteit met betrekking tot een burgerluchthaven van regionale
      betekenis of een lokale spoorweg die niet ligt in een gebied dat is aangewezen op grond van
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref7];

      e. een Natura 2000-activiteit of een flora- en fauna-activiteit die niet is aangewezen in
      [artikel 4.12, tweede en derde lid][ref8];

      f. een wateractiviteit of een andere activiteit waarvoor in de omgevingsverordening is bepaald dat het verrichten
      daarvan zonder omgevingsvergunning is verboden;

      g. een omgevingsplanactiviteit als bedoeld in [artikel 16.15a, onder d, van de wet][ref9]; of

      h. een rijksmonumentenactiviteit als bedoeld in [artikel 4.32, eerste lid, onder b][ref10], als het monument waarop
      de activiteit betrekking heeft buiten een krachtens de [Wegenverkeerswet 1994](onbekend) vastgestelde bebouwde kom
      is gelegen.

      2 Gedeputeerde staten zijn ook adviseur voor een aanvraag om een omgevingsvergunning voor zover de aanvraag
      betrekking heeft op een of meer activiteiten als bedoeld in [artikel 4.6, tweede lid][ref11], maar zij op grond van
      [artikel 4.15, eerste, tweede, derde of vierde lid][ref12], niet bevoegd zijn op die aanvraag te beslissen.

      3 De voorgenomen beslissing op de aanvraag behoeft ook instemming van gedeputeerde staten als het gaat om een
      aanvraag als bedoeld in het eerste lid, aanhef en onder a, b, c, onder 1°, d, e, f of g, of tweede lid, met
      uitzondering van:

      a. een aanvraag als bedoeld in het eerste lid, aanhef en onder f, als de activiteit betrekking heeft op een
      provinciaal monument of een voorbeschermd provinciaal monument; en

      b. een aanvraag als bedoeld in het eerste lid, aanhef en onder g, als de voorgenomen beslissing strekt tot:

      1°. het weigeren van de vergunning; of

      2°. het verlenen van de vergunning en de activiteit betrekking heeft op een provinciaal monument.


