  - number: '4.24'
    text: |-
      1 Het dagelijks bestuur van het waterschap is adviseur voor een aanvraag om een omgevingsvergunning voor zover de
      aanvraag betrekking heeft op:

      a. een lozingsactiviteit op een oppervlaktewaterlichaam dat onderdeel is van een watersysteem als bedoeld in
      [artikel 2.17, eerste lid, onder a, onder 1°, van de wet][ref1];

      b. een lozingsactiviteit op een zuiveringtechnisch werk;

      c. een activiteit waarvoor in de waterschapsverordening is bepaald dat het verrichten daarvan zonder
      omgevingsvergunning is verboden;

      d. een wateronttrekkingsactiviteit als bedoeld in [artikel 16.4 van het Besluit activiteiten leefomgeving][ref2];
      of

      e. een milieubelastende activiteit als bedoeld in
      [artikel 3.19, eerste lid, van het Besluit activiteiten leefomgeving][ref3].

      2 De voorgenomen beslissing op de aanvraag, bedoeld in het eerste lid, aanhef en onder a, b of c, behoeft ook
      instemming van het dagelijks bestuur van het waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2.17
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Artikel16.4
      [ref3]: https://wetten.overheid.nl/BWBR0041330#Artikel3.19
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel4.24
