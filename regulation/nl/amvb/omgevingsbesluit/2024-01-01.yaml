        afdeling: '3.4'
  - number: '5.6'
    text: |-
      Onverminderd [artikel 5.51 van de wet][ref1] bevat een projectbesluit in ieder geval:

      a. een beschrijving van het project;

      b. de voor de fysieke leefomgeving relevante permanente of tijdelijke maatregelen en voorzieningen om het project
      te realiseren; en

      c. de maatregelen die zijn gericht op het ongedaan maken, beperken of compenseren van de nadelige gevolgen van het
      project of van het in werking hebben of in stand houden daarvan voor de fysieke leefomgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5.51
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5.51'
  - number: '5.7'
    text: |-
      1 In een projectbesluit kan worden bepaald dat het projectbesluit geldt als:

      a. een besluit tot vaststelling van een geluidproductieplafond als omgevingswaarde als bedoeld in
      [artikel 2.12a, eerste lid][ref1], [2.13a, eerste lid][ref2], of [2.15, tweede lid, van de wet][ref3];

      b. een maatwerkvoorschrift op grond van regels als bedoeld in [artikel 4.3 van de wet][ref4];

      c. een verkeersbesluit als bedoeld in [artikel 15 van de Wegenverkeerswet 1994][ref5] voor zover het gaat om de
      uitvoering van het projectbesluit; en

      d. een onttrekking van een weg aan de openbaarheid als bedoeld in
      [artikel 7, aanhef en onder II, van de Wegenwet][ref6].

      2 Als het projectbesluit geldt als een besluit tot vaststelling van een geluidproductieplafond als
      omgevingswaarde als bedoeld in [artikel 2.12a, eerste lid][ref7], [2.13a, eerste lid][ref8], of
      [2.15, tweede lid, van de wet][ref9], is [afdeling 3.5 van het Besluit kwaliteit leefomgeving][ref10] van
      toepassing.

      3 Als het projectbesluit geldt als een maatwerkvoorschrift, is [paragraaf 4.3.2 van de wet][ref11] van
      overeenkomstige toepassing.

      4 Als het projectbesluit geldt als een verkeersbesluit, zijn de [artikelen 16, eerste lid][ref12], en
      [152 van de Wegenverkeerswet 1994][ref13] en de [artikelen 12 tot en met 15][ref14], [18][ref15] en
      [21 van het Besluit administratieve bepalingen inzake het wegverkeer][ref16] van toepassing.

      5 Als het projectbesluit geldt als een onttrekking van een weg aan de openbaarheid, zijn de
      [artikelen 4 tot en met 7 van de Wegenwet][ref17] van toepassing.


