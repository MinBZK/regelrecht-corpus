  - number: 10.36dc
    text: |-
      Onze Minister voor Natuur en Stikstof verstrekt aan de beide Kamers der Staten-Generaal de volgende verslagen met
      de volgende frequentie:

      a. elk jaar:

      1°. het verslag over de resultaten van de monitoring voor de omgevingswaarden voor stikstofdepositie, bedoeld in
      [artikel 11.68 van het Besluit kwaliteit leefomgeving][ref1]; en

      2°. het verslag over de mate waarin wordt voldaan aan de tussentijdse
      doelstellingen om tijdig aan die omgevingswaarden te voldoen, bedoeld in
      [artikel 11.69c, onder a, onder 2°, van het Besluit kwaliteit leefomgeving][ref2];

      b. elke twee jaar: het verslag over de voortgang en de gevolgen van de maatregelen,
      opgenomen in het programma stikstofreductie en natuurverbetering, bedoeld in
      [artikel 11.69c, onder b, van het Besluit kwaliteit leefomgeving][ref3]; en

      c. elke zes jaar: het verslag over de ontwikkeling van de staat van instandhouding van de voor stikstof gevoelige
      habitats in Natura 2000-gebieden in relatie tot de instandhoudingsdoelstellingen voor die gebieden, bedoeld in
      [artikel 11.69c, onder c, van het Besluit kwaliteit leefomgeving][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel11.68
