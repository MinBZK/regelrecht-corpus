  - number: '14.9'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verwerkt voor het verlenen van toegang tot de
      landelijke voorziening de volgende persoonsgegevens:

      a. over gebruikers:

      1°. gegevens om de gebruiker te identificeren, waaronder het burgerservicenummer, het eHerkenning pseudoniem in
      combinatie met het identificatienummer van de organisatie of het uniek identificerend nummer bij authenticatie
      buiten Nederland maar binnen de Europese Unie; en

      2°. profielgegevens, waaronder de naam, het e-mailadres, het telefoonnummer, de functie en voorkeursinstellingen;
      en

      b. over medewerkers van bestuursorganen en adviseurs:

      1°. gegevens om de medewerker te identificeren, waaronder het eHerkenning pseudoniem en het identificatienummer van
      de organisatie; en

      2°. profielgegevens, waaronder de naam, het e-mailadres, het telefoonnummer, de functie, contactgegevens van het
      bevoegd gezag en voorkeursinstellingen.

      2 De persoonsgegevens worden ten hoogste achttien maanden na het opheffen van het account in de landelijke
      voorziening bewaard.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel14.9
  - number: '14.10'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verwerkt voor het doorgeleiden van berichten naar het
      bevoegd gezag de volgende persoonsgegevens:

      a. over gebruikers:

      1°. gegevens om te communiceren met de gebruiker, waaronder de naam, de organisatienaam, het adres, het e-mailadres
      en het telefoonnummer;

      2°. gegevens om de gebruiker te identificeren, waaronder het burgerservicenummer of het identificatienummer van de
      organisatie; en

      3°. gegevens om het bericht te kunnen beoordelen volgens de daarvoor geldende regels, waaronder gegevens over de
      activiteit, gegevens over de locatie waar de activiteit wordt verricht, de vermogensrechtelijke status in relatie
      tot die locatie en financiële gegevens; en

      b. over derden die direct zijn betrokken bij de activiteit waarop het bericht betrekking heeft: gegevens om het
      bericht te kunnen beoordelen volgens de daarvoor geldende regels, waaronder de naam, het adres, het telefoonnummer,
      de functie en een bewijs van vakbekwaamheid.

      2 Voor de persoonsgegevens gelden de in [artikel 14.7, tweede en derde lid][ref1], genoemde bewaartermijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel14.7
