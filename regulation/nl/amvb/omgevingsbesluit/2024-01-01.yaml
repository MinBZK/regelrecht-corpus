  - number: 14.10b
    text: |-
      Het bestuursorgaan dat het initiatief heeft genomen tot het uitwisselen van gegevens, bedoeld in
      [artikel 14.8, vierde lid][ref1], kan de persoonsgegevens, bedoeld in [artikel 14.10a, eerste lid][ref2],
      verstrekken aan de volgende bestuursorganen of adviseurs voor zover dat noodzakelijk is voor een goede vervulling
      van een wettelijke taak:

      a. een ander bestuursorgaan vanwege de betrokkenheid van dat bestuursorgaan bij de voorbereiding van een besluit
      als bedoeld in [artikel 16.7 van de wet][ref3], waarop [afdeling 3.5 van de Algemene wet bestuursrecht][ref4] van
      toepassing is;

      b. een bestuursorgaan of andere instantie als bedoeld in [artikel 16.15 van de wet][ref5] vanwege de bevoegdheid
      tot advies van dat bestuursorgaan of die instantie;

      c. een bestuursorgaan als bedoeld in [artikel 16.16 van de wet][ref6] vanwege de bevoegdheid tot instemming van dat
      bestuursorgaan; en

      d. een adviseur, anders dan bedoeld onder b.


