  - number: '9.2'
    text: |-
      1 Het bestuursorgaan dat zijn bevoegdheid met toepassing van [artikel 15.8, derde lid, van de wet][ref1]
      overdraagt, geeft tegelijk met of zo spoedig mogelijk na de bekendmaking van het delegatiebesluit kennis van dat
      besluit op de in [artikel 12 van de Bekendmakingswet][ref2] bepaalde wijze en doet mededeling van dat besluit door
      toezending daarvan aan de aanvrager.

      2 Het eerste lid is van overeenkomstige toepassing als het delegatiebesluit wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel15.8
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel12
