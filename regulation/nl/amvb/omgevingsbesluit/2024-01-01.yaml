  - number: '4.10'
    text: |-
      1 Onze Minister van Economische Zaken en Klimaat beslist op een enkel- of meervoudige aanvraag om een
      omgevingsvergunning als de aanvraag alleen betrekking heeft op een of meer van de volgende activiteiten:

      a. een milieubelastende activiteit als bedoeld in
      [artikel 3.321, eerste lid, van het Besluit activiteiten leefomgeving][ref1];

      b. een mijnbouwlocatieactiviteit; of

      c. een beperkingengebiedactiviteit met betrekking tot een mijnbouwinstallatie in een waterstaatswerk.

      2 Onze Minister van Economische Zaken en Klimaat beslist ook op een meervoudige aanvraag om een omgevingsvergunning
      als de aanvraag betrekking heeft op een of meer activiteiten als bedoeld in:

      a. het eerste lid, onder a, tenzij het gaat om het aanleggen of het exploiteren van een mijnbouwwerk voor het
      opsporen of winnen van aardwarmte;

      b. het eerste lid, onder b; of

      c. het eerste lid, onder c;

      en een of meer andere activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel3.321
