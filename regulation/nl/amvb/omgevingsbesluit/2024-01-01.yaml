        artikel: '12'
  - number: '9.3'
    text: |-
      Voor de schade aangericht door dieren van de volgende soorten verlenen gedeputeerde staten een tegemoetkoming in
      schade als bedoeld in [artikel 15.53, eerste lid, van de wet][ref1]:

      a. soorten als bedoeld in artikel 1 van de vogelrichtlijn;

      b. soorten, genoemd in bijlage IV, onder a, bij de habitatrichtlijn, bijlage II bij het verdrag van Bern of
      bijlage I bij het verdrag van Bonn; en

      c. soorten, genoemd in [bijlage IX, onder A, bij het Besluit activiteiten leefomgeving][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel15.53
      [ref2]: https://wetten.overheid.nl/BWBR0041330
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel9.3
    references:
