  - number: '10.44'
    text: |-
      1 Het bestuursorgaan, bedoeld in [artikel 11.56 van het Besluit kwaliteit leefomgeving][ref1], verstrekt de
      gegevens, bedoeld in [artikel 5.10 van het Besluit activiteiten leefomgeving][ref2], na de kwaliteit daarvan
      te hebben beoordeeld, telkens uiterlijk op 30 september van het kalenderjaar volgend op het verslagjaar in
      elektronische vorm aan Onze Minister van Infrastructuur en Waterstaat.

      2 Het eerste lid is niet van toepassing:

      a. op gegevens waarover het bestuursorgaan op grond van
      [artikel 11.57, tweede lid, van het Besluit kwaliteit leefomgeving][ref3] heeft verklaard dat ze niet aan
      [artikel 5.10][ref4], [5.12][ref5] of [5.13 van het Besluit activiteiten leefomgeving][ref6] voldoen; of

      b. als het bestuursorgaan op grond van [artikel 11.58 van het Besluit kwaliteit leefomgeving][ref7] heeft
      verklaard dat geen PRTR-verslag is ingediend.

      3 In de gevallen, bedoeld in het tweede lid, meldt het bestuursorgaan aan Onze Minister van Infrastructuur en
      Waterstaat dat een verklaring als bedoeld in het tweede lid, aanhef en onder a of onder b, is afgegeven, uiterlijk
      op 30 september van het kalenderjaar volgend op het verslagjaar of, als dat eerder is, zodra die verklaring in
      werking is getreden.


