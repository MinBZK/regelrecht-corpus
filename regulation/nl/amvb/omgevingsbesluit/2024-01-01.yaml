      1 Het college van burgemeester en wethouders van een gemeente, waarvan het grondgebied ligt in een aandachtsgebied
      dat is aangewezen in [artikel 5.51, tweede of derde lid, van het Besluit kwaliteit leefomgeving][ref1], en
      gedeputeerde staten van de provincie waarvan het grondgebied in dat gebied ligt, verstrekken de gegevens, bedoeld
      in [artikel 11.22, eerste en tweede lid, van dat besluit][ref2], jaarlijks uiterlijk op 31 mei aan Onze Minister
      van Infrastructuur en Waterstaat.

      2 Onze Minister van Infrastructuur en Waterstaat stelt jaarlijks uiterlijk op 31 maart de gegevens, bedoeld in
      [artikel 11.22, derde lid, van het Besluit kwaliteit leefomgeving][ref3], elektronisch beschikbaar.

      3 Onze Minister van Infrastructuur en Waterstaat stelt jaarlijks uiterlijk op 31 december een verslag van
      de resultaten van de monitoring van de omgevingswaarden voor de kwaliteit van de buitenlucht, bedoeld in de
      [artikelen 2.3 tot en met 2.8a van het Besluit kwaliteit leefomgeving][ref4], elektronisch beschikbaar.


