      De bestuursorganen, bedoeld in [artikel 11.1 van het Besluit kwaliteit leefomgeving][ref1], verstrekken de
      gegevens over externe veiligheid, bedoeld in de [artikelen 11.2][ref2], [11.3][ref3], [11.4][ref4], [11.6][ref5]
      en [11.7 van dat besluit][ref6], aan Onze Minister van Infrastructuur en Waterstaat:

      a. als het gaat om een activiteit met externe veiligheidsrisico’s als bedoeld in de [artikelen 5.23][ref7],
      [5.26][ref8], [5.31 van dat besluit][ref9] of [bijlage VII, onder A, B, D, onder 1, en E, bij dat besluit][ref10],
      of waarvoor een vergunning is verleend op grond van [artikel 15, aanhef en onder b, van de Kernenergiewet][ref11],
      onverwijld na:

      1°. de inwerkingtreding van een besluit tot verlening, wijziging of intrekking van een omgevingsvergunning of een
      vergunning als bedoeld in [artikel 15, aanhef en onder b, van de Kernenergiewet][ref12];

      2°. de ontvangst van een melding op grond van het [Besluit activiteiten leefomgeving][ref13];

      3°. de ontvangst van de informatie inhoudende dat niet binnen de begrenzing van de locatie waar de activiteit wordt
      verricht aan de in het [Besluit activiteiten leefomgeving][ref14] voor die activiteit bepaalde afstand is voldaan;
      of

      4°. een uitspraak van de Afdeling bestuursrechtspraak van de Raad van State of een uitspraak van de Voorzitter van
      die Afdeling over een besluit als bedoeld onder 1° of een melding als bedoeld onder 2°; en

      b. voor locaties van beperkt kwetsbare, kwetsbare en zeer kwetsbare gebouwen en beperkt kwetsbare en kwetsbare
      locaties als bedoeld in [bijlage VI bij het Besluit kwaliteit leefomgeving][ref15] onverwijld na:

      1°. de inwerkingtreding van een besluit tot vaststelling van een omgevingsplan;

      2°. de inwerkingtreding van een besluit tot verlening, wijziging of intrekking van een omgevingsvergunning; of

      3°. een uitspraak van de Afdeling bestuursrechtspraak van de Raad van State of een uitspraak van de Voorzitter van
      die Afdeling, over een besluit als bedoeld onder 1° of 2°.


