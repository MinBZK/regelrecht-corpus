  - number: '4.6'
    text: |-
      1 Gedeputeerde staten beslissen op een enkel- of meervoudige aanvraag om een omgevingsvergunning als de aanvraag
      alleen betrekking heeft op een of meer van de volgende activiteiten:

      a. een omgevingsplanactiviteit van provinciaal belang;

      b. een ontgrondingsactiviteit in het winterbed van een tot de rijkswateren behorende rivier of buiten de
      rijkswateren;

      c. een milieubelastende activiteit als bedoeld in [artikel 3.19, eerste lid][ref1], [3.48][ref2], voor
      zover het gaat om een activiteit als bedoeld in [artikel 3.47, onder a][ref3], [3.51, eerste lid][ref4],
      [3.55, eerste lid][ref5], [3.58, eerste lid][ref6], [3.61, eerste lid][ref7], [3.64, eerste lid][ref8],
      [3.67, eerste lid][ref9], [3.70, eerste lid][ref10], [3.73, eerste lid][ref11], [3.76, eerste lid][ref12],
      [3.79, eerste lid][ref13], [3.82, eerste lid][ref14], [3.85, eerste lid][ref15], [3.88, eerste lid][ref16],
      [3.91, eerste lid][ref17], of [19.1c van het Besluit activiteiten leefomgeving][ref18];

      d. een beperkingengebiedactiviteit met betrekking tot een burgerluchthaven van regionale
      betekenis of een lokale spoorweg die niet ligt in een gebied dat is aangewezen op grond van
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref19];

      e. een Natura 2000-activiteit of een flora- en fauna-activiteit die niet is aangewezen in
      [artikel 4.12, tweede en derde lid][ref20]; of

      f. een activiteit waarvoor in de omgevingsverordening is bepaald dat het verrichten daarvan zonder
      omgevingsvergunning is verboden.

      2 Gedeputeerde staten beslissen ook op een meervoudige aanvraag om een omgevingsvergunning als de aanvraag
      betrekking heeft op een of meer activiteiten als bedoeld in:

      a. het eerste lid, onder a;

      b. het eerste lid, onder b, voor zover het gaat om een ontgrondingsactiviteit waarbij 100.000 m3 of meer in situ
      wordt ontgraven; of

      c. het eerste lid, onder c, met uitzondering van een milieubelastende activiteit als bedoeld in
      [artikel 3.19, eerste lid][ref21], [3.48][ref22], of [19.1c van het Besluit activiteiten leefomgeving][ref23];

      en een of meer andere activiteiten.


