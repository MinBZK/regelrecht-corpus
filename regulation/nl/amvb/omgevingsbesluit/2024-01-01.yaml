  - number: '13.21'
    text: |-
      1 Het bevoegd gezag, de toezichthouder, bedoeld in
      [artikel 1, derde lid, onder d, van de Arbeidsomstandighedenwet][ref1], en het bestuur van de veiligheidsregio
      werken gezamenlijk het toezichtplan uit in toezichtprogramma’s voor routinematig en niet-routinematig toezicht op
      een Seveso-inrichting.

      2 Een toezichtprogramma vermeldt ten minste de frequentie waarmee routinematig toezicht wordt gehouden. De
      frequentie waarmee routinematig toezicht wordt gehouden, is:

      a. voor hogedrempelinrichtingen: ten minste eenmaal per jaar; en

      b. voor Seveso-inrichtingen die geen hogedrempelinrichtingen zijn: ten minste eenmaal per drie jaar.

      3 Het tweede lid, tweede zin, is niet van toepassing als een toezichtprogramma is vastgesteld op grond van een
      systematische evaluatie van de gevaren van zware ongevallen, die ten minste is gebaseerd op:

      a. de mogelijke gevolgen voor de gezondheid en het milieu;

      b. gegevens over de naleving van [paragraaf 4.2 van het Besluit activiteiten leefomgeving][ref2]; en

      c. als dat passend is: bevindingen van het houden van toezicht op de naleving van andere wettelijke voorschriften
      dan die in [paragraaf 4.2 van het Besluit activiteiten leefomgeving][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Paragraaf4.2
      [ref3]: https://wetten.overheid.nl/BWBR0041330#Paragraaf4.2
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel13.21
