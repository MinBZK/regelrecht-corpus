  - number: '6.1'
    text: |-
      1 Een faunabeheereenheid heeft de rechtsvorm van een vereniging met volledige rechtsbevoegdheid of een stichting.

      2 In het bestuur van een faunabeheereenheid zijn in ieder geval vertegenwoordigd:

      a. de jachthouders uit het werkgebied van de faunabeheereenheid; en

      b. maatschappelijke organisaties die het doel behartigen van een duurzaam beheer van populaties van in het wild
      levende dieren in de regio waartoe het werkgebied van de faunabeheereenheid behoort.

      3 Vertegenwoordigers van andere dan de in het tweede lid bedoelde maatschappelijke organisaties en wetenschappers
      op het gebied van faunabeheer kunnen op uitnodiging van het bestuur van de faunabeheereenheid deelnemen aan de
      vergaderingen van het bestuur en het bestuur adviseren.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Een faunabeheerplan bevat in ieder geval passende en doeltreffende maatregelen voor het voorkomen en het
      bestrijden van schade aangericht door in het wild levende dieren.

      2 Een faunabeheerplan wordt onderbouwd door trendtellingen van de populaties van in het wild levende dieren in
      het gebied waarop het faunabeheerplan van toepassing is om een planmatige en doelmatige aanpak van het faunabeheer
      te bewerkstelligen.

      3 Een faunabeheerplan heeft geen betrekking op het beheren van populaties van exoten als bedoeld in
      [bijlage I bij het Besluit activiteiten leefomgeving][ref1] of verwilderde dieren en op het bestrijden van
      schadeveroorzakende exoten of verwilderde dieren.

      4 Voor diersoorten die bij ministeriële regeling zijn aangewezen vanwege de omvang van hun leefgebieden stellen
      faunabeheereenheden met een binnen een leefgebied vallend werkgebied gezamenlijk het faunabeheerplan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0041330
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0041330
  - number: '6.3'
    text: |-
      1 De faunabeheereenheid hoort de binnen haar werkgebied werkzame wildbeheereenheden over het ontwerp van het
      faunabeheerplan.

      2 De faunabeheereenheid maakt het faunabeheerplan openbaar, zodra dit door het bevoegd gezag op grond van
      [artikel 8.1, tweede of vijfde lid, van de wet][ref1] is goedgekeurd.

      3 De faunabeheereenheid brengt jaarlijks verslag uit van de uitvoering van het faunabeheerplan aan het bevoegd
      gezag voor de goedkeuring van het faunabeheerplan.

      4 Houders van een omgevingsvergunning voor een jachtgeweeractiviteit verstrekken aan de faunabeheereenheid gegevens
      over de aantallen dieren, onderscheiden naar soort, die zij binnen het werkgebied van de faunabeheereenheid hebben
      gedood.

      5 De faunabeheereenheden maken een overzicht van de door houders van een omgevingsvergunning voor een
      jachtgeweeractiviteit verstrekte gegevens en de gegevens uit het jaarlijkse verslag betrekking hebbend op hun
      totale werkgebied, openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '8.1'
  - number: '6.4'
    text: |-
      Onze Minister voor Natuur en Stikstof beslist over de goedkeuring van een faunabeheerplan en is
      bevoegd tot het stellen van de nadere regels over faunabeheereenheden en faunabeheerplannen, bedoeld
      in [artikel 8.1, derde lid, van de wet][ref1], en regels over wildbeheereenheden als bedoeld in
      [artikel 8.2, vijfde lid, van de wet][ref2] als deze betrekking hebben op terreinen waar de Kroondrager gerechtigd
      is tot het uitoefenen van de jacht.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel8.2
