  - number: '11.12'
    text: |-
      1 Als het bevoegd gezag degene is die voornemens is het project uit te voeren waarvoor een milieueffectrapport moet
      worden gemaakt, zorgt het bevoegd gezag in ieder geval voor een passende scheiding tussen conflicterende functies
      bij de ambtelijke voorbereiding van het besluit.

      2 Het bevoegd gezag legt de wijze waarop het zorg draagt voor een passende scheiding vast in een beschrijving van
      de werkprocessen en procedures en draagt zorg voor de naleving daarvan.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.12
  - number: '11.13'
    text: |-
      1 Het bevoegd gezag brengt advies uit over de reikwijdte en het detailniveau, bedoeld in
      [artikel 16.46, eerste lid, van de wet][ref1], met inachtneming van de informatie die is verstrekt door degene die
      voornemens is het project uit te voeren, in het bijzonder over:

      a. de specifieke kenmerken van het project, waaronder de locatie en de technische capaciteit; en

      b. de te verwachten milieueffecten van het project.

      2 Binnen zes weken na ontvangst van het verzoek, bedoeld in [artikel 16.46, eerste lid, van de wet][ref2], brengt
      het bevoegd gezag advies uit. Het bevoegd gezag kan de termijn eenmaal met ten hoogste zes weken verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16.46
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel16.46
