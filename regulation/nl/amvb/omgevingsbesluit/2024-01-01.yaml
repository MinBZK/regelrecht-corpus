  - number: '13.24'
    text: |-
      1 Het bevoegd gezag, de toezichthouder, bedoeld in
      [artikel 1, derde lid, onder d, van de Arbeidsomstandighedenwet][ref1], en het bestuur van de veiligheidsregio
      verschaffen aan een ieder de volgende gegevens:

      a. de datum waarop voor het laatst routinematig toezicht is gehouden of een verwijzing naar de plaats waar die
      informatie elektronisch kan worden geraadpleegd; en

      b. inlichtingen over de wijze waarop op verzoek meer gedetailleerde gegevens over het toezicht en het toezichtplan
      kunnen worden verkregen.

      2 Als gegevens als bedoeld in [artikel 19.3, eerste lid, laatste zin, van de Wet milieubeheer][ref2] worden
      aangewezen toezichtrapporten als bedoeld in [artikel 13.23, eerste lid][ref3].

      3 Als toepassing wordt gegeven aan de bevoegdheid, bedoeld in
      [artikel 19.3, eerste lid, eerste zin, van de Wet milieubeheer][ref4], wordt een aangepast toezichtrapport
      beschikbaar gesteld, dat ten minste algemene gegevens bevat over risico’s van zware ongevallen, de mogelijke
      gevolgen daarvan voor de gezondheid en het milieu en de bevindingen van het toezicht.


