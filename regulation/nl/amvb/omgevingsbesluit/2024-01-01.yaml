  - number: '8.11'
    text: |-
      1 Het bevoegd gezag stelt in het vergunningvoorschrift over financiële zekerheid vast hoe lang de financiële
      zekerheid in stand wordt gehouden.

      2 De financiële zekerheid voor het storten van afvalstoffen op een stortplaats, met uitzondering van een
      stortplaats waar alleen baggerspecie wordt gestort, wordt in stand gehouden tot de stortplaats is gekeurd als
      bedoeld in [artikel 8.59, onder b, van het Besluit kwaliteit leefomgeving][ref1].

      3 De financiële zekerheid voor het storten van baggerspecie op een stortplaats waar alleen baggerspecie wordt
      gestort, wordt in stand gehouden tot zo nodig een geohydrologisch isolatiesysteem of een afdeklaag op de gestorte
      baggerspecie is aangebracht.

      4 De financiële zekerheid voor het storten of verzamelen van winningsafvalstoffen in een winningsafvalvoorziening
      wordt in stand gehouden tot:

      a. de vergunning niet meer geldt, voor zover de financiële zekerheid ziet op het nakomen van de voorschriften
      die op grond van [paragraaf 8.5.2.6 van het Besluit kwaliteit leefomgeving][ref2] aan de omgevingsvergunning zijn
      verbonden; en

      b. de maatregelen, bedoeld in de [artikelen 8.49][ref3] en [8.50 van de Wet milieubeheer][ref4], zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel8.59
      [ref2]: https://wetten.overheid.nl/BWBR0041313#Paragraaf8.5.2.6
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8.49
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8.50
