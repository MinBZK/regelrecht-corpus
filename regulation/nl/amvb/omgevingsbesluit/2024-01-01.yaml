      1 Voor de toepassing van [paragraaf 12.1.6 van het Besluit kwaliteit leefomgeving][ref1] stellen onderstaande
      bestuursorganen uiterlijk op een bij koninklijk besluit te bepalen tijdstip een lijst samen van geluidgevoelige
      gebouwen:

      a. het college van burgemeester en wethouders: voor gemeentewegen en voor lokale spoorwegen die niet bij
      omgevingsverordening zijn aangewezen;

      b. het dagelijks bestuur van een waterschap: voor waterschapswegen; en

      c. gedeputeerde staten: voor provinciale wegen en voor lokale spoorwegen die bij omgevingsverordening zijn
      aangewezen.

      2 Op de lijst wordt vermeld een op het tijdstip van inwerkingtreding van dit besluit aanwezig geluidgevoelig gebouw
      dat ligt in het geluidaandachtsgebied van:

      a. een provinciale weg die binnen een krachtens de [Wegenverkeerswet 1994](onbekend) vastgestelde bebouwde kom
      ligt, waarvan het geluid, bij volledige benutting van de geluidproductieplafonds zoals die zijn vastgesteld op
      grond van [artikel 12.6, eerste lid, van het Besluit kwaliteit leefomgeving][ref2], meer dan 5 dB hoger is dan de
      grenswaarde, bedoeld in [tabel 3.35 van dat besluit][ref3];

      b. een provinciale weg die buiten die bebouwde kom ligt, waarvan het geluid, bij
      volledige benutting van de geluidproductieplafonds zoals die zijn vastgesteld op grond van
      [artikel 12.6, eerste lid, van het Besluit kwaliteit leefomgeving][ref4], hoger is dan de grenswaarde, bedoeld in
      [tabel 3.35 van dat besluit][ref5];

      c. een lokale spoorweg die bij omgevingsverordening is aangewezen, waarvan het geluid, bij
      volledige benutting van de geluidproductieplafonds, hoger is dan de grenswaarde, bedoeld in
      [tabel 3.35 van het Besluit kwaliteit leefomgeving][ref6]; of

      d. een gemeenteweg, waterschapsweg of lokale spoorweg die niet bij omgevingsverordening is aangewezen, waarvan het
      geluid in het jaar, bedoeld in [artikel 11.46, derde lid, van het Besluit kwaliteit leefomgeving][ref7] hoger is
      dan de grenswaarde, bedoeld in [tabel 3.35 van dat besluit][ref8].

      3 Op de lijst wordt niet vermeld een geluidgevoelig gebouw:

      a. waarop met toepassing van de [Interimwet stad-en-milieubenadering][ref9] een hogere geluidbelasting dan de
      maximale waarde op grond van de [Wet geluidhinder][ref10] is toegestaan;

      b. waarbij toepassing is gegeven aan
      [artikel 83, vierde, vijfde, zesde of zevende lid, van de Wet geluidhinder][ref11], zoals deze artikelen luidden
      voor het tijdstip van inwerkingtreding van dit besluit;

      c. dat eerder op grond van de [Wet geluidhinder][ref12] vanwege het geluid op kosten van het Rijk is gesaneerd
      en is vermeld op een uiterlijk een jaar na het tijdstip van inwerkingtreding van dit besluit door Onze Minister
      van Infrastructuur en Waterstaat te publiceren lijst, met uitzondering van gebouwen die zijn gesaneerd door een
      verkeersmaatregel waarmee een snelheid van 30 km/u is ingesteld en waarvoor geen rijksbijdrage voor geluidwerende
      maatregelen is ontvangen; of

      d. dat alleen aan de voorwaarden van het tweede lid voldoet voor een bouwkundige constructie die op grond van
      [artikel 1b, vierde lid, van de Wet geluidhinder][ref13] niet als gevel werd beschouwd.

      4 De lijst bevat voor elk geluidgevoelig gebouw in ieder geval:

      a. de in de Basisregistratie adressen en gebouwen opgenomen identificatienummers; en

      b. het in het tweede lid bedoelde geluid op het gebouw.


