      1 Het dagelijks bestuur van het waterschap beslist op een enkel- of meervoudige aanvraag om een omgevingsvergunning
      als de aanvraag alleen betrekking heeft op een of meer van de volgende wateractiviteiten:

      a. een lozingsactiviteit op een oppervlaktewaterlichaam dat onderdeel is van een watersysteem als bedoeld in
      [artikel 2.17, eerste lid, onder a, onder 1°, van de wet][ref1];

      b. een lozingsactiviteit op een zuiveringtechnisch werk; of

      c. een activiteit waarvoor in de waterschapsverordening is bepaald dat het verrichten daarvan zonder
      omgevingsvergunning is verboden.

      2 Het dagelijks bestuur van het waterschap beslist ook op een meervoudige aanvraag om een omgevingsvergunning als
      de aanvraag betrekking heeft op een of meer wateractiviteiten als bedoeld in het eerste lid en een of meer andere
      wateractiviteiten.


