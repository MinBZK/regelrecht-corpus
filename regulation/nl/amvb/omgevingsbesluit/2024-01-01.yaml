      30 september van het kalenderjaar volgend op het verslagjaar aan Onze Minister van Infrastructuur en Waterstaat
      mee:

      a. welk type informatie geheim is gehouden; en

      b. welke uitzonderingsgrond, bedoeld in [artikel 5.1 van de Wet open overheid][ref3], is toegepast.

