    text: |-
      1 Het bevoegd gezag neemt het resultaat van de beoordeling of sprake is van aanzienlijke milieueffecten, bedoeld in
      [artikel 16.36, vijfde lid, van de wet][ref1], met de bijbehorende motivering op in het plan of programma en, voor
      zover hier sprake van is, in het ontwerp van het plan of programma.

      2 [Artikel 16.36, derde lid, van de wet][ref2] is niet van toepassing op een plan of programma:

      a. dat het kader vormt voor te nemen besluiten voor een project als bedoeld in
      [artikel 16.43, eerste lid, onder a, van de wet][ref3]; of

      b. dat het benodigde besluit is voor een project als bedoeld in
      [artikel 16.43, eerste lid, onder a, van de wet][ref4].

      3 Een beoordeling of sprake is van aanzienlijke milieueffecten van een plan of programma als bedoeld in
      [artikel 16.36, derde lid, van de wet][ref5] dat het gebruik bepaalt van kleine gebieden op lokaal niveau vindt
      alleen plaats als:

      a. voor dat plan of programma een bestuursorgaan van een gemeente het bevoegd gezag is; en

      b. de omvang van dat gebied in verhouding tot het totale grondgebied van de gemeente klein is.

      4 Bij de beoordeling of sprake is van kleine wijzigingen van een plan of programma als bedoeld in
      [artikel 16.36, derde lid, van de wet][ref6], betrekt het bevoegd gezag de context van het plan of programma dat
      wordt gewijzigd en de mate van waarschijnlijkheid dat de wijzigingen aanzienlijke milieueffecten zullen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16.36
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel16.36
