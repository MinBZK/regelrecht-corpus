        artikel: '2'
      - id: ref2
        bwb_id: BWBR0023798
        artikel: 1.2.1
  - number: '14.5'
    text: |-
      Aan de Dienst, bedoeld in [artikel 2 van de Organisatiewet Kadaster][ref1], worden de in [bijlage VIII][ref2]
      genoemde gegevens over de besluiten en andere rechtsfiguren, bedoeld in [artikel 14.4, eerste lid, onder a][ref3],
      verstrekt door:

      a. het college van burgemeester en wethouders, voor zover het gaat om een besluit dat of een andere rechtsfiguur
      die op grond van de [wet][ref4] is vastgesteld door een bestuursorgaan van de gemeente;

      b. het dagelijks bestuur van een waterschap, voor zover het gaat om een besluit dat of een andere rechtsfiguur die
      op grond van de [wet][ref5] is vastgesteld door een bestuursorgaan van het waterschap;

      c. gedeputeerde staten, voor zover het gaat om een besluit dat of een andere rechtsfiguur die op grond van de
      [wet][ref6] is vastgesteld door een bestuursorgaan van de provincie; en

      d. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties of Onze Minister die het aangaat, voor zover het
      gaat om een besluit dat of een andere rechtsfiguur die op grond van de [wet][ref7] is vastgesteld door of op
      voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties respectievelijk Onze Minister die het
      aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0041278
      [ref3]: https://wetten.overheid.nl/BWBR0041278#Artikel14.4
      [ref4]: https://wetten.overheid.nl/BWBR0037885
      [ref5]: https://wetten.overheid.nl/BWBR0037885
      [ref6]: https://wetten.overheid.nl/BWBR0037885
      [ref7]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel14.5
