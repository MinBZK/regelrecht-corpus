  - number: 14.10a
    text: |-
      1 Bij het voorbereiden van beslissingen op aanvragen en het beoordelen van meldingen of gegevens en bescheiden om
      te voldoen aan andere informatieverplichtingen dan meldingen worden de volgende persoonsgegevens verwerkt:

      a. over initiatiefnemers:

      1°. gegevens om te communiceren met de initiatiefnemer, waaronder de naam, de organisatienaam, het adres, het e-
      mailadres en het telefoonnummer;

      2°. gegevens om de initiatiefnemer te identificeren, waaronder het burgerservicenummer of het identificatienummer
      van de organisatie; en

      3°. gegevens om de aanvraag, melding of gegevens en bescheiden te kunnen beoordelen volgens de daarvoor geldende
      regels, waaronder gegevens over de activiteit, gegevens over de locatie waar de activiteit wordt verricht, de
      vermogensrechtelijke status in relatie tot die locatie en financiële gegevens; en

      b. over derden die direct zijn betrokken bij de activiteit waarop de aanvraag of melding betrekking heeft of waarop
      de gegevens en bescheiden betrekking hebben: gegevens om de aanvraag, melding of gegevens en bescheiden te kunnen
      beoordelen volgens de daarvoor geldende regels, waaronder de naam, het adres, het telefoonnummer, de functie en een
      bewijs van vakbekwaamheid.

      2 Voor de persoonsgegevens gelden de in [artikel 14.7a, tweede lid][ref1], genoemde bewaartermijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel14.7a
