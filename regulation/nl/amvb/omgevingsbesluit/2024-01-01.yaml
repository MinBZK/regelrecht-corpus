  - number: '11.2'
    text: |-
      Uiterlijk op het moment van terinzagelegging van het milieueffectrapport stelt het bevoegd gezag de Commissie voor
      de milieueffectrapportage in de gelegenheid daarover te adviseren.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.2
  - number: '11.3'
    text: |-
      1 Het milieueffectrapport bevat in ieder geval de volgende informatie:

      a. een beschrijving van de inhoud van het plan of programma en de redelijke alternatieven, de belangrijkste
      doelstellingen van het plan of programma en het verband met andere relevante plannen en programma’s;

      b. de relevante aspecten van de bestaande staat of kwaliteit van het milieu en de mogelijke ontwikkeling daarvan
      als het plan of programma niet wordt uitgevoerd;

      c. de milieukenmerken van gebieden waarvoor de effecten van het plan of programma aanzienlijk kunnen zijn;

      d. alle bestaande milieuproblemen die relevant zijn voor het plan of programma, in het bijzonder de problemen in
      gebieden waar het belang van het beschermen van het milieu een belangrijke rol speelt;

      e. een beschrijving van de wijze waarop de doelstellingen ter bescherming van het milieu die zijn vastgesteld
      op internationaal, communautair of nationaal niveau en andere milieuoverwegingen zijn betrokken bij het plan of
      programma, voor zover zij relevant zijn voor het plan of programma;

      f. een beschrijving van de mogelijk aanzienlijke milieueffecten van de uitvoering van het plan of programma en van
      de redelijke alternatieven, met inbegrip van een beoordeling van die milieueffecten;

      g. de voorgenomen maatregelen om de aanzienlijke nadelige milieueffecten van de uitvoering van het plan of
      programma te voorkomen, te beperken of zoveel mogelijk te compenseren;

      h. een motivering van de selectie van de onderzochte alternatieven en een beschrijving van de wijze waarop de
      milieueffecten zijn vastgesteld en beoordeeld, met inbegrip van de moeilijkheden die bij het verzamelen van de
      vereiste informatie zijn ondervonden, zoals technische tekortkomingen of ontbrekende kennis;

      i. een beschrijving van de voorgenomen monitoringsmaatregelen; en

      j. een niet-technische samenvatting van de op grond van de onderdelen a tot en met i verstrekte informatie.

      2 Het milieueffectrapport bevat de informatie die redelijkerwijs mag worden vereist, ook gelet op de stand van
      kennis en beoordelingsmethoden en de inhoud van het plan of programma.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.3
  - number: '11.4'
    text: |-
      1 In het plan of programma, waarvoor bij de voorbereiding een milieueffectrapport moet worden gemaakt, vermeldt het
      bevoegd gezag in ieder geval hoe rekening is gehouden met:

      a. het milieueffectrapport; en

      b. het advies van de Commissie voor de milieueffectrapportage.

      2 Daarnaast bevat het plan of programma in ieder geval:

      a. een samenvatting van de milieuoverwegingen die zijn betrokken bij het vaststellen van het plan of programma;

      b. een samenvatting van de redenen om te kiezen voor het vastgestelde plan of programma, waarbij in ieder geval de
      in het milieueffectrapport beschreven redelijke alternatieven worden betrokken; en

      c. de monitoringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.4
  - number: '11.5'
    text: |-
      1 Het bevoegd gezag monitort de aanzienlijke milieueffecten van de uitvoering van het plan of programma, waarvoor
      bij de voorbereiding een milieueffectrapport moet worden gemaakt.

      2 Het bevoegd gezag kan hiervoor gebruik maken van bestaande monitoring.

      3 Het bevoegd gezag stelt de resultaten van de monitoring elektronisch beschikbaar.

      4 Het bevoegd gezag treft, als dat naar zijn oordeel nodig is, passende maatregelen om de onvoorziene nadelige
      milieueffecten zoveel mogelijk te beperken of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.5
  - number: '11.6'
    text: |-
      1 [Bijlage V][ref1], kolom 2 in samenhang met kolom 1, bevat de projecten, bedoeld in
      [artikel 16.43, eerste lid, onder a, van de wet][ref2], die aanzienlijke milieueffecten kunnen hebben en waarvoor
      bij de voorbereiding van het besluit een milieueffectrapport moet worden gemaakt.

      2 [Bijlage V][ref3], kolom 3 in samenhang met kolom 1, bevat de projecten, bedoeld in
      [artikel 16.43, eerste lid, onder b, van de wet][ref4], waarvoor moet worden beoordeeld of zij aanzienlijke
      milieueffecten kunnen hebben en, als dat het geval is, waarvoor bij de voorbereiding van het besluit een
      milieueffectrapport moet worden gemaakt.

      3 Als benodigde besluiten als bedoeld in [artikel 16.43, eerste lid, van de wet][ref5], die betrekking hebben op de
      projecten, bedoeld in het eerste en tweede lid, worden aangewezen:

      a. een projectbesluit als bedoeld in [artikel 5.44 van de wet][ref6], met uitzondering van een projectbesluit dat
      wordt vastgesteld door het dagelijks bestuur van een waterschap;

      b. het opnemen van regels in een omgevingsplan die zijn gericht op het uitvoeren van een project van publiek belang
      als bedoeld in [artikel 5.55 van de wet][ref7];

      c. de besluiten, bedoeld in [bijlage V][ref8], kolom 4; en

      d. de besluiten, bedoeld in [artikel 11.8][ref9].


