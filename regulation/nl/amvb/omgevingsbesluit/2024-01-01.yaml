  - number: 4.11a
    text: |-
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit beslist op een enkel- of meervoudige aanvraag om een
      omgevingsvergunning als de aanvraag alleen betrekking heeft op een of meer milieubelastende activiteiten als
      bedoeld in [artikel 3.48b van het Besluit activiteiten leefomgeving][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel3.48b
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel4.11a
    references:
      - id: ref1
