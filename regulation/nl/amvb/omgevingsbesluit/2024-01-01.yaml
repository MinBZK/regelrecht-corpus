        artikel: '18.1'
  - number: '13.5'
    text: |-
      1 De bestuursorganen die zijn belast met de uitvoerings- en handhavingstaak stellen een uitvoerings- en
      handhavingsstrategie vast in een of meer documenten waarin gemotiveerd wordt aangegeven welke doelen worden gesteld
      voor de uitvoering en handhaving en welke werkzaamheden met het oog op die doelen zullen worden verricht.

      2 De bestuursorganen die deelnemen in een omgevingsdienst stellen gezamenlijk een uniforme uitvoerings- en
      handhavingsstrategie vast voor de werkzaamheden, bedoeld in [artikel 13.12, eerste lid][ref1].

      3 De handhavingsstrategie wordt zo nodig afgestemd met de instanties die zijn belast met de strafrechtelijke
      handhaving.

      4 De handhavingsstrategie wordt gebaseerd op een analyse van de problemen die zich kunnen voordoen bij de naleving
      van het bepaalde bij of krachtens de [wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel13.12
      [ref2]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel13.5
    references:
      - id: ref1
