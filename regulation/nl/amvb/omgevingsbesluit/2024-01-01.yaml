  - number: '4.17'
    text: |-
      1 Het met toepassing van [artikel 5.16 van de wet][ref1] overdragen van de bevoegdheid om op een aanvraag om
      een omgevingsvergunning te beslissen of om [paragraaf 5.1.5 van de wet][ref2] voor een omgevingsvergunning toe
      te passen, kan zich alleen uitstrekken tot meer dan een aanvraag om een omgevingsvergunning of meer dan een al
      verleende omgevingsvergunning als de aanvragen of vergunningen betrekking hebben op:

      a. activiteiten die worden verricht op hetzelfde bedrijventerrein; of

      b. een in een ander opzicht samenhangend geheel van activiteiten.

      2 Het bestuursorgaan dat zijn bevoegdheid met toepassing van [artikel 5.16 van de wet][ref3] overdraagt, geeft
      tegelijk met of zo spoedig mogelijk na de bekendmaking van het delegatiebesluit kennis van dat besluit op de
      in [artikel 12 van de Bekendmakingswet][ref4] bepaalde wijze en doet mededeling van dat besluit door toezending
      daarvan aan de aanvrager of de vergunninghouder.

      3 Het tweede lid is van overeenkomstige toepassing als het delegatiebesluit wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5.16
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Paragraaf5.1.5
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel5.16
      [ref4]: https://wetten.overheid.nl/BWBR0004287#Artikel12
