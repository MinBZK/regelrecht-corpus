        afdeling: '13.2'
      - id: ref2
        bwb_id: BWBR0041278
        artikel: '13.6'
        hoofdstuk: '13'
        paragraaf: 13.2.2
        afdeling: '13.2'
  - number: '13.9'
    text: |-
      1 De bestuursorganen, bedoeld in [artikel 13.5][ref1], richten hun organisatie zodanig in dat een goede uitvoering
      van de uitvoerings- en handhavingsstrategie en het uitvoeringsprogramma is gewaarborgd.

      2 De bestuursorganen dragen er in ieder geval zorg voor dat:

      a. de personeelsformatie voor de uitvoering en handhaving en de bij de functies behorende taken, bevoegdheden en
      verantwoordelijkheden worden vastgelegd;

      b. een persoon die door hen is belast met het beoordelen van en beslissen op een aanvraag om een
      omgevingsvergunning, het beoordelen van en beslissen op een aanvraag om toestemming tot het treffen van een
      gelijkwaardige maatregel of het stellen van een maatwerkvoorschrift ten aanzien van een milieubelastende activiteit
      als bedoeld in [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref2], niet wordt belast met:

      1°. het toezicht op de naleving van het bepaalde bij of krachtens de [wet][ref3] ten aanzien van dezelfde
      milieubelastende activiteit; en

      2°. het opleggen en ten uitvoer leggen van een bestuurlijke sanctie ten aanzien van dezelfde milieubelastende
      activiteit;

      c. een door hen met het toezicht op de naleving van het bepaalde bij of krachtens de [wet][ref4] belaste persoon
      niet voortdurend wordt belast met het toezicht op dezelfde milieubelastende activiteit; en

      d. de bereikbaarheid en beschikbaarheid van hun organisatie ook buiten kantooruren is gegarandeerd.

      3 De bestuursorganen dragen er ook zorg voor dat de werkprocessen, procedures en bijbehorende informatievoorziening
      voor de uitvoering en handhaving worden vastgelegd en dat werkzaamheden worden verricht volgens deze werkprocessen
      en procedures.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel13.5
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037885
      [ref4]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel13.9
