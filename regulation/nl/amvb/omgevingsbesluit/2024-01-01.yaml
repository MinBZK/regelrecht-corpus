  - number: '4.15'
    text: |-
      1 Als gedeputeerde staten op grond van [artikel 4.6, tweede lid][ref1], en Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties op grond van [artikel 4.8, tweede lid][ref2], als bevoegd gezag zijn aangewezen, beslist Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties op de aanvraag.

      2 Als gedeputeerde staten op grond van [artikel 4.6, tweede lid][ref3], en Onze Minister van Economische Zaken en
      Klimaat op grond van [artikel 4.10, tweede lid][ref4], als bevoegd gezag zijn aangewezen, beslist Onze Minister van
      Economische Zaken en Klimaat op de aanvraag.

      3 Als gedeputeerde staten op grond van [artikel 4.6, tweede lid][ref5], en Onze Minister van Infrastructuur en
      Waterstaat op grond van [artikel 4.11, tweede lid][ref6], als bevoegd gezag zijn aangewezen, beslist Onze Minister
      van Infrastructuur en Waterstaat op de aanvraag.

      4 Als meer dan een van Onze hiervoor genoemde Ministers op grond van [artikel 4.8, tweede lid][ref7],
      [4.10, tweede lid][ref8], of [4.11, tweede lid][ref9], en in voorkomend geval ook gedeputeerde staten op grond van
      [artikel 4.6, tweede lid][ref10], als bevoegd gezag zijn aangewezen, beslist Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties op de aanvraag.


