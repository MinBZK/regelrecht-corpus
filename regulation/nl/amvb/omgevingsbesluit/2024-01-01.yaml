  - number: 10.26d
    text: |-
      De toelatingsorganisatie neemt binnen twee werkdagen na de datum waarop een beschikking als bedoeld in
      [artikel 7ad][ref1], [7ae][ref2], [7af][ref3] of [7ag van de Woningwet][ref4] is gegeven in het register, bedoeld
      in [artikel 7ai, eerste lid, van die wet][ref5] op:

      a. de datum van de beschikking tot toelating van het instrument, de bedrijfsnaam en de plaats van vestiging van de
      instrumentaanbieder, en het nummer van inschrijving van de instrumentaanbieder in het handelsregister;

      b. de naam van het toegelaten instrument, met vermelding van de gevolgklassen en de type bouwwerken waarop het
      instrument is gericht;

      c. de datum van de aan de instrumentaanbieder gegeven waarschuwing en de datum en de termijn van de schorsing
      of intrekking van de toelating van een instrument met vermelding van de reden voor de waarschuwing, schorsing of
      intrekking.


