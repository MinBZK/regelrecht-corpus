        bwb_id: BWBR0037885
        artikel: 5.44b
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '12'
  - number: '5.2'
    text: |-
      1 Het voornemen om een verkenning uit te voeren naar een mogelijk bestaande of toekomstige opgave in de fysieke
      leefomgeving bevat in ieder geval:

      a. een beschrijving van die opgave;

      b. een beschrijving van de wijze waarop de verkenning zal worden uitgevoerd;

      c. de termijn waarbinnen de verkenning zal worden uitgevoerd; en

      d. een vermelding van het bevoegd gezag.

      2 Het bevoegd gezag geeft kennis van het voornemen op de in [artikel 12 van de Bekendmakingswet][ref1] bepaalde
      wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
  - number: '5.3'
    text: |-
      1 In de kennisgeving van de wijze waarop burgers, bedrijven, maatschappelijke organisaties en bestuursorganen
      zullen worden betrokken, bedoeld in [artikel 5.47, vierde lid, van de wet][ref1], wordt in ieder geval aangegeven:

      a. wie worden betrokken;

      b. waarover zij worden betrokken;

      c. wanneer zij worden betrokken;

      d. wat de rol is van het bevoegd gezag en de initiatiefnemer bij het betrekken van deze partijen; en

      e. waar aanvullende informatie beschikbaar is.

      2 De kennisgeving vindt plaats op een door het bevoegd gezag te bepalen geschikte wijze, waardoor het voor de te
      verkennen opgave in de fysieke leefomgeving relevante publiek zo goed mogelijk wordt bereikt.

      3 Het bevoegd gezag draagt er zorg voor dat de benodigde informatie voor het betrekken van burgers,
      bedrijven, maatschappelijke organisaties en bestuursorganen op een toegankelijke wijze beschikbaar is.
      [Artikel 5.1 van de Wet open overheid][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5.47
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel5.3
    references:
