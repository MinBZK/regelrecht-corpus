      1 Onze Minister van Economische Zaken en Klimaat is adviseur voor een aanvraag om een omgevingsvergunning
      voor zover de aanvraag betrekking heeft op een milieubelastende activiteit als bedoeld in
      [artikel 3.321, eerste lid, van het Besluit activiteiten leefomgeving][ref1], voor zover het gaat om het aanleggen
      of het exploiteren van een mijnbouwwerk voor het opsporen of winnen van aardwarmte.

      2 Onze Minister van Economische Zaken en Klimaat is ook adviseur voor een aanvraag om een omgevingsvergunning voor
      zover de aanvraag betrekking heeft op een of meer activiteiten als bedoeld in [artikel 4.10, tweede lid][ref2],
      maar hij op grond van [artikel 4.15, vierde lid][ref3], niet bevoegd is op die aanvraag te beslissen.

