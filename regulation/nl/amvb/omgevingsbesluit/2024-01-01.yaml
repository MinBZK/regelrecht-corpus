        artikel: '16.43'
  - number: '11.29'
    text: |-
      1 Binnen een door de partijen afgesproken termijn overlegt het bevoegd gezag met de bevoegde autoriteit van de
      andere staat over de mogelijk aanzienlijke grensoverschrijdende milieueffecten van het project en de voorgenomen
      maatregelen om de nadelige effecten te vermijden, te voorkomen, te beperken en, als dat mogelijk is, te
      compenseren.

      2 Onze Minister van Infrastructuur en Waterstaat kan contacten onderhouden met de bevoegde autoriteit van de andere
      staat als er geen contact is tussen het bevoegd gezag en die autoriteit of als het overleg niet tot het gewenste
      resultaat heeft geleid. Het bevoegd gezag zendt de benodigde informatie aan Onze Minister van Infrastructuur en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.29
  - number: '11.30'
    text: |-
      Nadat het besluit is vastgesteld, verstrekt het bevoegd gezag dat besluit aan de bevoegde autoriteit, het betrokken
      publiek en de bevoegde instanties van de andere staat.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.30
  - number: '11.31'
    text: |-
      1 Als het bevoegd gezag voor de uitvoering van een project als bedoeld in
      [artikel 16.43, eerste lid van de wet][ref1], waarvoor bij de voorbereiding van het besluit een milieueffectrapport
      moet worden gemaakt, over nieuwe informatie beschikt over een mogelijk nadelig grensoverschrijdend milieueffect,
      die niet beschikbaar was op het moment dat het besluit werd genomen en die het besluit inhoudelijk zou kunnen
      hebben beïnvloed, deelt het bevoegd gezag deze nieuwe informatie mee aan de bevoegde autoriteit van de andere
      staat.

      2 Als een van de staten hierom verzoekt, vindt overleg plaats over de vraag of het besluit naar aanleiding van die
      nieuwe informatie moet worden gewijzigd.

      3 Als de staten hiertoe gezamenlijk besluiten, voert het bevoegd gezag een evaluatie uit van het mogelijk nadelige
      grensoverschrijdende milieueffect van de uitvoering van het project, waarvoor bij de voorbereiding van het besluit
      een milieueffectrapport moet worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16.43
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.31
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16.43'
  - number: '11.32'
    text: |-
      1 Als de bevoegde autoriteit van een andere staat heeft meegedeeld dat een project mogelijk aanzienlijke
      grensoverschrijdende milieueffecten heeft in Nederland, geeft het betrokken bestuursorgaan binnen de door die
      autoriteit gestelde termijn aan of deelname aan de procedure van de milieueffectrapportage gewenst is.

      2 Als toepassing is gegeven aan het eerste lid, overlegt het betrokken bestuursorgaan met de bevoegde autoriteit
      over de mogelijk aanzienlijke milieueffecten van het project en de voorgenomen maatregelen om de nadelige effecten
      te voorkomen, te beperken of te mitigeren.

      3 Als toepassing is gegeven aan het eerste lid, stelt het betrokken bestuursorgaan, in overeenstemming met de
      bevoegde autoriteit, het betrokken publiek en de bevoegde instanties in de gelegenheid zienswijzen naar voren te
      brengen.

      4 Als toepassing is gegeven aan het eerste lid, geeft het betrokken bestuursorgaan, in overeenstemming met de
      bevoegde autoriteit en met overeenkomstige toepassing van [artikel 3:42 van de Algemene wet bestuursrecht][ref1],
      kennis van:

      a. het genomen besluit;

      b. een door de bevoegde autoriteit opgestelde samenvatting van de wijze waarop de milieuoverwegingen, de gehouden
      overleggen, de naar voren gebrachte zienswijzen en het milieueffectrapport zijn betrokken bij het nemen van een
      besluit voor het project; en

      c. de monitoringsmaatregelen waartoe de bevoegde autoriteit heeft besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel342
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel11.32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:42
  - number: '12.1'
    text: |-
      De Commissie voor de milieueffectrapportage bestaat uit een voorzitter en ten hoogste veertien plaatsvervangend
      voorzitters.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel12.1
  - number: '12.2'
    text: |-
      1 De Commissie voor de milieueffectrapportage heeft een secretaris en een bureau dat onder leiding staat van die
      secretaris.

      2 De secretaris van de Commissie voor de milieueffectrapportage wordt benoemd en ontslagen door de voorzitter van
      de commissie, na overleg met de plaatsvervangend voorzitters.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel12.2
  - number: '12.3'
    text: |-
      De Commissie voor de milieueffectrapportage brengt jaarlijks voor 1 april aan Onze Minister van Infrastructuur en
      Waterstaat verslag uit van haar werkzaamheden in het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel12.3
  - number: '12.4'
    text: |-
      1 Als de Commissie voor de milieueffectrapportage in de gelegenheid wordt gesteld te adviseren, stelt de voorzitter
      of een plaatsvervangend voorzitter daarvoor een werkgroep van deskundigen samen.

      2 De secretaris van de Commissie voor de milieueffectrapportage deelt aan het bevoegd gezag en aan degene die het
      milieueffectrapport maakt of zou moeten maken mee uit welke deskundigen de werkgroep bestaat.

      3 Een werkgroep staat onder voorzitterschap van de voorzitter of een plaatsvervangend voorzitter.

      4 De deskundigen in een werkgroep worden aangewezen door de voorzitter of een plaatsvervangend voorzitter.

      5 Als een deskundige niet meer voldoet aan [artikel 17.5, tweede lid, van de wet, ontheft][ref1] de voorzitter van
      de werkgroep hem van zijn deelname in de werkgroep. Als de voorzitter niet de voorzitter van de Commissie voor de
      milieueffectrapportage is, gebeurt dit na overleg met laatstgenoemde voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel17.5
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '17.5'
  - number: '12.5'
    text: |-
      1 De werkgroep, bedoeld in [artikel 12.4, eerste lid][ref1], adviseert aan het bevoegd gezag.

      2 De adviezen worden uitgebracht in overeenstemming met het gevoelen van de meerderheid van de deskundigen in de
      werkgroep.

      3 Op verzoek van de deskundigen die in de werkgroep een standpunt hebben verdedigd, dat afwijkt van het gevoelen
      van de meerderheid, wordt dat standpunt in het advies vermeld. Deze deskundigen kunnen over een zodanig standpunt
      een afzonderlijke nota bij het advies voegen.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel12.4
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel12.5
    references:
      - id: ref1
        bwb_id: BWBR0041278
        artikel: '12.4'
        hoofdstuk: '12'
        afdeling: '12.1'
  - number: '12.6'
    text: |-
      Er is een OCW-schadebeoordelingscommissie archeologische rijksmonumenten die tot taak
      heeft advies uit te brengen aan bestuursorganen over schadevergoeding als bedoeld in
      [artikel 4:126, eerste lid, van de Algemene wet bestuursrecht][ref1] in samenhang met
      [artikel 15.1, eerste lid, onder k, van de wet][ref2], voor zover de schade voortvloeit uit beslissingen op
      aanvragen om omgevingsvergunningen voor rijksmonumentenactiviteiten met betrekking tot een archeologisch monument.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4126
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel15.1
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel12.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:126
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '15.1'
  - number: '12.7'
    text: De OCW-schadebeoordelingscommissie archeologische rijksmonumenten bestaat uit ten hoogste zeven leden.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel12.7
  - number: '12.8'
    text: |-
      1 De wetenschappelijke autoriteit CITES bestaat uit ten minste vijf en ten hoogste negen leden, de voorzitter
      daaronder begrepen.

      2 De leden bezitten ook deskundigheid op het gebied van natuurbescherming, welzijn van dieren en opvang van dieren.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel12.8
  - number: '13.1'
    text: |-
      1 De bestuursrechtelijke handhavingstaak, bedoeld in [artikel 18.1 van de wet][ref1], berust in de volgende
      gevallen niet bij het college van burgemeester en wethouders, maar bij het hierna genoemde bestuursorgaan:

      a. het dagelijks bestuur van het waterschap: bij een door hem vastgesteld peilbesluit als bedoeld in
      [artikel 2.41, eerste lid, van de wet][ref2];

      b. gedeputeerde staten:

      1°. bij een zwemverbod als bedoeld in [artikel 2.38 van de wet][ref3];

      2°. bij een door hen ingestelde toegangsbeperking tot een Natura 2000-gebied of een bijzonder nationaal
      natuurgebied als bedoeld in [artikel 2.45 van de wet][ref4];

      3°. bij een bij omgevingsverordening gestelde verplichting tot monitoring als bedoeld in
      [artikel 20.1 van de wet][ref5] of gegevensverzameling als bedoeld in [artikel 20.6 van de wet][ref6], voor zover
      niet gericht tot een bestuursorgaan; en

      4°. bij de verplichting tot het treffen van maatregelen, gericht op het
      voldoen aan een geluidproductieplafond als omgevingswaarde, bedoeld in
      [artikel 3.45, eerste lid, aanhef en onder a en b, van het Besluit kwaliteit leefomgeving][ref7], en, voor zover
      toepassing is gegeven aan [artikel 2.12a van de wet][ref8], artikel 3.45, tweede lid, aanhef onder a, van dat
      besluit;

      c. de commissaris van de Koning: bij een tijdelijke regel als bedoeld in
      [artikel 19.12, eerste lid, van de wet][ref9];

      d. Onze Minister van Infrastructuur en Waterstaat:

      1°. bij een toegangsverbod als bedoeld in [artikel 2.40, eerste lid, van de wet][ref10];

      2°. bij een peilbesluit als bedoeld in [artikel 2.41, tweede lid, van de wet][ref11];

      3°. bij een activiteit die geheel of in hoofdzaak plaatsvindt in de territoriale zee, voor zover gelegen buiten
      het provinciaal en gemeentelijk ingedeelde gebied, of die geheel of in hoofdzaak plaatsvindt in de exclusieve
      economische zone;

      4°. bij de zorgplicht voor de akoestische kwaliteit van op grond van
      [artikel 2.15, tweede lid, aanhef en onder a en b, van de wet][ref12] bij ministeriële regeling aangewezen
      rijkswegen en hoofdspoorwegen, bedoeld in [artikel 3.29 van het Besluit kwaliteit leefomgeving][ref13];

      5°. bij de verplichting tot het treffen van maatregelen, gericht op het
      voldoen aan een geluidproductieplafond als omgevingswaarde, bedoeld in
      [artikel 3.45, eerste lid, aanhef en onder c en d, van het Besluit kwaliteit leefomgeving][ref14]; en

      6°. bij een milieubelastende activiteit als bedoeld in [artikel 3.48m][ref15], [3.48o][ref16] of
      [3.48r van het Besluit activiteiten leefomgeving][ref17], voor zover het gaat om het in opdracht op of in de
      landbodem toepassen van bouwstoffen, grond of baggerspecie;

      e. Onze Minister van Financiën: bij het onthouden van toestemming tot vertrek van een vaartuig of luchtvaartuig uit
      Nederland als bedoeld in [artikel 18.8 van de wet][ref18];

      f. Onze Minister voor Natuur en Stikstof:

      1°. bij een door hem ingestelde toegangsbeperking tot een Natura 2000-gebied of een bijzonder nationaal
      natuurgebied als bedoeld in [artikel 2.45 van de wet][ref19]; en

      2°. bij het verbod tot het verrichten van activiteiten binnen de afpalingskring van een eendenkooi, bedoeld in
      [artikel 8.5 van de wet][ref20];

      g. Onze Minister van Onderwijs, Cultuur en Wetenschap: bij een verplichting in verband met een archeologische
      toevalsvondst van algemeen belang opgelegd krachtens de [artikelen 19.8, tweede of derde lid][ref21],
      en [19.9 van de wet][ref22], in verbinding met [artikel 19.3, tweede lid][ref23], of
      [19.4, eerste en tweede lid, van de wet][ref24]; en

      h. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties: bij een regel over het energielabel, gesteld in
      [afdeling 6.4 van het Besluit bouwwerken leefomgeving][ref25] of bij ministeriële regeling.

      2 De bestuursrechtelijke handhavingstaak, bedoeld in [artikel 18.1 van de wet][ref26], berust in de volgende
      gevallen evenmin bij het college van burgemeester en wethouders, maar bij het hierna aangegeven bestuursorgaan,
      voor zover dat een ander bestuursorgaan is dan het college van burgemeester en wethouders:

      a. het bestuursorgaan dat op grond van [paragraaf 2.4.1 van de wet][ref27] bevoegdheden of taken toebedeeld heeft
      gekregen met betrekking tot een specifiek aspect van de fysieke leefomgeving: bij een activiteit die in strijd is
      met de zorgplicht, bedoeld in de [artikelen 1.6][ref28] en [1.7 van de wet][ref29], of met het verbod, bedoeld in
      [artikel 1.7a van de wet][ref30], voor zover het gaat om het specifieke aspect van de fysieke leefomgeving;

      b. het dagelijks bestuur van een ander openbaar lichaam als bedoeld in
      [artikel 2.41, eerste lid, van de wet][ref31]: bij een door hem vastgesteld peilbesluit als bedoeld in dat
      artikellid;

      c. het bestuursorgaan dat een projectbesluit heeft vastgesteld: bij een projectbesluit, voor zover dat besluit
      geldt als:

      1°. een maatwerkvoorschrift op grond van regels als bedoeld in [artikel 4.3 van de wet][ref32]; of

      2°. een verkeersbesluit als bedoeld in [artikel 15 van de Wegenverkeerswet 1994][ref33], voor zover het gaat om de
      uitvoering van het projectbesluit;

      d. het bevoegd gezag, bedoeld in [artikel 19.2, eerste lid, van de wet][ref34]: bij een verplichting
      in verband met een ongewoon voorval opgelegd krachtens [artikel 19.3, tweede lid][ref35], of
      [19.4, eerste en tweede lid, van de wet][ref36];

      e. het bevoegd gezag, bedoeld in [afdeling 2.2 van het Besluit activiteiten leefomgeving][ref37]: bij een
      in [hoofdstuk 4][ref38] of [5 van dat besluit][ref39] gestelde verplichting tot monitoring als bedoeld in
      [artikel 20.1 van de wet][ref40] of gegevensverzameling als bedoeld in [artikel 20.6 van de wet][ref41], voor zover
      niet gericht tot een bestuursorgaan;

      f. het bestuursorgaan waaraan op grond van [afdeling 10.8][ref42] gegevens worden verstrekt: bij een in die
      afdeling gestelde verplichting tot gegevensverstrekking als bedoeld in [artikel 20.6 van de wet][ref43], voor zover
      niet gericht tot een bestuursorgaan; en

      g. het bestuursorgaan dat verantwoordelijk is voor de uitvoering van een experiment als bedoeld in
      [artikel 23.3, eerste lid, van de wet][ref44]: bij een aanwijzing tot het treffen van een maatregel als bedoeld in
      artikel 23.3, zesde lid, van de wet.


