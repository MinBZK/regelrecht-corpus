  - number: '13.3'
    text: |-
      1 Voor zover het gaat om de naleving van de voorschriften van een omgevingsvergunning voor een activiteit,
      berust in de volgende gevallen de bestuursrechtelijke handhavingstaak ook bij het bestuursorgaan dat op
      grond van [afdeling 4.2][ref1] heeft beslist over instemming met de voorgenomen beslissing op de aanvraag
      om een omgevingsvergunning voor die activiteit, of dat op grond van [artikel 4.37][ref2] van dit besluit of
      [artikel 16.16, vierde lid, van de wet][ref3] heeft bepaald dat instemming niet is vereist:

      a. het dagelijks bestuur van het waterschap: bij een omgevingsvergunning die betrekking heeft op een activiteit als
      bedoeld in [artikel 4.24, eerste lid, onder a, b of c][ref4];

      b. gedeputeerde staten:

      1°. bij een omgevingsvergunning die betrekking heeft op een activiteit als bedoeld in
      [artikel 4.25, eerste lid, onder a, b, d, e of f][ref5], voor zover bij dat laatste onderdeel de activiteit
      betrekking heeft op een watersysteem dat of een weg die in beheer is bij de provincie; en

      2°. bij een omgevingsvergunning als bedoeld in [artikel 4.25, tweede lid][ref6], voor zover die betrekking heeft op
      een ontgrondingsactiviteit in het winterbed van een tot de rijkswateren behorende rivier of buiten de rijkswateren
      waarbij 100.000 m3 of meer in situ wordt ontgraven;

      c. het dagelijks bestuur van een openbaar lichaam als bedoeld in
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref7]: bij een omgevingsvergunning die betrekking heeft op
      een activiteit als bedoeld in [artikel 4.26, eerste lid][ref8];

      d. Onze Minister van Economische Zaken en Klimaat:

      1°. bij een omgevingsvergunning die betrekking heeft op een activiteit als bedoeld in
      [artikel 4.29, eerste lid][ref9]; en

      2°. bij een omgevingsvergunning als bedoeld in [artikel 4.29, tweede lid][ref10];

      e. Onze Minister van Infrastructuur en Waterstaat:

      1°. bij een omgevingsvergunning die betrekking heeft op een activiteit als bedoeld in
      [artikel 4.30, eerste lid, onder a, b, c][ref11], voor zover het bij die onderdelen gaat om een
      beperkingengebiedactiviteit met betrekking tot een weg in beheer bij het Rijk of een hoofdspoorweg, of d; en

      2°. bij een omgevingsvergunning als bedoeld in [artikel 4.30, tweede lid][ref12], voor zover die betrekking heeft
      op een ontgrondingsactiviteit in een rijkswater, anders dan in het winterbed van een rivier, waarbij 100.000 m3 of
      meer in situ wordt ontgraven;

      f. Onze Minister van Landbouw, Natuur en Voedselkwaliteit: bij een omgevingsvergunning die betrekking heeft op een
      activiteit als bedoeld in [artikel 4.30a, eerste lid][ref13];

      g. Onze Minister voor Natuur en Stikstof: bij een omgevingsvergunning die betrekking heeft op een activiteit als
      bedoeld in [artikel 4.31, eerste lid][ref14]; en

      h. Onze Minister van Onderwijs, Cultuur en Wetenschap: bij een omgevingsvergunning die betrekking heeft op een
      activiteit als bedoeld in [artikel 4.32, eerste lid, onder a][ref15].

      2 Het eerste lid is niet van toepassing als gedeputeerde staten op grond van [artikel 4.16][ref16] bevoegd gezag
      zijn, tenzij het gaat om een geval als bedoeld in het eerste lid, aanhef en onder d, onder 1°.

      3 Als in een projectbesluit uitdrukkelijk is bepaald dat het besluit geldt als een omgevingsvergunning
      als bedoeld in [artikel 5.52, tweede lid, onder a, van de wet][ref17] en daarbij op grond van
      [artikel 16.20, eerste lid, van de wet][ref18] geen instemming is vereist, berust de bestuursrechtelijke
      handhavingstaak voor de betrokken activiteit, voor zover het gaat om de naleving van de voorschriften van de
      omgevingsvergunning voor die activiteit, in de in het eerste lid, onder a, b en h, bedoelde gevallen ook bij het
      dagelijks bestuur van het waterschap, gedeputeerde staten, respectievelijk Onze Minister van Onderwijs, Cultuur
      en Wetenschap.


