  - number: '13.23'
    text: |-
      1 Binnen vier maanden na afronding van een bezoek, controle of onderzoek als bedoeld in
      [artikel 13.22, tweede lid][ref1], worden de bevindingen vastgelegd in een toezichtrapport en meegedeeld aan degene
      die de Seveso-inrichting exploiteert.

      2 Het bevoegd gezag, de toezichthouder, bedoeld in
      [artikel 1, derde lid, onder d, van de Arbeidsomstandighedenwet][ref2], en het bestuur van de veiligheidsregio zien
      er, voor zover het gaat om de uitoefening van hun bevoegdheden en het verrichten van hun werkzaamheden, op toe dat
      degene die de Seveso-inrichting exploiteert binnen een redelijke termijn na de mededeling, bedoeld in het eerste
      lid, de bevindingen opvolgt door de vereiste maatregelen te treffen.

      3 Als een belangrijke overtreding van een bepaling in
      [paragraaf 4.2 van het Besluit activiteiten leefomgeving][ref3] is geconstateerd, vindt binnen zes maanden na die
      constatering aanvullend toezicht plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel13.22
