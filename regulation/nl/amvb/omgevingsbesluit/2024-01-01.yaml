  - number: '13.12'
    text: |-
      1 Het college van burgemeester en wethouders en gedeputeerde staten dragen er zorg voor dat in ieder geval de
      volgende werkzaamheden, voor zover tot hun taak behorend, en voor zover deze regels zijn gesteld met het oog
      op de belangen, bedoeld in [artikel 2.2][ref1] of [19.1b van het Besluit activiteiten leefomgeving][ref2], als
      het gaat om milieubelastende activiteiten, of [artikel 3.2][ref3], [4.2][ref4], [5.2][ref5], [6.2][ref6] of
      [7.2 van het Besluit bouwwerken leefomgeving][ref7], als het gaat om bouwactiviteiten of sloopactiviteiten, door
      een omgevingsdienst worden verricht:

      a. het voorbereiden van beslissingen op aanvragen om omgevingsvergunningen en het voorbereiden van het toepassen
      van [paragraaf 5.1.5 van de wet][ref8], voor activiteiten die zijn aangewezen in [bijlage VI][ref9], categorie 1
      tot en met 4, met uitzondering van omgevingsvergunningen voor buitenplanse omgevingsplanactiviteiten;

      b. het beoordelen van meldingen als bedoeld in [artikel 4.4, eerste lid, van de wet][ref10], en het voorbereiden
      van beschikkingen op aanvragen om toestemming tot het treffen van een gelijkwaardige maatregel, voor activiteiten
      die zijn aangewezen in [bijlage VI][ref11], categorie 1 en 5;

      c. het voorbereiden van beschikkingen tot het stellen van maatwerkvoorschriften, voor activiteiten die zijn
      aangewezen in [bijlage VI][ref12], categorie 1 en 5;

      d. het houden van toezicht op de naleving van:

      1°. de verboden, bedoeld in de [artikelen 5.1][ref13], [5.4][ref14], [5.5][ref15] en [5.6 van de wet][ref16], voor
      activiteiten die zijn aangewezen in [bijlage VI][ref17], categorie 1 tot en met 4; en

      2°. de regels gesteld bij of krachtens de [wet][ref18] en de [Wet milieubeheer][ref19], over activiteiten die zijn
      aangewezen in [bijlage VI][ref20], categorie 1 tot en met 6 en 8;

      e. ketentoezicht op de regels over activiteiten die zijn aangewezen in [bijlage VI][ref21], categorie 7; en

      f. het voorbereiden van bestuurlijke sancties ter handhaving van de verboden en regels, bedoeld onder d en e.

      2 Tot de werkzaamheden, bedoeld in het eerste lid, onder a, behoort niet de toepassing van de
      [Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref22].

      3 De werkzaamheden, bedoeld in het eerste lid, worden voor de activiteiten, bedoeld in
      [artikel 18.22, tweede lid, van de wet][ref23], alleen door de in [bijlage VII][ref24] aangewezen omgevingsdiensten
      uitgevoerd.

      4 Een naamswijziging van een in [bijlage VII][ref25] aangewezen omgevingsdienst gaat voor de toepassing van dit
      besluit gelden nadat een daarover genomen besluit bekend is gemaakt in de Staatscourant.


