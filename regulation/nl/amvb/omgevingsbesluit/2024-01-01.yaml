        artikel: '13.20'
  - number: '8.20'
    text: |-
      De activiteiten waarover in een overeenkomst bepalingen over financiële bijdragen kunnen worden opgenomen, bedoeld
      in [artikel 13.22, eerste lid, van de wet][ref1], zijn:

      a. de activiteiten, bedoeld in [artikel 8.13][ref2];

      b. de bouw van een bouwwerk geen gebouw zijnde als bedoeld in
      [bijlage I bij het Besluit bouwwerken leefomgeving][ref3] voor:

      1°. land- of tuinbouw, voor zover de oppervlakte ten minste 100 m2 bedraagt;

      2°. opwekking of winning, omzetting of transport van energie of van gasvormige, vloeibare of vaste stoffen als
      energiedrager;

      3°. infrastructuur, voor zover het gaat om wegen, vaarwegen, spoorwegen of telecommunicatie-infrastructuur;

      4°. handelsreclame; of

      5°. recreatie; en

      c. andere activiteiten met het oog op het gebruik op grond van een nieuw toegedeelde functie, voor zover het gaat
      om het gebruik van:

      1°. een of meer bestaande gebouwen, niet zijnde recreatiewoningen, mits de bruto-vloeroppervlakte van het nieuw
      toegelaten gebruik ten minste 1.500 m2 bedraagt;

      2°. gronden, mits de grondoppervlakte van het nieuw toegelaten gebruik ten minste 1.000 m2 bedraagt; of

      3°. een of meer bestaande recreatiewoningen voor permanente bewoning.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel13.22
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel8.13
      [ref3]: https://wetten.overheid.nl/BWBR0041297
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel8.20
