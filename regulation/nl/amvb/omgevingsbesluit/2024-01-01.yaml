      1 De raming van de waardevermeerdering, bedoeld in [artikel 13.17 van de wet][ref1], wordt vastgesteld door de
      geraamde opbrengst van de locatie waar de activiteit wordt verricht te verminderen met de geraamde inbrengwaarde
      van die locatie.

      2 Op de ramingen van de opbrengst en de inbrengwaarde zijn de [artikelen 8.16][ref2] en [8.17][ref3] van
      overeenkomstige toepassing.


