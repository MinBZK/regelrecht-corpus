  - number: '4.21'
    text: |-
      1 De gemeenteraad is adviseur voor een aanvraag om een omgevingsvergunning voor zover de aanvraag betrekking heeft
      op een door hem aangewezen geval van een buitenplanse omgevingsplanactiviteit waarvoor het college van burgemeester
      en wethouders bevoegd gezag is.

      2 Als het college van burgemeester en wethouders geen bevoegd gezag is voor de aanvraag om een omgevingsvergunning
      voor een aangewezen geval als bedoeld in het eerste lid, maar de voorgenomen beslissing op de aanvraag instemming
      van het college behoeft, is de gemeenteraad adviseur voor het verzoek om instemming.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel4.21
  - number: '4.22'
    text: |-
      1 De commissie, bedoeld in [artikel 17.9 van de wet][ref1], is adviseur voor een aanvraag om een
      omgevingsvergunning waarvoor het college van burgemeester en wethouders bevoegd gezag is voor zover de aanvraag
      betrekking heeft op:

      a. een rijksmonumentenactiviteit met betrekking tot een monument; of

      b. een andere activiteit, als het gaat om een door de gemeenteraad aangewezen geval of als het college van
      burgemeester en wethouders daartoe aanleiding ziet.

      2 Als het college van burgemeester en wethouders geen bevoegd gezag is voor de aanvraag om een omgevingsvergunning
      voor een activiteit als bedoeld in het eerste lid, maar adviseur, is de commissie ook adviseur en richt het advies
      van de commissie zich tot het college in plaats van tot het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel17.9
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '17.9'
  - number: '4.23'
    text: |-
      In afwijking van [artikel 4.20, tweede lid, aanhef en onder a][ref1], behoeft de voorgenomen beslissing op
      de aanvraag om een omgevingsvergunning voor een omgevingsplanactiviteit geen instemming van het college van
      burgemeester en wethouders als:

      a. het gaat om een aanvraag waarvoor gedeputeerde staten op grond van [artikel 4.16, eerste lid][ref2], bevoegd
      gezag zijn; en

      b. de omgevingsplanactiviteit verband houdt met een voorschrift dat is of zal worden verbonden aan een
      omgevingsvergunning voor een milieubelastende activiteit als bedoeld in [artikel 4.16, eerste lid, onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel4.20
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel4.16
      [ref3]: https://wetten.overheid.nl/BWBR0041278#Artikel4.16
