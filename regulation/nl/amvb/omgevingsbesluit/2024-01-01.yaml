  - number: 10.36aa
    text: |-
      Gedeputeerde staten verstrekken aan Onze Minister van Infrastructuur en Waterstaat de gegevens waarover zij
      beschikken die nodig zijn om te voldoen aan artikel 11, eerste lid, van de verordening hergebruik stedelijk
      afvalwater.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.36aa
  - number: 10.36a
    text: |-
      1 Gedeputeerde staten verstrekken aan Onze Minister voor Natuur en Stikstof gegevens over:

      a. door gedeputeerde staten of provinciale staten genomen besluiten of getroffen maatregelen ter uitvoering van de
      vogelrichtlijn en van de habitatrichtlijn; en

      b. de staat van instandhouding van:

      1°. de vogelsoorten, genoemd in bijlage I bij de vogelrichtlijn, en de niet in die bijlage genoemde geregeld in
      Nederland voorkomende vogelsoorten; en

      2°. de natuurlijke habitats, de habitats van soorten en de dier- en plantensoorten, genoemd in de bijlagen I, II,
      IV en V bij de habitatrichtlijn.

      2 De gegevens worden verstrekt ten behoeve van:

      a. de toepassing van artikel 4, eerste lid, van de vogelrichtlijn en artikel 4, eerste lid, in samenhang met
      artikel 11 van de habitatrichtlijn;

      b. de verslaglegging, bedoeld in artikel 9, derde lid, van de vogelrichtlijn en artikel 16, tweede lid, van de
      habitatrichtlijn; en

      c. de verslaglegging, bedoeld in artikel 12 van de vogelrichtlijn en artikel 17 van de habitatrichtlijn.

      3 Onze Minister voor Natuur en Stikstof verstrekt de gegevens, bedoeld in het eerste lid, en de gegevens, bedoeld
      in de artikelen 7, vierde lid, laatste zin, en 10, tweede lid, van de vogelrichtlijn, aan de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.36a
  - number: 10.36b
    text: |-
      1 Het bevoegd gezag voor een omgevingsvergunning voor een Natura 2000-activiteit of voor de
      vaststelling van een plan als bedoeld in artikel 6, derde lid, van de habitatrichtlijn meldt gegevens
      over de compenserende maatregelen, bedoeld in [artikel 8.74b, tweede lid, onder c][ref1], of
      [10.24, tweede lid, van het Besluit kwaliteit leefomgeving][ref2], aan Onze Minister voor Natuur en Stikstof.

      2 Onze Minister voor Natuur en Stikstof verstrekt de gegevens aan de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel8.74b
      [ref2]: https://wetten.overheid.nl/BWBR0041313#Artikel10.24
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.36b
