  - number: 10.6b
    text: |-
      Onze Minister voor Natuur en Stikstof draagt zorg voor bekendmaking in de Staatscourant van:

      a. een kwantificering van instandhoudingsdoelstellingen als bedoeld in
      [artikel 2.19, vierde lid, onder a, onder 2°, van de wet][ref1]; en

      b. rode lijsten met bedreigde of speciaal gevaar lopende dier- en plantensoorten als bedoeld in
      [artikel 2.19, vierde lid, onder a, onder 3°, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2.19
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel10.6b
