  - number: '8.6'
    text: |-
      1 De gevallen, bedoeld in [artikel 13.5, eerste lid, van de wet][ref1], waarvoor aan een omgevingsvergunning het
      voorschrift wordt verbonden dat degene die de activiteit verricht financiële zekerheid stelt, zijn:

      a. het storten van afvalstoffen op een stortplaats, bedoeld in
      [artikel 3.84, eerste lid, onder a of b, van het Besluit activiteiten leefomgeving][ref2], met uitzondering
      van een stortplaats waar alleen baggerspecie wordt gestort, voor zover het gaat om het nakomen van
      voorschriften die aan een omgevingsvergunning zijn verbonden over de bovenafdichting als bedoeld in
      [artikel 8.48, vierde lid, van het Besluit kwaliteit leefomgeving][ref3];

      b. het storten van baggerspecie op een stortplaats waar alleen baggerspecie wordt gestort, bedoeld in
      [artikel 3.84, eerste lid, onder a of b, van het Besluit activiteiten leefomgeving][ref4], voor zover het gaat
      om het nakomen van de voorschriften die aan een omgevingsvergunning zijn verbonden over het zo nodig aanbrengen
      van een geohydrologisch isolatiesysteem of een afdeklaag op de gestorte baggerspecie na het beëindigen van de
      stortwerkzaamheden;

      c. het storten of verzamelen van winningsafvalstoffen in een winningsafvalvoorziening, bedoeld in
      [artikel 3.84, eerste lid, onder c, van het Besluit activiteiten leefomgeving][ref5], voor zover het gaat om:

      1°. het nakomen van de voorschriften die op grond van
      [paragraaf 8.5.2.6 van het Besluit kwaliteit leefomgeving][ref6] aan de omgevingsvergunning zijn verbonden; en

      2°. het nakomen van regels als bedoeld in [paragraaf 8.2 van de Wet milieubeheer][ref7];

      d. het opslaan, herverpakken of bewerken van vuurwerk of pyrotechnische artikelen voor theaterverbruik, bedoeld in
      [artikel 3.31, eerste lid, onder c en d, van het Besluit activiteiten leefomgeving][ref8];

      e. het exploiteren van een Seveso-inrichting, bedoeld in
      [artikel 3.50 van het Besluit activiteiten leefomgeving][ref9]; en

      f. het exploiteren van een ippc-installatie, bedoeld in
      [artikel 3.72 van het Besluit activiteiten leefomgeving][ref10].

      2 Als het exploiteren van een Seveso-inrichting ook omvat het aanleggen en het exploiteren van een mijnbouwwerk,
      bedoeld in [artikel 3.320 van het Besluit activiteiten leefomgeving][ref11], voor zover het daarbij gaat om een
      mijnbouwwerk voor het opslaan van stoffen, is het eerste lid, aanhef en onder e, niet van toepassing op schade uit
      nadelige gevolgen voor de fysieke leefomgeving als gevolg van dat exploiteren waarvoor financiële zekerheid kan
      worden gesteld op grond van de [artikelen 46][ref12], [47][ref13] en [48 van de Mijnbouwwet][ref14].


