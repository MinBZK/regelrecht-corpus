  - number: '8.22'
    text: |-
      1 Als op grond van [artikel 13.23, eerste lid, van de wet][ref1] in een omgevingsplan wordt bepaald dat voor
      ontwikkelingen ter verbetering van de kwaliteit van de fysieke leefomgeving een financiële bijdrage wordt
      verhaald, worden in het omgevingsplan ook regels gesteld over de eindafrekening van de financiële bijdragen die met
      toepassing van [artikel 13.24 van de wet][ref2] worden verhaald. Daarbij wordt in ieder geval bepaald binnen welke
      termijn de eindafrekening plaatsvindt.

      2 Als bij de eindafrekening blijkt dat de voor de ontwikkeling benodigde financiële bijdrage lager is dan de op
      grond van de beschikking, bedoeld in [artikel 13.24 van de wet][ref3], betaalde geldsom, betaalt het college van
      burgemeester en wethouders het verschil terug met rente.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel13.23
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel13.24
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel13.24
