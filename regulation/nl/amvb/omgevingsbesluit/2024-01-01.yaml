  - number: 10.42c
    text: |-
      1 Het college van burgemeester en wethouders doet aan de gemeenteraad en het dagelijks bestuur van een waterschap
      doet aan het algemeen bestuur van het waterschap:

      a. uiterlijk op het bij koninklijk besluit te bepalen tijdstip, bedoeld in
      [artikel 11.46, derde lid, van het Besluit kwaliteit leefomgeving][ref1], verslag van de waarde van de
      basisgeluidemissie, bedoeld in dat artikel; en

      b. uiterlijk op 18 juli 2029 en vervolgens elke vijf jaar uiterlijk op 18 juli verslag van de resultaten van de
      monitoring, bedoeld in [artikel 11.47 van het Besluit kwaliteit leefomgeving][ref2].

      2 Het verslag, bedoeld in het eerste lid, onder b, bevat ten minste:

      a. de afweging van geluidbeperkende en geluidwerende maatregelen voor gebouwen als bedoeld in
      [artikel 3.28 van het Besluit kwaliteit leefomgeving][ref3];

      b. een overzicht van de geluidgevoelige gebouwen waarvoor op grond van
      [artikel 3.52, eerste lid, onder a of b, van het Besluit kwaliteit leefomgeving][ref4] een besluit over het
      treffen van geluidwerende maatregelen wordt genomen; en

      c. de wijzigingen van de basisgeluidemissie ten opzichte van het vorige verslag.

      3 Het verslag van de monitoring wordt voor een ieder elektronisch beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel11.46
