  - number: '13.22'
    text: |-
      1 Het houden van toezicht wordt afgestemd op het soort Seveso-inrichting en is niet afhankelijk van de ontvangst
      van het veiligheidsrapport of van andere ingediende rapporten.

      2 Met bezoeken ter plaatse, het controleren van interne maatregelen, systemen, rapporten, documenten en opvolging
      van bevindingen en een planmatig, systematisch, technisch, organisatorisch en bedrijfskundig onderzoek van de
      systemen die in de Seveso-inrichting worden gebruikt, wordt nagegaan of:

      a. degene die de Seveso-inrichting exploiteert kan aantonen dat:

      1°. passende maatregelen zijn getroffen om zware ongevallen te voorkomen; en

      2°. in passende middelen is voorzien om de gevolgen van zware ongevallen te beperken;

      b. het veiligheidsrapport en andere ingediende rapporten de situatie adequaat weergeven; en

      c. de [artikelen 4.5][ref1], [4.6][ref2], [4.10 tot en met 4.20][ref3], [4.22][ref4], [4.24][ref5] en
      [4.26 tot en met 4.28 van het Besluit activiteiten leefomgeving][ref6] worden nageleefd.

      3 Als dat passend is, wordt het toezicht zoveel mogelijk gecombineerd met toezicht op andere wettelijke
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel4.5
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Artikel4.6
