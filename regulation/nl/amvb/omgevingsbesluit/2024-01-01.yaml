  - number: '13.13'
    text: |-
      Aan de verplichting tot informatieverstrekking, bedoeld in [artikel 18.25, eerste lid, van de wet][ref1], is in
      ieder geval voldaan als Onze Minister van Infrastructuur en Waterstaat, Onze Minister van Justitie en Veiligheid
      en het algemeen bestuur van de omgevingsdiensten de gegevens die zij beheren in verband met het verrichten van de
      werkzaamheden, bedoeld in [artikel 13.12, eerste lid][ref2], via het beveiligde digitale systeem voor informatie-
      uitwisseling, Inspectieview Milieu, raadpleegbaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18.25
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel13.12
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel13.13
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18.25'
      - id: ref2
        bwb_id: BWBR0041278
        artikel: '13.12'
        hoofdstuk: '13'
        paragraaf: 13.2.3
        afdeling: '13.2'
  - number: '13.14'
    text: |-
      Als andere bestuursorganen als bedoeld in [artikel 18.25, tweede lid, van de wet][ref1] worden aangewezen:

      a. Onze Minister van Economische Zaken en Klimaat;

      b. Onze Minister van Sociale Zaken en Werkgelegenheid;

      c. de korpschef; en

      d. het openbaar ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18.25
    url: https://wetten.overheid.nl/BWBR0041278/2024-01-01#Artikel13.14
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18.25'
  - number: '13.15'
    text: |-
      Ten behoeve van de strafrechtelijke handhaving van het bepaalde bij of krachtens de [wet][ref1] wordt door de
      bestuursorganen, bedoeld in de [artikelen 13.13][ref2] en [13.14][ref3], bij het verstrekken van persoonsgegevens
      het burgerservicenummer aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel13.13
      [ref3]: https://wetten.overheid.nl/BWBR0041278#Artikel13.14
