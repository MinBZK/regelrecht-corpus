      1 Bij een verzoek om ontheffing als bedoeld in [artikel 16.44, tweede lid, van de wet][ref1] verstrekt degene die
      voornemens is het project uit te voeren in ieder geval de volgende gegevens:

      a. een beschrijving van het voorgenomen project;

      b. een beschrijving van de omstandigheden waaronder het project zal worden uitgevoerd;

      c. de redenen voor het verzoek; en

      d. een aanduiding van de mogelijk aanzienlijke milieueffecten.

      2 Onze Minister van Infrastructuur en Waterstaat geeft op de in [artikel 12 van de Bekendmakingswet][ref2] bepaalde
      wijze kennis van:

      a. de ontheffing, bedoeld in [artikel 16.44, tweede lid, van de wet][ref3]; en

      b. indien van toepassing, de gegevens die zijn verzameld bij een andere vorm van beoordeling van de milieueffecten,
      bedoeld in [artikel 16.44, derde lid, van de wet][ref4].


