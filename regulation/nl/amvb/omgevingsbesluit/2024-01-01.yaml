      behoort.

      4 In afwijking van [artikel 10.44, eerste lid][ref5], worden gegevens waarvoor een verzoek als bedoeld in
      [artikel 11.60, eerste lid, van het Besluit kwaliteit leefomgeving][ref6] is afgewezen, niet eerder verstrekt dan
      nadat dat besluit in werking is getreden.


