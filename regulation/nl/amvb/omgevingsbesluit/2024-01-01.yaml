        artikel: '13.12'
        hoofdstuk: '13'
        paragraaf: 13.2.3
        afdeling: '13.2'
      - id: ref2
        bwb_id: BWBR0037885
  - number: '13.6'
    text: |-
      1 De uitvoerings- en handhavingsstrategie biedt in ieder geval inzicht in:

      a. de prioriteitenstelling voor het verrichten van de werkzaamheden, bedoeld in [artikel 13.5, eerste lid][ref1];

      b. de methode die wordt gebruikt om te bepalen of de doelen, bedoeld in [artikel 13.5, eerste lid][ref2], worden
      bereikt;

      c. de criteria die worden gebruikt bij het beoordelen van en beslissen op aanvragen om omgevingsvergunningen en het
      beoordelen van meldingen als bedoeld in [artikel 4.4, eerste lid, van de wet][ref3]; en

      d. de werkwijze bij het verlenen van omgevingsvergunningen en het beoordelen van meldingen als bedoeld in
      [artikel 4.4, eerste lid, van de wet][ref4].

      2 De handhavingsstrategie biedt ook inzicht in:

      a. de afspraken die door bestuursorganen onderling en met de instanties die zijn belast met de strafrechtelijke
      handhaving zijn gemaakt over samenwerking bij en afstemming van werkzaamheden;

      b. de wijze waarop toezicht op de naleving van het bepaalde bij of krachtens de [wet][ref5] wordt gehouden;

      c. de wijze waarop wordt gerapporteerd over bevindingen over de naleving van het bepaalde bij of krachtens de
      [wet][ref6] en eventueel daaraan verbonden consequenties;

      d. de wijze waarop bestuurlijke sancties en termijnen die bij het opleggen en ten uitvoer leggen daarvan worden
      gehanteerd en de strafrechtelijke handhaving onderling worden afgestemd; en

      e. de wijze waarop wordt gehandeld na geconstateerde overtredingen die zijn begaan door of in naam van een
      bestuursorgaan of een andere tot de overheid behorende instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Artikel13.5
      [ref2]: https://wetten.overheid.nl/BWBR0041278#Artikel13.5
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel4.4
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel4.4
      [ref5]: https://wetten.overheid.nl/BWBR0037885
      [ref6]: https://wetten.overheid.nl/BWBR0037885
