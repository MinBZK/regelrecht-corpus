      - id: ref3
        bwb_id: BWBR0020315
  - number: '4'
    text: |-
      1 Voor het functiewaarderingssysteem, bedoeld in [artikel 3][ref1], gelden als uitgangspunten de op 31 juli 2006
      geldende functiestructuur en beloningsverhoudingen in de sector primair onderwijs.

      2 Voor de uitkomsten van het functiewaarderingssysteem geldt dat aan een functie ten hoogste een salarisschaal
      is verbonden waarvan het hoogste bedrag overeenkomt met het maximum van schaal DE als opgenomen in
      [bijlage 1, categorie 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020315
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel4
