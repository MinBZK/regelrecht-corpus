  - number: '5'
    text: |-
      1 De betrokkene wordt benoemd in een van de functies die beschikbaar is ingevolge de door het bevoegd gezag
      vastgestelde formatie.

      2 Het bevoegd gezag stelt regels vast met betrekking tot de wijze waarop het salaris van de betrokkene bij zijn
      indiensttreding wordt bepaald.

      3 Het salaris van de betrokkene die is benoemd in een betrekking met een omvang anders dan die van een
      normbetrekking, wordt naar evenredigheid van die betrekkingsomvang berekend. De aldus berekende uitkomst wordt op
      rekenkundige wijze afgerond op centen.

      4 In afwijking van het eerste lid kan een betrokkene in het in dat lid bedoelde geval worden benoemd in twee
      onderwijsondersteunende functies of een onderwijsondersteunende en een onderwijsgevende functie, indien er een
      verschil van meer dan 3 schalen is tussen de bij die functies behorende maximumschalen.

      5 In afwijking van het eerste en vierde lid kan een betrokkene met een arbeidsongeschiktheidspercentage van
      minder dan 35% worden benoemd in twee onderwijsondersteunende functies of een onderwijsondersteunende en een
      onderwijsgevende functie waarvan het verschil tussen de bij die functies behorende maximumschalen 3 of minder
      schalen is.
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel5
  - number: '6'
    text: |-
      Het salaris van een betrokkene die de leeftijd van 19 jaar nog niet heeft bereikt, kan worden vastgesteld op het
      bedrag dat in de voor hem geldende schaal is opgenomen bij het salarisnummer bestaande uit de letter J en het getal
      dat overeenkomt met zijn leeftijd in jaren, voor zover de schaal in [bijlage 1, categorie 4][ref1], dit aangeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020315
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020315
  - number: '7'
    text: |-
      1 Indien het salaris minder is dan het maandbedrag van het minimumloon, vermeld in [bijlage 2, onderdeel 1][ref1],
      wordt hem een toelage toegekend ten bedrage van het verschil.

      2 Voor de betrokkene die is benoemd in een betrekking met een omvang anders dan die van een normbetrekking, wordt
      het maandbedrag van het minimumloon geacht te zijn vastgesteld op een evenredig deel van het in het eerste lid
      bedoelde maandbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020315
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020315
  - number: '8'
    text: |-
      De salarisbedragen en toelagen, genoemd in de bijlagen bij dit besluit, kunnen worden gewijzigd bij ministeriële
      regeling.
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel8
  - number: '9'
    text: |-
      1 De betrokkene heeft aanspraak op een vakantie-uitkering voor de tijd gedurende welke hij salaris heeft ontvangen.

      2 Onverminderd het derde lid, bedraagt de vakantie-uitkering per kalendermaand 8% van het bedrag dat de betrokkene
      in die maand aan salaris heeft ontvangen.

      3 Voor de betrokkene die in de van toepassing zijnde maand op grond van het eerste lid aanspraak heeft op
      een bedrag dat lager is dan het bedrag genoemd in [bijlage 2, onderdeel 2][ref1], wordt de vakantie-uitkering
      vastgesteld op laatstbedoeld bedrag, met dien verstande dat dit bedrag naar evenredigheid wordt verminderd voor de
      betrokkene die is aangesteld in een betrekking met een omvang van minder dan een normbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0020315
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020315
  - number: '10'
    text: |-
      1 Aan de betrokkene die gedurende een kalenderjaar is benoemd of benoemd is geweest in een functie, wordt met
      inachtneming van het tweede tot en met het vijfde lid een eindejaarsuitkering toegekend.

      2 Bij ministeriële regeling worden de hoogte en de berekeningswijze van de in het eerste lid bedoelde uitkering
      vastgesteld.

      3 De eindejaarsuitkering wordt eenmaal per jaar uitbetaald in de maand december over de periode van twaalf maanden
      die eindigt met de maand december.

      4 In afwijking van het derde lid vindt bij ontslag van de betrokkene de uitbetaling plaats over het tijdvak januari
      tot de datum van ontslag in het desbetreffende kalenderjaar.

      5 De uitkering maakt deel uit van het inkomen, bedoeld in het pensioenreglement, voor zover dat door Onze Minister
      bij ministeriële regeling, bedoeld in het tweede lid, wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel10
  - number: '11'
    text: |-
      1 Bij ministeriële regeling kan een eenmalige uitkering worden toegekend.

      2 De vaststelling van de hoogte, de berekeningswijze, de benaming en de mate waarop deze uitkering doorwerkt naar
      het inkomen, zoals bedoeld in het pensioenreglement, vindt plaats bij ministeriële regeling, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel11
  - number: '12'
    text: |-
      1 De betrokkene ontvangt maandelijks een inkomenstoelage als aangegeven in [bijlage 2, onderdeel 4][ref1] bij dit
      besluit.

      2 Bij ministeriële regeling worden de berekeningswijze en de mate waarop deze uitkering doorwerkt naar het inkomen,
      bedoeld in het pensioenreglement, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020315
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020315
  - number: '13'
    text: |-
      1 Aan de betrokkene die in een kalenderjaar is benoemd of benoemd is geweest in één of meer functies met één
      der maximumschalen 1 tot en met 8 als opgenomen in [bijlage 1, categorie 4][ref1], wordt een eindejaarsuitkering
      toegekend.

      2 Bij ministeriële regeling worden de hoogte en de berekeningswijze van de in het eerste lid bedoelde uitkering
      vastgesteld.

      3 De uitkering maakt deel uit van het inkomen, bedoeld in het pensioenreglement, voor zover dat bij ministeriële
      regeling, bedoeld in het tweede lid, wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020315
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020315
  - number: 13a
    text: |-
      1 In dit artikel wordt onder «betrokkene» verstaan: degene die over het
      kalenderjaar 2005 een of meer tegemoetkomingen heeft ontvangen op grond van de
      [Regeling ziektekostenvoorziening onderwijs en onderzoekpersoneel][ref1], zoals die regeling luidde op
      31 december 2005, en die op die datum een pensioen of prepensioen ontvangt dan wel uitkeringsgenietende
      is van een uitkering via de [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref2],
      [Besluit bovenwettelijke werkloosheidsregeling voor onderwijspersoneel primair- en voortgezet onderwijs][ref3],
      [Wet op de arbeidsongeschiktheidsverzekering][ref4] of invaliditeitspensioen op basis van een beëindigde betrekking
      aan een school.

      2 Onze minister kan bepalen dat aan de betrokkene eenmalig een uitkering wordt toegekend.

      3 Bij ministeriële regeling stelt Onze minister de benaming, de hoogte en de wijze van uitbetaling van de uitkering
      vast.

      4 Bij ministeriële regeling worden categorieën van personen, wier bezoldiging, uitkering of pensioen direct of
      indirect komt ten laste van de algemene middelen van het Rijk, aangewezen als betrokkene in de zin van dit artikel.


