  - number: '2'
    text: |-
      1 De algemene arbeidsduur van de betrokkene die is benoemd in een normbetrekking bedraagt 1659 uur per jaar.

      2 Voor de toepassing van regelgeving waarbij een betrekkingsomvang per week vastgesteld moet worden, wordt bij een
      benoeming in normbetrekking uitgegaan van een gemiddelde weektaak op jaarbasis van 36,86 uur.
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel2
  - number: '3'
    text: |-
      1 Het bevoegd gezag stelt de formatie vast. De formatie omvat het geheel van functies in aantallen en niveaus voor
      het personeel.

      2 Het niveau van de functie wordt bepaald aan de hand van zwaarte van de functie, die door het bevoegd gezag wordt
      vastgesteld, volgens het door het bevoegd gezag te hanteren functiewaarderingssysteem.

      3 Het bevoegd gezag stelt ingevolge het tweede lid voor elke functie een salarisschaal vast waarbij het gebruik
      maakt van de in de [bijlage 1][ref1] bij dit besluit vermelde reeks van genummerde salarisbedragen, behorende bij
      een normbetrekking.

      4 Het bevoegd gezag stelt regels vast omtrent de wijze waarop de betrokkene het maximumsalaris van de bij zijn
      functie behorende schaal bereikt, waarbij het gebruik maakt van de in [bijlage 1][ref2] vermelde salarisbedragen en
      stelt regels vast met betrekking tot de in de [bijlage 2, onderdeel 3][ref3], vermelde bindingstoelage.


      [ref1]: https://wetten.overheid.nl/BWBR0020315
      [ref2]: https://wetten.overheid.nl/BWBR0020315
      [ref3]: https://wetten.overheid.nl/BWBR0020315
    url: https://wetten.overheid.nl/BWBR0020315/2007-02-23#Artikel3
    references:
