  - number: '1'
    text: |-
      Tenzij anders vermeld, wordt in dit besluit verstaan onder:

      a. school: een school als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1], een school als bedoeld
      in [artikel 1 van Wet op de expertisecentra][ref2];

      b. betrokkene: een lid van het door het bevoegd gezag benoemde of aangestelde personeel;

      c. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      d. bevoegd gezag: wat betreft:

      1°. een school: een bevoegd gezag als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref3] en
      [artikel 1 van de Wet op de expertisecentra][ref4];

      2°. een centrale dienst: het bestuur van de rechtspersoon, bedoeld in
      [artikel 68 van de Wet op het primair onderwijs][ref5] en [artikel 69 van de Wet op de expertisecentra][ref6];

      3°. een regionaal expertisecentrum: het bestuur van de rechtspersoon, bedoeld in
      [artikel 28b, vijfde lid, van de Wet op de expertisecentra][ref7];

      e. normbetrekking: de betrekking of de betrekkingen waarvan de omvang op jaarbasis gelijk is aan 1659 uren en
      waarbij de gemiddelde weektaak op jaarbasis gelijk is aan 36,86 uren, bedoeld in [artikel 2][ref8];

      f. functie: het samenstel van werkzaamheden door de betrokkene te verrichten krachtens en overeenkomstig hetgeen
      hem door het bevoegd gezag is opgedragen;

      g. pensioenreglement: het pensioenreglement van de Stichting Pensioenfonds ABP;

      h. salaris: het bedrag dat voor de betrokkene is vastgesteld aan de hand van de in [bijlage 1][ref9] bij dit
      besluit vermelde reeks van genummerde salarisbedragen.


