preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij a.i. van 5 augustus 1982, nr. J 4316, Directie
    Juridische en Bedrijfsorganisatorische Zaken;

    Gehoord de commissie beheer landbouwgronden;

    Overwegende dat het wenselijk is ter verlichting van de financieringsproblematiek in de landbouw in bepaalde
    gevallen uitgifte in erfpacht van landbouwgrond door het bureau beheer landbouwgronden aan ondernemers in de
    landbouw mogelijk te maken;

    Gelet op artikel 57, eerste lid, van de Wet agrarisch grondverkeer (Stb. 1981, 248);

    De Raad van State gehoord (advies van 29 september 1982, nr. 2420/17/8238);

    Gezien het nader rapport van de Staatssecretaris van Landbouw en Visserij van 30 november 1982, nr. J. 5486,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003548/2007-10-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      "pleegkind": degene, die duurzaam als een eigen kind is verzorgd en opgevoed;

      "bedrijfsoppervlakte": de naar kadastrale maat gemeten oppervlakte van de bij een bedrijf in gebruik zijnde
      percelen landbouwgrond voor zover deze onbebouwd zijn en niet het erf vormen en voor zover dit gebruik geschiedt op
      grond van een recht van eigendom, een zakelijk recht of een pachtovereenkomst voor tenminste de wettelijke duur.
    url: https://wetten.overheid.nl/BWBR0003548/2007-10-31#Artikel1
  - number: '2'
    text: |-
      Het bureau kan, voor zover zulks uit financieringsoverwegingen noodzakelijk is, onder door Onze Minister te stellen
      regelen op aanvrage in de navolgende gevallen overgaan tot uitgifte in erfpacht van landbouwgrond:

      a. opvolging in een bedrijf door één of meer kinderen, aangetrouwde, pleeg- of kleinkinderen, die voor eigen
      rekening, dan wel met één of meer andere natuurlijke personen voor gezamenlijke rekening, een bedrijf uitoefent,
      onderscheidenlijk uitoefenen;

      b. uitoefening door de pachter van het voorkeursrecht als bedoeld in
      [afdeling 11 van titel 5 van Boek 7 van het Burgerlijk Wetboek][ref1];

      c. vergroting van de bedrijfsoppervlakte.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling11
    url: https://wetten.overheid.nl/BWBR0003548/2007-10-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '11'
  - number: '3'
    text: |-
      1 Onze Minister kan bij in de *Nederlandse Staatscourant* bekend te maken regeling bepalen dat in een of meer
      gevallen als bedoeld in [artikel 2][ref1] geen aanvragen kunnen worden ingediend tot een nader door hem daarbij te
      bepalen tijdstip.

      2 Onze Minister kan in zijn op grond van het eerste lid genomen regeling bepalen dat wel aanvragen om uitgifte
      in erfpacht kunnen worden ingediend voor landbouwgrond die bestemd is voor de uitgifte en waarvan het bureau de
      eigendom heeft verworven vóór het tijdstip van de indiening van de aanvrage.


      [ref1]: https://wetten.overheid.nl/BWBR0003548#Artikel2
    url: https://wetten.overheid.nl/BWBR0003548/2007-10-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003548
        artikel: '2'
  - number: '4'
    text: |-
      De in de in [artikel 2][ref1] bedoelde regelen kunnen onder meer betrekking hebben op:

      a. de financieringsstructuur van het bedrijf van de aanvrager;

      b. de gebieden waarbinnen tot uitgifte kan worden overgegaan;

      c. de hoogte van het bedrag dat met de uitgifte gemoeid is;

      d. de oppervlakte van de in erfpacht uit te geven landbouwgrond;

      e. de leeftijd van de aanvrager;

      f. de verkavelingssituatie van het bedrijf van de aanvrager zowel vóór als na uitgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0003548#Artikel2
    url: https://wetten.overheid.nl/BWBR0003548/2007-10-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003548
        artikel: '2'
  - number: '5'
    text: |-
