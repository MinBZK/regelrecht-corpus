preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Infrastructuur en Milieu van 1 maart 2011, nr. BJZ2011036817,
    Hoofddirectie Bestuurlijke en Juridische Zaken;

    Gelet op verordening (EG) nr. 1005/2009 van het Europees Parlement en de Raad van de Europese Unie van 16 september
    2009 betreffende ozonlaag afbrekende stoffen (herschikking) (PbEU L 286) en de artikelen 37 van de Wet op de
    economische delicten en8.40, eerste lid, 8.42, eerste lid, en 9.2.2.1, eerste lid, van de Wet milieubeheer;

    De Afdeling advisering van de Raad van State gehoord (advies van 14 april 2011, nr. W14.11.0067/IV);

    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Milieu van 25 mei 2011, nr. BJZ2011045162,
    Hoofddirectie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0030095/2011-06-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *EG-verordening ozonlaagafbrekende stoffen:* verordening (EG) nr. 1005/2009 van het Europees Parlement en de Raad
      van de Europese Unie van 16 september 2009 betreffende ozonlaag afbrekende stoffen (herschikking) (PbEU L 286);
        - *gereguleerde stoffen:* stoffen als bedoeld in artikel 3, onderdeel 4, van de EG-verordening ozonlaagafbrekende
      stoffen.
    url: https://wetten.overheid.nl/BWBR0030095/2011-06-30#Artikel1
  - number: '2'
    text: |-
      Onze Minister is de bevoegde instantie van een lidstaat, bedoeld in de artikelen 10, tot en met 15, 17, 18, 23, 27
      en 28 van de EG-verordening ozonlaagafbrekende stoffen.
    url: https://wetten.overheid.nl/BWBR0030095/2011-06-30#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden te handelen in strijd met de artikelen 4, 5, eerste en tweede lid, in verbinding met het derde
      lid, en 6 van de EG-verordening ozonlaagafbrekende stoffen. Het verbod, bedoeld in de eerste volzin, is niet van
      toepassing in de gevallen en onder de voorwaarden, genoemd in de artikelen 7 tot en met 14 van de EG-verordening
      ozonlaagafbrekende stoffen.

      2 Het is verboden in strijd te handelen met artikel 15, eerste lid, van de EG-verordening ozonlaagafbrekende
      stoffen. Het verbod, bedoeld in de eerste volzin, is niet van toepassing in de gevallen en onder de voorwaarden,
      genoemd in artikel 15, tweede en derde lid, van de EG-verordening ozonlaagafbrekende stoffen.

      3 Het is verboden in strijd te handelen met de artikelen 16, 18, tweede tot en met vierde lid, 22, eerste, tweede
      en vierde lid, 23, eerste tot en met derde lid, vijfde en zesde lid, en 27, eerste tot en met zevende en negende
      lid, van de EG-verordening ozonlaagafbrekende stoffen.

      4 Het is verboden in strijd te handelen met artikel 17, eerste lid, van de EG-verordening ozonlaagafbrekende
      stoffen. Het verbod, bedoeld in de eerste volzin, is niet van toepassing in de gevallen en onder de voorwaarden,
      genoemd in artikel 17, tweede tot en met vierde lid, van de EG-verordening ozonlaagafbrekende stoffen.

      5 Het is verboden in strijd te handelen met artikel 20, eerste en vierde lid, van de EG-verordening
      ozonlaagafbrekende stoffen. Het verbod, bedoeld in de eerste volzin, is niet van toepassing in de gevallen en onder
      de voorwaarden, genoemd in artikel 20, tweede en derde lid, van de EG-verordening ozonlaagafbrekende stoffen.

      6 Het is verboden in strijd te handelen met artikel 24, eerste lid, van de EG-verordening ozonlaagafbrekende
      stoffen, tenzij vrijstelling als bedoeld in het tweede lid van dat artikel is verleend.

      7 Het is verboden in strijd te handelen met een voorschrift dat is verbonden aan een vergunning als bedoeld in de
      artikelen 10, zesde lid, 15, derde lid, en 17, vierde lid, van de EG-verordening ozonlaagafbrekende stoffen.

      8 Het is verboden in strijd te handelen met de toestemming verleend krachtens de artikelen 13, eerste lid, tweede
      volzin, en 14, tweede tot en met vierde lid, van de EG-verordening ozonlaagafbrekende stoffen of met de goedkeuring
      verleend krachtens artikel 12, eerste lid, tweede volzin, van die verordening.
    url: https://wetten.overheid.nl/BWBR0030095/2011-06-30#Artikel3
  - number: '4'
    text: |-
      1 Bij ministeriële regeling worden ter uitvoering van artikel 22, vijfde lid, eerste volzin, van de EG-verordening
      ozonlaagafbrekende stoffen nadere regels gesteld.

      2 Bij ministeriële regeling worden ter uitvoering van artikel 23, eerste lid, van de EG-verordening
      ozonlaagafbrekende stoffen nadere regels gesteld.

      3 Degene die een inrichting drijft, draagt er zorg voor dat de gegevens, bedoeld in artikel 23, derde lid, van de
      EG-verordening ozonlaagafbrekende stoffen, op verzoek ter beschikking worden gesteld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030095/2011-06-30#Artikel4
  - number: '5'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld inzake de examinering en diplomering van personen die
      werkzaamheden verrichten aan apparatuur als bedoeld in artikel 23, tweede lid, van de EG-verordening
      ozonlaagafbrekende stoffen.

      2 Bij ministeriële regeling worden regels gesteld inzake de certificering van bedrijven die werkzaamheden
      verrichten aan apparatuur als bedoeld in artikel 23, tweede lid, van de EG-verordening ozonlaagafbrekende stoffen.

      3 Bij ministeriële regeling worden regels gesteld inzake de aanwijzing van instellingen die met de examinering en
      diplomering van personen, bedoeld in het eerste lid, of met de certificering van bedrijven, bedoeld in het tweede
      lid, zijn belast.
    url: https://wetten.overheid.nl/BWBR0030095/2011-06-30#Artikel5
  - number: '6'
    text: |-
