  - number: '10'
    text: |-
      Na inwerkingtreding van dit besluit berust:

      a. de [Regeling gefluoreerde broeikasgassen en gereguleerde stoffen koelinstallaties][ref1] op
      [artikel 4 van het Besluit gefluoreerde broeikasgassen milieubeheer][ref2] en de artikelen 4 en 5 van het
      Uitvoeringsbesluit EG-verordening ozonlaagafbrekende stoffen;

      b. de [Regeling lekdichtheidsvoorschriften koelinstallaties op schepen][ref3] op
      [artikel 1 van het Besluit broeikasgassen op schepen milieubeheer][ref4] en artikel 4 van het Uitvoeringsbesluit
      EG-verordening ozonlaagafbrekende stoffen.


