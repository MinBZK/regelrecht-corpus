preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 2 juli 2007, nr.
    DJZ2007057947, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de Staatssecretaris van Verkeer en
    Waterstaat en de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op richtlijn nr. 89/106/EEG van de Raad van de Europese Gemeenschappen van 21 december 1988 betreffende
    de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen der lidstaten inzake de voor de
    bouw bestemde produkten (PbEG L 40), zoals gewijzigd bij richtlijn nr. 93/68/EEG van de Raad van de Europese
    Gemeenschappen van 22 juli 1993 (PbEG L 220);

    Gelet op richtlijn nr. 06/12/EEG van de Raad van de Europese Gemeenschappen van 5 april 2006 betreffende
    afvalstoffen (PbEG, L 114), ter vervanging van richtlijn nr. 75/442/EEG van de Raad van de Europese Gemeenschappen
    van 15 juli 1975 betreffende afvalstoffen (PbEG L 194), zoals deze laatstelijk is gewijzigd bij verordening nr.
    1882/2003 van het Europees Parlement en de Raad van de Europese Gemeenschap van 29 september 2003 (PbEU L 284);

    Gelet op de artikelen 1.1, zevende lid, 8.1, tweede lid, 8.5, 8.40, 8.45, 8.49, vijfde lid,10.2, tweede lid, 10.15,
    eerste lid, 10.17, eerste lid, 10.52, 11.1, 11.2 en 11.3 van de Wet milieubeheer, de artikelen 6, 7, 8, 12a, 12b,
    15, 16a, 17, 36, 38, 39b, 70, 71, 72, 76o en 91 van de Wet bodembescherming, de artikelen 1 derde lid, 2a, eerste
    en tweede lid, 2b en 2c van de Wet verontreiniging oppervlaktewateren, artikel 24 van de Wet milieugevaarlijke
    stoffen, artikel 12, tweede lid van de Wet belastingen op milieugrondslag en artikel 40a van de Woningwet;

    De Raad van State gehoord (advies van 10 september 2007, nr. W08.07.0189/IV);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 19
    november 2007, nr. DJZ2007113029, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens de
    Staatssecretaris van Verkeer en Waterstaat en de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt, tenzij anders bepaald, verstaan onder: - *accreditatie:*
      bewijs waarmee de Raad voor Accreditatie kenbaar maakt dat gedurende een bepaalde periode een gerechtvaardigd
      vertrouwen bestaat dat de hierin genoemde persoon of instelling competent is voor het uitvoeren van de
      desbetreffende werkzaamheid;
        - *afleverbon:* begeleidend document bij een partij van een bouwstof of een partij grond of baggerspecie dat bij
      de afgifte van een milieuverklaring bodemkwaliteit wordt verstrekt en dat tot doel heeft de partij te identificeren
      als partij waarop de verklaring betrekking heeft;
        - *baggerspecie:* materiaal dat is vrijgekomen uit de bodem of oever van een oppervlaktewaterlichaam en dat bestaat
      uit minerale delen met een maximale korrelgrootte van 2 millimeter en organische stof in een verhouding en met
      een structuur zoals deze in de bodem van nature worden aangetroffen, alsmede van nature in de bodem voorkomende
      schelpen en grind met een korrelgrootte van 2 tot 63 millimeter;
        - *bodem:* bodem als bedoeld in de [bijlage bij de Omgevingswet](onbekend);
        - *bodemfunctie:* bodemfunctie als bedoeld in [artikel 5.89p van het Besluit kwaliteit leefomgeving][ref1], zoals
      aangegeven in het omgevingsplan;
        - *bodemfunctieklasse:* bodemfunctieklasse als bedoeld in
      [artikel 5.89p van het Besluit kwaliteit leefomgeving][ref2] waarin de ontvangende landbodem in het omgevingsplan
      is ingedeeld;
        - *bodemkwaliteitskaart:* kaart als bedoeld in [artikel 25c, derde lid][ref3];
        - *bouwstof:* materiaal dat is bestemd om te worden toegepast, waarin de totaalgehalten aan silicium, calcium en
      aluminium tezamen meer dan 10 gewichtsprocent van dat materiaal bedragen, met uitzondering van vlakglas, metallisch
      aluminium, grond of baggerspecie;
        - *certificaat:* verklaring waarmee een door Onze Minister erkende certificeringsinstelling kenbaar maakt dat
      gedurende een bepaalde periode een gerechtvaardigd vertrouwen bestaat dat de hierin genoemde persoon voldoet aan
      het voor de certificering geldende normdocument;
        - *erkenning bodemkwaliteit:* op grond van [artikel 9, eerste lid][ref4], gegeven beschikking waarbij wordt
      vastgesteld dat een persoon of een instelling voor een werkzaamheid voldoet aan de bij of krachtens dit besluit
      geldende voorwaarden;
        - *grond:* vast materiaal dat bestaat uit minerale delen met een maximale korrelgrootte van 2 millimeter en
      organische stof in een verhouding en met een structuur zoals deze in de bodem van nature worden aangetroffen,
      alsmede van nature in de bodem voorkomende schelpen en grind met een korrelgrootte van 2 tot 63 millimeter, niet
      zijnde baggerspecie;
        - *instelling:* certificeringsinstelling, inspectie-instelling, laboratorium of andere instelling, die beoordeelt
      of een persoon, stof, product, installatie, voorziening of ander object overeenstemt met een normdocument;
        - *landbodem:* bodem, niet zijnde waterbodem;
        - *mijnsteen:* bouwstof, in hoofdzaak bestaande uit gebroken schalie en zandsteen met bijmengingen van kolengruis,
      die als nevengesteente is vrijgekomen bij de winning van steenkool;
        - *milieuverklaring bodemkwaliteit:* overeenkomstig dit besluit afgegeven schriftelijke verklaring over de
      kwaliteit van een partij bouwstof, grond, baggerspecie, mijnsteen, vermengde mijnsteen of de bodem en die
      bedoeld is om, behoudens bewijs van onjuistheid of onvolledigheid, als wettig bewijsmiddel te dienen dat aan de
      toepasselijke kwaliteitseisen is voldaan;
        - *normdocument:* op grond van [artikel 25][ref5] aangewezen beoordelingsrichtlijn, protocol of andere richtlijn,
      code, aanbeveling of norm waarin eisen zijn opgenomen ter bevordering van de kwaliteit van werkzaamheden of de
      uitvoering daarvan;
        - *persoon:* natuurlijk persoon of rechtspersoon;
        - *Raad voor Accreditatie:* Raad voor Accreditatie als bedoeld in
      [artikel 1 van de Wet aanwijzing nationale accreditatie-instantie][ref6];
        - *tarragrond:* aanhangende grond die vrijkomt bij het behandelen van het gewas na de oogst;
        - *vermengde mijnsteen:* bouwstof, bestaande uit mijnsteen die met ten hoogste 80 gewichtsprocent grond of
      baggerspecie is vermengd;
        - *waterbodem:* bodem van een oppervlaktewaterlichaam waarvan het beheer van de waterkwaliteit bij het Rijk of het
      waterschap berust;
        - *werkzaamheid:* op grond van [artikel 8a][ref7] aangewezen werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0041313#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel25c
