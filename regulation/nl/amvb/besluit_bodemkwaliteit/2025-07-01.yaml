  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt een hoeveelheid bouwstoffen als een
      partij aangemerkt als de bouwstoffen een vergelijkbare aard en samenstelling en dezelfde herkomst of producent
      hebben en als eenheid worden verhandeld of toegepast.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt een hoeveelheid grond, baggerspecie,
      mijnsteen of vermengde mijnsteen als een partij aangemerkt als dat materiaal een vergelijkbare aard en
      samenstelling heeft en een eenheid vormt die is ontstaan door:
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel1
  - number: 1.3.a
    text: 'het ontgraven van een hoeveelheid van het materiaal, die van oorsprong in de bodem:'
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel1
  - number: 1.3.a.1°
    text: fysiek aaneengesloten is; of
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel1
  - number: 1.3.a.2°
    text: |-
      gedeeltelijk onderbroken is en waarbij de onderlinge afstand tussen de niet aaneengesloten hoeveelheden niet meer
      dan 25 m bedraagt;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel1
  - number: 1.3.b
    text: |-
      het ontgraven van een van oorsprong in de bodem niet fysiek aaneengesloten hoeveelheid van dat materiaal die niet
      meer dan 25 m3 bedraagt;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel1
  - number: 1.3.c
    text: het bewerken van het materiaal; of
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel1
  - number: 1.3.d
    text: het samenvoegen of splitsen van partijen van het materiaal.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel1
  - number: '1.4'
    text: |-
      Een milieuverklaring bodemkwaliteit kan de vorm hebben van een verklaring op grond van een partijkeuring, erkende
      kwaliteitsverklaring, fabrikant-eigenverklaring, verklaring op grond van een bodemonderzoek of verklaring op grond
      van een bodemkwaliteitskaart.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel1
  - number: 8a
    text: |-
      Bij ministeriële regeling worden met betrekking tot bouwstoffen, grond, baggerspecie,
      de bodem of bodemenergiesystemen werkzaamheden aangewezen als bedoeld in
      [artikel 11a.2, tweede lid, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11a
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 11a
  - number: '9.1'
    text: |-
      Onze Minister kan op aanvraag voor een werkzaamheid een erkenning bodemkwaliteit verlenen aan een persoon of een
      instelling.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel9
  - number: '9.2'
    text: |-
      De beschikking vermeldt ten minste de naam van de persoon of instelling, de werkzaamheid, de vestigingsplaats en,
      indien van toepassing, de naam van de natuurlijk persoon die werkzaam is voor de erkende persoon of instelling en
      die een van de bij regeling van Onze Minister aangewezen handelingen uitvoert.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel9
  - number: '9.3'
    text: Een erkenning bodemkwaliteit wordt voor onbepaalde tijd verleend.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel9
  - number: '9.4'
    text: |-
      Onze Minister stelt lijsten met erkende personen en instellingen beschikbaar via een door Onze Minister aangewezen
      website. Het besluit tot aanwijzing van de website wordt in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel9
  - number: '9.5'
    text: Een erkenning bodemkwaliteit is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel9
  - number: '10.1'
    text: |-
      Een aanvraag voor een erkenning bodemkwaliteit wordt door middel van een door Onze Minister vastgesteld formulier,
      ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel10
  - number: '10.2'
    text: 'Bij de aanvraag worden ten minste de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel10
  - number: 10.2.a
    text: de naam en het adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel10
  - number: 10.2.b
    text: de werkzaamheid waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel10
  - number: 10.2.c
    text: het certificaat of de accreditatie voor de werkzaamheid;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel10
  - number: 10.2.d
    text: de vestigingsplaats van de persoon of instelling;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel10
  - number: 10.2.e
    text: |-
      indien van toepassing, de naam en een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], die niet ouder is dan zes maanden, van de
      natuurlijk persoon als bedoeld in [artikel 9, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '10.3'
    text: Onze Minister kan nadere regels stellen met betrekking tot de in het tweede lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel10
  - number: '11.1'
    text: Onze Minister beslist binnen acht weken na de datum van ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel11
  - number: '11.2'
    text: |-
      Onze Minister verleent de erkenning bodemkwaliteit geheel of gedeeltelijk, indien de desbetreffende persoon of
      instelling:
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel11
  - number: 11.2.a
    text: niet in staat van faillissement of surseance van betaling verkeert; en
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel11
  - number: 11.2.b
    text: |-
      heeft voldaan aan [artikel 10, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel10
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '11.3'
    text: |-
      Bij regeling van Onze Minister wordt aangegeven of een erkenning bodemkwaliteit voor een werkzaamheid wordt
      gebaseerd op een certificaat of een accreditatie.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel11
  - number: '11.4'
    text: |-
      Een erkenning bodemkwaliteit kan geheel of gedeeltelijk worden geweigerd, indien de desbetreffende
      persoon of instelling of een bestuurder van deze persoon of instelling, in de drie jaren voorafgaande
      aan de aanvraag een overtreding heeft begaan van een wettelijk voorschrift dat is gesteld bij of
      krachtens dit besluit of de [Omgevingswet][ref1], een krachtens dit besluit aangewezen normdocument of
      [artikel 225 van het Wetboek van Strafrecht][ref2], voor zover de overtreding verband houdt met een werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '225'
  - number: '11.5'
    text: |-
      Een erkenning bodemkwaliteit kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '11.6'
    text: |-
      Voordat toepassing wordt gegeven aan het vijfde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '12.1'
    text: |-
      Op verzoek van de erkende persoon of instelling kan de erkenning bodemkwaliteit worden gewijzigd.
      [Artikel 9, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '12.2'
    text: |-
      Het verzoek wordt, door middel van een door Onze Minister vastgesteld formulier, ingediend bij Onze Minister.
      [Artikel 10, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel10
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '12.3'
    text: |-
      Onze Minister beslist binnen vier weken na de datum van ontvangst van het verzoek.
      [Artikel 11, tweede en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel11
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '13.1'
    text: |-
      Met een verklaring omtrent het gedrag als bedoeld in [artikel 10, tweede lid, onder e][ref1], wordt gelijkgesteld
      een verklaring omtrent het gedrag afgegeven door een daartoe bevoegde instantie in een andere lidstaat van de
      Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe
      strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of documenten die
      een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de nationale
      onderzoekingen of documenten wordt geboden, mits die verklaring niet ouder is dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel10
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '13.2'
    text: |-
      Met een certificaat of accreditatie als bedoeld bij of krachtens dit besluit of in een normdocument wordt
      gelijkgesteld een certificaat of accreditatie afgegeven door een daartoe bevoegde instelling in een andere lidstaat
      van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een
      daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of documenten
      die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de nationale
      onderzoekingen of de normdocumenten wordt geboden.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel13
  - number: '13.3'
    text: |-
      Met een erkenning bodemkwaliteit wordt gelijkgesteld een erkenning bodemkwaliteit of een vergelijkbare beschikking
      afgegeven door een daartoe bevoegde instantie in een andere lidstaat van de Europese Unie dan wel in een
      staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe
      strekkend verdrag dat Nederland bindt, op basis van voorwaarden die een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het beschermingsniveau dat met de voorwaarden, genoemd in [artikel 10, tweede lid][ref1],
      wordt geboden. De [artikelen 9, vierde lid][ref2], en [24][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel24
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '24'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.1'
    text: Het is verboden een werkzaamheid uit te voeren zonder daartoe verleende erkenning bodemkwaliteit.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel15
  - number: '15.2'
    text: |-
      De in [artikel 9, tweede lid][ref1], bedoelde handelingen kunnen slechts worden uitgevoerd door een natuurlijke
      persoon die staat vermeld op de erkenning bodemkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '15.3'
    text: |-
      Het bepaalde in het eerste en tweede lid geldt niet voorzover de werkzaamheid wordt uitgevoerd voor het verkrijgen
      van een certificaat of een accreditatie.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel15
  - number: '16'
    text: |-
      Het is een persoon of instelling verboden een resultaat van een werkzaamheid te gebruiken of aan een ander ter
      beschikking te stellen indien hij weet of redelijkerwijs had kunnen vermoeden dat dit resultaat, gelet op het
      doel waarvoor dit wordt gebruikt, geen betrouwbaar beeld verschaft van de eigenschappen, aard, hoedanigheid of
      samenstelling van de bodem, grond, baggerspecie of bouwstof.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel16
  - number: '17.1'
    text: |-
      Een bij regeling van Onze Minister aangewezen instelling of persoon verricht niet een bij ministeriële regeling
      aangewezen handeling met betrekking tot bodem, grond, baggerspecie of bouwstof, waarop deze instelling of persoon
      een persoonlijk of zakelijk recht heeft.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel17
  - number: '17.2'
    text: |-
      Een bij regeling van Onze Minister aangewezen instelling of persoon verricht niet een bij ministeriële regeling
      aangewezen handeling ten aanzien van een persoon, een stof, een bouwstof, een product, een installatie, een
      voorziening of ander object, waarmee deze instelling of persoon een organisatorische, financiële of juridische
      binding heeft, tenzij deze binding alleen voortvloeit uit de overeenkomst tot uitvoering van de werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel17
  - number: '17.3'
    text: |-
      Het eerste lid geldt niet voor degene die door middel van organisatorische maatregelen, op aantoonbare,
      transparante en controleerbare wijze, ervoor zorg heeft gedragen dat de werkzaamheid uitsluitend wordt verricht
      door een onderdeel van de organisatie dat of een persoon die:
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel17
  - number: 17.3.a
    text: geen financieel belang heeft bij de uitkomst van de werkzaamheid;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel17
  - number: 17.3.b
    text: |-
      onder een andere bestuurlijke verantwoordelijkheid valt dan degene die een persoonlijk of zakelijk recht heeft op
      de bodem, grond, baggerspecie of bouwstof, en
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel17
  - number: 17.3.c
    text: |-
      onder de directe aansturing van een andere leidinggevende valt dan degene die een persoonlijk of zakelijk recht
      heeft op de bodem, grond, baggerspecie of bouwstof.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel17
  - number: '17.4'
    text: |-
      Indien een normdocument eisen bevat ten aanzien van organisatorische maatregelen als bedoeld in het derde lid
      voldoet de persoon of instelling die voor de desbetreffende werkzaamheid is erkend aan het derde lid, indien hij
      aan het normdocument voldoet.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel17
  - number: '18.1'
    text: Het is verboden een werkzaamheid uit te voeren in strijd met het daarvoor geldende normdocument.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel18
  - number: '18.2'
    text: |-
      Het in het eerste lid gestelde verbod geldt niet voor zover het afwijken van het normdocument bij wettelijk
      voorschrift is toegestaan.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel18
  - number: '19'
    text: |-
      De houder van een erkenning bodemkwaliteit meldt onverwijld aan een door Onze Minister aangewezen instantie zijn
      door de rechtbank uitgesproken faillissement of surseance van betaling. De melding geschiedt door middel van een
      door Onze Minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel19
  - number: '20'
    text: |-
      Een certificeringsinstelling of de Raad voor Accreditatie meldt een schorsing of intrekking van een certificaat,
      onderscheidenlijk een accreditatie, voor een werkzaamheid onverwijld aan een door Onze Minister aangewezen
      instantie. De melding geschiedt door middel van een door Onze Minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel20
  - number: '23.1'
    text: 'Onze Minister kan een erkenning bodemkwaliteit geheel of gedeeltelijk intrekken:'
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
  - number: 23.1.a
    text: op verzoek van de erkende persoon of instelling;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
  - number: 23.1.b
    text: |-
      indien bij de aanvraag onjuiste of onvolledige gegevens zijn verstrekt, en kennis omtrent de juiste en volledige
      gegevens tot een andere beslissing zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
  - number: 23.1.c
    text: |-
      indien het bewijs van certificatie of accreditatie voor de desbetreffende werkzaamheid is ingetrokken of niet meer
      geldig is;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
  - number: 23.1.d
    text: |-
      indien de erkende persoon of instelling in staat van faillissement verkeert of surseance van betaling heeft
      verkregen, of
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
  - number: 23.1.e
    text: |-
      indien de erkende persoon of instelling of de natuurlijk persoon, bedoeld in [artikel 9, tweede lid][ref1],
      een overtreding heeft begaan van een wettelijk voorschrift dat is gesteld bij of krachtens
      dit besluit of de [Omgevingswet][ref2], een krachtens dit besluit aangewezen normdocument of
      [artikel 225 van het Wetboek van Strafrecht][ref3], voor zover de overtreding verband houdt met een werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037885
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0037885
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '225'
  - number: '23.2'
    text: |-
      Onze Minister kan een erkenning bodemkwaliteit voor een periode van ten hoogste twee jaren, geheel of gedeeltelijk
      schorsen, indien:
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
  - number: 23.2.a
    text: het bewijs van certificatie of accreditatie voor de desbetreffende werkzaamheid is geschorst, of
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
  - number: 23.2.b
    text: sprake is van een overtreding als bedoeld in het eerste lid, onder e.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister kan een erkenning bodemkwaliteit intrekken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '23.4'
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '23.5'
    text: |-
      Indien een besluit tot intrekking of schorsing betrekking heeft op een certificeringsinstelling blijven de door
      deze instelling afgegeven certificaten gedurende zes maanden geldig.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
  - number: '23.6'
    text: |-
      Ingeval van aanwijzingen dat er sprake is van een overtreding als bedoeld in het eerste lid, onderdeel e, kan Onze
      Minister de desbetreffende persoon of instelling verzoeken binnen een redelijke termijn een verklaring omtrent het
      gedrag als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] over te leggen, die
      niet ouder is dan twee maanden. Indien de desbetreffende persoon of instelling niet binnen de gestelde termijn aan
      dit verzoek voldoet of kan voldoen, kan Onze Minister de erkenning bodemkwaliteit voor een periode van ten hoogste
      twee jaren geheel of gedeeltelijk schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '24'
    text: |-
      Onze Minister verwerkt de schorsing en intrekking van de erkenning bodemkwaliteit in de lijsten, bedoeld in
      [artikel 9, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '25.1'
    text: 'Onze Minister kan normdocumenten aanwijzen voorzover deze:'
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25
  - number: 25.1.a
    text: niet in strijd zijn met een wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25
  - number: 25.1.b
    text: zijn vastgesteld door organen waarin alle betrokken partijen zich konden laten vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25
  - number: 25.1.c
    text: zowel qua inhoud als qua strekking voldoende duidelijk zijn, en
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25
  - number: 25.1.d
    text: voldoende draagvlak hebben bij de betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25
  - number: '25.2'
    text: |-
      Met de normdocumenten worden gelijkgesteld documenten die zijn vastgesteld in een andere lidstaat van de
      Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe
      strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het beschermingsniveau dat met de normdocumenten wordt geboden.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25
  - number: 25a
    text: |-
      Dit hoofdstuk gaat over de afgifte van milieuverklaringen bodemkwaliteit en het daarvoor te verrichten onderzoek
      voor het uitvoeren van handelingen met bouwstoffen overeenkomstig [artikel 25h][ref1] en het toepassen van
      bouwstoffen, grond of baggerspecie overeenkomstig het [Besluit activiteiten leefomgeving][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel25h
      [ref2]: https://wetten.overheid.nl/BWBR0041330
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: 25h
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0041330
  - number: 25b.1
    text: |-
      Een verklaring op grond van een partijkeuring heeft betrekking op de kwaliteit van bouwstoffen, grond of
      baggerspecie en wordt afgegeven voor een partij.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25b
  - number: 25b.2
    text: |-
      Een erkende kwaliteitsverklaring heeft betrekking op de kwaliteit van bouwstoffen, grond of baggerspecie en wordt
      afgegeven voor een partij of een product.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25b
  - number: 25b.3
    text: |-
      Een fabrikant-eigenverklaring heeft betrekking op de kwaliteit van bouwstoffen of bij ministeriële regeling
      aangewezen typen grond of baggerspecie en wordt afgegeven voor een product.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25b
  - number: 25b.4
    text: |-
      Een verklaring op grond van een bodemonderzoek heeft betrekking op de kwaliteit van de bodem op een in de
      verklaring aangegeven locatie of op de kwaliteit van grond, baggerspecie, mijnsteen of vermengde mijnsteen die uit
      de bodem op die locatie is of wordt ontgraven.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25b
  - number: 25b.5
    text: |-
      Een verklaring op grond van een bodemkwaliteitskaart heeft betrekking op de kwaliteit van de bodem op een in de
      verklaring aangegeven locatie op de bodemkwaliteitskaart of op de kwaliteit van grond of baggerspecie, die uit de
      bodem op die locatie is of wordt ontgraven.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25b
  - number: 25c.1
    text: |-
      Een verklaring op grond van een partijkeuring, erkende kwaliteitsverklaring of verklaring op grond van een
      bodemonderzoek wordt afgegeven op grond van een onderzoek dat is verricht door een persoon of instelling
      die beschikt over een erkenning bodemkwaliteit als die voor het uitvoeren van die werkzaamheid op grond van
      [artikel 15, eerste lid][ref1], is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel15
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 25c.2
    text: |-
      Een fabrikant-eigenverklaring wordt afgegeven door de producent op grond van een onderzoek dat voldoet aan de bij
      of krachtens dit besluit gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25c
  - number: 25c.3
    text: |-
      Een verklaring op grond van een bodemkwaliteitskaart wordt afgegeven op grond van een onderzoek dat is verricht
      met gebruikmaking van een bodemkwaliteitskaart waarop de feitelijke kwaliteit van de bodem in het gebied waarop de
      kaart betrekking heeft is weergegeven en die voldoet aan de op grond van [artikel 25g, zesde lid][ref1], gestelde
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel25g
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: 25g
        hoofdstuk: 2a
  - number: 25d.1
    text: |-
      Een milieuverklaring bodemkwaliteit die betrekking heeft op de kwaliteit van bouwstoffen, vermeldt of de
      bouwstoffen voldoen aan de daarvoor geldende kwaliteitseisen die gelden voor verontreinigende stoffen of andere
      parameters.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.2
    text: 'Een milieuverklaring bodemkwaliteit die betrekking heeft op de kwaliteit van grond vermeldt ten minste:'
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.2.a
    text: |-
      de kwaliteitsklasse waarin de grond is ingedeeld met behulp van de kwaliteitseisen die gelden voor de volgende
      kwaliteitsklassen van grond: landbouw/natuur, wonen, industrie, matig verontreinigd en sterk verontreinigd;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.2.b
    text: |-
      de kwaliteitsklasse van baggerspecie waarmee de kwaliteit van de grond overeenkomt, getoetst aan de hand van
      de kwaliteitseisen die gelden voor de volgende kwaliteitsklassen van baggerspecie: algemeen toepasbaar, licht
      verontreinigd, matig verontreinigd en sterk verontreinigd; en
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.2.c
    text: |-
      welke concentraties, emissies, gehalten of andere waarden van verontreinigende stoffen die niet bepalend zijn voor
      de indeling in een kwaliteitsklasse, en andere relevante parameters daarin aangetroffen zijn.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.3
    text: 'Een milieuverklaring bodemkwaliteit die betrekking heeft op de kwaliteit van baggerspecie vermeldt ten minste:'
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.3.a
    text: |-
      de kwaliteitsklasse waarin de baggerspecie is ingedeeld met behulp van de kwaliteitseisen die gelden voor de
      volgende kwaliteitsklassen van baggerspecie: algemeen toepasbaar, licht verontreinigd, matig verontreinigd en sterk
      verontreinigd;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.3.b
    text: |-
      de kwaliteitsklasse van grond waarmee de kwaliteit van de baggerspecie overeenkomt, getoetst aan de hand van de
      kwaliteitseisen die gelden voor de volgende kwaliteitsklassen van grond: landbouw/natuur, wonen en industrie, matig
      verontreinigd en sterk verontreinigd; en
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.3.c
    text: |-
      welke concentraties, emissies, gehalten of andere waarden van verontreinigende stoffen die niet bepalend zijn voor
      de indeling in een kwaliteitsklasse, en andere relevante parameters daarin aangetroffen zijn.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.4
    text: |-
      Een milieuverklaring bodemkwaliteit die betrekking heeft op de kwaliteit van de bodem vermeldt ten minste de
      kwaliteitsklasse waarin de bodem is ingedeeld met behulp van de kwaliteitseisen die gelden voor de volgende
      kwaliteitsklassen van de bodem:
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.4.a
    text: 'voor de landbodem de volgende kwaliteitsklassen: landbouw/natuur, wonen en industrie; en'
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.4.b
    text: 'voor de waterbodem de volgende kwaliteitsklassen: niet verontreinigd, licht verontreinigd en matig verontreinigd.'
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.5
    text: |-
      Een milieuverklaring bodemkwaliteit die betrekking heeft op de kwaliteit van grond of baggerspecie kan vermelden
      of de grond of baggerspecie voldoet aan de kwaliteitseisen die gelden voor de volgende kwaliteiten van grond en
      baggerspecie:
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.5.a
    text: emissiearme grond of emissiearme baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.5.b
    text: voor verspreiden op de landbodem geschikte baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.5.c
    text: voor verspreiden in zoet oppervlaktewater geschikte baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.5.d
    text: voor verspreiden in zout oppervlaktewater geschikte baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.5.e
    text: voor toepassen in een diepe plas geschikte grond;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.5.f
    text: voor toepassen in een diepe plas geschikte baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.5.g
    text: voor toepassen als afdeklaag in een diepe plas geschikte grond;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.5.h
    text: voor toepassen als afdeklaag in een diepe plas geschikte baggerspecie; of
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.5.i
    text: tarragrond.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.6
    text: |-
      Een milieuverklaring bodemkwaliteit die betrekking heeft op de kwaliteit van mijnsteen of vermengde mijnsteen
      kan vermelden of de mijnsteen of vermengde mijnsteen voldoet aan de kwaliteitseisen die gelden voor de kwaliteit
      emissiearme mijnsteen of vermengde mijnsteen.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
  - number: 25d.7
    text: |-
      De kwaliteitseisen, bedoeld in dit artikel, zijn de kwaliteitseisen, vastgesteld op grond van
      [artikel 25g, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel25g
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: 25g
        hoofdstuk: 2a
  - number: 25e.1
    text: |-
      Een milieuverklaring bodemkwaliteit bevat voor elke relevante kwaliteitseis de gegevens waarop de verklaring is
      gebaseerd of een verwijzing naar een rapport waarin deze gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25e
  - number: 25e.2
    text: 'Een milieuverklaring bodemkwaliteit vermeldt:'
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25e
  - number: 25e.2.a
    text: welk type milieuverklaring bodemkwaliteit het betreft;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25e
  - number: 25e.2.b
    text: de naam van degene die de verklaring heeft afgegeven;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25e
  - number: 25e.2.c
    text: de herkomst van de bouwstoffen, grond of baggerspecie waarop de verklaring betrekking heeft; en
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25e
  - number: 25e.2.d
    text: de hoeveelheid bouwstoffen, grond of baggerspecie waarop de verklaring betrekking heeft, uitgedrukt in ton.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25e
  - number: 25f.1
    text: |-
      Als er op grond van de activiteiten die op de locatie van het ontgraven hebben plaatsgevonden, de
      ontstaansgeschiedenis van een partij of anderszins aanleiding bestaat om te veronderstellen dat in grond,
      baggerspecie, mijnsteen of vermengde mijnsteen stoffen of andere parameters aanwezig zijn waardoor dat materiaal
      niet geschikt is om op of in de bodem of in een oppervlaktewaterlichaam te worden toegepast, wordt daarnaar het
      nodige onderzoek verricht voordat met betrekking tot het materiaal een milieuverklaring bodemkwaliteit wordt
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25f
  - number: 25f.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing als er aanleiding bestaat om te veronderstellen dat in grond,
      baggerspecie, mijnsteen of vermengde mijnsteen bodemvreemd materiaal voorkomt dat daarin al voor het ontgraven of
      bewerken aanwezig was.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25f
  - number: 25f.3
    text: |-
      Als uit een onderzoek als bedoeld in het eerste of tweede lid blijkt dat de aanwezigheid van verontreinigende
      stoffen, andere relevante parameters of bodemvreemd materiaal grond, baggerspecie, mijnsteen of vermengde mijnsteen
      ongeschikt kan maken voor het toepassen op of in de bodem of in een oppervlaktewaterlichaam, wordt de aanwezigheid
      van de stoffen, andere relevante parameters of bodemvreemd materiaal in de milieuverklaring bodemkwaliteit die
      betrekking heeft op de kwaliteit van de grond, baggerspecie, mijnsteen of vermengde mijnsteen aangegeven, waarbij
      bovendien de concentraties, emissies, gehalten of andere waarden van de verontreinigende stoffen of andere
      parameters en het gewichtspercentage van het bodemvreemde materiaal worden vermeld.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25f
  - number: 25g.1
    text: |-
      Bij ministeriële regeling worden de kwaliteitseisen, bedoeld in [artikel 25d][ref1], vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel25d
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: 25d
        hoofdstuk: 2a
  - number: 25g.2
    text: |-
      Kwaliteitseisen kunnen betrekking hebben op verontreinigende stoffen of andere relevante parameters en kunnen de
      vorm hebben van emissiewaarden, concentratiewaarden, gehalten of andere waarden.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.3
    text: |-
      Kwaliteitseisen kunnen strekken ter begrenzing van een kwaliteitsklasse waarin grond, baggerspecie, mijnsteen,
      vermengde mijnsteen of de bodem worden ingedeeld, of ter bepaling van de kwaliteit van bouwstoffen, grond of
      baggerspecie, bedoeld in [artikel 25d, tweede lid, onder c, of derde lid, onder c][ref1], of een kwaliteit grond
      of baggerspecie als vermeld in artikel 25d, vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel25d
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: 25d
        hoofdstuk: 2a
  - number: 25g.4
    text: |-
      De kwaliteitsklassen waarin grond, baggerspecie, mijnsteen en vermengde mijnsteen worden ingedeeld ten behoeve van
      het toepassen daarvan op of in de landbodem, komen naar benaming en begrenzing overeen met de kwaliteitsklassen en
      bodemfunctieklassen waarin de ontvangende landbodem is ingedeeld.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.5
    text: |-
      De kwaliteitsklassen waarin grond, baggerspecie, mijnsteen en vermengde mijnsteen worden ingedeeld ten behoeve
      van het toepassen daarvan in een oppervlaktewaterlichaam, komen naar benaming en begrenzing overeen met de
      kwaliteitsklassen waarin de ontvangende waterbodem is ingedeeld.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.6
    text: |-
      Bij ministeriële regeling worden eisen gesteld waaraan een bodemkwaliteitskaart moet voldoen om te kunnen gebruiken
      voor een onderzoek en voor het afgeven van een verklaring op grond van een bodemkwaliteitskaart als bedoeld in
      [artikel 25c, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel25c
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: 25c
        hoofdstuk: 2a
  - number: 25g.7
    text: |-
      Bij ministeriële regeling kunnen gevallen worden aangewezen waarin in afwijking van
      [artikel 25d, tweede of derde lid][ref1], daarbij aangegeven informatie voor een partij grond of baggerspecie niet
      in een milieuverklaring bodemkwaliteit hoeft te worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel25d
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: 25d
        hoofdstuk: 2a
  - number: 25g.8
    text: |-
      Bij ministeriële regeling kunnen gevallen worden aangewezen waarin bij de afgifte van een milieuverklaring
      bodemkwaliteit aan de afnemer van een partij van een bouwstof of een partij grond of baggerspecie een afleverbon
      moet worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9
    text: 'Bij ministeriële regeling kunnen voor de goede uitvoering van dit hoofdstuk regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.a
    text: de vaststelling wanneer materiaal als bouwstof, grond of baggerspecie wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.b
    text: de vaststelling wanneer sprake is van vormgegeven bouwstoffen;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.c
    text: |-
      de vaststelling wanneer bouwstoffen, grond of baggerspecie de daarbij aangegeven eigenschappen of samenstelling
      bezitten;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.d
    text: |-
      de vaststelling van de concentraties van daarbij aangegeven verontreinigende stoffen in bouwstoffen, grond of
      baggerspecie of de bodem;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.e
    text: |-
      de vaststelling van de gehalten of andere waarden van andere relevante parameters dan verontreinigende stoffen in
      bouwstoffen, grond of baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.f
    text: |-
      de vaststelling van de emissies van daarbij aangegeven verontreinigende stoffen uit bouwstoffen, grond of
      baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.g
    text: |-
      het onderzoek, bedoeld in [artikel 28, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel28
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '28'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 25g.9.h
    text: de splitsing en samenvoeging van partijen bouwstoffen, grond of baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.i
    text: de indeling van grond, baggerspecie, mijnsteen en vermengde mijnsteen of de bodem in een kwaliteitsklasse;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.j
    text: |-
      de vaststelling of de kwaliteit van bouwstoffen, grond of baggerspecie of de bodem voldoet aan de bij of krachtens
      dit besluit gestelde kwaliteitseisen;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.k
    text: |-
      het onderzoek voor de afgifte van een milieuverklaring bodemkwaliteit, waaronder de monsterneming, de behandeling
      en analyse van monsters en de rapportage over de resultaten van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.l
    text: |-
      de vaststelling of in de bouwstoffen, grond of baggerspecie stoffen of andere parameters aanwezig zijn waardoor
      dat materiaal niet geschikt is om op of in de bodem of in een oppervlaktewaterlichaam te worden toegepast, waarbij
      onderscheid naar de wijze van toepassing kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.m
    text: de afgifte van milieuverklaringen bodemkwaliteit;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.n
    text: het vooronderzoek voor de afgifte van milieuverklaringen bodemkwaliteit;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.o
    text: |-
      het toelatingsonderzoek voor en de kwaliteitsbewaking bij de vervaardiging van bouwstoffen, grond of baggerspecie
      met het oog op het afgeven van milieuverklaringen bodemkwaliteit;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.p
    text: de afgifte en het gebruik van milieuverklaringen bodemkwaliteit;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.q
    text: |-
      de vaststelling wanneer een hoeveelheid bouwstoffen, grond of baggerspecie na splitsing of samenvoeging van
      partijen als verschillende partijen wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.r
    text: de inhoud en vormgeving van milieuverklaringen bodemkwaliteit; en
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25g.9.s
    text: de inhoud en vormgeving van afleverbonnen.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25g
  - number: 25h.1
    text: |-
      Het vervaardigen, invoeren, voor toepassing in Nederland of voor handelsdoeleinden voor de Nederlandse markt
      voorhanden hebben, vervoeren of aan een ander ter beschikking stellen van bouwstoffen is verboden, tenzij:
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25h
  - number: 25h.1.a
    text: |-
      de bouwstoffen voldoen aan de voor bouwstoffen geldende kwaliteitseisen, bedoeld in
      [artikel 25d, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel25d
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25h
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: 25d
        hoofdstuk: 2a
  - number: 25h.1.b
    text: |-
      een milieuverklaring bodemkwaliteit beschikbaar is waarmee kan worden aangetoond dat de bouwstoffen voldoen aan de
      voor bouwstoffen geldende kwaliteitseisen, bedoeld in [artikel 25d, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel25d
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25h
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: 25d
        hoofdstuk: 2a
  - number: 25h.1.c
    text: |-
      een afleverbon voorhanden is in gevallen waarin deze op grond van het tweede lid bij de afgifte van de
      milieuverklaring bodemkwaliteit moet worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25h
  - number: 25h.2
    text: |-
      Bij ministeriële regeling kunnen gevallen worden aangewezen waarin bij de afgifte van de milieuverklaring
      bodemkwaliteit aan de afnemer van een partij van een bouwstof een afleverbon moet worden verstrekt en kunnen regels
      worden gesteld over de inhoud en vormgeving van afleverbonnen.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel25h
  - number: '66'
    text: |-
      [Hoofdstuk 2][ref1] van dit besluit is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0022929
        hoofdstuk: '2'
  - number: 66.a
    text: |-
      een werkzaamheid die voor inwerkingtreding van het [Besluit uitvoeringskwaliteit bodembeheer][ref1] is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0019963
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019963
  - number: 66.b
    text: |-
      een werkzaamheid die wordt verricht ter uitvoering van een wettelijke taak door of in opdracht van een
      bestuursorgaan, of
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel66
  - number: 66.c
    text: de opsporing en vervolging van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel66
  - number: '80'
    text: |-
      Een kaart van de bodemfunctieklassen van het gebied binnen een gemeente die is vastgesteld
      op grond van [artikel 55, eerste lid][ref1], zoals dat luidde voor de inwerkingtreding van
      [artikel XI, onderdeel I, van het Verzamelbesluit Omgevingswet 2022][ref2], geldt als een bodemfunctieklassenkaart
      op grond van artikel 55, eerste lid, zoals dat luidt na de inwerkingtreding van artikel XI, onderdeel I, van het
      Verzamelbesluit Omgevingswet 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0046640#ArtikelXI
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0046640
        artikel: XI
  - number: 82a
    text: |-
      Dit besluit berust mede op [artikel 9.2.2.1 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '84'
    text: 'Dit besluit wordt aangehaald als: Besluit bodemkwaliteit.'
    url: https://wetten.overheid.nl/BWBR0022929/2025-07-01#Artikel84
