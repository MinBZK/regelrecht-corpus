  - number: '2.3'
    text: De beheerder is het bevoegd gezag ten opzichte van degene die een bouwstof toepast in een oppervlaktewaterlichaam.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister is het bevoegd gezag ten opzichte van degene die de handelingen, genoemd in
      [artikel 28, eerste lid, aanhef][ref1], verricht, met uitzondering van het toepassen van bouwstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel28
