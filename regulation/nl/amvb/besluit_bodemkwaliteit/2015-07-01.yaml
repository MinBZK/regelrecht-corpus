  - number: '37.2'
    text: |-
      Bij regeling van Onze Ministers worden regels gesteld ten aanzien van de wijze waarop een overschrijding wordt
      vastgesteld van waarden, gesteld bij of krachtens de artikelen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel37
  - number: '38.1'
    text: |-
      Degene die voornemens is grond of baggerspecie toe te passen laat overeenkomstig de bij regeling van Onze Ministers
      bepaalde methoden door een persoon of instelling die daartoe beschikt over een erkenning de kwaliteit van de grond
      of baggerspecie vaststellen, met inbegrip van de emissiewaarden voor zover vereist op grond van [artikel 63][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel63
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
  - number: '38.2'
    text: |-
      De kwaliteit van de grond of baggerspecie en het gestelde in het eerste lid blijkt uit een milieuhygiënische
      verklaring, die bij de betreffende partij aanwezig is.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel38
  - number: '38.3'
    text: |-
      Bij regeling van Onze Ministers wordt bepaald onder welke voorwaarden de milieuhygiënische verklaring, bedoeld in
      het tweede lid, mag worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel38
  - number: '38.4'
    text: |-
      De toe te passen grond of baggerspecie kan worden ingedeeld in de bij regeling van Onze Ministers vast te stellen
      kwaliteitsklassen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel38
  - number: '38.5'
    text: |-
      Bij regeling van Onze Ministers worden regels gesteld met betrekking tot het samenvoegen en splitsen van partijen
      grond of baggerspecie.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel38
  - number: '38.6'
    text: 'Het eerste tot en met het vijfde lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel38
  - number: 38.6.a
    text: natuurlijke personen anders dan in de uitoefening van beroep of bedrijf; en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel38
  - number: 38.6.b
    text: |-
      degene die voornemens is grond of baggerspecie toe te passen binnen een landbouwbedrijf, indien de grond of
      baggerspecie afkomstig is van een tot dat landbouwbedrijf behorend perceel waarop een vergelijkbaar gewas wordt
      geteeld als op het perceel waar de grond of baggerspecie wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel38
  - number: '39'
    text: |-
      Op het toepassen van grond of baggerspecie waarvan de kwaliteit de bij regeling van Onze Ministers vastgestelde
      achtergrondwaarden niet overschrijdt, zijn [artikel 40][ref1] en [afdeling 2][ref2] van dit hoofdstuk niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        hoofdstuk: '4'
        afdeling: '2'
  - number: '40.1'
    text: |-
      Het vaststellen van de kwaliteit van de bodem, waarop of waarin de grond of baggerspecie wordt toegepast, geschiedt
      overeenkomstig de bij regeling van Onze Ministers bepaalde methoden door een persoon of instelling die daartoe
      beschikt over een erkenning krachtens [artikel 9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '40.2'
    text: De kwaliteit van de bodem en het gestelde in het eerste lid, blijkt uit een milieuhygiënische verklaring.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel40
  - number: '41'
    text: |-
      Bij regeling van Onze Ministers wordt bepaald welke van de in [bijlage 1][ref1] van dit besluit genoemde parameters
      voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen worden gemeten ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 41.a
    text: |-
      de vaststelling van de kwaliteit van grond of baggerspecie, met inbegrip van de emissiewaarden voor toepassingen
      voor zover vereist op grond van [artikel 63][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel63
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
  - number: 41.b
    text: de vaststelling van de kwaliteit van de bodem, waarop of waarin grond of baggerspecie wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel41
  - number: '42.1'
    text: |-
      Degene die voornemens is grond of baggerspecie toe te passen als bedoeld in
      [artikel 35, onderdeel a tot en met i, met uitzondering van onderdeel f][ref1], meldt dat voornemen ten minste vijf
      werkdagen van tevoren aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '42.2'
    text: |-
      Bij de melding van een toepassing als bedoeld in [artikel 35, onder a tot en met e en g][ref1], worden ten minste
      de volgende gegevens verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: 42.2.a
    text: de naam en het adres van degene die voornemens is grond of baggerspecie toe te passen;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: 42.2.b
    text: het toetsingskader waarbinnen de toepassing wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: 42.2.c
    text: de milieuhygiënische verklaring van de toe te passen grond of baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: 42.2.d
    text: de plaats van herkomst van de toe te passen grond of baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: 42.2.e
    text: de hoeveelheid toe te passen grond of baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: 42.2.f
    text: de toepassingslocatie;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: 42.2.g
    text: |-
      voor zover het een toepassing betreft krachtens [afdeling 2, paragraaf 2][ref1], de bodemkwaliteitsklasse;


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022929
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: 42.2.h
    text: |-
      voor zover het een toepassing op of in de bodem, uitgezonderd de bodem of oever van een oppervlaktewaterlichaam,
      betreft krachtens [afdeling 2, paragraaf 2][ref1], de bodemfunctieklasse.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022929
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '42.3'
    text: |-
      Op de melding van de toepassing, bedoeld in [artikel 35, onder h en i][ref1], is het tweede lid,
      onder a, c tot en met f, van overeenkomstige toepassing en op meldingen van de toepassing, bedoeld
      in [artikel 35, onder h, het tweede lid, onder g][ref2]. Bij meldingen van de toepassing, bedoeld in
      [artikel 35, onder h en i][ref3], wordt ook de voorziene duur van de toepassing vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '42.4'
    text: |-
      Indien de voorziene duur van de toepassing, bedoeld in [artikel 35, onder h en i][ref1], langer is dan zes maanden,
      wordt de eindbestemming van de grond of baggerspecie binnen die termijn gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '42.5'
    text: Onze Ministers kunnen nadere regels stellen met betrekking tot de in het tweede lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: '42.6'
    text: |-
      De melding wordt elektronisch of schriftelijk gedaan door middel van een formulier waarvan het model bij regeling
      van Onze Ministers wordt aangewezen. Onze Ministers kunnen nadere regels stellen met betrekking tot de wijze waarop
      moet worden gemeld.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: '42.7'
    text: Onze Minister zendt onverwijld de melding met de bijbehorende gegevens elektronisch door aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: '42.8'
    text: 'Het eerste lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: 42.8.a
    text: natuurlijke personen anders dan in de uitoefening van beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: 42.8.b
    text: |-
      degene die voornemens is grond of baggerspecie toe te passen binnen een landbouwbedrijf, indien de grond of
      baggerspecie afkomstig is van een tot dat landbouwbedrijf behorend perceel waarop een vergelijkbaar gewas wordt
      geteeld als op het perceel waar de grond of baggerspecie wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: 42.8.c
    text: |-
      degene die voornemens is grond of baggerspecie als bedoeld in [artikel 39][ref1] in een omvang van minder dan 50 m3
      toe te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel39
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: '42.9'
    text: |-
      Degene die voornemens is grond of baggerspecie als bedoeld in [artikel 39][ref1] in een omvang van ten minste 50
      m3 toe te passen, meldt in afwijking van het tweede en derde lid eenmalig de gegevens, genoemd in het tweede lid,
      onder a en f.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel39
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: '42.10'
    text: |-
      Het achtste lid, onder c, en het negende lid zijn niet van toepassing op het toepassen van grond of baggerspecie in
      de Nederlandse territoriale zee.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: '42.11'
    text: |-
      De volgende toepassers van grond of baggerspecie bewaren de in het tweede, onder a, c tot en met f, genoemde
      gegevens gedurende ten minste vijf jaren:
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: 42.11.a
    text: |-
      degene die voornemens is grond of baggerspecie toe te passen als bedoeld in [artikel 39][ref1], uitgezonderd
      degene, bedoeld in het achtste lid, onder a en b;


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel39
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 42.11.b
    text: degene die baggerspecie verspreidt uit een watergang over de aan de watergang grenzende percelen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel42
  - number: '43.1'
    text: |-
      Voor het toepassen van baggerspecie, bedoeld in [artikel 35, onder g][ref1], kan de beheerder met betrekking tot
      de oppervlaktewaterlichamen onder zijn beheer verspreidingsvakken aanwijzen en vaststellen hoeveel baggerspecie er
      maximaal kan worden verspreid.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '43.2'
    text: |-
      Het is verboden om baggerspecie toe te passen buiten een krachtens het vorige lid aangewezen verspreidingsvak en
      boven de daarbij aangegeven maximale hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel43
  - number: '44.1'
    text: |-
      De gemeenteraad kan voor het toepassen van grond of baggerspecie als bedoeld in
      [artikel 35, onderdeel a tot en met e en h][ref1] op of in de bodem, uitgezonderd de bodem of oever van een
      oppervlaktewaterlichaam, voor een door hem aangewezen bodembeheergebied lokale maximale waarden vaststellen
      voor de bodem, waarop of waarin de grond of baggerspecie wordt toegepast, alsmede een percentage bodemvreemd
      materiaal dat afwijkt van het percentage, bedoeld in [artikel 34, tweede en derde lid][ref2] tot een maximum van
      20 gewichtsprocenten.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel34
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '44.2'
    text: |-
      De lokale maximale waarden kunnen boven de maximale waarden voor de bodemfunctieklasse industrie, bedoeld in
      [artikel 55, tweede lid][ref1], worden vastgesteld en het afwijkende percentage bodemvreemd materiaal kan worden
      vastgesteld, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel55
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: 44.2.a
    text: |-
      de kwaliteit van de bodem wordt bepaald door stoffen die verspreid in dat bodembeheergebied voorkomen als gevolg
      van diffuse verontreiniging;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel44
  - number: 44.2.b
    text: die waarden en dat percentage overeenkomen met de kwaliteit van de bodem in het bodembeheergebied; en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel44
  - number: 44.2.c
    text: |-
      die waarden niet de waarden overschrijden die worden vastgesteld op grond van de beoordelingssystematiek
      die wordt gehanteerd voor het vaststellen van de noodzaak van een spoedige sanering als bedoeld in
      [artikel 37, eerste lid, van de Wet bodembescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel37
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '37'
  - number: '45.1'
    text: |-
      Onze Minister van Verkeer en Waterstaat of het algemeen bestuur van het waterschap kan met betrekking
      tot rijkswateren, onderscheidenlijk regionale wateren voor het toepassen van grond of baggerspecie in
      een oppervlaktewaterlichaam als bedoeld in [artikel 35, onderdeel a, c tot en met e en h][ref1] voor een
      door hem aangewezen bodembeheergebied lokale maximale waarden vaststellen voor de bodem of oever van een
      oppervlaktewaterlichaam, waarop of waarin de grond of baggerspecie wordt toegepast, alsmede een percentage
      bodemvreemd materiaal dat afwijkt van het percentage, bedoeld in [artikel 34, tweede en derde lid][ref2], tot een
      maximum van 20 gewichtsprocenten.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel34
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '45.2'
    text: |-
      De lokale maximale waarden kunnen voor het toepassen van baggerspecie boven de interventiewaarden en voor het
      toepassen van grond niet boven de maximale waarden voor de bodemfunctieklasse industrie worden vastgesteld en het
      afwijkende percentage bodemvreemd materiaal kan worden vastgesteld, indien is voldaan aan de voorwaarden, bedoeld
      in [artikel 44, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '46.1'
    text: |-
      Onze Minister van Verkeer en Waterstaat of het algemeen bestuur van het waterschap kan met betrekking tot
      rijkswateren, onderscheidenlijk regionale wateren voor toepassingen als bedoeld in [artikel 35, onderdeel g][ref1],
      voor een door hem aangewezen bodembeheergebied, maximale waarden vaststellen voor de kwaliteit van de toe te
      passen baggerspecie die afwijken van de waarden, die krachtens [artikel 60, eerste lid][ref2], voor die toepassing
      zijn vastgesteld, alsmede een percentage bodemvreemd materiaal dat afwijkt van het percentage, bedoeld in
      [artikel 34, tweede en derde lid][ref3], tot een maximum van 20 gewichtsprocenten.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel34
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '46.2'
    text: |-
      Bij regeling van Onze Ministers kan worden bepaald dat het bestuursorgaan, bedoeld in het eerste lid,
      voor daarbij aan te geven parameters geen hogere maximale waarden kan vaststellen dan de krachtens
      [artikel 60, eerste lid][ref1] vastgestelde waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel60
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '46.3'
    text: |-
      Voor toepassingen als bedoeld in het eerste lid in de Nederlandse territoriale zee kan het bestuursorgaan, bedoeld
      in het eerste lid, geen hogere maximale waarden vaststellen dan de krachtens [artikel 60, eerste lid][ref1],
      vastgestelde waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel60
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '47'
    text: |-
      Een besluit op grond van de [artikelen 44, eerste lid][ref1] en [45, eerste lid][ref2], bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel45
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 47.a
    text: |-
      een of meer kaarten, opgesteld overeenkomstig de bij regeling van Onze Ministers gestelde protocollen, waarop zijn
      aangegeven de begrenzing van het bodembeheergebied, de kwaliteit van de bodem en, bij toepassingen op of in de
      bodem, uitgezonderd de bodem of oever van een oppervlaktewaterlichaam, de bodemfuncties;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel47
  - number: 47.b
    text: |-
      de lokale maximale waarden, bedoeld in de [artikelen 44, eerste lid][ref1], en [45, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel45
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 47.c
    text: |-
      voor zover van toepassing, het gewichtspercentage bodemvreemd materiaal, bedoeld in
      [artikel 34, derde en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel34
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: 47.d
    text: |-
      een motivering van het besluit aan de hand van de lokale maximale waarden en, voor zover van toepassing, het
      gewichtspercentage bodemvreemd materiaal in relatie tot de kwaliteit van de bodem, de maatschappelijke noodzaak
      van die waarden en het gewichtspercentage bodemvreemd materiaal en een beschrijving van de overeenkomstig de bij
      regeling van Onze Ministers gestelde methoden bepaalde gevolgen van de uitvoering van het besluit voor de kwaliteit
      van de bodem in het bodembeheergebied.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel47
  - number: '48'
    text: |-
      Een besluit op grond van [artikel 46, eerste lid][ref1], bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel46
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 48.a
    text: een of meerdere kaarten waarop de begrenzing van dat bodembeheergebied is aangegeven;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel48
  - number: 48.b
    text: |-
      de maximale waarden en het percentage bodemvreemd materiaal, bedoeld in [artikel 46, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel46
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 48.c
    text: |-
      een motivering van het besluit aan de hand van de maximale waarden en het percentage bodemvreemd materiaal in
      relatie tot de gevolgen voor de kwaliteit van een oppervlaktewaterlichaam en de maatschappelijke noodzaak van die
      waarden.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel48
  - number: '49'
    text: |-
      Bij de voorbereiding van een besluit als bedoeld in de [artikelen 44][ref1], [45][ref2] en [46][ref3] wordt
      toepassing gegeven aan [afdeling 3.4 van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '50'
    text: |-
      Tegen een besluit als bedoeld in de [artikelen 44][ref1], [45][ref2] en [46][ref3] kan beroep worden ingesteld bij
      de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel46
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '51'
    text: |-
      Op een besluit tot wijziging van een besluit als bedoeld in de [artikelen 44][ref1], [45][ref2] en [46][ref3], zijn
      de [artikelen 47 tot en met 50][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0022929#Artikel47
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0022929
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '52.1'
    text: |-
      Bij toepassing in een bodembeheergebied overschrijdt de kwaliteit van de toe te passen grond of baggerspecie niet
      de lokale maximale waarden, bedoeld in de [artikelen 44][ref1] en [45][ref2], en de maximale waarden, bedoeld in
      [artikel 46][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel46
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '52.2'
    text: |-
      Grond of baggerspecie die voldoet aan de lokale maximale waarden, bedoeld in de [artikelen 44, tweede lid][ref1],
      en [45, tweede lid][ref2], kan uitsluitend worden toegepast in het bodembeheergebied waarvan deze afkomstig is.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel45
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '52.3'
    text: |-
      Indien de grond of baggerspecie, bedoeld in het eerste lid, de kwaliteit van de bodem, waarop of waarin de grond
      of baggerspecie wordt toegepast, overschrijdt, kan deze grond of baggerspecie alleen worden toegepast in het
      bodembeheergebied waarvan deze afkomstig is.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel52
  - number: '52.4'
    text: 'Het eerste tot en met derde lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel52
  - number: 52.4.a
    text: |-
      het toepassen van grond of baggerspecie door natuurlijke personen anders dan in de uitoefening van beroep of
      bedrijf;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel52
  - number: 52.4.b
    text: |-
      het toepassen van grond of baggerspecie binnen een landbouwbedrijf, indien de grond of baggerspecie afkomstig is
      van een tot dat landbouwbedrijf behorend perceel waarop een vergelijkbaar gewas wordt geteeld als op het perceel
      waar de grond of baggerspecie wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel52
  - number: '53'
    text: |-
      Het bestuursorgaan, bedoeld in de [artikelen 44 tot en met 46][ref1], overweegt ten minste eenmaal in de tien jaar
      in hoeverre een aldaar bedoeld besluit herziening behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '54'
    text: |-
      Deze paragraaf is uitsluitend van toepassing, indien geen besluit als bedoeld in de [artikelen 44][ref1],
      [45][ref2] of [46][ref3] is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel46
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '55.1'
    text: |-
      Burgemeester en wethouders leggen uiterlijk een half jaar na inwerkingtreding van dit besluit op een kaart de
      bodemfunctieklassen, zijnde industrie of wonen, van het gebied binnen hun gemeente, waarop of waarin de grond of
      baggerspecie zal worden toegepast, vast.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel55
  - number: '55.2'
    text: |-
      Bij regeling van Onze Ministers worden voor de bodemfunctieklassen, bedoeld in het eerste lid, maximale waarden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel55
  - number: '55.3'
    text: |-
      Bij regeling van Onze Ministers worden de eisen vastgesteld waaraan de kaart, bedoeld in het eerste lid, moet
      voldoen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel55
  - number: '55.4'
    text: |-
      Indien geen kaart is vastgesteld als bedoeld in het eerste lid, kan alleen grond of baggerspecie worden toegepast,
      die de achtergrondwaarden niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel55
  - number: '55.5'
    text: Dit artikel is niet van toepassing op het toepassen van grond of baggerspecie in een oppervlaktewaterlichaam.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel55
  - number: '56.1'
    text: |-
      Indien de kwaliteit van de bodem waarop of waarin de grond of baggerspecie wordt toegepast, voldoet aan de
      achtergrondwaarden, dan wel voor deze bodem niet de bodemfunctieklasse wonen of industrie geldt, is uitsluitend het
      toepassen van grond of baggerspecie toegestaan, waarvan de kwaliteit de achtergrondwaarden niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel56
  - number: '56.2'
    text: 'Het eerste lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel56
  - number: 56.2.a
    text: |-
      het toepassen van grond of baggerspecie door natuurlijke personen anders dan in de uitoefening van beroep of
      bedrijf;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel56
  - number: 56.2.b
    text: |-
      het toepassen van grond of baggerspecie binnen een landbouwbedrijf, indien de grond of baggerspecie afkomstig is
      van een tot dat landbouwbedrijf behorend perceel waarop een vergelijkbaar gewas wordt geteeld als op het perceel
      waar de grond of baggerspecie wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel56
  - number: 56.2.c
    text: |-
      het toepassen van baggerspecie, als bedoeld in [artikel 35, onder f en i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: 56.2.d
    text: |-
      het toepassen van baggerspecie in een oppervlaktewaterlichaam, als bedoeld in [artikel 35, onder g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '57.1'
    text: |-
      Bij regeling van Onze Ministers wordt de bodem ingedeeld in bodemkwaliteitsklassen en worden voor de
      bodemkwaliteitsklassen maximale waarden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel57
  - number: '57.2'
    text: Het bevoegd gezag kan de bodemkwaliteitsklassen, bedoeld in het eerste lid, vastleggen op een kaart.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel57
  - number: '58.1'
    text: |-
      Indien het bevoegd gezag de bodemkwaliteitsklasse niet heeft vastgelegd op een kaart, stelt degene die voornemens
      is grond of baggerspecie toe te passen de bodemkwaliteitsklasse vast op de bij regeling van Onze Ministers bepaalde
      wijze. Hierbij worden gegevens gebruikt die afkomstig zijn van een persoon of een instelling die beschikt over
      een erkenning.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel58
  - number: '58.2'
    text: 'Het eerste lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel58
  - number: 58.2.a
    text: natuurlijke personen anders dan in de uitoefening van beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel58
  - number: 58.2.b
    text: |-
      degene die voornemens is grond of baggerspecie toe te passen binnen een landbouwbedrijf, indien de grond of
      baggerspecie afkomstig is van een tot dat landbouwbedrijf behorend perceel waarop een vergelijkbaar gewas wordt
      geteeld als op het perceel waar de grond of baggerspecie wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel58
  - number: 58.2.c
    text: |-
      degene die voornemens is baggerspecie toe te passen, als bedoeld in [artikel 35, onder f, g en i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '58.3'
    text: |-
      Het eerste lid is niet van toepassing op het toepassen van grond of baggerspecie als bedoeld in
      [artikel 35, eerste lid, onder h][ref1], met een duur van korter dan 6 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '59.1'
    text: |-
      Voor het toepassen van grond of baggerspecie, bedoeld in [artikel 35, onder a tot en met e][ref1], op of in de
      bodem, uitgezonderd de bodem of oever van een oppervlaktewaterlichaam, overschrijdt de kwaliteit van de grond of
      baggerspecie niet:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: 59.1.a
    text: de maximale waarden voor de bodemfunctieklasse wonen of industrie; en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel59
  - number: 59.1.b
    text: de maximale waarden voor de bodemkwaliteitsklassen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel59
  - number: '59.2'
    text: |-
      Voor het op of in de bodem of oever van een oppervlaktewaterlichaam toepassen van grond of baggerspecie als bedoeld
      in [artikel 35, onder a en c tot en met e][ref1], en het op of in de bodem toepassen van grond en baggerspecie als
      bedoeld in [artikel 35, onder h][ref2], overschrijdt de kwaliteit van de grond of baggerspecie niet de waarden,
      bedoeld in het eerste lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '59.3'
    text: |-
      Onverminderd het bepaalde in het tweede lid, overschrijdt bij toepassing in een oppervlaktewaterlichaam de
      kwaliteit van de grond niet de maximale waarden voor de bodemfunctieklasse industrie.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel59
  - number: '60.1'
    text: |-
      Bij het toepassen van baggerspecie, bedoeld in [artikel 35, onder f, g en i][ref1], overschrijdt de kwaliteit van
      de baggerspecie de daarvoor bij regeling van Onze Ministers vastgestelde maximale waarden niet.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '60.2'
    text: |-
      Voor toepassing van het eerste lid worden erven en gronden die door een weg, voetpad of andere constructie of door
      een te smalle grondstrook om de baggerspecie te ontvangen van de watergang gescheiden zijn, als aan de watergang
      grenzend perceel aangemerkt.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel60
  - number: '61'
    text: |-
      Onze Ministers overwegen ten minste eenmaal in de tien jaar in hoeverre de waarden, bedoeld in de
      [artikelen 55, eerste lid][ref1], en [57, eerste lid][ref2], herziening behoeven en stellen de Staten-Generaal in
      kennis van hun bevindingen daaromtrent.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel57
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '62'
    text: |-
      Deze paragraaf is niet van toepassing op het toepassen van grond of baggerspecie in de Nederlandse territoriale
      zee.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel62
  - number: '63.1'
    text: |-
      Een toepassing van grond of baggerspecie als bedoeld in [artikel 35, onder a, c tot en met e][ref1], in een
      laagdikte van minimaal twee meter en een minimale omvang van 5000 m3 hoeft niet te voldoen aan de eisen die daaraan
      in [afdeling 2, paragraaf 1][ref2] en [2][ref3], worden gesteld, mits


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0022929
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: 63.1.a
    text: 'de kwaliteit van de grond of baggerspecie voldoet aan:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
  - number: 63.1.a.i
    text: de bij regeling van Onze Ministers vast te stellen maximale emissiewaarden, en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
  - number: 63.1.a.ii
    text: |-
      bij toepassing op of in de bodem, uitgezonderd de bodem of oever van een oppervlaktewaterlichaam, de maximale
      waarden voor de bodemfunctieklasse industrie, bedoeld in [artikel 55, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel55
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: 63.1.a.iii
    text: |-
      bij toepassing in een oppervlaktewaterlichaam, de maximale waarden voor de bodemfunctieklasse industrie, bedoeld in
      [artikel 55, tweede lid][ref1], onderscheidelijk de interventiewaarden, en


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel55
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: 63.1.b
    text: op de desbetreffende grond of baggerspecie een leeflaag of een laag bouwstoffen wordt aangebracht.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
  - number: '63.2'
    text: |-
      De kwaliteit van de grond of baggerspecie wordt, in afwijking van het bepaalde in het eerste lid, onderdeel a,
      onder i, niet getoetst aan de maximale emissiewaarden in de bij regeling van Onze Ministers te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
  - number: '63.3'
    text: |-
      De leeflaag, bedoeld in het eerste lid, onder b, heeft een minimale dikte van een halve meter. Bij regeling van
      Onze Ministers kunnen op grond van milieuhygiënische overwegingen nadere regels worden gesteld met betrekking tot
      de dikte van de leeflaag of de laag bouwstoffen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
  - number: '63.4'
    text: |-
      Op het aanbrengen van een leeflaag zijn de eisen die in [afdeling 2, paragraaf 1][ref1] en [2][ref2], aan het
      toepassen van grond of baggerspecie worden gesteld van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0022929
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '63.5'
    text: |-
      In afwijking van het eerste lid, aanhef, geldt voor de toepassingen, bedoeld in [artikel 35, onder a][ref1], een
      laagdikte van minimaal een halve meter, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: 63.5.a
    text: het de aanleg of het wijzigen van Rijkswegen, provinciale en gemeentelijke wegen en spoorwegen betreft; en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
  - number: 63.5.b
    text: |-
      op de desbetreffende grond of baggerspecie in afwijking van het eerste lid, onder b, een aaneengesloten laag
      bouwstoffen wordt aangebracht, met uitzondering van de bijbehorende bermen en taluds.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
  - number: '63.6'
    text: |-
      In het geval, bedoeld in het vijfde lid, voldoet de kwaliteit van de grond of baggerspecie in de bermen of taluds
      van Rijkswegen, provinciale wegen of spoorwegen tot aan een fysieke afscheiding met een maximum van 10 meter vanaf
      de rand van de verharding of het ballastbed, aan de maximale waarden van de bodemfunctieklasse industrie.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel63
  - number: '64.1'
    text: |-
      Bij regeling van Onze Ministers kunnen aan de toepassing van grond of baggerspecie, bedoeld in
      [artikel 63, eerste en vijfde lid][ref1], nadere regels worden gesteld ter bescherming van de kwaliteit van de
      omliggende bodem, het grondwater of oppervlaktewaterlichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel63
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
  - number: '64.2'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld met betrekking tot beheersmaatregelen met het oog op
      de instandhouding van de toepassing, bedoeld in [artikel 63, eerste en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel63
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
  - number: '65.1'
    text: |-
      Het [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1] wordt ingetrokken, met dien verstande
      dat de intrekking voor gedeelten van dat besluit op verschillende tijdstippen kan geschieden welke tijstippen
      nader worden bepaald in het besluit tot inwerkingtreding van het besluit bodemkwaliteit als bedoeld in
      [artikel 83, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007667
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel83
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0007667
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '83'
        hoofdstuk: '5'
  - number: '65.2'
    text: |-
      Het [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1] blijft van toepassing op een aanvraag als
      bedoeld in [artikel 12, tweede lid, van de Tijdelijke Stimuleringsregeling verwerking baggerspecie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007667
      [ref2]: https://wetten.overheid.nl/BWBR0013877#Artikel12
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0007667
      - id: ref2
        bwb_id: BWBR0013877
        artikel: '12'
  - number: '66.1'
    text: |-
      Het [Besluit uitvoeringskwaliteit bodembeheer][ref1] wordt ingetrokken, met uitzondering van [artikel 21][ref2],
      met dien verstande dat in [dat artikel][ref3] in plaats van [Besluit uitvoeringskwaliteit bodembeheer][ref4], wordt
      gelezen: Besluit bodemkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0019963
      [ref2]: https://wetten.overheid.nl/BWBR0019963#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0019963#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0019963
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019963
      - id: ref2
        bwb_id: BWBR0019963
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0019963
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0019963
  - number: '66.2'
    text: |-
      [Hoofdstuk 2][ref1] van dit besluit is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0022929
        hoofdstuk: '2'
  - number: 66.2.a
    text: |-
      een werkzaamheid die voor inwerkingtreding van het [Besluit uitvoeringskwaliteit bodembeheer][ref1] is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0019963
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019963
  - number: 66.2.b
    text: |-
      een werkzaamheid die wordt verricht ter uitvoering van een wettelijke taak door of in opdracht van een
      bestuursorgaan, of
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel66
  - number: 66.2.c
    text: de opsporing en vervolging van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel66
  - number: '75'
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van [artikel 65][ref1] blijft van toepassing op het
      houden van bouwstoffen, waaronder grond en baggerspecie, in een werk, indien de bouwstoffen voor dat tijdstip in
      het betreffende werk waren toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel65
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '65'
        hoofdstuk: '5'
  - number: '76'
    text: |-
      De [Vrijstellingsregeling grondverzet][ref1] blijft van toepassing indien voor het tijdstip van inwerkingtreding
      van dit besluit voor het gebied waarop of waarin de grond wordt gebruikt een bodemkwaliteitskaart is vastgesteld
      krachtens [die regeling][ref2], voor de duur waarvoor de bodemkwaliteitskaart geldt met een maximum van vijf jaar
      na het tijdstip van inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010715
      [ref2]: https://wetten.overheid.nl/BWBR0010715
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0010715
      - id: ref2
        bwb_id: BWBR0010715
  - number: '77'
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van [artikel 65][ref1] blijft
      voor partijkeuringen, erkende kwaliteitsverklaringen en andere bewijsmiddelen, die krachtens het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref2], zoals dat gold op het tijdstip van
      inwerkingtreding, zijn afgegeven, van toepassing voor de duur van de desbetreffende verklaring, maar ten hoogste
      voor drie jaar na de inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '65'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0007667
  - number: '78'
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van [artikel 65][ref1]
      blijft voor maximaal drie jaar na dat tijdstip van toepassing, indien voor dat tijdstip
      een melding krachtens [artikel 11, eerste lid][ref2], [18, tweede lid][ref3], of
      [21, tweede lid, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref4] is gedaan en binnen een
      half jaar na dat tijdstip is begonnen met de toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007667#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0007667#Artikel21
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '65'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0007667
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0007667
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0007667
        artikel: '21'
  - number: '79.1'
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van [artikel 65][ref1]
      blijft geldig, indien voor dat tijdstip, dan wel uiterlijk een half jaar na dat tijdstip een
      vergunning is verleend krachtens [artikel 8.1, eerste lid, van de Wet milieubeheer][ref2] of
      [artikel 1, eerste of derde lid, van de Wet verontreiniging oppervlaktewateren][ref3], voor de duur van de
      vergunning maar ten hoogste voor drie jaar na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '65'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002682
        artikel: '1'
  - number: '79.2'
    text: |-
      Voorzover een vergunning op grond van
      [artikel 1, eerste of derde lid, van de Wet verontreiniging oppervlaktewateren][ref1] betrekking heeft op een
      handeling als bedoeld in [artikel 35, onder g][ref2], vervalt het desbetreffende deel van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '79.3'
    text: |-
      In afwijking van het tweede lid vervallen de voorschriften van een vergunning waarbij verspreidingsvakken worden
      aangewezen een half jaar na de datum van inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel79
  - number: '82'
    text: |-
      Onze Ministers zenden binnen drie jaar na inwerkingtreding van dit besluit aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van dit besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel82
  - number: 82a
    text: |-
      Dit besluit berust mede op [artikel 9.2.2.1 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
