        bwb_id: BWBR0022929
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '5.1'
    text: 'Dit besluit is van toepassing op het toepassen van bouwstoffen, grond of baggerspecie, voor zover:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel5
  - number: 5.1.a
    text: |-
      geen grotere hoeveelheid van die bouwstoffen, grond of baggerspecie wordt toegepast dan volgens gangbare maatstaven
      nodig is voor het functioneren van de toepassing,
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel5
  - number: 5.1.b
    text: |-
      de toepassing volgens gangbare maatstaven nodig is op de plaats waar deze plaatsvindt, of onder de omstandigheden
      waarin deze plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel5
  - number: 5.1.c
    text: |-
      ingeval van het toepassen van afvalstoffen sprake is van nuttige toepassing in de zin van
      [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '5.2'
    text: |-
      Het verbod, bedoeld in [artikel 6.2, eerste lid, van de Waterwet][ref1], geldt niet voor toepassingen van
      bouwstoffen, grond of baggerspecie in een oppervlaktewaterlichaam die voldoen aan het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '5.3'
    text: |-
      Een toepassing in de zin van [hoofdstuk 3][ref1] en [4][ref2] waarbij wordt
      afgeweken van de bepalingen in dit besluit is vergunningplichtig als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref3]. In afwijking van
      de [artikelen 2][ref4] en [3][ref5] is Onze Minister het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0022929#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0022929#Artikel3
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022929
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0022929
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0022929
        artikel: '2'
        hoofdstuk: '1'
      - id: ref5
        bwb_id: BWBR0022929
        artikel: '3'
        hoofdstuk: '1'
  - number: '6'
    text: |-
      Het stellen van regels als bedoeld in de [artikelen 28, eerste lid, onder b][ref1],
      [30, eerste en tweede lid][ref2], en [31, tweede lid][ref3], en het toetsen aan de maximale waarden,
      bedoeld in de [artikelen 44, eerste lid][ref4], [45, eerste lid][ref5], [46][ref6], [55, tweede lid][ref7],
      [57, eerste lid][ref8], [60, eerste lid][ref9] en [63, eerste lid, onderdeel a, onder i][ref10], geschiedt met
      inachtneming van de voorwaarde dat toepassingen van bouwstoffen, grond of baggerspecie voldoen aan de voorwaarden,
      bedoeld in artikel 13 van de kaderrichtlijn afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0022929#Artikel45
      [ref6]: https://wetten.overheid.nl/BWBR0022929#Artikel46
      [ref7]: https://wetten.overheid.nl/BWBR0022929#Artikel55
      [ref8]: https://wetten.overheid.nl/BWBR0022929#Artikel57
      [ref9]: https://wetten.overheid.nl/BWBR0022929#Artikel60
      [ref10]: https://wetten.overheid.nl/BWBR0022929#Artikel63
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel6
    references:
      - id: ref1
