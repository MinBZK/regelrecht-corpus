        bwb_id: BWBR0003994
        artikel: '70'
      - id: ref9
        bwb_id: BWBR0003994
        artikel: '72'
  - number: '23.1'
    text: 'Onze Ministers kunnen een erkenning geheel of gedeeltelijk intrekken:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
  - number: 23.1.a
    text: op verzoek van de erkende persoon of instelling;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
  - number: 23.1.b
    text: |-
      indien bij de aanvraag onjuiste of onvolledige gegevens zijn verstrekt, en kennis omtrent de juiste en volledige
      gegevens tot een andere beslissing zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
  - number: 23.1.c
    text: |-
      indien het bewijs van certificatie of accreditatie voor de desbetreffende werkzaamheid is ingetrokken of niet meer
      geldig is;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
  - number: 23.1.d
    text: |-
      indien de erkende persoon of instelling in staat van faillissement verkeert of surseance van betaling heeft
      verkregen, of
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
  - number: 23.1.e
    text: |-
      indien de erkende persoon of instelling of de natuurlijk persoon, bedoeld in [artikel 9, tweede lid][ref1],
      een wettelijk voorschrift heeft overtreden dat is gesteld bij of krachtens dit besluit, bij of krachtens de in
      [artikel 21][ref2] of [22][ref3] genoemde wetten of [artikel 225 van het Wetboek van Strafrecht][ref4], voor zover
      de overtreding verband houdt met een werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '22'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '225'
  - number: '23.2'
    text: |-
      Onze Ministers kunnen een erkenning voor een periode van ten hoogste twee jaren, geheel of gedeeltelijk schorsen,
      indien:
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
  - number: 23.2.a
    text: het bewijs van certificatie of accreditatie voor de desbetreffende werkzaamheid is geschorst, of
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
  - number: 23.2.b
    text: sprake is van een overtreding als bedoeld in het eerste lid, onder e.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Ministers kunnen een erkenning intrekken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '23.4'
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '23.5'
    text: |-
      Indien een besluit tot intrekking of schorsing betrekking heeft op een certificeringsinstelling blijven de door
      deze instelling afgegeven certificaten gedurende zes maanden geldig.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
  - number: '23.6'
    text: |-
      Ingeval van aanwijzingen dat er sprake is van een overtreding als bedoeld in het eerste lid, onderdeel e, kunnen
      Onze Ministers de desbetreffende persoon of instelling verzoeken binnen een redelijke termijn een verklaring
      omtrent het gedrag als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] over te
      leggen, die niet ouder is dan twee maanden. Indien de desbetreffende persoon of instelling niet binnen de gestelde
      termijn aan dit verzoek voldoet of kan voldoen, kunnen Onze Ministers de erkenning voor een periode van ten hoogste
      twee jaren geheel of gedeeltelijk schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '24'
    text: |-
      Onze Ministers verwerken de schorsing en intrekking van de erkenning in de lijsten, bedoeld in
      [artikel 9, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '25.1'
    text: 'Onze Ministers kunnen normdocumenten aanwijzen voorzover deze:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel25
  - number: 25.1.a
    text: niet in strijd zijn met een wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel25
  - number: 25.1.b
    text: zijn vastgesteld door organen waarin alle betrokken partijen zich konden laten vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel25
  - number: 25.1.c
    text: zowel qua inhoud als qua strekking voldoende duidelijk zijn, en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel25
  - number: 25.1.d
    text: voldoende draagvlak hebben bij de betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel25
  - number: '25.2'
    text: |-
      Met de normdocumenten worden gelijkgesteld documenten die zijn vastgesteld in een andere lidstaat van de
      Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe
      strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het beschermingsniveau dat met de normdocumenten wordt geboden.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel25
  - number: '26.1'
    text: |-
      Onze Ministers stellen regels met betrekking tot de wijze waarop het percentage van de totaalgehalten aan silicium,
      calcium of aluminium in een materiaal wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel26
  - number: '26.2'
    text: |-
      Onze Ministers stellen regels met betrekking tot de wijze waarop het volume per kleinste eenheid van een materiaal,
      alsmede de duurzame vormvastheid daarvan, wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel26
  - number: '26.3'
    text: |-
      Voor de toepassing van dit besluit wordt onder bouwstof mede verstaan, een bouwstof die is vermengd met ten hoogste
      20 gewichtsprocenten grond of baggerspecie, voor zover deze grond of baggerspecie daar geen functioneel onderdeel
      van uitmaakt.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel26
  - number: '27.1'
    text: 'Dit hoofdstuk is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel27
  - number: 27.1.a
    text: |-
      bouwstoffen die binnen een gebouw als bedoeld in [artikel 1, eerste lid, van de Woningwet][ref1] worden toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 27.1.b
    text: |-
      bouwstoffen die vallen onder een douaneregeling en bestemd zijn voor douanevervoer, plaatsing in douane-entrepot
      of voor tijdelijke invoer als bedoeld in artikel 4, onderdeel 16, van [verordening (EEG) nr. 2913/92](31992R2913)
      van de Raad van de Europese Gemeenschappen van 12 oktober 1992, tot vaststelling van het communautair douanewetboek
      (PbEG L 302).
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel27
  - number: '27.2'
    text: |-
      Het tijdelijk verplaatsen of uit een werk wegnemen van bouwstoffen is toegestaan zonder inachtneming van de
      [artikelen 28 tot en met 32][ref1], indien deze vervolgens, zonder te zijn bewerkt, op of nabij dezelfde plaats en
      onder dezelfde condities opnieuw in dat werk worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel28
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '28'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '28.1'
    text: |-
      Het vervaardigen, invoeren, voor toepassing in Nederland of voor handelsdoeleinden voor de Nederlandse markt
      voorhanden hebben, vervoeren, aan een ander ter beschikking stellen of toepassen van bouwstoffen is verboden,
      tenzij:
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel28
  - number: 28.1.a
    text: |-
      de samenstellings- en emissiewaarden van de bouwstof zijn bepaald aan de hand van de parameters, die in
      [bijlage 1][ref1] van dit besluit zijn vermeld en bij regeling van Onze Ministers zijn aangewezen, overeenkomstig
      de bij regeling van Onze Ministers gestelde methoden door of onder toezicht van een persoon of instelling die
      daartoe beschikt over een erkenning;


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 28.1.b
    text: |-
      een bij regeling van Onze Ministers aangewezen persoon of instelling op een bij regeling van Onze Ministers
      voorgeschreven wijze heeft vastgesteld dat de waarden, bedoeld onder a, de bij regeling van Onze Ministers
      vastgestelde maximale samenstellings- en emissiewaarden niet overschrijden;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel28
  - number: 28.1.c
    text: |-
      uit een milieuhygiënische verklaring, die is afgegeven onder bij regeling van Onze Ministers vastgestelde
      voorwaarden, blijkt dat wordt voldaan aan het bepaalde in onderdeel a en b; en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel28
  - number: 28.1.d
    text: |-
      een afleveringsbon bij de desbetreffende partij aanwezig is die de bij regeling van Onze Ministers vastgestelde
      gegevens bevat.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel28
  - number: '28.2'
    text: |-
      Bij regeling van Onze Ministers wordt bepaald in welke gevallen een afleveringsbon als bedoeld in het eerste lid,
      onder d niet vereist is.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel28
  - number: '28.3'
    text: |-
      Degene die de bouwstoffen toepast bewaart de bijbehorende milieuhygiënische verklaring en de afleveringsbon
      gedurende vijf jaar na het tijdstip waarop de bouwstoffen zijn toegepast en verstrekt die verklaring of
      afleveringsbon op verzoek van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel28
  - number: '28.4'
    text: |-
      Bij regeling van Onze Ministers worden regels gesteld met betrekking tot het samenvoegen en splitsen van partijen
      bouwstof.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel28
  - number: '28.5'
    text: |-
      Het is verboden om bouwstoffen toe te passen in strijd met de [artikelen 5, eerste lid][ref1] en [7][ref2] van
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel7
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '7'
        hoofdstuk: '1'
  - number: '29.1'
    text: |-
      In afwijking van [artikel 28, eerste lid, onder a en c][ref1], worden de samenstellings- en emissiewaarden van
      de toe te passen bouwstof niet bepaald en is geen milieuhygiënische verklaring vereist, indien sprake is van de
      volgende handelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel28
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '28'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 29.1.a
    text: het toepassen van metselmortel of natuursteenproducten, met uitzondering van breuksteen en steenslag;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel29
  - number: 29.1.b
    text: |-
      het zonder bewerking opnieuw onder dezelfde condities toepassen van vormgegeven bouwstoffen van beton, keramiek,
      natuursteen en bakstenen;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel29
  - number: 29.1.c
    text: |-
      het zonder bewerking opnieuw onder dezelfde condities toepassen van bouwstoffen, waarvan de eigendom niet wordt
      overgedragen;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel29
  - number: 29.1.d
    text: |-
      het opnieuw toepassen van niet teerhoudend asfalt of asfaltbeton in wegverhardingen indien overeenkomstig de CROW-
      publicatie, 210 «Richtlijn omgaan met vrijkomend asfalt» wordt aangetoond dat het materiaal niet teerhoudend is;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel29
  - number: 29.1.e
    text: het toepassen van bouwstoffen door natuurlijke personen anders dan in de uitoefening van beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel29
  - number: '29.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing, indien degene die de bouwstof toepast op grond van
      kennis of organoleptische waarneming kan aannemen of redelijkerwijs had moeten aannemen dat niet is voldaan aan
      [artikel 28, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel28
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '28'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '30.1'
    text: |-
      Een bouwstof die de maximale emissiewaarden, bedoeld in [artikel 28, eerste lid, onder b][ref1] overschrijdt, kan
      als IBC-bouwstof worden toegepast, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel28
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '28'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 30.1.a
    text: de bouwstof voldoet aan de bij regeling van Onze Ministers gesteld maximale emissiewaarden voor IBC-bouwstoffen;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel30
  - number: 30.1.b
    text: |-
      de bouwstof ten minste het bij regeling van Onze Ministers bepaalde volume heeft en aaneengesloten in een werk
      wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel30
  - number: 30.1.c
    text: |-
      isolatie-, beheers- en controlemaatregelen worden getroffen, die voldoen aan de daarvoor bij regeling van Onze
      Ministers gestelde eisen en die zijn goedgekeurd door een bij regeling van Onze Ministers aangewezen persoon of
      instelling.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel30
  - number: '30.2'
    text: Het is verboden IBC-bouwstoffen in een oppervlaktewaterlichaam toe te passen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel30
  - number: '31.1'
    text: |-
      Onze Minister kan op aanvraag ontheffing verlenen van de eis, gesteld in [artikel 30, eerste lid, onder c][ref1],
      voor zover anders dan door toepassing van die regel ten minste dezelfde mate van bescherming van de bodem wordt
      geboden, als is beoogd met de betrokken eis.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel30
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '30'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '31.2'
    text: 'Bij regeling van Onze Minister worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel31
  - number: 31.2.a
    text: de beoordeling van de gelijkwaardigheid; en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel31
  - number: 31.2.b
    text: |-
      de bij de aanvraag te verstrekken gegevens, waaruit onder meer blijkt dat sprake is van bescherming als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel31
  - number: '31.3'
    text: Een aanvraag wordt, door middel van een door Onze Minister vastgesteld formulier, ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel31
  - number: '32.1'
    text: |-
      Degene die voornemens is een bouwstof toe te passen als bedoeld in [artikel 29, eerste lid, onder c][ref1], meldt
      dit voornemen ten minste vijf werkdagen voor het toepassen aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel29
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '29'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '32.2'
    text: |-
      Degene die voornemens is een IBC-bouwstof toe te passen als bedoeld in [artikel 30][ref1] meldt dat voornemen
      tenminste vier weken voor het toepassen aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel30
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '30'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '32.3'
    text: |-
      Bij een melding als bedoeld in het eerste en tweede lid, worden ten minste de volgende gegevens verstrekt: a. de
      naam en het adres van de toepasser; b. de datum waarop de toepassing zal plaatsvinden; c. de toepassingslocatie ;
      d. de beoogde toepassing; e. het soort en de hoeveelheid toe te passen bouwstof. Bij een melding als bedoeld in
      het eerste lid wordt voorts vermeld: f. het werk, en g. de plaats van herkomst van de toe te passen bouwstof. Bij
      een melding als bedoeld in het tweede lid worden voorts verstrekt: h. een milieuhygiënische verklaring; en i. de
      beschrijving van de isolatie, controle- en beheersmaatregelen, alsmede de vermelding van de persoon of instelling
      die deze maatregelen heeft goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel32
  - number: '32.4'
    text: Onze Ministers kunnen nadere regels stellen met betrekking tot de in het derde lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel32
  - number: '32.5'
    text: |-
      Indien bij een voorgenomen toepassing van een IBC-bouwstof de milieuhygiënische verklaring nog niet beschikbaar
      is op het tijdstip waarop de melding wordt gedaan, wordt deze uiterlijk vijf werkdagen voor de toepassing van de
      desbetreffende IBC-bouwstof aan Onze Minister verstrekt.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel32
  - number: '32.6'
    text: |-
      De melding wordt elektronisch of schriftelijk gedaan door middel van een formulier waarvan het model door Onze
      Ministers wordt vastgesteld. Onze Ministers kunnen nadere regels stellen met betrekking tot de wijze waarop moet
      worden gemeld.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel32
  - number: '32.7'
    text: Onze Minister zendt onverwijld de melding met de bijbehorende gegevens elektronisch door aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel32
  - number: '33'
    text: 'Degene die een bouwstof toepast, draagt er zorg voor dat die bouwstof:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33
  - number: 33.a
    text: niet met de bodem wordt vermengd;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33
  - number: 33.b
    text: kan worden verwijderd; en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33
  - number: 33.c
    text: |-
      wordt verwijderd in geval het werk of het deel van het werk waarvan de bouwstof deel uitmaakt niet meer als
      functionele toepassing kan worden beschouwd, tenzij het verwijderen leidt tot een grotere aantasting van de bodem
      of een oppervlaktewaterlichaam dan het niet verwijderen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33
  - number: 33a
    text: |-
      Voor de toepassing van deze paragraaf wordt met mijnsteen gelijkgesteld mijnsteen die vermengd is met ten hoogste
      80 gewichtsprocenten grond of baggerspecie.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33a
  - number: 33b
    text: |-
      Op mijnsteen die gebruikt wordt in de toepassingen, bedoeld in [artikel 35, onderdelen a, b, d, e en h][ref1],
      is [hoofdstuk 4, afdeling 1][ref2], en [afdeling 2, paragraaf 1][ref3], met uitzondering van
      [artikel 44, tweede lid][ref4], en a[rtikel 45, tweede lid][ref5], van overeenkomstige toepassing, met dien
      verstande dat voor mijnsteen tevens wordt voldaan aan deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0022929#Artikel45
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0022929
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0022929
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 33c.1
    text: 'Onze Minister wijst de volgende gebieden in de provincie Limburg aan:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33c
  - number: 33c.1.a
    text: herkomstgebieden, waaruit toe te passen mijnsteen afkomstig is,
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33c
  - number: 33c.1.b
    text: toepassingsgebieden voor die mijnsteen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33c
  - number: 33c.2
    text: De toepassingsgebieden zijn geheel gelegen binnen de herkomstgebieden.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33c
  - number: 33c.3
    text: |-
      Uitsluitend mijnsteen die afkomstig is uit een aangewezen herkomstgebied kan overeenkomstig deze afdeling worden
      toegepast in een aangewezen toepassingsgebied.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33c
  - number: 33d
    text: |-
      Onze Minister stelt nadere regels aan het gebruik van de milieuhygiënische verklaring, bedoeld in
      [artikel 38][ref1], bij de toepassing van mijnsteen.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel38
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: '34.1'
    text: |-
      Bij regeling van Onze Ministers wordt de wijze bepaald waarop wordt vastgesteld of een materiaal aan te merken is
      als grond of baggerspecie.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel34
  - number: '34.2'
    text: |-
      Voor de toepassing van dit besluit wordt onder grond of baggerspecie mede verstaan, grond of baggerspecie die is
      vermengd met ten hoogste 20 gewichtsprocenten bodemvreemd materiaal.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel34
  - number: '34.3'
    text: |-
      Op grond van milieuhygiënische overwegingen kunnen onze Ministers voor een toepassing van grond of baggerspecie
      een lager gewichtspercentage bodemvreemd materiaal vaststellen dan genoemd in het tweede lid en hierover en over
      soorten toegestaan bodemvreemd materiaal nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel34
  - number: '35'
    text: 'Dit hoofdstuk is van toepassing op de volgende handelingen:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel35
  - number: 35.a
    text: |-
      toepassing van grond of baggerspecie in bouw- en weg constructies, waaronder mede worden begrepen wegen, spoorwegen
      en geluidswallen;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel35
  - number: 35.b
    text: |-
      toepassing van grond of baggerspecie op of in de bodem, met uitzondering van de bodem of oever van een
      oppervlaktewaterlichaam, in ophogingen van industrieterreinen, woningbouwlocaties en landbouw- en natuurgronden,
      met het oog op het verbeteren van de bodemgesteldheid;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel35
  - number: 35.c
    text: |-
      toepassing van grond of baggerspecie voor het afdekken van een locatie die wordt gesaneerd als bedoeld in
      [hoofdstuk IV, paragraaf 3 van de Wet bodembescherming][ref1], als afdeklaag voor een stortplaats als bedoeld in
      [artikel 8.47, eerste lid respectievelijk derde lid, van de Wet milieubeheer][ref2], of als afdeklaag voor een
      voormalige stortplaats met het oog op het voorkomen van nadelige gevolgen voor de functionele eigenschappen die de
      bodem voor mens, plant of dier heeft als gevolg van contact met het onderliggende materiaal;


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003994
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 35.d
    text: |-
      toepassing van grond of baggerspecie in ophogingen in waterbouwkundige constructies en voor het verondiepen en
      dempen van een oppervlaktewaterlichaam met het oog op de hoogwaterbescherming, de doelstellingen van artikel
      4 van de Kaderrichtlijn water, de bevordering van de natuurwaarden en de vlotte en veilige afwikkeling van de
      scheepvaart;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel35
  - number: 35.e
    text: |-
      toepassing van grond of baggerspecie in aanvullingen, waaronder mede wordt verstaan de herinrichting en
      stabilisering van voormalige winplaatsen voor delfstoffen, of met het oog op onderhoud en herstel van de
      toepassingen, bedoeld in onderdeel a tot en met d;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel35
  - number: 35.f
    text: |-
      verspreiding van baggerspecie uit een watergang over de aan de watergang grenzende percelen, met het oog op het
      herstellen of verbeteren van de aan de watergang grenzende percelen;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel35
  - number: 35.g
    text: |-
      verspreiding van baggerspecie in een oppervlaktewaterlichaam, met het oog op de duurzame vervulling van de
      ecologische en morfologische functies van het sediment, behoudens op of in uiterwaarden, gorzen, slikken, stranden
      en platen, met uitzondering van de daarbinnen gelegen aangrenzende percelen van watergangen met het oog op het
      herstellen of verbeteren van die percelen;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel35
  - number: 35.h
    text: |-
      tijdelijke opslag van grond of baggerspecie, bestemd voor de toepassingen, bedoeld in onderdeel a tot
      en met e gedurende maximaal drie jaar op of in de bodem, met uitzondering van de bodem of oever van een
      oppervlaktewaterlichaam, of gedurende maximaal tien jaar in een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel35
  - number: 35.i
    text: |-
      tijdelijke opslag van baggerspecie, bestemd voor één van de toepassingen, bedoeld in onderdeel a tot en met f,
      gedurende maximaal drie jaar op percelen gelegen naast de watergang waaruit de baggerspecie afkomstig is.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel35
  - number: '36.1'
    text: Het is verboden grond of baggerspecie die gevaarlijke afvalstoffen zijn toe te passen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel36
  - number: '36.2'
    text: 'Dit hoofdstuk is niet van toepassing op de volgende handelingen:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel36
  - number: 36.2.a
    text: |-
      het toepassen van grond of baggerspecie waarvan de samenstelling de interventiewaarde overschrijdt, tenzij
      [artikel 44, tweede lid][ref1], of [artikel 45, tweede lid][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel45
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 36.2.b
    text: |-
      het op of in de bodem brengen van producten die overeenkomstig de krachtens [artikel 4 van de Meststoffenwet][ref1]
      gestelde regels als meststof mogen worden verhandeld;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel4
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '4'
  - number: 36.2.c
    text: |-
      handelingen waarop het [Besluit uniforme saneringen][ref1] van toepassing is, tenzij bij of krachtens
      [dat besluit][ref2] anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0019511
      [ref2]: https://wetten.overheid.nl/BWBR0019511
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019511
      - id: ref2
        bwb_id: BWBR0019511
  - number: '36.3'
    text: |-
      Het tijdelijk verplaatsen of uit de toepassing wegnemen van grond of baggerspecie is toegestaan zonder
      inachtnemening van de [artikelen 38 tot en met 64][ref1], indien deze vervolgens, zonder te zijn bewerkt, op of
      nabij dezelfde plaats en onder dezelfde conditie opnieuw in die toepassing wordt aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel38
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: '37.1'
    text: |-
      Het is verboden om grond of baggerspecie toe te passen in strijd met de [artikelen 5, eerste lid][ref1],
      [7][ref2], [38][ref3], [42][ref4], [44][ref5], [45][ref6], [46][ref7], [52][ref8], [59][ref9], [60][ref10],
      [63][ref11] en [64][ref12] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0022929#Artikel42
