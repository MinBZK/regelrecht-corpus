  - number: '3.3'
    text: De beheerder is het bevoegd gezag voor degene die grond of baggerspecie toepast in een oppervlaktewaterlichaam.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister treft de noodzakelijke voorzieningen voor een doelmatig toezicht op de naleving van de bij of
      krachtens dit besluit gestelde verplichtingen, na afstemming met de bestuursorganen, bedoeld in het tweede tot
      en met derde lid, voorzover het daar andere bestuursorganen dan Onze Minister betreft. De voorzieningen hebben
      betrekking op de strategische, programmatische en onderling afgestemde uitoefening van de handhavingsbevoegdheden.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel4
  - number: '4.2'
    text: |-
      Ingeval van toepassingen van bouwstoffen, grond of baggerspecie op of in de bodem, uitgezonderd de bodem of oever
      van een oppervlaktewaterlichaam, binnen een of meer bodembeheergebieden, waarvoor meerdere bestuursorganen bevoegd
      gezag zijn, wordt door de desbetreffende bestuursorganen één bevoegd gezag aangewezen dat namens de betrokken
      bestuursorganen zorgdraagt voor een gecoördineerd toezicht op de naleving van de bij of krachtens dit besluit
      gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel4
  - number: '4.3'
    text: |-
      Burgemeester en wethouders hebben tot taak zorg te dragen voor de handhaving van de bij of krachtens dit besluit
      gestelde verplichtingen, voorzover zij betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel4
  - number: 4.3.a
    text: het toepassen van bouwstoffen op of in de bodem, uitgezonderd de bodem of oever van een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel4
  - number: 4.3.b
    text: |-
      het toepassen van grond of baggerspecie op of in de bodem, uitgezonderd de bodem of oever van een
      oppervlaktewaterlichaam, als bedoeld in [artikel 35][ref1];


