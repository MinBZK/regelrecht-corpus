      wordt toegepast binnen een inrichting die behoort tot een categorie van inrichtingen, die is
      aangewezen krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1], en op grond van
      [artikel 2.4 van de Wet algemene bepalingen omgevingsrecht][ref2] een ander orgaan dan burgemeester en wethouders
