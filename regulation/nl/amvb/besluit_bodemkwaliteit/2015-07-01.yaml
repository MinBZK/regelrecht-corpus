  - number: '7'
    text: |-
      Degene die bouwstoffen, grond of baggerspecie toepast en die weet of redelijkerwijs had kunnen weten dat door zijn
      handelen of nalaten nadelige gevolgen voor een oppervlaktewaterlichaam ontstaan of kunnen ontstaan, die niet of
      onvoldoende worden voorkomen of beperkt door naleving van de bij of krachtens dit besluit gestelde regels, voorkomt
      die gevolgen of beperkt die zoveel mogelijk voor zover voorkomen niet mogelijk is en voor zover dit redelijkerwijs
      van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel7
  - number: '8.1'
    text: |-
      Degene die ingevolge de bij of krachtens dit besluit gestelde regels onderzoek dient te verrichten op of in een
      gedeelte van de bodem ten aanzien waarvan hem de nodige bevoegdheid ontbreekt, kan bij het bevoegd gezag een
      aanvraag indienen als bedoeld in [artikel 71 van de Wet bodembescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel71
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '71'
  - number: '8.2'
    text: 'De aanvrager, bedoeld in het eerste lid, verstrekt bij het verzoek de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel8
  - number: 8.2.a
    text: zijn naam en adres;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel8
  - number: 8.2.b
    text: de naam en het adres van de rechthebbenden;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel8
  - number: 8.2.c
    text: de plaats waar het onderzoek zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel8
  - number: 8.2.d
    text: de aard, de omvang en het tijdstip van het voorgenomen onderzoek, en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel8
  - number: 8.2.e
    text: de handelingen die de rechthebbenden in het belang van het onderzoek moeten nalaten.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel8
  - number: '9.1'
    text: Onze Ministers kunnen op aanvraag voor een werkzaamheid een erkenning verlenen aan een persoon of een instelling.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel9
  - number: '9.2'
    text: |-
      De beschikking vermeldt ten minste de naam van de persoon of instelling, de werkzaamheid, de vestigingsplaats en,
      indien van toepassing, de naam van de natuurlijk persoon die werkzaam is voor de erkende persoon of instelling en
      die een van de bij regeling van Onze Ministers aangewezen handelingen uitvoert.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel9
  - number: '9.3'
    text: Een erkenning wordt voor onbepaalde tijd verleend.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel9
  - number: '9.4'
    text: |-
      Onze Ministers stellen lijsten met erkende personen en instellingen beschikbaar via een door hen aangewezen
      website. Het besluit tot aanwijzing van de website wordt in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel9
  - number: '9.5'
    text: Een erkenning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel9
  - number: '10.1'
    text: |-
      Een aanvraag voor een erkenning wordt door middel van een door Onze Ministers vastgesteld formulier, ingediend bij
      Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel10
  - number: '10.2'
    text: 'Bij de aanvraag worden ten minste de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel10
  - number: 10.2.a
    text: de naam en het adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel10
  - number: 10.2.b
    text: de werkzaamheid waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel10
  - number: 10.2.c
    text: het certificaat of de accreditatie voor de werkzaamheid;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel10
  - number: 10.2.d
    text: de vestigingsplaats van de persoon of instelling;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel10
  - number: 10.2.e
    text: |-
      indien van toepassing, de naam en een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], die niet ouder is dan zes maanden, van de
      natuurlijk persoon als bedoeld in [artikel 9, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '10.3'
    text: Onze Ministers kunnen nadere regels stellen met betrekking tot de in het tweede lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel10
  - number: '11.1'
    text: Onze Ministers beslissen binnen acht weken na de datum van ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel11
  - number: '11.2'
    text: 'Onze Ministers verlenen de erkenning geheel of gedeeltelijk, indien de desbetreffende persoon of instelling:'
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel11
  - number: 11.2.a
    text: niet in staat van faillissement of surseance van betaling verkeert; en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel11
  - number: 11.2.b
    text: |-
      heeft voldaan aan [artikel 10, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel10
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '11.3'
    text: |-
      Bij regeling van Onze Ministers wordt aangegeven of een erkenning voor een werkzaamheid wordt gebaseerd op een
      certificaat of een accreditatie.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel11
  - number: '11.4'
    text: |-
      Een erkenning kan geheel of gedeeltelijk worden geweigerd, indien de desbetreffende persoon of instelling of een
      bestuurder van deze persoon of instelling, in de drie jaren voorafgaande aan de aanvraag een wettelijk voorschrift
      heeft overtreden dat is gesteld bij of krachtens dit besluit, bij of krachtens één van de in [artikel 21][ref1] of
      [22][ref2] genoemde wetten of [artikel 225 van het Wetboek van Strafrecht][ref3], voor zover de overtreding verband
      houdt met een werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '22'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '225'
  - number: '11.5'
    text: |-
      Een erkenning kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '11.6'
    text: |-
      Voordat toepassing wordt gegeven aan het vijfde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '12.1'
    text: |-
      Op verzoek van de erkende persoon of instelling kan de erkenning worden gewijzigd. [Artikel 9, vierde lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '12.2'
    text: |-
      Het verzoek wordt, door middel van een door Onze Ministers vastgesteld formulier, ingediend bij Onze Ministers.
      [Artikel 10, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel10
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '12.3'
    text: |-
      Onze Ministers beslissen binnen vier weken na de datum van ontvangst van het verzoek.
      [Artikel 11, tweede en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel11
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '13.1'
    text: |-
      Met een verklaring omtrent het gedrag als bedoeld in [artikel 10, tweede lid, onder e][ref1], wordt gelijkgesteld
      een verklaring omtrent het gedrag afgegeven door een daartoe bevoegde instantie in een andere lidstaat van de
      Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe
      strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of documenten die
      een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de nationale
      onderzoekingen of documenten wordt geboden, mits die verklaring niet ouder is dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel10
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '13.2'
    text: |-
      Met een certificaat of accreditatie als bedoeld bij of krachtens dit besluit of in een normdocument wordt
      gelijkgesteld een certificaat of accreditatie afgegeven door een daartoe bevoegde instelling in een andere lidstaat
      van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een
      daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of documenten
      die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de nationale
      onderzoekingen of de normdocumenten wordt geboden.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel13
  - number: '13.3'
    text: |-
      Met een erkenning wordt gelijkgesteld een erkenning of een vergelijkbare beschikking afgegeven door een
      daartoe bevoegde instantie in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde een
      lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat
      Nederland bindt, op basis van voorwaarden die een beschermingsniveau bieden dat ten minste gelijkwaardig is
      aan het beschermingsniveau dat met de voorwaarden, genoemd in [artikel 10, tweede lid][ref1], wordt geboden. De
      [artikelen 9, vierde lid][ref2], en [24][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel24
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '24'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.1'
    text: Het is verboden een werkzaamheid uit te voeren zonder daartoe verleende erkenning.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel15
  - number: '15.2'
    text: |-
      De in [artikel 9, tweede lid][ref1], bedoelde handelingen kunnen slechts worden uitgevoerd door een natuurlijke
      persoon die staat vermeld op de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel9
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '15.3'
    text: |-
      Het bepaalde in het eerste en tweede lid geldt niet voorzover de werkzaamheid wordt uitgevoerd voor het verkrijgen
      van een certificaat of een accreditatie.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel15
  - number: '16'
    text: |-
      Het is een persoon of instelling verboden een resultaat van een werkzaamheid te gebruiken of aan een ander ter
      beschikking te stellen indien hij weet of redelijkerwijs had kunnen vermoeden dat dit resultaat, gelet op het
      doel waarvoor dit wordt gebruikt, geen betrouwbaar beeld verschaft van de eigenschappen, aard, hoedanigheid of
      samenstelling van de bodem, grond, baggerspecie of bouwstof.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel16
  - number: '17.1'
    text: |-
      Een bij regeling van Onze Ministers aangewezen instelling of persoon verricht niet een bij ministeriële regeling
      aangewezen handeling met betrekking tot bodem, grond, baggerspecie of bouwstof, waarop deze instelling of persoon
      een persoonlijk of zakelijk recht heeft.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel17
  - number: '17.2'
    text: |-
      Een bij regeling van Onze Ministers aangewezen instelling of persoon verricht niet een bij ministeriële regeling
      aangewezen handeling ten aanzien van een persoon, een stof, een bouwstof, een product, een installatie, een
      voorziening of ander object, waarmee deze instelling of persoon een organisatorische, financiële of juridische
      binding heeft, tenzij deze binding alleen voortvloeit uit de overeenkomst tot uitvoering van de werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel17
  - number: '17.3'
    text: |-
      Het eerste lid geldt niet voor degene die door middel van organisatorische maatregelen, op aantoonbare,
      transparante en controleerbare wijze, ervoor zorg heeft gedragen dat de werkzaamheid uitsluitend wordt verricht
      door een onderdeel van de organisatie dat of een persoon die:
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel17
  - number: 17.3.a
    text: geen financieel belang heeft bij de uitkomst van de werkzaamheid;
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel17
  - number: 17.3.b
    text: |-
      onder een andere bestuurlijke verantwoordelijkheid valt dan degene die een persoonlijk of zakelijk recht heeft op
      de bodem, grond, baggerspecie of bouwstof, en
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel17
  - number: 17.3.c
    text: |-
      onder de directe aansturing van een andere leidinggevende valt dan degene die een persoonlijk of zakelijk recht
      heeft op de bodem, grond, baggerspecie of bouwstof.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel17
  - number: '17.4'
    text: |-
      Indien een normdocument eisen bevat ten aanzien van organisatorische maatregelen als bedoeld in het derde lid
      voldoet de persoon of instelling die voor de desbetreffende werkzaamheid is erkend aan het derde lid, indien hij
      aan het normdocument voldoet.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel17
  - number: '18.1'
    text: Het is verboden een werkzaamheid uit te voeren in strijd met het daarvoor geldende normdocument.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel18
  - number: '18.2'
    text: |-
      Het in het eerste lid gestelde verbod geldt niet voor zover het afwijken van het normdocument bij wettelijk
      voorschrift is toegestaan.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel18
  - number: '19'
    text: |-
      De houder van een erkenning meldt onverwijld aan een door Onze Ministers aangewezen instantie zijn door de
      rechtbank uitgesproken faillissement of surseance van betaling. De melding geschiedt door middel van een door Onze
      Ministers vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel19
  - number: '20'
    text: |-
      Een certificeringsinstelling of de Raad voor Accreditatie meldt een schorsing of intrekking van een certificaat,
      onderscheidenlijk een accreditatie, voor een werkzaamheid onverwijld aan een door Onze Ministers aangewezen
      instantie. De melding geschiedt door middel van een door Onze Ministers vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel20
  - number: '21.1'
    text: |-
      Een bestuursorgaan neemt een aanvraag om een beschikking, die bij of krachtens wettelijke voorschriften wordt
      gegeven, niet in behandeling indien daarbij gegevens zijn gevoegd die afkomstig zijn van een persoon of instelling
      die voor het verkrijgen van deze gegevens in strijd heeft gehandeld met [artikel 15, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel15
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '21.2'
    text: |-
      De wettelijke voorschriften, bedoeld in het eerste lid, zijn de [artikelen 2.1, eerste lid, aanhef en onder e][ref1],
      en [2.6 van de Wet algemene bepalingen omgevingsrecht][ref2] en [8.49 van de Wet milieubeheer][ref3],
      en de [artikelen 29, eerste lid][ref4], en [39, tweede lid][ref5], [39b][ref6], [39c, tweede lid][ref7],
      [39d, derde lid][ref8], en [40, tweede lid, van de Wet bodembescherming][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0003994#Artikel39
      [ref6]: https://wetten.overheid.nl/BWBR0003994#Artikel39b
      [ref7]: https://wetten.overheid.nl/BWBR0003994#Artikel39c
      [ref8]: https://wetten.overheid.nl/BWBR0003994#Artikel39d
      [ref9]: https://wetten.overheid.nl/BWBR0003994#Artikel40
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0003994
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0003994
        artikel: '39'
      - id: ref6
        bwb_id: BWBR0003994
        artikel: 39b
      - id: ref7
        bwb_id: BWBR0003994
        artikel: 39c
      - id: ref8
        bwb_id: BWBR0003994
        artikel: 39d
      - id: ref9
        bwb_id: BWBR0003994
        artikel: '40'
  - number: '22.1'
    text: |-
      Het is een ieder verboden om, ter voldoening aan bij of krachtens wettelijke voorschriften, gegevens te verstrekken
      aan een bestuursorgaan, indien hij weet of redelijkerwijs had kunnen vermoeden dat deze gegevens afkomstig
      zijn van een persoon of instelling die voor het verkrijgen van deze gegevens in strijd heeft gehandeld met
      [artikel 15, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel15
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '22.2'
    text: |-
      De wettelijke voorschriften, bedoeld in het eerste lid, zijn de
      [artikelen 8.40, eerste lid, van de Wet milieubeheer][ref1], de [artikelen 6.6][ref2] en [6.7 van de Waterwet][ref3]
      en de [artikelen 6 tot en met 12][ref4], [27, eerste lid][ref5], [39, eerste en vierde lid][ref6],
      [39b, tweede lid, onderdelen b en c][ref7], [70][ref8] en [72 van de Wet bodembescherming][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0003994#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0003994#Artikel39
      [ref7]: https://wetten.overheid.nl/BWBR0003994#Artikel39b
      [ref8]: https://wetten.overheid.nl/BWBR0003994#Artikel70
      [ref9]: https://wetten.overheid.nl/BWBR0003994#Artikel72
    url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#Artikel22
