  - number: '2.2'
    text: |-
      Indien bouwstoffen worden toegepast op of in de bodem, uitgezonderd de bodem of oever van een
      oppervlaktewaterlichaam, binnen een inrichting die behoort tot een categorie van inrichtingen die
      is aangewezen krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1], en op grond van
      [artikel 2.4 van de Wet algemene bepalingen omgevingsrecht][ref2] een ander orgaan dan burgemeester en wethouders
      bevoegd is of indien de vergunningplicht niet was opgeheven, bevoegd zou zijn een vergunning voor de inrichting te
      verlenen, is ook in het kader van dit besluit dat andere orgaan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
