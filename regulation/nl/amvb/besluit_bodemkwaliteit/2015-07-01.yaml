preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 2 juli 2007, nr.
    DJZ2007057947, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de Staatssecretaris van Verkeer en
    Waterstaat en de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op richtlijn nr. 89/106/EEG van de Raad van de Europese Gemeenschappen van 21 december 1988 betreffende
    de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen der lidstaten inzake de voor de
    bouw bestemde produkten (PbEG L 40), zoals gewijzigd bij richtlijn nr. 93/68/EEG van de Raad van de Europese
    Gemeenschappen van 22 juli 1993 (PbEG L 220);

    Gelet op richtlijn nr. 06/12/EEG van de Raad van de Europese Gemeenschappen van 5 april 2006 betreffende
    afvalstoffen (PbEG, L 114), ter vervanging van richtlijn nr. 75/442/EEG van de Raad van de Europese Gemeenschappen
    van 15 juli 1975 betreffende afvalstoffen (PbEG L 194), zoals deze laatstelijk is gewijzigd bij verordening nr.
    1882/2003 van het Europees Parlement en de Raad van de Europese Gemeenschap van 29 september 2003 (PbEU L 284);

    Gelet op de artikelen 1.1, zevende lid, 8.1, tweede lid, 8.5, 8.40, 8.45, 8.49, vijfde lid,10.2, tweede lid, 10.15,
    eerste lid, 10.17, eerste lid, 10.52, 11.1, 11.2 en 11.3 van de Wet milieubeheer, de artikelen 6, 7, 8, 12a, 12b,
    15, 16a, 17, 36, 38, 39b, 70, 71, 72, 76o en 91 van de Wet bodembescherming, de artikelen 1 derde lid, 2a, eerste
    en tweede lid, 2b en 2c van de Wet verontreiniging oppervlaktewateren, artikel 24 van de Wet milieugevaarlijke
    stoffen, artikel 12, tweede lid van de Wet belastingen op milieugrondslag en artikel 40a van de Woningwet;

    De Raad van State gehoord (advies van 10 september 2007, nr. W08.07.0189/IV);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 19
    november 2007, nr. DJZ2007113029, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens de
    Staatssecretaris van Verkeer en Waterstaat en de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022929/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt, tenzij anders bepaald, verstaan onder:
      *Achtergrondwaarden*: bij regeling van Onze Ministers vastgestelde gehalten aan chemische stoffen voor een
      goede bodemkwaliteit, waarvoor geldt dat er geen sprake is van belasting door lokale verontreinigingsbronnen;
      *Accreditatie*: bewijs waarmee de Raad voor Accreditatie kenbaar maakt dat gedurende een bepaalde periode een
      gerechtvaardigd vertrouwen bestaat dat de hierin genoemde persoon of instelling competent is voor het uitvoeren
      van de desbetreffende werkzaamheid; *Baggerspecie*: materiaal dat is vrijgekomen uit de bodem of oever van een
      oppervlaktewaterlichaam en dat bestaat uit minerale delen met een maximale korrelgrootte van 2 millimeter en
      organische stof in een verhouding en met een structuur zoals deze in de bodem van nature worden aangetroffen,
      alsmede van nature in de bodem voorkomende schelpen en grind met een korrelgrootte van 2 tot 63 millimeter;
      *Beheerder*: bestuursorgaan dat bevoegd is tot vergunningverlening ingevolge [artikel 6.2 van de Waterwet][ref1];
      *Bodembeheergebied*: aaneengesloten, door het bestuursorgaan, bedoeld in [artikel 44][ref2], [45][ref3] of
      [46][ref4], afgebakend deel van de oppervlakte van een of meer gemeenten of het beheergebied van een of meer
      beheerders; *Bodemfuncties*: gebruik van de bodem, niet zijnde de bodem of oever van een oppervlaktewaterlichaam,
      zoals dat is vastgesteld door de gemeenteraad, overeenkomstig een bij regeling van Onze Ministers vastgestelde
      indeling; *Bodemfunctieklassen*: bij regeling van Onze Ministers vastgestelde indeling van bodemfuncties in
      de categorieën, bedoeld in [artikel 55, eerste lid][ref5]; *Bouwstof*: materiaal waarin de totaalgehalten aan
      silicium, calcium of aluminium tezamen meer dan 10 gewichtsprocent van dat materiaal bedragen, uitgezonderd
      vlakglas, metallisch aluminium, grond of baggerspecie, dat is bestemd om te worden toegepast; *Certificaat*:
      verklaring waarmee een door Onze Minister erkende certificeringsinstelling kenbaar maakt dat gedurende een
      bepaalde periode een gerechtvaardigd vertrouwen bestaat dat de hierin genoemde persoon voldoet aan het voor de
      certificering geldende normdocument; *Erkende kwaliteitsverklaring*: schriftelijke verklaring die is afgegeven
      door een instelling die daartoe beschikt over een erkenning, waarin wordt verklaard dat de bijbehorende partij
      die afkomstig is van een persoon of instelling die is erkend voor het produceren op basis van een nationale
      Beoordelingsrichtlijn, voldoet aan de bij of krachtens dit besluit gestelde eisen met betrekking tot de
      milieuhygiënische kwaliteit, mits toegepast op de in de verklaring aangegeven wijze; *Erkenning*: beschikking
      van Onze Ministers waarbij wordt vastgesteld dat een persoon of een instelling voor een werkzaamheid voldoet
      aan de bij of krachtens dit besluit geldende voorwaarden; *Fabrikant-eigenverklaring*: schriftelijke verklaring,
      afgegeven door de producent van een bouwstof, grond of baggerspecie, waarin deze verklaart dat de bijbehorende
      partij voldoet aan de bij of krachtens dit besluit gestelde eisen met betrekking tot de milieuhygiënische
      kwaliteit. Uit de verklaring blijkt op welke wijze is vastgesteld dat de partij voldoet aan de bij of krachtens
      dit besluit gestelde eisen; *Grond*: vast materiaal dat bestaat uit minerale delen met een maximale korrelgrootte
      van 2 millimeter en organische stof in een verhouding en met een structuur zoals deze in de bodem van nature
      worden aangetroffen, alsmede van nature in de bodem voorkomende schelpen en grind met een korrelgrootte van 2
      tot 63 millimeter, niet zijnde baggerspecie; *IBC-bouwstof*: bouwstof die vanwege de mate van emissie alleen
      met isolatie-, beheers-, en controlemaatregelen mag worden toegepast; *Instelling*: certificeringsinstelling,
      inspectie-instelling, laboratorium of andere instelling, die beoordeelt of een persoon, een stof, een product,
      een installatie, een voorziening of een ander object overeenstemt met een normdocument; *Interventiewaarden*:
      bij regeling van Onze Ministers vastgestelde generieke waarden die aangeven dat bij overschrijding sprake is van
      potentiële ernstige vermindering van de functionele eigenschappen die de bodem voor mens, plant of dier heeft,
      als bedoeld in [artikel 36 van de Wet bodembescherming][ref6]; *Isolatie, beheers- en controlemaatregelen*:
      maatregelen waardoor bij toepassing van een bouwstof nagenoeg geen contact optreedt van die bouwstof met
      hemelwater en grondwater; *Kwaliteitsklasse*: bij regeling van Onze Ministers vastgestelde indeling in
      categorieën van de kwaliteit van de bodem, grond of baggerspecie; *Landbouwbedrijf*: bedrijf als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Meststoffenwet][ref7]; *Mijnsteen:* bouwstof, in hoofdzaak bestaande
      uit gebroken schalie en zandsteen met bijmengingen van kolengruis, die als nevengesteente is vrijgekomen bij
      winning van steenkool; *Milieuhygiënische verklaring*:


