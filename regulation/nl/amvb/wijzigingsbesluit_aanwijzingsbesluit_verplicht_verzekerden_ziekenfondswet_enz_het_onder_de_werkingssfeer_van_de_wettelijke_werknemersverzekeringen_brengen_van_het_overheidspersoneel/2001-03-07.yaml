    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 29 augustus 1997, DWJZ-U-971230,
    gedaan in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, Onze Minister van Binnenlandse
    Zaken en de Staatssecretaris van Defensie;

    Gelet op de artikelen 3, eerste lid, onder b, en negende lid en 18 van de Ziekenfondswet;

    De Raad van State gehoord (advies van 11 november 1997, nummer W13.97.0568);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 10 december 1997, DWJZ-U-
    97.1812, uitgebracht in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, Onze Minister van
    Binnenlandse Zaken en de Staatssecretaris van Defensie;

    Hebben goedgevonden en verstaan:
