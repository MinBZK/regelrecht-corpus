  - number: VII
    text: |-
      Ten aanzien van degene op wie vanaf het tijdstip van aanvang van de fase 2, bedoeld in
      [artikel 53 van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1] de [Werkloosheidswet][ref2]
      van toepassing is, wordt het [Besluit beperking kring verzekerden Ziekenfondswet][ref3] met ingang van het
      tijdstip van aanvang van fase 2 van de [Wet overheidspersoneel onder de werknemersverzekeringen][ref4] tot
      1 januari 2003 als volgt gelezen: Na artikel 2d wordt een nieuw artikel 2e ingevoegd, luidende: **Artikel
      2e** Van de verzekering ingevolge [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref5] is
      uitgezonderd degene die uitsluitend uit hoofde van een arbeidsverhouding als overheidswerknemer in de zin van
      [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref6] een uitkering op
      grond van de [Werkloosheidswet][ref7] ontvangt, tenzij hij op grond van die arbeidsverhouding verplicht verzekerd
      was, of uitsluitend in verband met overschrijding van de voor de verplichte ziekenfondsverzekering geldende
      loongrens niet verplicht verzekerd was.


