  - number: XI
    text: |-
      Dit besluit treedt in werking op de datum dat het bij koninklijke boodschap van 27 maart 1997 ingediende
      voorstel van wet houdende het onder de werkingssfeer van de wettelijke werknemersverzekeringen brengen van het
      overheidspersoneel ([Wet overheidspersoneel onder de werknemersverzekeringen][ref1], kamerstukken II, 1996/97, 25
      282, nrs. 1-2) tot wet wordt verheven en in werking treedt.


