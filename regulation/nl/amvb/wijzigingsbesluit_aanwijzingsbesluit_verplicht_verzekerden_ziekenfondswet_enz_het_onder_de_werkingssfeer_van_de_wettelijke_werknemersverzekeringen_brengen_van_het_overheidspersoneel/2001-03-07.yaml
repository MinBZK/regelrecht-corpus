    text: |-
      Ten aanzien van degene op wie vanaf het tijdstip van aanvang van de fase 2, bedoeld in
      [artikel 48 van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1], de [Ziektewet][ref2] van
      toepassing is en ten aanzien van degene voor wie op dat tijdstip de fase 3 van die wet aanvangt, wordt het
      [Aanwijzingsbesluit verzekerden Zfw][ref3] met ingang van dat tijdstip tot 1 januari 2003 als volgt gelezen: A
      Artikel 1 wordt als volgt gewijzigd: 1. De onderdelen c, d en w vervallen. 2. In onderdeel f wordt «ingevolge het
      bepaalde onder c dan wel uitsluitend in verband met overschrijding van de voor de verplichte ziekenfondsverzekering
      geldende loongrens niet verzekerd was ingevolge het bepaalde onder c» vervangen door: als overheidswerknemer in
      de zin van [artikel 1, onder l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref4] dan wel
      in die hoedanigheid uitsluitend in verband met overschrijding van de voor de verplichte ziekenfondsverzekering
      geldende loongrens niet verzekerd was. B Artikel 2 wordt als volgt gewijzigd: 1. Het zevende lid vervalt; 2.
      In het achtste lid wordt «n, r, t, v en w» vervangen door: n, r, t en v; 3. In het tiende en elfde lid, wordt
      «r of w» telkens vervangen door: r. C In artikel 3, eerste lid, vervalt «c,». D Artikel 4 vervalt. E Artikel
      4a vervalt. F Artikel 12b vervalt. G Aan artikel 15a wordt een nieuw derde lid toegevoegd luidende: 3. Voor de
      verzekering van de verzekerden, bedoeld in dit artikel wordt een premie geheven tot het krachtens het eerste lid
      van [artikel 15 van de Ziekenfondswet][ref5] vastgestelde percentage van de uit te betalen WAO-uitkering, die in
      het tijdvak, waarover de betaling loopt, door de verzekerden is genoten. Het bepaalde krachtens artikel 15, tweede
      lid, alsmede de [artikelen 15][ref6], derde tot en met vijfde lid, en [16 van de Ziekenfondswet][ref7] zijn van
      toepassing. H In artikel 16a, eerste lid, vervallen de zinsdelen «c, d,» en «w,».


