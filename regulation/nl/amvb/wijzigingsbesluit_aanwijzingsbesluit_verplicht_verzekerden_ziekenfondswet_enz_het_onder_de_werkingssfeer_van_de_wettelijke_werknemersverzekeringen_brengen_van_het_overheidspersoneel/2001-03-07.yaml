  - number: X
    text: |-
      Voor zover de bepalingen van de fase 2, respectievelijk de fase 3 van de
      [Wet overheidspersoneel onder de werknemersverzekeringen][ref1] die betrekking hebben op de [Ziektewet][ref2]
      op hetzelfde tijdstip van kracht worden als de bepalingen van de fase 2, respectievelijk de fase 3 van die wet
      die betrekking hebben op de [Werkloosheidswet][ref3], worden van dit besluit eerst de [artikelen II][ref4] en
      [III][ref5] en vervolgens de [artikelen VI][ref6] en [VII][ref7] toegepast respectievelijk worden van dit besluit
      eerst de [artikelen IV][ref8] en [V][ref9] en vervolgens de [artikelen VIII][ref10] en [IX][ref11] toegepast.


