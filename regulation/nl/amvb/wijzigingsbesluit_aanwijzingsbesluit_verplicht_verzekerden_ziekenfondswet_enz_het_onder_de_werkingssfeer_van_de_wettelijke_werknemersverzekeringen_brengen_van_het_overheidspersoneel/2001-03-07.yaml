      Ten aanzien van degene op wie vanaf het tijdstip van aanvang van de fase 2, bedoeld in
      [artikel 48 van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1], de [Ziektewet][ref2] van
      toepassing is en ten aanzien van degene voor wie op dat tijdstip de fase 3 van die wet aanvangt, wordt het
      [Besluit beperking kring verzekerden Ziekenfondswet][ref3] met ingang van dat tijdstip tot 1 januari 2003 als
      volgt gelezen: A In artikel 2, eerste lid, wordt na onderdeel c de punt vervangen door een puntkomma en wordt
      een nieuw onderdeel d toegevoegd luidende: d. degene die bij of krachtens [artikel 8a van de Ziektewet][ref4]
      als werknemer in de zin van die wet wordt beschouwd en uitsluitend uit hoofde van zijn arbeidsverhouding,
      bedoeld in artikel 8b, eerste lid, onder b, van die Wet, waarin hij niet of slechts nog ten dele werkzaam
      is, een arbeidsongeschiktheidsuitkering ontvangt op grond van de verplichte verzekering ingevolge de
      [Wet op de arbeidsongeschiktheidsverzekering][ref5], berekend naar een mate van arbeidsongeschiktheid van minder
      dan 45%. B Na artikel 2c wordt een nieuw artikel 2d ingevoegd, luidende: Artikel 2d Van de verzekering ingevolge
      [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref6] is uitgezonderd degene wiens arbeidsverhouding
      met inachtneming van [artikel 3 van de Ziektewet][ref7] juncto een algemene maatregel van bestuur als bedoeld in
      [artikel 8b van de Ziektewet][ref8] wordt aangemerkt als dienstbetrekking in de zin van de [Ziektewet][ref9] en
      die tevens,


