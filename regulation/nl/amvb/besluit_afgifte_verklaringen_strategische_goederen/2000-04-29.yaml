      - id: ref2
        bwb_id: BWBR0002408
  - number: '2'
    text: Een aanvraag tot afgifte van een internationaal importcertificaat wordt ingediend bij het hoofd.
    url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#Artikel2
  - number: '3'
    text: >-
      1 Onze Minister beslist op de aanvraag.


      2 De afgifte van een internationaal importcertificaat kan slechts worden geweigerd of van de aanvraag kan slechts
      anderszins worden afgeweken, indien Onze Minister het in onvoldoende mate gewaarborgd acht dat op het certificaat
      te vermelden invoer of andere douanerechtelijke handeling daadwerkelijk zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#Artikel3
  - number: '4'
    text: |-
      1 Het internationaal importcertificaat wordt bij het afgeven voorzien van de dagtekening en gewaarmerkt.

      2 Op het certificaat wordt de in [artikel 5, onder b][ref1], bedoelde geldigheidsduur vermeld.

      3 Op het certificaat wordt de naam van de aanvrager als "importeur" vermeld en de naam van de buitenlandse
      leverancier van de goederen als "exporteur".

      4 Aan de aanvrager wordt bij de afgifte tevens een afschrift van het certificaat verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004001#Artikel5
    url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004001
        artikel: '5'
  - number: '5'
    text: >-
      Het is degene aan wie het internationaal importcertificaat is verstrekt verboden dat certificaat af te geven:


      a. aan een ander dan de bevoegde buitenlandse autoriteiten dan wel degene die op het certificaat als exporteur
      is vermeld;


      b. later dan zes maanden na de op het certificaat vermelde dag van afgifte, tenzij op het certificaat een andere
      geldigheidsduur is vermeld; in het laatste geval geldt de op het certificaat aangegeven geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#Artikel5
  - number: '6'
    text: |-
      1 Degene aan wie een internationaal importcertificaat is verstrekt is verplicht:

      a. indien een op dat certificaat aangeduide invoer of andere douanerechtelijke handeling plaatsvindt, het daartoe
      bestemde afschrift van het certificaat ter hand te stellen van de bij die invoer of handeling betrokken ambtenaar
      van de rijksbelastingdienst, bevoegd inzake douane;

      b. het certificaat, zodra vaststaat dat dit niet zal worden afgegeven binnen de termijn, bedoeld in
      [artikel 5, onder b][ref1], terstond terug te zenden aan het hoofd;

      c. het eerderbedoelde afschrift van dat certificaat, zodra vaststaat, dat daarvan geen gebruik of geen verder
      gebruik zal worden gemaakt, terstond terug te zenden aan het hoofd;

      d. aan Onze Minister of aan het hoofd binnen de daartoe gestelde termijn alle door hen gewenste inlichtingen te
      verschaffen omtrent het van het certificaat en het afschrift daarvan gemaakte gebruik en omtrent de bestemming van
      de goederen, waarop het certificaat betrekking heeft.

      2 Degene die een aan hem verstrekt internationaal importcertificaat heeft afgegeven aan de bevoegde buitenlandse
      autoriteiten dan wel aan degene, die op het certificaat als exporteur is vermeld, is voorts verplicht:

      a. zodra voor hem aannemelijk is dat de goederen, waarop het certificaat betrekking heeft, een andere bestemming
      zullen volgen dan op het certificaat is vermeld, zulks onder opgave van redenen te melden aan het hoofd;

      b. op daartoe strekkend verzoek van de bevoegde buitenlandse autoriteiten dan wel van degene, die op het
      certificaat als exporteur is vermeld, een internationaal bewijs van ontvangst aan te vragen en dit bewijs te doen
      toekomen aan die autoriteiten onderscheidenlijk de exporteur.


      [ref1]: https://wetten.overheid.nl/BWBR0004001#Artikel5
    url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004001
        artikel: '5'
  - number: '7'
    text: |-
      De in [artikel 6, eerste lid, onder a][ref1], bedoelde ambtenaar vermeldt zijn bevindingen met de dagtekening op
      het ingevolge die bepaling ontvangen afschrift en stelt dit vervolgens wederom ter beschikking aan de houder.


      [ref1]: https://wetten.overheid.nl/BWBR0004001#Artikel6
    url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004001
        artikel: '6'
  - number: '8'
    text: |-
      [Artikel 2][ref1] is van overeenkomstige toepassing met betrekking tot de aanvraag om een internationaal bewijs
      van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0004001#Artikel2
    url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004001
        artikel: '2'
  - number: '9'
    text: |-
      1 Onze Minister beslist op de aanvraag, bedoeld in [artikel 8][ref1].

      2 De afgifte van een internationaal bewijs van ontvangst kan slechts worden geweigerd indien niet ten genoegen van
      Onze Minister is aangetoond dat de in de aanvraag vermelde invoer of daarbij aangegeven andere douanerechtelijke
      handeling heeft plaatsgevonden.

      3 [Artikel 4, eerste lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004001#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004001#Artikel4
    url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004001
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004001
        artikel: '4'
  - number: '10'
    text: >-
      Onze Minister stelt het model vast van het internationale importcertificaat en het internationale bewijs van
      ontvangst.
    url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#Artikel10
  - number: '12'
    text: |-
      [Artikel 11][ref1] treedt in werking met ingang van de dag, liggende twee maanden na de datum van uitgifte van het
      *Staatsblad* waarin dit besluit wordt geplaatst. De overige artikelen van dit besluit treden in werking met ingang
      van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004001#Artikel11
    url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#Artikel12
