preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Economische Zaken, F. Bolkestein, en Onze Minister van Buitenlandse
    Zaken van 7 maart 1986, nr. 686/253 W.J.A., gehoord de Commissie Regelingen In- en uitvoerwet, door de Sociaal-
    Economische Raad ingesteld op grond van artikel 43 van de Wet op de Bedrijfsorganisatie (Stb. 1950, K 22);


    Overwegende, dat naar Ons oordeel het belang van de internationale rechtsorde vereist regelen te stellen ten
    aanzien van in het internationale handelsverkeer omtrent strategische goederen te bezigen verklaringen, alsmede
    daarmee verband houdende regelen ten aanzien van de doorvoer van strategische goederen;


    Gelet op de artikelen 2a en 2b van de In- en uitvoerwet (Stb. 1962, nr. 295);


    De Raad van State gehoord (advies van 21 mei 1986, nr. W10.86.0145);


    Gezien het nader rapport van de voornoemde Staatssecretaris, mede namens Onze voornoemde Minister, van 8 juli 1986,
    nr. 686/919 W.J.A.;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *wet:* de [In- en uitvoerwet][ref1] (*Stb.* 1962, 295);

      b. *internationaal importcertificaat:* een in het internationale handelsverkeer met betrekking tot strategische
      goederen te bezigen verklaring, waaruit blijkt dat de aanvrager daarvan tegenover Onze Minister heeft verklaard die
      goederen te zullen invoeren dan wel een daarbij aangegeven andere douanerechtelijke handeling met betrekking tot
      die goederen te zullen verrichten;

      c. *internationaal bewijs van ontvangst:* een in het internationale handelsverkeer met betrekking tot strategische
      goederen te bezigen verklaring, waaruit blijkt dat tegenover Onze Minister is aangetoond, dat bepaalde goederen
      zijn ingevoerd, dan wel een daarbij aangegeven andere douanerechtelijke handeling met betrekking tot die goederen
      is verricht;

      d. *strategische goederen:* de goederen, aangewezen in de bijlage, behorende bij het
      [In- en uitvoerbesluit strategische goederen][ref2]

      e. *Onze Minister:* Onze Minister van Economische Zaken;

      f. *hoofd:* het hoofd van de Belastingdienst/Douane centrale dienst voor in- en uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0002376
      [ref2]: https://wetten.overheid.nl/BWBR0002408
    url: https://wetten.overheid.nl/BWBR0004001/2000-04-29#Artikel1
    references:
      - id: ref1
