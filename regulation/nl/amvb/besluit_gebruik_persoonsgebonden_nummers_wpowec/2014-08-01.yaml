  - number: 3.b.3°
    text: de gegevens over het verblijf in Nederland en het vertrek uit Nederland;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.b.4°
    text: de datum van in- of uitschrijving;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.b.5°
    text: de soort onderwijs;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.b.6°
    text: de schoolsoort;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.b.7°
    text: de aanduiding of het betreft een leerling met een niet-Nederlandse culturele achtergrond;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.b.8°
    text: |-
      de onderwijssoort dan wel het cluster, bedoeld in [artikel 2, vierde lid, onder d, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 3.b.9°
    text: indien van toepassing de indicatie voor het soort verblijf;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.b.10°
    text: de bekostigingsindicatie; en
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.b.11°
    text: het registratienummer van de school, of indien sprake is van een nevenvestiging, het registratienummer daarvan.
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: '4.1'
    text: |-
      De gegevens, bedoeld in [artikel 3][ref1], worden uitsluitend gebruikt door de daartoe door Onze Minister
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0027673#Artikel3
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027673
        artikel: '3'
        paragraaf: '2'
  - number: '4.2'
    text: 'Onze Minister kan uitsluitend gebruiken:'
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel4
  - number: 4.2.a
    text: |-
      de gegevens van een leerling of voormalige leerling van wie het bevoegd gezag op grond van
      [artikel 178a, vierde lid, van de WPO][ref1] respectievelijk [artikel 164a, vierde lid, van de WEC][ref2] het
      persoonsgebonden nummer aan Onze Minister heeft verstrekt ten behoeve van de vaststelling van de bekostiging van de
      school, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel178a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel164a
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 178a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 164a
  - number: 4.2.b
    text: |-
      de gegevens van een leerling of voormalige leerling, voorzover Onze Minister dit noodzakelijk acht ten
      behoeve van een onderzoek als bedoeld in [artikel 178b, derde lid, van de WPO][ref1] respectievelijk
      [artikel 164b, derde lid, van de WEC][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel178b
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel178b
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 178b
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 178b
  - number: '4.3'
    text: |-
      De gegevens, bedoeld in [artikel 3][ref1], worden door Onze Minister na gebruik uitsluitend verder verwerkt, voor
      zover dit noodzakelijk is voor de vaststelling van de bekostiging van de school waaraan de desbetreffende leerling
      is ingeschreven of ingeschreven is geweest, daaronder begrepen de motivering van beschikkingen en de behandeling
      van bezwaar- en beroepschriften, en de persoonlijke levenssfeer van de betrokkene niet onevenredig wordt geschaad.
      De gegevens worden door Onze Minister vernietigd zodra zij voor de vaststelling van de bekostiging van de betrokken
      school niet langer noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0027673#Artikel3
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027673
        artikel: '3'
        paragraaf: '2'
  - number: '9'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld, en de verschillende artikelen of onderdelen
      daarvan kunnen terugwerken tot en met een bij dat besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit gebruik persoonsgebonden nummers WPO/WEC.'
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel10
