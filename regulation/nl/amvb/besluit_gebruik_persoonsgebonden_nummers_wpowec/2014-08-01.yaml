preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, van 28 januari 2010, nr. 184900
    (2675), directie Wetgeving en Juridische Zaken, gedaan mede namens de Staatssecretaris van Onderwijs, Cultuur en
    Wetenschap en Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op de artikelen 40b, eerste lid, 69, tweede lid, 120, derde lid, en 178c, vijfde lid, van de Wet op het
    primair onderwijs, de artikelen 28c, achtste lid, 42a, eerste lid, 70, tweede lid, 117, derde lid, en 164c, vijfde
    lid, van de Wet op de expertisecentra en artikel 27b, eerste lid, van de Wet op het voortgezet onderwijs;

    De Raad van State gehoord (advies van 18 maart 2010, nr. W05.10.0029/I);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap, van 27 april 2010, nr. WJZ/204040
    (2675), directie Wetgeving en Juridische Zaken, uitgebracht mede namens de Staatssecretaris van Onderwijs, Cultuur
    en Wetenschap en Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#ArtikelAanhef
