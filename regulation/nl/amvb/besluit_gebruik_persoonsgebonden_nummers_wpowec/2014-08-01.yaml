  - number: '2'
    text: |-
      Dit besluit is van toepassing op de gegevens van leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan
      een uit de openbare kas bekostigde school als bedoeld in de [WPO][ref1] respectievelijk de [WEC][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: '3'
    text: |-
      Ten behoeve van de vaststelling van de bekostiging van een school als bedoeld in de [WPO][ref1] respectievelijk
      de [WEC][ref2] kan Onze Minister de volgende in het basisregister onderwijs opgenomen gegevens van een leerling of
      voormalige leerling van de school gebruiken:


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 3.a
    text: |-
      indien het betreft een school als bedoeld in de [WPO][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 3.a.1°
    text: het persoonsgebonden nummer;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.a.2°
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.a.3°
    text: de gegevens over het verblijf in Nederland en het vertrek uit Nederland;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.a.4°
    text: de datum van in- of uitschrijving;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.a.5°
    text: de groep;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.a.6°
    text: het gewicht van de leerling, indien het betreft een leerling die is ingeschreven op een basisschool;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.a.7°
    text: de aanduiding of het betreft een leerling met een niet-Nederlandse culturele achtergrond;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.a.8°
    text: |-
      indien van toepassing de aanduiding visueel gehandicapte leerling dan wel auditief of communicatief gehandicapte
      leerling en de instelling die deze leerling begeleidt;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.a.9°
    text: de bekostigingsindicatie; en
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.a.10°
    text: het registratienummer van de school, of indien sprake is van een nevenvestiging, het registratienummer daarvan.
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.b
    text: |-
      indien het betreft een school als bedoeld in de [WEC][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 3.b.1°
    text: het persoonsgebonden nummer;
    url: https://wetten.overheid.nl/BWBR0027673/2014-08-01#Artikel3
  - number: 3.b.2°
    text: de geboortedatum;
