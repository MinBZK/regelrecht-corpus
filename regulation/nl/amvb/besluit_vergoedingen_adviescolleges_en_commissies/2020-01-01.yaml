  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 21 november 2008, 2008-
    0000560740, directie Constitutionele Zaken en Wetgeving;


    Gelet op artikel 2, vierde lid, van de Wet vergoedingen adviescolleges en commissies en op artikel 89, eerste lid,
    van de Grondwet;


    De Raad van State gehoord (advies van 10 december 2008, nr. W04.08.0508/I);


    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 13 januari 2009, nr.
    2008-000626938;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0025279/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder de wet: de [Wet vergoedingen adviescolleges en commissies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024775
    url: https://wetten.overheid.nl/BWBR0025279/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024775
  - number: '2'
    text: |-
      De vergoeding per vergadering, bedoeld in [artikel 2, eerste lid, van de wet][ref1], bedraagt ten hoogste 3% van
      het maximum van salarisschaal 18 zoals overeengekomen in de laatstelijk afgesloten collectieve arbeidsovereenkomst
      die is gesloten voor de ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn, met dien
      verstande dat aan de voorzitter van een adviescollege of van een commissie een vergoeding per vergadering kan
      worden toegekend van maximaal 130% van de hoogte van de vergoeding per vergadering die aan de andere leden van het
      desbetreffende adviescollege of de desbetreffende commissie wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0024775#Artikel2
    url: https://wetten.overheid.nl/BWBR0025279/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024775
        artikel: '2'
  - number: '3'
    text: |-
      Voor de toepassing van [artikel 2][ref1] wordt als een vergadering beschouwd:

      a. een vergadering van een adviescollege of een commissie;

      b. een vergadering van een uit een adviescollege of een commissie samengestelde commissie onderscheidenlijk
      subcommissie;

      c. een vergadering van een gemengde commissie als bedoeld in
      [artikel 23, derde lid, van de Kaderwet adviescolleges][ref2];

      d. twee of meer vergaderingen die op dezelfde dag vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0025279#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel23
    url: https://wetten.overheid.nl/BWBR0025279/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025279
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008159
        artikel: '23'
  - number: '4'
    text: |-
      1 Een besluit tot vaststelling van een vaste vergoeding als bedoeld in [artikel 2, eerste lid, van de wet][ref1],
      bepaalt de toepasselijke arbeidsduurfactor en de toepasselijke salarisschaal overeenkomstig de salarisschalen
      zoals deze zijn overeengekomen in de laatstelijk afgesloten collectieve arbeidsovereenkomst die is gesloten voor de
      ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn.

      2 De vaste vergoeding bedraagt naar evenredigheid van de toepasselijke arbeidsduurfactor het maximum van de
      toepasselijke salarisschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0024775#Artikel2
    url: https://wetten.overheid.nl/BWBR0025279/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024775
        artikel: '2'
  - number: '5'
    text: |-
      In afwijking van de [artikelen 2][ref1] en [4][ref2] kan in een besluit als bedoeld in
      [artikel 2, eerste lid, van de wet][ref3], in overeenstemming met het gevoelen van de ministerraad, een hogere
      vergoeding worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0025279#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025279#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0024775#Artikel2
    url: https://wetten.overheid.nl/BWBR0025279/2020-01-01#Artikel5
    references:
      - id: ref1
