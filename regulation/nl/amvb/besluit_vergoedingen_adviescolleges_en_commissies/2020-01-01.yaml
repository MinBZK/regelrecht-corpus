        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025279
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0024775
        artikel: '2'
  - number: '6'
    text: |-
      1 Indien in een kalenderjaar de som van de aan dat kalenderjaar toe te
      rekenen vergoedingen op grond van dit besluit en de beloning in de zin van
      __REF000___________________________________________________________________________________________________________
      __ uit hoofde van het vervullen van een of meer functies bij instellingen of organisaties als bedoeld in de
      __REF001___________________________________________________________________________________________________________
      _____ meer bedraagt dan twaalf maal het bedrag, genoemd in
      [artikel 1, eerste lid, van de Wet rechtspositie ministers en staatssecretarissen][ref3],
      vermeerderd met de vakantie-uitkering en de eindejaarsuitkering, bedoeld in
      [artikel 2, eerste lid, van de Wet rechtspositie ministers en staatssecretarissen][ref4], wordt de hoogste aan dat
      kalenderjaar toe te rekenen vergoeding verminderd met dat meerdere.

      2 Van inkomsten die leiden tot toepasselijkheid van het eerste lid, doet betrokkene terstond mededeling aan Onze
      Minister.

      3 Het eerste lid is niet van toepassing, voor zover een vergoeding wordt afgedragen op grond
      van [artikel 43, vijfde lid][ref5] of [artikel 65, vijfde lid, van de Provinciewet][ref6],
      [artikel 44, vierde lid][ref7] of [artikel 66, vierde lid, van de Gemeentewet][ref8] of
      [artikel 44, vierde lid][ref9] of [artikel 49, vierde lid, van de Waterschapswet][ref10].


