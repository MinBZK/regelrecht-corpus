  - number: 7o.4
    text: |-
      In afwijking van [artikel 3.26, vijfde lid, van de Wet ruimtelijke ordening][ref1]
      en [artikel 9e van de Elektriciteitswet 1998][ref2] respectievelijk
      [artikel 3.28, vijfde lid, van de Wet ruimtelijke ordening][ref3] en
      [artikel 9b van de Elektriciteitswet 1998][ref4] is de raad voor de duur van de in het tweede lid bedoelde
      termijn niet bevoegd de voor de exacte locaties van de windturbines in een inpassingsplan opgenomen bestemming en
      voorlopige bestemming te wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel9e
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel9b
