      een sport- of speeltoestel voor uitsluitend particulier gebruik, mits uitsluitend functionerend met behulp van de
      zwaartekracht of de fysieke kracht van de mens;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6g
  - number: 6g.2.i
    text: een erf- of perceelafscheiding;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6g
  - number: 6g.2.j
    text: een vlaggenmast.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6g
  - number: 6g.3
    text: |-
      Op een aanvraag om een omgevingsvergunning als bedoeld in het tweede lid is
      [artikel 2.2 van de Regeling omgevingsrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6g
    references:
