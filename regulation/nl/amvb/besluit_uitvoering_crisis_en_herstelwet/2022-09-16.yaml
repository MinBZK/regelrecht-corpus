  - number: 7ae.1
    text: |-
      Dit artikel is tot 1 januari 2025 van toepassing binnen de provincies Gelderland, Limburg, Noord-Brabant en
      Overijssel.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7ae.2
    text: |-
      Het bevoegd gezag is het bestuursorgaan dat bevoegd zou zijn of is om een omgevingsvergunning voor de betrokken
      inrichting te verlenen.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7ae.3
    text: |-
      In afwijking van [artikel 2, eerste lid, van de Regeling ammoniak en veehouderij][ref1] kan
      het bevoegd gezag voor een huisvestingssysteem dat of een additionele techniek die niet in
      [bijlage 1 bij die regeling][ref2] is opgenomen op aanvraag bij besluit bepalen dat in plaats van
      emissiefactoren gebruik wordt gemaakt van meetsensoren die de feitelijke emissies meten voor het beoordelen
      of wordt voldaan aan [artikel 3][ref3], [4][ref4] of [5 van het Besluit emissiearme huisvesting][ref5]
      en hetzij [artikel 7, eerste lid, onder a en b, van de Wet ammoniak en veehouderij][ref6], hetzij
      [artikel 3.114, eerste lid, onder a en b, van het Activiteitenbesluit milieubeheer][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0013629#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013629
      [ref3]: https://wetten.overheid.nl/BWBR0036748#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0036748#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0036748#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0013402#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0013629
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013629
      - id: ref3
        bwb_id: BWBR0036748
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0036748
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0036748
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0013402
        artikel: '7'
      - id: ref7
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7ae.4
    text: |-
      Indien toepassing wordt gegeven aan het derde lid, zijn
      [artikel 6, eerste lid, van het Besluit emissiearme huisvesting][ref1],
      [artikel 1, tweede lid, van de Wet ammoniak en veehouderij][ref2] en
      [artikel 3.112 van het Activiteitenbesluit milieubeheer][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036748#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013402#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0036748
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0013402
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7ae.5
    text: |-
      Indien het bevoegd gezag een besluit neemt als bedoeld in het derde lid, wordt in de omgevingsvergunning, bedoeld
      in [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] of het tiende
      lid, opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7ae.5.a
    text: het emissieplafond en de wijze waarop wordt aangetoond dat hieraan wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7ae.5.b
    text: |-
      dat de emissies worden gemeten overeenkomstig het Protocol voor meting met sensoren van ammoniakemissie uit
      huisvestingssystemen in de veehouderij of een gelijkwaardige methode.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7ae.6
    text: |-
      Onverminderd [artikel 3 van de Regeling ammoniak en veehouderij][ref1] kan het bevoegd gezag voor een
      huisvestingssysteem dat of een additionele techniek die niet in [bijlage 1 bij die regeling][ref2] is opgenomen, op
      aanvraag bij besluit een bijzondere ammoniakemissiefactor of een emissiereductiepercentage vaststellen die bij de
      berekening van de ammoniakemissie worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0013629#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013629
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0013629
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013629
  - number: 7ae.7
    text: |-
      Indien het bevoegd gezag een besluit neemt als bedoeld in het zesde lid, wordt in de omgevingsvergunning, bedoeld
      in [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] of het
      tiende lid, opgenomen dat de emissies binnen twee jaar vanaf het in gebruik nemen van het huisvestingssysteem
      of de additionele techniek worden gemeten overeenkomstig het Protocol voor meting van ammoniakemissie uit
      huisvestingssystemen in de veehouderij, versie 2013a, of een gelijkwaardige methode, tenzij is aangetoond dat al
      voldoende metingen op andere locaties worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7ae.8
    text: |-
      Onverminderd [artikel 67, eerste en derde lid, van de Regeling beoordeling luchtkwaliteit 2007][ref1] kan
      het bevoegd gezag op aanvraag bij besluit andere gegevens gebruiken en goedkeuren dan de gegevens, bedoeld in
      [artikel 66, onder i, van die regeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel66
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0022817
        artikel: '66'
  - number: 7ae.9
    text: |-
      Indien het bevoegd gezag een besluit neemt als bedoeld in het achtste lid, wordt in de omgevingsvergunning,
      bedoeld in [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] of
      het tiende lid, opgenomen dat de emissies binnen twee jaar vanaf het in gebruik nemen van het huisvestingssysteem
      of de additionele techniek worden gemeten overeenkomstig het Protocol voor meting van fijnstofemissie uit
      huisvestingssystemen in de veehouderij, versie 2010, of een gelijkwaardige methode, tenzij is aangetoond dat al
      voldoende relevante metingen op andere locaties worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7ae.10
    text: |-
      In aanvulling op [artikel 2.2a van het Besluit omgevingsrecht][ref1] wordt aangewezen als categorie activiteiten
      als bedoeld in [artikel 2.1, eerste lid, onder i, van de Wet algemene bepalingen omgevingsrecht][ref2]
      het oprichten of wijzigen van een dierenverblijf waarbij toepassing is gegeven aan het derde, zesde of
      achtste lid, voor zover deze activiteit plaatsvindt binnen een inrichting type B zoals omschreven in
      [artikel 1.2 van het Activiteitenbesluit milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '1'
  - number: 7ae.11
    text: |-
      In afwijking van [artikel 5.13a van het Besluit omgevingsrecht][ref1] kunnen aan een omgevingsvergunning als
      deze betrekking heeft op de categorie activiteiten, bedoeld in het tiende lid, voorschriften worden verbonden als
      toepassing is gegeven aan het derde, zesde of achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5'
  - number: 7ae.12
    text: |-
      In aanvulling op [artikel 5.13b van het Besluit omgevingsrecht][ref1] kan een omgevingsvergunning als deze
      betrekking heeft op de categorie activiteiten, bedoeld in het tiende lid, worden geweigerd vanwege de aard of
      locatie van de activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5'
  - number: 7ae.13
    text: |-
      In aanvulling op [artikel 2.31, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1]
      kan het bevoegd gezag de voorschriften van een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref2] of als deze betrekking heeft op de categorie
      activiteiten, bedoeld het tiende lid, wijzigen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7ae.13.a
    text: |-
      uit metingen blijkt dat de ammoniakemissie in kg per dierplaats per jaar hoger is dan de op grond van het zesde lid
      vastgestelde bijzondere ammoniakemissiefactor of het op grond van dat lid vastgestelde emissiereductiepercentage;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7ae.13.b
    text: |-
      uit metingen blijkt dat de emissie van zwevende deeltjes (PM) in kg per dier per jaar hoger is dan de op
      grond van het achtste lid vastgestelde bijzondere emissiefactor of het op grond van dat lid vastgestelde
      emissiereductiepercentage;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7ae.13.c
    text: aanvullende maatregelen nodig zijn voor een goede werking van het huisvestingssysteem; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7ae.13.d
    text: aanvullende eisen nodig zijn voor het meten met sensoren.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7ae.14
    text: |-
      Indien toepassing wordt gegeven aan het dertiende lid, is
      [artikel 2.31a van de Wet algemene bepalingen omgevingsrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7ae.15
    text: |-
      In aanvulling op
      [artikel 2.33, tweede lid, aanhef en onder d en f, van de Wet algemene bepalingen omgevingsrecht][ref1] kan het
      bevoegd gezag een omgevingsvergunning als bedoeld in [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref2]
      of het tiende lid geheel of gedeeltelijk intrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7ae.15.a
    text: |-
      uit metingen blijkt dat de ammoniakemissie hoger is dan de op grond van het zesde lid vastgestelde bijzondere
      ammoniakemissiefactor of het op grond van dat lid vastgestelde emissiereductiepercentage;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7ae.15.b
    text: |-
      uit metingen blijkt dat de emissie van zwevende deeltjes (PM) in kg per dier per jaar hoger is dan de op
      grond van het achtste lid vastgestelde bijzondere emissiefactor of het op grond van dat lid vastgestelde
      emissiereductiepercentage; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7ae.15.c
    text: niet binnen twee jaar nadat het huisvestingssysteem is opgericht, metingen zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7ae.16
    text: |-
      Indien toepassing wordt gegeven aan het vijftiende lid, wordt het besluit, bedoeld in zesde en achtste lid,
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ae
  - number: 7af.1
    text: Dit artikel is tot 1 januari 2025 van toepassing binnen de provincies Gelderland, Limburg en Noord-Brabant.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.2
    text: |-
      Het bevoegd gezag is het bestuursorgaan dat bevoegd zou zijn of is om een omgevingsvergunning voor de betrokken
      inrichting te verlenen.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.3
    text: |-
      Onverminderd het [Besluit emissiearme huisvesting][ref1] kan het bevoegd gezag in de omgevingsvergunning, bedoeld
      in [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2], en voor een
      inrichting type B, bedoeld in [artikel 1.2 van het Activiteitenbesluit milieubeheer][ref3], bij besluit maatregelen
      voorschrijven die de emissie van geur, ammoniak of zwevende deeltjes (PM) verminderen, als blijkt dat de nadelige
      gevolgen van deze emissies voor het milieu verder kunnen onderscheidenlijk moeten worden beperkt, vanwege:


      [ref1]: https://wetten.overheid.nl/BWBR0036748
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0036748
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '1'
  - number: 7af.3.a
    text: de ontwikkeling van de technische mogelijkheden tot bescherming van het milieu;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.3.b
    text: de ontwikkeling van de kwaliteit van het milieu;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.3.c
    text: de cumulatieve gevolgen van de emissie van geur, ammoniak of zwevende deeltjes (PM) door veehouderijen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.3.d
    text: door het bevoegd gezag vastgesteld beleid voor verbetering van de luchtkwaliteit; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.3.e
    text: onaanvaardbare geurhinder als bedoeld in het twaalfde lid.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.4
    text: |-
      Indien voor dierenverblijven die zijn opgericht voor 1 januari 2007 toepassing wordt gegeven aan het derde lid, kan
      het bevoegd gezag afwijken van [artikel 5, tweede lid, van het Besluit emissiearme huisvesting][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036748#Artikel5
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0036748
        artikel: '5'
  - number: 7af.5
    text: |-
      Indien voor een inrichting type B als bedoeld in [artikel 1.2 van het Activiteitenbesluit milieubeheer][ref1]
      toepassing wordt gegeven aan het derde lid, kan het bevoegd gezag afwijken van de
      [artikelen 3.113 tot en met 3.119a van het Activiteitenbesluit milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7af.6
    text: |-
      In aanvulling op [artikel 2.31, tweede lid, aanhef en onder b, van de Wet algemene bepalingen omgevingsrecht][ref1]
      kan het bevoegd gezag de voorschriften van een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref2] wijzigen, vanwege:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7af.6.a
    text: de cumulatieve gevolgen van de emissie van geur, ammoniak of zwevende deeltjes (PM) door veehouderijen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.6.b
    text: door het bevoegd gezag vastgesteld beleid voor verbetering van de luchtkwaliteit; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.6.c
    text: onaanvaardbare geurhinder als bedoeld in het twaalfde lid.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.7
    text: |-
      Bij het wijzigen van de voorschriften van een omgevingsvergunning als bedoeld in het zesde lid kan het bevoegd
      gezag afwijken van het [Besluit emissiearme huisvesting][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036748
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0036748
  - number: 7af.8
    text: |-
      Indien toepassing wordt gegeven aan het zesde lid, is
      [artikel 2.31a van de Wet algemene bepalingen omgevingsrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7af.9
    text: |-
      Voor het voorschrijven van maatregelen, bedoeld in het derde lid, is
      [artikel 3, derde lid, laatste volzin, van de Wet ammoniak en veehouderij][ref1] ook van toepassing op een
      veehouderij waartoe geen IPPC-installatie behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '3'
  - number: 7af.10
    text: |-
      In afwijking van [artikel 3, derde lid, tweede volzin, van de Wet ammoniak en veehouderij][ref1] kunnen ook
      voorschriften worden gesteld over huisvestingssystemen die op 1 januari 2007 al aanwezig waren.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '3'
  - number: 7af.11
    text: |-
      In aanvulling op [artikel 2.33, tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref1] kan het bevoegd
      gezag een omgevingsvergunning geheel of gedeeltelijk intrekken als deze betrekking heeft op een activiteit als
      bedoeld in [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref2] als sprake is van onaanvaardbare
      geurhinder als bedoeld in het twaalfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7af.12
    text: |-
      Bij het bepalen of sprake is van onaanvaardbare geurhinder wordt ten minste rekening gehouden met de volgende
      aspecten:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.12.a
    text: lokaal geurbeleid;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.12.b
    text: de individuele en cumulatieve geurbelasting ter plaatse van geurgevoelige objecten;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.12.c
    text: de aard, omvang en waardering van de geur die vrijkomt;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.12.d
    text: de historie van de betreffende inrichting en het klachtenpatroon met betrekking tot geurhinder;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.12.e
    text: de bestaande en verwachte geurhinder van de betreffende inrichting; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.12.f
    text: de kosten en baten van technische voorzieningen en gedragsregels in de inrichting.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.13
    text: |-
      In aanvulling op [artikel 3 van de Wet geurhinder en veehouderij][ref1] wordt een omgevingsvergunning als bedoeld
      in [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] geweigerd
      indien niet kan worden voldaan aan voorschriften die vanwege de technische kenmerken en de geografische ligging van
      de veehouderij of vanwege de plaatselijke milieuomstandigheden moeten worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7af.14
    text: |-
      In afwijking van [artikel 3, vierde lid, van de Wet geurhinder en veehouderij][ref1] kan het bevoegd gezag bepalen
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '3'
  - number: 7af.14.a
    text: |-
      de toename van de geurbelasting ten gevolge van die wijziging minder bedraagt dan de helft van de vermindering
      van de geurbelasting die het gevolg zou zijn van de toegepaste geurbelastingreducerende maatregel bij het eerder
      vergunde veebestand; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.14.b
    text: |-
      de totale geurbelasting na die wijziging minder bedraagt dan het gemiddelde van de in de verordening vastgelegde
      waarde en de geurbelasting die de inrichting voorafgaand aan het toepassen van de maatregel veroorzaakte.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.15
    text: |-
      In afwijking van de [artikelen 3.115, tweede lid, aanhef en onder b][ref1], en
      [3.118, tweede lid, van het Activiteitenbesluit milieubeheer][ref2] kan het bevoegd gezag bij uitbreiding van een
      dierenverblijf bij maatwerkvoorschrift bepalen dat de geurbelasting, bedoeld in artikel 3.115, tweede lid, onder b,
      van dat besluit, minder bedraagt dan het in dat lid bedoelde gemiddelde.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7af.16
    text: |-
      Op welke wijze invulling wordt gegeven aan de bevoegdheid, bedoeld in het veertiende en vijftiende lid, wordt
      vastgelegd in beleidsregels, in een bestemmingsplan met verbrede reikwijdte als bedoeld in [artikel 7c][ref1] of in
      de verordening, bedoeld in [artikel 6 van de Wet geurhinder en veehouderij][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027929#Artikel7c
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel6
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0027929
        artikel: 7c
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020396
        artikel: '6'
  - number: 7af.17
    text: |-
      Het bevoegd gezag kent degene tot wie een besluit is gericht krachtens of met toepassing van het derde, zesde,
      elfde of dertiende tot en met vijftiende lid en die ten gevolge daarvan kosten maakt of schade lijdt die
      redelijkerwijs niet of niet geheel voor zijn rekening behoren te komen op zijn verzoek of uit eigen beweging een
      naar billijkheid te bepalen vergoeding toe, voor zover niet op een andere wijze in een redelijke vergoeding is of
      kan worden voorzien.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
  - number: 7af.18
    text: |-
      Indien toepassing wordt gegeven aan het zeventiende lid, is
      [artikel 4.2, tweede en derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel4
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '4'
  - number: 7ag.1
    text: |-
      In dit artikel wordt verstaan onder kookgasaansluiting: aansluiting als bedoeld in
      [artikel 1, eerste lid, onder m, van de Gaswet][ref1] waarbij de onroerende zaak ook een aansluiting heeft op
      een warmtenet als bedoeld in [artikel 1, eerste lid, van de Warmtewet][ref2] dat kan voorzien in de verwachte
      warmtebehoefte.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ag
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: '1'
  - number: 7ag.2
    text: |-
      In afwijking van [artikel 62 van de Gaswet][ref1] en in aanvulling op
      [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref2] kunnen in een bestemmingsplan met verbrede
      reikwijdte gebieden worden aangewezen waarbinnen het verboden is te beschikken over een kookgasaansluiting vanaf
      een in dat bestemmingsplan gestelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ag
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7ag.3
    text: |-
      Op de dag volgend op de in het bestemmingsplan gestelde datum, bedoeld in het tweede lid, wordt degene die over een
      kookgasaansluiting beschikt geacht de netbeheerder te hebben verzocht om beëindiging van die aansluiting.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ag
  - number: 7ag.4
    text: 'Het tweede lid kan uitsluitend worden toegepast, indien:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ag
  - number: 7ag.4.a
    text: de bestaande gastransportleidingen om veiligheidsredenen aan vervanging toe zijn;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ag
  - number: 7ag.4.b
    text: |-
      de onroerende zaken zijn aangesloten op een warmtenet als bedoeld in
      [artikel 1, eerste lid, van de Warmtewet][ref1] dat kan voorzien in de verwachte warmtebehoefte; en


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ag
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '1'
  - number: 7ag.4.c
    text: |-
      het college van burgemeester en wethouders het gebied, bedoeld in het tweede lid, heeft aangewezen als een gebied
      in de zin van [artikel 10, zevende lid, onder b, van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ag
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
  - number: 7ag.5
    text: |-
      [Artikel 7c, negende lid, onder a, onder 2°][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027929#Artikel7
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ag
    references:
      - id: ref1
        bwb_id: BWBR0027929
        artikel: '7'
        paragraaf: '3'
  - number: 7ag.6
    text: |-
      Indien gebruik wordt gemaakt van de bevoegdheid, bedoeld in het tweede lid, zijn de [artikelen 3.2.1][ref1],
      [3.2.2][ref2] en [3.2.3 van het Besluit ruimtelijke ordening][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0023798#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ag
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0023798
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0023798
        artikel: '3'
  - number: 7ag.7
    text: |-
      Dit artikel is van toepassing op het plangebied Overvecht-Noord in de gemeente Utrecht, zoals aangegeven op de
      kaart in [bijlage 185][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ag
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 7ah.1
    text: |-
      In afwijking van [afdeling 6.4 van de Wet ruimtelijke ordening][ref1] en [artikel 7c, tiende en elfde lid][ref2],
      kan de raad op grond van dit artikel regels voor kostenverhaal opnemen in het bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.4
      [ref2]: https://wetten.overheid.nl/BWBR0027929#Artikel7c
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.4'
      - id: ref2
        bwb_id: BWBR0027929
        artikel: 7c
        paragraaf: '3'
  - number: 7ah.2
    text: |-
      Als een bestemmingsplan als bedoeld in het eerste lid voorziet in het toelaten van bouwactiviteiten als bedoeld
      in het vijftiende lid, verhaalt het bestuursorgaan op degene die die bouwactiviteiten verricht de kosten die het
      vanwege de in het zestiende lid bedoelde kostensoorten maakt, voor zover:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.2.a
    text: de kostensoorten toerekenbaar zijn aan het kostenverhaalsgebied; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.2.b
    text: de kosten proportioneel zijn in verhouding tot het profijt dat het kostenverhaalsgebied van de kostensoorten heeft.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.3
    text: 'In afwijking van het tweede lid kan het bestuursorgaan beslissen kosten niet te verhalen als:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.3.a
    text: |-
      het totaal van de verschuldigde geldsommen dat op grond van het tiende lid kan worden verhaald, minder bedraagt
      dan € 10.000,–;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.3.b
    text: er geen verhaalbare kosten als bedoeld in de zestiende lid, onder c tot en met i, zijn; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.3.c
    text: |-
      de verhaalbare kosten alleen de aansluiting van een locatie op de openbare ruimte of de aansluiting op
      nutsvoorzieningen betreffen.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.4
    text: |-
      Het is verboden een activiteit als bedoeld in het vijftiende lid te verrichten, voordat de op grond van dit artikel
      verschuldigde kosten zijn betaald.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.5
    text: |-
      De gemeente waarvan het bestuursorgaan een orgaan is, kan met degene die kosten is verschuldigd een overeenkomst
      aangaan over kostenverhaal. Bij de overeenkomst kan, in afwijking van het vierde lid, worden bepaald dat de
      betaling geheel of gedeeltelijk na aanvang van de activiteit plaatsvindt, mits aan de overeenkomst voorwaarden
      worden verbonden over het stellen van aanvullende zekerheden voor de betaling.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.6
    text: |-
      Als het verhalen van kosten, bedoeld het tweede lid, is verzekerd vanwege een overeenkomst als bedoeld in
      het vijfde lid, zijn het zevende tot en met veertiende en zeventiende tot en met eenentwintigste lid niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.7
    text: 'In het bestemmingsplan, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.7.a
    text: worden kostenverhaalsgebieden aangewezen waarvoor de kosten, bedoeld in het tweede lid, worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.7.b
    text: |-
      wordt per kostenverhaalsgebied bepaald welke kostensoorten waarvan het gebied ten dele profijt heeft, naar
      evenredigheid aan dat kostenverhaalsgebied worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.7.c
    text: |-
      wordt per kostenverhaalsgebied een raming van de kosten opgenomen, met dien verstande dat ook alleen het maximum
      van de globaal te verhalen kosten als geheel per kostenverhaalsgebied kan worden opgenomen; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.7.d
    text: 'worden per kostenverhaalsgebied regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.7.d.1°
    text: |-
      de verdeling van de kosten over de bouwactiviteiten, waarbij ook het maximum van de te verhalen kosten per
      activiteit wordt opgenomen; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.7.d.2°
    text: de eindafrekening van de kosten.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.8
    text: |-
      De kosten worden verhaald tot ten hoogste het bedrag van de waardevermeerdering van de locatie waar de activiteit
      wordt verricht, die optreedt of zal optreden als gevolg van de bouwactiviteit.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.9
    text: |-
      De verschuldigde geldsom wordt berekend door de kosten over de bouwactiviteiten te verdelen naar rato van de
      opbrengsten van de gronden.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.10
    text: |-
      Als er geen overeenkomst is aangegaan, wordt de verschuldigde geldsom door het college van burgemeester
      en wethouders bij beschikking vastgesteld volgens hetgeen daarover is bepaald in dit artikel en in het
      bestemmingsplan, bedoeld in het eerste lid. Voordat het bestuursorgaan de beschikking geeft, stelt het de aanvrager
      in de gelegenheid zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.11
    text: |-
      De beslissing op een aanvraag om een beschikking als bedoeld in het tiende lid wordt aangehouden als voor de in de
      aanvraag bedoelde te verrichten activiteit het bestemmingsplan nog niet onherroepelijk is, tenzij:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.11.a
    text: een ingesteld beroep tegen het bestemmingsplan geen gevolgen kan hebben voor de beoordeling van de activiteit; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.11.b
    text: |-
      deze gevolgen volgens het bestuursorgaan niet opwegen tegen het belang dat met het geven van de beschikking is
      gediend.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.12
    text: |-
      De beschikking bevat een raming van de kosten en van de waardevermeerdering waarop de verschuldigde geldsom is
      gebaseerd. Bij de beschikking kan, in afwijking van het vierde lid, worden bepaald dat de betaling geheel of
      gedeeltelijk na aanvang van de activiteit plaatsvindt, mits aan de beschikking voorschriften worden verbonden over
      het stellen van aanvullende zekerheden voor de betaling van de verschuldigde geldsom.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.13
    text: |-
      De regeling voor de eindafrekening, bedoeld in het zevende lid, onder d, onder 2°, leidt er niet toe dat er een
      aanvullende geldsom is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.14
    text: 'Als een opnieuw berekende geldsom:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.14.a
    text: |-
      meer dan vijf procent lager is dan de op grond van de beschikking betaalde geldsom, betaalt het bestuursorgaan
      binnen vier weken na de eindafrekening het verschil, voor zover het groter is dan vijf procent, naar evenredigheid
      terug met rente; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.14.b
    text: |-
      is gebaseerd op andere kosten dan de kosten waarop de op grond van het tiende lid bij beschikking vastgestelde
      verschuldigde geldsom is gebaseerd, vindt geen terugbetaling plaats voor zover:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.14.b.1°
    text: de kosten vanwege de in het zestiende lid bedoelde kostensoorten zijn gemaakt; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.14.b.2°
    text: het maximum, bedoeld in het zevende lid, onder c, niet wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.15
    text: 'Bouwactiviteiten waarvan kosten worden verhaald als bedoeld in het tweede lid, aanhef, zijn:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.15.a
    text: de bouw van een of meer woningen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.15.b
    text: de bouw van een of meer andere hoofdgebouwen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.15.c
    text: de uitbreiding van een gebouw met ten minste 1.000 m2 bruto-vloeroppervlakte of met een of meer woningen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.15.d
    text: de bouw van een gebouw dat geen hoofdgebouw als bedoeld onder b is, met ten minste 1.000 m2 bruto-vloeroppervlakte;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.15.e
    text: |-
      de verbouwing van een of meer aaneengesloten gebouwen die voor andere doeleinden in gebruik of ingericht waren,
      voor woondoeleinden, mits ten minste tien woningen worden gerealiseerd; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.15.f
    text: |-
      de verbouwing van een of meer aaneengesloten gebouwen die voor andere doeleinden in gebruik of ingericht waren,
      voor detailhandel, dienstverlening, kantoor of horecadoeleinden, mits de cumulatieve oppervlakte van de nieuwe
      functies ten minste 1.500 m2 bruto-vloeroppervlakte bedraagt.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16
    text: 'De kostensoorten, bedoeld in het tweede lid, aanhef, zijn:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.a
    text: |-
      de kosten van het vaststellen van een bestemmingsplan of het verlenen van een omgevingsvergunning voor een activiteit
      als bedoeld in [artikel 2.1, eerste lid, onder a of c, van de Wet algemene bepalingen omgevingsrecht][ref1],
      inclusief het daarvoor benodigde onderzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7ah.16.b
    text: |-
      de waarde van de gronden die worden gebruikt voor de uitvoering van de onder h en i bedoelde werken, werkzaamheden
      en maatregelen, inclusief de waarde van de te slopen opstallen, geraamd overeenkomstig het eenentwintigste lid;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.c
    text: |-
      de kosten van het vrijmaken van de gronden, bedoeld onder b, van persoonlijke rechten en lasten, eigendom en bezit
      en beperkte rechten of zakelijke lasten;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.d
    text: |-
      het tijdelijk beheer van de door of vanwege de gemeente verworven percelen, verminderd met de uit het tijdelijk
      beheer te verwachten opbrengsten;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.e
    text: |-
      de kosten van het slopen, verwijderen en verplaatsen van opstallen, obstakels, funderingen, kabels en leidingen op
      de gronden, bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.f
    text: |-
      de kosten van bodemsanering, het dempen van oppervlaktewateren en het verrichten van grondwerken op de gronden,
      bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.g
    text: |-
      de kosten van de noodzakelijke compensatie van in het kostenverhaalsgebied verloren gegane natuurwaarden,
      groenvoorzieningen en watervoorzieningen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.h
    text: 'de kosten van de volgende werken:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.h.1°
    text: |-
      wegen, gebouwde en ongebouwde openbare parkeergelegenheden, pleinen, voet- en rijwielpaden, gebouwde openbare
      fietsenstallingen, faciliteiten voor ondergrondse afvalinzameling, waterpartijen, watergangen, voorzieningen
      voor de waterhuishouding, bruggen, tunnels, duikers, kades, steigers en andere rechtstreeks met de aanleg daarvan
      verband houdende werken en bouwwerken;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.h.2°
    text: infrastructuur voor openbaar-vervoervoorzieningen met bijbehorende werken en bouwwerken;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.h.3°
    text: groenvoorzieningen, natuurvoorzieningen en openbare niet-commerciële sportvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.h.4°
    text: openbare verlichting en brandkranen met aansluitingen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.h.5°
    text: straatmeubilair, speeltoestellen, sierende elementen, kunstobjecten en afrasteringen in de openbare ruimte;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.h.6°
    text: distributienetwerken voor elektriciteit, warmte, gas en water, inclusief bijbehorende werken en bouwwerken;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.h.7°
    text: riolering, inclusief bijbehorende werken en bouwwerken;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.i
    text: |-
      de kosten van werken, werkzaamheden en maatregelen die noodzakelijk zijn voor het bereiken en in stand houden van
      een veilige en gezonde fysieke leefomgeving en een goede omgevingskwaliteit;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.j
    text: |-
      de kosten van voorbereiding en toezicht op de uitvoering van de onder c, e, f, h en i bedoelde werken,
      werkzaamheden en maatregelen, inclusief het daarvoor benodigde onderzoek;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.k
    text: |-
      tegemoetkoming van schade als bedoeld in [artikel 6.1 van de Wet ruimtelijke ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
  - number: 7ah.16.l
    text: |-
      niet-terugvorderbare BTW, niet-gecompenseerde compensabele BTW of andere niet-terugvorderbare belastingen, over de
      kostenelementen, genoemd onder a en c tot en met j;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.m
    text: de rente van geïnvesteerde kapitalen en overige lasten, verminderd met renteopbrengsten; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.16.n
    text: |-
      de kosten van andere door of in opdracht van het bevoegd gezag te verrichten werkzaamheden, voor zover die
      werkzaamheden rechtstreeks verband houden met de in dit lid bedoelde werken, werkzaamheden en maatregelen.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.17
    text: |-
      Als het bestemmingsplan, bedoeld in het eerste lid, voor de aangewezen kostenverhaalsgebieden een raming van de
      opbrengsten voor alle daarin gelegen gronden bevat, wordt bij die raming uitgegaan van de opbrengst van de locatie
      waar een bouwactiviteit wordt verricht in het jaar waarin de beschikking, bedoeld in het tiende lid, zal worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.18
    text: |-
      De waardevermeerdering, bedoeld in het achtste en twaalfde lid, en de opbrengsten, bedoeld in het zeventiende lid,
      worden geraamd op basis van objectief bepaalbare maatstaven.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.19
    text: |-
      De raming van de waardevermeerdering, bedoeld in het twaalfde lid, wordt vastgesteld door de geraamde opbrengst
      van de locatie waar de activiteit wordt verricht te verminderen met de raming van de inbrengwaarde van die locatie,
      waarbij tot de inbrengwaarde worden gerekend:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.19.a
    text: |-
      de waarde van de grond en de te slopen opstallen in de toestand voorafgaand aan het vaststellen van het
      bestemmingsplan;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.19.b
    text: |-
      de kosten van het vrijmaken van de grond van persoonlijke rechten en lasten, eigendom, bezit en beperkte rechten of
      zakelijke lasten;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.19.c
    text: de kosten van het slopen, verwijderen en verplaatsen van opstallen, obstakels, funderingen, kabels en leidingen; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.19.d
    text: de kosten van bodemsaneringswerkzaamheden, het dempen van oppervlaktewateren en het verrichten van grondwerken.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.20
    text: |-
      Tot de kosten, bedoeld in het negentiende lid, onder b, c en d, worden ook gerekend de kosten die voorafgaand
      aan het vaststellen van het bestemmingsplan zijn gemaakt en direct verband houden met de te verrichten
      bouwactiviteiten.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.21
    text: 'De raming van de inbrengwaarde, bedoeld in het negentiende lid, aanhef, wordt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.21.a
    text: |-
      met overeenkomstige toepassing van de [artikelen 40b tot en met 40f van de onteigeningswet][ref1], met dien
      verstande dat voor gronden die zijn onteigend of waarvoor een onteigeningsbeschikking is gegeven of die op
      onteigeningsbasis zijn of worden verworven, de inbrengwaarde gelijk is aan de schadeloosstelling ingevolge die
      [wet][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel40b
      [ref2]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 40b
      - id: ref2
        bwb_id: BWBR0001842
  - number: 7ah.21.b
    text: |-
      overeenkomstig de waarde die bij beschikking op grond van
      [artikel 22, eerste lid, van de Wet waardering onroerende zaken][ref1] is vastgesteld voor het kalenderjaar waarin
      de raming wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
  - number: 7ah.22
    text: |-
      Over de hoogte en de begrenzing van de kostensoorten, bedoeld in het zevende lid, onder a, c, j en n, kunnen bij
      ministeriële regeling regels worden gesteld. Daarbij kan onderscheid worden gemaakt naar het type locatie en de
      aard en omvang van de activiteit.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ah.23
    text: Dit artikel is van toepassing op de bij ministeriële regeling aangewezen plangebieden.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ah
  - number: 7ai.1
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
  - number: 7ai.1.a
    text: |-
      *geconcentreerd afvalwater:* afvalwater, dat afvalstoffen bevat bestaande uit uitwerpselen afkomstig van
      vacuümtoiletten of voedselresten als bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
  - number: 7ai.1.b
    text: |-
      *voedselresten:* afvalstoffen afkomstig van het bereiden van voedingsmiddelen en daarmee samenhangende
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
  - number: 7ai.2
    text: |-
      In aanvulling op [artikel 10.32a, eerste lid, aanhef en onder a, van de Wet milieubeheer][ref1] kan
      de gemeenteraad bij verordening bepalen dat bij het brengen van afvalwater afkomstig van het bereiden
      van voedingsmiddelen en daarmee samenhangende activiteiten in een voorziening voor de inzameling
      en het transport van afvalwater, wordt voldaan aan de in die verordening gestelde regels. In de
      verordening kan worden afgeweken van [artikel 6 van het Besluit lozing afvalwater huishoudens][ref2] en
      [artikel 3.131, derde lid, van het Activiteitenbesluit milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022910#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0022910
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7ai.3
    text: |-
      Indien toepassing wordt gegeven aan het tweede lid, geldt voor een afvoervoorziening voor afvalwater afkomstig
      van een opstelplaats voor een watercloset en van een opstelplaats voor een keukengootsteenbak voorzien van
      apparatuur voor het vermalen van voedselresten, in afwijking van de [artikelen 6.15, tweede lid][ref1], en
      [6.16, tweede lid, onder a en b, van het Bouwbesluit 2012][ref2], het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '6'
  - number: 7ai.3.a
    text: de afvoervoorziening is aangesloten op een vacuümleiding;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
  - number: 7ai.3.b
    text: |-
      gebouwgebonden vacuümleidingen hebben een diameter van ten minste 50 mm, waarbij niet wordt voorzien in een
      ontluchtingsleiding;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
  - number: 7ai.3.c
    text: vacuümleidingen voeren uitsluitend geconcentreerd afvalwater af; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
  - number: 7ai.3.d
    text: vacuümleidingen worden aangesloten op het vacuümriool.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
  - number: 7ai.4
    text: 'Dit artikel is tot 1 januari 2040 van toepassing op de volgende gebieden:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
  - number: 7ai.4.a
    text: |-
      Buiksloterham in de gemeente Amsterdam, zoals aangegeven op de kaart in [bijlage 188][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 7ai.4.b
    text: |-
      Strandeiland en Buiteneiland in de gemeente Amsterdam, zoals aangegeven op de kaart in [bijlage 189][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ai
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 7aj.1
    text: |-
      Dit artikel geldt tot 1 januari 2036 voor de Sluisbuurt in de gemeente Amsterdam, zoals aangegeven op de kaart
      in [bijlage 190][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 7aj.2
    text: |-
      In de [titels 10.4][ref1] en [10.6 van de Wet milieubeheer][ref2] wordt, in aanvulling op
      [artikel 1.1 van die wet][ref3], onder huishoudelijke afvalstoffen ook begrepen bedrijfsafvalstoffen voor zover
      deze de volgende fracties bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0003245
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 7aj.2.a
    text: afgedankte elektrische en elektronische apparatuur;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
  - number: 7aj.2.b
    text: bioafval;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
  - number: 7aj.2.c
    text: drankenkartons;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
  - number: 7aj.2.d
    text: glas;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
  - number: 7aj.2.e
    text: kunststof;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
  - number: 7aj.2.f
    text: metaal;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
  - number: 7aj.2.g
    text: papier;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
  - number: 7aj.2.h
    text: restafval; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
  - number: 7aj.2.i
    text: textiel.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
  - number: 7aj.3
    text: |-
      Indien de fracties, bedoeld in het tweede lid, door de oorspronkelijke leverancier als retourvracht kunnen worden
      meegenomen, is het tweede lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aj
  - number: 7ak.1
    text: |-
      In aanvulling op [artikel 10.32a, eerste lid, aanhef en onder a, van de Wet milieubeheer][ref1] kan de gemeenteraad
      bij verordening bepalen dat bij in die verordening aangegeven gevallen van het telen of het kweken van gewassen in
      een kas wordt voldaan aan de in die verordening gestelde regels bij het in een voorziening voor de inzameling en
      het transport van afvalwater brengen van:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 7ak.1.a
    text: drainwater;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
  - number: 7ak.1.b
    text: |-
      drainagewater afkomstig van een teelt waarbij gewassen op een bodem groeien die in verbinding staat met de
      ondergrond;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
  - number: 7ak.1.c
    text: spoelwater van filters van een waterdoseringsinstallatie; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
  - number: 7ak.1.d
    text: ander afvalwater, dat gewasbeschermingsmiddelen bevat.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
  - number: 7ak.2
    text: |-
      In de verordening, bedoeld in het eerste lid, kan worden afgeweken van
      [artikel 3.64a, eerste lid, van het Activiteitenbesluit milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7ak.3
    text: |-
      Indien toepassing wordt gegeven aan het tweede lid, is, in afwijking van
      [artikel 3.63, eerste lid, van het Activiteitenbesluit milieubeheer][ref1], het in een oppervlaktelichaam lozen
      van spoelwater van filters van een waterdoseringsinstallatie, drainwater en drainagewater afkomstig van een teelt
      waarbij gewassen op een bodem groeien die in verbinding staat met de ondergrond verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7ak.4
    text: |-
      In de verordening, bedoeld in het eerste lid, worden in ieder geval regels opgenomen die ertoe strekken dat
      de hoeveelheid gewasbeschermingsmiddelen, die met het bedrijfsafvalwater in het openbaar vuilwaterriool wordt
      gebracht, zoveel mogelijk wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
  - number: 7ak.5
    text: |-
      Indien toepassing wordt gegeven aan het tweede lid, geldt voor degene die het zuiveringtechnisch werk exploiteert,
      waarin het afvalwater, bedoeld in het eerste lid, wordt gebracht, in ieder geval het volgende:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
  - number: 7ak.5.a
    text: een aanvullende zuiveringsstap voor het verwijderen van nutriënten uit het afvalwater wordt ingevoerd;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
  - number: 7ak.5.b
    text: |-
      iedere zes maanden wordt aan burgemeester en wethouders gerapporteerd over de voortgang van het hergebruiken van
      het gezuiverde water; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
  - number: 7ak.5.c
    text: |-
      ieder kwartaal wordt aan burgemeester en wethouders bericht over de planning voor de oplevering van de
      zuiveringstechnologie en over de inspanningen die worden gepleegd om de opleveringsdatum te verkorten.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
  - number: 7ak.6
    text: |-
      Dit artikel is tot 1 januari 2024 van toepassing op glastuinbouwbedrijven in de gemeente Westland, die kunnen
      aantonen dat zij hun afvalwater via de nog te realiseren collectieve zuiveringsvoorziening bij de Nieuwe Waterweg
      zullen laten zuiveren.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ak
  - number: 7al.1
    text: |-
      In aanvulling op [artikel 4.1][ref1] juncto [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref2] kunnen
      provinciale staten bij verordening regels stellen omtrent de inhoud van bestemmingsplannen, die strekken tot het in
      onderlinge samenhang:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7al
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7al.1.a
    text: |-
      bereiken en in stand houden van een veilige en gezonde fysieke leefomgeving en een goede omgevingskwaliteit, ook
      vanwege de intrinsieke waarde van de natuur; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7al
  - number: 7al.1.b
    text: |-
      doelmatig beheren, gebruiken en ontwikkelen van de fysieke leefomgeving ter vervulling van maatschappelijke
      behoeften.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7al
  - number: 7al.2
    text: |-
      In afwijking van [artikel 4.1a, eerste lid, van de Wet ruimtelijke ordening][ref1] kan bij de verordening worden
      bepaald dat gedeputeerde staten, op verzoek van een bestuursorgaan van de gemeente, ontheffing kunnen verlenen
      van de krachtens het eerste lid vastgestelde regels, voor zover de uitoefening van de taak of bevoegdheid waarvoor
      ontheffing wordt gevraagd onevenredig wordt belemmerd in verhouding tot het belang dat wordt gediend met de regel
      waarvan ontheffing is gevraagd. Aan een ontheffing kunnen voorschriften worden verbonden. In de ontheffing kan
      worden bepaald dat deze geldt voor een daarbij gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7al
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
  - number: 7al.3
    text: |-
      Van de bevoegdheden, bedoeld in het eerste en tweede lid, kan gebruik worden gemaakt tot de inwerkingtreding van
      de [Omgevingswet][ref1]. Bestemmingsplannen kunnen met inachtneming van de verordening, bedoeld in het eerste
      lid, worden vastgesteld tot 1 januari 2026, mits het ontwerp van deze plannen ter inzage is gelegd voor de
      inwerkingtreding van de Omgevingswet.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7al
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 7al.4
    text: 'Dit artikel is van toepassing op de provincies:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7al
  - number: 7al.4.a
    text: Flevoland;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7al
  - number: 7al.4.b
    text: Gelderland;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7al
  - number: 7al.4.c
    text: Utrecht.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7al
  - number: '8.1'
    text: |-
      Als categorieën andere projecten van maatschappelijke betekenis als bedoeld in
      [artikel 2.9, eerste lid, onderdeel b, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
  - number: 8.1.a
    text: onderwijsgebouwen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel8
  - number: 8.1.b
    text: ziekenhuizen en verpleeghuizen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel8
  - number: 8.1.c
    text: verzorgingstehuizen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel8
  - number: 8.1.d
    text: psychiatrische inrichtingen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel8
  - number: 8.1.e
    text: medische centra;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel8
  - number: 8.1.f
    text: poliklinieken;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel8
  - number: 8.1.g
    text: medische kleuterdagverblijven; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel8
  - number: 8.1.h
    text: |-
      opwekking van duurzame energie als bedoeld in [bijlage I, onder 1, bij de wet][ref1],
      onverminderd de bevoegdheden van Onze Minister van Economische Zaken en Klimaat op grond van de
      [artikelen 9b, eerste lid, aanhef en onder a en b][ref2], en [9e, zesde lid, van de Elektriciteitswet 1998][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027431
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel9b
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel9e
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027431
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 9b
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 9e
  - number: '8.2'
    text: |-
      Indien een project als bedoeld in het eerste lid tevens voorziet in een beperkte mate van woningbouw, doet dat geen
      afbreuk aan de kwalificatie van het project als project van maatschappelijke betekenis als bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel8
  - number: '9'
    text: |-
      Als lokaal project met nationale betekenis als bedoeld in [artikel 2.18][ref1] juncto
      [artikel 2.19 van de wet][ref2] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027431
        artikel: '2'
  - number: 9.a
    text: |-
      FlorijnAs te Assen, omvattende de gebieden Stadsboulevard, het Stadsbedrijvenpark, het Havenkwartier, de Blauwe
      As 2e fase, het Stationsgebied, Assen-Zuid en het Nationaal landschap Drentsche Aa ten oosten van de stad zoals
      aangegeven op de kaart in [bijlage 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 9.b
    text: |-
      Rotterdam Central District omvattende de projecten Schiekadeblok, Weenapoint, Kruispleingarage, Delftseplein, OV
      Terminal, Conradstraat, Calypso zoals aangegeven op de kaart in [bijlage 6][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 9.c
    text: |-
      Stationsgebied Utrecht omvattende gebied 1 (Vredenburg-Catharijnesingel, Smakkelaarsveld/Nieuwe Stationsstraat, OV-
      terminal, Knoopkazerne, Van Sijpesteijnkwartier, Kop Jaarbeursterrein) en gebied 2 (Jaarbeurskwartier inclusief
      parkeerterrein en parkeergarage overzijde Merwedekanaal, Lombokplein en Paardenveld) zoals aangegeven op de kaart
      in [bijlage 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: '10'
    text: |-
      Onder besluiten als bedoeld in [artikel 1.1, eerste lid, onderdelen a en b, van de wet][ref1] worden in ieder geval
      niet verstaan besluiten omtrent planschade en nadeelcompensatie.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '1'
  - number: '11.1'
    text: |-
      Indien [afdeling 2 van hoofdstuk 1 van de wet][ref1] op een besluit van toepassing is, wordt dit bij het besluit en
      bij de bekendmaking of mededeling van het besluit vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Afdeling2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0027431
        afdeling: '2'
  - number: '11.2'
    text: |-
      Indien tegen het besluit beroep openstaat, wordt bij het besluit en bij de bekendmaking van het besluit voorts
      vermeld dat:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel11
  - number: 11.2.a
    text: de beroepsgronden in het beroepschrift worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel11
  - number: 11.2.b
    text: het beroep niet-ontvankelijk wordt verklaard, indien binnen de beroepstermijn geen gronden zijn ingediend, en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel11
  - number: 11.2.c
    text: deze na afloop van de beroepstermijn niet meer kunnen worden aangevuld.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel11
  - number: '12.1'
    text: |-
      Indien [afdeling 2 van hoofdstuk 1 van de wet][ref1] van toepassing is op het hoger beroep tegen een uitspraak van
      de rechtbank, wordt dit in de uitspraak vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Afdeling2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027431
        afdeling: '2'
  - number: '12.2'
    text: 'De uitspraak vermeldt voorts dat:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel12
  - number: 12.2.a
    text: de beroepsgronden in het beroepschrift worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel12
  - number: 12.2.b
    text: het beroep niet-ontvankelijk wordt verklaard, indien binnen de beroepstermijn geen gronden zijn ingediend, en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel12
  - number: 12.2.c
    text: deze na afloop van de beroepstermijn niet meer kunnen worden aangevuld.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel12
  - number: '15'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoering Crisis- en herstelwet.'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel16
