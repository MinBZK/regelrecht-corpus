      [artikel 2.20, tweede lid, van het Activiteitenbesluit milieubeheer][ref2] voor woningen en andere geluidsgevoelige
      gebouwen die reeds aanwezig waren op 1 juli 2012 niet voldaan hoeft te worden aan de in die artikelen opgenomen
