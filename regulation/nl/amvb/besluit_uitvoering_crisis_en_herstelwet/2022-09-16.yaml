  - number: '2.2'
    text: |-
      Als categorieën van gevallen als bedoeld in [artikel 2.3, negende lid, van de wet][ref1] worden aangegeven alle
      gevallen waarin een ander bestuursorgaan dan burgemeester en wethouders bevoegd zou zijn te beslissen als bedoeld
      in artikel 2.3, negende lid, van de wet.


