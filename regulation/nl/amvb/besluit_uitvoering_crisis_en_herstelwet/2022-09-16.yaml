        artikel: '15'
  - number: '7.1'
    text: |-
      In de jaarlijkse voortgangsrapportage over de uitvoering van de wet geeft Onze Minister, indien daartoe aanleiding
      bestaat, aan in hoeverre afwijkingen bij wege van experiment van het bepaalde bij of krachtens de betrokken in
      [artikel 2.4, eerste lid, van de wet][ref1] genoemde wetten aan haar doel beantwoorden en of de overeenkomstig
      artikel 2.4, derde lid, van de wet vastgestelde ten hoogste toegestane tijdsduur van die afwijkingen aanpassing
      behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
  - number: '7.2'
    text: |-
      Het eerste lid is niet van toepassing op het experiment duurzaam stortbeheer, bedoeld in
      [artikel 17b, eerste lid, van het Stortbesluit bodembescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel17b
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7
    references:
