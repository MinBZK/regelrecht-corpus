  - number: 7a.2
    text: |-
      Voor de in het experiment betrokken bestemmingsplannen geldt dat indien daarin onbenutte bouw- of
      gebruiksmogelijkheden worden wegbestemd, de planschade in ieder geval als voorzienbaar in de zin van artikel 6.3,
      aanhef en onder a, wordt aangemerkt, indien:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7a
  - number: 7a.2.a
    text: deze herziening ten minste drie jaar voor de vaststelling van het bestemmingsplan is aangekondigd;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7a
  - number: 7a.2.b
    text: van de voorgenomen herziening kennis is gegeven aan de eigenaren in het gebied, en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7a
  - number: 7a.2.c
    text: gedurende deze termijn de mogelijkheid bestond de bouw- of gebruiksmogelijkheden te realiseren.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7a
  - number: 7a.3
    text: |-
      In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref1] wordt de bestemming van gronden,
      met inbegrip van de met het oog daarop gestelde regels, binnen een periode van twintig jaar opnieuw vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7a.4
    text: |-
      In afwijking van [artikel 3.2 van de Wet ruimtelijke ordening][ref1] geldt een voorlopige bestemming voor een
      termijn van ten hoogste tien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7a
    references:
