  - number: 7o.2
    text: |-
      In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref1], respectievelijk
      [artikel 3.26][ref2] juncto artikel 3.1, tweede lid, van de Wet ruimtelijke ordening in verbinding met
      [artikel 9e van de Elektriciteitswet 1998][ref3], respectievelijk [artikel 3.28][ref4] juncto artikel 3.1, tweede
      lid, van de Wet ruimtelijke ordening in verbinding met [artikel 9b van de Elektriciteitswet 1998][ref5], wordt de
      bestemming van gronden waaraan tevens een voorlopige bestemming voor een windturbine is toegekend, met inbegrip
      van de met het oog op de toegekende bestemmingen gestelde regels, binnen een periode van vijfendertig jaar opnieuw
      vastgesteld. Artikel 3.1, derde tot en met vijfde lid, van de Wet ruimtelijke ordening is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel9e
