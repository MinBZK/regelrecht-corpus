      exploitatieplan;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
    references:
