        afdeling: '3.4'
  - number: 7c.11.c
    text: daarvoor in het bestemmingsplan een of meer exploitatiegebieden worden aangewezen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
  - number: 7c.11.d
    text: |-
      in aanvulling op [artikel 2.10, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1]
      de omgevingsvergunning voor het bouwen kan worden geweigerd als de exploitatieopzet als bedoeld in
      [artikel 6.13, eerste lid, onder c, van de Wet ruimtelijke ordening][ref2], een tekort bevat, dat niet is gedekt;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6'
  - number: 7c.11.e
    text: |-
      als de omgevingsvergunning voor het bouwen wordt geweigerd, de exploitatieopzet als bedoeld in onderdeel d, deel
      uitmaakt van dat besluit.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
  - number: 7c.12
    text: |-
      [Artikel 8.42b van de Wet milieubeheer][ref1] en [artikel 2.19 van het Activiteitenbesluit milieubeheer][ref2] zijn
      op het bestemmingsplan van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 7c.13
    text: |-
      De raad kan de bevoegdheid tot het vaststellen van delen van het bestemmingsplan delegeren aan burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
  - number: 7c.14
    text: |-
      In aanvulling op [artikel 3.6, eerste lid, onder c, van de Wet ruimtelijke ordening][ref1] kan bij het
      bestemmingsplan worden bepaald dat het met het oog op de regels bedoeld in het eerste lid verboden is
      zonder omgevingsvergunning, gronden of bouwwerken te gebruiken voor een daarbij aangegeven activiteit,
      als de activiteit niet in strijd is met het bestemmingsplan. Voor toepassing van deze bepaling in de
      [Wet algemene bepalingen omgevingsrecht][ref2] wordt deze vergunning aangemerkt als een vergunning als bedoeld
      in [artikel 2.1, eerste lid, onder c, van die wet][ref3]. De vergunning wordt verleend als wordt voldaan aan de
      daartoe in het bestemmingsplan gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7c.15
    text: |-
      In afwijking van [artikel 2.8, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1] juncto
      [artikel 3.2, aanhef en onderdeel b, van de Regeling omgevingsrecht][ref2] verstrekt de aanvrager
      in of bij de aanvraag om een vergunning voor het gebruiken van gronden of bouwwerken, bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder c, van die wet][ref3], gegevens en bescheiden over de gevolgen van het
      beoogde gebruik voor de fysieke leefomgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7c.16
    text: |-
      In afwijking van [artikel 2.12, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1]
      kan een omgevingsvergunning die betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder c, van die wet][ref2] worden verleend als de activiteit niet in strijd is met de
      regels, bedoeld in het eerste lid.


