        artikel: '2'
  - number: 6g.1
    text: |-
      Dit artikel is tot de inwerkingtreding van de [Omgevingswet][ref1] van toepassing op de gemeenten Almere, Delft,
      Eindhoven, Haarlem, Haarlemmermeer, Hoogeveen, Hulst, Schijndel en Zoetermeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6g
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 6g.2
    text: |-
      [Artikel 2.10, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref1] is niet
      van toepassing, indien een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van die wet][ref2] betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6g
