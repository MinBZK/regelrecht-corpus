  - number: 7c.1
    text: |-
      In aanvulling op [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref1] kunnen in het bestemmingsplan ook
      regels worden gesteld, die strekken ten behoeve van het:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7c.1.a
    text: bereiken en in stand houden van een veilige en gezonde fysieke leefomgeving en een goede omgevingskwaliteit, en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
  - number: 7c.1.b
    text: |-
      doelmatig beheren, gebruiken en ontwikkelen van de fysieke leefomgeving ter vervulling van maatschappelijke
      functies.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
  - number: 7c.2
    text: |-
      In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref1] wordt de bestemming van gronden,
      met inbegrip van de met het oog daarop gestelde regels, binnen een periode van twintig jaar opnieuw vastgesteld.
      Artikel 3.1, derde tot en met vijfde lid, van de Wet ruimtelijke ordening is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7c.3
    text: |-
      In afwijking van [artikel 3.2 van de Wet ruimtelijke ordening][ref1] geldt een voorlopige bestemming voor een
      termijn van ten hoogste tien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
    references:
      - id: ref1
