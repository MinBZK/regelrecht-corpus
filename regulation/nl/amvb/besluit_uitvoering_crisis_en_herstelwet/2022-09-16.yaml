        artikel: '6'
  - number: 7w.2
    text: |-
      Het eerste lid is niet van toepassing op schade in de vorm van een vermindering van de waarde van een
      onroerende zaak als de schade het rechtstreekse gevolg is van de wijziging van de bestemming van de tot
      de onroerende zaak behorende grond of van de op onroerende zaak betrekking hebbende regels als bedoeld in
      [artikel 3.1 van de Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7w
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7w.3
    text: 'De aanvrager heeft het risico op het ontstaan van schade in ieder geval niet aanvaard als:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7w
  - number: 7w.3.a
    text: |-
      de aanvrager overeenkomstig [artikel 2, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] tot koop is
      overgegaan van een tot woning bestemde onroerende zaak na de vaststelling of wijziging van het bestemmingsplan,
      bedoeld in [artikel 7c, zeventiende lid, onder uuu][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027929#Artikel7c
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7w
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027929
        artikel: 7c
        paragraaf: '3'
  - number: 7w.3.b
    text: de schade bestaat uit waardevermindering van de onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7w
  - number: 7w.4
    text: |-
      De schade die bestaat uit waardevermindering van de onroerende zaak wordt bepaald aan de hand van een vergelijking
      van de waarde van de onroerende zaak onmiddellijk voor en na het tijdstip waarop het bevoegd gezag mededeling heeft
      gedaan van het besluit tot het verlenen of wijzigen van de omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7w
  - number: 7x
    text: |-
      In het gebied Oosterwold in de gemeenten Almere en Zeewolde, zoals aangegeven op de kaart in [bijlage 37][ref1],
      kan het bevoegd gezag, in afwijking van [artikel 3.12 van de Activiteitenregeling milieubeheer][ref2], in het
      bestemmingsplan als bedoeld in [artikel 7c, zeventiende lid, onder a][ref3], van dit besluit, regels opnemen ter
      voorkoming of beperking van slagschaduw en lichtschittering ter plaatse van gevoelige objecten, als bedoeld in
      [artikel 1 van het Activiteitenbesluit milieubeheer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0027929
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0027929#Artikel7c
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7x
    references:
      - id: ref1
        bwb_id: BWBR0027929
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0027929
        artikel: 7c
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0022762
        artikel: '1'
  - number: 7y.1
    text: |-
      Dit artikel geldt voor de duur van vijf jaar, te rekenen vanaf een bij koninklijk besluit te bepalen datum, voor
      het gebied «De negen straatjes» in Amsterdam, zoals aangegeven op de kaart in [bijlage 183][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7y
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 7y.2
    text: |-
      In aanvulling op [artikel 1.1 van de Wet milieubeheer][ref1] wordt onder huishoudelijke afvalstoffen ook begrepen
      bedrijfsafvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7y
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 7z.1
    text: |-
      Dit artikel is tot 1 januari 2031 van toepassing in de gemeenten Nederweert en Someren ten behoeve van
      het wegnemen van overschrijdingen van de grenswaarden voor zwevende deeltjes (PM) zoals opgenomen in
      [bijlage 2 bij de Wet milieubeheer][ref1], door veehouderijen. Daartoe kunnen de in dit artikel opgenomen
      bevoegdheden worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7z
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 7z.2
    text: |-
      Burgemeester en wethouders kunnen [artikel 5.16, eerste lid, onder b, van de Wet milieubeheer][ref1] buiten
      toepassing laten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7z
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 7z.3
    text: |-
      In afwijking van [artikel 5.13a van het Besluit omgevingsrecht][ref1]
      kunnen aan een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder i, van de Wet algemene bepalingen omgevingsrecht][ref2] voorschriften
      worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7z
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7z.4
    text: |-
      In aanvulling op
      [artikel 2.31, tweede lid, aanhef en onderdelen b en c, van de Wet algemene bepalingen omgevingsrecht][ref1]
      kunnen burgemeester en wethouders de voorschriften van een omgevingsvergunning
      wijzigen als deze betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, of i, van de Wet algemene bepalingen omgevingsrecht][ref2] en de
      grenswaarden voor zwevende deeltjes (PM) zoals opgenomen in [bijlage 2 bij de Wet milieubeheer][ref3] worden
      overschreden. [Artikel 2.31a van de Wet algemene bepalingen omgevingsrecht][ref4] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003245
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7z
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003245
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7z.5
    text: |-
      In aanvulling op
      [artikel 2.33, tweede lid, aanhef en onderdelen d en f, van de Wet algemene bepalingen omgevingsrecht][ref1]
      kunnen burgemeester en wethouders een omgevingsvergunning geheel of gedeeltelijk
      intrekken als deze betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, of i, van de Wet algemene bepalingen omgevingsrecht][ref2] en de
      grenswaarden voor zwevende deeltjes (PM) zoals opgenomen in [bijlage 2 bij de Wet milieubeheer][ref3] worden
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7z
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003245
  - number: 7z.6
    text: |-
      In aanvulling op [artikel 7 van het Besluit emissiearme huisvesting][ref1] kunnen burgemeester en wethouders bij
      besluit voorschrijven dat in dierenverblijven die zijn opgericht voor, op of na 1 juli 2015 huisvestingssystemen
      voor landbouwhuisdieren worden toegepast met een emissiefactor voor zwevende deeltjes (PM) die lager is dan
      de maximale emissiewaarde voor zwevende deeltjes (PM) die voor de betreffende diercategorie is vermeld in
      [bijlage 2 bij het Besluit emissiearme huisvesting][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036748#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0036748
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7z
    references:
      - id: ref1
        bwb_id: BWBR0036748
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0036748
  - number: 7z.7
    text: |-
      In afwijking van [artikel 2, aanhef en onder b, van het Besluit emissiearme huisvesting][ref1] is het bepaalde in
      het zesde lid ook van toepassing op huisvestingssystemen voor landbouwhuisdieren die worden gehouden overeenkomstig
      de biologische productiemethode.


      [ref1]: https://wetten.overheid.nl/BWBR0036748#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7z
    references:
      - id: ref1
        bwb_id: BWBR0036748
        artikel: '2'
  - number: 7aa.1
    text: |-
      Dit artikel is tot de inwerkingtreding van de [Omgevingswet][ref1] van toepassing binnen de provincies Gelderland,
      Limburg, Noord-Brabant en Overijssel.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 7aa.2
    text: |-
      In aanvulling op [artikel 2, zesde lid][ref1] en [bijlage I bij de Regeling geurhinder en veehouderij][ref2] kan
      het bestuursorgaan dat bevoegd zou zijn of is om een omgevingsvergunning voor de betrokken inrichting te verlenen
      voor een huisvestingssysteem dat niet in bijlage 1 van deze regeling is opgenomen op aanvraag een bijzondere
      geuremissiefactor vaststellen die bij de berekening van het aantal odour units per seconde per dier van een
      diercategorie als bedoeld in artikel 2, zesde lid, van deze regeling wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0020711#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020711
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
    references:
      - id: ref1
        bwb_id: BWBR0020711
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020711
  - number: 7aa.3
    text: |-
      Het bestuursorgaan dat bevoegd zou zijn of is om een omgevingsvergunning voor de betrokken inrichting te verlenen
      kan een bijzondere geuremissiefactor vaststellen indien naar zijn oordeel:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
  - number: 7aa.3.a
    text: |-
      toepassing van het huisvestingssysteem voldoende bijdraagt aan de ontwikkeling van innovatieve stalsystemen voor de
      reductie van geur;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
  - number: 7aa.3.b
    text: |-
      de verwachte emissie van het huisvestingssysteem minimaal 10% lager is dan de geuremissiefactor die is opgenomen
      voor overige huisvesting voor die diercategorie in [bijlage 1 bij de Regeling geurhinder en veehouderij][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020711
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
    references:
      - id: ref1
        bwb_id: BWBR0020711
  - number: 7aa.3.c
    text: het huisvestingssysteem zich leent voor toepassing in de praktijk;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
  - number: 7aa.3.d
    text: de controleerbaarheid van de werking van het huisvestingssysteem voldoende is gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
  - number: 7aa.3.e
    text: |-
      voldoende is gewaarborgd dat de geuremissie overeenkomstig het Protocol voor meting van geuremissie uit
      huisvestingssystemen in de veehouderij 2010 of een gelijkwaardige methode wordt gemeten en dat over de wijze van
      meten en de resultaten van de metingen aan hem wordt gerapporteerd.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
  - number: 7aa.4
    text: |-
      In aanvulling op [artikel 2.2a van het Besluit omgevingsrecht][ref1] wordt aangewezen als categorie activiteiten
      als bedoeld in [artikel 2.1, eerste lid, onder i, van de Wet algemene bepalingen omgevingsrecht][ref2], voor zover
      deze plaatsvindt binnen een inrichting als bedoeld in [artikel 1.1, derde lid, van de Wet milieubeheer][ref3], niet
      zijnde een inrichting als bedoeld in [artikel 1.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref4]
      het oprichten of wijzigen van een dierenverblijf met een huisvestingssysteem waarvoor een bijzondere
      geuremissiefactor als bedoeld in het tweede lid is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '1'
  - number: 7aa.5
    text: |-
      In aanvulling op [artikel 5.13b van het Besluit omgevingsrecht][ref1] kan een omgevingsvergunning voor de categorie
      activiteiten als bedoeld in het vierde lid worden geweigerd in het belang van bescherming van de leefomgeving tegen
      geurhinder.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5'
  - number: 7aa.6
    text: |-
      In afwijking van [artikel 5.13a van het Besluit omgevingsrecht][ref1] kunnen aan een omgevingsvergunning voor de
      categorie activiteiten, bedoeld in het vierde lid, voorschriften worden verbonden in het belang van de bescherming
      van de fysieke leefomgeving tegen geurhinder.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5'
  - number: 7aa.7
    text: |-
      In aanvulling op [artikel 2.31, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1] wijzigt het
      bevoegd gezag de voorschriften van een omgevingsvergunning als deze betrekking heeft op een activiteit als bedoeld
      in [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref2] of de categorie activiteiten, bedoeld in het
      vierde lid, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7aa.7.a
    text: |-
      uit metingen blijkt dat de geuremissie in odour units per seconde per dier hoger is dan de op grond van het tweede
      lid vastgestelde bijzondere geuremissiefactor;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
  - number: 7aa.7.b
    text: niet binnen twee jaar nadat het huisvestingssysteem is opgericht, metingen zijn uitgevoerd; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
  - number: 7aa.7.c
    text: aanvullende maatregelen nodig zijn voor een goede werking van het huisvestingssysteem.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
  - number: 7aa.8
    text: |-
      In aanvulling op
      [artikel 2.33, tweede lid, aanhef en onder d en f, van de Wet algemene bepalingen omgevingsrecht][ref1] kan het
      bevoegd gezag een omgevingsvergunning geheel of gedeeltelijk intrekken als deze betrekking heeft op een activiteit,
      bedoeld in [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref2] of de categorie activiteiten, bedoeld in
      het vierde lid, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7aa.8.a
    text: |-
      uit metingen blijkt dat de geuremissie in odour units per seconde per dier hoger is dan de op grond van het tweede
      lid vastgestelde bijzondere geuremissiefactor; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
  - number: 7aa.8.b
    text: niet binnen twee jaar nadat het huisvestingssysteem is opgericht, metingen zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
  - number: 7aa.9
    text: Indien toepassing wordt gegeven aan het achtste lid wordt het besluit bedoeld in tweede lid ingetrokken.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
  - number: 7aa.10
    text: |-
      In aanvulling op [artikel 6.19 van het Besluit omgevingsrecht][ref1] wordt als categorie van gevallen als bedoeld
      in [artikel 3.9, derde lid, tweede volzin, van de Wet algemene bepalingen omgevingsrecht][ref2] aangewezen de
      beslissing op een aanvraag om een omgevingsvergunning voor activiteiten als bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7aa
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
  - number: 7ab.1
    text: 'Dit artikel is van toepassing op de gebieden:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ab
  - number: 7ab.1.a
    text: |-
      Haven 8 en Oostelijke Insteekhaven in Waalwijk, zoals aangegeven op de kaart in [bijlage 184][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ab
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 7ab.1.b
    text: |-
      en Heesch-West in ’s-Hertogenbosch en Bernheze, zoals aangegeven op de kaart in [bijlage 186][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ab
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 7ab.2
    text: |-
      In afwijking van [artikel 1.1 van het Activiteitenbesluit milieubeheer][ref1] geldt voor bedrijfsgebouwen als
      bedoeld in [artikel 1, onder b, onder g, van het Besluit externe veiligheid inrichtingen][ref2] waarbinnen een
      logistieke functie wordt uitgeoefend gecombineerd met een kantoorfunctie, als bedoeld in artikel 1, onderdeel
      l, onder c, aanhef en onder 1°, van het Besluit externe veiligheid inrichtingen dat dit kwetsbare objecten zijn,
      uitsluitend voor zover het gaat om die kantoorfunctie.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ab
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '1'
  - number: 7ad.1
    text: |-
      In afwijking van [artikel 1.1.1, eerste lid, aanhef en onder e, van het Besluit ruimtelijke ordening][ref1]
      geldt voor een sociale koopwoning de kostengrens, zoals vastgesteld in de Voorwaarden en Normen Nationale
      Hypotheekgarantie, als de ten hoogste koopprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ad
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: '1'
  - number: 7ad.2
    text: |-
      In afwijking van [artikel 3.1.2, vierde lid, van het Besluit ruimtelijke ordening][ref1] kan de gemeenteraad,
      indien een bestemmingsplan regels bevat ten aanzien van sociale koopwoningen, na regionale afstemming een lagere
      koopprijs vaststellen dan de ten hoogste koopprijs, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ad
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: '3'
  - number: 7ad.3
    text: |-
      Dit artikel is, voor zover de bestemmingsplannen, waarin toepassing is gegeven aan het eerste of tweede lid, worden
      vastgesteld voor 1 januari 2026 en het ontwerp van deze plannen ter inzage is gelegd voor de inwerkingtreding van
      de [Omgevingswet][ref1], van toepassing op de gemeenten:


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ad
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 7ad.3.a
    text: Aalsmeer;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7ad
