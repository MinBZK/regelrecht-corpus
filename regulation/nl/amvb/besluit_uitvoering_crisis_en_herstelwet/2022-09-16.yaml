  - number: 7o.3
    text: |-
      In afwijking van [artikel 3.2][ref1], respectievelijk [artikel 3.26][ref2] juncto artikel 3.2, tweede
      lid, van de Wet ruimtelijke ordening in verbinding met [artikel 9e van de Elektriciteitswet 1998][ref3]
      respectievelijk [artikel 3.28][ref4] juncto artikel 3.2 van de Wet ruimtelijke ordening in verbinding met
      [artikel 9b van de Elektriciteitswet 1998][ref5], geldt de voorlopige bestemming voor een termijn van tussen de
      vijfentwintig en dertig jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel9e
