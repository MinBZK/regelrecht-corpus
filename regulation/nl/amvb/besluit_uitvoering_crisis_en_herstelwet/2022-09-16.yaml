        artikel: '9'
  - number: 6g.5.c
    text: |-
      een krachtens een provinciale of gemeentelijke verordening aangewezen monument dan wel een monument waarop, voordat
      het is aangewezen, een zodanige verordening van overeenkomstige toepassing is; of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6g
  - number: 6g.5.d
    text: |-
      beschermde stads- en dorpsgezichten als bedoeld in [artikel 35 van de Monumentenwet 1988][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel35
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6g
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '35'
  - number: 6h
    text: |-
      In afwijking van [artikel 3.5, eerste volzin, van de Wet ruimtelijke ordening][ref1] kunnen binnen de provincie
      Flevoland vóór 15 mei 2019 bij een bestemmingsplan gebieden worden aangewezen waarbinnen de daar aanwezige
      windturbines, die economisch of technisch zijn afgeschreven, dienen te worden gemoderniseerd of vervangen door
      windturbines met meer bouwmassa.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6h
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 6i.1
    text: |-
      [Artikel 2.10, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref1] is niet van toepassing,
      indien de aanvraag betrekking heeft op een nieuw te bouwen grondgebonden woning waarvoor een waarborgcertificaat op
      basis van het keurmerk van de Stichting Garantiewoning is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6i
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6i.2
    text: |-
      Dit artikel is tot 20 september 2019 van toepassing op de gemeenten Delft, Den Haag, Eindhoven, Rotterdam en Sint
      Anthonis.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6i
  - number: 6j.1
    text: |-
      Het verbod uit [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref1]
      geldt, voor zover het gaat om de gronden, bedoeld in [artikel 2.10, eerste lid, onder b, c of d, van die wet][ref2],
      tot 1 september 2025 niet voor een bouwactiviteit als bedoeld in het derde lid die wordt
      uitgevoerd onder verantwoordelijkheid van een architect of een dienstverrichter als bedoeld in
      [artikel 1 van de Wet op de architectentitel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '1'
  - number: 6j.2
    text: |-
      In afwijking van het eerste lid geldt het verbod uit
      [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref1] tot de
      inwerkingtreding van de [Omgevingswet][ref2] niet voor een bouwactiviteit als bedoeld in het derde lid
      die wordt uitgevoerd onder verantwoordelijkheid van een architect of een dienstverrichter als bedoeld in
      [artikel 1 van de Wet op de architectentitel][ref3] die voldoet aan de in het vierde lid genoemde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037885
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '1'
  - number: 6j.3
    text: 'De bouwactiviteit bestaat uit de realisatie van:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6j.3.a
    text: een of twee eengezinswoningen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6j.3.b
    text: |-
      een op de grond staand bijbehorend bouwwerk als bedoeld in
      [artikel 1, eerste lid, van bijlage II bij het Besluit omgevingsrecht][ref1], mits niet hoger dan tien meter;


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 6j.3.c
    text: een dakopbouw waarbij geen extra woningen worden gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6j.3.d
    text: een dakterras;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6j.3.e
    text: een dakkapel, of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6j.3.f
    text: de splitsing of samenvoeging van woningen, mits geen verandering van de bouwconstructie plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6j.4
    text: |-
      Eisen als bedoeld in het tweede lid houden in dat de architect of de dienstverrichter als bedoeld in
      [artikel 1 van de Wet op de architectentitel][ref1] voldoet aan de door de raad gestelde eisen met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '1'
  - number: 6j.4.a
    text: |-
      de benodigde beroepservaring, vakkennis, vaardigheden en inzicht op het gebied van toetsing van en toezicht houden
      op de uitvoering van de bouwregelgeving, en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6j.4.b
    text: de wijze waarop de toetsing en het toezicht op de bouwactiviteiten plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6j.5
    text: |-
      Onder het in het eerste en tweede lid bedoelde uitvoeren van een bouwactiviteit onder verantwoordelijkheid van een
      architect of dienstverrichter zoals bedoeld in [artikel 1 van de Wet op de architectentitel][ref1] worden tenminste
      de volgende verplichtingen voor die architect of dienstverrichter begrepen:


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '1'
  - number: 6j.5.a
    text: |-
      indien het tweede lid van toepassing is, heeft de architect vanaf de opdrachtverlening tot en met de oplevering van
      het bouwwerk opdracht voor het ontwerp en het toezicht op het bouwwerk en draagt er zorg voor dat de werkzaamheden
      in het kader van kwaliteitsborging zo worden uitgevoerd zodat het gerechtvaardigd vertrouwen ontstaat dat het
      eindresultaat van de bouwwerkzaamheden voldoet aan de daarvoor geldende regelgeving;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6j.5.b
    text: |-
      de architect meldt binnen drie weken voor de start van de uitvoering van de bouwactiviteit aan burgemeester
      en wethouders dat voor die activiteit toepassing wordt gegeven aan dit artikel en aan de daarvoor door de raad
      gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6j.5.c
    text: |-
      binnen drie weken na de oplevering van de bouwactiviteiten door de bouwer overlegt de architect een opleverdossier
      aan burgemeester en wethouders dat voldoet aan de daaraan door de raad gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6j.6
    text: Dit artikel is van toepassing op de door burgemeester en wethouders van de gemeente Rotterdam aangewezen locaties.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6j
  - number: 6k
    text: |-
      Het in [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref1]
      bedoelde verbod geldt in de gemeente Peel en Maas tot 24 september 2021 niet voor een bouwactiviteit
      bestaande uit de realisatie van een bouwwerk voor de ondergrondse opslag van uit energiewinning verkregen
      ijs bij woningen, met een maximale inhoud van 30 m3, mits dit bouwwerk niet onder een gebouw als bedoeld in
      [artikel 1 van de Woningwet][ref2] wordt aangelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6k
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 6l.1
    text: |-
      [Artikel 6.10 van het Bouwbesluit 2012][ref1] is tot 24 september 2021 niet van toepassing op nieuw te bouwen
      woningen in Giel Peetershof in Peel en Maas, zoals aangegeven op de kaart in [bijlage 92][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6l
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0027929
  - number: 6l.2
    text: |-
      [Artikel 6.10, tweede lid, van het Bouwbesluit 2012][ref1] is vanaf het moment van inwerkingtreding van dit besluit
      (Besluit uitvoering Crisis- en herstelwet vijftiende tranche) voor de duur van vijf jaar niet van toepassing op
      nieuwe woningen in Haven-Stad in Amsterdam, zoals aangegeven op de kaart in [bijlage 93][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6l
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0027929
  - number: 6m
    text: |-
      Voor het project The Green Village in de gemeente Delft, zoals aangegeven op de kaart in [bijlage 89][ref1], geldt
      tot 24 september 2026 dat:


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6m
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 6m.a
    text: |-
      kan worden afgeweken van het [Bouwbesluit 2012][ref1], met uitzondering van de [hoofdstukken 1][ref2] en [2][ref3]
      en de [afdelingen 6.5 tot en met 6.8][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0030461
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0030461#Afdeling6.5
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6m
    references:
      - id: ref1
        bwb_id: BWBR0030461
      - id: ref2
        bwb_id: BWBR0030461
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0030461
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0030461
        afdeling: '6.5'
  - number: 6m.b
    text: |-
      de [artikelen 2.4, tweede lid][ref1], en
      [2.14, eerste lid, onderdeel c, onder 1°, van de Wet algemene bepalingen omgevingsrecht][ref2] niet van toepassing
      zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6m
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6m.c
    text: |-
      het bepaalde krachtens [artikel 2.8 van de Wet algemene bepalingen omgevingsrecht][ref1] juncto
      [artikel 4.1 van de Regeling omgevingsrecht][ref2] niet van toepassing is voor zover die artikelen een omschrijving
      van de activiteiten of mogelijke maatregelen vereisen;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel4
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6m
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '4'
  - number: 6m.d
    text: |-
      het verbod uit [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref1]
      voor een bouwactiviteit niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6m
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6n
    text: |-
      Voor het project Binnenstad in de gemeente Hulst, zoals aangegeven op de kaart in [bijlage 98][ref1], geldt tot
      28 oktober 2021 dat:


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6n
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 6n.a
    text: |-
      de [artikelen 3.74][ref1] en [3.75, eerste, tweede en derde lid van het Bouwbesluit 2012][ref2] zijn niet van
      toepassing op een bouwactiviteit voor woningen;


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6n
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '3'
  - number: 6n.b
    text: |-
      in afwijking van [artikel 4.31, tweede lid, van het Bouwbesluit 2012][ref1] geldt geen maximum voor de in dat
      artikel bedoelde gebruiksoppervlakte;


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6n
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
  - number: 6n.c
    text: |-
      [afdeling 4.6 van het Bouwbesluit 2012][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Afdeling4.6
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6n
    references:
      - id: ref1
        bwb_id: BWBR0030461
        afdeling: '4.6'
  - number: 6o.1
    text: |-
      Dit artikel is tot 29 november 2023 van toepassing op de gronden van het attractiepark De Efteling in Loon op Zand,
      zoals aangegeven op de kaart in [bijlage 130][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 6o.2
    text: |-
      In aanvulling op artikel 3 van [bijlage II bij het Besluit omgevingsrecht][ref1] is een omgevingsvergunning voor een
      activiteit als bedoeld in [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref2]
      niet vereist, indien deze activiteit betrekking heeft op een project dat geheel bestaat uit het bouwen van een
      bouwwerk of wijziging of uitbreiding daarvan, en aan de volgende voorwaarden voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0027464
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
    references:
      - id: ref1
        bwb_id: BWBR0027464
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6o.2.a
    text: het bouwwerk is niet hoger dan 5 meter;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
  - number: 6o.2.b
    text: het bouwwerk ligt of komt te liggen op een afstand van meer dan 10 meter vanaf openbaar toegankelijk gebied;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
  - number: 6o.2.c
    text: |-
      de oppervlakte van het bouwwerk bedraagt niet meer dan 150 m2, met uitzondering van overkappingen die onlosmakelijk
      verbonden zijn met attracties, gelegen binnen het gebied het Sprookjesbos, zoals aangegeven op de kaart in
      [bijlage 131][ref1], waarvoor een maximale oppervlakte van 50 m2 per overkapping geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 6o.2.d
    text: het bouwwerk is incidenteel toegankelijk voor onderhoud;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
  - number: 6o.2.e
    text: |-
      het bouwwerk is niet toegankelijk voor het publiek, met uitzondering van de ruimte onder overkappingen, zoals
      bedoeld onder c.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
  - number: 6o.3
    text: |-
      De in onderdeel c van het tweede lid genoemde maximale oppervlakte van 150 m2 voor bouwwerken, niet zijnde
      overkappingen mag alleen worden overschreden indien dit niet in strijd is met het op die gronden geldende
      bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
  - number: 6o.4
    text: |-
      In aanvulling op artikel 2 van [bijlage II bij het Besluit omgevingsrecht][ref1]
      is een omgevingsvergunning voor activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder a of c, van de Wet algemene bepalingen omgevingsrecht][ref2] niet vereist, indien
      deze activiteiten betrekking hebben op een bouwwerk ten behoeve van een infrastructurele of openbare voorziening,
      voor zover het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0027464
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
    references:
      - id: ref1
        bwb_id: BWBR0027464
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6o.4.a
    text: |-
      een bouwwerk ten behoeve van een nutsvoorziening of het telecommunicatieverkeer, mits voldaan wordt aan de volgende
      eisen:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
  - number: 6o.4.a.1
    text: niet hoger dan 3 meter, en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
  - number: 6o.4.a.2
    text: de oppervlakte niet meer dan 15 m2,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
  - number: 6o.4.b
    text: straatmeubilair.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6o
  - number: 6p.1
    text: 'Dit artikel is van toepassing op de volgende gemeenten of gebieden:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
  - number: 6p.1.a
    text: |-
      Bloemendaal, Blekersveld, zoals aangegeven op de kaart in [bijlage 168][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 6p.1.b
    text: Enschede;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
  - number: 6p.1.c
    text: |-
      Giessenlanden, Bedrijventerrein Betonson, zoals aangegeven op de kaart in [bijlage 80][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 6p.1.d
    text: |-
      Gooise Meren, Laren en Hilversum, Crailo, zoals aangegeven op de kaart in [bijlage 169][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 6p.1.e
    text: Harderwijk;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
  - number: 6p.1.f
    text: Leusden;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
  - number: 6p.1.g
    text: Zaanstad;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
  - number: 6p.1.h
    text: |-
      Zuidhorn, Woongebied Tussen de Gasten, zoals aangegeven op de kaart in [bijlage 165][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 6p.2
    text: |-
      In afwijking van [artikel 5.2 van het Bouwbesluit 2012][ref1] geldt voor te bouwen woningen een
      energieprestatiecoëfficiënt van 0,2, mits de aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de Wet algemene bepalingen omgevingsrecht][ref2] na inwerkingtreding van
      dit besluit en uiterlijk 31 december 2020 is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6p.3
    text: |-
      In aanvulling op [artikel 8 van de Woningwet][ref1] kunnen tot en met 31 december 2020 in
      de bouwverordening, in afwijking van [artikel 5.2 van het Bouwbesluit 2012][ref2], voor te
      bouwen gebruiksfuncties waarvoor een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de Wet algemene bepalingen omgevingsrecht][ref3] vereist is,
      voorschriften worden opgenomen die voorzien in een lagere energieprestatiecoëfficiënt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6p.4
    text: |-
      In aanvulling op [artikel 8 van de Woningwet][ref1] kunnen in de periode tot de inwerkingtreding van de
      [Omgevingswet][ref2] voor te bouwen gebruiksfuncties waarvoor een omgevingsvergunning voor een activiteit als
      bedoeld in [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref3]
      vereist is, in de bouwverordening voorschriften worden opgenomen die voorzien in lagere maximumwaarden voor
      energiebehoefte en primair fossiel energiegebruik en een hogere minimumwaarde voor het aandeel hernieuwbare energie
      dan bedoeld in [artikel 5.2, eerste lid, van het Bouwbesluit 2012][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0037885
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6p
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0037885
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0030461
        artikel: '5'
  - number: 6q
    text: |-
      In afwijking van [artikel 5.9, eerste en tweede lid, van het Bouwbesluit 2012][ref1]
      kunnen de raden van de gemeenten Harderwijk en Amsterdam tot de inwerkingtreding van de
      [Omgevingswet][ref2] in aanvulling op [artikel 8 van de Woningwet][ref3] in de bouwverordening
      bepalen dat voor aanvragen om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref4] voor een te bouwen
      woonfunctie, geen woonwagen zijnde, en een te bouwen kantoorgebouw, een milieuprestatie geldt van ten hoogste 0,9
      bepaald volgens de *Bepalingsmethode Milieuprestatie Gebouwen en GWW-werken.*


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6q
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0037885
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6r.1
    text: |-
      Dit artikel is tot de inwerkingtreding van de [Omgevingswet][ref1] van toepassing op de volgende gemeenten:


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6r
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 6r.1.a
    text: Haarlemmermeer;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6r
  - number: 6r.1.b
    text: Waalwijk.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6r
  - number: 6r.2
    text: |-
      [Artikel 2.10, eerste lid, onder c en d, en tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref1]
      is niet van toepassing, indien een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van die wet][ref2] betrekking heeft op door het college van burgemeester en
      wethouders aan te wijzen bouwwerken en locaties.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6r
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6r.3
    text: |-
      Op een aanvraag om een omgevingsvergunning als bedoeld in het tweede lid is
      [artikel 2.7, eerste lid, eerste volzin, van de Wet algemene bepalingen omgevingsrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6r
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6s.1
    text: |-
      Dit artikel is tot 1 januari 2025 van toepassing op de gemeenten Aalsmeer, Amstelveen, Amsterdam, Beemster, Diemen,
      Edam-Volendam, Haarlemmermeer, Landsmeer, Oostzaan, Ouder-Amstel, Purmerend, Uithoorn, Waterland, Wormerland en
      Zaanstad.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6s
  - number: 6s.2
    text: |-
      In afwijking van [artikel 1, eerste lid, aanhef en onder i, van de Huisvestingswet 2014][ref1] vormen de gemeenten,
      genoemd in het eerste lid, voor de toepassing van dit artikel gezamenlijk de woningmarktregio.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6s
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '1'
  - number: 6s.3
    text: |-
      In afwijking van [artikel 14, tweede lid, tweede volzin, van de Huisvestingswet 2014][ref1] kunnen de
      gemeenteraden, indien overeenstemming is bereikt met de andere gemeenten, bepalen dat voor ten hoogste zestig
      procent van het percentage, bedoeld in de eerste volzin van dat lid, bij de verlening van huisvestingsvergunningen
      voorrang mag worden gegeven aan woningzoekenden die economisch of maatschappelijk gebonden zijn aan een van die
      gemeenten binnen de woningmarktregio.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel14
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6s
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '14'
  - number: 6s.4
    text: |-
      In afwijking van [artikel 14, tweede lid, tweede volzin, van de Huisvestingswet 2014][ref1] kan de gemeenteraad,
      indien overeenstemming is bereikt met de andere gemeenten, in de huisvestingsverordening bepalen bij hoeveel
      huisvestingsvergunningen voorrang wordt gegeven aan woningzoekenden die economisch of maatschappelijk gebonden zijn
      aan die gemeente, met dien verstande dat het aantal huisvestingsvergunningen waarbij voorrang wordt gegeven aan
      woningzoekenden die economisch of maatschappelijk gebonden zijn aan een van die gemeenten voor de woningmarktregio
      in zijn geheel niet hoger is dan het percentage, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel14
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6s
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '14'
  - number: 6t.1
    text: |-
      Voor de toepassing van dit artikel wordt, in afwijking van [artikel 1 van de Leegstandwet][ref1], verstaan onder:
        - *gebouw:* bouwwerk dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk met wanden omsloten ruimte
      vormt en geen woonruimte is;
        - *leegstaan:* 1°. voor zover het een gebouw betreft: het niet of niet krachtens een zakelijk of persoonlijk recht
      in gebruik zijn overeenkomstig de bestemming van het gebouw; 2°. voor zover het een woonruimte betreft: waar niemand
      zijn woonadres heeft als bedoeld in [artikel 1.1, onder o, onder 1°, van de Wet basisregistratie personen][ref2];
        - *woonruimte:* besloten ruimte die, al dan niet tezamen met een of meer andere ruimten, bestemd of geschikt is
      voor bewoning door een huishouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '1'
  - number: 6t.2
    text: |-
      In afwijking van [artikel 3, eerste lid, van de Leegstandwet][ref1] kan de gemeenteraad, indien hij een verordening
      als bedoeld in [artikel 4 van de Huisvestingswet 2014][ref2] heeft vastgesteld, in de leegstandverordening bepalen
      dat de leegstand van daarbij aangewezen categorieën woonruimten, gelegen in de gemeente of daarbij aangegeven delen
      van de gemeente, door de eigenaar wordt gemeld aan burgemeester en wethouders, zodra die leegstand langer duurt dan
      een in die verordening aangegeven termijn van ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel4
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '4'
  - number: 6t.3
    text: In de leegstandverordening worden nadere regels gegeven over het melden, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
  - number: 6t.4
    text: |-
      Burgemeester en wethouders voeren binnen twee maanden na ontvangst van de melding, bedoeld in het tweede lid,
      overleg met de eigenaar van de woonruimte over het gebruik ervan.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
  - number: 6t.5
    text: |-
      Burgemeester en wethouders stellen na het overleg, bedoeld in het vierde lid, of zonder overleg indien de eigenaar
      aan dat overleg geen medewerking verleent, een leegstandbeschikking vast.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
  - number: 6t.6
    text: 'Burgemeester en wethouders kunnen in de leegstandbeschikking, bedoeld in het vijfde lid:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
  - number: 6t.6.a
    text: |-
      indien de woonruimte niet geschikt is voor gebruik als woonruimte en de woonruimte niet is bestemd voor afbraak of
      vernieuwbouw, bepalen welke voorzieningen door de eigenaar binnen de in de beschikking bepaalde termijn moeten zijn
      getroffen om de woonruimte geschikt te maken voor gebruik als woonruimte;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
  - number: 6t.6.b
    text: |-
      indien de woonruimte is bestemd voor verhuur, de maximale marktconforme huurprijs bepalen waartegen de woonruimte
      te huur wordt aangeboden;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
  - number: 6t.6.c
    text: |-
      indien het een woonruimte betreft die is bestemd voor verkoop en als woonruimte kan worden verhuurd op grond
      van [artikel 15, eerste lid, onder b of d, van de Leegstandwet][ref1], de eigenaar verplichten de woonruimte te
      verhuren, met een vergunning als bedoeld in artikel 15, eerste lid, van die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '15'
  - number: 6t.6.d
    text: |-
      indien het een woonruimte betreft die is bestemd voor afbraak of vernieuwbouw en als woonruimte kan worden verhuurd
      op grond van [artikel 15, eerste lid, onder c, van de Leegstandwet][ref1], de eigenaar verplichten de woonruimte te
      verhuren, met een vergunning als bedoeld in artikel 15, eerste lid, van die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '15'
  - number: 6t.6.e
    text: |-
      een termijn opnemen van ten minste één maand waarbinnen de woonruimte op het moment dat deze geschikt is voor
      bewoning in gebruik wordt genomen als woonruimte;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
  - number: 6t.6.f
    text: andere voorwaarden opnemen die noodzakelijk zijn voor het zo spoedig mogelijk in gebruik nemen van de woonruimte.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
  - number: 6t.7
    text: |-
      De eigenaar kan gemotiveerd verzoeken om de termijn, bedoeld in het zesde lid, onder e, eenmaal te verlengen met
      een periode van ten minste één maand.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
  - number: 6t.8
    text: |-
      Indien een eigenaar een verzoek als bedoeld in het zevende lid doet, kunnen burgemeester en wethouders de
      voorwaarden, bedoeld in het zesde lid, onder b tot en met e, in de oorspronkelijke leegstandbeschikking wijzigen.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
  - number: 6t.9
    text: |-
      In aanvulling op [artikel 4 van de Leegstandwet][ref1] kunnen burgemeester en wethouders, indien ze vaststellen dat
      het gebouw of een gedeelte daarvan niet geschikt is voor gebruik, in een leegstandbeschikking voorschrijven welke
      voorzieningen door de eigenaar binnen de in de beschikking bepaalde termijn moeten worden getroffen om het gebouw
      of een gedeelte ervan geschikt te maken voor gebruik, tenzij het gebouw is bestemd voor afbraak of vernieuwbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel4
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '4'
  - number: 6t.10
    text: Dit artikel is tot 1 januari 2025 van toepassing op de gemeente Amsterdam.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6t
  - number: 6u.1
    text: |-
      Dit artikel is tot 1 januari 2035 van toepassing op de gebieden Carnisse, Oud Charlois en Tarwewijk in de gemeente
      Rotterdam, zoals aangegeven op de kaart in [bijlage 187][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6u
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 6u.2
    text: |-
      In aanvulling op [artikel 15, eerste lid, van de Leegstandwet][ref1] kunnen burgemeester en wethouders een
      vergunning als bedoeld in dat lid ook verlenen voor de verhuur van een woning welke ten tijde van het aanvragen van
      de vergunning bestemd is om te worden samengevoegd met een of meerdere andere woningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6u
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '15'
  - number: 6u.3
    text: |-
      In afwijking van [artikel 15, tweede lid, van de Leegstandwet][ref1] stellen burgemeester en wethouders een
      formulier beschikbaar via welke de eigenaar een vergunning als bedoeld in het tweede lid kan aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6u
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '15'
  - number: 6u.4
    text: |-
      In afwijking van [artikel 15, derde lid, van de Leegstandwet][ref1] wordt de vergunning, bedoeld in het tweede lid,
      slechts verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6u
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '15'
  - number: 6u.4.a
    text: de woning, voor de verhuring waarvan de vergunning wordt aangevraagd, leegstaat;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6u
  - number: 6u.4.b
    text: |-
      de eigenaar aantoont dat de te verhuren woonruimte, gelet op de omstandigheden en mogelijkheden, in voldoende mate
      zal worden bewoond; en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6u
  - number: 6u.4.c
    text: |-
      de eigenaar, bedoeld onder b, de gemeente Rotterdam of een op grond van
      [artikel 19, eerste lid, van de Woningwet][ref1] toegelaten woningcorporatie is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6u
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '19'
  - number: 6u.5
    text: |-
      Onverminderd [artikel 15, zesde lid, tweede volzin, van de Leegstandwet][ref1] kunnen burgemeester en wethouders de
      vergunning, bedoeld in het tweede lid, op verzoek van de eigenaar telkens met ten hoogste drie jaren verlengen, met
      dien verstande dat de vergunning tot uiterlijk 1 januari 2035 kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6u
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '15'
  - number: 6u.6
    text: |-
      [Artikel 15, vijfde lid en zesde lid, laatste volzin, van de Leegstandwet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6u
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '15'
  - number: 6u.7
    text: |-
      In afwijking van [artikel 15, negende lid, laatste volzin, van de Leegstandwet][ref1] is het bepaalde in het derde
      lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6u
    references:
