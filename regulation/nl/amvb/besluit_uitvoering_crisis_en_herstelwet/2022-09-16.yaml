  - number: 7g.5
    text: |-
      Van de in dit artikel bedoelde bevoegdheid tot het vaststellen van een bestemmingsplan met verbrede reikwijdte
      kan tot 1 januari 2026 gebruik worden gemaakt mits het ontwerp van deze plannen ter inzage is gelegd voor de
      inwerkingtreding van de [Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7g
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 7h.1
    text: |-
      In aanvulling op [artikel 2.1 van de Wet ruimtelijke ordening][ref1] kan de raad van de gemeente Meerssen uiterlijk
      op 20 september 2019 een structuurvisie vaststellen waarin zijn vastgelegd de hoofdzaken van het door de gemeente
      te voeren beleid met het oog op:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7h
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: 7h.1.a
    text: het bereiken en in stand houden van een veilige en gezonde fysieke leefomgeving en een goede omgevingskwaliteit, en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7h
  - number: 7h.1.b
    text: |-
      het doelmatig beheren, gebruiken en ontwikkelen van de fysieke leefomgeving ter vervulling van maatschappelijke
      functies.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7h
  - number: 7h.2
    text: 'Bij de voorbereiding, vormgeving, inrichting en beschikbaarstelling van de structuurvisie kan worden afgeweken van:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7h
  - number: 7h.2.a
    text: |-
      de volgende artikelen van het [Besluit ruimtelijke ordening][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0023798
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7h
    references:
      - id: ref1
        bwb_id: BWBR0023798
  - number: 7h.2.a.1°
    text: |-
      [1.2.1, tweede lid][ref1], en [1.2.1a, onderdeel a][ref2], onder de voorwaarde dat het ontwerp van de
      structuurvisie of de vastgestelde structuurvisie elektronisch op een algemeen toegankelijke wijze beschikbaar
      wordt gesteld en blijft op een door de raad te bepalen internetadres. In dat geval bevat de landelijke voorziening,
      bedoeld in artikel 1.2.1, tweede lid, van het Besluit ruimtelijke ordening een verwijzing naar dit internetadres;


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7h
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023798
        artikel: '1'
  - number: 7h.2.a.2°
    text: |-
      [3.1.6, eerste lid, onder f, en vijfde lid, onder c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7h
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: '3'
  - number: 7h.2.b
    text: |-
      de bij de ministeriële regeling, bedoeld in [artikel 1.2.6 van het Besluit ruimtelijke ordening][ref1], gestelde
      regels of nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7h
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: '1'
  - number: 7i.1
    text: |-
      In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref1] wordt de bestemming van gronden,
      met inbegrip van de met het oog daarop gestelde regels, binnen een periode van vijftien jaar opnieuw vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7i
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7i.2
    text: |-
      In afwijking van [artikel 3.2 van de Wet ruimtelijke ordening][ref1] geldt een voorlopige bestemming voor een
      termijn van ten hoogste vijftien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7i
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7i.3
    text: |-
      Dit artikel is van toepassing op het bestemmingsplangebied Galecopperzoom in de gemeente Nieuwegein, zoals
      aangegeven op de kaart in [bijlage 48][ref1], voor zover het bestemmingsplan voor dit gebied wordt vastgesteld vóór
      20 september 2019.


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7i
    references:
      - id: ref1
        bwb_id: BWBR0027929
  - number: 7j.1
    text: 'Dit artikel is van toepassing op door de raad bij bestemmingsplan aan te wijzen locaties binnen de gemeenten:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
  - number: 7j.1.a
    text: Heerhugowaard;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
  - number: 7j.1.b
    text: Hoorn;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
  - number: 7j.1.c
    text: Koggenland;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
  - number: 7j.1.d
    text: Leeuwarden;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
  - number: 7j.1.e
    text: Ooststellingwerf;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
  - number: 7j.1.f
    text: Weststellingwerf;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
  - number: 7j.1.g
    text: Peel en Maas.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
  - number: 7j.2
    text: |-
      In aanvulling op artikel 3, van [Bijlage II, van het Besluit omgevingsrecht][ref1] is binnen de bij bestemmingsplan
      aangewezen locaties gedurende een periode van dertig jaar na inwerkingtreding van dat plan geen omgevingsvergunning
      vereist voor een activiteit, die betrekking heeft op een collector voor warmteopwekking of een paneel voor
      elektriciteitsopwekking op de grond of op een op de grond staand bouwwerk, mits het bouwwerk, waarop de collectoren
      of panelen worden geplaatst, voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 7j.2.1°
    text: de bouwhoogte van het bouwwerk niet hoger is dan vijf meter;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
  - number: 7j.2.2°
    text: het bouwwerk niet voorzien is van een niet op de grond gelegen buitenruimte.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
  - number: 7j.3
    text: |-
      In aanvulling op [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref1] kunnen voor die aan te
      wijzen locaties in het bestemmingsplan regels worden gesteld met betrekking tot het uiterlijk van de in
      het eerste lid bedoelde bouwwerken en beleidsregels worden opgenomen die betrekking hebben op redelijke
      eisen van welstand als bedoeld in [hoofdstuk II, afdeling 3, van de Woningwet][ref2]. In afwijking van
      [artikel 12b van de Woningwet][ref3] wordt het advies van de welstandscommissie dan wel de stadsbouwmeester mede
      gebaseerd op de criteria, die zijn opgenomen in het bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Afdeling3
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel12b
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005181
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 12b
  - number: 7j.4
    text: |-
      In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref1] wordt de bestemming van gronden
      voor de aan te wijzen locaties, met inbegrip van de met het oog daarop gestelde regels, binnen een periode van
      dertig jaar opnieuw vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7j.5
    text: |-
      In afwijking van [artikel 3.2 van de Wet ruimtelijke ordening][ref1] geldt een voorlopige bestemming voor de aan te
      wijzen locaties voor de duur van ten hoogste dertig jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7j.6
    text: |-
      Van de in dit artikel bedoelde bevoegdheid tot het bij bestemmingsplan aanwijzen van locaties kan tot 1 januari
      2026 gebruik worden gemaakt mits het ontwerp van het bestemmingsplan ter inzage is gelegd voor de inwerkingtreding
      van de [Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7j
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 7k.1
    text: |-
      In aanvulling op [artikel 3.26][ref1] juncto [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref2]
      kunnen provinciale staten van Noord-Brabant uiterlijk op 18 maart 2020 in een inpassingsplan voor het plangebied
      «Logistiek Park Moerdijk» in de gemeente Moerdijk, zoals aangegeven op de kaart in [bijlage no. 52][ref3], regels
      stellen die strekken ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7k
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0027929
  - number: 7k.1.a
    text: het bereiken en in stand houden van een veilige en gezonde fysieke leefomgeving en een goede omgevingskwaliteit, en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7k
  - number: 7k.1.b
    text: |-
      het doelmatig beheren, gebruiken en ontwikkelen van de fysieke leefomgeving ter vervulling van maatschappelijke
      functies.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7k
  - number: 7k.2
    text: |-
      In afwijking van [artikel 3.26][ref1] juncto [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref2]
      worden de in het inpassingsplan gestelde regels binnen een periode van twintig jaar opnieuw vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7k
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7l.1
    text: |-
      In aanvulling op [artikel 4.1][ref1] juncto [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref2]
      kunnen provinciale staten van Noord-Brabant uiterlijk op 18 maart 2018 in de provinciale verordening ruimte regels
      stellen omtrent de inhoud van bestemmingsplannen, die strekken ten behoeve van het bereiken en in stand houden van
      een veilige en gezonde fysieke leefomgeving, een goede omgevingskwaliteit, mede met inachtneming van het belang
      om private inspanningen gericht op een duurzame en zorgvuldige veehouderij te bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7l
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7l.2
    text: |-
      Hiertoe kunnen behoren regels waarbij in afwijking van de [artikelen 2][ref1] en
      [6 van de Wet geurhinder en veehouderij][ref2] voorschriften worden gesteld over de cumulatieve geurhinder
      veroorzaakt door veehouderijen.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel6
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7l
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020396
        artikel: '6'
  - number: 7l.3
    text: |-
      Onverminderd het [Besluit emissiearme huisvesting][ref1] en
      [paragraaf 3.5.8 van het Activiteitenbesluit milieubeheer][ref2] kunnen burgemeester en wethouders bij een
      beschikking maatregelen voorschrijven die de emissie van geur of van zwevende deeltjes (PM) vanuit binnen een door
      burgemeester en wethouders aangewezen gebied gelegen dierenverblijven, waarin landbouwhuisdieren worden gehouden,
      verminderen, als blijkt dat de nadelige gevolgen van deze emissie voor het milieu, gezien de ontwikkeling van de
      technische mogelijkheden tot bescherming van het milieu of gezien de ontwikkeling van de kwaliteit van het milieu,
      verder kunnen onderscheidenlijk moeten worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0036748
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Paragraaf3.5.8
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7l
    references:
      - id: ref1
        bwb_id: BWBR0036748
      - id: ref2
        bwb_id: BWBR0022762
        paragraaf: 3.5.8
  - number: 7l.4
    text: |-
      Het vorige lid is alleen van toepassing op door burgemeester en wethouders vóór 18 maart 2020 aangewezen gebieden,
      waarvoor door de raad vóór 18 maart 2022 een verbeterplan is vastgesteld. Een aangewezen gebied geldt voor een
      termijn van tien jaar.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7l
  - number: 7m
    text: |-
      Voor het project stedelijke ontwikkelingen Cadzand-Bad in de gemeente Sluis wordt in aanvulling op
      [artikel 2.3.1, eerste lid, van het Besluit algemene regels ruimtelijke ordening][ref1] tot uiterlijk 9 september
      2025 onder «stedelijk gebied» mede verstaan de in de Ontwikkelingsvisie Cadzand-Bad 2006 en de Schilvisie Cadzand-
      Bad 2011 aangewezen ruimte voor stedenbouwkundige ontwikkelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7m
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: '2'
  - number: 7n.1
    text: |-
      Bij het ten behoeve van het experiment Solarpark Eerbeek wijzigen van de omgevingsvergunning
      voor de stortplaats Doonweg te Eerbeek kan het bevoegd gezag in afwijking van
      [artikel 4, vierde lid, van het Stortbesluit bodembescherming][ref1] de einddatum van de termijn, waarop de in dat
      artikel bedoelde bovenafdichting moet worden aangebracht of de in dat artikel bedoeld maatregelen moeten worden
      getroffen, vaststellen op 31 december 2040.


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel4
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7n
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: '4'
  - number: 7n.2
    text: |-
      Het bevoegd gezag brengt uiterlijk vijf jaar na inwerkingtreding van dit
      besluit het betreffende vergunningsvoorschrift weer in overeenstemming met
      [artikel 4, vierde lid, van het Stortbesluit bodembescherming][ref1] als uit een onderzoek naar de doeltreffendheid
      en effecten van dit experiment blijkt dat de grondwaterkwaliteit verslechtert doordat de bovenafdichting met
      zonnefolie onvoldoende tegengaat dat water in de gestorte afvalstoffen infiltreert.


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel4
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7n
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: '4'
  - number: 7o.1
    text: |-
      Dit artikel is van toepassing op bestemmingsplannen als bedoeld in
      [artikel 3.1 van de Wet ruimtelijke ordening][ref1] en inpassingsplannen als bedoeld in [artikel 3.26][ref2]
      respectievelijk [artikel 3.28 van de Wet ruimtelijke ordening][ref3] voor de door provinciale staten van de
      provincie Groningen aangewezen concentratiegebieden voor de realisering van windturbineparken en voor Windpark
      Fryslân en Windpark De Drentse Monden en Oostermoer. In deze gebieden kunnen aan gronden voorlopige bestemmingen
      voor het bouwen en in werking hebben van een windturbine voor een termijn van tussen de vijfentwintig en dertig
      jaar worden toegekend aan de exacte locaties van de windturbines, mits deze worden vastgesteld voor 15 juli 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
