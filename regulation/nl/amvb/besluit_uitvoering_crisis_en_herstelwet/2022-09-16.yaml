      [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref1], niet voor
      aanvragen om een omgevingsvergunning als bedoeld in het tweede lid, aanhef en onder a tot en met j.


