        bwb_id: BWBR0027929
  - number: 6c.1
    text: |-
      Dit artikel is tot 25 juli 2027 van toepassing op de bouw van gebouwen in het nieuwbouwproject Nieuwveense landen
      in de gemeente Meppel.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6c
  - number: 6c.2
    text: |-
      In afwijking van [artikel 5.3, tweede en derde lid, van het Bouwbesluit 2012][ref1] geldt voor een constructie
      als bedoeld in die leden een weerstand van ten minste 4,5 m2 • K/W, voor zover die waarde hoger is dan de waarde
      bedoeld in die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: 6c.3
    text: |-
      Het bevoegd gezag voor de omgevingsvergunning, bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de Wet algemene bepalingen omgevingsrecht][ref1] kan de aanvrager
      verplichten om een ventilatieprestatiekeuring over te leggen. De ventilatieprestatiekeuring wordt opgesteld
      overeenkomstig BRL8010.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6c.4
    text: |-
      In afwijking van [artikel 5.3, zesde lid, van het Bouwbesluit 2012][ref1] geldt voor ramen, deuren, kozijnen en
      daarmee gelijk te stellen constructieonderdelen als bedoeld in dat lid een warmtecoëfficiënt van ten hoogste 2,0 W/
      m2 • K, voor zover die waarde lager is dan de waarde genoemd in dat lid. Voor vensterglas geldt een U-waarde van
      ten hoogste 0,9.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: 6c.5
    text: |-
      [Artikel 5.6 van het Bouwbesluit 2012][ref1] wordt als volgt gelezen: «Bij het gedeeltelijk vernieuwen of
      veranderen of het vergroten van een bouwwerk zijn de voorschriften van [artikel 5.2][ref2] niet van toepassing.»


