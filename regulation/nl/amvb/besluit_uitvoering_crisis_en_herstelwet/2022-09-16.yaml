  - number: 6b.2.b
    text: |-
      Binckhorst in Den Haag, zoals aangegeven op de kaart in [bijlage 41][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0027929
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6b
    references:
