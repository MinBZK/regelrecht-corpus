        artikel: '3'
  - number: 7c.4
    text: |-
      Het bestemmingsplan kan de door het gemeentebestuur gestelde regels als bedoeld in
      [artikel 108 van de Gemeentewet][ref1] bevatten die geheel of gedeeltelijk betrekking hebben op de fysieke
      leefomgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel108
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '108'
  - number: 7c.5
    text: |-
      De regels in het bestemmingsplan kunnen voorts inhouden een verbod om zonder voorafgaande melding aan burgemeester
      en wethouders een daarbij aangewezen activiteit te verrichten.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
  - number: 7c.6
    text: |-
      In het bestemmingsplan kunnen tevens regels worden gesteld waarvan de uitleg bij de uitoefening van een bij die
      regels aan te geven bevoegdheid afhankelijk wordt gesteld van beleidsregels. Daarbij kan worden bepaald dat de
      beleidsregels worden vastgesteld door de raad of door burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
  - number: 7c.7
    text: |-
      Als de regels, bedoeld in het zesde lid, betrekking hebben op het uiterlijk van bouwwerken en bij de toepassing
      een interpretatie behoeven, stelt de raad de criteria vast die worden toegepast bij de beoordeling van het
      uiterlijk van een bouwwerk waarop de aanvraag om een omgevingsvergunning voor een bouwactiviteit betrekking
      heeft. Deze criteria zijn zoveel mogelijk toegesneden op de onderscheiden bouwwerken. In afwijking van
      [artikel 12b van de Woningwet][ref1] wordt het advies van de welstandscommissie dan wel de stadsbouwmeester slechts
      op die criteria gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12b
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12b
