        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6f.4
    text: |-
      Het bepaalde krachtens [artikel 2.8 van de Wet algemene bepalingen omgevingsrecht][ref1] is niet van toepassing
      voor zover dat een omschrijving van de activiteiten of mogelijke maatregelen vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6f
