  - number: 6f.1
    text: |-
      Dit artikel is tot 15 oktober 2022 van toepassing op de op het Bedrijventerrein Newtonpark IV in de gemeente
      Leeuwarden gelegen experimenteerinrichting, gesitueerd op het perceel met de kavelaanduidingen 11, 12 en 13 binnen
      de percelen, kadastraal bekend: Leeuwarden HzmE 2008, Leeuwarden HzmE 1714 en Leeuwarden HzmE 1692.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6f
  - number: 6f.2
    text: |-
      De experimenteerinrichting wordt in afwijking van
      [artikel 1.1, vierde lid, tweede volzin, van de Wet milieubeheer][ref1] aangemerkt als een inrichting als bedoeld
      in [artikel 1.1 van de Wet algemene bepalingen omgevingsrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6f
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '1'
  - number: 6f.3
    text: |-
      De [artikelen 2.4, tweede lid][ref1], en
      [2.14, eerste lid, onderdeel c, onder 1°, van de Wet algemene bepalingen omgevingsrecht][ref2] zijn niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6f
