    text: van de voorgenomen herziening kennis is gegeven aan de eigenaren in het gebied, en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7e
  - number: 7e.c
    text: gedurende deze termijn de mogelijkheid bestond de bouw- of gebruiksmogelijkheden te realiseren.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7e
  - number: 7f.1
