  - number: 7g.1
    text: De voor het grondgebied van een gemeente vastgestelde bestemmingsplannen gelden als één bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7g
  - number: 7g.2
    text: |-
      [Artikel 7c][ref1] is op een gehele of gedeeltelijke herziening van het bestemmingsplan, bedoeld in het eerste lid,
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027929#Artikel7c
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7g
    references:
      - id: ref1
        bwb_id: BWBR0027929
        artikel: 7c
        paragraaf: '3'
  - number: 7g.3
    text: |-
      Een bestemmingsplan voor een gedeelte van het grondgebied van een gemeente dat na het tijdstip van inwerkingtreding
      van dit besluit onherroepelijk wordt, maakt vanaf het tijdstip waarop dit bestemmingsplan onherroepelijk is
      geworden deel uit van het bestemmingsplan, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7g
  - number: 7g.4
    text: 'Dit artikel is van toepassing op de gemeenten:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7g
