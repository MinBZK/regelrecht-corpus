  - number: 7o.5
    text: |-
      In afwijking van het bepaalde in het eerste tot en met het derde lid kan de raad van Delfzijl in het
      bestemmingsplan voor het bedrijventerrein Oosterhorn voorlopige bestemmingen voor het bouwen en in
      werking hebben van een windturbine voor een termijn van tussen de vijfentwintig en tweeëndertig jaar
      toekennen, mits de voorlopige bestemming wordt toegekend aan de concrete mastposities van de windturbines.
      De bestemming van deze gronden wordt binnen een periode van zevenendertig jaar opnieuw vastgesteld.
      [Artikel 3.1, derde tot en met vijfde lid, van de Wet ruimtelijke ordening][ref1] is gedurende deze periode niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7o
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7p.1
    text: |-
      In afwijking van [artikel 2.7, eerste lid, eerste volzin, van de Wet algemene bepalingen omgevingsrecht][ref1] en
      onverminderd [artikel 2.5 van die wet][ref2] kunnen, als een project dat bestaat uit het bouwen van een bouwwerk
      tevens is aan te merken als een project dat bestaat uit het oprichten van een inrichting, de aanvragen voor een
      omgevingsvergunning voor een activiteit als bedoeld in [artikel 2.1, eerste lid, onder a, van die wet][ref3] en
      voor een activiteit als bedoeld in artikel 2.1, eerste lid, onder e, van die wet, los van elkaar worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7p
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7p.2
    text: 'Dit artikel is:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7p
  - number: 7p.2.a
    text: tot 15 juli 2031 van toepassing in de gemeente Bergen op Zoom;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7p
  - number: 7p.2.b
    text: |-
      in die gemeente tot die datum van overeenkomstige toepassing op aanvragen om wijziging van de voorschriften van
      een omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7p
  - number: 7q
    text: |-
      Onverminderd het [Besluit emissiearme huisvesting][ref1] en
      [paragraaf 3.5.8 van het Activiteitenbesluit milieubeheer][ref2] kan het college van burgemeester en wethouders
      van Nederweert tot 24 september 2031 bij een beschikking maatregelen voorschrijven die de emissie van geur of
      van zwevende deeltjes (PM) vanuit dierenverblijven, waarin landbouwhuisdieren worden gehouden, verminderen,
      als blijkt dat de nadelige gevolgen van deze emissie voor het milieu, gezien de ontwikkeling van de technische
      mogelijkheden tot bescherming van het milieu of gezien de ontwikkeling van de kwaliteit van het milieu, verder
      kunnen onderscheidenlijk moeten worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0036748
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Paragraaf3.5.8
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7q
    references:
      - id: ref1
        bwb_id: BWBR0036748
      - id: ref2
        bwb_id: BWBR0022762
        paragraaf: 3.5.8
  - number: 7r.1
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7r
  - number: 7r.1.a
    text: |-
      *afvalwater:* afvalwater, dat gewasbeschermingsmiddelen bevat en afkomstig is van het telen of kweken van gewassen
      in een kas;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7r
  - number: 7r.1.b
    text: |-
      *overig afvalwater:* afvalwater als bedoeld in
      [artikel 3.63, eerste lid, onder a tot en met i, van het Activiteitenbesluit milieubeheer][ref1], voor zover dit
      andere afvalwaterstromen bevat dan bedoeld onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7r
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7r.2
    text: |-
      In aanvulling op [artikel 10.32a, eerste lid, van de Wet milieubeheer][ref1] kunnen de gemeenteraden van Zaltbommel
      en Maasdriel ten behoeve van de collectieve zuivering van afvalwater bij verordening bepalen dat in aangewezen
      gebieden bij het brengen van afvalwater wordt voldaan aan de in die verordening gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7r
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 7r.3
    text: |-
      In aanvulling op [artikel 10.32a, tweede lid, van de Wet milieubeheer][ref1] maken de gemeenteraden van Zaltbommel
      en Maasdriel geen gebruik van de mogelijkheid, bedoeld in het eerste lid, onder b, van dat artikel, als van degene
      bij wie afvalwater vrijkomt redelijkerwijs geen andere wijze van afvoer van dat water kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7r
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 7r.4
    text: |-
      In aanvulling op [artikel 3.63, eerste lid, van het Activiteitenbesluit milieubeheer][ref1] is het in de door de
      gemeenteraden van Maasdriel en Zaltbommel aangewezen gebieden in een oppervlaktewaterlichaam lozen van afvalwater
      en overig afvalwater toegestaan, als ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7r
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7r.4.a
    text: |-
      het perceel waar het afvalwater en overig afvalwater vrijkomt niet is aangesloten op een voorziening voor de
      inzameling en het transport van afvalwater, waarop geloosd kan worden, en de afstand tot de dichtstbijzijnde
      voorziening voor de inzameling en het transport van afvalwater, waarop kan worden geloosd, meer dan 40 meter
      bedraagt, of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7r
  - number: 7r.4.b
    text: |-
      het lozen van afvalwater en overig afvalwater in een voorziening voor de inzameling en het transport van afvalwater
      waarop het perceel waar het afvalwater vrijkomt is aangesloten, gelet op de capaciteit van dat riool niet volledig
      mogelijk is.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7r
  - number: 7r.5
    text: Van de in dit artikel opgenomen bevoegdheden kan tot 1 januari 2027 gebruik worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7r
  - number: 7s.1
    text: |-
      In het gebied Windpark Elzenburg-De Geer, zoals aangegeven op de kaart in [bijlage 127][ref1], kan in afwijking van
      [artikel 3.2 van de Wet ruimtelijke ordening][ref2], in een bestemmingsplan aan gronden een voorlopige bestemming
      voor het bouwen en in werking hebben van een windturbine voor een termijn van maximaal vijfentwintig jaar worden
      toegekend aan de exacte locaties van de windturbines, mits dit bestemmingsplan wordt vastgesteld voor 27 juni 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0027929
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7s
    references:
      - id: ref1
        bwb_id: BWBR0027929
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7s.2
    text: |-
      In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref1] wordt de bestemming van
      gronden waaraan tevens een voorlopige bestemming voor een windturbine is toegekend, met inbegrip van de met
      het oog op de toegekende bestemmingen gestelde regels, binnen een periode van dertig jaar opnieuw vastgesteld.
      [Artikel 3.1, derde tot en met vijfde lid, van de Wet ruimtelijk ordening][ref2] is gedurende deze periode niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7s
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7t.1
    text: |-
      In de provincie Groningen kunnen in afwijking van [artikel 3.2 van de Wet ruimtelijke ordening][ref1], in een
      bestemmingsplan aan gronden voorlopige bestemmingen voor het bouwen en in werking hebben van een collector voor
      warmteopwekking of een paneel voor elektriciteitsopwekking voor een termijn van maximaal dertig jaar worden
      toegekend aan de exacte locaties van deze collectoren of panelen, mits dit bestemmingsplan wordt vastgesteld voor
      29 november 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7t
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7t.2
    text: |-
      In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref1] wordt de bestemming van
      gronden waaraan tevens een voorlopige bestemming voor een collector voor warmteopwekking of een paneel voor
      elektriciteitsopwekking is toegekend, met het oog op de toegekende bestemmingen gestelde regels, binnen een
      periode van vijfendertig jaar opnieuw vastgesteld. Artikel 3.1, derde tot en met vijfde lid, van de Wet ruimtelijke
      ordening is gedurende deze periode niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7t
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 7u.1
    text: |-
      Dit artikel is van toepassing op de transitie naar een duurzame energievoorziening en de elektrificatie van
      het mijnbouwplatform Ameland Westgat. Daarbij wordt overeenkomstig het bepaalde in dit artikel afgeweken van
      [artikel 3.10d van het Activiteitenbesluit milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7u
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7u.2
    text: |-
      Ter bevordering van de elektrificatie, bedoeld in het eerste lid, onderzoekt degene die het voornoemde
      mijnbouwplatform drijft, tot 1 januari 2019 of de gasturbine die zorg draagt voor de energievoorziening van dit
      mijnbouwplatform kan worden vervangen door een elektrische installatie. Uiterlijk op 1 januari 2019 dient deze
      drijver bij onze Minister een projectplan in waarbij de keuze wordt gemaakt voor:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7u
  - number: 7u.2.a
    text: |-
      het overgaan op een elektrische installatie zonder dat een nieuwe elektriciteitskabel tussen Ameland en het
      elektriciteitsnetwerk op het vaste land wordt aangelegd en waarbij de huidige gasturbine tot uiterlijk 1 januari
      2022 in bedrijf zal zijn, of
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7u
  - number: 7u.2.b
    text: |-
      het aanpassen van de in de aanhef genoemde gasturbine indien niet wordt overgegaan op een
      elektrische installatie, zodat uiterlijk per 31 december 2019 aan de emissiegrenswaarden, genoemd in
      [artikel 3.10d van het Activiteitenbesluit milieubeheer][ref1] wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7u
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7u.3
    text: |-
      Afhankelijk van de in het tweede lid bedoelde keuze voldoet het rookgas van de gasturbine genoemd in dat
      lid in afwijking van [artikel 3.10d van het Activiteitenbesluit milieubeheer][ref1] tot de in het tweede
      lid, onder a, respectievelijk onder b, genoemde datum aan de emissiegrenswaarden die op 31 maart 2010
      voor die installatie golden ingevolge het [Besluit emissie-eisen stookinstallaties milieubeheer B][ref2]
      of het [Besluit emissie-eisen stookinstallaties milieubeheer A][ref3], dan wel aan de daarvan afwijkende
      emissiegrenswaarden, die voor die stookinstallatie golden op grond van een daarvoor verleende omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004833
      [ref3]: https://wetten.overheid.nl/BWBR0004147
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7u
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004833
      - id: ref3
        bwb_id: BWBR0004147
  - number: 7u.4
    text: |-
      Indien toepassing wordt gegeven aan het tweede lid, onder a, rapporteert de drijver jaarlijks uiterlijk per
      1 januari tot aan de in die bepaling genoemde datum aan Onze Minister over de vordering van het project en overlegt
      hij het projectplan voor de resterende periode.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7u
  - number: 7u.5
    text: |-
      Indien naar het oordeel van Onze Minister uit het projectplan, bedoeld in het tweede lid, of het projectplan
      voor de resterende periode, bedoeld in het vierde lid, onvoldoende blijkt dat daadwerkelijk overgegaan kan worden
      op een elektrische installatie voor 1 januari 2022, kan bij algemene maatregel van bestuur de afwijking van
      [artikel 3.10d van het Activiteitenbesluit milieubeheer][ref1] op een daarbij te bepalen tijdstip voortijdig worden
      beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7u
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7u.6
    text: |-
      Indien toepassing wordt gegeven aan het vijfde lid wordt een overgangstermijn van twaalf maanden bepaald,
      gedurende welke het rookgas van de gasturbine van het mijnbouwplatform de emissiegrenswaarden genoemd
      in [artikel 3.10d van het Activiteitenbesluit milieubeheer][ref1] mogen overschrijden tot maximaal de
      emissiegrenswaarden als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7u
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 7v.1
    text: |-
      In afwijking van [afdeling 6.4 van de Wet ruimtelijke ordening][ref1] en het
      [tiende en elfde lid van artikel 7c][ref2] kan de raad op grond van dit artikel regels voor kostenverhaal
      opnemen in het bestemmingsplan of voorschriften daaromtrent aan de omgevingsvergunning, als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref3] verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.4
      [ref2]: https://wetten.overheid.nl/BWBR0027929#Artikel7c
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.4'
      - id: ref2
        bwb_id: BWBR0027929
        artikel: 7c
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7v.2
    text: |-
      Het bevoegd gezag verhaalt de kosten verbonden aan de in het twintigste lid bedoelde werken, werkzaamheden en
      maatregelen op diegene die de in het negentiende lid genoemde activiteiten verricht.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.3
    text: |-
      Kosten worden slechts verhaald voor zover die worden gedragen door de waardestijging die de locatie als gevolg van
      de activiteit heeft of zal hebben.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.4
    text: |-
      De kosten worden verhaald voor zover de werken, werkzaamheden en maatregelen als bedoeld in het twintigste lid
      toerekenbaar zijn aan de gebieden, of een deel daarvan, als bedoeld in het tiende lid, en voor zover de kosten
      proportioneel zijn in verhouding tot het profijt dat de gebieden, of een deel daarvan, van de werken, werkzaamheden
      of maatregelen ondervinden.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.5
    text: |-
      In afwijking van het tweede lid kan het bevoegd gezag beslissen om geheel of gedeeltelijk af te zien van het
      verhalen van de kosten:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.5.a
    text: indien het totaal aan te verhalen kosten minder bedraagt dan 10.000 euro;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.5.b
    text: |-
      indien er geen verhaalbare kosten zijn voor werken, werkzaamheden en maatregelen als bedoeld in het twintigste lid,
      onder a, of;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.5.c
    text: |-
      indien de verhaalbare kosten voor werken, werkzaamheden en maatregelen, bedoeld in het twintigste lid, onder
      a, uitsluitend de aansluiting van een bouwperceel op de openbare ruimte of de aansluiting op nutsvoorzieningen
      betreffen.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.6
    text: |-
      Het is verboden om te beginnen met een activiteit als bedoeld in het negentiende lid als de verschuldigde geldsom,
      bedoeld in het negende lid, niet is betaald en
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.6.a
    text: |-
      de omgevingsvergunning, bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref1], nog niet onherroepelijk
      is; of


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7v.6.b
    text: het bestemmingsplan, bedoeld in het eerste lid, nog niet onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.7
    text: |-
      In afwijking van het zesde lid kan bij de beschikking, bedoeld in het negende lid, worden bepaald dat de betaling
      geheel of gedeeltelijk na aanvang van de activiteit plaatsvindt, mits aan de beschikking voorschriften worden
      verbonden over het stellen van aanvullende zekerheden voor betaling van de verschuldigde geldsom.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.8
    text: |-
      De rechtspersoon waartoe het bevoegd gezag behoort, kan een overeenkomst aangaan waarin het kostenverhaal wordt
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.9
    text: |-
      Als er geen overeenkomst is aangegaan, wordt de verschuldigde geldsom overeenkomstig de regels in
      het bestemmingsplan, bedoeld in het eerste lid, of de voorschriften bij de vergunning, als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref1] bij beschikking
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7v.10
    text: |-
      In het bestemmingsplan, bedoeld in het eerste lid, en de omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref1] worden een of meer gebieden
      aangewezen waarbinnen de in het tweede lid bedoelde kosten worden verhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7v.11
    text: |-
      De kosten worden in of op grond van het bestemmingsplan, bedoeld in het eerste lid, of de omgevingsvergunning,
      bedoeld in [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref1], verdeeld over
      de activiteiten of over samenhangende activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7v.12
    text: |-
      Als de regels, bedoeld in [artikel 7c, zesde lid][ref1], betrekking hebben op kostenverhaal en bij de toepassing
      een interpretatie behoeven, stelt de raad deze regels vast.


      [ref1]: https://wetten.overheid.nl/BWBR0027929#Artikel7c
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0027929
        artikel: 7c
        paragraaf: '3'
  - number: 7v.13
    text: |-
      In het bestemmingsplan, bedoeld in het eerste lid, of de omgevingsvergunning, bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref1], kan een
      indexeringsregeling voor de kosten als bedoeld in het tweede lid worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7v.14
    text: |-
      [Artikel 6.2.10 van het Besluit ruimtelijke ordening][ref1] en de [Regeling plankosten exploitatieplan][ref2] zijn
      van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0039155
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0039155
  - number: 7v.15
    text: |-
      In het bestemmingsplan, bedoeld in het eerste lid, of de vergunning als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref1] wordt een regeling voor de
      eindafrekening opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7v.16
    text: |-
      Bij de eindafrekening op basis van een bestemmingsplan als bedoeld in
      het eerste lid worden verleende omgevingsvergunningen, als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref1] betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7v.17
    text: De eindafrekening leidt er niet toe dat een aanvullende geldsom is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.18
    text: |-
      Als de eindafrekening ertoe leidt dat het bevoegd gezag gehouden is een deel van de betaalde geldsom terug te
      betalen, gebeurt dit binnen vier weken na vaststelling van de afrekening met dien verstande dat als de herberekende
      verschuldigde geldsom meer dan vijf procent lager is dan de betaalde verschuldigde geldsom, het bevoegd gezag
      alleen gehouden is het bedrag met rente terug te betalen aan degene aan wie de beschikking als bedoeld in het
      negende lid is opgelegd of diens rechtsopvolger voor zover het bedrag groter is dan vijf procent.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.19
    text: 'Activiteiten als bedoeld in het tweede lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.19.a
    text: de bouw van een of meer woningen,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.19.b
    text: de bouw van een of meer andere hoofdgebouwen,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.19.c
    text: de uitbreiding van een gebouw met ten minste 1.000 m2 bruto-vloeroppervlakte of met een of meer woningen,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.19.d
    text: de bouw van een gebouw, dat geen hoofdgebouw is, met ten minste 1.000 m2 bruto-vloeroppervlakte,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.19.e
    text: |-
      de verbouwing van een of meer aaneengesloten gebouwen die voor andere doeleinden in gebruik of ingericht waren,
      voor woondoeleinden, mits ten minste tien woningen worden gerealiseerd,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.19.f
    text: |-
      de verbouwing van een of meer aaneengesloten gebouwen die voor andere doeleinden in gebruik of ingericht waren,
      voor detailhandel, dienstverlening, kantoor of horecadoeleinden, mits de cumulatieve oppervlakte van de nieuwe
      gebruiksvormen ten minste 1.500 m2 bruto-vloeroppervlakte bedraagt,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.19.g
    text: de wijziging van het gebruik van een locatie, voor zover dat in het bestemmingsplan is bepaald.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20
    text: 'Werken, werkzaamheden en maatregelen als bedoeld in het tweede lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.a
    text: 'het aanleggen van voorzieningen, waaronder:'
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.a.1
    text: nutsvoorzieningen met bijbehorende werken en bouwwerken,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.a.2
    text: riolering met inbegrip van bijbehorende werken en bouwwerken,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.a.3
    text: |-
      wegen, ongebouwde openbare parkeergelegenheden, pleinen, voet- en rijwielpaden, waterpartijen, watergangen,
      voorzieningen voor de waterhuishouding, bruggen, tunnels, duikers, kades, steigers, en andere rechtstreeks met de
      aanleg van deze voorzieningen verband houdende werken en bouwwerken,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.a.4
    text: infrastructuur voor openbaar vervoervoorzieningen met bijbehorende werken en bouwwerken,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.a.5
    text: |-
      groenvoorzieningen, waaronder begrepen openbare parken, plantsoenen, speelplaatsen, trapvelden en speelweiden,
      natuurvoorzieningen en openbare niet-commerciële sportvoorzieningen,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.a.6
    text: openbare verlichting en brandkranen met aansluitingen,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.a.7
    text: straatmeubilair, speeltoestellen, sierende elementen, kunstobjecten en afrasteringen in de openbare ruimte,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.a.8
    text: openbare gebouwde parkeervoorzieningen,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.b
    text: het verwerven van percelen ten behoeve van de voorzieningen,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.c
    text: het slopen, verwijderen en verplaatsen van opstallen, obstakels, funderingen, kabels en leidingen,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.d
    text: |-
      het uitvoeren van werkzaamheden, waaronder het dempen van oppervlaktewateren, verrichten van grondwerken, met
      inbegrip van het egaliseren, ophogen en afgraven,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.e
    text: |-
      voorbereiding en toezicht op de uitvoering vanwege de aanleg van de voorzieningen en werken, inclusief het daartoe
      benodigde onderzoek,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.f
    text: |-
      tijdelijk beheer van de door of vanwege de overheid verworven percelen, verminderd met de uit het tijdelijk beheer
      te verwachten opbrengsten,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.g
    text: |-
      het vrijmaken van de locatie van persoonlijke rechten en lasten, eigendom, bezit of beperkt recht en zakelijke
      lasten,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.h
    text: het vaststellen van een bestemmingsplan, inclusief het daartoe benodigde onderzoek,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.i
    text: vanwege het belang van de fysieke leefomgeving noodzakelijke maatregelen,
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.20.j
    text: |-
      de betaling van planschade, bedoeld in [afdeling 6.1 van de Wet ruimtelijke ordening][ref1], niet-terugvorderbare
      BTW, niet-gecompenseerde compensabele BTW, of andere niet-terugvorderbare belastingen, over de kostenelementen,
      genoemd onder a tot en met i, rente van geïnvesteerde kapitalen en overige lasten, verminderd met renteopbrengsten.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.1
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.1'
  - number: 7v.21
    text: |-
      De kosten voor de werken, werkzaamheden en maatregelen genoemd in het twintigste lid zijn in elk geval verrekenbaar
      voor zover het betreft:
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.21.a
    text: de werken, werkzaamheden en maatregelen genoemd onder a, c en d;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.21.b
    text: de werken, werkzaamheden en maatregelen genoemd onder b, f en g;
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.21.c
    text: de werken, werkzaamheden en maatregelen genoemd onder e en h.
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
  - number: 7v.22
    text: |-
      Dit artikel is van toepassing op de in [artikel 7c, zeventiende lid, onderdelen e, l, xx, aaa, kkk, rrr en uuu][ref1]
      genoemde plangebieden voor zover het bestemmingsplan, bedoeld in het eerste lid, of de omgevingsvergunning,
      bedoeld in [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref2],
      voor die gebieden voor de in artikel 7c, achttiende lid, bedoelde datum wordt vastgesteld en op de
      in [artikel 7g, vierde lid, onderdeel s][ref3], genoemde gemeente voor zover het betreft de gebieden
      «Wagenwerkplaats» en «De Hoef-West», zoals aangegeven op de kaart in [bijlage 166][ref4], en voor zover
      de bestemmingsplannen, bedoeld in het eerste lid, of de omgevingsvergunning, bedoeld in artikel 2.1,
      eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht, voor die gebieden voor de in
      [artikel 7g, vijfde lid, onderdeel f][ref5], genoemde datum worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027929#Artikel7c
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027929#Artikel7g
      [ref4]: https://wetten.overheid.nl/BWBR0027929
      [ref5]: https://wetten.overheid.nl/BWBR0027929#Artikel7g
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7v
    references:
      - id: ref1
        bwb_id: BWBR0027929
        artikel: 7c
        paragraaf: '3'
      - id: ref2
