        bwb_id: BWBR0003403
        artikel: '15'
  - number: 6u.8
    text: |-
      [Artikel 16 van de Leegstandwet][ref1] is van overeenkomstige toepassing, behoudens het tweede lid,
      met dien verstande dat in het vierde en zesde lid van dat artikel een vergunning als bedoeld in
      [artikel 15, eerste lid, onderdelen a, b en c, van de Leegstandwet][ref2] wordt gelezen als een vergunning als
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel6u
