        artikel: '2'
      - id: ref3
        bwb_id: BWBR0027929
        artikel: 7g
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0027929
      - id: ref5
        bwb_id: BWBR0027929
        artikel: 7g
        paragraaf: '3'
  - number: 7w.1
    text: |-
      Voor het plangebied «Buitengebied Hillegom» van de gemeente Hillegom, zoals aangegeven op de kaart
      in [bijlage 126][ref1], geldt dat als voor een activiteit een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref2] of een omgevingsvergunning
      voor een bestemmingsplanactiviteit als bedoeld in [artikel 7c, veertiende lid][ref3], van dit besluit, is vereist,
      in zoverre in afwijking van [artikel 6.1, tweede lid, aanhef en onder a, van de Wet ruimtelijke ordening][ref4],
      alleen deze omgevingsvergunningen als oorzaak als bedoeld in die bepaling gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0027929
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027929#Artikel7c
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0027929/2022-09-16#Artikel7w
    references:
      - id: ref1
        bwb_id: BWBR0027929
      - id: ref2
