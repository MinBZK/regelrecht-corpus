        artikel: '3'
  - number: 7a.5
    text: |-
      Dit artikel is van toepassing op de volgende bestemmingsplangebieden, voor zover deze bestemmingsplannen worden
      vastgesteld voor 1 januari 2026 en het ontwerp van deze plannen ter inzage is gelegd voor de inwerkingtreding van
      de [Omgevingswet][ref1]:


