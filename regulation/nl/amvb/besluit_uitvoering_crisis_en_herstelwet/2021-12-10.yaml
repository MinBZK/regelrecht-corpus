      Voor het project The Green Village in de gemeente Delft, zoals aangegeven op de kaart in [bijlage 89][ref1], geldt
      tot 24 september 2026 dat:

      a. kan worden afgeweken van het [Bouwbesluit 2012][ref2], met uitzondering van de [hoofdstukken 1][ref3] en
      [2][ref4] en de [afdelingen 6.5 tot en met 6.8][ref5];

      b. de [artikelen 2.4, tweede lid][ref6], en
      [2.14, eerste lid, onderdeel c, onder 1°, van de Wet algemene bepalingen omgevingsrecht][ref7] niet van toepassing
      zijn;

      c. het bepaalde krachtens [artikel 2.8 van de Wet algemene bepalingen omgevingsrecht][ref8] juncto
      [artikel 4.1 van de Regeling omgevingsrecht][ref9] niet van toepassing is voor zover die artikelen een omschrijving
      van de activiteiten of mogelijke maatregelen vereisen;

      d. het verbod uit [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref10]
      voor een bouwactiviteit niet geldt.


