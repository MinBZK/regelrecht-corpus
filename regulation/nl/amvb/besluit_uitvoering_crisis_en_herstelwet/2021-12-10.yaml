    text: |-
      1 Onverminderd [artikel 7a][ref1] geldt voor het bestemmingsplangebied voor het voormalige bedrijventerrein
      Cruquiusgebied in de gemeente Amsterdam, bedoeld in artikel 7a, vijfde lid, onder a, dat gedurende een periode van
      maximaal tien jaar:

      a. [artikel 7c, negende lid, onderdelen c en d][ref2], en [artikel 7d][ref3] van overeenkomstige toepassing zijn;

      b. in afwijking van [artikel 2.2, onderdeel c, van het Besluit geluidhinder][ref4] de hogere waarde voor de ten
      hoogste toelaatbare geluidbelasting van het industrieterrein op ligplaatsen voor woonschepen die reeds aanwezig
      waren op 1 juli 2012 niet hoger mag worden vastgesteld dan 60 dB(A);

      c. in afwijking van [artikel 2.4 van het Besluit geluidhinder][ref5] of
      [artikel 2.20, tweede lid, van het Activiteitenbesluit milieubeheer][ref6] voor woningen en andere geluidsgevoelige
      gebouwen die reeds aanwezig waren op 1 juli 2012 niet voldaan hoeft te worden aan de in die artikelen opgenomen
      binnenwaarden zolang binnen de geluidsgevoelige ruimten respectievelijk verblijfsruimten een goed woon- en
      leefklimaat is gewaarborgd;

      d. in afwijking van [artikel 2.17 van het Activiteitenbesluit milieubeheer][ref7] de in de periode tussen 07.00 en
      19.00 uur in tabel 2.17a opgenomen maximale geluidsniveaus worden verhoogd met maximaal 5 dB(A).

      2 Dit artikel is van toepassing op het in het eerste lid bedoelde bestemmingsplan, voor zover dit bestemmingsplan
      wordt vastgesteld vóór 1 juli 2018.


