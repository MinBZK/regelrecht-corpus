  - number: 7al
    text: |-
      1 In aanvulling op [artikel 4.1][ref1] juncto [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref2]
      kunnen provinciale staten bij verordening regels stellen omtrent de inhoud van bestemmingsplannen, die strekken tot
      het in onderlinge samenhang:

      a. bereiken en in stand houden van een veilige en gezonde fysieke leefomgeving en een goede omgevingskwaliteit, ook
      vanwege de intrinsieke waarde van de natuur; en

      b. doelmatig beheren, gebruiken en ontwikkelen van de fysieke leefomgeving ter vervulling van maatschappelijke
      behoeften.

      2 In afwijking van [artikel 4.1a, eerste lid, van de Wet ruimtelijke ordening][ref3] kan bij de verordening worden
      bepaald dat gedeputeerde staten, op verzoek van een bestuursorgaan van de gemeente, ontheffing kunnen verlenen
      van de krachtens het eerste lid vastgestelde regels, voor zover de uitoefening van de taak of bevoegdheid waarvoor
      ontheffing wordt gevraagd onevenredig wordt belemmerd in verhouding tot het belang dat wordt gediend met de regel
      waarvan ontheffing is gevraagd. Aan een ontheffing kunnen voorschriften worden verbonden. In de ontheffing kan
      worden bepaald dat deze geldt voor een daarbij gestelde termijn.

      3 Van de bevoegdheden, bedoeld in het eerste en tweede lid, kan gebruik worden gemaakt tot de inwerkingtreding
      van de [Omgevingswet][ref4]. Bestemmingsplannen kunnen met inachtneming van de verordening, bedoeld in het
      eerste lid, worden vastgesteld tot 1 januari 2024, mits het ontwerp van deze plannen ter inzage is gelegd voor de
      inwerkingtreding van de Omgevingswet.

      4 Dit artikel is van toepassing op de provincies:

      a. Flevoland;

      b. Gelderland;

      c. Utrecht.


