    text: |-
      1 In het kader van een Platform 31-experiment «Flexibele bestemmingsplannen» kan bij de voorbereiding, vormgeving,
      inrichting en beschikbaarstelling van een bestemmingsplan worden afgeweken van:

      a. de volgende artikelen van de [Wet ruimtelijke ordening][ref1]: [3.1, eerste lid][ref2], voor zover het daarbij
      gaat om het verplicht aanwijzen van bestemmingen, [3.7, vierde lid][ref3], en [6.12, eerste lid][ref4];

      b. de volgende artikelen van het [Besluit ruimtelijke ordening][ref5]:

      1°. [1.2.1, tweede lid][ref6], en [1.2.1a, onderdeel a][ref7], onder de voorwaarde dat het ontwerp van het
      bestemmingplan of het vastgestelde bestemmingsplan elektronisch op een algemeen toegankelijke wijze beschikbaar
      wordt gesteld en blijft op een door de raad te bepalen internetadres. In dat geval bevat de landelijke voorziening,
      bedoeld in artikel 1.2.1, tweede lid, een verwijzing naar dit internetadres;

      2°. [3.1.6, eerste lid, onder f, en vijfde lid, onder c][ref8];

      c. de bij de ministeriële regeling, bedoeld in [artikel 1.2.6 van het Besluit ruimtelijke ordening][ref9], gestelde
      regels of nadere regels.

      2 Voor de in het experiment betrokken bestemmingsplannen geldt dat indien daarin onbenutte bouw- of
      gebruiksmogelijkheden worden wegbestemd, de planschade in ieder geval als voorzienbaar in de zin van artikel 6.3,
      aanhef en onder a, wordt aangemerkt, indien:

      a. deze herziening ten minste drie jaar voor de vaststelling van het bestemmingsplan is aangekondigd;

      b. van de voorgenomen herziening kennis is gegeven aan de eigenaren in het gebied, en

      c. gedurende deze termijn de mogelijkheid bestond de bouw- of gebruiksmogelijkheden te realiseren.

      3 In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref10] wordt de bestemming van
      gronden, met inbegrip van de met het oog daarop gestelde regels, binnen een periode van twintig jaar opnieuw
      vastgesteld.

      4 In afwijking van [artikel 3.2 van de Wet ruimtelijke ordening][ref11] geldt een voorlopige bestemming voor een
      termijn van ten hoogste tien jaar.

      5 Dit artikel is van toepassing op de volgende bestemmingsplangebieden, voor zover deze bestemmingsplannen worden
      vastgesteld voor 1 januari 2024 en het ontwerp van deze plannen ter inzage is gelegd voor de inwerkingtreding van
      de [Omgevingswet][ref12]:

      a. het voormalige bedrijventerrein Cruquiusgebied in de gemeente Amsterdam zoals aangegeven op de kaart in
      [bijlage 28][ref13];

      b. Nieuw Den Helder in de gemeente Den Helder zoals aangegeven op de kaart in [bijlage 30][ref14];

      c. het voormalige NAVO-terrein in de gemeente Maastricht zoals aangegeven op de kaart in [bijlage 31][ref15];

      d. de kernen Zetten en Hemmen in de gemeente Overbetuwe zoals aangegeven op de kaart in [bijlage 32][ref16];

      e. «De Bronnen» in de gemeente Tynaarloo zoals aangegeven op de kaart in [bijlage 33][ref17].


