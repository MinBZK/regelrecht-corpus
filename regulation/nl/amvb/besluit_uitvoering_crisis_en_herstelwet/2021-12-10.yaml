  - number: 7ag
    text: |-
      1 In dit artikel wordt verstaan onder kookgasaansluiting: aansluiting als bedoeld in
      [artikel 1, eerste lid, onder m, van de Gaswet][ref1] waarbij de onroerende zaak ook een aansluiting heeft op
      een warmtenet als bedoeld in [artikel 1, eerste lid, van de Warmtewet][ref2] dat kan voorzien in de verwachte
      warmtebehoefte.

      2 In afwijking van [artikel 62 van de Gaswet][ref3] en in aanvulling op
      [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref4] kunnen in een bestemmingsplan met verbrede
      reikwijdte gebieden worden aangewezen waarbinnen het verboden is te beschikken over een kookgasaansluiting vanaf
      een in dat bestemmingsplan gestelde datum.

      3 Op de dag volgend op de in het bestemmingsplan gestelde datum, bedoeld in het tweede lid, wordt degene die over
      een kookgasaansluiting beschikt geacht de netbeheerder te hebben verzocht om beëindiging van die aansluiting.

      4 Het tweede lid kan uitsluitend worden toegepast, indien:

      a. de bestaande gastransportleidingen om veiligheidsredenen aan vervanging toe zijn;

      b. de onroerende zaken zijn aangesloten op een warmtenet als bedoeld in
      [artikel 1, eerste lid, van de Warmtewet][ref5] dat kan voorzien in de verwachte warmtebehoefte; en

      c. het college van burgemeester en wethouders het gebied, bedoeld in het tweede lid, heeft aangewezen als een
      gebied in de zin van [artikel 10, zevende lid, onder b, van de Gaswet][ref6].

      5 [Artikel 7c, negende lid, onder a, onder 2°][ref7], is niet van toepassing.

      6 Indien gebruik wordt gemaakt van de bevoegdheid, bedoeld in het tweede lid, zijn de [artikelen 3.2.1][ref8],
      [3.2.2][ref9] en [3.2.3 van het Besluit ruimtelijke ordening][ref10] niet van toepassing.

      7 Dit artikel is van toepassing op het plangebied Overvecht-Noord in de gemeente Utrecht, zoals aangegeven op de
      kaart in [bijlage 185][ref11].


