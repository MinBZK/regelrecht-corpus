  - number: 7e
    text: |-
      Indien binnen de op de kaarten in [bijlage 45][ref1] aangegeven gebieden Amstel III en
      Teleport in de gemeente Amsterdam bij een herziening van een bestemmingsplan onbenutte
      bouwmogelijkheden worden wegbestemd, wordt de planschade aangemerkt als voorzienbaar in de zin van
      [artikel 6.3, aanhef en onder a, van de Wet ruimtelijke ordening][ref2] indien:

      a. deze herziening ten minste drie jaar voor de vaststelling van het bestemmingsplan, doch uiterlijk vóór 15 mei
      2019, is aangekondigd;

      b. van de voorgenomen herziening kennis is gegeven aan de eigenaren in het gebied, en

      c. gedurende deze termijn de mogelijkheid bestond de bouw- of gebruiksmogelijkheden te realiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0027929
