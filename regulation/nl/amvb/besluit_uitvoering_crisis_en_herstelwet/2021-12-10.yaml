  - number: 7ah
    text: |-
      1 In afwijking van [afdeling 6.4 van de Wet ruimtelijke ordening][ref1] en [artikel 7c, tiende en elfde lid][ref2],
      kan de raad op grond van dit artikel regels voor kostenverhaal opnemen in het bestemmingsplan.

      2 Als een bestemmingsplan als bedoeld in het eerste lid voorziet in het toelaten van bouwactiviteiten als bedoeld
      in het vijftiende lid, verhaalt het bestuursorgaan op degene die die bouwactiviteiten verricht de kosten die het
      vanwege de in het zestiende lid bedoelde kostensoorten maakt, voor zover:

      a. de kostensoorten toerekenbaar zijn aan het kostenverhaalsgebied; en

      b. de kosten proportioneel zijn in verhouding tot het profijt dat het kostenverhaalsgebied van de kostensoorten
      heeft.

      3 In afwijking van het tweede lid kan het bestuursorgaan beslissen kosten niet te verhalen als:

      a. het totaal van de verschuldigde geldsommen dat op grond van het tiende lid kan worden verhaald, minder bedraagt
      dan € 10.000,–;

      b. er geen verhaalbare kosten als bedoeld in de zestiende lid, onder c tot en met i, zijn; of

      c. de verhaalbare kosten alleen de aansluiting van een locatie op de openbare ruimte of de aansluiting op
      nutsvoorzieningen betreffen.

      4 Het is verboden een activiteit als bedoeld in het vijftiende lid te verrichten, voordat de op grond van dit
      artikel verschuldigde kosten zijn betaald.

      5 De gemeente waarvan het bestuursorgaan een orgaan is, kan met degene die kosten is verschuldigd een overeenkomst
      aangaan over kostenverhaal. Bij de overeenkomst kan, in afwijking van het vierde lid, worden bepaald dat de
      betaling geheel of gedeeltelijk na aanvang van de activiteit plaatsvindt, mits aan de overeenkomst voorwaarden
      worden verbonden over het stellen van aanvullende zekerheden voor de betaling.

      6 Als het verhalen van kosten, bedoeld het tweede lid, is verzekerd vanwege een overeenkomst als bedoeld in
      het vijfde lid, zijn het zevende tot en met veertiende en zeventiende tot en met eenentwintigste lid niet van
      toepassing.

      7 In het bestemmingsplan, bedoeld in het eerste lid:

      a. worden kostenverhaalsgebieden aangewezen waarvoor de kosten, bedoeld in het tweede lid, worden gemaakt;

      b. wordt per kostenverhaalsgebied bepaald welke kostensoorten waarvan het gebied ten dele profijt heeft, naar
      evenredigheid aan dat kostenverhaalsgebied worden toegerekend;

      c. wordt per kostenverhaalsgebied een raming van de kosten opgenomen, met dien verstande dat ook alleen het maximum
      van de globaal te verhalen kosten als geheel per kostenverhaalsgebied kan worden opgenomen; en

      d. worden per kostenverhaalsgebied regels gesteld over:

      1°. de verdeling van de kosten over de bouwactiviteiten, waarbij ook het maximum van de te verhalen kosten per
      activiteit wordt opgenomen; en

      2°. de eindafrekening van de kosten.

      8 De kosten worden verhaald tot ten hoogste het bedrag van de waardevermeerdering van de locatie waar de activiteit
      wordt verricht, die optreedt of zal optreden als gevolg van de bouwactiviteit.

      9 De verschuldigde geldsom wordt berekend door de kosten over de bouwactiviteiten te verdelen naar rato van de
      opbrengsten van de gronden.

      10 Als er geen overeenkomst is aangegaan, wordt de verschuldigde geldsom door het college van burgemeester
      en wethouders bij beschikking vastgesteld volgens hetgeen daarover is bepaald in dit artikel en in het
      bestemmingsplan, bedoeld in het eerste lid. Voordat het bestuursorgaan de beschikking geeft, stelt het de aanvrager
      in de gelegenheid zijn zienswijze naar voren te brengen.

      11 De beslissing op een aanvraag om een beschikking als bedoeld in het tiende lid wordt aangehouden als voor de in
      de aanvraag bedoelde te verrichten activiteit het bestemmingsplan nog niet onherroepelijk is, tenzij:

      a. een ingesteld beroep tegen het bestemmingsplan geen gevolgen kan hebben voor de beoordeling van de activiteit;
      of

      b. deze gevolgen volgens het bestuursorgaan niet opwegen tegen het belang dat met het geven van de beschikking
      is gediend.

      12 De beschikking bevat een raming van de kosten en van de waardevermeerdering waarop de verschuldigde geldsom
      is gebaseerd. Bij de beschikking kan, in afwijking van het vierde lid, worden bepaald dat de betaling geheel of
      gedeeltelijk na aanvang van de activiteit plaatsvindt, mits aan de beschikking voorschriften worden verbonden over
      het stellen van aanvullende zekerheden voor de betaling van de verschuldigde geldsom.

      13 De regeling voor de eindafrekening, bedoeld in het zevende lid, onder d, onder 2°, leidt er niet toe dat er een
      aanvullende geldsom is verschuldigd.

      14 Als een opnieuw berekende geldsom:

      a. meer dan vijf procent lager is dan de op grond van de beschikking betaalde geldsom, betaalt het bestuursorgaan
      binnen vier weken na de eindafrekening het verschil, voor zover het groter is dan vijf procent, naar evenredigheid
      terug met rente; en

      b. is gebaseerd op andere kosten dan de kosten waarop de op grond van het tiende lid bij beschikking vastgestelde
      verschuldigde geldsom is gebaseerd, vindt geen terugbetaling plaats voor zover:

      1°. de kosten vanwege de in het zestiende lid bedoelde kostensoorten zijn gemaakt; en

      2°. het maximum, bedoeld in het zevende lid, onder c, niet wordt overschreden.

      15 Bouwactiviteiten waarvan kosten worden verhaald als bedoeld in het tweede lid, aanhef, zijn:

      a. de bouw van een of meer woningen;

      b. de bouw van een of meer andere hoofdgebouwen;

      c. de uitbreiding van een gebouw met ten minste 1.000 m2 bruto-vloeroppervlakte of met een of meer woningen;

      d. de bouw van een gebouw dat geen hoofdgebouw als bedoeld onder b is, met ten minste 1.000 m2 bruto-
      vloeroppervlakte;

      e. de verbouwing van een of meer aaneengesloten gebouwen die voor andere doeleinden in gebruik of ingericht waren,
      voor woondoeleinden, mits ten minste tien woningen worden gerealiseerd; of

      f. de verbouwing van een of meer aaneengesloten gebouwen die voor andere doeleinden in gebruik of ingericht waren,
      voor detailhandel, dienstverlening, kantoor of horecadoeleinden, mits de cumulatieve oppervlakte van de nieuwe
      functies ten minste 1.500 m2 bruto-vloeroppervlakte bedraagt.

      16 De kostensoorten, bedoeld in het tweede lid, aanhef, zijn:

      a. de kosten van het vaststellen van een bestemmingsplan of het
      verlenen van een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a of c, van de Wet algemene bepalingen omgevingsrecht][ref3], inclusief het
      daarvoor benodigde onderzoek;

      b. de waarde van de gronden die worden gebruikt voor de uitvoering van de onder h en i bedoelde werken,
      werkzaamheden en maatregelen, inclusief de waarde van de te slopen opstallen, geraamd overeenkomstig het
      eenentwintigste lid;

      c. de kosten van het vrijmaken van de gronden, bedoeld onder b, van persoonlijke rechten en lasten, eigendom en
      bezit en beperkte rechten of zakelijke lasten;

      d. het tijdelijk beheer van de door of vanwege de gemeente verworven percelen, verminderd met de uit het tijdelijk
      beheer te verwachten opbrengsten;

      e. de kosten van het slopen, verwijderen en verplaatsen van opstallen, obstakels, funderingen, kabels en leidingen
      op de gronden, bedoeld onder b;

      f. de kosten van bodemsanering, het dempen van oppervlaktewateren en het verrichten van grondwerken op de gronden,
      bedoeld onder b;

      g. de kosten van de noodzakelijke compensatie van in het kostenverhaalsgebied verloren gegane natuurwaarden,
      groenvoorzieningen en watervoorzieningen;

      h. de kosten van de volgende werken:

      1°. wegen, gebouwde en ongebouwde openbare parkeergelegenheden, pleinen, voet- en rijwielpaden, gebouwde openbare
      fietsenstallingen, faciliteiten voor ondergrondse afvalinzameling, waterpartijen, watergangen, voorzieningen
      voor de waterhuishouding, bruggen, tunnels, duikers, kades, steigers en andere rechtstreeks met de aanleg daarvan
      verband houdende werken en bouwwerken;

      2°. infrastructuur voor openbaar-vervoervoorzieningen met bijbehorende werken en bouwwerken;

      3°. groenvoorzieningen, natuurvoorzieningen en openbare niet-commerciële sportvoorzieningen;

      4°. openbare verlichting en brandkranen met aansluitingen;

      5°. straatmeubilair, speeltoestellen, sierende elementen, kunstobjecten en afrasteringen in de openbare ruimte;

      6°. distributienetwerken voor elektriciteit, warmte, gas en water, inclusief bijbehorende werken en bouwwerken;

      7°. riolering, inclusief bijbehorende werken en bouwwerken;

      i. de kosten van werken, werkzaamheden en maatregelen die noodzakelijk zijn voor het bereiken en in stand houden
      van een veilige en gezonde fysieke leefomgeving en een goede omgevingskwaliteit;

      j. de kosten van voorbereiding en toezicht op de uitvoering van de onder c, e, f, h en i bedoelde werken,
      werkzaamheden en maatregelen, inclusief het daarvoor benodigde onderzoek;

      k. tegemoetkoming van schade als bedoeld in [artikel 6.1 van de Wet ruimtelijke ordening][ref4];

      l. niet-terugvorderbare BTW, niet-gecompenseerde compensabele BTW of andere niet-terugvorderbare belastingen, over
      de kostenelementen, genoemd onder a en c tot en met j;

      m. de rente van geïnvesteerde kapitalen en overige lasten, verminderd met renteopbrengsten; en

      n. de kosten van andere door of in opdracht van het bevoegd gezag te verrichten werkzaamheden, voor zover die
      werkzaamheden rechtstreeks verband houden met de in dit lid bedoelde werken, werkzaamheden en maatregelen.

      17 Als het bestemmingsplan, bedoeld in het eerste lid, voor de aangewezen kostenverhaalsgebieden een raming van de
      opbrengsten voor alle daarin gelegen gronden bevat, wordt bij die raming uitgegaan van de opbrengst van de locatie
      waar een bouwactiviteit wordt verricht in het jaar waarin de beschikking, bedoeld in het tiende lid, zal worden
      gegeven.

      18 De waardevermeerdering, bedoeld in het achtste en twaalfde lid, en de opbrengsten, bedoeld in het zeventiende
      lid, worden geraamd op basis van objectief bepaalbare maatstaven.

      19 De raming van de waardevermeerdering, bedoeld in het twaalfde lid, wordt vastgesteld door de geraamde opbrengst
      van de locatie waar de activiteit wordt verricht te verminderen met de raming van de inbrengwaarde van die locatie,
      waarbij tot de inbrengwaarde worden gerekend:

      a. de waarde van de grond en de te slopen opstallen in de toestand voorafgaand aan het vaststellen van het
      bestemmingsplan;

      b. de kosten van het vrijmaken van de grond van persoonlijke rechten en lasten, eigendom, bezit en beperkte rechten
      of zakelijke lasten;

      c. de kosten van het slopen, verwijderen en verplaatsen van opstallen, obstakels, funderingen, kabels en leidingen;
      en

      d. de kosten van bodemsaneringswerkzaamheden, het dempen van oppervlaktewateren en het verrichten van grondwerken.

      20 Tot de kosten, bedoeld in het negentiende lid, onder b, c en d, worden ook gerekend de kosten die voorafgaand
      aan het vaststellen van het bestemmingsplan zijn gemaakt en direct verband houden met de te verrichten
      bouwactiviteiten.

      21 De raming van de inbrengwaarde, bedoeld in het negentiende lid, aanhef, wordt vastgesteld:

      a. met overeenkomstige toepassing van de [artikelen 40b tot en met 40f van de onteigeningswet][ref5], met dien
      verstande dat voor gronden die zijn onteigend of waarvoor een onteigeningsbeschikking is gegeven of die op
      onteigeningsbasis zijn of worden verworven, de inbrengwaarde gelijk is aan de schadeloosstelling ingevolge die
      [wet][ref6], of

      b. overeenkomstig de waarde die bij beschikking op grond van
      [artikel 22, eerste lid, van de Wet waardering onroerende zaken][ref7] is vastgesteld voor het kalenderjaar waarin
      de raming wordt vastgesteld.

      22 Over de hoogte en de begrenzing van de kostensoorten, bedoeld in het zevende lid, onder a, c, j en n, kunnen
      bij ministeriële regeling regels worden gesteld. Daarbij kan onderscheid worden gemaakt naar het type locatie en de
      aard en omvang van de activiteit.

      23 Dit artikel is van toepassing op de bij ministeriële regeling aangewezen plangebieden.


