  - number: 7ak
    text: |-
      1 In aanvulling op [artikel 10.32a, eerste lid, aanhef en onder a, van de Wet milieubeheer][ref1] kan de
      gemeenteraad bij verordening bepalen dat bij in die verordening aangegeven gevallen van het telen of het kweken
      van gewassen in een kas wordt voldaan aan de in die verordening gestelde regels bij het in een voorziening voor de
      inzameling en het transport van afvalwater brengen van:

      a. drainwater;

      b. drainagewater afkomstig van een teelt waarbij gewassen op een bodem groeien die in verbinding staat met de
      ondergrond;

      c. spoelwater van filters van een waterdoseringsinstallatie; of

      d. ander afvalwater, dat gewasbeschermingsmiddelen bevat.

      2 In de verordening, bedoeld in het eerste lid, kan worden afgeweken van
      [artikel 3.64a, eerste lid, van het Activiteitenbesluit milieubeheer][ref2].

      3 Indien toepassing wordt gegeven aan het tweede lid, is, in afwijking van
      [artikel 3.63, eerste lid, van het Activiteitenbesluit milieubeheer][ref3], het in een oppervlaktelichaam lozen
      van spoelwater van filters van een waterdoseringsinstallatie, drainwater en drainagewater afkomstig van een teelt
      waarbij gewassen op een bodem groeien die in verbinding staat met de ondergrond verboden.

      4 In de verordening, bedoeld in het eerste lid, worden in ieder geval regels opgenomen die ertoe strekken dat
      de hoeveelheid gewasbeschermingsmiddelen, die met het bedrijfsafvalwater in het openbaar vuilwaterriool wordt
      gebracht, zoveel mogelijk wordt beperkt.

      5 Indien toepassing wordt gegeven aan het tweede lid, geldt voor degene die het zuiveringtechnisch werk
      exploiteert, waarin het afvalwater, bedoeld in het eerste lid, wordt gebracht, in ieder geval het volgende:

      a. een aanvullende zuiveringsstap voor het verwijderen van nutriënten uit het afvalwater wordt ingevoerd;

      b. iedere zes maanden wordt aan burgemeester en wethouders gerapporteerd over de voortgang van het hergebruiken van
      het gezuiverde water; en

      c. ieder kwartaal wordt aan burgemeester en wethouders bericht over de planning voor de oplevering van de
      zuiveringstechnologie en over de inspanningen die worden gepleegd om de opleveringsdatum te verkorten.

      6 Dit artikel is tot 1 januari 2024 van toepassing op glastuinbouwbedrijven in de gemeente Westland, die kunnen
      aantonen dat zij hun afvalwater via de nog te realiseren collectieve zuiveringsvoorziening bij de Nieuwe Waterweg
      zullen laten zuiveren.


