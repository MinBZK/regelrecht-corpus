      1 Dit artikel geldt tot 1 januari 2036 voor de Sluisbuurt in de gemeente Amsterdam, zoals aangegeven op de kaart
      in [bijlage 190][ref1].

      2 In de [titels 10.4][ref2] en [10.6 van de Wet milieubeheer][ref3] wordt, in aanvulling op
      [artikel 1.1 van die wet][ref4], onder huishoudelijke afvalstoffen ook begrepen bedrijfsafvalstoffen voor zover
      deze de volgende fracties bevatten:

      a. afgedankte elektrische en elektronische apparatuur;

      b. bioafval;

      c. drankenkartons;

      d. glas;

      e. kunststof;

      f. metaal;

      g. papier;

      h. restafval; of

      i. textiel.

      3 Indien de fracties, bedoeld in het tweede lid, door de oorspronkelijke leverancier als retourvracht kunnen worden
      meegenomen, is het tweede lid niet van toepassing.


