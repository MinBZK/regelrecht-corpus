      1 Dit artikel is tot 1 januari 2035 van toepassing op de gebieden Carnisse, Oud Charlois en Tarwewijk in de
      gemeente Rotterdam, zoals aangegeven op de kaart in [bijlage 187][ref1].

      2 In aanvulling op [artikel 15, eerste lid, van de Leegstandwet][ref2] kunnen burgemeester en wethouders een
      vergunning als bedoeld in dat lid ook verlenen voor de verhuur van een woning welke ten tijde van het aanvragen van
      de vergunning bestemd is om te worden samengevoegd met een of meerdere andere woningen.

      3 In afwijking van [artikel 15, tweede lid, van de Leegstandwet][ref3] stellen burgemeester en wethouders een
      formulier beschikbaar via welke de eigenaar een vergunning als bedoeld in het tweede lid kan aanvragen.

      4 In afwijking van [artikel 15, derde lid, van de Leegstandwet][ref4] wordt de vergunning, bedoeld in het tweede
      lid, slechts verleend indien:

      a. de woning, voor de verhuring waarvan de vergunning wordt aangevraagd, leegstaat;

      b. de eigenaar aantoont dat de te verhuren woonruimte, gelet op de omstandigheden en mogelijkheden, in voldoende
      mate zal worden bewoond; en

      c. de eigenaar, bedoeld onder b, de gemeente Rotterdam of een op grond van
      [artikel 19, eerste lid, van de Woningwet][ref5] toegelaten woningcorporatie is.

      5 Onverminderd [artikel 15, zesde lid, tweede volzin, van de Leegstandwet][ref6] kunnen burgemeester en wethouders
      de vergunning, bedoeld in het tweede lid, op verzoek van de eigenaar telkens met ten hoogste drie jaren verlengen,
      met dien verstande dat de vergunning tot uiterlijk 1 januari 2035 kan worden verlengd.

      6 [Artikel 15, vijfde lid en zesde lid, laatste volzin, van de Leegstandwet][ref7] is niet van toepassing.

      7 In afwijking van [artikel 15, negende lid, laatste volzin, van de Leegstandwet][ref8] is het bepaalde in het
      derde lid van overeenkomstige toepassing.

      8 [Artikel 16 van de Leegstandwet][ref9] is van overeenkomstige toepassing, behoudens het tweede
      lid, met dien verstande dat in het vierde en zesde lid van dat artikel een vergunning als bedoeld in
      [artikel 15, eerste lid, onderdelen a, b en c, van de Leegstandwet][ref10] wordt gelezen als een vergunning als
      bedoeld in het tweede lid.


