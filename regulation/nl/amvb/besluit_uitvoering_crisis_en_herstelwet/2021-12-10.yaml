    text: |-
      Ten behoeve van:

      a. Stationsgebied Utrecht zoals aangegeven op de kaart in [bijlage 7][ref1],

      b. Gebiedsgericht grondwaterbeheer Tilburg zoals aangegeven op de kaart in [bijlage 23][ref2],

      c. het plangebied Spoorzone in de gemeente Eindhoven zoals aangegeven op de kaart in [bijlage 14][ref3],

      d. de uitvoering van de «Visie op de ondergrond» van de gemeente Zwolle zoals aangegeven op de kaart in
      [bijlage 15][ref4],

      kunnen burgemeester en wethouders ten behoeve van gebiedsgericht bodembeheer of grondwaterbeheer vóór 6 maart 2018
      voor de duur van ten hoogste vijftien jaar besluiten tot afwijking van de artikelen:

      1°. [1 van de Wet bodembescherming][ref5],

      2°. [13][ref6] en [27 van de Wet bodembescherming][ref7] voor zover de bodem is of wordt verontreinigd of aangetast
      door één of meerdere bemalingen die ten behoeve van bouw-, sloop- of onderzoekswerkzaamheden worden uitgevoerd
      of die het gevolg zijn van de onttrekking of infiltratie van grondwater door één of meerdere warmte koude
      opslagsystemen,

      3°. [28][ref8], [29][ref9], [37][ref10], [38][ref11], [39, tweede lid][ref12], [39b][ref13], [40][ref14],
      [42][ref15] en [88 van de Wet bodembescherming][ref16],

      voor zover die afwijking geen gevaar voor de gezondheid van mens of dier oplevert.
      [Artikel 20.3, eerste lid, van de Wet milieubeheer][ref17] is niet van toepassing op de besluiten met betrekking
      tot de bodem ten aanzien van deze gebieden.


