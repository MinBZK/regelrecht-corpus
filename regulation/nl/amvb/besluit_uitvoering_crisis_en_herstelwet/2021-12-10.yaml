  - number: '3'
    text: |-
      1 Dit artikel is van toepassing op door burgemeester en wethouders aangewezen bedrijventerreinen binnen het
      grondgebied van de gemeenten:

      a. Amersfoort;

      b. Houten;

      c. Leusden;

      d. Nieuwegein;

      e. Nijmegen;

      f. Utrecht, en

      g. Woerden.

      2 De aanwijzing van de bedrijventerreinen vindt plaats uiterlijk op 25 oktober 2012.

      3 Het verbod, gesteld in [artikel 2.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1] geldt tot
      25 oktober 2022 niet voor het bouwen van een miniwindturbine. Bij het bouwen van een miniwindturbine wordt het
      bepaalde krachtens [artikel 2.6, tweede lid, van de wet][ref2] in acht genomen.

      4 Behoudens in gevallen waarin sprake is van een inrichting type B als bedoeld in
      [artikel 1.2 van het Activiteitenbesluit milieubeheer][ref3], kan tot 25 oktober 2022 worden afgeweken van
      [paragraaf 3.2.3 van het Activiteitenbesluit milieubeheer][ref4] voor het in werking hebben van een miniwindturbine
      op de inrichting of op het terrein behorende bij de inrichting.

      5 De geluidbelasting door miniwindturbines op de dichtstbijzijnde gevel van een geluidgevoelige bestemming is niet
      groter dan 47 db L, te bepalen overeenkomstig bij ministeriële regeling te stellen regels.


