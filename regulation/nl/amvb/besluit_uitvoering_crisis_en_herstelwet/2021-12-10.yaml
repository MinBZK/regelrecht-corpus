  - number: 7v
    text: |-
      1 In afwijking van [afdeling 6.4 van de Wet ruimtelijke ordening][ref1] en het
      [tiende en elfde lid van artikel 7c][ref2] kan de raad op grond van dit artikel regels voor kostenverhaal
      opnemen in het bestemmingsplan of voorschriften daaromtrent aan de omgevingsvergunning, als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref3] verbinden.

      2 Het bevoegd gezag verhaalt de kosten verbonden aan de in het twintigste lid bedoelde werken, werkzaamheden en
      maatregelen op diegene die de in het negentiende lid genoemde activiteiten verricht.

      3 Kosten worden slechts verhaald voor zover die worden gedragen door de waardestijging die de locatie als gevolg
      van de activiteit heeft of zal hebben.

      4 De kosten worden verhaald voor zover de werken, werkzaamheden en maatregelen als bedoeld in het twintigste lid
      toerekenbaar zijn aan de gebieden, of een deel daarvan, als bedoeld in het tiende lid, en voor zover de kosten
      proportioneel zijn in verhouding tot het profijt dat de gebieden, of een deel daarvan, van de werken, werkzaamheden
      of maatregelen ondervinden.

      5 In afwijking van het tweede lid kan het bevoegd gezag beslissen om geheel of gedeeltelijk af te zien van het
      verhalen van de kosten:

      a. indien het totaal aan te verhalen kosten minder bedraagt dan 10.000 euro;

      b. indien er geen verhaalbare kosten zijn voor werken, werkzaamheden en maatregelen als bedoeld in het twintigste
      lid, onder a, of;

      c. indien de verhaalbare kosten voor werken, werkzaamheden en maatregelen, bedoeld in het twintigste lid, onder
      a, uitsluitend de aansluiting van een bouwperceel op de openbare ruimte of de aansluiting op nutsvoorzieningen
      betreffen.

      6 Het is verboden om te beginnen met een activiteit als bedoeld in het negentiende lid als de verschuldigde
      geldsom, bedoeld in het negende lid, niet is betaald en

      a. de omgevingsvergunning, bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref4], nog niet onherroepelijk
      is; of

      b. het bestemmingsplan, bedoeld in het eerste lid, nog niet onherroepelijk is.

      7 In afwijking van het zesde lid kan bij de beschikking, bedoeld in het negende lid, worden bepaald dat de betaling
      geheel of gedeeltelijk na aanvang van de activiteit plaatsvindt, mits aan de beschikking voorschriften worden
      verbonden over het stellen van aanvullende zekerheden voor betaling van de verschuldigde geldsom.

      8 De rechtspersoon waartoe het bevoegd gezag behoort, kan een overeenkomst aangaan waarin het kostenverhaal wordt
      verzekerd.

      9 Als er geen overeenkomst is aangegaan, wordt de verschuldigde geldsom overeenkomstig de regels in
      het bestemmingsplan, bedoeld in het eerste lid, of de voorschriften bij de vergunning, als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref5] bij beschikking
      vastgesteld.

      10 In het bestemmingsplan, bedoeld in het eerste lid, en de omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref6] worden een of meer gebieden
      aangewezen waarbinnen de in het tweede lid bedoelde kosten worden verhaald.

      11 De kosten worden in of op grond van het bestemmingsplan, bedoeld in het eerste lid, of de omgevingsvergunning,
      bedoeld in [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref7], verdeeld over
      de activiteiten of over samenhangende activiteiten.

      12 Als de regels, bedoeld in [artikel 7c, zesde lid][ref8], betrekking hebben op kostenverhaal en bij de toepassing
      een interpretatie behoeven, stelt de raad deze regels vast.

      13 In het bestemmingsplan, bedoeld in het eerste lid, of de omgevingsvergunning, bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref9], kan een
      indexeringsregeling voor de kosten als bedoeld in het tweede lid worden opgenomen.

      14 [Artikel 6.2.10 van het Besluit ruimtelijke ordening][ref10] en de [Regeling plankosten exploitatieplan][ref11]
      zijn van overeenkomstige toepassing

      15 In het bestemmingsplan, bedoeld in het eerste lid, of de vergunning als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref12] wordt een regeling voor de
      eindafrekening opgenomen.

      16 Bij de eindafrekening op basis van een bestemmingsplan als bedoeld
      in het eerste lid worden verleende omgevingsvergunningen, als bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref13] betrokken.

      17 De eindafrekening leidt er niet toe dat een aanvullende geldsom is verschuldigd.

      18 Als de eindafrekening ertoe leidt dat het bevoegd gezag gehouden is een deel van de betaalde geldsom terug te
      betalen, gebeurt dit binnen vier weken na vaststelling van de afrekening met dien verstande dat als de herberekende
      verschuldigde geldsom meer dan vijf procent lager is dan de betaalde verschuldigde geldsom, het bevoegd gezag
      alleen gehouden is het bedrag met rente terug te betalen aan degene aan wie de beschikking als bedoeld in het
      negende lid is opgelegd of diens rechtsopvolger voor zover het bedrag groter is dan vijf procent.

      19 Activiteiten als bedoeld in het tweede lid, zijn:

      a. de bouw van een of meer woningen,

      b. de bouw van een of meer andere hoofdgebouwen,

      c. de uitbreiding van een gebouw met ten minste 1.000 m2 bruto-vloeroppervlakte of met een of meer woningen,

      d. de bouw van een gebouw, dat geen hoofdgebouw is, met ten minste 1.000 m2 bruto-vloeroppervlakte,

      e. de verbouwing van een of meer aaneengesloten gebouwen die voor andere doeleinden in gebruik of ingericht waren,
      voor woondoeleinden, mits ten minste tien woningen worden gerealiseerd,

      f. de verbouwing van een of meer aaneengesloten gebouwen die voor andere doeleinden in gebruik of ingericht waren,
      voor detailhandel, dienstverlening, kantoor of horecadoeleinden, mits de cumulatieve oppervlakte van de nieuwe
      gebruiksvormen ten minste 1.500 m2 bruto-vloeroppervlakte bedraagt,

      g. de wijziging van het gebruik van een locatie, voor zover dat in het bestemmingsplan is bepaald.

      20 Werken, werkzaamheden en maatregelen als bedoeld in het tweede lid, zijn:

      a. het aanleggen van voorzieningen, waaronder:

      1. nutsvoorzieningen met bijbehorende werken en bouwwerken,

      2. riolering met inbegrip van bijbehorende werken en bouwwerken,

      3. wegen, ongebouwde openbare parkeergelegenheden, pleinen, voet- en rijwielpaden, waterpartijen, watergangen,
      voorzieningen voor de waterhuishouding, bruggen, tunnels, duikers, kades, steigers, en andere rechtstreeks met de
      aanleg van deze voorzieningen verband houdende werken en bouwwerken,

      4. infrastructuur voor openbaar vervoervoorzieningen met bijbehorende werken en bouwwerken,

      5. groenvoorzieningen, waaronder begrepen openbare parken, plantsoenen, speelplaatsen, trapvelden en speelweiden,
      natuurvoorzieningen en openbare niet-commerciële sportvoorzieningen,

      6. openbare verlichting en brandkranen met aansluitingen,

      7. straatmeubilair, speeltoestellen, sierende elementen, kunstobjecten en afrasteringen in de openbare ruimte,

      8. openbare gebouwde parkeervoorzieningen,

      b. het verwerven van percelen ten behoeve van de voorzieningen,

      c. het slopen, verwijderen en verplaatsen van opstallen, obstakels, funderingen, kabels en leidingen,

      d. het uitvoeren van werkzaamheden, waaronder het dempen van oppervlaktewateren, verrichten van grondwerken, met
      inbegrip van het egaliseren, ophogen en afgraven,

      e. voorbereiding en toezicht op de uitvoering vanwege de aanleg van de voorzieningen en werken, inclusief het
      daartoe benodigde onderzoek,

      f. tijdelijk beheer van de door of vanwege de overheid verworven percelen, verminderd met de uit het tijdelijk
      beheer te verwachten opbrengsten,

      g. het vrijmaken van de locatie van persoonlijke rechten en lasten, eigendom, bezit of beperkt recht en zakelijke
      lasten,

      h. het vaststellen van een bestemmingsplan, inclusief het daartoe benodigde onderzoek,

      i. vanwege het belang van de fysieke leefomgeving noodzakelijke maatregelen,

      j. de betaling van planschade, bedoeld in [afdeling 6.1 van de Wet ruimtelijke ordening][ref14], niet-
      terugvorderbare BTW, niet-gecompenseerde compensabele BTW, of andere niet-terugvorderbare belastingen, over de
      kostenelementen, genoemd onder a tot en met i, rente van geïnvesteerde kapitalen en overige lasten, verminderd
      met renteopbrengsten.

      21 De kosten voor de werken, werkzaamheden en maatregelen genoemd in het twintigste lid zijn in elk geval
      verrekenbaar voor zover het betreft:

      a. de werken, werkzaamheden en maatregelen genoemd onder a, c en d;

      b. de werken, werkzaamheden en maatregelen genoemd onder b, f en g;

      c. de werken, werkzaamheden en maatregelen genoemd onder e en h.

      22 Dit artikel is van toepassing op de in
      [artikel 7c, zeventiende lid, onderdelen e, l, xx, aaa, kkk, rrr en uuu][ref15] genoemde plangebieden
      voor zover het bestemmingsplan, bedoeld in het eerste lid, of de omgevingsvergunning, bedoeld in
      [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref16], voor
      die gebieden voor de in artikel 7c, achttiende lid, bedoelde datum wordt vastgesteld en op de in
      [artikel 7g, vierde lid, onderdeel s][ref17], genoemde gemeente voor zover het betreft de gebieden
      «Wagenwerkplaats» en «De Hoef-West», zoals aangegeven op de kaart in [bijlage 166][ref18], en voor zover
      de bestemmingsplannen, bedoeld in het eerste lid, of de omgevingsvergunning, bedoeld in artikel 2.1,
      eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht, voor die gebieden voor de in
      [artikel 7g, vijfde lid, onderdeel f][ref19], genoemde datum worden vastgesteld.


