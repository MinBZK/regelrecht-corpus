    text: |-
      1 Dit artikel is tot 1 januari 2025 van toepassing binnen de provincies Gelderland, Limburg, Noord-Brabant en
      Overijssel.

      2 Het bevoegd gezag is het bestuursorgaan dat bevoegd zou zijn of is om een omgevingsvergunning voor de betrokken
      inrichting te verlenen.

      3 In afwijking van [artikel 2, eerste lid, van de Regeling ammoniak en veehouderij][ref1] kan
      het bevoegd gezag voor een huisvestingssysteem dat of een additionele techniek die niet in
      [bijlage 1 bij die regeling][ref2] is opgenomen op aanvraag bij besluit bepalen dat in plaats van
      emissiefactoren gebruik wordt gemaakt van meetsensoren die de feitelijke emissies meten voor het beoordelen
      of wordt voldaan aan [artikel 3][ref3], [4][ref4] of [5 van het Besluit emissiearme huisvesting][ref5]
      en hetzij [artikel 7, eerste lid, onder a en b, van de Wet ammoniak en veehouderij][ref6], hetzij
      [artikel 3.114, eerste lid, onder a en b, van het Activiteitenbesluit milieubeheer][ref7].

      4 Indien toepassing wordt gegeven aan het derde lid, zijn
      [artikel 6, eerste lid, van het Besluit emissiearme huisvesting][ref8],
      [artikel 1, tweede lid, van de Wet ammoniak en veehouderij][ref9] en
      [artikel 3.112 van het Activiteitenbesluit milieubeheer][ref10] niet van toepassing.

      5 Indien het bevoegd gezag een besluit neemt als bedoeld in het derde lid, wordt in de omgevingsvergunning, bedoeld
      in [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref11] of het tiende
      lid, opgenomen:

      a. het emissieplafond en de wijze waarop wordt aangetoond dat hieraan wordt voldaan;

      b. dat de emissies worden gemeten overeenkomstig het Protocol voor meting met sensoren van ammoniakemissie uit
      huisvestingssystemen in de veehouderij of een gelijkwaardige methode.

      6 Onverminderd [artikel 3 van de Regeling ammoniak en veehouderij][ref12] kan het bevoegd gezag voor een
      huisvestingssysteem dat of een additionele techniek die niet in [bijlage 1 bij die regeling][ref13] is opgenomen,
      op aanvraag bij besluit een bijzondere ammoniakemissiefactor of een emissiereductiepercentage vaststellen die bij
      de berekening van de ammoniakemissie worden toegepast.

      7 Indien het bevoegd gezag een besluit neemt als bedoeld in het zesde lid, wordt in de omgevingsvergunning,
      bedoeld in [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref14] of
      het tiende lid, opgenomen dat de emissies binnen twee jaar vanaf het in gebruik nemen van het huisvestingssysteem
      of de additionele techniek worden gemeten overeenkomstig het Protocol voor meting van ammoniakemissie uit
      huisvestingssystemen in de veehouderij, versie 2013a, of een gelijkwaardige methode, tenzij is aangetoond dat al
      voldoende metingen op andere locaties worden uitgevoerd.

      8 Onverminderd [artikel 67, eerste en derde lid, van de Regeling beoordeling luchtkwaliteit 2007][ref15] kan
      het bevoegd gezag op aanvraag bij besluit andere gegevens gebruiken en goedkeuren dan de gegevens, bedoeld in
      [artikel 66, onder i, van die regeling][ref16].

      9 Indien het bevoegd gezag een besluit neemt als bedoeld in het achtste lid, wordt in de omgevingsvergunning,
      bedoeld in [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref17] of
      het tiende lid, opgenomen dat de emissies binnen twee jaar vanaf het in gebruik nemen van het huisvestingssysteem
      of de additionele techniek worden gemeten overeenkomstig het Protocol voor meting van fijnstofemissie uit
      huisvestingssystemen in de veehouderij, versie 2010, of een gelijkwaardige methode, tenzij is aangetoond dat al
      voldoende relevante metingen op andere locaties worden uitgevoerd.

      10 In aanvulling op [artikel 2.2a van het Besluit omgevingsrecht][ref18] wordt aangewezen als categorie
      activiteiten als bedoeld in [artikel 2.1, eerste lid, onder i, van de Wet algemene bepalingen omgevingsrecht][ref19]
      het oprichten of wijzigen van een dierenverblijf waarbij toepassing is gegeven aan het derde, zesde of
      achtste lid, voor zover deze activiteit plaatsvindt binnen een inrichting type B zoals omschreven in
      [artikel 1.2 van het Activiteitenbesluit milieubeheer][ref20].

      11 In afwijking van [artikel 5.13a van het Besluit omgevingsrecht][ref21] kunnen aan een omgevingsvergunning als
      deze betrekking heeft op de categorie activiteiten, bedoeld in het tiende lid, voorschriften worden verbonden als
      toepassing is gegeven aan het derde, zesde of achtste lid.

      12 In aanvulling op [artikel 5.13b van het Besluit omgevingsrecht][ref22] kan een omgevingsvergunning als deze
      betrekking heeft op de categorie activiteiten, bedoeld in het tiende lid, worden geweigerd vanwege de aard of
      locatie van de activiteit.

      13 In aanvulling op [artikel 2.31, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref23]
      kan het bevoegd gezag de voorschriften van een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref24] of als deze betrekking heeft op de categorie
      activiteiten, bedoeld het tiende lid, wijzigen, indien:

      a. uit metingen blijkt dat de ammoniakemissie in kg per dierplaats per jaar hoger is dan de op grond
      van het zesde lid vastgestelde bijzondere ammoniakemissiefactor of het op grond van dat lid vastgestelde
      emissiereductiepercentage;

      b. uit metingen blijkt dat de emissie van zwevende deeltjes (PM) in kg per dier per jaar hoger is dan de
      op grond van het achtste lid vastgestelde bijzondere emissiefactor of het op grond van dat lid vastgestelde
      emissiereductiepercentage;

      c. aanvullende maatregelen nodig zijn voor een goede werking van het huisvestingssysteem; of

      d. aanvullende eisen nodig zijn voor het meten met sensoren.

      14 Indien toepassing wordt gegeven aan het dertiende lid, is
      [artikel 2.31a van de Wet algemene bepalingen omgevingsrecht][ref25] van overeenkomstige toepassing.

      15 In aanvulling op
      [artikel 2.33, tweede lid, aanhef en onder d en f, van de Wet algemene bepalingen omgevingsrecht][ref26]
      kan het bevoegd gezag een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref27] of het tiende lid geheel of gedeeltelijk
      intrekken, indien:

      a. uit metingen blijkt dat de ammoniakemissie hoger is dan de op grond van het zesde lid vastgestelde bijzondere
      ammoniakemissiefactor of het op grond van dat lid vastgestelde emissiereductiepercentage;

      b. uit metingen blijkt dat de emissie van zwevende deeltjes (PM) in kg per dier per jaar hoger is dan de
      op grond van het achtste lid vastgestelde bijzondere emissiefactor of het op grond van dat lid vastgestelde
      emissiereductiepercentage; of

      c. niet binnen twee jaar nadat het huisvestingssysteem is opgericht, metingen zijn uitgevoerd.

      16 Indien toepassing wordt gegeven aan het vijftiende lid, wordt het besluit, bedoeld in zesde en achtste lid,
      ingetrokken.


