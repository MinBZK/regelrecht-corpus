      1 Dit artikel is van toepassing op de gebieden:

      a. Haven 8 en Oostelijke Insteekhaven in Waalwijk, zoals aangegeven op de kaart in [bijlage 184][ref1], en

      b. en Heesch-West in ’s-Hertogenbosch en Bernheze, zoals aangegeven op de kaart in [bijlage 186][ref2],

      voor zover de bestemmingsplannen voor deze gebieden worden vastgesteld voor 1 januari 2024 en het ontwerp van deze
      plannen ter inzage is gelegd voor de inwerkingtreding van de [Omgevingswet][ref3].

      2 In afwijking van [artikel 1.1 van het Activiteitenbesluit milieubeheer][ref4] geldt voor bedrijfsgebouwen als
      bedoeld in [artikel 1, onder b, onder g, van het Besluit externe veiligheid inrichtingen][ref5] waarbinnen een
      logistieke functie wordt uitgeoefend gecombineerd met een kantoorfunctie, als bedoeld in artikel 1, onderdeel
      l, onder c, aanhef en onder 1°, van het Besluit externe veiligheid inrichtingen dat dit kwetsbare objecten zijn,
      uitsluitend voor zover het gaat om die kantoorfunctie.


