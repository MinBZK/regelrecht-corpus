  - number: 7ai
    text: |-
      1 In dit artikel wordt verstaan onder:

      a. *geconcentreerd afvalwater:* afvalwater, dat afvalstoffen bevat bestaande uit uitwerpselen afkomstig van
      vacuümtoiletten of voedselresten als bedoeld onder b;

      b. *voedselresten:* afvalstoffen afkomstig van het bereiden van voedingsmiddelen en daarmee samenhangende
      activiteiten.

      2 In aanvulling op [artikel 10.32a, eerste lid, aanhef en onder a, van de Wet milieubeheer][ref1] kan
      de gemeenteraad bij verordening bepalen dat bij het brengen van afvalwater afkomstig van het bereiden
      van voedingsmiddelen en daarmee samenhangende activiteiten in een voorziening voor de inzameling
      en het transport van afvalwater, wordt voldaan aan de in die verordening gestelde regels. In de
      verordening kan worden afgeweken van [artikel 6 van het Besluit lozing afvalwater huishoudens][ref2] en
      [artikel 3.131, derde lid, van het Activiteitenbesluit milieubeheer][ref3].

      3 Indien toepassing wordt gegeven aan het tweede lid, geldt voor een afvoervoorziening voor afvalwater afkomstig
      van een opstelplaats voor een watercloset en van een opstelplaats voor een keukengootsteenbak voorzien van
      apparatuur voor het vermalen van voedselresten, in afwijking van de [artikelen 6.15, tweede lid][ref4], en
      [6.16, tweede lid, onder a en b, van het Bouwbesluit 2012][ref5], het volgende:

      a. de afvoervoorziening is aangesloten op een vacuümleiding;

      b. gebouwgebonden vacuümleidingen hebben een diameter van ten minste 50 mm, waarbij niet wordt voorzien in een
      ontluchtingsleiding;

      c. vacuümleidingen voeren uitsluitend geconcentreerd afvalwater af; en

      d. vacuümleidingen worden aangesloten op het vacuümriool.

      4 Dit artikel is tot 1 januari 2040 van toepassing op de volgende gebieden:

      a. Buiksloterham in de gemeente Amsterdam, zoals aangegeven op de kaart in [bijlage 188][ref6];

      b. Strandeiland en Buiteneiland in de gemeente Amsterdam, zoals aangegeven op de kaart in [bijlage 189][ref7].


