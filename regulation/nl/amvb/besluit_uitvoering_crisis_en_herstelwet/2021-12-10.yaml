    text: |-
      1 Dit artikel is tot 29 november 2023 van toepassing op de gronden van het attractiepark De Efteling in Loon op
      Zand, zoals aangegeven op de kaart in [bijlage 130][ref1].

      2 In aanvulling op artikel 3 van [bijlage II bij het Besluit omgevingsrecht][ref2] is een omgevingsvergunning voor
      een activiteit als bedoeld in [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref3]
      niet vereist, indien deze activiteit betrekking heeft op een project dat geheel bestaat uit het bouwen van een
      bouwwerk of wijziging of uitbreiding daarvan, en aan de volgende voorwaarden voldoet:

      a. het bouwwerk is niet hoger dan 5 meter;

      b. het bouwwerk ligt of komt te liggen op een afstand van meer dan 10 meter vanaf openbaar toegankelijk gebied;

      c. de oppervlakte van het bouwwerk bedraagt niet meer dan 150 m2, met uitzondering van overkappingen die
      onlosmakelijk verbonden zijn met attracties, gelegen binnen het gebied het Sprookjesbos, zoals aangegeven op de
      kaart in [bijlage 131][ref4], waarvoor een maximale oppervlakte van 50 m2 per overkapping geldt;

      d. het bouwwerk is incidenteel toegankelijk voor onderhoud;

      e. het bouwwerk is niet toegankelijk voor het publiek, met uitzondering van de ruimte onder overkappingen, zoals
      bedoeld onder c.

      3 De in onderdeel c van het tweede lid genoemde maximale oppervlakte van 150 m2 voor bouwwerken, niet zijnde
      overkappingen mag alleen worden overschreden indien dit niet in strijd is met het op die gronden geldende
      bestemmingsplan.

      4 In aanvulling op artikel 2 van [bijlage II bij het Besluit omgevingsrecht][ref5]
      is een omgevingsvergunning voor activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder a of c, van de Wet algemene bepalingen omgevingsrecht][ref6] niet vereist, indien
      deze activiteiten betrekking hebben op een bouwwerk ten behoeve van een infrastructurele of openbare voorziening,
      voor zover het betreft:

      a. een bouwwerk ten behoeve van een nutsvoorziening of het telecommunicatieverkeer, mits voldaan wordt aan de
      volgende eisen:

      1° niet hoger dan 3 meter, en

      2° de oppervlakte niet meer dan 15 m2,

      b. straatmeubilair.


