  - number: 2a
    text: |-
      1 De bepalingen, bedoeld in [artikel 2.3, zevende lid, van de wet][ref1], zijn:

      a. [artikel 2.14, eerste lid, aanhef en onder c, onder 2°, van de Wet algemene bepalingen omgevingsrecht][ref2],
      voor zover het de geldende grenswaarden betreft die voortvloeien uit de in dat onderdeel genoemde artikelen van
      de [Wet geluidhinder][ref3];

      b. onderstaande bepalingen van de [Wet bodembescherming][ref4] voor zover de afwijking van die bepalingen geen
      gevaar voor de gezondheid van mens of dier oplevert:

      1°. [artikel 1][ref5],

      2°. de [artikelen 13][ref6] en [27][ref7] voor zover de bodem is of wordt verontreinigd of aangetast door één
      of meerdere bemalingen die ten behoeve van bouw-, sloop- of onderzoekswerkzaamheden worden uitgevoerd of die het
      gevolg zijn van de onttrekking of infiltratie van grondwater door één of meerdere warmte koude opslagsystemen, en

      3°. de [artikelen 28][ref8], [29][ref9], [37][ref10], [38][ref11], [39, tweede lid][ref12], [39b][ref13],
      [40][ref14], en [42][ref15];

      c. de [hoofdstukken V][ref16] en [VI van de Wet geluidhinder][ref17] voor zover de betrokken bepalingen een ten
      hoogste toelaatbare geluidsbelasting inhouden;

      d. de [artikelen 4.9 tot en met 4.16 van het Besluit geluidhinder][ref18] voor zover die bepalingen een ten hoogste
      toelaatbare geluidsbelasting inhouden, en

      e. [artikel 20.3, eerste lid, van de Wet milieubeheer][ref19] ten aanzien van besluiten met betrekking tot de
      bodem.

      2 [Artikel 2.19 van het Activiteitenbesluit milieubeheer][ref20] is op het bestemmingsplan van overeenkomstige
      toepassing.


