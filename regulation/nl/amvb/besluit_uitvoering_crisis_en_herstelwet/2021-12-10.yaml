      Voor het project stedelijke ontwikkelingen Cadzand-Bad in de gemeente Sluis wordt in aanvulling op
      [artikel 2.3.1, eerste lid, van het Besluit algemene regels ruimtelijke ordening][ref1] tot uiterlijk 9 september
      2025 onder «stedelijk gebied» mede verstaan de in de Ontwikkelingsvisie Cadzand-Bad 2006 en de Schilvisie Cadzand-
      Bad 2011 aangewezen ruimte voor stedenbouwkundige ontwikkelingen.


