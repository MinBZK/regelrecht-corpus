  - number: '9'
    text: |-
      Als lokaal project met nationale betekenis als bedoeld in [artikel 2.18][ref1] juncto
      [artikel 2.19 van de wet][ref2] worden aangewezen:

      a. FlorijnAs te Assen, omvattende de gebieden Stadsboulevard, het Stadsbedrijvenpark, het Havenkwartier, de Blauwe
      As 2e fase, het Stationsgebied, Assen-Zuid en het Nationaal landschap Drentsche Aa ten oosten van de stad zoals
      aangegeven op de kaart in [bijlage 5][ref3];

      b. Rotterdam Central District omvattende de projecten Schiekadeblok, Weenapoint, Kruispleingarage, Delftseplein, OV
      Terminal, Conradstraat, Calypso zoals aangegeven op de kaart in [bijlage 6][ref4], en

      c. Stationsgebied Utrecht omvattende gebied 1 (Vredenburg-Catharijnesingel, Smakkelaarsveld/Nieuwe Stationsstraat,
      OV-terminal, Knoopkazerne, Van Sijpesteijnkwartier, Kop Jaarbeursterrein) en gebied 2 (Jaarbeurskwartier inclusief
      parkeerterrein en parkeergarage overzijde Merwedekanaal, Lombokplein en Paardenveld) zoals aangegeven op de kaart
      in [bijlage 7][ref5].


