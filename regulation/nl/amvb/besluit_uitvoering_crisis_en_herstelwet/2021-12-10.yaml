  - number: 7af
    text: |-
      1 Dit artikel is tot 1 januari 2025 van toepassing binnen de provincies Gelderland, Limburg en Noord-Brabant.

      2 Het bevoegd gezag is het bestuursorgaan dat bevoegd zou zijn of is om een omgevingsvergunning voor de betrokken
      inrichting te verlenen.

      3 Onverminderd het [Besluit emissiearme huisvesting][ref1] kan het bevoegd gezag in de omgevingsvergunning, bedoeld
      in [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2], en voor een
      inrichting type B, bedoeld in [artikel 1.2 van het Activiteitenbesluit milieubeheer][ref3], bij besluit maatregelen
      voorschrijven die de emissie van geur, ammoniak of zwevende deeltjes (PM) verminderen, als blijkt dat de nadelige
      gevolgen van deze emissies voor het milieu verder kunnen onderscheidenlijk moeten worden beperkt, vanwege:

      a. de ontwikkeling van de technische mogelijkheden tot bescherming van het milieu;

      b. de ontwikkeling van de kwaliteit van het milieu;

      c. de cumulatieve gevolgen van de emissie van geur, ammoniak of zwevende deeltjes (PM) door veehouderijen;

      d. door het bevoegd gezag vastgesteld beleid voor verbetering van de luchtkwaliteit; of

      e. onaanvaardbare geurhinder als bedoeld in het twaalfde lid.

      4 Indien voor dierenverblijven die zijn opgericht voor 1 januari 2007 toepassing wordt gegeven aan het derde lid,
      kan het bevoegd gezag afwijken van [artikel 5, tweede lid, van het Besluit emissiearme huisvesting][ref4].

      5 Indien voor een inrichting type B als bedoeld in [artikel 1.2 van het Activiteitenbesluit milieubeheer][ref5]
      toepassing wordt gegeven aan het derde lid, kan het bevoegd gezag afwijken van de
      [artikelen 3.113 tot en met 3.119a van het Activiteitenbesluit milieubeheer][ref6].

      6 In aanvulling op [artikel 2.31, tweede lid, aanhef en onder b, van de Wet algemene bepalingen omgevingsrecht][ref7]
      kan het bevoegd gezag de voorschriften van een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref8] wijzigen, vanwege:

      a. de cumulatieve gevolgen van de emissie van geur, ammoniak of zwevende deeltjes (PM) door veehouderijen;

      b. door het bevoegd gezag vastgesteld beleid voor verbetering van de luchtkwaliteit; of

      c. onaanvaardbare geurhinder als bedoeld in het twaalfde lid.

      7 Bij het wijzigen van de voorschriften van een omgevingsvergunning als bedoeld in het zesde lid kan het bevoegd
      gezag afwijken van het [Besluit emissiearme huisvesting][ref9].

      8 Indien toepassing wordt gegeven aan het zesde lid, is
      [artikel 2.31a van de Wet algemene bepalingen omgevingsrecht][ref10] van overeenkomstige toepassing.

      9 Voor het voorschrijven van maatregelen, bedoeld in het derde lid, is
      [artikel 3, derde lid, laatste volzin, van de Wet ammoniak en veehouderij][ref11] ook van toepassing op een
      veehouderij waartoe geen IPPC-installatie behoort.

      10 In afwijking van [artikel 3, derde lid, tweede volzin, van de Wet ammoniak en veehouderij][ref12] kunnen ook
      voorschriften worden gesteld over huisvestingssystemen die op 1 januari 2007 al aanwezig waren.

      11 In aanvulling op [artikel 2.33, tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref13] kan het
      bevoegd gezag een omgevingsvergunning geheel of gedeeltelijk intrekken als deze betrekking heeft op een activiteit
      als bedoeld in [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref14] als sprake is van onaanvaardbare
      geurhinder als bedoeld in het twaalfde lid.

      12 Bij het bepalen of sprake is van onaanvaardbare geurhinder wordt ten minste rekening gehouden met de volgende
      aspecten:

      a. lokaal geurbeleid;

      b. de individuele en cumulatieve geurbelasting ter plaatse van geurgevoelige objecten;

      c. de aard, omvang en waardering van de geur die vrijkomt;

      d. de historie van de betreffende inrichting en het klachtenpatroon met betrekking tot geurhinder;

      e. de bestaande en verwachte geurhinder van de betreffende inrichting; en

      f. de kosten en baten van technische voorzieningen en gedragsregels in de inrichting.

      13 In aanvulling op [artikel 3 van de Wet geurhinder en veehouderij][ref15] wordt een omgevingsvergunning als
      bedoeld in [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref16]
      geweigerd indien niet kan worden voldaan aan voorschriften die vanwege de technische kenmerken en de geografische
      ligging van de veehouderij of vanwege de plaatselijke milieuomstandigheden moeten worden gesteld.

      14 In afwijking van [artikel 3, vierde lid, van de Wet geurhinder en veehouderij][ref17] kan het bevoegd gezag
      bepalen dat:

      a. de toename van de geurbelasting ten gevolge van die wijziging minder bedraagt dan de helft van de vermindering
      van de geurbelasting die het gevolg zou zijn van de toegepaste geurbelastingreducerende maatregel bij het eerder
      vergunde veebestand; of

      b. de totale geurbelasting na die wijziging minder bedraagt dan het gemiddelde van de in de verordening vastgelegde
      waarde en de geurbelasting die de inrichting voorafgaand aan het toepassen van de maatregel veroorzaakte.

      15 In afwijking van de [artikelen 3.115, tweede lid, aanhef en onder b][ref18], en
      [3.118, tweede lid, van het Activiteitenbesluit milieubeheer][ref19] kan het bevoegd gezag bij uitbreiding van een
      dierenverblijf bij maatwerkvoorschrift bepalen dat de geurbelasting, bedoeld in artikel 3.115, tweede lid, onder b,
      van dat besluit, minder bedraagt dan het in dat lid bedoelde gemiddelde.

      16 Op welke wijze invulling wordt gegeven aan de bevoegdheid, bedoeld in het veertiende en vijftiende lid, wordt
      vastgelegd in beleidsregels, in een bestemmingsplan met verbrede reikwijdte als bedoeld in [artikel 7c][ref20] of
      in de verordening, bedoeld in [artikel 6 van de Wet geurhinder en veehouderij][ref21].

      17 Het bevoegd gezag kent degene tot wie een besluit is gericht krachtens of met toepassing van het derde,
      zesde, elfde of dertiende tot en met vijftiende lid en die ten gevolge daarvan kosten maakt of schade lijdt die
      redelijkerwijs niet of niet geheel voor zijn rekening behoren te komen op zijn verzoek of uit eigen beweging een
      naar billijkheid te bepalen vergoeding toe, voor zover niet op een andere wijze in een redelijke vergoeding is of
      kan worden voorzien.

      18 Indien toepassing wordt gegeven aan het zeventiende lid, is
      [artikel 4.2, tweede en derde lid, van de Wet algemene bepalingen omgevingsrecht][ref22] van overeenkomstige
      toepassing.


