    text: |-
      1 In dit artikel wordt verstaan onder:

      a. *afvalwater:* afvalwater, dat gewasbeschermingsmiddelen bevat en afkomstig is van het telen of kweken van
      gewassen in een kas;

      b. *overig afvalwater:* afvalwater als bedoeld in
      [artikel 3.63, eerste lid, onder a tot en met i, van het Activiteitenbesluit milieubeheer][ref1], voor zover dit
      andere afvalwaterstromen bevat dan bedoeld onder a.

      2 In aanvulling op [artikel 10.32a, eerste lid, van de Wet milieubeheer][ref2] kunnen de gemeenteraden van
      Zaltbommel en Maasdriel ten behoeve van de collectieve zuivering van afvalwater bij verordening bepalen dat in
      aangewezen gebieden bij het brengen van afvalwater wordt voldaan aan de in die verordening gestelde regels.

      3 In aanvulling op [artikel 10.32a, tweede lid, van de Wet milieubeheer][ref3] maken de gemeenteraden van
      Zaltbommel en Maasdriel geen gebruik van de mogelijkheid, bedoeld in het eerste lid, onder b, van dat artikel,
      als van degene bij wie afvalwater vrijkomt redelijkerwijs geen andere wijze van afvoer van dat water kan worden
      gevergd.

      4 In aanvulling op [artikel 3.63, eerste lid, van het Activiteitenbesluit milieubeheer][ref4] is het in de door de
      gemeenteraden van Maasdriel en Zaltbommel aangewezen gebieden in een oppervlaktewaterlichaam lozen van afvalwater
      en overig afvalwater toegestaan, als ten minste:

      a. het perceel waar het afvalwater en overig afvalwater vrijkomt niet is aangesloten op een voorziening voor
      de inzameling en het transport van afvalwater, waarop geloosd kan worden, en de afstand tot de dichtstbijzijnde
      voorziening voor de inzameling en het transport van afvalwater, waarop kan worden geloosd, meer dan 40 meter
      bedraagt, of

      b. het lozen van afvalwater en overig afvalwater in een voorziening voor de inzameling en het transport van
      afvalwater waarop het perceel waar het afvalwater vrijkomt is aangesloten, gelet op de capaciteit van dat riool
      niet volledig mogelijk is.

      5 Van de in dit artikel opgenomen bevoegdheden kan tot 1 januari 2027 gebruik worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.63
