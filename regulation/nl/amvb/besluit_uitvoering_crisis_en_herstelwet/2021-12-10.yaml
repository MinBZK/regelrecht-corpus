  - number: 6j
    text: |-
      1 Het verbod uit [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref1]
      geldt, voor zover het gaat om de gronden, bedoeld in [artikel 2.10, eerste lid, onder b, c of d, van die wet][ref2],
      tot 1 september 2025 niet voor een bouwactiviteit als bedoeld in het derde lid die wordt
      uitgevoerd onder verantwoordelijkheid van een architect of een dienstverrichter als bedoeld in
      [artikel 1 van de Wet op de architectentitel][ref3].

      2 In afwijking van het eerste lid geldt het verbod uit
      [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref4] tot de
      inwerkingtreding van de [Omgevingswet][ref5] niet voor een bouwactiviteit als bedoeld in het derde lid
      die wordt uitgevoerd onder verantwoordelijkheid van een architect of een dienstverrichter als bedoeld in
      [artikel 1 van de Wet op de architectentitel][ref6] die voldoet aan de in het vierde lid genoemde eisen.

      3 De bouwactiviteit bestaat uit de realisatie van:

      a. een of twee eengezinswoningen;

      b. een op de grond staand bijbehorend bouwwerk als bedoeld in
      [artikel 1, eerste lid, van bijlage II bij het Besluit omgevingsrecht][ref7], mits niet hoger dan tien meter;

      c. een dakopbouw waarbij geen extra woningen worden gerealiseerd;

      d. een dakterras;

      e. een dakkapel, of

      f. de splitsing of samenvoeging van woningen, mits geen verandering van de bouwconstructie plaatsvindt.

      4 Eisen als bedoeld in het tweede lid houden in dat de architect of de dienstverrichter als bedoeld in
      [artikel 1 van de Wet op de architectentitel][ref8] voldoet aan de door de raad gestelde eisen met betrekking tot:

      a. de benodigde beroepservaring, vakkennis, vaardigheden en inzicht op het gebied van toetsing van en toezicht
      houden op de uitvoering van de bouwregelgeving, en

      b. de wijze waarop de toetsing en het toezicht op de bouwactiviteiten plaatsvindt.

      5 Onder het in het eerste en tweede lid bedoelde uitvoeren van een bouwactiviteit onder verantwoordelijkheid van
      een architect of dienstverrichter zoals bedoeld in [artikel 1 van de Wet op de architectentitel][ref9] worden
      tenminste de volgende verplichtingen voor die architect of dienstverrichter begrepen:

      a. indien het tweede lid van toepassing is, heeft de architect vanaf de opdrachtverlening tot en met de oplevering
      van het bouwwerk opdracht voor het ontwerp en het toezicht op het bouwwerk en draagt er zorg voor dat de
      werkzaamheden in het kader van kwaliteitsborging zo worden uitgevoerd zodat het gerechtvaardigd vertrouwen ontstaat
      dat het eindresultaat van de bouwwerkzaamheden voldoet aan de daarvoor geldende regelgeving;

      b. de architect meldt binnen drie weken voor de start van de uitvoering van de bouwactiviteit aan burgemeester
      en wethouders dat voor die activiteit toepassing wordt gegeven aan dit artikel en aan de daarvoor door de raad
      gestelde eisen;

      c. binnen drie weken na de oplevering van de bouwactiviteiten door de bouwer overlegt de architect een
      opleverdossier aan burgemeester en wethouders dat voldoet aan de daaraan door de raad gestelde eisen.

      6 Dit artikel is van toepassing op de door burgemeester en wethouders van de gemeente Rotterdam aangewezen
      locaties.


