  - number: 7g
    text: |-
      1 De voor het grondgebied van een gemeente vastgestelde bestemmingsplannen gelden als één bestemmingsplan.

      2 [Artikel 7c][ref1] is op een gehele of gedeeltelijke herziening van het bestemmingsplan, bedoeld in het eerste
      lid, van overeenkomstige toepassing.

      3 Een bestemmingsplan voor een gedeelte van het grondgebied van een gemeente dat na het tijdstip van
      inwerkingtreding van dit besluit onherroepelijk wordt, maakt vanaf het tijdstip waarop dit bestemmingsplan
      onherroepelijk is geworden deel uit van het bestemmingsplan, bedoeld in het eerste lid.

      4 Dit artikel is van toepassing op de gemeenten:

      a. Breda;

      b. Bussum;

      c. Deventer;

      d. Oldenzaal;

      e. Soest;

      f. Venlo;

      g. Meerssen;

      h. Stadskanaal;

      i. Veere;

      j. Kampen;

      k. Lopik;

      l. Peel en Maas;

      m. Berg en dal;

      n. Dalfsen;

      o. Heerlen;

      p. Utrecht;

      q. Urk;

      r. Zeist;

      s. Amersfoort;

      t. Nunspeet;

      u. Leusden;

      v. Harderwijk;

      w. Schouwen-Duiveland.

      5 Van de in dit artikel bedoelde bevoegdheid tot het vaststellen van een bestemmingsplan met verbrede reikwijdte
      kan tot 1 januari 2024 gebruik worden gemaakt mits het ontwerp van deze plannen ter inzage is gelegd voor de
      inwerkingtreding van de [Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027929#Artikel7c
