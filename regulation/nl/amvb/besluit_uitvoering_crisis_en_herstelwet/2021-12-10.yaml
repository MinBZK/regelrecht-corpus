  - number: 7h
    text: |-
      1 In aanvulling op [artikel 2.1 van de Wet ruimtelijke ordening][ref1] kan de raad van de gemeente Meerssen
      uiterlijk op 20 september 2019 een structuurvisie vaststellen waarin zijn vastgelegd de hoofdzaken van het door de
      gemeente te voeren beleid met het oog op:

      a. het bereiken en in stand houden van een veilige en gezonde fysieke leefomgeving en een goede omgevingskwaliteit,
      en

      b. het doelmatig beheren, gebruiken en ontwikkelen van de fysieke leefomgeving ter vervulling van maatschappelijke
      functies.

      2 Bij de voorbereiding, vormgeving, inrichting en beschikbaarstelling van de structuurvisie kan worden afgeweken
      van:

      a. de volgende artikelen van het [Besluit ruimtelijke ordening][ref2]:

      1°. [1.2.1, tweede lid][ref3], en [1.2.1a, onderdeel a][ref4], onder de voorwaarde dat het ontwerp van de
      structuurvisie of de vastgestelde structuurvisie elektronisch op een algemeen toegankelijke wijze beschikbaar
      wordt gesteld en blijft op een door de raad te bepalen internetadres. In dat geval bevat de landelijke voorziening,
      bedoeld in artikel 1.2.1, tweede lid, van het Besluit ruimtelijke ordening een verwijzing naar dit internetadres;

      2°. [3.1.6, eerste lid, onder f, en vijfde lid, onder c][ref5];

      b. de bij de ministeriële regeling, bedoeld in [artikel 1.2.6 van het Besluit ruimtelijke ordening][ref6], gestelde
      regels of nadere regels.


