  - number: 7j
    text: |-
      1 Dit artikel is van toepassing op door de raad bij bestemmingsplan aan te wijzen locaties binnen de gemeenten:

      a. Heerhugowaard;

      b. Hoorn;

      c. Koggenland;

      d. Leeuwarden;

      e. Ooststellingwerf;

      f. Weststellingwerf;

      g. Peel en Maas.

      2 In aanvulling op artikel 3, van [Bijlage II, van het Besluit omgevingsrecht][ref1] is binnen de bij
      bestemmingsplan aangewezen locaties gedurende een periode van dertig jaar na inwerkingtreding van dat plan geen
      omgevingsvergunning vereist voor een activiteit, die betrekking heeft op een collector voor warmteopwekking of een
      paneel voor elektriciteitsopwekking op de grond of op een op de grond staand bouwwerk, mits het bouwwerk, waarop de
      collectoren of panelen worden geplaatst, voldoet aan de volgende eisen:

      1°. de bouwhoogte van het bouwwerk niet hoger is dan vijf meter;

      2°. het bouwwerk niet voorzien is van een niet op de grond gelegen buitenruimte.

      3 In aanvulling op [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref2] kunnen voor die aan
      te wijzen locaties in het bestemmingsplan regels worden gesteld met betrekking tot het uiterlijk van de
      in het eerste lid bedoelde bouwwerken en beleidsregels worden opgenomen die betrekking hebben op redelijke
      eisen van welstand als bedoeld in [hoofdstuk II, afdeling 3, van de Woningwet][ref3]. In afwijking van
      [artikel 12b van de Woningwet][ref4] wordt het advies van de welstandscommissie dan wel de stadsbouwmeester mede
      gebaseerd op de criteria, die zijn opgenomen in het bestemmingsplan.

      4 In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref5] wordt de bestemming van gronden
      voor de aan te wijzen locaties, met inbegrip van de met het oog daarop gestelde regels, binnen een periode van
      dertig jaar opnieuw vastgesteld.

      5 In afwijking van [artikel 3.2 van de Wet ruimtelijke ordening][ref6] geldt een voorlopige bestemming voor de aan
      te wijzen locaties voor de duur van ten hoogste dertig jaar.

      6 Van de in dit artikel bedoelde bevoegdheid tot het bij bestemmingsplan aanwijzen van locaties kan tot 1 januari
      2024 gebruik worden gemaakt mits het ontwerp van het bestemmingsplan ter inzage is gelegd voor de inwerkingtreding
      van de [Omgevingswet][ref7].


