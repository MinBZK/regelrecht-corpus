preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister-President, Minister van Algemene Zaken van 15 juni 2010, nr. 3093158, gedaan
    mede namens Onze Ministers van Verkeer en Waterstaat en van Justitie en in overeenstemming met Onze Ministers van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Economische Zaken;

    Gelet op de artikelen 1.2, 2.2, eerste lid, 2.3, zesde lid, 2.4, eerste en derde lid, 2.9, eerste lid, onderdeel b,
    2.18 en 5.1, eerste lid, van de Crisis- en herstelwet en de artikelen 105 en 107 van de Wet geluidhinder;

    De Raad van State gehoord (advies van 30 juni 2010, no. W01.10.0253/I);

    Gezien het nader rapport van Onze Minister-President, Minister van Algemene Zaken van 9 juli 2010, nr. 3093990,
    uitgebracht mede namens Onze Ministers van Verkeer en Waterstaat en van Justitie en in overeenstemming met Onze
    Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0027929/2021-12-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *bestemmingsplan met verbrede reikwijdte:* bestemmingsplan als bedoeld in [artikel 7c][ref1] of [7g][ref2];
        - *bijlage:* bij dit besluit behorende bijlage;
        - *eco iglo:* gebouw bestaande uit een drijfelement van ten hoogste 400 m2 waarop een staal-glas of koolstof-glas
      constructie in de vorm van een halve bol is geplaatst, waarbij in de binnen het bouwwerk benodigde energie wordt
      voorzien door middel van aardwarmte, zonnecellen of miniwindturbines en in het binnen het bouwwerk benodigde water
      wordt voorzien door middel van een hemelwateropvanginstallatie, gecombineerd met nanofiltratie ten behoeve van de
      water- of drinkwatervoorziening;
        - *miniwindturbine:* windturbine met een rotordiameter van ten hoogste 5 meter en een rotoroppervlak van ten
      hoogste 20 m2, met een horizontale of verticale rotoras, ten behoeve van levering van elektriciteit achter de
      meter of aan een accu ten behoeve van eigen gebruik, welke windturbine gecertificeerd is volgens IEC 61400-12
      (2006), dan wel gecertificeerd is volgens de standaarden van de American Wind Energy Association of de British
      Wind Energy Association of het Kleinwind keur heeft op basis van de Nederlandse beoordelingsrichtlijn Kleine
      Windturbines, en met een tiphoogte van niet meer dan tien meter, gemeten vanaf de nokhoogte van het gebouw waaraan
      die miniwindturbine elektriciteit levert;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *wet:* [Crisis- en herstelwet][ref3];
        - *zuigercompressor-windturbinecombinatie:* windturbine met een rotordiameter van ten hoogste vijf meter en
      een rotoroppervlak van ten hoogste 20 m2, met een horizontale of verticale rotoras met een hoogte van niet meer
      dan 25 meter, gemeten vanaf de voet van de windturbine tot de tip van de rotor, waarbij het mechanisch vermogen
      van de rotor direct wordt gebruikt voor de aandrijving van een zuigercompressor of een ozongenerator en die
      klimaatbeheersing en ammoniakreductie in melkrundveehouderijen als functie heeft, of ten doel heeft water of
      drinkwater te winnen uit de lucht.


