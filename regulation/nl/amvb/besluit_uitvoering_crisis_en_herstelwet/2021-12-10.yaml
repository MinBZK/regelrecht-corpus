  - number: 7o
    text: |-
      1 Dit artikel is van toepassing op bestemmingsplannen als bedoeld in
      [artikel 3.1 van de Wet ruimtelijke ordening][ref1] en inpassingsplannen als bedoeld in [artikel 3.26][ref2]
      respectievelijk [artikel 3.28 van de Wet ruimtelijke ordening][ref3] voor de door provinciale staten van de
      provincie Groningen aangewezen concentratiegebieden voor de realisering van windturbineparken en voor Windpark
      Fryslân en Windpark De Drentse Monden en Oostermoer. In deze gebieden kunnen aan gronden voorlopige bestemmingen
      voor het bouwen en in werking hebben van een windturbine voor een termijn van tussen de vijfentwintig en dertig
      jaar worden toegekend aan de exacte locaties van de windturbines, mits deze worden vastgesteld voor 15 juli 2021.

      2 In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref4], respectievelijk
      [artikel 3.26][ref5] juncto artikel 3.1, tweede lid, van de Wet ruimtelijke ordening in verbinding met
      [artikel 9e van de Elektriciteitswet 1998][ref6], respectievelijk [artikel 3.28][ref7] juncto artikel 3.1, tweede
      lid, van de Wet ruimtelijke ordening in verbinding met [artikel 9b van de Elektriciteitswet 1998][ref8], wordt de
      bestemming van gronden waaraan tevens een voorlopige bestemming voor een windturbine is toegekend, met inbegrip
      van de met het oog op de toegekende bestemmingen gestelde regels, binnen een periode van vijfendertig jaar opnieuw
      vastgesteld. Artikel 3.1, derde tot en met vijfde lid, van de Wet ruimtelijke ordening is niet van toepassing.

      3 In afwijking van [artikel 3.2][ref9], respectievelijk [artikel 3.26][ref10] juncto artikel 3.2, tweede
      lid, van de Wet ruimtelijke ordening in verbinding met [artikel 9e van de Elektriciteitswet 1998][ref11]
      respectievelijk [artikel 3.28][ref12] juncto artikel 3.2 van de Wet ruimtelijke ordening in verbinding met
      [artikel 9b van de Elektriciteitswet 1998][ref13], geldt de voorlopige bestemming voor een termijn van tussen de
      vijfentwintig en dertig jaar.

      4 In afwijking van [artikel 3.26, vijfde lid, van de Wet ruimtelijke ordening][ref14]
      en [artikel 9e van de Elektriciteitswet 1998][ref15] respectievelijk
      [artikel 3.28, vijfde lid, van de Wet ruimtelijke ordening][ref16] en
      [artikel 9b van de Elektriciteitswet 1998][ref17] is de raad voor de duur van de in het tweede lid bedoelde
      termijn niet bevoegd de voor de exacte locaties van de windturbines in een inpassingsplan opgenomen bestemming en
      voorlopige bestemming te wijzigen.

      5 In afwijking van het bepaalde in het eerste tot en met het derde lid kan de raad van Delfzijl in
      het bestemmingsplan voor het bedrijventerrein Oosterhorn voorlopige bestemmingen voor het bouwen en in
      werking hebben van een windturbine voor een termijn van tussen de vijfentwintig en tweeëndertig jaar
      toekennen, mits de voorlopige bestemming wordt toegekend aan de concrete mastposities van de windturbines.
      De bestemming van deze gronden wordt binnen een periode van zevenendertig jaar opnieuw vastgesteld.
      [Artikel 3.1, derde tot en met vijfde lid, van de Wet ruimtelijke ordening][ref18] is gedurende deze periode niet
      van toepassing.


