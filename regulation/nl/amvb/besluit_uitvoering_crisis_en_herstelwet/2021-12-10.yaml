      1 Dit artikel is van toepassing op de volgende gemeenten of gebieden:

      a. Bloemendaal, Blekersveld, zoals aangegeven op de kaart in [bijlage 168][ref1];

      b. Enschede;

      c. Giessenlanden, Bedrijventerrein Betonson, zoals aangegeven op de kaart in [bijlage 80][ref2];

      d. Gooise Meren, Laren en Hilversum, Crailo, zoals aangegeven op de kaart in [bijlage 169][ref3];

      e. Harderwijk;

      f. Leusden;

      g. Zaanstad;

      h. Zuidhorn, Woongebied Tussen de Gasten, zoals aangegeven op de kaart in [bijlage 165][ref4].

      2 In afwijking van [artikel 5.2 van het Bouwbesluit 2012][ref5] geldt voor te bouwen woningen een
      energieprestatiecoëfficiënt van 0,2, mits de aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de Wet algemene bepalingen omgevingsrecht][ref6] na inwerkingtreding van
      dit besluit en uiterlijk 31 december 2020 is ingediend.

      3 In aanvulling op [artikel 8 van de Woningwet][ref7] kunnen tot en met 31 december 2020 in
      de bouwverordening, in afwijking van [artikel 5.2 van het Bouwbesluit 2012][ref8], voor te
      bouwen gebruiksfuncties waarvoor een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de Wet algemene bepalingen omgevingsrecht][ref9] vereist is,
      voorschriften worden opgenomen die voorzien in een lagere energieprestatiecoëfficiënt.

      4 In aanvulling op [artikel 8 van de Woningwet][ref10] kunnen in de periode tot de inwerkingtreding van de
      [Omgevingswet][ref11] voor te bouwen gebruiksfuncties waarvoor een omgevingsvergunning voor een activiteit als
      bedoeld in [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref12]
      vereist is, in de bouwverordening voorschriften worden opgenomen die voorzien in lagere maximumwaarden voor
      energiebehoefte en primair fossiel energiegebruik en een hogere minimumwaarde voor het aandeel hernieuwbare energie
      dan bedoeld in [artikel 5.2, eerste lid, van het Bouwbesluit 2012][ref13].


