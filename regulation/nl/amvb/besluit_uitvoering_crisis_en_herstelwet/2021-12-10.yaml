      1 Dit artikel is tot 15 oktober 2022 van toepassing op de op het Bedrijventerrein Newtonpark IV in de gemeente
      Leeuwarden gelegen experimenteerinrichting, gesitueerd op het perceel met de kavelaanduidingen 11, 12 en 13 binnen
      de percelen, kadastraal bekend: Leeuwarden HzmE 2008, Leeuwarden HzmE 1714 en Leeuwarden HzmE 1692.

      2 De experimenteerinrichting wordt in afwijking van
      [artikel 1.1, vierde lid, tweede volzin, van de Wet milieubeheer][ref1] aangemerkt als een inrichting als bedoeld
      in [artikel 1.1 van de Wet algemene bepalingen omgevingsrecht][ref2].

      3 De [artikelen 2.4, tweede lid][ref3], en
      [2.14, eerste lid, onderdeel c, onder 1°, van de Wet algemene bepalingen omgevingsrecht][ref4] zijn niet van
      toepassing.

      4 Het bepaalde krachtens [artikel 2.8 van de Wet algemene bepalingen omgevingsrecht][ref5] is niet van toepassing
      voor zover dat een omschrijving van de activiteiten of mogelijke maatregelen vereist.


