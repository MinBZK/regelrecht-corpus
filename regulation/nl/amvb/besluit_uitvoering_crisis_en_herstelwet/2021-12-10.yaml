      1 Dit artikel is van toepassing binnen het grondgebied van de gemeente Leeuwarden.

      2 Het verbod, gesteld in [artikel 2.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1] geldt tot
      17 juli 2020 niet voor het bouwen van een zuigercompressor-windturbinecombinatie met ten hoogste 400 kg ammoniak
      als koudemiddel:

      a. op of in directe nabijheid van een inrichting die tot een krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref2] aangewezen categorie behoort en die uitsluitend of in
      hoofdzaak is bestemd voor het houden van melkrundvee, of

      b. met als doel (drink)water te winnen uit de lucht.

      3 Behoudens in gevallen waarin sprake is van een inrichting type B als bedoeld
      in [artikel 1.2 van het Activiteitenbesluit milieubeheer][ref3], blijft
      [paragraaf 3.2.3 van het Activiteitenbesluit milieubeheer][ref4] tot 17 juli 2020 buiten toepassing voor het in
      werking hebben van een zuigercompressor-windturbinecombinatie op de inrichting of in de directe nabijheid daarvan.


