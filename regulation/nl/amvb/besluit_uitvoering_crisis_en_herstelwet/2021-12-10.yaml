  - number: 7aa
    text: |-
      1 Dit artikel is tot de inwerkingtreding van de [Omgevingswet][ref1] van toepassing binnen de provincies
      Gelderland, Limburg, Noord-Brabant en Overijssel.

      2 In aanvulling op [artikel 2, zesde lid][ref2] en [bijlage I bij de Regeling geurhinder en veehouderij][ref3] kan
      het bestuursorgaan dat bevoegd zou zijn of is om een omgevingsvergunning voor de betrokken inrichting te verlenen
      voor een huisvestingssysteem dat niet in bijlage 1 van deze regeling is opgenomen op aanvraag een bijzondere
      geuremissiefactor vaststellen die bij de berekening van het aantal odour units per seconde per dier van een
      diercategorie als bedoeld in artikel 2, zesde lid, van deze regeling wordt toegepast.

      3 Het bestuursorgaan dat bevoegd zou zijn of is om een omgevingsvergunning voor de betrokken inrichting te verlenen
      kan een bijzondere geuremissiefactor vaststellen indien naar zijn oordeel:

      a. toepassing van het huisvestingssysteem voldoende bijdraagt aan de ontwikkeling van innovatieve stalsystemen voor
      de reductie van geur;

      b. de verwachte emissie van het huisvestingssysteem minimaal 10% lager is dan de geuremissiefactor die is opgenomen
      voor overige huisvesting voor die diercategorie in [bijlage 1 bij de Regeling geurhinder en veehouderij][ref4];

      c. het huisvestingssysteem zich leent voor toepassing in de praktijk;

      d. de controleerbaarheid van de werking van het huisvestingssysteem voldoende is gewaarborgd; en

      e. voldoende is gewaarborgd dat de geuremissie overeenkomstig het Protocol voor meting van geuremissie uit
      huisvestingssystemen in de veehouderij 2010 of een gelijkwaardige methode wordt gemeten en dat over de wijze van
      meten en de resultaten van de metingen aan hem wordt gerapporteerd.

      4 In aanvulling op [artikel 2.2a van het Besluit omgevingsrecht][ref5] wordt aangewezen als categorie activiteiten
      als bedoeld in [artikel 2.1, eerste lid, onder i, van de Wet algemene bepalingen omgevingsrecht][ref6], voor zover
      deze plaatsvindt binnen een inrichting als bedoeld in [artikel 1.1, derde lid, van de Wet milieubeheer][ref7], niet
      zijnde een inrichting als bedoeld in [artikel 1.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref8]
      het oprichten of wijzigen van een dierenverblijf met een huisvestingssysteem waarvoor een bijzondere
      geuremissiefactor als bedoeld in het tweede lid is vastgesteld.

      5 In aanvulling op [artikel 5.13b van het Besluit omgevingsrecht][ref9] kan een omgevingsvergunning voor de
      categorie activiteiten als bedoeld in het vierde lid worden geweigerd in het belang van bescherming van de
      leefomgeving tegen geurhinder.

      6 In afwijking van [artikel 5.13a van het Besluit omgevingsrecht][ref10] kunnen aan een omgevingsvergunning voor de
      categorie activiteiten, bedoeld in het vierde lid, voorschriften worden verbonden in het belang van de bescherming
      van de fysieke leefomgeving tegen geurhinder.

      7 In aanvulling op [artikel 2.31, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref11] wijzigt het
      bevoegd gezag de voorschriften van een omgevingsvergunning als deze betrekking heeft op een activiteit als bedoeld
      in [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref12] of de categorie activiteiten, bedoeld in het
      vierde lid, indien:

      a. uit metingen blijkt dat de geuremissie in odour units per seconde per dier hoger is dan de op grond van het
      tweede lid vastgestelde bijzondere geuremissiefactor;

      b. niet binnen twee jaar nadat het huisvestingssysteem is opgericht, metingen zijn uitgevoerd; of

      c. aanvullende maatregelen nodig zijn voor een goede werking van het huisvestingssysteem.

      [Artikel 2.31a van de Wet algemene bepalingen omgevingsrecht][ref13] is van overeenkomstige toepassing.

      8 In aanvulling op
      [artikel 2.33, tweede lid, aanhef en onder d en f, van de Wet algemene bepalingen omgevingsrecht][ref14] kan het
      bevoegd gezag een omgevingsvergunning geheel of gedeeltelijk intrekken als deze betrekking heeft op een activiteit,
      bedoeld in [artikel 2.1, eerste lid, aanhef en onder e, van die wet][ref15] of de categorie activiteiten, bedoeld
      in het vierde lid, indien:

      a. uit metingen blijkt dat de geuremissie in odour units per seconde per dier hoger is dan de op grond van het
      tweede lid vastgestelde bijzondere geuremissiefactor; of

      b. niet binnen twee jaar nadat het huisvestingssysteem is opgericht, metingen zijn uitgevoerd.

      9 Indien toepassing wordt gegeven aan het achtste lid wordt het besluit bedoeld in tweede lid ingetrokken.

      10 In aanvulling op [artikel 6.19 van het Besluit omgevingsrecht][ref16] wordt als categorie van gevallen als
      bedoeld in [artikel 3.9, derde lid, tweede volzin, van de Wet algemene bepalingen omgevingsrecht][ref17] aangewezen
      de beslissing op een aanvraag om een omgevingsvergunning voor activiteiten als bedoeld in het vierde lid.


