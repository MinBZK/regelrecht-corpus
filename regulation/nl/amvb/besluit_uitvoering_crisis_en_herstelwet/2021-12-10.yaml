    text: |-
      1 Dit artikel is tot de inwerkingtreding van de [Omgevingswet][ref1] van toepassing op de gemeenten Almere, Delft,
      Eindhoven, Haarlem, Haarlemmermeer, Hoogeveen, Hulst, Schijndel en Zoetermeer.

      2 [Artikel 2.10, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref2] is niet
      van toepassing, indien een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van die wet][ref3] betrekking heeft op:

      a. een op de grond staand bijbehorend bouwwerk als bedoeld in
      [artikel 1, eerste lid, van bijlage II bij het Besluit omgevingsrecht][ref4], mits niet hoger dan 5 meter;

      b. een dakkapel;

      c. een dakraam, daklicht, lichtstraat of soortgelijke daglichtvoorziening in een dak;

      d. een collector voor warmteopwekking of een paneel voor elektriciteitsopwekking;

      e. een kozijn, kozijninvulling of gevelpaneel;

      f. een zonwering, rolhek, luik of rolluik aan of in een gebouw;

      g. tuinmeubilair;

      h. een sport- of speeltoestel voor uitsluitend particulier gebruik, mits uitsluitend functionerend met behulp van
      de zwaartekracht of de fysieke kracht van de mens;

      i. een erf- of perceelafscheiding;

      j. een vlaggenmast.

      3 Op een aanvraag om een omgevingsvergunning als bedoeld in het tweede lid is
      [artikel 2.2 van de Regeling omgevingsrecht][ref5] niet van toepassing.

      4 In de gemeente Haarlemmermeer geldt het verbod, gesteld in
      [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref6], niet voor
      aanvragen om een omgevingsvergunning als bedoeld in het tweede lid, aanhef en onder a tot en met j.

      5 Het vierde lid is niet van toepassing op het bouwen van een bouwwerk in, aan, op of bij:

      a. een rijksmonument als bedoeld in [artikel 1.1 van de Erfgoedwet][ref7];

      b. een monument of archeologisch monument waarop [artikel 9.1, eerste lid, onder b, van de Erfgoedwet][ref8] van
      toepassing is;

      c. een krachtens een provinciale of gemeentelijke verordening aangewezen monument dan wel een monument waarop,
      voordat het is aangewezen, een zodanige verordening van overeenkomstige toepassing is; of

      d. beschermde stads- en dorpsgezichten als bedoeld in [artikel 35 van de Monumentenwet 1988][ref9].


