  - number: '10'
    text: |-
      Onder besluiten als bedoeld in [artikel 1.1, eerste lid, onderdelen a en b, van de wet][ref1] worden in ieder geval
      niet verstaan besluiten omtrent planschade en nadeelcompensatie.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0027929/2021-12-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '1.1'
  - number: '11'
    text: |-
      1 Indien [afdeling 2 van hoofdstuk 1 van de wet][ref1] op een besluit van toepassing is, wordt dit bij het besluit
      en bij de bekendmaking of mededeling van het besluit vermeld.

      2 Indien tegen het besluit beroep openstaat, wordt bij het besluit en bij de bekendmaking van het besluit voorts
      vermeld dat:

      a. de beroepsgronden in het beroepschrift worden opgenomen;

      b. het beroep niet-ontvankelijk wordt verklaard, indien binnen de beroepstermijn geen gronden zijn ingediend, en

      c. deze na afloop van de beroepstermijn niet meer kunnen worden aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Afdeling2
    url: https://wetten.overheid.nl/BWBR0027929/2021-12-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0027431
        afdeling: '2'
  - number: '12'
    text: |-
      1 Indien [afdeling 2 van hoofdstuk 1 van de wet][ref1] van toepassing is op het hoger beroep tegen een uitspraak
      van de rechtbank, wordt dit in de uitspraak vermeld.

      2 De uitspraak vermeldt voorts dat:

      a. de beroepsgronden in het beroepschrift worden opgenomen;

      b. het beroep niet-ontvankelijk wordt verklaard, indien binnen de beroepstermijn geen gronden zijn ingediend, en

      c. deze na afloop van de beroepstermijn niet meer kunnen worden aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Afdeling2
    url: https://wetten.overheid.nl/BWBR0027929/2021-12-10#Artikel12
    references:
