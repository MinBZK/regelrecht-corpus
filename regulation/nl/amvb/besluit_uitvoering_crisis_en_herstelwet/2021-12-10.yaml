      1 Dit artikel is van toepassing op:

      a. het project Ecodorp in de gemeente Boekel, zoals aangegeven op de kaart in [bijlage 50][ref1], tot 18 maart
      2025;

      b. het project Ecodorp in de gemeente Vlagtwedde, zoals aangegeven op de kaart in [bijlage 97][ref2], tot
      28 oktober 2026.

      2 Bij het bouwen van woningen kan worden afgeweken van de [artikelen 2.33, eerste lid][ref3], [3.74][ref4],
      [3.75, eerste, tweede en derde lid][ref5], [4.3][ref6] en [4.22, eerste lid, van het Bouwbesluit 2012][ref7].

      3 Het verbod, gesteld in [artikel 2.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref8] geldt niet
      voor het bouwen van een miniwindturbine.

      4 Bij het bouwen van een miniwindturbine wordt het bepaalde krachtens
      [artikel 2.6.9, derde lid, van het Besluit algemene regels ruimtelijke ordening][ref9] in acht genomen.


