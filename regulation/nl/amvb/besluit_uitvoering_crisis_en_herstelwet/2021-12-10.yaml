      1 In de jaarlijkse voortgangsrapportage over de uitvoering van de wet geeft Onze Minister, indien daartoe
      aanleiding bestaat, aan in hoeverre afwijkingen bij wege van experiment van het bepaalde bij of krachtens de
      betrokken in [artikel 2.4, eerste lid, van de wet][ref1] genoemde wetten aan haar doel beantwoorden en of de
      overeenkomstig artikel 2.4, derde lid, van de wet vastgestelde ten hoogste toegestane tijdsduur van die afwijkingen
      aanpassing behoeft.

      2 Het eerste lid is niet van toepassing op het experiment duurzaam stortbeheer, bedoeld in
      [artikel 17b, eerste lid, van het Stortbesluit bodembescherming][ref2].


