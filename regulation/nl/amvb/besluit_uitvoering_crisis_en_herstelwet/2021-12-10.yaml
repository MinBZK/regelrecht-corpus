    text: |-
      1 Bij het vaststellen van een bestemmingsplan kan de raad besluiten tot afwijking gedurende een periode van
      maximaal tien jaar van:

      a. [artikel 45, eerste lid, van de Wet geluidhinder][ref1], met dien verstande dat de ter plaatse ten hoogste
      toelaatbare geluidbelasting, bedoeld in [artikel 44 van die wet][ref2], voor woningen in stedelijk gebied niet
      hoger mag worden vastgesteld dan 65 dB(A);

      b. [artikel 83, eerste lid, van de Wet geluidhinder][ref3] met dien verstande dat:

      1°. niet afgeweken kan worden van de ter plaatse ten hoogste toelaatbare geluidbelasting voor
      woningen, die gelegen zijn in zones langs wegen waarvoor geluidproductieplafonds als bedoeld in
      [artikel 11.19 van de Wet milieubeheer][ref4] gelden, en

      2°. de ter plaatse ten hoogste toelaatbare geluidbelasting, bedoeld in [artikel 82, eerste lid, van die wet][ref5]
      niet hoger mag worden vastgesteld dan 63 dB;

      c. [artikel 3.2, eerste lid, onder b, van het Besluit geluidhinder][ref6], met dien verstande dat:

      1°. niet afgeweken kan worden van de ter plaatse ten hoogste toelaatbare geluidbelasting voor
      andere geluidgevoelige objecten in zones langs wegen waarvoor geluidproductieplafonds als bedoeld in
      [artikel 11.19 van de Wet milieubeheer][ref7] gelden en

      2°. de ten hoogste toelaatbare geluidbelasting niet hoger mag worden vastgesteld dan 68 dB.

      2 Dit artikel is van toepassing op de volgende plangebieden:

      a. Binckhorst in de gemeente Den Haag, zoals aangegeven op de kaart in [bijlage 41][ref8];

      b. Hembrugterrein in de gemeente Zaanstad, zoals aangegeven op de kaart in [bijlage 44][ref9];

      c. Bergwijkpark in de gemeente Diemen, zoals aangegeven op de kaart in [bijlage 65][ref10].

      3 Van de in dit artikel bedoelde afwijkingsbevoegdheid kan gebruik worden gemaakt:

      a. voor de in het tweede lid, onderdelen a en b, genoemde plangebieden: tot 15 mei 2019;

      b. voor het in het tweede lid, onderdeel c, genoemde plangebied: tot 9 september 2020.


