      1 In aanvulling op [artikel 3.26][ref1] juncto [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref2]
      kunnen provinciale staten van Noord-Brabant uiterlijk op 18 maart 2020 in een inpassingsplan voor het plangebied
      «Logistiek Park Moerdijk» in de gemeente Moerdijk, zoals aangegeven op de kaart in [bijlage no. 52][ref3], regels
      stellen die strekken ten behoeve van:

      a. het bereiken en in stand houden van een veilige en gezonde fysieke leefomgeving en een goede omgevingskwaliteit,
      en

      b. het doelmatig beheren, gebruiken en ontwikkelen van de fysieke leefomgeving ter vervulling van maatschappelijke
      functies.

      2 In afwijking van [artikel 3.26][ref4] juncto [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref5]
      worden de in het inpassingsplan gestelde regels binnen een periode van twintig jaar opnieuw vastgesteld.


