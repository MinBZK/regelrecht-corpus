    text: |-
      1 Als categorieën andere projecten van maatschappelijke betekenis als bedoeld in
      [artikel 2.9, eerste lid, onderdeel b, van de wet][ref1] worden aangewezen:

      a. onderwijsgebouwen;

      b. ziekenhuizen en verpleeghuizen;

      c. verzorgingstehuizen;

      d. psychiatrische inrichtingen;

      e. medische centra;

      f. poliklinieken;

      g. medische kleuterdagverblijven; en

      h. opwekking van duurzame energie als bedoeld in [bijlage I, onder 1, bij de wet][ref2],
      onverminderd de bevoegdheden van Onze Minister van Economische Zaken en Klimaat op grond van de
      [artikelen 9b, eerste lid, aanhef en onder a en b][ref3], en [9e, zesde lid, van de Elektriciteitswet 1998][ref4].

      2 Indien een project als bedoeld in het eerste lid tevens voorziet in een beperkte mate van woningbouw, doet dat
      geen afbreuk aan de kwalificatie van het project als project van maatschappelijke betekenis als bedoeld in dat lid.


