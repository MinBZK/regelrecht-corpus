      1 Dit artikel is tot 1 januari 2025 van toepassing op de gemeenten Aalsmeer, Amstelveen, Amsterdam, Beemster,
      Diemen, Edam-Volendam, Haarlemmermeer, Landsmeer, Oostzaan, Ouder-Amstel, Purmerend, Uithoorn, Waterland,
      Wormerland en Zaanstad.

      2 In afwijking van [artikel 1, eerste lid, aanhef en onder i, van de Huisvestingswet 2014][ref1] vormen de
      gemeenten, genoemd in het eerste lid, voor de toepassing van dit artikel gezamenlijk de woningmarktregio.

      3 In afwijking van [artikel 14, tweede lid, tweede volzin, van de Huisvestingswet 2014][ref2] kunnen de
      gemeenteraden, indien overeenstemming is bereikt met de andere gemeenten, bepalen dat voor ten hoogste zestig
      procent van het percentage, bedoeld in de eerste volzin van dat lid, bij de verlening van huisvestingsvergunningen
      voorrang mag worden gegeven aan woningzoekenden die economisch of maatschappelijk gebonden zijn aan een van die
      gemeenten binnen de woningmarktregio.

      4 In afwijking van [artikel 14, tweede lid, tweede volzin, van de Huisvestingswet 2014][ref3] kan de gemeenteraad,
      indien overeenstemming is bereikt met de andere gemeenten, in de huisvestingsverordening bepalen bij hoeveel
      huisvestingsvergunningen voorrang wordt gegeven aan woningzoekenden die economisch of maatschappelijk gebonden zijn
      aan die gemeente, met dien verstande dat het aantal huisvestingsvergunningen waarbij voorrang wordt gegeven aan
      woningzoekenden die economisch of maatschappelijk gebonden zijn aan een van die gemeenten voor de woningmarktregio
      in zijn geheel niet hoger is dan het percentage, bedoeld in het derde lid.


