      tabel 5.1 bij [artikel 5.2 van het Bouwbesluit 2012][ref1], als grenswaarde voor de energieprestatiecoëfficiënt, 75
      procent van de op grond van die tabel geldende grenswaarde.

      2 Ten behoeve van

      a. Giel Peetershof in Peel en Maas, zoals aangegeven op de kaart in [bijlage 92][ref2],

      b. Binckhorst in Den Haag, zoals aangegeven op de kaart in [bijlage 41][ref3],

      geldt dat voor woningen die vóór 1 januari 2021 worden gebouwd, in afwijking van tabel 5.1 bij
      [artikel 5.2 van het Bouwbesluit 2012][ref4], als grenswaarde voor de energieprestatiecoëfficiënt 0,2 geldt.


