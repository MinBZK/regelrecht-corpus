  - number: 7c
    text: |-
      1 In aanvulling op [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref1] kunnen in het bestemmingsplan
      ook regels worden gesteld, die strekken ten behoeve van het:

      a. bereiken en in stand houden van een veilige en gezonde fysieke leefomgeving en een goede omgevingskwaliteit, en

      b. doelmatig beheren, gebruiken en ontwikkelen van de fysieke leefomgeving ter vervulling van maatschappelijke
      functies.

      2 In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref2] wordt de bestemming van
      gronden, met inbegrip van de met het oog daarop gestelde regels, binnen een periode van twintig jaar opnieuw
      vastgesteld. Artikel 3.1, derde tot en met vijfde lid, van de Wet ruimtelijke ordening is niet van toepassing.

      3 In afwijking van [artikel 3.2 van de Wet ruimtelijke ordening][ref3] geldt een voorlopige bestemming voor een
      termijn van ten hoogste tien jaar.

      4 Het bestemmingsplan kan de door het gemeentebestuur gestelde regels als bedoeld in
      [artikel 108 van de Gemeentewet][ref4] bevatten die geheel of gedeeltelijk betrekking hebben op de fysieke
      leefomgeving.

      5 De regels in het bestemmingsplan kunnen voorts inhouden een verbod om zonder voorafgaande melding aan
      burgemeester en wethouders een daarbij aangewezen activiteit te verrichten.

      6 In het bestemmingsplan kunnen tevens regels worden gesteld waarvan de uitleg bij de uitoefening van een bij die
      regels aan te geven bevoegdheid afhankelijk wordt gesteld van beleidsregels. Daarbij kan worden bepaald dat de
      beleidsregels worden vastgesteld door de raad of door burgemeester en wethouders.

      7 Als de regels, bedoeld in het zesde lid, betrekking hebben op het uiterlijk van bouwwerken en bij de toepassing
      een interpretatie behoeven, stelt de raad de criteria vast die worden toegepast bij de beoordeling van het
      uiterlijk van een bouwwerk waarop de aanvraag om een omgevingsvergunning voor een bouwactiviteit betrekking
      heeft. Deze criteria zijn zoveel mogelijk toegesneden op de onderscheiden bouwwerken. In afwijking van
      [artikel 12b van de Woningwet][ref5] wordt het advies van de welstandscommissie dan wel de stadsbouwmeester slechts
      op die criteria gebaseerd.

      8 Voor de in het experiment betrokken bestemmingsplannen geldt dat indien daarin onbenutte bouw- of
      gebruiksmogelijkheden worden wegbestemd, de planschade in ieder geval als voorzienbaar in de zin van
      [artikel 6.3, aanhef en onder a, van de Wet ruimtelijke ordening][ref6] wordt aangemerkt, indien:

      a. deze herziening ten minste drie jaar voor de vaststelling van het bestemmingsplan is aangekondigd;

      b. van de voorgenomen herziening kennis is gegeven aan de eigenaren in het gebied, en

      c. gedurende deze termijn de mogelijkheid bestond de bouw- of gebruiksmogelijkheden te realiseren.

      9 Bij de voorbereiding, vormgeving, inrichting en beschikbaarstelling van het bestemmingsplan kan worden afgeweken
      van:

      a. de volgende artikelen van het [Besluit ruimtelijke ordening][ref7]:

      1°. [1.2.1, tweede lid][ref8], en [1.2.1a, onderdeel a][ref9], onder de voorwaarde dat het ontwerp van het
      bestemmingplan of het vastgestelde bestemmingsplan elektronisch op een algemeen toegankelijke wijze beschikbaar
      wordt gesteld en blijft op een door de raad te bepalen internetadres. In dat geval bevat de landelijke voorziening,
      bedoeld in artikel 1.2.1, tweede lid, een verwijzing naar dit internetadres;

      2°. [3.1.6, eerste lid, onder f, en vijfde lid, onder c][ref10];

      b. de bij de ministeriële regeling, bedoeld in [artikel 1.2.6 van het Besluit ruimtelijke ordening][ref11],
      gestelde regels of nadere regels.

      c. [hoofdstuk VIIIa van de Wet geluidhinder][ref12], met dien verstande dat:

      1°. in afwijking van [afdeling 1 van dat hoofdstuk][ref13] een besluit als bedoeld in
      [artikel 110a van die wet][ref14] deel kan uitmaken van het bestemmingsplan, en dat

      2°. in afwijking van [afdeling 2 van dat hoofdstuk][ref15] de mate van detail van de ten behoeve van de
      vaststelling van de geluidbelasting te verrichten akoestische onderzoeken kan worden afgestemd op het detailniveau
      en de fase van voorbereiding van het bestemmingsplan;

      d. [artikel 5.4 van het Besluit geluidhinder][ref16], met dien verstande dat:

      1°. een besluit als bedoeld in [artikel 110a van de Wet geluidhinder][ref17] deel kan uitmaken van het
      bestemmingsplan en

      2°. de mate van detail van de ten behoeve van de vaststelling van de geluidbelasting te verrichten akoestische
      onderzoeken kan worden afgestemd op het detailniveau en de fase van voorbereiding van het bestemmingsplan.

      10 Bij de vaststelling van het bestemmingsplan kan de raad besluiten af te wijken van
      [artikel 6.12, eerste en derde lid, van de Wet ruimtelijke ordening][ref18], met dien verstande dat een
      exploitatieplan door burgemeester en wethouders kan worden vastgesteld bij een omgevingsvergunning voor het bouwen.

      11 Indien toepassing wordt gegeven aan het tiende lid, geldt dat:

      a. [artikel 6.12, tweede lid, van de Wet ruimtelijke ordening][ref19] van toepassing is op de omgevingsvergunning
      voor het bouwen;

      b. in afwijking van [artikel 6.14, eerste lid, van de Wet ruimtelijke ordening][ref20],
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref21] niet van toepassing is op de voorbereiding van het
      exploitatieplan;

      c. daarvoor in het bestemmingsplan een of meer exploitatiegebieden worden aangewezen;

      d. in aanvulling op [artikel 2.10, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref22]
      de omgevingsvergunning voor het bouwen kan worden geweigerd als de exploitatieopzet als bedoeld in
      [artikel 6.13, eerste lid, onder c, van de Wet ruimtelijke ordening][ref23], een tekort bevat, dat niet is gedekt;

      e. als de omgevingsvergunning voor het bouwen wordt geweigerd, de exploitatieopzet als bedoeld in onderdeel d, deel
      uitmaakt van dat besluit.

      12 [Artikel 8.42b van de Wet milieubeheer][ref24] en [artikel 2.19 van het Activiteitenbesluit milieubeheer][ref25]
      zijn op het bestemmingsplan van overeenkomstige toepassing.

      13 De raad kan de bevoegdheid tot het vaststellen van delen van het bestemmingsplan delegeren aan burgemeester
      en wethouders.

      14 In aanvulling op [artikel 3.6, eerste lid, onder c, van de Wet ruimtelijke ordening][ref26] kan bij
      het bestemmingsplan worden bepaald dat het met het oog op de regels bedoeld in het eerste lid verboden
      is zonder omgevingsvergunning, gronden of bouwwerken te gebruiken voor een daarbij aangegeven activiteit,
      als de activiteit niet in strijd is met het bestemmingsplan. Voor toepassing van deze bepaling in de
      [Wet algemene bepalingen omgevingsrecht][ref27] wordt deze vergunning aangemerkt als een vergunning als bedoeld
      in [artikel 2.1, eerste lid, onder c, van die wet][ref28]. De vergunning wordt verleend als wordt voldaan aan de
      daartoe in het bestemmingsplan gestelde voorwaarden.

      15 In afwijking van [artikel 2.8, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref29]
      juncto [artikel 3.2, aanhef en onderdeel b, van de Regeling omgevingsrecht][ref30] verstrekt de aanvrager
      in of bij de aanvraag om een vergunning voor het gebruiken van gronden of bouwwerken, bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder c, van die wet][ref31], gegevens en bescheiden over de gevolgen van het
      beoogde gebruik voor de fysieke leefomgeving.

      16 In afwijking van [artikel 2.12, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref32]
      kan een omgevingsvergunning die betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder c, van die wet][ref33] worden verleend als de activiteit niet in strijd is met de
      regels, bedoeld in het eerste lid.

      17 Dit artikel is van toepassing op de volgende plangebieden:

