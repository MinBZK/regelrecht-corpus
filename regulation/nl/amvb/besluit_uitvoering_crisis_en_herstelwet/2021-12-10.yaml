        afdeling: '2'
  - number: '15'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0027929/2021-12-10#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoering Crisis- en herstelwet.'
