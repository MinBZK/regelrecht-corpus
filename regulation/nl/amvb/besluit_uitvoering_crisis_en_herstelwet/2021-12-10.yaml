    text: |-
      1 Voor het plangebied «Buitengebied Hillegom» van de gemeente Hillegom, zoals aangegeven op de kaart
      in [bijlage 126][ref1], geldt dat als voor een activiteit een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref2] of een omgevingsvergunning
      voor een bestemmingsplanactiviteit als bedoeld in [artikel 7c, veertiende lid][ref3], van dit besluit, is vereist,
      in zoverre in afwijking van [artikel 6.1, tweede lid, aanhef en onder a, van de Wet ruimtelijke ordening][ref4],
      alleen deze omgevingsvergunningen als oorzaak als bedoeld in die bepaling gelden.

      2 Het eerste lid is niet van toepassing op schade in de vorm van een vermindering van de waarde van een
      onroerende zaak als de schade het rechtstreekse gevolg is van de wijziging van de bestemming van de tot
      de onroerende zaak behorende grond of van de op onroerende zaak betrekking hebbende regels als bedoeld in
      [artikel 3.1 van de Wet ruimtelijke ordening][ref5].

      3 De aanvrager heeft het risico op het ontstaan van schade in ieder geval niet aanvaard als:

      a. de aanvrager overeenkomstig [artikel 2, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref6] tot koop is
      overgegaan van een tot woning bestemde onroerende zaak na de vaststelling of wijziging van het bestemmingsplan,
      bedoeld in [artikel 7c, zeventiende lid, onder uuu][ref7], en

      b. de schade bestaat uit waardevermindering van de onroerende zaak.

      4 De schade die bestaat uit waardevermindering van de onroerende zaak wordt bepaald aan de hand van een
      vergelijking van de waarde van de onroerende zaak onmiddellijk voor en na het tijdstip waarop het bevoegd gezag
      mededeling heeft gedaan van het besluit tot het verlenen of wijzigen van de omgevingsvergunning.


