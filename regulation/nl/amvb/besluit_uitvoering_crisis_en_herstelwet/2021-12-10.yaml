      1 In het plangebied Spoorzone in de gemeente Eindhoven en het project Dijckerwaal in de gemeente Westland
      is op de aanvraag om een omgevingsvergunning waarbij ten behoeve van het bevorderen van duurzame en
      innovatieve toepassingen voor een activiteit voor een bepaalde termijn toepassing wordt gegeven aan
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1],
      [artikel 3.10, eerste lid, onderdeel a, van die wet][ref2] niet van toepassing.

      2 In aanvulling op [artikel 6.19 van het Besluit omgevingsrecht][ref3] wordt als categorie van gevallen als bedoeld
      in [artikel 3.9, derde lid, tweede volzin, van de Wet algemene bepalingen omgevingsrecht][ref4] aangewezen de
      beslissing op een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in het eerste lid.

      3 Dit artikel is van toepassing op aanvragen die vóór 17 juli 2025 zijn ingediend.


