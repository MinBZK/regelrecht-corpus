      1 Voor de toepassing van dit artikel wordt, in afwijking van [artikel 1 van de Leegstandwet][ref1], verstaan onder:

        - *gebouw:* bouwwerk dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk met wanden omsloten ruimte
      vormt en geen woonruimte is;
        - *leegstaan:* 1°. voor zover het een gebouw betreft: het niet of niet krachtens een zakelijk of persoonlijk recht
      in gebruik zijn overeenkomstig de bestemming van het gebouw; 2°. voor zover het een woonruimte betreft: waar niemand
      zijn woonadres heeft als bedoeld in [artikel 1.1, onder o, onder 1°, van de Wet basisregistratie personen][ref2];
        - *woonruimte:* besloten ruimte die, al dan niet tezamen met een of meer andere ruimten, bestemd of geschikt is
      voor bewoning door een huishouden.

      2 In afwijking van [artikel 3, eerste lid, van de Leegstandwet][ref3] kan de gemeenteraad, indien hij
      een verordening als bedoeld in [artikel 4 van de Huisvestingswet 2014][ref4] heeft vastgesteld, in de
      leegstandverordening bepalen dat de leegstand van daarbij aangewezen categorieën woonruimten, gelegen in de
      gemeente of daarbij aangegeven delen van de gemeente, door de eigenaar wordt gemeld aan burgemeester en wethouders,
      zodra die leegstand langer duurt dan een in die verordening aangegeven termijn van ten minste drie maanden.

      3 In de leegstandverordening worden nadere regels gegeven over het melden, bedoeld in het tweede lid.

      4 Burgemeester en wethouders voeren binnen twee maanden na ontvangst van de melding, bedoeld in het tweede lid,
      overleg met de eigenaar van de woonruimte over het gebruik ervan.

      5 Burgemeester en wethouders stellen na het overleg, bedoeld in het vierde lid, of zonder overleg indien de
      eigenaar aan dat overleg geen medewerking verleent, een leegstandbeschikking vast.

      6 Burgemeester en wethouders kunnen in de leegstandbeschikking, bedoeld in het vijfde lid:

      a. indien de woonruimte niet geschikt is voor gebruik als woonruimte en de woonruimte niet is bestemd voor afbraak
      of vernieuwbouw, bepalen welke voorzieningen door de eigenaar binnen de in de beschikking bepaalde termijn moeten
      zijn getroffen om de woonruimte geschikt te maken voor gebruik als woonruimte;

      b. indien de woonruimte is bestemd voor verhuur, de maximale marktconforme huurprijs bepalen waartegen de
      woonruimte te huur wordt aangeboden;

      c. indien het een woonruimte betreft die is bestemd voor verkoop en als woonruimte kan worden verhuurd op grond
      van [artikel 15, eerste lid, onder b of d, van de Leegstandwet][ref5], de eigenaar verplichten de woonruimte te
      verhuren, met een vergunning als bedoeld in artikel 15, eerste lid, van die wet;

      d. indien het een woonruimte betreft die is bestemd voor afbraak of vernieuwbouw en als woonruimte kan worden
      verhuurd op grond van [artikel 15, eerste lid, onder c, van de Leegstandwet][ref6], de eigenaar verplichten de
      woonruimte te verhuren, met een vergunning als bedoeld in artikel 15, eerste lid, van die wet;

      e. een termijn opnemen van ten minste één maand waarbinnen de woonruimte op het moment dat deze geschikt is voor
      bewoning in gebruik wordt genomen als woonruimte;

      f. andere voorwaarden opnemen die noodzakelijk zijn voor het zo spoedig mogelijk in gebruik nemen van de
      woonruimte.

      7 De eigenaar kan gemotiveerd verzoeken om de termijn, bedoeld in het zesde lid, onder e, eenmaal te verlengen met
      een periode van ten minste één maand.

      8 Indien een eigenaar een verzoek als bedoeld in het zevende lid doet, kunnen burgemeester en wethouders de
      voorwaarden, bedoeld in het zesde lid, onder b tot en met e, in de oorspronkelijke leegstandbeschikking wijzigen.

      9 In aanvulling op [artikel 4 van de Leegstandwet][ref7] kunnen burgemeester en wethouders, indien ze vaststellen
      dat het gebouw of een gedeelte daarvan niet geschikt is voor gebruik, in een leegstandbeschikking voorschrijven
      welke voorzieningen door de eigenaar binnen de in de beschikking bepaalde termijn moeten worden getroffen om
      het gebouw of een gedeelte ervan geschikt te maken voor gebruik, tenzij het gebouw is bestemd voor afbraak of
      vernieuwbouw.

      10 Dit artikel is tot 1 januari 2025 van toepassing op de gemeente Amsterdam.


