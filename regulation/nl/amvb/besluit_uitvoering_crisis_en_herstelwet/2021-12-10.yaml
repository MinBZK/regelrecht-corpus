  - number: 7z
    text: |-
      1 Dit artikel is tot 1 januari 2031 van toepassing in de gemeenten Nederweert en Someren ten behoeve
      van het wegnemen van overschrijdingen van de grenswaarden voor zwevende deeltjes (PM) zoals opgenomen in
      [bijlage 2 bij de Wet milieubeheer][ref1], door veehouderijen. Daartoe kunnen de in dit artikel opgenomen
      bevoegdheden worden uitgeoefend.

      2 Burgemeester en wethouders kunnen [artikel 5.16, eerste lid, onder b, van de Wet milieubeheer][ref2] buiten
      toepassing laten.

      3 In afwijking van [artikel 5.13a van het Besluit omgevingsrecht][ref3]
      kunnen aan een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder i, van de Wet algemene bepalingen omgevingsrecht][ref4] voorschriften
      worden verbonden.

      4 In aanvulling op
      [artikel 2.31, tweede lid, aanhef en onderdelen b en c, van de Wet algemene bepalingen omgevingsrecht][ref5]
      kunnen burgemeester en wethouders de voorschriften van een omgevingsvergunning
      wijzigen als deze betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, of i, van de Wet algemene bepalingen omgevingsrecht][ref6] en de
      grenswaarden voor zwevende deeltjes (PM) zoals opgenomen in [bijlage 2 bij de Wet milieubeheer][ref7] worden
      overschreden. [Artikel 2.31a van de Wet algemene bepalingen omgevingsrecht][ref8] is van overeenkomstige
      toepassing.

      5 In aanvulling op
      [artikel 2.33, tweede lid, aanhef en onderdelen d en f, van de Wet algemene bepalingen omgevingsrecht][ref9]
      kunnen burgemeester en wethouders een omgevingsvergunning geheel of gedeeltelijk
      intrekken als deze betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, of i, van de Wet algemene bepalingen omgevingsrecht][ref10] en de
      grenswaarden voor zwevende deeltjes (PM) zoals opgenomen in [bijlage 2 bij de Wet milieubeheer][ref11] worden
      overschreden.

      6 In aanvulling op [artikel 7 van het Besluit emissiearme huisvesting][ref12] kunnen burgemeester en wethouders bij
      besluit voorschrijven dat in dierenverblijven die zijn opgericht voor, op of na 1 juli 2015 huisvestingssystemen
      voor landbouwhuisdieren worden toegepast met een emissiefactor voor zwevende deeltjes (PM) die lager is dan
      de maximale emissiewaarde voor zwevende deeltjes (PM) die voor de betreffende diercategorie is vermeld in
      [bijlage 2 bij het Besluit emissiearme huisvesting][ref13].

      7 In afwijking van [artikel 2, aanhef en onder b, van het Besluit emissiearme huisvesting][ref14] is het
      bepaalde in het zesde lid ook van toepassing op huisvestingssystemen voor landbouwhuisdieren die worden gehouden
      overeenkomstig de biologische productiemethode.


