    text: |-
      1 In afwijking van [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref1] wordt de bestemming van
      gronden, met inbegrip van de met het oog daarop gestelde regels, binnen een periode van vijftien jaar opnieuw
      vastgesteld.

      2 In afwijking van [artikel 3.2 van de Wet ruimtelijke ordening][ref2] geldt een voorlopige bestemming voor een
      termijn van ten hoogste vijftien jaar.

      3 Dit artikel is van toepassing op het bestemmingsplangebied Galecopperzoom in de gemeente Nieuwegein, zoals
      aangegeven op de kaart in [bijlage 48][ref3], voor zover het bestemmingsplan voor dit gebied wordt vastgesteld vóór
      20 september 2019.


