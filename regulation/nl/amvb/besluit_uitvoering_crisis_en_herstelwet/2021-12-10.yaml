      [6.16 van het Bouwbesluit 2012][ref4] gelden:

      a. tot 25 juli 2017 niet voor de bouw van een drijvende autarkische recreatiebungalow naast de camping «De Kleine
      Wielen», De Groene Ster 14 te Leeuwarden;

      b. tot 18 maart 2025 niet voor de bouw van een drijvende autarkische trekkershut of een drijvend autarkisch
      theehuis op door de raad van de gemeente Zwolle aan te wijzen locaties.


