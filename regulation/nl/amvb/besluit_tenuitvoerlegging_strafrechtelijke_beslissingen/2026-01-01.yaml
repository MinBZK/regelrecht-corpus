  - number: 5:5
    text: |-
      Met betrekking tot de tenuitvoerlegging van voor gratie vatbare maatregelen wordt onderscheiden:

      a. terbeschikkingstelling met verpleging van overheidswege, waarvan de tenuitvoerlegging aanvangt:

      1°. op de datum van dagtekening van de last tot tenuitvoerlegging van het veroordelend vonnis of arrest, bedoeld in
      [artikel 6:1:6 van de wet][ref1];

      2°. op de datum van afgifte van het bevel tot gevangenneming, bedoeld in [artikel 65 van de wet][ref2];

      b. plaatsing in een inrichting voor stelselmatige daders, waarvan de tenuitvoerlegging aanvangt op de datum van
      het uitvaardigen van een last tot tenuitvoerlegging van een bevel tot vrijheidsbeneming of veroordelend vonnis of
      arrest, bedoeld in [artikel 6:1:6 van de wet][ref3];

      c. onttrekking aan het verkeer, waarvan de tenuitvoerlegging aanvangt op de datum van het onherroepelijk worden van
      het vonnis of arrest;

      d. ontneming van het wederrechtelijk verkregen voordeel, waarvan de tenuitvoerlegging aanvangt op de datum van
      de dagtekening van de eerste mededeling van Onze Minister over de dag of dagen waarop de betaling uiterlijk moet
      geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel616
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel616
