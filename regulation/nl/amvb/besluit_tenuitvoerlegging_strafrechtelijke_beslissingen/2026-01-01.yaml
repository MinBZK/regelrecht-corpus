  - number: 3:15
    text: |-
      Nadat de taakstraf is verricht, stuurt de uitvoerder taakstraffen zo spoedig mogelijk een afloopbericht aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel315
  - number: 3:16
    text: |-
      De uitvoerder taakstraffen houdt toezicht op de verrichtingen van de taakgestrafte en de omstandigheden waaronder
      deze plaatsvinden. Het toezicht omvat ook de veiligheid, de gezondheid en de arbeidsomstandigheden op de
      projectplaats en de redelijkheid van de opgedragen werkzaamheden of opgelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel316
  - number: 3:17
    text: |-
      1 De uitvoerder taakstraffen kan ambtshalve of op verzoek van het openbaar ministerie mede de volgende beslissingen
      nemen:

      a. de beslissing om in bijzondere gevallen de projectplaats of de aard van de werkzaamheden te wijzigen;

      b. de beslissing, bedoeld in [artikel 3:19][ref1], tot het geven van een waarschuwing indien de taakstraf niet naar
      behoren wordt uitgevoerd;

      c. de beslissing, bedoeld in [artikel 3:20][ref2], tot opschorting van de tenuitvoerlegging van de taakstraf, met
      advies aan het openbaar ministerie tot het voortijdig beëindigen van de tenuitvoerlegging van de taakstraf.

      2 Alvorens een beslissing wordt genomen, wordt de taakgestrafte, zo mogelijk, door de uitvoerder taakstraffen
      gehoord.

      3 De beslissing wordt schriftelijk vastgelegd, gedagtekend en gemotiveerd. Bij de rapportage aan het openbaar
      ministerie worden de beslissing en, indien kenbaar gemaakt, het standpunt van de taakgestrafte gevoegd. De
      uitvoerder taakstraffen rapporteert zo spoedig mogelijk aan het openbaar ministerie en Onze Minister. Een afschrift
      van de rapportage en de bijbehorende stukken wordt aan de taakgestrafte ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel319
      [ref2]: https://wetten.overheid.nl/BWBR0042962#Artikel320
