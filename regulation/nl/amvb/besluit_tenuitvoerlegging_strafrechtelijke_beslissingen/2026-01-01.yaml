  - number: 4:7
    text: |-
      1 In de gevallen, bedoeld in de [artikelen 4:4][ref1] en [4:5][ref2], wordt onverwijld een gedagtekend
      betalingsbewijs verstrekt.

      2 In de gevallen, bedoeld in het eerste lid, wordt van de inning aantekening gehouden op de wijze zoals door Onze
      Minister is aangegeven.

      3 De aantekeningen worden, uiterlijk een jaar nadat zij zijn opgemaakt, desverlangd getoond aan de personen die met
      het toezicht op de inning zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0042962#Artikel45
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel47
