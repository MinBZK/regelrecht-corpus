  - number: 3:19
    text: |-
      De uitvoerder taakstraffen geeft ten hoogste eenmaal een waarschuwing aan de taakgestrafte wegens het niet naar
      behoren verrichten van de taakstraf.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel319
  - number: 3:20
    text: |-
      1 De uitvoerder taakstraffen kan de tenuitvoerlegging van de taakstraf opschorten indien de taakgestrafte na
      een waarschuwing de taakstraf wederom niet naar behoren verricht of na een ernstige misdraging van de zijde van
      de taakgestrafte. De uitvoerder taakstraffen stelt het openbaar ministerie onverwijld van deze beslissing op de
      hoogte, met het advies de tenuitvoerlegging van de taakstraf te beëindigen. Een afschrift van het advies wordt aan
      Onze Minister verzonden.

      2 Het openbaar ministerie neemt zo spoedig mogelijk na de ontvangst van het advies een beslissing als bedoeld in de
      [artikelen 6:3:2][ref1] of [6:3:3 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel632
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel633
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel320
    references:
