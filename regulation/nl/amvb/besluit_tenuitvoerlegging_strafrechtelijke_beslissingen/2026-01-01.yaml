        artikel: 4:5
        hoofdstuk: '4'
  - number: 4:8
    text: |-
      Onze Minister draagt zorg voor de opening van een of meer afzonderlijke bankrekeningen welke bestemd zijn voor de
      betaling van de in [artikel 4:2][ref1] bedoelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel42
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: 4:2
        hoofdstuk: '4'
  - number: 4:9
    text: |-
      1 Het formulier van het in [artikel 4:7, eerste lid][ref1], bedoelde betalingsbewijs, dan wel de eisen waaraan het
      betalingsbewijs moet voldoen, worden vastgesteld bij ministeriële regeling.

      2 De ontvangen gelden worden op de door Onze Minister aangegeven wijze overgemaakt op de daartoe bestemde
      bankrekeningen.

      3 Bij ministeriële regeling worden nadere voorschriften vastgesteld omtrent de verstrekking en het beheer van de
      betalingsbewijzen, de afrekening en de verantwoording van de ontvangen gelden, alsmede de in verband daarmee te
      voeren administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel47
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: 4:7
        hoofdstuk: '4'
  - number: 4:10
    text: |-
      1 De korpschef doet op de door Onze Minister te bepalen wijze jaarlijks opgave van de uitvoering van de in
      [artikel 4:9, derde lid][ref1], bedoelde voorschriften en van de met het oog op de toepassing van dit besluit
      verrichte accountantscontrole.

      2 Voor de Koninklijke marechaussee en de buitengewoon opsporingsambtenaren wordt de
      in het eerste lid bedoelde opgave gedaan door de betrokken korpschefs, bedoeld in
      [artikel 3.1, tweede lid, van het Besluit OM-afdoening][ref2] of het betrokken lichaam of de betrokken persoon,
      bedoeld in [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref3].

      3 De in het eerste en tweede lid bedoelde opgave kan achterwege blijven voor die gevallen waarin de gelden ter
      plaatse zijn overgemaakt op de daartoe bestemde bankrekening van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0022233#Artikel3.1
      [ref3]: https://wetten.overheid.nl/BWBR0022233#Artikel4.1
