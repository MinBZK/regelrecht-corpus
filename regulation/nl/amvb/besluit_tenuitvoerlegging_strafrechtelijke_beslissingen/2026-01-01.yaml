  - number: 2:22
    text: |-
      1 Het openbaar ministerie brengt een vordering als bedoeld in [artikel 6:6:33, eerste lid, van de wet][ref1] ter
      kennis aan de raad voor de kinderbescherming.

      2 Onze Minister brengt een beslissing als bedoeld in [artikel 6:6:33, eerste lid, van de wet][ref2] onverwijld ter
      kennis aan de raad voor de kinderbescherming en de selectiefunctionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6633
