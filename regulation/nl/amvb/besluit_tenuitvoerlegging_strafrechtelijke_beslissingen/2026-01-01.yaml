        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:12
    text: |-
      1 De reclassering en de raad voor de kinderbescherming dragen er zorg voor dat de rechter, het openbaar ministerie,
      Onze Minister, de taakgestrafte en diens raadsman zich steeds op de hoogte kunnen stellen van gegevens omtrent de
      beschikbare projectplaatsen, de aard van de te verrichten werkzaamheden en de te volgen leerprojecten.

      2 Indien een project naar het oordeel van de reclassering of de raad voor de kinderbescherming niet langer aan
      de gestelde eisen voldoet, meldt de reclassering onderscheidenlijk de raad voor de kinderbescherming dit aan Onze
      Minister. Tenzij Onze Minister binnen een maand anders beslist, vervalt na afloop van die termijn het project.

      3 Onze Minister kan, na overleg met de reclassering onderscheidenlijk de raad voor de kinderbescherming, een
      project doen vervallen.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel312
  - number: 3:13
    text: |-
      1 Nadat de reclassering of de raad voor de kinderbescherming daartoe opdracht van Onze Minister heeft
      ontvangen, zorgt de reclassering onderscheidenlijk de raad voor de kinderbescherming ervoor dat de taakstraf in
      overeenstemming met de rechterlijke uitspraak of de strafbeschikking ten uitvoer wordt gelegd. Indien dit niet
      mogelijk blijkt, stelt de reclassering onderscheidenlijk de raad voor de kinderbescherming Onze Minister en het
      openbaar ministerie daarvan onverwijld in kennis.

      2 Indien een taakstraf bestaat uit een werkstraf en een leerstraf, worden deze voor de tenuitvoerlegging als
      afzonderlijke projecten aangemerkt.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel313
  - number: 3:14
    text: |-
      1 Na ontvangst van de in [artikel 3:13, eerste lid][ref1], bedoelde opdracht roept de uitvoerder taakstraffen de
      taakgestrafte zo spoedig mogelijk op voor een intakegesprek. Bij een jeugdige taakgestrafte kunnen tevens de ouders
      of voogd van de taakgestrafte worden opgeroepen.

      2 Wanneer de taakgestrafte niet reageert op de oproep en is vastgesteld dat het daarop vermelde adres niet afwijkt
      van dat waarop betrokkene staat ingeschreven in de basisregistratie personen, wordt opnieuw een oproep gedaan,
      vergezeld van de mededeling dat bij niet verschijnen de zaak wordt gezonden aan het openbaar ministerie. Indien op
      de tweede oproep niet wordt gereageerd, wordt daarvan melding gemaakt aan Onze Minister en het openbaar ministerie.

      3 In het intakegesprek stelt de uitvoerder taakstraffen de taakgestrafte op de hoogte van de regels, rechten en
      plichten die gelden bij de tenuitvoerlegging van een taakstraf.

      4 Bij het bepalen van de feitelijke werkzaamheden of verplichtingen houdt de uitvoerder taakstraffen rekening met
      het gepleegde delict, de capaciteiten, mogelijkheden en specifieke omstandigheden van de taakgestrafte, alsmede de
      reisafstand tot de projectplaats. De reistijd bedraagt in totaal niet meer dan drie uren per dag. De dagen waarop
      aan het project wordt deelgenomen en de aanvang- en eindtijden, worden in overleg met de taakgestrafte vastgesteld.
      Pauzes en reistijden tellen niet mee voor de taakstrafuren.

      5 Voorafgaand aan de aanvang van de deelname aan het project vindt een gesprek plaats tussen de jeugdige
      taakgestrafte, de uitvoerder taakstraffen en de contactpersoon, waarbij in ieder geval wordt ingegaan op
      de huisregels van de projectplaats, de vaststelling en uitleg van de werkzaamheden of het leerproject en de
      aanvangsdatum. Bij de andere taakgestraften kan dit gesprek plaatsvinden voorafgaand aan de aanvang van de deelname
      aan een project.

      6 Voorafgaand aan de aanvang van de deelname aan het project wordt de beslissing van de uitvoerder taakstraffen
      tot plaatsing schriftelijk vastgelegd en voor akkoord ondertekend door de taakgestrafte. De taakgestrafte wordt een
      afschrift van de beslissing ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel313
