        artikel: 6:3:2
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 6:3:3
  - number: 3:21
    text: |-
      De taakgestrafte kan door de uitvoerder taakstraffen worden opgedragen zich door een door de uitvoerder
      taakstraffen aan te wijzen keuringsarts medisch te laten keuren voordat het verrichten van de taakstraf aanvangt,
      indien de werkzaamheden dit vereisen, de taakgestrafte medische klachten heeft of arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel321
  - number: 3:22
    text: |-
      1 Voorafgaand aan de plaatsing wordt overeengekomen op welke tijdstippen de taakgestrafte de taakstraf zal
      verrichten. Hierbij kan van de taakgestrafte die werkt, worden verlangd dat hij vrije dagen opneemt.

      2 Indien de taakgestrafte een uitkering ontvangt, stelt hij de uitkeringsinstantie op de hoogte van de taakstraf.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel322
  - number: 3:23
    text: |-
      De taakgestrafte geeft veranderingen in de woon-, onderwijs- of werksituatie of contactgegevens onmiddellijk door
      aan de uitvoerder taakstraffen.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel323
  - number: 3:24
    text: |-
      1 De taakgestrafte volgt de aanwijzingen en opdrachten op die in het kader van de tenuitvoerlegging van de
      taakstraf worden gegeven door de uitvoerder taakstraffen of, namens deze, door de contactpersoon.

      2 De taakgestrafte zorgt zelf voor werkkleding, tenzij door de contactpersoon anders is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel324
  - number: 3:25
    text: |-
      1 De taakgestrafte doet van ziekte of bijzondere omstandigheden die een reden kunnen zijn voor verzuim terstond
      mededeling aan de contactpersoon en de uitvoerder taakstraffen. Bij bijzondere omstandigheden wordt, behoudens
      onvoorziene omstandigheden, toestemming voor het verzuim gevraagd aan de uitvoerder taakstraffen.

      2 De taakgestrafte kan bij ziekte worden verplicht een door de uitvoerder taakstraffen aan te wijzen keuringsarts
      te bezoeken of in te stemmen met een bezoek van een keuringsarts.

      3 Verzuimde uren worden ingehaald, ook in geval van ziekte.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel325
  - number: 3:26
    text: |-
      1 Het programma, bedoeld in [artikel 77w, derde lid, van het Wetboek van Strafrecht][ref1], kan mede bestaan uit
      een of meer gedragsinterventies.

      2 Indien de maatregel betreffende het gedrag van de jeugdige gezamenlijk met een vrijheidsbenemende straf wordt
      opgelegd, voorziet het programma, bedoeld in [artikel 77w, derde lid, van het Wetboek van Strafrecht][ref2], in
      ieder geval in begeleiding van de jeugdige bij een verantwoorde terugkeer in de samenleving. De rechter neemt in
      zijn vonnis zodanige bepalingen op als hij voor de juiste uitvoering van die begeleiding noodzakelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77w
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77w
