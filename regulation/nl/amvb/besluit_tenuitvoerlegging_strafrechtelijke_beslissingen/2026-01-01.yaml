  - number: 3:27
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over:

      a. de voorwaarden waaraan projecten of projectplaatsen dienen te voldoen;

      b. de uitvoering van de taakstraf en de verplichtingen van de taakgestrafte.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel327
  - number: 4:1
    text: |-
      1 Onze Minister draagt zorg voor de ondersteuning van de bevoegde ambtenaren, bedoeld in
      [artikel 3.1 van het Besluit OM-afdoening][ref1], alsmede een lichaam of een persoon als bedoeld in
      [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref2], bij hun taken met betrekking tot de betaling van
      gelden als bedoeld in [artikel 4:5][ref3].

      2 Dit hoofdstuk is niet van toepassing op geldboeten die zijn opgelegd in een strafbeschikking,
      uitgevaardigd krachtens [artikel 76 van de Algemene wet inzake rijksbelastingen][ref4] of
      [artikel 10:15 van de Algemene douanewet][ref5].


