  - number: 4:2
    text: |-
      1 De betaling van een geldboete, een transactie, een schadevergoedingsmaatregel, een ontnemingsmaatregel, een
      ontnemingsaanwijzing, een stortingsvoorwaarde, een stortingsaanwijzing, een schikking, de geschatte waarde van niet
      in beslag genomen verbeurd verklaarde goederen of de kosten van openbaarmaking van een uitspraak geschiedt door
      storting of overschrijving van het verschuldigde bedrag op een daartoe bestemde bankrekening van Onze Minister.

      2 Onze Minister bepaalt de termijn waarbinnen het verschuldigde bedrag moet zijn betaald.

      3 De betaling van het op grond van [artikel 6:4:2 van de wet][ref1] verhoogde bedrag geschiedt binnen dertig dagen
      na de door Onze Minister verstuurde aanmaning.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel642
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 6:4:2
  - number: 4:3
    text: |-
      1 Degene die betaalt maakt daarbij op een door Onze Minister aangegeven wijze melding van de zaak waarop de
      betaling betrekking heeft.

      2 Indien niet op de aangegeven wijze melding is gemaakt van de zaak waarop de betaling betrekking heeft, kan Onze
      Minister het aan hem betaalde bedrag terugstorten op de rekening waarvan het bedrag afkomstig is, of anderszins het
      bedrag terugbetalen aan de persoon die heeft betaald.

      3 Voordat tot een terugbetaling wordt overgegaan, wordt op grond van [artikel 6:1:13 van de wet][ref1] nagegaan
      of degene die de betaling heeft verricht nog tot betaling van een geldsom is verplicht. Indien degene meerdere
      openstaande vorderingen heeft, wordt bij de bestemming van de gelden op de openstaande vorderingen de bij
      ministeriële regeling bepaalde volgorde in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6113
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 6:1:13
  - number: 4:4
    text: |-
      Onze Minister kan bepalen dat de betaling kan geschieden op een door Onze Minister aan te wijzen plaats of aan
      een door Onze Minister aan te wijzen persoon, dan wel door het ter plaatse overschrijven op een daartoe bestemde
      bankrekening.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel44
  - number: 4:5
    text: |-
      1 Indien krachtens de [artikelen 257b][ref1] en [257ba van de wet][ref2] een
      strafbeschikking zal worden uitgevaardigd, kan de betrokken korpschef, bedoeld in
      [artikel 3.1, tweede lid, van het Besluit OM-afdoening][ref3], of het bevoegde lichaam of de bevoegde persoon,
      bedoeld in [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref4], bepalen dat betaling van de geldboete
      eveneens kan geschieden op een plaats die is aangewezen door de bevoegde ambtenaar of het bevoegde lichaam of door
      het ter plaatse overschrijven op een daartoe bestemde bankrekening. Betaling geschiedt in dat geval binnen een dag
      na die waarop het strafbare feit is ontdekt.

      2 Als plaats van betaling, bedoeld in het eerste lid, wordt slechts aangewezen:

      a. bij een strafbeschikking krachtens [artikel 257b van de wet][ref5]: een
      politiebureau, een gebouw van de organisatie van de bevoegde ambtenaar, bedoeld in
      [artikel 3.1, eerste lid, onderdeel b, van het Besluit OM-afdoening][ref6], of een douanekantoor of, indien de
      bevoegde ambtenaar een militair van de Koninklijke marechaussee is, een brigadebureau of de betrokken doorlaatpost,
      dan wel een tijdelijke plaats van betaling, ingesteld door of vanwege de betrokken korpschef, bedoeld in artikel
      3.1, tweede lid, van het Besluit OM-afdoening.

      b. bij een strafbeschikking krachtens [artikel 257ba van de wet][ref7]: een gebouw van de organisatie van de
      bevoegde ambtenaar, bedoeld in [artikel 4.1, onderdeel e, van het Besluit OM-afdoening][ref8], dan wel een
      tijdelijke plaats van betaling, ingesteld door of vanwege een lichaam of een persoon, bedoeld in artikel 4.1,
      onderdeel b, van het Besluit OM-afdoening.

      3 Door of vanwege de korpschef, bedoeld in [artikel 3.1, tweede lid, van het Besluit OM-afdoening][ref9],
      dan wel door of vanwege het lichaam of de persoon, bedoeld in
      [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref10], worden ambtenaren aangewezen die zijn belast met
      de inning van gelden die overeenkomstig het eerste lid worden betaald.

      4 De met de inning belaste ambtenaar wordt in het bezit gesteld van een lijst met de feiten waarvoor de
      strafbeschikking kan worden uitgevaardigd en de voor deze feiten vastgestelde tarieven. Desgevraagd verleent hij
      degene die betaalt inzage in deze lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257b
