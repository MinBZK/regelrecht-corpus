  - number: 2:5e
    text: |-
      Onze Minister kan de verleende strafonderbreking voor bepaalde tijd te allen tijde wijzigen of intrekken. De
      beslissing tot wijziging of intrekking wordt gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel25e
  - number: 2:5f
    text: |-
      1 Onze Minister kan strafonderbreking voor onbepaalde tijd verlenen aan een vreemdeling die op grond
      van [artikel 6:2:10, tweede lid, onder c, van de wet][ref1] niet in aanmerking komt voor voorwaardelijke
      invrijheidstelling of een jeugdige die geen rechtmatig verblijf heeft in Nederland in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref2].

      2 Indien een vrijheidsstraf van ten hoogste drie jaren is opgelegd, kan de strafonderbreking bedoeld in het eerste
      lid worden verleend nadat tenminste de helft van de straf is ondergaan. Indien een vrijheidsstraf van meer dan
      drie jaren is opgelegd, kan de strafonderbreking worden verleend nadat ten minste twee derde deel van de straf is
      ondergaan, met dien verstande dat strafonderbreking niet eerder wordt verleend dan twee jaren voor het einde van
      de straf.

      3 In afwijking van het tweede lid kan bij een vrijheidsstraf van meer dan drie jaren eerder strafonderbreking voor
      onbepaalde tijd worden verleend indien er sprake is van een bijzonder uitzettingsbelang en ten minste twee derde
      deel van de straf is ondergaan.

      4 Bij de beslissing over de strafonderbreking voor onbepaalde tijd houdt Onze Minister rekening met de
      omstandigheden van het geval. Bij deze beslissing worden naast het uitzettingsbelang in ieder geval de belangen van
      het slachtoffer als bedoeld in [artikel 51a van de wet][ref3], het belang van een geloofwaardige tenuitvoerlegging
      en strafvorderlijke belangen betrokken.

      5 Strafonderbreking voor onbepaalde tijd wordt niet verleend zolang er zicht bestaat op de overdracht van de
      tenuitvoerlegging van de vrijheidsstraf aan een andere staat binnen een redelijke termijn.

      6 Aan de strafonderbreking voor onbepaalde tijd wordt de voorwaarde verbonden dat de vreemdeling Nederland verlaat.
      Indien de vreemdeling naar Nederland terugkeert, wordt de tenuitvoerlegging van de vrijheidsstraf hervat.

      7 De strafonderbreking voor onbepaalde tijd gaat in op het moment dat de vreemdeling Nederland heeft verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6210
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel51a
