  - number: 2:5g
    text: Bij ministeriële regeling worden nadere regels gesteld over de wijze van verlening van de strafonderbreking.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel25g
  - number: 2:6
    text: |-
      1 Bij schorsing van het bevel tot voorlopige hechtenis bij jeugdigen kan de rechter één of meer van de volgende
      bijzondere voorwaarden aan de schorsing verbinden:

      a. zich gedurende een door de rechter te bepalen termijn houden aan de aanwijzingen van de reclassering of de
      jeugdreclassering, ook indien deze aanwijzingen inhouden dat de jeugdige zich onder behandeling van een bepaalde
      deskundige of instantie zal stellen;

      b. het aanvaarden van intensieve begeleiding;

      c. het volgen van een leerproject van ten hoogste 120 uren;

      d. op een bepaald tijdstip of gedurende een bepaalde periode op een bepaalde locatie aanwezig zijn;

      e. zich op bepaalde tijdstippen melden bij een bepaalde instantie;

      f. een verbod contact te leggen of te laten leggen met bepaalde personen of instellingen;

      g. een verbod zich op of in de directe omgeving van een bepaalde locatie te bevinden;

      h. een verbod op het gebruik van verdovende middelen of alcohol en de verplichting ten behoeve van de naleving van
      dit verbod mee te werken aan bloedonderzoek of urineonderzoek;

      i. andere voorwaarden, het gedrag van de jeugdige betreffende.

      2 Een behandeling als bedoeld in het eerste lid, onder a, of de voorwaarde, bedoeld in het eerste lid, onder i,
      kunnen geheel of gedeeltelijk bestaan uit een vorm van jeugdhulp als bedoeld in [artikel 1.1 van de Jeugdwet][ref1],
      indien het college van burgemeester en wethouders een besluit heeft genomen tot het treffen van een voorziening op
      het gebied van jeugdhulp als bedoeld in [artikel 2.3, eerste lid, van de Jeugdwet][ref2].

      3 De rechter kan de werking van de voorwaarden beperken tot een bij de beslissing tot schorsing van het bevel tot
      voorlopige hechtenis te bepalen tijdsduur, met dien verstande dat een behandeling als bedoeld in het eerste lid,
      onder a, de begeleiding als bedoeld in het eerste lid, onder b, en een voorwaarde als bedoeld in het eerste lid,
      onder i, ten hoogste zes maanden kunnen duren. Aan een bijzondere voorwaarde kan elektronisch toezicht worden
      verbonden.

      4 De in [artikel 493, zesde lid, van de wet][ref3] bedoelde instemming moet blijken uit een door de jeugdige
      ondertekende verklaring, waarin de aard en inhoud van de voorwaarden zijn omschreven. De instemming van de jeugdige
      kan eveneens blijken uit het proces-verbaal van de terechtzitting.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2.3
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel493
