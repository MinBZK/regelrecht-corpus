        artikel: 6:7:2
      - id: ref2
        bwb_id: BWBR0042962
        artikel: 5:2
        hoofdstuk: '5'
  - number: 5:2
    text: |-
      Met betrekking tot de tenuitvoerlegging van hoofdstraffen wordt onderscheiden:

      a. de vrijheidsstraf, waarvan de tenuitvoerlegging aanvangt:

      1°. op de datum van de dagtekening van de aan de veroordeelde gerichte mededeling met de datum waarop hij zich moet
      melden bij de inrichting;

      2°. op de eenendertigste dag na verzending van de aan de onder 1° bedoelde mededeling voorafgaande
      vooraankondiging, indien de veroordeelde daarop niet reageert;

      3°. op de datum van het uitvaardigen van een arrestatiebevel jegens de veroordeelde ten aanzien van wie Onze
      Minister niet verzoekt zich op een bepaalde datum te melden bij de inrichting; of

      4°. op de datum dat de veroordeelde zonder vaste woon- of verblijfplaats wordt gesignaleerd voor aanhouding voor de
      tenuitvoerlegging van een openstaande vrijheidsstraf.

      b. de taakstraf, welke aanvangt op de datum van de dagtekening van de aan de veroordeelde gerichte oproep voor het
      eerste gesprek bij de reclassering.

      c. de geldboete, welke aanvangt op de datum van de dagtekening van de mededeling van Onze Minister over de dag of
      dagen waarop de betaling uiterlijk moet geschieden.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel52
  - number: 5:3
    text: |-
      Met betrekking tot de tenuitvoerlegging van bijkomende straffen wordt onderscheiden:

      a. de ontzetting van bepaalde rechten, waarvan de tenuitvoerlegging aanvangt:

      1°. indien het de ontzegging van de rijbevoegdheid betreft, op de datum waarop aan de veroordeelde in persoon,
      volgens de [artikelen 36d][ref1] en [36e van de wet][ref2], een schrijven is uitgereikt; of

      2°. indien het de overige ontzetting van bepaalde rechten betreft, op de datum van het onherroepelijk worden van
      het vonnis of arrest.

      b. de verbeurdverklaring, waarvan de tenuitvoerlegging aanvangt op de datum van het onherroepelijk worden van het
      vonnis of arrest.

      c. de openbaarmaking van de rechterlijke uitspraak, waarvan de tenuitvoerlegging aanvangt op de datum van het
      onherroepelijk worden van het vonnis of arrest.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel36d
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel36e
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 36d
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 36e
  - number: 5:4
    text: |-
      Met betrekking tot straffen, krachtens een rechterlijke beslissing in een vreemde staat opgelegd en in Nederland
      ten uitvoer te leggen, zoals bedoeld in [artikel 6:7:1, tweede lid, van de wet][ref1], wordt onderscheiden:

      a. de tenuitvoerlegging van een gevangenisstraf die door het Internationaal Strafhof is opgelegd wegens een
      misdrijf gericht tegen de rechtspleging van het Internationaal Strafhof en waarvan de tenuitvoerlegging in
      Nederland geschiedt overeenkomstig [artikel 67][ref2] of [68 van de Uitvoeringswet Internationaal Strafhof][ref3],
      welke aanvangt op het moment van overdracht van de veroordeelde aan de Nederlandse autoriteiten.

      b. de tenuitvoerlegging van [artikel 43 van de Wet overdracht tenuitvoerlegging strafvonnissen][ref4], welke
      aanvangt op het moment van aankomst van de veroordeelde op Nederlands grondgebied.

      c. de tenuitvoerlegging naar aanleiding van een ongegrondverklaring van een bezwaarschrift ingediend krachtens
      [artikel 35 van de Wet overdracht tenuitvoerlegging strafvonnissen][ref5], welke aanvangt op de datum van
      dagtekening van de mededeling van Onze Minister over de dag of dagen waarop de betaling uiterlijk moet geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel671
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0013796#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0004028#Artikel43
      [ref5]: https://wetten.overheid.nl/BWBR0004028#Artikel35
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel54
    references:
