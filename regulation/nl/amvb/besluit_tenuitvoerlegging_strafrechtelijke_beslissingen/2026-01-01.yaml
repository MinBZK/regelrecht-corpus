  - number: 2:23
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de gevallen waarin een veroordeelde door Onze Minister
      wordt opgeroepen zich op een bepaalde datum te melden bij de inrichting.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel223
  - number: 3:1
    text: |-
      1 Het openbaar ministerie kan de reclassering en de jeugdreclassering aanwijzingen geven omtrent het toezicht op de
      naleving van voorwaarden, voor zover zij daarmee zijn belast.

      2 Het toezicht op de naleving van voorwaarden kan te allen tijde worden beëindigd door het openbaar ministerie
      of Onze Minister na overleg met de reclassering of de jeugdreclassering. Onze Minister stelt de veroordeelde zo
      spoedig mogelijk op de hoogte van de beëindiging van het toezicht.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel31
  - number: 3:2
    text: |-
      1 De reclassering of de jeugdreclassering die is belast met het toezicht, draagt er zorg voor dat de verplichtingen
      worden vastgelegd waaraan de veroordeelde zich in het kader van het toezicht heeft te houden.

      2 De reclassering of de jeugdreclassering draagt er zorg voor dat het toezicht aanvangt:

      a. bij een voorwaardelijke veroordeling: binnen een termijn van dertig dagen na het ingaan van de proeftijd, dan
      wel binnen een termijn van zeven dagen na het ingaan van de proeftijd, indien de rechter dadelijke uitvoerbaarheid
      heeft bevolen;

      b. bij een voorwaardelijke veroordeling van een jeugdige: binnen een termijn van vijf dagen na het ingaan van de
      proeftijd, dan wel binnen een termijn van drie dagen na het ingaan van de proeftijd, indien de rechter dadelijke
      uitvoerbaarheid heeft bevolen;

      c. bij een voorwaardelijke invrijheidstelling: zodra de veroordeelde voorwaardelijk in vrijheid wordt gesteld;

      d. bij anderszins gestelde voorwaarden: zo spoedig mogelijk nadat de beslissing tot het stellen van voorwaarden
      is genomen.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel32
  - number: 3:3
    text: |-
      1 De veroordeelde volgt de aanwijzingen en opdrachten op die door de reclassering of de jeugdreclassering worden
      gegeven in het kader van het toezicht.

      2 De veroordeelde geeft veranderingen in de woon-, onderwijs- of werksituatie onmiddellijk door aan de reclassering
      of de jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel33
  - number: 3:4
    text: |-
      1 Zo spoedig mogelijk na de melding van de reclassering of de jeugdreclassering dat de veroordeelde een voorwaarde
      niet naleeft, brengt de reclassering of de jeugdreclassering advies uit aan het openbaar ministerie of de melding
      naar haar oordeel aanleiding zou kunnen geven tot een of meer van de volgende maatregelen:

      a. het aanvullen, wijzigen of opheffen van de voorwaarden;

      b. het verkorten of verlengen van de proeftijd;

      c. het alsnog ten uitvoer leggen van de voorwaardelijk niet ten uitvoer gelegde straf of maatregel.

      2 Een afschrift van het advies wordt aan Onze Minister verzonden.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel34
  - number: 3:5
    text: |-
      1 Met het oog op het beëindigen van het toezicht stuurt de reclassering of de jeugdreclassering een afloopbericht
      aan het openbaar ministerie en Onze Minister, zo spoedig mogelijk nadat de proeftijd is geëindigd.

      2 In het afloopbericht kan het feitelijk verloop van het toezicht worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel35
  - number: 3:6
    text: |-
      Onverminderd de taken en bevoegdheden van Onze Minister en het openbaar ministerie ten aanzien van de
      tenuitvoerlegging van de taakstraf, zijn de reclassering en de raad voor de kinderbescherming belast met de zorg
      voor het aanbod van projectplaatsen.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel36
  - number: 3:7
    text: |-
      Projectplaatsen voldoen aan de volgende voorwaarden:

      a. het te verrichten werk is additioneel, er mag geen sprake zijn van het bezetten van arbeidsplaatsen die anders
      ter beschikking zouden komen van de reguliere arbeidsmarkt;

      b. het werk dient zo veel mogelijk een publiek doel;

      c. de werkzaamheden zijn zinvol en in voldoende mate aanwezig;

      d. er is een contactpersoon aangewezen die ter plaatse verantwoordelijk is voor de gang van zaken rond het
      verrichten van de taakstraf;

      e. er is voorzien in begeleiding, de veroordeelde mag niet langdurig alleen zijn werkzaamheden uitvoeren;

      f. er wordt voldaan aan regelgeving omtrent arbeidsomstandigheden en andere veiligheidsvoorschriften;

      g. werkzaamheden waarvoor bijzondere deskundigheid is vereist of die bijzondere risico's met zich meebrengen die
      niet aansluiten bij de werkervaring van de taakgestrafte, worden niet opgedragen;

      h. er wordt terughoudend omgegaan met het plaatsen van taakgestraften op posities waar geldhandelingen worden
      verricht of de taakgestrafte toegang heeft tot alcohol, drugs of medicijnen;

      i. de contactpersoon controleert de taakgestrafte en geeft onregelmatigheden, het aantal gewerkte uren en de
      getoonde inzet op basis van afspraken met de uitvoerder taakstraffen door aan de reclassering of de raad voor de
      kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel37
  - number: 3:8
    text: |-
      1 Indien de reclassering of de raad voor de kinderbescherming de inrichting van een nieuwe projectplaats overweegt,
      wordt een voorstel daartoe voorgelegd aan Onze Minister.

      2 Van de beoogde projectplaats wordt een omschrijving gemaakt. Deze bevat ten minste de naam van de instelling of
      organisatie, het doel van de instelling of organisatie, de aard van de werkzaamheden die kunnen worden verricht, de
      wijze van begeleiding van de taakgestrafte en een verklaring omtrent de bereidheid van de instelling of organisatie
      om controlerende taken uit te voeren.

      3 Onze Minister toetst het voorstel en de geschiktheid van de aanbieder van de projectplaats en beslist binnen een
      maand na de indiening van het voorstel.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel38
  - number: 3:9
    text: |-
      1 Projecten voor het verrichten van arbeid tot herstel van de door het strafbare feit aangerichte schade, als
      bedoeld in [artikel 77h, tweede lid, onderdeel a, van het Wetboek van Strafrecht][ref1], voldoen aan de volgende
      voorwaarden:

      a. de jeugdige taakgestrafte beschikt over de vaardigheden om de schade te herstellen;

      b. op de plaats waar de schade wordt hersteld is voorzien in begeleiding van de werkzaamheden en het houden van
      toezicht op de jeugdige taakgestrafte.

      2 Herstel bij particulieren kan alleen plaatsvinden als wordt voorzien in begeleiding en toezicht door de raad voor
      de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 3:10
    text: |-
      1 Leerprojecten voor jeugdigen voldoen aan de volgende voorwaarden:

      a. een omschrijving van de doelstelling en de te volgen methodieken;

      b. een omschrijving van de doelgroep;

      c. een omschrijving van het aantal uren dat het project omvat en de te verrichten activiteiten;

      d. er is voorzien in een correctiesysteem, waarbij de voorziene correctie dient te voldoen aan de eisen van
      proportionaliteit en zorgvuldigheid;

      2 De reclassering en de raad voor de kinderbescherming zijn belast met de zorg voor een adequate opleiding van de
      begeleiders van het leerproject.

      3 De reclassering en de raad voor de kinderbescherming zijn belast met de zorg voor een kwaliteitszorgsysteem
      leerprojecten, waarbij aandacht wordt besteed aan de omstandigheid dat de begeleider over voldoende kwalificaties
      beschikt en een toetsing plaatsvindt van de effecten van de gehanteerde methoden en activiteiten in een
      leerproject.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel310
  - number: 3:11
    text: |-
      1 Indien de reclassering of de raad voor de kinderbescherming de inrichting van een nieuw leerproject overweegt,
      wordt een voorstel daartoe voorgelegd aan Onze Minister.

      2 Van het beoogde project wordt een omschrijving gemaakt. Deze bevat ten minste de in
      [artikel 3:10, eerste lid, onder a tot en met d][ref1] bedoelde onderdelen, alsmede de bij het leerproject
      betrokken organisaties, een gemotiveerde schatting van het aantal deelnemers en een omschrijving van de wijze
      waarop de werkwijze en de resultaten van het project zullen worden geëvalueerd.

      3 Onze Minister beslist binnen een maand na de indiening van het voorstel.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel310
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel311
