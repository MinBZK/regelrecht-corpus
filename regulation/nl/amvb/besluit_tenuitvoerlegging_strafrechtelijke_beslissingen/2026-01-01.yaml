  - number: 2:5a
    text: |-
      1 Onze Minister kan in uitzonderlijke gevallen, waarin niet kan worden volstaan met een vorm van verlof, op verzoek
      van de veroordeelde, de jeugdige of het openbaar ministerie of ambtshalve strafonderbreking voor bepaalde tijd
      verlenen.

      2 Strafonderbreking op verzoek van de veroordeelde of de jeugdige kan worden verleend wegens uitzonderlijke
      omstandigheden in de persoonlijke sfeer van de veroordeelde of de jeugdige:

      a. voor de verzorging van een ernstig ziek kind of ernstig zieke levensgezel of ouder van de veroordeelde of
      jeugdige of voor de verzorging van een ernstig zieke andere relatie van de jeugdige;

      b. voor het bijwonen van de bevalling van de levensgezel;

      c. voor een bezoek aan een in levensgevaar of ernstige psychische nood verkerende levensgezel, kind, ouder, broer,
      zus, grootouder of schoonouder van de veroordeelde of jeugdige of voor het brengen van een bezoek aan een in
      levensgevaar of ernstige psychische nood verkerende van een andere relatie van de jeugdige;

      d. voor een bezoek in verband met het overlijden van de levensgezel of van een kind, ouder, broer, zus, grootouder
      of schoonouder van de veroordeelde of van de jeugdige of in verband met het overlijden van een andere relatie van
      de jeugdige. Het bezoek kan bestaan uit het bijwonen van de uitvaart, een rouwbezoek, dan wel een bezoek aan graf
      of columbarium;

      e. voor een bezoek in verband met het niet in staat zijn om naar de inrichting te reizen van een relatie van de
      jeugdige;

      f. wegens dringende redenen van lichamelijke of psychische aard bij de veroordeelde of de jeugdige, die naar het
      oordeel van de inrichtingsarts in de weg staan aan voortzetting van de detentie of jeugddetentie;

      g. eenmalig wegens dringende omstandigheden van zakelijke aard, indien de veroordeelde of jeugdige aantoont dat de
      zakelijke belangen al bestonden voor de aanvang van de tenuitvoerlegging van de vrijheidsstraf en dat persoonlijke
      aanwezigheid bij de behartiging ervan noodzakelijk is;

      h. wegens andere onvoorziene klemmende redenen gelegen in de persoonlijke sfeer, waarbij de aanwezigheid van de
      veroordeelde of de jeugdige noodzakelijk is.

      3 In de gevallen, bedoeld in het tweede lid, onder a tot en met e, kan strafonderbreking slechts worden verleend
      indien de betreffende toestand of gebeurtenis door een arts respectievelijk een ambtenaar van de burgerlijke stand
      is bevestigd en is aangetoond dat:

      a. de band tussen de veroordeelde of de jeugdige en de te bezoeken of overleden persoon hecht is of was, en

      b. de te bezoeken persoon respectievelijk de nabestaanden van die persoon geen bezwaar heeft of hebben tegen het
      bezoek van de veroordeelde of de jeugdige.

      4 Strafonderbreking voor bepaalde tijd wordt niet verleend op verzoek van:

      a. een vreemdeling die ongewenst is verklaard of ten aanzien van wie een inreisverbod is uitgevaardigd dan wel ten
      aanzien van wie een procedure tot ongewenstverklaring of uitvaardiging van een inreisverbod loopt, tenzij aan het
      besluit tot ongewenstverklaring of uitvaardiging van een inreisverbod schorsende werking is verleend, en

      b. een vreemdeling van wie vaststaat dat deze na het ondergaan van de straf zal worden uitgezet.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel25a
  - number: 2:5b
    text: De strafonderbreking voor bepaalde tijd duurt niet langer dan noodzakelijk, doch ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel25b
  - number: 2:5c
    text: |-
      Bij de beslissing over het verlenen van de strafonderbreking voor bepaalde tijd en het vaststellen van de duur
      ervan houdt Onze Minister rekening met alle in aanmerking komende belangen. De belangen van de veroordeelde of
      jeugdige worden afgewogen tegen het algemeen belang. Daarbij wordt zwaar gewicht toegekend aan de risico's voor de
      continuïteit van de tenuitvoerlegging en voor de maatschappelijke orde en veiligheid, alsmede de belangen van het
      slachtoffer als bedoeld in [artikel 51a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel51a
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 51a
  - number: 2:5d
    text: |-
      1 Strafonderbreking voor bepaalde tijd geschiedt onder de algemene voorwaarden dat de veroordeelde of jeugdige:

      a. de strafonderbreking gebruikt voor het doel waarvoor deze is verleend;

      b. zich gedurende de strafonderbreking niet schuldig maakt aan een strafbaar feit;

      c. Nederland slechts mag verlaten wanneer deze wegens bijzondere omstandigheden van Onze Minister toestemming heeft
      gekregen voor verblijf in het buitenland.

      2 Aan de strafonderbreking voor bepaalde tijd kunnen daarnaast bijzondere voorwaarden betreffende het gedrag van de
      veroordeelde of jeugdige worden verbonden. Indien een bijzondere voorwaarde is gesteld, is daaraan van rechtswege
      de voorwaarde verbonden dat de veroordeelde of jeugdige ten behoeve van het vaststellen van zijn identiteit
      medewerking verleent aan het nemen van een of meer vingerafdrukken of een identiteitsbewijs als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage aanbiedt.

      3 De bijzondere voorwaarden kunnen inhouden:

      a. een verbod contact te leggen of te laten leggen met bepaalde personen of instellingen;

      b. een verbod zich op of in de directe omgeving van een bepaalde locatie te bevinden;

      c. een verplichting op bepaalde tijdstippen of gedurende een bepaalde periode op een bepaalde locatie aanwezig te
      zijn of te verblijven;

      d. een verplichting zich op bepaalde tijdstippen te melden bij een bepaalde instantie;

      e. een verbod op het gebruik van verdovende middelen of alcohol en de verplichting ten behoeve van de naleving van
      dit verbod mee te werken aan bloedonderzoek of urineonderzoek;

      f. een verplichting om een in detentie reeds aangevangen behandeling door een deskundige of zorginstelling voort te
      zetten gedurende de duur van de strafonderbreking;

      g. elektronisch toezicht;

      h. begeleiding en toezicht door de reclassering of jeugdreclassering en de verplichting medewerking te verlenen
      aan die begeleiding en dat toezicht, daaronder begrepen de medewerking aan huisbezoeken en het zich melden bij de
      reclasseringsinstelling zo vaak en zolang als de reclasseringsinstelling dit noodzakelijk acht;

      i. andere voorwaarden, het gedrag van de veroordeelde of jeugdige betreffende, waaraan deze gedurende de duur van
      de strafonderbreking heeft te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel25d
