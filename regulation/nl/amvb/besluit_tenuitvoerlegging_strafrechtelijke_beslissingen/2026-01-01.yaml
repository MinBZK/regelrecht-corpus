  - number: 1:2
    text: |-
      1 Bij ministeriële regeling worden nadere regels gesteld over de volgorde waarin straffen en maatregelen ten
      uitvoer worden gelegd.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over:

      a. een persoonsgerichte invulling van de tenuitvoerlegging;

      b. het geven van een last tot aanhouding;

      c. de vorm van het advies van het openbaar ministerie aan Onze Minister over tijdens de tenuitvoerlegging te nemen
      besluiten;

      d. de bevoegdheid van Onze Minister, bedoeld in [artikel 6:1:11 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6111
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 6:1:11
  - number: 2:1
    text: |-
      1 Het openbaar ministerie beslist of aan de voorwaardelijke invrijheidstelling bijzondere voorwaarden worden
      verbonden. Tevens beslist het openbaar ministerie of aan de voorwaarden elektronisch toezicht wordt verbonden.

      2 Indien bijzondere voorwaarden aan de voorwaardelijke invrijheidstelling worden verbonden, geeft het openbaar
      ministerie of Onze Minister opdracht aan de reclassering om toezicht te houden op de naleving en om de veroordeelde
      ten behoeve daarvan te begeleiden. Indien het openbaar ministerie de opdracht geeft, wordt Onze Minister hierover
      geïnformeerd.

      3 Het openbaar ministerie houdt rekening met de adviezen ontvangen van de reclassering en de directeur van de
      inrichting waar de veroordeelde staat ingeschreven.

      4 De adviezen van de reclassering en de directeur van de inrichting vermelden welke voorwaarden worden voorgesteld
      en de redenen waarom deze voorwaarden worden voorgesteld. De adviezen kunnen vermelden of het aangewezen is aan
      enige voorwaarde elektronisch toezicht te verbinden.

      5 De adviezen vermelden voorts het standpunt van de veroordeelde over de voorgestelde voorwaarden.

      6 Bij de beslissing houdt het openbaar ministerie rekening met voorwaarden die de veroordeelde eventueel in een
      ander kader zijn opgelegd en waarvan de proeftijd aanvangt of wordt voorgezet op het moment van voorwaardelijke
      invrijheidstelling. In het advies van de reclassering wordt hieraan aandacht besteed.

      7 Het openbaar ministerie betrekt bij zijn beslissing over de verlening van voorwaardelijke invrijheidstelling de
      beschikbaarheid van een aanvaardbaar verblijfadres.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel21
  - number: 2:2
    text: |-
      1 De beslissing om bijzondere voorwaarden te stellen wordt gemotiveerd.

      2 De veroordeelde wordt zo spoedig mogelijk schriftelijk door het openbaar ministerie op de hoogte gesteld van de
      beslissing. Een afschrift van de beslissing wordt aan Onze Minister verzonden.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel22
  - number: 2:3
    text: |-
      1 Het openbaar ministerie vult de bijzondere voorwaarden aan, wijzigt ze of heft ze op indien de naleving door de
      veroordeelde of overige omstandigheden daartoe aanleiding geven.

      2 Het openbaar ministerie stelt de veroordeelde zo spoedig mogelijk schriftelijk op de hoogte van een aanvulling,
      wijziging of opheffing van de bijzondere voorwaarden. Een afschrift van de beslissing wordt aan Onze Minister
      verzonden.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel23
  - number: 2:4
    text: |-
      Indien de directeur van de inrichting van oordeel is dat een jeugdige aan wie jeugddetentie is opgelegd
      voorwaardelijk in vrijheid behoort te worden gesteld, doet hij daaromtrent een gemotiveerd voorstel aan het
      openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel24
  - number: 2:5
    text: |-
      1 Het openbaar ministerie brengt een beslissing van de rechter tot voorwaardelijke invrijheidstelling van
      een jeugdige aan wie jeugddetentie is opgelegd, onverwijld ter kennis van Onze Minister ten behoeve van de
      tenuitvoerlegging, onder mededeling van de aan de jeugdige opgelegde voorwaarden en het begin en het einde van
      de proeftijd.

      2 Het eerste lid is van overeenkomstige toepassing op het mededelen van beslissingen krachtens
      de [artikelen 6:6:19, eerste lid, onder a en b][ref1], [6:6:21, eerste en tweede lid][ref2], en
      [6:6:32 van de wet][ref3].


