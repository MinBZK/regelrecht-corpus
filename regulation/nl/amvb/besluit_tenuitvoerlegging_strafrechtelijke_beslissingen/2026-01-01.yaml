  - number: 2:21
    text: |-
      1 Het openbaar ministerie brengt een vordering als bedoeld in [artikel 6:6:32 van de wet][ref1] ter kennis aan de
      raad voor de kinderbescherming.

      2 Onze Minister brengt een beslissing als bedoeld in [artikel 6:6:32 van de wet][ref2] ter kennis aan de raad
      voor de kinderbescherming en een beslissing als bedoeld in [artikel 6:6:32, derde lid, onder b, van de wet][ref3]
      onverwijld ter kennis aan de selectiefunctionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6632
