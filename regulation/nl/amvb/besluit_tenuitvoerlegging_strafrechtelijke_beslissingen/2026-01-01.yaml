        bwb_id: BWBR0012647
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0012647
        artikel: '10'
  - number: 2:10
    text: |-
      1 De maatregel van plaatsing in een inrichting voor jeugdigen kan te allen tijde door Onze Minister voorwaardelijk
      of onvoorwaardelijk worden beëindigd indien het doel van de maatregel is bereikt of beter op andere wijze kan
      worden bereikt.

      2 De beslissing tot voorwaardelijke beëindiging wordt genomen op voorstel van de directeur van de inrichting.

      3 De beslissing kan ook ambtshalve worden genomen, doch slechts nadat de directeur van de inrichting is gehoord.

      4 De reclassering of de jeugdreclassering, belast met de begeleiding en het toezicht, bedoeld in
      [artikel 10, tweede lid, van het Reglement justitiële jeugdinrichtingen][ref1], kan aan Onze Minister een
      voorstel doen tot het voorwaardelijk beëindigen van de maatregel. Dit voorstel wordt gedaan aan Onze Minister door
      tussenkomst van de directeur van de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel10
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '10'
  - number: 2:11
    text: |-
      1 Onze Minister wijst in de beslissing tot voorwaardelijke beëindiging de reclassering of de jeugdreclassering aan
      die met de begeleiding van de jeugdige en het toezicht op de naleving van de voorwaarden is belast.

      2 De reclassering of de jeugdreclassering ontvangt mededeling van de beëindiging van de maatregel en de voorwaarden
      waaronder deze is verleend.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel211
  - number: 2:12
    text: |-
      Aan een beslissing tot voorwaardelijke beëindiging worden, behoudens nader te stellen bijzondere voorwaarden, de
      volgende algemene voorwaarden verbonden:

      a. dat de jeugdige zich gedraagt overeenkomstig de aanwijzingen van de reclassering of de jeugdreclassering en ter
      zake alle verlangde inlichtingen zal verschaffen;

      b. dat de jeugdige tevoren melding doet aan de reclassering of de jeugdreclassering van een verandering in de
      woon-, onderwijs- of werksituatie; en

      c. dat de jeugdige zich niet schuldig maakt aan een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel212
  - number: 2:13
    text: |-
      Onze Minister doet aan de jeugdige ten aanzien van wie de maatregel voorwaardelijk is beëindigd door tussenkomst
      van de directeur van de inrichting een beschikking toekomen, waarin de voorwaarden zijn vermeld die aan de
      beëindiging zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel213
  - number: 2:14
    text: |-
      1 Indien Onze Minister de maatregel voorwaardelijk of onvoorwaardelijk beëindigt, stelt hij zo spoedig mogelijk
      de directeur van de inrichting, de raad voor de kinderbescherming en het openbaar ministerie van die beslissing in
      kennis. Indien de beëindiging voorwaardelijk is verleend, deelt hij daarbij de voorwaarden mede.

      2 Indien de beslissing strekt tot onvoorwaardelijke beëindiging van de maatregel ten aanzien van een jeugdige aan
      wie reeds voorwaardelijke beëindiging was verleend, brengt Onze Minister de beslissing tevens ter kennis van de
      reclassering of de jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel214
  - number: 2:15
    text: |-
      1 Indien voorwaarden zijn verbonden aan de beëindiging, doet het openbaar ministerie onverwijld mededeling aan Onze
      Minister en de reclassering of de jeugdreclassering van:

      a. elk ter zijner kennis gekomen misdrijf dat de jeugdige heeft begaan of vermoedelijk heeft begaan; en

      b. elk ter zijner kennis gekomen overtreding van de voorwaarden door de jeugdige.

      2 Onze Minister doet aan de reclassering of de jeugdreclassering onverwijld mededeling van elke vrijheidsbeneming
      van de jeugdige door het daartoe bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel215
  - number: 2:16
    text: |-
      1 Indien de jeugdige de gestelde voorwaarden overtreedt, zendt de reclassering of de jeugdreclassering aan Onze
      Minister een voorstel tot intrekking of schorsing van de voorwaardelijke beëindiging dan wel een bericht waaruit
      blijkt om welke redenen die intrekking of schorsing niet, of nog niet, geraden wordt geacht.

      2 Een voorstel tot intrekking kan tevens worden gedaan indien een ander belang van de jeugdige dit vordert.

      3 Een voorstel of bericht als bedoeld in het eerste lid kan ook door het openbaar ministerie aan Onze Minister
      worden gezonden.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel216
  - number: 2:17
    text: |-
      Indien Onze Minister besluit tot intrekking of schorsing van de voorwaardelijke beëindiging, stelt hij de
      reclassering of de jeugdreclassering, het openbaar ministerie en de directeur van de inrichting van zijn beslissing
      in kennis.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel217
  - number: 2:18
    text: |-
      1 Uiterlijk drie maanden voordat de maatregel voorwaardelijk eindigt op grond van
      [artikel 6:2:22, eerste lid, van de wet][ref1], maakt de directeur van de inrichting binnen een maand, te rekenen
      vanaf voornoemd tijdstip, een schriftelijk, met redenen omkleed, gedagtekend en ondertekend advies op en zendt dit
      aan Onze Minister. Het advies betreft:

      a. de wenselijkheid van de verlenging van de maatregel; en

      b. de termijn waarover, naar zijn mening, de verlenging zich zou moeten uitstrekken.

      2 Bij het advies wordt een afschrift overgelegd van de aantekeningen omtrent de lichamelijke en geestelijke
      gesteldheid van de jeugdige.

      3 Indien in het geval, bedoeld in het eerste lid, de jeugdige op grond van een scholings- en trainingsprogramma of
      een voorwaardelijke beëindiging als bedoeld in [artikel 6:2:22, eerste lid, van de wet][ref2], buiten de inrichting
      verblijft, voegt de directeur van de inrichting bij zijn advies tevens de beschouwingen van de reclassering of de
      jeugdreclassering inzake de wenselijkheid van de verlenging van de maatregel.

      4 Onze Minister zendt het advies met bijlagen aan het openbaar ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6222
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6222
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 6:2:22
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 6:2:22
  - number: 2:19
    text: |-
      1 Het openbaar ministerie doet Onze Minister zo spoedig mogelijk mededeling:

      a. van zijn eventuele beslissing geen vordering tot verlenging van de maatregel in te dienen;

      b. indien zodanige vordering wel is ingediend, van de beslissing van de rechtbank.

      2 Indien de rechter de maatregel niet verlengt, stelt Onze Minister zo spoedig mogelijk de directeur van de
      inrichting en de reclassering of jeugdreclassering van die beslissing in kennis.

      3 Indien de beslissing tot niet verlenging van de maatregel ziet op een jeugdige ten aanzien van wie reeds een
      beslissing tot voorwaardelijke beëindiging van de maatregel was genomen, brengt Onze Minister deze beslissing
      tevens ter kennis van de reclassering of de jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel219
  - number: 2:20
    text: |-
      Bij het indienen van een vordering als bedoeld in [artikel 6:6:32 van de wet][ref1], legt het openbaar ministerie
      de beschouwingen over van de reclassering of de jeugdreclassering over de wijze waarop de jeugdige de voorwaarden,
      bedoeld in [artikel 77ta, eerste lid, van het Wetboek van Strafrecht][ref2], heeft nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6632
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77ta
