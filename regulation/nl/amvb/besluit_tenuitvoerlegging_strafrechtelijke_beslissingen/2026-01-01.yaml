  - number: 4:11
    text: |-
      Degene aan wie een geldboete wordt opgelegd, is de bij ministeriële regeling bepaalde administratiekosten
      verschuldigd. Op de betaling van de administratiekosten zijn de artikelen van dit besluit betreffende de betaling
      van de geldboete en de verantwoording van de gelden van overeenkomstige toepassing. De administratiekosten worden
      samen met de geldboete in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel411
  - number: 4:12
    text: |-
      1 De kosten van verhaal van een opgelegde geldboete, ontnemingsmaatregel of schadevergoedingsmaatregel worden op
      gelijke voet als de geldboete of de maatregel verhaald op degene aan wie de geldboete of maatregel is opgelegd.
      Onder de kosten van verhaal zijn begrepen de invorderingskosten.

      2 De kosten van verhaal, voor zover zij niet betreffen de invorderingskosten, worden berekend overeenkomstig de bij
      het [Besluit tarieven ambtshandelingen gerechtsdeurwaarders][ref1] vastgestelde tarieven.

      3 De omvang van de invorderingskosten wordt bepaald bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012638
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel412
    references:
      - id: ref1
        bwb_id: BWBR0012638
  - number: 4:13
    text: |-
      De uitlevering van niet in beslag genomen verbeurd verklaarde voorwerpen, geschiedt op de door Onze Minister
      aangewezen plaats.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel413
  - number: 4:14
    text: |-
      1 Overeenkomstig [artikel 6:4:2, zevende lid, van de wet][ref1] keert Onze Minister het resterende
      bedrag van de schadevergoedingsmaatregel uit aan het slachtoffer of de personen, genoemd in
      [artikel 51f, tweede lid, van de wet][ref2], die geen rechtspersoon zijn.

      2 Ten aanzien van het uit te keren bedrag geldt een maximum van € 5.000. Dit maximum geldt niet in de gevallen
      waarin het bedrag wordt uitgekeerd na een veroordeling ter zake van een van de misdrijven als omschreven
      in de [artikelen 141][ref3], [239 tot en met 254ba][ref4], [273f][ref5], [287 tot en met 291][ref6],
      [300 tot en met 303][ref7], [312][ref8] en [317 van het Wetboek van Strafrecht][ref9].


