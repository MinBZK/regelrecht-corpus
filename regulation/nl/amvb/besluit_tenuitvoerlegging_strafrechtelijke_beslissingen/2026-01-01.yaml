  - number: 2:7
    text: |-
      1 Er wordt voorzien in nazorg bij jeugdigen middels begeleiding en ondersteuning tijdens en na verblijf in een
      inrichting.

      2 De nazorg heeft tot doel de voorbereiding van de terugkeer in de samenleving en het bevorderen van de
      geleidelijke overgang bij deze terugkeer.

      3 Indien de nazorg wordt vormgegeven via het trajectberaad, nemen daaraan deel:

      a. een vertegenwoordiger van de raad voor de kinderbescherming, tevens voorzitter;

      b. een vertegenwoordiger van de jeugdreclassering of de reclassering;

      c. een vertegenwoordiger van de inrichting waarin de jeugdige verblijft of heeft verbleven; en

      d. een vertegenwoordiger van de gemeente waar de jeugdige zal verblijven na zijn verblijf in de inrichting.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel27
  - number: 2:8
    text: |-
      1 Omtrent de jeugdige aan wie de maatregel van plaatsing in een inrichting voor jeugdigen is opgelegd, worden door
      of vanwege de directeur van de inrichting aantekeningen gehouden.

      2 De aantekeningen bevatten in elk geval:

      a. zo volledig mogelijke gegevens betreffende de afkomst en het verleden;

      b. gegevens omtrent de lichamelijke en geestelijke toestand bij binnenkomst;

      c. de voortgang in het perspectiefplan;

      d. gegevens omtrent belangrijke voorvallen gedurende het verblijf in de inrichting.
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel28
  - number: 2:9
    text: |-
      1 De reclassering of de jeugdreclassering, belast met de begeleiding en het toezicht, bedoeld in
      [artikel 10, tweede lid, van het Reglement justitiële jeugdinrichtingen][ref1], kan aan de directeur van de
      inrichting een voorstel doen tot wijziging of opheffing van de voorwaarden die zijn verbonden aan de deelname aan
      het scholings- en trainingsprogramma.

      2 De reclassering of de jeugdreclassering, belast met de begeleiding en het toezicht, bedoeld in
      [artikel 10, tweede lid, van het Reglement justitiële jeugdinrichtingen][ref2], dient desgevraagd de directeur van
      de inrichting en Onze Minister van advies.

      3 Indien de directeur van de inrichting het voorstel of het advies volgt en dit gevolgen heeft voor het toezicht op
      de naleving, wordt Onze Minister hierover geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel10
    url: https://wetten.overheid.nl/BWBR0042962/2026-01-01#Artikel29
