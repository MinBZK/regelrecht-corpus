        bwb_id: BWBR0001903
        artikel: '6'
  - number: 2:1.1
    text: |-
      Het openbaar ministerie beslist of aan de voorwaardelijke invrijheidstelling bijzondere voorwaarden worden
      verbonden. Tevens beslist het openbaar ministerie of aan de voorwaarden elektronisch toezicht wordt verbonden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel21
  - number: 2:1.2
    text: |-
      Indien bijzondere voorwaarden aan de voorwaardelijke invrijheidstelling worden verbonden, geeft het openbaar
      ministerie of Onze Minister opdracht aan de reclassering om toezicht te houden op de naleving en om de veroordeelde
      ten behoeve daarvan te begeleiden. Indien het openbaar ministerie de opdracht geeft, wordt Onze Minister hierover
      geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel21
  - number: 2:1.3
    text: |-
      Het openbaar ministerie houdt rekening met de adviezen ontvangen van de reclassering en de directeur van de
      inrichting waar de veroordeelde staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel21
  - number: 2:1.4
    text: |-
      De adviezen van de reclassering en de directeur van de inrichting vermelden welke voorwaarden worden voorgesteld en
      de redenen waarom deze voorwaarden worden voorgesteld. De adviezen kunnen vermelden of het aangewezen is aan enige
      voorwaarde elektronisch toezicht te verbinden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel21
  - number: 2:1.5
    text: De adviezen vermelden voorts het standpunt van de veroordeelde over de voorgestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel21
  - number: 2:1.6
    text: |-
      Bij de beslissing houdt het openbaar ministerie rekening met voorwaarden die de veroordeelde eventueel in een
      ander kader zijn opgelegd en waarvan de proeftijd aanvangt of wordt voorgezet op het moment van voorwaardelijke
      invrijheidstelling. In het advies van de reclassering wordt hieraan aandacht besteed.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel21
  - number: 2:1.7
    text: |-
      Het openbaar ministerie betrekt bij zijn beslissing over de verlening van voorwaardelijke invrijheidstelling de
      beschikbaarheid van een aanvaardbaar verblijfadres.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel21
  - number: 2:2.1
    text: De beslissing om bijzondere voorwaarden te stellen wordt gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel22
  - number: 2:2.2
    text: |-
      De veroordeelde wordt zo spoedig mogelijk schriftelijk door het openbaar ministerie op de hoogte gesteld van de
      beslissing. Een afschrift van de beslissing wordt aan Onze Minister verzonden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel22
  - number: 2:3.1
    text: |-
      Het openbaar ministerie vult de bijzondere voorwaarden aan, wijzigt ze of heft ze op indien de naleving door de
      veroordeelde of overige omstandigheden daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel23
  - number: 2:3.2
    text: |-
      Het openbaar ministerie stelt de veroordeelde zo spoedig mogelijk schriftelijk op de hoogte van een aanvulling,
      wijziging of opheffing van de bijzondere voorwaarden. Een afschrift van de beslissing wordt aan Onze Minister
      verzonden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel23
  - number: 2:4
    text: |-
      Indien de directeur van de inrichting van oordeel is dat een jeugdige aan wie jeugddetentie is opgelegd
      voorwaardelijk in vrijheid behoort te worden gesteld, doet hij daaromtrent een gemotiveerd voorstel aan het
      openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel24
  - number: 2:5.1
    text: |-
      Het openbaar ministerie brengt een beslissing van de rechter tot voorwaardelijke invrijheidstelling van
      een jeugdige aan wie jeugddetentie is opgelegd, onverwijld ter kennis van Onze Minister ten behoeve van de
      tenuitvoerlegging, onder mededeling van de aan de jeugdige opgelegde voorwaarden en het begin en het einde van
      de proeftijd.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel25
  - number: 2:5.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het mededelen van beslissingen krachtens
      de [artikelen 6:6:19, eerste lid, onder a en b][ref1], [6:6:21, eerste en tweede lid][ref2], en
      [6:6:32 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 2:6.1
    text: |-
      Bij schorsing van het bevel tot voorlopige hechtenis bij jeugdigen kan de rechter één of meer van de volgende
      bijzondere voorwaarden aan de schorsing verbinden:
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
  - number: 2:6.1.a
    text: |-
      zich gedurende een door de rechter te bepalen termijn houden aan de aanwijzingen van de reclassering of de
      jeugdreclassering, ook indien deze aanwijzingen inhouden dat de jeugdige zich onder behandeling van een bepaalde
      deskundige of instantie zal stellen;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
  - number: 2:6.1.b
    text: het aanvaarden van intensieve begeleiding;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
  - number: 2:6.1.c
    text: het volgen van een leerproject van ten hoogste 120 uren;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
  - number: 2:6.1.d
    text: op een bepaald tijdstip of gedurende een bepaalde periode op een bepaalde locatie aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
  - number: 2:6.1.e
    text: zich op bepaalde tijdstippen melden bij een bepaalde instantie;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
  - number: 2:6.1.f
    text: een verbod contact te leggen of te laten leggen met bepaalde personen of instellingen;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
  - number: 2:6.1.g
    text: een verbod zich op of in de directe omgeving van een bepaalde locatie te bevinden;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
  - number: 2:6.1.h
    text: |-
      een verbod op het gebruik van verdovende middelen of alcohol en de verplichting ten behoeve van de naleving van dit
      verbod mee te werken aan bloedonderzoek of urineonderzoek;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
  - number: 2:6.1.i
    text: andere voorwaarden, het gedrag van de jeugdige betreffende.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
  - number: 2:6.2
    text: |-
      Een behandeling als bedoeld in het eerste lid, onder a, of de voorwaarde, bedoeld in het eerste lid, onder i,
      kunnen geheel of gedeeltelijk bestaan uit een vorm van jeugdhulp als bedoeld in [artikel 1.1 van de Jeugdwet][ref1],
      indien het college van burgemeester en wethouders een besluit heeft genomen tot het treffen van een voorziening op
      het gebied van jeugdhulp als bedoeld in [artikel 2.3, eerste lid, van de Jeugdwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2'
  - number: 2:6.3
    text: |-
      De rechter kan de werking van de voorwaarden beperken tot een bij de beslissing tot schorsing van het bevel tot
      voorlopige hechtenis te bepalen tijdsduur, met dien verstande dat een behandeling als bedoeld in het eerste lid,
      onder a, de begeleiding als bedoeld in het eerste lid, onder b, en een voorwaarde als bedoeld in het eerste lid,
      onder i, ten hoogste zes maanden kunnen duren. Aan een bijzondere voorwaarde kan elektronisch toezicht worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
  - number: 2:6.4
    text: |-
      De in [artikel 493, zesde lid, van de wet][ref1] bedoelde instemming moet blijken uit een door de jeugdige
      ondertekende verklaring, waarin de aard en inhoud van de voorwaarden zijn omschreven. De instemming van de jeugdige
      kan eveneens blijken uit het proces-verbaal van de terechtzitting.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel493
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '493'
  - number: 2:7.1
    text: |-
      Er wordt voorzien in nazorg bij jeugdigen middels begeleiding en ondersteuning tijdens en na verblijf in een
      inrichting.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel27
  - number: 2:7.2
    text: |-
      De nazorg heeft tot doel de voorbereiding van de terugkeer in de samenleving en het bevorderen van de geleidelijke
      overgang bij deze terugkeer.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel27
  - number: 2:7.3
    text: 'Indien de nazorg wordt vormgegeven via het trajectberaad, nemen daaraan deel:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel27
  - number: 2:7.3.a
    text: een vertegenwoordiger van de raad voor de kinderbescherming, tevens voorzitter;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel27
  - number: 2:7.3.b
    text: een vertegenwoordiger van de jeugdreclassering of de reclassering;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel27
  - number: 2:7.3.c
    text: een vertegenwoordiger van de inrichting waarin de jeugdige verblijft of heeft verbleven; en
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel27
  - number: 2:7.3.d
    text: een vertegenwoordiger van de gemeente waar de jeugdige zal verblijven na zijn verblijf in de inrichting.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel27
  - number: 2:8.1
    text: |-
      Omtrent de jeugdige aan wie de maatregel van plaatsing in een inrichting voor jeugdigen is opgelegd, worden door of
      vanwege de directeur van de inrichting aantekeningen gehouden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel28
  - number: 2:8.2
    text: 'De aantekeningen bevatten in elk geval:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel28
  - number: 2:8.2.a
    text: zo volledig mogelijke gegevens betreffende de afkomst en het verleden;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel28
  - number: 2:8.2.b
    text: gegevens omtrent de lichamelijke en geestelijke toestand bij binnenkomst;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel28
  - number: 2:8.2.c
    text: de voortgang in het perspectiefplan;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel28
  - number: 2:8.2.d
    text: gegevens omtrent belangrijke voorvallen gedurende het verblijf in de inrichting.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel28
  - number: 2:9.1
    text: |-
      De reclassering of de jeugdreclassering, belast met de begeleiding en het toezicht, bedoeld in
      [artikel 10, tweede lid, van het Reglement justitiële jeugdinrichtingen][ref1], kan aan de directeur van de
      inrichting een voorstel doen tot wijziging of opheffing van de voorwaarden die zijn verbonden aan de deelname aan
      het scholings- en trainingsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel10
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '10'
  - number: 2:9.2
    text: |-
      De reclassering of de jeugdreclassering, belast met de begeleiding en het toezicht, bedoeld in
      [artikel 10, tweede lid, van het Reglement justitiële jeugdinrichtingen][ref1], dient desgevraagd de directeur van
      de inrichting en Onze Minister van advies.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel10
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '10'
  - number: 2:9.3
    text: |-
      Indien de directeur van de inrichting het voorstel of het advies volgt en dit gevolgen heeft voor het toezicht op
      de naleving, wordt Onze Minister hierover geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel29
  - number: 2:10.1
    text: |-
      De maatregel van plaatsing in een inrichting voor jeugdigen kan te allen tijde door Onze Minister voorwaardelijk of
      onvoorwaardelijk worden beëindigd indien het doel van de maatregel is bereikt of beter op andere wijze kan worden
      bereikt.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel210
  - number: 2:10.2
    text: De beslissing tot voorwaardelijke beëindiging wordt genomen op voorstel van de directeur van de inrichting.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel210
  - number: 2:10.3
    text: De beslissing kan ook ambtshalve worden genomen, doch slechts nadat de directeur van de inrichting is gehoord.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel210
  - number: 2:10.4
    text: |-
      De reclassering of de jeugdreclassering, belast met de begeleiding en het toezicht, bedoeld in
      [artikel 10, tweede lid, van het Reglement justitiële jeugdinrichtingen][ref1], kan aan Onze Minister een
      voorstel doen tot het voorwaardelijk beëindigen van de maatregel. Dit voorstel wordt gedaan aan Onze Minister door
      tussenkomst van de directeur van de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel10
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '10'
  - number: 2:11.1
    text: |-
      Onze Minister wijst in de beslissing tot voorwaardelijke beëindiging de reclassering of de jeugdreclassering aan
      die met de begeleiding van de jeugdige en het toezicht op de naleving van de voorwaarden is belast.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel211
  - number: 2:11.2
    text: |-
      De reclassering of de jeugdreclassering ontvangt mededeling van de beëindiging van de maatregel en de voorwaarden
      waaronder deze is verleend.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel211
  - number: 2:12
    text: |-
      Aan een beslissing tot voorwaardelijke beëindiging worden, behoudens nader te stellen bijzondere voorwaarden, de
      volgende algemene voorwaarden verbonden:
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel212
  - number: 2:12.a
    text: |-
      dat de jeugdige zich gedraagt overeenkomstig de aanwijzingen van de reclassering of de jeugdreclassering en ter
      zake alle verlangde inlichtingen zal verschaffen;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel212
  - number: 2:12.b
    text: |-
      dat de jeugdige tevoren melding doet aan de reclassering of de jeugdreclassering van een verandering in de woon-,
      onderwijs- of werksituatie; en
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel212
  - number: 2:12.c
    text: dat de jeugdige zich niet schuldig maakt aan een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel212
  - number: 2:13
    text: |-
      Onze Minister doet aan de jeugdige ten aanzien van wie de maatregel voorwaardelijk is beëindigd door tussenkomst
      van de directeur van de inrichting een beschikking toekomen, waarin de voorwaarden zijn vermeld die aan de
      beëindiging zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel213
  - number: 2:14.1
    text: |-
      Indien Onze Minister de maatregel voorwaardelijk of onvoorwaardelijk beëindigt, stelt hij zo spoedig mogelijk de
      directeur van de inrichting, de raad voor de kinderbescherming en het openbaar ministerie van die beslissing in
      kennis. Indien de beëindiging voorwaardelijk is verleend, deelt hij daarbij de voorwaarden mede.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel214
  - number: 2:14.2
    text: |-
      Indien de beslissing strekt tot onvoorwaardelijke beëindiging van de maatregel ten aanzien van een jeugdige aan
      wie reeds voorwaardelijke beëindiging was verleend, brengt Onze Minister de beslissing tevens ter kennis van de
      reclassering of de jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel214
  - number: 2:15.1
    text: |-
      Indien voorwaarden zijn verbonden aan de beëindiging, doet het openbaar ministerie onverwijld mededeling aan Onze
      Minister en de reclassering of de jeugdreclassering van:
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel215
  - number: 2:15.1.a
    text: elk ter zijner kennis gekomen misdrijf dat de jeugdige heeft begaan of vermoedelijk heeft begaan; en
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel215
  - number: 2:15.1.b
    text: elk ter zijner kennis gekomen overtreding van de voorwaarden door de jeugdige.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel215
  - number: 2:15.2
    text: |-
      Onze Minister doet aan de reclassering of de jeugdreclassering onverwijld mededeling van elke vrijheidsbeneming van
      de jeugdige door het daartoe bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel215
  - number: 2:16.1
    text: |-
      Indien de jeugdige de gestelde voorwaarden overtreedt, zendt de reclassering of de jeugdreclassering aan Onze
      Minister een voorstel tot intrekking of schorsing van de voorwaardelijke beëindiging dan wel een bericht waaruit
      blijkt om welke redenen die intrekking of schorsing niet, of nog niet, geraden wordt geacht.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel216
  - number: 2:16.2
    text: Een voorstel tot intrekking kan tevens worden gedaan indien een ander belang van de jeugdige dit vordert.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel216
  - number: 2:16.3
    text: |-
      Een voorstel of bericht als bedoeld in het eerste lid kan ook door het openbaar ministerie aan Onze Minister worden
      gezonden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel216
  - number: 2:17
    text: |-
      Indien Onze Minister besluit tot intrekking of schorsing van de voorwaardelijke beëindiging, stelt hij de
      reclassering of de jeugdreclassering, het openbaar ministerie en de directeur van de inrichting van zijn beslissing
      in kennis.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel217
  - number: 2:18.1
    text: |-
      Uiterlijk drie maanden voordat de maatregel voorwaardelijk eindigt op grond van
      [artikel 6:2:22, eerste lid, van de wet][ref1], maakt de directeur van de inrichting binnen een maand, te rekenen
      vanaf voornoemd tijdstip, een schriftelijk, met redenen omkleed, gedagtekend en ondertekend advies op en zendt dit
      aan Onze Minister. Het advies betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 2:18.1.a
    text: de wenselijkheid van de verlenging van de maatregel; en
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel218
  - number: 2:18.1.b
    text: de termijn waarover, naar zijn mening, de verlenging zich zou moeten uitstrekken.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel218
  - number: 2:18.2
    text: |-
      Bij het advies wordt een afschrift overgelegd van de aantekeningen omtrent de lichamelijke en geestelijke
      gesteldheid van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel218
  - number: 2:18.3
    text: |-
      Indien in het geval, bedoeld in het eerste lid, de jeugdige op grond van een scholings- en trainingsprogramma of
      een voorwaardelijke beëindiging als bedoeld in [artikel 6:2:22, eerste lid, van de wet][ref1], buiten de inrichting
      verblijft, voegt de directeur van de inrichting bij zijn advies tevens de beschouwingen van de reclassering of de
      jeugdreclassering inzake de wenselijkheid van de verlenging van de maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 2:18.4
    text: Onze Minister zendt het advies met bijlagen aan het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel218
  - number: 2:19.1
    text: 'Het openbaar ministerie doet Onze Minister zo spoedig mogelijk mededeling:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel219
  - number: 2:19.1.a
    text: van zijn eventuele beslissing geen vordering tot verlenging van de maatregel in te dienen;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel219
  - number: 2:19.1.b
    text: indien zodanige vordering wel is ingediend, van de beslissing van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel219
  - number: 2:19.2
    text: |-
      Indien de rechter de maatregel niet verlengt, stelt Onze Minister zo spoedig mogelijk de directeur van de
      inrichting en de reclassering of jeugdreclassering van die beslissing in kennis.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel219
  - number: 2:19.3
    text: |-
      Indien de beslissing tot niet verlenging van de maatregel ziet op een jeugdige ten aanzien van wie reeds een
      beslissing tot voorwaardelijke beëindiging van de maatregel was genomen, brengt Onze Minister deze beslissing
      tevens ter kennis van de reclassering of de jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel219
  - number: 2:20
    text: |-
      Bij het indienen van een vordering als bedoeld in [artikel 6:6:32 van de wet][ref1], legt het openbaar ministerie
      de beschouwingen over van de reclassering of de jeugdreclassering over de wijze waarop de jeugdige de voorwaarden,
      bedoeld in [artikel 77ta, eerste lid, van het Wetboek van Strafrecht][ref2], heeft nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77ta
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77ta
  - number: 2:21.1
    text: |-
      Het openbaar ministerie brengt een vordering als bedoeld in [artikel 6:6:32 van de wet][ref1] ter kennis aan de
      raad voor de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 2:21.2
    text: |-
      Onze Minister brengt een beslissing als bedoeld in [artikel 6:6:32 van de wet][ref1] ter kennis aan de raad voor
      de kinderbescherming en een beslissing als bedoeld in [artikel 6:6:32, derde lid, onder b, van de wet][ref2]
      onverwijld ter kennis aan de selectiefunctionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 2:22.1
    text: |-
      Het openbaar ministerie brengt een vordering als bedoeld in [artikel 6:6:33, eerste lid, van de wet][ref1] ter
      kennis aan de raad voor de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 2:22.2
    text: |-
      Onze Minister brengt een beslissing als bedoeld in [artikel 6:6:33, eerste lid, van de wet][ref1] onverwijld ter
      kennis aan de raad voor de kinderbescherming en de selectiefunctionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 2:23
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de gevallen waarin een veroordeelde door Onze Minister
      wordt opgeroepen zich op een bepaalde datum te melden bij de inrichting.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel223
  - number: 3:1.1
    text: |-
      Het openbaar ministerie kan de reclassering en de jeugdreclassering aanwijzingen geven omtrent het toezicht op de
      naleving van voorwaarden, voor zover zij daarmee zijn belast.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel31
  - number: 3:1.2
    text: |-
      Het toezicht op de naleving van voorwaarden kan te allen tijde worden beëindigd door het openbaar ministerie of
      Onze Minister na overleg met de reclassering of de jeugdreclassering. Het openbaar ministerie stelt de veroordeelde
      zo spoedig mogelijk op de hoogte van de beëindiging van het toezicht.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel31
  - number: 3:2.1
    text: |-
      De reclassering of de jeugdreclassering die is belast met het toezicht, draagt er zorg voor dat de verplichtingen
      worden vastgelegd waaraan de veroordeelde zich in het kader van het toezicht heeft te houden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel32
  - number: 3:2.2
    text: 'De reclassering of de jeugdreclassering draagt er zorg voor dat het toezicht aanvangt:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel32
  - number: 3:2.2.a
    text: |-
      bij een voorwaardelijke veroordeling: binnen een termijn van dertig dagen na het ingaan van de proeftijd, dan wel
      binnen een termijn van zeven dagen na het ingaan van de proeftijd, indien de rechter dadelijke uitvoerbaarheid
      heeft bevolen;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel32
  - number: 3:2.2.b
    text: |-
      bij een voorwaardelijke veroordeling van een jeugdige: binnen een termijn van vijf dagen na het ingaan van de
      proeftijd, dan wel binnen een termijn van drie dagen na het ingaan van de proeftijd, indien de rechter dadelijke
      uitvoerbaarheid heeft bevolen;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel32
  - number: 3:2.2.c
    text: 'bij een voorwaardelijke invrijheidstelling: zodra de veroordeelde voorwaardelijk in vrijheid wordt gesteld;'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel32
  - number: 3:2.2.d
    text: |-
      bij anderszins gestelde voorwaarden: zo spoedig mogelijk nadat de beslissing tot het stellen van voorwaarden is
      genomen.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel32
  - number: 3:3.1
    text: |-
      De veroordeelde volgt de aanwijzingen en opdrachten op die door de reclassering of de jeugdreclassering worden
      gegeven in het kader van het toezicht.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel33
  - number: 3:3.2
    text: |-
      De veroordeelde geeft veranderingen in de woon-, onderwijs- of werksituatie onmiddellijk door aan de reclassering
      of de jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel33
  - number: 3:4.1
    text: |-
      Zo spoedig mogelijk na de melding van de reclassering of de jeugdreclassering dat de veroordeelde een voorwaarde
      niet naleeft, brengt de reclassering of de jeugdreclassering advies uit aan het openbaar ministerie of de melding
      naar haar oordeel aanleiding zou kunnen geven tot een of meer van de volgende maatregelen:
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel34
  - number: 3:4.1.a
    text: het aanvullen, wijzigen of opheffen van de voorwaarden;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel34
  - number: 3:4.1.b
    text: het verkorten of verlengen van de proeftijd;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel34
  - number: 3:4.1.c
    text: het alsnog ten uitvoer leggen van de voorwaardelijk niet ten uitvoer gelegde straf of maatregel.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel34
  - number: 3:4.2
    text: Een afschrift van het advies wordt aan Onze Minister verzonden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel34
  - number: 3:5.1
    text: |-
      Met het oog op het beëindigen van het toezicht stuurt de reclassering of de jeugdreclassering een afloopbericht aan
      het openbaar ministerie en Onze Minister, zo spoedig mogelijk nadat de proeftijd is geëindigd.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel35
  - number: 3:5.2
    text: In het afloopbericht kan het feitelijk verloop van het toezicht worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel35
  - number: 3:6
    text: |-
      Onverminderd de taken en bevoegdheden van Onze Minister en het openbaar ministerie ten aanzien van de
      tenuitvoerlegging van de taakstraf, zijn de reclassering en de raad voor de kinderbescherming belast met de zorg
      voor het aanbod van projectplaatsen.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel36
  - number: 3:7
    text: 'Projectplaatsen voldoen aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel37
  - number: 3:7.a
    text: |-
      het te verrichten werk is additioneel, er mag geen sprake zijn van het bezetten van arbeidsplaatsen die anders ter
      beschikking zouden komen van de reguliere arbeidsmarkt;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel37
  - number: 3:7.b
    text: het werk dient zo veel mogelijk een publiek doel;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel37
  - number: 3:7.c
    text: de werkzaamheden zijn zinvol en in voldoende mate aanwezig;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel37
  - number: 3:7.d
    text: |-
      er is een contactpersoon aangewezen die ter plaatse verantwoordelijk is voor de gang van zaken rond het verrichten
      van de taakstraf;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel37
  - number: 3:7.e
    text: er is voorzien in begeleiding, de veroordeelde mag niet langdurig alleen zijn werkzaamheden uitvoeren;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel37
  - number: 3:7.f
    text: er wordt voldaan aan regelgeving omtrent arbeidsomstandigheden en andere veiligheidsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel37
  - number: 3:7.g
    text: |-
      werkzaamheden waarvoor bijzondere deskundigheid is vereist of die bijzondere risico's met zich meebrengen die niet
      aansluiten bij de werkervaring van de taakgestrafte, worden niet opgedragen;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel37
  - number: 3:7.h
    text: |-
      er wordt terughoudend omgegaan met het plaatsen van taakgestraften op posities waar geldhandelingen worden verricht
      of de taakgestrafte toegang heeft tot alcohol, drugs of medicijnen;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel37
  - number: 3:7.i
    text: |-
      de contactpersoon controleert de taakgestrafte en geeft onregelmatigheden, het aantal gewerkte uren en de
      getoonde inzet op basis van afspraken met de uitvoerder taakstraffen door aan de reclassering of de raad voor de
      kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel37
  - number: 3:8.1
    text: |-
      Indien de reclassering of de raad voor de kinderbescherming de inrichting van een nieuwe projectplaats overweegt,
      wordt een voorstel daartoe voorgelegd aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel38
  - number: 3:8.2
    text: |-
      Van de beoogde projectplaats wordt een omschrijving gemaakt. Deze bevat ten minste de naam van de instelling of
      organisatie, het doel van de instelling of organisatie, de aard van de werkzaamheden die kunnen worden verricht, de
      wijze van begeleiding van de taakgestrafte en een verklaring omtrent de bereidheid van de instelling of organisatie
      om controlerende taken uit te voeren.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel38
  - number: 3:8.3
    text: |-
      Onze Minister toetst het voorstel en de geschiktheid van de aanbieder van de projectplaats en beslist binnen een
      maand na de indiening van het voorstel.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel38
  - number: 3:9.1
    text: |-
      Projecten voor het verrichten van arbeid tot herstel van de door het strafbare feit aangerichte schade, als
      bedoeld in [artikel 77h, tweede lid, onderdeel a, van het Wetboek van Strafrecht][ref1], voldoen aan de volgende
      voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 3:9.1.a
    text: de jeugdige taakgestrafte beschikt over de vaardigheden om de schade te herstellen;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel39
  - number: 3:9.1.b
    text: |-
      op de plaats waar de schade wordt hersteld is voorzien in begeleiding van de werkzaamheden en het houden van
      toezicht op de jeugdige taakgestrafte.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel39
  - number: 3:9.2
    text: |-
      Herstel bij particulieren kan alleen plaatsvinden als wordt voorzien in begeleiding en toezicht door de raad voor
      de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel39
  - number: 3:10.1
    text: 'Leerprojecten voor jeugdigen voldoen aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel310
  - number: 3:10.1.a
    text: een omschrijving van de doelstelling en de te volgen methodieken;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel310
  - number: 3:10.1.b
    text: een omschrijving van de doelgroep;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel310
  - number: 3:10.1.c
    text: een omschrijving van het aantal uren dat het project omvat en de te verrichten activiteiten;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel310
  - number: 3:10.1.d
    text: |-
      er is voorzien in een correctiesysteem, waarbij de voorziene correctie dient te voldoen aan de eisen van
      proportionaliteit en zorgvuldigheid;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel310
  - number: 3:10.2
    text: |-
      De reclassering en de raad voor de kinderbescherming zijn belast met de zorg voor een adequate opleiding van de
      begeleiders van het leerproject.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel310
  - number: 3:10.3
    text: |-
      De reclassering en de raad voor de kinderbescherming zijn belast met de zorg voor een kwaliteitszorgsysteem
      leerprojecten, waarbij aandacht wordt besteed aan de omstandigheid dat de begeleider over voldoende kwalificaties
      beschikt en een toetsing plaatsvindt van de effecten van de gehanteerde methoden en activiteiten in een
      leerproject.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel310
  - number: 3:11.1
    text: |-
      Indien de reclassering of de raad voor de kinderbescherming de inrichting van een nieuw leerproject overweegt,
      wordt een voorstel daartoe voorgelegd aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel311
  - number: 3:11.2
    text: |-
      Van het beoogde project wordt een omschrijving gemaakt. Deze bevat ten minste de in
      [artikel 3:10, eerste lid, onder a tot en met d][ref1] bedoelde onderdelen, alsmede de bij het leerproject
      betrokken organisaties, een gemotiveerde schatting van het aantal deelnemers en een omschrijving van de wijze
      waarop de werkwijze en de resultaten van het project zullen worden geëvalueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel3
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel311
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:11.3
    text: Onze Minister beslist binnen een maand na de indiening van het voorstel.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel311
  - number: 3:12.1
    text: |-
      De reclassering en de raad voor de kinderbescherming dragen er zorg voor dat de rechter, het openbaar ministerie,
      Onze Minister, de taakgestrafte en diens raadsman zich steeds op de hoogte kunnen stellen van gegevens omtrent de
      beschikbare projectplaatsen, de aard van de te verrichten werkzaamheden en de te volgen leerprojecten.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel312
  - number: 3:12.2
    text: |-
      Indien een project naar het oordeel van de reclassering of de raad voor de kinderbescherming niet langer aan de
      gestelde eisen voldoet, meldt de reclassering onderscheidenlijk de raad voor de kinderbescherming dit aan Onze
      Minister. Tenzij Onze Minister binnen een maand anders beslist, vervalt na afloop van die termijn het project.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel312
  - number: 3:12.3
    text: |-
      Onze Minister kan, na overleg met de reclassering onderscheidenlijk de raad voor de kinderbescherming, een project
      doen vervallen.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel312
  - number: 3:13.1
    text: |-
      Nadat de reclassering of de raad voor de kinderbescherming daartoe opdracht van Onze Minister heeft ontvangen,
      zorgt de reclassering onderscheidenlijk de raad voor de kinderbescherming ervoor dat de taakstraf in
      overeenstemming met de rechterlijke uitspraak of de strafbeschikking ten uitvoer wordt gelegd. Indien dit niet
      mogelijk blijkt, stelt de reclassering onderscheidenlijk de raad voor de kinderbescherming Onze Minister en het
      openbaar ministerie daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel313
  - number: 3:13.2
    text: |-
      Indien een taakstraf bestaat uit een werkstraf en een leerstraf, worden deze voor de tenuitvoerlegging als
      afzonderlijke projecten aangemerkt.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel313
  - number: 3:14.1
    text: |-
      Na ontvangst van de in [artikel 3:13, eerste lid][ref1], bedoelde opdracht roept de uitvoerder taakstraffen de
      taakgestrafte zo spoedig mogelijk op voor een intakegesprek. Bij een jeugdige taakgestrafte kunnen tevens de ouders
      of voogd van de taakgestrafte worden opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel3
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel314
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3:14.2
    text: |-
      Wanneer de taakgestrafte niet reageert op de oproep en is vastgesteld dat het daarop vermelde adres niet afwijkt
      van dat waarop betrokkene staat ingeschreven in de basisregistratie personen, wordt opnieuw een oproep gedaan,
      vergezeld van de mededeling dat bij niet verschijnen de zaak wordt gezonden aan het openbaar ministerie. Indien op
      de tweede oproep niet wordt gereageerd, wordt daarvan melding gemaakt aan Onze Minister en het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel314
  - number: 3:14.3
    text: |-
      In het intakegesprek stelt de uitvoerder taakstraffen de taakgestrafte op de hoogte van de regels, rechten en
      plichten die gelden bij de tenuitvoerlegging van een taakstraf.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel314
  - number: 3:14.4
    text: |-
      Bij het bepalen van de feitelijke werkzaamheden of verplichtingen houdt de uitvoerder taakstraffen rekening met
      het gepleegde delict, de capaciteiten, mogelijkheden en specifieke omstandigheden van de taakgestrafte, alsmede de
      reisafstand tot de projectplaats. De reistijd bedraagt in totaal niet meer dan drie uren per dag. De dagen waarop
      aan het project wordt deelgenomen en de aanvang- en eindtijden, worden in overleg met de taakgestrafte vastgesteld.
      Pauzes en reistijden tellen niet mee voor de taakstrafuren.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel314
  - number: 3:14.5
    text: |-
      Voorafgaand aan de aanvang van de deelname aan het project vindt een gesprek plaats tussen de jeugdige
      taakgestrafte, de uitvoerder taakstraffen en de contactpersoon, waarbij in ieder geval wordt ingegaan op
      de huisregels van de projectplaats, de vaststelling en uitleg van de werkzaamheden of het leerproject en de
      aanvangsdatum. Bij de andere taakgestraften kan dit gesprek plaatsvinden voorafgaand aan de aanvang van de deelname
      aan een project.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel314
  - number: 3:14.6
    text: |-
      Voorafgaand aan de aanvang van de deelname aan het project wordt de beslissing van de uitvoerder taakstraffen tot
      plaatsing schriftelijk vastgelegd en voor akkoord ondertekend door de taakgestrafte. De taakgestrafte wordt een
      afschrift van de beslissing ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel314
  - number: 3:15
    text: |-
      Nadat de taakstraf is verricht, stuurt de uitvoerder taakstraffen zo spoedig mogelijk een afloopbericht aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel315
  - number: 3:16
    text: |-
      De uitvoerder taakstraffen houdt toezicht op de verrichtingen van de taakgestrafte en de omstandigheden waaronder
      deze plaatsvinden. Het toezicht omvat ook de veiligheid, de gezondheid en de arbeidsomstandigheden op de
      projectplaats en de redelijkheid van de opgedragen werkzaamheden of opgelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel316
  - number: 3:17.1
    text: |-
      De uitvoerder taakstraffen kan ambtshalve of op verzoek van het openbaar ministerie mede de volgende beslissingen
      nemen:
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel317
  - number: 3:17.1.a
    text: de beslissing om in bijzondere gevallen de projectplaats of de aard van de werkzaamheden te wijzigen;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel317
  - number: 3:17.1.b
    text: |-
      de beslissing, bedoeld in [artikel 3:19][ref1], tot het geven van een waarschuwing indien de taakstraf niet naar
      behoren wordt uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel3
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel317
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3:17.1.c
    text: |-
      de beslissing, bedoeld in [artikel 3:20][ref1], tot opschorting van de tenuitvoerlegging van de taakstraf, met
      advies aan het openbaar ministerie tot het voortijdig beëindigen van de tenuitvoerlegging van de taakstraf.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel3
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel317
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3:17.2
    text: |-
      Alvorens een beslissing wordt genomen, wordt de taakgestrafte, zo mogelijk, door de uitvoerder taakstraffen
      gehoord.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel317
  - number: 3:17.3
    text: |-
      De beslissing wordt schriftelijk vastgelegd, gedagtekend en gemotiveerd. Bij de rapportage aan het openbaar
      ministerie worden de beslissing en, indien kenbaar gemaakt, het standpunt van de taakgestrafte gevoegd. De
      uitvoerder taakstraffen rapporteert zo spoedig mogelijk aan het openbaar ministerie en Onze Minister. Een afschrift
      van de rapportage en de bijbehorende stukken wordt aan de taakgestrafte ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel317
  - number: 3:18
    text: |-
      Bijzondere gevallen als bedoeld in [artikel 3:17, eerste lid, onder a][ref1], kunnen zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel3
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel318
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3:18.a
    text: onvoldoende beschikbaarheid van werk;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel318
  - number: 3:18.b
    text: een onoplosbaar conflict op de projectplaats;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel318
  - number: 3:18.c
    text: ongeschiktheid van de taakgestrafte voor het werk; of
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel318
  - number: 3:18.d
    text: het niet aansluiten van verplichtingen bij de specifieke omstandigheden van de taakgestrafte.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel318
  - number: 3:19
    text: |-
      De uitvoerder taakstraffen geeft ten hoogste eenmaal een waarschuwing aan de taakgestrafte wegens het niet naar
      behoren verrichten van de taakstraf.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel319
  - number: 3:20.1
    text: |-
      De uitvoerder taakstraffen kan de tenuitvoerlegging van de taakstraf opschorten indien de taakgestrafte na een
      waarschuwing de taakstraf wederom niet naar behoren verricht of na een ernstige misdraging van de zijde van de
      taakgestrafte. De uitvoerder taakstraffen stelt het openbaar ministerie onverwijld van deze beslissing op de
      hoogte, met het advies de tenuitvoerlegging van de taakstraf te beëindigen. Een afschrift van het advies wordt aan
      Onze Minister verzonden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel320
  - number: 3:20.2
    text: |-
      Het openbaar ministerie neemt zo spoedig mogelijk na de ontvangst van het advies een beslissing als bedoeld in de
      [artikelen 6:3:2][ref1] of [6:3:3 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel320
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 3:21
    text: |-
      De taakgestrafte kan door de uitvoerder taakstraffen worden opgedragen zich door een door de uitvoerder
      taakstraffen aan te wijzen keuringsarts medisch te laten keuren voordat het verrichten van de taakstraf aanvangt,
      indien de werkzaamheden dit vereisen, de taakgestrafte medische klachten heeft of arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel321
  - number: 3:22.1
    text: |-
      Voorafgaand aan de plaatsing wordt overeengekomen op welke tijdstippen de taakgestrafte de taakstraf zal
      verrichten. Hierbij kan van de taakgestrafte die werkt, worden verlangd dat hij vrije dagen opneemt.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel322
  - number: 3:22.2
    text: Indien de taakgestrafte een uitkering ontvangt, stelt hij de uitkeringsinstantie op de hoogte van de taakstraf.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel322
  - number: 3:23
    text: |-
      De taakgestrafte geeft veranderingen in de woon-, onderwijs- of werksituatie of contactgegevens onmiddellijk door
      aan de uitvoerder taakstraffen.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel323
  - number: 3:24.1
    text: |-
      De taakgestrafte volgt de aanwijzingen en opdrachten op die in het kader van de tenuitvoerlegging van de taakstraf
      worden gegeven door de uitvoerder taakstraffen of, namens deze, door de contactpersoon.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel324
  - number: 3:24.2
    text: De taakgestrafte zorgt zelf voor werkkleding, tenzij door de contactpersoon anders is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel324
  - number: 3:25.1
    text: |-
      De taakgestrafte doet van ziekte of bijzondere omstandigheden die een reden kunnen zijn voor verzuim terstond
      mededeling aan de contactpersoon en de uitvoerder taakstraffen. Bij bijzondere omstandigheden wordt, behoudens
      onvoorziene omstandigheden, toestemming voor het verzuim gevraagd aan de uitvoerder taakstraffen.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel325
  - number: 3:25.2
    text: |-
      De taakgestrafte kan bij ziekte worden verplicht een door de uitvoerder taakstraffen aan te wijzen keuringsarts te
      bezoeken of in te stemmen met een bezoek van een keuringsarts.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel325
  - number: 3:25.3
    text: Verzuimde uren worden ingehaald, ook in geval van ziekte.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel325
  - number: 3:26.1
    text: |-
      Het programma, bedoeld in [artikel 77w, derde lid, van het Wetboek van Strafrecht][ref1], kan mede bestaan uit een
      of meer gedragsinterventies.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77w
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel326
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77w
  - number: 3:26.2
    text: |-
      Indien de maatregel betreffende het gedrag van de jeugdige gezamenlijk met een vrijheidsbenemende straf wordt
      opgelegd, voorziet het programma, bedoeld in [artikel 77w, derde lid, van het Wetboek van Strafrecht][ref1], in
      ieder geval in begeleiding van de jeugdige bij een verantwoorde terugkeer in de samenleving. De rechter neemt in
      zijn vonnis zodanige bepalingen op als hij voor de juiste uitvoering van die begeleiding noodzakelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77w
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel326
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77w
  - number: 3:27
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel327
  - number: 3:27.a
    text: de voorwaarden waaraan projecten of projectplaatsen dienen te voldoen;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel327
  - number: 3:27.b
    text: de uitvoering van de taakstraf en de verplichtingen van de taakgestrafte.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel327
  - number: 4:1.1
    text: |-
      Onze Minister draagt zorg voor de ondersteuning van de bevoegde ambtenaren, bedoeld in
      [artikel 3.1 van het Besluit OM-afdoening][ref1], alsmede een lichaam of een persoon als bedoeld in
      [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref2], bij hun taken met betrekking tot de betaling van
      gelden als bedoeld in [artikel 4:5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022233#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022233#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0042962#Artikel4
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0022233
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022233
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0042962
        artikel: '4'
        hoofdstuk: '4'
  - number: 4:1.2
    text: |-
      Dit hoofdstuk is niet van toepassing op geldboeten die zijn opgelegd in een strafbeschikking,
      uitgevaardigd krachtens [artikel 76 van de Algemene wet inzake rijksbelastingen][ref1] of
      [artikel 10:15 van de Algemene douanewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel10
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '10'
  - number: 4:2.1
    text: |-
      De betaling van een geldboete, een transactie, een schadevergoedingsmaatregel, een ontnemingsmaatregel, een
      ontnemingsaanwijzing, een stortingsvoorwaarde, een stortingsaanwijzing, een schikking, de geschatte waarde van niet
      in beslag genomen verbeurd verklaarde goederen of de kosten van openbaarmaking van een uitspraak geschiedt door
      storting of overschrijving van het verschuldigde bedrag op een daartoe bestemde bankrekening van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel42
  - number: 4:2.2
    text: Onze Minister bepaalt de termijn waarbinnen het verschuldigde bedrag moet zijn betaald.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel42
  - number: 4:2.3
    text: |-
      De betaling van het op grond van [artikel 6:4:2 van de wet][ref1] verhoogde bedrag geschiedt binnen dertig dagen na
      de door Onze Minister verstuurde aanmaning.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 4:3.1
    text: |-
      Degene die betaalt maakt daarbij op een door Onze Minister aangegeven wijze melding van de zaak waarop de betaling
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel43
  - number: 4:3.2
    text: |-
      Indien niet op de aangegeven wijze melding is gemaakt van de zaak waarop de betaling betrekking heeft, kan Onze
      Minister het aan hem betaalde bedrag terugstorten op de rekening waarvan het bedrag afkomstig is, of anderszins het
      bedrag terugbetalen aan de persoon die heeft betaald.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel43
  - number: 4:3.3
    text: |-
      Voordat tot een terugbetaling wordt overgegaan, wordt op grond van [artikel 6:1:13 van de wet][ref1] nagegaan
      of degene die de betaling heeft verricht nog tot betaling van een geldsom is verplicht. Indien degene meerdere
      openstaande vorderingen heeft, wordt bij de bestemming van de gelden op de openstaande vorderingen de bij
      ministeriële regeling bepaalde volgorde in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 4:4
    text: |-
      Onze Minister kan bepalen dat de betaling kan geschieden op een door Onze Minister aan te wijzen plaats of aan
      een door Onze Minister aan te wijzen persoon, dan wel door het ter plaatse overschrijven op een daartoe bestemde
      bankrekening.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel44
  - number: 4:5.1
    text: |-
      Indien krachtens de [artikelen 257b][ref1] en [257ba van de wet][ref2] een
      strafbeschikking zal worden uitgevaardigd, kan de betrokken korpschef, bedoeld in
      [artikel 3.1, tweede lid, van het Besluit OM-afdoening][ref3], of het bevoegde lichaam of de bevoegde persoon,
      bedoeld in [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref4], bepalen dat betaling van de geldboete
      eveneens kan geschieden op een plaats die is aangewezen door de bevoegde ambtenaar of het bevoegde lichaam of door
      het ter plaatse overschrijven op een daartoe bestemde bankrekening. Betaling geschiedt in dat geval binnen een dag
      na die waarop het strafbare feit is ontdekt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel257ba
      [ref3]: https://wetten.overheid.nl/BWBR0022233#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0022233#Artikel4
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257b
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 257ba
      - id: ref3
        bwb_id: BWBR0022233
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0022233
        artikel: '4'
  - number: 4:5.2
    text: 'Als plaats van betaling, bedoeld in het eerste lid, wordt slechts aangewezen:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel45
  - number: 4:5.2.a
    text: |-
      bij een strafbeschikking krachtens [artikel 257b van de wet][ref1]: een politiebureau, een gebouw van de organisatie
      van de bevoegde ambtenaar, bedoeld in [artikel 3.1, eerste lid, onderdeel b, van het Besluit OM-afdoening][ref2],
      of een douanekantoor of, indien de bevoegde ambtenaar een militair van de Koninklijke marechaussee is, een
      brigadebureau of de betrokken doorlaatpost, dan wel een tijdelijke plaats van betaling, ingesteld door of vanwege
      de betrokken korpschef, bedoeld in artikel 3.1, tweede lid, van het Besluit OM-afdoening.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257b
      [ref2]: https://wetten.overheid.nl/BWBR0022233#Artikel3
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257b
      - id: ref2
        bwb_id: BWBR0022233
        artikel: '3'
  - number: 4:5.2.b
    text: |-
      bij een strafbeschikking krachtens [artikel 257ba van de wet][ref1]: een gebouw van de organisatie van de bevoegde
      ambtenaar, bedoeld in [artikel 4.1, onderdeel e, van het Besluit OM-afdoening][ref2], dan wel een tijdelijke plaats
      van betaling, ingesteld door of vanwege een lichaam of een persoon, bedoeld in artikel 4.1, onderdeel b, van het
      Besluit OM-afdoening.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257ba
      [ref2]: https://wetten.overheid.nl/BWBR0022233#Artikel4
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257ba
      - id: ref2
        bwb_id: BWBR0022233
        artikel: '4'
  - number: 4:5.3
    text: |-
      Door of vanwege de korpschef, bedoeld in [artikel 3.1, tweede lid, van het Besluit OM-afdoening][ref1], dan wel door
      of vanwege het lichaam of de persoon, bedoeld in [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref2],
      worden ambtenaren aangewezen die zijn belast met de inning van gelden die overeenkomstig het eerste lid worden
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0022233#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022233#Artikel4
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0022233
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022233
        artikel: '4'
  - number: 4:5.4
    text: |-
      De met de inning belaste ambtenaar wordt in het bezit gesteld van een lijst met de feiten waarvoor de
      strafbeschikking kan worden uitgevaardigd en de voor deze feiten vastgestelde tarieven. Desgevraagd verleent hij
      degene die betaalt inzage in deze lijst.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel45
  - number: 4:6
    text: |-
      Indien de bevoegdheid van [artikel 257b van de wet][ref1] wordt uitgeoefend gedurende de periode dat bijstand
      wordt verleend op grond van de [artikelen 57][ref2], [58][ref3] of [59 van de Politiewet 2012][ref4], geschiedt de
      betaling, bedoeld in [artikel 4:5][ref5], op de wijze van de politie, en geschieden de afrekening, verantwoording
      en controle van de ontvangen gelden door de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257b
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0042962#Artikel4
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257b
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '57'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '58'
      - id: ref4
        bwb_id: BWBR0031788
        artikel: '59'
      - id: ref5
        bwb_id: BWBR0042962
        artikel: '4'
        hoofdstuk: '4'
  - number: 4:7.1
    text: |-
      In de gevallen, bedoeld in de [artikelen 4:4][ref1] en [4:5][ref2], wordt onverwijld een gedagtekend
      betalingsbewijs verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0042962#Artikel4
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0042962
        artikel: '4'
        hoofdstuk: '4'
  - number: 4:7.2
    text: |-
      In de gevallen, bedoeld in het eerste lid, wordt van de inning aantekening gehouden op de wijze zoals door Onze
      Minister is aangegeven.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel47
  - number: 4:7.3
    text: |-
      De aantekeningen worden, uiterlijk een jaar nadat zij zijn opgemaakt, desverlangd getoond aan de personen die met
      het toezicht op de inning zijn belast.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel47
  - number: 4:8
    text: |-
      Onze Minister draagt zorg voor de opening van een of meer afzonderlijke bankrekeningen welke bestemd zijn voor de
      betaling van de in [artikel 4:2][ref1] bedoelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel4
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: '4'
        hoofdstuk: '4'
  - number: 4:9.1
    text: |-
      Het formulier van het in [artikel 4:7, eerste lid][ref1], bedoelde betalingsbewijs, dan wel de eisen waaraan het
      betalingsbewijs moet voldoen, worden vastgesteld bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel4
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: '4'
        hoofdstuk: '4'
  - number: 4:9.2
    text: |-
      De ontvangen gelden worden op de door Onze Minister aangegeven wijze overgemaakt op de daartoe bestemde
      bankrekeningen.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel49
  - number: 4:9.3
    text: |-
      Bij ministeriële regeling worden nadere voorschriften vastgesteld omtrent de verstrekking en het beheer van de
      betalingsbewijzen, de afrekening en de verantwoording van de ontvangen gelden, alsmede de in verband daarmee te
      voeren administratie.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel49
  - number: 4:10.1
    text: |-
      De korpschef doet op de door Onze Minister te bepalen wijze jaarlijks opgave van de uitvoering van de in
      [artikel 4:9, derde lid][ref1], bedoelde voorschriften en van de met het oog op de toepassing van dit besluit
      verrichte accountantscontrole.


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel4
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel410
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: '4'
        hoofdstuk: '4'
  - number: 4:10.2
    text: |-
      Voor de Koninklijke marechaussee en de buitengewoon opsporingsambtenaren wordt de
      in het eerste lid bedoelde opgave gedaan door de betrokken korpschefs, bedoeld in
      [artikel 3.1, tweede lid, van het Besluit OM-afdoening][ref1] of het betrokken lichaam of de betrokken persoon,
      bedoeld in [artikel 4.1, onderdeel b, van het Besluit OM-afdoening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022233#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022233#Artikel4
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel410
    references:
      - id: ref1
        bwb_id: BWBR0022233
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022233
        artikel: '4'
  - number: 4:10.3
    text: |-
      De in het eerste en tweede lid bedoelde opgave kan achterwege blijven voor die gevallen waarin de gelden ter
      plaatse zijn overgemaakt op de daartoe bestemde bankrekening van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel410
  - number: 4:11
    text: |-
      Degene aan wie een geldboete wordt opgelegd, is de bij ministeriële regeling bepaalde administratiekosten
      verschuldigd. Op de betaling van de administratiekosten zijn de artikelen van dit besluit betreffende de betaling
      van de geldboete en de verantwoording van de gelden van overeenkomstige toepassing. De administratiekosten worden
      samen met de geldboete in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel411
  - number: 4:12.1
    text: |-
      De kosten van verhaal van een opgelegde geldboete, ontnemingsmaatregel of schadevergoedingsmaatregel worden op
      gelijke voet als de geldboete of de maatregel verhaald op degene aan wie de geldboete of maatregel is opgelegd.
      Onder de kosten van verhaal zijn begrepen de invorderingskosten.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel412
  - number: 4:12.2
    text: |-
      De kosten van verhaal, voor zover zij niet betreffen de invorderingskosten, worden berekend overeenkomstig de bij
      het [Besluit tarieven ambtshandelingen gerechtsdeurwaarders][ref1] vastgestelde tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0012638
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel412
    references:
      - id: ref1
        bwb_id: BWBR0012638
  - number: 4:12.3
    text: De omvang van de invorderingskosten wordt bepaald bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel412
  - number: 4:13
    text: |-
      De uitlevering van niet in beslag genomen verbeurd verklaarde voorwerpen, geschiedt op de door Onze Minister
      aangewezen plaats.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel413
  - number: 4:14.1
    text: |-
      Overeenkomstig [artikel 6:4:2, zevende lid, van de wet][ref1] keert Onze Minister het resterende
      bedrag van de schadevergoedingsmaatregel uit aan het slachtoffer of de personen genoemd in
      [artikel 51f, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel51f
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 51f
  - number: 4:14.2
    text: |-
      Ten aanzien van het uit te keren bedrag geldt een maximum van € 5.000. Dit maximum geldt niet in de gevallen
      waarin het bedrag wordt uitgekeerd na een veroordeling ter zake van een van de misdrijven als omschreven
      in de [artikelen 141][ref1], [239 tot en met 254ba][ref2], [273f][ref3], [287 tot en met 291][ref4],
      [300 tot en met 303][ref5], [312][ref6] en [317 van het Wetboek van Strafrecht][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel239
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel273f
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel287
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel300
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel312
      [ref7]: https://wetten.overheid.nl/BWBR0001854#Artikel317
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '239'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 273f
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '287'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '300'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: '312'
      - id: ref7
        bwb_id: BWBR0001854
        artikel: '317'
  - number: 4:15.1
    text: 'Bij ministeriële regeling worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel415
  - number: 4:15.1.a
    text: het verlenen van uitstel van betaling en het toestaan van betaling in termijnen door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel415
  - number: 4:15.1.b
    text: de uitkering door de staat van het bedrag van de schadevergoedingsmaatregel.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel415
  - number: 4:15.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de uitwinning van voorwerpen die op grond van
      [artikel 94a van de wet][ref1] in beslag zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel94a
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel415
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 94a
  - number: 5:1
    text: |-
      Ten behoeve van de beoordeling of een gratieverzoek opschortende werking heeft als bedoeld in
      [artikel 6:7:2 van de wet][ref1], wordt als aanvangsdatum van de tenuitvoerlegging van een straf of maatregel
      aangemerkt de handeling van de bevoegde instantie zoals deze in de [artikelen 5:2 tot en met 5:5][ref2] nader wordt
      aangeduid, gericht op de tenuitvoerlegging van de straf of maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0042962#Artikel5
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0042962
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:2
    text: 'Met betrekking tot de tenuitvoerlegging van hoofdstraffen wordt onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel52
  - number: 5:2.a
    text: 'de vrijheidsstraf, waarvan de tenuitvoerlegging aanvangt:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel52
  - number: 5:2.a.1°
    text: |-
      op de datum van de dagtekening van de aan de veroordeelde gerichte mededeling met de datum waarop hij zich moet
      melden bij de inrichting;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel52
  - number: 5:2.a.2°
    text: |-
      op de eenendertigste dag na verzending van de aan de onder 1° bedoelde mededeling voorafgaande vooraankondiging,
      indien de veroordeelde daarop niet reageert;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel52
  - number: 5:2.a.3°
    text: |-
      op de datum van het uitvaardigen van een arrestatiebevel jegens de veroordeelde ten aanzien van wie Onze Minister
      niet verzoekt zich op een bepaalde datum te melden bij de inrichting; of
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel52
  - number: 5:2.a.4°
    text: |-
      op de datum dat de veroordeelde zonder vaste woon- of verblijfplaats wordt gesignaleerd voor aanhouding voor de
      tenuitvoerlegging van een openstaande vrijheidsstraf.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel52
  - number: 5:2.b
    text: |-
      de taakstraf, welke aanvangt op de datum van de dagtekening van de aan de veroordeelde gerichte oproep voor het
      eerste gesprek bij de reclassering.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel52
  - number: 5:2.c
    text: |-
      de geldboete, welke aanvangt op de datum van de dagtekening van de mededeling van Onze Minister over de dag of
      dagen waarop de betaling uiterlijk moet geschieden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel52
  - number: 5:3
    text: 'Met betrekking tot de tenuitvoerlegging van bijkomende straffen wordt onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel53
  - number: 5:3.a
    text: 'de ontzetting van bepaalde rechten, waarvan de tenuitvoerlegging aanvangt:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel53
  - number: 5:3.a.1°
    text: |-
      indien het de ontzegging van de rijbevoegdheid betreft, op de datum waarop aan de veroordeelde in persoon, volgens
      de [artikelen 36d][ref1] en [36e van de wet][ref2], een schrijven is uitgereikt; of


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel36d
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel36e
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 36d
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 36e
  - number: 5:3.a.2°
    text: |-
      indien het de overige ontzetting van bepaalde rechten betreft, op de datum van het onherroepelijk worden van het
      vonnis of arrest.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel53
  - number: 5:3.b
    text: |-
      de verbeurdverklaring, waarvan de tenuitvoerlegging aanvangt op de datum van het onherroepelijk worden van het
      vonnis of arrest.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel53
  - number: 5:3.c
    text: |-
      de openbaarmaking van de rechterlijke uitspraak, waarvan de tenuitvoerlegging aanvangt op de datum van het
      onherroepelijk worden van het vonnis of arrest.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel53
  - number: 5:4
    text: |-
      Met betrekking tot straffen, krachtens een rechterlijke beslissing in een vreemde staat opgelegd en in Nederland
      ten uitvoer te leggen, zoals bedoeld in [artikel 6:7:1, tweede lid, van de wet][ref1], wordt onderscheiden:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 5:4.a
    text: |-
      de tenuitvoerlegging van een gevangenisstraf die door het Internationaal Strafhof is opgelegd wegens een misdrijf
      gericht tegen de rechtspleging van het Internationaal Strafhof en waarvan de tenuitvoerlegging in Nederland
      geschiedt overeenkomstig [artikel 67][ref1] of [68 van de Uitvoeringswet Internationaal Strafhof][ref2], welke
      aanvangt op het moment van overdracht van de veroordeelde aan de Nederlandse autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel68
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '68'
  - number: 5:4.b
    text: |-
      de tenuitvoerlegging van [artikel 43 van de Wet overdracht tenuitvoerlegging strafvonnissen][ref1], welke aanvangt
      op het moment van aankomst van de veroordeelde op Nederlands grondgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel43
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '43'
  - number: 5:4.c
    text: |-
      de tenuitvoerlegging naar aanleiding van een ongegrondverklaring van een bezwaarschrift ingediend krachtens
      [artikel 35 van de Wet overdracht tenuitvoerlegging strafvonnissen][ref1], welke aanvangt op de datum van
      dagtekening van de mededeling van Onze Minister over de dag of dagen waarop de betaling uiterlijk moet geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel35
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '35'
  - number: 5:5
    text: 'Met betrekking tot de tenuitvoerlegging van voor gratie vatbare maatregelen wordt onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel55
  - number: 5:5.a
    text: 'terbeschikkingstelling met verpleging van overheidswege, waarvan de tenuitvoerlegging aanvangt:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel55
  - number: 5:5.a.1°
    text: |-
      op de datum van dagtekening van de last tot tenuitvoerlegging van het veroordelend vonnis of arrest, bedoeld in
      [artikel 6:1:6 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 5:5.a.2°
    text: |-
      op de datum van afgifte van het bevel tot gevangenneming, bedoeld in [artikel 65 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel65
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '65'
  - number: 5:5.b
    text: |-
      plaatsing in een inrichting voor stelselmatige daders, waarvan de tenuitvoerlegging aanvangt op de datum van het
      uitvaardigen van een last tot tenuitvoerlegging van een bevel tot vrijheidsbeneming of veroordelend vonnis of
      arrest, bedoeld in [artikel 6:1:6 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 5:5.c
    text: |-
      onttrekking aan het verkeer, waarvan de tenuitvoerlegging aanvangt op de datum van het onherroepelijk worden van
      het vonnis of arrest;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel55
  - number: 5:5.d
    text: |-
      ontneming van het wederrechtelijk verkregen voordeel, waarvan de tenuitvoerlegging aanvangt op de datum van de
      dagtekening van de eerste mededeling van Onze Minister over de dag of dagen waarop de betaling uiterlijk moet
      geschieden.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel55
