  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Rechtsbescherming van 16 oktober 2019, Directie Wetgeving en Juridische
    Zaken, nr. 2725937;

    Gelet op de artikelen 493, zesde lid, 6:1:15, 6:2:9, 6:2:14, 6:2:21, 6:3:6, 6:3:13, 6:4:8, 6:4:19, 6:5:3, 6:6:18 en
    6:7:8 van het Wetboek van Strafvordering en artikel 74, vijfde lid, van het Wetboek van Strafrecht;

    De Afdeling advisering van de Raad van State gehoord (advies van 6 december 2019, nr. W16.19.0327/II);

    Gezien het nader rapport van Onze Minister voor Rechtsbescherming van 13 december 2019, Directie Wetgeving en
    Juridische Zaken, nr. 2770068;

    Hebben goedgevonden en verstaan:
