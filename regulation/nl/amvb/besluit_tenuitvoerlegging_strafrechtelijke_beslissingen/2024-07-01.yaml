articles:
  - number: 1:1
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *contactpersoon:* degene die handelt
      namens de instelling of organisatie waar een taakstraf wordt verricht;
        - *gedragsbeïnvloedende maatregel:* de maatregel, bedoeld in [artikel 77w van het Wetboek van Strafrecht][ref1];
        - *gedragsinterventie:* een gestructureerd geheel van methodische handelingen gericht op de beïnvloeding van gedrag
      of omstandigheden van de jeugdige, met als doel het voorkomen van recidive;
        - *inrichting:* een inrichting als bedoeld in [artikel 1 van de Penitentiaire beginselenwet][ref2] of
      [artikel 1 van de Beginselenwet justitiële jeugdinrichtingen][ref3];
        - *instelling:* een instelling als bedoeld in
      [artikel 1 van de Beginselenwet verpleging ter beschikking gestelden][ref4];
        - *jeugdige:* een persoon ten aanzien van wie recht is gedaan overeenkomstig de
      [artikelen 77g tot en met 77gg van het Wetboek van Strafrecht][ref5];
        - *jeugdige taakgestrafte:* een taakgestrafte ten aanzien van wie recht is gedaan overeenkomstig de
      [artikelen 77g tot en met 77gg van het Wetboek van Strafrecht][ref6];
        - *jeugdreclassering:* een gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref7], bij de
      uitvoering van jeugdreclassering;
        - *ontnemingsaanwijzing:* de aanwijzing, bedoeld in [artikel 257a, derde lid, onder c, van de wet][ref8];
        - *ontnemingsmaatregel:* de maatregel, bedoeld in [artikel 36e van het Wetboek van Strafrecht][ref9];
        - *Onze Minister:* Onze Minister voor Rechtsbescherming;
        - *projectplaats:* de plaats bij een instelling of organisatie waar de taakstraf wordt uitgevoerd;
        - *raad voor de kinderbescherming:* de raad, bedoeld in
      [artikel 238, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref10];
        - *reclassering:* een reclasseringsinstelling als bedoeld in
      [artikel 1, onder b, van de Reclasseringsregeling 1995][ref11];
        - *schadevergoedingsmaatregel:* de maatregel, bedoeld in de [artikelen 36f][ref12]
      en [77h, vierde lid, onder e, van het Wetboek van Strafrecht][ref13] en
      [artikel 257a, tweede lid, onder d, van de wet][ref14];
        - *schikking:* een schriftelijke schikking als bedoeld in [artikel 511c van de wet][ref15];
        - *scholings- en trainingsprogramma:* een programma als bedoeld in
      [artikel 3 van de Beginselenwet justitiële jeugdinrichtingen][ref16];
        - *stortingsaanwijzing:* de aanwijzing, bedoeld in [artikel 257a, derde lid, onder d, van de wet][ref17];
        - *stortingsvoorwaarde:* de voorwaarde, bedoeld in
      [artikel 14c, tweede lid, onder 3° of 4° van het Wetboek van Strafrecht][ref18],
      [artikel 13, derde lid, van de Gratiewet][ref19] of [artikel 80, derde lid, van de wet][ref20];
        - *taakgestrafte:* degene aan wie een taakstraf is opgelegd;
        - *transactie:* een of meer van de gestelde voorwaarden, bedoeld in
      [artikel 74 van het Wetboek van Strafrecht][ref21];
        - *uitvoerder taakstraffen:* de medewerker van de reclassering of de raad voor de kinderbescherming die is belast
      met begeleiding en toezicht in het kader van de tenuitvoerlegging van een taakstraf;
        - *voorwaardelijke veroordeling:* veroordeling waarbij de straf of maatregel geheel of gedeeltelijk niet zal worden
      ten uitvoer gelegd, tenzij de rechter later anders beveelt;
        - *vrijheidsstraf:* gevangenisstraf, hechtenis, militaire detentie en jeugddetentie, alsmede de tenuitvoerlegging
      van een voorwaardelijke vrijheidsstraf of van het voorwaardelijke deel van een vrijheidsstraf;
        - *wet:* het [Wetboek van Strafvordering][ref22].


