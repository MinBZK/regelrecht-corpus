  - number: 1:2.1
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de volgorde waarin straffen en maatregelen ten uitvoer
      worden gelegd.
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel12
  - number: 1:2.2
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel12
  - number: 1:2.2.a
    text: een persoonsgerichte invulling van de tenuitvoerlegging;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel12
  - number: 1:2.2.b
    text: het geven van een last tot aanhouding;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel12
  - number: 1:2.2.c
    text: |-
      de vorm van het advies van het openbaar ministerie aan Onze Minister over tijdens de tenuitvoerlegging te nemen
      besluiten;
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel12
  - number: 1:2.2.d
    text: |-
      de bevoegdheid van Onze Minister, bedoeld in [artikel 6:1:11 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0042962/2024-07-01#Artikel12
