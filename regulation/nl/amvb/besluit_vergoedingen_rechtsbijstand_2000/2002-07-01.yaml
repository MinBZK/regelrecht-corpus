preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Justitie van 23 september 1999, nr. 78770/99/6;

    Gelet op de artikelen 37, 39 en 41 van de Wet op de rechtsbijstand;

    De Raad van State gehoord (advies van 30 november 1999, nr. WO3.99.0493/I);

    Gezien het nader rapport van de Staatssecretaris van Justitie van 16 december 1999, nr. 5000238/99/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet op de rechtsbijstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006368
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006368
  - number: 1.b
    text: |-
      procedure: een zaak die aanhangig is gemaakt bij een bij wet ingesteld tuchtrechtelijk college alsmede een zaak op
      het terrein van het burgerlijk of bestuursrecht die aanhangig is gemaakt bij: - de burgerlijke rechter,
        - de administratieve rechter,
        - het bestuursorgaan dat in administratief beroep oordeelt,
        - het bestuursorgaan dat op grond van de [Algemene wet bestuursrecht][ref1] oordeelt over een bezwaar,
        - de regionaal directeur voor de arbeidsvoorziening in het kader van het geven van een oordeel over een
      ontslagvergunning op grond van [artikel 6 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2],
        - de huurcommissie die oordeelt in het kader van de [Huurprijzenwet woonruimte][ref3],
        - de instantie die oordeelt over een geschil dat is onderworpen aan arbitrage of bindend advies,
        - de instantie die oordeelt in een wettelijk geregelde klachtprocedure,
        - de Minister van Justitie in het kader van het inbrengen van een zienswijze tegen het voornemen om een
      beslissing te nemen met betrekking tot een verblijfsvergunning, bedoeld in de [artikelen 39][ref4] en
      [41 van de Vreemdelingenwet 2000][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0002014#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003221
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel39
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel41
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0002014
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0003221
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '39'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: '41'
  - number: 1.c
    text: 'advieszaak: een zaak op het terrein van het tuchtrecht of het burgerlijk of bestuursrecht die geen procedure is;'
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel1
  - number: 1.d
    text: |-
      strafzaak: een strafzaak jegens een verdachte als bedoeld in [artikel 27 van het Wetboek van Strafvordering][ref1]
      en een andere zaak die in de bijlage als strafrechtelijke zaak is aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '27'
  - number: 1.e
    text: |-
      piketzaak: een zaak waarin een rechtsbijstandverlener rechtsbijstand heeft verleend in het kader van een door
      de raad getroffen regeling voor het beurtelings verlenen van rechtsbijstand in de gevallen, bedoeld in het
      [eerste lid van artikel 23][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel23
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '23'
        hoofdstuk: II
        paragraaf: par._3
  - number: '2.1'
    text: |-
      Rechtsbijstandverleners ontvangen overeenkomstig de bepalingen van dit besluit een vergoeding voor de verlening van
      rechtsbijstand op basis van een toevoeging als bedoeld in [artikel 37 van de wet][ref1] alsmede voor de verlening
      van rechtsbijstand in een piketzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '37'
  - number: '2.2'
    text: 'De vergoeding, bedoeld in het eerste lid, omvat:'
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel2
  - number: 2.2.a
    text: |-
      de overeenkomstig dit besluit vastgestelde vergoeding voor het verrichten van juridische werkzaamheden voor de
      zaak;
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel2
  - number: 2.2.b
    text: |-
      de overeenkomstig dit besluit vastgestelde vergoeding voor bepaalde kosten en het tijdverlet in verband met reizen
      voor de desbetreffende zaak, en
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel2
  - number: 2.2.c
    text: de omzetbelasting die is verschuldigd over de vergoedingen, bedoeld onder a en b.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel2
  - number: '2.3'
    text: |-
      Ten behoeve van de berekening van de vergoeding worden de krachtens dit besluit toegekende punten vermenigvuldigd
      met het basisbedrag, genoemd in het [eerste lid van artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel3
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '3'
        hoofdstuk: I
  - number: '3.1'
    text: Het basisbedrag bedraagt f 154,–
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel3
  - number: '3.2'
    text: |-
      Het basisbedrag en de vergoeding, bedoeld in [artikel 27][ref1], worden jaarlijks door Onze Minister
      aangepast overeenkomstig de norm die Onze Minister heeft vastgesteld voor de financiële ruimte voor de
      arbeidsvoorwaardenontwikkeling voor de stichtingen rechtsbijstand. Het basisbedrag wordt afgerond op het
      naastliggende veelvoud van f 1,–.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel27
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '27'
        hoofdstuk: III
  - number: '3.3'
    text: |-
      De aanpassing van het basisbedrag en de vergoeding, bedoeld in [artikel 27][ref1], vindt plaats met ingang van de
      eerste dag van de maand volgend op de datum waarop de in het tweede lid bedoelde norm is vastgesteld. Indien de
      norm wordt vastgesteld op een eerder tijdstip dan de datum waarop zij in werking treedt, worden het basisbedrag en
      de vergoeding aangepast per laatstbedoelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel27
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '27'
        hoofdstuk: III
  - number: '3.4'
    text: |-
      De vaststelling van de vergoeding, bedoeld in het [eerste lid van artikel 2][ref1], vindt plaats met toepassing van
      het basisbedrag en de vergoedingen, bedoeld in de [artikelen 25][ref2] en [27][ref3], die golden ten tijde van de
      afgifte van de toevoeging op grond waarvan de rechtsbijstand is verleend of het tijdstip waarop rechtsbijstand is
      verleend in een piketzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0011018#Artikel27
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '25'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0011018
        artikel: '27'
        hoofdstuk: III
  - number: '4.1'
    text: |-
      De rechtsbijstandverlener brengt aan de rechtzoekende de eigen bijdrage die deze overeenkomstig
      [artikel 35 van de wet][ref1] verschuldigd is, in rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '35'
  - number: '4.2'
    text: |-
      De rechtsbijstandverlener mag voorts aan de rechtzoekende geen andere kosten in rekening brengen dan die ter zake
      van:
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel4
  - number: 4.2.a
    text: griffierechten;
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel4
  - number: 4.2.b
    text: getuigen en deskundigen;
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel4
  - number: 4.2.c
    text: uittreksels uit de openbare registers;
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel4
  - number: 4.2.d
    text: telegrammen, internationale telex, internationale telefax en internationale telefoongesprekken;
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel4
  - number: 4.2.e
    text: |-
      verschotten van de procureur in het kader van de werkzaamheden, bedoeld in [artikel 10][ref1], voorzover die
      verschotten kunnen worden aangemerkt als kosten in de zin van de onderdelen a tot en met d;


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel10
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '10'
        hoofdstuk: II
        paragraaf: par._1
  - number: 4.2.f
    text: rolverrichtingen in zaken die door de kantonrechter van de rechtbank worden behandeld.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel4
  - number: '4.3'
    text: De kosten, bedoeld in het tweede lid, worden steeds aan de rechtzoekende gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel4
  - number: '5.1'
    text: |-
      Aan een procedure wordt het aantal punten toegekend dat in de bijlage voor het desbetreffende rechtsterrein of
      soort zaak is bepaald.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel5
  - number: '5.2'
    text: |-
      Indien de procedure is beëindigd voordat de in [artikel 1][ref1] bedoelde instantie uitspraak of tussenuitspraak
      heeft gedaan of een beslissing heeft genomen dan wel voordat de rechtsbijstandverlener een zitting als bedoeld in
      het [eerste lid van artikel 7][ref2] heeft bijgewoond, zijn de [artikelen 12][ref3] en [13, tweede lid][ref4], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011018#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0011018#Artikel13
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '7'
        hoofdstuk: II
        paragraaf: par._1
      - id: ref3
        bwb_id: BWBR0011018
        artikel: '12'
        hoofdstuk: II
        paragraaf: par._1
      - id: ref4
        bwb_id: BWBR0011018
        artikel: '13'
        hoofdstuk: II
        paragraaf: par._1
  - number: '5.3'
    text: |-
      Indien ten tijde van de beëindiging van de procedure uitsluitend een bestuursrechtelijke uitspraak over de
      proceskosten is gedaan, zijn de [artikelen 12][ref1] en [13, tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel13
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '12'
        hoofdstuk: II
        paragraaf: par._1
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '13'
        hoofdstuk: II
        paragraaf: par._1
  - number: '5.4'
    text: |-
      In de gevallen, bedoeld in het tweede en derde lid, zijn de overige bepalingen van deze paragraaf niet van
      toepassing met uitzondering van [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel10
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '10'
        hoofdstuk: II
        paragraaf: par._1
  - number: '6'
    text: |-
      In afwijking van het [eerste lid van artikel 5][ref1], worden aan een procedure die in cassatie is gevoerd vijftien
      punten toegekend. [Artikel 8][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel8
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '5'
        hoofdstuk: II
        paragraaf: par._1
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '8'
        hoofdstuk: II
        paragraaf: par._1
  - number: '7.1'
    text: |-
      Als zitting wordt voor de toepassing van dit artikel aangemerkt elk optreden van een instantie bij welke de
      procedure wordt gevoerd die dient ter behandeling van de zaak en waarbij de rechtsbijstandverlener aanwezig kan
      zijn, met uitzondering van rolzittingen.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel7
  - number: '7.2'
    text: |-
      Indien de rechtsbijstandverlener meer dan één zitting heeft bijgewoond, wordt voor de tweede en elke daaropvolgende
      bijgewoonde zitting het aantal toe te kennen punten telkens met twee verhoogd.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel7
  - number: '8'
    text: |-
      In een procedure betreffende echtscheiding als bedoeld in de bijlage, waarin geen tegenspraak is gevoerd, wordt het
      aantal toe te kennen punten met drie verlaagd.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel8
  - number: '9'
    text: |-
      Indien in een procedure rechtsbijstand is verleend door achtereenvolgens twee of meer rechtsbijstandverleners
      die niet werkzaam zijn in hetzelfde samenwerkingsverband, wordt het aantal toe te kennen punten één maal met twee
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel9
  - number: '10'
    text: |-
      In het geval een rechtsbijstandverlener in een procedure, die wordt gevoerd in een ander arrondissement dan het
      arrondissement der rechtbank, bij welke de rechtsbijstandverlener is ingeschreven, wordt bijgestaan door een
      wettelijk verplichte procureur wordt het aantal toe te kennen punten met twee verhoogd.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel10
  - number: '11.1'
    text: |-
      Als samenhangende procedures worden beschouwd zaken die gevoegd, gelijktijdig, aansluitend of nagenoeg
      aansluitend ter zitting als bedoeld in het [eerste lid van artikel 7][ref1], zijn behandeld, en waarvoor één
      rechtsbijstandverlener is toegevoegd of meer dan één rechtsbijstandverlener mits zij deel uitmaken van hetzelfde
      samenwerkingsverband en voor zover de zaken naar hun aard verknocht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel7
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '7'
        hoofdstuk: II
        paragraaf: par._1
  - number: '11.2'
    text: |-
      In samenhangende procedures waarin twee of meer rechtzoekenden een of meer procedures voeren, wordt in afwijking
      van het [eerste lid van artikel 5][ref1], aan de procedures gezamenlijk het aantal punten toegekend dat wordt
      verkregen door het aantal punten dat in de bijlage is bepaald voor het desbetreffende rechtsterrein of soort
      zaak met het hoogste aantal punten te vermenigvuldigen met de navolgende percentages, al naar gelang het aantal
      toevoegingen: '2–3: 150%; 4–6: 200%; 7–10: 300%; 11–15: 400%;16–21: 500%; elke volgende 10: 100% extra.'


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel5
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '5'
        hoofdstuk: II
        paragraaf: par._1
  - number: '11.3'
    text: |-
      In samenhangende procedures waarbij één rechtzoekende meer dan één procedure voert, wordt in afwijking van het
      [eerste lid van artikel 5][ref1], aan de procedures gezamenlijk het aantal punten toegekend dat wordt verkregen
      door het aantal punten dat in de bijlage is bepaald voor het desbetreffende rechtsterrein of soort zaak met het
      hoogste aantal punten te verhogen met 50% voor elke procedure, met uitzondering van de eerste.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel5
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '5'
        hoofdstuk: II
        paragraaf: par._1
  - number: '11.4'
    text: |-
      Indien samenhangende procedures gevoegd, gelijktijdig, aansluitend of nagenoeg aansluitend op een zitting als
      bedoeld in het [eerste lid van artikel 7][ref1] zijn behandeld, wordt deze zitting voor de toekenning van de
      punten, bedoeld in het [tweede lid van artikel 7][ref2], aangemerkt als één zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel7
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '7'
        hoofdstuk: II
        paragraaf: par._1
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '7'
        hoofdstuk: II
        paragraaf: par._1
  - number: '11.5'
    text: |-
      Op samenhangende procedures die in cassatie zijn gevoerd zijn het tweede, derde en vierde lid van overeenkomstige
      toepassing, met dien verstande dat de berekening, bedoeld in het tweede en derde lid, wordt toegepast op vijftien
      punten.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel11
  - number: '12.1'
    text: Aan een advieszaak waarin minder dan zes uur rechtsbijstand wordt verleend, worden vier punten toegekend.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel12
  - number: '12.2'
    text: Aan een advieszaak waarin zes uur of meer rechtsbijstand wordt verleend, worden acht punten toegekend.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel12
  - number: '12.3'
    text: |-
      Op de advieszaak, bedoeld in het tweede lid, is [artikel 9][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel9
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '9'
        hoofdstuk: II
        paragraaf: par._1
  - number: '13.1'
    text: |-
      Indien in een procedure de tijdsbesteding aan de verlening van rechtsbijstand uitgaat boven het aantal uren dat
      gelijk is aan drie maal het aantal punten dat in de bijlage voor het desbetreffende rechtsterrein of soort zaak of
      op grond van [artikel 6][ref1] is bepaald, wordt voor elk uur waarin boven voornoemde grens rechtsbijstand wordt
      verleend, één punt toegekend mits het bureau de begroting van de tijdsbesteding voor de naar verwachting nog te
      verrichten werkzaamheden, bedoeld in het [eerste lid van artikel 31][ref2], heeft goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel31
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '6'
        hoofdstuk: II
        paragraaf: par._1
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '31'
        hoofdstuk: IV
        paragraaf: par._1
  - number: '13.2'
    text: |-
      Indien in een advieszaak de tijdsbesteding aan de verlening van rechtsbijstand uitgaat boven de 24 uur, wordt
      voor elk uur waarin boven voornoemde grens rechtsbijstand wordt verleend, één punt toegekend mits het bureau
      de begroting van de tijdsbesteding voor de naar verwachting nog te verrichten werkzaamheden, bedoeld in het
      [eerste lid van artikel 31][ref1], heeft goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel31
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '31'
        hoofdstuk: IV
        paragraaf: par._1
  - number: '13.3'
    text: |-
      Indien in samenhangende procedures de tijdsbesteding aan de verlening van rechtsbijstand
      uitgaat boven het aantal uren dat gelijk is aan drie maal het aantal punten dat op grond van het
      [tweede, derde en vijfde lid van artikel 11][ref1] wordt toegekend wordt, voor elk uur waarin boven voornoemde
      grens rechtsbijstand wordt verleend, één punt toegekend, mits het bureau de begroting van de tijdsbesteding voor
      de naar verwachting nog te verrichten werkzaamheden, bedoeld in het [eerste lid van artikel 31][ref2], heeft
      goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel31
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '11'
        hoofdstuk: II
        paragraaf: par._1
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '31'
        hoofdstuk: IV
        paragraaf: par._1
  - number: '14'
    text: |-
      Aan een strafzaak wordt het aantal punten toegekend dat in de bijlage voor het desbetreffende rechtsterrein of
      soort zaak is bepaald.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel14
  - number: '15.1'
    text: |-
      In afwijking van [artikel 14][ref1] worden aan een strafzaak, die bij de Hoge Raad aanhangig is gemaakt en die in
      eerste aanleg door de meervoudige kamer is behandeld, tien punten toegekend. Aan andere strafzaken die bij de Hoge
      Raad aanhangig zijn gemaakt, worden, in afwijking van [artikel 14][ref2], zes punten toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel14
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '14'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '14'
        hoofdstuk: II
        paragraaf: par._2
  - number: '15.2'
    text: |-
      Onder andere strafzaken als bedoeld in het eerste lid, zijn begrepen de strafzaken waarin in eerste aanleg een
      beschikking is gegeven, alsmede de strafzaken betreffende herziening.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel15
  - number: '15.3'
    text: |-
      Indien de rechtsbijstandverlener in een strafzaak als bedoeld in het eerste en tweede lid, geen middelen heeft
      ingediend, wordt het aantal toe te kennen punten met 50% verminderd.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel15
  - number: '15.4'
    text: |-
      [Artikel 19][ref1] is niet van toepassing op strafzaken als bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel19
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '19'
        hoofdstuk: II
        paragraaf: par._2
  - number: '16'
    text: |-
      Indien in een strafzaak in eerste aanleg of in hoger beroep over de gevangenhouding of gevangenneming van de
      rechtzoekende is geoordeeld, wordt, in afwijking van [artikel 18][ref1], het aantal toe te kennen punten met drie
      verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel18
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '18'
        hoofdstuk: II
        paragraaf: par._2
  - number: '17'
    text: |-
      Indien de rechtsbijstandverlener in het kader van een gerechtelijk vooronderzoek of een daarmee gelijk gesteld
      onderzoek bij het verhoor van een getuige of van de verdachte of bij een descente aanwezig is geweest, wordt het
      aantal toe te kennen punten verhoogd met één punt per gehoorde getuige, verdachte onderscheidenlijk per descente.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel17
  - number: '18.1'
    text: |-
      Onder zitting wordt voor de toepassing van dit artikel verstaan elk optreden van de rechter in het kader van het
      onderzoek ter terechtzitting en elke behandeling in rechte van de hoofdzaak of hoofdvordering alsmede het horen van
      de verdachte door de officier van justitie, met het oog op het stellen van een of meer voorwaarden ter voorkoming
      van strafvervolging, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel18
  - number: 18.1.a
    text: de zitting waarin tot aanhouding wordt besloten zonder dat de zaak inhoudelijk is behandeld, of
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel18
  - number: 18.1.b
    text: de zitting waarin uitsluitend de uitspraak in de zaak is gedaan.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel18
  - number: '18.2'
    text: |-
      Indien de rechtsbijstandverlener meer dan één zitting heeft bijgewoond, wordt voor de tweede en elke daaropvolgende
      bijgewoonde zitting het aantal toe te kennen punten telkens met twee verhoogd.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel18
  - number: '19'
    text: |-
      Indien een strafzaak vóór het onderzoek ter terechtzitting of voor de behandeling in rechte van de hoofdzaak of
      hoofdvordering wordt beëindigd, worden in afwijking van [artikel 14][ref1] vijf punten toegekend, tenzij in de
      bijlage een lager puntenaantal is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel14
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '14'
        hoofdstuk: II
        paragraaf: par._2
  - number: '20'
    text: |-
      Indien in een strafzaak rechtsbijstand is verleend door achtereenvolgens twee of meer rechtsbijstandverleners
      die niet werkzaam zijn in hetzelfde samenwerkingsverband, wordt het aantal toe te kennen punten één maal met twee
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel20
  - number: '21.1'
    text: |-
      Als samenhangende strafzaken worden beschouwd zaken die gevoegd, gelijktijdig, aansluitend of nagenoeg
      aansluitend ter zitting als bedoeld in het [eerste lid van artikel 18][ref1], zijn behandeld, en waarvoor één
      rechtsbijstandverlener is toegevoegd of meer dan één rechtsbijstandverlener mits zij deel uitmaken van hetzelfde
      samenwerkingsverband en voor zover de zaken naar hun aard verknocht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel18
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '18'
        hoofdstuk: II
        paragraaf: par._2
  - number: '21.2'
    text: |-
      In samenhangende strafzaken waarbij twee of meer rechtzoekenden zijn betrokken bij een of meer zaken, wordt in
      afwijking van [artikel 14][ref1], aan de zaken gezamenlijk het aantal punten toegekend dat wordt verkregen door
      het aantal punten dat in de bijlage is bepaald voor het desbetreffende rechtsterrein of soort zaak met het hoogste
      aantal punten te vermenigvuldigen met de navolgende percentages, al naar gelang het aantal zaken: 2–3: 150%; 4–6:
      200%; 7–10: 300%; 11–15: 400%;16–21: 500%; elke volgende 10: 100% extra.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel14
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '14'
        hoofdstuk: II
        paragraaf: par._2
  - number: '21.3'
    text: |-
      In samenhangende strafzaken waarbij één rechtzoekende is betrokken bij meer dan één zaak, wordt in afwijking van
      [artikel 14][ref1], aan de zaken gezamenlijk het aantal punten toegekend dat wordt verkregen door het aantal punten
      dat in de bijlage is bepaald voor het desbetreffende rechtsterrein of soort zaak met het hoogste aantal punten te
      verhogen met 50% voor elke zaak, met uitzondering van de eerste.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel14
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '14'
        hoofdstuk: II
        paragraaf: par._2
  - number: '21.4'
    text: |-
      Indien samenhangende strafzaken gevoegd, gelijktijdig, aansluitend of nagenoeg aansluitend op een zitting als
      bedoeld in het [eerste lid van artikel 18][ref1] zijn behandeld, wordt deze zitting voor de toekenning van de
      punten, bedoeld in het [tweede lid van artikel 18][ref2], aangemerkt als één zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel18
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '18'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '18'
        hoofdstuk: II
        paragraaf: par._2
  - number: '21.5'
    text: |-
      Op samenhangende strafzaken die bij de Hoge Raad aanhangig zijn gemaakt zijn het tweede, derde en vierde lid van
      overeenkomstige toepassing, met dien verstande dat voor de berekening, bedoeld in het tweede en derde lid, wordt
      uitgegaan van de strafzaak waaraan op grond van [artikel 15][ref1] het hoogste aantal punten wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel15
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '15'
        hoofdstuk: II
        paragraaf: par._2
  - number: '22.1'
    text: |-
      Indien in een strafzaak de tijdsbesteding aan de verlening van rechtsbijstand uitgaat boven het aantal uren dat
      gelijk is aan drie maal het aantal punten dat in de bijlage voor het desbetreffende rechtsterrein of soort zaak of
      op grond van [artikel 15][ref1] is bepaald, wordt voor elk uur waarin boven voornoemde grens rechtsbijstand wordt
      verleend, één punt toegekend mits het bureau de begroting van de tijdsbesteding voor de naar verwachting nog te
      verrichten werkzaamheden, bedoeld in het [eerste lid van artikel 31][ref2], heeft goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel31
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '15'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '31'
        hoofdstuk: IV
        paragraaf: par._1
  - number: '22.2'
    text: |-
      Indien in een strafzaak die is beëindigd in de situaties, bedoeld in [artikel 19][ref1], de tijdsbesteding aan de
      verlening van rechtsbijstand is uitgegaan boven het aantal uren dat gelijk is aan drie maal het aantal punten dat
      wordt toegekend op grond van [artikel 19][ref2], wordt voor elk uur waarin boven voornoemde grens rechtsbijstand
      is verleend, één punt toegekend mits het bureau de begroting van de tijdsbesteding voor de verrichte werkzaamheden,
      bedoeld in het [eerste lid van artikel 31][ref3], heeft goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0011018#Artikel31
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '19'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '19'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref3
        bwb_id: BWBR0011018
        artikel: '31'
        hoofdstuk: IV
        paragraaf: par._1
  - number: '22.3'
    text: |-
      Indien in samenhangende strafzaken de tijdsbesteding aan de verlening van rechtsbijstand
      uitgaat boven het aantal uren dat gelijk is aan drie maal het aantal punten dat op grond van het
      [tweede, derde en vijfde lid van artikel 21][ref1] wordt toegekend wordt, voor elk uur waarin boven voornoemde
      grens rechtsbijstand wordt verleend, één punt toegekend, mits het bureau de begroting van de tijdsbesteding voor
      de naar verwachting nog te verrichten werkzaamheden, bedoeld in het [eerste lid van artikel 31][ref2], heeft
      goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel31
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '21'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '31'
        hoofdstuk: IV
        paragraaf: par._1
  - number: '23.1'
    text: 'In een piketzaak wordt 1,5 punt toegekend, indien rechtsbijstand wordt verleend:'
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel23
  - number: 23.1.a
    text: |-
      aan in verzekering gestelde verdachten als bedoeld in [artikel 27 van het Wetboek van Strafvordering][ref1], in
      het politiebureau,


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '27'
  - number: 23.1.b
    text: |-
      aan in verzekering gestelde verdachten als bedoeld in [artikel 27 van het Wetboek van Strafvordering][ref1],
      tijdens een voorgeleiding voor de rechter-commissaris,


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '27'
  - number: 23.1.c
    text: |-
      aan in verzekering gestelde verdachten als bedoeld in [artikel 27 van het Wetboek van Strafvordering][ref1] in
      geval van hoger beroep van de officier van justitie tegen de beschikking tot onmiddellijke invrijheidstelling van
      de verdachte,


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '27'
  - number: 23.1.d
    text: |-
      op grond van [artikel 22 van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel22
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '22'
  - number: 23.1.e
    text: |-
      aan personen die krachtens de Vreemdelingenwet in hun vrijheid zijn beperkt of wier vrijheid krachtens de
      Vreemdelingenwet is ontnomen.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel23
  - number: '23.2'
    text: |-
      Indien de rechtsbijstand in een piketzaak is verleend op een zaterdag, zondag, een algemeen erkende feestdag of
      een bij of krachtens de [Algemene termijnenwet ][ref1]met algemeen erkende feestdagen gelijkgestelde dag, wordt
      aanvullend 0,5 punt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '24.1'
    text: |-
      Voor het tijdverlet in verband met reizen ten behoeve van de verlening van rechtsbijstand in een andere zaak dan
      een piketzaak wordt, uitgaande van de totale afstand die is afgelegd bij reizen naar de zitting, bedoeld in het
      [eerste lid van artikel 7][ref1] en het [eerste lid van artikel 18][ref2], en naar rechtzoekenden wier vrijheid
      is ontnomen of beperkt, per volle gereisde 60 kilometer een halve punt toegekend. Onder reizen naar de zitting
      is mede begrepen het reizen in verband met de behandeling van de gevangenhouding of gevangenneming, bedoeld in
      [artikel 16][ref3], alsmede in verband met het verhoor, bedoeld in [artikel 17][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0011018#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0011018#Artikel17
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '18'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '18'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref3
        bwb_id: BWBR0011018
        artikel: '16'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref4
        bwb_id: BWBR0011018
        artikel: '17'
        hoofdstuk: II
        paragraaf: par._2
  - number: '24.2'
    text: Het bureau bepaalt de reisafstand op gestandaardiseerde wijze.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel24
  - number: '25.1'
    text: |-
      Voor de kosten die worden gemaakt voor reizen naar de zitting, bedoeld in het [eerste lid van artikel 7][ref1]
      en het [eerste lid van artikel 18][ref2], alsmede naar rechtzoekenden wier vrijheid is ontnomen
      of beperkt, wordt een kilometervergoeding toegekend overeenkomstig de vergoeding die krachtens
      [artikel 8 van het Reisbesluit binnenland][ref3] wordt verleend. Dezelfde kilometervergoeding wordt toegekend voor
      de kosten die worden gemaakt voor reizen in verband met de behandeling van de gevangenhouding of gevangenneming,
      bedoeld in [artikel 16][ref4], alsmede in verband met het verhoor, bedoeld in [artikel 17][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0005889#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011018#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0011018#Artikel17
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '18'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '18'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref3
        bwb_id: BWBR0005889
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0011018
        artikel: '16'
        hoofdstuk: II
        paragraaf: par._2
      - id: ref5
        bwb_id: BWBR0011018
        artikel: '17'
        hoofdstuk: II
        paragraaf: par._2
  - number: '25.2'
    text: |-
      Een rechtsbijstandverlener die met toestemming van een stichting in een onderzoeks- of opvangcentrum aan
      een vreemdeling in de zin van de Vreemdelingenwet rechtsbijstand verleent gedurende een spreekuur ontvangt
      overeenkomstig het eerste lid een vergoeding voor de kosten die worden gemaakt voor reizen naar het onderzoeks-
      of opvangcentrum.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel25
  - number: '25.3'
    text: |-
      Voor de kosten die in piketzaken worden gemaakt voor reizen naar de rechtzoekende wordt een kilometervergoeding
      toegekend overeenkomstig de vergoeding die krachtens [artikel 7 van het Reisbesluit binnenland][ref1]
      wordt verleend. Indien de rechtzoekende zich ten tijde van de piketmelding buiten het ressort van de
      rechtsbijstandverlener bevond, is het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005889#Artikel7
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005889
        artikel: '7'
  - number: '25.4'
    text: |-
      Ten behoeve van de berekening van de kilometervergoeding, bedoeld in het eerste, tweede en derde lid, bepaalt het
      bureau de reisafstand op gestandaardiseerde wijze.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel25
  - number: '26'
    text: |-
      De kosten die de rechtsbijstandverlener heeft moeten maken doordat hij zich bij de verlening van rechtsbijstand in
      een strafzaak of een piketzaak van een tolk heeft moeten bedienen, worden vergoed tot ten hoogste het bedrag waarop
      een tolk ingevolge het [Besluit tarieven in strafzaken][ref1] aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002429
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002429
  - number: '27'
    text: |-
      Voor de administratieve kosten die in het kader van de rechtsbijstandverlening worden gemaakt, wordt per toevoeging
      een vergoeding van f 60,– toegekend.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel27
  - number: '28.1'
    text: |-
      Na beëindiging van de verlening van de rechtsbijstand dient de rechtsbijstandverlener bij het bureau een aanvraag
      in tot vaststelling van de vergoeding voor de verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel28
  - number: '28.2'
    text: |-
      Indien de aanvraag betrekking heeft op een procedure of een strafzaak, voegt de rechtsbijstandverlener hierbij de
      uitspraak of beslissing in de zaak, voorzover deze in schriftelijke vorm beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel28
  - number: '29.1'
    text: |-
      Het bureau kan de juistheid of volledigheid van de door de rechtsbijstandverlener verstrekte informatie of
      overgelegde bescheiden bij de desbetreffende instantie controleren.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel29
  - number: '29.2'
    text: |-
      Het bureau stelt de vergoeding vast op grond van de door de rechtsbijstandverlener verstrekte informatie en met
      inachtneming van [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel2
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '2'
        hoofdstuk: I
  - number: '29.3'
    text: |-
      Indien de bij de aanvraag verstrekte informatie onjuist of onvolledig is, kan het bureau de vergoeding vaststellen
      met inachtneming van de beschikbare juiste informatie.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel29
  - number: '29.4'
    text: |-
      De vergoeding wordt op nihil gesteld indien bij de vaststelling blijkt dat de zaak onder het bereik van een
      toevoeging van een andere zaak valt.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel29
  - number: '30'
    text: |-
      Indien na de vaststelling van de vergoeding feiten of omstandigheden bekend worden waarvan het bureau
      redelijkerwijs niet bij de vaststelling op de hoogte kon zijn en op grond waarvan de vergoeding lager zou zijn
      vastgesteld, dan wel indien de vaststelling onjuist was en de rechtsbijstandverlener dit wist of behoorde te weten,
      kan het bureau de vaststelling met terugwerkende kracht wijzigen of intrekken, tenzij vijf jaren zijn verstreken
      sedert de dag van de vaststelling.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel30
  - number: '31.1'
    text: |-
      In afwijking van het [eerste lid van artikel 28][ref1] dient de rechtsbijstandverlener bij het bereiken van de
      in de [artikelen 13][ref2] en [22][ref3] bedoelde tijdgrens een aanvraag in bij het bureau tot vaststelling van
      de vergoeding voor de verrichte werkzaamheden. Tegelijkertijd legt hij een begroting over met betrekking tot de
      tijdsbesteding van de naar verwachting nog te verrichten werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0011018#Artikel22
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '28'
        hoofdstuk: IV
        paragraaf: par._1
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '13'
        hoofdstuk: II
        paragraaf: par._1
      - id: ref3
        bwb_id: BWBR0011018
        artikel: '22'
        hoofdstuk: II
        paragraaf: par._2
  - number: '31.2'
    text: |-
      Het bureau stemt geheel of gedeeltelijk in met de begroting, bedoeld in het eerste lid, indien het van oordeel is
      dat de rechtsbijstand doelmatig wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel31
  - number: '31.3'
    text: |-
      Nadat de tijd waarmee het bureau heeft ingestemd is verstreken, dient de rechtsbijstandverlener een aanvraag in tot
      vaststelling van de vergoeding voor de desbetreffende werkzaamheden en kan hij daarbij een begroting indienen met
      betrekking tot de tijdsbesteding van de naar verwachting nog te verrichten werkzaamheden. Het tweede en derde lid
      zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel31
  - number: '32.1'
    text: |-
      Het bureau betaalt overeenkomstig de vaststelling, bedoeld in het [tweede lid van artikel 29][ref1], de vergoeding
      onder verrekening van overeenkomstig [artikel 35][ref2] betaalde voorschotten en met inachtneming van het bepaalde
      in [artikel 37, tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel37
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '29'
        hoofdstuk: IV
        paragraaf: par._1
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '35'
        hoofdstuk: IV
        paragraaf: par._3
      - id: ref3
        bwb_id: BWBR0006368
        artikel: '37'
  - number: '32.2'
    text: |-
      In zaken, waarin krachtens een besluit van het bureau als bedoeld in
      [artikel 33, eerste lid, onder c van de wet][ref1] de verlening van rechtsbijstand tussentijds is beëindigd, is het
      voorgaande lid slechts van toepassing voor zover de rechtzoekende het van hem verlangde voorschot, of de verhoging
      daarvan, heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel33
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '33'
  - number: '32.3'
    text: |-
      Indien de rechtsbijstandverlener blijkens zijn opgave aan het bureau recht heeft op betalingen
      van derden voor de kosten van de verlening van rechtsbijstand, anders dan op de voet van
      [artikel 243, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] of van
      [artikel 8:75, tweede lid, van de Algemene wet bestuursrecht][ref2], worden deze bedragen tot ten hoogste het
      bedrag van de overeenkomstig dit besluit vastgestelde vergoeding op die vergoeding in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel243
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '243'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '32.4'
    text: Onverschuldigd betaalde vergoedingen kunnen worden teruggevorderd of verrekend met nog verschuldigde vergoedingen.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel32
  - number: '33.1'
    text: |-
      Indien in een zaak achtereenvolgens door twee of meer rechtsbijstandverleners, niet werkzaam in hetzelfde
      samenwerkingsverband, rechtsbijstand is verleend, wordt de vergoeding betaald aan de rechtsbijstandverlener die het
      laatst is toegevoegd. De rechtsbijstandverleners verdelen het bedrag in onderling overleg naar verhouding van de
      verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel33
  - number: '33.2'
    text: |-
      Indien bij de verlening van rechtsbijstand als bedoeld in het eerste lid zowel een of meer medewerkers van een
      stichting als een of meer rechtsbijstandverleners niet zijnde medewerker van een stichting zijn betrokken, stelt
      het bureau vast welk deel van de vergoeding toekomt aan de laatstgenoemde rechtsbijstandverleners en draagt het
      zorg voor de betaling daarvan met overeenkomstige toepassing van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel33
  - number: '34.1'
    text: |-
      Indien rechtsbijstand is verleend door een medewerker van een stichting op grond van
      [artikel 19, eerste lid onder c van de wet][ref1], zijn de [artikelen 28 tot en met 33][ref2] niet van toepassing,
      tenzij anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011018#Artikel28
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0011018
        artikel: '28'
        hoofdstuk: IV
        paragraaf: par._1
  - number: '34.2'
    text: |-
      De stichting informeert het bureau na beëindiging van de rechtsbijstand over de verrichte werkzaamheden
      overeenkomstig het bepaalde in [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel28
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '28'
        hoofdstuk: IV
        paragraaf: par._1
  - number: '34.3'
    text: |-
      Het bureau stelt overeenkomstig [artikel 38, tweede lid, van de wet][ref1] vast op grond van de in het tweede
      lid bedoelde informatie welke eigen bijdrage ten hoogste aan de rechtzoekende in rekening kan worden gebracht, en
      bericht de stichting hierover.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel38
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '38'
  - number: '34.4'
    text: |-
      Indien het bureau heeft beslist dat na de verlening van rechtsbijstand door een medewerker van een stichting op
      grond van een voorwaardelijke toevoeging geen definitieve toevoeging wordt afgegeven, bepaalt het bureau het bedrag
      dat door de stichting aan de rechtzoekende voor de verleende rechtsbijstand in rekening moet worden gebracht, en
      bericht het de stichting hierover.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel34
  - number: '35.1'
    text: |-
      Het bureau verleent aan de advocaat die door de raad is ingeschreven op grond van [artikel 14 van de wet][ref1],
      telkens in de eerste maand van elk kwartaal een voorschot voor de krachtens dit besluit toe te kennen vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel14
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '14'
  - number: '35.2'
    text: |-
      Per jaar is de hoogte van het kwartaalvoorschot gelijk aan het door Onze Minister vast te stellen normbedrag
      vermenigvuldigd met een vierde deel van het aantal toevoegingen dat aan de advocaat is afgegeven in de periode
      van 1 september van het voorlaatste jaar tot 1 september van het jaar dat voorafgaat aan het jaar waarin het
      kwartaalvoorschot wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel35
  - number: '35.3'
    text: |-
      Indien het normbedrag wijzigt, wijzigt het bureau met ingang van het eerstvolgende kwartaal dienovereenkomstig de
      verlening van het kwartaalvoorschot.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel35
  - number: '35.4'
    text: |-
      Het voorschot bedraagt ten hoogste een door Onze Minister te bepalen bedrag. Het voorschot wordt op nihil gesteld
      indien het aantal toevoegingen als bedoeld in het tweede lid blijft beneden een door Onze Minister te bepalen
      aantal.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel35
  - number: '35.5'
    text: |-
      Indien de hoogte van het kwartaalvoorschot niet overeenkomstig de norm in het tweede lid kan worden berekend kan
      het bureau gedurende de periode dat voornoemde norm niet kan worden toegepast, telkens een voorschot verlenen dat
      is gerelateerd aan het aantal toevoegingen dat aan de advocaat is afgegeven in het voorafgaande kwartaal.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel35
  - number: '35.6'
    text: Voorschotten worden overeenkomstig de voorschotverlening betaald.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel35
  - number: '36.1'
    text: |-
      De raad kan besluiten de hoogte van de voorschotten te verlagen met ten hoogste 10% indien het door Onze Minister
      voor de raad vastgestelde budget dreigt te worden overschreden.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel36
  - number: '36.2'
    text: Het bureau kan in uitzonderlijke gevallen besluiten het voorschot te verlagen of niet langer te verlenen.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel36
  - number: '37'
    text: |-
      Indien de inschrijving van de advocaat door de raad wordt doorgehaald overeenkomstig [artikel 17 van de wet][ref1],
      is de advocaat gehouden op vordering van het bureau het verleende voorschot met verrekening van de toegekende
      vergoedingen onverwijld terug te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel17
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '17'
  - number: '38.1'
    text: |-
      Het bureau kan een vordering jegens een advocaat als bedoeld in [artikel 37][ref1] overdragen aan een door Onze
      Minister voor dit doel erkende rechtspersoon indien de advocaat niet voldoet aan zijn betalingsverplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel37
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '37'
        hoofdstuk: IV
        paragraaf: par._3
  - number: '38.2'
    text: |-
      De advocaat die een voorschot ontvangt, is jaarlijks een nader door Onze Minister te bepalen bedrag verschuldigd
      aan de in het eerste lid bedoelde rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel38
  - number: '39.1'
    text: |-
      In afwijking van de [hoofdstukken II][ref1] en [III][ref2] kan het bureau de vergoeding bepalen met
      inachtneming van nader vast te stellen kwaliteitscriteria, mits de desbetreffende rechtsbijstandverlener of
      rechtsbijstandverleners daarmee instemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0011018#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011018
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011018
        hoofdstuk: III
  - number: '39.2'
    text: |-
      Het bureau kan met instemming van de rechtsbijstandverlener afwijken van het bepaalde in [hoofdstuk IV][ref1] over
      de wijze van aanvragen en de overige procedureregels inzake de vaststelling van de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011018
        hoofdstuk: IV
  - number: '39.3'
    text: |-
      De raad stelt beleidsregels vast voor de toepassing van het eerste en tweede lid en vermeldt deze beleidsregels in
      het jaarplan, bedoeld in [artikel 7 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel7
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '7'
  - number: '40.1'
    text: |-
      Gerechtsdeurwaarders aan wie in een zaak waarin op grond van een toevoeging rechtsbijstand wordt verleend, het
      uitbrengen van een exploot of het opmaken van een proces-verbaal is opgedragen, of die bijstand hebben verleend bij
      de tenuitvoerlegging van de in een zodanige zaak gegeven uitspraak, ontvangen van rijkswege 75% van het bedrag dat
      zij volgens het [Besluit tarieven ambtshandelingen gerechtsdeurwaarders][ref1] zouden hebben mogen berekenen, met
      dien verstande dat de verschotten voor rekening van de opdrachtgever blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0012638
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0012638
  - number: '40.2'
    text: |-
      Gerechtsdeurwaarders die overeenkomstig het eerste lid aan een rechtsbijstandverlener bijstand hebben verleend,
      zenden met een afschrift van het exploot of de akte, vermeldende dat in de desbetreffende zaak rechtsbijstand is
      verleend, een aanvraag in voor vergoeding van de verrichte werkzaamheden bij een door Onze Minister aan te wijzen
      instantie. Deze instantie draagt zorg voor de uitbetaling van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel40
  - number: '41.1'
    text: |-
      De dag- en nieuwsbladen ontvangen van rechtswege een vergoeding voor de door hen geplaatste oproepingen of
      aankondigingen, bedoeld in [artikel 39 van de wet][ref1], ten bedrage van het normale in rekening te brengen
      advertentietarief voorzover niet een afwijkend tarief met die bladen overeen is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel39
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '39'
  - number: '41.2'
    text: |-
      Indien een rechtsbijstandverlener een dag- of nieuwsblad opdracht heeft gegeven tot het krachtens wettelijk
      voorschrift of rechterlijk bevel plaatsen van een oproeping of mededeling, zendt hij – onder overlegging van een
      exemplaar van de editie, waarin de oproeping of aankondiging is opgenomen – de nota in bij een door Onze Minister
      aan te wijzen instantie. Deze instantie draagt zorg voor de uitbetaling van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel41
  - number: '44'
    text: Het Besluit vergoedingen rechtsbijstand 1994 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel44
  - number: '45.1'
    text: |-
      Het Besluit vergoedingen rechtsbijstand 1994 blijft van toepassing op toevoegingen afgegeven vóór het moment van
      inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel45
  - number: '45.2'
    text: |-
      Het Besluit vergoedingen rechtsbijstand, met uitzondering van de [hoofdstukken V][ref1] en [VI][ref2], blijft van
      toepassing op toevoegingen afgegeven vóór 1 januari 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0011018#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0011018#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011018
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0011018
        hoofdstuk: VI
  - number: '45.3'
    text: |-
      Het Besluit vergoedingen rechtsbijstand in strafzaken, met uitzondering van de hoofdstukken VII en VIII, blijft van
      toepassing op toevoegingen afgegeven vóór 1 januari 1994.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel45
  - number: '46'
    text: Dit besluit treedt in werking met ingang van 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel46
  - number: '47'
    text: 'Dit besluit wordt aangehaald als: Besluit vergoedingen rechtsbijstand 2000.'
    url: https://wetten.overheid.nl/BWBR0011018/2002-07-01#Artikel47
