$id: besluit_procedure_geneeskundig_onderzoek_blijvende_dienstongeschiktheid_en_pensioenkeuring_militairen
regulatory_layer: AMVB
publication_date: '2006-08-01'
valid_from: '2006-08-02'
bwb_id: BWBR0008475
url: https://wetten.overheid.nl/BWBR0008475/2006-08-02
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie van 26 juli 1996, nr. P/96002773;

    Gelet op, artikel 12 onder b en i van de Militaire Ambtenarenwet 1931, artikel 12 van de Dienstplichtwet en artikel
    T1 van de Algemene militaire pensioenwet;

    De Raad van State gehoord (advies van 9 oktober 1996, nr. WO7 9600333);

    Gezien het nader rapport van de Staatssecretaris van Defensie van 19 december 1996, nr. P/96006120;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel1
  - number: 1.b
    text: |-
      geneeskundige autoriteit: de door Onze Minister aan te wijzen medische autoriteit, die hem adviseert omtrent
      blijvende dienstongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel1
  - number: 1.c
    text: |-
      geneeskundig onderzoek: een militair geneeskundig onderzoek naar het bestaan van blijvende ongeschiktheid voor het
      vervullen van de militaire dienst;
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel1
  - number: 1.d
    text: |-
      pensioenkeuring: een geneeskundig onderzoek naar het ontstaan, tot uiting komen of verergeren,
      de aard en de gevolgen van verwonding, ziekten of gebreken, ingevolge de bij of krachtens de
      [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen inzake arbeidsongeschiktheid, alsmede inzake
      invaliditeit met dienstverband;


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 1.e
    text: |-
      pensioenverzekeringsautoriteit: een door Onze Minister aan te wijzen medisch adviseur, die hem adviseert omtrent de
      pensioenverzekeringsaspecten;
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel1
  - number: 1.f
    text: |-
      commissie: de commissie genoemd in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008475#Artikel3
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008475
        artikel: '3'
        paragraaf: '2'
  - number: '2.1'
    text: |-
      In geval van langdurig arbeidsverzuim dient voorafgaand aan het geneeskundig onderzoek naar blijvende
      dienstongeschiktheid uiterlijk in de 26e week na de eerste dag van het arbeidsverzuim een eerste beoordeling plaats
      te vinden omtrent de vraag of de betreffende militair moet worden voorgedragen voor een dergelijk geneeskundig
      onderzoek. Deze beoordeling vindt plaats op een door de geneeskundige autoriteit te bepalen wijze. Zo nodig wordt
      deze beoordeling in de twaalfde maand herhaald.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel2
  - number: '2.2'
    text: |-
      Een geneeskundig onderzoek en een herhaald geneeskundig onderzoek naar blijvende dienstongeschiktheid vindt plaats
      onder de verantwoordelijkheid van de geneeskundige autoriteit in opdracht van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel2
  - number: '2.3'
    text: |-
      Van de opdracht genoemd in het vorige lid doet de geneeskundige autoriteit mededeling aan de
      pensioenverzekeringsautoriteit.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel2
  - number: '3.1'
    text: |-
      Een al dan niet na langdurig ziekteverzuim te houden geneeskundig onderzoek, als ook een herhaald geneeskundig
      onderzoek naar blijvende dienstongeschiktheid, wordt ingesteld door een commissie, welke bestaat uit ten minste
      drie artsen, waarvan de voorzitter, tevens lid, en de overige leden worden aangewezen door de geneeskundige
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel3
  - number: '3.2'
    text: 'Ten aanzien van de samenstelling van een commissie als genoemd in het eerste lid geldt dat:'
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel3
  - number: 3.2.a
    text: |-
      niet als lid kan worden aangewezen de behandelend arts van de militair en tevens voor een herhaald geneeskundig
      onderzoek niet kan worden aangewezen een arts, die als lid deel heeft uitgemaakt van de commissie, welke het
      geneeskundig onderzoek naar blijvende dienstongeschiktheid heeft ingesteld;
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel3
  - number: 3.2.b
    text: zo mogelijk als lid een hoofdofficier wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel3
  - number: '4'
    text: |-
      Aan de te onderzoeken militair wordt bij de schriftelijke oproep voor een geneeskundig of herhaald geneeskundig
      onderzoek naar blijvende dienstongeschiktheid door de voorzitter van de commissie bekend gemaakt met welk doel het
      onderzoek zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel4
  - number: '5'
    text: |-
      Indien de te onderzoeken militair door zijn toestand verhinderd is te verschijnen op de door de voorzitter van
      de commissie bepaalde zittingsplaats, bepaalt de voorzitter waar en op welke wijze het geneeskundig of herhaald
      geneeskundig onderzoek naar blijvende dienstongeschiktheid alsdan zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel5
  - number: '6'
    text: |-
      De militaire autoriteiten zijn, met inachtneming van de op de Wet persoonsregistraties gebaseerde
      privacyreglementen, verplicht aan de voorzitter van de commissie op diens verzoek toe te zenden een staat van
      dienst betreffende de te onderzoeken militair en hem voorts die gegevens te verstrekken, welke de commissie nodig
      acht, in het bijzonder:
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel6
  - number: 6.a
    text: een verslag van het verloop van de verzuimcontrole en verzuimbegeleiding;
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel6
  - number: 6.b
    text: een verslag van de reïntegratieactiviteiten van het krijgsmachtdeel en eventueel externe diensten;
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel6
  - number: '7'
    text: |-
      De commissie beoordeelt een militair op het bestaan van blijvende ongeschiktheid voor het vervullen van de
      militaire dienst met inachtneming van het [Militair keuringsreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002346
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002346
  - number: '8.1'
    text: |-
      De commissie brengt aangaande het geneeskundig onderzoek en het herhaald geneeskundig onderzoek naar blijvende
      dienstongeschiktheid een rapport uit. Het rapport omvat een onderbouwde uitspraak omtrent de al dan niet blijvende
      dienstongeschiktheid van de militair en de gegevens waarop deze uitspraak is gebaseerd en voor het herhaald
      geneeskundig onderzoek een nadere beschouwing met betrekking tot de door de militair aangevoerde redenen van zijn
      verzet.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel8
  - number: '8.2'
    text: |-
      In geval van niet blijvende ongeschiktheid voor het vervullen van de militaire dienst bevat het rapport tevens een
      verklaring of herstel van de militair binnen een periode van 6 maanden na ommekomst van de ziekteverzuimperiode van
      2 jaar is te verwachten, zodanig dat dit alsnog tot een geschiktverklaring zou kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel8
  - number: '8.3'
    text: |-
      Een lid van de commissie bij wie op een of meer punten een van het gevoelen der meerderheid afwijkende mening
      bestaat, is bevoegd om daarvan onder vermelding van de gronden, waarop die mening berust, te doen blijken bij een
      aan het rapport toe te voegen nota.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel8
  - number: '8.4'
    text: |-
      De voorzitter van de commissie zendt het rapport alsmede eventuele nota’s als genoemd in het derde lid, naar de
      geneeskundige autoriteit.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel8
  - number: '9.1'
    text: |-
      De geneeskundige autoriteit kan de commissie opdragen het rapport nader te motiveren, zo nodig na een op zijn last
      voortgezet onderzoek.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel9
  - number: '9.2'
    text: |-
      De geneeskundige autoriteit zendt Onze Minister een uittreksel van het rapport, na dit te hebben voorzien van zijn
      visum. Dit uittreksel bevat een uitspraak omtrent de al dan niet blijvende ongeschiktheid voor het vervullen van de
      militaire dienst van de militair en eventuele overige gegevens, die de geneeskundige autoriteit noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel9
  - number: '9.3'
    text: |-
      Alvorens de in het tweede lid bedoelde uitspraak aan Onze Minister te zenden deelt de geneeskundige autoriteit aan
      de militair mede of hij hem al dan niet blijvend ongeschikt acht voor het vervullen van de militaire dienst alsmede
      de gronden waarop dit oordeel berust en wijst hem daarbij op de mogelijkheid voorzien in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel9
  - number: '9.4'
    text: |-
      Binnen zes weken na de dag waarop de militair in kennis is gesteld van de uitspraak genoemd in het derde lid, kan
      de militair daartegen bij Onze Minister schriftelijk en met redenen omkleed in verzet komen, waarna binnen zes
      weken na de datum van ontvangst een herhaald geneeskundig onderzoek kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel9
  - number: '10'
    text: |-
      In bijzondere gevallen kan Onze Minister bepalen dat hem het volledige rapport wordt toegezonden met het oog
      op een integrale herbeoordeling van de uitspraak van de geneeskundige autoriteit, door een door hem aangewezen
      functionaris belast met de taak om namens hem op te treden in medische zaken.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel10
  - number: '11'
    text: |-
      Onze Minister kan bepalen, dat een onderzoek ten aanzien van een dienstplichtige door een keuringsraad wordt
      aangemerkt als een geneeskundig onderzoek.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel11
  - number: '12.1'
    text: |-
      De pensioenverzekeringsautoriteit kan bij de vaststelling van de aanspraken van de militair, ter vervanging van een
      eigen pensioenkeuring gebruik maken van een geneeskundig onderzoek door de commissie.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel12
  - number: '12.2'
    text: |-
      Indien de pensioenverzekeringsautoriteit van de in het eerste lid bedoelde mogelijkheid gebruik wenst te maken,
      richt hij daartoe een verzoek aan de geneeskundige autoriteit onder gelijktijdige opgave van de behandelend medisch
      adviseur.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel12
  - number: '12.3'
    text: |-
      De commissie brengt omtrent de eventuele pensioenaanspraken van de militair een nader rapport uit aan de
      pensioenverzekeringsautoriteit.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel12
  - number: '12.4'
    text: |-
      In voorkomend geval kan de commissie tevens gevraagd worden een advies uit te brengen omtrent de vraag of en zo
      ja in hoeverre na ontslag alsnog sprake is van verwonding, ziekten of gebreken als bedoeld in de bij of krachtens
      [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen inzake invaliditeit met dienstverband.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: '13.1'
    text: |-
      Bij de vaststelling van de mate van invaliditeit met dienstverband als bedoeld in de bij of krachtens
      [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen wordt uitgegaan van de War Pensions Committee-schaal
      zoals in de bijlage opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: '13.2'
    text: |-
      Onze Minister kan in bepaalde gevallen afwijken van de in lid 1 genoemde schaal dan wel aanwijzingen geven ter
      nadere invulling van de toepassing ervan.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel13
  - number: '14'
    text: Het Besluit procedure geneeskundig onderzoek militairen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel14
  - number: '15'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van in het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel15
  - number: '16'
    text: |-
      Dit besluit kan worden aangehaald als: Besluit procedure geneeskundig onderzoek blijvende dienstongeschiktheid en
      pensioenkeuring militairen.
    url: https://wetten.overheid.nl/BWBR0008475/2006-08-02#Artikel16
