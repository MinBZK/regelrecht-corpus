  - number: '2.6'
    text: |-
      1 In deze paragraaf wordt verstaan onder:

      a. premieplichtig loon: het loon, bedoeld in [paragraaf 1 van afdeling 1 van hoofdstuk 3 van de Wfsv][ref1],
      waarnaar op grond van dat hoofdstuk premies worden geheven;

      b. kleine werkgever: een werkgever te wiens laste, in het tweede kalenderjaar dat aan het kalenderjaar waarvoor de
      premie wordt vastgesteld vooraf is gegaan, een premieplichtig loon is gekomen dat gelijk is aan of minder bedraagt
      dan 25 maal het gemiddelde premieplichtige loon per werknemer in dat kalenderjaar;

      c. grote werkgever: een werkgever te wiens laste, in het tweede kalenderjaar dat aan het kalenderjaar waarvoor de
      premie wordt vastgesteld vooraf is gegaan, een premieplichtig loon is gekomen dat meer bedraagt dan 25 maal het
      gemiddelde premieplichtige loon per werknemer in dat kalenderjaar;

      d. minimumpremie: de gedifferentieerde premie die een werkgever ten minste verschuldigd is;

      e. maximumpremie: de gedifferentieerde premie die een werkgever ten hoogste verschuldigd is.

      2 De inspecteur kan op aanvraag van een werkgever bij voor bezwaar vatbare beschikking vaststellen, dat die
      werkgever voor het kalenderjaar waarvoor de premie wordt vastgesteld in afwijking van het eerste lid, onderdeel b,
      of het eerste lid, onderdeel c, wordt ingedeeld, indien uit door die werkgever bij de aanvraag verstrekte gegevens
      blijkt, dat als vaststaand mag worden aangenomen, dat het in het kalenderjaar waarvoor de premie wordt vastgesteld
      ten laste van die werkgever komende premieplichtige loon ten minste 25% zal afwijken van 25 maal het gemiddelde
      premieplichtige loon per werknemer in het tweede kalenderjaar dat aan het kalenderjaar waarvoor de premie wordt
      vastgesteld vooraf is gegaan en de omvang van het verwachte premieplichtige loon leidt tot een andere indeling. Een
      aanvraag als bedoeld in de eerste zin wordt ingediend uiterlijk 6 weken nadat de werkgever schriftelijk in kennis
      is gesteld van de door hem in het kalenderjaar waarvoor de premie wordt vastgesteld verschuldigde gedifferentieerde
      premie, bedoeld in [artikel 38 van de Wfsv][ref2].

      3 Het gemiddelde premieplichtige loon, bedoeld in het eerste lid, onderdelen b en c, wordt vastgesteld door het
      UWV.

      4 Bij de vaststelling van het ten laste van een werkgever komende premieplichtige loon, bedoeld in het eerste
      lid, onderdelen b en c, worden de via de werkgever betaalde arbeidsongeschiktheidsuitkeringen die op grond van
      [artikel 117 van de Wfsv][ref3], zoals dat luidde op de dag voor de inwerkingtreding van artikel IV, onderdeel G,
      van de Wet harmonisatie en vereenvoudiging socialezekerheidswetgeving, ten laste van de Arbeidsongeschiktheidskas
      komen en WGA-uitkeringen die op grond van [artikel 117b van de Wfsv][ref4] ten laste van de Werkhervattingskas
      komen, buiten aanmerking gelaten.


