  - number: '3.4'
    text: |-
      1 De SVB kan de verschuldigde premie over een kalenderjaar voorlopig vaststellen, indien:

      a. zij bij de vaststelling van die premie rekening dient te houden met de in dat kalenderjaar verschuldigde premie
      op grond van de verplichte verzekering ingevolge de [AOW][ref1] of de [ANW][ref2]; of

      b. nog onduidelijk is of [artikel 3.3, derde lid][ref3], van toepassing is.

      2 Zodra dat naar het oordeel van de SVB mogelijk is, wordt de over bedoeld kalenderjaar verschuldigde premie
      definitief vastgesteld.

      3 Te veel betaalde premie wordt terugbetaald. Nog verschuldigde premie wordt binnen een door de SVB vast te stellen
      termijn betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
