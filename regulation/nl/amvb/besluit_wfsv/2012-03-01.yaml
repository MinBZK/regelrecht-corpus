  - number: '4.2'
    text: |-
      Het College zorgverzekeringen vergoedt uit het AFBZ jaarlijks aan de zorgverzekeraars de kosten van verstrekkingen
      en vergoedingen naar werkelijke kosten. Daarbij blijven onverantwoorde uitgaven buiten beschouwing, tenzij de
      zorgautoriteit anders besluit.
    url: https://wetten.overheid.nl/BWBR0019070/2012-03-01#Artikel4.2
  - number: '4.3'
    text: |-
      Onze Minister geeft het College zorgverzekeringen jaarlijks een aanwijzing terzake van het voor alle
      zorgverzekeraars, verbindingskantoren en het centraal administratiekantoor tezamen voor dat kalenderjaar ten laste
      van het AFBZ komende beheerskostenbudget.
    url: https://wetten.overheid.nl/BWBR0019070/2012-03-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 Het College zorgverzekeringen stelt jaarlijks, in het kader van de verdeling van de voor het kalenderjaar
      krachtens [artikel 4.3][ref1] beschikbaar gestelde middelen, voor iedere zorgverzekeraar afzonderlijk ten laste van
      het AFBZ het beheerskostenbudget vast ter dekking van de beheerskosten die zij maken anders dan in de hoedanigheid
      van verbindingskantoor.

      2 De vaststelling van het beheerskostenbudget, bedoeld in het eerste lid, geschiedt aan de hand van de door het
      College zorgverzekeringen vast te stellen beleidsregels.

      3 De beleidsregels, bedoeld in het tweede lid, behoeven de goedkeuring van Onze Minister.

      4 In geval van onthouding van goedkeuring aan een beleidsregel stelt het College zorgverzekeringen, met
      inachtneming van door Onze Minister te geven instructies, een nieuwe beleidsregel vast.

      5 Indien Onze Minister aan de beleidsregel, bedoeld in het vierde lid, eveneens goedkeuring onthoudt, stelt hij
      terzake zelf de beleidsregel vast.

      6 Het College zorgverzekeringen keert jaarlijks uit het AFBZ aan een zorgverzekeraar het voor die zorgverzekeraar
      op grond van het eerste lid vastgestelde beheerskostenbudget uit.

      7 Indien een zorgverzekeraar op een naar het oordeel van de zorgautoriteit onverantwoorde wijze op zijn
      beheerskosten bespaart, wordt de uitkering, bedoeld in het zesde lid, voor het desbetreffende kalenderjaar door het
      College zorgverzekeringen verlaagd met het bedrag van die besparing.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0019070/2012-03-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '4.3'
        hoofdstuk: '4'
  - number: '4.5'
    text: |-
      1 Het College zorgverzekeringen stelt jaarlijks, in het kader van de verdeling van de voor het kalenderjaar
      krachtens [artikel 4.3][ref1] beschikbaar gestelde middelen, afzonderlijk voor ieder verbindingskantoor en voor het
      centraal administratiekantoor het beheerskostenbudget vast.

      2 De vaststelling van het beheerskostenbudget, bedoeld in het eerste lid, geschiedt aan de hand van
      door het College zorgverzekeringen vast te stellen beleidsregels. Ten aanzien van die beleidsregels is
      [artikel 4.4, derde lid][ref2], van overeenkomstige toepassing.

      3 Het College zorgverzekeringen keert jaarlijks uit het AFBZ aan de verbindingskantoren en het centraal
      administratiekantoor het voor hen ingevolge het eerste lid vastgestelde beheerskostenbudget uit.

      4 Indien een verbindingskantoor of het centraal administratiekantoor op een naar het oordeel van de zorgautoriteit
      onverantwoorde wijze op zijn beheerskosten bespaart, wordt de uitkering, bedoeld in het eerste lid, voor het
      desbetreffende kalenderjaar door het College zorgverzekeringen verlaagd met het bedrag van die besparing.

      5 Een verbindingskantoor en het centraal administratiekantoor houden een reserve uitvoering [AWBZ][ref3] aan.

      6 Het saldo van baten en lasten over enig boekjaar van een verbindingskantoor voor de beheerskosten die het in of
      in verband met die hoedanigheid maakt, wordt toegevoegd aan, onderscheidenlijk ten laste gebracht van de reserve,
      bedoeld in het vijfde lid. Daarbij blijven onverantwoorde uitgaven buiten beschouwing, tenzij de zorgautoriteit
      anders besluit. De eerste zin is van overeenkomstige toepassing voor het centraal administratiekantoor.

      7 Bij het eindigen van de aanwijzing, bedoeld in [artikel 40 van de AWBZ][ref4], zonder dat aansluitend een nieuwe
      aanwijzing plaatsvindt, stort de rechtspersoon een bedrag ter hoogte van de reserve, bedoeld in het vijfde lid,
      binnen vier weken in het AFBZ.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel4.4
      [ref3]: https://wetten.overheid.nl/BWBR0002614
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel40
    url: https://wetten.overheid.nl/BWBR0019070/2012-03-01#Artikel4.5
