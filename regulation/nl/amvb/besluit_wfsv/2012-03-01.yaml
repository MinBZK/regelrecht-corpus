  - number: '2.2'
    text: |-
      1 Het UWV stelt een sectorpremiepercentage vast ter dekking van de werkloosheidslasten. Het sectorpremiepercentage
      bedraagt ten hoogste het lastenplafond.

      2 Het UWV stelt voor de dekking van de ziekengeldlasten en de lasten die op grond van
      [artikel 104, eerste lid, onderdeel d, van de Wfsv][ref1], ten laste van een sectorfonds komen een opslagpercentage
      vast, waarmee het sectorpremiepercentage met betrekking tot dat sectorfonds wordt verhoogd.

      3 Indien in een sectorfonds op 31 december van het jaar waarin het sectorpremiepercentage wordt vastgesteld naar
      verwachting van het UWV een positief of negatief dekkingssaldo aanwezig zal zijn, stelt het UWV, in afwijking van
      het eerste lid, in dat kalenderjaar en de daaropvolgende kalenderjaren een zodanig sectorpremiepercentage vast dat
      het overschot dan wel tekort binnen drie kalenderjaren na die datum is ingelopen onderscheidenlijk aangezuiverd.

      4 De toepassing van het derde lid leidt niet tot het heffen van een negatieve sectorpremie.

      5 Voorzover een positief dekkingssaldo door de toepassing van het vierde lid niet binnen de termijn van drie
      kalenderjaren kan worden ingelopen, geldt een zodanig langere termijn tot 31 december van enig jaar dat het
      overschot wel kan worden ingelopen.

      6 Indien de toepassing van het derde lid leidt tot vaststelling van een sectorpremiepercentage boven het
      lastenplafond behoeft de aanzuivering van een negatief dekkingssaldo niet binnen de termijn van drie kalenderjaren
      te geschieden. In dat geval wordt het sectorpremiepercentage vastgesteld op ten minste het lastenplafond.

      7 Indien een sectorfonds bestaat uit onderdelen die niet afzonderlijk worden beheerd, terwijl het deel van de
      premie dat ten gunste komt van het sectorfonds voor elk van die onderdelen afzonderlijk wordt vastgesteld, zijn
      het eerste tot en met het zesde lid met betrekking tot deze onderdelen gezamenlijk van overeenkomstige toepassing,
      met dien verstande, dat onder het sectorpremiepercentage wordt verstaan het gewogen gemiddelde van de voor die
      onderdelen afzonderlijk vastgestelde sectorpremiepercentages.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld voor het eerste en tweede lid.

      9 Bij ministeriële regeling kan worden bepaald dat ten behoeve van de vaststelling van het sectorpremiepercentage,
      bedoeld in het eerste lid, de termijn van drie kalenderjaren, bedoeld in het derde, vijfde en zesde lid, wordt
      verlengd tot maximaal vijf kalenderjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
