  - number: '2.16'
    text: |-
      [Artikel 47, eerste lid, van de Wfsv][ref1] is van overeenkomstige toepassing bij een dienstbetrekking met een
      werknemer die onmiddellijk voorafgaand aan de aanvang van de dienstbetrekking gedurende tenminste twee jaar
      recht heeft op een nabestaandenuitkering op grond van de [Algemene nabestaandenwet][ref2] en gedurende die twee
      jaar geen inkomen uit arbeid als bedoeld in de [artikelen 2:2, eerste lid, onderdelen a tot en met d][ref3], en
      [2:6, eerste lid, onderdeel b, onder 1° en 2°, van het Algemeen inkomensbesluit socialezekerheidswetten][ref4]
      heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0029368#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0029368#Artikel26
