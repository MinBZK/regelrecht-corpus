  - number: '2.3'
    text: |-
      1 In afwijking van [artikel 2.2][ref1] stelt het UWV op bij ministeriële regeling te bepalen wijze
      sectorpremiepercentages, die voor verschillende categorieën van werknemers kunnen verschillen, vast voor de
      sectorfondsen van:

      a. het agrarisch bedrijf;

      b. het bouwbedrijf;

      c. de culturele instellingen;

      d. de horeca algemeen;

      e. het schildersbedrijf.

      2 De verschillende sectorpremiepercentages gelden voor:

      a. werknemers die blijkens een schriftelijke overeenkomst ten minste voor een jaar of voor onbepaalde tijd in
      dienstbetrekking zullen staan tot de werkgever, tenzij:

      1°. zij binnen een jaar na het aanvangen van de dienstbetrekking uit hoofde van die dienstbetrekking recht hebben
      gekregen op een uitkering op grond van de Werkloosheidswet; of

      2°. de omvang van de door de werknemer te verrichten arbeid in deze schriftelijke overeenkomst niet is vastgesteld;
      en

      b. de overige werknemers.

      Het gewogen gemiddelde van beide percentages bedraagt ten hoogste het lastenplafond.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld voor het tweede lid en kan voor aan te wijzen
      categorieën van werknemers en van werkgevers of soort arbeid worden afgeweken van het eerste en tweede lid.

      4 Voor de toepassing van het tweede lid, onderdeel a, wordt niet als uitkering op grond van de
      [Werkloosheidswet][ref2] beschouwd:

      a. een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref3];

      b. een uitkering op grond van [hoofdstuk IV van de Werkloosheidswet][ref4];

      c. een uitkering die uitsluitend het gevolg is van verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref5] ontheffing is verleend.

      5 Een afschrift van de schriftelijke overeenkomst, bedoeld in het tweede lid, onderdeel a, wordt door de werkgever
      in zijn loonadministratie opgenomen.

      6 Indien voor het jaar 2006 verschillende sectorpremiepercentages zijn vastgesteld geldt het sectorpremiepercentage
      dat van toepassing is voor werknemers, bedoeld in het tweede lid, onderdeel b, niet voor dienstbetrekkingen die
      zijn aangegaan voor 1 januari 2006.

      7 Uitsluitend ten aanzien van de premie die het UWV betaalt aan de werkgever op grond van
      [artikel 11, tweede lid, van de Werkloosheidswet][ref6], [artikel 11, derde lid, van de Ziektewet][ref7] of
      [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref8] is het sectorpremiepercentage,
      bedoeld in het tweede lid, onderdeel a, van toepassing.


