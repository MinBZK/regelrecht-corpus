  - number: '2.1'
    text: |-
      In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:

      a. het sectorpremiepercentage: het percentage van het loon dat op grond van
      [artikel 28, eerste lid, van de Wfsv][ref1] wordt vastgesteld ter bepaling van het deel van de premie dat ten
      gunste komt van een sectorfonds;

      b. de verzekerde loonsom: het totaalbedrag van het loon, bedoeld in [artikel 26 van de Wfsv][ref2], waarover
      het UWV in een kalenderjaar ten gunste van een sectorfonds de in dat artikel bedoelde premies ontvangt, met
      uitzondering van de uitkeringen, de toeslag en het loon waarop [artikel 28, tweede lid, van de Wfsv][ref3] van
      toepassing is;

      c. de ziekengeldlasten: de uitkeringen die op grond van [artikel 104, eerste lid, onderdeel c, van de Wfsv][ref4]
      ten laste van een sectorfonds komen alsmede de uitvoeringskosten met betrekking tot die uitkeringen en de
      op grond van enige wet over die uitkeringen door het UWV verschuldigde premies die niet op die uitkeringen
      in mindering kunnen worden gebracht met uitzondering van hetgeen meer bedraagt dan het op grond van
      [artikel 105, derde lid, van de Wfsv][ref5] vastgestelde maximum;

      d. de werkloosheidslasten: hetgeen op grond van [artikel 104, eerste lid, van de Wfsv][ref6] ten laste van een
      sectorfonds komt, met uitzondering van:

      1°. de ziekengeldlasten;

      2°. de uitkeringen die worden betaald aan zieke werklozen en die op grond van
      [artikel 104, zevende lid, van de Wfsv][ref7], niet ten laste van een sectorfonds komen, waarbij die uitkeringen
      worden berekend door het aantal ziektedagen van zieke werklozen in de sector te vermenigvuldigen met het gemiddelde
      per dag uitbetaalde bedrag en de uitkomst te vermenigvuldigen met het bedrag van de uitkeringslasten van het
      sectorfonds gedeeld door het bedrag van de uitkeringslasten van het Algemeen Werkloosheidsfonds ten behoeve van
      werklozen met werkloosheidsuitkering uit de sector;

      3°. hetgeen meer bedraagt dan het op grond van [artikel 105, eerste lid, van de Wfsv][ref8] vastgestelde maximum;

      e. het lastenplafond: het percentage van de verzekerde loonsom waarin de werkloosheidslasten tot uitdrukking komen,
      dat op grond van [artikel 105, eerste lid, van de Wfsv][ref9] wordt vastgesteld als maximum;

      f. het dekkingssaldo: het verschil tussen het feitelijke vermogen van een sectorfonds en de op grond van
      [artikel 120, achtste lid, van de Wfsv][ref10] aan te houden reserve.


