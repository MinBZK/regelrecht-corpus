  - number: '2.7'
    text: |-
      1 Het rekenpercentage, bedoeld in [artikel 38, eerste lid, onderdeel a, van de Wfsv][ref1], is gelijk aan
      het gemiddelde percentage, bedoeld in [artikel 38, eerste lid, onderdeel b, van de Wfsv][ref2] vermeerderd of
      verminderd met:

      a. een percentage ter compensatie van het naar verwachting over het kalenderjaar waarvoor de premie
      wordt vastgesteld optredende verschil tussen enerzijds de premie-inkomsten die worden verkregen indien de
      gedifferentieerde premie, bedoeld in [artikel 38 van de Wfsv][ref3], wordt gebaseerd op het gemiddelde percentage
      bedoeld in [artikel 38, eerste lid, onderdeel b, van de Wfsv][ref4], verminderd met de premie-inkomsten die het
      gevolg zijn van de opslag, bedoeld in [artikel 2.8, tweede lid][ref5], en anderzijds het totaalbedrag dat naar
      verwachting in het kalenderjaar waarvoor de premie wordt vastgesteld op grond van [artikel 117b van de Wfsv][ref6]
      ten laste van de Werkhervattingskas komt, verminderd met de gelden die op grond van
      [artikel 117a, onderdelen b en c, van de Wfsv][ref7] naar verwachting ten gunste van de Werkhervattingskas komen;

      b. een percentage, voor zover dit nodig of mogelijk is, rekening houdend met de verplichting, bedoeld in
      [artikel 113a van de Wfsv][ref8], betreffende het vormen en in stand houden van een voldoende reserve,
      met dien verstande dat bij de bepaling van dit percentage de opbrengst van de opslag, bedoeld in
      [artikel 2.8, tweede lid][ref9], in het kalenderjaar waarvoor de premie wordt vastgesteld en in de daaraan
      voorafgaande kalenderjaren buiten beschouwing wordt gelaten.

      2 De percentages, bedoeld in het eerste lid, worden naar beneden afgerond op twee cijfers achter de komma.


