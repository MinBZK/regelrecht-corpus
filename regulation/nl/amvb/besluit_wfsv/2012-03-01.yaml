  - number: '2.4'
    text: |-
      1 Het gemiddelde premiepercentage, bedoeld in [artikel 28, tweede lid, van de Wfsv][ref1], wordt in het
      kalenderjaar van vaststelling bepaald op het gewogen gemiddelde van de sectorpremiepercentages van alle sectoren in
      het daaraan voorafgaande kalenderjaar.

      2 Het gewogen gemiddelde, bedoeld in het eerste lid, wordt in het kalenderjaar van vaststelling bepaald met behulp
      van de totaalbedragen van de verzekerde loonsom in het daaraan voorafgaande kalenderjaar.

      3 Ingeval voor een sectorfonds gedurende een kalenderjaar meerdere malen een premiepercentage wordt vastgesteld,
      worden bij de berekening van het gemiddelde premiepercentage, bedoeld in het eerste lid, de desbetreffende
      premiepercentages gewogen naar rato van het deel van het kalenderjaar waarin deze premiepercentages golden.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel28
