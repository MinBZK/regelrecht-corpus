      - id: ref2
        bwb_id: BWBR0002221
  - number: '3.3'
    text: |-
      1 De AOW-premie wordt voor elk in de periode van vrijwillige verzekering voor de [AOW][ref1] gelegen vol
      kalenderjaar vastgesteld volgens de formule:

      P x I – H, waarbij:

      a. P gelijk is aan het premiepercentage, bedoeld in [artikel 11, eerste lid, van de Wfsv][ref2];

      b. I gelijk is aan het hoogste bedrag dat als premie-inkomen in de zin van
      [artikel 8, eerste lid, van de Wfsv][ref3] in aanmerking genomen wordt, te weten het als tweede vermelde bedrag in
      kolom II van de tarieftabel in [artikel 2.10 van de Wet inkomstenbelasting 2001][ref4];

      c. H gelijk is aan de heffingskorting, bedoeld in [artikel 12, eerste lid, onderdeel a][ref5], met dien
      verstande dat voor de toepassing van dat artikelonderdeel tot de standaardheffingskorting, bedoeld in
      [artikel 8.2 van de Wet inkomstenbelasting 2001][ref6], alleen geacht wordt te behoren de algemene heffingskorting.

      2 De ANW-premie wordt voor elk in de periode van vrijwillige verzekering voor de [ANW][ref7] gelegen vol
      kalenderjaar vastgesteld volgens de formule:

      P x I – H, waarbij:

      a. P gelijk is aan het premiepercentage, bedoeld in [artikel 11, tweede lid, van de Wfsv][ref8];

      b. I gelijk is aan het hoogste bedrag dat als premie-inkomen in de zin van
      [artikel 8, eerste lid, van de Wfsv][ref9] in aanmerking genomen wordt, te weten het als tweede vermelde bedrag in
      kolom II van de tarieftabel in [artikel 2.10 van de Wet inkomstenbelasting 2001][ref10];

      c. H gelijk is aan de heffingskorting, bedoeld in [artikel 12, eerste lid, onderdeel b][ref11], met
      dien verstande dat voor de toepassing van dat artikelonderdeel tot de standaardheffingskorting, bedoeld
      in [artikel 8.2 van de Wet inkomstenbelasting 2001][ref12], alleen geacht wordt te behoren de algemene
      heffingskorting.

      3 In afwijking van de onderdelen b van het tweede en derde lid is indien ten aanzien van de SVB aannemelijk
      wordt gemaakt dat dit tot een lagere uitkomst leidt, I gelijk aan het feitelijke premie-inkomen in de zin van
      [artikel 8, eerste lid, van de Wfsv][ref13]. Hierbij wordt de waarde van inkomen in natura door de SVB geschat,
      uitgaande van de waarde van dat inkomen in het land waar het wordt of werd ontvangen.

      4 De AOW- of ANW-premie, die is vastgesteld met toepassing van het vierde lid bedraagt ten minste 10% van de AOW-
      of ANW-premie vastgesteld op grond van het tweede onderscheidenlijk derde lid.

      5 Voorzover de vrijwillige verzekering slechts betrekking heeft op een gedeelte van een kalenderjaar wordt de
      premie naar tijdsruimte evenredig verminderd.

      6 De SVB stelt op verzoek van de belanghebbende die een gedeelte van het kalenderjaar van rechtswege verzekerd
      is voor de [AOW][ref14] of de [ANW][ref15], de AOW-premie of de ANW-premie over dat kalenderjaar zodanig vast dat
      de over het kalenderjaar verschuldigde premie voor de verplichte en de vrijwillige verzekering niet meer bedraagt
      dan de premie die maximaal verschuldigd zou zijn indien het gehele kalenderjaar sprake zou zijn van verplichte
      verzekering.

      7 Niet in euro uitgedrukt premie-inkomen wordt vastgesteld in de valuta van het desbetreffende land en wordt met
      behulp van de door de Europese Centrale Bank geadviseerde wisselkoersen omgerekend in euro.

      8 Voor de toepassing van het derde lid wordt het inkomen geacht te zijn ontvangen in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel8
