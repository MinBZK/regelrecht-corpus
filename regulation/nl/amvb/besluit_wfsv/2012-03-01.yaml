  - number: '2.8'
    text: |-
      1 Het gemiddelde percentage, bedoeld in [artikel 38, eerste lid, onderdeel b, van de Wfsv][ref1], wordt vastgesteld
      door het totaalbedrag van hetgeen in het kalenderjaar waarvoor de premie wordt vastgesteld naar verwachting
      op grond van [artikel 117b van de Wfsv][ref2] ten laste komt van de Werkhervattingskas, verminderd met hetgeen
      op grond van [artikel 117a, onderdelen b en c, van de Wfsv][ref3] in het kalenderjaar waarvoor de premie wordt
      vastgesteld naar verwachting ten gunste komt van de Werkhervattingkas, te vermenigvuldigen met honderd en de
      uitkomst van deze berekening te delen door het totaalbedrag van de over het kalenderjaar waarvoor de premie wordt
      vastgesteld verwachte premieplichtige loonsom en de naar verwachting in dat jaar te betalen uitkeringen, bedoeld
      in [artikel 38a, eerste lid, van de Wfsv][ref4]. Onder uitkeringen als bedoeld in de eerste zin worden niet
      verstaan de WGA-uitkeringen waarvan het risico van de betaling wordt gedragen door een werkgever als bedoeld in
      [artikel 40 van de Wfsv][ref5].

      2 De gemiddelde premie, bedoeld in het eerste lid, kan worden verhoogd met een bij ministeriële regeling vast te
      stellen percentage.

      3 De uitkomst van de deling, bedoeld in het eerste lid, wordt naar beneden afgerond op twee cijfers achter de
      komma.


