  - number: '3.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. ANW: de [Algemene nabestaandenwet][ref1];

      b. ANW-premie: de premie voor de vrijwillige nabestaandenverzekering;

      c. AOW: de [Algemene Ouderdomswet][ref2];

      d. AOW-premie: de premie voor de vrijwillige ouderdomsverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0019070/2012-03-01#Artikel3.1
