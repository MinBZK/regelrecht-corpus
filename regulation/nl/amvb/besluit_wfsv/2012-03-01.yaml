  - number: '2.14'
    text: |-
      1 De gedifferentieerde premie, bedoeld in [artikel 38 van de Wfsv][ref1], bedraagt:

      a. voor een kleine werkgever: ten minste het overeenkomstig het tweede lid vastgestelde percentage en ten hoogste
      drie maal het gemiddelde percentage, bedoeld in [artikel 2.8][ref2];

      b. voor een grote werkgever: ten minste een vierde van het gemiddelde percentage, bedoeld in [artikel 2.8][ref3],
      en ten hoogste vier maal het gemiddelde percentage, bedoeld in artikel 2.8.

      2 De voor kleine werkgevers geldende minimale gedifferentieerde premie wordt door het UWV voor elk kalenderjaar
      waarvoor de premie wordt vastgesteld op een zodanig percentage vastgesteld, dat de uit de heffing van deze
      minimaal verschuldigde premie voortvloeiende extra inkomsten naar verwachting gelijk zullen zijn aan de extra
      premieinkomsten die zouden worden verworven indien geen maximum zou zijn gesteld aan de door deze werkgevers
      verschuldigde gedifferentieerde premie, verminderd met de naar verwachting ten laste van de kleine werkgevers
      komende premieinkomsten ten gevolge van de voor grote werkgevers krachtens het eerste lid, onderdeel b, geldende
      maximale gedifferentieerde premie.

      3 Indien de toepassing van [artikel 2.11][ref4] daartoe aanleiding geeft, wordt in afwijking van het eerste lid:

      a. voor een grote werkgever een premiepercentage van lager dan de minimumpremie, bedoeld in het eerste lid,
      onderdeel b, vastgesteld;

      b. voor een kleine werkgever een premiepercentage van lager dan de minimumpremie, bedoeld in het tweede lid,
      vastgesteld.

      4 De percentages, bedoeld in het eerste lid, onderdeel b, en het derde lid, worden naar beneden afgerond op twee
      cijfers achter de komma.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2.8
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2.8
      [ref4]: https://wetten.overheid.nl/BWBR0019070#Artikel2.11
