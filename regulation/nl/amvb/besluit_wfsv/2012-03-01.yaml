  - number: '2.10'
    text: |-
      1 In geval van overgang van een onderneming in de zin van [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1],
      alsmede in geval van een dergelijke overgang bij faillissement:

      a. worden bij de toepassing van [artikel 2.9][ref2] de arbeidsongeschiktheidsuitkeringen, bedoeld in
      [artikel 2.9, tweede lid, onderdeel a, en derde lid, onderdeel a][ref3], en de WGA-uitkeringen, bedoeld in
      [artikel 2.9, tweede lid, onderdeel b, en derde lid, onderdeel b][ref4], die zijn of worden toegekend aan de
      werknemer die op de eerste dag van de ongeschiktheid tot het verrichten van zijn arbeid in dienstbetrekking stond
      tot de werkgever die de onderneming heeft overgedragen, toegerekend aan de werkgever die de onderneming verkrijgt;
      en

      b. wordt bij de toepassing van [artikel 2.9][ref5] het ten laste van de werkgever die de onderneming heeft
      overgedragen, gekomen premieplichtig loon in enig kalenderjaar telkens opgeteld bij het premieplichtig loon van
      de werkgever die de onderneming verkrijgt in dat kalenderjaar, voordat het gemiddelde premieplichtig loon van
      laatstgenoemde werkgever wordt berekend.

      2 Indien slechts een deel van de onderneming overgaat, vindt het eerste lid toepassing naar rato van het deel
      van het totaalbedrag van premieplichtig loon in het overgegane deel van de onderneming van het totaalbedrag van
      premieplichtig loon in de gehele onderneming in het jaar voorafgaande aan dat van overgang.

      3 Tenzij de overgang plaatsvindt op 1 januari van het kalenderjaar vindt voor de werkgever die reeds de
      hoedanigheid van werkgever had voor het moment van overgang van de onderneming de toerekening, bedoeld in het
      eerste lid, onderdeel a, en de optelling, bedoeld in het eerste lid, onderdeel b, eerst plaats met ingang van het
      kalenderjaar volgend op het kalenderjaar waarin de onderneming of een deel van de onderneming is overgedragen.


