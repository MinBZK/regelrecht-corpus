        artikel: 63c
  - number: '3.7'
    text: |-
      Indien een verzekerde als bedoeld in [artikel 38 van de AOW][ref1] binnen drie maanden na de door de SVB gestelde
      termijn de verschuldigde AOW-premie niet geheel heeft betaald, wordt over een zodanig gedeelte van de periode,
      waarop de premiebetaling betrekking heeft, geacht AOW-premie te zijn betaald als de betaalde AOW-premie zich
      verhoudt tot de totaal verschuldigde AOW-premie. Daarbij wordt geacht AOW-premie te zijn betaald over de periode,
      welke het verst verwijderd ligt van het tijdstip van de aanvang van de verplichte verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel38
    url: https://wetten.overheid.nl/BWBR0019070/2012-03-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '38'
  - number: '3.8'
    text: |-
      1 Indien de vrijwillige verzekering is geëindigd, wordt voorzover dit nog niet heeft plaatsgevonden, de over ieder
      kalenderjaar verschuldigde premie definitief vastgesteld.

      2 Indien het eerste lid toepassing heeft gevonden, wordt de betaalde premie geacht betrekking te hebben op de
      achtereenvolgende gehele kalenderjaren of, voorzover de belanghebbende gedurende slechts een gedeelte van een of
      meer kalenderjaren niet verplicht verzekerd was, op de betreffende gedeelten van die gehele kalenderjaren, die het
      dichtst liggen bij het tijdstip waarop de verplichte verzekering is geëindigd.

      3 Indien na toepassing van het eerste lid de over een kalenderjaar verschuldigde premie niet geheel blijkt te zijn
      voldaan, wordt over een zodanig gedeelte van dat kalenderjaar geacht premie te zijn betaald, als de nog toe te
      rekenen premie zich verhoudt tot de totaal over dit kalenderjaar verschuldigde premie.
    url: https://wetten.overheid.nl/BWBR0019070/2012-03-01#Artikel3.8
  - number: '4.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. AFBZ: het Algemeen Fonds Bijzondere Ziektekosten, genoemd in [artikel 89 van de Wfsv][ref1];

      c. AWBZ: de [Algemene Wet Bijzondere Ziektekosten][ref2];

      d. kosten van verstrekkingen en vergoedingen: kosten van verstrekkingen en vergoedingen ter zake van
      verleende zorg als bedoeld in [artikel 6 AWBZ][ref3], niet zijnde forensische zorg als bedoeld in
      [artikel 2 van het Interimbesluit forensische zorg][ref4];

      e. beheerskosten: de beheerskosten van de in de [AWBZ][ref5] geregelde verzekering, waaronder begrepen de kosten
      van controle in het kader van die verzekering en waaronder niet begrepen de beheerskosten voor forensische zorg als
      bedoeld in [artikel 2 van het Interimbesluit forensische zorg][ref6];

      f. centraal administratiekantoor: het centraal administratiekantoor, bedoeld in het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref7];

      g. zorgverzekeraar: een zorgverzekeraar als bedoeld in [artikel 1, eerste lid, onderdeel b, van de AWBZ][ref8];

      h. verbindingskantoor: een verbindingskantoor als bedoeld in het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref9];

      i. onverantwoorde uitgaven: uitgaven waarvan de Nederlandse zorgautoriteit heeft vastgesteld dat ze niet
      noodzakelijk zijn voor de uitvoering van de verzekering ingevolge de [AWBZ][ref10];

      j. beheerskostenbudget: de ten laste van het AFBZ voor het centraal administratiekantoor, de zorgverzekeraars en
      de verbindingskantoren beschikbare middelen ter dekking van de voor de uitvoering van de [AWBZ][ref11] te maken
      beheerskosten die zij in hun hoedanigheid maken;

      k. zorgautoriteit: de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref12];

      l. College zorgverzekeringen: het College voor zorgverzekeringen, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref13].


