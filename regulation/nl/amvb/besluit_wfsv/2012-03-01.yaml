  - number: '2.9'
    text: |-
      1 De opslag of korting, bedoeld in [artikel 38, tweede lid, van de Wfsv][ref1], is voor alle werkgevers gelijk aan
      het individuele werkgeversrisicopercentage verminderd met het gemiddelde werkgeversrisicopercentage.

      2 Het individuele werkgeversrisicopercentage, bedoeld in het eerste lid, wordt verkregen door de som van:

      a. het totaalbedrag van de op grond van [artikel 117 van de Wfsv][ref2], zoals dat luidde op de dag
      voor de inwerkingtreding van artikel IV, onderdeel G, van de Wet harmonisatie en vereenvoudiging
      socialezekerheidswetgeving, ten laste van de Arbeidsongeschiktheidskas komende aan de werkgever toe te rekenen
      arbeidsongeschiktheidsuitkeringen, die in het tweede kalenderjaar vóór het kalenderjaar waarvoor de premie wordt
      vastgesteld zijn betaald aan werknemers die bij het intreden van de arbeidsongeschiktheid op grond waarvan de in
      het zevende lid bedoelde arbeidsongeschiktheidsuitkeringen worden toegekend, in dienstbetrekking stonden tot een
      werkgever, en

      b. het totaalbedrag van de op grond van [artikel 117b van de Wfsv][ref3] ten laste van de Werkhervattingskas
      komende aan de werkgever toe te rekenen WGA-uitkeringen die in het tweede kalenderjaar vóór het kalenderjaar
      waarvoor de premie wordt vastgesteld zijn betaald aan werknemers die bij het intreden van de arbeidsongeschiktheid
      op grond waarvan de WGA-uitkeringen worden toegekend, in dienstbetrekking stonden tot een werkgever,

      te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het ten laste van die werkgever
      komende gemiddelde premieplichtige loon per jaar, berekend over het tijdvak van vijf kalenderjaren, eindigend één
      jaar voor aanvang van het kalenderjaar waarvoor de premie wordt vastgesteld.

      3 Het gemiddelde werkgeversrisicopercentage, bedoeld in het eerste lid, wordt verkregen door de som van:

      a. het totaalbedrag van de op grond van [artikel 117 van de Wfsv][ref4], zoals dat luidde op de dag
      voor de inwerkingtreding van artikel IV, onderdeel G, van de Wet harmonisatie en vereenvoudiging
      socialezekerheidswetgeving, ten laste van de Arbeidsongeschiktheidskas komende aan werkgevers toe te rekenen
      arbeidsongeschiktheidsuitkeringen, die in het tweede kalenderjaar vóór het kalenderjaar waarvoor de premie wordt
      vastgesteld zijn betaald, en

      b. het totaalbedrag van de op grond van [artikel 117b van de Wfsv][ref5], ten laste van de Werkhervattingskas
      komende aan werkgevers toe te rekenen WGA-uitkeringen, die in het tweede kalenderjaar vóór het kalenderjaar
      waarvoor de premie wordt vastgesteld zijn betaald,

      te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het totale gemiddelde
      premieplichtige loon per jaar, berekend over het tijdvak van vijf kalenderjaren eindigend één jaar voor aanvang van
      het kalenderjaar waarvoor de premie wordt vastgesteld.

      4 In het tweede en derde lid wordt voor WGA-uitkeringen die zijn betaald in het kalenderjaar 2006 voor
      «Werkhervattingskas» gelezen «Arbeidsongeschiktheidsfonds».

      5 Indien een WGA-uitkering wordt toegekend direct aansluitend op een arbeidsongeschiktheidsuitkering op grond van
      de [Wet werk en inkomen naar arbeidsvermogen][ref6] wordt de duur van die uitkering in mindering gebracht op de
      periode dat de WGA-uitkering wordt toegerekend als bedoeld in het tweede en derde lid.

      6 Bij de berekening van het gemiddelde premieplichtig loon, bedoeld in het tweede en derde lid, worden de via
      de werkgever betaalde arbeidsongeschiktheidsuitkeringen, bedoeld in [artikel 117 van de Wfsv][ref7], zoals dat
      luidde op de dag voor de inwerkingtreding van artikel IV, onderdeel G, van de Wet harmonisatie en vereenvoudiging
      socialezekerheidswetgeving, en WGA-uitkeringen, bedoeld in [artikel 117b van de Wfsv][ref8], buiten aanmerking
      gelaten.

      7 De arbeidsongeschiktheidsuitkeringen, bedoeld in het tweede lid, onderdeel a, en derde lid, onderdeel a,
      betreffen de arbeidsongeschiktheidsuitkeringen die zijn toegekend:

      a. aan de werknemers die op de eerste dag van de ongeschiktheid tot het verrichten van hun arbeid als bedoeld in
      [artikel 19 van de Ziektewet][ref9] tot de werkgever in dienstbetrekking stonden en terzake van die ongeschiktheid
      de wachttijd, bedoeld in [artikel 19 van de WAO][ref10], hebben doorgemaakt;

      b. met toepassing van [artikel 43a, eerste lid, onderdeel a, van de WAO][ref11] nadat de
      arbeidsongeschiktheidsuitkering toegekend aan de werknemer, bedoeld in onderdeel a, is ingetrokken op grond van
      [artikel 43, eerste lid, van de WAO][ref12];

      c. met toepassing van [artikel 43a, eerste lid, onderdeel b, van de WAO][ref13] aan de werknemer, bedoeld
      in onderdeel a, die aan het einde van de wachttijd ongeschikt was tot het verrichten van zijn arbeid wegens
      ziekte of gebreken, maar geen recht had op toekenning van een arbeidsongeschiktheidsuitkering omdat hij niet
      arbeidsongeschikt was.

      8 De WGA-uitkeringen, bedoeld in het tweede lid, onderdeel b, en derde lid, onderdeel b betreffen de WGA-
      uitkeringen die zijn toegekend:

      a. aan de werknemers die op de eerste dag van de ongeschiktheid tot het verrichten van hun arbeid als bedoeld in
      [artikel 19 van de Ziektewet][ref14] tot de werkgever in dienstbetrekking stonden en terzake van die ongeschiktheid
      de wachttijd, bedoeld in [artikel 23 van Wet WIA][ref15], hebben doorgemaakt;

      b. aan de werknemer, bedoeld in onderdeel a, van wie het recht op een WGA-uitkering op grond van
      [artikel 55 van de Wet WIA][ref16] later dan op de eerste dag na afloop van de wachttijd of indien op die dag de
      uitsluitingsgrond, bedoeld in [artikel 43, onderdeel b, van die wet][ref17] van toepassing is, op de dag dat zich
      die uitsluitingsgrond niet meer voordoet, is ontstaan;

      c. aan de werknemer, bedoeld in onderdeel a, van wie het recht op een WGA-uitkering op grond van
      [artikel 57 van de Wet WIA][ref18] is herleefd.

      9 Indien de werknemer bij het intreden van de arbeidsongeschiktheid, bedoeld in het zevende lid, onderdeel a, of
      gedeeltelijke arbeidsgeschiktheid, bedoeld in [artikel 5 van de Wet werk en inkomen naar arbeidsvermogen][ref19],
      bij meer dan één werkgever in dienstbetrekking stond, wordt voor de toepassing van het tweede lid de
      arbeidsongeschiktheidsuitkering of de WGA-uitkering naar rato van de loonsom toegerekend aan die werkgevers. De
      arbeidsongeschiktheidsuitkering of de WGA-uitkering wordt niet toegerekend aan de werkgever bij wie de werknemer
      met behoud van hetzelfde loon arbeid is blijven verrichten.

      10 Voor de toepassing van het tweede en derde lid worden de door het UWV toegekende
      arbeidsongeschiktheidsuitkeringen en de vakantieuitkeringen die in de periode, bedoeld in
      [artikel 117, eerste lid, aanhef, van de Wfsv][ref20], zoals dat luidde op de dag voor de inwerkingtreding
      van artikel IV, onderdeel G, van de Wet harmonisatie en vereenvoudiging socialezekerheidswetgeving,
      geheel of ten dele niet aan de werknemer zijn uitbetaald wegens het genieten van loon als bedoeld in
      [artikel 44, derde lid, van de WAO][ref21], geacht aan de werknemer te zijn uitbetaald.

      11 De uitkomst van de deling, bedoeld in het tweede en derde lid, wordt naar beneden afgerond op twee cijfers
      achter de komma.

      12 De op grond van dit artikel berekende opslagen of kortingen worden vermenigvuldigd met een breuk, waarvan de
      teller wordt gevormd door het rekenpercentage, bedoeld in [artikel 2.7][ref22], verminderd met de minimumpremie
      voor grote werkgevers, bedoeld in [artikel 2.14, eerste lid, onderdeel b][ref23], en de noemer door het gemiddelde
      werkgeversrisicopercentage, bedoeld in het derde lid.

      13 De uitkomst van de berekening, bedoeld in het twaalfde lid, wordt naar beneden afgerond op twee cijfers achter
      de komma.


