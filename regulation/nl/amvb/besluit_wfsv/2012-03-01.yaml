  - number: '2.13'
    text: |-
      Voor een werkgever die, zonder dat er sprake is van een overgang van een onderneming als bedoeld in
      [artikel 2.10][ref1], eerst in het kalenderjaar waarvoor de premie wordt vastgesteld, of in het eerste of
      tweede kalenderjaar onmiddellijk voorafgaande aan het kalenderjaar waarvoor de premie wordt vastgesteld de
      hoedanigheid van werkgever heeft verkregen, is het percentage van de gedifferentieerde premie, bedoeld in
      [artikel 38 van de Wfsv][ref2]:

      a. indien het een kleine werkgever betreft gelijk aan het overeenkomstig [artikel 2.14, tweede lid][ref3],
      vastgestelde percentage;

      b. indien het een grote werkgever betreft gelijk aan het rekenpercentage, bedoeld in [artikel 2.7][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2.14
      [ref4]: https://wetten.overheid.nl/BWBR0019070#Artikel2.7
    url: https://wetten.overheid.nl/BWBR0019070/2012-03-01#Artikel2.13
