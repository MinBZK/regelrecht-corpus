      [Besluit financiering uitvoeringsorganisatie bijzondere ziektekostenverzekering AWBZ][ref1] in het jaar 2005
      terzake van de onderwerpen geregeld in de [artikelen 4.3 tot en met 4.6][ref2] van dit hoofdstuk worden aangemerkt
      als besluiten op grond van de desbetreffende artikelen van dit hoofdstuk.


