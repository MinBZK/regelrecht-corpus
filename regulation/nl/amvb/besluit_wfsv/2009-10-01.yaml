---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_wfsv
regulatory_layer: AMVB
publication_date: '2019-06-28'
valid_from: '2009-10-01'
bwb_id: BWBR0019070
url: https://wetten.overheid.nl/BWBR0019070/2009-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid, gedaan mede namens de Staatssecretaris van
    Sociale Zaken en Werkgelegenheid, de Staatssecretaris van Financiën en Onze Minister van Volksgezondheid, Welzijn
    en Sport, van 8 juli 2005, nr. SV/F&W/05/51635;

    Gelet op de artikelen 28, eerste en tweede lid, 37, tweede en vierde lid, 42, 71, eerste lid, 80 en 91, eerste lid,
    van de Wet financiering sociale verzekeringen, de artikelen 40, eerste lid, en 77 van de Algemene Wet Bijzondere
    Ziektekosten, en artikel 78, zesde lid, van de Wet op de arbeidsongeschiktheidsverzekering;

    De Raad van State gehoord (advies van 19 augustus 2005, nr. W12.05.0324/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid, van 14 november 2005, nr. SV/
    F&W/05/70630, uitgebracht mede namens de Staatssecretaris van Sociale Zaken en Werkgelegenheid, de Staatssecretaris
    van Financiën en Onze Minister van Volksgezondheid Welzijn en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel1.1
  - number: 1.1.a
    text: |-
      Wfsv: de [Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: 1.1.b
    text: |-
      WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 1.1.c
    text: |-
      Wet WIA: de [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 1.1.d
    text: |-
      sector: een sector als bedoeld in [artikel 95 van de Wfsv][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '95'
  - number: '2.1'
    text: 'In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.1
  - number: 2.1.a
    text: |-
      het sectorpremiepercentage: het percentage van het loon dat op grond van [artikel 28, eerste lid, van de Wfsv][ref1]
      wordt vastgesteld ter bepaling van het deel van de premie dat ten gunste komt van een sectorfonds;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel28
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '28'
  - number: 2.1.b
    text: |-
      de verzekerde loonsom: het totaalbedrag van het loon, bedoeld in [artikel 26 van de Wfsv][ref1], waarover het
      UWV in een premiebetalingstijdvak ten gunste van een sectorfonds de in dat artikel bedoelde premies ontvangt, met
      uitzondering van de uitkeringen, de toeslag en het loon waarop [artikel 28, tweede lid, van de Wfsv][ref2] van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel28
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '28'
  - number: 2.1.c
    text: |-
      de ziekengeldlasten: de uitkeringen die op grond van [artikel 104, eerste lid, onderdeel c, van de Wfsv][ref1]
      ten laste van een sectorfonds komen alsmede de uitvoeringskosten met betrekking tot die uitkeringen en de
      op grond van enige wet over die uitkeringen door het UWV verschuldigde premies die niet op die uitkeringen
      in mindering kunnen worden gebracht met uitzondering van hetgeen meer bedraagt dan het op grond van
      [artikel 105, derde lid, van de Wfsv][ref2] vastgestelde maximum;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel105
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '105'
  - number: 2.1.d
    text: |-
      de werkloosheidslasten: hetgeen op grond van [artikel 104, eerste lid, van de Wfsv][ref1] ten laste van een
      sectorfonds komt, met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
  - number: 2.1.d.1°
    text: de ziekengeldlasten;
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.1
  - number: 2.1.d.2°
    text: |-
      de uitkeringen die worden betaald aan zieke werklozen en die op grond van
      [artikel 104, zevende lid, van de Wfsv][ref1], niet ten laste van een sectorfonds komen, waarbij die uitkeringen
      worden berekend door het aantal ziektedagen van zieke werklozen in de sector te vermenigvuldigen met het gemiddelde
      per dag uitbetaalde bedrag en de uitkomst te vermenigvuldigen met het bedrag van de uitkeringslasten van het
      sectorfonds gedeeld door het bedrag van de uitkeringslasten van het Algemeen Werkloosheidsfonds ten behoeve van
      werklozen met werkloosheidsuitkering uit de sector;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
  - number: 2.1.d.3°
    text: |-
      hetgeen meer bedraagt dan het op grond van [artikel 105, eerste lid, van de Wfsv][ref1] vastgestelde maximum;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel105
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '105'
  - number: 2.1.e
    text: |-
      het lastenplafond: het percentage van de verzekerde loonsom waarin de werkloosheidslasten tot uitdrukking komen,
      dat op grond van [artikel 105, eerste lid, van de Wfsv][ref1] wordt vastgesteld als maximum;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel105
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '105'
  - number: 2.1.f
    text: |-
      het dekkingssaldo: het verschil tussen het feitelijke vermogen van een sectorfonds en de op grond van
      [artikel 120, achtste lid, van de Wfsv][ref1] aan te houden reserve.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel120
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '120'
  - number: 2.2.1
    text: |-
      Het UWV stelt een sectorpremiepercentage vast ter dekking van de werkloosheidslasten. Het sectorpremiepercentage
      bedraagt ten hoogste het lastenplafond.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Het UWV stelt voor de dekking van de ziekengeldlasten en de lasten die op grond van
      [artikel 104, eerste lid, onderdeel d, van de Wfsv][ref1], ten laste van een sectorfonds komen een opslagpercentage
      vast, waarmee het sectorpremiepercentage met betrekking tot dat sectorfonds wordt verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
  - number: 2.2.3
    text: |-
      Indien in een sectorfonds op 31 december van het jaar waarin het sectorpremiepercentage wordt vastgesteld naar
      verwachting van het UWV een positief of negatief dekkingssaldo aanwezig zal zijn, stelt het UWV, in afwijking van
      het eerste lid, in dat kalenderjaar en de daaropvolgende kalenderjaren een zodanig sectorpremiepercentage vast dat
      het overschot dan wel tekort binnen drie kalenderjaren na die datum is ingelopen onderscheidenlijk aangezuiverd.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.2
  - number: 2.2.4
    text: De toepassing van het derde lid leidt niet tot het heffen van een negatieve sectorpremie.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.2
  - number: 2.2.5
    text: |-
      Voorzover een positief dekkingssaldo door de toepassing van het vierde lid niet binnen de termijn van drie
      kalenderjaren kan worden ingelopen, geldt een zodanig langere termijn tot 31 december van enig jaar dat het
      overschot wel kan worden ingelopen.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.2
  - number: 2.2.6
    text: |-
      Indien de toepassing van het derde lid leidt tot vaststelling van een sectorpremiepercentage boven het
      lastenplafond behoeft de aanzuivering van een negatief dekkingssaldo niet binnen de termijn van drie kalenderjaren
      te geschieden. In dat geval wordt het sectorpremiepercentage vastgesteld op ten minste het lastenplafond.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.2
  - number: 2.2.7
    text: |-
      Indien een sectorfonds bestaat uit onderdelen die niet afzonderlijk worden beheerd, terwijl het deel van de premie
      dat ten gunste komt van het sectorfonds voor elk van die onderdelen afzonderlijk wordt vastgesteld, zijn het eerste
      tot en met het zesde lid met betrekking tot deze onderdelen gezamenlijk van overeenkomstige toepassing, met dien
      verstande, dat onder het sectorpremiepercentage wordt verstaan het gewogen gemiddelde van de voor die onderdelen
      afzonderlijk vastgestelde sectorpremiepercentages.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.2
  - number: 2.2.8
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.2
  - number: 2.3.1
    text: |-
      In afwijking van [artikel 2.2][ref1] stelt het UWV op bij ministeriële regeling te bepalen wijze
      sectorpremiepercentages, die voor verschillende categorieën van werknemers kunnen verschillen, vast voor de
      sectorfondsen van:


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.3.1.a
    text: het agrarisch bedrijf;
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.1.b
    text: het bouwbedrijf;
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.1.c
    text: de culturele instellingen;
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.1.d
    text: de horeca algemeen;
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.1.e
    text: het schildersbedrijf.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.2
    text: 'De verschillende sectorpremiepercentages gelden voor:'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.2.a
    text: |-
      werknemers die blijkens een schriftelijke overeenkomst ten minste voor een jaar of voor onbepaalde tijd in
      dienstbetrekking zullen staan tot de werkgever, tenzij:
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.2.a.1°
    text: |-
      zij binnen een jaar na het aanvangen van de dienstbetrekking uit hoofde van die dienstbetrekking recht hebben
      gekregen op een uitkering op grond van de Werkloosheidswet; of
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.2.a.2°
    text: de omvang van de door de werknemer te verrichten arbeid in deze schriftelijke overeenkomst niet is vastgesteld; en
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.2.b
    text: de overige werknemers.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor het tweede lid en kan voor aan te wijzen
      categorieën van werknemers en van werkgevers of soort arbeid worden afgeweken van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Voor de toepassing van het tweede lid, onderdeel a, wordt niet als uitkering op grond van de
      [Werkloosheidswet][ref1] beschouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 2.3.4.a
    text: |-
      een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
  - number: 2.3.4.b
    text: |-
      een uitkering op grond van [hoofdstuk IV van de Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
  - number: 2.3.4.c
    text: |-
      een uitkering die uitsluitend het gevolg is van verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: 2.3.5
    text: |-
      Een afschrift van de schriftelijke overeenkomst, bedoeld in het tweede lid, onderdeel a, wordt door de werkgever in
      zijn loonadministratie opgenomen.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.3.6
    text: |-
      Indien voor het jaar 2006 verschillende sectorpremiepercentages zijn vastgesteld geldt het sectorpremiepercentage
      dat van toepassing is voor werknemers, bedoeld in het tweede lid, onderdeel b, niet voor dienstbetrekkingen die
      zijn aangegaan voor 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Het gemiddelde premiepercentage, bedoeld in [artikel 28, tweede lid, van de Wfsv][ref1], wordt vastgesteld op
      het gewogen gemiddelde van de sectorpremiepercentages van alle sectoren in het kalenderjaar voorafgaand aan het
      premiebetalingstijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel28
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '28'
  - number: 2.4.2
    text: |-
      Het gewogen gemiddelde, bedoeld in het eerste lid, wordt in het kalenderjaar van vaststelling bepaald met behulp
      van de totaalbedragen van de verzekerde loonsom in het daaraan voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Ingeval voor een sectorfonds gedurende een kalenderjaar meerdere malen een premiepercentage wordt vastgesteld,
      worden bij de berekening van het gemiddelde premiepercentage, bedoeld in het eerste lid, de desbetreffende
      premiepercentages gewogen naar rato van het deel van het kalenderjaar waarin deze premiepercentages golden.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.4
  - number: 2.5.1
    text: |-
      Het percentage voor de uniforme premie, bedoeld in [artikel 37, eerste lid, van de Wfsv][ref1], wordt
      vastgesteld door het totaalbedrag van hetgeen in het premiebetalingstijdvak naar verwachting op grond van
      [artikel 117 van de Wfsv][ref2] ten laste komt van de Arbeidsongeschiktheidskas, verminderd met hetgeen naar
      verwachting op grond van [artikel 116, onderdelen b tot en met e, van de Wfsv][ref3] in het premiebetalingstijdvak
      ten gunste komt van de Arbeidsongeschiktheidskas, te vermenigvuldigen met honderd en de uitkomst van deze
      berekening te delen door het totaalbedrag van de over het premiebetalingstijdvak verwachte premieplichtige loonsom
      en de naar verwachting in dat jaar te betalen uitkeringen, bedoeld in [artikel 38a, eerste lid, van de Wfsv][ref4].
      Onder uitkeringen als bedoeld in de eerste zin, worden niet verstaan de arbeidsongeschiktheidsuitkeringen, bedoeld
      in [hoofdstuk IIIA van de WAO][ref5], waarvan het risico van de betaling door een werkgever zelf wordt gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel117
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel116
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel38a
      [ref5]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIIA
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '117'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '116'
      - id: ref4
        bwb_id: BWBR0017745
        artikel: 38a
      - id: ref5
        bwb_id: BWBR0002524
        hoofdstuk: IIIA
  - number: 2.5.2
    text: |-
      Het percentage, bedoeld in het eerste lid, wordt vermeerderd of verminderd met een percentage voor zover dit nodig
      of mogelijk is, rekening houdend met de verplichting, bedoeld in [artikel 113 van de Wfsv][ref1], betreffende het
      vormen en in stand houden van een voldoende reserve.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel113
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '113'
  - number: 2.5.3
    text: |-
      De in het eerste lid en tweede lid bedoelde percentages worden naar beneden afgerond op twee cijfers achter de
      komma.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.5
  - number: 2.6.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.6
  - number: 2.6.1.a
    text: |-
      premieplichtig loon: het loon, bedoeld in [paragraaf 1 van afdeling 1 van hoofdstuk 3 van de Wfsv][ref1], waarnaar
      op grond van dat hoofdstuk premies worden geheven;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0017745
        paragraaf: '1'
  - number: 2.6.1.b
    text: |-
      kleine werkgever: een werkgever te wiens laste, in het tweede kalenderjaar dat aan het premiebetalingstijdvak
      vooraf is gegaan, een premieplichtig loon is gekomen dat gelijk is aan of minder bedraagt dan 25 maal het
      gemiddelde premieplichtige loon per werknemer in dat kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.6
  - number: 2.6.1.c
    text: |-
      grote werkgever: een werkgever te wiens laste, in het tweede kalenderjaar dat aan het premiebetalingstijdvak vooraf
      is gegaan, een premieplichtig loon is gekomen dat meer bedraagt dan 25 maal het gemiddelde premieplichtige loon per
      werknemer in dat kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.6
  - number: 2.6.1.d
    text: 'minimumpremie: de gedifferentieerde premie die een werkgever ten minste verschuldigd is;'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.6
  - number: 2.6.1.e
    text: 'maximumpremie: de gedifferentieerde premie die een werkgever ten hoogste verschuldigd is.'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.6
  - number: 2.6.2
    text: |-
      De inspecteur kan op aanvraag van een werkgever bij voor bezwaar vatbare beschikking vaststellen, dat die werkgever
      voor het premiebetalingstijdvak in afwijking van het eerste lid, onderdeel b, of het eerste lid, onderdeel c, wordt
      ingedeeld, indien uit door die werkgever bij de aanvraag verstrekte gegevens blijkt, dat als vaststaand mag worden
      aangenomen, dat het in het premiebetalingstijdvak ten laste van die werkgever komende premieplichtige loon ten
      minste 25% zal afwijken van 25 maal het gemiddelde premieplichtige loon per werknemer in het tweede kalenderjaar
      dat aan het premiebetalingstijdvak vooraf is gegaan en de omvang van het verwachte premieplichtige loon leidt tot
      een andere indeling. Een aanvraag als bedoeld in de eerste zin wordt ingediend uiterlijk 6 weken nadat de werkgever
      schriftelijk in kennis is gesteld van de door hem in het premiebetalingstijdvak verschuldigde gedifferentieerde
      premie, bedoeld in [artikel 38 van de Wfsv][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
  - number: 2.6.3
    text: Het gemiddelde premieplichtige loon, bedoeld in het eerste lid, onderdelen b en c, wordt vastgesteld door het UWV.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.6
  - number: 2.6.4
    text: |-
      Bij de vaststelling van het ten laste van een werkgever komende premieplichtige loon, bedoeld in het eerste
      lid, onderdelen b en c, worden de via de werkgever betaalde arbeidsongeschiktheidsuitkeringen die op grond van
      [artikel 117 van de Wfsv][ref1] ten laste van de Arbeidsongeschiktheidskas komen en WGA-uitkeringen die op grond
      van [artikel 117b][ref2] ten laste van de Werkhervattingskas komen, buiten aanmerking gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '117'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 117b
  - number: 2.7.1
    text: |-
      Het rekenpercentage, bedoeld in [artikel 38, eerste lid, onderdeel a, van de Wfsv][ref1], is gelijk aan het
      gemiddelde percentage, bedoeld in [artikel 38, eerste lid, onderdeel b, van de Wfsv][ref2] vermeerderd of
      verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '38'
  - number: 2.7.1.a
    text: |-
      een percentage ter compensatie van het naar verwachting over het premiebetalingstijdvak optredende
      verschil tussen enerzijds de premie-inkomsten die worden verkregen indien de gedifferentieerde premie,
      bedoeld in [artikel 38 van de Wfsv][ref1], wordt gebaseerd op het gemiddelde percentage bedoeld in
      [artikel 38, eerste lid, onderdeel b, van de Wfsv][ref2], verminderd met de premie-inkomsten die het gevolg zijn
      van de opslag, bedoeld in [artikel 2.8, tweede lid][ref3], en anderzijds het totaalbedrag dat naar verwachting in
      het premiebetalingstijdvak op grond van [artikel 117b van de Wfsv][ref4] ten laste van de Werkhervattingskas komt,
      verminderd met de gelden die op grond van [artikel 117a, onderdelen b en c, van de Wfsv][ref5] naar verwachting ten
      gunste van de Werkhervattingskas komen;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel117a
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0017745
        artikel: 117b
      - id: ref5
        bwb_id: BWBR0017745
        artikel: 117a
  - number: 2.7.1.b
    text: |-
      een percentage, voor zover dit nodig of mogelijk is, rekening houdend met de verplichting, bedoeld in
      [artikel 113a van de Wfsv][ref1], betreffende het vormen en in stand houden van een voldoende reserve,
      met dien verstande dat bij de bepaling van dit percentage de opbrengst van de opslag, bedoeld in
      [artikel 2.8, tweede lid][ref2], in het premiebetalingstijdvak en in de daaraan voorafgaande kalenderjaren buiten
      beschouwing wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel113a
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 113a
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.7.2
    text: De percentages, bedoeld in het eerste lid, worden naar beneden afgerond op twee cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.7
  - number: 2.8.1
    text: |-
      Het gemiddelde percentage, bedoeld in [artikel 38, eerste lid, onderdeel b, van de Wfsv][ref1], wordt
      vastgesteld door het totaalbedrag van hetgeen in het premiebetalingstijdvak naar verwachting op grond van
      [artikel 117b van de Wfsv][ref2] ten laste komt van de Werkhervattingskas, verminderd met hetgeen op grond van
      [artikel 117a, onderdelen b en c, van de Wfsv][ref3] in het premiebetalingstijdvak naar verwachting ten gunste
      komt van de Werkhervattingkas, te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het
      totaalbedrag van de over het premiebetalingstijdvak verwachte premieplichtige loonsom en de naar verwachting in dat
      jaar te betalen uitkeringen, bedoeld in [artikel 38a, eerste lid, van de Wfsv][ref4]. Onder uitkeringen als bedoeld
      in de eerste zin worden niet verstaan de WGA-uitkeringen waarvan het risico van de betaling wordt gedragen door een
      werkgever als bedoeld in [artikel 40 van de Wfsv][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel117a
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel38a
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 117b
      - id: ref3
        bwb_id: BWBR0017745
        artikel: 117a
      - id: ref4
        bwb_id: BWBR0017745
        artikel: 38a
      - id: ref5
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 2.8.2
    text: |-
      De gemiddelde premie, bedoeld in het eerste lid, kan worden verhoogd met een bij ministeriële regeling vast te
      stellen percentage.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.8
  - number: 2.8.3
    text: De uitkomst van de deling, bedoeld in het eerste lid, wordt naar beneden afgerond op twee cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.8
  - number: 2.9.1
    text: |-
      De opslag of korting, bedoeld in [artikel 38, tweede lid, van de Wfsv][ref1], is voor alle werkgevers gelijk aan
      het individuele werkgeversrisicopercentage verminderd met het gemiddelde werkgeversrisicopercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
  - number: 2.9.2
    text: 'Het individuele werkgeversrisicopercentage, bedoeld in het eerste lid, wordt verkregen door de som van:'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
  - number: 2.9.2.a
    text: |-
      het totaalbedrag van de op grond van [artikel 117 van de Wfsv][ref1] ten laste van de Arbeidsongeschiktheidskas
      komende aan de werkgever toe te rekenen arbeidsongeschiktheidsuitkeringen, die in het tweede kalenderjaar vóór
      het premiebetalingstijdvak zijn betaald aan werknemers die bij het intreden van de arbeidsongeschiktheid op grond
      waarvan de in het zevende lid bedoelde arbeidsongeschiktheidsuitkeringen worden toegekend, in dienstbetrekking
      stonden tot een werkgever, en


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '117'
  - number: 2.9.2.b
    text: |-
      het totaalbedrag van de op grond van [artikel 117b van de Wfsv][ref1] ten laste van de Werkhervattingskas komende
      aan de werkgever toe te rekenen WGA-uitkeringen die in het tweede kalenderjaar vóór het premiebetalingstijdvak zijn
      betaald aan werknemers die bij het intreden van de arbeidsongeschiktheid op grond waarvan de WGA-uitkeringen worden
      toegekend, in dienstbetrekking stonden tot een werkgever,


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 117b
  - number: 2.9.3
    text: 'Het gemiddelde werkgeversrisicopercentage, bedoeld in het eerste lid, wordt verkregen door de som van:'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
  - number: 2.9.3.a
    text: |-
      het totaalbedrag van de op grond van [artikel 117 van de Wfsv][ref1], ten laste van de Arbeidsongeschiktheidskas
      komende aan werkgevers toe te rekenen arbeidsongeschiktheidsuitkeringen, die in het tweede kalenderjaar vóór het
      premiebetalingstijdvak zijn betaald, en


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '117'
  - number: 2.9.3.b
    text: |-
      het totaalbedrag van de op grond van [artikel 117b van de Wfsv][ref1], ten laste van de Werkhervattingskas komende
      aan werkgevers toe te rekenen WGA-uitkeringen, die in het tweede kalenderjaar vóór het premiebetalingstijdvak zijn
      betaald,


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 117b
  - number: 2.9.4
    text: |-
      In het tweede en derde lid wordt voor WGA-uitkeringen die zijn betaald in het kalenderjaar 2006 voor
      «Werkhervattingskas» gelezen «Arbeidsongeschiktheidsfonds».
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
  - number: 2.9.5
    text: |-
      Indien een WGA-uitkering wordt toegekend direct aansluitend op een arbeidsongeschiktheidsuitkering op grond van
      de [Wet werk en inkomen naar arbeidsvermogen][ref1] wordt de duur van die uitkering in mindering gebracht op de
      periode dat de WGA-uitkering wordt toegerekend als bedoeld in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 2.9.6
    text: |-
      Bij de berekening van het gemiddelde premieplichtig loon, bedoeld in het tweede en derde lid, worden de via
      de werkgever betaalde arbeidsongeschiktheidsuitkeringen, bedoeld in [artikel 117 van de Wfsv][ref1], en WGA-
      uitkeringen, bedoeld in [artikel 117b van de Wfsv][ref2], buiten aanmerking gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '117'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 117b
  - number: 2.9.7
    text: |-
      De arbeidsongeschiktheidsuitkeringen, bedoeld in het tweede lid, onderdeel a, en derde lid, onderdeel a, betreffen
      de arbeidsongeschiktheidsuitkeringen die zijn toegekend:
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
  - number: 2.9.7.a
    text: |-
      aan de werknemers die op de eerste dag van de ongeschiktheid tot het verrichten van hun arbeid als bedoeld in
      [artikel 19 van de Ziektewet][ref1] tot de werkgever in dienstbetrekking stonden en terzake van die ongeschiktheid
      de wachttijd, bedoeld in [artikel 19 van de WAO][ref2], hebben doorgemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 2.9.7.b
    text: |-
      met toepassing van [artikel 43a, eerste lid, onderdeel a, van de WAO][ref1] nadat de
      arbeidsongeschiktheidsuitkering toegekend aan de werknemer, bedoeld in onderdeel a, is ingetrokken op grond van
      [artikel 43, eerste lid, van de WAO][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '43'
  - number: 2.9.7.c
    text: |-
      met toepassing van [artikel 43a, eerste lid, onderdeel b, van de WAO][ref1] aan de werknemer, bedoeld in onderdeel
      a, die aan het einde van de wachttijd ongeschikt was tot het verrichten van zijn arbeid wegens ziekte of gebreken,
      maar geen recht had op toekenning van een arbeidsongeschiktheidsuitkering omdat hij niet arbeidsongeschikt was.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
  - number: 2.9.8
    text: |-
      De WGA-uitkeringen, bedoeld in het tweede lid, onderdeel b, en derde lid, onderdeel b betreffen de WGA-uitkeringen
      die zijn toegekend:
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
  - number: 2.9.8.a
    text: |-
      aan de werknemers die op de eerste dag van de ongeschiktheid tot het verrichten van hun arbeid als bedoeld in
      [artikel 19 van de Ziektewet][ref1] tot de werkgever in dienstbetrekking stonden en terzake van die ongeschiktheid
      de wachttijd, bedoeld in [artikel 23 van Wet WIA][ref2], hebben doorgemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '23'
  - number: 2.9.8.b
    text: |-
      aan de werknemer, bedoeld in onderdeel a, van wie het recht op een WGA-uitkering op grond van
      [artikel 55 van de Wet WIA][ref1] later dan op de eerste dag na afloop van de wachttijd of indien op die dag de
      uitsluitingsgrond, bedoeld in [artikel 43, onderdeel b, van die wet][ref2] van toepassing is, op de dag dat zich
      die uitsluitingsgrond niet meer voordoet, is ontstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '43'
  - number: 2.9.8.c
    text: |-
      aan de werknemer, bedoeld in onderdeel a, van wie het recht op een WGA-uitkering op grond van
      [artikel 57 van de Wet WIA][ref1] is herleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel57
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '57'
  - number: 2.9.9
    text: |-
      Indien de werknemer bij het intreden van de arbeidsongeschiktheid, bedoeld in het zevende lid, onderdeel a, of
      gedeeltelijke arbeidsgeschiktheid, bedoeld in [artikel 5 van de Wet werk en inkomen naar arbeidsvermogen][ref1],
      bij meer dan één werkgever in dienstbetrekking stond, wordt voor de toepassing van het tweede lid de
      arbeidsongeschiktheidsuitkering of de WGA-uitkering naar rato van de loonsom toegerekend aan die werkgevers. De
      arbeidsongeschiktheidsuitkering of de WGA-uitkering wordt niet toegerekend aan de werkgever bij wie de werknemer
      met behoud van hetzelfde loon arbeid is blijven verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel5
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '5'
  - number: 2.9.10
    text: |-
      Voor de toepassing van het tweede en derde lid worden de door het UWV toegekende arbeidsongeschiktheidsuitkeringen
      en de vakantieuitkeringen die in de periode, bedoeld in [artikel 117, eerste lid, aanhef, van de Wfsv][ref1],
      geheel of ten dele niet aan de werknemer zijn uitbetaald wegens het genieten van loon als bedoeld in
      [artikel 44, derde lid, van de WAO][ref2], geacht aan de werknemer te zijn uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '117'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '44'
  - number: 2.9.11
    text: |-
      De uitkomst van de deling, bedoeld in het tweede en derde lid, wordt naar beneden afgerond op twee cijfers achter
      de komma.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
  - number: 2.9.12
    text: |-
      De op grond van dit artikel berekende opslagen of kortingen worden vermenigvuldigd met een breuk, waarvan de teller
      wordt gevormd door het gemiddeld percentage, bedoeld in [artikel 2.8][ref1], en de noemer door het gemiddelde
      werkgeversrisicopercentage, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.9.13
    text: |-
      De uitkomst van de berekening, bedoeld in het twaalfde lid, wordt naar beneden afgerond op twee cijfers achter
      de komma.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.9
  - number: 2.10.1
    text: |-
      In geval van overgang van een onderneming in de zin van [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1],
      alsmede in geval van een dergelijke overgang bij faillissement:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: 2.10.1.a
    text: |-
      worden bij de toepassing van [artikel 2.9][ref1] de arbeidsongeschiktheidsuitkeringen, bedoeld in
      [artikel 2.9, tweede lid, onderdeel a, en derde lid, onderdeel a][ref2], en de WGA-uitkeringen, bedoeld in
      [artikel 2.9, tweede lid, onderdeel b, en derde lid, onderdeel b][ref3], die zijn of worden toegekend aan de
      werknemer die op de eerste dag van de ongeschiktheid tot het verrichten van zijn arbeid in dienstbetrekking stond
      tot de werkgever die de onderneming heeft overgedragen, toegerekend aan de werkgever die de onderneming verkrijgt;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.10.1.b
    text: |-
      wordt bij de toepassing van [artikel 2.9][ref1] het ten laste van de werkgever die de onderneming heeft
      overgedragen, gekomen premieplichtig loon in enig premiebetalingstijdvak telkens opgeteld bij het premieplichtig
      loon van de werkgever die de onderneming verkrijgt in dat premiebetalingstijdvak, voordat het gemiddelde
      premieplichtig loon van laatstgenoemde werkgever wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.10.2
    text: |-
      Indien slechts een deel van de onderneming overgaat, vindt het eerste lid toepassing naar rato van het deel
      van het totaalbedrag van premieplichtig loon in het overgegane deel van de onderneming van het totaalbedrag van
      premieplichtig loon in de gehele onderneming in het jaar voorafgaande aan dat van overgang.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Tenzij de overgang plaatsvindt op 1 januari van het kalenderjaar vindt voor de werkgever die reeds de hoedanigheid
      van werkgever had voor het moment van overgang van de onderneming de toerekening, bedoeld in het eerste lid,
      onderdeel a, en de optelling, bedoeld in het eerste lid, onderdeel b, eerst plaats met ingang van het kalenderjaar
      volgend op het kalenderjaar waarin de onderneming of een deel van de onderneming is overgedragen.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.10
  - number: 2.11.1
    text: |-
      Indien blijkt dat een arbeidsongeschiktheidsuitkering als bedoeld in [artikel 2.9, tweede lid, onderdeel a][ref1],
      of een WGA-uitkering als bedoeld in [artikel 2.9, tweede lid, onderdeel b][ref2], geheel of ten dele ten onrechte
      is toegekend, wordt bij de berekening van het individuele werkgeversrisicopercentage in het kalenderjaar waarin het
      besluit tot toekenning van de arbeidsongeschiktheidsuitkering of de WGA-uitkering wordt ingetrokken of herzien, het
      totaalbedrag, bedoeld in [artikel 2.9, tweede lid][ref3], verminderd met een bedrag dat gelijk is aan het bedrag
      van de te veel betaalde arbeidsongeschiktheidsuitkering of WGA-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.11.2
    text: |-
      Indien een schadevergoeding als bedoeld in [artikel 107a, tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref1]
      dan wel een schadevergoeding op grond van een wettelijke regeling die daarmee naar aard en strekking overeenkomt,
      is ontvangen, wordt, op verzoek van de werkgever, bij de berekening van het individuele werkgeversrisicopercentage
      met ingang van het kalenderjaar waarin de schadevergoeding is ontvangen, gedurende een tijdvak van vijf jaren
      voor een arbeidsongeschiktheidsuitkering en gedurende een tijdvak van tien jaren voor een WGA-uitkering, het
      totaalbedrag, bedoeld in [artikel 2.9, tweede lid][ref2], verminderd met een compensatiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel107a
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 107a
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.11.3
    text: |-
      Het compensatiebedrag, bedoeld in het tweede lid, wordt vastgesteld door het bedrag van de
      arbeidsongeschiktheidsuitkering of de WGA-uitkering aan de betrokken werknemer jaarlijks gedurende vijf
      jaar onderscheidenlijk tien jaar te vermenigvuldigen met het getal dat is verkregen door het bedrag van de
      schadevergoeding, bedoeld in het tweede lid, te delen door het loon over een tijdvak van 52 weken onderscheidenlijk
      104 weken. Het getal, bedoeld in de eerste zin, bedraagt niet meer dan 1.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.11
  - number: 2.11.4
    text: |-
      In afwijking van het derde lid wordt in de gevallen waarin ziekengeld wordt uitgekeerd aan de verzekerde,
      bedoeld in [artikel 29 van de Ziektewet][ref1], het compensatiebedrag, bedoeld in het tweede lid, vastgesteld
      door het bedrag van de arbeidsongeschiktheidsuitkering of de WGA-uitkering aan de betrokken werknemer te
      vermenigvuldigen met het getal dat is verkregen door het bedrag van het ontvangen verhaal op grond van
      [artikel 52a van de Ziektewet][ref2] te delen door het aan betrokken werknemer op grond van de [Ziektewet][ref3]
      uitgekeerde ziekengeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel52a
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 52a
      - id: ref3
        bwb_id: BWBR0001888
  - number: 2.11.5
    text: |-
      De uitkomst van de berekening, bedoeld in het derde en vierde lid, wordt naar beneden afgerond op twee cijfers
      achter de komma.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.11
  - number: 2.11.6
    text: |-
      Het tweede, derde en vierde lid zijn uitsluitend van toepassing in die gevallen waarin de
      arbeidsongeschiktheidsuitkering is ingegaan op of na 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.11
  - number: 2.11.7
    text: |-
      Bij toepassing van het tweede en derde lid wordt indien sprake is van WGA-uitkeringen waarvan het recht is ontstaan
      vóór 1 januari 2007 voor «tien jaren» en «tien jaar» onderscheidenlijk gelezen «vier jaren» en «vier jaar».
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.11
  - number: 2.12.1
    text: |-
      Indien een werkgever, zonder dat er sprake is van een overgang van een onderneming als bedoeld
      in [artikel 2.10][ref1] in een of meer van de kalenderjaren van het tijdvak, bedoeld in
      [artikel 2.9, tweede lid][ref2], niet de hoedanigheid van werkgever had, wordt bij de berekening van het
      individuele werkgeversrisicopercentage, bedoeld in [artikel 2.9, tweede lid][ref3], het ten laste van die
      werkgever komende gemiddelde premieplichtige loon per jaar berekend over het aantal kalenderjaren in het
      tijdvak, bedoeld in [artikel 2.9, tweede lid][ref4], waarin de werkgever de hoedanigheid van werkgever had,
      waarna het verkregen percentage wordt vermenigvuldigd met een breuk, waarvan de teller wordt gevormd door
      het gemiddelde werkgeversrisicopercentage, bedoeld in [artikel 2.9, derde lid][ref5], en de noemer door het
      gemiddelde werkgeversrisicopercentage, berekend over het aantal kalenderjaren in het tijdvak, bedoeld in
      [artikel 2.9, derde lid][ref6], waarin de werkgever de hoedanigheid van werkgever had.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.12.2
    text: |-
      De uitkomst van de berekening, bedoeld in het eerste lid, wordt naar beneden afgerond op twee cijfers achter de
      komma.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.12
  - number: '2.13'
    text: |-
      Voor een werkgever die, zonder dat er sprake is van een overgang van een onderneming als bedoeld in
      [artikel 2.10][ref1], eerst in het premiebetalingstijdvak, of in het eerste of tweede kalenderjaar onmiddellijk
      voorafgaande aan het premiebetalingstijdvak de hoedanigheid van werkgever heeft verkregen, is het percentage van de
      gedifferentieerde premie, bedoeld in [artikel 38 van de Wfsv][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '38'
  - number: 2.13.a
    text: |-
      indien het een kleine werkgever betreft gelijk aan het overeenkomstig [artikel 2.14, tweede lid][ref1],
      vastgestelde percentage;


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.13.b
    text: |-
      indien het een grote werkgever betreft gelijk aan het rekenpercentage, bedoeld in [artikel 2.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.14.1
    text: |-
      De gedifferentieerde premie, bedoeld in [artikel 38 van de Wfsv][ref1], bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
  - number: 2.14.1.a
    text: |-
      voor een kleine werkgever: ten minste het overeenkomstig het tweede lid vastgestelde percentage en ten hoogste drie
      maal het gemiddelde percentage, bedoeld in [artikel 2.8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.14.1.b
    text: |-
      voor een grote werkgever: ten minste het verschil tussen het rekenpercentage, bedoeld in [artikel 2.7][ref1], en
      het gemiddeld percentage, bedoeld in [artikel 2.8][ref2], maar niet minder dan nihil en ten hoogste vier maal het
      gemiddelde percentage, bedoeld in [artikel 2.8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.14.2
    text: |-
      De voor kleine werkgevers geldende minimale gedifferentieerde premie wordt door het UWV voor elk
      premiebetalingstijdvak op een zodanig percentage vastgesteld, dat de uit de heffing van deze minimaal verschuldigde
      premie voortvloeiende extra inkomsten naar verwachting gelijk zullen zijn aan de extra premieinkomsten die zouden
      worden verworven indien geen maximum zou zijn gesteld aan de door deze werkgevers verschuldigde gedifferentieerde
      premie, verminderd met de naar verwachting ten laste van de kleine werkgevers komende premieinkomsten ten gevolge
      van de voor grote werkgevers krachtens het eerste lid, onderdeel b, geldende maximale gedifferentieerde premie.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.14
  - number: 2.14.3
    text: |-
      Indien de toepassing van [artikel 2.11][ref1] daartoe aanleiding geeft, wordt in afwijking van het eerste lid:


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.14.3.a
    text: |-
      voor een grote werkgever een premiepercentage van lager dan de minimumpremie, bedoeld in het eerste lid, onderdeel
      b, vastgesteld;
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.14
  - number: 2.14.3.b
    text: |-
      voor een kleine werkgever een premiepercentage van lager dan de minimumpremie, bedoeld in het tweede lid,
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.14
  - number: 2.14.4
    text: De percentages, bedoeld in het derde lid, worden naar beneden afgerond op twee cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.14
  - number: '2.15'
    text: |-
      Een overheveling van gelden uit het Arbeidsongeschiktheidsfonds naar de Werkhervattingskas als bedoeld in
      [artikel 118 van de Wfsv][ref1] vindt plaats tot ten hoogste het bedrag van de WGA-uitkeringen die in een
      kalenderjaar ten laste van de Werkhervattingskas komen en die betrekking hebben op het jaar 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel118
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '118'
  - number: '3.1'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.1
  - number: 3.1.a
    text: |-
      ANW: de [Algemene nabestaandenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 3.1.b
    text: 'ANW-premie: de premie voor de vrijwillige nabestaandenverzekering;'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.1
  - number: 3.1.c
    text: |-
      AOW: de [Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 3.1.d
    text: 'AOW-premie: de premie voor de vrijwillige ouderdomsverzekering.'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.1
  - number: 3.3.1
    text: |-
      De AOW-premie wordt voor elk in de periode van vrijwillige verzekering voor de [AOW][ref1] gelegen vol kalenderjaar
      vastgesteld volgens de formule: P x I – H, waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 3.3.1.a
    text: |-
      P gelijk is aan het premiepercentage, bedoeld in [artikel 11, eerste lid, van de Wfsv][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
  - number: 3.3.1.b
    text: |-
      I gelijk is aan het hoogste bedrag dat als premie-inkomen in de zin van [artikel 8, eerste lid, van de Wfsv][ref1]
      in aanmerking genomen wordt, te weten het als tweede vermelde bedrag in kolom II van de tarieftabel in
      [artikel 2.10 van de Wet inkomstenbelasting 2001][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 3.3.1.c
    text: |-
      H gelijk is aan de heffingskorting, bedoeld in [artikel 12, eerste lid, onderdeel a][ref1], met dien
      verstande dat voor de toepassing van dat artikelonderdeel tot de standaardheffingskorting, bedoeld in
      [artikel 8.2 van de Wet inkomstenbelasting 2001][ref2], alleen geacht wordt te behoren de algemene heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 3.3.2
    text: |-
      De ANW-premie wordt voor elk in de periode van vrijwillige verzekering voor de [ANW][ref1] gelegen vol kalenderjaar
      vastgesteld volgens de formule: P x I – H, waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 3.3.2.a
    text: |-
      P gelijk is aan het premiepercentage, bedoeld in [artikel 11, tweede lid, van de Wfsv][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
  - number: 3.3.2.b
    text: |-
      I gelijk is aan het hoogste bedrag dat als premie-inkomen in de zin van [artikel 8, eerste lid, van de Wfsv][ref1]
      in aanmerking genomen wordt, te weten het als tweede vermelde bedrag in kolom II van de tarieftabel in
      [artikel 2.10 van de Wet inkomstenbelasting 2001][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 3.3.2.c
    text: |-
      H gelijk is aan de heffingskorting, bedoeld in [artikel 12, eerste lid, onderdeel b][ref1], met dien
      verstande dat voor de toepassing van dat artikelonderdeel tot de standaardheffingskorting, bedoeld in
      [artikel 8.2 van de Wet inkomstenbelasting 2001][ref2], alleen geacht wordt te behoren de algemene heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 3.3.3
    text: |-
      In afwijking van de onderdelen b van het tweede en derde lid is indien ten aanzien van de SVB aannemelijk
      wordt gemaakt dat dit tot een lagere uitkomst leidt, I gelijk aan het feitelijke premie-inkomen in de zin van
      [artikel 8, eerste lid, van de Wfsv][ref1]. Hierbij wordt de waarde van inkomen in natura door de SVB geschat,
      uitgaande van de waarde van dat inkomen in het land waar het wordt of werd ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel8
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '8'
  - number: 3.3.4
    text: |-
      De AOW- of ANW-premie, die is vastgesteld met toepassing van het vierde lid bedraagt ten minste 10% van de AOW- of
      ANW-premie vastgesteld op grond van het tweede onderscheidenlijk derde lid.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
  - number: 3.3.5
    text: |-
      Voorzover de vrijwillige verzekering slechts betrekking heeft op een gedeelte van een kalenderjaar wordt de premie
      naar tijdsruimte evenredig verminderd.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
  - number: 3.3.6
    text: |-
      De SVB stelt op verzoek van de belanghebbende die een gedeelte van het kalenderjaar van rechtswege verzekerd is
      voor de [AOW][ref1] of de [ANW][ref2], de AOW-premie of de ANW-premie over dat kalenderjaar zodanig vast dat de
      over het kalenderjaar verschuldigde premie voor de verplichte en de vrijwillige verzekering niet meer bedraagt
      dan de premie die maximaal verschuldigd zou zijn indien het gehele kalenderjaar sprake zou zijn van verplichte
      verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: 3.3.7
    text: |-
      Niet in euro uitgedrukt premie-inkomen wordt vastgesteld in de valuta van het desbetreffende land en wordt met
      behulp van de door de Europese Centrale Bank geadviseerde wisselkoersen omgerekend in euro.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
  - number: 3.3.8
    text: Voor de toepassing van het derde lid wordt het inkomen geacht te zijn ontvangen in Nederland.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.3
  - number: 3.4.1
    text: 'De SVB kan de verschuldigde premie over een kalenderjaar voorlopig vaststellen, indien:'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.4
  - number: 3.4.1.a
    text: |-
      zij bij de vaststelling van die premie rekening dient te houden met de in dat kalenderjaar verschuldigde premie op
      grond van de verplichte verzekering ingevolge de [AOW][ref1] of de [ANW][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: 3.4.1.b
    text: |-
      nog onduidelijk is of [artikel 3.3, derde lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel3
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.2
    text: |-
      Zodra dat naar het oordeel van de SVB mogelijk is, wordt de over bedoeld kalenderjaar verschuldigde premie
      definitief vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Te veel betaalde premie wordt terugbetaald. Nog verschuldigde premie wordt binnen een door de SVB vast te stellen
      termijn betaald.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.4
  - number: 3.5.1
    text: |-
      De gewezen verzekerde, bedoeld in [artikel 35 van de AOW][ref1] en [artikel 63a van de ANW][ref2], die is
      toegelaten tot de vrijwillige verzekering, betaalt de premie, per kalenderjaar, vooruit.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel63a
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0007795
        artikel: 63a
  - number: 3.5.2
    text: |-
      Indien de gewezen verzekerde, bedoeld in [artikel 63a van de ANW][ref1], een aanvraag tot gebruikmaking van de
      vrijwillige verzekering heeft ingediend en overlijdt, voordat hij de verschuldigde ANW-premie heeft kunnen betalen,
      is een ander bevoegd alsnog de verschuldigde ANW-premie over de periode van vrijwillige verzekering te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63a
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 63a
  - number: '3.6'
    text: |-
      Indien de vrijwillige verzekering is geëindigd op grond van [artikel 37, onderdelen a, e of f, van de AOW][ref1],
      of van [artikel 63c, onderdelen a, d of e, van de ANW][ref2], vindt restitutie van reeds betaalde premie niet
      plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel63c
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0007795
        artikel: 63c
  - number: '3.7'
    text: |-
      Indien een verzekerde als bedoeld in [artikel 38 van de AOW][ref1] binnen drie maanden na de door de SVB gestelde
      termijn de verschuldigde AOW-premie niet geheel heeft betaald, wordt over een zodanig gedeelte van de periode,
      waarop de premiebetaling betrekking heeft, geacht AOW-premie te zijn betaald als de betaalde AOW-premie zich
      verhoudt tot de totaal verschuldigde AOW-premie. Daarbij wordt geacht AOW-premie te zijn betaald over de periode,
      welke het verst verwijderd ligt van het tijdstip van de aanvang van de verplichte verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel38
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '38'
  - number: 3.8.1
    text: |-
      Indien de vrijwillige verzekering is geëindigd, wordt voorzover dit nog niet heeft plaatsgevonden, de over ieder
      kalenderjaar verschuldigde premie definitief vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.8
  - number: 3.8.2
    text: |-
      Indien het eerste lid toepassing heeft gevonden, wordt de betaalde premie geacht betrekking te hebben op de
      achtereenvolgende gehele kalenderjaren of, voorzover de belanghebbende gedurende slechts een gedeelte van een of
      meer kalenderjaren niet verplicht verzekerd was, op de betreffende gedeelten van die gehele kalenderjaren, die het
      dichtst liggen bij het tijdstip waarop de verplichte verzekering is geëindigd.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.8
  - number: 3.8.3
    text: |-
      Indien na toepassing van het eerste lid de over een kalenderjaar verschuldigde premie niet geheel blijkt te zijn
      voldaan, wordt over een zodanig gedeelte van dat kalenderjaar geacht premie te zijn betaald, als de nog toe te
      rekenen premie zich verhoudt tot de totaal over dit kalenderjaar verschuldigde premie.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel3.8
  - number: '4.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
  - number: 4.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
  - number: 4.1.b
    text: |-
      AFBZ: het Algemeen Fonds Bijzondere Ziektekosten, genoemd in [artikel 89 van de Wfsv][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel89
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '89'
  - number: 4.1.c
    text: |-
      AWBZ: de [Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 4.1.d
    text: |-
      kosten van verstrekkingen en vergoedingen: kosten van verstrekkingen en vergoedingen ter zake van verleende zorg
      als bedoeld in [artikel 6 van de AWBZ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 4.1.e
    text: |-
      beheerskosten: de beheerskosten van de in de [AWBZ][ref1] geregelde verzekering, waaronder begrepen de kosten van
      controle in het kader van die verzekering;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 4.1.f
    text: |-
      centraal administratiekantoor: het centraal administratiekantoor, bedoeld in het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003585
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0003585
  - number: 4.1.g
    text: |-
      zorgverzekeraar: een zorgverzekeraar als bedoeld in [artikel 1, eerste lid, onderdeel b, van de AWBZ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '1'
  - number: 4.1.h
    text: |-
      verbindingskantoor: een verbindingskantoor als bedoeld in het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003585
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0003585
  - number: 4.1.i
    text: |-
      onverantwoorde uitgaven: uitgaven waarvan de Nederlandse zorgautoriteit heeft vastgesteld dat ze niet noodzakelijk
      zijn voor de uitvoering van de verzekering ingevolge de [AWBZ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 4.1.j
    text: |-
      beheerskostenbudget: de ten laste van het AFBZ voor het centraal administratiekantoor, de zorgverzekeraars en
      de verbindingskantoren beschikbare middelen ter dekking van de voor de uitvoering van de [AWBZ][ref1] te maken
      beheerskosten die zij in hun hoedanigheid maken;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 4.1.k
    text: |-
      zorgautoriteit: de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: 4.1.l
    text: |-
      College zorgverzekeringen: het College voor zorgverzekeringen, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '4.2'
    text: |-
      Het College zorgverzekeringen vergoedt uit het AFBZ jaarlijks aan de zorgverzekeraars de kosten van verstrekkingen
      en vergoedingen naar werkelijke kosten. Daarbij blijven onverantwoorde uitgaven buiten beschouwing, tenzij de
      zorgautoriteit anders besluit.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.2
  - number: 4.4.1
    text: |-
      Het College zorgverzekeringen stelt jaarlijks, in het kader van de verdeling van de voor het kalenderjaar krachtens
      [artikel 4.3][ref1] beschikbaar gestelde middelen, voor iedere zorgverzekeraar afzonderlijk ten laste van het
      AFBZ het beheerskostenbudget vast ter dekking van de beheerskosten die zij maken anders dan in de hoedanigheid
      van verbindingskantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel4
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.2
    text: |-
      De vaststelling van het beheerskostenbudget, bedoeld in het eerste lid, geschiedt aan de hand van de door het
      College zorgverzekeringen vast te stellen beleidsregels.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.4
  - number: 4.4.3
    text: De beleidsregels, bedoeld in het tweede lid, behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.4
  - number: 4.4.4
    text: |-
      In geval van onthouding van goedkeuring aan een beleidsregel stelt het College zorgverzekeringen, met inachtneming
      van door Onze Minister te geven instructies, een nieuwe beleidsregel vast.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.4
  - number: 4.4.5
    text: |-
      Indien Onze Minister aan de beleidsregel, bedoeld in het vierde lid, eveneens goedkeuring onthoudt, stelt hij
      terzake zelf de beleidsregel vast.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.4
  - number: 4.4.6
    text: |-
      Het College zorgverzekeringen keert jaarlijks uit het AFBZ aan een zorgverzekeraar het voor die zorgverzekeraar op
      grond van het eerste lid vastgestelde beheerskostenbudget uit.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.4
  - number: 4.4.7
    text: |-
      Indien een zorgverzekeraar op een naar het oordeel van de zorgautoriteit onverantwoorde wijze op zijn beheerskosten
      bespaart, wordt de uitkering, bedoeld in het zesde lid, voor het desbetreffende kalenderjaar door het College
      zorgverzekeringen verlaagd met het bedrag van die besparing.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.4
  - number: 4.5.1
    text: |-
      Het College zorgverzekeringen stelt jaarlijks, in het kader van de verdeling van de voor het kalenderjaar krachtens
      [artikel 4.3][ref1] beschikbaar gestelde middelen, afzonderlijk voor ieder verbindingskantoor en voor het centraal
      administratiekantoor het beheerskostenbudget vast.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel4
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.5.2
    text: |-
      De vaststelling van het beheerskostenbudget, bedoeld in het eerste lid, geschiedt aan de hand van
      door het College zorgverzekeringen vast te stellen beleidsregels. Ten aanzien van die beleidsregels is
      [artikel 4.4, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel4
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.5.3
    text: |-
      Het College zorgverzekeringen keert jaarlijks uit het AFBZ aan de verbindingskantoren en het centraal
      administratiekantoor het voor hen ingevolge het eerste lid vastgestelde beheerskostenbudget uit.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.5
  - number: 4.5.4
    text: |-
      Indien een verbindingskantoor of het centraal administratiekantoor op een naar het oordeel van de zorgautoriteit
      onverantwoorde wijze op zijn beheerskosten bespaart, wordt de uitkering, bedoeld in het eerste lid, voor het
      desbetreffende kalenderjaar door het College zorgverzekeringen verlaagd met het bedrag van die besparing.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.5
  - number: 4.5.5
    text: |-
      Een verbindingskantoor en het centraal administratiekantoor houden een reserve uitvoering [AWBZ][ref1] aan.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 4.5.6
    text: |-
      Het saldo van baten en lasten over enig boekjaar van een verbindingskantoor voor de beheerskosten die het in of
      in verband met die hoedanigheid maakt, wordt toegevoegd aan, onderscheidenlijk ten laste gebracht van de reserve,
      bedoeld in het vijfde lid. Daarbij blijven onverantwoorde uitgaven buiten beschouwing, tenzij de zorgautoriteit
      anders besluit. De eerste zin is van overeenkomstige toepassing voor het centraal administratiekantoor.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.5
  - number: 4.5.7
    text: |-
      Bij het eindigen van de aanwijzing, bedoeld in [artikel 40 van de AWBZ][ref1], zonder dat aansluitend een nieuwe
      aanwijzing plaatsvindt, stort de rechtspersoon een bedrag ter hoogte van de reserve, bedoeld in het vijfde lid,
      binnen vier weken in het AFBZ.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel40
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '40'
  - number: '4.6'
    text: |-
      De reserve uitvoering [AWBZ][ref1], bedoeld in [artikel 4.5, vijfde lid][ref2], ultimo enig jaar, bedraagt voor
      verbindingskantoren maximaal 20% en voor het centraal administratiekantoor maximaal 5% van het beheerskostenbudget
      voor dat jaar. Indien het College zorgverzekeringen vaststelt dat de reserve het gestelde maximum te boven
      gaat, stort het verbindingskantoor of het centraal administratiekantoor het door het College zorgverzekeringen
      vastgestelde bedrag van de overschrijding binnen vier weken in het AFBZ.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel4
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '4'
        hoofdstuk: '4'
  - number: '4.7'
    text: |-
      De zorgautoriteit is bevoegd opgaven en gegevens van een zorgverzekeraar, verbindingskantoor en het centraal
      administratiekantoor, die van invloed zijn op de omvang van de ten laste van het AFBZ beschikbare middelen en
      op de hoogte van de verstrekkingen en vergoedingen ingevolge dit hoofdstuk, op hun juistheid te beoordelen en te
      verbeteren.
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.7
  - number: '4.8'
    text: |-
      Het College zorgverzekeringen bepaalt met inachtneming van het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref1] de wijze van betaalbaarstelling van de uitkeringen
      op grond van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0003585
    url: https://wetten.overheid.nl/BWBR0019070/2009-10-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0003585
  - number: '4.9'
