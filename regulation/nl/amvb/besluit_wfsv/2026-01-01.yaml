        artikel: 38g
  - number: 2.23.2
    text: |-
      De vaststelling van de variabelen, bedoeld in [artikel 38g, derde lid, van de Wfsv][ref1] wordt naar beneden
      afgerond op twee cijfers achter de komma.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38g
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.23
