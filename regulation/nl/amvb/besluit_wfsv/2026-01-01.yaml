    text: |-
      Het lage percentage van de AWf-premie, bedoeld in [artikel 2.2][ref1], is op grond van
      [artikel 27, derde lid, onderdeel a, van de Wfsv][ref2] slechts van toepassing indien de overeenkomst, bedoeld
      in dat onderdeel, is ondertekend door alle betrokken partijen en voorzien is van een dagtekening, en indien
      op die overeenkomst, dan wel op de daarmee samenhangende arbeidsovereenkomst, niet een beding als bedoeld in
      [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref3] van toepassing is


