    text: |-
      Het lage percentage van de AWf-premie, bedoeld in [artikel 2.2][ref1], wordt niet
      toegepast ten aanzien van werknemers op wier arbeidsovereenkomst een beding als bedoeld in
      [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref2] van toepassing is.


