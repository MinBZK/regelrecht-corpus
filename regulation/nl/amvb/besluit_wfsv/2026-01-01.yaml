    text: Dit artikel vervalt met ingang van 1 januari 2027.
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.3a
  - number: 2.4.1
    text: |-
      Een afschrift van de schriftelijke arbeidsovereenkomst voor onbepaalde tijd, bedoeld in
      [artikel 27, eerste lid, van de Wfsv][ref1], alsmede een schriftelijke of elektronische opgave als bedoeld in
      [artikel 7:626 van het Burgerlijk Wetboek][ref2] waarin de gegevens, genoemd in artikel 7:626, tweede lid, van het
      Burgerlijk Wetboek zijn opgenomen, over het tijdvak waarover hij loonaangifte doet, worden door de werkgever in
      zijn loonadministratie opgenomen indien hij het lage percentage, bedoeld in [artikel 2.2][ref3], toepast.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel626
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
