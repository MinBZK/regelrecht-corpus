        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: 2c
  - number: 2.31.b
    text: |-
      voor het bestuur van een openbaar lichaam als bedoeld in [artikel 8 van de Wet gemeenschappelijke regelingen][ref1]
      dan wel een privaatrechtelijke rechtspersoon die als uitvoerder van de [Wet sociale werkvoorziening][ref2] is
      aangewezen op grond van [artikel 1, tweede lid][ref3], dan wel [artikel 2 van de Wet sociale werkvoorziening][ref4]
      en als activiteit heeft het ter beschikking stellen van arbeidskrachten: elke persoon die arbeid verricht in een
      dienstbetrekking in de zin van artikel 2, eerste lid, van de Wet sociale werkvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008903
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.31
    references:
