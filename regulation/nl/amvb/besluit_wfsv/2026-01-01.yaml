  - number: '2.32'
    text: |-
      Voor de berekening van de quotumpercentages, bedoeld in [artikel 38f, tweede lid, van de Wfsv][ref1], wordt voor de
      toepassing van de variabelen van de formule, bedoeld in dat lid, het volgende in acht genomen:


