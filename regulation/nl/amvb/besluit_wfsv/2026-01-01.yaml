        artikel: '82'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.19b.3
    text: |-
      Indien de eigenrisicodrager een middelgrote werkgever is, wordt voor de toepassing van dit artikel het deel
      van de WGA- staartlasten in aanmerking genomen, dat bestaat uit deze lasten maal (1-(loonsomwgr – loonsomlaag)/
      (loonsomhoog –loonsomlaag)) waarbij: - loonsomwgr staat voor: de verzekerde loonsom van de middelgrote werkgever
      twee kalenderjaren voorafgaand aan de dag van aanvang van het eigenrisicodragen;
        - loonsomlaag staat voor: 10 maal het gemiddelde premieplichtige loon per werknemer, bedoeld in
      [artikel 2.5, tweede lid][ref1], twee kalenderjaren voorafgaand aan de dag van aanvang van het eigenrisicodragen;
        - loonsomhoog staat voor: 100 maal het gemiddelde premieplichtige loon per werknemer, bedoeld in
      [artikel 2.5, tweede lid][ref2], twee kalenderjaren voorafgaand aan de dag van aanvang van het eigenrisicodragen.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.19b
