        bwb_id: BWBR0017745
        artikel: 38f
  - number: 2.23.1
    text: |-
      Voor de toepassing van [artikel 38g, derde lid, van de Wfsv][ref1] wordt het gemiddeld aantal verloonde uren van
      arbeidsbeperkten in de sector overheid en de sector niet-overheid tezamen, bij ministeriële regeling vastgesteld
      met ingang van het bij die regeling te bepalen kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38g
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.23
