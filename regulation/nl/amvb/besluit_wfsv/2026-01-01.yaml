        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.3.4
    text: |-
      Bij een herziening als bedoeld in het eerste lid is het hoge percentage, bedoeld in [artikel 2.2][ref1], met
      terugwerkende kracht van toepassing op de twaalf maanden voorafgaand aan de beëindiging van de dienstbetrekking,
      op het kalenderjaar, bedoeld in het eerste lid, onderdeel b, of op de verstreken periode vanaf de aanvang van de
      dienstbetrekking indien deze minder dan twaalf maanden heeft geduurd. [Artikel 2.4a][ref2], is van overeenkomstige
      toepassing op de periode waarop met terugwerkende kracht het hoge percentage van toepassing is. Een herziening
      als bedoeld in het eerste lid vindt niet plaats voor het deel van de periode, dat is gelegen voor de datum van
      inwerkingtreding van [artikel III, onderdeel D, van de Wet arbeidsmarkt in balans][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0042307#ArtikelIII
