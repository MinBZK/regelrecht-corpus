    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.32
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38f
  - number: 2.32.a
    text: |-
      voor variabele D en E: het totaal aantal banen bij werkgevers in de sector overheid onderscheidenlijk de sector
      niet-overheid (variabele D) vermenigvuldigd met het gemiddeld aantal verloonde uren van werknemers in de sector
      overheid onderscheidenlijk de sector niet-overheid (variabele E), wordt verminderd met de verloonde uren van
      uitzendpersoneel in de zin van [artikel 2.27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.32
