    text: |-
      de WGA-uitkeringen, bedoeld in [artikel 117b, derde lid, onderdeel h, van de Wfsv][ref1], die zijn
      toegekend aan werknemers, die uit de dienstbetrekking waaruit de WGA-uitkering is ontstaan vóór 1 januari
      2017 ongeschikt zijn geworden tot het verrichten van hun arbeid als bedoeld in [artikel 19][ref2]
