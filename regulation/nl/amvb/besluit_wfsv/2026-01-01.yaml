  - number: 2.19a.1
    text: De overige ziekengeldlasten komen ten laste van de Werkhervattingskas.
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.19a
  - number: 2.19a.2
    text: De overige WGA-lasten komen ten laste van het Arbeidsongeschiktheidsfonds.
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.19a
  - number: 2.19b.1
    text: De WGA-staartlasten komen ten laste van het Arbeidsongeschiktheidsfonds.
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.19b
  - number: 2.19b.2
    text: |-
      De eigenrisicodrager draagt het risico van de betaling van de WGA- uitkeringen aan werknemers,
      bedoeld in [artikel 2.19, onderdeel c][ref1], en de overlijdensuitkeringen, bedoeld in
      [artikel 82, eerste lid, van de Wet WIA][ref2] niet, indien deze eigenrisicodrager een kleine werkgever als
      bedoeld in [artikel 2.5, eerste lid, onderdeel b][ref3], is of gedeeltelijk indien hij een middelgrote werkgever
      als bedoeld in artikel 2.5, eerste lid, onderdeel c, is, voor zover deze WGA-uitkeringen niet zijn toegekend of de
      wachttijd niet is ingegaan vóór de dag van ingang van een eerdere periode van eigenrisicodragen.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.19b
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
