  - number: 2.19b.4
    text: De vermenigvuldigingsfactor, bedoeld in het derde lid, wordt naar beneden afgerond op twee cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.19b
  - number: 2.19c
    text: |-
      In afwijking van [artikel 2.19b][ref1] komen de volgende lasten ten laste van de Werkhervattingskas:


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
