      [artikel 29, tweede lid, onderdeel a, b en c, van de Ziektewet][ref4] en die op de eerste dag van
      ongeschiktheid tot werken in een dienstbetrekking stonden van een eigenrisicodrager als bedoeld in
      [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref5] waarbij die dag is gelegen vóór de dag van ingang van het
      eigenrisicodragen, en de uitvoeringskosten en andere kosten in verband met deze uitkeringen;


