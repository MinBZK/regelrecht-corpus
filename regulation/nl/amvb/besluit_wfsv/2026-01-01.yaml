      ongeschiktheid tot werken in een dienstbetrekking stonden van een eigenrisicodrager als bedoeld in
      [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref2] die uiterlijk op 1 juli 2015 eigenrisicodrager is geworden
