  - number: 2.3.2
    text: |-
      Voor de toepassing van het eerste lid wordt de dienstbetrekking geacht niet te zijn onderbroken indien sprake is
      van elkaar zonder onderbreking opvolgende arbeidsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing indien het aantal uren, dat is overeengekomen in
      arbeidsovereenkomsten die voldoen aan de voorwaarden voor toepassing van het lage premiepercentage, bedoeld in
      [artikel 2.2][ref1], in het betreffende kalenderjaar gemiddeld meer dan 30 uur per week bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.3
    references:
