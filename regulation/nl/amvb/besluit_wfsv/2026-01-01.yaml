      de overlijdensuitkeringen, bedoeld in [artikel 74, eerste lid, van de Wet WIA][ref1], in verband met het overlijden
      van de werknemer, bedoeld onder a, en de uitvoeringskosten en andere kosten in verband met deze uitkeringen.


