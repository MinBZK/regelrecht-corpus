  - number: '2.2'
    text: Het hoge percentage van de AWf-premie wordt vijf procentpunten hoger vastgesteld dan het lage percentage.
    url: https://wetten.overheid.nl/BWBR0019070/2026-01-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Het lage percentage, bedoeld in [artikel 2.2][ref1], wordt herzien voor een reeds verstreken periode voor een
      werknemer, die niet een werknemer is als bedoeld in [artikel 27, derde lid, van de Wfsv][ref2]:


