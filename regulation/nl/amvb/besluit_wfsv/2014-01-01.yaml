$id: besluit_wfsv
regulatory_layer: AMVB
publication_date: '2019-06-28'
valid_from: '2014-01-01'
bwb_id: BWBR0019070
url: https://wetten.overheid.nl/BWBR0019070/2014-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid, gedaan mede namens de Staatssecretaris van
    Sociale Zaken en Werkgelegenheid, de Staatssecretaris van Financiën en Onze Minister van Volksgezondheid, Welzijn
    en Sport, van 8 juli 2005, nr. SV/F&W/05/51635;

    Gelet op de artikelen 28, eerste en tweede lid, 37, tweede en vierde lid, 42, 71, eerste lid, 80 en 91, eerste lid,
    van de Wet financiering sociale verzekeringen, de artikelen 40, eerste lid, en 77 van de Algemene Wet Bijzondere
    Ziektekosten, en artikel 78, zesde lid, van de Wet op de arbeidsongeschiktheidsverzekering;

    De Raad van State gehoord (advies van 19 augustus 2005, nr. W12.05.0324/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid, van 14 november 2005, nr. SV/
    F&W/05/70630, uitgebracht mede namens de Staatssecretaris van Sociale Zaken en Werkgelegenheid, de Staatssecretaris
    van Financiën en Onze Minister van Volksgezondheid Welzijn en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel1.1
  - number: 1.1.a
    text: |-
      Wfsv: de [Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: 1.1.b
    text: |-
      WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 1.1.c
    text: |-
      Wet WIA: de [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 1.1.d
    text: |-
      sector: een sector als bedoeld in [artikel 95 van de Wfsv][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '95'
  - number: '2.1'
    text: 'In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1
  - number: 2.1.a
    text: |-
      *het sectorpremiepercentage:* het percentage van het loon dat op grond van
      [artikel 28, eerste lid, van de Wfsv][ref1] wordt vastgesteld ter bepaling van het deel van de premie dat ten
      gunste komt van een sectorfonds;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel28
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '28'
  - number: 2.1.b
    text: |-
      *de verzekerde loonsom:* het totaalbedrag van het loon, bedoeld in [artikel 26 van de Wfsv][ref1], waarover het UWV
      in een kalenderjaar ten gunste van een sectorfonds de in dat artikel bedoelde premies ontvangt, met uitzondering
      van de uitkeringen, de toeslag en het loon waarop [artikel 28, tweede lid, van de Wfsv][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel28
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '28'
  - number: 2.1.c
    text: |-
      *de werkloosheidslasten:* hetgeen op grond van [artikel 104, eerste lid, van de Wfsv][ref1] ten
      laste van een sectorfonds komt, met uitzondering van hetgeen meer bedraagt dan het op grond van
      [artikel 105, eerste lid, van de Wfsv][ref2] vastgestelde maximum;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel105
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '105'
  - number: 2.1.d
    text: |-
      *het lastenplafond:* het percentage van de verzekerde loonsom waarin de werkloosheidslasten tot uitdrukking komen,
      dat op grond van [artikel 105, eerste lid, van de Wfsv][ref1] wordt vastgesteld als maximum;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel105
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '105'
  - number: 2.1.e
    text: |-
      *het dekkingssaldo:* het verschil tussen het feitelijke vermogen van een sectorfonds en de op grond van
      [artikel 120, achtste lid, van de Wfsv][ref1] aan te houden reserve;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel120
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '120'
  - number: 2.1.f
    text: |-
      *overige ziekengeldlasten:* de lasten van ziekengeld als bedoeld in
      [artikel 117b, eerste lid, onderdeel b, van de Wfsv][ref1], toegekend voor 1 januari 2012, of de lasten van
      uitkeringen op grond van de [Ziektewet][ref2] als bedoeld in artikel 117b, derde lid, onderdeel g, van de Wfsv,
      toegekend vanaf 1 januari 2012 en de uitvoeringskosten en andere kosten in verband met deze uitkeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 117b
      - id: ref2
        bwb_id: BWBR0001888
  - number: 2.1.g
    text: |-
      *overige WGA-lasten:* WGA-uitkeringen als bedoeld in [artikel 117b, eerste lid, onderdeel a, van de Wfsv][ref1] die
      vóór 1 januari 2012 zijn toegekend aan werknemers, die uit de dienstbetrekking waaruit de WGA-uitkering is ontstaan
      recht hadden op een uitkering op grond van [artikel 29, tweede lid, onderdeel a, b en c, van de Ziektewet][ref2],
      en de uitvoeringskosten en andere kosten in verband met deze uitkeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 117b
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 2.1.h
    text: |-
      *WGA-staartlasten:* door het UWV te betalen WGA-uitkeringen als bedoeld in
      [artikel 117b, derde lid, onderdeel h, van de Wfsv][ref1], aan werknemers, die op de eerste dag van
      ongeschiktheid tot werken in een dienstbetrekking stonden van een eigenrisicodrager als bedoeld in
      [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref2] waarbij die dag is gelegen vóór de dag van ingang van het
      eigenrisicodragen en de uitvoeringskosten en andere kosten in verband met deze uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 117b
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 2.1a
    text: |-
      De overige ziekengeldlasten en WGA-lasten komen ten laste van een sectorfonds, met dien verstande
      dat de overige ziekengeldlasten en WGA-lasten die betrekking hebben op uitkeringen als bedoeld in
      [artikel 2.1, onderdelen f en g][ref1], toegekend aan de personen, bedoeld in [artikel 24 van de Wfsv][ref2], ten
      laste komen van het Uitvoeringsfonds voor de overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel24
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1a
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '24'
  - number: 2.1b.1
    text: |-
      De WGA-staartlasten komen ten laste van een sectorfonds met dien verstande dat de WGA-staartlasten die betrekking
      hebben op WGA-uitkeringen die worden toegekend aan de personen, bedoeld in [artikel 24 van de Wfsv][ref1], ten
      laste komen van het Uitvoeringsfonds voor de overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel24
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1b
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '24'
  - number: 2.1b.2
    text: |-
      De eigenrisicodrager draagt het risico van de betaling van de WGA- uitkeringen aan werknemers, bedoeld in artikel
      2.1, onderdeel h, en de overlijdensuitkeringen, bedoeld in [artikel 82, eerste lid, van de Wet WIA][ref1] , op
      grond van [artikel 84, eerste lid, van die wet][ref2] niet, indien deze eigenrisicodrager een kleine werkgever als
      bedoeld in [artikel 2.5, eerste lid, onderdeel b][ref3], is of gedeeltelijk indien hij een middelgrote werkgever
      als bedoeld in artikel 2.5, eerste lid, onderdeel c, is, voor zover deze WGA-uitkeringen niet zijn toegekend of de
      wachttijd niet is ingegaan vóór de dag van ingang van een eerdere periode van eigenrisicodragen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '84'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.1b.3
    text: |-
      Indien de eigenrisicodrager een middelgrote werkgever is, wordt voor de toepassing van dit artikel het deel van
      de WGA- staartlasten in aanmerking genomen, dat bestaat uit deze lasten maal waarbij: - loonsomwgr staat voor:
      de verzekerde loonsom van de middelgrote werkgever twee kalenderjaren voorafgaand aan de dag van aanvang van het
      eigenrisicodragen;
        - loonsomlaag staat voor: 10 maal het gemiddelde premieplichtige loon per werknemer, bedoeld in
      [artikel 2.5, tweede lid][ref1], twee kalenderjaren voorafgaand aan de dag van aanvang van het eigenrisicodragen;
        - loonsomhoog staat voor: 100 maal het gemiddelde premieplichtige loon per werknemer, bedoeld in
      [artikel 2.5, tweede lid][ref2], twee kalenderjaren voorafgaand aan de dag van aanvang van het eigenrisicodragen.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1b
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.1b.4
    text: De vermenigvuldigingsfactor, bedoeld in het derde lid, wordt naar beneden afgerond op twee cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.1b
  - number: 2.2.1
    text: |-
      Het UWV stelt een sectorpremiepercentage vast ter dekking van de werkloosheidslasten. Het sectorpremiepercentage
      bedraagt ten hoogste het lastenplafond.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Het UWV stelt voor de dekking van de overige ziekengeld- en WGA-lasten, bedoeld in [artikel 2.1a][ref1], en de WGA-
      staartlasten, bedoeld in [artikel 2.1b][ref2], een opslagpercentage vast, waarmee het sectorpremiepercentage met
      betrekking tot dat sectorfonds wordt verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.3
    text: |-
      Indien in een sectorfonds op 31 december van het jaar waarin het sectorpremiepercentage wordt vastgesteld naar
      verwachting van het UWV een positief of negatief dekkingssaldo aanwezig zal zijn, stelt het UWV, in afwijking van
      het eerste lid, in dat kalenderjaar en de daaropvolgende kalenderjaren een zodanig sectorpremiepercentage vast dat
      het overschot dan wel tekort binnen drie kalenderjaren na die datum is ingelopen onderscheidenlijk aangezuiverd.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.2
  - number: 2.2.4
    text: De toepassing van het derde lid leidt niet tot het heffen van een negatieve sectorpremie.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.2
  - number: 2.2.5
    text: |-
      Voorzover een positief dekkingssaldo door de toepassing van het vierde lid niet binnen de termijn van drie
      kalenderjaren kan worden ingelopen, geldt een zodanig langere termijn tot 31 december van enig jaar dat het
      overschot wel kan worden ingelopen.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.2
  - number: 2.2.6
    text: |-
      Indien de toepassing van het derde lid leidt tot vaststelling van een sectorpremiepercentage boven het
      lastenplafond behoeft de aanzuivering van een negatief dekkingssaldo niet binnen de termijn van drie kalenderjaren
      te geschieden. In dat geval wordt het sectorpremiepercentage vastgesteld op ten minste het lastenplafond.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.2
  - number: 2.2.7
    text: |-
      Indien een sectorfonds bestaat uit onderdelen die niet afzonderlijk worden beheerd, terwijl het deel van de premie
      dat ten gunste komt van het sectorfonds voor elk van die onderdelen afzonderlijk wordt vastgesteld, zijn het eerste
      tot en met het zesde lid met betrekking tot deze onderdelen gezamenlijk van overeenkomstige toepassing, met dien
      verstande, dat onder het sectorpremiepercentage wordt verstaan het gewogen gemiddelde van de voor die onderdelen
      afzonderlijk vastgestelde sectorpremiepercentages.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.2
  - number: 2.2.8
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor het eerste lid en de vaststelling van de
      opslagpercentages op grond van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.2
  - number: 2.2.9
    text: |-
      Bij ministeriële regeling kan worden bepaald dat ten behoeve van de vaststelling van het sectorpremiepercentage,
      bedoeld in het eerste lid, de termijn van drie kalenderjaren, bedoeld in het derde, vijfde en zesde lid, wordt
      verlengd tot maximaal vijf kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.2
  - number: 2.2a.1
    text: |-
      Voor de vaststelling van het sectorpremiepercentage op grond van [artikel 2.2, eerste lid][ref1], voor het
      sectorfonds waarin werkgevers op grond van [artikel 95 van de Wfsv][ref2] zijn ingedeeld, die zich in het kader
      van de uitoefening van hun bedrijf of beroep bezighouden met het ter beschikking stellen van arbeidskrachten
      aan een derde om krachtens een door deze aan de werkgever verstrekte opdracht arbeid te verrichten onder
      leiding en toezicht van de derde, waarbij die werknemers werkzaam zijn op basis van een uitzendovereenkomst als
      bedoeld in [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref3], waarin tevens een beding als bedoeld in
      [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref4] is opgenomen, worden de werkloosheidslasten
      verminderd met de bijdrage, bedoeld in [artikel 103, tweede lid, van de Wfsv][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel690
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel691
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel103
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '95'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '690'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '691'
      - id: ref5
        bwb_id: BWBR0017745
        artikel: '103'
  - number: 2.2a.2
    text: Voor de toepassing van dit artikel kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.2a
  - number: 2.3.1
    text: |-
      In afwijking van [artikel 2.2][ref1] stelt het UWV op bij ministeriële regeling te bepalen wijze
      sectorpremiepercentages, die voor verschillende categorieën van werknemers kunnen verschillen, vast voor de
      sectorfondsen van:


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.3.1.a
    text: het agrarisch bedrijf;
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.1.b
    text: het bouwbedrijf;
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.1.c
    text: de culturele instellingen;
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.1.d
    text: de horeca algemeen;
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.1.e
    text: het schildersbedrijf.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.2
    text: 'De verschillende sectorpremiepercentages gelden voor:'
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.2.a
    text: |-
      werknemers die blijkens een schriftelijke overeenkomst ten minste voor een jaar of voor onbepaalde tijd in
      dienstbetrekking zullen staan tot de werkgever, tenzij:
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.2.a.1°
    text: |-
      zij binnen een jaar na het aanvangen van de dienstbetrekking uit hoofde van die dienstbetrekking recht hebben
      gekregen op een uitkering op grond van de Werkloosheidswet; of
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.2.a.2°
    text: de omvang van de door de werknemer te verrichten arbeid in deze schriftelijke overeenkomst niet is vastgesteld; en
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.2.b
    text: de overige werknemers.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor het tweede lid en kan voor aan te wijzen
      categorieën van werknemers en van werkgevers of soort arbeid worden afgeweken van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Voor de toepassing van het tweede lid, onderdeel a, wordt niet als uitkering op grond van de
      [Werkloosheidswet][ref1] beschouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 2.3.4.a
    text: |-
      een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
  - number: 2.3.4.b
    text: |-
      een uitkering op grond van [hoofdstuk IV van de Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
  - number: 2.3.4.c
    text: |-
      een uitkering die uitsluitend het gevolg is van verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: 2.3.5
    text: |-
      Een afschrift van de schriftelijke overeenkomst, bedoeld in het tweede lid, onderdeel a, wordt door de werkgever in
      zijn loonadministratie opgenomen.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.6
    text: |-
      Indien voor het jaar 2006 verschillende sectorpremiepercentages zijn vastgesteld geldt het sectorpremiepercentage
      dat van toepassing is voor werknemers, bedoeld in het tweede lid, onderdeel b, niet voor dienstbetrekkingen die
      zijn aangegaan voor 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
  - number: 2.3.7
    text: |-
      Uitsluitend ten aanzien van de premie die het UWV betaalt aan de werkgever op grond van
      [artikel 11, tweede lid, van de Werkloosheidswet][ref1], [artikel 11, derde lid, van de Ziektewet][ref2] of
      [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref3] is het sectorpremiepercentage,
      bedoeld in het tweede lid, onderdeel a, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel10
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '10'
  - number: 2.4.1
    text: |-
      Het gemiddelde premiepercentage, bedoeld in [artikel 28, tweede lid, van de Wfsv][ref1], wordt in het kalenderjaar
      van vaststelling bepaald op het gewogen gemiddelde van de sectorpremiepercentages van alle sectoren in het daaraan
      voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel28
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '28'
  - number: 2.4.2
    text: |-
      Het gewogen gemiddelde, bedoeld in het eerste lid, wordt in het kalenderjaar van vaststelling bepaald met behulp
      van de totaalbedragen van de verzekerde loonsom in het daaraan voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Ingeval voor een sectorfonds gedurende een kalenderjaar meerdere malen een premiepercentage wordt vastgesteld,
      worden bij de berekening van het gemiddelde premiepercentage, bedoeld in het eerste lid, de desbetreffende
      premiepercentages gewogen naar rato van het deel van het kalenderjaar waarin deze premiepercentages golden.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.4
  - number: 2.4.4
    text: |-
      Bij de vaststelling van het gemiddelde premiepercentage voor het kalenderjaar 2014 wordt bij de bepaling
      van het gewogen gemiddelde van de sectorpremiepercentages geen rekening gehouden met de ziekengeldlasten
      en de WGA- lasten flexibele dienstbetrekkingen in verband met ziekengeld en uitkeringen als bedoeld in
      [artikel 2.5, eerste lid, onderdeel h][ref1], die zijn toegekend vanaf 1 januari 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.5.1
    text: |-
      In deze paragraaf wordt verstaan onder: - *premieplichtig loon:* het loon, bedoeld in
      [artikel 35 van de Wfsv][ref1], waarover in een kalenderjaar de gedifferentieerde premie, bedoeld in
      [artikel 38 van de Wfsv][ref2], wordt geheven;
        - *kleine werkgever:* een werkgever te wiens laste, in het tweede kalenderjaar dat aan het kalenderjaar waarvoor de
      premie wordt vastgesteld vooraf is gegaan, een premieplichtig loon is gekomen dat gelijk is aan of minder bedraagt
      dan 10 maal het gemiddelde premieplichtige loon per werknemer in dat kalenderjaar;
        - *middelgrote werkgever:* een werkgever te wiens laste, in het tweede kalenderjaar dat aan het kalenderjaar
      waarvoor de premie wordt vastgesteld vooraf is gegaan, een premieplichtig loon is gekomen dat meer bedraagt dan 10
      maal het gemiddelde premieplichtige loon per werknemer in dat kalenderjaar en dat gelijk is aan of minder bedraagt
      dan 100 maal het gemiddelde premieplichtige loon per werknemer in dat kalenderjaar;
        - *grote werkgever:* een werkgever te wiens laste, in het tweede kalenderjaar dat aan het kalenderjaar waarvoor de
      premie wordt vastgesteld vooraf is gegaan, een premieplichtig loon is gekomen dat meer bedraagt dan 100 maal het
      gemiddelde premieplichtige loon per werknemer in dat kalenderjaar;
        - *minimumpremie:* de gedifferentieerde premie die een werkgever ten minste verschuldigd is;
        - *maximumpremie:* de gedifferentieerde premie die een werkgever ten hoogste verschuldigd is;
        - *WGA-lasten vaste dienstbetrekkingen:* de lasten van uitkeringen als bedoeld in
      [artikel 117b, eerste lid, onderdeel a, van de Wfsv][ref3] voor zover deze uitkeringen uit een dienstbetrekking met
      een werkgever worden verstrekt en ten laste komen van de Werkhervattingskas en de kosten, bedoeld in artikel 117b,
      vijfde lid, onderdeel c, van de Wfsv in verband met deze uitkeringen;
        - *WGA-lasten flexibele dienstbetrekkingen:* de lasten van WGA-uitkeringen als bedoeld in
      [artikel 117b, eerste lid, onderdeel a, van de Wfsv][ref4] die zijn toegekend aan werknemers, die uit
      de dienstbetrekking waaruit de WGA-uitkering is ontstaan recht hadden op een uitkering op grond van de
      [Ziektewet][ref5], die ten laste komt van de Werkhervattingskas en de kosten, bedoeld in artikel 117b, vijfde lid,
      onderdeel c, van de Wfsv in verband met deze uitkeringen;
        - *ZW-lasten:* lasten van ziekengeld als bedoeld in [artikel 117b, eerste lid, onderdeel b, van de Wfsv][ref6],
      voor zover deze uitkeringen ten laste komen van de Werkhervattingskas en de kosten, bedoeld in artikel 117b, vijfde
      lid, onderdeel c, van de Wfsv in verband met deze uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref5]: https://wetten.overheid.nl/BWBR0001888
      [ref6]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: 117b
      - id: ref4
        bwb_id: BWBR0017745
        artikel: 117b
      - id: ref5
        bwb_id: BWBR0001888
      - id: ref6
        bwb_id: BWBR0017745
        artikel: 117b
  - number: 2.5.2
    text: |-
      Het UWV stelt het gemiddelde premieplichtige loon, bedoeld in het eerste lid, onderdelen b, c en d, per werknemer
      vast.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.5
  - number: 2.5.3
    text: |-
      Bij de vaststelling van premieplichtige loon als bedoeld in het eerste lid worden de via de werkgever betaalde WGA-
      uitkeringen en uitkeringen op grond van de [Ziektewet][ref1], die op grond van [artikel 117b van de Wfsv][ref2] ten
      laste van de Werkhervattingskas komen buiten aanmerking gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 117b
  - number: 2.5.4
    text: |-
      Voor de vaststelling van sectorale premiecomponenten behoort de werkgever tot de sector, bedoeld in
      [artikel 95 van de Wfsv][ref1], in het voor die berekening relevante kalenderjaar, waarbij de werkgever is
      aangesloten op 1 januari van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '95'
  - number: 2.6.1
    text: |-
      De gedifferentieerde premie die een werkgever verschuldigd is, is de som van drie afzonderlijk bekend te maken
      gedifferentieerde premiecomponenten, die worden berekend voor de WGA-lasten vaste dienstbetrekkingen, de WGA-lasten
      flexibele dienstbetrekkingen en de ZW-lasten.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.6
  - number: 2.6.2
    text: Bij de vaststelling van de premie wordt een onderscheid gemaakt naar kleine, middelgrote en grote werkgevers.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.6
  - number: 2.6.3
    text: |-
      De gedifferentieerde premie voor de kleine werkgevers is de som van de sectorale premiecomponenten op basis van de
      WGA-lasten vaste dienstbetrekkingen, de WGA-lasten flexibele dienstbetrekkingen en de ZW-lasten van uitkeringen die
      zijn toegekend aan werknemers die in dienstbetrekking stonden met werkgevers die behoren tot een sector als bedoeld
      in [artikel 95 van de Wfsv][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '95'
  - number: 2.6.4
    text: |-
      De gedifferentieerde premie voor grote werkgevers is de som van de individuele premiecomponenten, die voor de WGA-
      lasten vaste dienstbetrekkingen, de WGA-lasten flexibele dienstbetrekkingen en de ZW-lasten afzonderlijk worden
      berekend, op basis van een per soort last vast te stellen rekenpercentage vermeerderd of verminderd met een opslag
      of korting op grond van een individueel werkgeversrisicopercentage, waarop een correctie wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.6
  - number: 2.6.5
    text: |-
      Bij de berekening van de gedifferentieerde premie voor de middelgrote werkgever wordt een gewogen gemiddelde
      toegepast van de sectorale en individuele premies volgens de formule: waarbij: - loonsomwgr staat voor: het totaal
      van het premieplichtige loon van de middelgrote werkgever in het jaar twee kalenderjaren voorafgaand aan het jaar
      waar de premie betrekking op heeft;
        - loonsomlaag staat voor: 10 maal het gemiddelde premieplichtige loon per werknemer;
        - loonsomhoog staat voor: 100 maal het gemiddelde premieplichtige loon per werknemer;
        - sectoraal %: de desbetreffende sectorale premie van de sector waartoe de werkgever behoort;
        - individueel %: de desbetreffende individuele premie van de werkgever als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.6
  - number: 2.6.6
    text: |-
      Voor de op grond van het vierde lid berekende gedifferentieerde premie geldt per premiecomponent een minimumpremie,
      die een vierde van het gemiddelde percentage behorend bij de desbetreffende lasten bedraagt en een maximumpremie
      die vier maal dat gemiddelde percentage bedraagt.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.6
  - number: 2.6.7
    text: |-
      Alle percentages in de sommen die leiden tot de vaststelling van de gedifferentieerde premie worden naar beneden
      afgerond op twee cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.6
  - number: 2.6.8
    text: |-
      Bij ministeriële regeling kan worden bepaald, dat de maximumpremie voor werkgevers in bepaalde sectoren kan worden
      verhoogd indien de omvang van de WGA-lasten vaste dienstbetrekkingen, de WGA-lasten flexibele dienstbetrekkingen of
      de ZW-lasten daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Indien een werkgever eigenrisicodrager is als bedoeld in [artikel 40, eerste lid, onderdeel a, van de Wfsv][ref1]
      wordt de premiecomponent berekend op basis van de ZW-lasten op nul vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 2.7.2
    text: |-
      Indien een werkgever eigenrisicodrager is als bedoeld in [artikel 40, eerste lid, onderdeel b][ref1], wordt de
      premiecomponent berekend op basis van de WGA-lasten vaste dienstbetrekkingen op nul vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 2.8.1
    text: |-
      Het gemiddelde percentage, bedoeld in [artikel 38, tweede lid, onderdeel b, van de Wfsv][ref1], voor de berekening
      van de premiecomponent WGA-lasten vaste dienstbetrekkingen wordt vastgesteld door het totaalbedrag van de WGA-
      lasten vaste dienstbetrekkingen in het kalenderjaar waarvoor de premie wordt vastgesteld, dat naar verwachting
      op grond van [artikel 117b van de Wfsv][ref2] ten laste komt van de Werkhervattingskas, verminderd met hetgeen
      op grond van [artikel 117a, onderdelen b en c, van de Wfsv][ref3] in het kalenderjaar waarvoor de premie wordt
      vastgesteld naar verwachting ten gunste komt van de Werkhervattingkas, te vermenigvuldigen met honderd en de
      uitkomst van deze berekening te delen door het totaalbedrag van het over het kalenderjaar waarvoor de premie wordt
      vastgesteld verwachte premieplichtige loon en de naar verwachting in dat jaar te betalen uitkeringen, bedoeld in
      [artikel 38a, eerste lid, van de Wfsv][ref4]. Onder uitkeringen als bedoeld in de eerste zin worden niet verstaan
      de WGA-uitkeringen en overlijdensuitkeringen, bedoeld in artikel 117b, eerste lid, onderdeel a, van de Wfsv voor
      zover deze uitkeringen uit een dienstbetrekking met een werkgever worden verstrekt, waarvan het risico van de
      betaling wordt gedragen door een werkgever als bedoeld in [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel117a
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel38a
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 117b
      - id: ref3
        bwb_id: BWBR0017745
        artikel: 117a
      - id: ref4
        bwb_id: BWBR0017745
        artikel: 38a
      - id: ref5
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 2.8.2
    text: |-
      Het gemiddelde percentage, bedoeld in [artikel 38, tweede lid, onderdeel b, van de Wfsv][ref1], voor de berekening
      van de premiecomponent WGA-lasten flexibele dienstbetrekkingen wordt vastgesteld door het totaalbedrag van
      de WGA-lasten flexibele dienstbetrekkingen in het kalenderjaar waarvoor de premie wordt vastgesteld, dat naar
      verwachting op grond van [artikel 117b van de Wfsv][ref2] ten laste komt van de Werkhervattingskas, verminderd
      met hetgeen op grond van [artikel 76][ref3], en [99 van de Wet werk en inkomen][ref4] naar arbeidsvermogen
      en [artikel 117a, onderdeel c, van de Wfsv][ref5] in het kalenderjaar waarvoor de premie wordt vastgesteld
      naar verwachting ten gunste komt van de Werkhervattingkas, te vermenigvuldigen met honderd en de uitkomst
      van deze berekening te delen door het totaalbedrag van het over het kalenderjaar waarvoor de premie wordt
      vastgesteld verwachte premieplichtige loon en de naar verwachting in dat jaar te betalen uitkeringen, bedoeld in
      [artikel 38a, eerste lid, van de Wfsv][ref6], waarbij van de WGA-uitkeringen alleen in aanmerking worden genomen de
      WGA-uitkeringen en overlijdensuitkeringen, bedoeld in artikel 117b, eerste lid, onderdeel a, van de Wfsv die zijn
      toegekend in verband met een dienstbetrekking met werknemers die uit de dienstbetrekking waaruit de WGA-uitkering
      is ontstaan recht hadden op een uitkering op grond van de [Ziektewet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel99
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel117a
      [ref6]: https://wetten.overheid.nl/BWBR0017745#Artikel38a
      [ref7]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 117b
      - id: ref3
