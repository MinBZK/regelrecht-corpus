        artikel: '76'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '99'
      - id: ref5
        bwb_id: BWBR0017745
        artikel: 117a
      - id: ref6
        bwb_id: BWBR0017745
        artikel: 38a
      - id: ref7
        bwb_id: BWBR0001888
  - number: 2.8.3
    text: |-
      Het gemiddelde percentage, bedoeld in [artikel 38, tweede lid, onderdeel b, van de Wfsv][ref1], voor de berekening
      van de premiecomponent ZW- lasten wordt vastgesteld door het totaalbedrag van de ZW-lasten in het kalenderjaar
      waarvoor de premie wordt vastgesteld, naar verwachting op grond van [artikel 117b van de Wfsv][ref2] ten laste komt
      van de Werkhervattingskas verminderd met hetgeen op grond van [artikel 117a, onderdeel c, van de Wfsv][ref3] in
      het kalenderjaar waarvoor de premie wordt vastgesteld naar verwachting ten gunste komt van de Werkhervattingkas,
      te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het totaalbedrag van het over
      het kalenderjaar waarvoor de premie wordt vastgesteld verwachte premieplichtige loon en de naar verwachting
      in dat jaar te betalen uitkeringen, bedoeld in [artikel 38a, eerste lid, van de Wfsv][ref4]. Onder uitkeringen
      als bedoeld in de eerste zin worden niet verstaan de uitkeringen en de overlijdensuitkeringen op grond van
      de [Ziektewet][ref5] waarvan het risico van de betaling wordt gedragen door een werkgever als bedoeld in
      [artikel 40, eerste lid, onderdeel a, van de Wfsv][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel117a
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel38a
