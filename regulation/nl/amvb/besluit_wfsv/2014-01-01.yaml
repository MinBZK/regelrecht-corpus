        artikel: 19a
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 19b
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 19c
  - number: 2.13.6
    text: |-
      De op grond van dit artikel berekende opslagen of kortingen worden vermenigvuldigd met een breuk, waarvan de teller
      wordt gevormd door het rekenpercentage, berekend op grond van [artikel 2.8, derde lid][ref1], en [2.9][ref2],
      verminderd met een vierde van de gemiddelde premie, bedoeld in artikel 2.8, derde lid, en de noemer door het
      gemiddelde werkgeversrisicopercentage, bedoeld in het derde lid. Indien de berekening op grond van de vorige zin
      leidt tot een uitkomst groter dan twee wordt deze breuk vastgesteld op twee.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.13
