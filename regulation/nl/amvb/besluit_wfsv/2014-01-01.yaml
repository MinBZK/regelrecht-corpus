        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002471
  - number: 2.15.1
    text: |-
      In geval van overgang van een onderneming in de zin van [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1],
      alsmede in geval van een dergelijke overgang bij faillissement:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: 2.15.1.a
    text: |-
      worden bij de toepassing van [artikel 2.11][ref1], [2.12][ref2] en [2.13][ref3] de WGA-uitkeringen, bedoeld in
      artikel 2.11, tweede lid en derde lid, en artikel 2.12, tweede en derde lid, en de ZW-uitkeringen, bedoeld in
      artikel 2.13, tweede en derde lid, die zijn of worden toegekend aan de werknemer die op de eerste dag van de
      ongeschiktheid tot het verrichten van zijn arbeid in dienstbetrekking stond tot de werkgever die de onderneming
      heeft overgedragen, toegerekend aan de werkgever die de onderneming verkrijgt; en


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.15.1.b
    text: |-
      wordt bij de toepassing van [artikel 2.11][ref1], [2.12][ref2] en [2.13][ref3] het ten laste van de werkgever
      die de onderneming heeft overgedragen, gekomen premieplichtig loon in enig kalenderjaar telkens opgeteld bij het
      premieplichtig loon van de werkgever die de onderneming verkrijgt in dat kalenderjaar, voordat het gemiddelde
      premieplichtig loon van laatstgenoemde werkgever wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.15.2
    text: |-
      Indien slechts een deel van de onderneming overgaat, vindt het eerste lid toepassing naar rato van het deel
      van het totaalbedrag van premieplichtig loon in het overgegane deel van de onderneming van het totaalbedrag van
      premieplichtig loon in de gehele onderneming in het jaar voorafgaande aan dat van overgang.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.15
  - number: 2.15.3
    text: |-
      Tenzij de overgang plaatsvindt op 1 januari van het kalenderjaar vindt voor de werkgever die reeds de hoedanigheid
      van werkgever had voor het moment van overgang van de onderneming de toerekening, bedoeld in het eerste lid,
      onderdeel a, en de optelling, bedoeld in het eerste lid, onderdeel b, eerst plaats met ingang van het kalenderjaar
      volgend op het kalenderjaar waarin de onderneming of een deel van de onderneming is overgedragen.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.15
  - number: '2.16'
    text: |-
      Indien een werkgever, zonder dat er sprake is van een overgang van een onderneming als bedoeld
      in [artikel 2.15][ref1] in een of meer van de kalenderjaren van het tijdvak, bedoeld in
      [artikel 2.11, tweede lid][ref2], [2.12, tweede lid][ref3] en [2.13, tweede lid][ref4], niet de hoedanigheid
      van werkgever had, wordt bij de berekening van het individuele werkgeversrisicopercentage, bedoeld in artikel
      2.11, tweede lid, 2.12, tweede lid, en 2.13, tweede lid, het ten laste van die werkgever komende gemiddelde
      premieplichtige loon per jaar berekend over het aantal kalenderjaren in het tijdvak, bedoeld in artikel 2.11,
      tweede lid, 2.12, tweede lid, en 2.13, tweede lid, waarin de werkgever de hoedanigheid van werkgever had, waarna
      het verkregen percentage wordt vermenigvuldigd met een breuk, waarvan de teller wordt gevormd door het gemiddelde
      werkgeversrisicopercentage, bedoeld in artikel 2.11, derde lid, 2.12, derde lid, en 2.13, derde lid, en de noemer
      door het gemiddelde werkgeversrisicopercentage, berekend over de kalenderjaren in het tijdvak, bedoeld in artikel
      2.11, tweede lid, 2.12, tweede lid, en 2.13, tweede lid, waarin de werkgever de hoedanigheid van werkgever had.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.17.1
    text: |-
      Voor een werkgever die, zonder dat er sprake is van een overgang van een onderneming als bedoeld in
      [artikel 2.15, eerste lid][ref1], in het kalenderjaar waarvoor de premie wordt vastgesteld, of in het eerste
      of tweede kalenderjaar onmiddellijk voorafgaande aan het kalenderjaar waarvoor de premie wordt vastgesteld
      de hoedanigheid van werkgever heeft verkregen, is het percentage van de gedifferentieerde premie, bedoeld
      in [artikel 2.6, vierde lid][ref2], gelijk aan de som van de rekenpercentages voor de WGA-lasten vaste
      dienstbetrekkingen, de WGA-lasten flexibele dienstbetrekkingen en de ZW-lasten, bedoeld in [artikel 2.9][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.17.2
    text: |-
      Van de startende werkgever, bedoeld in [artikel 40, negende lid, van de Wfsv][ref1] wordt in afwachting van de
      beslissing op aanvraag van het eigenrisicodragen, bedoeld in artikel 40, eerste lid, onderdeel a of onderdeel b,
      van de Wfsv met ingang van het tijdstip waarop hij aanvangt werkgever te zijn, het rekenpercentage voor de ZW-
      lasten respectievelijk het rekenpercentage voor de WGA-lasten vaste dienstbetrekkingen op nul gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 2.18.1
    text: |-
      Indien blijkt dat een WGA-uitkering als bedoeld in [artikel 2.11, tweede lid][ref1], of [2.12, tweede lid][ref2],
      of een uitkering op grond van de [Ziektewet][ref3] geheel of ten dele ten onrechte is toegekend, wordt bij de
      berekening van het individuele werkgeversrisicopercentage, bedoeld in artikel 2.11, tweede lid, 2.12, tweede lid,
      en [2.13, tweede lid][ref4], in het kalenderjaar waarin het besluit tot toekenning van de WGA-uitkering of de
      uitkering op grond van de Ziektewet wordt ingetrokken of herzien, de aan de werkgever toe te rekenen WGA-lasten
      vaste dienstbetrekkingen, bedoeld in artikel 2.11, tweede lid, de aan de werkgever toe te rekenen WGA-lasten
      flexibele dienstbetrekkingen, bedoeld in artikel 2.12, tweede lid, onderscheidenlijk de aan de werkgever toe te
      rekenen uitkeringen op grond van de Ziektewet, bedoeld in artikel 2.13, tweede lid, verminderd met een bedrag dat
      gelijk is aan het bedrag van de te veel betaalde WGA-uitkering of uitkering op grond van de Ziektewet.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.18.2
    text: |-
      Indien een werkgever recht heeft op een schadevergoeding als bedoeld in
      [artikel 107a, tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref1] dan wel een schadevergoeding op grond van
      een wettelijke regeling die daarmee naar aard en strekking overeenkomt, worden, op verzoek van de werkgever, bij de
      berekening van het individuele werkgeversrisicopercentage, bedoeld in [artikel 2.11, tweede lid][ref2], met ingang
      van het kalenderjaar waarin de schadevergoeding is vastgesteld, gedurende een tijdvak van tien jaren, de aan de
      werkgever toe te rekenen WGA-lasten vaste dienstbetrekkingen, bedoeld in artikel 2.11, tweede lid, verminderd met
      een compensatiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel107a
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 107a
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.18.3
    text: |-
      Het compensatiebedrag, bedoeld in het tweede lid, wordt vastgesteld door het bedrag van de WGA-uitkering aan de
      betrokken werknemer jaarlijks gedurende tien jaar te vermenigvuldigen met het getal dat is verkregen door het
      bedrag van de schadevergoeding, bedoeld in het tweede lid, te delen door het loon over een tijdvak van 104 weken.
      Het getal, bedoeld in de eerste zin, bedraagt niet meer dan 1.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.18
  - number: 2.18.4
    text: |-
      Indien het UWV op grond van [artikel 52a van de Ziektewet][ref1] verhaal heeft, worden de aan de
      werkgever toe te rekenen WGA- lasten flexibele dienstbetrekking en de ZW-lasten voor de toepassing van
      [artikel 2.12, tweede lid][ref2] en [artikel 2.13, tweede lid][ref3], bij de berekening van het individuele
      werkgeversrisicopercentage, bedoeld in artikel 2.12, tweede en 2.13, tweede lid, verminderd met een bedrag
      gerelateerd aan het bedrag van de schadevergoeding, bedoeld in artikel 52a, eerste lid, van de Ziektewet.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel52a
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 52a
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.18.5
    text: |-
      Het bedrag van de vermindering, bedoeld in het vierde lid, wordt bepaald door het bedrag van de WGA-uitkering en
      de uitkering op grond van de [Ziektewet][ref1] aan de betrokken werknemer te vermenigvuldigen met het getal dat is
      verkregen door het bedrag van het verhaal op grond van [artikel 52a van de Ziektewet][ref2] te delen door het aan
      betrokken werknemer op grond van de Ziektewet uitgekeerde ziekengeld. Het getal, bedoeld in de eerste zin, bedraagt
      niet meer dan 1.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel52a
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 52a
  - number: 2.18.6
    text: |-
      Bij de toepassing van dit artikel is een minimumpremie als bedoeld in [artikel 2.6, zesde lid][ref1], niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.19'
    text: |-
      [Artikel 47, eerste lid, van de Wfsv][ref1] is van overeenkomstige toepassing bij een dienstbetrekking met een
      werknemer die onmiddellijk voorafgaand aan de aanvang van de dienstbetrekking gedurende tenminste twee jaar
      recht heeft op een nabestaandenuitkering op grond van de [Algemene nabestaandenwet][ref2] en gedurende die twee
      jaar geen inkomen uit arbeid als bedoeld in de [artikelen 2:2, eerste lid, onderdelen a tot en met d][ref3], en
      [2:6, eerste lid, onderdeel b, onder 1° en 2°, van het Algemeen inkomensbesluit socialezekerheidswetten][ref4]
      heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.19
    references:
