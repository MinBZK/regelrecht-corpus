        artikel: '55'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '43'
  - number: 2.12.6.c
    text: |-
      aan de werknemer, bedoeld in onderdeel a, van wie het recht op een WGA-uitkering op grond van
      [artikel 57 van de Wet WIA][ref1] is herleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel57
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '57'
  - number: 2.12.7
    text: |-
      Indien de werknemer bij het intreden van de arbeidsongeschiktheid op grond waarvan hij ziekengeld ontving, bij meer
      dan één werkgever in dienstbetrekking stond, wordt voor de toepassing van het tweede lid de WGA-uitkering naar rato
      van de loonsom toegerekend aan die werkgevers.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.12
  - number: 2.12.8
    text: |-
      De op grond van dit artikel berekende opslagen of kortingen worden vermenigvuldigd met een breuk, waarvan de teller
      wordt gevormd door het rekenpercentage, berekend op grond van [artikel 2.8, tweede lid][ref1], en [2.9][ref2],
      verminderd met een vierde van het gemiddelde premiepercentage, bedoeld in artikel 2.8, tweede lid, en de noemer
      door het gemiddelde werkgeversrisicopercentage, bedoeld in het derde lid. Indien de berekening op grond van de
      vorige zin leidt tot een uitkomst groter dan twee wordt deze breuk vastgesteld op twee.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.12
