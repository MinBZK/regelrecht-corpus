        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.13.1
    text: |-
      De opslag of korting ZW-lasten is gelijk aan het individuele werkgeversrisicopercentage verminderd met het
      gemiddelde risicopercentage gerelateerd aan deze lasten.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.13
  - number: 2.13.2
    text: |-
      Het individuele werkgeversrisicopercentage wordt verkregen door de uitkeringen van de aan de werkgever toe te
      rekenen ZW-lasten die in het tweede kalenderjaar vóór het kalenderjaar waarvoor de premie wordt vastgesteld zijn
      betaald te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het ten laste van die
      werkgever komende gemiddelde premieplichtige loon per jaar, berekend over het tijdvak van vijf kalenderjaren,
      eindigend één jaar voor aanvang van het kalenderjaar waarvoor de premie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.13
  - number: 2.13.3
    text: |-
      Het gemiddelde werkgeversrisicopercentage wordt verkregen door het totaalbedrag aan uitkeringen van de aan
      werkgevers toe te rekenen ZW-lasten, die in het tweede kalenderjaar vóór het kalenderjaar waarvoor de premie wordt
      vastgesteld zijn betaald, te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het
      totale premieplichtige loon in het tweede kalenderjaar vóór het kalenderjaar waarvoor de premie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.13
  - number: 2.13.4
    text: |-
      Voor de toepassing van het tweede en derde lid worden onder ZW-lasten mede begrepen de lasten van ziekengeld als
      bedoeld in [artikel 117b, eerste lid, onderdeel b, van de Wfsv][ref1], dat is toegekend vanaf 1 januari 2012, welke
      lasten op grond van [artikel 104, eerste lid][ref2], en [108, eerste lid, van de Wfsv][ref3], zoals die artikelen
      luidden op 31 december 2013, ten laste van de sectorfondsen zijn gekomen en, voor zover dat ziekengeld is toegekend
      aan personen als bedoeld in [artikel 24 van de Wfsv][ref4], ten laste van het Uitvoeringsfonds voor de overheid
      zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel104
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel108
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel24
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 117b
