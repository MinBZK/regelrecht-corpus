  - number: 2.9.1
    text: |-
      De rekenpercentages, bedoeld in [artikel 38, tweede lid, onderdeel a, van de Wfsv][ref1], voor de verschillende
      lasten zijn gelijk aan de gemiddelde percentages, bedoeld in [artikel 2.8, eerste, tweede en derde lid][ref2],
      vermeerderd of verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.9.1.a
    text: |-
      een percentage ter compensatie van het naar verwachting over het kalenderjaar waarvoor de premie wordt vastgesteld
      optredende verschil tussen enerzijds de premie-inkomsten die worden verkregen indien de gedifferentieerde
      premie, bedoeld in [artikel 38 van de Wfsv][ref1], wordt gebaseerd op de desbetreffende gemiddelde percentages,
      bedoeld in [artikel 2.8, eerste, tweede onderscheidenlijk derde lid][ref2], en anderzijds het totaalbedrag van de
      verschillende lasten dat naar verwachting in het kalenderjaar waarvoor de premie wordt vastgesteld op grond van
      [artikel 117b van de Wfsv][ref3] ten laste van de Werkhervattingskas komt, verminderd met de gelden die op grond
      van [artikel 117a, onderdelen b en c, van de Wfsv][ref4] naar verwachting ten gunste van de Werkhervattingskas
      komen;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel117a
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
      - id: ref2
