        artikel: '2'
  - number: '2.20'
    text: |-
      Het UWV kan na 1 januari 2013 voor de verplichtingen van een werkgever, die voortvloeien uit
      het dragen van het risico voor het betalen ziekengeld, toegekend aan personen als bedoeld in
      [artikel 40, eerste lid, onderdeel a, van de Wfsv][ref1], voor 1 januari 2013, die door die
      werkgever niet worden nagekomen, een beroep doen op een bank of een verzekeraar, die zich voor
      1 januari 2013, jegens het UWV heeft verplicht die verplichtingen na te komen als bedoeld in artikel
      40, tweede lid, van de Wfsv, zoals dat artikel luidde op de dag voorafgaand aan de datum waarop
      [artikel II, onderdeel E, van de Wet beperking ziekteverzuim en arbeidsongeschiktheid vangnetters][ref2] in werking
      is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0032089#ArtikelII
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.20
