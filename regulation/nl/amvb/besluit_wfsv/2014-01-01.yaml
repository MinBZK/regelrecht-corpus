  - number: '2.14'
    text: |-
      Bij de bepaling van het gemiddelde premieplichtig loon, bedoeld in [artikel 2.11, tweede lid][ref1],
      [artikel 2.12, tweede lid][ref2], en [artikel 2.13, tweede lid][ref3], blijft buiten aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.14
    references:
