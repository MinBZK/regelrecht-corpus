        artikel: 117b
      - id: ref4
        bwb_id: BWBR0017745
        artikel: 117a
  - number: 2.9.1.b
    text: |-
      een percentage, voor zover dit nodig of mogelijk is, rekening houdend met de verplichting, bedoeld in
      [artikel 113a van de Wfsv][ref1], betreffende het vormen en in stand houden van een voldoende reserve.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel113a
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 113a
  - number: 2.9.2
    text: |-
      De gedifferentieerde premie over de uitkeringen, bedoeld in [artikel 38a van de Wfsv][ref1], en over het loon
      uit een dienstbetrekking op grond van de Wet sociale werkvoorziening wordt bepaald op de som van de percentages
      berekend met toepassing van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38a
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38a
  - number: 2.9.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.9
  - number: 2.10.1
    text: |-
      De sectorale premiecomponenten worden vastgesteld met toepassing van [artikel 2.8][ref1] waarbij voor de
      WGA-lasten vaste dienstbetrekkingen, WGA-lasten flexibele dienstbetrekkingen en ZW-lasten wordt uitgegaan
      van de desbetreffende uitkeringen, die worden toegekend aan werknemers van werkgevers in die sector,
      bedoeld in [artikel 95 van de Wfsv][ref2], en van het totaalbedrag van het premieplichtige loon van alle
      werkgevers, die tot die sector behoren, waarbij voor de bepaling van de premiecomponent WGA-lasten vaste
      dienstbetrekkingen het premieplichtige loon van de werkgevers, die eigenrisicodrager zijn als bedoeld in
      [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref3] en voor de bepaling van de premiecomponent ZW-lasten het
      premieplichtig loon van de werkgevers, die eigenrisicodrager zijn als bedoeld in artikel 40, eerste lid, onderdeel
      a, buiten aanmerking wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '95'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 2.10.2
    text: Het UWV stelt het sectorale premiepercentage met toepassing van het eerste lid vast.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de bepaling van de sectoren voor de toepassing
      van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.10
  - number: 2.11.1
    text: |-
      De opslag of korting WGA-lasten vaste dienstbetrekkingen is gelijk aan het individuele werkgeversrisicopercentage
      verminderd met het gemiddelde risicopercentage gerelateerd aan deze lasten.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.11
  - number: 2.11.2
    text: |-
      Het individuele werkgeversrisicopercentage wordt verkregen door de uitkeringen van de aan de werkgever toe te
      rekenen WGA-lasten vaste arbeidskrachten die in het tweede kalenderjaar vóór het kalenderjaar waarvoor de premie
      wordt vastgesteld zijn betaald te vermenigvuldigen met honderd en de uitkomst van deze berekening te delen door het
      ten laste van die werkgever komende gemiddelde premieplichtige loon per jaar, berekend over het tijdvak van vijf
      kalenderjaren, eindigend één jaar voor aanvang van het kalenderjaar waarvoor de premie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.11
  - number: 2.11.3
    text: |-
      Het gemiddelde werkgeversrisicopercentage wordt verkregen door het totaalbedrag aan uitkeringen van de aan de
      werkgevers toe te rekenen WGA-lasten vaste arbeidskrachten, die in het tweede kalenderjaar vóór het kalenderjaar
      waarvoor de premie wordt vastgesteld zijn betaald, te vermenigvuldigen met honderd en de uitkomst van deze
      berekening te delen door het totale premieplichtige loon in het tweede kalenderjaar vóór het kalenderjaar waarvoor
      de premie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.11
  - number: 2.11.4
    text: |-
      Indien een WGA-uitkering wordt toegekend direct aansluitend op een arbeidsongeschiktheidsuitkering op grond van
      de [Wet werk en inkomen naar arbeidsvermogen][ref1] wordt de duur van die uitkering in mindering gebracht op de
      periode dat de WGA-uitkering wordt toegerekend als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 2.11.5
    text: 'De WGA-uitkeringen, bedoeld in dit artikel, betreffen de WGA-uitkeringen die zijn toegekend:'
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.11
  - number: 2.11.5.a
    text: |-
      aan de werknemers die op de eerste dag van de ongeschiktheid tot het verrichten van hun arbeid als bedoeld in
      [artikel 19 van de Ziektewet][ref1] tot de werkgever in dienstbetrekking stonden en terzake van die ongeschiktheid
      de wachttijd, bedoeld in [artikel 23 van Wet WIA][ref2], hebben doorgemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '23'
  - number: 2.11.5.b
    text: |-
      aan de werknemer, bedoeld in onderdeel a, van wie het recht op een WGA-uitkering op grond van
      [artikel 55 van de Wet WIA][ref1] later dan op de eerste dag na afloop van de wachttijd of indien op die dag de
      uitsluitingsgrond, bedoeld in [artikel 43, onderdeel b, van die wet][ref2] van toepassing is, op de dag dat zich
      die uitsluitingsgrond niet meer voordoet, is ontstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '43'
  - number: 2.11.5.c
    text: |-
      aan de werknemer, bedoeld in onderdeel a, van wie het recht op een WGA-uitkering op grond van
      [artikel 57 van de Wet WIA][ref1] is herleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel57
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '57'
  - number: 2.11.6
    text: |-
      Indien de werknemer bij het intreden van de gedeeltelijke arbeidsgeschiktheid, bedoeld in
      [artikel 5 van de Wet werk en inkomen naar arbeidsvermogen][ref1], bij meer dan één werkgever in dienstbetrekking
      stond, wordt voor de toepassing van het tweede lid de WGA-uitkering naar rato van de loonsom toegerekend aan die
      werkgevers. De WGA-uitkering wordt niet toegerekend aan de werkgever bij wie de werknemer met behoud van hetzelfde
      loon arbeid is blijven verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel5
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '5'
  - number: 2.11.7
    text: |-
      De op grond van dit artikel berekende opslagen of kortingen worden vermenigvuldigd met een breuk, waarvan de teller
      wordt gevormd door het rekenpercentage, berekend op grond van [artikel 2.8, eerste lid][ref1], en [2.9][ref2],
      verminderd met een vierde van het gemiddelde percentage, bedoeld in artikel 2.8, eerste lid, en de noemer door het
      gemiddelde werkgeversrisicopercentage, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.12.1
    text: |-
      De opslag of korting WGA-lasten flexibele dienstbetrekkingen is gelijk aan het individuele
      werkgeversrisicopercentage verminderd met het gemiddelde risicopercentage gerelateerd aan deze lasten.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.12
  - number: 2.12.2
    text: |-
      Het individuele werkgeversrisicopercentage wordt verkregen door de uitkeringen van de aan de werkgever toe te
      rekenen WGA-lasten flexibele dienstbetrekkingen die in het tweede kalenderjaar vóór het kalenderjaar waarvoor
      de premie wordt vastgesteld zijn betaald aan werknemers, die uit de dienstbetrekking waaruit de WGA-uitkering is
      ontstaan recht hadden op een uitkering op grond van de [Ziektewet][ref1], te vermenigvuldigen met honderd en de
      uitkomst van deze berekening te delen door het ten laste van die werkgever komende gemiddelde premieplichtige loon
      per jaar, berekend over het tijdvak van vijf kalenderjaren, eindigend één jaar voor aanvang van het kalenderjaar
      waarvoor de premie wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 2.12.3
    text: |-
      Het gemiddelde werkgeversrisicopercentage wordt verkregen door het totaalbedrag aan uitkeringen van de aan
      werkgevers toe te rekenen WGA-lasten flexibele dienstbetrekkingen, die in het tweede kalenderjaar vóór het
      kalenderjaar waarvoor de premie wordt vastgesteld zijn betaald, te vermenigvuldigen met honderd en de uitkomst
      van deze berekening te delen door het totale premieplichtige loon in het tweede kalenderjaar vóór het kalenderjaar
      waarvoor de premie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.12
  - number: 2.12.4
    text: |-
      Voor de toepassing van het tweede en derde lid worden onder WGA-lasten flexibele dienstbetrekkingen mede begrepen
      de lasten van de WGA-uitkeringen als bedoeld in [artikel 117b, eerste lid, onderdeel a, van de Wfsv][ref1], die
      vanaf 1 januari 2012 zijn toegekend aan werknemers als bedoeld in [artikel 2.5, onderdeel h][ref2], die op grond
      van [artikel 104, eerste lid][ref3], en [108, eerste lid, van de Wfsv][ref4], zoals die artikelen luidden op
      31 december 2013, ten laste van de sectorfondsen en, voor zover die zijn toegekend aan personen als bedoeld in
      [artikel 24 van de Wfsv][ref5], ten laste van het Uitvoeringsfonds voor de overheid zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel104
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel108
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel24
    url: https://wetten.overheid.nl/BWBR0019070/2014-01-01#Artikel2.12
    references:
