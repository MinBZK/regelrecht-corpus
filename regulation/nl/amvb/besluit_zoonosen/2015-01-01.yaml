preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 15 september 2014, nr. WJZ / 14098214, gedaan in
    overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op Richtlijn 2003/99/EG van het Europees Parlement en de Raad van de Europese Unie van 17 november 2003
    inzake de bewaking van zoönosen en zoönoseverwekkers en houdende wijziging van Beschikking 90/424/EEG van de Raad
    en intrekking van Richtlijn 92/117/EEG van de Raad (PbEU 2003, L 325), Verordening (EG) nr. 2160/2003 van het
    Europees Parlement en de Raad van 17 november 2003 inzake de bestrijding van salmonella en andere specifieke door
    voedsel overgedragen zoönoseverwekkers (PbEU 2003, L 325) en de artikelen 81c, 103 en 111 van de Gezondheids- en
    welzijnswet voor dieren;

    De Afdeling advisering van de Raad van State gehoord (advies van 1 oktober 2014, nr. W15.14.0335/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 15 december 2014, nr. WJZ/14190617,
    uitgebracht in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0036054/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *wet:* [Gezondheids- en welzijnswet voor dieren][ref1];
        - *richtlijn 2003/99/EG:* [Richtlijn 2003/99/EG](32003L0099) van het Europees Parlement en de Raad van de
      Europese Unie van 17 november 2003 inzake de bewaking van zoönosen en zoönoseverwekkers en houdende wijziging van
      Beschikking 90/424/EEG van de Raad en intrekking van [Richtlijn nr. 92/117/EEG](31992L0117) van de Raad (PbEU 2003,
      L 325);
        - *verordening (EG) nr. 178/2002:* [Verordening (EG) nr. 178/2002](32002R0178) van het Europees Parlement
      en de Raad van 28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de
      levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van
      procedures voor voedselveiligheidsvoorschriften (PbEG 2002, L 31).


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0036054/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: '2'
    text: |-
      1 Onze Minister is de bevoegde autoriteit, bedoeld in artikel 3, tweede lid, van [richtlijn 2003/99/EG]
      (32003L0099).

      2 Onze Minister kan regels stellen over het doen van onderzoek naar, het bewaren van gegevens over, het
      verzamelen en ter beschikking stellen van onderzoeksresultaten met betrekking tot de aanwezigheid van zoönosen
      en zoönoseverwekkers, antimicrobiële resistentie bij zoönoseverwekkers en bij andere verwekkers, wanneer deze een
      gevaar opleveren voor de volksgezondheid.

      3 De regels, bedoeld in het tweede lid, worden vastgesteld in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0036054/2015-01-01#Artikel2
  - number: '3'
    text: |-
      De exploitant van een levensmiddelenbedrijf, bedoeld in artikel 3, derde lid, van [verordening (EG) nr. 178/2002]
      (32002R0178) die onderzoek doet naar de aanwezigheid van zoönosen of zoönoseverwekkers, die overeenkomstig artikel
      4, tweede lid, van [richtlijn nr. 2003/99/EG](32003L0099) worden bewaakt:

      a. houdt de resultaten van het onderzoek bij;

      b. bewaart de onderzoeksgegevens en de relevante isolaten gedurende twee jaar, en

      c. stelt de onderzoeksresultaten of relevante isolaten desgevraagd ter beschikking aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0036054/2015-01-01#Artikel3
  - number: '4'
    text: |-
      De [artikelen 15, vierde lid][ref1], [17][ref2], [19][ref3], [20][ref4], [21, eerste en tweede lid][ref5],
      [22, eerste lid][ref6], [24][ref7], [32][ref8], [83, aanhef en onderdeel a][ref9],
      [84 tot en met 91][ref10], [91a][ref11], [91h][ref12], [92][ref13], [100][ref14], [101][ref15] en
      [101a van de Gezondheids- en welzijnswet voor dieren][ref16] zijn van overeenkomstige toepassing ter wering en
      bestrijding van:

      a. Salmonella enteritidis;

      b. Salmonella typhimurium, waaronder monofasische Salmonella typhimurium met de antigene formule 1,4,[5],12:i:-;

      c. Salmonella hadar;

      d. Salmonella infantis;

      e. Salmonella virchow, en

      f. Salmonella java.


