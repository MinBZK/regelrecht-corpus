        artikel: 25a
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '25'
  - number: 1.1.b
    text: |-
      gebouw: gebouw als bedoeld in [artikel 1, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
