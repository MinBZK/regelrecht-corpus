    text: 'ander geluidsgevoelig gebouw:'
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
  - number: 1.1.c.1°
    text: basisscholen;
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
  - number: 1.1.c.2°
    text: |-
      school voor voortgezet onderwijs als bedoeld in [deel I van de Wet op het voortgezet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 1.1.c.3°
    text: school voor beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
  - number: 1.1.c.4°
    text: instelling voor hoger onderwijs;
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
  - number: 1.1.c.5°
    text: gezondheidszorggebouw;
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
  - number: 1.1.d
    text: |-
      woonwagenstandplaats: standplaats als bedoeld in [artikel 1, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 1.1.e
    text: 'ligplaats: plaats in het water, bestemd of aangewezen om door een woonschip bij verblijf te worden ingenomen;'
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
  - number: 1.1.f
    text: |-
      bouwvergunning: vergunning als bedoeld in [artikel 40, eerste lid, van de Woningwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
  - number: 1.1.g
    text: |-
      geprojecteerd: nog niet aanwezig en waarvoor de bouwvergunning nog niet is verleend, maar waarvoor het
      bestemmingsplan dat geldt op het tijdstip van vaststelling van de geluidszone die verlening toelaat;
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
  - number: 1.1.h
    text: |-
      geluidsbelasting in Kosteneenheden: geluidsbelasting op een bepaalde plaats, veroorzaakt door de gezamenlijke op
      een luchtvaartterrein landende en opstijgende luchtvaartuigen, bedoeld in [artikel 25, eerste lid, onder ][ref1],
      vastgesteld volgens de formule: geluidsbelasting = 20xlog(Σnx10L/15)-157; waarin het teken «Σ» staat voor de
      optelling van de bijdragen van alle luchtvaartuigen die ter plaatse voorbij vliegen in een periode van een jaar;
      waarin het teken «n» staat voor een factor gelijk aan 1 gedurende de periode van 8.00 tot 18.00 uur en voor de
      verdere tijdsperiode volgens onderstaande tabel:








                        n


                        Tijdsperiode (lokale tijd)






                        van


                        tot







                        10


                        0


                        6 uur





                        8


                        6


                        7 uur





                        4


                        7


                        8 uur





                        1


                        8


                        18 uur





                        2


                        18


                        19 uur





                        3


                        19


                        20 uur





                        4


                        20


                        21 uur





                        6


                        21


                        22 uur





                        8


                        22


                        23 uur





                        10


                        23


                        24 uur





               en waarin het teken «L» staat voor het maximaal geluidsniveau in dB(A) dat voor een passerend
      luchtvaartuig ter plaatse in de buitenlucht wordt of kan worden gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
  - number: '1.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel e, wordt onder woonschip verstaan een schip dat uitsluitend of in
      hoofdzaak wordt gebezigd of bestemd is voor bewoning.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
  - number: '1.3'
    text: |-
      Een opvangcentrum als bedoeld in [artikel 1, onderdeel d, van de Wet Centraal Orgaan opvang asielzoekers][ref1] is
      geen woning als bedoeld in dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel1
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '1'
  - number: '2.1'
    text: |-
      Voor de in het tweede lid genoemde luchtvaartterreinen is de grenswaarde voor de maximaal toelaatbare
      geluidsbelasting, bedoeld in [artikel 25, eerste lid, aanhef en onder ][ref1], 35 Kosteneenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
  - number: '2.2'
    text: 'De in het eerste lid bedoelde luchtvaartterreinen zijn:'
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel2
  - number: 2.2.a
    text: de burgerluchtvaartterreinen Budel, Eelde, Lelystad, Maastricht, Rotterdam en Texel;
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel2
  - number: 2.2.b
    text: |-
      de militaire luchtvaartterreinen Deelen, Eindhoven, Gilze-Rijen, De Kooy, Leeuwarden, De Peel, Soesterberg,
      Twenthe, Valkenburg, Volkel en Woensdrecht.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel2
  - number: '3'
    text: |-
      De grenswaarde voor structureel uitgevoerd nachtelijk vliegverkeer, bedoeld in
      [artikel 25, vierde lid, van de Luchtvaartwet][ref1], geldt voor het luchtvaartterrein Maastricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
  - number: '4.1'
    text: |-
      35 Kosteneenheden is de maximaal toelaatbare geluidsbelasting van woningen, andere geluidsgevoelige gebouwen en
      woonwagenstandplaatsen die op het tijdstip van vaststelling van de geluidszone daarbinnen nog niet aanwezig zijn en
      waarvoor nog geen bouwvergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel4
  - number: '4.2'
    text: |-
      35 Kosteneenheden is de maximaal toelaatbare geluidsbelasting van ligplaatsen die op het tijdstip van vaststelling
      van de geluidszone daarbinnen nog niet aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel4
  - number: '5'
    text: |-
      In afwijking van [artikel 4, eerste lid][ref1] is de maximaal toelaatbare geluidsbelasting van woningen en andere
      geluidsgevoelige gebouwen als bedoeld in dat artikel:


      [ref1]: https://wetten.overheid.nl/BWBR0008439#Artikel4
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008439
        artikel: '4'
        hoofdstuk: '3'
  - number: 5.a
    text: '40 Kosteneenheden:'
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel5
  - number: 5.a.1°
    text: |-
      voor woningen of andere geluidsgevoelige gebouwen die een open plek in de bestaande, te handhaven bebouwing
      opvullen;
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel5
  - number: 5.a.2°
    text: |-
      voor woningen of andere geluidsgevoelige gebouwen die zullen dienen ter vervanging van op die plaats reeds
      aanwezige bebouwing, niet zijnde woningen, andere geluidsgevoelige gebouwen of woonwagenstandplaatsen, of
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel5
  - number: 5.a.3°
    text: |-
      voor woningen of andere geluidsgevoelige gebouwen, indien uit het plan, bedoeld in
      [artikel 20, tweede lid, onder ][ref1] of uit de kaart, bedoeld in [het derde lid][ref2] van dat artikel, blijkt
      dat de geluidsbelasting ter plaatse binnen redelijke termijn zal afnemen tot 35 Kosteneenheden of minder;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008439#Artikel5
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0008439
        artikel: '5'
        hoofdstuk: '3'
  - number: 5.b
    text: '45 Kosteneenheden:'
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel5
  - number: 5.b.1°
    text: voor woningen die ter plaatse dringend noodzakelijk zijn om redenen van grond- of bedrijfsgebondenheid, of
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel5
  - number: 5.b.2°
    text: |-
      in een geval als bedoeld [onder ][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0008439#Artikel5
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008439
        artikel: '5'
        hoofdstuk: '3'
  - number: 5.b.2°.1
    text: voor geprojecteerde woningen of geprojecteerde andere geluidsgevoelige gebouwen, of
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel5
  - number: 5.b.2°.2
    text: |-
      indien het voorziene aantal geluidgehinderden en de aan de uitwendige scheidingsconstructie optredende
      geluidsbelasting niet wezenlijk toenemen: voor woningen of andere geluidsgevoelige gebouwen die – omdat het
      bestemmingsplan dat geldt op het tijdstip van vaststelling van de geluidszone, om financieel-economische redenen
      moet worden herzien – gebouwd zullen worden in plaats van geprojecteerde woningen of geprojecteerde andere
      geluidsgevoelige gebouwen.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel5
  - number: '6.1'
    text: |-
      In afwijking van [artikel 4, eerste lid][ref1] is 55, respectievelijk 65 Kosteneenheden de maximaal toelaatbare
      geluidsbelasting van woningen of andere geluidsgevoelige gebouwen als bedoeld in dat artikel die woningen,
      andere geluidsgevoelige gebouwen of woonwagenstandplaatsen vervangen die op het tijdstip van vaststelling van
      de geluidszone daarbinnen reeds aanwezig zijn, respectievelijk op dat tijdstip reeds een hogere geluidsbelasting
      ondervinden dan 40 Kosteneenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008439#Artikel4
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008439
        artikel: '4'
        hoofdstuk: '3'
  - number: '6.2'
    text: 'Het eerste lid geldt niet indien de vervanging zou leiden tot:'
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel6
  - number: 6.2.a
    text: een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel6
  - number: 6.2.b
    text: een wezenlijke toename van het aantal geluidgehinderden, of
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel6
  - number: 6.2.c
    text: een wezenlijke toename van de aan de uitwendige scheidingsconstructie optredende geluidsbelasting.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel6
  - number: '7'
    text: |-
      40 Kosteneenheden is de maximaal toelaatbare geluidsbelasting van een woning die op het tijdstip van vaststelling
      van de geluidszone:
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel7
  - number: 7.a
    text: daarbinnen reeds aanwezig is of nog niet aanwezig is maar waarvoor de bouwvergunning is verleend, en
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel7
  - number: 7.b
    text: een geluidsbelasting ondervindt van 40 Kosteneenheden of minder.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel7
  - number: '8'
    text: |-
      In afwijking van [artikel 7][ref1] is 55 Kosteneenheden de maximaal toelaatbare geluidsbelasting van een woning als
      bedoeld in dat artikel, gelegen binnen de in [artikel 25][ref2] bedoelde geluidscontour die behoort bij de waarde
      van 40 Kosteneenheden, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008439#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25d
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008439
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25d
  - number: 8.a
    text: |-
      de geluidwering van de uitwendige scheidingsconstructie van de geluidsgevoelige ruimten, bedoeld in artikel 1 van
      de regeling, bedoeld in [artikel 26][ref1], ten minste gelijk is aan de waarden, aangegeven in die regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26b
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 26b
  - number: 8.b
    text: |-
      door Onze Minister een aanbod wordt gedaan voor het treffen van zodanige geluidwerende voorzieningen dat voldaan
      wordt aan [de onder ][ref1] bedoelde waarden, of


      [ref1]: https://wetten.overheid.nl/BWBR0008439#Artikel8
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008439
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 8.c
    text: |-
      door de eigenaar of bewoner geen toestemming wordt gegeven voor het uitvoeren van een akoestisch en bouwtechnisch
      onderzoek als bedoeld in [de onder ][ref1] bedoelde regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008439#Artikel8
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008439
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '9'
    text: |-
      In afwijking van de[ artikelen 7][ref1] en [8][ref2] is 65 Kosteneenheden de maximaal toelaatbare geluidsbelasting
      van een woning als bedoeld in die artikelen, gelegen binnen de in [artikel 25][ref3] bedoelde geluidscontour die
      behoort bij de waarde van 55 Kosteneenheden, indien door Onze Minister, op een door de eigenaar binnen zes maanden
      na vaststelling van de geluidszone ingediend schriftelijk verzoek:


      [ref1]: https://wetten.overheid.nl/BWBR0008439#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008439#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25d
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008439
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008439
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 25d
  - number: 9.a
    text: |-
      is vastgesteld dat de geluidwering van de uitwendige scheidingsconstructie van de geluidsgevoelige ruimten, bedoeld
      in artikel 1 van de regeling, bedoeld in [artikel 26][ref1], ten minste gelijk is aan de waarden, aangegeven in die
      regeling, of


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26b
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 26b
  - number: 9.b
    text: |-
      zodanige geluidwerende voorzieningen zijn getroffen dat voldaan wordt aan [de onder ][ref1] bedoelde waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008439#Artikel9
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008439
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '10'
    text: |-
      55 Kosteneenheden is de maximaal toelaatbare geluidsbelasting van een woning die op het tijdstip van vaststelling
      van de geluidszone:
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel10
  - number: 10.a
    text: daarbinnen reeds aanwezig is of nog niet aanwezig is maar waarvoor de bouwvergunning is verleend, en
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel10
  - number: 10.b
    text: een geluidsbelasting ondervindt van meer dan 40 Kosteneenheden.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel10
  - number: '11'
    text: |-
      In afwijking van [artikel 10][ref1] is 65 Kosteneenheden de maximaal toelaatbare geluidsbelasting van een woning
      als bedoeld in dat artikel, gelegen binnen de in [artikel 25d van de Luchtvaartwet][ref2] bedoelde geluidscontour
      die behoort bij de waarde van 55 Kosteneenheden, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008439#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25d
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008439
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25d
  - number: 11.a
    text: |-
      de geluidwering van de uitwendige scheidingsconstructie van de geluidsgevoelige ruimten, bedoeld in artikel 1 van
      de regeling, bedoeld in [artikel 26b van de Luchtvaartwet][ref1], ten minste gelijk is aan de waarden, aangegeven
      in die regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26b
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 26b
  - number: 11.b
    text: |-
      de woning gebouwd is krachtens een bouwvergunning waarvoor de aanvraag bij burgemeester en
      wethouders is ingediend na 14 februari 1983, en de geluidsbelasting in Kosteneenheden volgens de
      in [artikel 25d van de Luchtvaartwet][ref1] bedoelde geluidscontouren niet zodanig hoger is dan de
      geluidsbelasting in Kosteneenheden op de datum waarop de bouwvergunning is verleend, dat krachtens de onder
      a bedoelde regeling een zwaardere eis aan de onder a bedoelde geluidwering zou gelden dan de eis die op de
      laatstbedoelde datum gold bij toepassing van artikel 8 van het Besluit geluidwering gebouwen, dan wel van
      [afdeling 3.1 van het Bouwbesluit 2003][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25d
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Afdeling3.1
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25d
      - id: ref2
        bwb_id: BWBR0012727
        afdeling: '3.1'
  - number: 11.c
    text: |-
      door Onze Minister een aanbod wordt gedaan voor het treffen van zodanige geluidwerende voorzieningen dat voldaan
      wordt aan de onder a bedoelde waarden, of
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel11
  - number: 11.d
    text: |-
      door de eigenaar of bewoner geen toestemming wordt gegeven voor het uitvoeren van een akoestisch en bouwtechnisch
      onderzoek als bedoeld in de onder a bedoelde regeling.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel11
  - number: '12.1'
    text: |-
      Op schriftelijk verzoek van burgemeester en wethouders stelt Onze Minister een waarde vast voor de maximaal
      toelaatbare geluidsbelasting van een ander geluidsgevoelig gebouw dat op het tijdstip van vaststelling van de
      geluidszone daarbinnen reeds aanwezig is of nog niet aanwezig is maar waarvoor de bouwvergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel12
  - number: '12.2'
    text: De in het eerste lid bedoelde waarde is niet hoger dan 65 Kosteneenheden.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel12
  - number: '12.3'
    text: |-
      Vaststelling van een waarde als bedoeld in het eerste lid kan alleen geschieden indien naar het oordeel van
      Onze Minister geluidhinder voor de gebruikers van het andere geluidsgevoelige gebouw kan worden voorkomen door
      zodanige geluidwerende voorzieningen aan dat gebouw dat de geluidsbelasting binnen dat gebouw een milieuhygiënisch
      aanvaardbaar niveau niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel12
  - number: '12.4'
    text: |-
      Een verzoek als bedoeld in het eerste lid is pas ontvankelijk als het overleg, bedoeld in
      [artikel 19 van de Luchtvaartwet][ref1], voor het betrokken luchtvaartterrein is afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '19'
  - number: '13'
    text: |-
      De maximaal toelaatbare geluidsbelasting van een woonwagenstandplaats die op het tijdstip van vaststelling van de
      geluidszone daarbinnen reeds aanwezig is of nog niet aanwezig is maar waarvoor de bouwvergunning is verleend, is
      40 Kosteneenheden.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel13
  - number: 13a
    text: |-
      De maximaal toelaatbare geluidsbelasting van een ligplaats die op het tijdstip van vaststelling van de geluidszone
      daarbinnen reeds aanwezig is, is 40 Kosteneenheden.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel13a
  - number: '14'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt, in overeenstemming met Onze
      Minister, binnen drie jaar na de inwerkingtreding van dit besluit aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van dit besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel14
  - number: '16'
    text: Het Besluit geluidsbelasting grote luchtvaartterreinen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel16
  - number: '17.1'
    text: |-
      Het Besluit geluidsbelasting grote luchtvaartterreinen blijft van toepassing op een verzoek als bedoeld in
      [artikel 8][ref1] van dat besluit dat bij Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      is ingediend vóór de datum van inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008439#Artikel8
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008439
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '17.2'
    text: |-
      Het Besluit geluidsbelasting grote luchtvaartterreinen – met uitzondering van de vaststelling van hogere
      waarden, bedoeld in de[artikelen 3, tweede en derde lid][ref1], en [6, tweede lid][ref2], en met uitzondering
      van [artikel 8][ref3] – blijft van toepassing op een bestemmingsplan dat is of wordt vastgesteld ter uitvoering
      van aanwijzingen als bedoeld in [artikel 26 van de Luchtvaartwet][ref4] die gegeven zijn vóór de datum van
      inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008439#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008439#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008439#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel26
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008439
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008439
        artikel: '6'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0008439
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002267
        artikel: '26'
  - number: '17.3'
    text: |-
      Het tweede lid geldt niet voor woningen, andere geluidsgevoelige gebouwen en woonwagenstandplaatsen die op het
      tijdstip van vaststelling van de geluidszone daarbinnen reeds aanwezig zijn of nog niet aanwezig zijn maar waarvoor
      de bouwvergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel17
  - number: '17.4'
    text: |-
      Indien het tweede lid van toepassing is, is de maximaal vast te stellen hogere waarde, genoemd in de artikelen 3,
      tweede en derde lid, en 6, tweede lid, van het Besluit geluidsbelasting grote luchtvaartterreinen, voor de in die
      bepalingen bedoelde gevallen de ten hoogste toelaatbare geluidsbelasting.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel17
  - number: '18'
    text: |-
      Dit besluit treedt in werking met ingang van de veertiende dag na de datum van uitgifte van het *Staatsblad* waarin
      het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel18
  - number: '19'
    text: 'Dit besluit wordt aangehaald als: Besluit geluidsbelasting grote luchtvaart.'
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel19
