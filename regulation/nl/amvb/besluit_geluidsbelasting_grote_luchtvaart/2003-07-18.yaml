preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 11 juli 1996,
    nr. MJZ9604008, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan na overleg met Onze Ministers van
    Verkeer en Waterstaat en van Defensie;

    Gelet op artikel 25, eerste lid, aanhef en onder a, derde en vierde lid, van de Luchtvaartwet;

    De Raad van State gehoord (advies van 18 september 1996, nr. W08.96.0301);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 16
    december 1996, nr. MJZ 96072712, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht na overleg met
    Onze Ministers van Verkeer en Waterstaat en van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
  - number: 1.1.a
    text: |-
      geluidszone: geluidszone als bedoeld in [artikel 25][ref1] voor de grenswaarde, bedoeld in
      [artikel 25, eerste lid, aanhef en onder ][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0008439/2003-07-18#Artikel1
