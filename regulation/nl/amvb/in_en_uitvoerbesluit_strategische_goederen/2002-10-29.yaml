---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: in_en_uitvoerbesluit_strategische_goederen
regulatory_layer: AMVB
publication_date: '1996-10-17'
valid_from: '2002-10-29'
bwb_id: BWBR0002408
url: https://wetten.overheid.nl/BWBR0002408/2002-10-29
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op voordracht van Onze Ministers van Economische Zaken en van Buitenlandse Zaken van 18 april 1963, No. 663/465
    W.J.A., gehoord de Sociaal-Economische Raad en de Commissie Regelingen In- en uitvoerwet, door die Raad ingesteld
    op grond van artikel 43 van de Wet op de Bedrijfsorganisatie (Stb. 1950, K 22);

    Overwegende, dat het belang van de internationale rechtsorde naar Ons oordeel vereist regelen te stellen ten
    aanzien van de uitvoer van bepaalde goederen, die van strategische betekenis zijn of kunnen zijn;

    Gelet op de artikelen 2 en 4 van de In- en uitvoerwet (Stb. 1962, 295);

    De Raad van State gehoord (advies van 10-24 april 1963, No. 71d);

    Gezien het nader rapport van Onze voornoemde Ministers van 25 april 1963, No. 663/561 W.J.A.);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel1
  - number: 1.a
    text: |-
      [verordening nr. 1334/2000](32000R1334): [verordening (EG) nr. 1334/2000](32000R1334) van de Raad van de Europese
      Unie van 22 juni 2000 tot instelling van een communautaire regeling voor controle op de uitvoer van producten en
      technologie voor tweeërlei gebruik (PbEG L 159);
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel1
  - number: 1.b
    text: |-
      niet-communautaire goederen: hetgeen daaronder wordt verstaan in Titel I, artikel 4, onder 8, van [verordening
      (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992 tot vaststelling van
      het communautair douanewetboek (PbEG L 302);
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel1
  - number: 1.c
    text: 'Onze Minister: Onze Minister van Economische Zaken.'
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel1
  - number: '2.1'
    text: |-
      De uitvoer van goederen, aangewezen in de bijlage bij dit besluit, zonder vergunning van Onze Minister, is
      verboden.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel2
  - number: '2.2'
    text: |-
      De uitvoer van goederen, aangewezen in bijlage I bij [verordening nr. 1334/2000](32000R1334), zonder communautaire
      algemene uitvoervergunning bedoeld in artikel 6, eerste lid, van [verordening nr. 1334/2000](32000R1334), dan
      wel zonder vergunning van Onze Minister of zonder geldige, in een andere lidstaat van de Europese Unie afgegeven
      vergunning, is verboden.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel2
  - number: '2.3'
    text: |-
      Het eerste lid is niet van toepassing op de uitvoer van goederen, aangewezen krachtens
      [artikel 3, eerste lid, van de Uitvoeringswet verdrag chemische wapens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007434#Artikel3
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007434
        artikel: '3'
  - number: '2.4'
    text: |-
      In afwijking van het tweede lid is de in- en uitvoer verboden van goederen op lijst 2 van onderdeel B van
      de bijlage inzake stoffen bij het op 13 januari 1993 te Parijs tot stand gekomen verdrag tot verbod van de
      ontwikkeling, de produktie, de aanleg van voorraden en het gebruik van chemische wapens en inzake de vernietiging
      van deze wapens (Trb. 1993, 162) uit respectievelijk naar landen die niet partij zijn bij dit verdrag.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel2
  - number: '2.5'
    text: De goederen, bedoeld in het eerste en tweede lid, worden aangemerkt als strategische goederen.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel2
  - number: '3.1'
    text: |-
      De regels, die in dit besluit zijn gesteld ten aanzien van de uitvoer van goederen, zijn met betrekking tot de
      goederen, aangewezen in bijlage IV bij [verordening nr. 1334/2000](32000R1334), van overeenkomstige toepassing
      op het doen uitgaan van die goederen uit Nederland met als bestemming een andere lidstaat van de Europese Unie,
      uitgezonderd België en Luxemburg.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid is niet van toepassing op het doen uitgaan van goederen als bedoeld in [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002408#Artikel2
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002408
        artikel: '2'
  - number: 3a.1
    text: |-
      De regels die in dit besluit zijn gesteld ten aanzien van de uitvoer van goederen, zijn van overeenkomstige
      toepassing op de goederen, aangewezen in de bijlage bij dit besluit, waarvoor aangifte tot wederuitvoer als bedoeld
      in artikel 182 van het Communautair douanewetboek is gedaan.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel3a
  - number: 3a.2
    text: |-
      Het eerste lid geldt niet voor goederen die tot op het moment van de aangifte tot wederuitvoer: - de status hadden
      van goederen in tijdelijke opslag als bedoeld in artikel 50 van het Communautair douanewetboek;
        - korter dan 45 dagen, indien de goederen over zee waren aangevoerd, en korter dan 20 dagen, indien zij anders
      dan over zee waren aangevoerd, hebben verbleven in de douane-entrepots typen B en C, als bedoeld in artikel 525
      van [verordening (EEG) nr. 2454/93](31993R2454) van de Commissie van de Europese Gemeenschappen van 2 juli 1993
      houdende vaststelling van bepalingen ter uitvoering van [verordening (EEG) nr. 2913/92](31992R2913) van de Raad tot
      vaststelling van het communautair douanewetboek (PbEG L 253).
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel3a
  - number: 3a.3
    text: |-
      Het eerste lid geldt voorts niet met betrekking tot de in dat lid bedoelde goederen die herkomstig zijn uit of
      als eindbestemming hebben Australië, Japan, Nieuw-Zeeland of Zwitserland of een van de lidstaten van de Noord-
      Atlantische Verdragsorganisatie.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel3a
  - number: 3a.4
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de goederen, aangewezen in bijlage I bij
      [verordening nr. 1334/2000](32000R1334).
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel3a
  - number: '4'
    text: |-
      Onze Minister kan vrijstelling en op aanvrage ontheffing verlenen van de [artikelen 2, eerste lid][ref1] en
      [3a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002408#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002408#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002408
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002408
        artikel: 3a
  - number: '5'
    text: |-
      Als categorie van strategische goederen, bedoeld in artikel 2a, vijfde lid, onderdeel b, van de wet, worden
      aangewezen de goederen, aangewezen in de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel5
  - number: '6.1'
    text: |-
      Indien de wapens, genoemd in de bijlage bij het Gemeenschappelijk optreden van 17 december 1998 door de Raad
      aangenomen op basis van artikel J.3 van het Verdrag betreffende de Europese Unie inzake de bijdrage van de Europese
      Unie aan de bestrijding van de destabiliserende accumulatie en verspreiding van handvuurwapens en lichte wapens
      (1999/34/GBVB; PbEG 1999 L 009), naar de tekst zoals deze bij dat gemeenschappelijk optreden is vastgesteld,
      Nederland worden binnengebracht en vervolgens, zonder dat daartoe ingevolge dit besluit een vergunning benodigd is,
      weer uitgaan, vindt een melding plaats bij de Belastingdienst/Douane.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel6
  - number: '6.2'
    text: |-
      Indien geen summiere aangifte behoeft te worden gedaan als bedoeld in artikel 43 van het Communautair douanewetboek
      vindt de melding, bedoeld in het eerste lid, plaats: - bij het binnenbrengen van de goederen,
        - door middel van het doen van de aanvraag om een consent tot binnenkomen, bedoeld in artikel 14, eerste lid, van
      de Wet wapens en munitie, en
        - door degene die verplicht is de onder b bedoelde aanvraag te doen.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel6
  - number: '6.3'
    text: |-
      In de gevallen, anders dan die bedoeld in het tweede lid, vindt de melding, bedoeld in het eerste lid, plaats:
        - op het tijdstip van de aangifte tot wederuitvoer als bedoeld in artikel 182, derde lid, van het Communautair
      douanewetboek, of de aangifte tot plaatsing onder de douaneregeling douanevervoer als bedoeld in artikel 91 van
      dat wetboek,
        - op een tijdstip dat ten minste 12 kantooruren is gelegen voor het moment waarop de wederuitvoer dan wel het
      douanevervoer aanvangt, en
        - door degene die op grond van het Communautair douanewetboek verplicht is tot het doen van de aangifte, bedoeld
      onder a.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel6
  - number: '6.4'
    text: |-
      In de situatie, bedoeld in het derde lid, geschiedt de melding schriftelijk en omvat deze een omschrijving van de
      goederen alsmede de vermelding van: - de hoeveelheid goederen;
        - de bestemming en, indien deze afwijkend is, de eindbestemming van de goederen;
        - het vervoermiddel waarin de goederen zich bevinden;
        - de voorziene plaats van uitgaan uit Nederland en
        - de naam van degene die de aangifte of kennisgeving doet en, indien dat een ander is dan degene die het
      beschikkingsrecht heeft over de goederen, de naam van laatstbedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel6
  - number: '7'
    text: |-
      Bij de verlening van een vergunning als bedoeld in [artikel 2][ref1] worden daaraan voor de houder van de
      vergunning de volgende voorschriften verbonden:


      [ref1]: https://wetten.overheid.nl/BWBR0002408#Artikel2
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002408
        artikel: '2'
  - number: 7.a
    text: |-
      de vergunning bij de uitvoer van goederen, waarvoor zij is verleend, in handen te stellen van de daarbij betrokken
      ambtenaar van de rijksbelastingdienst, bevoegd inzake douane;
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel7
  - number: 7.b
    text: |-
      de vergunning, zodra vaststaat dat daarvan geen gebruik meer kan worden gemaakt, voor zover zij in verband daarmede
      niet is ingehouden door een ambtenaar als onder *a* bedoeld, terstond terug te zenden aan degene, die haar heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel7
  - number: 7.c
    text: |-
      aan degene, die de vergunning heeft verleend, binnen de daartoe gestelde termijn alle gewenste inlichtingen te
      verstrekken omtrent het van de vergunning gemaakte gebruik.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel7
  - number: 7a.1
    text: |-
      De regels, die in dit besluit zijn gesteld ten aanzien van de uitvoer van goederen, zijn van overeenkomstige
      toepassing op handelingen waarmee wordt beoogd die goederen, voor zover deze binnengekomen niet-communautaire
      goederen zijn, het Nederlandse grondgebied te doen verlaten, indien met betrekking tot die goederen een
      internationaal importcertificaat als bedoeld in het [Besluit afgifte verklaringen strategische goederen][ref1]
      is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004001
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0004001
  - number: 7a.2
    text: Onze Minister kan nadere regelen stellen ter zake van de in het eerste lid bedoelde toepassing.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel7a
  - number: '8'
    text: |-
      Vergunningen en ontheffingen krachtens de Uitvoerbeschikking strategische goederen 1963 (*Stcrt.* 1962, 222)
      verleend, worden, voor zover zij hun gelding nog niet hebben verloren, geacht te zijn verleend op grond van dit
      besluit.
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: In- en uitvoerbesluit strategische goederen.'
    url: https://wetten.overheid.nl/BWBR0002408/2002-10-29#Artikel9
