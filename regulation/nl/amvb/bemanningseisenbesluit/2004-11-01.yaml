  - number: '21.1'
    text: |-
      Onze Minister kan, na overleg met de naar zijn oordeel representatieve organisaties van werkgevers en werknemers
      in de zeevaart, zonodig onder nader te stellen voorschriften of beperkingen, het bezit van een ander bewijs van
      bekwaamheid toestaan.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel21
  - number: '21.2'
    text: |-
      De inspecteur-generaal kan aanvulling van de bemanning ingevolge dit besluit voorschrijven, indien de inrichting,
      de uitrusting, de bruto-tonnage, het voortstuwingsvermogen of de bestemming van het schip hem daartoe aanleiding
      geven.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel21
  - number: '22.1'
    text: |-
      De kapitein, eerste officieren en maritieme officieren die overeenkomstig het bepaalde in de
      [artikelen 23 tot en met 28][ref1] diensttijd hebben behaald, verkrijgen op een daartoe gedaan verzoek een bewijs
      van diensttijd.


      [ref1]: https://wetten.overheid.nl/BWBR0005266#Artikel23
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005266
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '22.2'
    text: |-
      De in het eerste lid bedoelde diensttijd dient te zijn doorgebracht als lid van de bemanning van een voor de vaart
      ter zee gebezigd schip en te zijn behaald na het verkrijgen van het voor de betreffende functie vereiste diploma.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel22
  - number: '22.3'
    text: |-
      Ter verkrijging van een bewijs van diensttijd dient een belanghebbende een verzoek in bij de inspecteur-generaal
      onder overlegging van bewijsstukken met betrekking tot de behaalde diensttijd.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel22
  - number: '23.1'
    text: |-
      Voor de toelating als kapitein op een vrachtschip met een bruto-tonnage van 6000 of meer dient de bezitter van het
      diploma maritiem officier een diensttijd te hebben behaald van ten minste zes jaren waarvan ten minste een jaar als
      eerste officier aan boord van vrachtschepen met een voortstuwingsvermogen van 3000 kW of meer.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel23
  - number: '23.2'
    text: |-
      Voor de toelating als kapitein op een vrachtschip met een bruto-tonnage van 2000 of meer, doch minder dan 6000
      dient de bezitter van het diploma maritiem officier een diensttijd te hebben behaald van ten minste vier jaren
      waarvan ten minste een jaar als eerste officier aan boord van vrachtschepen met een bruto-tonnage van 2000 of meer
      en een voortstuwingsvermogen van 750 kW of meer.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel23
  - number: '23.3'
    text: |-
      Voor de toelating als kapitein op een vrachtschip met een bruto-tonnage van minder dan 2000 dient de bezitter van
      het diploma maritiem officier een diensttijd te hebben behaald van ten minste drie jaren als maritiem officier
      dan wel van ten minste twee jaren als maritiem officier, waarvan een jaar als eerste officier of als enig maritiem
      officier.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel23
  - number: '24.1'
    text: |-
      Voor de toelating als kapitein op een bevoorradingsschip of een sleepboot met een bruto-tonnage van minder dan
      4000 dan wel een voortstuwingsvermogen van 3000 kW of meer, dient de bezitter van het diploma maritiem officier een
      diensttijd te hebben behaald van ten minste vier jaren waarvan ten minste een jaar als eerste officier aan boord
      van bevoorradingsschepen of sleepboten met een voortstuwingsvermogen van 3000 kW of meer.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel24
  - number: '24.2'
    text: |-
      Voor de toelating als kapitein op een bevoorradingsschip of een sleepboot met een bruto-tonnage van minder dan
      2000 en een voortstuwingsvermogen van minder dan 3000 kW dient de bezitter van het diploma maritiem officier een
      diensttijd te hebben behaald van ten minste drie jaren als maritiem officier dan wel van ten minste twee jaren als
      maritiem officier waarvan een jaar als eerste officier of enig maritiem officier aan boord van bevoorradingsschepen
      of sleepboten.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel24
  - number: '24.3'
    text: |-
      Van de in het eerste en tweede lid bedoelde diensttijd mag ten hoogste de helft behaald worden aan boord van
      schepen geen bevoorradingsschip of sleepboot zijnde.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel24
  - number: '25.1'
    text: |-
      Voor de toelating als eerste officier op een vrachtschip met een bruto-tonnage van 6000 of meer dient de bezitter
      van het diploma maritiem officier een diensttijd te hebben behaald van ten minste vijf jaren als maritiem officier
      aan boord van vrachtschepen met een voortstuwingsvermogen van 3000 kW of meer.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel25
  - number: '25.2'
    text: |-
      Voor de toelating als eerste officier op een vrachtschip met een bruto-tonnage van 2000 of meer, doch minder dan
      6000 dient de bezitter van het diploma maritiem officier een diensttijd te hebben behaald van ten minste drie jaren
      als maritiem officier aan boord van vrachtschepen met een voortstuwingsvermogen van 750 kW of meer.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel25
  - number: '25.3'
    text: |-
      Voor de toelating als eerste officier op een vrachtschip met een bruto-tonnage van minder dan 2000 dient de
      bezitter van het diploma maritiem officier een diensttijd te hebben behaald van ten minste een jaar als maritiem
      officier aan boord van vrachtschepen, met dien verstande dat voor toelating als eerste officier aan boord van
      vrachtschepen met een voortstuwingsvermogen van minder dan 750 kW volstaan kan worden met een diensttijd van ten
      minste zes maanden als maritiem officier aan boord van vrachtschepen.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel25
  - number: '26.1'
    text: |-
      Voor de toelating als eerste officier op een bevoorradingsschip of een sleepboot met een bruto-tonnage van minder
      dan 4000 dan wel een voortstuwingsvermogen van 3000 kW of meer, dient de bezitter van het diploma maritiem officier
      een diensttijd te hebben behaald als maritiem officier van ten minste drie jaren aan boord van bevoorradingsschepen
      of sleepboten met een voortstuwingsvermogen van 3000 kW of meer.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel26
  - number: '26.2'
    text: |-
