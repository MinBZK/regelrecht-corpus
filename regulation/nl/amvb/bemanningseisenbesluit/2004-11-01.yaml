---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: bemanningseisenbesluit
regulatory_layer: AMVB
publication_date: '2013-12-19'
valid_from: '2004-11-01'
bwb_id: BWBR0005266
url: https://wetten.overheid.nl/BWBR0005266/2004-11-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 5 juni 1991, nr. S/J 30.890./91, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;

    Gelet op artikel 4, eerste lid, van de Wet op de zeevaartdiploma's (Stb. 1935, 456) en artikel 5 van de Schepenwet
    (Stb. 1932, 86);

    Gelet op het Internationaal Verdrag betreffende de normen voor zeevarenden inzake opleiding, diplomering en
    wachtdienst, 1978 (Trb. 1981, 144);

    De Raad van State gehoord (advies van 11 september 1991, WO9.91.0292);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 8 november 1991, nr. S/J31.956/91,
    Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De definities, vermeld in [artikel 1 van het Besluit zeevaartdiploma's](onbekend) (*Stb.* 1988, 260) zijn van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel1
  - number: '1.2'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel1
  - number: 1.2.a
    text: |-
      maritiem officier specialisatie navigatie: de maritieme officier, gediplomeerd door een instelling voor hoger
      beroepsonderwijs als bedoeld in de Wet op het hoger beroepsonderwijs (*Stb.* 1986, 289), studierichting maritiem
      officier, met specialisatie navigatie, tevens houder van ten minste het diploma als derde stuurman voor de grote
      handelsvaart en het diploma A als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel1
  - number: 1.2.b
    text: |-
      maritiem officier specialisatie werktuigkunde: de maritieme officier, gediplomeerd door een instelling voor
      hoger beroepsonderwijs als bedoeld in de Wet op het hoger beroepsonderwijs, studierichting maritiem officier, met
      specialisatie werktuigkunde, tevens houder van ten minste het diploma A als scheepswerktuigkundige en het diploma
      als derde stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel1
  - number: 1.2.c
    text: |-
      middelbaar maritiem officier A: de houder van ten minste het diploma als stuurman voor de kleine
      handelsvaart tezamen met het aanvullingsdiploma als stuurman voor de kleine handelsvaart en het diploma A als
      scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel1
  - number: 1.2.d
    text: |-
      middelbaar maritiem officier M: de houder van ten minste het diploma als stuurman voor de kleine handelsvaart
      tezamen met het aanvullingsdiploma als stuurman voor de kleine handelsvaart en het diploma als motordrijver.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel1
  - number: '2.1'
    text: Dit besluit is niet van toepassing op gesleepte schepen en op zeilschepen.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van dit besluit wordt het diploma als stuurman voor de kleine handelsvaart tezamen met het
      aanvullingsdiploma als stuurman voor de kleine handelsvaart, bedoeld in [artikel 2, eerste lid, van de Wet op de
      zeevaartdiploma's](onbekend) (*Stb.* 1935, 456), gelijk gesteld met het diploma als derde stuurman voor de grote
      handelsvaart.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel2
  - number: '3.1'
    text: Scheepstechnicus is de houder van een getuigschrift als scheepstechnicus, afgegeven door de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel3
  - number: '3.2'
    text: 'De adspirant scheepstechnicus dient:'
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel3
  - number: 3.2.a
    text: 18 jaar of ouder te zijn;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel3
  - number: 3.2.b
    text: |-
      in het bezit te zijn van het diploma scheepstechnicus, afgegeven op grond van de door Onze Minister van Onderwijs
      en Wetenschappen en Onze Minister goedgekeurde Eindexamenregeling van het project scheepstechnicus en het
      bijbehorende examenprogramma, dan wel van een overeenkomstig [artikel 4, eerste lid][ref1], erkend bewijsstuk;


      [ref1]: https://wetten.overheid.nl/BWBR0005266#Artikel4
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005266
        artikel: '4'
        hoofdstuk: II
  - number: 3.2.c
    text: |-
      na het behalen van het onder *b* bedoelde diploma of bewijsstuk negen maanden diensttijd te hebben behaald aan
      boord van schepen met een voortstuwingsvermogen van 750 kW of meer en
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel3
  - number: 3.2.d
    text: gedurende die diensttijd ten genoegen van de inspecteur-generaal een praktijkboek te hebben bijgehouden.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel3
  - number: '3.3'
    text: |-
      De diensttijd, bedoeld in het tweede lid, onder *c*, mag ook zijn behaald aan boord van schepen met een
      voortstuwingsvermogen van minder dan 750 kW, mits aan boord van deze schepen een middelbaar maritiem officier M
      dienst doet.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel3
  - number: '3.4'
    text: |-
      Indien het praktijkboek niet in alle opzichten naar behoren is bijgehouden kan de inspecteur-generaal de adspirant
      scheepstechnicus een of meer aanvullende opdrachten geven, die binnen een daarbij te bepalen termijn van ten
      hoogste zes maanden dienen te worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister kan andere bewijsstukken dan het diploma scheepstechnicus erkennen, indien zij worden afgegeven
      op grond van een examen dat naar zijn oordeel voldoende overeenkomt met een examen, afgelegd op grond van de
      Eindexamenregeling van het project scheepstechnicus en het bijbehorende examenprogramma.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister kan de erkenning intrekken indien naar zijn oordeel de voldoende overeenkomst, bedoeld in het eerste
      lid, niet meer aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel4
  - number: '5'
    text: |-
      Ter verkrijging van het getuigschrift als scheepstechnicus wendt de adspirant scheepstechnicus zich tot de
      inspecteur-generaal onder overlegging van:
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel5
  - number: 5.a
    text: het geldig paspoort of het monsterboekje van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel5
  - number: 5.b
    text: |-
      het in [artikel 3, tweede lid, onder b][ref1], bedoelde diploma scheepstechnicus of bewijsstuk;


      [ref1]: https://wetten.overheid.nl/BWBR0005266#Artikel3
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005266
        artikel: '3'
        hoofdstuk: II
  - number: 5.c
    text: het bewijs dat hij de voorgeschreven diensttijd heeft behaald;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel5
  - number: 5.d
    text: het gedurende de diensttijd bijgehouden praktijkboek en
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel5
  - number: 5.e
    text: |-
      een bewijs van betaling van de in [artikel 7][ref1] bedoelde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005266#Artikel7
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005266
        artikel: '7'
        hoofdstuk: II
  - number: '6'
    text: |-
      Een duplikaat van het getuigschrift als scheepstechnicus wordt, indien het verloren gaan van het getuigschrift
      aannemelijk wordt gemaakt, op verzoek van belanghebbende door of namens de inspecteur-generaal afgegeven, nadat een
      bewijs van betaling van de in [artikel 7][ref1] bedoelde kosten is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005266#Artikel7
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005266
        artikel: '7'
        hoofdstuk: II
  - number: '7'
    text: |-
      Onze Minister stelt de tarieven vast voor de te berekenen kosten van de behandeling van de aanvraag van het
      getuigschrift alsmede van een duplikaat van het getuigschrift als scheepstechnicus.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel7
  - number: '8'
    text: |-
      Het model van het getuigschrift als scheepstechnicus en het model van het praktijkboek worden door de inspecteur-
      generaal vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel8
  - number: '9.1'
    text: |-
      In afwijking van het daaromtrent bepaalde in het Besluit zeevaartdiploma's en in de [artikelen 110][ref1],
      [111][ref2] en [112 van het Schepenbesluit 1965][ref3] (*Stb.* 367) kan een schip, indien het naar het redelijk
      oordeel van de inspecteur-generaal daartoe geschikt is, worden bemand overeenkomstig een van de in dit besluit
      opgenomen bemanningssamenstellingen. De reder dient daartoe, onder opgaaf van de bemanningssamenstelling die hij
      wenst, een verzoek in bij de inspecteur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel112
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '110'
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '111'
      - id: ref3
        bwb_id: BWBR0002501
        artikel: '112'
  - number: '9.2'
    text: |-
      In afwijking van het bepaalde in de [artikelen 10 tot en met 20][ref1] met betrekking tot het bezit van diploma's
      en bewijzen van diensttijd, kan worden volstaan met het bezit van een verklaring van geschiktheid en bekwaamheid,
      uitgereikt op grond van [artikel 119 van het Schepenbesluit 1965][ref2], waaruit blijkt dat de houder bevoegd is de
      desbetreffende functie te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0005266#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel119
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005266
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '119'
  - number: '10.1'
    text: 'Aan boord van een vrachtschip met een bruto-tonnage van 9000 of meer kan de volgende bemanning dienst doen:'
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.a
    text: bemanningssamenstelling I
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.a.1°
    text: een kapitein in het bezit van het diploma als eerste stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.a.2°
    text: een eerste stuurman in het bezit van het diploma als eerste stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.a.3°
    text: |-
      een tweede stuurman in het bezit van het diploma als derde stuurman voor de grote handelsvaart en het bewijs
      van diensttijd, bedoeld in [artikel 14](onbekend), in verband met [artikel 16 van het Besluit zeevaartdiploma's]
      (onbekend);
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.a.4°
    text: een derde stuurman in het bezit van het diploma als derde stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.a.5°
    text: een eerste scheepswerktuigkundige in het bezit van het diploma C als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.a.6°
    text: een tweede scheepswerktuigkundige in het bezit van het diploma B als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.a.7°
    text: een derde scheepswerktuigkundige in het bezit van het diploma A als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.a.8°
    text: |-
      een vierde scheepswerktuigkundige in het bezit van het diploma als motordrijver, met dien verstande dat deze
      vervangen mag worden door een scheepstechnicus en dat de vierde scheepswerktuigkundige niet vereist is aan boord
      van schepen met een voortstuwingsvermogen van minder dan 8000 kW en
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.a.9°
    text: vier ongediplomeerde scheepsgezellen;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.b
    text: bemanningssamenstelling II
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.b.1°
    text: een kapitein in het bezit van het diploma als eerste stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.b.2°
    text: een eerste stuurman in het bezit van het diploma als eerste stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.b.3°
    text: |-
      een tweede stuurman in het bezit van het diploma als derde stuurman voor de grote handelsvaart en het bewijs
      van diensttijd, bedoeld in [artikel 14](onbekend), in verband met [artikel 16 van het Besluit zeevaartdiploma's]
      (onbekend);
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.b.4°
    text: een eerste scheepswerktuigkundige in het bezit van het diploma C als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.b.5°
    text: een tweede scheepswerktuigkundige in het bezit van het diploma B als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.b.6°
    text: twee maritieme officieren specialisatie navigatie dan wel specialisatie werktuigkunde;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.b.7°
    text: een scheepstechnicus en
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.b.8°
    text: drie ongediplomeerde scheepsgezellen;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.c
    text: bemanningssamenstelling III
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.c.1°
    text: een kapitein in het bezit van het diploma als eerste stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.c.2°
    text: een eerste stuurman in het bezit van het diploma als eerste stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.c.3°
    text: een eerste scheepswerktuigkundige in het bezit van het diploma C als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.c.4°
    text: |-
      een maritiem officier specialisatie werktuigkunde in het bezit van het bewijs van diensttijd, bedoeld in
      [artikel 17][ref1], in verband met [artikel 22][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005266#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005266#Artikel22
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005266
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005266
        artikel: '22'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 10.1.c.5°
    text: |-
      twee maritieme officieren specialisatie navigatie of specialisatie werktuigkunde, waarvan één een diensttijd heeft
      behaald van ten minste twee jaren als maritiem officier aan boord van vrachtschepen met een voortstuwingsvermogen
      van 3000 kW of meer;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.c.6°
    text: twee scheepstechnici en
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.c.7°
    text: twee ongediplomeerde scheepsgezellen;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.d
    text: bemanningssamenstelling IV
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.d.1°
    text: een kapitein in het bezit van het diploma als eerste stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.d.2°
    text: een eerste scheepswerktuigkundige in het bezit van het diploma C als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.d.3°
    text: |-
      een maritiem officier specialisatie navigatie die een diensttijd heeft behaald van ten minste vier jaren als
      maritiem officier aan boord van vrachtschepen met een voortstuwingsvermogen van 3000 kW of meer;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.d.4°
    text: |-
      een maritiem officier specialisatie werktuigkunde in het bezit van het bewijs van diensttijd, bedoeld in
      [artikel 22][ref1], in verband met [artikel 27][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005266#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005266#Artikel27
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005266
        artikel: '22'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005266
        artikel: '27'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 10.1.d.5°
    text: |-
      twee maritieme officieren specialisatie navigatie dan wel specialisatie werktuigkunde, waarvan één een
      diensttijd heeft behaald van ten minste twee jaren als maritiem officier aan boord van vrachtschepen met een
      voortstuwingsvermogen van 3000 kW of meer;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.d.6°
    text: twee scheepstechnici en
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.d.7°
    text: twee ongediplomeerde scheepsgezellen;
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.e
    text: bemanningssamenstelling V
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
  - number: 10.1.e.1°
    text: |-
      een kapitein, zijnde maritiem officier specialisatie werktuigkunde, dan wel specialisatie navigatie in het bezit
      van het bewijs van diensttijd, bedoeld in [artikel 22][ref1], in verband met [artikel 23][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005266#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005266#Artikel23
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005266
        artikel: '22'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005266
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 10.1.e.2°
