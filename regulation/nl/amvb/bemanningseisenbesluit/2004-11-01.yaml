      dan 750 kW volstaan kan worden met een diensttijd van ten minste zes maanden als maritiem officier aan boord van
      bevoorradingsschepen of sleepboten.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel26
