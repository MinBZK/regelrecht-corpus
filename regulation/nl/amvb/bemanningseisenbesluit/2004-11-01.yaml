  - number: '29'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden gesteld, met dien verstande dat dat tijdstip niet eerder is
      dan een maand na de datum van uitgifte van het *Staatsblad* waarin dit besluit wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel29
  - number: '30'
    text: 'Dit besluit kan worden aangehaald als: Bemanningseisenbesluit.'
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel30
