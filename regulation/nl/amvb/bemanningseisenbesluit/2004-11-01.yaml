  - number: '10.2'
    text: |-
      De maritieme officieren specialisatie navigatie dan wel specialisatie werktuigkunde, genoemd in het eerste lid,
      onder *b*, 6°, onder *c*, 5°, onder *d*, 5°, en onder *e*, 5°, mogen worden vervangen door een middelbaar maritiem
      officier A, met dien verstande dat aan boord van schepen met een voortstuwingsvermogen van minder dan 8000 kW ook
      een middelbaar maritiem officier M dienst mag doen.
    url: https://wetten.overheid.nl/BWBR0005266/2004-11-01#Artikel10
