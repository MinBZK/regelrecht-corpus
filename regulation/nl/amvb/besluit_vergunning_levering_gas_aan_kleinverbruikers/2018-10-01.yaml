---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_vergunning_levering_gas_aan_kleinverbruikers
regulatory_layer: AMVB
publication_date: '2025-11-12'
valid_from: '2018-10-01'
bwb_id: BWBR0015154
url: https://wetten.overheid.nl/BWBR0015154/2018-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken van 20 februari 2003, nr. WJZ 03007148;

    Gelet op de artikelen 45, tweede lid, en 46, van de Gaswet;

    De Raad van State gehoord (advies van 10 april 2003, no. W10.03.0073/II);

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken van 22 mei 2003, nr. WJZ 3011123;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Gaswet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011440
  - number: 1.b
    text: |-
      kleinverbruiker: de in [artikel 43, eerste lid, van de wet][ref1] bedoelde afnemer;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
  - number: 1.c
    text: |-
      vergunning: de vergunning, bedoeld in [artikel 43, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
  - number: 1.d
    text: 'aanvraag: de aanvraag om een vergunning voor de levering van gas aan kleinverbruikers;'
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel1
  - number: 1.e
    text: 'aanvrager: degene die een vergunning voor de levering van gas aan kleinverbruikers aanvraagt.'
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel1
  - number: '2.1'
    text: Een aanvraag voor een vergunning wordt bij de Autoriteit Consument en Markt ingediend.
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel2
  - number: '2.2'
    text: |-
      De aanvraag voor een vergunning bevat in aanvulling op
      [artikel 4:2, eerste lid, van de Algemene wet bestuursrecht][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.2.a
    text: |-
      een schatting van de verwachte afzet aan kleinverbruikers gedurende tenminste de eerste 12 maanden na het verlenen
      van de vergunning,
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel2
  - number: 2.2.b
    text: één of meer overeenkomsten ten behoeve van de inkoop van gas en voor het daarvoor benodigde transport,
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel2
  - number: 2.2.c
    text: |-
      een recente jaarrekening of een openingsbalans, welke is voorzien van een
      verklaring omtrent de getrouwheid, ondertekend door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.2.d
    text: |-
      een recente verklaring van de rechtbank op basis van de registers, bedoeld in de [artikelen 19][ref1] en
      [222a van de Faillissementswet][ref2], waaruit blijkt dat de aanvrager niet in staat van faillissement verkeert en
      dat de aanvrager geen surseance van betaling is verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel222a
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: 222a
  - number: 2.2.e
    text: |-
      een beschrijving van de organisatie van de aanvrager, waarin in ieder geval is opgenomen de voorziene
      administratieve organisatie, met inbegrip van de financiële administratie, en de interne of externe controle
      hierop,
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel2
  - number: 2.2.f
    text: |-
      voorbeelden van alle door de aanvrager gehanteerde offertes en overeenkomsten voor kleinverbruikers met de hierbij
      behorende algemene voorwaarden en
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel2
  - number: 2.2.g
    text: de door de aanvrager gehanteerde klachten- en geschillenregeling voor kleinverbruikers.
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel2
  - number: '3.1'
    text: |-
      De aanvrager kan redelijkerwijs in staat worden geacht de verplichtingen als opgenomen in
      [hoofdstuk 5 van de Gaswet][ref1] na te komen indien hij over zodanige inkoop- en transportcontracten beschikt dat
      hij, gelet op de te verwachten afzet, in staat zal zijn om op een betrouwbare wijze zorg te dragen voor de levering
      van gas aan iedere kleinverbruiker die daarom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011440
        hoofdstuk: '5'
  - number: '3.2'
    text: 'De aanvrager beschikt over de benodigde organisatorische, financiële en technische kwaliteiten indien:'
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.2.a
    text: |-
      de aanvrager financieel in staat is de termijn tussen uitgaven voor inkoop van gas en transportcapaciteit en
      inkomsten van kleinverbruikers te overbruggen,
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.2.b
    text: |-
      de aanvrager over een goede administratieve organisatie, met inbegrip van de financiële administratie, en over een
      goede interne of externe controle hierop beschikt, waarin op ordentelijke wijze per kleinverbruiker waarmee een
      leveringsovereenkomst is gesloten in ieder geval de volgende gegevens zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.2.b.1°
    text: naam, adres, woonplaats en indien beschikbaar, telefoonnummer en e-mailadres van de kleinverbruiker;
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.2.b.2°
    text: |-
      factuuradres en bankrekeningnummer en indien beschikbaar het mandaat voor automatische afschrijving van de
      kleinverbruiker;
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.2.b.3°
    text: hoogte en betalingsfrequentie van het voorschotbedrag;
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.2.b.4°
    text: EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.2.b.5°
    text: naam van de betreffende netbeheerder,
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.2.c
    text: de aanvrager niet in staat van faillissement verkeert en
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.2.d
    text: de aanvrager geen surseance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: '3.3'
    text: 'De aanvrager hanteert redelijke voorwaarden indien hij:'
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.3.a
    text: |-
      duidelijke offertes en overeenkomsten hanteert, waarin de hoogte van de tarieven en de opbouw hiervan is
      aangegeven,
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.3.b
    text: een transparante en redelijke betalingsregeling hanteert,
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.3.c
    text: een transparante en redelijke regeling voor het opzeggen of ontbinden van overeenkomsten hanteert,
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.3.d
    text: in staat is klachten en geschillen op een adequate wijze te behandelen, en
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: 3.3.e
    text: |-
      voorwaarden hanteert die in overeenstemming zijn met hetgeen bij of krachtens de wet is bepaald met betrekking tot
      de intrekking van de vergunning.
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: '3.4'
    text: |-
      De inkoopcontracten, bedoeld in het eerste lid, bevatten geen beding tot ontbinding van rechtswege van die
      overeenkomst ingeval aan de aanvrager surseance van betaling is verleend of deze failliet is verklaard, dan wel
      ingeval diens surseance of faillissement is aangevraagd, dan wel ingeval diens vergunning zal worden ingetrokken,
      noch bedingen, die het de toeleverancier mogelijk maken in die gevallen de nakoming van de verbintenis op te
      schorten of te ontbinden of onder gewijzigde voorwaarden voort te zetten, een en ander voorzover betrekking hebbend
      op de levering van gas ten behoeve van kleinverbruikers.
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
  - number: '3.5'
    text: |-
      De gegevens, bedoeld in het tweede lid, onderdeel b, zijn op ordentelijke wijze in
      de administratie opgenomen indien deze gegevens in het kader van de toepassing van
      [artikel 3, zesde lid, onderdeel b, van het Besluit leveringszekerheid Gaswet][ref1] in een machineleesbaar en
      interoperabel formaat uitwisselbaar zijn met andere vergunninghouders.


      [ref1]: https://wetten.overheid.nl/BWBR0016605#Artikel3
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016605
        artikel: '3'
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop [artikel 45, tweede lid, van de wet][ref1] in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel45
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '45'
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit vergunning levering gas aan kleinverbruikers.'
    url: https://wetten.overheid.nl/BWBR0015154/2018-10-01#Artikel5
