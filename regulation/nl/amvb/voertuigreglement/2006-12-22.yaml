  - number: 5.7.66
    text: |-
      1 De inrichting tot het koppelen van een aanhangwagen moet van een deugdelijke constructie zijn en moet deugdelijk
      aan het motorrijtuig met beperkte snelheid zijn bevestigd.

      2 De voor de overbrenging van de krachten noodzakelijke onderdelen van de in het eerste lid bedoelde inrichting
      mogen niet gescheurd, gebroken dan wel overmatig gesleten zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.66
  - number: 5.7.71
    text: |-
      1 Motorrijtuigen met beperkte snelheid moeten ten minste zijn voorzien van een geluidssignaalinrichting die bestaat
      uit een goed werkende hoorn met vaste toonhoogte. Een samenstel van zodanige, tegelijk werkende hoorns wordt als
      één hoorn beschouwd.

      2 Motorrijtuigen met beperkte snelheid mogen zijn voorzien van een geluidssignaalinrichting die andere
      weggebruikers erop attent maakt dat de achteruitversnelling van het voertuig is ingeschakeld, alsmede van een
      geluidssignaalinrichting die ertoe strekt ongeoorloofd gebruik of diefstal van het voertuig te voorkomen.

      3 Motorrijtuigen met beperkte snelheid mogen niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld
      in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.71
  - number: 5.7.72
    text: |-
      Motorrijtuigen met beperkte snelheid moeten, met uitzondering van walsen, aan de voorzijde zijn voorzien van een
      bevestigingspunt ten behoeve van het slepen van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.72
  - number: 5.8.1
    text: |-
      Landbouw- of bosbouwtrekkers moeten zijn voorzien van een identificatienummer dat op een vast voertuigdeel is
      ingeslagen dan wel op de motor is aangebracht, welk nummer goed leesbaar is.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.1
  - number: 5.8.3
    text: |-
      De langs- en dwarsliggers en chassisversterkingsdelen van het chassisraam, dan wel de daarvoor in de plaats
      tredende delen van de mee- of zelfdragende carrosserie van landbouw- of bosbouwtrekkers mogen:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte van het
      chassisraam of van de mee- of zelfdragende carrosserie in gevaar worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.3
  - number: 5.8.6
    text: |-
      Landbouw- of bosbouwtrekkers mogen:

      a. niet langer zijn dan 12,00 m;

      b. niet breder zijn dan 3,00 m;

      c. niet hoger zijn dan 4,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.6
  - number: 5.8.7
    text: |-
      1 De last onder enige as van landbouw- of bosbouwtrekkers mag niet meer bedragen dan 10 000 kg.

      2 De totale massa of de som van de aslasten van landbouw- of bosbouwtrekkers mag niet meer bedragen dan 14 000 kg.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.7
  - number: 5.8.9
    text: |-
      1 Alle onderdelen van het brandstofsysteem van landbouw- of bosbouwtrekkers moeten veilig zijn en deugdelijk zijn
      bevestigd.

      2 Het brandstofsysteem mag geen lekkage vertonen.

      3 De vulopening van het brandstofreservoir moet zijn afgesloten met een passende tankdop.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.9
  - number: 5.8.11
    text: |-
      1 Landbouw- of bosbouwtrekkers met een verbrandingsmotor moeten zijn voorzien van een uitlaatsysteem dat
      over de gehele lengte gasdicht is, met uitzondering van de afwateringsgaatjes. De verbindingen van deelbare
      uitlaatleidingen moeten zoveel mogelijk gasdicht zijn.

      2 Het uitlaatsysteem moet deugdelijk zijn bevestigd.

      3 Het uitlaatsysteem moet behoorlijk geluiddempend zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.11
  - number: 5.8.12
    text: |-
      1 De accu van landbouw- of bosbouwtrekkers moet deugdelijk zijn bevestigd.

      2 De bedrading van landbouw- of bosbouwtrekkers moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.12
  - number: 5.8.14
    text: |-
      De versnellingsbak van landbouw- of bosbouwtrekkers moet zijn voorzien van een achteruitversnelling die vanaf de
      bestuurderszitplaats kan worden bediend.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.14
  - number: 5.8.16
    text: |-
      1 De onderdelen van de aandrijving van landbouw- of bosbouwtrekkers moeten deugdelijk zijn bevestigd.

      2 Kruiskoppelingen moeten een zichtbaar spelingsvrije overbrenging kunnen bewerkstelligen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.16
  - number: 5.8.18
    text: |-
      1 De assen van landbouw- of bosbouwtrekkers moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen breuken
      of scheuren vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.18
  - number: 5.8.24
    text: |-
      1 De wielen onderscheidenlijk velgen van landbouw- of bosbouwtrekkers mogen geen breuken, scheuren, ondeugdelijk
      laswerk of ernstige vervorming vertonen.

      2 De wielen onderscheidenlijk velgen moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.24
  - number: 5.8.25
    text: |-
      De wielnaven van landbouw- of bosbouwtrekkers moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk
      zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.25
  - number: 5.8.27
    text: |-
      1 Landbouw- of bosbouwtrekkers moeten zijn voorzien van banden of rupsbanden, waarvan het loopvlak niet bestaat uit
      metaal of een materiaal dat voor wat betreft hardheid en vervormbaarheid dezelfde eigenschappen heeft.

      2 De luchtbanden van landbouw- of bosbouwtrekkers mogen geen beschadigingen vertonen waarbij het karkas zichtbaar
      is.

      3 De luchtbanden mogen geen uitstulpingen vertonen.

      4 Het loopvlak van de banden mag geen metalen elementen bevatten die tijdens het rijden daarbuiten kunnen
      uitsteken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.27
  - number: 5.8.29
    text: |-
      1 Landbouw- of bosbouwtrekkers moeten zijn voorzien van een deugdelijke stuurinrichting.

      2 De bestuurde wielen van landbouw- of bosbouwtrekkers moeten goed reageren op de draaiing van het stuurwiel.

      3 De stuurinrichting mag niet zijn voorzien van een elektrische overbrenging of van een uitsluitend pneumatische
      overbrenging.

      4 Bij draaiing van het stuurwiel tot aan de aanslagen mogen geen weerstanden voelbaar zijn en moeten de wielen
      onderscheidenlijk de banden vrij kunnen draaien.

      5 De voor de overbrenging van de stuurbeweging bestemde onderdelen moeten deugdelijk zijn bevestigd met alle
      daarvoor bestemde bevestigings- en borgmiddelen, mogen geen breuken of scheuren vertonen, mogen niet zijn vervormd
      en mogen niet ernstig door corrosie zijn aangetast.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.29
  - number: 5.8.31
    text: |-
      1 Landbouw- of bosbouwtrekkers moeten zijn voorzien van een reminrichting waarvan de onderdelen:

      a. deugdelijk zijn bevestigd met de daarvoor bestemde bevestigings- en borgmiddelen;

      b. niet in ernstige mate door corrosie zijn aangetast;

      c. niet zijn beschadigd, gescheurd of gebroken;

      d. geen inwendige of uitwendige lekkage vertonen.

      2 De rembekrachtiger moet goed functioneren.

      3 Het oppervlak van het rempedaal moet stroef zijn.

      4 Remslangen mogen:

      a. niet in ernstige mate zijn misvormd;

      b. niet langs andere voertuigdelen schuren;

      c. geen zodanige beschadigingen vertonen dat het wapeningsmateriaal zichtbaar is.

      5 De noodzakelijke bewegingsvrijheid van de remonderdelen mag niet worden beperkt.

      6 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.31
  - number: 5.8.38
    text: |-
      1 Landbouw- of bosbouwtrekkers moeten zijn voorzien van een bedrijfsrem die ten minste op de wielen van één as
      werkt; indien op meer dan één as wordt geremd, mag één as ontkoppeld zijn mits bij het in werking stellen van
      de bedrijfsrem deze as automatisch weer wordt gekoppeld en mits bij een storing in het koppelingssysteem dit
      automatisch geschiedt.

      2 Landbouw- of bosbouwtrekkers met een maximum snelheid van niet meer dan 30 km/h moeten zijn voorzien van een
      bedrijfsrem, waarvan de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten
      minste 2,4 m/s2 bedraagt, bij een pedaalkracht van niet meer dan 600 N.

      3 Landbouw- of bosbouwtrekkers met een maximum snelheid van meer dan 30 km/h moeten zijn voorzien van een
      bedrijfsrem, waarvan de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten
      minste 3,1 m/s2 bedraagt, bij een pedaalkracht van niet meer dan 600 N.

      4 Het voertuig mag door het remmen geen zijwaartse beweging maken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.38
  - number: 5.8.39
    text: |-
      Landbouw- of bosbouwtrekkers moeten zijn voorzien van een parkeerrem die het voertuig op een helling van 18,0% in
      beide richtingen in stilstand moet kunnen houden. Hieraan wordt geacht te zijn voldaan indien de remvertraging,
      uitgaande van een aanvangssnelheid van 15 km/h, op een droge of nagenoeg droge en ongeveer horizontaal liggende weg
      ten minste 1,3 m/s2 bedraagt en de rem ook in achterwaartse richting functioneert.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.39
  - number: 5.8.41
    text: |-
      1 Gesloten cabines van landbouw- of bosbouwtrekkers moeten zijn voorzien van ten minste twee deuren dan wel een
      deur en een nooduitgang, welke zijn gelegen in verschillende wanden dan wel in een wand en in het dak.

      2 De nooduitgang moet zodanige minimumafmetingen hebben dat daarin een ellips kan worden beschreven met een korte
      as van 0,44 m en een lange as van 0,64 m.

      3 De deuren van landbouw- of bosbouwtrekkers moeten goed sluiten. De deuren die direct toegang geven tot de
      personenruimte, moeten op normale wijze vanaf de binnenzijde of vanaf de buitenzijde kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.41
  - number: 5.8.42
    text: |-
      De ruiten van landbouw- of bosbouwtrekkers mogen:

      a. geen beschadigingen of verkleuringen vertonen,

      b. niet zijn voorzien van onnodige voorwerpen,

      die het uitzicht van de bestuurder belemmeren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.42
  - number: 5.8.43
    text: |-
      Landbouw- of bosbouwtrekkers met een voorruit moeten zijn voorzien van een goed werkende ruitenwisserinstallatie
      die de bestuurder voldoende uitzicht geeft. De installatie mag niet door handkracht worden aangedreven.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.43
  - number: 5.8.45
    text: |-
      1 Landbouw- of bosbouwtrekkers moeten zijn voorzien van een linkerbuitenspiegel waarmee de bestuurder ten minste
      een vlak weggedeelte van 10 m achter het voertuig, gemeten vanaf de spiegel tot aan de horizon, kan overzien, welk
      gedeelte een breedte heeft van 2,50 m en is gelegen links van het aan de lengte-as van het voertuig evenwijdig
      liggende verticale vlak door het meest links gelegen punt van de totale breedte van het voertuig onderscheidenlijk
      van de daardoor voortbewogen aanhangwagen.

      2 De spiegel moet deugdelijk zijn bevestigd.

      3 Het spiegelglas van de verplichte spiegel mag geen verschijnselen van breuk vertonen en mag niet in ernstige mate
      zijn verweerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.45
  - number: 5.8.46
    text: |-
      De zitplaatsen van landbouw- of bosbouwtrekkers moeten deugdelijk aan het voertuig zijn bevestigd. De
      verstelinrichtingen van de zitplaatsen moeten goed kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.46
  - number: 5.8.48
    text: |-
      1 Landbouw- of bosbouwtrekkers mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk
      letsel voor andere weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen van landbouw- of bosbouwtrekkers, die in
      geval van botsing het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn
      afgeschermd.

      3 Het bepaalde in het eerste lid en tweede lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m
      boven het wegdek bevinden.

      4 Geen deel van de buitenzijde van de landbouw- of bosbouwtrekker mag zodanig zijn bevestigd, beschadigd, versleten
      of door corrosie zijn aangetast, dat gevaar bestaat voor losraken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.48
  - number: 5.8.51
    text: |-
      Landbouw- of bosbouwtrekkers moeten zijn voorzien van:

      a. twee dimlichten en indien het voertuig aan de voorzijde wordt voorzien van werktuigen die de dimlichten
      afschermen, twee extra dimlichten;

      b. twee stadslichten en indien het voertuig aan de voorzijde wordt voorzien van werktuigen die de stadslichten
      afschermen, twee extra stadslichten;

      c. ten minste twee richtingaanwijzers die naar voren stralen en ten minste twee richtingaanwijzers die naar
      achteren stralen, alsmede waarschuwingsknipperlichten;

      d. twee achterlichten;

      e. twee remlichten;

      f. twee of vier niet-driehoekige rode retroreflectoren;

      g. een rode retroreflector in de vorm van een afgeknotte driehoek.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.51
  - number: 5.8.53
    text: |-
      1 De dimlichten en de stadslichten mogen niet anders dan wit stralen.

      2 De richtingaanwijzers en de waarschuwingsknipperlichten mogen niet anders dan ambergeel stralen.

      3 De achterlichten en de remlichten mogen niet anders dan rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.53
  - number: 5.8.54
    text: |-
      1 De dimlichten moeten aan de voorzijde van het voertuig zijn aangebracht op een hoogte van niet minder dan 0,50
      m en niet meer dan 1,20 m boven het wegdek. Indien zulks voor de bruikbaarheid als landbouw- of bosbouwtrekker
      noodzakelijk is, mogen de dimlichten op een hoogte van meer dan 1,20 m doch niet meer dan 1,50 m boven het wegdek
      zijn aangebracht. De extra dimlichten moeten zover mogelijk vooraan het voertuig zijn aangebracht op een hoogte van
      niet minder dan 0,50 m en niet meer dan 3,00 m boven het wegdek.

      2 De stadslichten moeten naar voren stralen en zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,50 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks door de vorm van
      de bovenbouw van het voertuig noodzakelijk is, mogen de stadslichten op een hoogte van meer dan 1,90 m doch niet
      meer dan 2,30 m zijn aangebracht.

      De extra stadslichten moeten zijn samengebouwd met de extra dimlichten.

      3 De richtingaanwijzers en de waarschuwingsknipperlichten moeten zijn aangebracht:

      a. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,50 m;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mag het hoogste punt van het lichtdoorlatende gedeelte van de
      richtingaanwijzers en de waarschuwingsknipperlichten op een hoogte van meer dan 1,90 m doch niet meer dan 2,30 m
      boven het wegdek zijn aangebracht.

      4 De achterlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,50 m, dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,40 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks door de vorm van
      de bovenbouw van het voertuig noodzakelijk is, mogen de achterlichten op een hoogte van meer dan 1,90 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      5 De remlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,50 m, dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,40 m;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks door de vorm van
      de bovenbouw noodzakelijk is, mogen de remlichten op een hoogte van meer dan 1,90 m doch niet meer dan 2,10 m boven
      het wegdek zijn aangebracht.

      6 De niet-driehoekige rode retroreflectoren moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,50 m dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,40 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m indien twee retroreflectoren zijn aangebracht.
      Indien zulks niet mogelijk is zonder gebruikmaking van bevestigingsmiddelen die gemakkelijk kunnen worden
      beschadigd, mogen de retroreflectoren op een hoogte van meer dan 0,90 m doch niet meer dan 1,20 m boven het wegdek
      zijn aangebracht. Indien vier retroreflectoren zijn aangebracht, mogen de extra twee retroreflectoren niet hoger
      dan 2,10 m boven het wegdek zijn aangebracht.

      7 De rode retroreflector in de vorm van een afgeknotte driehoek moet aan de achterzijde van het voertuig zijn
      aangebracht:

      a. in het midden van het voertuig dan wel links van het midden;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek. Indien zulks niet mogelijk
      is zonder gebruikmaking van bevestigingsmiddelen die gemakkelijk kunnen worden beschadigd, mag de retroreflector op
      een hoogte van meer dan 0,90 m doch niet meer dan 1,60 m boven het wegdek zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.54
  - number: 5.8.55
    text: |-
      1 De in [artikel 5.8.51][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig zijn bevestigd.

      5 De in [artikel 5.8.51][ref2] bedoelde lichten en retroreflectoren mogen, voor zover niet anders is bepaald, niet
      zijn afgeschermd.

      6 De retroreflectoren mogen geen gebreken vertonen, die de retroreflectie beïnvloeden.

      7 De elektrische schakeling van de dimlichten en de stadslichten moet zodanig zijn uitgevoerd dat de dimlichten en
      de extra dimlichten dan wel de stadslichten en de extra stadslichten niet tegelijk kunnen zijn ingeschakeld.

      8 De rode retroreflector in de vorm van een afgeknotte driehoek moet zijn voorzien van een door Onze Minister
      bekendgemaakt goedkeuringsmerk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.8.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.8.51
