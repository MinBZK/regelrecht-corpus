  - number: 5.6.66
    text: |-
      1 Indien de bromfiets is voorzien van een inrichting tot het koppelen van een aanhangwagen, moet deze inrichting
      deugdelijk zijn bevestigd en mag deze niet zijn gescheurd, gebroken of vervormd. Onze Minister stelt regels vast
      met betrekking tot de deugdelijkheid van de bevestiging.

      2 Bij een inrichting als bedoeld in het eerste lid, die is voorzien van een koppelingskogel met een nominale
      diameter van 50 mm:

      a. moet de diameter van de kogel ten minste 49 mm bedragen;

      b. moet de sluit- en borginrichting van een afneembare kogel goed werken en moet de bevestiging van het
      kogelgedeelte nagenoeg spelingvrij zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.66
  - number: 5.6.71
    text: |-
      1 Bromfietsen moeten zijn voorzien van een goed werkende bel of van een goed werkende hoorn met vaste toonhoogte.

      2 Bromfietsen mogen zijn voorzien van een geluidssignaalinrichting die er toe strekt ongeoorloofd gebruik of
      diefstal van de bromfiets of de zijspanwagen te voorkomen.

      3 Bromfietsen mogen niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld in het eerste en tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.71
  - number: 5.7.1
    text: |-
      Motorrijtuigen met beperkte snelheid moeten zijn voorzien van een identificatienummer dat op een vast voertuigdeel
      is ingeslagen dan wel op de motor is aangebracht, welk nummer goed leesbaar is.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.1
  - number: 5.7.3
    text: |-
      De langs- en dwarsliggers en chassisversterkingsdelen van het chassisraam, dan wel de daarvoor in de plaats
      tredende delen van de mee- of zelfdragende carrosserie van motorrijtuigen met beperkte snelheid mogen:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte van het
      chassisraam of van de mee- of zelfdragende carrosserie in gevaar worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.3
  - number: 5.7.4
    text: |-
      1 De bovenbouw van motorrijtuigen met beperkte snelheid moet deugdelijk op het onderstel zijn bevestigd.

      2 De ondersteuning van de laadvloer onderscheidenlijk laadruimte moet deugdelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.4
  - number: 5.7.6
    text: |-
      1 Motorrijtuigen met beperkte snelheid mogen:

      a. niet langer zijn dan 12,00 m;

      b. niet breder zijn dan 2,60 m;

      c. niet hoger zijn dan 4,00 m.

      2 In afwijking van het bepaalde in het eerste lid, onderdeel *b*, mogen rijdende werktuigen breder zijn dan 2,60 m,
      doch niet breder dan voor de bruikbaarheid als werktuig noodzakelijk is en niet breder dan 3,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.6
  - number: 5.7.7
    text: |-
      1 De last onder enig wiel van motorrijtuigen met beperkte snelheid mag niet meer bedragen dan 5000 kg.

      2 In afwijking van het bepaalde in het eerste lid mag de last onder enig wiel van een rijdend werktuig niet meer
      bedragen dan 6000 kg.

      3 De totale massa of de som van de aslasten van motorrijtuigen met beperkte snelheid mag niet meer bedragen dan 50
      000 kg.

      4 In afwijking van het bepaalde in het derde lid mag de totale massa van motorrijtuigen met beperkte snelheid die
      zijn voorzien van rupsbanden, niet meer bedragen dan 10 000 kg.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.7
  - number: 5.7.9
    text: |-
      1 Alle onderdelen van het brandstofsysteem van motorrijtuigen met beperkte snelheid moeten veilig zijn en
      deugdelijk zijn bevestigd.

      2 Het brandstofsysteem mag geen lekkage vertonen.

      3 De vulopening van het brandstofreservoir moet zijn afgesloten met een passende tankdop.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.9
  - number: 5.7.11
    text: |-
      1 Motorrijtuigen met beperkte snelheid moeten zijn voorzien van een uitlaatsysteem dat over de gehele lengte
      gasdicht is, met uitzondering van de afwateringsgaatjes. De verbindingen van deelbare uitlaatleidingen moeten
      zoveel mogelijk gasdicht zijn.

      2 Het uitlaatsysteem moet deugdelijk zijn bevestigd.

      3 Het uitlaatsysteem moet behoorlijk geluiddempend zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.11
  - number: 5.7.12
    text: |-
      1 De accu van motorrijtuigen met beperkte snelheid moet deugdelijk zijn bevestigd.

      2 De bedrading van motorrijtuigen met beperkte snelheid moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.12
  - number: 5.7.13
    text: |-
      1 De motorsteunen van motorrijtuigen met beperkte snelheid moeten deugdelijk aan het chassis dan wel aan de
      carrosserie alsmede aan de motor zijn bevestigd.

      2 De motorsteunen mogen niet in ernstige mate zijn beschadigd, de rubbers mogen niet zijn doorgescheurd en de
      vulcanisatie mag niet geheel zijn losgeraakt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.13
  - number: 5.7.14
    text: |-
      Motorrijtuigen met beperkte snelheid met een ledige massa van meer dan 400 kg moeten zijn voorzien van een
      inrichting om achteruit te rijden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.14
  - number: 5.7.16
    text: De onderdelen van de aandrijving van motorrijtuigen met beperkte snelheid moeten deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.16
  - number: 5.7.18
    text: |-
      1 De assen van motorrijtuigen met beperkte snelheid moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen
      breuken of scheuren vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn bevestigd, beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.18
  - number: 5.7.24
    text: |-
      1 De wielen onderscheidenlijk velgen van motorrijtuigen met beperkte snelheid mogen geen breuken, scheuren,
      ondeugdelijk laswerk of ernstige vervorming vertonen.

      2 De wielen onderscheidenlijk velgen moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.24
  - number: 5.7.25
    text: |-
      De wielnaven van motorrijtuigen met beperkte snelheid moeten met alle daarvoor bestemde bevestigingsmiddelen
      deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.25
  - number: 5.7.27
    text: |-
      1 Motorrijtuigen met beperkte snelheid moeten zijn voorzien van banden of rupsbanden, waarvan het loopvlak niet
      bestaat uit metaal of een materiaal dat voor wat betreft hardheid en vervormbaarheid dezelfde eigenschappen heeft.

      2 Het bepaalde in het eerste lid inzake het loopvlak is niet van toepassing op walsen en rijdende werktuigen.

      3 De luchtbanden van motorrijtuigen met beperkte snelheid mogen geen beschadigingen vertonen waarbij het karkas
      zichtbaar is.

      4 De luchtbanden mogen geen uitstulpingen vertonen.

      5 Het loopvlak van de banden mag geen metalen elementen bevatten die tijdens het rijden daarbuiten kunnen
      uitsteken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.27
  - number: 5.7.28
    text: |-
      1 Indien het motorrijtuig met beperkte snelheid is voorzien van een veersysteem, moet dit goed werken.

      2 De onderdelen van het veersysteem mogen geen breuken of scheuren vertonen en moeten deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.28
  - number: 5.7.29
    text: |-
      1 Motorrijtuigen met beperkte snelheid moeten zijn voorzien van een deugdelijke stuurinrichting.

      2 De bestuurde wielen van motorrijtuigen met beperkte snelheid moeten goed reageren op de draaiing van het
      stuurwiel.

      3 De stuurinrichting mag niet zijn voorzien van een elektrische overbrenging dan wel een uitsluitend pneumatische
      overbrenging.

      4 De voor de overbrenging van de stuurbeweging bestemde onderdelen moeten deugdelijk zijn bevestigd met alle
      daarvoor bestemde bevestigings- en borgmiddelen, mogen geen breuken of scheuren vertonen, mogen niet zijn vervormd
      en mogen niet ernstig door corrosie zijn aangetast.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.29
  - number: 5.7.31
    text: |-
      1 Motorrijtuigen met beperkte snelheid moeten zijn voorzien van een reminrichting waarvan de onderdelen:

      a. deugdelijk zijn bevestigd met de daarvoor bestemde bevestigings- en borgmiddelen;

      b. niet in ernstige mate door corrosie zijn aangetast;

      c. niet zijn beschadigd, gescheurd of gebroken;

      d. geen inwendige of uitwendige lekkage vertonen.

      2 De rembekrachtiger moet goed functioneren.

      3 Het oppervlak van het rempedaal moet stroef zijn.

      4 Remslangen mogen:

      a. niet in ernstige mate zijn misvormd;

      b. niet langs andere voertuigdelen schuren;

      c. geen zodanige beschadigingen vertonen dat het wapeningsmateriaal zichtbaar is.

      5 De noodzakelijke bewegingsvrijheid van de remonderdelen mag niet worden beperkt.

      6 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.31
  - number: 5.7.38
    text: |-
      1 Motorrijtuigen met beperkte snelheid moeten zijn voorzien van een bedrijfsrem:

      a. die ten minste op de wielen van één as werkt;

      b. waarvan de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 2,4 m/
      s2 bedraagt.

      2 Het voertuig mag door het remmen geen zijwaartse beweging maken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.38
  - number: 5.7.39
    text: |-
      Motorrijtuigen met beperkte snelheid moeten zijn voorzien van een parkeerrem die het voertuig op een helling
      van 16,0% in beide richtingen in stilstand moet kunnen houden. Hieraan wordt geacht te zijn voldaan indien
      de remvertraging, uitgaande van een aanvangssnelheid van 15 km/h, op een droge of nagenoeg droge en ongeveer
      horizontaal liggende weg ten minste 1,2 m/s2 bedraagt en de rem ook in achterwaartse richting functioneert.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.39
  - number: 5.7.41
    text: |-
      1 Gesloten cabines van motorrijtuigen met beperkte snelheid moeten zijn voorzien van ten minste twee deuren dan wel
      een deur en een nooduitgang, welke zijn gelegen in verschillende wanden dan wel in een wand en in het dak.

      2 De nooduitgang moet zodanige minimum afmetingen hebben dat daarin een ellips kan worden beschreven met een korte
      as van 0,44 m en een lange as van 0,64 m.

      3 De deuren van motorrijtuigen met beperkte snelheid moeten goed sluiten. De deuren die direkt toegang geven tot de
      personenruimte, moeten op normale wijze vanaf de binnenzijde of vanaf de buitenzijde kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.41
  - number: 5.7.42
    text: |-
      De ruiten van motorrijtuigen met beperkte snelheid mogen:

      a. geen beschadigingen of verkleuringen vertonen,

      b. niet zijn voorzien van onnodige voorwerpen,

      die het uitzicht van de bestuurder belemmeren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.42
  - number: 5.7.43
    text: |-
      Motorrijtuigen met beperkte snelheid met een voorruit moeten zijn voorzien van een goed werkende
      ruitenwisserinstallatie die de bestuurder voldoende uitzicht geeft. De installatie mag niet door handkracht worden
      aangedreven.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.43
  - number: 5.7.45
    text: |-
      1 Motorrijtuigen met beperkte snelheid moeten zijn voorzien van een linkerbuitenspiegel waarmee de bestuurder
      ten minste een vlak weggedeelte van 10 m achter het voertuig, gemeten vanaf de spiegel tot aan de horizon, kan
      overzien, welk gedeelte een breedte heeft van 2,50 m en is gelegen links van het aan de lengte-as van het voertuig
      evenwijdig liggende verticale vlak door het meest links gelegen punt van de totale breedte van het voertuig of van
      de daardoor voortbewogen aanhangwagen.

      2 Motorrijtuigen met beperkte snelheid met een gesloten carrosserie moeten zijn voorzien van een
      rechterbuitenspiegel waarmee de bestuurder ten minste een vlak weggedeelte van 30 m achter het voertuig, gemeten
      vanaf de spiegel tot aan de horizon, kan overzien, welk gedeelte een breedte heeft van 3,50 m en is gelegen rechts
      van het aan de lengte-as van het voertuig evenwijdig liggende verticale vlak door het meest rechts gelegen punt van
      de totale breedte van het voertuig of van de daardoor voortbewogen aanhangwagen.

      3 Motorrijtuigen met beperkte snelheid met een lengte van meer dan 6 m die zijn voorzien van een gesloten
      carrosserie en die zijn ingericht voor het vervoer van goederen, moeten zijn voorzien van een trottoirspiegel
      waarmee de bestuurder het wegdek naast de cabine aan de rechterzijde kan overzien.

      4 De trottoirspiegel moet zodanig zijn aangebracht dat geen enkel punt van de spiegel of van de steun waarop deze
      is gemonteerd, zich op een hoogte van minder dan 2,00 m boven het wegdek bevindt. Indien de hoogte van de cabine
      zodanig is dat niet aan dit voorschrift kan worden voldaan, mag het voertuig niet van een trottoirspiegel zijn
      voorzien.

      5 De spiegels moeten deugdelijk zijn bevestigd.

      6 Het spiegelglas van de verplichte spiegels mag geen verschijnselen van breuk vertonen en mag niet in ernstige
      mate zijn verweerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.45
  - number: 5.7.46
    text: |-
      De zitplaatsen van motorrijtuigen met beperkte snelheid moeten deugdelijk aan het voertuig zijn bevestigd. De
      verstelinrichtingen van de zitplaatsen moeten goed kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.46
  - number: 5.7.48
    text: |-
      1 Motorrijtuigen met beperkte snelheid mogen geen scherpe delen hebben die in geval van botsing gevaar voor
      lichamelijk letsel voor andere weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen van motorrijtuigen met beperkte snelheid,
      die in geval van botsing het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten,
      zijn afgeschermd.

      3 Het bepaalde in het eerste lid en tweede lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m
      boven het wegdek bevinden.

      4 Geen deel van de buitenzijde van het motorrijtuig met beperkte snelheid mag zodanig zijn bevestigd, beschadigd,
      versleten of door corrosie zijn aangetast, dat gevaar bestaat voor losraken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.48
  - number: 5.7.51
    text: |-
      1 Motorrijtuigen met beperkte snelheid moeten zijn voorzien van:

      a. twee dimlichten en indien het voertuig aan de voorzijde wordt voorzien van werktuigen die de dimlichten
      afschermen, twee extra dimlichten;

      b. twee stadslichten en indien het voertuig aan de voorzijde wordt voorzien van werktuigen die de stadslichten
      afschermen, twee extra stadslichten;

      c. twee richtingaanwijzers aan de voorzijde en twee richtingaanwijzers aan de achterzijde van het voertuig, alsmede
      waarschuwingsknipperlichten;

      d. een zijrichtingaanwijzer aan elke zijkant van het voertuig, indien het voertuig langer is dan 6,00 m;

      e. twee achterlichten;

      f. twee remlichten;

      g. twee of vier niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig;

      h. ambergele retroreflectoren aan elke zijkant van het voertuig indien het voertuig langer is dan 6,00 m;

      i. een rode retroreflector in de vorm van een afgeknotte driehoek.

      2 Het bepaalde in het eerste lid, onderdeel f, is niet van toepassing op motorrijtuigen met beperkte snelheid die
      hydrostatisch worden aangedreven en waarbij de hydrostatische aandrijving tevens dienst doet als reminrichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.51
  - number: 5.7.53
    text: |-
      1 De dimlichten en de stadslichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers en de waarschuwingsknipperlichten mogen niet anders dan ambergeel stralen.

      3 De achterlichten mogen niet anders dan rood stralen.

      4 De remlichten mogen niet anders dan rood of ambergeel stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.53
  - number: 5.7.54
    text: |-
      1 De dimlichten moeten aan de voorzijde van het voertuig zijn aangebracht op een hoogte van niet minder dan 0,50 m
      en niet meer dan 1,20 m boven het wegdek. Indien zulks voor de bruikbaarheid als werktuig noodzakelijk is, mogen de
      dimlichten op een hoogte van meer dan 1,20 m doch niet meer dan 1,50 m boven het wegdek zijn aangebracht. De extra
      dimlichten moeten zover mogelijk vooraan het voertuig zijn aangebracht op een hoogte van niet minder dan 0,50 m en
      niet meer dan 2,80 m boven het wegdek.

      2 De stadslichten moeten aan de voorzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,50 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks door de vorm van
      de bovenbouw van het voertuig noodzakelijk is, mogen de stadslichten op een hoogte van meer dan 1,90 m doch niet
      meer dan 2,10 m zijn aangebracht.

      De extra stadslichten moeten zijn samengebouwd met de extra dimlichten.

      3 De richtingaanwijzers en de waarschuwingsknipperlichten moeten zijn aangebracht:

      a. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,50 m;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mag het hoogste punt van het lichtdoorlatende gedeelte van de
      richtingaanwijzers en de waarschuwingsknipperlichten op een hoogte van meer dan 1,90 m doch niet meer dan 2,30 m
      boven het wegdek zijn aangebracht.

      De zijrichtingaanwijzers moeten zijn aangebracht op een afstand van niet meer dan 1,80 m vanaf de voorzijde van
      het voertuig.

      4 De achterlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,50 m, dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,40 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks door de vorm van
      de bovenbouw van het voertuig noodzakelijk is, mogen de achterlichten op een hoogte van meer dan 1,90 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      5 De remlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,50 m, dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,40 m;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks door de vorm van
      de bovenbouw noodzakelijk is, mogen de remlichten op een hoogte van meer dan 1,90 m doch niet meer dan 2,10 m boven
      het wegdek zijn aangebracht.

      6 De niet-driehoekige rode retroreflectoren moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,50 m, dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,40 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m indien twee retroreflectoren zijn aangebracht.
      Indien zulks niet mogelijk is zonder gebruikmaking van bevestigingsmiddelen die gemakkelijk kunnen worden
      beschadigd, mogen de retroreflectoren op een hoogte van meer dan 0,90 m doch niet meer dan 1,20 m boven het wegdek
      zijn aangebracht. Indien vier retroreflectoren zijn aangebracht mogen de extra twee retroreflectoren niet hoger dan
      2,10 m boven het wegdek zijn aangebracht.

      7 De retroreflectoren aan de zijkanten moeten zijn aangebracht:

      a. in de lengterichting van het voertuig waarbij ten minste één retroreflector zich in het middelste derde gedeelte
      van het voertuig bevindt, en de meest naar voren geplaatste retroreflector zich niet meer dan 3,00 m van de
      voorkant van het voertuig bevindt, en de meest achterwaarts geplaatste retroreflector zich niet meer dan 1,00 m van
      de achterkant van het voertuig bevindt;

      b. op een onderlinge afstand van niet meer dan 3,00 m tussen twee opeenvolgende retroreflectoren;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek. Indien zulks door de vorm van
      de bovenbouw noodzakelijk is, mogen de retroreflectoren op een hoogte van meer dan 0,90 m doch niet meer dan 1,50 m
      boven het wegdek zijn aangebracht.

      8 De rode retroreflector in de vorm van een afgeknotte driehoek moet aan de achterzijde van het voertuig zijn
      aangebracht:

      a. in het midden van het voertuig dan wel links van het midden;

      b. op een hoogte van niet minder van 0,35 m en niet meer dan 0,90 m boven het wegdek. Indien zulks niet mogelijk
      is zonder gebruikmaking van bevestigingsmiddelen die gemakkelijk kunnen worden beschadigd, mag de retroreflector op
      een hoogte van meer dan 0,90 m doch niet meer dan 1,60 m boven het wegdek zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.54
  - number: 5.7.55
    text: |-
      1 De in [artikel 5.7.51][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig zijn bevestigd.

      5 De in [artikel 5.7.51][ref2] bedoelde lichten en retroreflectoren mogen, voorzover het het lichtdoorlatend
      gedeelte betreft, ten hoogste een vierde deel zijn afgeschermd.

      6 De retroreflectoren mogen geen gebreken vertonen, die de retroreflectie beïnvloeden.

      7 De elektrische schakeling van de dimlichten en de stadslichten moet zodanig zijn uitgevoerd dat de dimlichten en
      de extra dimlichten dan wel de stadslichten en de extra stadslichten niet tegelijk kunnen zijn ingeschakeld.

      8 De rode retroreflector in de vorm van een afgeknotte driehoek moet zijn voorzien van een door Onze Minister
      bekendgemaakt goedkeuringsmerk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.7.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.7.51
