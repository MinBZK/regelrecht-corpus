  - number: 3.5.45
    text: |-
      1 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn.

      2 De in [artikel 3.5.41][ref1] bedoelde lichten en retroreflectoren mogen niet zijn afgeschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.5.41
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.45
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 3.5.41
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '5'
  - number: 3.5.46
    text: |-
      1 Driewielige motorrijtuigen die in gebruik worden genomen na 31 oktober 1995, mogen zijn voorzien van:

      a. één of twee mistlichten aan de voorzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 97/24/
      EG](31997L0024);

      b. één of twee mistlichten aan de achterzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 97/24/
      EG](31997L0024);

      c. één of twee achteruitrijlichten die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn
      77/539/EEG](31977L0539);

      d. een niet-driehoekige ambergele retroflector aan de zijkant van het voertuig die voldoet aan het bepaalde in
      [richtlijn 97/24/EG](31997L0024).

      2 Driewielige motorrijtuigen die in gebruik worden genomen na 31 december 1994 doch voor 1 november 1995, mogen
      zijn voorzien van:

      a. twee mistlichten aan de voorzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 97/24/EG]
      (31997L0024);

      b. een of twee mistlichten aan de achterzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 97/24/
      EG](31997L0024);

      c. parkeerlichten, indien het voertuig niet langer is dan 6,00 m en niet breder is dan 2,00 m;

      d. een of twee achteruitrijlichten die voldoen aan het bepaalde in [richtlijn 77/539/EEG](31977L0539);

      e. een zijrichtingaanwijzer aan elke zijkant van het voertuig;

      f. herhalingswaarschuwingsknipperlichten aan het meest naar achteren gelegen deel van de zich aan de zij- of
      achterkant van het voertuig bevindende laad- en losklep in horizontale stand, die voldoen aan het bepaalde in
      [richtlijn 76/759/EEG](31976L0759), met uitzondering van de eisen ten aanzien van de minimum hoogte boven het
      wegdek;

      g. ambergele retroreflectoren aan de zijkanten van het voertuig, die voldoen aan het bepaalde in [richtlijn 97/24/
      EG](31997L0024);

      h. witte retroreflectoren aan de voorzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 97/24/
      EG](31997L0024);

      i. een richtlicht;

      j. een bermlicht aan de voorzijde van het voertuig;

      k. werklichten.

      3 Driewielige motorrijtuigen als bedoeld in het tweede lid, mogen zijn voorzien van extra witte retroreflecterende
      voorzieningen aan de voorzijde, extra rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig,
      mits deze geen nadelige invloed hebben op de effectiviteit van de verplichte lichten en retroreflecterende
      voorzieningen.

      4 Driewielige motorrijtuigen die in gebruik worden genomen na 31 december 1994, mogen zijn voorzien van een derde
      remlicht dat voldoet aan het bepaalde in [richtlijn 76/756/EEG](31976L0756).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.46
  - number: 3.5.48
    text: |-
      1 Indien één parkeerlicht is aangebracht, mag dit naar voren niet anders dan wit en naar achteren niet anders dan
      rood stralen. Indien twee parkeerlichten zijn aangebracht, moet het voorste wit en het achterste rood stralen.

      2 De zijrichtingaanwijzers mogen niet anders dan ambergeel stralen.

      3 Het richtlicht en het bermlicht mogen naar voren niet anders dan wit of geel stralen.

      4 Het derde remlicht mag niet anders dan rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.48
  - number: 3.5.49
    text: |-
      1 De mistlichten aan de voorzijde en de parkeerlichten moeten niet lager dan 0,25 m, niet hoger dan 1,20 m boven
      het wegdek en niet verder dan 0,40 m van de zijkanten van het voertuig zijn aangebracht.

      2 De mistlichten aan de achterzijde moeten op een afstand van ten minste 0,10 m van het remlicht en niet hoger dan
      1,00 m boven het wegdek zijn aangebracht. De mistlichten aan de achterzijde moeten symmetrisch ten opzichte van het
      midden van het voertuig zijn aangebracht. Indien één licht is aangebracht, moet dit links van het midden van het
      voertuig zijn geplaatst.

      3 De witte retroreflectoren moeten zijn aangebracht op een afstand van niet meer dan 0.40 m vanaf het punt van de
      grootste breedte van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.49
  - number: 3.5.50
    text: |-
      Driewielige motorrijtuigen mogen, met uitzondering van grote lichten, niet zijn voorzien van verblindende
      verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.50
  - number: 3.5.51
    text: |-
      Driewielige motorrijtuigen mogen niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 3.5.41][ref1] en [3.5.46][ref2] dan wel krachtens [artikel 3.5.40, vierde lid][ref3], is voorgeschreven
      of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.5.41
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel3.5.46
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel3.5.40
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.51
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 3.5.41
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 3.5.46
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0006746
        artikel: 3.5.40
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '5'
  - number: 3.5.52
    text: |-
      1 De mechanische koppelinrichting, indien aanwezig, van een driewielig motorrijtuig dat in gebruik is genomen na
      16 juni 1999 en de bevestiging daarvan aan het voertuig moeten voldoen aan het bepaalde in [richtlijn 97/24/EG]
      (31997L0024).

      2 Indien een driewielig motorrijtuig dat in gebruik is genomen voor 17 juni 1999 is voorzien van een mechanische
      koppelinrichting voor het koppelen van een aanhangwagen, moet deze inrichting voldoen aan het bepaalde in
      [richtlijn 97/24/EG](31997L0024) of aan de door Onze Minister gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.52
  - number: 3.5.54
    text: |-
      1 Driewielige motorrijtuigen die in gebruik worden genomen na 31 mei 1995, moeten zijn voorzien van een
      geluidssignaalinrichting die voldoet aan het bepaalde in [richtlijn 93/30/EEG](31993L0030).

      2 Driewielige motorrijtuigen die in gebruik zijn genomen voor 1 juni 1995, moeten zijn voorzien van ten minste
      een hoorn met vaste toonhoogte dan wel een samenstel van zodanige, tegelijk werkende hoorns. De geluidssterkte mag
      voor voertuigen die in gebruik zijn genomen voor 1 oktober 1971 niet minder bedragen dan 70 decibel en niet meer
      dan 104 decibel, en voor voertuigen die in gebruik zijn genomen na 30 september 1971 niet minder dan 93 decibel en
      niet meer dan 104 decibel, te meten op de door Onze Minister vastgestelde wijze. De maximum geluidssterkte van 104
      decibel geldt niet voor hoorns die voldoen aan het bepaalde in [richtlijn 70/388/EEG](31970L0388).

      3 Driewielige motorrijtuigen mogen zijn voorzien van een geluidssignaalinrichting die andere weggebruikers erop
      attent maakt dat de achteruitversnelling van het voertuig is ingeschakeld, alsmede van een geluidssignaalinrichting
      die ertoe strekt ongeoorloofd gebruik of diefstal van het voertuig te voorkomen.

      4 Driewielige motorrijtuigen mogen niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld in het
      eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.54
  - number: 3.5.55
    text: |-
      Driewielige motorrijtuigen die in gebruik worden genomen na 31 mei 1995, moeten zijn voorzien van een inrichting
      ter bescherming tegen ongeoorloofd gebruik van het voertuig, welke inrichting voldoet aan het bepaalde in
      [richtlijn 93/33/EEG](31993L0033).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.55
  - number: 3.6.1
    text: |-
      1 Bromfietsen moeten tot 9 november 2003 voor het verkrijgen van een typegoedkeuring als bedoeld in artikel 4,
      eerste lid, aanhef en onderdeel a, van [richtlijn 92/61/EEG](31992L0061) of [richtlijn 2002/24/EG](32002L0024) voor
      toelating tot het verkeer op de weg voldoen aan de in deze afdeling vermelde eisen.

      2 Bromfietsen moeten met ingang van 9 november 2003 voor het verkrijgen van een typegoedkeuring als bedoeld in
      artikel 4, eerste lid, aanhef en onderdeel a, van [richtlijn 2002/24/EG](32002L0024) voor toelating tot het verkeer
      op de weg voldoen aan de in deze afdeling vermelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.1
  - number: 3.6.2
    text: Bromfietsen moeten van deugdelijke bouw en inrichting zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.2
  - number: 3.6.3
    text: |-
      Bromfietsen moeten zijn voorzien van een constructieplaat en een identificatienummer, die voldoen aan het bepaalde
      in [richtlijn 93/34/EEG](31993L0034).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.3
  - number: 3.6.5
    text: |-
      Bromfietsen op twee wielen moeten ter zake van maatregelen tegen het onbevoegd opvoeren voldoen aan het bepaalde in
      [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.5
  - number: 3.6.6
    text: |-
      Bromfietsen moeten voor wat betreft afmetingen en massa's voldoen aan het bepaalde in [richtlijn 93/93/EEG]
      (31993L0093).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.6
  - number: 3.6.12
    text: |-
      Bromfietsen die zijn voorzien van een brandstofreservoir, niet zijnde een reservoir voor al dan niet tot vloeistof
      verdicht gas, moeten voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.12
  - number: 3.6.14
    text: |-
      Bromfietsen moeten ter zake van elektromagnetische compatibiliteit voldoen aan het bepaalde in [richtlijn 97/24/
      EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.14
  - number: 3.6.15
    text: |-
      Bromfietsen moeten voor wat betreft geluidproductie voldoen aan het bepaalde in het
      [Besluit geluidproduktie bromfietsen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003834
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.15
    references:
      - id: ref1
        bwb_id: BWBR0003834
  - number: 3.6.16
    text: |-
      Bromfietsen met een verbrandingsmotor moeten voor wat betreft luchtverontreiniging voldoen aan het bepaalde in het
      [Besluit typegoedkeuring bromfietsen luchtverontreiniging][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003722
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.16
    references:
      - id: ref1
        bwb_id: BWBR0003722
  - number: 3.6.17
    text: |-
      Bromfietsen moeten zijn voorzien van een snelheidsmeter die voldoet aan het bepaalde in [richtlijn 2000/7/EG]
      (32000L0007).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.17
  - number: 3.6.18
    text: |-
      Bromfietsen moeten voor wat betreft de wijze van meten van de door de constructie bepaalde maximum snelheid, het
      maximum koppel en het netto-maximum vermogen voldoen aan het bepaalde in [richtlijn 95/1/EG](31995L0001).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.18
  - number: 3.6.23
    text: |-
      Bromfietsen moeten zijn voorzien van luchtbanden die voldoen aan en zijn gemonteerd overeenkomstig het bepaalde in
      [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.23
  - number: 3.6.26
    text: |-
      Bromfietsen moeten zijn voorzien van een reminrichting die voldoet aan het bepaalde in [richtlijn 93/14/EEG]
      (31993L0014).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.26
  - number: 3.6.29
    text: |-
      Bromfietsen op drie of vier wielen met een carrosserie moeten zijn voorzien van ruiten die voldoen aan en zijn
      gemonteerd overeenkomstig het bepaalde in [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.29
  - number: 3.6.30
    text: |-
      Bromfietsen op drie of vier wielen met een voorruit moeten zijn voorzien van een ruitenwisserinstallatie en van een
      ruitensproeierinstallatie, die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.30
  - number: 3.6.31
    text: |-
      Bromfietsen op drie of vier wielen met een voorruit en met een gesloten carrosserie moeten zijn voorzien van een
      goed werkende installatie ter ontdooiing en ontwaseming van de voorruit, die voldoet aan het bepaalde in [richtlijn
      97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.31
  - number: 3.6.32
    text: |-
      Bromfietsen moeten wat betreft spiegels en de montage daarvan voldoen aan het bepaalde in [richtlijn 97/24/EG]
      (31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.32
  - number: 3.6.33
    text: |-
      Bromfietsen moeten voor wat betreft de identificatie van bedieningsorganen, verklikkerlichten en meters voldoen aan
      het bepaalde in [richtlijn 93/29/EEG](31993L0029).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.33
  - number: 3.6.36
    text: |-
      1 Bromfietsen op drie of vier wielen met een carrosserie moeten wat betreft bevestigingspunten voor autogordels
      voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).

      2 Bromfietsen op drie of vier wielen met een carrosserie moeten wat betreft autogordels voldoen aan het bepaalde in
      [richtlijn 97/24/EG](31997L0024).

      3 Bromfietsen op twee wielen moeten, indien een passagier kan worden vervoerd, zijn voorzien van een riem dan
      wel een of meer handgrepen voor deze passagier, welke moeten voldoen aan het bepaalde in [richtlijn 93/32/EEG]
      (31993L0032).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.36
  - number: 3.6.37
    text: |-
      Bromfietsen op twee wielen zonder carrosserie en bromfietsen op drie of vier wielen moeten voor wat betreft de naar
      buiten uitstekende delen voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.37
  - number: 3.6.39
    text: |-
      Bromfietsen moeten voor wat betreft de plaats voor de montage van de achterste kentekenplaat voldoen aan het
      bepaalde in [richtlijn 93/94/EEG](31993L0094).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.39
  - number: 3.6.40
    text: |-
      Bromfietsen moeten zijn voorzien van een installatie van verlichtings- en lichtsignaalinrichtingen die voldoet aan
      het bepaalde in [richtlijn 93/92/EEG](31993L0092).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.40
  - number: 3.6.41
    text: |-
      Bromfietsen moeten dan wel mogen zijn voorzien van grote lichten, dimlichten, stadslichten, richtingaanwijzers,
      achterlichten, remlichten en niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig
      overeenkomstig het bepaalde in [richtlijnen 93/92/EEG](31993L0092) en [97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.41
  - number: 3.6.52
    text: |-
      De mechanische koppelinrichting, indien aanwezig, van een bromfiets en de bevestiging daarvan aan het voertuig
      moeten voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.52
  - number: 3.6.54
    text: |-
      Bromfietsen moeten zijn voorzien van een geluidssignaalinrichting die voldoet aan het bepaalde in [richtlijn 93/30/
      EEG](31993L0030), dan wel van een goed werkende bel indien het een bromfiets betreft met een motorvermogen van niet
      meer dan 0,5 kW en met een door de constructie bepaalde maximum snelheid van niet meer dan 25 km/h.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.54
  - number: 3.6.55
    text: |-
      Indien een bromfiets is voorzien van een inrichting ter bescherming tegen ongeoorloofd gebruik van het voertuig,
      welke inrichting werkt op de stuurinrichting of op de overbrenging, moet deze inrichting voldoen aan het bepaalde
      in [richtlijn 93/33/EEG](31993L0033).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.55
  - number: 3.6.57
    text: |-
      Bromfietsen op twee wielen moeten zijn voorzien van een standaard die voldoet aan het bepaalde in [richtlijn 93/31/
      EEG](31993L0031).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.6.57
  - number: 3.7.1
    text: |-
      Aanhangwagens met een toegestane maximum massa van meer dan 750 kg moeten voor toelating tot het verkeer op de weg
      voldoen aan de in deze afdeling vermelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.1
  - number: 3.7.2
    text: |-
      Aanhangwagens moeten:

      a. van deugdelijke bouw en inrichting zijn;

      b. voldoen aan de in [hoofdstuk 5, afdeling 12][ref1], bedoelde permanente eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.2
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '5'
        afdeling: '12'
  - number: 3.7.3
    text: |-
      1 Aanhangwagens die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een constructieplaat en
      een identificatienummer, die voldoen aan het bepaalde in [richtlijn 76/114/EEG](31976L0114).

      2 Aanhangwagens die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van een identificatienummer
      dat:

      a. voor elke aanhangwagen van hetzelfde merk verschillend is;

      b. uit ten minste 3 letters of cijfers bestaat, welke minimaal 7 mm hoog zijn;

      c. goed leesbaar op een vast voertuigdeel is ingeslagen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.3
  - number: 3.7.4
    text: |-
      Op elk onderdeel dat tot een goedgekeurd type behoort, moeten de in de typegoedkeuring daarvan genoemde kenmerken
      gemakkelijk zichtbaar en duidelijk leesbaar aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.4
  - number: 3.7.5
    text: |-
      Onze Minister kan voor middenasaanhangwagens met een toegestane maximum massa van meer dan 3500 kg regels
      vaststellen voor wat betreft het asstel, de soort koppeling, de dynamische verticale last onder de koppeling en de
      afstand van het hart van de koppeling tot het hart van het asstel.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.5
  - number: 3.7.6
    text: |-
      1 Aanhangwagens die in gebruik worden genomen na 31 mei 2002 moeten voor wat betreft afmetingen en wendbaarheid
      voldoen aan het bepaalde in [richtlijn 97/27/EG](31997L0027).

      2 Aanhangwagens die in gebruik worden genomen na 21 juli 1999 doch voor 1 juni 2002 moeten voor wat betreft
      afmetingen en wendbaarheid voldoen aan het bepaalde in [richtlijn 97/27/EG](31997L0027), met uitzondering van het
      bepaalde in Bijlage I, onderdeel 7.6.1.2.

      3 Aanhangwagens die in gebruik zijn genomen voor 22 juli 1999 mogen:

      a. niet breder zijn dan 2,55 m, met uitzondering van geconditioneerde voertuigen die niet breder mogen zijn dan
      2,60 m; en

      b. niet hoger zijn dan 4,00 m.

      4 Aanhangwagens, niet zijnde opleggers, die in gebruik zijn genomen voor 22 juli 1999 mogen niet langer zijn dan
      12,00 m.

      5 Van opleggers die na 31 december 1994 in gebruik worden genomen, mag de horizontaal gemeten afstand tussen het
      hart van de koppelingspen en enig deel aan de voorzijde van de oplegger niet meer bedragen dan 2,04 m.

      6 Van opleggers die na 31 december 1994 maar voor 22 juli 1999 in gebruik zijn genomen, mag de horizontaal gemeten
      afstand tussen het hart van de koppelingspen en enig deel aan de achterzijde van de oplegger niet meer bedragen
      dan 12,00 m.

      7 Van opleggers die voor 1 januari 1995 in gebruik zijn genomen, mag de horizontaal gemeten afstand tussen het hart
      van de koppelingspen en enig deel aan de voorzijde van de oplegger niet meer bedragen dan 2,05 m, met uitzondering
      van een puntvormige uitbouw waarvan het verticaal geprojecteerde oppervlak wordt begrensd door rechte lijnen die
      raken aan de uiterste voorhoeken van de oplegger en een punt op het mediaanvlak van de oplegger dat op maximaal
      2,50 m voor het hart van de koppelingspen ligt.

      8 Van aanhangwagens, met uitzondering van kermis- of circusvoertuigen, die in gebruik zijn genomen voor 22 juli
      1999, mag bij het inrijden en vervolgens doorrijden van een cirkel met een straal van 12,50 m, waarbij het inrijden
      van de cirkel geschiedt met de buitenzijde van het samenstel van voertuigen langs de binnenzijde van de raaklijn
      aan de cirkel, en het doorrijden van de cirkel geschiedt over een hoek van 360 graden met de voorzijde van het
      samenstel van voertuigen langs de binnenzijde van de cirkel, de uitscheermaat van het samenstel van voertuigen
      niet meer dan 0,80 m bedragen en de bestreken baan niet meer dan 7,20 m bedragen. Deze bepaling geldt niet voor
      opleggers die voor 1 april 1983 in gebruik zijn genomen, waarvan het laadvlak zich geheel of grotendeels op gelijke
      of nagenoeg gelijke hoogte als of lager dan de assen boven het wegdek bevindt en die worden gebruikt voor het
      vervoer van ondeelbare lading.

      9 Het eerste en het tweede lid zijn voor wat betreft wendbaarheid niet van toepassing op kermis- of
      circusvoertuigen.

      10 In afwijking van het bepaalde in het vierde lid mogen:

      a. middenasaanhangwagens die na 30 juni 1967 maar voor 1 januari 1987 in gebruik zijn genomen, niet langer zijn dan
      10,00 m, indien de toegestane maximum massa meer bedraagt dan 2 500 kg maar niet meer dan 3 500 kg;

      b. middenasaanhangwagens die voor 1 juli 1967 in gebruik zijn genomen, niet langer zijn dan 10,00 m.

      11 In afwijking van het bepaalde in het eerste tot en met vierde lid mogen kermis- of circusvoertuigen niet langer
      zijn dan 14,00 m.

      12 In afwijking van het bepaalde in het eerste, tweede en zesde lid mag voor een kermis- of circusvoertuig de
      horizontaal gemeten afstand tussen het hart van de koppelingspen en de achterzijde van de oplegger niet meer
      bedragen dan 17,50 m.

      13 Bij de vaststelling van de afstand, bedoeld in het vijfde, zesde en zevende lid, worden markeringslichten,
      zijmarkeringslichten, richtingaanwijzers, stadslichten, zijretroreflectoren, douaneverzegelingen en
      bevestigingsmiddelen van het dekzeil buiten beschouwing gelaten.

      14 In de afmetingen, bedoeld in het eerste en tweede lid, zijn afneembare bovenbouwen en gestandaardiseerde
      laadstructuren begrepen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.6
  - number: 3.7.9
    text: |-
      1 Bij middenasaanhangwagens mag de last onder de koppeling:

      a. alleen in neerwaartse richting zijn gericht;

      b. niet meer bedragen dan de door de fabrikant van de aanhangwagen opgegeven toegestane maximum last onder de
      koppeling;

      c. niet meer bedragen dan 10,0% van de toegestane maximum massa van de aanhangwagen en niet meer dan 1000 kg;

      d. niet minder bedragen dan 1,0% van de toegestane maximum massa van de aanhangwagen, doch de last behoeft niet
      meer te bedragen dan 50 kg.

      2 De last onder de as of assen van aanhangwagens die na 31 december 1994 in gebruik worden genomen, mag niet meer
      bedragen dan:

      a. de door de fabrikant van het voertuig opgegeven toegestane maximum last,

      b. voor enige as, 10 000 kg,

      c. voor aanhangwagens met een asstel met twee achter elkaar gelegen enkele assen, indien de onderlinge afstand
      tussen de assen:

      1°. minder bedraagt dan 1,00 m, 11 000 kg te zamen,

      2°. 1,00 m of meer bedraagt maar minder dan 1,30 m, 16 000 kg te zamen,

      3°. 1,30 m of meer bedraagt maar minder dan 1,80 m, 18 000 kg te zamen,

      d. voor aanhangwagens met een asstel met meer dan twee achter elkaar gelegen assen:

      1°. indien de afstand tot de dichtstbij zijnde naastgelegen as van dat asstel minder bedraagt dan 1,30 m, 7 000 kg
      per as;

      2°. indien de afstand tot de dichtstbij zijnde naastgelegen as van dat asstel 1,30 m of meer bedraagt maar minder
      dan 1,80 m, 8 000 kg per as, dan wel 9 000 kg per as indien het asstel is voorzien van gasvering of van in het
      kader van de Europese Gemeenschappen als gelijkwaardig aangemerkte vering,

      e. voor aanhangwagens met twee in elkaars verlengde gelegen enkele assen, 13 000 kg, waarbij de last onder ieder
      der assen niet meer mag bedragen dan 6500 kg,

      f. voor aanhangwagens, bestemd voor het vervoer van ondeelbare lading, met twee in elkaars verlengde gelegen enkele
      assen, 16 000 kg, waarbij de last onder ieder der assen niet meer mag bedragen dan 8000 kg,

      g. voor aanhangwagens met twee achter elkaar gelegen aslijnen als bedoeld onder *e*, waarbij de onderlinge afstand
      tussen de aslijnen:

      1°. minder bedraagt dan 1,00 m, 13 000 kg te zamen,

      2°. 1,00 m of meer bedraagt maar minder dan 1,30 m, 17 000 kg te zamen,

      3°. 1,30 m of meer bedraagt maar minder dan 1,80 m, 21 000 kg te zamen,

      waarbij de last onder ieder der assen niet meer mag bedragen dan 6 500 kg,

      h. voor aanhangwagens, bestemd voor het vervoer van ondeelbare lading, met twee of meer achter elkaar gelegen
      aslijnen als bedoeld onder *e*, waarbij de onderlinge afstand tussen de aslijnen:

      1°. minder bedraagt dan 1,00 m, 16 000 kg te zamen,

      2°. 1,00 m of meer bedraagt, 12 000 kg vermenigvuldigd met het aantal aslijnen,

      waarbij de last onder ieder der assen niet meer mag bedragen dan 8 000 kg,

      i. voor aanhangwagens met meer dan twee achter elkaar gelegen aslijnen als bedoeld onder *e*, waarbij de onderlinge
      afstand tussen de aslijnen 1,30 m of meer bedraagt maar minder dan 1,80 m, het aantal aslijnen vermenigvuldigd met
      13 000 kg, waarbij de last onder ieder der assen niet meer mag bedragen dan 6500 kg, mits het asstel is voorzien
      van gasvering of van in het kader van de Europese Gemeenschappen als gelijkwaardig aangemerkte vering,

      j. voor aanhangwagens, bestemd voor het vervoer van ondeelbare lading, met twee of meer achter elkaar gelegen
      aslijnen als bedoeld onder *e*, waarbij de onderlinge afstand tussen de aslijnen 1,30 m of meer bedraagt maar
      minder dan 1,80 m, het aantal aslijnen vermenigvuldigd met 16 000 kg, waarbij de last onder ieder der assen niet
      meer mag bedragen dan 8000 kg, mits het asstel is voorzien van gasvering of van in het kader van de Europese
      Gemeenschappen als gelijkwaardig aangemerkte vering.

      3 Onze Minister stelt regels vast met betrekking tot de toegestane maximum last onder de as of assen van
      aanhangwagens die niet in het tweede lid zijn genoemd dan wel die voor 1 januari 1995 in gebruik zijn genomen.

      4 De toegestane maximum massa van middenasaanhangwagens mag niet meer bedragen dan 12 000 kg. Indien de
      middenasaanhangwagen is voorzien van gasvering of van in het kader van de Europese Gemeenschappen als gelijkwaardig
      aangemerkte vering, mag de toegestane maximum massa niet meer bedragen dan:

      a. 20 000 kg, of

      b. 24 000 kg indien de middenasaanhangwagen is voorzien van drie assen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.9
  - number: 3.7.20
    text: |-
      1 Van een meervoudige asconstructie van een aanhangwagen die in gebruik wordt genomen na 30 september 1974, mogen
      niet meer dan drie assen star zijn uitgevoerd, waarbij de afstand tussen de twee uiterste starre assen niet meer
      mag bedragen dan 2,80 m.

      2 Van een meervoudige asconstructie van een aanhangwagen die in gebruik is genomen na 30 september 1974 doch
      voor 1 januari 1995, mogen een of meer assen zelfsturend zijn uitgevoerd mits de toegestane maximum last onder de
      zelfsturende assen niet meer bedraagt dan 45,0% van de toegestane maximum last onder de meervoudige asconstructie.

      3 Voor de toepassing van dit artikel wordt onder een starre as verstaan een as waarvan de wielen niet gestuurd of
      zelfsturend zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.20
  - number: 3.7.21
    text: |-
      1 De ashefinrichting van aanhangwagens die in gebruik worden genomen na 31 maart 1983 dient, voorzover deze
      inrichting werkt door het optrekken van de wielen van de bodem of het neerlaten van de wielen op de bodem en de
      aanhangwagen is voorzien van een samenstel van assen, zodanig te zijn uitgevoerd dat deze inrichting automatisch
      buiten werking wordt gesteld niet later dan nadat de aslast van een van de op het rijvlak rustende assen van dat
      samenstel de grootste voor deze as toegestane waarde heeft bereikt.

      2 In afwijking van het eerste lid mogen aanhangwagens die in gebruik worden genomen na 21 juli 1999 zijn voorzien
      van een ashefinrichting die voldoet aan het bepaalde in Bijlage IV, onderdeel 3, van [richtlijn 97/27/EG]
      (31997L0027).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.21
  - number: 3.7.22
    text: |-
      1 Assen van aanhangwagens moeten door de fabrikant van de as zijn voorzien van:

      a. een merk- of fabrieksaanduiding;

      b. een typeaanduiding;

      c. een opgave van de maximale technisch toelaatbare aslast.

      2 De door de fabrikant van het voertuig opgegeven toegestane maximum aslast mag niet meer bedragen dan de opgave,
      bedoeld in onderdeel c van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.22
  - number: 3.7.23
    text: |-
      1 Aanhangwagens die in gebruik worden genomen na 30 september 1971, moeten zijn voorzien van banden die voldoen
      aan het bepaalde in [richtlijn 92/23/EEG](31992L0023). In afwijking hiervan mogen aanhangwagens die in gebruik zijn
      genomen na 30 september 1971 doch voor 1 januari 1995, zijn voorzien van banden waarvan de technische gegevens zijn
      opgenomen in een door Onze Minister vastgestelde tabel.

      2 Het draagvermogen van de banden moet voldoende zijn voor het door de fabrikant van het voertuig opgegeven
      draagvermogen van de as waarop zij zijn gemonteerd, bij een snelheid van 100 km/h.

      3 Onze Minister stelt regels vast met betrekking tot de montage van banden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.23
  - number: 3.7.24
    text: |-
      1 Aanhangwagens moeten zijn voorzien van een goed werkend veersysteem. Banden worden niet als deel van het
      veersysteem beschouwd.

      2 Aanhangwagens die zijn voorzien van gasvering, en aanhangwagens met een toegestane maximum massa van ten hoogste
      3500 kg, die zijn voorzien van schroefveren, moeten zijn voorzien van deugdelijk bevestigde en goed werkende
      schokdempers.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.24
  - number: 3.7.25
    text: |-
      1 Aanhangwagens die in gebruik genomen worden na 31 december 1994, moeten voor wat betreft de stuurinrichting
      voldoen aan het bepaalde in [richtlijn 70/311/EEG](31970L0311).

      2 De stuurinrichting van aanhangwagens die in gebruik zijn genomen voor 1 januari 1995, moet deugdelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.25
  - number: 3.7.26
    text: |-
      1 Aanhangwagens die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft de reminrichting voldoen
      aan het bepaalde in [richtlijn 71/320/EEG](31971L0320).

      2 Aanhangwagens die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van een reminrichting die
      voldoet aan de door Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.26
  - number: 3.7.29
    text: |-
      De ruiten van aanhangwagens die in gebruik worden genomen na 31 december 1994, moeten voldoen aan het bepaalde in
      [richtlijn 92/22/EEG](31992L0022).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.29
  - number: 3.7.34
    text: |-
      Aanhangwagens, in gebruik genomen na 8 mei 2004, voldoen wat verwarmingssystemen betreft aan [richtlijn 2001/56/
      EG](32001L0056).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.34
  - number: 3.7.37
    text: |-
      1 Aanhangwagens mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor andere
      weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen die in geval van botsing het gevaar voor
      lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn afgeschermd.

      3 Het bepaalde in het eerste en tweede lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m boven
      het wegdek bevinden.

      4 Aanhangwagens die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft de bescherming aan
      de achterzijde voldoen aan het bepaalde in [richtlijn 70/221/EEG](31970L0221). Deze bepaling geldt niet voor
      aanhangwagens waarvan het gebruik zich naar het oordeel van degene die met de afgifte van kentekenbewijzen is
      belast, verzet tegen de aanwezigheid van een beschermingsinrichting aan de achterzijde, alsmede voor aanhangwagens
      die speciaal zijn gebouwd voor het vervoer van in de lengte ondeelbare lading.

      5 Aanhangwagens die in gebruik zijn genomen na 30 juni 1967 doch voor 1 januari 1995, moeten voor wat betreft de
      bescherming aan de achterzijde, behoudens indien zij hieromtrent voldoen aan het bepaalde in [richtlijn 70/221/
      EEG](31970L0221), voldoen aan de door Onze Minister vastgestelde eisen. Deze bepaling geldt niet voor aanhangwagens
      waarvan het gebruik zich naar het oordeel van degene die met de afgifte van kentekenbewijzen is belast, verzet
      tegen de aanwezigheid van een beschermingsinrichting aan de achterzijde, alsmede voor aanhangwagens die speciaal
      zijn gebouwd voor het vervoer van in de lengte ondeelbare lading.

      6 Aanhangwagens met een toegestane maximum massa van meer dan 3500 kg, die in gebruik worden genomen na 31 december
      1994, moeten tussen de achterste vooras of de koppelingspen indien het een oplegger betreft, en de voorste achteras
      zijn voorzien van zijdelingse afscherming die voldoet aan het bepaalde in [richtlijn 89/297/EEG](31989L0297),
      alsmede achter de voorste achteras zijn voorzien van zijdelingse afscherming die voldoet aan de door Onze Minister
      vastgestelde eisen.

      7 Op aanhangwagens met een toegestane maximum massa van niet meer dan 3500 kg, die in gebruik worden genomen na
      31 december 1994, is ten aanzien van de zijdelingse afscherming tussen de achterste vooras of de koppelingspen
      indien het een oplegger betreft en de voorste achteras het in [richtlijn 89/297/EEG](31989L0297) voor aanhangwagens
      met een toegestane maximum massa van meer dan 3500 kg doch niet meer dan 10 000 kg bepaalde van overeenkomstige
      toepassing. Zij moeten voorts achter de voorste achteras zijn voorzien van zijdelingse afscherming die voldoet aan
      de door Onze Minister vastgestelde eisen.

      8 Onverminderd het bepaalde in het zesde en zevende lid moeten middenasaanhangwagens voor de voorste as zijn
      voorzien van zijdelingse afscherming die voldoet aan de door Onze Minister vastgestelde eisen.

      9 Aanhangwagens die in gebruik zijn genomen na 31 december 1969 doch voor 1 januari 1995, moeten zijn voorzien van
      zijdelingse afscherming, die voldoet aan de door Onze Minister vastgestelde eisen.

      10 De in het zesde, zevende, achtste en negende lid bedoelde verplichting tot zijdelingse afscherming geldt niet
      voor aanhangwagens die zijn gebouwd voor speciale doeleinden en waarbij het om praktische redenen niet mogelijk is
      zijdelingse afscherming aan te brengen, alsmede voor aanhangwagens die speciaal zijn gebouwd voor het vervoer van
      in de lengte ondeelbare lading.

      11 De wielen van aanhangwagens in gebruik genomen na 31 december 1974 moeten zijn afgeschermd overeenkomstig de
      door Onze Minister vastgestelde eisen. De wielen van aanhangwagens die in gebruik zijn genomen voor 1 januari 1975
      moeten deugdelijk zijn afgeschermd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.37
  - number: 3.7.38
    text: De wielen onderscheidenlijk banden van aanhangwagens mogen niet kunnen aanlopen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.38
  - number: 3.7.39
    text: |-
      1 Aanhangwagens die in gebruik genomen worden na 31 december 1994, moeten aan de achterzijde zijn voorzien van
      een mogelijkheid tot bevestiging van een kentekenplaat, die voldoet aan het bepaalde in [richtlijn 70/222/EEG]
      (31970L0222).

      2 Aanhangwagens die in gebruik zijn genomen voor 1 januari 1995, moeten aan de achterzijde zijn voorzien van een
      mogelijkheid tot bevestiging van een kentekenplaat.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.39
  - number: 3.7.40
    text: |-
      1 Aanhangwagens die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een installatie
      van verlichting en lichtsignalen, alsmede van retroreflecterende voorzieningen, die voldoen aan het bepaalde in
      [richtlijn 76/756/EEG](31976L0756).

      2 De in de lichtarmaturen toegepaste gloeilampen moeten voldoen aan het bepaalde in Bijlage VII behorende bij
      [Richtlijn 76/761/EEG](31976L0761).

      3 Het tweede lid is niet van toepassing ten aanzien van lampen waarbij lichtarmatuur en lichtbron een gesloten
      eenheid vormen.

      4 Onze Minister stelt regels vast met betrekking tot de verlichting, lichtsignalen en retroreflecterende
      voorzieningen van aanhangwagens die in gebruik zijn genomen voor 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.40
  - number: 3.7.41
    text: |-
      Aanhangwagens die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van:

      a. stadslichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758), indien het voertuig breder is
      dan 1,60 m;

      b. richtingaanwijzers en waarschuwingsknipperlichten, die voldoen aan het bepaalde in [richtlijn 76/759/EEG]
      (31976L0759);

      c. achterlichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758);

      d. remlichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758);

      e. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat, die
      voldoet aan het bepaalde in [richtlijn 76/760/EEG](31976L0760);

      f. driehoekige rode retroreflectoren aan de achterzijde van het voertuig, die voldoen aan het bepaalde in
      [richtlijn 76/757/EEG](31976L0757);

      g. een of twee mistlichten aan de achterzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 77/538/
      EEG](31977L0538);

      h. witte retroreflectoren aan de voorzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 76/757/
      EEG](31976L0757);

      i. ambergele retroreflectoren aan de zijkanten van het voertuig, die voldoen aan het bepaalde in [richtlijn 76/757/
      EEG](31976L0757);

      j. markeringslichten, die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758), indien het voertuig
      breder is dan 2,10 m;

      k. zijmarkeringslichten die voldoen aan het bepaalde in Bijlage IV behorende bij [Richtlijn 76/758/EEG]
      (31976L0758), indien het voertuig langer is dan 6,00 m;

      l. een markering aan de achterzijde van het voertuig, die voldoet aan de door Onze Minister vastgestelde eisen,
      indien de toegestane maximum massa van het voertuig meer bedraagt dan 3500 kg; deze eis geldt niet voor door Onze
      Minister aangewezen aanhangwagens waarvan de bouw, de inrichting of het gebruik zich verzet tegen het aanbrengen
      van de markering.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.41
  - number: 3.7.46
    text: |-
      1 Aanhangwagens die in gebruik worden genomen na 31 december 1994, mogen zijn voorzien van:

      a. achteruitrijlichten die voldoen aan het bepaalde in [richtlijn 77/539/EEG](31977L0539);

      b. twee extra richtingaanwijzers en waarschuwingsknipperlichten, die voldoen aan het bepaalde in [richtlijn 76/759/
      EEG](31976L0759), aangebracht op het breedste punt zo hoog mogelijk aan de achterzijde van het voertuig;

      c. herhalingswaarschuwingsknipperlichten aan het meest naar achteren gelegen deel van de zich aan de zijof
      achterkant van het voertuig bevindende laad- en losklep in horizontale stand, die voldoen aan het bepaalde in de
      onder *b* genoemde richtlijn, met uitzondering van de eisen ten aanzien van de minimum hoogte boven het wegdek;

      d. markeringslichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758), indien het voertuig breder
      is dan 1,80 m, doch niet breder dan 2,10 m;

      e. zijmarkeringslichten die voldoen aan het bepaalde in Bijlage IV behorende bij [Richtlijn 76/758/EEG]
      (31976L0758), indien het voertuig niet langer is dan 6,00 m;

      f. niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig, die zijn opgenomen in het lamphuis
      van andere lichten en die voldoen aan het bepaalde in [richtlijn 76/757/EEG](31976L0757);

      g. werklichten;

      h. een derde remlicht dat voldoet aan het bepaalde in [richtlijn 76/756/EEG](31976L0756).

      2 Aanhangwagens mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra rode
      niet-driehoekige aan de achterzijde en extra ambergele aan de zijkanten van het voertuig, mits deze geen nadelige
      invloed hebben op de effectiviteit van de verplichte lichten en retroreflecterende voorzieningen.

      3 Aanhangwagens mogen zijn voorzien van een lijnmarkering of contourmarkering, die voldoet aan en is aangebracht
      overeenkomstig ECE-reglement 104. Binnen de contourmarkering aan de zijkant van de aanhangwagen mogen
      retroreflecterende letters of afbeeldingen zijn aangebracht die voldoen aan ECE-reglement 104, voorzover deze geen
      nadelige invloed hebben op de effectiviteit van de contourmarkering en de verplichte lichten en retroreflecterende
      voorzieningen. In ieder geval mogen de retroreflecterende letters of afbeeldingen niet meer dan 1/3 deel van de
      totale oppervlakte binnen de omtrek van de contourmarkering uitmaken

      4 Onze Minister draagt zorg voor een vertaling van ECE-reglement 104 en doet van de wijze van bekendmaking
      mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.46
  - number: 3.7.48
    text: Het derde remlicht mag slechts rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.48
  - number: 3.7.51
    text: |-
      Aanhangwagens mogen, onverminderd het in [artikel 30 van het RVV 1990][ref1] bepaalde inzake zwaai-
      en knipperlichten, niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 3.7.41][ref2] en [3.7.46][ref3] dan wel krachtens [artikel 3.7.40, vierde lid][ref4], is voorgeschreven
      of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel3.7.41
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel3.7.46
      [ref4]: https://wetten.overheid.nl/BWBR0006746#Artikel3.7.40
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.51
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 3.7.41
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0006746
        artikel: 3.7.46
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '7'
      - id: ref4
