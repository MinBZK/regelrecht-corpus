  - number: 5.3.10a
    text: |-
      1 Indien de bedrijfsauto is voorzien van een CNG-installatie, moet deze, onverminderd [artikel 5.3.9][ref1],
      voldoen aan de in de volgende leden gestelde eisen.

      2 De CNG-tank:

      a. moet permanent zijn aangebracht aan het voertuig, en

      b. mag geen deuken vertonen.

      3 De CNG-tank mag niet in de motorruimte zijn geplaatst.

      4 Indien de CNG-tank in gebruik is genomen na 19 juli 2002, mag de geldigheid van de goedkeuring niet verstreken
      zijn. CNG-tanks die voor 20 juli 2002 in gebruik zijn genomen en waarvan de gegevens omtrent de geldigheid van de
      goedkeuring niet beschikbaar zijn, mogen niet ouder zijn dan 10 jaar, dan wel mag het voertuig niet ouder zijn dan
      10 jaar.

      5 Op de CNG-installatie mogen geen andere verbruikers zijn aangesloten dan die, welke strikt noodzakelijk zijn voor
      het goed functioneren van de motor van het voertuig, met uitzondering van een verwarmingsinstallatie ten behoeve
      van de personenruimte of laadruimte.

      6 Indien het voertuig in gebruik genomen is na 1 juli 1995, moet het voertuig zijn voorzien van een goed werkende
      automatische tankafsluiter.

      7 De onderdelen van de CNG-installatie moeten vrij zijn van ernstige beschadigingen en mogen niet door corrosie
      zijn aangetast, met uitzondering van corrosie van het oppervlak.

      8 De leidingen en gasvoerende slangen mogen geen knikken vertonen.

      9 De gasvoerende slangen mogen geen beschadiging vertonen waarbij het wapeningsmateriaal zichtbaar is.


