  - number: 5.3.47
    text: |-
      1 bedrijfsauto's, die na 31 december 1997 in gebruik zijn genomen, en T100-bussen moeten zijn voorzien van
      autogordels voor:

      a. de zitplaats van de bestuurder en de ernaast gelegen naar voren gerichte zitplaatsen, en

      b. de overige naar voren gerichte zitplaatsen indien op een afstand van maximaal 1.30 m voor de rugleuning van deze
      zitplaats zich geen veiligheidsscherm of rugleuning van een ervoor gelegen zitplaats bevindt.

      2 In afwijking van het eerste lid moeten:

      a. bussen met een toegestane maximum massa van niet meer dan 3500 kg die na 30 september 2002 in gebruik zijn
      genomen, en

      b. bussen met een toegestane maximum massa van meer dan 3500 kg die na 30 september 2000 in gebruik zijn genomen,
      zijn voorzien van autogordels voor alle naar voren en naar achteren gerichte zitplaatsen.

      3 Bedrijfsauto’s die na 31 december 1989 doch voor 1 januari 1998 in gebruik zijn genomen en die beurtelings voor
      het vervoer van personen of goederen kunnen worden ingericht, moeten voorzien zijn van autogordels voor alle naar
      voren gerichte zitplaatsen.

      4 Bedrijfsauto’s die na 1 januari 1971 doch voor 1 januari 1990 in gebruik zijn genomen en die beurtelings voor het
      vervoer van personen of goederen kunnen worden ingericht, moeten zijn voorzien van autogordels voor de zitplaats
      van de bestuurder en de naast deze plaats aanwezige zitplaatsen, voor zover deze aan een portier grenzen.

      5 Het eerste tot en met het vierde lid is niet van toepassing op:

      a. klapstoelen en zitplaatsen die uitsluitend zijn bestemd voor gebruik bij stilstaand voertuig;

      b. bussen die zijn bestemd voor stadsgebruik;

      c. bussen die beschikken over speciaal voor staande passagiers bedoelde plaatsen, en

      d. voertuigen die voor 1 januari 1998 in gebruik zijn genomen en die blijkens een aantekening in het voor het
      voertuig afgegeven kentekenbewijs niet van bevestigingspunten voor autogordels hoeven te zijn voorzien.

      6 Autogordels van bedrijfsauto's die na 30 september 2000 in gebruik zijn genomen, moeten zijn voorzien van een
      door Onze Minister vastgesteld goedkeuringsmerk.

      7 De autogordels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de sterkte ervan in
      gevaar wordt gebracht.

      8 De autogordels moeten zijn voorzien van een goed werkende sluiting en een goed werkende blokkering.
      Oprolmechanismen moeten zodanig functioneren dat de gordel aanligt na het omdoen ervan.

      9 Onze Minister stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging, bedoeld in het zevende
      lid.
