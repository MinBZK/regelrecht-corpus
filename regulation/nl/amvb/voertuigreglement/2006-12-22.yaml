  - number: '8.3'
    text: |-
      Overtreding van [artikel 9.1, tweede, derde en vierde lid](onbekend), en van artikel 16, eerste lid, van het
      Wegenverkeersreglement zoals dat ingevolge [artikel 9.4][ref1] in stand blijft, is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel9.4
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '9.4'
        hoofdstuk: '9'
  - number: '9.1'
    text: |-
      1 Motorrijtuigen die zijn ingericht voor het vervoer van een gehandicapte, die zijn uitgerust met een
      elektromotor of met een verbrandingsmotor met een cylinderinhoud van ten hoogste 250 cm3 en die niet
      zijn gehandicaptenvoertuigen, welke motorrijtuigen vóór 1 januari 2000 in het verkeer zijn gebracht,
      mogen tot 1 januari 2010 in afwijking van de voor personenauto’s geldende eisen, voldoen aan de in de
      [artikelen 5.10.1 tot en met 5.10.71][ref1] gestelde eisen voor gehandicaptenvoertuigen die zijn voorzien van een
      gesloten carrosserie en die zijn uitgerust met een verbrandingsmotor of een elektromotor, met uitzondering van de
      eisen in de [artikelen 5.10.6, onderdeel b][ref2], [5.10.38][ref3] en [5.10.39][ref4].

      2 De remvertraging van de in het eerste lid bedoelde motorrijtuigen moet op een droge of nagenoeg droge en ongeveer
      horizontaal liggende weg ten minste 2,0 m/s2 bedragen.

      3 De in het eerste lid bedoelde motorrijtuigen mogen uitsluitend door gehandicapten worden gebruikt.

      4 De in het eerste lid bedoelde motorrijtuigen mogen uitsluitend binnen de bebouwde kom worden gebruikt, behoudens
      ontheffing door het bevoegd gezag.

      5 Ontheffingen als bedoeld in het vierde lid, welke zijn verleend voor het tijdstip van inwerkingtreding van dit
      artikel, blijven geldig voor de geldigheidsduur van die ontheffingen. Zij kunnen door het gezag dat de ontheffing
      heeft verleend, worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.10.1
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.10.6
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.10.38
      [ref4]: https://wetten.overheid.nl/BWBR0006746#Artikel5.10.39
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel9.1
