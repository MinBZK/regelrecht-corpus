  - number: 5.3.56
    text: |-
      1 Het dimlicht van bedrijfsauto’s moet zodanig zijn afgesteld dat bij controle met een koplamptestapparaat dan wel
      een verlichtingsscherm het geprojecteerde beeld, na fixatie van het apparaat dan wel het scherm, voldoet aan de
      volgende eisen:

      a. het lichte vlak moet zich onder het donkere vlak bevinden;

      b. een duidelijke, geheel of ten dele horizontale scheidingslijn tussen licht en donker moet zichtbaar zijn;

      c. het horizontale gedeelte van de scheidingslijn moet zich bevinden tussen of op de lijnen op het scherm van
      het koplamptestapparaat dan wel op het verlichtingsscherm, die overeenkomen met een daling van de lichtbundel ten
      opzichte van de horizontale middenlijn van de koplamp van 5 tot 40 mm/m;

      d. indien een ten dele horizontale scheidingslijn zichtbaar is:

      1°. moet het horizontale gedeelte van de scheidingslijn zich grotendeels links bevinden van de verticale hartlijn
      op het scherm van het koplamptestapparaat dan wel op het verlichtingsscherm;

      2°. mag het snijpunt van het horizontale en het niet-horizontale gedeelte:

      a. bij controle met een koplamptestapparaat niet links van de verticale hartlijn op het scherm van het
      koplamptestapparaat vallen, dan wel

      b. bij controle met een verlichtingsscherm maximaal 20 mm/m links van de geprojecteerde verticale hartlijn van de
      koplamp op het verlichtingsscherm vallen.

      2 Het voor het dimlicht bestemde deel van de reflector mag zijn oorspronkelijke reflecterende werking niet in
      ernstige mate hebben verloren.

      3 Onze Minister stelt regels vast omtrent het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.56
  - number: 5.3.57
    text: |-
      1 Bedrijfsauto’s mogen zijn voorzien van:

      a. twee mistlichten aan de voorzijde van het voertuig;

      b. parkeerlichten, indien het voertuig niet langer is dan 6,00 m en niet breder is dan 2,00 m;

      c. twee extra richtingaanwijzers en waarschuwingsknipperlichten aan de achterzijde van het voertuig;

      d. één zijrichtingaanwijzer aan elke zijkant van het voertuig indien deze lichten niet reeds ingevolge
      [artikel 5.3.51][ref1] verplicht zijn;

      e. twee herhalingswaarschuwingsknipperlichten aan het meest naar achteren gelegen gedeelte van de zich aan de zij-
      of achterkant van het voertuig bevindende laad- en losklep in horizontale stand;

      f. ambergele retroreflectoren aan de zijkanten van het voertuig indien het voertuig niet langer is dan 6,00 m;

      g. twee witte retroreflectoren aan de voorzijde van het voertuig;

      h. twee markeringslichten aan de voorzijde en twee aan de achterzijde van het voertuig, indien deze lichten niet
      reeds ingevolge [artikel 5.3.51][ref2] verplicht zijn en het voertuig breder is dan 1,80 m;

      i. zijmarkeringslichten, indien deze lichten niet reeds ingevolge [artikel 5.3.51][ref3] verplicht zijn,
      aangebracht overeenkomstig de door Onze Minister vastgestelde eisen;

      j. een richtlicht;

      k. een bermlicht aan de voorzijde van het voertuig;

      l. werklichten;

      m. een derde remlicht, aangebracht zodanig dat:

      1°. het midden van het lichtdoorlatende gedeelte zich bevindt in het middenlangsvlak van het voertuig of de rand
      van het lichtdoorlatende gedeelte op een afstand van ten hoogste 0,15 m vanaf dit middenlangsvlak indien het derde
      remlicht niet op een vast deel van de carrosserie of bovenbouw kan worden bevestigd, en

      2°. de onderzijde van het lichtdoorlatende gedeelte hoger ligt dan de boven zijde van de remlichten, bedoeld in
      [artikel 5.3.51, onderdeel h][ref4];

      n. In afwijking van onderdeel m kunnen bij bedrijfsauto’s met een toegestane maximum massa van niet meer dan 3500
      kg twee extra remlichten worden aangebracht, indien het derde remlicht niet op een vast deel van de carrosserie of
      bovenbouw binnen 0.15m vanaf het middenlangsvlak kan worden bevestigd;

      o. Bij bedrijfsauto’s met een toegestane maximum massa van meer dan 3500 kg kunnen, in afwijking van onderdeel m,
      twee extra remlichten worden aangebracht;

      p. twee dagrijlichten;

      q. inwendig verlichte transparanten die voor het overige verkeer bij regeling van Onze Minister vast te stellen
      informatie over het gebruik of de bestemming van het voertuig bieden. De verlichting moet afzonderlijk zijn
      geschakeld en mag naar achteren niet rood stralen. Bij regeling van Onze Minister worden nadere eisen vastgesteld
      ten aanzien van de uitvoering van de transparanten en de plaats waar zij op of aan het voertuig zijn aangebracht.

      2 Lichten die ingevolge [artikel 5.3.51][ref5] verplicht zijn gesteld voor voertuigen die na een in dat
      artikel genoemd tijdstip in gebruik zijn genomen, mogen zijn aangebracht op voertuigen die voor of op dat
      tijdstip in gebruik zijn genomen mits wordt voldaan aan de in [artikel 5.3.53][ref6] met betrekking tot die
      lichten, met uitzondering van markeringslichten en zijmarkeringslichten, gestelde eisen. Markeringslichten en
      zijmarkeringslichten moeten alsdan voldoen aan het bepaalde in de onderdelen h onderscheidenlijk i van het eerste
      lid.

      3 Bedrijfsauto’s mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra niet-
      driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig.

      4 Bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg, mogen zijn voorzien van een ambergele
      of witte lijnmarkering aan de zijkant van het voertuig of van een ambergele, witte of rode lijnmarkering aan de
      achterkant van het voertuig.

      5 Bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg, mogen zijn voorzien van een ambergele of
      witte contourmarkering aan de zijkant van het voertuig of een ambergele, witte of rode contourmarkering aan de
      achterkant van het voertuig. Binnen de contourmarkering aan de zijkant van het voertuig mogen retroreflecterende
      letters of afbeeldingen zijn aangebracht, voorzover deze geen nadelige invloed hebben op de effectiviteit
      van de contourmarkering en de verplichte lichten en retroreflecterende voorzieningen. In ieder geval mogen de
      retroreflecterende letters of afbeeldingen niet meer dan 1/3 deel van de totale oppervlakte binnen de omtrek van de
      contourmarkering uitmaken

      6 Ieder afzonderlijk deel van de lijn- en contourmarkering en van het materiaal voor de retroreflecterende letters
      of afbeeldingen binnen de contourmarkering is voorzien van een door Onze Minister vastgesteld goedkeuringsmerk.

      7 Bij regeling van Onze Minister worden voorschriften gesteld met betrekking tot de installatie van de lijn- en
      contourmarkering.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.51
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.51
