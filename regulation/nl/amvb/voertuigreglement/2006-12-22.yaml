  - number: 1a.2
    text: |-
      1 Het is tot 9 november 2004 de fabrikant van een motorfiets, een driewielig motorrijtuig, een bromfiets of een
      niet-oorspronkelijke technische eenheid of onderdeel van deze voertuigen verboden een voertuig, technische eenheid
      of onderdeel dat is gebouwd overeenkomstig een ingevolge [richtlijn 92/61/EG](31992L0061) goedgekeurd type, in
      voorraad te hebben, te koop aan te bieden of af te leveren, zonder het voertuig, de technische eenheid of het
      onderdeel vergezeld te doen gaan van een certificaat van overeenstemming volgens het model, bedoeld in bijlage IV,
      onderdeel A, van die richtlijn.

      2 Het is met ingang van 9 november 2004 de fabrikant van een motorfiets, een driewielig motorrijtuig, een bromfiets
      of een niet-oorspronkelijke technische eenheid of onderdeel van deze voertuigen verboden een voertuig, technische
      eenheid of onderdeel dat is gebouwd overeenkomstig een ingevolge [richtlijn 92/61/EEG](31992L0061) goedgekeurd
      type, in voorraad te hebben, te koop aan te bieden of af te leveren, zonder het voertuig, de technische eenheid of
      het onderdeel vergezeld te doen gaan van een certificaat van overeenstemming volgens het model, bedoeld in bijlage
      IV, onderdeel A, van [richtlijn 2002/24/EG](32002L0024).

      3 Het is met ingang van 9 november 2003 de fabrikant van een motorfiets, een driewielig motorrijtuig, een bromfiets
      of een niet-oorspronkelijke technische eenheid of onderdeel van deze voertuigen verboden een voertuig, technische
      eenheid of onderdeel dat is gebouwd overeenkomstig een ingevolge [richtlijn 2002/24/EG](32002L0024) goedgekeurd
      type, in voorraad te hebben, te koop aan te bieden of af te leveren, zonder het voertuig, de technische eenheid of
      het onderdeel vergezeld te doen gaan van een certificaat van overeenstemming volgens het model, bedoeld in bijlage
      IV, onderdeel A, van die richtlijn.

      4 Het eerste tot en met derde lid zijn niet van toepassing indien de daar bedoelde technische eenheden of
      onderdelen zijn voorzien van een EG-goedkeuringsmerk overeenkomstig [richtlijn 92/61/EG](31992L0061) of [richtlijn
      2002/24/EG](32002L0024).

      5 Het eerste tot en met derde lid zijn niet van toepassing op fietsen met trapondersteuning, voorzien van
      een elektrische hulpmotor met een continu vermogen van maximaal 0,25 kW waarvan de aandrijfkracht geleidelijk
      vermindert en ten slotte wordt onderbroken wanneer het voertuig een snelheid van 25 km/u bereikt, of eerder, indien
      de bestuurder ophoudt met trappen, en technische eenheden of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.2
  - number: 1a.3
    text: |-
      1 Het is verboden nieuwe bromfietsen te koop aan te bieden, in voorraad te hebben of af te leveren indien deze niet
      overeenstemmen met een goedgekeurd type, bedoeld in artikel 4, eerste lid, van [richtlijn 92/61/EEG](31992L0061) of
      [richtlijn 2002/24/EG](32002L0024).

      2 Het is verboden nieuwe technische eenheden of onderdelen van motorfietsen, driewielige motorrijtuigen of
      bromfietsen te koop aan te bieden, in voorraad te hebben of af te leveren indien deze niet overeenstemmen met een
      goedgekeurd type, bedoeld in artikel 4, eerste lid, van [richtlijn 92/61/EEG](31992L0061) of [richtlijn 2002/24/
      EG](32002L0024).

      3 Het eerste en tweede lid zijn tot 1 december 2003 niet van toepassing op bromfietsen en technische eenheden
      of onderdelen van motorfietsen, driewielige motorrijtuigen of bromfietsen ten aanzien waarvan een nationale
      typegoedkeuring is verleend.

      4 Het eerste en tweede lid zijn niet van toepassing op fietsen met trapondersteuning, voorzien van een elektrische
      hulpmotor met een continu vermogen van maximaal 0,25 kW waarvan de aandrijfkracht geleidelijk vermindert en ten
      slotte wordt onderbroken wanneer het voertuig een snelheid van 25 km/u bereikt, of eerder, indien de bestuurder
      ophoudt met trappen, en technische eenheden of onderdelen daarvan.

      5 Het eerste lid is niet van toepassing op bromfietsen ten aanzien waarvan een goedkeuring voor een individueel
      voertuig als bedoeld in [artikel 26 van de Wegenverkeerswet 1994][ref1] is verleend of op bromfietsen met een door
      de constructie bepaalde maximumsnelheid van ten hoogste 6 km/h en technische eenheden of onderdelen daarvan voor
      zover deze bestemd zijn om op deze bromfietsen te worden gemonteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel26
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.3
    references:
