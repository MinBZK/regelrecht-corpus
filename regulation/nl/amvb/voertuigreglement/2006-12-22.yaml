  - number: 5.2.59
    text: |-
      1 De mistlichten aan de voorzijde, het richtlicht en het bermlicht mogen naar voren niet anders dan wit of geel
      stralen.

      2 De parkeerlichten mogen naar voren niet anders dan wit, en naar achteren niet anders dan rood stralen, tenzij zij
      zijn ingebouwd in ambergeel stralende zijrichtingaanwijzers.

      3 De extra richtingaanwijzers en waarschuwingsknipperlichten mogen niet anders dan ambergeel stralen.

      4 De zijrichtingaanwijzers mogen naar voren niet anders dan wit of ambergeel, en naar achteren niet anders dan rood
      of ambergeel stralen.

      5 De zijmarkeringslichten mogen niet anders dan ambergeel stralen. Indien het achterste zijmarkeringslicht
      onderdeel uitmaakt van een rood stralend licht dan wel van een rode retroreflector, mag dit licht rood stralen.

      6 De markeringslichten mogen naar voren niet anders dan wit en naar achteren niet anders dan rood stralen.

      7 [Artikel 5.2.55, tweede, derde, vierde en zevende lid][ref1], is van toepassing.

      8 Het derde remlicht mag niet anders dan rood stralen.

      9 Op de mistlichten aan de voorzijde van het voertuig is
      [artikel 5.2.55, eerste tot en met vijfde en zevende lid][ref2], van overeenkomstige toepassing.

      10 De dagrijlichten mogen niet anders dan wit stralen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.2.55
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.2.55
