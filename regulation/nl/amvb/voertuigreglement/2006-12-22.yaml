    text: |-
      Bij wijziging van het remsysteem ten behoeve van het gebruik door een gehandicapte, moet het voertuig voldoen aan
      de in [hoofdstuk 3][ref1] opgenomen eisen omtrent algemeen en aan de in de [hoofdstukken 3][ref2] en [5][ref3]
      opgenomen eisen omtrent de reminrichting, met uitzondering van [richtlijn 71/320/EEG](31971L0320) en [richtlijn
      93/14/EEG](31993L0014) voor zover dit noodzakelijk is ten behoeve van de bediening van het remsysteem door een
      gehandicapte.


