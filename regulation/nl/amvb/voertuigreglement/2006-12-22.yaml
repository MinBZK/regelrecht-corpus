  - number: '7.2'
    text: |-
      De aanvrager van een ontheffing dient bij zijn aanvraag het voor de ontheffing vastgestelde tarief aan het bevoegd
      gezag te voldoen op de door het bevoegd gezag vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel7.2
  - number: '7.3'
    text: |-
      Het bevoegd gezag vermeldt in de beschikking houdende verlening van de ontheffing ten minste de volgende gegevens:

      a. de artikelen waarvan ontheffing is verleend dan wel een aanduiding daarvan,

      b. de beperkingen waaronder de ontheffing is verleend en de voorschriften die aan de ontheffing zijn verbonden,

      c. de datum van afgifte,

      d. de geldigheidsduur, en

      e. het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel7.3
  - number: '7.4'
    text: |-
      1 Het bevoegd gezag kan tarieven vaststellen voor het behandelen van aanvragen tot ontheffing.

      2 Het bevoegd gezag kan bij de vaststelling van de tarieven bepalen dat in geval van weigering of buiten
      behandeling laten van een aanvraag een deel van het voldane tarief wordt terugbetaald aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel7.4
  - number: '8.1'
    text: |-
      Overtreding van de [artikelen 5.1.1, eerste en tweede lid][ref1], [5.1.2][ref2], [5.1.3][ref3], [5.1.4][ref4] en
