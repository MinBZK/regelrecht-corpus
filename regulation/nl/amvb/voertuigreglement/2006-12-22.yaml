  - number: '4.6'
    text: |-
      [Artikel 72, eerste lid][ref1], van de wet geldt niet voor een motorrijtuig of een aanhangwagen op de dag waarop
      dat voertuig naar aanleiding van de aanvraag van een keuringsrapport aan een keuring wordt onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: 4.6a
    text: |-
      [Artikel 72, eerste lid][ref1], van de wet geldt niet voor:

      a. bij ministeriële regeling aangewezen motorrijtuigen en aanhangwagens:

      1°. waarvoor een bijzonder kenteken als bedoeld in het [Kentekenreglement][ref2] is opgegeven,

      2°. die een keuring als bedoeld in de [artikelen 22][ref3] of [26][ref4] van de wet ondergaan en waarvoor een bij
      ministeriële regeling vastgesteld kenteken is opgegeven, of

      3°. op de dag waarop zij overeenkomstig de bij ministeriële regeling vastgestelde voorschriften worden onderzocht
      in verband met de afgifte of wijziging van een kenteken- of registratiebewijs of met de teruggave van het voor dat
      motorrijtuig afgegeven kentekenbewijs waarvan op grond van [artikel 60][ref5] van de wet de overgifte is gevorderd;

      b. bij ministeriële regeling aangewezen categorieën van rijdende werktuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006951
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.6a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0006951
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '26'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '60'
  - number: '4.7'
    text: |-
      1 Een motorrijtuig of een aanhangwagen mag gedurende twee maanden na het tijdstip waarop
      [artikel 72, eerste lid][ref1], van de wet voor dat voertuig gelding verkrijgt, op de weg staan zonder dat voor dat
      voertuig een keuringsbewijs is afgegeven waarvan de geldigheidsduur niet is verstreken.

      2 Een motorrijtuig of een aanhangwagen mag gedurende twee maanden na het tijdstip waarop de geldigheidsduur van een
      voor dat motorrijtuig of die aanhangwagen afgegeven keuringsbewijs verstrijkt, op de weg staan zonder dat voor dat
      motorrijtuig of die aanhangwagen een keuringsbewijs is afgegeven waarvan de geldigheidsduur niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '4.8'
    text: |-
      [Artikel 72, eerste lid][ref1], van de wet geldt niet voor motorrijtuigen en aanhangwagens, die behoren
      tot de bedrijfsvoorraad van een natuurlijke persoon of rechtspersoon aan wie een erkenning als bedoeld in
      [artikel 62][ref2] van de wet is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
  - number: '4.9'
    text: |-
      1 De aanvrager dient bij de aanvraag van een keuringsrapport deel I dan wel deel I A van het kentekenbewijs over te
      leggen, dat is afgegeven voor het motorrijtuig of de aanhangwagen waarop de aanvraag betrekking heeft.

      2 Degene bij wie de aanvraag is ingediend, geeft het deel I dan wel deel I A van het kentekenbewijs na behandeling
      van de aanvraag terug aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.9
  - number: '4.10'
    text: |-
      1 Degene die een keuringsrapport aanvraagt bij de Dienst Wegverkeer, stelt ter verkrijging daarvan het motorrijtuig
      of de aanhangwagen waarvoor de afgifte van het rapport wordt gevraagd, voor een keuring ter beschikking van een
      door de Dienst Wegverkeer met het verrichten van de keuring belaste functionaris, op een door deze bepaalde plaats
      en bepaald tijdstip.

      2 Degene die een keuringsrapport aanvraagt bij een ingevolge [artikel 84][ref1] van de wet erkende natuurlijke
      persoon of rechtspersoon, stelt ter verkrijging daarvan het motorrijtuig of de aanhangwagen waarvoor de afgifte
      van het rapport wordt gevraagd, voor een keuring ter beschikking van een door die persoon met het verrichten van de
      keuring belaste functionaris op een door deze bepaalde plaats en bepaald tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel84
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '84'
  - number: '4.11'
    text: |-
      1 De geldigheidsduur van een keuringsbewijs vangt aan met ingang van de dag van afgifte daarvan.

      2 Indien een keuringsbewijs wordt afgegeven binnen twee maanden vóór het tijdstip waarop
      [artikel 72, eerste lid][ref1], van de wet voor het betrokken voertuig gelding verkrijgt, vangt de geldigheidsduur
      van het keuringsbewijs aan met ingang van dat tijdstip, mits, voorzover [artikel 72, eerste lid][ref2], van de wet
      vóór dat tijdstip op grond van een ingevolge een andere wet dan de wet afgegeven keuringsbewijs niet geldt, dat
      document voorafgaande aan de behandeling van de aanvraag wordt overgelegd.

      3 Indien een keuringsbewijs wordt afgegeven binnen twee maanden vóór het tijdstip waarop de geldigheidsduur van
      een eerder voor het betrokken voertuig afgegeven keuringsbewijs verstrijkt, vangt de geldigheidsduur van het
      keuringsbewijs aan met ingang van dat tijdstip, mits vorenbedoeld eerder afgegeven keuringsbewijs voorafgaande aan
      de behandeling van de aanvraag wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '72'
  - number: 4.11a
    text: De afgifte van een keuringsbewijs geschiedt niet elektronisch.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.11a
  - number: '4.12'
    text: |-
      Het verzoek om herkeuring, bedoeld in [artikel 90][ref1] van de wet, wordt ingediend door op het keuringsrapport
      aan te tekenen dat om herkeuring wordt verzocht en deze aantekening te ondertekenen alsmede hiervan kennis te geven
      aan degene die het keuringsrapport heeft afgegeven. Laatstgenoemde doet hiervan onverwijld mededeling aan de Dienst
      Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel90
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '90'
  - number: '4.13'
    text: |-
      1 De verzoeker legt voorafgaande aan de herkeuring aan de deskundige die door de Dienst Wegverkeer is aangewezen om
      de herkeuring te verrichten, de volgende bescheiden over:

      a. deel I dan wel deel I A van het kentekenbewijs dat is afgegeven voor het motorrijtuig of de aanhangwagen, waarop
      het verzoek betrekking heeft, en

      b. het keuringsrapport.

      2 De in het eerste lid bedoelde deskundige geeft de daar bedoelde bescheiden na afloop van de herkeuring aan de
      verzoeker terug.

      3 De verzoeker mag bij de herkeuring aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.13
  - number: '4.14'
    text: |-
      De Dienst Wegverkeer doet, indien een beschikking tot weigering van de afgifte van een keuringsbewijs is afgegeven
      door een erkende natuurlijke persoon of rechtspersoon, aan deze afschrift toekomen van het na de herkeuring
      afgegeven keuringsrapport.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.14
  - number: '4.15'
    text: |-
      1 De verzoeker legt voorafgaande aan het in [artikel 91 van de wet][ref1] bedoelde deskundigenonderzoek aan de
      deskundige die door de Dienst Wegverkeer is aangewezen om het onderzoek te verrichten, de volgende bescheiden over:

      a. deel I dan wel deel I A van het kentekenbewijs dat is afgegeven voor het motorrijtuig of de aanhangwagen waarop
      het verzoek betrekking heeft, en

      b. het keuringsbewijs dat is afgegeven voor het motorrijtuig of de aanhangwagen waarop het verzoek betrekking
      heeft.

      2 De in het eerste lid bedoelde deskundige geeft de daar bedoelde bescheiden na afloop van het onderzoek aan de
      verzoeker terug, met dien verstande dat het keuringsbewijs niet wordt teruggegeven indien de geldigheid van het
      voor het voertuig afgegeven keuringsbewijs vervalt overeenkomstig [artikel 91, vierde lid, van de wet][ref2].

      3 De verzoeker mag bij het onderzoek aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel91
