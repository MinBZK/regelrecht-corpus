  - number: 5.7.56
    text: |-
      1 Het dimlicht van motorrijtuigen met beperkte snelheid moet zodanig zijn afgesteld dat bij controle met een
      verlichtingsscherm het geprojecteerde beeld, na fixatie van het scherm, voldoet aan de volgende eisen:

      a. het lichte vlak moet zich onder het donkere vlak bevinden;

      b. een duidelijke, geheel of ten dele horizontale scheidingslijn tussen licht en donker moet zichtbaar zijn;

      c. 1°. van de projectie van de gerichte stralenbundels van de beide dimlichten op een op enige afstand voor het
      voertuig verticaal of nagenoeg verticaal geplaatst scherm mag de scheidingslijn tussen het lichte en donkere vlak
      zich niet hoger bevinden dan de hoogte van het midden van het lichtdoorlatende gedeelte van het dimlicht boven de
      grond, verminderd met ten minste 0,005 m en ten hoogste 0,04 m voor elke meter afstand waarop het vlak zich voor
      het dimlicht bevindt; indien het dimlicht is geplaatst op een hoogte van meer dan 1,20 m wordt de waarde van 0,04 m
      verhoogd tot 0,06 m;

      2°. van de projectie van het extra dimlicht op een verlichtingsscherm op een afstand van 15 m van het licht, mag de
      horizontale scheidingslijn tussen het lichte en donkere vlak zich niet hoger bevinden dan de helft van de afstand
      tussen de grond en het midden van het licht;

      d. indien een ten dele horizontale scheidingslijn zichtbaar is:

      1°. moet het horizontale gedeelte van de scheidingslijn zich grotendeels links bevinden van de verticale hartlijn
      op het verlichtingsscherm;

      2°. mag het snijpunt van het horizontale en het niet-horizontale gedeelte maximaal 20 mm/m links van de
      geprojecteerde verticale hartlijn van de koplamp op het verlichtingsscherm vallen.

      2 Het voor het dimlicht bestemde deel van de reflector mag zijn oorspronkelijke reflecterende werking niet in
      ernstige mate hebben verloren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.56
  - number: 5.7.57
    text: |-
      1 Motorrijtuigen met beperkte snelheid mogen zijn voorzien van:

      a. twee of vier grote lichten;

      b. twee extra dimlichten;

      c. twee extra stadslichten;

      d. twee mistlichten aan de voorzijde van het voertuig;

      e. één of twee mistlichten aan de achterzijde van het voertuig;

      f. twee of vier parkeerlichten;

      g. één zijrichtingaanwijzer aan elke zijkant van het voertuig indien deze lichten niet reeds ingevolge
      [artikel 5.7.51][ref1] verplicht zijn;

      h. twee witte retroreflectoren aan de voorzijde van het voertuig;

      i. ambergele retroreflectoren aan de zijkanten van het voertuig, indien deze niet reeds ingevolge
      [artikel 5.7.51][ref2] verplicht zijn;

      j. één of twee achteruitrijlichten;

      k. vier markeringslichten indien het voertuig breder is dan 2,10 m;

      l. een richtlicht;

      m. een bermlicht aan de voorzijde van het voertuig;

      n. werklichten.

      2 Motorrijtuigen met beperkte snelheid mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de
      voorzijde, extra niet-driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.7.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.7.51
