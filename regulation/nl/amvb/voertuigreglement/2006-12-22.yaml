  - number: '2.3'
    text: |-
      In afwijking van het bepaalde in [artikel 24 van de wet][ref1] kunnen voertuigen op grond van een reeds verleende
      goedkeuring nog gedurende een periode van een jaar na het van kracht worden van zwaardere eisen, tot het verkeer op
      de weg worden toegelaten, mits deze goedkeuring:

      a. een ingevolge [richtlijn 70/156/EEG](31970L0156) verleende goedkeuring betreft en voldaan wordt aan de
      voorwaarden, genoemd in artikel 8, tweede lid, onderdeel b, van [richtlijn 70/156/EEG](31970L0156), en bijlage
      XII.B, eerste alinea, onder 1, bij [richtlijn 70/156/EEG](31970L0156);

      b. een ingevolge [richtlijn 2002/24/EG](32002L0024) verleende goedkeuring betreft en voldaan wordt aan de
      voorwaarden genoemd in artikel 16, eerste lid, van [richtlijn 2002/24/EG](32002L0024) en bijlage VIII, onder a, bij
      [richtlijn 2002/24/EG](32002L0024).

      c. een op basis van nationale eisen verleende goedkeuring betreft en voldaan wordt aan de door Onze Minister
      gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel24
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '24'
  - number: '2.4'
    text: |-
      De [afdelingen 4][ref1], [5][ref2] en [6 van hoofdstuk 3][ref3] zijn niet van toepassing op:

      a. motorrijtuigen met een door de constructie bepaalde maximum snelheid van ten hoogste 6 km/h;

      b. motorrijtuigen die bestemd zijn om door een voetganger te worden meegevoerd;

      c. motorrijtuigen die bestemd zijn voor gebruik door lichamelijk gehandicapten;

      d. landbouw- of bosbouwtrekkers en andere motorrijtuigen die bestemd zijn voor de landbouw of daarmee vergelijkbare
      doeleinden;

      e. motorrijtuigen met drie symmetrisch geplaatste wielen, waarvan een wiel aan de voorzijde en twee wielen aan de
      achterzijde, die voornamelijk zijn ontworpen voor gebruik buiten de wegen en voor vrijetijdsbesteding;

      f. onderdelen of technische eenheden van de in de onderdelen a tot en met e bedoelde voertuigen voor zover deze
      niet bestemd zijn om op motorfietsen, driewielige motorrijtuigen of bromfietsen gemonteerd te worden;

      g. fietsen met trapondersteuning, voorzien van een elektrische hulpmotor met een continu vermogen van maximaal
      0,25 kW waarvan de aandrijfkracht geleidelijk vermindert en ten slotte wordt onderbroken wanneer het voertuig een
      snelheid van 25 km/u bereikt, of eerder, indien de bestuurder ophoudt met trappen;

      h. onderdelen of technische eenheden van de in onderdeel g bedoelde voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel2.4
