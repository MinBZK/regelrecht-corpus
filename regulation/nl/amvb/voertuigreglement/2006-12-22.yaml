  - number: 5.2.62
    text: |-
      Het ingeschakeld zijn van het mistlicht of de mistlichten aan de achterzijde van het voertuig moet door middel van
      een controlelampje aan de bestuurder kenbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.62
  - number: 5.2.63
    text: |-
      Achteruitrijlichten van personenauto’s mogen alleen kunnen branden indien de achteruitversnelling van het voertuig
      is ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.63
  - number: 5.2.64
    text: |-
      1 Personenauto’s mogen, met uitzondering van grote lichten, niet zijn voorzien van verblindende verlichting.

      2 Personenauto’s mogen, met uitzondering van de richtingaanwijzers en de waarschuwingsknipperlichten, niet zijn
      voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.64
  - number: 5.2.65
    text: |-
      Personenauto's mogen, onverminderd het in de [artikelen 29][ref1] en [30 van het RVV 1990][ref2] bepaalde inzake
      zwaai- en knipperlichten, niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 5.2.51][ref3] en [5.2.57][ref4] is voorgeschreven of toegestaan.


