        afdeling: '2'
  - number: 3.2.52
    text: |-
      1 De mechanische koppelinrichting, indien aanwezig, van een personenauto die in gebruik is genomen na 31
      december 1995 en de bevestiging daarvan aan het voertuig moeten voldoen aan het bepaalde in [richtlijn 94/20/EG]
      (31994L0020).

      2 De mechanische koppelinrichting, indien aanwezig, van een personenauto die in gebruik is genomen voor 1
      januari 1996 moet voldoen aan het bepaalde in [richtlijn 94/20/EG](31994L0020) of behoren tot een door Onze
      Minister voor 1 januari 1995 goedgekeurd type, zijn voorzien van de door hem bij de goedkeuring voorgeschreven
      identificatiekenmerken en zijn bevestigd overeenkomstig de voorschriften van de fabrikant van de koppelinrichting.
      Indien de personenauto is voorzien van een kogelkoppeling, moet worden voldaan aan de door Onze Minister
      vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.52
  - number: 3.2.54
    text: |-
      1 Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een
      geluidssignaalinrichting die voldoet aan en is gemonteerd overeenkomstig het bepaalde in [richtlijn 70/388/EEG]
      (31970L0388).

      2 Personenauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien an ten minste een hoorn
      met vaste toonhoogte dan wel een samenstel van zodanige, tegelijk werkende hoorns. De geluidssterkte mag voor
      voertuigen die in gebruik zijn genomen voor 1 oktober 1971 niet minder bedragen dan 70 decibel en niet meer dan
      104 decibel, en voor voertuigen die in gebruik zijn genomen na 30 september 1971 niet minder dan 93 decibel en
      niet meer dan 104 decibel, te meten op de door Onze Minister vastgestelde wijze. De maximum geluidssterkte van 104
      decibel geldt niet voor hoorns die voldoen aan het bepaalde in [richtlijn 70/388/EEG](31970L0388).

      3 Personenauto’s mogen zijn voorzien van een geluidssignaalinrichting die andere weggebruikers er op attent maakt
      dat de achteruitversnelling van het voertuig is ingeschakeld, alsmede van een geluidssignaalinrichting die er toe
      strekt ongeoorloofd gebruik of diefstal van het voertuig te voorkomen.

      4 Personenauto’s mogen, onverminderd het in [artikel 29 van het RVV 1990][ref1] bepaalde inzake twee- en drietonige
      hoorns, niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld in het eerste tot en met het derde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.54
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
  - number: 3.2.55
    text: |-
      Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van inrichtingen ter
      bescherming tegen ongeoorloofd gebruik van het voertuig, welke inrichtingen voldoen aan het bepaalde in [richtlijn
      74/61/EEG](31974L0061).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.55
  - number: 3.2.56
    text: |-
      Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft de aanwezigheid van een
      sleepinrichting en de sterkte daarvan voldoen aan het bepaalde in [richtlijn 77/389/EEG](31977L0389).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.56
  - number: 3.2.62
    text: |-
      Personenauto’s die in gebruik worden genomen na 14 december 2008 voldoen wat betreft herbruikbaarheid,
      recycleerbaarheid en mogelijke nuttige toepassing aan richtlijn 2005/64/EG.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.62
  - number: 3.3.1
    text: Bedrijfsauto’s moeten voor toelating tot het verkeer op de weg voldoen aan de in deze afdeling vermelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.1
  - number: 3.3.1a
    text: |-
      1 Een T100-bus voldoet aan de in deze afdeling en aan de ingevolge [artikel 28, eerste lid, van de wet][ref1]
      gestelde eisen met betrekking tot de toelating tot het verkeer op de weg van bussen, alsmede aan de bij
      ministeriële regeling voor T100-bussen vastgestelde eisen.

      2 Indien een bus bij keuring door de Dienst Wegverkeer voldoet aan de in het eerste lid gestelde eisen wordt, op
      verzoek van degene aan wie het kenteken voor de desbetreffende bus is opgegeven, door de Dienst Wegverkeer hiervan
      onverwijld een aantekening gemaakt op het kentekenbewijs en in het kentekenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel28
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.1a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '28'
  - number: 3.3.2
    text: |-
      Bedrijfsauto’s moeten:

      a. van deugdelijke bouw en inrichting zijn;

      b. voldoen aan de in [hoofdstuk 5, afdeling 3][ref1], bedoelde permanente eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '5'
        afdeling: '3'
  - number: 3.3.3
    text: |-
      1 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een constructieplaat
      en een identificatienummer, die voldoen aan het bepaalde in [richtlijn 76/114/EEG](31976L0114).

      2 Bedrijfsauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van een identificatienummer
      dat:

      a. voor elke bedrijfsauto van hetzelfde merk verschillend is;

      b. uit ten minste 3 letters of cijfers bestaat, welke minimaal 7 mm hoog zijn;

      c. goed leesbaar op een vast voertuigdeel is ingeslagen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.3
  - number: 3.3.5
    text: Het hart van de opleggerkoppeling van trekkers mag niet achter de achterste as van het voertuig zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.5
  - number: 3.3.6
    text: |-
      1 Bedrijfsauto's, niet zijnde rijdende werktuigen, die in gebruik worden genomen na 31 mei 2002 moeten voor wat
      betreft afmetingen en wendbaarheid voldoen aan het bepaalde in [richtlijn 97/27/EG](31997L0027).

      2 Bedrijfsauto's, niet zijnde rijdende werktuigen, die in gebruik worden genomen na 21 juli 1999 doch voor 1
      juni 2002 moeten voor wat betreft afmetingen en wendbaarheid voldoen aan het bepaalde in [richtlijn 97/27/EG]
      (31997L0027), met uitzondering van het bepaalde in Bijlage I, onderdeel 7.6.2 van die richtlijn.

      3 Bedrijfsauto's die in gebruik zijn genomen voor 22 juli 1999 mogen:

      a. niet langer zijn dan 12,00 m, met uitzondering van bussen met twee assen die niet langer mogen zijn dan 13,50 m,
      bussen met meer dan twee assen die niet langer mogen zijn dan 15,00 m en gelede bussen die niet langer mogen zijn
      dan 18,75 m;

      b. niet breder zijn dan 2,55 m, met uitzondering van geconditioneerde voertuigen, die niet breder mogen zijn dan
      2,60 m; en

      c. niet hoger zijn dan 4,00 m.

      4 Bedrijfsauto's, niet zijnde rijdende werktuigen, die in gebruik zijn genomen voor 22 juli 1999, moeten
      rijdend naar beide zijden een volledige cirkel kunnen beschrijven binnen een ruimte die wordt begrensd door twee
      concentrische cirkels, waarvan de buitenste een straal van 12,50 m en de binnenste een straal van 5,30 m heeft,
      zonder dat een van de buitenpunten van het voertuig buiten de omtrek van de cirkels komt.

      5 Rijdende werktuigen mogen niet langer of breder zijn dan voor de bruikbaarheid als werktuig noodzakelijk is, met
      een maximum lengte van 20,00 m en een maximum breedte van 3,00 m.

      6 In afwijking van het eerste tot en met het derde lid mogen kermis- of circusvoertuigen niet langer zijn dan
      14,00 m.

      7 In de afmetingen, bedoeld in het eerste tot en met derde lid, zijn afneembare bovenbouwen en gestandaardiseerde
      laadstructuren begrepen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.6
  - number: 3.3.8
    text: |-
      Onze Minister kan bij ministeriële regeling voor rijdende werktuigen regels vaststellen met betrekking tot de
      maximum bestreken baan.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.8
  - number: 3.3.9
    text: |-
      1 De last onder de as of assen van bedrijfsauto’s die na 31 december 1994 in gebruik worden genomen, mag niet meer
      bedragen dan:

      a. de door de fabrikant van het voertuig opgegeven toegestane maximum last,

      b. voor enige as: 10 000 kg voor een niet-aangedreven as en 11 500 kg voor een aangedreven as,

      c. voor voertuigen met een asstel met twee niet-aangedreven assen:

      1°. indien de onderlinge afstand tussen de assen minder bedraagt dan 1,00 m, 11 000 kg te zamen,

      2°. indien de onderlinge afstand tussen de assen 1,00 m of meer bedraagt maar minder dan 1,30 m, 16 000 kg te
      zamen,

      3°. indien de onderlinge afstand tussen de assen 1,30 m of meer bedraagt maar minder dan 1,80 m, 18 000 kg te
      zamen,

      d. voor voertuigen met een asstel met twee assen waarvan 1 of 2 assen zijn aangedreven:

      1°. indien de onderlinge afstand tussen de assen minder bedraagt dan 1,00 m, 11 500 kg te zamen,

      2°. indien de onderlinge afstand tussen de assen 1,00 m of meer bedraagt maar minder dan 1,30 m, 16 000 kg te
      zamen,

      3°. indien de onderlinge afstand tussen de assen 1,30 m of meer bedraagt maar minder dan 1,80 m:

      a. 18 000 kg te zamen,

      b. 19 000 kg te zamen indien de aangedreven as is voorzien van banden in dubbele montage alsmede van gasvering of
      van in het kader van de Europese Gemeenschappen als gelijkwaardig aangemerkte vering,

      c. 19 000 kg te zamen indien beide aangedreven assen zijn voorzien van banden in dubbele montage, waarbij de last
      onder ieder der assen niet meer mag bedragen dan 9500 kg.

      2 In afwijking van het bepaalde in het eerste lid mag de last onder enige as van een rijdend werktuig niet meer
      bedragen dan:

      a. voor de bruikbaarheid als werktuig noodzakelijk is,

      b. de door de fabrikant van het voertuig opgegeven toegestane maximum last, en

      c. 12 000 kg per as.

      3 Onze Minister stelt regels vast met betrekking tot de toegestane maximum last onder de as of assen van
      bedrijfsauto’s die niet in het eerste lid zijn genoemd dan wel die voor 1 januari 1995 in gebruik zijn genomen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.9
  - number: 3.3.10
    text: |-
      1 De toegestane maximum massa van bedrijfsauto’s alsmede de toegestane maximum massa van samenstellen van
      bedrijfsauto en aanhangwagen mogen niet meer bedragen dan:

      a. 50 000 kg,

      b. de door de fabrikant van de bedrijfsauto voor de bedrijfsauto onderscheidenlijk voor het samenstel van
      voertuigen opgegeven toegestane maximum massa,

      c. vijf maal de toegestane maximum last onder de aangedreven as of assen,

      d. de ten aanzien van het remsysteem van het trekkend motorrijtuig toegestane maximum massa, en

      e. indien de bedrijfsauto na 30 juni 1967 in gebruik is genomen, het vermogen van de motor, vastgesteld volgens
      [richtlijn 80/1269/EEG](31980L1269), gedeeld door de factor 3,68 * 10-3kW/kg.

      2 De toegestane maximum massa van een door de bedrijfsauto voort te bewegen aanhangwagen mag niet meer bedragen
      dan:

      a. de daarvoor door de fabrikant van de bedrijfsauto opgegeven toegestane maximum massa,

      b. de daarvoor ten aanzien van de sterkte van de koppeling toegestane maximum massa,

      c. de daarvoor ten aanzien van de sterkte en de bevestiging van de delen van het chassisraam waaraan de koppeling
      is bevestigd, toegestane maximum massa,

      d. de daarvoor ten aanzien van het remsysteem van het trekkend motorrijtuig toegestane maximum massa,

      e. de helft van de ledige massa van de bedrijfsauto met een maximum van 750 kg indien het een ongeremde
      aanhangwagen betreft, en

      f. 3.500 kg indien het trekkende voertuig een bus betreft.

      3 In afwijking van het bepaalde in het tweede lid mag de toegestane maximum massa van een door een bedrijfsauto
      voort te bewegen geremde middenasaanhangwagen niet meer bedragen dan:

      a. 24 000 kg,

      b. de toegestane maximum massa van de bedrijfsauto, tenzij deze een toegestane maximum massa heeft van meer dan
      3 500 kg, of de bedrijfsauto als een terreinvoertuig overeenkomstig Bijlage II, deel A, punt 4, van [richtlijn
      70/156/EEG](31970L0156) kan worden aangemerkt,

      c. 1,5 maal de toegestane maximum massa van de bedrijfsauto, voorzover de bedrijfsauto als een terreinvoertuig
      overeenkomstig Bijlage II, deel A, punt 4, van [richtlijn 70/156/EEG](31970L0156) kan worden aangemerkt, met een
      maximum van 3 500 kg,

      d. 1,5 maal de toegestane maximum massa van de bedrijfsauto, indien de bedrijfsauto een toegestane maximum massa
      heeft van meer dan 3 500 kg.

      4 In afwijking van het tweede lid mag de toegestane maximum massa van een door een bedrijfsauto met een
      zelfdragende carrosserie en met een toegestane maximum massa van niet meer dan 3 500 kg voort te bewegen
      aanhangwagen niet meer bedragen dan de door de fabrikant van de bedrijfsauto opgegeven toegestane maximum massa.

      5 In afwijking van het bepaalde in het eerste lid mag de toegestane maximum massa van een rijdend werktuig alsmede
      van een samenstel van een rijdend werktuig en een aanhangwagen meer bedragen dan 50 000 kg doch niet meer dan voor
      de bruikbaarheid als werktuig noodzakelijk is en niet meer dan 60 000 kg.

      6 Bij bedrijfsauto’s die zodanig zijn ingericht dat buiten de normaal aangedreven as of assen nog een of meer
      assen kunnen worden aangedreven, worden voor de toepassing van het bepaalde in het eerste tot en met vierde lid
      deze incidenteel aangedreven as of assen als aangedreven as of assen aangemerkt mits de snelheid waarmee met
      ingeschakelde as of assen mag worden gereden, ten minste 60 km/h bedraagt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.10
  - number: 3.3.11
    text: |-
      1 De last onder de bestuurde as of assen van bedrijfsauto’s mag niet minder bedragen dan een vijfde deel van de
      massa van het voertuig.

      2 Bussen die na 12 februari 2004 in gebruik worden genomen, moeten met betrekking tot hun stabiliteit voldoen aan
      het bepaalde in bijlage I van [richtlijn 2001/85/EG](32001L0085).

      3 Gelede bussen die na 12 februari 2004 in gebruik worden genomen, moeten met betrekking tot richtingvastheid
      voldoen aan bijlage I van [richtlijn 2001/85/EG](32001L0085).

      4 Onze Minister stelt regels vast met betrekking tot de stabiliteit en de richtingvastheid als bedoeld in het
      tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.11
  - number: 3.3.12
    text: |-
      1 Bedrijfsauto’s die zijn voorzien van een brandstofreservoir, niet zijnde een reservoir voor al dan niet tot
      vloeistof verdicht gas, en die in gebruik worden genomen na 31 december 1994, moeten voldoen aan het bepaalde in
      [richtlijn 70/221/EEG](31970L0221).

      2 Van fabrieksmatig in serie vervaardigde complete bedrijfsauto’s die in gebruik zijn genomen na 30 september 1971
      doch voor 1 januari 1995, moeten het brandstofreservoir alsmede de plaats van het originele brandstofreservoir
      voldoen aan de door de fabrikant van het voertuig gestelde eisen.

      3 Van bedrijfsauto’s die in gebruik worden genomen na 30 september 1971 doch voor 1 januari 1995, mogen delen van
      het brandstofreservoir, met inbegrip van bevestigingssteunen en leidingen, in onbelaste toestand van het voertuig
      niet lager zijn gelegen dan 0,25 m boven het wegdek, tenzij de dragende delen van het chassis of de carrosserie
      lager zijn gelegen en voldoende bescherming bieden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.12
  - number: 3.3.13
    text: |-
      1 Het brandstofsysteem van bedrijfsauto’s voorzien van een LPG- of CNG-installatie moet voldoen aan de door Onze
      Minister gestelde eisen.

      2 Bedrijfsauto’s die elektrisch kunnen worden aangedreven, al dan niet in combinatie met een verbrandingsmotor,
      moeten voldoen aan de door Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.13
  - number: 3.3.14
    text: |-
      Bedrijfsauto’s die in gebruik worden genomen na 30 september 1974, moeten ter zake van elektromagnetische
      compatibiliteit voldoen aan het bepaalde in [richtlijn 72/245/EEG](31972L0245).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.14
  - number: 3.3.15
    text: |-
      Bedrijfsauto’s moeten voor wat betreft geluidproduktie voldoen aan het bepaalde in het
      [Besluit geluidproduktie motorvoertuigen][ref1] (*Stb.* 1981, 741).


      [ref1]: https://wetten.overheid.nl/BWBR0003464
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.15
    references:
      - id: ref1
        bwb_id: BWBR0003464
  - number: 3.3.16
    text: |-
      1 Bedrijfsauto’s met een verbrandingsmotor moeten voor wat betreft luchtverontreiniging voldoen aan het bepaalde in
      het [Besluit typekeuring motorrijtuigen luchtverontreiniging][ref1] (*Stb.* 1990, 393).

      2 Bedrijfsauto’s met een verbrandingsmotor, niet zijnde bussen, met een toegestane maximum massa van niet meer dan
      3500 kg en een referentiemassa als bedoeld in [richtlijn 80/1268/EEG](31980L1268)

      a. van niet meer dan 1305 kg die in gebruik zijn genomen na 31 december 2004, of na 31 december 2005 indien het een
      in fasen gebouwde bedrijfsauto betreft, of

      b. van meer dan 1305 kg die in gebruik zijn genomen na 31 december 2006, of na 31 december 2007 indien het een in
      fasen gebouwde bedrijfsauto betreft,

      c. voldoen wat betreft de wijze van meten van het brandstofverbruik aan [richtlijn 80/1268/EEG](31980L1268).

      3 Het tweede lid is niet van toepassing op bedrijfsauto’s met een verbrandingsmotor, niet zijnde bussen, met
      een toegestane maximum massa van niet meer dan 3500 kg die worden vervaardigd in aantallen die niet groter zijn
      dan tweeduizend per jaar wereldwijd en die zijn voorzien van een motortype waarvoor goedkeuring is verleend
      overeenkomstig [richtlijn 2005/55/EG](32005L0055).


      [ref1]: https://wetten.overheid.nl/BWBR0002890
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.16
    references:
      - id: ref1
        bwb_id: BWBR0002890
  - number: 3.3.17
    text: |-
      1 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een achteruitrij-
      inrichting en van een snelheidsmeter die voldoen aan het bepaalde in [richtlijn 75/443/EEG](31975L0443). Met een
      snelheidsmeter wordt gelijkgesteld een controleapparaat dat voldoet aan het bepaalde in [verordening 3821/85/EEG]
      (31985R3821).

      2 Bedrijfsauto’s die in gebruik zijn genomen na 30 juni 1967 doch voor 1 januari 1995, moeten zijn voorzien van een
      goed werkende snelheidsmeter, die ook bij nacht voor de bestuurder goed afleesbaar is.

      3 Bedrijfsauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van een inrichting om
      achteruit te rijden.

      4 De volgende categorieën motorrijtuigen zijn voorzien van een snelheidsbegrenzer die voldoet aan het bepaalde in
      [richtlijn 92/6/EEG](31992L0006) en in [richtlijn 92/24/EEG](31992L0024):

      a. bedrijfsauto’s met een toegestane maximum massa van meer dan 3.500 kg, doch niet meer dan 12.000 kg, die na 31
      december 2004 in gebruik zijn genomen;

      b. bedrijfsauto’s met een toegestane maximum massa van meer dan 12.000 kg, die na 31 december 1987 in gebruik zijn
      genomen;

      c. bussen met een toegestane maximum massa van niet meer dan 10.000 kg, die na 31 december 2004 in gebruik zijn
      genomen;

      d. bussen met een toegestane maximum massa van meer dan 10.000 kg, die na 31 december 1987 in gebruik zijn genomen.

      5 In afwijking van het vierde lid mag de snelheidsbegrenzer van een bedrijfsauto of bus, die na 31 december 1987
      doch vóór 1 januari 1994 in gebruik is genomen, behoren tot een door Onze Minister goedgekeurde soort.

      6 De in het vierde lid bedoelde verplichting geldt niet voor:

      a. motorrijtuigen als bedoeld in [artikel 29 van het Reglement verkeersregels en verkeerstekens 1990][ref1];

      b. motorrijtuigen waarvan, naar het oordeel van degene die met de afgifte van kentekenbewijzen is belast:

      1°. het gebruiksdoel zich verzet tegen het aanbrengen van een snelheidsbegrenzer;

      2°. de door de constructie bepaalde maximumsnelheid minder bedraagt dan de in [richtlijn 92/6/EEG](31992L0006) voor
      het desbetreffende motorrijtuig voorgeschreven afstelsnelheid;

      c. motorrijtuigen waarvan, naar het oordeel van degene die met de afgifte van kentekenbewijzen is belast, door de
      aanvrager van een kentekenbewijs aannemelijk wordt gemaakt dat het motorrijtuig gebruikt wordt:

      1°. door een openbare dienst, uitsluitend binnen de bebouwde kom;

      2°. voor wetenschappelijke proefnemingen op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.17
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
  - number: 3.3.18
    text: |-
      1 Bedrijfsauto’s moeten sneller kunnen rijden dan 25 km/h.

      2 Bedrijfsauto's met een verbrandingsmotor als bedoeld in Bijlage I van [richtlijn 80/1269/EEG](31980L1269) die in
      gebruik zijn genomen na 31 december 1994 moeten voor wat betreft de wijze van meten van het motorvermogen voldoen
      aan het bepaalde in deze richtlijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.18
  - number: 3.3.21
    text: |-
      1 De ashefinrichting van bedrijfsauto's die in gebruik worden genomen na 31 maart 1983 dient, voorzover deze
      inrichting werkt door het optrekken van de wielen van de bodem of het neerlaten van de wielen op de bodem en de
      bedrijfsauto is voorzien van een samenstel van assen, zodanig te zijn uitgevoerd dat deze inrichting automatisch
      buiten werking wordt gesteld niet later dan nadat de aslast van een van de op het rijvlak rustende assen van dat
      samenstel de grootste voor deze as toegestane waarde heeft bereikt.

      2 In afwijking van het eerste lid mogen bedrijfsauto's die in gebruik worden genomen na 21 juli 1999 zijn
      voorzien van een ashefinrichting die voldoet aan het bepaalde in Bijlage IV, onderdeel 3, van [richtlijn 97/27/
      EG](31997L0027).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.21
  - number: 3.3.23
    text: |-
      1 Bedrijfsauto’s die in gebruik worden genomen na 30 september 1971, moeten zijn voorzien van banden die voldoen
      aan het bepaalde in [richtlijn 92/23/EEG](31992L0023). In afwijking hiervan mogen bedrijfsauto’s die in gebruik
      zijn genomen na 30 september 1971 doch voor 1 januari 1995, zijn voorzien van banden waarvan de technische gegevens
      zijn opgenomen in een door Onze Minister vastgestelde tabel.

      2 Het draagvermogen van de banden moet voldoende zijn voor het door de fabrikant van het voertuig opgegeven
      draagvermogen van de as waarop zij zijn gemonteerd.

      3 De banden moeten geschikt zijn voor de door de fabrikant van het voertuig opgegeven maximum snelheid die met het
      voertuig kan worden bereikt bij het door de fabrikant opgegeven draagvermogen.

      4 Onze Minister stelt regels vast met betrekking tot de montage van banden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.23
  - number: 3.3.24
    text: |-
      1 Bedrijfsauto’s moeten zijn voorzien van een goed werkend veersysteem. Banden worden niet als deel van het
      veersysteem beschouwd.

      2 Bedrijfsauto's die zijn voorzien van gasvering, en bedrijfsauto's met een toegestane maximum massa van ten
      hoogste 3500 kg moeten zijn voorzien van deugdelijk bevestigde en goedwerkende schokdempers.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.24
  - number: 3.3.25
    text: |-
      1 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een stuurinrichting
      die voldoet aan het bepaalde in [richtlijn 70/311/EEG](31970L0311).

      2 Bedrijfsauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van een deugdelijke
      stuurinrichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.25
  - number: 3.3.26
    text: |-
      1 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een reminrichting die
      voldoet aan het bepaalde in [richtlijn 71/320/EEG](31971L0320).

      2 Bedrijfsauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van een reminrichting die
      voldoet aan de door Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.26
  - number: 3.3.27
    text: |-
      1 De deuren, sloten en scharnieren van bedrijfsauto's, in gebruik genomen na 31 december 1994 en bestemd voor het
      vervoer van goederen moeten voldoen aan het bepaalde in [richtlijn 70/387/EEG](31970L0387).

      2 Bestuurderscabines van bedrijfsauto’s die in gebruik zijn genomen na 30 september 1971 doch voor 1 januari 1995,
      moeten indien de cabine door middel van een schot van het overige deel van de carrosserie is gescheiden, zowel aan
      de linker- als aan de rechterzijde over een uitgang beschikken met zodanige minimumafmetingen dat daarin een ellips
      kan worden beschreven met een korte as van 0,44 m en een lange as van 0,64 m.

      3 Een van de in het tweede lid genoemde uitgangen mag zijn vervangen door een gelijkwaardige uitgang in het dak of
      in de achterwand van de cabine.

      4 Het eerste lid is van overeenkomstige toepassing op rijdende werktuigen.

      5 Bussen die in gebruik worden genomen na 12 februari 2004, moeten voorzien zijn van een carrosserie en inrichting
      welke voldoen aan hetgeen voor de onderscheiden klassen is bepaald in [richtlijn 2001/85/EG](32001L0085).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.27
  - number: 3.3.27a
    text: |-
      Bussen van klasse I die in gebruik worden genomen na 12 februari 2004 alsmede bussen van een andere klasse dan
      klasse I die na 12 februari 2004 in gebruik worden genomen en voorzien zijn van technische voorzieningen ter
      verbetering van de toegankelijkheid voor personen met een mobiliteitshandicap, moeten voldoen aan bijlage VII van
      [richtlijn 2001/85/EG](32001L0085).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.27a
  - number: 3.3.28
    text: |-
      Bussen moeten voor wat betreft het gezichtsveld van de bestuurder voldoen aan de door Onze Minister vastgestelde
      eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.28
  - number: 3.3.29
    text: |-
      1 De ruiten van bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten voldoen aan het bepaalde
      in [richtlijn 92/22/EEG](31992L0022).

      2 De voorruiten van bedrijfsauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten voldoen aan de door Onze
      Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.29
  - number: 3.3.30
    text: |-
      1 Bedrijfsauto’s met een voorruit moeten zijn voorzien van een goed werkende ruitenwisserinstallatie die de
      bestuurder voldoende uitzicht geeft.

      2 Bedrijfsauto's met een voorruit, die in gebruik worden genomen na 31 december 1994, met uitzondering van bussen,
      moeten zijn voorzien van een goed werkende ruitensproeierinstallatie.

      3 Bussen die na 30 juni 1985 in gebruik worden genomen, moeten zijn voorzien van een goed werkende
      ruitensproeierinstallatie.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.30
  - number: 3.3.31
    text: |-
      1 Bedrijfsauto's met een voorruit, die in gebruik worden genomen na 31 december 1994, met uitzondering van bussen,
      moeten zijn voorzien van een goed werkende installatie ter ontdooiing en ontwaseming van de voorruit.

      2 Bussen die na 30 juni 1985 in gebruik worden genomen, moeten zijn voorzien van een goed werkende installatie ter
      ontdooiing en ontwaseming van de voorruit.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.31
  - number: 3.3.32
    text: |-
      1 Bedrijfsauto’s, in gebruik genomen na 25 januari 2006, voldoen wat inrichtingen voor indirect zicht betreft aan
      [richtlijn 2003/97/EG](32003L0097).

      2 In afwijking van het eerste lid zijn de bepalingen voor vooruitkijkspiegels van toepassing met ingang van 26
      januari 2007.

      3 Bedrijfsauto’s, in gebruik genomen voor 26 januari 2006, zijn voorzien van een linkerbuitenspiegel en van een
      rechterbuitenspiegel.

      4 In afwijking van het derde lid mogen voor het vervoer van goederen bestemde bedrijfsauto’s met een toegestane
      maximum massa van niet meer dan 3500 kg, in gebruik genomen voor 26 januari 2006, zijn voorzien van een
      linkerbuitenspiegel en van een binnenspiegel indien met de binnenspiegel het vereiste gezichtsveld op de weg wordt
      verkregen.

      5 Voor het vervoer van goederen bestemde bedrijfsauto’s met een toegestane maximum massa van meer dan 7500 kg,
      alsmede rijdende werktuigen, in gebruik genomen voor 26 januari 2006, zijn voorzien van een trottoirspiegel mits
      deze zodanig op het voertuig kan worden aangebracht dat in elke stand geen enkel punt van de spiegel of van de
      steun waarop deze is bevestigd, zich op een hoogte van minder dan 2,00 m boven het wegdek bevindt bij een belasting
      van het voertuig die overeenkomt met de toegestane maximum massa.

      6 Voor het vervoer van goederen bestemde bedrijfsauto’s met een toegestane maximum massa van meer dan 3500 kg,
      in gebruik genomen voor 26 januari 2006, waarvan de linker- of rechterbuitenspiegel niet convex is, en voor het
      vervoer van goederen bestemde bedrijfsauto’s met een toegestane maximum massa van meer dan 7500 kg zijn voorzien
      van een breedtespiegel.

      7 Bedrijfsauto’s, in gebruik genomen voor 26 januari 2006, mogen met inachtneming van [richtlijn 71/127/EEG]
      (31971L0127) zijn voorzien van meer spiegels dan in de voorgaande leden genoemd.

      8 De spiegels van bedrijfsauto’s, in gebruik genomen na 31 december 1994 doch voor 26 januari 2006, voldoen voor
      wat betreft constructie, plaatsing, verstelbaarheid, afmetingen en gezichtsveld op de weg aan [richtlijn 71/127/
      EEG](31971L0127).

      9 De spiegels van bedrijfsauto’s, in gebruik genomen voor 1 januari 1995, voldoen voor wat betreft oppervlakte,
      plaatsing, verstelbaarheid en gezichtsveld aan de door Onze Minister vastgestelde eisen.

      10 In afwijking van het achtste lid mogen bedrijfsauto’s, in gebruik genomen na 14 oktober 2002 doch voor 26
      januari 2006, zijn voorzien van een breedtespiegel die voor wat betreft verstelbaarheid, afmetingen en gezichtsveld
      voldoet aan de door Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.32
  - number: 3.3.33
    text: |-
      Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft de identificatie van
      bedieningsorganen, verklikkerlichten en meters voldoen aan het bepaalde in [richtlijn 78/316/EEG](31978L0316).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.33
  - number: 3.3.34
    text: |-
      Bedrijfsauto's, in gebruik genomen na 8 mei 2004, voldoen wat verwarmingssystemen betreft aan [richtlijn 2001/56/
      EG](32001L0056).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.34
  - number: 3.3.35
    text: |-
      1 Bedrijfsauto’s met een toegestane maximum massa van niet meer dan 1500 kg, die in gebruik worden genomen na 31
      december 1994, moeten voor wat betreft de bescherming van de inzittenden bij een ongeval voldoen aan het bepaalde
      in [richtlijn 74/297/EEG](31974L0297).

      2 Bedrijfsauto’s die in gebruik zijn genomen na 31 december 1994, voldoen terzake van de inrichting, sterkte en
      bevestiging van zitplaatsen aan de volgende eisen:

      a. indien zij in gebruik zijn genomen voor 20 oktober 2006, voldoen zij voor wat betreft de naar voren gerichte
      zitplaatsen aan [richtlijn 74/408/EEG](31974L0408);

      b. indien zij in gebruik zijn genomen na 19 oktober 2006, voldoen zij voor wat betreft de zijdelings en de naar
      voren gerichte zitplaatsen aan [richtlijn 74/408/EEG](31974L0408).

      3 Bedrijfsauto’s bestemd voor het vervoer van goederen en met een toegestane maximum massa van niet meer dan 3500
      kg, die in gebruik zijn genomen na 30 september 1998, moeten voor wat betreft de bescherming van de inzittenden bij
      zijdelingse botsingen voldoen aan het bepaalde in [richtlijn 96/27/EG](31996L0027).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.35
  - number: 3.3.36
    text: |-
      1 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994 moeten zijn voorzien van bevestigingspunten voor
      autogordels overeenkomstig het bepaalde in [richtlijn 76/115/EEG](31976L0115).

      2 Bedrijfsauto’s die in gebruik zijn genomen na 1 januari 1971 doch voor 1 januari 1995 en die beurtelings voor
      het vervoer van personen of goederen kunnen worden ingericht, moeten zijn voorzien van bevestigingspunten voor
      autogordels. Deze bevestigingspunten moeten zijn aangebracht ten behoeve van het gebruik van autogordels op de
      zitplaats van de bestuurder en op naast deze plaats aanwezige zitplaatsen, voor zover die zitplaatsen aan een
      portier grenzen. De bevestigingspunten moeten voldoen aan en zijn aangebracht volgens de door Onze Minister
      vastgestelde eisen.

      3 Bedrijfsauto’s die in gebruik zijn genomen na 31 december 1989 doch voor 1 januari 1995 en die beurtelings voor
      het vervoer van personen of goederen kunnen worden ingericht, moeten tevens zijn voorzien van bevestigingspunten
      voor autogordels voor alle andere naar voren gerichte zitplaatsen dan in het tweede lid bedoeld. De
      bevestigingspunten moeten voldoen aan en zijn aangebracht volgens de door Onze Minister vastgestelde eisen.

      4 De aanwezigheid van de in het tweede en derde lid bedoelde bevestigingspunten is niet verplicht voor voertuigen
      die in gebruik zijn genomen voor 1 januari 1995, indien degene die met de afgifte van kentekenbewijzen is belast
      van oordeel is dat er in verband met de bouw of inrichting van het voertuig aanleiding bestaat de verplichting niet
      op het voertuig van toepassing te doen zijn.

      5 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van autogordels
      overeenkomstig het bepaalde in [richtlijn 77/541/EEG](31977L0541) voor die zitplaatsen die van bevestigingspunten
      voor autogordels zijn voorzien.

      6 Bedrijfsauto’s die in gebruik zijn genomen na 1 januari 1971 doch voor 1 januari 1995, waarin bevestigingspunten
      moeten zijn aangebracht ten behoeve van het gebruik van autogordels op de in het tweede en derde lid bedoelde
      zitplaatsen, moeten zijn voorzien van autogordels voor die zitplaatsen. De autogordels moeten voldoen aan de door
      Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.36
  - number: 3.3.37
    text: |-
      1 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft de naar buiten
      uitstekende delen die zich vóór de achterwand van de cabine bevinden, voldoen aan het bepaalde in [richtlijn
      92/114/EEG](31992L0114).

      2 Bedrijfsauto’s mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor
      andere weggebruikers kunnen opleveren.

      3 Onverminderd het bepaalde in het tweede lid moeten uitstekende delen van bedrijfsauto’s, die in geval van botsing
      het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn afgeschermd.

      4 Het bepaalde in het tweede en derde lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m boven
      het wegdek bevinden.

      5 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, met uitzondering van trekkers, moeten voor
      wat betreft de bescherming aan de achterzijde voldoen aan het bepaalde in [richtlijn 70/221/EEG](31970L0221). Deze
      bepaling geldt niet voor voertuigen waarvan het gebruik zich naar het oordeel van degene die met de afgifte van
      kentekenbewijzen is belast, verzet tegen de aanwezigheid van een beschermingsinrichting aan de achterzijde.

      6 Bedrijfsauto’s die in gebruik zijn genomen na 30 juni 1967 doch voor 1 januari 1995, met uitzondering van
      trekkers, moeten voor wat betreft de bescherming aan de achterzijde, behoudens indien zij hieromtrent voldoen aan
      het bepaalde in [richtlijn 70/221/EEG](31970L0221), voldoen aan de door Onze Minister vastgestelde eisen. Deze
      bepaling geldt niet voor voertuigen waarvan het gebruik zich naar het oordeel van degene die met de afgifte van
      kentekenbewijzen is belast, verzet tegen de aanwezigheid van een beschermingsinrichting aan de achterzijde.

      7 Bedrijfsauto’s met een toegestane maximum massa van meer dan 3500 kg, die in gebruik worden genomen na 31
      december 1994, moeten tussen de achterste vooras en de voorste achteras zijn voorzien van zijdelingse afscherming,
      die voldoet aan het bepaalde in [richtlijn 89/297/EEG](31989L0297), alsmede achter de voorste achteras zijn
      voorzien van zijdelingse afscherming die voldoet aan de door Onze Minister vastgestelde eisen.

      8 In afwijking van het zevende lid moeten bedrijfsauto's met een maximum toegestane massa van meer dan 3 500 kg en
      die zijn uitgerust met meer dan drie assen ter zake van de zijdelingse afscherming voldoen aan door Onze Minister
      vastgestelde eisen.

      9 Op bedrijfsauto’s met een toegestane maximum massa van niet meer dan 3500 kg, die in gebruik worden genomen na
      31 december 1994, is ten aanzien van de zijdelingse afscherming tussen de achterste vooras en de voorste achteras
      het in [richtlijn 89/297/EEG](31989L0297) voor bedrijfsauto’s met een toegestane maximum massa van meer dan 3500 kg
      doch niet meer dan 12 000 kg bepaalde van overeenkomstige toepassing. Zij moeten voorts achter de voorste achteras
      zijn voorzien van zijdelingse afscherming die voldoet aan de door Onze Minister vastgestelde eisen.

      10 Bedrijfsauto’s die in gebruik zijn genomen na 31 december 1969 doch voor 1 januari 1995, moeten zijn voorzien
      van zijdelingse afscherming, die voldoet aan de door Onze Minister vastgestelde eisen.

      11 De in het zevende, achtste, negende en tiende lid bedoelde verplichting tot zijdelingse afscherming geldt niet
      voor trekkers alsmede voor bedrijfsauto’s die zijn gebouwd voor speciale doeleinden en waarbij het om praktische
      redenen niet mogelijk is zijdelingse afscherming aan te brengen.

      12 De wielen van bedrijfsauto's in gebruik genomen na 31 december 1974 moeten zijn afgeschermd overeenkomstig de
      door Onze Minister vastgestelde eisen. De wielen van bedrijfsauto's die in gebruik zijn genomen voor 1 januari 1975
      moeten deugdelijk zijn afgeschermd.

      13 Bedrijfsauto's, niet zijnde bussen, met een toegestane maximum massa van meer dan 3500 kg, in gebruik genomen na
      9 augustus 2003, moeten zijn voorzien van een beschermingsinrichting aan de voorzijde tegen klemrijden die voldoet
      aan [richtlijn 2000/40/EG](32000L0040).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.37
  - number: 3.3.37a
    text: |-
      1 Bedrijfsauto’s die van een personenauto zijn afgeleid, met een toegestane maximum massa van niet meer dan 2500 kg
      die in gebruik worden genomen na 30 september 2005 moeten voor wat betreft de bescherming van voetgangers voor en
      bij een botsing voldoen aan punt 3.1 of 3.2 van bijlage I bij [richtlijn 2003/102/EG](32003L0102).

      2 Bedrijfsauto’s die van een personenauto zijn afgeleid, met een toegestane maximum massa van niet meer dan 2500
      kg die in gebruik worden genomen na 31 augustus 2010 moeten voor wat betreft de bescherming van voetgangers voor en
      bij een botsing voldoen aan punt 3.2 van bijlage I bij [richtlijn 2003/102/EG](32003L0102).

      3 Bedrijfsauto’s met een toegestane maximum massa van niet meer dan 3500 kg, niet zijnde bussen, die zijn voorzien
      van een frontbeschermingsinrichting en die in gebruik worden genomen na 24 november 2006, voldoen wat betreft de
      veiligheid van voetgangers en andere kwetsbare weggebruikers aan [richtlijn 2005/66/EG](32005L0066).

      4 Het eerste lid is niet van toepassing op voertuigen die, wat de essentiële aspecten van carrosseriebouw
      en ontwerp voor de A-stijlen betreft, niet verschillen van voertuigtypen waarvoor voor 1 oktober 2005 een
      typegoedkeuring is verleend.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.37a
  - number: 3.3.38
    text: De wielen onderscheidenlijk banden van bedrijfsauto’s mogen niet kunnen aanlopen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.38
  - number: 3.3.39
    text: |-
      Bedrijfsauto’s moeten aan de achterzijde zijn voorzien van een mogelijkheid tot bevestiging van een kentekenplaat.
      De bedoelde mogelijkheid moet voor bedrijfsauto’s die in gebruik worden genomen na 31 december 1994 voldoen aan het
      bepaalde in [richtlijn 70/222/EEG](31970L0222).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.39
  - number: 3.3.40
    text: |-
      1 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een installatie van
      verlichting en lichtsignalen alsmede van retroreflecterende voorzieningen overeenkomstig het bepaalde in [richtlijn
      76/756/EEG](31976L0756).

      2 In afwijking van het eerste lid moeten gelede bussen die in gebruik worden genomen na 31 december 1994 doch voor
      1 januari 2005, aan de achterzijde van het voertuig zijn voorzien van niet-driehoekige dan wel driehoekige rode
      retroreflectoren.

      3 Indien het als gevolg van de constructie van een rijdend werktuig niet mogelijk is de zijrichtingaanwijzers en
      de zijretroreflectoren aan te brengen op de ingevolge het bepaalde in het eerste lid voorgeschreven plaats, moeten
      deze lichten en retroreflectoren zo ver mogelijk naar voren tegen de zijkanten van het voertuig zijn geplaatst met
      inachtneming van de toegestane maximum hoogte waarop deze lichten en retroreflectoren mogen worden geplaatst.

      4 De in de lichtarmaturen toegepaste gloeilampen moeten voldoen aan het bepaalde in Bijlage VII behorende bij
      [Richtlijn 76/761/EEG](31976L0761).

      5 Het derde lid is niet van toepassing ten aanzien van lampen waarbij lichtarmatuur en lichtbron een gesloten
      eenheid vormen.

      6 Onze Minister stelt regels vast met betrekking tot de verlichting, lichtsignalen en retroreflecterende
      voorzieningen van bedrijfsauto’s die in gebruik zijn genomen voor 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.40
  - number: 3.3.41
    text: |-
      1 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van:

      a. grote lichten en dimlichten, die voldoen aan het bepaalde in [richtlijn 76/761/EEG](31976L0761);

      b. stadslichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758);

      c. richtingaanwijzers en waarschuwingsknipperlichten, die voldoen aan het bepaalde in [richtlijn 76/759/EEG]
      (31976L0759);

      d. zijrichtingaanwijzers die voldoen aan het bepaalde in [richtlijn 76/759/EEG](31976L0759);

      e. achterlichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758);

      f. remlichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758);

      g. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat, die
      voldoet aan het bepaalde in [richtlijn 76/760/EEG](31976L0760);

      h. niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig, die voldoen aan het bepaalde in
      [richtlijn 76/757/EEG](31976L0757);

      i. een of twee mistlichten aan de achterzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 77/538/
      EEG](31977L0538);

      j. een of twee achteruitrijlichten die voldoen aan het bepaalde in [richtlijn 77/539/EEG](31977L0539);

      k. markeringslichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758) indien het voertuig breder
      is dan 2,10 m;

      l. zijmarkeringslichten die voldoen aan het bepaalde in Bijlage IV behorende bij [Richtlijn 76/758/EEG]
      (31976L0758), indien het voertuig langer is dan 6,00 m; deze bepaling geldt niet voor chassiscabines;

      m. ambergele retroreflectoren aan de zijkanten van het voertuig, die voldoen aan het bepaalde in [richtlijn 76/757/
      EEG](31976L0757), indien het voertuig langer is dan 6,00 m;

      n. een markering aan de achterzijde van het voertuig, die voldoet aan de door Onze Minister vastgestelde eisen,
      indien de toegestane maximum massa van het voertuig meer bedraagt dan 3500 kg; deze eis geldt niet voor trekkers,
      voertuigen die zijn ingericht voor het vervoer van meer dan acht personen, de bestuurder daaronder niet begrepen,
      alsmede door Onze Minister aangewezen voertuigen waarvan de bouw, de inrichting of het gebruik zich verzet tegen
      het aanbrengen van de markering.

      2 In afwijking van het eerste lid, onderdeel h, moeten gelede bussen die in gebruik worden genomen na 31 december
      1994 doch voor 1 januari 2005, aan de achterzijde van het voertuig zijn voorzien van driehoekige dan wel niet-
      driehoekige rode retroreflectoren die voldoen aan het bepaalde in [richtlijn 76/757/EEG](31976L0757).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.41
  - number: 3.3.46
    text: |-
      1 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, mogen zijn voorzien van:

      a. mistlichten aan de voorzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 76/762/EEG]
      (31976L0762);

      b. parkeerlichten die voldoen aan het bepaalde in [richtlijn 77/540/EEG](31977L0540), indien het voertuig niet
      langer is dan 6,00 m en niet breder is dan 2,00 m;

      c. twee extra richtingaanwijzers en waarschuwingsknipperlichten, die voldoen aan het bepaalde in [richtlijn 76/759/
      EEG](31976L0759), aangebracht op het breedste punt zo hoog mogelijk aan de achterzijde van het voertuig;

      d. herhalingswaarschuwingsknipperlichten aan het meest naar achteren gelegen deel van de zich aan de zij- of
      achterkant van het voertuig bevindende laad- en losklep in horizontale stand, die voldoen aan het bepaalde in de
      onder *c* genoemde richtlijn, met uitzondering van de eisen ten aanzien van de minimum hoogte boven het wegdek;

      e. zijmarkeringslichten die voldoen aan het bepaalde in Bijlage IV behorende bij [Richtlijn 76/758/EEG]
      (31976L0758), indien het voertuig niet langer is dan 6,00 m of indien het een chassiscabine betreft;

      f. ambergele retroreflectoren aan de zijkanten van het voertuig, die voldoen aan het bepaalde in [richtlijn 76/757/
      EEG](31976L0757), indien het voertuig niet langer is dan 6,00 m;

      g. witte retroreflectoren aan de voorzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 76/757/
      EEG](31976L0757);

      h. markeringslichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758), indien het voertuig breder
      is dan 1,80 m, doch niet breder dan 2,10 m;

      i. een richtlicht;

      j. een bermlicht aan de voorzijde van het voertuig;

      k. werklichten;

      l. een derde remlicht dat voldoet aan het bepaalde in [richtlijn 76/756/EEG](31976L0756);

      m. dagrijlichten die voldoen aan het bepaalde in [richtlijn 76/756/EEG](31976L0756).

      2 Bedrijfsauto’s mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra niet-
      driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig, mits deze geen nadelige
      invloed hebben op de effectiviteit van de verplichte lichten en retroreflecterende voorzieningen.

      3 Bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg, mogen zijn voorzien van een lijnmarkering
      of een contourmarkering, die voldoet aan en is aangebracht overeenkomstig ECE-reglement 104. Binnen de
      contourmarkering aan de zijkant van het voertuig mogen retroreflecterende letters of afbeeldingen zijn
      aangebracht die voldoen aan ECE-reglement 104, voorzover deze geen nadelige invloed hebben op de effectiviteit
      van de contourmarkering en de verplichte lichten en retroreflecterende voorzieningen. In ieder geval mogen de
      retroreflecterende letters of afbeeldingen niet meer dan 1/3 deel van de totale oppervlakte binnen de omtrek van de
      contourmarkering uitmaken.

      4 Onze Minister draagt zorg voor een vertaling van ECE-reglement 104 en doet van de wijze van bekendmaking
      mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.46
  - number: 3.3.48
    text: |-
      1 De extra richtingaanwijzers en waarschuwingsknipperlichten mogen niet anders dan ambergeel stralen.

      2 Het richtlicht en het bermlicht mogen naar voren niet anders dan wit of geel stralen.

      3 Het derde remlicht mag niet anders dan rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.48
  - number: 3.3.50
    text: Bedrijfsauto's mogen, met uitzondering van grote lichten, niet zijn voorzien van verblindende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.50
  - number: 3.3.51
    text: |-
      Bedrijfsauto's mogen, onverminderd het in de [artikelen 29][ref1] en [30 van het RVV 1990][ref2] bepaalde inzake
      zwaai- en knipperlichten, niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 3.3.41][ref3] en [3.3.46][ref4] dan wel krachtens [artikel 3.3.40, vijfde lid][ref5], is voorgeschreven
      of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel3.3.41
      [ref4]: https://wetten.overheid.nl/BWBR0006746#Artikel3.3.46
      [ref5]: https://wetten.overheid.nl/BWBR0006746#Artikel3.3.40
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.51
