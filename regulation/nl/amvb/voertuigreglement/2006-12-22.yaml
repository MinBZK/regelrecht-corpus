  - number: 5.13.64
    text: |-
      Aanhangwagens mogen, met uitzondering van de richtingaanwijzers en de waarschuwingsknipperlichten, niet zijn
      voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.64
  - number: 5.13.65
    text: |-
      Aanhangwagens mogen niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in
      [de artikelen 5.13.51][ref1] en [5.13.57][ref2] zijn voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.13.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.13.57
