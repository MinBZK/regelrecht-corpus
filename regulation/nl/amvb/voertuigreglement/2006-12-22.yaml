      (31970L0156).

      2 Het eerste lid is niet van toepassing op nieuwe personenauto’s en bedrijfsauto’s waarvoor krachtens
      [artikel 2.2, eerste lid, onder a][ref1], goedkeuring is verleend en die voldoen aan de krachtens dat artikel
      gestelde eisen.


