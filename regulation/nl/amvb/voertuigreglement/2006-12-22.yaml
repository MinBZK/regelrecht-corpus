        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0006746
        artikel: 3.3.46
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0006746
        artikel: 3.3.40
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '3'
  - number: 3.3.52
    text: |-
      1 Indien de bedrijfsauto in gebruik genomen is na 30 juni 1967 en is voorzien van een mechanische koppelinrichting
      voor het koppelen van een aanhangwagen, moet deze inrichting:

      a. voldoen aan het bepaalde in [richtlijn 94/20/EG](31994L0020), of

      b. indien de bedrijfsauto voor 1 januari 2005 in gebruik is genomen, behoren tot een door Onze Minister
      voor 1 januari 1995 goedgekeurd type, zijn voorzien van de door hem in de goedkeuring voorgeschreven
      identificatiekenmerken, en zijn bevestigd overeenkomstig de voorschriften van de fabrikant van de koppelinrichting.
      Indien de bedrijfsauto is voorzien van een koppelingskogel, moet worden voldaan aan de door Onze Minister
      vastgestelde eisen.

      2 Indien de bedrijfsauto is voorzien van een inrichting tot het koppelen van een middenasaanhangwagen met een
      toegestane maximum massa van meer dan 12 000 kg, moet de afstand van het laagste punt van de koppeling van het
      trekkend voertuig tot het wegdek ten minste een vijfde deel bedragen van de afstand van het laagste punt van die
      koppeling tot het hart van de achterste as van het trekkend voertuig.

      3 Indien voor het koppelen van voertuigen bijzondere constructies aan de voertuigen worden toegepast, moeten deze
      constructies voldoen aan de door Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.52
  - number: 3.3.54
    text: |-
      1 Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een
      geluidssignaalinrichting overeenkomstig het bepaalde in [richtlijn 70/388/EEG](31970L0388).

      2 Bedrijfsauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van ten minste een hoorn
      met vaste toonhoogte dan wel een samenstel van zodanige, tegelijk werkende hoorns. De geluidssterkte mag voor
      voertuigen die in gebruik zijn genomen voor 1 oktober 1971 niet minder bedragen dan 70 decibel en niet meer dan
      104 decibel, en voor voertuigen die in gebruik zijn genomen na 30 september 1971 niet minder dan 93 decibel en niet
      meer dan 104 decibel, te meten op door Onze Minister vastgestelde wijze. De maximum geluidssterkte van 104 decibel
      geldt niet voor hoorns die voldoen aan het bepaalde in [richtlijn 70/388/EEG](31970L0388).

      3 Bedrijfsauto’s mogen zijn voorzien van een geluidssignaalinrichting die andere weggebruikers er op attent maakt
      dat de achteruitversnelling van het voertuig is ingeschakeld, alsmede van een geluidssignaalinrichting die er toe
      strekt ongeoorloofd gebruik of diefstal van het voertuig te voorkomen.

      4 Bedrijfsauto’s mogen, onverminderd het in [artikel 29 van het RVV 1990][ref1] bepaalde inzake twee- en drietonige
      hoorns, niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld in het eerste tot en met het derde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.54
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
  - number: 3.3.55
    text: |-
      1 Bedrijfsauto’s met een toegestane maximum massa van niet meer dan 3.500 kg, met uitzondering van bussen, die in
      gebruik zijn genomen na 31 december 1994, moeten zijn voorzien van inrichtingen ter bescherming tegen ongeoorloofd
      gebruik van het voertuig, welke inrichtingen voldoen aan het bepaalde in [richtlijn 74/61/EEG](31974L0061).

      2 Indien bedrijfsauto’s met een toegestane maximum massa van meer dan 3.500 kg die in gebruik zijn genomen na
      31 december 1994, zijn voorzien van inrichtingen ter bescherming tegen ongeoorloofd gebruik van het voertuig,
      moeten deze inrichtingen voldoen aan [richtlijn 74/61/EEG](31974L0061).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.55
  - number: 3.3.56
    text: |-
      Bedrijfsauto’s die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft de aanwezigheid van een
      sleepinrichting en de sterkte daarvan voldoen aan het bepaalde in [richtlijn 77/389/EEG](31977L0389).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.56
  - number: 3.3.58
    text: |-
      1 Bussen

      a. met een toegestane maximum massa van meer dan 5000 kg,

      b. bestemd voor het vervoer van meer dan 22 passagiers, de bestuurder daaronder niet begrepen,

      c. niet bestemd voor het vervoer van staande passagiers,

      d. niet bestemd voor vervoer binnen één gemeente, en

      e. in gebruik genomen na 25 oktober 1999, moeten voor wat betreft de verbrandingseigenschappen van bij de inwendige
      constructie gebruikte materialen voldoen aan het bepaalde in [richtlijn 95/28/EG](31995L0028).

      2 Bussen die na 12 februari 2004 in gebruik worden genomen, moeten voor wat betreft het gebruik van brandbaar
      materiaal binnen een straal van 100 mm van het uitlaatsysteem of een andere belangrijke warmtebron voldoen aan
      bijlage I van [richtlijn 2001/85/EG](32001L0085).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.58
  - number: 3.3.62
    text: |-
      1 Bedrijfsauto’s met een toegestane maximummassa van niet meer dan 3500 kg die in gebruik worden genomen na
      14 december 2008 voldoen wat betreft herbruikbaarheid, recycleerbaarheid en mogelijke nuttige toepassing aan
      richtlijn 2005/64/EG.

      2 Het eerste lid is niet van toepassing op de voertuigen, bedoeld in artikel 3, onderdeel b, van richtlijn 2005/64/
      EG.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.3.62
  - number: 3.4.1
    text: |-
      1 Motorfietsen moeten tot 9 november 2003 voor het verkrijgen van een typegoedkeuring als bedoeld in artikel 4,
      eerste lid, aanhef en onderdeel a, van [richtlijn 92/61/EEG](31992L0061) of [richtlijn 2002/24/EG](32002L0024) voor
      toelating tot het verkeer op de weg voldoen aan de in deze afdeling vermelde eisen.

      2 Motorfietsen moeten met ingang van 9 november 2003 voor het verkrijgen van een typegoedkeuring als bedoeld in
      artikel 4, eerste lid, aanhef en onderdeel a, van [richtlijn 2002/24/EG](32002L0024) voor toelating tot het verkeer
      op de weg voldoen aan de in deze afdeling vermelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.1
  - number: 3.4.2
    text: Motorfietsen moeten van deugdelijke bouw en inrichting zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.2
  - number: 3.4.3
    text: |-
      1 Motorfietsen die in gebruik worden genomen na 16 juni 1999 moeten zijn voorzien van een constructieplaat en een
      identificatienummer, die voldoen aan het bepaalde in [richtlijn 93/34/EEG](31993L0034).

      2 Motorfietsen die in gebruik zijn genomen voor 17 juni 1999 moeten zijn voorzien van:

      a. een identificatienummer dat:

      1°. voor elke motorfiets van hetzelfde merk verschillend is;

      2°. uit ten minste 3 letters of cijfers bestaat, welke minimaal 5 mm hoog zijn;

      3°. goed leesbaar op een vast voertuigdeel is ingeslagen, en

      b. een merk of een fabrieksaanduiding.

      3 Motorfietsen die zijn voorzien van een identificatienummer dat voldoet aan het bepaalde in [richtlijn 76/114/EEG]
      (31976L0114) voldoen aan het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.3
  - number: 3.4.5
    text: |-
      Motorfietsen die in gebruik worden genomen na 16 juni 1999 moeten ter zake van maatregelen tegen het onbevoegd
      opvoeren voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.5
  - number: 3.4.6
    text: |-
      1 Motorfietsen die in gebruik worden genomen na 31 oktober 1995, moeten voor wat betreft afmetingen en massa's
      voldoen aan het bepaalde in [richtlijn 93/93/EEG](31993L0093).

      2 Motorfietsen zonder zijspanwagen die in gebruik zijn genomen voor 1 november 1995, mogen niet breder zijn dan
      1,00 m.

      3 Motorfietsen met zijspanwagen die in gebruik zijn genomen voor 1 november 1995, mogen niet breder zijn dan 2,55
      m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.6
  - number: 3.4.9
    text: |-
      De toegestane maximum massa van motorfietsen mag niet meer bedragen dan de door de fabrikant van het voertuig
      opgegeven toegestane maximum massa.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.9
  - number: 3.4.12
    text: |-
      Motorfietsen die zijn voorzien van een brandstofreservoir, niet zijnde een reservoir voor al dan niet tot vloeistof
      verdicht gas, en die in gebruik worden genomen na 16 juni 1999, moeten voldoen aan het bepaalde in [richtlijn
      97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.12
  - number: 3.4.13
    text: |-
      Het brandstofsysteem van motorfietsen voorzien van een LPG- of CNG-installatie moet voldoen aan de door Onze
      Minister gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.13
  - number: 3.4.14
    text: |-
      Motorfietsen die in gebruik worden genomen na 16 juni 1999, moeten ter zake van elektromagnetische compatibiliteit
      voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.14
  - number: 3.4.15
    text: |-
      Motorfietsen moeten voor wat betreft geluidproductie voldoen aan het
      [Besluit geluidproduktie motorvoertuigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003464
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.15
    references:
      - id: ref1
        bwb_id: BWBR0003464
  - number: 3.4.16
    text: |-
      Motorfietsen met een verbrandingsmotor die in gebruik worden genomen na 16 juni 1999 moeten voor wat betreft
      luchtverontreiniging voldoen aan het [Besluit typekeuring motorrijtuigen luchtverontreiniging][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002890
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.16
    references:
      - id: ref1
        bwb_id: BWBR0002890
  - number: 3.4.17
    text: |-
      1 Motorfietsen die in gebruik worden genomen na 30 juni 2001 moeten zijn voorzien van een snelheidsmeter die
      voldoet aan het bepaalde in [richtlijn 2000/7/EG](32000L0007).

      2 Motorfietsen die in gebruik worden genomen na 26 november 1975 doch voor 17 juni 1999, moeten zijn voorzien van
      een goed werkende snelheidsmeter die ook bij nacht voor de bestuurder goed afleesbaar is.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.17
  - number: 3.4.18
    text: |-
      Motorfietsen die in gebruik worden genomen na 16 juni 1999 moeten voor wat betreft de wijze van meten van de door
      de constructie bepaalde maximum snelheid, het maximum koppel en het netto-maximum vermogen voldoen aan het bepaalde
      in [richtlijn 95/1/EG](31995L0001).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.18
  - number: 3.4.23
    text: |-
      1 Motorfietsen die in gebruik zijn genomen na 16 juni 1999 moeten zijn voorzien van luchtbanden die voldoen aan en
      zijn gemonteerd overeenkomstig het bepaalde in [richtlijn 97/24/EG](31997L0024).

      2 Motorfietsen die in gebruik zijn genomen voor 17 juni 1999 moeten zijn voorzien van banden waarvan de technische
      gegevens zijn opgenomen in een door Onze Minister vastgestelde tabel, met dien verstande dat in afwijking hiervan
      motorfietsen met zijspanwagen mogen zijn voorzien van banden die voldoen aan het bepaalde in [richtlijn 97/24/EG]
      (31997L0024), dan wel van banden overeenkomstig het bepaalde in [richtlijn 92/23/EEG](31992L0023).

      3 Het draagvermogen van de banden, bedoeld in het tweede lid, moet voldoende zijn voor het door de fabrikant van
      het voertuig opgegeven draagvermogen van de as waarop de band is gemonteerd.

      4 De banden, bedoeld in het tweede lid, moeten geschikt zijn voor de door de fabrikant opgegeven maximum snelheid
      die met het voertuig kan worden bereikt bij het door de fabrikant opgegeven draagvermogen.

      5 Onze Minister stelt regels vast met betrekking tot de montage van de banden, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.23
  - number: 3.4.26
    text: |-
      1 Motorfietsen die in gebruik worden genomen na 31 maart 1995, moeten zijn voorzien van een reminrichting die
      voldoet aan het bepaalde in [richtlijn 93/14/EG](31993L0014).

      2 Motorfietsen die in gebruik zijn genomen voor 1 april 1995, moeten zijn voorzien van een reminrichting die
      voldoet aan de door Onze Minister gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.26
  - number: 3.4.32
    text: |-
      1 Motorfietsen die in gebruik worden genomen na 16 juni 1999 moeten zijn voorzien van spiegels die voldoen aan en
      zijn gemonteerd overeenkomstig het bepaalde in [richtlijn 97/24/EG](31997L0024).

      2 Motorfietsen die in gebruik worden genomen na 26 november 1975 doch voor 17 juni 1999, moeten zijn voorzien van:

      a. een linkerbuitenspiegel;

      b. een rechterbuitenspiegel indien de maximum snelheid van het voertuig 100 km/h of meer bedraagt en het voertuig
      na 31 december 1994 in gebruik wordt genomen.

      3 De spiegels van motorfietsen die in gebruik worden genomen na 31 december 1994 doch voor 17 juni 1999, moeten
      voor wat betreft constructie, plaatsing, verstelbaarheid, afmetingen en gezichtsveld op de weg voldoen aan het
      bepaalde in [richtlijn 80/780/EEG](31980L0780).

      4 De linkerbuitenspiegel van motorfietsen die in gebruik zijn genomen na 26 november 1975 doch voor 1 januari 1995,
      moet voor wat betreft afmetingen, plaatsing, verstelbaarheid en gezichtsveld voldoen aan de door Onze Minister
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.32
  - number: 3.4.33
    text: |-
      Motorfietsen die in gebruik worden genomen na 31 mei 1995 moeten voor wat betreft de identificatie van
      bedieningsorganen, verklikkerlichten en meters voldoen aan het bepaalde in [richtlijn 93/29/EEG](31993L0029).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.33
  - number: 3.4.36
    text: |-
      Motorfietsen die in gebruik worden genomen na 31 mei 1995 moeten, indien een passagier kan worden vervoerd, zijn
      voorzien van een riem dan wel een of meer handgrepen voor deze passagier, welke moeten voldoen aan het bepaalde in
      [richtlijn 93/32/EEG](31993L0032).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.36
  - number: 3.4.37
    text: |-
      1 Motorfietsen die in gebruik worden genomen na 16 juni 1999, moeten voor wat betreft de naar buiten uitstekende
      delen voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).

      2 Motorfietsen die in gebruik zijn genomen voor 17 juni 1999 mogen geen scherpe delen hebben die in geval van
      botsing gevaar voor lichamelijk letsel voor andere weggebruikers kunnen opleveren.

      3 De wielen van motorfietsen die in gebruik zijn genomen voor 17 juni 1999 moeten deugdelijk zijn afgeschermd,
      overeenkomstig de door Onze Minister gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.37
  - number: 3.4.39
    text: |-
      1 Motorfietsen die in gebruik worden genomen na 31 oktober 1995, moeten voor wat betreft de plaats voor de montage
      van de achterste kentekenplaat voldoen aan het bepaalde in [richtlijn 93/92/EEG](31993L0092).

      2 Motorfietsen die in gebruik zijn genomen voor 1 november 1995, moeten aan de achterzijde zijn voorzien van een
      mogelijkheid tot bevestiging van een kentekenplaat.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.39
  - number: 3.4.40
    text: |-
      1 Motorfietsen die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft de installatie van
      verlichting en lichtsignalen voldoen aan het bepaalde in [richtlijn 93/92/EEG](31993L0092).

      2 De in de lichtarmaturen toegepaste gloeilampen moeten voldoen aan het bepaalde in [richtlijn 97/24/EG]
      (31997L0024).

      3 Het eerste lid is voor motorfietsen die in gebruik worden genomen na 31 december 1994 doch voor 1 november 1995,
      niet van toepassing ten aanzien van lampen waarbij lichtarmatuur en lichtbron een gesloten eenheid vormen.

      4 Onze Minister stelt regels vast met betrekking tot de verlichting, lichtsignalen en retroreflecterende
      voorzieningen van motorfietsen die in gebruik zijn genomen voor 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.40
  - number: 3.4.41
    text: |-
      1 Motorfietsen die in gebruik worden genomen na 16 juni 1999, moeten zijn voorzien van grote lichten, dimlichten,
      stadslichten, richtingaanwijzers, achterlichten, remlichten, een installatie ter verlichting van de aan de
      achterzijde van het voertuig aangebrachte kentekenplaat en niet-driehoekige rode retroreflectoren aan de
      achterzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).

      2 Motorfietsen die in gebruik worden genomen na 31 oktober 1995 doch voor 17 juni 1999, moeten zijn voorzien van:

      a. grote lichten en dimlichten, die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn
      76/761/EEG](31976L0761);

      b. stadslichten die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024);

      c. richtingaanwijzers die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn 76/759/EEG]
      (31976L0759);

      d. achterlichten die voldoen aan het bepaalde in[richtlijn 97/24/EG](31997L0024);

      e. remlichten die voldoen aan het bepaalde in[richtlijn 97/24/EG](31997L0024);

      f. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat, die
      voldoet aan het bepaalde in [richtlijn 97/24/EG](31997L0024);

      g. niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig, die voldoen aan het bepaalde in
      [richtlijn 97/24/EG](31997L0024).

      3 Motorfietsen die in gebruik worden genomen na 31 december 1994 doch voor 1 november 1995, moeten zijn voorzien
      van:

      a. een groot licht en een dimlicht, die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn
      76/761/EEG](31976L0761);

      b. richtingaanwijzers die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn 76/759/EEG]
      (31976L0759);

      c. een achterlicht dat voldoet aan het bepaalde in [richtlijn 97/24/EG](31997L0024);

      d. een remlicht dat voldoet aan het bepaalde in [richtlijn 97/24/EG](31997L0024);

      e. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat, die
      voldoet aan het bepaalde in [richtlijn 97/24/EG](31997L0024);

      f. een niet-driehoekige rode retroreflector aan de achterzijde van het voertuig, die voldoet aan het bepaalde in
      [richtlijn 76/757/EEG](31976L0757).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.41
  - number: 3.4.42
    text: |-
      Zijspanwagens, verbonden aan een motorfiets die in gebruik wordt genomen na 31 december 1994 doch voor 1 november
      1995, moeten zijn voorzien van:

      a. een achterlicht, aangebracht aan de uiterste buitenzijde op ten minste 0,35 m en ten hoogste 1,20 m boven het
      wegdek;

      b. een niet-driehoekige rode retroreflector, aan de achterzijde aangebracht aan de uiterste buitenzijde op ten
      minste 0,35 m en ten hoogste 1,20 m boven het wegdek, welke retroreflector voldoet aan het bepaalde in [richtlijn
      76/757/EEG](31976L0757).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.42
  - number: 3.4.46
    text: |-
      1 Motorfietsen die in gebruik worden genomen na 31 oktober 1995, mogen zijn voorzien van:

      a. mistlichten aan de voorzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024);

      b. mistlichten aan de achterzijde van het voertuig, die voldoen aan het bepaalde in [richtlijn 97/24/EG]
      (31997L0024);

      c. waarschuwingsknipperlichten die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn
      76/759/EEG](31976L0759);

      d. ambergele retroreflectoren aan de zijkanten van het voertuig die voldoen aan het bepaalde in [richtlijn 97/24/
      EG](31997L0024).

      2 Motorfietsen die in gebruik worden genomen na 31 december 1994 doch voor 1 november 1995, mogen zijn voorzien
      van:

      a. een stadslicht dat voldoet aan het bepaalde in [richtlijn 97/24/EG](31997L0024);

      b. een mistlicht aan de voorzijde van het voertuig, dat voldoet aan het bepaalde in [richtlijn 97/24/EG]
      (31997L0024);

      c. een mistlicht aan de achterzijde van het voertuig, dat voldoet aan het bepaalde in [richtlijn 97/24/EG]
      (31997L0024);

      d. waarschuwingsknipperlichten die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn
      76/759/EEG](31976L0759);

      e. een of twee parkeerlichten;

      f. ambergele retroreflectoren aan de zijkanten van het voertuig, die voldoen aan het bepaalde in [richtlijn 76/757/
      EEG](31976L0757);

      g. een witte retroreflector aan de voorzijde van het voertuig, aangebracht op ten minste 0,35 m en ten hoogste 0,90
      meter boven het wegdek;

      h. een richtlicht;

      i. een bermlicht aan de voorzijde van het voertuig;

      j. werklichten.

      3 De motorfietsen, bedoeld in het tweede lid, mogen zijn voorzien van extra witte retroreflecterende voorzieningen
      aan de voorzijde, extra rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig, mits deze
      geen nadelige invloed hebben op de effectiviteit van de verplichte lichten en retroreflecterende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.46
  - number: 3.4.47
    text: |-
      1 Zijspanwagens, verbonden aan een motorfiets die in gebruik wordt genomen na 31 december 1994 doch voor 1 november
      1995, mogen zijn voorzien van:

      a. een stadslicht, aangebracht aan de uiterste buitenzijde op ten minste 0,35 m en ten hoogste 1,20 m boven het
      wegdek;

      b. richtingaanwijzers en waarschuwingsknipperlichten, aangebracht aan de uiterste buitenzijde van de zijspanwagen
      op ten minste 0,35 m en ten hoogste 1,20 m boven het wegdek; de op de motorfiets aangebrachte richtingaanwijzers
      aan de zijde van de zijspanwagen mogen dan niet functioneren;

      c. een remlicht, aangebracht op ten minste 0,35 m en ten hoogste 1,20 m boven het wegdek;

      d. een witte retroreflector aan de voorzijde van de zijspanwagen, aangebracht op ten minste 0,35 m en ten hoogste
      0,90 m boven het wegdek;

      e. ambergele retroreflectoren, aangebracht aan elke zijkant van de zijspanwagen, op ten minste 0,35 m en ten
      hoogste 0,90 m boven het wegdek;

      f. een parkeerlicht aan de verst van de motorfiets verwijderde zijkant van de zijspanwagen.

      2 Zijspanwagens mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra rode
      aan de achterzijde en extra ambergele aan de zijkanten van het voertuig, mits deze geen nadelige invloed hebben op
      de effectiviteit van de verplichte lichten en retroreflecterende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.47
  - number: 3.4.48
    text: |-
      1 Het richtlicht, het bermlicht en het stadslicht mogen naar voren niet anders dan wit of geel stralen.

      2 De parkeerlichten mogen naar voren niet anders dan wit en naar achteren niet anders dan rood stralen.

      3 De richtingaanwijzers en waarschuwingsknipperlichten mogen naar voren en naar achteren niet anders dan ambergeel
      stralen.

      4 Het remlicht mag niet anders dan rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.48
  - number: 3.4.50
    text: Motorfietsen mogen, met uitzondering van groot licht, niet zijn voorzien van verblindende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.50
  - number: 3.4.51
    text: |-
      Motorfietsen mogen, onverminderd het in de [artikelen 29][ref1] en [30 van het RVV 1990][ref2] bepaalde
      inzake zwaai- en knipperlichten, niet zijn voorzien van meer lichten en retroreflecterende voorzieningen
      dan in de [artikelen 3.4.41][ref3], [3.4.42][ref4], [3.4.46][ref5] en [3.4.47][ref6] dan wel krachtens
      [artikel 3.4.40, vijfde lid][ref7], is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel3.4.41
      [ref4]: https://wetten.overheid.nl/BWBR0006746#Artikel3.4.42
      [ref5]: https://wetten.overheid.nl/BWBR0006746#Artikel3.4.46
      [ref6]: https://wetten.overheid.nl/BWBR0006746#Artikel3.4.47
      [ref7]: https://wetten.overheid.nl/BWBR0006746#Artikel3.4.40
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.51
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0006746
        artikel: 3.4.41
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0006746
        artikel: 3.4.42
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0006746
        artikel: 3.4.46
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0006746
        artikel: 3.4.47
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '4'
      - id: ref7
        bwb_id: BWBR0006746
        artikel: 3.4.40
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '4'
  - number: 3.4.52
    text: |-
      De mechanische koppelinrichting, indien aanwezig, van een motorfiets die in gebruik is genomen na 16 juni 1999 en
      de bevestiging daarvan aan het voertuig moeten voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.52
  - number: 3.4.54
    text: |-
      1 Motorfietsen die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een
      geluidssignaalinrichting die voldoet aan het bepaalde in [richtlijn 93/30/EEG](31993L0030).

      2 Motorfietsen die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van ten minste een hoorn
      met vaste toonhoogte dan wel een samenstel van zodanige, tegelijk werkende hoorns. De geluidssterkte mag voor
      voertuigen die in gebruik zijn genomen voor 1 oktober 1971 niet minder bedragen dan 70 decibel en niet meer dan
      104 decibel, en voor voertuigen die in gebruik zijn genomen na 30 september 1971 niet minder dan 93 decibel en
      niet meer dan 104 decibel, te meten op de door Onze Minister vastgestelde wijze. De maximum geluidssterkte van 104
      decibel geldt niet voor hoorns die voldoen aan het bepaalde in [richtlijn 70/388/EEG](31970L0388).

      3 Motorfietsen mogen zijn voorzien van een geluidssignaalinrichting die er toe strekt ongeoorloofd gebruik of
      diefstal van de motorfiets of de zijspanwagen te voorkomen, alsmede van een geluidssignaal dat de bestuurder
      kenbaar maakt dat de richtingaanwijzer is ingeschakeld.

      4 Motorfietsen mogen, onverminderd het in [artikel 29 van het RVV 1990][ref1] bepaalde inzake twee- en drietonige
      hoorns, niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld in het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.54
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
  - number: 3.4.55
    text: |-
      Motorfietsen die in gebruik worden genomen na 31 mei 1995 moeten zijn voorzien van een inrichting ter bescherming
      tegen ongeoorloofd gebruik van het voertuig, welke inrichting voldoet aan het bepaalde in [richtlijn 93/33/EEG]
      (31993L0033).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.55
  - number: 3.4.57
    text: |-
      Motorfietsen op twee wielen, die in gebruik worden genomen na 31 mei 1995 moeten zijn voorzien van een standaard
      die voldoet aan het bepaalde in [richtlijn 93/31/EEG](31993L0031).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.4.57
  - number: 3.5.1
    text: |-
      1 Driewielige motorrijtuigen moeten tot 9 november 2003 voor het verkrijgen van een typegoedkeuring als bedoeld
      in artikel 4, eerste lid, aanhef en onderdeel a, van [richtlijn 92/61/EEG](31992L0061) of [richtlijn 2002/24/EG]
      (32002L0024) voor toelating tot het verkeer op de weg voldoen aan de in deze afdeling vermelde eisen.

      2 Driewielige motorrijtuigen moeten met ingang van 9 november 2003 voor het verkrijgen van een typegoedkeuring als
      bedoeld in artikel 4, eerste lid, aanhef en onderdeel a, van [richtlijn 2002/24/EG](32002L0024) voor toelating tot
      het verkeer op de weg voldoen aan de in deze afdeling vermelde eisen.

      3 In afwijking van het eerste en tweede lid zijn op driewielige motorrijtuigen met een toegestane maximum massa
      van meer dan 3500 kg, die in gebruik zijn genomen vóór 1 november 1995, de in [afdeling 3 van dit hoofdstuk][ref1]
      gestelde eisen van overeenkomstige toepassing.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de in het derde lid
      bedoelde driewielige motorrijtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '3'
        afdeling: '3'
  - number: 3.5.2
    text: Driewielige motorrijtuigen moeten van deugdelijke bouw en inrichting zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.2
  - number: 3.5.3
    text: |-
      1 Driewielige motorrijtuigen die in gebruik worden genomen na 16 juni 1999, moeten zijn voorzien van een
      constructieplaat en een identificatienummer, die voldoen aan het bepaalde in [richtlijn 93/34/EEG](31993L0034).

      2 Driewielige motorrijtuigen die in gebruik zijn genomen voor 17 juni 1999 moeten zijn voorzien van:

      a. een identificatienummer dat:

      1°. voor elk motorrijtuig van hetzelfde merk verschillend is;

      2°. uit ten minste 3 letters of cijfers bestaat, welke minimaal 5 mm hoog zijn;

      3°. goed leesbaar op een vast voertuigdeel is ingeslagen, en

      b. een merk of een fabrieksaanduiding.

      3 Driewielige motorrijtuigen die voorzien zijn van een identificatienummer dat voldoet aan het bepaalde in
      [richtlijn 76/114/EEG](31976L0114) voldoen aan het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.3
  - number: 3.5.6
    text: |-
      1 Driewielige motorrijtuigen die in gebruik worden genomen na 31 oktober 1995, moeten voor wat betreft afmetingen
      en massa's voldoen aan het bepaalde in [richtlijn 93/93/EEG](31993L0093).

      2 Driewielige motorrijtuigen die in gebruik zijn genomen voor 1 november 1995, mogen:

      a. niet langer zijn dan 12,00 m;

      b. niet breder zijn dan 2,55 m;

      c. niet hoger zijn dan 4,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.6
  - number: 3.5.7
    text: |-
      De afstand van de voorzijde van driewielige motorrijtuigen die in gebruik zijn genomen voor 1 november 1995, tot
      het hart van het stuur mag niet meer bedragen dan 3,50 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.7
  - number: 3.5.9
    text: |-
      1 De last onder enige as van driewielige motorrijtuigen die in gebruik zijn genomen voor 1 november 1995, mag niet
      meer bedragen dan:

      a. 2800 kg, en

      b. de door de fabrikant van het voertuig opgegeven toegestane maximum last.

      2 De toegestane maximum massa van driewielige motorrijtuigen die in gebruik zijn genomen voor 1 november 1995, mag
      niet meer bedragen dan:

      a. 3500 kg, en

      b. de door de fabrikant van het voertuig opgegeven toegestane maximum massa.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.9
  - number: 3.5.10
    text: |-
      1 De toegestane maximum massa van samenstellen van een driewielig motorrijtuig dat in gebruik is genomen voor 1
      november 1995, en een aanhangwagen mag niet meer bedragen dan de door de fabrikant van het driewielig motorrijtuig
      voor het samenstel van voertuigen opgegeven toegestane maximum massa.

      2 De toegestane maximum massa van een ongeremde aanhangwagen achter een driewielig motorrijtuig dat in gebruik is
      genomen voor 1 november 1995, mag niet meer bedragen dan:

      a. de door de fabrikant van het driewielig motorrijtuig opgegeven toegestane maximum massa van de aanhangwagen,

      b. de helft van de ledige massa van dat driewielig motorrijtuig, en

      c. 750 kg.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.10
  - number: 3.5.11
    text: |-
      De last onder de bestuurde as van driewielige motorrijtuigen die in gebruik zijn genomen voor 1 november 1995, mag
      niet minder bedragen dan een vijfde deel van de massa van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.11
  - number: 3.5.12
    text: |-
      1 Driewielige motorrijtuigen die zijn voorzien van een brandstofreservoir, niet zijnde een reservoir voor al dan
      niet tot vloeistof verdicht gas, en die in gebruik worden genomen na 16 juni 1999, moeten voldoen aan het bepaalde
      in [richtlijn 97/24/EG](31997L0024).

      2 Van driewielige motorrijtuigen die in gebruik zijn genomen voor 17 juni 1999 mogen delen van het
      brandstofreservoir, met inbegrip van bevestigingssteunen en leidingen, in onbelaste toestand van het voertuig
      niet lager zijn gelegen dan 0,25 m boven het wegdek, tenzij de dragende delen van het chassis, het frame of de
      carrosserie lager zijn gelegen en voldoende bescherming bieden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.12
  - number: 3.5.13
    text: |-
      1 Het brandstofsysteem van driewielige motorrijtuigen voorzien van een LPG- of CNG-installatie moet voldoen aan de
      door Onze Minister gestelde eisen.

      2 Driewielige motorrijtuigen die elektrisch kunnen worden aangedreven, al dan niet in combinatie met een
      verbrandingsmotor, moeten voldoen aan de door Onze Minister gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.13
  - number: 3.5.14
    text: |-
      Driewielige motorrijtuigen die in gebruik worden genomen na 16 juni 1999, moeten ter zake van elektromagnetische
      compatibiliteit voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.14
  - number: 3.5.15
    text: |-
      Driewielige motorrijtuigen moeten voor wat betreft geluidproductie voldoen aan het
      [Besluit geluidproduktie motorvoertuigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003464
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.15
    references:
      - id: ref1
        bwb_id: BWBR0003464
  - number: 3.5.16
    text: |-
      Driewielige motorrijtuigen met een verbrandingsmotor die in gebruik worden genomen na 16 juni 1999 moeten voor wat
      betreft luchtverontreiniging voldoen aan het [Besluit typekeuring motorrijtuigen luchtverontreiniging][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002890
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.16
    references:
      - id: ref1
        bwb_id: BWBR0002890
  - number: 3.5.17
    text: |-
      1 Driewielige motorrijtuigen die in gebruik worden genomen na 30 juni 2001 moeten zijn voorzien van een
      snelheidmeter die voldoet aan het bepaalde in [richtlijn 2000/7/EG](32000L0007).

      2 Driewielige motorrijtuigen die in gebruik worden genomen na 26 november 1975 doch voor 17 juni 1999, moeten zijn
      voorzien van een snelheidsmeter die ook bij nacht voor de bestuurder goed afleesbaar is.

      3 Driewielige motorrijtuigen die in gebruik zijn genomen voor 17 juni 1999 met een toegestane maximum massa van
      meer dan 1000 kg, dan wel met een ledige massa van meer dan 400 kg, moeten zijn voorzien van een inrichting om
      achteruit te rijden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.17
  - number: 3.5.18
    text: |-
      Driewielige motorrijtuigen die in gebruik worden genomen na 16 juni 1999 moeten voor wat betreft de wijze van meten
      van de door de constructie bepaalde maximum snelheid, het maximum koppel en het netto-maximum vermogen voldoen aan
      het bepaalde in [richtlijn 95/1/EG](31995L0001).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.18
  - number: 3.5.23
    text: |-
      1 Driewielige motorrijtuigen die in gebruik zijn genomen na 16 juni 1999 moeten zijn voorzien van luchtbanden die
      voldoen aan en zijn gemonteerd overeenkomstig het bepaalde in [richtlijn 97/24/EG](31997L0024).

      2 Driewielige motorrijtuigen die in gebruik zijn genomen voor 17 juni 1999 doch na 30 september 1971, moeten zijn
      voorzien van banden overeenkomstig het bepaalde in [richtlijn 92/23/EEG](31992L0023) of van banden die voldoen
      aan het bepaalde in [richtlijn 97/24/EG](31997L0024), met dien verstande dat in afwijking hiervan driewielige
      motorrijtuigen die in gebruik zijn genomen na 30 september 1971 doch voor 1 januari 1995, mogen zijn voorzien van
      banden waarvan de technische gegevens zijn opgenomen in een door Onze Minister vastgestelde tabel.

      3 Het draagvermogen van de banden van driewielige motorrijtuigen als bedoeld in het tweede lid moet voldoende zijn
      voor het door de fabrikant van het voertuig opgegeven draagvermogen van de as waarop zij zijn gemonteerd.

      4 De banden, bedoeld in het tweede lid, moeten geschikt zijn voor de door de fabrikant opgegeven maximum snelheid
      die met het voertuig kan worden bereikt bij het door de fabrikant opgegeven draagvermogen.

      5 Onze Minister stelt regels vast met betrekking tot de montage van de banden, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.23
  - number: 3.5.26
    text: |-
      1 Driewielige motorrijtuigen die in gebruik worden genomen na 31 maart 1995, moeten zijn voorzien van een
      reminrichting die voldoet aan het bepaalde in [richtlijn 93/14/EG](31993L0014).

      2 Driewielige motorrijtuigen die in gebruik zijn genomen voor 1 april 1995, moeten zijn voorzien van een
      reminrichting die voldoet aan de door Onze Minister gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.26
  - number: 3.5.29
    text: |-
      1 De ruiten van driewielige motorrijtuigen met een carrosserie die in gebruik worden genomen na 16 juni 1999 moeten
      voldoen aan en zijn gemonteerd overeenkomstig het bepaalde in [richtlijn 97/24/EG](31997L0024).

      2 De ruiten van driewielige motorrijtuigen die in gebruik worden genomen na 31 december 1994 doch voor 17 juni
      1999, moeten voldoen aan het bepaalde in [richtlijn 92/22/EEG](31992L0022).

      3 De voorruiten van driewielige motorrijtuigen die in gebruik zijn genomen voor 1 januari 1995, moeten voldoen aan
      de door Onze Minister gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.29
  - number: 3.5.30
    text: |-
      1 Driewielige motorrijtuigen met een voorruit, die in gebruik worden genomen na 16 juni 1999, moeten zijn voorzien
      van een ruitenwisserinstallatie en van een ruitensproeierinstallatie, die voldoen aan het bepaalde in [richtlijn
      97/24/EG](31997L0024).

      2 Driewielige motorrijtuigen met een voorruit, met een ledige massa van niet meer dan 400 kg, die in gebruik
      worden genomen na 26 november 1975 doch voor 17 juni 1999, alsmede driewielige motorrijtuigen met een voorruit,
      met een ledige massa van meer dan 400 kg, moeten zijn voorzien van een goed werkende ruitenwisserinstallatie die de
      bestuurder voldoende uitzicht geeft.

      3 Driewielige motorrijtuigen met een voorruit, die in gebruik worden genomen na 31 december 1994 doch voor 17 juni
      1999, moeten zijn voorzien van een goed werkende ruitensproeierinstallatie.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.30
  - number: 3.5.31
    text: |-
      1 Driewielige motorrijtuigen met een voorruit, die in gebruik worden genomen na 16 juni 1999, moeten zijn voorzien
      van een goed werkende installatie ter ontdooiing en ontwaseming van de voorruit, die voldoet aan het bepaalde in
      [richtlijn 97/24/EG](31997L0024).

      2 Driewielige motorrijtuigen met een voorruit en met een gesloten carrosserie, die in gebruik worden genomen na
      31 december 1994 doch voor 17 juni 1999, moeten zijn voorzien van een goed werkende installatie ter ontdooiing en
      ontwaseming van de voorruit.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.31
  - number: 3.5.32
    text: |-
      1 Driewielige motorrijtuigen die in gebruik worden genomen na 16 juni 1999 moeten zijn voorzien van spiegels die
      voldoen aan en zijn gemonteerd overeenkomstig het bepaalde in [richtlijn 97/24/EG](31997L0024).

      2 Driewielige motorrijtuigen die in gebruik zijn genomen voor 17 juni 1999 moeten zijn voorzien van een
      linkerbuitenspiegel. Deze eis geldt niet voor voertuigen:

      a. waarvan de ledige massa niet meer bedraagt dan 400 kg,

      b. waarbij de bestuurder een zodanige plaats inneemt dat hij van zijn zitplaats het achter hem gelegen weggedeelte
      kan overzien, en

      c. die in gebruik zijn genomen vóór 27 november 1975.

      3 Driewielige motorrijtuigen die in gebruik zijn genomen voor 17 juni 1999 met een gesloten carrosserie moeten
      zijn voorzien van een binnenspiegel. Deze eis geldt niet voor voertuigen die voldoen aan de in het tweede lid,
      onderdelen a en b, genoemde voorwaarden.

      4 Driewielige motorrijtuigen die in gebruik zijn genomen voor 17 juni 1999 moeten zijn voorzien van een
      rechterbuitenspiegel indien met de verplichte binnenspiegel het vereiste gezichtsveld op de weg niet wordt
      verkregen. Indien de binnenspiegel geen zicht naar achteren mogelijk maakt, behoeft deze niet aanwezig te zijn.

      5 De spiegels van driewielige motorrijtuigen als bedoeld in het tweede, derde en vierde lid moeten voor wat betreft
      oppervlakte, plaatsing, verstelbaarheid en gezichtsveld voldoen aan de door Onze Minister gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.32
  - number: 3.5.33
    text: |-
      Driewielige motorrijtuigen die in gebruik worden genomen na 31 mei 1995, moeten voor wat betreft de identificatie
      van bedieningsorganen, verklikkerlichten en meters voldoen aan het bepaalde in [richtlijn 93/29/EEG](31993L0029).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.33
  - number: 3.5.36
    text: |-
      1 Driewielige motorrijtuigen met een carrosserie die in gebruik worden genomen na 16 juni 1999 moeten zijn voorzien
      van bevestigingspunten voor autogordels overeenkomstig het bepaalde in [richtlijn 97/24/EG](31997L0024).

      2 Driewielige motorrijtuigen met een gesloten carrosserie, die in gebruik worden genomen na 31 december 1994
      doch voor 17 juni 1999, moeten zijn voorzien van bevestigingspunten voor autogordels overeenkomstig de eisen in
      [richtlijn 76/115/EEG](31976L0115).

      3 Driewielige motorrijtuigen die in gebruik zijn genomen na 1 januari 1971 doch voor 1 januari 1995 en die zijn
      ingericht voor het vervoer van personen of die beurtelings voor het vervoer van personen of goederen kunnen worden
      ingericht, moeten zijn voorzien van bevestigingspunten voor autogordels. Deze bevestigingspunten moeten zijn
      aangebracht ten behoeve van het gebruik van autogordels op de zitplaats van de bestuurder en op naast deze plaats
      aanwezige zitplaatsen, voor zover die zitplaatsen aan een portier grenzen. De bevestigingspunten moeten voldoen aan
      en zijn aangebracht volgens de door Onze Minister gestelde eisen.

      4 Driewielige motorrijtuigen die in gebruik zijn genomen na 31 december 1989 doch voor 1 januari 1995 en die zijn
      ingericht voor het vervoer van personen of die beurtelings voor het vervoer van personen of goederen kunnen worden
      ingericht, moeten tevens zijn voorzien van bevestigingspunten voor autogordels voor alle andere naar voren gerichte
      zitplaatsen dan in het derde lid bedoeld. De bevestigingspunten moeten voldoen aan en zijn aangebracht volgens de
      door Onze Minister gestelde eisen.

      5 De aanwezigheid van de in het derde en vierde lid bedoelde bevestigingspunten is niet verplicht voor voertuigen
      die in gebruik zijn genomen voor 1 januari 1995, indien degene die met de afgifte van kentekenbewijzen is belast
      van oordeel is dat er in verband met de bouw of inrichting van het voertuig aanleiding bestaat de verplichting niet
      op het voertuig van toepassing te doen zijn.

      6 Driewielige motorrijtuigen met een carrosserie die in gebruik worden genomen na 16 juni 1999 moeten zijn voorzien
      van autogordels overeenkomstig het bepaalde in [richtlijn 97/24/EG](31997L0024).

      7 Driewielige motorrijtuigen met een gesloten carrosserie die in gebruik worden genomen na 31 december 1994
      doch voor 17 juni 1999, moeten zijn voorzien van autogordels overeenkomstig de eisen in [richtlijn 77/541/EEG]
      (31977L0541) voor die zitplaatsen die van bevestigingspunten voor autogordels zijn voorzien.

      8 Driewielige motorrijtuigen die in gebruik zijn genomen na 1 januari 1971 doch voor 1 januari 1995, waarin
      bevestigingspunten moeten zijn aangebracht ten behoeve van het gebruik van autogordels op de in het derde lid en
      het vierde lid bedoelde zitplaatsen, moeten zijn voorzien van autogordels voor die zitplaatsen. De autogordels
      moeten voldoen aan de door Onze Minister gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.36
  - number: 3.5.37
    text: |-
      1 Driewielige motorrijtuigen die in gebruik worden genomen na 16 juni 1999, moeten voor wat betreft de naar buiten
      uitstekende delen voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).

      2 Driewielige motorrijtuigen die in gebruik zijn genomen voor 17 juni 1999 mogen geen scherpe delen hebben die in
      geval van botsing gevaar voor lichamelijk letsel voor andere weggebruikers kunnen opleveren.

      3 Onverminderd het bepaalde in het tweede lid moeten uitstekende delen die in geval van botsing het gevaar voor
      lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn afgeschermd.

      4 Het bepaalde in het tweede en derde lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m boven
      het wegdek bevinden.

      5 Op driewielige motorrijtuigen met twee wielen aan de achterzijde, die in gebruik worden genomen na 31 december
      1994 doch voor 17 juni 1999, zijn de eisen in [richtlijn 70/221/EEG](31970L0221) inzake de bescherming aan de
      achterzijde van overeenkomstige toepassing.

      6 Driewielige motorrijtuigen die in gebruik worden genomen na 31 december 1994 doch voor 17 juni 1999, moeten
      zijn voorzien van voorzieningen ter afscherming van de wielen overeenkomstig de eisen in [richtlijn 78/549/EEG]
      (31978L0549).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.37
  - number: 3.5.39
    text: |-
      1 Driewielige motorrijtuigen die in gebruik worden genomen na 31 oktober 1995 moeten voor wat betreft de plaats
      voor de montage van de achterste kentekenplaat voldoen aan het bepaalde in [richtlijn 93/92/EEG](31993L0092).

      2 Driewielige motorrijtuigen die in gebruik zijn genomen voor 1 november 1995 moeten aan de achterzijde zijn
      voorzien van een mogelijkheid tot bevestiging van een kentekenplaat.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.39
  - number: 3.5.40
    text: |-
      1 Driewielige motorrijtuigen die in gebruik worden genomen na 31 oktober 1995 moeten voor wat betreft de
      installatie van verlichting en lichtsignalen voldoen aan het bepaalde in [richtlijn 93/92/EEG](31993L0092).

      2 Driewielige motorrijtuigen die in gebruik zijn genomen na 31 december 1994 doch voor 1 november 1995
      moeten voor wat betreft de installatie van verlichting en lichtsignalen voldoen aan het gestelde in
      [artikel 3.5.41, derde lid][ref1].

      3 De in de lichtarmaturen van driewielige motorrijtuigen die in gebruik worden genomen na 31 december 1994,
      toegepaste gloeilampen moeten voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).

      4 Het derde lid is niet van toepassing ten aanzien van lampen waarbij lichtarmatuur en lichtbron een gesloten
      eenheid vormen.

      5 Onze Minister stelt regels vast met betrekking tot de verlichting, lichtsignalen en retroreflecterende
      voorzieningen van driewielige motorrijtuigen die in gebruik zijn genomen voor 1 januari 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.5.41
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.40
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 3.5.41
        hoofdstuk: '3'
        paragraaf: '10'
        afdeling: '5'
  - number: 3.5.41
    text: |-
      1 Driewielige motorrijtuigen die in gebruik worden genomen na 16 juni 1999, moeten zijn voorzien van grote lichten,
      dimlichten, stadslichten, richtingaanwijzers, achterlichten, remlichten, een installatie ter verlichting van de
      aan de achterzijde van het voertuig aangebrachte kentekenplaat en niet-driehoekige rode retroreflectoren aan de
      achterzijde van het voertuig die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).

      2 Driewielige motorrijtuigen die in gebruik worden genomen na 31 oktober 1995 doch voor 17 juni 1999, moeten zijn
      voorzien van:

      a. grote lichten en dimlichten die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn
      76/761/EEG](31976L0761);

      b. stadslichten die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn 76/758/EEG]
      (31976L0758);

      c. richtingaanwijzers en waarschuwingsknipperlichten, die voldoen aan het bepaalde in[richtlijn 97/24/EG]
      (31997L0024) of [richtlijn 76/759/EEG](31976L0759);

      d. achterlichten die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn 76/758/EEG]
      (31976L0758);

      e. remlichten die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn 76/758/EEG]
      (31976L0758);

      f. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat, die
      voldoet aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn 76/760/EEG](31976L0760);

      g. niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig, die voldoen aan het bepaalde in
      [richtlijn 97/24/EG](31997L0024).

      3 Driewielige motorrijtuigen die in gebruik worden genomen na 31 december 1994 doch voor 1 november 1995, moeten
      zijn voorzien van:

      a. twee of vier grote lichten die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn
      76/761/EEG](31976L0761);

      b. twee dimlichten die voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024) of [richtlijn 76/761/EEG]
      (31976L0761);

      c. twee stadslichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758);

      d. twee richtingaanwijzers aan de voorzijde en twee aan de achterzijde van het voertuig, en
      waarschuwingsknipperlichten, die voldoen aan het bepaalde in [richtlijn 76/759/EEG](31976L0759);

      e. twee achterlichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758);

      f. twee remlichten die voldoen aan het bepaalde in [richtlijn 76/758/EEG](31976L0758);

      g. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat, die
      voldoet aan het bepaalde in [richtlijn 76/760/EEG](31976L0760);

      h. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig, die voldoen aan het bepaalde in
      [richtlijn 97/24/EG](31997L0024).

      4 Driewielige motorrijtuigen met een breedte van niet meer dan 1,50 m mogen in afwijking van het bepaalde in het
      derde lid, onderdelen a, b, c, e, f en h, zijn voorzien van:

      a. één groot licht;

      b. één dimlicht;

      c. één stadslicht;

      d. één achterlicht;

      e. één remlicht;

      f. één niet-driehoekige rode retroreflector.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.41
  - number: 3.5.44
    text: |-
      1 De in [artikel 3.5.41, derde en vierde lid][ref1], bedoelde lichten en retroreflectoren moeten, met uitzondering
      van de kentekenplaatverlichting, niet lager dan 0,35 m en niet hoger dan 1,20 m boven het wegdek zijn aangebracht.

      2 De in [artikel 3.5.41, derde en vierde lid][ref2], bedoelde lichten en retroreflectoren moeten, met uitzondering
      van de kentekenplaatverlichting, symmetrisch ten opzichte van het midden van het voertuig zijn aangebracht.

      3 De in [artikel 3.5.41, derde lid][ref3], bedoelde grote lichten, dimlichten, stadslichten en niet-driehoekige
      rode retroreflectoren moeten niet verder dan 0,40 m van de zijkanten van het voertuig zijn aangebracht.

      4 De richtingaanwijzers en waarschuwingsknipperlichten, achterlichten, remlichten en niet-driehoekige rode
      retroreflectoren, bedoeld in [artikel 3.5.41, tweede, derde en vierde lid][ref4], moeten op een onderlinge afstand
      van ten minste 0,60 m zijn aangebracht, waarbij de afstand vanaf het punt van de grootste breedte van het voertuig
      niet meer dan 0,40 m mag bedragen.

      5 De in [artikel 3.5.41, vierde lid][ref5], bedoelde lichten en retroreflector moeten in afwijking van het bepaalde
      in het tweede, derde en vierde lid in het midden van het voertuig zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.5.41
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel3.5.41
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel3.5.41
      [ref4]: https://wetten.overheid.nl/BWBR0006746#Artikel3.5.41
      [ref5]: https://wetten.overheid.nl/BWBR0006746#Artikel3.5.41
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.5.44
