  - number: '4.1'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] geldt niet voor motorfietsen, bromfietsen alsmede driewielige
      motorrijtuigen waarvan de ledige massa niet meer bedraagt dan 400 kg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '4.2'
    text: |-
      [Artikel 72, eerste lid][ref1], van de wet geldt voor een motorrijtuig of een aanhangwagen, waarvan de toegestane
      maximum massa meer bedraagt dan 3500 kg, niet zolang sinds de datum van eerste toelating van het voertuig nog geen
      jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '4.3'
    text: |-
      [Artikel 72, eerste lid][ref1], van de wet geldt voor een motorrijtuig, waarvan de toegestane maximum massa
      niet meer dan 3500 kg bedraagt en dat is bestemd om te worden gebruikt voor het vervoer van personen waarop de
      [Wet personenvervoer 2000][ref2] betrekking heeft, niet zolang sinds de datum van eerste toelating van het voertuig
      nog geen jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0011470
