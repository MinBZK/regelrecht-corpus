  - number: '6.16'
    text: |-
      1 Indien de wijziging in de constructie wordt goedgekeurd door de Dienst Wegverkeer of de wijziging is
      aangebracht door een ingevolge artikel 101 van de wet erkende natuurlijke persoon of rechtspersoon, wordt,
      voor zover afgifte van een nieuw deel I A van het kentekenbewijs wegens wijziging van de op het bewijs
      vermelde gegevens noodzakelijk is, voor deel I dan wel deel I A van het kentekenbewijs een ontvangstbewijs
      uitgereikt van een door de Dienst Wegverkeer vastgesteld model. De aanvraag van een goedkeuring als bedoeld
      in [artikel 99, eerste lid, van de wet][ref1], wordt aangemerkt als aanvraag van een nieuw deel I A van het
      kentekenbewijs en afgehandeld overeenkomstig het bepaalde bij of krachtens het Kentekenreglement. Indien afgifte
      van een nieuw deel I A van het kentekenbewijs niet noodzakelijk is, wordt na goedkeuring van de wijziging dan wel
      na het aanbrengen van de wijziging het kentekenbewijs aan de aanvrager teruggegeven. Is in dat geval wijziging van
      de in het kentekenregister omtrent het voertuig opgenomen gegevens noodzakelijk, dan doet de erkende natuurlijke
      persoon of rechtspersoon daarvan mededeling aan de Dienst Wegverkeer. Indien de aanvrager bij de aanvraag een deel
      I van een kentekenbewijs overlegt dat is afgegeven voor 31 mei 2004, geeft de Dienst Wegverkeer een kentekenbewijs
      af dat bestaat uit een deel I A en B en een deel II.

      2 Indien de wijziging bij de keuring door de Dienst Wegverkeer niet wordt goedgekeurd, wordt voor het deel I dan
      wel deel I A van het kentekenbewijs een ontvangstbewijs uitgereikt als bedoeld in het eerste lid. Gedurende een
      door de Dienst Wegverkeer te bepalen periode wordt de aanvrager in de gelegenheid gesteld, tegen overlegging van
      het ontvangstbewijs, de aangebrachte wijziging in de constructie alsnog te laten goedkeuren. Na het verstrijken van
      die periode zonder dat goedkeuring heeft plaatsgevonden, wordt het kentekenbewijs overeenkomstig het bepaalde in
      [artikel 60 van de wet][ref2] ingevorderd.

      3 Indien is verzocht om keuring als T100-bus, maakt de Dienst Wegverkeer, indien de bus voldoet aan de eisen
      bedoeld in [artikel 6.15a, eerste lid, dan wel tweede lid][ref3], en door de Dienst Wegverkeer is goedgekeurd
      als T100-bus, hiervan onverwijld een aantekening op het kentekenbewijs en in het kentekenregister, tenzij de
      aantekening op kentekenbewijs en in het kentekenregister reeds ingevolge [artikel 3.3.1a, tweede lid][ref4], is
      geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel6.15a
      [ref4]: https://wetten.overheid.nl/BWBR0006746#Artikel3.3.1a
