    text: |-
      Bij wijziging van de maximum constructiesnelheid, zoals vermeld op het kentekenbewijs of in het kentekenregister,
      van bromfietsen voldoet het voertuig aan de in de [hoofdstukken 3][ref1] en [5][ref2] opgenomen eisen omtrent:

      a. algemeen;

      b. algemene bouwwijze van het voertuig;

      c. motor;

      d. ophanging;

      e. reminrichting, en

      f. verlichting.


