  - number: '4.16'
    text: |-
      De Dienst Wegverkeer doet, indien de keuring op grond waarvan het keuringsrapport werd afgegeven is verricht door
      een erkende natuurlijke persoon of rechtspersoon, aan deze afschrift toekomen van de uitslag van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel4.16
  - number: 5.1.1
    text: |-
      1 Het is de bestuurder van een voertuig verboden daarmee te rijden en de eigenaar of houder verboden daarmee te
      laten rijden, indien het voertuig:

      a. niet deugdelijk van bouw of inrichting is, dan wel rijtechnisch in onvoldoende staat van onderhoud verkeert,

      b. zodanig is gebouwd of ingericht dat de bestuurder onvoldoende uitzicht naar voren of opzij heeft, of

      c. niet voldoet aan de in de [afdelingen 2 tot en met 17 van dit hoofdstuk][ref1] ten aanzien van de bouw of
      inrichting van voertuigen van de categorie waartoe het voertuig behoort, gestelde eisen.

      2 Het is de bestuurder en de eigenaar of houder van een voertuig verboden het voertuig te laten staan, indien
      het voertuig niet voldoet aan de in de [afdelingen 2 tot en met 17 van dit hoofdstuk][ref2] ten aanzien van de
      verplichte niet-driehoekige dan wel driehoekige rode retroreflectoren aan de achterzijde van voertuigen gestelde
      eisen.

      3 Voor de toepassing van het bepaalde in het eerste lid, onderdeel *c*, en het tweede lid, zijn op motorrijtuigen
      welke niet vallen onder een van de in de [afdelingen 2 tot en met 8 van dit hoofdstuk][ref3] genoemde categorieën
      motorrijtuigen, de in [afdeling 2 van dit hoofdstuk][ref4] vermelde eisen van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
