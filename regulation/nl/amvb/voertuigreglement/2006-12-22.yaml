  - number: 5.3.71
    text: |-
      1 Bedrijfsauto’s moeten zijn voorzien van ten minste een geluidssignaalinrichting die bestaat uit een goed werkende
      hoorn met vaste toonhoogte. Een samenstel van zodanige, tegelijk werkende hoorns wordt als één hoorn beschouwd.

      2 Bedrijfsauto’s mogen zijn voorzien van een geluidssignaalinrichting die andere weggebruikers erop attent maakt
      dat de achteruitversnelling is ingeschakeld, alsmede van een geluidssignaalinrichting die ertoe strekt ongeoorloofd
      gebruik of diefstal van het voertuig te voorkomen.

      3 Bedrijfsauto’s mogen, onverminderd het in [artikel 29 van het RVV 1990][ref1] bepaalde inzake twee- en drietonige
      hoorns, niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.71
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
  - number: 5.4.1
    text: |-
      Motorfietsen moeten voldoen aan de volgende eisen:

      a. het voertuig moet in overeenstemming zijn met de op het voor het voertuig afgegeven kentekenbewijs en in het
      kentekenregister omtrent het voertuig vermelde gegevens;

      b. het identificatienummer moet op een vast voertuigdeel zijn ingeslagen en moet goed leesbaar zijn;

      c. het merk of de fabrieksaanduiding moet aanwezig zijn;

      d. de kentekenplaat moet zijn voorzien van het in [artikel 5 van het Kentekenreglement][ref1] voorgeschreven
      goedkeuringsmerk en moet deugdelijk aan de achterzijde van het voertuig zijn bevestigd;

      e. het kenteken moet goed leesbaar zijn en de kentekenplaat mag niet zijn afgeschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '5'
  - number: 5.4.3
    text: |-
      1 Het frame of de zelfdragende constructie alsmede de voor- en achtervork van motorfietsen mag:

      a. geen breuken of scheuren vertonen;

      b. niet zijn doorgeroest;

      c. niet zodanig zijn vervormd dat de stijfheid en de sterkte ervan in gevaar worden gebracht dan wel dat het
      weggedrag van het voertuig nadelig wordt benvloed.

      2 De onderdelen die deel uitmaken van het frame of van de zelfdragende constructie moeten deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.3
  - number: 5.4.4
    text: |-
      Een aan een motorfiets gekoppelde zijspanwagen moet deugdelijk aan het frame of aan de zelfdragende constructie van
      de motorfiets zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.4
  - number: 5.4.6
    text: |-
      1 Motorfietsen mogen:

      a. niet langer zijn dan 4.00 m;

      b. niet breder zijn dan 2.00 m;

      c. niet hoger zijn dan 2.50 m.

      2 Motorfietsen met zijspanwagen alsmede motorrijtuigen op drie asymmetrisch geplaatste wielen, die in gebruik zijn
      genomen voor 1 januari 1995, mogen niet breder zijn dan 2,55 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.6
  - number: 5.4.9
    text: |-
      1 Alle onderdelen van het brandstofsysteem van motorfietsen moeten veilig zijn en deugdelijk zijn bevestigd.

      2 Het brandstofsysteem mag geen lekkage vertonen.

      3 De vulopening van het brandstofreservoir moet zijn afgesloten met een passende tankdop.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.9
  - number: 5.4.10
    text: |-
      1 Indien de motorfiets is voorzien van een LPG-installatie, moet deze, onverminderd het bepaalde in
      [artikel 5.4.9][ref1], voldoen aan in de volgende leden gestelde eisen.

      2 De LPG-tank:

      a. moet permanent zijn aangebracht aan het voertuig;

      b. mag niet door corrosie zijn aangetast, met uitzondering van corrosie van het oppervlak;

      c. mag geen deuken vertonen.

      3 De volgende onderdelen moeten aanwezig zijn:

      a. de veerveiligheid, die in de buitenlucht moet uitmonden;

      b. de verdamper/drukregelaar, al dan niet gecombineerd, dan wel een mengregelsysteem;

      c. de gasdichte kast indien de tank in de zijspanwagen is geplaatst;

      d. de automatisch inrichting ter begrenzing van de vullingsgraad;

      e. de automatische afnameklep op de tank;

      f. het gasmengstuk dan wel een inspuitstuk;

      g. de automatische afsluitklep.

      4 De in het derde lid genoemde onderdelen moeten vrij zijn van ernstige beschadigingen en mogen niet door corrosie
      zijn aangetast, met uitzondering van corrosie van het oppervlak.

      5 De leidingen mogen geen knikken vertonen en mogen niet door corrosie zijn aangetast, met uitzondering van
      corrosie van het oppervlak.

      6 De gasvoerende slangen van rubber mogen geen beschadiging vertonen waarbij het wapeningsmateriaal zichtbaar is.
      De slangen die aan de buitenzijde van een metalen wapening zijn voorzien, mogen geen beschadiging vertonen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.4.9
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.10
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.4.9
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '4'
  - number: 5.4.10a
    text: |-
      1 Indien de motorfiets is voorzien van een CNG-installatie, moet deze, onverminderd [artikel 5.4.9][ref1], voldoen
      aan de in het tweede tot en met achtste lid gestelde eisen.

      2 De CNG-tank:

      a. moet permanent zijn aangebracht aan het voertuig, en

      b. mag geen deuken vertonen.

      3 Indien de CNG-tank in gebruik is genomen na 19 juli 2002, mag de geldigheid van de goedkeuring niet verstreken
      zijn. CNG-tanks die voor 20 juli 2002 in gebruik zijn genomen en waarvan de gegevens omtrent de geldigheid van de
      goedkeuring niet beschikbaar zijn, mogen niet ouder zijn dan 10 jaar, dan wel mag het voertuig niet ouder zijn dan
      10 jaar.

      4 Op de CNG-installatie mogen geen andere verbruikers zijn aangesloten dan die, welke strikt noodzakelijk zijn voor
      het goed functioneren van de motor van het voertuig.

      5 Indien het voertuig in gebruik genomen is na 1 juli 1995, moet het voertuig zijn voorzien van een goed werkende
      automatische tankafsluiter.

      6 De onderdelen van de CNG-installatie moeten vrij zijn van ernstige beschadigingen en mogen niet door corrosie
      zijn aangetast, met uitzondering van corrosie van het oppervlak.

      7 De leidingen en gasvoerende slangen mogen geen knikken vertonen.

      8 De gasvoerende slangen mogen geen beschadiging vertonen waarbij het wapeningsmateriaal zichtbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.4.9
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.10a
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.4.9
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '4'
  - number: 5.4.11
    text: |-
      1 Motorfietsen moeten zijn voorzien van een uitlaatsysteem dat over de gehele lengte gasdicht is, met uitzondering
      van de afwateringsgaatjes.

      2 Het uitlaatsysteem moet deugdelijk zijn bevestigd.

      3 Motorfietsen moeten blijven behoren tot een goedgekeurd type als bedoeld in
      [artikel 3 van het Besluit geluidproduktie motorvoertuigen][ref1] (*Stb.* 1981, 741).

      4 Motorfietsen mogen in de nabijheid van de uitmonding van het uitlaatsysteem geen hoger geluidsniveau produceren
      dan de waarde die voor het voertuig is vermeld in het kentekenregister, vermeerderd met 2 dB(A). Het geluidsniveau
      van de uitlaat wordt vastgesteld op een door Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer tezamen aangegeven wijze.

      5 Motorfietsen waarvoor geen waarde als bedoeld in het vierde lid is vermeld, mogen in de nabijheid van de
      uitmonding van het uitlaatsysteem geen hoger geluidsniveau produceren dan de in onderstaande tabel bij de
      onderscheiden cylinderinhouden telkens vermelde waarde:








                    Cylinderinhoud t/m


                    Maximum toegestane waarde




                    80 cm3


                    91 dB(A)




                    125 cm3


                    92 dB(A)




                    350 cm3


                    95 dB(A)




                    500 cm3


                    97 dB(A)




                    750 cm3


                    100 dB(A)




                    1000 cm3


                    103 dB(A)




                    >1000 cm3


                    106 dB(A)






      Onze Minister stelt regels vast omtrent de wijze van meten van deze waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel3
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.11
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '3'
  - number: 5.4.12
    text: |-
      1 De accu van motorfietsen moet deugdelijk zijn bevestigd.

      2 De bedrading van motorfietsen moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.12
  - number: 5.4.13
    text: De motor van motorfietsen moet deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.13
  - number: 5.4.15
    text: |-
      Motorfietsen die in gebruik zijn genomen na 26 november 1975 doch voor 17 juni 1999 of na 16 juni 2003, moeten zijn
      voorzien van een goed werkende snelheidsmeter, die ook bij nacht voor de bestuurder goed afleesbaar is.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.15
  - number: 5.4.16
    text: De voor de transmissie noodzakelijke onderdelen van motorfietsen moeten deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.16
  - number: 5.4.18
    text: |-
      1 De assen van motorfietsen moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen breuken of scheuren
      vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn bevestigd, beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.18
  - number: 5.4.21
    text: |-
      De wielbasis van motorfietsen mag niet meer dan 60 mm afwijken van de waarde die voor het voertuig is vermeld op
      het kentekenbewijs of in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.21
  - number: 5.4.24
    text: |-
      De wielen, alsmede de onderdelen daarvan, van motorfietsen mogen geen breuken, scheuren of ernstige vervorming
      vertonen. Onderdelen mogen niet loszitten of ontbreken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.24
  - number: 5.4.27
    text: |-
      1 De wielen van motorfietsen moeten zijn voorzien van luchtbanden.

      2 De banden mogen geen beschadigingen vertonen waarbij het karkas zichtbaar is.

      3 De banden mogen geen uitstulpingen vertonen.

      4 De profilering van de hoofdgroeven van de banden moet over de gehele omtrek van het loopvlak ten minste 1,0 mm
      bedragen, met uitzondering van slijtage-indicatoren.

      5 De banden mogen niet zijn opgesneden. Van opsnijden is sprake indien slijtage-indicatoren zijn weggesneden,
      indien de profielvorm van de groef afwijkt van de originele profielvorm, of indien in de bodem van de groef het
      karkas van de band zichtbaar is.

      6 Het loopvlak van de banden mag geen metalen elementen bevatten die tijdens het rijden daarbuiten kunnen
      uitsteken.

      7 De banden van motorfietsen in gebruik genomen voor 17 juni 1999 moeten voldoen aan de door Onze Minister gestelde
      eisen omtrent geschiktheid en montage.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.27
  - number: 5.4.28
    text: |-
      1 Indien de motorfiets is voorzien van een veersysteem, moet dit goed werken.

      2 De onderdelen van het veersysteem mogen geen breuken of scheuren vertonen en moeten deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.28
  - number: 5.4.29
    text: |-
      1 De voor de overbrenging van de stuurkrachten noodzakelijke onderdelen moeten deugdelijk zijn bevestigd.

      2 De voorvork moet zonder zware punten in het balhoofd kunnen draaien.

      3 De balhoofdlagering mag geen zichtbare speling vertonen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.29
  - number: 5.4.31
    text: |-
      1 Motorfietsen moeten zijn voorzien van een reminrichting waarvan de onderdelen:

      a. deugdelijk zijn bevestigd met de daarvoor bestemde bevestigings- en borgmiddelen;

      b. niet in ernstige mate door corrosie zijn aangetast;

      c. niet zijn beschadigd, gescheurd of gebroken;

      d. geen inwendige of uitwendige lekkage vertonen.

      2 Het rempedaal onderscheidenlijk de remhandel mag geen zodanige slag maken dat het pedaal dan wel de handel tot
      een aanslag kan worden ingetrapt of ingedrukt.

      3 Het oppervlak van het rempedaal moet stroef zijn.

      4 Remslangen mogen:

      a. niet in ernstige mate zijn misvormd;

      b. niet langs andere voertuigdelen schuren;

      c. geen zodanige beschadigingen vertonen dat het wapeningsmateriaal zichtbaar is.

      5 Remkabels mogen niet zijn gerafeld en moeten goed gangbaar zijn.

      6 Wielen die zijn voorzien van een trommelrem, moeten in onberemde toestand in beide richtingen kunnen draaien
      zonder dat de remvoering aanloopt. De remvoering van wielen die zijn voorzien van een schijfrem, mag in onberemde
      toestand in beide richtingen enigszins slepen.

      7 De remtrommel of remschijf mag tijdens het remmen niet worden geraakt door delen die zijn bestemd als drager of
      bevestigingsmiddel van remvoering.

      8 De noodzakelijke bewegingsvrijheid van de remonderdelen mag niet worden beperkt.

      9 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.31
  - number: 5.4.38
    text: |-
      1 Motorfietsen, in gebruik genomen na 31 maart 1997, moeten zijn voorzien van twee bedrijfsremmen waarvan de
      remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg:

      a. bij gebruik van de voorwielrem ten minste 3,9 m/s2 bedraagt, dan wel indien als gevolg van onvoldoende wrijving
      deze waarde niet kan worden bereikt, ten minste 5,2 m/s2 bij gelijktijdig gebruik van de beide remmen bedraagt;

      b. bij gebruik van de achterwielrem ten minste 2,6 m/s2 bedraagt, dan wel indien als gevolg van onvoldoende
      wrijving deze waarde niet kan worden bereikt, ten minste 5,2 m/s2 bij gelijktijdig gebruik van de beide remmen
      bedraagt;

      c. bij gebruik van de voorwielrem bij aangekoppelde zijspanwagen ten minste 3,2 m/s2 bedraagt;

      d. bij gebruik van de achterwielrem bij aangekoppelde zijspanwagen ten minste 3,2 m/s2 bedraagt;

      e. in geval van een gecombineerde reminrichting:

      1°. bij gebruik van de gecombineerde reminrichting ten minste 4,5 m/s2 bedraagt, dan wel ten minste 4,8 m/s2
      bedraagt bij aangekoppelde zijspanwagen, en

      2°. bij gebruik van de andere rem ten minste 2,2 m/s2 bedraagt.

      2 Motorfietsen, in gebruik genomen na 26 november 1975 doch voor 1 april 1997, moeten zijn voorzien van twee
      bedrijfsremmen waarvan de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg:

      a. bij gebruik van beide remmen tezamen ten minste 4,5 m/s2 bedraagt, en bij aangekoppelde zijspanwagen ten minste
      4,1 m/s2;

      b. bij gebruik van de voorwielrem ten minste 3,5 m/s2 bedraagt;

      c. bij gebruik van de achterwielrem ten minste 2,8 m/s2 bedraagt.

      3 Motorfietsen, in gebruik genomen na 30 juni 1967 doch vóór 27 november 1975, moeten zijn voorzien van twee
      bedrijfsremmen waarvan de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg bij
      gebruik van beide remmen tezamen ten minste 4,2 m/s2 bedraagt.

      4 Motorfietsen, in gebruik genomen vóór 1 juli 1967, moeten zijn voorzien van twee bedrijfsremmen waarvan de
      remvertraging op en droge of nagenoeg droge en ongeveer horizontaal liggende weg bij gebruik van beide remmen
      tezamen ten minste 3,8 m/s2 bedraagt.

      5 De voor het gebruik van de remmen benodigde bedieningskracht mag bij motorfietsen die in gebruik zijn genomen
      na 26 november 1975, bij gebruik van een remhandel niet meer dan 200N en bij gebruik van een rempedaal niet meer
      bedragen dan:

      a. 500 N, dan wel

      b. 350 N indien de motorfiets na 31 maart 1997 in gebruik is genomen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.38
  - number: 5.4.41
    text: |-
      1 Windschermen en stroomlijnkappen van motorfietsen mogen de bediening van de stuurinrichting, de koppeling en de
      remmen niet belemmeren.

      2 Windschermen, stroomlijnkappen en permanent aangebrachte inrichtingen om lading mee te kunnen vervoeren, moeten
      deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.41
  - number: 5.4.45
    text: |-
      1 Motorfietsen die in gebruik zijn genomen na 16 juni 2003, moeten zijn voorzien van een linker- en een
      rechterbuitenspiegel.

      2 Motorfietsen die in gebruik zijn genomen na 26 november 1975 doch voor 17 juni 2003, moeten zijn voorzien van:

      a. een linker buitenspiegel;

      b. een rechterbuitenspiegel indien de maximum snelheid van het voertuig 100 km/h of meer kan bedragen en het
      voertuig na 31 december 1996 in gebruik is genomen.

      3 De spiegels moeten deugdelijk zijn bevestigd.

      4 Het spiegelglas van de verplichte spiegels mag geen verschijnselen van breuk vertonen en mag niet in ernstige
      mate zijn verweerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.45
  - number: 5.4.46
    text: |-
      1 De zitplaats of zitplaatsen van motorfietsen moeten deugdelijk zijn bevestigd.

      2 Voetsteunen moeten deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.46
  - number: 5.4.48
    text: |-
      1 Motorfietsen mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor andere
      weggebruikers kunnen opleveren.

      2 De wielen onderscheidenlijk banden van motorfietsen mogen niet aanlopen en moeten goed zijn afgeschermd indien de
      motorfiets voor 17 juni 1999 in gebruik is genomen.

      3 Geen deel aan de buitenzijde van een motorfiets mag zodanig zijn bevestigd, beschadigd, versleten of door
      corrosie zijn aangetast, dat gevaar bestaat voor losraken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.48
  - number: 5.4.51
    text: |-
      1 Motorfietsen moeten zijn voorzien van:

      a. een of twee grote lichten;

      b. een of twee dimlichten;

      c. twee richtingaanwijzers aan de voorzijde en twee richtingaanwijzers aan de achterzijde van de motorfiets indien
      de motorfiets in gebruik is genomen na 31 december 1996; het licht van de richtingaanwijzers van motorfietsen in
      gebruik genomen na 30 juni 1967 moet knipperen;

      d. een of twee stadslichten indien het voertuig na 31 oktober 1997 in gebruik is genomen;

      e. een of twee achterlichten;

      f. een of twee remlichten indien het voertuig in gebruik is genomen na 26 november 1975;

      g. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      h. een of twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig.

      2 Onverminderd het eerste lid, onderdeel *c*, mag, indien de motorfiets is voorzien van een zijspanwagen en in
      gebruik is genomen na 31 oktober 1997, de aan de motorfiets aangebrachte richtingaanwijzer aan de zijde van de
      zijspanwagen niet functioneren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.51
  - number: 5.4.52
    text: |-
      Zijspanwagens, verbonden aan een motorfiets, moeten zijn voorzien van:

      a. een richtingaanwijzer aan de voorzijde en een richtingaanwijzer aan de achterzijde indien de motorfiets in
      gebruik is genomen na 31 oktober 1997;

      b. een achterlicht;

      c. een stadslicht indien de motorfiets in gebruik is genomen na 31 oktober 1997;

      d. een remlicht indien de motorfiets in gebruik in genomen na 31 oktober 1997;

      e. een niet-driehoekige rode retroreflector aan de achterzijde van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.52
  - number: 5.4.53
    text: |-
      1 De grote lichten, dimlichten en stadslichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers mogen niet anders dan ambergeel stralen.

      3 De achterlichten mogen niet anders dan rood stralen.

      4 De remlichten mogen niet anders dan rood of ambergeel stralen.

      5 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.53
  - number: 5.4.55
    text: |-
      1 De in de [artikelen 5.4.51][ref1] en [5.4.52][ref2] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. De op een motorfiets zonder zijspanwagen gemonteerde lichten en retroreflecterende voorzieningen met dezelfde
      functie moeten symmetrisch links en rechts van het midden van het voertuig zijn bevestigd.

      5 De in de [artikelen 5.4.51][ref3] en [5.4.52][ref4] bedoelde lichten en retroreflectoren, voorzover het het
      lichtdoorlatend gedeelte betreft, mogen ten hoogste een vierde deel zijn afgeschermd.

      6 De retroreflector mag geen gebreken vertonen, die de retroreflectie beïnvloeden.

      7 Remlichten van motorfietsen moeten werken bij bediening van de achterwielrem of de voorwielrem.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.4.51
