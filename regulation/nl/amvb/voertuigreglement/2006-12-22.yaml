    text: |-
      1 Gehandicaptenvoertuigen die zijn uitgerust met een verbrandingsmotor en die niet zijn voorzien van een gesloten
      carrosserie, moeten voldoen aan de in afdeling 6 aan bromfietsen gestelde eisen, met dien verstande dat:

      a. het bepaalde in [artikel 5.6.1, eerste lid, onderdelen ][ref1], geen toepassing vindt,

      b. voor het in [artikel 5.6.6][ref2] ter zake van de afmetingen bepaalde [artikel 5.10.6][ref3] in de plaats
      treedt, en

      c. de cylinderinhoud van de verbrandingsmotor van het gehandicaptenvoertuig niet meer dan 50 cm3 mag bedragen.

      2 Gehandicaptenvoertuigen zonder motor moeten voldoen aan de in [afdeling 9 van dit hoofdstuk][ref4] aan fietsen
      gestelde eisen, met uitzondering van het in [artikel 5.9.6][ref5] ter zake van de afmetingen bepaalde, waarvoor
      [artikel 5.10.6][ref6] in de plaats treedt.


