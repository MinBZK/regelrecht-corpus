  - number: 5.15.60
    text: |-
      1 De richtingaanwijzers moeten zijn aangebracht:

      a. aan de uiterste zijden van het voertuig en op een onderlinge afstand, gemeten tussen de binnenranden van het
      lichtdoorlatende gedeelte, van niet minder dan 0,24 m;

      b. op een hoogte van niet minder dan 0,35 m boven het wegdek.

      De lichten moeten zodanig zijn aangebracht dat zij waarneembaar zijn voor een waarnemer die zich in het mediaanvlak
      van het voertuig bevindt op een afstand van 10 m achter het voertuig.

      2 Het mistlicht aan de achterzijde van het voertuig moet zijn aangebracht op een hoogte van niet minder dan 0,35 m
      boven het wegdek, links van het midden van het voertuig op een afstand van niet minder dan 0,10 m van het remlicht.

      3 Het remlicht of de remlichten moeten aan de achterzijde van het voertuig zijn aangebracht op een hoogte van niet
      minder dan 0,25 m boven het wegdek. Indien één licht is aangebracht, moet dit in het midden of links van het midden
      van het voertuig zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.60
  - number: 5.15.64
    text: Aanhangwagens mogen, met uitzondering van de richtingaanwijzers, niet zijn voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.64
  - number: 5.15.65
    text: |-
      Aanhangwagens mogen niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de artikelen
      5.15.51 en 5.15.57 is voorgeschreven of toegestaan.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.65
  - number: 5.15.66
    text: |-
      1 De koppeling onderscheidenlijk de dissel van aanhangwagens moet deugdelijk zijn bevestigd en mag niet zijn
      doorgeroest.

      2 De voor de overbrenging van de krachten noodzakelijke onderdelen van de koppeling onderscheidenlijk de dissel
      mogen niet gescheurd, gebroken dan wel overmatig gesleten zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.66
  - number: 5.15.67
    text: |-
      Indien de aanhangwagen is voorzien van een kogelkoppeling,

      a. moet de sluit- en borginrichting goed functioneren;

      b. mogen de onderdelen niet zijn vervormd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.67
  - number: 5.15.70
    text: |-
      De koppeling van aanhangwagens met één wiel mag slechts bewegingen toelaten om een horizontale en een verticale as,
      loodrecht op de lengte-as van het trekkend motorrijtuig.

      De koppeling van aanhangwagens met meer dan één wiel moet bovendien bewegingen om een as in de lengterichting van
      het trekkend motorrijtuig toelaten.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.70
  - number: 5.16.6
    text: Aanhangwagens achter fietsen mogen niet breder zijn dan 1,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.16.6
  - number: 5.16.51
    text: |-
      Aanhangwagens achter fietsen moeten zijn voorzien van:

      a. een niet-driehoekige rode retroreflector aan de achterzijde van het voertuig;

      b. witte of gele retroreflectoren aan de wielen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.16.51
  - number: 5.16.54
    text: |-
      1 De niet-driehoekige rode retroreflector moet zijn aangebracht uiterst links aan de achterzijde van het voertuig,
      op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek.

      2 De witte of gele retroreflectoren moeten de omtrek van het wiel volgen en op of zo dicht mogelijk bij de velg
      zijn aangebracht, zodanig dat zij aan beide zijkanten van de aanhangwagen zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.16.54
  - number: 5.16.55
    text: |-
      1 De in [artikel 5.16.51][ref1] bedoelde retroreflectoren mogen niet zijn afgeschermd.

      2 De retroreflectoren mogen geen gebreken vertonen, die de retroreflectie beïnvloeden.

      3 De retroreflectoren moeten zijn voorzien van een door Onze Minister bekendgemaakt goedkeuringsmerk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.16.51
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.16.55
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.16.51
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '16'
  - number: 5.16.57
    text: |-
      1 Aanhangwagens achter fietsen mogen zijn voorzien van:

      a. één achterlicht dat is voorzien van een door Onze Minister bekendgemaakt goedkeuringsmerk;

      b. één of twee witte retroreflectoren aan de voorzijde van het voertuig;

      c. ambergele retroreflectoren aan de zijkanten van het voertuig.

      2 Aanhangwagens achter fietsen mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de
      voorzijde, extra niet-driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.16.57
  - number: 5.16.64
    text: Aanhangwagens mogen niet zijn voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.16.64
