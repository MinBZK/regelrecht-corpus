        artikel: 5.2.9
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '2'
  - number: 5.2.11
    text: |-
      1 Personenauto’s met een verbrandingsmotor moeten zijn voorzien van een uitlaatsysteem dat over de gehele lengte
      gasdicht is, met uitzondering van de afwateringsgaatjes.

      2 Het uitlaatsysteem moet deugdelijk zijn bevestigd.

      3 Personenauto’s moeten blijven behoren tot een goedgekeurd type als bedoeld in
      [artikel 2 van het Besluit typekeuring motorrijtuigen luchtverontreiniging][ref1] (*Stb.* 1990, 393). Aan deze eis
      wordt niet getoetst tijdens de periodieke keuring ten behoeve van de afgifte van een keuringsrapport.

      4 Personenauto’s moeten blijven behoren tot een goedgekeurd type als bedoeld in
      [artikel 2 van het Besluit geluidproduktie motorvoertuigen][ref2] (*Stb.* 1981, 741). Aan deze eis wordt niet
      getoetst tijdens de periodieke keuring ten behoeve van de afgifte van een keuringsrapport.

      5 Personenauto’s mogen in de nabijheid van de uitmonding van het uitlaatsysteem geen hoger geluidsniveau produceren
      dan de waarde die voor het voertuig is vermeld in het kentekenregister, vermeerderd met 2 dB(A). Het geluidsniveau
      van de uitlaat wordt vastgesteld op een door Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer tezamen aangegeven wijze. Aan deze eis wordt niet getoetst tijdens de periodieke keuring
      ten behoeve van de afgifte van een keuringsrapport.

      6 De uitlaatgassen van personenauto’s met een verbrandingsmotor met elektrische ontsteking mogen bij stationair
      toerental en op bedrijfstemperatuur zijnde motor:

      a. niet meer dan 4,5 % vol koolmonoxyde bevatten indien het voertuig in gebruik is genomen na 31 december 1973 doch
      voor 1 oktober 1986;

      b. niet meer dan 3,5 % vol koolmonoxyde bevatten indien het voertuig in gebruik is genomen na 30 september 1986
      doch voor 1 juli 2002;

      c. niet meer dan 1,5 % vol koolmonoxyde bevatten indien het voertuig in gebruik is genomen na 31 december 1973 doch
      voor 1 juli 2002 en het voertuig blijkens een aantekening op het voor het voertuig afgegeven kentekenbewijs wordt
      gevoed door een al dan niet tot vloeistof verdicht gas;

      d. niet meer dan 0,5 % vol koolmonoxyde bevatten indien het voertuig in gebruik is genomen na 31 december 1985 doch
      voor 1 juli 2002 en het voertuig is uitgerust met een brandstofdoseringssysteem dat de mengverhouding van lucht en
      brandstof voortdurend aanpast aan het zuurstofgehalte van de uitlaatgassen;

      e. niet meer dan 0,3% vol koolmonoxide bevatten indien het voertuig in gebruik is genomen na 30 juni 2002.

      7 De afstelling van het stationaire mengsel van personenauto’s met een verbrandingsmotor met elektrische ontsteking
      die in gebruik zijn genomen na 31 december 1979, met uitzondering van personenauto’s die zijn uitgerust met een
      brandstofdoseringssysteem dat de mengverhouding van lucht en brandstof voortdurend aanpast aan het zuurstofgehalte
      van de uitlaatgassen, dient zodanig te zijn dat een door Onze Minister voor het desbetreffende type motorrijtuig
      aangewezen gehalte aan koolmonoxyde van de uitlaatgassen, uitgedrukt in % vol, bij het bij die aanwijzing
      aangegeven stationaire toerental, niet wordt overschreden. Bij de meting van het gehalte koolmonoxyde moeten de
      eventueel aangewezen bijzondere meetvoorschriften in acht worden genomen. Deze eis wordt alleen getoetst tijdens
      de periodieke keuring ten behoeve van de afgifte van een keuringsrapport en bij elke keuring ten behoeve van de
      afgifte of teruggave van een kentekenbewijs.

      8 De in het zevende lid bedoelde controle van de afstelling van het stationaire mengsel vindt bij personenauto’s
      die worden gevoed door een al dan niet tot vloeistof verdicht gas en die in gebruik zijn genomen:

      a. na 31 december 1993, of

      b. na 31 december 1990 doch vóór 1 januari 1994, indien aan de typeaanduiding op het voor het voertuig afgegeven
      kentekenbewijs de aanduiding S6, K6, S9, K9, U9, N9, E2 of N2 is toegevoegd,

      plaats aan de hand van de afstel- en controlegegevens, vermeld op het op het voertuig aangebrachte symbool, bedoeld
      in [artikel 3][ref3], dan wel aan de hand van de gegevens vermeld in het kentekenregister.

      9 Bij personenauto’s die zijn uitgerust met een brandstofdoseringssysteem dat de mengverhouding van lucht en
      brandstof voortdurend aanpast aan het zuurstofgehalte van de uitlaatgassen, dient het brandstofdoseringssysteem
      goed te werken. De goede werking ervan wordt beoordeeld aan de hand van het gehalte koolmonoxyde van de
      uitlaatgassen, alsmede aan de hand van een op grond van de samenstelling van de uitlaatgassen berekende lucht-
      brandstofverhouding. Deze beoordeling vindt plaats op een door Onze Minister en Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer tezamen aangegeven wijze.

      10

      11 De uitlaatgassen van personenauto’s met een verbrandingsmotor met compressie-ontsteking die in gebruik zijn
      genomen na 31 december 1979 mogen niet meer dan een door Onze Minister en Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer tezamen aangegeven hoeveelheid roet bevatten, waarbij de eventueel aangewezen
      bijzondere meetvoorschriften in acht worden genomen.

      12 Bij personenauto’s met een verbrandingsmotor met elektrische ontsteking die in gebruik zijn genomen na
      31 december 1992 en die zijn voorzien van een emissiebestrijdingssysteem, moeten de door Onze Minister aangegeven
      onderdelen van dit systeem aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002890#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003464#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002890#Artikel3a
