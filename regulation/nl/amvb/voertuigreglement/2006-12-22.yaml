    text: |-
      Het is de bestuurder van een voertuig verboden daarmee te rijden en de eigenaar of houder verboden daarmee te laten
      rijden, indien niet wordt voldaan aan de bepalingen of voorwaarden, welke ingevolge [artikel 52, tweede lid][ref1],
      van de wet in het voor het voertuig afgegeven kentekenbewijs zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel52
