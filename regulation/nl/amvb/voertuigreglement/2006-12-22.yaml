  - number: 5.18.14
    text: |-
      1 De breedte van driewielige motorrijtuigen, die in gebruik zijn genomen voor 1 november 1997, personenauto’s en
      bedrijfsauto’s alsmede daardoor voortbewogen aanhangwagens, met inbegrip van de lading mag niet meer bedragen dan
      de maximum toegestane breedte van die voertuigen in onbeladen toestand, dan wel niet meer dan 2,20 m op onverharde
      wegen.

      2 De breedte van voertuigen waarvan de lading bestaat uit in de breedte ondeelbare lading, mag meer bedragen
      dan de maximum toegestane breedte van die voertuigen in onbeladen toestand, doch niet meer dan voor het vervoer
      noodzakelijk is, met een maximum van 3,00 m.

      3 Lading als bedoeld in het tweede lid, die in de breedte meer dan 0,10 m buiten de zijkant van het voertuig-
      uitsteekt, moet zijn voorzien van een markering die voldoet aan de door Onze Minister vastgestelde eisen.

      4 Lading van personenauto’s mag niet meer dan 0,20 m buiten elke zijkant van het voertuig uitsteken.

      5 Lading van driewielige motorrijtuigen die na 31 oktober 1997 in gebruik zijn genomen, mag niet meer dan 0,20 m
      buiten elke zijkant van het voertuig uitsteken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.14
  - number: 5.18.15
    text: |-
      De hoogte van personenauto’s, bedrijfsauto’s en driewielige motorrijtuigen alsmede daardoor voortbewogen
      aanhangwagens, met inbegrip van de lading mag niet meer bedragen dan 4,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.15
  - number: 5.18.16
    text: |-
      1 Een bedrijfsauto of een samenstel van voertuigen moet naar beide zijden een volledige cirkel kunnen beschrijven
      binnen een ruimte die wordt begrensd door twee concentrische cirkels, waarvan de buitenste een straal van 12,50 m
      en de binnenste een straal van 5,30 m heeft, zonder dat een van de buitenpunten van het voertuig buiten de omtrek
      van de cirkels komt.

      2 Het bepaalde in het eerste lid is niet van toepassing indien het een oplegger betreft waarvan het laadvlak zich
      geheel of grotendeels op gelijke of nagenoeg gelijke hoogte als of lager dan de assen boven het wegdek bevindt,
      de oplegger wordt gebruikt voor het vervoer van ondeelbare lading en de oplegger vóór 1 april 1983 in gebruik is
      genomen.

      3 Het bepaalde in het eerste lid is niet van toepassing op samenstellen van kermis- en circusvoertuigen, rijdende
      werktuigen en samenstellen van rijdende werktuigen en aanhangwagens.

      4 Het bepaalde in het eerste lid is niet van toepassing op samenstellen van trekker en oplegger als bedoeld in
      [artikel 5.18.13, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.13
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.16
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.18.13
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '18'
  - number: 5.18.17
    text: |-
      1 Voertuigen mogen niet zodanig zijn beladen dat de toegestane maximum last van enige as of asstel, de maximum
      last onder de koppeling, dan wel de toegestane maximum massa van het voertuig wordt overschreden of de som van de
      aslasten, uitgezonderd de aslasten van niet autonome aanhangwagens, meer bedraagt dan de toegestane maximum massa.

      2 Indien van een aanhangwagen met toepassing van dit besluit de waarden, bedoeld in het eerste lid, niet kunnen
      worden vastgesteld, geldt voor deze aanhangwagen een toegestane maximum massa van 750 kg.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.17
  - number: 5.18.18
    text: |-
      1 Onverminderd [artikel 5.12.7][ref1] mag de totale massa van aanhangwagens of de som van de aslasten van
      autonome aanhangwagens niet meer bedragen dan de in het kentekenregister of op het kentekenbewijs van het
      trekkend motorrijtuig vermelde toegestane maximum te trekken massa. De totale massa van aanhangwagens die worden
      voortbewogen door personenauto’s, bedrijfsauto’s of driewielige motorrijtuigen, waarvan de toegestane maximum
      massa niet meer bedraagt dan 3500 kg, mag tevens niet meer bedragen dan de maximum massa die volgt uit het op de
      koppeling van het trekkend voertuig aangebrachte identificatiekenmerk of goedkeuringsmerk. Indien de koppeling
      daaromtrent geen gegevens vermeldt, mag de totale massa van de aanhangwagen niet meer bedragen dan 750 kg en niet
      meer dan:

      a. de ledige massa van het trekkend motorrijtuig, of

      b. de massa in bedrijfsklare toestand van het trekkend motorrijtuig.

      2 De totale massa of de som van de aslasten van samenstellen van voertuigen mag niet meer bedragen dan:

      a. de voor het samenstel van voertuigen in het kentekenregister vermelde toegestane maximum massa;

      b. vijf maal de toegestane maximum last onder de aangedreven as of assen van het trekkend motorrijtuig.

      In elk geval mag de totale massa of de som van de aslasten van voertuigen of samenstellen van voertuigen, niet
      zijnde rijdende werktuigen, niet meer bedragen dan 50 000 kg en mag de totale massa of de som van de aslasten van
      rijdende werktuigen of samenstellen van rijdende werktuigen en aanhangwagens niet meer bedragen dan 60 000 kg.

      3 De last onder de bestuurde as of assen van motorrijtuigen in beladen toestand mag niet minder bedragen dan een
      vijfde deel van de massa van het voertuig in beladen toestand. Indien het een gelede bus betreft, mag bedoelde
      last niet minder bedragen dan een vijfde deel van de massa van het voorste deel van het motorrijtuig in beladen
      toestand.

      4 De last onder de gestuurde as of assen, niet zijnde zelfsturende assen, van autonome aanhangwagens in beladen
      toestand, mag niet minder bedragen dan een vijfde deel van de massa van de aanhangwagen in beladen toestand.

      5 De last onder de koppeling van opleggers in beladen toestand mag niet minder bedragen dan een vijfde deel van de
      massa van de oplegger in beladen toestand.

      6 Op onverharde wegen mag de last onder enig wiel van een voertuig niet meer dan 2400 kg bedragen.

      7 Onverminderd het bepaalde in [artikel 5.12.7][ref2] mag de totale massa van middenasaanhangwagens niet meer
      bedragen dan 12 000 kg. Indien de middenasaanhangwagen is voorzien van gasvering of van in het kader van de
      Europese Gemeenschap of van de Europese Economische Ruimte als gelijkwaardig aangemerkte vering, mag de totale
      massa niet meer bedragen dan 20 000 kg dan wel 24 000 kg indien de middenasaanhangwagen is voorzien van drie assen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.12.7
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.12.7
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.18
