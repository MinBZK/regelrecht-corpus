      1 Kampeerauto’s met een toegestane maximum massa van niet meer dan 3500 kg moeten, onverminderd het bepaalde
      in [artikel 6.3, tweede lid][ref1], voor toelating tot het verkeer op de weg voldoen aan de in afdeling 2 met
      betrekking tot personenauto’s gestelde eisen.

      2 Kampeerauto’s met een toegestane maximum massa van meer dan 3500 kg moeten, onverminderd het bepaalde in
      [artikel 6.3, tweede lid][ref2], voor toelating tot het verkeer op de weg voldoen aan de in afdeling 3 met
      betrekking tot bedrijfsauto’s gestelde eisen.


