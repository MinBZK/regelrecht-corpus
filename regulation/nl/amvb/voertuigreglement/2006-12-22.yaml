  - number: '6.6'
    text: |-
      Bij wijziging van de afstand tussen het hart van de koppeling en de voorzijde van een bedrijfsauto met een maximum
      toegestane massa van meer dan 3500 kg of de afstand tussen het hart van de koppeling en de achterzijde van een
      aanhangwagen moet het voertuig voldoen aan de in de [hoofdstukken 3][ref1] en [5][ref2] opgenomen eisen omtrent:

      a. algemeen,

      b. algemene bouwwijze van het voertuig,

      c. afmetingen en massa’s,

      d. de carrosserie voor zover het betreft de bescherming aan de achterzijde en de zijdelingse afscherming,

      e. verlichting, lichtsignalen en retroreflecterende voorzieningen, en

      f. verbinding tussen motorrijtuig en aanhangwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel6.6
