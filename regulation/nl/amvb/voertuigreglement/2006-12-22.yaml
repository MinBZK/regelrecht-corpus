  - number: 5.6.3
    text: |-
      1 De langs- en dwarsliggers en chassisversterkingsdelen van het chassisraam, dan wel de daarvoor in de plaats
      tredende delen van de mee- of zelfdragende carrosserie van bromfietsen mogen:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte van het
      chassisraam of van de mee- of zelfdragende carrosserie in gevaar worden gebracht.

      2 Indien de bromfiets is opgebouwd uit een frame met voor- of achtervork mogen deze onderdelen:

      a. geen breuken of scheuren vertonen;

      b. niet zijn doorgeroest;

      c. niet zodanig zijn vervormd dat de stijfheid en de sterkte ervan in gevaar worden gebracht.

      3 De onderdelen die deel uitmaken van het frame of van de zelfdragende constructie moeten deugdelijk zijn
      bevestigd.

      4 Onze Minister stelt regels vast inzake de toelaatbare mate van corrosie van de in het eerste lid bedoelde
      onderdelen alsmede de bevestiging daarvan.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.3
  - number: 5.6.4
    text: |-
      1 Een aan een bromfiets gekoppelde zijspanwagen moet deugdelijk aan het frame of aan de zelfdragende constructie
      van de bromfiets zijn bevestigd.

      2 De bovenbouw van bromfietsen moet deugdelijk op het onderstel dan wel het frame zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.4
  - number: 5.6.6
    text: |-
      1 Bromfietsen mogen:

      a. niet langer zijn dan 4.00 m;

      b. niet breder zijn dan 1.00 m;

      c. niet hoger zijn dan 2.50 m.

      2 In afwijking van het bepaalde in het eerste lid, onderdeel *b*, mogen bromfietsen op meer dan twee wielen niet
      breder zijn dan 2,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.6
  - number: 5.6.8
    text: |-
      1 Bromfietsen moeten bij voortduring blijven voldoen aan de op het kentekenbewijs of in het kentekenregister
      vermelde maximum constructiesnelheid, vermeerderd met 5 km/h, met dien verstande dat bromfietsen die zijn
      geconstrueerd voor een maximumsnelheid van ten hoogste 45 km/h, respectievelijk 25 km/h, en waarvoor geen
      kentekenbewijs is afgegeven, tot 1 januari 2007 bij voortduring moeten blijven voldoen aan deze door de constructie
      bepaalde maximumsnelheid.

      2 Bromfietsen mogen niet zijn voorzien van een voorziening met het kennelijke doel de controle op de in het eerste
      lid genoemde maximum constructiesnelheid te bemoeilijken of te beïnvloeden.

      3 Onze Minister stelt regels vast omtrent de wijze van meten van de in het eerste lid bedoelde snelheid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.8
  - number: 5.6.9
    text: |-
      1 Alle onderdelen van het brandstofsysteem dan wel van de elektrische aandrijving van bromfietsen moeten veilig
      zijn en deugdelijk zijn bevestigd.

      2 Het brandstofsysteem mag geen lekkage vertonen.

      3 De vulopening van het brandstofreservoir moet zijn afgesloten met een passende tankdop.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.9
  - number: 5.6.11
    text: |-
      1 Bromfietsen met een verbrandingsmotor moeten zijn voorzien van een uitlaatsysteem dat over de gehele lengte
      gasdicht is, met uitzondering van de afwateringsgaatjes.

      2 Het uitlaatsysteem moet deugdelijk zijn bevestigd.

      3 Bromfietsen moeten blijven behoren tot een goedgekeurd type als bedoeld in
      [artikel 2 van het Besluit typekeuring bromfietsen luchtverontreiniging][ref1] (*Stb.* 1984, 525).

      4 Bromfietsen mogen in de nabijheid van de uitmonding van het uitlaatsysteem geen hoger geluidsniveau kunnen
      produceren dan de waarde die voor het voertuig is vermeld op het kentekenbewijs of in het kentekenregister,
      vermeerderd met 2 dB(A). Tot 1 januari 2007 mogen bromfietsen waarvoor geen kentekenbewijs is afgegeven
      en die behoren tot een type waarvoor een typegoedkeuring als bedoeld in artikel 4, eerste lid, aanhef en
      onderdeel a, van richtlijn 92/61/EEG of richtlijn 2002/24/EG is afgegeven in de nabijheid van de uitmonding
      van het uitlaatsysteem geen hoger geluidsniveau kunnen produceren dan de waarde die is vermeld op de in
      [artikel 5.6.1, eerste lid, onderdeel f, onder 2°][ref2], bedoelde constructieplaat, vermeerderd met 2dB(A).

      5 Bromfietsen waarvoor geen waarde als bedoeld in het vierde lid is vermeld, mogen in de nabijheid van de
      uitmonding van het uitlaatsysteem geen hoger geluidsniveau kunnen produceren dan 97 dB(A) voor bromfietsen
      die blijkens de gegevens in het kentekenregister of op het voor het voertuig afgegeven kentekenbewijs zijn
      geconstrueerd voor een maximum snelheid van meer dan 25 km/h en niet meer dan 90 dB(A) voor andere bromfietsen.
      Tot 1 januari 2007 mogen bromfietsen waarvoor geen kentekenbewijs is afgegeven en waarvoor geen waarde als bedoeld
      in het vierde lid, tweede volzin, is vermeld, in de nabijheid van de uitmonding van het uitlaatsysteem geen hoger
      geluidsniveau kunnen produceren dan 97 dB(A) voor bromfietsen die zijn geconstrueerd voor een maximumsnelheid van
      meer dan 25 km/h, en niet meer dan 90 dB(A) voor ander bromfietsen waarvoor nog geen kentekenbewijs is afgegeven.

      6 Onze Minister stelt regels vast omtrent de wijze van meten van de in het vierde en vijfde lid bedoelde
      geluidproductie.


      [ref1]: https://wetten.overheid.nl/BWBR0003722#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.6.1
