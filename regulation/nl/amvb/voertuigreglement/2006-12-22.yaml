  - number: 5.3.46
    text: |-
      1 Bedrijfsauto’s met een toegestane maximum massa van niet meer dan 3500 kg en bussen behorende tot de klasse III
      of B als bedoeld in [artikel 1.1][ref1], in gebruik genomen na 19 oktober 2008, zijn niet voorzien van zijdelings
      gerichte zitplaatsen.

      2 Het eerste lid is niet van toepassing op ambulances, bedrijfsauto’s ten dienste van de politie of brandweer en
      andere door Onze Minister aangewezen categorieën voertuigen ten dienste van de burgerbescherming of ordehandhaving.

      3 Het eerste lid is tot 21 oktober 2010 niet van toepassing op bussen met een toegestane maximum massa van meer
      dan 10.000 kg behorende tot de klasse III of B als bedoeld in [artikel 1.1][ref2], waarin de zijdelings gerichte
      zitplaatsen achterin het voertuig bijeen zijn geplaatst tot een zitgroep met maximaal 10 plaatsen, met dien
      verstande dat deze zijdelings gerichte zitplaatsen, onverminderd [artikel 5.3.47][ref3], zijn voorzien van een
      hoofdsteun en een tweepuntsgordel met oprolmechanisme.

      4 De zitplaatsen van bedrijfsauto’s moeten deugdelijk aan het voertuig zijn bevestigd. De verstelinrichtingen van
      de zitplaatsen moeten goed kunnen worden vergrendeld.

      5 Onze Minister stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging, bedoeld in het vierde
      lid.


