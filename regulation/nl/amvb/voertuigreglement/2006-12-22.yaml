  - number: 5.10.60
    text: |-
      1 De mistlichten aan de voorzijde van het voertuig moeten op een hoogte van niet minder dan 0,25 m boven het wegdek
      doch niet hoger dan de dimlichten zijn aangebracht.

      2 Van de parkeerlichten moeten er twee aan de voorzijde en twee aan de achterzijde van het voertuig zijn
      aangebracht, dan wel moet er één aan elke kant van het voertuig zijn aangebracht.

      3 De achteruitrijlichten moeten aan de achterzijde van het voertuig zijn aangebracht op een hoogte van niet minder
      dan 0,25 m en niet meer dan 1,20 m boven het wegdek.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.60
  - number: 5.10.62
    text: |-
      Het ingeschakeld zijn van het mistlicht of de mistlichten aan de achterzijde van het voertuig moet door middel van
      een controlelampje aan de bestuurder kenbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.62
  - number: 5.10.63
    text: |-
      Achteruitrijlichten van gehandicaptenvoertuigen mogen alleen kunnen branden indien de achteruitversnelling van het
      voertuig is ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.63
  - number: 5.10.64
    text: |-
      1 Gehandicaptenvoertuigen mogen, met uitzondering van grote lichten, niet zijn voorzien van verblindende
      verlichting.

      2 Gehandicaptenvoertuigen mogen, met uitzondering van de richtingaanwijzers en de waarschuwingsknipperlichten, niet
      zijn voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.64
  - number: 5.10.65
    text: |-
      Gehandicaptenvoertuigen mogen niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 5.10.51][ref1] en [5.10.57][ref2] is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.10.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.10.57
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.65
