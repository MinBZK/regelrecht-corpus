  - number: 5.14.60
    text: |-
      1 De achteruitrijlichten moeten aan de achterzijde van het voertuig zijn aangebracht op een hoogte van niet minder
      dan 0,25 m en niet meer dan 1,20 m boven het wegdek.

      2 Op de stadslichten en markeringslichten is [artikel 5.14.54, eerste lid onderscheidenlijk achtste lid][ref1],
      van toepassing.

      3 Het mistlicht of de mistlichten aan de achterzijde van het voertuig moeten zijn aangebracht:

      a. op ten minste 0,10 m afstand van de remlichten;

      b. op een hoogte van niet minder dan 0,25 m en niet meer dan 1,00 m boven het wegdek.

      Indien één licht is aangebracht, moet dit links van het midden van het voertuig zijn geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.14.54
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.60
