  - number: 5.18.45
    text: |-
      1 De lichten aan de voorzijde mogen niet anders dan wit of geel stralen.

      2 De achterlichten mogen niet anders dan rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.45
  - number: 5.18.46
    text: |-
      Aanhangwagens achter fietsen die bij nacht of bij dag indien het zicht ernstig wordt belemmerd, worden gebruikt,
      moeten zijn voorzien van een achterlicht dat is voorzien van een door Onze Minister bekendgemaakt goedkeuringsmerk.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.46
  - number: 5.18.47
    text: |-
      1 Het achterlicht moet goed werken.

      2 Het verlichtingsarmatuur en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 Het glas van het verlichtingsarmatuur mag niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst dan wel de functie nadelig wordt beïnvloed.

      4 Het achterlicht mag niet zijn afgeschermd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.47
  - number: 5.18.48
    text: Het achterlicht mag niet anders dan rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.48
  - number: 5.18.49
    text: |-
      Het achterlicht moet uiterst links aan de achterzijde van het voertuig zijn aangebracht op een hoogte van niet
      minder dan 0,25 m en niet meer dan 1,20 m boven het wegdek.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.49
  - number: 5.18.50
    text: |-
      Wagens die bij nacht of bij dag indien het zicht ernstig wordt belemmerd, worden gebruikt, moeten zijn voorzien
      van:

      a. twee dimlichten aan de voorzijde;

      b. twee achterlichten indien het een wagen betreft waarvan de breedte meer dan 1,50 m bedraagt, dan wel ten minste
      één achterlicht indien het een wagen betreft waarvan de breedte niet meer dan 1,50 m bedraagt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.50
  - number: 5.18.51
    text: |-
      1 De in [artikel 5.18.50][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst dan wel de functie nadelig wordt beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur, en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten op gelijke hoogte symmetrisch links
      en rechts midden van het voertuig zijn bevestigd.

      5 De in [artikel 5.18.50][ref2] bedoelde lichten mogen niet zijn afgeschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.50
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.50
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.51
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.18.50
        hoofdstuk: '5'
        paragraaf: '4'
        afdeling: '18'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 5.18.50
        hoofdstuk: '5'
        paragraaf: '4'
        afdeling: '18'
  - number: 5.18.52
    text: |-
      1 De dimlichten mogen niet anders dan wit of geel stralen.

      2 De achterlichten mogen niet anders dan rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.52
  - number: 5.18.53
    text: |-
      1 De dimlichten moeten aan de voorzijde van het voertuig zijn aangebracht op een afstand van niet meer dan 0,40 m
      binnenwaarts van de uiterste linker- en rechterzijde.

      2 De achterlichten moeten aan de achterzijde van het voertuig zijn aangebracht op een afstand van niet meer dan
      0,40 m binnenwaarts van de uiterste linker- en rechterzijde en op een hoogte van niet meer dan 1,25 m boven het
      wegdek.

      3 Indien één achterlicht is toegestaan, moet dit aan de achterzijde van de wagen zijn aangebracht op een afstand
      van niet meer dan 0,40 m van de uiterste linkerzijde van het voertuig en op een hoogte van niet meer dan 1,25 m
      boven het wegdek.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.53
  - number: 5.18.54
    text: |-
      Bij samenstellen van voertuigen moet de aanhangwagen door een enkele, passende en geschikte koppeling, die niet kan
      lostrillen, zodanig aan het trekkend voertuig zijn verbonden dat zijdelings uitwijken van de aanhangwagen zoveel
      mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.54
  - number: 5.18.55
    text: |-
      Aanhangwagens moeten zich zodanig ten opzichte van het trekkend voertuig kunnen bewegen dat de voertuigen in hun
      uiterste standen, met een maximum van 90°, niet worden begrensd door delen van de reminrichting, van de elektrische
      installatie en van de koppeling, alsmede, voor zover aanwezig, van de hulpkoppeling en van de besturingsonderdelen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.55
  - number: 5.18.56
    text: |-
      1 Bij samenstellen van voertuigen moet het trekoog of de kogelkoppeling van de aanhangwagen horizontaal of nagenoeg
      horizontaal liggen indien het samenstel zich op een horizontaal wegdek bevindt.

      2 Bij gebruik van aanhangwagens, voorzien van een trekdriehoek met verzet, moet de koppelinrichting op het trekkend
      voertuig van een type zijn dat in verticale richting niet beweegbaar is.

      3 Opleggers mogen alleen aan een trekker zijn gekoppeld indien een hoekverdraaiing van de opleggerschotel naar
      boven en naar beneden mogelijk is, indien het samenstel van trekker en oplegger zich op een horizontaal wegdek
      bevindt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.56
  - number: 5.18.57
    text: |-
      De hulpkoppeling van middenasaanhangwagens met een toegestane maximum massa van niet meer dan 1500 kg moet zodanig
      met een vast deel van het trekkend voertuig of met een daartoe bestemde inrichting aan de trekhaak daarvan zijn
      verbonden, dat deze slechts in werking treedt na het losraken van de aanhangwagenkoppeling, en dat bij gebruik van
      de hulpkoppeling de trekboom of koppeling van de aanhangwagen de grond niet raakt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.57
  - number: 5.18.58
    text: |-
      Aanhangwagens moeten zodanig aan een motorfiets of een bromfiets zijn verbonden dat de koppeling zowel bewegingen
      toelaat om een horizontale as als om een verticale as, loodrecht op de lengte-as van de motorfiets; indien de
      aanhangwagen meer dan één wiel heeft, moet de koppeling bovendien bewegingen om een as in de lengterichting van het
      trekkend voertuig toelaten.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.58
  - number: 5.18.59
    text: Een aanhangwagen achter een fiets moet goed met de fiets zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.59
  - number: 5.18.60
    text: |-
      Bromfietsen op drie of meer wielen met een carrosserie moeten aan de achterzijde zijn voorzien van een rond bord
      of rond vlak met een doorsnede van ten minste 0,20 m, wit van kleur met een rode rand en met in het witte vlak
      duidelijk leesbaar de aanduiding 45 in zwarte kleur.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.60
  - number: 5.18.61
    text: |-
      1 Onverminderd de [artikelen 5.3.1][ref1] en [5.12.1][ref2] moeten:

      a. bussen,

      b. bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg en bestemd voor het vervoer van goederen,
      en

      c. aanhangwagens met een toegestane maximum massa van meer dan 3500 kg, zijn voorzien van:

      1°. een constructieplaat, waarvan de gegevens in overeenstemming zijn met het kentekenregister, en een plaat waarop
      zijn vermeld:

        - de naam van de fabrikant,
        - het identificatienummer van het voertuig,
        - de lengte van het motorrijtuig of de aanhangwagen,
        - de breedte van het motorrijtuig of de aanhangwagen,
        - de afstand tussen de voorkant van het motorrijtuig en het middelpunt van de koppelinrichting ervan, en
        - de afstand tussen het middelpunt van de koppelinrichting van de aanhangwagen en de achterkant van de
      aanhangwagen, hetzij

      2°. één plaat waarop de gegevens van de onder 1° bedoelde platen zijn vermeld, hetzij

      3°. een door de Dienst Wegverkeer afgegeven document waarin de gegevens van de onder 1° bedoelde platen zijn
      vermeld.

      2 Onze Minister kan nadere regels vaststellen met betrekking tot de gegevens op of in de in het eerste lid bedoelde
      platen of document. Onze Minister kan voorts regels vaststellen met betrekking tot het model van de in het eerste
      lid bedoelde platen of document, of met betrekking tot de afmetingen of de montage van de in het eerste lid
      bedoelde platen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.12.1
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.61
