  - number: 5.5.62
    text: |-
      Het ingeschakeld zijn van het mistlicht of de mistlichten aan de achterzijde van het voertuig moet door middel van
      een controlelampje aan de bestuurder kenbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.62
  - number: 5.5.63
    text: |-
      Achteruitrijlichten van driewielige motorrijtuigen mogen alleen kunnen branden indien de achteruitversnelling van
      het voertuig is ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.63
  - number: 5.5.64
    text: |-
      1 Driewielige motorrijtuigen mogen, met uitzondering van grote lichten, niet zijn voorzien van verblindende
      verlichting.

      2 Driewielige motorrijtuigen mogen, met uitzondering van de richtingaanwijzers en de waarschuwingsknipperlichten,
      niet zijn voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.64
  - number: 5.5.65
    text: |-
      Driewielige motorrijtuigen mogen niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 5.5.51][ref1] en [5.5.57][ref2] is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.5.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.5.57
