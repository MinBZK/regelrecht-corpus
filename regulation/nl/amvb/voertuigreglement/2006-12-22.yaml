  - number: 5.3.12
    text: |-
      1 De accu van bedrijfsauto’s moet deugdelijk zijn bevestigd.

      2 De bedrading van bedrijfsauto’s moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.12
  - number: 5.3.13
    text: |-
      1 De motorsteunen van bedrijfsauto’s moeten deugdelijk aan het chassis dan wel de carrosserie alsmede aan de
      motor zijn bevestigd. Indien de motor en de versnellingsbak zijn samengebouwd, dan worden de steunen van de
      versnellingsbak mede als motorsteunen beschouwd.

      2 De motorsteunen mogen niet in ernstige mate zijn beschadigd, de rubbers mogen niet zijn doorgescheurd en de
      vulcanisatie mag niet geheel zijn losgeraakt.

      3 Onze Minister stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.13
  - number: 5.3.15
    text: |-
      1 Bedrijfsauto’s die na 30 juni 1967 in gebruik zijn genomen, moeten zijn voorzien van een goed werkende
      snelheidsmeter, die ook bij nacht voor de bestuurder goed afleesbaar is.

      2 De volgende categorieën motorrijtuigen zijn voorzien van een snelheidsbegrenzer:

      a. bedrijfsauto’s met een dieselmotor, met een toegestane maximum massa van meer dan 3.500 kg, doch niet meer dan
      12.000 kg, die na 30 september 2001 doch voor 1 januari 2005 in gebruik zijn genomen;

      b. bedrijfsauto’s met een toegestane maximum massa van meer dan 3.500 kg, doch niet meer dan 12.000 kg, die na 31
      december 2004 in gebruik zijn genomen;

      c. bedrijfsauto’s met een toegestane maximum massa van meer dan 12.000 kg, die na 31 december 1987 in gebruik zijn
      genomen;

      d. bussen met een dieselmotor, met een toegestane maximum massa van niet meer dan 10.000 kg, die na 30 september
      2001 doch voor 1 januari 2005 in gebruik zijn genomen;

      e. bussen met een toegestane maximum massa van niet meer dan 10.000 kg, die na 31 december 2004 in gebruik zijn
      genomen;

      f. bussen met een toegestane maximum massa van meer dan 10.000 kg, die na 31 december 1987 in gebruik zijn genomen.

      3 De snelheidsbegrenzer moet zijn afgesteld op:

      a. een zodanige snelheid, dat de maximumsnelheid van bedrijfsauto’s, niet zijnde bussen, niet meer dan 90 km/h
      kan bedragen;

      b. een zodanige snelheid, dat de maximumsnelheid van bussen niet meer dan 100 km/h kan bedragen;

      c. maximaal 100 km/h, indien het een bus betreft met een maximum massa van meer dan 10.000 kg, die voor 1 januari
      2005 in gebruik is genomen.

      De ingestelde snelheid is onuitwisbaar vermeld op een installatieplaatje dat op een duidelijk zichtbare plaats in
      de stuurcabine van het voertuig is aangebracht.

      4 De snelheidsbegrenzer en de voor het functioneren noodzakelijke aansluitingen moeten met behulp van een
      verzegeling of door de noodzaak om speciale gereedschappen te gebruiken zijn beschermd tegen niet-toegestane
      bijstelling of onderbreking van de stroomvoorziening.

      5 De in het tweede lid bedoelde verplichting geldt niet voor:

      a. motorrijtuigen als bedoeld in [artikel 29 van het Reglement verkeersregels en verkeerstekens 1990][ref1];

      b. motorrijtuigen die blijkens een aantekening op het voor het voertuig afgegeven kentekenbewijs niet van een
      snelheidsbegrenzer behoeven te zijn voorzien.

      6 Indien een bedrijfsauto met een toegestane maximum massa van meer dan 3500 kg moet zijn voorzien van een
      controleapparaat als bedoeld in [verordening 3821/85/EEG](31985R3821):

      a. mag de op het installatieplaatje vermelde geldigheidsduur niet zijn vestreken, met dien verstande dat de
      geldigheidsduur maximaal twee jaar vanaf de installatiedatum bedraagt;

      b. moet het onder a bedoelde installatieplaatje zijn voorzien van een verzegeling dan wel zodanig zijn aangebracht
      dat dit bij verwijdering onherstelbaar wordt beschadigd;

      c. mag de omtrek van de op de aangedreven wielen gemonteerde banden niet meer dan 4% afwijken van de waarde die op
      het onder a bedoelde installatieplaatje is vermeld;

      d. moeten het controleplaatje en de voor het functioneren noodzakelijke aansluitingen met behulp van een
      verzegeling zijn beschermd tegen een niet-toegestane wijziging in de instellingen of onderbreking van de
      stroomvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.15
    references:
