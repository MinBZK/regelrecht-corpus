  - number: 5.2.71
    text: |-
      1 Personenauto’s moeten zijn voorzien van ten minste een geluidssignaalinrichting die bestaat uit een goed werkende
      hoorn met vaste toonhoogte. Een samenstel van zodanige, tegelijk werkende hoorns wordt als één hoorn beschouwd.

      2 Personenauto’s mogen zijn voorzien van een geluidssignaalinrichting die andere weggebruikers erop attent maakt
      dat de achteruitversnelling van het voertuig is ingeschakeld, alsmede van een geluidssignaalinrichting die ertoe
      strekt ongeoorloofd gebruik, diefstal van of ongeoorloofde toegang tot het voertuig te voorkomen.

      3 Personenauto’s mogen, onverminderd het in [artikel 29 van het RVV 1990][ref1] bepaalde inzake twee- en drietonige
      hoorns, niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.71
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
  - number: 5.3.1
    text: |-
      Bedrijfsauto’s moeten voldoen aan de volgende eisen:

      a. het voertuig moet in overeenstemming zijn met de op het voor het voertuig afgegeven kentekenbewijs en in het
      kentekenregister omtrent het voertuig vermelde gegevens;

      b. het identificatienummer moet op een vast voertuigdeel zijn ingeslagen en moet goed leesbaar zijn;

      c. bedrijfsauto’s die in gebruik zijn genomen na 31 december 1997, moeten zijn voorzien van een constructieplaat
      die goed leesbaar is en waarvan de gegevens in overeenstemming zijn met het kentekenregister, met dien verstande
      dat de maximum massa's die op de constructieplaat zijn vermeld ten minste gelijk zijn aan de massa's die zijn
      aangegeven in het kentekenregister en op het kentekenbewijs;

      d. de kentekenplaten moeten zijn voorzien van het in [artikel 5 van het Kentekenreglement][ref1] voorgeschreven
      goedkeuringsmerk en moeten deugdelijk aan de voor- en achterzijde van het voertuig zijn bevestigd;

      e. het kenteken moet goed leesbaar zijn en de kentekenplaten mogen niet zijn afgeschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.1
    references:
