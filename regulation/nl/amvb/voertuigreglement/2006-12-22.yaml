  - number: '8.2'
    text: |-
      Bij veroordeling van de bestuurder van een motorrijtuig wegens overtreding van
      [artikel 5.1.1, eerste of tweede lid][ref1], [artikel 5.1.2][ref2] of [artikel 5.1.4][ref3] kan hem de bevoegdheid
      tot het besturen van motorrijtuigen voor ten hoogste twee jaren worden ontzegd.


