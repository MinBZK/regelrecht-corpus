  - number: 5.12.61
    text: |-
      1 Bij aanhangwagens in gebruik genomen na 31 december 1967 moeten de verlichting, lichtsignalen en
      retroreflecterende voorzieningen, bedoeld in de [artikelen 5.12.51][ref1] en [5.12.57][ref2] zijn aangebracht
      op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig. Voor
      richtingaanwijzers geldt de eerste volzin slechts voor zover de aanhangwagen in gebruik is genomen na 31 december
      1997.

      2 In afwijking van het bepaalde in het eerste lid, moeten de stadslichten zijn aangebracht op een afstand van niet
      meer dan 0,15 m vanaf het punt van de grootste breedte van het voertuig.

      3 Het bepaalde in het eerste lid geldt niet voor de achteruitrijlichten, remlichten, de verlichting van de
      kentekenplaat aan de achterzijde van het voertuig, de markering aan de achterzijde van het voertuig, mistlichten
      aan de achterzijde van het voertuig en werklichten.


