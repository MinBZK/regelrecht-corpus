        afdeling: '7'
  - number: 3.7.52
    text: |-
      1 De mechanische koppelinrichting van aanhangwagens in gebruik genomen na 30 juni 1967 moet:

      a. voldoen aan het bepaalde in [richtlijn 94/20/EG](31994L0020), of

      b. indien de aanhangwagen voor 1 januari 2005 in gebruik is genomen, behoren tot een door Onze Minister
      voor 1 januari 1995 goedgekeurd type, zijn voorzien van de door hem in de goedkeuring voorgeschreven
      identificatiekenmerken, en zijn bevestigd overeenkomstig de voorschriften van de fabrikant van de koppelinrichting.
      Indien de oplegger is voorzien van een stuurwig, moet worden voldaan aan de door Onze Minister vastgestelde eisen.

      2 Middenasaanhangwagens waarvan de toegestane maximum massa niet meer bedraagt dan 1500 kg en die niet zijn
      voorzien van een losbreekreminrichting, moeten zijn voorzien van een hulpkoppeling.

      3 Indien voor het koppelen van voertuigen bijzondere constructies worden toegepast, moeten deze constructies
      voldoen aan de door Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.52
  - number: 3.7.53
    text: |-
      Delen van de koppeling van aanhangwagens mogen tijdens het ontkoppelen, het losbreken of in afgekoppelde toestand
      het wegdek niet kunnen raken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.53
  - number: 3.7.54
    text: |-
      Aanhangwagens die in gebruik worden genomen na 1 januari 1996, moeten ter zake van elektromagnetische
      compatibiliteit voldoen aan het bepaalde in [richtlijn 72/245/EEG](31972L0245).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.7.54
  - number: 3.8.1
    text: |-
      Onze Minister stelt de eisen vast waaraan:

      a. achterlichten voor fietsen en aanhangwagens achter fietsen,

      b. niet-driehoekige rode retroreflectoren voor fietsen, zijspanwagens aan fietsen, aanhangwagens achter fietsen,
      alsmede wagens,

      c. witte of gele retroreflectoren voor de wielen van fietsen, zijspanwagens aan fietsen en aanhangwagens achter
      fietsen,

      d. ambergele of gele retroreflectoren voor de trappers van fietsen, en

      e. rode retroreflectoren in de vorm van een afgeknotte driehoek voor motorrijtuigen met beperkte snelheid,
      landbouw- of bosbouwtrekkers, de daardoor voortbewogen aanhangwagens, alsmede wagens,

      moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.1
  - number: 3.8.2
    text: |-
      Uitlaatsystemen voor motorrijtuigen moeten voldoen aan het bepaalde in het
      [Besluit uitlaatsystemen motorvoertuigen en bromfietsen][ref1] (*Stb.* 1985, 474).


      [ref1]: https://wetten.overheid.nl/BWBR0003835
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.2
    references:
      - id: ref1
        bwb_id: BWBR0003835
  - number: 3.8.3
    text: |-
      1 Mechanische koppelinrichtingen voor het koppelen van een aanhangwagen aan een personenauto of een bedrijfsauto
      moeten voldoen aan het bepaalde in [richtlijn 94/20/EG](31994L0020).

      2 Mechanische koppelinrichtingen voor het koppelen van een aanhangwagen aan een motorfiets, driewielig motorrijtuig
      of een bromfiets moeten voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).

      3 Luchtbanden voor motorfietsen, driewielige motorrijtuigen of bromfietsen moeten voldoen aan het bepaalde in
      [richtlijn 97/24/EG](31997L0024).

      4 Verlichtings- en lichtsignaalinrichtingen voor motorfietsen, driewielige motorrijtuigen of bromfietsen moeten
      voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).

      5 Achteruitkijkspiegels voor motorfietsen, driewielige motorrijtuigen of bromfietsen moeten voldoen aan het
      bepaalde in [richtlijn 97/24/EG](31997L0024).

      6 Brandstoftanks voor motorfietsen, driewielige motorrijtuigen of bromfietsen moeten voldoen aan het bepaalde in
      [richtlijn 97/24/EG](31997L0024).

      7 Autogordels voor driewielige motorrijtuigen en bromfietsen op drie of vier wielen moeten, indien deze zijn
      voorzien van een gesloten carrosserie, voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).

      8 Ruiten, ruitenwissers, ruitensproeiers en ontdooiings- en ontwaseminrichtingen voor driewielige motorrijtuigen en
      bromfietsen op drie of vier wielen moeten, indien deze zijn voorzien van een voorruit en een gesloten carrosserie,
      voldoen aan het bepaalde in [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.3
  - number: 3.8.4
    text: |-
      Helmen voor bestuurders en passagiers van bromfietsen, motorfietsen en driewielige motorrijtuigen voldoen aan het
      bepaalde in het [Warenwetbesluit motor- en bromfietshelmen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007500
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.4
    references:
      - id: ref1
        bwb_id: BWBR0007500
  - number: 3.8.5
    text: |-
      Kinderbeveiligingssystemen, als bedoeld in
      [artikel 59, eerste en tweede lid, van het Reglement verkeersregels en verkeerstekens 1990][ref1] moeten voldoen
      aan het bepaalde in [richtlijn nr. 77/541/EEG](31977L0541).


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel59
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.5
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '59'
  - number: 3.8.6
    text: |-
      Beschermingsinrichtingen aan de voorzijde tegen klemrijden als bedoeld in [artikel 3.3.37, dertiende lid][ref1],
      moeten voldoen aan [richtlijn 2000/40/EG](32000L0040).


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.3.37
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.6
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 3.3.37
        hoofdstuk: '3'
        paragraaf: '9'
        afdeling: '3'
  - number: 3.8.7
    text: |-
      1 Materiaal dat bestemd is voor gebruik als lijn- of contourmarkering, of voor gebruik als retroreflecterende
      letter of afbeelding binnen een contourmarkering, voldoet aan ECE-reglement 104.

      2 Onze Minister draagt zorg voor een vertaling van ECE-reglement 104 en doet van de wijze van bekendmaking
      mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.7
  - number: 3.8.8
    text: |-
      Banden bestemd voor montage op personenauto's, bedrijfsauto's of aanhangwagens moeten voldoen aan [richtlijn nr.
      92/23/EEG](31992L0023).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.8
  - number: 3.8.9
    text: |-
      Veiligheidsruiten of materialen voor ruiten, bestemd voor montage op personenauto's, bedrijfsauto's of
      aanhangwagens, moeten voldoen aan [richtlijn nr. 92/22/EEG](31992L0022).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.9
  - number: 3.8.10
    text: |-
      1 De carrosserie van een bus van klasse I, II, III, A en B die in gebruik wordt genomen na 12 februari 2004, moet
      voldoen aan [richtlijn 2001/85/EG](32001L0085).

      2 De carrosserie van een bus van klasse I, II, III, A en B die in gebruik wordt genomen na 12 februari 2004
      en voorzien is van technische voorzieningen ter verbetering van de toegankelijkheid voor personen met een
      mobiliteitshandicap, moet voldoen aan bijlage VII van [richtlijn 2001/85/EG](32001L0085).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.10
  - number: 3.8.11
    text: |-
      1 Een vervangingskatalysator bestemd om te worden gemonteerd op voertuigen waarvoor een EG-typegoedkeuring is
      verleend overeenkomstig [richtlijn 70/220/EEG](31970L0220), moet voldoen aan [richtlijn 70/220/EEG](31970L0220).

      2 Een vervangingskatalysator bestemd om te worden gemonteerd op voertuigen waarvoor een EG-typegoedkeuring is
      verleend overeenkomstig [richtlijn 2002/24/EG](32002L0024), moet voldoen aan [richtlijn 97/24/EG](31997L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.11
  - number: 3.8.12
    text: |-
      Verwarmingssystemen op brandstof voor personenauto's, bedrijfsauto's en aanhangwagens, voldoen aan [richtlijn
      2001/56/EG](32001L0056).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.12
  - number: 3.8.13
    text: |-
      Een snelheidsbegrenzer of ingebouwd snelheidsbegrenzingssysteem als bedoeld in artikel 1 van [richtlijn 92/24/EEG]
      (31992L0024), voldoet aan het bepaalde in [richtlijn 92/24/EEG](31992L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.13
  - number: 3.8.14
    text: |-
      1 Inrichtingen voor indirect zicht voor personenauto’s en bedrijfsauto’s voldoen met ingang van 26 januari 2006 aan
      [richtlijn 2003/97/EG](32003L0097).

      2 In afwijking van het eerste lid voldoen vooruitkijkspiegels voor personenauto’s en bedrijfsauto’s met ingang van
      26 januari 2007 aan [richtlijn 2003/97/EG](32003L0097).

      3 Het eerste en het tweede lid zijn niet van toepassing op een spiegel, bestemd om als vervangingsonderdeel te
      worden gemonteerd op voertuigen waarvoor een EG-typegoedkeuring is verleend overeenkomstig [richtlijn 71/127/EEG]
      (31971L0127).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.14
  - number: 3.8.15
    text: |-
      De systemen, onderdelen en technische eenheden, bedoeld in Bijlage II, hoofdstuk B, deel I, van [richtlijn 2003/37/
      EG](32003L0037), waarvoor een typegoedkeuring kan worden verleend, voldoen aan het bepaalde in de op grond van
      Bijlage II, hoofdstuk B, deel I, van [richtlijn 2003/37/EG](32003L0037) bij het desbetreffende systeem, het
      onderdeel of de technische eenheid behorende bijzondere richtlijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.15
  - number: 3.8.16
    text: |-
      Systemen, onderdelen en technische eenheden bestemd voor personenauto’s, bedrijfsauto’s en aanhangwagens waarvoor
      een typegoedkeuring kan worden verleend, voldoen voor wat betreft elektromagnetische compatibiliteit aan de
      bijlagen I tot en met X van [richtlijn 72/245/EEG](31972L0245).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.16
  - number: 3.8.17
    text: |-
      Frontbeschermingsinrichtingen bestemd voor personenauto’s met een toegestane maximum massa van niet meer dan 3500
      kg of bedrijfsauto’s met een toegestane maximum massa van niet meer dan 3500 kg, niet zijnde bussen, waarvoor als
      technische eenheden een typegoedkeuring kan worden verleend, voldoen met ingang van 25 november 2006 wat betreft de
      veiligheid van voetgangers en andere kwetsbare weggebruikers aan [richtlijn 2005/66/EG](32005L0066).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.8.17
  - number: '3.9'
    text: |-
      Voertuigen van de categorieën N en O als omschreven in artikel 2 en Bijlage II van [Richtlijn 70/156/EEG]
      (31970L0156), bestemd voor het vervoer van gevaarlijke goederen, moeten, onverminderd de overige bepalingen van
      dit hoofdstuk, tevens voldoen aan de bepalingen van [Richtlijn nr. 98/91/EG](31998L0091) van het Europees Parlement
      en de Raad van de Europese Unie van 14 december 1998 betreffende motorvoertuigen en aanhangers daarvan bestemd
      voor het vervoer van gevaarlijke goederen over de weg en tot wijziging van [Richtlijn nr.70/156/EEG](31970L0156)
      betreffende de typegoedkeuring van motorvoertuigen en aanhangers daarvan.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.9
  - number: 3.10.1
    text: |-
      1 Landbouw- of bosbouwtrekkers categorieën T1, T2 en T3 voldoen met ingang van 1 juli 2005 voor het verkrijgen van
      een typegoedkeuring als bedoeld in artikel 4, onderdeel a, van [richtlijn 2003/37/EG](32003L0037) voor toelating
      tot het verkeer op de weg aan de in deze afdeling vermelde eisen.

      2 Landbouw- of bosbouwtrekkers categorie T5 voldoen met ingang van 1 juli 2005 voor het verkrijgen van een
      typegoedkeuring voor toelating tot het verkeer op de weg aan de in deze afdeling vermelde eisen.

      3 Met een typegoedkeuring, bedoeld in het tweede lid, wordt gelijkgesteld een verklaring van goedkeuring, afgegeven
      door een onafhankelijke keuringsinstelling in een andere lidstaat van de Europese Unie dan wel een staat, niet
      zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag
      dat Nederland bindt, welke verklaring is afgegeven op basis van onderzoekingen die een beschermingsniveau bieden
      dat ten minste gelijkwaardig is aan het niveau dat met de nationale onderzoekingen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.10.1
  - number: 3.10.2
    text: Landbouw- of bosbouwtrekkers zijn van deugdelijke bouw en inrichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.10.2
  - number: 3.10.3
    text: |-
      Landbouw- of bosbouwtrekkers categorieën T1, T2, T3 en T5 voldoen voor wat betreft de voorgeschreven platen aan
      [richtlijn 89/173/EEG](31989L0173).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.10.3
  - number: 3.10.6
    text: |-
      Landbouw- of bosbouwtrekkers categorieën T1, T2, T3 en T5 voldoen voor wat betreft de afmetingen aan [richtlijn
      89/173/EEG](31989L0173).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.10.6
  - number: 3.10.9
    text: |-
      Landbouw- of bosbouwtrekkers categorieën T1, T2, T3 en T5 voldoen voor wat betreft de massa in volbelaste toestand
      aan [richtlijn 74/151/EEG](31974L0151).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.10.9
  - number: 3.10.10
    text: |-
      Landbouw- of bosbouwtrekkers categorieën T1, T2, T3 en T5 voldoen voor wat betreft de maximaal getrokken massa aan
      [richtlijn 89/173/EEG](31989L0173).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.10.10
  - number: 3.10.12
    text: |-
      Landbouw- of bosbouwtrekkers categorieën T1, T2, T3 en T5 voldoen voor wat betreft reservoirs voor vloeibare
      brandstof aan [richtlijn 74/151/EEG](31974L0151).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.10.12
  - number: 3.10.14
    text: |-
      Landbouw- of bosbouwtrekkers categorieën T1, T2, T3 en T5 voldoen voor wat betreft de elektromagnetische
      compatibiliteit aan [richtlijn 75/322/EEG](31975L0322).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.10.14
