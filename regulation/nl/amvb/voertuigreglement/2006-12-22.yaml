  - number: 5.3.62
    text: |-
      Het ingeschakeld zijn van het mistlicht of de mistlichten aan de achterzijde van het voertuig moet door middel van
      een controlelampje aan de bestuurder kenbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.62
  - number: 5.3.63
    text: |-
      Achteruitrijlichten van bedrijfsauto’s mogen alleen kunnen branden indien de achteruitversnelling van het voertuig
      is ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.63
  - number: 5.3.64
    text: |-
      1 Bedrijfsauto’s mogen, met uitzondering van grote lichten, niet zijn voorzien van verblindende verlichting.

      2 Bedrijfsauto’s mogen, met uitzondering van de richtingaanwijzers en de waarschuwingsknipperlichten, niet zijn
      voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.64
  - number: 5.3.65
    text: |-
      Bedrijfsauto's mogen, onverminderd het in de [artikelen 29][ref1] en [30 van het RVV][ref2] bepaalde inzake zwaai-
      en knipperlichten, niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de artikelen
      5.3.51 en 5.3.57 is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel30
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.65
