        bwb_id: BWBR0004825
        artikel: '29'
  - number: 5.3.16
    text: |-
      1 De onderdelen van de aandrijving van bedrijfsauto’s moeten deugdelijk zijn bevestigd.

      2 Stofhoezen van aandrijfassen moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de hoezen
      niet meer afdichten.

      3 Kruiskoppelingen moeten een zichtbaar spelingsvrije overbrenging kunnen bewerkstelligen.

      4 Onze Minister stelt regels vast met betrekking tot het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.16
  - number: 5.3.18
    text: |-
      1 De assen van bedrijfsauto’s moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen breuken of scheuren
      vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn bevestigd, beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht. Hieraan
      wordt voor wat betreft wielgeleidingselementen voldaan indien deze niet zijn doorgeroest.

      5 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid met betrekking tot de deugdelijkheid van
      de bevestiging.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.18
  - number: 5.3.19
    text: |-
      1 De fuseepennen, -lageringen, -bussen en -kogels van bedrijfsauto’s moeten deugdelijk zijn bevestigd.

      2 Stofhoezen van fuseekogels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de hoezen
      niet meer afdichten.

      3 De fuseepennen, -lageringen, -bussen en -kogels alsmede de overige draaipunten van de wielophanging mogen niet te
      veel speling vertonen.

      4 Indien een gedeelte van de binnenkant van het fuseekogelhuis en van de fuseekogel zichtbaar is doordat de hoes is
      beschadigd of ontbreekt, mag dit gedeelte geen corrosie vertonen.

      5 Onze Minister stelt regels vast omtrent het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.19
  - number: 5.3.20
    text: |-
      1 De wiellagers van bedrijfsauto’s mogen niet te veel speling vertonen.

      2 Verschijnselen van slijtage of beschadiging mogen niet hoorbaar of voelbaar zijn.

      3 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.20
  - number: 5.3.21
    text: |-
      1 De wielbasis van bedrijfsauto’s mag niet meer dan 1,0% afwijken van de waarde die voor het voertuig is vermeld op
      het kentekenbewijs of in het kentekenregister.

      2 Behoudens fabrieksmatige verschillen mag de wielbasis links en rechts gemeten niet meer dan:

      a. 15 mm verschillen bij bedrijfsauto’s met een toegestane maximum massa van ten hoogste 3500 kg;

      b. 0,5% afwijken van de hoogst gemeten waarde bij bedrijfsauto’s met een toegestane maximum massa van meer dan
      3500 kg.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.21
  - number: 5.3.22
    text: |-
      De afstanden tussen de fuseedraaipunten en twee punten aan het chassis dan wel aan de carrosserie, die symmetrisch
      links en rechts ten opzichte van de langsas van het voertuig zijn gelegen, mogen recht en kruiselings gemeten
      onderling niet meer dan:

      a. 15 mm verschillen bij bedrijfsauto’s met een toegestane maximum massa van ten hoogste 3500 kg;

      b. 0,5% afwijken van de hoogst gemeten waarde bij bedrijfsauto’s met een toegestane maximum massa van meer dan
      3500 kg.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.22
  - number: 5.3.23
    text: |-
      De spoorbreedte van bedrijfsauto’s met een toegestane maximum massa van niet meer dan 3500 kg mag niet meer dan
      2,0% groter zijn dan de waarde die voor het voertuig is vermeld op het kentekenbewijs of in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.23
  - number: 5.3.24
    text: |-
      1 De wielen onderscheidenlijk velgen van bedrijfsauto’s mogen geen breuken, scheuren, ondeugdelijk laswerk of
      ernstige vervorming vertonen.

      2 De wielen onderscheidenlijk velgen moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.24
  - number: 5.3.25
    text: De wielnaven van bedrijfsauto’s moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.25
  - number: 5.3.26
    text: |-
      Stabilisatoren moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn bevestigd en mogen:

      a. geen breuken of scheuren vertonen;

      b. niet te veel speling op de draaipunten vertonen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.26
  - number: 5.3.27
    text: |-
      1 De wielen van bedrijfsauto’s moeten zijn voorzien van luchtbanden.

      2 De banden mogen geen beschadigingen vertonen waarbij het karkas zichtbaar is.

      3 De banden mogen geen uitstulpingen vertonen.

      4 De profilering van de hoofdgroeven van de banden van bedrijfsauto’s met een toegestane maximum massa van niet
      meer dan 3500 kg en van T100-bussen moet over de gehele omtrek van het loopvlak ten minste 1,6 mm bedragen, met
      uitzondering van slijtage-indicatoren.

      5 De banden van bedrijfsauto’s mogen niet zijn opgesneden. Van opsnijden is sprake indien slijtage-indicatoren zijn
      weggesneden, indien de profielvorm van de groef afwijkt van de originele profielvorm, of indien in de bodem van de
      groef het karkas van de band zichtbaar is. In afwijking van het hiervoor bepaalde is opsnijden toegestaan indien de
      mogelijkheid daartoe op de band is vermeld door de aanduiding "REGROOVABLE" of door het teken "

      ", met dien verstande dat het karkas van de band niet zichtbaar mag zijn.

      6 De banden op een as moeten dezelfde karkasstructuur hebben, onverminderd het bepaalde in [artikel 5.18.32][ref1].

      7 De op de band van een bedrijfsauto, in gebruik genomen na 31 december 1997, en op de band van een T100-bus
      vermelde load-index mag niet kleiner zijn dan de load-index, behorende bij de maximum last per band van de in het
      kentekenregister vermelde aslast.

      8 Het loopvlak van de banden mag geen metalen elementen bevatten die tijdens het rijden daarbuiten kunnen
      uitsteken.

      9 Onze Minister stelt regels vast omtrent het bepaalde in het zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.32
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.27
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.18.32
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: '18'
  - number: 5.3.28
    text: |-
      1 Bedrijfsauto's moeten zijn voorzien van een goed werkend veersysteem. Banden worden niet als deel van het
      veersysteem beschouwd.

      2 De onderdelen van het veersysteem mogen geen breuken of scheuren vertonen, mogen niet ernstig door corrosie zijn
      aangetast en moeten deugdelijk zijn bevestigd. Bij luchtveerbalgen mogen de koordlagen zichtbaar zijn, maar niet
      beschadigd.

      3 Bedrijfsauto's die zijn voorzien van gasvering, en bedrijfsauto's met een toegestane maximum massa van ten
      hoogste 3500 kg, moeten zijn voorzien van goed werkende schokdempers.

      4 Schokdempers van bedrijfsauto's moeten deugdelijk zijn bevestigd.

      5 Onze Minister stelt regels vast omtrent het bepaalde in het tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.28
  - number: 5.3.29
    text: |-
      1 De bestuurde wielen van bedrijfsauto’s moeten goed reageren op de draaiing van het stuurwiel.

      2 Bij draaiing van het stuurwiel tot aan de aanslagen mogen geen weerstanden voelbaar zijn en moeten de wielen
      onderscheidenlijk de banden vrij kunnen draaien.

      3 De voor de overbrenging van de stuurbeweging bestemde onderdelen moeten deugdelijk zijn bevestigd met alle
      daarvoor bestemde bevestigings- en borgmiddelen, mogen geen breuken of scheuren vertonen, mogen niet zijn vervormd
      en mogen niet ernstig door corrosie zijn aangetast.

      4 Stofhoezen van het stuurhuis en de stuurkogels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn
      beschadigd dat de hoezen niet meer afdichten.

      5 Kruiskoppelingen moeten een zichtbaar spelingsvrije overbrenging kunnen bewerkstelligen.

      6 Flexibele koppelingen mogen niet in ernstige mate zijn gescheurd en de vulcanisatie mag niet in ernstige mate
      zijn losgeraakt.

      7 De verbindingen in het stangenstelsel mogen niet te veel speling vertonen.

      8 Indien een gedeelte van de binnenkant van het stuurkogelhuis en van de stuurkogel zichtbaar is doordat de hoes is
      beschadigd of ontbreekt, mag dit gedeelte geen corrosie vertonen.

      9 Slangen ten behoeve van de stuurbekrachtiger mogen geen beschadigingen vertonen waarbij het wapeningsmateriaal
      zichtbaar is en mogen geen bewegende delen raken.

      10 Onze Minister stelt regels vast omtrent het bepaalde in het derde, zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.29
  - number: 5.3.31
    text: |-
      1 Bedrijfsauto’s moeten zijn voorzien van een reminrichting waarvan de onderdelen:

      a. deugdelijk zijn bevestigd met de daarvoor bestemde bevestigings- en borgmiddelen;

      b. niet in ernstige mate door corrosie zijn aangetast;

      c. niet zijn beschadigd, gescheurd of gebroken;

      d. geen inwendige of uitwendige lekkage vertonen.

      2 De rembekrachtiger en de hydraulische remkrachtregelaar moeten goed functioneren.

      3 De compressor en de drukregelaar moeten goed functioneren en tijdig in werking treden.

      4 Bij hydraulische remsystemen mag bij het bedienen van het rempedaal de slag van het pedaal niet door een aanslag
      worden beperkt.

      5 Het oppervlak van het rempedaal moet stroef zijn.

      6 Remslangen mogen:

      a. niet in ernstige mate zijn misvormd;

      b. niet langs andere voertuigdelen schuren;

      c. geen zodanige beschadigingen vertonen dat het wapeningsmateriaal zichtbaar is.

      7 Kunststofremleidingen mogen geen knikken vertonen.

      8 Wielen die zijn voorzien van een trommelrem, moeten in onberemde toestand in beide richtingen kunnen draaien
      zonder dat de remvoering aanloopt. De remvoering van wielen die zijn voorzien van een schijfrem, mag in onberemde
      toestand in beide richtingen enigszins slepen.

      9 De remtrommel of remschijf mag tijdens het remmen niet worden geraakt door delen die zijn bestemd als drager of
      bevestigingsmiddel van remvoering.

      10 De noodzakelijke bewegingsvrijheid van de remonderdelen mag niet worden beperkt.

      11 Remcylinders moeten zijn voorzien van stofhoezen die niet in ernstige mate mogen zijn beschadigd.

      12 Anti-blokkeersystemen moeten goed functioneren en moeten zijn voorzien van een deugdelijke
      waarschuwingsinrichting die in werking treedt zodra het systeem faalt.

      13 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid, onderdelen *a* en *b*, het zesde lid,
      onderdeel *a*, het zevende lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.31
  - number: 5.3.32
    text: |-
      1 Bedrijfsauto’s met een hydraulisch remsysteem, in gebruik genomen na 30 juni 1967, moeten indien het remsysteem
      niet is voorzien van een toegankelijk remvloeistofreservoir, waarvan het vloeistofpeil te controleren is zonder het
      reservoir te openen, zijn voorzien van:

      a. een deugdelijke waarschuwingsinrichting die in werking treedt zodra het niveau van de remvloeistof onder het
      vereiste minimum niveau is gedaald, of

      b. in geval van een gescheiden remsysteem, een deugdelijke waarschuwingsinrichting die in werking treedt zodra een
      van de kringen van het remsysteem faalt.

      2 De goede werking van het signaal van de in het eerste lid bedoelde waarschuwingsinrichtingen moet kunnen worden
      gecontroleerd.

      3 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.32
  - number: 5.3.33
    text: |-
      Bedrijfsauto’s met een drukluchtremsysteem, die in gebruik zijn genomen na 30 juni 1967, moeten zijn voorzien van
      een waarschuwingsinrichting die in werking treedt zodra de energievoorraad in een van de bedrijfsremkringen onder
      de vereiste minimum druk is gedaald.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.33
  - number: 5.3.34
    text: |-
      Bedrijfsauto’s met een veerrem, die in gebruik zijn genomen na 30 september 1975, moeten zijn voorzien van een
      optische of akoestische waarschuwingsinrichting die in werking treedt zodra de veerrem in werking is gesteld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.34
  - number: 5.3.35
    text: |-
      1 Bedrijfsauto’s met een geheel of gedeeltelijk drukluchtremsysteem moeten zijn voorzien van:

      a. drukmeetpunten waarmee de drukken die worden ingestuurd in de drukluchtremcylinders op iedere as, kunnen worden
      gemeten;

      b. een drukmeetpunt waarmee de druk vóór elke drukluchtremkrachtregelaar kan worden gemeten;

      c. een goed functionerend meerkringsbeveiligingsventiel indien het voertuig in gebruik is genomen na 30 september
      1975.

      2 Drukluchtremkrachtregelaars moeten goed functioneren.

      3 Bedrijfsauto’s met drukluchtremkrachtregelaars, in gebruik genomen na 30 september 1981, moeten zijn voorzien
      van een plaat waarop duidelijk leesbaar de afstelling van de drukluchtremkrachtregelaars is vermeld. De vermelde
      drukluchtremkrachtregelaars moeten aanwezig zijn en moeten globaal zijn afgesteld zoals voor de beladingstoestand
      van het voertuig is vermeld op genoemde plaat.

      4 De ontwateringsventielen van reservoirs moeten goed functioneren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.35
  - number: 5.3.36
    text: |-
      1 De slag van drukluchtremcylinders die door middel van een nok een trommelrem bedienen, mag niet worden begrensd
      door delen die daar niet voor zijn bestemd.

      2 De slag van drukluchtremcylinders van trommelremmen mag vanuit onberemde toestand tot in beremde stand niet
      groter zijn dan 2/3 van de maximum slag van de betrokken remcylinder.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.36
  - number: 5.3.37
    text: |-
      1 Bedrijfsauto’s met een tweeleidingremsysteem ten behoeve van aanhangwagens moeten aan de aansluitkop van
      de voorraadleiding een druk bezitten met een grenswaarde van 6,5 tot 8,5 bar, en aan de aansluitkop van de
      commandoleiding, bij een maximale voorraaddruk, een druk met een grenswaarde van 6,0 tot 8,5 bar.

      2 Bedrijfsauto’s, in gebruik genomen na 31 december 1997 mogen niet zijn voorzien van een éénleidingremsysteem ten
      behoeve van een aanhangwagen.

      3 Bij bedrijfsauto’s met een éénleidingremsysteem ten behoeve van aanhangwagens moet aan de aansluitkop de
      voorraaddruk van het remsysteem aanwezig zijn. Deze druk moet ten minste 5 doch niet meer dan 6 bar bedragen.

      4 Bedrijfsauto's in gebruik genomen na 31 december 1997 mogen niet zijn voorzien van een afzonderlijke inrichting
      voor de bediening van de remmen van de aanhangwagen.

      5 Bij bedrijfsauto’s in gebruik genomen na 31 december 1997 moeten de voorraad- en commandoleiding zijn voorzien
      van goedwerkende automatische afsluiters.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.37
  - number: 5.3.38
    text: |-
      1 Bedrijfsauto’s, in gebruik genomen na 31 december 1997, en bussen, in gebruik genomen na 30 juni 1967, moeten
      zijn voorzien van een bedrijfsrem waarvan de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal
      liggende weg ten minste 4,5 m/s2 bedraagt, bij een pedaalkracht van niet meer dan 700 N.

      2 Bedrijfsauto’s, in gebruik genomen na 30 juni 1967 doch voor 1 januari 1998, met uitzondering van bussen, moeten
      zijn voorzien van een bedrijfsrem waarvan de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal
      liggende weg ten minste 4,0 m/s2 bedraagt, bij een pedaalkracht van niet meer dan 700 N.

      3 Bedrijfsauto’s, in gebruik genomen voor 1 juli 1967, moeten zijn voorzien van een bedrijfsrem waarvan de
      remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 3,8 m/s2 bedraagt.

      4 De bedrijfsrem moet op alle wielen werken.

      5 Bedrijfsauto’s mogen op een droge of nagenoeg droge weg niet uitbreken ten gevolge van een verschil in remwerking
      tussen de wielen van elke as onderscheidenlijk ten gevolge van overberemming van de achteras.

      6 Onze Minister stelt regels vast met betrekking tot het bepaalde in het eerste, tweede, derde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.38
  - number: 5.3.39
    text: |-
      1 Bedrijfsauto’s moeten zijn voorzien van een parkeerrem die op ten minste twee wielen werkt.

      2 De parkeerrem van bedrijfsauto’s, in gebruik genomen na 30 juni 1967, moet het voertuig op een helling van 16,0%
      in beide richtingen in stilstand kunnen houden. Hieraan wordt geacht te zijn voldaan indien de remvertraging,
      uitgaande van een aanvangssnelheid van 15 km/h, op een droge of nagenoeg droge en ongeveer horizontaal liggende weg
      ten minste 1,2 m/s2 bedraagt en de rem ook in achterwaartse richting functioneert.

      3 De remvertraging van de parkeerrem van bedrijfsauto’s, in gebruik genomen voor 1 juli 1967, moet op een droge of
      nagenoeg droge en ongeveer horizontaal liggende weg ten minste 1,0 m/s2 bedragen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.39
  - number: 5.3.40
    text: |-
      1 Indien de bedrijfsauto na 30 juni 1967 in gebruik is genomen en is voorzien van een geheel afzonderlijk
      hulpremsysteem, moet:

      a. het hulpremsysteem goed functioneren;

      b. de remwerking redelijk gelijkmatig over de wielen links en rechts van de as zijn verdeeld.

      2 De remvertraging van het in het eerste lid bedoelde hulpremsysteem moet op een droge of nagenoeg droge en
      ongeveer horizontaal liggende weg ten minste 2,0 m/s2 bedragen indien het een bedrijfsauto, niet zijnde een bus,
      betreft, en ten minste 2,2 m/s2 bedragen indien het een bus betreft.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.40
  - number: 5.3.41
    text: |-
      1 De deuren en de laadbakkleppen van bedrijfsauto’s moeten goed sluiten. De deuren die direkt toegang geven tot de
      personenruimte, moeten op normale wijze vanaf de binnenzijde of vanaf de buitenzijde kunnen worden geopend.

      2 Het slot en de scharnieren van de motorkap of het kofferdeksel aan de voorzijde van het voertuig moeten een goede
      sluiting waarborgen.

      3 De bevestiging van de scharnieren van de deuren, de motorkap en het kofferdeksel mag niet in ernstige mate door
      corrosie zijn aangetast.

      4 Bedrijfsdeuren en nooddeuren van een stilstaande bus die na 12 februari 2004 in gebruik is genomen, moeten van
      binnen en van buiten kunnen worden geopend.

      5 Constructie en bedieningssysteem van een bedrijfsdeur van een bus in gebruik genomen na 12 februari 2004, moet
      zodanig zijn dat een passagier niet door een deur verwond kan worden of bij het sluiten tussen de deur bekneld
      kan raken.

      6 Bedrijfsdeuren en nooddeuren van een bus in gebruik genomen na 12 februari 2004 die niet volledig zijn gesloten,
      dienen een verklikker te activeren die voor de bestuurder goed waarneembaar is.

      7 Noodluiken van een bus in gebruik genomen na 12 februari 2004, dienen gemakkelijk van binnen en van buiten te
      kunnen worden geopend of verwijderd. De vrije doorgang mag daarbij niet worden belemmerd.

      8 Noodramen van een bus in gebruik genomen na 12 februari 2004, moeten op geschikte wijze kunnen worden
      geopend met een als toereikend beschouwde voorziening. Een scharnierend noodraam dat niet duidelijk vanuit de
      bestuurderszitplaats zichtbaar is, dient te zijn uitgerust met een akoestische voorziening om de bestuurder te
      waarschuwen wanneer het raam niet volledig gesloten is.

      9 Nooduitgangen en de noodbedieningsinrichtingen van bedrijfsdeuren en van alle nooduitgangen van een bus in
      gebruik genomen na 12 februari 2004, dienen als zodanig aan de binnen- en buitenzijde van het voertuig te zijn
      aangeduid, hetzij door een representatief symbool, hetzij door een duidelijk geformuleerd opschrift, en voorzien
      van duidelijke aanwijzingen over de bedieningswijze.

      10 Bij regeling van Onze Minister kunnen regels gesteld worden omtrent het bepaalde in het derde tot en met negende
      lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.41
  - number: 5.3.41a
    text: |-
      1 Een bus in gebruik genomen na 12 februari 2004, moet voor wat betreft de binneninrichting voldoen aan de volgende
      eisen:

      a. de toegang tot bedrijfsdeuren, nooddeuren en noodramen moet vrij zijn van obstakels en uitstekende voorwerpen
      die tot de inrichting behoren.

      b. er moeten voorzieningen zijn om de bestuurder te beschermen tegen verblinding door en weerkaatsing van de
      binnenverlichting;

      c. vormen van visueel vermaak voor passagiers moeten zich buiten het gezichtsveld van de bestuurder bevinden.

      2 Bij regeling van Onze Minister kunnen regels gesteld worden omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.41a
  - number: 5.3.42
    text: |-
      1 De voorruit en de zijruiten van bedrijfsauto’s mogen:

      a. geen beschadigingen of verkleuringen vertonen,

      b. niet zijn voorzien van onnodige voorwerpen,

      die het uitzicht van de bestuurder belemmeren.

      2 Indien de bedrijfsauto niet is voorzien van een rechterbuitenspiegel, mag de achterruit:

      a. geen beschadigingen of verkleuringen vertonen,

      b. niet zijn voorzien van onnodige voorwerpen,

      die het uitzicht van de bestuurder belemmeren.

      3 Onze Minister kan regels vaststellen omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.42
  - number: 5.3.43
    text: |-
      1 Bedrijfsauto's met een voorruit moeten zijn voorzien van een goed werkende ruitenwisserinstallatie die de
      bestuurder voldoende uitzicht geeft.

      2 Bedrijfsauto's met een voorruit, die na 31 december 1997 in gebruik zijn genomen, met uitzondering van bussen,
      moeten zijn voorzien van een goed werkende ruitensproeierinstallatie.

      3 Bussen die na 30 juni 1985 in gebruik zijn genomen, moeten zijn voorzien van een goed werkende
      ruitensproeierinstallatie.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.43
  - number: 5.3.44
    text: |-
      1 Bedrijfsauto's met een voorruit, die na 31 december 1997 in gebruik zijn genomen, met uitzondering van bussen,
      moeten zijn voorzien van een goed werkende installatie ter ontdooiing en ontwaseming van de voorruit.

      2 Bussen die na 30 juni 1985 in gebruik zijn genomen, moeten zijn voorzien van een goed werkende installatie ter
      ontdooiing en ontwaseming van de voorruit.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.44
  - number: 5.3.45
    text: |-
      1 Bedrijfsauto's moeten zijn voorzien van een linkerbuitenspiegel en van een rechterbuitenspiegel.

      2 In afwijking van het bepaalde in het eerste lid mogen voor het vervoer van goederen bestemde bedrijfsauto's met
      een toegestane maximum massa van niet meer dan 3500 kg, in gebruik genomen voor 26 januari 2011, zijn voorzien van
      een linkerbuitenspiegel en van een binnenspiegel indien het gezichtsveld van de binnenspiegel zodanig is dat de
      bestuurder ten minste een vlak en horizontaal weggedeelte, waarvan het midden in het verticale vlak door de lengte-
      as van het voertuig ligt, kan overzien vanaf een afstand van 60,00 m van de achterzijde van het voertuig tot aan de
      horizon over een breedte van 20,00 m.

      3 Voor het vervoer van goederen bestemde bedrijfsauto’s met een toegestane maximum massa van niet meer dan 3500
      kg, in gebruik genomen na 25 januari 2011, zijn tevens voorzien van een binnenspiegel tenzij het gezichtsveld van
      deze spiegel niet zodanig is dat de bestuurder ten minste een vlak en horizontaal weggedeelte, waarvan het midden
      in het verticale vlak door de lengteas van het voertuig ligt, kan overzien vanaf een afstand van 60,00 m van de
      achterzijde van het voertuig tot aan de horizon over een breedte van 20,00 m.

      4 Bedrijfsauto's, bestemd voor het vervoer van goederen, met een toegestane maximum massa van meer dan 7500 kg,
      alsmede rijdende werktuigen, zijn aan de rechterzijde tevens voorzien van een trottoirspiegel.

      5 De trottoirspiegel moet zodanig zijn aangebracht dat geen enkel punt van de spiegel of van de steun waarop deze
      is gemonteerd, zich op een hoogte van minder dan 2,00 m boven het wegdek bevindt. Indien de hoogte van de cabine
      zodanig is dat niet aan dit voorschrift kan worden voldaan, mag de bedrijfsauto niet van een trottoirspiegel zijn
      voorzien.

      6 Bedrijfsauto's, bestemd voor het vervoer van goederen, met een toegestane maximum massa van meer dan 3500
      kg, waarvan de linker- of rechterbuitenspiegel niet convex is, en bedrijfsauto's, bestemd voor het vervoer
      van goederen, met een toegestane maximum massa van meer dan 7500 kg, moeten tevens zijn voorzien van een
      breedtespiegel. Deze verplichting geldt niet indien het voertuig is voorzien van een breedtespiegel waarmee wordt
      voldaan aan het bepaalde in [artikel 5.3.45a, eerste of tweede lid][ref1].

      7 Voor het vervoer van goederen bestemde bedrijfsauto’s met frontstuur, met een toegestane maximum massa van meer
      dan 7500 kg, in gebruik genomen na 25 januari 2008, zijn tevens voorzien van:

      a. een vooruitkijkspiegel dan wel een camera-monitorsysteem en

      b. een breedtespiegel aan de bestuurderszijde.

      8 De vooruitkijkspiegel is zodanig aangebracht dat geen enkel punt van de spiegel of van de steun waarop deze
      is gemonteerd, zich op een hoogte van minder dan 2,00 m boven het wegdek bevindt. Indien de hoogte van de cabine
      zodanig is dat niet aan dit voorschrift kan worden voldaan, mag de bedrijfsauto niet van een vooruitkijkspiegel
      zijn voorzien en is geen andere inrichting voor indirect zicht vereist.

      9 In afwijking van het vierde lid is een trottoirspiegel niet vereist indien het daarvoor voorgeschreven
      gezichtsveld wordt verkregen door een combinatie van een vooruitkijkspiegel en een breedtespiegel.

      10 De aan de zijde van de bestuurder bevestigde buitenspiegel moet vanuit de binnenzijde bij gesloten portier
      kunnen worden versteld. Deze eis geldt niet voor bedrijfsauto's die vóór 1 januari 1975 in gebruik zijn genomen.
      De spiegels van deze voertuigen moeten, na door een duw te zijn omgeklapt, zonder verstelling in de oorspronkelijke
      stand terug kunnen klappen.

      11 De spiegels en camera-monitorsystemen zijn deugdelijk bevestigd.

      12 Het spiegelglas van de verplichte spiegels mag geen verschijnselen van breuk vertonen en mag niet in ernstige
      mate zijn verweerd.

      13 Onze Minister stelt regels vast met betrekking tot de gezichtsvelden van de verplichte spiegels en camera-
      monitorsystemen.


