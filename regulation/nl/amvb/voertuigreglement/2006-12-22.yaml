  - number: 5.3.47a
    text: |-
      1 In bedrijfsauto's die na 30 september 2000 in gebruik zijn genomen, moet bij iedere passagierszitplaats met
      airbag duidelijk zichtbaar en duurzaam zijn aangebracht het volgende symbool

      2 Het eerste lid is niet van toepassing indien het voertuig is voorzien van een mechanisme dat automatisch de
      aanwezigheid van een naar achteren gericht bevestigingssysteem voor kinderen signaleert en dat ervoor zorgt dat de
      airbag niet wordt opgeblazen wanneer een dergelijk systeem is aangebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.47a
  - number: 5.3.48
    text: |-
      1 Bedrijfsauto’s mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor
      andere weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen van bedrijfsauto’s, die in geval van botsing
      het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn afgeschermd.

      3 Het bepaalde in het eerste en tweede lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m boven
      het wegdek bevinden.

      4 De wielen onderscheidenlijk banden van bedrijfsauto's in gebruik genomen na 31 december 1974 moeten
      zijn afgeschermd overeenkomstig de door Onze Minister vastgestelde eisen en mogen niet aanlopen. De wielen
      onderscheidenlijk banden van bedrijfsauto's in gebruik genomen voor 1 januari 1975 moeten deugdelijk zijn
      afgeschermd en mogen niet aanlopen.

      5 Bedrijfsauto’s in gebruik genomen na 31 december 1969, moeten zijn voorzien van zijdelingse afscherming. Deze
      verplichting geldt niet voor:

      a. trekkers;

      b. bedrijfsauto’s die blijkens een aantekening op het kentekenbewijs hiervan zijn uitgezonderd;

      c. het gedeelte achter de achterste as van bedrijfsauto’s met een toegestane maximum massa van niet meer dan 3500
      kg.

      6 Een reservewielhouder die zich aan de buitenzijde van de bedrijfsauto bevindt, moet deugdelijk zijn bevestigd.
      Indien in de houder een reservewiel is geplaatst, moet dat wiel goed zijn opgesloten.

      7 Geen deel aan de buitenzijde van de bedrijfsauto mag zodanig zijn bevestigd, beschadigd, versleten of door
      corrosie zijn aangetast, dat gevaar bestaat voor losraken.

      8 De beweging van een intrekbare trede van een bus in gebruik genomen na 12 februari 2004, mag geen letsel kunnen
      toebrengen aan passagiers of mensen buiten de bus.

      9 Bussen van klasse I in gebruik genomen na 12 februari 2004, moeten voorzien zijn van:

      a. een deugdelijk functionerend knielsysteem tezamen met een deugdelijk functionerende lift of oprijplaat,

      b. duidelijk gemarkeerde bedieningsinrichtingen voorzien van een verklikkerinrichting bij een aanwezige lift of
      oprijplaat,

      c. een deugdelijke voorziening die de stabiliteit van de rolstoel en de veiligheid van de rolstoelgebruiker
      waarborgt, en

      d. ten minste vier gereserveerde zitplaatsen voor mensen met een mobiliteitshandicap, voorzien van handgrepen en
      dichtbij een geschikte bedrijfsdeur.

      10 Op bussen van een andere klasse dan klasse I, in gebruik genomen na 12 februari 2004 en die voorzien zijn van
      technische voorzieningen ter verbetering van de toegang voor personen met een mobiliteitshandicap, is het vorige
      lid van overeenkomstige toepassing met dien verstande dat het aantal gereserveerde zitplaatsen voor mensen met
      een mobiliteitshandicap voor bussen van klasse II en III ten minste twee bedraagt, en voor bussen van klasse A
      en B ten minste één. Een stoel die wordt ingeklapt wanneer hij niet wordt gebruikt, mag niet worden aangeduid als
      gereserveerde zitplaats.

      11 Voor bussen als bedoeld in het negende en tiende lid geldt, dat bussen van klasse I en II moeten zijn
      voorzien van ten minste twee, en bussen van klasse A van ten minste een naar voren of naar achteren gerichte
      zitplaats, speciaal bedoeld en van merktekens voorzien voor andere passagiers met een mobiliteitshandicap dan
      rolstoelgebruikers. Deze plaatsen moeten dicht bij een voor deze passagiers geschikte ingang geplaatst zijn.

      12 Bij regeling van Onze Minister kunnen regels gesteld worden omtrent het bepaalde in het vierde, vijfde en
      achtste tot en met elfde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.48
  - number: 5.3.49
    text: |-
      1 Bedrijfsauto’s die na 30 juni 1967 in gebruik zijn genomen, moeten aan de achterzijde op deugdelijke wijze zijn
      voorzien van een stootbalk, indien de afstand van de onderzijde van het voertuig tot het wegdek, gemeten over
      de volle breedte onder de achterzijde van het onderstel of onder de hoofddelen van het koetswerk op een afstand
      van meer dan 1,00 m achter de achterste as, meer bedraagt dan 0,70 m dan wel meer bedraagt dan 0,55 m indien het
      voertuig na 31 december 1997 in gebruik is genomen.

      2 De afstand van de onderzijde van de stootbalk tot het wegdek mag voor bedrijfsauto’s, in gebruik genomen na 30
      juni 1967 doch vóór 1 januari 1998, niet meer bedragen dan 0,70 m en voor bedrijfsauto’s, in gebruik genomen na 31
      december 1997, niet meer bedragen dan 0,55 m.

      3 Indien de bedrijfsauto in gebruik is genomen na 31 december 2004 mag de stootbalk niet meer dan 0,40 m voor het
      achterste punt van het voertuig zijn gelegen. Hierbij worden voertuigdelen boven 3,00 m gemeten vanaf het wegdek
      buiten beschouwing gelaten. In afwijking hiervan geldt voor bedrijfsauto's, ingericht als betonmolen, dat de
      stootbalk niet meer dan 0,60 m voor het achterste punt van het voertuig mag zijn gelegen.

      4 Indien de bedrijfsauto in gebruik is genomen na 30 juni 1967 doch voor 1 januari 2005 mag de stootbalk niet meer
      dan 0,60 m voor het achterste punt van het voertuig zijn gelegen. Hierbij worden voertuigdelen boven 2,00 m gemeten
      vanaf het wegdek buiten beschouwing gelaten.

      5 De stootbalk van bedrijfsauto's mag niet breder zijn noch aan weerszijden meer dan 0,10 m smaller zijn dan:

      a. het voertuig op de plaats waar de stootbalk is aangebracht, dan wel

      b. de breedte van de breedste achteras, met inbegrip van de wielen waarbij de bolling van de banden boven het
      wegdek buiten beschouwing wordt gelaten.

      Voor bedrijfsauto's die zijn bestemd voor het vervoer van wissellaadbakken geldt in plaats van de genoemde maat van
      0,10 m een maat van 0,20 m.

      6 De stootbalk en de bevestiging daarvan mogen niet zodanig zijn vervormd of breuken of scheuren vertonen, dan wel
      door corrosie zijn aangetast, dat hierdoor functieverlies optreedt.

      7 De uiteinden van de stootbalk mogen niet naar achteren zijn omgebogen.

      8 Het bepaalde in het eerste lid geldt niet voor:

      a. trekkers;

      b. voertuigen die blijkens een aantekening in het kentekenbewijs van het bepaalde in het eerste lid zijn
      uitgezonderd.

      9 Bedrijfsauto's, niet zijnde bussen, met een toegestane maximum massa van meer dan 3500 kg, in gebruik genomen na
      9 augustus 2004, moeten op deugdelijke wijze zijn voorzien van een beschermingsinrichting aan de voorzijde tegen
      klemrijden.

      10 De afstand van de onderzijde van de beschermingsinrichting tot het wegdek mag tussen de punten die meer dan
      0,20 m van de zijkanten van de voorste as van het voertuig zijn gelegen, met inbegrip van de wielen, niet meer dan
      0,45 m bedragen, waarbij de bolling van de banden boven het wegdek buiten beschouwing wordt gelaten.

      11 De afstand van de voorzijde van het voertuig tot de voorzijde van de beschermingsinrichting mag niet meer dan
      0,40 m bedragen, waarbij voertuigdelen die zich hoger dan 2,00 m boven het wegdek bevinden buiten beschouwing
      worden gelaten.

      12 De bescherminrichting mag:

      a. niet breder zijn dan de breedte van het voertuig met inbegrip van de spatborden van de voorste as;

      b. aan weerszijden niet meer dan 0,10 m smaller zijn dan de voorste as met inbegrip van de wielen, waarbij de
      bolling van de banden boven het wegdek buiten beschouwing wordt gelaten, of

      c. aan weerszijden niet meer dan 0,20 m smaller zijn dan het voertuig gemeten over de uiterste punten van de
      instaptrede naar de bestuurderscabine.

      13 De beschermingsinrichting aan de voorzijde en de bevestiging daarvan mogen niet zodanig zijn vervormd of breuken
      of scheuren vertonen, dan wel door corrosie zijn aangetast, dat hierdoor functieverlies optreedt.

      14 Het negende lid geldt niet voor:

      a. bedrijfsauto's die blijkens een aantekening in het kentekenbewijs of blijkens gegevens in het kentekenregister
      de toegevoegde categorie-aanduiding« G» als beschreven in bijlage I, punt 4, van [richtlijn 70/156/EEG](31970L0156)
      hebben;

      b. bedrijfsauto's waarvan het gebruik blijkens een aantekening in het kentekenbewijs onverenigbaar is met het
      voldoen aan de voorschriften voor een beschermingsinrichting aan de voorzijde tegen klemrijden.

      15 Het elfde en twaalfde lid zijn niet van toepassing op bedrijfsauto's met een toegestane maximum massa van niet
      meer dan 7500 kg.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.49
  - number: 5.3.51
    text: |-
      Bedrijfsauto’s moeten zijn voorzien van:

      a. twee of vier grote lichten;

      b. twee dimlichten, met dien verstande dat indien het voertuig is voorzien van dimlichten met
      gasontladingslichtbronnen en in gebruik is genomen na 31 december 2006, deze lichtbronnen voldoen aan door Onze
      Minister gestelde eisen, alsmede voor de installatie daarvan;

      c. twee stadslichten indien het voertuig na 30 juni 1967 in gebruik is genomen, dan wel twee of vier stadslichten
      indien het voertuig vóór 1 juli 1967 in gebruik is genomen;

      d. twee richtingaanwijzers aan de voorzijde en twee aan de achterzijde van het voertuig, dan wel één
      richtingaanwijzer aan elke zijkant indien het voertuig vóór 1 juli 1967 in gebruik is genomen; het licht van de
      richtingaanwijzers van bedrijfsauto`s in gebruik genomen na 30 juni 1967 moet knipperen;

      e. waarschuwingsknipperlichten indien het voertuig na 31 december 1997 in gebruik is genomen;

      f. één zijrichtingaanwijzer aan elke zijkant van het voertuig, indien het voertuig langer is dan 6,00 m dan wel na
      31 december 1997 in gebruik is genomen; voor voertuigen die voor 1 januari 1998 in gebruik zijn genomen worden de
      richtingaanwijzers aan de voorzijde van het voertuig beschouwd als zijrichtingaanwijzers indien het uitgestraalde
      licht hiervan duidelijk te zien is vanuit een punt gelegen op 6,00 m achter de voorzijde van het voertuig en 1,00 m
      zijwaarts;

      g. twee achterlichten indien het voertuig na 30 juni 1967 in gebruik is genomen, dan wel twee of vier achterlichten
      indien het voertuig vóór 1 juli 1967 in gebruik is genomen;

      h. twee remlichten indien het voertuig na 30 juni 1967 in gebruik is genomen, dan wel één of twee remlichten indien
      het voertuig vóór 1 juli 1967 in gebruik is genomen;

      i. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      j. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig, onderscheidenlijk twee
      driehoekige dan wel niet-driehoekige, rode retroreflectoren indien het een gelede bus betreft die in gebruik is
      genomen na 31 december 1994 doch voor 1 januari 2005;

      k. één of twee mistlichten aan de achterzijde van het voertuig indien het voertuig na 31 december 1997 in gebruik
      is genomen; in het geval van één mistlicht moet dit zich bevinden in of links van het middenlangsvlak van het
      voertuig;

      l. één of twee achteruitrijlichten indien het voertuig na 31 december 1997 in gebruik is genomen;

      m. twee markeringslichten aan de voorzijde en twee aan de achterzijde van het voertuig, indien het voertuig na
      31 december 1997 in gebruik is genomen en breder is dan 2,10 m, dan wel voor 1 januari 1998 in gebruik is genomen
      en breder is dan 2,60 m;

      n. zijmarkeringslichten indien het voertuig na 31 december 1997 in gebruik is genomen en langer is dan 6,00
      m, aangebracht overeenkomstig de door Onze Minister vastgestelde eisen; deze lichten zijn niet verplicht voor
      chassiscabines;

      o. niet-driehoekige ambergele retroreflectoren aan elke zijkant van het voertuig indien het voertuig langer is dan
      6,00 m, aangebracht overeenkomstig de door Onze Minister vastgestelde eisen;

      p. een markering aan de achterzijde van het voertuig, indien de toegestane maximum massa van het voertuig meer
      bedraagt dan 3500 kg en het voertuig in gebruik is genomen na 30 juni 1967; deze eis geldt niet voor trekkers,
      voertuigen die zijn ingericht voor het vervoer van meer dan acht personen, de bestuurder daaronder niet begrepen,
      alsmede door Onze Minister aangewezen voertuigen waarvan de bouw, de inrichting of het gebruik zich verzet tegen
      het aanbrengen van de markering.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.51
  - number: 5.3.53
    text: |-
      1 De grote lichten, dimlichten, stadslichten en achteruitrijlichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers en waarschuwingsknipperlichten alsmede de zijrichtingaanwijzers mogen naar voren niet
      anders dan ambergeel of wit en naar achteren niet anders dan ambergeel of rood stralen.

      3 De achterlichten en mistlichten aan de achterzijde mogen niet anders dan rood stralen.

      4 De remlichten mogen niet anders dan rood of ambergeel stralen.

      5 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.

      6 De markeringslichten mogen naar voren niet anders dan wit, en naar achteren niet anders dan rood stralen.

      7 De zijmarkeringslichten mogen niet anders dan ambergeel stralen. Indien het achterste zijmarkeringslicht
      onderdeel uitmaakt van een rood stralend licht dan wel van een rode retroreflector, mag dit licht rood stralen.

      8 De markering aan de achterzijde moet bestaan uit één rechthoekig bord, dan wel uit een set van twee of vier
      rechthoekige borden, welke zijn voorzien van rood fluorescerende en geel retroreflecterende parallel lopende
      diagonale strepen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.53
  - number: 5.3.55
    text: |-
      1 De in [artikel 5.3.51][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig zijn bevestigd.

      5 De in [artikel 5.3.51][ref2] bedoelde lichten en retroreflectoren, voorzover het het lichtdoorlatend
      gedeelte betreft, mogen ten hoogste een vierde deel zijn afgeschermd onverminderd het bepaalde in
      [artikel 5.18.7, eerste lid][ref3].

      6 De retroreflectoren en de markering aan de achterzijde van het voertuig mogen geen gebreken vertonen, die de
      retroreflectie beïnvloeden.

      7 Onze Minister kan regels vaststellen omtrent het bepaalde in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.51
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.7
