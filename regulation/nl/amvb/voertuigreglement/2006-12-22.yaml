  - number: 5.18.18a
    text: |-
      1 De massa van aanhangwagens met een bedrijfsremsysteem achter personenauto's mag niet meer bedragen dan:

      a. in het kentekenregister of op het kentekenbewijs van het trekkende voertuig is vermeld, hetzij

      b. de laagste waarde van:

      1°. de door de fabrikant bepaalde technisch toelaatbare getrokken maximum massa gebaseerd op de constructie van het
      trekkende voertuig of op de sterkte van de mechanische koppelinrichting,

      2°. de toegestane maximum massa van het trekkende voertuig.

      In elk geval mag de massa van aanhangwagens of de som van de aslasten van autonome aanhangwagens niet meer bedragen
      dan 3500 kg.

      2 De massa van aanhangwagens zonder een bedrijfsremsysteem achter personenauto's mag niet meer bedragen dan:

      a. in het kentekenregister of op het kentekenbewijs van het trekkende voertuig is vermeld, hetzij

      b. de laagste waarde van:

      1°. de door de fabrikant bepaalde technisch toelaatbare getrokken maximum massa van het trekkende voertuig,

      2°. de helft van de massa van het trekkende voertuig in bedrijfsklare toestand.

      In elk geval mag de massa van aanhangwagens of de som van de aslasten van autonome aanhangwagens niet meer bedragen
      dan 750 kg.

      3 De massa van aanhangwagens of de som van de aslasten van autonome aanhangwagens achter driewielige motorrijtuigen
      mag niet meer bedragen dan de in het kentekenregister of op het kentekenbewijs van het trekkend motorrijtuig
      vermelde toegestane maximum massa. In afwijking van [artikel 1.1, onderdeel ad][ref1], wordt bij het bepalen van de
      ledige massa de massa van de brandstof of de massa van de batterijen in elektrische voertuigen buiten beschouwing
      gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.18a
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '1.1'
        hoofdstuk: '1'
  - number: 5.18.19
    text: |-
      Aanhangwagens achter motorfietsen moeten in aangekoppelde toestand voldoen aan de volgende eisen:

      a. de breedte van het voertuig mag met inbegrip van de lading niet meer bedragen dan 1,00 m;

      b. de hoogte van het voertuig mag met inbegrip van de lading niet meer bedragen dan 1,00 m;

      c. de totale massa van het voertuig mag niet meer bedragen dan de helft van de ledige massa van de trekkende
      motorfiets;

      d. de afstand van de achteras van de trekkende motorfiets tot de achterzijde van de aanhangwagen met inbegrip van
      de lading mag niet meer bedragen dan 2,50 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.19
  - number: 5.18.20
    text: |-
      De lengte van samenstellen van landbouw- of bosbouwtrekker of motorrijtuig met beperkte snelheid en één of meer
      aanhangwagens in onbeladen toestand mag niet meer bedragen dan 18,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.20
  - number: 5.18.21
    text: |-
      1 De lengte van een landbouw- of bosbouwtrekker, een motorrijtuig met beperkte snelheid of een samenstel van
      landbouw- of bosbouwtrekker of motorrijtuig met beperkte snelheid en één of meer aanhangwagens mag met inbegrip
      van de lading niet meer bedragen dan de lengte van dat voertuig of samenstel van voertuigen in onbeladen toestand,
      vermeerderd met 1,00 m waarbij:

      a. de lading niet meer dan 1,00 m achter het voertuig mag uitsteken;

      b. de lading niet meer dan 5,00 m achter de achterste as van het voertuig mag uitsteken;

      c. de lading niet voor het voertuig mag uitsteken.

      2 In afwijking van het bepaalde in het eerste lid mag bij het vervoer van lading die redelijkerwijs niet in de
      lengte deelbaar is, met uitzondering van afzetbakken, wissellaadbakken en containers, de lengte van een landbouw-
      of bosbouwtrekker, een motorrijtuig met beperkte snelheid, of een samenstel van landbouw- of bosbouwtrekker of
      motorrijtuig met beperkte snelheid en één of meer aanhangwagens met inbegrip van de lading meer bedragen dan
      ingevolge het eerste lid is toegestaan waarbij:

      1°. de lading niet meer dan 5,00 m achter de achterste as van het voertuig mag uitsteken;

      2°. de lading niet meer dan 3,50 m voor het hart van het stuurwiel van het voertuig mag uitsteken;

      3°. de lading die meer dan 1,00 m achter het voertuig uitsteekt, aan de achterzijde moet zijn voorzien van een
      markering die voldoet aan de door Onze Minister vastgestelde eisen.

      3 De in het eerste lid onder *a* bedoelde lengtevermeerdering van 1,00 m mag alleen worden veroorzaakt door de
      lading en door een uitschuiflade of laadklep ter ondersteuning van de lading of door een uitschuifbare stootbalk.
      De lading mag niet uitsluitend op de uitschuiflade of op de laadklep rusten.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.21
  - number: 5.18.22
    text: |-
      1 De breedte van landbouw- of bosbouwtrekkers of motorrijtuigen met beperkte snelheid en daardoor voortbewogen
      aanhangwagens mag met inbegrip van de lading niet meer bedragen dan 3,00 m. Indien de lading bestaat uit losse
      veldgewassen mag de breedte van de lading niet meer dan 3,50 m bedragen.

      2 Op onverharde wegen mag de breedte van walsen, met inbegrip van de lading, niet meer dan 2,60 m bedragen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.22
  - number: 5.18.23
    text: |-
      De hoogte van landbouw- of bosbouwtrekkers en motorrijtuigen met beperkte snelheid alsmede daardoor voortbewogen
      aanhangwagens mag met inbegrip van de lading niet meer bedragen dan 4,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.23
  - number: 5.18.24
    text: |-
      1 De last onder de bestuurde as of assen van landbouw- of bosbouwtrekkers en motorrijtuigen met beperkte snelheid
      mag niet minder bedragen dan een vijfde deel van de ledige massa van het voertuig.

      2 De last onder de gestuurde as of assen, niet zijnde zelfsturende assen, van door landbouw- of bosbouwtrekkers of
      door motorrijtuigen met beperkte snelheid voortbewogen autonome aanhangwagens in beladen toestand, mag niet minder
      bedragen dan een vijfde deel van de massa van de aanhangwagen in beladen toestand.

      3 Op onverharde wegen en wegen die zijn voorzien van een klinkerverharding, mag de totale massa van walsen niet
      meer dan 8000 kg bedragen.

      4 Op onverharde wegen mag de last onder enig wiel van landbouw- of bosbouwtrekkers of motorrijtuigen met beperkte
      snelheid niet meer dan 2400 kg bedragen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.24
  - number: 5.18.25
    text: |-
      1 De totale massa van samenstellen van landbouw- of bosbouwtrekker of motorrijtuig met beperkte snelheid en één of
      meer aanhangwagens mag in beladen toestand niet meer bedragen dan 50 000 kg.

      2 De last onder enige as van samenstellen van landbouw- of bosbouwtrekkers of motorrijtuigen met beperkte snelheid
      en één of meer autonome aanhangwagens mag in beladen toestand niet meer bedragen dan 10.000 kg.

      3 De som van de aslasten van samenstellen van landbouw- of bosbouwtrekkers of motorrijtuigen met beperkte snelheid
      en één of meer autonome aanhangwagens mag in beladen toestand niet meer bedragen dan 50.000 kg.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.25
  - number: 5.18.26
    text: |-
      1 Bromfietsen op twee wielen mogen met inbegrip van de lading niet breder zijn dan 1,00 m.

      2 Bromfietsen op meer dan twee wielen mogen met inbegrip van de lading niet breder zijn dan 2,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.26
  - number: 5.18.27
    text: |-
      Aanhangwagens achter bromfietsen moeten in aangekoppelde toestand voldoen aan de volgende eisen:

      a. de breedte van het voertuig mag met inbegrip van de lading niet meer bedragen dan 1,00 m;

      b. de hoogte van het voertuig mag met inbegrip van de lading niet meer bedragen dan 1,00 m;

      c. de totale massa van het voertuig mag niet meer bedragen dan de helft van de ledige massa van de trekkende
      bromfiets;

      d. de afstand van de achteras van de trekkende bromfiets tot de achterzijde van de aanhangwagen met inbegrip van de
      lading mag niet meer bedragen dan 2,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.27
  - number: 5.18.28
    text: |-
      1 Fietsen op twee wielen mogen met inbegrip van de lading niet breder zijn dan 0,75 m.

      2 Fietsen op meer dan twee wielen en fietsen met zijspanwagen mogen met inbegrip van de lading niet breder zijn dan
      1,50 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.28
  - number: 5.18.29
    text: |-
      Aanhangwagens achter fietsen mogen in aangekoppelde toestand met inbegrip van de lading niet breder zijn dan 1,00
      m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.29
  - number: 5.18.30
    text: |-
      1 De breedte van gehandicaptenvoertuigen mag met inbegrip van de lading niet meer bedragen dan 1,10 m.

      2 De breedte van wagens mag met inbegrip van de lading niet meer bedragen dan 1,50 m.

      3 De breedte van bespannen wagens mag met inbegrip van de lading niet meer bedragen dan 2,60 m. Indien de lading
      bestaat uit losse veldgewassen, mag de breedte van de lading niet meer bedragen dan 3,50 m.

      4 De hoogte van gehandicaptenvoertuigen mag met inbegrip van de lading niet meer bedragen dan 2,00 m.

      5 De hoogte van wagens mag met inbegrip van de lading niet meer bedragen dan 4,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.30
  - number: 5.18.31
    text: |-
      Middenasaanhangwagens moeten in aangekoppelde toestand voldoen aan de volgende eisen:

      a. de som van de aslasten van een middenasaanhangwagen met een toegestane maximum massa van meer dan 12 000 kg mag
      niet meer bedragen dan 1,5 maal de som van de aslasten van het trekkend motorrijtuig;

      b. de last onder de koppeling van een middenasaanhangwagen met een massa van niet meer dan 750 kg mag alleen in
      neerwaartse richting zijn gericht en mag niet meer dan 50 kg bedragen;

      c. de last onder de koppeling van een middenasaanhangwagen met een toegestane maximum massa van meer dan 750 kg
      mag niet minder bedragen dan 1% van de toegestane maximum massa van het voertuig, doch behoeft niet meer dan 50 kg
      te bedragen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.31
  - number: 5.18.32
    text: |-
      Personenauto’s, bedrijfsauto’s en driewielige motorrijtuigen behoeven in geval van nood niet te voldoen aan het
      bepaalde in de [artikelen 5.2.27, zesde lid][ref1], [5.3.27, zesde lid][ref2], en [5.5.27, zesde lid][ref3], mits
      in dat geval de rijsnelheid en het rijgedrag worden aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.2.27
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.27
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.5.27
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.32
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.2.27
        hoofdstuk: '5'
        paragraaf: '6'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 5.3.27
        hoofdstuk: '5'
        paragraaf: '6'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0006746
        artikel: 5.5.27
        hoofdstuk: '5'
        paragraaf: '6'
        afdeling: '5'
  - number: 5.18.33
    text: |-
      1 Aanhangwagens achter personenauto’s moeten zijn voorzien van een reminrichting indien de massa van de
      aanhangwagen meer bedraagt dan:

      a. de helft van de massa in bedrijfsklare toestand van de personenauto,

      b. de helft van de ledige massa van de personenauto, vermeerderd met 50 kg, of

      c. 750 kg.

      2 Aanhangwagens achter bedrijfsauto’s of driewielige motorrijtuigen moeten zijn voorzien van een reminrichting
      indien de massa van de aanhangwagen meer bedraagt dan:

      a. de helft van de ledige massa van het trekkend motorrijtuig, of

      b. 750 kg.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.33
  - number: 5.18.34
    text: |-
      1 Bij samenstellen van voertuigen waarvan de aanhangwagen van een reminrichting is voorzien, moet de reminrichting
      van de aanhangwagen in werking treden bij het bedienen van de bedrijfsrem van het trekkend voertuig.

      2 Indien de aanhangwagen is voorzien van een losbreekreminrichting, moet deze zodanig met een vast deel van het
      trekkend voertuig of met een daartoe bestemde inrichting aan de trekhaak daarvan zijn verbonden, dat de inrichting
      slechts in werking treedt na het losraken van de aanhangwagenkoppeling.

      3 Indien zowel het trekkend voertuig als de aanhangwagen zijn voorzien van een ABS- of EBS-systeem moeten de
      daartoe bestemde ISO 7638 stekkers op beide voertuigen met elkaar verbonden worden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.34
  - number: 5.18.35
    text: |-
      1 De remvertraging van de bedrijfsrem van samenstellen van trekkend voertuig en aanhangwagen moet ten minste 4,0 m/
      s2 bedragen.

      2 In afwijking van het eerste lid moet de remvertraging van de bedrijfsrem van samenstellen van landbouw- of
      bosbouwtrekker of motorrijtuig met beperkte snelheid en aanhangwagen voldoen aan de eisen die aan de remvertraging
      van het trekkend voertuig worden gesteld in de op die categorie voertuigen betrekking hebbende afdeling van dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.35
  - number: 5.18.36
    text: |-
      De parkeerrem van het trekkend motorrijtuig van een samenstel van motorrijtuig en aanhangwagen moet het samenstel
      van voertuigen op een helling van 10,0% in beide richtingen in stilstand kunnen houden. Hieraan wordt geacht te
      zijn voldaan indien de remvertraging, uitgaande van een aanvangssnelheid van 15 km/h, op een droge of nagenoeg
      droge en ongeveer horizontaal liggende weg ten minste 1,0 m/s2 bedraagt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.36
  - number: 5.18.37
    text: |-
      Indien met een personenauto, bedrijfsauto, driewielig motorrijtuig, motorrijtuig met beperkte snelheid of
      landbouw- of bosbouwtrekker een aanhangwagen wordt voortbewogen, moet het trekkend voertuig zijn voorzien van één
      zijrichtingaanwijzer aan elke zijkant van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.37
  - number: 5.18.37a
    text: |-
      Indien een aanhangwagen wordt voortbewogen door een personenauto of bedrijfsauto die is voorzien van één of twee
      mistlichten, behoeven alleen de één of twee mistlichten op de aanhangwagen te branden, mits de bediening van de
      mistlichten op het trekkende voertuig en de aanhangwagen via een schakelaar in het trekkende voertuig plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.37a
  - number: 5.18.38
    text: |-
      1 De verlichtingsinstallatie van aanhangwagens moet zodanig op die van het trekkend voertuig zijn aangesloten dat
      de functies van de verlichting en de lichtsignalen overeenstemmen met die van het trekkend voertuig.

      2 Indien een aanhangwagen wordt voortbewogen door een bedrijfsauto en één van de voertuigen is voorzien van een
      lijn- of contourmarkering aan de zijkant van het voertuig, is het andere voertuig ook aan de zijkant van een lijn-
      of contourmarkering voorzien.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.38
  - number: 5.18.39
    text: |-
      1 Fietsen die bij nacht of bij dag indien het zicht ernstig wordt belemmerd, worden gebruikt, moeten zijn voorzien
      van verlichting overeenkomstig het tweede tot en met het vierde lid.

      2 Fietsen op twee wielen en fietsen op drie wielen met één voorwiel moeten zijn voorzien van een licht aan de
      voorzijde.

      3 Fietsen op meer dan twee wielen met twee voorwielen moeten zijn voorzien van twee lichten aan de voorzijde.

      4 Fietsen moeten zijn voorzien van een achterlicht dat is voorzien van een door Onze Minister bekendgemaakt
      goedkeuringsmerk.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.39
  - number: 5.18.40
    text: |-
      1 De in [artikel 5.18.39][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst dan wel de functie nadelig wordt benvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten op gelijke hoogte symmetrisch links
      en rechts van het midden van het voertuig zijn bevestigd.

      5 De in [artikel 5.18.39][ref2] bedoelde lichten mogen niet zijn afgeschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.39
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.39
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.40
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.18.39
        hoofdstuk: '5'
        paragraaf: '4'
        afdeling: '18'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 5.18.39
        hoofdstuk: '5'
        paragraaf: '4'
        afdeling: '18'
  - number: 5.18.41
    text: |-
      1 Het licht aan de voorzijde mag niet anders dan wit of geel stralen.

      2 Het achterlicht mag niet anders dan rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.41
  - number: 5.18.42
    text: |-
      Het achterlicht moet:

      a. indien de fiets is voorzien van één achterwiel, in het midden van het voertuig zijn aangebracht op een hoogte
      van niet minder dan 0,25 m en niet meer dan 1,20 m boven het wegdek;

      b. indien de fiets is voorzien van twee achterwielen of is verbonden met een zijspanwagen, aan de uiterste
      linkerzijde van de fiets zijn aangebracht op een hoogte van niet minder dan 0,25 m en niet meer dan 1,20 m boven
      het wegdek.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.42
  - number: 5.18.43
    text: |-
      1 Gehandicaptenvoertuigen, uitgerust met een elektromotor en niet voorzien van een gesloten carrosserie, die bij
      nacht of bij dag indien het zicht ernstig wordt belemmerd, worden gebruikt, moeten zijn voorzien van:

      a. twee lichten aan de voorzijde indien het voertuig is voorzien van twee voorwielen, dan wel één licht aan de
      voorzijde indien het voertuig is voorzien van één voorwiel;

      b. twee achterlichten indien het voertuig is voorzien van twee achterwielen, dan wel één achterlicht indien het
      voertuig is voorzien van één achterwiel.

      2 Het bepaalde in het eerste lid is niet van toepassing op gehandicaptenvoertuigen die van het voetpad of het
      trottoir gebruik maken of van het ene naar het andere voetpad of trottoir oversteken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.43
  - number: 5.18.44
    text: |-
      1 De in [artkel 5.18.43][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig zijn bevestigd.

      5 De in [artikel 5.18.43][ref2] bedoelde lichten mogen niet zijn afgeschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.43
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.43
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.44
