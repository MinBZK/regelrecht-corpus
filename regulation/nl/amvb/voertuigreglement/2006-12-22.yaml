  - number: '1.2'
    text: |-
      1 Voor de vaststelling van afmetingen van voertuigen die bij of krachtens dit besluit zijn voorgeschreven of
      toegestaan, wordt verstaan onder:

      a. as: de horizontale lijn die loodrecht staat op het middenlangsvlak van het voertuig en gaat door het midden van
      één of meer wielen wanneer deze zich in de stand van rechtuitrijden bevinden;

      b. breedte van een voertuig: de horizontale afstand tussen twee verticale vlakken die evenwijdig lopen aan het
      middenlangsvlak van het voertuig en gaan door de uiterste linker- en rechterzijde van het voertuig, gemeten in
      de stand van rechtuitrijden op een horizontaal wegdek; de spiegels en de bevestigingsdelen daarvan worden buiten
      beschouwing gelaten;

      c. hoogte van een voertuig: de verticale afstand tussen het wegdek en een horizontaal vlak dat gaat door het hoogst
      gelegen deel van het voertuig, gemeten op een horizontaal wegdek in de rijstand;

      d. lengte van een voertuig of samenstel van voertuigen: de horizontale afstand tussen twee verticale vlakken die
      loodrecht staan op het middenlangsvlak van het voertuig of het samenstel van voertuigen en gaan door de uiterste
      voor- en achterzijde van het voertuig of het samenstel, gemeten in de stand van rechtuitrijden op een horizontaal
      wegdek; de spiegels en de bevestigingsdelen daarvan worden buiten beschouwing gelaten; een zonneklep die niet meer
      dan 0,20 m voor het voorste verticale vlak, zoals is bepaald bij een niet gemonteerde zonneklep, uitsteekt en die
      met eenvoudige middelen afneembaar is, wordt buiten beschouwing gelaten.

      2 Onverminderd het eerste lid worden bij de vaststelling van de afmetingen van bedrijfsauto's en aanhangwagens
      met een toegestane maximum massa van meer dan 750 kg, met uitzondering van aanhangwagens achter landbouw- of
      bosbouwtrekkers of achter motorrijtuigen met beperkte snelheid, die krachtens dit besluit zijn voorgeschreven of
      toegestaan, de door Onze Minister bij ministeriële regeling aan te wijzen delen en onderdelen buiten beschouwing
      gelaten.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1.2
  - number: '1.3'
    text: |-
      1 De wielbasis van een voertuig wordt gemeten bij onbeladen toestand van het voertuig met alle wielen op het
      wegdek en in de stand van rechtuitrijden. Indien van fabriekswege de wielbasis links en rechts verschilt, wordt als
      wielbasis de gemiddelde waarde aangemerkt.

      2 De afmetingen van voertuigen alsmede de last onder de as of assen worden, onverminderd het bepaalde in
      [afdeling 18 van hoofdstuk 5][ref1], bepaald bij onbeladen toestand van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '5'
        afdeling: '18'
  - number: '1.4'
    text: |-
      1 Voor de bepaling van het aantal wielen wordt een samenstel van wielen die op één wielnaaf zijn gemonteerd,
      aangemerkt als één wiel.

      2 In afwijking van het eerste lid worden voor het bepalen van het aantal wielen van motorfietsen, driewielige
      motorrijtuigen en bromfietsen twee op dezelfde as gemonteerde wielen als een wiel beschouwd, indien de afstand
      tussen de middens van de contactvlakken van deze wielen met de grond kleiner is dan 460 mm.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1.4
  - number: '1.5'
    text: |-
      1 Voor de bepaling van het aantal lichten wordt als één licht aangemerkt elke combinatie van twee of meer al dan
      niet identieke lichten die:

      a. dezelfde functie vervullen,

      b. licht van dezelfde kleur uitstralen, en

      c. een verlichtingsinrichting vormen waarvan de lichtdoorlatende gedeelten van de lichten op een zelfde verticaal
      vlak ten minste 60,0% beslaan van het oppervlak van de kleinste rechthoek die om de lichtdoorlatende gedeelten van
      de lichten kan worden beschreven.

      2 Onverminderd het bepaalde in het eerste lid geldt voor lichten waarvoor een goedkeuring als bedoeld in [richtlijn
      76/756/EEG](31976L0756) is vereist, tevens dat een dergelijke combinatie als één enkel licht is goedgekeurd.

      3 Het eerste lid, voorzover dit betrekking heeft op voertuigen die niet vallen onder [richtlijn 92/61/EEG]
      (31992L0061) of [richtlijn 2002/24/EG](32002L0024), en het tweede lid zijn niet van toepassing op groot licht,
      dimlicht en mistlichten aan de voorzijde.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1.5
  - number: '1.6'
    text: |-
      Met betrekking tot de verlichting moet voor de bepaling van de hoogte boven het wegdek en de afstand vanaf het punt
      van de grootste breedte van het voertuig, worden gemeten de kortste afstand vanaf de rand van het lichtdoorlatende
      gedeelte.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1.6
  - number: '1.7'
    text: |-
      1 De vermelding bij of krachtens dit besluit, voorzover daarbij niet anders is aangegeven, van een EEG-
      richtlijn omvat mede elke in het kader van de Europese Gemeenschappen tot stand gekomen richtlijn tot wijziging
      van die richtlijn. Het totstandkomen van een dergelijke richtlijn wordt door Onze Minister bekendgemaakt in de
      *Staatscourant*.

      2 Een wijziging van een richtlijn als bedoeld in het eerste lid, treedt voor de toepassing van dit besluit in
      werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven,
      tenzij Onze Minister een eerder tijdstip van inwerkingtreding bepaalt. Indien een wijzigingsrichtlijn of een
      gewijzigde richtlijn de lidstaten verplicht tot dan wel de mogelijkheid biedt voor het afzonderlijk bepalen van de
      datum van toepassing van een of meer deelaspecten van die wijzigingsrichtlijn respectievelijk gewijzigde richtlijn,
      wordt deze eveneens door Onze Minister bepaald.

      3 De in het eerste lid bedoelde bekendmaking vermeldt de vindplaats van de wijzigingsrichtlijn, het artikel
      of artikelonderdeel waarop de wijziging betrekking heeft, alsmede het in het tweede lid bedoelde tijdstip van
      inwerkingtreding van de wijzigingsrichtlijn en in voorkomend geval het tijdstip van de toepassing van het in de
      desbetreffende bekendmaking daarbij te vermelden deelaspect van de wijzigingsrichtlijn of de gewijzigde richtlijn.

      4 Het eerste tot en met derde lid zijn van overeenkomstige toepassing ten aanzien van de reglementen van de
      Economische Commissie voor Europa (ECE-Reglementen), met dien verstande dat Onze Minister zorg draagt voor de
      vertaling van deze gewijzigde reglementen en van de wijze van bekendmaking mededeling doet in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1.7
  - number: '1.8'
    text: |-
      Waar in [hoofdstuk 3][ref1] wordt bepaald dat voertuigen, voertuigonderdelen, uitrustingsstukken en voorzieningen
      ter bescherming van bestuurders en passagiers moeten voldoen aan het bepaalde in een EEG-richtlijn, mag in
      plaats daarvan worden voldaan aan voorschriften die door de Raad van de Europese Gemeenschappen overeenkomstig
      het bepaalde in artikel 9 van [richtlijn 70/156/EEG](31970L0156) als gelijkwaardig zijn erkend en in het
      *Publikatieblad van de Europese Gemeenschappen* zijn bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '3'
  - number: '1.9'
    text: |-
      Indien van een voertuig het identificatienummer, bedoeld in de [hoofdstukken 3][ref1] en [5][ref2], geheel
      of ten dele onleesbaar is geworden of teniet is gegaan, kan vanwege Onze Minister van Financiën een nieuw
      identificatienummer als bedoeld in [richtlijn 76/114/EEG](31976L0114) worden ingeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006746
        hoofdstuk: '5'
  - number: '1.10'
    text: |-
      1 Onder de datum waarop een voertuig in gebruik is genomen, wordt in dit besluit verstaan de datum van eerste
      toelating van het voertuig.

      2 Voor voertuigen waarvoor vóór 1 januari 1995 een kentekenbewijs is afgegeven waarop geen datum van eerste
      toelating is vermeld, wordt als datum van eerste toelating beschouwd de op het kentekenbewijs vermelde datum van
      afgifte van deel I van het kentekenbewijs. Indien op het kentekenbewijs onder "bijzonderheden" een bouwjaar is
      vermeld, wordt als datum van eerste toelating beschouwd 30 juni van dit bouwjaar.

      3 Onze Minister stelt regels vast omtrent de wijze waarop de in het eerste lid genoemde datum van eerste toelating
      wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1.10
  - number: 1a.1
    text: |-
      1 Het is met ingang van 1 oktober 2002 tot 20 oktober 2007 verboden nieuwe personenauto's die niet vergezeld
      gaan van een krachtens [richtlijn nr. 70/156/EEG](31970L0156) verleend certificaat van overeenstemming waaruit
      blijkt dat ter zake van autogordels en bevestigingssystemen wordt voldaan aan de eisen van [richtlijn nr. 77/541/
      EEG](31977L0541) zoals gewijzigd bij [richtlijn nr. 2000/3/EG](32000L0003) van de Commissie van 22 februari 2000
      (PbEG L 53) tot aanpassing aan de stand van de techniek van [richtlijn nr. 77/541/EEG](31977L0541) van de Raad
      betreffende veiligheidsgordels en bevestigingssystemen in motorvoertuigen, in voorraad te hebben, te koop aan te
      bieden of af te leveren, behoudens in geval een beroep wordt gedaan op artikel 8, tweede lid, van [richtlijn nr.
      70/156/EEG](31970L0156).

      2 Met ingang van 20 oktober 2007 is het verboden nieuwe personenauto’s of bedrijfsauto’s in voorraad te hebben,
      te koop aan te bieden of af te leveren, indien deze voor wat betreft de installatie van veiligheidsgordels of
      beveiligingssystemen niet voldoen aan [richtlijn 77/541/EEG](31977L0541) en voorzover daarin is voorzien, niet
      vergezeld gaan van een geldig certificaat van overeenstemming als bedoeld in artikel 7, eerste lid, van [richtlijn
      70/156/EEG](31970L0156).

      3 Het tweede lid is niet van toepassing op nieuwe personenauto’s en bedrijfsauto’s waarvoor krachtens
      [artikel 2.2, eerste lid, onder a][ref1], goedkeuring is verleend en die voldoen aan de krachtens dat artikel
      gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.1
