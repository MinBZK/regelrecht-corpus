  - number: 5.2.12
    text: |-
      1 De accu van personenauto’s moet deugdelijk zijn bevestigd.

      2 De bedrading van personenauto’s moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.12
  - number: 5.2.13
    text: |-
      1 De motorsteunen van personenauto’s moeten deugdelijk aan het chassis dan wel de carrosserie alsmede aan de
      motor zijn bevestigd. Indien de motor en de versnellingsbak zijn samengebouwd, dan worden de steunen van de
      versnellingsbak mede als motorsteunen beschouwd.

      2 De motorsteunen mogen niet in ernstige mate zijn beschadigd, de rubbers mogen niet zijn doorgescheurd en de
      vulcanisatie mag niet geheel zijn losgeraakt.

      3 Onze Minister stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.13
  - number: 5.2.15
    text: |-
      Personenauto’s die na 30 juni 1967 in gebruik zijn genomen, moeten zijn voorzien van een goed werkende
      snelheidsmeter, die ook bij nacht voor de bestuurder goed afleesbaar is.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.15
  - number: 5.2.16
    text: |-
      1 De onderdelen van de aandrijving van personenauto’s moeten deugdelijk zijn bevestigd.

      2 Stofhoezen van aandrijfassen moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de hoezen
      niet meer afdichten.

      3 Kruiskoppelingen moeten een zichtbaar spelingsvrije overbrenging kunnen bewerkstelligen.

      4 Onze Minister stelt regels vast met betrekking tot het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.16
  - number: 5.2.18
    text: |-
      1 De assen van personenauto’s moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen breuken of scheuren
      vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn bevestigd, beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht. Hieraan
      wordt voor wat betreft wielgeleidingselementen voldaan indien deze niet zijn doorgeroest.

      5 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid met betrekking tot de deugdelijkheid van
      de bevestiging.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.18
  - number: 5.2.19
    text: |-
      1 De fuseepennen, -lageringen, -bussen en -kogels van personenauto’s moeten deugdelijk zijn bevestigd.

      2 Stofhoezen van fuseekogels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de hoezen
      niet meer afdichten.

      3 De fuseepennen, -lageringen, -bussen en -kogels alsmede de overige draaipunten van de wielophanging mogen niet te
      veel speling vertonen.

      4 Indien een gedeelte van de binnenkant van het fuseekogelhuis en van de fuseekogel zichtbaar is doordat de hoes is
      beschadigd of ontbreekt, mag dit gedeelte geen corrosie vertonen.

      5 Onze Minister stelt regels vast omtrent het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.19
  - number: 5.2.20
    text: |-
      1 De wiellagers van personenauto’s mogen niet teveel speling vertonen.

      2 Verschijnselen van slijtage of beschadiging mogen niet hoorbaar of voelbaar zijn.

      3 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.20
  - number: 5.2.21
    text: |-
      1 De wielbasis van personenauto"s mag niet meer dan 1,0% afwijken van de waarde die voor het voertuig is vermeld op
      het kentekenbewijs of in het kentekenregister.

      2 Behoudens fabrieksmatige verschillen mag de wielbasis, links en rechts gemeten, niet meer dan 15 mm verschillen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.21
  - number: 5.2.22
    text: |-
      De afstanden tussen de fuseedraaipunten en twee punten aan het chassis dan wel aan de carrosserie, die symmetrisch
      links en rechts ten opzichte van de langsas van het voertuig zijn gelegen, mogen recht en kruiselings gemeten
      onderling niet meer dan 15 mm verschillen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.22
  - number: 5.2.23
    text: |-
      De spoorbreedte van personenauto’s mag niet meer dan 2,0% groter zijn dan de waarde die voor het voertuig is
      vermeld op het kentekenbewijs of in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.23
  - number: 5.2.24
    text: |-
      1 De wielen onderscheidenlijk velgen van personenauto’s mogen geen breuken, scheuren, ondeugdelijk laswerk of
      ernstige vervorming vertonen.

      2 De wielen onderscheidenlijk velgen moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.24
  - number: 5.2.27
    text: |-
      1 De wielen van personenauto’s moeten zijn voorzien van luchtbanden.

      2 De banden mogen geen beschadigingen vertonen waarbij het karkas zichtbaar is.

      3 De banden mogen geen uitstulpingen vertonen.

      4 De profilering van de hoofdgroeven van de banden moet over de gehele omtrek van het loopvlak ten minste 1,6 mm
      bedragen, met uitzondering van slijtage-indicatoren.

      5 De banden mogen niet zijn opgesneden. Van opsnijden is sprake indien slijtage-indicatoren zijn weggesneden,
      indien de profielvorm van de groef afwijkt van de originele profielvorm, of indien in de bodem van de groef het
      karkas van de band zichtbaar is.

      6 De banden op een as moeten dezelfde karkasstructuur hebben, onverminderd het bepaalde in [artikel 5.18.32][ref1].

      7 Het loopvlak van de banden mag geen metalen elementen bevatten die tijdens het rijden daarbuiten kunnen
      uitsteken.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.32
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.27
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.18.32
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: '18'
  - number: 5.2.28
    text: |-
      1 Personenauto's moeten zijn voorzien van een goed werkend veersysteem. Banden worden niet als deel van het
      veersysteem beschouwd.

      2 De onderdelen van het veersysteem mogen geen breuken of scheuren vertonen, mogen niet ernstig door corrosie zijn
      aangetast en moeten deugdelijk zijn bevestigd.

      3 Personenauto's moeten zijn voorzien van deugdelijk bevestigde en goed werkende schokdempers.

      4 Onze Minister stelt regels vast omtrent het bepaalde in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.28
  - number: 5.2.29
    text: |-
      1 De bestuurde wielen van personenauto’s moeten goed reageren op de draaiing van het stuurwiel.

      2 Bij draaiing van het stuurwiel tot aan de aanslagen mogen geen weerstanden voelbaar zijn en moeten de wielen
      onderscheidenlijk de banden vrij kunnen draaien.

      3 De voor de overbrenging van de stuurbeweging bestemde onderdelen moeten deugdelijk zijn bevestigd met alle
      daarvoor bestemde bevestigings- en borgmiddelen, mogen geen breuken of scheuren vertonen, mogen niet zijn vervormd
      en mogen niet ernstig door corrosie zijn aangetast.

      4 Stofhoezen van het stuurhuis en de stuurkogels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn
      beschadigd dat de hoezen niet meer afdichten.

      5 Kruiskoppelingen moeten een zichtbaar spelingsvrije overbrenging kunnen bewerkstelligen.

      6 Flexibele koppelingen mogen niet in ernstige mate zijn gescheurd en de vulcanisatie mag niet in ernstige mate
      zijn losgeraakt.

      7 De verbindingen in het stangenstelsel mogen niet te veel speling vertonen.

      8 Indien een gedeelte van de binnenkant van het stuurkogelhuis en van de stuurkogel zichtbaar is doordat de hoes is
      beschadigd of ontbreekt, mag dit gedeelte geen corrosie vertonen.

      9 Slangen ten behoeve van de stuurbekrachtiger mogen geen beschadigingen vertonen waarbij het wapeningsmateriaal
      zichtbaar is en mogen geen bewegende delen raken.

      10 Onze Minister stelt regels vast omtrent het bepaalde in het derde, zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.29
  - number: 5.2.31
    text: |-
      1 Personenauto’s moeten zijn voorzien van een reminrichting waarvan de onderdelen:

      a. deugdelijk zijn bevestigd met de daarvoor bestemde bevestigings- en borgmiddelen;

      b. niet in ernstige mate door corrosie zijn aangetast;

      c. niet zijn beschadigd, gescheurd of gebroken;

      d. geen inwendige of uitwendige lekkage vertonen.

      2 De rembekrachtiger en de remkrachtregelaar moeten goed functioneren.

      3 Bij hydraulische remsystemen mag bij het bedienen van het rempedaal de slag van het pedaal niet door een aanslag
      worden beperkt.

      4 Het oppervlak van het rempedaal moet stroef zijn.

      5 Remslangen mogen:

      a. niet in ernstige mate zijn misvormd;

      b. niet langs andere voertuigdelen schuren;

      c. geen zodanige beschadigingen vertonen dat het wapeningsmateriaal zichtbaar is.

      6 Wielen die zijn voorzien van een trommelrem, moeten in onberemde toestand in beide richtingen kunnen draaien
      zonder dat de remvoering aanloopt. De remvoering van wielen die zijn voorzien van een schijfrem, mag in onberemde
      toestand in beide richtingen enigszins slepen.

      7 De remtrommel of remschijf mag tijdens het remmen niet worden geraakt door delen die zijn bestemd als drager of
      bevestigingsmiddel van remvoering.

      8 De noodzakelijke bewegingsvrijheid van de remonderdelen mag niet worden beperkt.

      9 Remcylinders moeten zijn voorzien van stofhoezen die niet in ernstige mate mogen zijn beschadigd.

      10 Anti-blokkeersystemen moeten goed functioneren en moeten zijn voorzien van een deugdelijke
      waarschuwingsinrichting die in werking treedt zodra het systeem faalt.

      11 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid, onderdelen *a* en *b*, en het vijfde
      lid, onderdeel *a*.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.31
  - number: 5.2.32
    text: |-
      1 Personenauto’s, in gebruik genomen na 30 juni 1967, moeten indien het hydraulisch remsysteem niet is voorzien van
      een toegankelijk remvloeistofreservoir, waarvan het vloeistofpeil te controleren is zonder het reservoir te openen,
      zijn voorzien van:

      a. een deugdelijke waarschuwingsinrichting die in werking treedt zodra het niveau van de remvloeistof onder het
      vereiste minimum niveau is gedaald, of

      b. in geval van een gescheiden remsysteem een deugdelijke waarschuwingsinrichting die in werking treedt zodra een
      van de kringen van het remsysteem faalt.

      2 De goede werking van het signaal van de in het eerste lid bedoelde waarschuwingsinrichtingen moet kunnen worden
      gecontroleerd.

      3 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.32
  - number: 5.2.38
    text: |-
      1 Personenauto’s, in gebruik genomen na 30 juni 1967, moeten zijn voorzien van een bedrijfsrem waarvan de
      remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 5,2 m/s2 bedraagt, bij
      een pedaalkracht van niet meer dan 500 N.

      2 Personenauto’s, in gebruik genomen voor 1 juli 1967, moeten zijn voorzien van een bedrijfsrem waarvan de
      remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 3,8 m/s2 bedraagt.

      3 De bedrijfsrem moet op alle wielen werken.

      4 Personenauto’s mogen op een droge of nagenoeg droge weg niet uitbreken ten gevolge van een verschil in remwerking
      tussen de wielen van elke as onderscheidenlijk ten gevolge van overberemming van de achteras.

      5 In afwijking van het eerste lid moeten ambulances, kampeerauto's en begrafeniswagens met een maximum toegestane
      massa van meer dan 2500 kg waarvoor overeenkomstig [richtlijn 98/14/EG](31998L0014), Bijlage XI, aanhangsel 1, een
      goedkeuring is verleend, zijn voorzien van een bedrijfsrem waarvan de remvertraging op een droge of nagenoeg droge
      en ongeveer horizontaal liggende weg ten minste 4,5 m/s2 bedraagt, bij een pedaalkracht van niet meer dan 700 N.

      6 Onze Minister stelt regels vast met betrekking tot het bepaalde in het eerste, tweede, vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.38
  - number: 5.2.39
    text: |-
      1 Personenauto’s moeten zijn voorzien van een parkeerrem die op ten minste twee wielen werkt.

      2 De parkeerrem van personenauto’s, in gebruik genomen na 30 juni 1967, moet het voertuig op een helling van 16,0%
      in beide richtingen in stilstand kunnen houden. Hieraan wordt geacht te zijn voldaan indien de remvertraging,
      uitgaande van een aanvangssnelheid van 15 km/h, op een droge of nagenoeg droge en ongeveer horizontaal liggende weg
      ten minste 1,2 m/s2 bedraagt en de rem ook in achterwaartse richting functioneert.

      3 De remvertraging van de parkeerrem van personenauto’s, in gebruik genomen voor 1 juli 1967, moet op een droge of
      nagenoeg droge en ongeveer horizontaal liggende weg ten minste 1,0 m/s2 bedragen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.39
  - number: 5.2.40
    text: |-
      1 Indien de personenauto na 30 juni 1967 in gebruik is genomen en is voorzien van een geheel afzonderlijk
      hulpremsysteem, moet:

      a. het hulpremsysteem goed functioneren;

      b. de remwerking redelijk gelijkmatig over de wielen links en rechts van de as zijn verdeeld.

      2 De remvertraging van het in het eerste lid bedoelde hulpremsysteem moet op een droge of nagenoeg droge en
      ongeveer horizontaal liggende weg ten minste 2,6 m/s2 bedragen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.40
  - number: 5.2.41
    text: |-
      1 De deuren van personenauto’s moeten goed sluiten. De deuren die direkt toegang geven tot de personenruimte,
      moeten op normale wijze vanaf de binnenzijde of vanaf de buitenzijde kunnen worden geopend.

      2 Het slot en de scharnieren van de motorkap of het kofferdeksel aan de voorzijde van het voertuig moeten een goede
      sluiting waarborgen.

      3 De bevestiging van de scharnieren van de deuren, de motorkap en het kofferdeksel mag niet in ernstige mate door
      corrosie zijn aangetast.

      4 Onze Minister stelt regels vast omtrent het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.41
  - number: 5.2.42
    text: |-
      1 De voorruit en de zijruiten van personenauto’s mogen:

      a. geen beschadigingen of verkleuringen vertonen,

      b. niet zijn voorzien van onnodige voorwerpen,

      die het uitzicht van de bestuurder belemmeren.

      2 Indien de personenauto niet is voorzien van een rechterbuitenspiegel, mag de achterruit:

      a. geen beschadigingen of verkleuringen vertonen,

      b. niet zijn voorzien van onnodige voorwerpen,

      die het uitzicht van de bestuurder belemmeren.

      3 Onze Minister kan regels vaststellen omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.42
  - number: 5.2.43
    text: |-
      1 Personenauto’s met een voorruit moeten zijn voorzien van een goed werkende ruitenwisserinstallatie die de
      bestuurder voldoende uitzicht geeft.

      2 Personenauto’s met een voorruit, die na 30 september 1971 in gebruik zijn genomen, moeten zijn voorzien van een
      goed werkende ruitensproeierinstallatie.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.43
  - number: 5.2.44
    text: |-
      Personenauto’s met een voorruit, die na 30 september 1971 in gebruik zijn genomen, moeten zijn voorzien van een
      goed werkende installatie ter ontdooiing en ontwaseming van de voorruit.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.44
  - number: 5.2.45
    text: |-
      1 Personenauto’s, in gebruik genomen na 25 januari 2011, zijn voorzien van een linkerbuitenspiegel, een
      rechterbuitenspiegel en een binnenspiegel.

      2 Indien met de in het eerste lid bedoelde binnenspiegel het achter het voertuig gelegen weggedeelte niet voldoende
      kan worden overzien, behoeft deze niet aanwezig te zijn.

      3 Personenauto’s, in gebruik genomen voor 26 januari 2011, zijn voorzien van een linkerbuitenspiegel en een
      binnenspiegel.

      4 De in het derde lid bedoelde personenauto’s zijn voorzien van een rechterbuitenspiegel indien met de
      binnenspiegel het achter het voertuig gelegen weggedeelte niet voldoende kan worden overzien. Indien de
      binnenspiegel geen zicht naar achteren mogelijk maakt, behoeft deze niet aanwezig te zijn.

      5 De aan de zijde van de bestuurder bevestigde buitenspiegel moet vanuit de binnenzijde bij gesloten portier
      kunnen worden versteld. Deze eis geldt niet voor personenauto’s die vóór 1 januari 1975 in gebruik zijn genomen.
      De spiegels van deze voertuigen moeten, na door een duw te zijn omgeklapt, zonder verstelling in de oorspronkelijke
      stand terug kunnen klappen.

      6 De spiegels moeten deugdelijk zijn bevestigd.

      7 Het spiegelglas van de verplichte spiegels mag geen verschijnselen van breuk vertonen en mag niet in ernstige
      mate zijn verweerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.45
  - number: 5.2.46
    text: |-
      1 Personenauto’s, in gebruik genomen na 19 oktober 2008, zijn niet voorzien van zijdelings gerichte zitplaatsen.

      2 Het eerste lid is niet van toepassing op ambulances, personenauto’s ten dienste van de politie of brandweer en
      andere door Onze Minister aangewezen categorieën voertuigen ten dienste van de burgerbescherming of ordehandhaving.

      3 De zitplaatsen van personenauto’s moeten deugdelijk aan het voertuig zijn bevestigd. Bij personenauto’s die na 30
      september 1971 in gebruik zijn genomen, moeten:

      a. verschuifbare zitplaatsen in elke mogelijke stand automatisch zijn vergrendeld,

      b. verstelbare rugleuningen van zitplaatsen in elke mogelijke stand kunnen worden vergrendeld, en

      c. de voorste zitplaatsen, indien zij scharnierend zijn, dan wel de rugleuningen van de voorste zitplaatsen, indien
      zij scharnierend zijn, in de normale stand automatisch zijn vergrendeld.

      4 Onze Minister stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging, bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.46
  - number: 5.2.47
    text: |-
      1 Personenauto's die na 30 september 2000 in gebruik zijn genomen, moeten zijn voorzien van autogordels voor alle
      naar voren en naar achteren gerichte zitplaatsen.

      2 Personenauto’s die na 31 december 1989 doch voor 1 oktober 2000 in gebruik zijn genomen, moeten zijn voorzien van
      autogordels voor alle naar voren gerichte zitplaatsen.

      3 Personenauto’s die na 1 januari 1971 doch voor 1 januari 1990 in gebruik zijn genomen, moeten zijn voorzien van
      autogordels voor de zitplaats van de bestuurder en de naast deze plaats aanwezige zitplaatsen, voor zover deze aan
      een portier grenzen.

      4 Het eerste, tweede en derde lid zijn niet van toepassing op klapstoelen en zitplaatsen die uitsluitend zijn
      bestemd voor gebruik bij stilstaand voertuig.

      5 De in het tweede en derde lid bedoelde verplichtingen gelden niet voor voertuigen die voor 1 januari 1998 in
      gebruik zijn genomen en die blijkens een aantekening in het voor het voertuig afgegeven kentekenbewijs niet van
      bevestigingspunten voor autogordels behoeven te zijn voorzien.

      6 Autogordels in personenauto's die na 30 september 2000 in gebruik zijn genomen, moeten zijn voorzien van een door
      Onze Minister vastgesteld goedkeuringsmerk.

      7 De autogordels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de sterkte ervan in
      gevaar wordt gebracht.

      8 De autogordels moeten zijn voorzien van een goed werkende sluiting en een goed werkende blokkering.
      Oprolmechanismen moeten zodanig functioneren dat de gordel aanligt na het omdoen ervan.

      9 Onze Minister stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging, bedoeld in het zevende
      lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.47
  - number: 5.2.47 a
    text: |-
      1 In personenauto's die na 30 september 2000 in gebruik zijn genomen, moet bij iedere passagierszitplaats met
      airbag duidelijk zichtbaar en duurzaam zijn aangebracht het volgende symbool

      2 Het eerste lid is niet van toepassing indien het voertuig is voorzien van een mechanisme dat automatisch de
      aanwezigheid van een naar achteren gericht bevestigingssysteem voor kinderen signaleert en dat ervoor zorgt dat de
      airbag niet wordt opgeblazen wanneer een dergelijk systeem is aangebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.47_a
  - number: 5.2.48
    text: |-
      1 Personenauto’s mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor
      andere weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen van personenauto’s, die in geval van botsing
      het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn afgeschermd.

      3 Het bepaalde in het eerste lid en tweede lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m
      boven het wegdek bevinden.

      4 De wielen onderscheidenlijk banden van personenauto's:

      a. moeten goed zijn afgeschermd;

      b. mogen niet meer dan 30 mm buiten de afscherming uitsteken;

      c. mogen niet aanlopen.

      5 Een reservewielhouder die zich aan de buitenzijde van de personenauto bevindt, moet deugdelijk zijn bevestigd.
      Indien in de houder een reservewiel is geplaatst, moet dat wiel goed zijn opgesloten.

      6 Geen deel van de buitenzijde van de personenauto mag zodanig zijn bevestigd, beschadigd, versleten of door
      corrosie zijn aangetast, dat gevaar bestaat voor losraken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.48
  - number: 5.2.51
    text: |-
      1 Personenauto’s moeten zijn voorzien van:

      a. twee of vier grote lichten;

      b. twee dimlichten, met dien verstande dat indien het voertuig is voorzien van dimlichten met
      gasontladingslichtbronnen en in gebruik is genomen na 31 december 2006, deze lichtbronnen voldoen aan door Onze
      Minister gestelde eisen, alsmede voor de installatie daarvan;

      c. twee stadslichten indien het voertuig na 30 juni 1967 in gebruik is genomen, dan wel twee of vier stadslichten
      indien het voertuig vóór 1 juli 1967 in gebruik is genomen;

      d. twee richtingaanwijzers aan de voorzijde en twee aan de achterzijde van het voertuig, dan wel één
      richtingaanwijzer aan elke zijkant indien het voertuig vóór 1 juli 1967 in gebruik is genomen; het licht van de
      richtingaanwijzers van personenauto’s die na 30 juni 1967 in gebruik zijn genomen moet knipperen;

      e. waarschuwingsknipperlichten indien het voertuig na 31 december 1997 in gebruik is genomen;

      f. één zijrichtingaanwijzer aan elke zijkant van het voertuig indien het voertuig na 31 december 1997 in gebruik
      is genomen. Voor voertuigen die voor 1 januari 1998 in gebruik zijn genomen worden de richtingaanwijzers aan de
      voorzijde van het voertuig beschouwd als zijrichtingaanwijzers indien het uitgestraalde licht hiervan duidelijk te
      zien is vanuit een punt gelegen op 6,00 m achter de voorzijde van het voertuig en 1,00 m zijwaarts;

      g. twee achterlichten indien het voertuig na 30 juni 1967 in gebruik is genomen, dan wel twee of vier achterlichten
      indien het voertuig vóór 1 juli 1967 in gebruik is genomen;

      h. twee remlichten indien het voertuig na 30 juni 1967 in gebruik is genomen, dan wel één of twee remlichten indien
      het voertuig vóór 1 juli 1967 in gebruik is genomen;

      i. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      j. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig;

      k. een of twee mistlichten aan de achterzijde van het voertuig indien het voertuig na 31 december 1997 in gebruik
      is genomen; in het geval van één mistlicht moet dit zich bevinden in of links van het middenlangsvlak van het
      voertuig;

      l. een of twee achteruitrijlichten indien het voertuig na 31 december 1997 in gebruik is genomen;

      m. twee markeringslichten aan de voorzijde en twee aan de achterzijde van het voertuig, indien het voertuig na
      31 december 1997 in gebruik is genomen en breder is dan 2,10 m, dan wel voor 1 januari 1998 in gebruik is genomen
      en breder is dan 2,60 m;

      n. zijmarkeringslichten indien het voertuig na 31 december 1997 in gebruik is genomen en langer is dan 6,00 m,
      aangebracht overeenkomstig de door Onze Minister vastgestelde eisen;

      o. ten minste twee ambergele retroreflectoren aan elke zijkant van het voertuig, indien het voertuig na 31 december
      1997 in gebruik is genomen en langer is dan 6,00 m;

      p. een derde remlicht indien het voertuig in gebruik is genomen na 30 september 2001, aangebracht zodanig dat:

      1º. het midden van het lichtdoorlatende gedeelte zich bevindt in het middenlangsvlak van het voertuig of de rand
      van het lichtdoorlatende gedeelte op een afstand van ten hoogste 0,15 m vanaf dit middenlangsvlak indien het derde
      remlicht niet op een vast deel van de carrosserie of bovenbouw kan worden bevestigd, en

      2º. de onderzijde van het lichtdoorlatende gedeelte hoger ligt dan de bovenzijde van de remlichten, bedoeld in
      onderdeel h.

      2 In afwijking van het eerste lid, onderdeel h, worden twee extra remlichten aangebracht, indien het derde remlicht
      niet op een vast deel van de carrosserie of bovenbouw binnen 0,15m vanaf het middenlangsvlak kan worden bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.51
  - number: 5.2.53
    text: |-
      1 De grote lichten, dimlichten, stadslichten en achteruitrijlichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers en waarschuwingsknipperlichten mogen naar voren niet anders dan ambergeel of wit en naar
      achteren niet anders dan ambergeel of rood stralen.

      3 De zijrichtingaanwijzers, bedoeld in [artikel 5.2.51, onderdeel f][ref1], mogen niet anders dan ambergeel
      stralen.

      4 De achterlichten en mistlichten aan de achterzijde mogen niet anders dan rood stralen.

      5 De remlichten mogen niet anders dan rood of ambergeel stralen.

      6 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.

      7 De markeringslichten mogen naar voren niet anders dan wit, en naar achteren niet anders dan rood stralen.

      8 De zijmarkeringslichten mogen niet anders dan ambergeel stralen. Indien het achterste zijmarkeringslicht
      onderdeel uitmaakt van een rood stralend licht dan wel van een rode retroreflector, mag dit licht rood stralen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.2.51
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.53
