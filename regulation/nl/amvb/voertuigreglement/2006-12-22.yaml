  - number: 5.4.66
    text: |-
      1 Indien de motorfiets is voorzien van een inrichting tot het koppelen van een aanhangwagen, moet deze inrichting
      deugdelijk zijn bevestigd en mag deze niet zijn gescheurd, gebroken of vervormd. Onze Minister stelt regels vast
      met betrekking tot de deugdelijkheid van de bevestiging.

      2 Bij een inrichting als bedoeld in het eerste lid, die is voorzien van een koppelingskogel met een nominale
      diameter van 50 mm:

      a. moet de diameter van de kogel ten minste 49 mm bedragen;

      b. moet de sluit- en borginrichting van een afneembare kogel goed werken en moet de bevestiging van het
      kogelgedeelte nagenoeg spelingvrij zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.66
  - number: 5.4.71
    text: |-
      1 Motorfietsen moeten zijn voorzien van ten minste een geluidssignaalinrichting die bestaat uit een goed werkende
      hoorn met vaste toonhoogte. Een samenstel van zodanige, tegelijk werkende hoorns wordt als één hoorn beschouwd.

      2 Motorfietsen mogen zijn voorzien van een geluidssignaalinrichting die ertoe strekt ongeoorloofd gebruik of
      diefstal van de motorfiets of de zijspanwagen te voorkomen, alsmede van een geluidssignaal dat de bestuurder
      kenbaar maakt dat de richtingaanwijzer is ingeschakeld.

      3 Motorfietsen mogen, onverminderd het in [artikel 29 van het RVV 1990][ref1] bepaalde inzake twee- en drietonige
      hoorns, niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.71
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
  - number: 5.5.1
    text: |-
      Driewielige motorrijtuigen moeten voldoen aan de volgende eisen:

      a. het voertuig moet in overeenstemming zijn met de op het voor het voertuig afgegeven kentekenbewijs en in het
      kentekenregister omtrent het voertuig vermelde gegevens;

      b. het identificatienummer moet op een vast voertuigdeel zijn ingeslagen en moet goed leesbaar zijn;

      c. het voertuig moet aan de achterzijde en mag aan de voorzijde zijn voorzien van een
      kentekenplaat. De kentekenplaten moeten deugdelijk zijn bevestigd en zijn voorzien van het in
      [artikel 5 van het Kentekenreglement][ref1] voorgeschreven goedkeuringsmerk;

      d. de kentekenplaat aan de achterzijde mag niet zijn afgeschermd en het kenteken moet goed leesbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '5'
  - number: 5.5.3
    text: |-
      1 De langs- en dwarsliggers en chassisversterkingsdelen van het chassisraam, dan wel de daarvoor in de plaats
      tredende delen van de mee- of zelfdragende carrosserie van driewielige motorrijtuigen mogen:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte van het
      chassisraam of van de mee- of zelfdragende carrosserie in gevaar worden gebracht.

      2 Indien het driewielig motorrijtuig is opgebouwd uit een frame met voor- of achtervork mogen deze onderdelen:

      a. geen breuken of scheuren vertonen;

      b. niet zijn doorgeroest;

      c. niet zodanig zijn vervormd dat de stijfheid en de sterkte ervan in gevaar worden gebracht.

      3 De onderdelen die deel uitmaken van het frame of van de zelfdragende constructie moeten deugdelijk zijn
      bevestigd.

      4 Onze Minister stelt regels vast inzake corrosie van de in het eerste lid bedoelde onderdelen alsmede de
      bevestiging daarvan.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.3
  - number: 5.5.4
    text: De bovenbouw van driewielige motorrijtuigen moet deugdelijk op het onderstel dan wel het frame zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.4
  - number: 5.5.6
    text: |-
      1 Driewielige motorrijtuigen die in gebruik zijn genomen na 31 oktober 1997 mogen:

      a. niet langer zijn dan 4,00 m;

      b. niet breder zijn dan 2,00 m;

      c. niet hoger zijn dan 2,50 m.

      2 Driewielige motorrijtuigen die in gebruik zijn genomen voor 1 november 1997 mogen:

      a. niet langer zijn dan 12,00 m;

      b. niet breder zijn dan 2,55 m;

      c. niet hoger zijn dan 4,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.6
  - number: 5.5.7
    text: |-
      1 De ledige massa van driewielige motorrijtuigen die na 1 februari 1999 in gebruik zijn genomen, mag niet meer
      bedragen dan voor het betrokken voertuig in het kentekenregister of op het kentekenbewijs is vermeld, en in elk
      geval niet meer dan 1000 kg. In afwijking van [artikel 1.1, onderdeel ad][ref1], wordt bij het bepalen van de
      ledige massa de massa van de brandstof of de massa van de batterijen in elektrische voertuigen buiten beschouwing
      gelaten.

      2 De totale massa van driewielige motorrijtuigen die na 1 februari 1999 in gebruik zijn genomen, mag niet meer
      bedragen dan voor het betrokken voertuig in het kentekenregister of op het kentekenbewijs is vermeld, en in elk
      geval niet meer dan:

      a. 1300 kg voor driewielige motorrijtuigen gebruikt in het personenvervoer,

      b. 2500 kg voor driewielige motorrijtuigen gebruikt in het goederenvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.7
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '1.1'
        hoofdstuk: '1'
  - number: 5.5.9
    text: |-
      1 Alle onderdelen van het brandstofsysteem dan wel van de elektrische aandrijving van driewielige motorrijtuigen
      moeten veilig zijn en deugdelijk zijn bevestigd. Onze Minister stelt regels vast met betrekking tot de
      deugdelijkheid van de bevestiging.

      2 Het brandstofsysteem mag geen lekkage vertonen.

      3 De vulopening van het brandstofreservoir moet zijn afgesloten met een passende tankdop.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.9
  - number: 5.5.10
    text: |-
      1 Indien het driewielig motorrijtuig is voorzien van een LPG-installatie, moet deze, onverminderd het bepaalde in
      [artikel 5.5.9][ref1], voldoen aan de in de volgende leden gestelde eisen.

      2 De LPG-tank:

      a. moet permanent zijn aangebracht aan het voertuig;

      b. mag niet door corrosie zijn aangetast, met uitzondering van corrosie van het oppervlak;

      c. mag geen deuken vertonen.

      3 De LPG-tank mag niet in de motorruimte zijn geplaatst en indien het voertuig in gebruik is genomen na 31 december
      1994, niet op het dak zijn geplaatst.

      4 De volgende onderdelen moeten aanwezig zijn:

      a. de veerveiligheid, die in de buitenlucht moet uitmonden;

      b. de verdamper/drukregelaar, al dan niet gecombineerd, dan wel een mengregelsysteem;

      c. de gasdichte kast indien het voertuig in gebruik is genomen na 31 maart 1979, tenzij de tank in de open lucht
      is geplaatst;

      d. de automatische inrichting ter begrenzing van de vullingsgraad indien het voertuig na 30 juni 1983 in gebruik
      is genomen;

      e. de automatische afnameklep op de tank indien het voertuig na 31 december 1987 in gebruik is genomen;

      f. het gasmengstuk dan wel een inspuitstuk;

      g. de automatische afsluitklep.

      5 Op de LPG-installatie mogen geen andere verbruikers zijn aangesloten dan die, welke strikt noodzakelijk zijn voor
      het goed functioneren van de motor van het voertuig.

      6 Indien het voertuig na 30 september 1978 in gebruik is genomen, mag het vullen van de tank alleen buiten het
      voertuig kunnen geschieden.

      7 De in het vierde lid genoemde onderdelen moeten vrij zijn van ernstige beschadigingen en mogen niet door corrosie
      zijn aangetast, met uitzondering van corrosie van het oppervlak.

      8 De leidingen mogen geen knikken vertonen en mogen niet door corrosie zijn aangetast, met uitzondering van
      corrosie van het oppervlak.

      9 De gasvoerende slangen van rubber mogen geen beschadiging vertonen waarbij het wapeningsmateriaal zichtbaar is.
      De slangen die aan de buitenzijde van een metalen wapening zijn voorzien, mogen geen beschadiging vertonen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.5.9
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.10
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.5.9
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '5'
  - number: 5.5.10a
    text: |-
      1 Indien het driewielige motorrijtuig is voorzien van een CNG-installatie, moet deze, onverminderd
      [artikel 5.5.9][ref1], voldoen aan de in de in het tweede tot en met achtste lid gestelde eisen.

      2 De CNG-tank:

      a. moet permanent zijn aangebracht aan het voertuig, en

      b. mag geen deuken vertonen.

      3 De CNG-tank mag niet in de motorruimte zijn geplaatst.

      4 Indien de CNG-tank in gebruik is genomen na 19 juli 2002, mag de geldigheid van de goedkeuring niet verstreken
      zijn. CNG-tanks die voor 20 juli 2002 in gebruik zijn genomen en waarvan de gegevens omtrent de geldigheid van de
      goedkeuring niet beschikbaar zijn, mogen niet ouder zijn dan 10 jaar, dan wel mag het voertuig niet ouder zijn dan
      10 jaar.

      5 Op de CNG-installatie mogen geen andere verbruikers zijn aangesloten dan die, welke strikt noodzakelijk zijn voor
      het goed functioneren van de motor van het voertuig, met uitzondering van een verwarmingsinstallatie ten behoeve
      van de personenruimte of laadruimte.

      6 Indien het voertuig in gebruik genomen is na 1 juli 1995, moet het voertuig zijn voorzien van een goed werkende
      automatische tankafsluiter.

      7 De onderdelen van de CNG-installatie moeten vrij zijn van ernstige beschadigingen en mogen niet door corrosie
      zijn aangetast, met uitzondering van corrosie van het oppervlak.

      8 De leidingen en gasvoerende slangen mogen geen knikken vertonen.

      9 De gasvoerende slangen mogen geen beschadiging vertonen waarbij het wapeningsmateriaal zichtbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.5.9
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.10a
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.5.9
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '5'
  - number: 5.5.11
    text: |-
      1 Driewielige motorrijtuigen met een verbrandingsmotor moeten zijn voorzien van een uitlaatsysteem dat over de
      gehele lengte gasdicht is, met uitzondering van de afwateringsgaatjes.

      2 Het uitlaatsysteem moet deugdelijk zijn bevestigd.

      3 Driewielige motorrijtuigen moeten blijven behoren tot een goedgekeurd type als bedoeld in
      [artikel 3 van het Besluit geluidproduktie motorvoertuigen][ref1] (*Stb.* 1981, 741). Aan deze eis wordt niet
      getoetst tijdens de periodieke keuring ten behoeve van de afgifte van een keuringsrapport.

      4 Het uitlaatsysteem moet behoorlijk geluiddempend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003464#Artikel3
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.11
    references:
      - id: ref1
        bwb_id: BWBR0003464
        artikel: '3'
  - number: 5.5.12
    text: |-
      1 De accu van driewielige motorrijtuigen moet deugdelijk zijn bevestigd.

      2 De bedrading van driewielige motorrijtuigen moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.12
  - number: 5.5.13
    text: |-
      1 De motorsteunen van driewielige motorrijtuigen moeten deugdelijk aan het chassis dan wel de carrosserie alsmede
      aan de motor zijn bevestigd. Indien de motor en de versnellingsbak zijn samengebouwd, dan worden de steunen van de
      versnellingsbak mede als motorsteunen beschouwd.

      2 De motorsteunen mogen niet in ernstige mate zijn beschadigd, de rubbers mogen niet zijn doorgescheurd en de
      vulcanisatie mag niet geheel zijn losgeraakt.

      3 Onze Minister stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.13
  - number: 5.5.15
    text: |-
      Driewielige motorrijtuigen, in gebruik genomen na 26 november 1975 doch voor 17 juni 1999 of na 16 juni 2003,
      moeten zijn voorzien van een goed werkende snelheidsmeter die ook bij nacht voor de bestuurder goed afleesbaar is.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.15
  - number: 5.5.16
    text: |-
      1 De onderdelen van de aandrijving van driewielige motorrijtuigen moeten deugdelijk zijn bevestigd.

      2 Stofhoezen van aandrijfassen moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de hoezen
      niet meer afdichten.

      3 Kruiskoppelingen moeten een zichtbaar spelingsvrije overbrenging kunnen bewerkstelligen.

      4 Onze Minister stelt regels vast met betrekking tot het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.16
  - number: 5.5.18
    text: |-
      1 De assen van driewielige motorrijtuigen moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen breuken
      of scheuren vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn bevestigd, beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht.

      5 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid met betrekking tot de deugdelijkheid van
      de bevestiging.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.18
  - number: 5.5.19
    text: |-
      1 De fuseepennen, -lageringen, -bussen en -kogels van driewielige motorrijtuigen moeten deugdelijk zijn bevestigd.

      2 Stofhoezen van fuseekogels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de hoezen
      niet meer afdichten.

      3 De fuseepennen, -lageringen, -bussen en -kogels alsmede de overige draaipunten van de wielophanging mogen niet te
      veel speling vertonen.

      4 Indien een gedeelte van de binnenkant van het fuseekogelhuis en van de fuseekogel zichtbaar is doordat de hoes is
      beschadigd of ontbreekt, mag dit gedeelte geen corrosie vertonen.

      5 Onze Minister stelt regels vast omtrent het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.19
  - number: 5.5.20
    text: |-
      1 De wiellagers van driewielige motorrijtuigen mogen niet te veel speling vertonen.

      2 Verschijnselen van slijtage of beschadiging mogen niet hoorbaar of voelbaar zijn.

      3 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.20
  - number: 5.5.21
    text: |-
      1 De wielbasis van driewielige motorrijtuigen mag niet meer dan 1,0% afwijken van de waarde die voor het voertuig
      is vermeld op het kentekenbewijs of in het kentekenregister, onderscheidenlijk niet meer dan 60 mm indien het een
      driewielig motorrijtuig met kettingaandrijving betreft.

      2 Behoudens fabrieksmatige verschillen mag de wielbasis van driewielige motorrijtuigen op vier wielen links en
      rechts gemeten niet meer dan 15 mm verschillen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.21
  - number: 5.5.24
    text: |-
      1 De wielen onderscheidenlijk velgen van driewielige motorrijtuigen mogen geen breuken, scheuren, ondeugdelijk
      laswerk of ernstige vervorming vertonen.

      2 De wielen onderscheidenlijk velgen moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.24
  - number: 5.5.27
    text: |-
      1 De wielen van driewielige motorrijtuigen moeten zijn voorzien van luchtbanden.

      2 De banden mogen geen beschadigingen vertonen waarbij het karkas zichtbaar is.

      3 De banden mogen geen uitstulpingen vertonen.

      4 De profilering van de hoofdgroeven van de banden moet over de gehele omtrek van het loopvlak ten minste 1,6 mm
      bedragen, met uitzondering van slijtage-indicatoren.

      5 De banden mogen niet zijn opgesneden. Van opsnijden is sprake indien slijtage-indicatoren zijn weggesneden,
      indien de profielvorm van de groef afwijkt van de originele profielvorm, of indien in de bodem van de groef het
      karkas van de band zichtbaar is.

      6 De banden op een as moeten dezelfde karkasstructuur hebben, onverminderd het bepaalde in [artikel 5.18.32][ref1].

      7 Het loopvlak van de banden mag geen metalen elementen bevatten die tijdens het rijden daarbuiten kunnen
      uitsteken.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.32
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.27
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.18.32
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: '18'
  - number: 5.5.28
    text: |-
      1 Indien het driewielig motorrijtuig is voorzien van een veersysteem, moet dit goed werken.

      2 De onderdelen van het veersysteem mogen geen breuken of scheuren vertonen, mogen niet ernstig door corrosie zijn
      aangetast en moeten deugdelijk zijn bevestigd.

      3 Indien een driewielig motorrijtuig met een toegestane maximum massa van meer dan 1000 kg, dan wel met een ledige
      massa van meer dan 400 kg, is voorzien van schokdempers, moeten deze deugdelijk zijn bevestigd en goed werken.

      4 Onze Minister stelt regels vast omtrent het bepaalde in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.28
  - number: 5.5.29
    text: |-
      1 De bestuurde wielen van driewielige motorrijtuigen moeten goed reageren op de draaiing van het stuurwiel.

      2 Bij draaiing van het stuurwiel tot aan de aanslagen mogen geen weerstanden voelbaar zijn en moeten de wielen
      onderscheidenlijk de banden vrij kunnen draaien.

      3 De voor de overbrenging van de stuurbeweging bestemde onderdelen moeten deugdelijk zijn bevestigd met alle
      daarvoor bestemde bevestigings- en borgmiddelen, mogen geen breuken of scheuren vertonen, mogen niet zijn vervormd
      en mogen niet ernstig door corrosie zijn aangetast.

      4 Stofhoezen van het stuurhuis en de stuurkogels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn
      beschadigd dat de hoezen niet meer afdichten.

      5 Kruiskoppelingen moeten een zichtbaar spelingsvrije overbrenging kunnen bewerkstelligen.

      6 Flexibele koppelingen mogen niet in ernstige mate zijn gescheurd en de vulcanisatie mag niet in ernstige mate
      zijn losgeraakt.

      7 De verbindingen in het stangenstelsel mogen niet te veel speling vertonen.

      8 Indien een gedeelte van de binnenkant van het stuurkogelhuis en van de stuurkogel zichtbaar is doordat de hoes is
      beschadigd of ontbreekt, mag dit gedeelte geen corrosie vertonen.

      9 Onze Minister stelt regels vast met betrekking tot het bepaalde in het derde, zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.29
  - number: 5.5.30
    text: |-
      1 Indien het driewielig motorrijtuig is voorzien van een voorvork, moet deze zonder zware punten in het balhoofd
      kunnen draaien.

      2 De balhoofdlagering mag geen zichtbare speling vertonen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.30
  - number: 5.5.31
    text: |-
      1 Driewielige motorrijtuigen moeten zijn voorzien van een reminrichting waarvan de onderdelen:

      a. deugdelijk zijn bevestigd met de daarvoor bestemde bevestigings- en borgmiddelen;

      b. niet in ernstige mate door corrosie zijn aangetast;

      c. niet zijn beschadigd, gescheurd of gebroken;

      d. geen inwendige of uitwendige lekkage vertonen.

      2 De rembekrachtiger en remkrachtregelaar moeten goed functioneren.

      3 Het rempedaal onderscheidenlijk de remhandel mag geen zodanige slag maken dat het pedaal dan wel de handel tot
      een aanslag kan worden ingetrapt of ingedrukt.

      4 Het oppervlak van het rempedaal moet stroef zijn.

      5 Remslangen mogen:

      a. niet in ernstige mate zijn misvormd;

      b. niet langs andere voertuigdelen schuren;

      c. geen zodanige beschadigingen vertonen dat het wapeningsmateriaal zichtbaar is.

      6 Remkabels mogen niet zijn gerafeld en moeten goed gangbaar zijn.

      7 Wielen die zijn voorzien van een trommelrem, moeten in onberemde toestand in beide richtingen kunnen draaien
      zonder dat de remvoering aanloopt. De remvoering van wielen die zijn voorzien van een schijfrem, mag in onberemde
      toestand in beide richtingen enigszins slepen.

      8 De remtrommel of remschijf mag tijdens het remmen niet worden geraakt door delen die zijn bestemd als drager of
      bevestigingsmiddel van remvoering.

      9 De noodzakelijke bewegingsvrijheid van de remonderdelen mag niet worden beperkt.

      10 Remcylinders moeten zijn voorzien van stofhoezen die niet in ernstige mate mogen zijn beschadigd.

      11 Anti-blokkeersystemen moeten goed functioneren en moeten zijn voorzien van een deugdelijke
      waarschuwingsinrichting die in werking treedt zodra het systeem faalt.

      12 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid, onderdelen *a* en *b*, en het vijfde
      lid, onderdeel *a*.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.31
  - number: 5.5.32
    text: |-
      1 Driewielige motorrijtuigen, in gebruik genomen na 30 juni 1967, moeten indien het hydraulisch remsysteem niet
      is voorzien van een toegankelijk remvloeistofreservoir, waarvan het vloeistofpeil te controleren is zonder het
      reservoir te openen, zijn voorzien van:

      a. een deugdelijke waarschuwingsinrichting die in werking treedt zodra het niveau van de remvloeistof onder het
      vereiste minimum niveau is gedaald, of

      b. in geval van een gescheiden remsysteem een deugdelijke waarschuwingsinrichting die in werking treedt zodra een
      van de kringen van het remsysteem faalt.

      2 De goede werking van het signaal van de in het eerste lid bedoelde waarschuwingsinrichtingen moet kunnen worden
      gecontroleerd.

      3 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.32
  - number: 5.5.38
    text: |-
      1 Driewielige motorrijtuigen, in gebruik genomen na 31 maart 1990, moeten zijn voorzien van een bedrijfsrem waarvan
      de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg:

      a. ten minste 4,5 m/s2 bedraagt bij een pedaalkracht van niet meer dan 500 N onderscheidenlijk bij een kracht op de
      remhandel van niet meer dan 200 N;

      b. ten minste 4,0 m/s2 bedraagt bij een pedaalkracht van niet meer dan 700 N onderscheidenlijk bij een kracht op de
      remhandel van niet meer dan 200 N, indien het een voertuig betreft dat voor 1 april 1997 in gebruik is genomen en
      dat is bestemd voor het vervoer van goederen;

      c. in geval van een gecombineerde reminrichting:

      1°. bij gebruik van de gecombineerde reminrichting ten minste 4,5 m/s2 bedraagt, en

      2°. bij gebruik van de andere bedrijfsrem of hulprem ten minste 2,2 m/s2 bedraagt.

      2 Driewielige motorrijtuigen met een ledige massa van meer dan 400 kg, in gebruik genomen na 26 november 1975 doch
      vóór 1 april 1990, moeten zijn voorzien van een bedrijfsrem waarvan de remvertraging op een droge of nagenoeg droge
      en ongeveer horizontaal liggende weg ten minste 4,0 m/s2 bedraagt bij een pedaalkracht van niet meer dan 700 N
      onderscheidenlijk bij een kracht op de remhandel van niet meer dan 200 N.

      3 Driewielige motorrijtuigen met een ledige massa van niet meer dan 400 kg, in gebruik genomen na 26 november 1975
      doch vóór 1 april 1990, moeten zijn voorzien van een bedrijfsrem waarvan de remvertraging op een droge of nagenoeg
      droge en ongeveer horizontaal liggende weg ten minste 4,0 m/s2 bedraagt, welke waarde bij voertuigen met twee
      reminrichtingen moet worden gehaald bij gebruik van beide remmen tezamen; bij gebruik van elke der reminrichtingen
      afzonderlijk moet de remvertraging ten minste 1,7 m/s2 bedragen.

      4 Driewielige motorrijtuigen, in gebruik genomen voor 27 november 1975, moeten zijn voorzien van een bedrijfsrem
      waarvan de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 3,8 m/s2
      bedraagt, welke waarde bij voertuigen met twee reminrichtingen moet worden gehaald bij gebruik van beide remmen
      tezamen.

      5 De bedrijfsrem van driewielige motorrijtuigen met een ledige massa van meer dan 400 kg moet op alle wielen
      werken.

      6 Driewielige motorrijtuigen mogen op een droge of nagenoeg droge weg niet uitbreken ten gevolge van een verschil
      in remwerking tussen de wielen van elke as onderscheidenlijk ten gevolge van overberemming van de achteras.

      7 Onze Minister stelt regels vast met betrekking tot het bepaalde in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.38
  - number: 5.5.39
    text: |-
      1 Driewielige motorrijtuigen moeten zijn voorzien van een parkeerrem die op ten minste één as werkt.

      2 De parkeerrem van driewielige motorrijtuigen, in gebruik genomen na 30 juni 1967, moet het voertuig op een
      helling van 16,0% in beide richtingen in stilstand kunnen houden. Hieraan wordt geacht te zijn voldaan indien
      de remvertraging, uitgaande van een aanvangssnelheid van 15 km/h, op een droge of nagenoeg droge en ongeveer
      horizontaal liggende weg ten minste 1,2 m/s2 bedraagt en de rem ook in achterwaartse richting functioneert.

      3 De remvertraging van de parkeerrem van driewielige motorrijtuigen, in gebruik genomen voor 1 juli 1967, moet op
      een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 1,0 m/s2 bedragen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.39
  - number: 5.5.40
    text: |-
      1 Indien het driewielig motorrijtuig na 30 juni 1967 in gebruik is genomen en is voorzien van een geheel
      afzonderlijk hulpremsysteem, moet:

      a. het hulpremsysteem goed functioneren;

      b. de remwerking redelijk gelijkmatig over de wielen links en rechts van de as zijn verdeeld.

      2 De remvertraging van het in het eerste lid bedoelde hulpremsysteem moet op een droge of nagenoeg droge en
      ongeveer horizontaal liggende weg ten minste 2,0 m/s2 bedragen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.40
  - number: 5.5.41
    text: |-
      1 De deuren van driewielige motorrijtuigen moeten goed sluiten. De deuren die direct toegang geven tot de
      personenruimte, moeten op normale wijze vanaf de binnenzijde of vanaf de buitenzijde kunnen worden geopend.

      2 Het slot en de scharnieren van de motorkap of het kofferdeksel aan de voorzijde van het voertuig moeten een goede
      sluiting waarborgen.

      3 De bevestiging van de scharnieren van de deuren, de motorkap en het kofferdeksel mag niet in ernstige mate door
      corrosie zijn aangetast.

      4 Onze Minister stelt regels vast omtrent het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.41
  - number: 5.5.42
    text: |-
      1 De voorruit, de zijruiten dan wel het windscherm van driewielige motorrijtuigen mogen:

      a. geen beschadigingen of verkleuringen vertonen,

      b. niet zijn voorzien van onnodige voorwerpen,

      die het uitzicht van de bestuurder belemmeren.

      2 Indien het driewielig motorrijtuig niet is voorzien van een rechterbuitenspiegel, mag de achterruit:

      a. geen beschadigingen of verkleuringen vertonen,

      b. niet zijn voorzien van onnodige voorwerpen,

      die het uitzicht van de bestuurder belemmeren.

      3 Onze Minister kan regels vaststellen omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.42
  - number: 5.5.43
    text: |-
      1 Driewielige motorrijtuigen met een voorruit moeten zijn voorzien van een goed werkende ruitenwisserinstallatie
      die de bestuurder voldoende uitzicht geeft.

      2 Het eerste lid is niet van toepassing op driewielige motorrijtuigen met een voorruit met een ledige massa van
      niet meer dan 400 kg die voor 27 november 1975 in gebruik zijn genomen.

      3 Driewielige motorrijtuigen met een voorruit, die na 31 december 1994, in gebruik zijn genomen, moeten zijn
      voorzien van een goed werkende ruitensproeierinstallatie.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.43
  - number: 5.5.44
    text: |-
      1 Driewielige motorrijtuigen met een voorruit, die na 16 juni 2003 in gebruik zijn genomen, moeten zijn voorzien
      van een goed werkende installatie ter ontdooiing en ontwaseming van de voorruit.

      2 Driewielige motorrijtuigen met een voorruit en met een gesloten carrosserie, die na 31 december 1994, doch voor
      17 juni 2003 in gebruik zijn genomen, moeten zijn voorzien van een goed werkende installatie ter ontdooiing en
      ontwaseming van de voorruit.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.44
  - number: 5.5.45
    text: |-
      1 Driewielige motorrijtuigen moeten zijn voorzien van een linker buitenspiegel. Deze eis geldt niet voor
      voertuigen:

      a. waarvan de ledige massa niet meer bedraagt dan 400 kg,

      b. waarbij de bestuurder een zodanige plaats inneemt dat hij van zijn zitplaats het achter hem gelegen weggedeelte
      kan overzien, en

      c. die in gebruik zijn genomen vóór 27 november 1975.

      2 Driewielige motorrijtuigen met een gesloten carrosserie moeten zijn voorzien van een binnenspiegel. Deze eis
      geldt niet voor voertuigen die in gebruik zijn genomen voor 17 juni 2003 en voldoen aan de in het eerste lid,
      onderdelen a en b, genoemde voorwaarden.

      3 Driewielige motorrijtuigen moeten zijn voorzien van een rechterbuitenspiegel indien met de verplichte
      binnenspiegel het achter het voertuig gelegen weggedeelte niet voldoende kan worden overzien. Indien de
      binnenspiegel geen zicht naar achteren mogelijk maakt, behoeft deze niet aanwezig te zijn.

      4 De aan de zijde van de bestuurder bevestigde buitenspiegel moet vanuit de binnenzijde bij gesloten portier
      kunnen worden versteld. Deze eis geldt niet voor driewielige motorrijtuigen die vóór 1 januari 1975 in gebruik
      zijn genomen. De spiegels van deze voertuigen moeten, na door een duw te zijn omgeklapt, zonder verstelling in de
      oorspronkelijke stand terug kunnen klappen.

      5 De spiegels moeten deugdelijk zijn bevestigd.

      6 Het spiegelglas van de verplichte spiegels mag geen verschijnselen van breuk vertonen en mag niet in ernstige
      mate zijn verweerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.45
  - number: 5.5.46
    text: |-
      1 De zitplaatsen van driewielige motorrijtuigen moeten deugdelijk aan het voertuig zijn bevestigd. Onze Minister
      stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging.

      2 Bij driewielige motorrijtuigen met een ledige massa van meer dan 400 kg, in gebruik genomen na 30 september 1971,
      moeten:

      a. verschuifbare zitplaatsen in elke mogelijke stand automatisch zijn vergrendeld;

      b. verstelbare rugleuningen van zitplaatsen in elke mogelijke stand kunnen worden vergrendeld;

      c. de voorste zitplaatsen, indien zij scharnierend zijn, dan wel de rugleuningen van de voorste zitplaatsen, indien
      zij scharnierend zijn, in de normale stand automatisch zijn vergrendeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.46
  - number: 5.5.47
    text: |-
      1 Driewielige motorrijtuigen met een gesloten carrosserie, die na 16 juni 2003 in gebruik zijn genomen, moeten zijn
      voorzien van autogordels voor alle naar voren en naar achteren gerichte zitplaatsen.

      2 Driewielige motorrijtuigen met een gesloten carrosserie, die na 31 december 1989 doch voor 17 juni 2003 in
      gebruik zijn genomen, moeten zijn voorzien van autogordels voor alle naar voren gerichte zitplaatsen.

      3 Driewielige motorrijtuigen die na 1 januari 1971 doch voor 1 januari 1990 in gebruik zijn genomen en die zijn
      ingericht voor het vervoer van personen of die beurtelings voor het vervoer van personen of goederen kunnen
      worden ingericht, moeten zijn voorzien van autogordels voor de zitplaats van de bestuurder en de naast deze plaats
      aanwezige zitplaatsen, voor zover deze aan een portier grenzen.

      4 Het eerste, tweede en derde lid zijn niet van toepassing op klapstoelen.

      5 De in het tweede en derde lid bedoelde verplichtingen gelden niet voor voertuigen die voor 1 januari 1998 in
      gebruik zijn genomen en die blijkens een aantekening in het voor het voertuig afgegeven kentekenbewijs niet van
      bevestigingspunten voor autogordels behoeven te zijn voorzien.

      6 De autogordels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de sterkte ervan in
      gevaar wordt gebracht. Onze Minister stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging.

      7 De autogordels moeten zijn voorzien van een goed werkende sluiting en een goed werkende blokkering. Oprol-
      mechanismen moeten zodanig functioneren dat de gordel aanligt na het omdoen ervan.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.47
  - number: 5.5.48
    text: |-
      1 Driewielige motorrijtuigen mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk
      letsel voor andere weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen van driewielige motorrijtuigen, die in
      geval van botsing het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn
      afgeschermd.

      3 Het bepaalde in het eerste en tweede lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m boven
      het wegdek bevinden.

      4 De wielen onderscheidenlijk banden van driewielige motorrijtuigen mogen niet aanlopen en moeten goed zijn
      afgeschermd indien het driewielige motorrijtuig voor 17 juni 1999 in gebruik is genomen.

      5 Een reservewielhouder die zich aan de buitenzijde van het driewielige motorrijtuig bevindt, moet deugdelijk zijn
      bevestigd. Indien in de houder een reservewiel is geplaatst, moet dat wiel goed zijn opgesloten.

      6 Geen deel aan de buitenzijde van een driewielig motorrijtuig mag zodanig zijn bevestigd, beschadigd of door
      corrosie zijn aangetast, dat gevaar bestaat voor losraken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.48
  - number: 5.5.51
    text: |-
      1 Driewielige motorrijtuigen moeten zijn voorzien van:

      a. twee grote lichten;

      b. twee dimlichten;

      c. twee stadslichten, indien het voertuig in gebruik is genomen na 30 juni 1967, en twee of vier stadslichten,
      indien het voertuig voor 1 juli 1967 in gebruik is genomen;

      d. twee richtingaanwijzers aan de voorzijde en twee aan de achterzijde van het voertuig, dan wel één
      richtingaanwijzer aan elke zijkant indien het voertuig vóór 1 juli 1967 in gebruik is genomen; het licht van de
      richtingaanwijzers van driewielige motorrijtuigen die na 30 juni 1967 in gebruik zijn genomen moet knipperen;

      e. waarschuwingsknipperlichten indien het voertuig na 31 december 1996 in gebruik is genomen;

      f. twee achterlichten indien het voertuig na 30 juni 1967 in gebruik is genomen en twee of vier achterlichten,
      indien het voertuig voor 1 juli 1967 in gebruik is genomen;

      g. twee remlichten indien het voertuig na 30 juni 1967 in gebruik is genomen, dan wel één of twee remlichten indien
      het voertuig vóór 1 juli 1967 in gebruik is genomen;

      h. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      i. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig.

      2 De in het eerste lid, onderdelen *d* en *g*, genoemde lichten zijn niet verplicht voor driewielige motorrijtuigen
      met een ledige massa van niet meer dan 400 kg, in gebruik genomen voor 27 november 1975, waarbij de bestuurder een
      zodanige plaats inneemt dat de door hem met de arm gegeven seinen zowel goed zichtbaar zijn voor het tegemoetkomend
      verkeer als voor het achteropkomend verkeer.

      3 Driewielige motorrijtuigen met een breedte van niet meer dan 1,30 m mogen in afwijking van het bepaalde in het
      eerste lid, onderdelen *a*, *b*, *c*, *f*, *g* en *i*, zijn voorzien van:

      a. één groot licht;

      b. één dimlicht;

      c. één stadslicht

      d. één achterlicht;

      e. één remlicht;

      f. één niet-driehoekige rode retroreflector.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.51
  - number: 5.5.53
    text: |-
      1 De grote lichten, dimlichten en stadslichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers en waarschuwingsknipperlichten mogen naar voren niet anders dan ambergeel of wit en naar
      achteren niet anders dan ambergeel of rood stralen.

      3 De achterlichten mogen niet anders dan rood stralen.

      4 De remlichten mogen niet anders dan rood of ambergeel stralen.

      5 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.53
  - number: 5.5.55
    text: |-
      1 De in [artikel 5.5.51][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig zijn bevestigd.

      5 De in [artikel 5.5.51][ref2] vermelde lichten en retroreflectoren mogen niet zijn afgeschermd, onverminderd het
      bepaalde in [artikel 5.18.7, eerste lid][ref3].

      6 De retroreflectoren mogen geen gebreken vertonen, die de retroreflectie beïnvloeden.

      7 Onze Minister kan regels vaststellen omtrent het bepaalde in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.5.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.5.51
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.7
