  - number: '9.13'
    text: |-
      1

      2 Het Besluit periodieke keuring van motorrijtuigen, aanhangwagens en opleggers (*Stb.* 1980, 217) wordt
      ingetrokken.

      3 Ingetrokken worden:

      a. de Rijkskeuringsvoorschriften vrachtauto’s, trekkers, aanhangwagens en opleggers 1971 (RKVTAO 71);

      b. de Rijkskeuringsvoorschriften lichte motorvoertuigen 1975 (RKLM 75);

      c. de Rijkskeuringsvoorschriften personenauto’s 1971 (RKP 71);

      d. de Rijkskeuringsvoorschriften voor het aanbrengen van een LPG-installatie bij motorvoertuigen (RKLPG 77);

      e. de bekendmaking van de Directeur van de Rijksdienst voor het Wegverkeer van 24 oktober 1958, betreffende scherpe
      uitstekende delen in de zin van artikel 65, sub k, van het Wegenverkeersreglement.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel9.13
  - number: '9.14'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel9.14
  - number: '9.15'
    text: Dit besluit wordt aangehaald als "Voertuigreglement".
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel9.15
