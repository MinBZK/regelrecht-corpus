        paragraaf: '10'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 5.10.57
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '10'
  - number: 5.10.71
    text: |-
      1 Gehandicaptenvoertuigen moeten zijn voorzien van ten minste een geluidssignaalinrichting die bestaat uit een
      goed werkende hoorn met vaste toonhoogte. Een samenstel van zodanige tegelijk werkende hoorns wordt als één hoorn
      beschouwd.

      2 Gehandicaptenvoertuigen mogen zijn voorzien van een geluidssignaalinrichting die andere weggebruikers erop attent
      maakt dat de achteruitversnelling van het voertuig is ingeschakeld, alsmede van een geluidssignaalinrichting die
      ertoe strekt ongeoorloofd gebruik of diefstal van het voertuig te voorkomen.

      3 Gehandicaptenvoertuigen mogen niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld in het eerste
      en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.71
  - number: 5.11.3
    text: |-
      1 Het frame dan wel de daarvoor in de plaats tredende delen van gehandicaptenvoertuigen mag:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte ervan in gevaar
      worden gebracht.

      2 Indien het gehandicaptenvoertuig is opgebouwd uit een frame met voor- of achtervork mogen deze onderdelen:

      a. geen breuken of scheuren vertonen;

      b. niet zijn doorgeroest;

      c. niet zodanig zijn vervormd dat de stijfheid en de sterkte ervan in gevaar worden gebracht.

      3 De onderdelen die deel uitmaken van het frame of de daarvoor in de plaats tredende constructie moeten deugdelijk
      zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.3
  - number: 5.11.6
    text: |-
      Gehandicaptenvoertuigen mogen:

      a. niet langer zijn dan 3,50 m;

      b. niet breder zijn dan 1,10 m;

      c. niet hoger zijn dan 2,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.6
  - number: 5.11.9
    text: |-
      1 Alle onderdelen van de elektrische aandrijving van gehandicaptenvoertuigen moeten veilig zijn en deugdelijk zijn
      bevestigd.

      2 Gehandicaptenvoertuigen moeten zijn voorzien van een:

      a. aan- en uitschakelaar voor de elektromotor;

      b. schakelaar voor het regelen van de snelheid van het voertuig; alsmede van een vanuit de zitpositie van de
      bestuurder zichtbare:

      c. aanduiding omtrent de ladingsconditie van de tractiebatterijen;

      d. aan- en uitindicator voor de elektrische installatie.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.9
  - number: 5.11.12
    text: |-
      1 De tractiebatterij van gehandicaptenvoertuigen moet deugdelijk zijn bevestigd.

      2 De bedrading van gehandicaptenvoertuigen moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.

      3 Gehandicaptenvoertuigen moeten zijn voorzien van een beveiliging tegen overbelasting. Na een onderbreking van
      de stroomvoorziening moet de bestuurder deze door middel van een schakelaar, welke zich binnen het bereik van de
      bestuurder bevindt, kunnen herstellen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.12
  - number: 5.11.17
    text: Bij gehandicaptenvoertuigen moet de snelheid regelbaar zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.17
  - number: 5.11.29
    text: |-
      1 De stuurinrichting van gehandicaptenvoertuigen moet deugdelijk zijn.

      2 De voor de overbrenging van de stuurbeweging bestemde onderdelen moeten deugdelijk zijn bevestigd met alle
      daarvoor bestemde bevestigings- en borgmiddelen, mogen geen breuken of scheuren vertonen, mogen niet zijn vervormd
      en mogen niet ernstig door corrosie zijn aangetast.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.29
  - number: 5.11.38
    text: |-
      1 Gehandicaptenvoertuigen moeten zijn voorzien van een goedwerkende bedrijfsrem die ten minste op de wielen van één
      as werkt.

      2 Het voertuig mag door het remmen geen zijwaartse beweging maken.

      3 Remkabels mogen niet zijn gerafeld en moeten goed gangbaar zijn.

      4 De noodzakelijke bewegingsvrijheid van de remonderdelen mag niet worden beperkt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.38
  - number: 5.11.39
    text: |-
      Van gehandicaptenvoertuigen moet vanuit de zitpositie van de bestuurder:

      a. de rem of één van de remmen in aangezette toestand kunnen worden vastgezet, dan wel

      b. een afzonderlijke vastzetinrichting kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.39
  - number: 5.11.46
    text: De zitplaats van gehandicaptenvoertuigen moet deugdelijk aan het onderstel dan wel het frame zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.46
  - number: 5.11.48
    text: |-
      Gehandicaptenvoertuigen mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel
      voor andere weggebruikers kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.48
  - number: 5.11.51
    text: |-
      Gehandicaptenvoertuigen moeten zijn voorzien van een niet-driehoekige rode retroreflector aan de achterzijde van
      het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.51
  - number: 5.11.54
    text: |-
      De niet-driehoekige rode retroreflector moet zijn aangebracht aan de linkerzijde van het voertuig op een hoogte van
      niet minder dan 0,25 m en niet meer dan 0,90 m boven het wegdek.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.54
  - number: 5.11.55
    text: |-
      1 De niet-driehoekige rode retroreflector mag niet zijn afgeschermd.

      2 De niet-driehoekige rode retroreflector mag geen gebreken vertonen die de retroreflectie beïnvloeden.

      3 De niet-driehoekige rode retroreflector moet voldoen aan de door Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.55
  - number: 5.11.57
    text: |-
      1 Gehandicaptenvoertuigen mogen zijn voorzien van:

      a. twee lichten aan de voorzijde indien het voertuig is voorzien van twee voorwielen, dan wel één licht aan de
      voorzijde indien het voertuig is voorzien van één voorwiel;

      b. twee achterlichten indien het voertuig is voorzien van twee achterwielen, dan wel één achterlicht indien het
      voertuig is voorzien van één achterwiel;

      c. richtingaanwijzers en waarschuwingsknipperlichten;

      d. één of twee remlichten;

      e. twee witte retroreflectoren aan de voorzijde van het voertuig;

      f. ambergele retroreflectoren aan de zijkanten van het voertuig.

      2 Gehandicaptenvoertuigen mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde,
      extra niet-driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.57
  - number: 5.11.64
    text: |-
      1 Gehandicaptenvoertuigen mogen niet zijn voorzien van verblindende verlichting.

      2 Gehandicaptenvoertuigen mogen, met uitzondering van de richtingaanwijzers en de waarschuwingsknipperlichten, niet
      zijn voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.64
  - number: 5.11.65
    text: |-
      Gehandicaptenvoertuigen mogen niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 5.11.51][ref1] en [5.11.57][ref2] is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.11.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.11.57
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.65
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.11.51
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 5.11.57
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '11'
  - number: 5.11.71
    text: |-
      Gehandicaptenvoertuigen moeten zijn voorzien van een goed werkende bel of van een goed werkende hoorn met vaste
      toonhoogte.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.11.71
  - number: 5.12.1
    text: |-
      Aanhangwagens moeten voldoen aan de volgende eisen:

      a. het voertuig moet in overeenstemming zijn met de op het voor het voertuig afgegeven kentekenbewijs en in het
      kentekenregister omtrent het voertuig vermelde gegevens;

      b. het identificatienummer moet op een vast voertuigdeel zijn ingeslagen en moet goed leesbaar zijn;

      c. aanhangwagens die in gebruik zijn genomen na 31 december 1997, moeten zijn voorzien van een constructieplaat die
      goed leesbaar is en waarvan de gegevens in overeenstemming zijn met het kentekenregister, met dien verstande dat de
      maximum massa's die op de constructieplaat zijn vermeld ten minste gelijk zijn aan de massa's die zijn aangegeven
      in het kentekenregister en op het kentekenbewijs;

      d. de kentekenplaat moet zijn voorzien van het in [artikel 5 van het Kentekenreglement][ref1] voorgeschreven
      goedkeuringsmerk en moet deugdelijk aan de achterzijde van het voertuig zijn bevestigd;

      e. het kenteken moet goed leesbaar zijn en de kentekenplaat mag niet zijn afgeschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '5'
  - number: 5.12.3
    text: |-
      1 De langs- en dwarsliggers en chassisversterkingsdelen van het chassisraam, dan wel de daarvoor in de plaats
      tredende delen van de mee- of zelfdragende carrosserie van aanhangwagens mogen:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte van het
      chassisraam of van de mee- of zelfdragende carrosserie in gevaar worden gebracht.

      2 Onze Minister stelt regels vast inzake corrosie van de in het eerste lid bedoelde onderdelen alsmede de
      bevestiging daarvan.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.3
  - number: 5.12.4
    text: |-
      1 De bovenbouw van aanhangwagens moet deugdelijk op het onderstel zijn bevestigd.

      2 De ondersteuning van de laadvloer onderscheidenlijk laadruimte moet deugdelijk zijn. Onze Minister stelt regels
      vast met betrekking tot de deugdelijkheid van de ondersteuning.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.4
  - number: 5.12.5
    text: De bedrading van aanhangwagens moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.5
  - number: 5.12.6
    text: |-
      1 Aanhangwagens, niet zijnde opleggers, mogen niet langer zijn dan 12,00 m.

      2 In afwijking van het eerste lid mogen:

      a. kermis- of circusvoertuigen niet langer zijn dan 14,00 m;

      b. middenasaanhangwagens die voor 1 juli 1967 in gebruik zijn genomen, niet langer zijn dan 10,00 m;

      c. middenasaanhangwagens die na 30 juni 1967 maar voor 1 januari 1987 in gebruik zijn genomen, niet langer zijn dan
      10,00 m indien de toegestane maximum massa meer bedraagt dan 2500 kg maar niet meer dan 3500 kg.

      3 Van opleggers die na 31 december 1997 in gebruik worden genomen, mag de horizontaal gemeten afstand tussen
      het hart van de koppelingspen en enig deel aan de voorzijde van de oplegger niet meer bedragen dan 2,04 m en mag
      de horizontaal gemeten afstand tussen het hart van de koppelingspen en de achterzijde van de oplegger niet meer
      bedragen dan 12,00 m.

      4 Van opleggers die voor 1 januari 1998 in gebruik zijn genomen, mag de horizontaal gemeten afstand tussen het hart
      van de koppelingspen en enig deel aan de voorzijde van de oplegger niet meer bedragen dan 2,05 m, met uitzondering
      van een puntvormige uitbouw waarvan het verticaal geprojecteerde oppervlak wordt begrensd door rechte lijnen die
      raken aan de uiterste voorhoeken van de oplegger en een punt op het mediaanvlak van de oplegger dat op maximaal
      2,50 m voor het hart van de koppelingspen ligt.

      5 In afwijking van het derde lid mag van kermis- of circusvoertuigen de horizontaal gemeten afstand tussen het hart
      van de koppelingspen en de achterzijde van de oplegger niet meer bedragen dan 17,50 m.

      6 Aanhangwagens mogen niet breder zijn dan 2,55 m.

      7 In afwijking van het bepaalde in het zesde lid mogen geconditioneerde voertuigen niet breder zijn dan 2,60 m.

      8 Aanhangwagens mogen niet hoger zijn dan 4,00 m.

      9 In de afmetingen, bedoeld in het eerste lid, het derde lid, het zesde lid, het zevende lid en het achtste lid,
      zijn afneembare bovenbouwen en gestandaardiseerde laadstructuren begrepen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.6
  - number: 5.12.7
    text: |-
      1 De last onder de assen van aanhangwagens mag niet meer bedragen dan de voor het betrokken voertuig in het
      kentekenregister of op het kentekenbewijs vermelde toegestane maximum aslasten. Bij middenasaanhangwagens en
      opleggers mag de last onder de koppeling niet meer bedragen dan in het kentekenregister of op het kentekenbewijs
      is vermeld.

      2 De totale massa van aanhangwagens mag niet meer bedragen dan de voor het betrokken voertuig in het
      kentekenregister of op het kentekenbewijs vermelde toegestane maximum massa.

      3 De som van de aslasten van autonome aanhangwagens mag niet meer bedragen dan de voor het betrokken voertuig in
      het kentekenregister of op het kentekenbewijs vermelde toegestane maximum massa.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.7
  - number: 5.12.18
    text: |-
      1 De assen van aanhangwagens moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen breuken of scheuren
      vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn bevestigd, beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht. Hieraan
      wordt voor wat betreft wielgeleidingselementen voldaan indien deze niet zijn doorgeroest.

      5 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid met betrekking tot de deugdelijkheid van
      de bevestiging.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.18
  - number: 5.12.19
    text: |-
      1 De fuseepennen, -lageringen, -bussen en -kogels van aanhangwagens moeten deugdelijk zijn bevestigd.

      2 Stofhoezen van de fuseekogels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de
      hoezen niet meer afdichten.

      3 De fuseepennen, -lageringen, -bussen en -kogels alsmede de overige draaipunten van de wielophanging mogen niet te
      veel speling vertonen.

      4 Indien een gedeelte van de binnenkant van het fuseekogelhuis en van de fuseekogel zichtbaar is doordat de hoes is
      beschadigd of ontbreekt, mag dit gedeelte geen corrosie vertonen.

      5 Onze Minister stelt regels vast omtrent het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.19
  - number: 5.12.20
    text: |-
      1 De wiellagers van aanhangwagens mogen niet teveel speling vertonen.

      2 Verschijnselen van slijtage of beschadiging mogen niet hoorbaar of voelbaar zijn.

      3 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.20
  - number: 5.12.21
    text: |-
      De wielbasis van aanhangwagens mag niet meer dan 1,0% afwijken van de waarde die voor het voertuig is vermeld op
      het kentekenbewijs of in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.21
  - number: 5.12.24
    text: |-
      1 De wielen onderscheidenlijk velgen van aanhangwagens mogen geen breuken, scheuren, ondeugdelijk laswerk of
      ernstige vervorming vertonen.

      2 De wielen onderscheidenlijk velgen moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.24
  - number: 5.12.26
    text: |-
      Stabilisatoren moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn bevestigd en mogen:

      a. geen breuken of scheuren vertonen, en

      b. niet te veel speling op de draaipunten vertonen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.26
  - number: 5.12.27
    text: |-
      1 Aanhangwagens moeten zijn voorzien van banden waarvan het loopvlak niet bestaat uit metaal of een materiaal dat
      voor wat betreft hardheid en vervormbaarheid dezelfde eigenschappen heeft.

      2 De luchtbanden van aanhangwagens mogen geen beschadigingen vertonen waarbij het karkas zichtbaar is.

      3 De luchtbanden mogen geen uitstulpingen vertonen.

      4 De profilering van de hoofdgroeven van de luchtbanden van aanhangwagens met een toegestane maximum massa van
      ten hoogste 3500 kg moet over de gehele omtrek van het loopvlak ten minste 1,6 mm bedragen, met uitzondering van
      slijtage-indicatoren.

      5 De banden van aanhangwagens mogen niet zijn opgesneden. Van opsnijden is sprake indien slijtage-indicatoren zijn
      weggesneden, indien de profielvorm van de groef afwijkt van de originele profielvorm, of indien in de bodem van de
      groef het karkas van de band zichtbaar is. In afwijking van het hiervoor bepaalde is opsnijden toegestaan indien de
      mogelijkheid daartoe op de band is vermeld door de aanduiding "REGROOVABLE" of door het teken "

      ", met dien verstande dat het karkas van de band niet zichtbaar mag zijn.

      6 De luchtbanden op een as moeten dezelfde karkasstructuur hebben.

      7 De op de luchtband van een aanhangwagen in gebruik genomen na 31 december 1997, vermelde load-index mag niet
      kleiner zijn dan de load-index, behorende bij de maximum last per band van de in het kentekenregister vermelde
      aslast.

      8 Het loopvlak van de banden mag geen metalen elementen bevatten die tijdens het rijden daarbuiten kunnen
      uitsteken.

      9 Onze Minister stelt regels vast omtrent het bepaalde in het zevende lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.27
  - number: 5.12.28
    text: |-
      1 Aanhangwagens moeten zijn voorzien van een goed werkend veersysteem. Banden worden niet als deel van het
      veersysteem beschouwd.

      2 De onderdelen van het veersysteem mogen geen breuken of scheuren vertonen, mogen niet ernstig door corrosie zijn
      aangetast en moeten deugdelijk zijn bevestigd. Bij luchtveerbalgen mogen de koordlagen zichtbaar zijn, maar niet
      beschadigd.

      3 Aanhangwagens die zijn voorzien van gasvering, en aanhangwagens met een toegestane maximum massa van ten hoogste
      3500 kg, die zijn voorzien van schroefveren, moeten zijn voorzien van deugdelijk bevestigde en goedwerkende
      schokdempers.

      4 Schokdempers van aanhangwagens moeten deugdelijk zijn bevestigd en moeten goed werken.

      5 Onze Minister stelt regels vast omtrent het bepaalde in het tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.28
  - number: 5.12.29
    text: |-
      1 De gestuurde wielen van aanhangwagens moeten goed kunnen reageren op het commando van de stuurinrichting van het
      trekkend voertuig.

      2 De voor de overbrenging van de stuurbeweging bestemde onderdelen van de gestuurde assen van aanhangwagens moeten
      deugdelijk zijn bevestigd met alle daarvoor bestemde bevestigingsen borgmiddelen, mogen geen breuken of scheuren
      vertonen, mogen niet zijn vervormd en mogen niet ernstig door corrosie zijn aangetast.

      3 Stofhoezen van de stuurkogels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de
      hoezen niet meer afdichten.

      4 De onderdelen van het hydraulische besturingssysteem mogen geen lekkage vertonen.

      5 De slangen van het hydraulische besturingssysteem mogen:

      a. geen beschadigingen vertonen waarbij het wapeningsmateriaal zichtbaar is;

      b. geen bewegende delen raken.

      6 De verbindingen in het stangenstelsel mogen niet te veel speling vertonen.

      7 Indien een gedeelte van de binnenkant van het stuurkogelhuis en van de stuurkogel zichtbaar is doordat de hoes is
      beschadigd of ontbreekt, mag dit gedeelte geen corrosie vertonen.

      8 Onze Minister stelt regels vast omtrent het bepaalde in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.29
  - number: 5.12.30
    text: |-
      1 De draaikransen van aanhangwagens moeten deugdelijk zijn bevestigd met alle daarvoor bestemde bevestigingsen
      borgmiddelen.

      2 De axiale speling van de draaikransen mag:

      a. niet meer bedragen dan 3,5 mm;

      b. niet zodanig zijn dat de draaikranshelften op elkaar inslijten.

      3 De profielen die deel uitmaken van de ondersteuning van de draaikransen, mogen niet ernstig door corrosie zijn
      aangetast.

      4 Onze Minister stelt regels vast omtrent het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.30
  - number: 5.12.31
    text: |-
      1 Aanhangwagens moeten zijn voorzien van een reminrichting waarvan de onderdelen:

      a. deugdelijk zijn bevestigd met de daarvoor bestemde bevestigings- en borgmiddelen;

      b. niet in ernstige mate door corrosie zijn aangetast;

      c. niet zijn beschadigd, gescheurd of gebroken;

      d. geen inwendige of uitwendige lekkage vertonen.

      2 Remslangen mogen:

      a. niet in ernstige mate zijn misvormd;

      b. niet langs andere voertuigdelen schuren;

      c. geen zodanige beschadigingen vertonen dat het wapeningsmateriaal zichtbaar is.

      3 Kunststofremleidingen mogen geen knikken vertonen.

      4 Wielen die zijn voorzien van een trommelrem, moeten in onberemde toestand in beide richtingen kunnen draaien
      zonder dat de remvoering aanloopt. De remvoering van wielen die zijn voorzien van een schijfrem, mag in onberemde
      toestand in beide richtingen enigszins slepen.

      5 De remtrommel of remschijf mag tijdens het remmen niet worden geraakt door delen die zijn bestemd als drager of
      bevestigingsmiddel van remvoering.

      6 De noodzakelijke bewegingsvrijheid van de remonderdelen mag niet worden beperkt.

      7 Remcylinders moeten zijn voorzien van stofhoezen die niet in ernstige mate mogen zijn beschadigd.

      8 Indien de oplooprem is voorzien van een automatische blokkering ten behoeve van het achteruitrijden, moet deze
      goed functioneren.

      9 Onze Minister stelt regels vast omtrent het bepaalde in het eerste lid, onderdelen *a* en *b*, en het tweede lid,
      onderdeel *a*.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.31
  - number: 5.12.35
    text: |-
      1 Aanhangwagens met een drukluchtremsysteem moeten zijn voorzien van:

      a. drukmeetpunten waarmee de drukken die worden ingestuurd in de drukluchtremcylinders op iedere as, kunnen worden
      gemeten;

      b. een drukmeetpunt waarmee de druk vóór elke drukluchtremkrachtregelaar kan worden gemeten.

      2 Drukluchtremkrachtregelaars moeten goed functioneren.

      3 Aanhangwagens met drukluchtremkrachtregelaars, in gebruik genomen na 30 september 1981, moeten zijn voorzien
      van een plaat waarop duidelijk leesbaar de afstelling van de drukluchtremkrachtregelaars is vermeld. De vermelde
      drukluchtremkrachtregelaars moeten aanwezig zijn en moeten globaal zijn afgesteld zoals voor de beladingstoestand
      van het voertuig is vermeld op genoemde plaat.

      4 De ontwateringsventielen van reservoirs moeten goed functioneren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.35
  - number: 5.12.36
    text: |-
      1 De slag van drukluchtremcylinders die door middel van een nok een trommelrem bedienen, mag niet worden begrensd
      door delen die daar niet voor zijn bestemd.

      2 De slag van drukluchtremcylinders van trommelremmen mag vanuit onberemde toestand tot in beremde stand niet
      groter zijn dan 2/3 van de maximumslag van de betrokken remcylinder.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.36
  - number: 5.12.38
    text: |-
      1 Aanhangwagens, niet zijnde opleggers, in gebruik genomen na 31 december 1997, moeten zijn voorzien van een
      bedrijfsrem waarvan de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste
      4,5 m/s2 bedraagt.

      2 Aanhangwagens, niet zijnde opleggers, in gebruik genomen na 30 september 1971, doch voor 1 januari 1998,
      en opleggers, in gebruik genomen na 30 september 1971, moeten zijn voorzien van een bedrijfsrem waarvan de
      remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 4,0 m/s2 bedraagt.

      3 Aanhangwagens, in gebruik genomen voor 1 oktober 1971, moeten zijn voorzien van een bedrijfsrem waarvan de
      remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 3,8 m/s2 bedraagt.

      4 De bedrijfsrem moet op alle wielen werken.

      5 De bedrijfsrem moet zodanig werken dat de kans op blokkeren van wielen zo gering mogelijk is.

      6 Aanhangwagens mogen op een droge of nagenoeg droge weg niet uitbreken ten gevolge van een verschil in remwerking
      tussen de wielen van elke as.

      7 Onze Minister stelt nadere regels vast met betrekking tot het bepaalde in het eerste tot en met derde lid en het
      zesde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.38
  - number: 5.12.39
    text: |-
      1 Aanhangwagens moeten zijn voorzien van een goedwerkende vastzetinrichting die ten minste op de wielen van één as
      werkt en welke door een geheel mechanische overbrenging met de hand in werking kan worden gesteld, ook wanneer het
      voertuig niet aan een motorrijtuig is verbonden.

      2 Het bepaalde in het eerste lid is niet van toepassing indien:

      a. de aanhangwagen is voorzien van een veerrem die automatisch in werking treedt bij het ontkoppelen of drukloos
      maken van het remsysteem;

      b. de aanhangwagen in gebruik genomen voor 1 januari 1998, is voorzien van een hydraulisch remsysteem en is
      uitgerust met wielkeggen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.39
  - number: 5.12.40
    text: |-
      1 Bij het verbreken van de verbinding tussen de aanhangwagen en het trekkende voertuig moet de reminrichting van de
      aanhangwagen automatisch in werking treden.

      2 Bij het koppelen van de reminrichting van de aanhangwagen aan die van het trekkende voertuig moet de
      reminrichting van de aanhangwagen automatisch in de bedrijfstoestand komen.

      3 De in het eerste en tweede lid gestelde eisen gelden niet voor middenasaanhangwagens met een toegestane maximum
      massa van ten hoogste 1500 kg.

      4 Indien de aanhangwagen is voorzien van een losbreekreminrichting, moet deze goed functioneren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.40
  - number: 5.12.41
    text: Het slot en de scharnieren van de deuren en laadbakkleppen van aanhangwagens moeten een goede sluiting waarborgen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.41
  - number: 5.12.48
    text: |-
      1 Aanhangwagens mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor andere
      weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen van aanhangwagens, die in geval van botsing
      het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn afgeschermd.

      3 Het bepaalde in het eerste lid en tweede lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m
      boven het wegdek bevinden.

      4 De wielen onderscheidenlijk banden van aanhangwagens in gebruik genomen na 31 december 1974 moeten zijn
      afgeschermd overeenkomstig de door Onze Minister vastgestelde eisen en mogen niet aanlopen. De wielen
      onderscheidenlijk banden van aanhangwagens die in gebruik zijn genomen voor 1 januari 1975 moeten deugdelijk zijn
      afgeschermd en mogen niet aanlopen.

      5 Aanhangwagens na 31 december 1969 in gebruik genomen, moeten zijn voorzien van zijdelingse afscherming. Deze
      verplichting geldt niet voor:

      a. aanhangwagens die blijkens een aantekening op het kentekenbewijs hiervan zijn uitgezonderd;

      b. het gedeelte achter de achterste as van aanhangwagens met een toegestane maximum massa van niet meer dan 3500
      kg.

      6 Een reservewielhouder die zich aan de buitenzijde van de aanhangwagen bevindt, moet deugdelijk zijn bevestigd.
      Indien in de houder een reservewiel is geplaatst, moet dat wiel goed zijn opgesloten.

      7 Geen deel van de buitenzijde van de aanhangwagen mag zodanig zijn bevestigd, beschadigd, versleten of door
      corrosie zijn aangetast, dat gevaar bestaat voor losraken.

      8 Onze Minister stelt regels vast omtrent het bepaalde in het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.48
  - number: 5.12.49
    text: |-
      1 Aanhangwagens die na 30 juni 1967 in gebruik zijn genomen, moeten aan de achterzijde op deugdelijke wijze zijn
      voorzien van een stootbalk, indien de afstand van de onderzijde van het voertuig tot het wegdek, gemeten over de
      volle breedte onder de achterzijde van het onderstel of onder de hoofddelen van het koetswerk op een afstand van
      meer dan 1,00 m achter de achterste as, meer bedraagt dan 0,70 m, dan wel meer bedraagt dan 0,55 m indien het
      voertuig na 31 december 1997, in gebruik is genomen.

      2 De afstand van de onderzijde van de stootbalk tot het wegdek mag voor aanhangwagens, in gebruik genomen na 30
      juni 1967 doch vóór 1 januari 1998, niet meer bedragen dan 0,70 m en voor aanhangwagens, in gebruik genomen na 31
      december 1997, niet meer bedragen dan 0,55 m.

      3 Indien de aanhangwagen in gebruik is genomen na 31 december 2004 mag de stootbalk niet meer dan 0,40 m voor
      het achterste punt van het voertuig zijn gelegen. Hierbij worden voertuigdelen boven 3,00 m gemeten vanaf het
      wegdek buiten beschouwing gelaten. In afwijking hiervan geldt voor aanhangwagens, ingericht als betonmolen, dat de
      stootbalk niet meer dan 0,60 m voor het achterste punt van het voertuig mag zijn gelegen.

      4 Indien de aanhangwagen in gebruik is genomen na 30 juni 1967 en voor 1 januari 2005 mag de stootbalk niet meer
      dan 0,60 m voor het achterste punt van het voertuig zijn gelegen. Hierbij worden voertuigdelen boven 2,00 m gemeten
      vanaf het wegdek buiten beschouwing gelaten.

      5 De stootbalk van aanhangwagens mag niet breder zijn noch aan weerszijden meer dan 0,10 m smaller zijn dan:

      a. het voertuig op de plaats waar de stootbalk is aangebracht, dan wel

      b. de breedte van de breedste achteras, met inbegrip van de wielen waarbij de bolling van de banden boven het
      wegdek buiten beschouwing wordt gelaten.

      Voor aanhangwagens die zijn bestemd voor het vervoer van wissellaadbakken geldt in plaats van de genoemde maat van
      0,10 m een maat van 0,20 m.

      6 De stootbalk en de bevestiging daarvan mogen niet zodanig zijn vervormd of breuken of scheuren vertonen, dan wel
      door corrosie zijn aangetast, dat hierdoor functieverlies optreedt.

      7 De uiteinden van de stootbalk mogen niet naar achteren zijn omgebogen.

      8 Het bepaalde in het eerste lid geldt niet voor:

      a. dolly’s;

      b. voertuigen die blijkens een aantekening in het kentekenbewijs van het bepaalde in het eerste lid zijn
      uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.49
  - number: 5.12.51
    text: |-
      Aanhangwagens moeten zijn voorzien van:

      a. twee stadslichten indien het voertuig breder is dan 1,60 m en na 30 juni 1967 in gebruik is genomen;

      b. twee richtingaanwijzers aan de achterzijde van het voertuig;

      c. twee achterlichten;

      d. twee remlichten;

      e. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      f. twee driehoekige rode retroreflectoren aan de achterzijde van het voertuig;

      g. een of twee mistlichten aan de achterzijde van het voertuig indien het voertuig na 31 december 1997 in gebruik
      is genomen; in het geval van één mistlicht moet dit zich bevinden in of links van het middenlangsvlak van het
      voertuig;

      h. twee witte retroreflectoren aan de voorzijde van het voertuig, indien het voertuig na 31 december 1997 is
      gebruik is genomen;

      i. niet-driehoekige ambergele retroreflectoren aan elke zijkant van het voertuig, aangebracht overeenkomstig de
      door Onze Minister vastgestelde eisen;

      j. twee markeringslichten aan de voorzijde en twee aan de achterzijde van het voertuig, indien het voertuig na
      31 december 1997 in gebruik is genomen en breder is dan 2,10 m, dan wel voor 1 januari 1998 in gebruik is genomen
      en breder is dan 2,60 m;

      k. zijmarkeringslichten indien het voertuig na 31 december 1997 in gebruik is genomen en langer is dan 6,00 m,
      aangebracht overeenkomstig de door Onze Minister vastgestelde eisen;

      l. een markering aan de achterzijde van het voertuig, indien de toegestane maximum massa van het voertuig meer
      bedraagt dan 3500 kg en het voertuig in gebruik genomen is na 30 juni 1967; deze eis geldt niet voor door Onze
      Minister aangewezen aanhangwagens waarvan de bouw, de inrichting of het gebruik zich verzet tegen het aanbrengen
      van de markering.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.51
  - number: 5.12.53
    text: |-
      1 De stadslichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers en de remlichten mogen niet anders dan rood of ambergeel stralen.

      3 De achterlichten en de mistlichten aan de achterzijde mogen niet anders dan rood stralen.

      4 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.

      5 De markeringslichten mogen naar voren niet anders dan wit, en naar achteren niet anders dan rood stralen.

      6 De zijmarkeringslichten mogen niet anders dan ambergeel stralen. Indien het achterste zijmarkeringslicht
      onderdeel uitmaakt van een rood stralend licht dan wel van een rode retroreflector, mag dit licht rood stralen.

      7 De markering aan de achterzijde moet bestaan uit één rechthoekig bord, dan wel uit een set van twee of vier
      rechthoekige borden, welke zijn voorzien van een rood fluorescerende omranding op een geel retroreflecterende
      achtergrond.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.53
  - number: 5.12.55
    text: |-
      1 De in [artikel 5.12.51][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig zijn bevestigd.

      5 De in [artikel 5.12.51][ref2] bedoelde lichten en retroreflectoren, voorzover het het lichtdoorlatend gedeelte
      betreft, mogen ten hoogste een vierde deel zijn afgeschermd.

      6 De in [artikel 5.12.51][ref3] bedoelde retroreflectoren mogen geen gebreken vertonen, die de retroreflectie
      beïnvloeden.

      7 Onze Minister kan regels vaststellen omtrent het bepaalde in het tweede en derde lid.


