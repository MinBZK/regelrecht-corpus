  - number: 6.15a
    text: |-
      1 Indien ten aanzien van een bus die tot het verkeer op de weg is toegelaten, na die toelating een keuring als
      T100-bus wordt verzocht, voldoet deze bus aan de bij ministeriële regeling voor T100-bussen vastgestelde eisen.

      2 Indien de bouw of inrichting van een bus, ten aanzien waarvan tevens keuring als T100-bus is verzocht, wordt
      gewijzigd, voldoet deze bus aan de in [hoofdstuk 3, afdeling 3][ref1], en [hoofdstuk 5, afdeling 3][ref2],
      opgenomen eisen, de eisen die van toepassing zijn ingevolge de [artikelen 28, eerste lid][ref3], en
      [75, eerste lid, onderdeel b, van de wet][ref4], alsmede de bij ministeriële regeling voor T100-bussen vastgestelde
      eisen.


