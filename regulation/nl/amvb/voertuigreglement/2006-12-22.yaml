  - number: 5.12.57
    text: |-
      1 Aanhangwagens mogen zijn voorzien van:

      a. een of twee achteruitrijlichten;

      b. twee extra richtingaanwijzers aan de achterzijde van het voertuig;

      c. twee waarschuwingsknipperlichten aan het meest naar achteren gelegen gedeelte van de zich aan de zij- of
      achterkant van het voertuig bevindende laad- en losklep in horizontale stand;

      d. twee markeringslichten aan de voorzijde en twee aan de achterzijde van het voertuig, indien deze lichten niet
      reeds ingevolge [artikel 5.12.51][ref1] verplicht zijn en het voertuig breder is dan 1,80 m;

      e. zijmarkeringslichten, indien deze lichten niet reeds ingevolge [artikel 5.12.51][ref2] verplicht zijn,
      aangebracht overeenkomstig de door Onze Minister vastgestelde eisen;

      f. twee witte retroreflectoren aan de voorzijde van het voertuig indien deze niet reeds ingevolge
      [artikel 5.12.51][ref3] verplicht zijn;

      g. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig, die zijn opgenomen in het
      lamphuis van andere lichten;

      h. werklichten;

      i. een derde remlicht, aangebracht zodanig dat:

      1°. het midden van het lichtdoorlatende gedeelte zich bevindt in het middenlangsvlak van het voertuig of de rand
      van het lichtdoorlatende gedeelte op een afstand van ten hoogste 0,15 m vanaf dit middenlangsvlak indien het derde
      remlicht niet op een vast deel van de carrosserie of bovenbouw kan worden bevestigd, en

      2°. de onderzijde van het lichtdoorlatende gedeelte hoger ligt dan de bovenzijde van de remlichten, bedoeld in
      [artikel 5.12.51, onderdeel d][ref4];

      j. in afwijking van onderdeel i kunnen twee extra remlichten worden aangebracht;

      k. een lampje aan de voorzijde van het voertuig dat de werking van het antiblokkeer- of besturingssysteem aangeeft.

      2 Lichten die ingevolge [artikel 5.12.51][ref5] verplicht zijn gesteld voor voertuigen die na een in dat
      artikel genoemd tijdstip in gebruik zijn genomen, mogen zijn aangebracht op voertuigen die voor of op dat
      tijdstip in gebruik zijn genomen mits wordt voldaan aan de in [artikel 5.12.53][ref6] met betrekking tot die
      lichten, met uitzondering van markeringslichten en zijmarkeringslichten, gestelde eisen. Markeringslichten en
      zijmarkeringslichten moeten alsdan voldoen aan het bepaalde in de onderdelen d onderscheidenlijk e van het eerste
      lid.

      3 Aanhangwagens mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra
      driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig.

      4 Aanhangwagens mogen zijn voorzien van een ambergele of witte lijnmarkering aan de zijkant van het voertuig of van
      een ambergele, witte of rode lijnmarkering aan de achterkant van het voertuig.

      5 Aanhangwagens mogen zijn voorzien van een ambergele of witte contourmarkering aan de zijkant van het voertuig of
      een ambergele, witte of rode contourmarkering aan de achterkant van het voertuig. Binnen de contourmarkering aan
      de zijkant van het voertuig mogen retroreflecterende letters of afbeeldingen zijn aangebracht, voorzover deze geen
      nadelige invloed hebben op de effectiviteit van de contourmarkering en de verplichte lichten en retroreflecterende
      voorzieningen. In ieder geval mogen de retroreflecterende letters of afbeeldingen niet meer dan 1/3 deel van de
      totale oppervlakte binnen de omtrek van de contourmarkering uitmaken.

      6 Ieder afzonderlijk deel van de lijn- en contourmarkering en van het materiaal voor de retroreflecterende letters
      of afbeeldingen binnen de contourmarkering is voorzien van een door Onze Minister vastgesteld goedkeuringsmerk.

      7 Bij regeling van Onze Minister worden voorschriften gesteld met betrekking tot de installatie van de lijn- en
      contourmarkering.


