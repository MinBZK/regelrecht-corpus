  - number: '7.1'
    text: |-
      Onverminderd [artikel 149a, tweede lid, van de Wegenverkeerswet 1994][ref1] kan het ingevolge
      [artikel 149 van de wet][ref2] bevoegde gezag ontheffing verlenen van het bepaalde in de
      [artikelen 5.1.1, eerste lid, aanhef en onderdeel c, en tweede lid][ref3], [5.1.2][ref4] en [5.1.3][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149
