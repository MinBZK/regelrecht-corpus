        artikel: 5.3.68
        hoofdstuk: '5'
        paragraaf: '11'
        afdeling: '3'
  - number: 5.3.67
    text: |-
      Indien de bedrijfsauto is voorzien van een koppelingskogel met een kogel met een nominale diameter van 50 mm:

      a. moet de diameter van de kogel ten minste 49,0 mm bedragen;

      b. moet de sluit- en borginrichting van een afneembare kogel goed functioneren en moet de bevestiging van het
      kogelgedeelte nagenoeg spelingvrij zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.67
  - number: 5.3.68
    text: |-
      1 Indien de bedrijfsauto is voorzien van een vangmuilkoppeling met een nominale pendiameter van:

      a. 40 mm, moet de pendiameter ten minste 36,5 mm bedragen;

      b. 50 mm, moet de pendiameter ten minste 46 mm bedragen;

      c. 57,5 mm, moet de pendiameter ten minste 55 mm bedragen.

      2 De in het eerste lid bedoelde koppelingen moeten voldoen aan de volgende eisen:

      a. de opwaartse speling van de pen mag niet meer dan 5 mm bedragen;

      b. de radiale speling in de onderste bus mag niet meer dan 2 mm bedragen;

      c. de onderste lagerbus mag niet loszitten en de bevestiging ervan mag niet zijn uitgeslagen;

      d. de sluit- en borginrichting moet goed functioneren;

      e. de radiale speling van de trekstang in de lagering in de achterbalk mag niet meer dan 2 mm bedragen;

      f. axiale speling van de trekstang in de lagering in de achterbalk is niet toegestaan;

      g. de bevestigingsmoer van de trekstang moet deugdelijk vastzitten en moet goed geborgd zijn;

      h. het gedeelte van de vangmuil dat als geleiding voor het trekoog tijdens het aankoppelen is bedoeld, mag tekenen
      van vervorming, van scheuren of van uitgebroken delen vertonen, mits daardoor de sterkte of het functioneren van de
      koppeling met inbegrip van de sluit- en borginrichting niet wordt aangetast. Herstel daarvan door middel van lassen
      is toegestaan.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.68
  - number: 5.3.69
    text: |-
      1 Indien de bedrijfsauto is voorzien van een schotelkoppeling van 2 of 3,5 inch, mag:

      a. de onvlakheid van de schotel niet meer dan 3,5 mm bedragen;

      b. de onvlakheid van de schotel, in afwijking van het bepaalde onder *a*, voor wat betreft de uiterste linker en
      rechterzijde over een breedte van 50 mm, gemeten vanaf de buitenzijde van de schotel, niet meer dan 5 mm bedragen;

      c. de diepte van groeven langer dan 100 mm niet meer dan 2,5 mm bedragen.

      Dit lid is niet van toepassing op kunststofdelen op de schotelkoppeling die bedoeld zijn als slijtvlak.

      2 Een schotelkoppeling moet deugdelijk zijn bevestigd.

      3 De speling in de sluitinrichting van een schotelkoppeling van 2 inch mag, uitgaande van een niet gesleten 2 inch
      pen, in de lengterichting van het voertuig niet meer dan 2 mm bedragen.

      4 De sluit- en borginrichting moet goed functioneren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.69
  - number: 5.3.70
    text: |-
      Onze Minister stelt regels vast met betrekking tot bijzondere constructies voor het koppelen van voertuigen en
      andere koppelingen dan bedoeld in de [artikelen 5.3.67][ref1], [5.3.68][ref2] en [5.3.69][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.67
