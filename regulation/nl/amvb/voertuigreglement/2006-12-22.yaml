  - number: 5.18.8
    text: |-
      1 De lading van voertuigen mag geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel
      voor andere weggebruikers kunnen opleveren.

      2 Het bepaalde in het eerste lid is niet van toepassing op lading of delen daarvan die zich hoger dan 2,00 m boven
      het wegdek bevinden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.8
  - number: 5.18.9
    text: |-
      Opklapbare delen aan de buitenzijde van voertuigen moeten tijdens het transport van het voertuig over de weg in
      opgeklapte toestand deugdelijk zijn vergrendeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.9
  - number: 5.18.10
    text: |-
      1 Aanhangwagens met een toegestane maximum massa van niet meer dan 750 kg moeten indien zij zijn gekoppeld aan een
      motorrijtuig waarvoor een kenteken is opgegeven, zijn voorzien van het kenteken van het trekkend motorrijtuig.

      2 De kentekenplaat moet zijn voorzien van het in [artikel 5 van het Kentekenreglement][ref1] voorgeschreven
      goedkeuringsmerk en moet deugdelijk aan de achterzijde van de aanhangwagen zijn bevestigd.

      3 Het kenteken moet goed leesbaar zijn en de kentekenplaat mag niet zijn afgeschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.10
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '5'
  - number: 5.18.11
    text: |-
      1 De lengte van een samenstel van trekker en oplegger in onbeladen toestand mag niet meer bedragen dan 16,50 m.

      2 Van een samenstel van bedrijfsauto en aanhangwagen, niet zijnde een samenstel van trekker en oplegger, in
      onbeladen toestand mag:

      a. de lengte niet meer bedragen dan 18,75 m;

      b. de afstand tussen het voorste punt aan de buitenzijde van de laadruimte achter de stuurcabine en het achterste
      punt aan de buitenzijde van de aanhangwagen niet meer dan 16,40 m bedragen;

      c. de afstand tussen het voorste punt aan de buitenzijde van de laadruimte achter de stuurcabine en het achterste
      punt aan de buitenzijde van de aanhangwagen, verminderd met de afstand tussen de achterzijde van de laadruimte van
      het motorrijtuig en de voorzijde van de laadruimte van de aanhangwagen, niet meer dan 15,65 m bedragen.

      3 Bij een samenstel van bedrijfsauto en een aanhangwagen, beide met een toegestane maximum massa van meer dan 3500
      kg, niet zijnde een samenstel van trekker en oplegger, mag de afstand tussen de achterste as van de bedrijfsauto en
      de voorste as van de aanhangwagen niet minder bedragen dan 3,00 m.

      4 De lengte van samenstellen van personenauto of driewielig motorrijtuig en aanhangwagen, in onbeladen toestand,
      mag niet meer bedragen dan 18,00 m.

      5 De lengte van een samenstel van voertuigen, zijnde kermis- of circusvoertuigen, mag niet meer bedragen dan 24,00
      m.

      6 In afwijking van het tweede lid, onderdeel a, mag de lengte van een samenstel van rijdend werktuig en
      aanhangwagen niet meer bedragen dan 20,00 m.

      7 In de afmetingen, bedoeld in het eerste en het tweede lid, zijn afneembare bovenbouwen en gestandaardiseerde
      laadstructuren begrepen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.11
  - number: 5.18.12
    text: |-
      1 Onverminderd de [artikelen 5.3.6, eerste lid, onderdeel a][ref1], [5.12.6, eerste lid, onderdeel a][ref2], en
      [5.18.11, eerste en tweede lid][ref3], mag de lengte van een voertuig of samenstel van voertuigen met inbegrip
      van de lading niet meer bedragen dan de lengte van dat voertuig of samenstel van voertuigen in onbeladen toestand,
      vermeerderd met 1,00 m waarbij:

      a. de lading niet meer dan 1,00 m achter het voertuig mag uitsteken;

      b. de lading niet meer dan 5,00 m achter de achterste as van het voertuig mag uitsteken;

      c. in afwijking van het bepaalde in de [artikelen 5.3.49][ref4] en [5.12.49][ref5], een stootbalk moet zijn
      aangebracht op niet meer dan 0,60 m voor de uiterste achterzijde van de uitstekende lading indien de afstand van de
      onderzijde van de lading tot het wegdek meer bedraagt dan 0,55 m;

      d. de lading niet voor het voertuig mag uitsteken.

      e. het zicht op de verlichting, de retroreflectoren, de richtingaanwijzers of de kentekenplaat aan de achterzijde
      van het voertuig niet mag worden belemmerd.

      2 Het bepaalde in het eerste lid is niet van toepassing op samenstellen van voertuigen, zijnde kermis- of
      circusvoertuigen.

      3 Het eerste lid, onderdeel c, is niet van toepassing op voertuigen of samenstellen van voertuigen die in gebruik
      zijn genomen na 30 juni 1967 en voor 1 januari 1996.

      4 Het eerste lid, onderdeel e, is niet van toepassing indien aan de achterzijde van de uitstekende lading op
      gelijke wijze als op het betrokken voertuig zijn aangebracht verlichting, retroreflectoren, richtingaanwijzers of
      de kentekenplaat van dat voertuig.

      5 De in het eerste lid onder *a* bedoelde lengtevermeerdering van 1,00 m mag alleen worden veroorzaakt door de
      lading en door een uitschuiflade of laadklep ter ondersteuning van de lading of door een uitschuifbare stootbalk.
      Lading mag niet uitsluitend op de uitschuiflade of op de laadklep rusten.


