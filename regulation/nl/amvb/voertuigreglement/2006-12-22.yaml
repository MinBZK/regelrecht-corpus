  - number: 5.7.62
    text: |-
      Het ingeschakeld zijn van het mistlicht of de mistlichten aan de achterzijde van het voertuig moet door middel van
      een controlelampje aan de bestuurder kenbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.62
  - number: 5.7.63
    text: |-
      Achteruitrijlichten van motorrijtuigen met beperkte snelheid mogen alleen kunnen branden indien de
      achteruitversnelling van het voertuig is ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.63
  - number: 5.7.64
    text: |-
      1 Motorrijtuigen met beperkte snelheid mogen, met uitzondering van grote lichten, niet zijn voorzien van
      verblindende verlichting.

      2 Motorrijtuigen met beperkte snelheid mogen, met uitzondering van de richtingaanwijzers en de
      waarschuwingsknipperlichten, niet zijn voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.64
  - number: 5.7.65
    text: |-
      Motorrijtuigen met beperkte snelheid mogen, onverminderd het in [artikel 30 van het RVV 1990][ref1] bepaalde
      inzake zwaaien knipperlichten, niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 5.7.51][ref2] en [5.7.57][ref3] is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.7.51
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.7.57
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.7.65
