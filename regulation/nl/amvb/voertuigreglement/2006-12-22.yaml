  - number: '6.8'
    text: |-
      Bij wijziging van het aantal assen moet het voertuig voldoen aan de in de [hoofdstukken 3][ref1] en [5][ref2]
      opgenomen eisen omtrent:

      a. algemeen,

      b. algemene bouwwijze van het voertuig,

      c. afmetingen en massa’s,

      d. ophanging,

      e. stuurinrichting,

      f. assen,

      g. reminrichting, en

      h. carrosserie voor zover het betreft de bescherming aan de achterzijde, wielafscherming en zijdelingse
      afscherming.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
