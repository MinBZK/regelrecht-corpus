  - number: '6.9'
    text: |-
      Bij vergroting van de spoorbreedte van personenauto’s en van bedrijfsauto’s met een toegestane maximum massa van
      niet meer dan 3500 kg, met meer dan 2% van de waarde die voor het voertuig is vermeld op het kentekenbewijs dan
      wel in het kentekenregister, moet het voertuig voldoen aan de in de [hoofdstukken 3][ref1] en [5][ref2] opgenomen
      eisen omtrent:

      a. algemeen,

      b. afmetingen en massa’s,

      c. assen,

      d. ophanging,

      e. stuurinrichting,

      f. reminrichting,

      g. carrosserie, en

      h. verlichting, lichtsignalen en retroreflecterende voorzieningen,

      alsmede aan de door Onze Minister vastgestelde eisen met betrekking tot de stijfheid en deugdelijkheid van de
      constructie alsmede het weggedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
