  - number: 5.8.60
    text: |-
      1 De grote lichten moeten aan de voorzijde van het voertuig zijn aangebracht, waarbij de buitenranden van het
      lichtdoorlatende gedeelte zich niet dichter bij het punt van de grootste breedte van het voertuig mogen bevinden
      dan de buitenranden van het lichtdoorlatende gedeelte van de dimlichten.

      2 De extra dimlichten moeten aan de voorzijde van het voertuig zijn aangebracht op een hoogte van niet minder
      dan 0,50 m en niet meer dan 3,00 m boven het wegdek. De extra stadslichten moeten zijn samengebouwd met de extra
      dimlichten.

      3 De mistlichten aan de voorzijde van het voertuig moeten op een hoogte van niet minder dan 0,25 m boven het wegdek
      doch niet hoger dan de verplichte dimlichten zijn aangebracht.

      4 Het mistlicht of de mistlichten aan de achterzijde van het voertuig moeten op een hoogte van niet minder dan
      0,35 m en niet meer dan 1,90 m boven het wegdek zijn aangebracht. Indien zulks door de vorm van de bovenbouw niet
      mogelijk is, mogen het licht of de lichten op een hoogte van meer dan 1,90 m doch niet meer dan 2,10 m boven het
      wegdek zijn aangebracht. Indien één licht is aangebracht, moet dit links van het midden van het voertuig zijn
      geplaatst.

      5 Van de parkeerlichten moeten er twee aan de voorzijde en twee aan de achterzijde van het voertuig zijn
      aangebracht, dan wel moet er een aan elke kant van het voertuig zijn aangebracht.

      6 De achteruitrijlichten moeten aan de achterzijde van het voertuig zijn aangebracht op een hoogte van niet minder
      dan 0,25 m en niet meer dan 1,20 m boven het wegdek.

      7 Van de markeringslichten moeten er twee aan de voorzijde en twee aan de achterzijde zijn aangebracht:

      a. zo dicht mogelijk bij het punt van de grootste breedte van het voertuig;

      b. zo hoog mogelijk als met inachtneming van het bepaalde onder *a* mogelijk is.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.60
  - number: 5.8.62
    text: |-
      Het ingeschakeld zijn van het mistlicht of de mistlichten aan de achterzijde van het voertuig moet door middel van
      een controlelampje aan de bestuurder kenbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.62
  - number: 5.8.63
    text: |-
      Achteruitrijlichten van landbouw- of bosbouwtrekkers mogen alleen kunnen branden indien de achteruitversnelling van
      het voertuig is ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.63
  - number: 5.8.64
    text: |-
      1 Landbouw- of bosbouwtrekkers mogen, met uitzondering van grote lichten, niet zijn voorzien van verblindende
      verlichting.

      2 Landbouw- of bosbouwtrekkers mogen, met uitzondering van de richtingaanwijzers en de waarschuwingsknipperlichten,
      niet zijn voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.64
  - number: 5.8.65
    text: |-
      Landbouw- of bosbouwtrekkers mogen, onverminderd het in [artikel 30 van het RVV 1990][ref1] bepaalde inzake
      zwaai- en knipperlichten, niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 5.8.51][ref2] en [5.8.57][ref3] is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.8.51
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.8.57
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.65
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '30'
