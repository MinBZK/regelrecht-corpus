        bwb_id: BWBR0006951
        artikel: '5'
  - number: 5.2.3
    text: |-
      1 De langs- en dwarsliggers en chassisversterkingsdelen van het chassisraam, dan wel de daarvoor in de plaats
      tredende delen van de mee- of zelfdragende carrosserie van personenauto’s mogen:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte van het
      chassisraam of van de mee- of zelfdragende carrosserie in gevaar worden gebracht.

      2 Onze Minister stelt regels vast inzake corrosie van de in het eerste lid bedoelde onderdelen alsmede de
      bevestiging daarvan.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.3
  - number: 5.2.4
    text: De bovenbouw van personenauto’s moet deugdelijk op het onderstel zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.4
  - number: 5.2.6
    text: |-
      Personenauto's mogen:

      a. niet langer zijn dan 12,00 m;

      b. niet breder zijn dan 2,55 m;

      c. niet hoger zijn dan 4,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.6
  - number: 5.2.7
    text: |-
      1 De last onder de assen van personenauto’s mag niet meer bedragen dan de voor het betrokken voertuig in het
      kentekenregister of op het kentekenbewijs vermelde toegestane maximum aslasten.

      2 De totale massa of de som van de aslasten van personenauto’s mag niet meer bedragen dan de voor het betrokken
      voertuig in het kentekenregister of op het kentekenbewijs vermelde toegestane maximum massa.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.7
  - number: 5.2.9
    text: |-
      1 Alle onderdelen van het brandstofsysteem van personenauto’s moeten veilig zijn en deugdelijk zijn bevestigd. Onze
      Minister stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging.

      2 Het brandstofsysteem mag geen lekkage vertonen.

      3 De vulopening van het brandstofreservoir moet zijn afgesloten met een passende tankdop.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.9
  - number: 5.2.10
    text: |-
      1 Indien de personenauto is voorzien van een LPG-installatie, moet deze, onverminderd het bepaalde in
      [artikel 5.2.9][ref1], voldoen aan de in de volgende leden gestelde eisen.

      2 De LPG-tank:

      a. moet permanent zijn aangebracht aan het voertuig;

      b. mag niet door corrosie zijn aangetast, met uitzondering van corrosie van het oppervlak;

      c. mag geen deuken vertonen.

      3 De LPG-tank mag niet in de motorruimte zijn geplaatst en indien het voertuig in gebruik is genomen na 31 december
      1994, niet op het dak zijn geplaatst.

      4 De volgende onderdelen moeten aanwezig zijn:

      a. de veerveiligheid, die in de buitenlucht moet uitmonden;

      b. de verdamper/drukregelaar, al dan niet gecombineerd, dan wel een mengregelsysteem;

      c. de gasdichte kast indien het voertuig in gebruik is genomen na 31 maart 1979, tenzij de tank in de open lucht
      is geplaatst;

      d. de automatische inrichting ter begrenzing van de vullingsgraad indien het voertuig na 30 juni 1983 in gebruik
      is genomen;

      e. de automatische afnameklep op de tank indien het voertuig na 31 december 1987 in gebruik is genomen;

      f. het gasmengstuk dan wel een inspuitstuk;

      g. de automatische afsluitklep.

      5 Op de LPG-installatie mogen geen andere verbruikers zijn aangesloten dan die, welke strikt noodzakelijk zijn voor
      het goed functioneren van de motor van het voertuig.

      6 Indien het voertuig na 30 september 1978 in gebruik is genomen, mag het vullen van de tank alleen buiten het
      voertuig kunnen geschieden.

      7 De in het vierde lid genoemde onderdelen moeten vrij zijn van ernstige beschadigingen en mogen niet door corrosie
      zijn aangetast, met uitzondering van corrosie van het oppervlak.

      8 De leidingen mogen geen knikken vertonen en mogen niet door corrosie zijn aangetast, met uitzondering van
      corrosie van het oppervlak.

      9 De gasvoerende slangen mogen geen beschadiging vertonen waarbij het wapeningsmateriaal zichtbaar is. De slangen
      die aan de buitenzijde van een metalen wapening zijn voorzien, mogen geen beschadiging vertonen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.2.9
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.10
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.2.9
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '2'
  - number: 5.2.10a
    text: |-
      1 Indien de personenauto is voorzien van een CNG-installatie, moet deze, onverminderd [artikel 5.2.9][ref1],
      voldoen aan de in de volgende leden gestelde eisen.

      2 De CNG-tank:

      a. moet permanent zijn aangebracht aan het voertuig, en

      b. mag geen deuken vertonen.

      3 De CNG-tank mag niet in de motorruimte zijn geplaatst.

      4 Indien de CNG-tank in gebruik is genomen na 19 juli 2002, mag de geldigheid van de goedkeuring niet verstreken
      zijn. CNG-tanks die voor 20 juli 2002 in gebruik zijn genomen en waarvan de gegevens omtrent de geldigheid van de
      goedkeuring niet beschikbaar zijn, mogen niet ouder zijn dan 10 jaar, dan wel mag het voertuig niet ouder zijn dan
      10 jaar.

      5 Op de CNG-installatie mogen geen andere verbruikers zijn aangesloten dan die, welke strikt noodzakelijk zijn voor
      het goed functioneren van de motor van het voertuig, met uitzondering van een verwarmingsinstallatie ten behoeve
      van de personenruimte of laadruimte.

      6 Indien het voertuig in gebruik genomen is na 1 juli 1995, moet het voertuig zijn voorzien van een goed werkende
      automatische tankafsluiter.

      7 De onderdelen van de CNG-installatie moeten vrij zijn van ernstige beschadigingen en mogen niet door corrosie
      zijn aangetast, met uitzondering van corrosie van het oppervlak.

      8 De leidingen en gasvoerende slangen mogen geen knikken vertonen.

      9 De gasvoerende slangen mogen geen beschadiging vertonen waarbij het wapeningsmateriaal zichtbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.2.9
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.10a
