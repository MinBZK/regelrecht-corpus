  - number: 5.2.56
    text: |-
      1 Het dimlicht van personenauto’s moet zodanig zijn afgesteld dat bij controle met een koplamptestapparaat dan wel
      een verlichtingsscherm het geprojecteerde beeld, na fixatie van het apparaat dan wel het scherm, voldoet aan de
      volgende eisen:

      a. het lichte vlak moet zich onder het donkere vlak bevinden;

      b. een duidelijke, geheel of ten dele horizontale scheidingslijn tussen licht en donker moet zichtbaar zijn;

      c. het horizontale gedeelte van de scheidingslijn moet zich bevinden tussen of op de lijnen op het scherm van
      het koplamptestapparaat dan wel op het verlichtingsscherm, die overeenkomen met een daling van de lichtbundel ten
      opzichte van de horizontale middenlijn van de koplamp van 5 tot 40 mm/m;

      d. indien een ten dele horizontale scheidingslijn zichtbaar is:

      1°. moet het horizontale gedeelte van de scheidingslijn zich grotendeels links bevinden van de verticale hartlijn
      op het scherm van het koplamptestapparaat dan wel op het verlichtingsscherm;

      2°. mag het snijpunt van het horizontale en het niet-horizontale gedeelte:

      a. bij controle met een koplamptestapparaat niet links van de verticale hartlijn op het scherm van het
      koplamptestapparaat vallen, dan wel

      b. bij controle met een verlichtingsscherm maximaal 20 mm/m links van de geprojecteerde verticale hartlijn van de
      koplamp op het verlichtingsscherm vallen.

      2 Het voor het dimlicht bestemde deel van de reflector mag zijn oorspronkelijke reflecterende werking niet in
      ernstige mate hebben verloren.

      3 Onze Minister stelt regels vast omtrent het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.56
  - number: 5.2.57
    text: |-
      1 Personenauto’s mogen zijn voorzien van:

      a. twee mistlichten aan de voorzijde van het voertuig;

      b. parkeerlichten indien het voertuig niet langer is dan 6,00 m en niet breder dan 2,00 m;

      c. twee extra richtingaanwijzers en waarschuwingsknipperlichten aan de achterzijde van het voertuig;

      d. één zijrichtingaanwijzer aan elke zijkant van het voertuig indien het voertuig voor 1 januari 1998 in gebruik
      is genomen;

      e. ambergele retroreflectoren aan de zijkanten van het voertuig, indien deze retroreflectoren niet reeds ingevolge
      [artikel 5.2.51][ref1] verplicht zijn;

      f. twee witte retroreflectoren aan de voorzijde van het voertuig;

      g. twee markeringslichten aan de voorzijde en twee aan de achterzijde van het voertuig, indien deze lichten niet
      reeds ingevolge [artikel 5.2.51][ref2] verplicht zijn en het voertuig breder is dan 1,80 m;

      h. zijmarkeringslichten, indien deze lichten niet reeds ingevolge [artikel 5.2.51][ref3] verplicht zijn,
      aangebracht overeenkomstig de door Onze Minister vastgestelde eisen;

      i. een richtlicht;

      j. een bermlicht aan de voorzijde van het voertuig;

      k. werklichten;

      l. een derde remlicht, indien het voertuig in gebruik is genomen voor 1 oktober 2001, aangebracht zodanig dat:

      1º. het midden van het lichtdoorlatende gedeelte zich bevindt in het middenlangsvlak van het voertuig of de rand
      van het lichtdoorlatende gedeelte op een afstand van ten hoogste 0,15 m vanaf dit middenlangsvlak indien het derde
      remlicht niet op een vast deel van de carrosserie of bovenbouw kan worden bevestigd, en

      2º. de onderzijde van het lichtdoorlatende gedeelte hoger ligt dan de bovenzijde van de remlichten, bedoeld in
      [artikel 5.2.51, onderdeel h][ref4];

      m. twee dagrijlichten;

      n. een markering aan de achterzijde van het voertuig bestaande uit een rechthoekig bord dan wel uit een set van
      twee of vier rechthoekige borden, welke zijn voorzien van rood fluorescerende parallel lopende diagonale strepen,
      indien de toegestane maximum massa van het voertuig meer bedraagt dan 3500 kg;

      o. inwendig verlichte transparanten die voor het overige verkeer bij regeling van Onze Minister vast te stellen
      informatie over het gebruik of de bestemming van het voertuig bieden. De verlichting moet afzonderlijk zijn
      geschakeld en mag naar achteren niet rood stralen. Bij regeling van Onze Minister worden nadere eisen vastgesteld
      ten aanzien van de uitvoering van de transparanten en de plaats waar zij op of aan het voertuig zijn aangebracht.

      2 Lichten die ingevolge [artikel 5.2.51][ref5] verplicht zijn gesteld voor voertuigen die na een in dat
      artikel genoemd tijdstip in gebruik zijn genomen, mogen zijn aangebracht op voertuigen die voor of op dat
      tijdstip in gebruik zijn genomen mits wordt voldaan aan de in [artikel 5.2.53][ref6] met betrekking tot die
      lichten, met uitzondering van markeringslichten en zijmarkeringslichten, gestelde eisen. Markeringslichten en
      zijmarkeringslichten moeten alsdan voldoen aan het bepaalde in de onderdelen g onderscheidenlijk h van het eerste
      lid.

      3 Personenauto’s mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra niet-
      driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig.

      4 In afwijking van het eerste lid, onderdeel l, kunnen twee extra remlichten worden aangebracht, indien het derde
      remlicht niet op een vast deel van de carrosserie of bovenbouw binnen 0,15m vanaf het middenlangsvlak kan worden
      bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.2.51
