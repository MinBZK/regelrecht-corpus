  - number: 5.12.59
    text: |-
      1 De achteruitrijlichten mogen niet anders dan wit of geel stralen.

      2 De extra richtingaanwijzers en waarschuwingsknipperlichten mogen niet anders dan ambergeel stralen.

      3 De zijmarkeringslichten mogen niet anders dan ambergeel stralen. Indien het achterste zijmarkeringslicht
      onderdeel uitmaakt van een rood stralend licht dan wel van een rode retroreflector, mag dit licht rood stralen.

      4 [Artikel 5.12.55, tweede, derde, vierde en zevende lid][ref1], is van toepassing.

      5 Het derde remlicht mag niet anders dan rood stralen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.12.55
