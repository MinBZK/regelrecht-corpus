  - number: 5.3.11
    text: |-
      1 Bedrijfsauto’s met een verbrandingsmotor moeten zijn voorzien van een uitlaatsysteem dat over de gehele lengte
      gasdicht is, met uitzondering van de afwateringsgaatjes.

      2 Het uitlaatsysteem moet deugdelijk zijn bevestigd.

      3 Bedrijfsauto’s moeten blijven behoren tot een goedgekeurd type als bedoeld in
      [artikel 2 van het Besluit typekeuring motorrijtuigen luchtverontreiniging][ref1] (Stb. 1990, 393). Aan deze eis
      wordt niet getoetst tijdens de periodieke keuring ten behoeve van de afgifte van een keuringsrapport.

      4 Bedrijfsauto’s moeten blijven behoren tot een goedgekeurd type als bedoeld in
      [artikel 2 van het Besluit geluidproduktie motorvoertuigen][ref2] (Stb. 1981, 741). Aan deze eis wordt niet
      getoetst tijdens de periodieke keuring ten behoeve van de afgifte van een keuringsrapport.

      5 De uitlaatgassen van bedrijfsauto’s met een verbrandingsmotor met elektrische ontsteking mogen bij stationair
      toerental en op bedrijfstemperatuur zijnde motor:

      a. niet meer dan 4,5 % vol koolmonoxyde bevatten indien het voertuig in gebruik is genomen na 31 december 1973 doch
      voor 1 oktober 1986;

      b. niet meer dan 3,5 % vol koolmonoxyde bevatten indien het voertuig in gebruik is genomen na 30 september 1986
      doch voor 1 juli 2002;

      c. niet meer dan 1,5 % vol koolmonoxyde bevatten indien het voertuig in gebruik is genomen na 31 december 1973 doch
      voor 1 juli 2002 en het voertuig blijkens een aantekening op het voor het voertuig afgegeven kentekenbewijs wordt
      gevoed door een al dan niet tot vloeistof verdicht gas;

      d. niet meer dan 0,5 % vol koolmonoxyde bevatten indien het voertuig in gebruik is genomen na 31 december 1985 doch
      voor 1 juli 2002 en het voertuig is uitgerust met een brandstofdoseringssysteem dat de mengverhouding van lucht en
      brandstof voortdurend aanpast aan het zuurstofgehalte van de uitlaatgassen;

      e. niet meer dan 0,3% vol koolmonoxide bevatten indien het voertuig in gebruik is genomen na 30 juni 2002.

      6 De afstelling van het stationaire mengsel van bedrijfsauto’s met een verbrandingsmotor met elektrische
      ontsteking, met een toegestane maximum massa van niet meer dan 3500 kg, die in gebruik zijn genomen na 31
      december 1979, met uitzondering van bedrijfsauto’s die zijn uitgerust met een brandstofdoseringssysteem dat
      de mengverhouding van lucht en brandstof voortdurend aanpast aan het zuurstofgehalte van de uitlaatgassen,
      dient zodanig te zijn dat een door Onze Minister voor het desbetreffende type motorrijtuig aangewezen gehalte
      aan koolmonoxyde van de uitlaatgassen, uitgedrukt in % vol, bij het bij die aanwijzing aangegeven stationaire
      toerental, niet wordt overschreden. Bij de meting van het gehalte koolmonoxyde moeten de eventueel aangewezen
      bijzondere meetvoorschriften in acht worden genomen. Deze eis wordt alleen getoetst tijdens de periodieke keuring
      ten behoeve van de afgifte van een keuringsrapport en bij elke keuring ten behoeve van de afgifte of teruggave van
      een kentekenbewijs.

      7 De in het zesde lid bedoelde controle van de afstelling van het stationaire mengsel vindt bij bedrijfsauto’s die
      worden gevoed door een al dan niet tot vloeistof verdicht gas en die in gebruik zijn genomen na 1 juli 1997 plaats
      aan de hand van de afstel- en controlegegevens, vermeld op het op het voertuig aangebrachte symbool, bedoeld in
      [artikel 3a, tweede lid, van het Besluit typekeuring motorrijtuigen luchtverontreiniging][ref3], dan wel aan de
      hand van de gegevens vermeld in het kentekenregister.

      8 Bij bedrijfsauto’s die zijn uitgerust met een brandstofdoseringssysteem dat de mengverhouding van lucht en
      brandstof voortdurend aanpast aan het zuurstofgehalte van de uitlaatgassen, dient het brandstofdoseringssysteem
      goed te werken. De goede werking ervan wordt beoordeeld aan de hand van het gehalte koolmonoxide van de
      uitlaatgassen, alsmede aan de hand van een op grond van de samenstelling van de uitlaatgassen berekende lucht-
      brandstofverhouding. Deze beoordeling vindt plaats op een door Onze Minister en Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer tezamen aangegeven wijze.

      9

      10 De uitlaatgassen van bedrijfsauto’s met een verbrandingsmotor met compressie-ontsteking die in gebruik zijn
      genomen na 31 december 1979 mogen niet meer dan een door Onze Minister en Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer tezamen aangegeven hoeveelheid roet bevatten, waarbij de eventueel aangewezen
      bijzondere meetvoorschriften in acht worden genomen.

      11 Bij bedrijfsauto's met een verbrandingsmotor met elektrische ontsteking die in gebruik zijn genomen na
      31 december 1994 en die zijn voorzien van een emissiebestrijdingssysteem, moeten de door Onze Minister aangegeven
      onderdelen van dit systeem aanwezig zijn.


