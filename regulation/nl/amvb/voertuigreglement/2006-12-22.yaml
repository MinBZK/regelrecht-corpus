        artikel: 5.8.51
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '8'
      - id: ref3
        bwb_id: BWBR0006746
        artikel: 5.8.57
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '8'
  - number: 5.8.66
    text: |-
      1 De inrichting tot het koppelen van een aanhangwagen moet van een deugdelijke constructie zijn en moet deugdelijk
      aan de landbouw- of bosbouwtrekker zijn bevestigd.

      2 De voor de overbrenging van de krachten noodzakelijke onderdelen van de in het eerste lid bedoelde inrichting
      mogen niet gescheurd, gebroken dan wel overmatig gesleten zijn.

      3 De bedieningsorganen van de in het eerste lid bedoelde inrichting moeten gemakkelijk bereikbaar zijn en
      gemakkelijk en zonder gevaar te bedienen zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.66
  - number: 5.8.71
    text: |-
      1 Landbouw- of bosbouwtrekkers moeten zijn voorzien van ten minste een geluidssignaalinrichting die bestaat uit
      een goed werkende hoorn met vaste toonhoogte. Een samenstel van zodanige, tegelijk werkende hoorns wordt als één
      hoorn beschouwd.

      2 Landbouw- of bosbouwtrekkers mogen zijn voorzien van een geluidssignaalinrichting die andere weggebruikers erop
      attent maakt dat de achteruitversnelling van het voertuig is ingeschakeld, alsmede van een geluidssignaalinrichting
      die ertoe strekt ongeoorloofd gebruik of diefstal van het voertuig te voorkomen.

      3 Landbouw- of bosbouwtrekkers mogen niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.71
  - number: 5.8.72
    text: |-
      Landbouw- of bosbouwtrekkers moeten aan de voorzijde zijn voorzien van een bevestigingspunt ten behoeve van het
      slepen van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.8.72
  - number: 5.9.3
    text: |-
      Het frame van fietsen mag:

      a. niet zodanig zijn vervormd,

      b. geen zodanige breuken of scheuren vertonen,

      c. niet zodanig door corrosie zijn aangetast, dat de stijfheid en sterkte ervan in gevaar worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.3
  - number: 5.9.6
    text: |-
      1 Fietsen op twee wielen mogen niet breder zijn dan 0,75 m.

      2 Fietsen op meer dan twee wielen en fietsen met zijspanwagen mogen niet breder zijn dan 1,50 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.6
  - number: 5.9.29
    text: |-
      1 Fietsen moeten zijn voorzien van een deugdelijke stuurinrichting.

      2 De voor de overbrenging van de stuurkrachten noodzakelijke onderdelen moeten deugdelijk zijn bevestigd.

      3 De voorvork van fietsen mag geen zodanige breuken of scheuren vertonen en niet zodanig door corrosie zijn
      aangetast, dat vervorming optreedt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.29
  - number: 5.9.38
    text: |-
      1 Fietsen moeten zijn voorzien van een goed werkende rem.

      2 Fietsen met uitsluitend velgremmen moeten zijn voorzien van twee goed werkende afzonderlijke remmen, waarmee twee
      wielen kunnen worden geremd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.38
  - number: 5.9.39
    text: |-
      Van fietsen op meer dan twee wielen en fietsen met zijspanwagen moet de rem of één van de remmen in aangezette
      toestand kunnen worden vastgezet, tenzij een afzonderlijke vastzetinrichting aanwezig is.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.39
  - number: 5.9.46
    text: De trappers van fietsen moeten deugdelijk zijn bevestigd en zijn voorzien van een stroef oppervlak.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.46
  - number: 5.9.48
    text: |-
      Fietsen mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor andere
      weggebruikers kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.48
  - number: 5.9.51
    text: |-
      1 Fietsen op twee wielen moeten zijn voorzien van:

      a. een niet-driehoekige rode retroreflector aan de achterzijde van het voertuig;

      b. witte of gele retroreflectoren aan de wielen;

      c. vier ambergele of gele retroreflectoren aan de trappers.

      2 Fietsen op meer dan twee wielen moeten zijn voorzien van:

      a. een niet-driehoekige rode retroreflector aan de achterzijde van het voertuig;

      b. een naar voren gerichte witte retroreflector indien de fiets breder is dan 0,75 m en is voorzien van één
      voorwiel;

      c. witte of gele retroreflectoren aan de wielen;

      d. vier ambergele of gele retroreflectoren aan de trappers.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.51
  - number: 5.9.52
    text: |-
      Zijspanwagens, verbonden aan een fiets, moeten zijn voorzien van:

      a. een niet-driehoekige rode retroreflector aan de achterzijde van het voertuig;

      b. een witte of gele retroreflector aan het wiel.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.52
  - number: 5.9.54
    text: |-
      1 De rode retroreflector moet zijn aangebracht:

      a. bij fietsen met één achterwiel tussen de bagagedrager en het spatbord, dan wel bij afwezigheid van een
      bagagedrager op het spatbord op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek, dan
      wel onder het zadel;

      b. bij fietsen met twee achterwielen aan de uiterste linkerzijde, op een hoogte van niet minder dan 0,35 m en niet
      meer dan 0,90 m boven het wegdek;

      c. bij zijspanwagens aan de uiterste buitenzijde, op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m.

      2 De in [artikel 5.9.51, tweede lid, onderdeel b][ref1], genoemde witte retroreflector moet zijn aangebracht aan de
      uiterste linkerzijde van het voertuig.

      3 De witte of gele retroreflectoren aan de wielen moeten de omtrek van het wiel volgen en op of zo dicht mogelijk
      bij de velg zijn aangebracht, zodanig dat zij aan beide zijkanten van het voertuig zichtbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.9.51
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.54
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.9.51
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '9'
  - number: 5.9.55
    text: |-
      1 De in de [artikelen 5.9.51][ref1] en [5.9.52][ref2] bedoelde retroreflectoren mogen niet zijn afgeschermd.

      2 De in de [artikelen 5.9.51][ref3] en [5.9.52][ref4] bedoelde retroreflectoren mogen geen gebreken vertonen die de
      retroreflectie beïnvloeden.

      3 De niet-driehoekige rode retroreflectoren en de witte of gele retroreflectoren aan de wielen moeten zijn voorzien
      van een door Onze Minister bekendgemaakt goedkeuringsmerk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.9.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.9.52
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.9.51
