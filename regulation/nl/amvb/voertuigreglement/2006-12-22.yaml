  - number: 5.12.64
    text: |-
      Aanhangwagens mogen, met uitzondering van de richtingaanwijzers en de waarschuwingsknipperlichten, niet zijn
      voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.64
  - number: 5.12.65
    text: |-
      Aanhangwagens mogen, onverminderd het in [artikel 30 van het RVV 1990][ref1] bepaalde inzake zwaai-
      en knipperlichten, niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 5.12.51][ref2] en [5.12.57][ref3] is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.12.51
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.12.57
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.65
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 5.12.51
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '12'
      - id: ref3
        bwb_id: BWBR0006746
        artikel: 5.12.57
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '12'
  - number: 5.12.66
    text: |-
      1 De koppeling en de trekdriehoek of trekboom van aanhangwagens moeten deugdelijk zijn bevestigd en mogen niet
      gescheurd, gebroken dan wel overmatig gesleten zijn.

      2 De trekdriehoek of trekboom alsmede alle profielen die daar deel van uitmaken, met inbegrip van schoren,
      versterkingsstrippen en bevestiging, mogen niet door corrosie zijn aangetast, met uitzondering van verschijnselen
      van corrosie van het oppervlak.

      3 De trekdriehoek mag niet zodanig zijn vervormd dat een langsbeen, gemeten over een afstand van 0,90 m, een
      uitwijking heeft van meer dan 18 mm ten opzichte van de rechte lijn.

      4 Middenasaanhangwagens waarvan de toegestane maximum massa niet meer bedraagt dan 1500 kg en die niet zijn
      voorzien van een losbreekreminrichting, moeten zijn voorzien van een hulpkoppeling. De hulpkoppeling moet
      deugdelijk zijn bevestigd en mag niet vervormd, gescheurd, gebroken dan wel overmatig gesleten zijn.

      5 Middenasaanhangwagens die zijn voorzien van een losbreekreminrichting, mogen niet tevens zijn voorzien van een
      hulpkoppeling.

      6 Delen van de koppeling van aanhangwagens mogen tijdens het ontkoppelen, het losbreken of in afgekoppelde toestand
      het wegdek niet kunnen raken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.66
  - number: 5.12.67
    text: |-
      Indien de aanhangwagen is voorzien van een kogelkoppeling,

      a. moet de sluit- en borginrichting goed functioneren;

      b. mogen de onderdelen niet zijn vervormd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.67
  - number: 5.12.68
    text: |-
      1 Indien de aanhangwagen is voorzien van een trekoog met een nominale inwendige diameter van 40 mm:

      a. mag de inwendige diameter van het trekoog niet meer dan 41,5 mm bedragen;

      b. moet de dikte van het trekoog ten minste 28,0 mm bedragen.

      2 Indien de aanhangwagen is voorzien van een trekoog met een nominale inwendige diameter van 50 mm:

      a. mag de inwendige diameter van het trekoog niet meer dan 52,5 mm bedragen;

      b. moet de dikte van het trekoog ten minste 41,5 mm bedragen.

      3 Indien de aanhangwagen is voorzien van een trekoog met een nominale inwendige diameter van 57,5 mm:

      a. mag de inwendige diameter van het trekoog niet meer dan 59,5 mm bedragen;

      b. moet de dikte van het trekoog ten minste 19 mm bedragen.

      4 Het trekoog mag niet zijn vervormd of gescheurd.

      5 Het trekoog mag niet zijn voorzien van een ingelaste trekoogbus.

      6 Het trekoog mag niet zijn hersteld door middel van lassen of oplassen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.68
  - number: 5.12.69
    text: |-
      1 Indien de oplegger is voorzien van een koppelingspen van 2 inch:

      a. moet de diameter van de kleinste doorsnede van de pen ten minste 49,0 mm bedragen;

      b. moet de diameter van de doorsnede van het gedeelte van de pen dat direct boven de kleinste doorsnede is gelegen,
      ten minste 70,0 mm bedragen.

      2 Indien de oplegger is voorzien van een koppelingspen van 3,5 inch:

      a. moet de diameter van de kleinste doorsnede van de pen ten minste 86,0 mm bedragen;

      b. moet de diameter van de doorsnede van het gedeelte van de pen dat direct boven de kleinste doorsnede is gelegen,
      ten minste 110,0 mm bedragen.

      3 De plaat van de opleggerkoppeling mag niet in ernstige mate zijn vervormd of ingesleten. De profielen die
      deel uitmaken van de ondersteuning van de plaat van de opleggerkoppeling mogen niet ernstig door corrosie zijn
      aangetast.

      4 Onze Minister stelt regels vast omtrent het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.69
  - number: 5.12.70
    text: |-
      Onze Minister stelt regels vast met betrekking tot bijzondere constructies voor het koppelen van voertuigen en
      andere koppelingen dan bedoeld in de [artikelen 5.12.67 tot en met 5.12.69][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.12.67
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.12.70
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.12.67
        hoofdstuk: '5'
        paragraaf: '11'
        afdeling: '12'
  - number: 5.13.3
    text: |-
      De langs- en dwarsliggers en chassisversterkingsdelen van het chassisraam, dan wel de daarvoor in de plaats
      tredende delen van de mee- of zelfdragende carrosserie van aanhangwagens mogen:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte van het
      chassisraam of van de mee- of zelfdragende carrosserie in gevaar worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.3
  - number: 5.13.4
    text: |-
      1 De bovenbouw van aanhangwagens moet deugdelijk op het onderstel zijn bevestigd.

      2 De ondersteuning van de laadvloer onderscheidenlijk laadruimte moet deugdelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.4
  - number: 5.13.5
    text: De bedrading van aanhangwagens moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.5
  - number: 5.13.6
    text: |-
      Aanhangwagens mogen:

      a. niet langer zijn dan 12,00 m, dan wel niet langer dan 8,00 m indien het een middenasaanhangwagen betreft;

      b. niet breder zijn dan 2,55 m;

      c. niet hoger zijn dan 4,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.6
  - number: 5.13.18
    text: |-
      1 De assen van aanhangwagens moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen breuken of scheuren
      vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.18
  - number: 5.13.20
    text: |-
      1 De wiellagers van aanhangwagens mogen niet teveel speling vertonen.

      2 Verschijnselen van slijtage of beschadiging mogen niet hoorbaar of voelbaar zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.20
  - number: 5.13.24
    text: |-
      1 De wielen onderscheidenlijk velgen van aanhangwagens mogen geen breuken, scheuren, ondeugdelijk laswerk of
      ernstige vervorming vertonen.

      2 De wielen onderscheidenlijk velgen moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.24
  - number: 5.13.27
    text: |-
      1 Aanhangwagens moeten zijn voorzien van banden waarvan het loopvlak niet bestaat uit metaal of een materiaal dat
      voor wat betreft hardheid en vervormbaarheid dezelfde eigenschappen heeft.

      2 De luchtbanden van aanhangwagens mogen geen beschadigingen vertonen waarbij het karkas zichtbaar is.

      3 De luchtbanden mogen geen uitstulpingen vertonen.

      4 De profilering van de hoofdgroeven van de luchtbanden moet over de gehele omtrek van het loopvlak ten minste 1,6
      mm bedragen, met uitzondering van slijtage-indicatoren.

      5 De banden mogen niet zijn opgesneden. Van opsnijden is sprake indien slijtage-indicatoren zijn weggesneden,
      indien de profielvorm van de groef afwijkt van de originele profielvorm, of indien in de bodem van de groef het
      karkas van de band zichtbaar is.

      6 Het loopvlak van de banden mag geen metalen elementen bevatten die tijdens het rijden daarbuiten kunnen
      uitsteken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.27
  - number: 5.13.28
    text: |-
      1 Aanhangwagens moeten zijn voorzien van een goed werkend veersysteem. Banden worden niet als deel van het
      veersysteem beschouwd.

      2 De onderdelen van het veersysteem mogen geen breuken of scheuren vertonen en moeten deugdelijk zijn bevestigd.

      3 Aanhangwagens die zijn voorzien van gasvering of schroefveren moeten zijn voorzien van goed werkende
      schokdempers.

      4 Schokdempers van aanhangwagens moeten deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.28
  - number: 5.13.31
    text: |-
      Indien de aanhangwagen is voorzien van een reminrichting, moet deze zodanig werken dat het voertuig ten gevolge van
      de remwerking geen zijwaartse bewegingen maakt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.31
  - number: 5.13.41
    text: Het slot en de scharnieren van de deuren en laadbakkleppen van aanhangwagens moeten een goede sluiting waarborgen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.41
  - number: 5.13.48
    text: |-
      1 Aanhangwagens mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor andere
      weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen van aanhangwagens, die in geval van botsing
      het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn afgeschermd.

      3 Het bepaalde in het eerste en tweede lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m boven
      het wegdek bevinden.

      4 De wielen onderscheidenlijk banden van aanhangwagens moeten goed zijn afgeschermd en mogen niet aanlopen.

      5 Een reservewielhouder die zich aan de buitenzijde van de aanhangwagen bevindt, moet deugdelijk zijn bevestigd.
      Indien in de houder een reservewiel is geplaatst, moet dat wiel goed zijn opgesloten.

      6 Geen deel van de buitenzijde van de aanhangwagen mag zodanig zijn bevestigd, beschadigd, versleten of door
      corrosie zijn aangetast, dat gevaar bestaat voor losraken.

      7 Onze Minister kan regels vaststellen omtrent het bepaalde in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.48
  - number: 5.13.50
    text: Aanhangwagens moeten aan de achterzijde zijn voorzien van een mogelijkheid tot bevestiging van een kentekenplaat.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.50
  - number: 5.13.51
    text: |-
      1 Aanhangwagens moeten zijn voorzien van:

      a. twee stadslichten indien het voertuig breder is dan 1,60 m;

      b. twee richtingaanwijzers aan de achterzijde van het voertuig;

      c. twee achterlichten;

      d. twee remlichten;

      e. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      f. twee driehoekige rode retroreflectoren aan de achterzijde van het voertuig;

      g. met ingang van 1 juli 2006, één of twee mistlichten aan de achterzijde van het voertuig; in het geval van één
      mistlicht moet dit zich bevinden in of links van het middenlangsvlak van het voertuig;

      h. twee witte retroreflectoren aan de voorzijde van het voertuig;

      i. niet-driehoekige ambergele retroreflectoren aan elke zijkant van het voertuig;

      j. met ingang van 1 januari 2005, twee markeringslichten aan de voorzijde en twee aan de achterzijde van het
      voertuig, indien het voertuig breder is dan 2,10 m;

      k. met ingang van 1 januari 2005, zijmarkeringslichten indien het voertuig langer is dan 6,00 m, aangebracht
      overeenkomstig de door Onze Minister vastgestelde eisen.

      2 Het eerste lid, onderdeel g, is niet van toepassing op een aanhangwagen die wordt getrokken door een voertuig dat
      niet is voorzien van één of twee mistlichten aan de achterzijde.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.51
  - number: 5.13.53
    text: |-
      1 De stadslichten mogen niet anders dan wit stralen.

      2 De richtingaanwijzers en de remlichten mogen niet anders dan rood of ambergeel stralen.

      3 De achterlichten en de mistlichten aan de achterzijde mogen niet anders dan rood stralen.

      4 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.

      5 De markeringslichten mogen naar voren niet anders dan wit en naar achteren niet anders dan rood stralen.

      6 De zijmarkeringslichten mogen niet anders dan ambergeel stralen. Indien het achterste zijmarkeringslicht
      onderdeel uitmaakt van een rood stralend licht dan wel van een rode retroreflector, mag dit licht rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.53
  - number: 5.13.54
    text: |-
      1 De stadslichten moeten aan de voorzijde van het voertuig voor de eerste as zijn aangebracht:

      a. op een afstand van niet meer dan 0,15 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,50 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig niet mogelijk is, mogen de stadslichten op een hoogte van meer dan 1,50 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      2 De richtingaanwijzers moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,50 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig niet mogelijk is, mogen de richtingaanwijzers op een hoogte van meer dan 1,50 m
      doch niet meer dan 2,10 m boven het wegdek zijn aangebracht.

      3 De achterlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,30 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,50 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig niet mogelijk is, mogen de achterlichten op een hoogte van meer dan 1,50 m doch
      niet meer dan 2,10 m boven het wegdek zijn aangebracht.

      4 De remlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,30 m;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,50 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig niet mogelijk is, mogen de remlichten op een hoogte van meer dan 1,50 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      5 De driehoekige rode retroreflectoren moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,30 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek.

      6 Het mistlicht of de mistlichten aan de achterzijde van het voertuig moeten zijn aangebracht:

      a. op ten minste 0,10 m afstand van de remlichten;

      b. op een hoogte van niet minder dan 0,25 m en niet meer dan 1,00 m boven het wegdek.

      Indien slechts één mistlicht aanwezig is, moet dit licht links van het middenlangsvlak van het voertuig zijn
      aangebracht.

      7 De witte retroreflectoren aan de voorzijde van het voertuig moeten voor de eerste as zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand van niet minder dan 0,60 m dan wel niet minder dan 0,40 m indien de grootste breedte
      van het voertuig minder bedraagt dan 1,30 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig niet mogelijk is, mogen de retroreflectoren op een hoogte van meer dan 0,90 m doch
      niet meer dan 1,50 m boven het wegdek zijn aangebracht.

      8 De niet-driehoekige ambergele retroreflectoren aan elke zijkant van het voertuig moeten:

      a. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m evenwijdig aan het middenlangsvlak boven het
      wegdek zijn aangebracht. Indien zulks in verband met de constructie van het voertuig niet mogelijk is, mogen de
      retroreflectoren op een hoogte van meer dan 0,90 m doch niet meer dan 1,50 m boven het wegdek zijn aangebracht;

      b. zodanig zijn aangebracht dat:

      1°. één retroreflector zich bevindt in het middelste derde gedeelte van de aanhangwagen;

      2°. de onderlinge afstand tussen de retroreflectoren niet meer dan 3,00 m bedraagt;

      3°. de afstand van de voorste retroreflector tot de voorzijde van de aanhangwagen niet meer dan 3,00 m bedraagt;

      4°. de afstand van de achterste retroreflector tot de achterzijde van de aanhangwagen niet meer dan 1,00 m
      bedraagt, waarbij het voertuiggedeelte boven de 2,00 m buiten beschouwing wordt gelaten in de afstand tot de
      achterzijde.

      9 De markeringslichten moeten zijn aangebracht:

      a. zo hoog mogelijk boven het wegdek;

      b. zo dicht mogelijk bij het punt van de grootste breedte van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.54
  - number: 5.13.55
    text: |-
      1 De in [artikel 5.13.51][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijk kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      voertuig zijn bevestigd.

      5 De in [artikel 5.13.51][ref2] bedoelde lichten en retroreflectoren mogen niet zijn afgeschermd.

      6 De in [artikel 5.13.51][ref3] bedoelde retroreflectoren mogen geen gebreken vertonen, die de retroreflectie
      beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.13.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.13.51
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.13.51
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.55
