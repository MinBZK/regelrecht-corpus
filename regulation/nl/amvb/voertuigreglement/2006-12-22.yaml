  - number: '6.5'
    text: |-
      Bij wijziging van de wielbasis van een personenauto, bedrijfsauto, driewielig motorrijtuig, motorfiets of
      aanhangwagen met meer dan 1%, in het geval van een motorfiets of een driewielig motorrijtuig met kettingaandrijving
      zodanig dat deze meer dan 60 mm afwijkt, van de waarde die voor het voertuig is vermeld op het kentekenbewijs dan
      wel in het kentekenregister, moet het voertuig voldoen aan de in de [hoofdstukken 3][ref1] en [5][ref2] opgenomen
      eisen omtrent:

      a. algemeen,

      b. algemene bouwwijze van het voertuig,

      c. afmetingen en massa’s,

      d. krachtoverbrenging,

      e. stuurinrichting,

      f. reminrichting,

      g. de carrosserie voorzover het betreft de bescherming aan de achterzijde en de zijdelingse afscherming,

      h. verlichting, lichtsignalen en retroreflecterende voorzieningen, alsmede de door Onze Minister vastgrestelde
      eisen met betrekking tot stijfheid en deugdelijkheid van de constructie alsmede het weggedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel6.5
