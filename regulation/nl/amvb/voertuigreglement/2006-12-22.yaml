  - number: 5.13.60
    text: |-
      1 De achteruitrijlichten mogen niet lager dan 0,25 m en niet hoger dan 1,20 m boven het wegdek zijn aangebracht.

      2 Op de markeringslichten is [artikel 5.13.54, negende lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.13.54
