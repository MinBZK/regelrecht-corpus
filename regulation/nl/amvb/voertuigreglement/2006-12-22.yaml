  - number: 5.14.57
    text: |-
      1 Aanhangwagens mogen zijn voorzien van:

      a. twee stadslichten, indien deze niet reeds ingevolge [artikel 5.14.51][ref1] verplicht zijn;

      b. één of twee mistlichten aan de achterzijde van het voertuig; in het geval van één mistlicht moet dit zich
      bevinden in of links van het middenlangsvlak van het voertuig;

      c. twee markeringslichten aan de voorzijde en twee aan de achterzijde van het voertuig, indien het voertuig niet
      reeds ingevolge [artikel 5.14.51][ref2] van deze lichten moet zijn voorzien;

      d. één of twee achteruitrijlichten;

      e. werklichten.

      2 Aanhangwagens mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra
      driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.14.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.14.51
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.57
