  - number: 5.3.61
    text: |-
      1 Bij bedrijfsauto's in gebruik genomen na 31 december 1967 moeten de verlichting, lichtsignalen en
      retroreflecterende voorzieningen, bedoeld in de [artikelen 5.3.51][ref1] en [5.3.57][ref2] zijn aangebracht op een
      afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig. Voor richtingaanwijzers
      geldt de eerste volzin slechts voor zover het voertuig in gebruik is genomen na 31 december 1997.

      2 Het bepaalde in het eerste lid geldt niet voor de grote lichten, richtlichten, bermlichten, achteruitrijlichten,
      remlichten, de verlichting van de kentekenplaat aan de achterzijde van het voertuig, de markering aan de
      achterzijde van het voertuig, mistlichten aan de achterzijde van het voertuig en werklichten.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.57
