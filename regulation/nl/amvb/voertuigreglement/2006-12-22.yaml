        paragraaf: '10'
        afdeling: '9'
  - number: 5.9.60
    text: De witte retroreflector op de zijspanwagen moet zijn aangebracht aan de uiterste buitenzijde.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.60
  - number: 5.9.64
    text: |-
      1 Fietsen mogen niet zijn voorzien van verblindende verlichting.

      2 Fietsen mogen niet zijn voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.64
  - number: 5.9.65
    text: |-
      Fietsen mogen niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 5.9.51][ref1], [5.9.52][ref2] en [5.9.57][ref3] is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.9.51
