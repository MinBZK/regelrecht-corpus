  - number: 5.2.66
    text: |-
      Indien de personenauto is voorzien van een inrichting tot het koppelen van een aanhangwagen, moet deze inrichting
      deugdelijk zijn bevestigd en mag deze niet zijn gescheurd, gebroken of vervormd. Onze Minister stelt regels vast
      met betrekking tot de deugdelijkheid van de bevestiging.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.66
  - number: 5.2.67
    text: |-
      1 Indien een personenauto is voorzien van een koppelingskogel met een kogel met een nominale diameter van 50 mm:

      a. moet de diameter van de kogel ten minste 49,0 mm bedragen;

      b. moet de sluit- en borginrichting van een afneembare kogel goed functioneren en moet de bevestiging van het
      kogelgedeelte nagenoeg spelingvrij zijn.

      2 Bij personenauto’s die zijn voorzien van andere inrichtingen tot het koppelen van een aanhangwagen dan
      bedoeld in het eerste lid, moet worden voldaan aan het bepaalde bij of krachtens de [artikelen 5.3.68][ref1] en
      [5.3.70][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.68
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.70
