  - number: 5.1.2
    text: |-
      Het is de bestuurder van een voertuig of een samenstel van voertuigen verboden daarmee te rijden en de eigenaar of
      houder verboden daarmee te laten rijden, indien niet wordt voldaan aan de in [afdeling 18 van dit hoofdstuk][ref1]
      ten aanzien van het gebruik van voertuigen of samenstellen van voertuigen van de categorie of categorieën, waartoe
      die voertuigen behoren, gestelde eisen.


