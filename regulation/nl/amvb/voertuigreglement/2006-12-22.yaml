  - number: 5.5.59
    text: |-
      1 De mistlichten aan de voorzijde, de achteruitrijlichten, het richtlicht en het bermlicht mogen niet anders dan
      wit of geel stralen.

      2 De mistlichten aan de achterzijde van het voertuig mogen niet anders dan rood stralen.

      3 De parkeerlichten mogen naar voren niet anders dan wit en naar achteren niet anders dan rood stralen.

      4 De zijrichtingaanwijzers mogen naar voren niet anders dan ambergeel of wit en naar achteren niet anders dan
      ambergeel of rood stralen.

      5 [Artikel 5.5.55, tweede, derde, vierde en zevende lid][ref1], is van toepassing.

      6 Op de mistlichten aan de voorzijde alsmede aan de achterzijde van het voertuig is
      [artikel 5.5.55, eerste tot en met vijfde en zevende lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.5.55
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.5.55
