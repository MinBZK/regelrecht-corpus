  - number: 5.18.12a
    text: |-
      Indien een op een voertuig gemonteerde afneembare bovenbouw of gestandaardiseerde laadstructuur aan de achterzijde
      van dat voertuig uitsteekt en daardoor het zicht op de verlichting, de retroreflectoren, de richtingaanwijzers
      of de kentekenplaat aldaar belemmert, dient deze afneembare bovenbouw of gestandaardiseerde laadstructuur aan
      de achterzijde op gelijke wijze als het betrokken voertuig te zijn voorzien van verlichting, retroreflectoren,
      richtingaanwijzers of de kentekenplaat van dat voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.12a
  - number: 5.18.13
    text: |-
      1 In afwijking van het bepaalde in [artikel 5.18.12][ref1] mag bij het vervoer van in de lengte ondeelbare lading:

      a. de lengte van een voertuig of samenstel van voertuigen met inbegrip van de lading meer bedragen dan ingevolge
      [artikel 5.18.12][ref2] is toegestaan waarbij:

      1°. de lading niet meer dan 5,00 m achter de achterste as van het voertuig mag uitsteken;

      2°. de lading niet meer dan 3,50 m voor het hart van het stuurwiel van het voertuig mag uitsteken;

      3°. de lading niet voor de voorzijde van de aanhangwagen, niet zijnde een oplegger, mag uitsteken;

      4°. de lading die voor of meer dan 1,00 m achter het voertuig uitsteekt, aan de voorzijde dan wel de achterzijde
      moet zijn voorzien van een markering die voldoet aan de door Onze Minister vastgestelde eisen;

      b. onverminderd het gestelde in onderdeel *a*, de lengte van een beladen samenstel van trekker en oplegger meer
      bedragen dan ingevolge [artikel 5.18.12][ref3] is toegestaan doch niet meer dan voor dat vervoer noodzakelijk is
      met een maximum van 22,00 m.

      2 In afwijking van het bepaalde in [artikel 5.18.12][ref4] mag de lengte van een beladen samenstel van bedrijfsauto
      en aanhangwagen, niet zijnde een oplegger, dat is ingericht voor het vervoer van voertuigen, meer bedragen dan
      ingevolge [artikel 5.18.12][ref5] is toegestaan doch niet meer dan 20,75 m, waarbij:

      1°. de lading niet meer dan 2,00 m achter de aanhangwagen en niet meer dan 5,00 m achter de achterste as van de
      aanhangwagen mag uitsteken;

      2°. de lading niet meer dan 0,50 m voor de voorzijde van de bedrijfsauto mag uitsteken;

      3°. de lading die voor of meer dan 1,00 m achter het voertuig uitsteekt, aan de voorzijde dan wel de achterzijde
      moet zijn voorzien van een markering die voldoet aan de door Onze Minister vastgestelde eisen.

      3 Het bepaalde in het eerste lid is niet van toepassing op samenstellen van voertuigen, zijnde kermis- of
      circusvoertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.12
