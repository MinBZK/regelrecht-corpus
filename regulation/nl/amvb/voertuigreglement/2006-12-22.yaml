  - number: 5.3.59
    text: |-
      1 De mistlichten aan de voorzijde, het richtlicht en het bermlicht mogen naar voren niet anders dan wit of geel
      stralen.

      2 De parkeerlichten mogen naar voren niet anders dan wit, en naar achteren niet anders dan rood stralen, dan wel
      indien zij zijn ingebouwd in de zijrichtingaanwijzers, niet anders dan ambergeel stralen.

      3 De extra richtingaanwijzers, waarschuwingsknipperlichten en herhalingswaarschuwingsknipperlichten mogen niet
      anders dan ambergeel stralen.

      4 De zijrichtingaanwijzers mogen naar voren niet anders dan ambergeel of wit, en naar achteren niet anders dan
      ambergeel of rood stralen.

      5 De zijmarkeringslichten mogen niet anders dan ambergeel stralen. Indien het achterste zijmarkeringslicht
      onderdeel uitmaakt van een rood stralend licht dan wel van een rode retroreflector, mag dit licht rood stralen.

      6 [Artikel 5.3.55, tweede, derde, vierde en zevende lid][ref1], is van toepassing.

      7 Op de mistlichten aan de voorzijde van het voertuig is
      [artikel 5.3.55, eerste tot en met vijfde en zevende lid][ref2], van overeenkomstige toepassing.

      8 De markeringslichten mogen naar voren niet anders dan wit en naar achteren niet anders dan rood stralen.

      9 De dagrijlichten mogen niet anders dan wit stralen.

      10 Het derde remlicht mag niet anders dan rood stralen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.55
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.55
