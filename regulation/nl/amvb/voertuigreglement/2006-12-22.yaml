  - number: 5.13.57
    text: |-
      1 Aanhangwagens mogen zijn voorzien van:

      a. twee stadslichten, indien deze niet reeds ingevolge [artikel 5.13.51][ref1] verplicht zijn;

      b. twee markeringslichten aan de voorzijde en twee aan de achterzijde van het voertuig, indien het voertuig niet
      reeds ingevolge [artikel 5.13.51][ref2] van deze lichten moet zijn voorzien;

      c. zijmarkeringslichten, indien deze lichten niet reeds ingevolge [artikel 5.13.51][ref3] verplicht zijn,
      aangebracht overeenkomstig de door Onze Minister vastgestelde eisen;

      d. één of twee achteruitrijlichten;

      e. werklichten;

      f. een derde remlicht, aangebracht zodanig dat:

      1°. het midden van het lichtdoorlatende gedeelte zich bevindt in het midden langsvlak van het voertuig of op een
      afstand van ten hoogste 0,15 m vanaf dit middenlangsvlak, en

      2°. de onderzijde van het lichtdoorlatende gedeelte hoger ligt dan de bovenzijde van de remlichten, bedoeld in
      [artikel 5.13.51, onderdeel d][ref4].

      2 Aanhangwagens mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra
      driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.13.51
