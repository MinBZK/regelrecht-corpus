        bwb_id: BWBR0004825
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '30'
  - number: 5.3.66
    text: |-
      1 Indien de bedrijfsauto is voorzien van een inrichting tot het koppelen van een aanhangwagen, moet deze inrichting
      deugdelijk zijn bevestigd en mag deze niet gescheurd, gebroken, vervormd dan wel overmatig gesleten zijn,
      onverminderd het bepaalde in [artikel 5.3.68, tweede lid, onderdeel h][ref1]. Onze Minister stelt regels vast met
      betrekking tot de deugdelijkheid van de bevestiging.

      2 De achtertraverse met inbegrip van alle profielen die daar deel van uitmaken, moet deugdelijk zijn bevestigd
      en mag:

      a. geen breuken of scheuren vertonen;

      b. niet door corrosie zijn aangetast, met uitzondering van corrosie van het oppervlak.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.68
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.3.66
    references:
