        afdeling: '10'
  - number: 5.10.56
    text: |-
      1 Het dimlicht van gehandicaptenvoertuigen moet zodanig zijn afgesteld dat bij controle met een koplamptestapparaat
      dan wel een verlichtingsscherm het geprojecteerde beeld, na fixatie van het apparaat dan wel het scherm, voldoet
      aan de volgende eisen:

      a. het lichte vlak moet zich onder het donkere vlak bevinden;

      b. een duidelijke, geheel of ten dele horizontale scheidingslijn tussen licht en donker moet zichtbaar zijn;

      c. het horizontale gedeelte van de scheidingslijn moet zich bevinden tussen of op de lijnen op het scherm van
      het koplamptestapparaat dan wel op het verlichtingsscherm, die overeenkomen met een daling van de lichtbundel ten
      opzichte van de horizontale middenlijn van de koplamp van 5 tot 40 mm/m;

      d. indien een ten dele horizontale scheidingslijn zichtbaar is:

      1°. moet het horizontale gedeelte van de scheidingslijn zich grotendeels links bevinden van de verticale hartlijn
      op het scherm van het koplamptestapparaat dan wel op het verlichtingsscherm;

      2°. mag het snijpunt van het horizontale en het niet-horizontale gedeelte:

      a. bij controle met een koplamptestapparaat niet links van de verticale hartlijn op het scherm van het
      koplamptestapparaat vallen, dan wel

      b. bij controle met een verlichtingsscherm maximaal 20 mm/m links van de geprojecteerde verticale hartlijn van de
      koplamp op het verlichtingsscherm vallen.

      2 Het voor het dimlicht bestemde deel van de reflector mag zijn oorspronkelijke reflecterende werking niet in
      ernstige mate hebben verloren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.56
  - number: 5.10.57
    text: |-
      1 Gehandicaptenvoertuigen mogen zijn voorzien van:

      a. een of twee mistlichten aan de achterzijde van het voertuig;

      b. twee mistlichten aan de voorzijde van het voertuig;

      c. twee of vier parkeerlichten;

      d. één of twee achteruitrijlichten;

      e. twee witte retroreflectoren aan de voorzijde van het voertuig;

      f. ambergele retroreflectoren aan de zijkanten van het voertuig;

      g. een richtlicht;

      h. een bermlicht aan de voorzijde van het voertuig.

      2 Gehandicaptenvoertuigen mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde,
      extra niet-driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.57
  - number: 5.10.59
    text: |-
      1 De mistlichten aan de voorzijde, de achteruitrijlichten, het richtlicht en het bermlicht mogen niet anders dan
      wit of geel stralen.

      2 De parkeerlichten mogen naar voren niet anders dan wit en naar achteren niet anders dan rood stralen. Indien de
      parkeerlichten zijn samengebouwd met de richtingaanwijzers, mogen zij ambergeel stralen.

      3 [Artikel 5.10.55, tweede, derde, vierde en zevende lid][ref1], is van toepassing.

      4 Op de mistlichten aan de voorzijde van het voertuig is
      [artikel 5.10.55, eerste tot en met vijfde en zevende lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.10.55
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.10.55
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.59
