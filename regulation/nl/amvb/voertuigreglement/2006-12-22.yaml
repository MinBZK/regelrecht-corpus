  - number: 5.7.60
    text: |-
      1 De grote lichten moeten aan de voorzijde van het voertuig zijn aangebracht, waarbij de buitenste randen van het
      lichtdoorlatende gedeelte zich niet dichter bij het punt van de grootste breedte van het voertuig mogen bevinden
      dan de buitenranden van het lichtdoorlatende gedeelte van de dimlichten.

      2 De extra dimlichten moeten aan de voorzijde van het voertuig zijn aangebracht op een hoogte van niet minder
      dan 0,50 m en niet meer dan 2,80 m boven het wegdek. De extra stadslichten moeten zijn samengebouwd met de extra
      dimlichten.

      3 De mistlichten aan de voorzijde van het voertuig moeten op een hoogte van niet minder dan 0,25 m boven het wegdek
      doch niet hoger dan de dimlichten zijn aangebracht.

      4 Het mistlicht of de mistlichten aan de achterzijde van het voertuig moeten op een hoogte van niet minder dan
      0,35 m en niet meer dan 1,90 m boven het wegdek zijn aangebracht. Indien zulks door de vorm van de bovenbouw niet
      mogelijk is, mogen het licht of de lichten op een hoogte van meer dan 1,90 m doch niet meer dan 2,10 m boven het
      wegdek zijn aangebracht. Indien één licht is aangebracht, moet dit links van het midden van het voertuig zijn
      geplaatst.

      5 Van de parkeerlichten moeten er twee aan de voorzijde en twee aan de achterzijde van het voertuig zijn
      aangebracht, dan wel moet er één aan elke kant van het voertuig zijn aangebracht.

      6 De zijrichtingaanwijzers moeten zijn aangebracht op een afstand van niet meer dan 1,80 m vanaf de voorzijde van
      het voertuig.

      7 De achteruitrijlichten moeten aan de achterzijde van het voertuig zijn aangebracht op een hoogte van niet minder
      dan 0,25 m en niet meer dan 1,20 m boven het wegdek.

      8 Van de markeringslichten moeten er twee aan de voorzijde en twee aan de achterzijde zijn aangebracht:

      a. zo dicht mogelijk bij het punt van de grootste breedte van het voertuig;

      b. zo hoog mogelijk als met inachtneming van het bepaalde [onder ][ref1] mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.7.60
