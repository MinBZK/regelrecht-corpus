        afdeling: '14'
  - number: 5.14.66
    text: |-
      1 De verbinding tussen trekkend motorrijtuig en aanhangwagen of tussen twee aanhangwagens moet worden gevormd door
      een enkele, voldoende stijve en sterke koppeling die niet kan lostrillen.

      2 De koppeling en de trekdriehoek of trekboom van aanhangwagens moeten deugdelijk zijn bevestigd en mogen niet
      gescheurd, gebroken dan wel overmatig gesleten zijn.

      3 De trekdriehoek of trekboom mag niet zijn doorgeroest.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.66
  - number: 5.14.67
    text: |-
      Indien de aanhangwagen is voorzien van een kogelkoppeling,

      a. moet de sluit- en borginrichting goed functioneren;

      b. mogen de onderdelen niet zijn vervormd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.67
  - number: 5.15.2
    text: |-
      1 Aanhangwagens achter motorfietsen of bromfietsen mogen slechts éénassig zijn.

      2 Bij éénwielige aanhangwagens moet het wiel zodanig zijn bevestigd dat het uitsluitend draaibaar is om de eigen
      horizontale as.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.2
  - number: 5.15.3
    text: |-
      De langs- en dwarsliggers en chassisversterkingsdelen van het chassisraam, dan wel de daarvoor in de plaats
      tredende delen van de mee- of zelfdragende carrosserie van aanhangwagens mogen:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte van het
      chassisraam of van de mee- of zelfdragende carrosserie in gevaar worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.3
  - number: 5.15.4
    text: |-
      1 De bovenbouw van aanhangwagens moet deugdelijk op het onderstel zijn bevestigd.

      2 De ondersteuning van de laadvloer onderscheidenlijk laadruimte moet deugdelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.4
  - number: 5.15.6
    text: |-
      1 Aanhangwagens achter motorfietsen mogen:

      a. niet breder zijn dan 1,00 m;

      b. niet hoger zijn dan 1,00 m.

      2 Aanhangwagens achter bromfietsen mogen:

      a. niet breder zijn dan 1,00 m;

      b. niet hoger zijn dan 1,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.6
  - number: 5.15.18
    text: |-
      1 De assen van aanhangwagens moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen breuken of scheuren
      vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.18
  - number: 5.15.24
    text: |-
      1 De wielen, alsmede de onderdelen daarvan, van aanhangwagens mogen geen breuken, scheuren, ondeugdelijk laswerk of
      ernstige vervorming vertonen. Onderdelen mogen niet loszitten of ontbreken.

      2 De wielen onderscheidenlijk velgen moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.24
  - number: 5.15.27
    text: |-
      1 De wielen van aanhangwagens moeten zijn voorzien van luchtbanden.

      2 De banden mogen geen beschadigingen vertonen waarbij het karkas zichtbaar is.

      3 De banden mogen geen uitstulpingen vertonen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.27
  - number: 5.15.41
    text: De sloten en de scharnieren van de deuren en laadbakkleppen van aanhangwagens moeten een goede sluiting waarborgen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.41
  - number: 5.15.48
    text: |-
      1 Aanhangwagens mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor andere
      weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen van aanhangwagens, die in geval van botsing
      het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn afgeschermd.

      3 De wielen onderscheidenlijk banden van aanhangwagens moeten goed zijn afgeschermd en mogen niet aanlopen.

      4 Een reservewielhouder die zich aan de buitenzijde van de aanhangwagen bevindt, moet deugdelijk zijn bevestigd.
      Indien in de houder een reservewiel is geplaatst, moet dat wiel goed zijn opgesloten.

      5 Geen deel van de buitenzijde van de aanhangwagen mag zodanig zijn bevestigd, beschadigd, versleten of door
      corrosie zijn aangetast, dat gevaar bestaat voor losraken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.48
  - number: 5.15.50
    text: |-
      Aanhangwagens achter een motorfiets of bromfiets moeten aan de achterzijde zijn voorzien van een mogelijkheid tot
      bevestiging van een kentekenplaat.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.50
  - number: 5.15.51
    text: |-
      1 Aanhangwagens achter een motorfiets moeten zijn voorzien van:

      a. twee richtingaanwijzers aan de achterzijde van het voertuig, dan wel één richtingaanwijzer aan elke zijkant van
      het voertuig, indien de trekkende motorfiets van richtingaanwijzers is voorzien;

      b. één of twee achterlichten;

      c. één of twee remlichten, indien de trekkende motorfiets van een remlicht is voorzien;

      d. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      e. één of twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig;

      f. ten minste één niet-driehoekige ambergele retroreflector aan elke zijkant van het voertuig.

      2 Aanhangwagens achter een bromfiets moeten zijn voorzien van:

      a. één of twee achterlichten;

      b. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig;

      c. ten minste één niet-driehoekige ambergele retroreflector aan elke zijkant van het voertuig;

      d. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.51
  - number: 5.15.53
    text: |-
      1 De richtingaanwijzers mogen niet anders dan ambergeel stralen.

      2 De achterlichten en de remlichten mogen niet anders dan rood stralen.

      3 De verlichting van de kentekenplaat mag niet anders dan wit stralen en mag niet naar achteren stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.53
  - number: 5.15.54
    text: |-
      1 De richtingaanwijzers moeten zijn aangebracht:

      a. aan de uiterste zijden van het voertuig en op een onderlinge afstand, gemeten tussen de binnenranden van het
      lichtdoorlatende gedeelte, van niet minder dan 0,24 m;

      b. op een hoogte van niet minder dan 0,35 m boven het wegdek.

      De lichten moeten zodanig zijn aangebracht dat zij waarneembaar zijn voor een waarnemer die zich in het mediaanvlak
      van het voertuig bevindt op een afstand van 10 m achter het voertuig.

      2 De achterlichten moeten aan de achterzijde van het voertuig zijn aangebracht op een hoogte van niet minder dan
      0,25 m boven het wegdek.

      3 Het remlicht of de remlichten moeten aan de achterzijde van het voertuig zijn aangebracht op een hoogte van niet
      minder dan 0,25 m boven het wegdek. Indien één licht is aangebracht, moet dit in het midden of links van het midden
      van het voertuig zijn geplaatst.

      4 De niet-driehoekige rode retroreflectoren moeten zijn aangebracht aan de uiterste zijden van het voertuig op een
      hoogte van niet minder dan 0,25 m boven het wegdek.

      5 De in [artikel 5.15.51][ref1] bedoelde ambergele retroreflectoren moeten zijn aangebracht aan elke zijkant op een
      hoogte van niet minder dan 0,30 m en niet meer dan 0,90 m boven het wegdek. Ten minste één retroreflector moet zich
      bevinden in het middelste derde gedeelte van de aanhangwagen met inbegrip van de dissel.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.15.51
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.54
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.15.51
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '15'
  - number: 5.15.55
    text: |-
      1 De in [artikel 5.15.51][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn bevestigd, gerepareerd of bewerkt dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig zijn bevestigd.

      5 De in [artikel 5.15.51][ref2] bedoelde lichten en retroreflectoren mogen niet zijn afgeschermd.

      6 De in [artikel 5.15.51][ref3] bedoelde retroreflectoren mogen geen gebreken vertonen, die de retroreflectie
      beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.15.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.15.51
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.15.51
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.55
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.15.51
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '15'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 5.15.51
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '15'
      - id: ref3
        bwb_id: BWBR0006746
        artikel: 5.15.51
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '15'
  - number: 5.15.57
    text: |-
      1 Aanhangwagens achter een motorfiets mogen zijn voorzien van:

      a. één mistlicht aan de achterzijde van het voertuig;

      b. één of twee witte retroreflectoren aan de voorzijde van het voertuig;

      c. werklichten.

      2 Aanhangwagens achter een bromfiets mogen zijn voorzien van:

      a. twee richtingaanwijzers aan de achterzijde van het voertuig, dan wel één richtingaanwijzer aan elke zijkant van
      het voertuig;

      b. één of twee remlichten;

      c. één of twee witte retroreflectoren aan de voorzijde van het voertuig.

      3 Aanhangwagens achter motorfietsen en bromfietsen mogen zijn voorzien van extra witte retroreflecterende
      voorzieningen aan de voorzijde, extra niet-driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten
      van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.57
  - number: 5.15.59
    text: |-
      1 De richtingaanwijzers mogen niet anders dan ambergeel stralen.

      2 De remlichten en het mistlicht aan de achterzijde mogen niet anders dan rood stralen.

      3 [Artikel 5.15.55, tweede, derde en vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.15.55
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.15.59
