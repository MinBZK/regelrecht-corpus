    text: |-
      1 Personenauto’s met een verbrandingsmotor, met uitzondering van personenauto’s met een motor die wordt gevoed
      door al dan niet tot vloeistof verdicht gas, moeten voor het verkrijgen van een typegoedkeuring als bedoeld
      in [richtlijn 70/156/EEG](31970L0156) voor toelating tot het verkeer op de weg voldoen aan de in deze afdeling
      vermelde eisen, met uitzondering van de eisen, bedoeld in [artikel 3.2.13][ref1].

      2 Personenauto’s met een andere dan een verbrandingsmotor moeten voor het verkrijgen van een nationale
      typegoedkeuring als bedoeld in artikel 2, tweede lid, van [richtlijn 92/53/EEG](31992L0053) voor toelating tot
      het verkeer op de weg voldoen aan de in deze afdeling vermelde eisen, met uitzondering van de eisen, bedoeld in de
      [artikelen 3.2.12][ref2], [3.2.13, eerste lid][ref3], [3.2.14][ref4], [3.2.15][ref5] en [3.2.16][ref6].


