  - number: 5.13.59
    text: |-
      1 De markeringslichten mogen naar voren niet anders dan wit en naar achteren niet anders dan rood stralen.

      2 De stadslichten en achteruitrijlichten mogen niet anders dan wit of geel stralen.

      3 De zijmarkeringslichten mogen niet anders dan ambergeel stralen. Indien het achterste zijmarkeringslicht
      onderdeel uitmaakt van een rood stralend licht dan wel van een rode retroreflector, mag dit licht rood stralen.

      4 [Artikel 5.13.55, tweede, derde en vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.13.55
