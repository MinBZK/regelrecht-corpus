        afdeling: '14'
  - number: 5.14.64
    text: |-
      Aanhangwagens mogen, met uitzondering van de richtingaanwijzers en de waarschuwingsknipperlichten, niet zijn
      voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.64
  - number: 5.14.65
    text: |-
      Aanhangwagens mogen, onverminderd het in [artikel 30 van het RVV 1990][ref1] bepaalde inzake zwaai-
      en knipperlichten, niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 5.14.51][ref2] en [5.14.57][ref3] is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.14.51
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.14.57
