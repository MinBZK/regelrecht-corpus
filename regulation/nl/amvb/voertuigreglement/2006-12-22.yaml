  - number: 5.13.66
    text: |-
      1 De koppeling van aanhangwagens moet met ingang van 1 januari 2005 voldoen aan de door Onze Minister vastgestelde
      eisen en zijn voorzien van een door hem vastgesteld goedkeuringsmerk.

      2 De koppeling en de trekdriehoek of trekboom van aanhangwagens moeten deugdelijk zijn bevestigd en mogen niet
      gescheurd, gebroken dan wel overmatig gesleten zijn.

      3 De trekdriehoek of trekboom mag niet zijn doorgeroest.

      4 Middenasaanhangwagens die niet zijn voorzien van een losbreekreminrichting, moeten zijn voorzien van een
      hulpkoppeling. De hulpkoppeling moet deugdelijk zijn bevestigd en mag niet vervormd, gescheurd, gebroken dan wel
      overmatig gesleten zijn.

      5 Middenasaanhangwagens die zijn voorzien van een losbreekreminrichting, mogen niet tevens zijn voorzien van een
      hulpkoppeling.

      6 Delen van de koppeling van aanhangwagens mogen tijdens het ontkoppelen, het losbreken of in afgekoppelde toestand
      het wegdek niet kunnen raken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.66
  - number: 5.13.67
    text: |-
      Indien de aanhangwagen is voorzien van een kogelkoppeling,

      a. moet de sluit- en borginrichting goed functioneren;

      b. mogen de onderdelen niet zijn vervormd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.13.67
  - number: 5.14.3
    text: |-
      De langs- en dwarsliggers en chassisversterkingsdelen van het chassisraam, dan wel de daarvoor in de plaats
      tredende delen van de mee- of zelfdragende carrosserie van aanhangwagens mogen:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte van het
      chassisraam of van de mee- of zelfdragende carrosserie in gevaar worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.3
  - number: 5.14.4
    text: |-
      1 De bovenbouw van aanhangwagens moet deugdelijk op het onderstel zijn bevestigd.

      2 De ondersteuning van de laadvloer onderscheidenlijk laadruimte moet deugdelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.4
  - number: 5.14.5
    text: De bedrading van aanhangwagens moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.5
  - number: 5.14.6
    text: |-
      Aanhangwagens mogen:

      a. niet langer zijn dan 12,00 m;

      b. niet breder zijn dan 2,60 m, met uitzondering van aanhangwagens ten behoeve van de landbouw, welke niet breder
      mogen zijn dan 3,00 m;

      c. niet hoger zijn dan 4,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.6
  - number: 5.14.7
    text: |-
      1 De last onder enig wiel van aanhangwagens, voorzien van luchtbanden, mag niet meer bedragen dan 5000 kg.

      2 De last onder enig wiel van aanhangwagens, voorzien van massieve banden, mag niet meer bedragen dan 120 kg per
      centimeter breedte van het loopvlak.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.7
  - number: 5.14.18
    text: |-
      1 De assen van aanhangwagens moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen breuken of scheuren
      vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.18
  - number: 5.14.19
    text: |-
      1 De fuseepennen, -lageringen, -bussen en -kogels van aanhangwagens met een massa van meer dan 750 kg moeten
      deugdelijk zijn bevestigd.

      2 De fuseepennen, -lageringen, -bussen en -kogels alsmede de overige draaipunten van de wielophanging van
      aanhangwagens met een massa van meer dan 750 kg mogen niet te veel speling vertonen.

      3 Indien een gedeelte van de binnenkant van het fuseekogelhuis en van de fuseekogel zichtbaar is doordat de hoes is
      beschadigd of ontbreekt, mag dit gedeelte geen corrosie vertonen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.19
  - number: 5.14.24
    text: |-
      1 De wielen onderscheidenlijk velgen van aanhangwagens mogen geen breuken, scheuren, ondeugdelijk laswerk of
      ernstige vervorming vertonen.

      2 De wielen onderscheidenlijk velgen moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.24
  - number: 5.14.27
    text: |-
      1 Aanhangwagens met een massa van meer dan 750 kg moeten zijn voorzien van banden waarvan het loopvlak niet bestaat
      uit metaal of een materiaal dat voor wat betreft hardheid en vervormbaarheid dezelfde eigenschappen heeft.

      2 Het loopvlak van de banden mag geen metalen elementen bevatten die tijdens het rijden daarbuiten kunnen
      uitsteken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.27
  - number: 5.14.31
    text: |-
      1 Aanhangwagens met een massa van meer dan 3500 kg moeten zijn voorzien van een goed werkende bedrijfsrem.

      2 De onderdelen van de in het eerste bedoelde reminrichting moeten:

      a. deugdelijk zijn bevestigd met de daarvoor bestemde bevestigings- en borgmiddelen;

      b. niet in ernstige mate door corrosie zijn aangetast;

      c. niet zijn beschadigd, gescheurd of gebroken;

      d. geen inwendige of uitwendige lekkage vertonen.

      3 Remslangen mogen:

      a. niet in ernstige mate zijn misvormd;

      b. niet langs andere voertuigdelen schuren;

      c. geen zodanige beschadigingen vertonen dat het wapeningsmateriaal zichtbaar is.

      4 De remtrommel of remschijf mag tijdens het remmen niet worden geraakt door delen die zijn bestemd als drager of
      bevestigingsmiddel van remvoering.

      5 De noodzakelijke bewegingsvrijheid van de remonderdelen mag niet worden beperkt.

      6 Indien de oplooprem is voorzien van een automatische blokkering ten behoeve van het achteruitrijden, moet deze
      goed functioneren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.31
  - number: 5.14.41
    text: Het slot en de scharnieren van de deuren en laadbakkleppen van aanhangwagens moeten een goede sluiting waarborgen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.41
  - number: 5.14.48
    text: |-
      1 Aanhangwagens mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor andere
      weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen van aanhangwagens, die in geval van botsing
      het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn afgeschermd.

      3 Het bepaalde in het eerste lid en tweede lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m
      boven het wegdek bevinden.

      4 De wielen onderscheidenlijk banden van aanhangwagens mogen niet aanlopen.

      5 Geen deel van de buitenzijde van de aanhangwagen mag zodanig zijn bevestigd, beschadigd, versleten of door
      corrosie zijn aangetast, dat gevaar bestaat voor losraken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.48
  - number: 5.14.51
    text: |-
      Aanhangwagens moeten zijn voorzien van:

      a. twee stadslichten indien het voertuig breder is dan 1,60 m;

      b. twee richtingaanwijzers aan de achterzijde van het voertuig;

      c. twee achterlichten;

      d. twee remlichten;

      e. twee driehoekige rode retroreflectoren aan de achterzijde van het voertuig;

      f. twee witte retroreflectoren aan de voorzijde van het voertuig;

      g. niet-driehoekige ambergele retroreflectoren aan elke zijkant van het voertuig;

      h. met ingang van 1 januari 2005, twee markeringslichten aan de voorzijde en twee aan de achterzijde van het
      voertuig, indien het voertuig breder is dan 2,10 m;

      i. een rode retroreflector in de vorm van een afgeknotte driehoek.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.51
  - number: 5.14.53
    text: |-
      1 De stadslichten mogen niet anders dan wit stralen.

      2 De richtingaanwijzers en de remlichten mogen niet anders dan rood of ambergeel stralen.

      3 De achterlichten mogen niet anders dan rood stralen.

      4 De markeringslichten mogen naar voren niet anders dan wit, en naar achteren niet anders dan rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.53
  - number: 5.14.54
    text: |-
      1 De stadslichten moeten aan de voorzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,15 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,50 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig niet mogelijk is, mogen de stadslichten op een hoogte van meer dan 1,50 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      2 De richtingaanwijzers moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,50 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig niet mogelijk is, mogen de richtingaanwijzers op een hoogte van meer dan 1,50 m
      doch niet meer dan 2,10 m boven het wegdek zijn aangebracht.

      3 De achterlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m, dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,30 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,50 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig niet mogelijk is, mogen de achterlichten op een hoogte van meer dan 1,50 m doch
      niet meer dan 2,10 m boven het wegdek zijn aangebracht.

      4 De remlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m, dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,30 m;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,50 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig niet mogelijk is, mogen de remlichten op een hoogte van meer dan 1,50 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      5 De driehoekige rode retroreflectoren moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m, dan wel niet minder dan 0,40 m indien de grootste breedte van het voertuig minder bedraagt dan 1,30 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek; indien zulks niet mogelijk is
      zonder gebruikmaking van bevestigingsmiddelen die gemakkelijk kunnen worden beschadigd, mogen de retroreflectoren
      op een hoogte van meer dan 0,90 m doch niet meer dan 1,20 m boven het wegdek zijn aangebracht.

      6 De witte retroreflectoren aan de voorzijde van het voertuig moeten zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een onderlinge afstand van niet minder dan 0,60 m, dan wel niet minder dan 0,40 m indien de grootste breedte
      van het voertuig minder bedraagt dan 1,30 m;

      c. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig niet mogelijk is, mogen de retroreflectoren op een hoogte van meer dan 0,90 m doch
      niet meer dan 1,50 m boven het wegdek zijn aangebracht.

      7 De niet-driehoekige ambergele retroreflectoren aan elke zijkant en het voertuig moeten:

      a. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek zijn aangebracht. Indien zulks
      in verband met de constructie van het voertuig niet mogelijk is, mogen de retroreflectoren op een hoogte van meer
      dan 0,90 m doch niet meer dan 1,50 m boven het wegdek zijn aangebracht;

      b. zodanig zijn aangebracht dat:

      1°. één retroreflector zich bevindt in het middelste derde gedeelte van de aanhangwagen;

      2°. de onderlinge afstand tussen de retroreflectoren niet meer dan 3,00 m bedraagt;

      3°. de afstand van de voorste retroreflector tot de voorzijde van de aanhangwagen niet meer dan 3,00 m;

      4°. de afstand van de achterste retroreflector tot de achterzijde van de aanhangwagen niet meer dan 1,00 m
      bedraagt, waarbij het voertuiggedeelte boven de 2,00 m buiten beschouwing wordt gelaten in de afstand tot de
      achterzijde.

      8 De markeringslichten moeten zijn aangebracht:

      a. zo hoog mogelijk boven het wegdek;

      b. zo dicht mogelijk bij het punt van de grootste breedte van het voertuig.

      9 De rode retroreflector in de vorm van een afgeknotte driehoek moet aan de achterzijde van het voertuig zijn
      aangebracht:

      a. in het midden van het voertuig dan wel links van het midden;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek. Indien zulks niet mogelijk
      is zonder gebruikmaking van bevestigingsmiddelen die gemakkelijk kunnen worden beschadigd, mag de retroreflector op
      een hoogte van meer dan 0,90 m doch niet meer dan 1,60 m boven het wegdek zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.54
  - number: 5.14.55
    text: |-
      1 De in [artikel 5.14.51][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig zijn bevestigd.

      5 De in [artikel 5.14.51][ref2] bedoelde lichten en retroreflectoren mogen niet zijn afgeschermd.

      6 De retroreflectoren mogen geen gebreken vertonen, die de retroreflectie beïnvloeden.

      7 De rode retroreflector in de vorm van een afgeknotte driehoek moet zijn voorzien van een door Onze Minister
      bekendgemaakt goedkeuringsmerk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.14.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.14.51
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.14.55
