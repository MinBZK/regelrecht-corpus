  - number: 5.6.12
    text: |-
      1 De accu van bromfietsen moet deugdelijk zijn bevestigd.

      2 De elektrische bedrading van bromfietsen moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.12
  - number: 5.6.13
    text: De motor van bromfietsen moet deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.13
  - number: 5.6.15
    text: |-
      Bromfietsen, die na 31 december 2006 in gebruik zijn genomen, moeten zijn voorzien van een goed werkende
      snelheidsmeter, die ook bij nacht voor de bestuurder goed afleesbaar is.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.15
  - number: 5.6.16
    text: De voor de transmissie noodzakelijke onderdelen van bromfietsen moeten deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.16
  - number: 5.6.18
    text: |-
      1 De assen van bromfietsen moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen breuken of scheuren
      vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn bevestigd, beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.18
  - number: 5.6.19
    text: |-
      1 De fuseepennen, -lageringen, -bussen en -kogels van bromfietsen moeten deugdelijk zijn bevestigd.

      2 Stofhoezen van fuseekogels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de hoezen
      niet meer afdichten.

      3 De fuseepennen, -lageringen, -bussen en -kogels alsmede de overige draaipunten van de wielophanging mogen niet te
      veel speling vertonen.

      4 Indien een gedeelte van de binnenkant van het fuseekogelhuis en van de fuseekogel zichtbaar is doordat de hoes is
      beschadigd of ontbreekt, mag dit gedeelte geen corrosie vertonen.

      5 Onze Minister stelt regels vast omtrent het derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.19
  - number: 5.6.20
    text: |-
      1 Van bromfietsen met drie of vier wielen:

      a. mogen de wiellagers niet te veel speling vertonen;

      b. mogen verschijnselen van slijtage of beschadiging niet hoorbaar of voelbaar zijn.

      2 Onze Minister stelt regels vast omtrent het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.20
  - number: 5.6.24
    text: |-
      De wielen, alsmede de onderdelen daarvan, van bromfietsen mogen geen breuken, scheuren of ernstige vervorming
      vertonen. Onderdelen mogen niet loszitten of ontbreken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.24
  - number: 5.6.27
    text: |-
      1 De wielen van bromfietsen moeten zijn voorzien van luchtbanden.

      2 De banden mogen geen beschadigingen vertonen waarbij het karkas zichtbaar is.

      3 De banden mogen geen uitstulpingen vertonen.

      4 Over de gehele omtrek en breedte van het loopvlak van de banden moet profilering aanwezig zijn.

      5 Het loopvlak van de banden mag geen metalen elementen bevatten die tijdens het rijden daarbuiten kunnen
      uitsteken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.27
  - number: 5.6.28
    text: |-
      1 Indien de bromfiets is voorzien van een veersysteem, moet dit goed werken.

      2 De onderdelen van het veersysteem mogen geen breuken of scheuren vertonen en moeten deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.28
  - number: 5.6.29
    text: |-
      1 Van bromfietsen met twee wielen:

      a. moeten de voor de overbrenging van de stuurkrachten noodzakelijke onderdelen deugdelijk zijn bevestigd;

      b. moet de voorvork zonder zware punten in het balhoofd kunnen draaien, en

      c. mag de balhoofdlagering geen zichtbare speling vertonen.

      2 Van bromfietsen op drie of vier wielen:

      a. moeten de bestuurde wielen goed reageren op de draaiing van het stuurwiel;

      b. mogen bij draaiing van het stuurwiel tot aan de aanslagen geen weerstanden voelbaar zijn en moeten de wielen
      onderscheidenlijk de banden vrij kunnen draaien;

      c. moeten de voor de overbrenging van de stuurbeweging bestemde onderdelen deugdelijk zijn bevestigd met alle
      daarvoor bestemde bevestigings- en borgmiddelen, mogen geen breuken of scheuren vertonen, mogen niet zijn vervormd
      en mogen niet ernstig door corrosie zijn aangetast;

      d. moeten stofhoezen van het stuurhuis en de stuurkogels deugdelijk zijn bevestigd en mogen niet zodanig zijn
      beschadigd dat de hoezen niet meer afdichten;

      e. moeten kruiskoppelingen een zichtbaar spelingvrije overbrenging kunnen bewerkstelligen;

      f. mogen flexibele koppelingen niet in ernstige mate zijn gescheurd en de vulkanisatie mag niet in ernstige mate
      zijn losgeraakt;

      g. mogen de verbindingen in het stangenstelsel niet te veel speling vertonen; en

      h. mag, indien een gedeelte van de binnenkant van het stuurkogelhuis en van de stuurkogel zichtbaar is doordat de
      hoes is beschadigd of ontbreekt, dit gedeelte geen corrosie vertonen.

      3 Onze Minister stelt regels vast met betrekking tot het tweede lid, onderdelen c, f en g.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.29
  - number: 5.6.31
    text: |-
      1 Bromfietsen moeten zijn voorzien van een reminrichting waarvan de onderdelen:

      a. deugdelijk zijn bevestigd met de daarvoor bestemde bevestigings- en borgmiddelen;

      b. niet in ernstige mate door corrosie zijn aangetast;

      c. niet zijn beschadigd, gescheurd of gebroken;

      d. geen inwendige of uitwendige lekkage vertonen.

      2 Het rempedaal onderscheidenlijk de remhandel mag geen zodanige slag maken dat het pedaal dan wel de handel tot
      een aanslag kan worden ingetrapt of ingedrukt.

      3 Het oppervlak van het rempedaal moet stroef zijn.

      4 Remslangen mogen:

      a. niet in ernstige mate zijn misvormd;

      b. niet langs andere voertuigdelen schuren;

      c. geen zodanige beschadigingen vertonen dat het wapeningsmateriaal zichtbaar is.

      5 Remkabels mogen niet zijn gerafeld en moeten goed gangbaar zijn.

      6 De remtrommel of remschijf mag tijdens het remmen niet worden geraakt door delen die zijn bestemd als drager of
      bevestigingsmiddel van remvoering.

      7 De noodzakelijke bewegingsvrijheid van de remonderdelen mag niet worden beperkt.

      8 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.31
  - number: 5.6.38
    text: |-
      1 Bromfietsen op twee wielen, in gebruik genomen na 31 december 2006, moeten zijn voorzien van twee bedrijfsremmen
      waarvan de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg

      a. bij gebruik van de voorwielrem ten minste 2,5 m/s2 bedraagt;

      b. bij gebruik van de achterwielrem ten minste 2,4 m/s2 bedraagt, en

      c. bij gebruik van de voorwielrem en de achterwielrem tezamen ten minste 4,0 m/s2 bedraagt.

      2 Bromfietsen op twee wielen in gebruik genomen voor 1 januari 2007 moeten zijn voorzien van twee bedrijfsremmen
      met onafhankelijke bedieningsorganen en overbrengingen, waarvan de één tenminste op het voorwiel en de ander
      tenminste op het achterwiel werkt. De remvertraging van de voorwielrem en de achterwielrem tezamen moet op een
      droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 4,0 m/s2 bedragen.

      3 Bromfietsen op meer dan twee wielen moeten zijn voorzien van een bedrijfsreminrichting waarmee, bij bediening
      van de voor- en achterrem tezamen, hetzij bij bediening van een gezamenlijke reminrichting, de remvertraging op een
      droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 4,0 m/s2 bedraagt.

      4 De in het derde lid bedoelde bedrijfsreminrichting moet op alle wielen werken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.38
  - number: 5.6.39
    text: |-
      Van bromfietsen op meer dan twee wielen moet één van de remmen in aangezette toestand kunnen worden vastgezet,
      tenzij een afzonderlijke vastzetinrichting aanwezig is.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.39
  - number: 5.6.41
    text: |-
      1 Windschermen en stroomlijnkappen van bromfietsen mogen de bediening van de stuurinrichting, de koppeling en de
      remmen niet belemmeren.

      2 Windschermen, stroomlijnkappen en permanent aangebrachte inrichtingen om lading mee te kunnen vervoeren, moeten
      deugdelijk zijn bevestigd.

      3 De deuren van bromfietsen moeten goed sluiten. De deuren die direct toegang geven tot de personenruimte, moeten
      op normale wijze vanaf de binnenzijde of vanaf de buitenzijde kunnen worden geopend.

      4 Het slot en de scharnieren van de motorkap of het kofferdeksel aan de voorzijde van het voertuig moeten een goede
      sluiting waarborgen.

      5 De bevestiging van de scharnieren van de deuren, de motorkap en het kofferdeksel mag niet in ernstige mate door
      corrosie zijn aangetast.

      6 Onze Minister stelt regels vast omtrent het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.41
  - number: 5.6.43
    text: |-
      1 Bromfietsen met een voorruit, die na 31 december 2006 in gebruik zijn genomen, moeten zijn voorzien van een goed
      werkende ruitenwisserinstallatie die de bestuurder voldoende uitzicht geeft.

      2 Bromfietsen met een voorruit, die na 31 december 2006 in gebruik zijn genomen, moeten zijn voorzien van een goed
      werkende ruitensproeierinstallatie.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.43
  - number: 5.6.45
    text: |-
      1 Bromfietsen, die na 31 december 2006 in gebruik zijn genomen, moeten zijn voorzien van een linker buitenspiegel.

      2 In afwijking van het eerste lid moeten bromfietsen op meer dan twee wielen met gesloten carrosserie, die na
      31 december 2006 in gebruik zijn genomen, zijn voorzien van een binnenspiegel en een linker buitenspiegel dan wel
      zijn voorzien van een linker en een rechter buitenspiegel.

      3 De spiegels moeten deugdelijk zijn bevestigd.

      4 Het spiegelglas van de verplichte spiegels mag geen verschijnselen van breuk vertonen en mag niet in ernstige
      mate zijn verweerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.45
  - number: 5.6.46
    text: |-
      1 De zitplaats of zitplaatsen van bromfietsen moeten deugdelijk zijn bevestigd.

      2 Voetsteunen moeten deugdelijk zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.46
  - number: 5.6.47
    text: |-
      1 Bromfietsen op meer dan twee wielen met een gesloten carrosserie en een ledige massa van meer dan 250 kg, die
      na 31 december 2006 in gebruik zijn genomen, moeten zijn voorzien van autogordels voor alle naar voren gerichte
      zitplaatsen.

      2 Het eerste lid is niet van toepassing op klapstoelen.

      3 De autogordels moeten deugdelijk zijn bevestigd en mogen niet zodanig zijn beschadigd dat de sterkte ervan in
      gevaar wordt gebracht. Onze Minister stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging.

      4 De autogordels moeten zijn voorzien van een goed werkende sluiting en een goed werkende blokkering.
      Oprolmechanismen moeten zodanig functioneren dat de gordel aanligt na het omdoen ervan.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.47
  - number: 5.6.48
    text: |-
      1 Bromfietsen mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor andere
      weggebruikers kunnen opleveren.

      2 De wielen onderscheidenlijk banden van bromfietsen mogen niet aanlopen.

      3 Geen deel aan de buitenzijde van een bromfiets mag zodanig zijn bevestigd, beschadigd, versleten of door corrosie
      zijn aangetast, dat gevaar bestaat voor losraken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.48
  - number: 5.6.51
    text: |-
      1 Bromfietsen op twee wielen moeten zijn voorzien van:

      a. een of twee dimlichten;

      b. een of twee achterlichten;

      c. een niet-driehoekige rode retroreflector aan de achterzijde van het voertuig;

      d. een of twee remlichten indien de bromfiets een vermogen van meer dan 0,5 kW en een maximumsnelheid van meer dan
      25 km/h heeft en in gebruik is genomen na 31 december 2006.

      2 Bromfietsen op drie of vier wielen moeten zijn voorzien van:

      a. een of twee dimlichten indien de breedte van het voertuig 1,30 m of minder bedraagt en twee dimlichten indien de
      breedte van het voertuig meer dan 1,30 m bedraagt;

      b. een of twee stadslichten indien de breedte van het voertuig 1,30 m of minder bedraagt en twee stadslichten
      indien de breedte van het voertuig meer dan 1,30 m bedraagt;

      c. twee richtingaanwijzers aan de voorzijde en twee richtingaanwijzers aan de achterzijde indien het voertuig is
      voorzien van een gesloten carrosserie;

      d. een of twee achterlichten indien de breedte van het voertuig 1,30 m of minder bedraagt en twee achterlichten
      indien de breedte van het voertuig meer dan 1,30 m bedraagt;

      e. een of twee remlichten indien de breedte van het voertuig 1,30 m of minder bedraagt en twee remlichten indien de
      breedte van het voertuig meer dan 1,30 m bedraagt;

      f. een of twee niet-driehoekige rode achterretroreflectoren indien de breedte van het voertuig 1,30 m of minder
      bedraagt en twee niet driehoekige rode achterretroreflectoren indien de breedte van het voertuig meer dan 1,30
      m bedraagt;

      g. vier ambergele retroreflectoren aan de trappers voor zover de bromfiets is voorzien van niet-intrekbare
      trappers.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.51
  - number: 5.6.52
    text: |-
      Zijspanwagens, verbonden aan een bromfiets, moeten zijn voorzien van een niet-driehoekige rode retroreflector,
      aangebracht aan de achterzijde van het voertuig op ten minste 0,25 m en ten hoogste 0,90 m boven het wegdek.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.52
  - number: 5.6.53
    text: |-
      1 De dimlichten en stadslichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers mogen naar voren niet anders dan ambergeel of wit en naar achteren niet anders dan
      ambergeel of rood stralen.

      3 De achterlichten mogen niet anders dan rood stralen.

      4 De remlichten mogen niet anders dan rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.53
  - number: 5.6.55
    text: |-
      1 De in de [artikelen 5.6.51][ref1] en [5.6.52][ref2] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt, dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig zijn bevestigd.

      5 De in de [artikelen 5.6.51][ref3] en [5.6.52][ref4] bedoelde lichten en retroreflectoren, voorzover het het
      lichtdoorlatend gedeelte betreft, mogen ten hoogste een vierde deel zijn afgeschermd.

      6 De in de [artikelen 5.6.51][ref5] en [5.6.52][ref6] bedoelde retroreflectoren mogen geen gebreken vertonen die de
      retroreflectie beïnvloeden.

      7 Remlichten van bromfietsen in gebruik genomen na 31 december 2006 moeten werken bij bediening van zowel de
      achterwielrem als de voorwielrem.


