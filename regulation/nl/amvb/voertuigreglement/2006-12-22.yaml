  - number: 5.4.62
    text: |-
      Het ingeschakeld zijn van het mistlicht aan de achterzijde van het voertuig moet door middel van een controlelampje
      dan wel door de stand van de schakelaar aan de bestuurder kenbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.62
  - number: 5.4.64
    text: |-
      1 Motorfietsen mogen, met uitzondering van groot licht, niet zijn voorzien van verblindende verlichting.

      2 Motorfietsen mogen, met uitzondering van de richtingaanwijzers en de waarschuwingsknipperlichten, niet zijn
      voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.64
  - number: 5.4.65
    text: |-
      Motorfietsen mogen, onverminderd het in de [artikelen 29][ref1] en [30 van het RVV 1990][ref2] bepaalde inzake
      zwaai- en knipperlichten, niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 5.4.51][ref3], [5.4.52][ref4], [5.4.57][ref5] en [5.4.58][ref6] is voorgeschreven of toegestaan.


