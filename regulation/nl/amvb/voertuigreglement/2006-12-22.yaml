articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende regelingen wordt, voor zover niet anders is bepaald, verstaan onder:

      a. 24 GHz-kortbereikradarapparatuur: 24 GHz-kortbereikradarapparatuur als bedoeld in bijlage I, onder punt 2.1.13,
      van [richtlijn 72/245/EEG](31972L0245);

      a1. aanhangwagen: voertuig dat is bestemd om aan een motorrijtuig te worden gekoppeld, met inbegrip van een
      oplegger; als aanhangwagen wordt voorts aangemerkt een dolly met een oplegger;

      b. achterlicht: licht dat, van de achterzijde gezien, de aanwezigheid van het voertuig kenbaar maakt en een
      aanwijzing is voor de breedte van het voertuig;

      c. achteruitrijlicht: licht, bestemd voor het verlichten van de weg achter het voertuig en voor het waarschuwen van
      de overige weggebruikers dat het voertuig achteruit rijdt of achteruit gaat rijden;

      d. afsleepdolly: aanhangwagen, bestemd voor het dragen van één van de assen van een voertuig;

      d1: 'airbag: een inrichting in motorvoertuigen, gemonteerd ter aanvulling van autogordels, die een systeem bevat'
      dat bij een ernstige botsing van het voertuig automatisch een flexibel omhulsel opblaast dat door samendrukking van
      het daarin opgesloten gas de ernst van het contact van een of meer delen van het lichaam van een inzittende van het
      voertuig met de binneninrichting van de passagiersruimte beperkt;

      e. ambulance: motorrijtuig, bestemd om te worden gebruikt voor ambulancevervoer als bedoeld in de
      [Wet ambulancevervoer][ref1] (*Stb.* 1971, 369);

      f. as: geheel van aslichaam met inbegrip van wielgeleidingselementen;

      f1. ashefinrichting: een op een voertuig vast aangebrachte inrichting om de belasting op de as of assen naar gelang
      van de beladingstoestand van het voertuig te verlagen of te verhogen;

      g. asstel: combinatie van twee of meer assen, evenwijdig gelegen op een onderlinge afstand van minder dan 1,80 m;

      g1: 'autogordel: een geheel van banden met sluiting, verstelinrichtingen en bevestigingselementen dat in een'
      motorvoertuig kan worden bevestigd en zodanig is ontworpen dat de kans op verwondingen voor de gebruiker bij
      botsing of plotselinge vertraging van het voertuig wordt verminderd doordat het de bewegingsmogelijkheid van het
      lichaam van de gebruiker beperkt en dat mede omvat alle onderdelen die energie kunnen opnemen of waarmee de gordel
      wordt ingetrokken;

      g2. autonome aanhangwagen: aanhangwagen met minimaal twee assen, waarvan in ieder geval één gestuurd is, en die is
      uitgerust met een beweegbare trekinrichting die het trekkend voertuig verticaal met minder dan 100 kg belast; als
      autonome aanhangwagen wordt voorts aangemerkt een gekoppelde dolly met een oplegger;

      h. bedrijfsauto: motorrijtuig op vier of meer wielen, niet zijnde een motorrijtuig met beperkte snelheid, een
      landbouw- of bosbouwtrekker een motorrijtuig op vier wielen als bedoeld in onderdeel *q* of een vierwielige
      bromfiets, en

      1. ingericht voor het vervoer van personen, met meer dan acht zitplaatsen, de bestuurderszitplaats niet
      meegerekend, of

      2. ingericht voor het vervoer van goederen, of

      3. ingericht voor het uitvoeren van andere werkzaamheden, of

      4. ingericht als kampeerauto;

      in ieder geval wordt als bedrijfsauto aangemerkt een voertuig dat blijkens het afgegeven kentekenbewijs als
      bedrijfsauto is aangeduid;

      h1. begrafeniswagen: motorrijtuig, bestemd en speciaal uitgerust voor het vervoer van overledenen;

      i. bermlicht: licht, bestemd voor het verlichten van de berm rechts voor het voertuig;

      j.

      k. bestuurde as: as die rechtstreeks door middel van de stuurinrichting door de bestuurder kan worden bediend;

      l. bestuurd asstel: asstel dat rechtstreeks door middel van de stuurinrichting door de bestuurder kan worden
      bediend;

      l1: 'bevestigingspunten: de delen van de voertuigcarrosserie of van de zitplaatsconstructie of andere delen van het'
      voertuig waaraan autogordels moeten worden vastgemaakt;

      m. bromfiets:

      a. motorrijtuig op twee wielen, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h,
      uitgerust met een verbrandingsmotor met een cilinderinhoud van niet meer dan 50 cm3 of een elektromotor met een
      nominaal continu maximumvermogen van niet meer dan 4 kW, niet zijnde een gehandicaptenvoertuig;

      b. motorrijtuig op drie wielen, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h,
      niet zijnde een gehandicaptenvoertuig, uitgerust met:

      1°. een motor met elektrische ontsteking met een cilinderinhoud van niet meer dan 50 cm3,

      2°. een motor met inwendige verbranding en een netto maximumvermogen van niet meer dan 4 kW voor andere dan onder
      1° genoemde motoren, of

      3°. een elektromotor met een nominaal continu maximumvermogen van niet meer dan 4 kW; dan wel

      c. motorrijtuig op vier wielen, niet zijnde een gehandicaptenvoertuig, met een door de constructie bepaalde
      maximumsnelheid van niet meer dan 45 km/h en een ledige massa van minder dan 350 kg, de massa van de batterijen in
      elektrische voertuigen niet inbegrepen, uitgerust met:

      1°. een motor met elektrische ontsteking met een cilinderinhoud van niet meer dan 50 cm3,

      2°. een motor met inwendige verbranding en een netto maximumvermogen van niet meer dan 4 kW voor andere dan onder
      1° genoemde motoren, of

      3°. een elektromotor met een nominaal continu maximumvermogen van niet meer dan 4 kW.

      In ieder geval wordt als bromfiets aangemerkt een voertuig dat blijkens het afgegeven kentekenbewijs als bromfiets
      is aangeduid;

      n. bus: bedrijfsauto, ingericht en blijkens het kentekenbewijs bestemd voor het vervoer van personen, met meer dan
      acht zitplaatsen de bestuurderszitplaats niet meegerekend; als bus wordt in ieder geval aangemerkt een bus van één
      van de volgende categorieën:

        - klasse I: categorie bussen met een capaciteit van meer dan 22 passagiers, de bestuurder niet meegerekend, gebouwd
      met ruimte voor staande passagiers, zodat passagiers vaak kunnen in- en uitstappen;
        - klasse II: categorie bussen met een capaciteit van meer dan 22 personen, de bestuurder niet meegerekend,
      voornamelijk gebouwd voor het vervoer van zittende passagiers en ontworpen voor het vervoer van staande passagiers
      in het gangpad of op een oppervlak dat niet groter is dan de ruimte voor twee dubbele zitplaatsen;
        - klasse III: categorie bussen met een capaciteit van meer dan 22 personen, de bestuurder niet meegerekend,
      uitsluitend gebouwd voor het vervoer van zittende passagiers;
        - klasse A: categorie bussen met een capaciteit van ten hoogste 22 personen, de bestuurder niet meegerekend,
      gebouwd voor het vervoer van staande passagiers en tevens voorzien van zitplaatsen;
        - klasse B: categorie bussen met een capaciteit van ten hoogste 22 personen, de bestuurder niet meegerekend,
      gebouwd voor het vervoer van zittende passagiers en zonder voorzieningen voor staande passagiers.

      n1. certificaat van overeenstemming: document opgesteld door de fabrikant van een voertuig of van een niet-
      oorspronkelijke technische eenheid of onderdeel van een voertuig, die houder is van een typegoedkeuring als
      bedoeld in artikel 2 van [richtlijn 70/156/EEG](31970L0156), in artikel 4, eerste lid, aanhef en onderdeel a,
      van [richtlijn 92/61/EEG](31992L0061) of in artikel 4, eerste lid, aanhef en onderdeel a, van [richtlijn 2002/24/
      EG](32002L0024) voor dat type voertuig of dat type niet-oorpronkelijke technische eenheid of onderdeel, waaruit
      blijkt dat eerstbedoeld voertuig of niet-oorspronkelijke technische eenheid of onderdeel overeenstemt met het type
      waarvoor deze goedkeuring is verleend;

      n1a. CNG-installatie: het geheel van gemonteerde onderdelen dat het mogelijk maakt om als brandstof voor de
      voortstuwingsmotor gebruik te maken van Compressed Natural Gas (CNG);

      n2. contourmarkering: retroreflecterende belijning, aangebracht aan de zijkant of aan de achterkant van een
      voertuig en bestemd om de contouren van het voertuig beter kenbaar te maken.

      n3. dagrijlicht: een licht dat voorwaarts gericht is en wordt gebruikt om het voertuig tijdens het overdag rijden
      beter zichtbaar te maken.

      o. dimlicht: licht waarmee de weg vóór het voertuig wordt verlicht zonder dat hierdoor andere weggebruikers worden
      verblind of gehinderd;

      p. dolly: aanhangwagen, bestemd voor het dragen van de voorzijde van een oplegger dan wel een deel van in de lengte
      ondeelbare lading;

      q. driewielig motorrijtuig: motorrijtuig op drie symmetrisch geplaatste wielen, met een door de constructie
      bepaalde maximum snelheid van meer dan 45 km/h of uitgerust met een verbrandingsmotor met een cilinderinhoud
      van meer dan 50 cm3, niet zijnde een motorrijtuig met beperkte snelheid, een landbouw- of bosbouwtrekker of een
      gehandicaptenvoertuig; onder driewielig motorrijtuig wordt mede verstaan een vierwielig motorrijtuig met een motor
      met een netto maximum vermogen van ten hoogste 15 kW, en met een ledige massa van ten hoogste 400 kg of 550 kg voor
      voertuigen gebruikt in het goederenvervoer, exclusief de massa van de batterijen in elektrische voertuigen, niet
      zijnde een vierwielig motorrijtuig als bedoeld in onderdeel m;

      q1. EG-goedkeuringsmerk: goedkeuringsmerk als bedoeld in artikel 8 van [richtlijn 92/61/EEG](31992L0061) of artikel
      8 van [richtlijn 2002/24/EG](32002L0024);

      q2. fabrikant: persoon of organisatie die verantwoordelijk is voor alle aspecten van de goedkeuringsprocedure en
      die instaat voor de overeenstemming van de productie;

      q3. frontbeschermingsinrichting: een afzonderlijke constructie die bedoeld is om het buitenoppervlak boven of onder
      de tot de originele uitrusting van het voertuig behorende bumper bij een botsing met een object te beschermen, met
      dien verstande dat hieronder niet worden begrepen constructies met een massa van minder dan 0,5 kg die uitsluitend
      bedoeld zijn ter bescherming van de lichten;

      q4. Geconditioneerd voertuig: voertuig waarvan de vaste of mobiele bovenbouw speciaal is ingericht voor het vervoer
      van goederen bij een gecontroleerde temperatuur en waarvan de zijwanden, met inbegrip van de isolatie, ten minste
      45 mm dik zijn;

      r. gelede bus: bus bestaande uit twee of meer vaste delen die blijvend zijn verbonden door een scharnierende
      verbinding, waarover de passagiers zich van het ene deel naar het andere kunnen begeven;

      s. gestuurde as: as die wordt gestuurd door stuurkrachten, veroorzaakt door richtingverandering vanuit het voertuig
      zelf of vanuit het trekkend voertuig;

      t. gestuurd asstel: asstel dat wordt gestuurd door stuurkrachten, veroorzaakt door richtingverandering vanuit het
      voertuig zelf of vanuit het trekkend voertuig;

      u. groot licht: licht dat de weg vóór het voertuig over een grote afstand verlicht;

      v. handwagen met motorvermogen: motorrijtuig, hoofdzakelijk bestemd om te worden bestuurd door een voetganger;

      v1. herbruikbaarheid: mogelijkheid om onderdelen van autowrakken als bedoeld in
      [artikel 1, onderdeel b, van het Besluit beheer autowrakken][ref2] opnieuw te gebruiken voor hetzelfde doel als
      waarvoor zij werden ontworpen;

      w. hoofdgroeven: brede groeven in het middelste gedeelte van het loopvlak van een band, welk gedeelte ongeveer
      drievierde deel van de breedte van het loopvlak inneemt;

      x. gehandicaptenvoertuig: voertuig dat is ingericht voor het vervoer van een gehandicapte, niet breder is dan 1,10
      m en niet is uitgerust met een motor, dan wel waarvan de door de constructie bepaalde maximum snelheid niet meer
      dan 45 km/h bedraagt indien het voertuig is uitgerust met een motor, en niet zijnde een bromfiets;

      x1. inrichting voor indirect zicht: een inrichting om het aan het voertuig grenzende gebied waar te nemen dat
      niet rechtstreeks kan worden waargenomen, zijnde een spiegel, een camera-monitor of een andere inrichting die de
      bestuurder informatie over het indirecte gezichtsveld geeft;

      y. kampeerauto: personenauto of bedrijfsauto, waarvan de constructie woonaccommodatie bevat die ten minste bestaat
      uit de volgende uitrusting:

      1º. zitplaatsen en een tafel,

      2º. slaapaccommodatie die met behulp van de zitplaatsen kan worden gecreëerd,

      3º. kookgelegenheid en

      4º. opbergfaciliteiten,

      welke vast in de woonafdeling zijn bevestigd, met dien verstande dat de tafel zodanig mag zijn ontworpen dat zij
      gemakkelijk kan worden verwijderd;

      z. kermis- en circusvoertuig: voertuig, niet zijnde een voertuig op rupsbanden, dat wordt gebruikt voor het kermis-
      of circusbedrijf;

      z1: 'kinderbeveiligingssysteem: een geheel van onderdelen, eventueel bestaande uit een combinatie van riemen of'
      flexibele componenten met een sluiting, verstelinrichtingen en bevestigingselementen, soms tevens voorzien van
      een zitje of botsingsscherm, dat kan worden bevestigd aan een motorvoertuig, met het oogmerk de kans op verwonding
      van de gebruiker bij een botsing of een abrupte vertraging van het voertuig te verminderen doordat het de
      bewegingsmogelijkheid voor het lichaam van de gebruiker beperkt;

      z2: 'klapstoel: extra zitplaats om bij gelegenheid te worden gebruikt en die gewoonlijk is weggeklapt.'

      aa. lading: alle personen, dieren, goederen, lastdragers, alsmede zonder gebruik van gereedschap van het voertuig
      los te nemen laad- en losinrichtingen en voertuiguitrustingen, het reservewiel daaronder niet begrepen;

      ab. landbouw- of bosbouwtrekker: motorrijtuig op wielen of rupsbanden, met ten minste twee assen en een door de
      constructie bepaalde maximumsnelheid van niet minder dan 6 km/h, die voornamelijk voor tractiedoeleinden is bestemd
      en in het bijzonder is ontworpen voor het trekken, duwen, dragen of in beweging brengen van bepaalde verwisselbare
      uitrustingsstukken die voor gebruik in de land- of bosbouw zijn bestemd, of voor het trekken van aanhangwagens
      voor de land- of bosbouw, welk motorrijtuig kan zijn ingericht om een lading te vervoeren voor landbouw- of
      bosbouwdoeleinden of kan worden uitgerust met zitplaatsen voor meerijders;

      ab1. landbouw- of bosbouwtrekker categorie T1: landbouw- of bosbouwtrekker op wielen met een door de constructie
      bepaalde maximumsnelheid van niet meer dan 40 km/h, met een minimumspoorbreedte van de zich het dichtst bij de
      bestuurder bevindende as van niet minder dan 1150 mm, met een lege massa in rijklare toestand van meer dan 600 kg
      en met een vrije hoogte boven het wegdek van ten hoogste 1000 mm;

      ab2. landbouw- of bosbouwtrekker categorie T2: landbouw- of bosbouwtrekker op wielen met een door de constructie
      bepaalde maximumsnelheid van niet meer dan 40 km/h, met een minimumspoorbreedte van minder dan 1150 mm, met een
      lege massa in rijklare toestand van meer dan 600 kg en met een vrije hoogte boven het wegdek van ten hoogste
      600 mm, met dien verstande dat wanneer echter de waarde van de hoogte van het zwaartepunt van de landbouw- of
      bosbouwtrekker – ten opzichte van het wegdek gemeten –, gedeeld door het gemiddelde van de minimumspoorbreedten van
      elke as, meer dan 0,90 bedraagt, de door de constructie bepaalde maximumsnelheid beperkt is tot 30 km/h;

      ab3. landbouw- of bosbouwtrekker categorie T3: landbouw- of bosbouwtrekker op wielen met een door de constructie
      bepaalde maximumsnelheid van niet meer dan 40 km/h, met een lege massa in rijklare toestand van ten hoogste 600 kg;

      ab4. landbouw- of bosbouwtrekker categorie T5: landbouw- of bosbouwtrekker op wielen met een door de constructie
      bepaalde maximumsnelheid van meer dan 40 km/h;

      ac. lastdrager: constructie, met inbegrip van hulpmiddelen, die aan de bumper, op de trekhaak of op het dak van een
      personenauto, bedrijfsauto met een toegestane maximum massa van niet meer dan 3500 kg, of driewielig motorrijtuig
      is aangebracht en bestemd is voor het vervoer van goederen;

      ad. ledige massa: massa van het voertuig, in bedrijfsvaardige staat, met inbegrip van een half gevulde
      brandstoftank, reservedelen en gereedschappen, die tot de normale uitrusting behoren, maar zonder lading en zonder
      de bestuurder en andere personen, die met het voertuig worden vervoerd, met dien verstande dat in afwijking hiervan
      voor motorfietsen, driewielige motorrijtuigen en bromfietsen, die in gebruik zijn genomen na 16 juni 1999, de
      ledige massa wordt bepaald met een lege brandstoftank;

      ad1. lege massa in rijklare toestand: massa van een rijklare landbouw- of bosbouwtrekker met inbegrip van de
      kantelbeveiligingsinrichting, zonder facultatieve accessoires, maar met koelvloeistof, smeermiddelen, brandstof,
      outillage en bestuurder;

      ad2. lijnmarkering: retroreflecterende belijning aangebracht aan de zijkant of aan de achterkant van een voertuig
      en bestemd om de totale lengte, dan wel totale breedte van het voertuig kenbaar te maken.

      ae. loopvlak: deel van de band dat gemeten symmetrisch ten opzichte van het midden, 50 mm minder bedraagt dan de
      breedte in de maataanduiding van de band;

      ae1. LPG-installatie: het geheel van gemonteerde onderdelen dat het mogelijk maakt om als brandstof voor de
      voortstuwingsmotor gebruik te maken van Liquefied Petroleum Gas (LPG);

      af. luchtband: band waarin zich in normale, bedrijfsvaardige toestand gas bevindt onder een hogere spanning dan
      de atmosferische;

      ag. markeringslicht: licht dat op het breedste punt van het voertuig zo hoog mogelijk is aangebracht, waardoor
      duidelijk de totale breedte van het voertuig wordt aangegeven;

      ah. massa in bedrijfsklare toestand: massa van het voertuig met carrosserie, in bedrijfsklare toestand, met
      inbegrip van koelvloeistof, smeermiddelen, brandstof, reservewiel, gereedschap en bestuurder; voor het vaststellen
      van de massa moet de tank voor 90% zijn gevuld en wordt het gewicht van de bestuurder op 75 kg gesteld;

      ai. massieve band: band zonder luchtkamers, geheel vervaardigd van een elastisch materiaal;

      aj. mechanische koppelinrichting: alle onderdelen en inrichtingen op onderstellen, dragende gedeelten van de
      carrosserie en het chassis van voertuigen, waarmee het trekkend voertuig en het getrokken voertuig met elkaar
      kunnen worden verbonden; tevens behoren hiertoe vaste of demontabele onderdelen voor de bevestiging, afstelling of
      het gebruik van de bovengenoemde koppelinrichtingen;

      ak. metalen band: band waarvan het loopvlak geheel van vormvast materiaal is vervaardigd;

      al. middenasaanhangwagen: aanhangwagen waarvan de trekinrichting een onbeweeglijk deel vormt, dan wel slechts in-
      en uitschuifbaar is, en waarbij, bij gelijkmatig verdeelde lading, het trekkend voertuig door de trekinrichting
      van de aanhangwagen met ten hoogste 10% van de toegestane maximum massa van de aanhangwagen wordt belast, met een
      maximum van 1000 kg;

      am. mistlicht aan de achterzijde: licht dat het voertuig bij dichte mist aan de achterzijde beter waarneembaar
      maakt;

      an. mistlicht aan de voorzijde: licht, bestemd voor een betere verlichting van de weg bij mist, sneeuwval, hevige
      regenval of stofwolken;

      an1. mobiliteitshandicap: eigenschap welke het gebruik van het openbaar vervoer bemoeilijkt, bijvoorbeeld als
      gevolg van een lichamelijke, zintuiglijke of geestelijke handicap, meereizende kinderen of meegevoerde goederen;

      an2. mogelijke nuttige toepassing: mogelijkheid om met of ten aanzien van onderdelen of materialen van autowrakken
      als bedoeld in [artikel 1, onderdeel b, van het Besluit beheer autowrakken][ref3] de toepasselijke handelingen,
      bedoeld in bijlage IIB van richtlijn 75/442/EEG, te verrichten;

      ao. motorfiets: motorrijtuig op twee wielen, met of zonder zijspanwagen, alsmede een motorrijtuig op drie
      asymmetrisch geplaatste wielen, met een door de constructie bepaalde maximum snelheid van meer dan 45 km/h of
      uitgerust met een verbrandingsmotor met een cylinderinhoud van meer dan 50 cm3, niet zijnde een motorrijtuig
      met beperkte snelheid; in ieder geval wordt als motorfiets aangemerkt een voertuig dat blijkens het afgegeven
      kentekenbewijs als motorfiets is aangeduid;

      ap. motorrijtuig met beperkte snelheid: motorrijtuig met een door de constructie bepaalde maximum snelheid van niet
      meer dan 25 km/h, niet zijnde een landbouw- of bosbouwtrekker of een bromfiets, niet ingericht voor het vervoer
      van personen, en ingericht voor het bij op korte afstand van elkaar gelegen plaatsen afleveren of ophalen van
      goederen; onder motorrijtuig met beperkte snelheid wordt mede verstaan: motorrijtuig niet zijnde een landbouw- of
      bosbouwtrekker of een bromfiets, niet ingericht voor het vervoer van personen, en

      1. ingericht voor het uitvoeren van werkzaamheden buiten de wegen;

      2. ingericht voor het uitvoeren van werkzaamheden aan wegen of aan werken op, in, langs en boven wegen.

      ap1. niet-oorspronkelijke technische eenheid of onderdeel: technische eenheid of onderdeel dat behoort tot een
      ander type dan waarvan het voertuig bij de goedkeuring oorspronkelijk was voorzien en dat uitsluitend mag worden
      gebruikt ter vervanging van die oorspronkelijke technische eenheid of dat oorspronkelijke onderdeel;

      aq. ondeelbare lading: lading die ten behoeve van het vervoer over de weg niet in twee of meer ladingen kan worden
      gesplitst zonder dat zulks overmatige kosten of risico van schade meebrengt en die wegens haar afmetingen of massa
      niet kan worden vervoerd door een motorrijtuig, aanhangwagen of samenstel van voertuigen dat in alle opzichten aan
      dit besluit voldoet;

      aq1. onderdeel: als onderdeel van een voertuig bedoelde inrichting, die aan de eisen van een bijzondere richtlijn
      als bedoeld in de artikelen 4 van de [richtlijnen 70/156/EEG](31970L0156), [92/61/EEG](31992L0061) of [2002/24/EG]
      (32002L0024) moet voldoen en waarvan de betrokken bijzondere richtlijn een afzonderlijke typegoedkeuring mogelijk
      maakt onafhankelijk van een type voertuig;

      aq2. oorspronkelijke technische eenheid of onderdeel: technische eenheid of onderdeel van het type waarvan het
      voertuig bij de typegoedkeuring of de uitbreiding daarvan is voorzien;

      ar. oplegger: aanhangwagen die is bestemd om aan een motorrijtuig te worden gekoppeld op zodanige wijze, dat een
      deel ervan op het motorrijtuig rust en dat een aanzienlijk deel van de massa van de oplegger en van zijn lading
      door het motorrijtuig wordt gedragen;

      as. parkeerlicht: licht, bestemd om de aanwezigheid van een geparkeerd voertuig aan te geven;

      at. personenauto: motorrijtuig op vier of meer wielen, niet zijnde een landbouw- of bosbouwtrekker, een
      gehandicaptenvoertuig een motorrijtuig op vier wielen als bedoeld in onderdeel *q* of een vierwielige bromfiets,
      ingericht voor het vervoer van personen, met niet meer dan acht zitplaatsen, de bestuurderszitplaats niet
      meegerekend, of een kampeerauto; in ieder geval wordt als personenauto aangemerkt een voertuig dat blijkens het
      afgegeven kentekenbewijs als personenauto is aangeduid;

      at1. recycleerbaarheid: mogelijkheid om onderdelen of materialen van autowrakken als bedoeld in
      [artikel 1, onderdeel b, van het Besluit beheer autowrakken][ref4] voor het oorspronkelijke doel of voor andere
      doeleinden in een productieproces op te werken, met uitzondering van terugwinning van energie;

      au. remlicht: licht, bestemd om weggebruikers die zich achter het voertuig bevinden kenbaar te maken dat de
      bestuurder de bedrijfsrem bedient;

      av. retroreflector: inrichting, bestemd om de aanwezigheid van een voertuig kenbaar te maken door weerkaatsing van
      het licht afkomstig van een niet tot dat voertuig behorende lichtbron, waarbij de waarnemer zich nabij deze lichten
      bevindt;

      aw. richtingaanwijzer: licht, bestemd om andere weggebruikers kenbaar te maken dat de bestuurder het voornemen
      heeft naar links of naar rechts van richting te veranderen;

      ax. richtlicht: licht waarvan de lichtbundel naar wens kan worden gericht;

      ay. rijdend werktuig: bedrijfsauto of motorrijtuig met beperkte snelheid, ingericht voor het uitvoeren van in
      hoofdzaak andere werkzaamheden dan het vervoer van goederen of personen;

      az. samenstel van voertuigen: trekkend voertuig met een of meer aanhangwagens;

      ba. stadslicht: licht dat, van de voorzijde gezien, de aanwezigheid van het voertuig kenbaar maakt en een
      aanwijzing is voor de breedte van het voertuig;

      ba1. technische eenheid: als onderdeel van een voertuig bedoelde inrichting, die aan de eisen van een bijzondere
      richtlijn als bedoeld in de artikelen 4 van de [richtlijnen 70/156/EEG](31970L0156), [92/61/EEG](31992L0061)
      of [2002/24/EG](32002L0024) moet voldoen en waarvan de betrokken bijzondere richtlijn een afzonderlijke
      typegoedkeuring mogelijk maakt uitsluitend in samenhang met een of meer bepaalde typen voertuigen;

      ba2. T100-bus: bus, ten aanzien waarvan uit een aantekening op het kentekenbewijs dan wel uit het kentekenregister
      blijkt dat hij zodanig is ingericht dat hij in aanmerking komt voor een maximumsnelheid van 100 km/h;

      bb. trekker: bedrijfsauto, voorzien van een koppeling, bestemd voor het voortbewegen van een oplegger;

      bc. vervangingskatalysator: een katalysator of een samenstel van katalysatoren die bestemd is of zijn om een
      originele katalysator op een voertuig te vervangen en waarvoor als technische eenheid volgens de definitie in
      artikel 4, eerste lid, onderdeel d, van [richtlijn 70/156/EEG](31970L0156) of artikel 2, vijfde lid, van [richtlijn
      2002/24/EG](32002L0024) typegoedkeuring kan worden verleend;

      bc1. verwarmingssysteem op brandstof: verwarmingssysteem dat rechtstreeks op vloeibare of gasvormige brandstof
      werkt en geen gebruik maakt van de door de aandrijfmotor van het voertuig voortgebrachte afvalwarmte;

      bd. voertuig: motorrijtuig, aanhangwagen, fiets, zijspanwagen, wagen of andere constructie, niet bestemd om
      langs spoorstaven te worden voortbewogen; onder een andere constructie wordt niet verstaan een kinderwagen, niet-
      gemotoriseerde rolstoel, kruiwagen of soortgelijke kleine constructie;

      bd1. vooruitkijkspiegel: een spiegel van klasse VI als bedoeld in bijlage I, punt 1.1.1.14 van [richtlijn 2003/97/
      EG](32003L0097);

      be. waarschuwingsknipperlicht: gelijktijdige werking van alle richtingaanwijzers, bestemd om aan te geven dat het
      voertuig tijdelijk een bijzonder gevaar oplevert voor andere weggebruikers;

      bf. wagens: voertuigen, met uitzondering van motorrijtuigen, aanhangwagens, niet-gemotoriseerde
      gehandicaptenvoertuigen, fietsen en zijspanwagens, doch met inbegrip van handwagens met motorvermogen;

      bg. werklicht: licht, bestemd voor het verlichten van een plaats waar werkzaamheden worden verricht;

      bh. wet: [Wegenverkeerswet 1994][ref5];

      bi. wielbasis:

      1. ten aanzien van vóór 1 april 1983 in gebruik genomen voertuigen: de horizontaal, evenwijdig aan het
      middenlangsvlak van het voertuig gemeten afstand tussen het hart van de eerste as, van het eerste samenstel van
      assen of van de koppelingspen en het hart van de laatste as of het hart van het laatste samenstel van assen,

      2. ten aanzien van na 31 maart 1983 in gebruik genomen voertuigen, niet zijnde opleggers: de horizontaal,
      evenwijdig aan het middenlangsvlak van het voertuig gemeten afstand tussen het hart van de eerste en het hart van
      de laatste as van het voertuig,

      3. ten aanzien van na 31 maart 1983 in gebruik genomen opleggers: de horizontaal, evenwijdig aan het
      middenlangsvlak van het voertuig gemeten afstand tussen de verticale hartlijn van de koppelingspen en het hart van
      de laatste as;

      bj. zelfsturende as: as die wordt gestuurd doordat, door de wrijving van de banden op het wegdek, de wielen
      zelfstandig een zodanige stand innemen dat zij de cirkelbaan van het voertuig volgen;

      bk. zelfsturend asstel: asstel dat wordt gestuurd doordat, door de wrijving van de banden op het wegdek, de wielen
      zelfstandig een zodanige stand innemen dat zij de cirkelbaan van het voertuig volgen;

      bl. zijmarkeringslicht: licht dat, van de zijkant gezien, de aanwezigheid van het voertuig kenbaar maakt;

      bm. zijspanwagen: voertuig, afneembaar verbonden aan de zijkant van een fiets, bromfiets of motorfiets;

      bn. zitbank: een constructie, die plaats biedt aan tenminste twee volwassenen;

      bo. zitplaats: constructie die al dan niet een integrerend deel vormt van de constructie van het voertuig, die
      plaats biedt aan een volwassen persoon, met dien verstande dat de zitplaats zowel een afzonderlijke zitplaats kan
      zijn als een gedeelte van een bank dat plaats biedt aan één persoon en die afhankelijk van de richting als volgt
      wordt aangeduid:

      1. naar voren gerichte zitplaats: zitplaats die kan worden gebruikt terwijl het voertuig in beweging is en die
      zodanig naar de voorkant van het voertuig is gericht dat het middenlangsvlak van de zitplaats een hoek van minder
      dan + 10° of – 10° vormt met het middenlangsvlak van het voertuig;

      2. naar achteren gerichte zitplaats: zitplaats die kan worden gebruikt terwijl het voertuig in beweging is en die
      zodanig naar de achterkant van het voertuig is gericht dat het middenlangsvlak van de zitplaats een hoek van minder
      dan + 10° of – 10° vormt met het middenlangsvlak van het voertuig;

      3. zijdelings gerichte zitplaats: zitplaats die, gelet op haar gerichtheid ten opzichte van het middenlangsvlak van
      het voertuig, niet voldoet aan de onderdelen 1 en 2;


