      1 Indien een koppelinrichting van een bedrijfsauto, welke koppeling is bestemd voor het voortbewegen van een
      aanhangwagen met een toegestane maximum massa van meer dan 750 kg, wordt aangebracht, moet het voertuig voldoen aan
      de in de [hoofdstukken 3][ref1] en [5][ref2] opgenomen eisen omtrent:

      a. algemeen,

      b. algemene bouwwijze van het voertuig,

      c. afmetingen en massa’s,

      d. reminrichting,

      e. verlichting, lichtsignalen en retroreflecterende voorzieningen, en

      f. verbinding tussen trekkend motorrijtuig en aanhangwagen.

      2 Het bepaalde in het eerste lid is niet van toepassing op bedrijfsauto's met een zelfdragende carrosserie en
      met een toegestane maximum massa van niet meer dan 3500 kg, voorzover het een aangebrachte koppelingskogel met
      bevestiging daarvan betreft die voldoet aan [artikel 3.3.52, eerste lid][ref3].


