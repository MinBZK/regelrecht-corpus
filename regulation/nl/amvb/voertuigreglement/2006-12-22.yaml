  - number: 5.3.45a
    text: |-
      1 Onverminderd [artikel 5.3.45][ref1] zijn bedrijfsauto’s met een toegestane maximum massa van meer dan 3500
      kg, niet zijnde bussen of kampeerauto’s, die in gebruik zijn genomen na 31 december 1977, voorzien van een
      gezichtsveldverbeterende voorziening die de bestuurder een beter zicht verschaft op de weggebruikers die zich
      rechts van het voertuig bevinden.

      2 In afwijking van het eerste lid zijn bedrijfsauto’s met een toegestane maximum massa van meer dan 3500 kg, niet
      zijnde bussen of kampeerauto’s, die in gebruik zijn genomen na 31 december 1977 en met een bestuurderszitplaats aan
      de rechterzijde van het voertuig, voorzien van een gezichtsveldverbeterende voorziening die de bestuurder een beter
      zicht verschaft op de weggebruikers die zich links van het voertuig bevinden.

      3 Het eerste en tweede lid gelden niet voor bedrijfsauto’s:

      a. die in een andere lidstaat van de Europese Gemeenschappen zijn geregistreerd,

      b. die voor 26 januari 2008 in gebruik zijn genomen en die voldoen aan het in
      [artikel 5.3.45, leden 4, 6 tot en met 9][ref2] vereiste gezichtsveld voor voertuigen in gebruik genomen na 25
      januari 2008,

      c. met een toegestane maximum massa van meer dan 7500 kg die in gebruik zijn genomen na 25 januari 2008, of

      d. met een toegestane maximum massa van niet meer dan 7500 kg en in gebruik genomen na 19 oktober 2005, indien geen
      trottoirspiegel is gemonteerd.

      4 Onze Minister stelt regels vast omtrent het eerste en tweede lid.


