  - number: 5.17.3
    text: |-
      De langs- en dwarsliggers en chassisversterkingsdelen van het chassisraam, dan wel de daarvoor in de plaats
      tredende delen van wagens mogen:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte ervan in gevaar
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.3
  - number: 5.17.4
    text: |-
      1 De bovenbouw van wagens moet deugdelijk op het onderstel zijn bevestigd.

      2 De ondersteuning van de laadvloer onderscheidenlijk laadruimte moet deugdelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.4
  - number: 5.17.6
    text: |-
      1 Wagens mogen:

      a. niet breder zijn dan 2,60 m;

      b. niet hoger zijn dan 4,00 m.

      2 In afwijking van het bepaalde in het eerste lid mogen onbespannen wagens niet breder zijn dan 1,50 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.6
  - number: 5.17.7
    text: |-
      1 De last onder enig wiel van wagens mag niet meer bedragen dan 2400 kg. Een samenstel van wielen dat op één
      wielnaaf is gemonteerd, wordt als één wiel beschouwd.

      2 In afwijking van het bepaalde in het eerste lid mag de last onder een wiel dat niet is voorzien van een rubberen
      band, niet meer bedragen dan 120 kg per cm bandbreedte.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.7
  - number: 5.17.27
    text: |-
      1 De wielen van wagens mogen niet zijn voorzien van metalen banden met uitstekende delen.

      2 Het bepaalde in het eerste lid geldt niet voor landbouwwerktuigen met een massa van ten hoogste 750 kg.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.27
  - number: 5.17.40
    text: |-
      Handwagens met motorvermogen moeten zodanig zijn ingericht dat indien de bestuurder het bedieningstoestel loslaat,
      het voertuig onmiddellijk tot stilstand wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.40
  - number: 5.17.48
    text: |-
      1 Wagens mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel voor andere
      weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen van wagens, die in geval van botsing het
      gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn afgeschermd.

      3 Het bepaalde in het eerste lid en tweede lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m
      boven het wegdek bevinden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.48
  - number: 5.17.51
    text: |-
      Wagens moeten aan de achterzijde zijn voorzien van:

      a. twee niet-driehoekige rode retroreflectoren welke zijn voorzien van een door Onze Minister bekendgemaakt
      goedkeuringsmerk, indien het een wagen betreft waarvan de breedte meer dan 1,50 m bedraagt, dan wel één zodanige
      retroreflector indien het een wagen betreft waarvan de breedte ten hoogste 1,50 m bedraagt;

      b. een rode retroreflector in de vorm van een afgeknotte driehoek.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.51
  - number: 5.17.54
    text: |-
      1 De niet-driehoekige rode retroreflectoren moeten aan de achterzijde van het voertuig op gelijke hoogte zijn
      aangebracht:

      a. niet meer dan 0,40 m binnenwaarts van de uiterste linker- en rechterzijde van het voertuig;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek.

      2 Indien één niet-driehoekige retroreflector is voorgeschreven, moet deze zijn aangebracht:

      a. aan de uiterste linkerzijde van het voertuig;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek.

      3 De rode retroreflector in de vorm van een afgeknotte driehoek moet aan de achterzijde van het voertuig zijn
      aangebracht:

      a. in het midden van het voertuig dan wel links van het midden;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek. Indien zulks niet mogelijk
      is zonder gebruikmaking van bevestigingsmiddelen die gemakkelijk kunnen worden beschadigd, mag de retroreflector op
      een hoogte van meer dan 0,90 m doch niet meer dan 1,60 m boven het wegdek zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.54
  - number: 5.17.55
    text: |-
      1 De retroreflectoren mogen niet zijn afgeschermd.

      2 De retroreflectoren mogen geen gebreken vertonen, die de retroreflectie beïnvloeden.

      3 De rode retroreflector in de vorm van een afgeknotte driehoek moet zijn voorzien van een door Onze Minister
      bekendgemaakt goedkeuringsmerk.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.55
  - number: 5.17.57
    text: |-
      1 Wagens mogen zijn voorzien van:

      a. twee lichten aan de voorzijde;

      b. twee achterlichten indien het een wagen betreft waarvan de breedte meer dan 1,50 m bedraagt, dan wel ten minste
      één achterlicht indien het een wagen betreft waarvan de breedte ten hoogte 1,50 m bedraagt;

      c. één of twee witte retroreflectoren aan de voorzijde van het voertuig;

      d. ambergele retroreflectoren aan de zijkanten van het voertuig.

      2 Wagens mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra niet-
      driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.57
  - number: 5.17.64
    text: |-
      1 Wagens mogen niet zijn voorzien van verblindende verlichting.

      2 Wagens mogen niet zijn voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.64
  - number: 5.17.65
    text: |-
      Wagens mogen niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in
      [artikelen 5.17.51][ref1] en [5.17.57][ref2] is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.17.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.17.57
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.17.65
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.17.51
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '17'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 5.17.57
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '17'
  - number: 5.18.1
    text: |-
      1 Met een motorrijtuig mag niet meer dan één aanhangwagen worden voortbewogen.

      2 Met een gelede bus mag geen aanhangwagen worden voortbewogen.

      3 Met een gehandicaptenvoertuig mag geen aanhangwagen worden voortbewogen.

      4 Met een motorfiets met zijspanwagen mag geen aanhangwagen worden voortbewogen, tenzij het wiel van de
      zijspanwagen is beremd.

      5 Het bepaalde in het eerste lid is niet van toepassing op landbouw- of bosbouwtrekkers en motorrijtuigen met
      beperkte snelheid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.1
  - number: 5.18.2
    text: |-
      1 Met een motorrijtuig mag niet meer dan één motorrijtuig of samenstel van voertuigen worden voortbewogen. Een
      afsleepdolly en een zich daarop bevindend motorrijtuig worden als één motorrijtuig beschouwd.

      2 Met een motorrijtuig mag geen tweewielig motorrijtuig worden voortbewogen.

      3 Met een tweewielig motorrijtuig, een gelede bus of een samenstel van voertuigen mag geen motorrijtuig of
      samenstel van voertuigen worden voortbewogen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.2
  - number: 5.18.3
    text: |-
      1 De bestuurder mag bij het besturen van het voertuig niet door passagiers, lading of op andere wijze worden
      gehinderd.

      2 In een voertuig waarin vervoer van een passagier in een rolstoel plaatsvindt, zijn geen losse voorwerpen aanwezig
      die het risico op letsel bij een noodstop, een aanrijding of een botsing kunnen verhogen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.3
  - number: 5.18.4
    text: |-
      Voertuigen en samenstellen van voertuigen moeten zodanig zijn beladen dat de bestuurder voldoende uitzicht
      naar voren en opzij heeft en met behulp van de voor voertuigen van de categorie waartoe het voertuig behoort
      voorgeschreven spiegels, voldoende uitzicht heeft op het links en rechts naast en achter hem gelegen weggedeelte.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.4
  - number: 5.18.5
    text: |-
      Indien het gezichtsveld van de voor voertuigen van de categorie waartoe het voertuig behoort, voorgeschreven
      spiegels wordt beperkt door lading die aan de achterzijde van het voertuig is aangebracht of door een door het
      voertuig voortbewogen aanhangwagen met inbegrip van de lading, moet het voertuig zijn voorzien van een linker-
      onderscheidenlijk rechterbuitenspiegel waarmee de bestuurder een door Onze Minister vastgesteld weggedeelte kan
      overzien.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.5
  - number: 5.18.6
    text: |-
      1 Het voertuig moet zodanig zijn beladen dat de lading of delen daarvan niet van het voertuig kunnen vallen.

      2 Losse lading ten aanzien waarvan het gevaar bestaat dat deze of delen daarvan tijdens het rijden van het voertuig
      vallen, moet deugdelijk zijn afgedekt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.6
  - number: 5.18.7
    text: |-
      1 Bij het vervoer van goederen aan de achterzijde van een personenauto, bedrijfsauto met een toegestane maximum
      massa van niet meer dan 3500 kg, of driewielig motorrijtuig moet worden voldaan aan de volgende eisen:

      a. de goederen moeten deugdelijk zijn bevestigd op, in of aan een deugdelijke lastdrager;

      b. de lastdrager moet deugdelijk aan het voertuig zijn bevestigd;

      c. de lastdrager met inbegrip van de goederen mag niet meer dan 0,20 m buiten de zijkanten van het voertuig
      uitsteken; het bepaalde in [artikel 5.18.14, derde lid][ref1], is niet van toepassing op op een lastdrager
      vervoerde fietsen;

      d. indien de lastdrager is geconstrueerd voor het vervoer van specifieke goederen, mogen niet meer van deze
      goederen worden vervoerd dan waarvoor de constructie is bestemd;

      e. indien de verlichting en retroreflectoren van het voertuig door de lastdrager of de goederen worden afgeschermd,
      moet de lastdrager aan de achterzijde zijn voorzien van twee rode achterlichten, twee rode remlichten, twee niet-
      driehoekige rode retroreflectoren en twee ambergele richtingaanwijzers, die moeten zijn aangebracht op een afstand
      van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig met inbegrip van de lastdrager;

      f. indien de op het voertuig aangebrachte kentekenplaat door de lastdrager of de goederen wordt afgeschermd,
      moet de lastdrager zijn voorzien van een kentekenplaat met het kenteken van het voertuig waarop de lastdrager is
      aangebracht, alsmede van kentekenplaatsverlichting; het kenteken moet goed leesbaar zijn en de kentekenplaat moet
      zijn voorzien van het in [artikel 5 van het Kentekenreglement][ref2] voorgeschreven goedkeuringsmerk en mag niet
      zijn afgeschermd;

      g. indien de lastdrager is bevestigd op een trekhaak:

      1°. mag de door de fabrikant van de trekhaak vastgestelde maximale verticale last onder de koppeling niet worden
      overschreden; indien de trekhaak hieromtrent geen gegevens vermeldt, mag de verticale last niet meer dan 50 kg
      bedragen;

      2°. mag de lastdrager met inbegrip van de bevestigingsdelen onder normale gebruiksomstandigheden het wegdek niet
      kunnen raken;

      3°. mogen bevestigingsdelen, die na het gedeeltelijk verwijderen van de lastdrager op de trekhaak achterblijven, de
      bewegingsvrijheid van een aangekoppelde aanhangwagen niet beperken.

      2 Bij het vervoer van goederen op het dak van een personenauto, bedrijfsauto met een toegestane maximum massa van
      niet meer dan 3500 kg, of driewielig motorrijtuig moet worden voldaan aan de volgende eisen:

      a. de goederen moeten deugdelijk zijn bevestigd op, in of aan een deugdelijke lastdrager;

      b. de lastdrager moet deugdelijk aan het voertuig zijn bevestigd;

      c. de door de fabrikant van het voertuig vastgestelde maximale daklast mag niet worden overschreden;

      d. indien de lastdrager is geconstrueerd voor het vervoer van specifieke goederen, mogen niet meer van deze
      goederen worden vervoerd dan waarvoor de constructie is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.18.14
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.18.7
