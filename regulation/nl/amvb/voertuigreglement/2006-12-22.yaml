  - number: 5.4.58
    text: |-
      1 Zijspanwagens, verbonden aan een motorfiets, mogen zijn voorzien van:

      a. een stadslicht, indien het voertuig in gebruik is genomen voor 1 november 1997;

      b. richtingaanwijzers indien het voertuig in gebruik is genomen voor 1 november 1997 en
      waarschuwingsknipperlichten;

      c. een remlicht, indien het voertuig in gebruik is genomen voor 1 november 1997;

      d. een witte retroreflector aan de voorzijde van de zijspanwagen, indien het voertuig in gebruik is genomen voor 1
      november 1997;

      e. een ambergele retroreflector aan elke zijkant van de zijspanwagen;

      f. een parkeerlicht aan de verst van de motorfiets verwijderde zijkant van de zijspanwagen, indien het voertuig in
      gebruik is genomen voor 1 november 1997.

      2 Zijspanwagens, verbonden aan een motorfiets die in gebruik is genomen voor 1 november 1997, mogen zijn voorzien
      van extra witte retroreflecterende voorzieningen aan de voorzijde, extra rode aan de achterzijde en extra ambergele
      aan de zijkanten van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.58
  - number: 5.4.59
    text: |-
      1 Het mistlicht aan de voorzijde, het richtlicht, het bermlicht en het stadslicht mogen naar voren niet anders dan
      wit of geel stralen.

      2 De parkeerlichten mogen naar voren niet anders dan wit en naar achteren niet anders dan rood stralen.

      3 De richtingaanwijzers en waarschuwingsknipperlichten mogen niet anders dan ambergeel stralen.

      4 Het remlicht en het mistlicht aan de achterzijde mogen niet anders dan rood stralen.

      5 [Artikel 5.4.55, tweede, derde en vierde lid][ref1], is van toepassing.

      6 Op het mistlicht aan de voorzijde van het voertuig is [artikel 5.4.55, eerste tot en met vijfde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.4.55
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.4.55
