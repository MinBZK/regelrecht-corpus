  - number: 5.5.66
    text: |-
      1 Indien het driewielig motorrijtuig is voorzien van een inrichting tot het koppelen van een aanhangwagen, moet
      deze inrichting deugdelijk zijn bevestigd en mag deze niet zijn gescheurd, gebroken of vervormd. Onze Minister
      stelt regels vast met betrekking tot de deugdelijkheid van de bevestiging.

      2 Bij een inrichting als bedoeld in het eerste lid, die is voorzien van een koppelingskogel met een nominale
      diameter van 50 mm:

      a. moet de diameter van de kogel ten minste 49 mm bedragen;

      b. moet de sluit- en borginrichting van een afneembare kogel goed werken en moet de bevestiging van het
      kogelgedeelte nagenoeg spelingvrij zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.66
  - number: 5.5.71
    text: |-
      1 Driewielige motorrijtuigen moeten zijn voorzien van ten minste een geluidssignaalinrichting die bestaat uit een
      goed werkende hoorn met vaste toonhoogte. Een samenstel van zodanige, tegelijk werkende hoorns wordt als één hoorn
      beschouwd.

      2 Driewielige motorrijtuigen mogen zijn voorzien van een geluidssignaalinrichting die andere weggebruikers erop
      attent maakt dat de achteruitversnelling van het voertuig is ingeschakeld, alsmede van een geluidssignaalinrichting
      die ertoe strekt ongeoorloofd gebruik of diefstal van het voertuig te voorkomen.

      3 Driewielige motorrijtuigen mogen niet zijn voorzien van andere geluidssignaalinrichtingen dan bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.5.71
  - number: 5.6.1
    text: |-
      1 Bromfietsen moeten voldoen aan de volgende eisen:

      a. het voertuig is in overeenstemming met de op het voor het voertuig afgegeven kentekenbewijs en in het
      kentekenregister omtrent het voertuig vermelde gegevens;

      b. het identificatienummer is op een vast voertuigdeel ingeslagen en is goed leesbaar;

      c. de kentekenplaat is voorzien van het in [artikel 5 van het Kentekenreglement][ref1] voorgeschreven
      goedkeuringsmerk en moet deugdelijk aan de achterzijde van het voertuig zijn bevestigd;

      d. het kenteken is goed leesbaar en de kentekenplaat is niet afgeschermd;

      e. het merk of de fabrieksaanduiding is goed leesbaar op het voertuig aanwezig;

      f. indien het een bromfiets betreft die in gebruik is genomen na 31 december 1994 en waarvoor geen kentekenbewijs
      is afgegeven, moet de bromfiets tot 1 januari 2007:

      1°. behoren tot een door Onze Minister goedgekeurd type of exemplaar en zijn voorzien van een goed leesbaar
      goedkeuringsmerk dat is aangebracht op het balhoofd of op enig ander deel van het frame, dan wel

      2°. behoren tot een type waarvoor een typegoedkeuring als bedoeld in artikel 4, eerste lid, aanhef en onderdeel a,
      van richtlijn 92/61/EEG of richtlijn 2002/24/EG is afgegeven en zijn voorzien van een constructieplaat, waarop de
      naam van de fabrikant, het goedkeuringsnummer betreffende de goedkeuring van het voertuig, het identificatienummer
      van het voertuig en het geluidsniveau tijdens stilstand in dB(A) bij een daarbij behorend toerental per minuut,
      zijn vermeld, en

      3°. zijn voorzien van een gele plaat of gele vlakken of, indien het voertuig is geconstrueerd voor een
      maximumsnelheid van niet meer dan 25 km/h, van een oranje plaat of oranje vlakken.

      2 Het eerste lid is niet van toepassing op voertuigen als bedoeld in [artikel 2.4, onderdelen a, b en g][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.1
