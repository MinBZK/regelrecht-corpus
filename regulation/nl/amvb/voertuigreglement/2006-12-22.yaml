  - number: 3.2.2
    text: Personenauto’s moeten van deugdelijke bouw en inrichting zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.2
  - number: 3.2.3
    text: |-
      1 Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een constructieplaat
      en een identificatienummer, die voldoen aan het bepaalde in [richtlijn 76/114/EEG](31976L0114).

      2 Personenauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van een identificatienummer
      dat:

      a. voor elke personenauto van hetzelfde merk verschillend is;

      b. uit ten minste 3 letters of cijfers bestaat, welke minimaal 7 mm hoog zijn;

      c. goed leesbaar op een vast voertuigdeel is ingeslagen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.3
  - number: 3.2.6
    text: |-
      1 Personenauto’s die in gebruik zijn genomen na 31 december 1995 moeten voor wat betreft de lengte, de breedte en
      de hoogte voldoen aan het bepaalde in [richtlijn 92/21/EEG](31992L0021).

      2 Personenauto’s die in gebruik zijn genomen voor 1 januari 1996 mogen:

      a. niet langer zijn dan 12,00 m;

      b. niet breder zijn dan 2,55 m;

      c. niet hoger zijn dan 4,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.6
  - number: 3.2.9
    text: |-
      1 De toegestane maximum last onder de assen en de toegestane maximum massa van personenauto’s die in gebruik zijn
      genomen na 31 december 1995 moeten voldoen aan het bepaalde in [richtlijn 92/21/EEG](31992L0021).

      2 De last onder de assen van personenauto’s die in gebruik zijn genomen voor 1 januari 1996 mag niet meer bedragen
      dan:

      a. de door de fabrikant van het voertuig opgegeven toegestane maximum last, en

      b. 10 000 kg voor een niet-aangedreven as en 11 500 kg voor een aangedreven as.

      3 Op personenauto’s met meer dan twee assen die in gebruik zijn genomen voor 1 januari 1996 is het bepaalde in
      [artikel 3.3.9][ref1] van overeenkomstige toepassing.

      4 De toegestane maximum massa van personenauto’s die in gebruik zijn genomen voor 1 januari 1996 mag niet meer
      bedragen dan de door de fabrikant van het voertuig opgegeven toegestane maximum massa.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.3.9
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.9
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 3.3.9
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.2.10
    text: |-
      1 De toegestane maximum massa van samenstellen van een personenauto die in gebruik is genomen na 31 december 1995
      en een aanhangwagen moet voldoen aan het bepaalde in [richtlijn 92/21/EEG](31992L0021).

      2 De toegestane maximum massa van samenstellen van een personenauto die in gebruik is genomen voor 1 januari 1996
      en een aanhangwagen mag niet meer bedragen dan de door de fabrikant van de personenauto voor het samenstel van
      voertuigen opgegeven toegestane maximum massa.

      3 De toegestane maximum massa van een door een personenauto die in gebruik is genomen voor 1 januari 1996 voort te
      bewegen aanhangwagen mag niet meer bedragen dan:

      a. de daarvoor door de fabrikant van de personenauto opgegeven toegestane maximum massa, en

      b. indien het een ongeremde aanhangwagen betreft, niet meer dan 750 kg en niet meer dan:

      1°. de helft van de massa in bedrijfsklare toestand van de personenauto indien de personenauto in gebruik wordt
      genomen na 31 december 1994, of

      2°. de helft van de ledige massa van de personenauto, vermeerderd met 50 kg, indien de personenauto in gebruik is
      genomen voor 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.10
  - number: 3.2.12
    text: |-
      1 Personenauto’s die zijn voorzien van een brandstofreservoir, niet zijnde een reservoir voor al dan niet tot
      vloeistof verdicht gas, en die in gebruik worden genomen na 31 december 1994, moeten voldoen aan het bepaalde in
      [richtlijn 70/221/EEG](31970L0221).

      2 Van fabrieksmatig in serie vervaardigde complete personenauto’s die in gebruik zijn genomen na 30 september 1971
      doch voor 1 januari 1995, moeten het brandstofreservoir alsmede de plaats van het originele brandstofreservoir van
      voertuigen voldoen aan de door de fabrikant van het voertuig gestelde eisen.

      3 Van personenauto’s die in gebruik worden genomen na 30 september 1971 doch voor 1 januari 1995, mogen delen van
      het brandstofreservoir, met inbegrip van bevestigingssteunen en leidingen, in onbelaste toestand van het voertuig
      niet lager zijn gelegen dan 0,25 m boven het wegdek, tenzij de dragende delen van het chassis of de carrosserie
      lager zijn gelegen en voldoende bescherming bieden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.12
  - number: 3.2.13
    text: |-
      1 Het brandstofsysteem van personenauto’s voorzien van een LPG- of CNG-installatie moet voldoen aan de door Onze
      Minister gestelde eisen.

      2 Personenauto’s die elektrisch kunnen worden aangedreven, al dan niet in combinatie met een verbrandingsmotor,
      moeten voldoen aan de door Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.13
  - number: 3.2.14
    text: |-
      Personenauto’s die in gebruik worden genomen na 30 september 1974, moeten ter zake van elektromagnetische
      compatibiliteit voldoen aan het bepaalde in [richtlijn 72/245/EEG](31972L0245).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.14
  - number: 3.2.15
    text: |-
      Personenauto’s moeten voor wat betreft geluidproduktie voldoen aan het bepaalde in het
      [Besluit geluidproduktie motorvoertuigen][ref1] (*Stb.* 1981, 741).


      [ref1]: https://wetten.overheid.nl/BWBR0003464
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.15
    references:
      - id: ref1
        bwb_id: BWBR0003464
  - number: 3.2.16
    text: |-
      1 Personenauto’s met een verbrandingsmotor moeten voor wat betreft luchtverontreiniging voldoen aan het bepaalde in
      het [Besluit typekeuring motorrijtuigen luchtverontreiniging][ref1] (*Stb.* 1990, 393).

      2 Personenauto’s met een verbrandingsmotor die in gebruik zijn genomen na 31 december 1995 moeten voor wat betreft
      de wijze van meten van het brandstofverbruik voldoen aan het bepaalde in [richtlijn 80/1268/EEG](31980L1268).


      [ref1]: https://wetten.overheid.nl/BWBR0002890
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.16
    references:
      - id: ref1
        bwb_id: BWBR0002890
  - number: 3.2.17
    text: |-
      1 Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een achteruitrij-
      inrichting en van een snelheidsmeter die voldoen aan het bepaalde in [richtlijn 75/443/EEG](31975L0443). Met een
      snelheidsmeter wordt gelijkgesteld een controleapparaat dat voldoet aan het bepaalde in [verordening 3821/85/EEG]
      (31985R3821).

      2 Personenauto’s die in gebruik zijn genomen na 30 juni 1967 doch voor 1 januari 1995, moeten zijn voorzien van een
      goed werkende snelheidsmeter, die ook bij nacht voor de bestuurder goed afleesbaar is.

      3 Personenauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van een inrichting om
      achteruit te rijden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.17
  - number: 3.2.18
    text: |-
      1 Personenauto’s moeten sneller kunnen rijden dan 25 km/h.

      2 Personenauto’s met een verbrandingsmotor als bedoeld in Bijlage I van [richtlijn 80/1269/EEG](31980L1269)die in
      gebruik zijn genomen na 31 december 1995 moeten voor betreft de wijze van meten van het motorvermogen voldoen aan
      het bepaalde in deze richtlijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.18
  - number: 3.2.23
    text: |-
      1 Personenauto’s die in gebruik zijn genomen na 31 december 1994 moeten zijn voorzien van banden die voldoen aan en
      zijn gemonteerd overeenkomstig het bepaalde in [richtlijn 92/23/EEG](31992L0023).

      2 Indien een personenauto als bedoeld in het eerste lid is voorzien van een reservewiel dat afwijkt van de overige
      wielen, moeten dat reservewiel en het weggedrag van het voertuig bij gebruikmaking van dat wiel voldoen aan het
      bepaalde in [richtlijn 92/23/EEG](31992L0023).

      3 Personenauto’s die in gebruik zijn genomen na 30 september 1971 en voor 1 januari 1995 moeten zijn voorzien van
      banden:

      a. die voldoen aan het bepaalde in [richtlijn 92/23/EEG](31992L0023), of

      b. waarvan de technische gegevens zijn opgenomen in een door Onze Minister vastgestelde tabel.

      4 Indien een personenauto als bedoeld in het derde lid is voorzien van een reservewiel dat afwijkt van de overige
      wielen, moeten dat reservewiel en het weggedrag van het voertuig bij gebruikmaking van dat wiel voldoen aan het
      bepaalde in [richtlijn 92/23/EEG](31992L0023).

      5 Onze Minister stelt regels vast met betrekking tot de montage van banden van personenauto’s als bedoeld in het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.23
  - number: 3.2.24
    text: |-
      1 Personenauto’s die in gebruik zijn genomen voor 1 januari 1996 moeten zijn voorzien van een goed werkend
      veersysteem. Banden worden niet als deel van het veersysteem beschouwd.

      2 Personenauto’s die in gebruik zijn genomen voor 1 januari 1996 moeten zijn voorzien van deugdelijk bevestigde en
      goed werkende schokdempers.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.24
  - number: 3.2.25
    text: |-
      1 Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een stuurinrichting
      die voldoet aan het bepaalde in [richtlijn 70/311/EEG](31970L0311).

      2 Personenauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van een deugdelijke
      stuurinrichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.25
  - number: 3.2.26
    text: |-
      1 Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een reminrichting die
      voldoet aan het bepaalde in [richtlijn 71/320/EEG](31971L0320).

      2 Personenauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van een reminrichting die
      voldoet aan de door Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.26
  - number: 3.2.27
    text: |-
      1 De deuren, sloten en scharnieren van personenauto’s die in gebruik worden genomen na 31 december 1994, moeten
      voldoen aan het bepaalde in [richtlijn 70/387/EEG](31970L0387).

      2 Van personenauto’s die in gebruik worden genomen na 30 september 1971, moeten de scharnieren van opendraaiende
      zijdeuren aan de langszijden van het voertuig, met uitzondering van vouwdeuren, aan de voorzijde van de deuren zijn
      aangebracht. Bij dubbele deuren geldt dit voor de deurvleugel die het eerst wordt geopend. De andere deurvleugel
      moet kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.27
  - number: 3.2.28
    text: |-
      Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft het gezichtsveld van de
      bestuurder voldoen aan het bepaalde in [richtlijn 77/649/EEG](31977L0649).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.28
  - number: 3.2.29
    text: |-
      1 Personenauto’s die in gebruik worden genomen na 31 december 1994 moeten zijn voorzien van ruiten die voldoen aan
      en zijn gemonteerd overeenkomstig het bepaalde in [richtlijn 92/22/EEG](31992L0022).

      2 De voorruiten van personenauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten voldoen aan de door Onze
      Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.29
  - number: 3.2.30
    text: |-
      1 Personenauto’s met een voorruit, die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van een
      ruitenwisserinstallatie en van een ruitensproeierinstallatie, die voldoen aan het bepaalde in [richtlijn 78/318/
      EEG](31978L0318).

      2 Personenauto’s met een voorruit, die in gebruik zijn genomen voor 1 januari 1995, moeten zijn voorzien van een
      goed werkende ruitenwisserinstallatie die de bestuurder voldoende uitzicht geeft.

      3 Personenauto’s met een voorruit, die in gebruik worden genomen na 30 september 1971 doch voor 1 januari 1995,
      moeten zijn voorzien van een goed werkende ruitensproeierinstallatie.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.30
  - number: 3.2.31
    text: |-
      Personenauto’s met een voorruit, die in gebruik worden genomen na 30 september 1971, moeten zijn voorzien van
      een installatie ter ontdooiing en ontwaseming van de voorruit. De bedoelde installatie van personenauto’s die in
      gebruik worden genomen na 31 december 1994, moet voldoen aan het bepaalde in [richtlijn 78/317/EEG](31978L0317).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.31
  - number: 3.2.32
    text: |-
      1 Personenauto’s, in gebruik genomen na 25 januari 2006, voldoen wat inrichtingen voor indirect zicht betreft aan
      [richtlijn 2003/97/EG](32003L0097).

      2 Personenauto’s, in gebruik genomen na 31 december 1994 doch voor 26 januari 2006, voldoen wat spiegels betreft
      aan [richtlijn 71/127/EEG](31971L0127).

      3 Personenauto’s die in gebruik zijn genomen voor 1 januari 1995 moeten zijn voorzien van een linkerbuitenspiegel
      en van een binnenspiegel.

      4 Personenauto’s die in gebruik zijn genomen voor 1 januari 1995 moeten zijn voorzien van een rechterbuitenspiegel
      indien met de binnenspiegel het vereiste gezichtsveld op de weg niet wordt verkregen. Indien de binnenspiegel geen
      zicht naar achteren mogelijk maakt, behoeft deze niet aanwezig te zijn.

      5 Spiegels als bedoeld in het derde en het vierde lid moeten voor wat betreft oppervlakte, plaatsing,
      verstelbaarheid en gezichtsveld voldoen aan de door Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.32
  - number: 3.2.33
    text: |-
      Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft de identificatie van
      bedieningsorganen, verklikkerlichten en meters voldoen aan het bepaalde in [richtlijn 78/316/EEG](31978L0316).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.33
  - number: 3.2.34
    text: |-
      1 Personenauto's, in gebruik genomen na 8 mei 2004, voldoen wat verwarmingssystemen betreft aan [richtlijn 2001/56/
      EG](32001L0056).

      2 Personenauto's, in gebruik genomen na 31 december 1994 doch voor 9 mei 2004, voldoen wat verwarmingssystemen
      betreft aan [richtlijn 78/548/EEG](31978L0548).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.34
  - number: 3.2.35
    text: |-
      1 Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft de bescherming van
      de inzittenden bij een ongeval voldoen aan het bepaalde in de [richtlijnen 74/60/EEG](31974L0060) en [74/297/EEG]
      (31974L0297).

      2 Bij personenauto’s die in gebruik zijn genomen voor 1 januari 1995, mogen delen van het voertuig waaraan
      inzittenden zich wanneer zij door een plotselinge vertraging of stilstand van het voertuig naar voren worden
      geworpen, zouden kunnen stoten, niet zijn uitgevoerd met gevaarlijke scherpe delen of kanten, die het gevaar voor
      dan wel de ernst van verwondingen zouden kunnen vergroten.

      3 Personenauto’s die in gebruik zijn genomen na 31 december 1994, voldoen terzake van de inrichting, sterkte en
      bevestiging van zitplaatsen en hoofdsteunen aan de volgende eisen:

      a. indien zij in gebruik zijn genomen voor 20 oktober 2006, voldoen zij voor wat betreft de naar voren gerichte
      zitplaatsen en hoofdsteunen daarvan aan de [richtlijnen 74/408/EEG](31974L0408) en [78/932/EEG](31978L0932);

      b. indien zij in gebruik zijn genomen na 19 oktober 2006, voldoen zij voor wat betreft de zijdelings gerichte
      zitplaatsen aan [richtlijn 74/408/EEG](31974L0408) en voor wat betreft de naar voren gerichte zitplaatsen en
      hoofdsteunen daarvan aan de [richtlijnen 74/408/EEG](31974L0408) en [78/932/EEG](31978L0932).

      4 Bij personenauto’s die in gebruik zijn genomen voor 1 januari 1995 moeten:

      a. de zitplaatsen deugdelijk aan het voertuig zijn bevestigd;

      b. verschuifbare zitplaatsen in elke mogelijke stand kunnen worden vergrendeld indien deze personenauto’s na 30
      september 1971 in gebruik zijn genomen;

      c. verstelbare rugleuningen van zitplaatsen in elke mogelijke stand kunnen worden vergrendeld indien deze
      personenauto’s na 30 september 1971 in gebruik zijn genomen;

      d. de voorste zitplaatsen, indien zij scharnierend zijn, dan wel de rugleuningen van de voorste zitplaatsen, indien
      zij scharnierend zijn, in de normale stand automatisch zijn vergrendeld indien deze personenauto’s na 30 september
      1971 in gebruik zijn genomen;

      5 Personenauto’s die in gebruik zijn genomen na 30 september 1998 moeten voor wat betreft de bescherming van de
      inzittenden bij zijdelingse botsingen voldoen aan het bepaalde in [richtlijn 96/27/EG](31996L0027).

      6 Personenauto’s met een toegestane maximum massa van niet meer dan 2500 kg, die in gebruik zijn genomen na 30
      september 1998, moeten voor wat betreft de bescherming van de inzittenden bij frontale botsingen voldoen aan het
      bepaalde in [richtlijn 96/79/EG](31996L0079). Op verzoek van de fabrikant wordt deze eis ook toegepast ten aanzien
      van personenauto’s die in gebruik zijn genomen na 30 september 1998 en waarvan de toegestane maximum massa meer
      bedraagt dan 2500 kg of ten aanzien van personenauto’s die na 30 september 1998 in fasen worden gebouwd.

      7 Het bepaalde in het vijfde en het zesde lid is niet van toepassing op in fasen gebouwde personenauto’s die worden
      vervaardigd in aantallen die niet groter zijn dan is vastgesteld voor kleine series als bedoeld in artikel 8 van
      [richtlijn 70/156/EEG](31970L0156);
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.35
  - number: 3.2.36
    text: |-
      1 Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van bevestigingspunten
      voor autogordels overeenkomstig het bepaalde in [richtlijn 76/115/EEG](31976L0115).

      2 Personenauto’s die in gebruik zijn genomen na 1 januari 1971 doch voor 1 januari 1995, moeten zijn voorzien van
      bevestigingspunten voor autogordels. Deze bevestigingspunten moeten zijn aangebracht ten behoeve van het gebruik
      van autogordels op de zitplaats van de bestuurder en op naast deze plaats aanwezige zitplaatsen, voor zover die
      zitplaatsen aan een portier grenzen. De bevestigingspunten moeten voldoen aan en zijn aangebracht volgens de door
      Onze Minister vastgestelde eisen.

      3 Personenauto’s die in gebruik zijn genomen na 31 december 1989 doch voor 1 januari 1995, moeten tevens zijn
      voorzien van bevestigingspunten voor autogordels voor alle andere naar voren gerichte zitplaatsen dan in het
      tweede lid bedoeld. De bevestigingspunten moeten voldoen aan en zijn aangebracht volgens de door Onze Minister
      vastgestelde eisen.

      4 De aanwezigheid van de in het tweede en derde lid bedoelde bevestigingspunten is niet verplicht voor voertuigen
      die in gebruik zijn genomen voor 1 januari 1995, indien degene die met de afgifte van kentekenbewijzen is belast
      van oordeel is dat er in verband met de bouw of inrichting van het voertuig aanleiding bestaat de verplichting niet
      op het voertuig van toepassing te doen zijn.

      5 Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van autogordels
      overeenkomstig het bepaalde in [richtlijn 77/541/EEG](31977L0541) voor die zitplaatsen die van bevestigingspunten
      voor autogordels zijn voorzien.

      6 Personenauto’s die in gebruik zijn genomen na 1 januari 1971 doch voor 1 januari 1995, waarin bevestigingspunten
      moeten zijn aangebracht ten behoeve van het gebruik van autogordels op de in het tweede en derde lid bedoelde
      zitplaatsen, moeten zijn voorzien van autogordels voor die zitplaatsen. De autogordels moeten voldoen aan de door
      Onze Minister vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.36
  - number: 3.2.37
    text: |-
      1 Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft de naar buiten
      uitstekende delen voldoen aan het bepaalde in [richtlijn 74/483/EEG](31974L0483).

      2 Personenauto’s die in gebruik zijn genomen voor 1 januari 1995, mogen geen scherpe delen hebben die in geval van
      botsing gevaar voor lichamelijk letsel voor andere weggebruikers kunnen opleveren.

      3 Onverminderd het bepaalde in het tweede lid moeten uitstekende delen van bedoelde personenauto’s, die in geval
      van botsing het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn
      afgeschermd.

      4 Het bepaalde in het tweede en derde lid is niet van toepassing op voertuigdelen die zich hoger dan 2,00 m boven
      het wegdek bevinden.

      5 Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten voor wat betreft de bescherming aan de
      achterzijde voldoen aan het bepaalde in [richtlijn 70/221/EEG](31970L0221).

      6 Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van voorzieningen ter
      afscherming van de wielen, welke voldoen aan het bepaalde in [richtlijn 78/549/EEG](31978L0549).

      7 De wielen van personenauto’s die in gebruik zijn genomen voor 1 januari 1995, moeten doelmatig zijn afgeschermd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.37
  - number: 3.2.37a
    text: |-
      1 Personenauto’s met een toegestane maximum massa van niet meer dan 2500 kg die in gebruik worden genomen na 30
      september 2005 moeten voor wat betreft de bescherming van voetgangers voor en bij een botsing voldoen aan punt 3.1
      of 3.2 van bijlage I bij [richtlijn 2003/102/EG](32003L0102).

      2 Personenauto’s met een toegestane maximum massa van niet meer dan 2500 kg die in gebruik worden genomen na 31
      augustus 2010 moeten voor wat betreft de bescherming van voetgangers voor en bij een botsing voldoen aan punt 3.2
      van bijlage I bij [richtlijn 2003/102/EG](32003L0102).

      3 Personenauto’s met een toegestane maximum massa van niet meer dan 3500 kg, die zijn voorzien van een
      frontbeschermingsinrichting en die in gebruik worden genomen na 24 november 2006, voldoen wat betreft de veiligheid
      van voetgangers en andere kwetsbare weggebruikers aan [richtlijn 2005/66/EG](32005L0066).

      4 Het eerste lid is niet van toepassing op voertuigen die, wat de essentiële aspecten van carrosseriebouw
      en ontwerp voor de A-stijlen betreft, niet verschillen van voertuigtypen waarvoor voor 1 oktober 2005 een
      typegoedkeuring is verleend.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.37a
  - number: 3.2.38
    text: |-
      De wielen onderscheidenlijk banden van personenauto’s die in gebruik zijn genomen voor 1 januari 1996 mogen niet
      kunnen aanlopen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.38
  - number: 3.2.39
    text: |-
      Personenauto’s moeten aan de achterzijde zijn voorzien van een mogelijkheid tot bevestiging van een kentekenplaat.
      De bedoelde mogelijkheid moet voor personenauto"s die in gebruik worden genomen na 31 december 1994, voldoen aan
      het bepaalde in [richtlijn 70/222/EEG](31970L0222).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.39
  - number: 3.2.40
    text: |-
      1 Personenauto’s die in gebruik zijn genomen na 31 december 1994 moeten zijn voorzien van verlichtings- en
      lichtsignaalinrichtingen die voldoen aan en zijn geïnstalleerd overeenkomstig het bepaalde in [richtlijn 76/756/
      EEG](31976L0756).

      2 Onze Minister stelt regels vast met betrekking tot de verlichting, lichtsignalen en retroreflecterende
      voorzieningen van personenauto’s die in gebruik zijn genomen voor 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.40
  - number: 3.2.41
    text: |-
      Personenauto’s die in gebruik worden genomen na 31 december 1994, moeten zijn voorzien van:

      a. grote lichten en dimlichten, die voldoen aan het bepaalde in de [richtlijnen 76/756/EEG](31976L0756)en [76/761/
      EEG](31976L0761);

      b. stadslichten die voldoen aan het bepaalde in de [richtlijnen 76/756/EEG](31976L0756) en [76/758/EEG]
      (31976L0758);

      c. richtingaanwijzers en waarschuwingsknipperlichten, die voldoen aan het bepaalde in de [richtlijnen 76/756/EEG]
      (31976L0756) en [76/759/EEG](31976L0759);

      d. zijrichtingaanwijzers die voldoen aan het bepaalde in de [richtlijnen 76/756/EEG](31976L0756)en [76/759/EEG]
      (31976L0759);

      e. achterlichten die voldoen aan het bepaalde in de [richtlijnen 76/756/EEG](31976L0756) en [76/758/EEG]
      (31976L0758);

      f. remlichten die voldoen aan het bepaalde in de [richtlijnen 76/756/EEG](31976L0756) en [76/758/EEG](31976L0758),
      met dien verstande dat een derde remlicht slechts verplicht is indien het voertuig in gebruik is genomen na 30
      september 2000.

      g. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat, die
      voldoet aan het bepaalde in de [richtlijnen 76/756/EEG](31976L0756) en [76/760/EEG](31976L0760);

      h. niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig, die voldoen aan het bepaalde in de
      [richtlijnen 76/756/EEG](31976L0756) en [76/757/EEG](31976L0757);

      i. een of twee mistlichten aan de achterzijde van het voertuig, die voldoen aan het bepaalde in de [richtlijnen
      76/756/EEG](31976L0756) en [77/538/EEG](31977L0538);

      j. een of twee achteruitrijlichten die voldoen aan het bepaalde in de [richtlijnen 76/756/EEG](31976L0756) en
      [77/539/EEG](31977L0539);

      k. markeringslichten die voldoen aan het bepaalde in de [richtlijnen 76/756/EEG](31976L0756) en [76/758/EEG]
      (31976L0758) indien het voertuig breder is dan 2,10 m;

      l. zijmarkeringslichten die voldoen aan het bepaalde in [richtlijnen 76/756/EEG](31976L0756) en [76/758/EEG]
      (31976L0758), indien het voertuig langer is dan 6,00 m;

      m. ambergele retroreflectoren aan de zijkanten van het voertuig, die voldoen aan het bepaalde in de [richtlijnen
      76/756/EEG](31976L0756) en [76/757/EEG](31976L0757), indien het voertuig langer is dan 6,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.41
  - number: 3.2.46
    text: |-
      1 Personenauto’s die in gebruik worden genomen na 31 december 1994, mogen zijn voorzien van:

      a. mistlichten aan de voorzijde van het voertuig, die voldoen aan het bepaalde in de [richtlijnen 76/756/EEG]
      (31976L0756) en [76/762/EEG](31976L0762);

      b. parkeerlichten die voldoen aan het bepaalde in de [richtlijnen 76/756/EEG](31976L0756) en [77/540/EEG]
      (31977L0540), indien het voertuig niet langer is dan 6,00 m en niet breder dan 2,00 m;

      c. zijmarkeringslichten die voldoen aan het bepaalde in [richtlijnen 76/756/EEG](31976L0756) en [76/758/EEG]
      (31976L0758), indien het voertuig niet langer is dan 6,00 m;

      d. ambergele retroreflectoren aan de zijkanten van het voertuig, die voldoen aan het bepaalde in de [richtlijnen
      76/756/EEG](31976L0756) en [76/757/EEG](31976L0757), indien het voertuig niet langer is dan 6,00 m;

      e. witte retroreflectoren aan de voorzijde van het voertuig, die voldoen aan het bepaalde in de [richtlijnen
      76/756/EEG](31976L0756) en [76/757/EEG](31976L0757);

      f. markeringslichten die voldoen aan het bepaalde in de [richtlijnen 76/756/EEG](31976L0756) en [76/758/EEG]
      (31976L0758), indien het voertuig breder is dan 1,80 m, doch niet breder dan 2,10 m;

      g. een derde remlicht dat voldoet aan het bepaalde in [richtlijn 76/756/EEG](31976L0756), indien het voertuig in
      gebruik is genomen voor 1 oktober 2000.

      h. dagrijlichten die voldoen aan het bepaalde in [richtlijnen 76/756/EEG](31976L0756) en [76/758/EEG](31976L0758).

      2 Personenauto’s die in gebruik zijn genomen voor 1 januari 1996 mogen bovendien zijn voorzien van:

      a. een richtlicht;

      b. een bermlicht aan de voorzijde van het voertuig;

      c. werklichten.

      3 Personenauto’s mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra niet-
      driehoekige rode aan de achterzijde en extra ambergele aan de zijkanten van het voertuig, mits deze geen nadelige
      invloed hebben op de effectiviteit van de verplichte lichten en retroreflecterende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.46
  - number: 3.2.48
    text: |-
      1 Het richtlicht en het bermlicht van personenauto’s die in gebruik zijn genomen voor 1 januari 1996 mogen naar
      voren niet anders dan wit of geel licht stralen.

      2 Het derde remlicht mag niet anders dan rood stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.48
  - number: 3.2.50
    text: |-
      Personenauto’s die in gebruik zijn genomen voor 1 januari 1996 mogen, met uitzondering van grote lichten, niet zijn
      voorzien van verblindende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.50
  - number: 3.2.51
    text: |-
      Personenauto’s die in gebruik zijn genomen voor 1 januari 1996 mogen niet zijn voorzien van meer lichten
      en retroreflecterende voorzieningen dan in de [artikelen 3.2.41][ref1] en [3.2.46][ref2] dan wel krachtens
      [artikel 3.2.40, tweede lid][ref3], is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.2.41
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel3.2.46
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel3.2.40
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel3.2.51
    references:
