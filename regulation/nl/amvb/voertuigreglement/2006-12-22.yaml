    text: |-
      1 Met ingang van 4 februari 2005 is het verboden nieuwe personenauto's, bedrijfsauto's of aanhangwagens die ter
      zake van banden niet voldoen aan [richtlijn nr. 92/23/EEG](31992L0023), te koop aan te bieden, af te leveren of in
      te voeren.

      2 Met ingang van 1 oktober 2009 is het verboden nieuwe banden, bestemd voor montage op personenauto's,
      bedrijfsauto's of aanhangwagens, die niet voldoen aan [richtlijn nr. 92/23/EEG](31992L0023), te koop aan te bieden,
      af te leveren of in te voeren.

      3 In afwijking van het tweede lid is het daarin bedoelde verbod voor banden van de klassen C1d en C1e als bedoeld
      in bijlage V, punt 2.4 en 4.2.1, van [richtlijn nr. 92/23/EEG](31992L0023), van toepassing met ingang van 1 oktober
      2010, respectievelijk 1 oktober 2011.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.5
  - number: 1a.6
    text: |-
      1 Het is verboden veiligheidsruiten of materialen voor ruiten, bestemd voor montage op nieuwe personenauto's,
      bedrijfsauto's of aanhangwagens, die niet voldoen aan [richtlijn 92/22/EEG](31992L0022), te koop aan te bieden, af
      te leveren of in te voeren.

      2 Het verbod, bedoeld in het eerste lid, geldt niet voor veiligheidsruiten en materialen voor ruiten:

      a. bestemd voor montage op voertuigen waarop [richtlijn 70/156/EEG](31970L0156) niet van toepassing is of die met
      betrekking tot dit aspect van de toepassing van deze richtlijn zijn vrijgesteld;

      b. die voldoen aan artikel 2, vierde lid van [richtlijn nr. 2001/92/EG](32001L0092) van de Europese Commissie
      van 30 oktober 2001 tot aanpassing aan de technische vooruitgang van [Richtlijn 92/22/EEG](31992L0022) van de
      Raad betreffende veiligheidsruiten en materialen voor ruiten van motorvoertuigen en aanhangwagens daarvan en van
      [Richtlijn 70/156/EEG](31970L0156) van de Raad betreffende de goedkeuring van motorvoertuigen en aanhangwagens
      daarvan (PbEG L 291).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.6
  - number: 1a.7
    text: |-
      1 Het is verboden om radarontvangstapparaten die geschikt zijn om de aanwezigheid aan te tonen van een apparaat dat
      tot doel heeft om een overschrijding van de maximumsnelheid vast te stellen, in te voeren, te koop aan te bieden,
      in voorraad te hebben of af te leveren.

      2 Het eerste lid geldt niet voor de apparaten die in Nederland worden ingevoerd en waarvan door middel van
      handelsbescheiden wordt aangetoond dat de apparaten aansluitend worden uitgevoerd naar een andere lidstaat van de
      Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.7
  - number: 1a.8
    text: |-
      1 Met ingang van 9 mei 2005 is het verboden nieuwe personenauto's te koop aan te bieden, in voorraad te hebben
      of af te leveren, indien deze zijn voorzien van een verwarmingssysteem dat niet voldoet aan [richtlijn 2001/56/
      EG](32001L0056).

      2 Met ingang van 9 mei 2005 is het verboden verwarmingssystemen op brandstof voor personenauto's, bedrijfsauto's
      en aanhangwagens te koop aan te bieden, in voorraad te hebben of af te leveren, indien deze niet voldoen aan
      [richtlijn 2001/56/EG](32001L0056).

      3 Het eerste lid is niet van toepassing op voertuigen waarvoor krachtens artikel 2.2 een goedkeuring is verleend en
      deze voertuigen voldoen aan de krachtens dat artikel gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.8
  - number: 1a.9
    text: |-
      1 Met ingang van 25 mei 2007 is het verboden nieuwe personenauto’s met een toegestane maximum massa van
      niet meer dan 3500 kg of nieuwebedrijfsauto’s met een toegestane maximum massa van niet meer dan 3500 kg,
      niet zijnde bussen, in voorraad te hebben, te koop aan te bieden of af te leveren, indien deze wat betreft
      frontbeschermingsinrichtingen niet voldoen aan [richtlijn 2005/66/EG](32005L0066), en, voor zover daarin is
      voorzien, niet vergezeld gaan van een geldig certificaat van overeenstemming als bedoeld in artikel 7, eerste lid,
      van [richtlijn 70/156/EEG](31970L0156).

      2 Met ingang van 25 mei 2007 is het verboden frontbeschermingsinrichtingen die als technische eenheden bestemd zijn
      voor personenauto’s of bedrijfsauto’s als bedoeld in het eerste lid, in voorraad te hebben, te koop aan te bieden
      of af te leveren, indien deze niet voldoen aan [richtlijn 2005/66/EG](32005L0066).

      3 Met ingang van 31 december 2012 is het verboden nieuwe personenauto’s met een toegestane maximum massa van niet
      meer dan 2500 kg en bedrijfsauto’s die van een personenauto zijn afgeleid, met een toegestane maximummassa van niet
      meer dan 2500 kg te koop aan te bieden, in voorraad te hebben of af te leveren, indien deze niet voldoen aan punt
      3.1 of 3.2 van bijlage I van [richtlijn 2003/102/EG](32003L0102).

      4 Met ingang van 1 september 2015 is het verboden nieuwe personenauto’s met een toegestane maximum massa van niet
      meer dan 2500 kg en bedrijfsauto’s die van een personenauto zijn afgeleid, met een toegestane maximummassa van niet
      meer dan 2500 kg te koop aan te bieden, in voorraad te hebben of af te leveren, indien deze niet voldoen aan punt
      3.2 van bijlage I van [richtlijn 2003/102/EG](32003L0102).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.9
  - number: 1a.10
    text: |-
      1 Het is met ingang van 1 januari 2005 verboden bedrijfsauto’s met een toegestane maximum massa van meer dan 3.500
      kg of bussen te koop aan te bieden, af te leveren of in te voeren, indien de snelheidsbegrenzer of het ingebouwde
      snelheidsbegrenzingssysteem niet voldoet aan het bepaalde in [richtlijn 92/24/EEG](31992L0024).

      2 Het is met ingang van 1 januari 2005 verboden snelheidsbegrenzers of ingebouwde snelheidsbegrenzingssystemen,
      bestemd voor het gebruik in bedrijfsauto’s met een toegestane maximum massa van meer dan 3.500 kg of in bussen, te
      koop aan te bieden, af te leveren of in te voeren, indien deze niet voldoen aan het bepaalde in [richtlijn 92/24/
      EEG](31992L0024).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.10
  - number: 1a.11
    text: |-
      1 Met ingang van 26 januari 2007 is het verboden nieuwe bedrijfsauto’s, met uitzondering van bussen, met een
      toegestane maximum massa van meer dan 3500 kg die ter zake van een inrichting voor indirect zicht niet voldoen aan
      [richtlijn 2003/97/EG](32003L0097) te koop aan te bieden, af te leveren of in te voeren.

      2 Met ingang van 26 januari 2010 is het verboden nieuwe personenauto’s of nieuwe bedrijfsauto’s, met uitzondering
      van bussen, met een toegestane maximum massa van niet meer dan 3500 kg die ter zake van een inrichting voor
      indirect zicht niet voldoen aan [richtlijn 2003/97/EG](32003L0097) te koop aan te bieden, af te leveren of in te
      voeren.

      3 Met ingang van 26 januari 2007 is het verboden nieuwe bussen die ter zake van een inrichting voor indirect zicht
      niet voldoen aan [richtlijn 2003/97/EG](32003L0097) te koop aan te bieden, af te leveren of in te voeren.

      4 Met ingang van 26 januari 2007 is het verboden inrichtingen voor indirect zicht, bestemd voor montage op
      bedrijfsauto’s, met uitzondering van bussen, met een toegestane maximum massa van meer dan 3500 kg, die niet
      voldoen aan [richtlijn 2003/97/EG](32003L0097) te koop aan te bieden, af te leveren of in te voeren.

      5 Met ingang van 26 januari 2010 is het verboden inrichtingen voor indirect zicht, bestemd voor montage op
      personenauto’s of op bedrijfsauto’s, met uitzondering van bussen, met een toegestane maximum massa van niet meer
      dan 3500 kg, die niet voldoen aan [richtlijn 2003/97/EG](32003L0097) te koop aan te bieden, af te leveren of in
      te voeren.

      6 Met ingang van 26 januari 2007 is het verboden inrichtingen voor indirect zicht, bestemd voor montage op bussen,
      die niet voldoen aan [richtlijn 2003/97/EG](32003L0097) te koop aan te bieden, af te leveren of in te voeren.

      7 Het vijfde en het zesde lid zijn niet van toepassing op inrichtingen voor indirect zicht bestemd voor voertuigen
      waarvoor krachtens artikel 2.2 een goedkeuring is verleend en welke voldoen aan de krachtens dat artikel gestelde
      eisen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.11
  - number: 1a.12
    text: |-
      1 Met ingang van 1 januari 2006, of 1 januari 2007 indien het een in fasen gebouwde bedrijfsauto betreft, is het
      verboden nieuwe bedrijfsauto’s met een verbrandingsmotor, niet zijnde bussen, met een toegestane maximum massa van
      niet meer dan 3500 kg en met een referentiemassa als bedoeld in [richtlijn 80/1268/EEG](31980L1268) van niet meer
      dan 1305 kg te koop aan te bieden, in voorraad te hebben of af te leveren, indien deze niet voldoen aan [richtlijn
      80/1268/EEG](31980L1268).

      2 Met ingang van 1 januari 2008, of 1 januari 2009 indien het een in fasen gebouwde bedrijfsauto betreft, is het
      verboden nieuwe bedrijfsauto’s met een verbrandingsmotor, niet zijnde bussen, met een toegestane maximum massa van
      niet meer dan 3500 kg en met een referentiemassa als bedoeld in [richtlijn 80/1268/EEG](31980L1268) van meer dan
      1305 kg doch niet meer dan 3500 kg te koop aan te bieden, in voorraad te hebben of af te leveren, indien deze niet
      voldoen aan [richtlijn 80/1268/EEG](31980L1268).

      3 Het eerste en tweede lid zijn niet van toepassing op bedrijfsauto’s met een verbrandingsmotor, niet zijnde
      bussen, met een toegestane maximum massa van niet meer dan 3500 kg die worden vervaardigd in aantallen die niet
      groter zijn dan tweeduizend per jaar wereldwijd en die zijn voorzien van een motortype waarvoor goedkeuring is
      verleend overeenkomstig [richtlijn 2005/55/EG](32005L0055).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.12
  - number: 1a.13
    text: |-
      1 Met ingang van 1 juli 2009 is het verboden nieuwe landbouw- of bosbouwtrekkers in voorraad te hebben, te koop
      aan te bieden of af te leveren, indien deze niet overeenstemmen met een goedgekeurd type als bedoeld in artikel 4,
      eerste lid, onderdeel a, van [richtlijn 2003/37/EG](32003L0037), en niet vergezeld gaan van een geldig certificaat
      van overeenstemming volgens het model, bedoeld in bijlage III, van die richtlijn.

      2 Met ingang van 1 juli 2009 is het verboden nieuwe systemen, onderdelen of technische eenheden bestemd voor
      landbouw- of bosbouwtrekkers in voorraad te hebben, te koop aan te bieden of af te leveren, indien deze niet
      overeenstemmen met een goedgekeurd type als bedoeld in artikel 4, eerste lid, onderdeel c, van [richtlijn 2003/37/
      EG](32003L0037).
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.13
  - number: 1a.14
    text: |-
      1 Met ingang van 1 januari 2009 is het verboden nieuwe personenauto’s, bedrijfsauto’s en aanhangwagens in voorraad
      te hebben, te koop aan te bieden of af te leveren, indien deze voor wat betreft elektromagnetische compatibiliteit
      niet voldoen aan de bijlagen I tot en met X van [richtlijn 72/245/EEG](31972L0245), en, voor zover daarin is
      voorzien, niet vergezeld gaan van een geldig certificaat van overeenstemming als bedoeld in artikel 7, eerste lid,
      van [richtlijn 70/156/EEG](31970L0156).

      2 Met ingang van 1 januari 2009 is het verboden nieuwe systemen, onderdelen en technische eenheden bestemd voor
      personenauto’s, bedrijfsauto’s en aanhangwagens in voorraad te hebben, te koop aan te bieden of af te leveren,
      indien deze voor wat betreft elektromagnetische compatibiliteit niet voldoen aan de bijlagen I tot en met X van
      [richtlijn 72/245/EEG](31972L0245).

      3 Met ingang van 1 juli 2013 is het verboden personenauto’s, bedrijfsauto’s of aanhangwagens die met 24 GHz-
      kortbereikradarapparatuur zijn uitgerust in voorraad te hebben, te koop aan te bieden of af te leveren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.14
  - number: 1a.15
    text: |-
      1 Met ingang van 20 oktober 2007 is het verboden nieuwe personenauto’s of bedrijfsauto’s in voorraad te hebben,
      te koop aan te bieden of af te leveren, indien deze voor wat betreft de zitplaatsen en de bevestigingen en
      hoofdsteunen daarvan, niet voldoen aan [richtlijn 74/408/EEG](31974L0408) en voorzover daarin is voorzien, niet
      vergezeld gaan van een geldig certificaat van overeenstemming als bedoeld in artikel 7, eerste lid, van [richtlijn
      70/156/EEG](31970L0156).

      2 Het eerste lid is niet van toepassing op nieuwe personenauto’s en bedrijfsauto’s waarvoor krachtens
      [artikel 2.2, eerste lid, onder a][ref1], goedkeuring is verleend en die voldoen aan de krachtens dat artikel
      gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel2.2
