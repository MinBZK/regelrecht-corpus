  - number: '6.7'
    text: |-
      1 Bij vervanging van de motor door een motor met een andere motorcode dan vermeld in het kentekenregister, dan
      wel wijziging van de motorbrandstof van het voertuig, anders dan in- of uitbouw van een brandstofsysteem voor al
      of niet tot vloeistof verdicht gas, moet het voertuig voldoen aan de in de [hoofdstukken 3][ref1] en [5][ref2]
      opgenomen eisen omtrent:

      a. algemeen,

      b. afmetingen en massa’s,

      c. motor,

      d. krachtoverbrenging,

      e. ophanging,

      f. stuurinrichting,

      g. reminrichting, en

      h. verlichting, lichtsignalen en retroreflecterende voorzieningen.

      2 Bij wijziging van de motorbrandstof van het voertuig in een al of niet tot vloeistof verdicht gas moet het
      voertuig voldoen aan de in de [hoofdstukken 3][ref3] en [5][ref4] opgenomen eisen omtrent:

      a. algemeen,

      b. afmetingen en massa’s,

      c. motor, en

      d. verlichting, lichtsignalen en retroreflecterende voorzieningen.

      3 Bij wijziging van de motorbrandstof van een al of niet tot vloeistof verdicht gas naar benzine of diesel moet
      worden voldaan aan de door Onze Minister vastgestelde eisen.


