  - number: 5.4.56
    text: |-
      1 Het dimlicht van motorfietsen moet zodanig zijn afgesteld dat bij controle met een koplamptestapparaat dan wel
      een verlichtingsscherm het geprojecteerde beeld, na fixatie van het apparaat dan wel het scherm, voldoet aan de
      volgende eisen:

      a. het lichte vlak moet zich onder het donkere vlak bevinden;

      b. een duidelijke, geheel of ten dele horizontale scheidingslijn tussen licht en donker moet zichtbaar zijn;

      c. het horizontale gedeelte van de scheidingslijn moet zich bevinden tussen of op de lijnen op het scherm van
      het koplamptestapparaat dan wel op het verlichtingsscherm, die overeenkomen met een daling van de lichtbundel ten
      opzichte van de horizontale middenlijn van de koplamp van 5 tot 40 mm/m;

      d. indien een ten dele horizontale scheidingslijn zichtbaar is:

      1°. moet het horizontale gedeelte van de scheidingslijn zich grotendeels links bevinden van de verticale hartlijn
      op het scherm van het koplamptestapparaat dan wel op het verlichtingsscherm;

      2°. mag het snijpunt van het horizontale en het niet-horizontale gedeelte:

      a. bij controle met een koplamptestapparaat niet links van de verticale hartlijn op het scherm van het
      koplamptestapparaat vallen, dan wel

      b. bij controle met een verlichtingsscherm maximaal 20 mm/m links van de geprojecteerde verticale hartlijn van de
      koplamp op het verlichtingsscherm vallen.

      2 Het voor het dimlicht bestemde deel van de reflector mag zijn oorspronkelijke reflecterende werking niet in
      ernstige mate hebben verloren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.56
  - number: 5.4.57
    text: |-
      1 Motorfietsen mogen zijn voorzien van:

      a. een stadslicht, indien het voertuig in gebruik is genomen voor 1 november 1997;

      b. een mistlicht aan de voorzijde van het voertuig;

      c. een mistlicht aan de achterzijde van het voertuig;

      d. waarschuwingsknipperlichten;

      e. een of twee parkeerlichten, indien het voertuig in gebruik is genomen voor 1 november 1997;

      f. ambergele retroreflectoren aan de voorste zijkanten van het voertuig, ambergele of rode retroreflectoren aan de
      achterste zijkanten van het voertuig;

      g. een witte retroreflector aan de voorzijde van het voertuig, indien het voertuig in gebruik is genomen voor 1
      november 1997;

      h. een richtlicht, indien het voertuig in gebruik is genomen voor 1 november 1997;

      i. een bermlicht aan de voorzijde van het voertuig, indien het voertuig in gebruik is genomen voor 1 november 1997;

      j. werklichten, indien het voertuig in gebruik is genomen voor 1 november 1997.

      2 Lichten die ingevolge [artikel 5.4.51][ref1] verplicht zijn gesteld voor voertuigen die na een in dat artikel
      genoemd tijdstip in gebruik zijn genomen, mogen zijn aangebracht op voertuigen die voor of op dat tijdstip in
      gebruik zijn genomen mits wordt voldaan aan de in [artikel 5.4.53][ref2] met betrekking tot die lichten gestelde
      eisen.

      3 Motorfietsen die in gebruik zijn genomen voor 1 november 1997, mogen zijn voorzien van extra witte
      retroreflecterende voorzieningen aan de voorzijde, extra niet-driehoekige rode aan de achterzijde en extra
      ambergele aan de zijkanten van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.4.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.4.53
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.4.57
