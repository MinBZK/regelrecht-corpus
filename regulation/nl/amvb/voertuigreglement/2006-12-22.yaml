  - number: '9.2'
    text: |-
      Totdat het registratiebewijs is vervangen door een kentekenbewijs, wordt voor de toepassing van dit besluit een
      registratiebewijs dat is afgegeven voor een aanhangwagen met een toegestane maximum massa van meer dan 750 kg,
      gelijkgesteld met een kentekenbewijs.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel9.2
  - number: '9.3'
    text: |-
      1 Indien het kentekenbewijs of het kentekenregister met betrekking tot een voertuig geen gegeven bevat als
      bedoeld in [artikel 5.2.7, eerste of tweede lid][ref1], [artikel 5.2.23][ref2], [artikel 5.3.23][ref3], of
      [artikel 5.4.21][ref4], blijft toepassing van het betrokken artikel of artikellid voor wat betreft het in dat
      artikel of artikellid geregelde aspect ten aanzien van het betrokken voertuig achterwege.

      2 Indien het kentekenregister met betrekking tot een personenauto geen gegeven bevat als bedoeld in
      [artikel 5.2.11, vijfde lid][ref5], wordt voor de toepassing van dat artikellid als ten hoogste toegestaan
      geluidsniveau gehanteerd de ingevolge [artikel 3.2.15][ref6] voor het betrokken voertuig vastgestelde waarde,
      vermeerderd met 2 dB(A).

      3 Indien het kentekenbewijs of het kentekenregister met betrekking tot een bedrijfsauto geen gegeven bevat als
      bedoeld in [artikel 5.3.7, eerste lid][ref7], worden voor de toepassing van dat artikellid als "toegestane maximum
      aslasten" aangemerkt de som van de voor het betrokken voertuig op het kentekenbewijs vermelde "maximum last onder
      de vooras(sen tezamen)" en de "maximum last onder de achteras(sen tezamen)".

      4 Indien het kentekenbewijs of het kentekenregister met betrekking tot een bedrijfsauto geen gegeven bevat als
      bedoeld in [artikel 5.3.7, tweede lid][ref8], wordt voor de toepassing van dat artikellid als "toegestane maximum
      massa" aangemerkt de som van de voor het betrokken voertuig op het kentekenbewijs vermelde "massa ledig voertuig"
      en het "laadvermogen", dan wel de op het kentekenbewijs vermelde "maximum massa beladen voertuig".

      5 Indien het kentekenbewijs of het kentekenregister met betrekking tot een aanhangwagen geen gegeven bevat als
      bedoeld in [artikel 5.12.7, eerste lid][ref9], worden voor de toepassing van dat artikellid als "toegestane maximum
      aslasten" aangemerkt de som van de voor het betrokken voertuig op het registratiebewijs vermelde "maximum druk
      onder de vooras(sen tezamen)" en de "maximum druk onder de achteras(sen tezamen)". Als "last onder de koppeling"
      wordt in dat geval aangemerkt de op het registratiebewijs vermelde "druk onder de koppeling".

      6 Indien het kentekenbewijs of het kentekenregister met betrekking tot een aanhangwagen geen gegeven bevat als
      bedoeld in [artikel 5.12.7, tweede lid][ref10], wordt voor de toepassing van dat artikellid als "toegestane maximum
      massa" aangemerkt de som van het voor het betrokken voertuig op het registratiebewijs vermelde "ledig gewicht" en
      het "laadvermogen", dan wel het op het registratiebewijs vermelde "maximum totaalgewicht".


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.2.7
