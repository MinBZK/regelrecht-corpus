      1 Met ingang van 10 augustus 2003 is het verboden nieuwe bedrijfsauto's, niet zijnde bussen, met een toegestane
      maximum massa van meer dan 3500 kg te koop aan te bieden, af te leveren of in te voeren indien deze niet voldoen
      aan de voorschriften van [richtlijn 2000/40/EG](32000L0040).

      2 Met ingang van 10 augustus 2003 is het verboden beschermingsinrichtingen aan de voorzijde tegen klemrijden als
      bedoeld in [richtlijn 2000/40/EG](32000L0040) te koop aan te bieden, af te leveren of in te voeren als technische
      eenheid, indien deze niet zijn goedgekeurd overeenkomstig [richtlijn 2000/40/EG](32000L0040).
