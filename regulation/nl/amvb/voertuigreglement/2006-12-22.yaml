  - number: 1a.17
    text: |-
      Met ingang van 15 juli 2010 is het verboden nieuwe personenauto’s en bedrijfsauto’s met een maximummassa van
      niet meer dan 3500 kg in voorraad te hebben, te koop aan te bieden of af te leveren, indien deze wat betreft
      herbruikbaarheid, recycleerbaarheid en mogelijke nuttige toepassing niet voldoen aan richtlijn 2005/64/EG.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel1a.17
  - number: '2.1'
    text: |-
      De in [hoofdstuk 3][ref1] genoemde categorieën voertuigen, voertuigonderdelen, uitrustingsstukken en voorzieningen
      ter bescherming van weggebruikers en passagiers dienen te zijn goedgekeurd voor toelating tot het verkeer op de
      weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '3'
  - number: '2.2'
    text: |-
      1 Onze Minister kan bepalen dat goedkeuring kan worden verleend, waarbij niet behoeft te worden voldaan aan de in
      [hoofdstuk 3][ref1] voor de betrokken categorie waartoe het voertuig behoort gestelde eisen, voorzover deze door
      Onze Minister zijn aangewezen, voor:

      a. voertuigen die in een kleine serie als bedoeld in artikel 8 van [richtlijn 70/156/EEG](31970L0156), artikel 15
      van [richtlijn 2002/24/EG](32002L0024) of artikel 9 van [richtlijn 2003/37/EG](32003L0037) worden vervaardigd;

      b. voertuigen waarvoor een goedkeuring voor een individueel voertuig wordt aangevraagd, als bedoeld in
      [artikel 26, eerste lid, van de wet][ref2];

      c. voertuigen die zijn vervaardigd voor een speciaal gebruiksdoel.

      2 Voor het verlenen van goedkeuring aan de voertuigen, bedoeld in het eerste lid, onderdeel c, wordt artikel 4 van
      [richtlijn 70/156/EEG](31970L0156) in acht genomen.

      3 Onze Minister kan bepalen dat voor voertuigen waarin technologieën of concepten zijn verwerkt, die wegens
      hun specifieke aard niet aan een of meer van de voorschriften van EG-richtlijnen kunnen voldoen en waarvan
      bij de keuring niet kan worden vastgesteld dan wel slechts op termijn kan worden vastgesteld of aan de in
      [hoofdstuk 3][ref3] gestelde eisen wordt voldaan, tijdelijke goedkeuring kan worden verleend, waarbij niet behoeft
      te worden voldaan aan de in [hoofdstuk 3][ref4] voor de betrokken categorie waartoe het voertuig behoort gestelde
      eisen, voorzover deze door Onze Minister zijn aangewezen.

      4 Onze Minister kan in de gevallen, bedoeld in het eerste en derde lid, nadere eisen stellen waaraan het voertuig
      moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel2.2
