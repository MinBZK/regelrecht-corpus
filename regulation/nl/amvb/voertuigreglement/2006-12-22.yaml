  - number: '6.1'
    text: |-
      1 De in paragraaf 2 genoemde wijzigingen in de constructie van kentekenplichtige voertuigen, moeten, voor zover
      niet anders is bepaald, zijn goedgekeurd voor toelating van het gewijzigde voertuig tot het verkeer op de weg.

      2 De aangebrachte wijziging moet voor verlening van de goedkeuring voldoen aan de in paragraaf 2 ter zake van de
      betrokken wijziging vermelde eisen, voor zover door Onze Minister nader aangewezen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel6.1
  - number: '6.2'
    text: |-
      1 Op de wijziging in de constructie van een voertuig waarvoor een kentekenbewijs is afgegeven, met uitzondering
      van de inbouw van een brandstofsysteem voor al of niet tot vloeistof verdicht gas, zijn van toepassing de
      toelatingseisen zoals die golden ten tijde van de ingebruikname van het voertuig.

      2 Op de inbouw van een brandstofsysteem voor al of niet tot vloeistof verdicht gas in een motorrijtuig waarvoor een
      kentekenbewijs is afgegeven, zijn van toepassing de toelatingseisen zoals die gelden op de datum van de aanvraag
      van de goedkeuring.

      3 Indien voor het betrokken voertuig nog geen kentekenbewijs is afgegeven, zijn op de wijziging in de bouw of
      inrichting alsmede op de delen waarvoor de wijziging gevolg heeft, van toepassing de toelatingseisen zoals die
      gelden voor nieuwe voertuigen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel6.2
  - number: '6.3'
    text: |-
      1 Indien het voertuig gaat behoren tot een andere voertuigcategorie dan die waarvoor het bij toelating tot het
      verkeer op de weg is goedgekeurd, wordt het voertuig aangemerkt als reeds tot die nieuwe categorie behorend en moet
      het voldoen aan de voor die categorie geldende eisen.

      2 In geval van wijziging van de constructie van een personenauto of bedrijfsauto naar kampeerauto blijft het
      voertuig behoren tot de oorspronkelijke categorie.

      3 Het voertuig moet, onverminderd het bepaalde in [artikel 6.2, tweede lid][ref1], voldoen aan de in de
      [hoofdstukken 3][ref2] en [5][ref3] voor de nieuwe categorie opgenomen eisen zoals die golden ten tijde van de
      ingebruikname van het voertuig in de oorspronkelijke categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel6.2
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '6.2'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006746
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0006746
        hoofdstuk: '5'
  - number: '6.4'
    text: |-
      1 Bij wijziging van de inrichting, zoals vermeld op het kentekenbewijs dan wel in het kentekenregister, van
      voertuigen, niet zijnde motorfietsen, welke geen volledig dragend chassis hebben alsmede bij wijziging van een
      enkele cabine naar een dubbele cabine dan wel van een dubbele naar een enkele cabine, moet het voertuig voldoen
      aan:

      a. de in de [hoofdstukken 3][ref1] en [5][ref2] voor de betrokken voertuigcategorie opgenomen eisen, en

      b. de door Onze Minister vastgestelde eisen met betrekking tot stijfheid en deugdelijkheid van de constructie
      alsmede weggedrag.

      2 Bij wijziging van de inrichting, zoals vermeld op het kentekenbewijs dan wel in het kentekenregister, van
      voertuigen met een volledig dragend chassis, moet het voertuig voldoen aan de in de [hoofdstukken 3][ref3] en
      [5][ref4] opgenomen eisen omtrent:

      a. algemeen,

      b. algemene bouwwijze van het voertuig,

      c. afmetingen en massa’s,

      d. ophanging,

      e. reminrichting,

      f. carrosserie, en

      g. verlichting, lichtsignalen en retroreflecterende voorzieningen.

      3 Bij wijziging van de carrosserie ten behoeve van het gebruik door gehandicapten of het vervoer van gehandicapten
      moet het voertuig voldoen aan de in de [hoofdstukken 3][ref5] en [5][ref6] opgenomen eisen omtrent algemeen,
      carrosserie, motor, ophanging en remmen, met uitzondering van de eisen betreffende:

      a. de constructie, plaatsing, verstelbaarheid, afmetingen en het gezichtsveld van spiegels,

      b. de inrichting, de sterkte en de bevestiging van naar voren gerichte zitplaatsen,

      c. hoofdsteunen,

      d. bevestigingspunten voor autogordels, en

      e. autogordels,

      voor zover noodzakelijk voor het gebruik door of het vervoer van een gehandicapte,

      alsmede de door Onze Minister vastgestelde eisen met betrekking tot stijfheid en deugdelijkheid van de constructie
      alsmede het weggedrag.

      4 In afwijking van het derde lid, zijn bij een wijziging van de carrosserie ten behoeve van het gebruik door
      gehandicapten of het vervoer van gehandicapten, de in de [hoofdstukken 3][ref7] en [5][ref8] opgenomen eisen
      omtrent de onderdelen b, d en e, van het derde lid, wel van toepassing op bussen die na 12 februari 2004 in gebruik
      zijn genomen.

      5 Bij wijziging van het voertuig dat in gebruik is genomen na 31 mei 2004, zodanig dat het aantal zitplaatsen als
      vermeld op het kentekenbewijs dan wel in het kentekenregister wordt overschreden, moet het voertuig voldoen aan de
      in de [hoofdstukken 3][ref9] en [5][ref10] opgenomen eisen omtrent:

      a. algemeen, en

      b. carrosserie.


