  - number: 5.1.6
    text: |-
      Het is de bestuurder van een motorrijtuig verboden daarmee te rijden en de eigenaar of houder verboden daarmee
      te laten rijden, indien in of aan het motorrijtuig een radarontvangstapparaat aanwezig is, dat geschikt is om de
      aanwezigheid aan te tonen van een apparaat dat tot doel heeft om een overschrijding van de maximumsnelheid vast
      te stellen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.1.6
  - number: 5.2.1
    text: |-
      Personenauto’s moeten voldoen aan de volgende eisen:

      a. het voertuig moet in overeenstemming zijn met de op het voor het voertuig afgegeven kentekenbewijs en in het
      kentekenregister omtrent het voertuig vermelde gegevens;

      b. het identificatienummer moet op een vast voertuigdeel zijn ingeslagen en moet goed leesbaar zijn;

      c. de kentekenplaten moeten zijn voorzien van het in [artikel 5 van het Kentekenreglement][ref1] voorgeschreven
      goedkeuringsmerk en moeten deugdelijk aan de voor- en achterzijde van het voertuig zijn bevestigd;

      d. het kenteken moet goed leesbaar zijn en de kentekenplaten mogen niet zijn afgeschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel5
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.2.1
    references:
