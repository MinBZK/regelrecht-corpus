  - number: 5.6.57
    text: |-
      1 Bromfietsen op twee wielen mogen zijn voorzien van:

      a. een of twee grote lichten;

      b. een of twee stadslichten;

      c. twee richtingaanwijzers aan de voorzijde en twee richtingaanwijzers aan de achterzijde en
      waarschuwingsknipperlichten;

      d. een of twee remlichten;

      e. ambergele retroreflectoren aan de zijkanten van het voertuig;

      f. vier ambergele retroreflectoren aan de trappers voor zover de bromfiets is voorzien van niet-intrekbare
      trappers;

      g. een installatie ter verlichting van de aan achterzijde van het voertuig aangebrachte kentekenplaat;

      h. een naar voren gerichte witte retroreflector.

      2 Bromfietsen op drie of vier wielen mogen zijn voorzien van:

      a. een of twee grote lichten indien de breedte van het voertuig 1,30 m of minder bedraagt en twee grote lichten
      indien de breedte van het voertuig meer dan 1,30 m bedraagt;

      b. twee richtingaanwijzers aan de voorzijde en twee richtingaanwijzers aan de achterzijde en
      waarschuwingsknipperlichten indien het voertuig niet is voorzien van een gesloten carrosserie;

      c. een installatie ter verlichting van de aan achterzijde van het voertuig aangebrachte kentekenplaat;

      d. ambergele retroreflectoren aan de zijkanten van het voertuig;

      e. naar voren gerichte witte retroreflectoren;

      f. twee mistlichten aan de voorzijde van het voertuig;

      g. een of twee mistlichten aan de achterzijde van het voertuig;

      h. een of twee achteruitrijlichten;

      i. een derde remlicht.

      3 Bromfietsen mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra rode aan
      de achterzijde en extra ambergele aan de zijkanten van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.57
  - number: 5.6.58
    text: |-
      1 Zijspanwagens, verbonden aan een bromfiets, mogen zijn voorzien van:

      a. een stadslicht aan de uiterste buitenzijde van het voertuig op ten minste 0,35 m en ten hoogste 1,20 m boven
      het wegdek;

      b. een achterlicht;

      c. richtingaanwijzers en waarschuwingsknipperlichten;

      d. een remlicht;

      e. een naar voren gerichte witte retroreflector aan de voorzijde van het voertuig, aangebracht aan de uiterste
      buitenzijde op ten minste 0,40 m en ten hoogste 1,20 m boven het wegdek;

      f. ambergele retroreflectoren aan de zijkanten van het voertuig.

      2 Zijspanwagens mogen zijn voorzien van extra witte retroreflecterende voorzieningen aan de voorzijde, extra rode
      aan de achterzijde en extra ambergele aan de zijkanten van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.58
  - number: 5.6.59
    text: |-
      1 Het grote licht het mistlicht aan de voorzijde, het achteruitrijlicht en het stadslicht mogen niet anders dan wit
      of geel stralen.

      2 Het achterlicht het mistlicht aan de achterzijde, het derde remlicht en het remlicht mogen niet anders dan rood
      stralen.

      3 Richtingaanwijzers en waarschuwingsknipperlichten mogen niet anders dan ambergeel stralen.

      4 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.

      5 [Artikel 5.6.55, tweede, derde en vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.6.55
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.59
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.6.55
        hoofdstuk: '5'
        paragraaf: '10'
        afdeling: '6'
  - number: 5.6.64
    text: |-
      1 Bromfietsen mogen, met uitzondering van groot licht, niet zijn voorzien van verblindende verlichting.

      2 Bromfietsen mogen, met uitzondering van de richtingaanwijzers en de waarschuwingsknipperlichten, niet zijn
      voorzien van knipperende verlichting.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.64
  - number: 5.6.65
    text: |-
      Bromfietsen mogen niet zijn voorzien van meer lichten en retroreflecterende voorzieningen dan in de
      [artikelen 5.6.51][ref1], [5.6.52][ref2], [5.6.57][ref3] en [5.6.58][ref4] is voorgeschreven of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.6.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.6.52
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel5.6.57
      [ref4]: https://wetten.overheid.nl/BWBR0006746#Artikel5.6.58
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.6.65
