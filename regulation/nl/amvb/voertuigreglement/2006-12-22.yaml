  - number: 5.9.71
    text: Fietsen moeten zijn voorzien van een goed werkende bel.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.9.71
  - number: 5.10.1
    text: Gehandicaptenvoertuigen moeten zijn voorzien van een identificatienummer dat goed leesbaar is.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.1
  - number: 5.10.3
    text: |-
      1 De langs- en dwarsliggers en chassisversterkingsdelen van het chassisraam, dan wel de daarvoor in de plaats
      tredende delen van de mee- of zelfdragende carrosserie van gehandicaptenvoertuigen mogen:

      a. geen breuken of scheuren vertonen;

      b. niet zodanig zijn bevestigd, vervormd of door corrosie aangetast, dat de stijfheid en de sterkte van het
      chassisraam of van de mee- of zelfdragende carrosserie in gevaar worden gebracht.

      2 Indien het gehandicaptenvoertuig is opgebouwd uit een frame met voor- of achtervork mogen deze onderdelen:

      a. geen breuken of scheuren vertonen;

      b. niet zijn doorgeroest;

      c. niet zodanig zijn vervormd dat de stijfheid en de sterkte ervan in gevaar worden gebracht.

      3 De onderdelen die deel uitmaken van het frame of van de zelfdragende constructie moeten deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.3
  - number: 5.10.4
    text: De bovenbouw van gehandicaptenvoertuigen moet deugdelijk op het onderstel dan wel het frame zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.4
  - number: 5.10.6
    text: |-
      Gehandicaptenvoertuigen mogen:

      a. niet langer zijn dan 3,50 m;

      b. niet breder zijn dan 1,10 m;

      c. niet hoger zijn dan 2,00 m.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.6
  - number: 5.10.9
    text: |-
      1 Alle onderdelen van het brandstofsysteem dan wel van de elektrische aandrijving van gehandicaptenvoertuigen
      moeten veilig zijn en deugdelijk zijn bevestigd.

      2 Het brandstofsysteem mag geen lekkage vertonen.

      3 De vulopening van het brandstofreservoir moet zijn afgesloten met een passende tankdop.

      4 Gehandicaptenvoertuigen met een verbrandingsmotor moeten zijn voorzien van een voorziening voor het regelen van
      de snelheid van het voertuig alsmede van een vanuit de zitpositie van de bestuurder zichtbare brandstofniveaumeter,
      tenzij het voertuig is voorzien van een brandstoftank met reservestand.

      5 Gehandicaptenvoertuigen met een elektromotor moeten zijn voorzien van een:

      a. aan- en uitschakelaar voor de elektromotor;

      b. schakelaar voor het regelen van de snelheid van het voertuig; alsmede van een vanuit de zitpositie van de
      bestuurder zichtbare:

      c. aanduiding omtrent de ladingsconditie van de tractiebatterijen;

      d. aan- en uitindicator voor de elektrische installatie.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.9
  - number: 5.10.11
    text: |-
      1 Gehandicaptenvoertuigen met een verbrandingsmotor moeten zijn voorzien van een uitlaatsysteem dat over de gehele
      lengte gasdicht is, met uitzondering van de afwateringsgaatjes.

      2 Het uitlaatsysteem moet deugdelijk zijn bevestigd.

      3 Het uitlaatsysteem moet behoorlijk geluiddempend zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.11
  - number: 5.10.12
    text: |-
      1 De accu dan wel de tractiebatterij van gehandicaptenvoertuigen moet deugdelijk zijn bevestigd.

      2 De bedrading vang gehandicaptenvoertuigen moet deugdelijk zijn bevestigd en goed zijn geïsoleerd.

      3 Gehandicaptenvoertuigen met elektrische aandrijving moeten zijn voorzien van een beveiliging tegen overbelasting.
      Na een onderbreking van de stroomvoorziening moet de bestuurder deze door middel van een schakelaar, welke zich
      binnen het bereik van de bestuurder bevindt, kunnen herstellen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.12
  - number: 5.10.13
    text: |-
      1 Motorsteunen van gehandicaptenvoertuigen moeten deugdelijk aan het chassis dan wel aan de carrosserie alsmede aan
      de motor zijn bevestigd.

      2 De motorsteunen mogen niet in ernstige mate zijn beschadigd, de rubbers mogen niet zijn doorgescheurd en de
      vulcanisatie mag niet geheel zijn losgeraakt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.13
  - number: 5.10.14
    text: Gehandicaptenvoertuigen moeten zijn voorzien van een inrichting om achteruit te rijden.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.14
  - number: 5.10.16
    text: De onderdelen van de krachtoverbrenging van gehandicaptenvoertuigen moeten deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.16
  - number: 5.10.17
    text: |-
      Bij gehandicaptenvoertuigen met een verbrandingsmotor moet de krachtoverbrenging tussen motor en wielen op
      eenvoudige wijze kunnen worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.17
  - number: 5.10.18
    text: |-
      1 De assen van gehandicaptenvoertuigen moeten deugdelijk aan het voertuig zijn bevestigd en mogen geen breuken of
      scheuren vertonen.

      2 De assen mogen niet zodanig zijn vervormd dat de sterkte ervan in gevaar wordt gebracht.

      3 De assen mogen niet zodanig zijn beschadigd of vervormd dat het weggedrag nadelig wordt beïnvloed.

      4 De assen mogen niet zodanig door corrosie zijn aangetast, dat de sterkte ervan in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.18
  - number: 5.10.24
    text: |-
      1 De wielen onderscheidenlijk velgen van gehandicaptenvoertuigen mogen geen breuken, scheuren, ondeugdelijk laswerk
      of ernstige vervorming vertonen.

      2 De wielen onderscheidenlijk velgen moeten met alle daarvoor bestemde bevestigingsmiddelen deugdelijk zijn
      bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.24
  - number: 5.10.27
    text: |-
      1 De wielen van gehandicaptenvoertuigen moeten zijn voorzien van luchtbanden.

      2 De banden mogen geen beschadigingen vertonen waarbij het karkas zichtbaar is.

      3 De banden mogen geen uitstulpingen vertonen.

      4 Over de gehele omtrek en breedte van het loopvlak van de banden moet profilering aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.27
  - number: 5.10.28
    text: |-
      1 Indien het gehandicaptenvoertuig is voorzien van een veersysteem, moet dit goed werken.

      2 De onderdelen van het veersysteem mogen geen breuken of scheuren vertonen en moeten deugdelijk zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.28
  - number: 5.10.29
    text: |-
      1 Gehandicaptenvoertuigen moeten zijn voorzien van een deugdelijke stuurinrichting.

      2 De bestuurde wielen van gehandicaptenvoertuigen moeten goed reageren op de beweging van het bedieningsorgaan van
      de stuurinrichting.

      3 De voor de overbrenging van de stuurbeweging bestemde onderdelen moeten deugdelijk zijn bevestigd met alle
      daarvoor bestemde bevestigings- en borgmiddelen, mogen geen breuken of scheuren vertonen, mogen niet zijn vervormd
      en mogen niet ernstig door corrosie zijn aangetast.

      4 Kruiskoppelingen moeten een zichtbaar spelingsvrije overbrenging kunnen bewerkstelligen.

      5 Flexibele koppelingen mogen niet in ernstige mate zijn gescheurd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.29
  - number: 5.10.31
    text: |-
      1 Gehandicaptenvoertuigen moeten zijn voorzien van een reminrichting waarvan de onderdelen:

      a. deugdelijk zijn bevestigd met de daarvoor bestemde bevestigings- en borgmiddelen;

      b. niet in ernstige mate door corrosie zijn aangetast;

      c. niet zijn beschadigd, gescheurd of gebroken;

      d. geen inwendige of uitwendige lekkage vertonen.

      2 Het oppervlak van het rempedaal moet stroef zijn.

      3 Remslangen mogen:

      a. niet in ernstige mate zijn misvormd;

      b. niet langs andere voertuigdelen schuren;

      c. geen zodanige beschadigingen vertonen dat het wapeningsmateriaal zichtbaar is.

      4 De remtrommel of remschijf mag tijdens het remmen niet worden geraakt door delen die zijn bestemd als drager of
      bevestigingsmiddel van remvoering.

      5 De noodzakelijke bewegingsvrijheid van de remonderdelen mag niet worden beperkt.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.31
  - number: 5.10.32
    text: |-
      1 Gehandicaptenvoertuigen die niet zijn voorzien van een toegankelijk remvloeistofreservoir waarvan het
      vloeistofpeil te controleren is zonder het reservoir te openen, moeten zijn voorzien van:

      a. een deugdelijke waarschuwingsinrichting die in werking treedt zodra het niveau van de remvloeistof onder het
      vereiste minimum niveau is gedaald, of

      b. in geval van een gescheiden remsysteem, een deugdelijke waarschuwingsinrichting die in werking treedt zodra één
      van de kringen van het remsysteem faalt.

      2 De goede werking van het signaal van de in het eerste lid bedoelde waarschuwingsinrichtingen moet kunnen worden
      gecontroleerd.

      3 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.32
  - number: 5.10.38
    text: |-
      1 Gehandicaptenvoertuigen moeten zijn voorzien van een bedrijfsrem:

      a. die op alle wielen werkt;

      b. waarvan de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 4,0 m/
      s2 bedraagt.

      2 Het voertuig mag door het remmen geen zijwaartse beweging maken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.38
  - number: 5.10.39
    text: |-
      1 Gehandicaptenvoertuigen moeten zijn voorzien van een parkeerrem die op ten minste twee wielen werkt.

      2 De parkeerrem van gehandicaptenvoertuigen moet het voertuig op een helling van 16,0% in beide richtingen
      in stilstand kunnen houden. Hieraan wordt geacht te zijn voldaan indien de remvertraging, uitgaande van een
      aanvangssnelheid van 15 km/h, op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 1,2 m/
      s2 bedraagt en de rem ook in achterwaartse richting functioneert.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.39
  - number: 5.10.41
    text: |-
      1 De deuren van gehandicaptenvoertuigen moeten goed sluiten. De deuren die direkt toegang geven tot de
      personenruimte, moeten op normale wijze vanaf de binnenzijde en vanaf de buitenzijde kunnen worden geopend.

      2 Het slot en de scharnieren van de motorkap of het kofferdeksel aan de voorzijde van het voertuig moeten een goede
      sluiting waarborgen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.41
  - number: 5.10.42
    text: |-
      1 De ruiten van gehandicaptenvoertuigen moeten uit gelaagd of gehard glas dan wel uit plastisch materiaal bestaan.

      2 De voorruit en de zijruiten van gehandicaptenvoertuigen mogen:

      a. geen beschadigingen of verkleuringen vertonen,

      b. niet zijn voorzien van onnodige voorwerpen,

      die het uitzicht van de bestuurder belemmeren.

      3 Indien het gehandicaptenvoertuig niet is voorzien van een rechterbuitenspiegel, mag de achterruit:

      a. geen beschadigingen of verkleuringen vertonen,

      b. niet zijn voorzien van onnodige voorwerpen,

      die het uitzicht van de bestuurder belemmeren.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.42
  - number: 5.10.43
    text: |-
      Gehandicaptenvoertuigen met een voorruit moeten zijn voorzien van een goed werkende ruitenwisserinstallatie die de
      bestuurder voldoende uitzicht geeft, alsmede van een goed werkende ruitensproeierinstallatie.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.43
  - number: 5.10.44
    text: |-
      Gehandicaptenvoertuigen met een voorruit moeten zijn voorzien van een goed werkende installatie ter ontdooiing en
      ontwaseming van de voorruit.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.44
  - number: 5.10.45
    text: |-
      1 Gehandicaptenvoertuigen moeten zijn voorzien van een linkerbuitenspiegel en van een binnenspiegel.

      2 Gehandicaptenvoertuigen moeten zijn voorzien van een rechterbuitenspiegel indien met de verplichte binnenspiegel
      het achter het voertuig gelegen weggedeelte niet voldoende kan worden overzien. Indien de binnenspiegel geen zicht
      naar achteren mogelijk maakt, behoeft deze niet aanwezig te zijn.

      3 De aan de zijde van de bestuurder bevestigde buitenspiegel moet vanuit de binnenzijde bij gesloten portier kunnen
      worden versteld. Deze eis geldt niet voor een spiegel die na door een duw te zijn omgeklapt, zonder verstelling in
      de oorspronkelijke stand kan worden teruggebracht.

      4 De spiegels moeten deugdelijk zijn bevestigd.

      5 Het spiegelglas van de verplichte spiegels mag geen verschijnselen van breuk vertonen en mag niet in ernstige
      mate zijn verweerd.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.45
  - number: 5.10.46
    text: |-
      De zitplaatsen van gehandicaptenvoertuigen moeten deugdelijk aan het voertuig zijn bevestigd. De
      verstelinrichtingen van de zitplaatsen moeten goed kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.46
  - number: 5.10.48
    text: |-
      1 Gehandicaptenvoertuigen mogen geen scherpe delen hebben die in geval van botsing gevaar voor lichamelijk letsel
      voor andere weggebruikers kunnen opleveren.

      2 Onverminderd het bepaalde in het eerste lid moeten uitstekende delen van gehandicaptenvoertuigen, die in geval
      van botsing het gevaar voor lichamelijk letsel voor andere weggebruikers aanzienlijk kunnen vergroten, zijn
      afgeschermd.

      3 De wielen onderscheidenlijk banden van gehandicaptenvoertuigen moeten goed zijn afgeschermd en mogen niet
      aanlopen.

      4 Een reservewielhouder die zich aan de buitenzijde van het gehandicaptenvoertuig bevindt, moet deugdelijk zijn
      bevestigd. Indien in de houder een reservewiel is geplaatst, moet dat wiel goed zijn opgesloten.

      5 Geen deel van de buitenzijde van het gehandicaptenvoertuig mag zodanig zijn bevestigd, beschadigd, versleten of
      door corrosie zijn aangetast, dat gevaar bestaat voor losraken.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.48
  - number: 5.10.51
    text: |-
      Gehandicaptenvoertuigen moeten zijn voorzien van:

      a. twee grote lichten;

      b. twee dimlichten;

      c. twee stadslichten;

      d. twee richtingaanwijzers aan de voorzijde en twee richtingaanwijzers aan de achterzijde, of twee
      richtingaanwijzers aan de zijkanten, en met ingang van 1 januari 2005, waarschuwingsknipperlichten;

      e. twee achterlichten;

      f. twee remlichten;

      g. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.51
  - number: 5.10.53
    text: |-
      1 De grote lichten, de dimlichten en de stadslichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers en waarschuwingsknipperlichten mogen naar voren niet anders dan ambergeel of wit en naar
      achteren niet anders dan ambergeel of rood stralen.

      3 De achterlichten en de mistlichten aan de achterzijde mogen niet anders dan rood stralen.

      4 De remlichten mogen niet anders dan rood of ambergeel stralen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.53
  - number: 5.10.54
    text: |-
      1 De grote lichten moeten aan de voorzijde van het voertuig zijn aangebracht op een hoogte van niet minder dan 0,35
      m en niet meer dan 1,20 m boven het wegdek.

      2 De dimlichten en de stadslichten moeten aan de voorzijde van het voertuig zijn aangebracht:

      a. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m, dan wel indien het voertuig niet breder is dan 0,80 m, op een zo groot mogelijke onderlinge afstand;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,20 m boven het wegdek.

      3 De richtingaanwijzers en de waarschuwingsknipperlichten moeten zijn aangebracht:

      a. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m, dan wel indien het voertuig niet breder is dan 0,80 m, op een zo groot mogelijke onderlinge afstand;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,20 m boven het wegdek.

      4 De achterlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m, dan wel indien het voertuig niet breder is dan 0,80 m, op een zo groot mogelijke onderlinge afstand;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,20 m boven het wegdek.

      5 De remlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m, dan wel indien het voertuig niet breder is dan 0,80 m, op een zo groot mogelijke onderlinge afstand;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,20 m boven het wegdek.

      6 De niet-driehoekige rode retroreflectoren moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een onderlinge afstand, gemeten tussen de binnenranden van het lichtdoorlatende gedeelte, van niet minder dan
      0,60 m, dan wel indien de grootste breedte van het voertuig minder bedraagt dan 0,80 m, op een zo groot mogelijke
      onderlinge afstand;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,20 m boven het wegdek.

      7 Het mistlicht of de mistlichten aan de achterzijde van het voertuig moeten op een hoogte van niet minder dan 0,35
      m en niet meer dan 1,00 m boven het wegdek zijn aangebracht. Indien één licht is aangebracht, moet dit links van
      het midden van het voertuig zijn geplaatst. Indien het voertuig is uitgerust met één achterwiel, moet het mistlicht
      in het midden van het voertuig zijn geplaatst. De afstand tot het remlicht moet ten minste 0,10 m bedragen.
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.54
  - number: 5.10.55
    text: |-
      1 De in [artikel 5.10.51][ref1] bedoelde lichten moeten goed werken.

      2 De verlichtingsarmaturen en de onderdelen daarvan moeten deugdelijk aan het voertuig zijn bevestigd.

      3 De glazen van de verlichtingsarmaturen mogen niet zodanig zijn beschadigd, gerepareerd of bewerkt dat de
      lichtopbrengst en het lichtbeeld dan wel de functie nadelig worden beïnvloed.

      4 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig zijn bevestigd.

      5 De in [artikel 5.10.51][ref2] bedoelde lichten en retroreflectoren mogen niet zijn afgeschermd.

      6 De retroreflectoren mogen geen gebreken vertonen, die de retroreflectie beïnvloeden.

      7 Onze Minister kan regels vaststellen omtrent het bepaalde in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.10.51
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.10.51
    url: https://wetten.overheid.nl/BWBR0006746/2006-12-22#Artikel5.10.55
