      te koop aan te bieden of af te leveren, indien deze voor wat betreft de bevestigingspunten voor veiligheidsgordels
      niet voldoen aan [richtlijn 76/115/EEG](31976L0115) en voorzover daarin is voorzien, niet vergezeld gaan van
