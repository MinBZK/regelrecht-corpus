  - number: 9a
    text: |-
      1 De gemeentelijke gezondheidsdiensten, bedoeld in [artikel 14, tweede lid, van de Wet publieke gezondheid][ref1],
      in de regio’s Utrecht, Groningen, Rotterdam-Rijnmond, Amsterdam-Amstelland en Twente, genoemd in de [bijlage]
      (onbekend), bedoeld in [artikel 8 van de Wet veiligheidsregio’s][ref2], en de openbare lichamen Bonaire, Sint
      Eustatius en Saba, kunnen op verzoek van betrokkenen met een portalapplicatie een vaccinatiecertificaat als
      bedoeld in artikel 3, eerste lid, onderdeel a, van de verordening op papier of digitaal verstrekken en de daarvoor
      noodzakelijke persoonsgegevens verwerken.

      2 Het verzoek, bedoeld in het eerste lid:

      a. kan worden gedaan door eenieder die in een lidstaat van de Europese Unie is gevaccineerd met een:

      1°. vaccin dat is goedgekeurd door het College ter beoordeling van geneesmiddelen, het Europees Medicijn Agentschap
      of de Wereldgezondheidsorganisatie;

      2°. in artikel 5, vijfde lid, van de verordening, bedoeld COVID-19 vaccin; of

      3°. met een vaccin dat bij ministeriële regeling is aangewezen;

      b. wordt in persoon gedaan, waarbij betrokkene zich legitimeert aan de hand van een geldig
      identiteitsdocument, bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref3] of
      [artikel 2 van de Wet identificatieplicht BES][ref4]; en

      c. gaat vergezeld van een betrouwbaar vaccinatiebewijs waarop in ten minste in de officiële taal of talen van de
      lidstaat van afgifte, de persoonsgegevens, bedoeld in artikel 5, tweede lid, van de verordening zijn vermeld en dat
      is voorzien van een logo of kenmerk van een instituut of arts.

      3 In het geval de persoon in kwestie bij het verzoek aangeeft gebruik te willen maken van de reeds geregistreerde
      vaccinatiegegevens die staan opgenomen in het digitale patiëntendossier, zijn in afwijking van het tweede lid, de
      eisen onder b en c, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0028575#Artikel2
