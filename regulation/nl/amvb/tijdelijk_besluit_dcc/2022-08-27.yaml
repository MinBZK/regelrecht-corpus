preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 17 september 2021, kenmerk 3253941-
    1015144-WJZ;

    Gelet op artikel 6ba, eerste en tweede lid, van de Wet publieke gezondheid;

    De Afdeling advisering van de Raad van State gehoord (advies van 22 september 2021, no. W13.21.0287/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 28 september 2021, kenmerk
    3259308-1015144-WJZ;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *applicatie:* door de minister beschikbaar gestelde applicatie, waaronder een mobiele applicatie, een
      webapplicatie en een portalapplicatie;
        - *betrokkene:* persoon waarop het certificaat betrekking heeft;
        - *certificaat:* vaccinatiecertificaat, testcertificaat of herstelcertificaat;
        - *CIBG:* agentschap Centraal Informatiepunt Beroepen Gezondheidszorg, bedoeld in
      [artikel 1 van het Instellingsbesluit agentschap Centraal Informatiepunt Beroepen Gezondheidszorg][ref1];
        - *CIMS:* COVID-vaccinatie Informatie- en Monitoringsysteem van het RIVM;
        - *gemeentelijke gezondheidsdienst:* gemeentelijke gezondheidsdienst als bedoeld in
      [artikel 14 van de Wet publieke gezondheid][ref2] of de afdeling publieke gezondheid van het openbare lichaam
      Bonaire, Sint Eustatius of Saba;
        - *herstelcertificaat:* certificaat als bedoeld in artikel 3, eerste lid, onder c, van de verordening;
        - *minister:* Minister van Volksgezondheid, Welzijn en Sport;
        - *testcertificaat:* certificaat als bedoeld in artikel 3, eerste lid, onder b, van de verordening;
        - *tester:* zorgaanbieder als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref3], of als bedoeld in
      [artikel 1, onder j, van de Wet zorginstellingen BES][ref4], die een test op infectie met het virus SARS-CoV-2
      heeft uitgevoerd waarvan de uitslag wordt opgenomen in een testcertificaat of een herstelcertificaat;
        - *vaccinatiecertificaat:* certificaat als bedoeld in artikel 3, eerste lid, onder a, van de verordening;
        - *vaccineerder:* zorgaanbieder als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref5], of als bedoeld in
      [artikel 1, onder j, van de Wet zorginstellingen BES][ref6], die een vaccin tegen het virus SARS-CoV-2 heeft
      toegediend dat wordt opgenomen in een vaccinatiecertificaat;
        - *verordening:* [verordening (EU) 2021/953](32853R2021) van het Europees Parlement en de Raad van 14 juni 2021
      betreffende een kader voor de afgifte, verificatie en aanvaarding van interoperabele COVID-19-vaccinatie-, test-
      en herstelcertificaten (digitaal EU-COVID-certificaat) teneinde het vrije verkeer tijdens de COVID-19-pandemie te
      faciliteren (PbEU 2021, L 211/1);
        - *wet:* [Wet publieke gezondheid][ref7].


