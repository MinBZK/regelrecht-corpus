  - number: '2'
    text: |-
      Dit besluit is, met uitzondering van [artikel 8, tweede lid][ref1], mede van toepassing in de openbare lichamen
      Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0045651#Artikel8
    url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0045651
        artikel: '8'
  - number: '3'
    text: Een certificaat wordt uitsluitend op verzoek van betrokkene aangemaakt.
    url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#Artikel3
  - number: '4'
    text: |-
      1 Een certificaat wordt voorzien van een digitale handtekening van de minister.

      2 De minister is verwerkingsverantwoordelijke voor het verwerken van de persoonsgegevens, waaronder in ieder geval
      de persoonsgegevens uit de bijlage van de verordening, voor zover dit noodzakelijk is voor het verstrekken van een
      certificaat en voor de werking van de applicatie.
    url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#Artikel4
  - number: '5'
    text: |-
      De tester die een test op infectie met het virus SARS-CoV-2 heeft uitgevoerd waarvan de uitslag negatief is, draagt
      er op verzoek van betrokkene, gedaan met een mobiele applicatie of webapplicatie, zorg voor dat de persoonsgegevens
      die nodig zijn voor het aanmaken van een testcertificaat op zodanige wijze verstrekt worden dat betrokkene door
      middel van de:

      a. mobiele applicatie een digitaal testcertificaat kan aanmaken;

      b. webapplicatie een testcertificaat kan aanmaken om op papier af te drukken.
    url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#Artikel5
  - number: '6'
    text: |-
      1 Het RIVM of, indien het RIVM niet in CIMS over de benodigde persoonsgegevens beschikt, de vaccineerder dan
      wel, indien het vaccin is toegediend in de openbare lichamen Bonaire, Sint Eustatius of Saba, de desbetreffende
      gemeentelijke gezondheidsdienst draagt er op verzoek van betrokkene, gedaan met een mobiele applicatie of
      webapplicatie, zorg voor dat de persoonsgegevens die nodig zijn voor het aanmaken van een vaccinatiecertificaat op
      zodanige wijze verstrekt worden dat betrokkene door middel van de:

      a. mobiele applicatie een digitaal vaccinatiecertificaat kan aanmaken;

      b. webapplicatie een vaccinatiecertificaat kan aanmaken om op papier af te drukken.

      2 Indien bij het aanmaken van een vaccinatiecertificaat met de mobiele applicatie of de webapplicatie uit
      raadpleging van bestanden met persoonsgegevens waarover de gemeentelijke gezondheidsdienst beschikt uit hoofde van
      de uitvoering van testen op infectie met het virus SARS-CoV-2, van op deze applicaties aangesloten registraties als
      bedoeld in [artikel 29, eerste lid, van de wet][ref1] van infecties met dat virus of van bij ministeriële regeling
      te bepalen bestanden met persoonsgegevens, blijkt dat betrokkene geïnfecteerd is geweest met het virus SARS-CoV-
      2, wordt de vaccinatiecyclus reeds als voltooid aangemerkt na toediening van de eerste dosis van een vaccinatie die
      uit twee doses bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel29
    url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '29'
  - number: '7'
    text: |-
      1 De tester die een test op infectie met het virus SARS-CoV-2 heeft uitgevoerd waarvan de uitslag positief
      is, draagt er op verzoek van betrokkene, gedaan met een mobiele applicatie of webapplicatie, zorg voor dat de
      persoonsgegevens die nodig zijn voor het aanmaken van een herstelcertificaat op zodanige wijze verstrekt worden dat
      betrokkene door middel van de:

      a. mobiele applicatie een digitaal herstelcertificaat kan aanmaken;

      b. webapplicatie een herstelcertificaat kan aanmaken om op papier af te drukken.

      2 Voor het aanmaken van een herstelcertificaat met de mobiele applicatie of de webapplicatie kunnen worden
      geraadpleegd op deze applicaties aangesloten registraties als bedoeld in [artikel 29, eerste lid, van de wet][ref1]
      van infecties met dat virus of bij ministeriële regeling te bepalen bestanden met persoonsgegevens waaruit blijkt
      dat betrokkene is getest op infectie met het virus SARS-CoV-2 en de uitslag van de test positief is.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel29
    url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '29'
  - number: '8'
    text: |-
      1 Op verzoek van betrokkene wordt een testcertificaat op papier verstrekt door de tester die een test op infectie
      met het virus SARS-CoV-2 heeft uitgevoerd waarvan de uitslag negatief is, een vaccinatiecertificaat op papier
      door de vaccineerder of, indien het vaccin is toegediend in de openbare lichamen Bonaire, Sint Eustatius of Saba,
      de desbetreffende gemeentelijke gezondheidsdienst, en een herstelcertificaat op papier door de tester die een
      test op infectie met het virus SARS-CoV-2 heeft uitgevoerd waarvan de uitslag positief is. De daarvoor benodigde
      persoonsgegevens worden verwerkt met een portalapplicatie.

      2 Een vaccinatiecertificaat of herstelcertificaat op papier kan voorts op telefonisch of schriftelijk verzoek van
      betrokkene per post worden verstrekt door het CIBG door middel van een portalapplicatie, indien:

      a. betrokkene identificerende persoonsgegevens kan verstrekken;

      b. de daarvoor benodigde persoonsgegevens beschikbaar zijn gesteld door de vaccineerder respectievelijk de tester
      die een test op infectie met het virus SARS-CoV-2 heeft uitgevoerd waarvan de uitslag positief is; en

      c. betrokkene is ingeschreven in de basisregistratie personen.

      3 [Artikel 6, tweede lid][ref1], is van overeenkomstige toepassing op een vaccinatiecertificaat als bedoeld in het
      eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045651#Artikel6
    url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045651
        artikel: '6'
  - number: '9'
    text: |-
      1 De gemeentelijke gezondheidsdiensten, bedoeld in [artikel 14, tweede lid, van de wet][ref1], in de regio’s
      Utrecht, Groningen, Rotterdam-Rijnmond, Twente, en Amsterdam-Amstelland, genoemd in de [bijlage](onbekend), bedoeld
      in [artikel 8 van de Wet veiligheidsregio’s][ref2], en de openbare lichamen Bonaire, Sint Eustatius of Saba
      kunnen op verzoek van betrokkene met een portalapplicatie een vaccinatiecertificaat als bedoeld in artikel 8,
      eerste lid, van de verordening op papier verstrekken en de daarvoor noodzakelijke persoonsgegevens verwerken.

      2 Het verzoek, bedoeld in het eerste lid:

      a. kan worden gedaan door een in het Europese deel van Nederland of in een van de openbare lichamen Bonaire, Sint
      Eustatius of Saba woonachtige betrokkene of door een in een derde land woonachtige betrokkene met de Nederlandse
      nationaliteit;

      b. wordt in persoon of op een bij ministeriele regeling te bepalen wijze onder daarbij te stellen voorwaarden
      gedaan, waarbij betrokkene zich legitimeert aan de hand van een geldig identiteitsdocument als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref3] of [artikel 2 van de Wet identificatieplicht BES][ref4]; en

      c. gaat vergezeld van een betrouwbaar vaccinatiebewijs waarop in het Nederlands, Engels, Duits, Frans, Italiaans,
      Portugees of Spaans de in een vaccinatiecertificaat als bedoeld in artikel 8, eerste lid, van de verordening op te
      nemen persoonsgegevens zijn vermeld en dat is voorzien van een logo of kenmerk van een instituut of arts.

      3 Een vaccinatiecertificaat als bedoeld in artikel 8, eerste lid, van de verordening wordt uitsluitend verstrekt
      voor een vaccin dat is goedgekeurd door het College ter beoordeling van geneesmiddelen, het Europees Medicijn
      Agentschap of de Wereldgezondheidsorganisatie of voor een vaccin dat bij ministeriële regeling is aangewezen.

      4 [Artikel 6, tweede lid][ref5], is van overeenkomstige toepassing op een vaccinatiecertificaat als bedoeld in
      artikel 8, eerste lid, van de verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel14
