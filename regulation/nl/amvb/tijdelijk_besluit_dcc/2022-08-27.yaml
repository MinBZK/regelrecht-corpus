  - number: '10'
    text: |-
      Betrokkene kan zijn persoonsgegevens, opgenomen op papier uitgegeven certificaat, met de mobiele applicatie
      verwerken om een digitaal certificaat aan te maken.
    url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#Artikel10
  - number: '11'
    text: |-
      Personen en organisaties die verplicht of bevoegd zijn te verifiëren of betrokkene beschikt over een bepaald
      certificaat of een daarmee ingevolge artikel 3, tiende lid, of 8, tweede lid, van de verordening gelijk gesteld
      certificaat, verwerken de daartoe noodzakelijke persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#Artikel11
  - number: '12'
    text: |-
      Personen en organisaties verwerken bij de uitvoering van de verordening en dit besluit de gegevens en
      persoonsgegevens die noodzakelijk zijn voor het realiseren van de gegevensuitwisseling ter uitvoering van de
      verordening en dit besluit.
    url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#Artikel12
  - number: 12a
    text: |-
      Een certificaat wordt als ongeldig aangemerkt indien het is opgenomen in een door de Minister van Volksgezondheid,
      Welzijn en Sport aangelegde lijst van certificaten waarvan bij de Minister van Volksgezondheid, Welzijn en Sport
      het gegronde vermoeden bestaat dat handelingen zijn verricht met of met betrekking tot het certificaat, die het
      vertrouwen in het certificaat hebben geschaad of zullen schaden.
    url: https://wetten.overheid.nl/BWBR0045651/2022-08-27#Artikel12a
  - number: '13'
    text: |-
      Dit besluit treedt in werking op 1 oktober 2021 en vervalt op het tijdstip waarop [artikel 6ba van de wet][ref1]
      vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6ba
