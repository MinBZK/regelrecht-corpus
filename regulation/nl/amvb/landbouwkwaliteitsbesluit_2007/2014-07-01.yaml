  - number: '2'
    text: |-
      Bij het in de handel brengen of etiketteren van of reclame maken voor producten wordt slechts verwezen naar de
      biologische productiemethode en wordt het logo, bedoeld in artikel 25 van verordening (EG) 834/2007, slechts
      gebruikt indien is voldaan aan het bepaalde bij of krachtens verordening (EG) 834/2007 en bij of krachtens dit
      besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel2
  - number: '3.1'
    text: |-
      Wijn en gearomatiseerde wijn die in voorverpakkingen binnen de in punt 1 van de bijlage bij richtlijn 2007/45/
      EG vermelde intervallen zijn verpakt, worden slechts in de handel gebracht indien zij zijn verpakt in de nominale
      hoeveelheden vermeld in punt 1 van die bijlage.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid is niet van toepassing op voorverpakkingen die in belastingvrije winkels worden verkocht voor
      consumptie buiten de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel3
  - number: '3.3'
    text: |-
      Bij twee of meer individuele voorverpakkingen die samen een meervoudige verpakking vormen, zijn de in het eerste
      lid bedoelde nominale hoeveelheden van toepassing op elke individuele voorverpakking.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel3
  - number: '3.4'
    text: |-
      Indien een voorverpakking bestaat uit twee of meer individuele verpakkingen die niet voor individuele verkoop zijn
      bestemd, zijn de in het eerste lid bedoelde nominale hoeveelheden van toepassing op de voorverpakking.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel3
  - number: '4.1'
    text: |-
      Groenten en fruit worden slechts in de handel gebracht indien voldaan is artikel 113 bis en aan de krachtens
      artikel 113, eerste lid, onderdeel b, van verordening (EG) 1234/2007 vastgestelde voorschriften en de bij of
      krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel4
  - number: '4.2'
    text: |-
      Bananen worden slechts in de handel gebracht indien voldaan is aan de krachtens artikel 113, eerste lid onderdeel
      d en tweede lid, van verordening (EG) 1234/2007 vastgestelde voorschriften en bij of krachtens dit besluit gestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel4
  - number: '4.3'
    text: |-
      Krenten en rozijnen worden slechts in de handel gebracht indien voldaan is aan artikel 1 van verordening (EG)
      1666/99 en bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel4
  - number: '6'
    text: |-
      De bescherming van kwaliteitsaanduidingen geschiedt overeenkomstig het bij of krachtens verordening (EU) 1151/2012
      bepaalde en de bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel6
  - number: '9'
    text: |-
      Teeltmateriaal van bloembollen wordt slechts in de handel gebracht indien voldaan is aan de artikelen 3 tot en met
      9 van richtlijn 98/56/EG en bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister kan nadere regels stellen voor zover dat voor een goede uitvoering van de onderwerpen van de in de
      [artikelen 2][ref1], [4][ref2] en [6][ref3] genoemde EU-verordeningen en voor de in [artikel 9][ref4] genoemde
      EU-richtlijn noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022535#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022535#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0022535#Artikel9
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022535
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022535
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0022535
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0022535
        artikel: '9'
  - number: '10.2'
    text: 'De regels bedoeld in het eerste lid kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel10
  - number: 10.2.a
    text: |-
      de in [artikel 2, eerste en tweede lid, van de Landbouwkwaliteitswet][ref1] bedoelde onderwerpen;


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel2
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '2'
  - number: 10.2.b
    text: de erkenning of certificering van onder die regeling vallende betrokkenen;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel10
  - number: 10.2.c
    text: de wijze van keuring van producten;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel10
  - number: 10.2.d
    text: |-
      het uitreiken, aanbrengen, vervaardigen, voorhanden en in voorraad hebben, alsmede het afleveren en gebruiken van
      bewijsstukken en merken;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel10
  - number: 10.2.e
    text: |-
      de nadere aanduiding van het begrip bloembollen, bedoeld in [artikel 1, onder r][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel1
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022535
        artikel: '1'
  - number: '10.3'
    text: |-
      Onze Minister kan vrijstelling en, op aanvraag, ontheffing verlenen van het bepaalde bij of krachtens dit besluit
      voor zover het belang van een goede uitvoering van de in het eerste lid bedoelde EU-verordeningen en EU-richtlijn
      zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel10
  - number: '10.4'
    text: |-
      De wijze van keuring van producten, bedoeld in het tweede lid, onder c, heeft onder meer betrekking op de
      voorwaarden waaronder betrokkenen door de controle-instellingen of door een controlerende instantie erkend kunnen
      worden voor het verrichten van de bij ministeriële regeling aan te duiden keuringsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel10
  - number: '11'
    text: 'De Stichting BKD is de instantie, bedoeld in de artikelen 12 en 13 van richtlijn 98/56/EG en belast met:'
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel11
  - number: 11.a
    text: |-
      het toezicht op de naleving van bij of krachtens dit besluit gestelde regels ten aanzien van teeltmateriaal van
      bloembollen;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel11
  - number: 11.b
    text: de keuring van teeltmateriaal van bloembollen;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel11
  - number: 11.c
    text: de uitvoering van de registratie, bedoeld in artikel 6 van richtlijn 98/56/EG;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel11
  - number: 11.d
    text: |-
      overige uitvoeringshandelingen die noodzakelijk zijn voor een goede uitvoering van de in de aanhef bedoelde
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel11
  - number: '14.1'
    text: |-
      De Stichting KCB is de controle-instantie, bedoeld in artikel 9, eerste lid, onderdeel b, van verordening (EU)
      543/2011, en belast met:
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel14
  - number: 14.1.a
    text: |-
      het toezicht op de naleving van bij of krachtens dit besluit gestelde regels ten aanzien van groenten en fruit,
      bananen en krenten en rozijnen;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel14
  - number: 14.1.b
    text: |-
      het uitreiken van bewijsstukken, bedoeld in artikel 14, eerste lid, van verordening (EU) 543/2011, indien is
      voldaan aan artikel 113 bis, en de handelsnormen, gesteld krachtens artikel 113, eerste lid, onderdeel b, van
      verordening (EG) 1234/2007;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel14
  - number: 14.1.c
    text: de uitvoering van de registratie, bedoeld in artikel 7, tweede lid, van verordening (EG) 2898/95;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel14
  - number: 14.1.d
    text: |-
      overige uitvoeringshandelingen die noodzakelijk zijn voor een goede uitvoering van de onder b en c bedoelde
      verordeningen.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel14
  - number: '14.2'
    text: |-
      De Stichting KCB is de bevoegde autoriteit, bedoeld in de artikelen 36 en 37 van verordening (EU) 1151/2012 alsmede
      voor de controles, bedoeld in artikel 38, van verordening (EU) 1151/2012 ten aanzien van producten die op grond van
      het eerste lid onder haar bevoegdheid vallen.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel14
  - number: '15'
    text: |-
      De Stichting Skal is de instantie, bedoeld in artikel 27, vierde lid, onder a, van verordening (EG) 834/2007 en
      belast met:
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel15
  - number: 15.a
    text: |-
      het toezicht op de naleving van bij of krachtens dit besluit gestelde regels ten aanzien de biologische
      productiemethoden en van productiemethoden die bij ministeriële regeling daaraan gelijkgesteld zijn;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel15
  - number: 15.b
    text: uitvoering van de registratie, bedoeld in artikel 28 van verordening (EG) 834/2007;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel15
  - number: 15.c
    text: |-
      overige uitvoeringshandelingen die noodzakelijk zijn voor een goede uitvoering van de in de aanhef bedoelde
      verordening.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel15
  - number: '17.1'
    text: 'Onze Minister is de bevoegde autoriteit, voor:'
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel17
  - number: 17.1.a
    text: |-
      de artikelen 36 en 37 van verordening (EU) 1151/2012 alsmede voor de controle, bedoeld in artikel 38, van
      verordening (EU) 1151/2012 ten aanzien van producten die naar hun aard niet onder de bevoegdheid van de Stichting
      KCB, bedoeld in artikel 14, tweede lid, vallen;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel17
  - number: 17.1.b
    text: artikel 27, eerste lid, van verordening (EG) nr. 834/2007;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel17
  - number: 17.1.c
    text: artikel 34 van verordening (EU) 1151/2012;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel17
  - number: 17.1.d
    text: het toezicht op de naleving van bij dit besluit gestelde regels inzake wijn en gearomatiseerde wijn.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel17
  - number: '17.2'
    text: |-
      In afwijking van het eerste lid is de Stichting Skal de bevoegde autoriteit, bedoeld in artikel 17, eerste lid,
      onderdeel a, en artikel 28, eerste lid, onderdeel a, van verordening (EG) nr. 834/2007.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel17
  - number: '18'
    text: 'Bij ministeriële regeling kan ter uitvoering van dit besluit medewerking worden gevorderd van:'
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel18
  - number: 18.a
    text: het bestuur van het Hoofdproductschap Akkerbouwproducten;
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel18
  - number: 18.b
    text: het bestuur van het Productschap Tuinbouw.
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel18
  - number: '19'
    text: 'De volgende besluiten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel19
  - number: 19.a
    text: |-
      [Landbouwkwaliteitsbesluit biologische productiemethode][ref1];


