preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 1 juni 2007, Directie Juridische
    Zaken, no. TRCJZ/2007/1788;

    Gelet op verordening (EEG) nr. 2092/91 van de Raad van de Europese Gemeenschappen van 24 juni 1991 inzake de
    biologische produktiemethode en aanduidingen dienaangaande op landbouwproducten en levensmiddelen (PbEG L 198),
    verordening (EEG) nr. 1906/90 van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van
    handelsnormen voor vlees van pluimvee (PbEG L 173), verordening (EEG) nr. 1538/91 van de Commissie van 5 juni 1991
    houdende uitvoeringsbepalingen van verordening (EEG) nr. 1906/90 van de Raad tot vaststelling van handelsnormen
    voor vlees van pluimvee (PbEG L 143), verordening (EG) nr. 1028/2006 van de Raad van de Europese Gemeenschappen
    van 19 juni 2006 betreffende bepaalde handelsnormen voor eieren (PbEU L 186), verordening (EG) nr. 557/2007 van
    de Commissie van 23 mei 2007 tot vaststelling van de bepalingen ter uitvoering van verordening (EG) nr. 1028/2006
    van de Raad betreffende bepaalde handelsnormen voor eieren (PbEU L 132), verordening (EEG) nr. 2200/96 van de
    Raad van de Europese Gemeenschappen van 28 oktober 1996 houdende een gemeenschappelijke ordening der markten
    in de sector groenten en fruit (PbEG L 297), verordening (EG) nr. 1666/1999 van de Commissie van 28 juli 1999
    houdende toepassingsbepalingen van Verordening (EG) nr. 2201/96 van de Raad betreffende de minimumkenmerken voor
    het in de handel brengen van bepaalde krenten- en rozijnenvariëteiten (PbEG L 197), verordening (EEG) nr. 404/93
    van de Raad van de Europese Gemeenschappen van 13 februari 1993 houdende een gemeenschappelijke ordening der
    markten in de sector bananen (PbEG L 47), verordening (EG) nr. 2257/1994 van de Commissie van 16 september 1994
    tot vaststelling van kwaliteitsnormen voor bananen (PbEG L 245), verordening (EG) 2898/95 van de Commissie van 15
    december 1995 houdende voorschriften inzake de controle op de naleving van de kwaliteitsnormen in de sector bananen
    (PbEG L 304) , verordening (EG) 1148/2001 van de Commissie van 12 juni 2001 betreffende de handelsnormcontroles
    voor verse groenten en fruit (PbEG L 156), verordening (EG) nr. 509/2006 van de Raad van de Europese Unie van
    20 maart 2006 inzake gegarandeerde traditionele specialiteiten voor landbouwproducten en levensmiddelen (PbEU
    L 93), verordening (EG) nr. 510/2006 van de Raad van de Europese Unie van 20 maart 2006 inzake de bescherming
    van geografische aanduidingen en oorsprongsbenamingen van landbouwproducten en levensmiddelen (PbEU L 93),
    verordening (EG) nr. 1760/2000 van het Europees Parlement en de Raad van de Europese Gemeenschappen van 17 juli
    2000 tot vaststelling van een identificatie- en registratieregeling voor runderen en inzake de etikettering
    van rundvlees en rundvleesproducten en tot intrekking van Verordening (EG) nr. 820/97 van de Raad (PbEG L 204),
    richtlijn nr. 1998/56/EG van de Raad van de Europese Unie van 20 juli 1998 betreffende het in de handel brengen
    van teeltmateriaal van siergewassen (PbEG L 226) en richtlijn nr. 1992/52/EEG van de Raad van de Europese
    Gemeenschappen van 18 juni 1992 inzake volledige zuigelingenvoeding en opvolgzuigelingenvoeding die voor de uitvoer
    naar derde landen is bestemd (PbEG L 179);

    Gelet op de artikelen 2, 3, 4, 7 en 8 van de Landbouwkwaliteitswet;

    De Raad van State gehoord (advies van 3 augustus 2007, nr. W11.07.0161/IV);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 14 september 2007,
    TRCJZ/2007/2718;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - wet: [Landbouwkwaliteitswet][ref1];
        - in de handel brengen: in het vrije verkeer bedrijfsmatig ter beschikking of in voorraad houden, uitstallen of
      te koop aanbieden, verkopen, bezitten met het oog op de verkoop, alsmede tegen of zonder vergoeding aan derden
      beschikbaar stellen, leveren of overdragen;
        - verordening (EG) 834/2007: verordening (EG) nr. 834/2007 van de Raad van 28 juni 2007 inzake de biologische
      productie en de etikettering van biologische producten en tot intrekking van Verordening (EEG) nr. 2092/91 (PbEU
      L 189);
        - verordening (EG) 2257/94: verordening (EG) nr. 2257/94 van de Commissie van 16 september 1994 tot vaststelling
      van kwaliteitsnormen voor bananen (PbEG L 245);
        - verordening (EG) 2898/95: verordening (EG) nr. 2898/95 van de Commissie van 15 december 1995 houdende
      voorschriften inzake de controle op de naleving van de kwaliteitsnormen in de sector bananen (PbEG L 304);
        - verordening (EG) 1666/99: verordening (EG) nr. 1666/1999 van de Commissie van 28 juli 1999 houdende
      toepassingsbepalingen van Verordening (EG) nr. 2201/96 van de Raad betreffende de minimumkenmerken voor het in de
      handel brengen van bepaalde krenten- en rozijnenvariëteiten (PbEG L 197);
        - verordening (EU) 543/2011: uitvoeringsverordening (EU) nr. 543/2011 van de Commissie van 7 juni 2011 tot
      vaststelling van nadere bepalingen voor de toepassing van Verordening (EG) nr. 1234/2007 van de Raad, wat de
      sectoren groenten en fruit en verwerkte groenten en fruit betreft (PbEU 2011, L 157);
        - verordening (EU) 1151/2012: verordening (EU) nr. 1151/2012 van het Europees Parlement en de Raad van 21 november
      2012 inzake kwaliteitsregelingen voor landbouwproducten en levensmiddelen (PbEU 2012, L 343);
        - verordening (EG) 1234/2007: verordening (EG) nr. 1234/2007 van de Raad van 22 oktober 2007 houdende een
      gemeenschappelijke ordening van de landbouwmarkten en specifieke bepalingen voor een aantal landbouwproducten (PbEU
      L 299);
        - richtlijn 98/56/EG: richtlijn nr. 1998/56/EG van de Raad van de Europese Unie van 20 juli 1998 betreffende het in
      de handel brengen van teeltmateriaal van siergewassen (PbEG L 226);
        - richtlijn 2007/45/EG: richtlijn 2007/45/EG van het Europees Parlement en de Raad van 5 september 2007 tot
      vaststelling van regels betreffende nominale hoeveelheden voor voorverpakte producten, tot intrekking van de
      Richtlijnen 75/106/EEG en 80/232/EEG van de Raad en tot wijziging van Richtlijn 76/211/EEG van de Raad (PbEU 2007,
      L 247);
        - wijn: niet-mousserende wijn, gele wijn, mousserende wijn en likeurwijn als bedoeld in punt 2 van de bijlage bij
      richtlijn 2007/45/EG;
        - gearomatiseerde wijn: gearomatiseerde wijn als bedoeld in punt 2 van de bijlage bij richtlijn 2007/45/EG;
        - biologische productiemethode: voortbrenging van plantaardige producten overeenkomstig de bij of krachtens
      verordening (EG) 834/2007 gestelde voorschriften;
        - teeltmateriaal van bloembollen: teeltmateriaal als bedoeld in artikel 2, eerste lid, van richtlijn 98/56/EG,
      van bloembollen;
        - groenten en fruit: groenten en fruit als bedoeld in artikel 1, eerste lid, onderdeel i, van verordening (EG)
      1234/2007;
        - bananen: bananen als bedoeld in artikel 1, eerste lid, onderdeel k, van verordening (EG) 1234/2007;
        - krenten en rozijnen: krenten en rozijnen als bedoeld in de bijlage, onder 1, van verordening (EG) 1666/99;
        - kwaliteitsaanduidingen: geografische aanduidingen, geografische oorsprongsbenamingen, gegarandeerde traditionele
      specialiteiten als bedoeld in artikel 18 van verordening (EU) 1151/2012 en facultatieve kwaliteitsaanduidingen als
      bedoeld in titel IV van verordening (EU) 1151/2012;
        - derde landen: gebied dat geen deel uitmaakt van het grondgebied van de Europese Unie of een gebied waarop de
      Overeenkomst betreffende de Europese Economische Ruimte niet van toepassing is;
        - Stichting KCB: Stichting Kwaliteits-Controle-Bureau te ’s-Gravenhage;
        - Stichting Skal: Stichting Skal te Zwolle;
        - Stichting BKD: Stichting Bloembollenkeuringsdienst te Lisse.


      [ref1]: https://wetten.overheid.nl/BWBR0002755
    url: https://wetten.overheid.nl/BWBR0022535/2014-07-01#Artikel1
