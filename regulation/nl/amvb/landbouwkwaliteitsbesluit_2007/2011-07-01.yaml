  - number: '2'
    text: |-
      Bij het in de handel brengen of etiketteren van of reclame maken voor producten wordt slechts verwezen naar de
      biologische productiemethode en wordt het logo, bedoeld in artikel 25 van verordening (EG) 834/2007, slechts
      gebruikt indien is voldaan aan het bepaalde bij of krachtens verordening (EG) 834/2007 en bij of krachtens dit
      besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel2
  - number: '3'
    text: |-
      Eieren worden slechts in de handel gebracht indien voldaan is aan artikel 116 en Bijlage XIV A, punten II, III en
      IV van verordening (EG) 1234/2007 en de artikelen 2, 4, 5 tot en met 23 en 29 van verordening (EG) 589/2008.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel3
  - number: '4'
    text: |-
      1 Groenten en fruit worden slechts in de handel gebracht indien voldaan is artikel 113 bis en aan de krachtens
      artikel 113, eerste lid, onderdeel b, van verordening (EG) 1234/2007 vastgestelde voorschriften en de bij of
      krachtens dit besluit gestelde regels.

      2 Bananen worden slechts in de handel gebracht indien voldaan is aan de krachtens artikel 113, eerste lid onderdeel
      d en tweede lid, van verordening (EG) 1234/2007 vastgestelde voorschriften en bij of krachtens dit besluit gestelde
      regels.

      3 Krenten en rozijnen worden slechts in de handel gebracht indien voldaan is aan artikel 1 van verordening (EG)
      1666/99 en bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel4
  - number: '5'
    text: |-
      Vlees van pluimvee wordt slechts in de handel gebracht indien voldaan is aan artikel 116 en Bijlage XIV B, punten
      II, III en IV van verordening (EG) 1234/2007 en de artikelen 3 tot en met 20 van verordening (EG) 543/2008 en de
      bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel5
  - number: '6'
    text: |-
      De bescherming van oorsprongsbenamingen en geografische aanduidingen, alsmede de bescherming als gegarandeerde
      traditionele specialiteit van landbouwproducten en levensmiddelen geschiedt overeenkomstig de bepalingen van
      verordening (EG) 509/2006 en verordening (EG) 510/2006 en bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel6
  - number: '7'
    text: |-
      Handelaren en organisaties als bedoeld in artikel 12 van verordening (EG) 1760/2000 die rundvlees etiketteren als
      bedoeld in artikel 11, tweede onderdeel, voldoen aan titel II, deel II van deze verordening en bij of krachtens dit
      besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel7
  - number: 7a
    text: |-
      1 Marktdeelnemers als bedoeld in Bijlage XI bis punt IV, onderdeel 1 van verordening (EG) 1234/2007 voldoen aan
      artikel 113 ter en Bijlage XI bis, punten II, III, IV, VI en VIII van verordening (EG) 1234/2007 en de artikelen 3,
      4 en 5 van verordening (EG) 566/2008.

      2 Marktdeelnemers die vlees van runderen die niet ouder zijn dan twaalf maanden in niet-voorverpakte vorm in de
      detailhandel aanbieden aan de eindverbruiker vermelden bij de aanduiding van het vlees de slachtleeftijd van de
      dieren overeenkomstig Bijlage XI bis, punt IV, eerste lid, onderdeel a, van verordening (EG) 1234/2007 en bezigen
      de verkoopbenaming overeenkomstig Bijlage XI bis, punt III, tweede lid, van verordening (EG) 1234/2007.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel7a
  - number: '8'
    text: |-
      Volledige zuigelingenvoeding en opvolgzuigelingenvoeding worden slechts uit Nederland uitgevoerd naar derde landen
      indien voldaan is aan artikel 3 van richtlijn 92/52/EEG en bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel8
  - number: '9'
    text: |-
      Teeltmateriaal van bloembollen wordt slechts in de handel gebracht indien voldaan is aan de artikelen 3 tot en met
      9 van richtlijn 98/56/EG en bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel9
  - number: '10'
    text: |-
      1 Onze Minister kan nadere regels stellen voor zover dat voor een goede uitvoering van de onderwerpen van de in
      de artikelen 2 tot en met 7a genoemde Europese verordeningen en voor de in artikelen 8 en 9 genoemde Europese
      richtlijnen noodzakelijk is.

      2 De regels bedoeld in het eerste lid kunnen betrekking hebben op:

      a. de in [artikel 2, eerste en tweede lid, van de Landbouwkwaliteitswet][ref1] bedoelde onderwerpen;

      b. de erkenning of certificering van onder die regeling vallende betrokkenen;

      c. de wijze van keuring van producten;

      d. het uitreiken, aanbrengen, vervaardigen, voorhanden en in voorraad hebben, alsmede het afleveren en gebruiken
      van bewijsstukken en merken;

      e. de nadere aanduiding van het begrip bloembollen, bedoeld in [artikel 1, onder r][ref2].

      3 Onze Minister kan vrijstelling en, op aanvraag, ontheffing verlenen van het bepaalde bij of krachtens dit
      besluit voor zover het belang van een goede uitvoering van de in het eerste lid bedoelde Europese verordeningen en
      richtlijnen zich daartegen niet verzet.

      4 De wijze van keuring van producten, bedoeld in het tweede lid, onder c, heeft onder meer betrekking op de
      voorwaarden waaronder betrokkenen door de controle-instellingen of door een controlerende instantie erkend kunnen
      worden voor het verrichten van de bij ministeriële regeling aan te duiden keuringsactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022535#Artikel1
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022535
        artikel: '1'
  - number: '11'
    text: |-
      De Stichting BKD is de instantie, bedoeld in de artikelen 12 en 13 van richtlijn 98/56/EG en belast met:

      a. het toezicht op de naleving van bij of krachtens dit besluit gestelde regels ten aanzien van teeltmateriaal
      van bloembollen;

      b. de keuring van teeltmateriaal van bloembollen;

      c. de uitvoering van de registratie, bedoeld in artikel 6 van richtlijn 98/56/EG;

      d. overige uitvoeringshandelingen die noodzakelijk zijn voor een goede uitvoering van de in de aanhef bedoelde
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel11
  - number: '12'
    text: |-
      De Stichting COKZ is belast met:

      a. het toezicht op de naleving van bij of krachtens dit besluit gestelde regels ten aanzien vanvolledige
      zuigelingenvoeding en opvolgzuigelingenvoeding die voor de uitvoer naar derdelanden zijn bestemd;

      b. overige uitvoeringshandelingen die noodzakelijk zijn voor een goede uitvoering van richtlijn 92/52/EEG.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel12
  - number: '13'
    text: |-
      De Stichting CPE is de instantie, bedoeld in artikel 15, tweede lid, van verordening (EG) 543/2008 en artikel 24,
      eerste lid, van verordening (EG) 589/2008 en belast met:

      a. het toezicht op de naleving van bij of krachtens dit besluit gestelde regels ten aanzien van eieren en ten
      aanzien van vlees van pluimvee;

      b. de uitvoering van de erkenning en het verstrekken van de code, bedoeld in artikel 5, tweede lid, van verordening
      (EG) 589/2008;

      c. de uitvoering van de registratie van slachterijen die op grond van artikel 11, eerste lid, van verordening (EG)
      543/2008 het houderijsysteem bij de etikettering van de producten vermelden als bedoeld in artikel 12, eerste lid,
      van verordening (EG) 543/2008;

      d. overige uitvoeringshandelingen die noodzakelijk zijn voor een goede uitvoering van de in de aanhef bedoelde
      verordeningen.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel13
  - number: '14'
    text: |-
      De Stichting KCB is de controle-instantie, bedoeld in artikel 8, eerste lid, onderdeel b, van verordening (EG)
      1580/2007, en belast met:

      a. het toezicht op de naleving van bij of krachtens dit besluit gestelde regels ten aanzien van groenten en fruit,
      bananen en krenten en rozijnen;

      b. het uitreiken van bewijsstukken, bedoeld in artikel 12 bis, eerste lid, van verordening (EG) 1580/2007, indien
      is voldaan aan artikel 113 bis, en de handelsnormen, gesteld krachtens artikel 113, eerste lid, onderdeel b, van
      verordening (EG) 1234/2007;

      c. de uitvoering van de registratie, bedoeld in artikel 7, tweede lid, van verordening (EG) 2898/95;

      d. overige uitvoeringshandelingen die noodzakelijk zijn voor een goede uitvoering van de onder b en c bedoelde
      verordeningen.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel14
  - number: '15'
    text: |-
      De Stichting Skal is de instantie, bedoeld in artikel 27, vierde lid, onder a, van verordening (EG) 834/2007 en
      belast met:

      a. het toezicht op de naleving van bij of krachtens dit besluit gestelde regels ten aanzien de biologische
      productiemethoden en van productiemethoden die bij ministeriële regeling daaraan gelijkgesteld zijn;

      b. uitvoering van de registratie, bedoeld in artikel 28 van verordening (EG) 834/2007;

      c. overige uitvoeringshandelingen die noodzakelijk zijn voor een goede uitvoering van de in de aanhef bedoelde
      verordening.
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel15
  - number: '16'
    text: |-
      1 De instantie, bedoeld in artikel 14, eerste lid, van verordening (EG) 509/2006 en artikel 10, eerste lid, van
      verordening (EG) 510/2006, is:

      a. de Stichting COKZ, voor zover het producten betreft die reeds op grond van [artikel 12][ref1] onder haar
      bevoegdheid vallen, dan wel die bij ministeriële regeling zijn aangewezen;

      b. de Stichting CPE, voor zover het producten betreft die reeds op grond van [artikel 13][ref2] onder haar
      bevoegdheid vallen, dan wel die bij ministeriële regeling zijn aangewezen;

      c. de Stichting KCB, voor zover het producten betreft die reeds op grond van [artikel 14][ref3] onder haar
      bevoegdheid vallen, dan wel die bij ministeriële regeling zijn aangewezen, of

      d. Onze Minister, voor zover het producten betreft die naar hun aard of ingevolge de voorschriften van de Raad,
      van het Europees Parlement en de Raad gezamenlijk of van de Europese Commissie niet onder de bevoegdheid van de
      controle-instellingen, bedoeld in het eerste lid, onderdelen a tot en met c, vallen.

      2 De instantie, bedoeld in het eerste lid, is belast met:

      a. het toezicht op de naleving van bij of krachtens dit besluit gestelde regels ten aanzien van producten met een
      beschermde geografische aanduiding of oorsprongsbenaming dan wel gegarandeerde traditionele specialiteiten;

      b. de keuring van producten met een beschermde geografische aanduiding of oorsprongsbenaming, bedoeld in
      artikel 11 van verordening (EG) 510/2006 dan wel gegarandeerde traditionele specialiteiten, bedoeld in artikel
      15 van verordening (EG) 509/2006 ten einde te waarborgen dat deze producten aan de eisen van de desbetreffende
      productdossiers voldoen.


