preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 1 juni 2007, Directie Juridische
    Zaken, no. TRCJZ/2007/1788;

    Gelet op verordening (EEG) nr. 2092/91 van de Raad van de Europese Gemeenschappen van 24 juni 1991 inzake de
    biologische produktiemethode en aanduidingen dienaangaande op landbouwproducten en levensmiddelen (PbEG L 198),
    verordening (EEG) nr. 1906/90 van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van
    handelsnormen voor vlees van pluimvee (PbEG L 173), verordening (EEG) nr. 1538/91 van de Commissie van 5 juni 1991
    houdende uitvoeringsbepalingen van verordening (EEG) nr. 1906/90 van de Raad tot vaststelling van handelsnormen
    voor vlees van pluimvee (PbEG L 143), verordening (EG) nr. 1028/2006 van de Raad van de Europese Gemeenschappen
    van 19 juni 2006 betreffende bepaalde handelsnormen voor eieren (PbEU L 186), verordening (EG) nr. 557/2007 van
    de Commissie van 23 mei 2007 tot vaststelling van de bepalingen ter uitvoering van verordening (EG) nr. 1028/2006
    van de Raad betreffende bepaalde handelsnormen voor eieren (PbEU L 132), verordening (EEG) nr. 2200/96 van de
    Raad van de Europese Gemeenschappen van 28 oktober 1996 houdende een gemeenschappelijke ordening der markten
    in de sector groenten en fruit (PbEG L 297), verordening (EG) nr. 1666/1999 van de Commissie van 28 juli 1999
    houdende toepassingsbepalingen van Verordening (EG) nr. 2201/96 van de Raad betreffende de minimumkenmerken voor
    het in de handel brengen van bepaalde krenten- en rozijnenvariëteiten (PbEG L 197), verordening (EEG) nr. 404/93
    van de Raad van de Europese Gemeenschappen van 13 februari 1993 houdende een gemeenschappelijke ordening der
    markten in de sector bananen (PbEG L 47), verordening (EG) nr. 2257/1994 van de Commissie van 16 september 1994
    tot vaststelling van kwaliteitsnormen voor bananen (PbEG L 245), verordening (EG) 2898/95 van de Commissie van 15
    december 1995 houdende voorschriften inzake de controle op de naleving van de kwaliteitsnormen in de sector bananen
    (PbEG L 304) , verordening (EG) 1148/2001 van de Commissie van 12 juni 2001 betreffende de handelsnormcontroles
    voor verse groenten en fruit (PbEG L 156), verordening (EG) nr. 509/2006 van de Raad van de Europese Unie van
    20 maart 2006 inzake gegarandeerde traditionele specialiteiten voor landbouwproducten en levensmiddelen (PbEU
    L 93), verordening (EG) nr. 510/2006 van de Raad van de Europese Unie van 20 maart 2006 inzake de bescherming
    van geografische aanduidingen en oorsprongsbenamingen van landbouwproducten en levensmiddelen (PbEU L 93),
    verordening (EG) nr. 1760/2000 van het Europees Parlement en de Raad van de Europese Gemeenschappen van 17 juli
    2000 tot vaststelling van een identificatie- en registratieregeling voor runderen en inzake de etikettering
    van rundvlees en rundvleesproducten en tot intrekking van Verordening (EG) nr. 820/97 van de Raad (PbEG L 204),
    richtlijn nr. 1998/56/EG van de Raad van de Europese Unie van 20 juli 1998 betreffende het in de handel brengen
    van teeltmateriaal van siergewassen (PbEG L 226) en richtlijn nr. 1992/52/EEG van de Raad van de Europese
    Gemeenschappen van 18 juni 1992 inzake volledige zuigelingenvoeding en opvolgzuigelingenvoeding die voor de uitvoer
    naar derde landen is bestemd (PbEG L 179);

    Gelet op de artikelen 2, 3, 4, 7 en 8 van de Landbouwkwaliteitswet;

    De Raad van State gehoord (advies van 3 augustus 2007, nr. W11.07.0161/IV);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 14 september 2007,
    TRCJZ/2007/2718;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Landbouwkwaliteitswet][ref1];

      b. in de handel brengen: bedrijfsmatig ter beschikking of in voorraad houden, uitstallen of te koop aanbieden,
      verkopen, bezitten met het oog op de verkoop, alsmede tegen of zonder vergoeding aan derden beschikbaar stellen,
      leveren of overdragen;

      c. verordening (EG) 834/2007: verordening (EG) nr. 834/2007 van de Raad van 28 juni 2007 inzake de biologische
      productie en de etikettering van biologische producten en tot intrekking van Verordening (EEG) nr. 2092/91 (PbEU
      L 189);

      d. verordening (EG) 2257/94: verordening (EG) nr. 2257/94 van de Commissie van 16 september 1994 tot vaststelling
      van kwaliteitsnormen voor bananen (PbEG L 245);

      e. verordening (EG) 2898/95: verordening (EG) nr. 2898/95 van de Commissie van 15 december 1995 houdende
      voorschriften inzake de controle op de naleving van de kwaliteitsnormen in de sector bananen (PbEG L 304);

      f. verordening (EG) 1666/99: verordening (EG) nr. 1666/1999 van de Commissie van 28 juli 1999 houdende
      toepassingsbepalingen van Verordening (EG) nr. 2201/96 van de Raad betreffende de minimumkenmerken voor het in de
      handel brengen van bepaalde krenten- en rozijnenvariëteiten (PbEG L 197);

      g. verordening (EG) 1760/2000: verordening (EG) nr. 1760/2000 van het Europees Parlement en de Raad van de Europese
      Gemeenschappen van 17 juli 2000 tot vaststelling van een identificatie- en registratieregeling voor runderen en
      inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking van Verordening (EG) nr. 820/97 van de
      Raad (PbEG L 204);

      h. verordening (EG) 1580/2007: verordening (EG) nr. 1580/2007 van de Commissie van 21 december 2007 tot
      vaststelling van bepalingen voor de uitvoering van de Verordeningen (EG) nr. 2200/96, (EG) nr. 2201/96 en (EG) nr.
      1182/2007 van de Raad in de sector groenten en fruit (PbEU L 350);

      i. verordening (EG) 509/2006: verordening (EG) nr. 509/2006 van de Raad van 20 maart 2006 inzake gegarandeerde
      traditionele specialiteiten voor landbouwproducten en levensmiddelen (PbEU L 93);

      j. verordening (EG) 510/2006: verordening (EG) nr. 510/2006 van de Raad van 20 maart 2006 inzake de bescherming van
      geografische aanduidingen en oorsprongsbenamingen van landbouwproducten en levensmiddelen (PbEU L 93);

      k. verordening (EG) 1234/2007: verordening (EG) nr. 1234/2007 van de Raad van 22 oktober 2007 houdende een
      gemeenschappelijke ordening van de landbouwmarkten en specifieke bepalingen voor een aantal landbouwproducten (PbEU
      L 299);

      l. verordening (EG) 543/2008: verordening (EG) nr. 543/2008 van de Commissie van 16 juni 2008 houdende
      uitvoeringsbepalingen voor Verordening (EG) nr. 1234/2007 van de Raad wat betreft de handelsnormen voor vlees van
      pluimvee (PbEU L 157);

      m. verordening (EG) 566/2008: verordening (EG) nr. 566/2008 van de Commissie van 18 juni 2008 tot vaststelling van
      de uitvoeringsbesluiten voor Verordening (EG) nr. 1234/2007 van de Raad betreffende de afzet van vlees van runderen
      die niet ouder zijn dan twaalf maanden (PbEU L 160);

      n. verordening (EG) 589/2008: verordening (EG) nr. 589/2008 van de Commissie van 23 juni 2008 tot vaststelling van
      bepalingen ter uitvoering van Verordening (EG) nr. 1234/2007 van de Raad, wat betreft de handelsnormen voor eieren
      (PbEU L 163);

      o. richtlijn 92/52/EEG: richtlijn nr. 1992/52/EEG van de Raad van de Europese Gemeenschappen van 18 juni 1992
      inzake volledige zuigelingenvoeding en opvolgzuigelingenvoeding die voor de uitvoer naar derde landen is bestemd
      (PbEG L 179);

      p. richtlijn 98/56/EG: richtlijn nr. 1998/56/EG van de Raad van de Europese Unie van 20 juli 1998 betreffende het
      in de handel brengen van teeltmateriaal van siergewassen (PbEG L 226);

      q. biologische productiemethode: voortbrenging van plantaardige en dierlijke producten en houden van dieren
      overeenkomstig de bij of krachtens verordening (EG) 834/2007 gestelde voorschriften;

      r. teeltmateriaal van bloembollen: teeltmateriaal als bedoeld in artikel 2, eerste lid, van richtlijn 98/56/EG,
      van bloembollen;

      s. eieren: eieren als bedoeld in artikel 1, eerste lid, onderdeel s, van verordening (EG) 1234/2007;

      t. groenten en fruit: groenten en fruit als bedoeld in artikel 1, eerste lid, onderdeel i, van verordening (EG)
      1234/2007;

      u. bananen: bananen als bedoeld in artikel 1, eerste lid, onderdeel k, van verordening (EG) 1234/2007;

      v. krenten en rozijnen: krenten en rozijnen als bedoeld in de bijlage, onder 1, van verordening (EG) 1666/99;

      w. vlees van pluimvee: vlees van pluimvee als bedoeld in artikel 1, eerste lid, onderdeel t, van verordening (EG)
      1234/2007

      x. rundvlees: rundvlees als bedoeld in artikel 12 van verordening (EG) 1760/2000;

      y. geografische aanduidingen, oorsprongsbenamingen en gegarandeerde traditionele specialiteiten: geografische
      aanduidingen, oorsprongsbenamingen en gegarandeerde traditionele specialiteiten als bedoeld in artikel 2, eerste
      lid, van verordening (EG) 510/2006 en in artikel 2, eerste lid, van verordening (EG) 509/2006;

      z. volledige zuigelingenvoeding en opvolgzuigelingenvoeding: volledige zuigelingenvoeding en
      opvolgzuigelingenvoeding als bedoeld in artikel 1 van richtlijn 92/52/EEG;

      aa. derde landen: gebied dat geen deel uitmaakt van het grondgebied van de Europese Unie of een gebied waarop de
      Overeenkomst betreffende de Europese Economische Ruimte niet van toepassing is;

      bb. Stichting KCB: Stichting Kwaliteits-Controle-Bureau te ’s-Gravenhage;

      cc. Stichting Skal: Stichting Skal te Zwolle;

      dd. Stichting CPE: Stichting Controlebureau voor Pluimvee, Eieren en Eiproducten te Barneveld;

      ee. Stichting COKZ: Stichting Controleorgaan voor Kwaliteitsaangelegenheden in de Zuivel te Leusden;

      ff. Stichting BKD: Stichting Bloembollenkeuringsdienst te Lisse.

      2 Dit besluit is niet van toepassing op goederen die zijn aangebracht en aangegeven of op regelmatige wijze zijn
      aangebracht onder geleide van een document voor communautair douanevervoer en die nog niet zijn vrijgegeven voor
      een van de douaneregelingen als bedoeld in artikel 4, onder 16, van Verordening (EEG) nr. 2913/92 van de Raad van
      de Europese Gemeenschappen van 12 oktober 1992 tot vaststelling van het communautair douanewetboek (PbEG L 302).


      [ref1]: https://wetten.overheid.nl/BWBR0002755
    url: https://wetten.overheid.nl/BWBR0022535/2011-07-01#Artikel1
    references:
