  - number: '2'
    text: |-
      Bij het in de handel brengen of etiketteren van of reclame maken voor producten wordt slechts verwezen naar de
      biologische productiemethode en wordt het logo, bedoeld in artikel 33 van [verordening (EU) 2018/848](32748R2018),
      slechts gebruikt indien is voldaan aan het bepaalde bij of krachtens [verordening (EU) 2018/848](32748R2018), bij
      [verordening (EU) 2023/2419](32023R2419), bij ministeriële regeling aangewezen andere krachtens artikel 43, tweede
      lid, van het Verdrag betreffende de werking van de Europese Unie vastgestelde bindende EU-rechtshandelingen voor
      het in de handel brengen, etiketteren van, of reclame maken voor biologische producten, en bij of krachtens dit
      besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel2
  - number: '3.1'
    text: |-
      Wijn en gearomatiseerde wijn die in voorverpakkingen binnen de in punt 1 van de bijlage bij richtlijn 2007/45/
      EG vermelde intervallen zijn verpakt, worden slechts in de handel gebracht indien zij zijn verpakt in de nominale
      hoeveelheden vermeld in punt 1 van die bijlage.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid is niet van toepassing op voorverpakkingen die in belastingvrije winkels worden verkocht voor
      consumptie buiten de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel3
  - number: '3.3'
    text: |-
      Bij twee of meer individuele voorverpakkingen die samen een meervoudige verpakking vormen, zijn de in het eerste
      lid bedoelde nominale hoeveelheden van toepassing op elke individuele voorverpakking.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel3
  - number: '3.4'
    text: |-
      Indien een voorverpakking bestaat uit twee of meer individuele verpakkingen die niet voor individuele verkoop zijn
      bestemd, zijn de in het eerste lid bedoelde nominale hoeveelheden van toepassing op de voorverpakking.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel3
  - number: '4.1'
    text: |-
      Groenten en fruit worden slechts in de handel gebracht indien voldaan is aan artikel 76, eerste en derde lid,
      van verordening (EU) 1308/2013, aan artikel 3, eerste lid, van verordening (EU) 543/2011, aan de krachtens de
      artikelen 75, tweede en zesde lid, en 76, vierde lid, van verordening (EU) 1308/2013 voor groenten en fruit
      vastgestelde voorschriften en de bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel4
  - number: '4.2'
    text: |-
      Bananen worden slechts in de handel gebracht indien voldaan is aan artikel 1 van verordening (EU) 1333/2011, aan de
      voor bananen krachtens artikel 75, tweede en zesde lid, van verordening (EU) 1308/2013 vastgestelde voorschriften
      en de bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel4
  - number: '6'
    text: |-
      De bescherming van kwaliteitsaanduidingen geschiedt overeenkomstig het bij of krachtens verordening (EU) 1151/2012
      bepaalde en de bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel6
  - number: '9'
    text: |-
      Teeltmateriaal van bloembollen wordt slechts in de handel gebracht indien het teeltmateriaal, de leverancier, de
      wijze van in de handel brengen en de etiketten of andere documenten die door de leverancier zijn opgemaakt voldoen
      aan het bepaalde bij of krachtens [richtlijn 98/56/EG](31998L0056) en de bij of krachtens dit besluit gestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister kan nadere regels stellen voor zover dat voor een goede uitvoering van de onderwerpen van de in de
      [artikelen 2][ref1], [4][ref2] en [6][ref3] genoemde verordeningen of krachtens die artikelen aangewezen EU-
      rechtshandelingen en voor de in [artikel 9][ref4] genoemde EU-richtlijn noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022535#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022535#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0022535#Artikel9
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022535
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022535
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0022535
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0022535
        artikel: '9'
  - number: '10.2'
    text: 'De regels bedoeld in het eerste lid kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel10
  - number: 10.2.a
    text: |-
      de in [artikel 2, eerste en tweede lid, van de Landbouwkwaliteitswet][ref1] bedoelde onderwerpen;


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel2
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '2'
  - number: 10.2.b
    text: de erkenning of certificering van onder die regeling vallende betrokkenen;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel10
  - number: 10.2.c
    text: de wijze van keuring van producten;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel10
  - number: 10.2.d
    text: |-
      het uitreiken, aanbrengen, vervaardigen, voorhanden en in voorraad hebben, alsmede het afleveren en gebruiken van
      bewijsstukken en merken;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel10
  - number: 10.2.e
    text: de nadere aanduiding van het begrip bloembollen.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel10
  - number: '10.3'
    text: |-
      Onze Minister kan vrijstelling en, op aanvraag, ontheffing verlenen van het bepaalde bij of krachtens dit besluit
      voor zover het belang van een goede uitvoering van de in het eerste lid bedoelde EU-verordeningen en EU-richtlijn
      zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel10
  - number: '10.4'
    text: |-
      De wijze van keuring van producten, bedoeld in het tweede lid, onder c, heeft onder meer betrekking op de
      voorwaarden waaronder betrokkenen door de controle-instellingen of door een controlerende instantie erkend kunnen
      worden voor het verrichten van de bij ministeriële regeling aan te duiden keuringsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel10
  - number: '11'
    text: 'De Stichting BKD is de instantie, bedoeld in de artikelen 12 en 13 van richtlijn 98/56/EG en belast met:'
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel11
  - number: 11.a
    text: |-
      het toezicht op de naleving van bij of krachtens dit besluit gestelde regels ten aanzien van teeltmateriaal van
      bloembollen;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel11
  - number: 11.b
    text: de keuring van teeltmateriaal van bloembollen;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel11
  - number: 11.c
    text: de uitvoering van de registratie, bedoeld in artikel 6 van richtlijn 98/56/EG;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel11
  - number: 11.d
    text: |-
      overige uitvoeringshandelingen die noodzakelijk zijn voor een goede uitvoering van de in de aanhef bedoelde
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel11
  - number: '14.1'
    text: |-
      De Stichting KCB is de controle-instantie, bedoeld in artikel 9, eerste lid, onderdeel b, van verordening (EU)
      543/2011, en belast met:
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel14
  - number: 14.1.a
    text: |-
      het toezicht op de naleving van bij of krachtens dit besluit gestelde regels ten aanzien van groente en fruit,
      aardappelen en bananen;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel14
  - number: 14.1.b
    text: |-
      het uitreiken van bewijsstukken, bedoeld in artikel 14, eerste lid, van verordening (EU) 543/2011, indien is
      voldaan aan artikel 76, eerste en derde lid, en de handelsnormen, gesteld krachtens artikel 75, tweede en zesde
      lid, van verordening (EU) 1308/2013;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel14
  - number: 14.1.c
    text: de uitvoering van de registratie, bedoeld in artikel 9, tweede lid, van verordening (EU) 1333/2011;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel14
  - number: 14.1.d
    text: |-
      overige uitvoeringshandelingen die noodzakelijk zijn voor een goede uitvoering van de onder b en c bedoelde
      verordeningen.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel14
  - number: '14.2'
    text: |-
      De Stichting KCB is de bevoegde autoriteit voor de officiële controles, bedoeld in artikel 36, derde lid, van
      verordening (EU) 1151/2012 ten aanzien van producten die op grond van het eerste lid onder haar bevoegdheid vallen.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel14
  - number: '15'
    text: |-
      De Stichting Skal wordt aangewezen als bevoegde autoriteit voor zover het betreft het gebied, genoemd in artikel 1,
      tweede lid, aanhef en onderdeel i, van [verordening (EU) 2017/625](32525R2017) voor:
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel15
  - number: 15.a
    text: |-
      het documenteren, bedoeld in artikel 29, zesde lid, van [verordening (EU) 2018/848](32748R2018) van
      onderzoeksresultaten naar de aanwezigheid van niet-toegelaten producten of stoffen en genomen maatregelen;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel15
  - number: 15.b
    text: het ontvangen van de melding, bedoeld in artikel 34 van [verordening (EU) 2018/848](32748R2018);
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel15
  - number: 15.c
    text: |-
      het meedelen van de informatie, bedoeld in artikel 43, zesde lid, van [verordening (EU) 2018/848](32748R2018) aan
      het daar bedoelde betaalorgaan;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel15
  - number: 15.d
    text: de handhavingsverplichtingen, bedoeld in artikel 137 van [verordening (EU) 2017/625](32525R2017), en
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel15
  - number: 15.e
    text: het nemen van de acties en maatregelen, bedoeld in artikel 138 van [verordening (EU) 2017/625](32525R2017),
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel15
  - number: '16.1'
    text: |-
      Onze Minister is de bevoegde autoriteit, bedoeld in [artikel 4, eerste lid, van de wet][ref1], voor het gebied,
      genoemd in artikel 1, tweede lid, onderdeel i van verordening (EU) 2017/625 en belast met de taken die aan de
      bevoegde autoriteit of een lidstaat kunnen worden opgedragen en die niet op grond van de [artikelen 15][ref2] of
      [18][ref3], of het tweede lid aan de Stichting Skal zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022535#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0022535#Artikel18
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0022535
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0022535
        artikel: '18'
  - number: '16.2'
    text: |-
      De Stichting Skal is de controleautoriteit, bedoeld in [artikel 4, tweede lid, van de wet][ref1] en is:


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel4
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '4'
  - number: 16.2.a
    text: |-
      gelet op [verordening (EU) 2018/848](32748R2018) belast met alle taken die in verband met de toepassing van
      [verordening (EU) 2018/848](32748R2018) aan een controleautoriteit kunnen worden opgedragen, en
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel16
  - number: 16.2.b
    text: |-
      gelet op artikel 4, derde lid, van [verordening (EU) 2017/625](32525R2017) belast met de officiële controles
      en andere officiële activiteiten en de daarbij behorende taken en verantwoordelijkheden bedoeld in titel II,
      hoofdstukken II, V en VII, van [verordening (EU) 2017/625](32525R2017) ten aanzien van de in artikel 1, tweede lid,
      aanhef en onderdeel i, van [verordening (EU) 2017/625](32525R2017) bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel16
  - number: '17'
    text: 'Onze Minister is de bevoegde autoriteit, voor:'
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel17
  - number: 17.a
    text: |-
      de officiële controles als bedoeld in artikel 36, derde lid, verordening (EU) 1151/2012 ten aanzien van producten
      die niet onder de in [artikel 14, tweede lid][ref1], bedoelde bevoegdheid van de Stichting KCB vallen;


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel14
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022535
        artikel: '14'
  - number: 17.b
    text: artikel 34 van verordening (EU) 1151/2012;
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel17
  - number: 17.c
    text: het toezicht op de naleving van bij dit besluit gestelde regels inzake wijn en gearomatiseerde wijn.
    url: https://wetten.overheid.nl/BWBR0022535/2023-12-29#Artikel17
  - number: '18'
    text: |-
      Indien het in het belang van een goede uitvoering van de in [artikel 2][ref1] genoemde verordeningen of krachtens
      dat artikel aangewezen EU-rechtshandelingen aangewezen is dat in die voorschriften genoemde taken en bevoegdheden
      aan de Stichting Skal worden opgedragen, kunnen deze, onverminderd het bepaalde in de [artikelen 15][ref2] en
      [16, tweede lid][ref3], worden opgedragen bij ministeriële regeling.


