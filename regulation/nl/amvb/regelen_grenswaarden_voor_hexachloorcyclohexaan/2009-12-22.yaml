$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regelen_grenswaarden_voor_hexachloorcyclohexaan
regulatory_layer: AMVB
publication_date: '2020-12-03'
valid_from: '2009-12-22'
bwb_id: BWBR0004018
url: https://wetten.overheid.nl/BWBR0004018/2009-12-22
preamble:
  text: |-
    Overwegende dat uitvoering moet worden gegeven aan de richtlijn van de Raad van de Europese Gemeenschappen
    van 9 oktober 1984, 84/491/EEG, betreffende de grenswaarden en kwaliteitsdoelstellingen voor de lozing van
    hexachloorcyclohexaan (Pb. nr. L 274/11 van 17 oktober 1984);

    Gelet op artikel 1a, eerste, tweede en derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel1
  - number: 1.a
    text: |-
      *verwerken van hexachloorcyclohexaan (HCH):* elk industrieel proces waarbij HCH of HCH-bevattende stoffen worden
      vervaardigd of gebruikt, of waarbij HCH of HCH-bevattende stoffen vrijkomen;
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel1
  - number: 1.b
    text: '*lozen:* brengen van:'
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel1
  - number: 1.b.1°
    text: stoffen in een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel1
  - number: 1.b.2°
    text: |-
      afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een openbaar
      vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel1
  - number: 1.b.3°
    text: |-
      stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling en
      het transport van afvalwater.
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 6.3 van het Waterbesluit][ref1] en [artikel 8.40, eerste lid][ref2], in samenhang
      met [artikel 21.6, zesde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '21'
  - number: '2'
    text: |-
      Ten aanzien van een bedrijf dat HCH verwerkt, geldt voor het lozen van HCH als ten hoogste toelaatbare
      gewichtshoeveelheid de grenswaarde die overeenkomt met de waarde die het resultaat is van de toepassing van de
      beste bestaande technieken. Daarbij geldt ten aanzien van een bedrijf, behorende tot een van de in de bij dit
      besluit behorende [bijlage I][ref1] vermelde bedrijfstakken de in die bijlage voor die bedrijfstak aangegeven
      grenswaarde, bepaald op de in de bij dit besluit behorende [bijlage II][ref2] aangegeven wijze, als ten hoogste
      toelaatbare gewichtshoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004018
      [ref2]: https://wetten.overheid.nl/BWBR0004018
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004018
      - id: ref2
        bwb_id: BWBR0004018
  - number: '3'
    text: |-
      In afwijking van [artikel 2][ref1] gelden voor het lozen van HCH als ten hoogste toelaatbare gewichtshoeveelheden
      ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0004018#Artikel2
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004018
        artikel: '2'
  - number: 3.a
    text: |-
      een bedrijf, behorende tot één van de in [bijlage I][ref1] genoemde bedrijfstakken, dat vóór 9 oktober 1984 in
      werking is gebracht en waarin na die datum de capaciteit voor het verwerken van HCH niet aanzienlijk is uitgebreid:
      tot 1 oktober 1988: de voor zodanige bedrijfstak in [bijlage I][ref2], aangegeven grenswaarde, bepaald op de in
      [bijlage II][ref3] aangegeven wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0004018
      [ref2]: https://wetten.overheid.nl/BWBR0004018
      [ref3]: https://wetten.overheid.nl/BWBR0004018
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004018
      - id: ref2
        bwb_id: BWBR0004018
      - id: ref3
        bwb_id: BWBR0004018
  - number: 3.b
    text: |-
      een bedrijf, behorende tot een andere dan de in [bijlage I][ref1] genoemde bedrijfstakken, dat voor 9 oktober
      1984 in werking is gebracht en waarin na die datum de capaciteit voor het verwerken van HCH niet aanzienlijk is
      uitgebreid: de grenswaarde die op 1 september 1986 overeenkomt met de waarde die het resultaat is van de toepassing
      van de beste bestaande technieken.


      [ref1]: https://wetten.overheid.nl/BWBR0004018
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004018
  - number: '4.1'
    text: Deze regeling treedt in werking met ingang van 1 september 1986.
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel4
  - number: '4.2'
    text: Zij wordt in het *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0004018/2009-12-22#Artikel4
