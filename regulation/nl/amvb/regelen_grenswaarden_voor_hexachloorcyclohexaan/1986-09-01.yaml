preamble:
  text: |-
    Overwegende dat uitvoering moet worden gegeven aan de richtlijn van de Raad van de Europese Gemeenschappen
    van 9 oktober 1984, 84/491/EEG, betreffende de grenswaarden en kwaliteitsdoelstellingen voor de lozing van
    hexachloorcyclohexaan (Pb. nr. L 274/11 van 17 oktober 1984);

    Gelet op artikel 1a, eerste, tweede en derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004018/1986-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder het verwerken van hexachloorcyclohexaan (HCH) wordt verstaan elk industrieel proces waarbij HCH of HCH-
      bevattende stoffen worden vervaardigd of gebruikt, of waarbij HCH of HCH-bevattende stoffen vrijkomen.
    url: https://wetten.overheid.nl/BWBR0004018/1986-09-01#Artikel1
  - number: '2'
    text: |-
      Ten aanzien van een bedrijf dat HCH verwerkt, geldt voor het brengen van HCH in oppervlaktewateren als ten hoogste
      toelaatbare gewichtshoeveelheid de grenswaarde die overeenkomt met de waarde die het resultaat is van de toepassing
      van de beste bestaande technieken. Daarbij geldt ten aanzien van een bedrijf, behorende tot een van de in de bij
      dit besluit behorende [bijlage I][ref1] vermelde bedrijfstakken de in die bijlage voor die bedrijfstak aangegeven
      grenswaarde, bepaald op de in de bij dit besluit behorende [bijlage II][ref2] aangegeven wijze, als ten hoogste
      toelaatbare gewichtshoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004018
      [ref2]: https://wetten.overheid.nl/BWBR0004018
    url: https://wetten.overheid.nl/BWBR0004018/1986-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004018
      - id: ref2
        bwb_id: BWBR0004018
  - number: '3'
    text: |-
      In afwijking van [artikel 2][ref1] gelden voor het brengen van HCH in oppervlaktewateren als ten hoogste
      toelaatbare gewichtshoeveelheden ten aanzien van:

      a. een bedrijf, behorende tot één van de in [bijlage I][ref2] genoemde bedrijfstakken, dat vóór 9 oktober 1984 in
      werking is gebracht en waarin na die datum de capaciteit voor het verwerken van HCH niet aanzienlijk is uitgebreid:
      tot 1 oktober 1988: de voor zodanige bedrijfstak in [bijlage I][ref3], aangegeven grenswaarde, bepaald op de in
      [bijlage II][ref4] aangegeven wijze;

      b. een bedrijf, behorende tot een andere dan de in [bijlage I][ref5] genoemde bedrijfstakken, dat voor 9 oktober
      1984 in werking is gebracht en waarin na die datum de capaciteit voor het verwerken van HCH niet aanzienlijk is
      uitgebreid: de grenswaarde die op 1 september 1986 overeenkomt met de waarde die het resultaat is van de toepassing
      van de beste bestaande technieken.


      [ref1]: https://wetten.overheid.nl/BWBR0004018#Artikel2
