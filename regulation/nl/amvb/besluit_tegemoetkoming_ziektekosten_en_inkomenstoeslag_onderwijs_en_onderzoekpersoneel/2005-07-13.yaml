      wie de salarissen en toelagen worden vastgesteld in het Koninklijk Besluit ter uitvoering van
      [artikel 33, tweede lid, onder b, van de Wet op het primair onderwijs][ref2], dan wel een personeelslid benoemd in
      algemene dienst als bedoeld in [artikel 34 van de Wet op het primair onderwijs][ref3];


