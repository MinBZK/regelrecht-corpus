  - number: 1.1.d
    text: |-
      orgaan: het bevoegd gezag, bedoeld in [artikel 1, onderdeel f van het Rechtspositiebesluit WPO/WEC][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: 1.1.e
    text: |-
      normbetrekking: een betrekking waarvan de omvang gelijk is aan die van een volledige weektaak in de desbetreffende
      functie.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel1
  - number: 1.1.f
    text: |-
      feitelijk genoten salaris: het bedrag, dan wel de som der bedragen, dat voor de betrokkenen bij het orgaan is
      vastgesteld met inachtneming van [artikel 83, onder b, van het Rechtspositiebesluit WPO/WEC][ref1] en in voorkomend
      geval is verminderd met een korting op dat bedrag. Voor de berekening van het feitelijk genoten salaris blijft
      buiten toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: 1.1.f.1
    text: |-
      een vermindering van het feitelijk genoten salaris zoals bedoeld in
      [artikel 4, eerste lid, tijdelijk Besluit ziekte en arbeidsongeschiktheid onderwijs- en onderzoekpersoneel][ref1]
      dan wel in [artikel 201 van het Rechtspositiebesluit WPO/WEC][ref2] of een daarmee naar aard en strekking
      overeenkomende regeling,


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0015136
  - number: 1.1.f.2
    text: |-
      een korting op het salaris in verband met inkomsten verworven in verband met herhalingsoefeningen van de militaire
      dienst.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit wordt onder echtgenoot dan wel geregistreerde partner van de betrokkene mede
      verstaan de ongehuwde persoon dan wel de partner met wie geen registratie is aangegaan, van verschillend of gelijk
      geslacht met wie de betrokkene duurzaam een gezamenlijke huishouding voert, tenzij het een persoon betreft waarmee
      bloedverwantschap in de eerste of tweede graad bestaat.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel1
  - number: '1.3'
    text: |-
      Van een gezamenlijke huishouding als bedoeld in het tweede lid, kan slechts sprake zijn indien twee ongehuwde
      of niet geregistreerde personen gezamenlijk voorzien in huisvesting en bovendien beiden een bijdrage leveren in
      de kosten van de huishouding dan wel op andere wijze in elkaars verzorging voorzien, hetgeen moet kunnen blijken
      uit een ter zake verleden notariële akte alsmede uit een uittreksel van de gemeentelijke basisadministratie
      persoonsgegevens waaruit een gezamenlijk woonadres blijkt.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel1
  - number: '2.1'
    text: |-
      De betrokkene, bedoeld in [artikel 1, eerste lid, onder ][ref1], ontvangt een tegemoetkoming in de ziektekosten
      over elke kalendermaand waarin hij bij hetzelfde orgaan een of meer betrekkingen bekleedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel1
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '1'
  - number: '2.2'
    text: |-
      De betrokkene ontvangt voorts een tegemoetkoming voor de medebetrokkene, bedoeld in
      [artikel 1, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel1
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '1'
  - number: '2.3'
    text: |-
      De betrokkene ontvangt een extra tegemoetkoming voor ten hoogste één medebetrokkene, bedoeld in
      [artikel 1, eerste lid, onder ][ref1]. Indien de betrokkene en diens echtgenoot beiden aanspraak op deze
      tegemoetkoming hebben, elk ten behoeve van een ander kind, wordt deze tegemoetkoming alleen toegekend aan de
      betrokkene met het oudste kind jonger dan 16 jaar, dat deel uitmaakt van de gemeenschappelijke huishouding.


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel1
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '1'
  - number: '2.4'
    text: |-
      De betrokkene ontvangt een extra tegemoetkoming voor elke medebetrokkene, bedoeld in
      [artikel 1, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel1
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '1'
  - number: '2.5'
    text: |-
      De tegemoetkomingen worden over een kalendermaand slechts verleend, indien de betrokkene gedurende meer dan de
      helft van het aantal kalenderdagen als zodanig in dienst is geweest. De tegemoetkomingen voor medebetrokkenen
      worden over een kalendermaand slechts verleend, indien zij gedurende meer dan de helft van het aantal kalenderdagen
      als medebetrokkene kunnen worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel2
  - number: '3.1'
    text: |-
      De betrokkene ontvangt voor zichzelf geen tegemoetkoming over een kalendermaand, waarin hij gedurende meer dan de
      helft van het aantal kalenderdagen behoort tot een van de volgende categorieën:
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel3
  - number: 3.1.a
    text: |-
      degenen die zelfstandig verplicht verzekerd zijn krachtens de [Ziekenfondswet][ref1], met uitzondering van degenen
      die als zelfstandige ingevolge [artikel 3d van de Ziekenfondswet][ref2] verplicht verzekerd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002460
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 3d
  - number: 3.1.b
    text: |-
      degenen die medeverzekerd zijn ingevolge [artikel 4 van de Ziekenfondswet][ref1] dan wel medeverzekerd zijn
      ingevolge een publiekrechtelijke ziektekostenverzekering of medebetrokkenen zijn in een naar aard en strekking met
      dit besluit overeenkomende regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '4'
  - number: 3.1.c
    text: |-
      degenen die uit hoofde van hun (voormalige) dienstbetrekking aanspraak hebben op gehele of gedeeltelijke
      geneeskundige verzorging of op gehele of gedeeltelijke vergoeding van de kosten daarvan;
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel3
  - number: '3.2'
    text: 'De betrokkene ontvangt geen tegemoetkoming voor een medebetrokkene die:'
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel3
  - number: 3.2.a
    text: |-
      tot een van de in het eerste lid genoemde categorieën behoort, behoudens degene die medeverzekerd is bij een
      betrokkene die als zelfstandige ingevolge [artikel 3d van de Ziekenfondswet][ref1] verplicht verzekerd is, dan wel
      uit anderen hoofde aanspraak heeft op gehele of gedeeltelijke verzorging, of van geheel of gedeeltelijke vergoeding
      van de kosten daarvan, of


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3d
  - number: 3.2.b
    text: |-
      zelf betrokkene is in de zin van dit besluit, dan wel in de zin van een publiekrechtelijke ziektekostenverzekering
      of een naar aard en strekking met dit besluit overeenkomende regeling, of
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel3
  - number: 3.2.c
    text: |-
      medebetrokkene als bedoeld in [artikel 1, eerste lid, onder ][ref1] is bij de echtgenoot dan wel geregistreerde
      partner van betrokkene en voor wie deze echtgenoot dan wel geregistreerde partner een tegemoetkoming ontvangt in
      de kosten van een ziektekostenverzekering voor deze medebetrokkene op grond van dit besluit, of een naar aard en
      strekking met dit besluit overeenkomende regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel1
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '1'
  - number: '4.1'
    text: 'De tegemoetkoming wordt gerelateerd aan:'
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel4
  - number: 4.1.a
    text: |-
      de omslagbijdragen ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel5
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003933
        artikel: '5'
  - number: 4.1.b
    text: |-
      de omslagbijdragen ingevolge [artikel 11 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel11
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009750
        artikel: '11'
  - number: 4.1.c
    text: |-
      de component «polis» van de particuliere ziektekostenpremie voor een maatschappijpolis, zoals deze door het
      Centraal Planbureau in het desbetreffende kalenderjaar wordt gehanteerd ten behoeve van het Centraal Economisch
      Plan.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel4
  - number: '4.2'
    text: |-
      Het bedrag van de tegemoetkomingen is zodanig dat na aftrek van de verschuldigde loonbelasting/premie
      volksverzekeringen volgens de tabel voor bijzondere beloningen ingevolge de [Wet op de loonbelasting 1964][ref1] –
      wordt uitbetaald:


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 4.2.a
    text: |-
      ten aanzien van de betrokkene, bedoeld in [artikel 1, eerste lid, onder b][ref1], en ten aanzien van de
      medebetrokkene, bedoeld in [artikel 1, eerste lid, onder][ref2] c1: de som van 50% van de door hen verschuldigde
      in het eerste lid, onderdelen a en b, bedoelde bedragen en 50% van het in het eerste lid, onderdeel c, bedoelde
      bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007326#Artikel1
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007326
        artikel: '1'
  - number: 4.2.b
    text: |-
      ten aanzien van de medebetrokkenen, bedoeld in [artikel 1, eerste lid, onder][ref1] c2: de som van 50% van de door
      deze medebetrokkene verschuldigde in het eerste lid, onderdelen a en b, bedoelde bedragen en 25% van het in het in
      het eerste lid, onderdeel c, bedoelde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel1
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '1'
  - number: 4.2.c
    text: |-
      ten aanzien van de medebetrokkenen, bedoeld in [artikel 1, eerste lid, onder][ref1] c3, c4 en c5: de som van 50%
      van de door hem verschuldigde in het eerste lid, onderdelen a en b, bedoelde bedragen en 25% van het in het eerste
      lid, onderdeel c, bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel1
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '1'
  - number: '4.3'
    text: |-
      Voor de toepassing van het tweede lid, aanhef en onder a en c, worden de betrokkene en
      de medebetrokkenen in de leeftijdscategorieën van 16 tot en met 19 jaar en van 65 jaar
      en ouder wat betreft de tegemoetkoming in de verschuldigde omslagbijdragen ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1] en ingevolge
      [artikel 11 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref2] gelijkgesteld met de personen in de
      leeftijdscategorie van 20 tot en met 64 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel11
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003933
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009750
        artikel: '11'
  - number: '6.1'
    text: |-
      De betrokkene die voor zich zelf een tegemoetkoming als bedoeld in [artikel 4][ref1] ontvangt, heeft over de
      desbetreffende kalendermaanden recht op een toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel4
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '4'
  - number: '6.2'
    text: |-
      De betrokkene die op grond van dit besluit een tegemoetkoming ontvangt, en in aanmerking komt voor een
      tegemoetkoming voor een medebetrokkene en die bij een volledige werktijd een salaris heeft gelijk aan dan wel lager
      dan het maximumsalaris van schaal 7 van bijlage 1A van het [Rechtspositiebesluit onderwijspersoneel][ref1], heeft
      naast het eerste lid voor de desbetreffende kalendermaanden recht op een aanvullende toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0003771
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003771
  - number: '6.3'
    text: Bij regeling van Onze Minister wordt het bedrag van de toeslag en de aanvullende toeslag vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel6
  - number: '6.4'
    text: |-
      De toeslag en de aanvullende toeslag worden aangegeven in een bedrag per maand, na aftrek van de
      verschuldigde loonbelasting/premie volksverzekeringen volgens de tabel bijzondere beloningen ingevolge de
      [Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '7.1'
    text: |-
      Voor de betrokkene, bedoeld in [artikel 1, eerste lid, onder][ref1] b1 tot en met b7, worden de tegemoetkoming,
      de toeslag en de aanvullende toeslag uitbetaald in de maand januari over het tweede en derde kwartaal van het
      voorafgaande jaar en in de maand mei dan wel op verzoek van de betrokkene in december over het vierde kwartaal van
      het voorafgaande jaar en het eerste kwartaal van het lopende jaar. Zo nodig vindt de uitbetaling in afwijking van
      het vorenstaande eerder plaats in geval van ontslag of overlijden van betrokkene,.


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel1
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '1'
  - number: '7.2'
    text: |-
      Voor de betrokkene, bedoeld in [artikel 1, onder][ref1] b10 en b12, worden de tegemoetkoming, de toeslag en
      de aanvullende toeslag uitbetaald in de maanden juni en december, telkens over de twee voorafgaande kwartalen
      eindigend met de maand maart respectievelijk september, dan wel op verzoek van de betrokkene in de maand december
      over de vier voorafgaande kwartalen eindigend met de maand september. Zo nodig vindt uitbetaling in afwijking van
      het vorenstaande eerder plaats in geval van ontslag of overlijden van de betrokkene,.


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel1
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '1'
  - number: '7.3'
    text: |-
      De eerste uitbetaling van de tegemoetkoming, de toeslag en de aanvullende toeslag vindt slechts op aanvraag plaats.
      Indien wijzigingen optreden in de voor de betaling relevante gegevens is de betrokkene verplicht deze wijzigingen
      te melden. De eerste aanvraag alsmede de melding van de wijzigingen geschiedt op een door Onze Minister toegestaan
      formulier.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel7
  - number: '7.4'
    text: |-
      Indien niet binnen de periode van een jaar nadat het recht op respectievelijk nadat de verhoging van de
      tegemoetkoming, de toeslag en de aanvullende toeslag is ontstaan een aanvraag-, respectievelijk wijzigingsformulier
      is ingediend, vindt de eerste uitbetaling, respectievelijk verhoging van de uitbetaling van de tegemoetkoming, de
      toeslag en de aanvullende toeslag plaats met terugwerkende kracht tot en met een jaar gerekend vanaf de eerste dag
      van de maand na indiening.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel7
  - number: '8'
    text: |-
      De uitbetaling van de tegemoetkoming, de toeslag en de aanvullende toeslag geschiedt door het orgaan dat belast is
      met de uitbetaling van de bezoldiging aan betrokkene over de desbetreffende maanden januari, mei, respectievelijk
      juni en december, dan wel in geval van ontslag of overlijden over de maand van ontslag of overlijden.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel8
  - number: '10.1'
    text: |-
      Ten aanzien van de betrokkene die bij hetzelfde orgaan een of meer betrekkingen bekleedt met elk een omvang van
      minder dan een normbetrekking, wordt de tegemoetkoming, de toeslag en de aanvullende toeslag vastgesteld op een
      evenredig deel en wel in dezelfde verhouding als het feitelijke genoten salaris dat met die betrekking dan wel
      betrekkingen bij hetzelfde orgaan met een omvang van minder dan een normbetrekking staat tot het salaris dat in
      die maand in de betrekking bij een normbetrekking zou zijn ontvangen. Indien in de in de vorige volzin bedoelde
      kalendermaand sprake is van betrekkingen waarvoor bij een normbetrekking verschillende schalen gelden, geldt in die
      kalendermaand het laagste van toepassing zijnde salaris bij normbetrekking.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel10
  - number: '10.2'
    text: |-
      Ten aanzien van de betrokkene die bij een orgaan een betrekking korter dan een maand, maar langer dan de helft van
      die maand bekleedt wordt de tegemoetkoming, de toeslag en de aanvullende toeslag berekend op dezelfde wijze als
      in het eerste lid bepaald, met dien verstande dat het aldus berekende bedrag vermenigvuldigd wordt met het aantal
      kalenderdagen van de desbetreffende maand en vervolgens gedeeld door het aantal kalenderdagen waarover de benoeming
      dan wel de benoemingen zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel10
  - number: '10.3'
    text: |-
      De tegemoetkoming, de toeslag en de aanvullende toeslag bedragen nooit meer dan het volledige bedrag aan
      tegemoetkoming, toeslag en aanvullende toeslag per kalendermaand.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel10
  - number: 10b.1
    text: |-
      Het orgaan, bedoeld in [artikel 8][ref1], kan verlangen dat de betrokkene voor de toekenning van een tegemoetkoming
      relevante bescheiden overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel8
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '8'
  - number: 10b.2
    text: |-
      Indien de betrokkene niet voldoet aan het verzoek om bescheiden over te leggen, kan de uitbetaling van de
      tegemoetkoming, de toeslag en de aanvullende toeslag worden opgeschort.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel10b
  - number: 10c
    text: |-
      Het orgaan, bedoeld in [artikel 8][ref1], is bevoegd hetgeen op grond van dit besluit onverschuldigd is betaald,
      geheel of gedeeltelijk terug te vorderen, of in mindering te brengen op een later te betalen uitkering op grond van
      dit besluit:


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel8
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '8'
  - number: 10c.a
    text: |-
      gedurende vijf jaren na de dag van betaalbaarstelling indien het door toedoen van de betrokkene onverschuldigd
      heeft betaald;
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel10c
  - number: 10c.b
    text: |-
      gedurende twee jaren na de dag van betaalbaarstelling in de overige gevallen waarin het de betrokkene
      redelijkerwijs duidelijk kon zijn dat het orgaan onverschuldigd betaalde.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel10c
  - number: '12.1'
    text: |-
      De tegemoetkomingen, de toeslag en de aanvullende toeslag krachtens dit besluit, worden niet gerekend tot het
      ambtelijk inkomen in de zin van de Algemene burgerlijke pensioenwet.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel12
  - number: '12.2'
    text: |-
      De toeslag en de aanvullende toeslag krachtens dit besluit worden niet gerekend tot de inkomsten, bedoeld in
      artikel 2 van de Regeling ziektekostenvoorziening overheidspersoneel.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel12
  - number: '13'
    text: Bij regeling van Onze Minister kunnen nadere voorschriften voor de uitvoering van dit besluit worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel13
  - number: '14.1'
    text: |-
      De interimregeling ziektekosten ambtenaren 1982 en het Besluit inkomenstoeslag belanghebbenden in de zin van de
      Interimregeling ziektekosten ambtenaren 1982 zijn met ingang van het tijdstip van inwerkingtreding van dit besluit
      niet meer van toepassing op betrokkenen bedoeld in [artikel 1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007326#Artikel1
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007326
        artikel: '1'
  - number: '14.2'
    text: |-
      Het Besluit gewijzigde betaalmaanden Interimregeling ziektekosten ambtenaren 1982 wordt ingetrokken met ingang van
      het tijdstip van inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel14
  - number: '15'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en wordt aangehaald als Besluit tegemoetkoming ziektekosten en inkomenstoeslag onderwijs- en
      onderzoekpersoneel.
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel15
