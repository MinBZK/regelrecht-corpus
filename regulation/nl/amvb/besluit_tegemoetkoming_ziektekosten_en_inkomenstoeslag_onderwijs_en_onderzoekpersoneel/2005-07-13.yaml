  - number: 1.1.c.1
    text: |-
      de echtgenoot dan wel de geregistreerde partner die behoort tot het huishouden van betrokkene en die aan dit
      besluit dan wel een naar aard en strekking daarmee overeenkomende regeling niet zelfstandig aanspraken ontleent en
      van wie de inkomsten lager zijn dan die van betrokkene
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel1
  - number: 1.1.c.2
    text: |-
      het kind jonger dan 16 jaar, bedoeld in [artikel 7 van de Algemene Kinderbijslagwet][ref1] voor wie de betrokkene
      de premie van een ziektekostenverzekering heeft betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
  - number: 1.1.c.3
    text: |-
      het kind van 16 tot 18 jaar en van 16 tot 25 jaar, bedoeld in [artikel 7][ref1] respectievelijk
      [26 van de Algemene Kinderbijslagwet][ref2], voor wie de betrokkene de premie van een ziektekostenverzekering heeft
      betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel26
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '26'
  - number: 1.1.c.4
    text: |-
      het kind van 25 en 26 jaar dat behoudens de leeftijdseis voldoet aan
      [artikel 26, eerste lid, onder a, respectievelijk tweede lid, van de Algemene Kinderbijslagwet][ref1], voor wie
      de betrokkene de premie voor een ziektekostenverzekering heeft betaald. De ter uitvoering van [artikel 7][ref2] en
      [26 van de Algemene Kinderbijslagwet][ref3] gestelde regelen zijn wat betreft de medebetrokkenen, bedoeld onder c2,
      c3 en c4 van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel26
    url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#Artikel1
    references:
