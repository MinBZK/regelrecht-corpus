preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 15 november 1994, nr. 94044595,
    directie Arbeidsvoorwaarden en Beroepskwaliteit, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en
    Visserij;

    Gelet op artikel 33, tweede lid, van de Wet op het primair onderwijs; artikel 33, tweede lid van de Wet op de
    expertisecentra; artikel 153, tweede lid, van deel II van de Wet op het voortgezet onderwijs, de artikelen 39,
    tweede lid, 61 en 76, van de Wet op het voortgezet onderwijs; artikel 4 van de Experimentenwet onderwijs; artikel
    9 van de Kaderwet volwasseneneducatie 1991; artikel 58, tweede lid, van de Wet op de onderwijsverzorging; de
    artikelen 2.45, 2.55, 2.76 en 2.77 van de Wet op het cursorisch beroepsonderwijs; de artikelen 4.5, eerste lid,
    4.6, 9.74, tweede lid, 10.10, derde lid, 11.12, eerste lid, 12.5, 13.1, eerste lid, 13.3, vijfde lid, 16.23,
    derde lid, en 16.27 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek; de artikelen 14, eerste lid,
    en 35 van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek; de artikelen 125 en 134 van de
    Ambtenarenwet;

    De Raad van State gehoord (advies van 23 januari 1995, nr. W05.94.0718);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen, uitgebracht mede namens Onze
    Minister van Landbouw, Natuurbeheer en Visserij, van 28 maart 1995, nr. 95005766, directie Arbeidsvoorwaarden en
    Beroepskwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007326/2005-07-13#ArtikelAanhef
