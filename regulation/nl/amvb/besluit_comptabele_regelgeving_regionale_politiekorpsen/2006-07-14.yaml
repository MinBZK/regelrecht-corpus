  - number: '21'
    text: |-
      1 Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 De in [artikel 4, eerste, tweede en derde lid][ref1], voorgeschreven rangschikking en toerekening naar
      kostendragers zullen op een door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties later bekend te maken
      tijdstip ingaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel4
