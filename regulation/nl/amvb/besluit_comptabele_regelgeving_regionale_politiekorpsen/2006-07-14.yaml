---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_comptabele_regelgeving_regionale_politiekorpsen
regulatory_layer: AMVB
publication_date: '2012-07-16'
valid_from: '2006-07-14'
bwb_id: BWBR0006563
url: https://wetten.overheid.nl/BWBR0006563/2006-07-14
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 2 december 1993, nummer EA93/U3431, gedaan in
    overeenstemming met Onze Minister van Justitie;

    Gelet op artikel 45 en artikel 47, eerste lid, van de Politiewet 1993;

    De Raad van State gehoord (advies van 15 februari 1994, nummer WO4.93.0809);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 24 maart 1994, nummer EA94/U872, uitgebracht
    mede namens Onze Minister van Justitie DGW431139/94/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel1
  - number: 1.a
    text: 'begrotingsjaar: het kalenderjaar waarvoor de begroting dient;'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel1
  - number: 1.b
    text: 'verslagjaar: het kalenderjaar waarover verslag wordt uitgebracht;'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel1
  - number: 1.c
    text: 'prestaties: het resultaat van de activiteiten waarop de baten en lasten betrekking hebben;'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel1
  - number: 1.d
    text: |-
      administratie: het systematisch verzamelen, vastleggen en verwerken van informatie ten behoeve van het bestuur en
      het beheer van de regio en de verantwoording die in dat kader wordt afgelegd;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel1
  - number: 1.e
    text: |-
      administratieve organisatie: het stelsel van organisatorische maatregelen gericht op het tot stand brengen en het
      in stand houden van de administratie.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel1
  - number: '2.1'
    text: 'De korpsbeheerder stelt financiële informatie op ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel2
  - number: 2.1.a
    text: het regionale besluitvormingsproces ten aanzien van de inzet van financiële middelen voor de beoogde prestaties;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel2
  - number: 2.1.b
    text: |-
      een doelmatige informatie-uitwisseling tussen de regio’s en het Rijk alsmede tussen de regio’s en eventuele andere
      gebruikers.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel2
  - number: '2.2'
    text: 'De financiële informatie omvat de volgende informatiedragers:'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel2
  - number: 2.2.a
    text: de meerjarenraming;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel2
  - number: 2.2.b
    text: de begroting;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel2
  - number: 2.2.c
    text: de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel2
  - number: '2.3'
    text: |-
      In het belang van een doelmatige informatie-uitwisseling, genoemd in het eerste lid, kan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties bij ministeriële regeling nadere regels geven over de totstandkoming van
      de onderscheidenlijke posten van de informatiedragers, genoemd in het vorige lid.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel2
  - number: '2.4'
    text: |-
      De normen en beginselen die op het gebied van de externe financiële verslaggeving in het maatschappelijk verkeer
      als aanvaard worden beschouwd, zijn van overeenkomstige toepassing op de financiële informatievoorziening van de
      regionale politiekorpsen.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel2
  - number: '3.1'
    text: |-
      De meerjarenraming heeft betrekking op het jaar waarvoor de begroting dient, alsmede op ten minste de drie op het
      begrotingsjaar volgende jaren.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
  - number: '3.2'
    text: De begroting is de uitgewerkte eerste jaarschijf van de meerjarenraming.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
  - number: '3.3'
    text: De begroting en de meerjarenraming worden op basis van het stelsel van baten en lasten opgesteld.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
  - number: '3.4'
    text: |-
      De begroting en de meerjarenraming geven duidelijk en stelselmatig inzicht in de geraamde baten en lasten, de
      geraamde investeringen en de financiering hiervan en de ontwikkeling in de vermogenspositie. Zij vormen een
      betrouwbare weergave van de financiële gevolgen van de in het beleidsplan geformuleerde uitgangspunten. De
      begroting geeft tevens duidelijk en stelselmatig inzicht in het financiële aandeel van de regio in voorzieningen
      tot samenwerking als bedoeld in [artikel 47 van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel47
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '47'
  - number: '3.5'
    text: 'De begroting en de meerjarenraming bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
  - number: 3.5.a
    text: een overzicht van baten en lasten;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
  - number: 3.5.b
    text: een overzicht van de geraamde investeringen;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
  - number: 3.5.c
    text: een geprognosticeerde balans bij de begroting en de meerjarenraming;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
  - number: 3.5.d
    text: een kasstroomoverzicht;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
  - number: 3.5.e
    text: gegevens ten aanzien van het vermogen;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
  - number: 3.5.f
    text: de toelichtingen hierop.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
  - number: '3.6'
    text: |-
      Bij ministeriële regeling stellen Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie
      modellen vast voor de overzichten, bedoeld in het vijfde lid, onderdelen a tot en met d.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
  - number: '4.1'
    text: |-
      De geraamde baten en lasten worden in de begroting gerangschikt naar kostensoorten, functies en kostendragers. Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt bij ministeriële regeling de kostensoorten, functies
      en kostendragers vast.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4
  - number: '4.2'
    text: |-
      De geraamde baten en lasten worden in de meerjarenraming gerangschikt naar hoofdgroepen van kostensoorten, functies
      en kostendragers. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt bij ministeriële regeling de
      functies en de hoofdgroepen van kostensoorten en kostendragers vast.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties geeft regels over de wijze van toerekening van
      kostensoorten naar kostendragers.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4
  - number: '4.4'
    text: |-
      Het opstellen van de begroting en van de meerjarenraming geschiedt met inachtneming van de regels die in
      [hoofdstuk 3][ref1] en [hoofdstuk 4][ref2] zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006563#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006563
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006563
        hoofdstuk: '4'
  - number: '4.5'
    text: De baten en lasten worden geraamd tegen hun brutobedrag.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4
  - number: '4.6'
    text: |-
      Bij iedere post van de begroting wordt het bedrag van de raming van het voorafgaande jaar en het gerealiseerde
      bedrag van het daaraan voorafgaande jaar vermeld.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4
  - number: 4a.1
    text: |-
      De begroting en de meerjarenraming bevatten gegevens die inzicht geven in de opbouw van het vermogen, de baten en
      de lasten van de regio. De gegevens geven in ieder geval inzicht in:
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4a
  - number: 4a.1.a
    text: de verhouding tussen de personele lasten en de totale baten;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4a
  - number: 4a.1.b
    text: |-
      de verhouding tussen de omvang van het eigen vermogen enerzijds en het totaalbedrag van de balans anderzijds. Deze
      verhoudingen worden uitgedrukt in verhoudingsgetallen.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4a
  - number: 4a.2
    text: |-
      Bij ministeriële regeling stelt Onze Minister de technische definities en de in het eerste lid bedoelde
      verhoudingsgetallen vast, alsmede de bandbreedtes waarbinnen deze verhoudingsgetallen zich dienen te bevinden.
      Onder verhoudingsgetal wordt verstaan het getal waarin de in het eerste lid genoemde verhoudingen worden
      uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4a
  - number: '5.1'
    text: |-
      De toelichtingen, bedoeld in [artikel 3, vijfde lid, onder f][ref1], bevatten in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel3
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: '3'
        hoofdstuk: '2'
  - number: 5.1.a
    text: een uiteenzetting van de financiële toestand van de regio;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.b
    text: een uiteenzetting omtrent de uitgangspunten van beleid die aan de ramingen ten grondslag hebben gelegen;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.c
    text: |-
      de gegevens waarop de ramingen zijn gebaseerd en, in geval van een aanmerkelijk verschil met de ramingen van het
      voorafgaande begrotingsjaar, de oorzaak daarvan;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.d
    text: een overzicht van de geraamde bedragen voor investeringen en de wijze van financiering;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.e
    text: een overzicht van de geactiveerde investeringen;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.f
    text: een overzicht van de aangegane en aan te gane geldleningen;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.g
    text: een overzicht van de reserves;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.h
    text: een overzicht van de voorzieningen;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.i
    text: een uiteenzetting van de wijze waarop de baten en lasten zijn toegerekend aan de kostendragers;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.j
    text: |-
      een overzicht van de omvang en samenstelling van de formatie, de verwachte feitelijke bezetting en het aantal post-
      actieve ambtenaren;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.k
    text: voor de geraamde lasten, waar dit mogelijk en van belang is, gegevens omtrent te leveren prestaties;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.l
    text: een dekkingsplan indien er een tekort is;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: 5.1.m
    text: een risicoparagraaf.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
  - number: '5.2'
    text: |-
      Indien op grond van [artikel 36, eerste lid, van de Politiewet 1993][ref1] bevoegdheden met betrekking tot het
      beheer van een territoriaal onderdeel zijn gedelegeerd aan een of meer burgemeesters, worden de in het eerste lid
      bedoelde elementen voor zover het dit territoriaal onderdeel betreft apart tot uitdrukking gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel36
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '36'
  - number: '6.1'
    text: |-
      Het beleidsplan, de begroting en de meerjarenraming worden met de nodige inlichtingen en bescheiden ten minste vier
      maanden vóór de aanvang van het jaar waarvoor de begroting moet dienen, door de korpsbeheerder aan het regionale
      college aangeboden.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde stukken worden, zodra zij zijn aangeboden, op een centrale plaats binnen de regio ter
      inzage neergelegd. Hiervan wordt melding gemaakt door een algemene publikatie. Tegen betaling van de kosten wordt
      een afschrift van de in het eerste lid bedoelde stukken beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel6
  - number: '6.3'
    text: |-
      Het regionale college stelt het beleidsplan en de begroting vast twee maanden vóór aanvang van het jaar waarvoor de
      begroting moet dienen.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel6
  - number: '6.4'
    text: |-
      Het regionale college ziet er op toe dat de begroting in evenwicht is. Het college kan een begroting vaststellen
      die niet in evenwicht is, indien aannemelijk is dat het evenwicht in de begroting in de eerstvolgende drie jaren
      tot stand zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel6
  - number: '7.1'
    text: |-
      Besluiten tot wijziging van de vastgestelde begroting kunnen door het regionale college tot uiterlijk eind van het
      desbetreffende begrotingsjaar worden genomen.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel7
  - number: '7.2'
    text: |-
      Behoudens [het derde lid van dit artikel][ref1] kunnen ten laste van de regio slechts die bedragen worden gebracht
      die op de begroting beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel7
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: '7'
        hoofdstuk: '2'
  - number: '7.3'
    text: |-
      In gevallen van dringende spoed kan door de korpsbeheerder een uitgave worden gedaan voordat de desbetreffende
      begroting door het regionale college is vastgesteld, dan wel een uitgave worden gedaan die niet in de begroting
      is voorzien. Het regionale college ontvangt van een zodanige uitgave terstond bericht. De korpsbeheerder zendt zo
      spoedig mogelijk een voorstel tot wijziging van de begroting aan het regionale college waarin de met deze uitgave
      samenhangende lasten alsnog in de begroting worden opgenomen, voor zover daarin niet reeds is voorzien.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel7
  - number: '8.1'
    text: 'De jaarrekening geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd over:'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: 8.1.a
    text: de financiële gevolgen van de uitvoering van de begroting in het afgelopen begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: 8.1.b
    text: de prestaties die bij de begroting van belang werden geacht;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: 8.1.c
    text: de verkrijging en aanwending van de financiële middelen en de daaruit voortvloeiende positie in activa en passiva;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: 8.1.d
    text: |-
      het financiële aandeel van de regio in voorzieningen tot samenwerking als bedoeld in
      [artikel 47 van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel47
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '47'
  - number: '8.2'
    text: 'De jaarrekening bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: 8.2.a
    text: een staat van baten en lasten;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: 8.2.b
    text: een staat van gerealiseerde investeringen;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: 8.2.c
    text: een balans;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: 8.2.d
    text: een kasstroomoverzicht;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: 8.2.e
    text: gegevens ten aanzien van het vermogen;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: 8.2.f
    text: de toelichtingen hierop.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: '8.3'
    text: |-
      Bij ministeriële regeling stelt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties modellen vast voor de
      staten, de balans en het overzicht, bedoeld in het tweede lid, onderdelen a tot en met d.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
  - number: '9.1'
    text: |-
      De jaarrekening wordt vastgesteld met inachtneming van hetgeen omtrent de financiële toestand op de balansdatum is
      gebleken in de periode tussen het opmaken van de jaarrekening en de vergadering van het regionale college waarin de
      jaarrekening wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel9
  - number: '9.2'
    text: |-
      De staat van baten en lasten met toelichting geeft getrouw, duidelijk en stelselmatig de grootte van het
      exploitatiesaldo van het begrotingsjaar en de afleiding uit posten van baten en lasten weer.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel9
  - number: '9.3'
    text: |-
      De staat van gerealiseerde investeringen met toelichting vormt een getrouwe, duidelijke en stelselmatige weergave
      van de in het verslagjaar gerealiseerde investeringsuitgaven.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel9
  - number: '9.4'
    text: |-
      De balans met toelichting geeft getrouw, duidelijk en stelselmatig de grootte van het vermogen en zijn
      samenstelling in actief- en passiefposten op het einde van het begrotingsjaar weer. De balans wordt opgemaakt na
      verwerking van het exploitatiesaldo.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel9
  - number: '10.1'
    text: |-
      De baten en lasten van het begrotingsjaar worden in de jaarrekening opgenomen onverschillig of zij tot ontvangsten
      of uitgaven in het begrotingsjaar hebben geleid.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel10
  - number: '10.2'
    text: |-
      In de staat van baten en lasten worden de baten en lasten, alsmede de nadere splitsing daarvan, op dezelfde wijze
      gerangschikt als in de begroting.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel10
  - number: '10.3'
    text: |-
      Bij iedere post van de staat van baten en lasten wordt het gerealiseerde bedrag van het voorafgaande begrotingsjaar
      en het begrote bedrag van het verslagjaar opgenomen.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel10
  - number: '10.4'
    text: Afwijkingen tussen de begroting en de realisatie worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel10
  - number: '11.1'
    text: |-
      De staat van gerealiseerde investeringen heeft de dezelfde indeling als de staat van geraamde investeringen bij
      de begroting.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel11
  - number: '11.2'
    text: |-
      Bij iedere post van de staat van gerealiseerde investeringen worden ter vergelijking de geraamde investeringen van
      het begrotingsjaar opgenomen.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel11
  - number: '11.3'
    text: Afwijkingen tussen de raming en de realisatie worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel11
  - number: '12.1'
    text: |-
      De activa en passiva worden gegroepeerd volgens een door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties bij ministeriële regeling vastgestelde indeling van de balans.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel12
  - number: '12.2'
    text: 'Op de balans worden voorzieningen opgenomen tegen:'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel12
  - number: 12.2.a
    text: verplichtingen waarvan de omvang op balansdatum onzeker is, doch redelijkerwijs is te schatten;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel12
  - number: 12.2.b
    text: |-
      op de balansdatum bestaande risico’s ter zake van bepaalde te verwachten verplichtingen waarvan de omvang
      redelijkerwijs is te schatten;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel12
  - number: 12.2.c
    text: |-
      kosten die in een volgend begrotingsjaar zullen worden gemaakt, mits het maken van die kosten zijn oorsprong mede
      vindt in het verslagjaar of in een voorafgaand verslagjaar en de voorziening strekt tot gelijkmatige verdeling van
      lasten over een aantal begrotingsjaren.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel12
  - number: '12.3'
    text: |-
      Waardevermindering van een actief wordt niet door de vorming van een voorziening tot uitdrukking gebracht, maar in
      mindering op het actief gebracht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel12
  - number: '13.1'
    text: |-
      De toelichting op de balans bevat door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties per balanspost
      of groep van balansposten bij ministeriële regeling voorgeschreven informatie.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel13
  - number: '13.2'
    text: |-
      De toelichting vermeldt tot welke belangrijke, niet in de balans opgenomen verplichtingen de regio voor een aantal
      toekomstige jaren is verbonden.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel13
  - number: '13.3'
    text: |-
      De toelichting bevat een overzicht van de omvang en samenstelling van het personeel in het verslagjaar, opgesteld
      volgens dezelfde opzet als waarmee het overzicht, bedoeld in [artikel 5, eerste lid, onder ][ref1], is opgesteld
      alsmede, voor zover van belang bij de jaarrekening, de overige in [artikel 5, eerste lid][ref2], bedoelde
      onderwerpen


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006563#Artikel5
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006563
        artikel: '5'
        hoofdstuk: '2'
  - number: 13a.1
    text: |-
      De jaarrekening bevat gegevens die inzicht geven in de opbouw van het vermogen, de baten en de lasten van de regio.
      De gegevens geven in ieder geval inzicht in:
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel13a
  - number: 13a.1.a
    text: de verhouding tussen de personele lasten en de totale baten;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel13a
  - number: 13a.1.b
    text: |-
      de verhouding tussen de omvang van het eigen vermogen enerzijds en het totaalbedrag van de balans anderzijds. Deze
      verhoudingen worden uitgedrukt in verhoudingsgetallen.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel13a
  - number: 13a.2
    text: |-
      Bij ministeriële regeling stelt Onze Minister de technische definities en de in het eerste lid bedoelde
      verhoudingsgetallen vast, alsmede de bandbreedtes waarbinnen deze verhoudingsgetallen zich dienen te bevinden.
      Onder verhoudingsgetal wordt verstaan het getal waarin de in het eerste lid genoemde verhoudingen worden
      uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel13a
  - number: '14.1'
    text: |-
      De jaarrekening wordt na afloop van het begrotingsjaar zo spoedig mogelijk met de nodige inlichtingen en bescheiden
      door de korpsbeheerder aan het regionale college aangeboden.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: '14.2'
    text: |-
      De jaarrekening wordt, zodra zij is aangeboden, op een centrale plaats binnen de regio ter inzage neergelegd.
      Hiervan wordt melding gemaakt door een algemene publikatie. Tegen betaling van de kosten wordt een afschrift van de
      jaarrekening ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: '14.3'
    text: 'De jaarrekening gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: 14.3.a
    text: een door de korpsbeheerder opgemaakt verslag ter verantwoording van het gevoerde beheer,
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: 14.3.b
    text: een accountantsverklaring,
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: 14.3.c
    text: een voorstel tot resultaatbestemming, en
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: 14.3.d
    text: |-
      een overzicht van gebeurtenissen na balansdatum voor zover deze betrekking hebben op omstandigheden met belangrijke
      financiële gevolgen en die van invloed zijn op het beeld dat de jaarrekening oproept.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: '14.4'
    text: |-
      De in het derde lid, onder *b*, bedoelde verklaring houdt in een oordeel omtrent de getrouwheid van de jaarrekening
      en de rechtmatigheid van het daarin verantwoorde financiële beheer
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: '14.5'
    text: |-
      De accountant brengt een verslag uit, dat bevindingen bevat over de vraag of de administratie en het beheer voldoen
      aan de eisen van rechtmatigheid en doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: '14.6'
    text: |-
      Het regionale college stelt de jaarrekening en de bestemming van het resultaat vast uiterlijk 31 maart van het jaar
      volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: '14.7'
    text: |-
      De vaststelling van de jaarrekening, genoemd in het zesde lid, houdt in het verlenen van decharge aan de
      korpsbeheerder inzake het door hem gevoerde en in de jaarrekening verantwoorde financiële beheer.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: '15'
    text: |-
      Bij de keuze van de grondslag voor waardering van activa en passiva voor de bepaling van het resultaat zijn de
      normen, bedoeld in [artikel 2, derde lid][ref1], en [artikel 9][ref2], bepalend.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006563#Artikel9
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006563
        artikel: '9'
        hoofdstuk: '3'
  - number: '16.1'
    text: |-
      De waardering van de vaste activa geschiedt tegen de verkrijgingsprijs of de vervaardigingsprijs, verminderd met
      eventuele afschrijvingen.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel16
  - number: '16.2'
    text: |-
      Vlottende activa worden gewaardeerd tegen verkrijgingsprijs, dan wel tegen marktwaarde indien deze op de
      balansdatum lager is dan de verkrijgingsprijs.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel16
  - number: '16.3'
    text: De verkrijgingsprijs omvat de inkoopprijs en de bijkomende kosten.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel16
  - number: '16.4'
    text: |-
      De vervaardigingsprijs omvat de aanschaffingskosten van de gebruikte grond- en hulpstoffen en de overige kosten
      welke rechtstreeks aan de vervaardiging kunnen worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel16
  - number: '16.5'
    text: Vorderingen en voorzieningen worden tegen nominale waarde gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel16
  - number: '16.6'
    text: |-
      Waardeverminderingen van activa worden onafhankelijk van het resultaat van het begrotingsjaar in aanmerking
      genomen.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel16
  - number: '16.7'
    text: |-
      Bij de waardering van vaste activa wordt rekening gehouden met een vermindering van hun waarde, indien deze naar
      verwachting duurzaam is.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel16
  - number: '16.8'
    text: |-
      De afboeking overeenkomstig het eerste tot en met het zevende lid wordt ten laste van de staat van baten en lasten
      gebracht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel16
  - number: '17.1'
    text: |-
      Op vaste activa wordt jaarlijks afgeschreven volgens een stelsel dat op de verwachte toekomstige gebruiksduur is
      afgestemd.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel17
  - number: '17.2'
    text: |-
      Bij ministeriële regeling kan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties nadere regels stellen
      over het stelsel, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel17
  - number: '18.1'
    text: Toevoegingen aan voorzieningen komen ten laste van de desbetreffende kostendrager.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel18
  - number: '18.2'
    text: Onttrekkingen aan voorzieningen worden rechtstreeks ten laste van de balanspost voorzieningen gebracht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel18
  - number: 18a
    text: |-
      Bij ministeriële regeling kan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties nadere regels stellen
      over het aanhouden van reserves, voorzieningen en uitgangspunten ten aanzien van kortlopende schulden.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel18a
  - number: '19.1'
    text: |-
      Het regionale college stelt, op voordracht van de korpsbeheerder, met het oog op eisen van doelmatigheid
      en controle regels vast met betrekking tot de organisatie van de administratie en van het beheer van de
      vermogenswaarden van de regio.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel19
  - number: '19.2'
    text: |-
      Het regionale college stelt, op voordracht van de korpsbeheerder, regels vast met betrekking tot de controle op de
      administratie en op het beheer van de vermogenswaarden.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel19
  - number: '19.3'
    text: |-
      De regels, bedoeld in het tweede lid, voorzien in de aanwijzing van een of meer accountants, belast met het in
      [artikel 14, vierde lid][ref1], bedoelde onderzoek, alsmede voorzien zij in een financieringsstatuut, waarin in
      ieder geval regels zijn opgenomen ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel14
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: '14'
        hoofdstuk: '3'
  - number: 19.3.a
    text: de algemene doelstellingen en de te hanteren richtlijnen en limieten van de financieringsfunctie;
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel19
  - number: 19.3.b
    text: |-
      de administratieve organisatie van de financieringsfunctie, waaronder begrepen taken en bevoegdheden, de
      verantwoordingsrelaties en de bijbehorende informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel19
  - number: '21.1'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel21
  - number: '21.2'
    text: |-
      De in [artikel 4, eerste, tweede en derde lid][ref1], voorgeschreven rangschikking en toerekening naar
      kostendragers zullen op een door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties later bekend te maken
      tijdstip ingaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel4
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: '4'
        hoofdstuk: '2'
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Besluit comptabele regelgeving regionale politiekorpsen.'
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel22
