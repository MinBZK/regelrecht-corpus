preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Binnenlandse Zaken van 2 december 1993, nummer EA93/U3431, gedaan in
    overeenstemming met Onze Minister van Justitie;


    Gelet op artikel 45 en artikel 47, eerste lid, van de Politiewet 1993;


    De Raad van State gehoord (advies van 15 februari 1994, nummer WO4.93.0809);


    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 24 maart 1994, nummer EA94/U872, uitgebracht
    mede namens Onze Minister van Justitie DGW431139/94/6;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In dit besluit wordt verstaan onder:


      a. begrotingsjaar: het kalenderjaar waarvoor de begroting dient;


      b. verslagjaar: het kalenderjaar waarover verslag wordt uitgebracht;


      c. prestaties: het resultaat van de activiteiten waarop de baten en lasten betrekking hebben;


      d. administratie: het systematisch verzamelen, vastleggen en verwerken van informatie ten behoeve van het bestuur
      en het beheer van de regio en de verantwoording die in dat kader wordt afgelegd;


      e. administratieve organisatie: het stelsel van organisatorische maatregelen gericht op het tot stand brengen en
      het in stand houden van de administratie.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel1
  - number: '2'
    text: >-
      1 De korpsbeheerder stelt financiële informatie op ten behoeve van:


      a. het regionale besluitvormingsproces ten aanzien van de inzet van financiële middelen voor de beoogde prestaties;


      b. een doelmatige informatie-uitwisseling tussen de regio’s en het Rijk alsmede tussen de regio’s en eventuele
      andere gebruikers.


      2 De financiële informatie omvat de volgende informatiedragers:


      a. de meerjarenraming;


      b. de begroting;


      c. de jaarrekening.


      3 In het belang van een doelmatige informatie-uitwisseling, genoemd in het eerste lid, kan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties bij ministeriële regeling nadere regels geven over de totstandkoming van
      de onderscheidenlijke posten van de informatiedragers, genoemd in het vorige lid.


      4 De normen en beginselen die op het gebied van de externe financiële verslaggeving in het maatschappelijk verkeer
      als aanvaard worden beschouwd, zijn van overeenkomstige toepassing op de financiële informatievoorziening van de
      regionale politiekorpsen.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel2
  - number: '3'
    text: |-
      1 De meerjarenraming heeft betrekking op het jaar waarvoor de begroting dient, alsmede op ten minste de drie op het
      begrotingsjaar volgende jaren.

      2 De begroting is de uitgewerkte eerste jaarschijf van de meerjarenraming.

      3 De begroting en de meerjarenraming worden op basis van het stelsel van baten en lasten opgesteld.

      4 De begroting en de meerjarenraming geven duidelijk en stelselmatig inzicht in de geraamde baten en lasten,
      de geraamde investeringen en de financiering hiervan en de ontwikkeling in de vermogenspositie. Zij vormen
      een betrouwbare weergave van de financiële gevolgen van de in het beleidsplan geformuleerde uitgangspunten. De
      begroting geeft tevens duidelijk en stelselmatig inzicht in het financiële aandeel van de regio in voorzieningen
      tot samenwerking als bedoeld in [artikel 47 van de Politiewet 1993][ref1].

      5 De begroting en de meerjarenraming bestaan uit:

      a. een overzicht van baten en lasten;

      b. een overzicht van de geraamde investeringen;

      c. een geprognosticeerde balans bij de begroting en de meerjarenraming;

      d. een kasstroomoverzicht;

      e. gegevens ten aanzien van het vermogen;

      f. de toelichtingen hierop.

      6 Bij ministeriële regeling stellen Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie
      modellen vast voor de overzichten, bedoeld in het vijfde lid, onderdelen a tot en met d.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel47
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '47'
  - number: '4'
    text: |-
      1 De geraamde baten en lasten worden in de begroting gerangschikt naar kostensoorten, functies en kostendragers.
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt bij ministeriële regeling de kostensoorten,
      functies en kostendragers vast.

      2 De geraamde baten en lasten worden in de meerjarenraming gerangschikt naar hoofdgroepen van kostensoorten,
      functies en kostendragers. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt bij ministeriële
      regeling de functies en de hoofdgroepen van kostensoorten en kostendragers vast.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties geeft regels over de wijze van toerekening van
      kostensoorten naar kostendragers.

      4 Het opstellen van de begroting en van de meerjarenraming geschiedt met inachtneming van de regels die in
      [hoofdstuk 3][ref1] en [hoofdstuk 4][ref2] zijn vermeld.

      5 De baten en lasten worden geraamd tegen hun brutobedrag.

      6 Bij iedere post van de begroting wordt het bedrag van de raming van het voorafgaande jaar en het gerealiseerde
      bedrag van het daaraan voorafgaande jaar vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006563#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006563
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006563
        hoofdstuk: '4'
  - number: 4a
    text: >-
      1 De begroting en de meerjarenraming bevatten gegevens die inzicht geven in de opbouw van het vermogen, de baten en
      de lasten van de regio. De gegevens geven in ieder geval inzicht in:


      a. de verhouding tussen de personele lasten en de totale baten;


      b. de verhouding tussen de omvang van het eigen vermogen enerzijds en het totaalbedrag van de balans anderzijds.
      Deze verhoudingen worden uitgedrukt in verhoudingsgetallen.


      2 Bij ministeriële regeling stelt Onze Minister de technische definities en de in het eerste lid bedoelde
      verhoudingsgetallen vast, alsmede de bandbreedtes waarbinnen deze verhoudingsgetallen zich dienen te bevinden.
      Onder verhoudingsgetal wordt verstaan het getal waarin de in het eerste lid genoemde verhoudingen worden
      uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel4a
  - number: '5'
    text: |-
      1 De toelichtingen, bedoeld in [artikel 3, vijfde lid, onder f][ref1], bevatten in elk geval:

      a. een uiteenzetting van de financiële toestand van de regio;

      b. een uiteenzetting omtrent de uitgangspunten van beleid die aan de ramingen ten grondslag hebben gelegen;

      c. de gegevens waarop de ramingen zijn gebaseerd en, in geval van een aanmerkelijk verschil met de ramingen van het
      voorafgaande begrotingsjaar, de oorzaak daarvan;

      d. een overzicht van de geraamde bedragen voor investeringen en de wijze van financiering;

      e. een overzicht van de geactiveerde investeringen;

      f. een overzicht van de aangegane en aan te gane geldleningen;

      g. een overzicht van de reserves;

      h. een overzicht van de voorzieningen;

      i. een uiteenzetting van de wijze waarop de baten en lasten zijn toegerekend aan de kostendragers;

      j. een overzicht van de omvang en samenstelling van de formatie, de verwachte feitelijke bezetting en het aantal
      post-actieve ambtenaren;

      k. voor de geraamde lasten, waar dit mogelijk en van belang is, gegevens omtrent te leveren prestaties;

      l. een dekkingsplan indien er een tekort is;

      m. een risicoparagraaf.

      2 Indien op grond van [artikel 36, eerste lid, van de Politiewet 1993][ref2] bevoegdheden met betrekking tot het
      beheer van een territoriaal onderdeel zijn gedelegeerd aan een of meer burgemeesters, worden de in het eerste lid
      bedoelde elementen voor zover het dit territoriaal onderdeel betreft apart tot uitdrukking gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel36
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '36'
  - number: '6'
    text: >-
      1 Het beleidsplan, de begroting en de meerjarenraming worden met de nodige inlichtingen en bescheiden ten minste
      vier maanden vóór de aanvang van het jaar waarvoor de begroting moet dienen, door de korpsbeheerder aan het
      regionale college aangeboden.


      2 De in het eerste lid bedoelde stukken worden, zodra zij zijn aangeboden, op een centrale plaats binnen de regio
      ter inzage neergelegd. Hiervan wordt melding gemaakt door een algemene publikatie. Tegen betaling van de kosten
      wordt een afschrift van de in het eerste lid bedoelde stukken beschikbaar gesteld.


      3 Het regionale college stelt het beleidsplan en de begroting vast twee maanden vóór aanvang van het jaar waarvoor
      de begroting moet dienen.


      4 Het regionale college ziet er op toe dat de begroting in evenwicht is. Het college kan een begroting vaststellen
      die niet in evenwicht is, indien aannemelijk is dat het evenwicht in de begroting in de eerstvolgende drie jaren
      tot stand zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel6
  - number: '7'
    text: |-
      1 Besluiten tot wijziging van de vastgestelde begroting kunnen door het regionale college tot uiterlijk eind van
      het desbetreffende begrotingsjaar worden genomen.

      2 Behoudens [het derde lid van dit artikel][ref1] kunnen ten laste van de regio slechts die bedragen worden
      gebracht die op de begroting beschikbaar zijn.

      3 In gevallen van dringende spoed kan door de korpsbeheerder een uitgave worden gedaan voordat de desbetreffende
      begroting door het regionale college is vastgesteld, dan wel een uitgave worden gedaan die niet in de begroting
      is voorzien. Het regionale college ontvangt van een zodanige uitgave terstond bericht. De korpsbeheerder zendt zo
      spoedig mogelijk een voorstel tot wijziging van de begroting aan het regionale college waarin de met deze uitgave
      samenhangende lasten alsnog in de begroting worden opgenomen, voor zover daarin niet reeds is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel7
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: '7'
        hoofdstuk: '2'
  - number: '8'
    text: |-
      1 De jaarrekening geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd over:

      a. de financiële gevolgen van de uitvoering van de begroting in het afgelopen begrotingsjaar;

      b. de prestaties die bij de begroting van belang werden geacht;

      c. de verkrijging en aanwending van de financiële middelen en de daaruit voortvloeiende positie in activa en
      passiva;

      d. het financiële aandeel van de regio in voorzieningen tot samenwerking als bedoeld in
      [artikel 47 van de Politiewet 1993][ref1].

      2 De jaarrekening bestaat uit:

      a. een staat van baten en lasten;

      b. een staat van gerealiseerde investeringen;

      c. een balans;

      d. een kasstroomoverzicht;

      e. gegevens ten aanzien van het vermogen;

      f. de toelichtingen hierop.

      3 Bij ministeriële regeling stelt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties modellen vast voor de
      staten, de balans en het overzicht, bedoeld in het tweede lid, onderdelen a tot en met d.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel47
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '47'
  - number: '9'
    text: >-
      1 De jaarrekening wordt vastgesteld met inachtneming van hetgeen omtrent de financiële toestand op de balansdatum
      is gebleken in de periode tussen het opmaken van de jaarrekening en de vergadering van het regionale college waarin
      de jaarrekening wordt vastgesteld.


      2 De staat van baten en lasten met toelichting geeft getrouw, duidelijk en stelselmatig de grootte van het
      exploitatiesaldo van het begrotingsjaar en de afleiding uit posten van baten en lasten weer.


      3 De staat van gerealiseerde investeringen met toelichting vormt een getrouwe, duidelijke en stelselmatige weergave
      van de in het verslagjaar gerealiseerde investeringsuitgaven.


      4 De balans met toelichting geeft getrouw, duidelijk en stelselmatig de grootte van het vermogen en zijn
      samenstelling in actief- en passiefposten op het einde van het begrotingsjaar weer. De balans wordt opgemaakt na
      verwerking van het exploitatiesaldo.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel9
  - number: '10'
    text: >-
      1 De baten en lasten van het begrotingsjaar worden in de jaarrekening opgenomen onverschillig of zij tot
      ontvangsten of uitgaven in het begrotingsjaar hebben geleid.


      2 In de staat van baten en lasten worden de baten en lasten, alsmede de nadere splitsing daarvan, op dezelfde wijze
      gerangschikt als in de begroting.


      3 Bij iedere post van de staat van baten en lasten wordt het gerealiseerde bedrag van het voorafgaande
      begrotingsjaar en het begrote bedrag van het verslagjaar opgenomen.


      4 Afwijkingen tussen de begroting en de realisatie worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel10
  - number: '11'
    text: >-
      1 De staat van gerealiseerde investeringen heeft de dezelfde indeling als de staat van geraamde investeringen bij
      de begroting.


      2 Bij iedere post van de staat van gerealiseerde investeringen worden ter vergelijking de geraamde investeringen
      van het begrotingsjaar opgenomen.


      3 Afwijkingen tussen de raming en de realisatie worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel11
  - number: '12'
    text: >-
      1 De activa en passiva worden gegroepeerd volgens een door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties bij ministeriële regeling vastgestelde indeling van de balans.


      2 Op de balans worden voorzieningen opgenomen tegen:


      a. verplichtingen waarvan de omvang op balansdatum onzeker is, doch redelijkerwijs is te schatten;


      b. op de balansdatum bestaande risico’s ter zake van bepaalde te verwachten verplichtingen waarvan de omvang
      redelijkerwijs is te schatten;


      c. kosten die in een volgend begrotingsjaar zullen worden gemaakt, mits het maken van die kosten zijn oorsprong
      mede vindt in het verslagjaar of in een voorafgaand verslagjaar en de voorziening strekt tot gelijkmatige verdeling
      van lasten over een aantal begrotingsjaren.


      3 Waardevermindering van een actief wordt niet door de vorming van een voorziening tot uitdrukking gebracht, maar
      in mindering op het actief gebracht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel12
  - number: '13'
    text: |-
      1 De toelichting op de balans bevat door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties per balanspost
      of groep van balansposten bij ministeriële regeling voorgeschreven informatie.

      2 De toelichting vermeldt tot welke belangrijke, niet in de balans opgenomen verplichtingen de regio voor een
      aantal toekomstige jaren is verbonden.

      3 De toelichting bevat een overzicht van de omvang en samenstelling van het personeel in het verslagjaar,
      opgesteld volgens dezelfde opzet als waarmee het overzicht, bedoeld in [artikel 5, eerste lid, onder ][ref1], is
      opgesteld alsmede, voor zover van belang bij de jaarrekening, de overige in [artikel 5, eerste lid][ref2], bedoelde
      onderwerpen


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006563#Artikel5
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006563
        artikel: '5'
        hoofdstuk: '2'
  - number: 13a
    text: >-
      1 De jaarrekening bevat gegevens die inzicht geven in de opbouw van het vermogen, de baten en de lasten van de
      regio. De gegevens geven in ieder geval inzicht in:


      a. de verhouding tussen de personele lasten en de totale baten;


      b. de verhouding tussen de omvang van het eigen vermogen enerzijds en het totaalbedrag van de balans anderzijds.
      Deze verhoudingen worden uitgedrukt in verhoudingsgetallen.


      2 Bij ministeriële regeling stelt Onze Minister de technische definities en de in het eerste lid bedoelde
      verhoudingsgetallen vast, alsmede de bandbreedtes waarbinnen deze verhoudingsgetallen zich dienen te bevinden.
      Onder verhoudingsgetal wordt verstaan het getal waarin de in het eerste lid genoemde verhoudingen worden
      uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel13a
  - number: '14'
    text: >-
      1 De jaarrekening wordt na afloop van het begrotingsjaar zo spoedig mogelijk met de nodige inlichtingen en
      bescheiden door de korpsbeheerder aan het regionale college aangeboden.


      2 De jaarrekening wordt, zodra zij is aangeboden, op een centrale plaats binnen de regio ter inzage neergelegd.
      Hiervan wordt melding gemaakt door een algemene publikatie. Tegen betaling van de kosten wordt een afschrift van de
      jaarrekening ter beschikking gesteld.


      3 De jaarrekening gaat vergezeld van:


      a. een door de korpsbeheerder opgemaakt verslag ter verantwoording van het gevoerde beheer,


      b. een accountantsverklaring,


      c. een voorstel tot resultaatbestemming, en


      d. een overzicht van gebeurtenissen na balansdatum voor zover deze betrekking hebben op omstandigheden met
      belangrijke financiële gevolgen en die van invloed zijn op het beeld dat de jaarrekening oproept.


      4 De in het derde lid, onder *b*, bedoelde verklaring houdt in een oordeel omtrent de getrouwheid van de
      jaarrekening en de rechtmatigheid van het daarin verantwoorde financiële beheer


      5 De accountant brengt een verslag uit, dat bevindingen bevat over de vraag of de administratie en het beheer
      voldoen aan de eisen van rechtmatigheid en doelmatigheid.


      6 Het regionale college stelt de jaarrekening en de bestemming van het resultaat vast uiterlijk 31 maart van het
      jaar volgend op het begrotingsjaar.


      7 De vaststelling van de jaarrekening, genoemd in het zesde lid, houdt in het verlenen van decharge aan de
      korpsbeheerder inzake het door hem gevoerde en in de jaarrekening verantwoorde financiële beheer.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel14
  - number: '15'
    text: |-
      Bij de keuze van de grondslag voor waardering van activa en passiva voor de bepaling van het resultaat zijn de
      normen, bedoeld in [artikel 2, derde lid][ref1], en [artikel 9][ref2], bepalend.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006563#Artikel9
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006563
        artikel: '9'
        hoofdstuk: '3'
  - number: '16'
    text: >-
      1 De waardering van de vaste activa geschiedt tegen de verkrijgingsprijs of de vervaardigingsprijs, verminderd met
      eventuele afschrijvingen.


      2 Vlottende activa worden gewaardeerd tegen verkrijgingsprijs, dan wel tegen marktwaarde indien deze op de
      balansdatum lager is dan de verkrijgingsprijs.


      3 De verkrijgingsprijs omvat de inkoopprijs en de bijkomende kosten.


      4 De vervaardigingsprijs omvat de aanschaffingskosten van de gebruikte grond- en hulpstoffen en de overige kosten
      welke rechtstreeks aan de vervaardiging kunnen worden toegerekend.


      5 Vorderingen en voorzieningen worden tegen nominale waarde gewaardeerd.


      6 Waardeverminderingen van activa worden onafhankelijk van het resultaat van het begrotingsjaar in aanmerking
      genomen.


      7 Bij de waardering van vaste activa wordt rekening gehouden met een vermindering van hun waarde, indien deze naar
      verwachting duurzaam is.


      8 De afboeking overeenkomstig het eerste tot en met het zevende lid wordt ten laste van de staat van baten en
      lasten gebracht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel16
  - number: '17'
    text: >-
      1 Op vaste activa wordt jaarlijks afgeschreven volgens een stelsel dat op de verwachte toekomstige gebruiksduur
      is afgestemd.


      2 Bij ministeriële regeling kan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties nadere regels stellen
      over het stelsel, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel17
  - number: '18'
    text: >-
      1 Toevoegingen aan voorzieningen komen ten laste van de desbetreffende kostendrager.


      2 Onttrekkingen aan voorzieningen worden rechtstreeks ten laste van de balanspost voorzieningen gebracht.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel18
  - number: 18a
    text: >-
      Bij ministeriële regeling kan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties nadere regels stellen
      over het aanhouden van reserves, voorzieningen en uitgangspunten ten aanzien van kortlopende schulden.
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel18a
  - number: '19'
    text: |-
      1 Het regionale college stelt, op voordracht van de korpsbeheerder, met het oog op eisen van doelmatigheid
      en controle regels vast met betrekking tot de organisatie van de administratie en van het beheer van de
      vermogenswaarden van de regio.

      2 Het regionale college stelt, op voordracht van de korpsbeheerder, regels vast met betrekking tot de controle op
      de administratie en op het beheer van de vermogenswaarden.

      3 De regels, bedoeld in het tweede lid, voorzien in de aanwijzing van een of meer accountants, belast met het in
      [artikel 14, vierde lid][ref1], bedoelde onderzoek, alsmede voorzien zij in een financieringsstatuut, waarin in
      ieder geval regels zijn opgenomen ten aanzien van:

      a. de algemene doelstellingen en de te hanteren richtlijnen en limieten van de financieringsfunctie;

      b. de administratieve organisatie van de financieringsfunctie, waaronder begrepen taken en bevoegdheden, de
      verantwoordingsrelaties en de bijbehorende informatievoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel14
    url: https://wetten.overheid.nl/BWBR0006563/2006-07-14#Artikel19
