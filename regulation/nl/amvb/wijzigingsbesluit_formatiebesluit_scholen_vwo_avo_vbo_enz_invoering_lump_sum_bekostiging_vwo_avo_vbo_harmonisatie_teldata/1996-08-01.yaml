preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, T. Netelenbos, van 20 april
    1995, nr. 95009693/3663, directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Gelet op de artikelen 39, tweede lid, 77, vierde lid, 84, eerste lid, 85, eerste lid, 96r, 98a, 102b, achtste
    lid, en 106, eerste en derde lid, van de Wet op het voortgezet onderwijs, en de artikelen 5 en 6 van de Les- en
    cursusgeldwet;

    Gezien het advies van de Onderwijsraad (advies van 16 februari 1995, nr. OR 94000674/S);

    De Raad van State gehoord (advies van 6 juli 1995, nr. W05.95.0201);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, T. Netelenbos, van 17
    juli 1995, nr. 95019011/3663, directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van
    Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007489/1996-08-01#ArtikelAanhef
articles:
  - number: VII
    text: |-
      In afwijking van [artikel 8 van het Formatiebesluit W.V.O.][ref1] wordt wat de schooljaren 1996-1997 en 1997-1998
      betreft de som van de in dat artikel bedoelde aantallen formatieplaatsen van de afzonderlijke personeelscategorieën
      vermenigvuldigd met de gemiddelde personeelslast van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel8
    url: https://wetten.overheid.nl/BWBR0007489/1996-08-01#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '8'
  - number: VIII
    text: |-
      In afwijking van [artikel 4, tweede lid, van het Formatiebesluit W.V.O.][ref1] bedraagt de opslag wegens formatieve
      fricties voor de schooljaren 1996-1997 en 1997-1998 1,20%.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel4
    url: https://wetten.overheid.nl/BWBR0007489/1996-08-01#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '4'
  - number: IX
    text: |-
      De op grond van het [Formatiebesluit W.V.O.][ref1] vastgestelde aantallen formatieplaatsen worden
      voor het schooljaar 1996-1997 door Onze Minister van Onderwijs, Cultuur en Wetenschappen verhoogd voor
      scholen en scholengemeenschappen waarop wat dat schooljaar betreft [artikel II, eerste lid][ref2], of
      [artikel IV, eerste lid][ref3] juncto tweede lid, onder *b*, van het Besluit van 6 april 1993 (*Stb.* 209), zoals
      luidend op 31 juli 1996, toepassing zou hebben gevonden indien het Formatiebesluit scholen v.w.o.-a.v.o.-v.b.o. op
      1 augustus 1996 nog van kracht zou zijn geweest, met overeenkomstige toepassing van die artikelen. Bij ministeriële
      regeling worden nadere voorschriften gegeven voor de toepassing van de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0005446
      [ref2]: https://wetten.overheid.nl/BWBR0007489#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0007489#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0007489/1996-08-01#ArtikelIX
    references:
      - id: ref1
