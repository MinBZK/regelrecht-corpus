  - number: XIV
    text: |-
      Dit besluit treedt in werking met ingang van 1 augustus 1996, met uitzondering van de [artikelen I][ref1],
      [III][ref2] en [VI][ref3] tot en met [XI][ref4]. De [artikelen I][ref5], [III][ref6] en [VII][ref7] tot en met
      [XI][ref8] treden in werking op een bij koninklijk besluit te bepalen tijdstip. Laatstbedoeld besluit wordt ten
      aanzien van de [artikelen I][ref9] en [VII][ref10] tot en met [XI][ref11] niet genomen voordat vier weken zijn
      verstreken nadat het onderhavige besluit is overgelegd aan de beide Kamers der Staten-Generaal. Het in de tweede
      volzin bedoelde besluit wordt ten aanzien van [artikel III][ref12] niet genomen voordat vier weken zijn verstreken
      nadat het onderhavige besluit is overgelegd aan de beide Kamers der Staten-Generaal en gedurende die termijn niet
      door of namens een van beide kamers de wens wordt te kennen gegeven dat het artikel III geregelde onderwerp bij de
      wet wordt geregeld. [Artikel VI][ref13] treedt in werking met ingang van 31 juli 1996.


