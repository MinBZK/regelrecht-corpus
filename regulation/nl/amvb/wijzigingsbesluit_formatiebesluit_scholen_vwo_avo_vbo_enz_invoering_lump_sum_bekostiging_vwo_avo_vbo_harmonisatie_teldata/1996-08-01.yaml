      - id: ref2
        bwb_id: BWBR0007489
        artikel: II
      - id: ref3
        bwb_id: BWBR0007489
        artikel: IV
  - number: X
    text: |-
      Voor zover op grond van artikel 26, onderdeel *b*, van het Formatiebesluit scholen v.w.o.-a.v.o.-v.b.o. ook na 31
      juli 1996 aanspraak zou hebben bestaan op extra formatierekeneenheden, blijft die aanspraak in stand volgens de
      desbetreffende op 31 juli 1996 geldende voorschriften, met dien verstande dat de aanspraak wordt uitgedrukt in een
      aantal formatieplaatsen. Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van de eerste
      volzin.
    url: https://wetten.overheid.nl/BWBR0007489/1996-08-01#ArtikelX
  - number: XI
    text: |-
      1 In afwijking van [artikel 6, eerste lid, van het Formatiebesluit W.V.O.][ref1] wordt bij de toepassing van dat
      artikellid voor het schooljaar 1996-1997 in aanmerking genomen het aantal leerlingen dat op 15 september 1995 als
      werkelijk schoolgaand is ingeschreven.

      2 In afwijking van [artikel 6, derde lid, van het Formatiebesluit W.V.O.][ref2] wordt bij de toepassing van dat
      artikellid voor het schooljaar 1996-1997 bij de onderdelen Lt-1 onderscheidenlijk Lt-2 van de in het tweede lid van
      dat artikel genoemde formule in aanmerking genomen het aantal leerlingen dat op 15 september 1995 onderscheidenlijk
      15 september 1994 als werkelijk schoolgaand is ingeschreven.

      3 In afwijking van [artikel 6, derde lid, van het Formatiebesluit W.V.O.][ref3] wordt bij de toepassing van dat
      artikellid voor het schooljaar 1997-1998 bij onderdeel Lt-2 van de in het tweede lid van dat artikel genoemde
      formule in aanmerking genomen het aantal leerlingen dat op 15 september 1995 als werkelijk schoolgaand is
      ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005446#Artikel6
