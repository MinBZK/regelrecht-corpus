$id: besluit_waardevaststelling_netten_voor_elektriciteit_en_voor_gastransport
regulatory_layer: AMVB
publication_date: '2025-11-12'
valid_from: '2013-09-28'
bwb_id: BWBR0033945
url: https://wetten.overheid.nl/BWBR0033945/2013-09-28
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 15 juli 2013, nr. WJZ / 13121812;

    Gelet op de artikelen 13, achtste lid, van de Elektriciteitswet 1998 en artikel 5, achtste lid, van de Gaswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 14 augustus 2013, nr. W. 15.13.0244IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 12 september 2013, nr. WJZ / 13152081;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *advies:* een door één of meer deskundigen uitgebracht advies aan een
      door Onze Minister voor een net aangewezen netbeheerder en aan degene die ten tijde van die aanwijzing over
      de economische eigendom van dat net beschikt over de vaststelling van de hoogte van de tegenprestatie voor de
      overdracht van de economische eigendom van het net aan die aangewezen netbeheerder;
        - *net:* een net als bedoeld in [artikel 1, onderdeel i, van de Elektriciteitswet 1998][ref1] of een
      gastransportnet als bedoeld in [artikel 1, onderdeel d, van de Gaswet][ref2];
        - *partijen:* de door Onze Minister voor een net aangewezen netbeheerder en degene die ten tijde van die aanwijzing
      over de economische eigendom van dat net beschikt;
        - *voorlopig deskundigenbericht:* een bericht van deskundigen als bedoeld in
      [artikel 2, eerste lid, onderdeel c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0033945#Artikel2
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0033945
        artikel: '2'
        paragraaf: '2'
  - number: '2.1'
    text: |-
      Indien partijen geen overeenstemming bereiken over de vaststelling van de tegenprestatie voor de overdracht van
      de economische eigendom van het net waarop de aanwijzing van een netbeheerder door Onze Minister betrekking heeft,
      dragen zij binnen een termijn van twaalf weken na de beschikking tot aanwijzing zorg voor het:
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel2
  - number: 2.1.a
    text: |-
      gezamenlijk verstrekken van een opdracht aan één of meer deskundigen tot het geven van een bindend advies tot
      vaststelling van de waarde van de tegenprestatie,
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel2
  - number: 2.1.b
    text: |-
      tussen hen beiden aangaan van een overeenkomst tot arbitrage met een aanduiding van het compromis tot vaststelling
      van de waarde van de tegenprestatie,
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel2
  - number: 2.1.c
    text: |-
      door één van hen beiden indienen van een verzoek als bedoeld in
      [artikel 202 van het Wetboek van Burgerlijke Rechtsvordering][ref1] bij de ter zake bevoegde rechter tot het
      bevelen van een voorlopig bericht van deskundigen over de waarde van de tegenprestatie of


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel202
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '202'
  - number: 2.1.d
    text: |-
      door één van hen aanhangig maken van een geding bij de ter zake bevoegde rechter tot vaststelling van de waarde van
      de tegenprestatie.
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel2
  - number: '2.2'
    text: |-
      Partijen dragen er zorg voor dat een door hen gezamenlijk verstrekte opdracht als bedoeld in het eerste lid,
      onderdeel a, uiterlijk binnen twaalf weken na het verlenen daarvan tot het uitbrengen van een advies leidt.
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel2
  - number: '3'
    text: |-
      Indien [artikel 2][ref1] van toepassing is en partijen geen overeenstemming bereiken over de uitvoering daarvan,
      geeft de partij die over de economische eigendom van het net beschikt binnen een termijn van achttien weken na
      verzending van een beschikking tot aanwijzing van een netbeheerder voor dat net uitvoering aan artikel 2, eerste
      lid, onderdeel c of d, tenzij de andere partij dit reeds heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0033945#Artikel2
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033945
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Indien een uitgebracht voorlopig deskundigenbericht als bedoeld in [artikel 2, eerste lid onderdeel c][ref1],
      niet of niet volledig tot overeenstemming tussen partijen leidt over de waarde van de tegenprestatie voor de
      overdracht van de economische eigendom, geven partijen uiterlijk binnen zes weken na verzending van het voorlopig
      deskundigenbericht alsnog uitvoering aan artikel 2, eerste lid, onderdeel a, b of d, voor zover dat voor een
      vaststelling van de waarde noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0033945#Artikel2
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033945
        artikel: '2'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      Indien partijen op grond van het eerste lid gehouden zijn uitvoering te geven aan
      [artikel 2, eerste lid, onderdeel a, b of d][ref1], maar daar geen overeenstemming over bereiken, draagt de
      partij die het voorlopig deskundigenbericht heeft verzocht binnen twaalf weken na ontvangst daarvan zorg voor het
      aanhangig maken van een geding als bedoeld in artikel 2, eerste lid, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0033945#Artikel2
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033945
        artikel: '2'
        paragraaf: '2'
  - number: '4.3'
    text: |-
      In afwijking van het tweede lid, is de verplichting tot het aanhangig maken van een geding van toepassing op
      de partij die niet het voorlopig deskundigenbericht heeft verzocht, indien tussen partijen vaststaat dat deze
      partij de enige partij is die geheel of gedeeltelijk niet met de vaststelling van de waarde in het voorlopig
      deskundigenbericht kan instemmen.
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel4
  - number: '5'
    text: |-
      Partijen dragen bij het verstrekken van een adviesopdracht als bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref1], zorg voor de inschakeling van enige deskundige die in staat is
      werkzaamheden als deskundige onafhankelijk, onpartijdig, zorgvuldig, vakbekwaam en integer te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0033945#Artikel2
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033945
        artikel: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      Indien partijen een opdracht voor een advies als bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], aan
      meerdere deskundigen verstrekken, dragen partijen er zorg voor dat die deskundigen een gezamenlijk advies
      uitbrengen. Het aantal in te schakelen deskundigen is oneven.


      [ref1]: https://wetten.overheid.nl/BWBR0033945#Artikel2
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033945
        artikel: '2'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Degene die over de economische eigendom van het net beschikt, draagt bij de verstrekking van een gezamenlijke
      opdracht tot bindend advies als bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], zorg voor de beschikbaarheid
      van een dossier met zo gedetailleerd mogelijke bescheiden en gegevens over het net, met inbegrip van de boekhouding
      betreffende het net.


      [ref1]: https://wetten.overheid.nl/BWBR0033945#Artikel2
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033945
        artikel: '2'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Partijen verlenen medewerking aan een onderzoek door de deskundige of deskundigen, bij gebreke waarvan de
      deskundige of deskundigen in een advies zijn of hun conclusies daaraan mogen verbinden ten aanzien van de hoogte
      van de tegenprestatie voor de overdracht van de economische eigendom van het net.
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel7
  - number: '8'
    text: |-
      De [artikelen 5 tot en met 7][ref1] zijn van overeenkomstige toepassing ten aanzien van een overeenkomst tot
      arbitrage als bedoeld in [artikel 2, eerste lid, onderdeel b][ref2], en de uitvoering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0033945#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0033945#Artikel2
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0033945
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0033945
        artikel: '2'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      De tegenprestatie voor de overdracht van de economische eigendom van een net waarvoor [artikel 2][ref1] van
      toepassing is, wordt vastgesteld met inachtneming van algemeen aanvaarde vaktechnische en bedrijfseconomische
      methoden en uitgangspunten, waarbij voorts in ieder geval rekening wordt gehouden met:


      [ref1]: https://wetten.overheid.nl/BWBR0033945#Artikel2
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0033945
        artikel: '2'
        paragraaf: '2'
  - number: 9.1.a
    text: |-
      de mate waarin het over te dragen net voldoet aan de eisen die bij of krachtens de wet zijn gesteld met betrekking
      tot de door dat net te vervullen functies en de kwaliteit van dat net;
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel9
  - number: 9.1.b
    text: de noodzakelijk te maken kosten om het net aan de eisen, bedoeld in onderdeel a, te laten voldoen;
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel9
  - number: 9.1.c
    text: de omvang van het net gemeten naar het aantal aangesloten afnemers en de netcapaciteit;
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel9
  - number: 9.1.d
    text: de onderhoudstoestand;
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel9
  - number: 9.1.e
    text: |-
      de ouderdom, de te verwachten restlevensduur en de te verwachten kosten voor noodzakelijk onderhoud en
      vervangingen;
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel9
  - number: 9.1.f
    text: onzekerheden ten aanzien van factoren die relevant zijn voor de hoogte van de tegenprestatie.
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel9
  - number: '9.2'
    text: |-
      De hoogte van de tegenprestatie hangt niet af van de mate waarin het net waarvoor Onze Minister een netbeheerder
      heeft aangewezen in technische zin, dan wel met betrekking tot de gebruikte constructies en materialen, afwijkt of
      overeenstemt met een ander net dat de netbeheerder reeds in beheer heeft.
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel9
  - number: '9.3'
    text: |-
      Het tweede lid is niet van toepassing voor zover de netbeheerder, bedoeld in dat lid, bewijst dat die niet-
      toepasselijkheid een grotere doelmatigheid tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel9
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit waardevaststelling netten voor elektriciteit en voor gastransport.'
    url: https://wetten.overheid.nl/BWBR0033945/2013-09-28#Artikel11
