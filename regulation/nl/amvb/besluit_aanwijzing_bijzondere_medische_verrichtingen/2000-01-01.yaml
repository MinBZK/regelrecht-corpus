articles:
  - number: '1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister van Welzijn, Volksgezondheid en Cultuur in een
      ziekenhuisvoorziening:

      a. de navolgende verrichtingen uit te voeren of te doen uitvoeren:

      1. niertransplantatie;

      2. radiotherapie, voor zover dit betreft megavolttherapie en brachytherapie;

      3. neurochirurgie, voor zover dit betreft de chirurgische behandeling van aandoeningen aan de hersenen, de
      hersenschedel, de schedelbasis, de hersenzenuwen, het ruggemerg en de omgevende vliezen daarvan, alsmede de
      microchirurgische behandeling van plexus brachialusletsels;

      4. hartchirurgie en alle vormen van therapeutische interventiecardiologie met inbegrip van de implantatie van een
      cardioverter defibrillator;

      5. klinisch genetisch onderzoek en erfelijkheidsadvisering inhoudende:

      - geavanceerd prenataal ultrageluidsonderzoek naar structurele foetale afwijkingen dat wordt uitgevoerd in verband
      met een tevoren bekend verhoogd risico op, of een vermoeden van foetale misvormingen;
      - afname van foetaal materiaal, dat wil zeggen het afnemen van chorionvlokken, vruchtwater en foetaal bloed ten
      behoeve van prenataal onderzoek;
      - het prenataal chromosoom-, biochemisch en DNA-onderzoek van tijdens de zwangerschap afgenomen foetaal materiaal
      voor het vaststellen van aangeboren en erfelijke afwijkingen;
      - het postnataal chromosoom-, en DNA-onderzoek ten behoeve van de diagnostiek van aangeboren en erfelijke
      afwijkingen, dragerschap en van stoornissen in de geslachtelijke ontwikkeling en functie;
      - het postnataal chromosoomonderzoek ten behoeve van de diagnostiek en prognose van proliferatieve stoornissen
      van beenmerg;
      - postnataal biochemisch onderzoek van complexe aard gericht op vroegtijdige opsporing en behandeling van erfelijke
      stofwisselingsziekten en om dragerschap vast te stellen;
      - erfelijkheidsadvisering van complexe aard, dat wil zeggen het informatieproces dat nodig is om mensen tot begrip
      en een voor hen juiste besluitvorming te laten komen ten aanzien van een erfelijke of aangeboren aandoening;

      6. in vitro fertilisatie, voor zover dit betreft het buiten het lichaam tot stand brengen van menselijke embryo's;

      7. neonatale intensive care, inhoudende de gespecialiseerde neonatale, uitgezonderd de chirurgische, zorg aan
      pasgeborenen bij wie vitale functies op een acuut levensbedreigende wijze zijn verstoord dan wel zeer instabiel
      zijn, met inbegrip van extracorporale membraanoxygenatie bij zieke pasgeborenen;

      8. harttransplantatie;

      9. longtransplantatie;

      10. levertransplantatie.

      b. apparatuur, uitsluitend bestemd of geschikt voor het uitvoeren of doen uitvoeren van de onder *a* genoemde
      verrichtingen, aan te schaffen voor of te gebruiken in een ziekenhuisvoorziening, indien daardoor de omvang van
      de desbetreffende functie, voor zover het die verrichtingen betreft, zou worden gewijzigd en de kosten van de
      apparatuur een door Onze Minister aan te geven bedrag te boven gaan.
