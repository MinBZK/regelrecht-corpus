    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur gedaan mede namens Onze Minister
    van Onderwijs en Wetenschappen van 17 januari 1991, ZZT/TOPAZ-326921;


    Overwegende, dat gewijzigde inzichten met betrekking tot het beleid ten aanzien van bijzondere voorzieningen,
    recente ontwikkelingen op medisch-technologisch gebied, alsmede de behoefte de omschrijving van een
    aantal bijzondere voorzieningen aan te scherpen, het wenselijk maken het Besluit bijzondere functies Wet
