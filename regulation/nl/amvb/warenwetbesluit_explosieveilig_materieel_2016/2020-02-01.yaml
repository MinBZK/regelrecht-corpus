    text: artikel 11;
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel6
  - number: 6.1.d
    text: artikel 35, eerste en derde lid;
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel6
  - number: 6.1.e
    text: artikel 37, eerste en tweede lid;
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel6
  - number: 6.1.f
    text: artikel 38, eerste lid; en
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel6
  - number: 6.1.g
    text: Bijlage II.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel6
  - number: '6.2'
    text: |-
      Instructies en informatie aangaande de veiligheid, bedoeld in artikel 9, tweede lid, van de richtlijn, zijn in
      ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel6
  - number: '7.1'
    text: Producten voldoen aan de essentiële veiligheids- en gezondheidseisen als vermeld in bijlage II van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel7
  - number: '7.2'
    text: |-
      Producten die door de fabrikanten en importeurs in de handel worden gebracht, of die door de distributeurs op
      de markt worden aangeboden, die in overeenstemming zijn met geharmoniseerde normen of delen daarvan, waarvan de
      referentienummers in het Publicatieblad van de Europese Unie zijn bekendgemaakt, worden vermoed te voldoen aan
      de eisen die door die normen of delen daarvan worden bestreken, zoals beschreven in artikel 12 en bijlage II van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel7
  - number: '8.1'
    text: |-
      Producten die op de markt worden aangeboden, zijn overeenkomstig de artikelen 15 en 16 van de richtlijn, voorzien
      van de CE-markering.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel8
  - number: '8.2'
    text: |-
      Producten die niet zijn voorzien van de CE-markering of anderszins niet aan dit besluit voldoen, mogen op beurzen
      en exposities en bij demonstraties worden tentoongesteld met inachtneming van artikel 3, derde lid, van de
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel8
  - number: '9.1'
    text: |-
      De beoordeling van de conformiteit van een apparaat, beveiligingssysteem, voorziening als bedoeld in artikel 1,
      eerste lid, onder b, van de richtlijn, of component, en de afgifte van verklaringen en de verlening van goedkeuring
      ter zake vinden plaats met inachtneming van artikel 13 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel9
  - number: '9.2'
    text: |-
      Fabrikanten vragen de beoordeling van de conformiteit van een apparaat, beveiligingssysteem, voorziening, als
      bedoeld in artikel 1, eerste lid, onder a en b, van de richtlijn, of component, bedoeld in artikel 13, eerste,
      tweede, derde, vierde en vijfde lid, van de richtlijn, aan bij de EU-conformiteitsbeoordelingsinstantie, bedoeld
      in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037644#Artikel11
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037644
        artikel: '11'
  - number: '9.3'
    text: |-
      De bescheiden en briefwisseling, bedoeld in artikel 13, zesde lid, van de richtlijn, zijn in ieder geval gesteld in
      de Nederlandse taal of in een door de EU-conformiteitsbeoordelingsinstantie, bedoeld in het tweede lid, aanvaarde
      taal.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel9
  - number: '10'
    text: |-
      De EU-conformiteitsbeoordelingsinstantie trekt een door haar afgegeven verklaring van EU-typeonderzoek of EU-
      ontwerponderzoek of een verleende goedkeuring van een kwaliteitssysteem als bedoeld in bijlagen III tot en met VII
      en IX bij de richtlijn, in als de essentiële veiligheidseisen of voorgeschreven gebruiksomstandigheden, bedoeld in
      bijlage II bij de richtlijn, zodanig zijn gewijzigd dat het type, ontwerp of kwaliteitssysteem niet meer voldoet
      aan de gewijzigde eisen of voorgeschreven gebruiksomstandigheden op het tijdstip waarop deze volgens de richtlijn
      van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel10
  - number: '11.1'
    text: |-
      Bij een verzoek aan Onze Minister als bedoeld in [artikel 7a van de wet][ref1], voldoet de aanvrager aan artikel
      24, eerste en tweede lid, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: '11.2'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie voldoet aan of zorgt dat wordt voldaan aan de volgende bepalingen van
      de richtlijn:
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel11
  - number: 11.2.a
    text: artikel 21, tweede tot en met elfde lid;
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel11
  - number: 11.2.b
    text: artikel 29; en
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel11
  - number: 11.2.c
    text: artikel 31.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel11
  - number: '11.3'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie die taken uitbesteedt of door ondergeschikte instanties laat uitvoeren,
      voldoet aan artikel 23 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel11
  - number: '11.4'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie voldoet aan de criteria, genoemd in het eerste, tweede en derde lid.
      Zij toont dit aan door middel van een accreditatie tegen de van toepassing zijnde geharmoniseerde normen of delen
      daarvan, mits die normen de eisen, bedoeld in de eerste zin, dekken en de referentienummers van die normen in het
      Publicatieblad van de Europese Unie zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel11
  - number: '11.5'
    text: |-
      Indien de EU-conformiteitsbeoordelingsinstantie geen bewijs van accreditatie kan overleggen, verschaft zij Onze
      Minister alle bewijsstukken die nodig zijn om aan te tonen dat zij voldoet aan de criteria, genoemd in het eerste,
      tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister weigert een aanwijzing als EU-conformiteitsbeoordelingsinstantie indien de aanvrager niet heeft
      voldaan aan het bepaalde bij of krachtens [artikel 11, eerste tot en met vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037644#Artikel11
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037644
        artikel: '11'
  - number: '12.2'
    text: |-
      Een aanwijzing kan worden geschorst, ten nadele van de EU-conformiteitsbeoordelingsinstantie worden gewijzigd of
      ingetrokken:
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel12
  - number: 12.2.a
    text: |-
      op grond van door de EU-conformiteitsbeoordelingsinstantie verstrekte onjuiste inlichtingen over feiten of
      omstandigheden, mits de onjuistheid daarvan aan deze instantie bekend was of kon zijn;
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel12
  - number: 12.2.b
    text: |-
      indien de EU-conformiteitsbeoordelingsinstantie niet voldoet aan het bepaalde bij of krachtens
      [artikel 11, eerste tot en met vijfde lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0037644#Artikel11
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037644
        artikel: '11'
  - number: 12.2.c
    text: |-
      indien de EU-conformiteitsbeoordelingsinstantie haar wettelijke verplichtingen niet naar behoren nakomt of de taken
      waarvoor zij is aangewezen, niet naar behoren uitvoert.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel12
  - number: '13.1'
    text: |-
      Bij de uitoefening van zijn taken als aanmeldende autoriteit voldoet Onze Minister aan de artikelen 19 en 25 van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel13
  - number: '13.2'
    text: Onze Minister verricht de taken, bedoeld in artikel 18, tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel13
  - number: '14.1'
    text: |-
      Tijdens de looptijd van de aanwijzing stelt Onze Minister periodiek vast of de EU-
      conformiteitsbeoordelingsinstantie:
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel14
  - number: 14.1.a
    text: |-
      nog voldoet aan het bepaalde bij of krachtens [artikel 11, eerste tot en met vijfde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0037644#Artikel11
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037644
        artikel: '11'
  - number: 14.1.b
    text: haar wettelijke verplichtingen naar behoren nakomt en de taken waarvoor zij is aangewezen, naar behoren uitvoert.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel14
  - number: '14.2'
    text: |-
      Bij ministeriele regeling worden nadere regels gesteld betreffende het kosteloos verstrekken van
      gegevens en inlichtingen door de EU-conformiteitsbeoordelingsinstantie aan Onze Minister of de nationale
      accreditatie-instantie respectievelijk door Onze Minister of de nationale accreditatie-instantie aan de EU-
      conformiteitsbeoordelingsinstantie, die zijn verkregen door de uitvoering of het toezicht op de naleving van het
      bepaalde bij of krachtens de [wet][ref1], welke noodzakelijk zijn voor de uitvoering van hun wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '14.3'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie die haar taken waarvoor zij is aangewezen, beëindigt, of waarvan
      de aanwijzing door Onze Minister wordt ingetrokken, is verplicht tijdig voorafgaand aan de beëindiging van de
      werkzaamheden respectievelijk de datum, waarop de aanwijzing eindigt, haar dossiers over te dragen aan een andere
      EU-conformiteitsbeoordelingsinstantie waarmee de marktdeelnemer een overeenkomst is aangegaan. Indien er geen
      andere EU-conformiteitsbeoordelingsinstantie is, draagt de EU-conformiteitsbeoordelingsinstantie de dossiers over
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel14
  - number: '15'
    text: |-
      Een wijziging van de richtlijn gaat voor de toepassing van dit besluit gelden met ingang van de dag waarop aan de
      betrokken wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel15
  - number: '17.1'
    text: |-
      Producten die voldoen aan het [Warenwetbesluit explosieveilig materieel][ref1], zoals dat onmiddellijk vóór
      20 april 2016 luidde, en vóór dat tijdstip in de handel zijn gebracht, mogen ook na dat tijdstip op de markt worden
      aangeboden of in bedrijf worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007497
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007497
  - number: '17.2'
    text: |-
      Een certificaat afgegeven op grond van de [wet][ref1], en geldend op de dag voorafgaand aan de datum van
      inwerkingtreding, genoemd in [artikel 19, tweede lid][ref2], van dit besluit wordt geacht te zijn afgegeven met
      inachtneming van de bij of krachtens dit besluit gestelde bepalingen, onverminderd het bepaalde bij of krachtens de
      [artikelen 9][ref3] en [10][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001969
      [ref2]: https://wetten.overheid.nl/BWBR0037644#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0037644#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0037644#Artikel10
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001969
      - id: ref2
        bwb_id: BWBR0037644
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0037644
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0037644
        artikel: '10'
  - number: '18'
    text: |-
      Het [Warenwetbesluit explosieveilig materieel][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007497
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel18
    references:
