  - number: '1.2'
    text: Dit besluit is niet van toepassing op producten als bedoeld in artikel 1, tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden producten in de handel te brengen, in bedrijf te stellen, op de markt aan te bieden of te gebruiken
      die niet voldoen aan de bij of krachtens dit besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden producten in de handel te brengen of op de markt aan te bieden anders dan met inachtneming
      van de bij of krachtens dit besluit gestelde voorschriften met betrekking tot het bezigen van vermeldingen of
      aanduidingen.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden producten in de handel te brengen, in bedrijf te stellen, op de markt aan te bieden of te
      gebruiken, indien de bij of krachtens dit besluit voorgeschreven conformiteitbeoordelingsprocedures niet in acht
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden producten te gebruiken anders dan met inachtneming van de voorschriften bij of krachtens dit
      besluit gesteld met betrekking tot het voorhanden zijn van documenten.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel2
  - number: '3.1'
    text: |-
      Fabrikanten voldoen bij het ontwerpen, vervaardigen, in de handel brengen en gebruiken voor eigen doeleinden van
      producten aan de volgende bepalingen van de richtlijn:
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel3
