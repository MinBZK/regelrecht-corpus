  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 18 december 2015, nr. 2015-0000309188;

    Gelet op richtlijn nr. 2014/34/EU van het Europees Parlement en de Raad van 26 februari 2014 betreffende de
    harmonisatie van de wetgevingen van de lidstaten inzake apparaten en beveiligingssystemen bedoeld voor het gebruik
    op plaatsen waar ontploffingsgevaar kan heersen (herschikking) (PbEU 2014, L 96), alsmede op de artikelen 4, eerste
    lid, 5, tweede lid, 7, 7a, derde lid, 11, 12, 13, 14 en 32b van de Warenwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 21 januari 2016; nr. W12.15.0460/III);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 17 februari 2016, nr. 2016-
    0000017870

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#ArtikelAanhef
