    text: artikel 35, eerste en derde lid;
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel3
  - number: 3.1.h
    text: artikel 37, eerste en tweede lid;
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel3
  - number: 3.1.i
    text: artikel 38, eerste lid; en
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel3
  - number: 3.1.k
    text: bijlage II.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel3
  - number: '3.2'
    text: |-
      Instructies en informatie aangaande de veiligheid, alsmede eventuele etikettering als bedoeld in artikel 6, achtste
      lid, van de richtlijn, zijn in ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel3
  - number: '3.3'
    text: |-
      De EU-conformiteitsverklaring, bedoeld in de artikelen 6, tweede lid, en 14, tweede lid, van de richtlijn, is in
      ieder geval gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel3
  - number: '4.1'
    text: |-
      De fabrikant die een gemachtigde vertegenwoordiger aanstelt, voldoet en zorgt dat wordt voldaan aan artikel 7 van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel4
  - number: '4.2'
    text: |-
      De gemachtigde vertegenwoordiger, bedoeld in het eerste lid, voldoet aan de artikelen 7, tweede lid, en 11 van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel4
  - number: '5.1'
    text: 'Importeurs voldoen bij het in de handel brengen van producten aan de volgende bepalingen van de richtlijn:'
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel5
