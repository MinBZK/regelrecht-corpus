    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel5
  - number: 5.1.g
    text: bijlage II.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel5
  - number: '5.2'
    text: |-
      Instructies en informatie aangaande de veiligheid, bedoeld in artikel 8, vierde lid, van de richtlijn, zijn in
      ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel5
  - number: '6.1'
    text: 'Distributeurs voldoen bij het op de markt aanbieden van producten aan de volgende bepalingen van de richtlijn:'
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel6
  - number: 6.1.a
    text: artikel 9;
    url: https://wetten.overheid.nl/BWBR0037644/2020-02-01#Artikel6
