preamble:
  text: |-
    Op de voordracht van de Staatssecretaris van Justitie van 7 februari 1996, nr. 538869/96/6;

    Gelet op artikel 238, vijfde lid, van Boek 1 van het Burgerlijk Wetboek;

    De Raad van State gehoord (advies van 15 maart 1996, nr. W03.96.0057);

    Gezien het nader rapport van de Staatssecretaris van Justitie van 14 juni 1996, nr. 550405/96/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008125/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Er is één raad voor de kinderbescherming. Deze is gevestigd te Utrecht.

      2 De raad staat onder leiding van een algemeen directeur die bijgestaan wordt door vijf ressortsdirecteuren die elk
      de leiding hebben over de in hun ressort werkzame eenheden. Deze ressorten komen overeen met die van een hof.

      3 De raad heeft in ieder arrondissement een of meer werkeenheden die ten behoeve van de uitvoering van de
      wettelijke taken en bevoegdheden voor de raad optreden.

      4 De raad neemt bij uitvoering van zijn taken de aanwijzingen van Onze Minister van Justitie in acht. Hij verstrekt
      Onze Minister van Justitie gevraagd en ongevraagd alle inlichtingen.
    url: https://wetten.overheid.nl/BWBR0008125/2006-01-01#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister van Justitie benoemt en ontslaat de directeur, de vijf ressortsdirecteuren en het overige personeel
      verbonden aan de raad. Aangelegenheden in verband staande met het functioneren, de benoeming en het ontslag van het
      overige personeel worden behandeld door de directeur.

      2 De directeur wordt, waar nodig, vervangen door een ressortsdirecteur, daartoe als plaatsvervanger aangewezen.
    url: https://wetten.overheid.nl/BWBR0008125/2006-01-01#Artikel2
  - number: '3'
    text: Het Organisatiebesluit raden voor de kinderbescherming 1982 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008125/2006-01-01#Artikel3
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop de wet houdende wijziging van Boek 1 van het Burgerlijk
      Wetboek en van enige andere wetten in verband met reorganisatie van de raden voor de kinderbescherming in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0008125/2006-01-01#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit raad voor de kinderbescherming.'
    url: https://wetten.overheid.nl/BWBR0008125/2006-01-01#Artikel5
