  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 24 januari 1996, Nr. SV/
    AVF/96/0204, gedaan mede namens Onze Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op de artikelen 9, vierde lid, en 29, achtste lid, van de Algemene Ouderdomswet, de artikelen 19,
    vierde lid, en 37b, vijfde lid, van de Algemene Weduwen- en Wezenwet, artikel 41a, tweede lid, van de Algemene
    Arbeidsongeschiktheidswet, artikel 55, derde lid, van de Algemene bijstandswet, artikel 10, tweede lid, van de
    Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers, artikel 10, tweede lid,
    van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen, artikel 6, tweede
    lid, van de Wet arbeidsongeschiktheidsvoorziening militairen, artikel 85, derde lid, van de Werkloosheidswet,
    artikel 19a, tweede lid, van de Wet uitkeringen vervolgingsslachtoffers 1940-1945, artikel 36, derde lid, van
    de Wet buitengewoon pensioen 1940-1945, artikel 32, derde lid, van de Wet buitengewoon pensioen zeelieden-
    oorlogsslachtoffers, artikel 43, derde lid, van de Wet buitengewoon pensioen Indisch verzet en artikel 26, derde
    lid, van de Wet uitkeringen burger-oorlogsslachtoffers 1940-1945;

    De Raad van State gehoord (advies van 6 februari 1996, nr. W12.96.0027);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 13 februari 1996, Nr. SV/
    AVF/96/0586, uitgebracht mede namens Onze Minister van Volksgezondheid, Welzijn en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#ArtikelAanhef
