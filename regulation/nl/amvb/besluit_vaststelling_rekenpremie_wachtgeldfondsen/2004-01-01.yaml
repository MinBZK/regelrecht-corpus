  - number: '1.2'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel1
  - number: 1.2.a
    text: |-
      WW: [Werkloosheidswet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 1.2.b
    text: 'rekenpremie wachtgeldfondsen: de vervangende premie, bedoeld in artikel 85, derde lid, van de WW;'
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel1
  - number: 1.2.c
    text: |-
      de verzekerde loonsom WW: het totaalbedrag van het loon, bedoeld in artikel 84 van de WW, waarover het
      Uitvoeringsinstituut werknemersverzekeringen in een jaar de aldaar bedoelde premies ontvangt, met uitzondering van
      de uitkeringen en het loon waarop het derde lid van artikel 85 van die wet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel1
  - number: 1.2.d
    text: 'jaar: kalenderjaar.'
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel1
  - number: '2.1'
    text: |-
      De rekenpremie wachtgeldfondsen in een jaar wordt in het daaraan voorafgaande jaar vastgesteld op het gewogen
      gemiddelde van de premies zoals die op grond van artikel 85, eerste lid, van de WW voor dat jaar voor alle sectoren
      gelden.
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het in het eerste lid bedoelde gewogen gemiddelde wordt in het jaar van vaststelling bepaald met behulp van de
      verzekerde loonsommen WW en het daaraan voorafgaande jaar zoals deze zijn of zullen worden gepubliceerd in het
      jaarverslag van het Uitvoeringsinstituut werknemersverzekeringen van dat jaar.
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het tweede lid wordt het in het eerste lid bedoelde gewogen gemiddelde in het eerste jaar van
      vaststelling na inwerkingtreding van de Organisatiewet sociale verzekeringen 1997 bepaald met behulp van de
      verzekerde loonsommen WW in het daaraan voorafgaande jaar zoals deze zijn of zullen worden gepubliceerd in de
      jaarverslagen van de bedrijfsverenigingen van dat jaar, tenzij de verzekerde loonsommen WW in dat jaar zijn of
      zullen worden gepubliceerd in het jaarverslag van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel2
  - number: '3'
    text: |-
      Ingeval het Uitvoeringsinstituut werknemersverzekeringen voor een wachtgeldfonds gedurende een jaar meerdere malen
      een premie vaststelt, worden bij de berekening van de rekenpremie de desbetreffende premiepercentages gewogen naar
      rato van het deel van het jaar waarin deze premiepercentages gelden.
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel3
  - number: '4'
    text: |-
      Voor de toepassing van de [artikelen 9][ref1], vijfde lid, en [29, zevende lid, van de Algemene Ouderdomswet][ref2],
      [artikel 2, eerste lid, onderdelen ][ref3], artikel 41*a*, eerste lid, van de Algemene
      Arbeidsongeschiktheidswet, [artikel 37, eerste en tweede lid, van de Wet werk en bijstand][ref4], artikel
      10, eerste lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werknemers,
      __REF004___________________________________________________________________________________________________________
      ___________, [artikel 6, eerste lid, van de Wet arbeidsongeschiktheidsvoorziening militairen][ref6],
      [artikel 19][ref7], [artikel 36, eerste lid, van de Wet buitengewoon pensioen 1940-1945][ref8],
      [artikel 32, eerste lid, van de Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref9],
      [artikel 43, eerste lid, van de Wet buitengewoon pensioen Indisch verzet][ref10] en
      [artikel 26, eerste lid, van de Wet uitkeringen burger-oorlogsslachtoffers 1940-1945][ref11] wordt het deel van de
      premie WW dat ten gunste komt van het wachtgeldfonds voor zover dat door de werknemer verschuldigd is, vastgesteld
      op de helft van de rekenpremie wachtgeldfondsen.


