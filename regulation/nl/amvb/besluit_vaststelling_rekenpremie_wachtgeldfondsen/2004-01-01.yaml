  - number: '5'
    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], wordt de rekenpremie wachtgeldfondsen voor het jaar 1996
      vastgesteld op het gewogen gemiddelde van de wachtgeldpremies, zoals deze, in verband met de verlenging van de
      wachtgeldperiode van acht naar dertien weken, voor het jaar 1996 voor alle sectoren worden vastgesteld en in
      verband met de [Wet uitbreiding loondoorbetalingsplicht bij ziekte][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007900#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007892
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007900
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007892
  - number: '6'
    text: Het Besluit vaststelling rekenpremies ZW en wachtgeldfondsen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel6
  - number: 6a
    text: Dit besluit berust mede op [artikel 37, derde lid, van de Wet werk en bijstand](onbekend).
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel6a
  - number: '7'
    text: |-
      Indien het bij koninklijke boodschap van 4 oktober 1995 ingediende voorstel van wet tot wijziging van het
      Burgerlijk Wetboek, de [Ziektewet][ref1] en enkele andere wetten in verband met loondoorbetaling door de werkgever
      bij ziekte van de werknemer (uitbreiding loondoorbetalingsplicht bij ziekte; Kamerstukken II, 1995/96, 24 439) tot
      wet wordt verheven en in werking treedt, treedt dit besluit op hetzelfde tijdstip in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit vaststelling rekenpremie wachtgeldfondsen.'
    url: https://wetten.overheid.nl/BWBR0007900/2004-01-01#Artikel8
