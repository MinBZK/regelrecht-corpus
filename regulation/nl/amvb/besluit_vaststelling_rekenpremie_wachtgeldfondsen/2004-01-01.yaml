      [artikel 2, tweede lid, van de Algemene nabestaandenwet][ref3], artikel 41 *a*, tweede lid, van
      de Algemene Arbeidsongeschiktheidswet, [artikel 37, derde lid, van de Wet werk en bijstand][ref4],
