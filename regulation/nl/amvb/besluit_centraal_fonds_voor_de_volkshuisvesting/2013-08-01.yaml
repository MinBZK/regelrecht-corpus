articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder woongelegenheid: zelfstandige woning,
      wooneenheid, standplaats en woonwagen.
    url: https://wetten.overheid.nl/BWBR0004418/2013-08-01#Artikel1
  - number: '2'
    text: |-
      Het fonds verstrekt op hun aanvraag aan toegelaten instellingen subsidie ter tegemoetkoming in de kosten van
      werkzaamheden welke door die toegelaten instellingen in het belang van de volkshuisvesting worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004418/2013-08-01#Artikel2
  - number: 2a
    text: |-
      Het fonds verstrekt slechts subsidie als bedoeld in [artikel 2][ref1], voor zover het over voldoende middelen
      beschikt als verkregen uit het bedrag, bedoeld in [artikel 9, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004418#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004418#Artikel9
    url: https://wetten.overheid.nl/BWBR0004418/2013-08-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0004418
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004418
        artikel: '9'
        paragraaf: '5'
  - number: '3'
    text: |-
      Het fonds verstrekt slechts subsidie als bedoeld in [artikel 2][ref1], indien de in dat artikel bedoelde
      werkzaamheden zonder die subsidie niet zouden kunnen worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004418#Artikel2
    url: https://wetten.overheid.nl/BWBR0004418/2013-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004418
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Het fonds stelt jaarlijks op:

      a. overzichten van de financiële situatie van de afzonderlijke toegelaten instellingen, waarin in elk geval wordt
      aangegeven of naar het oordeel van het fonds de financiële situatie van een toegelaten instelling zodanig is, dat
      zij niet slaagt in het op een voor haar in het bijzonder aangewezen wijze, anders dan het aanvragen van subsidie
      bij het fonds, aantrekken van de noodzakelijke financiële middelen, en

      b. een overzicht van de financiële situatie van de toegelaten instellingen gezamenlijk.

      2 Ten behoeve van het opstellen van de overzichten, bedoeld in het eerste lid, kan het fonds aan de toegelaten
      instellingen inlichtingen vragen en van hen inzage vorderen van zakelijke gegevens en bescheiden.

      3 Het fonds doet:

      a. jaarlijks voor 1 november de in het eerste lid, onderdeel a, bedoelde overzichten aan Onze Minister toekomen en

      b. jaarlijks voor 1 december het in het eerste lid, onderdeel b, bedoelde overzicht aan Onze Minister toekomen,
      vergezeld van een oordeel over de in dat overzicht geschetste financiële situatie van de toegelaten instellingen
      gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0004418/2013-08-01#Artikel4
  - number: '5'
    text: |-
      1. Ten behoeve van het toezicht verstrekt de toegelaten instelling, naast de bescheiden, bedoeld in
      [artikel 30 van het Besluit beheer sociale-huursector][ref1], jaarlijks:

      a. voor 1 februari aan het fonds een bestuursverklaring bij de gegevens, bedoeld in
      [bijlage I bij dat besluit][ref2];

      b. voor 1 juli aan het fonds een bestuursverklaring bij de gegevens, bedoeld in [bijlage II bij dat besluit][ref3],
      en

      c. voor 1 juli aan het fonds de gegevens, bedoeld in [bijlage IV bij dat besluit][ref4], alsmede de mededeling,
      bedoeld in het tweede lid.

      2 De toegelaten instelling verzoekt aan een daartoe als openbaar optredende accountant als bedoeld in
      [artikel 27, eerste lid, van het Besluit beheer sociale-huursector][ref5], of aan een organisatie waarin zodanige
      accountants samenwerken, om overeenkomstig [bijlage III][ref6] bij dat besluit een mededeling op te stellen omtrent
      de gegevens, bedoeld in het eerste lid.

      3 Het fonds bevestigt binnen vier weken de ontvangst van de krachtens het eerste lid gezonden bescheiden.

      4 Indien een toegelaten instelling de bescheiden op 1 februari respectievelijk 1 juli van een jaar niet aan het
      fonds heeft doen toekomen, stelt het fonds onverwijld een termijn van ten hoogste vier weken binnen welke de
      bescheiden alsnog moeten worden verstrekt en doet daarvan mededeling aan die toegelaten instelling.

      5 Indien de toegelaten instelling de bescheiden niet binnen de krachtens het vierde lid gestelde termijn
      verstrekt, kan het fonds bepalen, dat zij, totdat zij de bescheiden alsnog verstrekt, de door het fonds aangegeven
      rechtshandelingen slechts kan verrichten na zijn instemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel30
