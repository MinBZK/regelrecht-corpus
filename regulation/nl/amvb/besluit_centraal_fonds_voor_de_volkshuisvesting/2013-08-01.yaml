  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 22 juli
    1988, no. MJZ 2278002), Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 59, vijfde lid, van de Woningwet (Stb. 1964, 222).

    Gezien het advies van de Raad voor de Gemeentefinanciën van 7 juni 1988, no. 24058 RGF 175/14;

    Gehoord de Raad voor de Volkshuisvesting (advies van 11 juli 1988, no. 151/U/10);

    De Raad van State gehoord (advies van 10 oktober 1988, nr. W08.880421);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 14
    oktober 1988, no. MJZ 1408038, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
