  - number: '8'
    text: |-
      De beleidsregels, bedoeld in [artikel 71b, eerste lid, van de Woningwet][ref1], worden door het fonds bekendgemaakt
      in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71b
