  - number: '9'
    text: |-
      De bijdrage, bedoeld in [artikel 71e, tweede lid, van de Woningwet][ref1], bestaat uit de som van:

      a. een bedrag ten behoeve van het verstrekken van subsidie ter bevordering van de sanering van toegelaten
      instellingen, en

      b. een bedrag ten behoeve van het verstrekken van subsidie als bedoeld in [artikel 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71e
      [ref2]: https://wetten.overheid.nl/BWBR0004418#Artikel2
    url: https://wetten.overheid.nl/BWBR0004418/2013-08-01#Artikel9
