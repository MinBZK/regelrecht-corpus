  - number: '6'
    text: |-
      1 In de beleidsregels, bedoeld in [artikel 71b, eerste lid, van de Woningwet][ref1], wordt met betrekking tot de
      subsidie, bedoeld in [artikel 71a, eerste lid, onderdeel a, van die wet][ref2], bepaald:

      a. dat een aanvraag voor subsidie bij het fonds wordt ingediend;

      b. welke gegevens door de aanvragende toegelaten instelling aan het fonds moeten worden overgelegd, en dat tot die
      gegevens in elk geval behoren:

      1°. een plan voor de sanering van de toegelaten instelling, dan wel

      2°. een plan met betrekking tot de werkzaamheden, bedoeld in [artikel 2][ref3], dat door die toegelaten instelling
      is voorgelegd aan het college van burgemeester en wethouders van de gemeente waar zij haar woonplaats heeft en aan
      de huurders van haar woongelegenheden, teneinde hen in de gelegenheid te stellen zich daarover uit te spreken;

      c. binnen welke termijn de betrokken gegevens, bedoeld in onderdeel b, aan het fonds moeten worden verstrekt, en
      dat het fonds, indien de toegelaten instelling die gegevens niet binnen die termijn verstrekt, kan bepalen dat zij,
      totdat zij de gegevens alsnog verstrekt, de door het fonds aangegeven rechtshandelingen slechts kan verrichten na
      zijn instemming;

      d. onder welke verplichtingen of voorschriften het fonds subsidie als bedoeld in [artikel 2][ref4] verstrekt,
      waartoe verplichtingen kunnen behoren met betrekking tot de wijze waarop de toegelaten instelling uitvoering geeft
      aan [artikel 21, eerste lid, van het Besluit beheer sociale-huursector][ref5];

      e. aan de hand van welke criteria ten aanzien van de vermogenspositie van een toegelaten instelling wordt
      beoordeeld of die instelling voor de subsidie, bedoeld in [artikel 2][ref6], in aanmerking komt, en

      2 In de beleidsregels komt tot uitdrukking dat, indien door Onze Minister een aanwijzing is gegeven met toepassing
      van [artikel 41, eerste lid, van het Besluit beheer sociale-huursector][ref7], het fonds bij de verstrekking van
      subsidie als bedoeld in [artikel 71a, eerste lid, onderdeel a, van de Woningwet][ref8] tevens die aanwijzing in
      acht neemt.


