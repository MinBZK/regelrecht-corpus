  - number: '10'
    text: |-
      1 Het fonds bepaalt de hoogte van de bijdrage, bedoeld in [artikel 71e, tweede lid, van de Woningwet][ref1],
      zodanig, dat het voor ten minste het kalenderjaar waarover deze verschuldigd is over voldoende financiële middelen
      beschikt om uitvoering te geven aan [artikel 71a, eerste lid, van die wet][ref2], met dien verstande dat het
      bedrag, bedoeld in [artikel 9, onderdeel a][ref3], en het bedrag, bedoeld in artikel 9, onderdeel b, niet meer is
      dan 5 procent, onderscheidenlijk 1 procent van de gerealiseerde jaarhuuropbrengst van de woongelegenheden, bedoeld
      in [bijlage II bij het Besluit beheer sociale-huursector][ref4], als volgens genoemde [bijlage][ref5] voor de
      bijdrageplichtige toegelaten instellingen gezamenlijk bepaald over het jaar voorafgaand aan het jaar waarover de
      bijdrage verschuldigd is.

      2 Het fonds bepaalt de hoogte van de bijdrage aan de hand van de ingevolge
      [artikel 30 van het Besluit beheer sociale-huursector][ref6] aan het fonds gezonden bescheiden. Het kan in plaats
      daarvan de hoogte van de bijdrage door schatting bepalen, uitsluitend indien het toepassing heeft gegeven aan
      [artikel 5, vierde lid][ref7], of aan [artikel 31, tweede lid, van het Besluit beheer sociale-huursector][ref8]
      en de betrokken toegelaten instelling de ontbrekende bescheiden niet binnen de krachtens het betrokken artikellid
      gestelde termijn heeft verstrekt. Het fonds kan aan de betrokken toegelaten instelling administratiekosten in
      rekening brengen die verbonden zijn aan het door schatting bepalen van de hoogte van de bijdrage.


