  - number: 9a
    text: |-
      1 Ten behoeve van de bepaling van de hoogte van het bedrag, bedoeld in [artikel 9, onderdeel a][ref1], stelt het
      fonds vast:

      a. een bedrag per zelfstandige woning, en

      b. een bedrag per andere woongelegenheid, dat lager is dan het bedrag, bedoeld in onderdeel a.

      2 Het fonds bepaalt de hoogte van het bedrag, bedoeld in [artikel 9, onderdeel a][ref2], door:

      a. per categorie woongelegenheden als bedoeld in het eerste lid met elkaar te vermenigvuldigen:

      1°. het aantal woongelegenheden in die categorie dat de toegelaten instelling op 31 december van het jaar
      voorafgaand aan het jaar waarover de bijdrage verschuldigd is in eigendom of in beheer had volgens de gegevens,
      bedoeld in [bijlage II bij het Besluit beheer sociale-huursector][ref3], en

      2°. het betrokken in het eerste lid, onderdeel a of b, bedoelde bedrag, en

      b. de aldus verkregen bedragen bij elkaar op te tellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004418#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004418#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005686
