preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 22 juli
    1988, no. MJZ 2278002), Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 59, vijfde lid, van de Woningwet (Stb. 1964, 222).

    Gezien het advies van de Raad voor de Gemeentefinanciën van 7 juni 1988, no. 24058 RGF 175/14;

    Gehoord de Raad voor de Volkshuisvesting (advies van 11 juli 1988, no. 151/U/10);

    De Raad van State gehoord (advies van 10 oktober 1988, nr. W08.880421);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 14
    oktober 1988, no. MJZ 1408038, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004418/2011-07-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. woongelegenheid: zelfstandige woning, wooneenheid, standplaats en woonwagen;

      b. wijkactieplan: beleidsplan, overeengekomen tussen in elk geval een gemeente en een of meer toegelaten
      instellingen, om met een gecombineerde inspanning problemen op te lossen en achterstanden weg te werken in een wijk
      of wijken, genoemd in de bijlage bij dit besluit;

      c. uitvoeringsovereenkomst: overeenkomst tussen een gemeente en een of meer toegelaten instellingen, waarin voor
      elk jaar van de looptijd van het betrokken wijkactieplan de werkzaamheden van elke toegelaten instelling ten
      behoeve van dat plan en de inzet van middelen, wat betreft elke toegelaten instelling uitgedrukt in rendabele en
      onrendabele investeringen en overige kosten, zijn benoemd.

      d. additionele inzet: inzet van middelen door een toegelaten instelling, voor activiteiten die gemeenten en
      toegelaten instellingen voor de eerste maal zijn overeengekomen na 16 juli 2007 en die zijn of worden uitgevoerd
      blijkens de uitvoeringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0004418/2011-07-20#Artikel1
  - number: '2'
    text: |-
      1 Het fonds verstrekt op hun aanvraag aan toegelaten instellingen subsidie ter tegemoetkoming in de kosten van
      werkzaamheden welke door die toegelaten instellingen in het belang van de volkshuisvesting worden uitgevoerd.

      2 Het fonds verstrekt op hun aanvraag aan toegelaten instellingen subsidie ter tegemoetkoming in de kosten van
      werkzaamheden welke in het belang van de volkshuisvesting door die toegelaten instellingen worden uitgevoerd in het
      kader van de aanpak van problemen en achterstanden in een wijk of wijken, genoemd in de bijlage bij dit besluit.

      3 De maximale subsidiebedragen per wijk in de bijlage bij dit besluit kunnen bij ministeriële regeling worden
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0004418/2011-07-20#Artikel2
  - number: 2a
    text: |-
      Het fonds verstrekt slechts subsidie als bedoeld in [artikel 2, eerste of tweede lid][ref1],
      voor zover het over voldoende middelen beschikt als verkregen uit het bedrag, bedoeld in
      [artikel 9, onderdeel b respectievelijk c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004418#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004418#Artikel9
