    text: |-
      Het fonds verstrekt slechts subsidie als bedoeld in [artikel 2, eerste lid][ref1], indien de in dat lid bedoelde
      werkzaamheden zonder die subsidie niet zouden kunnen worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004418#Artikel2
