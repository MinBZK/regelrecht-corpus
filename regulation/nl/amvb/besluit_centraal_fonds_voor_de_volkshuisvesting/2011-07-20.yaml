  - number: '12'
    text: |-
      1 Het fonds kan op verzoek van een toegelaten instelling de op grond van
      [artikel 71e, tweede lid, van de Woningwet][ref1] door die instelling verschuldigde bijdrage kwijtschelden, indien
      naar het oordeel van het fonds betaling van die bijdrage in aanmerkelijke mate afbreuk zou doen aan de uitoefening
      van de taken van het fonds, bedoeld in [artikel 71a, eerste lid, van die wet][ref2].

      2 Het fonds kan op verzoek van een toegelaten instelling het gedeelte van de op grond van
      [artikel 71e, tweede lid, van de Woningwet][ref3] door die instelling verschuldigde bijdrage, bedoeld in
      [artikel 9, eerste lid, onderdeel b][ref4], kwijtschelden, indien naar het oordeel van het fonds de betrokken
      toegelaten instelling aannemelijk heeft gemaakt dat zij in aanzienlijke mate heeft bijgedragen aan werkzaamheden
      op het gebied van de volkshuisvesting die door andere toegelaten instellingen worden verricht, of dat zij
      in aanzienlijke mate werkzaamheden op het gebied van de volkshuisvesting ten behoeve van andere toegelaten
      instellingen heeft verricht.

      3 De toegelaten instelling die partij is bij een uitvoeringsovereenkomst, is geen bedrag als bedoeld in
      [artikel 9, onderdeel c][ref5], verschuldigd indien:

      a. het fonds voor 1 september van het heffingsjaar die uitvoeringsovereenkomst heeft ontvangen en

      b. op 31 december van het jaar voorafgaand aan het jaar waarover de bijdrage, bedoeld in
      [artikel 71e van de Woningwet][ref6], verschuldigd is en volgens de gegevens bedoeld in
      [bijlage II bij het Besluit beheer sociale-huursector][ref7]:

      1°. ten minste 10 procent van de woongelegenheden in eigendom van die toegelaten instelling zich bevond in een of
      meer wijken, genoemd in de bijlage bij dit besluit, of

      2°. zij in een of meer wijken, genoemd in de bijlage bij dit besluit, ten minste 15 procent van de in eigendom van
      toegelaten instellingen zijnde woongelegenheden in eigendom had.

      4 Aan een beschikking op een verzoek als bedoeld in het eerste of tweede lid kan het fonds
      voorschriften verbinden met betrekking tot de wijze waarop de toegelaten instelling uitvoering geeft aan
      [artikel 21, eerste lid, van het Besluit beheer sociale-huursector][ref8].

      5 Indien bij een beschikking op een verzoek als bedoeld in het eerste of tweede lid dat verzoek wordt ingewilligd,
      betaalt het fonds een als gevolg van die beschikking ten onrechte betaald bedrag terug aan de betrokken toegelaten
      instelling. Tevens wordt rente over dat bedrag betaald, berekend vanaf de datum waarop ten onrechte is betaald tot
      de datum van terugbetaling, bedoeld in de eerste volzin, van welke rente het percentage gelijk is aan dat van de
      depositorente die de Europese Centrale Bank vaststelt, vermeerderd met 1,25.


