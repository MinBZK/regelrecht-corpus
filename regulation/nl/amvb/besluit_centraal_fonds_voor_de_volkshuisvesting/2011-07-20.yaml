  - number: '6'
    text: |-
      1 In de beleidsregels, bedoeld in [artikel 71b, eerste lid, van de Woningwet][ref1], wordt met betrekking tot de
      subsidie, bedoeld in [artikel 71a, eerste lid, onderdeel a, van die wet][ref2], bepaald:

      a. dat een aanvraag voor subsidie bij het fonds wordt ingediend;

      b. welke gegevens door de aanvragende toegelaten instelling aan het fonds moeten worden overgelegd, en dat tot die
      gegevens in elk geval behoren:

      1°. een plan voor de sanering van de toegelaten instelling, dan wel

      2°. een plan met betrekking tot de werkzaamheden, bedoeld in [artikel 2, eerste lid][ref3], dat door die toegelaten
      instelling is voorgelegd aan het college van burgemeester en wethouders van de gemeente waar zij haar woonplaats
      heeft en aan de huurders van haar woongelegenheden, teneinde hen in de gelegenheid te stellen zich daarover uit te
      spreken, dan wel

      3°. de betrokken uitvoeringsovereenkomst, waarbij naar het oordeel van het fonds voldoende inzichtelijk is gemaakt
      wat de additionele inzet van de aanvragende toegelaten instelling is ten opzichte van de additionele inzet van de
      andere toegelaten instellingen die partij bij die overeenkomst dan wel het betrokken wijkactieplan zijn, vergezeld
      van een verklaring van het college van burgemeester en wethouders dat die overeenkomst in overeenstemming is met
      dat plan;

      c. binnen welke termijn de betrokken gegevens, bedoeld in onderdeel b, aan het fonds moeten worden verstrekt, en
      dat het fonds, indien de toegelaten instelling die gegevens niet binnen die termijn verstrekt, kan bepalen dat zij,
      totdat zij de gegevens alsnog verstrekt, de door het fonds aangegeven rechtshandelingen slechts kan verrichten na
      zijn instemming;

      d. onder welke verplichtingen of voorschriften het fonds subsidie als bedoeld in [artikel 2][ref4] verstrekt,
      waartoe verplichtingen kunnen behoren met betrekking tot de wijze waarop de toegelaten instelling uitvoering geeft
      aan [artikel 21, eerste lid, van het Besluit beheer sociale-huursector][ref5];

      e. aan de hand van welke criteria ten aanzien van de vermogenspositie van een toegelaten instelling wordt
      beoordeeld of die instelling voor de subsidie, bedoeld in [artikel 2, eerste lid][ref6], in aanmerking komt;

      f. welk deel van de additionele inzet voor subsidie als bedoeld in [artikel 2, tweede lid][ref7], in aanmerking
      komt, en dat het fonds bij de bepaling van dat deel in beginsel uitgaat van de verdeling van die inzet blijkens
      de uitvoeringsovereenkomst;

      g. hoe de in [artikel 2, tweede lid][ref8], bedoelde subsidie per in de bijlage bij dit besluit genoemde wijk,
      tussen de toegelaten instellingen die partij zijn bij de uitvoeringsovereenkomst wordt verdeeld;

      h. dat de aanvraag voor subsidie als bedoeld in [artikel 2, tweede lid][ref9], met een meerjarig karakter kan
      leiden tot een jaarlijkse deeltoekenning, en

      i. dat ten behoeve van de vaststelling van de subsidie, bedoeld in [artikel 2, tweede lid][ref10], de toegelaten
      instelling een eindafrekening opstelt waarin zij aangeeft in hoeverre de voorgenomen onderdelen van het
      wijkactieplan en de uitvoeringsovereenkomst zijn uitgevoerd blijkens in elk geval een verklaring van het college
      van burgemeester en wethouders van de betrokken gemeente, en dat de uitkomst van die eindafrekening kan leiden tot
      een herberekening van die subsidie, naar rato van het uitgevoerde deel van de activiteiten, indien een deel van de
      activiteiten niet is uitgevoerd.

      2 In de beleidsregels komt tot uitdrukking dat, indien door Onze Minister een aanwijzing is gegeven met toepassing
      van [artikel 41, eerste lid, van het Besluit beheer sociale-huursector][ref11], het fonds bij de verstrekking van
      subsidie als bedoeld in [artikel 71a, eerste lid, onderdeel a, van de Woningwet][ref12] tevens die aanwijzing in
      acht neemt.


