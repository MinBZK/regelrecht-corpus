  - number: 9b
    text: |-
      1 Ten behoeve van de bepaling van de hoogte van de bedragen, bedoeld in [artikel 9, onderdeel b en c][ref1], stelt
      het fonds telkens vast:

      a. een bedrag per woongelegenheid, en

      b. een tarief per € 1000 van de gezamenlijke WOZ-waarde van de woongelegenheden.

      2 Het fonds bepaalt de hoogte van de bedragen, bedoeld in [artikel 9, onderdeel b en c][ref2], door telkens, met
      gebruikmaking van het aantal woongelegenheden dat de toegelaten instelling op 31 december van het jaar voorafgaand
      aan het jaar waarover de bijdrage verschuldigd is in eigendom of in beheer had volgens de gegevens, bedoeld in
      [bijlage II bij het Besluit beheer sociale-huursector][ref3]:

      a. het aantal woongelegenheden te vermenigvuldigen met het in het eerste lid, onderdeel a, bedoelde bedrag;

      b. de gezamenlijke WOZ-waarde van de woongelegenheden te delen door 1000 en vervolgens te vermenigvuldigen met het
      tarief, bedoeld in het eerste lid, onderdeel b;

      c. de aldus verkregen bedragen bij elkaar op te tellen.

      3 In dit artikel wordt onder gezamenlijke WOZ-waarde verstaan de som van de op voet van
      [hoofdstuk IV van de Wet waardering onroerende zaken][ref4] vastgestelde waarden volgens de gegevens, bedoeld in
      [bijlage II bij het Besluit beheer sociale-huursector][ref5].


