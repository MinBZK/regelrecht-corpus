  - number: '7'
    text: |-
      De beleidsregels bevatten voorts:

      a. de criteria die het fonds hanteert bij het opstellen van de overzichten, bedoeld in
      [artikel 4, eerste lid][ref1];

      b. de wijze waarop het fonds toepassing geeft aan [de artikelen 5, eerste en vijfde lid][ref2], en
      [12, tweede lid][ref3], aan de ingevolge [artikel 6, eerste lid, onderdeel c][ref4], gestelde beleidsregels en aan
      [artikel 31, derde lid, van het Besluit beheer sociale-huursector](onbekend);

      c. de criteria aan de hand waarvan het fonds bepaalt of en voor hoelang het over voldoende financiële middelen
      beschikt om uitvoering te geven aan [artikel 71a, eerste lid, van de Woningwet][ref5] en

      d. de termijn waarbinnen de hoogte van de bijdrage, bedoeld in [artikel 71e, tweede lid, van de Woningwet][ref6],
      door het fonds moet zijn bepaald, de termijn waarbinnen de hoogte van die bijdrage door het fonds aan de
      toegelaten instellingen moet zijn bekendgemaakt, en de termijn vanaf het tijdstip van bekendmaking waarbinnen
      die bijdrage door de toegelaten instellingen aan het fonds moet zijn betaald, met dien verstande dat de hoogte
      van het totaal aan bijdragen op hetzelfde tijdstip moet zijn bepaald als waarop de begroting, bedoeld in
      [artikel 71f, eerste lid, van de Woningwet][ref7], is vastgesteld.


