  - number: 3a
    text: |-
      1 Het fonds verstrekt slechts subsidie als bedoeld in [artikel 2, tweede lid][ref1], ten behoeve van de additionele
      inzet door de aanvragende toegelaten instelling.

      2 Het fonds verstrekt zodanig subsidie als bedoeld in [artikel 2, tweede lid][ref2], dat per wijk het maximale
      subsidiebedrag, genoemd in de bijlage bij dit besluit, jaarlijks niet wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004418#Artikel2
