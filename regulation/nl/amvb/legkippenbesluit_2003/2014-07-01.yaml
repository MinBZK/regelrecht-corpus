        artikel: '10'
        paragraaf: '4'
  - number: '3.1'
    text: |-
      Onze Minister registreert houders van legkippen. Hij verstrekt daartoe aan houders van legkippen een nummer dat
      geschikt is om de voor de menselijke consumptie in de handel gebrachte eieren te kunnen traceren.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel3
  - number: '3.2'
    text: Onze Minister kan nadere regels stellen ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel3
  - number: '3.3'
    text: Het is verboden legkippen te houden zonder te beschikken over een nummer als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel3
  - number: '3.4'
    text: |-
      In de nadere regels, bedoeld in het tweede lid kan Onze Minister de medewerking vorderen van het bestuur van het
      Productschap Pluimvee en Eieren voor het stellen van regelen omtrent het aanvragen en verstrekken van de in het
      eerste lid bedoelde afzonderlijke nummers. In de nadere regels, bedoeld in het tweede lid kan Onze Minister tevens
      de medewerking vorderen van bedoeld bestuur ter zake van het bijhouden van het register en het verstrekken van
      de nummers.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel3
  - number: '4.1'
    text: 'Legkippen beschikken ten minste over:'
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.1.a
    text: 1111 cm2 bruikbare oppervlakte per legkip;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.1.b
    text: één nest per 7 legkippen dan wel een gemeenschappelijk nest van 1 m2 per 120 legkippen;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.1.c
    text: |-
      een met strooisel bedekte oppervlakte van 250 cm2 per legkip waarbij in ieder geval een derde deel van het
      grondoppervlak met strooisel is bedekt;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.1.d
    text: |-
      een zitstok met een lengte van 15 cm per legkip die niet is aangebracht boven het strooisel. De horizontale afstand
      tussen de zitstokken bedraagt ten minste 30 cm en tussen de zitstokken en de wand ten minste 20 cm;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.1.e
    text: een passende voorziening die het doorgroeien van nagels tegengaat;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.1.f
    text: |-
      een voerbak waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm per legkip bedraagt of,
      indien het een ronde voerbak betreft, ten minste 4 cm per legkip, en
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.1.g
    text: 'een bereikbare watervoorziening bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.1.g.1º
    text: |-
      een continu werkende drinkgoot waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 2,5 cm per
      legkip bedraagt;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.1.g.2º
    text: |-
      een ronde drinkbak waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 1 cm per legkip
      bedraagt, of
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.1.g.3º
    text: |-
      één drinknippel of één waterbakje per 10 legkippen. Bij watervoorziening via nippels of drinkwaterbakjes zijn per
      legkip ten minste twee nippels of drinkwaterbakjes bereikbaar.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: '4.2'
    text: 'In een huisvestingssysteem waarin de legkippen zich vrij op en tussen de verschillende niveaus kunnen verplaatsen:'
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.2.a
    text: is het aantal niveaus op enig punt boven de vloer beperkt tot vier;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.2.b
    text: bedraagt de vrije hoogte tussen de niveaus ten minste 45 cm;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.2.c
    text: |-
      zijn de voeder- en watervoorzieningen zo over de ruimte verdeeld dat alle legkippen er gelijke toegang toe hebben,
      en
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.2.d
    text: |-
      komen de uitwerpselen van de legkippen die zich op de hogere niveaus bevinden niet op de voor de legkippen
      toegankelijke lagere niveaus terecht.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: '4.3'
    text: 'In een huisvestingssysteem waarin de legkippen toegang hebben tot een ruimte buiten:'
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.3.a
    text: geven over de hele lengte van het gebouw verdeelde uitgangen rechtstreeks toegang tot de ruimte buiten;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.3.b
    text: zijn de uitgangen ten minste 35 cm hoog en 40 cm breed;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.3.c
    text: hebben de beschikbare uitgangen een gezamenlijke breedte van ten minste 2 m per 1000 legkippen;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.3.d
    text: |-
      heeft de ruimte buiten om verontreiniging te voorkomen een grondoppervlakte die is afgestemd op de bezettingsgraad
      en het bodemtype, en
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4.3.e
    text: |-
      is de ruimte buiten voorzien van beschutting tegen slecht weer en roofdieren, en indien nodig van passende
      drinkvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: '4.4'
    text: |-
      Een overdekte ruimte mag tot de in het eerste lid, onderdeel c, bedoelde oppervlakte worden gerekend indien de
      ruimte in ieder geval vanaf 6 uur na het begin van de lichtperiode in de stal onbeperkt toegankelijk is voor de
      legkippen, gedurende ten minste 10 uren, en de toegangen tot de ruimte ten minste 35 cm hoog en 40 cm breed zijn en
      een gezamenlijke breedte hebben van ten minste 2 m per 1000 legkippen;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: '4.5'
    text: |-
      De oppervlakken die tot de bruikbare oppervlakte wordt gerekend bieden steun aan alle naar voren gerichte tenen van
      beide poten van de legkip.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4
  - number: 4a.1
    text: |-
      Een kooi als bedoeld in [artikel 2, derde lid][ref1], heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0015138#Artikel2
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0015138
        artikel: '2'
        paragraaf: '1'
  - number: 4a.1.a
    text: een hoogte van ten minste 60 cm aan de zijde van de kooi waar de voerbak zich bevindt;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.1.b
    text: een hoogte van ten minste 50 cm boven de bruikbare oppervlakte;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.1.c
    text: een oppervlakte van ten minste 25.000 cm2, en
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.1.d
    text: ten minste twee zitstokken.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.2
    text: |-
      Legkippen die worden gehuisvest in een kooi als bedoeld in [artikel 2, derde lid][ref1], hebben ten minste de
      beschikking over:


      [ref1]: https://wetten.overheid.nl/BWBR0015138#Artikel2
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0015138
        artikel: '2'
        paragraaf: '1'
  - number: 4a.2.a
    text: |-
      800 cm2 bruikbare oppervlakte per legkip met een gewicht van ten hoogste twee kilogram en 900 cm2 bruikbare
      oppervlakte per legkip met een gewicht van meer dan twee kilogram;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.2.b
    text: een nest;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.2.c
    text: een met strooisel bedekte ruimte waar de legkippen kunnen scharrelen en bodempikken;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.2.d
    text: |-
      een zitstok met een lengte van ten minste 15 cm per legkip en een vrije ruimte boven de zitstok van ten minste
      20 cm;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.2.e
    text: |-
      een voerbak met een lengte van de voor de legkippen toegankelijke kant van ten minste 12 cm per legkip met een
      gewicht van ten hoogste twee kilogram en van ten minste 14.5 cm per legkip met een gewicht van meer dan twee
      kilogram;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.2.f
    text: een passende voorziening die het doorgroeien van nagels tegengaat, en
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.2.g
    text: |-
      een continu werkende drinkgoot waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm per
      legkip bedraagt dan wel drink-nippels of drinkwaterbakjes, waarvan er ten minste twee voor een legkip bereikbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.3
    text: De zitstokken, bedoeld in het eerste lid, onderdeel d, worden op verschillende hoogtes in de kooi geplaatst.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.4
    text: |-
      Het nest, bedoeld in het tweede lid, onderdeel b, is minder verlicht dan andere gedeelten van de kooi en heeft een
      oppervlak van ten minste:
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.4.a
    text: 2700 cm2, wanneer in de kooi 30 of minder legkippen worden gehouden, of
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.4.b
    text: 90 cm2 per legkip, wanneer in de kooi meer dan 30 legkippen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.5
    text: 'De met strooisel bedekte ruimte, bedoeld in het tweede lid, onderdeel c, heeft een oppervlak van ten minste:'
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.5.a
    text: 2700 cm2, wanneer in de kooi 30 of minder legkippen worden gehouden, of
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: 4a.5.b
    text: 90 cm2 per legkip, wanneer in de kooi meer dan 30 legkippen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel4a
  - number: '5.1'
    text: |-
      Legkippen die worden gehuisvest in een kooi als bedoeld in [artikel 2, vierde lid][ref1] hebben ten minste de
      beschikking over:


      [ref1]: https://wetten.overheid.nl/BWBR0015138#Artikel2
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015138
        artikel: '2'
        paragraaf: '1'
  - number: 5.1.a
    text: |-
      750 cm2 oppervlakte waarvan 600 cm2 bruikbare oppervlakte per legkip, met dien verstande dat de kooi boven andere
      plaatsen dan de bruikbare oppervlakte op elk punt ten minste 20 cm hoog moet zijn en dat de totale oppervlakte van
      een kooi niet kleiner mag zijn dan 2000 cm2;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel5
  - number: 5.1.b
    text: een nest;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel5
  - number: 5.1.c
    text: een met strooisel bedekte ruimte die ten minste 20 cm hoog is, waar de legkippen kunnen scharrelen en bodempikken;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel5
  - number: 5.1.d
    text: een zitstok met een lengte van 15 cm per legkip en een vrije ruimte boven de zitstok van 20 cm;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel5
  - number: 5.1.e
    text: een voerbak waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 12 cm per legkip bedraagt;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel5
  - number: 5.1.f
    text: een passende voorziening die het doorgroeien van nagels tegengaat, en
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel5
  - number: 5.1.g
    text: |-
      een continu werkende drinkgoot waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm per
      legkip bedraagt dan wel drinknippels of drinkwaterbakjes, waarvan er ten minste twee voor een legkip bereikbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel5
  - number: '5.2'
    text: De bodem van de kooi biedt steun aan alle naar voren gerichte tenen van beide poten van de legkip.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel5
  - number: '6.1'
    text: |-
      Legkippen die worden gehuisvest in een kooi als bedoeld in [artikel 2, vijfde lid][ref1], hebben ten minste de
      beschikking over:


      [ref1]: https://wetten.overheid.nl/BWBR0015138#Artikel2
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015138
        artikel: '2'
        paragraaf: '1'
  - number: 6.1.a
    text: |-
      een grondoppervlakte van 550 cm2, horizontaal gemeten, die vrij beschikbaar is en waarvan de helling niet meer
      bedraagt dan 8 graden, met een vrije ruimte van 40 cm boven 65% van de grondoppervlakte en een vrije ruimte van
      35 cm boven de overige grondoppervlakte. De ruimte onder de morsranden die de beschikbare grondoppervlakte kunnen
      beperken, wordt niet tot de grondoppervlakte gerekend;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel6
  - number: 6.1.b
    text: een voerbak waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm per legkip bedraagt;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel6
  - number: 6.1.c
    text: |-
      een continu werkende drinkgoot waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm per
      legkip bedraagt dan wel drinknippels of drinkwaterbakjes, waarvan er ten minste twee voor een legkip bereikbaar
      zijn, en
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel6
  - number: 6.1.d
    text: een passende voorziening die het doorgroeien van nagels tegengaat.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel6
  - number: '6.2'
    text: De bodem van de kooi biedt steun aan alle naar voren gerichte tenen van beide poten van de legkip.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel6
  - number: '7.1'
    text: |-
      Het geluidsniveau wordt zo laag mogelijk gehouden. Aanhoudend of plotseling lawaai wordt vermeden. Constructie,
      opstelling, onderhoud en werking van ventilatietoestellen, voedermachines of andere apparaten veroorzaken zo weinig
      mogelijk lawaai.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel7
  - number: '7.2'
    text: Het huisvestingssysteem is zodanig opgezet dat een legkip niet kan ontsnappen.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel7
  - number: '8.1'
    text: De legkippen worden ten minste eenmaal per dag door de houder geïnspecteerd.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel8
  - number: '8.2'
    text: |-
      De inrichting van het huisvestingssysteem is zodanig dat alle lagen en kooien rechtstreeks en moeiteloos kunnen
      worden geïnspecteerd en de legkippen gemakkelijk kunnen worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel8
  - number: '8.3'
    text: Rijen kooien zijn van elkaar gescheiden door gangen van ten minste 90 cm breed.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel8
  - number: '8.4'
    text: De bodem van de onderste kooi is ten minste 35 cm boven de vloer van het gebouw geplaatst.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel8
  - number: '8.5'
    text: |-
      De vorm en de grootte van de kooiopening zijn zodanig dat een volwassen legkip uit de kooi kan worden gehaald
      zonder dat dit lijden of verwondingen veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel8
  - number: '9.1'
    text: |-
      Er is voldoende goed werkende verlichtingsapparatuur aanwezig voor een grondige inspectie van iedere legkip op elk
      willekeurig tijdstip.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel9
  - number: '9.2'
    text: |-
      Een stal waarin legkippen zijn ondergebracht is gedurende de lichtperiode zodanig verlicht dat de legkippen elkaar
      duidelijk kunnen zien, dat zij hun omgeving visueel kunnen verkennen en dat zij hun gebruikelijke activiteiten
      kunnen ontplooien. In geval van verlichting met daglicht zijn de lichtopeningen zodanig gepositioneerd dat het
      licht gelijkmatig over de stal en de kooien wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel9
  - number: '9.3'
    text: |-
      Per 24 uur is er een ononderbroken duisternisperiode van 8 uur waarin de legkippen kunnen rusten. Bij de
      vermindering van kunstlicht wordt een periode van halfduister in acht genomen om de legkippen de gelegenheid te
      geven zonder verwondingen op stok te gaan.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel9
  - number: '10.1'
    text: De uitwerpselen van legkippen worden regelmatig verwijderd. Dode legkippen worden dagelijks verwijderd.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel10
  - number: '10.2'
    text: |-
      Lokalen, uitrusting en gereedschappen waarmee de legkippen in aanraking komen, worden regelmatig grondig gereinigd
      en ontsmet, in elk geval telkens wanneer de kooien om sanitaire redenen worden leeggemaakt, en ook voordat een
      nieuwe partij legkippen wordt binnengebracht. Zolang de stal of de kooien bezet zijn, worden alle oppervlakken en
      alle installaties goed schoon gehouden.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel10
  - number: '13.1'
    text: Het Besluit legbatterijen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel13
  - number: '13.2'
    text: Het Besluit huisvesting legkippen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel13
  - number: '13.3'
    text: Het Legkippenbesluit wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel13
  - number: '14'
    text: |-
      [Artikel 4][ref1] is tot en met 1 januari 2007 niet van toepassing op een huisvestingssysteem als bedoeld in dat
      artikel indien de houder kan aantonen dat het huisvestingssysteem voor 1 januari 2002 is gebouwd en in gebruik
      genomen en sedertdien niet is ver- of herbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0015138#Artikel4
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015138
        artikel: '4'
        paragraaf: '2'
  - number: '15'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld. Laatstbedoeld besluit wordt niet
      genomen voordat 30 dagen zijn verstreken nadat het onderhavige besluit is overgelegd aan beide kamers der Staten-
      Generaal, en evenmin indien binnen die termijn door of namens een der kamers of door ten minste een vijfde van het
      grondwettelijke aantal leden van een der kamers de wens te kennen wordt gegeven dat de inwerkingtreding van dit
      besluit bij wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Legkippenbesluit 2003.'
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel16
