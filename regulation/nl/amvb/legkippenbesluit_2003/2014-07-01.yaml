preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 26 maart 2003, nr.
    TRCJZ/2003/2049, Directie Juridische Zaken;

    Gelet op richtlijn 1999/74/EG van de Raad van de Europese Unie van 19 juli 1999 tot vaststelling van minimumnormen
    voor de bescherming van legkippen (PbEG L 203) alsmede op de artikelen 35, 38, 40, tweede lid, onderdeel c, 45, 108
    en 111 van de Gezondheids- en welzijnswet voor dieren;

    De Raad van State gehoord (advies van 9 mei 2003; nr. W11.03.0114/V);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 26 mei 2003, nr.
    TRCJZ/2003/4668, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Gezondheids- en welzijnswet voor dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: 1.b
    text: |-
      legkip: legrijpe kip van de soort Gallus gallus die wordt gehouden voor de productie van andere eieren dan
      broedeieren;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel1
  - number: 1.c
    text: 'huisvestingssysteem: voorziening waarin legkippen op dezelfde wijze worden gehouden;'
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel1
  - number: 1.d
    text: |-
      kooi: afgesloten ruimte bestemd voor het houden van één of meer legkippen waarin de legkippen zich niet vrijelijk
      over de vloer van de stal of op en naar verschillende niveaus binnen de stal kunnen bewegen;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel1
  - number: 1.e
    text: |-
      bruikbare oppervlakte: een ten minste 30 cm breed oppervlak met een helling van ten hoogste 8 graden met boven
      het gehele oppervlak een vrije ruimte van ten minste 45 cm hoogte. De oppervlakte van het nest wordt niet tot de
      bruikbare oppervlakte gerekend;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel1
  - number: 1.f
    text: |-
      nest: afgescheiden ruimte voor een individuele legkip of een groep legkippen die geschikt is voor het leggen van
      eieren en waarin een legkip niet in contact kan komen met bodembestanddelen die bestaan uit draadgaas;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel1
  - number: 1.g
    text: |-
      strooisel: houtkrullen, stro, gehakseld stro, turf, zand of ander materiaal met een losse structuur dat legkippen
      in staat stelt aan hun ethologische behoeften te voldoen;
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel1
  - number: 1.h
    text: |-
      zitstok: horizontaal aangebrachte stok of lat van hout, metaal of kunststof zonder scherpe randen waar de legkip op
      kan zitten of rusten, in ieder geval niet bestaande uit draadgaas.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel1
  - number: '2.1'
    text: Dit besluit is niet van toepassing op houders van legkippen die minder dan 350 legkippen houden.
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel2
  - number: '2.2'
    text: |-
      Legkippen worden ten minste gehuisvest en verzorgd overeenkomstig de [artikelen 4][ref1], [7][ref2],
      [8, eerste en tweede lid][ref3], [9][ref4] en [10][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0015138#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015138#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0015138#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0015138#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0015138#Artikel10
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015138
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015138
        artikel: '7'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0015138
        artikel: '8'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0015138
        artikel: '9'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0015138
        artikel: '10'
        paragraaf: '4'
  - number: '2.3'
    text: |-
      In afwijking van het tweede lid is het toegestaan legkippen in een kooi als bedoeld in [artikel 4a][ref1] te
      houden indien de legkippen ten minste worden gehuisvest en verzorgd overeenkomstig de [artikelen 4a][ref2] en
      [7 tot en met 10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015138#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0015138#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0015138#Artikel7
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015138
        artikel: 4a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015138
        artikel: 4a
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0015138
        artikel: '7'
        paragraaf: '4'
  - number: '2.4'
    text: |-
      In afwijking van het tweede lid is het tot en met 31 december 2020 toegestaan legkippen in een kooi als bedoeld
      in [artikel 5][ref1] te houden indien de legkippen ten minste worden gehuisvest en verzorgd overeenkomstig de
      [artikelen 5][ref2] en [7 tot en met 10][ref3], voor zover het een huisvestingssysteem betreft waarvan de gebruiker
      kan aantonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0015138#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0015138#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0015138#Artikel7
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015138
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015138
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0015138
        artikel: '7'
        paragraaf: '4'
  - number: 2.4.a
    text: het voor 18 april 2008 is gebouwd, of
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel2
  - number: 2.4.b
    text: 'ten behoeve van dit huisvestingssysteem voor 18 april 2008:'
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel2
  - number: 2.4.b.1°
    text: |-
      een milieuvergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1] is verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 2.4.b.2°
    text: |-
      een aanvraag voor een bouwvergunning als bedoeld in [artikel 40 van de Woningwet][ref1], is gedaan en: - een
      aanvraag voor een milieuvergunning is gedaan, of
        - een melding als bedoeld in [artikel 7 van het Besluit landbouw milieubeheer][ref2] is gedaan, en dat het
      huisvestingssysteem voor 18 april 2010 is gebouwd en in gebruik is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0020112#Artikel7
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0020112
        artikel: '7'
  - number: '2.5'
    text: |-
      In afwijking van het tweede lid is het tot en met 31 december 2011 toegestaan legkippen te houden in een kooi
      als bedoeld in [artikel 6][ref1] indien de legkippen ten minste worden gehuisvest en verzorgd overeenkomstig de
      [artikelen 6][ref2], [7][ref3], [8, eerste, tweede en vijfde lid][ref4], [9][ref5] en [10][ref6], voor zover
      het een huisvestingssysteem betreft waarvan de gebruiker kan aantonen dat het voor 1 januari 2003 is gebouwd en in
      gebruik is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015138#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015138#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0015138#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0015138#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0015138#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0015138#Artikel10
    url: https://wetten.overheid.nl/BWBR0015138/2014-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015138
        artikel: '6'
        paragraaf: '3'
