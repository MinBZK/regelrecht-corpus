    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 26 maart 2003, nr.
    TRCJZ/2003/2049, Directie Juridische Zaken;

    Gelet op richtlijn 1999/74/EG van de Raad van de Europese Unie van 19 juli 1999 tot vaststelling van minimumnormen
    voor de bescherming van legkippen (PbEG L 203) alsmede op de artikelen 35, 38, 40, tweede lid, onderdeel c, 45, 108
    en 111 van de Gezondheids- en welzijnswet voor dieren;

    De Raad van State gehoord (advies van 9 mei 2003; nr. W11.03.0114/V);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 26 mei 2003, nr.
    TRCJZ/2003/4668, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015138/2004-05-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Gezondheids- en welzijnswet voor dieren][ref1];

      b. legkip: legrijpe kip van de soort Gallus gallus die wordt gehouden voor de productie van andere eieren dan
      broedeieren;

      c. huisvestingssysteem: voorziening waarin legkippen op dezelfde wijze worden gehouden;

      d. kooi: afgesloten ruimte bestemd voor het houden van één of meer legkippen waarin de legkippen zich niet
      vrijelijk over de vloer van de stal of op en naar verschillende niveaus binnen de stal kunnen bewegen;

      e. bruikbare oppervlakte: een ten minste 30 cm breed oppervlak met een helling van ten hoogste 8 graden met boven
      het gehele oppervlak een vrije ruimte van ten minste 45 cm hoogte. De oppervlakte van het nest wordt niet tot de
      bruikbare oppervlakte gerekend;

      f. nest: afgescheiden ruimte voor een individuele legkip of een groep legkippen die geschikt is voor het leggen van
      eieren en waarin een legkip niet in contact kan komen met bodembestanddelen die bestaan uit draadgaas;

      g. strooisel: houtkrullen, stro, gehakseld stro, turf, zand of ander materiaal met een losse structuur dat
      legkippen in staat stelt aan hun ethologische behoeften te voldoen;

      h. zitstok: horizontaal aangebrachte stok of lat van hout, metaal of kunststof zonder scherpe randen waar de legkip
      op kan zitten of rusten, in ieder geval niet bestaande uit draadgaas.


      [ref1]: https://wetten.overheid.nl/BWBR0005662
