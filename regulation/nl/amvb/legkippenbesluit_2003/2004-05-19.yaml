  - number: '2'
    text: |-
      1 Dit besluit is niet van toepassing op houders van legkippen die minder dan 350 legkippen houden.

      2 Legkippen worden ten minste gehuisvest en verzorgd overeenkomstig de [artikelen 4][ref1], [7][ref2],
      [8, eerste en tweede lid][ref3], [9][ref4] en [10][ref5].

      3 In afwijking van het tweede lid worden in een kooi gehuisveste legkippen ten minste gehuisvest en verzorgd:

      a. overeenkomstig de [artikelen 5][ref6], [7 tot en met 10][ref7], of

      b. vanaf de inwerkingtreding van dit besluit tot en met 31 december 2011, overeenkomstig de [artikelen 6][ref8],
      [7][ref9], [8, eerste, tweede en vijfde lid][ref10], [9][ref11] en [10][ref12], indien het een huisvestingssysteem
      betreft waarvan de gebruiker kan aantonen dat het voor 1 januari 2003 is gebouwd en in gebruik is genomen.


