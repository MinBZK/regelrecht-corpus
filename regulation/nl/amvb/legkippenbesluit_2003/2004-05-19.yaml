  - number: '3'
    text: |-
      1 Onze Minister registreert houders van legkippen. Hij verstrekt daartoe aan houders van legkippen een nummer dat
      geschikt is om de voor de menselijke consumptie in de handel gebrachte eieren te kunnen traceren.

      2 Onze Minister kan nadere regels stellen ter uitvoering van het eerste lid.

      3 Het is verboden legkippen te houden zonder te beschikken over een nummer als bedoeld in het eerste lid.

      4 In de nadere regels, bedoeld in het tweede lid kan Onze Minister de medewerking vorderen van het bestuur van het
      Productschap Pluimvee en Eieren voor het stellen van regelen omtrent het aanvragen en verstrekken van de in het
      eerste lid bedoelde afzonderlijke nummers. In de nadere regels, bedoeld in het tweede lid kan Onze Minister tevens
      de medewerking vorderen van bedoeld bestuur ter zake van het bijhouden van het register en het verstrekken van
      de nummers.
    url: https://wetten.overheid.nl/BWBR0015138/2004-05-19#Artikel3
  - number: '4'
    text: |-
      1 Legkippen beschikken ten minste over:

      a. 1111 cm2 bruikbare oppervlakte per legkip;

      b. één nest per 7 legkippen dan wel een gemeenschappelijk nest van 1 m2 per 120 legkippen;

      c. een met strooisel bedekte oppervlakte van 250 cm2 per legkip waarbij in ieder geval een derde deel van het
      grondoppervlak met strooisel is bedekt;

      d. een zitstok met een lengte van 15 cm per legkip die niet is aangebracht boven het strooisel. De horizontale
      afstand tussen de zitstokken bedraagt ten minste 30 cm en tussen de zitstokken en de wand ten minste 20 cm;

      e. een passende voorziening die het doorgroeien van nagels tegengaat;

      f. een voerbak waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm per legkip bedraagt
      of, indien het een ronde voerbak betreft, ten minste 4 cm per legkip, en

      g. een bereikbare watervoorziening bestaande uit:

      1º. een continu werkende drinkgoot waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 2,5 cm
      per legkip bedraagt;

      2º. een ronde drinkbak waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 1 cm per legkip
      bedraagt, of

      3º. één drinknippel of één waterbakje per 10 legkippen. Bij watervoorziening via nippels of drinkwaterbakjes zijn
      per legkip ten minste twee nippels of drinkwaterbakjes bereikbaar.

      2 In een huisvestingssysteem waarin de legkippen zich vrij op en tussen de verschillende niveaus kunnen
      verplaatsen:

      a. is het aantal niveaus op enig punt boven de vloer beperkt tot vier;

      b. bedraagt de vrije hoogte tussen de niveaus ten minste 45 cm;

      c. zijn de voeder- en watervoorzieningen zo over de ruimte verdeeld dat alle legkippen er gelijke toegang toe
      hebben, en

      d. komen de uitwerpselen van de legkippen die zich op de hogere niveaus bevinden niet op de voor de legkippen
      toegankelijke lagere niveaus terecht.

      3 In een huisvestingssysteem waarin de legkippen toegang hebben tot een ruimte buiten:

      a. geven over de hele lengte van het gebouw verdeelde uitgangen rechtstreeks toegang tot de ruimte buiten;

      b. zijn de uitgangen ten minste 35 cm hoog en 40 cm breed;

      c. hebben de beschikbare uitgangen een gezamenlijke breedte van ten minste 2 m per 1000 legkippen;

      d. heeft de ruimte buiten om verontreiniging te voorkomen een grondoppervlakte die is afgestemd op de
      bezettingsgraad en het bodemtype, en

      e. is de ruimte buiten voorzien van beschutting tegen slecht weer en roofdieren, en indien nodig van passende
      drinkvoorzieningen.

      4 Een overdekte ruimte mag tot de in het eerste lid, onderdeel c, bedoelde oppervlakte worden gerekend indien de
      ruimte in ieder geval vanaf 6 uur na het begin van de lichtperiode in de stal onbeperkt toegankelijk is voor de
      legkippen, gedurende ten minste 10 uren, en de toegangen tot de ruimte ten minste 35 cm hoog en 40 cm breed zijn en
      een gezamenlijke breedte hebben van ten minste 2 m per 1000 legkippen;

      5 De oppervlakken die tot de bruikbare oppervlakte wordt gerekend bieden steun aan alle naar voren gerichte tenen
      van beide poten van de legkip.
    url: https://wetten.overheid.nl/BWBR0015138/2004-05-19#Artikel4
  - number: '5'
    text: |-
      1 Legkippen die worden gehuisvest in een kooi hebben ten minste de beschikking over:

      a. 750 cm2 oppervlakte waarvan 600 cm2 bruikbare oppervlakte per legkip, met dien verstande dat de kooi boven
      andere plaatsen dan de bruikbare oppervlakte op elk punt ten minste 20 cm hoog moet zijn en dat de totale
      oppervlakte van een kooi niet kleiner mag zijn dan 2000 cm2;

      b. een nest;

      c. een met strooisel bedekte ruimte die ten minste 20 cm hoog is, waar de legkippen kunnen scharrelen en
      bodempikken;

      d. een zitstok met een lengte van 15 cm per legkip en een vrije ruimte boven de zitstok van 20 cm;

      e. een voerbak waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 12 cm per legkip bedraagt;

      f. een passende voorziening die het doorgroeien van nagels tegengaat, en

      g. een continu werkende drinkgoot waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm
      per legkip bedraagt dan wel drinknippels of drinkwaterbakjes, waarvan er ten minste twee voor een legkip bereikbaar
      zijn.

      2 De bodem van de kooi biedt steun aan alle naar voren gerichte tenen van beide poten van de legkip.
    url: https://wetten.overheid.nl/BWBR0015138/2004-05-19#Artikel5
  - number: '6'
    text: |-
      1 Legkippen die worden gehuisvest in een kooi, waarvan de gebruiker kan aantonen dat de kooi deel uitmaakt van
      een huisvestingssysteem dat voor 1 januari 2003 is gebouwd en in gebruik genomen, hebben ten minste de beschikking
      over:

      a. een grondoppervlakte van 550 cm2, horizontaal gemeten, die vrij beschikbaar is en waarvan de helling niet meer
      bedraagt dan 8 graden, met een vrije ruimte van 40 cm boven 65% van de grondoppervlakte en een vrije ruimte van
      35 cm boven de overige grondoppervlakte. De ruimte onder de morsranden die de beschikbare grondoppervlakte kunnen
      beperken, wordt niet tot de grondoppervlakte gerekend;

      b. een voerbak waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm per legkip bedraagt;

      c. een continu werkende drinkgoot waarvan de lengte van de voor de legkippen toegankelijke kant ten minste 10 cm
      per legkip bedraagt dan wel drinknippels of drinkwaterbakjes, waarvan er ten minste twee voor een legkip bereikbaar
      zijn, en

      d. een passende voorziening die het doorgroeien van nagels tegengaat.

      2 De bodem van de kooi biedt steun aan alle naar voren gerichte tenen van beide poten van de legkip.
    url: https://wetten.overheid.nl/BWBR0015138/2004-05-19#Artikel6
  - number: '7'
    text: |-
      1 Het geluidsniveau wordt zo laag mogelijk gehouden. Aanhoudend of plotseling lawaai wordt vermeden. Constructie,
      opstelling, onderhoud en werking van ventilatietoestellen, voedermachines of andere apparaten veroorzaken zo weinig
      mogelijk lawaai.

      2 Het huisvestingssysteem is zodanig opgezet dat een legkip niet kan ontsnappen.
    url: https://wetten.overheid.nl/BWBR0015138/2004-05-19#Artikel7
  - number: '8'
    text: |-
      1 De legkippen worden ten minste eenmaal per dag door de houder geïnspecteerd.

      2 De inrichting van het huisvestingssysteem is zodanig dat alle lagen en kooien rechtstreeks en moeiteloos kunnen
      worden geïnspecteerd en de legkippen gemakkelijk kunnen worden verwijderd.

      3 Rijen kooien zijn van elkaar gescheiden door gangen van ten minste 90 cm breed.

      4 De bodem van de onderste kooi is ten minste 35 cm boven de vloer van het gebouw geplaatst.

      5 De vorm en de grootte van de kooiopening zijn zodanig dat een volwassen legkip uit de kooi kan worden gehaald
      zonder dat dit lijden of verwondingen veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0015138/2004-05-19#Artikel8
  - number: '9'
    text: |-
      1 Er is voldoende goed werkende verlichtingsapparatuur aanwezig voor een grondige inspectie van iedere legkip op
      elk willekeurig tijdstip.

      2 Een stal waarin legkippen zijn ondergebracht is gedurende de lichtperiode zodanig verlicht dat de legkippen
      elkaar duidelijk kunnen zien, dat zij hun omgeving visueel kunnen verkennen en dat zij hun gebruikelijke
      activiteiten kunnen ontplooien. In geval van verlichting met daglicht zijn de lichtopeningen zodanig gepositioneerd
      dat het licht gelijkmatig over de stal en de kooien wordt verdeeld.

      3 Per 24 uur is er een ononderbroken duisternisperiode van 8 uur waarin de legkippen kunnen rusten. Bij de
      vermindering van kunstlicht wordt een periode van halfduister in acht genomen om de legkippen de gelegenheid te
      geven zonder verwondingen op stok te gaan.
    url: https://wetten.overheid.nl/BWBR0015138/2004-05-19#Artikel9
  - number: '10'
    text: |-
      1 De uitwerpselen van legkippen worden regelmatig verwijderd. Dode legkippen worden dagelijks verwijderd.

      2 Lokalen, uitrusting en gereedschappen waarmee de legkippen in aanraking komen, worden regelmatig grondig
      gereinigd en ontsmet, in elk geval telkens wanneer de kooien om sanitaire redenen worden leeggemaakt, en ook
      voordat een nieuwe partij legkippen wordt binnengebracht. Zolang de stal of de kooien bezet zijn, worden alle
      oppervlakken en alle installaties goed schoon gehouden.
    url: https://wetten.overheid.nl/BWBR0015138/2004-05-19#Artikel10
  - number: '13'
    text: |-
      1 Het Besluit legbatterijen wordt ingetrokken.

      2 Het Besluit huisvesting legkippen wordt ingetrokken.

      3 Het Legkippenbesluit wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015138/2004-05-19#Artikel13
  - number: '14'
    text: |-
      [Artikel 4][ref1] is tot en met 1 januari 2007 niet van toepassing op een huisvestingssysteem als bedoeld in dat
      artikel indien de houder kan aantonen dat het huisvestingssysteem voor 1 januari 2002 is gebouwd en in gebruik
      genomen en sedertdien niet is ver- of herbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0015138#Artikel4
