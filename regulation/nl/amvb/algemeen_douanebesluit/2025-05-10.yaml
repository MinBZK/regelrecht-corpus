  - number: 1:2
    text: |-
      De inspecteur neemt van het op 10 december 1982 te Montego Bay tot stand gekomen Verdrag van de Verenigde Naties
      inzake het recht van de zee (Trb. 1983, 83) bij de douanecontrole in acht:
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel12
  - number: 1:2.a
    text: de artikelen 21, 24, 25, 26 en 32, voor zover het de territoriale zee betreft;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel12
  - number: 1:2.b
    text: de artikelen 33 en 303, voor zover het de aansluitende zone betreft; en
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel12
  - number: 1:2.c
    text: artikel 56, voor zover het de exclusieve economische zone betreft.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel12
  - number: 1:3
    text: |-
      Onze minister van Financiën kan aan organisaties de bevoegdheid verlenen, hetzij rechtstreeks, hetzij door
      tussenkomst van soortgelijke organisaties, carnets TIR (TIR-Overeenkomst) af te geven of in dat kader borg te
      staan. Hij kan daarbij voorwaarden en eisen stellen waaraan deze organisaties moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel13
  - number: 1:4
    text: 'Kosten zijn verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14
  - number: 1:4.a
    text: 'voor werkzaamheden verricht op verzoek van de belanghebbende:'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14
  - number: 1:4.a.1°
    text: buiten de normale openingstijden;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14
  - number: 1:4.a.2°
    text: op andere plaatsen dan die aangewezen zijn voor het onderzoek van goederen; of
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14
  - number: 1:4.a.3°
    text: |-
      voor analyses of deskundigenverslagen van goederen en portokosten voor het retourneren van de goederen aan de
      aanvrager bij het verstrekken van inlichtingen als bedoeld in artikel 14, eerste lid, van het Douanewetboek van
      de Unie;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14
  - number: 1:4.b
    text: voor het doen vernietigen van goederen, bedoeld in artikel 197 van het Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14
  - number: 1:4.c
    text: |-
      voor het ambtshalve onderzoek van de goederen, bedoeld in de artikelen 239, tweede lid, en 240, tweede lid, van de
      Uitvoeringsverordening Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14
  - number: 1:4.d
    text: |-
      inzake het aanvullend onderzoek van goederen, ingeval de verschillen tussen de uitkomst van het
      gedeeltelijk onderzoek en de uitkomst van het aanvullend onderzoek, blijven binnen de spelingen, bedoeld in
      [artikel 1:35 van de Algemene douanewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4a
    text: |-
      De overeenkomst, bedoeld in [artikel 1:23a, zesde lid, van de Algemene douanewet][ref1], niet zijnde een
      overeenkomst als bedoeld in artikel 28, derde lid, van de [Verordening (EU) 2016/679](32016R0679) van het Europees
      Parlement en de Raad van 27 april 2016 betreffende de bescherming van natuurlijke personen in verband met de
      verwerking van persoonsgegevens en betreffende het vrije verkeer van die gegevens en tot intrekking van [Richtlijn
      95/46/EG](31995L0046) (algemene verordening gegevensbescherming) (PbEU 2016, L 119), regelt in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4a.a
    text: |-
      de wijze waarop en de mate waarin de inspecteur over de camera waarbij persoonsgegevens worden verwerkt kan
      beschikken;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14a
  - number: 1:4a.b
    text: |-
      welke passende algemeen aanvaarde beveiligingsmaatregelen als bedoeld in
      [artikel 1:23g, eerste lid, van de Algemene douanewet][ref1] worden getroffen met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4a.b.1°
    text: |-
      de fysieke toegang van de gemandateerden, bedoeld in dat lid, tot de ruimte waarin de camerabeelden kunnen worden
      bekeken; of
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14a
  - number: 1:4a.b.2°
    text: de overdracht van de camerabeelden aan de inspecteur;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14a
  - number: 1:4a.c
    text: |-
      de procedures bij wijzigingen in apparatuur, software of procedures die betrekking hebben op het verlenen van
      toegang dan wel overdracht van de camerabeelden aan de inspecteur;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14a
  - number: 1:4a.d
    text: |-
      op welke wijze uitvoering wordt gegeven aan [artikel 1:23g, tweede lid, van de Algemene douanewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4a.e
    text: |-
      de medewerking aan de audit, bedoeld in [artikel 1:23g, vierde lid, van de Algemene douanewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4b
    text: 'De inspecteur legt vast:'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14b
  - number: 1:4b.a
    text: |-
      de tijdvakken waarin de camera’s waarbij persoonsgegevens kunnen worden verwerkt worden gebruikt voor de taken en
      de doelen, bedoeld in de [artikelen 1:23a tot en met 1:23f van de Algemene douanewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4b.b
    text: |-
      de namen van de ambtenaren die de camerabeelden waarbij persoonsgegevens kunnen worden verwerkt inzien en het
      tijdvak, bedoeld in onderdeel a, waarin;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14b
  - number: 1:4b.c
    text: |-
      het aantal gevallen en de aanleiding waarbij de persoonsgegevens zijn gebruikt voor het identificeren van
      natuurlijke personen voor de persoonlijke veiligheid van een ambtenaar of zijn directe omgeving, bedoeld in
      [artikel 1:23a, derde lid, van de Algemene douanewet][ref1], en wat met die persoonsgegevens is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4b.d
    text: |-
      de dringende gevallen waarvoor toestemming is gevraagd, bedoeld in
      [artikel 1:23a, vierde lid, onderdeel d, van de Algemene douanewet][ref1], onder vermelding van de reden, waar de
      camera’s op werden gericht dan wel in of op welke locaties deze werden ingezet en de resultaten van het gebruik van
      die camera’s;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4b.e
    text: |-
      welke beveiligingsmaatregelen als bedoeld in [artikel 1:23g, eerste lid, van de Algemene douanewet][ref1] zijn
      genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4b.f
    text: |-
      welke ambtenaren zijn gemandateerd als bedoeld in [artikel 1:23g, eerste lid, van de Algemene douanewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4b.g
    text: |-
      het tijdstip en de wijze van vernietiging van de persoonsgegevens die zijn verkregen met camera’s, bedoeld in
      [artikel 1:23g, derde lid, van de Algemene douanewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4b.h
    text: |-
      indien de persoonsgegevens die zijn verkregen met camera’s niet binnen vier weken nadat ze zijn verkregen zijn
      vernietigd, de reden waarom en een verwijzing naar het daarbij behorende dossier;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14b
  - number: 1:4b.i
    text: |-
      indien ingevolge een bij of krachtens de wet bestaande verplichting de persoonsgegevens die zijn verkregen met
      camera’s zijn verstrekt, aan wie deze zijn verstrekt onder vermelding van de grondslag daarvan;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14b
  - number: 1:4b.j
    text: |-
      de eventuele inbreuken op de wet- en regelgeving, die zich hebben voorgedaan ten aanzien van het gebruik van
      camera’s waarbij persoonsgegevens worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14b
  - number: 1:4c.1
    text: |-
      Het cameraplan, bedoeld in [artikel 1:23g, vijfde lid, van de Algemene douanewet][ref1], geeft inzicht in de
      camera’s die de inspecteur gebruikt waarbij persoonsgegevens kunnen worden verwerkt en beschrijft:


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4c.1.a
    text: |-
      de locaties, bedoeld in [artikel 1:23a, vierde lid, onderdelen a en b, van de Algemene douanewet][ref1], waar
      gebruik kan worden gemaakt van vaste camera’s;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4c.1.b
    text: het voorgenomen aantal te gebruiken vaste camera’s per locatie of gebied;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14c
  - number: 1:4c.1.c
    text: |-
      de locaties, bedoeld in [artikel 1:23a, vierde lid, onderdelen a en b, van de Algemene douanewet][ref1], waar en de
      situaties waarin mobiele camera’s kunnen worden ingezet; en


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:4c.1.d
    text: |-
      een onderbouwing voor de voorgenomen inzet van camera’s, tenzij de melding de effectiviteit van het beperken van
      risico’s ernstig kan benadelen.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14c
  - number: 1:4c.2
    text: |-
      Het cameraplan ziet op zowel eigen camera’s als die van personen of instellingen die geen inspecteur of ontvanger
      zijn.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel14c
  - number: 1:5.1
    text: |-
      De ambtenaar, bedoeld in [artikel 1:28, zesde lid, van de Algemene douanewet][ref1], vermeldt in een schriftelijk
      verslag de redenen voor het geven van de toestemming over te gaan tot gehele ontkleding dan wel het onderzoek van
      het onderlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:5.2
    text: |-
      Na afloop van de lijfsvisitatie waarbij overgegaan is tot gehele ontkleding dan wel onderzoek van het onderlichaam
      vult degene die de lijfsvisitatie uitvoert, binnen 48 uur het schriftelijke verslag aan met vermelding van de wijze
      waarop de lijfsvisitatie is verricht en de resultaten van de lijfsvisitatie. Hij doet dit verslag toekomen aan
      de inspecteur, en in het geval dat een verpleegkundige het onderzoek van het onderlichaam verricht, doet hij een
      afschrift toekomen aan de arts die daartoe opdracht heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel15
  - number: 1:5.3
    text: |-
      Op de besloten plaats waar de lijfsvisitatie plaatsvindt waarbij wordt overgegaan tot gehele ontkleding dan wel het
      onderzoek van het onderlichaam, wordt degene die de lijfsvisitatie uitvoert slechts vergezeld door de ambtenaar,
      bedoeld in [artikel 1:28, zesde lid, van de Algemene douanewet][ref1]. Hiervan kan worden afgeweken indien deze
      ambtenaar een redelijk vermoeden heeft dat de persoon die aan lijfsvisitatie wordt onderworpen een gevaar oplevert
      voor de veiligheid van zichzelf of van anderen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:5.4
    text: |-
      Apparatuur waarmee door kleding van personen wordt gekeken, mag op een niet besloten plaats worden gebruikt,
      mits de beelden op een besloten plaats worden geanalyseerd. De persoon die de beelden analyseert, hoeft niet van
      hetzelfde geslacht te zijn als dat van de persoon die aan lijfsvisitatie wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel15
  - number: 1:5.5
    text: |-
      Bij regeling van Onze minister van Financiën kunnen nadere regels worden gesteld met betrekking tot de apparatuur
      waarmee door kleding van personen wordt gekeken en het gebruik daarvan.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel15
  - number: 1:6
    text: 'Voor de toepassing van deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel16
  - number: 1:6.a
    text: '*ambtenaar*: degene die namens de inspecteur een douanecontrole uitoefent;'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel16
  - number: 1:6.b
    text: |-
      *meerdere*: de ambtenaar die uit hoofde van zijn functie of krachtens beschikking of aanwijzing met de leiding is
      belast of het bevel heeft over de taakuitvoering;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel16
  - number: 1:6.c
    text: '*geweld*: elke dwangmatige kracht van meer dan geringe betekenis uitgeoefend op personen of goederen;'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel16
  - number: 1:6.d
    text: |-
      *geweldsmiddel*: de wapens en uitrusting waarmee met overeenkomstige toepassing van
      [artikel 3a, derde lid, van de Wet wapens en munitie][ref1] geweld kan worden uitgeoefend;


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel3a
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: 3a
  - number: 1:6.e
    text: |-
      *aanwenden van een geweldsmiddel*: het gebruiken van een geweldsmiddel, daaronder begrepen het dreigen met een
      geweldsmiddel, waaronder niet wordt begrepen het uit voorzorg ter hand nemen van een vuurwapen.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel16
  - number: 1:7.1
    text: |-
      Indien een ambtenaar onder leiding van een ter plaatse aanwezige meerdere optreedt, oefent hij geen geweld uit dan
      na uitdrukkelijke last van deze meerdere. De meerdere geeft daarbij aan welk middel mag worden aangewend.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel17
  - number: 1:7.2
    text: |-
      Het eerste lid is niet van toepassing in het geval de meerdere, bedoeld in het eerste lid, vooraf anders heeft
      bepaald.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel17
  - number: 1:8.1
    text: |-
      De ambtenaar wendt bij de uitoefening van zijn dienst uitsluitend het geweldsmiddel aan dat door of vanwege Onze
      minister wie het aangaat is verstrekt.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel18
  - number: 1:8.2
    text: |-
      Het aanwenden van een geweldsmiddel is uitsluitend toegestaan aan een ambtenaar die in het gebruik van dat
      geweldsmiddel is geoefend en is uitgerust met een geweldsmiddel in het kader van zijn taak als buitengewoon
      opsporingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel18
  - number: 1:9
    text: |-
      Het aanwenden van een geweldsmiddel door de ambtenaar is slechts geoorloofd om een persoon aan de kleding te
      onderzoeken ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een wapen bij zich heeft. Het
      onderzoek aan de kleding moet noodzakelijk zijn om te voorkomen dat bedoelde persoon gebruik gaat maken van het
      wapen.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel19
  - number: 1:10
    text: |-
      De ambtenaar mag in verband met zijn eigen veiligheid of die van anderen slechts een geweldsmiddel ter hand nemen
      indien redelijkerwijs mag worden aangenomen dat een situatie ontstaat waarin hij bevoegd is het geweldsmiddel
      aan te wenden. Zodra blijkt dat een dergelijke situatie zich niet voordoet, wordt het geweldsmiddel terstond
      opgeborgen.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel110
  - number: 1:11.1
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij gericht een geweldsmiddel zal gebruiken, met luide stem of op
      andere niet mis te verstane wijze dat het desbetreffende geweldsmiddel gebruikt zal worden indien niet onverwijld
      het gegeven bevel wordt opgevolgd.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel111
  - number: 1:11.2
    text: |-
      De waarschuwing, bedoeld in het eerste lid, die in het geval van een vuurwapen zonodig vervangen kan worden door
      een waarschuwingsschot, blijft slechts achterwege, wanneer de omstandigheden de waarschuwing niet toelaten.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel111
  - number: 1:11.3
    text: |-
      Een waarschuwingsschot wordt op zodanige wijze gegeven dat gevaar voor personen of zaken zoveel mogelijk wordt
      vermeden.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel111
  - number: 1:12.1
    text: |-
      Pepperspray wordt tegen een persoon per geval ten hoogste twee maal voor de duur van niet langer dan ongeveer een
      seconde gebruikt en op een afstand van ten minste een meter.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel112
  - number: 1:12.2
    text: 'Pepperspray wordt niet gebruikt tegen:'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel112
  - number: 1:12.2.a
    text: personen die zichtbaar jonger dan 12 jaar of ouder dan 65 jaar zijn;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel112
  - number: 1:12.2.b
    text: vrouwen die zichtbaar zwanger zijn;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel112
  - number: 1:12.2.c
    text: |-
      personen voor wie dit gebruik als gevolg van een voor de ambtenaar zichtbare ademhalings- of andere
      gezondheidsstoornis onevenredig schadelijk kan zijn; en
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel112
  - number: 1:12.2.d
    text: groepen personen.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel112
  - number: 1:13.1
    text: |-
      De ambtenaar die geweld heeft aangewend, meldt dit aanwenden van het geweld, de redenen die daartoe hebben geleid
      en de daaruit voortvloeiende gevolgen onverwijld aan de hulpofficier van justitie die krachtens aanwijzing is
      belast met de registratie van aangewend geweld.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel113
  - number: 1:13.2
    text: 'De melding, bedoeld in het eerste lid, geschiedt binnen 48 uur in de vorm van een schriftelijk rapport indien:'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel113
  - number: 1:13.2.a
    text: |-
      de gevolgen van het geweld daartoe, naar het oordeel van de in het eerste lid bedoelde hulpofficier van justitie,
      aanleiding geven;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel113
  - number: 1:13.2.b
    text: van een vuurwapen gebruik is gemaakt; of
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel113
  - number: 1:13.2.c
    text: |-
      enig geweldsmiddel is aangewend en lichamelijk letsel van meer dan geringe betekenis dan wel de dood veroorzaakt
      is.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel113
  - number: 1:13.3
    text: |-
      Het rapport, bedoeld in het tweede lid, wordt ter kennis gebracht van de officier van justitie van het
      arrondissement waarbinnen het geweld dan wel in voorkomend geval het geweldsmiddel is aangewend.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel113
  - number: 1:13.4
    text: |-
      Indien het aanwenden van geweld dan wel een geweldsmiddel op uitdrukkelijke last van een meerdere heeft
      plaatsgevonden, wordt het rapport, bedoeld in tweede lid, door die meerdere opgemaakt.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel113
  - number: 1:13.5
    text: |-
      De hulpofficier van justitie licht de ambtenaar zo spoedig mogelijk in over de afhandeling van het rapport, bedoeld
      in het tweede lid. Desgevraagd worden aan bedoelde ambtenaar tussentijds inlichtingen verstrekt.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel113
  - number: 1:14.1
    text: |-
      Het onderzoek, bedoeld in [artikel 1:30, derde lid, van de Algemene douanewet][ref1], geschiedt door het aan de
      oppervlakte aftasten van de kleding.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 1:14.2
    text: |-
      De ambtenaar die een onderzoek als bedoeld in [artikel 1:30, derde lid, van de Algemene douanewet][ref1], heeft
      uitgevoerd, meldt dit schriftelijk binnen 48 uur aan zijn meerdere, onder vermelding van de redenen die tot dat
      onderzoek hebben geleid en de uit het onderzoek voortvloeiende gevolgen en resultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 2:1.1
    text: |-
      Bij regeling van Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking kunnen ter uitvoering van
      bindende EU-rechtshandelingen non-tarifaire handelspolitieke maatregelen worden gesteld inzake goederen met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel21
  - number: 2:1.1.a
    text: het binnenbrengen in het douanegebied;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel21
  - number: 2:1.1.b
    text: het aanbrengen bij de douane;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel21
  - number: 2:1.1.c
    text: het plaatsen onder een douaneregeling; of
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel21
  - number: 2:1.1.d
    text: het verlaten van het douanegebied.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel21
  - number: 2:1.2
    text: |-
      Het eerste lid is niet van toepassing op producten als bedoeld in bijlage 1 bij het Verdrag betreffende de werking
      van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel21
  - number: 2:1.3
    text: |-
      Het eerste lid geldt niet voor Verordening (EG) nr. 1334/2000 van de Raad van 22 juni 2000 tot instelling van
      communautaire regeling voor controle op de uitvoer van producten en technologie voor tweeërlei gebruik (PbEG 2000,
      L 159).
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel21
  - number: 2:2.1
    text: |-
      Bij regeling van Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking kunnen regels worden gesteld
      met betrekking tot van in het internationale verkeer te bezigen verklaringen inzake de oorsprong van goederen.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel22
  - number: 2:2.2
    text: |-
      Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking kan bij regeling bestuursorganen aanwijzen die
      met het verstrekken van deze verklaringen zijn belast.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel22
  - number: 3:1
    text: 'Voor de toepassing van dit hoofdstuk en voor de daarop gebaseerde bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel31
  - number: 3:1.a
    text: '*Onze minister*: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel31
  - number: 3:1.b
    text: '*landbouwproducten*: de volgende goederen:'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel31
  - number: 3:1.b.1°
    text: |-
      alle voortbrengselen welke, al dan niet na be- of verwerking, kunnen dienen als voedsel voor mens of dier, alsmede
      de bij be- of verwerking van die voortbrengselen verkregen derivaten en afvallen;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel31
  - number: 3:1.b.2°
    text: |-
      de niet reeds onder 1° begrepen voortbrengselen van akkerbouw, weidebouw, veehouderij, pluimveehouderij en
      tuinbouw, daaronder begrepen fruitteelt en het kweken van bomen, bloemen en bloembollen, alsmede van de teelt van
      griendhout en van elke andere vorm van bodemcultuur, zoals die hier te lande wordt uitgeoefend, met uitzondering
      van bosbouw;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel31
  - number: 3:1.c
    text: |-
      *EU-verplichting*: een EU-verordening of EU-besluit, houdende maatregelen voor het handelsverkeer van
      landbouwgoederen tussen de Europese Unie en derde landen of tussen de lidstaten van de Europese Unie onderling;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel31
  - number: 3:1.d
    text: |-
      *invoercertificaat*: een document dat ingevolge een EU-verplichting bij de invoer van een in die verplichting
      omschreven of aangeduid landbouwproduct wordt overgelegd en dat het recht en de plicht meebrengt tot het invoeren
      van het in het document omschreven of aangeduide landbouwproduct tijdens de geldigheidsduur van dat document;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel31
  - number: 3:1.e
    text: |-
      *uitvoercertificaat*: een document dat ingevolge een EU-verplichting bij de uitvoer van een in die verplichting
      omschreven of aangeduid landbouwproduct wordt overgelegd en dat het recht en de plicht meebrengt tot het uitvoeren
      van het in het document omschreven of aangeduide landbouwproduct tijdens de geldigheidsduur van dat document;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel31
  - number: 3:1.f
    text: |-
      *restitutie*: elk bedrag dat ingevolge een EU-verplichting als compenserend bedrag, als subsidie of onder welke
      benaming ook, ter zake van de uitvoer van een landbouwproduct wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel31
  - number: 3:1.g
    text: |-
      *subsidie*: elk bedrag dat ingevolge een EU-verplichting als compenserend bedrag, als restitutie of onder welke
      benaming ook, ter zake van de invoer van een landbouwproduct wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel31
  - number: 3:2.1
    text: |-
      Het is verboden landbouwproducten in te voeren of uit te voeren zonder invoercertificaat onderscheidenlijk
      uitvoercertificaat, voor zover een EU-verplichting de overlegging van een invoercertificaat of uitvoercertificaat
      bij de invoer onderscheidenlijk de uitvoer van landbouwproducten vereist.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel32
  - number: 3:2.2
    text: Onze minister is bevoegd tot verlening van een invoercertificaat en een uitvoercertificaat.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel32
  - number: 3:2.3
    text: |-
      Bij regeling van Onze minister kunnen, voor zover het voor een goede uitvoering van een EU-verplichting nodig is,
      regels worden gesteld met betrekking tot het afgeven van een invoercertificaat en een uitvoercertificaat.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel32
  - number: 3:3
    text: 'Onze minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel33
  - number: 3:3.a
    text: |-
      op aanvraag restitutie te verstrekken ter zake van de uitvoer van landbouwproducten dan wel ter zake van de uitvoer
      van daaruit of met behulp daarvan verkregen landbouwproducten;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel33
  - number: 3:3.b
    text: op aanvraag ter zake van de invoer van een landbouwproduct een subsidie te verstrekken;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel33
  - number: 3:3.c
    text: |-
      regelen te stellen met betrekking tot de aanspraak op restitutie of subsidie, de bij het aanvragen daarvan te
      verstrekken gegevens of over te leggen bewijsstukken, de vaststelling van de grondslagen waarnaar de berekening van
      de uit te keren bedragen plaatsvindt en de wijze van verstrekking van de restituties;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel33
  - number: 3:3.d
    text: |-
      sancties op te leggen als bedoeld in de artikelen 48 en 49 van Verordening (EG) nr. 612/2009 van de Commissie van
      7 juli 2009 houdende gemeenschappelijke uitvoeringsbepalingen van het stelsel van restituties bij uitvoer voor
      landbouwproducten (PbEU 2009, L 186).
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel33
  - number: 4:1
    text: |-
      De vergunninghouder aan wie een vergunning is verleend ingevolge de douanewetgeving, die zodanige wijziging wenst
      aan te brengen in de door hem gevoerde administratie dan wel de administratieve organisatie of de maatregelen van
      interne beheersing of controle, dat daardoor de wijze waarop de douanecontrole op het gebruik van de vergunning
      wordt uitgeoefend, wordt beïnvloed, onderwerpt de wijziging vooraf aan de goedkeuring van de inspecteur. De
      wijziging wordt niet aangebracht dan na de verkregen goedkeuring.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel41
  - number: 5:1
    text: |-
      Als waardevolle goederen als bedoeld in [artikel 3:4, eerste lid, van de Algemene douanewet][ref1] worden
      aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel3
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '3'
  - number: 5:1.a
    text: voer- en vaartuigen;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel51
  - number: 5:1.b
    text: edele metalen;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel51
  - number: 5:1.c
    text: edelstenen (bewerkt en onbewerkt);
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel51
  - number: 5:1.d
    text: sieraden;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel51
  - number: 5:1.e
    text: horloges;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel51
  - number: 5:1.f
    text: bijouterieën;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel51
  - number: 5:1.g
    text: beleggings- en herdenkingsmunten;
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel51
  - number: 5:1.h
    text: kunstvoorwerpen en antiquiteiten.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel51
  - number: 6:2
    text: |-
      Indien niet aan de bij [artikel 4:1][ref1] opgelegde verplichting is voldaan, vormt dit een verzuim ter zake
      waarvan door de inspecteur een bestuurlijke boete kan worden opgelegd van ten hoogste € 408.


      [ref1]: https://wetten.overheid.nl/BWBR0024235#Artikel4
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0024235
        artikel: '4'
        hoofdstuk: '4'
  - number: 6:3
    text: |-
      Overtreding van het verbod, bedoeld in [artikel 3:2, eerste lid][ref1], vormt een verzuim ter zake waarvan door de
      inspecteur een bestuurlijke boete kan worden opgelegd van ten hoogste € 408.


      [ref1]: https://wetten.overheid.nl/BWBR0024235#Artikel3
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0024235
        artikel: '3'
        hoofdstuk: '3'
  - number: 6:4
    text: |-
      De in de [artikelen 6:2][ref1] en [6:3][ref2] genoemde bedragen worden elke vijf jaar, met ingang van 1 januari
      2015, overeenkomstig [artikel 9:6a van de Algemene douanewet][ref3], bij ministeriële regeling gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0024235#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024235#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel9
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0024235
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0024235
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0023746
        artikel: '9'
  - number: 7:2
    text: |-
      Degene die de bij [artikel 4:1][ref1] opgelegde verplichting schendt, maakt zich schuldig aan het plegen van een
      strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0024235#Artikel4
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0024235
        artikel: '4'
        hoofdstuk: '4'
  - number: 7:3
    text: |-
      Degene die het verbod, bedoeld in [artikel 3:2, eerste lid][ref1], overtreedt, maakt zich schuldig aan het plegen
      van een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0024235#Artikel3
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0024235
        artikel: '3'
        hoofdstuk: '3'
  - number: 8:1
    text: Dit besluit treedt in werking op het tijdstip waarop de Algemene douanewet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel81
  - number: 8:2
    text: 'Dit besluit wordt aangehaald als: Algemeen douanebesluit.'
    url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#Artikel82
