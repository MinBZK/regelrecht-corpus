preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de staatssecretaris van Financiën van 8 februari 2008, nr. DV2007/103 M, gedaan mede namens
    Onze minister van Landbouw, Natuur en Voedselkwaliteit en de staatssecretaris van Economische Zaken;

    Gelet op de artikelen 1:4, 1:19, 1:25, 1:28, 1:30, 3:1, 4:1, 9:5, 10:10 en 12:1 van de Algemene douanewet;

    De Raad van State gehoord 10 april 2008, nr. W06.08.0054/III;

    Gezien het nader rapport van de staatssecretaris van Financiën van 2 juli 2008, nr. DV 2008-332U, uitgebracht mede
    namens Onze minister van Landbouw, Natuur en Voedselkwaliteit en de staatssecretaris van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0024235/2025-05-10#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      Dit besluit geeft uitvoering aan de [artikelen 1:4][ref1], [1:19][ref2], [1:23h][ref3], [1:25][ref4],
      [1:28][ref5], [1:30][ref6], [3:1][ref7], [3:4][ref8], [4:1][ref9], [9:5][ref10], [10:10][ref11] en
      [12:1 van de Algemene douanewet][ref12].


