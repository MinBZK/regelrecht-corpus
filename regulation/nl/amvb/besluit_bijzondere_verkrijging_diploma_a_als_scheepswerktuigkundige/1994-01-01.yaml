        artikel: '2'
  - number: '4'
    text: |-
      1 Het praktijkboek bevat opdrachten, die de kandidaat gedurende de diensttijd, bedoeld in
      [artikel 3, eerste lid, onder b][ref1], overeenkomstig de in het praktijkboek gegeven richtlijnen dient uit te
      voeren.

      2 Onze Minister stelt het model, de richtlijnen en de inhoud van het praktijkboek vast.

      3 Ter verkrijging van een praktijkboek wendt de kandidaat zich tot de voorzitter van de Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0004216#Artikel3
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004216
        artikel: '3'
  - number: '5'
    text: >-
      1 De kandidaat richt zich bij de uitvoering van de in het praktijkboek vervatte opdrachten naar de aanwijzingen van
      de hoofdwerktuigkundige.


      2 Na uitvoering van de opdrachten en parafering daarvan door de hoofdwerktuigkundige dient het praktijkboek door
      de kapitein te worden ondertekend. De kandidaat zendt het ondertekende praktijkboek aan de voorzitter van de
      Commissie.


      3 Zo spoedig mogelijk na ontvangst van het praktijkboek deelt de voorzitter van de Commissie de kandidaat mee of
      het is goedgekeurd.


      4 Indien de voorzitter van de Commissie van oordeel is, dat het praktijkboek niet in alle opzichten naar behoren
      is bijgehouden, kan hij de kandidaat in de gelegenheid stellen binnen een door de voorzitter te bepalen termijn van
      ten hoogste zes maanden in het ontbrekende te voorzien.
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel5
  - number: '6'
    text: >-
      De kapitein van het schip draagt er zorg voor dat degene die aan boord daarvan een praktijkboek dient bij te
      houden, de daarin vervatte opdrachten naar behoren kan verrichten.
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel6
  - number: '7'
    text: >-
      De reder die iemand in de gelegenheid stelt op zijn schip of schepen de ingevolge dit besluit vereiste diensttijd
      onder bijhouding van een praktijkboek te behalen, draagt er zorg voor dat de belanghebbende gedurende die
      diensttijd praktisch wordt bekwaamd voor zijn toekomstige functie en dat zowel hij als de kapitein en de
      hoofdwerktuigkundige in de gelegenheid worden gesteld op de juiste wijze uitvoering te geven aan het bij of
      krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel7
  - number: '8'
    text: |-
      1 Aan degene die aan een school het eindexamen met goed gevolg heeft afgelegd en die tenminste één jaar
      diensttijd heeft behaald in de machinekamer van zeeschepen of zeevissersvaartuigen ongeacht hun nationaliteit
      of voortstuwingsvermogen, maar hierop geen praktijkboek heeft bijgehouden, wordt, mits hij voldoet aan de in
      [artikel 10, tweede lid][ref1], van dit besluit gestelde voorwaarden, op zijn verzoek door Onze Minister het
      voorlopig diploma als scheepswerktuigkundige uitgereikt.

      2 Onze Minister stelt het model vast van het in het eerste lid genoemde diploma.

      3 Aan de houder van het in het eerste lid genoemde voorlopig diploma als scheepswerktuigkundige kan op zijn verzoek
      het diploma A als scheepswerktuigkundige worden uitgereikt als hij bij een mondeling onderzoek door de Commissie
      heeft blijk gegeven voldoende praktische kennis te bezitten van de electrotechniek, de scheepswerktuigkunde en
      hulpwerktuigen en de wettelijke bepalingen zoals ingevolge artikel 3 van de Wet op de Zeevaartdiploma's 1935
      (*Stb.* 456) is vereist voor toekenning van het diploma A.


      [ref1]: https://wetten.overheid.nl/BWBR0004216#Artikel10
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004216
        artikel: '10'
  - number: '9'
    text: >-
      Ter zake van de afgifte van een krachtens dit besluit uit te reiken diploma is een vergoeding verschuldigd volgens
      een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel9
  - number: '10'
    text: |-
      1 Bij zijn verzoek om uitreiking van het diploma, genoemd in [artikel 2, eerste lid][ref1], dient de kandidaat aan
      Onze Minister over te leggen:

      a. de bewijsstukken met betrekking tot opleiding en behaalde diensttijd;

      b. de bewijsstukken met betrekking tot het praktijkboek;

      c. een uittreksel uit het geboorteregister of, ten genoegen van Onze minister, een identiteitsbewijs;

      d. het bewijs van betaling van de in [artikel 9][ref2] bedoelde vergoeding en

      e. een goedgelijkende pasfoto, zwart-wit, in drievoud.

      2 Bij zijn verzoek om uitreiking van het diploma, genoemd in [artikel 8, eerste lid][ref3], dient de kandidaat aan
      Onze Minister over te leggen de in het eerste lid onder *a, c, d* en *e* genoemde bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004216#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004216#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004216#Artikel8
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004216
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004216
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0004216
        artikel: '8'
  - number: '11'
    text: >-
      Een duplikaat van een uitgereikt diploma wordt slechts afgegeven, indien de belanghebbende aannemelijk kan maken
      dat het oorspronkelijke diploma verloren is geraakt. Voor een duplikaat is, tenzij het oorspronkelijke diploma
      verloren is geraakt ten gevolge van een oorlogsdaad, een scheepsramp of een daarmee vergelijkbare omstandigheid,
      een vergoeding verschuldigd volgens een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel11
  - number: '12'
    text: >-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot en met 1 juni 1985.
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel12
  - number: '13'
    text: Dit besluit kan worden aangehaald als "Besluit bijzondere verkrijging diploma A als scheepswerktuigkundige".
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel13
