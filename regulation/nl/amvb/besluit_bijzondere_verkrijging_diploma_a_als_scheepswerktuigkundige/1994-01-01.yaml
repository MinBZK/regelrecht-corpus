preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat mede namens Onze Minister van Onderwijs en
    Wetenschappen a.i. van 10 augustus 1987, nr. S/J 31011/87, Directoraat-Generaal Scheepvaart en Maritieme Zaken;


    Gelet op artikel 2, derde lid, van de Wet op de Zeevaartdiploma's 1935 (Stb. 456);


    De Raad van State gehoord (advies van 27 augustus 1987, nr. W09.87.0377);


    Gezien het nader rapport van Onze Ministers van Verkeer en Waterstaat en van Onderwijs en Wetenschappen van 24
    september 1987, nr. S/J 31.586/87, Directoraat-Generaal Scheepvaart en Maritieme Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      1 De begripsbepalingen genoemd in artikel 1, eerste lid, van de Wet op de Zeevaartdiploma's 1935 (*Stb.* 456) zijn
      van toepassing.


      2 In dit besluit wordt verstaan onder:


      Onze Minister: Onze Minister van Verkeer en Waterstaat;


      school: middelbare dagschool voor scheepswerktuigkundigen, waaraan de opleiding ter verkrijging van het diploma A
      als scheepswerktuigkundige is verbonden;


      de Commissie: de in artikel 2, tweede lid, van het Examenreglement Zeevaartdiploma's (*Stb.* 1983, 452) genoemde
      Commissie;


      diensttijd: tijd doorgebracht als bemanningslid aan boord van een in de vaart zijnd schip.
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel1
  - number: '2'
    text: |-
      1 Aan degene die heeft voldaan aan de daarvoor bij of krachtens de [artikelen 3][ref1] en [10, eerste lid][ref2],
      van dit besluit gestelde voorwaarden wordt op zijn verzoek door Onze Minister het diploma A als
      scheepswerktuigkundige uitgereikt.

      2 Onze Minister stelt het model van het in het eerste lid genoemde diploma vast.


      [ref1]: https://wetten.overheid.nl/BWBR0004216#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004216#Artikel10
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004216
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004216
        artikel: '10'
  - number: '3'
    text: |-
      1 Ter verkrijging van het diploma, bedoeld in [artikel 2, eerste lid][ref1], dient de kandidaat:

      a. aan een school het eindexamen met goed gevolg te hebben afgelegd;

      b. daarna de in het tweede lid genoemde diensttijd te hebben behaald in de machinekamer van zeeschepen met een
      voortstuwingsvermogen van ten minste 750 kW, waarvan de hoofdwerktuigkundige ten minste in het bezit is van het
      diploma als motordrijver, gedurende welke diensttijd de kandidaat ten genoegen van de Commissie een praktijkboek
      moet hebben bijgehouden overeenkomstig het bepaalde in de [artikelen 4][ref2], [5][ref3], [6][ref4] en
      [7][ref5].

      2 De diensttijd, bedoeld in het eerste lid, onder *b*, bedraagt:

      a. ten minste een jaar, indien de kandidaat voorafgaand aan het met goed gevolg afleggen van het eindexamen minder
      dan een halfjaar dienst heeft gedaan in de machinekamer van zeeschepen;

      b. ten minste een halfjaar, indien de kandidaat voorafgaand aan het met goed gevolg afleggen van een eindexamen ten
      minste een halfjaar doch minder dan anderhalf jaar dienst heeft gedaan in de machinekamer van zeeschepen, met een
      voortstuwingsvermogen van ten minste 750 kW.

      3 Degene die voorafgaand aan het met goed gevolg afleggen van het eindexamen ten minste anderhalf jaar dienst
      heeft gedaan in de machinekamer van zeeschepen met een voortstuwingsvermogen van ten minste 750 kW, behoeft ter
      verkrijging van het diploma, bedoeld in [artikel 2, eerste lid][ref6], geen diensttijd als bedoeld in het eerste
      lid, onder *b*, te behalen.

      4 Onder dienst, bedoeld in het tweede en derde lid, is tot ten hoogste 30 dagen begrepen dienst in de machinekamer
      buitengaats als leerling aan boord van een ten behoeve van het onderwijs aan de school gebezigd opleidingsschip.

      5 Onze Minister kan, zo nodig onder nader te stellen voorschriften, diensttijd doorgebracht op andere schepen of
      op andere wijze dan bedoeld in het eerste lid, onder *b*, van dit artikel, voor de toepassing van de bepalingen van
      dit besluit aanmerken als geldige diensttijd, mits daarbij een vergelijkbare ervaring is opgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004216#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004216#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004216#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004216#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0004216#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0004216#Artikel2
    url: https://wetten.overheid.nl/BWBR0004216/1994-01-01#Artikel3
