preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 16 april
    2004, nr. MJZ2004039319, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op de artikelen 10.41 tot en met 10.43 en 10.44, derde lid, van de Wet milieubeheer, artikel 21.8 van de Wet
    milieubeheer voorzover het betreft de artikelen 8, 9 en 10, derde lid, en artikel 24 van de Wet milieugevaarlijke
    stoffen voorzover het betreft artikel 7;

    De Raad van State gehoord (advies van 28 juni 2004, nr W08.04.0159/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 1
    oktober 2004, nr. MJZ 2004093834, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
  - number: 1.a
    text: |-
      *de wet*: de [Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 1.b
    text: |-
      *afvalstoffenlijst*: afvalstoffenlijst als bedoeld in
      [artikel 1, eerste lid, van de Regeling Europese afvalstoffenlijst][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013546#Artikel1
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013546
        artikel: '1'
  - number: 1.c
    text: |-
      afvalstroomnummer: afvalstroomnummer als bedoeld in [artikel 9, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel9
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: '9'
        paragraaf: '4'
  - number: 1.d
    text: |-
      *meldingsinstantie*: instantie als bedoeld in de [artikelen 10.38, derde lid][ref1], en
      [10.40, eerste lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 1.e
    text: |-
      *route-inzameling*: inzameling van bedrijfsafvalstoffen of gevaarlijke afvalstoffen volgens een vooraf bepaalde
      route waarbij de afvalstoffen tijdens het vervoer worden samengevoegd met gelijksoortige afvalstoffen die worden
      afgegeven door verschillende personen;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
  - number: 1.f
    text: '*Raad voor Accreditatie:* Stichting Raad voor Accreditatie te Utrecht;'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
  - number: 1.g
    text: |-
      *regelmatige afvalstoffen:* afvalstoffen die regelmatig tijdens hetzelfde proces ontstaan en een constante
      samenstelling hebben;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
  - number: 1.h
    text: '*korrelvormige afvalstoffen:* afvalstoffen, niet zijnde monolithische afvalstoffen;'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
  - number: 1.i
    text: |-
      *monolithische afvalstoffen:* afvalstoffen die door menging met toeslagstoffen of andersoortige bewerkingen zijn
      omgevormd tot afvalstoffen met een beperkte uitloging en een duurzame vaste vorm;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
  - number: 1.j
    text: |-
      *schone kunststoffen:* kunststoffen of mengsels daarvan, mits deze niet zijn vermengd met andere afvalstoffen en
      zij overeenkomstig een specificatie zijn vervaardigd;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
  - number: 1.k
    text: |-
      *zeer zorgwekkende stof:* zeer zorgwekkende stof als bedoeld in
      [bijlage I bij het Besluit activiteiten leefomgeving][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041330
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0041330
  - number: '2.1'
    text: |-
      De in [artikel 10.40, eerste lid, van de wet][ref1] gestelde verplichting geldt niet:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 2.1.a
    text: |-
      indien voor bedrijfsafvalstoffen de afgifte geschiedt aan een andere persoon dan een persoon als
      bedoeld in [artikel 10.37, tweede lid, onder b, aanhef en onder 1°, van de wet][ref1] die een of meer
      milieubelastende activiteiten met afvalstoffen verricht die zijn aangewezen in [paragraaf 3.6.5][ref2],
      [3.7.1][ref3], [3.7.7][ref4], [3.8.1][ref5], [3.2.14][ref6], [3.2.15][ref7], [3.3.10][ref8], [3.3.12][ref9],
      [3.3.13][ref10] of [3.6.8][ref11] voor zover het gaat om het vergisten van plantaardig materiaal of
      [afdeling 3.5 van het Besluit activiteiten leefomgeving][ref12],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Paragraaf3.6.5
      [ref3]: https://wetten.overheid.nl/BWBR0041330#Paragraaf3.7.1
      [ref4]: https://wetten.overheid.nl/BWBR0041330#Paragraaf3.7.7
      [ref5]: https://wetten.overheid.nl/BWBR0041330#Paragraaf3.8.1
      [ref6]: https://wetten.overheid.nl/BWBR0041330#Paragraaf3.2.14
      [ref7]: https://wetten.overheid.nl/BWBR0041330#Paragraaf3.2.15
      [ref8]: https://wetten.overheid.nl/BWBR0041330#Paragraaf3.3.10
      [ref9]: https://wetten.overheid.nl/BWBR0041330#Paragraaf3.3.12
      [ref10]: https://wetten.overheid.nl/BWBR0041330#Paragraaf3.3.13
      [ref11]: https://wetten.overheid.nl/BWBR0041330#Paragraaf3.6.8
      [ref12]: https://wetten.overheid.nl/BWBR0041330#Afdeling3.5
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0041330
