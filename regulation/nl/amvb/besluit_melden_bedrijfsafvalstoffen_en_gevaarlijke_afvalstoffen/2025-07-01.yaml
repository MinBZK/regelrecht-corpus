        bwb_id: BWBR0041330
        paragraaf: 3.8.1
      - id: ref6
        bwb_id: BWBR0041330
        paragraaf: 3.2.14
      - id: ref7
        bwb_id: BWBR0041330
        paragraaf: 3.2.15
      - id: ref8
        bwb_id: BWBR0041330
        paragraaf: 3.3.10
      - id: ref9
        bwb_id: BWBR0041330
        paragraaf: 3.3.12
      - id: ref10
        bwb_id: BWBR0041330
        paragraaf: 3.3.13
      - id: ref11
