        paragraaf: 3.6.8
      - id: ref12
        bwb_id: BWBR0041330
        afdeling: '3.5'
  - number: 2.1.b
    text: |-
      indien voor bedrijfsafvalstoffen de persoon aan wie de afvalstoffen zijn afgegeven, op de locatie van die persoon
      uitsluitend milieubelastende activiteiten met afvalstoffen verricht die behoren tot een in [bijlage I][ref1] bij
      dit besluit aangegeven categorie of een combinatie van die categorieën,


      [ref1]: https://wetten.overheid.nl/BWBR0017294
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017294
  - number: 2.1.c
    text: |-
      voor gevaarlijke afvalstoffen, indien de afgifte geschiedt aan een andere persoon dan een persoon als bedoeld in
      [artikel 10.37, tweede lid, onder b, van de wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 2.1.d
    text: |-
      voor zover de afgifte betrekking heeft op afvalstoffen, die behoren tot een in [bijlage II][ref1] bij dit besluit
      aangegeven categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0017294
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017294
  - number: '2.2'
    text: |-
      Een persoon als bedoeld in [artikel 10.40, eerste lid, van de wet][ref1] voor wie de in dat lid gestelde
      verplichting ingevolge dit besluit niet geldt, registreert de in dat lid bedoelde gegevens op een zodanige wijze
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 2.2.a
    text: |-
      controle daarvan door degenen die belast zijn met het toezicht op de naleving van de wet binnen een redelijke
      termijn mogelijk is, en
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel2
  - number: 2.2.b
    text: deze gedurende ten minste vijf jaar zijn te raadplegen.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel2
  - number: '2.3'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de wijze van registreren.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel2
  - number: '3.1'
    text: |-
      Aan [artikel 10.40, eerste lid, aanhef en onder b, van de wet][ref1] wordt uitvoering gegeven door het melden
      van de naam en het adres van degene aan wie met het oog op de desbetreffende afgifte een afvalstroomnummer is
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '3.2'
    text: |-
      Degene die een melding als bedoeld in [artikel 10.40, eerste lid, van de wet][ref1] doet, meldt daarbij tevens
      de van toepassing zijnde code van de afvalstoffenlijst en het voor de ontvangst van de afvalstoffen verstrekte
      afvalstroomnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '3.3'
    text: |-
      De in [artikel 10.40, eerste lid, aanhef en onder d, van de wet][ref1] gestelde verplichting geldt niet in de
      categorieën van gevallen waarin het betreft de afgifte van:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 3.3.a
    text: door route-inzameling verkregen afvalstoffen, of
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel3
  - number: 3.3.b
    text: door inzameling verkregen afvalstoffen die behoren tot een door Onze Minister aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel3
  - number: '3.4'
    text: |-
      De in [artikel 10.40, eerste lid, aanhef en onder f, van de wet][ref1] gestelde verplichting geldt niet voor een
      andere categorie van gevallen dan die waarin de afgifte geschiedt door tussenkomst van een ander die opdracht had
      de bedrijfsafvalstoffen in te zamelen en naar hem te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '3.5'
    text: |-
      De melding, bedoeld in [artikel 10.40, eerste lid, van de wet][ref1] geschiedt:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 3.5.a
    text: binnen vier weken na afloop van de maand waarin een afgifte heeft plaatsgevonden, en
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel3
  - number: 3.5.b
    text: langs elektronische weg of schriftelijk.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel3
  - number: '3.6'
    text: |-
      Degene die een melding als bedoeld in [artikel 10.40, eerste lid, van de wet][ref1] doet, bewaart gedurende ten
      minste vijf jaar de begeleidingsbrieven of de elektronische versie hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '3.7'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de ingevolge
      [artikel 10.40, eerste lid, van de wet][ref1] en dit besluit te melden gegevens en de wijze waarop de melding wordt
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '4'
    text: |-
      In de categorieën van gevallen waarin de ingevolge
      __REF000___________________________________________________________________________________________________________
      ______________________ en [artikel 3][ref2] te melden gegevens reeds aan de meldingsinstantie zijn gemeld en deze
      gegevens niet zijn gewijzigd, wordt, zolang het voor de ontvangst van de afvalstoffen verstrekte afvalstroomnummer
      niet is vervallen, aan [artikel 10.40, eerste lid, van de wet][ref3] uitvoering gegeven door het melden van de
      gegevens over een vervoerder, indien het vervoer van gevaarlijke stoffen betreft, het afvalstroomnummer, het aantal
      afgiften en de totale hoeveelheid afvalstoffen die met het afvalstroomnummer in de voorafgaande maand in ontvangst
      zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017294#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0017294
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '5.1'
    text: |-
      De in [artikel 10.38, derde lid, van de wet][ref1] gestelde verplichting geldt niet voor andere dan de ingevolge
      het tweede lid aangewezen categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '5.2'
    text: |-
      Als categorieën van gevallen waarin de in [artikel 10.38, derde lid, van de wet][ref1] gestelde verplichting
      geldt, worden aangewezen de categorieën van gevallen waarin de afgifte geschiedt door een persoon die op grond van
      [artikel 2, eerste lid][ref2], verplicht is om een melding te doen als bedoeld in [artikel 10.40 van de wet][ref3],
      aan een persoon als bedoeld in [artikel 10.37, tweede lid, onder a of b, van de wet][ref4] die niet verplicht is
      tot het doen van een melding als bedoeld in artikel 10.40 van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017294#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0017294
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '5.3'
    text: |-
      Bij regeling van Onze Minister kunnen gevallen worden aangewezen die zijn vrijgesteld van de verplichting, bedoeld
      in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel5
  - number: 5a.1
    text: |-
      [Artikel 10.38, derde lid, van de wet][ref1] is van overeenkomstige toepassing in de categorieën van gevallen
      waarin een persoon als bedoeld in [artikel 10.37, tweede lid, onder b, van de wet][ref2] gevaarlijke afvalstoffen
      op de locatie waar deze zijn ontstaan nuttig toepast of verwijdert.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 5a.2
    text: |-
      In de categorieën van gevallen, bedoeld in het eerste lid, is [artikel 6][ref1] van overeenkomstige toepassing,
      met dien verstande dat in die gevallen geen afgifte wordt gemeld maar het nuttig toepassen of verwijderen van de
      gevaarlijke afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel6
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: '6'
        paragraaf: '3'
  - number: 5a.3
    text: |-
      Dit artikel berust op [artikel 9.5.2, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '6.1'
    text: |-
      Aan [artikel 10.38, derde lid, van de wet][ref1] in verbinding met het eerste lid, onder a, van dat artikel wordt
      uitvoering gegeven door het melden van het aantal afgiften dat in de voorafgaande maand heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '6.2'
    text: |-
      Aan [artikel 10.38, derde lid, van de wet][ref1] in verbinding met het eerste lid, onder c, van dat artikel wordt,
      voorzover het betreft de hoeveelheid, uitvoering gegeven door het melden van de totale hoeveelheid afvalstoffen
      waarvan de afgifte in de voorafgaande maand heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '6.3'
    text: |-
      Degene die een melding als bedoeld in [artikel 10.38, derde lid, van de wet][ref1] doet, meldt daarbij tevens de
      van toepassing zijnde code van de afvalstoffenlijst.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '6.4'
    text: |-
      [Artikel 3, vijfde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel3
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: '3'
        paragraaf: '2'
  - number: 6a
    text: |-
      Deze paragraaf berust op [artikel 9.2.2.1, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '7.1'
    text: |-
      [Artikel 10.38, derde lid, van de wet][ref1] is van overeenkomstige toepassing in de categorieën van gevallen
      waarin een persoon die op grond van [artikel 2, eerste lid][ref2], verplicht is om een melding te doen als bedoeld
      in [artikel 10.40 van de wet][ref3] zich van stoffen, mengsels en producten, niet zijnde bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen, ontdoet door afgifte aan een ander persoon of deze toepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017294#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0017294
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '7.2'
    text: |-
      In de categorieën van gevallen, bedoeld in het eerste lid, zijn de [artikelen 3, vijfde lid][ref1], en
      [6, eerste tot en met derde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017294#Artikel6
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017294
        artikel: '6'
        paragraaf: '3'
  - number: '7.3'
    text: |-
      Voor zover geen code van de afvalstoffenlijst van toepassing is wordt aan [artikel 6, derde lid][ref1], uitvoering
      gegeven door melding van de van toepassing zijnde code van de gecombineerde nomenclatuur, bedoeld in artikel
      1, eerste lid, van verordening nr. 2658/87/EEG van de Raad van de Europese Gemeenschappen van 23 juli 1987 met
      betrekking tot de tarief- en statistieknomenclatuur en het gemeenschappelijk douanetarief (PbEG L 256).


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel6
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: '6'
        paragraaf: '3'
  - number: 7a.1
    text: |-
      Elke leverancier van een voorwerp als bedoeld in artikel 3, onderdeel 33, van de EG-verordening registratie,
      evaluatie en autorisatie van chemische stoffen, verstrekt de informatie, bedoeld in artikel 33, eerste lid, van
      deze verordening, aan het Europees Agentschap voor chemische stoffen.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel7a
  - number: 7a.2
    text: |-
      Het eerste lid is niet van toepassing op leveranciers van voorwerpen als bedoeld op de lijst met producttypen van
      wapens, munitie en oorlogsmateriaal, vastgesteld bij Besluit 255/58 van de Raad van 15 april 1958, die zijn bedoeld
      ten dienste van defensiebelangen van Nederland of op die voorwerpen die daarvoor in gebruik zijn geweest.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel7a
  - number: 7a.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel7a
  - number: '8.1'
    text: |-
      Degene voor wie de in [artikel 10.40, eerste lid, van de wet][ref1] gestelde verplichting geldt, verstrekt een
      afvalstroomnummer:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 8.1.a
    text: |-
      indien de afvalstoffen aan hem worden afgegeven door een persoon die krachtens [artikel 10.45][ref1] of
      [10.48 van de wet][ref2] bevoegd is zodanige afvalstoffen in te zamelen en deze rechtstreeks naar hem vervoert: aan
      de persoon bij wie de afvalstoffen worden ingezameld;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 8.1.b
    text: 'in andere gevallen: aan degene die zich van de afvalstoffen ontdoet.'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel8
  - number: '8.2'
    text: |-
      De in het eerste lid gestelde verplichting geldt niet voor een in de aanhef van dat lid bedoelde persoon, in
      de categorieën van gevallen waarin het de afgifte van door route-inzameling verkregen bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen die behoren tot een in [bijlage III][ref1] bij dit besluit aangegeven categorie, of de
      afgifte van door inzameling verkregen afvalstoffen als bedoeld in [artikel 3, derde lid, onder b][ref2], betreft
      en hij voorafgaand aan de route-inzameling onderscheidenlijk de inzameling een afvalstroomnummer aan degene die
      zodanige afvalstoffen inzamelt, heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0017294
      [ref2]: https://wetten.overheid.nl/BWBR0017294#Artikel3
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017294
      - id: ref2
        bwb_id: BWBR0017294
        artikel: '3'
        paragraaf: '2'
  - number: '8.3'
    text: |-
      Degene die door een inzameling als bedoeld in het tweede lid bedrijfsafvalstoffen of gevaarlijke afvalstoffen
      in ontvangst neemt en aan wie met toepassing van het tweede lid een afvalstroomnummer is verstrekt, deelt dat
      afvalstroomnummer mede aan degene die zich van de afvalstoffen ontdoet.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel8
  - number: '9.1'
    text: 'Het afvalstroomnummer bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel9
  - number: 9.1.a
    text: |-
      een voor de persoon die de afvalstoffen in ontvangst neemt, uniek nummer dat aan hem door de meldingsinstantie is
      verstrekt, en
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel9
  - number: 9.1.b
    text: een nummer dat de persoon die de afvalstoffen in ontvangst neemt, vaststelt.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel9
  - number: '9.2'
    text: |-
      De meldingsinstantie verstrekt op verzoek van een persoon die krachtens [artikel 2][ref1] verplicht is om melding
      te maken van aan hem afgegeven afvalstoffen onverwijld een nummer als bedoeld in het eerste lid, onder a. De
      meldingsinstantie kan het nummer intrekken als de persoon ingevolge artikel 2 niet langer verplicht is tot het
      melden van de aan hem afgegeven afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel2
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: '2'
        paragraaf: '2'
  - number: '9.3'
    text: |-
      Een afvalstroomnummer vervalt indien gedurende vijf jaar geen melding van de ontvangst van afvalstoffen met
      gebruikmaking van dat nummer heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel9
  - number: '10.1'
    text: |-
      De in [artikel 10.39, eerste lid, onder a, van de wet][ref1] gestelde verplichting geldt niet
      voor de categorieën van gevallen waarin de afgifte betrekking heeft op afvalstoffen als bedoeld in
      [artikel 2, eerste lid, onder d][ref2], en niet geschiedt aan een persoon die een stortplaats als bedoeld in
      [bijlage I bij het Besluit activiteiten leefomgeving][ref3] exploiteert om die afvalstoffen te laten storten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017294#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0041330
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0017294
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0041330
  - number: '10.2'
    text: |-
      Degene die een omschrijving als bedoeld in [artikel 10.39, eerste lid, onder a, van de wet][ref1] verstrekt,
      vermeldt daarbij ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 10.2.a
    text: de van toepassing zijnde code van de afvalstoffenlijst;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: 10.2.b
    text: 'de benaming van de zeer zorgwekkende stoffen:'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: 10.2.b.1°
    text: |-
      zoals opgenomen in een voor hem geldende omgevingsvergunning voor een milieubelastende activiteit als bedoeld in
      [artikel 5.1, tweede lid, aanhef en onder b, van de Omgevingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 10.2.b.2°
    text: |-
      zoals opgenomen in de informatie die hij op grond van [artikel 5.23 van het Besluit activiteiten leefomgeving][ref1]
      heeft verstrekt over de emissies van die stoffen in de lucht of het water; of


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel5
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '5'
  - number: 10.2.b.3°
    text: |-
      die vermeld staan in de omschrijving die hem op grond van [artikel 10.39, eerste lid, onder a, van de wet][ref1] is
      verstrekt toen hij de afvalstof in ontvangst nam.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '10.3'
    text: |-
      Een omschrijving die wordt verstrekt in gevallen waarin korrelvormige afvalstoffen aan een persoon die een
      stortplaats als bedoeld in [bijlage I bij het Besluit activiteiten leefomgeving][ref1] exploiteert, worden
      afgegeven om te worden gestort, bevat tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0041330
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0041330
  - number: 10.3.a
    text: gegevens over de bron en oorsprong van de afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: 10.3.b
    text: |-
      gegevens over het proces waarbij de afvalstoffen zijn ontstaan, bestaande uit een beschrijving en de kenmerken van
      grondstoffen en producten;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: 10.3.c
    text: |-
      een beschrijving van de behandeling van de afvalstoffen die is toegepast of, bij het ontbreken daarvan, een
      motivering waarom geen behandeling is toegepast;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: 10.3.d
    text: 'indien van toepassing: gegevens over het uitlooggedrag van de afvalstoffen;'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: 10.3.e
    text: |-
      gegevens over de eigenschappen van de afvalstoffen die specifiek van belang zijn voor het zo nodig treffen van
      aanvullende voorzorgsmaatregelen op de plaats waarop de afvalstoffen zullen worden gestort;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: 10.3.f
    text: |-
      voor zover het gevaarlijke afvalstoffen betreft waarop
      [artikel 4, eerste lid, van de Regeling Europese afvalstoffenlijst][ref1] van toepassing is, een vermelding van de
      in het tweede lid van dat artikel bedoelde eigenschappen die de afvalstoffen bezitten;


      [ref1]: https://wetten.overheid.nl/BWBR0013546#Artikel4
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013546
        artikel: '4'
  - number: 10.3.g
    text: |-
      gegevens over de resultaten van de ter bepaling van de samenstelling en het uitlooggedrag van de afvalstoffen
      uitgevoerde analyse of, bij het ontbreken daarvan, een motivering of gegevens waaruit blijkt dat er geen
      verplichting bestaat tot het uitvoeren van een zodanige analyse.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: '10.4'
    text: |-
      Onverminderd het derde lid bevat een omschrijving die wordt verstrekt in gevallen waarin korrelvormige, regelmatige
      afvalstoffen aan een persoon als bedoeld in dat lid worden afgegeven om te worden gestort tevens:
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: 10.4.a
    text: gegevens over de spreiding in de samenstelling van de afzonderlijke afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: 10.4.b
    text: gegevens over de spreiding en variabiliteit van de specifieke eigenschappen van de afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: 10.4.c
    text: |-
      indien de afvalstoffen tijdens hetzelfde proces in verschillende installaties ontstaan: het aantal keren dat per
      installatie analyses als bedoeld in het derde lid zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: '10.5'
    text: |-
      Degene die ten behoeve van het verstrekken van een omschrijving gebruik maakt van schriftelijk of elektronisch
      vastgelegde gegevens omtrent aard, eigenschappen en samenstelling van de afvalstoffen, bewaart deze gegevens
      gedurende ten minste vijf jaar na de laatste afgifte van afvalstoffen waarop die omschrijving betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: '10.6'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het verstrekken van een
      omschrijving.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10
  - number: 10a.1
    text: |-
      Degene die een omschrijving verstrekt in gevallen als bedoeld in [artikel 10, derde lid][ref1], draagt er zorg
      voor dat ter bepaling van de in de omschrijving op te nemen gegevens over de samenstelling en het uitlooggedrag
      van afvalstoffen, monsters van de betrokken afvalstoffen worden genomen, die monsters worden geanalyseerd en dat
      daaromtrent gegevens worden geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: '10'
        paragraaf: '5'
  - number: 10a.2
    text: 'De in het eerste lid gestelde verplichting geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: 10a.2.a
    text: |-
      afvalstoffen die voldoen aan de beschrijving die is opgenomen in
      [tabel 1.1 van het Besluit stortplaatsen en stortverboden afvalstoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009094
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009094
  - number: 10a.2.b
    text: |-
      gevaarlijke afvalstoffen die hechtgebonden asbest of door een bindmiddel gebonden asbest of in kunststof verpakte
      asbestvezels bevatten, en die geen andere gevaarlijke stoffen dan asbest bevatten;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: 10a.2.c
    text: |-
      niet-gevaarlijke afvalstoffen die worden aangeboden op een stortplaats voor niet-gevaarlijke afvalstoffen en niet
      in eenzelfde cel worden gestort als stabiele, niet-reactieve gevaarlijke afvalstoffen of gipsafval;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: 10a.2.d
    text: afvalstoffen die uitsluitend bestaan uit deeltjes met een korrelgrootte van meer dan 40 millimeter;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: 10a.2.e
    text: afvalstoffen waarvan de uitloogbaarheid en samenstelling bekend zijn;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: 10a.2.f
    text: |-
      afvalstoffen ten aanzien waarvan het technisch niet mogelijk deze te testen of te onderwerpen aan passende
      testmethoden;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: 10a.2.g
    text: afvalstoffen, behorende tot een categorie die krachtens het vijfde lid, onder b, is aangewezen.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: 10a.3
    text: |-
      De monsterneming, bedoeld in het eerste lid, wordt uitgevoerd door een persoon of instelling die beschikt over een
      erkenning als bedoeld in [artikel 12b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12b
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: 12b
        paragraaf: 6a
  - number: 10a.4
    text: |-
      De analyse van de monsters wordt uitgevoerd door een persoon of instelling die beschikt over een bewijs waarmee
      de Raad voor Accreditatie of een daaraan gelijkwaardig instituut in een andere lidstaat van de Europese Unie dan
      wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede
      daartoe strekkend verdrag dat Nederland bindt, kenbaar heeft gemaakt dat gedurende de periode waarin deze worden
      uitgevoerd, een gerechtvaardigd vertrouwen bestaat dat de betrokken persoon of instelling competent is voor het
      uitvoeren van de analyse overeenkomstig de krachtens het vijfde lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: 10a.5
    text: 'Bij regeling van Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: 10a.5.a
    text: |-
      worden nadere regels gesteld omtrent de monsterneming, de analyse van monsters en de registratie, bedoeld in het
      eerste lid;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: 10a.5.b
    text: |-
      kunnen categorieën van afvalstoffen worden aangewezen die in ieder geval worden aangemerkt als categorieën
      van afvalstoffen waarvan het uitlooggedrag en de samenstelling algemeen bekend zijn of ten aanzien waarvan het
      technisch niet mogelijk is deze te testen of te onderwerpen aan passende testmethoden.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: 10a.6
    text: Het is verboden te doen handelen in strijd met het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel10a
  - number: '11.1'
    text: |-
      De in de [artikelen 10.39, eerste lid, onder b][ref1], en [10.44, eerste en tweede lid, van de wet][ref2] gestelde
      verplichtingen gelden niet voor het vervoer van:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 11.1.a
    text: |-
      bedrijfsafvalstoffen of gevaarlijke afvalstoffen, waarop de [EG-verordening overbrenging van afvalstoffen][ref1]
      van toepassing is, dat vergezeld gaat van de begeleidende documenten, bedoeld in die verordening;


      [ref1]: https://wetten.overheid.nl/BWBR0022213
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022213
  - number: 11.1.b
    text: bedrijfsafvalstoffen of gevaarlijke afvalstoffen in een motorrijtuig van de rijbewijscategorie B;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel11
  - number: 11.1.c
    text: |-
      bedrijfsafvalstoffen in een hoeveelheid van niet meer dan 500 kilogram op een andere wijze dan in een motorrijtuig
      van de rijbewijscategorie B;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel11
  - number: 11.1.d
    text: niet-beroepsmatig ingezameld papier of textiel;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel11
  - number: 11.1.e
    text: |-
      ingezamelde huishoudelijke afvalstoffen waarvan kan worden aangetoond dat deze rechtstreeks worden vervoerd naar
      een locatie waar die afvalstoffen uitsluitend worden overgeslagen;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel11
  - number: 11.1.f
    text: |-
      bedrijfsafvalstoffen naar soort en aard vergelijkbaar met huishoudelijke afvalstoffen waarvan kan worden
      aangetoond dat deze rechtstreeks worden vervoerd naar een locatie waar die bedrijfsafvalstoffen uitsluitend worden
      overgeslagen;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel11
  - number: 11.1.g
    text: |-
      veegvuil, marktafval, drijfafval en RKG-slib waarvan kan worden aangetoond dat deze rechtstreeks worden vervoerd
      naar een locatie waar die bedrijfsafvalstoffen uitsluitend worden overgeslagen.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel11
  - number: '11.2'
    text: |-
      De in [artikel 10.39, eerste lid, onder b, van de wet][ref1] gestelde verplichting geldt evenmin in de
      categorieën van gevallen waarin afvalstoffen worden afgegeven aan een persoon die de afvalstoffen door
      route-inzameling verkrijgt of door inzameling verkrijgt ingeval de afvalstoffen behoren tot een krachtens
      [artikel 3, derde lid, onder b][ref2], aangewezen categorie, en het op de afvalstoffen betrekking hebbende
      afvalstroomnummer met toepassing van [artikel 8, derde lid][ref3], aan hem is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017294#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0017294#Artikel8
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0017294
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017294
        artikel: '8'
        paragraaf: '4'
  - number: '12.1'
    text: |-
      Onverminderd het tweede lid wordt voor de begeleidingsbrief, bedoeld in
      [artikel 10.39, eerste lid, onder b, van de wet][ref1] gebruik gemaakt van een bij regeling van Onze Minister
      vastgesteld formulier dat voor de daarbij aangegeven categorieën van gevallen verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '12.2'
    text: |-
      Onze Minister kan toestemming geven om gebruik te maken van een andere gegevensdrager dan een formulier als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12
  - number: '12.3'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de toepassing van het eerste
      lid. Tevens kunnen daarbij categorieën van gevallen worden aangewezen waarvoor de verplichting, bedoeld in het
      eerste lid, niet geldt.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12
  - number: 12a.1
    text: |-
      In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder: - *accreditatie:* het bewijs
      waarmee de Raad voor Accreditatie of een daaraan gelijkwaardig instituut in een andere lidstaat van de
      Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe
      strekkend of mede daartoe strekkend verdrag dat Nederland bindt, kenbaar maakt dat gedurende een bepaalde
      periode een gerechtvaardigd vertrouwen bestaat dat de hierin genoemde instelling competent is voor het
      certificeren van personen of instellingen voor het uitvoeren van de monsterneming overeenkomstig de krachtens
      [artikel 10a, vijfde lid, onder a][ref1], gestelde regels;
        - *certificaat:* verklaring waarmee een geaccrediteerde certificeringsinstelling kenbaar maakt dat gedurende een
      bepaalde periode een gerechtvaardigd vertrouwen bestaat dat de hierin genoemde persoon of instelling competent
      is voor het uitvoeren van de monsterneming overeenkomstig de krachtens [artikel 10a, vijfde lid, onder a][ref2],
      gestelde regels;
        - *erkenning:* beschikking van Onze Minister waarbij wordt vastgesteld dat een persoon of instelling voor het nemen
      van monsters van afvalstoffen voldoet aan de bij of krachtens deze paragraaf gestelde eisen;
        - *SIKB:* Stichting Kwaliteitsborging Infrastructuur Bodembeheer te Gouda;
        - *vestigingsplaats:* adres en woonplaats van een persoon of adres en woonplaats waar een instelling zetelt.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0017294#Artikel10a
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: 10a
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0017294
        artikel: 10a
        paragraaf: '5'
  - number: 12a.2
    text: |-
      Deze paragraaf is uitsluitend van toepassing op monsterneming die wordt uitgevoerd ter bepaling van de in de
      omschrijving op te nemen gegevens over de samenstelling en het uitlooggedrag van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12a
  - number: 12b.1
    text: |-
      Onze Minister kan op aanvraag een erkenning verlenen aan een persoon of een instelling voor het nemen van monsters
      van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12b
  - number: 12b.2
    text: |-
      De beschikking vermeldt ten minste de naam van de persoon of instelling, de vestigingsplaats en, indien van
      toepassing, de naam van de natuurlijk persoon die voor de erkende persoon of instelling de monsterneming van
      afvalstoffen uitvoert.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12b
  - number: 12b.3
    text: Een erkenning wordt voor onbepaalde tijd verleend.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12b
  - number: 12b.4
    text: |-
      Onze Minister stelt een lijst met erkende personen en instellingen beschikbaar via een bij regeling van Onze
      Minister aangewezen website.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12b
  - number: 12b.5
    text: Een erkenning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12b
  - number: 12c.1
    text: |-
      Een aanvraag voor een erkenning wordt door middel van een bij regeling van Onze Minister vastgesteld formulier,
      ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12c
  - number: 12c.2
    text: 'Bij de aanvraag worden ten minste de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12c
  - number: 12c.2.a
    text: de naam en het adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12c
  - number: 12c.2.b
    text: het certificaat voor de monsterneming;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12c
  - number: 12c.2.c
    text: de vestigingsplaats van de persoon of instelling;
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12c
  - number: 12c.2.d
    text: |-
      indien van toepassing, de naam en een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], die niet ouder is dan zes maanden, van de
      natuurlijk persoon, bedoeld in [artikel 12b, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0017294#Artikel12b
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0017294
        artikel: 12b
        paragraaf: 6a
  - number: 12c.3
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de in het tweede lid bedoelde
      gegevens.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12c
  - number: 12d.1
    text: Onze Minister beslist binnen acht weken na de datum van ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12d
  - number: 12d.2
    text: 'Onze Minister verleent de erkenning geheel of gedeeltelijk indien de desbetreffende persoon of instelling:'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12d
  - number: 12d.2.a
    text: niet in staat van faillissement of surseance van betaling verkeert en
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12d
  - number: 12d.2.b
    text: |-
      heeft voldaan aan [artikel 12c, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12c
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: 12c
        paragraaf: 6a
  - number: 12d.3
    text: De erkenning wordt gebaseerd op een certificaat.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12d
  - number: 12d.4
    text: |-
      Een erkenning kan geheel of gedeeltelijk worden geweigerd indien de desbetreffende persoon of
      instelling of een bestuurder van deze persoon of instelling, in de drie jaar voorafgaande aan de
      aanvraag een wettelijk voorschrift heeft overtreden dat is gesteld bij of krachtens deze paragraaf of
      [artikel 225 van het Wetboek van Strafrecht][ref1], voor zover de overtreding verband houdt met het nemen van
      monsters van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
  - number: 12e.1
    text: |-
      Op verzoek van de erkende persoon of instelling kan de erkenning worden gewijzigd. [Artikel 12b, vierde lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12b
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: 12b
        paragraaf: 6a
  - number: 12e.2
    text: |-
      Het verzoek wordt, door middel van een bij regeling van Onze Minister vastgesteld formulier, ingediend bij Onze
      Minister. [Artikel 12c, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12c
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: 12c
        paragraaf: 6a
  - number: 12e.3
    text: |-
      Onze Minister beslist binnen vier weken na de datum van ontvangst van het verzoek.
      [Artikel 12d, tweede en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12d
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: 12d
        paragraaf: 6a
  - number: 12f.1
    text: |-
      Met een verklaring omtrent het gedrag als bedoeld in [artikel 12c, tweede lid, onder d][ref1], wordt gelijkgesteld
      een verklaring omtrent het gedrag afgegeven door een daartoe bevoegde instantie in een andere lidstaat van de
      Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe
      strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of documenten die
      een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de nationale
      onderzoekingen of documenten wordt geboden, mits die verklaring niet ouder is dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12c
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: 12c
        paragraaf: 6a
  - number: 12f.2
    text: |-
      Met een certificaat wordt gelijkgesteld een certificaat afgegeven door een daartoe bevoegde instantie in een andere
      lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of
      documenten die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de
      nationale onderzoekingen of documenten wordt geboden.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12f
  - number: 12f.3
    text: |-
      Met een erkenning wordt gelijkgesteld een erkenning of vergelijkbare beschikking afgegeven door een daartoe
      bevoegde instantie in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van
      de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op
      basis van voorwaarden die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau
      dat met de in [artikel 12c, tweede lid][ref1], gestelde eisen wordt geboden. De [artikelen 12b, vierde lid][ref2],
      en [12l][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0017294#Artikel12b
      [ref3]: https://wetten.overheid.nl/BWBR0017294#Artikel12l
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: 12c
        paragraaf: 6a
      - id: ref2
        bwb_id: BWBR0017294
        artikel: 12b
        paragraaf: 6a
      - id: ref3
        bwb_id: BWBR0017294
        artikel: 12l
        paragraaf: 6a
  - number: 12g.1
    text: Het is verboden monsters van afvalstoffen te nemen zonder daartoe verleende erkenning.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12g
  - number: 12g.2
    text: De monsters kunnen worden genomen door een natuurlijk persoon die staat vermeld op de erkenning.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12g
  - number: 12g.3
    text: |-
      Het bepaalde in het eerste en tweede lid geldt niet voor zover de werkzaamheid wordt uitgevoerd voor het verkrijgen
      van een certificaat.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12g
  - number: 12h
    text: |-
      Het is een persoon of instelling verboden een resultaat van een monsterneming van afvalstoffen te gebruiken of
      aan een ander ter beschikking te stellen indien hij weet of redelijkerwijs had kunnen vermoeden dat dit resultaat,
      gelet op het doel waarvoor dit wordt gebruikt, geen betrouwbaar beeld verschaft van de eigenschappen, aard,
      hoedanigheid of samenstelling van de afvalstof.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12h
  - number: 12i
    text: |-
      De houder van een erkenning meldt onverwijld aan een door Onze Minister aangewezen instantie zijn door de rechtbank
      uitgesproken faillissement of surseance van betaling. De melding geschiedt door middel van een bij regeling van
      Onze Minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12i
  - number: 12j
    text: |-
      Een certificeringsinstelling meldt een schorsing of intrekking van een certificaat voor de monsterneming onverwijld
      aan een door Onze Minister aangewezen instantie. De melding geschiedt door middel van een bij regeling van Onze
      Minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12j
  - number: 12k.1
    text: 'Onze Minister kan een erkenning geheel of gedeeltelijk intrekken:'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12k
  - number: 12k.1.a
    text: op verzoek van de erkende persoon of instelling,
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12k
  - number: 12k.1.b
    text: |-
      indien bij de aanvraag onjuiste of onvolledige gegevens zijn verstrekt, en kennis omtrent de juiste en volledige
      gegevens tot een andere beslissing zou hebben geleid,
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12k
  - number: 12k.1.c
    text: indien het bewijs van certificatie voor de monsterneming is ingetrokken of niet meer geldig is,
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12k
  - number: 12k.1.d
    text: |-
      indien de erkende persoon of instelling in staat van faillissement verkeert of surseance van betaling heeft
      verkregen, of
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12k
  - number: 12k.1.e
    text: |-
      indien de erkende persoon of instelling of de natuurlijk persoon, bedoeld in [artikel 12b, tweede lid,][ref1]
      een wettelijk voorschrift heeft overtreden dat is gesteld bij of krachtens deze paragraaf of
      [artikel 225 van het Wetboek van Strafrecht][ref2], voor zover de overtreding verband houdt met de monsterneming
      van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12k
    references:
      - id: ref1
        bwb_id: BWBR0017294
        artikel: 12b
        paragraaf: 6a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '225'
  - number: 12k.2
    text: 'Onze Minister kan een erkenning voor een periode van ten hoogste twee jaar geheel of gedeeltelijk schorsen, indien:'
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12k
  - number: 12k.2.a
    text: het bewijs van certificatie voor de desbetreffende werkzaamheid is geschorst, of
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12k
  - number: 12k.2.b
    text: sprake is van een overtreding als bedoeld in het eerste lid, onder e.
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12k
  - number: 12k.3
    text: |-
      In geval van aanwijzingen dat er sprake is van een overtreding als bedoeld in het eerste lid, onder e, kan Onze
      Minister de desbetreffende persoon of instelling verzoeken binnen een redelijke termijn een verklaring omtrent
      het gedrag als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] over te leggen,
      die niet ouder is dan twee maanden. Indien de desbetreffende persoon of instelling niet binnen de gestelde termijn
      aan dit verzoek voldoet of kan voldoen, kan Onze Minister de erkenning voor een periode van ten hoogste twee jaar
      geheel of gedeeltelijk schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12k
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 12l
    text: |-
      Onze Minister verwerkt de schorsing en intrekking van de erkenning in de lijst, bedoeld in
      [artikel 12b, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12b
    url: https://wetten.overheid.nl/BWBR0017294/2025-07-01#Artikel12l
    references:
      - id: ref1
