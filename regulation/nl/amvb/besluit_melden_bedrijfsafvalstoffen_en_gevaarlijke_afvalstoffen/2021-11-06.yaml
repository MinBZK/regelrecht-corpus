  - number: '9'
    text: |-
      1 Het afvalstroomnummer bestaat uit:

      a. een voor de persoon die de afvalstoffen in ontvangst neemt, uniek nummer dat aan hem door de meldingsinstantie
      is verstrekt, en

      b. een nummer dat de persoon die de afvalstoffen in ontvangst neemt, vaststelt.

      2 De meldingsinstantie verstrekt op verzoek van een persoon die krachtens [artikel 2][ref1] verplicht is om
      melding te maken van aan hem afgegeven afvalstoffen onverwijld een nummer als bedoeld in het eerste lid, onder a.
      De meldingsinstantie kan het nummer intrekken als de persoon ingevolge artikel 2 niet langer verplicht is tot het
      melden van de aan hem afgegeven afvalstoffen.

      3 Een afvalstroomnummer vervalt indien gedurende vijf jaar geen melding van de ontvangst van afvalstoffen met
      gebruikmaking van dat nummer heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel2
