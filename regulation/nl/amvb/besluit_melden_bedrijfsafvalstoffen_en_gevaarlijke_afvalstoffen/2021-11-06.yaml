  - number: 12b
    text: |-
      1 Onze Minister kan op aanvraag een erkenning verlenen aan een persoon of een instelling voor het nemen van
      monsters van afvalstoffen.

      2 De beschikking vermeldt ten minste de naam van de persoon of instelling, de vestigingsplaats en, indien van
      toepassing, de naam van de natuurlijk persoon die voor de erkende persoon of instelling de monsterneming van
      afvalstoffen uitvoert.

      3 Een erkenning wordt voor onbepaalde tijd verleend.

      4 Onze Minister stelt een lijst met erkende personen en instellingen beschikbaar via een bij regeling van Onze
      Minister aangewezen website.

      5 Een erkenning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0017294/2021-11-06#Artikel12b
  - number: 12c
    text: |-
      1 Een aanvraag voor een erkenning wordt door middel van een bij regeling van Onze Minister vastgesteld formulier,
      ingediend bij Onze Minister.

      2 Bij de aanvraag worden ten minste de volgende gegevens verstrekt:

      a. de naam en het adres van de aanvrager;

      b. het certificaat voor de monsterneming;

      c. de vestigingsplaats van de persoon of instelling;

      d. indien van toepassing, de naam en een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], die niet ouder is dan zes maanden, van de
      natuurlijk persoon, bedoeld in [artikel 12b, tweede lid][ref2].

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de in het tweede lid
      bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0017294#Artikel12b
