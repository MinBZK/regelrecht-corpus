  - number: 12g
    text: |-
      1 Het is verboden monsters van afvalstoffen te nemen zonder daartoe verleende erkenning.

      2 De monsters kunnen worden genomen door een natuurlijk persoon die staat vermeld op de erkenning.

      3 Het bepaalde in het eerste en tweede lid geldt niet voor zover de werkzaamheid wordt uitgevoerd voor het
      verkrijgen van een certificaat.
    url: https://wetten.overheid.nl/BWBR0017294/2021-11-06#Artikel12g
  - number: 12h
    text: |-
      Het is een persoon of instelling verboden een resultaat van een monsterneming van afvalstoffen te gebruiken of
      aan een ander ter beschikking te stellen indien hij weet of redelijkerwijs had kunnen vermoeden dat dit resultaat,
      gelet op het doel waarvoor dit wordt gebruikt, geen betrouwbaar beeld verschaft van de eigenschappen, aard,
      hoedanigheid of samenstelling van de afvalstof.
    url: https://wetten.overheid.nl/BWBR0017294/2021-11-06#Artikel12h
  - number: 12i
    text: |-
      De houder van een erkenning meldt onverwijld aan een door Onze Minister aangewezen instantie zijn door de rechtbank
      uitgesproken faillissement of surseance van betaling. De melding geschiedt door middel van een bij regeling van
      Onze Minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0017294/2021-11-06#Artikel12i
  - number: 12j
    text: |-
      Een certificeringsinstelling meldt een schorsing of intrekking van een certificaat voor de monsterneming onverwijld
      aan een door Onze Minister aangewezen instantie. De melding geschiedt door middel van een bij regeling van Onze
      Minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0017294/2021-11-06#Artikel12j
  - number: 12k
    text: |-
      1 Onze Minister kan een erkenning geheel of gedeeltelijk intrekken:

      a. op verzoek van de erkende persoon of instelling,

      b. indien bij de aanvraag onjuiste of onvolledige gegevens zijn verstrekt, en kennis omtrent de juiste en volledige
      gegevens tot een andere beslissing zou hebben geleid,

      c. indien het bewijs van certificatie voor de monsterneming is ingetrokken of niet meer geldig is,

      d. indien de erkende persoon of instelling in staat van faillissement verkeert of surseance van betaling heeft
      verkregen, of

      e. indien de erkende persoon of instelling of de natuurlijk persoon, bedoeld in [artikel 12b, tweede lid,][ref1]
      een wettelijk voorschrift heeft overtreden dat is gesteld bij of krachtens deze paragraaf of
      [artikel 225 van het Wetboek van Strafrecht][ref2], voor zover de overtreding verband houdt met de monsterneming
      van afvalstoffen.

      2 Onze Minister kan een erkenning voor een periode van ten hoogste twee jaar geheel of gedeeltelijk schorsen,
      indien:

      a. het bewijs van certificatie voor de desbetreffende werkzaamheid is geschorst, of

      b. sprake is van een overtreding als bedoeld in het eerste lid, onder e.

      3 In geval van aanwijzingen dat er sprake is van een overtreding als bedoeld in het eerste lid, onder e, kan Onze
      Minister de desbetreffende persoon of instelling verzoeken binnen een redelijke termijn een verklaring omtrent
      het gedrag als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref3] over te leggen,
      die niet ouder is dan twee maanden. Indien de desbetreffende persoon of instelling niet binnen de gestelde termijn
      aan dit verzoek voldoet of kan voldoen, kan Onze Minister de erkenning voor een periode van ten hoogste twee jaar
      geheel of gedeeltelijk schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel28
