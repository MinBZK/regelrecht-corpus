  - number: 7a
    text: |-
      1 Elke leverancier van een voorwerp als bedoeld in artikel 3, onderdeel 33, van de EG-verordening registratie,
      evaluatie en autorisatie van chemische stoffen, verstrekt de informatie, bedoeld in artikel 33, eerste lid, van
      deze verordening, aan het Europees Agentschap voor chemische stoffen.

      2 Het eerste lid is niet van toepassing op leveranciers van voorwerpen als bedoeld op de lijst met producttypen van
      wapens, munitie en oorlogsmateriaal, vastgesteld bij Besluit 255/58 van de Raad van 15 april 1958, die zijn bedoeld
      ten dienste van defensiebelangen van Nederland of op die voorwerpen die daarvoor in gebruik zijn geweest.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0017294/2021-11-06#Artikel7a
  - number: '8'
    text: |-
      1 Degene voor wie de in [artikel 10.40, eerste lid, van de wet][ref1] gestelde verplichting geldt, verstrekt een
      afvalstroomnummer:

      a. indien de afvalstoffen aan hem worden afgegeven door een persoon die krachtens [artikel 10.45][ref2] of
      [10.48 van de wet][ref3] bevoegd is zodanige afvalstoffen in te zamelen en deze rechtstreeks naar hem vervoert: aan
      de persoon bij wie de afvalstoffen worden ingezameld;

      b. in andere gevallen: aan degene die zich van de afvalstoffen ontdoet.

      2 De in het eerste lid gestelde verplichting geldt niet voor een in de aanhef van dat lid bedoelde persoon, in
      de categorieën van gevallen waarin het de afgifte van door route-inzameling verkregen bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen die behoren tot een in [bijlage II][ref4] aangegeven categorie, of de afgifte van door
      inzameling verkregen afvalstoffen als bedoeld in [artikel 3, derde lid, onder b][ref5], betreft en hij voorafgaand
      aan de route-inzameling onderscheidenlijk de inzameling een afvalstroomnummer aan degene die zodanige afvalstoffen
      inzamelt, heeft verstrekt.

      3 Degene die door een inzameling als bedoeld in het tweede lid bedrijfsafvalstoffen of gevaarlijke afvalstoffen
      in ontvangst neemt en aan wie met toepassing van het tweede lid een afvalstroomnummer is verstrekt, deelt dat
      afvalstroomnummer mede aan degene die zich van de afvalstoffen ontdoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.40
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10.45
