    text: |-
      1 De in [artikel 10.40, eerste lid, van de wet][ref1] gestelde verplichting geldt niet voor andere dan de ingevolge
      het tweede lid aangewezen categorieën van gevallen.

      2 Als categorieën van gevallen waarvoor de in [artikel 10.40, eerste lid, van de wet][ref2] gestelde verplichting
      geldt, worden aangewezen de categorieën van gevallen waarin de afgifte geen betrekking heeft op afvalstoffen die
      behoren tot een in bijlage I aangegeven categorie en:

      a. de afgifte van bedrijfsafvalstoffen geschiedt aan een persoon als bedoeld in
      [artikel 10.37, tweede lid, onder b, aanhef en onder 1°, van de wet][ref3] die een inrichting drijft:

      1°. als bedoeld in categorie 28.4 van [bijlage I, onder C, bij het Besluit omgevingsrecht][ref4], niet zijnde een
      inrichting voor:

      a. uitsluitend het opslaan, overslaan, verwerken of het verrichten van een combinatie van deze handelingen met
      betrekking tot schone kunststoffen,

      b. uitsluitend het opslaan, overslaan, verwerken of het verrichten van een combinatie van deze handelingen met
      betrekking tot banden,

      c. uitsluitend het opslaan, overslaan, verwerken of het verrichten van een combinatie van deze handelingen met
      betrekking tot kabelschroot omhuld of geïsoleerd met kunststoffen, niet zijnde grondkabels,

      d. uitsluitend een combinatie van de handelingen van het opslaan, overslaan of verwerken met betrekking tot papier,
      textiel, ferro- of non-ferrometalen, schroot, schone kunststoffen, glas, banden, kabelschroot omhuld of geïsoleerd
      met kunststoffen, niet zijnde grondkabels, of een combinatie van deze afvalstoffen,

      e. uitsluitend het verrichten van de handelingen: het opslaan, overslaan, verwerken of een
      combinatie van deze handelingen met betrekking tot afgedankte batterijen of accu’s als bedoeld in de
      [Regeling beheer batterijen en accu’s 2008][ref5], afgedankte elektrische en elektronische apparatuur
      als bedoeld in de [Regeling afgedankte elektrische en elektronische apparatuur][ref6], autowrakken als
      bedoeld in het [Besluit beheer autowrakken][ref7], of een combinatie daarvan, indien voor de desbetreffende
      batterijen of accu’s, elektrische en elektronische apparatuur of autowrakken verslag wordt gedaan als bedoeld
      in respectievelijk [artikel 13, eerste lid, van de Regeling beheer batterijen en accu’s 2008][ref8] of
      [artikel 15, eerste lid, van het Besluit beheer autowrakken][ref9], of,

      f. uitsluitend het verrichten van een combinatie van de handelingen, bedoeld in de onderdelen a tot en met e;

      2°. voor het opslaan van verontreinigde grond, waaronder begrepen verontreinigde baggerspecie, die van buiten de
      inrichting afkomstig is, met een opslagcapaciteit ten aanzien daarvan van 50 m3 of meer;

      3°. voor het overslaan van huishoudelijke afvalstoffen of bedrijfsafvalstoffen, die van buiten de inrichting
      afkomstig zijn, met een opslagcapaciteit ten aanzien daarvan van 50 m3 of meer;

      4°. voor het sorteren van bouw- en sloopafvalstoffen met een opslagcapaciteit van meer dan 50 m3, of

      5°. voor het composteren van groenafval met een verwerkingscapaciteit van meer dan 50 m3 per jaar, of

      b. de afgifte van gevaarlijke afvalstoffen geschiedt aan een persoon als bedoeld in
      [artikel 10.37, tweede lid, onder b, van de wet][ref10].

      3 Een persoon als bedoeld in [artikel 10.40, eerste lid, van de wet][ref11] voor wie de in dat lid gestelde
      verplichting ingevolge dit besluit niet geldt, registreert de in dat lid bedoelde gegevens op een zodanige wijze
      dat:

      a. controle daarvan door degenen die belast zijn met het toezicht op de naleving van de wet binnen een redelijke
      termijn mogelijk is, en

      b. deze gedurende ten minste vijf jaar zijn te raadplegen.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de wijze van registreren.


