  - number: 10a
    text: |-
      1 Degene die een omschrijving verstrekt in gevallen als bedoeld in [artikel 10, derde lid][ref1], draagt er zorg
      voor dat ter bepaling van de in de omschrijving op te nemen gegevens over de samenstelling en het uitlooggedrag
      van afvalstoffen, monsters van de betrokken afvalstoffen worden genomen, die monsters worden geanalyseerd en dat
      daaromtrent gegevens worden geregistreerd.

      2 De in het eerste lid gestelde verplichting geldt niet voor:

      a. afvalstoffen die voldoen aan de beschrijving die is opgenomen in
      [tabel 1.1 van het Besluit stortplaatsen en stortverboden afvalstoffen][ref2];

      b. gevaarlijke afvalstoffen die hechtgebonden asbest of door een bindmiddel gebonden asbest of in kunststof
      verpakte asbestvezels bevatten, en die geen andere gevaarlijke stoffen dan asbest bevatten;

      c. niet-gevaarlijke afvalstoffen die worden aangeboden op een stortplaats voor niet-gevaarlijke afvalstoffen en
      niet in eenzelfde cel worden gestort als stabiele, niet-reactieve gevaarlijke afvalstoffen of gipsafval;

      d. afvalstoffen die uitsluitend bestaan uit deeltjes met een korrelgrootte van meer dan 40 millimeter;

      e. afvalstoffen waarvan de uitloogbaarheid en samenstelling bekend zijn;

      f. afvalstoffen ten aanzien waarvan het technisch niet mogelijk deze te testen of te onderwerpen aan passende
      testmethoden;

      g. afvalstoffen, behorende tot een categorie die krachtens het vijfde lid, onder b, is aangewezen.

      3 De monsterneming, bedoeld in het eerste lid, wordt uitgevoerd door een persoon of instelling die beschikt over
      een erkenning als bedoeld in [artikel 12b][ref3].

      4 De analyse van de monsters wordt uitgevoerd door een persoon of instelling die beschikt over een bewijs waarmee
      de Raad voor Accreditatie of een daaraan gelijkwaardig instituut in een andere lidstaat van de Europese Unie dan
      wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede
      daartoe strekkend verdrag dat Nederland bindt, kenbaar heeft gemaakt dat gedurende de periode waarin deze worden
      uitgevoerd, een gerechtvaardigd vertrouwen bestaat dat de betrokken persoon of instelling competent is voor het
      uitvoeren van de analyse overeenkomstig de krachtens het vijfde lid gestelde regels.

      5 Bij regeling van Onze Minister:

      a. worden nadere regels gesteld omtrent de monsterneming, de analyse van monsters en de registratie, bedoeld in het
      eerste lid;

      b. kunnen categorieën van afvalstoffen worden aangewezen die in ieder geval worden aangemerkt als categorieën
      van afvalstoffen waarvan het uitlooggedrag en de samenstelling algemeen bekend zijn of ten aanzien waarvan het
      technisch niet mogelijk is deze te testen of te onderwerpen aan passende testmethoden.

      6 Het is verboden te doen handelen in strijd met het derde en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009094
      [ref3]: https://wetten.overheid.nl/BWBR0017294#Artikel12b
