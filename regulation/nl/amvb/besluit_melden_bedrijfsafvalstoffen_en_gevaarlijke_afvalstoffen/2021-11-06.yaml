articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *de wet*: de [Wet milieubeheer][ref1];

      b. *afvalstoffenlijst*: afvalstoffenlijst als bedoeld in
      [artikel 1, eerste lid, van de Regeling Europese afvalstoffenlijst][ref2];

      c. afvalstroomnummer: afvalstroomnummer als bedoeld in [artikel 9, eerste lid][ref3];

      d. *meldingsinstantie*: instantie als bedoeld in de [artikelen 10.38, derde lid][ref4], en
      [10.40, eerste lid, van de wet][ref5];

      e. *route-inzameling*: inzameling van bedrijfsafvalstoffen of gevaarlijke afvalstoffen volgens een vooraf bepaalde
      route waarbij de afvalstoffen tijdens het vervoer worden samengevoegd met gelijksoortige afvalstoffen die worden
      afgegeven door verschillende personen;

      f. *Raad voor Accreditatie:* Stichting Raad voor Accreditatie te Utrecht;

      g. *regelmatige afvalstoffen:* afvalstoffen die regelmatig tijdens hetzelfde proces ontstaan en een constante
      samenstelling hebben;

      h. *korrelvormige afvalstoffen:* afvalstoffen, niet zijnde monolithische afvalstoffen;

      i. *monolithische afvalstoffen:* afvalstoffen die door menging met toeslagstoffen of andersoortige bewerkingen zijn
      omgevormd tot afvalstoffen met een beperkte uitloging en een duurzame vaste vorm;

      j. *schone kunststoffen:* kunststoffen of mengsels daarvan, mits deze niet zijn vermengd met andere afvalstoffen en
      zij overeenkomstig een specificatie zijn vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0013546#Artikel1
