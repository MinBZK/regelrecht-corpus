    text: |-
      1 De in [artikel 10.38, derde lid, van de wet][ref1] gestelde verplichting geldt niet voor andere dan de ingevolge
      het tweede lid aangewezen categorieën van gevallen.

      2 Als categorieën van gevallen waarin de in [artikel 10.38, derde lid, van de wet][ref2] gestelde
      verplichting geldt, worden aangewezen de categorieën van gevallen waarin de afgifte geschiedt
      door een persoon als bedoeld in [artikel 2, tweede lid, onder a en b][ref3], aan een persoon
      als bedoeld in [artikel 10.37, tweede lid, onder a of b, van de wet][ref4], niet zijnde een
      persoon als bedoeld in [artikel 2, tweede lid, onder a en b][ref5], met dien verstande dat een
      melding als bedoeld in de [artikelen 32][ref6] en [42 van het Besluit bodemkwaliteit][ref7] en
      [artikel 2a van het Besluit gebruik meststoffen][ref8] wordt gelijkgesteld met het voldoen aan de in
      [artikel 10.38, derde lid, van de wet][ref9] gestelde verplichting.

      3 Bij regeling van Onze Minister kunnen categorieën van inrichtingen worden aangewezen die zijn vrijgesteld van de
      verplichting, bedoeld in het tweede lid.


