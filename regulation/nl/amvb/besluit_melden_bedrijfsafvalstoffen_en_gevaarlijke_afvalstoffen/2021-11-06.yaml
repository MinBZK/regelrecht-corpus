  - number: '14'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0017294/2021-11-06#Artikel14
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Besluit melden bedrijfsafvalstoffen en gevaarlijke afvalstoffen.'
