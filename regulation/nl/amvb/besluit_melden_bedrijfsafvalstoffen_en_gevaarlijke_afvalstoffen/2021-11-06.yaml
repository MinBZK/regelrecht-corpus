  - number: 12f
    text: |-
      1 Met een verklaring omtrent het gedrag als bedoeld in [artikel 12c, tweede lid, onder d][ref1], wordt
      gelijkgesteld een verklaring omtrent het gedrag afgegeven door een daartoe bevoegde instantie in een andere
      lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of
      documenten die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de
      nationale onderzoekingen of documenten wordt geboden, mits die verklaring niet ouder is dan zes maanden.

      2 Met een certificaat wordt gelijkgesteld een certificaat afgegeven door een daartoe bevoegde instantie
      in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese
      Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis
      van onderzoekingen of documenten die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het
      beschermingsniveau dat met de nationale onderzoekingen of documenten wordt geboden.

      3 Met een erkenning wordt gelijkgesteld een erkenning of vergelijkbare beschikking afgegeven door een daartoe
      bevoegde instantie in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van
      de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op
      basis van voorwaarden die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau
      dat met de in [artikel 12c, tweede lid][ref2], gestelde eisen wordt geboden. De [artikelen 12b, vierde lid][ref3],
      en [12l][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12c
