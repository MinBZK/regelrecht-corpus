  - number: '6'
    text: |-
      1 Aan [artikel 10.38, derde lid, van de wet][ref1] in verbinding met het eerste lid, onder a, van dat artikel wordt
      uitvoering gegeven door het melden van het aantal afgiften dat in de voorafgaande maand heeft plaatsgevonden.

      2 Aan [artikel 10.38, derde lid, van de wet][ref2] in verbinding met het eerste lid, onder c, van dat artikel
      wordt, voorzover het betreft de hoeveelheid, uitvoering gegeven door het melden van de totale hoeveelheid
      afvalstoffen waarvan de afgifte in de voorafgaande maand heeft plaatsgevonden.

      3 Degene die een melding als bedoeld in [artikel 10.38, derde lid, van de wet][ref3] doet, meldt daarbij tevens de
      van toepassing zijnde code van de afvalstoffenlijst.

      4 [Artikel 3, vijfde en zevende lid][ref4], is van overeenkomstige toepassing.


