      1 [Artikel 10.38, derde lid, van de wet][ref1] is van overeenkomstige toepassing in de categorieën van gevallen
      waarin een persoon als bedoeld in [artikel 2, tweede lid, onder a en b][ref2], zich van stoffen, mengsels of
      producten, niet zijnde bedrijfsafvalstoffen of gevaarlijke afvalstoffen, ontdoet door afgifte aan een ander persoon
      of toepast binnen of buiten de eigen inrichting.

      2 In de categorieën van gevallen, bedoeld in het eerste lid, zijn de [artikelen 3, vijfde lid][ref3], en
      [6, eerste tot en met derde lid][ref4], van overeenkomstige toepassing.

      3 Voor zover geen code van de afvalstoffenlijst van toepassing is wordt aan [artikel 6, derde lid][ref5],
      uitvoering gegeven door melding van de van toepassing zijnde code van de gecombineerde nomenclatuur, bedoeld in
      artikel 1, eerste lid, van verordening nr. 2658/87/EEG van de Raad van de Europese Gemeenschappen van 23 juli 1987
      met betrekking tot de tarief- en statistieknomenclatuur en het gemeenschappelijk douanetarief (PbEG L 256).


