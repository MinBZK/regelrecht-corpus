  - number: '11'
    text: |-
      1 De in de [artikelen 10.39, eerste lid, onder b][ref1], en [10.44, eerste en tweede lid, van de wet][ref2]
      gestelde verplichtingen gelden niet voor het vervoer van:

      a. bedrijfsafvalstoffen of gevaarlijke afvalstoffen, waarop de EG-verordening overbrenging van afvalstoffen van
      toepassing is, dat vergezeld gaat van de begeleidende documenten, bedoeld in die verordening;

      b. bedrijfsafvalstoffen of gevaarlijke afvalstoffen in een motorrijtuig van de rijbewijscategorie B;

      c. bedrijfsafvalstoffen in een hoeveelheid van niet meer dan 500 kilogram op een andere wijze dan in een
      motorrijtuig van de rijbewijscategorie B;

      d. niet-beroepsmatig ingezameld papier of textiel;

      e. ingezamelde huishoudelijke afvalstoffen waarvan kan worden aangetoond dat deze rechtstreeks worden vervoerd naar
      een inrichting waar die afvalstoffen uitsluitend worden overgeslagen;

      f. bedrijfsafvalstoffen naar soort en aard vergelijkbaar met huishoudelijke afvalstoffen waarvan kan worden
      aangetoond dat deze rechtstreeks worden vervoerd naar een inrichting waar die bedrijfsafvalstoffen uitsluitend
      worden overgeslagen;

      g. veegvuil, marktafval, drijfafval en RKG-slib waarvan kan worden aangetoond dat deze rechtstreeks worden vervoerd
      naar een inrichting waar die bedrijfsafvalstoffen uitsluitend worden overgeslagen.

      2 De in [artikel 10.39, eerste lid, onder b, van de wet][ref3] gestelde verplichting geldt evenmin in de
      categorieën van gevallen waarin afvalstoffen worden afgegeven aan een persoon die de afvalstoffen door
      route-inzameling verkrijgt of door inzameling verkrijgt ingeval de afvalstoffen behoren tot een krachtens
      [artikel 3, derde lid, onder b][ref4], aangewezen categorie, en het op de afvalstoffen betrekking hebbende
      afvalstroomnummer met toepassing van [artikel 8, derde lid][ref5], aan hem is verstrekt.


