  - number: '10'
    text: |-
      1 De in [artikel 10.39, eerste lid, onder a, van de wet][ref1] gestelde verplichting geldt niet voor
      de categorieën van gevallen waarin de afgifte betrekking heeft op afvalstoffen die behoren tot een in
      [bijlage I][ref2] aangegeven categorie en niet geschiedt aan een persoon die een stortplaats als bedoeld in
      [artikel 8.47, eerste lid, onder a, van de wet][ref3] drijft om die afvalstoffen te laten storten.

      2 Degene die een omschrijving als bedoeld in [artikel 10.39, eerste lid, onder a, van de wet][ref4] verstrekt,
      vermeldt daarbij de van toepassing zijnde code van de afvalstoffenlijst.

      3 Een omschrijving die wordt verstrekt in gevallen waarin korrelvormige afvalstoffen aan een persoon die een
      stortplaats als bedoeld in [artikel 8.47, eerste lid, onder a, van de wet][ref5] drijft, worden afgegeven om te
      worden gestort, bevat tevens:

      a. gegevens over de bron en oorsprong van de afvalstoffen;

      b. gegevens over het proces waarbij de afvalstoffen zijn ontstaan, bestaande uit een beschrijving en de kenmerken
      van grondstoffen en producten;

      c. een beschrijving van de behandeling van de afvalstoffen die is toegepast of, bij het ontbreken daarvan, een
      motivering waarom geen behandeling is toegepast;

      d. indien van toepassing: gegevens over het uitlooggedrag van de afvalstoffen;

      e. gegevens over de eigenschappen van de afvalstoffen die specifiek van belang zijn voor het zo nodig treffen van
      aanvullende voorzorgsmaatregelen op de plaats waarop de afvalstoffen zullen worden gestort;

      f. voor zover het gevaarlijke afvalstoffen betreft waarop
      [artikel 4, eerste lid, van de Regeling Europese afvalstoffenlijst][ref6] van toepassing is, een vermelding van de
      in het tweede lid van dat artikel bedoelde eigenschappen die de afvalstoffen bezitten;

      g. gegevens over de resultaten van de ter bepaling van de samenstelling en het uitlooggedrag van de afvalstoffen
      uitgevoerde analyse of, bij het ontbreken daarvan, een motivering of gegevens waaruit blijkt dat er geen
      verplichting bestaat tot het uitvoeren van een zodanige analyse.

      4 Onverminderd het derde lid bevat een omschrijving die wordt verstrekt in gevallen waarin korrelvormige,
      regelmatige afvalstoffen aan een persoon als bedoeld in dat lid worden afgegeven om te worden gestort tevens:

      a. gegevens over de spreiding in de samenstelling van de afzonderlijke afvalstoffen;

      b. gegevens over de spreiding en variabiliteit van de specifieke eigenschappen van de afvalstoffen;

      c. indien de afvalstoffen tijdens hetzelfde proces in verschillende installaties ontstaan: het aantal keren dat per
      installatie analyses als bedoeld in het derde lid zijn uitgevoerd.

      5 Degene die ten behoeve van het verstrekken van een omschrijving gebruik maakt van schriftelijk of elektronisch
      vastgelegde gegevens omtrent aard, eigenschappen en samenstelling van de afvalstoffen, bewaart deze gegevens
      gedurende ten minste vijf jaar na de laatste afgifte van afvalstoffen waarop die omschrijving betrekking heeft.

      6 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het verstrekken van een
      omschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.39
