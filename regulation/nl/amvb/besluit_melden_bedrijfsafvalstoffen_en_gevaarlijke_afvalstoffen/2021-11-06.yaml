  - number: 12d
    text: |-
      1 Onze Minister beslist binnen acht weken na de datum van ontvangst van de aanvraag.

      2 Onze Minister verleent de erkenning geheel of gedeeltelijk indien de desbetreffende persoon of instelling:

      a. niet in staat van faillissement of surseance van betaling verkeert en

      b. heeft voldaan aan [artikel 12c, tweede lid][ref1].

      3 De erkenning wordt gebaseerd op een certificaat.

      4 Een erkenning kan geheel of gedeeltelijk worden geweigerd indien de desbetreffende persoon of
      instelling of een bestuurder van deze persoon of instelling, in de drie jaar voorafgaande aan de
      aanvraag een wettelijk voorschrift heeft overtreden dat is gesteld bij of krachtens deze paragraaf of
      [artikel 225 van het Wetboek van Strafrecht][ref2], voor zover de overtreding verband houdt met het nemen van
      monsters van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0017294#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel225
