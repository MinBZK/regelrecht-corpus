  - number: '3'
    text: |-
      1 Aan [artikel 10.40, eerste lid, aanhef en onder b, van de wet][ref1] wordt uitvoering gegeven door het melden
      van de naam en het adres van degene aan wie met het oog op de desbetreffende afgifte een afvalstroomnummer is
      verstrekt.

      2 Degene die een melding als bedoeld in [artikel 10.40, eerste lid, van de wet][ref2] doet, meldt daarbij tevens
      de van toepassing zijnde code van de afvalstoffenlijst en het voor de ontvangst van de afvalstoffen verstrekte
      afvalstroomnummer.

      3 De in [artikel 10.40, eerste lid, aanhef en onder d, van de wet][ref3] gestelde verplichting geldt niet in de
      categorieën van gevallen waarin het betreft de afgifte van:

      a. door route-inzameling verkregen afvalstoffen, of

      b. door inzameling verkregen afvalstoffen die behoren tot een door Onze Minister aangewezen categorie.

      4 De in [artikel 10.40, eerste lid, aanhef en onder f, van de wet][ref4] gestelde verplichting geldt niet voor een
      andere categorie van gevallen dan die waarin de afgifte geschiedt door tussenkomst van een ander die opdracht had
      de afvalstoffen in te zamelen en naar hem te vervoeren.

      5 De melding, bedoeld in [artikel 10.40, eerste lid, van de wet][ref5] geschiedt:

      a. binnen vier weken na afloop van de maand waarin een afgifte heeft plaatsgevonden, en

      b. langs elektronische weg of schriftelijk.

      6 Degene die een melding als bedoeld in [artikel 10.40, eerste lid, van de wet][ref6] doet, bewaart gedurende ten
      minste vijf jaar de begeleidingsbrieven of de elektronische versie hiervan.

      7 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de ingevolge
      [artikel 10.40, eerste lid, van de wet][ref7] en dit besluit te melden gegevens en de wijze waarop de melding wordt
      gedaan.


