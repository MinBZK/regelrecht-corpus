  - number: '13'
    text: |-
      Indien een melding als bedoeld in [artikel 10.38, derde lid][ref1], of [10.40, eerste lid, van de wet][ref2]
      betrekking heeft op een afgifte die heeft plaatsgevonden op of na de inwerkingtreding van dit besluit
      en vóór de eerste dag van de maand volgende op die inwerkingtreding, geschiedt, in afwijking van
      [artikel 6, vierde lid][ref3], dan wel [artikel 3, vijfde lid, aanhef en onder a][ref4], die melding uiterlijk tien
      weken na de datum van inwerkingtreding van dit besluit.


