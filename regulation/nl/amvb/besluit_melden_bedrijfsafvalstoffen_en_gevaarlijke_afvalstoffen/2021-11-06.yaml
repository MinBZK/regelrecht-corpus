    text: |-
      1 Onverminderd het tweede lid wordt voor de begeleidingsbrief, bedoeld in
      [artikel 10.39, eerste lid, onder b, van de wet][ref1] gebruik gemaakt van een bij regeling van Onze Minister
      vastgesteld formulier dat voor de daarbij aangegeven categorieën van gevallen verschillend kan worden vastgesteld.

      2 Onze Minister kan toestemming geven om gebruik te maken van een andere gegevensdrager dan een formulier als
      bedoeld in het eerste lid.

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de toepassing van het
      eerste lid. Tevens kunnen daarbij categorieën van gevallen worden aangewezen waarvoor de verplichting, bedoeld in
      het eerste lid, niet geldt.


