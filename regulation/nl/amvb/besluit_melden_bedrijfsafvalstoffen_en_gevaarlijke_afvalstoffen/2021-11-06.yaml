  - number: 5a
    text: |-
      1 [Artikel 10.38, derde lid, van de wet][ref1] is van overeenkomstige toepassing in de categorieën van gevallen
      waarin een persoon als bedoeld in [artikel 10.37, tweede lid, onder b, van de wet][ref2] gevaarlijke afvalstoffen
      binnen de inrichting waar deze zijn ontstaan nuttig toepast of verwijdert.

      2 In de categorieën van gevallen, bedoeld in het eerste lid, is [artikel 6][ref3] van overeenkomstige toepassing,
      met dien verstande dat in die gevallen geen afgifte wordt gemeld maar het nuttig toepassen of verwijderen van de
      gevaarlijke afvalstoffen.

      3 Dit artikel berust op [artikel 9.5.2, eerste lid, van de wet][ref4].


