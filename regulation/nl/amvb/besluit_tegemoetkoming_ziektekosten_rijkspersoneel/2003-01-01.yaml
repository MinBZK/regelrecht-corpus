articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder

      a. ambtenaar: degene die in een of meer betrekkingen op basis van het [Algemeen Rijksambtenarenreglement][ref1],
      het [Ambtenarenreglement Staten-Generaal][ref2] of ingevolge [artikel 17][ref3], [119][ref4] of
      [120 van het Reglement Dienst Buitenlandse Zaken][ref5] in burgerlijke rijksdienst werkzaam is;

      b. gezinslid:

      1°. de echtgenoot van de ambtenaar, die behoort tot het huishouden van de ambtenaar en van wie de
      eigen inkomsten per maand niet meer bedragen dan 20% van de algemene heffingskorting, bedoeld in
      [artikel 8.10, tweede lid, van de Wet inkomstenbelasting 2001][ref6];

      alsmede,

      2°. het kind jonger dan 16 jaar, bedoeld in [artikel 7, eerste lid, van de Algemene Kinderbijslagwet][ref7],
      respectievelijk dat in aanmerking komt voor studiefinanciering ingevolge de [Wet studiefinanciering 2000][ref8];

      3°. het kind van 16 of 17 jaar, bedoeld in
      [artikel 7, eerste lid, onderdeel b, en tweede lid, van de Algemene Kinderbijslagwet][ref9];

      4°. het eigen kind dan wel aangehuwd kind of pleegkind – van 16 of 17 jaar dat tot zijn huishouden behoort en wiens
      voor werkzaamheden beschikbare tijd grotendeels in beslag wordt genomen door het verzorgen van dat huishouden,
      respectievelijk van 18 tot 27 jaar dat in verband met onderwijs of een beroepsopleiding overdag lessen of stages
      volgt gedurende ten minste 213 klokuren per kwartaal;.

      5°. het kind van 16 tot 27 jaar dat in aanmerking komt voor studiefinanciering ingevolge de
      [Wet studiefinanciering 2000][ref10], respectievelijk van 18 tot 27 jaar dat in aanmerking komt voor
      studiekostentegemoetkoming ingevolge hoofdstuk III van de Wet tegemoetkoming studiekosten;

      indien de ambtenaar voor zo'n kind de premie van een ziektekostenverzekering heeft betaald, met dien verstande dat
      wat betreft de gezinsleden vermeld

      – onder 2° er recht op kinderbijslag dan wel op studiefinanciering bestaat,

      – onder 3° er recht op kinderbijslag bestaat,

      – onder 4° deze in belangrijke mate op zijn kosten wordt onderhouden als bedoeld in
      [artikel 7 van de Algemene Kinderbijslagwet][ref11];

      c. inkomsten:

      1°. alle inkomsten uit of in verband met arbeid daartoe mede gerekend pensioenen en uitkeringen ingevolge sociale
      regelingen onder welke benamingen dan ook;

      2°. inkomsten uit of in verband met de uitoefening van een vrij beroep of eigen bedrijf, zijnde winst uit
      onderneming als bedoeld in de[ Wet inkomstenbelasting 2001][ref12].

      2 In dit besluit wordt onder echtgenoot van de ambtenaar mede verstaan degene met wie de niet gehuwde ambtenaar
      samenwoont en met het oogmerk duurzaam samen te leven – een gezamenlijke huishouding voert op basis van een
      notarieel verleden samenlevingscontract bevattende de wederzijdse rechten en verplichtingen ter zake van die
      samenwoning en gezamenlijke huishouding alsmede de geregistreerde partner.

      Tegelijkertijd kan slechts één persoon als echtgenoot worden aangemerkt. Desgevraagd dient door de ambtenaar een
      schriftelijke verklaring van een notaris te worden overgelegd waaruit blijkt dat een samenlevingscontract als
      vorenbedoeld is gesloten.


