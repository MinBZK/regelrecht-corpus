  - number: '2'
    text: |-
      1 De ambtenaar ontvangt een tegemoetkoming in ziektekosten over elke kalendermaand waarin hij een of meer
      betrekkingen bekleedt, bedoeld in [artikel 1, eerste lid, onderdeel ][ref1].

      2 De ambtenaar ontvangt voorts een tegemoetkoming voor een gezinslid als bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref2].

      3 De ambtenaar ontvangt een extra tegemoetkoming voor ten hoogste drie gezinsleden, bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 2°, 3°, 4° en 5°][ref3], waaronder ten hoogste twee gezinsleden als
      bedoeld in [artikel 1, eerste lid, onderdeel b, onder 2°][ref4].

      4 De tegemoetkoming, bedoeld in het derde lid wordt alleen dan aan de ambtenaar verstrekt, indien de inkomsten van
      de ambtenaar hoger zijn dan die van de echtgenoot van de ambtenaar.

      5 De tegemoetkomingen worden over een kalendermaand slechts verleend, indien de ambtenaar gedurende meer dan de
      helft van het aantal dagen van die maand als zodanig in dienst is geweest. De tegemoetkomingen voor gezinsleden
      worden over een kalendermaand slechts verleend, indien zij gedurende meer dan de helft van het aantal dagen van die
      maand als gezinslid kunnen worden aangemerkt.


