  - number: 4a
    text: |-
      1 De tegemoetkoming wordt volgens de volgende leden vastgesteld.

      2 De tegemoetkoming bedraagt:

      a. ten aanzien van de ambtenaar en ten aanzien van het gezinslid, bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 1°][ref1]: de som van 50% van de door hen verschuldigde in
      [artikel 4, onderdelen a en b][ref2], bedoelde bedragen en 50% van het in [artikel 4, onderdeel c][ref3], bedoelde
      bedrag, maar niet minder dan € 65,26;

      b. ten aanzien van het gezinslid, bedoeld in [artikel 1, eerste lid, onderdeel b, onder 2°][ref4]: de som van 50%
      van de door dit gezinslid verschuldigde in [artikel 4, onderdelen a en b][ref5], bedoelde bedragen en 25% van het
      in [artikel 4, onderdeel c][ref6], bedoelde bedrag, maar niet minder dan € 32,63;

      c. ten aanzien van het gezinslid, bedoeld in [artikel 1, eerste lid, onderdeel b, onder 3° tot en met 5°][ref7]:
      de som van 50% van de door hem verschuldigde in [artikel 4, onderdelen a en b][ref8], bedoelde bedragen en 25% van
      het in [artikel 4, onderdeel c][ref9], bedoelde bedrag, maar niet minder dan € 38,73.

      3 De in het tweede lid genoemde bedragen van € 65,26 respectievelijk van € 32,63 en € 38,73 worden voor
      hen die verzekerd of medeverzekerd zijn krachtens een overeenkomst voor standaardverzekering, bedoeld in
      [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref10] voor een persoon
      die de dag voor 1 april 1986 verzekerd of medeverzekerd was in de vrijwillige verzekering ingevolge de
      [Ziekenfondswet][ref11], vermeerderd met € 2,27 respectievelijk € 1,13.

      4 Het op grond van het tweede en derde lid vastgestelde bedrag wordt gebruteerd met het voor de betrokkene geldende
      tarief voor de loonbelasting/premie volksverzekeringen volgens de tabel voor bijzondere beloningen ingevolge de
      [Wet op de loonbelasting 1964][ref12].

      5 Voor de toepassing van het tweede lid, onderdeel a, worden de ambtenaar en de
      gezinsleden in de leeftijdscategorieën van 16 tot en met 19 jaar en van 65 jaar en
      ouder wat betreft de tegemoetkoming in de verschuldigde omslagbijdragen ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref13] en ingevolge
      [artikel 11 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref14] gelijkgesteld met degenen in de
      leeftijdscategorie van 20 tot en met 64 jaar.


