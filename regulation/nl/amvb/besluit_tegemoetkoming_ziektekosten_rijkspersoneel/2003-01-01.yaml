  - number: '3'
    text: |-
      1 De ambtenaar ontvangt voor zich zelf geen tegemoetkoming over een kalendermaand, waarin hij gedurende meer dan de
      helft van het aantal dagen behoort tot een van de volgende categorieën:

      a. degenen die zelfstandig verplicht verzekerd zijn krachtens de [Ziekenfondswet][ref1];

      b. degenen die medeverzekerd zijn ingevolge het bepaalde in [artikel 4 van de Ziekenfondswet][ref2];

      c. degenen die uit hoofde van hun (voormalige) dienstbetrekking aanspraak hebben op gehele of gedeeltelijke
      geneeskundige verzorging of op gehele of gedeeltelijke vergoeding van de kosten daarvan;

      d. degenen die uit hun dienstbetrekking geen bezoldiging genieten;

      e. degenen die zich anders dan voor herhalingsoefeningen in werkelijke militaire dienst bevinden.

      2 De ambtenaar ontvangt over een kalendermaand waarin hij gedurende meer dan de helft van het aantal dagen behoort
      tot een van de in het eerste lid, onder *d* en *e*, genoemde categorieën, geen tegemoetkoming voor een gezinslid.

      3 De ambtenaar ontvangt evenmin een tegemoetkoming voor het gezinslid dat tot een van de in het eerste lid
      genoemde categorieën behoort, dan wel uit anderen hoofde aanspraak heeft op gehele of gedeeltelijke geneeskundige
      verzorging, of op gehele of gedeeltelijke vergoeding van de kosten daarvan.

      4 Indien voor een of meer kinderen als bedoeld in [artikel 1, onderdeel b, onder 2°, 3°, 4° en 5°][ref3], uit
      anderen hoofde aanspraak bestaat op gehele of gedeeltelijke geneeskundige verzorging, of op gehele of gedeeltelijke
      vergoeding van de kosten daarvan, worden deze kinderen meegeteld voor het maximum aantal gezinsleden waarvoor met
      toepassing van het bepaalde in [artikel 2, derde lid][ref4], aanspraak bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
