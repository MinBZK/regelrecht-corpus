  - number: '4'
    text: |-
      De tegemoetkoming wordt gerelateerd aan:

      a. de omslagbijdragen ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1];

      b. de omslagbijdragen ingevolge [artikel 11 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref2];

      c. de component «polis» van de particuliere ziektekostenpremie voor een maatschappijpolis, zoals deze door het
      Centraal Plan Bureau in elk kalenderjaar wordt gehanteerd ten behoeve van het Centraal Economisch Plan.


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003934#Artikel11
    url: https://wetten.overheid.nl/BWBR0006855/2003-01-01#Artikel4
