  - number: '5'
    text: |-
      1 Ten aanzien van de ambtenaar die als zodanig een of meer betrekkingen met een onvolledige werktijd bekleedt,
      bedragen de tegemoetkomingen een evenredig deel van de tegemoetkomingen bij een volledige werktijd, met dien
      verstande, dat de door eenzelfde orgaan, bedoeld in [artikel 7][ref1], uit te betalen tegemoetkomingen te zamen het
      bedrag van de tegemoetkomingen bij een volledige werktijd niet overschrijden.

      2 Een teruggebrachte werktijd als bedoeld in [artikel 21][ref2] of een daarmee overeenkomende bepaling in een ander
      rechtspositiereglement is geen onvolledige werktijd in de zin van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006855#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
