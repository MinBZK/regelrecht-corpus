  - number: '6'
    text: >-
      1 De tegemoetkomingen worden uitbetaald in de derde maand volgende op die waarop de tegemoetkomingen betrekking
      hebben. Zo nodig vindt uitbetaling in afwijking van het vorenstaande eerder plaats in geval van ontslag of
      overlijden van de ambtenaar.


      2 De eerste uitbetaling van de tegemoetkoming vindt slechts op aanvraag plaats. Indien wijzigingen optreden in de
      voor de bepaling van de tegemoetkoming relevante gegevens is de ambtenaar verplicht deze wijzigingen te melden. De
      eerste aanvraag alsmede de melding van wijzigingen geschiedt op formulieren, waarvan het model wordt vastgesteld
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      3 Indien niet binnen een periode van een jaar nadat het recht op respectievelijk nadat verhoging van het recht
      op een tegemoetkoming is ontstaan een aanvraag- respectievelijk wijzigingsformulier is ingediend, vindt de eerste
      uitbetaling respectievelijk verhoging van de uitbetaling van de tegemoetkoming plaats met terugwerkende kracht tot
      en met een jaar gerekend vanaf de eerste dag van de maand na indiening.
    url: https://wetten.overheid.nl/BWBR0006855/2003-01-01#Artikel6
  - number: '7'
    text: >-
      De uitbetaling van de tegemoetkomingen geschiedt door het orgaan dat belast is met de uitbetaling van de
      bezoldiging aan de ambtenaar over de desbetreffende maand en wel voor rekening van het hoofdstuk van de
      rijksbegroting ten laste waarvan evenbedoelde bezoldiging komt.
    url: https://wetten.overheid.nl/BWBR0006855/2003-01-01#Artikel7
  - number: '8'
    text: |-
      1 Het orgaan, bedoeld in [artikel 7][ref1], kan verlangen dat de ambtenaar voor de toekenning van een
      tegemoetkoming relevante bescheiden overlegt.

      2 Indien de ambtenaar niet voldoet aan het verzoek om bescheiden over te leggen, kan de uitbetaling van de
      tegemoetkoming worden opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0006855#Artikel7
    url: https://wetten.overheid.nl/BWBR0006855/2003-01-01#Artikel8
