  - number: '5.2'
    text: |-
      Onze Minister brengt tevens op de bekostiging van een school of samenwerkingsverband voor het in het eerste lid
      bedoelde kalenderjaar in mindering:
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel5
  - number: 5.2.a
    text: |-
      de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van de desbetreffende
      school voortvloeiend uit een ontslag dat is geëffectueerd in de periode tussen 31 juli 1995 en 1 januari 2007 en
      waarvoor de rechtspersoon, bedoeld in [artikel 98b van de wet][ref1], zoals luidend op 31 december 2006, niet heeft
      ingestemd op grond van [artikel 96o, derde lid, tweede volzin, van de wet][ref2], zoals luidend op 31 december
      2006, met het ten laste van bedoelde rechtspersoon brengen van de kosten van deze uitkeringen; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96o
  - number: 5.2.b
    text: |-
      een bij ministeriële regeling vast te stellen percentage van de kosten van de uitkeringen in het desbetreffende
      kalenderjaar voor gewezen personeel van de desbetreffende school of samenwerkingsverband voortvloeiend uit een
      ontslag dat is geëffectueerd op of na 1 januari 2007, waarbij het percentage bedoeld in het eerste lid, onder c, en
      het in dit onderdeel bedoelde percentage samen 100 bedraagt.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel5
  - number: '5.3'
    text: |-
      De uitkomsten van de in het eerste en tweede lid bedoelde berekeningen worden rekenkundig afgerond op hele
      eurocenten.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel5
  - number: '5.4'
    text: |-
      Indien een school is opgeheven, wordt het desbetreffende bevoegd gezag belast indien deze nog ten minste één andere
      school onder zijn bestuur heeft.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel5
  - number: '5.5'
    text: |-
      Over het moment en de wijze van in mindering brengen, bedoeld in het eerste en tweede lid, kunnen bij ministeriële
      regeling nadere voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel5
  - number: '6'
    text: |-
      In afwijking van [artikel 2, tweede lid][ref1], wordt er voor een school of scholengemeenschap die deel uitmaakt
      van een verticale scholengemeenschap in het bedrag per vestiging geen onderscheid gemaakt tussen de hoofdvestiging
      en een nevenvestiging. De hoofdvestiging van de school of scholengemeenschap die voldoet aan artikel 2, eerste lid,
      komt in aanmerking voor het op grond van artikel 2, tweede lid, vastgestelde bedrag voor een nevenvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel2
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '2'
        hoofdstuk: '2'
  - number: '7'
    text: |-
      Onze Minister bepaalt de wijze waarop de [artikelen 79][ref1] en [79a van de wet][ref2] en
      de [hoofdstukken 1][ref3] en [2][ref4] van toepassing zijn op een cursus als bedoeld in
      [artikel 75 van de wet][ref5], verbonden aan een school of scholengemeenschap, in verband met de aard, inhoud,
      omvang of duur van de cursus.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
      [ref3]: https://wetten.overheid.nl/BWBR0045100#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0045100#Hoofdstuk2
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel75
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 79a
      - id: ref3
        bwb_id: BWBR0045100
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0045100
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '75'
  - number: '8.1'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens de [wet][ref1] worden, onverminderd de [artikelen 9][ref2],
      [10][ref3], [11][ref4], [12][ref5] en [15][ref6] de leerlingen meegeteld die op de teldatum:


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0045100#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0045100#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0045100#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0045100#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0045100#Artikel15
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0045100
        artikel: '9'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0045100
        artikel: '10'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0045100
        artikel: '11'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0045100
        artikel: '12'
        hoofdstuk: '3'
      - id: ref6
        bwb_id: BWBR0045100
        artikel: '15'
        hoofdstuk: '4'
  - number: 8.1.a
    text: op die school als werkelijk schoolgaand staan ingeschreven; of
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel8
  - number: 8.1.b
    text: |-
      in bij ministeriële regeling te bepalen gevallen tijdelijk buiten de school waar zij staan ingeschreven zijn
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel8
  - number: '8.2'
    text: Een leerling telt voor één school mee voor de bekostiging.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel8
  - number: '9.1'
    text: 'Voor het bepalen van de hoogte van de bekostiging van een school of scholengemeenschap worden niet meegeteld:'
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel9
  - number: 9.1.a
    text: |-
      leerlingen die vanaf het begin van het schooljaar tot de teldatum meer dan de helft van het aantal schooldagen
      zonder geldige reden hebben verzuimd;
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel9
  - number: 9.1.b
    text: |-
      leerlingen die al met goed gevolg eindexamen aan een school voor vwo, havo, mavo of vbo hebben afgelegd en zich
      voorbereiden op het opnieuw afleggen van het eindexamen aan een gelijksoortige school, met dien verstande dat
      het afleggen van het eindexamen in een bepaalde leerweg van het vmbo door een leerling die al met goed gevolg het
      eindexamen heeft afgelegd van een andere leerweg van het vmbo niet wordt aangemerkt als het opnieuw afleggen van
      het eindexamen aan een gelijksoortige school;
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel9
  - number: 9.1.c
    text: |-
      leerlingen die deelnemen aan het onderwijs in het kader van contractactiviteiten als bedoeld in
      [artikel 20, tweede lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel20
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '20'
  - number: 9.1.d
    text: |-
      voor zover het betreft de bekostiging bedoeld in de [artikelen 79, eerste lid, onderdeel b][ref1], en
      [79a van de wet][ref2]: nieuwkomers die op de teldatum korter dan 1 jaar in Nederland zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 79a
  - number: '9.2'
    text: 'Als geldige reden voor verzuim als bedoeld in het eerste lid, onderdeel a, wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel9
  - number: 9.2.a
    text: |-
      ten aanzien van een leerplichtige leerling: een vrijstelling van geregeld schoolbezoek als bedoeld in de
      [Leerplichtwet 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 9.2.b
    text: |-
      ten aanzien van een niet-leerplichtige leerling: dezelfde gronden als die welke leiden tot vrijstelling van
      geregeld schoolbezoek als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel9
  - number: '10.1'
    text: |-
      Onverminderd het bepaalde in de [artikelen 8][ref1], [9][ref2] en [11][ref3] wordt een leerling
      meegeteld voor de aanvullende bekostiging voor leerwegondersteunend onderwijs, bedoeld in
      [artikel 79a, eerste lid, van de wet][ref4], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0045100#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0045100#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0045100
        artikel: '9'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0045100
        artikel: '11'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 79a
  - number: 10.1.a
    text: |-
      het samenwerkingsverband voor de teldatum heeft bepaald dat de leerling aangewezen is op leerwegondersteunend
      onderwijs of toelaatbaar is tot het praktijkonderwijs; of
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel10
  - number: 10.1.b
    text: |-
      er sprake is van een tijdelijke plaatsing als bedoeld in [artikel 27, lid 2f, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
  - number: '10.2'
    text: |-
      Onverminderd het bepaalde in de [artikelen 8][ref1] en [9][ref2] wordt een leerling in het
      praktijkonderwijs meegeteld voor de aanvullende bekostiging voor praktijkonderwijs, bedoeld in
      [artikel 79a, tweede lid, van de wet][ref3], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0045100#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0045100
        artikel: '9'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 79a
  - number: 10.2.a
    text: |-
      het samenwerkingsverband voor de teldatum heeft bepaald dat de leerling toelaatbaar is tot het praktijkonderwijs;
      of
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel10
  - number: 10.2.b
    text: |-
      er sprake is van een tijdelijke plaatsing als bedoeld in [artikel 27, lid 2f, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
  - number: '11.1'
    text: |-
      Leerlingen als bedoeld in de [artikelen 2][ref1] en [3 van het Besluit samenwerking VO-BVE][ref2] worden aangemerkt
      als leerlingen die op de teldatum als werkelijk schoolgaand op de school zijn ingeschreven, als bedoeld in
      [artikel 8, eerste lid][ref3]. Het bepaalde in [artikel 9, eerste lid, onderdeel a, en tweede lid][ref4], over
      verzuim is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019143#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019143#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045100#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0045100#Artikel9
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019143
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019143
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0045100
        artikel: '8'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0045100
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid, tellen leerlingen die zijn afgewezen voor een eindexamen als bedoeld in
      [artikel 29 van de wet][ref1] en aansluitend op grond van [artikel 3 van het Besluit samenwerking VO-BVE][ref2]
      voor een of meer vakken voortgezet algemeen volwassenenonderwijs volgen in plaats van voortgezet onderwijs, op de
      teldatum voor 50% mee.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0019143#Artikel3
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0019143
        artikel: '3'
  - number: '11.3'
    text: |-
      In afwijking van het eerste lid en van [artikel 9, eerste lid, onderdeel b][ref1], tellen leerlingen die op
      grond van [artikel 3, eerste lid, onderdeel c, van het Besluit samenwerking VO-BVE][ref2] voor een of meer vakken
      voortgezet algemeen volwassenenonderwijs volgen in plaats van voortgezet onderwijs, op de teldatum voor 50% mee.


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0019143#Artikel3
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019143
        artikel: '3'
  - number: '12.1'
    text: |-
      Voor de toepassing van [artikel 6h, eerste lid, van de wet][ref1] is vereist dat tussen het bevoegd gezag van een
      school of scholengemeenschap en het bevoegd gezag van een school voor voortgezet speciaal onderwijs, een school
      voor speciaal en voortgezet speciaal onderwijs, dan wel van een instelling voor speciaal en voortgezet speciaal
      onderwijs als bedoeld in de [Wet op de expertisecentra][ref2], een schriftelijke overeenkomst over de uitvoering
      daarvan wordt gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6h
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6h
      - id: ref2
        bwb_id: BWBR0003549
  - number: '12.2'
    text: 'De overeenkomst, bedoeld in het eerste lid, bevat in elk geval afspraken over:'
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
  - number: 12.2.a
    text: de termijn waarvoor de overeenkomst is aangegaan;
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
  - number: 12.2.b
    text: de vakken waarin de leerling onderwijs zal ontvangen;
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
  - number: 12.2.c
    text: het aantal lesuren per week per vak dat ten minste wordt aangeboden; en
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
  - number: 12.2.d
    text: de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
  - number: '12.3'
    text: |-
      Een leerling kan gedurende een termijn van ten hoogste drie maanden aaneengesloten het volledige onderwijsprogramma
      volgen op een school of instelling als bedoeld in het eerste lid. De overeenkomst, bedoeld in het eerste lid, bevat
      dan in elk geval afspraken over:
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
  - number: 12.3.a
    text: de termijn waarvoor de overeenkomst is aangegaan;
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
  - number: 12.3.b
    text: de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling; en
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
  - number: 12.3.c
    text: |-
      het bedrag voor de bekostiging dat het bevoegd gezag van de school of scholengemeenschap waar de leerling is
      ingeschreven betaalt aan het bevoegd gezag van de school of instelling, bedoeld in het eerste lid, waarmee de
      overeenkomst wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
  - number: '12.4'
    text: |-
      Het derde lid, onderdeel c, is niet van toepassing op een overeenkomst met een school waaraan
      onderwijs wordt gegeven aan leerlingen die zijn opgenomen in een inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1] of een gesloten accommodatie als
      bedoeld in [artikel 1.1 van de Jeugdwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '12.5'
    text: |-
      Indien voor de toepassing van [artikel 6h, eerste lid, van de wet][ref1], scholen, scholengemeenschappen dan wel
      instellingen binnen hetzelfde bevoegd gezag zijn betrokken, maakt dit bevoegd gezag afspraken met deze betrokken
      scholen, scholengemeenschappen of instellingen over de onderdelen, genoemd in het tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6h
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6h
  - number: '13.1'
    text: 'Het bevoegd gezag draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel13
  - number: 13.1.a
    text: een overzichtelijke administratie van de inschrijving van leerlingen;
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel13
  - number: 13.1.b
    text: de beschikbaarheid van de uitschrijving en het verzuim van leerlingen; en
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel13
  - number: 13.1.c
    text: |-
      de beschikbaarheid van de gegevens van leerlingen en hun ouders die noodzakelijk zijn voor de vaststelling van
      de bekostiging.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel13
  - number: '13.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de leerlingenadministratie wordt
      ingericht.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel13
  - number: '14.1'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Les- en cursusgeldwet][ref1] schrijft het bevoegd gezag van een
      school een leerling slechts in na een beslissing van het bevoegd gezag tot toelating van de leerling, of indien de
      leerling tijdelijk op de school wordt geplaatst op grond van [artikel 27, lid 2f, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004188
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004188
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '27'
  - number: '14.2'
    text: 'Het bevoegd gezag schrijft de leerling in met ingang van:'
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel14
  - number: 14.2.a
    text: de dag waarop de leerling de school voor het eerst bezoekt; of
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel14
  - number: 14.2.b
    text: |-
      1 augustus van het schooljaar, indien de leerling de school voor het eerst op de eerste schooldag van het
      schooljaar bezoekt.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel14
  - number: '15.1'
    text: 'Het bevoegd gezag schrijft de leerling uit met ingang van:'
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel15
  - number: 15.1.a
    text: |-
      31 juli van het schooljaar, indien de leerling de school op de laatste schooldag van dat schooljaar heeft bezocht;
      of
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel15
  - number: 15.1.b
    text: de dag waarop de leerling de school voor het laatst heeft bezocht.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel15
  - number: '15.2'
    text: |-
      Indien het bevoegd gezag van een school waarop de leerling stond ingeschreven, binnen vier weken na de dag
      waarop de leerling de school voor het laatst heeft bezocht uit het register onderwijsdeelnemers, bedoeld in de
      [Wet register onderwijsdeelnemers][ref1], een melding ontvangt van de inschrijving van de leerling op een andere
      school of een school voor ander onderwijs, wijzigt het bevoegd gezag de datum van uitschrijving, bedoeld in het
      eerste lid, onderdeel b, alsnog in de datum van de dag voorafgaande aan de dag van inschrijving op die andere
      school of die school voor ander onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0042012
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0042012
  - number: '16'
    text: |-
      De gegevens die in de leerlingenadministratie zijn opgenomen, blijven daarvan in ieder geval deel uitmaken
      gedurende 5 jaar nadat de desbetreffende leerling van de school is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel16
  - number: '17.1'
    text: |-
      Het Rijk betaalt elke maand van het kalenderjaar aan het bevoegd gezag van een school een gedeelte van de
      bekostiging, bedoeld in [artikel 3, eerste lid][ref1], waarop het over dat jaar recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel3
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '3'
        hoofdstuk: '2'
  - number: '17.2'
    text: |-
      Onze Minister kan op de in [artikel 3, eerste lid][ref1], bedoelde bekostiging verwachte bedragen als bedoeld in
      [artikel 96m, tweede lid, onderdelen a tot en met d, van de wet][ref2] in mindering brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96m
  - number: '17.3'
    text: |-
      De aanvullende bekostiging, bedoeld in [artikel 3, tweede lid][ref1], wordt in een keer betaald dan wel wordt
      betaald volgens een bij ministeriële regeling te bepalen betaalritme.


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel3
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '3'
        hoofdstuk: '2'
  - number: '18.1'
    text: |-
      Voor de vaststelling van de bekostiging zendt Onze Minister jaarlijks voor 15 januari volgend op de teldatum aan
      het bevoegd gezag overzichten van de gegevens, bedoeld in de [artikelen 5, eerste lid][ref1], [6, derde lid][ref2],
      en [8, vijfde lid, onderdeel a, van het Besluit register onderwijsdeelnemers][ref3] over het aantal leerlingen op
      de teldatum dat bij de vaststelling van de bekostiging voor het daarop volgende kalenderjaar in aanmerking wordt
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel8
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0042639
        artikel: '8'
  - number: '18.2'
    text: 'Het bevoegd gezag dient jaarlijks voor 1 juli volgend op de teldatum bij Onze Minister in:'
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel18
  - number: 18.2.a
    text: |-
      een verklaring van het bevoegd gezag omtrent de juistheid van de gegevens,
      bedoeld in de [artikelen 5, eerste lid][ref1], [6, derde lid][ref2], en
      [8, vijfde lid, onderdeel a, van het Besluit register onderwijsdeelnemers][ref3] van de leerlingen op de teldatum
      die het aan Onze Minister heeft gemeld; of


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel8
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0042639
        artikel: '8'
  - number: 18.2.b
    text: |-
      indien de in onderdeel a bedoelde gegevens naar het oordeel van het bevoegd gezag onjuist zijn, de door het bevoegd
      gezag gecorrigeerde gegevens; en
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel18
  - number: 18.2.c
    text: een verklaring van een accountant omtrent de juistheid van de gegevens, bedoeld in onderdeel a of onderdeel b.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel18
  - number: '18.3'
    text: 'Bij ministeriële regeling kan worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel18
  - number: 18.3.a
    text: een model voor de in het tweede lid, onderdelen a en c, bedoelde verklaringen;
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel18
  - number: 18.3.b
    text: een leidraad voor de controle door de accountant, bedoeld in het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel18
  - number: '18.4'
    text: |-
      Indien voor 1 juli in enig jaar aanvullende bekostiging is vastgesteld, dient het bevoegd gezag voor die datum bij
      Onze Minister een verklaring in omtrent de juistheid van de in voorkomende gevallen voor de vaststelling van de
      aanvullende bekostiging aan Onze Minister gemelde gegevens. Het tweede lid, onderdelen b en c, en het derde lid,
      zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister maakt het bedrag voor de bekostiging, bedoeld in [artikel 80][ref1] en [82, van de wet][ref2] bekend
      voorafgaand aan het kalenderjaar, waarop dit betrekking heeft. Indien de verklaring van de accountant, bedoeld
      in [artikel 18, tweede lid, onderdeel c][ref3], daartoe aanleiding geeft, wijzigt Onze Minister de bekostiging of
      aanvullende bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0045100#Artikel18
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '82'
      - id: ref3
        bwb_id: BWBR0045100
        artikel: '18'
        hoofdstuk: '5'
  - number: '19.2'
    text: |-
      Onze Minister kan de bekostiging wijzigen wegens algemene salarismaatregelen of wegens andere al dan niet uit de
      rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel19
  - number: '20.1'
    text: |-
      Onze Minister gaat gedurende het kalenderjaar waarop de verminderingen op de bekostiging, bedoeld in
      [artikel 5, eerste lid][ref1], betrekking hebben, per maand over tot een voorlopige inhouding op de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel5
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '5'
        hoofdstuk: '2'
  - number: '20.2'
    text: |-
      De definitieve vaststelling van de verminderingen, bedoeld in het eerste lid, vindt zo snel mogelijk na afloop van
      het desbetreffende kalenderjaar plaats.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel20
  - number: '20.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop toepassing wordt gegeven aan het
      in mindering brengen van bekostiging.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel20
  - number: '21'
    text: |-
      Ten behoeve van een school of scholengemeenschap met een bijzondere inrichting van het onderwijs kan Onze Minister
      op verzoek van het bevoegd gezag toestaan dat wordt afgeweken van de [artikelen 1 tot en met 20][ref1]. Onze
      Minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden
      kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen
      de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel1
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '1'
        hoofdstuk: '1'
  - number: '22.1'
    text: |-
      De boekhouding van een school is zodanig ingericht dat op doelmatige wijze informatie kan worden verkregen omtrent
      het gevoerde financiële beheer.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel22
  - number: '22.2'
    text: |-
      Het bevoegd gezag verstrekt op verzoek van Onze Minister nadere financiële informatie met betrekking tot de school.
      De wijze waarop deze informatie wordt verstrekt, kan bij ministeriële regeling worden geregeld.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel22
  - number: '22.3'
    text: Het boekjaar is gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel22
  - number: '23.1'
    text: Het bevoegd gezag stelt jaarlijks tijdig voor het komende begrotingsjaar een begroting vast voor de school.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel23
  - number: '23.2'
    text: |-
      De begroting bevat een raming van de baten en lasten van de school en is sluitend. De in de begroting voorziene
      baten uit de van het Rijk te ontvangen bekostiging komen overeen met de voor het desbetreffende jaar door Onze
      Minister vastgestelde bekostiging.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel23
  - number: '23.3'
    text: Het bevoegd gezag doet de noodzakelijke uitgaven binnen de grenzen van de begroting.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel23
  - number: '23.4'
    text: |-
      Af- en overschrijving op de uitgavenposten van de begroting kunnen door het bevoegd gezag geschieden overeenkomstig
      door het bevoegd gezag vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel23
  - number: '23.5'
    text: |-
      Indien Onze Minister het bevoegd gezag daarom verzoekt, wordt de vastgestelde begroting aan Onze Minister
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel23
  - number: '23.6'
    text: Bij ministeriële regeling kan een model voor de inrichting van de begroting worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel23
  - number: '24.1'
    text: |-
      Het jaarverslag, bedoeld in [artikel 103 van de Wet op het voortgezet onderwijs][ref1], wordt ingericht
      overeenkomstig bij ministeriële regeling vast te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '103'
  - number: '24.2'
    text: Het bevoegd gezag stelt jaarlijks ten behoeve van de school een jaarverslag vast over het afgelopen jaar.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel24
  - number: '24.3'
    text: |-
      In de jaarrekening legt het bevoegd gezag verantwoording af over het financieel beheer. Uit de jaarrekening blijkt
      dat sprake is van een rechtmatige aanwending van de rijksbekostiging. De jaarrekening omvat ook de gegevens die van
      belang zijn voor de verantwoording met betrekking tot de besteding van toegekende aanvullende bekostiging.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel24
  - number: '24.4'
    text: |-
      Het bevoegd gezag zendt het vastgestelde jaarverslag voor 1 juli van het jaar volgend op het boekjaar aan Onze
      Minister. Het jaarverslag gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door het
      bevoegd gezag aangewezen accountant. Bij de aanwijzing van de accountant bedingt het bevoegd gezag dat aan Onze
      Minister op diens verzoek inzage wordt geboden in de controlerapporten en de controledossiers van de accountant.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel24
  - number: '24.5'
    text: |-
      Indien het bevoegd gezag meer dan één school in stand houdt, wordt voor deze scholen een gezamenlijke balans en een
      gezamenlijke exploitatierekening vastgesteld. Bij de jaarrekening is een bijlage gevoegd die inzicht biedt in het
      bestedingspatroon ten aanzien van de afzonderlijke scholen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel24
  - number: '24.6'
    text: Bij ministeriële regeling wordt een model voor de inrichting van de jaarrekening vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel24
  - number: '24.7'
    text: |-
      Bij ministeriële regeling kan een leidraad worden vastgesteld over de inrichting en de uitvoering van de controle
      door de accountant.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel24
  - number: '25.1'
    text: |-
      Indien aan het bevoegd gezag van een school een aanvullende bekostiging is verstrekt onder de voorwaarde dat deze
      bekostiging voor het bij de verstrekking aangegeven doel wordt besteed, blijkt uit de jaarrekening van de school in
      hoeverre deze bekostiging voor dat doel is besteed.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel25
  - number: '25.2'
    text: |-
      Indien verrekening plaatsvindt of zal plaatsvinden van het daadwerkelijk bestede bedrag met de vastgestelde
      aanvullende bekostiging, maakt het bevoegd gezag in de desbetreffende jaarrekening melding van het daadwerkelijk
      bestede bedrag.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel25
  - number: '26.1'
    text: |-
      Onverminderd de bevoegdheid van de Inspectie van het onderwijs op grond van de [Wet op het onderwijstoezicht][ref1]
      kan Onze Minister een onderzoek instellen of doen instellen naar:


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: 26.1.a
    text: de jaarverslaggeving;
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel26
  - number: 26.1.b
    text: de gegevens die noodzakelijk zijn voor de vaststelling van de bekostiging;
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel26
  - number: 26.1.c
    text: de rechtmatigheid van de bestedingen; en
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel26
  - number: 26.1.d
    text: de doelmatigheid van het beheer van de school.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel26
  - number: '26.2'
    text: |-
      Indien uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging voor een school onjuist
      is vastgesteld, kan Onze Minister correcties aanbrengen op de bekostiging. Onze Minister doet het bevoegd gezag
      schriftelijk mededeling van een besluit tot het aanbrengen van een correctie op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel26
  - number: '26.3'
    text: |-
      Indien uit de jaarverslaggeving, bedoeld in [artikel 103, eerste lid, van de wet][ref1], uit de verklaring
      van de accountant, bedoeld in artikel 103, vierde lid, van de wet of uit een op grond van het eerste lid
      ingesteld onderzoek blijkt dat de bekostiging voor een school onrechtmatig is besteed of ondoelmatig is
      aangewend, kan Onze Minister bepalen dat het desbetreffende gedeelte van de bekostiging niet ten laste komt
      van het Rijk of dat de daarmee gemoeide bedragen in mindering worden gebracht op de bekostiging, onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '103'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '27'
    text: |-
      Een in [artikel 26, tweede lid][ref1], bedoelde correctie wordt, indien de correctie strekt tot verhoging van de
      bekostiging, binnen acht weken na de mededeling, bedoeld in artikel 26, tweede lid, door Onze Minister betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel26
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '26'
        hoofdstuk: '6'
  - number: '28.1'
    text: |-
      In geval van oprichting, verplaatsing of splitsing van een school kan Onze Minister afwijken van de teldatum en de
      op die afwijkende datum getelde leerlingen toerekenen aan de nieuwe scholen. Hij kan daarbij nadere voorschriften
      geven.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel28
  - number: '28.2'
    text: |-
      Onze Minister kan in verband met de aanvang of de beëindiging van de bekostiging van een school, van een
      scholengemeenschap of van een profiel aan een school voor vbo afwijken van de [artikelen 8][ref1] en [9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0045100#Artikel9
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0045100
        artikel: '9'
        hoofdstuk: '3'
  - number: '29'
    text: |-
      Bij samenvoeging van scholen als bedoeld in [artikel 72 van de wet][ref1] of afsplitsing van een of meer scholen
      van een scholengemeenschap als bedoeld in [artikel 64, derde lid, van de wet][ref2], op 1 augustus van enig
      kalenderjaar worden de bekostiging op grond van [artikel 79 van de wet][ref3], en de aanvullende bekostiging
      van alle bij de samenvoeging betrokken scholen dan wel van de bij de afsplitsing betrokken scholengemeenschap
      gehandhaafd tot het einde van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel79
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '64'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '79'
  - number: '30'
    text: |-
      Het bevoegd gezag doet binnen twee weken na een besluit tot opheffing van de school daarvan mededeling aan Onze
      Minister, gedeputeerde staten, de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1], en indien het een
      bijzondere school betreft, eveneens aan burgemeester en wethouders van de gemeente waarin de school is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: '31.1'
    text: |-
      Indien een school wordt opgeheven anders dan in verband met samenvoeging met een andere school of de aanspraak op
      bekostiging voor een school verloren gaat, stort het bevoegd gezag het exploitatie-overschot terug in ’s Rijks kas.
      Het neemt daarbij het derde lid in acht.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel31
  - number: '31.2'
    text: 'Voor de toepassing van dit artikel wordt onder exploitatie-overschot verstaan:'
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel31
  - number: 31.2.a
    text: |-
      het bedrag van de bekostiging, bedoeld in [artikel 96m, eerste lid, van de wet][ref1], verminderd met de lasten
      over dat jaar voor zover deze als rechtmatig kunnen worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96m
  - number: 31.2.b
    text: de reserveringen voor zover afkomstig uit ’s Rijks kas, met inbegrip van de ontvangen rentebaten; en
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel31
  - number: 31.2.c
    text: |-
      voor zover het een bijzondere school betreft, de niet bestede gedeelten van de uitkeringen op grond van de
      voorschriften inzake de gemeentelijke overschrijding.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel31
  - number: '31.3'
    text: |-
      Indien het exploitatie-overschot van een bijzondere school mede is opgebouwd uit uitkeringen als bedoeld in het
      tweede lid, onderdeel c, geldt als maatstaf voor de verdeling van dat deel van het exploitatie-overschot tussen het
      Rijk en de desbetreffende gemeente de verhouding tussen het ontvangen bedrag aan bekostiging van het Rijk en het
      ontvangen bedrag aan overschrijdingsuitkeringen van de gemeente in een periode van vijf jaren, voorafgaand aan het
      jaar van de beëindiging van de bekostiging. De verdeling behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel31
  - number: '32.1'
    text: |-
      Het samenwerkingsverband neemt in het ondersteuningsplan een datum op wanneer wordt vastgesteld of
      sprake is van een meer dan gemiddelde toename van het aantal ingeschreven leerlingen, bedoeld in
      [artikel 17a, achtste lid, onderdeel g, van de wet][ref1]. Deze vaststelling vindt in ieder geval plaats in de
      periode tussen 1 februari en 1 juni.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17a
  - number: '32.2'
    text: |-
      Indien een meer dan gemiddelde toename, bedoeld in het eerste lid, wordt vastgesteld, draagt het
      samenwerkingsverband voor het aantal leerlingen dat na 1 februari toelaatbaar is verklaard tot het voortgezet
      speciaal onderwijs per leerling een bedrag over aan de school waar de leerling is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel32
  - number: '32.3'
    text: |-
      Het bedrag, bedoeld in het tweede lid, is afhankelijk van de in de toelaatbaarheidsverklaring opgenomen
      ondersteuningsbehoefte van de leerling en wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel32
  - number: '32.4'
    text: De overdracht, bedoeld in het tweede lid, heeft betrekking op het kalenderjaar dat volgt op de teldatum.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel32
  - number: '34'
    text: |-
      [Hoofdstuk 6][ref1] is van overeenkomstige toepassing op een samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel34
    references:
