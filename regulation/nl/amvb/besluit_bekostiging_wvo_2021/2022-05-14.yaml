preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Basis- en Voortgezet Onderwijs en Media, van 12 februari 2021, nr.
    WJZ/26388334 (8374), directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 6h, tweede lid, 77, derde lid, 79, eerste lid, onderdeel a, en derde lid, 81, 82, derde
    lid, 96n, eerste lid, 96r, 106, 110a, derde lid, van de Wet op het voortgezet onderwijs, de artikelen 149, tweede
    lid, 152, tweede lid, 153, derde lid, en 154, van de Wet voortgezet onderwijs BES, de artikelen 2.2.1, derde lid,
    en 2.2.5, vierde lid, van de Wet educatie en beroepsonderwijs BES en artikel 8, vierde lid, van de Wet register
    onderwijsdeelnemers;

    De Afdeling advisering van de Raad van State gehoord (advies van 17 maart 2021, nr. W05.21.0034/I);

    Gezien het nader rapport van Onze Minister voor Basis- en Voortgezet Onderwijs en Media van 13 april 2021,
    nr. WJZ/27464360 (8374), directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *aanvullende bekostiging:* aanvullende bekostiging als bedoeld in de
      [artikelen 79a][ref1], [82][ref2] en [83 van de wet][ref3];
        - *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4];
        - *bevoegd gezag:* bevoegd gezag als bedoeld in [artikel 1 van de wet][ref5];
        - *bijzondere school:* bijzondere school als bedoeld in [artikel 1 van de wet][ref6];
        - *eerste schooldag:* 1 augustus of de dag waarop het onderwijs aan de school in enig schooljaar is aangevangen;
        - *havo:* hoger algemeen voortgezet onderwijs als bedoeld in [artikel 8 van de wet][ref7];
        - *hoofdvestiging:* hoofdvestiging als bedoeld in [artikel 73a van de wet][ref8];
        - *leerwegondersteunend onderwijs:* onderwijs als bedoeld in [artikel 10e van de wet][ref9];
        - *mavo:* middelbaar algemeen voortgezet onderwijs als bedoeld in [artikel 9 van de wet][ref10];
        - *nevenvestiging:* nevenvestiging als bedoeld in [artikel 73b van de wet][ref11];
        - *nieuwkomer:* leerling die: a. vreemdeling als bedoeld in [artikel 1 van de Vreemdelingenwet 2000][ref12] is,
      b. als werkelijk schoolgaand staat ingeschreven bij een school, c. geen Internationaal georiënteerd voortgezet
      onderwijs of Europees secundair onderwijs volgt, en d. op de teldatum korter dan twee jaar in Nederland verblijft;
        - *Onze Minister:* Onze Minister voor Basis- en Voortgezet Onderwijs en Media;
        - *openbare school:* openbare school als bedoeld in [artikel 1 van de wet][ref13];
        - *ouders:* met het gezag over de leerling belaste ouders, voogden of verzorgers;
        - *praktijkonderwijs:* praktijkonderwijs als bedoeld in [artikel 10f van de wet][ref14];
        - *samenwerkingsverband:* samenwerkingsverband als bedoeld in [artikel 1 van de wet][ref15];
        - *scholengemeenschap:* gemeenschap van twee of meer scholen voor voortgezet onderwijs;
        - *school:* school voor voortgezet onderwijs;
        - *schooljaar:* tijdvak van 1 augustus van enig kalenderjaar tot en met 31 juli van het daarop volgende
      kalenderjaar;
        - *teldatum:* datum van 1 oktober, bedoeld in [artikel 81 van de wet][ref16];
        - *uitkering:* een werkloosheidsuitkering, een suppletie inzake arbeidsongeschiktheid of een uitkering wegens
      ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref17],
        - *verticale scholengemeenschap:* verticale scholengemeenschap als bedoeld in
      [artikel 2.6.1 van de Wet educatie en beroepsonderwijs][ref18];
        - *vbo:* voorbereidend beroepsonderwijs als bedoeld in [artikel 10b van de wet][ref19];
        - *vmbo:* voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 21 van de wet][ref20];
        - *vwo:* voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 7 van de wet][ref21];
        - *wet:* [Wet op het voortgezet onderwijs][ref22].


