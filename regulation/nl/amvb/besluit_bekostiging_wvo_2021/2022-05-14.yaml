  - number: '2.1'
    text: |-
      Een vestiging van een school of scholengemeenschap komt in aanmerking voor het bedrag, bedoeld in
      [artikel 79, eerste lid, onderdeel a, van de wet][ref1] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
  - number: 2.1.a
    text: |-
      sprake is van een hoofdvestiging of een nevenvestiging, waaraan door Onze Minister een registratienummer als
      bedoeld in [artikel 5, eerste lid, onderdeel a, van het Besluit register onderwijsdeelnemers][ref1] is toegekend;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel5
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '5'
  - number: 2.1.b
    text: |-
      bij die vestiging op de teldatum ten minste 130 leerlingen of, indien sprake is van een vestiging waaraan
      uitsluitend praktijkonderwijs wordt verzorgd, 60 leerlingen, staan ingeschreven.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel2
  - number: '2.2'
    text: |-
      Bij het bepalen van het bedrag per vestiging, bedoeld in [artikel 79, eerste lid, onderdeel a, van de wet][ref1]
      wordt onderscheid gemaakt tussen een bedrag voor de hoofdvestiging van een school en een bedrag voor een
      nevenvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
  - number: '2.3'
    text: |-
      Bij het bepalen van het bedrag per leerling, bedoeld in [artikel 79, eerste lid, onderdeel b, van de wet][ref1]
      wordt onderscheid gemaakt tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
  - number: 2.3.a
    text: |-
      leerlingen in het praktijkonderwijs of in het derde of vierde leerjaar van de basisberoepsgerichte of
      kaderberoepsgerichte leerweg van het vbo; en
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel2
  - number: 2.3.b
    text: |-
      leerlingen in het vwo, havo, mavo of vbo, met uitzondering van leerlingen in het derde of vierde leerjaar van de
      basisberoepsgerichte en kaderberoepsgerichte leerweg van het vbo.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel2
  - number: '2.4'
    text: |-
      Een hoofd- of nevenvestiging van een scholengemeenschap komt in aanmerking voor aanvullende bekostiging als bedoeld
      in [artikel 82, derde lid, van de wet][ref1], indien aan die vestiging onderwijs wordt verzorgd in alle leerjaren
      van het vwo, havo, mavo en vbo. De hoogte van deze aanvullende bekostiging wordt vastgesteld bij ministeriële
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel82
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '82'
  - number: '3.1'
    text: |-
      Onze Minister stelt jaarlijks voor elke school of scholengemeenschap de hoogte van de bekostiging, bedoeld in
      [artikel 80 van de wet][ref1] vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel80
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '80'
  - number: '3.2'
    text: |-
      Onze Minister stelt voor elke school of scholengemeenschap die daarvoor in aanmerking komt het bedrag van de
      aanvullende bekostiging, bedoeld in de [artikelen 82][ref1] en [83][ref2] vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel83
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '83'
  - number: '3.3'
    text: |-
      De bekostiging bedoeld in het eerste lid komt tot stand door het aantal vestigingen, bedoeld in
      [artikel 2, eerste lid][ref1], en het aantal leerlingen, bedoeld in [artikel 8][ref2], te vermenigvuldigen met de
      bedragen per vestiging en per leerling, bedoeld in [artikel 79, eerste lid, van de wet][ref3], waarbij de uitkomst
      van deze vermenigvuldigingen bij elkaar wordt opgeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045100#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045100#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel79
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0045100
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0045100
        artikel: '8'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '79'
  - number: '4.1'
    text: |-
      Het Rijk verstrekt de bekostiging, bedoeld in de [artikelen 79][ref1] en [79a van de wet][ref2],
      met ingang van de eerste schooldag van een school waarvan het bekostigd onderwijs op grond van
      [afdeling I van titel III van de wet][ref3] een aanvang neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#AfdelingI
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 79a
      - id: ref3
        bwb_id: BWBR0002399
        afdeling: I
  - number: '4.2'
    text: |-
      Onze Minister kan op verzoek van het bevoegd gezag een door hem te bepalen deel van de bekostiging, bedoeld
      in de [artikelen 79][ref1] en [79a van de wet][ref2], verstrekken gedurende een periode van ten hoogste
      vier maanden voorafgaand aan de eerste schooldag van een school waarvan het bekostigd onderwijs op grond van
      [afdeling I van titel III van de wet][ref3] een aanvang neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#AfdelingI
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 79a
      - id: ref3
        bwb_id: BWBR0002399
        afdeling: I
  - number: '4.3'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld over de wijze waarop de bekostiging wordt vastgesteld
      en verstrekt.
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister brengt op de bekostiging, bedoeld in [artikel 96m, eerste lid, van de wet][ref1] voor een school voor
      een kalenderjaar een bedrag in mindering volgens de volgende formule: (PI/PL) x (A + B + C + D) In deze formule
      wordt verstaan onder: PI: de bekostiging, bedoeld in [artikel 79 van de wet][ref2] van de desbetreffende school
      voor het desbetreffende kalenderjaar; PL: de bekostiging, bedoeld in [artikel 79 van de wet][ref3], van alle
      scholen voor het desbetreffende kalenderjaar; A: de kosten van de uitkeringen in het desbetreffende kalenderjaar
      voor gewezen personeel van de scholen voortvloeiend uit een ontslag dat is geëffectueerd voor 1 augustus
      1995; B: de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van de scholen
      voortvloeiend uit een ontslag dat is geëffectueerd in de periode tussen 31 juli 1995 en 1 januari 2007 en waarvoor
      de rechtspersoon, bedoeld in [artikel 98b van de wet][ref4], zoals luidend op 31 december 2006, heeft ingestemd op
      grond van [artikel 96o, derde lid, tweede volzin, van de wet][ref5], zoals luidend op 31 december 2006, met het ten
      laste van bedoelde rechtspersoon brengen van de kosten van deze uitkeringen; C: een bij ministeriële regeling vast
      te stellen percentage van de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel
      van de scholen voortvloeiend uit een ontslag dat is geëffectueerd op of na 1 januari 2007, waarbij ten aanzien
      van de verschillende soorten uitkeringen verschillende percentages kunnen worden vastgesteld; D: de kosten van de
      uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van een school die de taken beëindigt, anders
      dan op grond van een samenvoeging, een bestuursoverdracht als bedoeld in [artikel 42c van de wet][ref6] indien
      het een openbare school betreft, en [artikel 50 van de wet][ref7] indien het een bijzondere school betreft, of een
      splitsing, indien het bevoegd gezag van deze school niet tevens een andere school onder zijn bestuur heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel42c
      [ref7]: https://wetten.overheid.nl/BWBR0002399#Artikel50
    url: https://wetten.overheid.nl/BWBR0045100/2022-05-14#Artikel5
    references:
