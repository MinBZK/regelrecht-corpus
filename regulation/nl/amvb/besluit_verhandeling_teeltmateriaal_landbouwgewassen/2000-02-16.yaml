preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 21 juli 1997, No J.977850, Directie
    Juridische Zaken;


    Gelet op artikel 91, vierde lid, van de Zaaizaad- en Plantgoedwet;


    De Raad van State gehoord (advies van 18 augustus 1997, No. W.11.97.0506);


    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 25 november 1997, No. J.
    9712924, Directie Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009072/2000-02-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;

      b. NAK: Stichting Nederlandse Algemene Keuringsdienst voor zaaizaad en pootgoed van landbouwgewassen;

      c. document: schriftelijk bewijsstuk, ingericht overeenkomstig een door Onze Minister vastgesteld model waarin
      wordt aangegeven dat het betrokken teeltmateriaal door de NAK is goedgekeurd dan wel met toestemming van de NAK in
      het verkeer is gebracht en verder verhandeld mag worden;

      d. EEG-richtlijnen:

      1. [richtlijn nr. 66/400/EEG](31966L0400), betreffende het in de handel brengen van bietenzaad (PbEG L 125);

      2. [richtlijn nr. 66/401/EEG](31966L0401), betreffende het in de handel brengen van zaaizaad van
      groenvoedergewassen (PbEG L 125);

      3. [richtlijn nr. 66/402/EEG](31966L0402), betreffende het in de handel brengen van zaaigranen (PbEG L 125);

      4. [richtlijn nr. 66/403/EEG](31966L0403), betreffende het in de handel brengen van pootaardappelen (PbEG L 125);

      5. [richtlijn nr. 69/208/EEG](31969L0208), betreffende het in de handel brengen van zaaizaad van oliehoudende
      planten en vezelgewassen (PbEG L 169).

      2 Een wijziging van de EEG-richtlijnen gaat voor de toepassing van [artikel 2, tweede lid][ref1], gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven. .


      [ref1]: https://wetten.overheid.nl/BWBR0009072#Artikel2
    url: https://wetten.overheid.nl/BWBR0009072/2000-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009072
        artikel: '2'
  - number: '2'
    text: >-
      1 Het bezit met het oog op verkoop, het aanbieden voor verkoop, het bedrijfsmatig in het verkeer brengen, verder
      verhandelen, invoeren, uitvoeren en ten uitvoer aanbieden van teeltmateriaal van de in het Aansluitingsbesluit NAK
      (Stb. 1967, 217) genoemde gewassen alsmede het doen verrichten van deze handelingen is verboden.


      2 Het bepaalde in het eerste lid geldt niet indien dat materiaal:


      a. voldoet aan de eisen gesteld bij door Onze Minister goedgekeurde voorschriften van de NAK, ter zake van de
      gezondheid, rasechtheid, raszuiverheid, kwaliteit, sortering, classificering en verpakking;


      b. voor zover in Nederland voortgebracht, door de NAK is goedgekeurd;


      c. ten bewijze van het in de onderdelen a en b bepaalde wordt begeleid door een geldig document, en


      d. indien het een genetisch gemodificeerd organisme betreft, als zodanig in de verkoopcatalogus wordt vermeld.


      3 Het bepaalde in het eerste lid geldt niet indien dat materiaal, voor zover ingevoerd, vrij is van tekortkomingen
      en ten bewijze daarvan wordt begeleid door een schriftelijk bewijsstuk dat voldoet aan de vereisten van de EEG-
      richtlijnen.


      4 Het in het eerste lid bepaalde is niet van toepassing op hem die ter zake van de in het eerste lid bedoelde
      handelingen is aangesloten bij de NAK en die zich heeft onderworpen aan de door die instelling met betrekking tot
      die handelingen vastgestelde en door Onze Minister goedgekeurde regelen.
    url: https://wetten.overheid.nl/BWBR0009072/2000-02-16#Artikel2
  - number: '3'
    text: >-
      1 De keuring, waaronder wordt begrepen herkeuring van teeltmateriaal en de afgifte van documenten geschiedt door de
      NAK overeenkomstig de door Onze Minister goedgekeurde voorschriften van die keuringsinstelling.


      2 Onverminderd de weigering tot goedkeuring of afgifte van documenten op grond van de in het eerste lid bedoelde
      voorschriften, wordt niet tot het nemen van een keuringsbeslissing of tot afgifte van documenten overgegaan indien
      aan de NAK onvoldoende gegevens ter beschikking staan omtrent de hoedanigheid of de herkomst van het materiaal of
      omtrent de grootte van de verworven partij, waaruit het teeltmateriaal is afgezonderd, onderscheidenlijk de grootte
      van de af te leveren partij.
    url: https://wetten.overheid.nl/BWBR0009072/2000-02-16#Artikel3
  - number: '4'
    text: |-
      1 Hij die teeltmateriaal van de in het Aansluitingsbesluit NAK genoemde landbouwgewassen bezit met het oog op
      verkoop, aanbiedt voor verkoop, bedrijfsmatig in het verkeer brengt, verder verhandelt, invoert, uitvoert en ter
      uitvoer aanbiedt alsmede die deze handelingen daarmee doet verrichten dient een volledige administratie ten aanzien
      van deze handelingen met teeltmateriaal bij te houden.

      2 De in het eerste lid genoemde administratie dient zodanig te zijn ingericht dat op eenvoudige wijze kan worden
      nagegaan op welke tijdstippen, in welke hoeveelheid en van respectievelijk aan welke bedrijven welk teeltmateriaal
      werd verworden respectievelijk geleverd.

      3 Ter verkrijging van de in [artikel 3, tweede lid][ref1], bedoelde gegevens, zal respectievelijk zullen aan de
      door de NAK met de keuring belaste personen:

      a. vrije toegang tot het bedrijf en de bedrijfsgebouwen alsmede inzage in de in het eerste lid bedoelde
      administratie worden verleend;

      b. de gevraagde inlichtingen, gegevens en administratieve bescheiden worden verstrekt;

      c. hulp en hulpmiddelen om niet ter beschikking worden gesteld en monsternemingen om niet worden toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009072#Artikel3
    url: https://wetten.overheid.nl/BWBR0009072/2000-02-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009072
        artikel: '3'
  - number: '5'
    text: |-
      De NAK stelt aan de belanghebbenden op aanvraag de in de [artikelen 2, tweede lid, onderdeel a][ref1] en
      [3, eerste lid][ref2], bedoelde voorschriften ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0009072#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009072#Artikel3
    url: https://wetten.overheid.nl/BWBR0009072/2000-02-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009072
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009072
        artikel: '3'
  - number: '6'
    text: |-
      Een belanghebbende kan tegen een besluit als bedoeld in [artikel 3, tweede lid][ref1], beroep instellen bij Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009072#Artikel3
    url: https://wetten.overheid.nl/BWBR0009072/2000-02-16#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009072
        artikel: '3'
  - number: '8'
    text: >-
      1 Onze Minister kan vrijstelling en op aanvraag ontheffing verlenen van hetgeen bij of krachtens dit besluit is
      geregeld.


      2 Aan vrijstellingen en ontheffingen, bedoeld in het eerste lid, kunnen voorschriften worden verbonden. Zij kunnen
      onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0009072/2000-02-16#Artikel8
  - number: '9'
    text: >-
      Na inwerkingtreding van dit besluit berusten de krachtens het Besluit verhandeling teeltmateriaal landbouwgewassen
      vastgestelde regelen en andere besluiten op dit besluit.
    url: https://wetten.overheid.nl/BWBR0009072/2000-02-16#Artikel9
  - number: '10'
    text: >-
      1 Het Besluit verhandeling teeltmateriaal landbouwgewassen wordt ingetrokken.


      2 Dit besluit treedt in werking op de dag na de datum van uitgifte van het Staatsblad waarin het wordt geplaatst.


      3 In afwijking van het bepaalde in het tweede lid treedt artikel 7 van dit besluit in werking zodra een voorstel
      van wet dat de bevoegdheid schept tot het stellen van regelen omtrent een vergoeding kracht van wet heeft
      verkregen.
    url: https://wetten.overheid.nl/BWBR0009072/2000-02-16#Artikel10
  - number: '11'
    text: Dit besluit kan worden aangehaald als «Besluit verhandeling teeltmateriaal landbouwgewassen».
    url: https://wetten.overheid.nl/BWBR0009072/2000-02-16#Artikel11
