$id: besluit_asbestvrije_frictiematerialen_wet_milieugevaarlijke_stoffen
regulatory_layer: AMVB
publication_date: '2005-01-11'
valid_from: '1991-12-01'
bwb_id: BWBR0005207
url: https://wetten.overheid.nl/BWBR0005207/1991-12-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 25 juli 1990, nr.
    MJZ250790046, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Overwegende dat het ter bescherming van mens en milieu wenselijk is de uitworp van asbest te voorkomen en te
    beperken door regelen te stellen ten aanzien van de vervaardiging, de invoer, het voorhanden hebben, het monteren
    en het ter beschikking stellen van asbesthoudende frictiematerialen voor motorrijtuigen;

    Gelet op de artikelen 24 en 61 van de Wet milieugevaarlijke stoffen (Stb. 1985, 639);

    Gezien het advies van de Centrale raad voor de milieuhygiëne van 8 november 1989, (no.CRMH: S-89/1410);

    De Raad van State gehoord (advies van 28 december 1990, nr. W08.900363);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 12
    september 1991, nr. MJZ10991047, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005207/1991-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt verstaan onder:

      motorrijtuigen: rij- of voertuigen op meer dan drie wielen, bestemd om anders dan langs spoorstaven te worden
      voortbewogen, uitsluitend of mede door een daarop of daaraan aanwezige mechanische kracht, indien de door de
      constructie bepaalde ten hoogste toegelaten snelheid ten minste 50 kilometer per uur is en indien de ten hoogste
      toegelaten massa niet meer is dan 3500 kilogram;

      frictiematerialen: de koppelingsplaat, remblokken en remschoenen, met inbegrip van alle daarop aangebrachte
      materialen;

      asbest: 'stoffen die een of meer van de volgende vezelachtige silicaten bevatten:'








                    - actinoliet


                  Cas-nummer 77536-66-4




                    - amosiet


                  Cas-nummer 12172-73-5




                    - anthofylliet


                  Cas-nummer 77536-67-5




                    - chrysotiel


                  Cas-nummer 12001-29-5




                    - tremoliet


                  Cas-nummer 77536-68-6.
    url: https://wetten.overheid.nl/BWBR0005207/1991-12-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden frictiematerialen die asbest bevatten, te monteren in een motorrijtuig.

      2 Het eerste lid is niet van toepassing ten aanzien van motorrijtuigen die behoren tot een type waarvoor geen
      asbestvrije frictiematerialen zijn vermeld:

      a. in de bescheiden bedoeld in bijlage I bij de Richtlijn van de Raad van de Europese Gemeenschappen van 6
      februari 1970 inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten betreffende de goedkeuring van
      motorvoertuigen en aanhangwagens daarvan (70/156/EEG, *PbEG* L 42), dan wel

      b. in de bescheiden bedoeld in paragraaf 3 van Reglement 13, aanhangsel 12, behorende bij de overeenkomst van
      20 maart 1958 betreffende het aannemen van eenvormige goedkeuringsvoorwaarden en de wederzijdse erkenning van
      uitrustingsstukken en onderdelen van motorrijtuigen (*Trb.* 1959, 83),

      die zijn overgelegd door de fabrikant of importeur aan de keuringsinstantie ter gelegenheid van een EEG-
      goedkeuring, of ECE-goedkeuring, als bedoeld in die richtlijn, onderscheidenlijk in die overeenkomst.

      3 Voor de toepassing van dit artikel worden onder de bijlage bedoeld in het tweede lid, mede begrepen de
      wijzigingen die daarin zijn aangebracht, laatstelijk bij de Richtlijn van de Raad van 25 juni 1987 (87/358/
      EEG, *PbEG* L 192), alsmede, nadat daarvan door Onze Minister kennisgeving is gedaan in de *Staatscourant*, de
      wijzigingen die daarna worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0005207/1991-12-01#Artikel2
  - number: '3'
    text: |-
      Het is verboden voor motorrijtuigen frictiematerialen die asbest bevatten, te vervaardigen, in Nederland in te
      voeren, voorhanden te hebben of aan een ander ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0005207/1991-12-01#Artikel3
  - number: '4'
    text: |-
      De [artikelen 2][ref1] en [3][ref2] zijn niet van toepassing op handelingen die betrekking hebben op
      frictiematerialen die zijn bestemd voor motorrijtuigen:

      a. die voor 1 oktober 1985 in het verkeer zijn gebracht, of

      b. die nog niet in het verkeer zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005207#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005207#Artikel3
    url: https://wetten.overheid.nl/BWBR0005207/1991-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005207
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005207
        artikel: '3'
  - number: '5'
    text: |-
      [Artikel 3][ref1] is voorts niet van toepassing:

      a. tot 1 januari 1993, indien wordt aangetoond dat de frictiematerialen zijn bestemd voor toepassing buiten
      Nederland;

      b. ten aanzien van frictiematerialen die zijn bestemd voor motorrijtuigen die zijn aangemeld overeenkomstig
      [artikel 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005207#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005207#Artikel7
    url: https://wetten.overheid.nl/BWBR0005207/1991-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005207
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005207
        artikel: '7'
  - number: '6'
    text: |-
      Degene die asbesthoudende frictiematerialen aan een ander ter beschikking stelt of in Nederland invoert, is
      verplicht ervoor zorg te dragen dat:

      a. op eenvoudige en snelle wijze voor de verkrijger is na te gaan voor welke merken, modeljaren en typen
      motorrijtuigen de desbetreffende frictiematerialen zijn bestemd met inachtneming van het bepaalde in dit besluit;

      b. op de verpakking is vermeld:

      Montage van dit materiaal mag uitsluitend geschieden in auto's waarvoor dit bestemd is.
    url: https://wetten.overheid.nl/BWBR0005207/1991-12-01#Artikel6
  - number: '7'
    text: |-
      1 Ieder jaar voor 1 maart geven de fabrikanten en importeurs van motorrijtuigen aan Onze Minister, onder aanduiding
      van de typenaam, op, voor welke motorrijtuigen die zij het afgelopen jaar afgeleverd hebben, geen asbestvrije
      frictiematerialen zijn vermeld in de in [artikel 2, tweede lid][ref1] bedoelde bescheiden.

      2 In het eerste jaar omvat de opgave, bedoeld in het eerste lid, mede de modeljaren vanaf 1 oktober 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0005207#Artikel2
    url: https://wetten.overheid.nl/BWBR0005207/1991-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005207
        artikel: '2'
  - number: '8'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin het is geplaatst, met dien verstande dat ten aanzien van door Onze Minister aan te wijzen
      motorrijtuigen [artikel 2][ref1] en [artikel 3][ref2] voor zover dit betrekking heeft op het voorhanden hebben en
      aan een ander ter beschikking stellen, eerst gelden met ingang van de eerste dag van de twintigste maand na die
      datum van uitgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0005207#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005207#Artikel3
    url: https://wetten.overheid.nl/BWBR0005207/1991-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005207
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005207
        artikel: '3'
  - number: '9'
    text: Dit besluit kan worden aangehaald als Besluit asbestvrije frictiematerialen Wet milieugevaarlijke stoffen.
    url: https://wetten.overheid.nl/BWBR0005207/1991-12-01#Artikel9
