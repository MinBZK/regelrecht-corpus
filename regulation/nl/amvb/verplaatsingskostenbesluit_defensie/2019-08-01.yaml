  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder: - *achtergebleven kind:* het buiten het land van plaatsing verblijf houdende
      ongehuwde kind van de defensieambtenaar, dat minderjarig is of voor wie aanspraak bestaat op kinderbijslag dan
      wel op studiefinanciering in de zin van de [Wet studiefinanciering 2000][ref1]. Voor de toepassing van dit besluit
      duurt de minderjarigheid voort tot en met 31 december van het kalenderjaar waarin het kind de leeftijd van 18 jaar
      bereikt.
        - *afstand:* a. bij gebruik van openbaar vervoer: de gebruikelijke reisroute; b. bij gebruik van ander vervoer
      dan openbaar vervoer: het aantal kilometers gemeten langs de gebruikelijke openbare weg te bepalen aan de hand
      van een bij ministeriële regeling vastgestelde routeplanner, met dien verstande dat bij meer dan één plaats van
      tewerkstelling die zich niet binnen één complex of terrein bevinden de grootste afstand geldt;
        - *ambtenaar:* degene die bij het Ministerie van Defensie in burgerlijke openbare dienst is aangesteld.
        - *ambts- of dienstwoning:* de door het bevoegde gezag aan de defensieambtenaar in verband met de uitoefening van
      zijn functie toegewezen woning.
        - *bevoegd gezag:* de bij ministeriële regeling als zodanig aangewezen autoriteiten.
        - *defensieambtenaar:* de ambtenaar of de militair.
        - *eigen huishouding voeren:* het anders dan bij de eigen, stief- of pleegouders van de defensieambtenaar of van
      zijn partner, bewonen van zelfstandige woonruimte, aangetoond door middel van inschrijving in de basisregistratie
      personen en een rechtsgeldig huurcontract of notariële leveringsakte van de koopwoning op naam van de
      defensieambtenaar of diens partner.
        - *Europa:* Europa inclusief Turkije.
        - *gezinsleden:* de partner van de defensieambtenaar en de eigen, stief- of pleegkinderen van de defensieambtenaar
      zelf of van zijn partner, voor zover zij met hem samenwonen en in geval van vestiging buiten Nederland ter zake
      goedkeuring is verkregen van de Minister.
        - *militair (tenzij uitdrukkelijk anders is bepaald):* De militair in de zin van
      [artikel 1, eerste lid, onderdeel c, ten eerste, van het Algemeen militair ambtenarenreglement][ref2], daaronder
      begrepen hij die is aangesteld in burgerlijke openbare dienst om in de krijgsmacht als geestelijk verzorger
      doorlopend werkzaam te zijn.
        - *Minister:* Onze Minister van Defensie.
        - *Partner:* degene die naar Nederlands recht met de defensieambtenaar is gehuwd alsmede degene die mede onder
      dit begrip wordt verstaan op grond van [artikel 4 van het Burgerlijk ambtenarenreglement defensie][ref3] of
      [artikel 1, derde lid van het Algemeen militair ambtenarenreglement][ref4].
        - *plaats van legering:* de gebruikelijke ingang van het gebouw, gebouwencomplex, terrein of vaartuig waar hem door
      het bevoegd gezag nachtverblijf van rijkswege wordt geboden.
        - *plaats van tewerkstelling:* de gebruikelijke ingang van het gebouw, gebouwencomplex, terrein of vaartuig waar de
      defensieambtenaar gewoonlijk zijn werkzaamheden verricht, dan wel indien de uitoefening van het ambt zich uitstrekt
      over een bepaald gebied, een door het bevoegd gezag aangewezen plaats.
        - *rijksdienst:* de organisatie van de rijksoverheid.
        - *standplaats:* de gemeente of het bij name genoemde deel van die gemeente, waar de plaats van tewerkstelling van
      de defensieambtenaar is gelegen, dan wel indien de plaats van tewerkstelling een vaartuig is, de door het bevoegd
      gezag aangewezen plaats.
        - *verplaatsing:* verandering van standplaats die naar het oordeel van het bevoegd gezag een permanent karakter
      heeft.
        - *voor het eerst in dienst treden:* in dienst treden bij het Ministerie van Defensie of een van zijn diensten,
      bedrijven of instellingen, anders dan in geval van overgang binnen een maand: 1. van de ene naar de andere tak
      van de rijksdienst; 2. van een andere overheidsdienst of een door het Rijk bekostigde onderwijsinstelling naar
      de rijksdienst.
        - *woongebied:* een zodanig gebied waarbij de afstand van de woning naar de plaats van tewerkstelling niet meer
      bedraagt dan 25 kilometer, vast te stellen bij gebruik van ander vervoer dan openbaar vervoer, alsmede een bij
      ministeriële regeling goedgekeurde plaats van vestiging.
        - *zelfstandige woonruimte:* woonruimte voorzien van een eigen toegangsdeur die van binnen en buiten kan worden
      afgesloten. In de woonruimte moeten in elk geval aanwezig zijn: – een eigen woon(slaap)kamer, – een eigen
      keuken met aanrecht, aan- en afvoer voor water en een aansluitpunt voor een kooktoestel, – een eigen toilet met
      waterspoeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Artikel1
