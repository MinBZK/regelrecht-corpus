  - number: '1.2'
    text: |-
      Aan dit besluit kunnen geen aanspraken worden ontleend door defensieambtenaren op wie voorzieningen ter
      zake van verblijf buiten Nederland van toepassing zijn die overeenkomen met aanspraken op grond van het
      [Reglement Dienst Buitenlandse Zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004052
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004052
  - number: '1.3'
    text: |-
      De ambtenaar bedoeld in [artikel 8a, eerste lid, van het Burgerlijk ambtenarenreglement defensie][ref1] die als
      gevolg van een functiewisseling in het kader van de mobiliteitsbevordering van standplaats verandert ontleent aan
      dit besluit de aanspraken die gelden voor de militair.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel8a
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 8a
  - number: '2.1'
    text: |-
      De defensieambtenaar die ingevolge een op grond van [artikel 75 Burgerlijke ambtenarenreglement defensie][ref1]
      dan wel [artikel 143 Algemeen militair ambtenarenreglement][ref2] defensie opgelegde verplichting verhuist
      naar een nader door het bevoegd gezag aangegeven plaats of gebied, heeft aanspraak op een tegemoetkoming in de
      verhuiskosten, mits de verhuizing plaatsvindt uiterlijk twee jaren na de datum waarop de verplichting is ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel143
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '143'
  - number: '2.2'
    text: |-
      De defensieambtenaar, bedoeld in het eerste lid, die is verhuisd en van de in het eerste lid bedoelde verplichting
      wordt ontheven, heeft aanspraak op een tegemoetkoming in de verhuiskosten, mits de verhuizing plaatsvindt binnen
      twee jaren na de ontheffing.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: '2.3'
    text: |-
      Het opleggen van de verplichting te verhuizen naar een nader door het bevoegd gezag aangegeven plaats of gebied
      geschiedt:
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: 2.3.a
    text: indien naar het oordeel van het bevoegd gezag de aard van de werkzaamheden een zeer korte reactietermijn vereist;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: 2.3.b
    text: bij een verhuizing in verband met een verplaatsing naar Nederland;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: 2.3.c
    text: bij een verhuizing in verband met een verplaatsing naar een land buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: '2.4'
    text: |-
      Ten aanzien van verhuizingen als bedoeld in het eerste lid, is de tegemoetkoming in de verhuiskosten gelijk aan een
      tegemoetkoming in:
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: 2.4.a
    text: |-
      de reis- en verblijfkosten binnen Nederland die voor de defensieambtenaar en zijn echtgenote zijn verbonden aan een
      reis ter bezichtiging van woonruimte;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: 2.4.b
    text: |-
      de reis- en verblijfkosten bij een verplaatsing naar een land buiten Nederland, die voor de defensieambtenaar en
      zijn echtgenote zijn verbonden aan een reis ter bezichtiging van onder meer woonruimte en scholen;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: 2.4.c
    text: |-
      de reis- en verblijfkosten die voor de defensieambtenaar en zijn gezinsleden zijn verbonden aan de reis naar de
      nieuwe woning;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: 2.4.d
    text: de transportkosten;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: 2.4.e
    text: |-
      de kosten van de tussenpersoon, voor zover deze in rekening wordt gebracht ter verwerving van een huurwoning en de
      inschakeling van een tussenpersoon naar het oordeel van het bevoegd gezag voor het Rijk tot aanmerkelijk voordeel
      leidt;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: 2.4.f
    text: |-
      overige kosten, mits een eigen huishouding wordt gevoerd op de datum van de verplaatsing of de indiensttreding en
      de eigen huishouding wordt voorgezet na de verhuizing.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: '2.5'
    text: |-
      Bij ministeriële regeling worden nadere voorwaarden vastgesteld omtrent een nader door het bevoegd gezag aangegeven
      plaats of gebied, bedoeld in het eerste lid, de maximale duur van de reis, bedoeld in het vierde lid, onder b, de
      transportkosten bedoeld in het vierde lid onder d en de overige kosten, bedoeld in het vierde lid, onder f.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel2
  - number: '3.1'
    text: |-
      De defensieambtenaar die bij verplaatsing verhuist naar het woongebied van zijn nieuwe standplaats, heeft
      aanspraak op een tegemoetkoming in de verhuiskosten mits de verhuizing plaatsvindt binnen twee jaren na de datum
      van de verplaatsing, dan wel binnen zes maanden voor de datum van de verplaatsing en indien door de verhuizing
      de reisafstand tussen de woning en de plaats van tewerkstelling met ten minste 60% wordt bekort en, indien hij
      militair is voorafgaand aan de verhuizing, een eigen huishouding voerde.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel3
  - number: '3.2'
    text: |-
      De defensieambtenaar aan wie in verband met een verhuizing op grond van het eerste lid een tegemoetkoming in
      verhuiskosten is toegekend, betaalt deze tegemoetkoming terug indien hem binnen twee jaren na de verhuizing ontslag
      op aanvraag wordt verleend, hij tengevolge van aan hem te wijten feiten of omstandigheden binnen twee jaren na de
      verhuizing wordt ontslagen of indien hij buiten het woongebied gaat wonen.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel3
  - number: '3.3'
    text: |-
      Overgang binnen een maand naar een andere functie binnen de rijksdienst wordt niet als een ontslag op aanvraag
      beschouwd, tenzij de defensieambtenaar als gevolg van die overgang moet verhuizen met aanspraak op een
      tegemoetkoming in verhuiskosten.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel3
  - number: '4.1'
    text: |-
      Het bevoegd gezag kan de defensieambtenaar die bij indiensttreding een eigen huishouding voert, eenmalig aanspraak
      verlenen op een tegemoetkoming in de verhuiskosten mits de verhuizing plaatsvindt binnen twee jaren na de datum van
      de indiensttreding en hij verhuist naar het woongebied en door de verhuizing de reisafstand tussen de woning en de
      plaats van tewerkstelling met ten minste 60% wordt bekort.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel4
  - number: '4.2'
    text: |-
      De defensieambtenaar aan wie in verband met een verhuizing op grond van het eerste lid een tegemoetkoming in
      verhuiskosten is toegekend, betaalt deze tegemoetkoming terug indien hem binnen twee jaren na de verhuizing ontslag
      op aanvraag wordt verleend en indien hij tengevolge van aan hem te wijten feiten of omstandigheden binnen twee
      jaren na de verhuizing wordt ontslagen of indien hij buiten het woongebied gaat wonen.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel4
  - number: '4.3'
    text: |-
      Overgang binnen een maand naar een andere functie binnen de rijksdienst wordt niet als een ontslag op aanvraag
      beschouwd, tenzij de defensieambtenaar als gevolg van die overgang moet verhuizen met aanspraak op een
      tegemoetkoming in verhuiskosten.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel4
  - number: '5.1'
    text: |-
      Een tegemoetkoming in de verhuiskosten bij vrijwillige verandering van woonplaats binnen Nederland kan slechts
      worden verleend, verband houdende met:
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel5
  - number: 5.1.a
    text: een ontslag, ter zake waarvan de ambtenaar recht heeft op dadelijk ingaand pensioen;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel5
  - number: 5.1.b
    text: |-
      een ontslag dat de ambtenaar anders dan op eigen aanvraag is verleend en niet het gevolg is van aan hem te wijten
      feiten of omstandigheden;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel5
  - number: '5.2'
    text: |-
      Een tegemoetkoming als bedoeld in het eerste lid wordt slechts verleend, indien de ambtenaar in een periode
      van minder dan tien jaar voorafgaande aan het beëindigen van het dienstverband is verhuisd ten gevolge van een
      verplaatsing en het bevoegd gezag een verhuizing van het gezin naar de oude woonomgeving noodzakelijk acht. Het
      bevoegd gezag wint daarbij een bedrijfsmaatschappelijk advies in.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel5
  - number: '6'
    text: |-
      Aan de nagelaten gezinsleden van de defensieambtenaar wordt een tegemoetkoming in de kosten van verhuizing naar of
      in Nederland toegekend, indien de defensieambtenaar komt te overlijden, nadat hij met de gezinsleden met toekenning
      van een tegemoetkoming in de verhuiskosten is verhuisd naar een buiten Nederland gelegen land of naar een ambts-
      of dienstwoning.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel6
  - number: '7'
    text: |-
      De militair die met toekenning van een tegemoetkoming in de verhuiskosten is verhuisd naar een buiten Nederland
      gelegen land of naar een ambts- of dienstwoning en wordt ontslagen heeft aanspraak op een tegemoetkoming in de
      kosten van een verhuizing naar of in Nederland indien het een ontslag betreft:
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel7
  - number: 7.a
    text: |-
      met recht op een uitkering ingevolge de [Uitkeringswet gewezen militairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002540
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002540
  - number: 7.b
    text: met recht op dadelijk ingaand pensioen;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel7
  - number: 7.c
    text: anders dan op eigen aanvraag en niet het gevolg zijnde van aan hem te wijten feiten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel7
  - number: '8.1'
    text: |-
      De ambtenaar aan wie tijdens zijn plaatsing buiten Nederland die anders dan op eigen aanvraag en niet wegens aan
      hem te wijten feiten of omstandigheden wordt ontslagen, wordt een tegemoetkoming in de verhuiskosten voor terugkeer
      naar Nederland verleend.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel8
  - number: '8.2'
    text: |-
      De ambtenaar aan wie tijdens zijn plaatsing buiten Nederland ontslag op aanvraag wordt verleend of die niet op
      aanvraag wordt ontslagen als gevolg van aan hem te wijten feiten of omstandigheden, wordt naar bij ministeriële
      regeling te stellen regels een gedeeltelijke tegemoetkoming in de verhuiskosten verleend voor terugkeer naar
      Nederland.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel8
  - number: '9.1'
    text: |-
      De ambtenaar die in opdracht van het bevoegde gezag, anders dan in verband met een verplaatsing of indiensttreding,
      een ambts- of dienstwoning betrekt of verlaat, wordt een tegemoetkoming in verhuiskosten verleend.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel9
  - number: '9.2'
    text: |-
      Indien het verlaten van een ambts- of dienstwoning samenhangt met een ontslag op aanvraag of met een ontslag als
      gevolg van aan de ambtenaar te wijten feiten of omstandigheden wordt naar ministeriële regeling vast te stellen
      regels een gedeeltelijke tegemoetkoming in de verhuiskosten verleend.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel9
  - number: '10'
    text: |-
      Indien verhuizing in het belang van de defensieambtenaar of zijn gezinsleden naar het oordeel van de
      bedrijfsgeneeskundige dienst sociaal en of medisch noodzakelijk is, kan het bevoegd gezag aanspraak verlenen op een
      tegemoetkoming in de verhuiskosten.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel10
  - number: '11'
    text: |-
      De aanspraak op een tegemoetkoming in de verhuiskosten ingevolge de [artikelen 5 tot en met 10][ref1] vervalt
      indien de verhuizing niet plaatsvindt binnen een jaar na de datum van het ontslag, het overlijden of de datum
      waarop het bevoegde gezag wegens sociale en of medische noodzaak aanspraak heeft verleend op een tegemoetkoming in
      de verhuiskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel5
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '5'
  - number: '12.1'
    text: |-
      Ten aanzien van verhuizingen anders dan als bedoeld in [artikel 2, eerste lid][ref1], is de tegemoetkoming in de
      verhuiskosten gelijk aan een tegemoetkoming in:


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel2
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '2'
  - number: 12.1.a
    text: |-
      de reis- en verblijfkosten die voor de defensieambtenaar en zijn gezin zijn verbonden aan de reis naar de nieuwe
      woning, mits het een verhuizing betreft van, naar of in een buiten Nederland gelegen land;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel12
  - number: 12.1.b
    text: transportkosten;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel12
  - number: 12.1.c
    text: |-
      overige kosten, mits een eigen huishouding wordt gevoerd op de datum van de verplaatsing of de indiensttreding en
      de eigen huishouding wordt voortgezet na de verhuizing.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel12
  - number: '12.2'
    text: |-
      Bij ministeriële regeling worden nadere voorwaarden vastgesteld omtrent de transportkosten bedoeld in het eerste
      lid onder b en de overige kosten, bedoeld in het eerste lid, onder c.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel12
  - number: '13'
    text: |-
      Ten aanzien van verhuizingen als bedoeld in dit hoofdstuk die in eigen beheer worden uitgevoerd, wordt het bedrag
      van de tegemoetkoming vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel13
  - number: '14'
    text: |-
      De tegemoetkoming in de reis- en verblijfkosten, bedoeld in de [artikelen 2][ref1] en [12][ref2], wordt bepaald aan
      de hand van het gestelde bij of krachtens het [Besluit dienstreizen defensie][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032312#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032312
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0007956
  - number: '15.1'
    text: |-
      Onder de transportkosten, bedoeld in de [artikelen 2][ref1] en [12][ref2], worden bij een verhuizing binnen
      Nederland verstaan de kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032312#Artikel12
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032312
        artikel: '12'
  - number: 15.1.a
    text: het transport van de inboedel en de bagage van de defensieambtenaar en de medeverhuizende gezinsleden;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: 15.1.b
    text: het in- en uitpakken van de inboedel alsmede het (de)monteren van het meubilair;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: 15.1.c
    text: de verzekering van de inboedel en de bagage tegen schade ten gevolge van of in verband met de verhuizing.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: '15.2'
    text: |-
      Onder de transportkosten, bedoeld in de [artikelen 2][ref1] en [12][ref2], worden bij een verhuizing van, naar of
      buiten Nederland verstaan de kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032312#Artikel12
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032312
        artikel: '12'
  - number: 15.2.a
    text: het transport van de inboedel van de defensieambtenaar en de medeverhuizende gezinsleden;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: 15.2.b
    text: het in- en uitpakken van de inboedel alsmede het (de)monteren van meubilair en de afvoer van emballage;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: 15.2.c
    text: |-
      de opslag en het transport van de in Nederland achtergelaten inboedel voor zover het een verhuizing betreft naar
      een land gelegen buiten Europa met uitzondering van Kreta;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: 15.2.d
    text: het transport van de bagage van de militair en de gezinsleden;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: 15.2.e
    text: de verschuldigde invoerrechten bij invoer van de bagage en de inboedel;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: 15.2.f
    text: |-
      de verzekering van de bagage en de inboedel tegen schade ten gevolge van of in verband met de verhuizing alsmede de
      verzekering van de inboedel in geval van opslag;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: 15.2.g
    text: |-
      het transport van één personenauto of motorrijwiel indien het betreft een verplaatsing naar een land buiten Europa
      en terug.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: '15.3'
    text: |-
      De Minister wijst een of meer verhuisbedrijven aan ter verzorging van het transport, bedoeld in het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: '15.4'
    text: Bij ministeriële regeling worden nadere voorwaarden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel15
  - number: '16'
    text: |-
      De defensieambtenaar heeft bij plaatsing in een land buiten Europa aanspraak op een tegemoetkoming in de aanschaf
      ter plaatse van een personenauto of motorrijwiel, indien bij de verplaatsing naar dat land geen kosten als bedoeld
      in [artikel 15, tweede lid, onder g][ref1], in rekening worden gebracht. De tegemoetkoming wordt vastgesteld bij
      ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel15
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '15'
  - number: '17.1'
    text: |-
      Indien het bevoegd gezag bij verplaatsing uit, naar en buiten Nederland heeft bepaald dat de defensieambtenaar
      geen gezinsleden op rijkskosten kan meenemen, is de tegemoetkoming in de verhuiskosten, in afwijking van
      [artikel 2, vierde en vijfde lid][ref1] en [artikel 12][ref2], gelijk aan de kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032312#Artikel12
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032312
        artikel: '12'
  - number: 17.1.a
    text: het transport van de bagage;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel17
  - number: 17.1.b
    text: |-
      de verschuldigde invoerrechten voor zover de ingevolge douanevoorschriften gehanteerde hoeveelheden niet worden
      overschreden, alsmede de verzekering van die bagage tegen schade als gevolg van of in verband met het transport;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel17
  - number: 17.1.c
    text: |-
      de reizen die in het land van vertrek worden gemaakt ter voldoening aan een oproep tot het vervullen van
      formaliteiten, vereist in verband met de reis.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel17
  - number: '17.2'
    text: |-
      Indien de defensieambtenaar bij verplaatsing uit, naar en buiten Nederland, niet op rijkskosten verhuist is de
      tegemoetkoming in de verhuiskosten, onverminderd het eerste lid, gelijk aan de kosten van het transport van de
      bagage van zijn meeverhuizende partner en elk tot het gezin behorend en meeverhuizend kind.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel17
  - number: '17.3'
    text: Bij ministeriële regeling worden nadere voorwaarden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel17
  - number: '18.1'
    text: |-
      De defensieambtenaar die aanspraak heeft op een tegemoetkoming in de verhuiskosten en die naar of binnen een buiten
      Nederland gelegen gebied verhuist, dan wel vanuit een buiten Nederland gelegen gebied naar Nederland verhuist,
      heeft aanspraak op tijdelijke onderbrenging van hemzelf en zijn eventuele gezinsleden indien:
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel18
  - number: 18.1.a
    text: hij nog niet over een woning kan beschikken;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel18
  - number: 18.1.b
    text: hij ten gevolge van de verscheping van de inboedel daarover niet kan beschikken.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel18
  - number: '18.2'
    text: |-
      De defensieambtenaar als bedoeld in het eerste lid, die zonder gezinsleden verhuist, heeft de mogelijkheid om in
      plaats van tijdelijke onderbrenging voor huisvesting van rijkswege te kiezen.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel18
  - number: '18.3'
    text: |-
      Indien de defensieambtenaar die met gezinsleden is verhuisd, buiten Nederland blijft geplaatst, terwijl zijn
      gezinsleden naar Nederland terugkeren, kan op aanvraag van de defensieambtenaar onder toepassing van de voorwaarden
      bedoeld in het eerste lid, aanspraak worden verleend op tijdelijke onderbrenging van zijn gezinsleden. Als gevolg
      hiervan vervalt de aanspraak op tijdelijke onderbrenging voor de defensieambtenaar en kan hij enkel aanspraak maken
      op huisvesting van rijkswege.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel18
  - number: '18.4'
    text: |-
      Indien niet over de woning, bedoeld in het eerste lid, onder a, kan worden beschikt, zijn de eventuele kosten van
      opslag van de inboedel voor rekening van het Rijk.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel18
  - number: '18.5'
    text: |-
      Teneinde de duur van de aanspraak te beperken is de defensieambtenaar gehouden al het mogelijke te doen om een
      woning te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel18
  - number: '18.6'
    text: |-
      Bij ministeriële regeling worden nadere regels worden gesteld omtrent de duur, de aard, de kosten en de eigen
      bijdrage van de tijdelijke onderbrenging als mede omtrent de opslag van de inboedel.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel18
  - number: '19.1'
    text: |-
      De defensieambtenaar heeft aanspraak op een tegemoetkoming in de kosten van het dagelijks reizen over de afstand
      tussen de woning en de plaats van tewerkstelling, indien de te reizen afstand meer dan 10 kilometer bedraagt, hij
      dagelijks reist, en indien hij militair is tevens een eigen huishouding voert.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel19
  - number: '19.2'
    text: |-
      Aan de defensieambtenaar die dagelijks met het openbaar vervoer reist, kan door Defensie een openbaar vervoerbewijs
      verstrekt worden. In dat geval heeft de defensieambtenaar geen aanspraak op de in het eerste lid bedoelde
      tegemoetkoming en is hij hiervoor een bij ministeriële regeling te bepalen bedrag verschuldigd.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel19
  - number: '20'
    text: |-
      De defensieambtenaar heeft aanspraak op een tegemoetkoming in de kosten van het niet dagelijks reizen over de
      afstand tussen de woning en de plaats van tewerkstelling, indien hij niet dagelijks reist en indien hij militair is
      tevens een eigen huishouding voert, van:
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel20
  - number: 20.a
    text: |-
      vier maal per periode van vier weken, indien de plaats van tewerkstelling in Nederland, België of Duitsland en de
      woning in Nederland, België of Duitsland is gelegen;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel20
  - number: 20.b
    text: |-
      vier maal per periode van vier weken, indien de plaats van tewerkstelling en de woning beide in Nederland zijn
      gelegen en hij verplicht huisvesting van rijkswege ontvangt;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel20
  - number: 20.c
    text: |-
      eenmaal per periode van twee weken, indien de plaats van tewerkstelling en de woning beide in Europa zijn gelegen,
      terwijl a of b niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel20
  - number: 20.d
    text: eenmaal per plaatsingsperiode van negen maanden, indien de plaats van tewerkstelling buiten Europa is gelegen.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel20
  - number: '21'
    text: |-
      De militair die geen eigen huishouding voert, heeft aanspraak op een tegemoetkoming in de kosten van het reizen
      over de afstand tussen de woning en de plaats van tewerkstelling, van:
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel21
  - number: 21.a
    text: |-
      eenmaal per periode van twee weken, indien de plaats van tewerkstelling en de woning beide in Nederland zijn
      gelegen en aan de militair huisvesting van rijkswege is verleend, òf
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel21
  - number: 21.b
    text: |-
      vier maal per periode van vier weken, indien de plaats van tewerkstelling en de woning beide in Nederland zijn
      gelegen en aan de militair geen huisvesting van rijkswege is verleend, òf
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel21
  - number: 21.c
    text: |-
      eenmaal per periode van vier weken, indien de plaats van tewerkstelling en de woning beide zijn gelegen in Europa,
      terwijl het gestelde onder a of b niet van toepassing is, òf
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel21
  - number: 21.d
    text: eenmaal per plaatsingsperiode van negen maanden, indien de plaats van tewerkstelling is gelegen buiten Europa.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel21
  - number: '22.1'
    text: |-
      De defensieambtenaar die met toekenning van een tegemoetkoming in de verhuiskosten is verhuisd naar een buiten
      Europa gelegen land, heeft, indien de duur van de plaatsing is gesteld voor een periode langer dan twee jaren,
      gedurende de plaatsingstermijn eenmaal per periode van twee jaren aanspraak op een tegemoetkoming in de kosten
      van het reizen tussen de woning buiten Nederland en een plaats naar keuze in Nederland voor zichzelf en voor de
      eveneens in het land van plaatsing gevestigde gezinsleden.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel22
  - number: '22.2'
    text: |-
      De defensieambtenaar die met toekenning van een tegemoetkoming in de verhuiskosten is verhuisd naar een buiten
      Europa gelegen land, al dan niet tezamen met een of meer gezinsleden heeft – indien de duur van de plaatsing
      is gesteld op ten minste twee jaren – ter zake van gezinshereniging met een achtergebleven kind, voor dat kind,
      hemzelf of één van zijn gezinsleden, eenmaal per plaatsingsperiode van 12 maanden aanspraak op een tegemoetkoming
      in de kosten van het reizen tussen de woonplaats van het kind en de woonplaats van de defensieambtenaar buiten
      Europa.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel22
  - number: '23.1'
    text: |-
      De defensieambtenaar kan de aanspraak als bedoeld in [artikel 20 onderdeel c en d][ref1], overdragen aan één van
      zijn gezinsleden tot maximaal het bedrag van de aanspraak van de defensieambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel20
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '20'
  - number: '23.2'
    text: |-
      De defensieambtenaar kan de aanspraak als bedoeld in [artikel 22, eerste lid][ref1], naar bij ministeriele regeling
      te stellen voorwaarden overdragen aan één van zijn eveneens in het land van plaatsing gevestigde gezinsleden tot
      maximaal het bedrag van de aanspraak van de defensieambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel22
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '22'
  - number: '24'
    text: |-
      De defensieambtenaar die aanspraak heeft op een tegemoetkoming, bedoeld in [artikel 20 onderdeel a en b][ref1] en
      [21, onderdeel a][ref2], heeft eveneens aanspraak op een tegemoetkoming in de kosten van het dagelijks reizen voor
      de tussen de plaats van legering of het pension en de plaats van tewerkstelling af te leggen afstand indien de te
      reizen afstand meer dan 10 kilometer bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0032312#Artikel21
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0032312
        artikel: '21'
  - number: '25.1'
    text: |-
      Het bevoegd gezag kan bepalen dat de defensieambtenaar die de mogelijkheid heeft om te reizen met van rijkswege
      ingezet vervoer, in afwijking van de [artikelen 19 tot en met 24][ref1], geen aanspraak heeft op de in die
      artikelen bedoelde tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel19
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '19'
  - number: '25.2'
    text: |-
      De defensieambtenaar die op grond van het eerste lid geen aanspraak heeft op een tegemoetkoming in de kosten
      van het dagelijks reizen voor de tussen de woning of de plaats van legering en de plaats van tewerkstelling af
      te leggen afstand is, indien gebruik wordt gemaakt van het van rijkswege ingezette vervoer, hiervoor een bij
      ministeriële regeling te bepalen bedrag verschuldigd.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel25
  - number: '26.1'
    text: |-
      De ambtenaar die van het bevoegd gezag opdracht heeft gekregen naar of naar de nabijheid van de standplaats te
      verhuizen heeft aanspraak op een tegemoetkoming in de pensionkosten indien hij naar het oordeel van het bevoegd
      gezag niet dagelijks heen en weer kan reizen en hij niet van overheidswege kan worden gehuisvest.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel26
  - number: '26.2'
    text: |-
      Indien de ambtenaar als bedoeld in het eerste lid, naar het oordeel van het bevoegd gezag, niet alles wat
      redelijkerwijze van hem mag worden verwacht heeft gedaan om zo spoedig mogelijk te verhuizen, komt hij niet langer
      in aanmerking voor de tegemoetkoming als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel26
  - number: '26.3'
    text: |-
      De ambtenaar die een functie voor een betrekkelijk korte duur bekleedt of voor een betrekkelijk korte duur elders
      is geplaatst en als gevolg daarvan niet behoeft te verhuizen heeft heeft aanspraak op een tegemoetkoming in de
      pensionkosten indien hij naar het oordeel van het bevoegd gezag niet dagelijks heen en weer kan reizen en hij niet
      van overheidswege kan worden gehuisvest.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel26
  - number: '27'
    text: |-
      De tegemoetkomingen, bedoeld in de [artikelen 19 tot en met 26][ref1], worden vastgesteld bij ministeriële
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel19
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '19'
  - number: '28.1'
    text: |-
      Indien ook de partner van de defensieambtenaar ingevolge dit besluit aanspraak kan maken op de tegemoetkomingen
      bedoeld in hoofdstuk 2 worden deze tegemoetkomingen slechts toegekend aan een van beiden.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel28
  - number: '28.2'
    text: |-
      Indien de defensieambtenaar uit anderen hoofde reeds in enigerlei vorm aanspraak heeft op vergoedingen voor de in
      hoofdstuk 2 van dit besluit genoemde kosten, worden deze aanspraken in mindering gebracht op de tegemoetkomingen in
      deze kosten ingevolge dit besluit.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel28
  - number: '28.3'
    text: |-
      Indien de defensieambtenaar aanspraak heeft op tegemoetkomingen ingevolge dit besluit en zijn partner ontvangt
      anders dan op grond van dit besluit vergoedingen voor de in hoofdstuk 2 van dit besluit genoemde kosten, dan worden
      deze vergoedingen in mindering gebracht op de tegemoetkomingen van de defensieambtenaar.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel28
  - number: '29'
    text: |-
      De aanvraag voor een tegemoetkoming in de verhuiskosten dient binnen een bij ministeriële regeling te bepalen
      termijn zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel29
  - number: '30'
    text: |-
      Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in dit besluit kan mandaat worden
      verleend aan de hoofddirecteur personeel van het Ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel30
  - number: '31'
    text: |-
      De Minister kan van de [artikelen 2 tot en met 29][ref1] afwijken voor zover toepassing gelet op het belang van dat
      deze regelgeving beoogd te beschermen zal leiden tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel2
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '2'
  - number: '32'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst en werkt terug tot 1 maart 2012
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel32
  - number: '33'
    text: Dit besluit wordt aangehaald als *«Verplaatsingskostenbesluit defensie».*
    url: https://wetten.overheid.nl/BWBR0032312/2019-08-01#Artikel33
