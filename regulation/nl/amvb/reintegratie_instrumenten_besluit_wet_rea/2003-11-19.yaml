preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 24 februari 1998, Directie
    Sociale Verzekeringen, Nr. SV/WV/98/931;

    Gelet op de artikelen 15, 18, 22, 29, 31 en 32 van de Wet op de (re)integratie arbeidsgehandicapten;

    De Raad van State gehoord (advies van 16 maart 1998, nr. W12.98.0069);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 27 april 1998, Directie
    Sociale Verzekeringen, Nr. SV/WV/98/1985;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel1
  - number: 1.a
    text: |-
      Wet: de [Wet op de (re)integratie arbeidsgehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009565
  - number: 1.b
    text: |-
      arbeidsongeschiktheidsuitkering: een arbeidsongeschiktheidsuitkering op grond van de [WAZ][ref1], de [WAJONG][ref2]
      of de [WAO][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0008657
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0008657
      - id: ref3
        bwb_id: BWBR0002524
  - number: 1.c
    text: |-
      theoretische verdiencapaciteit: het bij of krachtens [artikel 2 van de WAZ][ref1], [artikel 2 van de WAJONG][ref2]
      of [artikel 18 van de WAO][ref3] vastgestelde inkomen of loon dat een arbeidsgehandicapte als bedoeld in
      [artikel 10, eerste lid, van de Wet][ref4] nog zou kunnen verdienen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0009565
        artikel: '10'
  - number: '2.1'
    text: |-
      Een subsidie als bedoeld in [artikel 16 van de Wet][ref1] en een voorziening als bedoeld in [artikel 22][ref2] en
      [31 van de Wet][ref3], wordt niet verstrekt indien kosten zijn gemaakt ten behoeve van voorzieningen die algemeen
      gebruikelijk zijn of waarvoor vergoeding op grond van een andere wettelijke regeling mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '31'
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid kan een subsidie als bedoeld in [artikel 16 van de Wet][ref1] en een voorziening
      als bedoeld in [artikel 22][ref2] en [31 van de Wet][ref3], wel verstrekt worden indien deze dient ter vergoeding
      van kosten of voorzieningen die niet algemeen gebruikelijk zijn en niet op grond van een andere wettelijke
      regeling worden vergoed of verstrekt en vrijwel uitsluitend zijn geïndiceerd voor de werksituatie, dan wel vrijwel
      uitsluitend kunnen worden gebruikt voor of in de werksituatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '31'
  - number: '2.3'
    text: |-
      Bij de toepassing van dit besluit en de daarop berustende bepalingen wordt bij de beoordeling en berekening van de
      kosten en de verstrekking van een voorziening uitgegaan van de goedkoopste adequate voorziening.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel2
  - number: '3'
    text: |-
      Bij een aanvraag voor een subsidie als bedoeld in [artikel 16 van de Wet][ref1] verstrekt de werkgever ten minste
      de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
  - number: 3.a
    text: het aansluitingsnummer van de werkgever bij het Uitvoeringsinstituut werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel3
  - number: 3.b
    text: het sociaal-fiscaal nummer van de werknemer;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel3
  - number: 3.c
    text: de naam van de werknemer;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel3
  - number: 3.d
    text: de datum van aanvang en de aard en de omvang van de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel3
  - number: 3.e
    text: het loon van de werknemer;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel3
  - number: 3.f
    text: een overzicht van de gemaakte kosten;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel3
  - number: 3.g
    text: een onderbouwing van de noodzaak tot het maken van de kosten;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel3
  - number: 3.h
    text: |-
      gegevens waaruit blijkt op grond waarvan de werknemer door de werkgever als arbeidsgehandicapte wordt aangemerkt;
      en
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel3
  - number: 3.i
    text: |-
      een plan van aanpak als bedoeld in [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '4.1'
    text: |-
      Onder meerkosten als bedoeld in [artikel 16, eerste lid, onderdeel a, van de Wet][ref1] wordt verstaan alle kosten
      die een werkgever meer heeft gemaakt dan de som van de premiekortingen, bedoeld in dat onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
  - number: '4.2'
    text: |-
      Bij de beoordeling en de berekening van de meerkosten, bedoeld in het eerste lid, wordt de omzetbelasting buiten
      beschouwing gelaten, tenzij de werkgever aantoont dat deze door hem niet kan worden verrekend.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel4
  - number: '4.3'
    text: |-
      Indien het totaal van de kosten, bedoeld in [artikel 16, tweede lid, van de Wet][ref1], meer bedraagt dan € 22 689
      wordt bij de bepaling van de hoogte van de subsidie als bedoeld in [artikel 16 van de Wet][ref2] rekening gehouden
      met het bedrijfseconomisch voordeel voor de werkgever van de te treffen voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel16
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '16'
  - number: '4.4'
    text: |-
      De vaststelling van het bedrijfseconomisch voordeel, bedoeld in het derde lid, geschiedt met inachtneming van de in
      het maatschappelijk verkeer aanvaarde bedrijfseconomische normen.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel4
  - number: '5.1'
    text: |-
      Indien de subsidie, bedoeld in [artikel 16 van de Wet][ref1], betrekking heeft op
      meerkosten die zijn gemaakt tijdens de drie respectievelijk één jaars periode als bedoeld in
      [artikel 79b van de Wet op de arbeidsongeschiktheidsverzekering][ref2] en [artikel 82][ref3], [82a][ref4]
      of [97c van de Werkloosheidswet][ref5], en de subsidie wordt voor ommekomst van die periode aangevraagd, gaat
      het Uitvoeringsinstituut werknemersverzekeringen uit van de te verwachten som van de premiekortingen, bedoeld in
      [artikel 16, eerste lid, van de Wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel79b
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel82a
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel97c
      [ref6]: https://wetten.overheid.nl/BWBR0009565#Artikel16
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 79b
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '82'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: 82a
      - id: ref5
        bwb_id: BWBR0004045
        artikel: 97c
      - id: ref6
        bwb_id: BWBR0009565
        artikel: '16'
  - number: '5.2'
    text: |-
      Indien de subsidie, bedoeld in [artikel 16, eerste lid, van de Wet][ref1], wordt aangevraagd na ommekomst van de in
      het eerste lid bedoelde perioden, wordt uitgegaan van de som van de verleende premiekortingen, bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
  - number: '5.3'
    text: |-
      Indien een subsidie als bedoeld in [artikel 15][ref1] of [16 van de Wet][ref2] wordt aangevraagd voor een
      voorziening voor een werknemer waarvoor reeds een subsidie als bedoeld in [artikel 16 van de Wet][ref3] is
      verstrekt, wordt bij het vaststellen van de hoogte van de subsidie rekening gehouden met die eerder verstrekte
      subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel16
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '16'
  - number: 5a
    text: |-
      In afwijking van [artikel 16, tweede lid, van de Wet][ref1] wordt onder kosten, bedoeld in
      [artikel 16, eerste lid, van de Wet][ref2] niet verstaan kosten van medisch geïndiceerde reïntegratietrainingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel16
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '16'
  - number: 5b
    text: |-
      Een subsidie als bedoeld in[ artikel 16 van de Wet][ref1] wordt niet verstrekt indien de kosten,
      bedoeld in dat artikel, minder bedragen dan 1,85 maal het minimumloon per dag, bedoeld in
      [artikel 8, eerste lid, onderdeel c, van de Wet minimumloon en minimumvakantiebijslag][ref2], zoals dat artikel
      luidde op 1 januari van het kalenderjaar waarin de kosten zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 5c.1
    text: |-
      In afwijking van [artikel 16, eerste lid, van de Wet][ref1], kan het Uitvoeringsinstituut
      werknemersverzekeringen, op aanvraag van een werkgever die ten behoeve van het in dienst houden of nemen van een
      arbeidsgehandicapte werknemer kosten heeft gemaakt als bedoeld in [artikel 16, tweede lid, van de Wet][ref2],
      terwijl hij voor deze werknemer geen aanspraak kan maken op premiekorting, bedoeld in
      [artikel 79b van de Wet op de arbeidsongeschiktheidsverzekering][ref3] en de [artikelen 82][ref4], [82a][ref5]
      of [97c van de Werkloosheidswet][ref6], als gevolg van het feit dat de dienstbetrekking wordt beëindigd op
      initiatief van de werknemer, subsidie overeenkomstig dit hoofdstuk verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel79b
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel82
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel82a
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel97c
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 79b
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '82'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: 82a
      - id: ref6
        bwb_id: BWBR0004045
        artikel: 97c
  - number: 5c.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien het Uitvoeringsinstituut werknemersverzekeringen nadat de
      kosten, bedoeld in het eerste lid, zijn gemaakt, vaststelt dat bij de werkgever geen passende arbeid aanwezig is.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel5c
  - number: 5c.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld in verband met de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel5c
  - number: 5d
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan een werkgever ten behoeve van een persoon die niet meer
      als arbeidsgehandicapte werknemer kan worden beschouwd omdat hij de leeftijd van 65 jaar heeft bereikt, subsidie
      verstrekken als bedoeld in [artikel 16, van de Wet][ref1], ten behoeve van de voortzetting van een voorziening
      waarvoor kosten zijn gemaakt waarvoor reeds een subsidie is verleend, indien die persoon de inkomensvormende arbeid
      ten behoeve waarvan de kosten laatstelijk zijn gesubsidieerd nog in ongeveer gelijke mate verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
  - number: '6'
    text: |-
      Een voorziening als bedoeld in [artikel 22][ref1] en [31 van de Wet][ref2] wordt slechts toegekend indien deze in
      overwegende mate op het individu is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '31'
  - number: '7.1'
    text: |-
      Een voorziening als bedoeld in [artikel 22][ref1] en [31 van de Wet][ref2] wordt niet toegekend
      indien de waarde van de voorziening minder bedraagt dan 1,85 maal het minimumloon per dag, bedoeld in
      [artikel 8, eerste lid, onderdeel c, van de Wet minimumloon en minimumvakantiebijslag][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '7.2'
    text: |-
      Indien de gezamenlijke waarde van voorzieningen als bedoeld in [artikel 22][ref1] of [31 van de Wet][ref2], die
      in een kalenderjaar zijn aangevraagd, een bedrag ter grootte van 1,85 maal het minimumloon per dag, bedoeld in
      [artikel 8, eerste lid, onderdeel c, van de Wet minimumloon en minimumvakantiebijslag][ref3] overtreft, kan het
      Uitvoeringsinstituut werknemersverzekeringen die voorzieningen toekennen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 7a
    text: |-
      Onder voorzieningen als bedoeld in [artikel 22, eerste lid, van de Wet][ref1] worden niet verstaan medisch
      geïndiceerde reïntegratietrainingen of de vergoeding van kosten daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
  - number: 7b.1
    text: |-
      Onder voorzieningen als bedoeld in [artikel 22, tweede lid, onderdeel a, van de Wet][ref1], worden niet verstaan
      opleiding of scholing of de vergoeding van kosten daarvan ten behoeve van de arbeidsgehandicapte aan wie het
      Uitvoeringsinstituut werknemersverzekeringen werkzaamheden ter bevordering van de inschakeling in het arbeidsproces
      als bedoeld in [artikel 10, eerste lid, van de Wet][ref2], aanbiedt of heeft aangeboden, terwijl die werkzaamheden
      worden verricht door een natuurlijke persoon dan wel rechtspersoon die in het kader van de uitoefening van beroep
      of bedrijf de inschakeling van personen in de arbeid bevordert.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '10'
  - number: 7b.2
    text: |-
      In afwijking van het eerste lid wordt onder voorzieningen als bedoeld in
      [artikel 22, tweede lid, onderdeel a, van de Wet][ref1] verstaan opleiding of scholing of de
      vergoeding van kosten daarvan ten behoeve van de arbeidsgehandicapte aan wie het Uitvoeringsinstituut
      werknemersverzekeringen werkzaamheden ter bevordering van de inschakeling in het arbeidsproces als bedoeld in
      [artikel 10, eerste lid, van de Wet][ref2], aanbiedt of heeft aangeboden, terwijl die werkzaamheden, uit hoofde van
      een overeenkomst waarvan de looptijd is aangevangen voor 1 juli 2003, worden verricht door een natuurlijke persoon
      dan wel rechtspersoon die in het kader van de uitoefening van beroep of bedrijf de inschakeling van personen in de
      arbeid bevordert.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '10'
  - number: 7b.3
    text: |-
      Tot een bij ministeriële regeling te bepalen tijdstip is het eerste lid niet van toepassing ten aanzien van
      arbeidsgehandicapten die een opleiding of scholing volgen, verzorgd door een scholingsinstituut als bedoeld in
      [artikel 44 van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel44
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '44'
  - number: 7c
    text: |-
      Onder voorzieningen als bedoeld in [artikel 22, tweede lid, onderdeel a, van de Wet][ref1] worden niet verstaan
      opleiding of scholing aan een scholings-instituut als bedoeld in [artikel 44, eerste lid, van de Wet REA][ref2], of
      de vergoeding van kosten daarvan, voorzover voor die scholings- of opleidingsplaatsen niet tevens subsidie op grond
      van [artikel 44, eerste lid, van de Wet REA][ref3] is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel44
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '44'
  - number: '8.1'
    text: |-
      Vervoersvoorzieningen als bedoeld in [artikel 22, eerste, tweede, derde en vijfde lid][ref1], en
      [31 van de Wet][ref2], worden niet toegekend of worden beëindigd, indien het inkomen van de persoon
      die de voorziening aanvraagt of aan wie de voorziening is toegekend, in het kalenderjaar waarin
      de voorziening is aangevraagd of voortzetting van een toegekende voorziening wordt overwogen, meer
      bedraagt dan 261 maal 70% van het maximum dagloon, bedoeld in [artikel 9, eerste lid][ref3], en
      [9a van de Coördinatiewet Sociale Verzekering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002126#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002126#Artikel9a
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0002126
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0002126
        artikel: 9a
  - number: '8.2'
    text: |-
      Indien het inkomen van de persoon, bedoeld in het eerste lid, in betekenende mate aan fluctuaties onderhevig is,
      wordt voor de toepassing van het eerste lid de som van het inkomen over het in het eerste lid genoemde kalenderjaar
      en het inkomen over de twee daaraan voorafgaande kalenderjaren gedeeld door drie.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel8
  - number: '8.3'
    text: |-
      Onder vervoersvoorzieningen als bedoeld in het eerste lid worden in ieder geval verstaan een bruikleenauto, een
      taxikostenvergoeding en een kilometervergoeding voor het gebruik van een eigen auto of van een bruikleenauto.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel8
  - number: '8.4'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel8
  - number: 8.4.a
    text: |-
      worden regels gesteld over de wijze van vaststelling van het inkomen, bedoeld in het eerste lid, waarbij kan worden
      bepaald, dat bij de vaststelling van het inkomen mede in aanmerking wordt genomen het inkomen van de echtgenoot, de
      partner of van een ander gezinslid van de in het eerste lid bedoelde persoon;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel8
  - number: 8.4.b
    text: kan het in het eerste lid bedoelde percentage voor categorieën van personen worden verhoogd; en
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel8
  - number: 8.4.c
    text: |-
      kan worden bepaald dat het eerste lid geen toepassing vindt bij de toekenning van nader te bepalen
      vervoersvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel8
  - number: '8.5'
    text: |-
      Beëindiging van de vervoersvoorziening wegens overschrijding van de inkomensgrens, bedoeld in het eerste lid, vindt
      plaats met ingang van de datum gelegen zes maanden nadat de persoon aan wie de voorziening is toegekend van de
      voorgenomen beëindiging in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel8
  - number: '9'
    text: |-
      Onder voorzieningen als bedoeld in [artikel 22, vierde lid, van de Wet][ref1] worden niet verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
  - number: 9.a
    text: |-
      voorzieningen op het gebied van onderwijs die behoren tot de verstrekkingen waarvoor een regeling is getroffen
      onder verantwoordelijkheid van Onze Minister van Onderwijs, Cultuur en Wetenschappen;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel9
  - number: 9.b
    text: |-
      personele onderwijsfaciliteiten, waaronder in ieder geval worden verstaan activiteiten als remedial teaching,
      ambulante begeleiding of het geven van begeleidingslessen;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel9
  - number: 9.c
    text: |-
      met ingang van het schooljaar 2002/2003, voorzieningen voor het vervoer van leerlingen
      naar en van een school als bedoeld in de [Wet op het primair onderwijs][ref1], de
      [Wet op de expertisecentra][ref2] of de [Wet op het voortgezet onderwijs][ref3], tenzij
      __REF003___________________________________________________________________________________________________________
      ______________________________________________________________________________________________ (Stb. 2002, 59) van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0013353#ArtikelV
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0013353
        artikel: V
  - number: 9.d
    text: voorzieningen verband houdende met dyslexie.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel9
  - number: '10.1'
    text: |-
      Een leefvervoersvoorziening als bedoeld in [artikel 22, vijfde lid][ref1], en [31, derde lid, van de Wet][ref2],
      wordt slechts verleend indien daarmee de uit ziekte of gebrek voortvloeiende beperkingen worden opgeheven of
      verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '31'
  - number: '10.2'
    text: |-
      Een leefvervoersvoorziening als bedoeld in [artikel 22, vijfde lid, van de Wet][ref1], wordt slechts verleend
      indien op grond van [artikel 22, eerste, derde of vierde lid, van de Wet][ref2], een vervoersvoorziening is
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel22
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '22'
  - number: '10.3'
    text: |-
      Indien de vervoersvoorziening, toegekend op grond van [artikel 22, eerste of derde lid][ref1], of op grond van
      [artikel 31, tweede lid, van de Wet][ref2], wordt beëindigd omdat de persoon aan wie de voorziening is verstrekt
      vanwege het bereiken van de leeftijd van 65 jaar niet meer als arbeidsgehandicapte kan worden beschouwd, wordt de
      leefvervoersvoorziening, bedoeld in [artikel 22, vijfde lid][ref3], en [31, derde lid, van de Wet][ref4], eveneens
      beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0009565
        artikel: '31'
  - number: '10.4'
    text: |-
      Na beëindiging van een vervoersvoorziening, toegekend op grond van [artikel 22, eerste, derde of vierde lid][ref1],
      of op grond van [artikel 31, tweede lid, van de Wet][ref2], om andere redenen dan die genoemd in het derde
      lid, wordt de leefvervoersvoorziening voortgezet gedurende de termijn die is voorzien in de beschikking van het
      Uitvoeringsinstituut werknemersverzekeringen waarbij de voorziening is toegekend, doch ten hoogste voor de duur van
      twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '31'
  - number: '11.1'
    text: |-
      Een voorziening in de vorm van persoonlijke ondersteuning kan uitsluitend worden toegekend op grond van
      [artikel 31, tweede lid, onderdeel b, van de Wet][ref1]. De toekenning, bedoeld in de eerste zin, kan bestaan
      uit het beschikbaar stellen van persoonlijke ondersteuning of uit vergoeding voor de kosten van persoonlijke
      ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '31'
  - number: '11.2'
    text: 'De voorziening, bedoeld in het eerste lid, wordt slechts toegekend indien:'
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel11
  - number: 11.2.a
    text: |-
      de persoonlijke ondersteuning bestaat uit een individueel trainings- of inwerkprogramma op de werkplek en een
      systematische begeleiding van de arbeidsgehandicapte werknemer gericht op het behouden van de arbeidsplaats;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel11
  - number: 11.2.b
    text: |-
      de arbeidsgehandicapte werknemer zonder een systematische begeleiding niet in staat zou zijn de hem opgedragen
      werkzaamheden te verrichten;
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel11
  - number: 11.2.c
    text: |-
      de persoonlijke ondersteuning wordt gegeven door een persoon die verbonden is aan een door het Uitvoeringsinstituut
      werknemersverzekeringen erkende rechtspersoon die tot doel heeft diensten te verlenen die kunnen worden aangemerkt
      als persoonlijke ondersteuning als bedoeld [onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009609#Artikel11
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009609
        artikel: '11'
        hoofdstuk: III
  - number: '11.3'
    text: |-
      De voorziening, bedoeld in het eerste lid, kan in het eerste, tweede, derde en de daarop volgende jaren, worden
      toegekend voor een aantal uren dat correspondeert met respectievelijk 15%, 7.5% en 6% van het aantal door de
      arbeidsgehandicapte werknemer te werken uren per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel11
  - number: '11.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan van de in het derde lid bedoelde percentages afwijken
      voorzover toepassing daarvan gelet op het belang dat dit artikel beoogt te beschermen zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel11
  - number: '12.1'
    text: |-
      Onder een communicatievoorziening voor doven als bedoeld in [artikel 31, tweede lid, onderdeel c, van de Wet][ref1],
      wordt uitsluitend verstaan een dovengebarentolk, een dovenschrijftolk of een notitiemaker die is erkend door het
      Uitvoeringsinstituut werknemersverzekeringen. De toekenning van een voorziening als bedoeld in de eerste zin, kan
      bestaan uit het beschikbaar stellen van een dovengebarentolk, een dovenschrijftolk of een notitiemaker of uit een
      vergoeding van de kosten voor het gebruik van een dovengebarentolk, een dovenschrijftolk of een notitiemaker.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '31'
  - number: '12.2'
    text: |-
      De voorziening, bedoeld in het eerste lid, kan ten hoogste worden toegekend voor het aantal uren dat overeenkomt
      met 15% van het aantal door de arbeidsgehandicapte werknemer te werken uren per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel12
  - number: '12.3'
    text: |-
      Het eerste, tweede en vijfde lid zijn van overeenkomstige toepassing bij de toekenning van een dovengebarentolk,
      een dovenschrijftolk of een notitiemaker op grond van [artikel 22, derde lid, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
  - number: '12.4'
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij de toekenning van een dovengebarentolk, een dovenschrijftolk
      of een notitiemaker op grond van [artikel 22, eerste of vierde lid, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
  - number: '12.5'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan van het in het tweede lid bedoelde percentage afwijken
      voorzover toepassing daarvan gelet op het belang dat dit artikel beoogt te beschermen zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel12
  - number: '13'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de toekenning van een voorziening als bedoeld in
      [artikel 22][ref1] of [31 van de Wet][ref2], aan een persoon die vanwege het bereiken van de leeftijd van 65 jaar
      niet meer als arbeidsgehandicapte kan worden beschouwd voortzetten, indien hij de inkomensvormende arbeid waarvoor
      de voorziening laatstelijk werd toegekend nog in ongeveer gelijke mate verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '31'
  - number: '14.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan indien een of meer feiten op grond waarvan een voorziening
      als bedoeld in [artikel 22][ref1] of [31, tweede lid onderdeel a, of derde lid, van de Wet][ref2], is toegekend,
      zodanig wijzigen dat de toekenning van de voorziening niet langer is aangewezen, of indien een met betrekking tot
      een voorziening afgesloten bruikleencontract afloopt, een belanghebbende de niet in de vorm van een financiële
      tegemoetkoming verleende voorziening doen behouden of doen kopen, voor een prijs die de op dat moment in het
      maatschappelijke verkeer geldende waarde van een dergelijke voorziening niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '31'
  - number: '14.2'
    text: |-
      Indien de voorziening, bedoeld in het eerste lid, een vervoermiddel betreft, wordt bij het bepalen van de prijs,
      bedoeld in het eerste lid, uitgegaan van de voorziening zonder specifieke aanpassingen.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel14
  - number: '15.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan een arbeidsgehandicapte als bedoeld in
      [artikel 10, eerste lid, van de Wet][ref1], die arbeid als zelfstandige verricht of gaat verrichten op aanvraag
      inkomenssuppletie toekennen, indien zijn inkomen uit het bedrijf of beroep lager is dan zijn theoretische
      verdiencapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
  - number: '15.2'
    text: |-
      De inkomenssuppletie wordt verstrekt over perioden waarin het bedrijf of beroep wordt uitgeoefend, doch ten hoogste
      over een periode van vier jaar te rekenen vanaf de datum met ingang waarvan de inkomenssuppletie voor het eerst
      is toegekend.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel15
  - number: '15.3'
    text: |-
      De inkomenssuppletie wordt voor de toepassing van de wettelijke bepalingen inzake premieheffing en inhouding
      aangemerkt als een uitkering op grond van de [WAZ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: '16.1'
    text: 'De hoogte van de inkomenssuppletie bedraagt:'
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
  - number: 16.1.a
    text: gedurende het eerste jaar 100%,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
  - number: 16.1.b
    text: gedurende het tweede jaar 75%,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
  - number: 16.1.c
    text: gedurende het derde jaar 50% en
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
  - number: 16.1.d
    text: gedurende het vierde jaar 25%,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
  - number: '16.2'
    text: |-
      Indien betrokkene in het bedrijf of beroep minder uren werkt dan waartoe hij bij de theoretische vaststelling van
      de mate van arbeidsongeschiktheid in staat wordt geacht, wordt het bedrag van de inkomenssuppletie vermenigvuldigd
      met een breuk waarvan de teller wordt gevormd door het aantal uren waarin in het bedrijf of beroep arbeid wordt
      verricht en de noemer door het aantal uren waarop de resterende theoretische verdiencapaciteit is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
  - number: '16.3'
    text: De inkomenssuppletie bedraagt tezamen met het inkomen uit het bedrijf of beroep en, indien van toepassing,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
  - number: 16.3.a
    text: het loon,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
  - number: 16.3.b
    text: |-
      de loonsuppletie, bedoeld in [artikel 17][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009609#Artikel17
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009609
        artikel: '17'
        hoofdstuk: V
  - number: 16.3.c
    text: een arbeidsongeschiktheidsuitkering,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
  - number: 16.3.d
    text: |-
      een uitkering op grond van de [Ziektewet][ref1] of een daarmee naar aard en strekking overeenkomende uitkering,


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 16.3.e
    text: |-
      een uitkering op grond van de [Werkloosheidswet][ref1] of een daarmee naar aard en strekking overeenkomende
      uitkering, of


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 16.3.f
    text: |-
      een uitkering op grond van [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013008
        afdeling: '2'
  - number: '17.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan een arbeidsgehandicapte als bedoeld in
      [artikel 10, eerste lid, van de Wet][ref1], die arbeid in dienstbetrekking aanvaardt op aanvraag loonsuppletie
      toekennen, indien het loon lager is dan zijn theoretische verdiencapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
  - number: '17.2'
    text: |-
      De loonsuppletie wordt verstrekt over perioden waarin loon uit dienstbetrekking wordt ontvangen, doch ten hoogste
      over een periode van vier jaar te rekenen vanaf de datum met ingang waarvan voor de eerste maal loonsuppletie is
      toegekend.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel17
  - number: '17.3'
    text: |-
      Als perioden waarin loon uit dienstbetrekking wordt ontvangen als bedoeld in het tweede lid worden eveneens
      aangemerkt, perioden waarin een uitkering op grond van de [Ziektewet][ref1]of op grond van [hoofdstuk 3, afdeling
      2, paragraaf 1, van de Wet arbeid en zorg](onbekend) wordt ontvangen, tenzij de dienstbetrekking is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '17.4'
    text: |-
      De loonsuppletie wordt voor de toepassing van de wettelijke bepalingen inzake premieheffing en inhouding aangemerkt
      als een uitkering op grond van de [WAO][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '18.1'
    text: 'De hoogte van de loonsuppletie bedraagt:'
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
  - number: 18.1.a
    text: gedurende het eerste jaar 100%,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
  - number: 18.1.b
    text: gedurende het tweede jaar 75%,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
  - number: 18.1.c
    text: gedurende het derde jaar 50% en
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
  - number: 18.1.d
    text: gedurende het vierde jaar 25%
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
  - number: '18.2'
    text: |-
      Indien betrokkene in de dienstbetrekking waarvoor loonsuppletie wordt verstrekt minder uren werkt dan waartoe hij
      bij de theoretische vaststelling van de mate van arbeidsongeschiktheid in staat wordt geacht, wordt het bedrag
      van de loonsuppletie vermenigvuldigd met een breuk waarvan de teller wordt gevormd door het aantal uren waarin in
      deze dienstbetrekking arbeid wordt verricht en de noemer door het aantal uren waarop de resterende theoretische
      verdiencapaciteit is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
  - number: '18.3'
    text: De loonsuppletie bedraagt tezamen met het loon en, indien van toepassing,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
  - number: 18.3.a
    text: het inkomen uit bedrijf of beroep,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
  - number: 18.3.b
    text: de inkomenssuppletie, bedoeld in artikel 15,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
  - number: 18.3.c
    text: een arbeidsongeschiktheidsuitkering,
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
  - number: 18.3.d
    text: |-
      een uitkering op grond van de [Ziektewet][ref1] of een daarmee naar aard en strekking overeenkomende uitkering,


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 18.3.e
    text: |-
      een uitkering op grond van de [Werkloosheidswet][ref1] of een daarmee naar aard en strekking overeenkomende
      uitkering, of


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 18.3.f
    text: |-
      een uitkering op grond van [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013008
        afdeling: '2'
  - number: '19'
    text: |-
      [Artikel 14][ref1] is van overeenkomstige toepassing op de persoon ten aanzien van wie de bruikleen van een
      vervoermiddel, met inachtneming van [artikel 23 van de Wet voorzieningen gehandicapten][ref2], na inwerkingtreding
      van die wet is voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0009609#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006169#Artikel23
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009609
        artikel: '14'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006169
        artikel: '23'
  - number: '20'
    text: |-
      Indien het bij koninklijke boodschap van 1 september 1997 ingediende voorstel van wet tot
      vaststelling van nieuwe regels met betrekking tot de (re)integratie van arbeidsgehandicapten
      ([Wet op de (re)integratie arbeidsgehandicapten][ref1]) (25 478) tot wet wordt verheven, treedt dit besluit in
      werking op het tijdstip waarop [artikel 15 van die wet][ref2] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel15
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009565
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '15'
  - number: '21'
    text: 'Dit besluit wordt aangehaald als: Reïntegratie-instrumentenbesluit Wet REA.'
    url: https://wetten.overheid.nl/BWBR0009609/2003-11-19#Artikel21
