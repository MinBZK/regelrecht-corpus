---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_regeling_vergoeding_bijzondere_ziektekostenverzekering
regulatory_layer: AMVB
publication_date: '2002-11-07'
valid_from: '2001-07-06'
bwb_id: BWBR0002777
url: https://wetten.overheid.nl/BWBR0002777/2001-07-06
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Volksgezondheid en de Staatssecretaris van Sociale Zaken en
    Volksgezondheid van 10 mei 1971, Directoraat-Generaal van de Volksgezondheid, Hoofdafd. Verz., No. 112.037;

    Gelet op de artikelen 11 en 77 van de Algemene Wet Bijzondere Ziektekosten (Stb. 1967, 655);

    Gehoord de Ziekenfondsraad;

    De Raad van State gehoord (advies van 9 juni 1971, no. 15);

    Gezien het nader rapport van Onze Minister van Volksgezondheid en Milieuhygiëne van 15 juli 1971, Directoraat-
    Generaal van de Volksgezondheid, Hoofdafd. Verz. nr. 114.900;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel1
  - number: 1.1.a
    text: |-
      tehuis: een in Nederland gelegen tehuis, niet zijnde een inrichting toegelaten of voorlopig toegelaten
      overeenkomstig [artikel 8 van de Algemene Wet Bijzondere Ziektekosten][ref1], hetwelk een capaciteit heeft van
      ten minste 10 bedden welke zijn bestemd om aan zieken dan wel gehandicapten behandeling dan wel verpleging of
      verzorging te verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel8
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '8'
  - number: 1.1.b
    text: |-
      centraal betaalkantoor: het centraal administratiekantoor, bedoeld in het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003585
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003585
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit wordt onder een tehuis niet verstaan een verzorgingshuis als bedoeld in
      [artikel 16 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref1], behoudens voor zover het
      betreft de ziekenafdeling van een verzorgingshuis.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel16
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '16'
  - number: '2.1'
    text: |-
      De verzekerde, die gedurende de dag en nacht verblijft in een tehuis, heeft met inachtneming van hetgeen nader
      in dit besluit is bepaald aanspraak op vergoeding wegens kosten ter zake van het verblijf in dat tehuis, indien
      en zolang:
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel2
  - number: 2.1.a
    text: |-
      ten aanzien van hem een indicatiebeoordeling is vastgesteld voor opneming en verder verblijf in een
      verpleeginrichting als bedoeld in artikel 14 of in een inrichting voor zwakzinnigen als bedoeld in
      [artikel 23 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel23
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '23'
  - number: 2.1.b
    text: hij uitsluitend wegens plaatsgebrek niet in een inrichting als bedoeld onder *a* is opgenomen;
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel2
  - number: 2.1.c
    text: |-
      hij het uitvoeringsorgaan, bedoeld in [artikel 3][ref1], schriftelijk heeft gemachtigd de hem ingevolge dit besluit
      toekomende vergoeding namens hem aan derden uit te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0002777#Artikel3
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002777
        artikel: '3'
  - number: '2.2'
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat het eerste lid in daarbij aan te wijzen gebieden niet van
      toepassing is. Hij gaat daartoe niet over dan nadat hem is gebleken, dat de inrichtingen van de desbetreffende
      categorie in het betrokken gebied naar redelijke maatstaven gemeten voldoende gelegenheid bieden tot opneming van
      verzekerden voor wie een indicatie bestaat als in het eerste lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel2
  - number: '2.3'
    text: |-
      Een beschikking krachtens het tweede lid treedt niet eerder in werking dan nadat drie maanden zijn verstreken na
      haar bekendmaking in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel2
  - number: '2.4'
    text: |-
      De regionale contactkantoren, bedoeld in het Besluit van de Ziekenfondsraad van 26 augustus 1971 (*Stcrt.* 1971,
      169) welke in het aangewezen gebied werkzaam zijn, dragen zorg, dat de verzekerden wie het aangaat zo spoedig
      mogelijk na de bekendmaking van een beschikking krachtens het tweede lid, bericht ontvangen in welke erkende
      inrichting(en) zij kunnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel2
  - number: '3.1'
    text: |-
      De in [artikel 2][ref1] bedoelde vergoeding wordt door of namens de verzekerde aangevraagd bij het
      uitvoeringsorgaan, waarbij hij voor de toepassing van de [Algemene Wet Bijzondere Ziektekosten][ref2] is
      ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002777#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002777
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002614
  - number: '3.2'
    text: |-
      Het uitvoeringsorgaan gaat slechts tot toekenning van de in [artikel 2][ref1] bedoelde vergoeding over na te hebben
      vastgesteld, dat


      [ref1]: https://wetten.overheid.nl/BWBR0002777#Artikel2
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002777
        artikel: '2'
  - number: 3.2.a
    text: |-
      voor de verzekerde een indicatie bestaat voor opneming en verder verblijf in een verpleeg- onderscheidenlijk
      zwakzinnigeninrichting en dat
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel3
  - number: 3.2.b
    text: |-
      metterdaad geen opneming en verder verblijf kunnen plaatsvinden in een erkende of voorlopig erkende verpleeg-
      onderscheidenlijk zwakzinnigeninrichting, welke op redelijke afstand is gelegen van de woonplaats van de
      verzekerde.
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel3
  - number: '4'
    text: |-
      Indien na toekenning van de in [artikel 2][ref1] bedoelde vergoeding naar het oordeel van het uitvoeringsorgaan
      opneming en verder verblijf kunnen plaatsvinden in een der erkende of voorlopig erkende verpleeg- onderscheidenlijk
      zwakzinnigeninrichtingen als bedoeld in [artikel 3, tweede lid, sub ][ref2], wordt deze vergoeding beëindigd,
      doch niet dan nadat het uitvoeringsorgaan de mogelijkheid van verblijf in een met name aan te duiden erkende of
      voorlopig erkende inrichting ter kennis heeft gebracht van de verzekerde en aan deze voldoende gelegenheid is
      geboden tot overplaatsing naar die erkende of voorlopig erkende inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002777#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002777#Artikel3
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002777
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002777
        artikel: '3'
  - number: '5'
    text: |-
      De in [artikel 2][ref1] bedoelde vergoeding is gelijk aan het voor het verblijf in het tehuis aan de verzekerde in
      rekening gebrachte tarief, doch uitsluitend voor zover dit tarief:


      [ref1]: https://wetten.overheid.nl/BWBR0002777#Artikel2
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002777
        artikel: '2'
  - number: 5.a
    text: niet in strijd met enig wettelijk voorschrift is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel5
  - number: 5.b
    text: niet omvat kosten, verband houdende met de verstrekking van onderwijs, kleedgeld en zakgeld;
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel5
  - number: 5.c
    text: is gebaseerd op plaatsing in de laagste klasse;
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel5
  - number: 5.d
    text: |-
      geen elementen bevat, welke op grond van de in [artikel 8][ref1] bedoelde nadere regelen niet bij de berekening van
      de vergoeding in aanmerking behoren te worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002777#Artikel8
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002777
        artikel: '8'
  - number: '6.1'
    text: |-
      In de kosten wegens verblijf in een tehuis is door verzekerden behorende tot daarvoor aan te wijzen groepen van
      verzekerden van 65 jaar en ouder een bijdrage verschuldigd. Voorts kan van verzekerden beneden de 65 jaar, die ter
      zake van het verblijf in een tehuis aanspraak hebben op een vergoeding als bedoeld in [artikel 2][ref1], eveneens
      een bijdrage in de kosten daarvan worden geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002777#Artikel2
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002777
        artikel: '2'
  - number: '6.2'
    text: |-
      De bijdrage, bedoeld in het eerste lid, wordt vastgesteld met toepassing van het [Bijdragebesluit zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008253
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008253
  - number: '7'
    text: |-
      Het centraal betaalkantoor draagt namens de uitvoeringsorganen zorg voor de betaling van de in [artikel 2][ref1]
      bedoelde vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002777#Artikel2
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002777
        artikel: '2'
  - number: '8.1'
    text: |-
      Het College zorgverzekeringen kan met betrekking tot de uitvoering van dit besluit nadere en zo nodig van dit
      besluit afwijkende regelen stellen. Daarbij kan tevens worden bepaald door welke instellingen en onder welke
      regelen de administratie wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel8
  - number: '8.2'
    text: |-
      De kosten welke het centraal betaalkantoor en de instellingen, bedoeld in de tweede volzin
      van het eerste lid, voor de uitvoering van hun taken maken, worden gedekt door uitkeringen
      uit het Algemeen Fonds Bijzondere Ziektekosten volgens het bepaalde bij en krachtens het
      [Besluit financiering uitvoeringsorganisatie Bijzondere Ziektekostenverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004783
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004783
  - number: '9.1'
    text: |-
      Het College toezicht is belast met het toezicht op de rechtmatige en doelmatige uitvoering van de
      [Algemene Wet Bijzondere Ziektekosten][ref1] door het centraal betaalkantoor en door de instellingen, bedoeld in
      [artikel 8, eerste lid, tweede volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002777#Artikel8
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0002777
        artikel: '8'
  - number: '9.2'
    text: |-
      De artikelen [1x7][ref1], [1x11][ref2], [1x12][ref3], [43e][ref4] en [43f van de Ziekenfondswet][ref5]
      zijn van overeenkomstige toepassing op het centraal betaalkantoor en de instellingen, bedoeld in
      [artikel 8, eerste lid, tweede volzin][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1x7
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1x11
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel1x12
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel43e
      [ref5]: https://wetten.overheid.nl/BWBR0002460#Artikel43f
      [ref6]: https://wetten.overheid.nl/BWBR0002777#Artikel8
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1x7
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1x11
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 1x12
      - id: ref4
        bwb_id: BWBR0002460
        artikel: 43e
      - id: ref5
        bwb_id: BWBR0002460
        artikel: 43f
      - id: ref6
        bwb_id: BWBR0002777
        artikel: '8'
  - number: '9.3'
    text: |-
      Onverminderd het tweede lid kan het College zorgverzekeringen regels stellen over de wijze waarop het centraal
      betaalkantoor en de instellingen, bedoeld in [artikel 8, eerste lid, tweede volzin][ref1], hun werkzaamheden
      uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002777#Artikel8
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002777
        artikel: '8'
  - number: '10'
    text: Dit besluit kan worden aangehaald als Besluit regeling vergoeding Bijzondere Ziektekostenverzekering.
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel10
  - number: '11'
    text: Dit besluit treedt in werking met ingang van 1 oktober 1971.
    url: https://wetten.overheid.nl/BWBR0002777/2001-07-06#Artikel11
