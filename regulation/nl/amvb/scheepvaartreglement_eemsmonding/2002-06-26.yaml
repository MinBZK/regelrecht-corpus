---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: scheepvaartreglement_eemsmonding
regulatory_layer: AMVB
publication_date: '2010-11-09'
valid_from: '2002-06-26'
bwb_id: BWBR0004552
url: https://wetten.overheid.nl/BWBR0004552/2002-06-26
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 15 maart 1989, nr. S/J 30.442/89, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;

    Overwegende, dat uitvoering dient te worden gegeven aan de Overeenkomst tussen het Koninkrijk der Nederlanden en de
    Bondsrepubliek Duitsland inzake een scheepvaartreglement voor de Eemsmonding, met bijlagen (Trb. 1987, 15);

    Gelet op de artikelen 4 en31, tiende lid, van de Scheepvaartverkeerswet (Stb. 1988, 352);

    Gelet op artikel 3 van de Overeenkomst tussen het Koninkrijk der Nederlanden en de Bondsrepubliek Duitsland inzake
    een scheepvaartreglement voor de Eemsmonding, met bijlagen;

    De Raad van State gehoord (advies van 21 april 1989, nr. W09.89.0143);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 9 mei 1989, nr. S/J 30.788/89,
    Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Op dit besluit zijn de begripsbepalingen van de voorschriften 3, 21 en 32 van de Internationale Bepalingen ter
      voorkoming van aanvaringen op zee, 1972 (*Trb.* 1974, 51), zoals gewijzigd, van toepassing; overigens wordt in dit
      besluit verstaan onder:
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.1.a
    text: |-
      Internationale Bepalingen: de Internationale Bepalingen ter voorkoming van aanvaringen op zee, 1972, zoals
      gewijzigd;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.1.b
    text: |-
      vaarwater: een gedeelte van het water dat door de verkeerstekens E. 2.1 tot en met E. 2.3 van Hoofdstuk I van
      bijlage 1 is begrensd of gekenmerkt of dat, voor zover dit niet het geval is, voor de doorgaande scheepvaart is
      bestemd; een vaarwater wordt beschouwd als nauw vaarwater, als bedoeld in de Internationale Bepalingen;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.1.c
    text: |-
      rede: een voor het ankeren bestemd gedeelte van het water dat door de verkeerstekens E.6.1. en E.6.2 van Hoofdstuk
      I van bijlage 1 is begrensd of dat door de bevoegde autoriteit is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.1.d
    text: |-
      drijvende inrichting: een drijvend bouwsel dat gewoonlijk niet voor de voortbeweging is bestemd, in het bijzonder
      een dok en een aanlegsteiger; dit wordt in geval van transport beschouwd als een schip in de zin van dit besluit en
      van de Internationale Bepalingen;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.1.e
    text: |-
      sleep: een samenstel van één of meer slepende motorschepen (sleepboten) en één of meer daarachter of langszij
      gesleepte schepen, drijvende inrichtingen of drijvende voorwerpen dat geen of geen gereed voor het gebruik zijnde
      voortstuwingsinstallatie bezit of dat in zijn manoeuvreerbaarheid beperkt is;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.1.f
    text: |-
      duwstel: een hecht samenstel van schepen, waarvan er ten minste één is geplaatst voor het motorschip, dat dient
      voor het voortbewegen van het samenstel en dat wordt aangeduid als "duwboot";
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.1.g
    text: |-
      bovenmaats schip: een schip dat op grond van zijn diepgang, zijn lengte of op grond van andere kenmerken gedwongen
      is gebruik te maken van het diepste deel van het vaarwater en dat in aanvulling op Voorschrift 3, onderdeel g, van
      de Internationale Bepalingen wordt beschouwd als een schip dat in zijn manoeuvreerbaarheid beperkt is;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.1.h
    text: |-
      bepaalde gevaarlijke goederen: goederen uit klasse 1 -subklassen 1.1, 1.2, 1.3- en uit de klassen 4.1 en 5.2 van
      de Internationale voorschriften voor het vervoer van gevaarlijke stoffen met zeeschepen (IMDG-Code), waarvoor
      de bijkomende aanduiding «ontploffingsgevaar» is voorgeschreven, met een totale hoeveelheid van meer dan 100 kg
      per schip, alsmede de als massagoed in tankschepen of in duwstellen of slepen vervoerde goederen als bedoeld in
      [artikel 21, eerste lid, onderdeel 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004552#Artikel21
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004552
        artikel: '21'
  - number: 1.1.i
    text: 'bevoegde autoriteit: de functionaris die door Onze Minister als zodanig is aangewezen;'
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.1.j
    text: |-
      waterscooters: gemotoriseerde watersporttoestellen, die voor een of meerdere personen zijn gebouwd of ingericht ten
      behoeve van een glijdende voortbeweging door of over het water en als Personal Watercraft, zoals een waterbob, een
      waterscooter, jetbike of jetski worden aangeduid, of andere soortgelijke toestellen;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.1.k
    text: |-
      snelle schepen: schepen, die overeenkomstig de Internationale Code voor snelle schepen gebouwd zijn en
      dienovereenkomstig worden gebruikt, evenals schepen die niet overeenkomstig die Code gebouwd zijn, maar wel
      overeenkomstig die Code worden gebruikt of ingezet;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.1.l
    text: |-
      veiligheidszones: wateroppervlakken gelegen buiten het vaarwater, die zich uitstrekken over een afstand van ten
      hoogste 500 meter, gemeten vanuit ieder punt van de buitenste ring om installaties of andere inrichtingen ten
      behoeve van wetenschappelijk maritiem onderzoek of onderzoek naar of de ontginning van natuurschatten en door de
      beide plaatselijke autoriteiten gezamenlijk zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: '1.2'
    text: 'In de zin van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.2.a
    text: 'overdag: de tijd tussen zonsopgang en zonsondergang;'
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: 1.2.b
    text: 'des nachts: de tijd tussen zonsondergang en zonsopgang.'
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: '1.3'
    text: |-
      De schipper van een binnenschip dat een of meer andere binnenschepen voortbeweegt, is de schipper van de sleep of
      het duwstel.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: '1.4'
    text: |-
      Dit besluit geldt in de Eemsmonding, bedoeld in paragraaf 1 van Bijlage B bij het Eems-Dollardverdrag (*Trb.* 1960,
      69) en geldt in afwijkiking van en als aanvulling op de Internationale Bepalingen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel1
  - number: '2.1'
    text: |-
      Verkeerstekens, als bedoeld in dit besluit, zijn optische en akoestische tekens die geboden, verboden,
      waarschuwingen of aanwijzingen inhouden. De in het toepassingsgebied van dit besluit gebruikte verkeerstekens die
      geboden en verboden inhouden, zijn samengevat in [bijlage 1][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004552
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004552
  - number: '2.2'
    text: De door de gebods- en verbodstekens gegeven voorschriften worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel2
  - number: '2.3'
    text: Het beschadigen van de verkeerstekens of het afbreuk doen aan de herkenbaarheid daarvan is verboden.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel2
  - number: '3.1'
    text: |-
      Voor zover in de volgende voorschriften geen bijzondere bepalingen ter zake zijn opgenomen, voeren, tonen of geven
      de schepen uitsluitend in overeenstemming met het bepaalde in [bijlage 1][ref1] voor de daar voorziene doeleinden
      optische tekens en geluidsseinen. Het is verboden optische tekens te voeren of te tonen, alsmede geluidsseinen te
      geven, die met de voorgeschreven of toegestane optische tekens of geluidsseinen kunnen worden verward.


      [ref1]: https://wetten.overheid.nl/BWBR0004552
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004552
  - number: '3.2'
    text: |-
      Met betrekking tot de middelen voor het geven van de krachtens dit besluit voorgeschreven geluidsseinen is
      Voorschrift 33 van de Internationale Bepalingen van toepassing. De werking en de betrouwbaarheid van deze
      geluidsinstallaties moeten te allen tijde gewaarborgd zijn. Indien de werking of de betrouwbaarheid op duidelijk
      herkenbare wijze wordt beïnvloed, zorgen de gezagvoerder, de eigenaar en de bezitter onverwijld voor een doelmatig
      herstel.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel3
  - number: '3.3'
    text: |-
      Het is verboden zoeklichten en andere dan de voorgeschreven lichten zodanig te gebruiken, dat zij verblinden en
      daardoor de scheepvaart in gevaar kunnen brengen of hinderen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel3
  - number: '4.1'
    text: |-
      Met betrekking tot de krachtens dit besluit voorgeschreven optische tekens zijn de Voorschriften 20 en 38,
      onderdelen *c* en *h*, van de Internationale Bepalingen van toepassing. Optische tekens die krachtens dit
      besluit en krachtens de Internationale Bepalingen door vaartuigen moeten worden gevoerd, worden permanent
      meegevoerd en gedurende de tijd dat zij worden gevoerd, vast aangebracht. Zij worden gevoerd daar waar zij het
      best zichtbaar zijn. In afwijking van het bepaalde in de eerste volzin is het bepaalde in Aanhangsel I, punt
      5, eerste volzin, van de Internationale Bepalingen niet van toepassing met betrekking tot de afscherming van de
      boordlichten van binnenschepen, indien navigatielantaarns worden gebruikt die met betrekking tot de horizontale
      en verticale lichtverdeling ook zonder afscherming voldoen aan de voorschriften in Aanhangsel I, punt 9 en 10,
      van de Internationale Bepalingen of aan de voorschriften, genoemd in [artikel 5, derde lid][ref1]. Bij gebruik
      van boordlichten met afscherming is het bepaalde in Aanhangsel I, punt 5, eerste en tweede volzin, van de
      Internationale Bepalingen niet van toepassing op binnenschepen met betrekking tot de dofzwarte kleur.


      [ref1]: https://wetten.overheid.nl/BWBR0004552#Artikel5
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004552
        artikel: '5'
  - number: '4.2'
    text: De minimale zichtbaarheid van alle in dit besluit voorgeschreven lichten bedraagt 2 zeemijlen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel4
  - number: '4.3'
    text: |-
      De krachtens dit besluit en de krachtens de Internationale Bepalingen voorgeschreven ballen, kegels, ruiten en
      cilinders (dagtekens) mogen vervangen worden door inrichtingen die in alle richtingen uit de verte hetzelfde
      uiterlijk hebben als de voorgeschreven dagtekens.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel4
  - number: '4.4'
    text: |-
      De krachtens dit besluit te voeren vlaggen en borden zijn, voor zover niet anders is bepaald, rechthoekig en ten
      minste 1 meter hoog en 1 meter breed. De kleuren zijn niet verbleekt of vervuild. In plaats van de in dit besluit
      voorgeschreven vlaggen mogen ook borden van gelijke grootte, vorm en kleur worden gevoerd. Op schepen met een
      lengte van minder dan 20 meter mogen vlaggen en borden van kleinere afmeting worden gebruikt die passen bij de
      afmetingen van het schip.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel4
  - number: '5.1'
    text: |-
      In afwijking van het bepaalde in punt 2, onderdeel *a* (i), van Aanhangsel I van de Internationale Bepalingen
      behoeft het toplicht ook dan slechts op een minimale hoogte van 6 meter boven de romp te worden gevoerd, indien het
      schip breder dan 6 meter is.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het bepaalde in Voorschrift 23, onderdeel *a* (ii), van de Internationale Bepalingen behoeven
      binnenschepen met een lengte van meer dan 50 meter, doch van niet meer dan 110 meter binnen de vaargebieden tussen
      de binnenwaartse grens van het gebied waarop dit besluit betrekking heeft, bij Eems-km 35,785, en het einde van de
      Geisedam bij Eems-km 48,4 geen tweede toplicht te voeren.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel5
  - number: '5.3'
    text: |-
      Op binnenschepen mogen met betrekking tot het voeren van lichten krachtens dit besluit en krachtens de
      Internationale Bepalingen ook navigatielantaarns worden gebruikt die door de bevoegde autoriteiten als heldere
      lichten, bij gebruik als toplichten als krachtige lichten, krachtens de door de Centrale Commissie voor de
      Rijnvaart vastgestelde voorschriften zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel5
  - number: '5.4'
    text: |-
      Binnenschepen behoeven in afwijking van het bepaalde in Aanhangsel I, punt 2, onderdeel *a*, van de Internationale
      Bepalingen het voorste toplicht of eventueel het enige toplicht slechts op een hoogte van ten minste 5 meter boven
      de romp, en het achterste toplicht slechts ten minste 3 meter hoger dan het voorste licht te voeren.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel5
  - number: '6.1'
    text: |-
      In afwijking van het bepaalde in Voorschrift 25, onderdeel *d*, van de Internationale Bepalingen voeren zeilboten
      met een lengte van minder dan 12 meter, alsmede roeiboten, indien zij de krachtens Voorschrift 25, onderdeel *a*
      of *b*, van de Internationale Bepalingen voorgeschreven lichten niet kunnen voeren, ten minste een wit rondom
      schijnend licht overeenkomstig het bepaalde in No. 1 van Hoofdstuk II van bijlage 1.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel6
  - number: '6.2'
    text: |-
      Het is verboden met schepen als bedoeld in het eerste lid, waarop de aldaar voorgeschreven lichten niet kunnen
      worden gevoerd, alsmede motorschepen met een lengte van minder dan 7 meter waarop de krachtens Voorschrift 23,
      onderdelen *a* en *c*, van de Internationale Bepalingen voorgeschreven lichten niet kunnen worden gevoerd, te
      varen in de tijd dat het voeren van de lichten is voorgeschreven, tenzij zich een noodsituatie voordoet. Voor die
      situatie wordt permanent een elektrische lamp of een lantaarn die een wit licht geeft, gereed voor het gebruik
      meegevoerd en tijdig getoond om een aanvaring te voorkomen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel6
  - number: '6.3'
    text: |-
      De bevoegde autoriteit kan wateroppervlakken als anker- en ligplaatsen vaststellen waarop schepen met een lengte
      van minder dan 12 meter de krachtens Voorschrift 30, onderdeel *a, b* of *c*, van de Internationale Bepalingen
      voorgeschreven optische tekens niet behoeven te voeren; het bepaalde in Voorschrift 30, onderdeel *e*, van de
      Internationale Bepalingen blijft onverminderd van kracht.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel6
  - number: '7'
    text: |-
      Een manoeuvreerbaar motorschip dat varende is en voorzien is van een voor het gebruik gereed zijnde motor en
      dat wordt bijgestaan door één of meer sleepboten, (assisteren) voert de krachtens de Internationale Bepalingen
      voorgeschreven optische tekens van een alleenvarend motorschip.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel7
  - number: '8.1'
    text: |-
      Schepen die bepaalde gevaarlijke goederen vervoeren, voeren, behalve de krachtens de Internationale Bepalingen
      voorgeschreven optische tekens, des nachts een rood rondom schijnend licht overeenkomstig het bepaalde in no. 2 van
      Hoofdstuk II van bijlage 1 en overdag seinvlag "B" uit het Internationale Seinboek. Deze optische tekens worden ook
      gevoerd, indien de schepen ten anker gaan of gemeerd hebben. Het bepaalde in de eerste en de tweede volzin is niet
      van toepassing op oorlogsschepen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel8
  - number: '8.2'
    text: |-
      Het bepaalde in het eerste lid is ook van toepassing op tankschepen die na het lossen van bepaalde gevaarlijke
      goederen nog niet zijn gereinigd en ontgast, tenzij deze volledig geïnertiseerd zijn.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel8
  - number: '9.1'
    text: |-
      Een beperkt manoeuvreerbaar schip dat in het vaarwater bezig is met baggeren of met werkzaamheden onder water en de
      in Voorschrift 27, onderdeel *d,* van de Internationale Bepalingen voorgeschreven optische tekens dient te voeren
      voert de optische tekens overeenkomstig het bepaalde in Voorschrift 27, onderdeel *d* (ii), aan beide zijden,
      indien aan geen van beide zijden een belemmering aanwezig is.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel9
  - number: '9.2'
    text: |-
      Drijvende onderdelen waarvan door schepen die bezig zijn met baggeren of met werkzaamheden onder water, bij hun
      werkzaamheden gebruik wordt gemaakt, voeren des nachts een wit rondom schijnend licht en overdag een vierkant rood
      bord overeenkomstig het bepaalde in no. 3 van Hoofdstuk II van bijlage 1.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel9
  - number: '10.1'
    text: |-
      Schepen, drijvende inrichtingen, alsmede schepen en voorwerpen, als bedoeld in Voorschrift 24, onderdeel *g,* van
      de Internationale Bepalingen, die gemeerd zijn, voeren, tenzij zij door andere lichtbronnen voldoende en permanent
      te onderscheiden zijn, de volgende lichten:
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel10
  - number: 10.1.a
    text: |-
      bij een lengte van minder dan 50 meter een wit rondom schijnend licht, midscheeps aan de zijde van het vaarwater
      of aan het het verst tot het vaarwater reikende einde, zoveel mogelijk ter hoogte van het dek, overeenkomstig het
      bepaalde in No. 4.1 van Hoofdstuk II van bijlage 1;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel10
  - number: 10.1.b
    text: |-
      bij een lengte van 50 meter of meer steeds een wit rondom schijnend licht voor en achter aan de zijde van het
      vaarwater, zoveel mogelijk ter hoogte van het dek, overeenkomstig het bepaalde in No. 4.2 van Hoofdstuk II van
      bijlage 1.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel10
  - number: '10.2'
    text: |-
      Schepen die aan een meerboei overeenkomstig het bepaalde in E.7 van Hoofdstuk I van bijlage 1 liggen, voeren
      het optische teken van ten anker liggende schepen krachtens het bepaalde in Voorschrift 30 van de Internationale
      Bepalingen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel10
  - number: '11.1'
    text: |-
      Schepen van de openbare dienst tonen een ononderbroken, blauw flikkerlicht overeenkomstig het bepaalde in No. 5 van
      Hoofdstuk II van bijlage 1, indien bij de uitvoering van politiële taken de veiligheid en het vlotte verloop van
      het scheepvaartverkeer in gevaar kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel11
  - number: '11.2'
    text: |-
      Douaneschepen van de Bondsrepubliek Duitsland voeren des nachts drie groene rondom schijnende lichten boven
      elkaar en overdag een vierkante groene vlag op een willekeurige plaats overeenkomstig het bepaalde in No. 6.1 van
      Hoofdstuk II van bijlage 1. Douaneschepen van het Koninkrijk der Nederlanden voeren overdag een blauwe vlag met het
      opschrift "DOUANE" overeenkomstig het bepaalde in No. 6.2 van Hoofdstuk II van bijlage 1.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel11
  - number: '12'
    text: |-
      In alle gevallen waarin de verkeerssituatie dit vereist, in het bijzonder bij het invaren van andere vaarwaters en
      havens, bij het uitvaren van havens en sluizen en bij het verlaten van lig- en ankerplaatsen, wordt een lange stoot
      gegeven als aandachtssein.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel12
  - number: '13.1'
    text: |-
      Indien een schip een ander schip in gevaar brengt of door dit schip zelf in gevaar wordt gebracht, geeft het tijdig
      tweemaal na elkaar een lange stoot en vier korte stoten als gevaars- en waarschuwingssein.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel13
  - number: '13.2'
    text: |-
      Indien bij ongevallen van schepen bepaalde gevaarlijke goederen of radioactieve stoffen vrijkomen of dreigen
      vrij te komen, of indien er gevaar voor een ontploffing bestaat, wordt als "blijf weg"-sein een korte en een
      lange stoot gegeven. Dit sein blijft na inschakeling automatisch functioneren. Het sein wordt elke minuut ten
      minste vijfmaal achter elkaar steeds met tussenpozen van twee seconden gegeven. Het "blijf weg"-sein wordt
      zolang herhaald als de verkeerssituatie dit vereist. In de nabijheid van lig- en overslagplaatsen als bedoeld
      in [artikel 25, eerste lid][ref1], en [artikel 26, eerste lid][ref2], wordt in het geval van het bepaalde in de
      eerste volzin het "blijf weg"-sein ook door de voor de uitvoering van de werkzaamheden in de overslaginstallatie
      verantwoordelijke persoon gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004552#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004552#Artikel26
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004552
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0004552
        artikel: '26'
  - number: '14.1'
    text: |-
      De vaarvoorschriften van dit hoofdstuk zijn van toepassing onafhankelijk van het zicht. In afwijking van de
      Voorschriften 11 en 19 van de Internationale Bepalingen zijn Voorschrift 13, onderdelen a en c, en Voorschrift
      14, onderdelen a en c, van de Internationale Bepalingen in het vaarwater ook dan van toepassing wanneer de schepen
      elkaar op de radar kunnen waarnemen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel14
  - number: '14.2'
    text: |-
      Bij het ontmoeten van, voorbijlopen van en voorbijvaren aan schepen en installaties, dient een veilige
      passeerafstand overeenkomstig Voorschrift 8, onderdeel d, van de Internationale Bepalingen te worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel14
  - number: '14.3'
    text: |-
      In het vaarwater dienen de boegankers voor onmiddellijk gebruik gereed te zijn. Dit geldt niet voor schepen met een
      lengte kleiner dan 20 meter.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel14
  - number: 14a.1
    text: Veiligheidszones worden niet bevaren.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel14a
  - number: 14a.2
    text: |-
      Het eerste lid is niet van toepassing op schepen die voor de verzorging van installaties of inrichtingen zijn
      ingezet.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel14a
  - number: '15.1'
    text: In het vaarwater wordt zoveel mogelijk aan de rechterzijde gevaren.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel15
  - number: '15.2'
    text: |-
      Binnen de vaarwatergedeelten die door de bevoegde autoriteiten zijn vastgesteld, mag door alle of door bepaalde
      categorieën schepen aan de linkerzijde worden gevaren. De bevoegde autoriteit kan bijzondere categorieën schepen
      vaststellen die de eens gekozen linkerzijde van het vaarwater dienen aan te houden.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel15
  - number: '15.3'
    text: |-
      Buiten het vaarwater wordt op zodanige wijze gevaren, dat duidelijk zichtbaar is dat geen gebruik van het vaarwater
      wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel15
  - number: '16.1'
    text: |-
      In beginsel wordt aan bakboord voorbijgelopen. Voor zover de bijzondere situatie het vereist, mag aan stuurboord
      worden voorbijgelopen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel16
  - number: '16.2'
    text: |-
      Het voorbijlopende schip let op het achteropkomende verkeer en vermindert de vaart zodanig of houdt een zodanige
      zijwaartse afstand aan, dat er geen gevaarlijke zuiging kan ontstaan, en voegt zo snel mogelijk weer naar
      stuurboord in, zonder daarbij het voorbijgelopen schip in gevaar te brengen of te hinderen. Het schip dat opgelopen
      wordt, vergemakkelijkt zoveel mogelijk het voorbijlopen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel16
  - number: '16.3'
    text: |-
      Kan in een vaarwater alleen met de medewerking van het opgelopen schip veilig worden voorbijgelopen, dan is
      het voorbijlopen alleen toegestaan als het voorbij te lopen schip met een daartoe strekkend verzoek of daartoe
      strekkende aankondiging van het oplopende schip ondubbelzinnig heeft ingestemd. Het oplopende schip kan, in
      afwijking van Voorschrift 9, onderdeel e (i), van de Internationale Bepalingen zijn voornemen over de marifoon aan
      het voorbij te lopen schip mededelen, indien:
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel16
  - number: 16.3.a
    text: ondubbelzinnige identificatie plaatsvindt van de deelnemers aan de communicatie;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel16
  - number: 16.3.b
    text: een ondubbelzinnige afspraak over de marifoon mogelijk is;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel16
  - number: 16.3.c
    text: |-
      door de keuze van het marifoonkanaal gewaarborgd is dat zo mogelijk alle betrokken verkeersdeelnemers met de
      afspraak over de marifoon kunnen meeluisteren; en
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel16
  - number: 16.3.d
    text: de verkeerssituatie het toestaat.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel16
  - number: '17.1'
    text: |-
      Het ontmoeten is verboden op plaatsen, binnen vaargebieden en tussen bepaalde schepen, die door de bevoegde
      autorioteit zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel17
  - number: '17.2'
    text: |-
      In afwijking van Voorschrift 14 van de Internationale Bepalingen mogen schepen binnen vaarwatergedeelten
      als bedoeld in [artikel 15, tweede lid, eerste volzin][ref1], voor een tegemoetkomend schip bij uitzondering
      naar bakboord uitwijken. Het voornemen dient aan het tegemoetkomende schip kenbaar te worden gemaakt. Aan het
      tegemoetkomende schip kan het schip zijn voornemen door middel van de marifoon mededelen, indien


      [ref1]: https://wetten.overheid.nl/BWBR0004552#Artikel15
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004552
        artikel: '15'
  - number: 17.2.a
    text: ondubbelzinnige identificatie plaatsvindt van de deelnemers aan de communicatie;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel17
  - number: 17.2.b
    text: een ondubbelzinnige afspraak over de marifoon mogelijk is;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel17
  - number: 17.2.c
    text: |-
      door de keuze van het marifoonkanaal gewaarborgd is dat zo mogelijk alle betrokken verkeersdeelnemers met de
      afspraak over de marifoon kunnen meeluisteren, en
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel17
  - number: 17.2.d
    text: de verkeerssituatie het toestaat.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel17
  - number: '18.1'
    text: Schepen die in een vaarwater varen, hebben voorrang ten opzichte van schepen die
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel18
  - number: 18.1.a
    text: het vaarwater invaren,
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel18
  - number: 18.1.b
    text: het vaarwater kruisen,
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel18
  - number: 18.1.c
    text: in het vaarwater keren, of
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel18
  - number: 18.1.d
    text: hun anker- of ligplaatsen verlaten.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel18
  - number: '18.2'
    text: |-
      Schepen die zich in een vaarwater bevinden hebben voorrang boven schepen die dit vaarwater vanuit een aftakking of
      een uitmonding invaren.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel18
  - number: '18.3'
    text: |-
      Indien schepen van beide zijden een engte naderen die niet met zekerheid voldoende ruimte voor een gelijktijdige
      doorvaart biedt, of een door het verkeersteken A.2 van Hoofdstuk I van bijlage 1 gekenmerkte plaats van het
      vaarwater, heeft in aan getijden onderhevige wateren het stroomafwaarts varende schip voorrang en bij stilstaand
      water het schip dat daarvóór tegen de stroom in gevaren heeft. Het tot wachten verplichte schip wacht zolang buiten
      de engte, tot het andere schip gepasseerd is.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel18
  - number: '18.4'
    text: |-
      Het schip dat voorrang dient te verlenen, maakt tijdig door zijn vaargedrag kenbaar dat het zal wachten. Het is
      verboden door te varen, als niet kan worden overzien dat de scheepvaart niet wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel18
  - number: '18.5'
    text: |-
      De bevoegde autoriteit kan voor bepaalde plaatsen, binnen vaargebieden en tussen bepaalde schepen afwijkende
      voorrangsregels vaststellen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel18
  - number: '18.6'
    text: |-
      Zeilschepen dienen in het vaarwater voor elkaar uitsluitend overeenkomstig de Internationale Bepalingen uit te
      wijken wanneer ze daardoor schepen die voorrang hebben niet in gevaar brengen of hinderen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel18
  - number: '19.1'
    text: |-
      Ieder schip, iedere waterscooter en iedere zeilplank dient met inachtneming van Voorschrift 6 van de Internationale
      Bepalingen met een veilige snelheid te varen. Indien het verkeer door verkeerstekens wordt geregeld, wordt de
      snelheid zodanig aangepast, dat bij een onverwachte wijziging van het optische of het akoestische verkeersteken het
      schip onmiddellijk tot stilstand kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel19
  - number: '19.2'
    text: |-
      Het is verboden vóór plaatsen met een duidelijk als zodanig herkenbare badinrichting buiten het vaarwater op een
      afstand van minder dan 500 meter van de bestaande waterlijn van de oever met een grotere maximumsnelheid dan 8 km,
      4,3 zeemijlen, per uur door het water te varen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel19
  - number: '19.3'
    text: |-
      Schepen verminderen hun snelheid tijdig zodanig als noodzakelijk is om gevaren als gevolg van zuiging of golfslag
      te vermijden, in het bijzonder bij het voorbijvaren van onmanoeuvreerbare en vastgevaren schepen, alsmede van
      beperkt manoeuvreerbare schepen als bedoeld in Voorschrift 3, onderdeel *g*, schepen en voorwerpen, als bedoeld in
      Voorschrift 24, onderdeel *g*, van de Internationale Bepalingen, en drijvende inrichtingen, alsmede van plaatsen
      die door het verkeersteken A.4 van Hoofdstuk I van bijlage 1 of door seinvlag "A" van het Internationale Seinboek
      zijn gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel19
  - number: '20'
    text: |-
      Het is verboden dat slepen en duwstellen meer gesleepte schepen, drijvende inrichtingen of drijvende voorwerpen of
      duwbakken omvatten dan de sleepboten of duwboten, rekening houdend met de verkeerssituatie en de gesteldheid van de
      vaarweg, veilig kunnen geleiden.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel20
  - number: '21.1'
    text: |-
      De Eemsmonding mag door de hieronder vermelde schepen alleen onder de in het tweede lid genoemde voorwaarden
      bevaren worden:
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21.1.a
    text: Tankschepen, duwstellen en slepen die
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21.1.a.1
    text: |-
      gasvormige stoffen overeenkomstig de Internationale Code voor de bouw en uitrusting van schepen die vloeibaar gas
      als massagoed vervoeren (IGC-Code), behoudens stikstof en koelvloeistoffen,
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21.1.a.2
    text: |-
      vloeibare stoffen overeenkomstig de Internationale Code voor de bouw en uitrusting van schepen, die chemicaliën
      als massagoed vervoeren (IBC-Code), waarvoor krachtens Hoofdstuk 15, paragraaf 15.19 van de IBC-Code, zonder enige
      uitzondering overvulbeveiligingen en een alarm dat de vulhoogte aangeeft zijn voorgeschreven en die daarom de
      aantekening»15.19» in kolom «o»van de tabel in Hoofdstuk 17 van de Code hebben, of
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21.1.a.3
    text: |-
      vloeibare stoffen, die vallen onder Bijlage I van het op 2 november 1973 te Londen tot stand gekomen Internationaal
      Verdrag ter voorkoming van verontreiniging door schepen, met Protocollen en Bijlagen (Trb. 1975, 147), zoals
      gewijzigd door het op 17 februari 1978 te Londen tot stand gekomen Protocol van 1978 bij dat verdrag, met Bijlage
      (Trb. 1978, 188) (MARPOL-Verdrag),
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21.1.b
    text: |-
      lege tankschepen, duwstellen en slepen na het lossen van de in de onderdelen b of c genoemde stoffen -uitgezonderd
      restanten, die bij normaal functioneren van de losinstallaties niet meer kunnen worden gepompt- voorzover het
      vlampunt van de laatste lading lager was dan 35° C en de tanks niet gereinigd en ontgast of volledig geïnertiseerd
      zijn.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21.1.c
    text: reactorschepen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: '21.2'
    text: 'De voorwaarden voor het bevaren van de Eemsmonding zijn:'
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21.2.a
    text: bij het invaren van de Eemsmonding of bij het verlaten van een ligplaats bedraagt het zicht meer dan 1000 meter;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21.2.b
    text: |-
      er bestaat een permanente marifoonverbinding met de door de bevoegde autoriteit vastgestelde positie, die ook dan
      is verzekerd, wanneer met andere posities gesprekken via de marifooninstallatie worden gevoerd;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21.2.c
    text: |-
      er is een goed functionerend radarapparaat ingeschakeld, waarvan het scherm bij beperkt zicht permanent door een
      deskundige wordt geobserveerd;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21.2.d
    text: |-
      het gebruik van automatische stuurinrichtingen geschiedt op de door de bevoegde autoriteit vastgestelde
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21.2.e
    text: de tankdeksels worden gesloten gehouden.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: '21.3'
    text: |-
      De bevoegde autoriteit kan met betrekking tot schepen als bedoeld in het eerste lid, en met betrekking tot lege
      tankschepen, met inbegrip van duwstellen en slepen, na het lossen van de in No. 1 van bijlage 2 genoemde stoffen
      verdere voorwaarden voor het bevaren van de Eemsmonding, in het bijzonder met betrekking tot het aannemen van
      sleepboothulp, vaststellen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: '21.4'
    text: |-
      Het bevaren door bepaalde schepen of categorieën schepen van de door de bevoegde autoriteit vastgestelde
      wateroppervlakken zonder voorafgaande melding bij de bevoegde autoriteit en inachtneming van de regelingen voor de
      verkeersgeleiding is verboden.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: '21.5'
    text: |-
      Het bevaren van wateroppervlakken in bepaalde perioden, bij bepaalde waterstanden of bij weersomstandigheden, die
      door de bevoegde autoriteit zijn vastgesteld, is verboden. Deze bepaling is niet van toepassing op categorieën
      schepen die door de bevoegde autoriteit zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: '21.6'
    text: |-
      Door de verkeerscentrale kan met goedvinden van de beide bevoegde autoriteiten in individuele gevallen ontheffing
      worden verleend van de in het tweede lid genoemde voorwaarden voor het bevaren van de Eemsmonding.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21
  - number: 21a
    text: De bevoegde autoriteit kan voorwaarden stellen voor het bevaren van de Eemsmonding met snelle schepen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel21a
  - number: '22.1'
    text: |-
      In het vaarwater is waterskiën en het varen met waterscooters verboden, uitgezonderd op de met verkeersteken C.2
      of C.5 van Hoofdstuk I van bijlage 1 aangeduide of door de bevoegde autoriteit vastgestelde wateroppervlakken.
      Buiten het vaarwater is waterskiën en het varen met waterscooters toegestaan, uitgezonderd op de door de bevoegde
      autoriteit vastgestelde wateroppervlakken.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel22
  - number: '22.2'
    text: |-
      Waterskiërs en de hen voorttrekkende boten, alsmede bestuurders van waterscooters dienen voor alle andere schepen
      uit te wijken. Wanneer er sprake is van tegemoetkomende schepen dienen waterskiërs binnen het kielzog van de hen
      voorttrekkende boten te blijven.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel22
  - number: '22.3'
    text: Het varen met een zeilplank is verboden
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel22
  - number: 22.3.a
    text: in het vaarwater, uitgezonderd in de door de bevoegde autoriteit vastgestelde vaarwaters;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel22
  - number: 22.3.b
    text: buiten het vaarwater op de door de bevoegde autoriteit vastgestelde wateroppervlakken.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel22
  - number: '22.4'
    text: |-
      Op de vrijgegeven wateroppervlakken mag des nachts, bij beperkt zicht en gedurende de door de bevoegde autoriteit
      vastgestelde tijden niet worden gewaterskied of met een waterscooter of een zeilplank worden gevaren.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel22
  - number: '23.1'
    text: |-
      Het is verboden te ankeren in het vaarwater, uitgezonderd op de reden en in de door de bevoegde autoriteit
      vastgestelde wateroppervlakken. Dit verbod geldt niet voor beperkt manoeuvreerbare schepen als bedoeld in
      Voorschrift 3, onderdeel g (i) en (ii), van de Internationale Bepalingen. Buiten het vaarwater is het verboden te
      ankeren in de volgende wateroppervlakken:
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel23
  - number: 23.1.a
    text: in engten en in onoverzichtelijke bochten;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel23
  - number: 23.1.b
    text: |-
      binnen een omtrek van 300 meter van beperkt manoeuvreerbare schepen, wrakken en andere obstakels voor de
      scheepvaart, en leidingstraten, alsmede van plaatsen die door de verkeerstekens E.5 van Hoofdstuk I van bijlage 1
      gekenmerkt zijn;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel23
  - number: 23.1.c
    text: op plaatsen en binnen wateroppervlakken, die door de bevoegde autoriteit zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel23
  - number: 23.1.d
    text: vóór haveningangen, aanlegplaatsen en uitwateringssluizen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel23
  - number: '23.2'
    text: |-
      Het slepen van het anker is verboden. In het gebied van de in het eerste lid, onderdeel *b*, genoemde
      wateroppervlakken is ook het gebruik van het anker voor manoeuvreerdoeleinden verboden.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel23
  - number: '23.3'
    text: |-
      Het is verboden dat schepen op reden ankeren met het oog op een ander doel dan waarvoor de rede bestemd is. De
      voorwaarden worden door de bevoegde autoriteit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel23
  - number: '23.4'
    text: |-
      Op een in de nabijheid van het vaarwater of op een rede ten anker liggend schip of een schip en een voorwerp, als
      bedoeld in Voorschrift 24, onderdeel *g*, van de Internationale Bepalingen, alsmede op schepen waarop krachtens
      het bepaalde in het vierde lid het verbod tot ankeren niet van toepassing is, wordt permanent ankerwacht gelopen.
      Dit voorschrift geldt niet voor schepen met een lengte van minder dan 12 meter op de krachtens het bepaalde in
      [artikel 6, derde lid][ref1], vastgestelde wateroppervlakken.


      [ref1]: https://wetten.overheid.nl/BWBR0004552#Artikel6
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004552
        artikel: '6'
  - number: '24.1'
    text: |-
      Het is verboden door het aanleggen en meren de scheepvaart te belemmeren. Indien een schip met de aanlegmanoeuvre
      is begonnen, houdt de overige scheepvaart rekening met deze omstandigheid en navigeert zij met de geboden
      voorzichtigheid.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel24
  - number: '24.2'
    text: 'Het is verboden aan te leggen en te meren:'
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel24
  - number: 24.2.a
    text: aan peilschalen en vaste en drijvende verkeerstekens;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel24
  - number: 24.2.b
    text: |-
      op plaatsen waar het ankeren krachtens het bepaalde in [artikel 23, eerste lid, onderdelen a en d][ref1], verboden
      is;


      [ref1]: https://wetten.overheid.nl/BWBR0004552#Artikel23
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004552
        artikel: '23'
  - number: 24.2.c
    text: op plaatsen die door de bevoegde autoriteit zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel24
  - number: '25.1'
    text: |-
      Buiten de havens en overslagplaatsen is het overslaan van goederen met inbegrip van het bunkeren verboden, tenzij
      zulks geschiedt op de door de bevoegde autoriteit daarvoor vastgestelde reden en ligplaatsen en met inachtneming
      van de vastgestelde voorwaarden. Van de overslag van bepaalde gevaarlijke goederen wordt tijdig van tevoren kennis
      gegeven aan de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel25
  - number: '25.2'
    text: |-
      Tijdens de overslag is het verboden dat, aan elke zijde van een schip dat bepaalde gevaarlijke goederen vervoert,
      meer dan één bij de overslag betrokken schip langszij ligt.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel25
  - number: '25.3'
    text: |-
      Niet bij de overslag betrokken schepen blijven op voldoende veilige afstand van de bij de overslag betrokken
      schepen die bepaalde gevaarlijke goederen vervoeren, of ontruimen de anker- of de ligplaats.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel25
  - number: '25.4'
    text: Na het beëindigen van de overslag verlaat het schip onverwijld de rede of de ligplaats.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel25
  - number: '25.5'
    text: |-
      Alle overige voorschriften die betrekking hebben op het omgaan met gevaarlijke goederen, blijven onverminderd van
      kracht.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel25
  - number: '26.1'
    text: |-
      Het is verboden dat schepen die bepaalde schadelijke goederen vervoeren, ankeren of meren op andere dan op de door
      de bevoegde autoriteit vastgestelde reden en ligplaatsen. De door de bevoegde autoriteit vastgestelde voorwaarden
      worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel26
  - number: '26.2'
    text: |-
      Indien meer schepen die bepaalde gevaarlijke goederen vervoeren, gelijktijdig binnen het gebied van de rede of de
      ligplaats liggen, houden zij, rekening houdend met de plaatselijke omstandigheden, een voldoende veilige afstand
      ten opzichte van elkaar aan.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel26
  - number: '26.3'
    text: |-
      Ten opzichte van schepen die bepaalde gevaarlijke goederen vervoeren, houden de overige schepen, in het bijzonder
      rekening houdend met wegvliegende vonken, een voldoende veilige afstand aan, met uitzondering van sleepboten,
      ravitaillerings- en tankreinigingsschepen, alsmede schepen die betrokken zijn bij de overslag. Het is verboden dat
      deze schepen het gebied van de rede of de ligplaats invaren, als de schoorsteen en de uitlaatleidingen niet zijn
      voorzien van een inrichting die het wegvliegen van vonken verhindert.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel26
  - number: '26.4'
    text: |-
      Het is verboden dat bij gemeerde tankschepen die na het lossen van bepaalde gevaarlijke goederen niet zijn
      gereinigd en ontgast, tijdens het vullen van de tanks met ballastwater schepen langszij liggen, terwijl het tijdens
      het reinigen en ontgassen verboden is dat andere schepen dan de daarvoor noodzakelijke tankreinigingsschepen
      langszij liggen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel26
  - number: '26.5'
    text: |-
      Gemeerde schepen die bepaalde gevaarlijke goederen vervoeren, alsmede schepen die in de nabijheid daarvan liggen,
      kunnen te allen tijde onmiddellijk worden verhaald.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel26
  - number: '27.1'
    text: |-
      Indien er gevaar voor zinken bestaat, wordt het schip indien mogelijk zo ver buiten het vaarwater gebracht, dat de
      scheepvaart niet wordt belemmerd. Na een aanvaring is de gezagvoerder van een daarbij betrokken, drijvend gebleven
      schip daartoe ook verplicht.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel27
  - number: '27.2'
    text: |-
      Indien de voor de scheepvaart vereiste toestand van de waterweg of de veiligheid en het vlotte verloop van
      het verkeer door in de waterweg stuurloos ronddrijvende, vastgevaren, gestrande of gezonken schepen, drijvende
      inrichtingen, alsmede schepen of voorwerpen, als bedoeld in Voorschrift 24, onderdeel *g*, van de Internationale
      Bepalingen, of door andere drijvende of aan de grond geraakte voorwerpen in gevaar worden gebracht, wordt de
      verkeerscentrale aan de Knock onverwijld ingelicht.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel27
  - number: '27.3'
    text: |-
      De plaats van een gezonken schip wordt door de gezagvoerder daarvan onverwijld voorlopig gemarkeerd. Na een
      aanvaring is de gezagvoerder van een daarbij betrokken, drijvend gebleven schip daartoe ook verplicht. Het is
      verboden de reis voort te zetten zonder toestemming van de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel27
  - number: '27.4'
    text: |-
      Bij branden en andere de veiligheid en het vlotte verloop van het verkeer in gevaar brengende voorvallen op schepen
      en drijvende inrichtingen, alsmede op schepen en voorwerpen, als bedoeld in Voorschrift 24, onderdeel *g*, van de
      Internationale Bepalingen, wordt de radarcentrale aan de Knock daarvan onverwijld in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel27
  - number: '27.5'
    text: |-
      Op schepen die het in [artikel 13, tweede lid][ref1], bedoelde "blijf weg"-sein waarnemen, worden onverwijld alle
      vereiste maatregelen tot afwending van het dreigende gevaar getroffen. In het bijzonder worden:


      [ref1]: https://wetten.overheid.nl/BWBR0004552#Artikel13
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004552
        artikel: '13'
  - number: 27.5.a
    text: alle naar buiten leidende en niet tot instandhouding van de scheepshuishouding noodzakelijke openingen gesloten;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel27
  - number: 27.5.b
    text: |-
      alle niet voor de waarborging van de veiligheid van schip, bemanning en lading noodzakelijke hulpmachines
      stopgezet;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel27
  - number: 27.5.c
    text: onbeschermde open vuren geblust, in het bijzonder het roken gestaakt; en
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel27
  - number: 27.5.d
    text: toestellen met gloeiende of vonken verspreidende onderdelen stilgezet.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel27
  - number: '28.1'
    text: 'Een vergunning van de bevoegde autoriteit is vereist voor:'
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel28
  - number: 28.1.a
    text: |-
      het verkeer van buitengewoon grote schepen die de door de bevoegde autoriteit vastgestelde afmetingen met
      betrekking tot de lengte, de breedte en de diepgang overschrijden;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel28
  - number: 28.1.b
    text: |-
      het verkeer van luchtkussenvaartuigen en snelle schepen alsmede van draagvleugelboten, hoovercrafts en katamarans,
      uitgezonderd pleziervaartuigen, schepen in beheer bij de Koninklijke Marine of een ander schip in beheer bij het
      Ministerie van Defensie, voor zover het behoort tot de organieke uitrusting van het legerkorps en van de hulp-
      en reddingsdiensten;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel28
  - number: 28.1.c
    text: |-
      het verkeer van duwstellen en slepen, die de scheepvaart buitengewoon kunnen hinderen of waarmee de scheepvaart
      bijzonder rekening dient te houden, het slepen van drijvende inrichtingen, alsmede het slepen van schepen en
      voorwerpen, als bedoeld in Voorschrift 24, onderdeel g, van de Internationale Bepalingen;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel28
  - number: 28.1.d
    text: |-
      de berging van schepen, drijvende inrichtingen en voorwerpen, voor zover afbreuk wordt gedaan aan de veiligheid en
      het vlotte verloop van het verkeer, en de berging niet door de bevoegde autoriteit is bevolen;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel28
  - number: 28.1.e
    text: |-
      de beproeving en het onderzoek van de trekkracht van schepen, alsmede het proefdraaien in stilliggende positie, die
      afbreuk kunnen doen aan de veiligheid en het vlotte verloop van het verkeer;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel28
  - number: 28.1.f
    text: parasailing;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel28
  - number: 28.1.g
    text: watersportevenementen op het water;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel28
  - number: 28.1.h
    text: andere evenementen die afbreuk kunnen doen aan de veiligheid en het vlotte verloop van het verkeer.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel28
  - number: '28.2'
    text: De vergunning wordt tijdig aangevraagd.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel28
  - number: '28.3'
    text: De vergunning kan onder beperkingen worden verleend en er kunnen voorschriften aan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel28
  - number: '29.1'
    text: |-
      Schepen, duwstellen en slepen, die de door de bevoegde autoriteit vastgestelde afmetingen overschrijden, worden
      tijdig vóór het bevaren van de Eemsmonding onder opgave van de naam, de positie, de afmetingen en de haven
      van bestemming, alsmede bij de vastgestelde posities onder opgave van de naam, de positie, de snelheid en de
      passeertijd gemeld. De krachtens het bepaalde in de eerste volzin voorgeschreven melding geschiedt ook bij
      onderbreking en bij voortzetting van de reis.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: '29.2'
    text: |-
      Schepen als bedoeld in [artikel 21, eerste lid][ref1], worden vierentwintig uur vóór het bevaren van de
      Eemsmonding, doch uiterlijk bij het uitvaren van de laatste vertrekhaven, gemeld. Overigens melden deze schepen
      zich overeenkomstig het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004552#Artikel21
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004552
        artikel: '21'
  - number: '29.3'
    text: 'De melding krachtens het bepaalde in het tweede lid, eerste volzin, bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: 29.3.a
    text: naam en roepletters van het schip;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: 29.3.b
    text: |-
      vermoedelijke datum en tijd van aankomst bij de eerste voor de melding vastgestelde positie: datum in twee cijfers,
      plaatselijke tijd in vier cijfers,
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: 29.3.c
    text: nationaliteit van het schip;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: 29.3.d
    text: lengte en diepgang van het schip;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: 29.3.e
    text: haven van vertrek en van bestemming;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: 29.3.f
    text: |-
      aard van de lading en vermelding van de bepaalde gevaarlijke goederen volgens het bepaalde in [bijlage 2][ref1],
      alsmede van de desbetreffende hoeveelheid;


      [ref1]: https://wetten.overheid.nl/BWBR0004552
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004552
  - number: 29.3.g
    text: |-
      bij het vervoer van chemicaliën of vloeibare gassen als massagoed de vermelding of het schip is voorzien van een
      certificaat van geschiktheid krachtens de Voorschriften van de Internationale Maritieme Organisatie voor de bouw
      en de uitrusting van schepen voor het vervoer van gevaarlijke chemicaliën als massagoed of een certificaat van
      geschiktheid krachtens de Voorschriften van de Internationale Maritieme Organisatie voor de bouw en de uitrusting
      van schepen voor het vervoer van vloeibare gassen als massagoed;
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: 29.3.h
    text: verklaring of het schip of de lading gebreken vertoont; en
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: 29.3.i
    text: naam van de reder of diens gemachtigde.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: '29.4'
    text: |-
      De krachtens het bepaalde in het eerste en het tweede lid voorgeschreven meldingen geschieden door de gezagvoerder
      van het schip, door de reder of hun gemachtigde bij de bevoegde autoriteit. De meldingen krachtens het bepaalde in
      het tweede lid, eerste volzin, vinden schriftelijk plaats.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: '29.5'
    text: |-
      De gezagvoerder van een met een marifoon uitgerust schip is verplicht bij het in acht nemen van de voorschriften
      inzake het verkeersgedrag, de door de verkeerscentrale in het Duits, op verzoek in het Nederlands of Engels
      verstrekte verkeersinformatie, alsmede aanwijzingen en waarschuwingen te beluisteren en deze onverwijld
      overeenkomstig de omstandigheden in de gegeven verkeerssituatie in aanmerking te nemen. Op verzoek van de
      verkeerscentrale dient de gezagvoerder van het schip zich bij haar te melden en deel te nemen aan de communicatie
      met de verkeerscentrale.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel29
  - number: '30'
    text: |-
      De schepen van de openbare dienst zijn vrijgesteld van de naleving van de voorschriften van dit besluit, voor zover
      zulks voor de uitvoering van opdrachten van overheidswege, daarbij naar behoren rekening houdend met de openbare
      orde en veiligheid, dringend geboden is.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel30
  - number: '31'
    text: |-
      In bijzondere omstandigheden kan de bevoegde autoriteit een schip geheel of gedeeltelijk ontheffing verlenen van de
      naleving van de Internationale Bepalingen en van de bepalingen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel31
  - number: '32'
    text: |-
      De verlening van toestemming, bedoeld in [artikel 27, derde lid][ref1], de verlening van een vergunning, bedoeld
      in [artikel 28, eerste lid][ref2], het bevel tot berging, bedoeld in artikel 28, eerste lid, onderdeel c, en de
      verlening van ontheffing, bedoeld in [artikel 31][ref3] van dit besluit, door de bevoegde autoriteit geschieden
      met inachtneming van artikel 34, tweede lid, van het Eems-Dollardverdrag. In de aldaar aan de Duitse autoriteiten
      toegewezen gebieden is in plaats van de Nederlandse bevoegde autoriteit de door de Duitse autoriteiten aangewezen
      bevoegde autoriteit bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004552#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004552#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0004552#Artikel31
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004552
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0004552
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0004552
        artikel: '31'
  - number: '33.1'
    text: |-
      De kapitein of de schipper is verantwoordelijk voor de naleving van de bepalingen van dit besluit tenzij uit de
      bepalingen blijkt dat de naleving aan anderen is opgedragen.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel33
  - number: '33.2'
    text: |-
      De schipper van een schip dat deel uitmaakt van een sleep of een duwstel volgt de aanwijzingen van de schipper van
      de sleep of het duwstel op. Hij neemt evenwel, ook wanneer zulke aanwijzingen niet worden gegeven, alle maatregelen
      die voor het op juiste wijze voeren van zijn schip door de omstandigheden worden geboden.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel33
  - number: '33.3'
    text: |-
      Een lid van de bemanning van een schip volgt de aanwijzingen op die hem door de kapitein of de schipper binnen de
      grenzen van diens verantwoordelijkheid worden gegeven. Hij werkt ook zonder diens aanwijzingen mede aan de naleving
      van de bepalingen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel33
  - number: '33.4'
    text: |-
      Ieder ander die zich aan boord van een schip bevindt volgt de aanwijzingen op die hem door de kapitein of de
      schipper in het belang van de veiligheid van de scheepvaart of van de goede orde aan boord worden gegeven.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel33
  - number: '34.1'
    text: |-
      De kapitein of de schipper neemt, ook bij het ontbreken van uitdrukkelijke voorschriften in dit besluit, alle
      voorzorgsmaatregelen die volgens goede zeemanschap of door de omstandigheden waarin het schip, de sleep of het
      duwstel zich bevindt in het belang van de scheepvaart of de goede orde van de scheepvaart zijn geboden.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel34
  - number: '34.2'
    text: |-
      De kapitein of de schipper wijkt in het belang van de veiligheid of de goede orde van de scheepvaart, voor zover
      dit door de bijzondere omstandigheden waarin het schip, de sleep of het duwstel zich bevindt is geboden, volgens
      goede zeemanschap af van de bepalingen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel34
  - number: '35'
    text: |-
      De kapitein of de schipper geeft gevolg aan een met inachtneming van artikel 34, tweede lid, van het Eems-
      Dollardverdrag gegeven verkeersaanwijzing.
    url: https://wetten.overheid.nl/BWBR0004552/2002-06-26#Artikel35
  - number: '36'
    text: |-
      Overtreding van de bij of krachtens de [artikelen 2, tweede en derde lid][ref1], [3 tot en met 27][ref2],
      [28, eerste lid][ref3], [29][ref4], [33, tweede, derde en vierde lid][ref5], [34][ref6] en [35, tweede lid][ref7],
      van dit besluit vastgestelde voorschriften is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0004552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004552#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0004552#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0004552#Artikel33
