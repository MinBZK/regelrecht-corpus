  - number: '38'
    text: |-
      De op grond van [artikel 1, eerste lid, onder c][ref1], [artikel 15, tweede lid][ref2],
      [artikel 16, vijfde lid][ref3], [artikel 17, derde lid][ref4], [artikel 18, vijfde lid][ref5],
      [artikel 21, tweede, derde, vierde en vijfde lid][ref6], [artikel 22, eerste, derde en vierde lid][ref7],
      [artikel 23, eerste en vierde lid][ref8], [artikel 24, tweede lid][ref9], [artikel 25, eerste lid][ref10],
      [artikel 26, eerste lid][ref11], [artikel 28, eerste lid][ref12], en [artikel 29, eerste lid][ref13], van dit
      besluit vastgestelde voorschriften worden als bekendmakingen aan de scheepvaart uitgegeven en gepubliceerd in de
      Nederlandse Staatscourant.


