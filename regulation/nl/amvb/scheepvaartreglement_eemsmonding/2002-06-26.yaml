  - number: '37'
    text: |-
      Met de opsporing van de bij dit besluit strafbaar gestelde feiten zijn, behalve de in
      [artikel 141 van het Wetboek van Strafvordering][ref1] genoemde ambtenaren, de daartoe door Onze Minister van
      Verkeer en Waterstaat aangewezen ambtenaren belast.


