preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 18 november 1993, directoraat-generaal voor Openbare
    Orde en Veiligheid, directie Politie, hoofdafdeling Personeel, Onderwijs en Informatievoorziening, afdeling
    Arbeidsvoorwaardenbeleid, nr. EA93/U3220;

    Gelet op artikel 50, eerste lid, van de Politiewet 1993;

    De Raad van State gehoord (advies van 7 februari 1994, nr. WO4.93 0767);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 11 maart 1994, directoraat-generaal voor
    Openbare Orde en Veiligheid, directie Politie, hoofdafdeling Personeel, Onderwijs en Informatievoorziening,
    afdeling Arbeidsvoorwaardenbeleid, nr. EA94/420;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.b
    text: 'bevoegd gezag:'
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.b.1°
    text: |-
      de korpsbeheerder, voor zover het betreft de adspirant, de ambtenaar, aangesteld voor de uitvoering van de
      politietaak en de ambtenaar aangesteld voor de uitvoering van technische, administratieve en andere taken ten
      dienste van de politie, die werkzaam is bij een regionaal politiekorps.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.b.2°
    text: |-
      Onze Minister, voor zover het betreft de adspirant, de ambtenaar, aangesteld voor de uitvoering van de politietaak,
      en de ambtenaar, aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van
      de politie, die werkzaam is bij het Korps landelijke politiediensten dan wel bij de Organisatie Informatie- en
      communicatietechnologie OOV;
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.b.3°
    text: Onze Minister van Justitie, voor zover het betreft de bijzondere ambtenaar van politie;
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.b.4°
    text: |-
      de bestuursraad van het LSOP, voor zover het betreft de ambtenaren, bedoeld in
      [artikel 9, eerste lid, onderdelen ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel9
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '9'
  - number: 1.b.5°
    text: |-
      de directie van het LSOP, zover het betreft de ambtenaren, bedoeld in [artikel 9, eerste lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel9
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '9'
  - number: 1.c
    text: |-
      ambtenaar: de ambtenaar, bedoeld in [artikel 1, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 1.d
    text: |-
      plaats van tewerkstelling: de plaats van tewerkstelling, bedoeld in
      [artikel 1, eerste lid, onder t, van het Besluit algemene rechtspositie politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 1.e
    text: 'dienstreis:'
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.e.1°
    text: |-
      een naar het oordeel van het bevoegd gezag noodzakelijke verplaatsing van een ambtenaar tot het verrichten van
      dienst buiten zijn plaats van tewerkstelling;
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.e.2°
    text: |-
      indien de plaats van tewerkstelling van de ambtenaar de aanlegplaats van een vaartuig is, de noodzakelijke
      verplaatsing met dit vaartuig dat als zodanig tijdelijk wordt gebruikt tot het verrichten van dienst, alsmede het
      verblijf aan boord en aan land, verbonden aan deze verplaatsing;
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.f
    text: |-
      woonplaats: de gemeente of het met name bekende afzonderlijk liggende deel van de gemeente waar de woning van de
      ambtenaar is gelegen;
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.g
    text: 'dienstvoertuig: een voertuig dat door het bevoegd gezag ter beschikking is gesteld;'
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.h
    text: 'gehuurd vervoermiddel: een taxi of een bij een verhuurbedrijf voor de dienstreis gehuurd vervoermiddel;'
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: 1.i
    text: |-
      eigen vervoermiddel: een vervoermiddel, niet zijnde een middel van openbaar vervoer, een dienstvoertuig of een
      gehuurd vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel1
  - number: '2.1'
    text: |-
      Naar de regels bij of krachtens dit besluit wordt aan de ambtenaar een vergoeding verleend voor reis- en
      verblijfkosten ter zake van dienstreizen die ten behoeve van de dienst zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel2
  - number: '2.2'
    text: |-
      Dienstreizen die binnen Nederland zijn begonnen, waarbij het reisgedeelte buiten Nederland beperkt is, of
      waarbij de grensoverschrijding niet noodzakelijkerwijs leidt tot uitgaven voor maaltijden of overnachting in het
      buitenland, worden voor de toepassing van dit besluit aangemerkt als dienstreizen binnen Nederland.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel2
  - number: '2.3'
    text: |-
      Indien een dienstreis niet op de voor het bevoegd gezag minst kostbare wijze is uitgevoerd, heeft de ambtenaar
      slechts aanspraak op de vergoeding die hij zou ontvangen indien hij de dienstreis, met inachtneming van het
      dienstbelang, op de minst kostbare wijze zou hebben uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel2
  - number: '2.4'
    text: |-
      Indien uit anderen hoofde reeds aanspraak bestaat op een vergoeding voor de in dit besluit genoemde kosten, wordt
      deze vergoeding in mindering gebracht op de vergoeding waarop ingevolge dit besluit aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel2
  - number: '3.1'
    text: |-
      Voor de vergoeding van reis- en verblijfkosten geldt de plaats van tewerkstelling als begin- en eindpunt van de
      dienstreis.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid kan de woning van de ambtenaar of een andere plaats als beginpunt onderscheidenlijk
      eindpunt van de dienstreis worden aangemerkt, tenzij op de heenreis onderscheidenlijk de terugreis de plaats van
      tewerkstelling wordt bezocht.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel3
  - number: '4.1'
    text: Een dienstreis wordt in de regel met openbaar vervoer gemaakt.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel4
  - number: '4.2'
    text: |-
      De kosten van openbaar vervoer die verband houden met de dienstreis, worden vergoed naar door Onze Minister vast te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel4
  - number: '4.3'
    text: |-
      Indien het naar het oordeel van het bevoegd gezag in het belang van de dienst is dat tijdens een dienstreis voor of
      na gebruik van het openbaar vervoer gebruik wordt gemaakt van een treintaxi, worden deze kosten eveneens vergoed.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel4
  - number: '5.1'
    text: |-
      Indien de ambtenaar voor een dienstreis zonder toestemming van het bevoegd gezag gebruik maakt van een eigen
      motorvoertuig, wordt hem geen vergoeding verleend.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel5
  - number: '5.2'
    text: |-
      Indien de dienstreis naar het oordeel van het bevoegd gezag niet of niet op doelmatige wijze per openbaar vervoer
      kan worden ondernomen, kan het bevoegd gezag de ambtenaar toestemming verlenen om gebruik te maken van een eigen
      motorvoertuig. De ambtenaar wordt in dat geval een vergoeding verleend volgens door Onze Minister vast te stellen
      regels.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel5
  - number: '5.3'
    text: |-
      Indien de dienstreis wel op doelmatige wijze per openbaar vervoer kan worden ondernomen, kan het bevoegd gezag in
      bijzondere omstandigheden de ambtenaar toestemming verlenen om gebruik te maken van een eigen motorvoertuig. De
      ambtenaar wordt in dat geval een vergoeding verleend volgens door Onze Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel5
  - number: '5.4'
    text: |-
      Onder reiskosten worden bij het gebruik van een eigen vervoermiddel mede verstaan de kosten voor het gebruik maken
      van een parkeerplaats, garage of stalling, overvaart- en tolgelden.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel5
  - number: '6'
    text: |-
      Indien voor de dienstreis van een eigen fiets of bromfiets gebruik wordt gemaakt, wordt hiervoor een vergoeding
      verleend volgens door Onze Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel6
  - number: '7'
    text: |-
      Het bevoegd gezag kan bepalen dat ter uitvoering van een dienstreis gebruik wordt gemaakt van een dienstvoertuig.
      In dat geval vindt geen vergoeding plaats van de reiskosten.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel7
  - number: '8'
    text: |-
      Indien het dienstbelang dit vereist, of andere bijzondere omstandigheden aanwezig zijn, kan het gebruik van een
      gehuurd vervoermiddel worden toegestaan. De ambtenaar wordt in dat geval een vergoeding verleend volgens door Onze
      Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel8
  - number: '9.1'
    text: |-
      De in verband met een dienstreis noodzakelijk gemaakte kosten voor maaltijden, logies en voor kleine uitgaven
      worden als verblijfkosten vergoed volgens door Onze Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel9
  - number: '9.2'
    text: Geen aanspraak op vergoeding wegens verblijfkosten bestaat voor een dienstreis korter dan vier uren.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel9
  - number: '9.3'
    text: Onze Minister kan bepalen dat in andere gevallen dan bedoeld in het tweede lid, evenmin een aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel9
  - number: '10.1'
    text: |-
      Indien de ambtenaar aantoont dat door zeer bijzondere omstandigheden een berekende vergoeding van de per
      kalendermaand gemaakte dienstreizen niet toereikend is om de noodzakelijk te maken verblijfkosten te bestrijden,
      kan het bevoegd gezag toestaan dat de extra kosten hetzij geheel, hetzij gedeeltelijk in rekening worden gebracht
      en worden vergoed.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel10
  - number: '10.2'
    text: |-
      Indien een ambtenaar veelvuldig dienstreizen moet maken waarbij de aard van de werkzaamheden of de
      reisomstandigheden zodanig zijn, dat de vergoeding wegens verblijfkosten overeenkomstig de krachtens
      [artikel 9, eerste lid][ref1], vastgestelde regels aanmerkelijk hoger zou zijn dan de in redelijkheid te maken
      werkelijke meerkosten, wordt hem een vergoeding verleend volgens door Onze Minister vast te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006519#Artikel9
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006519
        artikel: '9'
        hoofdstuk: '3'
  - number: '10.3'
    text: |-
      Onverminderd het tweede lid, kan Onze Minister, op voorstel van het bevoegd gezag, ten aanzien van groepen van
      ambtenaren een vergoedingstarief vaststellen dat overeenkomt met de in redelijkheid te maken verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel10
  - number: '10.4'
    text: |-
      Een vergoeding ingevolge het tweede lid, geldt alleen voor zover en zolang de aard van de werkzaamheden of de
      reisomstandigheden geen wijziging hebben ondergaan.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel10
  - number: '11'
    text: |-
      Indien een ambtenaar ingevolge [artikel 62][ref1] of [64 van het Besluit algemene rechtspositie politie][ref2] op
      een andere plaats van tewerkstelling werkzaam is, heeft hij voor het afleggen van het traject tussen de woning en
      de andere plaats van tewerkstelling aanspraak op een vergoeding van reiskosten volgens de bepalingen die bij of
      krachtens dit besluit worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel64
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '64'
  - number: '12.1'
    text: |-
      Indien dagelijks heen en weer reizen tussen de woning en de plaats van tijdelijke tewerkstelling
      naar het oordeel van het bevoegd gezag niet mogelijk is, heeft de ambtenaar die ingevolge
      [artikel 62 van het Besluit algemene rechtspositie politie][ref1] gedetacheerd wordt aanspraak op vergoeding van
      kosten voor logies volgens de bepalingen die bij of krachtens dit besluit worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel62
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '62'
  - number: '12.2'
    text: |-
      Indien de ambtenaar in een pension verblijft, worden de kosten voor maaltijden, kleine uitgaven en gezinsbezoek
      vergoed volgens door Onze Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel12
  - number: '13.1'
    text: |-
      Een reis naar, in of uit het buitenland wordt slechts als dienstreis aangemerkt, wanneer daartoe tevoren door
      het bevoegd gezag een opdracht is gegeven. In bijzondere gevallen kan een dergelijke opdracht ook achteraf worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel13
  - number: '13.2'
    text: |-
      Een dienstreis als bedoeld in het eerste lid kan per vliegtuig of per boot worden gemaakt, indien daarvoor tevoren
      door het bevoegd gezag toestemming is gegeven. In bijzondere gevallen kan een dergelijke toestemming ook achteraf
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel13
  - number: '13.3'
    text: |-
      De reiskosten die verband houden met een dienstreis als bedoeld in het eerste lid, waarbij ingevolge het tweede
      lid toestemming is gegeven om per vliegtuig of per boot te reizen, worden vergoed naar door Onze Minister vast te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel13
  - number: '13.4'
    text: |-
      Wanneer klimatologische of andere bijzondere omstandigheden in het te bezoeken land daartoe aanleiding geven, kan,
      volgens door Onze Minister vast te stellen regels, een tegemoetkoming worden verleend in de noodzakelijke kosten
      voor aanschaffing van bijzondere kleding en uitrusting.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel13
  - number: '14'
    text: |-
      Indien de reiskosten, bedoeld in artikel 5, vierde lid, in het buitenland worden gemaakt, worden deze kosten
      evenals de kosten van plaatselijk vervoer aangemerkt als verblijfkosten en derhalve niet afzonderlijk vergoed,
      tenzij deze kosten noodzakelijkerwijze voortvloeien uit het gebruik van een eigen motorvoertuig met toestemming van
      het bevoegd gezag, of een dienstvoertuig.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel14
  - number: '15'
    text: 'Het bevoegd gezag kan regels vaststellen ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel15
  - number: 15.a
    text: |-
      het verlenen van vaste reissommen ter vervanging van de in dit besluit bedoelde vergoedingen voor de gemaakte
      reiskosten en voor de verblijfkosten, zowel afzonderlijk als te zamen, waarbij de vaste reissom niet meer bedraagt
      dan de vergoeding die hij vervangt;
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel15
  - number: 15.b
    text: het verlenen van voorschotten ten behoeve van de te maken dienstreizen.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel15
  - number: '16.1'
    text: |-
      De ingediende reisdeclaraties worden binnen redelijke termijn voldaan tot het bedrag waarop volgens de door de
      ambtenaar vermelde gegevens op grond van dit besluit aanspraak kan worden gemaakt of wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel16
  - number: '16.2'
    text: |-
      Indien blijkt dat bij de ingediende reisdeclaratie is afgeweken van de regels die bij of krachtens dit besluit
      zijn gesteld, wordt de reisdeclaratie ambtshalve gewijzigd en wordt het bedrag waarop aanspraak kan worden gemaakt,
      bepaald naar die op de reisdeclaratie ambtshalve gewijzigde gegevens.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister kan, voor zover nodig ten aanzien van een door hem aan te wijzen groep van ambtenaren, in afwijking
      van de bij of krachtens dit besluit gestelde regels besluiten indien de afwijking strekt tot het vermijden van
      onbillijkheden van overwegende aard welke uit de toepassing van deze regels zouden voortkomen.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel17
  - number: '17.2'
    text: |-
      Het bevoegd gezag kan, voor zover nodig in individuele gevallen, in afwijking van de bij of krachtens dit besluit
      gestelde regels besluiten, indien de afwijking strekt tot het vermijden van onbillijkheden van overwegende aard
      welke uit de toepassing van de toepassing van deze regels zouden voortkomen.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel17
  - number: '18'
    text: Dit besluit treedt in werking met ingang van 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel18
  - number: '19'
    text: 'Dit besluit wordt aangehaald als: Besluit vergoeding dienstreizen politie.'
    url: https://wetten.overheid.nl/BWBR0006519/2006-08-01#Artikel19
