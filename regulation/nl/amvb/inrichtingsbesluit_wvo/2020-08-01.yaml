    text: |-
      Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, of Friese taal en cultuur:
      400.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.5
    text: |-
      Het profieldeel van het profiel cultuur en maatschappij in het havo omvat de volgende vakken, met de daarbij
      vermelde normatieve studielast, uitgedrukt in uren:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.5.a
    text: 'geschiedenis: 320,'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.5.b
    text: |-
      Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, of Friese taal en cultuur
      ter keuze van de leerling voor zover het bevoegd gezag deze vakken aanbiedt: 400,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.5.c
    text: |-
      een van de volgende culturele profielkeuzevakken ter keuze van de leerling, voor zover het bevoegd gezag deze
      vakken aanbiedt:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.5.c.1°
    text: |-
      kunst (beeldende vormgeving), kunst (muziek), kunst (drama), kunst (dans), muziek, tekenen, handvaardigheid of
      textiele vormgeving: 320;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.5.c.2°
    text: 'filosofie: 320;'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.5.c.3°
    text: |-
      Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, of Friese taal en cultuur:
      400,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.5.d
    text: |-
      een van de volgende maatschappelijke profielkeuzevakken ter keuze van de leerling, voor zover het bevoegd gezag
      deze vakken aanbiedt:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.5.d.1°
    text: 'aardrijkskunde: 320;'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.5.d.2°
    text: 'maatschappijwetenschappen: 320;'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.5.d.3°
    text: 'economie: 400.'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6
    text: 'Het vrije deel van elk profiel in het havo kan omvatten:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.a
    text: 'de vakken, genoemd in het eerste tot en met het vijfde lid, voor zover nog niet gekozen, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.a.1°
    text: |-
      van de vakken wiskunde A en wiskunde B er slechts één deel kan uitmaken van het profiel, dat wiskunde D uitsluitend
      kan worden gekozen indien ook wiskunde B deel uitmaakt van het profiel, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.a.2°
    text: |-
      kunst (beeldende vormgeving) niet gekozen kan worden in combinatie met tekenen, handvaardigheid of textiele
      vormgeving, dat kunst (muziek) niet gekozen kan worden in combinatie met muziek, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.a.3°
    text: van de vakken tekenen, handvaardigheid en textiele vormgeving er slechts één deel kan uitmaken van het profiel,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.b
    text: |-
      de volgende vakken, met de daarbij vermelde normatieve studielast, uitgedrukt in uren, met dien verstande dat
      deze vakken slechts deel kunnen uitmaken van het vrije deel voor zover de desbetreffende taal niet reeds eerder is
      gevolgd of al deel uitmaakt van het profiel:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.b.1°
    text: 'Spaanse taal en literatuur (elementair): 320,'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.b.2°
    text: 'Russische taal en literatuur (elementair): 320,'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.b.3°
    text: 'Italiaanse taal en literatuur (elementair): 320,'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.b.4°
    text: 'Arabische taal en literatuur (elementair): 320, en'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.b.5°
    text: 'Turkse taal en literatuur (elementair): 320,'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.c
    text: 'de volgende vakken, met de daarbij vermelde normatieve studielast in uren:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.c.1°
    text: 'kunst (algemeen): 120,'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.c.2°
    text: 'algemene natuurwetenschappen: 120, en'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.c.3°
    text: 'bewegen, sport en maatschappij: 320, en'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.6.d
    text: door het bevoegd gezag vast te stellen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26c.7
    text: |-
      Het zesde lid, aanhef en onderdeel a, onder 1°, vindt toepassing onverminderd de mogelijkheid voor de leerling
      om een in dat onderdeel bedoeld wiskundevak dat het bevoegd gezag aanbiedt, te kiezen als extra vak, met dien
      verstande dat alleen is toegestaan de combinatie van wiskunde A en wiskunde B.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26c
  - number: 26d
    text: |-
      Indien het bevoegd gezag bij de vaststelling van vakken en andere programma-onderdelen van het vrije deel andere
      instellingen of deskundige personen van buiten de school betrekt, kan het onderwijs in die vakken en andere
      programma-onderdelen van het vrije deel, onverminderd de verantwoordelijkheid van het bevoegd gezag voor het
      onderwijs aan de school, mede worden verzorgd door die andere instellingen of deskundige personen. Daarbij stelt
      het bevoegd gezag als voorwaarde dat die instellingen of deskundige personen voldoen aan de met betrekking tot hun
      geldende wettelijke voorschriften en voorzover die voorschriften ontbreken, aan de binnen de beroepsgroep algemeen
      erkende normen. [Artikel 33, eerste lid, van de wet][ref1] is ten aanzien van degenen die dit onderwijs verzorgen
      van overeenkomstige toepassing, met dien verstande dat als getuigschrift als bedoeld in onderdeel b. 1° van dat lid
      geldt een kwalificatie die, gelet op de eerste en tweede volzin, passend is. Het bevoegd gezag stelt de inspectie
      in kennis van de kwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
  - number: 26e.1
    text: |-
      Het bevoegd gezag van een school voor vwo of havo kan een leerling ontheffing verlenen van het volgen van het
      onderwijs in het vak lichamelijke opvoeding indien de leerling vanwege diens lichamelijke gesteldheid niet in staat
      is dit onderwijs te volgen. Het bevoegd gezag geeft de inspectie kennis van de verleende ontheffing en vermeldt
      daarbij de gronden waarop deze ontheffing berust.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26e
  - number: 26e.2
    text: |-
      De leerling van een school voor vwo die in het bezit is van het diploma havo is vrijgesteld van het volgen van
      onderwijs in het vak maatschappijleer. Indien het betreft het atheneum is deze leerling tevens vrijgesteld van het
      volgen van onderwijs in het vak culturele en kunstzinnige vorming.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26e
  - number: 26e.3
    text: |-
      De leerling van een school voor vwo die in het bezit is van het diploma havo of het diploma vmbo en die in
      plaats van de vakken, genoemd in [artikel 26c][ref1], respectievelijk [artikel 10][ref2], [artikel 10b][ref3]
      of [artikel 10d van de wet][ref4], of als extra vak examen heeft afgelegd in één of meer vakken van
      [artikel 26b][ref5], is vrijgesteld van het volgen van onderwijs in dit vak respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref5]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26e
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26c
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref5
        bwb_id: BWBR0005946
        artikel: 26b
        hoofdstuk: III
        paragraaf: '3'
  - number: 26e.4
    text: |-
      Het bevoegd gezag van een atheneum kan een leerling ontheffing verlenen van het volgen van onderwijs in de taal
      genoemd in [artikel 26b, eerste lid, onder c][ref1], in de volgende gevallen:


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26e
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
        hoofdstuk: III
        paragraaf: '3'
  - number: 26e.4.a
    text: |-
      de leerling heeft een stoornis die specifiek betrekking heeft op taal of een zintuiglijke stoornis die effect heeft
      op taal;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26e
  - number: 26e.4.b
    text: de leerling heeft een andere moedertaal dan de Nederlandse taal of de Friese taal;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26e
  - number: 26e.4.c
    text: |-
      de leerling volgt onderwijs in het profiel natuur en techniek of het profiel natuur en gezondheid en het onderwijs
      in de taal verhindert naar verwachting een succesvolle afronding van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26e
  - number: 26e.5
    text: |-
      Bij toepassing van het vierde lid, wordt de taal vervangen door een van de vakken of programma-onderdelen, genoemd
      in [artikel 26b, derde tot en met zesde lid, of in het zevende lid, onder c of d][ref1], met een normatieve
      studielast van tenminste 440 uren, ter keuze van de leerling, voor zover het bevoegd gezag deze als zodanig
      aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26e
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
        hoofdstuk: III
        paragraaf: '3'
  - number: 26e.6
    text: |-
      De leerling van een school voor havo die in het bezit is van het diploma vmbo en die in plaats van de vakken,
      genoemd in [artikel 10][ref1], [artikel 10b][ref2] of [artikel 10d van de wet][ref3], of als extra vak examen
      heeft afgelegd in één of meer vakken van [artikel 26c][ref4] of [26b][ref5], is vrijgesteld van het volgen van
      onderwijs in dit vak respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
      [ref5]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref4
        bwb_id: BWBR0005946
        artikel: 26c
        hoofdstuk: III
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0005946
        artikel: 26b
        hoofdstuk: III
        paragraaf: '3'
  - number: 26g.1
    text: |-
      In het derde leerjaar van een school voor mavo volgt de leerling in de theoretische leerweg onderwijs in ten minste
      zeven vakken waarin eindexamen kan worden afgelegd, niet behorend tot het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26g
  - number: 26g.2
    text: |-
      Indien de leerling onderwijs in een derde moderne vreemde taal volgt of heeft gevolgd in enig voorafgaand leerjaar,
      is in afwijking van het eerste lid het aantal vakken, bedoeld in dat lid, zes.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26g
  - number: 26h.1
    text: |-
      De profielvakken, bedoeld in [artikel 10b, zesde lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
  - number: 26h.1.a
    text: bouwen, wonen en interieur;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
  - number: 26h.1.b
    text: produceren, installeren en energie;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
  - number: 26h.1.c
    text: mobiliteit en transport;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
  - number: 26h.1.d
    text: media, vormgeving en ICT;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
  - number: 26h.1.e
    text: maritiem en techniek;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
  - number: 26h.1.f
    text: zorg en welzijn;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
  - number: 26h.1.g
    text: economie en ondernemen;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
  - number: 26h.1.h
    text: horeca, bakkerij en recreatie;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
  - number: 26h.1.i
    text: groen; en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
  - number: 26h.1.j
    text: dienstverlening en producten.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
  - number: 26h.2
    text: |-
      Het extra vak bedoeld in [artikel 10b, negende lid, onderdeel d, van de wet][ref1], is Friese taal en cultuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
  - number: 26i.1
    text: |-
      De profielvakken, bedoeld in [artikel 10d, zesde lid, van de wet][ref1], zijn de vakken, genoemd in
      [artikel 26h, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26h
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref2
        bwb_id: BWBR0005946
        artikel: 26h
        hoofdstuk: III
        paragraaf: '3'
  - number: 26i.2
    text: |-
      In het derde leerjaar volgt de leerling in de gemengde leerweg ten minste onderwijs in een beroepsgericht programma
      en vijf algemene vakken waarin eindexamen kan worden afgelegd, niet behorend tot het gemeenschappelijk deel. Indien
      de leerling onderwijs in een derde moderne vreemde taal volgt of heeft gevolgd in enig voorafgaand leerjaar, is het
      aantal algemene vakken, bedoeld in de eerste volzin, vier.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26i
  - number: 26j.1
    text: |-
      Bij ministeriële regeling worden beroepsgerichte keuzevakken vastgesteld die deel kunnen uitmaken van het
      beroepsgerichte programma van leerlingen in de basisberoepsgerichte, kaderberoepsgerichte en gemengde leerweg van
      het vmbo.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26j
  - number: 26j.2
    text: |-
      Het bevoegd gezag zorgt ervoor dat de school voldoende beroepsgerichte keuzevakken verzorgt waar leerlingen uit
      kunnen kiezen in het kader van hun beroepsgerichte programma.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26j
  - number: 26j.3
    text: |-
      Bij zijn keuze welke beroepsgerichte keuzevakken door de school worden verzorgd, consulteert het bevoegd gezag een
      of meer instellingen voor middelbaar beroepsonderwijs en een of meer regionale arbeidsmarktpartijen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26j
  - number: 26k.1
    text: |-
      In samenwerking met een of meer instellingen voor middelbaar beroepsonderwijs en een of meer regionale
      arbeidsmarktpartijen kan het bevoegd gezag van een school voor vbo een nieuw beroepsgericht keuzevak ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26k
  - number: 26k.2
    text: |-
      Het bevoegd gezag stelt de medezeggenschapsraad van de school vooraf op de hoogte van het voornemen tot
      ontwikkeling van een nieuw beroepsgericht keuzevak.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26k
  - number: 26k.3
    text: |-
      Het bevoegd gezag meldt het voornemen tot ontwikkeling van een nieuw beroepsgericht keuzevak zo spoedig mogelijk
      aan Onze Minister door middel van een bij ministeriële regeling vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26k
  - number: 26k.4
    text: Onze Minister brengt binnen zes weken na de melding schriftelijk advies uit over het voornemen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26k
  - number: 26k.5
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften gegeven worden over de procedure voor het melden van het
      voornemen tot ontwikkeling van beroepsgerichte keuzevakken.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26k
  - number: 26l.1
    text: |-
      Een aanvraag tot goedkeuring van een nieuw ontwikkeld beroepsgericht keuzevak wordt ingediend bij Onze Minister
      door middel van een bij ministeriële regeling vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26l
  - number: 26l.2
    text: |-
      Bij ministeriële regeling worden voorwaarden vastgesteld waaraan nieuwe beroepsgerichte keuzevakken moeten voldoen.
      Daartoe behoren in elk geval voorwaarden met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26l
  - number: 26l.2.a
    text: de aard en omvang van het beroepsgerichte keuzevak;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26l
  - number: 26l.2.b
    text: |-
      de opbouw van de leerstof, gedifferentieerd naar de verschillende leerwegen waarin het beroepsgerichte keuzevak kan
      worden aangeboden; en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26l
  - number: 26l.2.c
    text: |-
      de mate waarin het nieuwe beroepsgerichte keuzevak zich onderscheidt van reeds bestaande beroepsgerichte
      keuzevakken.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26l
  - number: 26l.3
    text: |-
      Onze Minister besluit binnen dertien weken op de aanvraag, bedoeld in het eerste lid en laat zich daarbij adviseren
      door een onafhankelijke adviescommissie.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26l
  - number: 26l.4
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften gegeven worden over de procedure voor het verlenen van
      goedkeuring aan nieuw ontwikkelde beroepsgerichte keuzevakken.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26l
  - number: 26l.5
    text: |-
      Als Onze Minister de aanvraag inwilligt, neemt hij het nieuwe beroepsgerichte keuzevak uiterlijk met ingang van
      1 augustus daaropvolgend op in de regeling, bedoeld in [artikel 26j, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26j
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26l
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26j
        hoofdstuk: III
        paragraaf: '3'
  - number: 26n.1
    text: |-
      Het bevoegd gezag van een school voor mavo of vbo kan een leerling, na overleg met de leerling en, indien de
      leerling minderjarig is, met diens ouders, voogden of verzorgers, ontheffing verlenen van het volgen van het
      onderwijs in lichamelijke opvoeding, indien de leerling vanwege diens lichamelijke gesteldheid niet in staat is dit
      onderwijs te volgen. Het bevoegd gezag geeft de inspectie kennis van de verleende ontheffing en vermeldt daarbij de
      gronden waarop deze ontheffing berust.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26n
  - number: 26n.2
    text: |-
      Het bevoegd gezag kan toestaan dat een ontheffing, verleend voor de eerste twee leerjaren van het volgen van een
      tweede moderne vreemde taal, tevens geldt als ontheffing voor die taal voor de periode waarin de leerling onderwijs
      in de kaderberoepsgerichte, theoretische of gemengde leerweg volgt, met dien verstande dat Arabische taal, Turkse
      taal, Spaanse taal, maatschappijkunde, geschiedenis en staatsinrichting, of aardrijkskunde in de plaats komt van
      het onderwijs in de taal waarvoor de vrijstelling is verleend. Deze toestemming kan slechts worden verleend ten
      behoeve van leerlingen die:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26n
  - number: 26n.2.a
    text: |-
      op grond van [artikel 22, tweede lid][ref1], beschikken over een ontheffing en deze ontheffing wordt voortgezet,


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel22
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26n
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3'
  - number: 26n.2.b
    text: |-
      in de periode van de eerste twee leerjaren onderwijs in de Arabische taal, de Turkse taal, of Spaanse taal volgden,
      of
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26n
  - number: 26n.2.c
    text: |-
      onderwijs gaan volgen in de basisberoepsgerichte leerweg en die in het schooljaar voorafgaand aan het betrokken
      schooljaar leerwegondersteunend onderwijs volgden.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26n
  - number: 26n.3
    text: |-
      Dit artikel geldt tevens voor leerlingen die in een hoger leerjaar voor de eerste maal in Nederland tot een school
      zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26n
  - number: 26n.4
    text: |-
      De leerling van een school voor vmbo, voor zover het betreft de theoretische leerweg, die in het bezit is van
      het diploma vmbo in de kaderberoepsgerichte leerweg of de basisberoepsgerichte leerweg en die in plaats van de
      vakken, als bedoeld in [artikel 10b van de wet][ref1], of als extra vak examen heeft afgelegd in één of meer vakken
      van [artikel 10 van de wet][ref2] of [artikel 26c][ref3] dan wel [26b][ref4], is vrijgesteld van het volgen van
      onderwijs in dit vak respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
      [ref4]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005946
        artikel: 26c
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005946
        artikel: 26b
        hoofdstuk: III
        paragraaf: '3'
  - number: 26n.5
    text: |-
      De leerling van een school voor vmbo, voor zover het betreft de basisberoepsgerichte leerweg, die in het bezit is
      van een diploma vmbo in een andere leerweg, en die in plaats van de vakken, bedoeld in [artikel 10b][ref1], of als
      extra vak, examen heeft afgelegd in één of meer vakken van [artikel 10 van de wet][ref2], [artikel 26b][ref3] of
      [artikel 26c][ref4], is vrijgesteld van het volgen van onderwijs in dit vak respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
      [ref4]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005946
        artikel: 26b
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005946
        artikel: 26c
        hoofdstuk: III
        paragraaf: '3'
  - number: 26n.6
    text: |-
      De leerling van een school voor vmbo, voor zover het betreft de kaderberoepsgerichte leerweg, die in het bezit is
      van een diploma vmbo in de basisberoepsgerichte leerweg, de theoretische leerweg of de gemengde leerweg, en die in
      plaats van de vakken, bedoeld in [artikel 10b van de wet][ref1], of als extra vak, examen heeft afgelegd in één of
      meer vakken van artikel 10b van de wet, [artikel 26b][ref2] dan wel [artikel 26c][ref3], is vrijgesteld van het
      volgen van onderwijs in dit vak respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref2
        bwb_id: BWBR0005946
        artikel: 26b
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005946
        artikel: 26c
        hoofdstuk: III
        paragraaf: '3'
  - number: 26n.7
    text: |-
      De leerling van een school voor vmbo, voor zover het betreft de gemengde leerweg, die in het bezit is van een
      diploma vmbo en die in plaats van de vakken, bedoeld in [artikel 10d][ref1], of als extra vak, examen heeft
      afgelegd in één of meer vakken van [artikel 10][ref2] of [artikel 10b van de wet][ref3], of [artikel 26b][ref4]
      dan wel [artikel 26c][ref5], is vrijgesteld van het volgen van onderwijs in dit vak, respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref4]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
      [ref5]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref4
        bwb_id: BWBR0005946
        artikel: 26b
        hoofdstuk: III
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0005946
        artikel: 26c
        hoofdstuk: III
        paragraaf: '3'
  - number: '27.1'
    text: |-
      Onderwijs in de gemengde leerweg als bedoeld in [artikel 72, derde lid, onderdeel e, van de wet][ref1] kan
      worden gegeven aan een school voor vbo of aan een agrarisch opleidingscentrum voor zover het betreft het
      voorbereidend beroepsonderwijs, indien het bevoegd gezag met het bevoegd gezag van een school voor mavo een
      samenwerkingsovereenkomst heeft gesloten met betrekking tot de uitwisseling van expertise, de leerlingbegeleiding
      en de examinering.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
  - number: '27.2'
    text: |-
      Het vorige lid is van overeenkomstige toepassing op onderwijs in de gemengde leerweg als bedoeld in
      [artikel 72, derde lid, onderdeel e, van de wet][ref1] dat wordt gegeven aan een school voor mavo.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
  - number: '28'
    text: |-
      Het profiel groen, bedoeld in [artikel 10b, derde lid, onderdeel i, van de wet][ref1] kan op grond van
      [artikel 72, derde lid, onderdeel f, van de wet][ref2] worden toegevoegd aan een school voor vbo indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '72'
  - number: 28.a
    text: het bevoegd gezag van een agrarisch opleidingscentrum deelneemt aan de desbetreffende regionale samenwerking, of
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel28
  - number: 28.b
    text: |-
      het bevoegd gezag van het agrarisch opleidingscentrum waarvan een vestiging het dichtst gelegen is bij de vestiging
      waar het onderwijs in het profiel groen zal worden verzorgd, heeft verklaard daarmee in te stemmen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel28
  - number: 28a
    text: |-
      Het profiel dienstverlening en producten, bedoeld in [artikel 10b, derde lid, onderdeel j, van de wet][ref1]
      kan op grond van [artikel 72, derde lid, onderdeel g, van de wet][ref2] worden toegevoegd aan een agrarisch
      opleidingscentrum indien het onderwijs binnen dat profiel voorbereidend beroepsonderwijs op het gebied van
      landbouw, natuurlijke omgeving en voedsel betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '72'
  - number: 30a.1
    text: 'De stage-overeenkomst voor de maatschappelijke stage bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel30a
  - number: 30a.1.a
    text: de leerdoelen;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel30a
  - number: 30a.1.b
    text: de activiteiten die de leerling moet ontplooien om de leerdoelen te bereiken;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel30a
  - number: 30a.1.c
    text: de aanvangsdatum, de einddatum en de tijden van de onder b bedoelde activiteiten;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel30a
  - number: 30a.1.d
    text: een regeling voor de begeleiding van de leerling bij de stagebieder.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel30a
  - number: 30a.2
    text: |-
      De stage-overeenkomst bepaalt voorts wie de verzekering tegen het financiële risico van ongevallen en tegen
      wettelijke aansprakelijkheid van de leerling voor de tijd dat deze zich bevindt bij de stagebieder zal sluiten en
      ten laste van wie de te betalen premie zal komen, indien een zodanige verzekering wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel30a
  - number: 30a.3
    text: |-
      Indien er geen externe stagebieder is aan te wijzen, dan wordt de stage-overeenkomst gesloten tussen het bevoegd
      gezag en de leerling.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel30a
  - number: 30a.4
    text: |-
      In geval van minderjarigheid van de leerling wordt de stage-overeenkomst mede door diens ouders, voogden of
      verzorgers ondertekend.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel30a
  - number: '31.1'
    text: |-
      Deze paragraaf is van toepassing op scholen voor mavo voor zover daaraan onderwijs in de gemengde leerweg wordt
      verzorgd, en op scholen voor vbo.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel31
  - number: '31.2'
    text: |-
      Deze paragraaf is van overeenkomstige toepassing op arbeidstraining. Onder arbeidstraining wordt verstaan het
      onderricht in de praktijk van de uitoefening van een vak of beroep aan scholen voor praktijkonderwijs, bedoeld
      in [artikel 10f, vijfde lid, van de wet][ref1], voor zover dat onderricht plaatsvindt buiten de school voor
      praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
  - number: '32.1'
    text: |-
      In het derde en vierde leerjaar kunnen de lessen in profielvakken of beroepsgerichte keuzevakken worden besteed
      aan stage.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel32
  - number: '32.2'
    text: |-
      Voor een school voor praktijkonderwijs bedraagt het in [artikel 10f, vijfde lid, van de wet][ref1] bedoelde
      aantal uren stage of arbeidstraining gedurende de cursusduur gemiddeld ten hoogste 50% van het aantal uren waarin
      onderwijs wordt verzorgd, met dien verstande dat voor leerlingen tot en met het schooljaar waarop zij de leeftijd
      van 17 jaar hebben bereikt de stage of arbeidstraining per schoolweek ten hoogste 80% bedraagt van het aantal uren
      waarin in die week onderwijs wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
  - number: '33'
    text: Het doel, de inhoud, de omvang, de opbouw en de organisatie van de stage worden beschreven in een stageplan.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel33
  - number: '34'
    text: Een stage wordt doorlopen op een of meer stageplaatsen, ter beschikking gesteld door een of meer stagegevers.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel34
  - number: '35.1'
    text: |-
      Het bevoegd gezag sluit met de leerling en de stagegever te zamen een schriftelijke stage-overeenkomst waaruit
      blijkt dat de leerling leeractiviteiten ontplooit in het kader van het stageplan.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel35
  - number: '35.2'
    text: 'De stage-overeenkomst bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel35
  - number: 35.2.a
    text: |-
      de leeractiviteiten die de leerling bij de aangewezen stagegever op een of meer bepaalde stageplaatsen moet
      ontplooien;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel35
  - number: 35.2.b
    text: |-
      de aanvangsdatum, de einddatum en de tijden van [de onder ][ref1] bedoelde leeractiviteiten;


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel35
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '35'
        hoofdstuk: III
        paragraaf: '6'
  - number: 35.2.c
    text: |-
      een regeling voor de begeleiding van de leerling bij de stagegever waarin in elk geval duidelijk wordt gemaakt welk
      aandeel in de begeleiding door de stageleraar respectievelijk door de stagebegeleider, aan te wijzen door of namens
      het bevoegd gezag onderscheidenlijk de stagegever, wordt verzorgd;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel35
  - number: 35.2.d
    text: de wijze waarop de stagegever bij de beoordeling van de leeractiviteiten van de leerling wordt betrokken;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel35
  - number: 35.2.e
    text: |-
      een regeling die de inspectie in staat stelt toezicht te houden op de leeractiviteiten die door de leerling bij de
      stagegever worden ontplooid.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel35
  - number: '35.3'
    text: |-
      De stage-overeenkomst bepaalt voorts wie de verzekering tegen het financiële risico van ongevallen en tegen
      wettelijke aansprakelijkheid van de leerling voor de tijd dat deze zich bevindt bij de stagegever zal sluiten en
      ten laste van wie de te betalen premie zal komen, indien een zodanige verzekeringsovereenkomst zal worden gesloten.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel35
  - number: '35.4'
    text: |-
      In geval van minderjarigheid van de leerling wordt de stage-overeenkomst door diens ouders, voogden of verzorgers
      ondertekend.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel35
  - number: '36'
    text: |-
      Met het oog op de stage kan het bevoegd gezag ten behoeve van de leerlingen een schriftelijke
      samenwerkingsovereenkomst met een of meer stagegevers aangaan waarin mede een of meer onderdelen van de stage-
      overeenkomst, bedoeld in [artikel 35, tweede lid][ref1], worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel35
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '35'
        hoofdstuk: III
        paragraaf: '6'
  - number: '37.1'
    text: 'De inspectie hanteert voor zover van toepassing de volgende indicatoren voor de beoordeling van de leerresultaten:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37
  - number: 37.1.a
    text: het percentage leerlingen met een onvertraagde studievoortgang in de eerste twee leerjaren;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37
  - number: 37.1.b
    text: het percentage leerlingen met een onvertraagde studievoortgang in de overige leerjaren;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37
  - number: 37.1.c
    text: |-
      het niveau dat de leerling in het derde leerjaar daadwerkelijk heeft bereikt ten opzichte van het niveau dat de
      leerling gelet op het schooladvies, bedoeld in [artikel 42, tweede lid, van de Wet op het primair onderwijs][ref1],
      naar verwachting in het derde leerjaar zou bereiken; en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
  - number: 37.1.d
    text: het gemiddelde cijfer van het centraal examen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37
  - number: '37.2'
    text: |-
      De indicatoren worden onderscheiden naar de in [artikel 23a1, eerste lid, van de wet][ref1] genoemde schoolsoorten
      en leerwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a1
  - number: '37.3'
    text: |-
      Bij de bepaling van de leerresultaten, bedoeld in het eerste lid , onder a tot en met d, kan rekening worden
      gehouden met groepskenmerken en individuele kenmerken van leerlingen, met dien verstande dat in elk geval rekening
      wordt gehouden met de sociaal-economische situatie van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37
  - number: '37.4'
    text: |-
      De scores waarop het oordeel over de in het eerste lid, onder a tot en met d, bedoelde indicatoren wordt gebaseerd,
      kunnen wegens bijzondere omstandigheden worden gecorrigeerd.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37
  - number: 37a
    text: |-
      Bij ministeriële regeling worden nadere regels gegeven met betrekking tot de berekening van de indicatoren, genoemd
      in [artikel 37, eerste lid][ref1], waaronder begrepen de toe te passen correcties, bedoeld in het derde en vierde
      lid van dat artikel. Voorts worden bij die regeling regels gegeven met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel37
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '37'
        hoofdstuk: IV
  - number: 37a.a
    text: de aard en de aantallen gegevens die ten minste nodig zijn voor de toepassing van de indicatoren;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37a
  - number: 37a.b
    text: |-
      de normering waarop de inspectie het oordeel voldoende dan wel onvoldoende onderwijsresultaat baseert, na
      toepassing van de indicatoren;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37a
  - number: 37a.c
    text: |-
      de wijze waarop per schoolsoort of leerweg de beoordelingen, gebaseerd op de afzonderlijke indicatoren, leiden tot
      een oordeel over de leerresultaten van die schoolsoort onderscheidenlijk leerweg.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37a
  - number: 37b.1
    text: 'De indicatoren worden vastgesteld dan wel gewijzigd met inachtneming van de volgende procedure:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37b
  - number: 37b.1.a
    text: |-
      gelet op recente ontwikkelingen, een eigen analyse en signalen van organisaties uit het onderwijsveld, beslist de
      inspecteur-generaal van het onderwijs of hij Onze Minister een voorstel doet voor het aanpassen van een indicator
      of voor het vaststellen van een nieuwe indicator;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37b
  - number: 37b.1.b
    text: |-
      over het concept-voorstel overlegt de inspecteur-generaal van het onderwijs met de daarvoor in aanmerking komende
      organisaties uit het onderwijsveld;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37b
  - number: 37b.1.c
    text: |-
      de inspecteur-generaal van het onderwijs legt het voorstel voor aan Onze Minister, onder vermelding van de
      wijze waarop in het voorstel rekening is gehouden met de reacties van de geraadpleegde organisaties uit het
      onderwijsveld;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37b
  - number: 37b.1.d
    text: |-
      Onze Minister besluit naar aanleiding van het voorstel over wijziging van een indicator of vaststelling van een
      nieuwe indicator of een daarvoor noodzakelijk voorstel van wet of ontwerp-algemene maatregel van bestuur wordt
      voorbereid.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37b
  - number: 37b.2
    text: |-
      De wijze van meting en de aanpassing van de wijze van meting in het kader van toepassing van de indicatoren,
      alsmede de normering en de aanpassing van de normering, worden vastgesteld op voorstel van de inspecteur-generaal
      van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37b
  - number: 37b1
    text: |-
      Het instrument ter monitoring van de veiligheid van leerlingen, bedoeld in
      [artikel 3b, eerste lid, onderdeel b, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel3b
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37b1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 3b
  - number: 37b1.a
    text: |-
      geeft inzicht in de ervaren en feitelijke veiligheid en het welbevinden van de leerlingen, voor zover dat verband
      houdt met de veiligheid, op school;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37b1
  - number: 37b1.b
    text: wordt ten minste eens per schooljaar afgenomen onder een representatief deel van de leerlingen; en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37b1
  - number: 37b1.c
    text: is gestandaardiseerd, valide en betrouwbaar.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37b1
  - number: 37c
    text: |-
      Dit besluit berust mede op [artikel 23a1, vierde lid, van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a1
  - number: '38'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel38
  - number: '39'
    text: 'Dit besluit wordt aangehaald als: Inrichtingsbesluit WVO.'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel39
