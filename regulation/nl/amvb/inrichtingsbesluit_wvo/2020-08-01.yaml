  - number: 26b.8
    text: |-
      Het zevende lid, aanhef en onderdeel a, onder 1°, vindt toepassing onverminderd de mogelijkheid voor de leerling
      om een in dat onderdeel bedoeld wiskundevak dat het bevoegd gezag aanbiedt, te kiezen als extra vak, met dien
      verstande dat alleen zijn toegestaan de combinatie van wiskunde A en wiskunde B, en de combinatie van wiskunde B en
      wiskunde C.
