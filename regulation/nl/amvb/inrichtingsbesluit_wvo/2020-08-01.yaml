    text: 'de vakken, genoemd in het eerste tot en met het zesde lid, voor zover nog niet gekozen, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26b
  - number: 26b.7.a.1°
    text: |-
      van de vakken wiskunde A, wiskunde B en wiskunde C er slechts één deel kan uitmaken van het profiel, dat wiskunde D
      uitsluitend kan worden gekozen indien ook wiskunde B deel uitmaakt van het profiel, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26b
  - number: 26b.7.a.2°
    text: |-
      kunst (beeldende vormgeving) niet gekozen kan worden in combinatie met tekenen, handvaardigheid of textiele
      vormgeving, dat kunst (muziek) niet gekozen kan worden in combinatie met muziek, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26b
  - number: 26b.7.a.3°
    text: van de vakken tekenen, handvaardigheid en textiele vormgeving er slechts één deel kan uitmaken van het profiel,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26b
  - number: 26b.7.b
    text: |-
