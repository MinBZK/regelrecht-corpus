preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen van 29 december 1992, nr. 92096883/3180A,
    directie Wetgeving en Juridische Zaken, mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op de artikelen 10a, vijfde lid, 11e, tweede lid, 12a, tweede lid, 22, 23, 27, eerste lid, 28a, derde lid, en
    69, derde lid, van de Wet op het voortgezet onderwijs;

    Gezien het advies van de Onderwijsraad van 30 juni 1992, nr. OR 92000096/S;

    De Raad van State gehoord (advies van 3 maart 1993, nr. W05.92.0663);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen van 2 april 1993, nr.
    93019728/3180A, directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *agrarisch opleidingscentrum:* een agrarisch opleidingscentrum als bedoeld
      in [artikel 1.3.3 van de Wet educatie en beroepsonderwijs][ref1];
        - *basisberoepsgerichte leerweg:* de basisberoepsgerichte leerweg, genoemd in [artikel 10b van de wet][ref2];
        - *beroepsgericht keuzevak:* beroepsgericht keuzevak als bedoeld in [artikel 10b, zevende lid, onderdeel a][ref3],
      of [artikel 10d, zevende lid, onderdeel b, van de wet][ref4];
        - *beroepsgericht programma:* beroepsgericht programma als bedoeld in [artikel 23, eerste lid, onderdeel c][ref5],
      [24, eerste lid, onderdeel c][ref6], of [25 eerste lid, onderdeel d, van het Eindexamenbesluit VO][ref7];
        - *bevoegd gezag:* het bevoegd gezag, bedoeld in [artikel 1 van de wet][ref8];
        - *gemeenschappelijk deel:* het in [artikel 12, vierde lid, onderdeel a, van de wet][ref9] bedoelde onderdeel van
      het profiel;
        - *gemengde leerweg:* de gemengde leerweg, genoemd in [artikel 10d van de wet][ref10];
        - *havo:* hoger algemeen voortgezet onderwijs, als bedoeld in [artikel 8 van de wet][ref11];
        - *intelligentiequotiënt:* quotiënt dat de cognitieve capaciteiten van een leerling uitdrukt, vastgesteld op basis
      van scores op verbaal en op niet-verbaal gebied;
        - *inspectie:* de inspectie, als bedoeld in [artikel 1 van de Wet op het onderwijstoezicht][ref12];
        - *instelling voor middelbaar beroepsonderwijs:* instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref13];
        - *kaderberoepsgerichte leerweg:* de kaderberoepsgerichte leerweg, genoemd in [artikel 10b van de wet][ref14];
        - *leerachterstand:* achterstand van een leerling in de domeinen technisch lezen, spellen, begrijpend lezen en
      inzichtelijk rekenen, gemeten op basis van didactische leeftijdseenheden (DLE) in relatie tot de didactische
      leeftijd (DL) op het moment van toetsing;
        - *leerwegondersteunend onderwijs:* onderwijs als bedoeld in [artikel 10e van de wet][ref15];
        - *maatschappelijke stage:* maatschappelijke stage als bedoeld in [artikel 6f van de wet][ref16];
        - *mavo:* middelbaar algemeen voortgezet onderwijs, als bedoeld in [artikel 9 van de wet][ref17];
        - *normatieve studielast:* de normatieve studielast, bedoeld in [artikel 12, vijfde lid, van de wet][ref18];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *ouders:* ouders, voogden of verzorgers;
        - *praktijkonderwijs:* het praktijkonderwijs, bedoeld in [artikel 10f van de wet][ref19];
        - *profiel:* profiel, bedoeld in [artikel 10, tweede lid][ref20], [10b, tweede lid][ref21],
      [10d, tweede lid][ref22], of [12, tweede lid, van de wet][ref23];
        - *profieldeel:* het in [artikel 12, vierde lid, onderdeel b, van de wet][ref24] bedoelde onderdeel van het
      profiel;
        - *profielvak:* profielvak als bedoeld in [artikel 10b, zesde lid][ref25], of
      [artikel 10d, zesde lid, van de wet][ref26];
        - *regionaal opleidingscentrum:* een regionaal opleidingscentrum als bedoeld in
      [artikel 1.3.1. van de Wet educatie en beroepsonderwijs][ref27];
        - *samenwerkingsverband:* samenwerkingsverband als bedoeld in [artikel 1 van de wet][ref28];
        - *school:* een school voor vwo, een school voor havo, een school voor mavo, een school voor vbo of een school
      voor praktijkonderwijs;
        - *sociaal-emotionele problematiek:* problematiek als gevolg van het sociaal-emotioneel functioneren van een
      leerling waardoor het onderwijsleerproces substantieel wordt belemmerd;
        - *stage:* de stage, bedoeld in [artikel 22, derde lid, onderdeel d, van de wet][ref29];
        - *stagebegeleider:* degene die is belast met de begeleiding van de leerling en werkzaam is bij de stagegever;
        - *stagebieder:* de rechtspersoon of natuurlijke persoon bij wie de maatschappelijke stage wordt doorlopen;
        - *stagegever:* de rechtspersoon of de natuurlijke persoon bij wie de stage wordt doorlopen;
        - *stageleraar:* de leraar van de school waarop de leerling is ingeschreven, belast met het toezicht op de leerling
      tijdens het verloop van de stage;
        - *theoretische leerweg:* de theoretische leerweg, genoemd in [artikel 10 van de wet][ref30];
        - *vakken behorende tot de beeldende vorming:* tekenen, handvaardigheid, textiele vormgeving, fotografie, film,
      audio-visuele vorming;
        - *vbo:* voorbereidend beroepsonderwijs, als bedoeld in [artikel 10a van de wet][ref31];
        - *vmbo:* voorbereidend middelbaar beroepsonderwijs, als bedoeld in [artikel 21 van de wet][ref32];
        - *vwo:* voorbereidend wetenschappelijk onderwijs, als bedoeld in [artikel 7 van de wet][ref33];
        - *vrij deel:* het in [artikel 12, vierde lid, onderdeel c, van de wet][ref34] bedoelde onderdeel van het profiel;
        - *wet:* [Wet op het voortgezet onderwijs][ref35].


