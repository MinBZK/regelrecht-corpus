        artikel: '24'
  - number: '9'
    text: |-
      Een leerling, komende van een gelijksoortige school, wordt bij toelating geplaatst in het leerjaar waarin de
      leerling op die school onderwijs had mogen volgen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel9
  - number: '10.1'
    text: |-
      Een leerling die in het bezit is van een diploma vmbo in de theoretische leerweg kan de toelating tot het vierde
      leerjaar van een school voor havo worden geweigerd, indien het eindexamen dat heeft geleid tot zijn diploma geen
      van de volgende vakken als extra vak omvat:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel10
  - number: 10.1.a
    text: |-
      de vakken, genoemd in [artikel 10, zesde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: 10.1.b
    text: |-
      de vakken, genoemd in [artikel 10, zevende lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: 10.1.c
    text: |-
      de vakken, genoemd in [artikel 26b, derde tot en met zevende lid][ref1], met uitzondering van de vakken genoemd in
      artikel 26b, zevende lid, onderdeel c, subonderdelen 1° en 2°, en onderdeel d; of


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
        hoofdstuk: III
        paragraaf: '3'
  - number: 10.1.d
    text: |-
      de vakken, genoemd in [artikel 26c, tweede tot en met zesde lid][ref1], met uitzondering van de vakken, genoemd in
      artikel 26c, zesde lid, onderdeel c, subonderdelen 1° en 2°, en onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26c
        hoofdstuk: III
        paragraaf: '3'
  - number: '10.2'
    text: |-
      Een leerling die in het bezit is van een diploma vmbo in de gemengde leerweg kan de toelating tot het vierde
      leerjaar van een school voor havo worden geweigerd, indien het eindexamen dat heeft geleid tot zijn diploma geen
      van de volgende vakken als extra vak omvat:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel10
  - number: 10.2.a
    text: |-
      de vakken, genoemd in [artikel 10d, zesde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10d
  - number: 10.2.b
    text: |-
      de vakken, genoemd in [artikel 10d, zevende lid, onderdeel c, van de wet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10d
  - number: 10.2.c
    text: de vakken, bedoeld in het eerste lid, onderdelen c en d.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel10
  - number: '12.1'
    text: |-
      Voorwaardelijke bevordering wordt uitdrukkelijk op het eindrapport vermeld. Bovendien wordt hiervan schriftelijk
      mededeling gedaan aan ouders, voogden of verzorgers, waarbij wordt vermeld het tijdstip waarop definitief omtrent
      de overgang zal worden beslist alsmede de voorwaarden waaraan moet worden voldaan om te kunnen worden bevorderd.
      Dit tijdstip ligt tussen 1 oktober en 1 januari daarop volgend.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel12
  - number: '12.2'
    text: Een leerling wordt niet voorwaardelijk bevorderd tot het hoogste leerjaar.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel12
  - number: '13.1'
    text: Het bevoegd gezag kan met opgave van redenen een leerling voor een periode van ten hoogste één week schorsen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel13
  - number: '13.2'
    text: |-
      Het besluit tot schorsing wordt schriftelijk aan de betrokkene en, indien deze nog niet de leeftijd van 21 jaar
      heeft bereikt, ook aan de ouders, voogden of verzorgers van de betrokkene bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel13
  - number: '13.3'
    text: |-
      Het bevoegd gezag stelt de inspectie van een schorsing voor een periode langer dan één dag schriftelijk en met
      opgave van redenen in kennis.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel13
  - number: '14.1'
    text: |-
      Het bevoegd gezag kan besluiten tot definitieve verwijdering van een leerling nadat deze en, indien de leerling
      nog niet de leeftijd van 18 jaren heeft bereikt, ook diens ouders, voogden of verzorgers, in de gelegenheid is
      onderscheidenlijk zijn gesteld hierover te worden gehoord. Een leerling wordt op grond van onvoldoende vorderingen
      niet in de loop van een schooljaar verwijderd.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel14
  - number: '14.2'
    text: |-
      Definitieve verwijdering van een leerplichtige leerling geschiedt slechts na overleg met de inspectie. Hangende
      dit overleg kan de leerling worden geschorst. Het overleg strekt er mede toe, na te gaan op welke andere wijze de
      betrokken leerling onderwijs zal kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel14
  - number: '14.3'
    text: |-
      Het bevoegd gezag stelt de inspectie van een definitieve verwijdering schriftelijk en met opgave van redenen in
      kennis.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel14
  - number: 14a
    text: |-
      Het bevoegd gezag maakt bij beslissingen tot verwijdering van leerlingen op de grond dat deze niet zijn bevorderd
      tot het zesde leerjaar van het vwo dan wel het vijfde leerjaar van het havo, geen onderscheid tussen leerlingen op
      basis van de schoolsoort of leerweg waarvoor zij eerder stonden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel14a
  - number: '15.1'
    text: |-
      De besluiten tot weigering van de toelating van een kandidaat-leerling of tot definitieve verwijdering van een
      leerling worden schriftelijk en met opgave van redenen aan de leerling en, indien deze nog niet de leeftijd van 21
      jaren heeft bereikt, ook aan diens ouders, voogden of verzorgers, bekendgemaakt, waarbij tevens de inhoud van het
      tweede lid wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15
  - number: '15.2'
    text: Binnen zes weken na de bekendmaking kunnen belanghebbenden bezwaar maken bij het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15
  - number: '15.3'
    text: |-
      Het bevoegd gezag beslist in overeenstemming met [artikel 27 van de wet][ref1] binnen vier weken na ontvangst van
      het bezwaarschrift, doch niet eerder dan nadat de kandidaat-leerling, onderscheidenlijk de leerling en, indien
      deze nog niet de leeftijd van 18 jaar heeft bereikt, ook diens ouders, voogden of verzorgers, in de gelegenheid is,
      onderscheidenlijk zijn gesteld, te worden gehoord en kennis heeft onderscheidenlijk hebben kunnen nemen van de op
      die besluiten betrekking hebbende adviezen of rapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
  - number: '15.4'
    text: |-
      Het bevoegd gezag kan de desbetreffende leerling, gedurende de behandeling van het bezwaar tegen een besluit tot
      definitieve verwijdering de toegang tot de school ontzeggen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15
  - number: 15a.1
    text: |-
      De deskundigen, bedoeld in [artikel 17a, twaalfde lid, van de wet][ref1] zijn een orthopedagoog of een psycholoog
      en afhankelijk van de leerling over wiens toelaatbaarheid wordt geadviseerd ten minste een tweede deskundige, te
      weten een kinder- of jeugdpsycholoog, een pedagoog, een kinderpsychiater, een maatschappelijk werker of een arts.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17a
  - number: 15a.2
    text: |-
      Indien het samenwerkingsverband besluit of een leerling aangewezen is op het leerwegondersteunend onderwijs of
      toelaatbaar is tot het praktijkonderwijs kan de tweede deskundige, bedoeld in het eerste lid, ook een deskundige op
      het terrein van vbo, mavo, vmbo en praktijkonderwijs zijn.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15a
  - number: 15b.1
    text: |-
      De geschillencommissie, bedoeld in [artikel 27c van de wet][ref1], bestaat uit ten minste 7 leden met verschillende
      deskundigheden. De leden worden benoemd op gezamenlijke bindende voordracht van de landelijke ouderorganisaties, de
      landelijke patiënten- en gehandicaptenorganisaties en de sectororganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27c
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 27c
  - number: 15b.2
    text: De leden worden benoemd en ontslagen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15b
  - number: 15b.3
    text: De leden worden benoemd voor een periode van 4 jaar en kunnen ten hoogste 2 maal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15b
  - number: 15b.4
    text: |-
      De commissie is zodanig samengesteld dat zij beschikt over (ortho)pedagogische, psychologische, onderwijskundige,
      maatschappelijke, bestuurlijke, juridische en medische deskundigheid. Voor de behandeling van ieder ingediend
      geschil kiest de commissie uit haar leden één voorzitter en twee leden. De commissie bepaalt welke samenstelling
      bij de behandeling van het geschil het meest geschikt is.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15b
  - number: 15b.5
    text: De leden worden ontslagen indien zij daarom verzoeken.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15b
  - number: 15b.6
    text: |-
      De leden mogen niet deel uitmaken van het bevoegd gezag van een van de scholen die deelnemen aan het
      samenwerkingsverband of het bevoegd gezag van dat samenwerkingsverband dat betrokken is in het geschil en zij
      functioneren zonder last of ruggenspraak.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15b
  - number: 15b.7
    text: |-
      De commissie zendt haar oordeel aan het bevoegd gezag en een afschrift van haar oordeel aan de ouders. Indien de
      beslissing van het bevoegd gezag van de school afwijkt van het oordeel van de commissie, wordt in de beslissing de
      reden voor die afwijking vermeld.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15b
  - number: 15b.8
    text: |-
      Het bevoegd gezag van de school die het oordeel van de commissie heeft ontvangen, deelt schriftelijk aan de ouders
      en aan de commissie mee wat er met het oordeel wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15b
  - number: 15c.1
    text: |-
      Het ontwikkelingsperspectief, bedoeld in [artikel 26 van de wet][ref1], bevat ten minste informatie over naar welk
      vervolgonderwijs, en indien het een leerling betreft die praktijkonderwijs volgt naar welke soort arbeid uitstroom
      van de leerling wordt verwacht, en de onderbouwing daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel26
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '26'
  - number: 15c.2
    text: |-
      De onderbouwing bevat ten minste een weergave van de belemmerende en bevorderende factoren die van invloed zijn op
      het onderwijs aan de leerling.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15c
  - number: 15d.1
    text: |-
      Een samenwerkingsverband baseert de beslissing op de aanvraag, bedoeld in [artikel 10e, vierde lid][ref1], en
      [10g, tweede lid, van de wet][ref2], uitsluitend op:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10g
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10e
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10g
  - number: 15d.1.a
    text: |-
      de door het bevoegd gezag gegeven motivering die gebaseerd is op ervaringen met de leerling in
      het onderwijsleerproces, zoals die onder meer blijken uit het onderwijskundig rapport, bedoeld in
      [artikel 42 van de Wet op het primair onderwijs][ref1] en [artikel 43 van de Wet op de expertisecentra][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel43
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '43'
  - number: 15d.1.b
    text: de leerachterstand van de leerling,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.1.c
    text: het intelligentiequotiënt van de leerling, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.1.d
    text: |-
      indien dat noodzakelijk is voor het vormen van een oordeel, de resultaten van een of meer
      persoonlijkheidsonderzoeken met betrekking tot prestatiemotivatie, faalangst en emotionele instabiliteit die een
      beeld geven van de sociaal-emotionele problematiek van de leerling in relatie tot de leerprestaties, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.1.e
    text: 'indien het een aanvraag voor toelaatbaarheid tot het praktijkonderwijs betreft: de zienswijze van de ouders.'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.2
    text: |-
      Bij de beslissing op de aanvraag, bedoeld in het eerste lid, controleert het samenwerkingsverband of het bevoegd
      gezag voor de gegevens, bedoeld in het eerste lid, onderdelen b tot en met d, de jaarlijks voor 1 oktober bij
      ministeriële regeling vastgestelde screenings- of testinstrumenten, heeft gebruikt. De testinstrumenten voor
      de gegevens, bedoeld in het eerste lid, onderdelen c en d, worden toegepast onder verantwoordelijkheid van een
      diagnostisch geschoold psycholoog of diagnostisch geschoold orthopedagoog.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.3
    text: 'De leerachterstand van de leerling is de uitkomst van 1 minus (DLE/DL), waarin:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.3.a
    text: |-
      DLE de afkorting is van didactische leeftijdseenheden en het aantal maanden onderwijs dat behoort bij het niveau
      dat de leerling feitelijk heeft bereikt, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.3.b
    text: |-
      DL de afkorting is van didactische leeftijd en het aantal maanden dat een leerling vanaf groep
      3 in de perioden van september tot en met juni was ingeschreven bij een school als bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref1] of een school voor speciaal onderwijs als bedoeld in
      [artikel 1 van de Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel1
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '1'
  - number: 15d.4
    text: 'Het samenwerkingsverband wijst de aanvraag voor praktijkonderwijs uitsluitend toe, indien de leerling:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.4.a
    text: een intelligentiequotiënt heeft binnen de bandbreedte van 55 tot en met 80, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.4.b
    text: |-
      een leerachterstand heeft op ten minste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen, technisch
      lezen en spellen, ten minste één van deze twee domeinen inzichtelijk rekenen of begrijpend lezen betreft en deze
      leerachterstand gelijk is aan of groter is dan 0,5.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.5
    text: 'Het samenwerkingsverband wijst de aanvraag voor leerwegondersteunend onderwijs uitsluitend toe, indien de leerling:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.5.a.1
    text: een intelligentiequotiënt heeft binnen de bandbreedte 75 tot en met 90, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.5.a.2
    text: |-
      een leerachterstand heeft op ten minste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen, technisch
      lezen en spellen, ten minste één van deze twee domeinen inzichtelijk rekenen of begrijpend lezen betreft en deze
      leerachterstand is gelegen binnen de bandbreedte van 0,25 tot 0,5, of
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.5.b.1
    text: een intelligentiequotiënt heeft binnen de bandbreedte 91 tot en met 120, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.5.b.2
    text: |-
      een leerachterstand heeft op tenminste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen, technisch
      lezen en spellen, ten minste één van deze twee domeinen inzichtelijk rekenen of begrijpend lezen betreft en deze
      leerachterstand is gelegen binnen de bandbreedte van 0,25 tot 0,5, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.5.b.3
    text: een sociaal-emotionele problematiek heeft als bedoeld in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15d.6
    text: |-
      Voor een leerling die wat intelligentiequotiënt of leerachterstand betreft, voldoet aan de vereisten voor
      toelaatbaarheid tot het praktijkonderwijs en die wat de overige vereisten betreft voldoet aan de vereisten om
      aangewezen te zijn op het leerwegondersteunend onderwijs, kan een leerling toelaatbaar worden verklaard tot
      praktijkonderwijs of aangewezen worden op het leerwegondersteunend onderwijs, afhankelijk van de door het bevoegd
      gezag gegeven motivering, bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15d
  - number: 15e.1
    text: |-
      Op grond van [artikel 10g, vijfde lid, van de wet][ref1] kan het bevoegd gezag van een school voor
      praktijkonderwijs tevens een aanvraag voor toelaatbaarheid tot het praktijkonderwijs bij een samenwerkingsverband
      indienen voor een leerling voor wie het zorg- en onderwijsaanbod van het praktijkonderwijs naar het oordeel van dat
      bevoegd gezag het beste aansluit bij de behoeften van deze leerling en die:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10g
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10g
  - number: 15e.1.a
    text: |-
      het voorbereidend beroepsonderwijs of het middelbaar algemeen voortgezet onderwijs bezoekt en op
      leerwegondersteunend onderwijs is aangewezen:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.1.a.1
    text: |-
      met scores op de criteria, bedoeld in [artikel 15d][ref1], in het grensvlak van het leerwegondersteunend onderwijs
      en praktijkonderwijs,


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel15d
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 15d
        hoofdstuk: IIa
  - number: 15e.1.a.2
    text: |-
      naar het oordeel van het bevoegd gezag een toegenomen problematiek heeft nadat de beslissing is genomen dat de
      leerling op leerwegondersteunend onderwijs is aangewezen, of
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.1.a.3
    text: |-
      naar het oordeel van het bevoegd gezag een stapeling van andersoortige problematiek heeft dan wordt beoordeeld in
      het onderzoek of de leerling is aangewezen op leerwegondersteunend onderwijs of praktijkonderwijs, dan wel
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.1.b
    text: |-
      beschikt over een toelaatbaarheidsverklaring voor het speciaal onderwijs of voortgezet speciaal onderwijs van een
      samenwerkingsverband dan wel een ontwikkelingsperspectief en die:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.1.b.1
    text: |-
      voldoet aan het intelligentiequotiëntcriterium of leerachterstandscriterium voor toelating tot het
      praktijkonderwijs, bedoeld in [artikel 15d, vierde lid][ref1], blijkens gegevens die gebaseerd zijn op screenings-
      of testinstrumenten als bedoeld in artikel 15d, tweede lid, of


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel15d
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 15d
        hoofdstuk: IIa
  - number: 15e.1.b.2
    text: |-
      naar het oordeel van het bevoegd gezag, ongeacht een dergelijk intelligentiequotiënt of een dergelijke
      leerachterstand, een zodanige problematiek heeft dat toelaatbaarheid tot het praktijkonderwijs geboden is.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.2
    text: |-
      Het samenwerkingsverband baseert de beschikking over de toelaatbaarheid tot het praktijkonderwijs uitsluitend op de
      volgende, bij de aanvraag gevoegde, gegevens:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.2.a
    text: |-
      een kopie van de beslissing dat de leerling is aangewezen op leerwegondersteunend onderwijs, of een kopie van de
      toelaatbaarheidsverklaring voor het speciaal onderwijs of voortgezet speciaal onderwijs, danwel een kopie van het
      ontwikkelingsperspectief,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.2.b
    text: de op schrift gestelde zienswijze en instemming van de ouders,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.2.c
    text: een motivering waaruit blijkt dat de leerling voldoet aan de voorschriften, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.2.d
    text: 'een leerling-dossier dat in elk geval bevat:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.2.d.1
    text: |-
      het ontwikkelingsperspectief of het onderwijskundig rapport over de leerling, bedoeld in
      [artikel 42 van de Wet op het primair onderwijs][ref1] en [artikel 43 van de Wet op de expertisecentra][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel43
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '43'
  - number: 15e.2.d.2
    text: |-
      een beschrijving van de activiteiten van het verwijzende bevoegd gezag in het kader van de begeleiding van de
      leerling, en van de resultaten van die activiteiten,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.2.d.3
    text: |-
      een document dat aangeeft welke externe deskundigen voor advies of hulp zijn ingeschakeld bij de begeleiding van
      de leerling,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.2.d.4
    text: |-
      een beschrijving van de risico’s die zich naar verwachting zullen voordoen indien de leerling voorbereidend
      beroepsonderwijs, middelbaar algemeen voortgezet onderwijs, speciaal onderwijs of voortgezet speciaal onderwijs
      blijft volgen, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15e.2.d.5
    text: mogelijk relevante test- en toetsgegevens.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15e
  - number: 15f.1
    text: |-
      Indien een samenwerkingsverband gebruik maakt van de bevoegdheid, bedoeld in
      [artikel 17a1, eerste lid, aanhef en onderdeel b, van de wet][ref1], heeft de beslissing over het aangewezen zijn
      op het leerwegondersteunend onderwijs bedoeld in [artikel 10e, vierde lid, van de wet][ref2], betrekking op een
      periode van één of meer schooljaren. Indien de beslissing bedoeld in de eerste volzin wordt gegeven in de loop van
      een schooljaar, wordt de periode tot de eerste dag van het eerstvolgende schooljaar toegevoegd aan de in de eerste
      volzin bedoelde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17a1
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10e
  - number: 15f.2
    text: |-
      Onze Minister kan nadere regels stellen over de toepassing van de bevoegdheden, bedoeld in
      [artikel 17a1, eerste en tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a1
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17a1
  - number: '16.1'
    text: |-
      Het aantal dagen dat per schooljaar ten hoogste voor vakanties op grond van
      [artikel 6g1, derde lid, van de wet][ref1], mag worden besteed, bedraagt 66 bij een zesdaagse schoolweek en 55 bij
      een vijfdaagse schoolweek.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g1
  - number: '16.2'
    text: |-
      Indien na aftrek van het aantal dagen dat wordt besteed voor vakanties die centraal worden vastgesteld op grond van
      [artikel 6g1, vierde lid, van de wet][ref1], dagen resteren van de in het eerste lid bedoelde aantallen, kan het
      bevoegd gezag voor het betreffende schooljaar een of meer vakanties vaststellen waarvoor ten hoogste dat resterend
      aantal dagen mag worden besteed.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g1
  - number: '16.3'
    text: |-
      Onder dagen in het eerste lid wordt verstaan elke dag van de week met uitzondering van de zondag bij een zesdaagse
      schoolweek en met uitzondering van de zaterdag en de zondag bij een vijfdaagse schoolweek. Op die zondagen
      respectievelijk zaterdagen en zondagen wordt geen onderwijs verzorgd.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel16
  - number: '16.4'
    text: |-
      Tenzij vallend binnen een op grond van het tweede lid of op grond van [artikel 6g1, vierde lid, van de wet][ref1]
      vastgestelde vakantie, worden de volgende dagen, waarop eveneens geen onderwijs wordt verzorgd, niet meegeteld bij
      het aantal dagen, bedoeld in het eerste lid:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g1
  - number: 16.4.a
    text: nieuwjaarsdag, tweede paasdag, Hemelvaartsdag, tweede pinksterdag en de beide kerstdagen, alsmede
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel16
  - number: 16.4.b
    text: Koningsdag en Bevrijdingsdag.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel16
  - number: '16.5'
    text: |-
      Indien aan een bijzondere school onderwijs wordt gegeven gebaseerd op een levensbeschouwing volgens welke andere
      dan de in het vierde lid, onderdeel a, genoemde dagen als feestdagen worden aangemerkt, kan in plaats van op de
      dagen, bedoeld in het vierde lid, onderdeel a, die vallen buiten een op grond van het tweede lid of op grond van
      [artikel 6g1, vierde lid, van de wet][ref1] vastgestelde vakantie, geen onderwijs worden verzorgd op andere dagen.
      Bij toepassing van de eerste volzin worden laatstgenoemde dagen niet meegeteld bij het aantal dagen, bedoeld in het
      eerste lid. De eerste volzin kan per schooljaar worden toegepast voor ten hoogste het aantal dagen als bedoeld in
      het vierde lid, onderdeel a, dat buiten een op grond van het tweede lid of op grond van artikel 6g1, vierde lid,
      van de wet vastgestelde vakantie valt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g1
  - number: '17'
    text: |-
      Buiten de vakanties en de andere dagen waarop geen onderwijs wordt verzorgd op grond van [artikel 16][ref1],
      wijst het bevoegd gezag bij een zesdaagse schoolweek ten hoogste dertien dagen per schooljaar aan en
      bij een vijfdaagse schoolweek ten hoogste twaalf dagen per schooljaar aan waarop geen onderwijs wordt
      verzorgd, waarvan ten hoogste zes dagen onmiddellijk aansluitend voor of na de voor de school op grond van
      [artikel 6g1, vierde lid, van de wet][ref2] vastgestelde zomervakantie.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 6g1
  - number: '19.1'
    text: |-
      Voor afwijkingen als bedoeld in [artikel 11d, tweede lid, eerste volzin, van de wet][ref1] kunnen in aanmerking
      komen leerlingen die naar het oordeel van het bevoegd gezag niet in staat zijn al het onderwijs dat wordt verzorgd
      op basis van de kerndoelen te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11d
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11d
  - number: '19.2'
    text: |-
      Het bevoegd gezag stelt een commissie in die adviseert ten aanzien van welke leerlingen
      [artikel 11d, tweede lid, van de wet][ref1] toepassing kan vinden. Het bevoegd gezag regelt de omvang en
      samenstelling van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11d
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11d
  - number: '19.3'
    text: |-
      In haar advies doet de commissie aan het bevoegd gezag voorstellen ten aanzien van de aard van de in het tweede lid
      bedoelde afwijkingen. Daarbij geeft zij aan waarop deze voorstellen zijn gegrond.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel19
  - number: '19.4'
    text: 'De commissie betrekt in elk geval bij haar oordeelsvorming:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel19
  - number: 19.4.a
    text: |-
      in voorkomende gevallen het in [artikel 3, tweede lid][ref1], bedoelde onderwijskundig rapport en de resultaten van
      het in [artikel 4][ref2] bedoelde onderzoek naar de geschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel4
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005946
        artikel: '4'
        hoofdstuk: II
  - number: 19.4.b
    text: |-
      indien de omstandigheid op grond waarvan afwijking wordt voorgesteld daartoe aanleiding geeft, de van een
      deskundige verkregen verklaring;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel19
  - number: 19.4.c
    text: |-
      de zienswijze van de ouders, voogden of verzorgers van de leerlingen, welke zienswijze blijkt uit een schriftelijke
      verklaring;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel19
  - number: 19.4.d
    text: |-
      de zienswijze van de leraar of leraren, belast met het betrokken onderwijs, welke zienswijze blijkt uit een
      schriftelijke verklaring.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel19
  - number: '19.5'
    text: |-
      Het advies wordt schriftelijk uitgebracht aan het bevoegd gezag. Indien het bevoegd gezag voornemens is af te
      wijken van het advies van de commissie, overlegt het over dit voornemen met de commissie. De beslissing van het
      bevoegd gezag is met redenen omkleed. Het bevoegd gezag zendt een afschrift van zijn beslissing, vergezeld van het
      advies van de commissie en de daarbij gevoegde verklaringen, bedoeld in het vierde lid, aan de ouders, voogden of
      verzorgers van de betrokken leerlingen, aan de betrokken leraar of leraren en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel19
  - number: '21.1'
    text: |-
      Het onderwijsprogramma in de eerste drie leerjaren aan een school voor vwo en een school voor havo omvat tevens
      onderwijs in Franse taal en Duitse taal.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel21
  - number: '21.2'
    text: |-
      Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen van het volgen
      van onderwijs in Franse taal of Duitse taal, indien de leerling onderwijs volgt in Spaanse taal, Russische taal,
      Italiaanse taal, Arabische taal, Turkse taal of, in het vwo, Chinese taal en cultuur.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel21
  - number: '21.3'
    text: |-
      Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen van het volgen
      van onderwijs in Franse taal of Duitse taal dan wel in beide talen, indien de leerling
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel21
  - number: 21.3.a
    text: voor de eerste maal tot een school voor havo of een school voor vwo is toegelaten,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel21
  - number: 21.3.b
    text: is geplaatst in een hoger leerjaar dan het eerste,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel21
  - number: 21.3.c
    text: voordien buiten Nederland vergelijkbaar onderwijs heeft gevolgd, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel21
  - number: 21.3.d
    text: daarbij geen of te weinig onderwijs in de desbetreffende taal of talen heeft gevolgd.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel21
  - number: '21.4'
    text: |-
      In de eerste drie leerjaren van een gymnasium wordt tevens onderwijs verzorgd in Latijnse taal en cultuur en
      Griekse taal en cultuur.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel21
  - number: '22.1'
    text: |-
      Het onderwijsprogramma in de eerste twee leerjaren aan een school voor mavo en een school voor vbo omvat
      tevens onderwijs in Franse taal of Duitse taal. Deze verplichting geldt niet voor leerlingen voor wie
      naar de verwachting van het bevoegd gezag het onderwijs in de basisberoepsgerichte leerweg als bedoeld in
      [artikel 10b, eerste lid, van de wet][ref1] het meest geschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
  - number: '22.2'
    text: |-
      Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen van het volgen
      van onderwijs in Franse taal of Duitse taal:
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel22
  - number: 22.2.a
    text: indien de leerling onderwijs volgt in Spaanse taal, Arabische taal of Turkse taal, of
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel22
  - number: 22.2.b
    text: indien de leerling
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel22
  - number: 22.2.b.1°
    text: voor de eerste maal tot een school voor mavo of een school voor vbo is toegelaten,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel22
  - number: 22.2.b.2°
    text: is geplaatst in een hoger leerjaar dan het eerste,
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel22
  - number: 22.2.b.3°
    text: voordien buiten Nederland vergelijkbaar onderwijs heeft gevolgd, en
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel22
  - number: 22.2.b.4°
    text: daarbij geen of te weinig onderwijs in de desbetreffende taal of talen heeft gevolgd.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel22
  - number: '22.3'
    text: |-
      De leerling die op basis van het eerste lid, geen onderwijs volgt in de Franse taal of Duitse taal, volgt in het
      profiel economie en ondernemen of het profiel horeca, bakkerij en recreatie van de basisberoepsgerichte leerweg in
      plaats hiervan, naar keuze van de leerling, het vak Arabische taal, Turkse taal, Spaanse taal, maatschappijkunde,
      geschiedenis en staatsinrichting of aardrijkskunde.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel22
  - number: 25a
    text: |-
      Praktijkonderwijs omvat ten minste Nederlandse taal, rekenen/wiskunde, informatiekunde en lichamelijke opvoeding,
      alsmede het onderwijs waarvan het bevoegd gezag, na overleg met het college van burgemeester en wethouders dat
      daarbij de werkgevers betrekt die werkzaam zijn op de regionale arbeidsmarkt, heeft vastgesteld dat dit van belang
      is voor het uitoefenen van functies binnen die arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel25a
  - number: '26.1'
    text: |-
      Indien een samenwerkingsverband als bedoeld in [artikel 1 van de wet][ref1] een orthopedagogisch-didactisch centrum
      omvat, wordt dat vermeld in het ondersteuningsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
  - number: '26.2'
    text: |-
      Een leerling die is of wordt ingeschreven bij een school, kan gedurende ten hoogste 2 jaren het onderwijsprogramma
      of een gedeelte daarvan volgen bij een orthopedagogisch-didactisch centrum.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel26
  - number: '26.3'
    text: |-
      Het onderwijs van leerlingen die langer dan 3 maanden een programma volgen bij het orthopedagogisch-didactisch
      centrum, wordt gegeven door daartoe bevoegde leraren.
