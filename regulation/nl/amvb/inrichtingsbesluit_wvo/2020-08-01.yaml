  - number: '2.1'
    text: |-
      Het bevoegd gezag kan bepalen dat de in [artikel 27, eerste lid, van de wet][ref1] bedoelde bevoegdheid tot
      toelating onder zijn verantwoordelijkheid wordt uitgeoefend door een door het bevoegd gezag in te stellen
      toelatingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
  - number: '2.2'
    text: |-
      Het bevoegd gezag regelt de werkzaamheden, omvang en samenstelling van de in het eerste lid bedoelde
      toelatingscommissie en kan de uitoefening van de bevoegdheid door de commissie nader regelen.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel2
  - number: '3.1'
    text: 'Tot het eerste leerjaar van een school kan als leerling slechts worden toegelaten degene die:'
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel3
  - number: 3.1.a
    text: |-
      afkomstig is van een school voor basisonderwijs en bij wie naar het oordeel van de directeur van de school voor
      basisonderwijs de grondslag voor het volgen van aansluitend voortgezet onderwijs in voldoende mate is gelegd, of
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel3
  - number: 3.1.b
    text: |-
      afkomstig is van een school voor basisonderwijs of een speciale school voor basisonderwijs als bedoeld in de
      [Wet op het primair onderwijs][ref1] en aan het einde van het schooljaar de leeftijd van 14 jaar heeft bereikt, of


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 3.1.c
    text: |-
      afkomstig is van een school voor speciaal onderwijs, een school voor voortgezet speciaal onderwijs of een school
      of instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref1] en
      bij wie naar het oordeel van de directeur van de desbetreffende school of instelling de grondslag voor het volgen
      van aansluitend voortgezet onderwijs in voldoende mate is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '3.2'
    text: |-
      Het bevoegd gezag baseert zijn beslissing over de toelating op grond van het eerste lid op het schooladvies,
      bedoeld in [artikel 42, tweede lid, eerste volzin, van de Wet op het primair onderwijs][ref1], of
      [artikel 43, tweede lid, eerste volzin, van de Wet op de expertisecentra][ref2], dat voor 1 maart wordt
      vastgesteld. Indien het schooladvies naar aanleiding van het resultaat van de centrale eindtoets of een andere
      eindtoets wordt gewijzigd, dan baseert het bevoegd gezag zijn beslissing op dat gewijzigde schooladvies.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel43
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '43'
  - number: '3.3'
    text: De toelating tot het eerste leerjaar van een school kan niet voorwaardelijk geschieden.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel3
  - number: '3.4'
    text: |-
      In gevallen waarin toepassing van het eerste of tweede lid niet mogelijk is, kan de inspectie afwijking van het
      eerste of tweede lid toestaan.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel3
  - number: '4.1'
    text: |-
      Een onderzoek naar de geschiktheid van de kandidaat-leerling voor het volgen van het onderwijs aan de school
      waarvoor de toelating wordt gevraagd, kan uitsluitend worden afgenomen indien voor de kandidaat-leerling geen
      schooladvies is vastgesteld of indien de kandidaat-leerling geen centrale eindtoets of andere eindtoets als bedoeld
      in [artikel 9b van de Wet op het primair onderwijs][ref1], of [artikel 18b van de Wet op de expertisecentra][ref2]
      heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel18b
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 9b
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 18b
  - number: '4.2'
    text: |-
      Onverminderd [artikel 3, tweede lid][ref1], kan het bevoegd gezag van een school met een bijzondere inrichting
      waarvoor specifieke kennis of vaardigheden van de kandidaat-leerling noodzakelijk zijn, een onderzoek naar die
      specifieke kennis of vaardigheden bij de kandidaat-leerling afnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
  - number: '5.1'
    text: |-
      Het bevoegd gezag doet mededeling aan de inspectie van de te volgen procedure voor de toelating tot het
      eerste leerjaar. Het zendt jaarlijks binnen 6 maanden na de toelating een verslag betreffende de toegepaste
      toelatingsmiddelen en van de daarmee opgedane ervaringen aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel5
  - number: '5.2'
    text: |-
      Het bevoegd gezag stelt de directeur van de basisschool, de speciale school voor basisonderwijs, de school voor
      speciaal onderwijs, de school voor voortgezet speciaal onderwijs of de school of instelling voor speciaal en
      voortgezet speciaal onderwijs in kennis van de beslissing omtrent de toelating en, na afloop van het eerste
      leerjaar, indien de directeur dit verzoekt, van de studieresultaten van de leerling.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel5
  - number: '6.1'
    text: |-
      In afwijking van [artikel 3][ref1] of [artikel 4][ref2] kan het bevoegd gezag van een school voor vwo of voor havo
      tot het eerste leerjaar van die school toelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel4
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005946
        artikel: '4'
        hoofdstuk: II
  - number: 6.1.a
    text: de kandidaat-leerling die tot het eerste leerjaar van een andere school voor vwo of voor havo is toegelaten;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel6
  - number: 6.1.b
    text: |-
      de kandidaat-leerling die het eerste leerjaar van een school voor mavo gedeeltelijk heeft doorlopen, indien de
      studieresultaten daartoe naar het oordeel van het bevoegd gezag aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel6
  - number: '6.2'
    text: |-
      In afwijking van [artikel 3][ref1] of [artikel 4][ref2] kan het bevoegd gezag van een school voor mavo tot het
      eerste leerjaar van die school toelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel4
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005946
        artikel: '4'
        hoofdstuk: II
  - number: 6.2.a
    text: |-
      de kandidaat-leerling die tot het eerste leerjaar van een andere school voor mavo of tot het eerste leerjaar van
      een school voor vwo of voor havo is toegelaten;
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel6
  - number: 6.2.b
    text: |-
      de kandidaat-leerling die het eerste leerjaar van een school voor vbo gedeeltelijk heeft doorlopen, indien de
      studieresultaten daartoe naar het oordeel van het bevoegd gezag aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel6
  - number: '6.3'
    text: |-
      In afwijking van [artikel 3][ref1] kan het bevoegd gezag van een school voor vbo tot het eerste leerjaar van die
      school toelaten de kandidaat die tot het eerste leerjaar van enige school is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
  - number: '8'
    text: |-
      Onverminderd het bepaalde in de [artikelen 3][ref1] en [7][ref2] wordt een kandidaat-leerling niet toegelaten tot
      een school of profiel, aangewezen op grond van [artikel 24, vijfde lid, van de wet][ref3], dan nadat het bevoegd
      gezag zich ervan heeft vergewist dat dit onderwijs voor hem het meest aangewezen is, gelet op de bijzondere aard en
      doelstelling van het desbetreffende onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0005946/2020-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
      - id: ref2
