  - number: '27'
    text: |-
      1 Onderwijs in de gemengde leerweg als bedoeld in [artikel 72, derde lid, onderdeel e, van de wet][ref1]
      kan worden gegeven aan een school voor vbo of aan een agrarisch opleidingscentrum voor zover het betreft het
      voorbereidend beroepsonderwijs, indien het bevoegd gezag met het bevoegd gezag van een school voor mavo een
      samenwerkingsovereenkomst heeft gesloten met betrekking tot de uitwisseling van expertise, de leerlingbegeleiding
      en de examinering.

      2 Het vorige lid is van overeenkomstige toepassing op onderwijs in de gemengde leerweg als bedoeld in
      [artikel 72, derde lid, onderdeel e, van de wet][ref2] dat wordt gegeven aan een school voor mavo.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '72'
  - number: '28'
    text: |-
      Een afdeling als bedoeld in [artikel 10c, onderdeel d, van de wet][ref1] kan op grond van
      [artikel 72, derde lid, onderdeel f, van de wet][ref2] worden toegevoegd aan een school voor vbo indien:

      a. het bevoegd gezag van een agrarisch opleidingscentrum deelneemt aan de desbetreffende regionale samenwerking, of

      b. het bevoegd gezag van het agrarisch opleidingscentrum waarvan een vestiging het dichtst gelegen is bij de
      vestiging waar het onderwijs in de afdeling landbouw en natuurlijke omgeving zal worden verzorgd, heeft verklaard
      daarmee in te stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel28
