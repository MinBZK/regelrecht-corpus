      1 In het derde leerjaar van een school voor mavo volgt de leerling in de theoretische leerweg onderwijs in ten
      minste zeven vakken waarin eindexamen kan worden afgelegd, niet behorend tot het gemeenschappelijk deel.

      2 Indien de leerling onderwijs in een derde moderne vreemde taal volgt of heeft gevolgd in enig voorafgaand
      leerjaar, is in afwijking van het eerste lid het aantal vakken, bedoeld in dat lid, zes.
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel26g
  - number: 26h
    text: |-
      1 De afdelingsvakken, bedoeld in [artikel 10b, zevende lid, onderdeel a, van de wet][ref1], zijn bouwtechniek,
      metaaltechniek, elektrotechniek, voertuigentechniek, installatietechniek, grafimedia, transport en logistiek,
      verzorging, uiterlijke verzorging, administratie, handel en verkoop, mode en commercie, consumptief, en landbouw en
      natuurlijke omgeving.

      2 Het extra vak bedoeld in [artikel 10b, negende lid, onderdeel d, van de wet][ref2], is Friese taal en cultuur.


