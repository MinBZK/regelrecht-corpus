  - number: '7'
    text: |-
      Tot een school voor praktijkonderwijs kan als leerling worden toegelaten degene die de leeftijd van ten minste 12
      jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel7
  - number: '8'
    text: |-
      Onverminderd het bepaalde in de [artikelen 3][ref1] en [7][ref2] wordt een kandidaat-leerling niet toegelaten tot
      een school of afdeling, aangewezen op grond van [artikel 24, vijfde lid, van de wet][ref3], dan nadat het bevoegd
      gezag zich ervan heeft vergewist dat dit onderwijs voor hem het meest aangewezen is, gelet op de bijzondere aard en
      doelstelling van het desbetreffende onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
