  - number: 26j
    text: |-
      1 Het bevoegd gezag van een school voor vbo, een scholengemeenschap waarvan ten minste een school voor vbo
      deel uitmaakt of een agrarisch opleidingscentrum kan een bij ministeriële regeling aangewezen intrasectoraal
      of intersectoraal programma verzorgen voor zover dat bevoegd gezag gerechtigd is onderwijs te verzorgen in de
      afdelingen onderliggend aan het bijbehorende intrasectorale of intersectorale programma en overigens wordt voldaan
      aan het tweede tot en met vierde lid. Bij ministeriële regeling worden de afdelingen, bedoeld in de vorige volzin,
      aangewezen.

      2 Een intrasectoraal of intersectoraal programma als bedoeld in het eerste lid wordt niet verzorgd voordat

      a. het bevoegd gezag van het meest nabij gelegen regionaal opleidingencentrum en agrarisch opleidingscentrum heeft
      verklaard dat het programma in voldoende mate aansluit op het onderwijs dat door de desbetreffende instelling wordt
      verzorgd, en

      b. uit overleg met werkgevers die werkzaam zijn op de regionale arbeidsmarkt is gebleken dat er voor leerlingen die
      het programma zullen volgen naar verwachting voldoende stageplaatsen beschikbaar zullen zijn.

      3 Indien het de gemengde leerweg betreft, kan het bevoegd gezag op iedere vestiging waar afsluitend onderwijs
      vbo of mavo kan worden verzorgd, een intrasectoraal of intersectoraal programma als bedoeld in het eerste lid
      verzorgen.

      4 Indien het de basisberoepsgerichte leerweg en de kaderberoepsgerichte leerweg betreft kan het bevoegd gezag
      alleen op de vestigingen waar het onderwijs in de in het eerste lid bedoelde afdelingen daadwerkelijk wordt
      verzorgd, het bijbehorende intrasectorale of intersectorale programma, bedoeld in het eerste lid, verzorgen.
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel26j
  - number: 26k
    text: |-
      1 Het bevoegd gezag van een school voor vbo, een scholengemeenschap waarvan ten minste een school voor
      vbo deel uitmaakt of een agrarisch opleidingscentrum kan het intersectorale programma «intersectoraal
      groen» verzorgen, indien dit is opgenomen in een regionaal plan onderwijsvoorzieningen als bedoeld in
      [artikel 72, tweede lid, van de wet][ref1] en overigens wordt voldaan aan het tweede tot en met vierde lid.

      2 Het bevoegd gezag, bedoeld in het eerste lid, kan het intersectorale programma «intersectoraal groen» verzorgen
      indien het gerechtigd is onderwijs te verzorgen in de afdelingen onderliggend aan het programma, dan wel in
      één van deze afdelingen. In het laatste geval kan het bevoegd gezag het programma slechts verzorgen indien het
      een samenwerkingsovereenkomst heeft gesloten met het bevoegd gezag van een school voor vbo of van een agrarisch
      opleidingscentrum dat gerechtigd is onderwijs te verzorgen in de ontbrekende afdeling. Bij ministeriële regeling
      worden de afdelingen, bedoeld in de eerste volzin, per uitstroomdifferentiatie van het programma aangewezen.

      3 De samenwerkingsovereenkomst, bedoeld in het tweede lid, heeft in elk geval betrekking op de uitwisseling van
      expertise, de leerlingbegeleiding, de examinering en de vestiging of vestigingen waar het programma zal worden
      verzorgd.

      4 [Artikel 26j, tweede en derde lid][ref2], is van overeenkomstige toepassing op het intersectorale programma
      «intersectoraal groen». In afwijking van [artikel 26j, vierde lid][ref3], kan het intersectorale programma
      «intersectoraal groen» verzorgd worden op iedere vestiging waar afsluitend onderwijs vbo in ten minste één van de
      onderliggende afdelingenkan worden verzorgd, indien het de basisberoepsgerichte leerweg en de kaderberoepsgerichte
      leerweg betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
