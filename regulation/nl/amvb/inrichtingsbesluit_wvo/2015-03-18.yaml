      1 Het gemeenschappelijk deel van elk profiel in het atheneum omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:

      a. Nederlandse taal en literatuur: 480,

      b. Engelse taal en literatuur: 400,

      c. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, of Friese taal en cultuur
      ter keuze van de leerling, voor zover het bevoegd gezag deze vakken aanbiedt: 480,

      d. maatschappijleer: 120,

      e. algemene natuurwetenschappen: 120,

      e. culturele en kunstzinnige vorming: 160, en

      f.

      g. lichamelijke opvoeding : 160.

      2 Het gemeenschappelijk deel van elk profiel in het gymnasium omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:

      a. Nederlandse taal en literatuur: 480,

      b. Engelse taal en literatuur: 400,

      c. Latijnse taal en cultuur of Griekse taal en cultuur: 760,

      d. maatschappijleer: 120,

      e. algemene natuurwetenschappen: 120,

      f.

      g. lichamelijke opvoeding : 160.

      3 Het profieldeel van het profiel natuur en techniek in het gymnasium en atheneum omvat de volgende vakken, met de
      daarbij vermelde normatieve studielast, uitgedrukt in uren:

      a. wiskunde B: 600,

      b. natuurkunde: 480,

      c. scheikunde: 440, en

      d. een van de volgende profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken
      aanbiedt:

      1°. natuur, leven en technologie: 440;

      2°. informatica: 440;

      3°. biologie: 480;

      4°. wiskunde D: 440.

      4 Het profieldeel van het profiel natuur en gezondheid in het gymnasium en atheneum omvat de volgende vakken, met
      de daarbij vermelde normatieve studielast, uitgedrukt in uren:

      a. wiskunde A: 520, met dien verstande dat de leerling het vak wiskunde A kan vervangen door wiskunde B, voor zover
      het bevoegd gezag dit vak als onderdeel van dit profiel aanbiedt,

      b. biologie: 480,

      c. scheikunde: 440, en

      d. een van de volgende profielkeuzevakken ter keuze van de leerling, voor zover het bevoegd gezag deze vakken
      aanbiedt:

      1°. natuur, leven en technologie: 440;

      2°. aardrijkskunde: 440;

      3°. natuurkunde: 480.

      5 Het profieldeel van het profiel economie en maatschappij in het gymnasium en atheneum omvat de volgende vakken,
      met de daarbij vermelde normatieve studielast, uitgedrukt in uren:

      a. wiskunde A: 520, met dien verstande dat de leerling het vak wiskunde A kan vervangen door wiskunde B, voor zover
      het bevoegd gezag dit vak als onderdeel van dit profiel aanbiedt,

      b. economie: 480,

      c. geschiedenis: 440, en

      d. een van de volgende profielkeuzevakken ter keuze van de leerling, voor zover het bevoegd gezag deze vakken
      aanbiedt:

      1°. management en organisatie: 440;

      2°. aardrijkskunde: 440;

      3°. maatschappijwetenschappen: 440;

      4°. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur of Friese taal en cultuur:
      480.

      6 Het profieldeel van het profiel cultuur en maatschappij in het gymnasium en atheneum omvat de volgende vakken,
      met de daarbij vermelde normatieve studielast, uitgedrukt in uren:

      a. wiskunde C: 480, met dien verstande dat de leerling het vak wiskunde C kan vervangen door wiskunde A of wiskunde
      B, voor zover het bevoegd gezag deze vakken als onderdeel van dit profiel aanbiedt,

      b. geschiedenis: 480,

      c. een van de volgende culturele profielkeuzevakken ter keuze van de leerling, voor zover het bevoegd gezag deze
      vakken aanbiedt:

      1°. kunst (beeldende vormgeving), kunst (muziek), kunst (drama), kunst (dans), muziek, tekenen, handvaardigheid of
      textiele vormgeving: 480;

      2°. filosofie: 480;

      3°. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, Friese taal en cultuur
      met een normatieve studielast van 480 uren, Latijnse taal en cultuur of Griekse taal en cultuur met een normatieve
      studielast van 760 uren,

      d. een van de volgende maatschappelijke profielkeuzevakken ter keuze van de leerling, voor zover het bevoegd gezag
      deze vakken aanbiedt:

      1°. aardrijkskunde: 440;

      2°. maatschappijwetenschappen: 440;

      3°. economie: 480.

      7 Het vrije deel van elk profiel in het gymnasium en atheneum kan omvatten:

      a. de vakken, genoemd in het eerste tot en met het zesde lid, voor zover nog niet gekozen, met dien verstande dat:

      1°. van de vakken wiskunde A, wiskunde B en wiskunde C er slechts één deel kan uitmaken van het profiel, dat
      wiskunde D uitsluitend kan worden gekozen indien ook wiskunde B deel uitmaakt van het profiel, en

      2°. kunst (beeldende vormgeving) niet gekozen kan worden in combinatie met tekenen, handvaardigheid of textiele
      vormgeving, dat kunst (muziek) niet gekozen kan worden in combinatie met muziek, en

      3°. van de vakken tekenen, handvaardigheid en textiele vormgeving er slechts één deel kan uitmaken van het profiel,

      b. de volgende vakken, met de daarbij vermelde normatieve studielast, uitgedrukt in uren, met dien verstande dat
      deze vakken slechts deel kunnen uitmaken van het vrije deel voor zover de desbetreffende taal niet reeds eerder is
      gevolgd of al deel uitmaakt van het profiel:

      1°. Spaanse taal en literatuur (elementair): 480,

      2°. Russische taal en literatuur (elementair): 480,

      3°. Italiaanse taal en literatuur (elementair): 480,

      4°. Arabische taal en literatuur (elementair): 480, en

      5°. Turkse taal en literatuur (elementair): 480,

      c. de volgende vakken, met de daarbij vermelde normatieve studielast in uren:

      1°. kunst (algemeen): 200,

      2°. bewegen, sport en maatschappij: 440, en

      d. door het bevoegd gezag vast te stellen vakken en andere programma-onderdelen.
