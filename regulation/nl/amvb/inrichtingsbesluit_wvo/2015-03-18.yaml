  - number: '5'
    text: |-
      1 Het bevoegd gezag doet mededeling aan de inspectie van de te volgen procedure voor de toelating tot het
      eerste leerjaar. Het zendt jaarlijks binnen 6 maanden na de toelating een verslag betreffende de toegepaste
      toelatingsmiddelen en van de daarmee opgedane ervaringen aan de inspectie.

      2 Het bevoegd gezag stelt de directeur van de basisschool, de speciale school voor basisonderwijs, de school
      voor speciaal onderwijs, de school voor voortgezet speciaal onderwijs of de school of instelling voor speciaal
      en voortgezet speciaal onderwijs in kennis van de beslissing omtrent de toelating en, na afloop van het eerste
      leerjaar, indien de directeur dit verzoekt, van de studieresultaten van de leerling.
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel5
  - number: '6'
    text: |-
      1 In afwijking van [artikel 3][ref1] of [artikel 4][ref2] kan het bevoegd gezag van een school voor vwo of voor
      havo tot het eerste leerjaar van die school toelaten:

      a. de kandidaat-leerling die tot het eerste leerjaar van een andere school voor vwo of voor havo is toegelaten;

      b. de kandidaat-leerling die het eerste leerjaar van een school voor mavo gedeeltelijk heeft doorlopen, indien de
      studieresultaten daartoe naar het oordeel van het bevoegd gezag aanleiding geven.

      2 In afwijking van [artikel 3][ref3] of [artikel 4][ref4] kan het bevoegd gezag van een school voor mavo tot het
      eerste leerjaar van die school toelaten:

      a. de kandidaat-leerling die tot het eerste leerjaar van een andere school voor mavo of tot het eerste leerjaar van
      een school voor vwo of voor havo is toegelaten;

      b. de kandidaat-leerling die het eerste leerjaar van een school voor vbo gedeeltelijk heeft doorlopen, indien de
      studieresultaten daartoe naar het oordeel van het bevoegd gezag aanleiding geven.

      3 In afwijking van [artikel 3][ref5] kan het bevoegd gezag van een school voor vbo tot het eerste leerjaar van die
      school toelaten de kandidaat die tot het eerste leerjaar van enige school is toegelaten.


