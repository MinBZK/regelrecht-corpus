preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen van 29 december 1992, nr. 92096883/3180A,
    directie Wetgeving en Juridische Zaken, mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op de artikelen 10a, vijfde lid, 11e, tweede lid, 12a, tweede lid, 22, 23, 27, eerste lid, 28a, derde lid, en
    69, derde lid, van de Wet op het voortgezet onderwijs;

    Gezien het advies van de Onderwijsraad van 30 juni 1992, nr. OR 92000096/S;

    De Raad van State gehoord (advies van 3 maart 1993, nr. W05.92.0663);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen van 2 april 1993, nr.
    93019728/3180A, directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *agrarisch opleidingscentrum:* een agrarisch opleidingscentrum als bedoeld in
      [artikel 1.3.3 van de Wet educatie en beroepsonderwijs][ref1];
        - *basisberoepsgerichte leerweg:* de basisberoepsgerichte leerweg, genoemd in [artikel 10b van de wet][ref2];
        - *bevoegd gezag:* het bevoegd gezag, bedoeld in [artikel 1 van de wet][ref3];
        - *gemeenschappelijk deel:* het in [artikel 12, vierde lid, onderdeel a, van de wet][ref4] bedoelde onderdeel van
      het profiel;
        - *gemengde leerweg:* de gemengde leerweg, genoemd in [artikel 10d van de wet][ref5];
        - *havo:* hoger algemeen voortgezet onderwijs, als bedoeld in [artikel 8 van de wet][ref6];
        - *intersectoraal programma:* een intersectoraal programma als bedoeld in
      [artikel 10b, vierde lid, onderdeel c][ref7], en [artikel 10d, vierde lid, onderdeel c, van de wet][ref8];
        - *inspectie:* de inspectie, als bedoeld in [artikel 1 van de Wet op het onderwijstoezicht][ref9];
        - *intrasectoraal programma:* een intrasectoraal programma als bedoeld in
      [artikel 10b, vierde lid, onderdeel c][ref10], en [artikel 10d, vierde lid, onderdeel c, van de wet][ref11];
        - *kaderberoepsgerichte leerweg:* de kaderberoepsgerichte leerweg, genoemd in [artikel 10b van de wet][ref12];
        - *maatschappelijke stage:* maatschappelijke stage als bedoeld in [artikel 6f van de wet][ref13];
        - *mavo:* middelbaar algemeen voortgezet onderwijs, als bedoeld in [artikel 9 van de wet][ref14];
        - *normatieve studielast:* de normatieve studielast, bedoeld in [artikel 12, vijfde lid, van de wet][ref15];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap, en voor wat betreft het onderwijs op het
      gebied van landbouw, natuurlijke omgeving en voedsel, Onze Minister van Economische Zaken;
        - *praktijkonderwijs:* het praktijkonderwijs, bedoeld in [artikel 10f van de wet][ref16];
        - *profiel:* het profiel, bedoeld in [artikel 12, tweede lid, van de wet][ref17];
        - *profieldeel:* het in [artikel 12, vierde lid, onderdeel b, van de wet][ref18] bedoelde onderdeel van het
      profiel;
        - *regionaal opleidingscentrum:* een regionaal opleidingscentrum als bedoeld in
      [artikel 1.3.1. van de Wet educatie en beroepsonderwijs][ref19];
        - *school:* een school voor vwo, een school voor havo, een school voor mavo, een school voor vbo of een school
      voor praktijkonderwijs;
        - *stage:* de stage, bedoeld in [artikel 22, derde lid, onderdeel d, van de wet][ref20];
        - *stagebegeleider:* degene die is belast met de begeleiding van de leerling en werkzaam is bij de stagegever;
        - *stagebieder:* de rechtspersoon of natuurlijke persoon bij wie de maatschappelijke stage wordt doorlopen;
        - *stagegever:* de rechtspersoon of de natuurlijke persoon bij wie de stage wordt doorlopen;
        - *stageleraar:* de leraar van de school waarop de leerling is ingeschreven, belast met het toezicht op de leerling
      tijdens het verloop van de stage;
        - *theoretische leerweg:* de theoretische leerweg, genoemd in [artikel 10 van de wet][ref21];
        - *vakken behorende tot de beeldende vorming:* tekenen, handvaardigheid, textiele vormgeving, fotografie, film,
      audio-visuele vorming;
        - *vbo:* voorbereidend beroepsonderwijs, als bedoeld in [artikel 10a van de wet][ref22];
        - *vmbo:* voorbereidend middelbaar beroepsonderwijs, als bedoeld in [artikel 21 van de wet][ref23];
        - *vwo:* voorbereidend wetenschappelijk onderwijs, als bedoeld in [artikel 7 van de wet][ref24];
        - *vrij deel:* het in [artikel 12, vierde lid, onderdeel c, van de wet][ref25] bedoelde onderdeel van het profiel;
        - *wet:* [Wet op het voortgezet onderwijs][ref26].


