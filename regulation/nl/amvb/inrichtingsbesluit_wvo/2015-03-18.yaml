  - number: 26n
    text: |-
      1 Het bevoegd gezag van een school voor mavo of vbo kan een leerling, na overleg met de leerling en, indien de
      leerling minderjarig is, met diens ouders, voogden of verzorgers, ontheffing verlenen van het volgen van het
      onderwijs in lichamelijke opvoeding, indien de leerling vanwege diens lichamelijke gesteldheid niet in staat is dit
      onderwijs te volgen. Het bevoegd gezag geeft de inspectie kennis van de verleende ontheffing en vermeldt daarbij de
      gronden waarop deze ontheffing berust.

      2 Het bevoegd gezag kan toestaan dat een ontheffing, verleend voor de eerste twee leerjaren van het volgen van een
      tweede moderne vreemde taal, tevens geldt als ontheffing voor die taal voor de periode waarin de leerling onderwijs
      in de kaderberoepsgerichte, theoretische of gemengde leerweg volgt, met dien verstande dat Arabische taal, Turkse
      taal, Spaanse taal, maatschappijleer II, geschiedenis en staatsinrichting, of aardrijkskunde in de plaats komt van
      het onderwijs in de taal waarvoor de vrijstelling is verleend. Deze toestemming kan slechts worden verleend ten
      behoeve van leerlingen die:

      a. op grond van [artikel 22, eerste lid][ref1], beschikken over een ontheffing en deze ontheffing wordt voortgezet,

      b. in de periode van de eerste twee leerjaren onderwijs in de Arabische taal, de Turkse taal, of Spaanse taal
      volgden, of

      c. onderwijs gaan volgen in de basisberoepsgerichte leerweg en die in het schooljaar voorafgaand aan het betrokken
      schooljaar leerwegondersteunend onderwijs volgden.

      3 Dit artikel geldt tevens voor leerlingen die in een hoger leerjaar voor de eerste maal in Nederland tot een
      school zijn toegelaten.

      4 De leerling van een school voor vmbo, voor zover het betreft de theoretische leerweg, die in het bezit is van
      het diploma vmbo in de kaderberoepsgerichte leerweg of de basisberoepsgerichte leerweg en die in plaats van de
      vakken, als bedoeld in [artikel 10b van de wet][ref2], of als extra vak examen heeft afgelegd in één of meer vakken
      van [artikel 10 van de wet][ref3] of [artikel 26c][ref4] dan wel [26b][ref5], is vrijgesteld van het volgen van
      onderwijs in dit vak respectievelijk deze vakken.

      5 De leerling van een school voor vmbo, voor zover het betreft de basisberoepsgerichte leerweg, die in het bezit is
      van een diploma vmbo in een andere leerweg, en die in plaats van de vakken, bedoeld in [artikel 10b][ref6], of als
      extra vak, examen heeft afgelegd in één of meer vakken van [artikel 10 van de wet][ref7], [artikel 26b][ref8] of
      [artikel 26c][ref9], is vrijgesteld van het volgen van onderwijs in dit vak respectievelijk deze vakken.

      6 De leerling van een school voor vmbo, voor zover het betreft de kaderberoepsgerichte leerweg, die in het bezit is
      van een diploma vmbo in de basisberoepsgerichte leerweg, de theoretische leerweg of de gemengde leerweg, en die in
      plaats van de vakken, bedoeld in [artikel 10b van de wet][ref10], of als extra vak, examen heeft afgelegd in één
      of meer vakken van artikel 10b van de wet, [artikel 26b][ref11] dan wel [artikel 26c][ref12], is vrijgesteld van
      het volgen van onderwijs in dit vak respectievelijk deze vakken.

      7 De leerling van een school voor vmbo, voor zover het betreft de gemengde leerweg, die in het bezit is
      van een diploma vmbo en die in plaats van de vakken, bedoeld in [artikel 10d][ref13], of als extra vak,
      examen heeft afgelegd in één of meer vakken van [artikel 10][ref14] of [artikel 10b van de wet][ref15], of
      [artikel 26b][ref16] dan wel [artikel 26c][ref17], is vrijgesteld van het volgen van onderwijs in dit vak,
      respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
