      1 Het aantal dagen dat per schooljaar ten hoogste voor vakanties op grond van
      [artikel 22, tweede lid, tweede volzin, van de wet][ref1], mag worden besteed, bedraagt 66 bij een zesdaagse
      schoolweek en 55 bij een vijfdaagse schoolweek.

      2 Onder dagen in het eerste lid wordt verstaan elke dag van de week met uitzondering van de zondag bij een
      zesdaagse schoolweek en met uitzondering van de zaterdag en de zondag bij een vijfdaagse schoolweek. Op die
      zondagen respectievelijk zaterdagen en zondagen wordt geen onderwijs verzorgd.

      3 Tenzij vallend binnen een op grond van [artikel 22, tweede lid, tweede volzin, van de wet][ref2] vastgestelde
      vakantie, worden de volgende dagen, waarop eveneens geen onderwijs wordt verzorgd, niet meegeteld bij het aantal
      dagen, bedoeld in het eerste lid:

      a. nieuwjaarsdag, tweede paasdag, Hemelvaartsdag, tweede pinksterdag en de beide kerstdagen, alsmede

      b. Koningsdag en Bevrijdingsdag.

      4 Indien aan een bijzondere school onderwijs wordt gegeven gebaseerd op een levensbeschouwing volgens
      welke andere dan de in het derde lid, onderdeel a, genoemde dagen als feestdagen worden aangemerkt, kan
      in plaats van op de dagen, bedoeld in het derde lid, onderdeel a, die vallen buiten een op grond van
      [artikel 22, tweede lid, tweede volzin, van de wet][ref3] vastgestelde vakantie, geen onderwijs worden
      verzorgd op andere dagen. Bij toepassing van de eerste volzin worden laatstgenoemde dagen niet meegeteld
      bij het aantal dagen, bedoeld in het eerste lid. De eerste volzin kan per schooljaar worden toegepast
      voor ten hoogste het aantal dagen als bedoeld in het derde lid, onderdeel a, dat buiten een op grond van
      [artikel 22, tweede lid, tweede volzin, van de wet][ref4] vastgestelde vakantie valt.

      5 Indien na aftrek van het aantal dagen dat wordt besteed voor vakanties op grond van
      [artikel 22, tweede lid, tweede volzin, van de wet][ref5], dagen resteren van de in het eerste lid bedoelde
      aantallen, kan het bevoegd gezag voor het betreffende schooljaar een of meer vakanties vaststellen waarvoor ten
      hoogste dat resterend aantal dagen mag worden besteed.


