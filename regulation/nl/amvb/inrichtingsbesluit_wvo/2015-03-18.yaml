      1 Het onderwijsprogramma in de eerste twee leerjaren aan een school voor mavo en een school voor vbo omvat
      tevens onderwijs in Franse taal of Duitse taal. Deze verplichting geldt niet voor leerlingen voor wie
      naar de verwachting van het bevoegd gezag het onderwijs in de basisberoepsgerichte leerweg als bedoeld in
      [artikel 10b, eerste lid, van de wet][ref1] het meest geschikt is.

      2 Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen van het
      volgen van onderwijs in Franse taal of Duitse taal:

      a. indien de leerling onderwijs volgt in Spaanse taal, Arabische taal of Turkse taal, of

      b. indien de leerling

      1°. voor de eerste maal tot een school voor mavo of een school voor vbo is toegelaten,

      2°. is geplaatst in een hoger leerjaar dan het eerste,

      3°. voordien buiten Nederland vergelijkbaar onderwijs heeft gevolgd, en

      4°. daarbij geen of te weinig onderwijs in de desbetreffende taal of talen heeft gevolgd.

      3 De leerling die op basis van het eerste lid, geen onderwijs volgt in de Franse taal of Duitse taal, volgt in
      de sector economie van de basisberoepsgerichte leerweg in plaats hiervan, naar keuze van de leerling, het vak
      Arabische taal, Turkse taal, Spaanse taal, maatschappijleer II, geschiedenis en staatsinrichting of aardrijkskunde.


