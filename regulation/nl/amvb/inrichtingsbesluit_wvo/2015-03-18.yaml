      1 Het onderwijsprogramma in de eerste drie leerjaren aan een school voor vwo en een school voor havo omvat tevens
      onderwijs in Franse taal en Duitse taal.

      2 Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen van het
      volgen van onderwijs in Franse taal of Duitse taal, indien de leerling onderwijs volgt in Spaanse taal, Russische
      taal, Italiaanse taal, Arabische taal of Turkse taal.

      3 Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen van het
      volgen van onderwijs in Franse taal of Duitse taal dan wel in beide talen, indien de leerling

      a. voor de eerste maal tot een school voor havo of een school voor vwo is toegelaten,

      b. is geplaatst in een hoger leerjaar dan het eerste,

      c. voordien buiten Nederland vergelijkbaar onderwijs heeft gevolgd, en

      d. daarbij geen of te weinig onderwijs in de desbetreffende taal of talen heeft gevolgd.

      4 In de eerste drie leerjaren van een gymnasium wordt tevens onderwijs verzorgd in Latijnse taal en cultuur en
      Griekse taal en cultuur.
