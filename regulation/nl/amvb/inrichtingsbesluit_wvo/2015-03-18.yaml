  - number: 15a
    text: |-
      De deskundigen, bedoeld in [artikel 17a, twaalfde lid, van de wet][ref1] zijn een orthopedagoog of een psycholoog
      en afhankelijk van de leerling over wiens toelaatbaarheid wordt geadviseerd ten minste een tweede deskundige, te
      weten een kinder- of jeugdpsycholoog, een pedagoog, een kinderpsychiater, een maatschappelijk werker of een arts.


