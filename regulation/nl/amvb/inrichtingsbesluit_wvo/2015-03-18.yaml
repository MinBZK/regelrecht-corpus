  - number: 26e
    text: |-
      1 Het bevoegd gezag van een school voor vwo of havo kan een leerling ontheffing verlenen van het volgen van het
      onderwijs in het vak lichamelijke opvoeding indien de leerling vanwege diens lichamelijke gesteldheid niet in staat
      is dit onderwijs te volgen. Het bevoegd gezag geeft de inspectie kennis van de verleende ontheffing en vermeldt
      daarbij de gronden waarop deze ontheffing berust.

      2 De leerling van een school voor vwo die in het bezit is van het diploma havo is vrijgesteld van het volgen van
      de maatschappelijke stage alsmede van onderwijs in de volgende vakken van het gemeenschappelijk deel: algemene
      natuurwetenschappen en maatschappijleer. Indien het betreft het atheneum is deze leerling tevens vrijgesteld van
      het volgen van onderwijs in het vak culturele en kunstzinnige vorming.

      3 De leerling van een school voor vwo die in het bezit is van het diploma havo of het diploma vmbo en die in
      plaats van de vakken, genoemd in [artikel 26c][ref1], respectievelijk [artikel 10][ref2], [artikel 10b][ref3]
      of [artikel 10d van de wet][ref4], of als extra vak examen heeft afgelegd in één of meer vakken van
      [artikel 26b][ref5], is vrijgesteld van het volgen van onderwijs in dit vak respectievelijk deze vakken.

      4 Het bevoegd gezag van een atheneum kan een leerling ontheffing verlenen van het volgen van onderwijs in de taal
      genoemd in [artikel 26b, eerste lid, onder c][ref6], in de volgende gevallen:

      a. de leerling heeft een stoornis die specifiek betrekking heeft op taal of een zintuiglijke stoornis die effect
      heeft op taal;

      b. de leerling heeft een andere moedertaal dan de Nederlandse taal of de Friese taal;

      c. de leerling volgt onderwijs in het profiel natuur en techniek of het profiel natuur en gezondheid en het
      onderwijs in de taal verhindert naar verwachting een succesvolle afronding van de opleiding.

      5 Bij toepassing van het vierde lid, wordt de taal vervangen door een van de vakken of programma-onderdelen,
      genoemd in [artikel 26b, derde tot en met zesde lid, of in het zevende lid, onder c of d][ref7], met een normatieve
      studielast van tenminste 440 uren, ter keuze van de leerling, voor zover het bevoegd gezag deze als zodanig
      aanbiedt.

      6 De leerling van een school voor havo die in het bezit is van het diploma vmbo en die in plaats van de vakken,
      genoemd in [artikel 10][ref8], [artikel 10b][ref9] of [artikel 10d van de wet][ref10], of als extra vak examen
      heeft afgelegd in één of meer vakken van [artikel 26c][ref11] of [26b][ref12], is vrijgesteld van het volgen van
      onderwijs in dit vak respectievelijk deze vakken.


