        artikel: '72'
  - number: 30a
    text: |-
      1 De stage-overeenkomst voor de maatschappelijke stage bevat in elk geval:

      a. de leerdoelen;

      b. de activiteiten die de leerling moet ontplooien om de leerdoelen te bereiken;

      c. de aanvangsdatum, de einddatum en de tijden van de onder b bedoelde activiteiten;

      d. een regeling voor de begeleiding van de leerling bij de stagebieder.

      2 De stage-overeenkomst bepaalt voorts wie de verzekering tegen het financiële risico van ongevallen en tegen
      wettelijke aansprakelijkheid van de leerling voor de tijd dat deze zich bevindt bij de stagebieder zal sluiten en
      ten laste van wie de te betalen premie zal komen, indien een zodanige verzekering wordt gesloten.

      3 Indien er geen externe stagebieder is aan te wijzen, dan wordt de stage-overeenkomst gesloten tussen het bevoegd
      gezag en de leerling.

      4 In geval van minderjarigheid van de leerling wordt de stage-overeenkomst mede door diens ouders, voogden of
      verzorgers ondertekend.
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel30a
  - number: '31'
    text: |-
      1 Deze paragraaf is van toepassing op scholen voor mavo voor zover daaraan onderwijs in de gemengde leerweg wordt
      verzorgd, en op scholen voor vbo.

      2 Deze paragraaf is van overeenkomstige toepassing op arbeidstraining. Onder arbeidstraining wordt verstaan het
      onderricht in de praktijk van de uitoefening van een vak of beroep aan scholen voor praktijkonderwijs, bedoeld
      in [artikel 10f, vijfde lid, van de wet][ref1], voor zover dat onderricht plaatsvindt buiten de school voor
      praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
  - number: '32'
    text: |-
      1 In het derde en vierde leerjaar kunnen de lessen in afdelingsvakken of intrasectorale of intersectorale
      programma’s worden besteed aan stage.

      2 Voor een school voor praktijkonderwijs bedraagt het in [artikel 10f, vijfde lid, van de wet][ref1] bedoelde
      aantal uren stage of arbeidstraining gedurende de cursusduur gemiddeld ten hoogste 50% van het aantal uren waarin
      onderwijs wordt verzorgd, met dien verstande dat voor leerlingen voor wie de partiële leerplicht nog niet is
      geëindigd, tot het einde van die leerplicht de stage of arbeidstraining per schoolweek ten hoogste 80% bedraagt van
      het aantal uren waarin in die week onderwijs wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
  - number: '33'
    text: Het doel, de inhoud, de omvang, de opbouw en de organisatie van de stage worden beschreven in een stageplan.
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel33
  - number: '34'
    text: Een stage wordt doorlopen op een of meer stageplaatsen, ter beschikking gesteld door een of meer stagegevers.
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel34
  - number: '35'
    text: |-
      1 Het bevoegd gezag sluit met de leerling en de stagegever te zamen een schriftelijke stage-overeenkomst waaruit
      blijkt dat de leerling leeractiviteiten ontplooit in het kader van het stageplan.

      2 De stage-overeenkomst bevat in elk geval:

      a. de leeractiviteiten die de leerling bij de aangewezen stagegever op een of meer bepaalde stageplaatsen moet
      ontplooien;

      b. de aanvangsdatum, de einddatum en de tijden van [de onder ][ref1] bedoelde leeractiviteiten;

      c. een regeling voor de begeleiding van de leerling bij de stagegever waarin in elk geval duidelijk wordt gemaakt
      welk aandeel in de begeleiding door de stageleraar respectievelijk door de stagebegeleider, aan te wijzen door of
      namens het bevoegd gezag onderscheidenlijk de stagegever, wordt verzorgd;

      d. de wijze waarop de stagegever bij de beoordeling van de leeractiviteiten van de leerling wordt betrokken;

      e. een regeling die de inspectie in staat stelt toezicht te houden op de leeractiviteiten die door de leerling bij
      de stagegever worden ontplooid.

      3 De stage-overeenkomst bepaalt voorts wie de verzekering tegen het financiële risico van ongevallen en tegen
      wettelijke aansprakelijkheid van de leerling voor de tijd dat deze zich bevindt bij de stagegever zal sluiten en
      ten laste van wie de te betalen premie zal komen, indien een zodanige verzekeringsovereenkomst zal worden gesloten.

      4 In geval van minderjarigheid van de leerling wordt de stage-overeenkomst door diens ouders, voogden of verzorgers
      ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel35
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '35'
        hoofdstuk: III
        paragraaf: '6'
  - number: '36'
    text: |-
      Met het oog op de stage kan het bevoegd gezag ten behoeve van de leerlingen een schriftelijke
      samenwerkingsovereenkomst met een of meer stagegevers aangaan waarin mede een of meer onderdelen van de stage-
      overeenkomst, bedoeld in [artikel 35, tweede lid][ref1], worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel35
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '35'
        hoofdstuk: III
        paragraaf: '6'
  - number: '37'
    text: |-
      1 De inspectie hanteert voor zover van toepassing de volgende indicatoren voor de beoordeling van de
      leerresultaten:

      a. het rendement van de eerste twee leerjaren;

      b. het rendement van de overige leerjaren;

      c. het gemiddelde cijfer van het centraal examen;

      d. het gemiddelde verschil tussen het cijfer van het centraal examen en het cijfer van het schoolexamen.

      2 De indicatoren worden onderscheiden naar de in [artikel 23a1, eerste lid, van de wet][ref1] genoemde
      schoolsoorten en leerwegen.

      3 De in het eerste lid, onder a, genoemde indicator wordt bepaald door het verschil tussen:

      a. het niveau dat de leerling gelet op het onderwijskundig rapport van de directeur van de basisschool, bedoeld in
      [artikel 42 van de Wet op het primair onderwijs][ref2], naar verwachting in het derde leerjaar bereikt, en

      b. het niveau dat de leerling daadwerkelijk in dat leerjaar heeft bereikt.

      4 De in het eerste lid, onder b, genoemde indicator heeft betrekking op de mate waarin leerlingen in de leerjaren
      na het tweede leerjaar zonder vertraging of afstroom het diploma hebben behaald. Daarbij wordt een leerling
      aangemerkt als te zijn bevorderd indien deze aan het eind van het schooljaar is overgegaan naar het volgende
      leerjaar van dezelfde of een hogere opleiding.

      5 De in het eerste lid, onder c, genoemde indicator omvat een naar leerlingaantallen gewogen gemiddeld cijfer over
      alle vakken of een cluster van vakken.

      6 De in het eerste lid, onder d, genoemde indicator omvat het gemiddelde verschil tussen de cijfers van het
      schoolexamen en het centraal examen over een periode van drie jaren.

      7 Bij de bepaling van de leerresultaten, bedoeld in het eerste lid, onder a tot en met c, kan rekening worden
      gehouden met de leerlingen die zijn geïndiceerd voor leerwegondersteunend onderwijs.

      8 Bij de bepaling van de leerresultaten, bedoeld in het eerste lid , onder b of c, kan rekening worden gehouden
      met groepskenmerken en individuele kenmerken van leerlingen, met dien verstande dat in elk geval rekening wordt
      gehouden met de sociaal-economische situatie van de leerlingen.

      9 De scores waarop het oordeel over de in het eerste lid, onder a tot en met c, bedoelde indicatoren wordt
      gebaseerd, kunnen wegens bijzondere omstandigheden worden gecorrigeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel42
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a1
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '42'
  - number: 37a
    text: |-
      Bij ministeriële regeling worden nadere regels gegeven met betrekking tot de berekening van de indicatoren, genoemd
      in [artikel 37, eerste lid][ref1], waaronder begrepen de toe te passen correcties, bedoeld in het zevende en
      achtste lid van dat artikel. Voorts worden bij die regeling regels gegeven met betrekking tot:

      a. de aard en de aantallen gegevens die ten minste nodig zijn voor de toepassing van de indicatoren;

      b. de normering waarop de inspectie het oordeel voldoende dan wel onvoldoende onderwijsresultaat baseert, na
      toepassing van de indicatoren;

      c. de wijze waarop per schoolsoort of leerweg de beoordelingen, gebaseerd op de afzonderlijke indicatoren, leiden
      tot een oordeel over de leerresultaten van die schoolsoort onderscheidenlijk leerweg.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel37
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '37'
        hoofdstuk: IV
  - number: 37b
    text: |-
      1 De indicatoren worden vastgesteld dan wel gewijzigd met inachtneming van de volgende procedure:

      a. gelet op recente ontwikkelingen, een eigen analyse en signalen van organisaties uit het onderwijsveld, beslist
      de inspecteur-generaal van het onderwijs of hij Onze Minister een voorstel doet voor het aanpassen van een
      indicator of voor het vaststellen van een nieuwe indicator;

      b. over het concept-voorstel overlegt de inspecteur-generaal van het onderwijs met de daarvoor in aanmerking
      komende organisaties uit het onderwijsveld;

      c. de inspecteur-generaal van het onderwijs legt het voorstel voor aan Onze Minister, onder vermelding van de
      wijze waarop in het voorstel rekening is gehouden met de reacties van de geraadpleegde organisaties uit het
      onderwijsveld;

      d. Onze Minister besluit naar aanleiding van het voorstel over wijziging van een indicator of vaststelling van
      een nieuwe indicator of een daarvoor noodzakelijk voorstel van wet of ontwerp-algemene maatregel van bestuur wordt
      voorbereid.

      2 De wijze van meting en de aanpassing van de wijze van meting in het kader van toepassing van de indicatoren,
      alsmede de normering en de aanpassing van de normering, worden vastgesteld op voorstel van de inspecteur-generaal
      van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel37b
  - number: 37c
    text: |-
      Indien er geen of onvoldoende gegevens zijn voor een betrouwbaar oordeel over de meting van de leerresultaten,
      verricht de inspectie een aanvullend onderzoek, volgens bij ministeriële regeling te geven voorschriften. Het
      aanvullend onderzoek kan onder meer omvatten:

      a. het verkrijgen van nadere gegevens van de school over de resultaten en de doorstroom van leerlingen;

      b. onderzoek en verificatie ter plekke.
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel37c
  - number: '38'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel38
  - number: '39'
    text: 'Dit besluit wordt aangehaald als: Inrichtingsbesluit WVO.'
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel39
