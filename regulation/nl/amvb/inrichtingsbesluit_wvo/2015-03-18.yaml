      2°. aardrijkskunde: 320;

      3°. natuurkunde: 400.

      4 Het profieldeel van het profiel economie en maatschappij in het havo omvat de volgende vakken, met de daarbij
      vermelde normatieve studielast, uitgedrukt in uren:

      a. wiskunde A: 320, met dien verstande dat de leerling het vak wiskunde A kan vervangen door wiskunde B, voor zover
      het bevoegd gezag dit vak als onderdeel van dit profiel aanbiedt,

      b. economie: 400,

      c. geschiedenis: 320, en

      d. een van de volgende profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken
      aanbiedt:

      1°. management en organisatie: 320;

      2°. aardrijkskunde: 320;

      3°. maatschappijwetenschappen: 320;

      4°. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, of Friese taal en cultuur:
      400.

      5 Het profieldeel van het profiel cultuur en maatschappij in het havo omvat de volgende vakken, met de daarbij
      vermelde normatieve studielast, uitgedrukt in uren:

      a. geschiedenis: 320,

      b. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, of Friese taal en cultuur
      ter keuze van de leerling voor zover het bevoegd gezag deze vakken aanbiedt: 400,

      c. een van de volgende culturele profielkeuzevakken ter keuze van de leerling, voor zover het bevoegd gezag deze
      vakken aanbiedt:

      1°. kunst (beeldende vormgeving), kunst (muziek), kunst (drama), kunst (dans), muziek, tekenen, handvaardigheid of
      textiele vormgeving: 320;

      2°. filosofie: 320;

      3°. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, of Friese taal en cultuur:
      400,

      d. een van de volgende maatschappelijke profielkeuzevakken ter keuze van de leerling, voor zover het bevoegd gezag
      deze vakken aanbiedt:

      1°. aardrijkskunde: 320;

      2°. maatschappijwetenschappen: 320;

      3°. economie: 400.

      6 Het vrije deel van elk profiel in het havo kan omvatten:

      a. de vakken, genoemd in het eerste tot en met het vijfde lid, voor zover nog niet gekozen, met dien verstande dat:

      1°. van de vakken wiskunde A en wiskunde B er slechts één deel kan uitmaken van het profiel, dat wiskunde D
      uitsluitend kan worden gekozen indien ook wiskunde B deel uitmaakt van het profiel, en

      2°. kunst (beeldende vormgeving) niet gekozen kan worden in combinatie met tekenen, handvaardigheid of textiele
      vormgeving, dat kunst (muziek) niet gekozen kan worden in combinatie met muziek, en

      3°. van de vakken tekenen, handvaardigheid en textiele vormgeving er slechts één deel kan uitmaken van het profiel,

      b. de volgende vakken, met de daarbij vermelde normatieve studielast, uitgedrukt in uren, met dien verstande dat
      deze vakken slechts deel kunnen uitmaken van het vrije deel voor zover de desbetreffende taal niet reeds eerder is
      gevolgd of al deel uitmaakt van het profiel:

      1°. Spaanse taal en literatuur (elementair): 320,

      2°. Russische taal en literatuur (elementair): 320,

      3°. Italiaanse taal en literatuur (elementair): 320,

      4°. Arabische taal en literatuur (elementair): 320, en

      5°. Turkse taal en literatuur (elementair): 320,

      c. de volgende vakken, met de daarbij vermelde normatieve studielast in uren:

      1°. kunst (algemeen): 120,

      2°. algemene natuurwetenschappen: 120, en

      3°. bewegen, sport en maatschappij: 320, en

      d. door het bevoegd gezag vast te stellen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0005946/2015-03-18#Artikel26c
  - number: 26d
    text: |-
      Indien het bevoegd gezag bij de vaststelling van vakken en andere programma-onderdelen van het vrije deel andere
      instellingen of deskundige personen van buiten de school betrekt, kan het onderwijs in die vakken en andere
      programma-onderdelen van het vrije deel, onverminderd de verantwoordelijkheid van het bevoegd gezag voor het
      onderwijs aan de school, mede worden verzorgd door die andere instellingen of deskundige personen. Daarbij stelt
      het bevoegd gezag als voorwaarde dat die instellingen of deskundige personen voldoen aan de met betrekking tot hun
      geldende wettelijke voorschriften en voorzover die voorschriften ontbreken, aan de binnen de beroepsgroep algemeen
      erkende normen. [Artikel 33, eerste lid, van de wet][ref1] is ten aanzien van degenen die dit onderwijs verzorgen
      van overeenkomstige toepassing, met dien verstande dat als getuigschrift als bedoeld in onderdeel b. 1° van dat lid
      geldt een kwalificatie die, gelet op de eerste en tweede volzin, passend is. Het bevoegd gezag stelt de inspectie
      in kennis van de kwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
