preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen van 29 december 1992, nr. 92096883/3180A,
    directie Wetgeving en Juridische Zaken, mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op de artikelen 10a, vijfde lid, 11e, tweede lid, 12a, tweede lid, 22, 23, 27, eerste lid, 28a, derde lid, en
    69, derde lid, van de Wet op het voortgezet onderwijs;

    Gezien het advies van de Onderwijsraad van 30 juni 1992, nr. OR 92000096/S;

    De Raad van State gehoord (advies van 3 maart 1993, nr. W05.92.0663);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen van 2 april 1993, nr.
    93019728/3180A, directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      wet: de [Wet op het voortgezet onderwijs][ref1];

      Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen en wat het onderwijs op het gebied van
      landbouw en natuurlijke omgeving betreft, Onze Minister van Landbouw, Natuurbeheer en Visserij;

      inspectie: de inspectie, bedoeld in [artikel 113][ref2] of [114 van de wet][ref3];

      v.w.o.: voorbereidend wetenschappelijk onderwijs;

      h.a.v.o.: hoger algemeen voortgezet onderwijs;

      m.a.v.o.: middelbaar algemeen voortgezet onderwijs;

      v.b.o.: voorbereidend beroepsonderwijs;

      v.m.b.o.: voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 21 van de wet][ref4], verzorgd door een
      in dat artikel bedoelde school of scholengemeenschap;

      school: een school voor v.w.o., een school voor h.a.v.o., een school voor m.a.v.o. , een school voor v.b.o. of een
      school voor praktijkonderwijs;

      profiel: het profiel, bedoeld in [artikel 12, tweede lid, van de wet][ref5];

      gemeenschappelijk deel: het in [artikel 12, vierde lid, onderdeel ][ref6] bedoelde onderdeel van het profiel;

      profieldeel: het in [artikel 12, vierde lid, onderdeel ][ref7] bedoelde onderdeel van het profiel;

      vrij deel: het in [artikel 12, vierde lid, onderdeel ][ref8] bedoelde onderdeel van het profiel;

      normatieve studielast: de normatieve studielast, bedoeld in [artikel 12, vijfde lid, van de wet][ref9];

      theoretische leerweg: de theoretische leerweg, genoemd in [artikel 10 van de wet][ref10];

      basisberoepsgerichte leerweg: de basisberoepsgerichte leerweg, genoemd in [artikel 10b van de wet][ref11];

      kaderberoepsgerichte leerweg: de kaderberoepsgerichte leerweg, genoemd in [artikel 10b van de wet][ref12];

      gemengde leerweg: de gemengde leerweg, genoemd in [artikel 10d van de wet][ref13];

      praktijkonderwijs: het praktijkonderwijs, bedoeld in [artikel 10f van de wet][ref14];

      intrasectoraal programma: een in [artikel 26j][ref15] genoemd intrasectoraal programma;.

      bevoegd gezag: het bevoegd gezag, bedoeld in [artikel 1 van de wet][ref16];

      stage: de stage, bedoeld in [artikel 22, derde lid, onderdeel ][ref17];

      stagegever: de rechtspersoon of de natuurlijke persoon bij wie de stage wordt doorlopen;

      stageleraar: de leraar van de school waarop de leerling is ingeschreven, belast met de begeleiding van de leerling
      tijdens de stage;

      stagebegeleider: degene die is belast met de begeleiding van de leerling en werkzaam is bij de stagegever;

      de vakken behorende tot de beeldende vorming: tekenen, handvaardigheid (handenarbeid), handvaardigheid (textiele
      werkvormen), fotografie, film, audio-visuele vorming;

      kunstvakken: de vakken behorende tot de beeldende vorming, alsmede muziek, dans en drama.


