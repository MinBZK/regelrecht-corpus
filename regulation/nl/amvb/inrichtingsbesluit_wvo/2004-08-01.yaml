  - number: 26m
    text: |-
      Een ingevolge [artikel 10b, negende lid][ref1], dan wel[ artikel 10d, negende lid, van de wet][ref2] verleende
      toestemming tot het verzorgen van een intrasectoraal programma vervalt van rechtswege met ingang van een schooljaar
      indien het desbetreffende intrasectorale programma gedurende de twee daaraan voorafgaande schooljaren door geen
      leerlingen is bezocht. Voor de toepassing van de eerste volzin wordt uitgegaan van het aantal leerlingen op 1
      oktober van elk van de twee in die volzin bedoelde schooljaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel26m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
  - number: 26n
    text: |-
      1 Het bevoegd gezag van een school voor m.a.v.o. of v.b.o. kan een leerling, na overleg met de leerling en, indien
      de leerling minderjarig is, met diens ouders, voogden of verzorgers, vrijstelling verlenen van het volgen van het
      onderwijs in het vak lichamelijke opvoeding, indien de leerling vanwege diens lichamelijke gesteldheid niet in
      staat is dit onderwijs te volgen. Het bevoegd gezag geeft de inspectie kennis van de verleende vrijstelling en
      vermeldt daarbij de gronden waarop deze vrijstelling berust.

      2 Het bevoegd gezag kan goedkeuren dat een vrijstelling die op grond van [artikel 11e van de wet][ref1] voor de
      periode van de basisvorming is verleend voor de tweede moderne vreemde taal, zijnde Franse taal of Duitse taal,
      tevens geldt als vrijstelling voor dat vak voor de periode waarin de leerling onderwijs in de sector economie van
      een van de leerwegen volgt, met dien verstande dat een van de vakken Arabische taal, Turkse taal, Spaanse taal,
      maatschappijleer II, geschiedenis en staatsinrichting, of aardrijkskunde in de plaats komt van het onderwijs in de
      taal waarvoor de vrijstelling is verleend. Deze goedkeuring kan slechts worden verleend ten behoeve van leerlingen
      die:

      a. in de periode van de basisvorming onderwijs in de taal van het land van oorsprong, bedoeld in
      [artikel 16 van de wet][ref2], volgden, of

      b. voor de eerste maal tot een school zijn toegelaten en daarbij zijn geplaatst in een hoger leerjaar dan het
      eerste en voordien buiten Nederland vergelijkbaar onderwijs hebben gevolgd en daarbij geen of te weinig onderwijs
      in het desbetreffende vak hebben genoten, of

      c. onderwijs gaan volgen in de basisberoepsgerichte leerweg en die in het schooljaar voorafgaand aan het betrokken
      schooljaar leerwegondersteunend onderwijs volgden.

      3 Indien toepassing van [artikel 11g, vierde lid, van de wet][ref3] ertoe heeft geleid dat een leerling in de
      periode van basisvorming niet de tweede moderne vreemde taal, zijnde Franse taal of Duitse taal, heeft gevolgd, is
      ten aanzien van die leerling het tweede lid, eerste volzin, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel11g
