  - number: 26e
    text: |-
      1 Het bevoegd gezag van een school voor v.w.o. of h.a.v.o. kan een leerling, na overleg met de leerling en, indien
      de leerling minderjarig is, met diens ouders, voogden of verzorgers, vrijstelling verlenen van het volgen van het
      onderwijs in het deelvak lichamelijke opvoeding 1 indien de leerling vanwege diens lichamelijke gesteldheid niet
      in staat is dit onderwijs te volgen. Het bevoegd gezag geeft de inspectie kennis van de verleende vrijstelling en
      vermeldt daarbij de gronden waarop deze vrijstelling berust.

      2 De leerling van een school voor v.w.o. die in het bezit is van het diploma h.a.v.o. is vrijgesteld van het volgen
      van onderwijs in de volgende vakken van het gemeenschappelijk deel: algemene natuurwetenschappen, geschiedenis en
      maatschappijleer. Indien het betreft het atheneum is deze leerling tevens vrijgesteld van het volgen van onderwijs
      in het deelvak culturele en kunstzinnige vorming 1.

      3 Het bevoegd gezag van een school voor v.w.o. kan een leerling op diens verzoek, of indien de leerling minderjarig
      is, op verzoek van zijn ouders, voogden of verzorgers, vrijstellen van het volgen van onderwijs in de deelvakken
      Franse taal en letterkunde 1 of Duitse taal en letterkunde 1, genoemd in [artikel 26][ref1], of van beide, in de
      volgende gevallen:

      a. de leerling werd in de eerste drie leerjaren met toepassing van [artikel 21, tweede lid][ref2], vrijgesteld
      van het volgen van onderwijs in de vakken Franse taal of Duitse taal, respectievelijk van het volgen van onderwijs
      in beide;

      b. de leerling is voor de eerste maal tot een school voor v.w.o. toegelaten, is geplaatst in een hoger leerjaar dan
      het derde en heeft voordien buiten Nederland vergelijkbaar onderwijs gevolgd en daarbij geen of te weinig onderwijs
      in het overeenkomstige vak, respectievelijk in de overeenkomstige vakken, gevolgd;

      c. de leerling is in het bezit van het diploma h.a.v.o. en werd met toepassing van het vierde lid vrijgesteld van
      het volgen van onderwijs in het deelvak moderne taal en letterkunde 1.

      4 Het bevoegd gezag van een school voor h.a.v.o. kan een leerling op diens verzoek, of indien de leerling
      minderjarig is, op verzoek van zijn ouders, voogden of verzorgers, vrijstellen van het volgen van onderwijs in het
      deelvak moderne taal en letterkunde 1, genoemd in [artikel 26][ref3], in de volgende gevallen:

      a. de leerling werd in de eerste drie leerjaren met toepassing van [artikel 21, tweede lid][ref4], vrijgesteld van
      het volgen van onderwijs in de beide vakken Franse taal en Duitse taal;

      b. de leerling is voor de eerste maal tot een school voor h.a.v.o. toegelaten, is geplaatst in een hoger leerjaar
      dan het derde en heeft voordien buiten Nederland vergelijkbaar onderwijs gevolgd en daarbij geen of te weinig
      onderwijs in het overeenkomstige vak gevolgd;

      c. de leerling is in het bezit van het diploma m.a.v.o. en werd met toepassing van [artikel 11][ref5] vrijgesteld
      van het volgen van het onderwijs in een tweede moderne taal.

      5 Het bevoegd gezag kan de in het derde of vierde lid bedoelde vrijstelling in bijzondere gevallen ook verlenen
      aan een leerling die niet voldoet aan een van de in die leden genoemde voorwaarden. De vrijstelling behoeft de
      goedkeuring van de inspectie.

      6 Het bevoegd gezag bepaalt in de in het derde, vierde en vijfde lid genoemde gevallen welk onderwijs voor
      de leerling in de plaats komt van het onderwijs waarvoor vrijstelling is verleend, met dien verstande dat het
      vervangende onderwijs ten minste dezelfde normatieve studielast heeft als het onderwijs waarvoor vrijstelling
      is verleend, en betrekking heeft op taal en letterkunde. Indien het bevoegd gezag van oordeel is dat dit laatste
      niet mogelijk is of ondoelmatig is, stelt het de inspectie daarvan in kennis. Daarbij doet het bevoegd gezag een
      voorstel voor een andere vervanging. Deze vervanging behoeft de goedkeuring van de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
      [ref4]: https://wetten.overheid.nl/BWBR0005946#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
