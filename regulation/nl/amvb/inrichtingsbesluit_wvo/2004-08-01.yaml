  - number: '9'
    text: |-
      Een leerling, komende van een gelijksoortige school, wordt bij toelating geplaatst in het leerjaar waarin de
      leerling op die school onderwijs had mogen volgen.
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel9
  - number: '10'
    text: |-
      1 Tenzij [artikel 9][ref1] van toepassing is, wordt een leerling niet tot een hoger leerjaar dan het eerste
      toegelaten dan nadat uit een door het bevoegd gezag ingesteld onderzoek is gebleken dat de leerling het onderwijs
      in het leerjaar waarvoor toelating wordt gevraagd, naar verwachting met voldoende resultaat zal kunnen volgen, met
      dien verstande dat toelating van een leerling tot het tweede of derde leerjaar niet wordt geweigerd op de grond dat
      de leerling een of meer vakken niet heeft gevolgd.

      2 Tot het vierde leerjaar van een school of afdeling voor h.a.v.o. kan als leerling slechts worden toegelaten
      degene die in het bezit is van een hierna genoemd bewijs, diploma of getuigschrift:

      a. een bewijs de eerste drie leerjaren van een school voor v.w.o. of van een school voor h.a.v.o. met gunstig
      gevolg te hebben doorlopen;

      b. het diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de theoretische leerweg;

      c. een diploma waaruit blijkt dat een school die aansluitend op het basisonderwijs op grond van de
      [Experimentenwet onderwijs][ref2] heeft geëxperimenteerd met het geven van middenschoolonderwijs, met goed
      gevolg is doorlopen en een bewijs waaruit blijkt dat de resultaten van het gevolgde onderwijs overeenstemmen
      met het niveau dat ingevolge het bepaalde in onderdeel *a* of *b* van dit lid voor toelating van een leerling is
      voorgeschreven;

      d. een getuigschrift basisvorming van een school die aansluitend op het basisonderwijs op grond van de
      [Experimentenwet onderwijs][ref3] heeft geëxperimenteerd met basisvorming en primair beroepsonderwijs en een
      verklaring waaruit blijkt dat de resultaten van het gevolgde onderwijs overeenstemmen met het niveau dat ingevolge
      het bepaalde in onderdeel *a* of *b* van dit lid voor toelating van een leerling is voorgeschreven.

      3 De inspectie kan in bijzondere gevallen afwijking van het bepaalde in het tweede lid toestaan, indien de leerling
      naar verwachting het onderwijs in het vierde leerjaar met voldoende resultaat zal kunnen volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002718
      [ref3]: https://wetten.overheid.nl/BWBR0002718
