  - number: '27'
    text: |-
      1 Onze Minister kan op aanvraag van het bevoegd gezag van een school voor v.b.o. of het bevoegd gezag van
      een scholengemeenschap of school als bedoeld in [artikel 10d, eerste lid, van de wet][ref1], toestemming
      verlenen aan datzelfde bevoegd gezag voor zover het betreft een andere school voor v.b.o., of aan een ander
      bevoegd gezag van een school voor v.b.o. dan die waar de desbetreffende leerlingen zijn ingeschreven, om
      vakken en programma-onderdelen te verzorgen als bedoeld in [artikel 10b, tiende lid, onderdeel d][ref2], of
      [artikel 10d, tiende lid, onderdeel d, van de wet][ref3], mits dat doelmatig is gelet op het geheel en de spreiding
      van het aanbod van v.b.o.

      2 Aan de aanvraag ligt een schriftelijke samenwerkingsovereenkomst ten grondslag tussen de in het eerste lid
      bedoelde bevoegde gezagsorganen, tenzij de in het eerste lid bedoelde scholen in stand worden gehouden door
      hetzelfde bevoegd gezag. Uit de samenwerkingsovereenkomst moet blijken dat noch de aanvang noch de beëindiging van
      het verzorgen van vakken en programma-onderdelen door een andere school voor v.b.o., bedoeld in het eerste lid,
      leidt tot kosten van werkloosheidsuitkeringen.

      3 De aanvraag kan ertoe strekken dat het bevoegd gezag dat de aanvraag indient, de mogelijkheid krijgt leerlingen
      in te schrijven voor v.b.o.-afdelingen waarin dat bevoegd gezag niet gerechtigd is onderwijs te verzorgen maar
      waartoe het bevoegd gezag waarmee de in het tweede lid bedoelde samenwerkingsovereenkomst is gesloten, wel
      gerechtigd is.

      4 De aanvraag, bedoeld in het eerste lid, wordt voor 1 november voorafgaand aan het eerste schooljaar waarop de
      aanvraag betrekking heeft, aan Onze Minister gezonden. Bij de aanvraag wordt meegezonden de in het tweede lid
      bedoelde samenwerkingsovereenkomst.

      5 [Artikel 26k, vierde tot en met zesde lid][ref4], is van overeenkomstige toepassing.

      6 De in het eerste lid bedoelde toestemming vervalt zodra een bevoegd gezag niet meer deelneemt aan de in het
      tweede lid bedoelde samenwerkingsovereenkomst.

      7 Zodra een bevoegd gezag niet meer deelneemt aan de in het tweede lid bedoelde samenwerkingsovereenkomst terwijl
      die samenwerkingsovereenkomst voor het overige in stand blijft, stelt dit bevoegd gezag Onze Minister daarvan in
      kennis. Onze Minister kan de in het eerste lid bedoelde toestemming voor zover het de andere dan de in de eerste
      volzin bedoelde bevoegde gezagsorganen betreft intrekken indien het verzorgen van de vakken of programma-onderdelen
      gelet op het uittreden van het bevoegd gezag niet langer doelmatig is gelet op het geheel en de spreiding van het
      aanbod van v.b.o.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0005946#Artikel26k
