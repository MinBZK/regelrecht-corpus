  - number: 26j
    text: |-
      1 De intrasectorale programma's voor de sector techniek zijn:

      a. het programma metalektro, bestaande uit een combinatie van programma-onderdelen behorende bij de afdelingen
      elektrotechniek en metaaltechniek,

      b. het programma bouw-breed, bestaande uit een combinatie van programma-onderdelen behorende bij de afdeling
      bouwtechniek, en

      c. het programma instalektro, bestaande uit een combinatie van programma-onderdelen behorende bij de afdelingen
      elektrotechniek en installatietechniek.

      2 Het intrasectorale programma voor de sector zorg en welzijn is het programma zorg- en welzijn-breed, bestaande
      uit een combinatie van programma-onderdelen behorende bij de afdelingen verzorging en uiterlijke verzorging.

      3 De intrasectorale programma's voor de sector economie zijn:

      a. het programma handel en administratie, bestaande uit een combinatie van programma-onderdelen behorende bij de
      afdelingen handel en verkoop, administratie, en mode en commercie, en

      b. het programma consumptief-breed, bestaande uit een combinatie van programma-onderdelen behorende bij de afdeling
      consumptief, aangevuld met programma-onderdelen op het gebied van toerisme en recreatie.

      4 Het intrasectorale programma voor de sector landbouw is het programma landbouw-breed, bestaande uit een
      combinatie van programma-onderdelen behorende bij de afdeling landbouw en natuurlijke omgeving.
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel26j
  - number: 26k
    text: |-
      1 Het bevoegd gezag van een school voor v.b.o. of van een scholengemeenschap waarvan ten minste een
      school voor v.b.o. deel uitmaakt, zendt een aanvraag als bedoeld in [artikel 10b, negende lid][ref1], of
      [artikel 10d, negende lid, van de wet][ref2], voor 1 november voorafgaand aan het schooljaar met ingang waarvan
      het bevoegd gezag intrasectorale programma's wil verzorgen, dan wel voor 1 november van het jaar daarvoor, aan
      Onze Minister.

      2 De in het eerste lid bedoelde aanvraag gaat in ieder geval vergezeld van:

      a. een overzicht van de afdelingen voor v.b.o. die aan de school of scholengemeenschap zijn verbonden en een
      overzicht van de plaatsen waar de school of scholengemeenschap die afdelingen verzorgt;

      b. een aanduiding van de onder a bedoelde plaatsen waar het bevoegd gezag voornemens is de desbetreffende
      intrasectorale programma's te verzorgen;

      c. een aanduiding van de leerwegen die het bevoegd gezag voornemens is te verzorgen in het intrasectorale programma
      en in de afdelingen die daarvan deel uitmaken.

      3 Tevens toont het bevoegd gezag bij de aanvraag met bescheiden aan:

      a. dat het in [artikel 26l, eerste lid][ref3], bedoelde overleg is gevoerd, en

      b. indien van toepassing, dat aan de voorwaarde van [artikel 26l, tweede lid, eerste volzin][ref4], wordt voldaan.

      4 Direct na ontvangst van de aanvraag zendt Onze Minister deze aan de betrokken provincie en aan de organisaties
      waarmee Onze Minister op grond van [artikel 65, eerste lid, van de wet][ref5] overlegt over het plan van scholen.

      5 De provincie en de organisaties brengen voor 1 maart van het kalenderjaar volgend op het kalenderjaar waarin de
      aanvraag is ingediend, hun daarop betrekking hebbende adviezen uit aan Onze Minister.

      6 Onze Minister beslist voor 15 mei van het kalenderjaar volgend op het kalenderjaar waarin de aanvraag is
      ingediend. Indien zich bij de aanvraag knelpunten voordoen, beslist Onze Minister in afwijking van de eerste
      volzin binnen tien maanden na ontvangst van de aanvraag. Indien de beschikking niet binnen tien maanden kan worden
      gegeven, stelt Onze Minister het bevoegd gezag daarvan in kennis en noemt hij daarbij een termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
