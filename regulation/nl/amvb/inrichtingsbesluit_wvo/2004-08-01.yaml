  - number: '2'
    text: |-
      1 Het bevoegd gezag beslist over de toelating van leerlingen.

      2 Het bevoegd gezag kan bepalen dat de in het eerste lid bedoelde bevoegdheid onder zijn verantwoordelijkheid wordt
      uitgeoefend door een door het bevoegd gezag in te stellen toelatingscommissie.

      3 Het bevoegd gezag regelt de werkzaamheden, omvang en samenstelling van de in het tweede lid bedoelde
      toelatingscommissie en kan de uitoefening van de bevoegdheid door de commissie nader regelen.
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel2
  - number: '3'
    text: |-
      1 Tot het eerste leerjaar van een school, behalve voor zover het betreft een school voor praktijkonderwijs, kan als
      leerling slechts worden toegelaten degene die:

      a. afkomstig is van een school voor basisonderwijs en bij wie naar het oordeel van de directeur van de school voor
      basisonderwijs de grondslag voor het volgen van aansluitend voortgezet onderwijs in voldoende mate is gelegd, of

      b. afkomstig is van een school voor basisonderwijs of een speciale school voor basisonderwijs als bedoeld in
      de[ Wet op het primair onderwijs][ref1] en aan het einde van het schooljaar de leeftijd van 14 jaar heeft bereikt,
      of

      c. afkomstig is van een school voor speciaal onderwijs, een school voor voortgezet speciaal onderwijs of een school
      of instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref2] en
      bij wie naar het oordeel van de directeur van de desbetreffende school of instelling de grondslag voor het volgen
      van aansluitend voortgezet onderwijs in voldoende mate is gelegd.

      2 Bij beslissingen over de toelating op grond van het eerste lid betrekt het bevoegd gezag het
      onderwijskundig rapport dat ingevolge [artikel 42 van de Wet op het primair onderwijs][ref3] dan wel ingevolge
      [artikel 43, tweede lid, van de Wet op de expertisecentra][ref4] is opgesteld.

      3 De toelating tot het eerste leerjaar van een school kan niet voorwaardelijk geschieden.

      4 In gevallen waarin toepassing van het eerste of tweede lid niet mogelijk is, kan de inspectie afwijking van het
      eerste of tweede lid toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
