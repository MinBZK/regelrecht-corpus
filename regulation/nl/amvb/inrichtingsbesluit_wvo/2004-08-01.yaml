  - number: '16'
    text: |-
      1 De tijd die per cursusjaar ten hoogste voor vakantie van de leerlingen mag worden besteed, bedraagt 72
      schooldagen bij een zesdaagse schoolweek en 60 schooldagen bij een vijfdaagse schoolweek.

      2 Onder schooldag wordt verstaan elke dag van de week met uitzondering van de zondag bij een zesdaagse schoolweek
      en met uitzondering van de zaterdag en de zondag bij een vijfdaagse schoolweek. Niet tot schooldagen worden
      gerekend:

      a. nieuwjaarsdag, tweede paasdag, hemelvaartsdag, tweede pinksterdag en de beide kerstdagen, alsmede

      b. nationale feestdagen.

      3 Indien aan een bijzondere school onderwijs wordt gegeven gebaseerd op een levensbeschouwing volgens welke andere
      dan de in het tweede lid, onderdeel *a*, genoemde dagen als feestdagen worden aangemerkt, kunnen in plaats daarvan
      ten hoogste zes andere dagen niet tot schooldagen worden gerekend.
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel16
  - number: '17'
    text: |-
      Bij ministeriële regeling worden het begin en het einde van de zomervakantie vastgesteld. De begin- en einddatum
      kunnen per groep van scholen verschillen.
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel17
  - number: '18'
    text: |-
      Gedurende de periode van basisvorming kunnen de onderstaande vakken in combinatie met elkaar worden gegeven:

      a. natuur- en scheikunde, biologie;

      b. twee of drie van de vakken geschiedenis en staatsinrichting, aardrijkskunde, economie;

      c. twee of meer van de vakken behorende tot de beeldende vorming;

      d. informatiekunde en een van de vakken Nederlandse taal, economie, wiskunde, natuur- en scheikunde, techniek.
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel18
  - number: '19'
    text: |-
      1 Voor afwijkingen als bedoeld in [artikel 11e, derde lid, eerste volzin, van de wet][ref1] kunnen in aanmerking
      komen leerlingen die naar het oordeel van het bevoegd gezag niet in staat zijn aan het eind van de basisvorming de
      kerndoelen te bereiken.

      2 Het bevoegd gezag stelt een commissie in die adviseert ten aanzien van welke leerlingen
      [artikel 11e, derde lid, van de wet][ref2] toepassing kan vinden. Het bevoegd gezag regelt de omvang en
      samenstelling van de commissie.

      3 In haar advies doet de commissie aan het bevoegd gezag voorstellen ten aanzien van de aard van de in het tweede
      lid bedoelde afwijkingen. Daarbij geeft zij aan waarop deze voorstellen zijn gegrond.

      4 De commissie betrekt in elk geval bij haar oordeelsvorming:

      a. in voorkomende gevallen het in [artikel 3, tweede lid][ref3], bedoelde onderwijskundig rapport en de resultaten
      van het in [artikel 4][ref4] bedoelde onderzoek naar de geschiktheid;

      b. indien de omstandigheid op grond waarvan afwijking wordt voorgesteld daartoe aanleiding geeft, de van een
      deskundige verkregen verklaring;

      c. de zienswijze van de ouders, voogden of verzorgers van de leerlingen, welke zienswijze blijkt uit een
      schriftelijke verklaring;

      d. de zienswijze van de leraar of leraren, belast met het onderwijs in het betrokken vak of de betrokken vakken,
      welke zienswijze blijkt uit een schriftelijke verklaring.

      5 Het advies wordt schriftelijk uitgebracht aan het bevoegd gezag. Indien het bevoegd gezag voornemens is af te
      wijken van het advies van de commissie, overlegt het over dit voornemen met de commissie. De beslissing van het
      bevoegd gezag is met redenen omkleed. Het bevoegd gezag zendt een afschrift van zijn beslissing, vergezeld van het
      advies van de commissie en de daarbij gevoegde verklaringen, bedoeld in het vierde lid, aan de ouders, voogden of
      verzorgers van de betrokken leerlingen, aan de betrokken leraar of leraren en aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005946#Artikel4
