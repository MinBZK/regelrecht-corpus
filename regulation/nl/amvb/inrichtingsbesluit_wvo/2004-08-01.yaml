  - number: 26d
    text: |-
      1 Door het bevoegd gezag vast te stellen vakken en andere programma-onderdelen van het vrije deel, behoudens
      godsdienstonderwijs aan bijzondere scholen, hebben een normatieve studielast van 40 uren of een geheel veelvoud
      daarvan. Het bevoegd gezag kan, indien de aard van het desbetreffende andere programma-onderdeel daartoe noodzaakt,
      de studielast van dat andere programma-onderdeel in afwijking van de eerste volzin vaststellen op een kleiner
      aantal dan 40 uren.

      2 Indien het bevoegd gezag bij de vaststelling van vakken en andere programma-onderdelen andere instellingen
      of deskundige personen van buiten de school betrekt, kan het onderwijs in die vakken en andere programma-
      onderdelen, onverminderd de verantwoordelijkheid van het bevoegd gezag voor het onderwijs aan de school,
      mede worden verzorgd door die andere instellingen of deskundige personen. Daarbij stelt het bevoegd gezag
      als voorwaarde dat die instellingen of deskundige personen voldoen aan de met betrekking tot hun geldende
      wettelijke voorschriften en voorzover die voorschriften ontbreken, aan de binnen de beroepsgroep algemeen erkende
      normen. [Artikel 33, eerste lid, van de wet][ref1] is ten aanzien van degenen die dit onderwijs verzorgen van
      overeenkomstige toepassing, met dien verstande dat als bewijs van bekwaamheid en bewijs van voldoende pedagogische
      en didactische voorbereiding geldt een kwalificatie die, gelet op de eerste en tweede volzin, passend is. Het
      bevoegd gezag stelt de inspectie in kennis van de kwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
