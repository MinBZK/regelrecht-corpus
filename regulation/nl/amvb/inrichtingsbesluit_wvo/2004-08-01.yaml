    text: |-
      1 Het gemeenschappelijk deel van elk profiel in het h.a.v.o. omvat de volgende vakken en deelvakken, met de daarbij
      vermelde normatieve studielast, uitgedrukt in uren:



              Nederlandse taal en letterkunde

                400



              Engelse taal en letterkunde

                360



              Franse, Duitse, Spaanse, Russische, Italiaanse, Arabische, Turkse of Friese taal en letterkunde 1

                160



              algemene natuurwetenschappen

                160



              geschiedenis en maatschappijleer

                160



              culturele en kunstzinnige vorming 1

                120



              lichamelijke opvoeding 1

                120




      2 Het profieldeel van het profiel natuur en techniek in het h.a.v.o. omvat de volgende vakken, met de daarbij
      vermelde normatieve studielast, uitgedrukt in uren:



              wiskunde B1,2

                440



              natuurkunde 1,2

                440



              scheikunde

                280




      3 Het profieldeel van het profiel natuur en gezondheid in het h.a.v.o. omvat de volgende vakken en deelvakken, met
      de daarbij vermelde normatieve studielast, uitgedrukt in uren:



              wiskunde B1

                320



              natuurkunde 1

                240



              scheikunde

                280



              biologie

                320,




      met dien verstande dat de leerling de deelvakken wiskunde B1 en natuurkunde 1 mag vervangen door respectievelijk
      het vak wiskunde B1,2 en het vak natuurkunde 1,2.

      4 Het profieldeel van het profiel economie en maatschappij in het h.a.v.o. omvat de volgende vakken, met de daarbij
      vermelde normatieve studielast, uitgedrukt in uren:



              economie 1,2

                440



              wiskunde A1,2

                280



              geschiedenis

                240



              aardrijkskunde

                200,




      met dien verstande dat de leerling het vak wiskunde A1,2 mag vervangen door het deelvak wiskunde B1 of het vak
      wiskunde B1,2.

      5 Het profieldeel van het profiel cultuur en maatschappij in het h.a.v.o. omvat de volgende vakken en deelvakken,
      met de daarbij vermelde normatieve studielast, uitgedrukt in uren:

      a. een van de volgende deelvakken, als combinatie met het overeenkomstige deelvak uit het gemeenschappelijk deel:



                  Franse, Duitse, Spaanse, Russische, Italiaanse, Arabische, Turkse en Friese taal en letterkunde 2

                    200,



                  Franse, Duitse, Spaanse, Russische, Italiaanse, Arabische, Turkse en Friese taal en letterkunde 1,2

                    360




      dan wel een van de volgende vakken:

      b. de combinatie van het deelvak culturele en kunstzinnige vorming 2 met een normatieve studielast van 120 uren,
      met een van de volgende deelvakken:



                  culturele en kunstzinnige vorming 3 (beeldende vormgeving)

                    240



                  culturele en kunstzinnige vorming 3 (muziek)

                    240



                  culturele en kunstzinnige vorming 3 (drama)

                    240



                  culturele en kunstzinnige vorming 3 (dans)

                    240




      c.

                  geschiedenis

                    240




      d.

                  economie 1

                    200




      e.

                  wiskunde A1

                    160,




      met dien verstande dat de leerling het deelvak economie 1 mag vervangen door het vak economie 1,2 en het deelvak
      wiskunde A1 mag vervangen door het vak wiskunde A1,2, het deelvak wiskunde B1 of het vak wiskunde B1,2.

      6 De toepassing van het derde tot en met vijfde lid kan in afwijking van [artikel 26][ref1], leiden tot een grotere
      normatieve studielast van het profieldeel dan 1160 uren.

      7 Het vrije deel van elk profiel in het h.a.v.o. kan omvatten:

      a. vakken en deelvakken, genoemd in het tweede tot en met vijfde lid, met dien verstande dat indien het profiel het
      deelvak wiskunde A1 of het vak wiskunde A1,2 omvat, in combinatie met het deelvak wiskunde B1 of het vak wiskunde
      B1,2, de normatieve studielast van het in het vrije deel gekozen vak of deelvak wiskunde wordt verminderd met 160
      uren,

      b. de volgende vakken, met de daarbij vermelde normatieve studielast, uitgedrukt in uren, met dien verstande dat
      deze vakken slechts deel kunnen uitmaken van het vrije deel voorzover in de desbetreffende taal niet reeds in de
      periode van basisvorming onderwijs is gevolgd:



                  Spaanse taal en letterkunde (elementair)

                    360



                  Russische taal en letterkunde (elementair)

                    360



                  Italiaanse taal en letterkunde (elementair)

                    360



                  Arabische taal en letterkunde (elementair)

                    360



                  Turkse taal en letterkunde (elementair)

                    360




      c. de volgende vakken, met de daarbij vermelde normatieve studielast, uitgedrukt in uren:



                  maatschappijleer

                    200



                  filosofie

                    360



                  management en organisatie

                    280



                  informatica

                    240



                  lichamelijke opvoeding 2

                    240




      d. door het bevoegd gezag vast te stellen vakken en andere programma-[onderdelen, ][ref2]

      e. de volgende deelvakken, met de daarbij vermelde normatieve studielast, uitgedrukt in uren:



                  Franse, Duitse, Spaanse, Russische, Italiaanse, Arabische, Turkse of Friese taal en letterkunde 1

                    160, en




      f. vakken en deelvakken, genoemd in [artikel 26][ref3], voorzover zij niet geheel of gedeeltelijk inhoudelijk
      overeenkomen met een van de andere vakken en deelvakken die het profiel omvat.

      8 Onverminderd [artikel 13, eerste lid, onder c, van het Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref4]
      kan het vrije deel van elk profiel ook omvatten: aanvullend onderwijs in vakken, deelvakken en andere programma-
      onderdelen als bedoeld in het eerste tot en met zevende lid.


