  - number: '11'
    text: |-
      Alvorens toepassing te geven aan [artikel 27, tiende lid, van de wet][ref1], vergewist de inspectie zich ervan, dat
      het bevoegd gezag de ouders van de betrokken leerling in de gelegenheid heeft gesteld te worden gehoord over het
      verzoek van het bevoegd gezag. De inspectie betrekt bij haar beslissing in elk geval de zienswijze van de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
  - number: '12'
    text: |-
      1 Voorwaardelijke bevordering wordt uitdrukkelijk op het eindrapport vermeld. Bovendien wordt hiervan schriftelijk
      mededeling gedaan aan ouders, voogden of verzorgers, waarbij wordt vermeld het tijdstip waarop definitief omtrent
      de overgang zal worden beslist alsmede de voorwaarden waaraan moet worden voldaan om te kunnen worden bevorderd.
      Dit tijdstip ligt tussen 1 oktober en 1 januari daarop volgend.

      2 Een leerling wordt niet voorwaardelijk bevorderd tot het hoogste leerjaar.
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel12
  - number: '13'
    text: |-
      1 Het bevoegd gezag kan met opgave van redenen een leerling voor een periode van ten hoogste één week schorsen.

      2 Het besluit tot schorsing wordt schriftelijk aan de betrokkene en, indien deze nog niet de leeftijd van 21 jaar
      heeft bereikt, ook aan de ouders, voogden of verzorgers van de betrokkene bekendgemaakt.

      3 Het bevoegd gezag stelt de inspectie van een schorsing voor een periode langer dan één dag schriftelijk en met
      opgave van redenen in kennis.
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel13
  - number: '14'
    text: |-
      1 Het bevoegd gezag kan besluiten tot definitieve verwijdering van een leerling nadat deze en, indien de leerling
      nog niet de leeftijd van 18 jaren heeft bereikt, ook diens ouders, voogden of verzorgers, in de gelegenheid is
      onderscheidenlijk zijn gesteld hierover te worden gehoord. Een leerling wordt op grond van onvoldoende vorderingen
      niet in de loop van een schooljaar verwijderd.

      2 Definitieve verwijdering van een leerplichtige leerling geschiedt slechts na overleg met de inspectie. Hangende
      dit overleg kan de leerling worden geschorst. Het overleg strekt er mede toe, na te gaan op welke andere wijze de
      betrokken leerling onderwijs zal kunnen volgen.

      3 Het bevoegd gezag stelt de inspectie van een definitieve verwijdering schriftelijk en met opgave van redenen
      in kennis.
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel14
  - number: '15'
    text: |-
      1 De besluiten tot weigering van de toelating van een kandidaat-leerling of tot definitieve verwijdering van een
      leerling worden schriftelijk en met opgave van redenen aan de leerling en, indien deze nog niet de leeftijd van 21
      jaren heeft bereikt, ook aan diens ouders, voogden of verzorgers, bekendgemaakt, waarbij tevens de inhoud van het
      tweede lid wordt vermeld.

      2 Binnen zes weken na de bekendmaking kunnen belanghebbenden bezwaar maken bij het bevoegd gezag.

      3 Het bevoegd gezag beslist in overeenstemming met [artikel 27 van de wet][ref1] binnen vier weken na ontvangst
      van het bezwaarschrift, doch niet eerder dan nadat de kandidaat-leerling, onderscheidenlijk de leerling en, indien
      deze nog niet de leeftijd van 18 jaar heeft bereikt, ook diens ouders, voogden of verzorgers, in de gelegenheid is,
      onderscheidenlijk zijn gesteld, te worden gehoord en kennis heeft onderscheidenlijk hebben kunnen nemen van de op
      die besluiten betrekking hebbende adviezen of rapporten.

      4 Het bevoegd gezag kan de desbetreffende leerling, gedurende de behandeling van het bezwaar tegen een besluit tot
      definitieve verwijdering de toegang tot de school ontzeggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
