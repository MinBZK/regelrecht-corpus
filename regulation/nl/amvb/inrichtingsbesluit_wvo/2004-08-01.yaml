  - number: '21'
    text: |-
      1 In de eerste drie leerjaren te zamen van een school voor v.w.o. en een school voor h.a.v.o. wordt, naast het
      onderwijs in de vakken genoemd in [artikel 11][ref1], onderwijs verzorgd in een derde moderne taal, zijnde Franse
      taal of Duitse taal. In de eerste drie leerjaren te zamen van een gymnasium wordt daarnaast nog onderwijs verzorgd
      in de vakken Latijnse taal en letterkunde en Griekse taal en letterkunde.

      2 Het bevoegd gezag kan goedkeuren dat een leerling van een school als bedoeld in het eerste lid, wordt vrijgesteld
      van het volgen van onderwijs in de vakken Franse taal of Duitse taal, dan wel in deze beide vakken. Deze
      goedkeuring kan slechts worden verleend ten behoeve van leerlingen in de eerste drie leerjaren die:

      a. onderwijs in de taal van het land van oorsprong, bedoeld in [artikel 16 van de wet][ref2], volgen, of

      b. voor de eerste maal tot een school als bedoeld in het eerste lid zijn toegelaten en daarbij zijn geplaatst in
      een hoger leerjaar dan het eerste en voordien buiten Nederland vergelijkbaar onderwijs hebben gevolgd en daarbij
      geen of te weinig onderwijs in het desbetreffende vak hebben genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel16
