  - number: 26l
    text: |-
      1 Het bevoegd gezag van de in [artikel 26k, eerste lid][ref1], bedoelde scholen en scholengemeenschappen overlegt
      met de andere soortgelijke scholen en scholengemeenschappen in de door Onze Minister op voorstel van de provincie
      aangewezen regio, over de doelmatigheid van het verzorgen van de intrasectorale programma's, gelet op het geheel en
      de spreiding van het aanbod van v.b.o.

      2 Bij inwilliging van een aanvraag voor het verzorgen van het intrasectorale programma metalektro, instalektro
      of bouw-breed dienen in de regio, bedoeld in het eerste lid, ten minste verzorgd te blijven worden de
      afdelingsprogramma's van onderscheidenlijk de afdelingen bouwtechniek, metaaltechniek en elektrotechniek in de
      basisberoepsgerichte leerweg. Onze Minister kan de eerste volzin buiten toepassing laten indien de situatie in de
      regio daar aanleiding toe geeft.

      3 Onze Minister kan aan het bevoegd gezag van een in [artikel 26k, eerste lid][ref2], bedoelde school of
      scholengemeenschap toestemming verlenen tot het verzorgen van intrasectorale programma's, indien deze school
      of scholengemeenschap gerechtigd is, onderwijs te verzorgen in de afdelingen die onderdeel uitmaken van
      die intrasectorale programma's. De in de eerste volzin bedoelde toestemming geldt voor zover het betreft de
      basisberoepsgerichte leerweg en de kaderberoepsgerichte leerweg in elk geval voor de plaatsen waar het onderwijs in
      al deze afdelingen wordt verzorgd.

      4 Indien de aanvraag betrekking heeft op het intrasectorale programma zorg en welzijn-breed of op het
      intrasectorale programma handel en administratie, kan in afwijking van de eerste volzin van het derde lid,
      de toestemming worden verleend ondanks het ontbreken van een afdeling, indien de school of scholengemeenschap
      gerechtigd is onderwijs te verzorgen in de afdeling verzorging respectievelijk in de afdeling handel en verkoop.

      5 Onze Minister kan bij de beoordeling van aanvragen voor het verzorgen van intrasectorale programma's ook andere
      dan de in de voorgaande leden bedoelde aspecten betrekken die verband houden met de doelmatigheid van het verzorgen
      van de intrasectorale programma's gelet op het geheel en de spreiding van het aanbod van v.b.o.

      6 Onze Minister kan in bijzondere gevallen, verband houdend met de doelmatigheid van het verzorgen van de
      intrasectorale programma's gelet op het geheel en de spreiding van het aanbod van v.b.o., afwijken van de
      voorschriften in de voorgaande leden, met dien verstande dat afwijking van de in het derde of vierde lid bedoelde
      voorwaarden niet kan geschieden indien de school of scholengemeenschap niet over ten minste één afdeling beschikt
      die onderdeel uitmaakt van het intrasectorale programma.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26k
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26k
    url: https://wetten.overheid.nl/BWBR0005946/2004-08-01#Artikel26l
