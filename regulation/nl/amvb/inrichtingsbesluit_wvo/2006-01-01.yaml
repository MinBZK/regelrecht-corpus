  - number: 26a.1
    text: |-
      In het v.w.o. is de normatieve studielast van het gemeenschappelijk [deel 1960][ref1] uren, van het profieldeel
      1840 uren en van het vrije [deel 1000][ref2] uren.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26a
