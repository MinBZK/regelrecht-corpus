  - number: '2.1'
    text: Het bevoegd gezag beslist over de toelating van leerlingen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het bevoegd gezag kan bepalen dat de in het eerste lid bedoelde bevoegdheid onder zijn verantwoordelijkheid wordt
      uitgeoefend door een door het bevoegd gezag in te stellen toelatingscommissie.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het bevoegd gezag regelt de werkzaamheden, omvang en samenstelling van de in het tweede lid bedoelde
      toelatingscommissie en kan de uitoefening van de bevoegdheid door de commissie nader regelen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel2
  - number: '3.1'
    text: |-
      Tot het eerste leerjaar van een school, behalve voor zover het betreft een school voor praktijkonderwijs, kan als
      leerling slechts worden toegelaten degene die:
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel3
  - number: 3.1.a
    text: |-
      afkomstig is van een school voor basisonderwijs en bij wie naar het oordeel van de directeur van de school voor
      basisonderwijs de grondslag voor het volgen van aansluitend voortgezet onderwijs in voldoende mate is gelegd, of
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel3
  - number: 3.1.b
    text: |-
      afkomstig is van een school voor basisonderwijs of een speciale school voor basisonderwijs als bedoeld in
      de[ Wet op het primair onderwijs][ref1] en aan het einde van het schooljaar de leeftijd van 14 jaar heeft bereikt,
      of


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 3.1.c
    text: |-
      afkomstig is van een school voor speciaal onderwijs, een school voor voortgezet speciaal onderwijs of een school
      of instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref1] en
      bij wie naar het oordeel van de directeur van de desbetreffende school of instelling de grondslag voor het volgen
      van aansluitend voortgezet onderwijs in voldoende mate is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '3.2'
    text: |-
      Bij beslissingen over de toelating op grond van het eerste lid betrekt het bevoegd gezag het onderwijskundig
      rapport dat ingevolge [artikel 42 van de Wet op het primair onderwijs][ref1] dan wel ingevolge
      [artikel 43, tweede lid, van de Wet op de expertisecentra][ref2] is opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel43
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '43'
  - number: '3.3'
    text: De toelating tot het eerste leerjaar van een school kan niet voorwaardelijk geschieden.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel3
  - number: '3.4'
    text: |-
      In gevallen waarin toepassing van het eerste of tweede lid niet mogelijk is, kan de inspectie afwijking van het
      eerste of tweede lid toestaan.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel3
  - number: '4.1'
    text: |-
      Onverminderd het bepaalde in [artikel 3][ref1] wordt de beslissing over de toelating van een kandidaat-leerling
      tot het eerste leerjaar van een school voor v.w.o., voor h.a.v.o. of voor m.a.v.o., mede gebaseerd op een onderzoek
      naar de geschiktheid voor het volgen van het onderwijs aan de school waarvoor de toelating wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
  - number: '4.2'
    text: |-
      Het onderzoek naar de geschiktheid vindt plaats met behulp van ten minste één van de hierna genoemde middelen, ter
      keuze van het bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel4
  - number: 4.2.a
    text: |-
      een toelatingsexamen, door de leraren van de school afgenomen, dat zich ten minste uitstrekt over de vakken
      Nederlandse taal en rekenen;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel4
  - number: 4.2.b
    text: een proefklasse;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel4
  - number: 4.2.c
    text: |-
      een onderzoek naar de kennis en het inzicht van de kandidaat-leerling in ten minste het laatstelijk door hem
      gevolgde schooljaar aan de basisschool, de speciale school voor basisonderwijs, de school voor speciaal onderwijs,
      de school voor voortgezet speciaal onderwijs of de school of instelling voor speciaal en voortgezet speciaal
      onderwijs;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel4
  - number: 4.2.d
    text: een psychologisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel4
  - number: '4.3'
    text: |-
      Een kandidaat-leerling wordt niet onderworpen aan een psychologisch onderzoek als bedoeld in het tweede lid,
      onderdeel *d*, dan met toestemming van hen die de ouderlijke macht of de voogdij over hem uitoefenen. Dezen worden
      op hun verzoek in de gelegenheid gesteld van de resultaten van het onderzoek kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel4
  - number: '4.4'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het rapport van het in het tweede lid, onderdeel *d*, bedoelde
      psychologisch onderzoek wordt bewaard op een plaats die uitsluitend toegankelijk is voor het bevoegd gezag en
      de met het onderzoek belaste functionarissen. De ouders, voogden of verzorgers van de kandidaat-leerling en de
      inspectie krijgen desgewenst inzage in dit psychologisch rapport. Het psychologisch rapport wordt in de school
      bewaard tot ten minste drie jaren en ten hoogste vijf jaren na het tijdstip waarop de leerling de school heeft
      verlaten en wordt in elk geval binnen twee maanden na het verstrijken van laatstbedoelde termijn van ten hoogste
      vijf jaren vernietigd.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel4
  - number: '4.5'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op een in het eerste lid genoemde school die een
      gemeenschappelijk eerste leerjaar heeft met een school voor v.b.o.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het bevoegd gezag doet mededeling aan de inspectie van de te volgen procedure voor de toelating tot het
      eerste leerjaar. Het zendt jaarlijks binnen 6 maanden na de toelating een verslag betreffende de toegepaste
      toelatingsmiddelen en van de daarmee opgedane ervaringen aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het bevoegd gezag stelt de directeur van de basisschool, de speciale school voor basisonderwijs, de school voor
      speciaal onderwijs, de school voor voortgezet speciaal onderwijs of de school of instelling voor speciaal en
      voortgezet speciaal onderwijs in kennis van de beslissing omtrent de toelating en, na afloop van het eerste
      leerjaar, indien de directeur dit verzoekt, van de studieresultaten van de leerling.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel5
  - number: '6.1'
    text: |-
      In afwijking van [artikel 3][ref1] of [artikel 4][ref2] kan het bevoegd gezag van een school voor v.w.o. of voor
      h.a.v.o. tot het eerste leerjaar van die school toelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel4
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005946
        artikel: '4'
        hoofdstuk: II
  - number: 6.1.a
    text: de kandidaat-leerling die tot het eerste leerjaar van een andere school voor v.w.o. of voor h.a.v.o. is toegelaten;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel6
  - number: 6.1.b
    text: |-
      de kandidaat-leerling die het eerste leerjaar van een school voor m.a.v.o. gedeeltelijk heeft doorlopen, indien de
      studieresultaten daartoe naar het oordeel van het bevoegd gezag aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel6
  - number: '6.2'
    text: |-
      In afwijking van [artikel 3][ref1] of [artikel 4][ref2] kan het bevoegd gezag van een school voor m.a.v.o. tot het
      eerste leerjaar van die school toelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel4
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005946
        artikel: '4'
        hoofdstuk: II
  - number: 6.2.a
    text: |-
      de kandidaat-leerling die tot het eerste leerjaar van een andere school voor m.a.v.o. of tot het eerste leerjaar
      van een school voor v.w.o. of voor h.a.v.o. is toegelaten;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel6
  - number: 6.2.b
    text: |-
      de kandidaat-leerling die het eerste leerjaar van een school voor v.b.o. gedeeltelijk heeft doorlopen, indien de
      studieresultaten daartoe naar het oordeel van het bevoegd gezag aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel6
  - number: '6.3'
    text: |-
      In afwijking van [artikel 3][ref1] kan het bevoegd gezag van een school voor v.b.o. tot het eerste leerjaar van die
      school toelaten de kandidaat die tot het eerste leerjaar van enige school is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
  - number: '7'
    text: |-
      Tot een school of afdeling voor praktijkonderwijs kan als leerling worden toegelaten degene die de leeftijd van ten
      minste 12 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel7
  - number: '8'
    text: |-
      Onverminderd het bepaalde in de [artikelen 3][ref1], [7][ref2] en [10, eerste lid][ref3],
      wordt een kandidaat-leerling niet toegelaten tot een school of afdeling, aangewezen op grond van
      [artikel 24, vijfde lid, van de wet][ref4], dan nadat het bevoegd gezag zich ervan heeft vergewist dat dit
      onderwijs voor hem het meest aangewezen is, gelet op de bijzondere aard en doelstelling van het desbetreffende
      onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005946
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005946
        artikel: '10'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '24'
  - number: '9'
    text: |-
      Een leerling, komende van een gelijksoortige school, wordt bij toelating geplaatst in het leerjaar waarin de
      leerling op die school onderwijs had mogen volgen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel9
  - number: '10.1'
    text: |-
      Tenzij [artikel 9][ref1] van toepassing is, wordt een leerling niet tot een hoger leerjaar dan het eerste
      toegelaten dan nadat uit een door het bevoegd gezag ingesteld onderzoek is gebleken dat de leerling het onderwijs
      in het leerjaar waarvoor toelating wordt gevraagd, naar verwachting met voldoende resultaat zal kunnen volgen, met
      dien verstande dat toelating van een leerling tot het tweede of derde leerjaar niet wordt geweigerd op de grond dat
      de leerling een of meer vakken niet heeft gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel9
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '9'
        hoofdstuk: II
  - number: '10.2'
    text: |-
      Tot het vierde leerjaar van een school of afdeling voor h.a.v.o. kan als leerling slechts worden toegelaten degene
      die in het bezit is van een hierna genoemd bewijs, diploma of getuigschrift:
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel10
  - number: 10.2.a
    text: |-
      een bewijs de eerste drie leerjaren van een school voor v.w.o. of van een school voor h.a.v.o. met gunstig gevolg
      te hebben doorlopen;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel10
  - number: 10.2.b
    text: het diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de theoretische leerweg;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel10
  - number: 10.2.c
    text: |-
      een diploma waaruit blijkt dat een school die aansluitend op het basisonderwijs op grond van de
      [Experimentenwet onderwijs][ref1] heeft geëxperimenteerd met het geven van middenschoolonderwijs, met goed
      gevolg is doorlopen en een bewijs waaruit blijkt dat de resultaten van het gevolgde onderwijs overeenstemmen
      met het niveau dat ingevolge het bepaalde in onderdeel *a* of *b* van dit lid voor toelating van een leerling is
      voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0002718
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002718
  - number: 10.2.d
    text: |-
      een getuigschrift basisvorming van een school die aansluitend op het basisonderwijs op grond van de
      [Experimentenwet onderwijs][ref1] heeft geëxperimenteerd met basisvorming en primair beroepsonderwijs en een
      verklaring waaruit blijkt dat de resultaten van het gevolgde onderwijs overeenstemmen met het niveau dat ingevolge
      het bepaalde in onderdeel *a* of *b* van dit lid voor toelating van een leerling is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002718
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002718
  - number: '10.3'
    text: |-
      De inspectie kan in bijzondere gevallen afwijking van het bepaalde in het tweede lid toestaan, indien de leerling
      naar verwachting het onderwijs in het vierde leerjaar met voldoende resultaat zal kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel10
  - number: '11'
    text: |-
      Alvorens toepassing te geven aan [artikel 27, tiende lid, van de wet][ref1], vergewist de inspectie zich ervan, dat
      het bevoegd gezag de ouders van de betrokken leerling in de gelegenheid heeft gesteld te worden gehoord over het
      verzoek van het bevoegd gezag. De inspectie betrekt bij haar beslissing in elk geval de zienswijze van de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
  - number: '12.1'
    text: |-
      Voorwaardelijke bevordering wordt uitdrukkelijk op het eindrapport vermeld. Bovendien wordt hiervan schriftelijk
      mededeling gedaan aan ouders, voogden of verzorgers, waarbij wordt vermeld het tijdstip waarop definitief omtrent
      de overgang zal worden beslist alsmede de voorwaarden waaraan moet worden voldaan om te kunnen worden bevorderd.
      Dit tijdstip ligt tussen 1 oktober en 1 januari daarop volgend.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel12
  - number: '12.2'
    text: Een leerling wordt niet voorwaardelijk bevorderd tot het hoogste leerjaar.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel12
  - number: '13.1'
    text: Het bevoegd gezag kan met opgave van redenen een leerling voor een periode van ten hoogste één week schorsen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het besluit tot schorsing wordt schriftelijk aan de betrokkene en, indien deze nog niet de leeftijd van 21 jaar
      heeft bereikt, ook aan de ouders, voogden of verzorgers van de betrokkene bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel13
  - number: '13.3'
    text: |-
      Het bevoegd gezag stelt de inspectie van een schorsing voor een periode langer dan één dag schriftelijk en met
      opgave van redenen in kennis.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het bevoegd gezag kan besluiten tot definitieve verwijdering van een leerling nadat deze en, indien de leerling
      nog niet de leeftijd van 18 jaren heeft bereikt, ook diens ouders, voogden of verzorgers, in de gelegenheid is
      onderscheidenlijk zijn gesteld hierover te worden gehoord. Een leerling wordt op grond van onvoldoende vorderingen
      niet in de loop van een schooljaar verwijderd.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel14
  - number: '14.2'
    text: |-
      Definitieve verwijdering van een leerplichtige leerling geschiedt slechts na overleg met de inspectie. Hangende
      dit overleg kan de leerling worden geschorst. Het overleg strekt er mede toe, na te gaan op welke andere wijze de
      betrokken leerling onderwijs zal kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel14
  - number: '14.3'
    text: |-
      Het bevoegd gezag stelt de inspectie van een definitieve verwijdering schriftelijk en met opgave van redenen in
      kennis.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel14
  - number: '15.1'
    text: |-
      De besluiten tot weigering van de toelating van een kandidaat-leerling of tot definitieve verwijdering van een
      leerling worden schriftelijk en met opgave van redenen aan de leerling en, indien deze nog niet de leeftijd van 21
      jaren heeft bereikt, ook aan diens ouders, voogden of verzorgers, bekendgemaakt, waarbij tevens de inhoud van het
      tweede lid wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel15
  - number: '15.2'
    text: Binnen zes weken na de bekendmaking kunnen belanghebbenden bezwaar maken bij het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel15
  - number: '15.3'
    text: |-
      Het bevoegd gezag beslist in overeenstemming met [artikel 27 van de wet][ref1] binnen vier weken na ontvangst van
      het bezwaarschrift, doch niet eerder dan nadat de kandidaat-leerling, onderscheidenlijk de leerling en, indien
      deze nog niet de leeftijd van 18 jaar heeft bereikt, ook diens ouders, voogden of verzorgers, in de gelegenheid is,
      onderscheidenlijk zijn gesteld, te worden gehoord en kennis heeft onderscheidenlijk hebben kunnen nemen van de op
      die besluiten betrekking hebbende adviezen of rapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
  - number: '15.4'
    text: |-
      Het bevoegd gezag kan de desbetreffende leerling, gedurende de behandeling van het bezwaar tegen een besluit tot
      definitieve verwijdering de toegang tot de school ontzeggen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel15
  - number: '16.1'
    text: |-
      De tijd die per cursusjaar ten hoogste voor vakantie van de leerlingen mag worden besteed, bedraagt 72 schooldagen
      bij een zesdaagse schoolweek en 60 schooldagen bij een vijfdaagse schoolweek.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel16
  - number: '16.2'
    text: |-
      Onder schooldag wordt verstaan elke dag van de week met uitzondering van de zondag bij een zesdaagse schoolweek en
      met uitzondering van de zaterdag en de zondag bij een vijfdaagse schoolweek. Niet tot schooldagen worden gerekend:
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel16
  - number: 16.2.a
    text: nieuwjaarsdag, tweede paasdag, hemelvaartsdag, tweede pinksterdag en de beide kerstdagen, alsmede
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel16
  - number: 16.2.b
    text: nationale feestdagen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien aan een bijzondere school onderwijs wordt gegeven gebaseerd op een levensbeschouwing volgens welke andere
      dan de in het tweede lid, onderdeel *a*, genoemde dagen als feestdagen worden aangemerkt, kunnen in plaats daarvan
      ten hoogste zes andere dagen niet tot schooldagen worden gerekend.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel16
  - number: '17'
    text: |-
      Bij ministeriële regeling worden het begin en het einde van de zomervakantie vastgesteld. De begin- en einddatum
      kunnen per groep van scholen verschillen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel17
  - number: '18'
    text: 'Gedurende de periode van basisvorming kunnen de onderstaande vakken in combinatie met elkaar worden gegeven:'
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel18
  - number: 18.a
    text: natuur- en scheikunde, biologie;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel18
  - number: 18.b
    text: twee of drie van de vakken geschiedenis en staatsinrichting, aardrijkskunde, economie;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel18
  - number: 18.c
    text: twee of meer van de vakken behorende tot de beeldende vorming;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel18
  - number: 18.d
    text: informatiekunde en een van de vakken Nederlandse taal, economie, wiskunde, natuur- en scheikunde, techniek.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel18
  - number: '19.1'
    text: |-
      Voor afwijkingen als bedoeld in [artikel 11e, derde lid, eerste volzin, van de wet][ref1] kunnen in aanmerking
      komen leerlingen die naar het oordeel van het bevoegd gezag niet in staat zijn aan het eind van de basisvorming de
      kerndoelen te bereiken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11e
  - number: '19.2'
    text: |-
      Het bevoegd gezag stelt een commissie in die adviseert ten aanzien van welke leerlingen
      [artikel 11e, derde lid, van de wet][ref1] toepassing kan vinden. Het bevoegd gezag regelt de omvang en
      samenstelling van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11e
  - number: '19.3'
    text: |-
      In haar advies doet de commissie aan het bevoegd gezag voorstellen ten aanzien van de aard van de in het tweede lid
      bedoelde afwijkingen. Daarbij geeft zij aan waarop deze voorstellen zijn gegrond.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel19
  - number: '19.4'
    text: 'De commissie betrekt in elk geval bij haar oordeelsvorming:'
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel19
  - number: 19.4.a
    text: |-
      in voorkomende gevallen het in [artikel 3, tweede lid][ref1], bedoelde onderwijskundig rapport en de resultaten van
      het in [artikel 4][ref2] bedoelde onderzoek naar de geschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel4
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005946
        artikel: '4'
        hoofdstuk: II
  - number: 19.4.b
    text: |-
      indien de omstandigheid op grond waarvan afwijking wordt voorgesteld daartoe aanleiding geeft, de van een
      deskundige verkregen verklaring;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel19
  - number: 19.4.c
    text: |-
      de zienswijze van de ouders, voogden of verzorgers van de leerlingen, welke zienswijze blijkt uit een schriftelijke
      verklaring;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel19
  - number: 19.4.d
    text: |-
      de zienswijze van de leraar of leraren, belast met het onderwijs in het betrokken vak of de betrokken vakken, welke
      zienswijze blijkt uit een schriftelijke verklaring.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel19
  - number: '19.5'
    text: |-
      Het advies wordt schriftelijk uitgebracht aan het bevoegd gezag. Indien het bevoegd gezag voornemens is af te
      wijken van het advies van de commissie, overlegt het over dit voornemen met de commissie. De beslissing van het
      bevoegd gezag is met redenen omkleed. Het bevoegd gezag zendt een afschrift van zijn beslissing, vergezeld van het
      advies van de commissie en de daarbij gevoegde verklaringen, bedoeld in het vierde lid, aan de ouders, voogden of
      verzorgers van de betrokken leerlingen, aan de betrokken leraar of leraren en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel19
  - number: '21.1'
    text: |-
      In de eerste drie leerjaren te zamen van een school voor v.w.o. en een school voor h.a.v.o. wordt, naast het
      onderwijs in de vakken genoemd in [artikel 11][ref1], onderwijs verzorgd in een derde moderne taal, zijnde Franse
      taal of Duitse taal. In de eerste drie leerjaren te zamen van een gymnasium wordt daarnaast nog onderwijs verzorgd
      in de vakken Latijnse taal en letterkunde en Griekse taal en letterkunde.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11a
  - number: '21.2'
    text: |-
      Het bevoegd gezag kan goedkeuren dat een leerling van een school als bedoeld in het eerste lid, wordt vrijgesteld
      van het volgen van onderwijs in de vakken Franse taal of Duitse taal, dan wel in deze beide vakken. Deze
      goedkeuring kan slechts worden verleend ten behoeve van leerlingen in de eerste drie leerjaren die:
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel21
  - number: 21.2.a
    text: onderwijs volgen in een van de vakken Spaanse, Russische, Italiaanse, Arabische of Turkse taal, of
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel21
  - number: 21.2.b
    text: |-
      voor de eerste maal tot een school als bedoeld in het eerste lid zijn toegelaten en daarbij zijn geplaatst in een
      hoger leerjaar dan het eerste en voordien buiten Nederland vergelijkbaar onderwijs hebben gevolgd en daarbij geen
      of te weinig onderwijs in het desbetreffende vak hebben genoten.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel21
  - number: '23.1'
    text: |-
      In alle leerjaren tezamen van een school voor v.w.o. of h.a.v.o. wordt in lichamelijke opvoeding ten minste een
      aantal lessen verzorgd, gelijk aan 400 respectievelijk 360 uren.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel23
  - number: '23.2'
    text: |-
      In alle leerjaren tezamen van een school voor m.a.v.o. of v.b.o. wordt in de vakken, vermeld in de onderstaande
      tabel, ten minste het daarbij aangegeven aantal lessen verzorgd, waarbij wordt uitgegaan van lessen van elk 50
      minuten onderwijs:






                    maatschappijleer


                    80




                    kunstvakken


                    320






                    lichamelijke opvoeding


                    400
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel23
  - number: '23.3'
    text: |-
      Indien het onderwijs in een in het tweede lid genoemd vak wordt verzorgd in een geringer aantal minuten per lesuur
      dan 50, dient de totale tijd waarin onderwijs voor dat vak wordt verzorgd, niet te dalen beneden die welke in dat
      lid is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel23
  - number: 25a
    text: |-
      Praktijkonderwijs omvat ten minste Nederlandse taal, rekenen/wiskunde, informatiekunde en lichamelijke opvoeding,
      alsmede de vakken waarvan het bevoegd gezag, na overleg met de gemeente die daarbij de werkgevers betrekt die
      werkzaam zijn op de regionale arbeidsmarkt, heeft vastgesteld dat deze van belang zijn voor het uitoefenen van
      functies binnen die arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel25a
  - number: '26.1'
    text: |-
      Onverminderd [artikel 23][ref1] zijn de adviesurentabellen, bedoeld in [artikel 23 van de wet][ref2], voor v.m.b.o.
      als volgt, waarbij is gerekend met:


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel23
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '23'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '23'
  - number: 26.1.a
    text: lessen van elk 50 minuten,
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26
  - number: 26.1.b
    text: het totaal aantal lessen per vak, en
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26
  - number: 26.1.c
    text: |-
      een totaal van 1280 uren in elk van de eerste drie leerjaren, gebaseerd op 32 lesuren per week, en van 1200 uren in
      het vierde leerjaar, gebaseerd op 30 lesuren per week.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26
  - number: '26.2'
    text: |-
      Waar nodig bevatten de in het eerste lid bedoelde adviesurentabellen een uitsplitsing tussen uren die gelden voor
      alle leerlingen (links van de stippellijn), en uren in aanvulling daarop voor leerlingen die het desbetreffende vak
