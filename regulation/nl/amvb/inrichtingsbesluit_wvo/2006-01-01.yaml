  - number: 26d.1
    text: |-
      Door het bevoegd gezag vast te stellen vakken en andere programma-onderdelen van het vrije deel, behoudens
      godsdienstonderwijs aan bijzondere scholen, hebben een normatieve studielast van 40 uren of een geheel veelvoud
      daarvan. Het bevoegd gezag kan, indien de aard van het desbetreffende andere programma-onderdeel daartoe noodzaakt,
      de studielast van dat andere programma-onderdeel in afwijking van de eerste volzin vaststellen op een kleiner
      aantal dan 40 uren.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26d
  - number: 26d.2
    text: |-
      Indien het bevoegd gezag bij de vaststelling van vakken en andere programma-onderdelen andere instellingen
      of deskundige personen van buiten de school betrekt, kan het onderwijs in die vakken en andere programma-
      onderdelen, onverminderd de verantwoordelijkheid van het bevoegd gezag voor het onderwijs aan de school,
      mede worden verzorgd door die andere instellingen of deskundige personen. Daarbij stelt het bevoegd gezag
      als voorwaarde dat die instellingen of deskundige personen voldoen aan de met betrekking tot hun geldende
      wettelijke voorschriften en voorzover die voorschriften ontbreken, aan de binnen de beroepsgroep algemeen erkende
      normen. [Artikel 33, eerste lid, van de wet][ref1] is ten aanzien van degenen die dit onderwijs verzorgen van
      overeenkomstige toepassing, met dien verstande dat als bewijs van bekwaamheid en bewijs van voldoende pedagogische
      en didactische voorbereiding geldt een kwalificatie die, gelet op de eerste en tweede volzin, passend is. Het
      bevoegd gezag stelt de inspectie in kennis van de kwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
  - number: 26e.1
    text: |-
      Het bevoegd gezag van een school voor v.w.o. of h.a.v.o. kan een leerling, na overleg met de leerling en, indien
      de leerling minderjarig is, met diens ouders, voogden of verzorgers, vrijstelling verlenen van het volgen van het
      onderwijs in het deelvak lichamelijke opvoeding 1 indien de leerling vanwege diens lichamelijke gesteldheid niet
      in staat is dit onderwijs te volgen. Het bevoegd gezag geeft de inspectie kennis van de verleende vrijstelling en
      vermeldt daarbij de gronden waarop deze vrijstelling berust.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
  - number: 26e.2
    text: |-
      De leerling van een school voor v.w.o. die in het bezit is van het diploma h.a.v.o. is vrijgesteld van het volgen
      van onderwijs in de volgende vakken van het gemeenschappelijk deel: algemene natuurwetenschappen, geschiedenis en
      maatschappijleer. Indien het betreft het atheneum is deze leerling tevens vrijgesteld van het volgen van onderwijs
      in het deelvak culturele en kunstzinnige vorming 1.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
  - number: 26e.3
    text: |-
      Het bevoegd gezag van een school voor v.w.o. kan een leerling op diens verzoek, of indien de leerling minderjarig
      is, op verzoek van zijn ouders, voogden of verzorgers, vrijstellen van het volgen van onderwijs in de deelvakken
      Franse taal en letterkunde 1 of Duitse taal en letterkunde 1, genoemd in [artikel 26][ref1], of van beide, in de
      volgende gevallen:


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26b
        hoofdstuk: III
        paragraaf: '3'
  - number: 26e.3.a
    text: |-
      de leerling werd in de eerste drie leerjaren met toepassing van [artikel 21, tweede lid][ref1], vrijgesteld van
      het volgen van onderwijs in de vakken Franse taal of Duitse taal, respectievelijk van het volgen van onderwijs
      in beide;


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel21
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 26e.3.b
    text: |-
      de leerling is voor de eerste maal tot een school voor v.w.o. toegelaten, is geplaatst in een hoger leerjaar dan
      het derde en heeft voordien buiten Nederland vergelijkbaar onderwijs gevolgd en daarbij geen of te weinig onderwijs
      in het overeenkomstige vak, respectievelijk in de overeenkomstige vakken, gevolgd;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
  - number: 26e.3.c
    text: |-
      de leerling is in het bezit van het diploma h.a.v.o. en werd met toepassing van het vierde lid vrijgesteld van het
      volgen van onderwijs in het deelvak moderne taal en letterkunde 1.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
  - number: 26e.4
    text: |-
      Het bevoegd gezag van een school voor h.a.v.o. kan een leerling op diens verzoek, of indien de leerling minderjarig
      is, op verzoek van zijn ouders, voogden of verzorgers, vrijstellen van het volgen van onderwijs in het deelvak
      moderne taal en letterkunde 1, genoemd in [artikel 26][ref1], in de volgende gevallen:


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26c
        hoofdstuk: III
        paragraaf: '3'
  - number: 26e.4.a
    text: |-
      de leerling werd in de eerste drie leerjaren met toepassing van [artikel 21, tweede lid][ref1], vrijgesteld van het
      volgen van onderwijs in de beide vakken Franse taal en Duitse taal;


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel21
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 26e.4.b
    text: |-
      de leerling is voor de eerste maal tot een school voor h.a.v.o. toegelaten, is geplaatst in een hoger leerjaar dan
      het derde en heeft voordien buiten Nederland vergelijkbaar onderwijs gevolgd en daarbij geen of te weinig onderwijs
      in het overeenkomstige vak gevolgd;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
  - number: 26e.4.c
    text: |-
      de leerling is in het bezit van het diploma m.a.v.o. en werd met toepassing van [artikel 11][ref1] vrijgesteld van
      het volgen van het onderwijs in een tweede moderne taal.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11e
  - number: 26e.5
    text: |-
      Het bevoegd gezag kan de in het derde of vierde lid bedoelde vrijstelling in bijzondere gevallen ook verlenen
      aan een leerling die niet voldoet aan een van de in die leden genoemde voorwaarden. De vrijstelling behoeft de
      goedkeuring van de inspectie.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
  - number: 26e.6
    text: |-
      Het bevoegd gezag bepaalt in de in het derde, vierde en vijfde lid genoemde gevallen welk onderwijs voor de
      leerling in de plaats komt van het onderwijs waarvoor vrijstelling is verleend, met dien verstande dat het
      vervangende onderwijs ten minste dezelfde normatieve studielast heeft als het onderwijs waarvoor vrijstelling
      is verleend, en betrekking heeft op taal en letterkunde. Indien het bevoegd gezag van oordeel is dat dit laatste
      niet mogelijk is of ondoelmatig is, stelt het de inspectie daarvan in kennis. Daarbij doet het bevoegd gezag een
      voorstel voor een andere vervanging. Deze vervanging behoeft de goedkeuring van de inspectie.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26e
  - number: 26f
    text: |-
      Het in schooltijd verzorgde onderwijsprogramma, bedoeld in [artikel 12, vijfde lid, van de wet][ref1] omvat in het
      laatste leerjaar van het v.w.o. en h.a.v.o. een aantal van ten minste 700 uren onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel12
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '12'
  - number: 26g.1
    text: |-
      In het derde leerjaar van een school voor m.a.v.o. volgt de leerling in de theoretische leerweg onderwijs in ten
      minste zeven vakken waarin eindexamen kan worden afgelegd, niet behorend tot het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26g
  - number: 26g.2
    text: |-
      Indien de leerling onderwijs in een derde moderne vreemde taal volgt of heeft gevolgd in enig voorafgaand leerjaar,
      is in afwijking van het eerste lid het aantal vakken, bedoeld in dat lid, zes.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26g
  - number: 26h
    text: |-
      De afdelingsvakken, bedoeld in [artikel 10b, zevende lid, onderdeel a, van de wet][ref1], zijn bouwtechniek,
      metaaltechniek, elektrotechniek, voertuigentechniek, installatietechniek, grafische techniek, transport en
      logistiek, verzorging, uiterlijke verzorging, administratie, handel en verkoop, mode en commercie, consumptief, en
      landbouw en natuurlijke omgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
  - number: 26i.1
    text: |-
      De afdelingsvakken, bedoeld in [artikel 10d, zevende lid, onderdeel b, van de wet][ref1], zijn de vakken, genoemd
      in [artikel 26h][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel26h
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref2
        bwb_id: BWBR0005946
        artikel: 26h
        hoofdstuk: III
        paragraaf: '3'
  - number: 26i.2
    text: |-
      In het derde leerjaar volgt de leerling in de gemengde leerweg ten minste onderwijs in zes vakken waarin eindexamen
      kan worden afgelegd, niet behorend tot het gemeenschappelijk deel. Indien de leerling onderwijs in een derde
      moderne vreemde taal volgt of heeft gevolgd in enig voorafgaand leerjaar, is het aantal vakken, bedoeld in de
      eerste volzin, vijf.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26i
  - number: 26j.1
    text: 'De intrasectorale programma''s voor de sector techniek zijn:'
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26j
  - number: 26j.1.a
    text: |-
      het programma metalektro, bestaande uit een combinatie van programma-onderdelen behorende bij de afdelingen
      elektrotechniek en metaaltechniek,
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26j
  - number: 26j.1.b
    text: |-
      het programma bouw-breed, bestaande uit een combinatie van programma-onderdelen behorende bij de afdeling
      bouwtechniek, en
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26j
  - number: 26j.1.c
    text: |-
      het programma instalektro, bestaande uit een combinatie van programma-onderdelen behorende bij de afdelingen
      elektrotechniek en installatietechniek.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26j
  - number: 26j.2
    text: |-
      Het intrasectorale programma voor de sector zorg en welzijn is het programma zorg- en welzijn-breed, bestaande uit
      een combinatie van programma-onderdelen behorende bij de afdelingen verzorging en uiterlijke verzorging.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26j
  - number: 26j.3
    text: 'De intrasectorale programma''s voor de sector economie zijn:'
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26j
  - number: 26j.3.a
    text: |-
      het programma handel en administratie, bestaande uit een combinatie van programma-onderdelen behorende bij de
      afdelingen handel en verkoop, administratie, en mode en commercie, en
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26j
  - number: 26j.3.b
    text: |-
      het programma consumptief-breed, bestaande uit een combinatie van programma-onderdelen behorende bij de afdeling
      consumptief, aangevuld met programma-onderdelen op het gebied van toerisme en recreatie.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26j
  - number: 26j.4
    text: |-
      Het intrasectorale programma voor de sector landbouw is het programma landbouw-breed, bestaande uit een combinatie
      van programma-onderdelen behorende bij de afdeling landbouw en natuurlijke omgeving.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26j
  - number: 26l.1
    text: |-
      Het bevoegd gezag van een school voor v.b.o. of van een scholengemeenschap waarvan tenminste een school voor v.b.o.
      deel uitmaakt kan een intrasectoraal programma verzorgen voor zover deze school of scholengemeenschap gerechtigd
      is onderwijs te verzorgen in de afdelingen onderliggend aan het bijbehorende intrasectorale programma, zoals
      weergegeven in [kolom 3 van Bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005946
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26l
    references:
      - id: ref1
        bwb_id: BWBR0005946
  - number: 26l.2
    text: |-
      Indien het de gemengde leerweg betreft kan de school op iedere vestiging waar afsluitend onderwijs v.b.o. of mavo
      mag worden verzorgd, met inachtneming van het eerste lid, een intrasectoraal programma verzorgen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26l
  - number: 26l.3
    text: |-
      Indien het de basisberoepsgerichte leerweg en de kaderberoepsgerichte leerweg betreft kan de school alleen op de
      vestigingen waar het onderwijs in al de in het eerste lid bedoelde afdelingen daadwerkelijk wordt verzorgd, het
      bijbehorende intrasectorale programma verzorgen.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26l
  - number: 26l.4
    text: |-
      In afwijking van het eerste lid kan een bevoegd gezag ook de intrasectorale programma’s Zorg en Welzijn-breed en
      Handel en Administratie verzorgen, indien
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26l
  - number: 26l.4.a
    text: alleen de afdeling Uiterlijke Verzorging onderscheidenlijk de afdeling Mode en Commercie aanwezig is,
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26l
  - number: 26l.4.b
    text: de belanghebbende scholen in de regio geen bezwaar hebben tegen dit aanbod, en
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26l
  - number: 26l.4.c
    text: |-
      door het bevoegd gezag hiervan voor 1 februari voorafgaand aan het schooljaar waarin het intrasectorale programma
      van start gaat melding wordt gemaakt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26l
  - number: 26m
    text: |-
      Een bevoegd gezag dat een intrasectoraal programma verzorgt als bedoeld in [artikel 26l][ref1], voldoet aan de
      voorschriften van [artikel 10b, eerste lid, van de wet][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel26l
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26m
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: 26l
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
  - number: 26m.a
    text: |-
      het intrasectorale programma wordt aangeboden in de basisberoepsgerichte leerweg en de kaderberoepsgerichte
      leerweg,
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26m
  - number: 26m.b
    text: |-
      het intrasectorale programma wordt aangeboden in de basisberoepsgerichte leerweg en in tenminste één van de
      onderliggende afdelingen in de kaderberoepsgerichte leerweg, of
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26m
  - number: 26m.c
    text: |-
      het intrasectorale programma wordt aangeboden in de kaderberoepsgerichte leerweg en in tenminste één van de
      onderliggende afdelingen in de basisberoepsgerichte leerweg.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26m
  - number: 26n.1
    text: |-
      Het bevoegd gezag van een school voor m.a.v.o. of v.b.o. kan een leerling, na overleg met de leerling en, indien
      de leerling minderjarig is, met diens ouders, voogden of verzorgers, vrijstelling verlenen van het volgen van het
      onderwijs in het vak lichamelijke opvoeding, indien de leerling vanwege diens lichamelijke gesteldheid niet in
      staat is dit onderwijs te volgen. Het bevoegd gezag geeft de inspectie kennis van de verleende vrijstelling en
      vermeldt daarbij de gronden waarop deze vrijstelling berust.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26n
  - number: 26n.2
    text: |-
      Het bevoegd gezag kan goedkeuren dat een vrijstelling die op grond van [artikel 11e van de wet][ref1] voor de
      periode van de basisvorming is verleend voor de tweede moderne vreemde taal, zijnde Franse taal of Duitse taal,
      tevens geldt als vrijstelling voor dat vak voor de periode waarin de leerling onderwijs in de sector economie van
      een van de leerwegen volgt, met dien verstande dat een van de vakken Arabische taal, Turkse taal, Spaanse taal,
      maatschappijleer II, geschiedenis en staatsinrichting, of aardrijkskunde in de plaats komt van het onderwijs in de
      taal waarvoor de vrijstelling is verleend. Deze goedkeuring kan slechts worden verleend ten behoeve van leerlingen
      die:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11e
  - number: 26n.2.a
    text: in de periode van de basisvorming onderwijs in de Arabische taal, Turkse taal of Spaanse taal volgden, of
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26n
  - number: 26n.2.b
    text: |-
      voor de eerste maal tot een school zijn toegelaten en daarbij zijn geplaatst in een hoger leerjaar dan het eerste
      en voordien buiten Nederland vergelijkbaar onderwijs hebben gevolgd en daarbij geen of te weinig onderwijs in het
      desbetreffende vak hebben genoten, of
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26n
  - number: 26n.2.c
    text: |-
      onderwijs gaan volgen in de basisberoepsgerichte leerweg en die in het schooljaar voorafgaand aan het betrokken
      schooljaar leerwegondersteunend onderwijs volgden.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26n
  - number: 26n.3
    text: |-
      Indien toepassing van [artikel 11g, vierde lid, van de wet][ref1] ertoe heeft geleid dat een leerling in de periode
      van basisvorming niet de tweede moderne vreemde taal, zijnde Franse taal of Duitse taal, heeft gevolgd, is ten
      aanzien van die leerling het tweede lid, eerste volzin, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11g
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel26n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11g
  - number: '31.1'
    text: |-
      Deze paragraaf is van toepassing op scholen voor m.a.v.o. voor zover daaraan onderwijs in de gemengde leerweg wordt
      verzorgd, en op scholen voor v.b.o.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel31
  - number: '31.2'
    text: |-
      Deze paragraaf is van overeenkomstige toepassing op arbeidstraining. Onder arbeidstraining wordt verstaan
      het onderricht in de praktijk van de uitoefening van een vak of beroep aan scholen en afdelingen voor
      praktijkonderwijs, bedoeld in [artikel 10f, vijfde lid, van de wet][ref1], voor zover dat onderricht plaatsvindt
      buiten de school of afdeling voor praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
  - number: '32.1'
    text: |-
      In het derde en vierde leerjaar kunnen de lessen in afdelingsvakken of intrasectorale programma's worden besteed
      aan stage, met dien verstande dat in het derde leerjaar de stage ten hoogste 60 lesuren omvat, onverminderd het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel32
  - number: '32.2'
    text: |-
      Voor een school voor praktijkonderwijs bedraagt het in [artikel 10f, vijfde lid, van de wet][ref1] bedoelde
      aantal uren stage of arbeidstraining gedurende de cursusduur gemiddeld ten hoogste 50% van het aantal uren waarin
      onderwijs wordt verzorgd, met dien verstande dat voor leerlingen voor wie de partiële leerplicht nog niet is
      geëindigd, tot het einde van die leerplicht de stage of arbeidstraining per schoolweek ten hoogste 80% bedraagt van
      het aantal uren waarin in die week onderwijs wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
  - number: '33'
    text: Het doel, de inhoud, de omvang, de opbouw en de organisatie van de stage worden beschreven in een stageplan.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel33
  - number: '34'
    text: Een stage wordt doorlopen op een of meer stageplaatsen, ter beschikking gesteld door een of meer stagegevers.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel34
  - number: '35.1'
    text: |-
      Het bevoegd gezag sluit met de leerling en de stagegever te zamen een schriftelijke stage-overeenkomst waaruit
      blijkt dat de leerling leeractiviteiten ontplooit in het kader van het stageplan.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel35
  - number: '35.2'
    text: 'De stage-overeenkomst bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel35
  - number: 35.2.a
    text: |-
      de leeractiviteiten die de leerling bij de aangewezen stagegever op een of meer bepaalde stageplaatsen moet
      ontplooien;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel35
  - number: 35.2.b
    text: |-
      de aanvangsdatum, de einddatum en de tijden van [de onder ][ref1] bedoelde leeractiviteiten;


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel35
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '35'
        hoofdstuk: III
        paragraaf: '6'
  - number: 35.2.c
    text: |-
      een regeling voor de begeleiding van de leerling bij de stagegever waarin in elk geval duidelijk wordt gemaakt welk
      aandeel in de begeleiding door de stageleraar respectievelijk door de stagebegeleider, aan te wijzen door of namens
      het bevoegd gezag onderscheidenlijk de stagegever, wordt verzorgd;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel35
  - number: 35.2.d
    text: de wijze waarop de stagegever bij de beoordeling van de leeractiviteiten van de leerling wordt betrokken;
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel35
  - number: 35.2.e
    text: |-
      een regeling die de inspectie in staat stelt toezicht te houden op de leeractiviteiten die door de leerling bij de
      stagegever worden ontplooid.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel35
  - number: '35.3'
    text: |-
      De stage-overeenkomst bepaalt voorts wie de verzekering tegen het financiële risico van ongevallen en tegen
      wettelijke aansprakelijkheid van de leerling voor de tijd dat deze zich bevindt bij de stagegever zal sluiten en
      ten laste van wie de te betalen premie zal komen, indien een zodanige verzekeringsovereenkomst zal worden gesloten.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel35
  - number: '35.4'
    text: |-
      In geval van minderjarigheid van de leerling wordt de stage-overeenkomst door diens ouders, voogden of verzorgers
      ondertekend.
    url: https://wetten.overheid.nl/BWBR0005946/2006-01-01#Artikel35
  - number: '36'
    text: |-
      Met het oog op de stage kan het bevoegd gezag ten behoeve van de leerlingen een schriftelijke
      samenwerkingsovereenkomst met een of meer stagegevers aangaan waarin mede een of meer onderdelen van de stage-
      overeenkomst, bedoeld in [artikel 35, tweede lid][ref1], worden opgenomen.


