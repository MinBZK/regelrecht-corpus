---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: geheimhoudingsbesluit_kernenergiewet
regulatory_layer: AMVB
publication_date: '2017-11-07'
valid_from: '2018-02-06'
bwb_id: BWBR0002768
url: https://wetten.overheid.nl/BWBR0002768/2018-02-06
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Ministers van Economische Zaken en van Defensie van 28 april 1971, no. 671/222 W.J.A.,
    gedaan in overeenstemming met Onze Ministers van Buitenlandse Zaken, van Binnenlandse Zaken, van Verkeer en
    Waterstaat en van Justitie, de Centrale Raad voor de Kernenergie gehoord;

    Gelet op de artikelen 68 en 76 van de Kernenergiewet (Stb. 1963, 82);

    De Raad van State gehoord (advies van 26 mei 1971, no. 14);

    Gezien het nader rapport van Onze Ministers van Economische Zaken en van Defensie van 11 juni 1971, no. 671/326
    W.J.A., uitgebracht in overeenstemming met Onze Ministers van Buitenlandse Zaken, van Binnenlandse Zaken, van
    Verkeer en Waterstaat en van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Dit besluit geldt ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.1.a
    text: 'gegevens, hulpmiddelen en materialen voor:'
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.1.a.1°
    text: de vrijmaking van kernenergie,
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.1.a.2°
    text: de opslag, vervaardiging, bewerking of verwerking van splijtstoffen en
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.1.a.3°
    text: |-
      de beveiliging van de in [artikel 22 van het Besluit kerninstallaties, splijtstoffen en ertsen][ref1]
      bedoelde splijtstoffen en ertsen, de in
      [artikel 4.7, eerste lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref2] bedoelde radioactieve
      stoffen en inrichtingen als bedoeld in [artikel 15, onder b, van de Kernenergiewet][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0040179
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 1.1.b
    text: |-
      met behulp van zodanige gegevens, hulpmiddelen en materialen verrichte onderzoekingen en toegepaste werkmethoden,
      voor zover deze onderzoekingen en werkmethoden door Onze in het tweede lid genoemde Ministers zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: '1.2'
    text: 'Onze in het eerste lid bedoelde Ministers zijn:'
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.2.a
    text: |-
      in alle gevallen, waarin het opleggen van de verplichting tot geheimhouding gevolgen heeft buiten het terrein van
      de landsverdediging: Onze Minister van Infrastructuur en Milieu;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.2.b
    text: 'in gevallen, waarin de geheimhouding is vereist in het belang van de landsverdediging: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.2.c
    text: |-
      in gevallen, waarin de geheimhouding is vereist in het belang van de internationale rechtsorde of ter voldoening
      aan internationale overeenkomsten of besluiten van volkenrechtelijke organisaties: Onze Minister van Buitenlandse
      Zaken;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.2.d
    text: |-
      in gevallen, waarin de geheimhouding is vereist in het belang van de veiligheid van de staat en het een civiele
      aangelegenheid betreft: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.2.e
    text: |-
      in gevallen, waarin de geheimhouding is vereist in het belang van of het opleggen van de verplichting tot
      geheimhouding gevolgen heeft voor de ontwikkeling en de toepassing van technieken of methoden, welke betrekking
      hebben op of van belang zijn voor het verkeer, het vervoer, de waterstaat, de meteorologie, dan de oceanografie of
      een ander gebied van de geofysica: Onze Minister van Infrastructuur en Milieu;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.2.f
    text: |-
      in gevallen, waarin het opleggen van de verplichting tot geheimhouding gevolgen heeft voor het onderzoek bij
      instellingen van wetenschap, voor zover deze niet ressorteren onder Onze Minister van Economische Zaken: Onze
      Minister van Onderwijs, Cultuur en Wetenschap;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.2.g
    text: |-
      in gevallen, waarin het opleggen van de verplichting tot geheimhouding gevolgen heeft voor het onderzoek bij
      instellingen van wetenschap, voor zover deze ressorteren onder Onze Minister van Economische Zaken: Onze Minister
      van Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.2.h
    text: |-
      in gevallen, waarin het opleggen van de verplichting tot geheimhouding gevolgen heeft voor het toezicht op de
      naleving van wettelijke voorschriften ter bescherming van mensen, dieren, planten of goederen: Onze Ministers van
      Infrastructuur en Milieu, van Sociale Zaken en Werkgelegenheid en van Volksgezondheid, Welzijn en Sport;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: 1.2.i
    text: |-
      in gevallen, waarin de geheimhouding is vereist in het belang van, of het opleggen van de verplichting tot
      geheimhouding gevolgen heeft voor de ontwikkeling en de toepassing van technieken of methoden, welke betrekking
      hebben op of van belang zijn voor de telecommunicatie: Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: '1.3'
    text: |-
      Een verplichting tot geheimhouding als in het eerste lid, onder *a*, bedoeld kan slechts worden opgelegd en
      gegevens, hulpmiddelen, materialen, onderzoekingen en werkmethoden kunnen slechts ingevolge het eerste lid, onder
      *a* of *b*, worden aangewezen, indien dit in het belang van de staat wordt geboden.
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: '1.4'
    text: |-
      Indien een aanwijzing op grond van het eerste lid, onder *a* of *b*, niet uitdrukkelijk tot een of meer bepaalde
      personen is gericht, wordt zij in de *Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel1
  - number: '2.1'
    text: |-
      Degene, die beschikt over gegevens, hulpmiddelen of materialen, dan wel onderzoekingen verricht of werkmethoden
      toepast, ten aanzien waarvan dit besluit geldt, is verplicht ervoor zorg te dragen, dat de maatregelen worden
      getroffen, welke redelijkerwijs nodig zijn om ten aanzien van de betrokken gegevens, hulpmiddelen, materialen,
      onderzoekingen of werkmethoden de geheimhouding te verzekeren.
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel2
  - number: '2.2'
    text: 'Deze maatregelen houden onder meer in, dat:'
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel2
  - number: 2.2.a
    text: |-
      terreinen, gebouwen en ruimten, waar de betrokken gegevens, hulpmiddelen of materialen worden bewaard of gebruikt
      of waar de betrokken onderzoekingen worden verricht of de betrokken werkmethoden worden toegepast, op doelmatige
      wijze worden beveiligd;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel2
  - number: 2.2.b
    text: |-
      werkzaamheden, waarbij gebruik wordt gemaakt van de betrokken gegevens, hulpmiddelen of materialen of waarbij de
      betrokken werkmethoden worden toegepast, dan wel werkzaamheden bij het verrichten van de betrokken onderzoekingen
      uitsluitend worden verricht door personen, die naar het oordeel van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties geacht kunnen worden de verplichting met betrekking tot de geheimhouding naar behoren te
      vervullen;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel2
  - number: 2.2.c
    text: |-
      van de gegevens, behorende tot of ontleend aan de betrokken gegevens, hulpmiddelen, materialen, onderzoekingen of
      werkmethoden alleen kennis wordt genomen door personen, die rechtstreeks bij werkzaamheden als onder *b* bedoeld
      zijn betrokken en slechts in die mate als voor een goede uitvoering van die werkzaamheden nodig is;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel2
  - number: 2.2.d
    text: |-
      voor zover Onze Ministers dit verlangen, ten aanzien van de betrokken hulpmiddelen of materialen en ten aanzien
      van de gegevens, behorende tot of ontleend aan de betrokken gegevens, hulpmiddelen, materialen, onderzoekingen
      of werkmethoden, een administratie wordt gevoerd, waaruit te allen tijde blijkt, op welk tijdstip en aan wie
      bepaalde gegevens, hulpmiddelen of materialen zijn verstrekt en gedurende welk tijdsverloop een bepaald persoon die
      gegevens, hulpmiddelen of materialen onder zich heeft gehad.
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel2
  - number: '2.3'
    text: |-
      Voorts dient degene, die beschikt over gegevens, hulpmiddelen of materialen, dan wel onderzoekingen verricht of
      werkmethoden toepast, ten aanzien waarvan dit besluit geldt, ervoor zorg te dragen, dat:
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel2
  - number: 2.3.a
    text: |-
      aan Onze Ministers door hen aangegeven inlichtingen worden verstrekt betreffende de betrokken gegevens,
      hulpmiddelen, materialen, onderzoekingen of werkmethoden;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel2
  - number: 2.3.b
    text: |-
      Onze Ministers en, ingeval deze volgens het vierde lid niet daartoe behoort, Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties, en de Autoriteit onverwijld worden ingelicht, indien ernstige inbreuken op de naleving van
      de ter verzekering van de geheimhouding getroffen maatregelen, dan wel spionage worden vermoed of ontdekt;
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel2
  - number: 2.3.c
    text: |-
      een aan de betrokken onderneming of instelling verbonden functionaris wordt aangewezen, speciaal belast met het
      treffen van maatregelen ter verzekering van de geheimhouding en met het toezicht op de naleving daarvan.
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel2
  - number: '2.4'
    text: |-
      In het tweede en derde lid wordt onder Onze Ministers verstaan Onze Ministers, van wie of met wier instemming
      de betrokken gegevens, hulpmiddelen of materialen onder verplichting tot geheimhouding zijn verkregen, dan wel
      Onze Ministers, die de betrokken gegevens, hulpmiddelen, materialen, onderzoekingen of werkmethoden op grond van
      [artikel 1, eerste lid, onder a of b][ref1], hebben aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002768#Artikel1
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002768
        artikel: '1'
  - number: '3.1'
    text: 'Dit besluit kan worden aangehaald als: Geheimhoudingsbesluit Kernenergiewet.'
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel3
  - number: '3.2'
    text: |-
      Het treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad*, waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0002768/2018-02-06#Artikel3
