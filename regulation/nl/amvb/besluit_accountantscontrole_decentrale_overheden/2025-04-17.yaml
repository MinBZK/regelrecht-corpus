  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties mede namens Onze Minister van
    Financiën van 9 mei 2003, FO2003/56474;

    Gelet op artikel 217, zesde lid, van de Provinciewet en artikel 213, zesde lid, van de Gemeentewet;

    De Raad van State gehoord (advies van 16 juni 2003, nr. W04.03.0175/I;

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, mede namens Onze Minister
    van Financiën, van 19 augustus 2003 (FO2003/69873);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015524/2025-04-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder:

        - *afwijking:* verschil tussen het bedrag, de rubricering, de presentatie of de toelichting van een gerapporteerd
      element in een financieel overzicht en het bedrag, de rubricering, de presentatie of de toelichting zodat het
      element in overeenstemming is met het van toepassing zijnde stelsel inzake financiële verslaggeving waarbij
      afwijkingen kunnen voortkomen uit fouten of uit fraude;
        - *deelverantwoording:* in opdracht van provinciale staten, de raad, het algemeen bestuur onderscheidenlijk de
      eilandsraad opgestelde afzonderlijke verantwoording van een deel van de organisatie van de provincie, de gemeente,
      het waterschap of het openbaar lichaam;
        - *financiële rechtmatigheid:* rechtmatige totstandkoming van de baten, lasten en balansmutaties in overeenstemming
      met de begroting en met relevante wettelijke voorschriften, waaronder mede begrepen de provinciale, gemeentelijke
      of waterschapsverordeningen;
        - *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0015524/2025-04-17#Artikel1
  - number: 1a
    text: |-
      De [artikelen 3a][ref1] en [5, vierde lid][ref2], van dit besluit zijn niet van toepassing op de openbare lichamen
      en de waterschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0015524#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0015524#Artikel5
    url: https://wetten.overheid.nl/BWBR0015524/2025-04-17#Artikel1a
