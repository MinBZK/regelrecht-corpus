  - number: '3'
    text: |-
      Naast de kwantitatieve fouten en onzekerheden in de controle houdt de accountant bij de controle en de
      oordeelsvorming rekening met kwalitatieve aspecten. Indien kwalitatieve aspecten daartoe aanleiding geven kan de
      accountant een goedkeurende accountantsverklaring onthouden.
    url: https://wetten.overheid.nl/BWBR0015524/2025-04-17#Artikel3
  - number: 3a
    text: |-
      De accountant beoordeelt voor elke specifieke uitkering of er sprake is van risico’s die richtinggevend zijn
      voor de inrichting van de accountantscontrole. Indien de provincie of gemeente een of meer specifieke uitkeringen
      ontvangt met een omvang van tenminste € 125.000 in het verantwoordingsjaar voert de accountant in ieder geval voor
      elk van die specifieke uitkeringen een deelwaarneming uit.
    url: https://wetten.overheid.nl/BWBR0015524/2025-04-17#Artikel3a
  - number: '4'
    text: |-
      1 Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister
      van Infrastructuur en Waterstaat kunnen modellen worden vastgesteld voor de provincie, voor de gemeente, voor
      het waterschap onderscheidenlijk voor het openbaar lichaam die de accountant hanteert voor de formulering van de
      controleverklaring.

      2 Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan een protocol worden vastgesteld
      voor de provincie, de gemeente, onderscheidenlijk het openbaar lichaam voor de door de accountant te volgen
      procedure, voor de controle van specifieke uitkeringen.

      3 Voor de strekking van de controleverklaring hanteert de accountant de uitgangspunten en de tabel, zoals opgenomen
      in de bijlage.
    url: https://wetten.overheid.nl/BWBR0015524/2025-04-17#Artikel4
  - number: '5'
    text: |-
      1 De bedragen voor de rapporteringstoleranties die de accountant hanteert ten behoeve van de rapportering in het
      verslag van bevindingen zijn de bedragen die voortvloeien uit de goedkeuringstoleranties.

      2 Provinciale staten, de raad, het algemeen bestuur onderscheidenlijk de eilandsraad kunnen de accountant
      bedragen voor de rapporteringstoleranties voorschrijven die lager zijn dan de bedragen die voortvloeien uit de
      goedkeuringstoleranties.

      3 Indien de accountant kwalitatieve gebreken van noemenswaardig belang constateert, meldt hij deze in het verslag
      van bevindingen, ook indien deze gebreken niet leiden tot het onthouden van een goedkeurende accountantsverklaring.

      4 In het verslag van bevindingen van de accountant wordt per specifieke uitkering gerapporteerd met een
      rapporteringstolerantie gebaseerd op de lasten van de specifieke uitkering in het verantwoordingsjaar of, bij
      meerjarige financiële afrekening op basis van prestatieafspraken, gebaseerd op het totale voorschot per specifieke
      uitkering, in alle gevallen met een ondergrens van te melden bevindingen van:

      a. € 12.500 indien de lasten kleiner dan of gelijk aan € 125.000 zijn;

      b. 10% indien de lasten groter dan € 125.000 en kleiner dan of gelijk aan € 1.000.000 zijn;

      c. € 125.000 indien de lasten groter dan € 1.000.000 zijn.
    url: https://wetten.overheid.nl/BWBR0015524/2025-04-17#Artikel5
  - number: '6'
    text: |-
      Dit besluit berust mede op
      [artikel 38, zevende lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] en
      [artikel 109, zesde lid, van de Waterschapswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel109
