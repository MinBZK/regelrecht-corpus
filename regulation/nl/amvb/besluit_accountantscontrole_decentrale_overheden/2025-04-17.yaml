        bwb_id: BWBR0015524
        artikel: '5'
  - number: '2'
    text: |-
      1 De accountant gebruikt ten behoeve van de controle van de jaarrekening van de provincie, bedoeld
      in [artikel 217, derde lid, van de Provinciewet][ref1], de jaarrekening van de gemeente, bedoeld in
      [artikel 213, derde lid, van de Gemeentewet][ref2] en de jaarrekening van het waterschap, bedoeld in
      [artikel 109, derde lid, van de Waterschapswet][ref3], een goedkeuringstolerantie van 2% van de omvangsbasis. Deze
      goedkeuringstolerantie geldt voor de gehele jaarrekening, inclusief de bijlagen.

      2 De goedkeuringstolerantie is de som van de afwijkingen in de jaarrekening en onzekerheden in de uitvoering van
      de controle.

      3 De omvangsbasis is gelijk aan de totale lasten van de provincie respectievelijk de gemeente en het waterschap
      exclusief de toevoegingen aan de reserves.

      4 De accountant onderzoekt of de baten en lasten, alsmede de balansmutaties met betrekking tot specifieke
      uitkeringen als bedoeld in [artikel 17 van de Financiële-verhoudingswet][ref4] rechtmatig tot stand zijn gekomen
      en neemt de uitkomst hiervan op in een aparte sectie in de accountantsverklaring. De verklaring over eisen aan
      specifieke uitkeringen is gebaseerd op een oordeel over alle rechtmatigheidscriteria.

      5 De accountant richt de controle zodanig in dat een redelijke mate van zekerheid bestaat dat afwijkingen van
      materieel belang in de controle worden ontdekt.

      6 De accountant onthoudt een goedkeurende accountantsverklaring aan de jaarrekening indien de
      goedkeuringstolerantie wordt overschreden. Tevens onthoudt de accountant een goedkeurende accountantsverklaring
      wanneer in de rechtmatigheidsverantwoording geen melding wordt gemaakt van afwijkingen in de financiële
      rechtmatigheid die groter zijn dan de verantwoordingsgrens. De accountant gaat hiertoe niet over dan nadat
      gedeputeerde staten, respectievelijk het college en het dagelijks bestuur in de gelegenheid is gesteld dit verzuim
      te herstellen.

      7 Indien provinciale staten respectievelijk de raad en het algemeen bestuur, opdracht geven over een
      deelverantwoording een afzonderlijke controleverklaring af te geven, dan is de goedkeuringstolerantie van
      overeenkomstige toepassing. Voor activiteiten van het onderdeel van de organisatie van de provincie, de gemeente
      en het waterschap kan de accountant voor de berekening van de goedkeuringstolerantie voor een deelverantwoording
      gemotiveerd kiezen voor een andere omvangsbasis dan de totale lasten van de deelverantwoording.

      8 Provinciale staten, respectievelijk de raad en het algemeen bestuur kunnen de goedkeuringstolerantie voor de
      jaarrekening of voor deelverantwoordingen op een lager percentage vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel109
      [ref4]: https://wetten.overheid.nl/BWBR0008290#Artikel17
    url: https://wetten.overheid.nl/BWBR0015524/2025-04-17#Artikel2
