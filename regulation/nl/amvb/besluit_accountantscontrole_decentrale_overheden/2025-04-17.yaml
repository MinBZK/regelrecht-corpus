  - number: 2a
    text: |-
      1 De accountant gebruikt ten behoeve van de oordeelsvorming over de jaarrekening van het openbaar lichaam, bedoeld
      in [artikel 38, vierde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], de
      volgende goedkeuringstoleranties:

      a. ten aanzien van afwijkingen in de jaarrekening 1% van de omvangsbasis en

      b. ten aanzien van onzekerheden in de controle 3% van de omvangsbasis.

      2 De omvangsbasis is gelijk aan de totale lasten van het openbaar lichaam.

      3 De afwijkingen in de jaarrekening en de onzekerheden in de controle kunnen betrekking hebben op:

      a. het getrouwe beeld, bedoeld in
      [artikel 38, vierde lid, onder a, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref2],
      of

      b. de rechtmatigheid van de baten, lasten en balansmutaties, bedoeld in
      [artikel 38, vierde lid, onder b, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref3].

      4 De accountant richt zijn controle zodanig in dat een redelijke mate van zekerheid bestaat dat afwijkingen
      en onzekerheden in de controle die afzonderlijk of gezamenlijk de goedkeuringstoleranties in de jaarrekening
      respectievelijk onzekerheden in de controle worden ontdekt.

      5 De accountant onthoudt een goedkeurende accountantsverklaring aan de jaarrekening indien één der of beide
      goedkeuringstoleranties worden overschreden.

      6 Indien de eilandsraad opdracht geeft over een deelverantwoording een afzonderlijke accountantsverklaring af te
      geven, dan zijn de goedkeuringstoleranties ten aanzien van afwijkingen in de deelverantwoording 1% en ten aanzien
      van onzekerheden in de controle 3% van de omvangsbasis van die deelverantwoording. Op grond van (bijzondere)
      activiteiten van het onderdeel van de eilandelijke organisatie kan de accountant voor de berekening van de
      goedkeuringstoleranties voor bepaalde deelverantwoordingen gemotiveerd kiezen voor een andere omvangsbasis dan de
      totale lasten van de deelverantwoording.

      7 De eilandsraad kan de goedkeuringstoleranties voor de gehele jaarrekening of voor deelverantwoordingen op een
      lager percentage vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0028151#Artikel38
