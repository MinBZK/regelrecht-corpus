        artikel: '5'
  - number: '2'
    text: |-
      1 De accountant gebruikt ten behoeve van de oordeelsvorming over de jaarrekening van de
      provincie, bedoeld in [artikel 217, derde lid, van de Provinciewet][ref1], de jaarrekening van
      de gemeente, bedoeld in [artikel 213, derde lid, van de Gemeentewet][ref2], onderscheidenlijk
      [artikel 38, vierde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref3], de
      volgende goedkeuringstoleranties:

      a) ten aanzien van fouten in de jaarrekening 1% van de omvangsbasis en

      b) ten aanzien van onzekerheden in de controle 3% van de omvangsbasis.

      2 De omvangsbasis is gelijk aan de totale lasten van de provincie, de gemeente onderscheidenlijk het openbaar
      lichaam.

      3 De fouten in de jaarrekening en de onzekerheden in de controle kunnen betrekking hebben op:

      a. het getrouwe beeld, bedoeld in [artikel 217, derde lid, onder a van de Provinciewet][ref4],
      [artikel 213, derde lid, onder a van de Gemeentewet][ref5] onderscheidenlijk
      [artikel 38, vierde lid, onder a, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref6],
      of

      b. de rechtmatigheid van de baten, lasten en balansmutaties, bedoeld
      in [artikel 217, derde lid, onder b van de Provinciewet][ref7],
      [artikel 213, derde lid, onder b van de Gemeentewet][ref8], onderscheidenlijk
      [artikel 38, vierde lid, onder b, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref9].

      4 De accountant richt zijn controle zodanig in dat een redelijke mate van zekerheid bestaat dat fouten
      en onzekerheden die afzonderlijk of gezamenlijk de goedkeuringstoleranties voor fouten in de jaarrekening
      respectievelijk onzekerheden in de controle overschrijden worden ontdekt.

      5 De accountant onthoudt een goedkeurende accountantsverklaring aan de jaarrekening indien één der of beide
      goedkeuringstoleranties, zoals opgenomen in het eerste lid, worden overschreden.

      6 Indien provinciale staten, de raad, onderscheidenlijk de eilandsraad opdracht geven over een deelverantwoording
      een afzonderlijke accountantsverklaring af te geven, dan zijn de goedkeuringstoleranties ten aanzien van fouten
      in de deelverantwoording 1% en ten aanzien van onzekerheden in de controle 3% van de omvangsbasis van die
      deelverantwoording. Op grond van (bijzondere) activiteiten van het onderdeel van de provinciale, gemeentelijke
      onderscheidenlijk eilandelijke organisatie kan de accountant voor de berekening van de goedkeuringstoleranties
      voor bepaalde deelverantwoordingen gemotiveerd kiezen voor een andere omvangsbasis dan de totale lasten van de
      deelverantwoording.

      7 Provinciale staten, de raad, onderscheidenlijk de eilandsraad kunnen de goedkeuringstoleranties voor de gehele
      jaarrekening of voor deelverantwoordingen op een lager percentage vaststellen.


