preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 15 november 2005, nr. WJZ 5712882;

    Gelet op de artikelen 16, negende lid, en 95f, tweede lid, van de Elektriciteitswet 1998 en op de artikelen 10a,
    vierde lid en 47, tweede lid, van de Gaswet;

    De Raad van State gehoord (advies van 12 januari 2006, nr. W10.05.0503/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 8 februari 2006, nr. WJZ 6009332;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
  - number: 1.b
    text: |-
      kleinverbruiker: in [artikel 95a, eerste lid, van de wet][ref1] bedoelde afnemer;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
  - number: 1.c
    text: |-
      leveringsvergunning: vergunning, bedoeld in [artikel 95a, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
  - number: 1.d
    text: 'beschikking: een beschikking tot intrekking van een leveringsvergunning.'
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel1
  - number: '2.1'
    text: |-
      De vergunninghouder doet, indien hij voorziet of behoort te voorzien dat hij niet langer in staat zal zijn om zijn
      plicht tot levering van elektriciteit aan zijn kleinverbruikers na te komen of indien hij surseance van betaling
      heeft aangevraagd dan wel te zijnen aanzien faillissement is aangevraagd, daarvan onverwijld mededeling aan de
      netbeheerder van het landelijk hoogspanningsnet en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: '2.2'
    text: |-
      Indien een netbeheerder uit de hem ter beschikking staande gegevens redenen heeft om te vermoeden, dat de
      continuïteit van de levering door een vergunninghouder in gevaar komt, meldt hij dat zo spoedig mogelijk aan de
      netbeheerder van het landelijk hoogspanningsnet en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: '2.3'
    text: |-
      De vergunninghouder dan wel, indien aan deze surseance van betaling is verleend onderscheidenlijk deze failliet
      is verklaard, de bewindvoerder en vergunninghouder tezamen, onderscheidenlijk de curator, plegen op verzoek
      van Onze Minister overleg met hem en met de netbeheerder van het landelijk hoogspanningsnet met het oog op zijn
      leveringsplicht en de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: '2.4'
    text: |-
      Een beschikking treedt ten hoogste twintig werkdagen na de dag, waarop die beschikking is genomen, in werking. De
      vergunninghouder dan wel de bewindvoerder en vergunninghouder tezamen onderscheidenlijk de curator geeft daarvan
      onverwijld bericht aan de kleinverbruikers aan wie hij elektriciteit levert.
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: '2.5'
    text: |-
      Tot en met tien werkdagen na het tijdstip waarop een beschikking is genomen, of indien dat korter is, tot het
      tijdstip waarop een beschikking in werking is getreden, is ingetrokken of tot het tijdstip waarop Onze Minister
      besluit het zesde lid toe te passen:
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: 2.5.a
    text: |-
      zijn de kleinverbruikers van de betrokken vergunninghouder niet bevoegd hun verbintenis op te schorten, en voert
      een netbeheerder geen leverancierswisseling op verzoek van die kleinverbruikers uit;
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: 2.5.b
    text: |-
      draagt de vergunninghouder dan wel de bewindvoerder en vergunninghouder tezamen, onderscheidenlijk
      de curator het bestand aan kleinverbruikers die gedurende de in aanhef bedoelde periode een
      verbintenis met de vergunninghouder hebben en dat in ieder geval de gegevens, bedoeld in
      [artikel 3, tweede lid, onderdeel b, van het Besluit vergunning levering elektriciteit aan kleinverbruikers][ref1]
      omvat, zo spoedig mogelijk over aan één of meer andere vergunninghouders, die de levering van elektriciteit aan de
      betrokken kleinverbruikers voortzetten;


      [ref1]: https://wetten.overheid.nl/BWBR0015051#Artikel3
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015051
        artikel: '3'
  - number: 2.5.c
    text: |-
      staat de netbeheerder van het landelijk hoogspanningsnet op verzoek van de vergunninghouder dan wel de
      bewindvoerder en de vergunninghouder tezamen onderscheidenlijk de curator garant voor de betaling van de inkoop
      van elektriciteit ten behoeve van de levering van elektriciteit aan kleinverbruikers in die periode indien de
      vergunninghouder dan wel de bewindvoerder en de vergunninghouder tezamen onderscheidenlijk de curator bij het
      verzoek aantoont dat de bestaande kredietruimte onvoldoende is om te waarborgen dat gedurende de in de aanhef
      bedoelde periode de levering van elektriciteit kan worden voortgezet.
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: '2.6'
    text: |-
      Indien op de elfde werkdag na het tijdstip waarop een beschikking is genomen deze beschikking niet inwerking is
      getreden of niet is ingetrokken, of indien dat korter is, het tijdstip waarop Onze Minister besluit dit lid toe
      te passen:
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: 2.6.a
    text: |-
      draagt de vergunninghouder dan wel de bewindvoerder en vergunninghouder tezamen, onderscheidenlijk
      de curator op de in de aanhef bedoelde dag het bestand aan kleinverbruikers die nog een
      verbintenis met de vergunninghouder hebben en dat in ieder geval de gegevens, bedoeld in
      [artikel 3, tweede lid, onderdeel b, van het Besluit vergunning levering elektriciteit aan kleinverbruikers][ref1]
      omvat, over aan de netbeheerder van het landelijk hoogspanningsnet;


      [ref1]: https://wetten.overheid.nl/BWBR0015051#Artikel3
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015051
        artikel: '3'
  - number: 2.6.b
    text: |-
      draagt netbeheerder van het landelijk hoogspanningsnet er zorg voor dat de levering van elektriciteit aan
      kleinverbruikers, die gedurende de periode tussen de in aanhef bedoelde dag en het tijdstip van inwerkingtreding
      van de beschikking nog een overeenkomst met de betrokken vergunninghouder hebben, wordt voortgezet door een andere
      vergunninghouder waarbij hij de gegevens, bedoeld in onderdeel a, van de betreffende kleinverbruikers overdraagt
      aan de betrokken vergunninghouders en geeft hij daartoe aanwijzingen aan de netbeheerders. Daartoe coördineert
      hij de verdeling van die kleinverbruikers over de andere vergunninghouders en geeft daartoe aanwijzingen aan de
      netbeheerders. Netbeheerders verstrekken aan de netbeheerder van het landelijk hoogspanningsnet de gegevens, die
      deze nodig heeft ter uitvoering van deze taak. De verdeling geschiedt naar evenredigheid van het totale aantal
      kleinverbruikers dat de andere vergunninghouders reeds beleveren, tenzij Onze Minister tot een andere wijze van
      verdeling besluit;
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: 2.6.c
    text: |-
      zet de aldus aangewezen vergunninghouder met een overeenkomst voor onbepaalde tijd en verder onder zijn voorwaarden
      de levering van elektriciteit aan de aan hem toegewezen kleinverbruikers vanaf de datum van toedeling voort;
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: 2.6.d
    text: |-
      zijn de kleinverbruikers van de betrokken vergunninghouder tot de datum van toedeling aan de aangewezen leverancier
      niet bevoegd hun verbintenis op te schorten, en voert een netbeheerder geen leverancierswisseling op verzoek van
      die kleinverbruikers uit;
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: 2.6.e
    text: |-
      staat de netbeheerder van het landelijk hoogspanningsnet, voor zover dat redelijkerwijs noodzakelijk is om te
      waarborgen dat gedurende de periode tussen de in aanhef bedoelde dag en het tijdstip van inwerkingtreding van de
      beschikking de levering van elektriciteit kan worden voortgezet, op verzoek van de vergunninghouder dan wel de
      bewindvoerder en de vergunninghouder tezamen onderscheidenlijk de curator garant voor de betaling van de inkoop
      van elektriciteit ten behoeve van de levering aan kleinverbruikers die in die periode nog een overeenkomst met
      de betrokken vergunninghouder hebben indien de vergunninghouder dan wel de bewindvoerder en de vergunninghouder
      tezamen onderscheidenlijk de curator bij het verzoek aantoont dat de bestaande kredietruimte onvoldoende is om te
      waarborgen dat gedurende deze periode de levering van elektriciteit kan worden voortgezet;
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: 2.6.f
    text: |-
      staat de netbeheerder van het landelijk hoogspanningsnet, voor zover dat redelijkerwijs noodzakelijk is om te
      waarborgen dat gedurende de periode tussen de in de aanhef bedoelde dag en het tijdstip van inwerkingtreding van
      de beschikking en ten hoogste de daaropvolgende twee maanden de levering van elektriciteit kan worden voortgezet,
      op verzoek van een vergunninghouder aan wie op grond van onderdeel b kleinverbruikers zijn toegedeeld garant
      voor de betaling van de inkoop van elektriciteit ten behoeve van de levering van elektriciteit aan de toebedeelde
      kleinverbruikers in die periode indien de vergunninghouder bij het verzoek aantoont dat de bestaande kredietruimte
      onvoldoende is om te waarborgen dat gedurende in deze periode en in de daaropvolgende twee maanden de levering van
      elektriciteit aan de toegedeelde kleinverbruikers kan worden voortgezet.
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: '2.7'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet brengt aan alle vergunninghouders, naar evenredigheid van
      het aantal kleinverbruikers dat zij beleveren, een deel van de te zijnen laste blijvende kosten, gemaakt ter
      uitvoering van zijn taak bedoeld in het vijfde lid, onderdeel c en zesde lid, onderdelen e en f, in het geval
      dat de vergunninghouder de verplichtingen uit de garantstelling niet nakomt vanwege surseance van betaling of
      faillissement, in rekening. Elke vergunninghouder berekent het desbetreffende bedrag door aan de kleinverbruikers
      die hij elektriciteit levert, waarbij elke kleinverbruiker een gelijk bedrag in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: '2.8'
    text: |-
      Vergunninghouders hanteren in hun overeenkomsten met kleinverbruikers voorwaarden die in overeenstemming zijn met
      hetgeen bij of krachtens de wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: '2.9'
    text: |-
      De inkoopcontracten van vergunninghouders bevatten geen beding tot ontbinding van rechtswege van die overeenkomsten
      ingeval aan de vergunninghouder surseance van betaling is verleend of deze failliet is verklaard, dan wel
      ingeval diens surseance of faillissement is aangevraagd, dan wel ingeval diens vergunning zal worden ingetrokken,
      noch bedingen die het de toeleverende producent of handelaar mogelijk maken in die gevallen de nakoming van de
      verbintenis op te schorten of te ontbinden of onder gewijzigde voorwaarden voort te zetten, een en ander voor zover
      betrekking hebbend op de levering van elektriciteit ten behoeve van kleinverbruikers.
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel2
  - number: '4'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit leveringszekerheid Elektriciteitswet 1998.'
    url: https://wetten.overheid.nl/BWBR0019567/2018-10-01#Artikel5
