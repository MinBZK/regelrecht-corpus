  - number: '8'
    text: |-
      1 Voor de toepassing van dit besluit wordt niet als dienstbetrekking beschouwd de arbeidsverhouding van de persoon:

      a. die arbeid verricht als zelfstandige als bedoeld in
      [artikel 4 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1];

      b. die arbeid verricht uitsluitend voor rekening en risico van de onderneming van de rechtspersoon waarvan hij
      directeur-grootaandeelhouder is;

      c die het verrichten van de arbeid rechtstreeks is overeengekomen met een natuurlijk persoon ten behoeve van diens
      persoonlijke aangelegenheden;

      d. die arbeid van overwegend geestelijke aard verricht;

      e. die werkzaam is in een arbeidsverhouding, die in overwegende mate wordt beheerst door een familieverhouding.

      2 Onze Minister is bevoegd regels te stellen met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0004090/2009-01-01#Artikel8
