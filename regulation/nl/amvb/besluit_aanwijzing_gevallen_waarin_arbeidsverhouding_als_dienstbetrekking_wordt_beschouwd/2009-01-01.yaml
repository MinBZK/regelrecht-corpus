  - number: 5a
    text: |-
      1 Als dienstbetrekking wordt beschouwd de arbeidsverhouding van de persoon die als sekswerker persoonlijk arbeid
      verricht, tenzij wordt voldaan aan bij ministeriële regeling te stellen regels.

      2 Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt verstaan onder sekswerker: de persoon
      die tegen betaling seksuele handelingen met of voor een ander verricht.
    url: https://wetten.overheid.nl/BWBR0004090/2009-01-01#Artikel5a
  - number: '6'
    text: |-
      Als werkgever wordt beschouwd in de gevallen, bedoeld in de [artikelen 3][ref1], [5][ref2] en [5a][ref3], de
      natuurlijke persoon op wie of het lichaam waarop de verplichting rust het loon te betalen, niet zijnde, in de
      gevallen, bedoeld in [artikel 5a, eerste lid][ref4], degene, bedoeld in [artikel 5a, tweede lid][ref5], met of voor
      wie de seksuele handelingen worden verricht.


