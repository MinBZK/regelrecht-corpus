preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 24 november 1986, Directoraat-
    Generaal Sociale Zekerheid, Directie Sociale Verzekeringen, Hoofdafdeling Werknemersverzekeringen, Afdeling
    Werkloosheidsregelingen, nr. SZ/SV/WV/WW/SVW/86/09845;

    Gelet op artikel 5 van de Wet op de arbeidsongeschiktheidsverzekering (Stb. 1977, 492), artikel 5 van de Ziektewet
    (Stb. 1967, 473) en artikel 5 van de Werkloosheidswet (Stb. 1986, 566);

    De Raad van State gehoord (advies van 16 december 1986, nr. W12.86.0607);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 19 december 1986, nr.
    SVW/86/10736;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004090/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Als dienstbetrekking in de zin van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] (*Stb.* 1977, 492),
      de [Ziektewet][ref2] (*Stb.* 1967, 473) en de [Werkloosheidswet][ref3] (*Stb.* 1986, 566) wordt beschouwd de
      arbeidsverhouding van de persoon die als thuiswerker arbeid verricht en van de persoon die hem als hulp bij het
      verrichten van zijn arbeid bijstaat, indien zij deze arbeid persoonlijk verrichten.

      2 De arbeidsverhouding, bedoeld in het eerste lid, wordt slechts als dienstbetrekking beschouwd indien:

      a. zij is aangegaan voor een aaneengesloten periode van ten minste dertig dagen;

      b. het bruto-inkomen uit deze arbeidsverhouding per maand doorgaans ten minste 40% van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel ][ref4] (*Stb.* 1968, 657) zal bedragen;

      c. voor de persoon jonger dan 23 jaar, wiens bruto-inkomen uitsluitend in verband met zijn leeftijd op een lager
      bedrag dan als bedoeld in onderdeel *b* is vastgesteld, het bruto-inkomen uit deze arbeidsverhouding doorgaans
      ten minste 40% van het voor zijn leeftijd geldende minimumloon, bedoeld in [artikel 7][ref5], derde lid, en
      [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref6] zal bedragen.

      3 Indien binnen dertig dagen na het einde van een arbeidsverhouding met dezelfde opdrachtgever een nieuwe
      arbeidsverhouding wordt aangegaan, geldt het tweede lid, onderdeel *a*, niet voor die nieuwe arbeidsverhouding,
      tenzij de tijdvakken waarvoor de arbeidsverhoudingen zijn aangegaan te zamen korter zijn dan dertig dagen.

      4 Hetgeen een thuiswerker en de persoon die hem als hulp bij het verrichten van de arbeid bijstaat gezamenlijk aan
      bruto-inkomen ontvangen, wordt voor de toepassing van het tweede lid, onderdeel *b* en *c*, geacht door ieder van
      hen voor een gelijk deel te zijn ontvangen, tenzij van een andere verdeling blijkt.


