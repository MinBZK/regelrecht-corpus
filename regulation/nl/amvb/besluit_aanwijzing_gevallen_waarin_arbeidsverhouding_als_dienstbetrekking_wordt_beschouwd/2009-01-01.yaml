  - number: '2'
    text: |-
      Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van de thuiswerker die:

      a. zich doorgaans laat bijstaan door meer dan twee andere personen, niet zijnde zijn echtgenoot of zijn tot zijn
      huishouden behorende minderjarige kinderen;

      b. behoort tot een groep personen, aangewezen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004090/2009-01-01#Artikel2
  - number: '3'
    text: |-
      1 Zonodig in afwijking van de [artikelen 3, 4 en 5, onderdeel ][ref1], de [Ziektewet][ref2] en de
      [Werkloosheidswet][ref3] wordt als dienstbetrekking beschouwd de arbeidsverhouding van de persoon die persoonlijk
      arbeid verricht ten behoeve van een derde door tussenkomst van de natuurlijke persoon tot wie of van het lichaam
      tot welk de arbeidsverhouding bestaat.

      2 Het eerste lid is niet van toepassing in gevallen, aangewezen door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004090/2009-01-01#Artikel3
