  - number: '4'
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van de persoon die als musicus of anderszins als artiest
      optreedt.
    url: https://wetten.overheid.nl/BWBR0004090/2009-01-01#Artikel4
  - number: 4a
    text: |-
      Als dienstbetrekking wordt beschouwd de arbeidsverhouding van de topsporter die op grond van het in overeenstemming
      met Onze Minister van Volksgezondheid, Welzijn en Sport vastgestelde reglement van de stichting Fonds voor de
      Topsporter een periodieke uitkering als tegemoetkoming in de kosten van zijn levensonderhoud geniet.
    url: https://wetten.overheid.nl/BWBR0004090/2009-01-01#Artikel4a
  - number: '5'
    text: |-
      1 Als dienstbetrekking wordt beschouwd de arbeidsverhouding van de persoon die, anders dan bedoeld in de
      [artikelen 1][ref1], [3][ref2], [4][ref3] en [4a][ref4], persoonlijk arbeid verricht op doorgaans ten minste twee
      dagen per week.

      2 De arbeidsverhouding, bedoeld in het eerste lid, wordt niet als dienstbetrekking beschouwd, indien:

      a. zij een arbeidsverhouding is als bedoeld in de
      [artikelen 3, 4 of 5, onderdeel a, b of c, van de Wet op de arbeidsongeschiktheidsverzekering][ref5], de
      [Ziektewet][ref6] of de [Werkloosheidswet][ref7] doch de persoon uit hoofde van deze arbeidsverhouding niet als
      werknemer wordt beschouwd;

      b. de persoon, werkzaam in de arbeidsverhouding, behoort tot een groep personen, aangewezen door Onze Minister.

      3 [Artikel 1, tweede en derde lid][ref8], is van toepassing op de arbeidsverhouding, bedoeld in het eerste
      lid, met dien verstande dat in plaats van het bruto-inkomen per maand het bruto-inkomen per week en in plaats
      van het minimumloon, bedoeld in [artikel 8, eerste lid, onderdeel a][ref9], het minimumloon, bedoeld in
      [artikel 8, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref10], in aanmerking wordt genomen.


