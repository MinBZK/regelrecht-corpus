preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 19 oktober 2000, nr. 5057030/00/6;

    Gelet op deartikelen 22e, 22k en 77ff, vierde lid, van het Wetboek van Strafrecht;

    De Raad van State gehoord (advies van 22 december 2000, nr. WO300.0488/I);

    Gezien het nader rapport van Onze Minister van Justitie van 8 januari 2001, nr. 5073409/01/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel1
  - number: 1.a
    text: |-
      wet: het [Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 1.b
    text: |-
      reclassering: een reclasseringsinstelling als bedoeld in
      [artikel 1, onder b, van de Reclasseringsregeling 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel1
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '1'
  - number: 1.c
    text: 'raad: de raad voor de kinderbescherming;'
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel1
  - number: 1.d
    text: |-
      uitvoerder taakstraffen: de reclasserings- of raadsmedewerker die onder verantwoordelijkheid van de reclassering of
      de raad belast is met begeleiding en toezicht in het kader van de tenuitvoerlegging van de taakstraf;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel1
  - number: 1.e
    text: 'contactpersoon: degene die handelt namens de instelling of organisatie, waar de taakstraf wordt verricht;'
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel1
  - number: 1.f
    text: 'taakgestrafte: degene aan wie een taakstraf is opgelegd;'
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel1
  - number: 1.g
    text: 'jeugdige taakgestrafte: taakgestrafte op wie [titel VIIIA van het Eerste Boek van de wet](onbekend) is toegepast;'
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel1
  - number: 1.h
    text: 'projectplaats: de plaats bij een instelling of organisatie waar de taakstraf wordt verrricht;'
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel1
  - number: 1.i
    text: |-
      Centraal Justitieel Incassobureau: het Centraal Justitieel Incassobureau, genoemd in
      [artikel 1 van het Besluit Instelling Centraal Justitieel Incassobureau][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006713#Artikel1
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006713
        artikel: '1'
  - number: 1.j
    text: 'Onze Minister: Onze Minister van Veiligheid en Justitie.'
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel1
  - number: '2'
    text: |-
      Onverminderd de taken en bevoegdheden van het openbaar ministerie ten aanzien van de tenuitvoerlegging van de
      taakstraf zijn de reclassering en de raad belast met de zorg voor het aanbod van projectplaatsen.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel2
  - number: '3'
    text: 'Projectplaatsen voor het verrichten van een taakstraf voldoen aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel3
  - number: 3.a
    text: |-
      het te verrichten werk is additioneel; er mag geen sprake zijn van het bezetten van arbeidsplaatsen die anders ter
      beschikking zouden komen van de reguliere arbeidsmarkt;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel3
  - number: 3.b
    text: het werk dient zo veel mogelijk een publiek doel;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel3
  - number: 3.c
    text: de werkzaamheden op de projectplaats zijn zinvol en in voldoende mate aanwezig;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel3
  - number: 3.d
    text: |-
      per projectplaats is een contactpersoon aangewezen die ter plaatse verantwoordelijk is voor de gang van zaken rond
      het verrichten van de taakstraf;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel3
  - number: 3.e
    text: |-
      op de projectplaats is voorzien in begeleiding, de veroordeelde mag niet langdurig alleen zijn werkzaamheden
      uitvoeren;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel3
  - number: 3.f
    text: |-
      de instelling of organisatie waar de taakstraf wordt verricht houdt zich aan de regelgeving omtrent de
      arbeidsomstandigheden en andere veiligheidsvoorschriften; werkzaamheden waarvoor bijzondere deskundigheid is
      vereist of die bijzondere risico's met zich meebrengen die niet aansluiten bij de werkervaring van de taakgestrafte
      worden niet opgedragen;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel3
  - number: 3.g
    text: |-
      op de projectplaats wordt terughoudend omgegaan met het plaatsen van taakgestraften op posities waar
      geldhandelingen worden verricht of de taakgestrafte toegang heeft tot alcohol, drugs of medicijnen;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel3
  - number: 3.h
    text: |-
      de contactpersoon controleert de taakgestrafte en geeft onregelmatigheden, het aantal gewerkte uren, de getoonde
      inzet en een afloopbericht op basis van afspraken met de uitvoerder taakstraffen door aan de reclassering of de
      raad.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel3
  - number: '4.1'
    text: |-
      Indien de reclassering of de raad de inrichting van een nieuwe projectplaats, voor het verrichten van een
      taakstraf, overweegt, wordt een voorstel daartoe voorgelegd aan het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel4
  - number: '4.2'
    text: |-
      Van de beoogde projectplaats wordt een omschrijving opgemaakt. Deze bevat ten minste de naam van de instelling of
      organisatie, het doel van de instelling of organisatie, de aard van de werkzaamheden die kunnen worden verricht, de
      wijze van begeleiding van de taakgestrafte en een verklaring omtrent de bereidheid van de instelling of organisatie
      controlerende taken uit te voeren.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel4
  - number: '4.3'
    text: Binnen een maand na de indiening van een voorstel beslist het openbaar ministerie daarover.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel4
  - number: '5'
    text: |-
      Projecten voor het verrichten van arbeid tot herstel van de door het strafbare feit aangerichte schade, als bedoeld
      in [artikel 77h, tweede lid, onderdeel a, van de wet][ref1], voldoen aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 5.a
    text: de jeugdige taakgestrafte beschikt over de vaardigheden om de schade te herstellen;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel5
  - number: 5.b
    text: |-
      op de plaats waar de schade wordt hersteld, is voorzien in begeleiding van de werkzaamheden van de jeugdige
      taakgestrafte en het houden van toezicht op deze;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel5
  - number: 5.c
    text: herstel bij particulieren kan alleen plaatsvinden, als wordt voorzien in begeleiding en toezicht door de raad.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel5
  - number: '6.1'
    text: 'Leerprojecten voldoen aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel6
  - number: 6.1.a
    text: een omschrijving van de doelstelling en de te volgen methodieken;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel6
  - number: 6.1.b
    text: een omschrijving van de doelgroep;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel6
  - number: 6.1.c
    text: een omschrijving van het aantal uren dat het project omvat en de te verrichten activiteiten;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel6
  - number: 6.1.d
    text: |-
      er is voorzien in een correctiesysteem, waarbij de voorziene correctie dient te voldoen aan de eisen van
      proportionaliteit en zorgvuldigheid;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel6
  - number: '6.2'
    text: |-
      De reclassering en de raad zijn belast met de zorg voor een adequate opleiding van de begeleiders van het
      leerproject.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel6
  - number: '6.3'
    text: |-
      De reclassering en de raad zijn belast met de zorg voor een kwaliteitszorgsysteem leerprojecten, waarbij aandacht
      wordt besteed aan de omstandigheid dat de begeleider over voldoende kwalificaties beschikt en een toetsing
      plaatsvindt van de effecten van de gehanteerde methoden en activiteiten in een leerproject.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel6
  - number: '7.1'
    text: |-
      Indien de reclassering of de raad de inrichting van een nieuw leerproject overweegt, wordt een voorstel daartoe
      voorgelegd aan het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel7
  - number: '7.2'
    text: |-
      Van het beoogde project wordt een omschrijving gemaakt. Deze bevat ten minste de in
      [artikel 6, eerste lid, onder a tot en met d][ref1] bedoelde onderdelen, alsmede de bij het leerproject betrokken
      organisaties, een gemotiveerde schatting van het aantal deelnemers en een omschrijving van de wijze waarop de
      werkwijze en de resultaten van het project zullen worden geëvalueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012158#Artikel6
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012158
        artikel: '6'
        hoofdstuk: II
  - number: '7.3'
    text: Binnen een maand na indiening van een voorstel beslist het openbaar ministerie daarover.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel7
  - number: '8.1'
    text: |-
      De reclassering en de raad dragen er zorg voor dat de rechter, het openbaar ministerie, de verdachte en diens
      raadsman zich steeds op de hoogte kunnen stellen van gegevens omtrent de beschikbare projectplaatsen voor de
      tenuitvoerlegging van een taakstraf en de aard van de te verrichten werkzaamheden en de te volgen leerprojecten.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel8
  - number: '8.2'
    text: |-
      Indien een project naar het oordeel van de reclassering of de raad niet langer aan de gestelde eisen voldoet meldt
      de reclassering onderscheidenlijk de raad dit aan het openbaar ministerie. Tenzij het openbaar ministerie binnen
      een maand anders beslist vervalt na afloop van die termijn het project.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel8
  - number: '8.3'
    text: Het openbaar ministerie kan, na overleg met de reclassering onderscheidenlijk de raad, een project doen vervallen.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel8
  - number: '9.1'
    text: |-
      Nadat de reclassering of de raad een afschrift van de rechterlijke uitspraak of van de strafbeschikking van
      het openbaar ministerie of door tussenkomst van het Centraal Justitieel Incassobureau heeft ontvangen, draagt
      de reclassering onderscheidenlijk de raad er zorg voor dat de taakstraf in overeenstemming met de rechterlijke
      uitspraak of de strafbeschikking ten uitvoer wordt gelegd. Indien dit niet mogelijk blijkt stelt de raad
      onderscheidelijk de reclassering het openbaar ministerie daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel9
  - number: '9.2'
    text: Het openbaar ministerie kan aanwijzingen geven omtrent de tenuitvoerlegging van taakstraffen.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel9
  - number: '9.3'
    text: |-
      Indien een taakstraf bestaat uit een werkstraf en een leerstraf worden deze voor de tenuitvoerlegging als
      afzonderlijke projecten aangemerkt.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel9
  - number: '10.1'
    text: |-
      Na ontvangst van het in [artikel 9, eerste lid][ref1], bedoelde stuk roept de uitvoerder taakstraffen de
      taakgestrafte zo spoedig mogelijk op voor een intakegesprek. Bij een jeugdige taakgestrafte kunnen tevens de ouders
      of voogd van de taakgestrafte worden opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0012158#Artikel9
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012158
        artikel: '9'
        hoofdstuk: III
  - number: '10.2'
    text: |-
      Wanneer de taakgestrafte niet reageert op de oproep en is vastgesteld dat het daarop vermelde adres niet afwijkt
      van dat waarop betrokkene staat ingeschreven in de basisregistratie personen, wordt opnieuw een oproep gedaan,
      vergezeld van de mededeling dat bij niet verschijnen de zaak wordt teruggezonden aan het openbaar ministerie.
      Indien op de tweede oproep niet wordt gereageerd wordt daarvan melding gemaakt aan het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel10
  - number: '10.3'
    text: |-
      In het intakegesprek stelt de uitvoerder taakstraffen de taakgestrafte op de hoogte van de regels, rechten en
      plichten die gelden bij de tenuitvoerlegging van een taakstraf.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel10
  - number: '10.4'
    text: |-
      Bij het bepalen van de feitelijke werkzaamheden of verplichtingen houdt de uitvoerder taakstraffen rekening met
      het gepleegde delict, de capaciteiten, mogelijkheden en specifieke omstandigheden van de taakgestrafte, alsmede de
      reisafstand tot de projectplaats. De reistijd bedraagt in totaal niet meer dan drie uren per dag. De dagen waarop
      aan het project wordt deelgenomen en de aanvang- en eindtijden worden in overleg met de taakgestrafte vastgesteld.
      Pauzes en reistijden tellen niet mee voor de taakstrafuren.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel10
  - number: '10.5'
    text: |-
      Voorafgaand aan de aanvang van de deelname aan het project vindt een gesprek plaats tussen de jeugdige
      taakgestrafte, de uitvoerder taakstraffen en de contactpersoon waarbij in elk geval wordt ingegaan op de huisregels
      van de projectplaats, vaststelling en uitleg van de werkzaamheden of het leerproject en de aanvangsdatum. Bij de
      andere taakgestraften kan voorafgaand aan de aanvang van de deelname aan een project dit gesprek plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel10
  - number: '10.6'
    text: |-
      Voorafgaand aan de aanvang van de deelname aan het project wordt de beslissing van de uitvoerder taakstraffen tot
      plaatsing schriftelijk vastgelegd en voor akkoord ondertekend door de taakgestrafte. De schriftelijke beslissing
      wordt aan het openbaar ministerie gezonden. De taakgestrafte wordt een afschrift ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel10
  - number: '11'
    text: |-
      Nadat de taakstraf is verricht stuurt de uitvoerder taakstraffen zo spoedig mogelijk een afloopbericht aan het
      openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel11
  - number: '12'
    text: |-
      De uitvoerder taakstraffen oefent toezicht uit op de verrichtingen van de taakgestrafte en de omstandigheden
      waaronder deze plaatsvinden. Het toezicht omvat ook de veiligheid, de gezondheid en arbeidsomstandigheden op de
      projectplaats en de redelijkheid van de opgedragen werkzaamheden of opgelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel12
  - number: '13.1'
    text: |-
      Een verzoek om medewerking of een opdracht als bedoeld in [artikel 22e, tweede volzin][ref1] en
      [77o, eerste lid, van de wet][ref2] juncto [artikel 147 van het Wetboek van Strafvordering][ref3] kan mede inhouden
      dat de uitvoerder taakstraffen de volgende beslissingen kan nemen:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel22e
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77o
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel147
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 22e
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77o
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '147'
  - number: 13.1.a
    text: de beslissing om in bijzondere gevallen de projectplaats of de aard van de werkzaamheden te wijzigen;
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel13
  - number: 13.1.b
    text: |-
      de beslissing, bedoeld in [artikel 15][ref1], tot het geven van een waarschuwing indien de taakstraf niet naar
      behoren wordt uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0012158#Artikel15
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012158
        artikel: '15'
        hoofdstuk: IV
  - number: 13.1.c
    text: |-
      de beslissing, bedoeld in [artikel 16][ref1], tot opschorting van de tenuitvoerlegging van de taakstraf, met advies
      aan de officier van justitie tot het voortijdig beëindigen van de tenuitvoerlegging van de taakstraf.


      [ref1]: https://wetten.overheid.nl/BWBR0012158#Artikel16
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012158
        artikel: '16'
        hoofdstuk: IV
  - number: '13.2'
    text: Alvorens een beslissing wordt genomen wordt de taakgestrafte, zo mogelijk, door de uitvoerder taakstraffen gehoord.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel13
  - number: '13.3'
    text: |-
      De beslissing wordt schriftelijk vastgelegd, gedagtekend en gemotiveerd. Bij de rapportage aan de officier van
      justitie wordt de op schrift gestelde beslissing en, indien kenbaar gemaakt, het standpunt van de taakgestrafte
      gevoegd. De uitvoerder taakstraffen rapporteert zo spoedig mogelijk aan het openbaar ministerie. Een afschrift van
      de rapportage en de bijbehorende stukken wordt aan de taakgestrafte ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel13
  - number: '14'
    text: |-
      Bijzondere gevallen, als bedoeld in [artikel 13, eerste lid, onder a][ref1], kunnen zijn: onvoldoende
      beschikbaarheid van werk, een onoplosbaar conflict op de projectplaats, ongeschiktheid van de taakgestrafte voor
      het werk of het niet aansluiten van verplichtingen bij de specifieke omstandigheden van de taakgestrafte.


      [ref1]: https://wetten.overheid.nl/BWBR0012158#Artikel13
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012158
        artikel: '13'
        hoofdstuk: IV
  - number: '15'
    text: |-
      De uitvoerder taakstraffen geeft ten hoogste eenmaal een waarschuwing aan de taakgestrafte wegens het niet naar
      behoren verrichten van de taakstraf.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel15
  - number: '16.1'
    text: |-
      De uitvoerder taakstraffen kan de tenuitvoerlegging van de taakstraf opschorten indien na een waarschuwing de
      taakgestrafte de taakstraf wederom niet naar behoren verricht of na een ernstige misdraging van de zijde van de
      taakgestrafte. De uitvoerder taakstraffen stelt de officier van justitie onverwijld van deze beslissing op de
      hoogte, met het advies de tenuitvoerlegging van de taakstraf te beëindigen.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel16
  - number: '16.2'
    text: |-
      Het openbaar ministerie neemt zo spoedig mogelijk na de onvangst van het advies een beslissing als bedoeld in de
      [artikel 22f][ref1] of [22g van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel22f
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel22g
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 22f
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 22g
  - number: '17'
    text: |-
      De taakgestrafte kan door de uitvoerder taakstraffen worden opgedragen, voordat het verrichten van de taakstraf
      aanvangt, zich door een door de uitvoerder taakstraffen aan te wijzen keuringsarts medisch te laten keuren, indien
      de werkzaamheden dit vereisen, de taakgestrafte medische klachten heeft of arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel17
  - number: '18.1'
    text: |-
      Voorafgaand aan de plaatsing in een project wordt overeengekomen op welke tijdstippen de taakgestrafte de taakstraf
      zal verrichten. Hierbij kan van de taakgestrafte die werkt, worden verlangd dat hij vrije dagen opneemt.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel18
  - number: '18.2'
    text: Indien de taakgestrafte een uitkering ontvangt stelt hij de uitkeringsinstantie op de hoogte van de taakstraf.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel18
  - number: '19'
    text: De taakgestrafte geeft veranderingen in de woon- of werksituatie onmiddellijk door aan de uitvoerder taakstraffen.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel19
  - number: '20.1'
    text: |-
      De taakgestrafte volgt de aanwijzingen en opdrachten, in het kader van de tenuitvoerlegging van de taakstraf
      gegeven door de uitvoerder taakstraffen of namens deze door de contactpersoon, op.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel20
  - number: '20.2'
    text: De taakgestrafte zorgt zelf voor werkkleding, tenzij door de contactpersoon anders is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel20
  - number: '21.1'
    text: |-
      De taakgestrafte doet van ziekte of bijzondere omstandigheden die een reden kunnen zijn voor verzuim terstond
      mededeling aan de contactpersoon en de uitvoerder taakstraffen. Bij bijzondere omstandigheden wordt, behoudens
      onvoorziene omstandigheden, toestemming voor het verzuim gevraagd aan de uitvoerder taakstraffen.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel21
  - number: '21.2'
    text: |-
      De taakgestrafte kan bij ziekte worden verplicht een door de uitvoerder taakstraffen aan te wijzen keuringsarts te
      bezoeken of in te stemmen met een bezoek van een keuringsarts.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel21
  - number: '21.3'
    text: Verzuimde uren, ook in geval van ziekte, worden ingehaald.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel21
  - number: '22'
    text: |-
      De taakgestrafte kan tegen een gedraging van een uitvoerder taakstraffen werkzaam bij de reclassering een
      klacht indienen bij de klachtencommissie bedoeld in [artikel 29 van de Reclasseringsregeling 1995][ref1].
      [Hoofdstuk 5 van de Reclasseringsregeling 1995][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0007120#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0007120
        hoofdstuk: '5'
  - number: '23'
    text: |-
      De jeugdige taakgestrafte kan tegen een gedraging van een uitvoerder taakstraffen,
      werkzaam bij de raad, een klacht indienen bij de directeur, bedoeld in
      [artikel 1 van het Besluit klachtbehandeling raad voor de kinderbescherming][ref1]. Het
      [Besluit klachtbehandeling raad voor de kinderbescherming][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008127#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008127
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008127
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008127
  - number: '24.1'
    text: |-
      Het Centraal Justitieel Incassobureau heeft tot taak het openbaar ministerie te ondersteunen bij zijn taken met
      betrekking tot de tenuitvoerlegging van taakstraffen.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel24
  - number: '24.2'
    text: |-
      Het Centraal Justitieel Incassobureau verricht de werkzaamheden die Onze Minister of het openbaar ministerie van
      hem in verband met de uitoefening van hun taken terzake van de tenuitvoerlegging van taakstraffen verlangen.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel24
  - number: '24.3'
    text: |-
      De ambtenaren van het openbaar ministerie en de raad en de medewerkers van de reclassering verstrekken het Centraal
      Justitieel Incassobureau de gegevens die het behoeft in verband met de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel24
  - number: '25'
    text: |-
      De reclassering en de raad leggen in elk arrondissement ten minste eenmaal per jaar verantwoording aan het openbaar
      ministerie af over het gevoerde beleid inzake de tenuitvoerlegging van taakstraffen, waaronder de begeleiding, het
      toezicht, de genomen beslissingen en de afhandeling van klachten.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel25
  - number: '27'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel27
  - number: '28'
    text: 'Dit besluit wordt aangehaald als: Besluit tenuitvoerlegging taakstraffen.'
    url: https://wetten.overheid.nl/BWBR0012158/2014-01-06#Artikel28
