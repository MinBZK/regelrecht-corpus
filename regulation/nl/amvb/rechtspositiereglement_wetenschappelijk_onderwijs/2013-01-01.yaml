  - number: '17'
    text: |-
      1 De ambtenaar dan wel werknemer die:

      a. is gekozen tot lid van de universiteitsraad, van een faculteitsraad of faculteitsbestuur,

      b. als vertegenwoordiger van het niet tot de wetenschappelijke staf behorend wetenschappelijk personeel of van het
      ondersteunend of beheerspersoneel is aangewezen als lid van een vakgroeps- of werkgroepsbestuur,

      c. is benoemd tot of aangewezen als lid van een bij of krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] ingestelde commissie, daaronder mede begrepen
      een dienstcommissie,

      d. is benoemd tot lid of plaatsvervangend lid van het college van beroep voor de examens of van het College van
      beroep voor het wetenschappelijk onderwijs,

      wordt in de gelegenheid gesteld de werkzaamheden die deze in zijn betrekking van ambtenaar dan wel werknemer
      dient te vervullen, te verminderen voor zolang en voor zover zulks redelijkerwijze noodzakelijk is voor het
      voorbereiden en bijwonen van de vergaderingen dan wel zittingen van die organen en voor het verrichten van
      daaruit voortvloeiende werkzaamheden ten behoeve van die organen, en zulks naar het oordeel van het bevoegd gezag
      redelijkerwijze is te verwezenlijken gelet op de vervulling van de bedoelde betrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0004192/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '18'
    text: Het bevoegd gezag kan ter zake van het in deze paragraaf bepaalde nadere voorschriften vaststellen.
    url: https://wetten.overheid.nl/BWBR0004192/2013-01-01#Artikel18
  - number: '19'
    text: Het bevoegd gezag bevordert zo veel mogelijk het werkoverleg bij eenheden van beheer.
    url: https://wetten.overheid.nl/BWBR0004192/2013-01-01#Artikel19
  - number: '20'
    text: |-
      1 Over de instelling van dienstcommissies krachtens artikel 103 van de Wet op het wetenschappelijk onderwijs heeft
      overleg plaats met het plaatselijk overlegorgaan.

      2 Bij het instellen van dienstcommissies wordt er zoveel mogelijk op gelet, dat de eenheid waarvoor een commissie
      wordt ingesteld, in organisatorische dan wel beleidsuitvoerend opzicht een eenheid vormt.

      3 Bij de overeenkomstige toepassing van de [artikelen 124 tot en met 126a][ref1],
      [126b, eerste, tweede en zesde lid][ref2], en 126c tot en met 129a van het Algemeen Rijksambtenarenreglement op de
      in de voorgaande leden bedoelde dienstcommissies wordt gelezen in de plaats van:

      a. Onze Minister: het bevoegd gezag in de zin van dit besluit;

      b. bijzondere commissie: het plaatselijk overlegorgaan;

      c. de Centrale Commissie voor Georganiseerd Overleg in Ambtenarenzaken: het plaatselijk overlegorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel126b
    url: https://wetten.overheid.nl/BWBR0004192/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '124'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 126b
  - number: 20a
    text: |-
      1 Het bevoegd gezag van onderscheidenlijk de Koninklijke Bibliotheek, de Koninklijke Nederlandse Akademie van
      Wetenschappen en het Rijksinstituut voor Oorlogsdocumentatie stelt dienstcommissies in voor eenheden binnen de
      instelling.

      2 De bepalingen van [artikel 20][ref1] zijn van overeenkomstige toepassing.


