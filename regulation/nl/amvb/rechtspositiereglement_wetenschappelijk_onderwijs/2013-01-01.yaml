      1 Bij onderdelen van de Open Universiteit kunnen door het bevoegd gezag dienstcommissies worden ingesteld. Over de
      instelling van dienstcommissies heeft overleg plaats met het plaatselijk overlegorgaan.

      2 Bij het instellen van dienstcommissies wordt er zoveel mogelijk op gelet, dat de eenheid waarvoor een commissie
      wordt ingesteld, in organisatorisch dan wel beleidsuitvoerend opzicht een eenheid vormt.

