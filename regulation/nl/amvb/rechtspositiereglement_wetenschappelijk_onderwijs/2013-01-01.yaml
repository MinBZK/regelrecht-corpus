  - number: '78'
    text: |-
      Ambtenaar in de zin van deze titel is degene die is benoemd tot lid van het algemeen bestuur van de Nederlandse
      organisatie voor wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0004192/2013-01-01#Artikel78
  - number: '79'
    text: |-
      Met uitzondering van de eerste volzin van [artikel 65, tweede lid][ref1], is hoofdstuk III zoals dat luidde op 18
      maart 1997, van overeenkomstige toepassing op de leden van het algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004192#Artikel65
    url: https://wetten.overheid.nl/BWBR0004192/2013-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0004192
        artikel: '65'
  - number: '80'
    text: |-
      1 Aan de leden van de gebiedsbesturen en afdelingsbesturen van de Nederlandse organisatie voor wetenschappelijk
      onderzoek kan een tegemoetkoming, vergoeding van kosten dan wel beide worden toegekend. Het bevoegd gezag kan
      nadere regelen stellen met betrekking tot het bepaalde in de voorgaande volzin.

      2 De tegemoetkoming dan wel de vergoeding van kosten, bedoeld in het eerste lid, is geen bezoldiging in de zin van
      het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
