      1 De ambtenaar dan wel werknemer die:

      a. is gekozen tot lid van de bestuursraad, de medezeggenschapsraad, een personeelsraad, een deelraad van een
      studiecentrum of van een combinatie van studiecentra;

      b. is benoemd tot of aangewezen als lid van een bij of krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] ingestelde commissie of een krachtens dit besluit
      ingestelde dienstcommissie;

