  - number: '16'
    text: |-
      1 Indien, onverminderd het bepaalde in de artikelen 14, tweede lid, en 15, vierde lid, in de vervulling van de
      betrekking van de ambtenaar dan wel werknemer, bedoeld in [artikel 14, eerste lid][ref1], blijvend is voorzien dan
      wel die betrekking is opgeheven, onderzoekt na afloop van de bestuursperiode van de ambtenaar dan wel werknemer,
      onderscheidenlijk na afloop van het ingevolge [artikel 15, eerste lid][ref2], verleende verlof het bevoegd
      gezag zorgvuldig of binnen zijn gezagsbereik de ambtenaar dan wel werknemer een andere mede in verband met zijn
      persoonlijkheid en omstandigheden passende betrekking kan worden opgedragen. Indien naar het oordeel van het
      bevoegd gezag nodig en mogelijk, wordt de ambtenaar dan wel werknemer in de gelegenheid gesteld zich de voor de
      nieuwe betrekking nodige bekwaamheden te verwerven. De daaraan verbonden kosten komen binnen redelijke grenzen, ter
      beoordeling van het bevoegd gezag, ten laste van de instelling.

      2 Indien de ambtenaar dan wel werknemer geen andere passende betrekking kan worden opgedragen, wordt hem eervol
      ontslag verleend. Het bevoegd gezag neemt daarbij een opzeggingstermijn van ten minste drie maanden in acht.

      3 Indien binnen een tijdvak van uiterlijk een jaar nadat de ambtenaar dan wel werknemer de andere betrekking is
      gaan vervullen, die betrekking voor hem niet passend blijkt te zijn, kan hem alsnog ontslag worden verleend. Het
      bevoegd gezag neemt daarbij een opzeggingstermijn van ten minste drie maanden in acht. Het ontslag wordt eervol
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004192#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004192#Artikel15
