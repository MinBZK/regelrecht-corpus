  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen, mede namens Onze Minister van Landbouw
    en Visserij, van 17 november 1986, nr. 797161, directie Personeel Beleid Hoger Onderwijs en Wetenschappelijk
    Onderzoek;

    Gelet op de artikelen 108, 109, 126, derde lid, 127, tweede lid, 146, derde lid, en 159, tweede lid, van de
    Wet op het wetenschappelijk onderwijs (Stb. 1986, 414) alsmede op de artikelen 125, eerste lid, en 134 van de
    Ambtenarenwet 1929 (Stb. 530);

    De Raad van State gehoord (advies van 6 mei 1987, nr. W05.86.0626);

    Gezien het nader rapport van Onze Minister van Onderwijs en Wetenschappen, mede namens Onze Minister van Landbouw
    en Visserij, van 6 juli 1987, nr. 807761, directie Personeel Beleid Hoger Onderwijs en Wetenschappelijk Onderzoek;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004192/2013-01-01#ArtikelAanhef
articles:
  - number: '2'
    text: |-
      In dit besluit wordt verstaan onder:

      a. orgaan voor postacademisch onderwijs: een publiekrechtelijk orgaan voor postacademisch onderwijs;

      b. instelling: een rijksuniversiteit, een orgaan voor postacademisch onderwijs, de Koninklijke Bibliotheek, de
      Koninklijke Nederlandse Akademie van Wetenschappen, het Rijksinstituut voor Oorlogsdocumentatie, de Nederlandse
      organisatie voor wetenschappelijk onderzoek, de Open Universiteit dan wel een academisch ziekenhuis bij een
      rijksuniversiteit.

      c. bevoegd gezag:

      1. in hoofdstuk II: voor zover het een rijksuniversiteit of de gemeentelijke universiteit te Amsterdam betreft,
      het college van bestuur, voor zover het een orgaan voor postacademisch onderwijs betreft, het bestuur van dat
      orgaan en, voor zover het betreft het van overeenkomstige toepassing zijn van hoofdstuk II op de Nederlandse
      organisatie voor wetenschappelijk onderzoek, op de Koninklijke Bibliotheek, op de Koninklijke Nederlandse Akademie
      van Wetenschappen en op het Rijksinstituut voor Oorlogsdocumentatie, het Algemeen Bestuur, onderscheidenlijk het
      Algemeen Bestuurscollege, het Bestuur en Onze Minister van Onderwijs en Wetenschappen;

      2. in hoofdstuk IV: het Algemeen Bestuur van de Nederlandse organisatie voor wetenschappelijk onderzoek;

      3. in hoofdstuk V: het college van bestuur van de Open Universiteit;

      4. in hoofdstuk VI: het bestuur van het academisch ziekenhuis.

      d. C.O.P.W.O.: het Centraal Overlegorgaan Personeelszaken Wetenschappelijk Onderwijs, bedoeld in artikel 2 van het
      Koninklijk besluit van 18 april 1974, *Stb.* 251;

      e. plaatselijk overlegorgaan: het overlegorgaan, bedoeld in artikel 14 van het Koninklijk besluit van 18 april
      1974, *Stb.* 251.
    url: https://wetten.overheid.nl/BWBR0004192/2013-01-01#Artikel2
  - number: '14'
    text: |-
      1 De ambtenaar dan wel werknemer die is benoemd tot lid van het college van bestuur of van een faculteitsbestuur
      dan wel tot rector magnificus, wordt in verband daarmee ontheven van de vervulling van zijn betrekking.

      2 Voor de vervulling van de betrekking van de ambtenaar dan wel werknemer, bedoeld in het eerste lid, wordt in elk
      geval gedurende diens eerste bestuursperiode geen voorziening getroffen die de terugkeer van de betrokkene naar die
      betrekking onmogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0004192/2013-01-01#Artikel14
  - number: '15'
    text: |-
      1 Aan de ambtenaar dan wel werknemer, bedoeld in [artikel 14, eerste lid][ref1], wordt, na beëindiging van
      zijn lidmaatschap van het college van bestuur of faculteitsbestuur dan wel van zijn rectoraat, op zijn verzoek
      buitengewoon verlof verleend met behoud van bezoldiging dan wel loon.

      2 Bij de vaststelling van de duur van dat verlof wordt in aanmerking genomen dat het verlof uitsluitend ten doel
      heeft de ambtenaar dan wel werknemer in de gelegenheid te stellen de voor een juiste vervulling van zijn betrekking
      noodzakelijke kennis te verwerven van de ontwikkelingen die zich gedurende zijn in het eerste lid bedoelde
      lidmaatschap op zijn vakgebied hebben voorgedaan.

      3 Het verlof wordt verleend voor ten hoogste een derde van het aantal maanden waarin de ambtenaar dan wel werknemer
      zonder onderbreking lid is geweest van het college van bestuur of faculteitsbestuur dan wel het rectoraat heeft
      vervuld. Het bedraagt in geen geval meer dan twaalf maanden.

      4 Indien voor de vervulling van de betrekking van de ambtenaar dan wel werknemer aan wie ingevolge het bepaalde in
      het eerste lid verlof is verleend, geen voorziening is getroffen die diens terugkeer naar die betrekking onmogelijk
      maakt, wordt zulk een voorziening evenmin getroffen gedurende het verlof.

      5 Het bepaalde in het eerste, tweede en derde lid is van overeenkomstige toepassing op de ambtenaar dan wel
      werknemer die, gekozen tot lid van een faculteitsbestuur, onverminderd het bepaalde in [artikel 17][ref2],
      gedurende zijn lidmaatschap van dat bestuur vrijwel de gehele werktijd heeft besteed aan werkzaamheden die uit
      dat lidmaatschap voortvloeien. Voor de vervulling van de betrekking van de ambtenaar dan wel werknemer, bedoeld
      in de eerste volzin, wordt gedurende het verlof geen voorziening getroffen die diens terugkeer naar die betrekking
      onmogelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004192#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004192#Artikel17
