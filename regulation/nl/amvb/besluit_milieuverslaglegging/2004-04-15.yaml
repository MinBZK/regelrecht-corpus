  - number: '2'
    text: |-
      Als categorieën van gevallen waarin inrichtingen ernstige nadelige gevolgen voor het milieu kunnen veroorzaken,
      als bedoeld in [artikel 12.1, tweede lid, van de wet](onbekend), worden aangewezen de in [bijlage I][ref1] genoemde
      categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0010010
    url: https://wetten.overheid.nl/BWBR0010010/2004-04-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010010
  - number: '3'
    text: |-
      1 In het overheidsverslag worden, voorzover voor de betrokken inrichting relevant, de onderwerpen behandeld en
      gegevens vermeld, die zijn aangegeven in [bijlage II][ref1].

      2 Kwantitatieve gegevens worden vermeld als jaarvrachten voor de gehele inrichting. In afwijking van het bepaalde
      in de eerste volzin kan bij regeling van Onze Ministers voor daarbij aangegeven kwantitatieve gegevens worden
      bepaald dat deze tevens op een andere daarbij aangegeven wijze worden vermeld, indien dit naar hun oordeel is
      vereist met het oog op:

      a. de vaststelling van het door bestuursorganen te voeren milieubeleid en de controle op de voortgang van de
      uitvoering van dat beleid, of

      b. de uitvoering van een bindend besluit van de Raad van de Europese Unie of de Commissie van de Europese
      Gemeenschappen.

      3 Kwantitatieve gegevens worden voorzien van een toelichting, indien dit voor een goed begrip van die gegevens
      noodzakelijk is.

      4 Kwantitatieve gegevens komen op zorgvuldige en verifieerbare wijze met behulp van een bij de inrichting
      gedocumenteerd meet- en registratiesysteem tot stand.

      5 Bij regeling van Onze Ministers kunnen modellen worden vastgesteld voor het opstellen van overheidsverslagen.
      Indien de eerste volzin toepassing vindt, wordt voor ieder model in ieder geval aangegeven:

      a. voor welke categorie van de in [bijlage I][ref2] aangewezen gevallen het betrokken model geldt, en

      b. welke gegevens bij welk onderwerp tenminste in het verslag worden vermeld.

      6 Bij de regeling, bedoeld in het vijfde lid, kunnen nadere regels worden gesteld met betrekking tot het bepaalde
      in het eerste tot en met het vierde lid.

      7 Een bestuursorgaan kan bij het aanbrengen van beperkingen of het verbinden van voorschriften aan een vergunning
      bepalen dat daarbij aangegeven andere gegevens dan vermeld in bijlage II, onder 1 tot en met 13, in het
      overheidsverslag worden vermeld, dan wel dat de overeenkomstig het tweede tot en met het zesde lid te verstrekken
      kwantitatieve gegevens daarin op een andere daarbij aangegeven wijze worden vermeld. Van deze bevoegdheid wordt
      uitsluitend gebruik gemaakt in gevallen waarin dat redelijkerwijs nodig is met het oog op:

      a. het bepalen van de mate waarin de betrokken inrichting of een onderdeel daarvan in het bijzonder nadelige
      gevolgen voor het milieu kan veroorzaken, of

      b. vervulling van de taak, bedoeld in [artikel 18.2 van de wet][ref3], onderscheidenlijk
      [artikel 29 van de Wet verontreiniging oppervlaktewateren][ref4].

      8 Een bestuursorgaan kan bij het aanbrengen van beperkingen of het verbinden van voorschriften aan een vergunning
      nadere eisen stellen met betrekking tot de behandeling in het overheidsverslag van het in [bijlage II][ref5],
      [onder 14][ref6], genoemde onderwerp, en het bepaalde in het vierde lid.


