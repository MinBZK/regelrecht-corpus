articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      wet:[ Wet milieubeheer][ref1];

      vergunning: vergunning als bedoeld in [artikel 8.1 van de wet][ref2] of vergunning als bedoeld in
      [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref3];

      bestuursorgaan: bestuursorgaan dat bevoegd is een vergunning te verlenen;

      overheidsverslag: milieuverslag als bedoeld in [artikel 12.4 van de wet][ref4];

      Onze Ministers: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van
      Verkeer en Waterstaat;

      [bijlage I][ref5] en II: de bij dit besluit behorende [bijlage I][ref6], onderscheidenlijk [bijlage II][ref7].


