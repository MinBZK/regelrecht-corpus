  - number: '5'
    text: |-
      1 Het bestuursorgaan brengt de vergunning voor een inrichting die behoort tot een in [bijlage I][ref1] aangewezen
      categorie van gevallen, voor 1 januari 2004 in overeenstemming met [artikel 4, eerste lid][ref2].

      2 Tot het tijdstip waarop de betrokken vergunning met [artikel 4, eerste lid][ref3], in overeenstemming is
      gebracht, doch uiterlijk tot 1 januari 2004, zijn dat artikellid en [artikel 3, eerste lid][ref4], in samenhang met
      [bijlage II][ref5], onderwerp 14, niet van toepassing.


