  - number: '4'
    text: |-
      1 Een bestuursorgaan kan aan een vergunning voorschriften verbinden tot het overleggen van andere rapportages dan
      het overheidsverslag, uitsluitend indien dat redelijkerwijs nodig is om gegevens te verkrijgen die niet met de
      daartoe nodige frequentie in het overheidsverslag kunnen worden opgenomen, met het oog op:

      a. het bepalen van de mate waarin de betrokken inrichting of een onderdeel daarvan in het bijzonder nadelige
      gevolgen voor het milieu kan veroorzaken, of

      b. de vervulling van de taak, bedoeld in [artikel 18.2 van de wet][ref1], onderscheidenlijk
      [artikel 29 van de Wet verontreiniging oppervlaktewateren][ref2].

      2 Indien voorschriften aan een vergunning worden verbonden als bedoeld in het eerste lid, wordt in de motivering
      van het besluit aangegeven waarom aan [artikel 3, zevende lid][ref3], geen toepassing wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18.2
