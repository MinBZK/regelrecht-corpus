  - number: 5a
    text: |-
      Een wijziging van de richtlijn, genoemd in [bijlage I, onderdeel 22][ref1], gaat voor de toepassing van dat
      onderdeel gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


