preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 19 juli 1991, DGVgz/VVP/L-
    U-691341, gedaan in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van Landbouw,
    Natuurbeheer en Visserij;

    Overwegende, dat uitvoering moet worden gegeven aan de Richtlijn van de Raad van de Europese Gemeenschappen van 3
    mei 1989 betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake voor bijzondere voeding
    bestemde levensmiddelen (89/398/EEG) (PbEG L 186);

    Gelet op de artikelen 1, vijfde lid, 4, eerste lid, onder a en b, 5, eerste lid, onder c, 6, onder d, 8, onder a,
    b en c, 12 en 14 van de Warenwet (Stb. 1988, 360) en op artikel II, eerste lid, van de Wijzigingswet 1988 Warenwet
    (Stb. 358);

    Gehoord de Adviescommissie Warenwet (advies van 19 maart 1991, nr. 14359/(3)5);

    Gehoord de Raad van State (advies van 4 december 1991, nr. W13.91.0458);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 6 april 1992, DGVgz/
    VVP/L-692524, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van
    Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder

      a. product voor bijzondere voeding: eet- of drinkwaar die in de handel gebracht wordt voorzien van een vermelding,
      aangevende de geschiktheid voor een bijzonder voedingsdoel;

      b. *richtlijn 89/398/EEG*: [richtlijn nr. 89/398/EEG](31989L0398) van de Raad van de Europese Unie van 3 mei 1989
      betreffende de onderlinge aanpassing van de wetgeving van de lidstaten inzake voor bijzondere voeding bestemde
      levensmiddelen (PbEG L 186);

      c. *verordening (EG) 953/2009*: verordening (EG) nr. 953/2009 van de Commissie van de Europese Gemeenschappen
      van 13 oktober 2009 inzake stoffen die voor specifieke voedingsdoeleinden aan voor bijzondere voeding bestemde
      levensmiddelen mogen worden toegevoegd (PbEU L 269);

      d. *verordening (EG) 41/2009:* verordening (EG) nr. 41/2009 van de Commissie van de Europese Gemeenschappen van
      20 januari 2009 betreffende de samenstelling en de etikettering van levensmiddelen die geschikt zijn voor personen
      met een glutenintolerantie (PbEU L 16).

      2 Een product voor bijzondere voeding moet voldoen aan de bijzondere voedingsbehoeften:

      a. van bepaalde categorieën personen wier assimilatieproces of stofwisseling is verstoord;

      b. van bepaalde categorieën personen die zich in bijzondere fysiologische omstandigheden bevinden en die daarom
      bijzonder gebaat kunnen zijn bij een gecontroleerde inname van bepaalde stoffen in eet- en drinkwaren; of

      c. van zuigelingen, peuters of kleuters, in goede gezondheid.
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden producten voor bijzondere voeding welke niet voldoen aan de bij of krachtens dit besluit gestelde
      eisen te verhandelen.

      2 Het is verboden producten voor bijzondere voeding, die niet behoren tot een der in de bijlage genoemde
      categorieën, te verhandelen voordat de Nederlandse Voedsel- en Warenautoriteit overeenkomstig de in
      [artikel 4][ref1] aangegeven procedure op de hoogte gesteld is van de te gebruiken aanduidingen en vermeldingen.

      3 Het is verboden producten voor bijzondere voeding te verhandelen anders dan in een verpakking en met inachtneming
      van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot hun aanduiding of tot het bezigen van
      vermeldingen of voorstellingen.

      4 Het is verboden met gebruikmaking van de in [artikel 6, eerste lid][ref2], genoemde aanduidingen andere waren te
      verhandelen dan de in dat lid bedoelde producten voor bijzondere voeding.

      5 Het is verboden producten voor bijzondere voeding aan te prijzen, anders dan met inachtneming van de bij
      ministeriële regeling gestelde voorschriften ter uitvoering van een ter zake krachtens het Verdrag tot oprichting
      van de Europese Gemeenschap tot stand gekomen bindende regeling.

      6 Het is verboden te handelen in strijd met de artikelen 2, eerste lid, 3, en 4, eerste en tweede lid, van
      verordening (EG) 953/2009.

      7 Het is verboden te handelen in strijd met artikel 3 van verordening (EG) 41/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0005489#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005489#Artikel6
