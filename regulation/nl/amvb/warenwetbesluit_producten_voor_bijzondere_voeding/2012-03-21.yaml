  - number: '6'
    text: |-
      1 De aanduiding "dieet" of "regime", al dan niet in combinatie met andere woorden, alsmede elke andere
      aanduiding of wijze van aanbieding, die de indruk zou kunnen wekken dat het een product voor bijzondere
      voeding betreft, mag uitsluitend worden gebezigd voor producten voor bijzondere voeding, bedoeld in
      [artikel 1, tweede lid, onder a of b][ref1].

      2 In afwijking van het eerste lid mag, in door Onze Minister ter uitvoering van krachtens [richtlijn 89/398/EEG]
      (31989L0398) getroffen maatregelen bepaalde gevallen, voor gewone eet- of drinkwaren een vermelding worden gebezigd
      betreffende de geschiktheid voor een bijzonder voedingsdoel. Onze Minister geeft daarbij aan op welke wijze die
      geschiktheid moet worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005489#Artikel1
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel6
    references:
      - id: ref1
