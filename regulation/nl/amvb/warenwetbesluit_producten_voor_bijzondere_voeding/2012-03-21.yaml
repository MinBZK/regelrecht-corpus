  - number: '3'
    text: |-
      1 Producten voor bijzondere voeding moeten met het oog op het aangegeven voedingsdoel op bijzondere wijze zijn
      samengesteld of bereid.

      2 Producten voor bijzondere voeding moeten wat betreft aard en samenstelling voor het aangegeven voedingsdoel
      geschikt zijn.
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel3
  - number: '4'
    text: |-
      1 Indien een product voor bijzondere voeding, niet behorende tot een der in de bijlage genoemde categorieën, voor
      de eerste maal in de handel wordt gebracht, stelt de fabrikant of, indien het betreft een waar die niet afkomstig
      is uit een der lidstaten van de Europese Unie dan wel een van de overige staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte, de importeur, de Nederlandse Voedsel- en Warenautoriteit daarvan in
      kennis door toezending van een specimen van de voor de betrokken waar te gebruiken aanduidingen en vermeldingen.

      2 Indien het in het eerste lid bedoelde product afkomstig is uit een der andere lidstaten van de Europese Unie dan
      wel een van de overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, deelt
      de betrokken fabrikant of importeur de Nederlandse Voedsel- en Warenautoriteit tevens mede aan welke autoriteit in
      het land van herkomst de in het eerste lid bedoelde toezending is geschied.

      3 Op verlangen van de Nederlandse Voedsel- en Warenautoriteit legt de fabrikant of importeur wetenschappelijke
      werkzaamheden of gegevens over, waaruit blijkt dat de waar in overeenstemming is met [artikel 1, tweede lid][ref1],
      en met de vermeldingen, bedoeld in [artikel 8, eerste lid, onder a][ref2]. Indien over bedoelde werkzaamheden een
      gemakkelijk toegankelijke publikatie is verschenen, kan worden volstaan met een verwijzing naar die publikatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005489#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005489#Artikel8
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel4
