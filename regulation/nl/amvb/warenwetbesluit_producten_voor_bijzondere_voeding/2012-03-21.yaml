  - number: '5'
    text: |-
      producten voor bijzondere voeding mogen uitsluitend voorverpakt in de zin van
      [artikel 1, onder c juncto onder b, van het Warenwetbesluit Etikettering van levensmiddelen][ref1] (Stb. 1992, 14)
      worden verhandeld. De verpakking moet de waar volledig omsluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel1
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel5
