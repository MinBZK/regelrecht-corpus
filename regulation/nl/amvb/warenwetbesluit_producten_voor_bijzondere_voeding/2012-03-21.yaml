  - number: '8'
    text: |-
      1 Tenzij krachtens [artikel 10][ref1] nadere regels voor de betrokken categorie van producten voor bijzondere
      voeding zijn vastgesteld, moeten bij de verhandeling van producten voor bijzondere voeding tevens de volgende
      vermeldingen worden gebezigd:

      a. de specifieke bijzonderheden van de kwalitatieve en kwantitatieve samenstelling of de bijzondere bereidingswijze
      die de waar haar bijzondere voedingskenmerken verleent;

      b. de in kJ en kcal uitgedrukte beschikbare energiewaarden en het gehalte aan koolhydraten, eiwitten en vetten
      per 100 g, onderscheidenlijk per 100 ml van de waar, alsmede, voor zover van toepassing, van het volgens de
      gebruiksaanwijzing uit de waar bereide product.

      2 Indien de energiewaarde van de waar evenwel lager is dan 50 kJ per 100 g, onderscheidenlijk per 100 ml, mag de in
      het eerste lid, onder b, bedoelde vermelding worden vervangen door de vermelding "energiewaarde lager dan 50 kJ (12
      kcal) per 100 g", onderscheidenlijk "energiewaarde lager dan 50 kJ (12 kcal per 100 ml)"


      [ref1]: https://wetten.overheid.nl/BWBR0005489#Artikel10
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel8
    references:
      - id: ref1
