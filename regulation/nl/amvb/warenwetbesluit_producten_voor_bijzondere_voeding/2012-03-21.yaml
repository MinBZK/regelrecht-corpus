        artikel: '10'
        paragraaf: '4'
  - number: '9'
    text: |-
      Onze Minister stelt ter uitvoering van krachtens [richtlijn 89/398/EEG](31989L0398) getroffen maatregelen nadere
      regels vast met betrekking tot het mogen zinspelen op een dieet dan wel een categorie van personen waarvoor
      een product voor bijzondere voeding is bestemd, bij het te koop aanbieden, de presentatie en de aanprijzing van
      producten voor bijzondere voeding.
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel9
  - number: 9a
    text: |-
      1 Ten aanzien van een eet- of drinkwaar wordt geen vermelding gebezigd waaruit kan worden afgeleid dat de
      desbetreffende eet- of drinkwaar meer in het bijzonder bestemd of geschikt is voor lijders aan suikerziekte.

      2 Het eerste lid is niet van toepassing op een eet- of drinkwaar waarvoor op grond van artikel 9, eerste lid, van
      het Algemeen Besluit (Warenwet) toestemming is verleend, voor zover de desbetreffende vermelding wordt gebezigd
      onder de aan die toestemming gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel9a
  - number: '10'
    text: |-
      1 Onze Minister stelt ter uitvoering van krachtens artikel 4, juncto artikel 13 van [richtlijn 89/398/EEG]
      (31989L0398) getroffen maatregelen, nadere regels vast met betrekking tot de in de bijlage genoemde categorieën van
      producten voor bijzondere voeding.

      2 Totdat de in het eerste lid bedoelde maatregelen zijn getroffen, kan Onze Minister nadere regels als bedoeld in
      het eerste lid, vaststellen.
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel10
  - number: '11'
    text: |-
      1 Onze Minister stelt ter uitvoering van krachtens [richtlijn 89/398/EEG](31989L0398) getroffen maatregelen, nadere
      regels vast met betrekking tot de toevoeging van vitamines, minerale zouten, aminozuren en andere stoffen aan
      producten voor bijzondere voeding.

      2 Onze Minister stelt ter uitvoering van krachtens [richtlijn 89/398/EEG](31989L0398) getroffen maatregelen nadere
      regels vast met betrekking tot de zuiverheid van de in het eerste lid bedoelde stoffen.

      3 Totdat de in het eerste en tweede lid bedoelde maatregelen zijn getroffen, kan Onze Minister nadere regels
      vaststellen met betrekking tot de in die leden bedoelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel11
  - number: '12'
    text: |-
      1 Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of met betrekking tot de in
      dit besluit bedoelde producten voor bijzondere voeding al dan niet is voldaan aan de bij of krachtens dit besluit
      gestelde regels, worden aangewezen chromatografische, fysische, chemische en andere scheidingsmethoden.

      2 Onze Minister kan, in overeenstemming met de Minister van Landbouw, Natuurbeheer en Visserij, omtrent de in het
      eerste lid bedoelde methoden nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel12
  - number: '13'
    text: Het Aanduidingenbesluit waren voor bijzondere voeding (Warenwet) (Stb. 1980, 658) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005489/2012-03-21#Artikel13
  - number: '15'
    text: |-
      Waar in een algemene maatregel van bestuur op grond van de [Warenwet][ref1] de verwijzing "Aanduidingenbesluit
      waren voor bijzondere voeding (Warenwet)" voorkomt wordt deze telkens vervangen door: Warenwetbesluit producten
      voor bijzondere voeding.


