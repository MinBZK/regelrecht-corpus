        artikel: '1'
        paragraaf: '1'
  - number: '7'
    text: |-
      1 Onverminderd het [Warenwetbesluit Etikettering van levensmiddelen][ref1] moet bij de verhandeling van producten
      voor bijzondere voeding, bedoeld in [artikel 1, tweede lid, onder a en b][ref2], een vermelding worden gebezigd
      betreffende de bijzondere voedingskenmerken van de betrokken waar.

      2 Onverminderd het [Warenwetbesluit Etikettering van Levensmiddelen][ref3] moet bij de verhandeling van producten
      voor bijzondere voeding, bedoeld in [artikel 1, tweede lid, onder c][ref4], een vermelding worden gebezigd
      betreffende de bestemming van de waar.

      3 De [artikelen 19, eerste lid, onderdeel a][ref5], en [20, tweede lid, onder a, van de Warenwet][ref6] (Stb. 1988,
      360), zijn niet van toepassing, voor zover het betreft het verstrekken van nuttige inlichtingen en aanbevelingen
      met betrekking tot de in dit besluit bedoelde waren, die uitsluitend zijn bestemd voor personen die bevoegd zijn op
      het gebied van geneeskunde, voeding of farmacie.


