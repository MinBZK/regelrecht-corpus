articles:
  - number: II
    text: |-
      In afwijking van [artikel 17, eerste en tweede lid, van het Inschrijvingsbesluit ziekenfondsverzekering][ref1]
      wordt een op het tijdstip van inwerkingtreding van dit besluit bestaande inschrijving na een termijn van zes
      maanden, te rekenen vanaf de dag van die inwerkingtreding, beëindigd indien vóór de dag waarop die termijn is
      verstreken, van de verzekerde een schriftelijk verzoek om beëindiging van de inschrijving is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002518#Artikel17
    url: https://wetten.overheid.nl/BWBR0005336/1992-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002518
        artikel: '17'
  - number: III
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop
      [artikel II, onderdeel B, van de Wet stelselwijziging ziektekostenverzekering tweede fase][ref1] (*Stb.* 1991, 587)
      in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005282#ArtikelII
    url: https://wetten.overheid.nl/BWBR0005336/1992-01-01#ArtikelIII
