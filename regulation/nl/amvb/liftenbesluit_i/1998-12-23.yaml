---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: liftenbesluit_i
regulatory_layer: AMVB
publication_date: '2001-11-27'
valid_from: '1998-12-23'
bwb_id: BWBR0002212
url: https://wetten.overheid.nl/BWBR0002212/1998-12-23
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken d.d. 6 februari 1956, No. 316, Afdeling
    Arbeidersbescherming;

    Overwegende, dat het in het belang van de veiligheid noodzakelijk is voorschriften vast te stellen, waaraan
    bepaalde soorten van liften moeten voldoen;

    Gelet op de artikelen 1, 2, 3, 4, 6, 9, 10, 12, 15 en 24 van de Wet op de gevaarlijke werktuigen;

    De Raad van State gehoord (advies van 6 maart 1956, No. 55);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken van 16 maart 1956, No. 1050, Afdeling
    Arbeidersbescherming;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel1
  - number: 1.a
    text: |-
      lift: vast opgesteld hefwerktuig dat bepaalde stopplaatsen bedient, bestemd is voor het vervoer van personen of
      goederen en voorzien is van één of meer betreedbare kooien, die zich geheel of gedeeltelijk langs verticale of
      minder dan 15° uit het lood staande leiders bewegen.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel1
  - number: 1.b
    text: 'kooi: het onderdeel van de lift waarmee personen of goederen worden vervoerd;'
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel1
  - number: 1.c
    text: |-
      elektrische personenlift: lift met elektrische aandrijving bestemd voor het vervoer van personen of van personen
      en goederen;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel1
  - number: 1.d
    text: |-
      hydraulische personenlift: lift met hydraulische aandrijving bestemd voor het vervoer van personen of van personen
      en goederen;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel1
  - number: 1.e
    text: |-
      N 1081: Veiligheidsvoorschriften voor elektrische personen- en goederenliften met betreedbare kooi, vastgesteld
      door de Hoofdcommissie voor de Normalisatie in Nederland en uitgegeven in december 1950.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel1
  - number: 1.f
    text: |-
      NEN 1081: Veiligheidsvoorschriften voor elektrische personen- en goederenliften met betreedbare kooi, derde druk,
      uitgegeven door de Stichting Nederlands Normalisatie-instituut in december 1971, zoals laatstelijk gewijzigd in
      februari 1989;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel1
  - number: 1.g
    text: |-
      NEN-EN 81-1: Veiligheidsvoorschriften voor het vervaardigen en het aanbrengen van personenliften en klein-
      goederenliften, [deel 1][ref1], Elektrische personenliften, tweede druk, uitgegeven door de Stichting Nederlands
      Normalisatie-instituut in september 1986, zoals laatstelijk gewijzigd in december 1989;


      [ref1]: https://wetten.overheid.nl/BWBR0002212#Artikel1
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002212
        artikel: '1'
        paragraaf: '1'
  - number: 1.h
    text: |-
      NEN-EN 81-2: Veiligheidsvoorschriften voor het vervaardigen en het aanbrengen van personenliften en klein-
      goederenliften, [deel 2][ref1], Hydraulische personenliften, eerste druk, uitgegeven door de Stichting Nederlands
      Normalisatie-instituut in mei 1989, zoals laatstelijk gewijzigd in mei 1990;


      [ref1]: https://wetten.overheid.nl/BWBR0002212#Artikel1
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002212
        artikel: '1'
        paragraaf: '1'
  - number: 1.i
    text: |-
      wet: [Wet op de gevaarlijke werktuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002087
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002087
  - number: 1.j
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid.'
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van dit besluit wordt een kooi geacht betreedbaar te zijn indien tenminste één van de afmetingen
      van de kooi, dan wel indien de kooi verdeeld is in compartimenten tenminste één van de afmetingen daarvan, groter
      is dan:





                  vloeroppervlakte: 1.00 m2;




                  diepte: 1.00 m;




                  hoogte: 1.20 m.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel2
  - number: '3'
    text: |-
      Als gevaarlijke werktuigen in de zin van [artikel 1, lid 1][ref1], sub *a*, van de
      [Wet op de gevaarlijke werktuigen][ref2] worden aangewezen liften, als bedoeld in [artikel 1][ref3] van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002212#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002087
      [ref3]: https://wetten.overheid.nl/BWBR0002212#Artikel1
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002212
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002087
      - id: ref3
        bwb_id: BWBR0002212
        artikel: '1'
        paragraaf: '1'
  - number: '4'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel4
  - number: 4.a
    text: liften aan boord van schepen;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel4
  - number: 4.b
    text: liften in of naar de ondergrondse werken van mijnen;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel4
  - number: 4.c
    text: |-
      liften, waarbij door de aard van de bestemming en het gebruik liftschachten, kooiafsluitingen en dergelijke niet
      voorkomen, zoals étalage-, orkest- en toneelliften;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel4
  - number: 4.d
    text: bouwliften, uitsluitend bestemd voor goederenvervoer;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel4
  - number: 4.e
    text: liften die door lichaamskracht worden bewogen.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel4
  - number: 4.f
    text: |-
      liften, niet bestemd voor het heffen en verplaatsen van personen, waarop het [Besluit machines][ref1] van
      toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0005884
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005884
  - number: 4.g
    text: |-
      liften, bestemd voor het heffen en verplaatsen van personen, waarop het [Besluit machines][ref1] of het
      [Warenwetbesluit machines][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0005884
      [ref2]: https://wetten.overheid.nl/BWBR0005577
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005884
      - id: ref2
        bwb_id: BWBR0005577
  - number: 4.h
    text: |-
      liften, waarop het [Besluit liften][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008212
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008212
  - number: '5'
    text: |-
      Elektrische en hydraulische personenliften moeten voldoen aan hetgeen ten aanzien van de vervaardiging is bepaald
      in de hoofdstukken 0 tot en met 16 en bijlage Z van NEN-EN 81-1 onderscheidenlijk NEN-EN 81-2, met dien verstande
      dat in plaats van het in punt 13.1.1.4 van die normen bepaalde het volgende geldt: "De elektrische installatie
      van liften dient te voldoen aan de eisen vermeld in de geharmoniseerde documenten van het Europees Comité voor
      elektrotechnische normalisatie (CENELEC) welke zijn goedgekeurd door de nationale comités voor de elektrotechniek
      van de landen van de Europese Economische Gemeenschap".
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel5
  - number: '17'
    text: |-
      Liften moeten vóór de ingebruikneming, ten hoogste twaalf maanden na de ingebruikneming en vervolgens telkens
      na verloop van ten hoogste achttien maanden worden gekeurd. Indien bij de keuring blijkt dat een lift tenminste
      voldoet aan de voor die lift geldende vervaardigingsvoorschriften, wordt een certificaat van goedkeuring afgegeven.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel17
  - number: '18.1'
    text: |-
      Nadat een lift door de daartoe ingevolge [artikel 12][ref1] der wet door Onze Minister aangewezen ambtenaren van
      een merk van afkeuring is voorzien, kan dit merk, behalve door genoemde ambtenaren, mede verwijderd worden door
      de diensten, instellingen of onderzoekingsbureaus, die ingevolge [artikel 5][ref2] der wet door Onze Minister zijn
      aangewezen, indien en voor zover zulks bij die aanwijzing is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002212#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002212#Artikel5
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002212
        artikel: '12'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002212
        artikel: '5'
        paragraaf: '2'
  - number: '18.2'
    text: |-
      Het is, behoudens het in het vorige lid bepaalde, verboden een lift te ontdoen van het daarop aangebrachte merk van
      afkeuring dan wel zodanig merk te beschadigen of onleesbaar te maken.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel18
  - number: '18.3'
    text: Onze Minister kan nadere bepalingen vaststellen met betrekking tot de merken van afkeuring.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel18
  - number: '19'
    text: |-
      Hij, die een lift voorhanden heeft, die in gebruik of voor gebruik gereed is, is verplicht te zorgen, dat deze in
      goede staat van onderhoud verkeert en dat deze na onderhoud, wijziging of reparatie tenminste voldoet aan de voor
      die lift geldende vervaardigingsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel19
  - number: '20.1'
    text: 'Hij, die een lift voorhanden heeft, is verplicht te zorgen, dat:'
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel20
  - number: 20.1.a
    text: |-
      machinekamers, schijvenruimten en schachtputten niet worden gebruikt als bergruimte van voorwerpen, welke niet tot
      de lift behoren;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel20
  - number: 20.1.b
    text: liftschachten uitsluitend als kokers voor liften en niet voor andere doeleinden worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel20
  - number: 20.1.c
    text: machinekamers, schijvenruimten en luiken, bestemd voor inspectie en onderhoud, zijn afgesloten met slot en sleutel;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel20
  - number: 20.1.d
    text: |-
      de onder *c* bedoelde sleutels zijn voorzien van aanduidingen en op een uitsluitend voor bevoegden toegankelijke
      plaats worden bewaard;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel20
  - number: 20.1.e
    text: |-
      in de machinekamers een aanwijzing is opgehangen, waarin is aangegeven, op welke wijze de machine met de hand kan
      worden getornd.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel20
  - number: '20.2'
    text: |-
      Hij die een lift zonder kooiafsluiting voorhanden heeft, welke bestemd is voor het vervoer van goederen onder
      begeleiding van een persoon, is verplicht te zorgen dat de lift slechts wordt bediend door personen die met die
      bediening vertrouwd zijn.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel20
  - number: '21'
    text: 'Hij, die een lift bedient, bestuurt of belaadt, is verplicht te zorgen, dat:'
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel21
  - number: 21.a
    text: |-
      de toelaatbare belasting en het aantal toe te laten personen, aangegeven op opschriften in de kooi, niet worden
      overschreden;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel21
  - number: 21.b
    text: bij vervoer van goederen de belasting zo gelijkmatig mogelijk over het vloeroppervlak van de kooi wordt verdeeld;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel21
  - number: 21.c
    text: wagens voor het vervoer van goederen, benevens beweegbare onderdelen van die wagens, in de kooi zijn vastgezet.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel21
  - number: '22'
    text: |-
      Hij, die een lift voorhanden heeft, is verplicht bij te houden en te bewaren een liftboek, volgens een door Onze
      Minister vastgesteld model, bevattende:
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a
    text: 'de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.1°
    text: aanduiding van de lift, waarop het boek betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.2°
    text: naam en adres van de eigenaar of houder;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.3°
    text: naam van de fabrikant en van de leverancier;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.4°
    text: bouwjaar en jaar van ingebruikneming;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.5°
    text: soort lift;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.6°
    text: toelaatbare kooibelasting in kg en het toelaatbaar aantal personen;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.7°
    text: hefhoogte;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.8°
    text: aantal stopplaatsen, schachttoegangen en kooitoegangen;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.9°
    text: nominale kooisnelheid in m/sec.;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.10°
    text: nominale gelijkstelsnelheid in m/sec.;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.11°
    text: wijze van besturing in kooi en bij schachttoegang;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.a.12°
    text: plaats van de machine;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.b
    text: een algemene overzichtstekening met de bijbehorende legende;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.c
    text: een installatieschema;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.d
    text: een werkingsschema;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.e
    text: aantekeningen betreffende het onderhoud en kabelvernieuwing;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: 22.f
    text: aantekeningen omtrent keuringsrapporten.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel22
  - number: '23'
    text: 'Hij, die een lift voorhanden heeft, welke is voorzien van een merk van afkeuring, is verplicht te zorgen, dat:'
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel23
  - number: 23.a
    text: |-
      de schachtdeuren van de lift zodanig zijn gesloten en vastgezet, dat deze niet zonder bijzondere hulpmiddelen
      kunnen worden geopend;
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel23
  - number: 23.b
    text: |-
      op of nabij elke schachtdeur van de lift duidelijk en opvallend een opschrift is aangebracht, luidende: "Lift
      buiten dienst", of enige andere aanduiding, waaruit kennelijk het buiten dienst gesteld zijn van de lift blijkt.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel23
  - number: '26'
    text: |-
      Het bepaalde in [artikel 10, derde lid][ref1], van de wet is mede van toepassing op het voorhanden hebben en het
      gebruiken van een lift in de huishouding.


      [ref1]: https://wetten.overheid.nl/BWBR0002212#Artikel10
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002212
        artikel: '10'
        paragraaf: '2'
  - number: '27.1'
    text: |-
      Het in [artikel 5][ref1] bepaalde is niet van toepassing ten aanzien van elektrische en hydraulische personenliften
      die vóór een bij koninklijk besluit te bepalen tijdstip in bedrijf zijn gesteld en die


      [ref1]: https://wetten.overheid.nl/BWBR0002212#Artikel5
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002212
        artikel: '5'
        paragraaf: '2'
  - number: 27.1.a
    text: geheel voldoen aan het bepaalde in de hoofdstukken II tot en met X en XII van N 1081, dan wel
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel27
  - number: 27.1.b
    text: |-
      voldoen aan het bepaalde in de hoofdstukken II tot en met X en XII van N 1081, met uitzondering van de artikelen
      5, derde lid, 8, tweede lid, 12, vijfde lid, 13, tweede lid, eerste volzin, 16, eerste tot en met vierde lid,
      17, tweede en derde lid, 19, eerste lid, 20, derde lid, 21, laatste volzin, 22, tweede lid, 26, derde lid, tweede
      volzin, en vierde lid, 27, derde lid, 28, eerste lid, onder a, en tweede lid, onder e, 32, 34, eerste lid, onder
      c, en tweede lid, onder a en *b*, 41, derde lid, onder b2, en vierde lid, 42, tweede lid, 43, eerste lid, 48,
      derde lid, 49, tweede lid, en vierde lid, vanaf de tweede volzin, mits zij voldoen aan de met de hiervoor genoemde
      bepalingen van N 1081 overeenkomende bepalingen van NEN 1081, met dien verstande dat, indien de kooiafsluitingen
      van een lift mechanisch worden aangedreven, de blokkeerinrichting in de kooi achterwege mag blijven, dan wel
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel27
  - number: 27.1.c
    text: geheel voldoen aan het bepaalde in de hoofdstukken II tot en met X en XII van NEN 1081 dan wel
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel27
  - number: 27.1.d
    text: |-
      geheel voldoen aan het bepaalde in de hoofdstukken 0 tot en met 16 van NEN-EN 81-1, eerste druk, uitgegeven in
      juni 1979.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel27
  - number: '27.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid, aanhef en onderdelen a, b en c, moeten de daar bedoelde liften
      die in bedrijf zijn gesteld op of na 24 januari 1978 ten aanzien van kooitoegangen en de vloeroppervlakte van de
      kooi voldoen aan hetgeen daaromtrent is bepaald in NEN-EN 81-1, met dien verstande dat voor hydraulische liften in
      punt 8.2.1 van die norm, in noot c onder tabel 1.1 in plaats van "0,16 m2", geldt: 0,50 m2. Het in de vorige volzin
      bepaalde geldt niet ten aanzien van liften voor de levering waarvan opdracht is gegeven vóór 24 oktober 1978 en die
      voor eerste keuring zijn gereed gekomen vóór 24 juli 1979.
    url: https://wetten.overheid.nl/BWBR0002212/1998-12-23#Artikel27
  - number: '28'
    text: |-
      Het in [artikel 5][ref1] bepaalde is tot 1 januari 1993 niet van toepassing ten aanzien van elektrische en
      hydraulische personenliften die op of na een bij koninklijk besluit te bepalen tijdstip in bedrijf zijn gesteld,
      indien voor de levering daarvan opdracht is gegeven vóór dat laatst bedoelde tijdstip, mits zij voldoen aan het
      bepaalde in [artikel 27, eerste lid, onderdeel ][ref2] en tevens aan [het tweede lid][ref3] van dat artikel, dan
      wel in geval van elektrische personenliften aan [artikel 27, eerste lid, onderdeel ][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002212#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002212#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002212#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0002212#Artikel27
