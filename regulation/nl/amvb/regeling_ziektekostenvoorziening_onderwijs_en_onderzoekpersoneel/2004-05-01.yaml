    text: |-
      een centrale dienst als bedoeld in [artikel 68 van de Wet op het primair onderwijs][ref1],
      [artikel 69 van de Wet op de expertisecentra][ref2] en [artikel 53b van de Wet op het voortgezet onderwijs][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel53b
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel2
