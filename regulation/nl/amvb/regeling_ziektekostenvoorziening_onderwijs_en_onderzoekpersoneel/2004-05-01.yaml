  - number: 2.c.8
    text: |-
      een instelling als bedoeld in
      [artikel 1.2, onder a, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel2
    references:
