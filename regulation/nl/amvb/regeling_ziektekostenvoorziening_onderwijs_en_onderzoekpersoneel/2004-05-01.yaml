  - number: '3'
    text: Degene die een ziektekostenverzekering heeft gesloten die tenminste omvat
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel3
  - number: 3.a
    text: |-
      volledige vergoeding van kosten van behandeling, verzorging en verpleging in een ziekenhuis gedurende een jaar met
      klinische specialistenhulp en bijkomende kosten, eventueel met een eigen risico aan de voet; en
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel3
  - number: 3.b
    text: |-
      tenminste 80% vergoeding van niet-klinische (ambulante) specialistenhulp dan wel volledige vergoeding met een eigen
      risico aan de voet,
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel3
  - number: '4'
    text: |-
      Bij ministeriële regeling worden categorieën van personen, wier bezoldiging, uitkering of pensioen direct of
      indirect komt ten laste van de algemene middelen van het Rijk, aangewezen als betrokkenen in de zin van dit
      besluit.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel4
  - number: '5.1'
    text: |-
      Geen recht op een tegemoetkoming, bedoeld in [artikel 1][ref1], heeft degene:


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel1
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008816
        artikel: '1'
  - number: 5.1.a
    text: |-
      die verplicht verzekerd is in de zin van de [Ziekenfondswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: 5.1.b
    text: |-
      die op grond van een verplichte verzekering medeverzekerde is in de zin van de [Ziekenfondswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: 5.1.c
    text: |-
      wiens premie van een ziektekostenverzekering dan wel wiens ziektekosten komen ten laste van de
      [Wet werk en bijstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 5.1.d
    text: |-
      die als bewoner van een bejaardenoord in de zin van de Wet op de bejaardenoorden geen bijdrage verschuldigd is, dan
      wel een bijdrage lager dan de kosten van verblijf als bedoeld in het Bijdragebesluit bewoners van bejaardenoorden.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel5
  - number: '5.2'
    text: |-
      Het eerste lid geldt niet voor de betrokkene die verplicht verzekerd is in de zin van de [Ziekenfondswet][ref1] ten
      aanzien van de te zijnen laste blijvende ziektekosten van zijn medebetrokkenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '6'
    text: Medebetrokkene in de zin van dit besluit is degene die behoort tot het huishouden van betrokkene en
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel6
  - number: 6.a
    text: in voldoende mate verzekerd is tegen het risico van ziektekosten;
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel6
  - number: 6.b
    text: |-
      niet zelfstandig verplicht verzekerd of medeverzekerde is in de zin van de [Ziekenfondswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: 6.c
    text: |-
      niet zelfstandig aanspraak ontleent aan deze of een overeenkomstige regeling, noch direct deelneemt aan een
      publiekrechtelijke ziektekostenregeling voor ambtenaren,
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel6
  - number: '7.1'
    text: Onder «te zijnen laste blijvende ziektekosten» wordt verstaan het bedrag van
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel7
  - number: 7.1.a
    text: 'de betaalde premie van een ziektekostenverzekering, met dien verstande dat daarbij als maximum geldt:'
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel7
  - number: 7.1.a.1e
    text: |-
      voor een (mede) betrokkene die verzekerd is volgens de standaardpakketpolis: de
      jaarpremie voor de standaardpakketpolis, verhoogd met de omslagbijdragen ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1] en de
      omslagbijdragen ingevolge [artikel 11 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel11
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003933
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009750
        artikel: '11'
  - number: 7.1.a.2e
    text: |-
      voor overige (mede) betrokkenen: de jaarpremie voor een verzekering met een dekkingspakket conform
      de [Ziekenfondswet][ref1], zoals deze door het Centraal Planbureau in het desbetreffende kalenderjaar
      wordt gehanteerd ten behoeve van het Centraal Economisch Plan, verhoogd met de omslagbijdragen ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref2] en de
      omslagbijdragen ingevolge [artikel 11 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0003933#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009750#Artikel11
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002460
      - id: ref2
        bwb_id: BWBR0003933
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0009750
        artikel: '11'
  - number: 7.1.a.3e
    text: |-
      in afwijking van het bepaalde onder ten 1e en ten 2e voor een eigen kind, stiefkind, pleegkind of aangehuwd
      kind dat behoort tot het huishouden van betrokkene en dat verzekerd is volgens de standaardpakketpolis de helft
      van de jaarpremie voor de standaardpakketpolis, dan wel, indien het bedoelde kind niet verzekerd is volgens
      de standaardpakketpolis, de helft van de jaarpremie voor een verzekering met een dekkingspakket conform de
      [Ziekenfondswet][ref1], zoals deze door het Centraal Planbureau in het desbetreffende kalenderjaar wordt gehanteerd
      ten behoeve van het Centraal Economisch Plan; in beide gevallen verhoogd met de voor hen geldende omslagbijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: 7.1.b
    text: |-
      de kosten van geneeskundige verzorging, voorzover deze voorkomen op een door Onze Minister vast te stellen
      vergoedingenlijst, met inachtneming van de daarbij aan te geven beperkingen, voor zover betrokkene deze kosten
      noodzakelijkerwijs heeft gemaakt voor zichzelf en voor zijn medebetrokkenen, en voorzover deze te zijnen laste
      blijven.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel7
  - number: '7.2'
    text: |-
      Tot «te zijnen laste blijvende ziektekosten» worden niet gerekend de kosten van geneeskundige verzorging ter
      zake van met name genoemde ziekten of aandoeningen die bij een overeenkomst van de ziektekostenverzekering zijn
      uitgesloten, tenzij deze kosten zijn gemaakt tijdens een door de verzekeringsmaatschappij gestelde wachttijd.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel7
  - number: '7.3'
    text: |-
      Indien de betrokkene voor zichzelf en zijn medebetrokkenen een ziektekostenverzekering heeft afgesloten waarvoor
      de premie bestaat uit een totaalbedrag voor alle verzekerden tezamen, waarbij de premie niet tot de individuele
      verzekerden herleid kan worden, worden de premies voor de betrokkene en diens medebetrokkenen bepaald door het
      totaalbedrag te vermenigvuldigen met een breuk.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel7
  - number: '7.4'
    text: |-
      Bij de in het derde lid bedoelde breuk is de noemer gelijk aan het aantal verzekerden op de polis, met dien
      verstande dat een eigen kind, stiefkind, pleegkind of aangehuwd kind dat behoort tot het huishouden van betrokkene
      voor de helft meetellen.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel7
  - number: '7.5'
    text: |-
      Bij de in het derde lid bedoelde breuk wordt bij de berekening van de teller een eigen kind, stiefkind, pleegkind
      of aangehuwd kind dat behoort tot het huishouden van betrokkene voor 0,5 meegeteld en de betrokkene en de overige
      leden van het huishouden van betrokkene voor 1.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel7
  - number: '7.6'
    text: |-
      Op het bedrag dat voor tegemoetkoming in aanmerking kan worden gebracht wordt in mindering gebracht een door het
      Rijk of door derden toegekende of toe te kennen tegemoetkoming in ziektekosten.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel7
  - number: '8.1'
    text: |-
      Voor het verlenen van een tegemoetkoming kunnen in aanmerking worden gebracht de te zijnen laste blijvende
      ziektekosten die betrokkene als zodanig heeft gemaakt gedurende een aaneengesloten tijdvak van twaalf maanden, met
      dien verstande dat de kosten, bedoeld in [artikel 7][ref1], betrekking moeten hebben op dit tijdvak. Voor de vraag
      of de kosten, bedoeld in [artikel 7, eerste lid, onderdeel ][ref2], betrekking hebben op het tijdvak is bepalend
      of de datum van de nota in dat tijdvak is gelegen. De in [artikel 7][ref3] bedoelde maxima gelden voor de in het
      desbetreffende kalenderjaar betaalde premies en bijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008816#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008816#Artikel7
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008816
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0008816
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0008816
        artikel: '7'
  - number: '8.2'
    text: |-
      In geval van overlijden van de betrokkene binnen een jaar na het verstrijken van een tijdvak als bedoeld in het
      eerste lid, waarover krachtens deze regeling een tegemoetkoming is verleend, kunnen de ziektekosten met betrekking
      tot het tijdvak gelegen tussen het einde van evenbedoeld tijdvak en de datum van overlijden eveneens voor het
      verlenen van een tegemoetkoming aan diens nagelaten betrekkingen in aanmerking worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel8
  - number: '8.3'
    text: |-
      Degene die na ontslag in verband met de privatisering van een overheidsdienst waarbij hij werkzaam was niet langer
      betrokkene is kan de te zijnen laste blijvende ziektekosten met betrekking tot het aaneengesloten tijdvak dat
      korter is dan twaalf kalendermaanden en eindigt vóór de datum van ontslag, voor het verlenen van een tegemoetkoming
      in aanmerking brengen.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel8
  - number: '8.4'
    text: |-
      De aanvraag om toekenning van de tegemoetkoming geschiedt binnen drie maanden na het einde van het tijdvak
      waarop zij betrekking heeft. In geval van overlijden van de betrokkene geschiedt de aanvraag om toekenning van de
      tegemoetkoming binnen zes maanden na het einde van het tijdvak, waarop zij betrekking heeft, danwel binnen vijftien
      maanden na het einde van het voorgaande tijdvak.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel8
  - number: '8.5'
    text: |-
      Een beschikking op de aanvraag wordt gegeven binnen zestien weken na ontvangst van de aanvraag. Indien een
      beschikking niet binnen de termijn van zestien weken kan worden gegeven, wordt de aanvrager hiervan schriftelijk in
      kennis gesteld onder opgave van redenen en onder vermelding van de termijn waarbinnen de beschikking wel tegemoet
      kan worden gezien. Deze termijn bedraagt ten hoogste acht weken.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel8
  - number: '8.6'
    text: |-
      De aanvraag wordt niet in behandeling genomen indien de betrokkene niet tevens heeft verklaard ermee in te stemmen,
      dat allen, die daarvoor naar het oordeel van Onze Minister in aanmerking komen, omtrent zijn omstandigheden alle
      inlichtingen geven, welke voor de uitvoering van dit besluit noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel8
  - number: '9.1'
    text: |-
      De tegemoetkoming, bedoeld in [artikel 1][ref1], wordt aan de betrokkene verleend voor zover de te zijnen laste
      blijvende ziektekosten hoger zijn dan het drempelbedrag. Dit drempelbedrag is gelijk aan de som van de volgende
      bedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel1
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008816
        artikel: '1'
  - number: 9.1.a
    text: |-
      een bedrag dat overeenkomt met het werknemersdeel van de ziekenfondspremie, berekend over het inkomen
      van betrokkene op basis van de procentuele ziekenfondspremie zoals deze is vastgelegd ingevolge
      [artikel 15 van de Ziekenfondswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 9.1.b
    text: |-
      een bedrag dat overeenkomt met het effect van de fiscale bijtelling van het werkgeversdeel van de procentuele
      ziekenfondspremie zoals deze is vastgesteld ingevolge [artikel 15 van de Ziekenfondswet][ref1], berekend over het
      inkomen van de betrokkene;


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 9.1.c
    text: |-
      een bedrag dat overeenkomt met de nominale premie ingevolge [artikel 17 van de Ziekenfondswet][ref1] voor
      betrokkene en zijn medebetrokkenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel17
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '17'
  - number: '9.2'
    text: |-
      Bij de berekening van het effect, bedoeld in het eerste lid, onderdeel b, wordt gerekend met het
      tarief van de voor de op één na laagste inkomenscategorie geldende tariefschijf van de tarieftabel in
      artikel 53a van de Wet op de inkomstenbelasting 1964, vermeerderd met het heffingspercentage ingevolge
      [artikel 10 van de Wet financiering volksverzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel10
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '10'
  - number: '10.1'
    text: |-
      Voor de vaststelling van de norm, bedoeld in [artikel 9][ref1], wordt uitgegaan van


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel9
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008816
        artikel: '9'
  - number: 10.1.a
    text: |-
      de gemiddelde procentuele premie en de gemiddelde nominale premie die gelden over het in
      [artikel 8, eerste lid][ref1], bedoelde tijdvak;


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel8
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008816
        artikel: '8'
  - number: 10.1.b
    text: |-
      de inkomsten die betrokkene heeft genoten in het kalenderjaar waarin de eerste maand valt van het tijdvak, bedoeld
      in [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel8
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008816
        artikel: '8'
  - number: '10.2'
    text: |-
      Indien betrokkene niet gedurende het gehele kalenderjaar als zodanig kan worden aangemerkt, of indien in dat
      kalenderjaar of in de loop van het tijdvak, bedoeld in [artikel 8, eerste lid][ref1], de inkomsten van betrokkene
      uit of in verband met arbeid een verlaging hebben ondergaan als gevolg van de daling van een uitkeringspercentage
      of als gevolg van een wijziging in de aard of het karakter van bedoelde inkomsten, wordt uitgegaan van zijn
      inkomsten, genoten in dat tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel8
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008816
        artikel: '8'
  - number: '10.3'
    text: |-
      Voor zover een aanvraag om een tegemoetkoming betrekking heeft op het tijdvak, bedoeld in [artikel 8][ref1], tweede
      respectievelijk derde lid, wordt voor de vaststelling van de norm, bedoeld in [artikel 9][ref2], uitgegaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008816#Artikel9
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008816
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008816
        artikel: '9'
  - number: 10.3.a
    text: |-
      de gemiddelde procentuele premie en de gemiddelde nominale premie naar rato die gelden over het tijdvak, bedoeld in
      [artikel 8][ref1], tweede respectievelijk derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel8
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008816
        artikel: '8'
  - number: 10.3.b
    text: |-
      de inkomsten die betrokkene heeft genoten in het tijdvak, bedoeld in [artikel 8][ref1], tweede respectievelijk
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel8
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008816
        artikel: '8'
  - number: '11.1'
    text: |-
      Behoudens het tweede en derde lid komen de kosten van de tegemoetkomingen ingevolge dit besluit, afhankelijk van de
      bekostiging van de betrokken instelling, ten laste van hoofdstuk VIII dan wel XIV van de Rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel11
  - number: '11.2'
    text: |-
      De kosten van de tegemoetkomingen ingevolge dit besluit verleend aan betrokkene die in een of meer betrekkingen
      werkzaam is bij een instelling, komen voor rekening van de instelling waar betrokkene werkzaam is.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel11
  - number: '11.3'
    text: |-
      In geval een betrokkene als bedoeld in het tweede lid gedurende het door hem gekozen tijdvak van twaalf maanden,
      waarvoor hij de te zijnen laste blijvende ziektekosten ingevolge dit besluit voor vergoeding in aanmerking doet
      komen, in meerdere betrekkingen werkzaam is geweest, komen de kosten van de tegemoetkoming ingevolge dit besluit
      voor rekening van de instelling waarbij hij gedurende dit tijdvak in totaal de hoogste inkomsten als bedoeld in
      [artikel 2, onderdeel b, onder 1][ref1] heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel2
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008816
        artikel: '2'
  - number: '12'
    text: Onze Minister kan omtrent het bepaalde in dit besluit nadere voorschriften vaststellen.
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel12
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: de Regeling ziektekostenvoorziening onderwijs en onderzoekpersoneel.'
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel13
