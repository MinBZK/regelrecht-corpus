    text: |-
      een bekostigde school in de zin van de [Wet op het voortgezet onderwijs][ref1] dan wel een op de
      [Experimentenwet onderwijs][ref2] gebaseerde instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002718
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0002718
  - number: 2.c.5
    text: |-
      een instelling als bedoeld in de [artikelen 1][ref1] en
      [12 van de Wet subsidiëring landelijke onderwijsondersteunende activiteiten][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008725#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008725#Artikel12
    url: https://wetten.overheid.nl/BWBR0008816/2004-05-01#Artikel2
