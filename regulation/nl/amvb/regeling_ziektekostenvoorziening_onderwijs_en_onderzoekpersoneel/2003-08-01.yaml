  - number: '6'
    text: |-
      Medebetrokkene in de zin van dit besluit is degene die behoort tot het huishouden van betrokkene en

      a. in voldoende mate verzekerd is tegen het risico van ziektekosten;

      b. niet zelfstandig verplicht verzekerd of medeverzekerde is in de zin van de [Ziekenfondswet][ref1];

      c. niet zelfstandig aanspraak ontleent aan deze of een overeenkomstige regeling, noch direct deelneemt aan een
      publiekrechtelijke ziektekostenregeling voor ambtenaren,

      terwijl de inkomsten van betrokkene meer bedragen dan de helft van de totale inkomsten van alle leden van dat
      huishouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0008816/2003-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '7'
    text: >-
      1 Onder «te zijnen laste blijvende ziektekosten» wordt verstaan het bedrag van


      a. de premie van een ziektekostenverzekering, aan een verzekeringsmaatschappij verschuldigd op basis van verpleging
      in de laagste klasse van een ziekenhuis en


      b. de kosten van geneeskundige verzorging, indien en voor zover die voorkomen op een vergoedingenlijst, door Onze
      Minister nader vast te stellen, met inachtneming van de daarbij aan te geven beperkingen,


      een en ander na aftrek van een door het Rijk of door derden toegekende of toe te kennen tegemoetkoming in
      ziektekosten, voor zover betrokkene deze kosten noodzakelijkerwijs heeft gemaakt voor zichzelf en voor zijn
      medebetrokkenen, en voor zover deze te zijnen laste blijven.


      2 Tot «te zijnen laste blijvende ziektekosten» worden niet gerekend de kosten van geneeskundige verzorging ter
      zake van met name genoemde ziekten of aandoeningen die bij een overeenkomst van de ziektekostenverzekering zijn
      uitgesloten, tenzij deze kosten zijn gemaakt tijdens een door de verzekeringsmaatschappij gestelde wachttijd.
    url: https://wetten.overheid.nl/BWBR0008816/2003-08-01#Artikel7
  - number: '8'
    text: |-
      1 Voor het verlenen van een tegemoetkoming kunnen in aanmerking worden gebracht de te zijnen laste blijvende
      ziektekosten die betrokkene als zodanig heeft gemaakt gedurende een aaneengesloten tijdvak van twaalf maanden, met
      dien verstande dat de kosten, bedoeld in [artikel 7][ref1], betrekking moeten hebben op dit tijdvak. Voor de vraag
      of de kosten, bedoeld in [artikel 7, eerste lid, onderdeel ][ref2], betrekking hebben op het tijdvak is bepalend of
      de datum van de nota in dat tijdvak is gelegen.

      2 In geval van overlijden van de betrokkene binnen een jaar na het verstrijken van een tijdvak als bedoeld in het
      eerste lid, waarover krachtens deze regeling een tegemoetkoming is verleend, kunnen de ziektekosten met betrekking
      tot het tijdvak gelegen tussen het einde van evenbedoeld tijdvak en de datum van overlijden eveneens voor het
      verlenen van een tegemoetkoming aan diens nagelaten betrekkingen in aanmerking worden gebracht.

      3 Degene die na ontslag in verband met de privatisering van een overheidsdienst waarbij hij werkzaam was
      niet langer betrokkene is kan de te zijnen laste blijvende ziektekosten met betrekking tot het aaneengesloten
      tijdvak dat korter is dan twaalf kalendermaanden en eindigt vóór de datum van ontslag, voor het verlenen van een
      tegemoetkoming in aanmerking brengen.

      4 De aanvraag om toekenning van de tegemoetkoming geschiedt binnen drie maanden na het einde van het tijdvak,
      waarop zij betrekking heeft of, in geval van overlijden van betrokkene, binnen zes maanden.

      5 Een beschikking op de aanvraag wordt gegeven binnen zestien weken na ontvangst van de aanvraag. Indien een
      beschikking niet binnen de termijn van zestien weken kan worden gegeven, wordt de aanvrager hiervan schriftelijk in
      kennis gesteld onder opgave van redenen en onder vermelding van de termijn waarbinnen de beschikking wel tegemoet
      kan worden gezien. Deze termijn bedraagt ten hoogste acht weken.

      6 De aanvraag wordt niet in behandeling genomen indien de betrokkene niet tevens heeft verklaard ermee in
      te stemmen, dat allen, die daarvoor naar het oordeel van Onze Minister in aanmerking komen, omtrent zijn
      omstandigheden alle inlichtingen geven, welke voor de uitvoering van dit besluit noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008816#Artikel7
