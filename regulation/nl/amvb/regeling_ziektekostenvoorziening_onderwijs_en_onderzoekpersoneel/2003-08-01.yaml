preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Binnenlandse Zaken van 19 november 1996, nr. AB96/U1390, directoraat-
    generaal Management en Personeelsbeleid, directie Arbeidszaken Overheid, gedaan mede namens Onze Ministers van
    Justitie en van Onderwijs, Cultuur en Wetenschappen alsmede de Staatssecretaris van Defensie;


    Gelet op artikel 125 en 134 van de Ambtenarenwet; artikel 16 van de Wet rechtspositie rechterlijke ambtenaren;
    artikel 50, eerste lid, van de Politiewet 1993; artikel 9, zesde lid, van de LSOP-wet; artikel 20, tweede lid, van
    de Wet op het basisonderwijs; artikel 28, tweede lid, van de Interimwet op het speciaal onderwijs en het voortgezet
    speciaal onderwijs; de artikelen 38a, tweede lid, en 61 van de Wet op het voortgezet onderwijs; artikel 4 van de
    Experimentenwet onderwijs; de artikelen 4.1.2, tweede lid, 4.1.4, en 4.3.2, tweede lid, van de Wet educatie en
    beroepsonderwijs; de artikelen 4.5, 4.6, 10.10, derde lid, 11.12, eerste lid, 13.1, vijfde lid, en 13.3, vijfde
    lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek; de artikelen 14, eerste lid, en 35 van
    de Wet op de Nederlandse organisatie voor het Wetenschappelijk onderzoek, alsmede artikel 12 van de Militaire
    Ambtenarenwet 1931;


    De Raad van State gehoord (advies van 17 februari 1997, nr.WO4.96 0057);


    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 19 juni 1997, nr. AB97/233, directoraat-
    generaal Management en Personeelsbeleid, directie Arbeidszaken Overheid, uitgebracht mede namens Onze Ministers van
    Justitie en van Onderwijs, Cultuur en Wetenschappen alsmede de Staatssecretaris van Defensie;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008816/2003-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      Naar de regelen van dit besluit heeft de betrokkene die in voldoende mate is verzekerd tegen het risico van
      ziektekosten recht op een tegemoetkoming in te zijnen laste blijvende ziektekosten van zichzelf en van zijn
      medebetrokkenen.
    url: https://wetten.overheid.nl/BWBR0008816/2003-08-01#Artikel1
  - number: '2'
    text: |-
      In dit besluit wordt verstaan onder:

      a. «Onze Minister»: Onze Minister van Onderwijs, Cultuur en Wetenschappen mede namens Onze Minister van Landbouw,
      Natuurbeheer en Visserij;

      b. «inkomsten»:

      1. alle door Onze Minister nader te bepalen inkomsten uit of in verband met arbeid daartoe mede gerekend pensioenen
      en uitkeringen ingevolge sociale regelingen, onder welke benamingen dan ook;

      2. inkomsten uit of in verband met de uitoefening van een vrij beroep of eigen bedrijf, zijnde winst uit
      onderneming als bedoeld in de Wet op de inkomstenbelasting 1964;

      c. instelling:

      1. een school in de zin van de [Wet op het primair onderwijs][ref1];

      2. een school of instelling in de zin van de [Wet op de expertisecentra][ref2];

      3. een bekostigde school in de zin van de [Wet op het voortgezet onderwijs][ref3] dan wel een op de
      [Experimentenwet onderwijs][ref4] gebaseerde instelling;

      4.

      5. een instelling als bedoeld in de [artikelen 1][ref5] en
      [12 van de Wet subsidiëring landelijke onderwijsondersteunende activiteiten][ref6];

      6. een centrale dienst als bedoeld in [artikel 68 van de Wet op het primair onderwijs][ref7],
      [artikel 69 van de Wet op de expertisecentra][ref8] en [artikel 53b van de Wet op het voortgezet onderwijs][ref9];

      7. een rechtspersoon die met toepassing van
      [artikel 2, eerste lid onderdelen f en g, dan wel derde lid onderdeel b van de Wet privatisering ABP][ref10] is
      aangewezen, onderscheidenlijk wordt geacht te zijn aangewezen als lichaam, welks personeel geheel of ten dele
      overheidswerknemer is in de zin van die wet, indien dat lichaam middellijk of onmiddellijk, geheel of gedeeltelijk
      wordt gesubsidieerd ten laste van hoofdstuk VIII van de Rijksbegroting en waarop dit besluit door Onze Minister van
      toepassing is verklaard;

      8. een instelling als bedoeld in
      [artikel 1.2, onder a, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref11];

      9. de organisatie genoemd in de [Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref12].


