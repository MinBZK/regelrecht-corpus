  - number: '3'
    text: >-
      Degene die een ziektekostenverzekering heeft gesloten die tenminste omvat


      a. volledige vergoeding van kosten van behandeling, verzorging en verpleging in een ziekenhuis gedurende een jaar
      met klinische specialistenhulp en bijkomende kosten, eventueel met een eigen risico aan de voet; en


      b. tenminste 80% vergoeding van niet-klinische (ambulante) specialistenhulp dan wel volledige vergoeding met een
      eigen risico aan de voet,


      is voor de toepassing van deze regeling in voldoende mate verzekerd tegen het risico van ziektekosten.
    url: https://wetten.overheid.nl/BWBR0008816/2003-08-01#Artikel3
  - number: '4'
    text: >-
      Bij ministeriële regeling worden categorieën van personen, wier bezoldiging, uitkering of pensioen direct of
      indirect komt ten laste van de algemene middelen van het Rijk, aangewezen als betrokkenen in de zin van dit
      besluit.
    url: https://wetten.overheid.nl/BWBR0008816/2003-08-01#Artikel4
  - number: '5'
    text: |-
      1 Geen recht op een tegemoetkoming, bedoeld in [artikel 1][ref1], heeft degene:

      a. die verplicht verzekerd is in de zin van de [Ziekenfondswet][ref2];

      b. die op grond van een verplichte verzekering medeverzekerde is in de zin van de [Ziekenfondswet][ref3];

      c. wiens premie van een ziektekostenverzekering dan wel wiens ziektekosten komen ten laste van de [Algemene
      Bijstandswet](onbekend);

      d. die als bewoner van een bejaardenoord in de zin van de Wet op de bejaardenoorden geen bijdrage verschuldigd
      is, dan wel een bijdrage lager dan de kosten van verblijf als bedoeld in het Bijdragebesluit bewoners van
      bejaardenoorden.

      2 Het eerste lid geldt niet voor de betrokkene die verplicht verzekerd is in de zin van de [Ziekenfondswet][ref4]
      ten aanzien van de te zijnen laste blijvende ziektekosten van zijn medebetrokkenen.


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0002460
      [ref4]: https://wetten.overheid.nl/BWBR0002460
