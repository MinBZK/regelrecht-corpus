  - number: '10'
    text: |-
      1 Voor de vaststelling van de norm, bedoeld in [artikel 9][ref1], wordt uitgegaan van

      a. de gemiddelde procentuele premie en de gemiddelde nominale premie die gelden over het in
      [artikel 8, eerste lid][ref2], bedoelde tijdvak;

      b. de inkomsten die betrokkene heeft genoten in het kalenderjaar waarin de eerste maand valt van het tijdvak,
      bedoeld in [artikel 8, eerste lid][ref3].

      2 Indien betrokkene niet gedurende het gehele kalenderjaar als zodanig kan worden aangemerkt, of indien in dat
      kalenderjaar of in de loop van het tijdvak, bedoeld in [artikel 8, eerste lid][ref4], de inkomsten van betrokkene
      uit of in verband met arbeid een verlaging hebben ondergaan als gevolg van de daling van een uitkeringspercentage
      of als gevolg van een wijziging in de aard of het karakter van bedoelde inkomsten, wordt uitgegaan van zijn
      inkomsten, genoten in dat tijdvak.

      3 Voor zover een aanvraag om een tegemoetkoming betrekking heeft op het tijdvak, bedoeld in [artikel 8][ref5],
      tweede respectievelijk derde lid, wordt voor de vaststelling van de norm, bedoeld in [artikel 9][ref6], uitgegaan
      van:

      a. de gemiddelde procentuele premie en de gemiddelde nominale premie naar rato die gelden over het tijdvak, bedoeld
      in [artikel 8][ref7], tweede respectievelijk derde lid;

      b. de inkomsten die betrokkene heeft genoten in het tijdvak, bedoeld in [artikel 8][ref8], tweede respectievelijk
      derde lid.


