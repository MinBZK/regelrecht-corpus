  - number: '11'
    text: |-
      1 Behoudens het tweede en derde lid komen de kosten van de tegemoetkomingen ingevolge dit besluit, afhankelijk van
      de bekostiging van de betrokken instelling, ten laste van hoofdstuk VIII dan wel XIV van de Rijksbegroting.

      2 De kosten van de tegemoetkomingen ingevolge dit besluit verleend aan betrokkene die in een of meer betrekkingen
      werkzaam is bij een instelling, komen voor rekening van de instelling waar betrokkene werkzaam is.

      3 In geval een betrokkene als bedoeld in het tweede lid gedurende het door hem gekozen tijdvak van twaalf maanden,
      waarvoor hij de te zijnen laste blijvende ziektekosten ingevolge dit besluit voor vergoeding in aanmerking doet
      komen, in meerdere betrekkingen werkzaam is geweest, komen de kosten van de tegemoetkoming ingevolge dit besluit
      voor rekening van de instelling waarbij hij gedurende dit tijdvak in totaal de hoogste inkomsten als bedoeld in
      [artikel 2, onderdeel b, onder 1][ref1] heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0008816#Artikel2
    url: https://wetten.overheid.nl/BWBR0008816/2003-08-01#Artikel11
