articles:
  - number: '1'
    text: |-
      1 Als opeenvolgend verlies van arbeidsuren als bedoeld in [16, derde lid, van de Werkloosheidswet][ref1] wordt
      beschouwd:

      a. een eerste verlies van minder dan vijf of minder dan de helft van het aantal arbeidsuren per kalenderweek,
      waarna in een andere kalenderweek een of meer volgende verliezen van arbeidsuren zich voordoen in een periode
      van een jaar na de dag waarop zich het eerste verlies van minder dan vijf of minder dan de helft van het aantal
      arbeidsuren voordoet;

      b. een eerste verlies van ten minste vijf of ten minste de helft van het aantal arbeidsuren per kalenderweek,
      waarna in een andere kalenderweek een of meer volgende verliezen van arbeidsuren zich voordoen van ten minste vijf
      of de helft van het aantal arbeidsuren in een periode van 26 kalenderweken na de eerste dag van werkloosheid.

      2 Een eerste verlies als bedoeld in het eerste lid, onderdeel *a*, wordt alleen in aanmerking genomen, indien
      dit verlies uitsluitend wegens zijn omvang niet leidt tot een recht op uitkering, terwijl overigens aan alle
      voorwaarden voor het ontstaan van een recht op uitkering is voldaan.

      3 Een eerste verlies als bedoeld in het eerste lid, onderdeel *b*, wordt alleen in aanmerking genomen, indien ter
      zake van dit verlies een recht op uitkering is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004096/2013-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
  - number: '2'
    text: |-
      Opeenvolgend verlies van arbeidsuren als bedoeld in [artikel 1, onderdeel a][ref1], wordt op verzoek van de
      werknemer opgeteld tot één verlies van arbeidsuren tot en met het moment dat het opeenvolgend verlies van
      arbeidsuren totaal ten minste vijf of ten minste de helft van het aantal arbeidsuren per kalenderweek voorafgaande
      aan het eerste verlies van arbeidsuren bedraagt en wordt vanaf dat moment beschouwd als een verlies van ten minste
      vijf of ten minste de helft van het aantal arbeidsuren.


      [ref1]: https://wetten.overheid.nl/BWBR0004096#Artikel1
    url: https://wetten.overheid.nl/BWBR0004096/2013-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004096
        artikel: '1'
  - number: '3'
    text: |-
      1 Het UWV telt, met inachtneming van [artikel 2][ref1], opeenvolgend verlies van arbeidsuren als bedoeld in
      [artikel 1, onderdeel b][ref2], voor zover dit betrekking heeft op een dienstbetrekking of op een of meer
      dienstbetrekkingen waarvoor eerstgenoemde dienstbetrekking in de plaats is gekomen samen tot één verlies van
      arbeidsuren.

      2 Toepassing van het eerste lid brengt geen wijziging in de dag waarop recht op uitkering ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004096#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004096#Artikel1
    url: https://wetten.overheid.nl/BWBR0004096/2013-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004096
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004096
        artikel: '1'
  - number: '4'
    text: |-
      1 Het verlies van arbeidsuren, bedoeld in [artikel 1][ref1], dat zich voordoet in een kalenderweek gelegen na de
      dag waarop zich een eerder verlies van arbeidsuren voordoet, wordt berekend door het aantal arbeidsuren in die
      kalenderweek in mindering te brengen op het gemiddeld aantal arbeidsuren in de kalenderweken van het voorgaande
      verlies tot en met de kalenderweek voorafgaande aan die waarin het volgend verlies plaatsvindt.

      2 Indien een opgeteld verlies van arbeidsuren, vermeerderd met het resterend aantal arbeidsuren groter is dan het
      aantal arbeidsuren voorafgaand aan een eerder verlies van arbeidsuren, wordt de omvang van het laatste verlies
      zodanig vastgesteld dat het opgetelde verlies, vermeerderd met het resterend aantal arbeidsuren, gelijk is aan het
      aantal arbeidsuren voorafgaande aan het eerdere verlies van arbeidsuren.

      3 Indien toepassing van dit artikel tot een kennelijk onredelijk resultaat leidt is het UWV bevoegd bij de
      berekening een of meer kalenderweken en de in die weken gelegen arbeidsuren buiten aanmerking te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0004096#Artikel1
    url: https://wetten.overheid.nl/BWBR0004096/2013-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004096
        artikel: '1'
  - number: '5'
    text: |-
      Voor de werknemer, bedoeld in [artikel 18 van de Werkloosheidswet][ref1], wordt als periode voor de berekening
      van het aantal arbeidsuren in aanmerking genomen het aantal kalenderweken waarin hij arbeidsuren heeft gehad in de
      dienstbetrekking waaruit hij arbeidsuren heeft verloren, met een maximum van 26 kalenderweken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0004096/2013-06-01#Artikel5
