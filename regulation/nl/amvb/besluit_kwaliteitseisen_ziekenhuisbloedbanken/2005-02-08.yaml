---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_kwaliteitseisen_ziekenhuisbloedbanken
regulatory_layer: AMVB
publication_date: '2015-12-01'
valid_from: '2005-02-08'
bwb_id: BWBR0017831
url: https://wetten.overheid.nl/BWBR0017831/2005-02-08
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 29 oktober 2004, kenmerk GMT/MT
    2517358;

    Gelet op artikel 6 van Richtlijn 2002/98/EG van het Europees Parlement en de Raad van 27 januari 2003 tot
    vaststelling van kwaliteits- en veiligheidsnormen voor het inzamelen, testen, bewerken, opslaan en distribueren van
    bloed en bloedbestanddelen van menselijke oorsprong en tot wijziging van Richtlijn 2001/83/EG van de Raad (PbEU L
    33) en op artikel 6, eerste lid, van de Kwaliteitswet zorginstellingen;

    De Raad van State gehoord (advies van 18 november 2004, nummer W13.04.0525/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 20 december 2004, GMT/MT
    2541282;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Dit besluit heeft betrekking op de uitvoering van de [artikelen 3][ref1] en
      [4 van de Kwaliteitswet zorginstellingen][ref2] in instellingen, behorende tot de categorie van ziekenhuizen.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007850#Artikel4
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007850
        artikel: '4'
  - number: '1.2'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
  - number: 1.2.a
    text: |-
      ziekenhuisbloedbank: een ziekenhuisafdeling die bloed en bloedbestanddelen, alleen bestemd voor gebruik in
      ziekenhuizen, onder meer voor transfusieactiviteiten in een ziekenhuis, opslaat en distribueert, en daar
      compatibiliteitstests op mag uitvoeren;
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
  - number: 1.2.b
    text: 'bloed: volbloed dat bij een donor is afgenomen en behandeld is met het oog op transfusie of verdere verwerking;'
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
  - number: 1.2.c
    text: |-
      bloedbestanddeel: een therapeutisch bestanddeel van bloed, te weten rode bloedcellen, witte bloedcellen,
      bloedplaatjes, plasma, dat door middel van verschillende methoden kan worden bereid;
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
  - number: 1.2.d
    text: |-
      ernstig ongewenst voorval: een ongewenst voorval in verband met het inzamelen, testen, bewerken, opslaan en
      distribueren van bloed en bloedbestanddelen dat voor een patiënt overlijden, levensgevaar, invaliditeit of
      arbeidsongeschiktheid tot gevolg kan hebben, dan wel leidt tot opname in een ziekenhuis of de duur van de ziekte
      verlengt;
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
  - number: 1.2.e
    text: |-
      ernstige ongewenste bijwerking: een onbedoelde reactie bij de donor of de patiënt in verband met het inzamelen
      of de transfusie van bloed of bloedbestanddelen, die dodelijk is, levensgevaar oplevert, invaliditeit of
      arbeidsongeschiktheid veroorzaakt, dan wel leidt tot opname in een ziekenhuis of de duur van de ziekte verlengt;
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
  - number: 1.2.f
    text: |-
      vrijgave van een bloedbestanddeel: een proces dat ertoe leidt dat de quarantainestatus van een bloedbestanddeel
      wordt opgeheven door middel van het gebruik van systemen en procedures waarmee gewaarborgd wordt dat het
      eindproduct voldoet aan de specificaties voor vrijgave;
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
  - number: 1.2.g
    text: |-
      uitsluiting: permanente of tijdelijke opschorting van iemands geschiktheid voor het doneren van bloed of
      bloedbestanddelen;
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
  - number: 1.2.h
    text: |-
      distributie: het leveren van bloed en bloedbestanddelen aan andere ziekenhuisbloedbanken en producenten van uit
      bloed en plasma verkregen producten. Het uitgeven van bloed of bloedbestanddelen voor transfusie valt hier niet
      onder;
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
  - number: 1.2.i
    text: |-
      autologe transfusie: een transfusie waarbij de donor tevens de ontvanger is en waarbij eerder afgegeven bloed en
      bloedbestanddelen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
  - number: '1.3'
    text: Dit besluit is niet van toepassing op bloedstamcellen.
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel1
  - number: '2'
    text: |-
      Het personeel van een ziekenhuisbloedbank dat rechtstreeks betrokken is bij het opslaan, testen en distribueren
      van bloed en bloedbestanddelen van menselijke oorsprong, beschikt over de nodige kwalificaties om die taken uit te
      voeren en krijgt tijdig een geschikte opleiding en regelmatige bijscholing.
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel2
  - number: '3'
    text: |-
      De zorgaanbieder voert voor de ziekenhuisbloedbank een kwaliteitszorgsysteem in en past dit toe op basis van de
      beginselen van goede praktijken.
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel3
  - number: '4'
    text: |-
      De zorgaanbieder houdt voor de ziekenhuisbloedbank documentatie bij over operationele procedures, richtsnoeren,
      handboeken en handleidingen, alsmede rapportageformulieren.
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel4
  - number: '5.1'
    text: |-
      Teneinde bloed en bloedbestanddelen die worden opgeslagen, getest of gedistribueerd, van de donor tot de
      ontvanger en omgekeerd te kunnen traceren, past de zorgaanbieder in de ziekenhuisbloedbank een systeem toe voor
      het identificeren van iedere bloeddonatie en iedere afzonderlijke bloedeenheid en de bestanddelen daarvan. Het
      systeem moet elke unieke donatie en elk uniek type bloedbestanddeel ondubbelzinnig identificeren. Het systeem
      wordt tot stand gebracht overeenkomstig de voorschriften, bedoeld in artikel 29, onder a, van [Richtlijn 2002/98/
      EG](32002L0098) van het Europees Parlement en de Raad van 27 januari 2003 tot vaststelling van kwaliteits- en
      veiligheidsnormen voor het inzamelen, testen, bewerken, opslaan en distribueren van bloed en bloedbestanddelen van
      menselijke oorsprong en tot wijziging van [Richtlijn 2001/83/EG](32001L0083) van de Raad (PbEU L 33).
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel5
  - number: '5.2'
    text: |-
      Ten aanzien van bloed en bloedbestanddelen die uit derde landen zijn ingevoerd, past de zorgaanbieder in de
      ziekenhuisbloedbank een donoridentificatiesysteem toe dat een gelijke mate van traceerbaarheid mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel5
  - number: '5.3'
    text: |-
      Het systeem dat de zorgaanbieder gebruikt voor het etiketteren van bloed en bloedbestanddelen die in het kader
      van de ziekenhuisbloedbank worden opgeslagen of gedistribueerd, voldoet aan het in het eerste lid bedoelde
      identificatiesysteem en de in de bijlage bij dit besluit opgenomen etiketteringsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel5
  - number: '5.4'
    text: |-
      Gegevens die noodzakelijk zijn voor volledige traceerbaarheid overeenkomstig dit artikel, worden ten minste 30
      jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel5
  - number: '6.1'
    text: |-
      De zorgaanbieder meldt aan de met het toezicht op de naleving van de [Kwaliteitswet zorginstellingen][ref1] belaste
      ambtenaar en aan de Bloedvoorzieningsorganisatie, beoeld in de [Wet inzake bloedvoorziening][ref2], ernstige
      ongewenste voorvallen in verband met het opslaan, testen en distribueren van bloed en bloedbestanddelen die de
      kwaliteit en de veiligheid ervan kunnen beïnvloeden, alsook ernstige ongewenste bijwerkingen die tijdens of na een
      transfusie worden geconstateerd en die kunnen worden toegeschreven aan de kwaliteit en de veiligheid van het bloed
      en de bloedbestanddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007850
      [ref2]: https://wetten.overheid.nl/BWBR0009079
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007850
      - id: ref2
        bwb_id: BWBR0009079
  - number: '6.2'
    text: |-
      De zorgaanbieder beschikt over een nauwkeurige, snelle en verifieerbare procedure om bloed en bloedbestanddelen die
      met een melding als bedoeld in het eerste lid in verband worden gebracht, aan de distributie te onttrekken.
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel6
  - number: '7'
    text: |-
      De zorgaanbieder voldoet bij de volgende handelingen aan de voorschriften, bedoeld in het daarachter vermelde
      onderdeel van artikel 29 van de in [artikel 5, eerste lid][ref1], genoemde richtlijn: - opslag, vervoer en
      distributie van bloed en bloedbestanddelen: onderdeel e;
        - autologe transfusie: onderdeel g;
        - melding van ernstige ongewenste voorvallen en bijwerkingen: onderdeel i.


      [ref1]: https://wetten.overheid.nl/BWBR0017831#Artikel5
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017831
        artikel: '5'
  - number: '8'
    text: |-
      De zorgaanbieder zorgt ervoor dat de in het kader van dit besluit verzamelde gegevens die door derden kunnen worden
      geraadpleegd, met inbegrip van genetische informatie, geanonimiseerd zijn zodat de donor niet meer te identificeren
      is. Daartoe: - treft hij maatregelen met het oog op de gegevensbeveiliging en schept garanties tegen ongeoorloofde
      toevoeging, schrapping of wijziging in bestanden van donoren of uitsluitingen, alsmede tegen overdracht van
      informatie;
        - legt hij procedures vast om discrepanties tussen gegevens op te heffen;
        - voorkomt hij ongeoorloofde bekendmaking van dergelijke informatie, waarbij de donaties echter wel traceerbaar
      moeten blijven.
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel8
  - number: '9'
    text: Dit besluit treedt in werking met ingang van 8 februari 2005.
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit kwaliteitseisen ziekenhuisbloedbanken.'
    url: https://wetten.overheid.nl/BWBR0017831/2005-02-08#Artikel10
