---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_indicatie_advisering_bejaardenoorden_en_verpleeginrichtingen
regulatory_layer: AMVB
publication_date: '2002-11-07'
valid_from: '1994-01-17'
bwb_id: BWBR0004408
url: https://wetten.overheid.nl/BWBR0004408/1994-01-17
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 9 september 1987, nr. BO-U-2990,
    gedaan mede namens de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Overwegende dat het gewenst is de advisering met betrekking tot de opneming in bejaardenoorden, alsmede
    de advisering met betrekking tot de opneming en het verder verblijf onderscheidenlijk de dagbehandeling in
    verpleeginrichtingen voor zover het betreft ouderen, op zoveel mogelijk gelijke wijze te regelen;

    Gelet op artikel 6 l van de Wet op de bejaardenoorden (Stb. 1984, 656) en artikel 77 van de Algemene Wet Bijzondere
    Ziektekosten (Stb. 1967, 655);

    Gezien het advies van de Centrale Commissie voor de bejaardenoorden (advies van 26 maart 1987, nr. CCb/U-674), de
    Ziekenfondsraad (advies van 26 maart 1987, kenmerk SV/SGZ/3139) en de Raad voor de gemeentefinanciën (advies van 30
    maart 1987, kenmerk 1310 RGF 165/29);

    De Raad van State gehoord (advies van 22 augustus 1988, no. W13.87 0532.);

    Gezien het nader rapport van Onze Minister van Welzijn, Volksgezondheid en Cultuur en de Staatssecretaris van
    Sociale Zaken en Werkgelegenheid van 27 september 1988, nr. BO-U-4196;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel1
  - number: 1.1.a
    text: |-
      de commissie: de commissie, bedoeld in artikel 6*j*, eerste lid, van de Wet op de bejaardenoorden (*Stb.* 1984,
      656);
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel1
  - number: 1.1.b
    text: 'de verzoeker: de persoon ten behoeve van wie een verzoek om advies bij de commissie is ingediend;'
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel1
  - number: 1.1.c
    text: |-
      het advies: het advies, bedoeld in artikel 6, van de Wet op bejaardenoorden onderscheidenlijk
      [artikel 30, derde lid, van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref1], of het oordeel
      bedoeld in [artikel 60 van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel60
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0005700
        artikel: '60'
  - number: 1.1.d
    text: 'het bejaardenoord: de inrichting, bedoeld in artikel 1, onderdeel *c*, van de Wet op de bejaardenoorden;'
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel1
  - number: 1.1.e
    text: |-
      de verpleeginrichting: de inrichting, bedoeld in [artikel 1, eerste lid, onderdeel A][ref1], sub *b*, van het
      Verstrekkingenbesluit Bijzondere Ziektekostenverzekering 1968;


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel1
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '1'
        paragraaf: '1'
  - number: 1.1.f
    text: |-
      het uitvoeringsorgaan: een ziekenfonds, ziektekostenverzekeraar of uitvoerend orgaan als bedoeld in
      [hoofdstuk V van de Algemene Wet Bijzondere Ziektekosten][ref1] (*Stb.* 1967, 655);


      [ref1]: https://wetten.overheid.nl/BWBR0002614#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        hoofdstuk: V
  - number: 1.1.g
    text: |-
      psycho-geriatrische verpleeginrichting: een op grond van artikel 1, eerste lid onder *h* van de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], als zodanig aangemerkte zorginstelling of
      afdeling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: '1.2'
    text: |-
      De commissie wordt voor zover het opneming en verder verblijf in een psycho-
      geriatrische verpleeginrichting betreft, aangewezen als commissie als bedoeld in
      [artikel 60, derde lid, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel60
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '60'
  - number: '2.1'
    text: |-
      De arts die zitting heeft in de commissie dient bevoegd te zijn tot het uitoefenen van de geneeskunst in Nederland
      en te beschikken over geriatrische en psycho-geriatrische deskundigheid. Indien meer dan één arts zitting heeft in
      de commissie dienen zij ten minste gezamenlijk over deze deskundigheden te beschikken.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel2
  - number: '2.2'
    text: |-
      De maatschappelijk werker die zitting heeft in de commissie dient te beschikken over deskundigheid op het terrein
      van de psycho-sociale verschijnselen, behorend bij het verouderingsproces, en in het bezit te zijn van een der
      getuigschriften uitgereikt vanwege:
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel2
  - number: 2.2.a
    text: een ingevolge de Wet op het Hoger Beroepsonderwijs bekostigde Sociale Academie;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel2
  - number: 2.2.b
    text: |-
      een ingevolge de Wet op het Hoger Beroepsonderwijs bekostigde opleiding voor Hogere Sociale Arbeid, richting
      algemeen maatschappelijk werk, uitgaande van de Stichting voor Opleiding tot Sociale Arbeid te Haarlem of van de
      Katholieke Leergangen te Tilburg,
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel2
  - number: '3.1'
    text: |-
      Een verzoek om advies wordt door of namens de verzoeker ingediend. Ondertekent de verzoeker het verzoek niet
      zelf, dan wordt de reden daarvan vermeld. In het verzoek kan aangegeven worden of de verzoeker in aanmerking wenst
      te komen voor opneming in een bejaardenoord dan wel voor opneming en verder verblijf of dagbehandeling in een
      verpleeginrichting waarbij het bejaardenoord of de verpleeginrichting met name kan worden genoemd.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel3
  - number: '3.2'
    text: |-
      In het verzoek wordt aangegeven of de verzoeker toestemming geeft tot het zonodig raadplegen van behandelend artsen
      en het gebruik maken van bij dezen aanwezige medische gegevens door de commissie.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel3
  - number: '3.3'
    text: |-
      De commissie wijst de verzoeker onverwijld op het bepaalde in [paragraaf 8][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Paragraaf8
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004408
        paragraaf: '8'
  - number: '3.4'
    text: |-
      Indien het een verzoek betreft tot opneming en verder verblijf in een psycho-geriatrische verpleeginrichting,
      deelt de commissie, tenzij uit het verzoek blijkt dat de verzoeker de bereidheid bezit tot zodanige opneming en
      verder verblijf, de verzoeker meteen na ontvangst van het verzoek schriftelijk mede dat hij bezwaar kan maken tegen
      zodanige opneming en verder verblijf.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel3
  - number: '4.1'
    text: 'De commissie verricht naar aanleiding van het verzoek een onderzoek naar:'
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel4
  - number: 4.1.a
    text: |-
      de lichamelijke en geestelijke gesteldheid van de verzoeker. Dit onderzoek vindt plaats door of onder
      verantwoordelijkheid van een arts, lid van de commissie;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel4
  - number: 4.1.b
    text: |-
      de huishoudelijke en sociale omstandigheden en de woonsituatie van de verzoeker, de aard en mate van de aan deze
      geboden hulp en de mogelijkheden voor continuering of uitbreiding van die hulp.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel4
  - number: '4.2'
    text: |-
      Indien het een verzoek betreft tot opneming en verder verblijf in een psycho-geriatrische verpleeginrichting is het
      onderzoek, tenzij de verzoeker blijk geeft van bereidheid daartoe, gericht op de beantwoording van de vraag of de
      stoornis van zijn geestvermogens meebrengt dat verzoeker zich niet buiten een zodanige inrichting kan handhaven.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel4
  - number: '4.3'
    text: |-
      Indien het een verzoek betreft tot opneming en verder verblijf in een psycho-geriatrische verpleeginrichting,
      deelt het lid van de commissie dat als eerste contact met de verzoeker heeft, tenzij de verzoeker blijk geeft van
      bereidheid daartoe, verzoeker onmiddellijk mondeling mede dat hij bezwaar kan maken tegen zodanige opneming en
      verder verblijf.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel4
  - number: '4.4'
    text: |-
      Bij het onderzoek wordt zoveel mogelijk gebruik gemaakt van gegevens die bij het verzoek zijn gevoegd of waarvan
      met toestemming van de verzoeker gebruik mag worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel4
  - number: '4.5'
    text: |-
      De commissie kan bij haar onderzoek personen of instellingen betrekken die deskundig zijn op het terrein van
      voorzieningen die bestemd of mede bestemd zijn voor ouderen.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel4
  - number: '5.1'
    text: |-
      Bij het onderzoek, bedoeld in [artikel 4, eerste lid, onder ][ref1], wordt in elk geval acht geslagen op:


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel4
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '4'
        paragraaf: '4'
  - number: 5.1.a
    text: |-
      de gesteldheid van de motorische vermogens, nodig voor het kunnen verrichten van alle noodzakelijke dagelijkse
      levensverrichtingen;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel5
  - number: 5.1.b
    text: de gesteldheid van de zintuiglijke vermogens;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel5
  - number: 5.1.c
    text: de gesteldheid van de geestelijke vermogens;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel5
  - number: 5.1.d
    text: de algemene lichamelijke gesteldheid.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel5
  - number: '5.2'
    text: |-
      Het onderzoek richt zich tevens op de noodzaak van verpleging, waaronder begrepen de noodzaak van dagbehandeling
      of dag- en nachtverzorging, van geneeskundige behandeling en daarmee verband houdend onderzoek, te verlenen
      door artsen, alsmede van met die verpleging verband houdende revalidatie, reactivering, fysiotherapie en
      bezigheidstherapie.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel5
  - number: '5.3'
    text: |-
      Indien daartoe aanleiding bestaat, worden de behandelende artsen van de verzoeker geraadpleegd. Het raadplegen van
      deze artsen geschiedt slechts met toestemming van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel5
  - number: '6'
    text: |-
      Bij het onderzoek, bedoeld in [artikel 4, eerste lid, onder ][ref1], wordt in elk geval acht geslagen op de
      volgende aspecten:


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel4
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '4'
        paragraaf: '4'
  - number: 6.a
    text: |-
      het kunnen verrichten van alle noodzakelijke huishoudelijke verrichtingen, waaronder begrepen het bereiden van
      warme maaltijden, het schoonhouden van de woning, het doen van de dagelijkse boodschappen, het doen van de was, het
      verzorgen van de kleding en het verzorgen van de verwarming;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel6
  - number: 6.b
    text: de contacten van de verzoeker met familie, vrienden en buren;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel6
  - number: 6.c
    text: de grootte van de woning, de toegankelijkheid daarvan en de situering in de woonplaats.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel6
  - number: '7.1'
    text: Van het onderzoek wordt schriftelijk rapport opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel7
  - number: '7.2'
    text: |-
      Indien het een verzoek betreft tot opneming en verder verblijf in een psycho-geriatrische verpleeginrichting maakt
      het rapport, tenzij de verzoeker blijk geeft van bereidheid daartoe, melding van:
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel7
  - number: 7.2.a
    text: de aard van de stoornis van de geestvermogens;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel7
  - number: 7.2.b
    text: de omstandigheden die meebrengen dat verzoeker zich niet buiten een zodanige inrichting kan handhaven.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel7
  - number: '7.3'
    text: |-
      In het rapport wordt aangegeven op welke wijze aan de verzoeker is medegedeeld dat hij bezwaar kan maken tegen de
      opneming en het verblijf in een psycho-geriatrische verpleeginrichting en wordt melding gemaakt van diens reactie
      daar op.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel7
  - number: '8.1'
    text: |-
      De commissie beoordeelt de toestand van de verzoeker aan de hand van het rapport, bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel7
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '7'
        paragraaf: '4'
  - number: '8.2'
    text: De commissie besluit bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel8
  - number: '8.3'
    text: |-
      De leden van de commissie die betrokken zijn bij de behandeling van de verzoeker of in de twee jaar, voorafgaande
      aan de indiening van het verzoek, daarbij betrokken zijn geweest, en de leden die zijn verbonden aan of werkzaam
      voor de verpleeginrichting of het bejaardenoord, waarvoor de verzoeker zijn voorkeur heeft uitgesproken, onthouden
      zich van deelname aan de stemming.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel8
  - number: '9.1'
    text: |-
      Indien een lid van de commissie dit voor de beoordeling van de toestand van de verzoeker noodzakelijk acht, wordt
      op diens verzoek door de commissie opdracht gegeven tot nader onderzoek.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel9
  - number: '9.2'
    text: |-
      De resultaten van het in het eerste lid bedoelde onderzoek worden gevoegd bij het rapport, bedoeld in
      [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel7
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '7'
        paragraaf: '4'
  - number: '10.1'
    text: |-
      Indien een arts, lid van de commissie, van oordeel is dat in een advies tot opneming of dagbehandeling in een
      verpleeginrichting moet worden geconcludeerd, kan slechts tot een andersluidend advies worden besloten, nadat de
      commissie ter zake een onafhankelijke arts heeft geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel10
  - number: '10.2'
    text: De onafhankelijke arts, bedoeld in het eerste lid, deelt de commissie binnen een week zijn oordeel mede.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel10
  - number: '10.3'
    text: |-
      Indien het oordeel van de onafhankelijke arts overeenkomt met het oordeel van de arts van de commissie, wordt het
      advies van de commissie uitgebracht overeenkomstig dat oordeel.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel10
  - number: '11.1'
    text: De commissie brengt haar advies uit binnen zes weken na de datum waarop het verzoek bij haar is ingekomen.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel11
  - number: '11.2'
    text: |-
      In daarvoor in aanmerking komende gevallen wordt mededeling van het advies gedaan de verpleeginrichting of het
      bejaardenoord, waarin opneming of dagbehandeling van de verzoeker naar verwachting zal plaatsvinden of reeds plaats
      heeft gevonden.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel11
  - number: '12'
    text: |-
      Indien het verzoek om advies bij de commissie wordt ingediend nadat de verzoeker reeds in een verpleeginrichting
      is opgenomen, brengt de commissie in afwijking van het bepaalde in [artikel 11, eerste lid][ref1], haar advies uit
      binnen twee weken na de dag waarop het verzoek bij haar is binnengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel11
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '11'
        paragraaf: '6'
  - number: '13.1'
    text: 'Het advies strekt tot een van de volgende conclusies:'
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel13
  - number: 13.1.a
    text: opneming in een bejaardenoord;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel13
  - number: 13.1.b
    text: opneming in een psycho-geriatrische verpleeginrichting;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel13
  - number: 13.1.c
    text: opneming in een andere verpleeginrichting;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel13
  - number: 13.1.d
    text: dagbehandeling in een verpleeginrichting;
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel13
  - number: 13.1.e
    text: opneming of dagbehandeling als bedoeld onder *a*-*d* wordt niet noodzakelijk geacht.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel13
  - number: '13.2'
    text: |-
      Het advies kan alleen strekken tot de in het eerste lid, onder *e*, genoemde conclusie indien de commissie
      hulpverlening niet noodzakelijk acht dan wel, indien zij andere hulpverlening dan die, genoemd in het eerste lid,
      onder *a* tot met *d*, wel noodzakelijk acht, nadat zij zich ervan heeft vergewist dat die andere hulp binnen
      redelijke termijn aan de verzoeker kan worden geboden. Hierbij geeft de commissie zo mogelijk aan, vanuit welke
      categorie van instellingen of personen naar haar oordeel aan de hulpvraag van de verzoeker het meest doeltreffend
      tegemoet kan worden gekomen.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel13
  - number: '13.3'
    text: Het advies kan strekken tot een samenstel van twee van de in het eerste lid genoemde conclusies.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel13
  - number: '14.1'
    text: |-
      In het advies wordt, behoudens in het geval dat de conclusie luidt als vermeld in
      [artikel 13, eerste lid, onder ][ref1], de mate van urgentie tot opneming onderscheidenlijk dagbehandeling
      aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel13
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '13'
        paragraaf: '6'
  - number: '14.2'
    text: |-
      In een advies dat strekt tot opneming en verder verblijf in een psycho-geriatrische verpleeginrichting wordt,
      tenzij de verzoeker blijk geeft van bereidheid daartoe, aangegeven of de commissie van oordeel is dat de stoornis
      van zijn geestvermogens meebrengt dat verzoeker zich niet buiten een zodanige inrichting kan handhaven.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel14
  - number: '15'
    text: |-
      In een advies dat strekt tot een der conclusies als vermeld in [artikel 13, eerste lid, onder ][ref1], kan de
      commissie aangeven hoe lang naar haar oordeel de verzoeker ten hoogste op de desbetreffende vorm van hulp is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel13
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '13'
        paragraaf: '6'
  - number: '16'
    text: In het advies wordt de geldigheidsduur ervan vermeld. De geldigheidsduur kan onbepaald zijn.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel16
  - number: '17'
    text: |-
      De verzoeker wordt bij gelegenheid van het uitbrengen van het advies door de commissie in kennis gesteld van de
      mogelijkheid om aan de commissie een nieuw advies te vragen.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel17
  - number: '18'
    text: |-
      Ingeval in het verzoek is aangegeven dat de verzoeker in aanmerking wenst te komen voor opneming en verder verblijf
      in een verpleeginrichting en uit het verzoek blijkt dat dat verblijf naar verwachting niet langer zal duren dan
      dertien weken, kan de commissie besluiten zonder onderzoek direct een daartoe strekkend advies uit te brengen.
      Zij geeft in haar advies aan dat de verzoeker naar haar oordeel ten hoogste dertien weken op het verblijf is
      aangewezen; de geldigheidsduur van zodanig advies stelt zij eveneens op ten hoogste dertien weken.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel18
  - number: '19'
    text: |-
      Een bewoner van een bejaardenoord dat is of wordt opgeheven, wordt gelijkgesteld met een persoon die in een bezit
      is van een advies, inhoudende een hoge mate van urgentie tot opneming in een bejaardenoord.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel19
  - number: '20.1'
    text: |-
      De instelling waarvoor de verzoeker zijn voorkeur heeft uitgesproken en waaraan overeenkomstig het bepaalde
      in [artikel 11, tweede lid][ref1], een afschrift van het advies is verzonden kan, indien zij daaraan behoefte
      heeft, de commissie verzoeken om het rapport ter zake. De commissie zendt dit toe, tenzij de verzoeker daartegen
      desgevraagd bedenkingen heeft geuit; voor zover het rapport medische gegevens bevat, worden deze bovendien alleen
      toegezonden met toestemming van een arts, lid van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel11
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '11'
        paragraaf: '6'
  - number: '20.2'
    text: |-
      De commissie verzoekt de instellingen aan welke overeenkomstig het bepaalde in [artikel 11, tweede lid][ref1], een
      afschrift van het advies is gezonden, binnen acht weken na ontvangst daarvan aan haar op te geven welke maatregelen
      voor de verzoeker zijn getroffen of binnen welke termijn deze voor hem naar redelijke verwachting beschikbaar
      zullen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel11
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '11'
        paragraaf: '6'
  - number: '20.3'
    text: |-
      De commissie bevordert de opneming onderscheidenlijk de dagbehandeling van die verzoekers ten aanzien van wie
      een advies is afgegeven dat strekt tot één der conclusies, vermeld in [artikel 13, eerste lid, onder ][ref1], en
      waarvan de geldigheidsduur, zo die is bepaald, voor twee-derden is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel13
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '13'
        paragraaf: '6'
  - number: '20.4'
    text: |-
      Indien in een gebied verpleeginrichtingen en bejaardenoorden, onderling of gezamenlijk, een samenwerkingsverband
      zijn aangegaan ten behoeve van het treffen van voorzieningen voor hen aan wie een advies is afgegeven dat strekt
      tot één der conclusies als bedoeld in [artikel 13, eerste lid, onder ][ref1], richt de commissie zich bij de
      uitvoering van het tweede en derde lid tot dat samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel13
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '13'
        paragraaf: '6'
  - number: '21'
    text: |-
      De commissie stelt eenmaal per kwartaal Onze Minister, gedeputeerde staten en burgemeester en wethouders op de
      hoogte van de inhoud van de door haar uitgebrachte adviezen en hetgeen haar omtrent de uitvoering daarvan ingevolge
      [artikel 20, tweede lid][ref1], ter kennis is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel20
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '20'
        paragraaf: '7'
  - number: '23'
    text: |-
      De verzoeker kan burgemeester en wethouders verzoeken te bemiddelen indien zich een geschil met de commissie
      voordoet over de toepassing van [artikel 4:3, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '24'
    text: |-
      Slechts de leden van de commissie, de secretaris, alsmede de personen wier werkzaamheden bestaan uit het aanleggen
      en bijhouden van de dossiers van de commissie hebben tot de dossiers rechtstreeks toegang. De medische gegevens
      worden, onder verantwoordelijkheid van een arts, lid van de commissie, afzonderlijk bewaard; die arts is als enige
      gerechtigd tot de toegang tot die gegevens.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel24
  - number: '25'
    text: |-
      De commissie verschaft de verzoeker desverlangd inzage in de op de verzoeker betrekking hebbende gegevens in het
      dossier.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel25
  - number: '26.1'
    text: |-
      De verzoeker kan de commissie verzoeken om verbetering, aanvulling of verwijdering van de op de verzoeker
      betrekking hebbende gegevens.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel26
  - number: '26.2'
    text: De commissie beslist binnen acht weken na ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel26
  - number: '26.3'
    text: |-
      Belanghebbende kan tegen een beschikking als bedoeld in het tweede lid, beroep instellen bij burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel26
  - number: '26.4'
    text: |-
      De commissie draagt zorg dat een beschikking tot verbetering, aanvulling of verwijdering zo spoedig mogelijk, doch
      uiterlijk binnen acht weken, wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel26
  - number: '27'
    text: |-
      Onverminderd het bepaalde in [artikel 20][ref1] worden de op de verzoeker betrekking hebbende gegevens niet aan
      derden verstrekt, tenzij deze daarvoor schriftelijk toestemming heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004408#Artikel20
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004408
        artikel: '20'
        paragraaf: '7'
  - number: '29'
    text: Het Besluit Opneming in bejaardenoorden (*Stb.* 1976, 619) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel29
  - number: '30'
    text: |-
      Dit besluit is niet van toepassing ten aanzien van degenen die op de datum van de inwerkingtreding van dit besluit
      in het bezit zijn van een advies strekkend tot opneming in een bejaardenoord of van een toestemming tot opneming
      dan wel dagbehandeling in een verpleeginrichting, totstandgekomen overeenkomstig de bepalingen zoals die golden
      voor de inwerkingtreding van dit besluit, doch die nog niet zijn opgenomen dan wel nog niet worden behandeld. Het
      in de vorige volzin bepaalde geldt voor zolang van dat advies dan wel van die toestemming geen gebruik is gemaakt,
      doch voor ten hoogste drie jaar na de datum van de inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel30
  - number: '31.1'
    text: |-
      Een verzoek om opneming in een bejaardenoord dat is ingediend vóór de datum van de inwerkingtreding van dit besluit
      wordt voor wat betreft de behandeling door de commissie gelijkgesteld met een verzoek dat is ingediend na die
      inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel31
  - number: '31.2'
    text: |-
      In gevallen waarin voor de datum van de inwerkingtreding van dit besluit bij het uitvoeringsorgaan een aanvraag
      om opneming en verder verblijf onderscheidenlijk dagbehandeling in een verpleeginrichting ingediend is, waarop nog
      geen beslissing is genomen, is dit besluit niet van toepassing totdat op die aanvraag onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel31
  - number: '32'
    text: |-
      Dit besluit treedt in werking met ingang van de vierde kalendermaand na de datum van uitgifte van het *Staatsblad*
      waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel32
  - number: '33'
    text: Dit besluit kan worden aangehaald als Besluit indicatie-advisering bejaardenoorden en verpleeginrichtingen.
    url: https://wetten.overheid.nl/BWBR0004408/1994-01-17#Artikel33
