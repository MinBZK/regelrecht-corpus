        artikel: '22'
  - number: 1.d
    text: |-
      inspecteur: het hoofd, onderscheidenlijk de in [artikel 123, derde lid, onder b, van de Waterschapswet][ref1],
      bedoelde ambtenaar van het waterschap;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
  - number: 1.e
    text: |-
      analyse: de analyse op het chemisch zuurstofverbruik en het zuurstofverbruik door omzetting van
      stikstofverbindingen.
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel1
  - number: '2'
    text: |-
      De vervuilingswaarde per m3 ingenomen water wordt bepaald met behulp van de navolgende tabel.






                  Indien de bedrijfsruimte of een onderdeel daarvan de volgende bedrijfscategorie betreft:


                  vervuilingswaarde per m3 ingenomen water:






                  Werkplaatsen voor motorvoertuigen en motoren


                  0,031




                  Bij afwezigheid of onvoldoende functioneren van saneringsmaatregelen


                  0,091




                  Inrichtingen uitsluitend bestemd voor het uitwendig reinigen van motorvoertuigen*


                  0,0066




                  Aardappelverwerking


                  0,085




                  Champignonteeltbedrijven


                  0,0093




                  Fruitconservenfabrieken


                  0,0087




                  Groenteconservenbedrijven


                  0,030




                  Groentewasserijen


                  0,018




                  Distilleerderijen/bottelarijen*


                  0,036




                  Verf- en drukinktfabrieken





                  producten op basis van organische oplosmiddelen (exclusief de lozing van loogbaden)


                  0,023




                  Leerlooierijen


                  0,017




                  Limonadefabrieken


                  0,010




                  Galvanische bedrijven, galvanische afdelingen binnen metaalverwerkende en overige bedrijven


                  0,023




                  Indien proceswater wordt geloosd, waarvan de gebruikte hoeveelheid afzonderlijk wordt gemeten


                  0,0050




                  Indien proceswater wordt geloosd, waarvan de gebruikte hoeveelheid afzonderlijk wordt gemeten, en geen
      ontvettingsen/of beitsbaden worden geloosd


                  0,0030




                  Grafische bedrijven


                  0,023




                  Metaalproducten- en machine-industrie*


                  0,013




                  Indien geen ontvettings- en/of beitsbaden worden geloosd


                  0,011




                  Bedrijfsonderdeel bestemd voor het uitwendig reinigen van schepen (na toepassing van een
      zuiveringstechniek zoals een olieafscheider, bezinkput en zandfiltratie)


                  0,0040




                  Elektrotechnische industrie*


                  0,0070




                  Indien geen ontvettings- en/of beitsbaden worden geloosd


                  0,0050




                  Pelsbereidingsbedrijven


                  0,017




                  Pluimveeslachterijen


                  0,075




                  Slagerijen





                  Winkel


                  0,023




                  Winkel met worstmakerij


                  0,034




                  Winkel met worstmakerij en slachterij


                  0,048




                  Slachthuizen*


                  0,087




                  Textielbedrijven


                  0,020




                  Vatenwasserijen*


                  0,36




                  Melkveehouderijen*





                  Lozing van voorspoelwater en spoelwater afkomstig van melkinstallaties


                  0,052




                  Indien voorspoelwater afkomstig van melkwinningsinstallaties niet wordt geloosd maar separaat wordt
      afgevoerd


                  0,0090




                  Visverwerkende bedrijven:





                  Rokerijen


                  0,029




                  Marineerbedrijven bij lozing van voorbaden


                  0,37




                  Overige en/of gecombineerde activiteiten


                  0,070




                  Viswinkels alsmede bedrijfsruimten ten behoeve van ambulante handel


                  0,037




                  Bij het ontbreken van een goed functionerende combinatie van slibvangput en vetafscheider wordt de
      coëfficiënt van 0,037 verhoogd naar 0,070





                  Vleeswarenbedrijven


                  0,016




                  Snackbedrijven


                  0,061




                  Wasserijen:





                  Natwasserijen


                  0,013




                  Wassalons*


                  0,015




                  Zuivelindustrie (jaarlijkse melkaanvoer meer dan 10 miljoen kg)


                  0,013




                  Ambachtelijke zuivelverwerking


                  0,016




                  IJsbereiding


                  0,015




                  Zwem- en badinrichtingen


                  0,0040




                  Onderdelen voor suppletie en filterspoeling, voor zover de hoeveelheid water voor suppletie en
      filterspoeling afzonderlijk wordt vastgesteld.


                  0,0012




                  Sauna's


                  0,011




                  Onderwijsinstellingen, kazernes, bejaardencentra, woonwagencentra, internaten, recreatiebedrijven,
      horecabedrijven etc.


                  0,023




                  Ziekenhuizen, verpleegtehuizen en psychiatrische inrichtingen


                  0,020




                  Vier- en vijfsterrenhotels volgens de Benelux-hotelclassificatie


                  0,017




                  Chocolade- en suikerwerkindustrie


                  0,040




                  Eierverwerkende industrie


                  0,075




                  De niet in deze tabel vermelde bedrijfsruimten of onderdelen van bedrijfsruimten


                  0,023








                  * Afvalwater afkomstig van de persoonlijke verzorging van werknemers werkzaam in van bedrijfsruimten of
      onderdelen van bedrijfsruimten die in deze tabel met een * zijn aangeduid


                  0,023
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel2
  - number: '3'
    text: |-
      Indien in het heffingsjaar voorafgaande aan de toepassing van [artikel 22 van de Wet][ref1] het zuurstofverbruik,
      voor de betrokken bedrijfsruimte of voor het betrokken onderdeel daarvan, is bepaald met behulp van door meting,
      bemonstering en analyse verkregen gegevens, wordt in afwijking van [artikel 2][ref2] de vervuilingswaarde
      per m3 ingenomen water bepaald aan de hand van de formule: C / D x 49,6 waarbij: C = het aantal kilogrammen
      zuurstofverbruik van de afgevoerde stoffen over de etmalen van het voorafgaande heffingsjaar waarover meting,
      bemonstering en analyse hebben plaatsgevonden; D = het aantal m3 ingenomen water over de etmalen van het
      voorafgaande heffingsjaar waarover meting, bemonstering en analyse hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011867#Artikel2
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0011867
        artikel: '2'
  - number: '4.1'
    text: |-
      De vervuilingswaarde per m3 ingenomen water kan door de heffingplichtige op zijn kosten op aanvraag, dan
      wel ambtshalve door de inspecteur op kosten van de betrokken kwaliteitsbeheerder, in afwijking van de
      [artikelen 2][ref1] en [3][ref2], worden bepaald aan de hand van monsterneming en analyse overeenkomstig het derde
      lid, onderscheidenlijk aan de hand van meting, bemonstering en analyse overeenkomstig het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011867#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011867#Artikel3
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011867
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011867
        artikel: '3'
  - number: '4.2'
    text: |-
      In dit artikel wordt onder geschatte vervuilingswaarde verstaan: de overeenkomstig [artikel 22 van de Wet][ref1]
      en [artikel 2][ref2] van dit besluit aan de hand van de geschatte hoeveelheid in te nemen water berekende
      vervuilingswaarde met betrekking tot het zuurstofverbruik van de over het heffingsjaar af te voeren stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011867#Artikel2
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0011867
        artikel: '2'
  - number: '4.3'
    text: 'Bij een geschatte vervuilingswaarde van minder dan 100 vervuilingseenheden:'
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.3.a
    text: |-
      wordt over een aantal voor het heffingsjaar representatieve etmalen afzonderlijk een etmaalverzamelmonster van het
      afgevoerde afvalwater samengesteld dat bestaat uit tenminste 8 deelmonsters die op verschillende voor het etmaal
      representatieve tijdstippen zijn genomen;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.3.b
    text: |-
      bedraagt het aantal van de onder a bedoelde etmalen: bij een geschatte vervuilingswaarde van: minder dan
      25 vervuilingseenheden: 4 25 tot 50 vervuilingseenheden: 6 50 tot 75 vervuilingseenheden: 8 75 tot 100
      vervuilingseenheden: 10;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.3.c
    text: |-
      vindt analyse van het onder a bedoelde etmaalverzamelmonster plaats en wordt het resultaat van die analyse
      uitgedrukt in grammen per m3;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.3.d
    text: |-
      wordt de som van de onder c bedoelde resultaten van de analyses over de onder a bedoelde etmalen gedeeld door het
      aantal van die etmalen;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.3.e
    text: |-
      wordt de uitkomst van de toepassing van het onder d bepaalde gecorrigeerd voor het deel van het ingenomen water dat
      niet wordt afgevoerd, indien de heffingplichtige aannemelijk maakt dat dat deel 25% of meer bedraagt;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.3.f
    text: |-
      bedraagt de vervuilingswaarde per m3 ingenomen water de overeenkomstig d en e gevonden waarde gedeeld door 49.600
      grammen.
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: '4.4'
    text: 'Bij een geschatte vervuilingswaarde van 100 vervuilingseenheden of meer:'
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.4.a
    text: |-
      vindt in een aantal voor het heffingsjaar representatieve weken meting, bemonstering en analyse over de daarin
      gelegen etmalen plaats;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.4.b
    text: |-
      bedraagt het aantal van de onder a bedoelde weken: bij een geschatte vervuilingswaarde van: 100 tot 250
      vervuilingseenheden: '1 250 tot 500 vervuilingseenheden: 2 500 tot 750 vervuilingseenheden: 3 750 tot 1000'
      vervuilingseenheden: '4 1000 en meer vervuilingseenheden: het door de inspecteur te bepalen aantal dat ten hoogste'
      12 kan bedragen;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.4.c
    text: |-
      wordt het zuurstofverbruik in de onder a bedoelde etmalen afgevoerde stoffen gedeeld door de hoeveelheid in die
      etmalen ingenomen water;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.4.d
    text: |-
      bedraagt de vervuilingswaarde per m3 ingenomen water de uitkomst van de toepassing van onderdeel c, gedeeld door
      49,6 kilogrammen.
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: '4.5'
    text: |-
      Meting, bemonstering en analyse, alsmede de behandeling van het in het derde lid, onder a, bedoelde verzamelmonster
      geschieden overeenkomstig de nadere regels, bedoeld in [artikel 20, derde lid][ref1], onderscheidenlijk in
      [artikel 23, veertiende lid, van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel23
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '23'
  - number: '4.6'
    text: |-
      De inspecteur beslist op een in het eerste lid bedoelde aanvraag bij voor bezwaar vatbare beschikking en geeft
      daarin in ieder geval voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.6.a
    text: |-
      de tijdstippen en de etmalen waarop monsterneming en analyse moeten plaatsvinden, onderscheidenlijk de meetweek dan
      wel meetweken gedurende welke meting, bemonstering en analyse moeten plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.6.b
    text: de bepaling van de hoeveelheid ingenomen water;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.6.c
    text: de correctie bedoeld in het derde lid, onder e;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: 4.6.d
    text: |-
      de melding van verandering of te verwachten veranderingen die van invloed kunnen zijn op de vervuilingswaarde per
      m3 ingenomen water van de betrokken bedrijfsruimte of het betrokken onderdeel van de bedrijfsruimte.
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: '4.7'
    text: |-
      Een op basis van dit artikel bepaalde vervuilingswaarde per m3 ingenomen water geldt voor de betrokken
      bedrijfsruimte of het betrokken onderdeel van de bedrijfsruimte tot het heffingsjaar waarin dit artikel hetzij door
      de heffingplichtige hetzij door de inspecteur opnieuw wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel4
  - number: '5'
    text: |-
      De veranderingen in de bedrijfsomstandigheden die aanleiding kunnen geven tot een wijziging van de
      vervuilingswaarde per m3 ingenomen water worden onverwijld aan de inspecteur gemeld.
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel5
  - number: '6'
    text: Dit besluit treedt in werking met ingang van 1 januari 2001.
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit vervuilingswaarde ingenomen water.'
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel7
