  - number: 1.a
    text: |-
      de Wet: de [Wet verontreiniging oppervlaktewateren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: 1.b
    text: |-
      het zuurstofverbruik: het zuurstofverbruik bepaald op basis van de som van het chemisch zuurstofverbruik en het
      zuurstofverbruik door omzetting van stikstofverbindingen, uitgedrukt in kilogrammen;
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel1
  - number: 1.c
    text: |-
      de vervuilingswaarde per m3 ingenomen water: de vervuilingswaarde als bedoeld in
      [artikel 22, tweede lid, van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel22
    url: https://wetten.overheid.nl/BWBR0011867/2001-01-01#Artikel1
    references:
      - id: ref1
