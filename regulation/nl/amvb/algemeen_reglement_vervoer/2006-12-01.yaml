  - number: '116'
    text: |-
      Het Algemeen Reglement Vervoer, vastgesteld bij Koninklijk besluit van 9 november 1928 (*Stb.* 415), wordt
      ingetrokken, behoudens de daarbij behorende Bijlage I, welke als Bijlage I bij het onderwerpelijke besluit wordt
      geacht te behoren.
    url: https://wetten.overheid.nl/BWBR0002548/2006-12-01#Artikel116
  - number: '118'
    text: Dit besluit kan worden aangehaald als "Algemeen Reglement Vervoer" of "ARV".
    url: https://wetten.overheid.nl/BWBR0002548/2006-12-01#Artikel118
  - number: '119'
    text: Dit besluit treedt in werking met ingang van 1 januari 1967.
    url: https://wetten.overheid.nl/BWBR0002548/2006-12-01#Artikel119
