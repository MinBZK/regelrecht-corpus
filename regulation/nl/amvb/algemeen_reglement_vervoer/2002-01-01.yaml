preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 15 september 1966, no. A-2/038143,
    Directoraat-Generaal van het Verkeer;

    Gelet op artikel 27 van de Spoorwegwet en op artikel 4 van de Locaalspoor- en Tramwegwet;

    De Raad van State gehoord (advies van 9 november 1966, nr. 36);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 19 december 1966, nr. A-2/039467,
    Directoraat-Generaal van het Verkeer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#ArtikelAanhef
articles:
  - number: 1.§ 1
    text: |-
      In dit reglement wordt onder spoorwegpersoneel mede begrepen het personeel, behorende tot buitenlandse spoorwegen,
      dat hier te lande dienst doet.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel1
  - number: 1.§ 2
    text: In dit reglement wordt onder station mede begrepen halte.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel1
  - number: 1.§ 3
    text: In dit reglement wordt onder spoorweg mede begrepen locaalspoorweg.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel1
  - number: 2.§ 1
    text: |-
      Voor de toepassing van dit reglement is de spoorweg aansprakelijk voor de bij hem in dienst zijnde personen en
      voor andere personen van wier diensten hij gebruik maakt bij de uitvoering van het vervoer, waarmede hij is belast,
      voorzover deze personen handelen binnen de kring van de hun opgedragen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel2
  - number: 2.§ 2
    text: |-
      Indien evenwel de personen, bedoeld in § 1 van dit artikel, op verzoek van de belanghebbende diensten bewijzen,
      waartoe de spoorweg niet is verplicht, worden zij geacht te handelen in opdracht van degene, aan wie zij deze
      diensten bewijzen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel2
  - number: 2.§ 3
    text: |-
      Voor de toepassing van dit reglement zijn de afzender, de aanvrager van een wagen, als bedoeld in artikel 55, §
      4, en de geadresseerde aansprakelijk voor de bij hen in dienst zijnde personen en voor andere personen van wier
      diensten zij gebruik maken, voor zover deze personen handelen binnen de kring van de hun opgedragen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Wordt een kind jonger dan twaalf jaar begeleid door een persoon van achttien jaar of ouder, dan is deze begeleider
      verplicht er voor zorg te dragen, dat dit kind niet in strijd met de bepalingen van dit reglement handelt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel3
  - number: '5.1'
    text: |-
      Het is een ieder, behoudens uit de aard van zijn betrekking, verboden zich in of op een station dan wel in een
      trein in een zodanige toestand te bevinden of zich zodanig te gedragen, dat orde, rust, veiligheid of een goede
      bedrijfsgang wordt of kan worden verstoord.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: '5.2'
    text: 'Als verstoring van orde, rust, veiligheid of een goede bedrijfsgang worden beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.a
    text: |-
      gedragingen waardoor de bediening en het gebruik van voorzieningen of van een trein dan wel de taakuitoefening van
      het personeel van de vervoerder worden verhinderd of belemmerd;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.b
    text: |-
      misbruik maken van voorzieningen dan wel gebruik maken van voorzieningen of van een trein op een tijdstip waarop
      deze niet voor gebruik beschikbaar zijn dan wel op een andere wijze dan waarvoor deze bestemd zijn;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.c
    text: uit een trein werpen van stoffen of van voorwerpen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.d
    text: zich in kennelijke staat van dronkenschap of onder kennelijke invloed van verdovende middelen bevinden;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.e
    text: |-
      afsteken van vuurwerk, rumoer maken dan wel op zodanige wijze geluid voortbrengen dat anderen daarvan hinder
      ondervinden;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.f
    text: uitoefenen van beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.g
    text: |-
      tentoonstellen van voorwerpen, maken van reclame of propaganda, verspreiden van drukwerk, bedelen of houden van
      inzamelingen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.h
    text: |-
      meenemen in een trein van dieren, stoffen of voorwerpen die hinder, gevaar, verontreiniging of beschadiging
      veroorzaken of kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.i
    text: |-
      roken in een trein of station, of gedeelten daarvan, ten aanzien waarvan de spoorweg heeft aangegeven dat roken
      niet is toegestaan;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.j
    text: |-
      zich bevinden op een station op een tijdstip dat dit kenbaar gesloten is of op een gedeelte van een station dat
      kenbaar daartoe niet toegankelijk is;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.k
    text: zich op een station begeven langs een andere dan de daarvoor bestemde weg;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: 5.2.l
    text: op een andere wijze hinder, gevaar, verontreiniging of beschadiging veroorzaken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      Het bepaalde in het eerste en tweede lid is niet van toepassing voor zover de spoorweg daarvoor, met inachtneming
      van de belangen van reizigers, toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: '7.1'
    text: |-
      Een ieder is verplicht de aanwijzingen betreffende de orde, rust, veiligheid of een goede bedrijfsgang op te
      volgen, die door of vanwege de spoorweg duidelijk kenbaar zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel7
  - number: '7.2'
    text: Een aanwijzing om zich te verwijderen, kan worden gegeven voor een bij de aanwijzing te bepalen tijdsduur.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel7
  - number: 16.§ 1
    text: |-
      Het is een ieder verboden zich zonder geldig plaatsbewijs in een trein te bevinden, behalve in het geval van
      het verlenen van hulp aan een reiziger bij het in- of uitstappen. Niet strafbaar is hij, die zich zonder geldig
      plaatsbewijs in een trein bevindt uit de aard van zijn betrekking of met toestemming van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel16
  - number: 16.§ 6
    text: |-
      Hij, die in strijd met het bepaalde in § 1 handelt en nalaat dit aan de conducteur zo tijdig mede te delen als
      in de §§ 7 tot en met 11 is bepaald, is niet strafbaar, indien hij op eerste vordering van het spoorwegpersoneel
      de vrachtprijs, bedoeld in de §§ 7 tot en met 11, en een verhoging, waarvan het bedrag in de tarieven wordt
      vastgesteld, betaalt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel16
  - number: 16.§ 7
    text: |-
      Hij, die op een station, waar geen plaatsbewijzen verkrijgbaar zijn, wenst in te stappen zonder te zijn voorzien
      van een geldig plaatsbewijs, is verplicht dit bij het instappen aan de conducteur mede te delen en op eerste
      vordering van het spoorwegpersoneel de verschuldigde vrachtprijs te betalen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel16
  - number: 16.§ 8
    text: |-
      Hij, die op een station, waar plaatsbewijzen verkrijgbaar zijn, wenst in te stappen zonder te zijn voorzien van
      een geldig plaatsbewijs, is verplicht dit vóór het instappen aan de conducteur mede te delen en op eerste vordering
      van het spoorwegpersoneel de verschuldigde vrachtprijs en een verhoging, waarvan het bedrag in de tarieven wordt
      vastgesteld, te betalen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel16
  - number: 16.§ 9
    text: |-
      Hij, die, voorzien van een plaatsbewijs tweede klasse, wenst plaats te nemen in de eerste klasse, is verplicht
      dit vóór het plaatsnemen in de eerste klasse aan de conducteur mede te delen en op eerste vordering van het
      spoorwegpersoneel de verschuldigde vrachtprijs en een verhoging, waarvan het bedrag in de tarieven wordt
      vastgesteld, te betalen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel16
  - number: 16.§ 10
    text: |-
      Hij, die verder zal reizen dan het station, tot waar zijn plaatsbewijs geldig is, is verplicht dit vóór of
      gedurende de reis, waarvoor dat plaatsbewijs geldt, aan de conducteur mede te delen en op eerste vordering van
      het spoorwegpersoneel de verschuldigde vrachtprijs en een verhoging, waarvan het bedrag in de tarieven wordt
      vastgesteld, te betalen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel16
  - number: 16.§ 11
    text: |-
      Hij, die zich zonder geldig plaatsbewijs in een trein bevindt, waarmede hij Nederland over de grens is
      binnengekomen, is verplicht dit zo spoedig mogelijk aan de conducteur mede te delen en op eerste vordering van
      het spoorwegpersoneel de verschuldigde vrachtprijs en een verhoging, waarvan het bedrag in de tarieven wordt
      vastgesteld, te betalen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel16
  - number: 47.§ 3
    text: |-
      Goederen, welke door hun afmetingen, gewicht of aard, in verband met de inrichtingen of het materieel van de
      spoorweg ongeschikt zijn om te worden vervoerd, zijn van het vervoer uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel47
  - number: 48.§ 3
    text: 'De hierna genoemde goederen worden onder de volgende voorwaarden ten vervoer aangenomen:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel48
  - number: 48.§ 3.a
    text: |-
      op eigen wielen rollend spoorwegmaterieel onder de voorwaarden dat naar het oordeel van de spoorweg dit materieel
      tot rijden in staat is en de veiligheid van het verkeer voldoende gewaarborgd is, alsmede dat locomotieven, tenders
      en motorvoertuigen worden begeleid door een door de afzender aangewezen deskundige, die gedurende de reis voor het
      smeren en het nazien van de werktuigelijke delen van het materieel zorgt;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel48
  - number: 48.§ 3.b
    text: ledige of beladen particuliere wagens onder de in Bijlage II genoemde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel48
  - number: 48.§ 3.c
    text: |-
      goederen, waarvan het laden of overladen, het lossen of het vervoer door hun afmetingen, gewicht of aard bijzondere
      moeilijkheden oplevert in verband met de inrichtingen of het materieel van de spoorweg, onder voor elk geval, na
      raadpleging van de afzender, door de spoorweg vast te stellen bijzondere voorwaarden, welke kunnen afwijken van de
      bepalingen van dit reglement.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel48
  - number: 48.§ 4.1
    text: 'De volgende zendingen worden niet als vrachtgoed ten vervoer aangenomen:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel48
  - number: 48.§ 4.1.a
    text: stukgoederen, behoudens in de tarieven te maken uitzonderingen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel48
  - number: 48.§ 4.1.b
    text: levende dieren, behoudens in de tarieven te maken uitzonderingen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel48
  - number: 48.§ 4.1.c
    text: lijken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel48
  - number: 48.§ 4.2
    text: |-
      Geld, geldswaarden en daarmede gelijk te stellen goederen, overeenkomstig de in de tarieven te geven omschrijving,
      worden niet als stukgoed ten vervoer aangenomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel48
  - number: 48.§ 5
    text: |-
      De spoorweg kan in het belang van de spoorweg verlangen of in het belang van de zending toestaan, dat de zending
      door of vanwege de afzender wordt begeleid.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel48
  - number: 49.§ 3
    text: |-
      De spoorweg is van zijn aansprakelijkheid ontheven, indien bij de aanneming ten vervoer der goederen voor hem
      niet kenbaar is, dat het van het vervoer uitgesloten goederen betreft dan wel dat de afzender niet aan de voor hem
      geldende voorwaarden heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel49
  - number: 49.§ 4
    text: |-
      De spoorweg is bevoegd het bedrag van de door hem geleden schade of een naar zijn oordeel voldoende waarborgsom
      ten laste van de zending te brengen. Zijn de vrachtbrief en de goederen aan de geadresseerde afgegeven, voordat
      de schadevergoeding is betaald, dan is de geadresseerde, indien het bedrag van de vordering tot schadevergoeding
      uit de vrachtbrief blijkt of de spoorweg hem vóór of bij de aflevering van het bestaan van een vordering in kennis
      heeft gesteld, hoofdelijk met de afzender voor de betaling daarvan aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel49
  - number: 50.§ 1
    text: |-
      Indien de spoorweg een zending ten vervoer aanneemt, welke duidelijke tekenen van beschadiging vertoont, kan
      hij verlangen, dat van de toestand van de tot die zending behorende goederen een bijzondere vermelding op de
      vrachtbrief wordt aangetekend.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 2
    text: |-
      Indien de aard van het goed een verpakking vereist, moet de afzender het goed op zodanige wijze verpakken, dat het
      gevrijwaard is voor geheel of gedeeltelijk verlies en voor beschadiging tijdens het vervoer en dat het geen schade
      aan personen of goederen kan veroorzaken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 3
    text: |-
      Indien de afzender de voorschriften van § 2 niet in acht heeft genomen, kan de spoorweg de zending weigeren of
      eisen, dat de afzender het ontbreken of de gebrekkige toestand van de verpakking door een nauwkeurige beschrijving
      op de vrachtbrief erkent.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 4.1
    text: |-
      De afzender is aansprakelijk voor alle gevolgen van het ontbreken van verpakking of de gebrekkige toestand van
      de verpakking. Hij is verplicht de schade te vergoeden, die de spoorweg uit dien hoofde mocht hebben geleden. Bij
      gebreke van een vermelding op de vrachtbrief, moet het ontbreken of de gebrekkige toestand van de verpakking door
      de spoorweg worden bewezen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 4.2
    text: Artikel 49, § 4, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 5
    text: |-
      Indien een afzender gelijksoortige goederen, die verpakking behoeven, van hetzelfde station pleegt te verzenden
      en deze onverpakt of met eenzelfde gebrekkige verpakking ten vervoer pleegt aan te bieden, kan hij van de naleving
      van het voorschrift van § 3 voor elke zending afzonderlijk worden vrijgesteld, door op dit station een algemene
      verklaring overeenkomstig het in de tarieven vast te stellen model te deponeren. In dit geval moet de afzender op
      de vrachtbrief naar de op het station van afzending afgegeven algemene verklaring verwijzen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 6.1
    text: |-
      De afzender moet, behoudens de in de tarieven te maken uitzonderingen, bij stukgoedzendingen op elk collo in
      duidelijk en onuitwisbaar schrift het adres van de geadresseerde, het station van afzending en het station van
      bestemming vermelden in overeenstemming met de gegevens op de vrachtbrief.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 6.2
    text: |-
      De afzender moet, indien de spoorweg zulks bepaalt, bij wagenladingen op elke wagen, op de voor plakbriefjes
      bestemde plaatsen, in duidelijk en onuitwisbaar schrift het (al dan niet in een enveloppe gesloten) adres van de
      geadresseerde vermelden in overeenstemming met de gegevens op de vrachtbrief.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 6.3
    text: |-
      Andere aanduidingen dan die, welke ingevolge het hiervoren bepaalde zijn voorgeschreven, behoeft de spoorweg
      niet toe te laten. Worden deze echter toegelaten, dan vloeit daaruit voor de spoorweg geen verplichting of
      aansprakelijkheid voort.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 6.4
    text: De afzender moet oude opschriften of plakbriefjes doorhalen of verwijderen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 7
    text: 'De spoorweg kan verlangen, dat:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 7.a
    text: |-
      stukgoederen in zodanige staat ten vervoer worden aangeboden, dat zij zich lenen tot verwerking met daartoe bij de
      spoorweg gebruikelijke hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 7.b
    text: |-
      kleine colli stukgoederen van dezelfde soort (klein ijzerwerk enz.) waarvan de aanneming ten vervoer en de
      behandeling niet zonder aanzienlijk tijdverlies kunnen geschieden, tot grotere eenheden worden samengebundeld of
      verpakt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 8
    text: |-
      Omtrent de verpakking en verlading van goederen, welke wegens hun eigenschappen bijzondere zorg vereisen of bij het
      vervoer hinder of gevaar kunnen opleveren, kunnen in de tarieven voorschriften worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 50.§ 9
    text: |-
      Behoudens in de tarieven te maken uitzonderingen mogen licht breekbare voorwerpen, zoals aardewerk, glaswerk,
      porselein, voorwerpen, welke gemakkelijk in de wagen verstrooid zouden kunnen geraken (zoals fruit, noten, stenen,
      voederartikelen) en goederen, welke andere zendingen zouden kunnen verontreinigen of beschadigen (zoals as, gewone
      aarde, kalk, kolen, verfaarde) slechts als stukgoed worden verzonden, indien deze goederen zo zijn verpakt of
      samengebonden, dat zij niet kunnen breken, verloren gaan of andere zendingen verontreinigen of beschadigen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: 51.§ 1
    text: |-
      Het aanbrengen van goederen en het laden van wagens door de afzender moet geschieden gedurende de door de spoorweg
      vastgestelde uren, welke op aanvraag worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 2
    text: |-
      In de tarieven wordt bepaald, of de goederen door de spoorweg of door de afzender geladen moeten worden, tenzij
      dit reglement hieromtrent voorschriften bevat of tussen de afzender en de spoorweg een bijzondere overeenkomst
      is gesloten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 3
    text: |-
      Indien buiten schuld van de spoorweg een stukgoedzending niet binnen een in de tarieven te bepalen termijn, te
      rekenen van het ogenblik af, waarop de afzender met het aanbrengen der goederen begonnen is, gereed is om ten
      vervoer te worden aangenomen, kan de spoorweg voor de tijd, waarmee die termijn wordt overschreden, het in de
      tarieven te bepalen lig- of magazijngeld heffen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 4.1
    text: |-
      De afzender is verplicht de wagens, nodig voor het vervoer van goederen, welke door hem worden geladen, bij de
      spoorweg aan te vragen. De spoorweg kan verlangen, dat dit schriftelijk geschiedt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 4.2
    text: In de tarieven wordt bepaald, hetgeen in de aanvraag moet worden vermeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 4.3
    text: De spoorweg geeft de afzender op diens verzoek kennis van het tijdstip, waarop hij over de wagens kan beschikken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 5.1
    text: |-
      Indien de aanvrager wagens afbestelt, vóórdat zij ter beschikking zijn gesteld, kan de spoorweg een in de tarieven
      te bepalen bedrag in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 5.2
    text: |-
      De spoorweg kan ter beschikking gestelde wagens terugnemen, indien de aanvrager na afloop van de in dit artikel
      bedoelde laadtermijn nog niet met laden is begonnen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 5.3
    text: |-
      Indien de aanvrager aan hem verstrekte wagens onbeladen aan de spoorweg teruggeeft of deze hem op grond van het
      vorige lid ontnomen worden, is hij het in de tarieven te bepalen staangeld verschuldigd. Het staangeld wordt
      berekend van het ogenblik af, waarop de wagens ter beschikking van de aanvrager zijn gesteld, tot dat, waarop hij
      niet meer de beschikking over de wagens heeft, met dien verstande, dat tenminste een bedrag in rekening kan worden
      gebracht gelijk aan het in lid 1 bedoelde bedrag.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 5.4
    text: |-
      De spoorweg kan bij het aanvragen van wagens een waarborgsom vragen gelijk aan het bedrag van het staangeld voor
      één dag.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 6.1
    text: |-
      De termijnen, binnen welke het laden door de afzender moet zijn afgelopen, worden in de tarieven bepaald. Als
      het tijdstip waarop het laden is afgelopen wordt aangemerkt het ogenblik waarop de zending geheel geladen is,
      met inbegrip van eventuele bedekking van de wagen en van de bevestiging van de lading, en de vrachtbrief aan het
      station van afzending aangeboden is.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 6.2
    text: |-
      Indien buiten schuld van de spoorweg de zending niet binnen de in het vorige lid bedoelde termijn ten vervoer kan
      worden aangenomen, kan de spoorweg voor de tijd, waarmede die termijn wordt overschreden, het in de tarieven te
      bepalen staangeld heffen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 6.3
    text: |-
      Indien de laadtermijn met meer dan vierentwintig uur is overschreden, is de spoorweg bevoegd de wagens op kosten
      van de aanvrager te lossen en de wagens terug te nemen. Verder is de spoorweg bevoegd met de goederen te handelen
      als in artikel 73, § 2, is bepaald en voor de tijd, gedurende welke de goederen bij de spoorweg verblijven, het in
      de tarieven te bepalen lig-, magazijn- of staangeld te berekenen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 7.1
    text: |-
      Indien gevaar bestaat, dat de regelmatige afwikkeling van het verkeer door ophoping van goederen, hetzij op het
      gehele net, hetzij op een gedeelte daarvan dan wel op bepaalde stations wordt verstoord, is de spoorweg bevoegd de
      tijd, welke van het berekenen van lig- of magazijngeld is vrijgesteld, en de laadtermijn te verkorten, alsmede het
      lig-, magazijn- of staangeld en het in § 5, lid 1, bedoelde bedrag te verhogen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 7.2
    text: |-
      De verkorting van de tijd, welke van het berekenen van lig- en magazijngeld is vrijgesteld, en van de laadtermijn,
      alsmede de verhoging van het lig-, magazijn- of staangeld en van het in § 5, lid 1, bedoelde bedrag geschiedt met
      inachtneming van het in artikel 115 bepaalde.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 51.§ 7.3
    text: |-
      De spoorweg brengt deze maatregelen onverwijld ter kennis van het publiek. Zij treden niet in werking voordat ze
      ter kennis van het publiek zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: 53.§ 1.1
    text: |-
      Op verzoek van de afzender worden stukgoederen in de plaatsen, vermeld in de tarieven, door of namens de spoorweg
      afgehaald binnen de door de spoorweg daarvoor vastgestelde kring.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel53
  - number: 53.§ 1.2
    text: In de tarieven wordt bepaald, welke goederen van afhaling zijn uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel53
  - number: 53.§ 1.3
    text: |-
      Het adres, waar de goederen afgehaald moeten worden, moet langs harde rijwegen met de vervoermiddelen van de
      afhaaldienst bereikbaar zijn. De goederen dienen gelijkvloers met en in de onmiddellijke nabijheid van de harde weg
      gereed te liggen. De afzender moet desverlangd bij het laden hulp verlenen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel53
  - number: 53.§ 1.4
    text: De spoorweg brengt voor het afhalen een in de tarieven te bepalen bedrag in rekening.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel53
  - number: 53.§ 1.5
    text: |-
      Indien bij aankomst van het voor het afhalen gebezigde vervoermiddel de goederen niet gereed liggen, kan dit
      vervoermiddel zijn rit vervolgen en is de afzender een in de tarieven te bepalen bedrag verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel53
  - number: 53.§ 2
    text: |-
      De spoorweg beoordeelt eerst nadat de gehele zending met de vrachtbrief op het station van afzending aanwezig is,
      of de zending ten vervoer kan worden aangenomen. Is dit laatste niet het geval, dan wordt hiervan onverwijld kennis
      gegeven aan de afzender.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel53
  - number: 53.§ 3
    text: |-
      In buitengewone omstandigheden, zoals bemoeilijking van de afhaaldienst door sneeuw of ijzel, is de spoorweg
      bevoegd:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel53
  - number: 53.§ 3.a
    text: |-
      de in § 1, leden 4 en 5, bedoelde bedragen te verhogen tot in de tarieven te bepalen bedragen van ten hoogste het
      dubbele;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel53
  - number: 53.§ 3.b
    text: de afhaaldienst geheel of gedeeltelijk te staken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel53
  - number: 54.§ 1
    text: |-
      In de tarieven wordt bepaald, welke goederen in gesloten wagens en welke goederen op open wagens worden vervoerd en
      op welke wijze wordt gehandeld, indien de afzender het gebruik van een ander soort wagen voorschrijft dan volgens
      de tariefbepalingen in aanmerking komt, een en ander voor zover niet in dit reglement of in douane- of andere
      wettelijke dan wel ambtelijke voorschriften te dien aanzien bepaalde eisen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel54
  - number: 54.§ 2
    text: |-
      In de tarieven wordt bepaald onder welke voorwaarden de spoorweg speciale wagens en dekkleden voor het vervoer op
      open wagens ter beschikking stelt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel54
  - number: 55.§ 1.1
    text: De afzender moet zó laden, dat geen gevaar kan ontstaan voor personen of goederen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel55
  - number: 55.§ 1.2
    text: |-
      De afzender moet met name bij de belading van de wagens de toelaatbare belading en het laadprofiel geldende voor
      de lijnen, waarover het vervoer plaats zal hebben, in acht nemen. De voor het vervoer over de in Nederland gelegen
      lijnen in acht te nemen toelaatbare belading en het geldende laadprofiel worden in de tarieven vermeld. De spoorweg
      geeft de afzender op diens verzoek de toelaatbare belading op.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel55
  - number: 55.§ 2.1
    text: |-
      Indien het laden door de afzender geschiedt, is deze aansprakelijk voor alle gevolgen van een gebrekkige belading.
      Hij is verplicht de schade te vergoeden, die de spoorweg uit dien hoofde mocht hebben geleden. Het bewijs van de
      gebrekkige belading moet door de spoorweg worden geleverd.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel55
  - number: 55.§ 2.2
    text: Artikel 49, § 4, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel55
  - number: 55.§ 3
    text: |-
      In de tarieven wordt bepaald, hoe gehandeld wordt, indien wordt vastgesteld, dat het in § 1 bepaalde niet in acht
      is genomen, alsmede welke bedragen in dat geval verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel55
  - number: 55.§ 4
    text: |-
      De bepalingen van dit artikel zijn op overeenkomstige wijze van toepassing op het laden en lossen door de aanvrager
      van een wagen indien geen vervoerovereenkomst tot stand komt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel55
  - number: 56.§ 1.1
    text: |-
      Behoudens het bepaalde in de §§ 11 en 12 moet de afzender elke zending aanbieden met een vrachtbrief overeenkomstig
      een in of krachtens de tarieven vast te stellen model. De vrachtbrief dient tenminste een voor de afzender en een
      voor de geadresseerde bestemd deel te bevatten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 1.2
    text: |-
      Het is slechts toegestaan vrachtbrieven te gebruiken, die van de spoorweg zijn betrokken. Deze formulieren zijn
      verkrijgbaar tegen de in de tarieven vast te stellen prijs.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 2
    text: |-
      In de tarieven wordt bepaald, welke rubrieken van de vrachtbrief door de afzender en welke door de spoorweg worden
      ingevuld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 3.1
    text: |-
      De op het eerste blad van de vrachtbrief aangebrachte aanduidingen moeten in onuitwisbare letters in het Nederlands
      geschreven of gedrukt zijn; op alle delen moeten zij goed leesbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 3.2
    text: |-
      Het gebruik van vrachtbrieven, waarin geradeerd is of waarin over de oorspronkelijke woorden geschreven is of
      waarop stukken papier zijn geplakt, is niet geoorloofd. Doorhalingen en veranderingen worden slechts toegelaten,
      indien de afzender deze met zijn handtekening bekrachtigt en, voor wat betreft het aantal of het gewicht, de
      verbeterde hoeveelheden voluit in letters vermeldt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 4
    text: 'De vrachtbrief moet de volgende gegevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 4.a
    text: de naam van het station van bestemming, zoals in de tarieven vermeld;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 4.b
    text: |-
      de naam en het adres van de geadresseerde. Als geadresseerde mag niet meer dan één natuurlijke persoon, firma of
      rechtspersoon worden aangegeven. Het is niet geoorloofd het station van bestemming of personeel van dat station als
      geadresseerde aan te duiden. Aanduidingen, waarin de naam van de geadresseerde niet voorkomt, zijn niet toegelaten;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 4.c
    text: |-
      de omschrijving van het goed, de aanduiding van het gewicht van de zending of in de plaats daarvan, voorzover de
      tarieven zulks voorschrijven, het aantal stuks. Die goederen, welke voorkomen in het VSG, moeten worden aangeduid
      met de naam waaronder zij in het VSG voorkomen; die, welke niet in het VSG voorkomen, doch wel zijn genoemd in
      de tarieven, met de naam waaronder zij in deze tarieven voorkomen; in alle overige gevallen met de benaming die
      beantwoordt aan hun aard;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 4.d
    text: |-
      bij stukgoedzendingen: het aantal colli, de beschrijving van de verpakking, de vermelding dat de colli van een
      adres zijn voorzien, alsmede de afmetingen van ieder collo, uitgedrukt in centimeters en gemeten volgens de
      grootste hoogte, lengte en breedte;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 4.e
    text: |-
      bij goederen welke door de afzender worden geladen: het nummer van de gebezigde wagen en bij particuliere wagens
      bovendien het eigen gewicht van de wagen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 4.f
    text: |-
      de nauwkeurige opsomming van de krachtens douane- of andere wettelijke dan wel ambtelijke voorschriften vereiste
      bescheiden, die bij de vrachtbrief zijn gevoegd of waarvan op de vrachtbrief is vermeld, dat zij ter beschikking
      zijn van de spoorweg op een bepaald station of op een kantoor van de douane of van andere overheidsinstanties;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 4.g
    text: |-
      de handtekening van de afzender, alsmede de aanduiding van zijn naam en zijn volledig adres, desgewenst aangevuld
      met zijn telegramadres, telefoon- of telexnummer. De handtekening mag gedrukt of gestempeld zijn. Als afzender mag
      op de vrachtbrief niet meer dan één natuurlijke persoon, firma of rechtspersoon voorkomen. Indien de afzender in
      Nederland geen vaste woonplaats heeft, moet hij op verlangen van de spoorweg in Nederland woonplaats kiezen en deze
      op de vrachtbrief vermelden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 5
    text: Bovendien moet de vrachtbrief zo nodig alle overige in dit reglement vermelde aanduidingen bevatten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 6
    text: |-
      Indien de op de vrachtbrief voor de aanduidingen van de afzender bestemde ruimte onvoldoende is, kan gebruik
      gemaakt worden van aanvullingsbladen van dezelfde afmetingen als de vrachtbrief; zij moeten in evenveel exemplaren
      worden vervaardigd als de vrachtbrief delen telt en door de afzender van zijn handtekening worden voorzien. Op de
      vrachtbrief moet naar deze bladen worden verwezen. Indien het totale gewicht van de zending wordt aangegeven, moet
      dit op de vrachtbrief zelf worden vermeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 7.1
    text: |-
      Het is niet geoorloofd op de vrachtbrief andere aanduidingen te vermelden dan die, welke door dit reglement, door
      de tarieven of andere wettelijke voorschriften worden vereist of toegelaten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 7.2
    text: |-
      Het is verboden de vrachtbrief te vervangen door andere stukken of daaraan andere bescheiden toe te voegen dan die,
      welke door dit reglement of door de tarieven zijn voorgeschreven of toegelaten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 8
    text: |-
      Bij vervoer van wagenladingen kan de afzender verplicht worden voor iedere wagen een afzonderlijke vrachtbrief bij
      te voegen. Indien het krachtens de tarieven is toegestaan voor een uit meer wagens bestaande zending gebruik te
      maken van één vrachtbrief, moet de afzender het geladen gewicht per wagen vermelden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 9
    text: 'Met eenzelfde vrachtbrief mogen niet ten vervoer worden aangeboden:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 9.a
    text: goederen, die in verband met hun aard bezwaarlijk kunnen worden samengeladen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 9.b
    text: goederen, die gedeeltelijk door de spoorweg en gedeeltelijk door de afzender moeten worden geladen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 9.c
    text: |-
      goederen, waarvan de samenlading inbreuk zou maken op douane- of andere wettelijke dan wel ambtelijke
      voorschriften;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 9.d
    text: |-
      voorwaardelijk ten vervoer toegelaten goederen, wanneer het stoffen en voorwerpen betreft, die
      krachtens het VSG niet met elkaar of met andere goederen mogen worden samengeladen, tenzij ingevolge
      [artikel 9 van de Wet vervoer gevaarlijke stoffen][ref1] deze samenlading is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel9
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '9'
  - number: 56.§ 10
    text: |-
      De afzender mag op de vrachtbrief mededelingen betreffende de zending vermelden, echter slechts bij wijze van
      inlichting voor de geadresseerde en zonder dat hieruit voor de spoorweg enige verplichting of aansprakelijkheid
      voortvloeit.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 11.1
    text: |-
      In de tarieven kan worden bepaald, dat bepaalde in de tarieven te omschrijven zendingen door de afzender moeten
      worden aangeboden met een adreskaart overeenkomstig een in de tarieven vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 11.2
    text: |-
      In de artikelen 49, 50, 56 - met uitzondering van § 3, lid 1, en § 6 -, 57, 58, 59 - met uitzondering van § 4, lid
      3, -, 62, 64, § 1, lid 1, § 2 en § 3, 65, 66, 68, 73, 76, 77, 86, 87 en 89 wordt onder vrachtbrief mede begrepen de
      in lid 1 bedoelde adreskaart.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 12.1
    text: |-
      In de tarieven kan worden bepaald in welke gevallen en onder welke voorwaarden zendingen zonder een vrachtbrief ten
      vervoer kunnen worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 12.2
    text: |-
      In die gevallen maakt de spoorweg op basis van de door de afzender verstrekte gegevens, die schriftelijk dan wel
      electronisch kunnen worden aangeleverd, een vrachtbrief op overeenkomstig een in de tarieven vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 12.3
    text: |-
      Met uitzondering van het vervoer van stoffen en voorwerpen, waarop het VSG van toepassing is, kunnen in afwijking
      van het tweede lid bij binnenlands vervoer en bij internationaal vervoer, voor zover er sprake is van het
      electronisch aanleveren van de gegevens voor dit vervoer, de afzender en de spoorweg tezamen bepalen dat geen
      vrachtbrief wordt opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 56.§ 12.4
    text: |-
      Indien door de spoorweg geen vrachtbrief wordt opgemaakt, als bedoeld in het derde lid, worden de gegevens van
      de in de artikelen 50, § 1, § 3, en § 5, 57, § 2, derde lid, en § 3, 59, § 4, eerste lid, en § 5, 60, § 3 en § 8,
      62, § 3, 74, § 3 onder *a*, 79, § 3, 83, § 1, en 86, § 3, bedoelde vermelding of aanduiding van de afzender of de
      spoorweg op de vrachtbrief op een andere wijze aan de wederpartij medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel56
  - number: 57.§ 1.1
    text: |-
      De afzender is aansprakelijk voor de juistheid van de aanduidingen en verklaringen, die zijnerzijds op de
      vrachtbrief zijn vermeld. Hij draagt alle gevolgen, die voortvloeien uit het feit, dat deze aanduidingen of
      verklaringen onjuist, onnauwkeurig of onvolledig zijn, dan wel op een andere dan de daarvoor bestaande plaats zijn
      vermeld. Indien deze plaats te klein is, moet de afzender aldaar verwijzen naar de plaats, waar de vermelding wordt
      voortgezet.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57
  - number: 57.§ 1.2
    text: |-
      De afzender is eveneens, overeenkomstig lid 1, aansprakelijk voor de juistheid van de aanduidingen en verklaringen,
      welke op zijn verzoek door het personeel van de spoorweg zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57
  - number: 57.§ 2.1
    text: |-
      De spoorweg heeft steeds het recht te onderzoeken of de zending overeenstemt met de vermeldingen op de vrachtbrief
      en of de veiligheidsmaatregelen, voorgeschreven in het VSG of die krachtens artikel 56, paragraaf 9, onderdeel *d*,
      zijn toegestaan .
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57
  - number: 57.§ 2.2
    text: |-
      Indien een zending op inhoud wordt onderzocht, moet de afzender of de geadresseerde worden uitgenodigd daarbij
      aanwezig te zijn, naar gelang het onderzoek plaats heeft op het station van afzending of op het station van
      bestemming. Indien de rechthebbende niet verschijnt of indien het onderzoek onderweg plaats heeft, moet het
      onderzoek worden verricht in tegenwoordigheid van twee niet tot het spoorwegpersoneel behorende getuigen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57
  - number: 57.§ 2.3
    text: |-
      Het resultaat van het onderzoek naar de juistheid van de vermeldingen op de vrachtbrief moet worden vermeld op
      alle delen van de vrachtbrief, die bij de spoorweg aanwezig zijn. Indien de zending niet overeenstemt met de
      vermeldingen op de vrachtbrief, komen de door het onderzoek veroorzaakte kosten ten laste van de zending, tenzij
      zij ter plaatse zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57
  - number: 57.§ 3
    text: |-
      In de tarieven wordt bepaald of en onder welke voorwaarden de spoorweg verplicht is op verzoek van de afzender het
      gewicht van de zending, het aantal colli of stuks van een zending, de afmetingen van elk collo of het eigengewicht
      van de wagens vast te stellen. De spoorweg is verplicht op de vrachtbrief het door hem vastgestelde gewicht, het
      aantal colli of stuks van een zending, de afmetingen van elk collo en het eigengewicht van de wagens te vermelden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57
  - number: 57.§ 4
    text: |-
      Bij weging op een weegbrug wordt het gewicht van het goed bepaald door van het totale gewicht van de beladen wagen
      het op de wagen vermelde eigengewicht af te trekken, tenzij door de afzonderlijke weging van de ledige wagen een
      ander eigengewicht is komen vast te staan; in dit geval wordt dit van het totale gewicht afgetrokken. Wegingen,
      uitgevoerd op weegbruggen van particulieren, worden gelijkgesteld met die op weegbruggen van de spoorweg, voorzover
      aan de voorwaarden, die terzake door de spoorweg zijn vastgesteld, is voldaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57
  - number: 57.§ 5
    text: |-
      De vaststelling van het gewicht, van het aantal colli of stuks van een zending of van de afmetingen van elk collo
      door de spoorweg geschiedt uitsluitend voor de berekening van de vracht, bijkomende kosten en boeten, alsmede
      voor de vaststelling van een te gering gewicht of aantal colli of stuks. Aan een onjuiste vaststelling of een
      onjuiste vermelding op de vrachtbrief kunnen slechts aanspraken tegenover de spoorweg worden ontleend, voorzover
      dientengevolge te hoge vracht en andere kosten in rekening zijn gebracht of een te gering gewicht of aantal colli
      of stuks is afgeleverd.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57
  - number: 57.§ 6
    text: |-
      Indien een door de spoorweg na sluiting van de vervoerovereenkomst verrichte weging een gewichtsverschil te zien
      geeft, blijft het door het station van afzending vastgestelde gewicht of, bij gebreke daarvan, het door de afzender
      aangegeven gewicht in de volgende gevallen beslissend voor de vrachtberekening:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57
  - number: 57.§ 6.a
    text: indien het verschil kennelijk is te wijten aan de aard van het goed of aan atmosferische invloeden;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57
  - number: 57.§ 6.b
    text: |-
      indien het gewichtsverschil niet meer dan 2% bedraagt van het door het station van afzending vastgestelde gewicht,
      of, bij gebreke daarvan, van het door de afzender aangegeven gewicht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57
  - number: 57a.§ 1.1
    text: |-
      Indien de zending zonder vrachtbrief ten vervoer wordt aangeboden, als bedoeld in artikel 56, § 12, is de afzender
      aansprakelijk voor de juistheid van de door hem aan de spoorweg verstrekte gegevens betreffende de zending. Indien
      door de spoorweg een vrachtbrief wordt opgemaakt, staat de spoorweg tevens in voor de juiste vermelding van deze
      gegevens op de vrachtbrief.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57a
  - number: 57a.§ 1.2
    text: |-
      De afzender en de spoorweg dragen ieder de gevolgen die voortvloeien uit het niet nakomen van de op hen rustende
      verplichting op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57a
  - number: 58.§ 1
    text: |-
      De vervoerovereenkomst is gesloten, zodra de spoorweg de zending met de vrachtbrief ten vervoer heeft aangenomen.
      De aanneming wordt vastgesteld door het afdrukken op de vrachtbrief van een stempel van het station van afzending,
      die de datum van aanneming aangeeft.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel58
  - number: 58.§ 2
    text: |-
      de afstempeling van de vrachtbrief en, eventueel, van elk aanvullingsblad, geschiedt onmiddellijk nadat al de op de
      vrachtbrief vermelde goederen aan het station bezorgd zijn of, indien zij door de afzender worden geladen, geladen
      zijn en, behoudens het in artikel 60, § 6, eerst lid, bepaalde, de kosten die de afzender voor zijn rekening neemt,
      zijn betaald.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel58
  - number: 58.§ 3
    text: |-
      Na de afstempeling dient het voor de geadresseerde bestemde deel van de vrachtbrief als bewijs van de
      vervoeroverkomst.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel58
  - number: 58.§ 4
    text: |-
      De aanduidingen op de vrachtbrief betreffende de afmetingen, het gewicht of, indien de zending door de afzender
      wordt geladen, het aantal stuks kunnen niet als bewijs tegen de spoorweg dienen, tenzij de spoorweg de afmetingen,
      het gewicht of het aantal stuks heeft gecontroleerd en dit op de vrachtbrief heeft aangetekend.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel58
  - number: 58.§ 5
    text: |-
      De spoorweg is verplicht de ontvangst van de zending en de datum van aanneming ten vervoer door het afdrukken
      van de datumstempel op alle delen van de vrachtbrief te bevestigen. Het voor de afzender bestemde deel van de
      vrachtbrief wordt hem teruggegeven. Dit deel heeft niet de waarde van het voor de geadresseerde bestemde deel van
      de vrachtbrief.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel58
  - number: 58a.§ 1
    text: |-
      Indien de zending zonder vrachtbrief ten vervoer wordt aangeboden, als bedoeld in artikel 56, § 12, is de
      vervoerovereenkomst gesloten, zodra de spoorweg de zending ten vervoer heeft aangenomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel58a
  - number: 58a.§ 2.1
    text: |-
      De spoorweg is verplicht de ontvangst van de zending en de datum van aanneming ten vervoer zowel aan de afzender
      als aan de geadresseerde te bevestigen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel58a
  - number: 58a.§ 2.2
    text: |-
      De bevestiging van de ontvangst en de datum van aanneming ten vervoer geschiedt, hetzij door een vermelding op de
      vrachtbrief in het geval dat de spoorweg een vrachtbrief heeft opgemaakt, hetzij op een andere wijze.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel58a
  - number: 58a.§ 3
    text: |-
      De afzender en de spoorweg treffen een regeling met betrekking tot de bewijskracht van de gegevens die zij
      onderling uitwisselen en de op basis daarvan op te maken documenten. De regeling kan ook betrekking hebben op alle
      door de desbetreffende afzender aan te bieden en door de spoorweg te vervoeren zendingen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel58a
  - number: 58a.§ 4
    text: |-
      Bij gebreke van een regeling, als bedoeld in § 3, kunnen de gegevens van de afzender betreffende de afmetingen, het
      gewicht of, indien de zending door de afzender wordt geladen, het aantal stuks niet als bewijs tegen de spoorweg
      dienen, tenzij de spoorweg de afmetingen, het gewicht of het aantal stuks heeft gecontroleerd en daarvan mededeling
      aan de afzender heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel58a
  - number: 59.§ 1
    text: Er zijn tarieven voor het vervoer van stukgoederen en van wagenladingen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel59
  - number: 59.§ 2
    text: |-
      Deze tarieven bevatten de algemene voorwaarden van de spoorweg, alsmede alle voor de berekening van de vracht en
      bijkomende kosten noodzakelijke gegevens.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel59
  - number: 59.§ 3
    text: |-
      De vracht en bijkomende kosten worden, onverminderd het bepaalde in [artikel 31 van de Spoorwegwet][ref1], berekend
      overeenkomstig de op het tijdstip van de sluiting der vervoerovereenkomst voor het vervoer geldende tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel31
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '31'
  - number: 59.§ 4.1
    text: |-
      De spoorweg moet de volgens de tarieven verschuldigde vracht en bijkomende kosten, alsmede krachtens dit reglement
      verschuldigde boeten en de aanleiding tot de boeteheffing op de vrachtbrief vermelden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel59
  - number: 59.§ 4.2
    text: |-
      De vermelding van de vracht en bijkomende kosten behoeft niet te geschieden, indien dienaangaande overeenstemming
      is bereikt tussen de spoorweg en degene, die de verschuldigde vracht en bijkomende kosten voor zijn rekening neemt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel59
  - number: 59.§ 4.3
    text: |-
      In afwijking van lid 1 kunnen de vracht en de in de tarieven te vermelden bijkomende kosten voor wagenladingen met
      binnenlandse vrachtbrief op een periodieke afrekeningsstaat worden vermeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel59
  - number: 59.§ 5
    text: |-
      De spoorweg mag behalve de krachtens dit reglement of de tarieven verschuldigde vracht, bijkomende kosten en boeten
      slechts de door hem gedane uitgaven en de door hem gemaakte kosten in rekening brengen. Deze uitgaven en kosten
      moeten behoorlijk worden vastgesteld en afzonderlijk worden vermeld op de vrachtbrief; bewijsstukken moeten worden
      bijgevoegd. Wanneer de betaling van deze uitgaven ten laste van de afzender komt, worden de bewijsstukken niet
      tegelijk met de vrachtbrief aan de geadresseerde, doch aan de afzender ter hand gesteld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel59
  - number: 59.§ 6
    text: |-
      De tarieven bepalen op welke stations goederen ten vervoer worden aangenomen en op welke stations goederen worden
      afgeleverd.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel59
  - number: 60.§ 1
    text: |-
      De kosten (vracht, bijkomende kosten, douanerechten en voorts de kosten, die ontstaan vanaf de aanneming ten
      vervoer tot aan de aflevering alsmede de kosten van een eventueel verder middel van vervoer) worden overeenkomstig
      de navolgende bepalingen door de afzender of door de geadresseerde betaald.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel60
  - number: 60.§ 2
    text: |-
      In de tarieven kan worden bepaald, dat de kosten voor zendingen aangeboden met een adreskaart steeds ten laste van
      de afzender komen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel60
  - number: 60.§ 3
    text: |-
      De afzender moet, met inachtneming van het daaromtrent in de tarieven bepaalde, in de desbetreffende rubriek van de
      vrachtbrief vermelden, welke kosten hij voor zijn rekening neemt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel60
  - number: 60.§ 4
    text: |-
      Kosten, die de afzender niet voor zijn rekening heeft genomen, worden geacht ten laste van de geadresseerde te zijn
      gebracht. De kosten komen echter steeds ten laste van de afzender, indien de geadresseerde de vrachtbrief niet in
      ontvangst heeft genomen noch zijn rechten overeenkomstig artikel 68, § 2, heeft doen gelden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel60
  - number: 60.§ 5
    text: |-
      Bijkomende kosten, zoals staangeld, magazijngeld en weegloon, waarvan de heffing het gevolg is van een aan de
      geadresseerde toe te schrijven feit of van een door hem gedaan verzoek, moeten steeds door hem worden betaald.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel60
  - number: 60.§ 6.1
    text: |-
      Voor wagenladingen met binnenlandse vrachtbrief geschiedt de betaling van de kosten, met uitsluiting van de in
      de tarieven te vermelden kosten, op grond van een door de spoorweg periodiek op te maken afrekeningsstaat, die de
      kosten per wagenlading vermeldt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel60
  - number: 60.§ 6.2
    text: |-
      De spoorweg kan van hem, die de kosten verschuldigd is, bij wijze van waarborgsom tegen ontvangstbewijs de storting
      vorderen van een bedrag, dat de kosten bij benadering dekt. Zodra het juiste bedrag van de verschuldigde kosten
      bekend is, vindt de eindafrekening plaats.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel60
  - number: 60.§ 7.1
    text: |-
      De spoorweg kan bij andere dan in § 6, lid 1, bedoelde zendingen van de afzender de vooruitbetaling van de kosten
      eisen, wanneer het goederen betreft, die naar zijn oordeel aan spoedig bederf onderhevig zijn of die op grond van
      hun geringe waarde of hun aard hem geen voldoende waarborg voor de kosten bieden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel60
  - number: 60.§ 7.2
    text: |-
      Indien het bedrag van de kosten, die de afzender voor zijn rekening neemt, op het tijdstip van de aanbieding ten
      vervoer niet nauwkeurig kan worden vastgesteld, kan de spoorweg bij wijze van waarborgsom tegen ontvangstbewijs de
      storting vorderen van een bedrag, dat de kosten bij benadering dekt. Zodra op het station van afzending het juiste
      bedrag van de verschuldigde kosten bekend is, vindt de eindafrekening plaats.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel60
  - number: 60.§ 8
    text: |-
      De spoorweg moet zowel op het voor de afzender als op het voor de geadresseerde bestemde deel van de vrachtbrief de
      bedragen specificeren, welke de afzender voor zijn rekening neemt, behoudens in de gevallen, bedoeld in § 7, lid 2,
      artikel 59, § 4, lid 2, en in het geval van vermelding van deze bedragen op een periodieke afrekeningsstaat.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel60
  - number: 61.§ 1
    text: |-
      Bij onjuiste toepassing van een tarief of bij onjuiste vaststelling of inning van de kosten, moet het te veel
      betaalde of het te weinig gevorderde worden vereffend.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel61
  - number: 61.§ 2
    text: |-
      Te veel geïnde bedragen, die door de spoorweg worden vastgesteld, moeten ambtshalve ter kennis van de rechthebbende
      worden gebracht, indien zij € 0.45 per vrachtbrief te boven gaan; de vereffening moet zo spoedig mogelijk
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel61
  - number: 61.§ 3
    text: |-
      Indien de vrachtbrief niet in ontvangst is genomen, is de afzender verplicht de ten onrechte niet geïnde bedragen
      aan de spoorweg te betalen. Wanneer de vrachtbrief door de geadresseerde in ontvangst is genomen, is de afzender
      slechts gehouden tot betaling van een ten onrechte niet geïnd bedrag, voorzover dit betrekking heeft op kosten,
      die hij voor zijn rekening heeft genomen; het restant van het ten onrechte niet geïnde bedrag komt ten laste van
      de geadresseerde.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel61
  - number: 62.§ 1.1
    text: |-
      Onverminderd de verplichting tot betaling van het verschil in vracht en van een vergoeding voor eventuele schade,
      kan de spoorweg boeten heffen in de gevallen en onder de voorwaarden die hierna zijn bepaald:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 1.1.c
    text: |-
      bij een aanduiding, die op een onjuiste, onnauwkeurige of onvolledige wijze de aard van een zending omschrijft,
      of in het algemeen bij een aanduiding, die op een of andere manier de zending onder een lager tarief zou kunnen
      doen vallen dan het feitelijk van toepassing zijnde tarief, het dubbele van het verschil tussen de vracht, die
      had moeten worden geïnd van het station van afzending tot het station van bestemming indien de aanduiding juist,
      nauwkeurig en volledig was geweest en de vracht, die is berekend op grond van de door de afzender op de vrachtbrief
      vermelde aanduiding. Indien een zending is samengesteld uit goederen, die volgens verschillende prijzen worden
      bevracht en het gewicht van elke goederensoort zonder bezwaar kan worden vastgesteld, wordt de boete berekend
      volgens de vrachtprijs, die voor elke goederensoort afzonderlijk geldt, indien deze wijze van vrachtberekening een
      lagere boete oplevert;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 1.1.d
    text: |-
      bij aangifte van een lager gewicht, een geringer aantal stuks, of kleinere afmetingen per collo dan werkelijk het
      geval is, het dubbele van het verschil tussen de vracht die verschuldigd zou zijn indien het gewicht, de afmetingen
      of het aantal stuks juist zouden zijn aangegeven en die, welke op grond van de vermelde aanduidingen verschuldigd
      is, berekend van het station van afzending tot het station van bestemming. Het bepaalde onder *c*, tweede volzin,
      is op overeenkomstige wijze van toepassing;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 1.1.e
    text: |-
      bij overbelasting van een door de afzender beladen wagen € 4,54 voor elke 100 kg, waarmede de toelaatbare belading
      is overschreden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 1.2
    text: |-
      De in deze paragraaf bedoelde boeten kunnen naast elkaar geheven worden. Indien echter gelijktijdig zowel op grond
      van het in § 1, lid 1, onder *c*, als van het onder *d*, bepaalde boete geheven kan worden, bedraagt de boete het
      dubbele van het verschil tussen de vracht, die verschuldigd zou zijn, indien het gewicht, de afmetingen of het
      aantal stuks juist aangegeven zou zijn en die, welke op grond van de vermelde aanduidingen verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 2
    text: |-
      De op grond van § 1 opgelegde boeten komen ten laste van de zending, onverschillig de plaats, waar de bezwarende
      feiten zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 3
    text: Het bedrag van de boeten en de aanleiding tot de boeteheffing moeten op de vrachtbrief worden vermeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 4
    text: 'De boete kan niet geheven worden:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 4.a
    text: |-
      bij opgave van te gering gewicht, aantal stuks of te kleine afmetingen, indien de afzender op de vrachtbrief de
      spoorweg heeft verzocht deze gegevens vast te stellen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 4.b
    text: bij overbelasting van een wagen, indien de afzender op de vrachtbrief weging door de spoorweg heeft verzocht;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 4.c
    text: |-
      bij een tijdens het vervoer door weersinvloeden veroorzaakte overbelasting, indien wordt bewezen, dat de lading
      van de wagen de toelaatbare belading niet overschreed ten tijde van de aanbieding ten vervoer op het station van
      afzending;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 4.d
    text: |-
      bij toeneming van het gewicht tijdens het vervoer, zonder dat er sprake is van overbelasting, indien wordt bewezen,
      dat deze toeneming is te wijten aan weersinvloeden;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 4.e
    text: |-
      bij onnauwkeurige aangifte van het gewicht zonder dat er sprake is van overbelasting, indien het verschil tussen
      het op de vrachtbrief aangegeven gewicht en het vastgestelde gewicht niet meer bedraagt dan 3% van het aangegeven
      gewicht;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 62.§ 4.f
    text: |-
      bij overbelasting van een wagen, wanneer de spoorweg de toelaatbare belading niet heeft bekend gemaakt en niet op
      zodanige wijze aan de afzender heeft opgegeven dat deze haar in acht kan nemen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: 63.§ 1
    text: In de tarieven wordt bepaald onder welke voorwaarden voorschotten worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel63
  - number: 63.§ 2
    text: Voor voorschotten is een in de tarieven vast te stellen vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel63
  - number: 64.§ 1.1
    text: |-
      De afzender is verplicht bij de vrachtbrief de bescheiden te voegen, die nodig zijn voor de vervulling, vóór de
      aflevering van de zending aan de geadresseerde, van de krachtens douane- of andere wettelijke dan wel ambtelijke
      voorschriften vereiste formaliteiten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 1.2
    text: |-
      Indien deze bescheiden niet bij de vrachtbrief kunnen worden gevoegd, moet de afzender deze tijdig doen toekomen
      aan het kantoor van het station, van de douane of van andere instanties, waar de formaliteiten moeten worden
      vervuld; de vrachtbrief moet het kantoor vermelden, waar deze bescheiden ter beschikking van de spoorweg worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 2.1
    text: De spoorweg is niet verplicht te onderzoeken of de bijgevoegde bescheiden volledig en juist zijn.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 2.2
    text: |-
      De afzender is tegenover de spoorweg aansprakelijk voor elke schade, die uit het ontbreken, de onvolledigheid of de
      onjuistheid van die bescheiden zou kunnen voortvloeien, tenzij deze te wijten is aan schuld van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 2.3
    text: |-
      Ontstaat door een oorzaak, als in lid 2 vermeld, buiten schuld van de spoorweg een oponthoud in het vervoer,
      dan heeft de spoorweg het recht voor de gehele duur van het oponthoud het in de tarieven vast te stellen lig-,
      magazijn- of staangeld te heffen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 2.4
    text: Artikel 49, § 4, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 3
    text: |-
      De spoorweg is in geval van schuld aansprakelijk voor de gevolgen van het verlies of het niet of onjuist gebruiken
      van de op de vrachtbrief vermelde bescheiden, die bij dat document zijn gevoegd of aan hem zijn toevertrouwd;
      de door hem te betalen schadevergoeding kan evenwel nimmer hoger zijn dan die, welke bij verlies van het goed
      verschuldigd zou zijn.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 4
    text: |-
      De afzender is verplicht de douanevoorschriften betreffende de verpakking en de bescherming met dekkleden van de
      goederen na te leven. De spoorweg kan zendingen, waarvan de douaneversluiting beschadigd of gebrekkig is, weigeren.
      Indien de afzender de goederen niet overeenkomstig de douanevoorschriften heeft verpakt of met dekkleden beschermd,
      heeft de spoorweg het recht hierin te voorzien. De kosten komen ten laste van de zending.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 5.1
    text: |-
      Onderweg worden de krachtens douane- of andere wettelijke dan wel ambtelijke voorschriften vereiste formaliteiten
      behoudens in het geval, bedoeld in lid 2, door de spoorweg vervuld. Het staat de spoorweg vrij deze taak onder
      eigen verantwoordelijkheid aan een gemachtigde toe te vertrouwen of zichzelf daarmede te belasten. In beide
      gevallen neemt de spoorweg de verplichtingen van een expediteur op zich.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 5.2
    text: |-
      De geadresseerde of diens gemachtigde mogen onder in de tarieven te bepalen voorwaarden de hiervoren bedoelde
      formaliteiten zelf vervullen op een binnenlandse douanelosplaats, indien het station van bestemming ressorteert
      onder deze binnenlandse douanelosplaats. Noch de geadresseerde, noch diens gemachtigde zijn gerechtigd het goed in
      bezit te nemen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 5.3
    text: |-
      Voorts kan de afzender door een vermelding op de vrachtbrief verzoeken zelf de in lid 1 bedoelde handelingen bij te
      wonen of zich daarbij te doen vertegenwoordigen door een gemachtigde, teneinde alle inlichtingen te verstrekken en
      ter zake dienende opmerkingen te maken, zonder dat hij hieraan het recht kan ontlenen het goed in bezit te nemen of
      de formaliteiten zelf te vervullen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 6.1
    text: |-
      De geadresseerde heeft het recht op het station van bestemming, waar een douanekantoor is gevestigd, de
      douaneformaliteiten zelf te vervullen of door een gemachtigde te doen vervullen, indien de vrachtbrief de
      vrijmaking bij aankomst voorschrijft of indien bij ontbreken van dit voorschrift het goed onder douaneversluiting
      aankomt. Indien hij van dit recht gebruik maakt, moet hij vooraf zijn uit artikel 68, § 1, lid 1, voortvloeiende
      verplichtingen nakomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 6.2
    text: |-
      Indien de geadresseerde zich niet binnen een in de tarieven te bepalen termijn meldt tot het in ontvangst nemen
      van de vrachtbrief, wordt de zending als geweigerd beschouwd en wordt overeenkomstig het bepaalde in artikel 73
      gehandeld. Indien overeenkomstig het bepaalde in artikel 73, § 2, lid 2, de spoorweg tot verkoop van de goederen
      overgaat, kan de spoorweg handelen zoals in § 5, lid 1, is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 6.3
    text: |-
      De geadresseerde, aan wie de vrachtbrief ter hand is gesteld, is indien hij de in dit artikel bedoelde formaliteit
      niet of niet naar behoren vervult, aansprakelijk voor alle schade, welke de spoorweg uit dien hoofde mocht lijden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 6.4
    text: |-
      De geadresseerde mag de goederen niet uit de wagens lossen, noch van het terrein of uit de magazijnen van de
      spoorweg afvoeren, voordat de belastingbescheiden zijn aangezuiverd en aan alle krachtens douane- of andere
      wettelijke dan wel ambtelijke voorschriften nodige formaliteiten is voldaan. De geadresseerde is aansprakelijk voor
      de schade, die uit de niet-nakoming van deze bepaling voor de spoorweg mocht ontstaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 7.1
    text: |-
      Onverminderd het bepaalde in § 2, is de geadresseerde, indien hij ter aanvulling van door de afzender bij de
      vrachtbrief gevoegde, doch onvolledig of onjuist gebleken bescheiden nadere gegevens verstrekt, waarvan de spoorweg
      gebruik moet maken ter vervulling van de formaliteiten, waarvan in dit artikel sprake is, aansprakelijk voor alle
      schade, welke de spoorweg mocht lijden tengevolge van de onvolledigheid of onjuistheid van de door de geadresseerde
      verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 7.2
    text: |-
      De spoorweg is niet verplicht de zending af te leveren voordat het bedrag van de schade of een naar zijn oordeel
      voldoende waarborgsom betaald is.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 8.1
    text: |-
      Het verrichten van de in dit artikel bedoelde formaliteiten door of vanwege de spoorweg geschiedt tegen een
      daarvoor in de tarieven vast te stellen vergoeding.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 8.2
    text: |-
      De spoorweg kan voor de door hem aan de douane en andere overheidsinstanties betaalde bedragen een in de tarieven
      vast te stellen provisie in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 8.3
    text: |-
      Indien het verrichten van de bedoelde formaliteiten buiten schuld van de spoorweg langer oponthoud veroorzaakt
      dan daarvoor in de tarieven is toegestaan, kan voor de langere duur van het oponthoud het in de tarieven vast te
      stellen lig-, magazijn- of staangeld in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 9
    text: |-
      De spoorweg is niet verplicht goederen, welke anders dan per spoorweg zijn aangevoerd onder douaneversluiting, ten
      doorvoer naar andere landen of ter vrijmaking naar een binnenlandse douanelosplaats te vervoeren.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 64.§ 10
    text: |-
      De geadresseerde is tegenover de spoorweg aansprakelijk voor de vervulling van de krachtens douane- of andere
      wettelijke dan wel ambtelijke voorschriften vereiste formaliteiten, welke na de aflevering van de goederen elders
      vervuld moeten worden. De bij de vrachtbrief behorende bescheiden worden de geadresseerde tegen bijzondere kwijting
      afgegeven. De spoorweg is bevoegd bij de aflevering van de zending ter dekking van zijn risico een naar zijn
      oordeel voldoende waarborgsom te vorderen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: 65.§ 1.1
    text: |-
      De afzender heeft het recht de vervoersovereenkomst te wijzigen door het geven van een nadere aanwijzing,
      inhoudende:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 1.1.a
    text: dat de zending aan een andere dan de op de vrachtbrief aangeduide geadresseerde wordt afgeleverd;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 1.1.b
    text: |-
      dat de zending op een ander dan het op de vrachtbrief aangeduide station van bestemming wordt afgeleverd of naar
      het station van afzending wordt teruggezonden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 1.2
    text: In de tarieven kunnen ook andere dan de in lid 1 genoemde nadere aanwijzingen worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 1.3
    text: De nadere aanwijzingen mogen nimmer splitsing van de zending ten gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 2
    text: |-
      De afzender is verplicht de nadere aanwijzingen te geven aan het station van afzending door middel van een
      schriftelijke verklaring overeenkomstig het in de tarieven vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 3.1
    text: |-
      De spoorweg mag de uitvoering van de in § 1 genoemde nadere aanwijzingen, welke op de in § 2 voorgeschreven wijze
      zijn gegeven, niet weigeren of uitstellen, tenzij:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 3.1.a
    text: |-
      de uitvoering niet meer mogelijk is op het tijdstip, waarop de nadere aanwijzingen het station, dat deze moet
      uitvoeren, bereiken;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 3.1.b
    text: de uitvoering van dien aard is, dat daardoor de regelmatige dienstuitvoering zou worden verstoord;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 3.1.c
    text: de uitvoering in strijd is met de douane- of andere wettelijke dan wel ambtelijke voorschriften; of
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 3.1.d
    text: |-
      in het geval van wijzigingen van het station van bestemming, de waarde van de zending het totaal van de kosten
      tot het nieuwe station van bestemming naar alle waarschijnlijkheid niet dekt of de zending bestaat uit licht
      bederfelijke goederen, tenzij het bedrag van deze kosten onmiddellijk wordt betaald of hiervoor een waarborgsom
      wordt gestort.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 3.2
    text: |-
      In de in lid 1 genoemde gevallen moet de afzender zo spoedig mogelijk in kennis worden gesteld van de
      belemmeringen, die de uitvoering van zijn nadere aanwijzing verhinderen. Indien het station van afzending deze
      belemmeringen niet kon voorzien, komen alle gevolgen, die voortvloeien uit het begin van uitvoering van de nadere
      aanwijzing, voor rekening van de afzender.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 4
    text: In de tarieven wordt bepaald, op welke wijze in de gevallen, bedoeld in § 1, de vracht wordt berekend.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 5
    text: |-
      De kosten, voortvloeiende uit de uitvoering van een nadere aanwijzing, komen ten laste van de zending, tenzij deze
      nadere aanwijzing het gevolg is van omstandigheden die aan de schuld van de spoorweg zijn te wijten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 6
    text: |-
      Het recht van de afzender tot wijziging van de vervoerovereenkomst vervalt, zodra na aankomst van de zending op het
      station van bestemming:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 6.a
    text: |-
      bij zendingen, welke worden besteld, deze het station hebben verlaten, tenzij de zending door de geadresseerde niet
      in ontvangst wordt genomen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 6.b
    text: bij zendingen, welke niet worden besteld, de vrachtbrief of de zending aan de geadresseerde is ter hand gesteld;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 6.c
    text: |-
      de geadresseerde overeenkomstig artikel 68, § 2, zijn uit de vervoerovereenkomst voortvloeiende rechten heeft doen
      gelden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 65.§ 7
    text: |-
      Onder voorbehoud van het bepaalde in § 3 is de spoorweg, in geval van schuld zijnerzijds, aansprakelijk voor
      de gevolgen van het niet of onjuist uitvoeren van een krachtens dit artikel gegeven nadere aanwijzing. De
      schadevergoeding, die de spoorweg moet betalen kan evenwel nooit hoger zijn dan die, welke verschuldigd zou zijn in
      geval van verlies van het goed.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: 66.§ 1
    text: |-
      Bij belemmering in het vervoer beslist de spoorweg of het in het belang van de afzender is, deze instructies te
      vragen dan wel of het de voorkeur verdient de zending zonder meer langs een andere dan de daarvoor normaal in
      aanmerking komende weg te vervoeren.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel66
  - number: 66.§ 2
    text: |-
      Indien er geen andere weg is of indien om andere redenen het vervoer niet mogelijk is, vraagt de spoorweg
      instructies aan de afzender, tenzij de spoorweg, indien te voorzien is dat de belemmering van korte duur zal zijn,
      het in het belang van de afzender acht de opheffing van de belemmering af te wachten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel66
  - number: 66.§ 3
    text: |-
      De afzender mag op de vrachtbrief instructies geven voor het geval zich een belemmering in het vervoer zou
      voordoen. Indien naar het oordeel van de spoorweg die instructies niet kunnen worden uitgevoerd, vraagt de spoorweg
      nieuwe instructies aan de afzender.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel66
  - number: 66.§ 4
    text: |-
      De van een belemmering in het vervoer in kennis gestelde afzender dient zijn instructies te geven aan het station
      dat hem daarom vroeg.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel66
  - number: 66.§ 5
    text: |-
      Indien de bedoelde instructies een wijziging van de vervoerovereenkomst inhouden, zijn daarop de beperkingen van
      artikel 65, § 1, en de voorschriften van artikel 65, § 2 , niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel66
  - number: 66.§ 6.1
    text: |-
      Indien de van een belemmering in het vervoer in kennis gestelde afzender niet binnen een in de tarieven vast
      te stellen termijn van ten minste vierentwintig uren uitvoerbare instructies geeft, kan worden gehandeld
      overeenkomstig het bepaalde in artikel 73, § 2.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel66
  - number: 66.§ 6.2
    text: |-
      De spoorweg is gerechtigd het in de tarieven vast te stellen lig-, magazijn- of staangeld in rekening te brengen
      van het ogenblik af, waarop de in het vorige lid bedoelde termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel66
  - number: 66.§ 7
    text: |-
      Indien de belemmering in het vervoer ophoudt te bestaan vóór aankomst van de instructies van de afzender, wordt
      de zending naar het station van bestemming doorgezonden zonder dat deze instructies worden afgewacht. De afzender
      wordt hiervan zo spoedig mogelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel66
  - number: 66.§ 8
    text: |-
      Indien ten gevolge van beslag of een maatregel van douane of andere overheidsinstanties met betrekking tot het
      goed de spoorweg belet wordt dit te vervoeren, is deze bevoegd het in de tarieven te bepalen lig-, magazijn-
      of staangeld ten laste van de zending te brengen. Indien het goed moet worden vernietigd of niet weer wordt
      vrijgegeven ten gevolge van de in deze paragraaf genoemde maatregelen, is de afzender verplicht de spoorweg de nog
      niet betaalde vracht over het reeds afgelegde trajekt en de overige kosten alsnog te voldoen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel66
  - number: '67'
    text: |-
      De leveringstermijnen worden door de afzender en de spoorweg tezamen bepaald. In de tarieven kunnen aanvullende
      regelingen omtrent de leveringstermijnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel67
  - number: 68.§ 1.1
    text: |-
      De spoorweg is verplicht de vrachtbrief en de zending op het station van bestemming aan de geadresseerde tegen
      kwijting en tegen betaling van de te zijnen laste gebrachte vorderingen met uitzondering van die, welke op
      een periodieke afrekeningsstaat worden vermeld, af te geven na hem desverlangd in staat gesteld te hebben de
      vrachtbrief en de uitwendige staat van de goederen behoorlijk na te zien. De inontvangstneming van de vrachtbrief
      of de zending brengt voor de geadresseerde de verplichting mede de te zijnen laste gebrachte vorderingen aan de
      spoorweg te betalen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68
  - number: 68.§ 1.2
    text: |-
      Met de aflevering van de zending aan de geadresseerde worden gelijkgesteld de overgave hiervan, overeenkomstig de
      geldende voorschriften, aan de douane of andere overheidsinstanties in hun expeditielokalen of in hun entrepots,
      wanneer deze zich niet onder bewaking van de spoorweg bevinden, alsmede de inbewaargeving bij de spoorweg of de
      opslag bij een expediteur of in een openbaar entrepot.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68
  - number: 68.§ 1.3
    text: 'Voorts worden met de aflevering van de zending aan de geadresseerde gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68
  - number: 68.§ 1.3.a
    text: de overgave aan een derde overeenkomstig het bepaalde in artikel 73, § 2;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68
  - number: 68.§ 1.3.b
    text: |-
      de overgave op het station van bestemming aan een ander middel van vervoer of aan een expediteur ten verder vervoer
      naar een niet aan de spoorlijn gelegen plaats of, uitsluitend bij stukgoederen, naar een buiten de bestelkring
      van het station van bestemming gelegen plaats. Deze overgave vindt ambtshalve plaats, indien op de vrachtbrief
      van een stukgoedzending als woonplaats van de geadresseerde zulk een plaats is aangegeven, tenzij de afzender op
      de vrachtbrief of de geadresseerde tijdig vóór aankomst op het station van bestemming omtrent de doorzending enig
      voorschrift heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68
  - number: 68.§ 2
    text: |-
      Na aankomst van de zending op het station van bestemming heeft de geadresseerde het recht de spoorweg te verzoeken
      hem de vrachtbrief ter hand te stellen en hem de zending af te leveren. Indien het verlies van goederen is
      vastgesteld of indien goederen niet voor afloop van de in artikel 77, § 1, genoemde termijn zijn aangekomen, kan de
      geadresseerde op eigen naam de uit de vervoerovereenkomst voortvloeiende rechten tegenover de spoorweg doen gelden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68
  - number: 68.§ 3.1
    text: |-
      In de tarieven wordt bepaald of de goederen door de spoorweg of door de geadresseerde moeten worden gelost, tenzij
      dit reglement hieromtrent voorschriften bevat of tussen de spoorweg en de geadresseerde een bijzondere overeenkomst
      is gesloten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68
  - number: 68.§ 3.2
    text: |-
      Indien de geadresseerde lost, is hij aansprakelijk voor alle schade, welke bij het lossen wordt veroorzaakt,
      tenzij bewezen wordt, dat de schade is ontstaan door de schuld van de spoorweg. De spoorweg is voorts gerechtigd
      de verdere lossing en afvoering van de goederen te beletten, totdat de schade is vergoed of een naar zijn oordeel
      voldoende waarborgsom is gestort.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68
  - number: 68.§ 4
    text: |-
      De rechthebbende kan de aanneming van de zending weigeren, zelfs na inontvangstneming van de vrachtbrief en
      betaling van de kosten, zolang niet is overgegaan tot het in artikel 88 bedoelde onderzoek terzake van een beweerde
      beschadiging.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68
  - number: 68.§ 5
    text: |-
      De spoorweg kan verlangen, dat wagens, welke door de geadresseerde worden gelost, hem na lossing behoorlijk
      gereinigd worden teruggegeven. Wordt aan dit verlangen niet voldaan, dan kan de spoorweg voor het reinigen een in
      de tarieven te bepalen bedrag in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68
  - number: 68a
    text: |-
      Indien de zending zonder een vrachtbrief ten vervoer is aangeboden, als bedoeld in artikel 56, § 12, is op de
      aflevering van deze zending artikel 68 van overeenkomstige toepassing met dien verstande dat in plaats van een
      vrachtbrief de spoorweg aan de geadresseerde op een andere wijze gegevens omtrent de zending afgeeft.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68a
  - number: 69.§ 1.1
    text: |-
      De aangekomen zendingen stukgoederen, die door de spoorweg worden gelost, worden in de plaatsen vermeld in de
      tarieven aan het opgegeven adres besteld binnen de door de spoorweg daarvoor vastgestelde kring.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 1.2
    text: In de tarieven wordt bepaald welke goederen van bestelling zijn uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 1.3
    text: |-
      Het adres, waar de goederen besteld moeten worden, moet langs harde rijwegen met de vervoermiddelen van de
      besteldienst bereikbaar zijn. De goederen behoeven niet verder te worden gebracht dan gelijkvloers tot de aan de
      harde weg gelegen woon- of bedrijfsruimte van de geadresseerde, die desverlangd bij het lossen hulp moet verlenen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 1.4
    text: De spoorweg kan voor het bestellen een in de tarieven te bepalen bedrag in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 1.5
    text: |-
      Voor het terugbrengen naar het station van goederen, die, om welke reden ook, niet afgeleverd kunnen worden,
      alsmede voor het geval, dat de hier bedoelde goederen opnieuw moeten worden besteld, kan een in de tarieven te
      bepalen bedrag in rekening worden gebracht, dat ten hoogste gelijk mag zijn aan het voor het afhalen verschuldigde
      bedrag.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 2
    text: |-
      In de tarieven kan worden bepaald of en onder welke voorwaarden ook andere dan de in § 1, lid 1, bedoelde goederen
      worden besteld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 3.1
    text: 'De bestelling blijft achterwege, indien:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 3.1.a
    text: |-
      de afzender op de vrachtbrief het voorschrift "station restante" of een ander voorschrift van gelijke strekking
      heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 3.1.b
    text: |-
      de geadresseerde tijdig vóór de aankomst van de zending aan het station van bestemming schriftelijk heeft
      kennisgegeven, dat hij de goederen zelf wenst af te voeren of door derden te doen afvoeren. In dit geval moet
      niettemin tot bestelling worden overgegaan, indien de afzender hieromtrent op de vrachtbrief een uitdrukkelijk
      voorschrift heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 3.1.c
    text: de zending met een adreskaart ten vervoer is aangeboden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 3.2
    text: |-
      Het recht van de afzender om "station restante" voor te schrijven, alsmede het recht van de geadresseerde om de
      goederen zelf af te voeren of door derden te doen afvoeren kunnen:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 3.2.a
    text: in de tarieven blijvend worden beperkt of opgeheven;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 3.2.b
    text: |-
      indien gevaar bestaat, dat de regelmatige afwikkeling van het verkeer door ophoping van goederen, hetzij op het
      gehele net of een gedeelte daarvan dan wel op bepaalde stations wordt verstoord, door de spoorweg tijdelijk worden
      beperkt of opgeheven. De spoorweg brengt deze maatregelen onverwijld ter kennis van het publiek. Zij treden niet in
      werking, voordat zij ter kennis van het publiek zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 4
    text: |-
      In buitengewone omstandigheden, zoals bemoeilijking van de besteldienst door sneeuw of ijzel, is de spoorweg
      bevoegd:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 4.a
    text: |-
      voor het bestellen en voor het in § 1, lid 5, bedoelde terugbrengen of opnieuw bestellen een in de tarieven te
      bepalen bedrag in rekening te brengen, dat ten hoogste gelijk mag zijn aan het voor het afhalen verschuldigde
      bedrag;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 69.§ 4.b
    text: de besteldienst geheel of gedeeltelijk te staken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: 70.§ 1
    text: |-
      Van de aankomst van zendingen, welke niet worden besteld, wordt de geadresseerde kennisgegeven, behalve wanneer
      deze tijdig schriftelijk heeft verzocht zulks na te laten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel70
  - number: 70.§ 2
    text: 'In de tarieven wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel70
  - number: 70.§ 2.a
    text: op welke wijze de vorenbedoelde kennisgeving geschiedt en in hoeverre daarvoor kosten in rekening worden gebracht;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel70
  - number: 70.§ 2.b
    text: |-
      op welk ogenblik een per post verzonden kennisgeving moet worden gerekend in het bezit van de geadresseerde te
      zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel70
  - number: '71'
    text: |-
      In de tarieven wordt bepaald of en onder welke voorwaarden de spoorweg verplicht is op verzoek van de geadresseerde
      op het station van bestemming het gewicht van het goed, het aantal colli of stuks, de afmetingen van elk collo of
      het eigengewicht van de wagen vast te stellen. De bepalingen van artikel 57, § 3, tweede volzin, § 4, en § 5, zijn
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel71
  - number: 72.§ 1
    text: |-
      Het lossen van wagens en het afvoeren van goederen door de geadresseerde moeten geschieden gedurende de door de
      spoorweg vastgestelde uren, welke op aanvraag worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel72
  - number: 72.§ 2
    text: |-
      De termijnen, binnen welke door de spoorweg geloste goederen moeten zijn afgevoerd, en die, binnen welke door de
      geadresseerde te lossen goederen moeten zijn gelost en afgevoerd, worden in de tarieven bepaald.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel72
  - number: 72.§ 3
    text: |-
      Indien de door de spoorweg geloste goederen buiten schuld van de spoorweg niet binnen de gestelde termijn zijn
      afgevoerd, wordt van het ogenblik af, waarop die termijn is afgelopen, het in de tarieven te bepalen lig- of
      magazijngeld geheven.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel72
  - number: 72.§ 4.1
    text: |-
      Indien de door de geadresseerde te lossen goederen buiten schuld van de spoorweg niet binnen de gestelde termijn
      zijn gelost en afgevoerd, wordt van het ogenblik af, waarop die termijn is afgelopen, het in de tarieven te bepalen
      lig-, magazijn- of staangeld geheven.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel72
  - number: 72.§ 4.2
    text: |-
      Indien de lostermijn met meer dan vierentwintig uren is overschreden, is de spoorweg bevoegd de wagens op kosten
      en voor risico van de rechthebbende te lossen, waarvoor een in de tarieven te bepalen vergoeding in rekening kan
      worden gebracht. Verder is de spoorweg bevoegd met de goederen te handelen als in artikel 73, § 2, is bepaald en
      voor de tijd, gedurende welke de goederen bij de spoorweg verblijven, het in de tarieven te bepalen lig-, magazijn-
      of staangeld in rekening te brengen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel72
  - number: 72.§ 5
    text: |-
      Meldt de geadresseerde, aan wie van de aankomst kennis werd gegeven, zich aan om de goederen in ontvangst te nemen
      en kan hieraan door schuld van de spoorweg niet binnen een uur, nadat hij zich heeft aangemeld, worden voldaan, dan
      is de spoorweg verplicht hem de kosten te vergoeden, welke uit de vergeefse poging om de goederen in ontvangst te
      nemen voor hem zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel72
  - number: 72.§ 6.1
    text: |-
      Indien gevaar bestaat, dat de regelmatige afwikkeling van het verkeer door ophoping van goederen, hetzij op het
      gehele net of een gedeelte daarvan dan wel op bepaalde stations, wordt verstoord, is de spoorweg bevoegd de tijd,
      welke van het berekenen van lig- of magazijngeld is vrijgesteld en de lostermijn te verkorten, alsmede het lig-,
      magazijn- of staangeld te verhogen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel72
  - number: 72.§ 6.2
    text: |-
      De verkorting van de tijd, welke van het berekenen van lig- of magazijngeld is vrijgesteld, en van de lostermijn,
      alsmede de verhoging van het lig-, magazijn- of staangeld geschiedt met inachtneming van het in artikel 115
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel72
  - number: 72.§ 6.3
    text: |-
      De spoorweg brengt deze maatregelen onverwijld ter kennis van het publiek. Zij treden niet in werking voordat ze
      ter kennis van het publiek zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel72
  - number: 73.§ 1.1
    text: |-
      Heeft de geadresseerde niet zijn rechten doen gelden overeenkomstig het bepaalde in artikel 68, § 2, is hij niet
      te vinden, weigert hij de vrachtbrief en de zending in ontvangst te nemen, verzuimt hij zich binnen de termijn, die
      vrijgesteld is van het berekenen van lig-, magazijn- of staangeld, tot het inontvangstnemen van de vrachtbrief en
      de zending aan te melden, of is de regelmatige aflevering om enige andere reden verhinderd, dan liggen de goederen,
      gelost of niet gelost, voor rekening en risico van de afzender.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 1.2
    text: |-
      Het station van bestemming moet de afzender onverwijld van de stand van zaken kennisgeven en hem daarbij om
      instructies vragen. Deze kennisgeving geschiedt rechtstreeks of door tussenkomst van het station van afzending, ter
      beoordeling van de spoorweg. De spoorweg is verplicht tot rechtstreekse kennisgeving, indien de afzender dit op de
      vrachtbrief heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 1.3
    text: |-
      De spoorweg mag, behalve ten gevolge van de belemmering in de aflevering ontstane kosten (vracht, lig-, magazijn-
      of staangeld, porti, telegramkosten, enz.), voor de kennisgeving van niet-aflevering en de uitvoering van de
      instructies een in de tarieven te bepalen bedrag in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 1.4
    text: |-
      Indien de belemmering in de aflevering is opgeheven en de geadresseerde bereid is de zending alsnog in ontvangst
      te nemen, wordt deze hem afgeleverd, tenzij het station van bestemming intussen tegengestelde instructies van de
      afzender heeft ontvangen. Van deze aflevering moet de afzender onmiddellijk kennis worden gegeven; de eventuele
      kosten hiervan komen ten laste van de zending.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 1.5
    text: |-
      De afzender kan op de vrachtbrief verzoeken hem de zending ambtshalve terug te zenden, indien zich een belemmering
      in de aflevering voordoet. Behalve in dit geval mag de zending de afzender niet zonder zijn uitdrukkelijke
      toestemming worden teruggezonden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 1.6
    text: |-
      De van een belemmering in de aflevering in kennis gestelde afzender dient zijn instructies te geven aan het
      station, waarvan hij de kennisgeving ontving. Voor deze instructies geldt het bepaalde in artikel 65, § 1, lid 3,
      en in artikel 65, § 3.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 2.1
    text: |-
      Is het door bijzondere omstandigheden niet mogelijk de afzender te verwittigen, verzuimt deze tijdig instructies te
      geven, of zijn de door hem gegeven instructies niet uitvoerbaar, dan is de spoorweg bevoegd de goederen in bewaring
      te geven aan een derde, die op de bewaarneming van de goederen is ingericht. Deze bewaargeving geschiedt tegen
      onmiddellijke betaling van de op de zending drukkende vorderingen, in naam van de afzender, die hierdoor evenzeer
      verbonden zal zijn, als had hij tot de bewaargeving last gegeven. Van een gedane bewaargeving wordt de afzender zo
      spoedig mogelijk kennis gegeven. De eventuele kosten van deze kennisgeving komen ten laste van de zending.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 2.2
    text: |-
      De spoorweg is verder bevoegd de goederen zonder enige formaliteit op de best mogelijke wijze te verkopen, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 2.2.a
    text: |-
      goederen, welke naar zijn oordeel wegens hun licht bederfelijke aard, hun geringe waarde of om andere redenen niet
      geschikt zijn om in bewaring te worden genomen of gegeven, te allen tijde mogen worden verkocht;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 2.2.b
    text: |-
      andere goederen niet eerder mogen worden verkocht dan twintig dagen na afloop van de tijd, die vrijgesteld is
      van het berekenen van lig-, magazijn- of staangeld; zou echter de waarde der goederen door een bewaring gedurende
      twintig dagen onevenredig verminderen of zouden de kosten van bewaring niet in een redelijke verhouding staan tot
      de waarde van de goederen, dan mag de verkoop zoveel eerder plaatshebben als de spoorweg nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 2.3
    text: |-
      De afzender moet, zo mogelijk, van de op handen zijnde verkoop verwittigd worden. Indien de spoorweg zelf de
      verkoop op zich neemt, mag daarvoor, behalve de gemaakte kosten, een in de tarieven te bepalen bedrag in rekening
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 2.4
    text: |-
      Aan de afzender moet na de verkoop hiervan bericht worden gezonden, zo mogelijk onverwijld. De opbrengst van de
      verkoop wordt, na aftrek van de vracht en van alle zowel op de goederen drukkende als op de bewaring en de verkoop
      gevallen kosten, ter beschikking van de afzender gesteld; is de opbrengst echter lager dan de vracht en de kosten,
      dan is de afzender verplicht het verschil aan de spoorweg te betalen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 3.1
    text: |-
      Heeft de geadresseerde de hem aangeboden vrachtbrief aangenomen of overeenkomstig het bepaalde in artikel 68, §
      2, zijn uit de vervoerovereenkomst voortvloeiende rechten doen gelden, doch is de termijn, die vrijgesteld is van
      het berekenen van lig-, magazijn- of staangeld verstreken, zonder dat de goederen zijn afgevoerd, dan liggen deze,
      gelost of ongelost, voor rekening en risico van de geadresseerde.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 73.§ 3.2
    text: |-
      Omtrent de bevoegdheid van de spoorweg om de goederen in bewaring te geven aan een derde en om de goederen te
      verkopen, zijn de bepalingen van § 2 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: 74.§ 1.1
    text: |-
      De spoorweg is aansprakelijk voor schade, welke het gevolg is van de overschrijding van de leveringstermijn,
      alsmede voor schade, welke te rekenen van de aanneming ten vervoer tot de aflevering, voortvloeit uit het geheel of
      gedeeltelijk verlies of de beschadiging van het goed.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 1.2
    text: |-
      Bij afhalen van goederen door of namens de spoorweg vangt de aansprakelijkheid voor geheel of gedeeltelijk verlies,
      alsmede voor beschadiging volgens het bepaalde in lid 1 reeds aan op het ogenblik, waarop de goederen bij de
      afzender zijn afgehaald.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 2
    text: |-
      De spoorweg is van deze aansprakelijkheid ontheven, indien de overschrijding van de leveringstermijn, het verlies
      of de beschadiging is veroorzaakt door schuld van de rechthebbende, een door deze gegeven opdracht, welke het
      uitvloeisel is van omstandigheden die niet aan de schuld van de spoorweg zijn te wijten, een aan het goed eigen
      gebrek (inwendig bederf, gewichtsverlies, enz.) of door omstandigheden, die de spoorweg niet kon vermijden en
      waarvan hij de gevolgen niet kon afwenden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 3
    text: |-
      De spoorweg is van deze aansprakelijkheid ontheven, indien het verlies of de beschadiging het gevolg is van de
      bijzondere gevaren, verbonden aan een of meer van de hierna genoemde feiten:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 3.a
    text: |-
      vervoer, dat krachtens de geldende bepalingen of krachtens met de afzender gesloten en op de vrachtbrief vermelde
      overeenkomsten op open wagens plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 3.b
    text: |-
      ontbreken of gebrekkige toestand van de verpakking bij goederen, die door hun aard aan kwaliteitsverlies of
      beschadiging zijn blootgesteld, wanneer zij niet of slecht verpakt zijn;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 3.c
    text: |-
      laden door de afzender of lossen door de geadresseerde krachtens de geldende bepalingen of krachtens met de
      afzender gesloten en op de vrachtbrief vermelde dan wel krachtens met de geadresseerde gesloten overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 3.d
    text: |-
      het laden in een wagen die een voor de afzender duidelijk waarneembaar gebrek vertoont of gebrekkige belading,
      wanneer deze door de afzender is verricht krachtens de geldende bepalingen of krachtens met de afzender gesloten en
      op de vrachtbrief vermelde overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 3.e
    text: |-
      vervulling van de krachtens de douane- of andere wettelijke dan wel ambtelijke voorschriften vereiste formaliteiten
      door de geadresseerde of diens gemachtigde;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 3.f
    text: |-
      de aard van bepaalde goederen, die tengevolge van aan deze aard verbonden oorzaken zijn blootgesteld aan geheel
      of gedeeltelijk verlies of beschadiging, zoals door breuk, roest, vanzelfoptredend inwendig bederf, uitdroging,
      vermindering;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 3.g
    text: |-
      verzending onder een onjuiste, onnauwkeurige of onvolledige benaming van goederen die van het vervoer zijn
      uitgesloten; verzending onder een onjuiste, onnauwkeurige of onvolledige benaming of niet-inachtneming door de
      afzender van de voor voorwaardelijk toegelaten goederen gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 3.h
    text: vervoer van levende dieren;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 74.§ 3.i
    text: |-
      vervoer van zendingen, die krachtens de geldende bepalingen of krachtens met de afzender gesloten en op de
      vrachtbrief vermelde overeenkomsten moeten worden begeleid, voor zover het verlies of de beschadiging voortvloeit
      uit een gevaar, dat de begeleiding had moeten voorkomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: 75.§ 1
    text: |-
      Het bewijs, dat de overschrijding van de leveringstermijn, het verlies of de beschadiging, door een der in artikel
      74, § 2, genoemde feiten is veroorzaakt, rust op de spoorweg.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel75
  - number: 75.§ 2
    text: |-
      Indien de spoorweg bewijst, dat gelet op de feitelijke omstandigheden het verlies of de beschadiging het gevolg kan
      zijn van een of meer van de in artikel 74, § 3, genoemde bijzondere gevaren, bestaat het vermoeden, dat het verlies
      of de beschadiging daarvan het gevolg is. De rechthebbende behoudt evenwel het recht te bewijzen, dat de schade
      niet geheel of gedeeltelijk het gevolg is van een van deze gevaren. Dit vermoeden bestaat niet in het in artikel
      74, § 3, onder *a*, genoemde geval, indien zich een ongewoon groot tekort of verlies voordoet.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel75
  - number: '76'
    text: |-
      Wanneer een onder de bepalingen van dit reglement verzonden zending onder diezelfde bepalingen met een nieuwe
      vrachtbrief is doorgezonden en een gedeeltelijk verlies of een beschadiging na de doorzending wordt vastgesteld,
      bestaat het vermoeden, dat dit verlies of deze beschadiging is ontstaan tijdens de laatste vervoerovereenkomst,
      indien aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel76
  - number: 76.a
    text: de zending is steeds onder toezicht van de spoorweg gebleven;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel76
  - number: 76.b
    text: |-
      de zending is met een nieuwe vrachtbrief doorgezonden in de toestand, waarin hij op het station van doorzending
      aankwam.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel76
  - number: 77.§ 1
    text: |-
      De rechthebbende kan het goed als verloren beschouwen, wanneer het niet binnen dertig dagen na het verstrijken van
      de leveringstermijn aan de geadresseerde is afgeleverd of te zijner beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel77
  - number: 77.§ 2
    text: |-
      De rechthebbende kan bij de uitbetaling van de schadevergoeding voor het verloren goed schriftelijk verzoeken om
      onmiddellijke kennisgeving, indien het goed binnen één jaar na de betaling van de schadevergoeding mocht worden
      teruggevonden. Van dit verzoek wordt hem een schriftelijk bewijs gegeven.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel77
  - number: 77.§ 3
    text: |-
      Binnen dertig dagen na ontvangst van deze kennisgeving kan de rechthebbende eisen, dat het goed hem zonder
      berekening van vracht wordt afgeleverd en wel, te zijner keuze, of aan het station van afzending of aan het op
      de vrachtbrief vermelde station van bestemming, tegen terugbetaling van de door hem ontvangen schadevergoeding en
      onder voorbehoud van alle rechten op vergoeding wegens overschrijding van de leveringstermijn.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel77
  - number: 77.§ 4
    text: |-
      Indien het in § 2 bedoelde verzoek niet wordt gedaan of de in § 3 bedoelde instructies niet binnen dertig dagen
      worden gegeven, dan wel het goed meer dan één jaar na betaling van de schadevergoeding is teruggevonden, kan de
      spoorweg daarover vrij beschikken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel77
  - number: 78.§ 1
    text: |-
      Indien krachtens de bepalingen van dit reglement een schadevergoeding voor geheel of gedeeltelijk verlies van het
      goed verschuldigd is, wordt deze berekend:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel78
  - number: 78.§ 1.a
    text: volgens de beursprijs;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel78
  - number: 78.§ 1.b
    text: bij gebreke hiervan volgens de marktprijs;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel78
  - number: 78.§ 1.c
    text: bij gebreke van beide volgens de gebruikelijke waarde.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel78
  - number: 78.§ 2
    text: |-
      De schadevergoeding kan evenwel, onder voorbehoud van de in artikel 82 genoemde beperkingen, niet meer bedragen dan
      € 11,34 voor elk ontbrekend kilogram brutogewicht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel78
  - number: 78.§ 3
    text: |-
      Bovendien worden de vracht, de douanerechten en de overige met betrekking tot het vervoer van het verloren goed
      betaalde bedragen terugbetaald zonder verdere schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel78
  - number: 79.§ 1
    text: |-
      Ten aanzien van goederen, die in verband met hun bijzondere aard in het algemeen tijdens het vervoer een
      gewichtsvermindering ondergaan, is de spoorweg slechts aansprakelijk voor dat gedeelte van de gewichtsvermindering,
      dat de als volgt bepaalde toelaatbare afwijkingen overtreft:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel79
  - number: 79.§ 1.a
    text: |-
      2 % van het gewicht bij vloeibare of in vochtige toestand ten vervoer aangeboden goederen, alsmede bij de
      navolgende goederen: Afval van huiden, Beenderen, heel of gemalen, Fruit, vers, gedroogd of gekookt, Groente,
      verse, Haar van dieren, Hoornen en hoeven, Hop, Huiden, Leder, Mastiek, verse, Paddestoelen, verse, Pelterijen,
      Pezen van dieren, Schors, Steenkolen en cokes, Tabak, gekerfde, Tabak, verse in bladen, Turf, Varkensborstels,
      Verfhout, geraspt of gemalen, Vetten, Vis, gedroogde, Wol, Wortels, Zeep en vaste oliën, Zoethout, Zout.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel79
  - number: 79.§ 1.b
    text: |-
      1 % van het gewicht bij alle overige goederen, die tijdens het vervoer eveneens aan gewichtsvermindering onderhevig
      zijn.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel79
  - number: 79.§ 2
    text: |-
      Op de in § 1 bedoelde beperking van de aansprakelijkheid kan geen beroep worden gedaan, indien wordt bewezen,
      dat, gelet op de feitelijke omstandigheden, het verlies niet het gevolg is van de oorzaken, die de afwijking
      rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel79
  - number: 79.§ 3
    text: |-
      Worden verscheidene colli met dezelfde vrachtbrief vervoerd, dan wordt de gewichtsvermindering voor elk collo
      afzonderlijk berekend, indien het gewicht daarvan bij vertrek afzonderlijk op de vrachtbrief is vermeld of op
      andere wijze kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel79
  - number: 79.§ 4
    text: |-
      Bij geheel verlies van het goed heeft voor de berekening van de schadevergoeding geen aftrek wegens
      gewichtsvermindering plaats.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel79
  - number: 79.§ 5
    text: Dit artikel laat het in de artikelen 74 en 75 bepaalde onverlet.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel79
  - number: 80.§ 1
    text: |-
      Bij beschadiging moet de spoorweg, met uitsluiting van alle verdere schadevergoeding, het bedrag betalen, dat de
      waardevermindering van het goed vertegenwoordigt. Dit bedrag wordt berekend door op de volgens artikel 78 bepaalde
      waarde van het goed het percentage van de waardevermindering op de plaats van bestemming toe te passen. Bovendien
      worden in dezelfde verhouding de kosten, bedoeld in artikel 78, § 3, terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel80
  - number: 80.§ 2
    text: 'De schadevergoeding kan evenwel niet meer bedragen dan:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel80
  - number: 80.§ 2.a
    text: |-
      indien de gehele zending door de beschadiging in waarde is verminderd: het bedrag, dat zij zou hebben belopen bij
      geheel verlies;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel80
  - number: 80.§ 2.b
    text: |-
      indien slechts een gedeelte van de zending door de beschadiging in waarde is verminderd: het bedrag, dat zij zou
      hebben belopen bij verlies van het in waarde verminderde gedeelte.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel80
  - number: 81.§ 1
    text: |-
      Indien het bewijs wordt geleverd, dat door de overschrijding van de leveringstermijn schade is ontstaan, wordt deze
      schade vergoed tot ten hoogste de gehele vracht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel81
  - number: 81.§ 2
    text: |-
      De in § 1 bedoelde schadevergoeding wordt niet gevoegd bij die, welke verschuldigd zou zijn wegens geheel verlies
      van het goed.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel81
  - number: 81.§ 3
    text: |-
      Bij gedeeltelijk verlies wordt de in § 1 bedoelde schadevergoeding, indien daartoe aanleiding bestaat, betaald voor
      het niet verloren gegane gedeelte van de zending.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel81
  - number: 81.§ 4
    text: |-
      Bij beschadiging wordt de in § 1 bedoelde schadevergoeding, indien daartoe aanleiding bestaat, gevoegd bij de in
      artikel 80 bedoelde schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel81
  - number: 81.§ 5
    text: |-
      In geen geval zal de som van de schadevergoedingen, bedoeld in § 1 en in de artikelen 78 en 80, hoger zijn dan de
      schadevergoeding, die verschuldigd zou zijn bij geheel verlies van het goed.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel81
  - number: '82'
    text: |-
      Wanneer de spoorweg speciale tarieven toepast, die een korting geven op de volgens de algemene tarieven berekende
      vracht, kan hij de aan de rechthebbende bij overschrijding van de leveringstermijn, geheel of gedeeltelijk verlies
      of beschadiging te betalen schadevergoeding beperken, mits dergelijke beperkingen in de tarieven zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel82
  - number: 83.§ 1
    text: |-
      Voor elke zending, met uitzondering van zendingen die met een adreskaart worden aangeboden, kan het belang
      bij de aflevering op de vrachtbrief worden aangegeven. In de in artikel 82 bedoelde speciale tarieven kan deze
      mogelijkheid worden uitgesloten of beperkt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel83
  - number: 83.§ 2
    text: In geval van aangifte van het belang bij de aflevering wordt een in de tarieven te bepalen premie geheven.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel83
  - number: 83.§ 3
    text: |-
      Indien het belang bij de aflevering is aangegeven, kan vergoeding worden gevorderd van het gedeelte van de bewezen
      schade, dat de schadevergoeding op grond van het in de artikelen 78, 80, 81 en 82 bepaalde te boven gaat, doch ten
      hoogste het bedrag van het aangegeven belang.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel83
  - number: '84'
    text: |-
      In alle gevallen, waarin de overschrijding van de leveringstermijn, het gehele of gedeeltelijke verlies of de
      beschadiging van het goed is veroorzaakt door opzet of grove schuld van de spoorweg, moet deze de rechthebbende de
      bewezen schade volledig vergoeden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel84
  - number: '85'
    text: |-
      De spoorweg is ontheven van de aansprakelijkheid, die krachtens dit reglement op hem rust, wanneer de schade
      veroorzaakt is door een kernongeval en de exploitant van een kerninstallatie of een andere persoon, die voor
      hem in de plaats treedt, aansprakelijk is voor die schade krachtens bijzondere wettelijke voorschriften, die de
      aansprakelijkheid op het gebied van de kernenergie regelen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel85
  - number: 86.§ 1
    text: Op de vervoerovereenkomst betrekking hebbende vorderingen buiten rechte moeten schriftelijk worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel86
  - number: 86.§ 2
    text: |-
      Tot het indienen van een vordering buiten rechte zijn bevoegd de personen, die krachtens artikel 87 een vordering
      in rechte tegen de spoorweg kunnen instellen. Zij moeten, ten genoegen van de spoorweg, zodanige dokumenten
      overleggen, als deze voor een juiste behandeling van de vordering nodig acht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel86
  - number: 86.§ 3
    text: |-
      De spoorweg kan, bij de afdoening van de vordering buiten rechte, verlangen in de gelegenheid te worden gesteld
      op het voor de afzender onderscheidenlijk voor de geadresseerde bestemde deel van de vrachtbrief van die afdoening
      aantekening te houden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel86
  - number: 87.§ 1
    text: |-
      De vordering in rechte tot terugbetaling van een krachtens de vervoerovereenkomst betaald bedrag kan slechts
      ingesteld worden door degene, die de betaling heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel87
  - number: 87.§ 2
    text: |-
      De overige uit de vervoerovereenkomst voortvloeiende vorderingen in rechte tegen de spoorweg kunnen ingesteld
      worden:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel87
  - number: 87.§ 2.a
    text: |-
      door de afzender, tot het tijdstip waarop de geadresseerde de vrachtbrief of de zending in ontvangst heeft genomen,
      dan wel de hem krachtens artikel 68, § 2, toekomende rechten heeft doen gelden;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel87
  - number: 87.§ 2.b
    text: |-
      door de geadresseerde, vanaf het tijdstip, waarop hij de vrachtbrief of de zending in ontvangst heeft genomen, dan
      wel de hem krachtens artikel 68, § 2, toekomende rechten heeft doen gelden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel87
  - number: 87.§ 3
    text: |-
      De afzender kan deze vorderingen slechts instellen op vertoon van het voor hem bestemde deel van de vrachtbrief.
      Bij gebreke hiervan kan hij zijn vordering tegen de spoorweg slechts instellen met toestemming van de geadresseerde
      of indien hij het bewijs levert, dat deze de zending heeft geweigerd.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel87
  - number: 88.§ 1
    text: |-
      Indien een gedeeltelijk verlies of een beschadiging door de spoorweg wordt ontdekt of vermoed, of door de
      rechthebbende wordt beweerd, moet de spoorweg bij proces-verbaal zonder uitstel en zo mogelijk in tegenwoordigheid
      van de rechthebbende vaststellen, naar gelang van de aard van de schade, de toestand en het gewicht van het goed,
      alsmede, voor zover mogelijk, het bedrag en de oorzaak van de schade en het tijdstip, waarop deze is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel88
  - number: 88.§ 2
    text: Een afschrift van het proces-verbaal wordt desverlangd aan de rechthebbende kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel88
  - number: 89.§ 1
    text: |-
      Door de inontvangstneming van de zending door de rechthebbende vervalt elk uit de vervoerovereenkomst tegen
      de spoorweg voortvloeiende vordering wegens overschrijding van de leveringstermijn, gedeeltelijk verlies of
      beschadiging.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 89.§ 2
    text: 'De vordering vervalt evenwel niet:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 89.§ 2.a
    text: indien de rechthebbende het bewijs levert, dat de schade is veroorzaakt door opzet of grove schuld van de spoorweg;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 89.§ 2.b
    text: |-
      in geval van overschrijding van de leveringstermijn, indien de vordering door de rechthebbende wordt ingediend
      binnen een termijn van vijftien dagen, de dag van de inontvangstneming van de zending door de rechthebbende
      daaronder niet begrepen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 89.§ 2.c
    text: 'in geval van gedeeltelijk verlies of beschadiging:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 89.§ 2.c.1°
    text: |-
      indien vóór de inontvangstneming van de zending door de rechthebbende, het verlies of de beschadiging
      overeenkomstig artikel 88 is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 89.§ 2.c.2°
    text: |-
      indien de vaststelling, welke overeenkomstig artikel 88 had moeten plaatsvinden, uitsluitend door schuld van de
      spoorweg achterwege is gebleven;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 89.§ 2.d
    text: |-
      in geval van uiterlijk niet waarneembare schade, waarvan het bestaan door de rechthebbende is vastgesteld na de
      inontvangstneming van de zending, onder de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 89.§ 2.d.1°
    text: |-
      dat niet door de spoorweg aan de rechthebbende aangeboden is om op het station van bestemming de gesteldheid van
      het goed vast te stellen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 89.§ 2.d.2°
    text: |-
      dat het verzoek om vaststelling overeenkomstig artikel 88 door de rechthebbende wordt gedaan onmiddellijk na de
      ontdekking van de schade en uiterlijk binnen vijf dagen na die van de inontvangstneming van de zending;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 89.§ 2.d.3°
    text: |-
      dat de rechthebbende bewijst, dat de schade is ontstaan in het tijdsverloop tussen de aanneming ten vervoer en de
      aflevering en, bij goederen, welke door de spoorweg zijn afgehaald, tussen de overneming van de goederen door de
      afhaaldienst en de aflevering.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 89.§ 3
    text: |-
      Indien het goed met een nieuwe vrachtbrief is doorgezonden onder de voorwaarden van artikel 76, vervallen de
      vorderingen tot schadevergoeding wegens gedeeltelijk verlies of beschadiging, die voortvloeien uit een van de
      voorafgaande vervoerovereenkomsten, alsof er sprake was van een enkele overeenkomst.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: 90.§ 1
    text: Alle uit de vervoerovereenkomst voortvloeiende vorderingen verjaren door verloop van één jaar.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2
    text: 'De verjaring begint te lopen:'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2.a
    text: |-
      voor vorderingen tot schadevergoeding wegens gedeeltelijk verlies, beschadiging of overschrijding van de
      leveringstermijn: met ingang van de dag, volgende op die waarop de aflevering heeft plaats gehad;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2.b
    text: |-
      voor vorderingen tot schadevergoeding wegens geheel verlies: met ingang van de zesentwintigste dag, volgende op die
      waarop de leveringstermijn is verstreken;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2.c
    text: |-
      voor vorderingen tot betaling of terugbetaling van vrachten, boeten, bijkomende kosten, en voor vorderingen tot
      verbetering van een onjuiste toepassing van een tarief of van een rekenfout:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2.c.1°
    text: 'indien betaling heeft plaatsgehad: met ingang van de dag, volgende op die der betaling;'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2.c.2°
    text: |-
      indien geen betaling heeft plaats gehad en deze door de afzender moet geschieden: met ingang van de dag, volgende
      op die waarop de zending ten vervoer is aangenomen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2.c.3°
    text: |-
      indien geen betaling heeft plaats gehad en deze door de geadresseerde moet geschieden: met ingang van de dag,
      volgende op die waarop de geadresseerde de vrachtbrief in ontvangst heeft genomen;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2.c.4°
    text: |-
      indien er sprake is van een eindafrekening als bedoeld in artikel 60: met ingang van de dag, volgende op die waarop
      de eindafrekening plaatsvindt. Voor de schuldvorderingen van de spoorweg begint voor het geval geen eindafrekening
      plaats vindt, de verjaringstermijn te lopen met ingang van de eenendertigste dag, volgende op die waarop de
      leveringstermijn is verstreken;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2.d
    text: |-
      voor vorderingen van de spoorweg tot betaling van een bedrag, dat door de geadresseerde in plaats van door de
      afzender is betaald of omgekeerd en dat de spoorweg aan de rechthebbende moet teruggeven: met ingang van de dag,
      volgende op die waarop het verzoek tot terugbetaling is gedaan;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2.e
    text: |-
      voor vorderingen tot betaling van een van een verkoop resterend bedrag: met ingang van de dag, volgende op die
      waarop de verkoop heeft plaats gehad;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2.f
    text: |-
      voor vorderingen tot betaling van door de douane nagevorderde rechten: met ingang van de dag, volgende op die
      waarop de douane de navordering heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 2.g
    text: 'in alle overige gevallen: met ingang van de dag, volgende op die waarop het recht kan worden uitgeoefend.'
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 90.§ 3
    text: De schorsing en de stuiting van de verjaring worden beheerst door de bepalingen van het gemene recht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: 91.§ 1
    text: |-
      Op zondag, alsmede op algemeen erkende feestdagen en - voor zover de tarieven niet anders bepalen - op zaterdag
      behoeven goederen niet te woren afgehaald, ten vervoer aangenomen, vervoerd, afgeleverd of besteld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel91
  - number: 91.§ 2
    text: |-
      Deze dagen worden buiten beschouwing gelaten bij de berekening van de in deze titel in uren of dagen uitgedrukte
      termijnen. Ditzelfde geldt voor de berekening van lig-, magazijn- en staangelden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel91
  - number: 91.§ 3
    text: |-
      De spoorweg kan om dringende redenen in het belang van de spoorweg, met inachtneming van het in artikel 115
      bepaalde, afwijken van § 1, alsmede van het bepaalde in § 2, tweede volzin.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel91
  - number: 91.§ 4
    text: |-
      Onder algemeen erkende feestdagen worden verstaan de in [artikel 3 van de Algemene termijnenwet][ref1] als zodanig
      genoemde en de bij of krachtens dat artikel daarmede gelijkgestelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '3'
  - number: '92'
    text: |-
      De bepalingen van titel III zijn, voor zover hiervan in de volgende artikelen niet wordt afgeweken, op
      overeenkomstige wijze van toepassing op het vervoer van levende dieren.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel92
  - number: 93.§ 1
    text: De treinen, waarmede het vervoer geschiedt, worden door de spoorweg aangewezen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel93
  - number: 93.§ 2
    text: |-
      De afzender kan, met inachtneming van het in § 1 bepaalde, vervoer met een door hem aangewezen trein verlangen,
      mits de zending uiterlijk twee uren vóór het vertrek van die trein gereed is om ten vervoer te worden aangenomen,
      de trein hierdoor niet wordt vertraagd en de voorschriften omtrent de samenstelling van de trein de verzending
      mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel93
  - number: 93.§ 3
    text: |-
      Heeft de afzender niet het vervoer met een bepaalde trein verlangd, dan geschiedt het vervoer met de eerstvolgende
      voor het vervoer van levende dieren aangewezen trein; de spoorweg is echter niet verplicht een trein te gebruiken,
      die eerder vertrekt dan twee uren na het gereed zijn voor de aanneming ten vervoer van de zending.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel93
  - number: 94.§ 1
    text: |-
      Levende dieren worden slechts ten vervoer aangenomen, indien de zending volgens de dienstregeling der daarvoor
      aangewezen treinen binnen vierentwintig uren na het tijdstip van vertrek van het station van afzending op het
      station van bestemming in Nederland of bij verzending naar het buitenland, op het Nederlandse grensstation zal
      aankomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel94
  - number: 94.§ 2.1
    text: |-
      De Minister van Verkeer en Waterstaat is bevoegd bij het heersen van besmettelijke veeziekten te bepalen, dat
      op door hem aan te wijzen stations vee in het geheel niet of alleen op door hem vast te stellen voorwaarden ten
      vervoer mag worden aangenomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel94
  - number: 94.§ 2.2
    text: |-
      Het is verboden dieren, lijdende aan een besmettelijke veeziekte en dieren, komende van plaatsen waar zulke ziekten
      heersen, ten vervoer per spoor aan te bieden, te doen aanbieden of per spoor te vervoeren.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel94
  - number: 94.§ 2.3
    text: |-
      De Minister van Verkeer en Waterstaat is bevoegd, de spoorweg gehoord, ten behoeve van wetenschappelijk onderzoek,
      van het in het vorige lid vermelde verbod ontheffing te verlenen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel94
  - number: 94.§ 2.4
    text: |-
      In hoeverre en onder welke voorwaarden dieren lijdende aan andere dan besmettelijke veeziekten worden vervoerd,
      wordt in de tarieven bepaald.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel94
  - number: 94.§ 4
    text: |-
      Tot het vervoer van wilde, verwilderde of boosaardige dieren is de spoorweg niet verplicht. In de tarieven wordt
      bepaald, onder welke voorwaarden het vervoer van deze dieren, indien de spoorweg deze ten vervoer aanneemt,
      geschiedt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel94
  - number: '95'
    text: |-
      Het is verboden levende dieren aan een station aan te brengen, te laden of te doen laden vroeger dan vier uren vóór
      het vertrek volgens de dienstregeling van de trein, waarmede het vervoer zal plaats hebben, tenzij dit in bepaalde
      gevallen door de spoorweg wordt toegestaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel95
  - number: 96.§ 1.1
    text: |-
      De afzender is bij het vervoer van levende dieren gerechtigd en, indien de spoorweg zulks verlangt, verplicht de
      zending te doen begeleiden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel96
  - number: 96.§ 1.2
    text: |-
      De begeleiders moeten, tenzij de spoorweg hiervan afwijking toestaat, plaats nemen in de wagens, waarin de dieren
      geladen zijn, en gedurende het vervoer toezicht houden op de dieren.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel96
  - number: 96.§ 1.3
    text: |-
      Heeft het vervoer met begeleiding plaats, dan moet de begeleider als geadresseerde op de vrachtbrief worden
      vermeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel96
  - number: 96.§ 1.4
    text: |-
      Heeft het vervoer zonder begeleiding plaats, dan is de afzender verplicht aan de geadresseerde kennis te geven
      van de afzending om deze in de gelegenheid te stellen de zending dadelijk na aankomst van de trein in ontvangst te
      nemen. De spoorweg is niet verplicht van de aankomst der zending aan de geadresseerde kennis te geven.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel96
  - number: 96.§ 2
    text: |-
      De spoorweg wijst stations aan voor het drenken van de dieren. Hij stelt op deze stations desverlangd emmers en
      water ter beschikking van de begeleiders.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel96
  - number: '97'
    text: |-
      In de tarieven wordt bepaald, met welk model vrachtbrief de zendingen levende dieren ten vervoer moeten worden
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel97
  - number: 98.§ 1
    text: |-
      De leveringstermijn loopt af drie uren na de aankomst op het station van bestemming van de trein, waarmede het
      vervoer moet geschieden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel98
  - number: 98.§ 2
    text: |-
      Bij zendingen, welke onderweg één of meer malen op een andere trein moeten overgaan, komt voor de berekening
      van de leveringstermijn steeds in aanmerking de na het werkelijke uur van aankomst op het overgangsstation eerst
      aangewezen trein, waarvoor voldoende tijd voor overgang beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel98
  - number: 98.§ 3
    text: |-
      Bij toepassing van § 2 wordt geen rekening gehouden met een aangewezen trein, waarmede het vervoer niet kan
      geschieden, omdat de voor de samenstelling van die trein gegeven voorschriften zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel98
  - number: 98.§ 4
    text: |-
      De leveringstermijn is in acht genomen, indien voor de afloop van deze termijn de wagens ter lossing gereed zijn
      gezet.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel98
  - number: 99.§ 1
    text: |-
      De dieren moeten door de geadresseerde worden gelost en uiterlijk één uur na het gereedzetten van de wagens zijn
      afgevoerd.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel99
  - number: 99.§ 2
    text: |-
      Na afloop van die termijn is de spoorweg bevoegd de dieren voor rekening en risico van de rechthebbende elders te
      stallen. Blijven de dieren na afloop van die termijn evenwel in de wagen, dan komen de door de spoorweg ten behoeve
      van de zending gemaakte kosten ten laste van de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel99
  - number: 99.§ 3
    text: |-
      Ook de dieren, welke vóór de aflevering beschadigd of gestorven zijn, moeten door de rechthebbende worden
      afgevoerd, onverminderd de verplichting van de spoorweg tot vaststelling van de schade overeenkomstig artikel 88.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel99
  - number: 100.§ 1
    text: De afzender is tegenover de spoorweg aansprakelijk voor schade door de dieren veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel100
  - number: 100.§ 2
    text: Artikel 49, § 4, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel100
  - number: '101'
    text: |-
      Indien krachtens de bepalingen van dit reglement door de spoorweg schadevergoeding voor verlies of beschadiging
      (dood daaronder begrepen) verschuldigd is, wordt, indien het belang bij de aflevering niet op de vrachtbrief is
      aangegeven, ten hoogste vergoed: € 453,78 per paard, stier, os of koe; € 136,13 per veulen, pink, kalf of graskalf;
      € 113,45 per varken van 50 kilogram of meer; € 45,38 per varken van minder dan 50 kilogram, schaap of vette big; €
      15,88 per nuchter kalf; € 11,34 per bok, geit, lam, kleine big of hond; € 0,91 per kilogram andere dieren.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel101
  - number: '102'
    text: |-
      De bepalingen van titel III zijn, voorzover hiervan in de volgende artikelen niet wordt afgeweken, op
      overeenkomstige wijze van toepassing op het vervoer van lijken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel102
  - number: '103'
    text: De treinen, waarmede het vervoer geschiedt, worden voor elk geval afzonderlijk door de spoorweg aangewezen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel103
  - number: 104.§ 1
    text: Het vervoer van een lijk moet zolang tevoren worden aangevraagd als in de tarieven wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel104
  - number: 104.§ 2
    text: |-
      Bij het ten vervoer aanbieden van een lijk moeten de bescheiden, welke volgens de wettelijke bepalingen voor het
      vervoer nodig zijn, worden bijgevoegd.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel104
  - number: 104.§ 3
    text: |-
      Tenzij in de tarieven anders is bepaald, moet het lijk geplaatst zijn in een stevige metalen luchtdicht afgesloten
      kist, welke laatste zo vast in een houten kist moet worden geplaatst, dat deze daarin niet kan verschuiven.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel104
  - number: 104.§ 4
    text: |-
      De afzender moet aan het station van afzending een van plaats-, dag- en naamtekening voorziene verklaring afgeven,
      waarin hij te kennen geeft, dat aan de in § 3 vermelde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel104
  - number: '105'
    text: Het vervoer moet onder begeleiding plaats hebben.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel105
  - number: 106.§ 1
    text: In de tarieven wordt bepaald, met welk model vrachtbrief lijken ten vervoer moeten worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel106
  - number: 106.§ 2
    text: De naam van de begeleider moet als geadresseerde op de vrachtbrief worden vermeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel106
  - number: '107'
    text: De vracht moet op het station van afzending worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel107
  - number: '108'
    text: |-
      Onverminderd de verplichting tot betaling van het verschil in vracht kan hem, die een lijk verzendt zonder het als
      zodanig aan te geven, een boete in rekening worden gebracht ten bedrage van het viervoudige van de in de tarieven
      vastgestelde vracht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel108
  - number: '109'
    text: |-
      Wanneer het lijk niet binnen zes uren na aankomst van de trein op het station van bestemming wordt afgevoerd, wordt
      door de spoorweg gehandeld overeenkomstig de op de lijkbezorging van toepassing zijnde wettelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel109
  - number: 113.§ 1
    text: |-
      Voor het vervoer van reizigers en goederen van of naar het buitenland kunnen door de Minister van Verkeer en
      Waterstaat afwijkingen van dit reglement worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel113
  - number: 113.§ 2
    text: |-
      Zendingen, die ten vervoer zijn aangenomen met een internationale vrachtbrief voor vervoer als "grande
      vitesse"/"Eilgut", worden op Nederlands gebied aangemerkt als vrachtgoed, behoudens de in de tarieven te bepalen
      uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel113
  - number: 113.§ 3
    text: |-
      Ten aanzien van buitenlandse spoorwegen, die hun dienst hier te lande uitoefenen, kunnen door de Minister van
      Verkeer en Waterstaat afwijkingen van dit reglement worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel113
  - number: '114'
    text: |-
      De Minister van Verkeer en Waterstaat is bevoegd ontheffing te verlenen van bepalingen van dit reglement, indien
      het gebruik van bijzonder materieel dit nodig maakt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel114
  - number: 115.§ 1
    text: |-
      De Minister van Verkeer en Waterstaat kan terzake van de in de artikelen en 91, § 3, aan de spoorweg toegekende
      bevoegdheden:
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel115
  - number: 115.§ 1.a
    text: de spoorweg voorschriften geven;
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel115
  - number: 115.§ 1.b
    text: |-
      de spoorweg opdragen de op grond van die bevoegdheden getroffen maatregelen weer op te heffen, indien hij van
      mening is, dat de in genoemde artikelen gestelde voorwaarden niet vervuld waren of niet meer vervuld zijn.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel115
  - number: 115.§ 2
    text: |-
      Terzake van de aan de spoorweg in de artikelen 51, § 7, en 72, § 6, toegekende bevoegdheden is de Minister van
      Verkeer en Waterstaat slechts bevoegd tot het geven van de voorschriften bedoeld in § 1, onder *a*.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel115
  - number: 115.§ 3
    text: De spoorweg is verplicht aan deze voorschriften en opdrachten te voldoen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel115
  - number: 115a.§ 1
    text: |-
      In geval van staking van de dienst op een locaalspoorweg zijn, in afwijking van
      [artikel 8, eerste lid, van de Spoorwegwet][ref1], bestuurders niet verplicht te zorgen voor het vervoer van
      goederen in de richting van de locaalspoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel8
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel115a
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '8'
  - number: 115a.§ 2
    text: |-
      De Minister van Verkeer en Waterstaat is bevoegd voor locaalspoorwegen, welke uitsluitend bestemd zijn voor het
      vervoer van goederen, geheel of gedeeltelijk ontheffing te verlenen van de bepalingen van dit reglement. Aan een
      ontheffing kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel115a
  - number: '116'
    text: |-
      Het Algemeen Reglement Vervoer, vastgesteld bij Koninklijk besluit van 9 november 1928 (*Stb.* 415), wordt
      ingetrokken, behoudens de daarbij behorende Bijlage I, welke als Bijlage I bij het onderwerpelijke besluit wordt
      geacht te behoren.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel116
  - number: '118'
    text: Dit besluit kan worden aangehaald als "Algemeen Reglement Vervoer" of "ARV".
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel118
  - number: '119'
    text: Dit besluit treedt in werking met ingang van 1 januari 1967.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel119
