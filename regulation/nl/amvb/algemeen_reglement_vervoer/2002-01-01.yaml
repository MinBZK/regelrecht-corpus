  - number: 57a
    text: >-
      § 1 1. Indien de zending zonder vrachtbrief ten vervoer wordt aangeboden, als bedoeld in artikel 56, § 12, is
      de afzender aansprakelijk voor de juistheid van de door hem aan de spoorweg verstrekte gegevens betreffende de
      zending. Indien door de spoorweg een vrachtbrief wordt opgemaakt, staat de spoorweg tevens in voor de juiste
      vermelding van deze gegevens op de vrachtbrief.


      2. De afzender en de spoorweg dragen ieder de gevolgen die voortvloeien uit het niet nakomen van de op hen rustende
      verplichting op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel57a
  - number: '58'
    text: >-
      § 1 De vervoerovereenkomst is gesloten, zodra de spoorweg de zending met de vrachtbrief ten vervoer heeft
      aangenomen. De aanneming wordt vastgesteld door het afdrukken op de vrachtbrief van een stempel van het station van
      afzending, die de datum van aanneming aangeeft.


      § 2 de afstempeling van de vrachtbrief en, eventueel, van elk aanvullingsblad, geschiedt onmiddellijk nadat al de
      op de vrachtbrief vermelde goederen aan het station bezorgd zijn of, indien zij door de afzender worden geladen,
      geladen zijn en, behoudens het in artikel 60, § 6, eerst lid, bepaalde, de kosten die de afzender voor zijn
      rekening neemt, zijn betaald.


      § 3 Na de afstempeling dient het voor de geadresseerde bestemde deel van de vrachtbrief als bewijs van de
      vervoeroverkomst.


      § 4 De aanduidingen op de vrachtbrief betreffende de afmetingen, het gewicht of, indien de zending door de afzender
      wordt geladen, het aantal stuks kunnen niet als bewijs tegen de spoorweg dienen, tenzij de spoorweg de afmetingen,
      het gewicht of het aantal stuks heeft gecontroleerd en dit op de vrachtbrief heeft aangetekend.


      § 5 De spoorweg is verplicht de ontvangst van de zending en de datum van aanneming ten vervoer door het afdrukken
      van de datumstempel op alle delen van de vrachtbrief te bevestigen. Het voor de afzender bestemde deel van de
      vrachtbrief wordt hem teruggegeven. Dit deel heeft niet de waarde van het voor de geadresseerde bestemde deel van
      de vrachtbrief.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel58
  - number: 58a
    text: >-
      § 1 Indien de zending zonder vrachtbrief ten vervoer wordt aangeboden, als bedoeld in artikel 56, § 12, is de
      vervoerovereenkomst gesloten, zodra de spoorweg de zending ten vervoer heeft aangenomen.


      § 2 1. De spoorweg is verplicht de ontvangst van de zending en de datum van aanneming ten vervoer zowel aan de
      afzender als aan de geadresseerde te bevestigen.


      2. De bevestiging van de ontvangst en de datum van aanneming ten vervoer geschiedt, hetzij door een vermelding op
      de vrachtbrief in het geval dat de spoorweg een vrachtbrief heeft opgemaakt, hetzij op een andere wijze.


      § 3 De afzender en de spoorweg treffen een regeling met betrekking tot de bewijskracht van de gegevens die zij
      onderling uitwisselen en de op basis daarvan op te maken documenten. De regeling kan ook betrekking hebben op alle
      door de desbetreffende afzender aan te bieden en door de spoorweg te vervoeren zendingen.


      § 4 Bij gebreke van een regeling, als bedoeld in § 3, kunnen de gegevens van de afzender betreffende de afmetingen,
      het gewicht of, indien de zending door de afzender wordt geladen, het aantal stuks niet als bewijs tegen de
      spoorweg dienen, tenzij de spoorweg de afmetingen, het gewicht of het aantal stuks heeft gecontroleerd en daarvan
      mededeling aan de afzender heeft gedaan.
