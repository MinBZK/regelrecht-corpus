        bwb_id: BWBR0001848
        artikel: '31'
  - number: '60'
    text: >-
      § 1 De kosten (vracht, bijkomende kosten, douanerechten en voorts de kosten, die ontstaan vanaf de aanneming ten
      vervoer tot aan de aflevering alsmede de kosten van een eventueel verder middel van vervoer) worden overeenkomstig
      de navolgende bepalingen door de afzender of door de geadresseerde betaald.


      § 2 In de tarieven kan worden bepaald, dat de kosten voor zendingen aangeboden met een adreskaart steeds ten laste
      van de afzender komen.


      § 3 De afzender moet, met inachtneming van het daaromtrent in de tarieven bepaalde, in de desbetreffende rubriek
      van de vrachtbrief vermelden, welke kosten hij voor zijn rekening neemt.


      § 4 Kosten, die de afzender niet voor zijn rekening heeft genomen, worden geacht ten laste van de geadresseerde te
      zijn gebracht. De kosten komen echter steeds ten laste van de afzender, indien de geadresseerde de vrachtbrief niet
      in ontvangst heeft genomen noch zijn rechten overeenkomstig artikel 68, § 2, heeft doen gelden.


      § 5 Bijkomende kosten, zoals staangeld, magazijngeld en weegloon, waarvan de heffing het gevolg is van een aan de
      geadresseerde toe te schrijven feit of van een door hem gedaan verzoek, moeten steeds door hem worden betaald.


      § 6 1. Voor wagenladingen met binnenlandse vrachtbrief geschiedt de betaling van de kosten, met uitsluiting van de
      in de tarieven te vermelden kosten, op grond van een door de spoorweg periodiek op te maken afrekeningsstaat, die
      de kosten per wagenlading vermeldt.


      2. De spoorweg kan van hem, die de kosten verschuldigd is, bij wijze van waarborgsom tegen ontvangstbewijs de
      storting vorderen van een bedrag, dat de kosten bij benadering dekt. Zodra het juiste bedrag van de verschuldigde
      kosten bekend is, vindt de eindafrekening plaats.


      § 7 1. De spoorweg kan bij andere dan in § 6, lid 1, bedoelde zendingen van de afzender de vooruitbetaling van
      de kosten eisen, wanneer het goederen betreft, die naar zijn oordeel aan spoedig bederf onderhevig zijn of die op
      grond van hun geringe waarde of hun aard hem geen voldoende waarborg voor de kosten bieden.


      2. Indien het bedrag van de kosten, die de afzender voor zijn rekening neemt, op het tijdstip van de aanbieding ten
      vervoer niet nauwkeurig kan worden vastgesteld, kan de spoorweg bij wijze van waarborgsom tegen ontvangstbewijs de
      storting vorderen van een bedrag, dat de kosten bij benadering dekt. Zodra op het station van afzending het juiste
      bedrag van de verschuldigde kosten bekend is, vindt de eindafrekening plaats.


      § 8 De spoorweg moet zowel op het voor de afzender als op het voor de geadresseerde bestemde deel van de
      vrachtbrief de bedragen specificeren, welke de afzender voor zijn rekening neemt, behoudens in de gevallen,
      bedoeld in § 7, lid 2, artikel 59, § 4, lid 2, en in het geval van vermelding van deze bedragen op een periodieke
      afrekeningsstaat.
