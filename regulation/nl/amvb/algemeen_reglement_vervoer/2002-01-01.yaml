  - number: '61'
    text: >-
      § 1 Bij onjuiste toepassing van een tarief of bij onjuiste vaststelling of inning van de kosten, moet het te veel
      betaalde of het te weinig gevorderde worden vereffend.


      § 2 Te veel geïnde bedragen, die door de spoorweg worden vastgesteld, moeten ambtshalve ter kennis van de
      rechthebbende worden gebracht, indien zij € 0.45 per vrachtbrief te boven gaan; de vereffening moet zo spoedig
      mogelijk geschieden.


      § 3 Indien de vrachtbrief niet in ontvangst is genomen, is de afzender verplicht de ten onrechte niet geïnde
      bedragen aan de spoorweg te betalen. Wanneer de vrachtbrief door de geadresseerde in ontvangst is genomen, is de
      afzender slechts gehouden tot betaling van een ten onrechte niet geïnd bedrag, voorzover dit betrekking heeft op
      kosten, die hij voor zijn rekening heeft genomen; het restant van het ten onrechte niet geïnde bedrag komt ten
      laste van de geadresseerde.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel61
  - number: '62'
    text: >-
      § 1 1. Onverminderd de verplichting tot betaling van het verschil in vracht en van een vergoeding voor eventuele
      schade, kan de spoorweg boeten heffen in de gevallen en onder de voorwaarden die hierna zijn bepaald:


      a.


      b.


      c. bij een aanduiding, die op een onjuiste, onnauwkeurige of onvolledige wijze de aard van een zending omschrijft,
      of in het algemeen bij een aanduiding, die op een of andere manier de zending onder een lager tarief zou kunnen
      doen vallen dan het feitelijk van toepassing zijnde tarief, het dubbele van het verschil tussen de vracht, die
      had moeten worden geïnd van het station van afzending tot het station van bestemming indien de aanduiding juist,
      nauwkeurig en volledig was geweest en de vracht, die is berekend op grond van de door de afzender op de vrachtbrief
      vermelde aanduiding. Indien een zending is samengesteld uit goederen, die volgens verschillende prijzen worden
      bevracht en het gewicht van elke goederensoort zonder bezwaar kan worden vastgesteld, wordt de boete berekend
      volgens de vrachtprijs, die voor elke goederensoort afzonderlijk geldt, indien deze wijze van vrachtberekening een
      lagere boete oplevert;


      d. bij aangifte van een lager gewicht, een geringer aantal stuks, of kleinere afmetingen per collo dan werkelijk
      het geval is, het dubbele van het verschil tussen de vracht die verschuldigd zou zijn indien het gewicht, de
      afmetingen of het aantal stuks juist zouden zijn aangegeven en die, welke op grond van de vermelde aanduidingen
      verschuldigd is, berekend van het station van afzending tot het station van bestemming. Het bepaalde onder *c*,
      tweede volzin, is op overeenkomstige wijze van toepassing;


      e. bij overbelasting van een door de afzender beladen wagen € 4,54 voor elke 100 kg, waarmede de toelaatbare
      belading is overschreden.


      2. De in deze paragraaf bedoelde boeten kunnen naast elkaar geheven worden. Indien echter gelijktijdig zowel op
      grond van het in § 1, lid 1, onder *c*, als van het onder *d*, bepaalde boete geheven kan worden, bedraagt de boete
      het dubbele van het verschil tussen de vracht, die verschuldigd zou zijn, indien het gewicht, de afmetingen of het
      aantal stuks juist aangegeven zou zijn en die, welke op grond van de vermelde aanduidingen verschuldigd is.


      § 2 De op grond van § 1 opgelegde boeten komen ten laste van de zending, onverschillig de plaats, waar de
      bezwarende feiten zijn vastgesteld.


      § 3 Het bedrag van de boeten en de aanleiding tot de boeteheffing moeten op de vrachtbrief worden vermeld.


      § 4 De boete kan niet geheven worden:


      a. bij opgave van te gering gewicht, aantal stuks of te kleine afmetingen, indien de afzender op de vrachtbrief de
      spoorweg heeft verzocht deze gegevens vast te stellen;


      b. bij overbelasting van een wagen, indien de afzender op de vrachtbrief weging door de spoorweg heeft verzocht;


      c. bij een tijdens het vervoer door weersinvloeden veroorzaakte overbelasting, indien wordt bewezen, dat de lading
      van de wagen de toelaatbare belading niet overschreed ten tijde van de aanbieding ten vervoer op het station van
      afzending;


      d. bij toeneming van het gewicht tijdens het vervoer, zonder dat er sprake is van overbelasting, indien wordt
      bewezen, dat deze toeneming is te wijten aan weersinvloeden;


      e. bij onnauwkeurige aangifte van het gewicht zonder dat er sprake is van overbelasting, indien het verschil tussen
      het op de vrachtbrief aangegeven gewicht en het vastgestelde gewicht niet meer bedraagt dan 3% van het aangegeven
      gewicht;


      f. bij overbelasting van een wagen, wanneer de spoorweg de toelaatbare belading niet heeft bekend gemaakt en niet
      op zodanige wijze aan de afzender heeft opgegeven dat deze haar in acht kan nemen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel62
  - number: '63'
    text: >-
      § 1 In de tarieven wordt bepaald onder welke voorwaarden voorschotten worden toegelaten.


      § 2 Voor voorschotten is een in de tarieven vast te stellen vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel63
  - number: '64'
    text: >-
      § 1 1. De afzender is verplicht bij de vrachtbrief de bescheiden te voegen, die nodig zijn voor de vervulling, vóór
      de aflevering van de zending aan de geadresseerde, van de krachtens douane- of andere wettelijke dan wel ambtelijke
      voorschriften vereiste formaliteiten.


      2. Indien deze bescheiden niet bij de vrachtbrief kunnen worden gevoegd, moet de afzender deze tijdig doen toekomen
      aan het kantoor van het station, van de douane of van andere instanties, waar de formaliteiten moeten worden
      vervuld; de vrachtbrief moet het kantoor vermelden, waar deze bescheiden ter beschikking van de spoorweg worden
      gehouden.


      § 2 1. De spoorweg is niet verplicht te onderzoeken of de bijgevoegde bescheiden volledig en juist zijn.


      2. De afzender is tegenover de spoorweg aansprakelijk voor elke schade, die uit het ontbreken, de onvolledigheid of
      de onjuistheid van die bescheiden zou kunnen voortvloeien, tenzij deze te wijten is aan schuld van de spoorweg.


      3. Ontstaat door een oorzaak, als in lid 2 vermeld, buiten schuld van de spoorweg een oponthoud in het vervoer,
      dan heeft de spoorweg het recht voor de gehele duur van het oponthoud het in de tarieven vast te stellen lig-,
      magazijn- of staangeld te heffen.


      4. Artikel 49, § 4, is van overeenkomstige toepassing.


      § 3 De spoorweg is in geval van schuld aansprakelijk voor de gevolgen van het verlies of het niet of onjuist
      gebruiken van de op de vrachtbrief vermelde bescheiden, die bij dat document zijn gevoegd of aan hem zijn
      toevertrouwd; de door hem te betalen schadevergoeding kan evenwel nimmer hoger zijn dan die, welke bij verlies van
      het goed verschuldigd zou zijn.


      § 4 De afzender is verplicht de douanevoorschriften betreffende de verpakking en de bescherming met dekkleden
      van de goederen na te leven. De spoorweg kan zendingen, waarvan de douaneversluiting beschadigd of gebrekkig is,
      weigeren. Indien de afzender de goederen niet overeenkomstig de douanevoorschriften heeft verpakt of met dekkleden
      beschermd, heeft de spoorweg het recht hierin te voorzien. De kosten komen ten laste van de zending.


      § 5 1. Onderweg worden de krachtens douane- of andere wettelijke dan wel ambtelijke voorschriften vereiste
      formaliteiten behoudens in het geval, bedoeld in lid 2, door de spoorweg vervuld. Het staat de spoorweg vrij deze
      taak onder eigen verantwoordelijkheid aan een gemachtigde toe te vertrouwen of zichzelf daarmede te belasten. In
      beide gevallen neemt de spoorweg de verplichtingen van een expediteur op zich.


      2. De geadresseerde of diens gemachtigde mogen onder in de tarieven te bepalen voorwaarden de hiervoren bedoelde
      formaliteiten zelf vervullen op een binnenlandse douanelosplaats, indien het station van bestemming ressorteert
      onder deze binnenlandse douanelosplaats. Noch de geadresseerde, noch diens gemachtigde zijn gerechtigd het goed in
      bezit te nemen.


      3. Voorts kan de afzender door een vermelding op de vrachtbrief verzoeken zelf de in lid 1 bedoelde handelingen bij
      te wonen of zich daarbij te doen vertegenwoordigen door een gemachtigde, teneinde alle inlichtingen te verstrekken
      en ter zake dienende opmerkingen te maken, zonder dat hij hieraan het recht kan ontlenen het goed in bezit te nemen
      of de formaliteiten zelf te vervullen.


      § 6 1. De geadresseerde heeft het recht op het station van bestemming, waar een douanekantoor is gevestigd,
      de douaneformaliteiten zelf te vervullen of door een gemachtigde te doen vervullen, indien de vrachtbrief de
      vrijmaking bij aankomst voorschrijft of indien bij ontbreken van dit voorschrift het goed onder douaneversluiting
      aankomt. Indien hij van dit recht gebruik maakt, moet hij vooraf zijn uit artikel 68, § 1, lid 1, voortvloeiende
      verplichtingen nakomen.


      2. Indien de geadresseerde zich niet binnen een in de tarieven te bepalen termijn meldt tot het in ontvangst nemen
      van de vrachtbrief, wordt de zending als geweigerd beschouwd en wordt overeenkomstig het bepaalde in artikel 73
      gehandeld. Indien overeenkomstig het bepaalde in artikel 73, § 2, lid 2, de spoorweg tot verkoop van de goederen
      overgaat, kan de spoorweg handelen zoals in § 5, lid 1, is aangegeven.


      3. De geadresseerde, aan wie de vrachtbrief ter hand is gesteld, is indien hij de in dit artikel bedoelde
      formaliteit niet of niet naar behoren vervult, aansprakelijk voor alle schade, welke de spoorweg uit dien hoofde
      mocht lijden.


      4. De geadresseerde mag de goederen niet uit de wagens lossen, noch van het terrein of uit de magazijnen van
      de spoorweg afvoeren, voordat de belastingbescheiden zijn aangezuiverd en aan alle krachtens douane- of andere
      wettelijke dan wel ambtelijke voorschriften nodige formaliteiten is voldaan. De geadresseerde is aansprakelijk voor
      de schade, die uit de niet-nakoming van deze bepaling voor de spoorweg mocht ontstaan.


      § 7 1. Onverminderd het bepaalde in § 2, is de geadresseerde, indien hij ter aanvulling van door de afzender bij de
      vrachtbrief gevoegde, doch onvolledig of onjuist gebleken bescheiden nadere gegevens verstrekt, waarvan de spoorweg
      gebruik moet maken ter vervulling van de formaliteiten, waarvan in dit artikel sprake is, aansprakelijk voor alle
      schade, welke de spoorweg mocht lijden tengevolge van de onvolledigheid of onjuistheid van de door de geadresseerde
      verstrekte gegevens.


      2. De spoorweg is niet verplicht de zending af te leveren voordat het bedrag van de schade of een naar zijn oordeel
      voldoende waarborgsom betaald is.


      § 8 1. Het verrichten van de in dit artikel bedoelde formaliteiten door of vanwege de spoorweg geschiedt tegen een
      daarvoor in de tarieven vast te stellen vergoeding.


      2. De spoorweg kan voor de door hem aan de douane en andere overheidsinstanties betaalde bedragen een in de
      tarieven vast te stellen provisie in rekening brengen.


      3. Indien het verrichten van de bedoelde formaliteiten buiten schuld van de spoorweg langer oponthoud veroorzaakt
      dan daarvoor in de tarieven is toegestaan, kan voor de langere duur van het oponthoud het in de tarieven vast te
      stellen lig-, magazijn- of staangeld in rekening worden gebracht.


      § 9 De spoorweg is niet verplicht goederen, welke anders dan per spoorweg zijn aangevoerd onder douaneversluiting,
      ten doorvoer naar andere landen of ter vrijmaking naar een binnenlandse douanelosplaats te vervoeren.


      § 10 De geadresseerde is tegenover de spoorweg aansprakelijk voor de vervulling van de krachtens douane- of andere
      wettelijke dan wel ambtelijke voorschriften vereiste formaliteiten, welke na de aflevering van de goederen elders
      vervuld moeten worden. De bij de vrachtbrief behorende bescheiden worden de geadresseerde tegen bijzondere kwijting
      afgegeven. De spoorweg is bevoegd bij de aflevering van de zending ter dekking van zijn risico een naar zijn
      oordeel voldoende waarborgsom te vorderen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel64
  - number: '65'
    text: >-
      § 1 1. De afzender heeft het recht de vervoersovereenkomst te wijzigen door het geven van een nadere aanwijzing,
      inhoudende:


      a. dat de zending aan een andere dan de op de vrachtbrief aangeduide geadresseerde wordt afgeleverd;


      b. dat de zending op een ander dan het op de vrachtbrief aangeduide station van bestemming wordt afgeleverd of naar
      het station van afzending wordt teruggezonden.


      2. In de tarieven kunnen ook andere dan de in lid 1 genoemde nadere aanwijzingen worden toegelaten.


      3. De nadere aanwijzingen mogen nimmer splitsing van de zending ten gevolge hebben.


      § 2 De afzender is verplicht de nadere aanwijzingen te geven aan het station van afzending door middel van een
      schriftelijke verklaring overeenkomstig het in de tarieven vast te stellen model.


      § 3 1. De spoorweg mag de uitvoering van de in § 1 genoemde nadere aanwijzingen, welke op de in § 2 voorgeschreven
      wijze zijn gegeven, niet weigeren of uitstellen, tenzij:


      a. de uitvoering niet meer mogelijk is op het tijdstip, waarop de nadere aanwijzingen het station, dat deze moet
      uitvoeren, bereiken;


      b. de uitvoering van dien aard is, dat daardoor de regelmatige dienstuitvoering zou worden verstoord;


      c. de uitvoering in strijd is met de douane- of andere wettelijke dan wel ambtelijke voorschriften; of


      d. in het geval van wijzigingen van het station van bestemming, de waarde van de zending het totaal van de kosten
      tot het nieuwe station van bestemming naar alle waarschijnlijkheid niet dekt of de zending bestaat uit licht
      bederfelijke goederen, tenzij het bedrag van deze kosten onmiddellijk wordt betaald of hiervoor een waarborgsom
      wordt gestort.


      2. In de in lid 1 genoemde gevallen moet de afzender zo spoedig mogelijk in kennis worden gesteld van de
      belemmeringen, die de uitvoering van zijn nadere aanwijzing verhinderen. Indien het station van afzending deze
      belemmeringen niet kon voorzien, komen alle gevolgen, die voortvloeien uit het begin van uitvoering van de nadere
      aanwijzing, voor rekening van de afzender.


      § 4 In de tarieven wordt bepaald, op welke wijze in de gevallen, bedoeld in § 1, de vracht wordt berekend.


      § 5 De kosten, voortvloeiende uit de uitvoering van een nadere aanwijzing, komen ten laste van de zending, tenzij
      deze nadere aanwijzing het gevolg is van omstandigheden die aan de schuld van de spoorweg zijn te wijten.


      § 6 Het recht van de afzender tot wijziging van de vervoerovereenkomst vervalt, zodra na aankomst van de zending op
      het station van bestemming:


      a. bij zendingen, welke worden besteld, deze het station hebben verlaten, tenzij de zending door de geadresseerde
      niet in ontvangst wordt genomen;


      b. bij zendingen, welke niet worden besteld, de vrachtbrief of de zending aan de geadresseerde is ter hand gesteld;


      c. de geadresseerde overeenkomstig artikel 68, § 2, zijn uit de vervoerovereenkomst voortvloeiende rechten heeft
      doen gelden.


      § 7 Onder voorbehoud van het bepaalde in § 3 is de spoorweg, in geval van schuld zijnerzijds, aansprakelijk
      voor de gevolgen van het niet of onjuist uitvoeren van een krachtens dit artikel gegeven nadere aanwijzing. De
      schadevergoeding, die de spoorweg moet betalen kan evenwel nooit hoger zijn dan die, welke verschuldigd zou zijn in
      geval van verlies van het goed.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel65
  - number: '66'
    text: >-
      § 1 Bij belemmering in het vervoer beslist de spoorweg of het in het belang van de afzender is, deze instructies
      te vragen dan wel of het de voorkeur verdient de zending zonder meer langs een andere dan de daarvoor normaal in
      aanmerking komende weg te vervoeren.


      § 2 Indien er geen andere weg is of indien om andere redenen het vervoer niet mogelijk is, vraagt de spoorweg
      instructies aan de afzender, tenzij de spoorweg, indien te voorzien is dat de belemmering van korte duur zal zijn,
      het in het belang van de afzender acht de opheffing van de belemmering af te wachten.


      § 3 De afzender mag op de vrachtbrief instructies geven voor het geval zich een belemmering in het vervoer zou
      voordoen. Indien naar het oordeel van de spoorweg die instructies niet kunnen worden uitgevoerd, vraagt de spoorweg
      nieuwe instructies aan de afzender.


      § 4 De van een belemmering in het vervoer in kennis gestelde afzender dient zijn instructies te geven aan het
      station dat hem daarom vroeg.


      § 5 Indien de bedoelde instructies een wijziging van de vervoerovereenkomst inhouden, zijn daarop de beperkingen
      van artikel 65, § 1, en de voorschriften van artikel 65, § 2 , niet van toepassing.


      § 6 1. Indien de van een belemmering in het vervoer in kennis gestelde afzender niet binnen een in de tarieven
      vast te stellen termijn van ten minste vierentwintig uren uitvoerbare instructies geeft, kan worden gehandeld
      overeenkomstig het bepaalde in artikel 73, § 2.


      2. De spoorweg is gerechtigd het in de tarieven vast te stellen lig-, magazijn- of staangeld in rekening te brengen
      van het ogenblik af, waarop de in het vorige lid bedoelde termijn is verstreken.


      § 7 Indien de belemmering in het vervoer ophoudt te bestaan vóór aankomst van de instructies van de afzender, wordt
      de zending naar het station van bestemming doorgezonden zonder dat deze instructies worden afgewacht. De afzender
      wordt hiervan zo spoedig mogelijk in kennis gesteld.


      § 8 Indien ten gevolge van beslag of een maatregel van douane of andere overheidsinstanties met betrekking tot
      het goed de spoorweg belet wordt dit te vervoeren, is deze bevoegd het in de tarieven te bepalen lig-, magazijn-
      of staangeld ten laste van de zending te brengen. Indien het goed moet worden vernietigd of niet weer wordt
      vrijgegeven ten gevolge van de in deze paragraaf genoemde maatregelen, is de afzender verplicht de spoorweg de nog
      niet betaalde vracht over het reeds afgelegde trajekt en de overige kosten alsnog te voldoen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel66
  - number: '67'
    text: >-
      De leveringstermijnen worden door de afzender en de spoorweg tezamen bepaald. In de tarieven kunnen aanvullende
      regelingen omtrent de leveringstermijnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel67
  - number: '68'
    text: >-
      § 1 1. De spoorweg is verplicht de vrachtbrief en de zending op het station van bestemming aan de geadresseerde
      tegen kwijting en tegen betaling van de te zijnen laste gebrachte vorderingen met uitzondering van die, welke
      op een periodieke afrekeningsstaat worden vermeld, af te geven na hem desverlangd in staat gesteld te hebben de
      vrachtbrief en de uitwendige staat van de goederen behoorlijk na te zien. De inontvangstneming van de vrachtbrief
      of de zending brengt voor de geadresseerde de verplichting mede de te zijnen laste gebrachte vorderingen aan de
      spoorweg te betalen.


      2. Met de aflevering van de zending aan de geadresseerde worden gelijkgesteld de overgave hiervan, overeenkomstig
      de geldende voorschriften, aan de douane of andere overheidsinstanties in hun expeditielokalen of in hun entrepots,
      wanneer deze zich niet onder bewaking van de spoorweg bevinden, alsmede de inbewaargeving bij de spoorweg of de
      opslag bij een expediteur of in een openbaar entrepot.


      3. Voorts worden met de aflevering van de zending aan de geadresseerde gelijkgesteld:


      a. de overgave aan een derde overeenkomstig het bepaalde in artikel 73, § 2;


      b. de overgave op het station van bestemming aan een ander middel van vervoer of aan een expediteur ten verder
      vervoer naar een niet aan de spoorlijn gelegen plaats of, uitsluitend bij stukgoederen, naar een buiten de
      bestelkring van het station van bestemming gelegen plaats. Deze overgave vindt ambtshalve plaats, indien op de
      vrachtbrief van een stukgoedzending als woonplaats van de geadresseerde zulk een plaats is aangegeven, tenzij
      de afzender op de vrachtbrief of de geadresseerde tijdig vóór aankomst op het station van bestemming omtrent de
      doorzending enig voorschrift heeft gegeven.


      § 2 Na aankomst van de zending op het station van bestemming heeft de geadresseerde het recht de spoorweg te
      verzoeken hem de vrachtbrief ter hand te stellen en hem de zending af te leveren. Indien het verlies van goederen
      is vastgesteld of indien goederen niet voor afloop van de in artikel 77, § 1, genoemde termijn zijn aangekomen,
      kan de geadresseerde op eigen naam de uit de vervoerovereenkomst voortvloeiende rechten tegenover de spoorweg doen
      gelden.


      § 3 1. In de tarieven wordt bepaald of de goederen door de spoorweg of door de geadresseerde moeten worden gelost,
      tenzij dit reglement hieromtrent voorschriften bevat of tussen de spoorweg en de geadresseerde een bijzondere
      overeenkomst is gesloten.


      2. Indien de geadresseerde lost, is hij aansprakelijk voor alle schade, welke bij het lossen wordt veroorzaakt,
      tenzij bewezen wordt, dat de schade is ontstaan door de schuld van de spoorweg. De spoorweg is voorts gerechtigd
      de verdere lossing en afvoering van de goederen te beletten, totdat de schade is vergoed of een naar zijn oordeel
      voldoende waarborgsom is gestort.


      § 4 De rechthebbende kan de aanneming van de zending weigeren, zelfs na inontvangstneming van de vrachtbrief en
      betaling van de kosten, zolang niet is overgegaan tot het in artikel 88 bedoelde onderzoek terzake van een beweerde
      beschadiging.


      § 5 De spoorweg kan verlangen, dat wagens, welke door de geadresseerde worden gelost, hem na lossing behoorlijk
      gereinigd worden teruggegeven. Wordt aan dit verlangen niet voldaan, dan kan de spoorweg voor het reinigen een in
      de tarieven te bepalen bedrag in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68
  - number: 68a
    text: >-
      Indien de zending zonder een vrachtbrief ten vervoer is aangeboden, als bedoeld in artikel 56, § 12, is op de
      aflevering van deze zending artikel 68 van overeenkomstige toepassing met dien verstande dat in plaats van een
      vrachtbrief de spoorweg aan de geadresseerde op een andere wijze gegevens omtrent de zending afgeeft.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel68a
  - number: '69'
    text: >-
      § 1 1. De aangekomen zendingen stukgoederen, die door de spoorweg worden gelost, worden in de plaatsen vermeld in
      de tarieven aan het opgegeven adres besteld binnen de door de spoorweg daarvoor vastgestelde kring.


      2. In de tarieven wordt bepaald welke goederen van bestelling zijn uitgesloten.


      3. Het adres, waar de goederen besteld moeten worden, moet langs harde rijwegen met de vervoermiddelen van de
      besteldienst bereikbaar zijn. De goederen behoeven niet verder te worden gebracht dan gelijkvloers tot de aan de
      harde weg gelegen woon- of bedrijfsruimte van de geadresseerde, die desverlangd bij het lossen hulp moet verlenen.


      4. De spoorweg kan voor het bestellen een in de tarieven te bepalen bedrag in rekening brengen.


      5. Voor het terugbrengen naar het station van goederen, die, om welke reden ook, niet afgeleverd kunnen worden,
      alsmede voor het geval, dat de hier bedoelde goederen opnieuw moeten worden besteld, kan een in de tarieven te
      bepalen bedrag in rekening worden gebracht, dat ten hoogste gelijk mag zijn aan het voor het afhalen verschuldigde
      bedrag.


      § 2 In de tarieven kan worden bepaald of en onder welke voorwaarden ook andere dan de in § 1, lid 1, bedoelde
      goederen worden besteld.


      § 3 1. De bestelling blijft achterwege, indien:


      a. de afzender op de vrachtbrief het voorschrift "station restante" of een ander voorschrift van gelijke strekking
      heeft gegeven;


      b. de geadresseerde tijdig vóór de aankomst van de zending aan het station van bestemming schriftelijk heeft
      kennisgegeven, dat hij de goederen zelf wenst af te voeren of door derden te doen afvoeren. In dit geval moet
      niettemin tot bestelling worden overgegaan, indien de afzender hieromtrent op de vrachtbrief een uitdrukkelijk
      voorschrift heeft gegeven;


      c. de zending met een adreskaart ten vervoer is aangeboden.


      2. Het recht van de afzender om "station restante" voor te schrijven, alsmede het recht van de geadresseerde om de
      goederen zelf af te voeren of door derden te doen afvoeren kunnen:


      a. in de tarieven blijvend worden beperkt of opgeheven;


      b. indien gevaar bestaat, dat de regelmatige afwikkeling van het verkeer door ophoping van goederen, hetzij op het
      gehele net of een gedeelte daarvan dan wel op bepaalde stations wordt verstoord, door de spoorweg tijdelijk worden
      beperkt of opgeheven. De spoorweg brengt deze maatregelen onverwijld ter kennis van het publiek. Zij treden niet in
      werking, voordat zij ter kennis van het publiek zijn gebracht.


      § 4 In buitengewone omstandigheden, zoals bemoeilijking van de besteldienst door sneeuw of ijzel, is de spoorweg
      bevoegd:


      a. voor het bestellen en voor het in § 1, lid 5, bedoelde terugbrengen of opnieuw bestellen een in de tarieven
      te bepalen bedrag in rekening te brengen, dat ten hoogste gelijk mag zijn aan het voor het afhalen verschuldigde
      bedrag;


      b. de besteldienst geheel of gedeeltelijk te staken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel69
  - number: '70'
    text: >-
      § 1 Van de aankomst van zendingen, welke niet worden besteld, wordt de geadresseerde kennisgegeven, behalve wanneer
      deze tijdig schriftelijk heeft verzocht zulks na te laten.


      § 2 In de tarieven wordt bepaald:


      a. op welke wijze de vorenbedoelde kennisgeving geschiedt en in hoeverre daarvoor kosten in rekening worden
      gebracht;


      b. op welk ogenblik een per post verzonden kennisgeving moet worden gerekend in het bezit van de geadresseerde te
      zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel70
  - number: '71'
    text: >-
      In de tarieven wordt bepaald of en onder welke voorwaarden de spoorweg verplicht is op verzoek van de geadresseerde
      op het station van bestemming het gewicht van het goed, het aantal colli of stuks, de afmetingen van elk collo of
      het eigengewicht van de wagen vast te stellen. De bepalingen van artikel 57, § 3, tweede volzin, § 4, en § 5, zijn
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel71
  - number: '72'
    text: >-
      § 1 Het lossen van wagens en het afvoeren van goederen door de geadresseerde moeten geschieden gedurende de door de
      spoorweg vastgestelde uren, welke op aanvraag worden medegedeeld.


      § 2 De termijnen, binnen welke door de spoorweg geloste goederen moeten zijn afgevoerd, en die, binnen welke door
      de geadresseerde te lossen goederen moeten zijn gelost en afgevoerd, worden in de tarieven bepaald.


      § 3 Indien de door de spoorweg geloste goederen buiten schuld van de spoorweg niet binnen de gestelde termijn
      zijn afgevoerd, wordt van het ogenblik af, waarop die termijn is afgelopen, het in de tarieven te bepalen lig- of
      magazijngeld geheven.


      § 4 1. Indien de door de geadresseerde te lossen goederen buiten schuld van de spoorweg niet binnen de gestelde
      termijn zijn gelost en afgevoerd, wordt van het ogenblik af, waarop die termijn is afgelopen, het in de tarieven te
      bepalen lig-, magazijn- of staangeld geheven.


      2. Indien de lostermijn met meer dan vierentwintig uren is overschreden, is de spoorweg bevoegd de wagens op kosten
      en voor risico van de rechthebbende te lossen, waarvoor een in de tarieven te bepalen vergoeding in rekening kan
      worden gebracht. Verder is de spoorweg bevoegd met de goederen te handelen als in artikel 73, § 2, is bepaald en
      voor de tijd, gedurende welke de goederen bij de spoorweg verblijven, het in de tarieven te bepalen lig-, magazijn-
      of staangeld in rekening te brengen.


      § 5 Meldt de geadresseerde, aan wie van de aankomst kennis werd gegeven, zich aan om de goederen in ontvangst
      te nemen en kan hieraan door schuld van de spoorweg niet binnen een uur, nadat hij zich heeft aangemeld, worden
      voldaan, dan is de spoorweg verplicht hem de kosten te vergoeden, welke uit de vergeefse poging om de goederen in
      ontvangst te nemen voor hem zijn ontstaan.


      § 6 1. Indien gevaar bestaat, dat de regelmatige afwikkeling van het verkeer door ophoping van goederen, hetzij
      op het gehele net of een gedeelte daarvan dan wel op bepaalde stations, wordt verstoord, is de spoorweg bevoegd de
      tijd, welke van het berekenen van lig- of magazijngeld is vrijgesteld en de lostermijn te verkorten, alsmede het
      lig-, magazijn- of staangeld te verhogen.


      2. De verkorting van de tijd, welke van het berekenen van lig- of magazijngeld is vrijgesteld, en van de
      lostermijn, alsmede de verhoging van het lig-, magazijn- of staangeld geschiedt met inachtneming van het in artikel
      115 bepaalde.


      3. De spoorweg brengt deze maatregelen onverwijld ter kennis van het publiek. Zij treden niet in werking voordat ze
      ter kennis van het publiek zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel72
  - number: '73'
    text: >-
      § 1 1. Heeft de geadresseerde niet zijn rechten doen gelden overeenkomstig het bepaalde in artikel 68, § 2, is
      hij niet te vinden, weigert hij de vrachtbrief en de zending in ontvangst te nemen, verzuimt hij zich binnen de
      termijn, die vrijgesteld is van het berekenen van lig-, magazijn- of staangeld, tot het inontvangstnemen van de
      vrachtbrief en de zending aan te melden, of is de regelmatige aflevering om enige andere reden verhinderd, dan
      liggen de goederen, gelost of niet gelost, voor rekening en risico van de afzender.


      2. Het station van bestemming moet de afzender onverwijld van de stand van zaken kennisgeven en hem daarbij om
      instructies vragen. Deze kennisgeving geschiedt rechtstreeks of door tussenkomst van het station van afzending, ter
      beoordeling van de spoorweg. De spoorweg is verplicht tot rechtstreekse kennisgeving, indien de afzender dit op de
      vrachtbrief heeft verzocht.


      3. De spoorweg mag, behalve ten gevolge van de belemmering in de aflevering ontstane kosten (vracht, lig-,
      magazijn- of staangeld, porti, telegramkosten, enz.), voor de kennisgeving van niet-aflevering en de uitvoering van
      de instructies een in de tarieven te bepalen bedrag in rekening brengen.


      4. Indien de belemmering in de aflevering is opgeheven en de geadresseerde bereid is de zending alsnog in ontvangst
      te nemen, wordt deze hem afgeleverd, tenzij het station van bestemming intussen tegengestelde instructies van de
      afzender heeft ontvangen. Van deze aflevering moet de afzender onmiddellijk kennis worden gegeven; de eventuele
      kosten hiervan komen ten laste van de zending.


      5. De afzender kan op de vrachtbrief verzoeken hem de zending ambtshalve terug te zenden, indien zich een
      belemmering in de aflevering voordoet. Behalve in dit geval mag de zending de afzender niet zonder zijn
      uitdrukkelijke toestemming worden teruggezonden.


      6. De van een belemmering in de aflevering in kennis gestelde afzender dient zijn instructies te geven aan het
      station, waarvan hij de kennisgeving ontving. Voor deze instructies geldt het bepaalde in artikel 65, § 1, lid 3,
      en in artikel 65, § 3.


      § 2 1. Is het door bijzondere omstandigheden niet mogelijk de afzender te verwittigen, verzuimt deze tijdig
      instructies te geven, of zijn de door hem gegeven instructies niet uitvoerbaar, dan is de spoorweg bevoegd de
      goederen in bewaring te geven aan een derde, die op de bewaarneming van de goederen is ingericht. Deze bewaargeving
      geschiedt tegen onmiddellijke betaling van de op de zending drukkende vorderingen, in naam van de afzender, die
      hierdoor evenzeer verbonden zal zijn, als had hij tot de bewaargeving last gegeven. Van een gedane bewaargeving
      wordt de afzender zo spoedig mogelijk kennis gegeven. De eventuele kosten van deze kennisgeving komen ten laste van
      de zending.


      2. De spoorweg is verder bevoegd de goederen zonder enige formaliteit op de best mogelijke wijze te verkopen, met
      dien verstande dat:


      a. goederen, welke naar zijn oordeel wegens hun licht bederfelijke aard, hun geringe waarde of om andere redenen
      niet geschikt zijn om in bewaring te worden genomen of gegeven, te allen tijde mogen worden verkocht;


      b. andere goederen niet eerder mogen worden verkocht dan twintig dagen na afloop van de tijd, die vrijgesteld is
      van het berekenen van lig-, magazijn- of staangeld; zou echter de waarde der goederen door een bewaring gedurende
      twintig dagen onevenredig verminderen of zouden de kosten van bewaring niet in een redelijke verhouding staan tot
      de waarde van de goederen, dan mag de verkoop zoveel eerder plaatshebben als de spoorweg nodig oordeelt.


      3. De afzender moet, zo mogelijk, van de op handen zijnde verkoop verwittigd worden. Indien de spoorweg zelf de
      verkoop op zich neemt, mag daarvoor, behalve de gemaakte kosten, een in de tarieven te bepalen bedrag in rekening
      worden gebracht.


      4. Aan de afzender moet na de verkoop hiervan bericht worden gezonden, zo mogelijk onverwijld. De opbrengst van de
      verkoop wordt, na aftrek van de vracht en van alle zowel op de goederen drukkende als op de bewaring en de verkoop
      gevallen kosten, ter beschikking van de afzender gesteld; is de opbrengst echter lager dan de vracht en de kosten,
      dan is de afzender verplicht het verschil aan de spoorweg te betalen.


      § 3 1. Heeft de geadresseerde de hem aangeboden vrachtbrief aangenomen of overeenkomstig het bepaalde in artikel
      68, § 2, zijn uit de vervoerovereenkomst voortvloeiende rechten doen gelden, doch is de termijn, die vrijgesteld
      is van het berekenen van lig-, magazijn- of staangeld verstreken, zonder dat de goederen zijn afgevoerd, dan liggen
      deze, gelost of ongelost, voor rekening en risico van de geadresseerde.


      2. Omtrent de bevoegdheid van de spoorweg om de goederen in bewaring te geven aan een derde en om de goederen te
      verkopen, zijn de bepalingen van § 2 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel73
  - number: '74'
    text: >-
      § 1 1. De spoorweg is aansprakelijk voor schade, welke het gevolg is van de overschrijding van de leveringstermijn,
      alsmede voor schade, welke te rekenen van de aanneming ten vervoer tot de aflevering, voortvloeit uit het geheel of
      gedeeltelijk verlies of de beschadiging van het goed.


      2. Bij afhalen van goederen door of namens de spoorweg vangt de aansprakelijkheid voor geheel of gedeeltelijk
      verlies, alsmede voor beschadiging volgens het bepaalde in lid 1 reeds aan op het ogenblik, waarop de goederen bij
      de afzender zijn afgehaald.


      § 2 De spoorweg is van deze aansprakelijkheid ontheven, indien de overschrijding van de leveringstermijn, het
      verlies of de beschadiging is veroorzaakt door schuld van de rechthebbende, een door deze gegeven opdracht, welke
      het uitvloeisel is van omstandigheden die niet aan de schuld van de spoorweg zijn te wijten, een aan het goed
      eigen gebrek (inwendig bederf, gewichtsverlies, enz.) of door omstandigheden, die de spoorweg niet kon vermijden en
      waarvan hij de gevolgen niet kon afwenden.


      § 3 De spoorweg is van deze aansprakelijkheid ontheven, indien het verlies of de beschadiging het gevolg is van de
      bijzondere gevaren, verbonden aan een of meer van de hierna genoemde feiten:


      a. vervoer, dat krachtens de geldende bepalingen of krachtens met de afzender gesloten en op de vrachtbrief
      vermelde overeenkomsten op open wagens plaatsvindt;


      b. ontbreken of gebrekkige toestand van de verpakking bij goederen, die door hun aard aan kwaliteitsverlies of
      beschadiging zijn blootgesteld, wanneer zij niet of slecht verpakt zijn;


      c. laden door de afzender of lossen door de geadresseerde krachtens de geldende bepalingen of krachtens met de
      afzender gesloten en op de vrachtbrief vermelde dan wel krachtens met de geadresseerde gesloten overeenkomsten;


      d. het laden in een wagen die een voor de afzender duidelijk waarneembaar gebrek vertoont of gebrekkige belading,
      wanneer deze door de afzender is verricht krachtens de geldende bepalingen of krachtens met de afzender gesloten en
      op de vrachtbrief vermelde overeenkomsten;


      e. vervulling van de krachtens de douane- of andere wettelijke dan wel ambtelijke voorschriften vereiste
      formaliteiten door de geadresseerde of diens gemachtigde;


      f. de aard van bepaalde goederen, die tengevolge van aan deze aard verbonden oorzaken zijn blootgesteld aan geheel
      of gedeeltelijk verlies of beschadiging, zoals door breuk, roest, vanzelfoptredend inwendig bederf, uitdroging,
      vermindering;


      g. verzending onder een onjuiste, onnauwkeurige of onvolledige benaming van goederen die van het vervoer zijn
      uitgesloten; verzending onder een onjuiste, onnauwkeurige of onvolledige benaming of niet-inachtneming door de
      afzender van de voor voorwaardelijk toegelaten goederen gestelde voorwaarden;


      h. vervoer van levende dieren;


      i. vervoer van zendingen, die krachtens de geldende bepalingen of krachtens met de afzender gesloten en op de
      vrachtbrief vermelde overeenkomsten moeten worden begeleid, voor zover het verlies of de beschadiging voortvloeit
      uit een gevaar, dat de begeleiding had moeten voorkomen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel74
  - number: '75'
    text: >-
      § 1 Het bewijs, dat de overschrijding van de leveringstermijn, het verlies of de beschadiging, door een der in
      artikel 74, § 2, genoemde feiten is veroorzaakt, rust op de spoorweg.


      § 2 Indien de spoorweg bewijst, dat gelet op de feitelijke omstandigheden het verlies of de beschadiging het gevolg
      kan zijn van een of meer van de in artikel 74, § 3, genoemde bijzondere gevaren, bestaat het vermoeden, dat het
      verlies of de beschadiging daarvan het gevolg is. De rechthebbende behoudt evenwel het recht te bewijzen, dat de
      schade niet geheel of gedeeltelijk het gevolg is van een van deze gevaren. Dit vermoeden bestaat niet in het in
      artikel 74, § 3, onder *a*, genoemde geval, indien zich een ongewoon groot tekort of verlies voordoet.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel75
  - number: '76'
    text: >-
      Wanneer een onder de bepalingen van dit reglement verzonden zending onder diezelfde bepalingen met een nieuwe
      vrachtbrief is doorgezonden en een gedeeltelijk verlies of een beschadiging na de doorzending wordt vastgesteld,
      bestaat het vermoeden, dat dit verlies of deze beschadiging is ontstaan tijdens de laatste vervoerovereenkomst,
      indien aan de volgende voorwaarden is voldaan:


      a. de zending is steeds onder toezicht van de spoorweg gebleven;


      b. de zending is met een nieuwe vrachtbrief doorgezonden in de toestand, waarin hij op het station van doorzending
      aankwam.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel76
  - number: '77'
    text: >-
      § 1 De rechthebbende kan het goed als verloren beschouwen, wanneer het niet binnen dertig dagen na het verstrijken
      van de leveringstermijn aan de geadresseerde is afgeleverd of te zijner beschikking is gesteld.


      § 2 De rechthebbende kan bij de uitbetaling van de schadevergoeding voor het verloren goed schriftelijk verzoeken
      om onmiddellijke kennisgeving, indien het goed binnen één jaar na de betaling van de schadevergoeding mocht worden
      teruggevonden. Van dit verzoek wordt hem een schriftelijk bewijs gegeven.


      § 3 Binnen dertig dagen na ontvangst van deze kennisgeving kan de rechthebbende eisen, dat het goed hem zonder
      berekening van vracht wordt afgeleverd en wel, te zijner keuze, of aan het station van afzending of aan het op
      de vrachtbrief vermelde station van bestemming, tegen terugbetaling van de door hem ontvangen schadevergoeding en
      onder voorbehoud van alle rechten op vergoeding wegens overschrijding van de leveringstermijn.


      § 4 Indien het in § 2 bedoelde verzoek niet wordt gedaan of de in § 3 bedoelde instructies niet binnen dertig dagen
      worden gegeven, dan wel het goed meer dan één jaar na betaling van de schadevergoeding is teruggevonden, kan de
      spoorweg daarover vrij beschikken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel77
  - number: '78'
    text: >-
      § 1 Indien krachtens de bepalingen van dit reglement een schadevergoeding voor geheel of gedeeltelijk verlies van
      het goed verschuldigd is, wordt deze berekend:


      a. volgens de beursprijs;


      b. bij gebreke hiervan volgens de marktprijs;


      c. bij gebreke van beide volgens de gebruikelijke waarde.


      Deze berekeningsgrondslagen hebben betrekking op goederen van dezelfde soort en hoedanigheid ter plaatse en ten
      tijde waarop het goed ten vervoer is aangenomen.


      § 2 De schadevergoeding kan evenwel, onder voorbehoud van de in artikel 82 genoemde beperkingen, niet meer bedragen
      dan € 11,34 voor elk ontbrekend kilogram brutogewicht.


      § 3 Bovendien worden de vracht, de douanerechten en de overige met betrekking tot het vervoer van het verloren goed
      betaalde bedragen terugbetaald zonder verdere schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel78
  - number: '79'
    text: >-
      § 1 Ten aanzien van goederen, die in verband met hun bijzondere aard in het algemeen tijdens het vervoer een
      gewichtsvermindering ondergaan, is de spoorweg slechts aansprakelijk voor dat gedeelte van de gewichtsvermindering,
      dat de als volgt bepaalde toelaatbare afwijkingen overtreft:


      a. 2 % van het gewicht bij vloeibare of in vochtige toestand ten vervoer aangeboden goederen, alsmede bij de
      navolgende goederen:


      Afval van huiden,


      Beenderen, heel of gemalen,


      Fruit, vers, gedroogd of gekookt,


      Groente, verse,


      Haar van dieren,


      Hoornen en hoeven,


      Hop,


      Huiden,


      Leder,


      Mastiek, verse,


      Paddestoelen, verse,


      Pelterijen,


      Pezen van dieren,


      Schors,


      Steenkolen en cokes,


      Tabak, gekerfde,


      Tabak, verse in bladen,


      Turf,


      Varkensborstels,


      Verfhout, geraspt of gemalen,


      Vetten,


      Vis, gedroogde,


      Wol,


      Wortels,


      Zeep en vaste oliën,


      Zoethout,


      Zout.


      b. 1 % van het gewicht bij alle overige goederen, die tijdens het vervoer eveneens aan gewichtsvermindering
      onderhevig zijn.


      § 2 Op de in § 1 bedoelde beperking van de aansprakelijkheid kan geen beroep worden gedaan, indien wordt bewezen,
      dat, gelet op de feitelijke omstandigheden, het verlies niet het gevolg is van de oorzaken, die de afwijking
      rechtvaardigen.


      § 3 Worden verscheidene colli met dezelfde vrachtbrief vervoerd, dan wordt de gewichtsvermindering voor elk collo
      afzonderlijk berekend, indien het gewicht daarvan bij vertrek afzonderlijk op de vrachtbrief is vermeld of op
      andere wijze kan worden vastgesteld.


      § 4 Bij geheel verlies van het goed heeft voor de berekening van de schadevergoeding geen aftrek wegens
      gewichtsvermindering plaats.


      § 5 Dit artikel laat het in de artikelen 74 en 75 bepaalde onverlet.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel79
  - number: '80'
    text: >-
      § 1 Bij beschadiging moet de spoorweg, met uitsluiting van alle verdere schadevergoeding, het bedrag betalen,
      dat de waardevermindering van het goed vertegenwoordigt. Dit bedrag wordt berekend door op de volgens artikel 78
      bepaalde waarde van het goed het percentage van de waardevermindering op de plaats van bestemming toe te passen.
      Bovendien worden in dezelfde verhouding de kosten, bedoeld in artikel 78, § 3, terugbetaald.


      § 2 De schadevergoeding kan evenwel niet meer bedragen dan:


      a. indien de gehele zending door de beschadiging in waarde is verminderd: het bedrag, dat zij zou hebben belopen
      bij geheel verlies;


      b. indien slechts een gedeelte van de zending door de beschadiging in waarde is verminderd: het bedrag, dat zij zou
      hebben belopen bij verlies van het in waarde verminderde gedeelte.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel80
  - number: '81'
    text: >-
      § 1 Indien het bewijs wordt geleverd, dat door de overschrijding van de leveringstermijn schade is ontstaan, wordt
      deze schade vergoed tot ten hoogste de gehele vracht.


      § 2 De in § 1 bedoelde schadevergoeding wordt niet gevoegd bij die, welke verschuldigd zou zijn wegens geheel
      verlies van het goed.


      § 3 Bij gedeeltelijk verlies wordt de in § 1 bedoelde schadevergoeding, indien daartoe aanleiding bestaat, betaald
      voor het niet verloren gegane gedeelte van de zending.


      § 4 Bij beschadiging wordt de in § 1 bedoelde schadevergoeding, indien daartoe aanleiding bestaat, gevoegd bij de
      in artikel 80 bedoelde schadevergoeding.


      § 5 In geen geval zal de som van de schadevergoedingen, bedoeld in § 1 en in de artikelen 78 en 80, hoger zijn dan
      de schadevergoeding, die verschuldigd zou zijn bij geheel verlies van het goed.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel81
  - number: '82'
    text: >-
      Wanneer de spoorweg speciale tarieven toepast, die een korting geven op de volgens de algemene tarieven berekende
      vracht, kan hij de aan de rechthebbende bij overschrijding van de leveringstermijn, geheel of gedeeltelijk verlies
      of beschadiging te betalen schadevergoeding beperken, mits dergelijke beperkingen in de tarieven zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel82
  - number: '83'
    text: >-
      § 1 Voor elke zending, met uitzondering van zendingen die met een adreskaart worden aangeboden, kan het belang
      bij de aflevering op de vrachtbrief worden aangegeven. In de in artikel 82 bedoelde speciale tarieven kan deze
      mogelijkheid worden uitgesloten of beperkt.


      § 2 In geval van aangifte van het belang bij de aflevering wordt een in de tarieven te bepalen premie geheven.


      § 3 Indien het belang bij de aflevering is aangegeven, kan vergoeding worden gevorderd van het gedeelte van de
      bewezen schade, dat de schadevergoeding op grond van het in de artikelen 78, 80, 81 en 82 bepaalde te boven gaat,
      doch ten hoogste het bedrag van het aangegeven belang.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel83
  - number: '84'
    text: >-
      In alle gevallen, waarin de overschrijding van de leveringstermijn, het gehele of gedeeltelijke verlies of de
      beschadiging van het goed is veroorzaakt door opzet of grove schuld van de spoorweg, moet deze de rechthebbende de
      bewezen schade volledig vergoeden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel84
  - number: '85'
    text: >-
      De spoorweg is ontheven van de aansprakelijkheid, die krachtens dit reglement op hem rust, wanneer de schade
      veroorzaakt is door een kernongeval en de exploitant van een kerninstallatie of een andere persoon, die voor
      hem in de plaats treedt, aansprakelijk is voor die schade krachtens bijzondere wettelijke voorschriften, die de
      aansprakelijkheid op het gebied van de kernenergie regelen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel85
  - number: '86'
    text: >-
      § 1 Op de vervoerovereenkomst betrekking hebbende vorderingen buiten rechte moeten schriftelijk worden ingediend.


      § 2 Tot het indienen van een vordering buiten rechte zijn bevoegd de personen, die krachtens artikel 87 een
      vordering in rechte tegen de spoorweg kunnen instellen. Zij moeten, ten genoegen van de spoorweg, zodanige
      dokumenten overleggen, als deze voor een juiste behandeling van de vordering nodig acht.


      § 3 De spoorweg kan, bij de afdoening van de vordering buiten rechte, verlangen in de gelegenheid te worden gesteld
      op het voor de afzender onderscheidenlijk voor de geadresseerde bestemde deel van de vrachtbrief van die afdoening
      aantekening te houden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel86
  - number: '87'
    text: >-
      § 1 De vordering in rechte tot terugbetaling van een krachtens de vervoerovereenkomst betaald bedrag kan slechts
      ingesteld worden door degene, die de betaling heeft gedaan.


      § 2 De overige uit de vervoerovereenkomst voortvloeiende vorderingen in rechte tegen de spoorweg kunnen ingesteld
      worden:


      a. door de afzender, tot het tijdstip waarop de geadresseerde de vrachtbrief of de zending in ontvangst heeft
      genomen, dan wel de hem krachtens artikel 68, § 2, toekomende rechten heeft doen gelden;


      b. door de geadresseerde, vanaf het tijdstip, waarop hij de vrachtbrief of de zending in ontvangst heeft genomen,
      dan wel de hem krachtens artikel 68, § 2, toekomende rechten heeft doen gelden.


      § 3 De afzender kan deze vorderingen slechts instellen op vertoon van het voor hem bestemde deel van de
      vrachtbrief. Bij gebreke hiervan kan hij zijn vordering tegen de spoorweg slechts instellen met toestemming van de
      geadresseerde of indien hij het bewijs levert, dat deze de zending heeft geweigerd.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel87
  - number: '88'
    text: >-
      § 1 Indien een gedeeltelijk verlies of een beschadiging door de spoorweg wordt ontdekt of vermoed, of door de
      rechthebbende wordt beweerd, moet de spoorweg bij proces-verbaal zonder uitstel en zo mogelijk in tegenwoordigheid
      van de rechthebbende vaststellen, naar gelang van de aard van de schade, de toestand en het gewicht van het goed,
      alsmede, voor zover mogelijk, het bedrag en de oorzaak van de schade en het tijdstip, waarop deze is ontstaan.


      § 2 Een afschrift van het proces-verbaal wordt desverlangd aan de rechthebbende kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel88
  - number: '89'
    text: >-
      § 1 Door de inontvangstneming van de zending door de rechthebbende vervalt elk uit de vervoerovereenkomst tegen
      de spoorweg voortvloeiende vordering wegens overschrijding van de leveringstermijn, gedeeltelijk verlies of
      beschadiging.


      § 2 De vordering vervalt evenwel niet:


      a. indien de rechthebbende het bewijs levert, dat de schade is veroorzaakt door opzet of grove schuld van de
      spoorweg;


      b. in geval van overschrijding van de leveringstermijn, indien de vordering door de rechthebbende wordt ingediend
      binnen een termijn van vijftien dagen, de dag van de inontvangstneming van de zending door de rechthebbende
      daaronder niet begrepen;


      c. in geval van gedeeltelijk verlies of beschadiging:


      1°. indien vóór de inontvangstneming van de zending door de rechthebbende, het verlies of de beschadiging
      overeenkomstig artikel 88 is vastgesteld;


      2°. indien de vaststelling, welke overeenkomstig artikel 88 had moeten plaatsvinden, uitsluitend door schuld van de
      spoorweg achterwege is gebleven;


      d. in geval van uiterlijk niet waarneembare schade, waarvan het bestaan door de rechthebbende is vastgesteld na de
      inontvangstneming van de zending, onder de volgende voorwaarden:


      1°. dat niet door de spoorweg aan de rechthebbende aangeboden is om op het station van bestemming de gesteldheid
      van het goed vast te stellen;


      2°. dat het verzoek om vaststelling overeenkomstig artikel 88 door de rechthebbende wordt gedaan onmiddellijk na de
      ontdekking van de schade en uiterlijk binnen vijf dagen na die van de inontvangstneming van de zending;


      3°. dat de rechthebbende bewijst, dat de schade is ontstaan in het tijdsverloop tussen de aanneming ten vervoer en
      de aflevering en, bij goederen, welke door de spoorweg zijn afgehaald, tussen de overneming van de goederen door de
      afhaaldienst en de aflevering.


      § 3 Indien het goed met een nieuwe vrachtbrief is doorgezonden onder de voorwaarden van artikel 76, vervallen
      de vorderingen tot schadevergoeding wegens gedeeltelijk verlies of beschadiging, die voortvloeien uit een van de
      voorafgaande vervoerovereenkomsten, alsof er sprake was van een enkele overeenkomst.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel89
  - number: '90'
    text: >-
      § 1 Alle uit de vervoerovereenkomst voortvloeiende vorderingen verjaren door verloop van één jaar.


      § 2 De verjaring begint te lopen:


      a. voor vorderingen tot schadevergoeding wegens gedeeltelijk verlies, beschadiging of overschrijding van de
      leveringstermijn: met ingang van de dag, volgende op die waarop de aflevering heeft plaats gehad;


      b. voor vorderingen tot schadevergoeding wegens geheel verlies: met ingang van de zesentwintigste dag, volgende op
      die waarop de leveringstermijn is verstreken;


      c. voor vorderingen tot betaling of terugbetaling van vrachten, boeten, bijkomende kosten, en voor vorderingen tot
      verbetering van een onjuiste toepassing van een tarief of van een rekenfout:


      1°. indien betaling heeft plaatsgehad: met ingang van de dag, volgende op die der betaling;


      2°. indien geen betaling heeft plaats gehad en deze door de afzender moet geschieden: met ingang van de dag,
      volgende op die waarop de zending ten vervoer is aangenomen;


      3°. indien geen betaling heeft plaats gehad en deze door de geadresseerde moet geschieden: met ingang van de dag,
      volgende op die waarop de geadresseerde de vrachtbrief in ontvangst heeft genomen;


      4°. indien er sprake is van een eindafrekening als bedoeld in artikel 60: met ingang van de dag, volgende op
      die waarop de eindafrekening plaatsvindt. Voor de schuldvorderingen van de spoorweg begint voor het geval geen
      eindafrekening plaats vindt, de verjaringstermijn te lopen met ingang van de eenendertigste dag, volgende op die
      waarop de leveringstermijn is verstreken;


      d. voor vorderingen van de spoorweg tot betaling van een bedrag, dat door de geadresseerde in plaats van door de
      afzender is betaald of omgekeerd en dat de spoorweg aan de rechthebbende moet teruggeven: met ingang van de dag,
      volgende op die waarop het verzoek tot terugbetaling is gedaan;


      e. voor vorderingen tot betaling van een van een verkoop resterend bedrag: met ingang van de dag, volgende op die
      waarop de verkoop heeft plaats gehad;


      f. voor vorderingen tot betaling van door de douane nagevorderde rechten: met ingang van de dag, volgende op die
      waarop de douane de navordering heeft gedaan;


      g. in alle overige gevallen: met ingang van de dag, volgende op die waarop het recht kan worden uitgeoefend.


      § 3 De schorsing en de stuiting van de verjaring worden beheerst door de bepalingen van het gemene recht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel90
  - number: '91'
    text: |-
      § 1 Op zondag, alsmede op algemeen erkende feestdagen en - voor zover de tarieven niet anders bepalen - op zaterdag
      behoeven goederen niet te woren afgehaald, ten vervoer aangenomen, vervoerd, afgeleverd of besteld.

      § 2 Deze dagen worden buiten beschouwing gelaten bij de berekening van de in deze titel in uren of dagen
      uitgedrukte termijnen. Ditzelfde geldt voor de berekening van lig-, magazijn- en staangelden.

      § 3 De spoorweg kan om dringende redenen in het belang van de spoorweg, met inachtneming van het in artikel 115
      bepaalde, afwijken van § 1, alsmede van het bepaalde in § 2, tweede volzin.

      § 4 Onder algemeen erkende feestdagen worden verstaan de in [artikel 3 van de Algemene termijnenwet][ref1] als
      zodanig genoemde en de bij of krachtens dat artikel daarmede gelijkgestelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '3'
  - number: '92'
    text: >-
      De bepalingen van titel III zijn, voor zover hiervan in de volgende artikelen niet wordt afgeweken, op
      overeenkomstige wijze van toepassing op het vervoer van levende dieren.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel92
  - number: '93'
    text: >-
      § 1 De treinen, waarmede het vervoer geschiedt, worden door de spoorweg aangewezen.


      § 2 De afzender kan, met inachtneming van het in § 1 bepaalde, vervoer met een door hem aangewezen trein verlangen,
      mits de zending uiterlijk twee uren vóór het vertrek van die trein gereed is om ten vervoer te worden aangenomen,
      de trein hierdoor niet wordt vertraagd en de voorschriften omtrent de samenstelling van de trein de verzending
      mogelijk maken.


      § 3 Heeft de afzender niet het vervoer met een bepaalde trein verlangd, dan geschiedt het vervoer met de
      eerstvolgende voor het vervoer van levende dieren aangewezen trein; de spoorweg is echter niet verplicht een trein
      te gebruiken, die eerder vertrekt dan twee uren na het gereed zijn voor de aanneming ten vervoer van de zending.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel93
  - number: '94'
    text: >-
      § 1 Levende dieren worden slechts ten vervoer aangenomen, indien de zending volgens de dienstregeling der daarvoor
      aangewezen treinen binnen vierentwintig uren na het tijdstip van vertrek van het station van afzending op het
      station van bestemming in Nederland of bij verzending naar het buitenland, op het Nederlandse grensstation zal
      aankomen.


      § 2 1. De Minister van Verkeer en Waterstaat is bevoegd bij het heersen van besmettelijke veeziekten te bepalen,
      dat op door hem aan te wijzen stations vee in het geheel niet of alleen op door hem vast te stellen voorwaarden ten
      vervoer mag worden aangenomen.


      2. Het is verboden dieren, lijdende aan een besmettelijke veeziekte en dieren, komende van plaatsen waar zulke
      ziekten heersen, ten vervoer per spoor aan te bieden, te doen aanbieden of per spoor te vervoeren.


      3. De Minister van Verkeer en Waterstaat is bevoegd, de spoorweg gehoord, ten behoeve van wetenschappelijk
      onderzoek, van het in het vorige lid vermelde verbod ontheffing te verlenen.


      4. In hoeverre en onder welke voorwaarden dieren lijdende aan andere dan besmettelijke veeziekten worden vervoerd,
      wordt in de tarieven bepaald.


      § 3


      § 4 Tot het vervoer van wilde, verwilderde of boosaardige dieren is de spoorweg niet verplicht. In de tarieven
      wordt bepaald, onder welke voorwaarden het vervoer van deze dieren, indien de spoorweg deze ten vervoer aanneemt,
      geschiedt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel94
  - number: '95'
    text: >-
      Het is verboden levende dieren aan een station aan te brengen, te laden of te doen laden vroeger dan vier uren vóór
      het vertrek volgens de dienstregeling van de trein, waarmede het vervoer zal plaats hebben, tenzij dit in bepaalde
      gevallen door de spoorweg wordt toegestaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel95
  - number: '96'
    text: >-
      § 1 1. De afzender is bij het vervoer van levende dieren gerechtigd en, indien de spoorweg zulks verlangt,
      verplicht de zending te doen begeleiden.


      2. De begeleiders moeten, tenzij de spoorweg hiervan afwijking toestaat, plaats nemen in de wagens, waarin de
      dieren geladen zijn, en gedurende het vervoer toezicht houden op de dieren.


      3. Heeft het vervoer met begeleiding plaats, dan moet de begeleider als geadresseerde op de vrachtbrief worden
      vermeld.


      4. Heeft het vervoer zonder begeleiding plaats, dan is de afzender verplicht aan de geadresseerde kennis te geven
      van de afzending om deze in de gelegenheid te stellen de zending dadelijk na aankomst van de trein in ontvangst te
      nemen. De spoorweg is niet verplicht van de aankomst der zending aan de geadresseerde kennis te geven.


      § 2 De spoorweg wijst stations aan voor het drenken van de dieren. Hij stelt op deze stations desverlangd emmers en
      water ter beschikking van de begeleiders.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel96
  - number: '97'
    text: >-
      In de tarieven wordt bepaald, met welk model vrachtbrief de zendingen levende dieren ten vervoer moeten worden
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel97
  - number: '98'
    text: >-
      § 1 De leveringstermijn loopt af drie uren na de aankomst op het station van bestemming van de trein, waarmede het
      vervoer moet geschieden.


      § 2 Bij zendingen, welke onderweg één of meer malen op een andere trein moeten overgaan, komt voor de berekening
      van de leveringstermijn steeds in aanmerking de na het werkelijke uur van aankomst op het overgangsstation eerst
      aangewezen trein, waarvoor voldoende tijd voor overgang beschikbaar is.


      § 3 Bij toepassing van § 2 wordt geen rekening gehouden met een aangewezen trein, waarmede het vervoer niet kan
      geschieden, omdat de voor de samenstelling van die trein gegeven voorschriften zich daartegen verzetten.


      § 4 De leveringstermijn is in acht genomen, indien voor de afloop van deze termijn de wagens ter lossing gereed
      zijn gezet.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel98
  - number: '99'
    text: >-
      § 1 De dieren moeten door de geadresseerde worden gelost en uiterlijk één uur na het gereedzetten van de wagens
      zijn afgevoerd.


      § 2 Na afloop van die termijn is de spoorweg bevoegd de dieren voor rekening en risico van de rechthebbende elders
      te stallen. Blijven de dieren na afloop van die termijn evenwel in de wagen, dan komen de door de spoorweg ten
      behoeve van de zending gemaakte kosten ten laste van de rechthebbende.


      § 3 Ook de dieren, welke vóór de aflevering beschadigd of gestorven zijn, moeten door de rechthebbende worden
      afgevoerd, onverminderd de verplichting van de spoorweg tot vaststelling van de schade overeenkomstig artikel 88.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel99
  - number: '100'
    text: >-
      § 1 De afzender is tegenover de spoorweg aansprakelijk voor schade door de dieren veroorzaakt.


      § 2 Artikel 49, § 4, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel100
  - number: '101'
    text: >-
      Indien krachtens de bepalingen van dit reglement door de spoorweg schadevergoeding voor verlies of beschadiging
      (dood daaronder begrepen) verschuldigd is, wordt, indien het belang bij de aflevering niet op de vrachtbrief is
      aangegeven, ten hoogste vergoed:


      € 453,78 per paard, stier, os of koe;


      € 136,13 per veulen, pink, kalf of graskalf;


      € 113,45 per varken van 50 kilogram of meer;


      € 45,38 per varken van minder dan 50 kilogram, schaap of vette big;


      € 15,88 per nuchter kalf;


      € 11,34 per bok, geit, lam, kleine big of hond;


      € 0,91 per kilogram andere dieren.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel101
  - number: '102'
    text: >-
      De bepalingen van titel III zijn, voorzover hiervan in de volgende artikelen niet wordt afgeweken, op
      overeenkomstige wijze van toepassing op het vervoer van lijken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel102
  - number: '103'
    text: De treinen, waarmede het vervoer geschiedt, worden voor elk geval afzonderlijk door de spoorweg aangewezen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel103
  - number: '104'
    text: >-
      § 1 Het vervoer van een lijk moet zolang tevoren worden aangevraagd als in de tarieven wordt bepaald.


      § 2 Bij het ten vervoer aanbieden van een lijk moeten de bescheiden, welke volgens de wettelijke bepalingen voor
      het vervoer nodig zijn, worden bijgevoegd.


      § 3 Tenzij in de tarieven anders is bepaald, moet het lijk geplaatst zijn in een stevige metalen luchtdicht
      afgesloten kist, welke laatste zo vast in een houten kist moet worden geplaatst, dat deze daarin niet kan
      verschuiven.


      § 4 De afzender moet aan het station van afzending een van plaats-, dag- en naamtekening voorziene verklaring
      afgeven, waarin hij te kennen geeft, dat aan de in § 3 vermelde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel104
  - number: '105'
    text: Het vervoer moet onder begeleiding plaats hebben.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel105
  - number: '106'
    text: >-
      § 1 In de tarieven wordt bepaald, met welk model vrachtbrief lijken ten vervoer moeten worden aangeboden.


      § 2 De naam van de begeleider moet als geadresseerde op de vrachtbrief worden vermeld.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel106
  - number: '107'
    text: De vracht moet op het station van afzending worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel107
  - number: '108'
    text: >-
      Onverminderd de verplichting tot betaling van het verschil in vracht kan hem, die een lijk verzendt zonder het als
      zodanig aan te geven, een boete in rekening worden gebracht ten bedrage van het viervoudige van de in de tarieven
      vastgestelde vracht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel108
  - number: '109'
    text: >-
      Wanneer het lijk niet binnen zes uren na aankomst van de trein op het station van bestemming wordt afgevoerd, wordt
      door de spoorweg gehandeld overeenkomstig de op de lijkbezorging van toepassing zijnde wettelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel109
  - number: '113'
    text: >-
      § 1 Voor het vervoer van reizigers en goederen van of naar het buitenland kunnen door de Minister van Verkeer en
      Waterstaat afwijkingen van dit reglement worden toegestaan.


      § 2 Zendingen, die ten vervoer zijn aangenomen met een internationale vrachtbrief voor vervoer als "grande
      vitesse"/"Eilgut", worden op Nederlands gebied aangemerkt als vrachtgoed, behoudens de in de tarieven te bepalen
      uitzonderingen.


      § 3 Ten aanzien van buitenlandse spoorwegen, die hun dienst hier te lande uitoefenen, kunnen door de Minister van
      Verkeer en Waterstaat afwijkingen van dit reglement worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel113
  - number: '114'
    text: >-
      De Minister van Verkeer en Waterstaat is bevoegd ontheffing te verlenen van bepalingen van dit reglement, indien
      het gebruik van bijzonder materieel dit nodig maakt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel114
  - number: '115'
    text: >-
      § 1 De Minister van Verkeer en Waterstaat kan terzake van de in de artikelen en 91, § 3, aan de spoorweg toegekende
      bevoegdheden:


      a. de spoorweg voorschriften geven;


      b. de spoorweg opdragen de op grond van die bevoegdheden getroffen maatregelen weer op te heffen, indien hij van
      mening is, dat de in genoemde artikelen gestelde voorwaarden niet vervuld waren of niet meer vervuld zijn.


      § 2 Terzake van de aan de spoorweg in de artikelen 51, § 7, en 72, § 6, toegekende bevoegdheden is de Minister van
      Verkeer en Waterstaat slechts bevoegd tot het geven van de voorschriften bedoeld in § 1, onder *a*.


      § 3 De spoorweg is verplicht aan deze voorschriften en opdrachten te voldoen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel115
  - number: 115a
    text: |-
      § 1 In geval van staking van de dienst op een locaalspoorweg zijn, in afwijking van
      [artikel 8, eerste lid, van de Spoorwegwet][ref1], bestuurders niet verplicht te zorgen voor het vervoer van
      goederen in de richting van de locaalspoorweg.

      § 2 De Minister van Verkeer en Waterstaat is bevoegd voor locaalspoorwegen, welke uitsluitend bestemd zijn voor het
      vervoer van goederen, geheel of gedeeltelijk ontheffing te verlenen van de bepalingen van dit reglement. Aan een
      ontheffing kunnen voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel8
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel115a
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '8'
  - number: '116'
    text: >-
      Het Algemeen Reglement Vervoer, vastgesteld bij Koninklijk besluit van 9 november 1928 (*Stb.* 415), wordt
      ingetrokken, behoudens de daarbij behorende Bijlage I, welke als Bijlage I bij het onderwerpelijke besluit wordt
      geacht te behoren.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel116
  - number: '118'
    text: Dit besluit kan worden aangehaald als "Algemeen Reglement Vervoer" of "ARV".
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel118
  - number: '119'
    text: Dit besluit treedt in werking met ingang van 1 januari 1967.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel119
