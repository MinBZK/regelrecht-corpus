  - number: '56'
    text: |-
      § 1 1. Behoudens het bepaalde in de §§ 11 en 12 moet de afzender elke zending aanbieden met een vrachtbrief
      overeenkomstig een in of krachtens de tarieven vast te stellen model. De vrachtbrief dient tenminste een voor de
      afzender en een voor de geadresseerde bestemd deel te bevatten.

      2. Het is slechts toegestaan vrachtbrieven te gebruiken, die van de spoorweg zijn betrokken. Deze formulieren zijn
      verkrijgbaar tegen de in de tarieven vast te stellen prijs.

      § 2 In de tarieven wordt bepaald, welke rubrieken van de vrachtbrief door de afzender en welke door de spoorweg
      worden ingevuld.

      § 3 1. De op het eerste blad van de vrachtbrief aangebrachte aanduidingen moeten in onuitwisbare letters in het
      Nederlands geschreven of gedrukt zijn; op alle delen moeten zij goed leesbaar zijn.

      2. Het gebruik van vrachtbrieven, waarin geradeerd is of waarin over de oorspronkelijke woorden geschreven is of
      waarop stukken papier zijn geplakt, is niet geoorloofd. Doorhalingen en veranderingen worden slechts toegelaten,
      indien de afzender deze met zijn handtekening bekrachtigt en, voor wat betreft het aantal of het gewicht, de
      verbeterde hoeveelheden voluit in letters vermeldt.

      § 4 De vrachtbrief moet de volgende gegevens bevatten:

      a. de naam van het station van bestemming, zoals in de tarieven vermeld;

      b. de naam en het adres van de geadresseerde. Als geadresseerde mag niet meer dan één natuurlijke persoon, firma of
      rechtspersoon worden aangegeven. Het is niet geoorloofd het station van bestemming of personeel van dat station als
      geadresseerde aan te duiden. Aanduidingen, waarin de naam van de geadresseerde niet voorkomt, zijn niet toegelaten;

      c. de omschrijving van het goed, de aanduiding van het gewicht van de zending of in de plaats daarvan, voorzover de
      tarieven zulks voorschrijven, het aantal stuks. Die goederen, welke voorkomen in het VSG, moeten worden aangeduid
      met de naam waaronder zij in het VSG voorkomen; die, welke niet in het VSG voorkomen, doch wel zijn genoemd in
      de tarieven, met de naam waaronder zij in deze tarieven voorkomen; in alle overige gevallen met de benaming die
      beantwoordt aan hun aard;

      d. bij stukgoedzendingen: het aantal colli, de beschrijving van de verpakking, de vermelding dat de colli van
      een adres zijn voorzien, alsmede de afmetingen van ieder collo, uitgedrukt in centimeters en gemeten volgens de
      grootste hoogte, lengte en breedte;

      e. bij goederen welke door de afzender worden geladen:

      het nummer van de gebezigde wagen en bij particuliere wagens bovendien het eigen gewicht van de wagen;

      f. de nauwkeurige opsomming van de krachtens douane- of andere wettelijke dan wel ambtelijke voorschriften vereiste
      bescheiden, die bij de vrachtbrief zijn gevoegd of waarvan op de vrachtbrief is vermeld, dat zij ter beschikking
      zijn van de spoorweg op een bepaald station of op een kantoor van de douane of van andere overheidsinstanties;

      g. de handtekening van de afzender, alsmede de aanduiding van zijn naam en zijn volledig adres, desgewenst
      aangevuld met zijn telegramadres, telefoon- of telexnummer. De handtekening mag gedrukt of gestempeld zijn. Als
      afzender mag op de vrachtbrief niet meer dan één natuurlijke persoon, firma of rechtspersoon voorkomen. Indien de
      afzender in Nederland geen vaste woonplaats heeft, moet hij op verlangen van de spoorweg in Nederland woonplaats
      kiezen en deze op de vrachtbrief vermelden.

      § 5 Bovendien moet de vrachtbrief zo nodig alle overige in dit reglement vermelde aanduidingen bevatten.

      § 6 Indien de op de vrachtbrief voor de aanduidingen van de afzender bestemde ruimte onvoldoende is, kan gebruik
      gemaakt worden van aanvullingsbladen van dezelfde afmetingen als de vrachtbrief; zij moeten in evenveel exemplaren
      worden vervaardigd als de vrachtbrief delen telt en door de afzender van zijn handtekening worden voorzien. Op de
      vrachtbrief moet naar deze bladen worden verwezen. Indien het totale gewicht van de zending wordt aangegeven, moet
      dit op de vrachtbrief zelf worden vermeld.

      § 7 1. Het is niet geoorloofd op de vrachtbrief andere aanduidingen te vermelden dan die, welke door dit reglement,
      door de tarieven of andere wettelijke voorschriften worden vereist of toegelaten.

      2. Het is verboden de vrachtbrief te vervangen door andere stukken of daaraan andere bescheiden toe te voegen dan
      die, welke door dit reglement of door de tarieven zijn voorgeschreven of toegelaten.

      § 8 Bij vervoer van wagenladingen kan de afzender verplicht worden voor iedere wagen een afzonderlijke vrachtbrief
      bij te voegen. Indien het krachtens de tarieven is toegestaan voor een uit meer wagens bestaande zending gebruik te
      maken van één vrachtbrief, moet de afzender het geladen gewicht per wagen vermelden.

      § 9 Met eenzelfde vrachtbrief mogen niet ten vervoer worden aangeboden:

      a. goederen, die in verband met hun aard bezwaarlijk kunnen worden samengeladen;

      b. goederen, die gedeeltelijk door de spoorweg en gedeeltelijk door de afzender moeten worden geladen;

      c. goederen, waarvan de samenlading inbreuk zou maken op douane- of andere wettelijke dan wel ambtelijke
      voorschriften;

      d. voorwaardelijk ten vervoer toegelaten goederen, wanneer het stoffen en voorwerpen betreft, die
      krachtens het VSG niet met elkaar of met andere goederen mogen worden samengeladen, tenzij ingevolge
      [artikel 9 van de Wet vervoer gevaarlijke stoffen][ref1] deze samenlading is toegestaan.

      § 10 De afzender mag op de vrachtbrief mededelingen betreffende de zending vermelden, echter slechts bij wijze van
      inlichting voor de geadresseerde en zonder dat hieruit voor de spoorweg enige verplichting of aansprakelijkheid
      voortvloeit.

      § 11 1. In de tarieven kan worden bepaald, dat bepaalde in de tarieven te omschrijven zendingen door de afzender
      moeten worden aangeboden met een adreskaart overeenkomstig een in de tarieven vast te stellen model.

      2. In de artikelen 49, 50, 56 - met uitzondering van § 3, lid 1, en § 6 -, 57, 58, 59 - met uitzondering van §
      4, lid 3, -, 62, 64, § 1, lid 1, § 2 en § 3, 65, 66, 68, 73, 76, 77, 86, 87 en 89 wordt onder vrachtbrief mede
      begrepen de in lid 1 bedoelde adreskaart.

      § 12 1. In de tarieven kan worden bepaald in welke gevallen en onder welke voorwaarden zendingen zonder een
      vrachtbrief ten vervoer kunnen worden aangeboden.

      2. In die gevallen maakt de spoorweg op basis van de door de afzender verstrekte gegevens, die schriftelijk dan wel
      electronisch kunnen worden aangeleverd, een vrachtbrief op overeenkomstig een in de tarieven vast te stellen model.

      3. Met uitzondering van het vervoer van stoffen en voorwerpen, waarop het VSG van toepassing is, kunnen in
      afwijking van het tweede lid bij binnenlands vervoer en bij internationaal vervoer, voor zover er sprake is van
      het electronisch aanleveren van de gegevens voor dit vervoer, de afzender en de spoorweg tezamen bepalen dat geen
      vrachtbrief wordt opgemaakt.

      4. Indien door de spoorweg geen vrachtbrief wordt opgemaakt, als bedoeld in het derde lid, worden de gegevens van
      de in de artikelen 50, § 1, § 3, en § 5, 57, § 2, derde lid, en § 3, 59, § 4, eerste lid, en § 5, 60, § 3 en § 8,
      62, § 3, 74, § 3 onder *a*, 79, § 3, 83, § 1, en 86, § 3, bedoelde vermelding of aanduiding van de afzender of de
      spoorweg op de vrachtbrief op een andere wijze aan de wederpartij medegedeeld.


