  - number: '57'
    text: >-
      § 1 1. De afzender is aansprakelijk voor de juistheid van de aanduidingen en verklaringen, die zijnerzijds op
      de vrachtbrief zijn vermeld. Hij draagt alle gevolgen, die voortvloeien uit het feit, dat deze aanduidingen of
      verklaringen onjuist, onnauwkeurig of onvolledig zijn, dan wel op een andere dan de daarvoor bestaande plaats zijn
      vermeld. Indien deze plaats te klein is, moet de afzender aldaar verwijzen naar de plaats, waar de vermelding wordt
      voortgezet.


      2. De afzender is eveneens, overeenkomstig lid 1, aansprakelijk voor de juistheid van de aanduidingen en
      verklaringen, welke op zijn verzoek door het personeel van de spoorweg zijn vermeld.


      § 2 1. De spoorweg heeft steeds het recht te onderzoeken of de zending overeenstemt met de vermeldingen op de
      vrachtbrief en of de veiligheidsmaatregelen, voorgeschreven in het VSG of die krachtens artikel 56, paragraaf 9,
      onderdeel *d*, zijn toegestaan .


      2. Indien een zending op inhoud wordt onderzocht, moet de afzender of de geadresseerde worden uitgenodigd
      daarbij aanwezig te zijn, naar gelang het onderzoek plaats heeft op het station van afzending of op het station
      van bestemming. Indien de rechthebbende niet verschijnt of indien het onderzoek onderweg plaats heeft, moet het
      onderzoek worden verricht in tegenwoordigheid van twee niet tot het spoorwegpersoneel behorende getuigen.


      3. Het resultaat van het onderzoek naar de juistheid van de vermeldingen op de vrachtbrief moet worden vermeld
      op alle delen van de vrachtbrief, die bij de spoorweg aanwezig zijn. Indien de zending niet overeenstemt met de
      vermeldingen op de vrachtbrief, komen de door het onderzoek veroorzaakte kosten ten laste van de zending, tenzij
      zij ter plaatse zijn voldaan.


      § 3 In de tarieven wordt bepaald of en onder welke voorwaarden de spoorweg verplicht is op verzoek van de
      afzender het gewicht van de zending, het aantal colli of stuks van een zending, de afmetingen van elk collo of het
      eigengewicht van de wagens vast te stellen. De spoorweg is verplicht op de vrachtbrief het door hem vastgestelde
      gewicht, het aantal colli of stuks van een zending, de afmetingen van elk collo en het eigengewicht van de wagens
      te vermelden.


      § 4 Bij weging op een weegbrug wordt het gewicht van het goed bepaald door van het totale gewicht van de beladen
      wagen het op de wagen vermelde eigengewicht af te trekken, tenzij door de afzonderlijke weging van de ledige wagen
      een ander eigengewicht is komen vast te staan; in dit geval wordt dit van het totale gewicht afgetrokken. Wegingen,
      uitgevoerd op weegbruggen van particulieren, worden gelijkgesteld met die op weegbruggen van de spoorweg, voorzover
      aan de voorwaarden, die terzake door de spoorweg zijn vastgesteld, is voldaan.


      § 5 De vaststelling van het gewicht, van het aantal colli of stuks van een zending of van de afmetingen van elk
      collo door de spoorweg geschiedt uitsluitend voor de berekening van de vracht, bijkomende kosten en boeten, alsmede
      voor de vaststelling van een te gering gewicht of aantal colli of stuks. Aan een onjuiste vaststelling of een
      onjuiste vermelding op de vrachtbrief kunnen slechts aanspraken tegenover de spoorweg worden ontleend, voorzover
      dientengevolge te hoge vracht en andere kosten in rekening zijn gebracht of een te gering gewicht of aantal colli
      of stuks is afgeleverd.


      § 6 Indien een door de spoorweg na sluiting van de vervoerovereenkomst verrichte weging een gewichtsverschil te
      zien geeft, blijft het door het station van afzending vastgestelde gewicht of, bij gebreke daarvan, het door de
      afzender aangegeven gewicht in de volgende gevallen beslissend voor de vrachtberekening:


      a. indien het verschil kennelijk is te wijten aan de aard van het goed of aan atmosferische invloeden;


      b. indien het gewichtsverschil niet meer dan 2% bedraagt van het door het station van afzending vastgestelde
      gewicht, of, bij gebreke daarvan, van het door de afzender aangegeven gewicht.
