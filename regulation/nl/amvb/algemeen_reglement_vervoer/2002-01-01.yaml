articles:
  - number: '1'
    text: >-
      § 1 In dit reglement wordt onder spoorwegpersoneel mede begrepen het personeel, behorende tot buitenlandse
      spoorwegen, dat hier te lande dienst doet.


      § 2 In dit reglement wordt onder station mede begrepen halte.


      § 3 In dit reglement wordt onder spoorweg mede begrepen locaalspoorweg.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel1
  - number: '2'
    text: >-
      § 1 Voor de toepassing van dit reglement is de spoorweg aansprakelijk voor de bij hem in dienst zijnde personen en
      voor andere personen van wier diensten hij gebruik maakt bij de uitvoering van het vervoer, waarmede hij is belast,
      voorzover deze personen handelen binnen de kring van de hun opgedragen werkzaamheden.


      § 2 Indien evenwel de personen, bedoeld in § 1 van dit artikel, op verzoek van de belanghebbende diensten bewijzen,
      waartoe de spoorweg niet is verplicht, worden zij geacht te handelen in opdracht van degene, aan wie zij deze
      diensten bewijzen.


      § 3 Voor de toepassing van dit reglement zijn de afzender, de aanvrager van een wagen, als bedoeld in artikel 55,
      § 4, en de geadresseerde aansprakelijk voor de bij hen in dienst zijnde personen en voor andere personen van wier
      diensten zij gebruik maken, voor zover deze personen handelen binnen de kring van de hun opgedragen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel2
  - number: '3'
    text: >-
      Wordt een kind jonger dan twaalf jaar begeleid door een persoon van achttien jaar of ouder, dan is deze begeleider
      verplicht er voor zorg te dragen, dat dit kind niet in strijd met de bepalingen van dit reglement handelt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel3
  - number: '5'
    text: >-
      1 Het is een ieder, behoudens uit de aard van zijn betrekking, verboden zich in of op een station dan wel in een
      trein in een zodanige toestand te bevinden of zich zodanig te gedragen, dat orde, rust, veiligheid of een goede
      bedrijfsgang wordt of kan worden verstoord.


      2 Als verstoring van orde, rust, veiligheid of een goede bedrijfsgang worden beschouwd:


      a. gedragingen waardoor de bediening en het gebruik van voorzieningen of van een trein dan wel de taakuitoefening
      van het personeel van de vervoerder worden verhinderd of belemmerd;


      b. misbruik maken van voorzieningen dan wel gebruik maken van voorzieningen of van een trein op een tijdstip waarop
      deze niet voor gebruik beschikbaar zijn dan wel op een andere wijze dan waarvoor deze bestemd zijn;


      c. uit een trein werpen van stoffen of van voorwerpen;


      d. zich in kennelijke staat van dronkenschap of onder kennelijke invloed van verdovende middelen bevinden;


      e. afsteken van vuurwerk, rumoer maken dan wel op zodanige wijze geluid voortbrengen dat anderen daarvan hinder
      ondervinden;


      f. uitoefenen van beroep of bedrijf;


      g. tentoonstellen van voorwerpen, maken van reclame of propaganda, verspreiden van drukwerk, bedelen of houden
      van inzamelingen;


      h. meenemen in een trein van dieren, stoffen of voorwerpen die hinder, gevaar, verontreiniging of beschadiging
      veroorzaken of kunnen veroorzaken;


      i. roken in een trein of station, of gedeelten daarvan, ten aanzien waarvan de spoorweg heeft aangegeven dat roken
      niet is toegestaan;


      j. zich bevinden op een station op een tijdstip dat dit kenbaar gesloten is of op een gedeelte van een station dat
      kenbaar daartoe niet toegankelijk is;


      k. zich op een station begeven langs een andere dan de daarvoor bestemde weg;


      l. op een andere wijze hinder, gevaar, verontreiniging of beschadiging veroorzaken.


      3 Het bepaalde in het eerste en tweede lid is niet van toepassing voor zover de spoorweg daarvoor, met inachtneming
      van de belangen van reizigers, toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel5
  - number: '7'
    text: >-
      1 Een ieder is verplicht de aanwijzingen betreffende de orde, rust, veiligheid of een goede bedrijfsgang op te
      volgen, die door of vanwege de spoorweg duidelijk kenbaar zijn gemaakt.


      2 Een aanwijzing om zich te verwijderen, kan worden gegeven voor een bij de aanwijzing te bepalen tijdsduur.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel7
  - number: '16'
    text: >-
      § 1 Het is een ieder verboden zich zonder geldig plaatsbewijs in een trein te bevinden, behalve in het geval van
      het verlenen van hulp aan een reiziger bij het in- of uitstappen. Niet strafbaar is hij, die zich zonder geldig
      plaatsbewijs in een trein bevindt uit de aard van zijn betrekking of met toestemming van de spoorweg.


      § 2


      § 3


      § 4


      § 5


      § 6 Hij, die in strijd met het bepaalde in § 1 handelt en nalaat dit aan de conducteur zo tijdig mede te delen als
      in de §§ 7 tot en met 11 is bepaald, is niet strafbaar, indien hij op eerste vordering van het spoorwegpersoneel
      de vrachtprijs, bedoeld in de §§ 7 tot en met 11, en een verhoging, waarvan het bedrag in de tarieven wordt
      vastgesteld, betaalt.


      § 7 Hij, die op een station, waar geen plaatsbewijzen verkrijgbaar zijn, wenst in te stappen zonder te zijn
      voorzien van een geldig plaatsbewijs, is verplicht dit bij het instappen aan de conducteur mede te delen en op
      eerste vordering van het spoorwegpersoneel de verschuldigde vrachtprijs te betalen.


      § 8 Hij, die op een station, waar plaatsbewijzen verkrijgbaar zijn, wenst in te stappen zonder te zijn voorzien van
      een geldig plaatsbewijs, is verplicht dit vóór het instappen aan de conducteur mede te delen en op eerste vordering
      van het spoorwegpersoneel de verschuldigde vrachtprijs en een verhoging, waarvan het bedrag in de tarieven wordt
      vastgesteld, te betalen.


      § 9 Hij, die, voorzien van een plaatsbewijs tweede klasse, wenst plaats te nemen in de eerste klasse, is
      verplicht dit vóór het plaatsnemen in de eerste klasse aan de conducteur mede te delen en op eerste vordering
      van het spoorwegpersoneel de verschuldigde vrachtprijs en een verhoging, waarvan het bedrag in de tarieven wordt
      vastgesteld, te betalen.


      § 10 Hij, die verder zal reizen dan het station, tot waar zijn plaatsbewijs geldig is, is verplicht dit vóór of
      gedurende de reis, waarvoor dat plaatsbewijs geldt, aan de conducteur mede te delen en op eerste vordering van
      het spoorwegpersoneel de verschuldigde vrachtprijs en een verhoging, waarvan het bedrag in de tarieven wordt
      vastgesteld, te betalen.


      § 11 Hij, die zich zonder geldig plaatsbewijs in een trein bevindt, waarmede hij Nederland over de grens is
      binnengekomen, is verplicht dit zo spoedig mogelijk aan de conducteur mede te delen en op eerste vordering van
      het spoorwegpersoneel de verschuldigde vrachtprijs en een verhoging, waarvan het bedrag in de tarieven wordt
      vastgesteld, te betalen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel16
  - number: '47'
    text: >-
      § 1


      § 2


      § 3 Goederen, welke door hun afmetingen, gewicht of aard, in verband met de inrichtingen of het materieel van de
      spoorweg ongeschikt zijn om te worden vervoerd, zijn van het vervoer uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel47
  - number: '48'
    text: >-
      § 1


      § 2


      § 3 De hierna genoemde goederen worden onder de volgende voorwaarden ten vervoer aangenomen:


      a. op eigen wielen rollend spoorwegmaterieel onder de voorwaarden dat naar het oordeel van de spoorweg dit
      materieel tot rijden in staat is en de veiligheid van het verkeer voldoende gewaarborgd is, alsmede dat
      locomotieven, tenders en motorvoertuigen worden begeleid door een door de afzender aangewezen deskundige, die
      gedurende de reis voor het smeren en het nazien van de werktuigelijke delen van het materieel zorgt;


      b. ledige of beladen particuliere wagens onder de in Bijlage II genoemde voorwaarden;


      c. goederen, waarvan het laden of overladen, het lossen of het vervoer door hun afmetingen, gewicht of aard
      bijzondere moeilijkheden oplevert in verband met de inrichtingen of het materieel van de spoorweg, onder voor
      elk geval, na raadpleging van de afzender, door de spoorweg vast te stellen bijzondere voorwaarden, welke kunnen
      afwijken van de bepalingen van dit reglement.


      § 4 1. De volgende zendingen worden niet als vrachtgoed ten vervoer aangenomen:


      a. stukgoederen, behoudens in de tarieven te maken uitzonderingen;


      b. levende dieren, behoudens in de tarieven te maken uitzonderingen;


      c. lijken.


      2. Geld, geldswaarden en daarmede gelijk te stellen goederen, overeenkomstig de in de tarieven te geven
      omschrijving, worden niet als stukgoed ten vervoer aangenomen.


      § 5 De spoorweg kan in het belang van de spoorweg verlangen of in het belang van de zending toestaan, dat de
      zending door of vanwege de afzender wordt begeleid.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel48
  - number: '49'
    text: >-
      § 1


      § 2


      § 3 De spoorweg is van zijn aansprakelijkheid ontheven, indien bij de aanneming ten vervoer der goederen voor hem
      niet kenbaar is, dat het van het vervoer uitgesloten goederen betreft dan wel dat de afzender niet aan de voor hem
      geldende voorwaarden heeft voldaan.


      § 4 De spoorweg is bevoegd het bedrag van de door hem geleden schade of een naar zijn oordeel voldoende waarborgsom
      ten laste van de zending te brengen. Zijn de vrachtbrief en de goederen aan de geadresseerde afgegeven, voordat
      de schadevergoeding is betaald, dan is de geadresseerde, indien het bedrag van de vordering tot schadevergoeding
      uit de vrachtbrief blijkt of de spoorweg hem vóór of bij de aflevering van het bestaan van een vordering in kennis
      heeft gesteld, hoofdelijk met de afzender voor de betaling daarvan aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel49
  - number: '50'
    text: >-
      § 1 Indien de spoorweg een zending ten vervoer aanneemt, welke duidelijke tekenen van beschadiging vertoont,
      kan hij verlangen, dat van de toestand van de tot die zending behorende goederen een bijzondere vermelding op de
      vrachtbrief wordt aangetekend.


      § 2 Indien de aard van het goed een verpakking vereist, moet de afzender het goed op zodanige wijze verpakken, dat
      het gevrijwaard is voor geheel of gedeeltelijk verlies en voor beschadiging tijdens het vervoer en dat het geen
      schade aan personen of goederen kan veroorzaken.


      § 3 Indien de afzender de voorschriften van § 2 niet in acht heeft genomen, kan de spoorweg de zending weigeren of
      eisen, dat de afzender het ontbreken of de gebrekkige toestand van de verpakking door een nauwkeurige beschrijving
      op de vrachtbrief erkent.


      § 4 1. De afzender is aansprakelijk voor alle gevolgen van het ontbreken van verpakking of de gebrekkige toestand
      van de verpakking. Hij is verplicht de schade te vergoeden, die de spoorweg uit dien hoofde mocht hebben geleden.
      Bij gebreke van een vermelding op de vrachtbrief, moet het ontbreken of de gebrekkige toestand van de verpakking
      door de spoorweg worden bewezen.


      2. Artikel 49, § 4, is van overeenkomstige toepassing.


      § 5 Indien een afzender gelijksoortige goederen, die verpakking behoeven, van hetzelfde station pleegt te verzenden
      en deze onverpakt of met eenzelfde gebrekkige verpakking ten vervoer pleegt aan te bieden, kan hij van de naleving
      van het voorschrift van § 3 voor elke zending afzonderlijk worden vrijgesteld, door op dit station een algemene
      verklaring overeenkomstig het in de tarieven vast te stellen model te deponeren. In dit geval moet de afzender op
      de vrachtbrief naar de op het station van afzending afgegeven algemene verklaring verwijzen.


      § 6 1. De afzender moet, behoudens de in de tarieven te maken uitzonderingen, bij stukgoedzendingen op elk collo
      in duidelijk en onuitwisbaar schrift het adres van de geadresseerde, het station van afzending en het station van
      bestemming vermelden in overeenstemming met de gegevens op de vrachtbrief.


      2. De afzender moet, indien de spoorweg zulks bepaalt, bij wagenladingen op elke wagen, op de voor plakbriefjes
      bestemde plaatsen, in duidelijk en onuitwisbaar schrift het (al dan niet in een enveloppe gesloten) adres van de
      geadresseerde vermelden in overeenstemming met de gegevens op de vrachtbrief.


      3. Andere aanduidingen dan die, welke ingevolge het hiervoren bepaalde zijn voorgeschreven, behoeft de spoorweg
      niet toe te laten. Worden deze echter toegelaten, dan vloeit daaruit voor de spoorweg geen verplichting of
      aansprakelijkheid voort.


      4. De afzender moet oude opschriften of plakbriefjes doorhalen of verwijderen.


      § 7 De spoorweg kan verlangen, dat:


      a. stukgoederen in zodanige staat ten vervoer worden aangeboden, dat zij zich lenen tot verwerking met daartoe bij
      de spoorweg gebruikelijke hulpmiddelen;


      b. kleine colli stukgoederen van dezelfde soort (klein ijzerwerk enz.) waarvan de aanneming ten vervoer en de
      behandeling niet zonder aanzienlijk tijdverlies kunnen geschieden, tot grotere eenheden worden samengebundeld of
      verpakt.


      § 8 Omtrent de verpakking en verlading van goederen, welke wegens hun eigenschappen bijzondere zorg vereisen of bij
      het vervoer hinder of gevaar kunnen opleveren, kunnen in de tarieven voorschriften worden opgenomen.


      § 9 Behoudens in de tarieven te maken uitzonderingen mogen licht breekbare voorwerpen, zoals aardewerk, glaswerk,
      porselein, voorwerpen, welke gemakkelijk in de wagen verstrooid zouden kunnen geraken (zoals fruit, noten, stenen,
      voederartikelen) en goederen, welke andere zendingen zouden kunnen verontreinigen of beschadigen (zoals as, gewone
      aarde, kalk, kolen, verfaarde) slechts als stukgoed worden verzonden, indien deze goederen zo zijn verpakt of
      samengebonden, dat zij niet kunnen breken, verloren gaan of andere zendingen verontreinigen of beschadigen.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel50
  - number: '51'
    text: >-
      § 1 Het aanbrengen van goederen en het laden van wagens door de afzender moet geschieden gedurende de door de
      spoorweg vastgestelde uren, welke op aanvraag worden medegedeeld.


      § 2 In de tarieven wordt bepaald, of de goederen door de spoorweg of door de afzender geladen moeten worden, tenzij
      dit reglement hieromtrent voorschriften bevat of tussen de afzender en de spoorweg een bijzondere overeenkomst
      is gesloten.


      § 3 Indien buiten schuld van de spoorweg een stukgoedzending niet binnen een in de tarieven te bepalen termijn,
      te rekenen van het ogenblik af, waarop de afzender met het aanbrengen der goederen begonnen is, gereed is om ten
      vervoer te worden aangenomen, kan de spoorweg voor de tijd, waarmee die termijn wordt overschreden, het in de
      tarieven te bepalen lig- of magazijngeld heffen.


      § 4 1. De afzender is verplicht de wagens, nodig voor het vervoer van goederen, welke door hem worden geladen, bij
      de spoorweg aan te vragen. De spoorweg kan verlangen, dat dit schriftelijk geschiedt.


      2. In de tarieven wordt bepaald, hetgeen in de aanvraag moet worden vermeld.


      3. De spoorweg geeft de afzender op diens verzoek kennis van het tijdstip, waarop hij over de wagens kan
      beschikken.


      § 5 1. Indien de aanvrager wagens afbestelt, vóórdat zij ter beschikking zijn gesteld, kan de spoorweg een in de
      tarieven te bepalen bedrag in rekening brengen.


      2. De spoorweg kan ter beschikking gestelde wagens terugnemen, indien de aanvrager na afloop van de in dit artikel
      bedoelde laadtermijn nog niet met laden is begonnen.


      3. Indien de aanvrager aan hem verstrekte wagens onbeladen aan de spoorweg teruggeeft of deze hem op grond van
      het vorige lid ontnomen worden, is hij het in de tarieven te bepalen staangeld verschuldigd. Het staangeld wordt
      berekend van het ogenblik af, waarop de wagens ter beschikking van de aanvrager zijn gesteld, tot dat, waarop hij
      niet meer de beschikking over de wagens heeft, met dien verstande, dat tenminste een bedrag in rekening kan worden
      gebracht gelijk aan het in lid 1 bedoelde bedrag.


      4. De spoorweg kan bij het aanvragen van wagens een waarborgsom vragen gelijk aan het bedrag van het staangeld voor
      één dag.


      § 6 1. De termijnen, binnen welke het laden door de afzender moet zijn afgelopen, worden in de tarieven bepaald.
      Als het tijdstip waarop het laden is afgelopen wordt aangemerkt het ogenblik waarop de zending geheel geladen is,
      met inbegrip van eventuele bedekking van de wagen en van de bevestiging van de lading, en de vrachtbrief aan het
      station van afzending aangeboden is.


      2. Indien buiten schuld van de spoorweg de zending niet binnen de in het vorige lid bedoelde termijn ten vervoer
      kan worden aangenomen, kan de spoorweg voor de tijd, waarmede die termijn wordt overschreden, het in de tarieven te
      bepalen staangeld heffen.


      3. Indien de laadtermijn met meer dan vierentwintig uur is overschreden, is de spoorweg bevoegd de wagens op kosten
      van de aanvrager te lossen en de wagens terug te nemen. Verder is de spoorweg bevoegd met de goederen te handelen
      als in artikel 73, § 2, is bepaald en voor de tijd, gedurende welke de goederen bij de spoorweg verblijven, het in
      de tarieven te bepalen lig-, magazijn- of staangeld te berekenen.


      § 7 1. Indien gevaar bestaat, dat de regelmatige afwikkeling van het verkeer door ophoping van goederen, hetzij op
      het gehele net, hetzij op een gedeelte daarvan dan wel op bepaalde stations wordt verstoord, is de spoorweg bevoegd
      de tijd, welke van het berekenen van lig- of magazijngeld is vrijgesteld, en de laadtermijn te verkorten, alsmede
      het lig-, magazijn- of staangeld en het in § 5, lid 1, bedoelde bedrag te verhogen.


      2. De verkorting van de tijd, welke van het berekenen van lig- en magazijngeld is vrijgesteld, en van de
      laadtermijn, alsmede de verhoging van het lig-, magazijn- of staangeld en van het in § 5, lid 1, bedoelde bedrag
      geschiedt met inachtneming van het in artikel 115 bepaalde.


      3. De spoorweg brengt deze maatregelen onverwijld ter kennis van het publiek. Zij treden niet in werking voordat ze
      ter kennis van het publiek zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel51
  - number: '53'
    text: >-
      § 1 1. Op verzoek van de afzender worden stukgoederen in de plaatsen, vermeld in de tarieven, door of namens de
      spoorweg afgehaald binnen de door de spoorweg daarvoor vastgestelde kring.


      2. In de tarieven wordt bepaald, welke goederen van afhaling zijn uitgesloten.


      3. Het adres, waar de goederen afgehaald moeten worden, moet langs harde rijwegen met de vervoermiddelen van de
      afhaaldienst bereikbaar zijn. De goederen dienen gelijkvloers met en in de onmiddellijke nabijheid van de harde weg
      gereed te liggen. De afzender moet desverlangd bij het laden hulp verlenen.


      4. De spoorweg brengt voor het afhalen een in de tarieven te bepalen bedrag in rekening.


      5. Indien bij aankomst van het voor het afhalen gebezigde vervoermiddel de goederen niet gereed liggen, kan dit
      vervoermiddel zijn rit vervolgen en is de afzender een in de tarieven te bepalen bedrag verschuldigd.


      § 2 De spoorweg beoordeelt eerst nadat de gehele zending met de vrachtbrief op het station van afzending aanwezig
      is, of de zending ten vervoer kan worden aangenomen. Is dit laatste niet het geval, dan wordt hiervan onverwijld
      kennis gegeven aan de afzender.


      § 3 In buitengewone omstandigheden, zoals bemoeilijking van de afhaaldienst door sneeuw of ijzel, is de spoorweg
      bevoegd:


      a. de in § 1, leden 4 en 5, bedoelde bedragen te verhogen tot in de tarieven te bepalen bedragen van ten hoogste
      het dubbele;


      b. de afhaaldienst geheel of gedeeltelijk te staken.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel53
  - number: '54'
    text: >-
      § 1 In de tarieven wordt bepaald, welke goederen in gesloten wagens en welke goederen op open wagens worden
      vervoerd en op welke wijze wordt gehandeld, indien de afzender het gebruik van een ander soort wagen voorschrijft
      dan volgens de tariefbepalingen in aanmerking komt, een en ander voor zover niet in dit reglement of in douane- of
      andere wettelijke dan wel ambtelijke voorschriften te dien aanzien bepaalde eisen worden gesteld.


      § 2 In de tarieven wordt bepaald onder welke voorwaarden de spoorweg speciale wagens en dekkleden voor het vervoer
      op open wagens ter beschikking stelt.
    url: https://wetten.overheid.nl/BWBR0002548/2002-01-01#Artikel54
  - number: '55'
    text: >-
      § 1 1. De afzender moet zó laden, dat geen gevaar kan ontstaan voor personen of goederen.


      2. De afzender moet met name bij de belading van de wagens de toelaatbare belading en het laadprofiel geldende voor
      de lijnen, waarover het vervoer plaats zal hebben, in acht nemen. De voor het vervoer over de in Nederland gelegen
      lijnen in acht te nemen toelaatbare belading en het geldende laadprofiel worden in de tarieven vermeld. De spoorweg
      geeft de afzender op diens verzoek de toelaatbare belading op.


      § 2 1. Indien het laden door de afzender geschiedt, is deze aansprakelijk voor alle gevolgen van een gebrekkige
      belading. Hij is verplicht de schade te vergoeden, die de spoorweg uit dien hoofde mocht hebben geleden. Het bewijs
      van de gebrekkige belading moet door de spoorweg worden geleverd.


      2. Artikel 49, § 4, is van overeenkomstige toepassing.


      § 3 In de tarieven wordt bepaald, hoe gehandeld wordt, indien wordt vastgesteld, dat het in § 1 bepaalde niet in
      acht is genomen, alsmede welke bedragen in dat geval verschuldigd zijn.


      § 4 De bepalingen van dit artikel zijn op overeenkomstige wijze van toepassing op het laden en lossen door de
      aanvrager van een wagen indien geen vervoerovereenkomst tot stand komt.
