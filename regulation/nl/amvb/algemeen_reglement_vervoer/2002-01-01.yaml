  - number: '59'
    text: |-
      § 1 Er zijn tarieven voor het vervoer van stukgoederen en van wagenladingen.

      § 2 Deze tarieven bevatten de algemene voorwaarden van de spoorweg, alsmede alle voor de berekening van de vracht
      en bijkomende kosten noodzakelijke gegevens.

      § 3 De vracht en bijkomende kosten worden, onverminderd het bepaalde in [artikel 31 van de Spoorwegwet][ref1],
      berekend overeenkomstig de op het tijdstip van de sluiting der vervoerovereenkomst voor het vervoer geldende
      tarieven.

      § 4 1. De spoorweg moet de volgens de tarieven verschuldigde vracht en bijkomende kosten, alsmede krachtens dit
      reglement verschuldigde boeten en de aanleiding tot de boeteheffing op de vrachtbrief vermelden.

      2. De vermelding van de vracht en bijkomende kosten behoeft niet te geschieden, indien dienaangaande
      overeenstemming is bereikt tussen de spoorweg en degene, die de verschuldigde vracht en bijkomende kosten voor zijn
      rekening neemt.

      3. In afwijking van lid 1 kunnen de vracht en de in de tarieven te vermelden bijkomende kosten voor wagenladingen
      met binnenlandse vrachtbrief op een periodieke afrekeningsstaat worden vermeld.

      § 5 De spoorweg mag behalve de krachtens dit reglement of de tarieven verschuldigde vracht, bijkomende kosten en
      boeten slechts de door hem gedane uitgaven en de door hem gemaakte kosten in rekening brengen. Deze uitgaven en
      kosten moeten behoorlijk worden vastgesteld en afzonderlijk worden vermeld op de vrachtbrief; bewijsstukken moeten
      worden bijgevoegd. Wanneer de betaling van deze uitgaven ten laste van de afzender komt, worden de bewijsstukken
      niet tegelijk met de vrachtbrief aan de geadresseerde, doch aan de afzender ter hand gesteld.

      § 6 De tarieven bepalen op welke stations goederen ten vervoer worden aangenomen en op welke stations goederen
      worden afgeleverd.


