  - number: '3'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004631/1990-11-29#Artikel3
  - number: '4'
    text: Dit besluit kan worden aangehaald als "Residubesluit diergeneesmiddelen".
    url: https://wetten.overheid.nl/BWBR0004631/1990-11-29#Artikel4
