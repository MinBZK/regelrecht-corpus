  url: https://wetten.overheid.nl/BWBR0004631/1990-11-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De uit een oogpunt van volksgezondheid aanvaardbare hoeveelheden van diergeneesmiddelen, bestanddelen daarvan
      of omzettingsprodukten, die ten hoogste op of in door Onze Minister in overeenstemming met Onze Minister van
      Welzijn, Volksgezondheid en Cultuur aan te wijzen voortbrengselen van dierlijke oorsprong mogen voorkomen, worden
      vastgesteld door Onze Minister in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur.

      2 Onder de krachtens het eerste lid vastgestelde hoeveelheid is mede begrepen een uit andere hoofde dan door de
      toepassing van diergeneesmiddelen aanwezige hoeveelheid van dezelfde stof.
    url: https://wetten.overheid.nl/BWBR0004631/1990-11-29#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister wijst in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur de methoden van
      onderzoek aan, die ter bepaling van de in het [artikel 1][ref1] bedoelde hoeveelheden dienen te worden toegepast.

      2 Voor zover op grond van het eerste lid geen methoden van onderzoek zijn aangewezen mag voor de bepaling van de in
      [artikel 1][ref2] bedoelde hoeveelheid een andere methode van onderzoek worden toegepast, indien deze methode voor
      het doel voldoende gevoelig, nauwkeurig en specifiek is en voorts een reproduceerbaar resultaat geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004631#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004631#Artikel1
    url: https://wetten.overheid.nl/BWBR0004631/1990-11-29#Artikel2
