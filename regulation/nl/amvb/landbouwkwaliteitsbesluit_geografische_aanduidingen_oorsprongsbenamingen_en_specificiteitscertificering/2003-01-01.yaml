preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 19 augustus 1993, nr. J.939620,
    Directie Juridische en Bedrijfsorganisatorische Zaken, gedaan mede namens de Minister van Economische Zaken;

    Gelet op Verordening (EEG) nr. 2081/92 van de Raad van de Europese Gemeenschappen van 14 juli 1992 inzake de
    bescherming van geografische aanduidingen en oorsprongsbenamingen van landbouwprodukten en levensmiddelen (PbEG
    L 208) en Verordening (EEG) nr. 2082/92 van de Raad van de Europese Gemeenschappen van 14 juli 1992 inzake de
    specificiteitscertificering van landbouwprodukten en levensmiddelen (PbEG L 208), alsmede de artikelen 2, 4, 7, 8
    en 9 van de Landbouwkwaliteitswet;

    Gezien de adviezen van:

    -. het Landbouwschap;

    -. het Produktschap voor Groenten en Fruit;

    -. het Hoofdproduktschap voor Akkerbouwprodukten;

    -. het Produktschap voor Vee en Vlees;

    -. het Produktschap voor Pluimvee en Eieren;

    -. het Produktschap voor Zuivel;

    -. het Produktschap voor Vis en Visprodukten;

    -. de Verenigde Nederlandse Voedsel- en Agrarische Industrie;

    -. de Stichting Nederlandse Vleeswarencontrole;

    -. de Stichting Centraal Orgaan Zuivelcontrole;

    -. het Kwaliteits-Controle-Bureau voor Groenten en Fruit;

    De Raad van State gehoord;

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 26 november 1993,
    nr. J.9316405, Directie Juridische en Bedrijfsorganisatorische Zaken, uitgebracht mede namens Onze Minister van
    Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      wet: [Landbouwkwaliteitswet][ref1];

      Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;

      [verordening 2081/92](31992R2081): [Verordening (EEG) nr. 2081/92](31992R2081) van de Raad van de Europese
      Gemeenschappen van 14 juli 1992 inzake de bescherming van geografische aanduidingen en oorsprongsbenamingen van
      landbouwprodukten en levensmiddelen (*Pb EG* L 208);

      [verordening 2082/92](31992R2082): [Verordening (EEG) nr. 2082/92](31992R2082) van de Raad van de Europese
      Gemeenschappen van 14 juli 1992 inzake de specificiteitscertificering van landbouwprodukten en levensmiddelen (*Pb
      EG* L 208);

      oorsprongsbenaming: benaming als bedoeld in artikel 2, tweede lid onder *a*, derde en vierde lid, van [verordening
      2081/92](31992R2081);

      geografische aanduiding: aanduiding als bedoeld in artikel 2, tweede lid, onder *b* van [verordening 2081/92]
      (31992R2081);

      specificiteit: specificiteit als bedoeld in artikel 2, eerste lid van [verordening 2082/92](31992R2082);

      specificiteitscertificering: de erkenning door de Europese Gemeenschappen van de specificiteit van een produkt door
      middel van registratie overeenkomstig [verordening 2082/92](31992R2082);

      produktdossier: produktdossier, als bedoeld in artikel 4 van [verordening 2081/92](31992R2081), respectievelijk
      artikel 6 van [verordening 2082/92](31992R2082);

      produkt: landbouwprodukt en levensmiddel als bedoeld in artikel 1, eerste lid, van [verordening 2081/92]
      (31992R2081), respectievelijk 2082/92;

      verhandelen: bedrijfsmatig in voorraad hebben, voorhanden hebben of te koop aanbieden, verkopen of afleveren;

      groepering: groepering als bedoeld in artikel 5, eerste lid, van [verordening 2081/92](31992R2081), respectievelijk
      artikel 2, tweede lid van [verordening 2082/92](31992R2082);

      Commissie: Commissie van de Europese Gemeenschappen;

      registratie: inschrijving van een geografische aanduiding, oorsprongsbenaming danwel specificiteitscertificering in
      het register bedoeld in artikel 6, derde lid, van [verordening 2081/92](31992R2081), respectievelijk artikel 3 van
      [verordening 2082/92](31992R2082).

      2 Het bepaalde bij of krachtens dit besluit is niet van toepassing op goederen die op regelmatige wijze zijn
      aangebracht en aangegeven of op regelmatige wijze zijn aangebracht onder geleide van een document voor communautair
      douanevervoer en die nog niet zijn vrijgegeven voor een van de douaneregelingen als bedoeld in artikel 4, onderdeel
      16, onder a, d of f, van [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van
      12 oktober 1992 tot vaststelling van het communautair douanewetboek (PbEG L 302).


      [ref1]: https://wetten.overheid.nl/BWBR0002755
    url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002755
  - number: '2'
    text: |-
      De bescherming van oorsprongsbenamingen en geografische aanduidingen, alsmede de certificering van de specificiteit
      van produkten worden verkregen overeenkomstig de bepalingen van [verordening 2081/92](31992R2081), respectievelijk
      2082/92, alsmede overeenkomstig het bepaalde bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden bij het verhandelen van produkten en bij de reclame voor produkten, een beschermde geografische
      aanduiding of beschermde oorsprongsbenaming danwel een specificiteitscertificering te bezigen tenzij is voldaan aan
      de artikelen 2, 3, 4, 12 en 13 van [verordening 2081/92](31992R2081), respectievelijk de artikelen 4, 5, 6, 13, 15
      en 16 van [verordening 2082/92](31992R2082), alsmede aan het bij of krachtens dit besluit bepaalde.

      2 Het eerste lid is van overeenkomstige toepassing bij aanduidingen of vermeldingen die de suggestie wekken
      dat het betrokken produkt een beschermde geografische aanduiding of beschermde oorsprongsbenaming danwel een
      specificiteitscertificering geniet.
    url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister beslist met inachtneming van de artikelen 2, 3, 4, 5, 9 en 14, derde lid, van [verordening 2081/92]
      (31992R2081) respectievelijk de artikelen 4, 5, 6, 7 en 11 van [verordening 2082/92](31992R2082), omtrent de
      doorzending aan de Commissie van aanvragen tot registratie, alsmede omtrent de doorzending aan de Commissie van
      verzoeken tot wijziging van een produktdossier.

      2 Bij ministeriële regeling worden nadere regels gesteld ten aanzien van de procedure omtrent:

        - het indienen en beoordelen van de in het eerste lid bedoelde aanvraag tot registratie of verzoeken tot wijziging
      van een produktdossier;
        - het indienen van bezwaar en het beoordelen van door derde-belanghebbenden gemaakte bedenkingen tegen door de
      Commissie voorgenomen registraties of wijzigingen van een produktdossier.
    url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister kan voor de toepassing van de in [artikel 4, tweede lid][ref1], bedoelde regels de medewerking
      vorderen van het Bestuur van het Hoofdproduktschap voor Akkerbouwprodukten.


      [ref1]: https://wetten.overheid.nl/BWBR0006327#Artikel4
    url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006327
        artikel: '4'
  - number: '6'
    text: |-
      1 Iedere in Nederland gevestigde producent of verwerker van produkten, zijnde een natuurlijke of rechtspersoon, die
      een aanvraag als bedoeld in [artikel 4][ref1] wenst in te dienen, sluit zich aan bij:

      a. de Stichting Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel te Leusden, indien de aanvraag een
      produkt betreft dat onder de wettelijke controlebevoegdheid van deze controle-instelling valt;

      b. het Kwaliteits-Controle-Bureau voor Groenten en Fruit te ’s-Gravenhage, indien de aanvraag een produkt betreft
      dat onder de wettelijke controlebevoegdheid van deze controle-instelling valt;

      c. de Stichting Controlebureau voor Pluimvee, Eieren en Eiprodukten te Zeist, indien de aanvraag een produkt
      betreft dat onder de wettelijke controlebevoegdheid van deze controle-instelling valt.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van iedere producent of verwerker die, zonder een
      aanvraag tot registratie te hebben ingediend, bij het verhandelen van produkten of bij de reclame voor produkten
      een beschermde geografische aanduiding of beschermde oorsprongsbenaming danwel een specificiteitscertificering
      bezigt.

      3 De controle-instellingen, bedoeld in het eerste lid, stellen een reglement vast omtrent de inhoud en het verloop
      van de door hen uit te oefenen controles. Bij ministeriële regeling kunnen nadere regels worden vastgesteld omtrent
      de in dit reglement vast te leggen voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006327#Artikel4
    url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006327
        artikel: '4'
  - number: '7'
    text: |-
      De in [artikel 6][ref1] genoemde controle-instellingen zijn belast met:

      a. het toezicht op de naleving door de bij hen aangeslotenen van het bij of krachtens dit besluit bepaalde;

      b. de keuring van produkten die een beschermde geografische aanduiding of beschermde oorsprongsbenaming danwel een
      specificiteitscertificering genieten teneinde te waarborgen dat deze produkten aan de eisen van het betreffende
      produktdossier voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006327#Artikel6
    url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006327
        artikel: '6'
  - number: '8'
    text: |-
      De voorzitters van de in [artikel 6][ref1] genoemde controle-instellingen mogen geen belang hebben bij de produktie
      of verhandeling van produkten waarvoor ingevolge [artikel 2][ref2] een communautaire beschermde geografische
      aanduiding of oorsprongsbenaming, dan wel een specificiteitscertificering kan worden of is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0006327#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006327#Artikel2
    url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006327
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0006327
        artikel: '2'
  - number: '9'
    text: |-
      1 Indien registratie betrekking heeft op produkten die niet vallen onder de wettelijke controlebevoegdheid van de
      in [artikel 6][ref1] genoemde controle-instellingen, is de ambtenaar van de Voedsel en Waren Autoriteit, zoals deze
      is ingesteld bij besluit van de Minister van Volksgezondheid, Welzijn en Sport van 8 juli 2002 (Stcrt. 127) belast
      met:

      a. het toezicht op de naleving van het bij of krachtens dit besluit bepaalde;

      b. de keuring van produkten die een beschermde geografische aanduiding of beschermde oorsprongsbenaming danwel een
      specificiteitscertificering genieten teneinde te waarborgen dat deze produkten aan de eisen van het betreffende
      produktdossier voldoen.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van iedere natuurlijke of rechtspersoon die
      in het verband van een groepering een aanvraag heeft ingediend en niet is aangesloten bij een van de in
      [artikel 6, eerste lid][ref2] genoemde controle-instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006327#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006327#Artikel6
    url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006327
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0006327
        artikel: '6'
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#Artikel10
  - number: '11'
    text: |-
      Dit besluit wordt aangehaald als: Landbouwkwaliteitsbesluit geografische aanduidingen, oorsprongsbenamingen en
      specificiteitscertificering.
    url: https://wetten.overheid.nl/BWBR0006327/2003-01-01#Artikel11
