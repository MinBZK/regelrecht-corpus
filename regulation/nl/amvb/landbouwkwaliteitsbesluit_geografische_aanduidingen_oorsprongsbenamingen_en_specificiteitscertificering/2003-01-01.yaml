$id: landbouwkwaliteitsbesluit_geografische_aanduidingen_oorsprongsbenamingen_en_specificiteitscertificering
regulatory_layer: AMVB
publication_date: '2007-09-27'
valid_from: '2003-01-01'
bwb_id: BWBR0006327
