      [Artikel 8 van de Premieregeling en aanvullende voorzieningen beroepsmilitairen van de krijgsmacht][ref1] 1982
      vervalt. Het blijft van kracht voor de voor 1 februari 1995 ontslagen militair, bedoeld in genoemd artikel.


