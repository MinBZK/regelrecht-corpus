  - number: '4'
    text: |-
      De loongerelateerde uitkeringen ingevolge [artikel 2][ref1] en [artikel 3, tweede en derde lid][ref2], bedragen
      70% van het dagloon, bedoeld in de [artikelen 44][ref3] tot en met [46 van de Werkloosheidswet][ref4] en de
      [Coördinatiewet Sociale Verzekering][ref5], met dien verstande dat het bedrag van de uitkeringen niet daalt
      beneden het minimumloon per maand, bedoeld in [artikel 8, eerste lid onderdeel ][ref6], of indien betrokkene jonger
      is dan 23 jaar, het voor zijn leeftijd geldende minimumloon per maand, bedoeld in [artikel 7, derde lid][ref7],
      van genoemde wet, beide vermeerderd met de daarover berekende vakantietoeslag, bedoeld in artikel 15 van die wet en
      vervolgens gedeeld door 21,75. Hetzelfde minimum geldt als niveau voor de niet-loongerelateerde uitkeringen bedoeld
      in [artikel 2][ref8].


