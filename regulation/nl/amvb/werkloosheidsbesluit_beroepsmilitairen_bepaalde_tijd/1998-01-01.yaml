    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007212/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder betrokkene: de militair die voor bepaalde
      tijd is aangesteld bij het beroepspersoneel van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0007212/1998-01-01#Artikel1
  - number: '2'
    text: |-
      1 Een betrokkene die op de datum van ontslag werkloos is in de zin van de [Werkloosheidswet][ref1] heeft recht op
      een uitkering overeenkomstig de normen en voorwaarden welke bij of krachtens die wet zijn vastgesteld, voor zover
      hierna niet anders is bepaald.

      2 Onze Minister van Defensie beslist over de toekenning van uitkering op aanvraag van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007212/1998-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '3'
    text: |-
      1 Indien een betrokkene op of na de datum van zijn ontslag uit hoofde van arbeidsongeschiktheid aanspraak heeft of
      krijgt op doorbetaling van zijn laatstgenoten bezoldiging, wordt de uitvoering van [artikel 2][ref1] opgeschort tot
      het einde van het tijdvak waarover die aanspraak bestaat.

      2 De betrokkene die in het genot is van een uitkering ingevolge [artikel 2][ref2] en die wegens ziekte verhinderd
      wordt arbeid te verrichten, ontvangt gedurende de tijd van bedoelde verhindering, doch ten hoogste gedurende een
      tijdvak van 52 weken een uitkering overeenkomstig het bepaalde bij of krachtens de [Ziektewet][ref3].

      3 De betrokkene, bedoeld in het tweede lid, die na afloop van het in dat lid genoemde tijdvak van 52 weken
      arbeidsongeschikt is, ontvangt zolang die ongeschiktheid duurt, doch uiterlijk tot de eerste dag van de
      maand waarin hij de leeftijd van 65 jaar bereikt, een uitkering overeenkomstig het bepaalde bij of krachtens
      de [Wet op de arbeidsongeschiktheidsverzekering][ref4]. Indien de betrokkene niet te kennen heeft gegeven
      dat hij in aanmerking wenst te worden gebracht voor een verlaging van de pensioenbijdrage, bedoeld in
      [artikel 10 van de Wet financiële voorzieningen privatisering ABP][ref5], is de hoogte van het vervolgdagloon
      bedoeld in [artikel 21][ref6], gelijk aan het dagloon bedoeld in artikel 21 van die wet.


