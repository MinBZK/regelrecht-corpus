    text: |-
      Indien de betrokkene tijdens het genot van de uitkering, bedoeld in [artikel 2][ref1] of
      [artikel 3, tweede of derde lid][ref2], overlijdt, bestaat aanspraak op een eenmalige uitkering overeenkomstig
      [artikel 35 van de Ziektewet][ref3], of [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref4].


