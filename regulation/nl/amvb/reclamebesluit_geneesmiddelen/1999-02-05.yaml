preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 21 maart 1994, GMV/G 94776;


    Gelet op:


    Gezien het advies van de Geneesmiddelencommissie (advies van 20 juli 1993, no. 4823);


    De Raad van State gehoord (advies van 1 augustus 1994, no. W13.94.0174);


    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 19 oktober 1994, GMV/G 943437;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. **reclame:** alle vormen van colportage, marktverkenning of stimulering die bedoeld zijn om de verkoop, het
      afleveren, het voorschrijven of het verbruik van geneesmiddelen te bevorderen;

      b. **de wet:** de [Wet op de Geneesmiddelenvoorziening][ref1];

      c. **het college:** het College ter beoordeling van geneesmiddelen, bedoeld in [artikel 29 van de wet][ref2];

      d. **beroepsbeoefenaren:** apothekers, apotheekhoudende artsen, apothekersassistenten in de zin van de wet,
      personen op wie [artikel 2][ref3] van toepassing is, alsmede artsen, tandartsen en verloskundigen;

      e. **ondernemingen:** rechtspersoonlijkheid bezittende organisaties waaraan een vergunning is verleend, als bedoeld
      in [artikel 2, eerste lid, onderdeel ][ref4].

      2 Tot reclame worden in elk geval gerekend:

      a. reclame, gericht op het publiek;

      b. reclame, gericht op degenen die bevoegd zijn om geneesmiddelen voor te schrijven of af te leveren, waaronder
      promotionele activiteiten zoals:

      1e. bezoeken van artsenbezoekers;

      2e. het verstrekken van monsters;

      3e. aansporing om geneesmiddelen voor te schrijven of af te leveren door voordelen in geld of natura toe te kennen,
      aan te bieden of in het vooruitzicht te stellen;

      4e. sponsoring van bijeenkomsten of wetenschappelijke congressen, meer in het bijzonder de vergoeding van reis- en
      verblijfkosten in dit verband.

      3 Onder reclame wordt mede verstaan: het aannemen of vragen van diensten of goederen in de omgang tussen
      farmaceutische ondernemingen en beroepsbeoefenaren in het kader van de beïnvloeding van de afzet van geregistreerde
      geneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel2f
      [ref4]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel1
    references:
      - id: ref1
