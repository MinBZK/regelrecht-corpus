        artikel: '2'
  - number: '2'
    text: >-
      Het is alleen aan degenen die bevoegd zijn tot uitoefening der artsenijbereidkunst, toegestaan reclame-activiteiten
      te verrichten of daartoe opdracht te verstrekken.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel2
  - number: '3'
    text: >-
      Reclame voor een geneesmiddel moet het rationele gebruik ervan bevorderen door het objectief voor te stellen zonder
      de eigenschappen ervan te overdrijven.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel3
  - number: '4'
    text: |-
      Reclame mag niet:

      a. in strijd zijn met de door het college goedgekeurde samenvatting van de kenmerken van het geneesmiddel, bedoeld
      in [artikel 2, eerste lid, onderdeel ][ref1] of

      b. misleidend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
  - number: '5'
    text: >-
      Tot het publiek gerichte reclame is verboden voor:


      a. geneesmiddelen die uitsluitend op recept mogen worden afgeleverd;


      b. geneesmiddelen die door apothekers of apotheekhoudende artsen, of onder hun toezicht, zijn bereid in hun
      apotheken.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel5
  - number: '6'
    text: >-
      Tot het publiek gerichte reclame moet zodanig zijn van vorm en inhoud dat daaruit duidelijk blijkt dat het reclame
      betreft en het product duidelijk als geneesmiddel wordt onderkend.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel6
  - number: '7'
    text: >-
      1 Tot het publiek gerichte reclame bevat tenminste:


      a. de benaming van het geneesmiddel en de algemene benaming, indien het geneesmiddel slechts één werkzaam
      bestanddeel bevat;


      b. de gegevens die voor een goed gebruik van het geneesmiddel onontbeerlijk zijn;


      c. een uitdrukkelijk en leesbaar verzoek om aandachtig de bijsluiter dan wel de tekst op de buitenverpakking te
      lezen.


      2 Het eerste lid, onderdelen *b* en *c*, is niet van toepassing indien de reclame uitsluitend tot doel heeft de
      benaming van het geneesmiddel in herinnering te brengen.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel7
  - number: '8'
    text: >-
      1 In tot het publiek gerichte reclame is niet toegestaan de vermelding van ernstige therapeutische indicaties,
      zoals:


      a. tuberculose;


      b. sexueel overdraagbare ziekten;


      c. andere ernstige infectieziekten;


      d. kanker en andere tumorziekten;


      e. chronische slapeloosheid;


      f. diabetes en andere stofwisselingsziekten.


      2 Bij ministeriële regeling kan Onze Minister een lijst vaststellen van indicaties, niet zijnde indicaties als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel8
  - number: '9'
    text: |-
      Tot het publiek gerichte reclame mag geen vermeldingen bevatten:

      a. waaruit zou blijken dat een medisch onderzoek of chirurgische ingreep overbodig is, in het bijzonder door een
      diagnose aan te bieden of een behandeling per briefwisseling aan te bevelen;

      b. waarbij wordt verwezen naar een aanbeveling door beoefenaars van de wetenschap, beroepsbeoefenaren uit de
      gezondheidssector of personen die weliswaar geen beoefenaars van de wetenschap of beroepsbeoefenaren uit de
      gezondheidssector zijn, maar toch door hun reputatie het gebruik van geneesmiddelen zouden kunnen stimuleren;

      c. waarin ten onrechte, op schrikwekkende of bedrieglijke wijze wordt verwezen naar genezenverklaringen;

      d. waarin ten onrechte, op schrikwekkende of bedrieglijke wijze gebruik wordt gemaakt van uitbeeldingen van
      veranderingen van het menselijk lichaam ten gevolge van ziekte of letsel of van de werking van een geneesmiddel in
      het menselijk lichaam;

      e. waarin wordt aangegeven dat het om een geregistreerd geneesmiddel gaat;

      f. waarbij ten aanzien van vrij verkrijgbare geneesmiddelen gewezen wordt op de mogelijkheid tot verstrekking
      daarvan ten laste van de [Algemene Wet Bijzondere Ziektekosten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '10'
    text: >-
      Tot het publiek gerichte reclame mag evenmin vermeldingen bevatten:


      a. die suggereren dat de werking van het geneesmiddel niet met bijwerking gepaard gaat en beter is dan of gelijk is
      aan de werking van een andere behandeling of van een ander geneesmiddel;


      b. die suggereren dat de normale goede gezondheid van een persoon door gebruik van het geneesmiddel kan worden
      verbeterd;


      c. die suggereren dat de normale goede gezondheid van een persoon kan worden aangetast wanneer het geneesmiddel
      niet wordt gebruikt;


      d. die suggereren dat de veiligheid of de werkzaamheid van het geneesmiddel te danken is aan het feit dat het om
      een natuurlijke stof gaat;


      e. die uitsluitend of voornamelijk op kinderen zijn gericht;


      f. die het geneesmiddel gelijkstellen met een voedingsmiddel, een kosmetisch product of andere consumptiegoederen;


      g. die door een beschrijving of een gedetailleerde uitbeelding van de ziektegeschiedenis tot een verkeerde
      zelfdiagnose kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel10
  - number: 10a
    text: >-
      1 In dit artikel wordt verstaan onder telewinkelboodschap: rechtstreekse aanbieding aan het publiek in een
      televisieprogramma met het oog op de levering tegen betaling van een geneesmiddel.


      2 Het is verboden telewinkelboodschappen uit te zenden of hiertoe opdracht te geven.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel10a
  - number: '11'
    text: |-
      1 Reclame die gericht is op personen die bevoegd zijn om geneesmiddelen voor te schrijven of af te leveren, bevat
      de volgende gegevens;

      a. de benaming van het geneesmiddel;

      b. overige gegevens van essentiële betekenis die verenigbaar zijn met de door het college goedgekeurde samenvatting
      van de kenmerken van het geneesmiddel, bedoeld in [artikel 2, eerste lid, onderdeel ][ref1];

      c. de indeling van het geneesmiddel met betrekking tot de aflevering.

      2 Bij de reclame worden prijzen of tarieven vermeld; tevens wordt vermeld of en zo ja, in hoeverre een geneesmiddel
      voor verstrekking ten laste van de [Algemene Wet Bijzondere Ziektekosten][ref2] in aanmerking komt.

      3 Het eerste lid, onderdelen *b* en *c*, en het tweede lid zijn niet van toepassing, indien de reclame uitsluitend
      ten doel heeft de benaming van het geneesmiddel in herinnering te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002614
  - number: '12'
    text: |-
      1 In alle documentatie die in het kader van de bevordering van de verkoop van een geneesmiddel wordt
      verstrekt aan personen die bevoegd zijn om het voor te schrijven of af te leveren, worden tenminste de in
      [artikel 11, eerste en tweede lid][ref1], bedoelde vermeldingen opgenomen en wordt tevens vermeld op welke datum de
      documentatie is opgesteld of laatstelijk is herzien.

      2 Alle gegevens die in de in het eerste lid bedoelde documentatie zijn opgenomen, zijn exact, actueel,
      verifieerbaar en voldoende volledig om de ontvanger in staat te stellen zich een beeld van de therapeutische waarde
      van het geneesmiddel te vormen.

      3 Citaten, tabellen en andere illustraties die aan medische tijdschriften of wetenschappelijke werken zijn ontleend
      en die in de documentatie worden gebruikt, worden exact weergegeven met nauwkeurige bronvermelding.


      [ref1]: https://wetten.overheid.nl/BWBR0006994#Artikel11
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006994
        artikel: '11'
        paragraaf: '3'
  - number: '13'
    text: |-
      1 Artsenbezoekers worden door de onderneming waar zij in dienst zijn, adequaat opgeleid en beschikken over
      voldoende wetenschappelijke kennis om over de geneesmiddelen die zij aanbieden, nauwkeurige en zo volledig
      mogelijke inlichtingen te verstrekken.

      2 Bij elk bezoek stellen artsenbezoekers voor elk geneesmiddel dat zij aanbieden, de door het college goedgekeurde
      samenvatting van de kenmerken van het geneesmiddel, bedoeld in [artikel 2, eerste lid, onderdeel ][ref1], aangevuld
      met de in [artikel 11, tweede lid][ref2], bedoelde vermeldingen, aan de bezochte persoon ter hand of houden zij die
      tot diens beschikking.

      3 Artsenbezoekers melden aan de in [artikel 22][ref3] bedoelde dienst alle hun door de bezochte personen
      meegedeelde informatie, in het bijzonder met betrekking tot ongewenste bijwerkingen, die op het gebruik van de
      geneesmiddelen waarvoor zij reclame maken, betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006994#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006994#Artikel22
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006994
        artikel: '11'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006994
        artikel: '22'
        paragraaf: '7'
  - number: '14'
    text: >-
      1 Het is verboden om in het kader van de bevordering van de verkoop van geneesmiddelen, aan personen die bevoegd
      zijn om geneesmiddelen voor te schrijven of af te leveren, premies of voordelen in geld of natura toe te kennen,
      aan te bieden of in het vooruitzicht te stellen, tenzij deze een geringe waarde hebben en van betekenis zijn voor
      de uitoefening van de geneeskunde of de farmacie.


      2 Het eerste lid vormt geen belemmering voor de gastvrijheid die direct of indirect wordt geboden bij manifestaties
      met een uitsluitend beroepsmatig en wetenschappelijk karakter waaraan één of meer farmaceutische ondernemingen
      een financiële bijdrage leveren. De gastvrijheid moet steeds binnen redelijke perken blijven en ondergeschikt zijn
      ten opzichte van het wetenschappelijke hoofddoel van de bijeenkomst; zij mag zich niet uitstrekken tot anderen dan
      de beroepsbeoefenaren.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel14
  - number: '15'
    text: >-
      Ten aanzien van bijeenkomsten, op kosten, geheel of gedeeltelijk, van één of meer farmaceutische ondernemingen en
      die belegd worden met het oog op de bevordering van de verkoop van geneesmiddelen, geldt dat de gastvrijheid steeds
      binnen redelijke perken moet blijven en ondergeschikt moet zijn aan het hoofddoel van de bijeenkomst; zij mag zich
      niet uitstrekken tot anderen dan de beroepsbeoefenaren.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel15
  - number: '16'
    text: |-
      Het aannemen van of vragen om diensten of goederen die verboden zijn krachtens [artikel 14, eerste lid][ref1],
      of strijdig zijn met [artikel 15][ref2], is aan personen die bevoegd zijn om geneesmiddelen af te leveren, niet
      toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006994#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006994#Artikel15
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006994
        artikel: '14'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006994
        artikel: '15'
        paragraaf: '5'
  - number: '17'
    text: |-
      De [artikelen 14][ref1], [15][ref2] en [16][ref3] laten bestaande maatregelen of handelspraktijken inzake prijzen,
      marges en kortingen onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0006994#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006994#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006994#Artikel16
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006994
        artikel: '14'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006994
        artikel: '15'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006994
        artikel: '16'
        paragraaf: '5'
  - number: '18'
    text: |-
      1 Onverminderd [artikel 16 van het Besluit bereiding en aflevering van farmaceutische producten][ref1], mogen
      geneesmiddelen als gratis monster uitsluitend worden afgeleverd aan personen die bevoegd zijn om geneesmiddelen
      voor te schrijven, mits zij voor een monster een schriftelijke, gedateerde en persoonlijk ondertekende aanvraag
      hebben ingediend.

      2 Een monster mag uitsluitend worden afgeleverd gedurende een tijdvak van twee jaren, te rekenen vanaf het tijdstip
      waarop een geneesmiddel in de handel wordt gebracht. Dat tijdstip wordt door de fabrikant, voordat tot aflevering
      van monsters wordt overgegaan, schriftelijk meegedeeld aan de hoofdinspecteur van de Volksgezondheid voor de
      geneesmiddelen.

      3 Binnen het in het tweede lid genoemde tijdvak mogen uitsluitend twee van de kleinste handelsverpakkingen als
      monster worden afgeleverd. Onder handelsverpakking wordt verstaan: de kennelijk voor aflevering aan particuliere
      verbruikers bestemde standaardverpakking waarin zich een geneesmiddel bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel16
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '16'
  - number: '19'
    text: |-
      1 Op een monster moet worden vermeld dat het gratis is en niet verkocht mag worden. Bij een monster moet een
      exemplaar van de door het college goedgekeurde samenvatting van de kenmerken van het geneesmiddel worden gevoegd.

      2 Van geneesmiddelen die middelen in de zin van de [Opiumwet][ref1] bevatten, mogen geen monsters worden
      afgeleverd.

      3 Bij regeling van Onze Minister kunnen, indien daartoe bijzondere aanleiding bestaat, regels worden gesteld ter
      verdere beperking van de aflevering van monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001941
  - number: '20'
    text: |-
      In deze paragraaf wordt onder vergunninghouder verstaan: degene aan wie krachtens
      [artikel 2, eerste lid, onderdeel ][ref1], vergunning is verleend tot uitoefening van de artsenijbereidkunst en die
      als zodanig verantwoordelijk is voor het in de handel brengen van een geneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '2'
  - number: '21'
    text: |-
      1 De vergunninghouder is verplicht na te gaan of de voorgenomen reclame-activiteiten van zijn onderneming in
      overeenstemming zijn met de bij of krachtens de wet gestelde voorschriften.

      2 Hij controleert of de artsenbezoekers die voor zijn onderneming werken, over een adequate opleiding beschikken en
      de hun krachtens [artikel 13, tweede en derde lid][ref1], opgelegde verplichtingen nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006994#Artikel13
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006994
        artikel: '13'
        paragraaf: '4'
  - number: '22'
    text: >-
      De vergunninghouder belast de wetenschappelijke voorlichtingsdienst binnen zijn onderneming met de beoordeling van
      de inhoud van reclame voor geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel22
  - number: '25'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel25
  - number: '26'
    text: 'Dit besluit wordt aangehaald als: Reclamebesluit geneesmiddelen.'
    url: https://wetten.overheid.nl/BWBR0006994/1999-02-05#Artikel26
