---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_toezicht_beleggingsinstellingen
regulatory_layer: AMVB
publication_date: '2005-08-04'
valid_from: '2003-12-01'
bwb_id: BWBR0004866
url: https://wetten.overheid.nl/BWBR0004866/2003-12-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 6 juni 1990, Generale Thesaurie, Directie Binnenlands
    Geldwezen, Afdeling Financiële Markten en Instellingen, nr BGW 90/1513;

    Gelet op artikel 5, eerste lid, artikel 6, vijfde lid, artikel 12, eerste en tweede lid, van de Wet toezicht
    beleggingsinstellingen (Stb. 1990, 380);

    Gezien het advies van De Nederlandsche Bank N.V. (van 21 mei 1990);

    De Raad van State gehoord (advies van 6 september 1990, nr W06.90 0251);

    Gezien het nader rapport van Onze Minister van Financiën van 21 september 1990 (nr BGW 90/2437);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet toezicht beleggingsinstellingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004809
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004809
  - number: 1.b
    text: |-
      accountant: een accountant als bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1],
      die niet in dienstbetrekking staat tot de beleggingsinstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1.c
    text: |-
      toezichthoudende autoriteit: Onze minister dan wel de rechtspersoon of rechtspersonen waaraan ingevolge
      [artikel 29 van de wet][ref1] taken en bevoegdheden zijn overgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
  - number: 1.d
    text: |-
      voorwaarden van de beleggingsinstelling: de statuten van de beleggingsmaatschappij, het reglement van het
      beleggingsfonds, de overeenkomst tussen de beleggingsinstelling en de bewaarder terzake van beheer en bewaring
      alsmede alle overige voorwaarden van beheer en bewaring;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel1
  - number: 1.e
    text: |-
      dochtermaatschappij: een rechtspersoon of vennootschap als bedoeld in [artikel 24][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 1.f
    text: |-
      grote belegger: een natuurlijk persoon of rechtspersoon die rechtstreeks of middellijk tenminste 25 procent
      bezit van de niet ingekochte uitstaande deelnemingsrechten of van de stemrechten van een beleggingsinstelling,
      haar beheerder of haar dochtermaatschappijen, of een natuurlijk persoon of rechtspersoon die rechtstreeks of
      middellijk een daarmee vergelijkbare zeggenschap kan uitoefenen in een beleggingsinstelling, haar beheerder of
      haar dochtermaatschappijen. Met een grote belegger wordt gelijkgesteld een natuurlijk persoon of rechtspersoon
      wiens deelnemingsrechten, stemrechten of vergelijkbare zeggenschap rechtstreeks of middellijk minder bedragen
      dan 25 procent, maar die tezamen met een of meer anderen dat percentage bereikt, indien hij en die anderen een
      gemeenschappelijk beleid voeren bij de uitoefening van hun stemrechten of de vergelijkbare zeggenschap.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel1
  - number: '2.1'
    text: |-
      Een bestuurder van de beleggingsinstelling of de bewaarder dient naar het oordeel van de toezichthoudende
      autoriteit voldoende deskundig te zijn in verband met de bedrijfsvoering van de beleggingsinstelling
      respectievelijk de bewaarder. Onder bestuurder wordt begrepen een ieder die de beleggingsinstelling of bewaarder
      krachtens wet, statuten of reglementen vertegenwoordigt dan wel binnen de beleggingsinstelling respectievelijk
      binnen de bewaarder het beleid bepaalt.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel2
  - number: '2.2'
    text: |-
      De betrouwbaarheid van de in het eerste lid bedoelde personen, de personen die het beleid van de
      beleggingsinstelling of de bewaarder mede bepalen en van overige personen die middellijk of onmiddellijk bevoegd
      zijn bestuurders als bedoeld in het eerste lid van de beleggingsinstelling respectievelijk de bewaarder te benoemen
      of te ontslaan, dient naar het oordeel van de toezichthoudende autoriteit buiten twijfel te staan.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel2
  - number: '3.1'
    text: De beleggingsinstelling dient te beschikken over een eigen vermogen van ten minste € 226 890,10.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel3
  - number: '3.2'
    text: De bewaarder dient te beschikken over een eigen vermogen van ten minste € 113 445,05.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel3
  - number: '3.3'
    text: |-
      De bewaarder dient voldoende zekerheid te stellen met het oog op de aansprakelijkheid voor schade die voor de
      bewaarder kan voortvloeien uit brand, vervoer van geld en waardepapieren, fraude en beroving.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel3
  - number: '4'
    text: |-
      Het dagelijks beleid binnen de beleggingsinstelling en binnen de bewaarder dient door ten minste twee personen te
      worden bepaald.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel4
  - number: '5.1'
    text: |-
      De voorwaarden van de beleggingsinstelling dienen ten minste te bepalen hetgeen staat vermeld in de bij dit besluit
      behorende [bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004866
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004866
  - number: '5.2'
    text: |-
      Indien aan de beleggingsinstelling een bewaarder is verbonden, dient tussen de beleggingsinstelling en de bewaarder
      een overeenkomst ter zake van beheer en bewaring te zijn gesloten waarbij partijen zich verplichten de voorwaarden
      als bedoeld in het eerste lid na te komen, voor zover deze voorwaarden betrekking hebben op de verhouding tussen de
      beleggingsinstelling en de bewaarder.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel5
  - number: '5.3'
    text: |-
      De toezichthoudende autoriteit is bevoegd nadere eisen aan de voorwaarden van de beleggingsinstelling te stellen
      indien de beleggingsinstelling een derde bij overeenkomst met taken inzake de administratie, inkoop, verkoop of
      bewaarneming van de door haar uitgegeven deelnemingsrechten belast.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel5
  - number: 5a
    text: |-
      De beleggingsinstelling en de bewaarder, indien aan de beleggingsinstelling verbonden, beschikken over maatregelen,
      gericht op het bevorderen en handhaven van een integere bedrijfsvoering, die voldoen aan het bepaalde bij en
      krachtens de [artikelen 15a tot en met 15c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel15a
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: 15a
        paragraaf: IV
  - number: '6.1'
    text: De beleggingsinstelling dient een prospectus beschikbaar te hebben over het aanbod van de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel6
  - number: '6.2'
    text: |-
      Het prospectus dient de gegevens te bevatten die voor de beleggers noodzakelijk zijn om zich een verantwoord
      oordeel te kunnen vormen over het aanbod van de beleggingsinstelling en dient daartoe ten minste de gegevens te
      bevatten als bedoeld in de bij dit besluit behorende [bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004866
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004866
  - number: '6.3'
    text: |-
      Het tweede lid geldt niet voor beleggingsinstellingen die niet onder [artikel 6, eerste lid, van de wet][ref1]
      vallen en waarvan deelnemingsrechten eerder in Nederland buiten een besloten kring zijn aangeboden, mits de
      beleggingsinstelling een schriftelijke verklaring kan overleggen van het bevoegde gezag als bedoeld in artikel
      105, eerste lid, van [richtlijn nr. 2001/34/EG](32001L0034) van het Europees Parlement en de Raad van de Europese
      Unie van 28 mei 2001 betreffende de toelating van effecten tot de officiële notering aan een effectenbeurs en de
      informatie die over deze effecten moeten worden gepubliceerd (PbEG L 184), waaruit blijkt dat het voor de toelating
      tot de notering gepubliceerde prospectus aan de bepalingen van de richtlijn, voor zover op de beleggingsinstelling
      van toepassing, voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
  - number: '6.4'
    text: |-
      Het tweede lid geldt niet voor beleggingsinstellingen die niet onder [artikel 6, eerste lid, van de wet][ref1]
      vallen en waarvan de deelnemingsrechten niet eerder in Nederland buiten een besloten kring zijn aangeboden, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
  - number: 6.4.a
    text: |-
      het aanbod in Nederland tot deelneming binnen ten hoogste zes maanden na vergunningverlening zal plaatsvinden in
      het kader van een aanbod buiten een besloten kring in een andere Lid-Staat; en
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel6
  - number: 6.4.b
    text: |-
      de beleggingsinstelling een schriftelijke verklaring kan overleggen van het bevoegde gezag als bedoeld in artikel
      20 van de Richtlijn van de Raad van de Europese Gemeenschappen van 17 april 1989 tot coördinatie van de eisen
      gesteld aan de opstelling van, het toezicht op en de verspreiding van het prospectus dat moet worden gepubliceerd
      bij een openbare aanbieding van effecten (89/298/EEG) (*PbEG* L 124), waaruit blijkt dat het prospectus aan de
      artikelen 7, 8 of 12 van die richtlijn, voor zover op de beleggingsinstelling van toepassing, voldoet.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel6
  - number: '6.5'
    text: |-
      Onverminderd het derde en vierde lid, geldt het tweede lid niet voor beleggingsinstellingen die niet onder
      [artikel 6, eerste lid, van de wet][ref1] vallen en waarvan de deelnemingsrechten tot de notering zijn
      toegelaten, of aannemelijk is dat die deelnemingsrechten daartoe spoedig zullen worden toegelaten, aan een door de
      toezichthoudende autoriteit aan te wijzen effectenbeurs. De toezichthoudende autoriteit is bevoegd om te verlangen
      dat bepaalde gegevens genoemd in de bij dit besluit behorende [bijlage B][ref2], welke niet zijn opgenomen in
      het prospectus dat is opgesteld in het kader van de notering aan een aangewezen effectenbeurs, aan het prospectus
      worden toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004866
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004866
  - number: '6.6'
    text: |-
      Ten aanzien van het prospectus als bedoeld in het tweede, vierde of vijfde lid is de toezichthoudende autoriteit
      bevoegd om te verlangen dat het prospectus in een of meer door de toezichthoudende autoriteit te bepalen talen
      moet worden gesteld, indien, gelet op de voorgenomen verspreiding van het prospectus, zulks naar het oordeel van de
      toezichthoudende autoriteit noodzakelijk is voor een adequate informatieverschaffing aan het publiek.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel6
  - number: 6a.1
    text: |-
      Een beleggingsinstelling behoort niet tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in
      zodanige mate ondoorzichtig is dat deze, naar het oordeel van de toezichthoudende autoriteit, een belemmering vormt
      voor het adequaat uitoefenen van toezicht op de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel6a
  - number: 6a.2
    text: |-
      Indien een beleggingsinstelling in een groep is verbonden met een natuurlijke persoon of rechtspersoon op wie,
      onderscheidenlijk waarop, het recht van een staat die geen lid-staat is, van toepassing is, mag het recht van
      die staat, naar het oordeel van de toezichthoudende autoriteit, niet een belemmering vormen voor het adequaat
      uitoefenen van toezicht op de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel6a
  - number: '7.1'
    text: 'Bij de aanvraag van een vergunning dient de beleggingsinstelling over te leggen:'
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel7
  - number: 7.1.a
    text: |-
      de namen van de personen als bedoeld in [artikel 2][ref1], alsmede stukken en gegevens op basis waarvan
      de toezichthoudende autoriteit kan beoordelen of deze personen voldoen aan de vereisten als bedoeld in
      [artikel 2][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel2
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '2'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '2'
        paragraaf: II
  - number: 7.1.b
    text: |-
      een verklaring van een accountant of een jaarrekening over het laatst verstreken boekjaar voorzien van een
      verklaring van een accountant, ten bewijze dat aan de vereisten in het [eerste en tweede lid van artikel 3][ref1]
      is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel3
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '3'
        paragraaf: II
  - number: 7.1.c
    text: |-
      gegevens en bescheiden ten bewijze dat aan het vereiste in het [derde lid van artikel 3][ref1] is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel3
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '3'
        paragraaf: II
  - number: 7.1.d
    text: |-
      de voorwaarden van de beleggingsinstelling als bedoeld in [artikel 5, eerste lid][ref1], en, indien van toepassing,
      de overeenkomst als bedoeld in [artikel 5, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel5
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '5'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '5'
        paragraaf: II
  - number: 7.1.e
    text: |-
      een beschrijving van de in [artikel 5a][ref1] bedoelde maatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel5a
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: 5a
        paragraaf: II
  - number: 7.1.f
    text: |-
      het prospectus als bedoeld in [artikel 6, eerste lid][ref1], en in voorkomende gevallen gegevens waaruit de
      toepasselijkheid van [artikel 6, derde, vierde of vijfde lid][ref2], blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel6
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '6'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '6'
        paragraaf: II
  - number: 7.1.g
    text: |-
      voor zover verschenen, de jaarrekeningen over de laatste drie boekjaren, en voor zover op grond van
      [boek 2 van het Burgerlijk Wetboek][ref1] vereist, de op die jaarrekeningen betrekking hebbende verklaringen,
      bedoeld in [artikel 393, vijfde lid, van dat boek][ref2], en de laatste halfjaarcijfers;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 7.1.h
    text: |-
      gegevens waaruit blijkt dat wordt voldaan aan de vereisten als bedoeld in [artikel 5, tweede lid][ref1],
      [artikel 6][ref2] en [artikel 9 van de wet][ref3], voor zover deze bepalingen van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel9
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '9'
  - number: 7.1.i
    text: |-
      overige gegevens en bescheiden die de toezichthoudende autoriteit naar zijn oordeel redelijkerwijs nodig heeft in
      het belang van de beoordeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel7
  - number: '7.2'
    text: |-
      Ter voldoening aan het eerste lid, onder *c*en *e*, kunnen de aldaar bedoelde gegevens en bescheiden rechtstreeks
      door de bewaarder aan de toezichthoudende autoriteit worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel7
  - number: '8'
    text: |-
      De in deze paragraaf opgenomen artikelen gelden uitsluitend voor beleggingsmaatschappijen als bedoeld in
      [artikel 6, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
  - number: '9.1'
    text: |-
      De beleggingsmaatschappij waarvan de rechten van deelneming zijn toegelaten tot de notering aan één of meer door
      de toezichthoudende autoriteit aan te wijzen effectenbeurzen of waarvan het aannemelijk is dat zij binnen één jaar
      na uitgifte tot de notering aan één of meer van de hiervoor bedoelde effectenbeurzen zullen worden toegelaten en
      door haar uitsluitend op die beurzen worden respectievelijk zullen worden verhandeld, is niet gehouden haar activa
      bij een bewaarder in bewaring te geven. Haar statuten vermelden in dat geval de methoden voor de berekening van de
      intrinsieke waarde van die rechten.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel9
  - number: '9.2'
    text: |-
      De beleggingsmaatschappij die haar rechten van deelneming voor ten minste tachtig procent op één of meer in de
      statuten vermelde effectenbeurzen verhandelt of waarvan het aannemelijk is dat zij binnen één jaar na uitgifte
      ten minste genoemd percentage op die beurzen zal verhandelen, is niet gehouden haar activa bij een bewaarder in
      bewaring te geven indien:
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel9
  - number: 9.2.a
    text: |-
      de toezichthoudende autoriteit van oordeel is dat de belangen van de deelnemers in die maatschappij genoegzaam
      worden beschermd;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel9
  - number: 9.2.b
    text: |-
      de rechten van deelneming zijn, dan wel binnen één jaar na uitgifte zullen worden toegelaten tot de notering op de
      effectenbeurs van de Lid-Staat waar zij verhandeld worden of zullen worden;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel9
  - number: 9.2.c
    text: |-
      de door de beleggingsmaatschappij buiten de beurs om verrichte transacties in haar rechten van deelneming slechts
      tegen beurskoers plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel9
  - number: 9.2.d
    text: |-
      de statuten de beurs vermelden waarvan de notering de prijs bepaalt voor de transacties die door de
      beleggingsmaatschappij in de Staat waar die beurs gelegen is, buiten de beurs om worden verricht;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel9
  - number: 9.2.e
    text: de statuten de methoden voor de berekening van de intrinsieke waarde van de rechten van deelneming vermelden; en
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel9
  - number: 9.2.f
    text: |-
      het prospectus de wijze vermeldt waarop de intrinsieke waarde van de rechten van deelneming wordt berekend, hoe,
      waar en met welke regelmaat deze waarde wordt gepubliceerd, alsmede de beurs in de Staat van verhandeling waarvan
      de notering de prijs bepaalt voor de transacties die door de beleggingsmaatschappij in die Staat buiten de beurs om
      worden verricht.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel9
  - number: '10'
    text: |-
      De beleggingsmaatschappij als bedoeld in [artikel 9][ref1] dient:


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel9
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '9'
        paragraaf: III
  - number: 10.a
    text: |-
      in de markt op te treden om te voorkomen dat de waarde van haar rechten van deelneming ter beurze meer dan vijf
      procent afwijkt van de intrinsieke waarde;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel10
  - number: 10.b
    text: |-
      de intrinsieke waarde van de rechten van deelneming dagelijks vast te stellen. Zij dient dit gegeven ten minste
      tweemaal per week ter kennis van de toezichthoudende autoriteit te brengen en dit gegeven ten minste tweemaal per
      maand algemeen bekend te maken, hetzij per advertentie in een of meer landelijk verspreide Nederlandse dagbladen
      hetzij aan het adres van iedere deelnemer, waarbij tussen elk van de tijdstippen van bekendmaking een periode van
      ten minste een week dient te liggen; en
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel10
  - number: 10.c
    text: |-
      een accountant op te dragen om zich ten behoeve van de beleggingsinstelling ten minste tweemaal per maand
      ervan te vergewissen dat de berekening van de waarde van rechten van deelneming plaatsvindt overeenkomstig
      de statuten van de beleggingsmaatschappij en dit besluit en dat de activa van de beleggingsmaatschappij
      zijn belegd in overeenstemming met de statuten van de beleggingsmaatschappij alsmede met de in de
      [artikelen 28 tot en met 42][ref1] vervatte regels, waarbij tussen elk van de tijdstippen van vergewissing een
      periode van ten minste een week dient te liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel28
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '28'
        paragraaf: V
  - number: '11.1'
    text: |-
      Een voorgenomen benoeming van personen als bedoeld in [artikel 11a][ref1] dient aan de toezichthoudende autoriteit
      te worden gemeld. Deze benoeming kan niet rechtsgeldig geschieden dan nadat de toezichthoudende autoriteit zijn
      instemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel11a
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: 11a
        paragraaf: IV
  - number: '11.2'
    text: 'Bij de in het eerste lid bedoelde melding legt de beleggingsinstelling over:'
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel11
  - number: 11.2.a
    text: |-
      de namen van de personen, bedoeld in [artikel 11a][ref1], alsmede bescheiden en gegevens op basis waarvan
      de toezichthoudende autoriteit kan beoordelen of deze personen voldoen aan de vereisten, bedoeld in
      [artikel 11a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel11a
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: 11a
        paragraaf: IV
      - id: ref2
        bwb_id: BWBR0004866
        artikel: 11a
        paragraaf: IV
  - number: 11.2.b
    text: |-
      overige gegevens en bescheiden die de toezichthoudende autoriteit naar zijn oordeel redelijkerwijs nodig heeft in
      het belang van de beoordeling van de voorgenomen benoeming.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel11
  - number: '11.3'
    text: |-
      Instemming wordt geacht te zijn verkregen indien de toezichthoudende autoriteit het voorstel tot benoeming niet
      heeft afgewezen binnen vier weken na ontvangst van het voorstel of, indien hij daarom heeft verzocht, binnen vier
      weken na ontvangst van de nadere inlichtingen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel11
  - number: '11.4'
    text: |-
      Ter voldoening aan het eerste lid en het tweede lid kunnen de in het tweede lid bedoelde gegevens en bescheiden
      rechtstreeks door de bewaarder aan de toezichthoudende autoriteit worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel11
  - number: 11a.1
    text: |-
      Een bestuurder van de beleggingsinstelling of de bewaarder dient naar het oordeel van de toezichthoudende
      autoriteit voldoende deskundig te zijn in verband met de bedrijfsvoering van de beleggingsinstelling
      onderscheidenlijk de bewaarder. Onder bestuurder wordt begrepen een ieder die de beleggingsinstelling of bewaarder
      krachtens wet, statuten of reglementen vertegenwoordigt dan wel binnen de beleggingsinstelling respectievelijk
      binnen de bewaarder het beleid bepaalt.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel11a
  - number: 11a.2
    text: |-
      De betrouwbaarheid van de in het eerste lid bedoelde personen, de personen die het beleid van de
      beleggingsinstelling of de bewaarder mede bepalen en van overige personen die middellijk of onmiddellijk bevoegd
      zijn bestuurders als bedoeld in het eerste lid van de beleggingsinstelling respectievelijk de bewaarder te benoemen
      of te ontslaan, dient naar het oordeel van de toezichthoudende autoriteit buiten twijfel te staan.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel11a
  - number: '12.1'
    text: |-
      De beleggingsinstelling dient te beschikken over een eigen vermogen van ten minste € 226 890,10. De
      beleggingsinstelling dient, indien het eigen vermogen minder bedraagt dan dit bedrag, de toezichthoudende
      autoriteit hiervan terstond in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel12
  - number: '12.2'
    text: |-
      De bewaarder dient te beschikken over een eigen vermogen van ten minste € 113 445,05. De beleggingsinstelling
      dient, indien het eigen vermogen van de bewaarder minder bedraagt dan dit bedrag, de toezichthoudende autoriteit
      hiervan terstond in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel12
  - number: '12.3'
    text: |-
      De bewaarder dient voldoende zekerheid te stellen met het oog op de aansprakelijkheid voor schade die
      voor de bewaarder kan voortvloeien uit brand, vervoer van geld en waardepapieren, fraude en beroving. De
      beleggingsinstelling dan wel de bewaarder, indien [artikel 7, tweede lid][ref1], van overeenkomstige toepassing
      is, dient, indien wijzigingen in de zekerheid tot gevolg hebben dat de zekerheid niet langer voldoende is, de
      toezichthoudende autoriteit hiervan terstond in kennis te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel7
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '7'
        paragraaf: II
  - number: '13'
    text: |-
      Het dagelijks beleid binnen de beleggingsinstelling en binnen de bewaarder dient door ten minste twee personen te
      worden bepaald. De beleggingsinstelling stelt, indien aan deze bepaling niet wordt voldaan, de toezichthoudende
      autoriteit hiervan terstond in kennis.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel13
  - number: '14.1'
    text: |-
      Een voorgenomen wijziging van de voorwaarden of de overeenkomst, bedoeld in [artikel 5][ref1], en een voorgenomen
      wijziging van de maatregelen, bedoeld in [artikel 5a][ref2], dient aan de toezichthoudende autoriteit te worden
      gemeld. Deze wijziging wordt niet van kracht voordat hij zijn instemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel5a
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '5'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0004866
        artikel: 5a
        paragraaf: II
  - number: '14.2'
    text: |-
      Op een wijziging zijn [artikel 5][ref1], [artikel 5a][ref2] en [artikel 7, eerste lid, onderdelen ][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0004866#Artikel7
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '5'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0004866
        artikel: 5a
        paragraaf: II
      - id: ref3
        bwb_id: BWBR0004866
        artikel: '7'
        paragraaf: II
  - number: '14.3'
    text: |-
      Instemming wordt geacht te zijn verkregen indien de toezichthoudende autoriteit het voorstel tot wijziging niet
      heeft afgewezen binnen vier weken na ontvangst van het voorstel of, indien hij daarom heeft verzocht, binnen vier
      weken na ontvangst van de nadere inlichtingen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel14
  - number: '14.4'
    text: |-
      Het eerste lid, tweede volzin, is niet van toepassing op een voorgenomen statutenwijziging indien deze eerst van
      kracht wordt nadat Onze minister van Justitie heeft verklaard dat hem ter zake van bezwaren niet is gebleken.
      Indien een voorgenomen statutenwijziging eerst van kracht wordt nadat Onze Minister van Justitie heeft verklaard
      dat hem ter zake van bezwaren niet is gebleken, kan Onze Minister van Justitie over de statutenwijziging advies
      inwinnen bij de toezichthoudende autoriteit. In dat geval is de toezichthoudende autoriteit verplicht dit advies
      uit te brengen. Onze Minister van Justitie stelt de toezichthoudende autoriteit op de hoogte van het feit dat hij
      een verklaring als bedoeld in de eerste zin heeft afgegeven dat wel heeft geweigerd af te geven.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel14
  - number: '14.5'
    text: |-
      [Artikel 5, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel5
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '5'
        paragraaf: II
  - number: '15'
    text: |-
      De administratieve organisatie van de beleggingsinstelling en, voor zover het de in bewaring gegeven activa
      betreft, van de bewaarder dient zodanige waarborgen te bieden dat grootte en samenstelling van en mutaties in het
      vermogen van de beleggingsinstelling getrouw en volledig worden verantwoord.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15
  - number: 15a.1
    text: |-
      De beleggingsinstelling en de bewaarder, indien aan de beleggingsinstelling verbonden, voeren een adequaat
      beleid ter zake van het tegengaan van verstrengeling van tegenstrijdige belangen. De beleggingsinstelling en de
      bewaarder, indien aan de beleggingsinstelling verbonden, dragen er zorg voor dat dit beleid zijn neerslag vindt in
      organisatorische en administratieve procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15a
  - number: 15a.2
    text: |-
      De toezichthoudende autoriteit stelt regels vast met betrekking tot de minimumvoorwaarden waaraan het beleid en de
      procedures en maatregelen, bedoeld in het eerste lid, moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15a
  - number: 15b.1
    text: |-
      De beleggingsinstelling en de bewaarder, indien aan de beleggingsinstelling verbonden, voeren een adequaat beleid
      dat ertoe strekt dat:
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15b
  - number: 15b.1.a
    text: |-
      betrokkenheid van de beleggingsinstelling bij strafbare feiten die het vertrouwen in de beleggingsinstelling of in
      de financiële markten in het algemeen schaden, wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15b
  - number: 15b.1.b
    text: |-
      betrokkenheid van de beleggingsinstelling bij handelingen die anderszins in het maatschappelijk verkeer zodanig
      onaanvaardbaar zijn dat deze het vertrouwen in de beleggingsinstelling of in de financiële markten in het algemeen
      schaden, wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15b
  - number: 15b.1.c
    text: |-
      niet wegens haar cliënten het vertrouwen in de beleggingsinstelling of in de financiële markten in het algemeen
      wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15b
  - number: 15b.2
    text: |-
      De beleggingsinstelling en de bewaarder, indien aan de beleggingsinstelling verbonden, dragen er zorg voor dat
      het in het eerste lid bedoelde beleid zijn neerslag vindt in organisatorische en administratieve procedures en
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15b
  - number: 15b.3
    text: |-
      De toezichthoudende autoriteit stelt regels vast met betrekking tot de voorwaarden waaraan het beleid en de
      procedures en maatregelen, bedoeld in het eerste en tweede lid, ten minste moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15b
  - number: 15c
    text: 'De in artikel 15b, tweede en derde lid, bedoelde procedures en maatregelen betreffen in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15c
  - number: 15c.a
    text: |-
      de behandeling en administratieve vastlegging van incidenten die een ernstig gevaar vormen voor een integere
      bedrijfsvoering van de beleggingsinstelling of van de bewaarder, indien aan de beleggingsinstelling verbonden,
      voorzover het betreft een gedraging van een personeelslid of van een persoon die het dagelijks beleid bepaalt dan
      wel mede bepaalt van de beleggingsinstelling of de bewaarder dan wel van een natuurlijke persoon of rechtspersoon
      die werkzaamheden verricht ten behoeve van de beleggingsinstelling of de bewaarder.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15c
  - number: 15c.b
    text: |-
      de beoordeling, met het oog op de belangen van deelnemers of toekomstige deelnemers van de beleggingsinstelling of
      van de bewaarder, indien aan de beleggingsinstelling verbonden, of de betrouwbaarheid van een personeelslid dat zij
      voornemens is te benoemen in een integriteitsgevoelige functie buiten twijfel staat. Onder integriteitsgevoelige
      functie wordt in dit verband verstaan:
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15c
  - number: 15c.b.1º
    text: |-
      een leidinggevende functie die is geplaatst direct onder het echelon van de bepalers en medebepalers van het
      dagelijks beleid van de beleggingsinstelling en van de bewaarder, indien aan de beleggingsinstelling verbonden;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15c
  - number: 15c.b.2º
    text: |-
      een functie waaraan overigens een bevoegdheid is verbonden die een wezenlijk risico bevat voor de integere
      bedrijfsvoering van de belegginsginstelling of van de bewaarder, indien aan de beleggingsinstelling verbonden.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15c
  - number: 15d.1
    text: |-
      De beleggingsinstelling of de bewaarder, indien aan de beleggingsinstelling verbonden, onderzoekt, op verzoek
      van de toezichthoudende autoriteit, of in haar administratie bepaalde personen of instellingen voorkomen die naar
      het oordeel van Onze Minister, in verband met vermoede terroristische activiteiten of daarmee verband houdende
      activiteiten, de integriteit van de financiële sector kunnen schaden.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15d
  - number: 15d.2
    text: |-
      De beleggingsinstelling of de bewaarder, indien aan de beleggingsinstelling verbonden, verstrekt de uitkomst van
      het in het eerste lid bedoelde onderzoek, binnen een door de toezichthoudende autoriteit vast te stellen termijn,
      aan de toezichthoudende autoriteit.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15d
  - number: 15e
    text: |-
      De beleggingsinstelling of de bewaarder, indien aan de beleggingsinstelling verbonden, meldt aan de
      toezichthoudende autoriteit ten behoeve van het toezicht op de naleving van het bij en krachtens de
      [artikelen 15a tot en met 15d][ref1] bepaalde de door de toezichthoudende autoriteit noodzakelijk geachte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel15a
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: 15a
        paragraaf: IV
  - number: '16'
    text: |-
      De beleggingsinstelling waarvan de deelnemingsrechten op verzoek van de deelnemers door haar vrij ingekocht en
      verkocht worden, dient ten minste dagelijks de intrinsieke waarde van die rechten te berekenen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel16
  - number: '17.1'
    text: |-
      De accountant, bedoeld in [artikel 12, vijfde lid, van de wet](onbekend), verstrekt op grond van het zevende lid
      van dat artikel aan de toezichthoudende autoriteit zo spoedig mogelijk alle inlichtingen die redelijkerwijs nodig
      zijn ten behoeve van het toezicht op de naleving van de wet over de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel17
  - number: 17.1.a
    text: het accountantsverslag aan de directie en de raad van commissarissen;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel17
  - number: 17.1.b
    text: de *management letter*;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel17
  - number: 17.1.c
    text: |-
      correspondentie tussen de accountant en de beleggingsinstelling en de bewaarder, indien aan de beleggingsinstelling
      verbonden, die rechtstreeks betrekking heeft op de accountantsverklaring bij de jaarrekening van de
      beleggingsinstelling en de bewaarder.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel17
  - number: '17.2'
    text: |-
      Indien de accountant, bedoeld in het eerste lid, schriftelijk inlichtingen verstrekt aan de toezichthoudende
      autoriteit over de in het voorgaande lid genoemde onderwerpen, zendt hij onverwijld aan de beleggingsinstelling en
      de bewaarder een afschrift van de stukken en van de begeleidende brief.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel17
  - number: '18.1'
    text: |-
      Bij aanbod van de rechten van deelneming buiten een besloten kring dan wel bij de schriftelijke aankondiging dat
      een aanbod buiten een besloten kring zal worden gedaan, dient de beleggingsinstelling uiterlijk op de dag voor
      de dag van uitgifte, van openstelling van deelneming of van de schriftelijke aankondiging van openstelling, een
      prospectus kosteloos algemeen verkrijgbaar te stellen. [Artikel 6, tweede tot en met zesde lid][ref1], is van
      overeenkomstige toepassing. In iedere bekendmaking waarin deelnemingsrechten worden aangeboden, worden de plaatsen
      vermeld waar het prospectus voor het publiek verkrijgbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel6
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '6'
        paragraaf: II
  - number: '18.2'
    text: |-
      De beleggingsinstelling waarvan de rechten van deelneming niet door haar vrij ingekocht en verkocht worden, dient
      bij iedere nieuwe uitgifte of openstelling van deelneming buiten een besloten kring de gegevens in het prospectus
      die van wezenlijk belang zijn, te actualiseren.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel18
  - number: '18.3'
    text: |-
      De beleggingsinstelling waarvan de rechten van deelneming op verzoek van de deelnemers door haar vrij ingekocht en
      verkocht worden, dient de gegevens in het prospectus die van wezenlijk belang zijn, te actualiseren zodra daartoe
      aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel18
  - number: '18.4'
    text: |-
      Op de ingevolge het tweede en derde lid te verstrekken gegevens is [artikel 6, tweede tot en met zesde lid][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel6
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '6'
        paragraaf: II
  - number: '18.5'
    text: |-
      Het prospectus en de geactualiseerde gegevens mogen pas verkrijgbaar worden gesteld na toezending aan de
      toezichthoudende autoriteit.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel18
  - number: '19.1'
    text: |-
      De beleggingsinstelling dient voor zover [boek 2 van het Burgerlijk Wetboek][ref1] niet reeds van toepassing is
      jaarlijks een jaarrekening en een jaarverslag van de beleggingsinstelling op te stellen. Na afloop van de eerste
      helft van het boekjaar dienen tevens de halfjaarcijfers van de beleggingsinstelling te worden opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '19.2'
    text: |-
      Indien een beleggingsmaatschappij of een beleggingsfonds niet reeds aan de bepalingen van
      [titel 9 van boek 2 van het Burgerlijk Wetboek][ref1] is onderworpen, zijn de zojuist vermelde
      bepalingen van overeenkomstige toepassing op de jaarrekening, de overige gegevens als bedoeld in
      [artikel 392 van boek 2 van het Burgerlijk Wetboek][ref2], en het jaarverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '19.3'
    text: |-
      De jaarrekening dient te zijn voorzien van een verklaring omtrent de getrouwheid, ondertekend door een accountant,
      aan wie de beleggingsinstelling de opdracht tot onderzoek van de jaarrekening heeft verstrekt. Deze verklaring
      dient in te houden dat de jaarrekening een getrouw beeld geeft van de grootte en de samenstelling van het vermogen
      van de beleggingsinstelling en van het resultaat over het desbetreffende boekjaar.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel19
  - number: '20.1'
    text: |-
      Jaarlijks binnen vier maanden na afloop van het boekjaar dient de vastgestelde of goedgekeurde jaarrekening van
      een beleggingsinstelling, of indien de vaststelling of goedkeuring niet behoeft plaats te vinden of nog niet heeft
      plaatsgevonden, de opgemaakte jaarrekening gelijktijdig met het jaarverslag en de overige gegevens als bedoeld in
      [artikel 392 van boek 2 van het Burgerlijk Wetboek][ref1] openbaar te worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '20.2'
    text: |-
      De openbaarmaking dient te geschieden overeenkomstig de bepalingen van
      [titel 9 van boek 2 van het Burgerlijk Wetboek][ref1]. De jaarrekening, de overige gegevens als bedoeld in
      [artikel 392 van boek 2 van het Burgerlijk Wetboek][ref2] en het jaarverslag worden voor de deelnemers kosteloos
      verkrijgbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '20.3'
    text: |-
      Gelijktijdig met de openbaarmaking van de jaarrekening dient de beleggingsinstelling in één of meer landelijk
      verspreide Nederlandse dagbladen dan wel aan het adres van iedere deelnemer, opgave te doen van de plaats waar de
      jaarrekening, alsmede het jaarverslag en de overige gegevens voor de deelnemers verkrijgbaar zijn. Gelijktijdig met
      de openbaarmaking dient de beleggingsinstelling een afschrift van deze stukken aan de toezichthoudende autoriteit
      te zenden.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel20
  - number: '20.4'
    text: |-
      Jaarlijks binnen negen weken na afloop van de eerste helft van het boekjaar, dient de beleggingsinstelling
      overeenkomstig het gestelde in het derde lid de halfjaarcijfers van de beleggingsinstelling openbaar te maken.
      Zij dient deze voor de deelnemers kosteloos verkrijgbaar te stellen. Gelijktijdig met de openbaarmaking dient de
      beleggingsinstelling een afschrift van de halfjaarcijfers aan de toezichthoudende autoriteit te zenden.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel20
  - number: '21.1'
    text: |-
      Onverminderd het bepaalde in [artikel 19, tweede lid][ref1], dient de toelichting op de balans en de winst- en
      verliesrekening van de beleggingsinstelling ten minste de volgende gegevens te bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel19
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '19'
        paragraaf: IV
  - number: 21.1.a
    text: |-
      een sluitend overzicht van het verloop gedurende het boekjaar van de beleggingen waarbij de beleggingen worden
      onderscheiden naar soort;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
  - number: 21.1.b
    text: |-
      de samenstelling van de beleggingen per het einde van het boekjaar, uitgesplitst volgens maatstaven die het best
      passen bij het beleggingsbeleid van de instelling;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
  - number: 21.1.c
    text: |-
      een vergelijkend overzicht over de laatste drie jaren van de intrinsieke waarde van de beleggingsinstelling, het
      aantal uitstaande rechten van deelneming en de intrinsieke waarde per recht van deelneming, een en ander per het
      einde van het boekjaar;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
  - number: 21.1.d
    text: |-
      een mededeling in hoeverre beleggingen, met uitzondering van beleggingen in effecten die tot de notering aan een
      effectenbeurs zijn toegelaten, door een beëdigde taxateur zijn getaxeerd, volgens welke methode de taxatie heeft
      plaatsgevonden, alsmede de regelmaat waarmee deze taxaties worden verricht;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
  - number: 21.1.e
    text: |-
      het bedrag der verplichtingen, onderscheiden naar soort per het einde van het boekjaar, die voortvloeien uit
      dekkingstransacties met betrekking tot koers- en wisselkoersrisico in verband met de beleggingen, voor zover een en
      ander niet reeds in de balans en winst- en verliesrekening is begrepen;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
  - number: 21.1.f
    text: |-
      een gespecificeerde opgave van die beleggingen van de beleggingsinstelling die deelnemingen zijn in de zin van
      [artikel 389, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel389
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '389'
  - number: '21.2'
    text: |-
      Onverminderd [artikel 379, derde lid, boek 2 van het Burgerlijk Wetboek][ref1] dient de beleggingsinstelling onder
      de overige gegevens, bedoeld in [artikel 19, tweede lid][ref2], aan te geven:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel379
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel19
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '379'
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '19'
        paragraaf: IV
  - number: 21.2.a
    text: |-
      het totale persoonlijke belang dat de leden van de directie en van de raad van commissarissen van de
      beleggingsinstelling bij een belegging van de beleggingsinstelling hebben of op enig moment gedurende het boekjaar
      hebben gehad;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
  - number: 21.2.b
    text: het totale aantal grote beleggers dat in haarzelf of haar dochtermaatschappijen heeft belegd;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
  - number: 21.2.c
    text: |-
      het totale aantal transacties van haarzelf of haar dochtermaatschappijen met de grote beleggers alsmede het totale
      bedrag dat met deze transacties is gemoeid.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
  - number: '21.3'
    text: |-
      De verplichting, bedoeld in het tweede lid, onder *c*, geldt niet voor transacties terzake van de aan- en verkoop
      van deelnemingsrechten in de beleggingsinstelling of haar dochtermaatschappijen en ook niet voor transacties
      terzake van de aan- en verkoop van effecten die genoteerd zijn op een door de toezichthoudende autoriteit aan
      te wijzen effectenbeurs. Bij de vermelding dient een splitsing te worden aangebracht tussen transacties die de
      beleggingsportefeuille van de beleggingsinstelling betreffen en overige transacties.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
  - number: '21.4'
    text: |-
      Indien de beleggingsinstelling aan een van de in het tweede lid, onder *b* en *c*, genoemde informatievereisten
      niet kan voldoen, dient zij dit te vermelden onder de overige gegevens, bedoeld in [artikel 19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel19
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '19'
        paragraaf: IV
  - number: '21.5'
    text: |-
      De informatievereisten, bedoeld in het tweede lid, onder *b* en *c*, ten aanzien van dochtermaatschappijen, gelden
      niet indien de beleggingsinstelling de enige grote belegger in haar dochtermaatschappij is.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel21
  - number: '22.1'
    text: 'De halfjaarcijfers van de beleggingsinstelling dienen ten minste de volgende gegevens te bevatten:'
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel22
  - number: 22.1.a
    text: |-
      de balans en winst- en verliesrekening, alsmede een mutatie-overzicht van het eigen vermogen van de
      beleggingsmaatschappij of van het vermogen van het beleggingsfonds met inachtneming, voor zover de aard van deze
      stukken dat toelaat, van de bepalingen van [titel 9 van boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 22.1.b
    text: |-
      een overzicht van de samenstelling van de beleggingsportefeuille als bedoeld in
      [artikel 21, eerste lid, onder b][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel21
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '21'
        paragraaf: IV
  - number: 22.1.c
    text: |-
      een opgave van de intrinsieke waarde van de beleggingsinstelling, het aantal uitstaande deelnemingsrechten en de
      intrinsieke waarde per recht van deelneming;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel22
  - number: 22.1.d
    text: |-
      de gegevens, bedoeld in [artikel 21, tweede lid, onder b en c][ref1], waarbij [artikel 21, vierde lid][ref2], van
      overeenkomstige toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel21
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '21'
        paragraaf: IV
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '21'
        paragraaf: IV
  - number: 22.1.e
    text: |-
      indien van toepassing, de vermelding, bedoeld in [artikel 21, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel21
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '21'
        paragraaf: IV
  - number: '22.2'
    text: |-
      Wanneer de beleggingsinstelling een interim-dividend heeft uitgekeerd of voornemens is dat te doen, dient hiervan
      in de halfjaarcijfers melding te worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel22
  - number: '22.3'
    text: |-
      Indien de halfjaarcijfers door een accountant zijn onderzocht, dient zijn verklaring bij de in het eerste lid
      bedoelde stukken te worden gevoegd. [Artikel 19, derde en vierde lid][ref1], is alsdan van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel19
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '19'
        paragraaf: IV
  - number: '23.1'
    text: 'De beleggingsinstelling dient tegen ten hoogste de kostprijs desgevraagd aan een ieder te verstrekken:'
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23
  - number: 23.1.a
    text: |-
      de gegevens omtrent de beleggingsinstelling alsmede, indien een bewaarder aan de beleggingsinstelling is verbonden,
      omtrent de bewaarder, welke ingevolge wettelijk voorschrift in het handelsregister moeten worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23
  - number: 23.1.b
    text: |-
      de voorwaarden van de beleggingsinstelling en de overeenkomst als bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel5
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '5'
        paragraaf: II
  - number: '23.2'
    text: |-
      De beleggingsinstelling dient een afschrift van haar vergunning, van de ingevolge
      [artikel 8 van de wet][ref1] daaraan gestelde beperkingen en verbonden voorschriften alsmede van een ingevolge
      [artikel 12, vierde lid, van de wet][ref2] gegeven beschikking kosteloos ter inzage te leggen voor en tegen ten
      hoogste de kostprijs desgevraagd af te geven aan de deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '12'
  - number: '23.3'
    text: |-
      De beleggingsinstelling dient ten behoeve van de deelnemers maandelijks een opgave met toelichting beschikbaar te
      hebben en een afschrift daarvan tegen ten hoogste de kostprijs desgevraagd af te geven aan de deelnemers, waarbij
      tussen de tijdstippen van beschikbaarstelling een periode van ten minste een week dient te liggen. De opgave dient
      mede door de bewaarder te zijn ondertekend en dient ten minste de volgende gegevens te bevatten:
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23
  - number: 23.3.a
    text: de totale waarde van de beleggingen van de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23
  - number: 23.3.b
    text: een overzicht van de samenstelling van de beleggingen;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23
  - number: 23.3.c
    text: het aantal uitstaande rechten van deelneming;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23
  - number: 23.3.d
    text: |-
      door de beleggingsinstelling waarvan de deelnemingsrechten op verzoek van de deelnemers vrij ingekocht en verkocht
      worden, voorts de waarde per recht van deelneming, waarin verwerkt dienen te zijn: - de kosten van aanmaak;
        - de kosten van beheer;
        - de kosten van royement;
        - de overige kosten.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23
  - number: '23.4'
    text: |-
      De in [artikel 16][ref1] bedoelde beleggingsinstelling, waarvan de deelnemingsrechten niet zijn toegelaten tot de
      notering aan een door de toezichthoudende autoriteit aangewezen effectenbeurs, dient op verzoek van een ieder de
      ingevolge dat artikel dagelijks berekende intrinsieke waarde mede te delen.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel16
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '16'
        paragraaf: IV
  - number: '23.5'
    text: |-
      De beleggingsinstelling dient binnen vijf werkdagen de toezichthoudende autoriteit schriftelijk in kennis te
      stellen van iedere wijziging in de gegevens omtrent zijn bedrijf of het bedrijf van de bewaarder zoals opgenomen in
      het handelsregister.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23
  - number: 23a.1
    text: |-
      Een beleggingsinstelling behoort niet tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in
      zodanige mate ondoorzichtig is dat deze, naar het oordeel van de toezichthoudende autoriteit, een belemmering vormt
      voor het adequaat uitoefenen van toezicht op de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23a
  - number: 23a.2
    text: |-
      Indien een beleggingsinstelling in een groep is verbonden met een natuurlijke persoon of een rechtspersoon op
      wie, onderscheidenlijk waarop, het recht van een staat die geen lid-staat is, van toepassing is, mag het recht
      van die staat, naar het oordeel van de toezichthoudende autoriteit, niet een belemmering vormen voor het adequaat
      uitoefenen van toezicht op de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel23a
  - number: '24'
    text: |-
      De in deze paragraaf opgenomen artikelen gelden uitsluitend voor beleggingsinstellingen als bedoeld in
      [artikel 6, eerste lid, van de wet][ref1] waaraan op grond van dat artikel een vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
  - number: '25'
    text: |-
      Het is de beleggingsinstelling en de bewaarder die voor rekening van de beleggingsinstelling optreedt, niet
      toegestaan voor rekening van derden kredieten te verstrekken, zich garant te stellen of borgtochtverplichtingen aan
      te gaan.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel25
  - number: '26'
    text: |-
      Het is de beleggingsinstelling en de bewaarder die voor rekening van de beleggingsinstelling optreedt niet
      toegestaan effecten te verkopen die de beleggingsinstelling niet in portefeuille heeft.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel26
  - number: '27.1'
    text: |-
      Het is de beleggingsinstelling en de bewaarder die voor rekening van de beleggingsinstelling optreedt niet
      toegestaan als debiteur geldleningen aan te gaan.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel27
  - number: '27.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel27
  - number: 27.2.a
    text: tijdelijke leningen die gezamenlijk niet meer bedragen dan tien procent van de activa van de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel27
  - number: 27.2.b
    text: |-
      leningen voor het verwerven van onroerende goederen die rechtstreeks noodzakelijk zijn voor de uitoefening van de
      werkzaamheden van de beleggingsmaatschappij en die gezamenlijk niet meer bedragen dan tien procent van haar activa,
      voor zover de omvang van deze geldleningen tezamen met de omvang van de onder *a* genoemde leningen niet meer
      bedraagt dan vijftien procent van haar activa;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel27
  - number: 27.2.c
    text: |-
      leningen met als doel de verwerving van vreemde valuta waardoor de netto schuld van de beleggingsinstelling niet
      verandert of zal veranderen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel27
  - number: '28.1'
    text: 'De gelden van de beleggingsinstelling dienen slechts in de volgende soorten effecten te worden belegd:'
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel28
  - number: 28.1.a
    text: aandeelbewijzen, schuldbrieven, winst- en oprichtersbewijzen, warrants, en soortgelijke waardepapieren;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel28
  - number: 28.1.b
    text: |-
      rechten van deelgenootschap, inschrijvingen in aandelen- en schuldregisters, en soortgelijke, al dan niet
      voorwaardelijke, rechten; of
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel28
  - number: 28.1.c
    text: certificaten en recepissen van waarden als hiervoor bedoeld.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel28
  - number: '28.2'
    text: |-
      Voorts dienen de gelden van de beleggingsinstelling, met inachtneming van het eerste lid, slechts te worden belegd
      in effecten:
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel28
  - number: 28.2.a
    text: die zijn toegelaten tot de notering aan een effectenbeurs in een Lid-Staat;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel28
  - number: 28.2.b
    text: die worden verhandeld op een andere geregelde, regelmatig functionerende, erkende open markt in een Lid-Staat;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel28
  - number: 28.2.c
    text: |-
      die zijn toegelaten tot de notering aan een effectenbeurs dan wel worden verhandeld op een andere geregelde,
      regelmatig functionerende, erkende open markt buiten het grondgebied van de Europese Gemeenschappen, mits de
      statuten of reglementen daarin voorzien;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel28
  - number: 28.2.d
    text: |-
      waarvan het aannemelijk is dat zij binnen één jaar na uitgifte zullen worden toegelaten tot de notering aan een
      effectenbeurs of ter verhandeling zullen worden aangeboden op een andere geregelde, regelmatig functionerende,
      erkende open markt, mits de statuten of reglementen daarin voorzien.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel28
  - number: '29'
    text: |-
      In afwijking van [artikel 28][ref1] kan de beleggingsinstelling:


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel28
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '28'
        paragraaf: V
  - number: 29.a
    text: |-
      voor ten hoogste tien procent van haar activa beleggen in andere effecten dan bedoeld in
      [artikel 28, tweede lid][ref1], en in courante, verhandelbare en liquide vorderingen, waarvan de waarde ten minste
      twee maal per maand nauwkeurig kan worden bepaald, indien de toezichthoudende autoriteit deze vorderingen met
      effecten gelijk heeft gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel28
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '28'
        paragraaf: V
  - number: 29.b
    text: |-
      indien zij een beleggingsmaatschappij is, goederen verwerven die rechtstreeks noodzakelijk zijn voor de uitoefening
      van haar werkzaamheid;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel29
  - number: 29.c
    text: accessoir liquide middelen aanhouden.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel29
  - number: '30'
    text: |-
      Het is de beleggingsinstelling niet toegestaan edele metalen dan wel certificaten die deze metalen
      vertegenwoordigen te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel30
  - number: '31.1'
    text: |-
      De beleggingsinstelling mag uitsluitend met het oog op een goed portefeuillebeheer zich bedienen van technieken en
      instrumenten met betrekking tot beleggingen in effecten.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel31
  - number: '31.2'
    text: |-
      De beleggingsinstelling mag technieken en instrumenten toepassen om wisselkoersrisico's in het kader van het beheer
      van het vermogen te dekken.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel31
  - number: '32.1'
    text: |-
      De beleggingsinstelling mag tot ten hoogste tien procent van haar activa beleggen in effecten, uitgegeven door een
      zelfde uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel32
  - number: '32.2'
    text: |-
      De totale waarde van de effecten uitgegeven door instellingen waarin door de beleggingsinstelling voor meer dan
      vijf procent van haar activa wordt belegd, dient niet meer te bedragen dan veertig procent van de activa van de
      beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel32
  - number: '33.1'
    text: |-
      In afwijking van [artikel 32, eerste lid][ref1], mag de beleggingsinstelling tot ten hoogste vijfentwintig procent
      van haar activa beleggen in obligaties die worden uitgegeven door een kredietinstelling die haar zetel heeft in
      een Lid-Staat en die ingevolge de wet van die Staat is onderworpen aan een bijzonder overheidstoezicht met het
      oog op de bescherming van de houders van deze obligaties, mits de opbrengst van die obligaties overeenkomstig
      de toepasselijke wet wordt belegd in activa die gedurende de gehele looptijd van de obligaties voldoende dekking
      bieden voor de daaruit voortvloeiende verplichtingen en die bij een in gebreke blijven van de uitgevende instelling
      bij voorrang bestemd zijn voor de aflossing van de hoofdsom en betaling van de opgebouwde rente.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel32
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '32'
        paragraaf: V
  - number: '33.2'
    text: |-
      Indien een beleggingsinstelling meer dan vijf procent van haar activa belegt in de in het eerste lid bedoelde
      obligaties die door een zelfde instelling zijn uitgegeven, dient de totale waarde van deze beleggingen niet meer
      dan tachtig procent van de waarde van de activa van die uitgevende instelling te bedragen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel33
  - number: '34.1'
    text: |-
      In afwijking van [artikel 32, eerste lid][ref1], mag de beleggingsinstelling, voor zover haar statuten of
      reglementen deze beleggingsactiviteiten toestaan, tot ten hoogste vijfendertig procent van haar activa beleggen in
      effecten die zijn uitgegeven of gegarandeerd door een Lid-Staat, een openbaar lichaam met verordenende bevoegdheid
      in een Lid-Staat, een Staat buiten het grondgebied van de Europese Gemeenschappen, of een volkenrechtelijke
      organisatie waarin een of meer Lid-Staten deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel32
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '32'
        paragraaf: V
  - number: '34.2'
    text: |-
      De toezichthoudende autoriteit kan, op verzoek van de beleggingsinstelling, het percentage genoemd in het
      eerste lid verhogen tot ten hoogste honderd indien de beleggingsinstelling effecten van ten minste zes
      verschillende emissies van een in het eerste lid bedoelde uitgevende Staat, lichaam of organisatie in portefeuille
      heeft, de effecten van een zelfde emissie niet meer bedragen dan dertig procent van de totale activa van de
      beleggingsinstelling, en de toezichthoudende autoriteit van oordeel is dat de deelnemers in de beleggingsinstelling
      voldoende bescherming genieten.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel34
  - number: '35'
    text: |-
      De in de [artikelen 32][ref1], [33][ref2] en [34, eerste lid][ref3], bedoelde beleggingen in effecten uitgegeven
      door een zelfde instelling mogen tezamen niet meer bedragen dan vijfendertig procent van de totale activa van de
      beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0004866#Artikel34
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '32'
        paragraaf: V
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '33'
        paragraaf: V
      - id: ref3
        bwb_id: BWBR0004866
        artikel: '34'
        paragraaf: V
  - number: '36'
    text: |-
      De toezichthoudende autoriteit kan een nieuw opgerichte beleggingsinstelling voor een periode van ten
      hoogste zes maanden na de datum waarop de vergunning is verleend, ontheffing verlenen van het bepaalde in de
      [artikelen 32][ref1], [33][ref2] en [34][ref3], indien de beleggingsinstelling naar zijn oordeel de beginselen van
      risicospreiding in haar beleggingen in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0004866#Artikel34
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '32'
        paragraaf: V
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '33'
        paragraaf: V
      - id: ref3
        bwb_id: BWBR0004866
        artikel: '34'
        paragraaf: V
  - number: '37'
    text: |-
      In afwijking van [artikel 32, eerste lid][ref1], mag een beleggingsinstelling tot ten hoogste vijf procent van haar
      activa beleggen in rechten van deelneming in andere beleggingsinstellingen die buiten een besloten kring gelden of
      andere goederen ter collectieve belegging verkrijgen, mits deze andere beleggingsinstellingen onder de omschrijving
      van [artikel 6, eerste lid, onderdelen ][ref2] vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '32'
        paragraaf: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
  - number: '38.1'
    text: |-
      Toestemming van de toezichthoudende autoriteit is vereist voor de verwerving van rechten van deelneming in een
      beleggingsinstelling die wordt beheerd door:
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel38
  - number: 38.1.a
    text: dezelfde rechtspersoon als de verwervende beleggingsinstelling; of
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel38
  - number: 38.1.b
    text: |-
      een rechtspersoon waarmee de beheerder van de verwervende beleggingsinstelling is verbonden door gemeenschappelijke
      bedrijfsvoering, gemeenschappelijke zeggenschapsuitoefening of een aanmerkelijke rechtstreekse of middellijke
      deelneming.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel38
  - number: '38.2'
    text: 'De toezichthoudende autoriteit verleent zijn toestemming slechts indien:'
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel38
  - number: 38.2.a
    text: |-
      de beleggingsinstelling waarvan de rechten van deelneming worden verworven, gespecialiseerd is in belegging in een
      specifieke geografische of economische sector;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel38
  - number: 38.2.b
    text: de statuten of reglementen de mogelijkheid van een dergelijke verwerving uitdrukkelijk vermelden; en
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel38
  - number: 38.2.c
    text: |-
      de beleggingsinstelling het voornemen om van de mogelijkheid van een dergelijke verwerving gebruik te maken in het
      prospectus heeft aangekondigd.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel38
  - number: '38.3'
    text: |-
      De verwervende beleggingsinstelling is niet bevoegd bij wie dan ook ter zake van transacties als bedoeld in het
      eerste lid kosten of andere opslagen in rekening te brengen.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel38
  - number: '39.1'
    text: |-
      Het is de beheerder van beleggingsfondsen voor het totaal van de door hem beheerde en onder
      [artikel 6, eerste lid, onderdelen a en b, van de wet][ref1] vallende beleggingsfondsen alsmede de
      beleggingsmaatschappij niet toegestaan zoveel aandelen met stemrecht in een uitgevende instelling te verwerven
      dat de beheerder van het beleggingsfonds of de beleggingsmaatschappij uit hoofde van de deelneming invloed van
      betekenis kan uitoefenen op het bestuur van die instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
  - number: '39.2'
    text: 'Onverminderd het eerste lid mag de beleggingsinstelling niet meer verwerven dan:'
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel39
  - number: 39.2.a
    text: tien procent van door een zelfde uitgevende instelling uitgegeven aandelen zonder stemrecht;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel39
  - number: 39.2.b
    text: tien procent van door een zelfde uitgevende instelling uitgegeven obligaties;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel39
  - number: 39.2.c
    text: |-
      tien procent van door een beleggingsinstelling in de zin van [artikel 6, eerste lid, onderdelen ][ref1]uitgegeven
      rechten van deelneming.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
  - number: '39.3'
    text: |-
      De in onderdelen *b* en *c* van het tweede lid bedoelde begrenzingen behoeven niet in acht te worden genomen indien
      op het tijdstip van verkrijging het brutobedrag van de obligaties respectievelijk de netto waarde van de rechten
      niet kan worden berekend.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel39
  - number: '40'
    text: |-
      [Artikel 39, tweede lid][ref1], is niet van toepassing bij de verwerving van:


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel39
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '39'
        paragraaf: V
  - number: 40.a
    text: |-
      effecten die zijn uitgegeven of worden gegarandeerd door een Lid-Staat, een openbaar lichaam met verordenende
      bevoegdheid in een Lid-Staat, een Staat buiten de Europese Gemeenschappen of een volkenrechtelijke organisatie
      waarin een of meer Lid-Staten deelnemen;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel40
  - number: 40.b
    text: |-
      aandelen in het kapitaal van een rechtspersoon, gevestigd in een land buiten de Europese Gemeenschappen, die met
      inachtneming van de begrenzingen als bedoeld in de [artikelen 32][ref1], [34, eerste lid][ref2], [37][ref3] en
      [39][ref4] haar activa in hoofdzaak belegt in effecten van uitgevende instellingen gevestigd in dat land, wanneer
      krachtens de wet van dat land een dergelijke deelneming voor de beleggingsinstelling de enige mogelijkheid is om in
      effecten van uitgevende instellingen in dat land te beleggen;


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004866#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0004866#Artikel39
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '32'
        paragraaf: V
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '34'
        paragraaf: V
      - id: ref3
        bwb_id: BWBR0004866
        artikel: '37'
        paragraaf: V
      - id: ref4
        bwb_id: BWBR0004866
        artikel: '39'
        paragraaf: V
  - number: 40.c
    text: |-
      aandelen in het kapitaal van een dochtermaatschappij van de beleggingsmaatschappij die uitsluitend ten behoeve van
      die beleggingsmaatschappij administratieve, advies- of verhandelingswerkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel40
  - number: '41'
    text: |-
      De in de [artikelen 28 tot en met 35][ref1] en [37 tot en met 40][ref2] bedoelde grenzen behoeven door de
      beleggingsinstelling niet in acht te worden genomen bij de uitoefening van voorkeursrechten die zijn verbonden aan
      effecten die deel uitmaken van haar activa.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel37
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '28'
        paragraaf: V
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '37'
        paragraaf: V
  - number: '42'
    text: |-
      Wanneer de in de [artikelen 28 tot en met 35][ref1] en [37 tot en met 40][ref2] genoemde grenzen buiten de wil
      van de beleggingsinstelling of ten gevolge van de uitoefening van voorkeursrechten worden overschreden, dient de
      beleggingsinstelling, met inachtneming van de belangen van de deelnemers, bij voorrang de nodige maatregelen te
      treffen opdat deze overschrijding ongedaan wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel37
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '28'
        paragraaf: V
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '37'
        paragraaf: V
  - number: '43'
    text: |-
      De beleggingsinstelling dient binnen vier weken na een verzoek daartoe van de toezichthoudende autoriteit
      en voorts binnen vier weken na afloop van het boekjaar een mededeling van een accountant of een accountant-
      administratieconsulent, die geen dienstbetrekking bij de beleggingsinstelling heeft en ingeschreven is
      overeenkomstig het bepaalde in de [Wet op de accountants-administratieconsulenten][ref1] (*Stb.* 1972, 748), aan
      de toezichthoudende autoriteit over te leggen waaruit blijkt dat de beleggingsinstelling in overeenstemming handelt
      met de in de [artikelen 27 tot en met 42][ref2] vervatte regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002856
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel27
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002856
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '27'
        paragraaf: V
  - number: '44.1'
    text: |-
      Onverminderd het bepaalde in de [artikelen 19][ref1] en [21][ref2] dienen de balans en winst- en verliesrekening of
      de toelichtingen daarop de volgende gegevens te bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004866#Artikel21
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '19'
        paragraaf: IV
      - id: ref2
        bwb_id: BWBR0004866
        artikel: '21'
        paragraaf: IV
  - number: 44.1.a
    text: tegoeden bij banken;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.b
    text: |-
      een onderscheid in de overzichten van de beleggingsportefeuille als bedoeld in
      [artikel 21, eerste lid, onderdeel ][ref1] naar:


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel21
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '21'
        paragraaf: IV
  - number: 44.1.b.1°
    text: effecten die zijn toegelaten tot de notering aan een effectenbeurs;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.b.2°
    text: op andere geregelde, regelmatig functionerende, erkende open markten verhandelde effecten;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.b.3°
    text: |-
      de in [artikel 28, tweede lid, onderdeel ][ref1] bedoelde nieuw uitgegeven effecten; en


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel28
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '28'
        paragraaf: V
  - number: 44.1.b.4°
    text: |-
      de overige in [artikel 29, onderdeel ][ref1] bedoelde effecten en vorderingen;


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel29
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '29'
        paragraaf: V
  - number: 44.1.c
    text: |-
      een sluitend overzicht van de gesaldeerde mutaties in de verslagperiode in het eigen vermogen van de
      beleggingsmaatschappij of het fondsvermogen van het beleggingsfonds ten gevolge van en uitgesplitst naar:
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.c.1°
    text: inkomsten uit beleggingen;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.c.2°
    text: overige inkomsten;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.c.3°
    text: kosten van beheer;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.c.4°
    text: kosten van bewaring;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.c.5°
    text: overige kosten;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.c.6°
    text: belastingen;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.c.7°
    text: de (voorgestelde) bestemming van het netto-resultaat;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.c.8°
    text: |-
      de vermeerdering of vermindering van het eigen vermogen van de beleggingsmaatschappij of van het fondsvermogen van
      het beleggingsfonds door uitgifte of inkoop van deelnemingsbewijzen;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.c.9°
    text: de koersverschillen op beleggingen; en
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.c.10°
    text: overige mutaties van de activa en passiva;
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
  - number: 44.1.d
    text: |-
      het bedrag der verplichtingen onderscheiden naar soort per het einde van het boekjaar, die voortvloeien uit de
      in [artikel 31][ref1] bedoelde verrichtingen en voor zover niet reeds in de balans en winst- en verliesrekening
      begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel31
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '31'
        paragraaf: V
  - number: '44.2'
    text: |-
      Onverminderd het bepaalde in [artikel 22][ref1] dient de beleggingsinstelling in de halfjaarcijfers, voor zover
      niet reeds opgenomen, de informatie bedoeld in het eerste lid, onderdelen *a, b* en *d* per het einde van de eerste
      helft van het boekjaar op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel22
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '22'
        paragraaf: IV
  - number: '45.1'
    text: |-
      Telkens wanneer door de beleggingsinstelling rechten van deelneming worden uitgegeven, ingekocht, verkocht of
      wanneer daarop door de beleggingsinstelling wordt terugbetaald, dient de beleggingsinstelling de emissiekoers, de
      verkoop- respectievelijk inkoopprijs en het bedrag van de terugbetaling per advertentie in een of meer landelijk
      verspreide Nederlandse dagbladen, danwel aan het adres van iedere deelnemer bekend te maken. De toezichthoudende
      autoriteit kan de beleggingsinstelling toestaan deze bekendmaking eenmaal per maand te doen, mits de belangen van
      de deelnemers niet daardoor worden geschaad.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel45
  - number: '45.2'
    text: |-
      Het eerste lid is niet van toepassing op de beleggingsinstelling waarop [artikel 9, eerste lid][ref1], van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004866#Artikel9
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004866
        artikel: '9'
        paragraaf: III
  - number: 45a.1
    text: |-
      Het bedrag van de boete, bedoeld in [artikel 33d, eerste lid, van de wet][ref1] wordt bepaald op de wijze, voorzien
      in [bijlage C][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33d
      [ref2]: https://wetten.overheid.nl/BWBR0004866
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33d
      - id: ref2
        bwb_id: BWBR0004866
  - number: 45a.2
    text: |-
      De toezichthoudende autoriteit kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het
      bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel45a
  - number: '46'
    text: Dit besluit treedt in werking op het tijdstip waarop de wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel46
  - number: '47'
    text: 'Dit besluit kan worden aangehaald als: Besluit toezicht beleggingsinstellingen.'
    url: https://wetten.overheid.nl/BWBR0004866/2003-12-01#Artikel47
