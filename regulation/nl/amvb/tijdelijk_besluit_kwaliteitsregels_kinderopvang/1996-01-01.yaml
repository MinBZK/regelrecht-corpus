articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. kinderopvang: het in georganiseerd verband tegen vergoeding verzorgen en opvoeden van kinderen van 0 jaar tot en
      met einde basisschoolleeftijd door anderen dan de eigen ouders, pleeg- of stiefouders op uren dat ouders/verzorgers
      hiervoor niet beschikbaar zijn;

      b. kindercentrum: kinderopvang buiten een gezinssituatie, alsmede kinderopvang binnen een gezinssituatie, indien de
      opvang betrekking heeft op gelijktijdig meer dan vier kinderen;

      c. gastouderopvang: kinderopvang in een gezinssituatie, die tot stand komt door middel van een gastouderbureau en
      die betrekking heeft op gelijktijdig ten hoogste vier kinderen:

      d. gastouderbureau: een organisatie die de bemiddeling van gastouderopvang tussen gastouders en ouders/verzorgers
      regelt;

      e. gastouder: een persoon die gastouderopvang biedt;

      f. functionaris:

      1. in een kindercentrum werkzame persoon, niet zijnde een vrijwilliger, belast met de verzorging en opvoeding van
      kinderen;

      2. in een gastouderbureau werkzame persoon, belast met de bemiddeling van gastouderopvang, die voor zijn
      werkzaamheden de op grond van de voor de kinderopvang geldende CAO benodigde opleiding heeft;

      g. houder: een natuurlijke of rechtspersoon die een kindercentrum of gastouderbureau in stand houdt;

      h. NEN: door de Stichting Nederlands Normalisatie-Instituut vastgestelde norm.
    url: https://wetten.overheid.nl/BWBR0007668/1996-01-01#Artikel1
  - number: '2'
    text: |-
      1 Bij gemeentelijke verordening worden aan houders van kindercentra in ieder geval eisen gesteld die betrekking
      hebben op:

      a. de inrichting, hygiënische toestand en veiligheid van het kindercentrum voorzover deze eisen noodzakelijk zijn
      voor de kinderopvang en hierin niet wordt voorzien bij of krachtens de [Woningwet][ref1];

      b. de waarborging van de invloed van functionarissen en van personen behulpzaam bij de verzorging en opvoeding op
      het beleid van de houder;

      c. de aansprakelijkheid- en ongevallenverzekering.

      2 Bij gemeentelijke verordening worden met betrekking tot kindercentra regels gesteld ten aanzien van de
      groepsgrootte en de aantallen functionarissen in relatie tot de aantallen kinderen. Daarbij worden ten minste de
      volgende eisen gesteld:

      a. de opvang van kinderen vindt in groepen plaats met dien verstande dat een groep van kinderen:

      1. in de leeftijd van 0 tot 1 jaar gelijktijdig ten hoogste 12 kinderen omvat;

      2. in de leeftijd van 0 tot 13 jaar gelijktijdig ten hoogste 16 kinderen omvat, waaronder ten hoogste 8 kinderen
      van 0 tot 1 jaar;

      3. in de leeftijd van 4 tot 13 jaar gelijktijdig ten hoogste 20 kinderen omvat;

      b. tenminste één functionaris wordt ingezet voor de verzorging en opvoeding van gelijktijdig ten hoogste:

      1. 4 kinderen in de leeftijd van 0 tot 1 jaar;

      2. 5 kinderen in de leeftijd van 1 tot 2 jaar;

      3. 6 kinderen in de leeftijd van 2 tot 3 jaar;

      4. 8 kinderen in de leeftijd van 3 tot 4 jaar;

      5. 10 kinderen in de leeftijd van 4 tot het einde van de basisschoolleeftijd;

      6. het aantal functionarissen bij een gemengde groep wordt bepaald aan de hand van het gemiddelde, waarbij naar
      boven kan worden afgerond;

      c. in afwijking van onderdeel *b* kan gedurende een beperkte tijd, doch niet meer dan anderhalf uur, na opening
      en voor sluiting van het kindercentrum en in bijzondere omstandigheden één functionaris minder ingezet worden, met
      dien verstande dat tenminste één functionaris wordt ingezet;

      d. indien slechts één functionaris ingezet wordt ingevolge onderdeel *b* of *c*, wordt naast deze functionaris ten
      minste één volwassene ingezet ter ondersteuning van die functionaris;

      e. per groep is een ruimte beschikbaar, die per kind 3 vierkante meter netto speel/werkoppervlak bevat, bepaald
      overeenkomstig NEN 2580;

      f. er is buitenspeelruimte beschikbaar, waarvan de oppervlakte minimaal 4 vierkante meter per spelend kind
      bedraagt, bepaald overeenkomstig NEN 2580;

      g. kinderen tot anderhalf jaar beschikken over slaapgelegenheid in een aparte ruimte en kinderen ouder dan
      anderhalf beschikken over slaapgelegenheid in een rustige, af te scheiden ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
