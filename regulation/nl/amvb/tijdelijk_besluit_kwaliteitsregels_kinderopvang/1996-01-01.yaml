  - number: '3'
    text: |-
      Bij gemeentelijke verordening worden aan houders van een gastouderbureau in ieder geval eisen gesteld met
      betrekking tot:

      a. de veiligheid en kwaliteit van de gastouderopvang;

      b. de waarborging van de invloed van de functionarissen en gastouders op het beleid van de houder;

      c. de wijze waarop de relatie tussen gastouderbureau, aangesloten gastouders en ouders/verzorgers wordt geregeld en
      de relatie tussen de gastouders en ouders/verzorgers onderling;

      d. de aansprakelijkheid- en ongevallenverzekering.
    url: https://wetten.overheid.nl/BWBR0007668/1996-01-01#Artikel3
  - number: '4'
    text: |-
      Bij gemeentelijke verordening wordt voorgeschreven dat de houder van een kindercentrum of een gastouderbureau
      ouders/verzorgers schriftelijk informeert over:

      a. het te voeren beleid, waaronder het pedagogisch beleid en de wijze waarop uitvoering wordt gegeven aan
      [artikel 2, tweede lid, onder ][ref1];

      b. de wijze waarop klachten worden behandeld;

      c. de wijze waarop de inspraak is geregeld; en

      d. de wijze waarop het contact met de ouders/verzorgers wordt onderhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0007668#Artikel2
    url: https://wetten.overheid.nl/BWBR0007668/1996-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007668
        artikel: '2'
        hoofdstuk: I
  - number: '5'
    text: |-
      Een houder van een kindercentrum of gastouderbureau ontvangt van de gemeente een verklaring, waaruit blijkt dat aan
      de in de gemeentelijke verordening gestelde eisen is voldaan. Een door de gemeente op grond van de gemeentelijke
      verordening verstrekte vergunning wordt met een verklaring gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0007668/1996-01-01#Artikel5
  - number: '6'
    text: |-
      Bij gemeentelijke verordening wordt bepaald binnen welke termijn, doch uiterlijk binnen een jaar na
      inwerkingtreding van de verordening, houders voldoen aan de gemeentelijke verordening bedoeld in de
      [artikelen 2][ref1], [3][ref2] en [4][ref3].


