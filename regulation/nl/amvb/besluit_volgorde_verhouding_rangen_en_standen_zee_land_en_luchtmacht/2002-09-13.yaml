preamble:
  text: >-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onze Minister van Oorlog en van Marine van 26 maart 1956, Nr P. 105.270 H;


    De Raad van State gehoord (advies van 1 mei 1956, nr 47);


    Gezien het nader rapport van Onze voornoemde Ministers van 15 juni 1956, Nr P. 105.270/O/MinMar 434890/381914;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002224/2002-09-13#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      De volgorde van en de verhouding tussen de rangen en standen bij de zee-, de land- en de luchtmacht - waarbij
      worden geacht te zijn inbegrepen de door Ons of door Onze Minister van Oorlog en (of) door Onze Minister van Marine
      daarmede gelijkgestelde rangen en standen - zijn aangegeven in de bij dit besluit behorende tabel, waarin een
      hogere rang is aangegeven door een lager nummer en onderlinge gelijkheid van rang of stand door een gelijk nummer.
    url: https://wetten.overheid.nl/BWBR0002224/2002-09-13#Artikel1
  - number: '2'
    text: >-
      Een gewezen officier, die na zijn ontslag bij het voormalige Koninklijk Nederlands Indonesische Leger zijn rang
      heeft behouden, wordt voor wat het bepalen van rangsverhouding betreft, gelijkgesteld met de officier van de
      Koninklijke Landmacht, die een gelijknamige rang bekleedt.
    url: https://wetten.overheid.nl/BWBR0002224/2002-09-13#Artikel2
  - number: '3'
    text: Het Koninklijk besluit van 6 Augustus 1910 (*Stb.* 247) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002224/2002-09-13#Artikel3
