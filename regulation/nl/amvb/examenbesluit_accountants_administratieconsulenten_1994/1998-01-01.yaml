preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Economische Zaken van 1 september 1993, nr. 93064765 WJA/W;


    Gelet op de achtste richtlijn (nr. 84/253/EEG) van de Raad van de Europese Gemeenschappen van 10 april 1984 op de
    grondslag van artikel 54, lid 3, sub g) van het Verdrag inzake de toelating van personen, belast met de wettelijke
    controle van boekhoudbescheiden (PbEG L 126), en op artikel 81, tweede lid, en artikel 82, tweede lid, van de Wet
    op de Accountants-Administratieconsulenten;


    De Raad van State gehoord (advies van 30 november 1993, nr. W.10.93.0599);


    Gezien het nader rapport van Onze Minister van Economische Zaken van 1 februari 1994, nr. 94007471 WJA/W;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. examen: het examen, bedoeld in [artikel 80 van de Wet op de Accountants-Administratieconsulenten][ref1];

      b. examenbureau: het examenbureau, bedoeld in
      [artikel 85 van de Wet op de Accountants-Administratieconsulenten][ref2];

      c. curatorium: het curatorium, bedoeld in [artikel 89 van de Wet op de Accountants-Administratieconsulenten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel89
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '85'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '89'
  - number: '2'
    text: |-
      1 Tot het afleggen van het theoretische gedeelte van het examen wordt toegelaten degene die in
      het bezit is van een diploma dat recht geeft op toelating tot een hogeschool in de zin van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].

      2 Indien het in het eerste lid bedoelde diploma is behaald na het met goed gevolg afleggen van een examen dat
      een of meer vakken niet heeft omvat waarvan het met goed gevolg afgelegd hebben vereist is voor de toelating tot
      examens in de bedrijfseconomie aan een hogeschool als bedoeld in het eerste lid, dient de daarvoor benodigde kennis
      in dat vak of in die vakken aangetoond te worden door middel van schriftelijke bewijzen of bij een toets door het
      examenbureau.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '3'
    text: |-
      1 Degene die niet beschikt over het in [artikel 2, eerste lid][ref1], bedoelde diploma wordt tot het theoretische
      gedeelte van het examen toegelaten, indien hij blijkens overgelegde schriftelijke bewijzen naar het oordeel van het
      examenbureau kennis heeft van de vakken Nederlands, Engels en wiskunde, alsmede van drie van de vakken economie,
      Frans, Duits, geschiedenis en aardrijkskunde op een niveau dat overeenkomt met het niveau dat voor die vakken
      geëist wordt voor het behalen van het in [artikel 2, eerste lid][ref2], bedoelde diploma.

      2 Bij gebreke van de in het eerste lid bedoelde bewijzen toetst het examenbureau bij een toelatingsonderzoek, met
      inachtneming van door het curatorium vast te stellen beleidsregels, of de betrokkene beschikt over de in dat lid
      vereiste kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0006454#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006454#Artikel2
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006454
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006454
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '4'
    text: >-
      Het theoretische gedeelte van het examen bestaat uit een of meer tentamens in de volgende vakken:


      a. algemene economie,


      b. bedrijfseconomie,


      c. recht,


      d. wiskunde,


      e. statistiek,


      f. boekhouden,


      g. algemene organisatie,


      h. belastingrecht,


      i. externe verslaggeving,


      j. administratieve organisatie,


      k. leer van de accountantscontrole en


      l. kennis van het midden- en kleinbedrijf.
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel4
  - number: '5'
    text: >-
      1 Het examenbureau stelt onder goedkeuring van het curatorium de eisen vast voor elk tentamen, alsmede de tot
      in bijzonderheden uitgewerkte omschrijvingen van de eisen voor elk tentamen met vermelding van de te bestuderen
      literatuur.


      2 Het examenbureau legt de in het eerste lid bedoelde regeling, alsmede de wijzigingen daarvan, na de goedkeuring
      door het curatorium ter inzage op zijn kantoor. Het examenbureau stelt voorts desgevraagd een exemplaar van de
      regeling tegen vergoeding van de kostprijs ter beschikking aan degenen die aan het examen willen deelnemen.
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel5
  - number: '6'
    text: |-
      1 Het examenbureau kan, onder goedkeuring van het curatorium, om onderwijskundige redenen de geldigheidsduur van
      met goed gevolg afgelegde tentamens beperken.

      2 [Artikel 5, tweede lid][ref1], is van overeenkomstige toepassing op de in het eerste lid bedoelde regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006454#Artikel5
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006454
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '7'
    text: >-
      Het examenbureau stelt degene die beschikt over schriftelijke bewijzen waaruit blijkt dat hij de kennis heeft die
      is vereist voor het met goed gevolg afleggen van een of meer tentamens, vrij van het afleggen van de desbetreffende
      tentamens.
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel7
  - number: '8'
    text: |-
      Tot het praktijkgedeelte van het examen wordt toegelaten degene die

      1°. alle tentamens van de in [artikel 4, onder ][ref1], genoemde vakken van het theoretische gedeelte van het
      examen met goed gevolg heeft afgelegd, en voorts ten minste één tentamen met goed gevolg heeft afgelegd in elk van
      de in [artikel 4, onder ][ref2], genoemde vakken, waaruit blijkt dat hij de beginselen van deze vakken in theorie
      beheerst, dan wel van het afleggen daarvan ingevolge [artikel 7][ref3] is vrijgesteld of

      2°. beschikt over schriftelijke bewijzen waaruit blijkt dat hij met de in [het eerste lid][ref4] genoemde tentamens
      vergelijkbare toetsen met goed gevolg heeft afgelegd bij een onderwijsinstelling die beschikt over een verklaring
      van gelijkwaardigheid als bedoeld in [artikel 91 van de Wet op de Accountants-Administratieconsulenten][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006454#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006454#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006454#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0006454#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002856#Artikel91
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel8
