        artikel: '91'
  - number: '9'
    text: |-
      1 Bij het praktijkgedeelte van het examen toetst het examenbureau de vaardigheid in de praktijk in de in
      [artikel 4][ref1] genoemde vakken en in het bijzonder in de vakken externe verslaggeving, administratieve
      organisatie en leer van de accountantscontrole.

      2 De werkzaamheden aan de hand waarvan de in het eerste lid bedoelde vaardigheid wordt getoetst betreffen in ieder
      geval:

      - controleplanning;
      - vastlegging en beoordeling van administratieve organisatie en interne controlesystemen en daarmee samenhangende
      automatiseringssystemen;
      - opstellen van een gedetailleerd controleprogramma;
      - toepassen van verschillende controletechnieken;
      - beoordelen van jaarrekeningen;
      - opstellen van accountantsrapporten en accountantsverklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006454#Artikel4
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006454
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '10'
    text: |-
      Ten behoeve van de in [artikel 9][ref1] bedoelde toetsing stelt degene die aan het praktijkgedeelte van het examen
      deelneemt gedurende drie jaar na de aanvang van dat gedeelte elk half jaar een praktijkverslag op waarin de aard en
      de omvang van de door hem verrichte werkzaamheden zijn vastgelegd. Het verslag wordt voorzien van een beoordeling
      van die werkzaamheden door degene bij wie de praktijkopleiding wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0006454#Artikel9
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006454
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '11'
    text: |-
      Degene die deelneemt aan het praktijkgedeelte van het examen dient voor de aanvang van het derde jaar van de in
      [artikel 10][ref1] bedoelde drie jaar

      1°. alle tentamens in de in [artikel 4, onder ][ref2], genoemde vakken van het theoretische gedeelte van het examen
      met goed gevolg te hebben afgelegd of

      2°. een examen ter zake waarvan een verklaring van gelijkwaardigheid als bedoeld in
      [artikel 91 van de Wet op de Accountants-Administratieconsulenten][ref3] is afgegeven, met goed gevolg te hebben
      afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006454#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006454#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel91
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006454
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006454
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '91'
  - number: '12'
    text: |-
      Indien naar het oordeel van het examenbureau de vaardigheid van degene die aan het praktijkgedeelte van het examen
      deelneemt na afloop van de in [artikel 10][ref1] bedoelde drie jaar onvoldoende is stelt het hem in de gelegenheid
      nog gedurende ten hoogste twee jaar elk half jaar een in [artikel 10][ref2] bedoeld praktijkverslag op te stellen
      aan de hand waarvan het examenbureau de vaardigheid wederom toetst.


      [ref1]: https://wetten.overheid.nl/BWBR0006454#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006454#Artikel10
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006454
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006454
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '13'
    text: >-
      Het examenbureau stelt degene die beschikt over schriftelijke bewijzen waaruit blijkt dat hij met goed gevolg
      gedurende een bepaalde periode voor het praktijkgedeelte van het examen relevante werkzaamheden heeft verricht
      op het gebied van de controle van jaarrekeningen, geconsolideerde jaarrekeningen of soortgelijke financiële
      opstellingen, vrij van een door het examenbureau te bepalen deel van het praktijkgedeelte van het examen.
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel13
  - number: '14'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel14
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Examenbesluit Accountants-Administratieconsulenten 1994.'
    url: https://wetten.overheid.nl/BWBR0006454/1998-01-01#Artikel15
