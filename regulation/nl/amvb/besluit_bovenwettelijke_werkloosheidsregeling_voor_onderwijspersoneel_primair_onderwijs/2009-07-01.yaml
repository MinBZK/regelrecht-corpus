  - number: '16'
    text: |-
      1 Een betrokkene die recht heeft op een bovenwettelijke uitkering waaraan een recht op aansluitende uitkering
      is verbonden, heeft zodra het einde van de duur van zijn recht op aansluitende uitkering op grond van
      [artikel 9][ref1] is bereikt, recht op een verlenging van zijn aansluitende uitkering indien:

      a. hij eerder een recht op bovenwettelijke uitkering heeft gehad waaraan een recht op aansluitende uitkering is
      verbonden, en

      b. de duur van zijn oude recht op bovenwettelijke uitkering langer is dan de duur van zijn nieuwe recht op
      bovenwettelijke uitkering, en

      c. het einde van de duur van zijn oude recht op bovenwettelijke uitkering niet is bereikt vóór de ingangsdatum van
      de verlenging.

      2 De duur van de verlenging, bedoeld in het eerste lid, is gelijk aan de duur van het oude recht op bovenwettelijke
      uitkering die nog niet is verstreken op het moment dat de verlenging ingaat, maar ten hoogste aan het verschil in
      duur tussen het oude en het nieuwe recht op bovenwettelijke uitkering.

      3 De betrokkene die recht heeft op een bovenwettelijke uitkering waaraan op grond van [artikel 8][ref2] geen
      recht op aansluitende uitkering op grond van [artikel 8][ref3] is verbonden, heeft zodra het einde van de duur van
      zijn bovenwettelijke uitkering is bereikt, in afwijking van [artikel 8][ref4], alsnog recht op een aansluitende
      uitkering indien:

      a. hij eerder een recht op bovenwettelijke uitkering heeft gehad waaraan een recht op aansluitende uitkering was
      verbonden, en

      b. de duur van zijn oude recht op bovenwettelijke uitkering bij het einde van de duur van zijn nieuwe recht op
      bovenwettelijke uitkering nog niet is verstreken, en

      c. de duur van zijn oude recht op bovenwettelijke uitkering langer is dan de duur van zijn nieuwe recht op
      bovenwettelijke uitkering.

      4 De duur van de aansluitende uitkering, bedoeld in het derde lid, is gelijk aan de duur van het oude recht
      op bovenwettelijke uitkering die nog niet is verstreken bij het einde van de duur van het nieuwe recht op
      bovenwettelijke uitkering, maar ten hoogste aan het verschil in duur tussen het oude en het nieuwe recht op
      bovenwettelijke uitkering.

      5 Het recht op uitkering op grond van dit artikel wordt niet toegekend indien de betrokkene onvoldoende aannemelijk
      maakt dat hij voldoet aan de voorwaarden die in zijn geval voortvloeien uit het eerste. Onze Minister kan nadere
      regels stellen inzake de vorige volzin.


