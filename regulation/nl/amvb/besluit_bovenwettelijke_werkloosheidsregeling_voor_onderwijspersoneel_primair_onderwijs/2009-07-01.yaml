  - number: '10'
    text: |-
      1 Onze Minister stelt op aanvraag vast of recht op bovenwettelijke uitkering bestaat. Voorzover in dit besluit
      niet anders is bepaald, zijn de artikelen [22 tot en met 27][ref1] en [28 WW][ref2] van overeenkomstige
      toepassing op de aanvulling op de WW-uitkering en op de aansluitende uitkering, behalve in de situatie, bedoeld in
      [artikel 8, derde lid][ref3].

      2 Voor de toepassing van het eerste lid wordt de aanvraag om aanvulling op de WW-uitkering en om aansluitende
      uitkering geacht te zijn gedaan op dezelfde dag als de aanvraag om WW-uitkering, tenzij de aanvraag om aanvulling
      op de WW-uitkering en aansluitende uitkering meer dan drie maanden nadat de WW-uitkering is toegekend, is
      ingediend.

      3 De [artikelen 28][ref4], [30][ref5], [30a][ref6], [31, eerste lid][ref7], [37][ref8],
      [38a, eerste en vierde lid][ref9], [44][ref10], [45][ref11], [49][ref12] en [54 ZW][ref13] zijn van overeenkomstige
      toepassing op de aanvulling op de ZW-uitkering en op de aansluitende uitkering in de situatie, bedoeld in
      [artikel 8, derde lid][ref14].

      4 Indien de betrokkene de verplichting, bedoeld in [artikel 25 WW][ref15], artikel [31, eerste lid, ZW][ref16]
      of [artikel 49 ZW][ref17] niet of niet behoorlijk is nagekomen, kan Onze Minister de bovenwettelijke uitkering
      tijdelijk of blijvend, geheel of gedeeltelijk, weigeren.

      5 Op de aanvulling van de uitkering op grond van de [WAZO][ref18] is het derde lid en zijn de
      [artikelen 3:12][ref19] en [3:16, eerste lid, onderdelen b, d, f en g, WAZO][ref20], van overeenkomstige
      toepassing.


