  - number: '6'
    text: |-
      1 De betrokkene die recht heeft op uitkering op grond van de [ZW][ref1]

      a. en die recht op aanvulling op de WW-uitkering of op aansluitende uitkering zou hebben gehad als hij niet ziek
      was geweest, of

      b. onder toepassing van [artikel 46 ZW][ref2], terwijl hij laatstelijk voor de [ZW][ref3] verzekerd was op grond
      van een WW-uitkering waaraan een recht op bovenwettelijke uitkering was verbonden, heeft recht op aanvulling op de
      ZW-uitkering.

      2 De vrouwelijke betrokkene die recht op uitkering heeft op grond van [artikel 3:8 WAZO][ref4]

      a. en die recht op aanvulling op de WW-uitkering of op aansluitende uitkering zou hebben gehad als zij geen recht
      op uitkering op grond van [artikel 3:8 WAZO][ref5] zou hebben gehad, of

      b. onder toepassing van [artikel 3:10 WAZO][ref6], terwijl zij laatstelijk voor de [ZW][ref7] verzekerd was op
      grond van een WW-uitkering waaraan een recht op bovenwettelijke uitkering was verbonden, heeft recht op aanvulling
      op de WAZO-uitkering.

      3 In afwijking van het eerste en tweede lid heeft de betrokkene geen recht op aanvulling op de ZW-
      of WAZO-uitkering over tijdvakken waarin hij recht heeft op uitkering of bezoldiging op grond van het
      [Besluit ziekte en arbeidsongeschiktheid voor onderwijspersoneel primair en voortgezet onderwijs][ref8].

      4 De duur van de aanvulling op de ZW-uitkering is gelijk aan de duur van de ZW-uitkering. De duur van de aanvulling
      op de WAZO-uitkering is gelijk aan de duur van de WAZO-uitkering.

      5 De ZW- of WAZO-uitkering van de betrokkene die bij aanvang van die uitkering recht zou hebben gehad op een
      aansluitende uitkering, wordt aangevuld tot de hoogte die de aansluitende uitkering zou hebben gehad. In de overige
      gevallen wordt de hoogte van de aanvulling op de ZW- of WAZO-uitkering vastgesteld onder overeenkomstige toepassing
      van [artikel 5, vijfde en zesde lid][ref9].

      6 [Artikel 5, zevende lid][ref10], is van overeenkomstige toepassing op de aanvullingen, bedoeld in dit artikel.


