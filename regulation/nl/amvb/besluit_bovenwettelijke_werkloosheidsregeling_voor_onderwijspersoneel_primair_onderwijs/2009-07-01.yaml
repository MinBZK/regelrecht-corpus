  - number: 15a
    text: |-
      1 Op de betrokkene die als gevolg van de beëindiging van de bekostiging van het onderwijs in allochtone levende
      talen per 1 augustus 2004, dan wel op de betrokkene is aangesteld of benoemd voor het verzorgen van onderwijs in
      allochtone levende talen en die als gevolg van de aanpassing per 1 augustus 2002 van de eisen die gesteld worden
      aan leraren die taalondersteuning geven, werkloos dreigt te worden en die, om te voorkomen dat hij werkloos wordt,
      een betrekking aanvaardt met een lager maximum salaris dan waarop hij in zijn oude dienstbetrekking recht had, zijn
      de bepalingen in [artikel 15][ref1] van overeenkomstige toepassing, tenzij in dit artikel anders is bepaald.

      2 Het eerste lid is van overeenkomstige toepassing op de betrokkene, die als gevolg van ofwel de aanpassing per 1
      augustus 2002 van de eisen die gesteld worden aan leraren die taalondersteuning geven, dan wel de beëindiging van
      de bekostiging van het onderwijs in allochtone levende talen per 1 augustus 2004, werkloos is geworden.

      3 Indien aan de nieuwe dienstbetrekking geen maximum salaris is verbonden, wordt voor de toepassing van het eerste
      en tweede lid uitgegaan van het onverminderde loon in de nieuwe dienstbetrekking.

      4 In afwijking van het [zevende en negende lid van artikel 15][ref2], is de loonsuppletie voor de betrokkene
      bedoeld in het eerste en het tweede lid, voor zover het betreft de betrokkene die als gevolg van de aanpassing
      per 1 augustus 2002 van de eisen die gesteld worden aan leraren die taalondersteuning geven werkloos dreigt te
      worden dan wel werkloos is geworden, gelijk aan het verschil tussen enerzijds het onverminderde loon in de nieuwe
      dienstbetrekking en anderzijds:

      a. in de eerste vijf jaar na het aanvaarden van een nieuwe dienstbetrekking: de ongemaximeerde
      berekeningsgrondslag;

      b. na die eerste vijf jaar en doorlopend tot de eerste dag van de maand waarin de betrokkene 65 jaar wordt: 90% van
      de ongemaximeerde berekeningsgrondslag, herleid tot het bedrag dat geldt over de berekeningsperiode.

      5 Het vierde lid vindt geen toepassing indien het [negende lid van artikel 15][ref3] tot een voor de betrokkene
      gunstiger uitkomst leidt.

      6 Op de betrokkene, bedoeld in het eerste en tweede lid, voor zover het betreft de betrokkene die als gevolg van de
      beëindiging van de bekostiging van het onderwijs in allochtone levende talen per 1 augustus 2004 werkloos dreigt te
      worden dan wel werkloos is geworden, is het [negende lid van artikel 15][ref4] van overeenkomstige toepassing, met
      dien verstande dat in onderdeel b van dat artikellid voor «90%» wordt gelezen: 95%.

      7 In afwijking van het bepaalde in het [veertiende lid onder b van artikel 15][ref5] wordt er van uitgegaan dat het
      loon voor de betrokkene bedoeld in het eerste en het tweede lid in een nieuwe dienstbetrekking niet lager is dan
      het maximum van schaal 4 van het [Kaderbesluit rechtspositie PO][ref6].

      8 In afwijking van het zesde lid wordt indien sprake is van passende arbeid op grond van de WW uitgegaan van het
      loon in de nieuwe dienstbetrekking.


