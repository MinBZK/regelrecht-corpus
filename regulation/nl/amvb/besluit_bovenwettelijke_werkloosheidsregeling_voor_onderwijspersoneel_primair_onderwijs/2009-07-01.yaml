  - number: '8'
    text: |-
      1 De betrokkene die op de eerste werkloosheidsdag voldoet aan de voorwaarde van [artikel 42, tweede lid, WW][ref1],
      heeft zodra het einde van de duur van zijn WW-uitkering is bereikt recht op een aansluitende uitkering indien hij
      op de eerste werkloosheidsdag de leeftijd van 40 jaar heeft bereikt en een diensttijd heeft van tenminste 5 jaar.
      Indien het recht op WW-uitkering van de betrokkene na afloop van een periode van ZW-uitkering niet meer herleeft
      omdat er voor de WW-uitkering geen duur meer resteert, gaat in afwijking van de eerste volzin de aansluitende
      uitkering in op de dag per welke het recht op ZW-uitkering eindigt.

      2 Op de aansluitende uitkering zijn de [artikelen 16][ref2], [19][ref3], [20][ref4], [21][ref5] en
      [hoofdstuk VI WW][ref6] van overeenkomstige toepassing.

      3 In afwijking van het tweede lid eindigt het recht op aansluitende uitkering niet door de omstandigheid dat
      de betrokkene wegens ziekte, arbeidsongeschiktheid, zwangerschap of bevalling niet beschikbaar is om arbeid
      te aanvaarden, indien hij geen recht heeft op een uitkering op grond van de [ZW][ref7], de [WAZO][ref8], de
      [Wet werk en inkomen naar arbeidsvermogen][ref9] of de [Wet op de arbeidsongeschiktheidsverzekering][ref10] vanwege
      het enkele feit dat zijn verzekering op grond van de betreffende wet is geëindigd.


