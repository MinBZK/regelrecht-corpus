  - number: '5'
    text: |-
      1 De betrokkene die recht heeft op een uitkering op grond van de [WW][ref1], met uitzondering van een uitkering op
      grond van [hoofdstuk IV van de WW][ref2], heeft recht op een aanvulling op de WW-uitkering.

      2 Met betrekking tot de aanvulling, bedoeld in het eerste lid, zijn de [artikelen 16][ref3], [16a][ref4],
      [19][ref5], [20][ref6] en [21 WW][ref7] en [hoofdstuk VI van de WW][ref8] van overeenkomstige toepassing.

      3 De duur van de aanvulling is gelijk aan de duur van de WW-uitkering.

      4 Met betrekking tot de duur van de aanvulling is [artikel 43 WW][ref9] van overeenkomstige toepassing.

      5 De WW-uitkering wordt gedurende de eerste 12 maanden per dag aangevuld tot 78% en vervolgens tot 70% van de
      ongemaximeerde berekeningsgrondslag. Voor de bepaling van de duur van de periode van 12 maanden, bedoeld in de
      vorige volzin, wordt [artikel 43 WW][ref10] overeenkomstig toegepast, en worden perioden van aanvulling op de ZW-
      uitkering en op de WAZO-uitkering mede in aanmerking genomen.

      6 Met betrekking tot de hoogte van de aanvulling, bedoeld in dit artikel, is
      [artikel 47, tweede en derde lid, WW][ref11] van overeenkomstige toepassing.

      7 Voor de berekening van de hoogte van de aanvulling, bedoeld in dit artikel, wordt de uitkering op grond van de
      [WW][ref12] geacht onverminderd te zijn ontvangen indien deze op grond van enige wettelijke bepaling geheel of
      gedeeltelijk is geweigerd, dan wel niet of niet geheel is betaald.


