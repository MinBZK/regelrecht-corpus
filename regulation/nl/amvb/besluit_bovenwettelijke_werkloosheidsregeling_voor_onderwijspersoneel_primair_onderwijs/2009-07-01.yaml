        artikel: '5'
        hoofdstuk: '2'
  - number: '18'
    text: |-
      1 Op aanvraag van de betrokkene kan het recht op bovenwettelijke uitkering worden afgekocht in door Onze Minister
      te bepalen gevallen.

      2 Onze Minister kan nadere regels stellen aangaande het eerste lid.

      3 Indien het recht op bovenwettelijke uitkering vanaf een bepaald tijdstip is afgekocht:

      a. heeft de betrokkene geen enkele aanspraak op grond van deze regeling over de periode vanaf dat tijdstip, met
      uitzondering van aanspraken uit hoofde van een recht op bovenwettelijke uitkering dat na dat tijdstip is ontstaan;

      b. blijft bij de vaststelling van rechten op bovenwettelijke uitkering die na dat tijdstip ontstaan de diensttijd,
      voorafgaand aan het afgekochte recht op bovenwettelijke uitkering, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0012177/2009-07-01#Artikel18
  - number: '19'
    text: |-
      1 De betrokkene die recht heeft op een bovenwettelijke uitkering en elders arbeid gaat verrichten of een
      onderneming start, heeft op de voet van de bepalingen ter zake van de verplaatsingskosten die voor hem golden in
      de dienstbetrekking waaruit hij werkloos is geworden, recht op een tegemoetkoming in de kosten van een daartoe
      noodzakelijke verhuizing.

      2 Indien de betrokkene in verband met zijn nieuwe werkzaamheden uit anderen hoofde recht heeft op een vergoeding
      van verhuiskosten, wordt die vergoeding in mindering gebracht op het bedrag waarop hij op grond van het eerste lid
      recht heeft.

      3 Onze Minister is bevoegd tot verrekening van een onverschuldigd betaalde uitkering op grond van dit besluit met
      de tegemoetkoming in de verhuiskosten.

      4 De [artikelen 36 tot en met 36b WW][ref1] zijn van overeenkomstige toepassing op de tegemoetkoming in de
      verhuiskosten, voorzover deze onverschuldigd is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel36
    url: https://wetten.overheid.nl/BWBR0012177/2009-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '36'
  - number: '20'
    text: |-
      Bij ministeriële regeling kunnen voor alle betrokkenen, dan wel bepaalde categorieën van betrokkenen,
      reïntegratiebevorderende regelingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012177/2009-07-01#Artikel20
  - number: '21'
    text: |-
      Indien het niveau van de uitkering op grond van de [WW][ref1] een algemeen geldende neerwaartse wijziging
      ondergaat, wordt deze neerwaartse wijziging, behoudens indien in de Sectorcommissie Onderwijspersoneel als bedoeld
      in [artikel 2 van het Overlegbesluit onderwijspersoneel][ref2] binnen zes maanden na de datum van het Staatsblad
      waarin de maatregel is gepubliceerd overeenstemming wordt bereikt en een voordracht wordt gedaan voor een algemene
      maatregel van bestuur die als strekking heeft dat deze neerwaartse wijziging wordt bijgesteld, op overeenkomstige
      wijze doorgevoerd ten aanzien van het totaal aan wettelijke en bovenwettelijke aanspraken van de betrokkene, vanaf
      de in het Staatsblad vermelde datum van inwerkingtreding van bedoelde maatregel, doch niet eerder dan zes maanden
      na de datum van het Staatsblad.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0006446#Artikel2
    url: https://wetten.overheid.nl/BWBR0012177/2009-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0006446
        artikel: '2'
  - number: '22'
    text: |-
      1 Voorzover de [WW][ref1] en de [ZW][ref2] nog niet op hem van toepassing zijn geworden, kan een betrokkene geen
      aanspraken ontlenen aan dit besluit. Voorzover de [WW][ref3] en de [ZW][ref4] op hem van toepassing zijn geworden,
      kan een betrokkene geen aanspraken meer ontlenen aan het [BWOO][ref5].

      2 Zonodig in afwijking van het eerste lid:

      a. kan een recht op uitkering herleven op grond van [artikel 7, vijfde lid, BWOO][ref6], en

      b. kan een recht op loonsuppletie op grond van [artikel 38, zesde lid, BWOO][ref7] herleven. Voorzover
      de betrokkene tegelijk recht heeft op loonsuppletie op grond van [artikel 38 BWOO][ref8] en op grond van
      [artikel 15][ref9], wordt alleen de hoogste loonsuppletie uitbetaald.

      3 Voor de toepassing van [artikel 16][ref10] wordt een recht op aanvullende uitkering op grond van
      [hoofdstuk II, paragraaf 1 BWOO][ref11] aangemerkt als een recht op bovenwettelijke uitkering waaraan een recht
      op aansluitende uitkering is verbonden, indien de betrokkene op de ingangsdatum van het recht op loongerelateerde
      uitkering op grond van het [BWOO][ref12] waarop dit recht op aanvullende uitkering is gevolgd, ten minste 40 jaar
      oud was. Als duur van het oude recht op bovenwettelijke uitkering als bedoeld in [artikel 16][ref13], wordt in
      aanmerking genomen de som van de duur van de loongerelateerde uitkering op grond van het [BWOO][ref14] waarop de
      aanvullende uitkering is gevolgd, en de duur van de aanvullende uitkering.


