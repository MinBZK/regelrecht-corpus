  - number: '14'
    text: |-
      1 Zolang een betrokkene uit hoofde van een ontslag recht heeft op suppletie, heeft hij uit hoofde van dat ontslag
      geen recht op bovenwettelijke uitkering.

      2 Indien de voor de betrokkene geldende duur van de bovenwettelijke uitkering, zoals vastgesteld per de
      ingangsdatum van het ontslag, langer zou zijn dan de duur van de suppletie, heeft de betrokkene recht op
      bovenwettelijke uitkering met ingang van de dag per welke het recht op suppletie door het verstrijken van de
      duur eindigt. Duur en hoogte van de bovenwettelijke uitkering worden in dat geval vastgesteld alsof er op de
      ingangsdatum van het ontslag een recht op aanvulling op de WW-uitkering, eventueel gevolgd door een recht op
      aansluitende uitkering, zou zijn ontstaan en tot het verstrijken van de duur van de suppletie ononderbroken zou
      zijn doorgelopen.

      3 Zolang en voorzover de betrokkene tegelijk recht heeft op een bovenwettelijke uitkering op grond van dit artikel
      en een WW-uitkering, een ZW-uitkering, een andere bovenwettelijke uitkering of een uitkering die daar naar aard
      en strekking mee overeenkomt, heeft de bovenwettelijke uitkering op grond van dit artikel het karakter van een
      aanvulling tot de hoogte, bedoeld in [artikel 5, vijfde lid][ref1], of [artikel 9, zevende lid][ref2], die voor de
      betrokkene geldt op grond van het tweede lid. [Artikel 5, zevende lid][ref3], is van overeenkomstige toepassing.

      4 Indien op de suppletie onder overeenkomstige toepassing van [artikel 27 WW][ref4] een maatregel is toegepast
      die bij het verstrijken van de duur van de suppletie nog niet geheel is uitgevoerd, wordt deze maatregel
      voortgezet tijdens de bovenwettelijke uitkering. Indien de suppletie blijvend geheel geweigerd is, wordt ook de
      bovenwettelijke uitkering blijvend geheel geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012177#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012177#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0012177#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel27
