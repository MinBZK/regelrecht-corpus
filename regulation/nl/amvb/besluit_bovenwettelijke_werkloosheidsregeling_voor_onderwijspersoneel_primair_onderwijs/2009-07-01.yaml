  - number: '13'
    text: |-
      1 Indien de betrokkene die recht heeft op bovenwettelijke uitkering of op loonsuppletie op grond van
      [artikel 15][ref1], overlijdt:

      a. wordt de overlijdensuitkering, bedoeld in de [artikelen 35][ref2] en [36 ZW][ref3] en
      [artikel 23 Toeslagenwet][ref4], aangevuld tot het dagbedrag van de WW-uitkering, de ZW-uitkering, de toeslag
      op grond van de [Toeslagenwet][ref5] en de bovenwettelijke uitkering waarop de betrokkene op de dag van zijn
      overlijden recht had, vermenigvuldigd met 65,25;

      b. wordt, indien er geen recht bestaat op een overlijdensuitkering op grond van de [ZW][ref6] uitsluitend
      omdat de betrokkene niet meer verzekerd is op grond van de [ZW][ref7], een overlijdensuitkering toegekend onder
      overeenkomstige toepassing van [artikel 35][ref8] en [artikel 36, eerste lid, ZW][ref9]. Deze uitkering wordt
      aangevuld overeenkomstig het bepaalde onder a;

      c. wordt, al dan niet naast een overlijdensuitkering als bedoeld onder a of b, aan de nabestaanden, bedoeld in
      [artikel 35 ZW][ref10], van een betrokkene die recht had op loonsuppletie, een overlijdensuitkering toegekend ter
      hoogte van drie maal het bedrag aan loonsuppletie waarop de betrokkene recht had over de maand voorafgaand aan die
      waarin hij is overleden.

      2 Voor de toepassing van het eerste lid wordt een gezamenlijke huishouding slechts aanwezig geacht indien uit een
      ter zake verleden notariële akte alsmede uit een uittreksel van de gemeentelijke basisadministratie blijkt dat twee
      ongehuwde en niet als partner geregistreerde personen, tussen wie geen bloedverwantschap in de eerste of tweede
      graad bestaat, een gezamenlijk woonadres hebben en beiden een bijdrage leveren in de kosten van de huishouding, dan
      wel op andere wijze in elkaars verzorging voorzien.

      3 De overlijdensuitkering, bedoeld in het eerste lid, wordt zo spoedig mogelijk betaald, maar in elk geval binnen
      één maand na de vaststelling van het recht op de overlijdensuitkering.

      4 Andere bedragen waarop de nabestaanden ter zake van het overlijden recht hebben uit of in verband met
      dienstbetrekkingen van de betrokkene, worden op de overlijdensuitkering in mindering gebracht voorzover de
      inkomsten uit of in verband met die dienstbetrekkingen in mindering werden gebracht op de WW-uitkering, de ZW-
      uitkering of de bovenwettelijke uitkering van de betrokkene.

      De vorige volzin wordt niet toegepast voorzover met die dienstbetrekkingen, of met de inkomsten uit of in verband
      daarmee, al rekening is gehouden bij de toepassing van het eerste lid.

      5 Onze Minister is bevoegd tot verrekening van onverschuldigd betaalde uitkering op grond van dit besluit met de
      overlijdensuitkering.

      6 De [artikelen 33 tot en met 33b ZW][ref11] zijn van overeenkomstige toepassing op de overlijdensuitkering
      voorzover deze onverschuldigd is betaald.


