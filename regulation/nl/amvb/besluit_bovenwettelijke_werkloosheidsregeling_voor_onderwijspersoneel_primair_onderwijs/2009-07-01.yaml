  - number: '15'
    text: |-
      1 De betrokkene, wiens recht op bovenwettelijke uitkering binnen de duur, bedoeld in het zevende lid, geheel of
      gedeeltelijk is geëindigd wegens de aanvang van een nieuwe dienstbetrekking, heeft recht op loonsuppletie indien
      het onverminderde loon in zijn nieuwe dienstbetrekking minder bedraagt dan de ongemaximeerde berekeningsgrondslag,
      dan wel, als het negende lid, onderdeel b, of het tiende lid van toepassing is, minder bedraagt dan het daar
      bedoelde deel van de ongemaximeerde berekeningsgrondslag.

      2 Het eerste lid is mede van toepassing op de betrokkene die geen recht op bovenwettelijke uitkering heeft, maar
      dit recht wel zou hebben gehad als hij geen nieuwe dienstbetrekking had aanvaard. Voor de toepassing van het
      eerste lid wordt ten aanzien van deze betrokkene gehandeld alsof hij aansluitend aan zijn arbeidsurenverlies als
      betrokkene een recht op bovenwettelijke uitkering zou hebben verkregen.

      3 Voor de toepassing van het eerste lid:

      a. wordt onder nieuwe dienstbetrekking niet verstaan: een arbeidsverhouding die op grond van [artikel 4][ref1]
      of [5 WW][ref2] als dienstbetrekking wordt beschouwd;

      b. wordt mede als nieuwe dienstbetrekking aangemerkt: een arbeidsverhouding waarop buitenlands recht van toepassing
      is en die naar aard en strekking overeenkomt met een dienstbetrekking, anders dan bedoeld onder a.

      4 In afwijking van het eerste en tweede lid heeft de betrokkene geen recht op loonsuppletie indien zijn
      bovenwettelijke uitkering blijvend geheel is, respectievelijk zou zijn, geweigerd.

      5 Het recht op loonsuppletie eindigt:

      a. voorzover de betrokkene arbeidsuren, alsmede het recht op onverminderde loonbetaling over die arbeidsuren, uit
      zijn nieuwe dienstbetrekking verliest;

      b. zodra de betrokkene het recht op loonbetaling uit zijn nieuwe dienstbetrekking verliest terwijl die
      dienstbetrekking blijft bestaan;

      c. met ingang van een berekeningsperiode als bedoeld in het achtste lid, indien over die berekeningsperiode het
      loon in de nieuwe dienstbetrekking niet meer lager is dan de ongemaximeerde berekeningsgrondslag of het deel
      daarvan, bedoeld in het eerste lid;

      d. zodra de omstandigheid, bedoeld in het vierde lid, zich voordoet;

      e. zodra de duur van de loonsuppletie is verstreken.

      6 Indien het recht op loonsuppletie is geëindigd op grond van het vijfde lid, onderdeel a, b of c, heeft de
      betrokkene opnieuw recht op loonsuppletie indien de omstandigheid die het recht heeft doen eindigen heeft
      opgehouden te bestaan en de betrokkene binnen de duur, bedoeld in het zevende lid, opnieuw voldoet aan de
      voorwaarden, gesteld in het eerste of tweede lid, zonder dat de omstandigheid, bedoeld in het vierde lid, zich
      voordoet. Voorzover de betrokkene tegelijk recht op loonsuppletie heeft op grond van meer dan één recht op
      bovenwettelijke uitkering, wordt alleen het hoogste recht op loonsuppletie uitbetaald.

      7 De loonsuppletie duurt uiterlijk tot het einde van de duur van de bovenwettelijke uitkering, zoals die is
      vastgesteld per de eerste werkloosheidsdag.

      8 De berekeningsperiode van de loonsuppletie is het deel van een kalendermaand waarover de betrokkene recht heeft
      op loon uit zijn nieuwe dienstbetrekking en waarin de duur, bedoeld in het zevende lid, nog niet is verstreken. Zo
      nodig in afwijking van de vorige volzin begint een nieuwe berekeningsperiode zodra het negende lid, onderdeel b,
      van toepassing wordt.

      9 De loonsuppletie is gelijk aan het verschil tussen enerzijds het onverminderde loon in de nieuwe dienstbetrekking
      en anderzijds:

      a. in de eerste helft van de duur van de bovenwettelijke uitkering, bedoeld in het zevende lid: de ongemaximeerde
      berekeningsgrondslag,

      b. in de tweede helft van de duur van de bovenwettelijke uitkering, bedoeld in het zevende lid: 90% van de
      ongemaximeerde berekeningsgrondslag, herleid tot het bedrag dat geldt over de berekeningsperiode.

      10 In afwijking van het negende lid wordt, indien de nieuwe dienstbetrekking een kleinere urenomvang per week heeft
      dan de bovenwettelijke uitkering waarop de betrokkene recht had of zou hebben gehad, voor de berekening bedoeld
      in het negende lid de ongemaximeerde berekeningsgrondslag vermenigvuldigd met de urenomvang per week van de nieuwe
      dienstbetrekking, gedeeld door de urenomvang per week van de bovenwettelijke uitkering waarop de betrokkene recht
      had of zou hebben gehad. Indien de nieuwe dienstbetrekking geen vaste urenomvang of vaste gemiddelde urenomvang per
      week heeft, wordt bij deze berekening de gemiddelde urenomvang per week in de berekeningsperiode, bedoeld in het
      achtste lid, in aanmerking genomen. Dit lid wordt niet toegepast als zowel de nieuwe dienstbetrekking als het recht
      op bovenwettelijke uitkering een urenomvang per week heeft, gelijk aan die van een volledige dienstbetrekking.

      11 De loonsuppletie wordt toegekend op aanvraag van de betrokkene. De betrokkene die voor loonsuppletie in
      aanmerking wil komen is verplicht:

      a. binnen drie maanden na het ontstaan van het recht op loonsuppletie een aanvraag om loonsuppletie in te dienen,
      en

      b. de door Onze Minister te stellen controlevoorschriften loonsuppletie na te leven, en

      c. passende arbeid tegen een hoger loon te aanvaarden indien deze hem wordt aangeboden.

      Indien de betrokkene deze verplichtingen niet nakomt, zijn de [artikelen 22 tot en met 24][ref3], [26][ref4] en
      [27 WW][ref5] van overeenkomstige toepassing. Onze Minister kan nadere regels stellen aangaande onderdeel c.

      12 [Artikel 25 WW][ref6] is van overeenkomstige toepassing op de loonsuppletie. Indien de betrokkene de hieruit
      voortvloeiende verplichtingen niet of niet behoorlijk is nagekomen, kan Onze Minister de loonsuppletie tijdelijk of
      blijvend, geheel of gedeeltelijk, weigeren.

      13 De loonsuppletie wordt per maand achteraf betaald. Op de betaling van de loonsuppletie zijn de
      [artikelen 30][ref7] en [36 tot en met 40 WW][ref8], met inbegrip van de bepalingen waarnaar deze verwijzen, van
      overeenkomstige toepassing.

      14 Voor de toepassing van dit artikel:

      a. wordt een loonsuppletie uit anderen hoofde of een daarmee naar aard en strekking overeenkomende uitkering,
      waarop de betrokkene recht heeft, geacht deel uit te maken van het loon in de nieuwe dienstbetrekking;

      b. wordt, tenzij de nieuwe dienstbetrekking op grond van de [WW][ref9] voor de betrokkene passende arbeid is, het
      loon in de nieuwe dienstbetrekking geacht niet lager te zijn dan 70% van het dagloon waarop de WW-uitkering van de
      betrokkene was of zou zijn gebaseerd. Het tiende lid is van overeenkomstige toepassing;

      c. wordt het loon in de nieuwe dienstbetrekking overigens op dezelfde wijze vastgesteld als de ongemaximeerde
      berekeningsgrondslag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel22
