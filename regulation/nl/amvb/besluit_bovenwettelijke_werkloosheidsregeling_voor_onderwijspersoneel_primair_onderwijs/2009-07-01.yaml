  - number: '9'
    text: |-
      1 De duur van de aansluitende uitkering is voor de betrokkene die op de eerste werkloosheidsdag een diensttijd
      heeft van ten minste 5 jaar en

      a. 40 jaar oud is: 1 jaar

      b. 41 jaar oud is: 1,5 jaar

      c. 42 jaar oud is: 2 jaar

      d. 43 jaar oud is: 2,5 jaar

      e. 44 jaar of ouder is: 3 jaar

      2 De duur van de aansluitende uitkering is voor de betrokkene die op de eerste werkloosheidsdag een diensttijd
      heeft van ten minste 7 jaar en

      a. 45 jaar oud is: 3,5 jaar

      b. 46 jaar oud is: 4 jaar

      c. 47 jaar oud is: 4,5 jaar

      d. 48 jaar oud is: 5 jaar

      e. 49 jaar of ouder is: 5,5 jaar

      3 De duur van de aansluitende uitkering is voor de betrokkene die op de eerste werkloosheidsdag een diensttijd
      heeft van ten minste 12 jaar en

      a. 53 jaar of ouder is: tot de eerste dag van de maand waarin hij 65 jaar wordt;

      b. 52 jaar is: tot de eerste dag van de maand waarin hij 64 jaar wordt;

      c. 51 jaar is: tot de eerste dag van de maand waarin hij 64 jaar wordt;

      d. 50 jaar is: tot de eerste dag van de maand waarin hij 63 jaar wordt.

      4 Op de duur van de aansluitende uitkering is [artikel 43 WW][ref1] van overeenkomstige toepassing. Indien de
      aansluitende uitkering ingaat op de dag per welke een recht op ZW-uitkering eindigt, worden de eerste drie maanden
      van de ZW-uitkering, bedoeld in [artikel 43, tweede en derde lid, WW][ref2] in mindering gebracht op de duur van de
      aansluitende uitkering, bedoeld in het eerste en tweede lid, voorzover zij niet reeds in mindering zijn gebracht op
      de duur van de loongerelateerde uitkering.

      5 Indien de duur van de aanvulling op de loongerelateerde uitkering onder overeenkomstige toepassing van
      [artikel 76 WW][ref3] is verlengd, wordt de duur van deze verlenging in mindering gebracht op de duur van de
      aansluitende uitkering, bedoeld in het eerste en tweede lid.

      6 Indien de betrokkene bij het einde van zijn dienstbetrekking recht heeft op:

      a. een uitkering op grond van de [WIA][ref4] of op een uitkering die daarmee naar aard en strekking overeenkomt,
      en nadien als gevolg van een vaststelling van de mate van arbeidsongeschiktheid op minder dan 80% recht krijgt
      op een WW-uitkering waaraan een recht op aansluitende uitkering is verbonden, wordt de duur van deze aansluitende
      uitkering, indien die is vastgesteld op grond van het eerste of tweede lid, verminderd met de duur van de periode
      tussen het einde van zijn dienstbetrekking en de eerste werkloosheidsdag;

      b. een uitkering op grond van de [ZW][ref5] of een daarmee naar aard en strekking overeenkomende uitkering,
      onmiddellijk gevolgd door een uitkering op grond van de [WIA][ref6] of op een uitkering die daarmee naar aard en
      strekking overeenkomt, en nadien als gevolg van een vaststelling van de mate van arbeidsongeschiktheid op minder
      dan 80% recht krijgt op een WW-uitkering waaraan een recht op aansluitende uitkering is verbonden, wordt de duur
      van deze aansluitende uitkering, indien die is vastgesteld op grond van het eerste of tweede lid, verminderd
      met de duur van de periode tussen het einde van zijn ZW- of daarmee overeenkomende uitkering en de eerste
      werkloosheidsdag;

      c. een uitkering op grond van [artikel 3:8 WAZO][ref7], onmiddellijk gevolgd door een uitkering op grond van de
      [ZW][ref8] of een daarmee naar aard en strekking overeenkomende uitkering, die weer onmiddellijk is gevolgd door
      een uitkering op grond van de [WIA][ref9] of een uitkering die daarmee naar aard en strekking overeenkomt, en
      nadien als gevolg van een vaststelling van de mate van arbeidsongeschiktheid op minder dan 80% recht krijgt op
      een WW-uitkering waaraan een recht op aansluitende uitkering is verbonden, wordt de duur van deze aansluitende
      uitkering, indien die is vastgesteld op grond van het eerste of tweede lid, verminderd met de duur van de periode
      tussen het einde van zijn ZWuitkering of daarmee overeenkomende uitkering en de eerste werkloosheidsdag.

      7 De aansluitende uitkering bedraagt per dag 70% van de gemaximeerde berekeningsgrondslag. Zolang en voorzover de
      betrokkene tegelijk recht heeft op een aansluitende uitkering op grond van dit artikel en een WW-uitkering of een
      bovenwettelijke uitkering, heeft de aansluitende uitkering op grond van dit artikel het karakter van een aanvulling
      tot 70% van de gemaximeerde berekeningsgrondslag. [Artikel 5, zevende lid][ref10], is van overeenkomstige
      toepassing.

      8 Op de hoogte van de aansluitende uitkering is [artikel 47, tweede en derde lid, WW][ref11] van overeenkomstige
      toepassing.


