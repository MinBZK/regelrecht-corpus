  - number: '17'
    text: |-
      1 Voorzover de betrokkene die een recht op bovenwettelijke uitkering heeft gehad dat geheel of gedeeltelijk is
      geëindigd, na aanvaarding van een nieuwe dienstbetrekking opnieuw werkloos is en een nieuw recht op WW-uitkering
      heeft, waaraan geen nieuw recht op bovenwettelijke uitkering is verbonden, herleeft zijn recht op bovenwettelijke
      uitkering per de ingangsdatum van het nieuwe recht op WW-uitkering.

      2 Het recht op bovenwettelijke uitkering herleeft in afwijking van het eerste lid niet:

      a. indien er ten aanzien van dit recht een herlevingstermijn als bedoeld in
      [artikel 21, eerste, derde en vierde lid, WW][ref1] is overschreden, anders dan wegens verblijf buiten Nederland om
      daar werkzaamheden, anders dan in de uitoefening van een bedrijf of de zelfstandige uitoefening van een beroep te
      verrichten, of

      b. indien de duur van dit recht op het moment waarop het op grond van het eerste lid zou herleven, reeds is
      verstreken.

      3 Het eerste en tweede lid zijn mede van toepassing op de betrokkene die ter zake van zijn arbeidsurenverlies
      als betrokkene geen recht op bovenwettelijke uitkering heeft, maar dat recht wel zou hebben gehad als hij geen
      nieuwe dienstbetrekking of werkzaamheden als bedoeld in het tweede lid, onderdeel a, had aanvaard. Ten aanzien
      van deze betrokkene wordt voor de toepassing van het eerste en tweede lid gehandeld alsof hij aansluitend op zijn
      arbeidsurenverlies als betrokkene een recht op bovenwettelijke uitkering zou hebben verkregen, dat tegelijk weer
      zou zijn geëindigd.

      4 De bovenwettelijke uitkering van de betrokkene, bedoeld in het derde lid, wordt blijvend geheel geweigerd indien
      deze blijvend geheel zou zijn geweigerd als er ten gevolge van het arbeidsurenverlies als betrokkene een recht op
      bovenwettelijke uitkering zou zijn ontstaan.

      5 Het recht op uitkering op grond van dit artikel wordt niet toegekend indien de betrokkene onvoldoende aannemelijk
      maakt dat hij voldoet aan de voorwaarden die in zijn geval voortvloeien uit het eerste tot en met vierde lid. Onze
      Minister kan nadere regels stellen inzake de vorige volzin.

      6 Het eerste tot en met vijfde lid zijn mede van toepassing op de betrokkene die recht heeft op ZW-uitkering of op
      uitkering op grond van [artikel 3:8 WAZO][ref2] en die, als hij geen recht op die uitkering zou hebben gehad, een
      nieuw recht op WW-uitkering zou hebben gehad, behalve in de situaties, bedoeld in [artikel 6, derde lid][ref3].

      7 Zolang en voorzover de betrokkene tegelijk recht heeft op een bovenwettelijke uitkering die op grond van
      dit artikel is herleefd en een WW-uitkering, een ZW-uitkering, een andere bovenwettelijke uitkering of een
      uitkering die naar aard en strekking met een van deze uitkeringen overeenkomt, heeft de op grond van dit artikel
      herleefde uitkering het karakter van een aanvulling tot de hoogte, bedoeld in [artikel 5, vijfde lid][ref4], of
      [artikel 9, zevende lid][ref5], die voor de betrokkene geldt op grond van het recht op bovenwettelijke uitkering
      dat op grond van dit artikel is herleefd. [Artikel 5, zevende lid][ref6], is van overeenkomstige toepassing.


