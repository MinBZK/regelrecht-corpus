  - number: '11'
    text: |-
      1 De aanvulling op de WW-uitkering, de aanvulling op de ZW-uitkering en de aanvulling op de WAZO-uitkering worden
      eenmaal per drie maanden achteraf betaald.

      2 Voorzover in dit besluit niet anders is bepaald:

      a. zijn de [artikelen 30 tot en met 41 WW][ref1] van overeenkomstige toepassing op de aanvulling op de WW-
      uitkering en op de aansluitende uitkering, behalve in de situatie, bedoeld in [artikel 8, derde lid][ref2].
      [Artikel 41 WW][ref3] wordt op de bovenwettelijke uitkering uitsluitend toegepast indien het uit te betalen bedrag
      van de WW-uitkering en de bovenwettelijke uitkering samen een hoogte heeft als bedoeld in [artikel 41 WW][ref4];

      b. zijn de [artikelen 31, tweede tot en met vijfde lid][ref5], [32 tot en met 33b][ref6], [40 tot en met 42][ref7],
      [47 tot en met 48][ref8], [50][ref9] en [85 ZW][ref10] van overeenkomstige toepassing op de aanvulling op de ZW-
      uitkering en op de aansluitende uitkering, bedoeld in [artikel 8, derde lid][ref11];

      c. zijn de [artikelen 3:14][ref12] en [3:16, tweede lid, onderdelen a en b, WAZO][ref13] van toepassing op de
      aanvulling op de WAZO-uitkering.


