  - number: '2'
    text: |-
      Voorzover in dit besluit niet anders is bepaald, geeft dit besluit geen aanspraken voorzover de betrokkene
      arbeidsuren heeft verloren uit een dienstbetrekking op grond waarvan hij geen betrokkene is.
    url: https://wetten.overheid.nl/BWBR0012177/2009-07-01#Artikel2
  - number: '3'
    text: |-
      1 De ongemaximeerde en de gemaximeerde berekeningsgrondslag, alsmede het bedrag genoemd in
      [artikel 1, onderdeel k][ref1], worden periodiek herzien. Op deze herziening is artikel [46 WW][ref2] van
      overeenkomstige toepassing.

      2 Onze Minister kan bepalen dat in plaats van de indexering, bedoeld in het eerste lid, een andere indexering wordt
      toegepast.

      3 Onze Minister maakt in «Uitleg OC&W-regelingen» bekend met ingang van welke dag en met welk percentage een
      herziening als bedoeld in het eerste of tweede lid plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0012177#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel46
    url: https://wetten.overheid.nl/BWBR0012177/2009-07-01#Artikel3
