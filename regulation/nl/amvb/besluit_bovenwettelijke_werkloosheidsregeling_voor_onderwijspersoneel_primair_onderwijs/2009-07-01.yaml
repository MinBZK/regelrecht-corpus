preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 14 november 2000, nr. AB/
    PSW/2000/44665, directie Arbeidsvoorwaarden en Beroepskwaliteit, gedaan mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Gelet op artikel 33, tweede lid, van de Wet op het primair onderwijs; artikel 33, tweede lid, van de Wet op de
    expertisecentra; de artikelen 38a en 153, tweede lid, van de Wet op het voortgezet onderwijs; de artikelen 4.1.2,
    tweede lid, en 4.3.2, tweede lid, van de Wet educatie en beroepsonderwijs;

    De Raad van State gehoord (advies van 14 december 2000, nr. W05.00.0567/III);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen, mede namens Onze Minister van
    Landbouw, Natuurbeheer en Visserij, van 16 januari 2001, nr. AB/PSW/2001/1036;

    hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012177/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen, en, voorzover het betreft het onderwijs op
      het gebied van landbouw en natuurlijke omgeving: Onze Minister van Landbouw, Natuurbeheer en Visserij;

      b. betrokkene: degene die in dienstbetrekking staat of heeft gestaan als:

      1. personeelslid als bedoeld in de [artikelen 34][ref1] en [68 van de Wet op het primair onderwijs][ref2];

      2. personeelslid als bedoeld in de [artikelen 34][ref3] en [69 van de Wet op de expertisecentra][ref4];

      3.

      4. personeelslid van een school waarvoor ingevolge [artikel 4, eerste lid, van de Experimentenwet onderwijs][ref5]
      de formatie wordt vastgesteld;

      5.

      6.

      7. lid van het college van bestuur of van de centrale directie van een hogeschool;

      8. benoemd lid van het algemeen bestuur van de organisatie genoemd in de
      [Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref6];

      9. personeelslid van een lichaam, bedoeld in
      [artikel 2, eerste lid, onderdelen f en g, dan wel derde lid, onderdeel b, van de Wet privatisering ABP][ref7],
      indien dat lichaam geheel of gedeeltelijk wordt gesubsidieerd ten laste van hoofdstuk VIII van de Rijksbegroting en
      waarop deze wet door Onze Minister van toepassing is verklaard;

      10.

      11. personeelslid in de zin van de Wet op de onderwijsverzorging zoals deze wet luidde op
      31 december 1996, dan wel een personeelslid werkzaam bij een instelling als bedoeld in de
      [Wet subsidiëring landelijke onderwijsondersteunende activiteiten][ref8] voorzover hij voor of uiterlijk op
      31 december 1998 werkloos is geworden;

      c. het BWOO: het [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref9];

      d. de WW: de [Werkloosheidswet][ref10];

      e. de ZW: de [Ziektewet][ref11];

      f. de WIA: de [Wet werk en inkomen naar arbeidsvermogen][ref12]

      g. de WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref13]

      h. de WAZO: de [Wet arbeid en zorg][ref14];

      i. diensttijd: de tijd doorgebracht in een dienstbetrekking als bedoeld onder b of de tijd doorgebracht
      in een dienstbetrekking bij een universiteit, een hogeschool of een onderzoeksinstelling zoals bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______________, een instelling of kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld in
      [artikel 5a.1 van het Uitvoeringsbesluit WEB][ref16] of bij een school voor voortgezet onderwijs in de zin van
      de [Wet op het voortgezet onderwijs][ref17], waaronder begrepen een dienstbetrekking als overheidswerknemer als
      bedoeld in de [Wet privatisering ABP][ref18] bij een rechtsvoorganger van een werkgever als bedoeld onder b, met
      uitzondering van de tijd voorafgaand aan een aaneengesloten periode van meer dan 14 maanden waarin de betrokkene
      niet een zodanige dienstbetrekking had. Voor de periode van 14 maanden, bedoeld in de vorige volzin, blijft een
      periode waarin de betrokkene onmiddellijk voorafgaand aan zijn werkloosheid recht had op een uitkering op grond
      van de [ZW][ref19], de [WIA][ref20], de [WAO][ref21] of de [WAZO][ref22], of een uitkering die daarmee naar aard en
      strekking overeenkomt, buiten beschouwing;

      j. ongemaximeerde berekeningsgrondslag: het dagloon dat geldt voor de [WW][ref23], waarbij echter:

      1. de maximumdagloongrens, bedoeld in [artikel 45, eerste lid, WW][ref24], buiten beschouwing wordt gelaten;

      2. een loonsuppletie, verstrekt op grond van [artikel 15][ref25] of [artikel 38 BWOO][ref26], tot het loon wordt
      gerekend;

      k. gemaximeerde berekeningsgrondslag: de berekeningsgrondslag bedoeld onder j, maar ten hoogste € 205,57;

      l. aanvulling op de WW-uitkering: de aanvulling op de WW-uitkering, bedoeld in [artikel 5][ref27];

      m. aanvulling op de ZW-uitkering: de aanvulling op de ZW-uitkering, bedoeld in [artikel 6][ref28];

      n. aanvulling op de WAZO-uitkering: de aanvulling op de WAZO-uitkering, bedoeld in [artikel 6][ref29];

      o. aansluitende uitkering: de aansluitende uitkering, bedoeld in [artikel 8][ref30];

      p. bovenwettelijke uitkering: de aanvulling op de WW-uitkering, de aanvulling op de ZW-uitkering, de aanvulling op
      de WAZO-uitkering en de aansluitende uitkering;

      q. dienstbetrekking: een dienstbetrekking als bedoeld in de [WW][ref31];

      r. eerste werkloosheidsdag: de eerste werkloosheidsdag, bedoeld in [artikel 16a WW][ref32];

      s. suppletie: een suppletie op grond van
      __REF000___________________________________________________________________________________________________________
      _;

      t. minimumloon: het minimumloon, bedoeld in [artikel 14, tweede lid, WW][ref34].


