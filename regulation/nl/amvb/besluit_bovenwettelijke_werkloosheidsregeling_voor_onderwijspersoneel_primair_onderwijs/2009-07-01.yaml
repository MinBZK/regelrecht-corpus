  - number: '23'
    text: |-
      Indien de toepassing van dit besluit voor de betrokkene tot een onbillijkheid van overwegende aard leidt, die zich
      niet zou hebben voorgedaan als dit besluit niet in werking zou zijn getreden, kan Onze Minister besluiten het door
      deze onbillijkheid voor de betrokkene ontstane nadeel geheel of gedeeltelijk te compenseren.
    url: https://wetten.overheid.nl/BWBR0012177/2009-07-01#Artikel23
  - number: '25'
    text: |-
      Dit besluit wordt aangehaald als: Besluit bovenwettelijke werkloosheidsregeling voor onderwijspersoneel primair
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0012177/2009-07-01#Artikel25
