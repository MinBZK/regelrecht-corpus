  - number: '6.13'
    text: |-
      1 Het is verboden zonder daartoe strekkende vergunning van Onze Minister als bedoeld in
      [artikel 6.5 van de wet][ref1] gebruik te maken van de Noordzee door, anders dan in overeenstemming met de functie,
      daarin, daarop, daarboven, daarover of daaronder:

      a. de bodem op te hogen of te verharden of land aan te winnen;

      b. suppleties of andere handelingen die een landwaartse verplaatsing van de kustlijn tot gevolg kunnen hebben uit
      te voeren, anders dan op grond van [artikel 2.7 van de wet][ref2];

      c. installaties of kabels en leidingen te plaatsen of neer te leggen, of deze te laten staan of liggen;

      d. te bouwen.

      2 [Artikel 6.12, tweede lid, aanhef en onderdelen c en f][ref3], is van overeenkomstige toepassing.


