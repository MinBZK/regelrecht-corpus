  - number: '4.1'
    text: |-
      1 De voorbereiding van het nationale waterplan en de documenten die ten behoeve van het opstellen van dat plan
      afzonderlijk worden vastgesteld, geschiedt overeenkomstig [afdeling 3.4 van de Algemene wet bestuursrecht][ref1],
      met dien verstande dat zienswijzen op het ontwerp naar voren kunnen worden gebracht door een ieder, gedurende een
      termijn van zes maanden.

      2 Het ontwerp van het nationale waterplan wordt ten minste een jaar voor het begin van de periode waarop het plan
      betrekking heeft ter inzage gelegd.

      3 De ontwerpen van het nationale waterplan en de documenten, bedoeld in het eerste lid, worden tevens ter inzage
      gelegd bij de provincies.

      4 Ten behoeve van de voorbereiding van het nationale waterplan 2016–2021 worden een voorlopig maatregelenprogramma
      en een aanvullend monitoringsprogramma als bedoeld in artikel 3, lid 1bis, onder ii, van de richtlijn prioritaire
      stoffen opgesteld en uiterlijk op 22 december 2018 door Onze Minister toegezonden aan de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '4.2'
    text: |-
      In afwijking van [artikel 4.1, eerste lid][ref1], geldt een termijn van zes weken voor het naar voren brengen van
      zienswijzen op het ontwerp van tussentijdse wijzigingen van het nationale waterplan, voor zover die wijzigingen
      geen betrekking hebben op een stroomgebiedbeheerplan of overstromingsrisicobeheerplan.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '4.1'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.3'
    text: |-
      1 Ter voorbereiding van het nationale waterplan leggen Onze Ministers ter inzage:

      a. een tijdschema en een werkprogramma voor het opstellen van de stroomgebiedbeheerplannen die betrekking hebben of
      mede betrekking hebben op het Nederlandse grondgebied, ten minste drie jaren voor het begin van de periode waarop
      het plan betrekking heeft;

      b. een tussentijds overzicht van belangrijke waterbeheerkwesties die zijn vastgesteld in de stroomgebieddistricten,
      ten minste twee jaren voor het begin van de periode waarop het plan betrekking heeft;

      c. het ontwerp van een samenvatting van de volgende elementen van de mariene strategie voor de Noordzee:

      1°. de initiële beoordeling, bedoeld in artikel 8 van de kaderrichtlijn mariene strategie;

      2°. de omschrijving van de goede milieutoestand, bedoeld in artikel 9, eerste lid, van die richtlijn;

      3°. de milieudoelen en bijbehorende indicatoren, bedoeld in artikel 10, eerste lid, van die richtlijn;

      4°. het monitoringsprogramma, bedoeld in artikel 11, eerste en tweede lid, van die richtlijn; en

      5°. het programma van maatregelen, bedoeld in de artikelen 13, eerste tot en met vierde, zevende en achtste lid, en
      14 van die richtlijn.

      2 Onze Ministers leggen, tegelijk met ontwerp van het nationale waterplan, ter inzage:

      a. het ontwerp van de stroomgebiedbeheerplannen die betrekking hebben of mede betrekking hebben op het Nederlandse
      grondgebied; en

      b. het ontwerp van de overstromingsrisicobeheerplannen die betrekking hebben of mede betrekking hebben op het
      Nederlandse grondgebied;

      c. de initiële beoordeling en het monitoringsprogramma, bedoeld in het eerste lid, onderdeel c, onder 1°
      respectievelijk 4°.

      3 Op een overstromingsrisicobeheerplan is [artikel 4.3, tweede lid, van de wet][ref1] van overeenkomstige
      toepassing.

      4 Het ontwerp van een samenvatting, bedoeld in het eerste lid, onderdeel c, wordt telkens ten minste zes weken voor
      het tijdstip waarop zij wordt vastgesteld ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3.4'
  - number: '4.4'
    text: |-
      1 Bij de voorbereiding van het nationale waterplan raadplegen Onze Ministers:

      a. vertegenwoordigers uit de kring van de provincies, de waterschappen en de gemeenten;

      b. ten aanzien van stroomgebiedbeheerplannen en overstromingsrisicobeheerplannen: gedeputeerde staten van de
      provincies en het dagelijks bestuur van de waterschappen, op wiens grondgebied het Nederlandse deel van het
      stroomgebieddistrict mede is gelegen;

      c. ten aanzien van de uitvoering van de kaderrichtlijn water en de richtlijn overstromingsrisico’s: de bevoegde
      autoriteiten van andere staten in de stroomgebieddistricten Rijn, Maas, Schelde en Eems;

      d. ten aanzien van het Noordzeebeleid: de bevoegde autoriteiten van de staten die partij zijn bij het Verdrag.

      2 Bij regeling van Onze Minister kunnen organisaties en overlegstructuren worden aangewezen die bij de
      voorbereiding van het nationale waterplan worden geraadpleegd met betrekking tot de mariene strategie voor de
      Noordzee.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel4.4
  - number: '4.5'
    text: |-
      1 Het nationale waterplan omvat mede:

      a. de overstromingsrisicobeheerplannen voor de stroomgebieddistricten Rijn, Maas, Schelde en Eems, voor zover die
      betrekking hebben of mede betrekking hebben op het Nederlandse grondgebied;

      b. de aanwijzing van de oppervlaktewaterlichamen in de zin van de kaderrichtlijn water die in beheer zijn bij het
      Rijk, waarbij kunstmatige of sterk veranderde oppervlaktewaterlichamen worden aangewezen overeenkomstig artikel 4,
      derde lid, van die richtlijn.

      2 Een stroomgebiedbeheerplan omvat de informatie, bedoeld in bijlage VII bij de kaderrichtlijn water en de
      artikelen 3, vijfde en zesde lid, 4, vierde lid, 5, vierde en vijfde lid, en deel C van bijlage II van de
      grondwaterrichtlijn, betreffende het Nederlandse deel van het stroomgebieddistrict, en de informatie, bedoeld
      in artikel 3, vijfde lid, van de richtlijn prioritaire stoffen en de inventaris, bedoeld in artikel 5 van die
      richtlijn.

      3 Een overstromingsrisicobeheerplan voldoet aan artikel 7 van de richtlijn overstromingsrisico’s. Het plan heeft
      geen betrekking op overstromingen vanuit rioolstelsels.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel4.5
  - number: 4.5a
    text: |-
      1 Het nationale waterplan omvat mede een plan voor de Nederlandse mariene wateren dat overeenkomstig artikel
      5 van de kaderrichtlijn maritieme ruimtelijke planning beoogt bij te dragen aan de in dat artikel bedoelde
      doelstellingen.

      2 In het maritiem ruimtelijk plan wordt de ruimtelijke en temporele verdeling van bestaande en toekomstige
      activiteiten en gebruiksfuncties in de Nederlandse mariene wateren geïdentificeerd, waarbij onverminderd artikel
      2, derde lid, van de kaderrichtlijn maritieme ruimtelijke planning de relevante wisselwerkingen van activiteiten en
      gebruiksfuncties in aanmerking zijn genomen.

      3 Het maritiem ruimtelijk plan bevat een weergave van de procedurele stappen die zijn of worden genomen om aan de
      in artikel 5 van de kaderrichtlijn maritieme ruimtelijke planning bedoelde doelstellingen bij te dragen, waarbij
      rekening is gehouden met relevante activiteiten in en gebruiksfuncties van de mariene wateren. Daartoe bevat het
      plan tenminste een beschrijving van de wijze waarop in het kader van maritieme ruimtelijke planning:

      a. rekening is gehouden met:

      i. de bijzonderheden van de mariene regio waarvan de Noordzee deel uitmaakt,

      ii. de relevante bestaande en toekomstige activiteiten en gebruiksfuncties en het effect daarvan op het milieu,
      alsmede de natuurlijke rijkdommen,

      iii. de wisselwerking tussen land en zee,

      iv. de ecologische, economische, sociale en veiligheidsaspecten;

      b. ernaar wordt gestreefd de samenhang tussen maritieme ruimtelijke planning en andere planprocessen te bevorderen;

      c. overeenkomstig artikel 10 van de kaderrichtlijn maritieme ruimtelijke planning het gebruik van de beste
      beschikbare gegevens, alsmede de uitwisseling van informatie, is georganiseerd;

      d. overeenkomstig de artikelen 11 en 12 van de kaderrichtlijn maritieme ruimtelijke planning de
      grensoverschrijdende samenwerking heeft plaatsgevonden.

      4 In afwijking van het eerste lid betreft het maritiem ruimtelijk plan niet de kustwateren, bedoeld in artikel 2,
      punt 7, van de kaderrichtlijn water, voor zover die wateren deel uitmaken van een gemeente of een provincie en dit
      in het maritiem ruimtelijk plan is vermeld.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel4.5a
  - number: '4.6'
    text: |-
      1 De in het nationale waterplan op te nemen doelstellingen en maatregelen omvatten, gerangschikt naar
      stroomgebieddistrict, in elk geval:

      a. maatregelen als bedoeld in artikel 11 van de kaderrichtlijn water;

      b. maatregelen als bedoeld in de artikelen 4, vijfde lid, en 6, eerste lid, van de grondwaterrichtlijn;

      c. doelstellingen en maatregelen als bedoeld in artikel 7 van de richtlijn overstromingsrisico’s.

      Met betrekking tot de in het nationale waterplan op te nemen doelstellingen en maatregelen kan gebruik worden
      gemaakt van de mogelijkheden tot het verlenen van vrijstellingen, respectievelijk toestemmingen als bedoeld
      in artikel 11, derde lid, onderdeel e, laatste volzin, respectievelijk onderdeel j, van de kaderrichtlijn
      water, alsmede artikel 6, tweede lid, van de grondwaterrichtlijn en van de mogelijkheid tot het toepassen van
      uitzonderingen als bedoeld in het derde lid, onder a tot en met f, van dat artikel.

      2 Het in het nationale waterplan op te nemen Noordzeebeleid omvat mede de volgende elementen van de mariene
      strategie voor de Noordzee:

      a. de omschrijving van de goede milieutoestand van de Noordzee, bedoeld in artikel 9, eerste lid, van de
      kaderrichtlijn mariene strategie en de reeks milieudoelen en bijbehorende indicatoren, bedoeld in artikel 10,
      eerste lid, van die richtlijn; en

      b. een programma van maatregelen, opgesteld overeenkomstig de eisen gesteld in de artikelen 13, eerste tot en met
      vierde, zevende en achtste lid, en 14, van de kaderrichtlijn mariene strategie.

      3 De onderdelen van het nationale waterplan die dienen ter uitvoering van de kaderrichtlijn water, de richtlijn
      overstromingsrisico’s en de kaderrichtlijn mariene strategie vormen afzonderlijke delen van dat plan. Hieronder
      vallen in ieder geval:

      a. de doelstellingen en maatregelen, bedoeld in het eerste lid, alsmede een overzicht van de financiële middelen
      die voor de uitvoering van die maatregelen nodig zijn, en

      b. de goede milieutoestand, de milieudoelen met bijbehorende indicatoren en het programma van maatregelen, bedoeld
      in het tweede lid.

      4 Maatregelen als bedoeld in artikel 11 van de kaderrichtlijn water dienen uiterlijk drie jaren na de in
      [artikel 4.8, eerste lid, van de wet][ref1] bedoelde zesjaarlijkse herziening operationeel te zijn.

      5 Het programma van maatregelen, bedoeld in het tweede lid, onderdeel b, is uiterlijk een jaar na de in
      [artikel 4.8, eerste lid, van de wet][ref2] bedoelde zesjaarlijkse herziening operationeel.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4.8
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel4.8
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel4.6
