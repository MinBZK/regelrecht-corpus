articles:
  - number: '1.1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *dijkdeel:* gedeelte van een andere dan primaire waterkering in beheer bij het Rijk als bedoeld in
      [artikel 3.2][ref1], dat afzonderlijk genormeerd is;
        - *gesloten bodemenergiesysteem:* installatie waarmee, zonder grondwater te onttrekken en na gebruik in de bodem
      terug te brengen, gebruik wordt gemaakt van de bodem voor de levering van warmte of koude ten behoeve van de
      verwarming of koeling van ruimten in bouwwerken, door middel van een gesloten circuit van leidingen, met inbegrip
      van een bijbehorende warmtepomp circulatiepomp en regeneratievoorziening, voor zover aanwezig;
        - *grondwaterrichtlijn:* richtlijn nr. 2006/118/EG van het Europees Parlement en de Raad van de Europese Unie
      van 12 december 2006 betreffende de bescherming van het grondwater tegen verontreiniging en achteruitgang van de
      toestand (PbEU L 372);
        - *hoofdwater:* oppervlaktewaterlichaam dat is aangewezen in [bijlage II][ref2], onderdeel 1, bij dit besluit;
        - *kaderrichtlijn mariene strategie:* richtlijn nr. 2008/56/EG van het Europees Parlement en de Raad van de
      Europese Unie van 17 juni 2008 tot vaststelling van een kader voor communautaire maatregelen betreffende het beleid
      ten aanzien van het mariene milieu (PbEU L 164);
        - *kaderrichtlijn maritieme ruimtelijke planning:* richtlijn 2014/89/EU van het Europees Parlement en de Raad van
      23 juli 2014 tot vaststelling van een kader voor maritieme ruimtelijke planning (PbEU 2014, L 257);
        - *mariene strategie voor de Noordzee:* strategie als bedoeld in artikel 5 van de kaderrichtlijn mariene strategie
      ten aanzien van de Nederlandse territoriale zee en de Nederlandse exclusieve economische zone;
        - *maritieme ruimtelijke planning:* proces in het kader waarvan menselijke activiteiten in mariene gebieden worden
      geanalyseerd en georganiseerd om ecologische, economische en sociale doelstellingen te bereiken;
        - *maritiem ruimtelijk plan:* plan als bedoeld in [artikel 4.5a, eerste lid][ref3];
        - *Nederlandse mariene wateren:* Nederlandse territoriale zee, Nederlandse exclusieve economische zone en
      kustwateren als bedoeld in artikel 2, punt 7, van de kaderrichtlijn water;
        - *open bodemenergiesysteem:* installatie waarmee van de bodem gebruik wordt gemaakt voor de levering van warmte
      of koude ten behoeve van de verwarming of koeling van ruimten in bouwwerken, door grondwater te onttrekken en na
      gebruik in de bodem terug te brengen, met inbegrip van bijbehorende bronpompen en warmtewisselaar en, voor zover
      aanwezig, warmtepomp en regeneratievoorziening;
        - *overstromingsrisicobeheerplan:* plan als bedoeld in de artikelen 7 en 8 van de richtlijn overstromingsrisico’s;
        - *Protocol:* op 7 november 1996 te Londen tot stand gekomen Protocol bij het op 29 december 1972 te Londen tot
      stand gekomen Verdrag inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten van afval en
      andere stoffen (Trb. 1998, 34);
        - *richtlijn overstromingsrisico’s:* richtlijn nr. 2007/60/EG van het Europees Parlement en de Raad van de Europese
      Unie van 23 oktober 2007 over beoordeling en beheer van overstromingsrisico’s (PbEU L 288);
        - *richtlijn prioritaire stoffen:* richtlijn 2008/105/EG van het Europees Parlement en de Raad van 16 december
      2008 inzake milieukwaliteitsnormen op het gebied van het waterbeleid tot wijziging en vervolgens intrekking van
      de Richtlijnen 82/176/EEG, 83/513/EEG, 84/156/EEG, 84/491/EEG en 86/280/EEG van de Raad, en tot wijziging van
      Richtlijn 2000/60/EG (PbEU L 348);
        - *Verdrag:* op 22 september 1992 te Parijs tot stand gekomen Verdrag inzake de bescherming van het mariene milieu
      in het noordoostelijk deel van de Atlantische Oceaan (Trb. 1993, 16);
        - *wet:* [Waterwet][ref4];
        - *zijwater:* oppervlaktewaterlichaam dat in open verbinding staat met een van de hoofdwateren.

      2 In dit besluit en de daarop berustende bepalingen wordt onder oppervlaktewaterlichaam mede begrepen een gedeelte
      van een oppervlaktewaterlichaam.


