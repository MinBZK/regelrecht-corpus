  - number: 6.10a
    text: |-
      1 Het is verboden zonder daartoe strekkende vergunning van Onze Minister als bedoeld in
      [artikel 6.5, aanhef en onder b, van de wet][ref1], grondwater te onttrekken of water te infiltreren onder
      oppervlaktewaterlichamen in beheer bij het Rijk, voor zover dat beheer inhoudt het uitvoeren en handhaven van
      bij of krachtens de [wet][ref2] gestelde regels ten aanzien van peilbesluiten of het brengen van water in of het
      onttrekken van water uit oppervlaktewaterlichamen (waterkwantiteitsbeheer).

      2 Bij ministeriële regeling kan worden bepaald dat het eerste lid niet van toepassing is voor daarbij aan te wijzen
      categorieën van gevallen waarin het onttrekken of infiltreren een daarbij vastgestelde hoeveelheidsgrens niet
      overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
