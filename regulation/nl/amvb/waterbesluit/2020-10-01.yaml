  - number: '6.11'
    text: |-
      1 Degene die grondwater onttrekt of water infiltreert, waarvoor geen vergunning is vereist krachtens
      [artikel 6.4 van de wet][ref1], [artikel 6.10a][ref2] of een verordening van het waterschap, meldt dit bij
      het bevoegd gezag. Bij ministeriële regeling worden regels gesteld over de gegevens die bij de melding worden
      verstrekt.

      2 Degene die grondwater onttrekt of water infiltreert, meet de in elk kwartaal onttrokken hoeveelheid grondwater of
      geïnfiltreerd water met een nauwkeurigheid van ten minste 95%. Voor kortdurende of seizoensgebonden onttrekkingen
      of infiltraties kan het bevoegd gezag in de voorschriften van de vergunning voor het onttrekken van grondwater of
      het infiltreren van water of, indien geen vergunning is vereist, bij maatwerkvoorschrift bepalen dat de hoeveelheid
      over een kortere tijdsspanne wordt gemeten.

      3 Degene die water infiltreert, meet de kwaliteit van dat water volgens bij ministeriële regeling te stellen
      regels.

      4 Uiterlijk op 31 januari van elk jaar of, indien de onttrekking of infiltratie is beëindigd, binnen een maand
      na het tijdstip van beëindiging, wordt opgave gedaan aan het bevoegd gezag over de in het voorgaande kalenderjaar
      gemeten hoeveelheden onttrokken grondwater, geïnfiltreerd water en de kwaliteit van het geïnfiltreerde water.

      5 Bij provinciale verordening, voor zover het betreft het onttrekken van grondwater of het infiltreren van water
      als bedoeld in [artikel 6.4 van de wet][ref3], dan wel bij verordening van het waterschap, voor zover het betreft
      het onttrekken van grondwater of het infiltreren van water in andere gevallen dan bedoeld in dat artikel, kunnen
      gevallen worden aangewezen waarin de verplichtingen, bedoeld in het eerste tot en met vierde lid, niet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0026872#Artikel6.10a
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
