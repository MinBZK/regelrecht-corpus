  - number: 6.11a
    text: |-
      1 Het bevoegd gezag verbindt aan een vergunning als bedoeld in [artikel 6.4, eerste lid, onder b, van de wet][ref1]
      voor het onttrekken van grondwater voor een open bodemenergiesysteem de voorschriften die zijn opgenomen in de
      [artikelen 6.11b tot en met 6.11g][ref2].

      2 Bij ministeriële regeling kunnen ter bescherming van de in [artikel 2.1 van de wet][ref3] bedoelde doelstellingen
      en belangen nadere regels worden gesteld indien dit wenselijk is in het belang van een goede uitvoering van deze
      paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0026872#Artikel6.11b
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.11a
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6.4'
      - id: ref2
        bwb_id: BWBR0026872
        artikel: 6.11b
        hoofdstuk: '6'
        paragraaf: 5a
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '2.1'
  - number: 6.11b
    text: |-
      1 De temperatuur van het grondwater dat door een open bodemenergiesysteem in de bodem wordt teruggebracht, bedraagt
      niet meer dan 25°C.

      2 In afwijking van het eerste lid kan in het belang van een doelmatig gebruik van bodemenergie een hogere
      temperatuur worden toegestaan, indien het belang van de bescherming van de bodem zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.11b
  - number: 6.11c
    text: |-
      1 Een open bodemenergiesysteem bereikt uiterlijk vijf jaar na de datum van ingebruikneming een moment waarop geen
      sprake is van een warmteoverschot en herhaalt dit telkens uiterlijk vijf jaar na het laatste moment waarop die
      situatie werd bereikt.

      2 Van een warmteoverschot is sprake indien de totale hoeveelheid warmte groter is dan de totale hoeveelheid koude,
      die, uitgedrukt in MWh, vanaf de datum van ingebruikneming door het systeem aan de bodem zijn toegevoegd.

      3 In afwijking van het eerste lid kan ten behoeve van een doelmatig gebruik van bodemenergie het koudeoverschot dat
      het systeem mag veroorzaken worden beperkt.

      4 In afwijking van het eerste lid kan ten behoeve van een doelmatig gebruik van bodemenergie een warmteoverschot
      worden toegestaan, indien het belang van de bescherming van de bodem zich daartegen niet verzet.

      5 Indien de hoeveelheid warmte en de hoeveelheid koude die vanaf de datum van ingebruikneming door het systeem
      aan de bodem zijn toegevoegd, zodanig van elkaar verschillen dat het niet aannemelijk is dat aan het eerste of
      derde lid kan worden voldaan, wordt op verzoek van het bevoegd gezag binnen drie maanden een plan van aanpak
      ingediend waarin is vastgelegd op welke wijze en binnen welke termijn aan het eerste lid, onderscheidenlijk derde
      lid, zal worden voldaan. Nadat het bevoegd gezag daarmee heeft ingestemd, maakt het plan van aanpak deel uit van
      de vergunning.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.11c
  - number: 6.11d
    text: |-
      1 Met betrekking tot het in werking hebben van een open bodemenergiesysteem wordt een registratie bijgehouden die
      de volgende gegevens bevat:

      a. de temperatuur van het grondwater dat door het systeem in de bodem wordt teruggebracht;

      b. de hoeveelheden warmte en koude die vanaf de datum van ingebruikneming aan de bodem zijn toegevoegd, op zodanige
      wijze dat daaruit de data kunnen worden afgelezen, waarop aan [artikel 6.11c][ref1] is voldaan;

      c. het energierendement dat jaarlijks vanaf de datum van ingebruikneming is behaald.

      2 De geregistreerde gegevens, bedoeld in het eerste lid, worden binnen drie maanden na afloop van elk kalenderjaar
      toegezonden aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.11c
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.11d
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: 6.11c
        hoofdstuk: '6'
        paragraaf: 5a
  - number: 6.11e
    text: |-
      Het verrichten van werkzaamheden ten behoeve van een open bodemenergiesysteem vindt plaats overeenkomstig de
      daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocumenten door een persoon of instelling, die
      daartoe beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.11e
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 6.11f
    text: |-
      1 Het voornemen om het in werking hebben van een open bodemenergiesysteem te beëindigen, wordt ten minste vier
      weken voor de beëindiging aan het bevoegd gezag gemeld.

      2 Zo spoedig mogelijk na de beëindiging van het gebruik van een open bodemenergiesysteem wordt het systeem,
      zonder daarbij het ondergrondse deel te verwijderen, zodanig opgevuld dat de werking van de oorspronkelijke
      waterscheidende lagen wordt hersteld.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.11f
  - number: 6.11g
    text: |-
      1 Het ontwerp van een open bodemenergiesysteem is afgestemd op aard en omvang van de behoefte aan warmte of koude
      waarin het systeem voorziet.

      2 Een open bodemenergiesysteem levert het energierendement dat bij een doelmatig gebruik en goed onderhoud kan
      worden behaald.

      3 Indien een open bodemenergiesysteem een energierendement levert dat lager is dan in de vergunningaanvraag
      voor de installatie is opgegeven, kan het bevoegd gezag de verplichting opleggen om binnen een daarbij bepaalde
      termijn onderzoek te verrichten of te laten verrichten waaruit blijkt of wordt voldaan aan het eerste lid,
      onderscheidenlijk tweede lid.

      4 Indien uit het onderzoek, bedoeld in het derde lid, blijkt dat niet wordt voldaan aan het eerste lid,
      onderscheidenlijk tweede lid, kan het bevoegd gezag de verplichting opleggen om binnen een daarbij bepaalde termijn
      de daarbij aangegeven maatregelen te treffen teneinde te voldoen aan het eerste lid, voor zover dit redelijkerwijs
      van hem kan worden gevergd, onderscheidenlijk het tweede lid.

      5 Het bevoegd gezag kan aan een vergunning voorschriften verbinden met betrekking tot het energierendement dat een
      open bodemenergiesysteem ten minste moet leveren.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.11g
  - number: 6.11h
    text: |-
      1 Het bevoegd gezag verbindt aan een vergunning zodanige voorschriften dat het in werking hebben van een open
      bodemenergiesysteem niet leidt tot zodanige interferentie met een eerder geïnstalleerd bodemenergiesysteem, dat het
      doelmatig functioneren van een van de desbetreffende systemen kan worden geschaad.

      2 Bij de toepassing van het eerste lid wordt rekening gehouden met een eerder geïnstalleerd bodemenergiesysteem,
      indien:

      a. het een open bodemenergiesysteem betreft waarvoor een vergunning is verleend krachtens
      [artikel 6.4, eerste lid, onder b, van de Waterwet][ref1], of dat aan het bevoegd gezag is gemeld krachtens
      [artikel 6.6 van die wet][ref2];

      b. het een gesloten bodemenergiesysteem betreft dat aan het bevoegd gezag is gemeld overeenkomstig
      [artikel 1.10][ref3] juncto [artikel 1.21a, eerste of derde lid, van het Activiteitenbesluit milieubeheer][ref4]
      dan wel [artikel 1.10a, eerste lid, van het Besluit lozen buiten inrichtingen][ref5] of waarvoor een
      omgevingsvergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.6
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel1.21a
      [ref5]: https://wetten.overheid.nl/BWBR0029789#Artikel1.10a
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.11h
