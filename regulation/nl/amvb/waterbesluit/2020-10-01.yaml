  - number: 6.16j
    text: |-
      1 Een exportkabel ligt:

      a. op een diepte van ten minste drie meter in de zeebodem voor dat deel van de kabel
      dat zich binnen een afstand van drie kilometer vanaf de laagwaterlijn, bedoeld in
      [artikel 1 van de Wet grenzen Nederlandse territoriale zee][ref1], of de basislijn, bedoeld in
      [artikel 2 van die wet][ref2], bevindt;

      b. op een diepte van ten minste één meter in de zeebodem voor dat deel van de kabel dat zich op drie kilometer of
      meer van de in onderdeel a bedoelde lijn bevindt;

      c. bij kruising van een vaargeul ten minste één meter beneden de door de beheerder van de vaargeul vastgestelde
      onderhoudsdiepte.

      2 De exploitant onderzoekt periodiek de ligging van een exportkabel.


      [ref1]: https://wetten.overheid.nl/BWBR0003748#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel2
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.16j
