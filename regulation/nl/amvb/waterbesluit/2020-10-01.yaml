  - number: 8.7b
    text: |-
      De [artikelen 6.1c][ref1] en [6.11a tot en met 6.11i][ref2] van dit besluit zijn niet van toepassing op de
      voorbereiding en vaststelling van een beschikking op een vóór het tijdstip van inwerkingtreding van die artikelen
      gedane aanvraag om een vergunning dan wel verzoek om wijziging van een vergunning of van de daaraan verbonden
      voorschriften als bedoeld in [artikel 6.4, eerste lid, onder b, van de wet][ref3].


