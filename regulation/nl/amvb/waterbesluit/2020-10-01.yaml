  - number: 6.16a
    text: Deze paragraaf is van toepassing in de territoriale zee en de Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.16a
  - number: 6.16b
    text: |-
      1 Indien bij of krachtens deze paragraaf is bepaald dat een maatregel ter bescherming van de Noordzee moet worden
      getroffen, kan een andere maatregel worden getroffen, indien Onze Minister heeft beslist dat met die maatregel ten
      minste een gelijkwaardig niveau van bescherming van de Noordzee wordt bereikt.

      2 Diegene die het voornemen heeft om een andere maatregel te treffen dient daartoe bij Onze Minister een aanvraag
      in, welke gegevens bevat waaruit blijkt dat met die andere maatregel ten minste een gelijkwaardig niveau van
      bescherming van de Noordzee wordt bereikt.

      3 Onze Minister beslist binnen acht weken over de gelijkwaardigheid van een andere maatregel. Onze Minister kan
      deze termijn eenmaal met ten hoogste zes weken verlengen.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.16b
  - number: 6.16c
    text: |-
      [Artikel 1.3 van het Activiteitenbesluit milieubeheer][ref1] is van overeenkomstige toepassing op bij of krachtens
      deze paragraaf gestelde regels.


