  - number: '8.2'
    text: |-
      De eerste overstromingsrisicobeheerplannen die betrekking hebben of mede betrekking hebben op het Nederlandse
      grondgebied worden uiterlijk op 22 december 2015 vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel8.2
  - number: '8.3'
    text: |-
      1 Een opgave van een inrichting als bedoeld in [artikel 11, eerste lid, onderdeel a, van de Grondwaterwet][ref1],
      dan wel een melding als bedoeld in [artikel 15b van de Grondwaterwet][ref2], die is gedaan voor het tijdstip
      van inwerkingtreding van [artikel 6.4 van de wet][ref3], wordt gelijkgesteld met een melding als bedoeld in
      [artikel 6.11, eerste lid][ref4].

      2 Besluiten als bedoeld in artikel 3, eerste lid, of artikel 5, derde lid, in samenhang met
      [artikel 3, eerste lid, van het Uitvoeringsbesluit ex artikel 11 en 12 Grondwaterwet][ref5], genomen door
      gedeputeerde staten voor het tijdstip van inwerkingtreding van [artikel 6.4 van de wet][ref6], worden gelijkgesteld
      met maatwerkvoorschriften als bedoeld in [artikel 6.11, tweede lid][ref7], genomen door het bevoegd gezag.

      3 Gedeputeerde staten dragen de archiefbescheiden die betrekking hebben op onttrekkingen en infiltraties, waarvoor
      het dagelijks bestuur van het waterschap ingevolge een verordening als bedoeld in a[rtikel 6.13 van de wet][ref8]
      dan wel een algemene maatregel van bestuur als bedoeld in [artikel 6.5, onder b, van de wet][ref9] bevoegd gezag is
      geworden, over aan dat dagelijks bestuur.

      4 Het derde lid geldt niet voor bescheiden die overeenkomstig de [Archiefwet 1995][ref10] zijn overgebracht naar
      een archiefbewaarplaats.


