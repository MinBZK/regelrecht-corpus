      1 De onderlinge grenzen tussen de Nederlandse delen van de stroomgebieddistricten Eems, Maas, Rijn en Schelde zijn
      aangegeven op de in [bijlage I][ref1] bij dit besluit opgenomen kaarten.

      2 De onder de stroomgebieddistricten Eems, Rijn, Maas en Schelde gelegen grondwaterlichamen zijn toegewezen aan
      de desbetreffende stroomgebieddistricten, met dien verstande dat een grondwaterlichaam dat zich bevindt onder
      twee stroomgebieddistricten over die stroomgebieddistricten verdeeld is met inachtneming van de in het eerste lid
      bedoelde grenzen.


