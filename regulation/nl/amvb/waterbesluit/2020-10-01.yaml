  - number: 6.16d
    text: |-
      1 De exploitant meldt het voornemen tot het oprichten of veranderen van een windpark ten minste acht weken voor de
      aanvang van de bouwperiode aan Onze Minister en verstrekt daarbij de volgende gegevens:

      a. de locatie en het ontwerp van de turbines en andere installaties die deel uitmaken van het windpark;

      b. het tracé van de exportkabel en de van het windpark deeluitmakende kabels;

      c. een verklaring van een onafhankelijke deskundige dat het ontwerp van de windturbines en andere installaties die
      deel uitmaken van het windpark voldoet aan de in [artikel 6.16g, eerste lid][ref1], gestelde eisen;

      d. een beschrijving van de aan te brengen veiligheidsvoorzieningen en de plaatsing daarvan aan de windturbines en
      andere installaties in overeenstemming met [artikel 6.16h][ref2];

      e. een plan als bedoeld in [artikel 6.16e, derde lid][ref3], met betrekking tot de aanleg van het windpark;

      f. een plan als bedoeld in [artikel 6.16k, tweede lid][ref4].

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze waarop de in het eerste lid
      bedoelde gegevens worden gemeld.

      3 Wijzigingen met betrekking tot werkzaamheden waarop het plan, bedoeld in het eerste lid, onder e, betrekking
      heeft, worden ten minste vier weken voor de verrichting van de desbetreffende werkzaamheden gemeld aan Onze
      Minister.

      4 De exploitant verstrekt aan Onze Minister binnen drie maanden na het aanbrengen van de funderingen de gegevens
      van de feitelijke positie van de funderingen en de overige van het windpark deel uitmakende voorzieningen.

      5 De exploitant verstrekt aan Onze Minister binnen drie maanden na de aanleg van een exportkabel de gegevens van de
      feitelijke ligging van de kabel.

      6 De in dit artikel bedoelde gegevens behoeven niet te worden verstrekt voor zover de exploitant die gegevens reeds
      aan Onze Minister heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.16g
      [ref2]: https://wetten.overheid.nl/BWBR0026872#Artikel6.16h
      [ref3]: https://wetten.overheid.nl/BWBR0026872#Artikel6.16e
      [ref4]: https://wetten.overheid.nl/BWBR0026872#Artikel6.16k
