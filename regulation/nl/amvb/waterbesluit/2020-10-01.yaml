  - number: '6.2'
    text: |-
      Indien internationale verplichtingen dat noodzakelijk maken, kan bij ministeriële regeling worden bepaald dat:

      a. in een vergunning als bedoeld in [artikel 6.2 van de wet][ref1] wordt bepaald dat zij geldt voor een bij die
      vergunning vast te stellen termijn van ten hoogste een bij die regeling vast te stellen aantal jaren;

      b. het bevoegd gezag met een bij die regeling vast te stellen frequentie beziet of een vergunning als bedoeld
      in [artikel 6.2 van de wet][ref2] nog toereikend is, gezien de ontwikkelingen op het gebied van de technische
      mogelijkheden tot bescherming van het milieu en de ontwikkelingen met betrekking tot de kwaliteit van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
