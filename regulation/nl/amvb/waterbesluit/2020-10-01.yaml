    text: |-
      1 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] zijn niet
      van toepassing, indien:

      a. de aanvraag betrekking heeft op het in het buitenland aan boord van een Nederlands vaartuig of luchtvaartuig
      nemen van stoffen, met het oogmerk die stoffen te storten; en

      b. de Staat op wiens grondgebied dat aan boord nemen geschiedt, partij is bij het Protocol of het Verdrag.

      2 Voorts kan Onze Minister bepalen dat [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] en
      [afdeling 13.2 van de Wet milieubeheer][ref4] niet van toepassing zijn indien de aanvraag betrekking heeft op
      stoffen waarvan door een ongewoon voorval de afvoer op korte termijn nodig is.


