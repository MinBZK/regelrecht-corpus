  - number: 6.16k
    text: |-
      1 Indien zich een ongewoon voorval voordoet in of in de nabijheid van een windpark, welke een gevaar oplevert voor
      het milieu of voor de veiligheid op zee, treft de exploitant passende maatregelen ter bescherming van het milieu of
      de veiligheid.

      2 De exploitant beschikt over een actueel plan dat een beschrijving bevat van de in het eerste lid bedoelde
      maatregelen.

      3 Een plan als bedoeld in het tweede lid, bevat in ieder geval:

      a. een vermelding van de in te zetten materialen;

      b. de aanwijzing van de natuurlijke persoon of rechtspersoon die is belast met het verrichten van de in onderdeel a
      bedoelde werkzaamheden; en

      c. de aanwijzing van de natuurlijke persoon of rechtspersoon die is belast is met het toezicht op het verrichten
      van de in onderdeel a bedoelde werkzaamheden.

      4 De exploitant meldt een ongewoon voorval als bedoeld in het eerste lid onmiddellijk aan Onze Minister en het
      Kustwachtcentrum.

      5 Onze Minister kan in geval van gevaar voor de veiligheid van personen een bevel geven tot het stil leggen van
      het windpark.

      6 De exploitant verstrekt een plan binnen vier weken na actualisatie daarvan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.16k
  - number: 6.16l
    text: |-
      1 Een niet meer in gebruik zijnd windpark of een niet meer in gebruik zijnde exportkabel wordt verwijderd.

      2 Het eerste lid is van overeenkomstige toepassing op schroot en ander materiaal, dat ter plaatse of in de naaste
      omgeving is terechtgekomen bij het plaatsen, het onderhoud, het gebruik of het verwijderen van het windpark.

      3 Het eerste lid is niet van toepassing, indien op grond van
      [artikel 6.3, eerste lid, aanhef en onderdeel b van de wet][ref1], een vergunning is verleend.

      4 Onze Minister kan in een voorschrift bepalen dat, in afwijking van het eerste lid, een exportkabel geheel
      of gedeeltelijk niet wordt verwijderd, indien verwijdering zou leiden tot schade aan het milieu of aan ander
      rechtmatig gebruik van de zeebodem.

      5 Onze Minister kan een termijn vaststellen, waarbinnen aan de verplichting tot verwijdering moet zijn voldaan.

      6 De exploitant verstrekt een plan als bedoeld in [artikel 6.16e, derde lid][ref2], dat betrekking heeft op de
      verwijdering van een windpark of een exportkabel ten minste vier weken voor de aanvang van de werkzaamheden.

      7 Nadat een windpark, kabels en schroot en ander materiaal zijn verwijderd, doet de exploitant daarvan onmiddellijk
      mededeling aan Onze Minister en overlegt daarbij gegevens waaruit dit blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0026872#Artikel6.16e
