      vastgesteld krachtens [artikel 10.41 van de Wet milieubeheer][ref3] van overeenkomstige toepassing.

      2 Het is een persoon als bedoeld in de eerste volzin van het eerste lid verboden gevaarlijke afvalstoffen
      in ontvangst te nemen zonder dat hem daarbij een omschrijving en een begeleidingsbrief als bedoeld in
      [artikel 10.39 van de Wet milieubeheer][ref4] worden verstrekt.


