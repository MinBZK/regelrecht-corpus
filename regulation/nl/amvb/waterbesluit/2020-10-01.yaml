  - number: 8.7a
    text: |-
      Voor zover [artikel 6.12][ref1] van toepassing is in gedeelten van het rivierbed doordat tengevolge van dit besluit
      zoals dat luidde op 22 december 2009 begrenzingen, gebiedsaanwijzingen of andere beperkingen op het vereiste van
      een vergunning krachtens de [Wet beheer rijkswaterstaatswerken][ref2], zoals die wet luidde vóór genoemde datum,
      zijn gewijzigd of vervallen, is met ingang van genoemde datum dat artikel niet van toepassing op gedragingen
      waarvoor op de genoemde datum een eerder verleende vergunning als bedoeld in [artikel 40 van de Woningwet][ref3],
      zoals die wet luidde op die datum, onherroepelijk was.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.12
      [ref2]: https://wetten.overheid.nl/BWBR0008331
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel8.7a
