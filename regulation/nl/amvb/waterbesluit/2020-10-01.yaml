  - number: '8.4'
    text: |-
      1 Van een vergunning als bedoeld in [artikel 2 van de Wet beheer rijkswaterstaatswerken][ref1] voor handelingen als
      bedoeld in de [artikelen 6.12, tweede lid][ref2], [6.13, tweede lid][ref3] en [6.14, tweede lid][ref4], die direct
      voor het tijdstip van inwerkingtreding van die artikelen in werking en onherroepelijk is, worden de voorschriften
      aangemerkt als voorschriften, gesteld krachtens [artikel 6.15, derde lid][ref5], mits de voorschriften van die
      vergunning vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van voorschriften krachtens dat
      artikel.

      2 Het eerste lid is van overeenkomstige toepassing op een vergunning als bedoeld in dat lid, die overeenkomstig
      artikel 2.29 van de Invoeringswet Waterwet is verleend en onherroepelijk is geworden.

      3 Een vergunning voor de aanleg of wijziging van waterstaatswerken door of vanwege de beheerder, die
      onmiddellijk voor het tijdstip van inwerkingtreding van paragraaf 6 van hoofdstuk 6 in werking en onherroepelijk
      is overeenkomstig [artikel 2 van de Wet beheer rijkswaterstaatswerken][ref6], wordt, in afwijking van de
      [artikelen 6.12, tweede lid][ref7], [6.13, tweede lid][ref8] en [6.14, tweede lid][ref9], gelijkgesteld met een
      vergunning krachtens het eerste lid van die artikelen. [Artikel 5.4 van de wet][ref10] is niet van toepassing op de
      aanleg of wijziging van een waterstaatswerk in overeenstemming met die vergunning.

      4 Het derde lid is van overeenkomstige toepassing op een vergunning als bedoeld in dat lid, die overeenkomstig
      [artikel 2.29 van de Invoeringswet Waterwet][ref11] is verleend en onherroepelijk is geworden.

      5 Het derde en vierde lid zijn niet van toepassing op de aanleg of wijziging van een waterstaatswerk waarop
      [artikel 2.16][ref12] of [artikel 2.16a van de Invoeringswet Waterwet][ref13] van toepassing is.


