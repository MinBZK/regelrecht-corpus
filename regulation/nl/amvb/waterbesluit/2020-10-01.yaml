  - number: 6.16e
    text: |-
      1 Bij het verrichten van werkzaamheden in het kader van de aanleg, het onderhoud of het verwijderen van een
      windpark of van een exportkabel worden maatregelen genomen ter voorkoming van het optreden van nadelige gevolgen
      voor het veilig en doelmatig gebruik van de zee.

      2 Het verrichten van werkzaamheden als bedoeld in het eerste lid gebeurt zodanig dat in de zeebodem aanwezige
      leidingen en kabels niet worden beschadigd.

      3 De werkzaamheden worden uitgevoerd volgens een door de exploitant opgesteld plan, dat tenminste de volgende
      gegevens bevat:

      a. een omschrijving van de werkzaamheden;

      b. een tijdschema voor het uitvoeren van de werkzaamheden;

      c. een opgave van de bij de werkzaamheden in te zetten vaartuigen; en

      d. een beschrijving van de maatregelen om het scheepvaartverkeer te waarschuwen.

      4 Indien bij het verrichten van de in het eerste lid bedoelde werkzaamheden ernstige nadelige gevolgen voor
      het veilig of doelmatig gebruik van de zee dreigen op te treden of zijn opgetreden, wordt hiervan onmiddellijk
      mededeling gedaan aan Onze Minister en het Kustwachtcentrum.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.16e
  - number: 6.16f
    text: |-
      1 Indien bij de oprichting van een windpark of bij andere werkzaamheden met betrekking tot
      windturbines in de Nederlandse exclusieve economische zone een archeologisch monument als bedoeld
      in [artikel 1.1 van de Erfgoedwet][ref1] of een vermoedelijk archeologisch monument wordt gevonden
      of een archeologische vondst als bedoeld in artikel 1.1 van de Erfgoedwet wordt aangetroffen, is
      [artikel 5.10 van de Erfgoedwet][ref2] van toepassing en zijn de [artikelen 56][ref3], [58, eerste lid][ref4], en
      [59 van de Monumentenwet 1988][ref5], zoals die wet luidde voor inwerkingtreding van de [Erfgoedwet][ref6], van
      overeenkomstige toepassing.

      2 De exploitant stelt de gegevens voortvloeiend uit onderzoek naar de aanleg van een windpark ter beschikking aan
      Onze Minister van Onderwijs, Cultuur en Wetenschap, voor zover die gegevens informatie kunnen verschaffen over de
      aanwezigheid van archeologische monumenten dan wel vermoedelijke archeologische monumenten in of op de bodem van de
      territoriale zee of de Nederlandse exclusieve economische zone.


