      1 Een dijkdeel wordt aan twee zijden begrensd door een lijn loodrecht op het dijkdeel door een punt waarvan de
      rijksdriehoekscoördinaten zijn opgenomen in [bijlage IA][ref1].

      2 Dijkdelen worden weergegeven op de landkaarten in [bijlage IB][ref2].

      3 [Bijlage IA][ref3] vermeldt voor elk dijkdeel de veiligheidsnorm, aangegeven als gemiddelde overschrijdingskans
      per jaar van de hoogste hoogwaterstand waarop het moet zijn berekend, mede gelet op de overige het waterkerend
      vermogen bepalende factoren.

      4 Voor waterkerende kunstwerken in een in [bijlage IB][ref4] weergegeven ingegraven dijkdeel bedraagt de
      veiligheidsnorm 1:100.


      [ref1]: https://wetten.overheid.nl/BWBR0026872
