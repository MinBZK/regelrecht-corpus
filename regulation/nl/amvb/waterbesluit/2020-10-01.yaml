  - number: '5.1'
    text: |-
      Van de in [artikel 5.1, eerste lid, van de wet][ref1] bedoelde verplichtingen wordt vrijstelling verleend met
      betrekking tot de volgende waterstaatswerken of delen daarvan:

      a. de oppervlaktewaterlichamen Noordzee, Waddenzee, Eems-Dollard, Westerschelde en IJsselmeer, met inbegrip van het
      Zwarte Meer en Ketelmeer;

      b. de krachtens [artikel 6.16, eerste lid][ref2], in [bijlage IV][ref3] aangewezen gebieden binnen de begrenzing
      van rivieren, en

      c. de krachtens [artikel 6.16, tweede lid][ref4], aangewezen gebieden.


