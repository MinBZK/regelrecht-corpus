  - number: '5.3'
    text: |-
      Het door de beheerder vast te stellen calamiteitenplan, bedoeld in [artikel 5.29 van de wet][ref1], bevat ten
      minste:

      a. een overzicht van de soorten calamiteiten die zich in de watersystemen of onderdelen daarvan kunnen voordoen,
      waaronder een inventarisatie van de daarmee gepaard gaande risico’s;

      b. een overzicht van te nemen maatregelen, met inbegrip van de maatregelen die voortkomen uit de voor de
      betreffende watersystemen geldende overstromingsrisicobeheerplannen, en het beschikbare materieel, benodigd om de
      onderscheidene calamiteiten het hoofd te bieden;

      c. een overzicht van de diensten, instanties en organisaties, die bij gevaar kunnen worden ingeschakeld;

      d. een beschrijving van het moment en de wijze van het door de beheerder informeren van burgemeesters en wethouders
      van de gemeenten waarbinnen de watersystemen of onderdelen daarvan zijn gelegen;

      e. een schema met betrekking tot de calamiteitenorganisatie van de beheerder;

      f. een meld- en alarmeringsprocedure;

      g. een overzicht waaruit blijkt op welke wijze de beheerder de kwaliteit van de calamiteitenorganisatie waarborgt.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5.29
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel5.3
    references:
