      2 De goede milieutoestand, de milieudoelen en bijbehorende indicatoren, bedoeld in
      [artikel 4.3, eerste lid, onderdeel c, onder 2° respectievelijk 3°][ref2], worden uiterlijk op 13 juli 2012
      door Onze Ministers vastgesteld. De goede milieutoestand, bedoeld in [artikel 4.6, tweede lid, onderdeel a][ref3],
      wordt uiterlijk 31 december 2020 bereikt onverminderd de gevallen, bedoeld in artikel 14, eerste lid, van de
      kaderrichtlijn mariene strategie.

      3 Het monitoringsprogramma, bedoeld in [artikel 4.3, eerste lid, onderdeel c, onder 4°][ref4], wordt uiterlijk op
      15 juli 2014 door Onze Ministers vastgesteld. Indien internationale verplichtingen dat noodzakelijk maken, kan bij
      ministeriële regeling een ander tijdstip van vaststelling worden bepaald.

      4 De informatie met betrekking tot beschermde mariene gebieden, bedoeld in artikel 13, zesde lid, van de
      kaderrichtlijn mariene strategie, wordt uiterlijk 31 december 2013 door Onze Ministers ter inzage gelegd.


