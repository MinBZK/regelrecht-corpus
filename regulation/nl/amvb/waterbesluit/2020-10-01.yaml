  - number: '3.4'
    text: |-
      1 Ten aanzien van hun onderscheiden aandeel in het waterbeheer verrichten gedeputeerde staten, het dagelijks
      bestuur van de waterschappen en burgemeester en wethouders de analyses en beoordelingen, bedoeld in artikel 5 van
      de kaderrichtlijn water.

      2 Ten aanzien van hun onderscheiden aandeel in het waterbeheer verstrekken gedeputeerde staten, het dagelijks
      bestuur van de waterschappen en burgemeester en wethouders Onze Minister:

      a. de gegevens die nodig zijn voor het opstellen van de stroomgebiedbeheerplannen;

      b. de resultaten van de analyses en beoordelingen, bedoeld in het eerste lid;

      c. gegevens omtrent de voortgang van de uitvoering van de maatregelen, bedoeld in artikel 11 van de kaderrichtlijn
      water.

      3 De gegevens en resultaten, bedoeld in het tweede lid, worden elektronisch verstrekt. Bij ministeriële regeling
      wordt een website aangewezen die voor de gegevensverstrekking wordt gebruikt.

      4 Ten aanzien van hun onderscheiden aandeel in het waterbeheer verstrekken gedeputeerde staten, het dagelijks
      bestuur van de waterschappen en burgemeester en wethouders Onze Minister de gegevens die nodig zijn voor het
      opstellen van de overstromingsrisicobeheerplannen.

      5 Ten aanzien van hun onderscheiden aandeel in het waterbeheer verstrekken het dagelijks bestuur van de
      waterschappen en burgemeester en wethouders aan gedeputeerde staten de gegevens die nodig zijn voor de
      overstromingsgevaar- en overstromingsrisicokaarten, bedoeld in [artikel 4.9][ref1].

      6 Gedeputeerde staten, het dagelijks bestuur van de waterschappen en burgemeester en wethouders verstrekken op
      verzoek van Onze Minister ten behoeve van het door hem uit te oefenen toezicht op het waterbeheer de bij dat
      verzoek omschreven gegevens.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de gegevensverstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel3.4
