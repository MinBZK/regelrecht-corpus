  - number: '6.12'
    text: |-
      1 Het is verboden zonder daartoe strekkende vergunning van Onze Minister als bedoeld in
      [artikel 6.5 van de wet][ref1] gebruik te maken van een oppervlaktewaterlichaam of een bijbehorend kunstwerk in
      beheer bij het Rijk, niet zijnde de Noordzee, door, anders dan in overeenstemming met de functie, daarin, daarop,
      daarboven, daarover of daaronder:

      a. werken te maken of te behouden;

      b. vaste substanties of voorwerpen te storten, te plaatsen of neer te leggen, of deze te laten staan of liggen.

      2 Het eerste lid is niet van toepassing op:

      a. het bouwen van bouwwerken, voor zover de oppervlakte daarvan niet meer dan 30 m2 bedraagt;

      b. het plaatsen van een erf- of perceelafscheiding;

      c. het uitvoeren van onderhoud dan wel de aanleg of wijziging of overig gebruik, anders dan in overeenstemming met
      de functie, van waterstaatswerken, voor zover deze activiteiten door of vanwege de beheerder worden verricht;

      d. het maken van werken om oeverafslag tegen te gaan, mits deze niet boven het oeverland uitsteken, en het ten
      behoeve van de uitvoering van die werken storten, plaatsen of neerleggen van vaste substanties of voorwerpen;

      e. het permanent afmeren van woonschepen of andere drijvende objecten in rijkswateren, met uitzondering van de
      rijkswateren of delen van rijkswateren die zijn aangewezen bij ministeriële regeling;

      f. bij ministeriële regeling aan te wijzen activiteiten van ondergeschikt belang voor de veilige en doelmatige
      functievervulling van het oppervlaktewaterlichaam of een bijbehorend kunstwerk; en

      g. ontgrondingen.

      3 Bij ministeriële regeling kan worden bepaald dat voor daarbij aan te wijzen categorieën oppervlaktewaterlichamen
      het tweede lid niet van toepassing is op daarbij aan te wijzen bouwwerken als bedoeld in het tweede lid, onderdeel
      a of b.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.12
