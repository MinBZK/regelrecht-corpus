  - number: 6.16g
    text: |-
      1 Een windturbine alsmede een andere installatie die deel uitmaakt van een windpark is voldoende sterk om de als
      gevolg van windsterkte, golfslag, zeestroming en gebruik van de turbine te verwachten krachten te weerstaan.

      2 De exploitant verstrekt ten minste vier weken voor de ingebruikname van het windpark aan Onze Minister een
      verklaring dat de constructie en de bouw van de windturbines en andere installaties die deel uitmaken van het
      windpark voldoen aan het eerste lid.

      3 Een verklaring als bedoeld in het tweede lid wordt opgesteld door een onafhankelijke deskundige die toetst
      aan een in de praktijk beproefd stelsel van normen die betrekking hebben op het ontwerp van installaties in een
      windpark.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de inhoud van een verklaring als bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.16g
  - number: 6.16h
    text: |-
      1 Een windpark is ter waarborging van de veiligheid van het lucht- en scheepvaartverkeer voorzien van
      herkenningstekens en bakens.

      2 De in het eerste lid bedoelde herkenningstekens en bakens voldoen aan IALA-aanbeveling O-139 (markering van
      kunstmatige offshore constructies) en aan de door de Britse luchtvaartautoriteit uitgegeven richtlijn CAP 764
      (beleid en richtlijnen voor windturbines).

      3 De ononderbroken werking van de in het eerste lid bedoelde bakens is gewaarborgd.

      4 Het windpark is voorzien van controle-, waarschuwings- en besturingssytemen, inclusief de noodvoorziening voor
      het zowel ter plaatse als vanaf de wal kunnen bedienen en bewaken van het windpark.

      5 De elektrische installaties en de kabels van het windpark voldoen aan NEN 1010, NEN-EN-IEC 61936-1 en NEN-
      EN 50522.

      6 Bij ministeriële regeling worden regels gesteld omtrent de bij de toepassing van dit artikel in acht te nemen
      tekst van de in dit artikel genoemde niet-publiekrechtelijke regelingen.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.16h
  - number: 6.16i
    text: |-
      1 De exploitant zorgt voor een goede staat van onderhoud van het windpark en onderzoekt daartoe periodiek de
      windturbines en overige voorzieningen, alsmede de veiligheidsvoorzieningen.

      2 Onderhoud en onderzoek worden uitgevoerd volgens NEN 3840 en NEN 3140.

      3 Indien wordt geconstateerd of het redelijk vermoeden bestaat dat een onderdeel of onderdelen van het windpark een
      gebrek bezitten, waardoor de veiligheid voor de omgeving in het geding is, neemt de exploitant passende maatregelen
      en, indien sprake is van direct gevaar voor de veiligheid van personen, wordt het windpark of het betreffende deel
      van het windpark onmiddellijk buiten werking gesteld.

      4 De exploitant meldt een gebrek als bedoeld in het derde lid onmiddellijk aan Onze Minister.

      5 [Artikel 6.16h, zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.16h
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.16i
