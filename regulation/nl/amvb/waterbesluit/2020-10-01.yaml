  - number: '3.2'
    text: |-
      Het beheer van de primaire waterkeringen en andere waterkeringen die zijn vermeld in [bijlage III][ref1] bij dit
      besluit berust bij het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0026872
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0026872
  - number: '3.3'
    text: |-
      Bij regeling van Onze Minister worden:

      a. de grenzen van de in [artikel 3.1][ref1] van dit besluit bedoelde oppervlaktewaterlichamen vastgesteld;

      b. de drogere oevergebieden aangewezen die zijn gelegen binnen bepaalde in [artikel 3.1][ref2] van dit besluit
      bedoelde oppervlaktewaterlichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel3.1
