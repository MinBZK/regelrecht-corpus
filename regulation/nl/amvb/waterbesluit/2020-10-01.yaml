        bwb_id: BWBR0025458
        artikel: '5.29'
  - number: '6.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *bedrijfsafvalwater:* afvalwater dat vrijkomt bij door de mens bedrijfsmatig of in een omvang alsof zij
      bedrijfsmatig was, ondernomen bedrijvigheid, dat geen huishoudelijk afvalwater, afvloeiend hemelwater of grondwater
      is;
        - *bouwen:* een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref1];
        - *emissiegrenswaarde:* emissiegrenswaarde als bedoeld in artikel 2, onderdeel 40, van de kaderrichtlijn water;
        - *exploitant:* natuurlijke of rechtspersoon die een windpark opricht of exploiteert;
        - *exportkabel:* kabel die het transformatorstation van een windpark verbindt met een net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref2];
        - *huishoudelijk afvalwater:*afvalwater dat overwegend afkomstig is van menselijke stofwisseling en huishoudelijke
      werkzaamheden;
        - *inwoner-equivalent (i.e.):* biochemisch zuurstofverbruik van 54 gram per etmaal;
        - *totaal-stikstof:* om van totaal Kjeldahl-stikstof (organisch N + NH), nitraat (NO)-stikstof en nitriet
      (NO)-stikstof;
        - *windpark:* samenstel van voorzieningen waarmee elektriciteit met behulp van wind wordt geproduceerd, waarbij
      onder een samenstel van voorzieningen wordt verstaan alle aanwezige middelen die onderling met elkaar zijn
      verbonden voor de productie van elektriciteit met behulp van wind;
        - *zuiveringsrendement:* percentage van het totaal-fosfaat onderscheidenlijk totaal-stikstof dat uit het
      stedelijk afvalwater wordt verwijderd dat op de onder de zorg van eenzelfde bestuursorgaan staande gezamenlijke
      zuiveringtechnische werken wordt aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.1
