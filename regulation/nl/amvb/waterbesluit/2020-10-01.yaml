  - number: '6.3'
    text: |-
      Indien internationale verplichtingen dat noodzakelijk maken, kunnen bij ministeriële regeling emissiegrenswaarden
      worden vastgesteld voor het lozen van stoffen in een oppervlaktewaterlichaam of op een zuiveringtechnisch werk. Bij
      die regeling kunnen tevens regels worden gesteld ten aanzien van het meten van die stoffen.
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.3
  - number: '6.8'
    text: |-
      1 Een vergunning als bedoeld in [artikel 6.3 van de wet][ref1] kan slechts worden verleend in overeenstemming met
      het Protocol en het Verdrag.

      2 Van de vergunningplicht, bedoeld in
      [artikel 6.3, eerste lid, onderdelen a tot en met c, en tweede en derde lid, van de wet][ref2], zijn vrijgesteld
      handelingen die noodzakelijk zijn voor de veiligheid van mensenlevens of voor de veiligheid van vaartuigen,
      luchtvaartuigen of op de zeebodem opgerichte werken in geval van overmacht ten gevolge van noodweer of in
      alle andere gevallen waarin mensenlevens in gevaar zijn of een ernstige bedreiging bestaat voor vaartuigen,
      luchtvaartuigen of op de zeebodem opgerichte werken, mits:

      a. het ernaar uitziet dat de handeling de enige oplossing is om de dreiging af te wenden;

      b. door de handeling naar alle waarschijnlijkheid de minste schade wordt veroorzaakt; en

      c. de handeling zodanig geschiedt dat de gevaren voor het menselijk leven en voor de in zee voorkomende flora en
      fauna tot een minimum beperkt blijven.

      3 In de gevallen, bedoeld in het tweede lid, maakt de kapitein van het vaartuig of de gezagvoerder van het
      luchtvaartuig van het voorval melding in het scheepsdagboek of het journaal. Tevens doet hij van dit voorval
      onverwijld mededeling aan Onze Minister.

      4 Het derde lid, tweede zin, is van overeenkomstige toepassing op de gebruiker van een op de zeebodem opgericht
      werk.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
    url: https://wetten.overheid.nl/BWBR0026872/2020-10-01#Artikel6.8
