  - number: 6.11i
    text: |-
      1 Met betrekking tot de onderwerpen die in de [artikelen 6.11b tot en met 6.11h][ref1] zijn geregeld, verbindt
      het bevoegd gezag geen andere voorschriften aan de vergunning, bedoeld in het eerste lid, dan de voorschriften die
      daaraan moeten worden verbonden krachtens die artikelen.

      2 Het bevoegd gezag kan aan de vergunning in aanvulling op de voorschriften die zijn opgenomen in de
      [artikelen 6.11b tot en met 6.11h][ref2], met betrekking tot onderwerpen die in die artikelen niet zijn geregeld,
      andere voorschriften verbinden ter bescherming van de in [artikel 2.1 van de wet][ref3] bedoelde doelstellingen
      en belangen.

      3 De voorschriften, bedoeld in het eerste lid, kunnen mede inhouden de verplichting om met betrekking tot een
      bodemenergiesysteem het verrichten van handelingen te melden, metingen of berekeningen uit te voeren, gegevens bij
      te houden en daarvan opgave te doen aan een daarbij aangewezen bestuursorgaan.


