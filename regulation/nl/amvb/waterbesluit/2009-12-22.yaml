        bwb_id: BWBR0005537
        artikel: 2:15
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '7.6'
  - number: '6.23'
    text: |-
      1 Onverminderd [artikel 4:2, tweede lid, van de Algemene wet bestuursrecht][ref1] verstrekt de aanvrager bij de
      aanvraag de bij ministeriële regeling aangewezen gegevens en bescheiden ten aanzien van de betrokken handelingen.

      2 De in het eerste lid bedoelde gegevens en bescheiden behoeven niet te worden verstrekt voor zover:

      a. de aanvrager die gegevens of bescheiden reeds aan het bevoegd gezag heeft verstrekt en het bevoegd gezag over
      die gegevens of bescheiden beschikt, of

      b. het bevoegd gezag heeft beslist dat verstrekking van die gegevens of bescheiden niet nodig is voor het nemen van
      de beslissing op de aanvraag.

      3 De gegevens en bescheiden worden door de aanvrager gekenmerkt als behorende bij de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel42
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:2
  - number: '7.1'
    text: |-
      Van grondwaterheffing zijn vrijgesteld onttrekkingen van grondwater:

      a. door of vanwege overheidslichamen ten behoeve van de vervulling van taken op grond van de wet;

      b. ten behoeve van een bodemenergiesysteem door middel van een inrichting waarbij grondwater wordt onttrokken en
      het water vervolgens in een gesloten systeem weer volledig wordt teruggebracht in hetzelfde watervoerende pakket
      als waaraan het is onttrokken, in overeenstemming met de voorwaarden welke daartoe zijn gesteld in de vergunning
      die voor het onttrekken van grondwater ingevolge de wet is verleend;

      c. ten behoeve van een bodem- of grondwatersaneringsproject;

      d. ten behoeve van landijsbanen;

      e. ten behoeve van de ontwatering of afwatering van gronden;

      f. door middel van een oevergrondwaterwinning.
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel7.1
  - number: '7.2'
    text: |-
      1 De in [artikel 7.7, eerste lid, onderdeel b, van de wet][ref1] bedoelde onderzoekingen bestaan uit:

      a. onderzoekingen betreffende het grondwaterregime in de provincie, voor zover deze rechtstreeks noodzakelijk zijn
      voor de totstandkoming en de uitvoering van het regionale waterplan in verband met het onttrekken van grondwater
      dan wel het infiltreren van water in de bodem;

      b. onderzoekingen naar de samenhang tussen het in onderdeel a bedoelde grondwaterregime en de daarbij betrokken
      belangen.

      2 De kosten van de in het eerste lid bedoelde onderzoekingen, welke kunnen worden aangemerkt als de kosten, bedoeld
      in [artikel 7.7, eerste lid, onderdeel b, van de wet][ref2], zijn de kosten van:

      a. het verkrijgen en bewerken van gegevens betreffende de geohydrologische gesteldheid van de provincie;

      b. het inventariseren van de bij het grondwaterregime betrokken belangen;

      c. de bijdragen aan onderzoeksprogramma's direct verband houdende met de totstandkoming en de uitvoering van de
      onderzoekingen;

      d. het verkrijgen en bewerken van gegevens betreffende de samenhang tussen het grondwaterregime en de daarbij
      betrokken belangen;

      e. het personeel voor zover dat de onderzoekingen en de begeleiding daarvan rechtstreeks uitvoert;

      f. de publicatie van de resultaten van de onderzoekingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.7
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7.7
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel7.2
    references:
