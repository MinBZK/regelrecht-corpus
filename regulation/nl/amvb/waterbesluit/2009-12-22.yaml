  - number: '6.20'
    text: |-
      1 Een aanvraag om een watervergunning kan langs elektronische weg worden ingediend.

      2
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.20
  - number: '6.21'
    text: |-
      1 Indien een aanvraag niet langs elektronische weg wordt ingediend, wordt gebruik gemaakt van een bij ministeriële
      regeling vastgesteld formulier. Het bevoegd gezag stelt op verzoek van de aanvrager het formulier aan hem ter
      beschikking.

      2 Het bevoegd gezag bepaalt het aantal exemplaren dat van de aanvraag en de daarbij te overleggen gegevens en
      bescheiden wordt ingediend, met een maximum van vier.
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.21
  - number: '6.22'
    text: |-
      1 In afwijking van [artikel 2:15, tweede lid, van de Algemene wet bestuursrecht][ref1], neemt het bevoegd gezag een
      aanvraag die langs elektronische weg wordt ingediend, in ontvangst.

      2 Indien een aanvraag langs elektronische weg wordt ingediend, worden de daarbij te verstrekken gegevens en
      bescheiden eveneens langs elektronische weg verstrekt. De aanvrager kan de gegevens en bescheiden op schriftelijke
      wijze verstrekken, voor zover het bevoegd gezag daarvoor toestemming heeft gegeven.

      3 Bij ministeriële regeling worden nadere regels gesteld over de wijze waarop een aanvraag langs
      elektronische weg wordt ingediend, alsmede met betrekking tot het beheer van de in de voorziening, bedoeld in
      [artikel 7.6 van de Wet algemene bepalingen omgevingsrecht][ref2], opgenomen gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel215
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel7.6
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.22
    references:
