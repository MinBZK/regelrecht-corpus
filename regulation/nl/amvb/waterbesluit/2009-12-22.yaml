        artikel: '7.7'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '7.7'
  - number: '8.1'
    text: |-
      De maatregelen, bedoeld in artikel 11 van de kaderrichtlijn water, die zijn opgenomen in een plan als bedoeld in de
      [artikelen 4.1][ref1], [4.4][ref2] of [4.6 van de wet][ref3] dat betrekking heeft op de jaren 2010 tot 2015, dienen
      uiterlijk op 22 december 2012 operationeel te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel4.4
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel4.6
