  - number: '6.15'
    text: |-
      1 Degene die gebruik maakt van een oppervlaktewaterlichaam of een bijbehorend kunstwerk in beheer bij het Rijk
      door, anders dan in overeenstemming met de functie, daarin, daarop, daarboven, daarover of daaronder werken te
      maken of te behouden, dan wel vaste substanties of voorwerpen te storten, te plaatsen of neer te leggen, of deze te
      laten staan of liggen, waarvoor geen vergunning krachtens [artikel 6.12][ref1] of [artikel 6.13][ref2] vereist is,
      draagt zorg voor:

      a. een zodanige situering en uitvoering van de handelingen dat geen nadelige gevolgen optreden voor het veilig
      en doelmatig gebruik van het oppervlaktewaterlichaam of het bijbehorende kunstwerk overeenkomstig de daaraan
      toegekende functies, voor de ecologische toestand van het oppervlaktewaterlichaam en voor het kustfundament;

      b. het voorkomen van een feitelijke belemmering voor vergroting van de afvoercapaciteit van het
      oppervlaktewaterlichaam; en

      c. een zo gering mogelijke waterstandsverhoging of afname van het bergend vermogen van het oppervlaktewaterlichaam
      ten gevolge van het gebruik, alsmede het compenseren van resterende onvermijdbare waterstandseffecten.

      2 Het gebruik, bedoeld in het eerste lid, wordt in ieder geval uitgevoerd overeenkomstig bij ministeriële regeling
      te stellen regels. Deze regels kunnen mede betrekking hebben op:

      a. het compenseren van waterstandseffecten of van de afname van het bergend vermogen van het
      oppervlaktewaterlichaam, alsmede de financiering en tijdige realisatie van deze compensatie;

      b. het melden en registreren van gegevens ten aanzien van het gebruik en de opgave daarvan aan Onze Minister.

      3 Bij de in het tweede lid bedoelde regeling kan worden bepaald dat Onze Minister voor daarbij aan te wijzen
      aspecten van het gebruik aan de gebruiker voorschriften kan opleggen ter uitwerking van de in dat lid bedoelde
      regels. Daarbij kan worden bepaald dat de voorschriften kunnen afwijken van die regels.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.12
      [ref2]: https://wetten.overheid.nl/BWBR0026872#Artikel6.13
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.15
