  - number: '6.9'
    text: |-
      1 Een vergunning als bedoeld in [artikel 6.3 van de wet][ref1] wordt verleend door Onze Minister, in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      2 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref2] en [afdeling 13.2 van de Wet milieubeheer][ref3] zijn niet
      van toepassing, indien:

      a. de aanvraag betrekking heeft op het in het buitenland aan boord van een Nederlands vaartuig of luchtvaartuig
      nemen van afvalstoffen, verontreinigende of schadelijke stoffen, met het oogmerk die stoffen te storten; en

      b. de Staat op wiens grondgebied dat aan boord nemen geschiedt, partij is bij het Protocol of het Verdrag.

      3 Voorts kan Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer bepalen dat [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] en
      [afdeling 13.2 van de Wet milieubeheer][ref5] niet van toepassing zijn indien de aanvraag betrekking heeft op
      stoffen waarvan door een ongewoon voorval de afvoer op korte termijn nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
