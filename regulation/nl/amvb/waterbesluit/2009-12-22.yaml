  - number: '2.3'
    text: |-
      1 Het bevoegd gezag controleert het brengen van stedelijk afvalwater in een oppervlaktewaterlichaam vanuit een
      zuiveringtechnisch werk op de naleving van de eisen gesteld krachtens de [artikelen 6.5][ref1] en [6.6][ref2] in
      ieder geval overeenkomstig de in [artikel 6.7, eerste lid][ref3], bedoelde regels.

      2 Het bevoegd gezag controleert oppervlaktewaterlichamen waarin vanuit een zuiveringtechnisch werk stedelijk
      afvalwater wordt gebracht of waarin bedrijfsafvalwater wordt gebracht afkomstig van een bij ministeriële regeling
      aangewezen categorie van bedrijven of bedrijfsactiviteiten, in ieder geval wanneer mag worden verwacht dat de
      kwaliteit van het ontvangende oppervlaktewaterlichaam in betekenende mate zal worden beïnvloed.

      3 Het bevoegd gezag legt binnen vier maanden na ontvangst van een verzoek daartoe de resultaten van de in het
      eerste en tweede lid bedoelde controles over aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0026872#Artikel6.6
