articles:
  - number: '1.1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *grondwaterrichtlijn:* richtlijn nr. 2006/118/EG van het Europees Parlement en de Raad van de Europese Unie
      van 12 december 2006 betreffende de bescherming van het grondwater tegen verontreiniging en achteruitgang van de
      toestand (PbEU L 372);
        - *hoofdwater:* oppervlaktewaterlichaam dat is aangewezen in [bijlage II][ref1], onderdeel 1, bij dit besluit;
        - *overstromingsrisicobeheerplan:* plan als bedoeld in de artikelen 7 en 8 van de richtlijn overstromingsrisico’s;
        - *Protocol:* op 7 november 1996 te Londen tot stand gekomen Protocol bij het op 29 december 1972 te Londen tot
      stand gekomen Verdrag inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten van afval en
      andere stoffen (Trb. 2000, 27);
        - *richtlijn overstromingsrisico’s:* richtlijn nr. 2007/60/EG van het Europees Parlement en de Raad van de Europese
      Unie van 23 oktober 2007 over beoordeling en beheer van overstromingsrisico’s (PbEU L 288);
        - *Verdrag:* op 22 september 1992 te Parijs tot stand gekomen Verdrag inzake de bescherming van het mariene milieu
      in het noordoostelijk deel van de Atlantische Oceaan (Trb. 1993, 16);
        - *wet:* Waterwet;
        - *zijwater:* oppervlaktewaterlichaam dat in open verbinding staat met een van de hoofdwateren.

      2 In dit besluit wordt onder oppervlaktewaterlichaam mede begrepen een gedeelte van een oppervlaktewaterlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0026872
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0026872
  - number: '1.2'
    text: |-
      1 De onderlinge grenzen tussen de Nederlandse delen van de stroomgebieddistricten Eems, Maas, Rijn en Schelde zijn
      aangegeven op de in [bijlage I][ref1] bij dit besluit opgenomen kaarten.

      2 De onder de stroomgebieddistricten Eems, Rijn, Maas en Schelde gelegen grondwaterlichamen zijn toegewezen aan
      de desbetreffende stroomgebieddistricten, met dien verstande dat een grondwaterlichaam dat zich bevindt onder
      twee stroomgebieddistricten over die stroomgebieddistricten verdeeld is met inachtneming van de in het eerste lid
      bedoelde grenzen.


      [ref1]: https://wetten.overheid.nl/BWBR0026872
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0026872
  - number: '2.1'
    text: |-
      1 In geval van een watertekort of dreigend watertekort wordt met het oog op de verdeling van het beschikbare
      water over de maatschappelijke en ecologische behoeften bij het beheer de volgende rangorde van behoeften in acht
      genomen:

      1°. het waarborgen van de veiligheid tegen overstroming en het voorkomen van onomkeerbare schade;

      2°. nutsvoorzieningen;

      3°. kleinschalig hoogwaardig gebruik;

      4°. overige behoeften.

      2 Bij de in het eerste lid, onder 1°, bedoelde behoeften wordt achtereenvolgens prioriteit toegekend aan:

      1°. de stabiliteit van waterkeringen;

      2°. het voorkomen van klink en zettingen;

      3°. natuur, voor zover het gaat om het voorkomen van onomkeerbare schade.

      3 Bij de in het eerste lid, onder 2°, bedoelde behoeften wordt achtereenvolgens prioriteit toegekend aan:

      1°. drinkwatervoorziening, voor zover het gaat om het waarborgen van de leveringszekerheid;

      2°. energievoorziening, voor zover het gaat om het waarborgen van de leveringszekerheid.

      4 Bij de in het eerste lid, onder 3°, bedoelde behoeften wordt, op zodanige wijze dat de maatschappelijke en
      economische gevolgen zo gering mogelijk zijn, prioriteit toegekend aan:

      a. de tijdelijke beregening van kapitaalintensieve gewassen;

      b. het verwerken van industrieel proceswater.

      5 Bij de in het eerste lid, onder 4°, bedoelde overige behoeften wordt, op zodanige wijze dat de maatschappelijke
      en economische gevolgen zo gering mogelijk zijn, prioriteit toegekend aan:

      a. scheepvaart;

      b. landbouw;

      c. natuur, voor zover het niet gaat om het voorkomen van onomkeerbare schade;

      d. industrie;

      e. waterrecreatie;

      f. binnenvisserij;

      g. drinkwatervoorziening, voor zover het niet gaat om de behoefte, bedoeld in het derde lid, onder 1°;

      h. energievoorziening, voor zover het niet gaat om de behoefte, bedoeld in het derde lid, onder 2°;

      i. overige belangen.
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel2.1
  - number: '2.2'
    text: |-
      Onverminderd [artikel 2.1][ref1], kunnen bij of krachtens provinciale verordening voor regionale
      wateren nadere regels worden gesteld ten aanzien van de verdeling van het beschikbare water over de in
      [artikel 2.1, vierde en vijfde lid][ref2], genoemde behoeften in geval van een watertekort.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel2.1
