  - number: '6.17'
    text: |-
      Het is in bij ministeriële regeling te bepalen gevallen verboden zonder vergunning van Onze Minister als bedoeld
      in [artikel 6.5 van de wet][ref1] water te brengen in of te onttrekken aan oppervlaktewaterlichamen in beheer bij
      het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6.5'
  - number: '6.18'
    text: |-
      1 Degene die water brengt in of onttrekt aan een oppervlaktewaterlichaam in beheer bij het Rijk, waarvoor geen
      vergunning krachtens [artikel 6.17][ref1] is vereist, draagt zorg voor een zodanige situering en uitvoering van
      deze handelingen dat geen nadelige gevolgen optreden voor de ecologische toestand van dat oppervlaktewaterlichaam
      of voor het peilbeheer.

      2 Bij ministeriële regeling kan worden bepaald dat Onze Minister voor daarbij aan te wijzen aspecten aan degene die
      water brengt in of onttrekt aan een oppervlaktewaterlichaam in beheer bij het Rijk voorschriften kan opleggen ter
      uitwerking van het eerste lid.

      3 In geval van een watertekort of dreigend watertekort kan Onze Minister verbieden water te onttrekken
      aan oppervlaktewaterlichamen in beheer bij het Rijk. Dit besluit wordt bekend gemaakt door plaatsing in de
      Staatscourant. Zodra de situatie van een watertekort of dreigend watertekort is geëindigd, trekt Onze Minister het
      verbod in en maakt dat onverwijld bekend door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.17
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6.17'
        hoofdstuk: '6'
        paragraaf: '7'
  - number: '6.19'
    text: |-
      Degene die water brengt in of onttrekt aan oppervlaktewaterlichamen in beheer bij het Rijk, waarvoor geen
      vergunning is vereist krachtens [artikel 6.17][ref1], doet daarvan in bij ministeriële regeling te bepalen gevallen
      melding aan Onze Minister, volgens bij die regeling te stellen regels. Bij de regeling kunnen mede regels worden
      gesteld met betrekking tot het uitvoeren van metingen, het registreren van gegevens en het doen van opgave daarvan
      aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.17
