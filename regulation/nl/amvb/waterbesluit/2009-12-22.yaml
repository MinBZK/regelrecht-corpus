  - number: '4.9'
    text: |-
      1 Gedeputeerde staten van de provincies dragen zorg voor de productie, de actualisatie en de elektronische
      publicatie van overstromingsgevaar- en overstromingsrisicokaarten, overeenkomstig artikel 6 van de richtlijn
      overstromingsrisico’s, ten minste twee jaren voor de vaststelling van het overstromingsrisicobeheerplan. De kaarten
      hebben geen betrekking op overstromingen vanuit rioolstelsels.

      2 De in het eerste lid bedoelde kaarten worden ten minste eenmaal in de zes jaren herzien.

      3 Bij ministeriële regeling kunnen nadere regels gesteld worden over de op de kaarten op te nemen informatie en de
      productie, de actualisatie en de vormgeving van die kaarten.
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel4.9
  - number: '4.10'
    text: |-
      Een regionaal waterplan omvat mede:

      a. de aanwijzing van regionale oppervlaktewaterlichamen in de zin van de kaderrichtlijn water die niet in
      beheer zijn bij het Rijk, waarbij kunstmatige of sterk veranderde oppervlaktewaterlichamen worden aangewezen
      overeenkomstig artikel 4, derde lid, van die richtlijn;

      b. de aanwijzing van grondwaterlichamen in de zin van de kaderrichtlijn water.
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel4.10
  - number: '4.11'
    text: |-
      1 De in het regionale waterplan op te nemen doelstellingen en maatregelen omvatten, gerangschikt naar
      stroomgebieddistrict, in elk geval:

      a. maatregelen als bedoeld in artikel 11 van de kaderrichtlijn water;

      b. maatregelen als bedoeld in de artikelen 4, vijfde lid, en 6, eerste lid, van de grondwaterrichtlijn; en

      c. doelstellingen en maatregelen als bedoeld in artikel 7 van de richtlijn overstromingsrisico’s.

      2 [Artikel 4.6, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel4.6
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '4.6'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.12'
    text: |-
      1 Provinciale staten leggen de volgende bijzondere functies voor regionale wateren vast in een regionaal waterplan:

      a. de functie zwemwater;

      b. de functie drinkwateronttrekking voor de regionale wateren die worden gebruikt voor de onttrekking van voor
      menselijke consumptie bestemd water en van waaruit dagelijks meer dan 10 m3 water wordt onttrokken, dan wel van
      waaruit water wordt onttrokken ten behoeve van meer dan 50 personen.

      2 [Artikel 4.8][ref1] is van overeenkomstige toepassing op de vastlegging van de functie zwemwater in een regionaal
      waterplan, met dien verstande dat voor «Onze Ministers» wordt gelezen: provinciale staten.

      3 Een besluit tot tussentijdse herziening van een regionaal waterplan waarbij uitsluitend voor een watersysteem of
      onderdeel daarvan de functie zwemwater wordt vastgelegd dan wel een zodanige functietoekenning wordt ingetrokken,
      kan worden vastgesteld door gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel4.8
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '4.8'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.13'
    text: |-
      Indien internationale verplichtingen of bovenregionale belangen dat noodzakelijk maken, kunnen bij ministeriële
      regeling regels worden gesteld over de inhoud van regionale waterplannen.
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel4.13
  - number: '4.14'
    text: |-
      1 De voorbereiding van het beheerplan voor de rijkswateren geschiedt overeenkomstig
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], met dien verstande dat zienswijzen op het ontwerp naar
      voren kunnen worden gebracht door een ieder.

      2 Het ontwerp van het beheerplan voor de rijkswateren wordt tevens ter inzage gelegd bij de provincies.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de voorbereiding, vormgeving en inrichting
      van het beheerplan voor de rijkswateren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '4.15'
    text: |-
      Bij de voorbereiding van het beheerplan voor de rijkswateren raadpleegt Onze Minister:

      a. gedeputeerde staten van de provincies op wiens grondgebied de rijkswateren of een gedeelte daarvan, waarop het
      plan betrekking heeft, zijn gelegen;

      b. het dagelijks bestuur van de waterschappen die watersystemen beheren die samenhangen of samen kunnen hangen met
      de rijkswateren of een gedeelte daarvan waarop het plan betrekking heeft;

      c. de bevoegde Belgische, Duitse en Britse autoriteiten, voor zover het plan betrekking heeft op grensvormende of
      grensoverschrijdende wateren.
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel4.15
  - number: '4.16'
    text: |-
      1 De in het beheerplan voor de rijkswateren op te nemen doelstellingen en maatregelen omvatten, gerangschikt naar
      stroomgebieddistrict, in elk geval:

      a. maatregelen als bedoeld in artikel 11 van de kaderrichtlijn water; en

      b. doelstellingen en maatregelen als bedoeld in artikel 7 van de richtlijn overstromingsrisico’s.

      2 [Artikel 4.6, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel4.6
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '4.6'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.17'
    text: |-
      Voor zover het nationale waterplan voorziet in aanvullende toekenning van de functie zwemwater in het beheerplan
      voor de rijkswateren, is [artikel 4.8][ref1] van overeenkomstige toepassing op die toekenning, met dien verstande
      dat voor «Onze Ministers» wordt gelezen: Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel4.8
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '4.8'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.18'
    text: |-
      Indien internationale verplichtingen of bovenregionale belangen dat noodzakelijk maken, kunnen bij ministeriële
      regeling regels worden gesteld over de inhoud van beheerplannen.
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel4.18
  - number: '5.1'
    text: |-
      Van de in [artikel 5.1, eerste lid, van de wet][ref1] bedoelde verplichtingen wordt vrijstelling verleend met
      betrekking tot de oppervlaktewaterlichamen Noordzee, Waddenzee, Westerschelde en IJsselmeer.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5.1'
  - number: '5.2'
    text: |-
      1 Onze Minister stelt peilbesluiten vast voor de volgende rijkswateren of onderdelen daarvan:

      a. Noordzeekanaal, Afgesloten IJ, Buiten IJ, Amsterdam-Rijnkanaal;

      b. Grevelingenmeer;

      c. Veerse Meer;

      d. Volkerak-Zoommeer, Bathse Spuikanaal, Schelde-Rijnverbinding tussen het Volkerak-Zoommeer en de Kreekraksluizen;

      e. IJsselmeer, Ketelmeer, Vossemeer, Zwarte Meer, Markermeer, IJmeer, Gooimeer, Eemmeer, Wolderwijd, Nijkerkernauw,
      Nuldernauw, Veluwemeer, Drontermeer.

      2 De voorbereiding van een peilbesluit geschiedt overeenkomstig
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], met dien verstande dat Onze Minister binnen acht weken na
      afloop van de termijn, genoemd in [artikel 3.11, vierde lid, van die wet][ref2], het peilbesluit vaststelt.

      3 Bij het vaststellen van een peilbesluit houdt Onze Minister rekening met het nationale waterplan en het
      beheerplan voor de rijkswateren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel311
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:11
  - number: '5.3'
    text: |-
      Het door de beheerder vast te stellen calamiteitenplan, bedoeld in [artikel 5.29 van de wet][ref1], bevat ten
      minste:

      a. een overzicht van de soorten calamiteiten die zich in de watersystemen of onderdelen daarvan kunnen voordoen,
      waaronder een inventarisatie van de daarmee gepaard gaande risico’s;

      b. een overzicht van te nemen maatregelen, met inbegrip van de maatregelen die voortkomen uit de voor de
      betreffende watersystemen geldende overstromingsrisicobeheerplannen, en het beschikbare materieel, benodigd om de
      onderscheidene calamiteiten het hoofd te bieden;

      c. een overzicht van de diensten, instanties en organisaties, die bij gevaar kunnen worden ingeschakeld;

      d. een beschrijving van het moment en de wijze van het door de beheerder informeren van burgemeesters en wethouders
      van de gemeenten waarbinnen de watersystemen of onderdelen daarvan zijn gelegen;

      e. een schema met betrekking tot de calamiteitenorganisatie van de beheerder;

      f. een meld- en alarmeringsprocedure;

      g. een overzicht waaruit blijkt op welke wijze de beheerder de kwaliteit van de calamiteitenorganisatie waarborgt.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5.29
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5.29'
  - number: '6.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *bedrijfsafvalwater:* afvalwater dat vrijkomt bij door de mens bedrijfsmatig of in een omvang alsof zij
      bedrijfsmatig was, ondernomen bedrijvigheid, dat geen huishoudelijk afvalwater, afvloeiend hemelwater of grondwater
      is;
        - *bouwen:* bouwen als bedoeld in [artikel 1, eerste lid, onderdeel a, van de Woningwet][ref1];
        - *emissiegrenswaarde:* emissiegrenswaarde als bedoeld in artikel 2, onderdeel 40, van de kaderrichtlijn water;
        - *huishoudelijk afvalwater:*afvalwater dat overwegend afkomstig is van menselijke stofwisseling en huishoudelijke
      werkzaamheden;
        - *inwoner-equivalent (i.e.):* biochemisch zuurstofverbruik van 54 gram per etmaal;
        - *totaal-stikstof:* om van totaal Kjeldahl-stikstof (organisch N + NH), nitraat (NO)-stikstof en nitriet
      (NO)-stikstof;
        - *zuiveringsrendement:* percentage van het totaal-fosfaat onderscheidenlijk totaal-stikstof dat uit het
      stedelijk afvalwater wordt verwijderd dat op de onder de zorg van eenzelfde bestuursorgaan staande gezamenlijke
      zuiveringtechnische werken wordt aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 6.1a
    text: |-
      Bij het verlenen van een watervergunning houdt het bevoegd gezag rekening met de ingevolge de
      [artikelen 4.1][ref1], [4.4][ref2] en [4.6 van de wet][ref3] vastgestelde plannen, die betrekking hebben op het
      betreffende watersysteem of onderdeel daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel4.4
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel4.6
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.1a
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4.1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '4.4'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '4.6'
  - number: 6.1b
    text: |-
      Op de voorbereiding van een vergunning als bedoeld in [artikel 6.2 van de wet][ref1] zijn de
      [afdelingen 3.4 van de Algemene wet bestuursrecht][ref2] en [13.2 van de Wet milieubeheer][ref3] niet van
      toepassing, indien het lozen plaatsvindt:

      a. vanuit een inrichting, niet zijnde een inrichting als bedoeld in
      [artikel 8.1, eerste of tweede lid, van de Wet milieubeheer][ref4];

      b. anders dan vanuit een inrichting in de zin van [artikel 1.1, derde lid, van de Wet milieubeheer][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.1b
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6.2'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8.1'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '1.1'
  - number: '6.2'
    text: |-
      Indien internationale verplichtingen dat noodzakelijk maken, kan bij ministeriële regeling worden bepaald dat:

      a. in een vergunning als bedoeld in [artikel 6.2 van de wet][ref1] wordt bepaald dat zij geldt voor een bij die
      vergunning vast te stellen termijn van ten hoogste een bij die regeling vast te stellen aantal jaren;

      b. het bevoegd gezag met een bij die regeling vast te stellen frequentie beziet of een vergunning als bedoeld
      in [artikel 6.2 van de wet][ref2] nog toereikend is, gezien de ontwikkelingen op het gebied van de technische
      mogelijkheden tot bescherming van het milieu en de ontwikkelingen met betrekking tot de kwaliteit van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6.2'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6.2'
  - number: '6.3'
    text: |-
      Indien internationale verplichtingen dat noodzakelijk maken, kunnen bij ministeriële regeling emissiegrenswaarden
      worden vastgesteld voor het lozen van stoffen in een oppervlaktewaterlichaam of op een zuiveringtechnisch werk. Bij
      die regeling kunnen tevens regels worden gesteld ten aanzien van het meten van die stoffen.
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.3
  - number: 6.3a
    text: |-
      Bij ministeriële regeling worden regels gesteld over het lozen van afvalwater van rookgasreiniging. Deze regels
      omvatten mede een instructie aan het bevoegd gezag omtrent de aan een vergunning te verbinden voorschriften en
      beperkingen.
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.3a
  - number: '6.4'
    text: |-
      1 Het is verboden vanuit een zuiveringtechnisch werk stedelijk afvalwater in een oppervlaktewaterlichaam te
      brengen, tenzij het werk is berekend op een in een jaar voorkomende maximale gemiddelde wekelijkse belasting,
      ongebruikelijke situaties daarbij buiten beschouwing gelaten, en de doelmatige werking van het werk wordt
      gewaarborgd.

      2 Het is verboden slib dat geheel of in hoofdzaak afkomstig is van een zuiveringtechnisch werk in een
      oppervlaktewaterlichaam te brengen, met uitzondering van geringe hoeveelheden slib in het te lozen
      stedelijk afvalwater, indien de grenswaarde voor de totale hoeveelheid onopgeloste bestanddelen, genoemd in
      [artikel 6.5][ref1], niet wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.5
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6.5'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '6.5'
    text: |-
      1 Het bevoegd gezag verbindt aan een vergunning als bedoeld [artikel 6.2 van de wet][ref1], om stedelijk afvalwater
      met een vervuilingswaarde van 2.000 inwoner-equivalenten of meer in een oppervlaktewaterlichaam te brengen, in
      ieder geval het voorschrift dat het stedelijk afvalwater een zodanige behandeling ondergaat dat de waarden van de
      in de volgende tabel genoemde parameters de daarbij behorende grenswaarden na behandeling niet overschrijden:








                    Parameters


                    Grenswaarde






                    Biochemisch zuurstofverbruik (BZV bij 20°C) zonder nitrificatie


                    20 mg/l O




                    Chemisch zuurstofverbruik (CZV)


                    125 mg/l O




                    Totale hoeveelheid onopgeloste bestanddelen


                    30 mg/l




                    Totaal-fosfor (indien meer dan 100.000 i.e.)


                    1 mg/l P




                    Totaal-fosfor (indien 2.000 tot en met 100.000 i.e.)


                    2 mg/l P




                    Totaal-stikstof (indien 20.000 i.e. of meer )


                    10 mg/l N




                    Totaal-stikstof (indien 2.000 tot 20.000 i.e.)


                    15 mg/l N






      2 Het bevoegd gezag kan aan de vergunning, bedoeld in het eerste lid, lagere grenswaarden verbinden
      dan de grenswaarden, genoemd in dat lid, indien het belang van de bescherming van de kwaliteit van het
      oppervlaktewaterlichaam daartoe noodzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6.2'
  - number: '6.6'
    text: |-
      In afwijking van [artikel 6.5, eerste lid][ref1], kan het bevoegd gezag aan de vergunning voor een
      zuiveringtechnisch werk hogere grenswaarden verbinden voor de parameters totaal-fosfor en totaal-stikstof, indien
      het zuiveringsrendement ten minste 75 procent bedraagt en het een zuiveringtechnisch werk betreft:

      a. dat vóór 1 januari 1991 in bedrijf is genomen en waarvan de capaciteit op of na 1 januari 1991 niet of met niet
      meer dan 25 procent is uitgebreid;

      b. dat vóór 1 januari 1991 in bedrijf is genomen en ten aanzien waarvan ten behoeve van het uitbreiden van
      de capaciteit met meer dan 25 procent vóór 1 januari 1991 een bouwvergunning in de zin van de Woningwet is
      aangevraagd;

      c. dat vóór 1 september 1992 in bedrijf is genomen en ten behoeve van het bouwen waarvan vóór 1 januari 1991 een
      bouwvergunning in de zin van de Woningwet is aangevraagd; of

      d. met een ontwerpcapaciteit van minder dan 20.000 inwoner-equivalenten.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.5
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6.5'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '6.7'
    text: |-
      1 Een overheidslichaam dat de zorg heeft voor een zuiveringtechnisch werk voor de behandeling van stedelijk
      afvalwater met een vervuilingswaarde van 2.000 inwoner-equivalenten of meer, bemonstert zowel het inkomende
      als het behandelde stedelijk afvalwater, analyseert het op de parameters biochemisch zuurstofverbruik, chemisch
      zuurstofverbruik, onopgeloste bestanddelen, totaal-fosfaat en totaal-stikstof en beoordeelt de resultaten daarvan
      met inachtneming van bij regeling van Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer vast te stellen regels.

      2 Het in het eerste lid bedoelde overheidslichaam legt binnen vier maanden na afloop van ieder kalenderjaar aan
      Onze Minister een overzicht over van de onder zijn zorg staande zuiveringtechnische werken en van de resultaten van
      de bemonstering, analyse en beoordeling, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.7
  - number: '6.8'
    text: |-
      1 Een vergunning als bedoeld in [artikel 6.3 van de wet][ref1] kan slechts worden verleend in overeenstemming met
      het Protocol en het Verdrag.

      2 Van de vergunningplicht, bedoeld in [artikel 6.3 van de wet][ref2], zijn de volgende gedragingen vrijgesteld:

      a. het plaatsen van vaste substanties of voorwerpen met een ander oogmerk dan het zich er enkel van ontdoen;

      b. het achterlaten van vaste substanties of voorwerpen die aanvankelijk in zee zijn geplaatst met een ander oogmerk
      dan het zich ervan ontdoen.

      3 In de gevallen, waarin door overmacht het in [artikel 6.3, eerste lid, onderdeel a, van de wet][ref3] omschreven
      verbod wordt overtreden, maakt de kapitein van het vaartuig of de gezagvoerder van het luchtvaartuig van het
      voorval melding in het scheepsdagboek of het journaal. Tevens doet hij van dit voorval onverwijld mededeling aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6.3'
