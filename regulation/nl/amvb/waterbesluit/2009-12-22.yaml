  - number: '8.7'
    text: |-
      1 Indien door de inwerkingtreding van een algemene maatregel van bestuur, een ministeriële regeling, een
      provinciale verordening of een verordening van een waterschap de betrokkenheid van het bestuursorgaan, dat met
      toepassing van [artikel 6.17 van de wet][ref1] als bevoegd gezag een watervergunning heeft verleend, bij die
      watervergunning eindigt, wordt die watervergunning met betrekking tot de resterende vergunningplichtige handeling
      of handelingen gelijkgesteld met een watervergunning, verleend door het bestuursorgaan dat voor die handeling of
      handelingen, zo nodig met overeenkomstige toepassing van [artikel 6.17 van de wet][ref2], bevoegd gezag is.

      2 Het overeenkomstig het eerste lid bepaalde bevoegd gezag deelt aan de vergunninghouder mede dat hij bevoegd gezag
      is voor de watervergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.17
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.17
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel8.7
