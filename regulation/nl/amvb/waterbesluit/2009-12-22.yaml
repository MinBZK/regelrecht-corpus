  - number: '3.1'
    text: |-
      1 Het beheer van oppervlaktewaterlichamen die zijn vermeld in [bijlage II][ref1] bij dit besluit berust bij het
      Rijk, met uitzondering van de onderdelen van beheer van bepaalde oppervlaktewaterlichamen die zijn gelegen buiten
      de desbetreffende bij ministeriële regeling vastgestelde beheergrenzen.

      2 Voorts berust bij het Rijk het beheer van de zijwateren, met uitzondering van de onderdelen van beheer van
      bepaalde zijwateren die zijn gelegen buiten de desbetreffende bij ministeriële regeling vastgestelde beheergrenzen.

      3 Het beheer van de oppervlaktewaterlichamen die ingevolge het eerste lid in beheer zijn bij het Rijk, omvat mede
      het beheer van de daarin gelegen ondersteunende kunstwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0026872
    url: https://wetten.overheid.nl/BWBR0026872/2009-12-22#Artikel3.1
    references:
      - id: ref1
