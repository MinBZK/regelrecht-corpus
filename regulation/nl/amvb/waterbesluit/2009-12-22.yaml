      1 Het is verboden zonder vergunning van Onze Minister als bedoeld in [artikel 6.5 van de wet][ref1] gebruik te
      maken van een oppervlaktewaterlichaam of een bijbehorend kunstwerk in beheer bij het Rijk, niet zijnde de Noordzee,
      door, anders dan in overeenstemming met de functie, daarin, daarop, daarboven, daarover of daaronder:

      a. werken te maken of te behouden;

      b. vaste substanties of voorwerpen te storten, te plaatsen of neer te leggen, of deze te laten staan of liggen.

      2 Het eerste lid is niet van toepassing op:

      a. het bouwen van bouwwerken als bedoeld in het
      [Besluit bouwvergunningsvrije en licht-bouwvergunningplichtige bouwwerken][ref2], met uitzondering van de
      bouwwerken bedoeld in [artikel 5, tweede lid, onderdeel b, van dat besluit][ref3] en met dien verstande dat in
      __REF002___________________________________________________________________________________________________________
      ________ in plaats van «minder is dan 50 m2» gelezen wordt: minder is dan 30 m2;

      b. activiteiten als bedoeld in
      [artikel 4.1.1, eerste lid, onderdeel a tot en met e, van het Besluit ruimtelijke ordening][ref5], met dien
      verstande dat in het eerste lid van dat artikel:

      1°. in onderdeel a, onder 1e, in plaats van «ten hoogste 150 m2» gelezen wordt: ten hoogste 25 m2;

      2°. de uitbreiding van of een bijgebouw bij een ander gebouw, bedoeld in onderdeel b, betrekking heeft op een
      gebouw buiten de bebouwde kom met een agrarische bestemming;

      3°. in onderdeel d, onder 1e, in plaats van «50 m2» gelezen wordt: 25 m2;

      c. het uitvoeren van onderhoud, aanleg of wijziging van waterstaatswerken, voor zover deze activiteiten door of
      vanwege de beheerder worden verricht;

      d. het maken van werken om oeverafslag tegen te gaan, mits deze niet boven het oeverland uitsteken, en het ten
      behoeve van de uitvoering van die werken storten, plaatsen of neerleggen van vaste substanties of voorwerpen;

      e. het permanent afmeren van woonschepen of andere drijvende objecten in rijkswateren, met uitzondering van de
      rijkswateren of delen van rijkswateren die zijn aangewezen bij ministeriële regeling; en

      f. bij ministeriële regeling aan te wijzen activiteiten van ondergeschikt belang voor de veilige en doelmatige
      functievervulling van het oppervlaktewaterlichaam of een bijbehorend kunstwerk.

      3 Bij ministeriële regeling kan worden bepaald dat voor daarbij aan te wijzen categorieën oppervlaktewaterlichamen
      het tweede lid niet van toepassing is op daarbij aan te wijzen bouwwerken als bedoeld in het tweede lid, onderdeel
      a, of daarbij aan te wijzen activiteiten als bedoeld in het tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0013890
      [ref3]: https://wetten.overheid.nl/BWBR0013890#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0013890#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0023798#Artikel4.1.1
