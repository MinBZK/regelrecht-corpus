  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 17 februari 2009, nr. CEND/HDJZ-2009/132
    Sector WAT, Hoofddirectie Juridische Zaken, gedaan in overeenstemming met Onze Minister van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 1.2, tweede lid, 2.9, 2.14, 3.1, eerste tot en met derde lid, 3.10, tweede lid, 3.11, tweede
    lid, 4.3, eerste lid, 4.7, 4.8, tweede lid, 5.1, derde lid, 5.2, derde lid, 5.29, eerste lid,6.5, 6.6, 6.7, 6.14,
    eerste lid, 6.16, eerste lid,6.20, tweede lid, 7.8, tweede en derde lid, en 10.1, eerste lid, van de Waterwet;

    De Raad van State gehoord (advies van 5 juni 2009, nr. W09.09.0044/IV);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 24 november 2009, nr. CEND/
    HDJZ-2009/1305 sector WAT, Hoofddirectie Juridische Zaken, uitgebracht in overeenstemming met Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
