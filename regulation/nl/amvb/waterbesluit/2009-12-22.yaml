  - number: '8.6'
    text: |-
      [Artikel 2.25, tweede tot en met vierde lid, van de Invoeringswet Waterwet][ref1] is van overeenkomstige toepassing
      op een vergunning krachtens [artikel 1, tweede lid, van de Wet verontreiniging oppervlaktewateren][ref2], die
      overeenkomstig het [eerste lid van artikel 2.29 van de Invoeringswet Waterwet ][ref3]onherroepelijk is geworden na
      het tijdstip van inwerkingtreding van [paragraaf 6.2 van de wet][ref4].


