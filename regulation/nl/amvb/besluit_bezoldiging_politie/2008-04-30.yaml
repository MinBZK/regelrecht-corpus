  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit wordt onder echtgenote of echtgenoot mede verstaan de geregistreerde partner
      alsmede de niet-gehuwde ambtenaar die met een levenspartner samenwoont en – met het oogmerk duurzaam samen te leven
      – een gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende de
      wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding. Onder weduwe
      of weduwnaar wordt mede begrepen de achtergebleven geregistreerde partner alsmede de achtergebleven levenspartner.
      Tegelijkertijd kan slechts een persoon als echtgenoot of echtgenote dan wel weduwe of weduwnaar worden aangemerkt.
      Het bevoegd gezag kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt
      dat een samenlevingscontract als bedoeld in de eerste volzin is gesloten.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel1
  - number: '2'
    text: |-
      De bepaling van de salarisschaal, de waardering van de functie, de vaststelling, de toekenning, de intrekking,
      de verhoging onderscheidenlijk de vermindering van het salaris, de toelagen, de vergoedingen, de uitkeringen,
      de tegemoetkoming in de representatiekosten, het salaris van de aspirant, en de gratificatie geschieden door het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel2
  - number: '3.1'
    text: |-
      Voor de aspirant geldt een salarisschaal die is opgenomen in [bijlage II van dit besluit][ref1] .


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '3.2'
    text: 'Bij aanstelling wordt het salaris vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3
  - number: 3.2.a
    text: voor de aspirant die een opleiding volgt op niveau 2, op het minimumbedrag van schaal 2a;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3
  - number: 3.2.b
    text: voor de aspirant die een opleiding volgt op niveau 3, op het minimumbedrag van schaal 3a;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3
  - number: 3.2.c
    text: voor de aspirant die een opleiding volgt op niveau 4, op het minimumbedrag van schaal 4a;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3
  - number: 3.2.d
    text: voor de aspirant die een opleiding volgt op niveau 5, op het minimumbedrag van schaal 5a;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3
  - number: 3.2.e
    text: voor de aspirant die een opleiding volgt op niveau 6, op het minimumbedrag van schaal 6a.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3
  - number: '3.3'
    text: |-
      Het salaris van de aspirant wordt na het verstrijken van de periode die voor de desbetreffende schaal staat vermeld
      in [bijlage II van dit besluit][ref1], verhoogd tot het naasthogere bedrag in de schaal, indien de aspirant naar
      het oordeel van het bevoegd gezag naar behoren functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '3.4'
    text: |-
      Na het succesvol afronden van de opleiding wordt het salaris vastgesteld op een bedrag dat gelijk is
      aan of hoger dan het bij het desbetreffende opleidingsniveau behorende garantiebedrag zoals genoemd in
      [bijlage III van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '3.5'
    text: In bijzondere situaties kan het bevoegd gezag ten gunste van de aspirant afwijken van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3
  - number: 3a.1
    text: |-
      Het salaris van de vakantiewerker wordt vastgesteld op het maandbedrag van het minimumloon dat krachtens de
      [artikelen 7][ref1] en [8 van de Wet minimumloon en minimumvakantiebijslag][ref2] geldt voor werknemers van
      dezelfde leeftijd als de vakantiewerker, aangevuld met € 73,15 per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 3a.2
    text: Het salaris, bedoeld in het eerste lid, wordt verhoogd met 15,7%.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel3a
  - number: '4.1'
    text: Het salaris, de toelagen en de vergoedingen worden maandelijks betaald.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel4
  - number: '4.2'
    text: |-
      De aanspraak op het salaris, de toelagen, de vergoedingen en de uitkeringen vangt aan met ingang van de dag waarop
      de aanstelling ingaat.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel4
  - number: '4.3'
    text: |-
      Wanneer het salaris, een toelage als bedoeld in de [artikelen 15][ref1], [16][ref2], [17][ref3], [17b][ref4],
      [19][ref5], [20][ref6] en [21][ref7] of een uitkering als bedoeld in [artikel 23, tweede lid][ref8], moet worden
      berekend over een gedeelte van een kalendermaand, wordt het bedrag per dag vastgesteld door het maandbedrag te
      delen door het aantal dagen van de desbetreffende kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel17b
      [ref5]: https://wetten.overheid.nl/BWBR0006517#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0006517#Artikel20
      [ref7]: https://wetten.overheid.nl/BWBR0006517#Artikel21
      [ref8]: https://wetten.overheid.nl/BWBR0006517#Artikel23
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '15'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '16'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '17'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: 17b
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0006517
        artikel: '19'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0006517
        artikel: '20'
        hoofdstuk: '5'
      - id: ref7
        bwb_id: BWBR0006517
        artikel: '21'
        hoofdstuk: '5'
      - id: ref8
        bwb_id: BWBR0006517
        artikel: '23'
        hoofdstuk: '6'
  - number: 4a.1
    text: |-
      Op de ambtenaar die deelnemer is in het AFUP-opbouwreglement wordt door het bevoegd gezag de helft van de voor het
      algemeen deel van de AFUP verschuldigde pensioenpremie verhaald.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel4a
  - number: 4a.2
    text: 'In afwijking van het eerste lid verhaalt het bevoegd gezag:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel4a
  - number: 4a.2.a
    text: in het jaar 2001 10% van de premie voor het algemeen deel van de AFUP;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel4a
  - number: 4a.2.b
    text: in het jaar 2002 20% van de premie voor het algemeen deel van de AFUP;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel4a
  - number: 4a.2.c
    text: in het jaar 2003 30% van de premie voor het algemeen deel van de AFUP;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel4a
  - number: 4a.2.d
    text: in het jaar 2004 40% van de premie voor het algemeen deel van de AFUP.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel4a
  - number: 4a.3
    text: |-
      Op de bezoldiging van de ambtenaar, bedoeld in
      [artikel 88, eerste lid, van het Besluit algemene rechtspositie politie][ref1], wordt in de periode voorafgaand aan
      de dag waarop zijn ontslag ingaat, een bedrag ingehouden dat gelijk is aan het gedeelte van de voor het algemeen
      deel van de AFUP verschuldigde pensioenpremie dat op hem verhaald zou zijn als hij deelnemer zou zijn geweest in
      het AFUP-opbouwreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
  - number: '5'
    text: |-
      De ambtenaar ontvangt geen bezoldiging over de tijd gedurende welke hij opzettelijk nalaat zijn dienst te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel5
  - number: '6.1'
    text: Voor de ambtenaar geldt een salarisschaal.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
  - number: '6.2'
    text: |-
      Voor de bepaling van de salarisschaal wordt de functie van de ambtenaar gewaardeerd en ingedeeld op grond van een
      bij regeling van Onze Minister vast te stellen systeem van functiewaardering.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
  - number: '6.3'
    text: |-
      Indien nog geen sprake is van volledige functievervulling, geldt voor de ambtenaar voor de duur van een jaar een
      lagere salarisschaal dan voor hem op grond van het tweede lid zou gelden. Het bevoegd gezag kan beslissen om de
      periode van een jaar tot twee jaar te verlengen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
  - number: '6.4'
    text: |-
      Indien de ambtenaar bij wijze van waarneming tijdelijk een andere functie uitoefent, blijft de voordien voor de
      ambtenaar geldende salarisschaal van toepassing.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
  - number: '6.5'
    text: |-
      Anders dan bij wijze van disciplinaire straf op grond van
      [hoofdstuk IX van het Besluit algemene rechtspositie politie][ref1], kan zonder voorafgaand ontslag, niet
      zijnde een ontslag dat de ambtenaar is verleend om een initiële opleiding te gaan volgen, voor een ambtenaar
      geen salarisschaal gaan gelden met een lager maximumsalaris dan dat van de reeds voor de ambtenaar geldende
      salarisschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        hoofdstuk: IX
  - number: '6.6'
    text: 'Het vijfde lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
  - number: 6.6.a
    text: |-
      bij de bepaling van de salarisschaal, bedoeld in het tweede lid, tevens is bepaald dat de functie van de ambtenaar
      een tijdelijk karakter heeft en de salarisschaal in verband daarmee slechts tijdelijk zal gelden;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
  - number: 6.6.b
    text: |-
      indien de ambtenaar in verband met ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte wordt herplaatst
      in een andere functie;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
  - number: 6.6.c
    text: |-
      het salaris van de ambtenaar na het succesvol afronden van de opleiding wordt vastgesteld, met toepassing van
      [artikel 3, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '3'
        hoofdstuk: '1'
  - number: 6.6.d
    text: |-
      indien de ambtenaar, die is aangewezen als herplaatsingkandidaat als bedoeld in
      [hoofdstuk VII.B van het Besluit algemene rechtspositie politie][ref1], wordt herplaatst in een andere functie.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#HoofdstukVII.b
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        hoofdstuk: VII.b
  - number: '6.7'
    text: |-
      De lagere salarisschaal op grond van het zesde lid, onderdeel d, gaat niet eerder voor de ambtenaar gelden dan vijf
      jaar nadat hij is herplaatst. Afhankelijk van het aantal dienstjaren van de ambtenaar wordt de termijn van vijf
      jaar verlengd overeenkomstig de hierna volgende tabel:






                    dienstjaren:


                    verlenging:






                    25 of meer dienstjaren


                    één jaar




                    30 of meer dienstjaren


                    twee jaren




                    35 of meer dienstjaren


                    drie jaren




                    40 of meer dienstjaren


                    vier jaren
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
  - number: '6.8'
    text: |-
      De ambtenaar kan bij het bevoegd gezag een aanvraag indienen om, indien de feitelijk opgedragen werkzaamheden
      gedurende langere tijd wezenlijk afwijken van zijn functie, de werkzaamheden en de functie met elkaar in
      overeenstemming te brengen. Het bevoegd gezag stelt regels vast over de behandeling van deze aanvraag.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
  - number: '6.9'
    text: |-
      Voor de ambtenaar die in het kader van een detachering, bedoeld in
      [artikel 62 van het Besluit algemene rechtspositie politie][ref1], tijdelijk een andere functie uitoefent waaraan
      op grond van [artikel 6, tweede lid][ref2], een hogere salarisschaal is verbonden, geldt deze hogere salarisschaal,
      tenzij [artikel 17b][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel17b
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: 17b
        hoofdstuk: '5'
  - number: '7.1'
    text: |-
      De ambtenaar die zich niet kan verenigen met de waardering van de voor hem geldende functie, bedoeld in
      [artikel 6, tweede lid][ref1], kan het bevoegd gezag verzoeken deze waardering in heroverweging te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
  - number: '7.2'
    text: Onze Minister stelt regels over de behandeling van het verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel7
  - number: '8.1'
    text: |-
      Bij de aanstelling wordt het salaris vastgesteld op het minimum van de voor de ambtenaar geldende salarisschaal van
      [bijlage I][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '8.2'
    text: |-
      Van het eerste lid kan worden afgeweken door het toekennen van een hoger salaris in de voor de ambtenaar geldende
      salarisschaal, indien daartoe naar het oordeel van het bevoegd gezag aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel8
  - number: '9.1'
    text: |-
      Het salaris van de ambtenaar wordt verhoogd tot het naasthogere bedrag in de schaal, indien deze naar het oordeel
      van het bevoegd gezag de functie naar behoren vervult.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel9
  - number: '9.2'
    text: |-
      Het salaris van de ambtenaar kan worden verhoogd tot een hoger bedrag in de schaal, indien deze naar het oordeel
      van het bevoegd gezag de functie zeer goed of uitstekend verricht.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel9
  - number: '9.3'
    text: |-
      Vervult de ambtenaar de functie naar het oordeel van het bevoegd gezag niet naar behoren, dan blijft de in het
      eerste lid bedoelde salarisverhoging achterwege.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel9
  - number: '9.4'
    text: |-
      De in het eerste en tweede lid bedoelde salarisverhoging wordt voor de eerste maal toegekend met ingang van de
      eerste dag van de maand waarin sinds de aanstelling een jaar is verstreken en nadien telkens na één jaar, tot het
      maximumsalaris van de geldende salarisschaal is bereikt.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel9
  - number: '9.5'
    text: |-
      Het tijdstip waarop ingevolge het vierde lid een salarisverhoging wordt toegekend, kan worden vervroegd ingeval
      daartoe naar het oordeel van het bevoegd gezag aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel9
  - number: '10.1'
    text: |-
      Ingeval van indeling in een schaal met een hoger maximumsalaris wordt, met inachtneming van [artikel 11][ref1],
      het salaris van de ambtenaar in de nieuwe schaal vastgesteld op het bedrag gelegen onmiddellijk boven het salaris
      dat de ambtenaar in de oude schaal heeft genoten dan wel zou hebben genoten. Indien de uit zodanige vaststelling
      voortvloeiende salarisverhoging minder zou bedragen dan een periodieke verhoging in de oude salarisschaal wordt het
      salaris vastgesteld op het naasthogere bedrag in de nieuwe salarisschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel11
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '11'
        hoofdstuk: '2'
  - number: '10.2'
    text: |-
      In bijzondere gevallen kan het salaris worden vastgesteld op een hoger bedrag in de voor de ambtenaar geldende
      salarisschaal.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel10
  - number: '11'
    text: |-
      Het salaris van de ambtenaar met een andere betrekking dan een volledige betrekking wordt vastgesteld op een
      evenredig deel van het salaris bij een volledige betrekking.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel11
  - number: '12'
    text: Bij bijzondere prestaties kan een gratificatie worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel12
  - number: '14.1'
    text: Aan de ambtenaar wordt een operationele toelage toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel14
  - number: '14.2'
    text: |-
      De operationele toelage wordt berekend per periode van vier weken en bedraagt voor elk uur waarop de ambtenaar
      werkelijke dienst verricht dan wel werkelijke dienst zou hebben verricht indien de ambtenaar niet binnen een
      tijdvak van vier dagen direct daaraan voorafgaande door het bevoegde gezag tot dienstverrichting op andere
      tijdstippen geroepen was:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel14
  - number: 14.2.a
    text: |-
      over uren in het tijdvak van maandag tot en met donderdag van 22.00 tot 07.00 uur en op zaterdag en zondag van
      07.00 tot 22.00 uur, € 3,82; en
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel14
  - number: 14.2.b
    text: over uren in het tijdvak van 22.00 tot 07.00 uur in de weekeindnachtdiensten, € 5,73.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel14
  - number: '14.3'
    text: |-
      Hetgeen in het tweede lid ten aanzien van het verrichten van dienst op zaterdag en zondag is bepaald, geldt mede
      voor het verrichten van dienst op de Nieuwjaarsdag, de tweede Paasdag, de Hemelvaartsdag, de tweede Pinksterdag, de
      beide Kerstdagen en de dag waarop de verjaardag van de Koning wordt gevierd.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel14
  - number: '14.4'
    text: |-
      De operationele toelage wordt in gevallen van zwangerschap en ziekte van de ambtenaar gesteld op het bedrag dat
      de ambtenaar in de drie perioden van vier weken, onmiddellijk voorafgaande aan de periode van vier weken waarin de
      ziekte is aangevangen, gemiddeld aan toelage op grond van dit artikel heeft genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel14
  - number: '15.1'
    text: |-
      Aan de ambtenaar wiens bezoldiging als gevolg van het buiten toedoen van de ambtenaar beëindigen of verminderen van
      de operationele toelage, bedoeld in [artikel 14][ref1] een blijvende verlaging ondergaat die tenminste 3% bedraagt
      van het salaris, wordt een aflopende toelage toegekend, mits de ambtenaar eerstbedoelde toelage direct voorafgaande
      aan het tijdstip van deze beëindiging of vermindering ervan, gedurende ten minste twee jaren zonder wezenlijke
      onderbreking heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel14
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
  - number: '15.2'
    text: |-
      In afwijking van het eerste lid wordt aan de ambtenaar van 55 jaar of ouder wiens bezoldiging als gevolg
      van het buiten toedoen van de ambtenaar beëindigen of verminderen van de operationele toelage, bedoeld in
      [artikel 14][ref1], een blijvende verlaging ondergaat, een blijvende toelage toegekend, mits de ambtenaar
      eerstbedoelde toelage direct voorafgaande aan het tijdstip van deze beëindiging of vermindering ervan, gedurende
      tenminste tien jaren zonder wezenlijke onderbreking heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel14
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
  - number: '15.3'
    text: |-
      De in het eerste lid bedoelde aflopende toelage gaat, wanneer de ambtenaar de leeftijd van 55 jaar bereikt en
      onmiddellijk vóór de aanvang van die toelage gedurende tenminste tien jaren zonder onderbreking de operationele
      toelage, bedoeld in [artikel 14][ref1] heeft genoten, over in een blijvende toelage als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel14
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
  - number: '15.4'
    text: |-
      Voor de toepassing van dit artikel wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      twee maanden.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel15
  - number: '15.5'
    text: |-
      Voor de ambtenaar die is aangesteld voor de uitvoering van technische, administratieve en andere
      taken ten dienste van de politie en geen deelnemer is zoals bedoeld in artikel B.3, tweede
      lid, van het AFUP-opbouwreglement dan wel geen ambtenaar is als bedoeld in de eerste volzin van
      [artikel 88, eerste lid, van het Besluit algemene rechtspositie politie][ref1], wordt in het tweede en derde lid
      van dit artikel in plaats van «55 jaar» telkens gelezen: 60 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
  - number: '15.6'
    text: Onze Minister stelt nadere regels vast over de berekeningswijze van de toelage.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel15
  - number: '16.1'
    text: |-
      Indien naar het oordeel van het bevoegd gezag sprake is van zeer goede of uitstekende vervulling van de functie
      kan voor de duur van een jaar een toelage worden toegekend aan de ambtenaar die het maximumsalaris van de voor hem
      geldende salarisschaal heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel16
  - number: '16.2'
    text: |-
      Indien naar het oordeel van het bevoegd gezag sprake is van zeer goede of uitstekende vervulling van de functie en
      daartoe op grond van bijzondere omstandigheden aanleiding bestaat, kan een toelage voor een langere duur dan een
      jaar worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel16
  - number: '16.3'
    text: De toelage bedraagt voor de ambtenaar
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel16
  - number: 16.3.a
    text: |-
      ingedeeld in schaal 1 tot en met 9 van [bijlage I van dit besluit][ref1]: ten hoogste 6% van het voor de ambtenaar
      geldende maximumsalaris;


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 16.3.b
    text: |-
      ingedeeld in schaal 10, 11, 12 of 13 van [bijlage I van dit besluit][ref1]: ten hoogste 9% van het voor de
      ambtenaar geldende maximumsalaris;


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 16.3.c
    text: |-
      ingedeeld in schaal 14 of 15 van [bijlage I van dit besluit][ref1]: ten hoogste 12% van het voor de ambtenaar
      geldende maximumsalaris;


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 16.3.d
    text: |-
      ingedeeld in schaal 16, 17 of 18 van [bijlage I van dit besluit][ref1]: ten hoogste 15% van het voor de ambtenaar
      geldende maximumsalaris.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '17.1'
    text: |-
      Aan de ambtenaar die bij wijze van waarneming tijdelijk een functie uitoefent die bij toepassing van
      [artikel 6, tweede lid][ref1], zou leiden tot een salarisschaal met een hoger maximumsalaris, kan voor de duur van
      die waarneming een toelage worden toegekend. Onder waarneming wordt verstaan het krachtens een daartoe strekkende
      aanwijzing van het bevoegd gezag tijdelijk verrichten van een samenstel van werkzaamheden dat een andere functie
      vormt dan die van de ambtenaar zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
  - number: '17.2'
    text: |-
      De toelage wordt, tenzij bijzondere omstandigheden aanwezig zijn, slechts toegekend wanneer de waarneming een
      tijdvak van ten minste dertig dagen heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel17
  - number: '17.3'
    text: |-
      Bij volledige waarneming van de functie, bedoeld in het eerste lid, is het bedrag van de toelage gelijk aan het
      verschil tussen het salaris dat de ambtenaar geniet en het salaris dat de ambtenaar zou genieten, wanneer de
      salarisschaal met het hogere maximumsalaris met ingang van de dag waarop de waarneming is begonnen, voor hem zou
      hebben gegolden. Onder volledige waarneming wordt verstaan een zodanige waarneming dat in plaats van de eigen
      functie het volledige samenstel van werkzaamheden van de waargenomen functie, met de daarmee gepaard gaande
      verantwoordelijkheden, wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel17
  - number: '17.4'
    text: |-
      Voor de toepassing van het derde lid wordt onder salaris mede verstaan de toelagen, bedoeld in de
      [artikelen 14][ref1], [15][ref2], [18][ref3] en [20][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel20
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '15'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '18'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '20'
        hoofdstuk: '5'
  - number: '17.5'
    text: |-
      Bij niet volledige waarneming wordt de toelage, afhankelijk van de mate van onvolledigheid van de waarneming,
      vastgesteld op 50% of 75% van de toelage bij volledige waarneming.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel17
  - number: '17.6'
    text: |-
      De ambtenaar voor wie het een onderdeel is van de eigen functie om als plaatsvervanger op te treden van degene
      wiens functie moet worden waargenomen, komt bij niet volledige waarneming van die functie niet in aanmerking voor
      een toelage.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel17
  - number: 17a.1
    text: |-
      Indien het salaris behorend bij een volledige werktijd minder is dan het maandbedrag van het minimumloon, dat
      krachtens de [artikelen 7][ref1], [8][ref2] en [14 van de Wet minimumloon en minimumvakantiebijslag][ref3] geldt
      voor werknemers van dezelfde leeftijd als de ambtenaar, wordt deze een toelage toegekend ten bedrage van het
      verschil.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '14'
  - number: 17a.2
    text: |-
      Voor de ambtenaar met een andere betrekking dan een volledige betrekking, wordt de toelage als bedoeld in het
      eerste lid naar evenredigheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel17a
  - number: '18.1'
    text: |-
      Aan de ambtenaar aan wie consignatie wordt opgelegd, wordt, behoudens het derde lid, een toelage toegekend. Onder
      consignatie wordt verstaan het zich in opdracht van het daartoe bevoegde gezag bereikbaar en beschikbaar houden
      teneinde bij oproep dienst te gaan verrichten. Consignatie wordt slechts opgedragen boven de voor de ambtenaar
      krachtens [artikel 12 van het Besluit algemene rechtspositie politie][ref1] vastgestelde diensttijden.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel12
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '12'
  - number: '18.2'
    text: |-
      Consignatie kan niet worden opgedragen boven een door het bevoegd gezag of een door deze daartoe aangewezen
      ambtenaar vast te stellen aantal uren per jaar, met dien verstande dat dit maximum niet geldt voor de
      ambtenaar die het overleg met de Regionale Commissie, de Commissie Korps landelijke politiediensten,
      de Commissie bijzondere ambtenaren van politie, de Commissie LSOP of een Commissie voorziening tot
      samenwerking, bedoeld in de [artikelen 12][ref1], [21][ref2], [22][ref3], [22a][ref4] onderscheidenlijk
      [22b van het Besluit overleg en medezeggenschap politie][ref5], pleegt.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006518#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0006518#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0006518#Artikel22a
      [ref5]: https://wetten.overheid.nl/BWBR0006518#Artikel22b
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0006518
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0006518
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0006518
        artikel: 22a
      - id: ref5
        bwb_id: BWBR0006518
        artikel: 22b
  - number: '18.3'
    text: |-
      Voor consignatie gedurende een tijdvak van korter dan een half uur boven de voor de ambtenaar vastgestelde
      dagelijkse diensttijd wordt geen toelage toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel18
  - number: '18.4'
    text: De toelage voor consignatie bedraagt € 1,00 voor elk uur dat de ambtenaar consignatie is opgelegd.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel18
  - number: '18.5'
    text: |-
      De in het vierde lid genoemde toelage wordt zo spoedig mogelijk uitbetaald, doch uiterlijk bij gelegenheid van de
      tweede salarisbetaling volgende op de periode van vier weken waarin consignatie is verricht.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel18
  - number: '18.6'
    text: |-
      Van de in het vijfde lid gestelde termijn kan worden afgeweken indien het dienstbelang dat vereist of, indien het
      dienstbelang zich daartegen niet verzet, op verzoek van de ambtenaar. Voor de hier bedoelde gevallen wordt een
      nieuwe uiterste termijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel18
  - number: '18.7'
    text: |-
      Indien een ambtenaar aan wie consignatie is opgelegd, binnen het tijdvak van consignatie werkzaamheden moet
      verrichten, is voor de duur van die werkzaamheden sprake van het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel18
  - number: '18.8'
    text: |-
      Voor de toepassing van dit artikel worden gedeelten van uren, voorzover daarmee het half uur, bedoeld in het derde
      lid, wordt overschreden, berekend over een periode van vier weken, opgeteld en naar boven afgerond op halve uren.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel18
  - number: '18.9'
    text: |-
      De toelage voor consignatie wordt in geval van ziekte van de ambtenaar gesteld op het bedrag dat de ambtenaar
      in de drie perioden van vier weken, onmiddellijk voorafgaande aan de periode van vier weken waarin de ziekte is
      aangevangen, gemiddeld aan toelage op grond van dit artikel heeft genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel18
  - number: '18.10'
    text: |-
      Voor de toepassing van dit artikel berust het oordeel omtrent het dienstbelang bij het bevoegd gezag dan wel bij de
      door deze aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel18
  - number: '19'
    text: |-
      Aan de ambtenaar kan een toelage worden toegekend om reden van werving of behoud tot een maximum van € 45 400,-
      per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel19
  - number: '20'
    text: |-
      Aan de ambtenaar kan als tegemoetkoming in de representatiekosten een toelage worden toegekend tot een maximum van
      5% van het salaris.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel20
  - number: '21.1'
    text: |-
      In uitzonderlijke gevallen kan aan de ambtenaar of aan een groep van ambtenaren een toelage worden toegekend op
      andere gronden dan die vermeld in de [artikelen 16 tot en met 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel16
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '16'
        hoofdstuk: '5'
  - number: '21.2'
    text: |-
      Een in het eerste lid bedoelde toelage kan aan de ambtenaar worden toegekend nadat Onze Minister ter zake nadere
      regels heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel21
  - number: '22'
    text: |-
      Een krachtens [artikel 16][ref1], [19][ref2] of [21][ref3] toegekende toelage wordt ingetrokken, indien de
      gronden waarop de toelage wordt toegekend niet meer aanwezig zijn, tenzij het bevoegd gezag van oordeel is dat er
      omstandigheden zijn om de toelage geheel of gedeeltelijk te handhaven.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel21
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '16'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '19'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '21'
        hoofdstuk: '5'
  - number: '23.1'
    text: De ambtenaar heeft recht op een vakantie-uitkering die 8% van de genoten bezoldiging bedraagt.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel23
  - number: '23.2'
    text: |-
      De vakantie-uitkering bedraagt ten minste € 130,68 per maand, met dien verstande dat dit bedrag naar evenredigheid
      wordt verminderd indien:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel23
  - number: 23.2.a
    text: |-
      de bezoldiging van de ambtenaar niet op de eerste dag van een maand aanvangt, dan wel indien de ambtenaar in een
      deel van een maand geen bezoldiging heeft genoten;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel23
  - number: 23.2.b
    text: |-
      de ambtenaar in de loop van een maand slechts een gedeelte van zijn bezoldiging heeft genoten wegens verleend
      verlof, in verband met non-activiteit, bij wijze van disciplinaire straf of uit hoofde van schorsing.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel23
  - number: '23.3'
    text: |-
      Het in het tweede lid genoemde bedrag wordt voor de ambtenaar met een andere betrekking dan een volledige
      betrekking naar evenredigheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel23
  - number: '23.4'
    text: |-
      Voor de toepassing van het eerste lid wordt de ambtenaar geacht in het genot van de volle bezoldiging te zijn,
      indien hij
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel23
  - number: 23.4.a
    text: |-
      niet zijn volledige bezoldiging geniet op grond van de artikelen [13a][ref1], [28b][ref2] en
      [41 van het Besluit algemene rechtspositie politie][ref3] of op grond van de [artikelen 32 tot en met 37][ref4]
      en [38][ref5],


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13a
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 28b
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '41'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '32'
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: 23.4.b
    text: |-
      een uitkering op grond van de [Wet arbeid en zorg][ref1] ontvangt,


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 23.4.c
    text: |-
      een aanvulling op zijn ZW-uitkering geniet op grond van [artikel 39a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel39a
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 39a
        hoofdstuk: '10'
  - number: 23.4.d
    text: |-
      niet zijn volledige salaris geniet vanwege een inhouding op dat salaris op grond van de
      [Regeling verlofsparen politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015806
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0015806
  - number: '23.5'
    text: |-
      De ambtenaar, bedoeld in [artikel 33][ref1], geniet de vakantie-uitkering slechts voor zoveel die uitgaat boven de
      vakantie-uitkering waarop hij als militair aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel33
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '33'
        hoofdstuk: '9'
  - number: '24'
    text: |-
      [Artikel 23][ref1] is mede van toepassing op de gewezen ambtenaar die ingevolge [artikel 42][ref2] nog bezoldiging
      geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel42
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '23'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '42'
        hoofdstuk: '10'
  - number: '25.1'
    text: |-
      De vakantie-uitkering wordt eenmaal per jaar betaald over de periode van twaalf maanden die is aangevangen met de
      maand juni van het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25
  - number: '25.2'
    text: |-
      Bij ontslag van de ambtenaar vindt betaling plaats over het tijdvak, gelegen tussen het einde van de laatst
      verstreken periode waarover de vakantie-uitkering is betaald en de datum van het ontslag.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25
  - number: '25.3'
    text: |-
      Voor de toepassing van dit artikel wordt met het ontslag van de ambtenaar gelijkgesteld de beëindiging van de
      doorbetaling van de bezoldiging van de gewezen ambtenaar, bedoeld in [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel24
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '24'
        hoofdstuk: '6'
  - number: 25a.1
    text: Aan de ambtenaar kan een incidentele eindejaarsuitkering of een eenmalige uitkering worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25a
  - number: 25a.2
    text: |-
      Ten aanzien van de incidentele eindejaarsuitkering of eenmalige uitkering, bedoeld in het eerste lid, stelt Onze
      Minister nadere regels vast met betrekking tot de hoogte van de uitkering en het tijdstip van uitbetaling, en
      bepaalt Onze Minister of de uitkering behoort tot de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25a
  - number: 25b.1
    text: |-
      De ambtenaar heeft recht op een eindejaarsuitkering ten bedrage van 8% van het door hem in dat jaar genoten
      salaris.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
  - number: 25b.2
    text: |-
      De eindejaarsuitkering bedraagt tenminste € 130,68 per maand met dien verstande dat dit bedrag naar evenredigheid
      wordt verminderd indien:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
  - number: 25b.2.a
    text: |-
      het salaris van de ambtenaar niet op de eerste dag van een maand is aangevangen, dan wel indien de ambtenaar een
      deel van een maand geen salaris heeft genoten;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
  - number: 25b.2.b
    text: de ambtenaar in de loop van een maand slechts een gedeelte van zijn salaris heeft genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
  - number: 25b.3
    text: |-
      Het in het tweede lid genoemde bedrag wordt voor de ambtenaar met een andere betrekking dan een volledige
      betrekking naar evenredigheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
  - number: 25b.4
    text: 'In afwijking van het eerste en tweede lid heeft de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
  - number: 25b.4.a
    text: |-
      in het jaar 2001 recht op een eindejaarsuitkering ter grootte van 2,50% van het door hem in dat jaar genoten
      salaris;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
  - number: 25b.4.b
    text: |-
      in het jaar 2002 recht op een eindejaarsuitkering ter grootte van 5,25% van het door hem in dat jaar genoten
      salaris, doch ten minste € 81,40 per maand gedurende de eerste helft van dat jaar en ten minste € 82,21 per maand
      gedurende de tweede helft van dat jaar, met dien verstande dat dit bedrag overeenkomstig het tweede en derde lid
      naar evenredigheid wordt verminderd.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
  - number: 25b.5
    text: |-
      Indien de ambtenaar recht heeft op een uitkering op grond van de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2]
      of de [Wet op de arbeidsongeschiktheidsverzekering][ref3], wordt voor de toepassing van dit artikel het salaris in
      acht genomen zoals dit zou zijn genoten indien geen sprake zou zijn geweest van recht op een uitkering op grond van
      de [Ziektewet][ref4], de [Wet arbeid en zorg][ref5] of de [Wet op de arbeidsongeschiktheidsverzekering][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0001888
      [ref5]: https://wetten.overheid.nl/BWBR0013008
      [ref6]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0001888
      - id: ref5
        bwb_id: BWBR0013008
      - id: ref6
        bwb_id: BWBR0002524
  - number: 25b.6
    text: |-
      Indien de ambtenaar vanwege een inhouding op grond van de [Regeling verlofsparen politie][ref1] niet zijn volledige
      salaris geniet, wordt voor de toepassing van dit artikel het salaris in aanmerking genomen zoals dit zou zijn
      genoten indien geen sprake zou zijn geweest van een inhouding op het salaris vanwege die regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0015806
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0015806
  - number: 25b.7
    text: |-
      Indien voor de ambtenaar het feitelijke genot van de bezoldiging is teruggebracht tot het bedrag van het op de
      ambtenaar te verhalen gedeelte van de pensioenbijdrage, wordt hij voor de toepassing van dit artikel geacht geen
      salaris te genieten.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
  - number: 25b.8
    text: De eindejaarsuitkering wordt eenmaal per kalenderjaar in de maand december betaald.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
  - number: 25b.9
    text: |-
      Bij ontslag van de ambtenaar vindt betaling plaats conform het bepaalde in het tweede en zesde lid over het tijdvak
      gelegen tussen het einde van de laatste verstreken periode waarover de eindejaarsuitkering is betaald en de datum
      van het ontslag.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel25b
  - number: '26.1'
    text: |-
      Aan de ambtenaar kan een uitkering worden toegekend om redenen van werving of behoud tot een maximum van € 45 400,-
      per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel26
  - number: '26.2'
    text: De uitkering wordt toegekend aan het einde van een tijdvak dat tevoren is vastgesteld door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel26
  - number: '26.3'
    text: Aan de toekenning van de uitkering kunnen door het bevoegd gezag voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel26
  - number: '26.4'
    text: |-
      Aan de ambtenaar die niet heeft kunnen voldoen aan de in het derde lid bedoelde voorwaarden door een naar het
      oordeel van het bevoegd gezag niet aan de ambtenaar zelf te wijten oorzaak, kan de uitkering gedeeltelijk worden
      toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel26
  - number: '27.1'
    text: |-
      Aan de ambtenaar die is ingedeeld in een salarisschaal waarvan het maximumsalaris lager is dan het maximumsalaris
      van salarisschaal 13 van [bijlage I van dit besluit][ref1] en die overwerk verricht, wordt, behoudens het zesde
      lid, een vergoeding toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '27.2'
    text: |-
      Het bevoegd gezag kan bij nader vast te stellen regels voor andere situaties dan de situatie genoemd in het
      eerste lid, aan de ambtenaar die is ingedeeld in een salarisschaal waarvan het maximumsalaris lager is dan het
      maximumsalaris van salarisschaal 15, een vergoeding voor overwerk toekennen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.3'
    text: |-
      Onder overwerk wordt verstaan dienst in opdracht van het daartoe bevoegde gezag buiten de voor de ambtenaar
      krachtens [artikel 12 van het Besluit algemene rechtspositie politie][ref1] vastgestelde arbeidstijden, voorzover
      daardoor de per dienstdag vastgestelde totale arbeidstijd wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel12
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '12'
  - number: '27.4'
    text: |-
      Overwerk kan niet worden opgedragen boven een door het bevoegd gezag of een door deze aangewezen ambtenaar, vast te
      stellen aantal uren per jaar.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.5'
    text: |-
      Het opdragen van overwerk mag niet tot gevolg hebben dat de ambtenaar per periode van vier weken minder dan vier
      vrije dagen en per kalenderjaar minder dan dertien vrije zondagen, waarvan elf aansluitend aan een vrije dag,
      geniet.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.6'
    text: |-
      Voor overwerk dat gedurende korter dan een half uur aansluitend aan de vastgestelde dagelijkse arbeidstijd wordt
      verricht, wordt geen vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.7'
    text: |-
      Overwerk wordt naar de keuze van het bevoegd gezag vergolden door middel van een bedrag in geld dan wel door
      middel van verlof of door middel van een combinatie van een bedrag in geld en verlof. Bij de keuze van de vorm van
      vergoeding wordt zoveel mogelijk rekening gehouden met de wensen van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.8'
    text: |-
      De vergoeding voor elk uur overwerk is een bedrag in geld ter grootte van het salaris per uur van de ambtenaar dan
      wel verlof voor de duur van één uur, vermeerderd met € 6,00 dan wel verlof voor de duur van een half uur, bij wijze
      van toeslag.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.9'
    text: |-
      De in het achtste lid genoemde vergoeding door middel van een bedrag in geld wordt zo spoedig mogelijk uitbetaald,
      doch uiterlijk bij gelegenheid van de tweede salarisbetaling volgende op de periode van vier weken waarin het
      overwerk is verricht. De vergoeding is niet pensioengevend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.10'
    text: |-
      In geval vergoeding van overwerk plaatsvindt door middel van verlof, wordt het verlof zo spoedig mogelijk verleend,
      doch uiterlijk in de periode van vier weken waarin de in het negende lid bedoelde salarisbetaling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.11'
    text: |-
      Van de in het negende en tiende lid gestelde termijnen kan worden afgeweken indien het dienstbelang dat vereist
      of, indien het dienstbelang zich daartegen niet verzet, op verzoek van de ambtenaar. Voor de hier bedoelde gevallen
      wordt een nieuwe uiterste termijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.12'
    text: |-
      De tijdstippen waarop het verlof, bedoeld in het achtste lid, wordt verleend, worden zo tijdig mogelijk
      vastgesteld, waarbij zoveel mogelijk rekening gehouden wordt met de wensen van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.13'
    text: |-
      Het verlof, bedoeld in het achtste lid, dat aan het einde van een kalenderjaar niet is verleend, wordt naar wens
      van de ambtenaar bij gelegenheid van de eerste salarisbetaling in het daarop volgende kalenderjaar uitbetaald als
      vergoeding, bedoeld in het achtste lid, dan wel toegevoegd aan het spaarverlof, bedoeld in de Regeling verlofsparen
      politie.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.14'
    text: |-
      Voor de toepassing van dit artikel worden gedeelten van uren, voor zover daarmee het half uur, bedoeld in het zesde
      lid, wordt overschreden, berekend over een periode van vier weken, opgeteld en naar boven afgerond op halve uren.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: '27.15'
    text: |-
      Voor de bepaling van de duur van de overschrijding van de per dienstdag vastgestelde totale arbeidstijd gelden uren
      waarop krachtens het [Besluit algemene rechtspositie politie][ref1] vakantie of verlof is genoten dan wel wegens
      ziekte of schorsing geen dienst is verricht, als uren waarop feitelijk dienst is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006516
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006516
  - number: '27.16'
    text: |-
      Voor de toepassing van dit artikel berust het oordeel omtrent het dienstbelang bij het bevoegd gezag dan wel bij de
      door deze aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27
  - number: 27a.1
    text: |-
      Indien de ambtenaar dienst verricht op aan hem volgens het dagrooster verleende vakantie-uren, wordt hem een
      vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27a
  - number: 27a.2
    text: |-
      De vergoeding, bedoeld in het eerste lid, is gelijk aan de toeslag als bedoeld in [artikel 27, achtste lid][ref1].
      De vergoeding voor delen van een uur wordt vastgesteld op een evenredig deel van de toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel27
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
  - number: 27a.3
    text: De vergoeding die is uitgekeerd in geld, is niet pensioengevend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel27a
  - number: '28'
    text: |-
      Onze Minister stelt regels vast terzake van een maaltijdvergoeding bij overwerk, voor zover de ambtenaar ingevolge
      het [Besluit vergoeding dienstreizen politie][ref1] ter zake geen aanspraak op vergoedingen voor maaltijden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006519
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006519
  - number: '29.1'
    text: |-
      Aan de ambtenaar die is ingedeeld in een salarisschaal waarvan het maximumsalaris lager is dan het maximumsalaris
      van salarisschaal 12 van [bijlage I van dit besluit][ref1] en die daadwerkelijk wordt ingezet als lid van een
      mobiele eenheid ter handhaving van de openbare orde wordt een vergoeding toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '29.2'
    text: |-
      Het tijdvak gedurende hetwelk de ambtenaar is ingezet, blijft voor de toepassing van de
      [artikelen 18, tweede lid][ref1], en [27, vierde lid][ref2], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel27
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '18'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
  - number: '29.3'
    text: De vergoeding bedraagt € 26,86 per kalenderdag.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29
  - number: '29.4'
    text: |-
      Het bevoegd gezag kan regels stellen met betrekking tot het toekennen van de vergoeding aan ambtenaren die geen lid
      zijn van een mobiele eenheid.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29
  - number: 29a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29a
  - number: 29a.a
    text: |-
      betrokkene: de ambtenaar aan wie op grond van [artikel 13b van het Besluit algemene rechtspositie politie][ref1]
      non-activiteit is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13b
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13b
  - number: 29a.b
    text: |-
      berekeningsbasis: de bezoldiging in de zin van dit besluit, vermeerderd met de vakantie-uitkering en de uitkering,
      bedoeld in [artikel 25b][ref1] berekend over een maand, waarop de betrokkene op de dag voorafgaand aan de non-
      activiteit aanspraak had of bij waarneming van zijn functie zou hebben gehad;


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel25b
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 25b
        hoofdstuk: '7'
  - number: 29a.c
    text: 'non-activiteitsinkomen: de vanwege de non-activiteit verminderde bezoldiging;'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29a
  - number: 29a.d
    text: |-
      Reglement FPU: het Reglement flexibel pensioen en uittreden ter zake van basisuitkering en aanvullende uitkering,
      als bedoeld in artikel 6, tweede lid, van de Centrale vut-overeenkomst overheids- en onderwijspersoneel.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29a
  - number: 29b.1
    text: |-
      Indien de door een betrokkene over de laatste aan de non-activiteit voorafgaande twaalf volle kalendermaanden
      genoten bezoldiging geheel of gedeeltelijk uit wisselende inkomsten bestond, wordt in zoverre in afwijking van
      [artikel 29a, onderdeel b][ref1], als berekeningsbasis aangemerkt, het gemiddelde van die wisselende inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel29a
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 29a
        hoofdstuk: 8a
  - number: 29b.2
    text: |-
      In afwijking van het eerste lid worden, indien de periode van non-activiteit direct vooraf wordt gegaan door een
      periode waarin vakantie of verlof wordt genoten, de twaalf volle kalendermaanden waarin de bezoldiging geheel of
      gedeeltelijk uit wisselende inkomsten bestond, gerekend vanaf de dag voorafgaand aan de vakantie of verlof.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29b
  - number: 29b.3
    text: De berekeningsbasis wordt aangepast overeenkomstig een algemene salarismaatregel in de sector Politie.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29b
  - number: 29c.1
    text: Gedurende de periode van non-activiteit vindt een vermindering plaats op de berekeningsbasis van 20%.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29c
  - number: 29c.2
    text: |-
      De in het eerste lid genoemde vermindering van de berekeningsbasis wordt aangemerkt als het niet volledig
      in het genot zijn van het inkomen vanwege verlof zoals bedoeld in artikel 3, eerste lid, onderdeel 4 van het
      pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29c
  - number: 29d.1
    text: |-
      De inkomsten die de betrokkene geniet of gaat genieten uit of in verband met arbeid of bedrijf, aangevangen met
      ingang van de dag waarop de periode van non-activiteit is ingegaan, worden in mindering gebracht op het non-
      activiteitsinkomen tenzij de betrokkene aannemelijk maakt dat die inkomsten, dan wel een gedeelte daarvan geen
      verband houden met verhoogde werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29d
  - number: 29d.2
    text: |-
      De in het eerste lid bedoelde vermindering is gelijk aan het bedrag waarmee het onverminderde non-
      activiteitsinkomen vermeerderd met het totaal bedrag van de inkomsten bedoeld in het eerste lid tezamen de
      berekeningsgrondslag te boven gaat.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29d
  - number: 29d.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van inkomsten uit of in verband met arbeid of bedrijf
      aangevangen gedurende de vakantie of het verlof onmiddellijk voorafgaande aan de periode van non-activiteit, met
      dien verstande dat de gedurende de periode van vakantie of verlof genoten inkomsten uit of in verband met arbeid of
      bedrijf niet in mindering worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29d
  - number: 29d.4
    text: |-
      Inkomsten uit arbeid of bedrijf als bedoeld in het eerste lid die geacht worden op één maand betrekking te hebben
      of geacht kunnen worden te hebben, worden in mindering gebracht op het non-activiteitsinkomen over die maand.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29d
  - number: 29e.1
    text: |-
      De betrokkene is verplicht vanaf het moment waarop de periode van non-activiteit is ingegaan, opgave te doen van de
      inkomsten, bedoeld in [artikel 29d, eerste en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel29d
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 29d
        hoofdstuk: 8a
  - number: 29e.2
    text: |-
      Indien de inkomsten niet vooraf kunnen worden vastgesteld, doet de betrokkene maandelijks, voorafgaand aan de
      betaling van het non-activiteitsinkomen, opgave van de inkomsten die hij sinds de vorige opgave heeft genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29e
  - number: 29e.3
    text: |-
      Indien de inkomsten slechts over een langere termijn kunnen worden vastgesteld, doet de betrokkene
      dienovereenkomstig opgave en wordt de berekeningsbasis met een voorlopig vastgesteld bedrag verminderd. Na afloop
      van de desbetreffende termijn zullen de daadwerkelijke inkomsten worden verrekend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29e
  - number: 29e.4
    text: |-
      Het bevoegd gezag kan nadere voorschriften geven met betrekking tot de wijze van opgave van de inkomsten door de
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29e
  - number: 29e.5
    text: |-
      De betrokkene stemt er, door het aanvaarden van de non-activiteit, mee in dat allen die daarvoor naar het oordeel
      van het bevoegde gezag in aanmerking komen, omtrent zijn omstandigheden alle inlichtingen geven welke voor de
      uitvoering van dit hoofdstuk noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29e
  - number: 29f.1
    text: |-
      Indien de betrokkene ongeschikt is tot het verrichten van arbeid wegens ziekte, is hij verplicht daarvan terstond
      mededeling te doen aan het bevoegde gezag. De betrokkene is eveneens verplicht zijn herstel terstond te melden.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29f
  - number: 29f.2
    text: |-
      Indien de betrokkene ongeschikt is tot het verrichten van arbeid wegens ziekte, kan hij door het bevoegde gezag
      worden verplicht zich geneeskundig te doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29f
  - number: 29f.3
    text: |-
      Indien de betrokkene ongeschikt is tot het verrichten van arbeid wegens ziekte blijft de korting op de
      berekeningsbasis, bedoeld in [artikel 29c, eerste lid][ref1], onverminderd van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel29c
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 29c
        hoofdstuk: 8a
  - number: 29f.4
    text: |-
      Indien ongeschiktheid tot het verrichten van arbeid wegens ziekte aanvangt binnen een maand na het tijdstip
      waarop de periode van non-activiteit is ingegaan, vindt in afwijking van het derde lid, de eerste 52 weken van
      deze ongeschiktheid de vermindering van de berekeningsbasis, bedoeld in [artikel 29c][ref1]; eerste lid, plaats
      overeenkomstig de volgende tabel:


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel29c
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 29c
        hoofdstuk: 8a
  - number: 29f.4.1
    text: de eerste 26 weken geen vermindering op de berekeningsbasis;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29f
  - number: 29f.4.2
    text: de tweede 26 weken een vermindering van 10% op de berekeningsbasis.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29f
  - number: 29f.5
    text: |-
      Indien de periode van non-activiteit direct vooraf wordt gegaan door een periode waarin vakantie of verlof wordt
      genoten, is het derde en vierde lid van overeenkomstige toepassing, met dien verstande dat de vermindering van de
      bezoldiging niet plaatsvindt zolang vakantie of verlof wordt genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29f
  - number: 29g.1
    text: 'Het recht op betaling van het non-activiteitsinkomen eindigt:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29g
  - number: 29g.1.a
    text: met ingang van de dag waarop de betrokkene recht verkrijgt op een WAO-uitkering;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29g
  - number: 29g.1.b
    text: met ingang van de dag volgende op die waarop de betrokkene is overleden;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29g
  - number: 29g.1.c
    text: |-
      met ingang van de eerste dag van de maand volgende op die waarin de betrokkene de leeftijd van 60 jaar heeft
      bereikt;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29g
  - number: 29g.1.d
    text: |-
      met ingang van de eerste dag van de maand volgende op die waarin de betrokkene, voor het bereiken van de leeftijd
      van 60 jaar, ontslag is verleend met het oog op een uitkering krachtens het Reglement FPU;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29g
  - number: 29g.1.e
    text: met ingang van de dag volgende op die waarop de betrokkene op andere gronden wordt ontslagen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29g
  - number: 29g.2
    text: |-
      Het recht op betaling van het non-activiteitsinkomen kan geheel of ten dele vervallen worden verklaard, indien
      betrokkene weigert mee te werken aan een onderzoek tot vaststelling van zijn arbeidsongeschiktheid ter verkrijging
      van een WAO-uitkering.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29g
  - number: 29h.1
    text: |-
      Indien de aan de betrokkene toegekende WAO-uitkering, eventueel vermeerderd met een invaliditeitspensioen, lager
      is dan het non-activiteitsinkomen indien geen sprake zou zijn van arbeidsongeschiktheid, wordt hem het verschil bij
      wijze van toelage uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29h
  - number: 29h.2
    text: |-
      De betrokkene die na afloop van de periode van 52 weken, bedoeld in
      [artikel 19 van de Wet op de arbeidsongeschiktheidsverzekering][ref1], geen WAO-uitkering aanvraagt, wordt voor
      de toepassing van dit hoofdstuk behandeld alsof hem een WAO-uitkering is toegekend berekend naar een mate van
      arbeidsongeschiktheid van 80% of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29h
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 29h.3
    text: |-
      Indien de WAO-uitkering van de betrokkene die terzake van dezelfde dienstverhouding non-activiteit geniet en recht
      heeft op een WAO-uitkering, als gevolg van handelen of nalaten een vermindering ondergaat, of het recht daarop
      geheel of gedeeltelijk wordt geweigerd, wordt bedoelde WAO-uitkering voor de toepassing van dit hoofdstuk geacht
      onverminderd te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29h
  - number: 29i.1
    text: |-
      Ten aanzien van de betrokkene die na zijn ontslag uit hoofde van ziekte of arbeidsongeschiktheid nog aanspraken
      in verband met de betrekking op grond waarvan de non-activiteit is verleend, heeft of krijgt, wordt het non-
      activiteitsinkomen dan wel de toelage, bedoeld in [artikel 29h][ref1], tot het einde van de periode waarover die
      aanspraken bestaan, verminderd met het bedrag daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel29h
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29i
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 29h
        hoofdstuk: 8a
  - number: 29i.2
    text: |-
      Ten aanzien van de betrokkene die na zijn herplaatsing of ontslag uit hoofde van ziekte of arbeidsongeschiktheid
      aanspraken in verband met de betrekking op grond waarvan de non-activiteit is verleend, verliest, wordt de
      berekeningsbasis tot het einde van de periode waarover die aanspraken bestaan, vermeerderd met het bedrag daarvan.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29i
  - number: 29j
    text: |-
      Indien de betrokkene de gegevens die noodzakelijk zijn voor het verminderen van het non-activiteitsinkomen niet,
      niet volledig of onjuist verstrekt, kan worden bepaald dat het non-activiteitsinkomen, zolang zulks het geval is,
      niet of slechts gedeeltelijk wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29j
  - number: 29k.1
    text: Het non-activiteitsinkomen, over een maand berekend, wordt in maandelijkse termijnen betaald.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29k
  - number: 29k.2
    text: |-
      Zo spoedig mogelijk na het overlijden van de betrokkene, wordt aan de weduwe of weduwnaar, van wie de overledene
      niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan de berekeningsbasis over een tijdvak van drie
      maanden. Als maatstaf bij de berekening van dit bedrag geldt, behoudens het hierna bepaalde, de berekeningsbasis
      waar het non-activiteitsinkomen op de dag van het overlijden van was afgeleid. Wordt op het non-activiteitsinkomen
      een vermindering toegepast krachtens de [artikelen 29d][ref1], [29e][ref2], [29g, tweede lid][ref3], dan wel
      [artikel 29j][ref4], dan wordt de in het eerste lid bedoelde uitkering verminderd met de vanwege genoemde artikelen
      toegepaste vermindering over een tijdvak van drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel29d
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel29e
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel29g
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel29j
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29k
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 29d
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0006517
        artikel: 29e
        hoofdstuk: 8a
      - id: ref3
        bwb_id: BWBR0006517
        artikel: 29g
        hoofdstuk: 8a
      - id: ref4
        bwb_id: BWBR0006517
        artikel: 29j
        hoofdstuk: 8a
  - number: 29k.3
    text: |-
      [Artikel 46, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel46
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29k
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '46'
        hoofdstuk: '11'
  - number: 29k.4
    text: |-
      Op de uitkering, bedoeld in het tweede lid, wordt het reeds voor zijn overlijden aan de
      betrokkene uitbetaalde non-activiteitsinkomen over een na zijn overlijden gelegen tijdvak in
      mindering gebracht. Indien de betrokkene voor zijn overlijden te veel vakantie heeft genoten, is
      [artikel 26, tweede lid, van het Besluit algemene rechtspositie politie][ref1], niet van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel26
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29k
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '26'
  - number: 29k.5
    text: |-
      Op de uitkering, bedoeld in het tweede lid, wordt, indien van toepassing, het bedrag van de uitkering die op grond
      van [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt uitbetaald in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel29k
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '53'
  - number: '30.1'
    text: |-
      Aan de ambtenaar die op grond van [artikel 62 van het Besluit algemene rechtspositie politie][ref1] voor een
      periode van tenminste twee weken wordt gedetacheerd, wordt, indien hij dagelijks heen en weer reist, een vergoeding
      toegekend voor de tijd waarmee de totale reistijd per dag 90 minuten overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel62
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '62'
  - number: '30.2'
    text: |-
      De vergoeding, bedoeld in het eerste lid, is gelijk aan de vergoeding, bedoeld in [artikel 27, achtste lid][ref1],
      die de ambtenaar bij overwerk zou ontvangen. De vergoeding voor delen van een uur wordt vastgesteld op een
      evenredig deel van de uurvergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel27
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
  - number: '30.3'
    text: |-
      Het bevoegd gezag kan in afwijking van het eerste en tweede lid beslissen in individuele gevallen waarin dit
      artikel naar zijn oordeel niet of niet in redelijkheid voorziet.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel30
  - number: '31.1'
    text: |-
      Aan de ambtenaar die in verband met de werkzaamheden die voortvloeien uit een functie in een publiekrechtelijk
      college waarin hij is benoemd of verkozen, tijdelijk is ontheven van de waarneming van zijn ambt wordt
      gedurende zijn ontheffing een non-activiteitswedde toegekend. De non-activiteitswedde is het bedrag waarmee de
      laatstelijk door hem in zijn ambt genoten bezoldiging het gezamenlijk bedrag van alle aan de werkzaamheden in dat
      publiekrechtelijk college verbonden inkomsten, overschrijdt.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel31
  - number: '31.2'
    text: |-
      Toekenning van de non-activiteitswedde vindt plaats op de voet van het
      bepaalde in de [artikelen 4, tweede, derde, vierde en vijfde lid][ref1], en
      [5 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006612#Artikel5
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006612
        artikel: '5'
  - number: '31.3'
    text: |-
      Dit artikel is niet van toepassing op degene die een non-activiteitswedde geniet uit hoofde van
      [artikel 4, eerste lid, van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel4
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '4'
  - number: '32'
    text: |-
      De ambtenaar die als militair in werkelijke dienst is, behoudt over de tijd van deze dienst het genot van de aan
      zijn ambt verbonden bezoldiging slechts voor zover hem bij of krachtens de [artikelen 33 tot en met 37][ref1]
      daarop aanspraak is verleend. Voor zover die werkelijke dienst wordt vervuld in de aan hem toegekende vakantie,
      behoudt hij in ieder geval het genot van de volle aan zijn ambt verbonden bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel33
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '33'
        hoofdstuk: '9'
  - number: '33.1'
    text: |-
      De ambtenaar die ingevolge wettelijke verplichting anders dan voor herhalingsoefening als militair in werkelijke
      dienst is, geniet, onverminderd [artikel 85 van het Besluit algemene rechtspositie politie][ref1], de aan zijn ambt
      verbonden bezoldiging voor zoveel deze meer bedraagt dan zijn militaire beloning, met dien verstande dat indien
      de ambtenaar ongehuwd is, hij slechts de aan zijn ambt verbonden bezoldiging geniet, voor zover 70 procent daarvan
      meer bedraagt dan zijn militaire beloning.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel85
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '85'
  - number: '33.2'
    text: |-
      Zo nodig in afwijking van het eerste lid blijft de ambtenaar, bedoeld in dat lid, in ieder geval de aan zijn ambt
      verbonden bezoldiging genieten tot een bedrag dat gelijk is aan het bedrag van het op hem te verhalen gedeelte van
      de pensioenbijdrage.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel33
  - number: '33.3'
    text: |-
      Ongehuwde enige kostwinners worden voor de toepassing van het eerste lid gelijkgesteld met gehuwden. Het bevoegd
      gezag beslist of een ongehuwde als enig kostwinner wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel33
  - number: '33.4'
    text: |-
      Voor de toepassing van het eerste lid wordt de militaire beloning verminderd met een eventuele aftrek wegens het
      genot van voeding en huisvesting.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel33
  - number: '33.5'
    text: |-
      De regels die op basis van [artikel 18, vijfde lid, van het Algemeen Rijksambtenarenreglement][ref1] zijn
      vastgesteld met betrekking tot hetgeen onder militaire beloning wordt verstaan, zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel18
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '18'
  - number: '34.1'
    text: |-
      [Artikel 33][ref1] is eerst van toepassing, nadat de ambtenaar als militair de opleiding en oefening heeft
      volbracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel33
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '33'
        hoofdstuk: '9'
  - number: '34.2'
    text: |-
      De ambtenaar die ingevolge een wettelijke verplichting voor de opleiding en oefening als militair in werkelijke
      dienst is, geniet gedurende deze opleiding en oefening de aan zijn ambt verbonden bezoldiging tot een bedrag dat
      gelijk is aan het op hem te verhalen gedeelte van de pensioenbijdrage.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel34
  - number: '34.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing ten aanzien van ambtenaren op wie bij koninklijk besluit de
      [artikelen 32][ref1] en [33][ref2] van overeenkomstige toepassing zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel33
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '32'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '33'
        hoofdstuk: '9'
  - number: '34.4'
    text: |-
      Indien de ambtenaar bij opkomst in militaire dienst voldoet aan de voorwaarde, gesteld in het eerste lid, of
      indien ingevolge het derde lid bij opkomst in militaire dienst deze voorwaarde niet voor hem geldt, geniet hij, in
      afwijking van artikel 33, gedurende twee weken na zijn opkomst de volle aan zijn ambt verbonden bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel34
  - number: '35.1'
    text: |-
      De ambtenaar die voor een herhalingsoefening als militair in werkelijke dienst is, geniet gedurende twee weken na
      zijn opkomst in militaire dienst de volle aan zijn ambt verbonden bezoldiging. Daarna wordt de militaire beloning
      in mindering gebracht op de aan zijn ambt verbonden bezoldiging. [Artikel 33, tweede, vierde en vijfde lid][ref1]
      is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel33
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '33'
        hoofdstuk: '9'
  - number: '35.2'
    text: Voor zover nodig, bepaalt Onze Minister van Defensie welke dienst als herhalingsoefening wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel35
  - number: '35.3'
    text: |-
      Voor de toepassing of voortgezette toepassing van het eerste lid worden, met inachtneming van hetgeen daaromtrent
      is bepaald in de [Kaderwet dienstplicht][ref1] of in de [Wet voor het reservepersoneel der krijgsmacht][ref2] en
      onverminderd [artikel 85 van het Besluit algemene rechtspositie politie][ref3] met herhalingsoefeningen gelijk
      gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0008589
      [ref2]: https://wetten.overheid.nl/BWBR0003883
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel85
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008589
      - id: ref2
        bwb_id: BWBR0003883
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '85'
  - number: 35.3.a
    text: |-
      het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven voor een
      onderzoek omtrent een strafbaar feit of een krijgstuchtelijk vergrijp waarvan de militair verdacht of beklaagd
      wordt;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel35
  - number: 35.3.b
    text: |-
      het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven ten einde
      rekening en verantwoording af te leggen van gevoerd beheer;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel35
  - number: 35.3.c
    text: 'het in aansluiting aan een herhalingsoefening langer in dienst blijven wegens:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel35
  - number: 35.3.c.1°
    text: ziekte;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel35
  - number: 35.3.c.2°
    text: het niet tijdig bereiken van de vereiste graad van geoefendheid als gevolg van ziekte;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel35
  - number: 35.3.c.3°
    text: het heersen of geheerst hebben van een besmettelijke ziekte;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel35
  - number: 35.3.d
    text: |-
      het in dienst komen om gehoord te worden omtrent een bij de Kroon of bij Onze Minister van Defensie ingediend
      bezwaarschrift onderscheidenlijk beroepschrift.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel35
  - number: '36'
    text: |-
      Indien de ambtenaar als militair in werkelijke dienst zijnde overlijdt, wordt de uitkering, bedoeld in
      [artikel 46][ref1], verminderd met het bedrag van de overeenkomstige uitkering die uit hoofde van de militaire
      dienst ter zake van dit overlijden wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel46
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '46'
        hoofdstuk: '11'
  - number: '37'
    text: |-
      De [artikelen 32 tot en met 36][ref1] zijn van overeenkomstige toepassing ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel32
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '32'
        hoofdstuk: '9'
  - number: 37.a
    text: |-
      de ambtenaar die is tewerkgesteld in de zin van [artikel 9 van de Wet gewetensbezwaren militaire dienst][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel9
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '9'
  - number: 37.b
    text: |-
      de ambtenaar die als militair in werkelijke dienst is op grond van een verbintenis bij het reservepersoneel der
      krijgsmacht of
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel37
  - number: 37.c
    text: |-
      de ambtenaar die op grond van een andere bijzondere verbintenis in werkelijke militaire of daarmee gelijk te
      stellen dienst is, terzake waarvan dit bij koninklijk besluit is bepaald.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel37
  - number: 37a.1
    text: |-
      Indien de ambtenaar van 55 jaar of ouder die op 15 maart 1999 ten minste de 49-jarige leeftijd heeft bereikt, op
      zijn aanvraag een functie wordt opgedragen waaraan een salarisschaal is verbonden met een lager maximum dan het
      maximum van de reeds voor hem geldende salarisschaal, wordt op zijn salaris een inhouding toegepast.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel37a
  - number: 37a.2
    text: |-
      De inhouding is gelijk aan het verschil tussen het salaris dat de ambtenaar geniet en het maximumsalaris behorende
      bij de salarisschaal direct onder de voor de ambtenaar geldende salarisschaal met dien verstande dat dit bedrag
      niet negatief mag zijn.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel37a
  - number: 37a.3
    text: In bijzondere gevallen kan het bevoegd gezag geheel of gedeeltelijk van de inhouding afzien.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel37a
  - number: 37a.4
    text: Onze Minister kan nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel37a
  - number: '38.1'
    text: |-
      De ambtenaar heeft bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een tijdvak van
      104 weken recht op de doorbetaling van zijn bezoldiging overeenkomstig de volgende tabel:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.1.1
    text: de eerste 26 weken 100% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.1.2
    text: de tweede 26 weken 90% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.1.3
    text: de derde 26 weken 80% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.1.4
    text: vervolgens 70% van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: '38.2'
    text: |-
      In afwijking van het eerste lid, behoudt de ambtenaar, indien de ziekte uit hoofde waarvan hij ongeschikt is zijn
      arbeid te verrichten, is veroorzaakt door een beroepsincident, zijn aanspraak op doorbetaling van 100% van zijn
      bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: '38.3'
    text: |-
      Voor de toepassing van het eerste lid worden perioden van ongeschiktheid samengeteld indien zij
      elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '38.4'
    text: 'Het tijdvak van 104 weken, bedoeld in het eerste lid, wordt verlengd:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.4.a
    text: |-
      met de duur van de vertraging, indien het bevoegd gezag de aangifte, bedoeld in
      [artikel 38, eerste lid, van de ZW][ref1], later doet dan op grond van dat artikel is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 38.4.b
    text: |-
      met de duur van de vertraging van de wachttijd, bedoeld in [artikel 19, eerste lid, van de WAO][ref1], zoals dat
      artikel luidde op 31 december 2003, indien de wachttijd met toepassing van het [zevende lid van dat artikel][ref2]
      wordt verlengd;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 38.4.c
    text: |-
      met de duur van het tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 71a, negende lid, van de WAO][ref1] heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '38.5'
    text: |-
      Ingeval van verlenging op grond van het vierde lid, kan het tijdvak, bedoeld in het eerste lid, niet méér dan 156
      weken belopen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: '38.6'
    text: |-
      De ambtenaar die langer dan 26 weken ongeschikt is tot het verrichten van zijn arbeid wegens ziekte en die
      loonvormende arbeid of reintegratieactiviteiten verricht, ontvangt over deze uren een beloning naast de bezoldiging
      bij ziekte als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: '38.7'
    text: 'De beloning, bedoeld in het zesde lid, tezamen met de doorbetaling van de bezoldiging bij ziekte bedraagt:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.7.a
    text: |-
      35% van de bezoldiging en 65% van de bezoldiging bij ziekte als bedoeld in het eerste lid indien de ambtenaar
      maximaal 35% van zijn betrekkingsomvang arbeid of activiteiten verricht als bedoeld in het zesde lid;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.7.b
    text: |-
      80% van de bezoldiging en 20% van de bezoldiging bij ziekte als bedoeld in het eerste lid indien de ambtenaar meer
      dan 35% en maximaal 80% van zijn betrekkingsomvang arbeid of activiteiten verricht als bedoeld in het zesde lid;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.7.c
    text: |-
      100% van de bezoldiging indien de ambtenaar meer dan 80% van zijn betrekkingsomvang arbeid of activiteiten verricht
      als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: '38.8'
    text: 'De doorbetaling van de bezoldiging eindigt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.8.a
    text: |-
      met ingang van de dag waarop de ambtenaar op grond van
      [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref1] passende arbeid verricht en daartoe
      is herplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel49b
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 49b
  - number: 38.8.b
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.8.c
    text: met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.8.d
    text: met ingang van de dag volgende op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: '38.9'
    text: |-
      De ambtenaar die op grond van [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref1]
      passende arbeid verricht en daartoe is herplaatst, voordat de termijn van twee jaar, bedoeld in
      [artikel 94, derde lid, van het Besluit algemene rechtspositie politie][ref2] is verstreken, heeft tot het eind van
      genoemde termijn aanspraak op een aanvullende uitkering, indien zijn bezoldiging als gevolg van zijn herplaatsing
      vermindering ondergaat, ter grootte van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel94
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 49b
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '94'
  - number: 38.9.a
    text: |-
      het bedrag waarop de ambtenaar op grond van dit artikel recht zou hebben gehad indien hem geen andere betrekking
      zou zijn opgedragen, maar in plaats daarvan voor dezelfde arbeidstijd zijn eigen betrekking; en
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.9.b
    text: |-
      de som van zijn bezoldiging na herplaatsing, een uit zijn arbeidsongeschiktheid voortvloeiend recht op een WAO-
      uitkering, een invaliditeitspensioen en een herplaatsingstoelage.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: '38.10'
    text: |-
      De ambtenaar die op grond van [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref1]
      passende arbeid verricht en daartoe is herplaatst, heeft tevens aanspraak op een aanvullende uitkering nadat de
      termijn van 104 weken is verstreken, indien de ziekte, uit hoofde waarvan de ambtenaar ongeschikt is zijn arbeid
      te verrichten wordt veroorzaakt door een dienstongeval of een door het verrichten van zijn arbeid opgelopen
      beroepsziekte, ter grootte van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel49b
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 49b
  - number: 38.10.a
    text: |-
      een percentage van zijn bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering, zoals die zou
      zijn op de dag voor zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot werken;
      en
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.10.b
    text: |-
      zijn bezoldiging na herplaatsing, in voorkomend geval vermeerderd met een uit de oorspronkelijke betrekking
      voortvloeiend recht op een WAO-uitkering, invaliditieitspensioen en een herplaatsingstoelage.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: '38.11'
    text: |-
      Het percentage, bedoeld in het tiende lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:






                    80% of meer:


                    90,02%;






                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%;




                    25 tot 35%:


                    27,01%;




                    15 tot 25%:


                    18,00%.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: '38.12'
    text: 'De aanvullende uitkering, bedoeld in het negende en tiende lid, eindigt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.12.a
    text: met ingang van de dag waarop de ambtenaar niet meer voldoet aan de in bedoelde artikelleden genoemde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.12.b
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.12.c
    text: met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar bereikt; of
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38.12.d
    text: met ingang van de dag volgende op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38
  - number: 38a.1
    text: |-
      De ambtenaar met recht op een ZW-uitkering heeft aanspraak op een aanvulling van die uitkering tot het niveau van
      de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38a
  - number: 38a.2
    text: |-
      Voor de toepassing van dit artikel wordt de ZW-uitkering waarop de ambtenaar recht heeft steeds aangemerkt als een
      uitkering die door deze onverminderd is genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38a
  - number: 38b.1
    text: |-
      De ambtenaar die ongeschikt is zijn arbeid te verrichten wegens een dienstongeval of een beroepsziekte doch
      niet door een beroepsincident, wordt op zijn aanvraag voor de toepassing van dit hoofdstuk gelijkgesteld met de
      ambtenaar die ongeschikt is zijn arbeid te verrichten wegens een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38b
  - number: 38b.2
    text: |-
      De gewezen ambtenaar van wie de arbeidsongeschiktheid is veroorzaakt door een dienstongeval of een beroepsziekte
      doch niet door een beroepsincident, wordt op zijn aanvraag voor de toepassing van dit hoofdstuk gelijkgesteld met
      de gewezen ambtenaar van wie de arbeidsongeschiktheid is veroorzaakt door een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38b
  - number: 38b.3
    text: |-
      De ambtenaar en de gewezen ambtenaar worden geacht een aanvraag te hebben ingediend als bedoeld in het eerste en
      tweede lid indien de eerste dag van ongeschiktheid tot het verrichten van zijn arbeid wegens een dienstongeval of
      een beroepsziekte is gelegen in de periode van 1 januari 2004 tot en met 31 mei 2006.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel38b
  - number: '39.1'
    text: |-
      De gewezen ambtenaar die wegens ziekte, ontstaan voor het tijdstip van ingang van zijn ontslag, niet zijnde een
      ontslag op grond van [artikel 87a][ref1], [artikel 88][ref2], [artikel 88a][ref3], [artikel 88b][ref4] dan wel
      [artikel 94, eerste lid, aanhef, onderdelen e of f, van het Besluit algemene rechtspositie politie][ref5] nog
      ongeschikt is een naar aard en omvang soortgelijke functie te vervullen, heeft zolang hij ongeschikt tot werken
      is wegens ziekte, doch niet langer dan een tijdvak van ten hoogste 78 weken, aanspraak op de doorbetaling van zijn
      bezoldiging overeenkomstig de volgende tabel:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel87a
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel88a
      [ref4]: https://wetten.overheid.nl/BWBR0006516#Artikel88b
      [ref5]: https://wetten.overheid.nl/BWBR0006516#Artikel94
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 87a
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '88'
      - id: ref3
        bwb_id: BWBR0006516
        artikel: 88a
      - id: ref4
        bwb_id: BWBR0006516
        artikel: 88b
      - id: ref5
        bwb_id: BWBR0006516
        artikel: '94'
  - number: 39.1.a
    text: de eerste 26 weken 100% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39.1.b
    text: de tweede 26 weken 90% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39.1.c
    text: de derde 26 weken 80% van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: '39.2'
    text: |-
      De gewezen ambtenaar die binnen een maand na het tijdstip van zijn ontslag ongeschikt wordt wegens ziekte een naar
      aard en omvang soortgelijke functie te vervullen, heeft zolang betrokkene ongeschikt is tot werken wegens ziekte,
      maar niet langer dan 52 weken, aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging indien hij
      gedurende ten minste twee maanden onmiddellijk aan het ontslag voorafgaande in dienst is geweest overeenkomstig de
      volgende tabel:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39.2.a
    text: de eerste 26 weken 100% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39.2.b
    text: de tweede 26 weken 90% van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: '39.3'
    text: |-
      Voor het bepalen van het einde van het tijdvak van 78 weken, bedoeld in het eerste lid, en het tijdvak
      van 52 weken, bedoeld in het tweede lid, worden perioden van ongeschiktheid samengeteld indien zij
      elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '39.4'
    text: |-
      De doorbetaling van de bezoldiging bedoeld in het eerste en tweede lid, eindigt na ommekomst van de uitkeringsduur,
      maar in ieder geval:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39.4.a
    text: met ingang van de dag waarop de gewezen ambtenaar de leeftijd van 65 jaar bereikt; of
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39.4.b
    text: met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: '39.5'
    text: |-
      De gewezen ambtenaar die aanspraak heeft op een WAO-uitkering ter zake van de dienstbetrekking die hij voor zijn
      ontslag vervulde, heeft aanspraak op een aanvullende uitkering indien de arbeidsongeschiktheid is veroorzaakt door
      beroepsincident.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: '39.6'
    text: 'De in het vijfde lid bedoelde aanvullende uitkering is gelijk aan het verschil tussen:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39.6.a)
    text: |-
      een percentage van de laatstelijk genoten bezoldiging vermeerderd met de vakantie-uitkering en de
      eindejaarsuitkering, in het jaar voorafgaande aan zijn ontslag; en
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39.6.b)
    text: |-
      de som van de ambtenaar toegekende WAO-uitkering, een hem toegekend invaliditeitspensioen, een hem
      toegekende herplaatsingstoelage dan wel in voorkomend geval een hem toegekende suppletie op grond van het
      [Besluit suppletieregeling gedeeltelijk arbeidsongeschikten sector politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008099
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008099
  - number: '39.7'
    text: |-
      Het percentage, bedoeld in het zesde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van: 80% of meer: 90,02%; 65 tot 80%: 65,26%; 55 tot 65%: 54,01%; 45 tot
      55%: 45,01%; 35 tot 45%: 36,01%; 25 tot 35%: 27,01%; 15 tot 25%: 18,00%.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: '39.8'
    text: 'De aanvullende uitkering, bedoeld in het vijfde lid, eindigt:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39.8.a
    text: |-
      met ingang van de dag waarop de gewezen ambtenaar niet meer voldoet aan de in bedoeld artikellid genoemde
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39.8.b
    text: met ingang van de dag waarop de gewezen ambtenaar de leeftijd van 65 jaar heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39.8.c
    text: met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: '39.9'
    text: |-
      De gewezen ambtenaar aan wie eervol ontslag is verleend op grond van
      [artikel 87a van het Besluit algemene rechtspositie politie][ref1] met het oog op een uitkering op grond van een
      vut-overeenkomst als bedoeld in [artikel 1, onderdeel e, van de Wet kaderregeling vut overheidspersoneel][ref2],
      heeft slechts aanspraak op de doorbetaling van zijn laatstelijk genoten bezoldiging voor zover deze tezamen
      met de aanvullende uitkering in artikel 8.4 van het Pensioenreglement de laatstelijk genoten bezoldiging niet
      overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel87a
      [ref2]: https://wetten.overheid.nl/BWBR0007792#Artikel1
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 87a
      - id: ref2
        bwb_id: BWBR0007792
        artikel: '1'
  - number: '39.10'
    text: |-
      Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in de voorgaande leden, wordt in voorkomende gevallen
      gewijzigd overeenkomstig een algemene salarismaatregel in de sector politie.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39
  - number: 39a.1
    text: |-
      De gewezen ambtenaar die waarschijnlijk zal bevallen binnen vier maanden na de datum van ingang van haar ontslag,
      ontvangt haar laatstelijk genoten bezoldiging gedurende de periode die aanvangt op de 41e dag voorafgaande aan de
      vermoedelijke datum van bevalling en eindigt op de 70e dag na de datum waarop de bevalling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39a
  - number: 39a.2
    text: |-
      De periode, bedoeld in het eerste lid, wordt verlengd tot zestien weken, indien die periode door een voortijdige
      bevalling minder dan zestien weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39a
  - number: 39a.3
    text: |-
      De gewezen ambtenaar van wie de bevalling niet wordt verwacht binnen vier maanden na de datum van ingang van haar
      ontslag, maar die niettemin binnen die termijn bevalt, ontvangt haar laatstelijk genoten bezoldiging gedurende
      de periode die aanvangt op de datum van bevalling en eindigt op de 70e dag na de datum waarop de bevalling heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39a
  - number: 39a.4
    text: |-
      Voor zolang de gewezen ambtenaar na beëindiging van de haar ingevolge het eerste of derde lid toekomende
      uitkering nog wegens ziekte ongeschikt is tot werken of binnen een maand na deze beëindiging ongeschikt wordt tot
      werken, heeft zij gedurende een tijdvak van 52 weken recht op de doorbetaling van de bezoldiging overeenkomstig
      [artikel 39][ref1]. De termijn van 52 weken loopt vanaf de eerste dag na de bevalling.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel39
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '39'
        hoofdstuk: '10'
  - number: 39a.5
    text: |-
      Ongeschikt tot werken, in de zin van het vierde lid is de gewezen ambtenaar die als rechtstreeks en objectief
      medisch vast te stellen gevolg van ziekte of gebreken geheel of gedeeltelijk niet in staat is om een naar aard en
      omvang soortgelijke betrekking als zij vervulde, te vervullen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39a
  - number: 39a.6
    text: |-
      [Artikel 55, vijfde en zesde lid, van het Besluit algemene rechtspositie politie][ref1] en
      [artikel 41, tweede lid][ref2], van dit besluit zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel41
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '41'
        hoofdstuk: '10'
  - number: 39a.7
    text: |-
      Dit artikel is niet van toepassing als het [Besluit suppletie gedeeltelijk arbeidsongeschikten sector politie][ref1],
      van toepassing is. Het recht op grond van dit artikel leidt in dat geval niet tot uitkering en evenmin tot
      wijziging van de berekening van de perioden daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0008099
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0008099
  - number: 39a.8
    text: |-
      Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in de voorgaande leden, wordt in voorkomende gevallen
      gewijzigd overeenkomstig een algemene salarismaatregel in de sector politie.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel39a
  - number: '41.1'
    text: 'De ambtenaar en de gewezen ambtenaar hebben geen aanspraak op doorbetaling van de bezoldiging:'
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel41
  - number: 41.1.a)
    text: |-
      indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het verrichten
      van arbeid wegens ziekte niet kan worden aangenomen;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel41
  - number: 41.1.b)
    text: |-
      indien de ambtenaar de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opzettelijk heeft
      veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel41
  - number: 41.1.c)
    text: |-
      indien de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte zich voordoet binnen een half
      jaar na het geneeskundig onderzoek, bedoeld in [artikel 7, eerste lid, onderdeel c][ref1] respectievelijk
      [artikel 8, eerste lid, onderdeel a, van het Besluit algemene rechtspositie politie][ref2] en blijkt dat de
      ambtenaar onjuiste informatie omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, ten
      gevolge waarvan de verklaring van geschiktheid voor de desbetreffende functie ten onrechte heeft plaatsgevonden,
      tenzij de ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel8
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '8'
  - number: '41.2'
    text: |-
      De gewezen ambtenaar heeft geen aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging, indien hij op
      grond van een aanvaarde andere betrekking aanspraak kan maken op doorbetaling van zijn loon of bezoldiging, dan wel
      op een ZW-uitkering.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel41
  - number: '42.1'
    text: |-
      Het tijdvak gedurende welke de ambtenaar en de gewezen ambtenaar aanspraak hebben op de doorbetaling van hun
      bezoldiging of een bovenwettelijke ziekte-uitkering vangt aan op de eerste dag waarop:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel42
  - number: 42.1.a)
    text: wegens ziekte geheel of gedeeltelijk niet is gewerkt;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel42
  - number: 42.1.b)
    text: het werken wegens ziekte geheel of gedeeltelijk is gestaakt;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel42
  - number: 42.1.c)
    text: wegens ziekte geheel of gedeeltelijk niet zou zijn gewerkt;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel42
  - number: 42.1.d)
    text: het werken wegens ziekte geheel of gedeeltelijk zou zijn gestaakt.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel42
  - number: '42.2'
    text: |-
      Bij buitengewoon verlof zonder behoud van bezoldiging vangt het tijdvak, bedoeld in het eerste lid, aan op de dag
      volgende op die waarop het buitengewoon verlof is beëindigd.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel42
  - number: '44.1'
    text: |-
      De aanspraken van de ambtenaar en de gewezen ambtenaar op grond van dit hoofdstuk gedurende de eerste 104 weken van
      ongeschiktheid tot werken, vervallen indien de ambtenaar of de gewezen ambtenaar:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.a)
    text: niet binnen redelijke termijn gezondheidskundige hulp inroept;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.b)
    text: zich niet gedurende het gehele verloop van de ziekte onder gezondheidskundige behandeling blijft stellen;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.c)
    text: de voorschriften van de behandelende arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.d)
    text: zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.e)
    text: |-
      verzuimt de deskundige persoon of de arbodienst op eerste aanvraag mee te delen om welke reden hij ongeschikt is
      tot werken;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.f)
    text: |-
      zonder deugdelijke grond nalaat gevolg te geven aan een verzoek van de deskundige persoon of de arbodienst om te
      verschijnen;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.g)
    text: |-
      er de oorzaak van is dat het arbeidsgezondheidskundig onderzoek door een door de deskundige persoon of de
      arbodienst aangewezen arts niet kan plaatshebben;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.h)
    text: |-
      niet binnen twee dagen na de aanvang van de ongeschiktheid tot werken wegens ziekte dit heeft gemeld bij zijn
      werkgever;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.i)
    text: |-
      weigert aangeboden passende arbeid, waartoe de deskundige persoon of de arbodienst hem in staat acht, te verkrijgen
      of te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.j)
    text: |-
      zich niet houdt aan de ten aanzien van hem geldende regels met betrekking tot de wijze waarop invulling wordt
      gegeven aan de verzuimbegeleiding en de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen
      procedure;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.k)
    text: zijn ongeschiktheid tot werken opzettelijk heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.l)
    text: |-
      weigert inzage te geven in een op hem betrekking hebbend document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een geldig rijbewijs als bedoeld in
      [artikel 107 van de Wegenverkeerswet 1994][ref2], voor zover dit redelijkerwijs nodig is voor de uitvoering van
      wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '107'
  - number: 44.1.m)
    text: |-
      tijdens de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte arbeid voor zichzelf of voor derden
      verricht, tenzij dit door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk wordt
      geacht;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.n)
    text: |-
      vóór de betaling van de bezoldiging of de bovenwettelijke arbeidsongeschiktheidsuitkering, weigert mededeling te
      doen van inkomsten uit arbeid die hij heeft in verband met het verrichten van door de deskundige persoon of de
      arbodienst in het belang van zijn genezing wenselijk geachte arbeid voor zichzelf of voor derden;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.o)
    text: |-
      niet onverwijld op verzoek of uit eigen beweging alle feiten en omstandigheden meedeelt, waarvan hem redelijkerwijs
      duidelijk moet zijn dat zij van invloed kunnen zijn op het recht of op de hoogte van een aan hem toegekende
      arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.p)
    text: |-
      zijn arbeid verzuimt te hervatten op het door de deskundige persoon of de arbodienst bepaalde tijdstip en in
      de door deze persoon of dienst bepaalde mate, indien zulks hem is opgedragen, tenzij hij daarvoor een door de
      deskundige persoon of de arbodienst als geldig erkende reden heeft opgegeven;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.q)
    text: |-
      zonder deugdelijke grond weigert mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen
      deskundige gegeven redelijke voorschriften of getroffen maatregelen die erop zijn gericht om de betrokkene in staat
      te stellen passende arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: 44.1.r)
    text: |-
      zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren en bijstellen van een plan van aanpak
      als bedoeld in [artikel 71a, tweede lid, van de WAO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 44.1.s)
    text: zijn medewerking weigert bij de doelmatige uitvoering van de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: '44.2'
    text: |-
      De aanspraak op de doorbetaling van bezoldiging of de bovenwettelijke ziekte-uitkering, kan geheel of gedeeltelijk
      vervallen worden verklaard in het geval de ambtenaar of de gewezen ambtenaar de regels heeft overtreden die ter
      zake van afwezigheid wegens ziekte zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: '44.3'
    text: |-
      De ingevolge het eerste lid vervallen aanspraken herleven met ingang van het tijdstip waarop de ambtenaar of de
      gewezen ambtenaar alsnog gevolg geeft aan de betreffende verplichting op grond van dat lid.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: '44.4'
    text: |-
      Het bevoegd gezag kan op grond van bijzondere omstandigheden bepalen, dat de aanspraak op de doorbetaling van
      bezoldiging of de bovenwettelijke ziekte-uitkering niet vervalt maar geheel of ten dele aan anderen dan aan de
      ambtenaar of de gewezen ambtenaar zal worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
  - number: '44.5'
    text: |-
      Voor zover het bevoegd gezag van de bevoegdheid, bedoeld in het vierde lid, geen gebruik heeft gemaakt, worden de
      niet uitbetaalde bezoldiging of de bovenwettelijke ziekte-uitkering alsnog aan de ambtenaar uitbetaald, indien de
      in [artikel 51, derde lid, van het Besluit algemene rechtspositie politie][ref1] bedoelde commissie van artsen ten
      gunste van de ambtenaar heeft geoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel51
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '51'
  - number: '45.1'
    text: |-
      De aanspraken van de ambtenaar op grond van dit hoofdstuk na de eerste 104 weken van ongeschiktheid tot werken,
      vervallen indien de ambtenaar:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45
  - number: 45.1.a)
    text: |-
      weigert aangeboden passende arbeid, waartoe de deskundige persoon of de arbodienst hem in staat acht, te verkrijgen
      of te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45
  - number: 45.1.b)
    text: |-
      zich niet houdt aan de ten aanzien van hem geldende regels met betrekking de wijze waarop invulling wordt gegeven
      aan de verzuimbegeleiding en de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen procedure;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45
  - number: 45.1.c)
    text: |-
      geen aanspraak heeft op een WAO-uitkering in verband met de toepassing van [artikel 25][ref1]
      of [28, onder a of b, van de WAO][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
  - number: '45.2'
    text: |-
      De ingevolge het eerste lid vervallen aanspraken herleven met ingang van het tijdstip waarop de ambtenaar alsnog
      gevolg geeft aan de betreffende verplichting op grond van dat lid.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45
  - number: '45.3'
    text: |-
      Na het tijdvak van 104 weken, bedoeld in de [artikelen 38][ref1] en [39][ref2], is op de aanspraak die de
      ambtenaar heeft op doorbetaling van de bezoldiging, het verplichtingen- en sanctieregime van de [WAO][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '39'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0002524
  - number: '45.4'
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door de ambtenaar, de WAO-uitkering vermindering
      ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk wordt geweigerd, wordt de WAO-uitkering voor het
      vaststellen van zijn aanspraak op doorbetaling van de bezoldiging zoals bedoeld in [artikel 38, eerste lid][ref1],
      steeds geacht onverminderd te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: '45.5'
    text: |-
      Indien ten aanzien van de WAO-uitkering die de ambtenaar genieten een verplichting wordt opgelegd of
      een sanctie wordt toegepast, wordt door het bevoegd gezag zoveel mogelijk dezelfde verplichting opgelegd
      dan wel een overeenkomende sanctie toegepast, op doorbetaling van de bezoldiging zoals bedoeld in
      [artikel 38, eerste lid][ref1] waarop de ambtenaar aanspraak hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: 45a.1
    text: |-
      Bij samenloop van een aanspraak krachtens dit hoofdstuk met een uitkering krachtens een wettelijke verzekering,
      wordt de aanspraak krachtens dit hoofdstuk verminderd met het bedrag van de uitkering krachtens de wettelijke
      verzekering, tenzij het betreft:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45a
  - number: 45a.1.a)
    text: |-
      een tegemoetkoming of een vergoeding die vergelijkbaar is met de tegemoetkoming of de vergoeding, bedoeld in de
      [artikelen 53][ref1] en [54 van het Besluit algemene rechtspositie politie][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel54
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '54'
  - number: 45a.1.b)
    text: |-
      een ZW-uitkering ingeval van meer dan een betrekking. In dat geval wordt de ZW-uitkering naar rato van de
      bezoldiging toegerekend aan de dienstbetrekking ter zake waarvan zijn bezoldiging wordt doorbetaald krachtens dit
      hoofdstuk en de andere betrekking of betrekkingen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45a
  - number: 45a.1.c)
    text: |-
      een WAO-uitkering ingeval van meer dan één betrekking. In dat geval wordt de WAO-uitkering naar rato van de
      bezoldiging toegerekend aan de betrekking ter zake waarvan zijn bezoldiging wordt doorbetaald krachtens dit
      hoofdstuk en de andere betrekking of betrekkingen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45a
  - number: 45a.2
    text: |-
      Inkomsten uit of in verband met arbeid of bedrijf worden op het bedrag, waarop de gewezen ambtenaar ingevolge dit
      hoofdstuk recht heeft, in mindering gebracht, tenzij:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45a
  - number: 45a.2.a)
    text: |-
      de gewezen ambtenaar deze inkomsten reeds voor het intreden van de ongeschiktheid tot het verrichten van zijn
      arbeid wegens ziekte genoot; en
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45a
  - number: 45a.2.b)
    text: de omvang van die arbeid niet is toegenomen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45a
  - number: 45c.1
    text: |-
      De aanspraak van de ambtenaar en de gewezen ambtenaar op de bovenwettelijke ziekte-uitkering of de doorbetaling
      van de bezoldiging na afloop van de termijn als bedoeld in [artikel 38, eerste lid][ref1], wordt zoveel mogelijk op
      gelijke wijze gewijzigd als een aan hem toegekende ZW-uitkering of een WAO-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: 45c.2
    text: |-
      Het eerste lid vindt geen toepassing indien de ambtenaar en de gewezen ambtenaar aanspraak op een ZW-uitkering
      of een WAO-uitkering hebben wegens ongeschiktheid tot werken voor een betrekking die de ambtenaar of de gewezen
      ambtenaar heeft vervuld naast zijn betrekking ter zake waarvan de ambtenaar of de gewezen ambtenaar op een
      uitkering krachtens dit hoofdstuk aanspraak heeft, voor zover de ZW-uitkering of de WAO-uitkering naar de inkomsten
      uit die andere betrekking wordt berekend of geacht kan worden te zijn berekend.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45c
  - number: 45d.1
    text: |-
      Ten aanzien van de ambtenaar en de gewezen ambtenaar van wie de eerste dag van ongeschiktheid tot het verrichten
      van zijn arbeid wegens ziekte is gelegen voor 1 januari 2004, blijven de artikelen van hoofdstuk X van dit besluit
      van toepassing zoals deze luidden op 31 december 2005.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45d
  - number: 45d.2
    text: |-
      Voor de toepassing van het eerste lid worden perioden van ongeschiktheid tot werken geacht eenzelfde, niet
      onderbroken periode van ongeschiktheid te vormen, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof
      wordt genoten overeenkomstig [artikel 3.1, tweede en derde lid, van de Wet arbeid en zorg][ref1] of een uitkering
      op grond van [artikel 3:8][ref2], of [3:10, eerste lid, van die wet][ref3], tenzij de ongeschiktheid redelijkerwijs
      niet geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel45d
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '46.1'
    text: |-
      De bezoldiging van de ambtenaar wordt niet langer uitbetaald dan tot en met de dag van het overlijden.
      [Artikel 26, eerste lid, van het Besluit algemene rechtspositie politie][ref1], is van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel26
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '26'
  - number: '46.2'
    text: |-
      Met inachtneming van het vijfde lid wordt zo spoedig mogelijk na het overlijden aan de weduwe of weduwnaar van
      wie de overleden ambtenaar niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan de bezoldiging over
      een tijdvak van drie maanden. Als maatstaf bij de berekening van het in de eerste volzin bedoelde bedrag geldt,
      behoudens het hierna bepaalde, de bezoldiging welke de ambtenaar op de dag van het overlijden genoot of, indien
      hij op die dag aanspraak maakt op een ZW-uitkering of een WAO-uitkering en een bovenwettelijke ziekte-uitkering
      of een bovenwettelijke arbeidsongeschiktheidsuitkering, bedoeld in [hoofdstuk 10][ref1], zou hebben genoten indien
      hij op die dag arbeidsgeschikt zou zijn geweest. De uitkering wordt vermeerderd met een bedrag gelijk aan driemaal
      dat van de vakantieuitkering over een maand, berekend op de voet van [hoofdstuk 6][ref2], naar de bezoldiging
      die de ambtenaar in de maand van het overlijden zou hebben genoten. Indien de ambtenaar in het genot was van de
      operationele toelage, bedoeld in [artikel 14][ref3], of van de aflopende toelage, bedoeld in [artikel 15][ref4]
      of van een toelage op grond van artikel IV van het koninklijk besluit van 4 september 1968 tot wijziging van het
      Bezoldigingsreglement politie 1958 (*Stb.* 477) wordt het gedeelte van de in de eerste volzin bedoelde uitkering
      dat betrekking heeft op deze toelagen, gesteld op het bedrag dat de overleden ambtenaar in de drie kalendermaanden
      voorafgaand aan de dag van het overlijden aan zodanige toelagen is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel15
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006517
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0006517
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '15'
        hoofdstuk: '4'
  - number: '46.3'
    text: |-
      Bij ontstentenis van een weduwe of weduwnaar van wie de overledene niet duurzaam gescheiden leefde, geschiedt de
      uitkering, bedoeld in het tweede lid, ten behoeve van de minderjarige kinderen. Onder kinderen in de zin van dit
      artikel worden mede verstaan natuurlijke kinderen en kinderen waarover de overledene de pleegouderlijke zorg droeg.
      Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind als was het een
      eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46
  - number: '46.4'
    text: |-
      Ontbreken ook kinderen als bedoeld in het derde lid, dan geschiedt de uitkering, bedoeld in het tweede lid, aan
      degenen die geheel of grotendeels afhankelijk waren van de bezoldiging van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46
  - number: '46.5'
    text: |-
      Indien de overledene geen betrekkingen als bedoeld in het tweede tot en met het vierde lid nalaat, kan het daartoe
      bedoelde bedrag door het bevoegd gezag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de
      laatste ziekte en van de lijkbezorging, indien de nalatenschap van de overledene voor de betaling van die kosten
      ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46
  - number: '46.6'
    text: |-
      Op de uitkering, bedoeld in het tweede lid, wordt reeds vóór zijn overlijden aan de
      ambtenaar uitbetaalde bezoldiging over een na zijn overlijden gelegen tijdvak in mindering
      gebracht. Indien de ambtenaar voor zijn overlijden te veel vakantie heeft genoten, is
      [artikel 26, tweede lid, van het Besluit algemene rechtspositie politie][ref1], van overeenkomstige toepassing. Het
      aldus verschuldigde bedrag wordt eveneens in mindering gebracht op de uitkering, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel26
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '26'
  - number: '46.7'
    text: |-
      Op het bedrag, bedoeld in het tweede tot en met vierde lid, wordt in mindering
      gebracht een uitkering op grond van [artikel 35 van de Ziektewet ][ref1]of op grond van
      [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref2] en naar aard en strekking daarmee
      overeenkomende uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '53'
  - number: 46a
    text: |-
      Na het overlijden van de gewezen ambtenaar, die op de dag van zijn overlijden op grond van [artikel 39][ref1] in
      het genot was van doorbetaling van zijn laatstelijk genoten bezoldiging, wordt aan de in [artikel 46][ref2] bedoelde
      personen en met overeenkomstige toepassing van dat artikel een bedrag uitgekeerd, gelijk aan de bezoldiging welke
      de gewezen ambtenaar op de dag van zijn overlijden genoot, berekend over een tijdvak van drie maanden. Op deze
      uitkering worden in mindering gebracht het bedrag van de uitkering op grond van [artikel 35 van de Ziektewet][ref3]
      of op grond van [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref4] en naar aard en strekking
      daarmee overeenkomende uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '39'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '46'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '53'
  - number: 46b.1
    text: |-
      Indien het overlijden van de ambtenaar is veroorzaakt door een dienstongeval of een door het verrichten van zijn
      arbeid opgelopen beroepsziekte, wordt aan degene die in verband met dit overlijden krachtens het Pensioenreglement
      van de Stichting Pensioenfonds ABP, een nabestaandenpensioen geniet, een uitkering toegekend ten bedrage van 18
      procent van het resultaat van de vermenigvuldiging van:
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46b
  - number: 46b.1.a)
    text: |-
      indien het gaat om de partner, bedoeld in artikel 7.1 van het Pensioenreglement van de Stichting Pensioenfonds ABP,
      vijf zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in artikel 6.2 van het Pensioenreglement
      van de Stichting Pensioenfonds ABP en de voor pensioen geldige diensttijd, bedoeld in hoofdstuk 5 van het
      Pensioenreglement van de Stichting Pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46b
  - number: 46b.1.b)
    text: |-
      indien het gaat om de wees, bedoeld in artikel 7.6, eerste lid, aanhef, onderdeel a, van het Pensioenreglement van
      de Stichting Pensioenfonds ABP, een zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in artikel
      6.2 van het Pensioenreglement van de Stichting Pensioenfonds ABP, en de voor pensioen geldige diensttijd, bedoeld
      in hoofdstuk 5 van het Pensioenreglement van de Stichting Pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46b
  - number: 46b.1.c)
    text: |-
      indien het gaat om de wees, bedoeld in artikel 7.7, eerste lid, aanhef, onderdeel b, van het Pensioenreglement van
      de Stichting Pensioenfonds ABP, twee zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in artikel
      6.2 van het Pensioenreglement van de Stichting Pensioenfonds ABP, en de voor pensioen geldige diensttijd, bedoeld
      in hoofdstuk 5 van het Pensioenreglement van de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46b
  - number: 46b.2
    text: |-
      De uitkering eindigt met ingang van de dag waarop de overledene de leeftijd van 65 jaar zou hebben bereikt, dan
      wel, indien de partner, bedoeld in artikel 7.1 van het Pensioenreglement van de Stichting Pensioenfonds ABP, aan
      wie een pensioen werd toegekend, hertrouwt, met ingang van de maand volgende op de datum van het hertrouwen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46b
  - number: 46b.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de gewezen ambtenaar ten aanzien van wie
      [artikel 38, zesde lid][ref1], toepassing heeft gevonden, indien zijn overlijden het rechtstreeks gevolg is van de
      arbeidsongeschiktheid, bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: 46c.1
    text: |-
      Aan de ambtenaar of zijn nagelaten betrekking kan een tegemoetkoming worden verleend in de premie voor een
      ziektekostenverzekering volgens door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46c
  - number: 46c.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de gewezen ambtenaar, jonger dan 65 jaar, of zijn nagelaten
      betrekkingen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel46c
  - number: '47.1'
    text: |-
      Bij vermissing van de ambtenaar zijn, behoudens het tweede lid, de bepalingen van [artikel 46][ref1] van
      overeenkomstige toepassing. De ambtenaar wordt daarbij geacht te zijn overleden op een door het bevoegd gezag te
      bepalen dag.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel46
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '46'
        hoofdstuk: '11'
  - number: '47.2'
    text: |-
      Het [ tweede lid van artikel 46][ref1] is niet van toepassing indien gegronde vermoedens bestaan, dat de vermissing
      het gevolg is van ongeoorloofde afwezigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel46
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '46'
        hoofdstuk: '11'
  - number: '47.3'
    text: |-
      Indien blijkt, dat de als vermist beschouwde ambtenaar in leven is, kan ter beoordeling van het bevoegd gezag
      de bezoldiging worden uitbetaald, tenzij gegronde vermoedens bestaan, dat de vermissing het gevolg was van
      ongeoorloofde afwezigheid.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel47
  - number: '47.4'
    text: |-
      Indien uit hoofde van de vermissing van de ambtenaar pensioen of enige andere uitkering, voortvloeiende uit zijn
      ambtelijke rechtspositie, is toegekend over het tijdvak, waarover naar het oordeel van het bevoegd gezag geen
      aanspraak bestaat op bezoldiging, wordt die bezoldiging verminderd met de over dat tijdvak aldus uitbetaalde
      bedragen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel47
  - number: '47.5'
    text: |-
      De bezoldiging waarop de ambtenaar ingevolge het derde en vierde lid aanspraak heeft, kan aan anderen dan de
      ambtenaar worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel47
  - number: '48'
    text: |-
      Voor gevallen, waarin dit besluit niet of niet naar billijkheid voorziet, wordt door Onze Minister een bijzondere
      regeling getroffen.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel48
  - number: '49.1'
    text: |-
      Een ambtenaar die op grond van [afdeling 1, hoofdstuk 2, artikel 1, van de Invoeringswet Politiewet 1993][ref1]
      naar een politieregio dan wel het Korps landelijke politiediensten is overgegaan en die op de dag
      voorafgaande aan de datum van inwerkingtreding van de [Politiewet 1993][ref2] aanspraken had op grond van
      het Bezoldigingsreglement politie 1958 en op grond van artikel VII van het Besluit van 24 juni 1992, houdende
      wijziging van het Ambtenarenreglement voor de rijkspolitie 1975, het Ambtenarenreglement voor de gemeentepolitie
      1958, het Bezoldigingsreglement politie 1958, het [Besluit geneeskundige verzorging politie][ref3] 1984 en
      het [Besluit overleg en medezeggenschap politie][ref4] in verband met het tot stand brengen van een eenvormige
      rechtspositie voor alle politieambtenaren behoudt deze aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0006300#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006299
      [ref3]: https://wetten.overheid.nl/BWBR0006605
      [ref4]: https://wetten.overheid.nl/BWBR0006518
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006300
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006299
      - id: ref3
        bwb_id: BWBR0006605
      - id: ref4
        bwb_id: BWBR0006518
  - number: '49.2'
    text: |-
      Een ambtenaar, werkzaam bij het LSOP, die op de dag voorafgaande aan de datum van inwerkingtreding van de
      [LSOP-wet][ref1] aanspraken had op grond van het Bezoldigingsbesluit LSOP, behoudt deze aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0006942
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006942
  - number: '49.3'
    text: |-
      Indien aan een ambtenaar, werkzaam bij het LSOP, op de dag voorafgaande aan de datum van inwerkingtreding van
      de [LSOP-wet][ref1] een salaris was toegekend dat voorkwam in één van de salarisschalen opgenomen in een van de
      bijlagen van het Bezoldigingsbesluit LSOP, vindt inschaling plaats in een salarisschaal van bijlage 1 van dit
      besluit waarvan het maximumsalaris gelijk is aan dan wel gelegen is onmiddellijk onder het maximumsalaris van
      de salarisschaal volgens welke de ambtenaar werd bezoldigd voor de inwerkingtreding van de [LSOP-wet][ref2]. Het
      salaris dat aan de ambtenaar wordt toegekend is gelijk aan dan wel gelegen onmiddellijk onder het salaris dat hem
      was toegekend voor de inwerkingtreding van de [LSOP-wet][ref3]. Indien aan de ambtenaar een salaris wordt toegekend
      dat is gelegen onmiddellijk onder het salaris dat hij ontving voor de inwerkingtreding van de [LSOP-wet][ref4],
      heeft hij tot het moment dat hij in een hogere salarisschaal wordt geplaatst, aanspraak op het verschil tussen
      bedoelde salarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0006942
      [ref2]: https://wetten.overheid.nl/BWBR0006942
      [ref3]: https://wetten.overheid.nl/BWBR0006942
      [ref4]: https://wetten.overheid.nl/BWBR0006942
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006942
      - id: ref2
        bwb_id: BWBR0006942
      - id: ref3
        bwb_id: BWBR0006942
      - id: ref4
        bwb_id: BWBR0006942
  - number: 49b.1
    text: |-
      Voor degene die op 30 juni 2007 met toepassing van [artikel 4a van het Besluit algemene rechtspositie politie]
      (onbekend) is aangesteld in tijdelijke dienst, blijft artikel 6a, zoals luidend op 30 juni 2007, van toepassing tot
      en met het tijdstip waarop hij hernieuwd in vaste dienst wordt aangesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel49b
  - number: 49b.2
    text: |-
      Voor degene die op 30 juni 2007 vanwege een verplaatsing aanspraak heeft op een vergoeding als bedoeld in artikel
      30a, blijft dat artikel, zoals luidend op 30 juni 2007, van toepassing voor de duur van die verplaatsing.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel49b
  - number: 49b.3
    text: |-
      Voor degene die op 30 juni 2007 is gedetacheerd en een functie uitoefent waaraan op grond van artikel 6 een hogere
      salarisschaal is verbonden, blijven de artikelen 4, 6 en 17b, zoals luidend op 30 juni 2007, van toepassing voor de
      duur van die detachering.
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel49b
  - number: 49c
    text: |-
      [Artikel 6, zesde lid, onderdeel d, en zevende lid][ref1], is tot en met 31 december 2006 niet van toepassing
      op een reorganisatie, anders dan een reorganisatie aangaande bovenregionale samenwerkingen, een voorziening
      tot samenwerking als bedoeld in de [artikelen 47][ref2] en [47a van de Politiewet][ref3] (Stb. 2005, 242) of
      veranderingen in de landelijke organisatie van de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel47a
    url: https://wetten.overheid.nl/BWBR0006517/2008-04-30#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0006299
        artikel: 47a
  - number: '50.1'
    text: |-
      De [artikelen 6 tot en met 10][ref1], [14 tot en met 17][ref2], [17b][ref3], [18][ref4], [20][ref5],
      [27 tot en met 30][ref6] zijn niet van toepassing op de aspirant met dien verstande dat de [artikelen 14][ref7],
      [18][ref8], [27][ref9], [27a][ref10] en [28][ref11] wel van toepassing zijn op de aspirant gedurende het praktisch
      opleidingsdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel17b
