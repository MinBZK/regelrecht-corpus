        artikel: '6'
        hoofdstuk: '2'
  - number: 50a
    text: |-
      De bedragen, genoemd in een van de bijlagen, behorende bij dit besluit, alsmede de bedragen, genoemd in de
      [artikelen 3a][ref1], [14][ref2], [18][ref3], [23][ref4], [25b][ref5], [27][ref6] en [29][ref7] kunnen bij
      regeling van Onze Minister worden gewijzigd, met dien verstande dat met uitzondering van de bedragen, genoemd in de
      [artikelen 14][ref8], [18][ref9] en [27][ref10], deze bedragen altijd worden aangepast overeenkomstig een algemene
      salarismaatregel in de sector Politie.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel3a
