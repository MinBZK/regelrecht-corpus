      [artikel 2, onderdeel a, van de Politiewet 2012][ref1], met uitzondering van de aspirant gedurende het theoretische
      opleidingsdeel, waarbij voor de toepassing van dit besluit de ambtenaar van de rijksrecherche, aangesteld voor de
      uitvoering van de politietaak, gelijk wordt gesteld aan de ambtenaar, bedoeld in artikel 2, onderdeel a, van de
