  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit wordt onder echtgenote of echtgenoot mede verstaan de geregistreerde partner
      alsmede de niet-gehuwde ambtenaar die met een levenspartner samenwoont en – met het oogmerk duurzaam samen te leven
      – een gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende de
      wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding. Onder weduwe
      of weduwnaar wordt mede begrepen de achtergebleven geregistreerde partner alsmede de achtergebleven levenspartner.
      Tegelijkertijd kan slechts een persoon als echtgenoot of echtgenote dan wel weduwe of weduwnaar worden aangemerkt.
      Het bevoegd gezag kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt
      dat een samenlevingscontract als bedoeld in de eerste volzin is gesloten.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel1
  - number: 1a
    text: 'Voor de toepassing van dit besluit wordt onder de volgende opleidingsniveau verstaan:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel1a
  - number: 1a.a
    text: |-
      niveau 2 of 3: niveau 2 of 3 als bedoeld in
      [artikel 7.2.2, derde lid, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 1a.b
    text: |-
      niveau 4: niveau 4 als bedoeld in [artikel 7.2.2, derde lid, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 1a.c
    text: |-
      niveau 5 of 6: het niveau dat op grond van
      [artikel 7.10a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] recht geeft op het voeren van
      de graad Bachelor of Master.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '2'
    text: |-
      De toekenning, de intrekking, de verhoging onderscheidenlijk de vermindering van het salaris, de toelagen, de
      vergoedingen, de uitkeringen, de tegemoetkoming in de representatiekosten, het salaris van de aspirant, en de
      gratificatie geschieden door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel2
  - number: '3.1'
    text: |-
      Voor de aspirant geldt een salarisschaal die is opgenomen in [bijlage II][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '3.2'
    text: 'Bij aanstelling wordt het salaris vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.2.a
    text: op het minimumbedrag van schaal 2a, voor de aspirant die een opleiding volgt op niveau 2;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.2.b
    text: op het minimumbedrag van schaal 3a, voor de aspirant die een opleiding volgt op niveau 3;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.2.c
    text: op het minimumbedrag van schaal 4a, voor de aspirant die een opleiding volgt op niveau 4;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.2.d
    text: op het minimumbedrag van schaal 5a, voor de aspirant die een opleiding volgt op niveau 5;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.2.e
    text: op het minimumbedrag van schaal 6a, voor de aspirant die een opleiding volgt op niveau 6.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van het eerste en tweede lid wordt voor de aspirant die direct voorafgaand aan de datum van
      aanstelling ten minste twaalf maanden aaneengesloten inkomen uit arbeid genoot het salaris bij aanstelling zodanig
      vastgesteld dat het salaris, vermeerderd met de vakantie-uitkering en eindejaarsuitkering, gelijk is dan wel direct
      ligt onder dit genoten inkomen:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.3.a
    text: in de volgens het tweede lid bij het opleidingsniveau behorende salarisschaal, of
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.3.b
    text: |-
      in de na afronding van de opleiding toepasselijke salarisschaal, bedoeld in het zevende lid, met dien verstande dat
      het salaris ten hoogste wordt vastgesteld op salarisregel 6 van de salarisschalen 4, 8 of 9, dan wel ten hoogste op
      salarisregel 7 van de salarisschalen 6 of 7.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: '3.4'
    text: |-
      Voor de hoogte van het inkomen uit arbeid, bedoeld in het derde lid, wordt uitgegaan van het gemiddelde vaste
      bruto inkomen over de periode van twaalf maanden, vermeerderd met de vakantie-uitkering en met een eventuele
      eindejaarsuitkering of dertiende maand.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: '3.5'
    text: |-
      Indien de aspirant, bedoeld in het tweede lid, naar het oordeel van het bevoegd gezag naar behoren functioneert,
      wordt het salaris telkens na het verstrijken van de periode die in de desbetreffende salarisschaal staat vermeld
      verhoogd tot het naasthogere bedrag in de schaal.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: '3.6'
    text: Indien de aspirant
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.6.a
    text: |-
      die is ingeschaald zoals bedoeld in het derde lid onderdeel a, naar het oordeel van het bevoegd gezag naar
      behoren functioneert, wordt het salaris telkens na één jaar verhoogd tot het naasthogere bedrag in de bij het
      opleidingsniveau behorende salarisschaal. Zodra het maximum van die salarisschaal is bereikt wordt het salaris
      telkens na één jaar verhoogd tot het naasthogere bedrag in de na afronding van de opleiding toepasselijke
      salarisschaal, tot maximaal salarisregel 5 van die schaal.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.6.b
    text: |-
      die is ingeschaald zoals bedoeld in het derde lid onderdeel b, naar het oordeel van het bevoegd gezag naar behoren
      functioneert, wordt het salaris telkens na één jaar verhoogd tot het naasthogere bedrag in de na afronding van de
      opleiding toepasselijke salarisschaal, tot ten hoogste het in het derde lid, onderdeel b, bedoelde salarisregel.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: '3.7'
    text: 'Na het succesvol afronden van de opleiding vindt aanstelling plaats:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.7.a
    text: in een functie waaraan salarisschaal 4 is verbonden van de aspirant die een opleiding heeft afgerond op niveau 2;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.7.b
    text: in een functie waaraan salarisschaal 6 is verbonden van de aspirant die een opleiding heeft afgerond op niveau 3;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.7.c
    text: in een functie waaraan salarisschaal 7 is verbonden van de aspirant die een opleiding heeft afgerond op niveau 4;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.7.d
    text: |-
      in een functie waaraan ten minste salarisschaal 8 is verbonden van de aspirant die een opleiding heeft afgerond op
      niveau 5;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3.7.e
    text: |-
      in een functie waaraan ten minste salarisschaal 9 is verbonden van de aspirant die een opleiding heeft afgerond op
      niveau 6,
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: '3.8'
    text: |-
      In uitzonderlijke individuele situaties kan het bevoegd gezag ten gunste van de aspirant afwijken van de leden twee
      tot en met zes.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3
  - number: 3 bis.1
    text: |-
      In afwijking van [artikel 3, eerste tot en met zesde lid][ref1], wordt voor aspiranten die de opleiding beginnen in
      de periode van 1 november 2010 tot en met 31 oktober 2013 het op grond van artikel 3, eerste tot en met zesde lid,
      geldende salaris gedurende de gehele opleidingsperiode gedurende het theoretisch opleidingsdeel met 50% verminderd.
      [Artikel 17a][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel17a
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3_bis
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: 17a
        hoofdstuk: '5'
  - number: 3 bis.2
    text: |-
      Onze Minister kan, in afwijking van het eerste lid, besluiten de vermindering van de salarissen van de aspiranten,
      bedoeld in het eerste lid, gelijkelijk te verdelen over het theoretische en het beroepspraktijkvorming deel.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3_bis
  - number: 3 bis.3
    text: |-
      Het bevoegd gezag kan, in geval van langdurige ziekte bij een aspirant, die op grond van dit artikel zijn salaris
      ontvangt, besluiten de vermindering van het salaris, bedoeld in het eerste lid, buiten beschouwing te laten.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3_bis
  - number: 3bis a.1
    text: |-
      Dit artikel is van toepassing op aspiranten die beginnen met de initiële opleiding
      vanaf 1 november 2013 tot 1 januari 2017 of de politieopleiding als bedoeld in
      [artikel 1, eerste lid, onderdeel s, onder 1°, van de Politiewet 2012][ref1] vanaf 1 januari 2017.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel1
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '1'
  - number: 3bis a.2
    text: |-
      Dit artikel is niet van toepassing op aspiranten die voorafgaand aan hun aanstelling minimaal twee jaar
      werkervaring hebben, waarbij zij minimaal 28 uur gemiddeld per week werkten met bijbehorende inkomsten van minimaal
      het minimumloon. Op deze aspiranten is [artikel 3][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '3'
        hoofdstuk: '1'
  - number: 3bis a.3
    text: |-
      Gedurende het eerste leerjaar bedraagt de tegemoetkoming voor de opleidingen de bij het opleidingsniveau genoemde
      bedrag in [bijlage IV][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 3bis a.4
    text: |-
      Gedurende het tweede leerjaar ontvangen aspiranten een salaris dat is opgenomen in [bijlage V][ref1] van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 3bis a.5
    text: |-
      Gedurende het derde leerjaar ontvangen aspiranten een salaris dat is opgenomen in [bijlage VI][ref1] van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 3bis a.6
    text: |-
      Gedurende het vierde leerjaar ontvangen aspiranten een salaris als bedoeld in [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 3bis a.7
    text: |-
      Gedurende het eerste leerjaar hebben de aspiranten geen recht op de toelagen en vergoedingen genoemd in dit
      besluit.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
  - number: 3bis a.8
    text: |-
      Gedurende het tweede, derde en indien van toepassing vierde leerjaar is [artikel 50, eerste lid][ref1], van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel50
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '50'
        hoofdstuk: '12'
  - number: 3bis a.9
    text: |-
      Gedurende de gehele politieopleiding, bedoeld in
      [artikel 1, eerste lid, onderdeel s, onder 1°, van de Politiewet 2012][ref1], is op de aspirant
      [artikel 17a][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel17a
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: 17a
        hoofdstuk: '5'
  - number: 3bis a.10
    text: 'Na het succesvol afronden van de opleiding vindt aanstelling plaats:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
  - number: 3bis a.10.a
    text: in een functie waaraan salarisschaal 4 is verbonden van de aspirant die een opleiding heeft afgerond op niveau 2;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
  - number: 3bis a.10.b
    text: in een functie waaraan salarisschaal 6 is verbonden van de aspirant die een opleiding heeft afgerond op niveau 3;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
  - number: 3bis a.10.c
    text: in een functie waaraan salarisschaal 7 is verbonden van de aspirant die een opleiding heeft afgerond op niveau 4;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
  - number: 3bis a.10.d
    text: |-
      in een functie waaraan ten minste salarisschaal 8 is verbonden van de aspirant die een opleiding heeft afgerond op
      niveau 5;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
  - number: 3bis a.10.e
    text: |-
      in een functie waaraan ten minste salarisschaal 9 is verbonden van de aspirant die een opleiding heeft afgerond op
      niveau 6,
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
  - number: 3bis a.11
    text: |-
      De bedragen genoemd in [bijlage IV][ref1] worden gewijzigd conform
      [artikel 17 van het Besluit studiefinanciering 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006517
      [ref2]: https://wetten.overheid.nl/BWBR0011545#Artikel17
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3bis_a
    references:
      - id: ref1
        bwb_id: BWBR0006517
      - id: ref2
        bwb_id: BWBR0011545
        artikel: '17'
  - number: 3a.1
    text: |-
      Het salaris van de vakantiewerker wordt vastgesteld op het maandbedrag van het minimumloon dat krachtens de
      [artikelen 7][ref1] en [8, eerste en derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref2] geldt voor
      werknemers van dezelfde leeftijd als de vakantiewerker, aangevuld met € 86,80 per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 3a.2
    text: Het salaris, bedoeld in het eerste lid, wordt verhoogd met 15,7%.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel3a
  - number: '4.1'
    text: Het salaris, de toelagen en de vergoedingen worden maandelijks betaald.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel4
  - number: '4.2'
    text: |-
      De aanspraak op het salaris, de toelagen, de vergoedingen en de uitkeringen vangt aan met ingang van de dag waarop
      de aanstelling ingaat.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel4
  - number: '4.3'
    text: |-
      Wanneer het salaris, een toelage als bedoeld in de [artikelen 12b][ref1], [12c][ref2], [12d][ref3],
      [15][ref4], [16][ref5], [17][ref6], [19][ref7], [20][ref8] en [21][ref9] of een uitkering als bedoeld in
      [artikel 23, tweede lid][ref10], moet worden berekend over een gedeelte van een kalendermaand, wordt het bedrag per
      dag vastgesteld door het maandbedrag te delen door het aantal dagen van de desbetreffende kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel12c
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel12d
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0006517#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0006517#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0006517#Artikel19
      [ref8]: https://wetten.overheid.nl/BWBR0006517#Artikel20
      [ref9]: https://wetten.overheid.nl/BWBR0006517#Artikel21
      [ref10]: https://wetten.overheid.nl/BWBR0006517#Artikel23
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 12b
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0006517
        artikel: 12c
        hoofdstuk: 3b
      - id: ref3
        bwb_id: BWBR0006517
        artikel: 12d
        hoofdstuk: 3b
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '15'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0006517
        artikel: '16'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0006517
        artikel: '17'
        hoofdstuk: '5'
      - id: ref7
        bwb_id: BWBR0006517
        artikel: '19'
        hoofdstuk: '5'
      - id: ref8
        bwb_id: BWBR0006517
        artikel: '20'
        hoofdstuk: '5'
      - id: ref9
        bwb_id: BWBR0006517
        artikel: '21'
        hoofdstuk: '5'
      - id: ref10
        bwb_id: BWBR0006517
        artikel: '23'
        hoofdstuk: '6'
  - number: '5'
    text: |-
      De ambtenaar ontvangt geen bezoldiging over de tijd gedurende welke hij opzettelijk nalaat zijn dienst te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel5
  - number: '6.1'
    text: Voor de ambtenaar geldt een salarisschaal.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
  - number: '6.2'
    text: Bij ministeriële regeling worden regels gesteld over de functies en de bij de functies behorende waardering.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
  - number: '6.3'
    text: |-
      Indien nog geen sprake is van volledige functievervulling, geldt voor de ambtenaar voor de duur van een jaar een
      lagere salarisschaal dan voor hem op grond van het tweede lid zou gelden. Het bevoegd gezag kan beslissen om de
      periode van een jaar tot twee jaar te verlengen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
  - number: '6.4'
    text: |-
      Indien de ambtenaar bij wijze van waarneming tijdelijk een andere functie uitoefent, blijft de voordien voor de
      ambtenaar geldende salarisschaal van toepassing.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
  - number: '6.5'
    text: |-
      Anders dan bij wijze van disciplinaire straf op grond van
      [hoofdstuk IX van het Besluit algemene rechtspositie politie][ref1], kan zonder voorafgaand ontslag,
      niet zijnde een ontslag dat de ambtenaar is verleend om als aspirant een politieopleiding als bedoeld in
      [artikel 1, eerste lid, onderdeel s, onder 1°, van de Politiewet 2012][ref2] te gaan volgen, voor een ambtenaar
      geen salarisschaal gaan gelden met een lager maximumsalaris dan dat van de reeds voor de ambtenaar geldende
      salarisschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#HoofdstukIX
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel1
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '1'
  - number: '6.6'
    text: 'Het vijfde lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
  - number: 6.6.a
    text: |-
      bij de bepaling van de salarisschaal, bedoeld in het tweede lid, tevens is bepaald dat de functie van de ambtenaar
      een tijdelijk karakter heeft en de salarisschaal in verband daarmee slechts tijdelijk zal gelden;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
  - number: 6.6.b
    text: |-
      indien de ambtenaar in verband met ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte wordt herplaatst
      in een andere functie;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
  - number: 6.6.c
    text: |-
      het salaris van de ambtenaar na het succesvol afronden van de opleiding wordt vastgesteld, met toepassing van
      [artikel 3, zevende lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '3'
        hoofdstuk: '1'
  - number: 6.6.d
    text: |-
      indien de ambtenaar, die is aangewezen als herplaatsingkandidaat als bedoeld in
      [hoofdstuk VII.B van het Besluit algemene rechtspositie politie][ref1], wordt herplaatst in een andere functie.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#HoofdstukVII.b
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        hoofdstuk: VII.b
  - number: '6.7'
    text: |-
      De lagere salarisschaal op grond van het zesde lid, onderdeel d, gaat niet eerder voor de ambtenaar gelden dan drie
      jaar nadat hij is herplaatst. Afhankelijk van het aantal dienstjaren van de ambtenaar wordt de termijn van drie
      jaar verlengd overeenkomstig de hierna volgende tabel:






                    dienstjaren:


                    verlenging:






                    25 of meer dienstjaren


                    één jaar




                    30 of meer dienstjaren


                    twee jaren




                    35 of meer dienstjaren


                    drie jaren




                    40 of meer dienstjaren


                    vier jaren




           Ingeval [artikel 55ob van het Besluit algemene rechtspositie politie][ref1] van toepassing is, gaat de
      hiervoor genoemde termijn pas lopen vanaf het tijdstip dat de ambtenaar het tweede aanbod, bedoeld in het tweede
      lid van dat artikel, dan wel het aanbod op het oorspronkelijke functieniveau voor invoering van het LFNP, bedoeld
      in het vijfde lid van dat artikel, heeft geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55ob
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55ob
  - number: '6.8'
    text: |-
      De lagere salarisschaal uit het zesde lid, onderdeel d, en het zevende lid, geldt niet indien de
      uitzondering van [artikel 55ra van het Besluit algemene rechtspositie politie][ref1] van toepassing
      is. De lagere salarisschaal geldt ook niet indien de ambtenaar niet op grond van het bepaalde in
      [artikel 55ob van het Besluit algemene rechtspositie politie][ref2] teruggeplaatst kan worden in een functie op
      zijn niveau van voor de invoering van het LFNP, omdat dit niveau niet passend is.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55ra
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel55ob
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55ra
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 55ob
  - number: '6.9'
    text: |-
      De ambtenaar kan een aanvraag indienen bij het bevoegd gezag wanneer zijn feitelijke werkzaamheden ten minste één
      jaar wezenlijk afwijken van zijn huidige, aan hem opgedragen LFNP functie, om de feitelijke werkzaamheden overeen
      te laten komen met een andere LFNP functie. Bij ministeriële regeling worden nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
  - number: '6.10'
    text: |-
      Voor de ambtenaar die in het kader van een detachering, bedoeld in
      [artikel 62 van het Besluit algemene rechtspositie politie][ref1], tijdelijk een andere functie uitoefent waaraan
      op grond van [artikel 6, tweede lid][ref2], een hogere salarisschaal is verbonden, geldt deze hogere salarisschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel6
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
  - number: '6.11'
    text: |-
      De regeling bedoeld in het tweede lid is ook van toepassing in het kader van het vaststellen van de salarisschaal
      van passende arbeid bij arbeidsongeschiktheid. Hierbij is de eigen of een andere functie uit het LFNP, of een deel
      van één of meerdere functies uit het LFNP bepalend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
  - number: '6.12'
    text: |-
      Indien een herplaatsingkandidaat, bedoeld in [artikel 55oa van het Besluit algemene rechtspositie politie][ref1]
      drie jaar na plaatsing op een lagere passende functie nog geen twee maal een passende functie op het oude
      functieniveau, inclusief ten minste 24 OVW punten is aangeboden, behoudt hij zijn oorspronkelijke salarisschaal, de
      inmiddels verworven OVW periodieken en de aanspraak op eventueel nog mogelijke OVW periodieken.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55oa
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55oa
  - number: '6.13'
    text: |-
      Indien een herplaatsingkandidaat, bedoeld in [artikel 55oa van het Besluit algemene rechtspositie politie][ref1]
      voor de tweede maal een aanbod van een passende functie op het niveau van de functie waarin hij was geplaatst voor
      aanwijzing als herplaatsingkandidaat, inclusief ten minste 24 OVW punten weigert, geldt met ingang van de eerste
      dag van de tweede maand nadat het tweede aanbod is gedaan, het salaris behorende bij de functie waarop de ambtenaar
      op dat moment is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55oa
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55oa
  - number: '8.1'
    text: |-
      Bij de aanstelling wordt het salaris vastgesteld op het minimum van de voor de ambtenaar geldende salarisschaal van
      [bijlage I][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '8.2'
    text: |-
      Van het eerste lid kan worden afgeweken door het toekennen van een hoger salaris in de voor de ambtenaar geldende
      salarisschaal, indien daartoe naar het oordeel van het bevoegd gezag aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel8
  - number: '8.3'
    text: |-
      Bij de aanstelling van de korpschef wordt zijn salaris vastgesteld conform [bijlage IA][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '9.1'
    text: |-
      Het salaris van de ambtenaar wordt verhoogd tot het naasthogere bedrag in de schaal, indien deze naar het oordeel
      van het bevoegd gezag de functie naar behoren vervult.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9
  - number: '9.2'
    text: |-
      Het salaris van de ambtenaar kan worden verhoogd tot een hoger bedrag in de schaal, indien deze naar het oordeel
      van het bevoegd gezag de functie zeer goed of uitstekend vervult.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9
  - number: '9.3'
    text: |-
      Vervult de ambtenaar de functie naar het oordeel van het bevoegd gezag niet naar behoren, dan blijft de in het
      eerste lid bedoelde salarisverhoging achterwege.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9
  - number: '9.4'
    text: |-
      De in het eerste en tweede lid bedoelde salarisverhoging wordt voor de eerste maal toegekend met ingang van de
      eerste dag van de maand waarin sinds de aanstelling een jaar is verstreken en nadien telkens na één jaar, tot het
      maximumsalaris van de geldende salarisschaal is bereikt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9
  - number: '9.5'
    text: |-
      Het tijdstip waarop ingevolge het vierde lid een salarisverhoging wordt toegekend, kan worden vervroegd ingeval
      daartoe naar het oordeel van het bevoegd gezag aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9
  - number: '9.6'
    text: |-
      Het oordeel van het bevoegd gezag over het vervullen van de functie door de ambtenaar, bedoeld
      in het tweede of derde lid, is gebaseerd op een bekrachtigde beoordeling als bedoeld in
      [artikel 71, tweede en vijfde lid, van het Besluit algemene rechtspositie politie][ref1], die betrekking heeft op
      een tijdvak dat eindigt binnen een jaar vóór de datum van het oordeel, bedoeld in het tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel71
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '71'
  - number: '9.7'
    text: |-
      Voor de ambtenaar die na het succesvol afronden van de opleiding is aangesteld met toepassing van
      [artikel 3, zevende lid][ref1], vindt de eerstvolgende salarisverhoging in afwijking van het vierde lid plaats een
      jaar na de laatste salarisverhoging, bedoeld in artikel 3, vijfde of zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '3'
        hoofdstuk: '1'
  - number: '9.8'
    text: |-
      In afwijking van het zevende lid vindt voor de ambtenaar die tijdens de opleiding was ingeschaald op grond
      van [artikel 3, derde lid, onderdeel b][ref1], de eerstvolgende salarisverhoging plaats in de eerstvolgende
      kalendermaand na het voltooien van de opleiding waarin een geheel aantal jaren is verstreken sinds de aspirant het
      maximum salarisbedrag op grond van artikel 3, zesde lid, onderdeel b, heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '3'
        hoofdstuk: '1'
  - number: 9a.1
    text: |-
      De ambtenaar die het maximum van de schaal behorende bij een functie met 24 of meer OVW punten, zoals opgenomen
      in bijlage 3, heeft bereikt, wordt, met behoud van deze schaal en met inachtneming van het tweede lid, extra
      periodieken ter hoogte van de in de volgende salarisschaal opgenomen periodieken toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9a
  - number: 9a.2
    text: |-
      Het toekennen van de periodieken bedoeld in het eerste lid, gebeurt overeenkomstig [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel9
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '9'
        hoofdstuk: '2'
  - number: 9a.3
    text: 'Uitgezonderd van het eerste lid is:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9a
  - number: 9a.3.a
    text: de ambtenaar die een functie bekleedt welke wordt gewaardeerd met schaal 15 of hoger;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9a
  - number: 9a.3.b
    text: |-
      de ambtenaar die leiding geeft aan een onderdeel of team waarin hoofdzakelijk ambtenaren werken met een functie met
      minder dan 24 OVW punten, of
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9a
  - number: 9a.3.c
    text: de ambtenaar die recht heeft op Flexibel Pensioen en Uittreden.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9a
  - number: 9a.4
    text: |-
      Het verkrijgen van de periodieken als bedoeld in het eerste lid heeft geen gevolgen voor de aan de functie
      gekoppelde rang.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9a
  - number: 9a.5
    text: |-
      De periodieken die op grond van dit artikel worden verkregen vervallen bij een vrijwillige overstap naar een
      functie met minder dan 24 OVW punten.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9a
  - number: 9a.6
    text: |-
      In afwijking van het eerste en tweede lid komt de ambtenaar met een functie waarvoor salarisschaal 14 of lager
      geldt niet in aanmerking voor trede 15 van salarisschaal 15.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel9a
  - number: '10.1'
    text: |-
      Ingeval van indeling in een hogere schaal wordt, met inachtneming van [artikel 11][ref1], het salaris van de
      ambtenaar in de nieuwe schaal vastgesteld op het salaris gelegen onmiddellijk boven het salaris dat de ambtenaar
      genoot.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel11
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '11'
        hoofdstuk: '2'
  - number: '10.2'
    text: |-
      In bijzondere gevallen kan het salaris worden vastgesteld op een hoger bedrag in de voor de ambtenaar geldende
      salarisschaal.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel10
  - number: '10.3'
    text: |-
      Indien de datum van indeling in de hogere schaal samenvalt met de datum waarop een verhoging als bedoeld in
      [artikel 9, eerste of tweede lid][ref1], plaatsvindt, vindt de indeling in de hogere schaal plaats voor de
      verhoging, bedoeld in artikel 9, eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel9
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '9'
        hoofdstuk: '2'
  - number: '10.4'
    text: |-
      Indien de ambtenaar OVW periodieken heeft verkregen en er sprake is van een vrijwillige overstap naar een
      functie met minder dan 24 OVW punten, vervallen de verkregen OVW periodieken en worden deze niet meegenomen in de
      berekening bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel10
  - number: '11'
    text: |-
      Het salaris van de ambtenaar met een andere betrekking dan een volledige betrekking wordt vastgesteld op een
      evenredig deel van het salaris bij een volledige betrekking.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel11
  - number: '12.1'
    text: Bij bijzondere prestaties kan een gratificatie worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12
  - number: '12.2'
    text: Het eerste lid is niet van toepassing op de ambtenaar met een functie waarvoor salarisschaal 15 of hoger geldt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12
  - number: 12a
    text: |-
      In dit hoofdstuk en [hoofdstuk 3b][ref1] wordt onder «berekeningsgrondslag» verstaan: de uitkomst van het
      pensioengevend inkomen, berekend zonder de toelagen, bedoeld in de [artikelen 12b][ref2], [12c][ref3] en
      [12d][ref4], en uitgaand van een volledige betrekkingsomvang, gedeeld door twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Hoofdstuk3b
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel12b
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel12c
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel12d
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        hoofdstuk: 3b
      - id: ref2
        bwb_id: BWBR0006517
        artikel: 12b
        hoofdstuk: 3a
      - id: ref3
        bwb_id: BWBR0006517
        artikel: 12c
        hoofdstuk: 3b
      - id: ref4
        bwb_id: BWBR0006517
        artikel: 12d
        hoofdstuk: 3b
  - number: 12b.1
    text: |-
      De ambtenaar heeft recht op een maandelijkse toelage inhoudende een algemene levensloopbijdrage van 0,75%
      van de berekeningsgrondslag. Bij een deelbetrekking wordt de levensloopbijdrage berekend naar rato van de
      betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12b
  - number: 12b.2
    text: In afwijking van het eerste lid bedraagt het in het eerste lid genoemde percentage in 2006 0,45%.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12b
  - number: 12b.3
    text: |-
      De ambtenaar op wie de [artikelen 88][ref1] en [88a van het Besluit algemene rechtspositie politie][ref2] van
      toepassing zijn, heeft geen recht op de toelage bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel88a
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 88a
  - number: 12c.1
    text: |-
      Aan de volgende ambtenaren, voor wie een salarisschaal geldt die lager is dan salarisschaal 12 van
      [bijlage I][ref1], wordt maandelijks een toelage bezwarende functie toegekend:


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 12c.1.a
    text: |-
      de aspirant, met uitzondering van de aspirant, aangesteld op grond van
      [artikel 3, eerste lid, van het Besluit algemene rechtspositie politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '3'
  - number: 12c.1.b
    text: de ambtenaar, aangesteld voor de uitvoering van de politietaak;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12c
  - number: 12c.1.c
    text: |-
      de ambtenaar, aangesteld voor administratieve, technische en andere taken ten dienste van de politie in een functie
      als bedoeld in [artikel 10, derde lid, van het Besluit algemene rechtspositie politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel10
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '10'
  - number: 12c.2
    text: |-
      Voor de ambtenaar in de functie van vlieger bij de landelijke eenheid wordt maandelijks de toelage bezwarende
      functie toegekend ongeacht de salarisschaal.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12c
  - number: 12c.3
    text: |-
      De toelage bezwarende functie wordt toegekend voor de duur van maximaal 25 jaar en uiterlijk tot de eerste dag
      van de maand volgend op die waarin de ambtenaar de AOW gerechtigde leeftijd heeft bereikt. Op de maximale duur van
      25 jaar wordt in mindering gebracht de periode waarover, voorafgaand aan de invoering van de toeslag bezwarende
      functie, rechten zijn genoten of opgebouwd waarvoor de toelage bezwarende functie in de plaats is gekomen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12c
  - number: 12c.4
    text: |-
      De toelage bezwarende functie bedraagt 1,8% van de berekeningsgrondslag. Bij een deelbetrekking wordt de toelage
      berekend naar rato van de betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12c
  - number: 12c.5
    text: |-
      In afwijking van het vierde lid bedraagt de toelage bezwarende functie in 2006 1,6% van de berekeningsgrondslag.
      Bij een deelbetrekking wordt de toelage berekend naar rato van de betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12c
  - number: 12c.6
    text: |-
      Bij een onderbreking van het dienstverband en een nieuwe aanstelling in politiedienst wordt een eventueel bestaand
      recht op de toelage bezwarende functie voortgezet. Er ontstaat geen recht op een nieuwe termijn van 25 jaar.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12c
  - number: 12c.7
    text: |-
      De ambtenaar op wie de [artikelen 88][ref1] en [88a van het Besluit algemene rechtspositie politie][ref2] van
      toepassing zijn, heeft geen recht op de toelage bedoeld in het eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel88a
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 88a
  - number: 12d.1
    text: 'Aan de ambtenaar wordt maandelijks een inhaaltoelage bezwarende functie toegekend, indien de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12d.1.a
    text: |-
      op 12 maart 1999 en op 31 december 2000 een functie vervulde waarvoor tot 1 januari 2001 een leeftijdsgrens gold op
      grond van [artikel 88, eerste lid, van het Besluit algemene rechtspositie politie][ref1], zoals dat luidde direct
      voor die datum;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
  - number: 12d.1.b
    text: op 1 januari 2001 jonger was dan 50 jaar; en
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12d.1.c
    text: |-
      vanaf 1 januari 2001 ononderbroken is aangesteld door een bevoegd gezag of opeenvolgend door meer dan één bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12d.2
    text: 'Voor de toepassing van het eerste lid, onderdeel c, wordt niet als onderbreking aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12d.2.a
    text: een onderbreking van maximaal twee maanden;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12d.2.b
    text: |-
      een onderbreking van maximaal vijf jaren gelegen tussen het tijdstip van ontslag in verband met
      arbeidsongeschiktheid en het tijdstip waarop de ambtenaar wederom de hoedanigheid van ambtenaar heeft verworven;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12d.2.c
    text: |-
      een onderbreking van maximaal achttien maanden gelegen tussen een tijdstip met ingang waarvan de ambtenaar,
      al dan niet na ontslag, recht op een ontslaguitkering of een wachtgelduitkering of een uitkering op grond van
      het [Besluit bovenwettelijke werkloosheidsuitkering politie][ref1], heeft verkregen en het tijdstip waarop die
      ambtenaar opnieuw de hoedanigheid van ambtenaar heeft verworven;


      [ref1]: https://wetten.overheid.nl/BWBR0012022
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0012022
  - number: 12d.2.d
    text: |-
      een onderbreking van maximaal vier jaren gelegen tussen het tijdstip van ontslag in verband met zorgtaken en het
      tijdstip waarop de ambtenaar opnieuw de hoedanigheid van ambtenaar heeft verworven.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12d.3
    text: |-
      De inhaaltoelage bezwarende functie wordt toegekend tot de eerste dag van de maand volgend op die waarin de
      ambtenaar de leeftijd van 60 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12d.4
    text: |-
      De inhaaltoelage bezwarende functie bedraagt een percentage van de berekeningsgrondslag. Het percentage wordt
      bepaald door het bevoegd gezag die daartoe wordt geadviseerd door de Stichting pensioenfonds ABP. Bij regeling van
      Onze Minister worden nadere regels gesteld over de berekeningsgrondslag.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12d.5
    text: |-
      De ambtenaar, bedoeld in het eerste lid, die bij eerste indiensttreding in een functie als bedoeld in het eerste
      lid, onderdeel a, 35 jaar of ouder was, komt in aanmerking voor een aanvullend percentage bovenop het percentage,
      bedoeld in vierde lid. Het aanvullende percentage wordt bepaald door het bevoegd gezag die daartoe wordt
      geadviseerd door de Stichting pensioenfonds ABP. Bij regeling van Onze Minister worden nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12d.6
    text: |-
      In het geval de ambtenaar niet of niet volledig in het genot is van zijn volledige bezoldiging, heeft dit geen
      gevolgen voor de toekenning van de inhaaltoelage bezwarende functie.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12d.7
    text: |-
      Eenmaal vastgesteld loopt de inhaaltoelage bezwarende functie door tot het moment dat de ambtenaar de leeftijd van
      60 jaar bereikt dan wel de politie vóór die leeftijd verlaat. Veranderingen van functie, betrekkingsomvang, status
      of salarisschaal hebben geen effect op de duur en het vastgestelde percentage.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12d
  - number: 12e
    text: |-
      De ambtenaar kan het bevoegd gezag verzoeken de bijdrage en toelagen, bedoeld
      in de [artikelen 12b tot en met 12d][ref1], aan te wenden voor de ingevolge
      [artikel 47a Besluit algemene rechtspositie politie][ref2] getroffen levensloopvoorziening. Bij het uitblijven
      van een dergelijk verzoek keert het bevoegd gezag deze bijdragen en toelagen uit als onderdeel van de maandelijkse
      salarisbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel47
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 12b
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '47'
  - number: 12f.1
    text: |-
      Onder ambtenaar in dit artikel wordt verstaan de ambtenaar, die op 1 januari 2006 recht heeft op een uitkering
      krachtens de [Wet op de arbeidsongeschiktheidsverzekering][ref1] of die in de periode van 1 januari 2006 tot 1
      januari 2008 recht heeft verkregen op een uitkering krachtens de [Wet werk en inkomen naar arbeidsvermogen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
  - number: 12f.2
    text: |-
      De ambtenaar kan het bevoegd gezag melden de bijdrage en toelagen, bedoeld in de
      [artikelen 12b tot en met 12d][ref1], in afwijking van [artikel 12e][ref2], te willen besteden, door:


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel12e
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 12b
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0006517
        artikel: 12e
        hoofdstuk: 3c
  - number: 12f.2.a
    text: geheel of gedeeltelijk verlof op te nemen;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
  - number: 12f.2.b
    text: de waarde van de levensloopbijdrage geheel of ten dele uit te laten betalen;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
  - number: 12f.2.c
    text: geheel of ten dele af te zien van de levensloopbijdrage; of
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
  - number: 12f.2.d
    text: een combinatie van onderdelen a, b en c te kiezen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
  - number: 12f.3
    text: |-
      Indien de ambtenaar kiest voor besteding van de bijdrage en toelagen, bedoeld in het tweede lid, onderdeel b, merkt
      het bevoegd gezag op zijn verzoek de levensloopbijdrage bij uitbetaling eenmalig niet als pensioengevend inkomen
      aan.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
  - number: 12f.4
    text: 'De in het tweede lid vermelde keuzes worden:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
  - number: 12f.4.a
    text: eenmalig gemaakt, waar het de uitvoering betreft over de periode 2006 tot en met 2013, en
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
  - number: 12f.4.b
    text: jaarlijks gemaakt ten aanzien van de uitvoering vanaf het kalenderjaar 2014.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
  - number: 12f.5
    text: |-
      Indien de levensloopbijdragen, bedoeld in de [artikelen 12b tot en met 12d][ref1], die betrekking hebben op
      de in het vierde lid, onder a genoemde periode, reeds zijn uitbetaald of zijn aangewend voor de ingevolge
      [artikel 47a Besluit algemene rechtspositie politie][ref2] getroffen levensloopvoorziening, is het tweede lid niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel47a
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 12b
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 47a
  - number: 12f.6
    text: Bij ministeriele regeling worden nadere regels gesteld over de melding, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12f
  - number: 12g.1
    text: |-
      Aan de ambtenaar met een op 1 januari van het desbetreffende kalenderjaar pensioengevend inkomen
      dat zonder toepassing van artikel 3.1, tweede lid, van het pensioenreglement het bedrag, bedoeld in
      [artikel 18ga, eerste lid, van de Wet op de Loonbelasting 1964][ref1] overschrijdt, wordt maandelijks een bruto
      uitkering verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18ga
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18ga
  - number: 12g.2
    text: |-
      De bruto uitkering bedraagt een twaalfde deel van de in het eerste lid bedoelde overschrijding, vermenigvuldigd
      met het voor dat kalenderjaar geldende percentage in de premie voor ouderdoms- en nabestaandenpensioen, genoemd in
      artikel 4.3 van het pensioenreglement, voor zover het betreft het werkgeversdeel.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel12g
  - number: '14.1'
    text: Aan de ambtenaar wordt een operationele toelage toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel14
  - number: '14.2'
    text: |-
      De operationele toelage wordt berekend per periode van vier weken en bedraagt voor elk uur waarop de ambtenaar
      werkelijke dienst verricht dan wel werkelijke dienst zou hebben verricht indien de ambtenaar niet binnen een
      tijdvak van vier dagen direct daaraan voorafgaande door het bevoegde gezag tot dienstverrichting op andere
      tijdstippen geroepen was:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel14
  - number: 14.2.a
    text: |-
      over de uren in het tijdvak van maandag tot en met donderdag van 21.00 tot 07.00 uur, op vrijdag van 21.00 tot
      22.00 uur, en op zaterdag en zondag van 07.00 tot 22.00 uur, € 4,02; en
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel14
  - number: 14.2.b
    text: |-
      over de uren in het tijdvak van 22.00 tot 07.00 uur in de weekendnachtdiensten, daaronder begrepen de diensten in
      de nacht voor en de nacht na een weekend of een feestdag, genoemd in het derde lid, € 6,03.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel14
  - number: '14.3'
    text: |-
      Hetgeen in het tweede lid ten aanzien van het verrichten van dienst op zaterdag en zondag is bepaald, geldt mede
      voor het verrichten van dienst op de Nieuwjaarsdag, de tweede Paasdag, de Hemelvaartsdag, de tweede Pinksterdag, de
      beide Kerstdagen en de dag waarop de verjaardag van de Koning wordt gevierd.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel14
  - number: '14.4'
    text: |-
      De operationele toelage wordt in gevallen van zwangerschap, zwangerschaps- en bevallingsverlof of ziekte van de
      ambtenaar gesteld op het bedrag dat de ambtenaar in de drie perioden van vier weken, onmiddellijk voorafgaande
      aan de periode van vier weken waarin de zwangerschap, zwangerschap- en bevallingsverlof of ziekte is aangevangen,
      gemiddeld aan toelage op grond van dit artikel heeft genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel14
  - number: '14.5'
    text: |-
      Het eerste tot en met vierde lid zijn niet van toepassing op de ambtenaar met een functie waarvoor salarisschaal 15
      of hoger geldt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel14
  - number: '14.6'
    text: |-
      De bedragen, genoemd in het tweede lid, worden overeenkomstig een algemene salarismaatregel in de sector Politie
      aangepast.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel14
  - number: '15.1'
    text: 'De ambtenaar van wie de bezoldiging voldoet aan de volgende voorwaarden, wordt een aflopende toelage toegekend:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel15
  - number: 15.1.a
    text: |-
      de bezoldiging van de betreffende ambtenaar heeft als gevolg van het beëindigen of verminderen van de operationele
      toelage een blijvende of tijdelijke verlaging ondergaan;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel15
  - number: 15.1.b
    text: |-
      het gemiddelde bedrag dat de ambtenaar aan operationele toelage heeft genoten in de twaalf maanden voorafgaande
      aan de verlaging bedraagt ten minste 3% van het salaris van de ambtenaar in de nieuwe situatie op het moment dat de
      verlaging ingaat;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel15
  - number: 15.1.c
    text: |-
      de ambtenaar heeft, tenzij sprake is van een tijdelijke verlaging van de bezoldiging als bedoeld onder a, direct
      voorafgaande aan het tijdstip van de beëindiging of de vermindering de operationele toelage gedurende ten minste
      twee jaren zonder wezenlijke onderbreking genoten; en
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel15
  - number: 15.1.d
    text: |-
      het beëindigen of verminderen van de operationele toelage, bedoeld onder a, is veroorzaakt buiten toedoen van de
      betrokken ambtenaar zelf, tenzij de vermindering het gevolg is van een verplaatsing of wijziging van de plaats
      van tewerkstelling op eigen verzoek, dan wel een aanstelling in een andere functie binnen het eigen korps op
      eigen verzoek, dan wel een aanstelling bij een ander korps ten behoeve van het uitoefenen van een functie bij een
      bovenregionale samenwerkingsvoorziening.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel15
  - number: '15.2'
    text: |-
      In afwijking van het eerste lid wordt aan de ambtenaar van 55 jaar of ouder wiens bezoldiging als gevolg van het
      beëindigen of verminderen van de operationele toelage, bedoeld in [artikel 14][ref1], een blijvende verlaging
      ondergaat, een blijvende toelage toegekend, mits de ambtenaar eerstbedoelde toelage direct voorafgaande aan het
      tijdstip van deze beëindiging of vermindering ervan, gedurende tenminste tien jaren zonder wezenlijke onderbreking
      heeft genoten en mits wordt voldaan aan de in het eerste lid onder b en d genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel14
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
  - number: '15.3'
    text: |-
      De in het eerste lid bedoelde aflopende toelage na een blijvende verlaging van de bezoldiging gaat, wanneer de
      ambtenaar de leeftijd van 55 jaar bereikt en onmiddellijk vóór de aanvang van die toelage gedurende tenminste tien
      jaren zonder wezenlijke onderbreking de operationele toelage, bedoeld in [artikel 14][ref1] heeft genoten, over in
      een blijvende toelage als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel14
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
  - number: '15.4'
    text: |-
      Voor de toepassing van dit artikel wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      twee maanden.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel15
  - number: '15.5'
    text: |-
      Voor de ambtenaar die is aangesteld voor de uitvoering van technische, administratieve en andere taken
      ten dienste van de politie en geen door het bevoegd gezag aangewezen functie vervult als bedoeld in
      [artikel 10, derde lid, van het Besluit algemene rechtspositie politie][ref1], wordt in het tweede en derde lid van
      dit artikel in plaats van «55 jaar» telkens gelezen: 60 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel10
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '10'
  - number: '15.6'
    text: |-
      Onze Minister stelt nadere regels vast over de berekeningswijze van de toelage en over de gevallen waarin sprake is
      van een blijvende of tijdelijke verlaging van de bezoldiging als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel15
  - number: '15.7'
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing op de ambtenaar met een functie waarvoor salarisschaal 15 of
      hoger geldt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel15
  - number: '16.1'
    text: |-
      Indien naar het oordeel van het bevoegd gezag sprake is van zeer goede of uitstekende vervulling van de functie
      kan voor de duur van een jaar een toelage worden toegekend aan de ambtenaar die het maximumsalaris van de voor hem
      geldende salarisschaal heeft bereikt indien de salarisschaal niet meer dan schaal 14 bedraagt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel16
  - number: '16.2'
    text: |-
      Indien naar het oordeel van het bevoegd gezag sprake is van zeer goede of uitstekende vervulling van de functie en
      daartoe op grond van bijzondere omstandigheden aanleiding bestaat, kan een toelage voor een langere duur dan een
      jaar worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel16
  - number: '16.3'
    text: 'De toelage bedraagt voor de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel16
  - number: 16.3.a
    text: |-
      ingedeeld in schaal 1 tot en met 9 van [bijlage I][ref1] van dit besluit: ten hoogste 6% van het voor de ambtenaar
      geldende maximumsalaris;


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 16.3.b
    text: |-
      ingedeeld in schaal 10, 11, 12 of 13 van [bijlage I][ref1] van dit besluit: ten hoogste 9% van het voor de
      ambtenaar geldende maximumsalaris;


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 16.3.c
    text: |-
      ingedeeld in schaal 14 van [bijlage I][ref1] van dit besluit: ten hoogste 12% van het voor de ambtenaar geldende
      maximumsalaris.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 16a.1
    text: |-
      Aan de ambtenaar met een functie waarvoor salarisschaal 15 of hoger geldt kan het bevoegd gezag een incidentele
      toelage toekennen vanwege uitzonderlijke prestaties die het voldoende functioneren overtreffen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel16a
  - number: 16a.2
    text: 'De toekenning uit het eerste lid is alleen mogelijk in de volgende situaties:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel16a
  - number: 16a.2.a
    text: het behalen van uitzonderlijke resultaten waarover vooraf werk- en prestatieafspraken zijn gemaakt; of
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel16a
  - number: 16a.2.b
    text: het leveren van eenmalige onvoorziene uitzonderlijke prestaties.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel16a
  - number: 16a.3
    text: De incidentele toelage bedraagt op jaarbasis maximaal één maandsalaris.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel16a
  - number: '17.1'
    text: |-
      Aan de ambtenaar die bij wijze van waarneming tijdelijk een functie uitoefent die bij toepassing van
      [artikel 6, tweede lid][ref1], zou leiden tot een salarisschaal met een hoger maximumsalaris, kan voor de duur van
      die waarneming een toelage worden toegekend. Onder waarneming wordt verstaan het krachtens een daartoe strekkende
      aanwijzing van het bevoegd gezag tijdelijk verrichten van een samenstel van werkzaamheden dat een andere functie
      vormt dan die van de ambtenaar zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
  - number: '17.2'
    text: |-
      De toelage wordt, tenzij bijzondere omstandigheden aanwezig zijn, slechts toegekend wanneer de waarneming een
      tijdvak van ten minste dertig dagen heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel17
  - number: '17.3'
    text: |-
      Bij volledige waarneming van de functie, bedoeld in het eerste lid, is het bedrag van de toelage gelijk aan het
      verschil tussen het salaris dat de ambtenaar geniet en het salaris dat de ambtenaar zou genieten, wanneer de
      salarisschaal met het hogere maximumsalaris met ingang van de dag waarop de waarneming is begonnen, voor hem zou
      hebben gegolden. Onder volledige waarneming wordt verstaan een zodanige waarneming dat in plaats van de eigen
      functie het volledige samenstel van werkzaamheden van de waargenomen functie, met de daarmee gepaard gaande
      verantwoordelijkheden, wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel17
  - number: '17.4'
    text: |-
      Voor de toepassing van het derde lid wordt onder salaris mede verstaan de toelagen, bedoeld in de
      [artikelen 14][ref1], [15][ref2], [18][ref3] en [20][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel20
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '15'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '18'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '20'
        hoofdstuk: '5'
  - number: '17.5'
    text: |-
      Bij niet volledige waarneming wordt de toelage, afhankelijk van de mate van onvolledigheid van de waarneming,
      vastgesteld op 50% of 75% van de toelage bij volledige waarneming.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel17
  - number: '17.6'
    text: |-
      De ambtenaar voor wie het een onderdeel is van de eigen functie om als plaatsvervanger op te treden van degene
      wiens functie moet worden waargenomen, komt bij niet volledige waarneming van die functie niet in aanmerking voor
      een toelage.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel17
  - number: 17a.1
    text: |-
      Indien het salaris behorend bij een volledige werktijd minder is dan het maandbedrag van
      het minimumloon, dat krachtens de [artikelen 7][ref1], [8, eerste en derde lid][ref2], en
      [14 van de Wet minimumloon en minimumvakantiebijslag][ref3] geldt voor werknemers van dezelfde leeftijd als de
      ambtenaar, wordt deze een toelage toegekend ten bedrage van het verschil.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '14'
  - number: 17a.2
    text: |-
      Voor de ambtenaar met een andere betrekking dan een volledige betrekking, wordt de toelage als bedoeld in het
      eerste lid naar evenredigheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel17a
  - number: '18.1'
    text: Aan de ambtenaar aan wie consignatie wordt opgelegd, wordt, behoudens het derde lid, een toelage toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel18
  - number: '18.2'
    text: |-
      Voor consignatie gedurende een tijdvak van korter dan een half uur boven de voor de ambtenaar vastgestelde
      dagelijkse diensttijd wordt geen toelage toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel18
  - number: '18.3'
    text: De toelage voor consignatie bedraagt € 2,03 voor elk uur dat de ambtenaar consignatie is opgelegd.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel18
  - number: '18.4'
    text: |-
      De in het derde lid genoemde toelage wordt zo spoedig mogelijk uitbetaald, doch uiterlijk bij gelegenheid van de
      tweede salarisbetaling volgende op de periode van vier weken waarin consignatie is verricht.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel18
  - number: '18.5'
    text: |-
      Van de in het vierde lid gestelde termijn kan worden afgeweken indien het dienstbelang dat vereist of, indien het
      dienstbelang zich daartegen niet verzet, op verzoek van de ambtenaar. Voor de hier bedoelde gevallen wordt een
      nieuwe uiterste termijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel18
  - number: '18.6'
    text: |-
      Indien een ambtenaar aan wie consignatie is opgelegd, binnen het tijdvak van consignatie werkzaamheden moet
      verrichten, is voor de duur van die werkzaamheden sprake van het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel18
  - number: '18.7'
    text: |-
      Voor de toepassing van dit artikel worden gedeelten van uren, voorzover daarmee het half uur, bedoeld in het tweede
      lid, wordt overschreden, berekend over een periode van vier weken, opgeteld en naar boven afgerond op halve uren.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel18
  - number: '18.8'
    text: |-
      De toelage voor consignatie wordt in geval van aangepaste werkzaamheden in verband met zwangerschap, zwangerschap-
      en bevallingsverlof of ziekte van de ambtenaar gesteld op het bedrag dat de ambtenaar in de drie perioden van vier
      weken, onmiddellijk voorafgaande aan de periode van vier weken waarin de aangepaste werkzaamheden in verband met
      zwangerschap, zwangerschap- en bevallingsverlof of ziekte is aangevangen, gemiddeld aan toelage op grond van dit
      artikel heeft genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel18
  - number: '18.9'
    text: |-
      Voor de toepassing van dit artikel berust het oordeel omtrent het dienstbelang bij het bevoegd gezag dan wel bij de
      door deze aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel18
  - number: '18.10'
    text: Het eerste lid is niet van toepassing op de ambtenaar met een functie waarvoor salarisschaal 15 of hoger geldt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel18
  - number: '18.11'
    text: |-
      Het bedrag, genoemd in het derde lid, wordt overeenkomstig een algemene salarismaatregel in de sector Politie
      aangepast.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel18
  - number: '19.1'
    text: |-
      Aan de ambtenaar kan een toelage worden toegekend om reden van werving of behoud tot een maximum van € 45.400,–
      per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel19
  - number: '19.2'
    text: Het eerste lid is niet van toepassing op de ambtenaar met een functie waarvoor salarisschaal 15 of hoger geldt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel19
  - number: '20.1'
    text: |-
      Aan de ambtenaar kan als tegemoetkoming in de representatiekosten een toelage worden toegekend tot een maximum van
      5% van het salaris.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20
  - number: '20.2'
    text: 'De ambtenaar die een vergoeding als bedoeld in het eerste lid ontvangt, kan de volgende kosten niet declareren:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20
  - number: 20.2.a
    text: kosten in verband met aanschaf van kleding en schoeisel;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20
  - number: 20.2.b
    text: kosten in verband met aanpassing en inrichting van de eigen woning;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20
  - number: 20.2.c
    text: kosten in verband met persoonlijke verzorging;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20
  - number: 20.2.d
    text: kosten in verband met ontvangsten van bescheiden omvang in de eigen woning;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20
  - number: 20.2.e
    text: fooien;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20
  - number: 20.2.f
    text: |-
      het aanbieden van een drankje en rookwaar aan een zakenrelatie tijdens een bespreking, anders dan een lunch of
      een diner;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20
  - number: 20.2.g
    text: |-
      het aanbieden van attenties of geschenken ter zake van recepties, jubilea en dergelijke aan medewerkers, collega’s
      of zakenrelaties;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20
  - number: 20.2.h
    text: |-
      vakliteratuur, abonnementen en kantoorbenodigdheden, voor zover deze niet rechtstreeks door de werkgever worden
      betaald;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20
  - number: 20.2.i
    text: contributies vakvereniging, niet zijnde een beroepsvereniging.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20
  - number: 20a.1
    text: |-
      Aan de ambtenaar met een functie waarvoor salarisschaal 15 of hoger geldt, kan een periodieke toelage worden
      toegekend door het bevoegd gezag in het kader van de individuele ontwikkeling in de functie, het individueel
      structureel goed functioneren, werving en behoud of een andere gewichtige reden.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20a
  - number: 20a.2
    text: 'De maximale hoogte van de periodieke toelage is voor:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20a
  - number: 20a.2.a
    text: de landelijke korpschef € 21.000,– per jaar;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20a
  - number: 20a.2.b
    text: |-
      korpsleiding, plaatsvervangend korpschef en politiechefs, politiechefs, de directeur van de Politieacademie en zijn
      plaatsvervanger 11% van het persoonlijke salaris per jaar;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20a
  - number: 20a.2.c
    text: overige ambtenaren van schaal 15 tot en met 18 11% van het persoonlijke salaris per jaar.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20a
  - number: 20a.3
    text: |-
      Het besluit tot toekennen en de hoogte van de periodieke toelage zal jaarlijks aan het eind van elk kalenderjaar
      opnieuw worden getoetst.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel20a
  - number: '21.1'
    text: |-
      In uitzonderlijke gevallen kan aan de ambtenaar of aan een groep van ambtenaren een toelage worden toegekend op
      andere gronden dan die vermeld in de [artikelen 16 tot en met 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel16
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '16'
        hoofdstuk: '5'
  - number: '21.2'
    text: |-
      Een in het eerste lid bedoelde toelage kan aan de ambtenaar worden toegekend nadat Onze Minister ter zake nadere
      regels heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel21
  - number: '22'
    text: |-
      Een krachtens [artikel 16][ref1], [19][ref2] of [21][ref3] toegekende toelage wordt ingetrokken, indien de
      gronden waarop de toelage wordt toegekend niet meer aanwezig zijn, tenzij het bevoegd gezag van oordeel is dat er
      omstandigheden zijn om de toelage geheel of gedeeltelijk te handhaven.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel21
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '16'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '19'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '21'
        hoofdstuk: '5'
  - number: '23.1'
    text: De ambtenaar heeft recht op een vakantie-uitkering die 8% van de genoten bezoldiging bedraagt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel23
  - number: '23.2'
    text: |-
      De vakantie-uitkering bedraagt ten minste € 155,07 per maand, met dien verstande dat dit bedrag naar evenredigheid
      wordt verminderd indien:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel23
  - number: 23.2.a
    text: |-
      de bezoldiging van de ambtenaar niet op de eerste dag van een maand aanvangt, dan wel indien de ambtenaar in een
      deel van een maand geen bezoldiging heeft genoten;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel23
  - number: 23.2.b
    text: |-
      de ambtenaar in de loop van een maand slechts een gedeelte van zijn bezoldiging heeft genoten wegens verleend
      verlof, in verband met non-activiteit, bij wijze van disciplinaire straf of uit hoofde van schorsing.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel23
  - number: '23.3'
    text: |-
      Het in het tweede lid genoemde bedrag wordt voor de ambtenaar met een andere betrekking dan een volledige
      betrekking naar evenredigheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel23
  - number: '23.4'
    text: |-
      Voor de toepassing van het eerste lid wordt de ambtenaar geacht in het genot van de volle bezoldiging te zijn,
      indien hij
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel23
  - number: 23.4.a
    text: |-
      niet zijn volledige bezoldiging geniet op grond van de artikelen [13a][ref1], [28b][ref2] en
      [41 van het Besluit algemene rechtspositie politie][ref3] of op grond van de [artikelen 32 tot en met 37][ref4]
      en [38][ref5],


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13a
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 28b
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '41'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '32'
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: 23.4.b
    text: |-
      een uitkering op grond van de [Wet arbeid en zorg][ref1] ontvangt,


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 23.4.c
    text: |-
      een aanvulling op zijn ZW-uitkering geniet op grond van [artikel 39a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel39a
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 39a
        hoofdstuk: '10'
  - number: 23.4.d
    text: |-
      niet zijn volledige salaris geniet vanwege een inhouding op dat salaris op grond van de Regeling levensloop
      politie.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel23
  - number: '23.5'
    text: |-
      De ambtenaar, bedoeld in [artikel 33][ref1], geniet de vakantie-uitkering slechts voor zoveel die uitgaat boven de
      vakantie-uitkering waarop hij als militair aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel33
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '33'
        hoofdstuk: '9'
  - number: '24'
    text: |-
      [Artikel 23][ref1] is mede van toepassing op de gewezen ambtenaar die ingevolge [artikel 42][ref2] nog bezoldiging
      geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel42
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '23'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '42'
        hoofdstuk: '10'
  - number: '25.1'
    text: |-
      De vakantie-uitkering wordt eenmaal per jaar betaald over de periode van twaalf maanden die is aangevangen met de
      maand juni van het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25
  - number: '25.2'
    text: |-
      Bij ontslag van de ambtenaar vindt betaling plaats over het tijdvak, gelegen tussen het einde van de laatst
      verstreken periode waarover de vakantie-uitkering is betaald en de datum van het ontslag.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25
  - number: '25.3'
    text: |-
      Voor de toepassing van dit artikel wordt met het ontslag van de ambtenaar gelijkgesteld de beëindiging van de
      doorbetaling van de bezoldiging van de gewezen ambtenaar, bedoeld in [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel24
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '24'
        hoofdstuk: '6'
  - number: 25a.1
    text: Aan de ambtenaar kan een incidentele eindejaarsuitkering of een eenmalige uitkering worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25a
  - number: 25a.2
    text: |-
      Ten aanzien van de incidentele eindejaarsuitkering of eenmalige uitkering, bedoeld in het eerste lid, stelt Onze
      Minister nadere regels vast met betrekking tot de hoogte van de uitkering en het tijdstip van uitbetaling, en
      bepaalt Onze Minister of de uitkering behoort tot de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25a
  - number: 25a.3
    text: Dit artikel is niet van toepassing op de ambtenaar met een functie waarvoor schaal 15 of hoger geldt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25a
  - number: 25b.1
    text: |-
      De ambtenaar heeft recht op een eindejaarsuitkering ten bedrage van 8% van het door hem in dat jaar genoten salaris
      en de compensatie, bedoeld in [artikel 38, tiende lid][ref1], dan wel in [artikel 38b, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel38b
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: 38b
        hoofdstuk: '10'
  - number: 25b.2
    text: |-
      De eindejaarsuitkering bedraagt tenminste € 155,07 per maand met dien verstande dat dit bedrag naar evenredigheid
      wordt verminderd indien:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
  - number: 25b.2.a
    text: |-
      het salaris van de ambtenaar niet op de eerste dag van een maand is aangevangen, dan wel indien de ambtenaar een
      deel van een maand geen salaris heeft genoten;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
  - number: 25b.2.b
    text: de ambtenaar in de loop van een maand slechts een gedeelte van zijn salaris heeft genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
  - number: 25b.3
    text: |-
      Het in het tweede lid genoemde bedrag wordt voor de ambtenaar met een andere betrekking dan een volledige
      betrekking naar evenredigheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
  - number: 25b.4
    text: 'In afwijking van het eerste en tweede lid heeft de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
  - number: 25b.4.a
    text: |-
      in het jaar 2001 recht op een eindejaarsuitkering ter grootte van 2,50% van het door hem in dat jaar genoten
      salaris;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
  - number: 25b.4.b
    text: |-
      in het jaar 2002 recht op een eindejaarsuitkering ter grootte van 5,25% van het door hem in dat jaar genoten
      salaris, doch ten minste € 81,40 per maand gedurende de eerste helft van dat jaar en ten minste € 82,21 per maand
      gedurende de tweede helft van dat jaar, met dien verstande dat dit bedrag overeenkomstig het tweede en derde lid
      naar evenredigheid wordt verminderd.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
  - number: 25b.5
    text: 'Indien de ambtenaar recht heeft op een uitkering op grond van:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
  - number: 25b.5.a
    text: |-
      de [WIA][ref1], voor zover de ambtenaar nog niet is herplaatst op grond van
      [artikel 49b van het Besluit algemene rechtspositie politie][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel49b
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 49b
  - number: 25b.5.b
    text: |-
      de [Ziektewet][ref1] of de [Wet arbeid en zorg][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
  - number: 25b.6
    text: |-
      Indien de ambtenaar vanwege een inhouding op grond van de [Regeling levensloop politie][ref1] niet zijn volledige
      salaris geniet, wordt voor de toepassing van dit artikel het salaris in aanmerking genomen zoals dit zou zijn
      genoten indien geen sprake zou zijn geweest van een inhouding op het salaris vanwege die regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0033849
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0033849
  - number: 25b.7
    text: |-
      Indien voor de ambtenaar het feitelijke genot van de bezoldiging is teruggebracht tot het bedrag van het op de
      ambtenaar te verhalen gedeelte van de pensioenbijdrage, wordt hij voor de toepassing van dit artikel geacht geen
      salaris te genieten.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
  - number: 25b.8
    text: De eindejaarsuitkering wordt eenmaal per kalenderjaar in de maand december betaald.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
  - number: 25b.9
    text: |-
      Bij ontslag van de ambtenaar vindt betaling plaats conform het bepaalde in het tweede en zesde lid over het tijdvak
      gelegen tussen het einde van de laatste verstreken periode waarover de eindejaarsuitkering is betaald en de datum
      van het ontslag.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel25b
  - number: '26.1'
    text: |-
      Aan de ambtenaar kan een uitkering worden toegekend om redenen van werving of behoud tot een maximum van € 45 400,-
      per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel26
  - number: '26.2'
    text: De uitkering wordt toegekend aan het einde van een tijdvak dat tevoren is vastgesteld door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel26
  - number: '26.3'
    text: Aan de toekenning van de uitkering kunnen door het bevoegd gezag voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel26
  - number: '26.4'
    text: |-
      Aan de ambtenaar die niet heeft kunnen voldoen aan de in het derde lid bedoelde voorwaarden door een naar het
      oordeel van het bevoegd gezag niet aan de ambtenaar zelf te wijten oorzaak, kan de uitkering gedeeltelijk worden
      toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel26
  - number: '26.5'
    text: Dit artikel is niet van toepassing op de ambtenaar met een functie waarvoor een salarisschaal 15 of hoger geldt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel26
  - number: '27.1'
    text: |-
      Aan de ambtenaar die is ingedeeld in een salarisschaal lager dan salarisschaal 13 van [bijlage I][ref1] van dit
      besluit en die overwerk verricht, wordt, behoudens het zesde lid, een vergoeding toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: '27.2'
    text: |-
      Aan de ambtenaar die is ingedeeld in salarisschaal 13 of 14 van [bijlage I][ref1] van dit besluit wordt de in dit
      artikel bedoelde vergoeding toegekend indien hij overwerk verricht in het kader van:


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 27.2.a
    text: deelname aan een rampenstaf;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: 27.2.b
    text: deelname aan grootschalig bijzonder optreden;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: 27.2.c
    text: |-
      inzet als lid van een mobiele eenheid als bedoeld in [artikel 26 van het Besluit beheer politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '26'
  - number: 27.2.d
    text: deelname aan een team grootschalige opsporing.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.3'
    text: |-
      Onder overwerk wordt verstaan dienst in opdracht van het daartoe bevoegde gezag buiten de voor de ambtenaar
      krachtens [artikel 12 van het Besluit algemene rechtspositie politie][ref1] vastgestelde arbeidstijden, voorzover
      daardoor de per dienstdag vastgestelde totale arbeidstijd wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel12
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '12'
  - number: '27.4'
    text: |-
      Overwerk wordt aan de ambtenaar niet opgedragen boven 240 uren per jaar. Ingeval van een aanstelling van minder
      dan 36 uren per week is het op te dragen aantal uren overwerk per jaar naar rato begrensd. In bijzondere gevallen
      kan met instemming van de betreffende Ondernemingsraad ten aanzien van groepen ambtenaren worden afgeweken van het
      vastgestelde aantal uren, bedoeld in de eerste en tweede volzin.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.5'
    text: |-
      Het opdragen van overwerk mag niet tot gevolg hebben dat de ambtenaar per periode van vier weken minder dan vier
      vrije dagen en per kalenderjaar minder dan dertien vrije zondagen, waarvan elf aansluitend aan een vrije dag,
      geniet.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.6'
    text: |-
      Voor overwerk dat gedurende korter dan een half uur aansluitend aan de vastgestelde dagelijkse arbeidstijd wordt
      verricht, wordt geen vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.7'
    text: |-
      Elk uur overwerk wordt naar de keuze van het bevoegd gezag vergoed door middel van een bedrag in geld ter grootte
      van het salaris per uur van de ambtenaar dan wel verlof voor de duur van één uur, met uitzondering van overwerk
      boven het aantal vastgestelde uren, bedoeld in het vierde lid, eerste volzin, dat uitsluitend wordt vergoed door
      middel van een bedrag in geld.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.8'
    text: |-
      De vergoeding voor elk uur overwerk, bedoeld in het zevende lid, wordt naar de keuze van de ambtenaar vermeerderd
      met € 6,00 dan wel met verlof voor de duur van een half uur, bij wijze van toeslag.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.9'
    text: |-
      De in het zevende en achtste lid bedoelde vergoeding door middel van een bedrag in geld wordt zo spoedig mogelijk
      uitbetaald, doch uiterlijk bij gelegenheid van de tweede salarisbetaling volgende op de periode van vier weken
      waarin het overwerk is verricht. De vergoeding is niet pensioengevend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.10'
    text: |-
      In geval vergoeding van overwerk plaatsvindt door middel van verlof, wordt het verlof zo spoedig mogelijk verleend,
      doch uiterlijk in de periode van vier weken waarin de in het negende lid bedoelde salarisbetaling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.11'
    text: |-
      Van de in het negende en tiende lid gestelde termijnen kan worden afgeweken indien het dienstbelang dat vereist
      of, indien het dienstbelang zich daartegen niet verzet, op verzoek van de ambtenaar. Voor de hier bedoelde gevallen
      wordt een nieuwe uiterste termijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.12'
    text: |-
      De tijdstippen waarop het verlof, bedoeld in het zevende en het achtste lid, wordt verleend, worden zo tijdig
      mogelijk vastgesteld, waarbij zoveel mogelijk rekening gehouden wordt met de wensen van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.13'
    text: |-
      Voor de toepassing van dit artikel worden gedeelten van uren, voor zover daarmee het half uur, bedoeld in het zesde
      lid, wordt overschreden, berekend over een periode van vier weken, opgeteld en naar boven afgerond op halve uren.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.14'
    text: |-
      Voor de bepaling van de duur van de overschrijding van de per dienstdag vastgestelde totale arbeidstijd gelden uren
      waarop krachtens het [Besluit algemene rechtspositie politie][ref1] vakantie of verlof is genoten dan wel wegens
      ziekte of schorsing geen dienst is verricht, als uren waarop feitelijk dienst is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006516
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006516
  - number: '27.15'
    text: |-
      Voor de toepassing van dit artikel berust het oordeel omtrent het dienstbelang bij het bevoegd gezag dan wel bij de
      door deze aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: '27.16'
    text: Dit artikel is niet van toepassing op de ambtenaar met een functie waarvoor salarisschaal 15 of hoger geldt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27
  - number: 27a.1
    text: |-
      Indien de ambtenaar dienst verricht op aan hem volgens het dagrooster verleende vakantie-uren, wordt hem een
      vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27a
  - number: 27a.2
    text: |-
      De vergoeding, bedoeld in het eerste lid, is gelijk aan de toeslag als bedoeld in [artikel 27, achtste lid][ref1].
      De vergoeding voor delen van een uur wordt vastgesteld op een evenredig deel van de toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel27
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
  - number: 27a.3
    text: De vergoeding die is uitgekeerd in geld, is niet pensioengevend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27a
  - number: 27b.1
    text: |-
      Aan de ambtenaar die is ingedeeld in salarisschaal 12 of lager, wordt een vergoeding
      toegekend als er sprake is van een verschuiving in de vastgestelde roosters, bedoeld in
      [artikel 12, negende, tiende of twaalfde lid, van het Besluit algemene rechtspositie politie][ref1], indien
      de verschuiving plaatsvindt in het dienstbelang en geen verband houdt met een omstandigheid als bedoeld in
      [artikel 2:2, eerste lid, van de Arbeidstijdenwet][ref2]. Voor de toepassing van dit lid berust het oordeel omtrent
      het dienstbelang bij het bevoegd gezag dan wel bij de door deze aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel2
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '2'
  - number: 27b.2
    text: |-
      Aan de ambtenaar die is ingedeeld in salarisschaal 13 of 14, wordt een vergoeding als bedoeld in het eerste lid
      toegekend indien er sprake is van een verschuiving van diensten in het kader van:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
  - number: 27b.2.a
    text: deelname aan een rampenstaf;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
  - number: 27b.2.b
    text: deelname aan grootschalig bijzonder optreden;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
  - number: 27b.2.c
    text: |-
      inzet als lid van een mobiele eenheid als bedoeld in [artikel 26 van het Besluit beheer politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '26'
  - number: 27b.2.d
    text: deelname aan een team grootschalige opsporing.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
  - number: 27b.3
    text: |-
      De vergoeding wordt berekend per gewerkt verschoven uur en is gelijk aan de toeslag in geld bij overwerk, bedoeld
      in [artikel 27, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel27
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
  - number: 27b.4
    text: |-
      Een verschuiving van een vrije zondag of een dag die in de wekelijkse rusttijd valt, bedoeld in
      [artikel 12, negende lid, van het Besluit algemene rechtspositie politie][ref1], wordt gesteld op acht uren,
      ongeacht de betrekkingsomvang of werktijdenmodaliteit van de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel12
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '12'
  - number: 27b.5
    text: |-
      De vergoeding voor een verschuiving in het dagrooster, bedoeld in
      [artikel 12, twaalfde lid, van het Besluit algemene rechtspositie politie][ref1], wordt slechts toegekend indien de
      verschuiving ten minste een half uur bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel12
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '12'
  - number: 27b.6
    text: |-
      De vergoeding voor een verschuiving in de roosters, bedoeld in
      [artikel 12, negende of tiende lid, van het Besluit algemene rechtspositie politie][ref1], wordt eerst toegekend
      indien meer dan acht uren zijn verschoven op grond van één van deze leden of beide leden gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel12
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '12'
  - number: 27b.7
    text: |-
      Voor de toepassing van dit artikel worden verschoven uren en gedeelten van uren berekend over een periode van vier
      weken, opgeteld en naar boven afgerond op hele uren.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
  - number: 27b.8
    text: |-
      De vergoeding kan niet samenvallen met de vergoeding voor overwerk, bedoeld in [artikel 27][ref1]. De vergoeding
      wordt ook niet toegekend aan de ambtenaar die als gevolg van arbeidsongeschiktheid feitelijk niet werkzaam is
      volgens het rooster waarin de wijziging plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel27
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
  - number: 27b.9
    text: |-
      De vergoeding wordt zo spoedig mogelijk uitbetaald, doch uiterlijk bij gelegenheid van de tweede salarisbetaling
      volgende op de periode van vier weken waarin de verschuiving heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
  - number: 27b.10
    text: |-
      Dit artikel is niet van toepassing op de ambtenaar die deel uitmaakt van een eenheid als bedoeld in
      [artikel 59, eerste lid, Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel59
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '59'
  - number: '28'
    text: |-
      Onze Minister stelt regels vast terzake van een maaltijdvergoeding bij overwerk, voor zover de ambtenaar ingevolge
      [hoofdstuk III van het Besluit reis-, verblijf- en verhuiskosten politie ][ref1]ter zake geen aanspraak op
      vergoedingen voor maaltijden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024064
        hoofdstuk: III
  - number: '29.1'
    text: |-
      Aan de ambtenaar die is ingedeeld in een salarisschaal lager dan salarisschaal 12 van [bijlage I][ref1]
      van dit besluit en die daadwerkelijk wordt ingezet als lid van een mobiele eenheid als bedoeld in
      [artikel 26 van het Besluit beheer politie][ref2] wordt een vergoeding toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
      [ref2]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006517
      - id: ref2
        bwb_id: BWBR0036705
        artikel: '26'
  - number: '29.2'
    text: |-
      Het tijdvak gedurende hetwelk de ambtenaar is ingezet, blijft voor de toepassing van de
      [artikelen 18, tweede lid][ref1], en [27, vierde lid][ref2], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel27
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '18'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
  - number: '29.3'
    text: De vergoeding bedraagt € 31,87 per kalenderdag.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29
  - number: '29.4'
    text: |-
      Aan de ambtenaar die is ingedeeld in een salarisschaal lager dan salarisschaal 12 van [bijlage I][ref1] van dit
      besluit en geen lid is van de mobiele eenheid wordt de vergoeding zoals bedoeld in het derde lid toegekend indien
      hij daadwerkelijk wordt ingezet ten behoeve van de mobiele eenheid en:


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 29.4.a
    text: de mobiele eenheid is opgeroepen in het kader van een grootschalig of bijzonder optreden, en
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29
  - number: 29.4.b
    text: |-
      de betrokken ambtenaar door het bevoegd gezag wordt opgeroepen voor een inzet als bedoeld in onderdeel a, waarbij
      voor die ambtenaar achteraf wordt vastgesteld dat gevaarzetting heeft gegolden ter handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29
  - number: 29a.1
    text: |-
      Van de som van de brutobedragen die de ambtenaar in het voorafgaande kalenderjaar aan toelagen en vergoedingen als
      bedoeld in de [artikelen 14][ref1], [18][ref2], [27][ref3], [27b][ref4] en [29][ref5] in totaal heeft genoten wordt
      een twaalfde deel in de maand februari van het actuele kalenderjaar uitgekeerd, tenzij die som in dat voorafgaande
      kalenderjaar lager is dan € 720.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel27b
      [ref5]: https://wetten.overheid.nl/BWBR0006517#Artikel29
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '18'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: 27b
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0006517
        artikel: '29'
        hoofdstuk: '8'
  - number: 29a.2
    text: |-
      Ingeval van een aanstelling van minder dan 36 uren per week geldt in plaats van het drempelbedrag, bedoeld in het
      eerste lid, een drempelbedrag naar rato van de betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29a
  - number: 29a.3
    text: |-
      Het bedrag, genoemd in het eerste lid, wordt jaarlijks overeenkomstig een algemene salarismaatregel in de sector
      Politie aangepast.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29a
  - number: 29b.1
    text: |-
      [Artikel 29a, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de som van de brutobedragen
      die de ambtenaar in de kalenderjaren 2013, 2014 en 2015 aan toelagen en vergoedingen als bedoeld in de
      [artikelen 14][ref2], [18][ref3], [27,][ref4][27b][ref5] en [29][ref6] in totaal heeft genoten, met uitzondering
      van het kalenderjaar of de kalenderjaren waarin de jaarlijkse som van de betreffende brutobedragen lager was dan €
      720 en met dien verstande dat het de ambtenaar toekomende bedrag wordt uitgekeerd in 2016.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0006517#Artikel27b
      [ref6]: https://wetten.overheid.nl/BWBR0006517#Artikel29
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 29a
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '18'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0006517
        artikel: 27b
        hoofdstuk: '8'
      - id: ref6
        bwb_id: BWBR0006517
        artikel: '29'
        hoofdstuk: '8'
  - number: 29b.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de bruto bedragen die de ambtenaar in de periode van 1 juli
      2012 tot en met 31 december 2012 aan bedoelde toelagen en vergoedingen in totaal heeft genoten met dien verstande
      dat van het op grond van het eerste lid berekende bedrag voor de helft tot uitbetaling komt
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29b
  - number: 29b.3
    text: Dit artikel vervalt met ingang van 1 januari 2018.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel29b
  - number: '30.1'
    text: |-
      Aan de ambtenaar die op grond van [artikel 62 van het Besluit algemene rechtspositie politie][ref1] voor een
      periode van tenminste twee weken wordt gedetacheerd, wordt, indien hij dagelijks heen en weer reist, een vergoeding
      toegekend voor de tijd waarmee de totale reistijd per dag 90 minuten overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel62
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '62'
  - number: '30.2'
    text: |-
      De vergoeding, bedoeld in het eerste lid, is gelijk aan de vergoeding, bedoeld in [artikel 27, achtste lid][ref1],
      die de ambtenaar bij overwerk zou ontvangen. De vergoeding voor delen van een uur wordt vastgesteld op een
      evenredig deel van de uurvergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel27
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
  - number: '30.3'
    text: |-
      Het bevoegd gezag kan in afwijking van het eerste en tweede lid beslissen in individuele gevallen waarin dit
      artikel naar zijn oordeel niet of niet in redelijkheid voorziet.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel30
  - number: '31.1'
    text: |-
      Aan de ambtenaar die in verband met de werkzaamheden die voortvloeien uit een functie in een publiekrechtelijk
      college waarin hij is benoemd of verkozen, tijdelijk is ontheven van de waarneming van zijn ambt wordt
      gedurende zijn ontheffing een non-activiteitswedde toegekend. De non-activiteitswedde is het bedrag waarmee de
      laatstelijk door hem in zijn ambt genoten bezoldiging het gezamenlijk bedrag van alle aan de werkzaamheden in dat
      publiekrechtelijk college verbonden inkomsten, overschrijdt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel31
  - number: '31.2'
    text: |-
      Toekenning van de non-activiteitswedde vindt plaats op de voet van het
      bepaalde in de [artikelen 4, tweede, derde, vierde en vijfde lid][ref1], en
      [5 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006612#Artikel5
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006612
        artikel: '5'
  - number: '31.3'
    text: |-
      Dit artikel is niet van toepassing op degene die een non-activiteitswedde geniet uit hoofde van
      [artikel 4, eerste lid, van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel4
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '4'
  - number: '32'
    text: |-
      De ambtenaar die als militair in werkelijke dienst is, behoudt over de tijd van deze dienst het genot van de aan
      zijn ambt verbonden bezoldiging slechts voor zover hem bij of krachtens de [artikelen 33 tot en met 37][ref1]
      daarop aanspraak is verleend. Voor zover die werkelijke dienst wordt vervuld in de aan hem toegekende vakantie,
      behoudt hij in ieder geval het genot van de volle aan zijn ambt verbonden bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel33
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '33'
        hoofdstuk: '9'
  - number: '33.1'
    text: |-
      De ambtenaar die ingevolge wettelijke verplichting anders dan voor herhalingsoefening als militair in werkelijke
      dienst is, geniet, onverminderd [artikel 85 van het Besluit algemene rechtspositie politie][ref1], de aan zijn ambt
      verbonden bezoldiging voor zoveel deze meer bedraagt dan zijn militaire beloning, met dien verstande dat indien
      de ambtenaar ongehuwd is, hij slechts de aan zijn ambt verbonden bezoldiging geniet, voor zover 70 procent daarvan
      meer bedraagt dan zijn militaire beloning.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel85
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '85'
  - number: '33.2'
    text: |-
      Zo nodig in afwijking van het eerste lid blijft de ambtenaar, bedoeld in dat lid, in ieder geval de aan zijn ambt
      verbonden bezoldiging genieten tot een bedrag dat gelijk is aan het bedrag van het op hem te verhalen gedeelte van
      de pensioenbijdrage.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel33
  - number: '33.3'
    text: |-
      Ongehuwde enige kostwinners worden voor de toepassing van het eerste lid gelijkgesteld met gehuwden. Het bevoegd
      gezag beslist of een ongehuwde als enig kostwinner wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel33
  - number: '33.4'
    text: |-
      Voor de toepassing van het eerste lid wordt de militaire beloning verminderd met een eventuele aftrek wegens het
      genot van voeding en huisvesting.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel33
  - number: '33.5'
    text: |-
      De regels die op basis van [artikel 18, vijfde lid, van het Algemeen Rijksambtenarenreglement][ref1] zijn
      vastgesteld met betrekking tot hetgeen onder militaire beloning wordt verstaan, zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel18
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '18'
  - number: '34.1'
    text: |-
      [Artikel 33][ref1] is eerst van toepassing, nadat de ambtenaar als militair de opleiding en oefening heeft
      volbracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel33
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '33'
        hoofdstuk: '9'
  - number: '34.2'
    text: |-
      De ambtenaar die ingevolge een wettelijke verplichting voor de opleiding en oefening als militair in werkelijke
      dienst is, geniet gedurende deze opleiding en oefening de aan zijn ambt verbonden bezoldiging tot een bedrag dat
      gelijk is aan het op hem te verhalen gedeelte van de pensioenbijdrage.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel34
  - number: '34.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing ten aanzien van ambtenaren op wie bij koninklijk besluit de
      [artikelen 32][ref1] en [33][ref2] van overeenkomstige toepassing zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel33
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '32'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '33'
        hoofdstuk: '9'
  - number: '34.4'
    text: |-
      Indien de ambtenaar bij opkomst in militaire dienst voldoet aan de voorwaarde, gesteld in het eerste lid, of
      indien ingevolge het derde lid bij opkomst in militaire dienst deze voorwaarde niet voor hem geldt, geniet hij, in
      afwijking van artikel 33, gedurende twee weken na zijn opkomst de volle aan zijn ambt verbonden bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel34
  - number: '35.1'
    text: |-
      De ambtenaar die voor een herhalingsoefening als militair in werkelijke dienst is, geniet gedurende twee weken na
      zijn opkomst in militaire dienst de volle aan zijn ambt verbonden bezoldiging. Daarna wordt de militaire beloning
      in mindering gebracht op de aan zijn ambt verbonden bezoldiging. [Artikel 33, tweede, vierde en vijfde lid][ref1]
      is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel33
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '33'
        hoofdstuk: '9'
  - number: '35.2'
    text: Voor zover nodig, bepaalt Onze Minister van Defensie welke dienst als herhalingsoefening wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel35
  - number: '35.3'
    text: |-
      Voor de toepassing of voortgezette toepassing van het eerste lid worden, met inachtneming van hetgeen daaromtrent
      is bepaald in de [Kaderwet dienstplicht][ref1] of in de [Wet voor het reservepersoneel der krijgsmacht][ref2] en
      onverminderd [artikel 85 van het Besluit algemene rechtspositie politie][ref3] met herhalingsoefeningen gelijk
      gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0008589
      [ref2]: https://wetten.overheid.nl/BWBR0003883
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel85
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008589
      - id: ref2
        bwb_id: BWBR0003883
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '85'
  - number: 35.3.a
    text: |-
      het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven voor een
      onderzoek omtrent een strafbaar feit of een krijgstuchtelijk vergrijp waarvan de militair verdacht of beklaagd
      wordt;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel35
  - number: 35.3.b
    text: |-
      het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven ten einde
      rekening en verantwoording af te leggen van gevoerd beheer;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel35
  - number: 35.3.c
    text: 'het in aansluiting aan een herhalingsoefening langer in dienst blijven wegens:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel35
  - number: 35.3.c.1°
    text: ziekte;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel35
  - number: 35.3.c.2°
    text: het niet tijdig bereiken van de vereiste graad van geoefendheid als gevolg van ziekte;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel35
  - number: 35.3.c.3°
    text: het heersen of geheerst hebben van een besmettelijke ziekte;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel35
  - number: 35.3.d
    text: |-
      het in dienst komen om gehoord te worden omtrent een bij de Kroon of bij Onze Minister van Defensie ingediend
      bezwaarschrift onderscheidenlijk beroepschrift.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel35
  - number: '36'
    text: |-
      Indien de ambtenaar als militair in werkelijke dienst zijnde overlijdt, wordt de uitkering, bedoeld in
      [artikel 46][ref1], verminderd met het bedrag van de overeenkomstige uitkering die uit hoofde van de militaire
      dienst ter zake van dit overlijden wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel46
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '46'
        hoofdstuk: '11'
  - number: '37'
    text: |-
      De [artikelen 32 tot en met 36][ref1] zijn van overeenkomstige toepassing ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel32
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '32'
        hoofdstuk: '9'
  - number: 37.a
    text: |-
      de ambtenaar die is tewerkgesteld in de zin van [artikel 9 van de Wet gewetensbezwaren militaire dienst][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel9
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '9'
  - number: 37.b
    text: |-
      de ambtenaar die als militair in werkelijke dienst is op grond van een verbintenis bij het reservepersoneel der
      krijgsmacht of
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel37
  - number: 37.c
    text: |-
      de ambtenaar die op grond van een andere bijzondere verbintenis in werkelijke militaire of daarmee gelijk te
      stellen dienst is, terzake waarvan dit bij koninklijk besluit is bepaald.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel37
  - number: 37a.1
    text: |-
      De ambtenaar die 55 jaar of ouder is kan op zijn aanvraag, een functie worden opgedragen waaraan een salaris is
      verbonden met een lager maximum dan het maximum van de reeds voor hem geldende salarisschaal. In dat geval wordt op
      zijn salaris een inhouding toegepast.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel37a
  - number: 37a.2
    text: |-
      De inhouding is gelijk aan het verschil tussen het salaris dat de ambtenaar geniet en het maximumsalaris behorende
      bij de salarisschaal direct onder de voor de ambtenaar geldende salarisschaal met dien verstande dat dit bedrag
      niet negatief mag zijn.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel37a
  - number: 37a.3
    text: In bijzondere gevallen kan het bevoegd gezag geheel of gedeeltelijk van de inhouding afzien.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel37a
  - number: 37a.4
    text: Onze Minister kan nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel37a
  - number: '38.1'
    text: |-
      De ambtenaar heeft bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een tijdvak van
      104 weken recht op de doorbetaling van zijn bezoldiging overeenkomstig de volgende tabel:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.1.1
    text: de eerste 26 weken 100% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.1.2
    text: de tweede 26 weken 90% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.1.3
    text: de derde 26 weken 80% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.1.4
    text: vervolgens 70% van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: '38.2'
    text: |-
      In afwijking van het eerste lid, behoudt de ambtenaar, indien de ziekte uit hoofde waarvan hij ongeschikt is zijn
      arbeid te verrichten, is veroorzaakt door een dienstongeval of beroepsziekte, zijn aanspraak op doorbetaling van
      100% van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: '38.3'
    text: |-
      Voor de toepassing van het eerste lid worden perioden van ongeschiktheid samengeteld indien zij
      elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '38.4'
    text: 'Het tijdvak van 104 weken, bedoeld in het eerste lid, wordt verlengd:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.4.a
    text: |-
      met de duur van de vertraging, indien het bevoegd gezag de aangifte, bedoeld in
      [artikel 38, eerste lid, van de ZW][ref1], later doet dan op grond van dat artikel is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 38.4.b
    text: |-
      met de duur van de vertraging van de wachttijd, bedoeld in [artikel 23, eerste en tweede lid, van de WIA][ref1],
      indien de wachttijd met toepassing van [artikel 24 van de WIA][ref2] wordt verlengd;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '24'
  - number: 38.4.c
    text: |-
      met de duur van het tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 25, negende lid, van de WIA][ref1] heeft vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 38.4.d
    text: |-
      met de duur van de periode dat het bevoegd gezag de ambtenaar, bedoeld in het eerste lid, noch heeft ontslagen op
      grond van [artikel 94, eerst lid, onderdeel e of f, van het Besluit algemene rechtspositie politie][ref1], noch op
      grond van [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref2] heeft herplaatst teneinde
      passende arbeid te kunnen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel49b
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '94'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 49b
  - number: '38.5'
    text: |-
      Ingeval van verlenging op grond van het vierde lid, onderdeel a, b of c, kan het tijdvak, bedoeld in het eerste
      lid, niet méér dan 156 weken belopen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: '38.6'
    text: |-
      De ambtenaar die langer dan 26 weken ongeschikt is tot het verrichten van zijn arbeid wegens ziekte en die
      loonvormende arbeid of reintegratieactiviteiten verricht, ontvangt over deze uren een beloning naast de bezoldiging
      bij ziekte als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: '38.7'
    text: 'De beloning, bedoeld in het zesde lid, tezamen met de doorbetaling van de bezoldiging bij ziekte bedraagt:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.7.a
    text: |-
      35% van de bezoldiging en 65% van de bezoldiging bij ziekte als bedoeld in het eerste lid indien de ambtenaar
      maximaal 35% van zijn betrekkingsomvang arbeid of activiteiten verricht als bedoeld in het zesde lid;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.7.b
    text: |-
      80% van de bezoldiging en 20% van de bezoldiging bij ziekte als bedoeld in het eerste lid indien de ambtenaar meer
      dan 35% en maximaal 80% van zijn betrekkingsomvang arbeid of activiteiten verricht als bedoeld in het zesde lid;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.7.c
    text: |-
      100% van de bezoldiging indien de ambtenaar meer dan 80% van zijn betrekkingsomvang arbeid of activiteiten verricht
      als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: '38.8'
    text: 'De doorbetaling van de bezoldiging eindigt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.8.a
    text: |-
      met ingang van de dag waarop de ambtenaar op grond van
      [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref1] passende arbeid verricht en daartoe
      is herplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel49b
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 49b
  - number: 38.8.b
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.8.c
    text: met ingang van de dag waarop de ambtenaar de AOW-gerechtigde leeftijd heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.8.d
    text: met ingang van de dag volgende op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: '38.9'
    text: |-
      De ambtenaar die op grond van [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref1]
      passende arbeid verricht en daartoe is herplaatst, voordat de termijn van twee jaar, bedoeld in
      [artikel 94, derde lid, van het Besluit algemene rechtspositie politie][ref2] is verstreken, heeft tot het eind van
      genoemde termijn aanspraak op een aanvullende uitkering, indien zijn bezoldiging als gevolg van zijn herplaatsing
      vermindering ondergaat, ter grootte van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel94
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 49b
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '94'
  - number: 38.9.a
    text: |-
      het bedrag waarop de ambtenaar op grond van dit artikel recht zou hebben gehad indien hem geen andere betrekking
      zou zijn opgedragen, maar in plaats daarvan voor dezelfde arbeidstijd zijn eigen betrekking; en
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: 38.9.b
    text: |-
      de som van zijn bezoldiging na herplaatsing, een uit zijn arbeidsongeschiktheid voortvloeiend recht op een WIA-
      uitkering, en een arbeidsongeschiktheidspensioen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: '38.10'
    text: |-
      De ambtenaar waarvan de mate van arbeidsongeschiktheid is vastgesteld op minder dan 35% en die als gevolg van de
      arbeidsongeschiktheid inkomensverlies heeft, maakt aanspraak op een compensatie van dit inkomensverlies. Onder
      inkomensverlies wordt verstaan het verschil tussen de oorspronkelijke bezoldiging van de ambtenaar, waarbij ten
      aanzien van de onregelmatigheidstoeslag en consignatie wordt uitgegaan van hetgeen gemiddeld genoten is in de
      twaalf maanden voor de ziekte, en de bezoldiging nadat de arbeidsongeschiktheid is vastgesteld op minder dan 35%,
      waarbij verhogingen van de bezoldiging wegens algemene salarismaatregelen of een verhoging van het salaris als
      bedoeld in artikel 9 buiten beschouwing worden gelaten.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
  - number: '38.11'
    text: |-
      De compensatie, bedoeld in het tiende lid, is een toelage ter hoogte van 70% van het inkomensverlies voor
      de duur van vijf jaar, gerekend vanaf de dag waarop de mate van arbeidsongeschiktheid van de ambtenaar is
      vastgesteld op minder dan 35%, maar niet voordat 104 weken na de eerste ziektedag zijn verstreken. Bij samenloop
      van de compensatie, bedoeld in het tiende lid, met een uitkering krachtens de [Werkloosheidswet][ref1] of het
      [Besluit bovenwettelijke werkloosheidsuitkering politie][ref2], wordt de compensatie verminderd met het bedrag van
      de uitkering krachtens de Werkloosheidswet of het Besluit bovenwettelijke werkloosheidsuitkering politie.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0012022
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0012022
  - number: 38a.1
    text: |-
      De ambtenaar met recht op een ZW-uitkering heeft aanspraak op een aanvulling van die uitkering tot het niveau van
      de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38a
  - number: 38a.2
    text: |-
      Voor de toepassing van dit artikel wordt de ZW-uitkering waarop de ambtenaar recht heeft steeds aangemerkt als een
      uitkering die door deze onverminderd is genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38a
  - number: 38b.1
    text: |-
      De ambtenaar die wegens ziekte ongeschikt is zijn arbeid te verrichten, heeft, indien de ziekte is veroorzaakt door
      een dienstongeval of indien het een beroepsziekte betreft, recht op een aanvullende uitkering nadat het tijdvak van
      104 weken, bedoeld in [artikel 38, eerste lid][ref1], is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: 38b.2
    text: |-
      De uitkering voor de ambtenaar, bedoeld in het eerste lid, die volledig en duurzaam arbeidsongeschikt is als
      bedoeld in [artikel 4, eerste lid, van de WIA][ref1], wordt aangevuld tot 95% van zijn laatstelijk genoten
      bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering, waarop aanspraak zou bestaan op de dag
      voor zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot werken.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel4
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '4'
  - number: 38b.3
    text: |-
      De uitkering voor de ambtenaar, bedoeld in het eerste lid, die gedeeltelijk arbeidsgeschikt is als bedoeld in
      [artikel 5 van de WIA][ref1] en slechts in staat is met arbeid ten hoogste 20% te verdienen van het maatmaninkomen,
      bedoeld in [artikel 1 van de WIA][ref2], per uur, wordt aangevuld tot 90,02% van zijn laatstelijk genoten
      bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering, waarop aanspraak zou bestaan op de dag
      voor zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot werken.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel1
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '1'
  - number: 38b.4
    text: |-
      De in het eerste lid bedoelde aanvullende uitkering voor de ambtenaar die 35 tot 80% arbeidsongeschikt is,
      bedraagt:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: 38b.4.a
    text: |-
      gedurende de looptijd van de loongerelateerde uitkering, in geval de verdiencapaciteit volledig wordt benut, 90%
      van het verschil tussen het oude en het nieuwe inkomen;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: 38b.4.b
    text: |-
      gedurende de looptijd van de loongerelateerde uitkering, in geval de verdiencapaciteit niet volledig wordt benut,
      80% van het verschil tussen het oude en het nieuwe inkomen;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: 38b.4.c
    text: |-
      gedurende de looptijd van de loonaanvulling, waarbij de verdiencapaciteit voor 50% of meer wordt benut, 90%
      van het verschil tussen het oude en het nieuwe inkomen dat de ambtenaar bij volledige benutting van zijn
      restverdiencapaciteit zou verdienen;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: 38b.4.d
    text: |-
      gedurende de looptijd van de vervolguitkering, waarbij de verdiencapaciteit voor minder dan voor 50% wordt benut,
      gedurende maximaal tien jaar, 75% van het oude inkomen maal het arbeidsongeschiktheidspercentage.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: 38b.5
    text: |-
      Onder het oude inkomen, bedoeld in het vierde lid, wordt verstaan de som van de laatstgenoten bezoldiging,
      vakantie-uitkering en eindejaarsuitkering voor de herplaatsing. Onder het nieuwe inkomen, bedoeld in het vierde
      lid, wordt verstaan de som van de bezoldiging, de vakantie-uitkering, de eindejaarsuitkering, de WIA-uitkering en
      het arbeidsongeschiktheidspensioen na de herplaatsing.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: 38b.6
    text: |-
      De in het eerste lid bedoelde aanvullende uitkering voor de ambtenaar die minder dan 35% arbeidsongeschikt is,
      bedraagt 70% van het inkomensverlies, bedoeld in [artikel 38, tiende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: 38b.7
    text: 'De aanvullende uitkering eindigt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: 38b.7.a
    text: |-
      met ingang van de dag waarop de ambtenaar niet meer voldoet aan de in het eerste tot en met het vierde, dan wel het
      zesde lid genoemde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: 38b.7.b
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: 38b.7.c
    text: met ingang van de dag waarop de ambtenaar de AOW-gerechtigde leeftijd heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: 38b.7.d
    text: met ingang van de dag volgend op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: 38b.8
    text: |-
      Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in het tweede en het derde lid, wordt herberekend
      overeenkomstig een algemene salarismaatregel in de sector politie.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel38b
  - number: '39.1'
    text: |-
      De gewezen ambtenaar die wegens ziekte, ontstaan voor het tijdstip van ingang van
      zijn ontslag, niet zijnde een ontslag op grond van [artikel 88a][ref1] dan wel
      [artikel 94, eerste lid, aanhef en onderdeel e of f, van het Besluit algemene rechtspositie politie][ref2] nog
      ongeschikt is een naar aard en omvang soortgelijke functie te vervullen, heeft zolang hij ongeschikt tot werken
      is wegens ziekte, doch niet langer dan een tijdvak van ten hoogste 78 weken, aanspraak op de doorbetaling van zijn
      bezoldiging overeenkomstig de volgende tabel:


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88a
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel94
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 88a
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '94'
  - number: 39.1.a
    text: de eerste 26 weken 100% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: 39.1.b
    text: de tweede 26 weken 90% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: 39.1.c
    text: de derde 26 weken 80% van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: '39.2'
    text: |-
      De gewezen ambtenaar die binnen een maand na het tijdstip van zijn ontslag ongeschikt wordt wegens ziekte een naar
      aard en omvang soortgelijke functie te vervullen, heeft zolang betrokkene ongeschikt is tot werken wegens ziekte,
      maar niet langer dan 52 weken, aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging indien hij
      gedurende ten minste twee maanden onmiddellijk aan het ontslag voorafgaande in dienst is geweest overeenkomstig de
      volgende tabel:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: 39.2.a
    text: de eerste 26 weken 100% van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: 39.2.b
    text: de tweede 26 weken 90% van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: '39.3'
    text: |-
      Voor het bepalen van het einde van het tijdvak van 78 weken, bedoeld in het eerste lid, en het tijdvak
      van 52 weken, bedoeld in het tweede lid, worden perioden van ongeschiktheid samengeteld indien zij
      elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '39.4'
    text: |-
      De doorbetaling van de bezoldiging bedoeld in het eerste en tweede lid, eindigt na ommekomst van de uitkeringsduur,
      maar in ieder geval:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: 39.4.a
    text: met ingang van de dag waarop de gewezen ambtenaar de AOW-gerechtigde leeftijd bereikt; of
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: 39.4.b
    text: met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: '39.5'
    text: |-
      De gewezen ambtenaar waarvan de mate van arbeidsongeschiktheid, waarvan de oorzaak is gelegen voor het tijdstip
      van ingang van zijn ontslag, is vastgesteld op minder dan 35% en die als gevolg van de arbeidsongeschiktheid
      inkomensverlies heeft, maakt aanspraak op een compensatie van dit inkomensverlies. Onder inkomensverlies wordt
      verstaan het verschil tussen de laatstgenoten bezoldiging, vakantie-uitkering en eindejaarsuitkering van de
      ambtenaar op het moment van vaststelling van de mate van arbeidsongeschiktheid op minder dan 35% en de nieuwe
      structurele bruto inkomsten uit arbeid, waarbij verhogingen van de inkomsten wegens algemene salarismaatregelen of
      een periodieke verhoging van het inkomen buiten beschouwing worden gelaten.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: '39.6'
    text: |-
      De compensatie, bedoeld in het vijfde lid, is een toelage ter hoogte van 70% van het inkomensverlies voor de
      duur van vijf jaar, gerekend vanaf de dag waarop de mate van arbeidsongeschiktheid van de gewezen ambtenaar is
      vastgesteld op minder dan 35%, maar niet voordat 104 weken na de eerste ziektedag zijn verstreken. Bij samenloop
      van de compensatie, bedoeld in het vijfde lid, met een uitkering krachtens de [Werkloosheidswet][ref1] of het
      [Besluit bovenwettelijke werkloosheidsuitkering politie][ref2], wordt de compensatie verminderd met het bedrag van
      de uitkering krachtens de Werkloosheidswet.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0012022
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0012022
  - number: '39.7'
    text: |-
      De gewezen ambtenaar aan wie eervol ontslag is verleend op grond van
      [artikel 88d van het Besluit algemene rechtspositie politie][ref1] met het oog op pensioen als bedoeld in artikel
      7.3 van het pensioenreglement, voor zover dat is ingegaan voor de AOW-gerechtigde leeftijd, heeft tot uiterlijk
      de AOW-gerechtigde leeftijd slechts aanspraak op de doorbetaling van zijn laatstelijk genoten bezoldiging voor
      zover deze tezamen met zijn pensioen op grond van artikel 7.3 van het Pensioenreglement de laatstelijk genoten
      bezoldiging niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88d
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 88d
  - number: '39.8'
    text: |-
      Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in de voorgaande leden, wordt in voorkomende gevallen
      gewijzigd overeenkomstig een algemene salarismaatregel in de sector politie.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: '39.9'
    text: |-
      De in het eerste lid, onderdelen b en c, bedoelde vermindering van het percentage van de bezoldiging is niet van
      toepassing indien de ziekte is veroorzaakt door een dienstongeval of een beroepsziekte.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39
  - number: 39a.1
    text: |-
      De gewezen ambtenaar die waarschijnlijk zal bevallen binnen vier maanden na de datum van ingang van haar ontslag,
      ontvangt haar laatstelijk genoten bezoldiging gedurende de periode die aanvangt op de 41e dag voorafgaande aan de
      vermoedelijke datum van bevalling en eindigt op de 70e dag na de datum waarop de bevalling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39a
  - number: 39a.2
    text: |-
      De periode, bedoeld in het eerste lid, wordt verlengd tot zestien weken, indien die periode door een voortijdige
      bevalling minder dan zestien weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39a
  - number: 39a.3
    text: |-
      De gewezen ambtenaar van wie de bevalling niet wordt verwacht binnen vier maanden na de datum van ingang van haar
      ontslag, maar die niettemin binnen die termijn bevalt, ontvangt haar laatstelijk genoten bezoldiging gedurende
      de periode die aanvangt op de datum van bevalling en eindigt op de 70e dag na de datum waarop de bevalling heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39a
  - number: 39a.4
    text: |-
      Voor zolang de gewezen ambtenaar na beëindiging van de haar ingevolge het eerste of derde lid toekomende
      uitkering nog wegens ziekte ongeschikt is tot werken of binnen een maand na deze beëindiging ongeschikt wordt tot
      werken, heeft zij gedurende een tijdvak van 52 weken recht op de doorbetaling van de bezoldiging overeenkomstig
      [artikel 39][ref1]. De termijn van 52 weken loopt vanaf de eerste dag na de bevalling.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel39
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '39'
        hoofdstuk: '10'
  - number: 39a.5
    text: |-
      Ongeschikt tot werken, in de zin van het vierde lid is de gewezen ambtenaar die als rechtstreeks en objectief
      medisch vast te stellen gevolg van ziekte of gebreken geheel of gedeeltelijk niet in staat is om een naar aard en
      omvang soortgelijke betrekking als zij vervulde, te vervullen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39a
  - number: 39a.6
    text: |-
      [Artikel 55, vijfde en zesde lid, van het Besluit algemene rechtspositie politie][ref1] en
      [artikel 41, tweede lid][ref2], van dit besluit zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel41
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '41'
        hoofdstuk: '10'
  - number: 39a.7
    text: |-
      Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in de voorgaande leden, wordt in voorkomende gevallen
      gewijzigd overeenkomstig een algemene salarismaatregel in de sector politie.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39a
  - number: 39b.1
    text: |-
      De gewezen ambtenaar die wegens ziekte, veroorzaakt door een dienstongeval of een beroepsziekte, ongeschikt is
      zijn arbeid te verrichten, heeft recht op een aanvullende uitkering nadat het tijdvak van 104 weken, bedoeld in
      [artikel 38, eerste lid][ref1], is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: 39b.2
    text: |-
      De uitkering voor de gewezen ambtenaar, bedoeld in het eerste lid, die volledig en duurzaam ongeschikt is als
      bedoeld in [artikel 4, eerste lid, van de WIA][ref1], wordt aangevuld tot 95% van zijn laatstelijk genoten
      bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering, waarop aanspraak zou bestaan op de dag
      voor zijn ontslag indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel4
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '4'
  - number: 39b.3
    text: |-
      De uitkering voor de gewezen ambtenaar, bedoeld in het eerste lid, die gedeeltelijk arbeidsgeschikt
      is als bedoeld in [artikel 5 van de WIA][ref1] en slechts in staat is met arbeid ten hoogste 20% te
      verdienen van het maatmaninkomen, bedoeld in [artikel 1 van de WIA][ref2], per uur, wordt aangevuld
      tot 90,02% van zijn laatstelijk genoten bezoldiging, vermeerderd met de vakantie-uitkering en de
      eindejaarsuitkering waarop aanspraak zou bestaan op de dag voor zijn ontslag indien de ambtenaar op die dag
      niet ongeschikt zou zijn geweest tot het verrichten van arbeid. Indien de gewezen ambtenaar op grond van
      [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref3] voor zijn ontslag passende arbeid
      heeft verricht en daartoe is herplaatst, gelden voor de toepassing van de vorige volzin de bezoldiging, vermeerderd
      met de vakantie-uitkering en de eindejaarsuitkering waarop aanspraak zou bestaan op de dag voor zijn herplaatsing
      indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel49b
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0006516
        artikel: 49b
  - number: 39b.4
    text: |-
      De aanvullende uitkering voor de gewezen ambtenaar, bedoeld in het eerste lid, die 35 tot 80% arbeidsongeschikt
      is bedraagt:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
  - number: 39b.4.a
    text: |-
      gedurende de looptijd van de loongerelateerde uitkering, in geval de verdiencapaciteit volledig wordt benut, 90%
      van het verschil tussen het oude en het nieuwe inkomen;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
  - number: 39b.4.b
    text: |-
      gedurende de looptijd van de loongerelateerde uitkering, in geval de verdiencapaciteit niet volledig wordt benut,
      80% van het verschil tussen het oude en het nieuwe inkomen;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
  - number: 39b.4.c
    text: |-
      gedurende de looptijd van de loonaanvulling, waarbij de verdiencapaciteit voor 50% of meer wordt benut, 90%
      van het verschil tussen het oude en het nieuwe inkomen dat de ambtenaar bij volledige benutting van zijn
      restverdiencapaciteit zou verdienen;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
  - number: 39b.4.d
    text: |-
      gedurende de looptijd van de vervolguitkering, waarbij de verdiencapaciteit voor minder dan voor 50% wordt benut,
      gedurende maximaal tien jaar, 75% van het oude inkomen maal het arbeidsongeschiktheidspercentage.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
  - number: 39b.5
    text: |-
      Onder het oude inkomen, bedoeld in het vierde lid, wordt verstaan de laatstgenoten bezoldiging, de vakantie-
      uitkering en de eindejaarsuitkering. Onder het nieuwe inkomen, bedoeld in het vierde lid, wordt verstaan de nieuwe
      structurele bruto inkomsten uit arbeid, de WIA-uitkering en het arbeidsongeschiktheidspensioen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
  - number: 39b.6
    text: |-
      De aanvullende uitkering voor de gewezen ambtenaar, bedoeld in het eerste lid, die minder dan 35% arbeidsongeschikt
      is, bedraagt 70% van het inkomensverlies, bedoeld in [artikel 39, vijfde lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel39
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '39'
        hoofdstuk: '10'
  - number: 39b.7
    text: 'De aanvullende uitkering eindigt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
  - number: 39b.7.a
    text: met ingang van de dag waarop de gewezen ambtenaar niet meer voldoet aan de in het eerste lid genoemde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
  - number: 39b.7.b
    text: met ingang van de dag waarop de gewezen ambtenaar de AOW-gerechtigde leeftijd heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
  - number: 39b.7.d
    text: met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
  - number: 39b.8
    text: |-
      Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in het tweede en het derde lid, wordt herberekend
      overeenkomstig een algemene salarismaatregel in de sector Politie.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel39b
  - number: '41.1'
    text: 'De ambtenaar en de gewezen ambtenaar hebben geen aanspraak op doorbetaling van de bezoldiging:'
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel41
  - number: 41.1.a)
    text: |-
      indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het verrichten
      van arbeid wegens ziekte niet kan worden aangenomen;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel41
  - number: 41.1.b)
    text: |-
      indien de ambtenaar de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opzettelijk heeft
      veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel41
  - number: 41.1.c)
    text: |-
      indien de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte zich voordoet binnen een half
      jaar na het geneeskundig onderzoek, bedoeld in [artikel 7, eerste lid, onderdeel c][ref1] respectievelijk
      [artikel 8, eerste lid, onderdeel a, van het Besluit algemene rechtspositie politie][ref2] en blijkt dat de
      ambtenaar onjuiste informatie omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, ten
      gevolge waarvan de verklaring van geschiktheid voor de desbetreffende functie ten onrechte heeft plaatsgevonden,
      tenzij de ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel8
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '8'
  - number: '41.2'
    text: |-
      De gewezen ambtenaar heeft geen aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging, indien hij op
      grond van een aanvaarde andere betrekking aanspraak kan maken op doorbetaling van zijn loon of bezoldiging, dan wel
      op een ZW-uitkering.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel41
  - number: '42.1'
    text: |-
      Het tijdvak gedurende welke de ambtenaar en de gewezen ambtenaar aanspraak hebben op de doorbetaling van hun
      bezoldiging of een bovenwettelijke ziekte-uitkering vangt aan op de eerste dag waarop:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel42
  - number: 42.1.a)
    text: wegens ziekte geheel of gedeeltelijk niet is gewerkt;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel42
  - number: 42.1.b)
    text: het werken wegens ziekte geheel of gedeeltelijk is gestaakt;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel42
  - number: 42.1.c)
    text: wegens ziekte geheel of gedeeltelijk niet zou zijn gewerkt;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel42
  - number: 42.1.d)
    text: het werken wegens ziekte geheel of gedeeltelijk zou zijn gestaakt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel42
  - number: '42.2'
    text: |-
      Bij buitengewoon verlof zonder behoud van bezoldiging vangt het tijdvak, bedoeld in het eerste lid, aan op de dag
      volgende op die waarop het buitengewoon verlof is beëindigd.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel42
  - number: '44.1'
    text: |-
      De aanspraken van de ambtenaar en de gewezen ambtenaar op grond van dit hoofdstuk vervallen indien de ambtenaar of
      de gewezen ambtenaar:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.a)
    text: niet binnen redelijke termijn gezondheidskundige hulp inroept;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.b)
    text: zich niet gedurende het gehele verloop van de ziekte onder gezondheidskundige behandeling blijft stellen;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.c)
    text: de voorschriften van de behandelende arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.d)
    text: zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.e)
    text: |-
      verzuimt de deskundige persoon of de arbodienst op eerste aanvraag mee te delen om welke reden hij ongeschikt is
      tot werken;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.f)
    text: |-
      zonder deugdelijke grond nalaat gevolg te geven aan een verzoek van de deskundige persoon of de arbodienst om te
      verschijnen;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.g)
    text: |-
      er de oorzaak van is dat het arbeidsgezondheidskundig onderzoek door een door de deskundige persoon of de
      arbodienst aangewezen arts niet kan plaatshebben;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.h)
    text: |-
      niet binnen twee dagen na de aanvang van de ongeschiktheid tot werken wegens ziekte dit heeft gemeld bij zijn
      werkgever;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.i)
    text: |-
      weigert aangeboden passende arbeid, waartoe de deskundige persoon of de arbodienst hem in staat acht, te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.j)
    text: |-
      zich niet houdt aan de ten aanzien van hem geldende regels met betrekking tot de wijze waarop invulling wordt
      gegeven aan de verzuimbegeleiding en de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen
      procedure;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.k)
    text: zijn ongeschiktheid tot werken opzettelijk heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.l)
    text: |-
      weigert inzage te geven in een op hem betrekking hebbend document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een geldig rijbewijs als bedoeld in
      [artikel 107, eerste lid, van de Wegenverkeerswet][ref2], voor zover dit redelijkerwijs nodig is voor de uitvoering
      van wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '107'
  - number: 44.1.m)
    text: |-
      tijdens de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte arbeid voor zichzelf of voor derden
      verricht, tenzij dit door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk wordt
      geacht;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.n)
    text: |-
      vóór de betaling van de bezoldiging weigert mededeling te doen van inkomsten uit arbeid die hij heeft in verband
      met het verrichten van door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk
      geachte arbeid voor zichzelf of voor derden;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.o)
    text: |-
      niet onverwijld op verzoek of uit eigen beweging alle feiten en omstandigheden meedeelt, waarvan hem redelijkerwijs
      duidelijk moet zijn dat zij van invloed kunnen zijn op het recht of op de hoogte van een aan hem toegekende
      arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.p)
    text: |-
      zijn arbeid verzuimt te hervatten op het door de deskundige persoon of de arbodienst bepaalde tijdstip en in
      de door deze persoon of dienst bepaalde mate, indien zulks hem is opgedragen, tenzij hij daarvoor een door de
      deskundige persoon of de arbodienst als geldig erkende reden heeft opgegeven;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.q)
    text: |-
      zonder deugdelijke grond weigert mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen
      deskundige gegeven redelijke voorschriften of mee te werken aan getroffen maatregelen die erop gericht zijn om de
      betrokkene in staat te stellen passende arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: 44.1.r)
    text: |-
      zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren of bijstellen van een plan van aanpak
      als bedoeld in [artikel 25, tweede lid, van de WIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 44.1.s)
    text: |-
      geen aanspraak heeft op een WIA-uitkering omdat geen aanvraag is ingediend of in verband met de toepassing van
      [artikel 88 van de WIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel88
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '88'
  - number: 44.1.t)
    text: zijn medewerking weigert bij de doelmatige uitvoering van de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: '44.2'
    text: |-
      De aanspraak op de doorbetaling van bezoldiging kan geheel of gedeeltelijk vervallen worden verklaard in het geval
      de ambtenaar of de gewezen ambtenaar de regels heeft overtreden die ter zake van afwezigheid wegens ziekte zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: '44.3'
    text: |-
      De ingevolge het eerste lid vervallen aanspraken herleven met ingang van het tijdstip waarop de ambtenaar of de
      gewezen ambtenaar alsnog gevolg geeft aan de betreffende verplichting op grond van dat lid.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: '44.4'
    text: |-
      Het bevoegd gezag kan op grond van bijzondere omstandigheden bepalen, dat de aanspraak op de doorbetaling van
      bezoldiging niet vervalt maar geheel of ten dele aan anderen dan aan de ambtenaar of de gewezen ambtenaar zal
      worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: '44.5'
    text: |-
      Voor zover het bevoegd gezag van de bevoegdheid, bedoeld in het vierde lid, geen gebruik heeft gemaakt, wordt de
      niet uitbetaalde bezoldiging alsnog aan de ambtenaar of de gewezen ambtenaar uitbetaald, indien het in artikel
      32, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen bedoelde oordeel ten gunste van de
      ambtenaar of de gewezen ambtenaar uitvalt.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: '44.6'
    text: |-
      Indien de ambtenaar of de gewezen ambtenaar recht heeft op een WIA-uitkering, is het verplichtingen- en
      sanctieregime van de WIA van overeenkomstige toepassing op zijn recht krachtens dit hoofdstuk op grond van dezelfde
      dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
  - number: '44.7'
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door de ambtenaar of de gewezen ambtenaar de
      WIA-uitkering vermindering ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk wordt geweigerd, wordt
      de WIA-uitkering voor het vaststellen van zijn aanspraak op doorbetaling van de bezoldiging zoals bedoeld in
      [artikel 38, eerste lid][ref1], steeds geacht onverminderd te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: 45a.1
    text: |-
      Bij samenloop van een aanspraak krachtens dit hoofdstuk met een uitkering krachtens een wettelijke verzekering,
      wordt de aanspraak krachtens dit hoofdstuk verminderd met het bedrag van de uitkering krachtens de wettelijke
      verzekering, tenzij het betreft:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel45a
  - number: 45a.1.a)
    text: |-
      een tegemoetkoming of een vergoeding die vergelijkbaar is met de tegemoetkoming of de vergoeding, bedoeld in de
      [artikelen 53][ref1] en [54 van het Besluit algemene rechtspositie politie][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel54
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '54'
  - number: 45a.1.b)
    text: |-
      een ZW-uitkering ingeval van meer dan een betrekking. In dat geval wordt de ZW-uitkering naar rato van de
      bezoldiging toegerekend aan de dienstbetrekking ter zake waarvan zijn bezoldiging wordt doorbetaald krachtens dit
      hoofdstuk en de andere betrekking of betrekkingen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel45a
  - number: 45a.1.c)
    text: |-
      een WIA-uitkering ingeval van meer dan één betrekking. In dat geval wordt de WIA-uitkering naar rato van de
      bezoldiging toegerekend aan de betrekking ter zake waarvan zijn bezoldiging wordt doorbetaald krachtens dit
      hoofdstuk en de andere betrekking of betrekkingen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel45a
  - number: 45a.2
    text: |-
      Inkomsten uit of in verband met arbeid of bedrijf worden op het bedrag, waarop de gewezen ambtenaar ingevolge dit
      hoofdstuk recht heeft, in mindering gebracht, tenzij:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel45a
  - number: 45a.2.a)
    text: |-
      de gewezen ambtenaar deze inkomsten reeds voor het intreden van de ongeschiktheid tot het verrichten van zijn
      arbeid wegens ziekte genoot; en
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel45a
  - number: 45a.2.b)
    text: de omvang van die arbeid niet is toegenomen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel45a
  - number: 45c.1
    text: |-
      De aanspraak van de ambtenaar en de gewezen ambtenaar op de bovenwettelijke ziekte-uitkering of de doorbetaling
      van de bezoldiging na afloop van de termijn als bedoeld in [artikel 38, eerste lid][ref1], wordt zoveel mogelijk op
      gelijke wijze gewijzigd als een aan hem toegekende ZW-uitkering of een WIA-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: 45c.2
    text: |-
      Het eerste lid vindt geen toepassing indien de ambtenaar en de gewezen ambtenaar aanspraak op een ZW-uitkering
      of een WIA-uitkering hebben wegens ongeschiktheid tot werken voor een betrekking die de ambtenaar of de gewezen
      ambtenaar heeft vervuld naast zijn betrekking ter zake waarvan de ambtenaar of de gewezen ambtenaar op een
      uitkering krachtens dit hoofdstuk aanspraak heeft, voor zover de ZW-uitkering of de WIA-uitkering naar de inkomsten
      uit die andere betrekking wordt berekend of geacht kan worden te zijn berekend.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel45c
  - number: 45d.1
    text: |-
      Ten aanzien van de ambtenaar en de gewezen ambtenaar van wie de eerste dag van ongeschiktheid tot het verrichten
      van zijn arbeid wegens ziekte is gelegen voor 1 januari 2004, blijven de artikelen van hoofdstuk X van dit besluit
      van toepassing zoals deze luidden op 31 december 2005.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel45d
  - number: 45d.2
    text: |-
      Voor de toepassing van het eerste lid worden perioden van ongeschiktheid tot werken geacht eenzelfde, niet
      onderbroken periode van ongeschiktheid te vormen, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof
      wordt genoten overeenkomstig [artikel 3.1, tweede en derde lid, van de Wet arbeid en zorg][ref1] of een uitkering
      op grond van [artikel 3:8][ref2], of [3:10, eerste lid, van die wet][ref3], tenzij de ongeschiktheid redelijkerwijs
      niet geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel45d
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '46.1'
    text: |-
      De bezoldiging van de ambtenaar wordt niet langer uitbetaald dan tot en met de dag van het overlijden.
      [Artikel 26, eerste lid, van het Besluit algemene rechtspositie politie][ref1], is van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel26
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '26'
  - number: '46.2'
    text: |-
      Met inachtneming van het vijfde lid wordt zo spoedig mogelijk na het overlijden aan de weduwe of weduwnaar van
      wie de overleden ambtenaar niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan de bezoldiging over
      een tijdvak van drie maanden. Als maatstaf bij de berekening van het in de eerste volzin bedoelde bedrag geldt,
      behoudens het hierna bepaalde, de bezoldiging welke de ambtenaar op de dag van het overlijden genoot of, indien
      hij op die dag aanspraak maakt op een ZW-uitkering of een WIA-uitkering en een bovenwettelijke ziekte-uitkering
      of een bovenwettelijke arbeidsongeschiktheidsuitkering, bedoeld in [hoofdstuk 10][ref1], zou hebben genoten indien
      hij op die dag arbeidsgeschikt zou zijn geweest. De uitkering wordt vermeerderd met een bedrag gelijk aan driemaal
      dat van de vakantieuitkering over een maand, berekend op de voet van [hoofdstuk 6][ref2], naar de bezoldiging
      die de ambtenaar in de maand van het overlijden zou hebben genoten. Indien de ambtenaar in het genot was van de
      operationele toelage, bedoeld in [artikel 14][ref3], of van de aflopende toelage, bedoeld in [artikel 15][ref4]
      of van een toelage op grond van artikel IV van het koninklijk besluit van 4 september 1968 tot wijziging van het
      Bezoldigingsreglement politie 1958 (*Stb.* 477) wordt het gedeelte van de in de eerste volzin bedoelde uitkering
      dat betrekking heeft op deze toelagen, gesteld op het bedrag dat de overleden ambtenaar in de drie kalendermaanden
      voorafgaand aan de dag van het overlijden aan zodanige toelagen is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel15
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006517
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0006517
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '15'
        hoofdstuk: '4'
  - number: '46.3'
    text: |-
      Bij ontstentenis van een weduwe of weduwnaar van wie de overledene niet duurzaam gescheiden leefde, geschiedt de
      uitkering, bedoeld in het tweede lid, ten behoeve van de minderjarige kinderen. Onder kinderen in de zin van dit
      artikel worden mede verstaan natuurlijke kinderen en kinderen waarover de overledene de pleegouderlijke zorg droeg.
      Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind als was het een
      eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46
  - number: '46.4'
    text: |-
      Ontbreken ook kinderen als bedoeld in het derde lid, dan geschiedt de uitkering, bedoeld in het tweede lid, aan
      degenen die geheel of grotendeels afhankelijk waren van de bezoldiging van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46
  - number: '46.5'
    text: |-
      Indien de overledene geen betrekkingen als bedoeld in het tweede tot en met het vierde lid nalaat, kan het daartoe
      bedoelde bedrag door het bevoegd gezag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de
      laatste ziekte en van de lijkbezorging, indien de nalatenschap van de overledene voor de betaling van die kosten
      ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46
  - number: '46.6'
    text: |-
      Op de uitkering, bedoeld in het tweede lid, wordt reeds vóór zijn overlijden aan de
      ambtenaar uitbetaalde bezoldiging over een na zijn overlijden gelegen tijdvak in mindering
      gebracht. Indien de ambtenaar voor zijn overlijden te veel vakantie heeft genoten, is
      [artikel 26, tweede lid, van het Besluit algemene rechtspositie politie][ref1], van overeenkomstige toepassing. Het
      aldus verschuldigde bedrag wordt eveneens in mindering gebracht op de uitkering, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel26
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '26'
  - number: '46.7'
    text: |-
      Op het bedrag, bedoeld in het tweede tot en met vierde lid, wordt in mindering gebracht een uitkering op grond
      van [artikel 35 van de ZW][ref1] of op grond van [artikel 74 van de WIA][ref2] en naar aard en strekking daarmee
      overeenkomende uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel74
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '74'
  - number: 46a
    text: |-
      Na het overlijden van de gewezen ambtenaar, die op de dag van zijn overlijden op grond van [artikel 39][ref1]
      in het genot was van doorbetaling van zijn laatstelijk genoten bezoldiging, wordt aan de in [artikel 46][ref2]
      bedoelde personen en met overeenkomstige toepassing van dat artikel een bedrag uitgekeerd, gelijk aan de
      bezoldiging welke de gewezen ambtenaar op de dag van zijn overlijden genoot, berekend over een tijdvak
      van drie maanden. Op deze uitkering worden in mindering gebracht het bedrag van de uitkering op grond van
      [artikel 35 van de ZW][ref3] of op grond van [artikel 74 van de WIA][ref4] en naar aard en strekking daarmee
      overeenkomende uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel74
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '39'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '46'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '74'
  - number: 46b.1
    text: |-
      Indien het overlijden van de ambtenaar is veroorzaakt door een dienstongeval of een door het verrichten van zijn
      arbeid opgelopen beroepsziekte, wordt aan degene die in verband met dit overlijden krachtens het Pensioenreglement
      van de Stichting Pensioenfonds ABP, een nabestaandenpensioen geniet, een uitkering toegekend ten bedrage van 18
      procent van het resultaat van de vermenigvuldiging van:
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46b
  - number: 46b.1.a)
    text: |-
      indien het gaat om de partner, bedoeld in artikel 7.1 van het Pensioenreglement van de Stichting Pensioenfonds ABP,
      vijf zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in artikel 6.2 van het Pensioenreglement
      van de Stichting Pensioenfonds ABP en de voor pensioen geldige diensttijd, bedoeld in hoofdstuk 5 van het
      Pensioenreglement van de Stichting Pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46b
  - number: 46b.1.b)
    text: |-
      indien het gaat om de wees, bedoeld in artikel 7.6, eerste lid, aanhef, onderdeel a, van het Pensioenreglement van
      de Stichting Pensioenfonds ABP, een zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in artikel
      6.2 van het Pensioenreglement van de Stichting Pensioenfonds ABP, en de voor pensioen geldige diensttijd, bedoeld
      in hoofdstuk 5 van het Pensioenreglement van de Stichting Pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46b
  - number: 46b.1.c)
    text: |-
      indien het gaat om de wees, bedoeld in artikel 7.7, eerste lid, aanhef, onderdeel b, van het Pensioenreglement van
      de Stichting Pensioenfonds ABP, twee zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in artikel
      6.2 van het Pensioenreglement van de Stichting Pensioenfonds ABP, en de voor pensioen geldige diensttijd, bedoeld
      in hoofdstuk 5 van het Pensioenreglement van de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46b
  - number: 46b.2
    text: |-
      De uitkering eindigt met ingang van de dag waarop de overledene de AOW-gerechtigde leeftijd zou hebben bereikt, dan
      wel, indien de partner, bedoeld in artikel 7.1 van het Pensioenreglement van de Stichting Pensioenfonds ABP, aan
      wie een pensioen werd toegekend, hertrouwt, met ingang van de maand volgende op de datum van het hertrouwen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46b
  - number: 46b.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de gewezen ambtenaar ten aanzien van wie
      [artikel 38, zesde lid][ref1], toepassing heeft gevonden, indien zijn overlijden het rechtstreeks gevolg is van de
      arbeidsongeschiktheid, bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel38
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '38'
        hoofdstuk: '10'
  - number: 46c.1
    text: |-
      Aan de ambtenaar of zijn nagelaten betrekking kan een tegemoetkoming worden verleend in de premie voor een
      ziektekostenverzekering volgens door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46c
  - number: 46c.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de gewezen ambtenaar, jonger dan de AOW-gerechtigde leeftijd,
      of zijn nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel46c
  - number: '47.1'
    text: |-
      Bij vermissing van de ambtenaar zijn, behoudens het tweede lid, de bepalingen van [artikel 46][ref1] van
      overeenkomstige toepassing. De ambtenaar wordt daarbij geacht te zijn overleden op een door het bevoegd gezag te
      bepalen dag.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel46
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '46'
        hoofdstuk: '11'
  - number: '47.2'
    text: |-
      Het [ tweede lid van artikel 46][ref1] is niet van toepassing indien gegronde vermoedens bestaan, dat de vermissing
      het gevolg is van ongeoorloofde afwezigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel46
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '46'
        hoofdstuk: '11'
  - number: '47.3'
    text: |-
      Indien blijkt, dat de als vermist beschouwde ambtenaar in leven is, kan ter beoordeling van het bevoegd gezag
      de bezoldiging worden uitbetaald, tenzij gegronde vermoedens bestaan, dat de vermissing het gevolg was van
      ongeoorloofde afwezigheid.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel47
  - number: '47.4'
    text: |-
      Indien uit hoofde van de vermissing van de ambtenaar pensioen of enige andere uitkering, voortvloeiende uit zijn
      ambtelijke rechtspositie, is toegekend over het tijdvak, waarover naar het oordeel van het bevoegd gezag geen
      aanspraak bestaat op bezoldiging, wordt die bezoldiging verminderd met de over dat tijdvak aldus uitbetaalde
      bedragen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel47
  - number: '47.5'
    text: |-
      De bezoldiging waarop de ambtenaar ingevolge het derde en vierde lid aanspraak heeft, kan aan anderen dan de
      ambtenaar worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel47
  - number: '48'
    text: |-
      Voor gevallen, waarin dit besluit niet of niet naar billijkheid voorziet, wordt door Onze Minister een bijzondere
      regeling getroffen.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel48
  - number: 48a
    text: |-
      Voor aanvragen om de werkzaamheden en functie met elkaar in overeenstemming te brengen, verzonden uiterlijk 23 mei
      2011, waarop nog geen onherroepelijke beslissing is genomen, blijven [artikel 1, eerste lid, onderdeel r][ref1].
      en [artikel 6, negende lid][ref2], van het Besluit bezoldiging politie, zoals die golden op de dag voor
      inwerkingtreding van dit artikel, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel6
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
  - number: 48b
    text: |-
      Voor aanvragen over de heroverweging van de waardering van de functie waarop nog geen onherroepelijke beslissing
      is genomen, blijven [artikel 1, eerste lid, onderdeel r][ref1]. en [artikel 7, eerste lid][ref2], van het Besluit
      bezoldiging politie, zoals die golden op de dag voor inwerkingtreding van dit artikel, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel7
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '7'
        hoofdstuk: '2'
  - number: '49.1'
    text: |-
      Een ambtenaar die op grond van [afdeling 1, hoofdstuk 2, artikel 1, van de Invoeringswet Politiewet 1993][ref1]
      naar een politieregio dan wel het Korps landelijke politiediensten is overgegaan en die op de dag
      voorafgaande aan de datum van inwerkingtreding van de [Politiewet 1993][ref2] aanspraken had op grond van
      het Bezoldigingsreglement politie 1958 en op grond van artikel VII van het Besluit van 24 juni 1992, houdende
      wijziging van het Ambtenarenreglement voor de rijkspolitie 1975, het Ambtenarenreglement voor de gemeentepolitie
      1958, het Bezoldigingsreglement politie 1958, het [Besluit geneeskundige verzorging politie][ref3] 1984 en
      het [Besluit overleg en medezeggenschap politie][ref4] in verband met het tot stand brengen van een eenvormige
      rechtspositie voor alle politieambtenaren behoudt deze aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0006300#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006299
      [ref3]: https://wetten.overheid.nl/BWBR0006605
      [ref4]: https://wetten.overheid.nl/BWBR0006518
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006300
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006299
      - id: ref3
        bwb_id: BWBR0006605
      - id: ref4
        bwb_id: BWBR0006518
  - number: '49.2'
    text: |-
      Een ambtenaar, werkzaam bij het LSOP, die op de dag voorafgaande aan de datum van inwerkingtreding van de
      [LSOP-wet][ref1] aanspraken had op grond van het Bezoldigingsbesluit LSOP, behoudt deze aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0006942
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006942
  - number: '49.3'
    text: |-
      Indien aan een ambtenaar, werkzaam bij het LSOP, op de dag voorafgaande aan de datum van inwerkingtreding van
      de [LSOP-wet][ref1] een salaris was toegekend dat voorkwam in één van de salarisschalen opgenomen in een van de
      bijlagen van het Bezoldigingsbesluit LSOP, vindt inschaling plaats in een salarisschaal van bijlage 1 van dit
      besluit waarvan het maximumsalaris gelijk is aan dan wel gelegen is onmiddellijk onder het maximumsalaris van
      de salarisschaal volgens welke de ambtenaar werd bezoldigd voor de inwerkingtreding van de [LSOP-wet][ref2]. Het
      salaris dat aan de ambtenaar wordt toegekend is gelijk aan dan wel gelegen onmiddellijk onder het salaris dat hem
      was toegekend voor de inwerkingtreding van de [LSOP-wet][ref3]. Indien aan de ambtenaar een salaris wordt toegekend
      dat is gelegen onmiddellijk onder het salaris dat hij ontving voor de inwerkingtreding van de [LSOP-wet][ref4],
      heeft hij tot het moment dat hij in een hogere salarisschaal wordt geplaatst, aanspraak op het verschil tussen
      bedoelde salarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0006942
      [ref2]: https://wetten.overheid.nl/BWBR0006942
      [ref3]: https://wetten.overheid.nl/BWBR0006942
      [ref4]: https://wetten.overheid.nl/BWBR0006942
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006942
      - id: ref2
        bwb_id: BWBR0006942
      - id: ref3
        bwb_id: BWBR0006942
      - id: ref4
        bwb_id: BWBR0006942
  - number: 49a.1
    text: |-
      Op de ambtenaar die recht heeft op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], blijven de bepalingen uit het Besluit bezoldiging politie
      waarin sprake is van de Wet op de arbeidsongeschiktheidsverzekering van toepassing, zoals deze luidden op 28
      december 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 49a.2
    text: |-
      Op de ambtenaar die op 31 december 2006 recht had op een herplaatsingstoelage of een invaliditeitspensioen,
      blijven de bepalingen uit het Besluit bezoldiging politie waarin sprake is van de herplaatsingstoelage of het
      invaliditeitspensioen van toepassing, zoals deze luidden op 31 december 2006.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49a
  - number: 49a.3
    text: |-
      Bij de toepassing van de voorgaande leden wordt in de daarin bedoelde bepalingen in plaats van «de leeftijd van 65
      jaar» telkens gelezen: de AOW-gerechtigde leeftijd.
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49a
  - number: 49b.1
    text: |-
      Voor degene die op 30 juni 2007 met toepassing van [artikel 4a van het Besluit algemene rechtspositie politie][ref1]
      is aangesteld in tijdelijke dienst, blijft artikel 6a, zoals luidend op 30 juni 2007, van toepassing tot en met het
      tijdstip waarop hij hernieuwd in vaste dienst wordt aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 4a
  - number: 49b.2
    text: |-
      Voor degene die op 30 juni 2007 vanwege een verplaatsing aanspraak heeft op een vergoeding als bedoeld in
      [artikel 30a][ref1], blijft dat artikel, zoals luidend op 30 juni 2007, van toepassing voor de duur van die
      verplaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel30a
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 30a
        hoofdstuk: '9'
  - number: 49b.3
    text: |-
      Voor degene die op 30 juni 2007 is gedetacheerd en een functie uitoefent waaraan op grond van [artikel 6][ref1] een
      hogere salarisschaal is verbonden, blijven de [artikelen 4][ref2], 6 en [17b][ref3], zoals luidend op 30 juni 2007,
      van toepassing voor de duur van die detachering.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel17b
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '4'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: 17b
        hoofdstuk: '5'
  - number: 49b.4
    text: |-
      Degene die in de periode van 1 juli 2007 tot 1 januari 2008 op grond van [artikel 4a][ref1], zoals dat gold
      op 30 juni 2007, tijdelijk is aangesteld of op grond van artikel 62 is gedetacheerd ter vervulling van een
      hoger gewaardeerde functie dan de salarisschaal waarin hij bezoldigd is en deze functie langer dan twee jaar na
      aanstellen of detachering onafgebroken heeft bekleed, heeft recht op behoud van die hogere salarisschaal, bij
      beëindiging van de tijdelijke aanstelling of detachering.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 4a
        hoofdstuk: '1'
  - number: 49d
    text: |-
      De ambtenaar die opleidingsniveau 4 succesvol heeft afgerond, wordt uiterlijk per 1 augustus 2011 aangesteld in een
      functie waaraan ten minste salarisschaal 7 van [bijlage I][ref1] van dit besluit is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49d
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 49e
    text: |-
      Van de ambtenaar die voor 1 maart 2010 een salaris genoot met toepassing van [bijlage I][ref1], zoals deze luidde
      voor die datum, wordt het salaris op 1 maart 2010 vastgesteld in de schaal met hetzelfde nummer van de bij dit
      besluit behorende bijlage I als de schaal uit bijlage I die voor 1 maart 2010 van toepassing was, in de periodiek
      met het bedrag dat overeenkomt met het oude salaris, dan wel bij gebreke daarvan, met het salarisbedrag dat
      onmiddellijk boven het bedrag van het oude salaris ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 49f.1
    text: |-
      Voor de ambtenaar ontstaat aanspraak op de salarisschaal, toelagen, vergoedingen en uitkeringen behorende bij de
      functie die hem naar aanleiding van de invoering van het LFNP is toegekend, vanaf het moment van het bekendmaken
      van het besluit genomen op grond van de regels gesteld op grond van [artikel 6, tweede lid, tweede volzin][ref1],
      zoals die luidde op de dag voor de inwerkingtreding van dit artikel, strekkende tot toekenning van een functie die
      is opgenomen in het LFNP aan de ambtenaar. Deze aanspraak werkt terug tot en met het moment waarop de ambtenaar
      deze functie is toegekend, doch uiterlijk tot en met 1 januari 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49f
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
  - number: 49f.2
    text: |-
      Indien aan de functie, bedoeld in het eerste lid, een lagere salarisschaal is verbonden dan voor de ambtenaar gold
      voor toekenning van deze functie, behoudt hij zijn oude salarisschaal en salarisnummer, inclusief de verhoging tot
      naasthogere bedragen in deze schaal, bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel9
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49f
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '9'
        hoofdstuk: '2'
  - number: 49f.3
    text: |-
      Indien aan de functie, waarnaar de ambtenaar is overgegaan naar aanleiding van de invoering van het LFNP,
      geen recht is verbonden op een toelage, vergoeding of uitkering die verbonden was aan de functie van voor
      de invoering van het LFNP, heeft de ambtenaar aanspraak op de toelage, vergoeding en uitkering behorende bij
      de functie die hij vervulde voor de invoering van het LFNP tot op de dag dat het samenstel van werkzaamheden
      wijzigt naar aanleiding van de plaatsing in de in het eerste lid bedoelde functie dan wel naar aanleiding van de
      aanwijzing als herplaatsingskandidaat in het kader van de reorganisatie [Politiewet 2012][ref1] als bedoeld in
      [artikel 55ia van het Besluit algemene rechtspositie politie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel55ia
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49f
    references:
      - id: ref1
        bwb_id: BWBR0031788
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 55ia
  - number: 49f.4
    text: |-
      Het derde lid is van overeenkomstige toepassing op de reorganisatie in verband
      met de inbedding van de Politieacademie in het nieuwe politiebestel, bedoeld in
      [artikel 55ib van het Besluit algemene rechtspositie politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55ib
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel49f
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55ib
  - number: '50.1'
    text: |-
      De [artikelen 6 tot en met 10][ref1], [14 tot en met 17][ref2], [18][ref3], [20][ref4], [27 tot en met 30][ref5]
      zijn niet van toepassing op de aspirant met dien verstande dat de artikelen [14][ref6], 18, [27][ref7],
      [27a][ref8], [27b][ref9] en [28][ref10] wel van toepassing zijn op de aspirant gedurende de beroepspraktijkvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0006517#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref7]: https://wetten.overheid.nl/BWBR0006517#Artikel27
      [ref8]: https://wetten.overheid.nl/BWBR0006517#Artikel27a
      [ref9]: https://wetten.overheid.nl/BWBR0006517#Artikel27b
      [ref10]: https://wetten.overheid.nl/BWBR0006517#Artikel28
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '18'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '20'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
      - id: ref6
        bwb_id: BWBR0006517
        artikel: '14'
        hoofdstuk: '4'
      - id: ref7
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
      - id: ref8
        bwb_id: BWBR0006517
        artikel: 27a
        hoofdstuk: '8'
      - id: ref9
        bwb_id: BWBR0006517
        artikel: 27b
        hoofdstuk: '8'
      - id: ref10
        bwb_id: BWBR0006517
        artikel: '28'
        hoofdstuk: '8'
  - number: '50.2'
    text: |-
      De [artikelen 6 tot en met 30][ref1] zijn niet van toepassing op de vakantiewerker.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
  - number: 50a
    text: |-
      De bijlagen, behorende bij dit besluit, alsmede de bedragen, genoemd in de [artikelen 3a][ref1], [14][ref2],
      [18][ref3], [23][ref4], [25b][ref5], [27][ref6] en [29][ref7] kunnen bij ministeriële regeling worden gewijzigd,
      met dien verstande dat met uitzondering van de bedragen, genoemd in de artikelen 14, 18 en 27, deze bijlagen en
      bedragen slechts worden aangepast overeenkomstig een algemene salarismaatregel in de sector politie.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0006517#Artikel25b
      [ref6]: https://wetten.overheid.nl/BWBR0006517#Artikel27
      [ref7]: https://wetten.overheid.nl/BWBR0006517#Artikel29
    url: https://wetten.overheid.nl/BWBR0006517/2017-11-29#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 3a
        hoofdstuk: '1'
